        bwb_id: BWBR0004541
        artikel: '31'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0004541
        artikel: '26'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0004541
        artikel: '34'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0004541
        artikel: '35'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref8
        bwb_id: BWBR0004541
        artikel: '36'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref9
        bwb_id: BWBR0004541
        artikel: 46a
        hoofdstuk: '2'
  - number: '38.1'
    text: |-
      Ter inschrijving van de instelling van een rechtsvordering of de indiening van een verzoekschrift ter verkrijging
      van een rechterlijke uitspraak die de rechtstoestand van een registergoed betreft, wordt aangeboden:
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel38
  - number: 38.1.a
    text: |-
      in geval van instelling van de rechtsvordering door een dagvaarding: een door de deurwaarder of een advocaat
      getekend afschrift daarvan;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel38
  - number: 38.1.b
    text: |-
      in geval van instelling van de rechtsvordering door een ander stuk: een afschrift daarvan getekend door een
      advocaat of door de griffier van het gerecht waar de zaak aanhangig is;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel38
  - number: 38.1.c
    text: |-
      in geval van een verzoekschrift: een afschrift daarvan met aantekening van de dag waarop het verzoekschrift is
      ingekomen ter griffie, getekend door een advocaat of door de griffier van het gerecht waar het verzoekschrift is
      ingediend.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel38
  - number: '38.2'
    text: |-
      [Artikel 18, tweede-vijfde lid][ref1], is niet van toepassing, behoudens dat het aangeboden stuk in elk geval
      de naam en een ter zake van het geding gekozen woonplaats met adres van degene te wiens behoeve de aanbieding
      geschiedt, moet bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel18
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '39.1'
    text: |-
      Ter inschrijving van de instelling van een rechtsmiddel tegen een rechterlijke uitspraak, als bedoeld in
      [artikel 38][ref1], wordt aangeboden:


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel38
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '38'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 39.1.a
    text: |-
      ingeval het rechtsmiddel wordt ingesteld bij dagvaarding: een door de deurwaarder of een advocaat getekend
      afschrift daarvan;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel39
  - number: 39.1.b
    text: |-
      ingeval het rechtsmiddel wordt ingesteld bij verzoekschrift: een afschrift daarvan met aantekening van de dag
      waarop het verzoekschrift is ingekomen ter griffie, getekend door een advocaat of de griffier van het gerecht waar
      het verzoekschrift is ingediend;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel39
  - number: 39.1.c
    text: |-
      ingeval het rechtsmiddel wordt ingesteld bij een ander stuk: een afschrift daarvan, getekend door een advocaat of
      de griffier van het gerecht dat op het aangewende rechtsmiddel beslist.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel39
  - number: '39.2'
    text: |-
      [Artikel 18, tweede-vijfde lid][ref1], is niet van toepassing, behoudens dat het aangeboden stuk in elk geval de
      naam en een ter zake van het geding gekozen woonplaats met adres van degene te wiens behoeve de aanbieding geschied
      moet bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel18
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '40'
    text: |-
      Ter inschrijving van de waardeloosheid van een overeenkomstig [artikel 38][ref1] of [artikel 39][ref2] verkregen
      inschrijving, kan ook worden aangeboden


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel39
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '38'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '39'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 40.a
    text: |-
      een daartoe strekkende verklaring, afgegeven door een deurwaarder of advocaat die optreedt voor de eiser, de
      verzoeker of degene die het rechtsmiddel heeft ingesteld;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel40
  - number: 40.b
    text: een rechterlijke uitspraak die ertoe strekt dat een zodanige inschrijving waardeloos is.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel40
  - number: '41.1'
    text: |-
      Ter inschrijving van een feit dat is opgenomen in een stuk gesteld in een vreemde of de Friese taal, wordt naast
      dat ter inschrijving aangeboden stuk een letterlijke vertaling in het Nederlands ter inschrijving aangeboden,
      vervaardigd en voor overeenstemmend verklaard door een voor die taal als bevoegd toegelaten beëdigd vertaler,
      of, indien het een in te schrijven notariële akte in de Friese taal betreft, door de notaris voor wie de akte is
      verleden.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel41
  - number: '41.2'
    text: |-
      Het bepaalde in het eerste lid lijdt uitzondering ingeval met betrekking tot luchtvaartuigen een proces-verbaal
      van inbeslagneming, opgemaakt in het buitenland door een deurwaarder of door een andere volgens de daar geldende
      wet daartoe bevoegde persoon en gesteld in een vreemde taal, aan de bewaarder wordt toegezonden of bij deze wordt
      ingeleverd. Alsdan wordt door de zorg van de bewaarder zo spoedig mogelijk een vertaling van een zodanig proces-
      verbaal vervaardigd door een in Nederland toegelaten beëdigd vertaler.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel41
  - number: '41.3'
    text: |-
      De vertalingen worden ingeschreven in plaats van de in de vreemde of Friese taal gestelde stukken, die onder de
      bewaarder blijven berusten.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel41
  - number: '42.1'
    text: |-
      Op de inschrijving van stukken tot verbetering van onjuistheden en onvolledigheden in ingeschreven stukken, zijn de
      bepalingen, gegeven bij of krachtens dit hoofdstuk, van overeenkomstige toepassing, onverminderd het tweede lid.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel42
  - number: '42.2'
    text: |-
      Ter verbetering van een onjuistheid en onvolledigheid bestaand uit een kennelijke schrijffout en
      een kennelijke misslag in de tekst van een ingeschreven notariële akte of notariële verklaring,
      als bedoeld in de [artikelen 26][ref1], [27, eerste lid][ref2], [30][ref3], [34][ref4], [35][ref5],
      [36][ref6] en [46a][ref7], kan ook worden ingeschreven een proces-verbaal als bedoeld in
      [artikel 45, tweede lid, tweede zin, van de Wet op het notarisambt][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0004541#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0004541#Artikel35
      [ref6]: https://wetten.overheid.nl/BWBR0004541#Artikel36
      [ref7]: https://wetten.overheid.nl/BWBR0004541#Artikel46a
      [ref8]: https://wetten.overheid.nl/BWBR0010388#Artikel45
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '26'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '27'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '30'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0004541
        artikel: '34'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0004541
        artikel: '35'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0004541
        artikel: '36'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0004541
        artikel: 46a
        hoofdstuk: '2'
      - id: ref8
        bwb_id: BWBR0010388
        artikel: '45'
  - number: '43'
    text: |-
      Indien het ter inschrijving aangeboden stuk waarin het in te schrijven feit is opgenomen, niet voldoet aan de
      vereisten, gesteld in de [artikelen 18-42][ref1], kan het met ontbrekende gegevens worden aangevuld door een
      verklaring aan de voet van het stuk, ondertekend door degene die bevoegd is tot het opmaken en ondertekenen van een
      zodanig stuk, een en ander voor zover de aard van het stuk zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel18
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '44.1'
    text: |-
      Stukken die voor bewijs bij de aanbieding van een stuk worden overgelegd, worden slechts mede ingeschreven, indien
      de wet dit eist of de aanbieder dit verlangt, tenzij bij wet is bepaald dat de desbetreffende stukken niet worden
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel44
  - number: '44.2'
    text: |-
      Onverminderd [artikel 17, tweede lid][ref1], maakt de bewaarder, overeenkomstig door het bestuur van de Dienst te
      stellen regels, melding van de overlegging van stukken:


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel17
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '17'
        hoofdstuk: '2'
        afdeling: '4'
  - number: 44.2.a
    text: |-
      voorzover die in papieren vorm ter inschrijving zijn aangeboden: op het ter inschrijving aangeboden stuk en op het
      afschrift van dat stuk, en
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel44
  - number: 44.2.b
    text: |-
      voorzover die in elektronische vorm ter inschrijving zijn aangeboden: in het desbetreffende elektronisch gedeelte
      van de openbare registers bij dat stuk.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel44
  - number: '44.3'
    text: |-
      Stukken die worden overgelegd maar waarvan de inschrijving niet wordt voorgeschreven of verlangd,
      worden onverwijld aan de aanbieder teruggegeven. De eerste zin is niet van toepassing indien
      [artikel 11b, vijfde lid, derde zin][ref1], toepassing heeft gevonden en het stuk in elektronische vorm is
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11b
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 11b
        hoofdstuk: '2'
        afdeling: '3'
  - number: '45.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de vereisten waaraan stukken dienen te
      voldoen die worden aangeboden ter inschrijving van andere inschrijfbare feiten dan die waarop de artikelen 24-40
      betrekking hebben, voor zover dit niet reeds in deze dan wel bij of krachtens een andere wet is geschied.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel45
  - number: '45.2'
    text: |-
      Voor zover bij de in het eerste lid bedoelde maatregel niet anders is bepaald, wordt ter inschrijving van
      een beschikking of van een uitspraak waarbij een beschikking werd vernietigd, ingetrokken of gewijzigd, een
      afschrift van die beschikking onderscheidenlijk van die uitspraak aangeboden, afgegeven door het bestuursorgaan
      onderscheidenlijk het rechterlijk orgaan dat de beschikking of de uitspraak gaf.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel45
  - number: '46.1'
    text: |-
      Naast feiten die voor de rechtstoestand van registergoederen van belang zijn, kunnen in de openbare registers
      tevens algemene voorwaarden, modelreglementen en andere stukken, die niet op een bepaald registergoed betrekking
      hebben, worden ingeschreven, met het uitsluitend doel dat daarnaar in later ter inschrijving aangeboden stukken
      kan worden verwezen. De [artikelen 18][ref1], [19][ref2], [20, eerste lid, eerste zin][ref3], [22][ref4] en
      [30 van Boek 3 van het Burgerlijk Wetboek][ref5] en [117, eerste en tweede lid][ref6] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0005291#Artikel30
      [ref6]: https://wetten.overheid.nl/BWBR0004541#Artikel117
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '20'
      - id: ref4
        bwb_id: BWBR0005291
        artikel: '22'
      - id: ref5
        bwb_id: BWBR0005291
        artikel: '30'
      - id: ref6
        bwb_id: BWBR0004541
        artikel: '117'
        hoofdstuk: '9'
  - number: '46.2'
    text: |-
      Ter inschrijving van een stuk als bedoeld in het eerste lid wordt naast dat stuk aangeboden, indien het in papieren
      vorm ter inschrijving wordt aangeboden, een afschrift van dat stuk voorzien van een verklaring van eensluidendheid.
      [Artikel 11, tweede tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '46.3'
    text: |-
      Ter inschrijving van een stuk als bedoeld in het eerste lid is, indien het in elektronische vorm ter inschrijving
      wordt aangeboden, vereist een afschrift van dat stuk als bedoeld in [artikel 11b, eerste lid][ref1]. De
      [artikelen 11, tweede lid][ref2], en [11b, tweede tot en met negende lid][ref3], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11b
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel11b
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 11b
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: 11b
        hoofdstuk: '2'
        afdeling: '3'
  - number: '46.4'
    text: |-
      De [artikelen 18 tot en met 23][ref1] zijn niet van toepassing. Bij algemene maatregel van bestuur kunnen regels
      worden gesteld waaraan ter inschrijving aangeboden stukken als bedoeld in het eerste lid, voldoen. Bij regeling
      van Onze Minister worden regels gesteld met betrekking tot de wijze waarop de verwijzing in de latere stukken
      geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel18
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '46.5'
    text: |-
      Een verwijzing als bedoeld in het vierde lid heeft tot gevolg dat het stuk waarnaar in een ter inschrijving
      aangeboden stuk wordt verwezen, deel uitmaakt van de inschrijving die op grond van het aangeboden stuk plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel46
  - number: 46a.1
    text: |-
      Ter voorkoming van een onjuiste of onvolledige bijhouding als bedoeld in de
      [artikelen 54, eerste lid, onderdeel a][ref1], [78, eerste lid][ref2], [87, eerste lid, onderdeel a][ref3],
      en [94, eerste lid, onderdeel a][ref4], kan met betrekking tot bij regeling van Onze Minister vast te stellen
      gevallen een door een notaris opgemaakte bijhoudingsverklaring worden ingeschreven, inhoudende dat naar zijn
      verklaring hem gebleken is dat in een eerder ingeschreven, door hem verleden notariële akte voor een juiste en
      volledige bijhouding van dat stuk kennelijk benodigde gegevens ontbreken en dat die gegevens uitsluitend ten
      behoeve van een juiste en volledige bijhouding van dat stuk in die verklaring worden vermeld. De inschrijving van
      een bijhoudingsverklaring kan slechts plaatsvinden indien die verklaring ter inschrijving wordt aangeboden voor de
      afloop van een periode van tien dagen die aanvangt met de eerste dag volgend op die waarop het desbetreffende stuk
      is ingeschreven, waarbij niet meegerekend worden de dagen waarop de kantoren van de Dienst niet voor het publiek
      zijn opengesteld voor het aanbieden van stukken ter inschrijving in de openbare registers.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel87
      [ref4]: https://wetten.overheid.nl/BWBR0004541#Artikel94
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '54'
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '78'
        hoofdstuk: '4'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '87'
        hoofdstuk: '5'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0004541
        artikel: '94'
        hoofdstuk: '6'
        afdeling: '1'
  - number: 46a.2
    text: |-
      Ter inschrijving van een bijhoudingsverklaring als bedoeld in het eerste lid wordt aangeboden, indien dit
      in papieren vorm geschiedt, die verklaring of een authentiek afschrift daarvan, en een afschrift van die
      verklaring, onderscheidenlijk van dat authentieke afschrift, voorzien van een verklaring van eensluidendheid.
      [Artikel 11, tweede tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 46a.3
    text: |-
      Ter inschrijving van een bijhoudingsverklaring als bedoeld in het eerste lid is, indien het
      in elektronische vorm ter inschrijving wordt aangeboden, vereist een afschrift van dat stuk
      als bedoeld in [artikel 11b, eerste lid][ref1]. De [artikelen 11, tweede lid][ref2], en
      [11b, tweede tot en met vijfde lid, tweede zin, zesde, zevende en negende lid][ref3], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11b
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel11b
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 11b
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: 11b
        hoofdstuk: '2'
        afdeling: '3'
  - number: 46a.4
    text: |-
      De [artikelen 18][ref1] en [20 tot en met 23][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel20
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '20'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '47.1'
    text: |-
      Een verandering van een in een ingeschreven stuk gekozen woonplaats, een alsnog ter zake van een inschrijving
      gedane keuze van woonplaats en de opheffing van een gekozen woonplaats kunnen worden ingeschreven. Ter inschrijving
      van de verandering, keuze of opheffing wordt een door of namens de belanghebbende ondertekende verklaring
      aangeboden die de nieuwe en de vorige gekozen dan wel wettelijke woonplaats vermeldt, alsmede de datum van ingang.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel47
  - number: '47.2'
    text: |-
      Een krachtens [artikel 18, vierde lid][ref1], van deze wet of de [artikelen 260, eerste lid, van Boek 3][ref2] of
      [252, tweede lid, van Boek 6 van het Burgerlijk Wetboek][ref3] gekozen woonplaats, heeft, ongeacht of zij met het
      oorspronkelijke stuk dan wel krachtens het eerste lid is ingeschreven, geen ander gevolg dan dat


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel260
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel252
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '260'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '252'
  - number: 47.2.a
    text: daar exploiten kunnen worden uitgebracht die de inschrijving betreffen, ter zake waarvan woonplaats werd gekozen;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel47
  - number: 47.2.b
    text: |-
      daar de door of krachtens de wet voorgeschreven mededelingen en kennisgevingen van de bewaarder en de Dienst kunnen
      worden gedaan.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel47
  - number: '47.3'
    text: |-
      Door of krachtens deze wet voorgeschreven mededelingen en kennisgevingen worden in elk geval gedaan aan de laatste
      bij de Dienst bekende woonplaats van de belanghebbende. In geval van overlijden van een persoon die tot een
      registergoed gerechtigd was, worden zodanige mededelingen en kennisgevingen aan zijn rechtsopvolgers gedaan aan het
      laatste bij de Dienst bekende adres van de boedel.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel47
  - number: '48.1'
    text: 'De basisregistratie kadaster ontsluit de openbare registers door middel van:'
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
  - number: 48.1.a
    text: de kadastrale aanduiding van een onroerende zaak en van een appartementsrecht, en
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
  - number: 48.1.b
    text: |-
      de naam van de eigenaar van, of beperkt gerechtigde met betrekking tot een onroerende zaak, met uitzondering van de
      rechthebbende op een erfdienstbaarheid.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
  - number: '48.2'
    text: 'De basisregistratie kadaster bevat:'
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
  - number: 48.2.a
    text: de kadastrale aanduiding van onroerende zaken en van appartementsrechten;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
  - number: 48.2.b
    text: |-
      naam, voornamen, adres, geboortedatum en burgerlijke staat van de eigenaar van, beperkt gerechtigde met
      betrekking tot, of beslaglegger op, een onroerende zaak of, ingeval die e igenaar, gerechtigde of beslaglegger een
      rechtspersoon is, de rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
  - number: 48.2.c
    text: |-
      de wettelijke benaming van de beperkte rechten waaraan een onroerende zaak is onderworpen, en van de beslagen
      die op die zaak of dat beperkte recht zijn gelegd, als ook, of die zaak of dat beperkte recht onder bewind staat
      of ten aanzien daarvan een beding als bedoeld in [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref1] is
      ingeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel252
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '252'
  - number: 48.2.d
    text: de kadastrale grootte van een perceel;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
  - number: 48.2.e
    text: |-
      de gegevens met betrekking tot beperkingenbesluiten, alsmede daarop betrekking hebbende beslissingen in
      administratief beroep, rechterlijke uitspraken en verklaringen met betrekking tot het vervallen van een
      publiekrechtelijke beperking, die krachtens de Wet kenbaarheid publiekrechtelijke beperkingen onroerende zaken in
      de openbare registers zijn ingeschreven;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
  - number: 48.2.f
    text: |-
      gegevens die krachtens een andere wet dan die genoemd in onderdeel e aan de Dienst ter inschrijving in de openbare
      registers, respectievelijk ter opneming in de basisregistratie kadaster, worden aangeboden;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
  - number: 48.2.g
    text: |-
      ten aanzien van een eigenaar en beperkt gerechtigde als bedoeld in onderdeel b: een verwijzing naar alle in de
      openbare registers ingeschreven of geboekte stukken, voorzover die stukken betreffen onroerende zaken en rechten
      waaraan die zaken zijn onderworpen;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
  - number: 48.2.h
    text: |-
      ten aanzien van een onroerende zaak en een appartementsrecht: een verwijzing naar alle daarop betrekking hebbende,
      in de openbare registers ingeschreven of geboekte stukken, alsmede naar door de Dienst verkregen inlichtingen of
      verrichte waarnemingen als bedoeld in [artikel 54, eerste lid, onderdelen c en d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel54
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '54'
        hoofdstuk: '4'
        afdeling: '1'
  - number: 48.2.i
    text: |-
      voorzover op een onroerende zaak een recht van hypotheek rust, het bedrag waarvoor de hypotheek is gevestigd, of
      indien dit bedrag nog niet vaststaat, het maximumbedrag dat uit hoofde van een hypotheek op het goed kan worden
      verhaald, en voorzover bekend, de rentevoet;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
  - number: 48.2.j
    text: |-
      feitelijke gegevens met betrekking tot een onroerende zaak, een beperkt recht met betrekking tot die zaak of een
      appartementsrecht, voorzover die een nadere omschrijving, een beperking, een begunstiging of een kenmerk bevatten,
      die voor het rechtsverkeer of de landelijke kadastrale kaart van belang zijn, of voorzover die betrekking hebben op
      het beheer, de domicilie of de beschikkingsbevoegdheid van de eigenaar van, beperkt gerechtigde met betrekking tot,
      of de beslaglegger op, een onroerende zaak, een beperkt recht of een appartementsrecht;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
  - number: 48.2.k
    text: het aandeel van een eigenaar of beperkt gerechtigde als bedoeld in onderdeel b in geval van een gemeenschap.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
  - number: '48.3'
    text: |-
      De basisregistratie kadaster bevat voorts de landelijke kadastrale kaart. Die kaart is toegankelijk door middel
      van een coördinaat in het net van coördinaatpunten, bedoeld in [artikel 52][ref1], of door middel van de kadastrale
      aanduiding van een perceel. De landelijke kadastrale kaart bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel52
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '52'
        hoofdstuk: '3'
  - number: 48.3.a
    text: |-
      de afbeelding van de kadastrale grenzen van een perceel, weergegeven in het net van coördinaatpunten, bedoeld in
      [artikel 52][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel52
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '52'
        hoofdstuk: '3'
  - number: 48.3.b
    text: de kadastrale aanduiding van een perceel;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
  - number: 48.3.c
    text: de rijksgrens en de grens van een provincie of gemeente;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
  - number: 48.3.d
    text: |-
      een voorstelling van de omtrek van een hoofd- of bijgebouw op een perceel, met dien verstande dat de omtrek van een
      bijgebouw uitsluitend wordt weergegeven indien die weergave naar het oordeel van de Dienst nodig is voor een goede
      oriëntatie op de kadastrale kaart.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
  - number: '48.4'
    text: |-
      Een gegeven als bedoeld in het tweede lid, onderdeel f, kan krachtens een andere wet dan deze wet als authentiek
      worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
  - number: '48.5'
    text: |-
      De detaillering, verbijzondering en beschrijving van gegevens als bedoeld in het tweede en derde lid, en in
      [artikel 7g, eerste, tweede en vijfde lid][ref1], vinden plaats in de door het bestuur van de Dienst vastgestelde
      catalogus basisregistratie kadaster.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel7g
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 7g
        hoofdstuk: 1a
  - number: '48.6'
    text: |-
      Het bestuur van de Dienst doet mededeling van de vaststelling of wijziging van de catalogus basisregistratie
      kadaster in de Staatscourant. Indien die mededeling geen integrale bekendmaking inhoudt van die catalogus of van
      de wijzigingen daarin, maakt de Dienst bekend waar die catalogus ter inzage ligt of op welke wijze die catalogus
      anderszins raadpleegbaar is.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
  - number: '48.7'
    text: |-
      Het tweede lid, onderdelen b, g en k, vindt ten aanzien van erfdienstbaarheden slechts toepassing, voorzover dat
      wordt bepaald bij regeling van het bestuur van de Dienst.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel48
  - number: '50'
    text: |-
      De aan de kadastrale kaart ten grondslag liggende bescheiden bevatten in elk geval de landmeetkundige gegevens van
      hetgeen op die kaart wordt weergegeven.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel50
  - number: '51.1'
    text: Het bestuur van de Dienst stelt regelen vast omtrent de inrichting van de kadastrale kaart.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel51
  - number: '51.2'
    text: |-
      Het bestuur van de Dienst stelt tevens regelen vast omtrent de vorm van de aan de kadastrale kaart ten grondslag
      liggende bescheiden.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel51
  - number: '52.1'
    text: |-
      Er is een net van coördinaatpunten waarvan de coördinaten worden vastgelegd in het stelsel van de
      Rijksdriehoeksmeting en in het stelsel van het Europese referentiesysteem voor geodesie en navigatie.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel52
  - number: '52.2'
    text: |-
      Het bestuur van de Dienst stelt regelen vast omtrent de registratie en de weergave van de in het eerste lid
      genoemde punten.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel52
  - number: '53'
    text: Bijwerking vindt plaats als bijhouding dan wel als vernieuwing.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel53
  - number: '54.1'
    text: 'Bijhouding vindt, onverminderd het bepaalde bij of krachtens deze of een andere wet, plaats op grond van:'
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel54
  - number: 54.1.a
    text: |-
      veranderingen blijkens in de openbare registers ingeschreven stukken, voorzover die betrekking hebben op onroerende
      zaken en rechten waaraan die zaken zijn onderworpen;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel54
  - number: 54.1.b
    text: |-
      een wijziging als bedoeld in [artikel 7n][ref1] of [7t][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel7n
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel7t
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 7n
        hoofdstuk: 1a
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 7t
        hoofdstuk: 1a
  - number: 54.1.c
    text: |-
      inlichtingen van een eigenaar van, of beperkt gerechtigde met betrekking tot, een onroerende zaak, of van diens
      rechtsopvolger onder algemene titel;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel54
  - number: 54.1.d
    text: |-
      waarnemingen van een met meting belaste ambtenaar omtrent een feit als bedoeld in de [artikelen 29][ref1] en
      [35 van Boek 5 van het Burgerlijk Wetboek][ref2], of omtrent de feitelijke gesteldheid van een onroerende zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel35
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '35'
  - number: '54.2'
    text: |-
      Bijhouding van de basisregistratie kadaster vindt ook plaats met betrekking tot voorlopige aantekeningen terzake
      van stukken betreffende onroerende zaken en rechten waaraan die zaken zijn onderworpen en doorhalingen daarvan in
      het register van voorlopige aantekeningen.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel54
  - number: '55'
    text: |-
      Vernieuwing vindt plaats op grond van veranderingen, voor zover deze blijken uit in de openbare registers
      ingeschreven akten van vernieuwing, als bedoeld in [artikel 77][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel77
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '77'
        hoofdstuk: '4'
        afdeling: '3'
  - number: '56'
    text: |-
      De wijze van bijwerking wordt, onverminderd het bepaalde bij of krachtens deze of een andere wet, bij of krachtens
      algemene maatregel van bestuur geregeld in dier voege:
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel56
  - number: 56.a
    text: dat na een inschrijving de bijwerking terstond aanvangt, en
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel56
  - number: 56.b
    text: |-
      dat tenminste ingeval een bijwerking leidt tot het wijzigen of aanvullen van de in de basisregistratie kadaster
      vermeld staande gegevens betreffende de eigenaars of beperkt gerechtigden, de kadastrale aanduiding dan wel
      de grootte, in de registratie wordt vermeld op grond van welk ingeschreven of ander stuk een bijwerking heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel56
  - number: 56a.1
    text: |-
      Op beschikkingen inzake de bijwerking, genomen krachtens [hoofdstuk 4][ref1] van deze wet, zijn de
      [artikelen 4:7][ref2], [4:8][ref3] en [3:40 van de Algemene wet bestuursrecht][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 56a.2
    text: |-
      Het voorstel van vernieuwing, als bedoeld in [artikel 76, tweede lid][ref1], geldt als een beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel76
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '76'
        hoofdstuk: '4'
        afdeling: '3'
  - number: 56b.1
    text: |-
      Tenzij het betreft een beschikking als bedoeld in [artikel 71][ref1], [72][ref2] of [78][ref3], eerste lid, kan een
      belanghebbende bezwaar maken tegen een beschikking inzake de bijwerking, vastgesteld krachtens [hoofdstuk 4][ref4],
      nadat die bijwerking is voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel78
      [ref4]: https://wetten.overheid.nl/BWBR0004541#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel56b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '78'
        hoofdstuk: '4'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0004541
        hoofdstuk: '4'
  - number: 56b.2
    text: |-
      Voorzover een beschikking als bedoeld in het eerste lid betrekking heeft op een gegeven dat krachtens deze wet als
      authentiek wordt aangemerkt en ten aanzien van die beschikking bezwaar wordt gemaakt of beroep wordt ingesteld,
      handelt de Dienst overeenkomstig [artikel 7r][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel7r
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel56b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 7r
        hoofdstuk: 1a
  - number: '57.1'
    text: |-
      Indien een meting noodzakelijk is ten behoeve van de bijhouding, doet de Dienst van het voornemen daartoe
      mededeling aan de personen die volgens de bij de Dienst bekende gegevens als eigenaar, beperkt gerechtigde,
      met uitzondering van evenwel de hypotheekhouders en de rechthebbenden op erfdienstbaarheden zo die er zijn, of
      anderszins bij de bijhouding belanghebbenden zijn. De mededeling houdt in elk geval in de dag en het uur waarop de
      aanwijzing die de grondslag vormt voor de meting, zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel57
  - number: '57.2'
    text: Onze Minister stelt regelen vast omtrent de wijze waarop de in het vorige lid bedoelde mededeling wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel57
  - number: '57.3'
    text: |-
      De in het eerste lid bedoelde belanghebbenden verschaffen, indien naar het oordeel van de met de meting belaste
      ambtenaar nodig door aanwijzing ter plaatse, de door deze ambtenaar voor de bijhouding benodigde inlichtingen.
      Bij of krachtens algemene maatregel van bestuur worden regelen gesteld omtrent de bijhouding voor de gevallen
      waarin één of meer belanghebbenden niet de voor de bijhouding benodigde inlichtingen of onderling tegenstrijdige
      inlichtingen verschaffen.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel57
  - number: '57.4'
    text: De ambtenaar maakt een relaas van zijn bevindingen, dat mede de door de meting verkregen gegevens bevat.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel57
  - number: '57.5'
    text: |-
      De bijhouding vindt plaats mede op grondslag van het relaas van bevindingen indien het eerste-vierde lid toepassing
      heeft gevonden.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel57
  - number: '57.6'
    text: |-
      Op vertoon van een bewijs van de in [artikel 58, eerste lid][ref1], bedoelde bekendmaking worden aan
      belanghebbenden op het desbetreffende kantoor van de Dienst kosteloos nadere inlichtingen omtrent de uitkomsten
      van de meting verschaft, indien het eerste-vierde lid toepassing heeft gevonden. Onze Minister stelt nadere regelen
      vast omtrent de wijze waarop deze inlichtingen worden verschaft.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '58.1'
    text: |-
      Ingeval de bijhouding waartoe een ingeschreven stuk aanleiding geeft, met betrekking tot een gehandhaafd
      perceel dan wel een nieuw gevormd perceel is voltooid en heeft geleid tot wijziging of aanvulling van de in de
      basisregistratie kadaster vermeld staande gegevens betreffende de eigenaars of beperkt gerechtigden, de kadastrale
      aanduiding dan wel de grootte van de onroerende zaak waarop het ingeschreven feit betrekking heeft, wordt het
      resultaat van die bijhouding aan belanghebbenden door toezending of uitreiking bekendgemaakt. Met betrekking tot
      een rechthebbende op een erfdienstbaarheid vindt het bepaalde in de eerste zin slechts toepassing, voor zover een
      regeling van het bestuur van de Dienst als bedoeld in [artikel 48, derde lid][ref1], is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel48
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '48'
        hoofdstuk: '3'
  - number: '58.2'
    text: De verzending ingevolge het eerste lid vindt op één en dezelfde dag plaats.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel58
  - number: '58.3'
    text: |-
      Indien in een geval, als bedoeld in het eerste lid, het ingeschreven stuk is een akte van toedeling, als
      bedoeld in de [artikelen 89, eerste lid, van de Reconstructiewet Midden-Delfland][ref1] ( *Stb.* 1977, 233),
      [95, eerste lid, van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref2] (*Stb.*
      1977, 694) en [207, eerste lid, van de Landinrichtingswet][ref3] (*Stb.* 1985, 299), of een ruilakte als bedoeld
      in [artikel 81, eerste lid, van de Wet inrichting landelijk gebied][ref4], of een ruilakte als bedoeld in
      [artikel 90, eerste lid, van de Reconstructiewet concentratiegebieden][ref5] vindt het bepaalde in de vorige leden
      geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel95
      [ref3]: https://wetten.overheid.nl/BWBR0003793#Artikel207
      [ref4]: https://wetten.overheid.nl/BWBR0020748#Artikel81
      [ref5]: https://wetten.overheid.nl/BWBR0013399#Artikel90
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '89'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '95'
      - id: ref3
        bwb_id: BWBR0003793
        artikel: '207'
      - id: ref4
        bwb_id: BWBR0020748
        artikel: '81'
      - id: ref5
        bwb_id: BWBR0013399
        artikel: '90'
  - number: '59.1'
    text: |-
      Blijkt de in het ingeschreven stuk voorkomende feitelijke omschrijving van de onroerende zaak waarop
      het stuk betrekking heeft, onverenigbaar met hetgeen de met de meting belaste ambtenaar overeenkomstig
      [artikel 57, derde lid][ref1], door de belanghebbenden ter plaatse is aangewezen, of is de kadastrale aanduiding
      van die zaak in dat stuk onjuist of onvolledig, dan vindt [artikel 58, eerste-derde lid][ref2], slechts toepassing
      voor zover bijhouding naar de krachtens het volgende lid vast te stellen regelen mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '59.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt geregeld in hoeverre en op welke wijze bijhouding
      plaatsvindt, indien de in het eerste lid bedoelde gevallen zich voordoen, in dier voege dat de bijhouding waartoe
      het ingeschreven stuk aanleiding geeft, eerst wordt voltooid, nadat een stuk tot verbetering, als bedoeld in
      [artikel 42][ref1], is ingeschreven in de in [artikel 8, eerste lid, onder a][ref2], bedoelde openbare registers.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '42'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '59.3'
    text: |-
      De beslissing om toepassing aan het eerste lid te geven wordt met bekwame spoed genomen. Indien het
      ingeschreven stuk is opgemaakt door een notaris, wordt de beslissing tevens aan hem medegedeeld. De
      bekendmaking van de beslissing gaat vergezeld van een verzoek een stuk tot verbetering, als bedoeld in
      [artikel 42][ref1], in te schrijven in de openbare registers, bedoeld in [artikel 8, eerste lid, onder a][ref2].
      [Artikel 58, tweede lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '42'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '59.4'
    text: |-
      Bij de bekendmaking wordt gewezen op het gevolg voor de bijhouding dat de wet aan het niet-inschrijven van een stuk
      tot verbetering, als bedoeld in [artikel 42][ref1], verbindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel42
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '42'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '59.5'
    text: |-
      Het bepaalde in de vorige leden is van overeenkomstige toepassing ingeval de kadastrale aanduiding van een
      appartementsrecht in een ingeschreven stuk onjuist of onvolledig blijkt te zijn.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel59
  - number: '66.1'
    text: |-
      Ingeval een belanghebbende, bedoeld in [artikel 54, eerste lid, onder c][ref1], meent dat zich een feit heeft
      voorgedaan, als bedoeld in [artikel 29][ref2] dan wel in [artikel 35 van Boek 5 van het Burgerlijk Wetboek][ref3],
      kan hij de Dienst verzoeken, daarnaar een onderzoek in te stellen. Binnen acht weken na ontvangst van de aanvraag
      wordt de beslissing op het verzoek genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0005288#Artikel35
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '54'
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0005288
        artikel: '35'
  - number: '66.2'
    text: |-
      In geval van toewijzing van het verzoek wordt door de Dienst van het voornemen tot het houden van een onderzoek
      ter plaatse mededeling gedaan overeenkomstig [artikel 57, eerste lid][ref1]. [Artikel 57, tweede lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel57
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '67.1'
    text: |-
      De met het onderzoek belaste ambtenaar gaat ter plaatse na of een feit, als bedoeld in [artikel 29][ref1] dan wel
      in [artikel 35 van Boek 5 van het Burgerlijk Wetboek][ref2], zich heeft voorgedaan. [Artikel 57, derde lid][ref3],
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel57
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '29'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '35'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '67.2'
    text: |-
      De ambtenaar maakt een relaas van zijn bevindingen. Indien ten behoeve van het onderzoek een meting plaatsvindt,
      worden de daardoor verkregen gegevens eveneens opgenomen in het relaas van bevindingen.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel67
  - number: '68.1'
    text: |-
      Indien het onderzoek ter plaatse aanleiding geeft tot bijhouding, vindt deze plaats op grondslag van het relaas van
      bevindingen. [Artikel 58, eerste en tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '68.2'
    text: |-
      Indien het onderzoek ter plaatse geen aanleiding geeft tot bijhouding, wordt daarvan mededeling gedaan aan de
      verzoeker en de overige bij de bijhouding belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel68
  - number: '70.1'
    text: |-
      De Dienst is bevoegd, ook zonder een verzoek, als bedoeld in [artikel 66, eerste lid][ref1], een onderzoek,
      als bedoeld in [artikel 67, eerste lid][ref2], in te stellen indien er redenen zijn om aan te nemen dat
      zich met betrekking tot onroerende zaken feiten hebben voorgedaan, als bedoeld in de [artikelen 29][ref3] en
      [35 van Boek 5 van het Burgerlijk Wetboek][ref4]. Van het voornemen tot een onderzoek wordt door de Dienst
      mededeling gedaan overeenkomstig [artikel 57, eerste lid][ref5]. De [artikelen 57, tweede en derde lid][ref6], en
      [67, tweede lid][ref7], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0005288#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0005288#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0004541#Artikel57
      [ref6]: https://wetten.overheid.nl/BWBR0004541#Artikel57
      [ref7]: https://wetten.overheid.nl/BWBR0004541#Artikel67
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '67'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005288
        artikel: '29'
      - id: ref4
        bwb_id: BWBR0005288
        artikel: '35'
      - id: ref5
        bwb_id: BWBR0004541
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0004541
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0004541
        artikel: '67'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: '70.2'
    text: |-
      Indien de Dienst gebruik heeft gemaakt van de in het vorige lid bedoelde bevoegdheid en het onderzoek ter plaatse
      aanleiding heeft gegeven tot bijhouding, vindt bijhouding plaats op grondslag van het relaas van bevindingen.
      [Artikel 58, eerste en tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '70.3'
    text: |-
      Ingeval het onderzoek geen aanleiding geeft tot bijhouding is [artikel 68, tweede lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel68
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '68'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: '71'
    text: |-
      De wijze van bijhouding op grond van inlichtingen of waarnemingen omtrent de feitelijke gesteldheid van onroerende
      zaken wordt geregeld door het bestuur van de Dienst.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel71
  - number: '72'
    text: |-
      De wijze van bijhouding in de basisregistratie kadaster met betrekking tot voorlopige aantekeningen terzake van
      stukken betreffende onroerende zaken en rechten waaraan die zaken zijn onderworpen en doorhalingen daarvan in het
      register van voorlopige aantekeningen wordt geregeld door het bestuur van de Dienst.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel72
  - number: '73.1'
    text: |-
      De Dienst kan besluiten tot splitsing of samenvoeging van percelen in bij of krachtens algemene maatregel van
      bestuur te bepalen gevallen. [Artikel 58, eerste en tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '73.2'
    text: |-
      Een eigenaar van, of een beperkt gerechtigde met betrekking tot, een onroerende zaak, kan in bij of krachtens
      algemene maatregel van bestuur te bepalen gevallen een verzoek tot splitsing of samenvoeging van percelen doen met
      betrekking tot die onroerende zaak, indien hij daarbij een redelijk belang heeft. Indien het verzoek afkomstig is
      van een beperkt gerechtigde moet de eigenaar van die onroerende zaak door de Dienst worden gehoord alvorens tot
      bijhouding kan worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel73
  - number: '73.3'
    text: |-
      Indien naar zijn oordeel nodig wint de daarmee belaste ambtenaar ter plaatse nadere inlichtingen in.
      Van het voornemen daartoe wordt alsdan mededeling gedaan overeenkomstig [artikel 57, eerste lid][ref1].
      [Artikel 57, tweede en derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel57
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '73.4'
    text: |-
      Voorts is [artikel 67, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel67
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '67'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: '73.5'
    text: |-
      Voor zover het verzoek wordt toegewezen, vindt de bijhouding plaats op grondslag van het relaas van bevindingen.
      [Artikel 58, eerste en tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '74'
    text: |-
      In bij algemene maatregel van bestuur te bepalen gevallen is de Dienst bevoegd te onderzoeken of de gegevens
      betreffende de rechtstoestand, de grootte en feitelijke gesteldheid van onroerende zaken, alsmede de gegevens
      betreffende de rechtstoestand van de rechten waaraan deze onroerende zaken onderworpen zijn, die zijn weergegeven
      in de basisregistratie kadaster en de bescheiden, bedoeld in [artikel 50][ref1], juist en volledig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel50
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '50'
        hoofdstuk: '3'
  - number: '75.1'
    text: |-
      Vóór de aanvang van een onderzoek van vernieuwing maakt de Dienst het voornemen daartoe openbaar overeenkomstig
      door Onze Minister vast te stellen regels. Bij algemene maatregel van bestuur kan voor daarin omschreven gevallen
      worden bepaald dat openbaarmaking achterwege kan blijven op de grond dat het bereiken van alle belanghebbenden door
      het bepaalde in het tweede lid voldoende gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel75
  - number: '75.2'
    text: |-
      De Dienst doet in elk geval van een voornemen tot een onderzoek van vernieuwing per brief mededeling aan de
      eigenaar en beperkt gerechtigde met betrekking tot de onroerende zaak, waarop de vernieuwing betrekking heeft,
      alsmede aan de personen die bij de Dienst anderszins als belanghebbenden bij de vernieuwing bekend zijn.
      [Artikel 57, eerste lid, tweede zin, en tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel57
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '75.3'
    text: |-
      Een voornemen tot een onderzoek van vernieuwing wordt bij het desbetreffende perceel in de basisregistratie
      kadaster vermeld volgens door het bestuur van de Dienst vast te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel75
  - number: '75.4'
    text: |-
      In de brief, bedoeld in het tweede lid, wordt gewezen op de in [artikel 78, tweede en derde lid][ref1], genoemde
      gevolgen die de wet aan de vernieuwing verbindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel78
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '78'
        hoofdstuk: '4'
        afdeling: '3'
  - number: '76.1'
    text: |-
      De met het onderzoek van vernieuwing belaste ambtenaar wint, zonodig ter plaatse, inlichtingen in, verzoekt
      zonodig om overlegging of openlegging van bescheiden en doet de nodige waarnemingen. De belanghebbenden, bedoeld in
      [artikel 75, tweede lid][ref1], dienen, indien naar het oordeel van de ambtenaar nodig door aanwijzing ter plaatse,
      de door de ambtenaar voor de vernieuwing benodigde inlichtingen te verschaffen en daartoe zonodig bescheiden over
      te leggen of open te leggen. [Artikel 67, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel67
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '75'
        hoofdstuk: '4'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '67'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: '76.2'
    text: |-
      Op de grondslag van het relaas van bevindingen worden voorstellen van vernieuwing gemaakt. Alvorens daartoe wordt
      overgegaan, wordt nagegaan of na het onderzoek van vernieuwing met betrekking tot de onroerende zaak waarop het
      voorstel betrekking heeft, nog bijhoudingen hebben plaatsgevonden. Is dat het geval dan wordt in het voorstel
      afzonderlijk melding gemaakt van die bijhoudingen, overeenkomstig door het bestuur van de Dienst vast te stellen
      regelen. Elk voorstel bevat in elk geval de gegevens omtrent de rechten, de rechthebbenden, de grootte, de
      kadastrale aanduiding van de onroerende zaak waarop het betrekking heeft, zoals deze luiden op de dag waarop het
      voorstel is opgemaakt.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel76
  - number: '76.3'
    text: |-
      Bij het maken van een voorstel van vernieuwing wordt geen acht geslagen op niet-ingeschreven feiten waarvan het
      rechtsgevolg slechts kan intreden door inschrijving daarvan in de openbare registers.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel76
  - number: '76.4'
    text: |-
      In het voorstel worden de gegevens omtrent rechten van hypotheek en inbeslagnemingen, zoals deze blijken uit de in
      de openbare registers ingeschreven stukken, ongewijzigd overgenomen. Indien tijdens het onderzoek is gebleken dat
      de omvang van de onroerende zaak waarop het recht van hypotheek is gevestigd of waarop beslag is gelegd, wijziging
      heeft ondergaan, wordt bij het opmaken van het voorstel op die wijziging acht geslagen.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel76
  - number: '76.5'
    text: |-
      In het voorstel worden slechts gegevens omtrent die erfdienstbaarheden vermeld welke in de basisregistratie
      kadaster zijn vermeld, of, indien niet daarin vermeld, waarvan het bestaan aannemelijk is geworden op grond van
      inlichtingen, bescheiden of waarnemingen, als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel76
  - number: '76.6'
    text: |-
      Het voorstel van vernieuwing wordt bekend gemaakt aan belanghebbenden. [Artikel 58, tweede lid][ref1], is van
      overeenkomstige toepassing. Bij toepassing van [artikel 56b][ref2] bevat de beslissing van de ambtenaar op het
      bezwaarschrift alle gegevens uit het voorstel van vernieuwing omtrent de rechten, de rechthebbenden, de kadastrale
      aanduiding en de grootte van de onroerende zaak, waarop de vernieuwing betrekking heeft, ook die waarvan de
      juistheid door belanghebbenden niet is betwist.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel56b
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 56b
        hoofdstuk: '4'
        afdeling: '1'
  - number: '76.7'
    text: |-
      Het bestuur van de Dienst maakt het voorstel van vernieuwing bekend overeenkomstig
      [artikel 3:42 van de Algemene wet bestuursrecht][ref1]. Van de indiening van bezwaarschriften en het instellen
      van beroep, alsmede van daarop gegeven beslissingen wordt bij het voorstel melding gemaakt overeenkomstig door het
      bestuur van de Dienst vast te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '77.1'
    text: |-
      Voorzover tegen een voorstel van vernieuwing geen, of niet tijdig, bezwaren zijn ingediend, de beslissing op
      bezwaar onherroepelijk is geworden of de rechtbank uitspraak heeft gedaan, wordt door een daartoe door de Dienst
      aangewezen notaris een akte van vernieuwing opgemaakt. De akte wordt door de Dienst ondertekend.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel77
  - number: '77.2'
    text: |-
      Een akte van vernieuwing kan op één of meer voorstellen van vernieuwing betrekking hebben. De akte bevat ten
      aanzien van elke onroerende zaak waarop de vernieuwing betrekking heeft, het relaas van bevindingen, de inhoud
      van het voorstel van vernieuwingen en, ingeval er onherroepelijk op bezwaar is beslist of door de rechtbank
      uitspraak is gedaan, die beslissing of uitspraak. Bescheiden die tijdens het onderzoek aan de met het onderzoek van
      vernieuwing belaste ambtenaar worden overgelegd, worden in de akte vermeld en daaraan in afschrift gehecht.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel77
  - number: '77.3'
    text: |-
      Tevens worden overeenkomstig door het bestuur van de Dienst vast te stellen regelen aan de voet van de akte van
      vernieuwing ten aanzien van elke onroerende zaak waarop de vernieuwing betrekking heeft, afzonderlijk vermeld de
      in [artikel 76, tweede lid][ref1], bedoelde bijhoudingen alsmede die bijhoudingen, zo die hebben plaatsgevonden,
      welke zich hebben voorgedaan tussen het tijdstip van de dagtekening van het voorstel van vernieuwing en dat van de
      dagtekening van de akte van vernieuwing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel76
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '76'
        hoofdstuk: '4'
        afdeling: '3'
  - number: '77.4'
    text: |-
      Een bezwaar of beroep ter zake van een bijhouding, als bedoeld in het vorige lid, kan op verzoek van de
      belanghebbende gevoegd worden behandeld met bezwaren of beroepen ter zake van een voorstel van vernieuwing. De
      behandeling kan op verzoek van de belanghebbende ook worden aangehouden tot na het verlijden van de akte van
      vernieuwing.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel77
  - number: '77.5'
    text: De akte van vernieuwing wordt ingeschreven in de openbare registers.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel77
  - number: '78.1'
    text: |-
      Na de inschrijving, bedoeld in [artikel 77, vijfde lid][ref1], wordt de basisregistratie kadaster met bekwame spoed
      vernieuwd op de voet van de akte van vernieuwing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel77
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '77'
        hoofdstuk: '4'
        afdeling: '3'
  - number: '78.2'
    text: |-
      Zij die volgens de akte van vernieuwing rechthebbende zijn op een daarin opgenomen onroerende zaak
      of recht dat geen recht van hypotheek is, gelden voor de toepassing van de verjaring, bedoeld in
      [artikel 99 van Boek 3 van het Burgerlijk Wetboek][ref1], met ingang van de dag van de inschrijving als bezitter te
      goeder trouw van die zaak of dat recht zoals zij in de akte worden omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel99
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '99'
  - number: '78.3'
    text: |-
      De in [artikel 106 van Boek 3 van het Burgerlijk Wetboek][ref1] bedoelde rechtsvordering van een beperkt
      gerechtigde, wiens recht niet in de akte van vernieuwing is opgenomen, verjaart in elk geval door verloop van tien
      jaren na de dag van de inschrijving van deze akte.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel106
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '106'
  - number: '79'
    text: Het bestuur van de Dienst stelt nadere regelen vast omtrent de in deze titel voorziene metingen.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel79
  - number: '80'
    text: |-
      Bij regeling van het bestuur van de Dienst kan worden bepaald dat in door het bestuur van de Dienst vast te stellen
      gevallen bij een kennisgeving van het resultaat van een bijhouding, als bedoeld in afdeling 2 , of bij een voorstel
      van vernieuwing, als bedoeld in [artikel 76, tweede lid][ref1], een kaart wordt gevoegd weergevend de onroerende
      zaken ten aanzien waarvan de bijwerking heeft plaatsgevonden, onderscheidenlijk zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel76
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '76'
        hoofdstuk: '4'
        afdeling: '3'
  - number: '81.1'
    text: |-
      Bij regeling van Onze Minister wordt bepaald, onverminderd hetgeen daaromtrent op grond van andere bepalingen van
      deze titel reeds is of wordt bepaald, welke gegevens eveneens ten minste in de in deze titel voorziene relazen
      van bevindingen en voorstellen van vernieuwing worden vermeld. Het bestuur van de Dienst stelt nadere regelen vast
      omtrent de vorm van de relazen van bevindingen en de voorstellen van vernieuwing.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel81
  - number: '81.2'
    text: |-
      Bij regeling van Onze Minister kunnen tevens nadere voorschriften worden gegeven inzake de vorm van de akte van
      vernieuwing.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel81
  - number: '82'
    text: |-
      Het bestuur van de Dienst stelt de vorm vast van de in deze titel voorziene mededelingen, kennisgevingen alsmede
      van de in deze titel voorziene te geven beslissingen op bezwaarschriften. Indien [artikel 80][ref1] toepassing
      heeft gevonden stelt het bestuur van de Dienst tevens de vorm vast van de in dat artikel bedoelde kaart.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel80
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '80'
        hoofdstuk: '4'
        afdeling: '5'
  - number: '83'
    text: |-
      Het bestuur van de Dienst stelt regelen vast omtrent de bijhouding van het net van coördinaatpunten, bedoeld in
      [artikel 52, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel52
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '52'
        hoofdstuk: '3'
  - number: '85.1'
    text: 'De registratie voor schepen ontsluit de openbare registers door middel van:'
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
  - number: 85.1.a
    text: de naam van de eigenaar van, of beperkt gerechtigde met betrekking tot, een schip, en
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
  - number: 85.1.b
    text: het brandmerk van een schip.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
  - number: '85.2'
    text: 'De registratie voor schepen bevat:'
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
  - number: 85.2.a
    text: |-
      naam, voornamen, adres of verblijfplaats, geboortedatum en burgerlijke staat van de eigenaar van, beperkt
      gerechtigde met betrekking tot, of beslaglegger op, een schip of, ingeval die eigenaar, gerechtigde of beslaglegger
      een rechtspersoon is, de rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
  - number: 85.2.b
    text: |-
      ten aanzien van een eigenaar en beperkt gerechtigde als bedoeld in onderdeel a: een verwijzing naar alle op hen
      betrekking hebbende in de openbare registers ingeschreven of geboekte stukken, voorzover die stukken betreffen
      schepen en rechten waaraan die schepen zijn onderworpen;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
  - number: 85.2.c
    text: |-
      de wettelijke benaming van de beperkte rechten waaraan de schepen onderworpen zijn, en van de beslagen die op de
      schepen of beperkte rechten zijn gelegd, als ook of die schepen of beperkte rechten onder bewind staan, alsmede of
      ten aanzien daarvan zijn ingeschreven:
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
  - number: 85.2.c.1°
    text: |-
      een beding, als bedoeld in [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel252
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '252'
  - number: 85.2.c.2°
    text: |-
      een afwijkend beding, als bedoeld in [artikel 1, vijfde lid, van Boek 8 van het Burgerlijk Wetboek][ref1] onder
      vermelding van het scheepstoebehoren ten aanzien waarvan het afwijkend beding is gemaakt, en


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1'
  - number: 85.2.c.3°
    text: |-
      voorrechten, genoemd in [artikel 211][ref1] dan wel in [artikel 821 van Boek 8 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel211
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel821
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '211'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '821'
  - number: 85.2.d
    text: |-
      de naam en het brandmerk, bedoeld in [artikel 21, eerste lid, onder c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel21
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '21'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 85.2.e
    text: de dagtekening der teboekstelling;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
  - number: 85.2.f
    text: |-
      het type, de inrichting, het materiaal waarvan de romp is gemaakt, jaar en plaats van de bouw en, voor zover het
      een schip met mechanische voortstuwing betreft, ook al betreft het slechts een hulpmotor, het aantal motoren, het
      type, vermogen en de fabrikant van elke motor, alsmede het fabrieksnummer daarvan met aanduiding van de plaats waar
      dit nummer is aangebracht;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
  - number: 85.2.g
    text: |-
      indien het een binnenschip betreft, het laadvermogen in tonnen van 1.000 kilogram of de verplaatsing in kubieke
      meters, zoals vermeld in de meetbrief, dan wel, indien het een zeeschip of een zeevissersschip betreft, de bruto-
      inhoud in kubieke meters of de bruto-tonnage, zoals vermeld in de meetbrief; ingeval geen meetbrief is vereist,
      het laadvermogen, de verplaatsing, de bruto-inhoud dan wel de bruto-tonnage, zoals kan worden vastgesteld aan de
      hand van de verstrekte gegevens; zolang een schip in aanbouw is, wordt het laadvermogen, de verplaatsing, de bruto-
      inhoud dan wel de bruto-tonnage geschat;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
  - number: 85.2.h
    text: |-
      ten aanzien van elk schip een verwijzing naar alle daarop betrekking hebbende, in de openbare registers
      ingeschreven stukken en in het register van voorlopige aantekeningen geboekte stukken, alsmede door de Dienst
      verkregen inlichtingen als bedoeld in [artikel 87, eerste lid, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel87
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '87'
        hoofdstuk: '5'
        afdeling: '1'
  - number: 85.2.i
    text: elk register waarin het schip heeft te boek gestaan;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
  - number: 85.2.j
    text: |-
      voorzover op een schip een recht van hypotheek rust, ten minste de gegevens, genoemd in
      [artikel 48, tweede lid, onderdeel i][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel48
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '48'
        hoofdstuk: '3'
  - number: 85.2.k
    text: gegevens die worden opgenomen op grond van andere wettelijke bepalingen;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
  - number: 85.2.l
    text: 'in geval van mede-eigendom of een rederij: het aandeel van ieder der deelgenoten of reders.'
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
  - number: '85.3'
    text: |-
      De gegevens, bedoeld in het tweede lid en [artikel 7g, tweede en vijfde lid][ref1], omtrent en de bescheiden
      betreffende schepen waarvan de teboekstelling is doorgehaald, blijven deel uitmaken van de registratie voor
      schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel7g
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 7g
        hoofdstuk: 1a
  - number: '85.4'
    text: |-
      De detaillering, verbijzondering en beschrijving van gegevens als bedoeld in het tweede lid en in
      [artikel 7g, tweede en vijfde lid][ref1], vinden plaats in de door het bestuur van de Dienst vastgestelde catalogus
      registratie voor schepen. Het bestuur van de Dienst doet overeenkomstig [artikel 48, zesde lid][ref2], mededeling
      van de vaststelling of wijziging van die catalogus en van de raadpleegbaarheid daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel7g
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel48
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 7g
        hoofdstuk: 1a
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '48'
        hoofdstuk: '3'
  - number: '86'
    text: Bijwerking vindt plaats als bijhouding.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel86
  - number: '87.1'
    text: 'Bijhouding vindt, onverminderd het bepaalde bij of krachtens deze of een andere wet, plaats op grond van:'
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel87
  - number: 87.1.a
    text: |-
      veranderingen blijkens in de openbare registers ingeschreven stukken, voorzover die betrekking hebben op schepen en
      rechten waaraan die schepen zijn onderworpen, of
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel87
  - number: 87.1.b
    text: |-
      wijzigingen met betrekking tot gegevens van de eigenaar of beperkt gerechtigde, voorzover die blijken uit een
      basisregistratie of uit andere door de eigenaar of beperkt gerechtigde overgelegde stukken.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel87
  - number: '87.2'
    text: |-
      Bijhouding van de registratie voor schepen vindt ook plaats met betrekking tot voorlopige aantekeningen terzake van
      stukken betreffende schepen en rechten waaraan die schepen zijn onderworpen en doorhalingen daarvan in het register
      van voorlopige aantekeningen.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel87
  - number: '87.3'
    text: |-
      De wijze van bijhouding wordt, onverminderd het bepaalde bij of krachtens deze of een andere wet, bij of krachtens
      algemene maatregel van bestuur geregeld, in dier voege:
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel87
  - number: 87.3.a
    text: dat na een inschrijving de bijhouding terstond aanvangt, en
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel87
  - number: 87.3.b
    text: |-
      dat in de registratie wordt vermeld op grond van welk ingeschreven of ander stuk een bijhouding heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel87
  - number: '87.4'
    text: |-
      [ Artikel 72][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel72
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '2'
  - number: 87a
    text: |-
      Op beschikkingen inzake de bijhouding, genomen krachtens [hoofdstuk 5][ref1] van deze wet, zijn de
      [artikelen 4:7][ref2], [4:8][ref3] en [3:40 van de Algemene wet bestuursrecht][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 87b.1
    text: |-
      Belanghebbenden kunnen tegen beschikkingen inzake de bijwerking, genomen krachtens deze titel, bezwaar maken nadat
      zij is voltooid.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel87b
  - number: 87b.2
    text: |-
      Geen bezwaar staat open tegen bijhoudingen als bedoeld in [artikel 87, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel87
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel87b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '87'
        hoofdstuk: '5'
        afdeling: '1'
  - number: '88.1'
    text: |-
      Ingeval de bijhouding waartoe een ingeschreven stuk aanleiding geeft, met betrekking tot een schip is voltooid en
      heeft geleid tot wijziging of aanvulling van de in de registratie voor schepen vermeld staande gegevens betreffende
      de eigenaars of beperkt gerechtigden, dan wel de naam van het schip waarop het ingeschreven feit betrekking heeft,
      wordt het resultaat van die bijhouding door toezending of uitreiking aan belanghebbenden bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel88
  - number: '88.2'
    text: |-
      [ Artikel 58, tweede lid][ref1], is voorts van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '89.1'
    text: |-
      Ingeval blijkt dat in een stuk dat is ingeschreven in de openbare registers, bedoeld in
      [artikel 8, eerste lid, onderdeel a][ref1], één of meer der in dat stuk vermelde gegevens, als bedoeld in
      [artikel 21, eerste lid][ref2], onverenigbaar zijn met de in de registratie voor schepen vermeld staande gegevens
      ten aanzien van het schip waarop het in te schrijven feit betrekking heeft, vindt [artikel 88][ref3] slechts
      toepassing voor zover bijhouding mogelijk is ingevolge de op grond van het volgende lid vast te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel88
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '21'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '88'
        hoofdstuk: '5'
        afdeling: '2'
  - number: '89.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt geregeld in hoeverre en op welke wijze bijhouding
      plaatsvindt, indien een geval, als bedoeld in het eerste lid zich voordoet, in dier voege dat de bijhouding
      waartoe het ingeschreven stuk aanleiding geeft, eerst wordt voltooid nadat een stuk tot verbetering, als bedoeld
      in [artikel 42][ref1], is ingeschreven in de in [artikel 8, eerste lid, onderdeel a][ref2], bedoelde openbare
      registers.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '42'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '89.3'
    text: |-
      [ Artikel 59, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel59
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '92.1'
    text: 'De registratie voor luchtvaartuigen ontsluit de openbare registers door middel van:'
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
  - number: 92.1.a
    text: de naam van de eigenaar van, of beperkt gerechtigde met betrekking tot, een luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
  - number: 92.1.b
    text: |-
      het in [artikel 22, eerste lid, onderdeel a][ref1], bedoelde inschrijvingskenmerk, en


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel22
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '22'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 92.1.c
    text: |-
      het in [artikel 22, eerste lid, onderdeel d][ref1], bedoelde boekingsnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel22
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '22'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '92.2'
    text: 'De registratie voor luchtvaartuigen bevat:'
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
  - number: 92.2.a
    text: |-
      naam, voornamen, adres, geboortedatum en burgerlijke staat van de eigenaar van, beperkt gerechtigde met betrekking
      tot, of beslaglegger op een luchtvaartuig of, ingeval die eigenaar, gerechtigde of beslaglegger een rechtspersoon
      is, de rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
  - number: 92.2.b
    text: |-
      ten aanzien van een eigenaar en beperkt gerechtigde als bedoeld in onderdeel a: een verwijzing naar alle op hen
      betrekking hebbende in de openbare registers, bedoeld in [artikel 8, eerste lid][ref1], ingeschreven stukken of
      geboekte stukken, voorzover die stukken betreffen luchtvaartuigen en rechten waaraan die luchtvaartuigen zijn
      onderworpen;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 92.2.c
    text: |-
      de wettelijke benaming van de beperkte rechten waaraan de luchtvaartuigen onderworpen zijn, en van de beslagen die
      op die luchtvaartuigen of beperkte rechten zijn gelegd, als ook of die luchtvaartuigen of beperkte rechten onder
      bewind staan, alsmede of ten aanzien daarvan zijn ingeschreven:
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
  - number: 92.2.c.1°
    text: |-
      een beding, als bedoeld in [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel252
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '252'
  - number: 92.2.c.2°
    text: |-
      voorrechten als bedoeld in [artikel 1317 van Boek 8 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1317
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1317'
  - number: 92.2.d
    text: |-
      het nationaliteitskenmerk en het inschrijvingskenmerk, bedoeld in
      [artikel 3.2, eerste lid, van de Wet luchtvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
  - number: 92.2.e
    text: |-
      de naam en woonplaats van de fabrikant, het type, jaar en plaats van de bouw, het serienummer, zo het luchtvaartuig
      dat heeft, met de aanduiding van de plaats waar dit nummer is aangebracht, het aantal motoren, het type, vermogen
      en de fabrikant van elke motor, alsmede het fabrieksnummer daarvan met de aanduiding van de plaats waar dit nummer
      is aangebracht;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
  - number: 92.2.f
    text: de maximaal toegelaten startmassa;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
  - number: 92.2.g
    text: |-
      de dagtekening van de teboekstelling en het boekingsnummer, bedoeld in [artikel 22, eerste lid, onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel22
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '22'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 92.2.h
    text: |-
      ten aanzien van elk luchtvaartuig een verwijzing naar alle daarop betrekking hebbende, in de openbare registers
      ingeschreven stukken en in het register van voorlopige aantekeningen geboekte stukken, alsmede door de Dienst
      verkregen inlichtingen als bedoeld in [artikel 94, eerste lid, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel94
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '94'
        hoofdstuk: '6'
        afdeling: '1'
  - number: 92.2.i
    text: elk register waarin het luchtvaartuig heeft te boek gestaan;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
  - number: 92.2.j
    text: |-
      voorzover op een luchtvaartuig een recht van hypotheek rust, ten minste de gegevens, genoemd in
      [artikel 48, tweede lid, onderdeel i][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel48
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '48'
        hoofdstuk: '3'
  - number: 92.2.k
    text: gegevens die worden opgenomen op grond van andere wettelijke bepalingen;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
  - number: 92.2.l
    text: in geval van een gemeenschap, het aandeel van ieder der deelgenoten.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
  - number: '92.3'
    text: |-
      [ Artikel 85, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '85'
        hoofdstuk: '5'
  - number: '92.4'
    text: |-
      De detaillering, verbijzondering en beschrijving van gegevens als bedoeld in het tweede lid en in
      [artikel 7g, tweede en vijfde lid][ref1], vinden plaats in de door het bestuur van de Dienst vastgestelde catalogus
      registratie voor luchtvaartuigen. Het bestuur van de Dienst doet overeenkomstig [artikel 48, zesde lid][ref2],
      mededeling van de vaststelling of wijziging van die catalogus en van de raadpleegbaarheid daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel7g
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel48
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 7g
        hoofdstuk: 1a
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '48'
        hoofdstuk: '3'
  - number: '93'
    text: Bijwerking vindt plaats als bijhouding.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel93
  - number: '94.1'
    text: 'Bijhouding vindt, onverminderd het bepaalde bij of krachtens deze of een andere wet, plaats op grond van:'
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel94
  - number: 94.1.a
    text: |-
      veranderingen blijkens in de openbare registers ingeschreven stukken, voorzover die betrekking hebben op
      luchtvaartuigen en rechten waaraan die luchtvaartuigen zijn onderworpen, of
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel94
  - number: 94.1.b
    text: |-
      wijzigingen met betrekking tot gegevens van de eigenaar of beperkt gerechtigde, voorzover die blijken uit een
      basisregistratie of uit andere door de eigenaar of beperkt gerechtigde overgelegde stukken.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel94
  - number: '94.2'
    text: |-
      Bijhouding van de registratie voor luchtvaartuigen vindt ook plaats met betrekking tot voorlopige aantekeningen
      terzake van stukken betreffende luchtvaartuigen en rechten waaraan die luchtvaartuigen zijn onderworpen en
      doorhalingen daarvan in het register van voorlopige aantekeningen.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel94
  - number: '94.3'
    text: |-
      De wijze van bijhouding wordt, onverminderd het bepaalde bij of krachtens deze of andere wet, bij of krachtens
      algemene maatregel van bestuur geregeld, in dier voege:
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel94
  - number: 94.3.a
    text: dat na een inschrijving de bijhouding terstond aanvangt, en
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel94
  - number: 94.3.b
    text: |-
      dat in de registratie wordt vermeld op grond van welk ingeschreven of ander stuk een bijhouding heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel94
  - number: '94.4'
    text: |-
      [ Artikel 72][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel72
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '2'
  - number: 94a
    text: |-
      Op beschikkingen inzake de bijhouding, genomen krachtens [hoofdstuk 6][ref1] van deze wet, zijn de
      [artikelen 4:7][ref2], [4:8][ref3] en [3:40 van de Algemene wet bestuursrecht][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel94a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 94b.1
    text: |-
      Belanghebbenden kunnen tegen beschikkingen inzake de bijwerking, genomen krachtens deze titel, bezwaar maken nadat
      zij is voltooid.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel94b
  - number: 94b.2
    text: |-
      Geen bezwaar staat open tegen bijhoudingen als bedoeld in [artikel 94, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel94
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel94b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '94'
        hoofdstuk: '6'
        afdeling: '1'
  - number: 94b.3
    text: |-
      [Artikel 56b, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel56b
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel94b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 56b
        hoofdstuk: '4'
        afdeling: '1'
  - number: '95.1'
    text: |-
      Ingeval de bijhouding waartoe een ingeschreven stuk aanleiding geeft, met betrekking tot een luchtvaartuig
      is voltooid en heeft geleid tot wijziging of aanvulling van de in de registratie voor luchtvaartuigen vermeld
      staande gegevens betreffende de eigenaars of beperkt gerechtigden, dan wel de naam van het luchtvaartuig waarop
      het ingeschreven feit betrekking heeft, wordt het resultaat van die bijhouding door toezending of uitreiking aan
      belanghebbenden bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel95
  - number: '95.2'
    text: |-
      [Artikel 58, tweede lid][ref1], is voorts van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '96.1'
    text: |-
      Ingeval blijkt dat in een stuk, dat is ingeschreven in de openbare registers, bedoeld in
      [artikel 8, eerste lid, onderdeel a][ref1], één of meer der in dat stuk vermelde gegevens, als bedoeld in
      [artikel 22, eerste lid][ref2], onverenigbaar zijn met de in de registratie voor luchtvaartuigen vermeld
      staande gegevens ten aanzien van het luchtvaartuig waarop het in te schrijven feit betrekking heeft, vindt
      [artikel 95][ref3] slechts toepassing voor zover bijhouding mogelijk is ingevolge de op grond van het volgende lid
      vast te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel95
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '22'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '95'
        hoofdstuk: '6'
        afdeling: '2'
  - number: '96.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt geregeld in hoeverre en op welke wijze bijhouding
      plaatsvindt indien een geval, als bedoeld in het eerste lid, zich voordoet, in dier voege dat de bijhouding
      waartoe het ingeschreven stuk aanleiding geeft, eerst wordt voltooid nadat een stuk tot verbetering, als bedoeld
      in [artikel 42][ref1], is ingeschreven in de in [artikel 8, eerste lid, onderdeel a][ref2], bedoelde openbare
      registers.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '42'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '96.3'
    text: |-
      [Artikel 59, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel59
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: 98a.1
    text: |-
      De basisregistratie topografie is toegankelijk door middel van een identificerend objectnummer of een locatie op
      de kaart.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel98a
  - number: 98a.2
    text: 'De basisregistratie topografie bevat de volgende geografische objecten met hun cartografische weergave:'
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel98a
  - number: 98a.2.a
    text: wegdeel;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel98a
  - number: 98a.2.b
    text: spoorbaandeel;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel98a
  - number: 98a.2.c
    text: waterdeel;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel98a
  - number: 98a.2.d
    text: bebouwing;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel98a
  - number: 98a.2.e
    text: terrein;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel98a
  - number: 98a.2.f
    text: inrichtingselement;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel98a
  - number: 98a.2.g
    text: reliëf;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel98a
  - number: 98a.2.h
    text: registratief gebied;
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel98a
  - number: 98a.2.i
    text: geografisch gebied, en
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel98a
  - number: 98a.2.j
    text: functioneel gebied.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel98a
  - number: 98a.3
    text: |-
      De basisregistratie topografie bevat ten aanzien van elk geografisch object als bedoeld in het tweede lid
      een identificerend objectnummer en beschrijvende, geometrische, cartografische, temporele en meta-kenmerken
      overeenkomstig de door het bestuur van de Dienst vastgestelde catalogus basisregistratie topografie. Het bestuur
      van de Dienst doet overeenkomstig [artikel 48, zesde lid][ref1], mededeling van de vaststelling of wijziging van
      die catalogus en van de raadpleegbaarheid daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel48
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel98a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '48'
        hoofdstuk: '3'
  - number: 98a.4
    text: |-
      De geografische objecten, bedoeld in het tweede lid, worden bewerkt overeenkomstig de regels en procedures als
      opgenomen in de catalogus basisregistratie topografie.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel98a
  - number: 98a.5
    text: |-
      De meta-kenmerken, bedoeld in het derde lid, hebben in ieder geval betrekking op de beschrijving van de oorsprong
      en de kwaliteit of nauwkeurigheid van de geografische objecten.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel98a
  - number: '99.1'
    text: |-
      Desgevraagd verleent de Dienst inzage van de openbare registers en geeft hij af of zendt toe voor eensluidend
      gewaarmerkte afschriften of uittreksels van de in die registers ingeschreven of geboekte stukken, en
      getuigschriften omtrent het al dan niet bestaan van inschrijvingen of voorlopige aantekeningen betreffende een
      registergoed of een persoon.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel99
  - number: '99.2'
    text: |-
      Indien met betrekking tot een registergoed in het register van voorlopige aantekeningen, bedoeld in
      [artikel 8, eerste lid, onderdeel b][ref1], voorlopige aantekeningen zijn gesteld die nog niet zijn doorgehaald,
      wordt op de getuigschriften inzake dat registergoed melding gemaakt van die nog niet doorgehaalde voorlopige
      aantekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '100.1'
    text: |-
      Desgevraagd verleent de Dienst inzage van de basisregistratie kadaster en de bescheiden, bedoeld in
      [artikel 50][ref1], en geeft hij voor eensluidend gewaarmerkte afschriften of uittreksels daarvan af of zendt die
      toe.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel50
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '50'
        hoofdstuk: '3'
  - number: '100.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de gevallen waarin de
      verstrekking van inlichtingen uit de kadastrale kaarten en de daaraan ten grondslag liggende bescheiden na een
      verzoek daartoe in papieren vorm te velde kan plaatsvinden, en met betrekking tot de daarbij in acht te nemen
      regels.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel100
  - number: '100.3'
    text: Desgevraagd verstrekt de Dienst inlichtingen over het net van coördinaatpunten.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel100
  - number: '101.1'
    text: |-
      Desgevraagd verleent de Dienst inzage van de registratie voor schepen en van andere documenten betreffende schepen
      die niet zijn ingeschreven in de openbare registers en geeft hij voor eensluidend gewaarmerkte afschriften of
      uittreksels daarvan af of zendt die toe.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel101
  - number: '101.2'
    text: |-
      De Dienst kan desgevraagd een verklaring afgeven, inhoudende dat een schip ten aanzien waarvan bij het
      desbetreffende verzoek door de betrokkene ten minste zodanige gegevens worden bekend gesteld dat de identiteit van
      het schip voldoende vaststaat, niet te boek staat noch heeft te boek gestaan.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel101
  - number: '102.1'
    text: |-
      Desgevraagd verleent de Dienst inzage van de registratie voor luchtvaartuigen en van andere documenten betreffende
      luchtvaartuigen die niet zijn ingeschreven in de openbare registers en geeft hij voor eensluidend gewaarmerkte
      afschriften of uittreksels daarvan af of zendt die toe.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel102
  - number: '102.2'
    text: |-
      De Dienst kan desgevraagd een verklaring afgeven, inhoudende dat een luchtvaartuig ten aanzien waarvan bij het
      desbetreffende verzoek door de betrokkene ten minste het nationaliteitskenmerk en het inschrijvingskenmerk, bedoeld
      in [artikel 3.2, eerste lid, van de Wet luchtvaart][ref1] worden bekend gesteld, niet te boek staat noch heeft te
      boek gestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
  - number: 102a
    text: |-
      Desgevraagd verstrekt de Dienst inlichtingen over de geografische gegevens, bedoeld in
      [artikel 3, eerste lid, onderdeel f][ref1], en verleent de Dienst inzage van de daaraan ten grondslag liggende
      bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel102a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
        hoofdstuk: '1'
  - number: '103.1'
    text: |-
      Desgevraagd geeft de Dienst een verklaring af dat sedert het tijdstip waarop een getuigschrift, afschrift of
      uittreksel als bedoeld in de [artikelen 99 tot en met 102][ref1] door hem is afgegeven, in de daarin vermelde
      gegevens geen wijziging is opgetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel99
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '99'
        hoofdstuk: '7'
        afdeling: '1'
  - number: '103.2'
    text: Het eerste lid is niet van toepassing op afschriften en uittreksels van de kadastrale kaart.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel103
  - number: '104.1'
    text: |-
      Onverminderd [artikel 100, eerste lid][ref1], verstrekt de Dienst desgevraagd aan gemeenten en andere
      publiekrechtelijke lichamen voor hun grondgebied een afschrift van de basisregistratie kadaster.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel100
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '100'
        hoofdstuk: '7'
        afdeling: '1'
  - number: '104.2'
    text: |-
      Door het bestuur van de Dienst worden in overleg met betrokkenen regels gesteld met betrekking tot de wijze waarop
      door de Dienst, al of niet periodiek, grote hoeveelheden gegevens uit de basisregistratie kadaster aan gemeenten en
      andere publiekrechtelijke lichamen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel104
  - number: '104.3'
    text: |-
      Op de verstrekking van gegevens, bedoeld in het eerste en tweede lid, zijn de [artikelen 108 tot en met 110][ref1]
      van overeenkomstige toepassing, met dien verstande dat bij de vaststelling van de hoogte van het verschuldigde
      kadastraal recht rekening wordt gehouden met besparingen die voortvloeien uit het feit dat grote hoeveelheden
      gegevens tegelijkertijd worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel108
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '108'
        hoofdstuk: '7'
  - number: '105.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de voorwaarden
      waaronder en de wijze waarop een permanente aansluiting kan worden verkregen op, voorzover in elektronische vorm
      gehouden, de openbare registers, de basisregistratie kadaster, de registratie voor schepen en de registratie voor
      luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel105
  - number: '105.2'
    text: |-
      Het bestuur van de Dienst kan aan gemeenten die beschikken over een permanente aansluiting als bedoeld in het
      eerste lid, desgevraagd de bevoegdheid geven daaruit gegevens aan derden te verschaffen. Bij algemene maatregel van
      bestuur worden regels gesteld met betrekking tot de voorwaarden waaronder een bevoegdheid als bedoeld in de eerste
      zin wordt verleend en de gevallen waarin de verlening van die bevoegdheid kan worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel105
  - number: '106.1'
    text: |-
      De bewaarder is belast met de verstrekking van de inlichtingen, bedoeld in de [artikelen 99][ref1],
      [100, eerste lid][ref2], voorzover betreffend de basisregistratie kadaster, en [101][ref3], [102][ref4] en
      [103][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel101
      [ref4]: https://wetten.overheid.nl/BWBR0004541#Artikel102
      [ref5]: https://wetten.overheid.nl/BWBR0004541#Artikel103
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '99'
        hoofdstuk: '7'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '100'
        hoofdstuk: '7'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '101'
        hoofdstuk: '7'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0004541
        artikel: '102'
        hoofdstuk: '7'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0004541
        artikel: '103'
        hoofdstuk: '7'
        afdeling: '1'
  - number: '106.2'
    text: |-
      Het bestuur van de Dienst kan andere personen behorend tot het personeel van de Dienst dan de bewaarder belasten
      met de verstrekking van de inlichtingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel106
  - number: '106.3'
    text: |-
      Het bestuur van de Dienst wijst ambtenaren aan die belast zijn met de verstrekking van de inlichtingen, bedoeld in
      [artikel 100][ref1], met uitzondering van inlichtingen uit de basisregistratie kadaster, en [artikel 102a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel102a
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '100'
        hoofdstuk: '7'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 102a
        hoofdstuk: '7'
        afdeling: '1'
  - number: '107'
    text: 'Het bestuur van de Dienst stelt vast:'
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel107
  - number: 107.a
    text: |-
      de vorm van de afschriften, uittreksels, getuigschriften en verklaringen, bedoeld in de
      [artikelen 99 tot en met 102a][ref1], alsmede de gevallen waarin de Dienst getuigschriften opmaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel99
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '99'
        hoofdstuk: '7'
        afdeling: '1'
  - number: 107.b
    text: |-
      de wijze en plaats van raadpleging van de openbare registers, de basisregistratie kadaster en de bescheiden,
      bedoeld in [artikel 50][ref1], de registratie voor schepen en andere documenten betreffende schepen, de registratie
      voor luchtvaartuigen en andere documenten betreffende luchtvaartuigen, de geografische gegevens en de aan die
      gegevens ten grondslag liggende bescheiden;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel50
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '50'
        hoofdstuk: '3'
  - number: 107.c
    text: |-
      de vorm van de verklaring, bedoeld in [artikel 103][ref1], en de wijze waarop de afschriften, uittreksels en
      getuigschriften, bedoeld in dat artikel, worden voorzien van die verklaring;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel103
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '103'
        hoofdstuk: '7'
        afdeling: '1'
  - number: 107.d
    text: |-
      de wijze waarop de waarmerking, bedoeld in de [artikelen 99 tot en met 102][ref1], van in papieren vorm te
      verstrekken afschriften, uittreksels en getuigschriften als bedoeld in de [artikelen 99 tot en met 102][ref2]
      plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel99
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '99'
        hoofdstuk: '7'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '99'
        hoofdstuk: '7'
        afdeling: '1'
  - number: 107.e
    text: |-
      de wijze waarop in elektronische vorm te verstrekken getuigschriften, afschriften, uittreksels en verklaringen als
      bedoeld in de [artikelen 99 tot en met 102][ref1] worden gewaarmerkt, waartoe zij ten minste worden voorzien van
      een elektronische handtekening van de bewaarder en welke waarmerking wat betreft afschriften en uittreksels mede
      omvat de waarmerking voor eensluidendheid;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel99
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '99'
        hoofdstuk: '7'
        afdeling: '1'
  - number: 107.f
    text: de wijze waarop inlichtingen over het net van coördinaatpunten worden verstrekt, en
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel107
  - number: 107.g
    text: |-
      de wijze waarop inlichtingen over geografische gegevens als bedoeld in [artikel 3, eerste lid, onderdeel f][ref1],
      worden verstrekt en de wijze waarop inzage wordt verleend van de aan die geografische gegevens ten grondslag
      liggende bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
        hoofdstuk: '1'
  - number: 107a.1
    text: |-
      [Artikel 35 van de Wet bescherming persoonsgegevens][ref1] is niet van toepassing ingeval de verstrekking van
      inlichtingen ingevolge deze titel persoonsgegevens betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel35
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel107a
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '35'
  - number: 107a.2
    text: |-
      Een beslissing tot afwijzing van een verzoek om inlichtingen ingevolge deze titel, geldt als een
      besluit in de zin van de [Algemene wet bestuursrecht][ref1]. De [artikelen 56b, eerste lid][ref2], en
      [58, eerste en tweede lid][ref3], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel56b
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel107a
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 56b
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: 107b
    text: |-
      Ter bescherming van de persoonlijke levenssfeer van personen die in de basisregistratie kadaster, de registratie
      voor schepen en in de registratie voor luchtvaartuigen vermeld staan, kunnen bij of krachtens algemene maatregel
      van bestuur voor daarbij aangewezen soort of soorten van persoonsgegevens beperkingen worden vastgesteld ten
      aanzien van de verstrekking van inlichtingen als bedoeld in de [artikelen 99 tot en met 107][ref1]. Daarbij kunnen
      tevens regels worden vastgesteld voor de behandeling van verzoeken tot afscherming van persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel99
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel107b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '99'
        hoofdstuk: '7'
        afdeling: '1'
  - number: 107c
    text: |-
      De Dienst kan slechts een verzameling van persoonsgegevens verstrekken in een zodanige vorm dat daarop rechtstreeks
      een geautomatiseerde verwerking mogelijk is ten aanzien van een op voorhand onbepaalde groep van personen, indien
      dit voortvloeit uit een van de doeleinden, genoemd in [artikel 2a][ref1], de aanvrager deze gegevens kan verwerken
      op één van de gronden, bedoeld in [artikel 8, onder c tot en met f, van de Wet bescherming persoonsgegevens][ref2]
      en zulks is toegestaan bij algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel107c
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 2a
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '8'
  - number: '108.1'
    text: |-
      Onder de naam van kadastraal recht zijn betrokkenen aan de Dienst wegens het verrichten door de Dienst van
      werkzaamheden ter uitvoering van de taken, bedoeld in [artikel 3][ref1], vergoedingen verschuldigd overeenkomstig
      de bij regeling van Onze Minister te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
        hoofdstuk: '1'
  - number: '108.2'
    text: |-
      De tarieven van het kadastraal recht worden tot geen hoger bedrag vastgesteld dan wordt vereist tot dekking van de
      ten laste van de Dienst komende kosten van het verrichten van de werkzaamheden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel108
  - number: '108.3'
    text: |-
      Het bestuur van de Dienst stelt regelen vast omtrent de wijze waarop het kadastraal recht wordt verrekend met de
      door de betrokkene betaalde of nog te betalen andere vergoedingen.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel108
  - number: '109'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de gevallen waarin en de
      verrichtingen ten aanzien waarvan in die gevallen geen kadastraal recht is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel109
  - number: '110'
    text: |-
      Het bestuur van de Dienst is bevoegd om in bijzondere gevallen vrijstelling, vermindering of teruggaaf van
      kadastraal recht te verlenen.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel110
  - number: 110a
    text: |-
      Op beschikkingen, genomen krachtens hoofdstuk 8 van deze wet, zijn de [artikelen 4:7][ref1], [4:8][ref2] en
      [3:40 van de Algemene wet bestuursrecht][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '111.1'
    text: |-
      De Dienst is bevoegd om, anders dan ingevolge de bepalingen omtrent de bijwerking, bedoeld in [hoofdstuk 4][ref1],
      in door Onze Minister te bepalen gevallen de kadastrale aanduiding van onroerende zaken en appartementsrechten te
      wijzigen en de grootte van percelen opnieuw vast te stellen. Het bestuur van de Dienst stelt regelen vast omtrent
      de wijze waarop wijzigingen, als bedoeld in de eerste zin, in de basisregistratie kadaster worden weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0004541
        hoofdstuk: '4'
  - number: '111.2'
    text: |-
      Indien de Dienst ambtshalve de kadastrale aanduiding van een onroerende zaak of van een appartementsrecht wijzigt,
      als bedoeld in het eerste lid, is [artikel 58, eerste lid][ref1], van overeenkomstige toepassing. Tegen deze
      wijziging staat generlei voorziening open.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '111.3'
    text: |-
      Indien de Dienst ambtshalve de grootte van een perceel opnieuw vaststelt, als bedoeld in het eerste lid, en
      deze afwijkt van de in de basisregistratie kadaster vermeld staande grootte vóór de herberekening, zijn de
      [artikelen 56b, eerste lid][ref1], en [58, eerste en tweede lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel56b
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 56b
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '116'
    text: |-
      Het bestuur van de Dienst stelt regels met betrekking tot de wijze waarop een vergissing, verzuim of een andere
      onregelmatigheid begaan door de bewaarder bij de inschrijving van stukken in de openbare registers, bij het stellen
      daarin van aantekeningen, bij de boeking van stukken in het register van voorlopige aantekeningen, of bij de
      doorhaling van voorlopige aantekeningen, wordt hersteld.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel116
  - number: '117.1'
    text: |-
      De Dienst is jegens betrokkenen aansprakelijk voor de schade die zij lijden, doordat in strijd met de wet een
      inschrijving is geweigerd of geschied.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel117
  - number: '117.2'
    text: |-
      De Dienst is eveneens aansprakelijk voor alle verdere vergissingen, verzuimen, vertragingen of andere
      onregelmatigheden van zijn ambtenaren, gepleegd bij het houden van de openbare registers of bij het opmaken of
      afgeven van afschriften, uittreksels en getuigschriften.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel117
  - number: '117.3'
    text: |-
      De Dienst is jegens betrokkenen aansprakelijk voor vergissingen, verzuimen of andere onregelmatigheden door de
      Dienst gepleegd bij het bijwerken van de basisregistratie kadaster en de bescheiden, bedoeld in [artikel 50][ref1],
      alsmede van de registratie voor schepen en de registratie voor luchtvaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel50
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '50'
        hoofdstuk: '3'
  - number: '117.4'
    text: |-
      De Dienst is eveneens aansprakelijk voor alle vergissingen, verzuimen of andere onregelmatigheden van de Dienst,
      begaan bij het in papieren vorm en in elektronische vorm verstrekken van inlichtingen uit de basisregistratie
      kadaster en de bescheiden, bedoeld in [artikel 50][ref1], alsmede uit de registratie voor schepen en de registratie
      voor luchtvaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel50
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '50'
        hoofdstuk: '3'
  - number: '117.5'
    text: |-
      De Dienst is aansprakelijk voor schade die is veroorzaakt door een vergissing, verzuim of een andere
      onregelmatigheid door hem begaan bij:
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel117
  - number: 117.5.a
    text: |-
      het vervaardigen, verzamelen, houden en bijwerken van geografische gegevens en het uniform en consistent
      cartografisch weergeven van die gegevens, bedoeld in [artikel 3, eerste lid, onderdelen f en g][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
        hoofdstuk: '1'
  - number: 117.5.b
    text: |-
      het in papieren vorm en in elektronische vorm verstrekken van inlichtingen omtrent geografische gegevens, bedoeld
      in [artikel 3, eerste lid, onderdelen g en j][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
        hoofdstuk: '1'
  - number: '117.6'
    text: |-
      De Dienst is aansprakelijk voor de schade die is veroorzaakt door een vergissing, verzuim
      of andere onregelmatigheid van de Dienst, door hem begaan bij de registratie, bedoeld in
      [artikel 6 van de Wet informatie-uitwisseling ondergrondse netten][ref1], en de uitwisseling of de
      verstrekking van gegevens, bedoeld in de [artikelen 9][ref2], [11][ref3], [12][ref4], [15][ref5], [17][ref6]
      en [18 van die wet][ref7]. De Dienst is niet aansprakelijk voor schade die voortvloeit uit het door de Dienst
      verstrekken van informatie die afkomstig is van derden en inhoudelijk onjuist blijkt te zijn, of het niet tijdig
      ontvangen of kunnen verstrekken van informatie die afkomstig is van derden door handelen of nalaten van die derden.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0023775#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0023775#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0023775#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0023775#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0023775#Artikel17
      [ref7]: https://wetten.overheid.nl/BWBR0023775#Artikel18
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel117
