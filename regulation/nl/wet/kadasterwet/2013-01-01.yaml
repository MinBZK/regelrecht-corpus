  - number: 118a
    text: |-
      Indien in deze wet geregelde of daarmee verband houdende onderwerpen in het belang van een goede uitvoering van
      deze wet of in het belang van de uitvoering van een voor Nederland verbindend besluit van de Raad van de Europese
      Unie of de Commissie van de Europese Gemeenschappen regeling of nadere regeling behoeven, kan deze geschieden bij
      algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel118a
  - number: '119.1'
    text: Deze wet kan worden aangehaald als "Kadasterwet".
