      - id: ref7
        bwb_id: BWBR0023775
        artikel: '18'
  - number: '117.7'
    text: |-
      De Dienst is aansprakelijk voor de schade die is veroorzaakt door een vergissing, verzuim, vertraging of andere
      onregelmatigheid van de Dienst, door hem begaan bij het beheren van de landelijke voorziening, bedoeld in
      [artikel 10, eerste lid, van de Wet kenbaarheid publiekrechtelijke beperkingen onroerende zaken][ref1], dan wel
      bij het verlenen van inzage in de gegevens uit die voorziening. De Dienst is niet aansprakelijk voor schade die
      voortvloeit uit het door de Dienst verstrekken van gegevens die afkomstig zijn van derden en inhoudelijk onjuist
      blijken te zijn, of het niet tijdig ontvangen of kunnen verstrekken van gegevens die afkomstig zijn van derden door
      handelen of nalaten van die derden.


      [ref1]: https://wetten.overheid.nl/BWBR0016876#Artikel10
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0016876
        artikel: '10'
  - number: '117.8'
    text: |-
      De Dienst is aansprakelijk voor de schade die is veroorzaakt door een vergissing, verzuim, vertraging of andere
      onregelmatigheid van de Dienst, door hem begaan bij het houden of beheren van de landelijke voorziening, bedoeld
      in [artikel 26 van de Wet basisregistraties adressen en gebouwen][ref1], dan wel bij het verlenen van inzage in die
      voorziening of het verstrekken van de daarin opgenomen gegevens. De Dienst is niet aansprakelijk voor schade die
      voortvloeit uit het door de Dienst verstrekken van gegevens die afkomstig zijn van derden en inhoudelijk onjuist
      blijken te zijn, of uit het niet tijdig ontvangen of kunnen verstrekken van gegevens die afkomstig zijn van derden
      door handelen of nalaten van die derden.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel26
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '26'
  - number: '117.9'
    text: |-
      Het bestuur van de Dienst kan regels stellen met betrekking tot de aansprakelijkheid voor de gevolgen van storingen
      in de middelen die de Dienst gebruikt bij elektronische gegevens uitwisseling als bedoeld in deze wet.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel117
  - number: '118.1'
    text: |-
      Door het bestuur van de Dienst te nemen beslissingen en te stellen regels als bedoeld in deze wet, worden geplaatst
      in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#Artikel118
  - number: '118.2'
    text: |-
      Het eerste lid is niet van toepassing op de beslissingen, bedoeld in de [artikelen 6][ref1],
      [7, tweede tot en met vierde lid][ref2], [8, derde lid, derde zin][ref3], [9, derde, vierde en zesde lid][ref4],
      [9a][ref5], [11a, tweede lid, tweede zin, derde lid, tweede zin, en vierde lid, tweede zin][ref6],
      [11b, achtste lid][ref7], [11c, tweede en derde lid][ref8], [12, eerste lid, tweede zin][ref9],
      [13, eerste lid, tweede zin, en tweede lid, derde zin][ref10], [14][ref11], [17, eerste lid, onderdeel a][ref12],
      [46, derde lid, tweede zin][ref13], [82][ref14], [107, onderdelen a en c tot en met e][ref15],
      [110][ref16] en op de regels, bedoeld in de [artikelen 8, tweede lid, eerste en vierde zin][ref17], en
      [17, eerste lid, onderdeel b][ref18].


