preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, mede ter uitvoering van artikel 3.1.2.1, tweede
    lid, van het Burgerlijk Wetboek, nieuwe regelen vast te stellen met betrekking tot de openbare registers voor
    registergoederen, alsmede met betrekking tot het kadaster (Kadasterwet);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004541/2013-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: ambtenaar: ambtenaar van de Dienst;
      authentiek gegeven: in een basisregistratie opgenomen gegeven dat bij wettelijk voorschrift als authentiek is
      aangemerkt; basisregistratie: verzameling gegevens, waarvan bij wet is bepaald dat deze een basisregistratie
      vormt; bewaarder: bewaarder als bedoeld in [artikel 6][ref1]; brondocument: 1°. in de openbare registers
      ingeschreven of anderszins door de Dienst gehouden document, of 2°. besluit of gewaarmerkt afschrift
      daarvan; catalogus basisregistratie topografie: catalogus basisregistratie topografie als bedoeld in
      [artikel 98a, derde lid][ref2]; Dienst: Dienst voor het kadaster en de openbare registers als bedoeld in
      [artikel 2 van de Organisatiewet Kadaster][ref3]; geografisch gegeven: 1°. in [artikel 98a, tweede lid][ref4],
      genoemd geografisch object; 2°. identificerend objectnummer als bedoeld in [artikel 98a, derde lid][ref5], of
      een ander in de catalogus basisregistratie topografie daarmee gelijkgesteld identificerend kenmerk, dat aan het
      betreffende geografisch object wordt toegekend, of 3°. ander kenmerk als bedoeld in [artikel 98a, derde lid][ref6],
      dat in de catalogus basisregistratie topografie wordt genoemd; kadastrale grens: op basis van inlichtingen
      van belanghebbenden en met gebruikmaking van de bescheiden, bedoeld in [artikel 50][ref7], door de Dienst
      vastgestelde grens tussen percelen; kadastrale grootte: indicatieve omvang van een perceel, berekend door de
      Dienst; kadastrale kaart: kadastrale kaart als bedoeld in [artikel 48, derde lid][ref8]; Onze Minister: Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer; openbare registers: openbare registers
      als bedoeld in [artikel 16 van Boek 3 van het Burgerlijk Wetboek][ref9] juncto [artikel 8, eerste lid][ref10];
      perceel: kadastraal geïdentificeerd en met kadastrale grenzen begrensd deel van het Nederlands grondgebied;
      rechtspersoon: privaatrechtelijke of publiekrechtelijke rechtspersoon, met inbegrip van de openbare vennootschap
      met rechtspersoonlijkheid; registratie: registratie of basisregistratie.


