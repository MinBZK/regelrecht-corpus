        artikel: '8'
  - number: '2'
    text: |-
      Er is een Schadefonds Geweldsmisdrijven waaruit uitkeringen kunnen worden gedaan als bij of krachtens deze wet
      bepaald.
    url: https://wetten.overheid.nl/BWBR0002979/2020-01-01#Artikel2
  - number: '3'
    text: |-
      1 Uitkering kan worden gedaan

      a. aan een ieder die ten gevolge van een in Nederland opzettelijk gepleegd geweldsmisdrijf ernstig lichamelijk of
      geestelijk letsel heeft bekomen;

      b. aan een ieder die ten gevolge van een aan boord van een Nederlands vaartuig of luchtvaartuig buiten Nederland
      opzettelijk gepleegd geweldsmisdrijf ernstig lichamelijk of geestelijk letsel heeft bekomen;

      c. aan nabestaanden en naasten van een onder a of b bedoeld persoon, indien deze ten
      gevolge van het misdrijf is overleden of ernstig en blijvend letsel heeft, als bedoeld in
      [artikel 107, eerste lid, onder b, van Boek 6 van het Burgerlijk Wetboek][ref1], of aan nabestaanden
      van een persoon die als gevolg van overtreding van [artikel 6 van de Wegenverkeerswet 1994][ref2] of van
      [artikel 307 van het Wetboek van Strafrecht][ref3] is overleden;

      d. aan anderen dan de onder c bedoelde personen, die de kosten van lijkbezorging hebben voldaan van een onder a of
      b bedoeld persoon, indien deze ten gevolge van het misdrijf is overleden.

      2 Voor de toepassing van het vorige lid gelden als nabestaanden en naasten:

      a. de niet van tafel en bed gescheiden echtgenoot en de geregistreerde partner van het slachtoffer;

      b. andere bloed- of aanverwanten van het slachtoffer, mits het slachtoffer reeds ten tijde van de gebeurtenis
      waarop de aansprakelijkheid berust geheel of ten dele in hun levensonderhoud voorzag of daartoe krachtens
      rechterlijke uitspraak verplicht was;

      c. degenen die reeds vóór de gebeurtenis waarop de aansprakelijkheid berust, met het slachtoffer in gezinsverband
      samenwoonden en in wier levensonderhoud het slachtoffer geheel of voor een groot deel voorzag, voor zover
      aannemelijk is dat een en ander zonder de gebeurtenis waarop de aansprakelijkheid berust zou zijn voortgezet;

      d. degene die met het slachtoffer in gezinsverband samenwoonde en in wiens levensonderhoud het slachtoffer bijdroeg
      door het doen van de gemeenschappelijke huishouding;

      e. bloedverwanten van het slachtoffer in de eerste graad en in de tweede graad in de zijlijn.

      3 Voor de toepassing van het eerste lid wordt onder opzettelijk gepleegd geweldsmisdrijf begrepen: de strafbare
      poging daartoe.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel307
    url: https://wetten.overheid.nl/BWBR0002979/2020-01-01#Artikel3
