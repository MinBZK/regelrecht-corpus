  - number: '4'
    text: |-
      1 De uitkering wordt naar redelijkheid en billijkheid bepaald. Zij beloopt ten hoogste het bedrag van de door het
      letsel of overlijden veroorzaakte schade, daaronder begrepen immateriële schade van nabestaanden.

      2 Bij ministeriële regeling wordt bepaald welke bedragen ten hoogste kunnen worden uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0002979/2020-01-01#Artikel4
  - number: '5'
    text: |-
      Een uitkering kan achterwege blijven of op een geringer bedrag worden bepaald, indien de toegebrachte schade mede
      een gevolg is van een omstandigheid die aan het slachtoffer of de nabestaande is toe te rekenen.
    url: https://wetten.overheid.nl/BWBR0002979/2020-01-01#Artikel5
  - number: '6'
    text: |-
      1 Bij het doen van een uitkering wordt rekening gehouden met de schadevergoeding die het slachtoffer langs
      burgerrechtelijke weg kan verhalen of heeft verhaald en met overige vergoedingen van schade die als gevolg van het
      misdrijf aan het slachtoffer zijn of kunnen worden verstrekt.

      2 Een uitkering wordt verstrekt onder de voorwaarde dat de schade waarop de uitkering betrekking heeft niet op
      andere wijze is of wordt vergoed. Bij de verstrekking van de uitkering kan de voorwaarde worden gesteld dat het
      slachtoffer een vordering ter zake van de schade op derden aan de Staat overdraagt.

      3 Indien na uitkering de schade op andere wijze wordt of blijkt te zijn vergoed kan de door het slachtoffer
      verkregen vergoeding alsnog in mindering worden gebracht op het bedrag van de uitkering. De commissie kan het
      onverschuldigd betaalde terugvorderen.

      4 De uitkering komt niet in mindering op het recht op schadevergoeding van het slachtoffer jegens derden. Het
      slachtoffer betaalt de uitkering terug aan het fonds, voor zover de schade waarop de uitkering betrekking heeft op
      andere wijze is vergoed.
    url: https://wetten.overheid.nl/BWBR0002979/2020-01-01#Artikel6
  - number: '7'
    text: |-
      Een aanvraag voor een uitkering moet bij de commissie worden ingediend binnen tien jaar na de dag waarop het
      misdrijf is gepleegd. Wordt de aanvraag door een nabestaande gedaan, dan begint die termijn te lopen van de dag van
      het overlijden. Een na afloop van de termijn ingediende aanvraag wordt niettemin behandeld, indien blijkt dat de
      aanvraag zo spoedig is ingediend als redelijkerwijs kon worden verlangd.
    url: https://wetten.overheid.nl/BWBR0002979/2020-01-01#Artikel7
  - number: '8'
    text: |-
      1 Op de aanvraag wordt beslist door een commissie. De commissie kan bij de beoordeling van de aanvraag afwijken van
      het bepaalde bij deze wet, indien toepassing ervan zou leiden tot een onbillijkheid van overwegende aard.

      2 De commissie bestaat uit meervoudige en enkelvoudige kamers. Een meervoudige kamer bestaat uit een oneven aantal
      van ten minste drie leden. Een van de leden wordt door Onze Minister als voorzitter aangewezen. De voorzitter kan,
      gehoord de commissie, uit de leden een plaatsvervangend voorzitter aanwijzen.

      3 De benoeming van de leden van de commissie geschiedt voor ten hoogste vier jaar, behoudens de mogelijkheid van
      eerder ontslag op eigen verzoek. Herbenoeming kan tweemaal, telkens voor ten hoogste vier jaar, plaatsvinden. Het
      lidmaatschap eindigt bij het bereiken van de leeftijd van zeventig jaren.

      4 Aanvragen van eenvoudige aard die bij de commissie aanhangig worden gemaakt, worden in behandeling genomen
      door de enkelvoudige kamer. Indien een aanvraag naar het oordeel van deze kamer ongeschikt is voor behandeling,
      verwijst zij dit naar de meervoudige kamer. De enkelvoudige kamer kan ook in andere gevallen een aanvraag naar de
      meervoudige kamer verwijzen. De verwijzing kan geschieden in elke stand van het onderzoek. De behandeling van de
      verwezen aanvraag wordt voortgezet in de stand waarin het zich bevindt.

      5 Indien een aanvraag naar het oordeel van de meervoudige kamer geschikt is voor verdere behandeling door de
      enkelvoudige kamer, kan zij dit verwijzen naar een enkelvoudige kamer. De vierde en vijfde volzin van het vierde
      lid zijn van toepassing.

      6 Aan de commissie is een secretaris verbonden. Onze Minister sluit, wijzigt en beëindigt de arbeidsovereenkomst
      met de secretaris, gehoord de commissie.

      7 De [Kaderwet zelfstandige bestuursorganen][ref1] is van toepassing op de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0002979/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: '9'
    text: |-
      1 De daarvoor in aanmerking komende autoriteiten, colleges en ambtenaren verschaffen de commissie zo spoedig
      mogelijk de door haar verlangde inlichtingen. De commissie kan ook inlichtingen inwinnen bij andere personen,
      wanneer zij dit ter vervulling van haar taak nodig acht.

      2 De commissie kan getuigen en deskundigen oproepen. De benadeelde is bevoegd bij de ondervraging van de getuigen
      en deskundigen aanwezig te zijn; hij wordt daartoe van de voorgenomen ondervraging in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002979/2020-01-01#Artikel9
  - number: '10'
    text: |-
      De leden van de commissie leggen, alvorens aan de werkzaamheden van de commissie deel te nemen, de eed of belofte
      af, dat zij hun taak overeenkomstig de gestelde voorschriften naar geweten zullen vervullen. Onze Minister geeft
      nadere regels betreffende de wijze waarop de eed of de belofte wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0002979/2020-01-01#Artikel10
  - number: '11'
    text: |-
      Vergoeding voor reis- en verblijfkosten, alsmede voor tijdverzuim, wordt toegekend aan de in
      [artikel 9, tweede lid][ref1], bedoelde getuigen en deskundigen, en aan de benadeelde indien hij op verzoek van de
      commissie in persoon is verschenen. Bij algemene maatregel van bestuur worden nadere regels gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002979#Artikel9
    url: https://wetten.overheid.nl/BWBR0002979/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002979
        artikel: '9'
  - number: '12'
    text: |-
      De inrichting en werkwijze van de commissie en het secretariaat worden nader geregeld bij algemene maatregel van
      bestuur. Daarbij kan worden voorzien in de instelling van een of meer subcommissies die voor bepaald omschreven
      werkzaamheden namens de commissie kunnen optreden.
    url: https://wetten.overheid.nl/BWBR0002979/2020-01-01#Artikel12
  - number: '13'
    text: |-
      1 De commissie kan, vooruitlopend op haar beslissing, een voorlopige uitkering doen.

      2 De beslissing tot het toekennen van een uitkering doet een vordering ontstaan voor het bij die beslissing
      toegekende bedrag. De secretaris zorgt dat de beslissing zo spoedig mogelijk ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0002979/2020-01-01#Artikel13
  - number: 18a
    text: |-
      1 Een ieder die in het Europese deel van Nederland zijn gewone verblijfplaats heeft en die na 1 januari 2006 in een
      andere Lid-Staat van de Europese Unie slachtoffer is geworden van een opzettelijk gepleegd geweldsmisdrijf, kan een
      aanvraag om een uitkering door de desbetreffende Lid-Staat indienen bij de commissie.

      2 De commissie zendt een aanvraag tot uitkering zo spoedig mogelijk door aan de bevoegde instantie van de
      desbetreffende Lid-Staat.

      3 Bij algemene maatregel van bestuur worden regels gesteld omtrent het indienen van een aanvraag om uitkering en de
      procedure van afhandeling daarvan.
    url: https://wetten.overheid.nl/BWBR0002979/2020-01-01#Artikel18a
  - number: '19'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven betreffende het nemen van besluiten door
      de commissie ten aanzien van andere slachtoffers dan bedoeld in [artikel 3][ref1] en [artikel 20][ref2]. Deze
      voorschriften zien op het kunnen verlenen van een uitkering aan natuurlijke personen die slachtoffer zijn geworden
      van een misdrijf of aan hun nabestaanden of naasten.


      [ref1]: https://wetten.overheid.nl/BWBR0002979#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002979#Artikel20
    url: https://wetten.overheid.nl/BWBR0002979/2020-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002979
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002979
        artikel: '20'
  - number: '20'
    text: |-
      1 Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba. Uit het fonds kunnen
      overeenkomstig deze wet uitkeringen worden gedaan:

      a. aan een ieder die in de openbare lichamen als gevolg van een opzettelijk gepleegd geweldsmisdrijf ernstig
      lichamelijk of geestelijk letsel heeft bekomen;

      b. aan een ieder die ten gevolge van een aan boord van een Nederlands vaartuig of luchtvaartuig buiten de openbare
      lichamen Bonaire, Sint Eustatius en Saba opzettelijk gepleegd geweldsmisdrijf ernstig lichamelijk of geestelijk
      letsel heeft bekomen.

      2 Uitkering kan overeenkomstig [artikel 3][ref1] worden gedaan aan de nabestaanden en naasten van een
      in het eerste lid bedoelde persoon, aan nabestaanden van een persoon die als gevolg van overtreding van
      [artikel 320 van het Wetboek van Strafrecht BES][ref2] is overleden, alsmede aan anderen dan hier bedoeld die de
      kosten van lijkbezorging hebben voldaan van een in het eerste lid bedoelde persoon, indien deze ten gevolge van het
      misdrijf is overleden.

      3 Voor de toepassing van het eerste lid wordt onder opzettelijk gepleegd geweldsmisdrijf begrepen: de strafbare
      poging daartoe.


      [ref1]: https://wetten.overheid.nl/BWBR0002979#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel320
    url: https://wetten.overheid.nl/BWBR0002979/2020-01-01#Artikel20
