preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is voorlopige regelen te geven voor de instelling van
    een fonds waaruit uitkeringen kunnen worden toegekend aan personen die ten gevolge van een geweldsmisdrijf zwaar
    lichamelijk letsel hebben bekomen, alsmede aan bepaalde nabestaanden van die personen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002979/2016-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      het fonds: het schadefonds geweldsmisdrijven, bedoeld in [artikel 2][ref1];

      Onze Minister: Onze Minister van Justitie;

      de commissie: de commissie, bedoeld in [artikel 8][ref2], die met het beheer van het fonds is belast;

      de benadeelde: het slachtoffer, onderscheidenlijk de nabestaande, door of namens wie een aanvraag voor een
      uitkering bij het fonds is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002979#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002979#Artikel8
    url: https://wetten.overheid.nl/BWBR0002979/2016-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002979
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002979
        artikel: '8'
  - number: '2'
    text: |-
      1 Er is een schadefonds geweldsmisdrijven. Onze Minister verstrekt het fonds jaarlijks een subsidie voor de
      kosten van de uitvoering van deze wet, voor zover niet op andere wijze in de vergoeding van deze kosten kan worden
      voorzien.

      2 In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is titel 4.2 van die wet
      van toepassing.

      3 Het fonds is rechtspersoon en gevestigd te Rijswijk. De voorzitter van de commissie, of degene die hem vervangt,
      vertegenwoordigt het fonds in en buiten rechte.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel421
    url: https://wetten.overheid.nl/BWBR0002979/2016-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:21
  - number: '3'
    text: |-
      1 Uit het fonds kunnen uitkeringen worden gedaan:

      a. aan een ieder die ten gevolge van een in Nederland opzettelijk gepleegd geweldsmisdrijf ernstig lichamelijk of
      geestelijk letsel heeft bekomen;

      b. aan een ieder die ten gevolge van een aan boord van een Nederlands vaartuig of luchtvaartuig buiten Nederland
      opzettelijk gepleegd geweldsmisdrijf ernstig lichamelijk of geestelijk letsel heeft bekomen;

      c. aan nabestaanden van een onder a of b bedoeld persoon, indien deze ten gevolge van het misdrijf is overleden, of
      aan nabestaanden van een persoon die als gevolg van overtreding van [artikel 6 van de Wegenverkeerswet 1994][ref1]
      of van [artikel 307 van het Wetboek van Strafrecht][ref2] is overleden;

      d. aan anderen dan de onder c bedoelde personen, die de kosten van lijkbezorging hebben voldaan van een onder a of
      b bedoeld persoon, indien deze ten gevolge van het misdrijf is overleden.

      2 Voor de toepassing van het vorige lid gelden als nabestaanden:

      a. de niet van tafel en bed gescheiden echtgenoot en de geregistreerde partner van de overledene;

      b. andere bloed- of aanverwanten van de overledene, mits deze reeds ten tijde van het overlijden geheel of ten dele
      in hun levensonderhoud voorzag of daartoe krachtens rechterlijke uitspraak verplicht was;

      c. degenen die reeds vóór de gebeurtenis waarop de aansprakelijkheid berust, met de overledene in gezinsverband
      samenwoonden en in wier levensonderhoud hij geheel of voor een groot deel voorzag, voor zover aannemelijk is dat
      een en ander zonder het overlijden zou zijn voortgezet;

      d. degene die met de overledene in gezinsverband samenwoonde en in wiens levensonderhoud de overledene bijdroeg
      door het doen van de gemeenschappelijke huishouding;

      e. bloedverwanten van de overledene in de eerste graad en in de tweede graad in de zijlijn.

      3 Voor de toepassing van het eerste lid wordt onder opzettelijk gepleegd geweldsmisdrijf begrepen: de strafbare
      poging daartoe.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel307
    url: https://wetten.overheid.nl/BWBR0002979/2016-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '307'
  - number: '4'
    text: |-
      1 De uitkering wordt naar redelijkheid en billijkheid bepaald. Zij beloopt ten hoogste het bedrag van de door het
      letsel of overlijden veroorzaakte schade, daaronder begrepen immateriële schade van nabestaanden.

      2 Bij ministeriële regeling wordt bepaald welke bedragen ten hoogste kunnen worden uitgekeerd. Deze bedragen kunnen
      verschillen naar gelang van de aard van de schade.
    url: https://wetten.overheid.nl/BWBR0002979/2016-07-01#Artikel4
  - number: '5'
    text: |-
      Een uitkering kan achterwege blijven of op een geringer bedrag worden bepaald, indien de toegebrachte schade mede
      een gevolg is van een omstandigheid die aan het slachtoffer of de nabestaande is toe te rekenen.
    url: https://wetten.overheid.nl/BWBR0002979/2016-07-01#Artikel5
  - number: '6'
    text: |-
      1 Het fonds houdt bij het doen van een uitkering rekening met schadevergoeding die het slachtoffer langs
      burgerrechtelijke weg kan verhalen of heeft verhaald en met overige vergoedingen van schade die als gevolg van het
      misdrijf aan het slachtoffer zijn of kunnen worden vergoed.

      2 In het geval dat het fonds van oordeel is, al dan niet op verzoek van de aanvrager, dat het afwachten van de
      procedures bedoeld in het eerste lid onredelijk lang zou duren, kan het fonds aan de aanvrager een uitkering
      toekennen. Het fonds stelt daarbij de voorwaarde dat het door het slachtoffer ontvangen vergoedingen bedoeld in
      het eerste lid, waarvan het fonds na de uitkering kennis krijgt, alsnog in mindering op het bedrag van de uitkering
      kan brengen.

      3 Het fonds kan bij de toekenning de op grond van het eerste lid door het slachtoffer ontvangen vergoedingen in
      mindering brengen. Indien het fonds na de uitkering kennis krijgt van een aan het slachtoffer gedane vergoeding,
      bedoeld in het eerste lid, kan het dit bedrag alsnog in mindering op het bedrag van de uitkering brengen. Het fonds
      doet mededeling van deze verrekening aan de aanvrager.

      4 De Staat treedt voor het bedrag dat het fonds aan de aanvrager heeft uitgekeerd in de rechten die deze ter zake
      van de door hem geleden schade tegenover derden heeft.
    url: https://wetten.overheid.nl/BWBR0002979/2016-07-01#Artikel6
  - number: '7'
    text: |-
      Een aanvraag voor een uitkering moet bij het fonds worden ingediend binnen tien jaar na de dag waarop het misdrijf
      is gepleegd. Wordt de aanvraag door een nabestaande gedaan, dan begint die termijn te lopen van de dag van het
      overlijden. Een na afloop van de termijn ingediende aanvraag wordt niettemin behandeld, indien blijkt dat de
      aanvraag zo spoedig is ingediend als redelijkerwijs kon worden verlangd.
    url: https://wetten.overheid.nl/BWBR0002979/2016-07-01#Artikel7
  - number: '8'
    text: |-
      1 Op de aanvraag wordt beslist door een commissie die met het beheer van het fonds is belast. De commissie kan bij
      de beoordeling van de aanvraag afwijken van het bepaalde bij deze wet, indien toepassing ervan zou leiden tot een
      onbillijkheid van overwegende aard.

      2 De commissie bestaat uit meervoudige en enkelvoudige kamers. Een meervoudige kamer bestaat uit een oneven aantal
      van ten minste drie leden. Een van de leden wordt door Onze Minister als voorzitter aangewezen. De voorzitter kan,
      gehoord de commissie, uit de leden een plaatsvervangend voorzitter aanwijzen.

      3 De benoeming van de leden van de commissie geschiedt voor ten hoogste vier jaar, behoudens de mogelijkheid van
      eerder ontslag op eigen verzoek. Herbenoeming kan tweemaal, telkens voor ten hoogste vier jaar, plaatsvinden. Het
      lidmaatschap eindigt bij het bereiken van de leeftijd van zeventig jaren.

      4 Aanvragen van eenvoudige aard die bij de commissie aanhangig worden gemaakt, worden in behandeling genomen
      door de enkelvoudige kamer. Indien een aanvraag naar het oordeel van deze kamer ongeschikt is voor behandeling,
      verwijst zij dit naar de meervoudige kamer. De enkelvoudige kamer kan ook in andere gevallen een aanvraag naar de
      meervoudige kamer verwijzen. De verwijzing kan geschieden in elke stand van het onderzoek. De behandeling van de
      verwezen aanvraag wordt voortgezet in de stand waain het zich bevindt.

      5 Indien een aanvraag naar het oordeel van de meervoudige kamer geschikt is voor verdere behandeling door de
      enkelvoudige kamer, kan zij dit verwijzen naar een enkelvoudige kamer. De vierde en vijfde volzin van het vierde
      lid zijn van toepassing.

      6 Aan de commissie is een secretaris verbonden, die door Onze Minister, de commissie gehoord, wordt benoemd en
      ontslagen.

      7 De [Kaderwet zelfstandige bestuursorganen][ref1] is van toepassing op de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0002979/2016-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: '9'
    text: |-
      1 De daarvoor in aanmerking komende autoriteiten, colleges en ambtenaren verschaffen de commissie zo spoedig
      mogelijk de door haar verlangde inlichtingen. De commissie kan ook inlichtingen inwinnen bij andere personen,
      wanneer zij dit ter vervulling van haar taak nodig acht.

      2 De commissie kan getuigen en deskundigen oproepen. De benadeelde is bevoegd bij de ondervraging van de getuigen
      en deskundigen aanwezig te zijn; hij wordt daartoe van de voorgenomen ondervraging in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002979/2016-07-01#Artikel9
  - number: '10'
    text: |-
      De leden van de commissie leggen, alvorens aan de werkzaamheden van de commissie deel te nemen, de eed of belofte
      af, dat zij hun taak overeenkomstig de gestelde voorschriften naar geweten zullen vervullen. Onze Minister geeft
      nadere regels betreffende de wijze waarop de eed of de belofte wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0002979/2016-07-01#Artikel10
  - number: '11'
    text: |-
      Vergoeding voor reis- en verblijfkosten, alsmede voor tijdverzuim, wordt toegekend aan de in
      [artikel 9, tweede lid][ref1], bedoelde getuigen en deskundigen, en aan de benadeelde indien hij op verzoek van de
      commissie in persoon is verschenen. Bij algemene maatregel van bestuur worden nadere regels gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002979#Artikel9
    url: https://wetten.overheid.nl/BWBR0002979/2016-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002979
        artikel: '9'
  - number: '12'
    text: |-
      De inrichting en werkwijze van de commissie en het secretariaat worden nader geregeld bij algemene maatregel van
      bestuur. Daarbij kan worden voorzien in de instelling van een of meer subcommissies die voor bepaald omschreven
      werkzaamheden namens de commissie kunnen optreden.
    url: https://wetten.overheid.nl/BWBR0002979/2016-07-01#Artikel12
  - number: '13'
    text: |-
      1 De commissie kan, vooruitlopend op haar beslissing, een voorlopige uitkering doen.

      2 De beslissing tot het toekennen van een uitkering doet een vordering op het fonds ontstaan voor het bij die
      beslissing toegekende bedrag. De secretaris zorgt dat de beslissing zo spoedig mogelijk ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0002979/2016-07-01#Artikel13
  - number: 18a
    text: |-
      1 Een ieder die in Nederland zijn gewone verblijfplaats heeft en die na 1 januari 2006 in een andere Lid-Staat
      van de Europese Unie slachtoffer is geworden van een opzettelijk gepleegd geweldsmisdrijf, kan een aanvraag om een
      uitkering door de desbetreffende Lid-Staat indienen bij het fonds.

      2 Het fonds zendt een aanvraag tot uitkering zo spoedig mogelijk door aan de bevoegde instantie van de
      desbetreffende Lid-Staat.

      3 Bij algemene maatregel van bestuur worden regels gesteld omtrent het indienen van een aanvraag om uitkering en de
      procedure van afhandeling daarvan.
    url: https://wetten.overheid.nl/BWBR0002979/2016-07-01#Artikel18a
  - number: '19'
    text: |-
      Onze Minister kan nadere regels stellen omtrent de inrichting en de administratie van het fonds en het daarop uit
      te oefenen toezicht.
    url: https://wetten.overheid.nl/BWBR0002979/2016-07-01#Artikel19
  - number: '22'
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld ter uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0002979/2016-07-01#Artikel22
  - number: '23'
    text: |-
      1 Deze wet treedt in werking op een door Ons te bepalen tijdstip.

      2 Geen uitkering wordt toegekend ter zake van enig misdrijf dat vóór 1 januari 1973 is voorgevallen. Tenzij op
      grond van [artikel 7][ref1] een langere termijn van toepassing is, kan ten aanzien van een misdrijf dat op of na
      1 januari 1973, doch vóór het tijdstip van inwerkingtreding van deze wet is voorgevallen, een aanvraag, als in dat
      artikel bedoeld, uiterlijk twee maanden na dat tijdstip worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002979#Artikel7
    url: https://wetten.overheid.nl/BWBR0002979/2016-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002979
        artikel: '7'
  - number: '24'
    text: Deze wet kan worden aangehaald als "Wet schadefonds geweldsmisdrijven".
    url: https://wetten.overheid.nl/BWBR0002979/2016-07-01#Artikel24
