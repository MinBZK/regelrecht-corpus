$id: wet_schadefonds_geweldsmisdrijven
regulatory_layer: WET
publication_date: '2012-07-13'
valid_from: '2002-01-01'
bwb_id: BWBR0002979
url: https://wetten.overheid.nl/BWBR0002979/2002-01-01
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is voorlopige regelen te geven voor de instelling van
    een fonds waaruit uitkeringen kunnen worden toegekend aan personen die ten gevolge van een geweldsmisdrijf zwaar
    lichamelijk letsel hebben bekomen, alsmede aan bepaalde nabestaanden van die personen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder: het fonds: het schadefonds
      geweldsmisdrijven, bedoeld in [artikel 2][ref1]; Onze Minister: Onze Minister van Justitie; de commissie:
      de commissie, bedoeld in [artikel 8][ref2], die met het beheer van het fonds is belast; de benadeelde: het
      slachtoffer, onderscheidenlijk de nabestaande, door of namens wie een verzoek om een uitkering bij het fonds is
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002979#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002979#Artikel8
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002979
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002979
        artikel: '8'
  - number: '2.1'
    text: |-
      Er is een schadefonds geweldsmisdrijven. Onze Minister verstrekt het fonds jaarlijks een subsidie voor de kosten
      van de uitvoering van deze wet, voor zover niet op andere wijze in de vergoeding van deze kosten kan worden
      voorzien.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel2
  - number: '2.2'
    text: |-
      In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is titel 4.2 van die wet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '2.3'
    text: |-
      Het fonds is rechtspersoon en gevestigd te 's-Gravenhage. De voorzitter van de commissie, of degene die hem
      vervangt, vertegenwoordigt het fonds in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel2
  - number: '3.1'
    text: 'Uit het fonds kunnen uitkeringen worden gedaan:'
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel3
  - number: 3.1.a
    text: |-
      aan een ieder die ten gevolge van een in Nederland opzettelijk gepleegd geweldsmisdrijf ernstig lichamelijk of
      geestelijk letsel heeft bekomen;
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel3
  - number: 3.1.b
    text: |-
      aan degene die hun woonplaats hebben op het grondgebied van één van de Lid-Staten van de Europese Gemeenschappen
      die ten gevolge van een aan boord van een Nederlands vaartuig of luchtvaartuig buiten Nederland opzettelijk
      gepleegd geweldsmisdrijf ernstig lichamelijk of geestelijk letsel hebben bekomen;
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel3
  - number: 3.1.c
    text: aan nabestaanden van een onder *a* of *b* bedoeld persoon, indien deze ten gevolge van het misdrijf is overleden.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel3
  - number: '3.2'
    text: 'Voor de toepassing van het vorige lid gelden als nabestaanden:'
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel3
  - number: 3.2.a
    text: |-
      de niet van tafel en bed gescheiden echtgenoot, de achtergebleven geregistreerde partner en de minderjarige
      kinderen tot wie de overledene in familierechtelijke betrekking stond;
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel3
  - number: 3.2.b
    text: |-
      andere bloed- of aanverwanten van de overledene, mits deze reeds ten tijde van het overlijden geheel of ten dele in
      hun levensonderhoud voorzag of daartoe krachtens rechterlijke uitspraak verplicht was;
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel3
  - number: 3.2.c
    text: |-
      degenen die reeds vóór de gebeurtenis waarop de aansprakelijkheid berust, met de overledene in gezinsverband
      samenwoonden en in wier levensonderhoud hij geheel of voor een groot deel voorzag, voor zover aannemelijk is dat
      een en ander zonder het overlijden zou zijn voortgezet en zij redelijkerwijs niet voldoende in hun levensonderhoud
      kunnen voorzien;
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel3
  - number: 3.2.d
    text: |-
      degene die met de overledene in gezinsverband samenwoonde en in wiens levensonderhoud de overledene bijdroeg door
      het doen van de gemeenschappelijke huishouding, voor zover hij schade lijdt doordat na het overlijden op andere
      wijze in de gang van deze huishouding moet worden voorzien.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel3
  - number: '3.3'
    text: |-
      Voor de toepassing van het eerste lid wordt onder opzettelijk gepleegd geweldsmisdrijf begrepen: de strafbare
      poging daartoe.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel3
  - number: '4.1'
    text: |-
      De uitkering wordt naar redelijkheid en billijkheid bepaald. Zij beloopt ten hoogste het bedrag van de door het
      letsel of overlijden veroorzaakte schade. Een uitkering blijft achterwege indien de financiële omstandigheden
      waarin de benadeelde verkeert zodanig zijn, dat de schade zonder overwegend bezwaar door hem of degene van wie hij
      voor zijn onderhoud afhankelijk is, gedragen kan worden, met dien verstande dat bij overlijden alleen in aanmerking
      komen de schade door het derven van levensonderhoud en de kosten van lijkbezorging.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel4
  - number: '4.2'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke bedragen ten hoogste kunnen worden uitgekeerd. Deze bedragen
      kunnen verschillen naar gelang van de aard van de schade.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel4
  - number: '5'
    text: |-
      Een uitkering kan achterwege blijven of op een geringer bedrag worden bepaald, indien de toegebrachte schade mede
      een gevolg is van een omstandigheid die aan het slachtoffer of de nabestaande is toe te rekenen.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel5
  - number: '6.1'
    text: 'Geen uitkering wordt toegekend ter zake van:'
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel6
  - number: 6.1.1°
    text: schade die langs burgerrechtelijke weg is of kan worden verhaald;
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel6
  - number: 6.1.2°
    text: schade in welker vergoeding op andere wijze is of kan worden voorzien.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel6
  - number: '6.2'
    text: |-
      In gevallen waarin het onderzoek naar de vraag of in de vergoeding van de schade niet op andere wijze kan worden
      voorzien, dan wel het invorderen van het bedrag van de schade, zou leiden tot ernstige vertraging in de behandeling
      van het verzoek, of tot van de benadeelde in redelijkheid niet te vergen kosten, kan niettemin bij de uitkering met
      die schade rekening worden gehouden.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel6
  - number: '6.3'
    text: |-
      Het fonds treedt voor het aan de benadeelde uitgekeerde bedrag in de rechten die deze ter zake van de door hem
      geleden schade tegenover derden heeft. Het oefent deze rechten niet uit dan met toestemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel6
  - number: '7.1'
    text: |-
      Een verzoek om een uitkering moet bij het fonds worden ingediend binnen drie jaar na de dag waarop het misdrijf
      is gepleegd. Wordt het verzoek door een nabestaande gedaan, dan begint die termijn te lopen van de dag van het
      overlijden. Een na afloop van de termijn ingediend verzoek wordt niettemin behandeld, indien blijkt dat het verzoek
      zo spoedig is ingediend als redelijkerwijs kon worden verlangd.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel7
  - number: '7.2'
    text: |-
      Indien een verzoek tijdig is ingediend, kan een aanvullend verzoek worden gedaan met betrekking tot schade die ten
      tijde van de indiening van het eerste verzoek nog niet bekend was.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel7
  - number: '8.1'
    text: Op het verzoek wordt beslist door een commissie die met het beheer van het fonds is belast.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel8
  - number: '8.2'
    text: |-
      De commissie bestaat uit een meervoudige kamer en een of meer enkelvoudige kamers. De meervoudige kamer bestaat uit
      vijf leden, die bij koninklijk besluit worden benoemd en ontslagen. Een van die leden wordt door Onze Minister als
      voorzitter aangewezen. Bij koninklijk besluit kunnen tevens zoveel plaatsvervangende leden worden benoemd als nodig
      is. Het lid van de enkelvoudige kamer wordt op voordracht van de meervoudige kamer uit haar midden eveneens door
      Onze Minister aangewezen. De plaatsvervangende leden hebben geen zitting in een enkelvoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel8
  - number: '8.3'
    text: |-
      De benoeming van de leden en plaatsvervangende leden van de commissie geschiedt voor de tijd van vijf jaar,
      behoudens de mogelijkheid van eerder ontslag op eigen verzoek. Zij kunnen éénmaal voor gelijke termijn worden
      herbenoemd. Het lidmaatschap eindigt bij het bereiken van de leeftijd van zeventig jaren.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel8
  - number: '8.4'
    text: |-
      Verzoeken van eenvoudige aard die bij de commissie aanhangig worden gemaakt, worden in behandeling genomen door
      de enkelvoudige kamer. Indien een verzoek naar het oordeel van deze kamer ongeschikt is voor behandeling, verwijst
      zij dit naar de meervoudige kamer. De enkelvoudige kamer kan ook in andere gevallen een verzoek naar de meervoudige
      kamer verwijzen. De verwijzing kan geschieden in elke stand van het onderzoek. De behandeling van het verwezen
      verzoek wordt voortgezet in de stand waain het zich bevindt.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel8
  - number: '8.5'
    text: |-
      Indien een verzoek naar het oordeel van de meervoudige kamer geschikt is voor verdere behandeling door de
      enkelvoudige kamer, kan zij dit verwijzen naar een enkelvoudige kamer. De vierde en vijfde volzin van het vierde
      lid zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel8
  - number: '8.6'
    text: |-
      Aan de commissie is een secretaris verbonden, die door Onze Minister, de commissie gehoord, wordt benoemd en
      ontslagen.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel8
  - number: '9.1'
    text: |-
      De daarvoor in aanmerking komende autoriteiten, colleges en ambtenaren verschaffen de commissie zo spoedig
      mogelijk zoveel mogelijk de door haar verlangde inlichtingen. De commissie kan ook inlichtingen inwinnen bij andere
      personen, wanneer zij dit ter vervulling van haar taak nodig acht.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel9
  - number: '9.2'
    text: |-
      De commissie kan getuigen en deskundigen oproepen. De benadeelde is bevoegd bij de ondervraging van de getuigen en
      deskundigen aanwezig te zijn; hij wordt daartoe van de voorgenomen ondervraging in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel9
  - number: '10'
    text: |-
      De leden en plaatsvervangende leden van de commissie leggen, alvorens aan de werkzaamheden van de commissie deel
      te nemen, de eed of belofte af, dat zij hun taak overeenkomstig de gestelde voorschriften naar geweten zullen
      vervullen. Onze Minister geeft nadere regels betreffende de wijze waarop de eed of de belofte wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel10
  - number: '11'
    text: |-
      De leden en plaatsvervangende leden van de meervoudige kamer genieten vergoeding voor reis- en verblijfkosten en
      verdere vergoeding. Vergoeding voor reis- en verblijfkosten, alsmede voor tijdverzuim, wordt voorts toegekend aan
      de in [artikel 9, tweede lid][ref1], bedoelde getuigen en deskundigen, en aan de benadeelde indien hij op verzoek
      van de commissie in persoon is verschenen. Bij algemene maatregel van bestuur worden nadere regels gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002979#Artikel9
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002979
        artikel: '9'
  - number: '12'
    text: |-
      De inrichting en werkwijze van de commissie en het secretariaat worden nader geregeld bij algemene maatregel van
      bestuur. Daarbij kan worden voorzien in de instelling van een of meer subcommissies die voor bepaald omschreven
      werkzaamheden namens de commissie kunnen optreden.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel12
  - number: '13.1'
    text: De commissie kan, vooruitlopend op haar beslissing, een voorlopige uitkering doen.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel13
  - number: '13.2'
    text: |-
      De beslissing tot het toekennen van een uitkering doet een vordering op het fonds ontstaan voor het bij die
      beslissing toegekende bedrag. De secretaris zorgt dat de beslissing zo spoedig mogelijk ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel13
  - number: '14.1'
    text: |-
      De benadeelde kan binnen zes weken na de dag waarop de beslissing van de commissie is bekendgemaakt een
      verzoekschrift indienen bij het Gerechtshof te 's-Gravenhage, indien:
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel14
  - number: 14.1.a
    text: het verzoek om een uitkering is afgewezen, dan wel
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel14
  - number: 14.1.b
    text: |-
      het bedrag van de toegekende uitkering zodanig is, dat de commissie, alle ter zake dienende omstandigheden in
      aanmerking genomen, niet in redelijkheid tot haar beslissing heeft kunnen komen.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel14
  - number: '14.2'
    text: |-
      De griffier brengt het verzoekschrift ter kennis van de secretaris van de commissie. Deze stelt in zijn archief
      berustende stukken die op de zaak betrekking hebben, onverwijld ter beschikking van het hof.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel14
  - number: '15'
    text: |-
      Wanneer het verzoekschrift kennelijk niet ontvankelijk of ongegrond is, kan het hof daarop terstond beslissen.
      In andere gevallen bepaalt de voorzitter dag en uur voor de behandeling van het verzoekschrift. Hij stelt de
      benadeelde in de gelegenheid het verzoekschrift in persoon of door een gemachtigde te doen toelichten.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel15
  - number: '16.1'
    text: |-
      De behandeling van het verzoekschrift geschiedt overeenkomstig de voorschriften gesteld bij [artikel 9][ref1]
      van deze wet en de [artikelen 27, eerste lid][ref2], [279, vierde lid][ref3], [283, eerste volzin][ref4],
      [286, eerste volzin][ref5], en [290, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering][ref6].
      Oproepingen en mededelingen vinden plaats op de wijze voorgeschreven krachtens de [derde afdeling van de derde
      titel van het eerste boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0002979#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel279
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel283
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel286
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel290
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002979
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '279'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '283'
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '286'
      - id: ref6
        bwb_id: BWBR0001827
        artikel: '290'
  - number: '16.2'
    text: |-
      Onverminderd het eerste lid is de [derde titel van het eerste boek van het Wetboek van burgerlijke rechtsvordering]
      (onbekend) niet van toepassing op verzoeken ingevolge deze wet.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel16
  - number: '17'
    text: |-
      Met de behandeling van het verzoekschrift is een uit drie leden van het hof samengestelde bijzondere kamer belast.
      Alle verhoren kunnen ook aan een van de leden van die kamer worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel17
  - number: '18.1'
    text: |-
      De beschikking van het hof is met redenen omkleed. Zij is niet aan enig rechtsmiddel onderworpen. Afschrift van de
      beschikking wordt aan de benadeelde en de secretaris van de commissie toegezonden.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel18
  - number: '18.2'
    text: |-
      Vernietigt het hof de beslissing van de commissie dan wijst het de zaak naar de commissie terug ten einde daarin
      opnieuw te beslissen.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel18
  - number: '18.3'
    text: |-
      Op de nadere beslissing van de commissie zijn de [artikelen 13][ref1]-[18][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002979#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002979#Artikel18
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002979
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0002979
        artikel: '18'
  - number: '19.1'
    text: |-
      Onze Minister kan nadere regels stellen omtrent de inrichting en de administratie van het fonds en het daarop uit
      te oefenen toezicht.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel19
  - number: '20'
    text: |-
      De commissie doet jaarlijks verslag aan Onze Minister over haar werkzaamheden en de aan deze wet gegeven
      toepassing. Onze Minister zendt dit verslag, met de opmerkingen waartoe het hem aanleiding geeft, aan de Staten-
      Generaal.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel20
  - number: '22'
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld ter uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel22
  - number: '23.1'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel23
  - number: '23.2'
    text: |-
      Geen uitkering wordt toegekend ter zake van enig misdrijf dat vóór 1 januari 1973 is voorgevallen. Tenzij op grond
      van [artikel 7, eerste lid][ref1], een langere termijn van toepassing is, kan ten aanzien van een misdrijf dat op
      of na 1 januari 1973, doch vóór het tijdstip van inwerkingtreding van deze wet is voorgevallen, een verzoek, als in
      dat artikel bedoeld, uiterlijk twee maanden na dat tijdstip worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002979#Artikel7
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002979
        artikel: '7'
  - number: '24'
    text: Deze wet kan worden aangehaald als "Wet schadefonds geweldsmisdrijven".
    url: https://wetten.overheid.nl/BWBR0002979/2002-01-01#Artikel24
