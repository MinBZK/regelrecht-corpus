preamble:
  text: >-
    Gelet op artikel 3, eerste lid, onder c en j van de Kadasterwet;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0041329/2018-09-09#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      Met inachtneming van de brief van de Minister van Infrastructuur en Milieu van 29 september 2017, met kenmerk IENM/
      BSK-2017/230900, waarin de Minister instemming hiervoor geeft en tevens na afstemming hierover met Rijkswaterstaat,
      gaat het bestuur van de Dienst over tot verdere vrijgave van de ruwe GNSS-data, met ingang van één jaar na
      publicatie van dit besluit.
    url: https://wetten.overheid.nl/BWBR0041329/2018-09-09#Artikel1
  - number: '2'
    text: >-
      1 De verdere vrijgave van de ruwe GNSS-data, met een waarnemingsinterval van één seconde, zal in bestandsvorm
      plaatsvinden.


      2 De verdere vrijgave van de ruwe GNSS-data vindt plaats om niet.
    url: https://wetten.overheid.nl/BWBR0041329/2018-09-09#Artikel2
  - number: '3'
    text: >-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0041329/2018-09-09#Artikel3
