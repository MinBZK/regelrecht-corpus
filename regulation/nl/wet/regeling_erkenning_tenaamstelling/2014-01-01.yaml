$id: regeling_erkenning_tenaamstelling
regulatory_layer: WET
publication_date: '2025-10-28'
valid_from: '2014-01-01'
bwb_id: BWBR0034353
url: https://wetten.overheid.nl/BWBR0034353/2014-01-01
preamble:
  text: |-
    Gelet op de artikelen 61a, derde lid, 61b, eerste en tweede lid, en 61c, derde lid, van de Wegenverkeerswet 1994;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel1
  - number: 1.a
    text: |-
      *wet:* [Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 1.b
    text: |-
      *erkenning:* erkenning als bedoeld in [artikel 61a, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel61a
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 61a
  - number: 1.c
    text: |-
      *erkende bedrijf:* rechtspersoon aan wie een erkenning overeenkomstig [artikel 61a, eerste lid, van de wet][ref1]
      is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel61a
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 61a
  - number: '2.1'
    text: |-
      De aanvrager van een erkenning heeft in ten minste 80% van de gemeenten met meer dan 10.000 inwoners een vestiging
      waar de tenaamstelling en schorsing van voertuigen kan worden verleend. Indien de aanvrager in een gemeente geen
      vestiging heeft, heeft hij een vestiging in een naastliggende gemeente.
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel2
  - number: '2.2'
    text: |-
      De aanvrager stelt zekerheid voor een bedrag ter grootte van de geschatte omzet van de te verlenen tenaamstellingen
      en schorsingen over twee maanden Onder omzet wordt verstaan het totale bedrag van de te betalen tarieven dat het
      erkende bedrijf na erkenning aan de Dienst Wegverkeer verschuldigd zal zijn.
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel2
  - number: '2.3'
    text: |-
      De aanvrager legt bij de aanvraag een door de Dienst Wegverkeer goedgekeurd kwaliteitshandboek over waarin een
      beschrijving is opgenomen van de met de tenaamstelling en schorsing samenhangende procedures, de instructies,
      controlemaatregelen, de technische handelingen alsmede de administratieve handelingen, de verantwoordelijkheden,
      bevoegdheden en kennis van het daarbij betrokken personeel.
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het erkende bedrijf meldt wijzigingen in de bedrijfsactiviteit alsmede wijzigingen in de bedrijfsgegevens, voor
      zover deze van belang kunnen zijn voor de erkenning, onverwijld aan de Dienst Wegverkeer op een door deze dienst te
      bepalen elektronische wijze.
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel3
  - number: '3.2'
    text: |-
      Het erkende bedrijf ziet er op toe dat het personeel van het erkende bedrijf, dat betrokken is bij de
      tenaamstelling en schorsing van voertuigen op de hoogte is van de regels die gelden voor de erkenning en dat dit
      personeel de door de Dienst Wegverkeer ter beschikking gestelde of een daarmee vergelijkbare opleidingsmodule met
      betrekking tot identiteitsvaststelling en documentherkenning doorloopt.
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel3
  - number: '3.3'
    text: |-
      Het erkende bedrijf houdt elke vestiging op minimaal vijf dagen per week gedurende minimaal drie aaneengesloten
      uren voor het publiek geopend.
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel3
  - number: '3.4'
    text: |-
      Vanaf de buitenkant van elke vestiging van het erkende bedrijf dat tenaamstellingen en schorsingen van voertuigen
      verricht is op een door de Dienst Wegverkeer vastgestelde wijze zichtbaar dat de erkenning is verleend.
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel3
  - number: '3.5'
    text: |-
      Het erkende bedrijf handelt overeenkomstig het kwaliteitshandboek, bedoeld in [artikel 2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034353#Artikel2
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0034353
        artikel: '2'
  - number: '3.6'
    text: |-
      Het erkend bedrijf tenaamstelling heeft binnen twee jaar na verlening van de erkenning in alle gemeenten met meer
      dan 10.000 inwoners een vestiging. In de gemeenten waarin het bedrijf geen vestiging heeft, heeft het een vestiging
      in een naastliggende gemeente.
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel3
  - number: '4.1'
    text: |-
      Het erkende bedrijf beschikt over richtlijnen voor medewerkers met betrekking tot het veilig gebruik van
      applicaties, wachtwoorden, de herkenning en melding van veiligheidsincidenten en de vernietiging van documenten met
      gevoelige informatie na het afronden van processen.
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel4
  - number: '4.2'
    text: Het erkende bedrijf houdt een administratie van veiligheidsincidenten.
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel4
  - number: '4.3'
    text: |-
      De gegevens die het erkende bedrijf verwerkt en dan wel waarin het inzage heeft worden uitsluitend gebruikt ten
      behoeve van de tenaamstelling en de schorsing van voertuigen.
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel4
  - number: '4.4'
    text: |-
      Het erkende bedrijf maakt gebruik van de door de Dienst Wegverkeer goedgekeurde datacommunicatieapparatuur. Bij
      dit gebruik neemt het bedrijf de door de Dienst Wegverkeer gegeven aanwijzingen in acht. Het bedrijf sluit op
      een uniforme en door de Dienst Wegverkeer voorgeschreven wijze aan op de ICT infrastructuur van deze Dienst. Het
      erkende bedrijf voldoet hierbij aan de navolgende eisen:
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel4
  - number: 4.4.a
    text: |-
      Het erkende bedrijf beschikt over een door de Dienst Wegverkeer verstrekt certificaat om een betrouwbare en
      beveiligde verbinding tot stand te kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel4
  - number: 4.4.b
    text: |-
      Het erkende bedrijf zorgt voor unieke identificatie van de medewerkers op de werkplek waar de tenaamstelling of
      schorsing wordt uitgevoerd. Het vereiste beveiligingsniveau is daarbij minimaal gelijk aan het niveau van een
      gebruikersnaam-wachtwoord combinatie.
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel4
  - number: 4.4.c
    text: |-
      Bij iedere tenaamstelling of schorsing stuurt het erkende bedrijf informatie aan de Dienst Wegverkeer waaruit de
      vestiging blijkt waar de tenaamstellingtransactie wordt uitgevoerd (locatieID).
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel4
  - number: '5.1'
    text: Het erkende bedrijf neemt kennis van het toezichtbeleid dat door de Dienst Wegverkeer wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel5
  - number: '5.2'
    text: |-
      Het erkende bedrijf legt jaarlijks en op verzoek van de Dienst Wegverkeer een accountantsverklaring over waaruit
      blijkt dat het voldoet aan de eisen van de [artikelen 2 tot en met 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034353#Artikel2
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0034353
        artikel: '2'
  - number: '6'
    text: Deze regeling treedt in werking met ingang van 1 januari 2014.
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel6
  - number: '7'
    text: 'Deze regeling wordt aangehaald als: Regeling erkenning tenaamstelling.'
    url: https://wetten.overheid.nl/BWBR0034353/2014-01-01#Artikel7
