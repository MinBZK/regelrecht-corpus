  - number: '2'
    text: |-
      De [Algemene Regeling SZW-subsidies][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009211
    url: https://wetten.overheid.nl/BWBR0020516/2006-12-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009211
  - number: '3'
    text: |-
      1 De Minister verleent op aanvraag aan een werkgever gedurende het kalenderjaar 2007 een subsidie als bijdrage
      in de loonkosten van zijn werknemer. De subsidie bedraagt ten hoogste € 10.573,– per kalenderjaar bij een
      arbeidsovereenkomst met een overeengekomen arbeidsduur van 32 uur of meer uren per week en wordt naar rato
      verminderd naarmate de arbeidsovereenkomst minder dan een jaar heeft geduurd of een arbeidsduur heeft van minder
      dan 32 uur per week of naarmate het gemiddelde aantal arbeidsuren waarover de werkgever loon heeft betaald minder
      dan 32 uur per week bedraagt.

      2 De subsidie, bedoeld in het eerste lid, wordt verleend tot een maximum van het aantal
      bij de werkgever in dienst zijnde werknemers, genoemd in [bijlage 1a][ref1] als bedoeld in
      [artikel 3, tweede lid, van de Regeling schoonmaakdiensten particulieren 2005][ref2].

      3 Indien gedurende het kalenderjaar 2007 met betrekking tot een werknemer positieve uitstroom als bedoeld in
      [artikel 1, onderdeel e, onder 1°][ref3], naar een andere werkgever wordt gerealiseerd, wordt de subsidie, bedoeld
      in het eerste lid, met betrekking tot de loonkosten van die werknemer op dezelfde voet voortgezet tot uiterlijk het
      einde van de duur van de arbeidsovereenkomst met die werknemer, dan wel indien de duur van die arbeidsovereenkomst
      van onbepaalde tijd is of een bepaalde tijd heeft die voortduurt na 1 januari 2007, tot uiterlijk 1 januari 2008.

      4 Het derde lid is niet van toepassing indien aansluitend op, dan wel binnen zes maanden na
      de beëindiging van de RSP-gesubsidieerde arbeidsovereenkomst, met de persoon die op grond van
      die RSP-gesubsidieerde arbeidsovereenkomst werkzaam was een arbeidsovereenkomst als bedoeld in
      [hoofdstuk 3 van de Wet sociale werkvoorziening][ref4] wordt gesloten, een dienstbetrekking wordt aangegaan
      als bedoeld in die wet, een dienstbetrekking wordt aangegaan met toepassing van een voorziening als bedoeld
      in [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref5], dan wel een dienstbetrekking wordt
      aangegaan waarbij anderszins subsidie als bijdrage in de loonkosten van die persoon, of compensatie voor aan die
      persoon verbonden loonkosten wordt verleend.


