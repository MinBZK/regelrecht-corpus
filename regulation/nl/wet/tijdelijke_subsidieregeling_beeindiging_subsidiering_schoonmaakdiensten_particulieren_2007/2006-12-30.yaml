      1 De subsidie, bedoeld in [artikel 3, eerste lid][ref1], wordt aangevraagd door de werkgever.

      2 De subsidie, bedoeld in [artikel 3, eerste lid][ref2], [4, eerste lid][ref3], [5, eerste lid][ref4],
      en [6, eerste lid][ref5], wordt verleend aan de subsidieaanvrager. Indien toepassing is gegeven aan
      [artikel 5, vierde lid][ref6], wordt met betrekking tot de subsidie, bedoeld in [artikel 5, eerste lid][ref7], de
      andere werkgever, bedoeld in [artikel 5, vierde lid][ref8], als subsidieaanvrager aangemerkt.


