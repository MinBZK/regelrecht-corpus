      1 De Minister ontvangt de aanvraag tot subsidieverlening op grond van [artikel 3, eerste lid][ref1], uiterlijk
      24 november 2006.

      2 De subsidieaanvrager maakt bij de indiening van de aanvraag tot subsidieverlening gebruik van het daarvoor
      door de Minister verstrekte formulier, dat is ingericht overeenkomstig het model van [bijlage 1][ref2] bij deze
      regeling.


