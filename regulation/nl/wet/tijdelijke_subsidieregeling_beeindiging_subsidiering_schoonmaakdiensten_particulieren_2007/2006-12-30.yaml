      Indien aan de werkgever subsidie op grond van [artikel 3, eerste lid][ref1],
      wordt verleend, wordt een eenmalig voorschot als bedoeld in
      [artikel 5, achtste lid, van de Regeling schoonmaakdiensten particulieren][ref2], dan wel een eenmalig voorschot
      als bedoeld in [artikel 5, negende lid, van de Regeling schoonmaakdiensten particulieren][ref3] niet bij de
      subsidievaststelling op grond van [artikel 7 van de Regeling schoonmaakdiensten particulieren 2005][ref4] in
      aanmerking genomen, maar bij de subsidievaststelling op grond van [artikel 12][ref5] van deze regeling.


