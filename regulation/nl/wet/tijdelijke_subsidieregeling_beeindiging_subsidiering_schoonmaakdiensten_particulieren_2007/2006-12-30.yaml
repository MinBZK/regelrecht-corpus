  - number: '5'
    text: |-
      1 De Minister verleent aan de werkgever aan wie op grond van [artikel 3, eerste lid][ref1], subsidie wordt
      verleend, een subsidie als bijdrage in de kosten van de door de werkgever ingekochte diensten van een re-
      integratiebedrijf of een arbodienst, gericht op positieve uitstroom van zijn werknemers.

      2 De subsidie, bedoeld in het eerste lid, bedraagt 100% van de door het re-integratiebedrijf of de
      arbodienst in rekening gebrachte en door de werkgever feitelijk betaalde kosten van diensten tot
      een maximum van € 3000,– per werknemer. Tot deze kosten behoort mede de omzetbelasting die niet op
      voet van [artikel 15, eerste lid, van de Wet op de omzetbelasting 1968][ref2] in aftrek kan worden
      gebracht en geen recht geeft op een bijdrage uit het BTW-compensatiefonds, waarbij de toepassing van
      [artikel 2, tiende lid, van de Wet op het BTW-compensatiefonds][ref3], buiten aanmerking blijft. Geen subsidie
      wordt verleend voor zover het betreft onredelijk gemaakte kosten of kosten die redelijkerwijs niet passen in het
      kader van de positieve uitstroom.

      3 De subsidie, bedoeld in het eerste lid, wordt slechts verleend indien de in rekening gebrachte en door de
      werkgever feitelijk betaalde kosten betrekking hebben op diensten die zijn verricht door een re-integratiebedrijf
      dat of arbodienst die in het bezit is van het BOREA Keurmerk Reïntegratie, dan wel voldoet aan de criteria die ten
      grondslag liggen aan het verlenen van het BOREA Keurmerk Reïntegratie, op basis van een schriftelijke overeenkomst
      met de werkgever, waarin in ieder geval is vastgelegd:

      a. de aard, de omvang en de kosten van de door het re-integratiebedrijf of de arbodienst te verrichten diensten;

      b. het resultaat dat met de door het re-integratiebedrijf of de arbodienst te verrichten diensten wordt beoogd;

      c. de verplichting voor het re-integratiebedrijf of de arbodienst om de werkgever te informeren over de voortgang
      van de feitelijk verrichte werkzaamheden en het per werknemer bereikte resultaat;

      d. de verplichting voor het re-integratiebedrijf of de arbodienst om te waarborgen dat ingeval met de werkgever
      overeengekomen werkzaamheden of delen daarvan door het re-integratiebedrijf of de arbodienst worden uitbesteed
      aan een derde, die derde eveneens voldoet aan de criteria die ten grondslag liggen aan het verlenen van het BOREA
      Keurmerk Reïntegratie;

      e. de verplichting voor het re-integratiebedrijf of de arbodienst om te waarborgen dat ingeval met de werkgever
      overeengekomen werkzaamheden of delen daarvan door het re-integratiebedrijf of de arbodienst worden uitbesteed
      aan een derde, het re-integratiebedrijf of de arbodienst geheel en zonder voorbehoud kan voldoen aan zijn
      verplichtingen jegens de werkgever.

      4 De Minister kan op een daartoe strekkend verzoek van een andere werkgever dan de werkgever die de voor subsidie
      in aanmerking te brengen diensten van een re-integratiebedrijf of een arbodienst heeft ingekocht, de in het eerste
      lid bedoelde subsidie geheel of gedeeltelijk aan die andere werkgever verlenen, indien door die andere werkgever
      onder overlegging van bewijsstukken wordt aangetoond dat de werkgever die de voor subsidie in aanmerking te brengen
      diensten van een re-integratiebedrijf of een arbodienst heeft ingekocht, zijn bedrijfsactiviteiten heeft beëindigd.
      Indien de in het eerste lid bedoelde subsidie geheel of gedeeltelijk aan een andere werkgever dan de werkgever die
      de voor subsidie in aanmerking te brengen diensten van een re-integratiebedrijf of een arbodienst heeft ingekocht,
      wordt verleend, zijn het tweede en het derde lid van overeenkomstige toepassing op die andere werkgever.


