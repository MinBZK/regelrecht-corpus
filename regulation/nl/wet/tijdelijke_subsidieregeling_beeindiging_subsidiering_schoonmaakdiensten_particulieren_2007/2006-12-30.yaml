  - number: '6'
    text: |-
      1 De Minister verleent aan de werkgever aan wie op grond van [artikel 3, eerste lid][ref1], subsidie wordt
      verleend, een subsidie voor de realisatie van positieve uitstroom van zijn werknemers.

      2 De subsidie, bedoeld in het eerste lid, wordt verleend tot een maximum van het aantal bij de werkgever in dienst
      zijnde werknemers en bedraagt per werknemer € 3.440,– bij een RSP-gesubsidieerde arbeidsovereenkomst waarin een
      arbeidsduur van 32 uur of meer per week is overeengekomen. Indien in de RSP-gesubsidieerde arbeidsovereenkomst een
      kortere arbeidsduur dan 32 uur per week is overeengekomen wordt de subsidie per werknemer naar rato verlaagd.

      3 De subsidie, bedoeld in het eerste lid, wordt slechts verleend indien de positieve uitstroom:

      a. naar een andere werkgever uiterlijk met ingang 1 januari 2008 wordt gerealiseerd, dan wel,

      b. binnen het bedrijf van de werkgever, of als zelfstandige op of binnen vier weken na 1 januari 2008 wordt
      gerealiseerd.

      4 De subsidie, bedoeld in het eerste lid, wordt niet verleend indien aansluitend op, dan wel binnen zes
      maanden na de beëindiging van de RSP-gesubsidieerde arbeidsovereenkomst, met de persoon die op grond
      van die RSP-gesubsidieerde arbeidsovereenkomst werkzaam was een arbeidsovereenkomst als bedoeld in
      [hoofdstuk 3 van de Wet sociale werkvoorziening][ref2] wordt gesloten, een dienstbetrekking wordt aangegaan
      als bedoeld in die wet, een dienstbetrekking wordt aangegaan met toepassing van een voorziening als bedoeld
      in [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref3], dan wel een dienstbetrekking wordt
      aangegaan waarbij anderszins subsidie als bijdrage in de loonkosten van die persoon, of compensatie voor aan die
      persoon verbonden kosten wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0020516#Artikel3
