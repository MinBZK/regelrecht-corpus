  - number: '10'
    text: |-
      1 De beslissing op de volledige aanvraag tot subsidieverlening wordt uiterlijk binnen vier weken na 24 november
      2006 genomen.

      2 De subsidie, bedoeld in [artikel 3, eerste lid][ref1], wordt verleend met ingang 1 januari 2007.

      3 De Minister betaalt de subsidie, bedoeld in [artikel 3, eerste lid][ref2], bij wijze van voorschot per kwartaal.
      De betaling vindt plaats aan de hand van een declaratie van het aantal arbeidsuren waarover de werkgever loon
      heeft betaald, tot een maximum van het aantal in de beschikking tot subsidieverlening opgenomen arbeidsuren. In de
      declaratie vermeldt de subsidieaanvrager tevens het aantal werknemers met wie de arbeidsovereenkomst is beëindigd,
      de ingangsdata van de beëindiging van de arbeidsovereenkomsten, alsmede het aantal werknemers ten aanzien van wie
      sprake is van positieve uitstroom.

      4 De subsidieaanvrager maakt bij de indiening van een declaratie als bedoeld in het derde lid, gebruik van het
      daarvoor door de Minister verstrekte formulier, dat is ingericht overeenkomstig het model van [bijlage 2][ref3] bij
      deze regeling.

      5 De subsidieaanvrager draagt er zorg voor dat de relevante gegevens over een kwartaal van het jaar 2007, opgenomen
      in een door hem ondertekende declaratie als bedoeld in het vierde lid, door de Minister zijn ontvangen uiterlijk op
      de twintigste van de tweede maand volgende op het kwartaal waarop deze betrekking heeft.

      6 Het voorschot, bedoeld in het derde lid, wordt betaald op of omstreeks de dertigste van de maand volgend op de
      maand waarin de declaratie is ontvangen.

      7 In afwijking van het zesde lid wordt het voorschot met betrekking tot het eerste kwartaal
      2007 en volgende kwartalen niet betaald, zolang de Minister van de subsidieaanvrager de
      bescheiden, nodig voor de subsidievaststelling betreffende subsidieverstrekkingen op grond van de
      [Regeling schoonmaakdiensten particulieren 2005][ref4], over de kalenderjaren 2004 en 2005 niet heeft ontvangen
      en wordt het voorschot met betrekking tot het derde kwartaal 2007 en het volgende kwartaal niet betaald,
      zolang de Minister van de subsidieaanvrager de bescheiden, nodig voor de subsidievaststelling betreffende
      subsidieverstrekkingen op grond van de [Regeling schoonmaakdiensten particulieren 2005][ref5], over het jaar 2006
      niet heeft ontvangen.

      8 Indien vóór de subsidievaststelling een verzoek tot faillietverklaring van of verlening van surseance van
      betaling aan de subsidieaanvrager is ingediend, vindt geen betaling van een voorschot als bedoeld in het derde lid
      meer plaats.

      9 De subsidie, bedoeld in [artikel 4, eerste lid][ref6], wordt uiterlijk betaald tezamen met het voorschot,
      bedoeld in het derde lid, met betrekking tot het vierde kwartaal van het jaar 2007. Indien de Minister besluit
      tot gehele of gedeeltelijke betaling van deze subsidie op een eerder tijdstip, doet hij daarvan mededeling in de
      Staatscourant.

      10 De subsidie, bedoeld in [artikel 5, eerste lid][ref7], en [6, eerste lid][ref8], wordt na subsidievaststelling
      vanaf het kalenderjaar 2008 betaald. Indien de Minister besluit tot gehele of gedeeltelijke betaling van de
      subsidie, bedoeld in [artikel 5, eerste lid][ref9], op een eerder tijdstip, doet hij daarvan mededeling in de
      Staatscourant.


