articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Minister: de Minister van Sociale Zaken en Werkgelegenheid;

      b. werkgever: de werkgever, genoemd in [bijlage 1a][ref1] als bedoeld in
      [artikel 3, tweede lid, van de Regeling schoonmaakdiensten particulieren 2005][ref2], zoals [die bijlage][ref3]
      luidde op 1 november 2006;

      c. RSP-gesubsidieerde arbeidsovereenkomst: een arbeidsovereenkomst die op 1 november 2006 op grond van
      [artikel 2 van de Regeling schoonmaakdiensten particulieren 2005][ref4] wordt gesubsidieerd;

      d. werknemer: de werknemer die op 1 november 2006 werkzaam is op grond van een RSP-gesubsidieerde
      arbeidsovereenkomst, waarvan de overeengekomen duur in ieder geval eindigt na 1 januari 2007;

      e. positieve uitstroom: het beëindigen van een RSP-gesubsidieerde arbeidsovereenkomst, waarbij de persoon die op
      grond van de RSP-gesubsidieerde arbeidsovereenkomst werkzaam was, aansluitend op, dan wel binnen vier weken na de
      beëindiging van die RSP-gesubsidieerde arbeidsovereenkomst:

      1°. op grond van een andere schriftelijke arbeidsovereenkomst, dan wel een aanstelling in openbare dienst ten
      minste zes maanden werkzaam is tegen een loon dat, of een bezoldiging die ten minste gelijk is aan het loon dat de
      werkgever op grond van de RSP-gesubsidieerde arbeidsovereenkomst over een periode van zes maanden verschuldigd was,
      dan wel

      2°. ten minste zes maanden als zelfstandige werkzaam is en in die periode geen aanspraak doet op
      een uitkering op grond van de [Werkloosheidswet][ref5], de [Wet werk en bijstand][ref6] of het
      [Besluit bijstandverlening zelfstandigen 2004][ref7], dan wel indien op het tijdstip van de beëindiging van de
      RSP-gesubsidieerde arbeidsovereenkomst reeds aanspraak op een uitkering op grond van de [Werkloosheidswet][ref8]
      of de [Wet werk en bijstand][ref9] bestond, geen aanspraak doet op een hogere uitkering op grond van de
      [Werkloosheidswet][ref10] of de [Wet werk en bijstand][ref11];

      f. re-integratiebedrijf: natuurlijke persoon of rechtspersoon die in het kader van de uitoefening van zijn beroep
      of bedrijf de inschakeling van personen in het arbeidsproces bevordert;

      g. arbodienst: een arbodienst als bedoeld in de [Arbeidsomstandighedenwet 1998][ref12];

      h. BOREA Keurmerk Reïntegratie: het keurmerk van de Brancheorganisatie re-integratiebedrijven te Tilburg;

      i. accountant: een accountant als bedoeld in [artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref13].


