  - number: '11'
    text: |-
      1 De subsidieaanvrager draagt er zorg voor dat de administratie voor de uitvoering van deze regeling zodanig
      wordt ingericht, dat alle van belang zijnde vastleggingen en bewijsstukken ten behoeve van het besluitvormings-,
      uitvoerings-, controle- en verantwoordingsproces tijdig, zichtbaar en controleerbaar zijn vastgelegd.

      2 Van de administratie maken in ieder geval deel uit:

      a. de op grond van [artikel 2 van de Regeling schoonmaakdiensten particulieren 2005][ref1] gesubsidieerde
      arbeidsovereenkomsten die op en na 1 november 2006 van kracht zijn;

      b. de loonstaten vanaf 1 november 2006;

      c. de overeenkomsten met een re-integratiebedrijf of een arbodienst;

      d. de informatie van het re-integratiebedrijf of de arbodienst aan de werkgever over de voortgang van de feitelijk
      verrichte werkzaamheden en het per werknemer bereikte resultaat;

      e. facturen met betrekking tot de door een re-integratiebedrijf of een arbodienst in rekening gebrachte diensten
      en bescheiden met betrekking tot door de werkgever feitelijk betaalde kosten van de ingekochte diensten van een re-
      integratiebedrijf of een arbodienst;

      f. bescheiden op grond waarvan de realisatie positieve uitstroom kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018541#Artikel2
    url: https://wetten.overheid.nl/BWBR0020516/2006-12-30#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018541
        artikel: '2'
  - number: '12'
    text: |-
      1 De Minister ontvangt van de subsidieaanvrager uiterlijk 1 juli 2008 een einddeclaratie, waarin alle
      relevante gegevens zijn opgenomen met betrekking tot de subsidie, bedoeld in [artikel 3, eerste lid][ref1],
      [4, eerste lid][ref2], en [5, eerste lid][ref3]. Met betrekking tot de subsidie, bedoeld in
      [artikel 6, eerste lid][ref4], ontvangt de Minister van de subsidieaanvrager uiterlijk 1 januari 2010
      een einddeclaratie, waarin alle relevante gegevens zijn opgenomen met betrekking tot die subsidie. De
      einddeclaratie met betrekking tot de subsidie, bedoeld in [artikel 3, eerste lid][ref5], [4, eerste lid][ref6],
      en [5, eerste lid][ref7], tezamen, dan wel de einddeclaratie met betrekking tot de subsidie, bedoeld in
      [artikel 6, eerste lid][ref8], is bij een subsidie boven € 50.000,– voorzien van een verklaring van een accountant.

      2 De Minister stelt de subsidie vast binnen 12 maanden na ontvangst van de einddeclaratie met betrekking tot de
      subsidie, bedoeld in [artikel 3, eerste lid][ref9], [4, eerste lid][ref10], en [5, eerste lid][ref11], en, indien
      vereist, de daarop betrekking hebbende verklaring van een accountant, en binnen 12 maanden na ontvangst van de
      einddeclaratie met betrekking tot de subsidie, bedoeld in [artikel 6, eerste lid][ref12], en, indien vereist, de
      daarop betrekking hebbende verklaring van een accountant.

      3 Indien de bescheiden, genoemd in het eerste lid, met betrekking tot de subsidie, bedoeld in
      [artikel 3, eerste lid][ref13], [4, eerste lid][ref14], en [5, eerste lid][ref15], niet uiterlijk 1 juli
      2008 door de Minister zijn ontvangen, kan de Minister de subsidie, bedoeld in [artikel 3, eerste lid][ref16],
      [4, eerste lid][ref17], en [5, eerste lid][ref18], ambtshalve vaststellen. Indien de bescheiden, genoemd in het
      eerste lid, met betrekking tot de subsidie, bedoeld in [artikel 6, eerste lid][ref19], niet uiterlijk 1 januari
      2010 door de Minister zijn ontvangen, kan de Minister de subsidie, bedoeld in [artikel 6, eerste lid][ref20],
      ambtshalve vaststellen.

      4 De vastgestelde subsidie kan van de bij wijze van voorschot betaalde subsidie afwijken indien de
      subsidieaanvrager handelt in strijd met deze regeling. Indien de subsidieaanvrager in het kader van de
      subsidieaanvraag of in het kader van de einddeclaratie onjuiste gegevens heeft verstrekt, dan wel voor
      subsidieverlening of subsidievaststelling relevante gegevens heeft achtergehouden, kan de Minister de
      subsidie, bedoeld in [artikel 3, eerste lid][ref21], [4, eerste lid][ref22], [5, eerste lid][ref23], en
      [6, eerste lid][ref24], intrekken of ten nadele van de subsidieaanvrager wijzigen.


