    text: |-
      1 Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst met uitzondering van de [artikelen 16][ref1] en [17][ref2] die in werking treden met ingang van
      30 december 2006.

      2 Deze regeling vervalt met ingang van 1 januari 2011.

      3 In afwijking van het tweede lid blijft deze regeling, zoals die luidt op 31 december 2010, van toepassing op de
      afwikkeling van de subsidie, bedoeld in deze regeling.


