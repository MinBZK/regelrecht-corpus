    text: |-
      1 De Minister verleent aan de werkgever aan wie op grond van [artikel 3, eerste lid][ref1], subsidie wordt
      verleend, een subsidie als bijdrage in de kosten van de door de werkgever verrichte activiteiten, gericht op
      positieve uitstroom van zijn werknemers.

      2 De subsidie, bedoeld in het eerste lid, bedraagt € 1500,– per werknemer tot een maximum van het aantal bij de
      werkgever in dienst zijnde werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0020516#Artikel3
