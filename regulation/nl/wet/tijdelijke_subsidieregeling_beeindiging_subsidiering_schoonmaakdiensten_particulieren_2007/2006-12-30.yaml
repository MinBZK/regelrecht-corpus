  - number: '14'
    text: |-
      1 Na de subsidievaststelling is de subsidieaanvrager verplicht een teveel ontvangen voorschot onverwijld terug te
      betalen, tenzij de Minister tot verrekening op andere wijze heeft besloten.

      2 Bij terugvordering van onverschuldigd betaalde subsidiebedragen en voorschotten worden de met de terugvordering
      verband houdende kosten bij de subsidieaanvrager in rekening gebracht. Tevens wordt in dat geval overgegaan tot het
      in rekening brengen van de wettelijke rente.
    url: https://wetten.overheid.nl/BWBR0020516/2006-12-30#Artikel14
  - number: '15'
    text: |-
      1 Met het toezicht op de naleving van de in deze regeling opgenomen verplichtingen is belast het Agentschap van het
      Ministerie van Sociale Zaken en Werkgelegenheid.

      2 De subsidieaanvrager verstrekt aan de Minister desgevraagd kosteloos alle inlichtingen, die hij voor evaluatie,
      informatievoorziening en beleidsvorming met betrekking tot deze regeling nodig heeft en verleent daartoe inzage in
      terzake van belang zijnde bescheiden.

      3 De subsidieaanvrager werkt mee aan door of namens de Minister uit te voeren onderzoeken en draagt er zorg voor
      dat de accountant hieraan kosteloos meewerkt. De daaraan verbonden kosten worden geacht te zijn begrepen in de
      subsidie.
    url: https://wetten.overheid.nl/BWBR0020516/2006-12-30#Artikel15
  - number: '18'
    text: |-
      1 De [Regeling schoonmaakdiensten particulieren 2005][ref1] wordt met ingang van 1 januari 2007 ingetrokken.

      2 In afwijking van het eerste lid blijft de [regeling schoonmaakdiensten particulieren 2005][ref2], zoals deze
      luidde op 31 december 2006, van toepassing op de afwikkeling van de subsidie, bedoeld in [die regeling][ref3].


