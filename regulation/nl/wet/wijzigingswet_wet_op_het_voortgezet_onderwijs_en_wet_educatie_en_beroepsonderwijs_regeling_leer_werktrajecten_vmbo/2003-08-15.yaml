  - number: III
    text: |-
      1 Deze wet treedt, behoudens het bepaalde in het tweede lid, in werking op een bij koninklijk besluit te bepalen
      tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.

      2 [Artikel IIb][ref1] vervalt twee jaar na de datum waarop het in [artikel I, onderdeel A][ref2], opgenomen
      [artikel 10b4 van de Wet op het voortgezet onderwijs][ref3] in werking is getreden.


