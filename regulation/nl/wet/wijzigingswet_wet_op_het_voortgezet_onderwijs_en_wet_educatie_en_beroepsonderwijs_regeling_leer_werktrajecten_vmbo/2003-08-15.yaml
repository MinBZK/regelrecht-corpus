preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat binnen de basisberoepsgerichte leerweg van
    het voorbereidend middelbaar beroepsonderwijs leer-werktrajecten kunnen worden ingericht om te bevorderen dat
    deelnemers aan deze leerweg een startkwalificatie behalen in de basisberoepsopleiding van de Wet educatie en
    beroepsonderwijs;

    dat daartoe een samenhangende leerroute en een goede aansluiting van de leer-werktrajecten op het beroepsonderwijs
    van de Wet educatie en beroepsonderwijs, verzekerd dienen te zijn;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015280/2003-08-15#ArtikelAanhef
articles:
  - number: IIa
    text: |-
      De bekostiging van de landelijke organen voor het beroepsonderwijs ten behoeve van hun taken,
      geregeld in [artikel 10b4 van de Wet op het voortgezet onderwijs][ref1] zoals luidend ingevolge
      [artikel I, onderdeel A, van deze wet][ref2], geschiedt tot een bij koninklijk besluit te bepalen tijdstip volgens
      bij ministeriële regeling vast te stellen voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b4
      [ref2]: https://wetten.overheid.nl/BWBR0015280#ArtikelI
