---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: muntwet_2002
regulatory_layer: WET
publication_date: '2023-02-21'
valid_from: '2015-01-01'
bwb_id: BWBR0013064
url: https://wetten.overheid.nl/BWBR0013064/2015-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, in verband met de invoering van de chartale euro met ingang van 1
    januari 2002 en ter uitvoering van artikel 106 van de Grondwet, wenselijk is de Muntwet 1987 te vervangen door een
    nieuwe wettelijke regeling van het Nederlandse muntstelsel;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde, wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel1
  - number: 1.a
    text: 'Onze minister: Onze minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel1
  - number: 1.b
    text: |-
      Euromunten: de euromuntstukken, bedoeld in artikel 1 van [Verordening (EG) nr. 975/98](31998R0975) van de Raad
      van de Europese Unie van 3 mei 1998 over de denominaties en technische specificaties van voor circulatie bestemde
      euromuntstukken (PbEG L 139);
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel1
  - number: 1.c
    text: |-
      Nederlandse euromunten: de euromuntstukken uitgegeven door de Staat der Nederlanden overeenkomstig artikel 11 van
      [Verordening (EG) nr. 974/98](31998R0974) van de Raad van de Europese Unie van 3 mei 1998 tot invoering van de euro
      (PbEG L 139);
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel1
  - number: 1.d
    text: |-
      verordening valsemunterij: verordening (EG) nr. 1338/2001 van de Raad van de Europese Unie van 28 juni 2001 tot
      vaststelling van maatregelen die noodzakelijk zijn voor de bescherming van de euro tegen valsemunterij (PbEG 2001,
      L 181);
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel1
  - number: 1.e
    text: |-
      verordening echtheids- en geschiktheidscontrole euromunten: verordening (EU) Nr. 1210/2010 van het Europees
      Parlement en de Raad van 15 december 2010 betreffende de echtheidscontrole van euromunten en de behandeling van
      euromunten die ongeschikt zijn voor de circulatie (PbEU 2010, L 339).
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel1
  - number: '2'
    text: |-
      De munten die door de Staat der Nederlanden worden uitgegeven zijn Nederlandse euromunten, bijzondere munten met de
      hoedanigheid van wettig betaalmiddel, beleggingsmunten en munten zonder de hoedanigheid van wettig betaalmiddel.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel2
  - number: '3.1'
    text: |-
      De bestanddelen van de beeldenaars van de nationale zijde van de Nederlandse euromunten worden bij koninklijk
      besluit vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel3
  - number: '3.2'
    text: |-
      De in het eerste lid bedoelde munten dragen in ieder geval de beeltenis en de naam van de Koning (Koningin) en de
      woorden: Koning (Koningin) der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel3
  - number: '3.3'
    text: |-
      In het kader van een Europees herdenkingsthema kan ten aanzien van de Nederlandse euromunten van twee euro worden
      afgeweken van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel3
  - number: '4.1'
    text: |-
      De denominaties van de bijzondere munten met de hoedanigheid van wettig betaalmiddel, de materialen waaruit deze
      munten zijn vervaardigd, de gewichten en de afmetingen, alsmede de bedragen tot welke zij de hoedanigheid van
      wettig betaalmiddel hebben, worden bij algemene maatregel van bestuur vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel4
  - number: '4.2'
    text: |-
      De bestanddelen van de beeldenaars van de in het eerste lid genoemde munten worden bij koninklijk besluit
      vastgesteld. Deze munten dragen in ieder geval op de voorzijde de beeltenis en de naam van de Koning met de
      woorden: Koning (Koningin) der Nederlanden, en op de keerzijde de waardeaanduiding.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel4
  - number: 4a.1
    text: 'Beleggingsmunten zijn:'
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel4a
  - number: 4a.1.a
    text: |-
      een gouden munt van tweehonderdvijftig-euro met een goudgehalte van 999,9 duizendste, een gewicht van 31,103
      gram met een afwijking van ten hoogste 0,093 gram en een middellijn van 37,0 millimeter met een afwijking van ten
      hoogste 0,10 millimeter;
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel4a
  - number: 4a.1.b
    text: |-
      een gouden munt van honderd-euro met een goudgehalte van 999,9 duizendste, een gewicht van 15,552 gram met een
      afwijking van ten hoogste 0,078 gram en een middellijn van 28,0 millimeter met een afwijking van ten hoogste 0,10
      millimeter;
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel4a
  - number: 4a.1.c
    text: |-
      een gouden munt van vijftig-euro met een goudgehalte van 999,9 duizendste, een gewicht van 7,776 gram met een
      afwijking van ten hoogste 0,062 gram en een middellijn van 22,0 millimeter met een afwijking van ten hoogste 0,10
      millimeter;
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel4a
  - number: 4a.1.d
    text: |-
      een gouden munt van vijfentwintig-euro met een goudgehalte van 999,9 duizendste, een gewicht van 3,110 gram met
      een afwijking van ten hoogste 0,037 gram en een middellijn van 16,0 millimeter met een afwijking van ten hoogste
      0,10 millimeter;
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel4a
  - number: 4a.1.e
    text: |-
      een zilveren munt van tweeëneenhalve-euro met een zilvergehalte van 999 duizendste, een gewicht van 31,103 gram
      met een afwijking van ten hoogste 0,25 gram en een middellijn van 37,0 millimeter met een afwijking van ten hoogste
      0,10 millimeter.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel4a
  - number: 4a.2
    text: |-
      De beeldenaar van de beleggingsmunten is op de voorzijde de beeltenis en de naam van de Koning (Koningin) met
      de woorden «Koning (Koningin) der Nederlanden» en op de keerzijde het Gekroond rijkswapen met daaronder de tekst
      «Nederland», de waardeaanduiding, het gehalte edelmetaal, het jaartal van uitgifte, het teken van de Koninklijke
      Nederlandse Munt en het teken van de Muntmeester.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel4a
  - number: 4a.3
    text: De beleggingsmunten hebben een geribbelde rand.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel4a
  - number: '5.1'
    text: 'Munten zonder de hoedanigheid van wettig betaalmiddel zijn:'
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel5
  - number: 5.1.a
    text: de gouden dukaat;
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel5
  - number: 5.1.b
    text: de dubbele gouden dukaat;
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel5
  - number: 5.1.c
    text: de zilveren dukaat.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel5
  - number: '5.2'
    text: |-
      De gouden dukaat heeft een goudgehalte van 983 duizendste, een gewicht van 3,494 gram met een afwijking van ten
      hoogste vier duizendste en een middellijn van 21 millimeter.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel5
  - number: '5.3'
    text: |-
      De dubbele gouden dukaat heeft een goudgehalte van 983 duizendste, een gewicht van 6,988 gram met een afwijking van
      ten hoogste vier duizendste en een middellijn van 26 millimeter.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel5
  - number: '5.4'
    text: |-
      De beeldenaar van de gouden dukaat en de dubbele gouden dukaat is op de voorzijde een geharnaste man tussen de
      cijfers van het jaartal, met het omschrift: CONCORDIA RES PARVAE CRESCUNT, het teken van de Koninklijke Nederlandse
      Munt en het teken van de muntmeester: de beeldenaar is op de keerzijde binnen een versierd vierkant: MO. AUR REG.
      BELGII AD LEGEM IMPERII. De munten zijn voorzien van een kabelrand.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel5
  - number: '5.5'
    text: |-
      De zilveren dukaat heeft een zilvergehalte van 873 duizendste, een gewicht van 28,25 gram met een afwijking van ten
      hoogste vijf duizendste en een middellijn van 40 millimeter.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel5
  - number: '5.6'
    text: |-
      De beeldenaar van de zilveren dukaat is op de voorzijde hetzij een geharnaste man met het Rijkswapen voor het
      linkerbeen en met het opschrift: MO.NO.ARG.REG.BELGII, hetzij een geharnaste man met het wapen van een Nederlandse
      provincie voor het linkerbeen en met het opschrift: MO.NO.ARG.REG.BELGII en de naam van de provincie; is op de
      keerzijde het Rijkswapen met de Koninklijke Kroon tussen de cijfers van het jaartal, met het opschrift: CONCORDIA
      RES PARVAE CRESCUNT, het teken van de Koninklijke Nederlandse Munt en het teken van de muntmeester.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel5
  - number: '6.1'
    text: |-
      De munten, bedoeld in [artikel 2][ref1], worden uitsluitend in opdracht van de Staat der Nederlanden vervaardigd en
      uitsluitend door de Staat der Nederlanden uitgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0013064#Artikel2
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013064
        artikel: '2'
  - number: '6.2'
    text: |-
      De in het eerste lid bedoelde opdracht wordt verleend onder het beding dat de naar het oordeel van Onze minister in
      verband met het vervaardigen van munten noodzakelijke veiligheidsmaatregelen in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel6
  - number: '6.3'
    text: |-
      De in het eerste lid bedoelde opdracht wordt verleend met inachtneming van artikel 128, tweede lid, van het Verdrag
      betreffende de werking van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel6
  - number: 6a.1
    text: De algemeen directeur van de Koninklijke Nederlandse Munt voert de titel Muntmeester.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel6a
  - number: 6a.2
    text: |-
      De bij de Koninklijke Nederlandse Munt in opdracht van de Staat der Nederlanden vervaardigde munten worden voorzien
      van het teken van de Koninklijke Nederlandse Munt en het teken van de Muntmeester.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel6a
  - number: 6a.3
    text: |-
      Het teken van de Koninklijke Nederlandse Munt en het teken van de Muntmeester worden bij ministeriële regeling
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel6a
  - number: '7'
    text: |-
      Bij ministeriële regeling worden de buitenomloopstelling en de inwisseling van buitenomloopgestelde bijzondere
      munten, als bedoeld in [artikel 4][ref1], geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0013064#Artikel4
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013064
        artikel: '4'
  - number: '8.1'
    text: Niemand is gehouden valse of vervalste munten aan te nemen.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel8
  - number: '8.2'
    text: |-
      Euromunten en de munten, bedoeld in de [artikelen 4][ref1], [4a][ref2] en [5][ref3] die vermoed worden vals of
      vervalst te zijn, kunnen aan een door Onze minister aan te wijzen instantie ter beoordeling worden voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0013064#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013064#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0013064#Artikel5
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013064
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0013064
        artikel: 4a
      - id: ref3
        bwb_id: BWBR0013064
        artikel: '5'
  - number: '8.3'
    text: |-
      Indien de munten naar het oordeel van de in het tweede lid bedoelde instantie vals of vervalst zijn, worden ze in
      beslag genomen. Indien de munten naar het oordeel van die instantie niet vals of vervalst zijn:
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel8
  - number: 8.3.a
    text: |-
      wordt van euromunten of munten als bedoeld in [artikel 4][ref1] de nominale waarde vergoed;


      [ref1]: https://wetten.overheid.nl/BWBR0013064#Artikel4
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013064
        artikel: '4'
  - number: 8.3.b
    text: |-
      wordt van munten als bedoeld in de [artikel 5][ref1] de stoffelijke waarde vergoed of worden die munten
      teruggegeven in de staat waarin zij zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0013064#Artikel5
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013064
        artikel: '5'
  - number: '8.4'
    text: Onze minister kan regels stellen betreffende de beoordeling, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel8
  - number: '9.1'
    text: |-
      Euromunten en bijzondere munten met de hoedanigheid van wettig betaalmiddel die ongeschikt zijn voor de circulatie,
      kunnen worden ingeleverd bij de op grond van [artikel 8, tweede lid][ref1], aangewezen instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0013064#Artikel8
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013064
        artikel: '8'
  - number: '9.2'
    text: |-
      De in het eerste lid bedoelde instantie weigert munten in ontvangst te nemen, indien de ontvangst of behandeling
      daarvan gevaar voor de gezondheid van het behandelend personeel inhoudt.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel9
  - number: '9.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de verpakking en wijze van aanlevering
      van de in het eerste lid bedoelde munten.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel9
  - number: '9.4'
    text: |-
      De in het eerste lid bedoelde instantie vergoedt de nominale waarde van de op grond van het eerste lid ingeleverde
      munten.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel9
  - number: '9.5'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de behandelingsvergoeding, bedoeld in artikel
      9 van de verordening echtheids- en geschiktheidscontrole euromunten, die op de te vergoeden nominale waarde van de
      ingeleverde munten in mindering wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel9
  - number: '9.6'
    text: |-
      De waarde van munten die opzettelijk zijn veranderd of een bewerking hebben ondergaan waarvan redelijkerwijs is te
      verwachten dat ze de munt verandert, wordt niet vergoed.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel9
  - number: '10.1'
    text: |-
      Met het toezicht op de naleving van artikel 6, eerste lid, van de verordening valsemunterij, voor zover dat artikel
      betrekking heeft op euromunten, en de artikelen 3, eerste en tweede lid, en 4, eerste lid, van de verordening
      echtheids- en geschiktheidscontrole euromunten zijn belast de bij besluit van De Nederlandsche Bank N.V. aangewezen
      personen.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel10
  - number: '10.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel10
  - number: '11.1'
    text: 'De Nederlandsche Bank N.V. is bevoegd tot oplegging van een last onder dwangsom ter handhaving van:'
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel11
  - number: 11.1.a
    text: artikel 6, eerste lid, van de verordening valsemunterij, voor zover dat artikel betrekking heeft op euromunten;
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel11
  - number: 11.1.b
    text: |-
      de artikelen 3, eerste en tweede lid, en 4, eerste lid, van de verordening echtheids- en geschiktheidscontrole
      euromunten;
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel11
  - number: 11.1.c
    text: |-
      [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '11.2'
    text: |-
      De Nederlandsche Bank N.V. is tevens bevoegd tot oplegging van een bestuurlijke boete ter zake van overtreding van
      de in het eerste lid genoemde artikelen.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel11
  - number: '11.3'
    text: |-
      Bij algemene maatregel van bestuur wordt bij de daarin omschreven overtredingen het bedrag van de op te leggen
      bestuurlijke boete bepaald, met diende verstande dat de bestuurlijke boete voor een afzonderlijke overtreding ten
      hoogste € 50.000 bedraagt. Indien tijdens het plegen van de overtreding nog geen vijf jaren zijn verlopen sedert
      het opleggen van een bestuurlijke boete aan de overtreder ter zake van eenzelfde overtreding, wordt het bedrag van
      de bestuurlijke boete, bedoeld in de eerste volzin, voor een afzonderlijke overtreding verdubbeld.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel11
  - number: '11.4'
    text: |-
      Indien tegen een besluit tot oplegging van een bestuurlijke boete bezwaar of beroep wordt aangetekend, schorst dit
      de verplichting tot betaling van de boete totdat de beroepstermijn is verstreken of, indien beroep is ingesteld, op
      het beroep is beslist. De schorsing van de verplichting tot betaling schorst niet de berekening van de wettelijke
      rente.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel11
  - number: '12'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel12
  - number: '13'
    text: 'Deze wet wordt aangehaald als: Muntwet 2002.'
    url: https://wetten.overheid.nl/BWBR0013064/2015-01-01#Artikel13
