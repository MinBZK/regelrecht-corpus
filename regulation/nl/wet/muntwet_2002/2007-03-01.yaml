preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, in verband met de invoering van de chartale euro met ingang van 1
    januari 2002 en ter uitvoering van artikel 106 van de Grondwet, wenselijk is de Muntwet 1987 te vervangen door een
    nieuwe wettelijke regeling van het Nederlandse muntstelsel;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013064/2007-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde, wordt verstaan onder:

      a. Onze minister: Onze minister van Financiën;

      b. Euromunten: de euromuntstukken, bedoeld in artikel 1 van [Verordening (EG) nr. 975/98](31998R0975) van de Raad
      van de Europese Unie van 3 mei 1998 over de denominaties en technische specificaties van voor circulatie bestemde
      euromuntstukken (PbEG L 139) zoals gewijzigd bij [Verordening (EG) nr. 423/99](31999R0423) van de Raad van de
      Europese Unie van 22 februari 1999 (PbEG L 52);

      c. Nederlandse euromunten: de euromuntstukken uitgegeven door de Staat der Nederlanden overeenkomstig artikel 11
      van [Verordening (EG) nr. 974/98](31998R0974) van de Raad van de Europese Unie van 3 mei 1998 tot invoering van de
      euro (PbEG L 139).
    url: https://wetten.overheid.nl/BWBR0013064/2007-03-01#Artikel1
  - number: '2'
    text: |-
      De munten die door de Staat der Nederlanden worden uitgegeven zijn Nederlandse euromunten, bijzondere munten met de
      hoedanigheid van wettig betaalmiddel en munten zonder de hoedanigheid van wettig betaalmiddel.
    url: https://wetten.overheid.nl/BWBR0013064/2007-03-01#Artikel2
  - number: '3'
    text: |-
      1 De bestanddelen van de beeldenaars van de nationale zijde van de Nederlandse euromunten worden bij koninklijk
      besluit vastgesteld.

      2 De in het eerste lid bedoelde munten dragen in ieder geval de beeltenis en de naam van de Koning (Koningin) en de
      woorden: Koning (Koningin) der Nederlanden.

      3 In het kader van een Europees herdenkingsthema kan ten aanzien van de Nederlandse euromunten van twee euro worden
      afgeweken van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013064/2007-03-01#Artikel3
  - number: '4'
    text: |-
      1 De denominaties van de bijzondere munten met de hoedanigheid van wettig betaalmiddel, de materialen waaruit
      deze munten zijn vervaardigd, de gewichten en de afmetingen, alsmede de bedragen tot welke zij de hoedanigheid van
      wettig betaalmiddel hebben, worden bij algemene maatregel van bestuur vastgesteld.

      2 De bestanddelen van de beeldenaars van de in het eerste lid genoemde munten worden bij koninklijk besluit
      vastgesteld. Deze munten dragen in ieder geval op de voorzijde de beeltenis en de naam van de Koning met de
      woorden: Koning (Koningin) der Nederlanden, en op de keerzijde de waardeaanduiding.
    url: https://wetten.overheid.nl/BWBR0013064/2007-03-01#Artikel4
  - number: '5'
    text: |-
      1 Munten zonder de hoedanigheid van wettig betaalmiddel zijn:

      a. de gouden dukaat;

      b. de dubbele gouden dukaat;

      c. de zilveren dukaat.

      2 De gouden dukaat heeft een goudgehalte van 983 duizendsten met een afwijking van ten hoogste twee duizendsten,
      een gewicht van 3,494 gram met een afwijking van ten hoogste vier duizendsten en een middellijn van 21 millimeter.

      3 De dubbele gouden dukaat heeft een goudgehalte van 983 duizendsten met een afwijking van ten hoogste twee
      duizendsten, een gewicht van 6,988 gram met een afwijking van ten hoogste vier duizendsten en een middellijn van
      26 millimeter.

      4 De beeldenaar van de gouden dukaat en de dubbele gouden dukaat is op de voorzijde een geharnaste man tussen de
      cijfers van het jaartal, met het omschrift: CONCORDIA RES PARVAE CRESCUNT, het teken van de Koninklijke Nederlandse
      Munt en het teken van de muntmeester: de beeldenaar is op de keerzijde binnen een versierd vierkant: MO. AUR REG.
      BELGII AD LEGEM IMPERII. De munten zijn voorzien van een kabelrand.

      5 De zilveren dukaat heeft een zilvergehalte van 873 duizendsten met een afwijking van ten hoogste drie
      duizendsten, een gewicht van 28,25 gram met een afwijking van ten hoogste vijf duizendsten en een middellijn van
      40 millimeter.

      6 De beeldenaar van de zilveren dukaat is op de voorzijde hetzij een geharnaste man met het Rijkswapen voor het
      linkerbeen en met het opschrift: MO.NO.ARG.REG.BELGII, hetzij een geharnaste man met het wapen van een Nederlandse
      provincie voor het linkerbeen en met het opschrift: MO.NO.ARG.REG.BELGII en de naam van de provincie; is op de
      keerzijde het Rijkswapen met de Koninklijke Kroon tussen de cijfers van het jaartal, met het opschrift: CONCORDIA
      RES PARVAE CRESCUNT, het teken van de Koninklijke Nederlandse Munt en het teken van de muntmeester.
    url: https://wetten.overheid.nl/BWBR0013064/2007-03-01#Artikel5
  - number: '6'
    text: |-
      1 De munten, bedoeld in [artikel 2][ref1], worden uitsluitend in opdracht van de Staat der Nederlanden vervaardigd
      en uitsluitend door de Staat der Nederlanden uitgegeven.

      2 De in het eerste lid bedoelde opdracht wordt verleend onder het beding dat de naar het oordeel van Onze minister
      in verband met het vervaardigen van munten noodzakelijke veiligheidsmaatregelen in acht worden genomen.

      3 De in het eerste lid bedoelde opdracht wordt verleend met inachtneming van [artikel 106, tweede lid, van het
      Verdrag tot oprichting van de Europese Gemeenschap](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0013064#Artikel2
    url: https://wetten.overheid.nl/BWBR0013064/2007-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013064
        artikel: '2'
  - number: '7'
    text: |-
      Bij ministeriële regeling worden de buitenomloopstelling en de inwisseling van buitenomloopgestelde bijzondere
      munten, als bedoeld in [artikel 4][ref1], geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0013064#Artikel4
    url: https://wetten.overheid.nl/BWBR0013064/2007-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013064
        artikel: '4'
  - number: '8'
    text: |-
      1 Niemand is gehouden valse of vervalste munten aan te nemen.

      2 Euromunten en de munten, bedoeld in de [artikelen 4][ref1] en [5][ref2] die vermoed worden vals of vervalst te
      zijn, kunnen aan een door Onze minister aan te wijzen instantie ter beoordeling worden voorgelegd.

      3 Indien de munten naar het oordeel van de in het tweede lid bedoelde instantie vals of vervalst zijn, worden ze
      doorgesneden teruggegeven of wordt de stoffelijke waarde vergoed. Indien de munten naar het oordeel van de in het
      tweede lid bedoelde instantie niet vals of vervalst zijn, worden de munten teruggegeven in de staat waarin ze zijn
      ontvangen of wordt de nominale waarde vergoed.

      4 Onze minister kan regels stellen betreffende de beoordeling, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013064#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013064#Artikel5
    url: https://wetten.overheid.nl/BWBR0013064/2007-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013064
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0013064
        artikel: '5'
  - number: '9'
    text: |-
      1

      2 De Muntwet 1987 wordt op een bij koninklijk besluit te bepalen tijdstip ingetrokken.

      3 De buitenomloopstelling en inwisseling van de op grond van de Muntwet 1948 en de Muntwet 1987 uitgegeven munten
      met de hoedanigheid van wettig betaalmiddel worden geregeld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0013064/2007-03-01#Artikel9
  - number: '10'
    text: |-
      Het koninklijk besluit van 4 februari 1943, Stb. D 67, betreffende de uitgifte van biljetten aan toonder als nieuw
      betaalmiddel voor het Rijk in Europa, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013064/2007-03-01#Artikel10
  - number: '12'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0013064/2007-03-01#Artikel12
  - number: '13'
    text: 'Deze wet wordt aangehaald als: Muntwet 2002.'
    url: https://wetten.overheid.nl/BWBR0013064/2007-03-01#Artikel13
