preamble:
  text: >-
    Gelet op richtlijn nr. 96/22/EG van de Raad van de Europese Unie van 29 april 1996 betreffende het verbod op het
    gebruik, in de veehouderij, van bepaalde stoffen met hormonale werking en van bepaalde stoffen met thyreostatische
    werking, alsmede van b-agonisten en tot intrekking van de richtlijnen 81/602/EEG, 88/146/EEG en 88/299/EEG (PbEG L
    125), op richtlijn nr. 96/23/EG van de Raad van de Europese Unie van 29 april 1996 inzake controlemaatregelen ten
    aanzien van bepaalde stoffen en residuen daarvan in levende dieren en in produkten daarvan en tot intrekking van
    de Richtlijnen 85/358/EEG en 86/469/EEG en de Beschikkingen 89/187/EEG en 91/664/EEG (PbEG L 125), alsmede op de
    artikelen 19 en 23 van de Landbouwwet;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0008825/2006-01-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling en de daarop gebaseerde bepalingen wordt verstaan onder:



            a

              [richtlijn 96/22/EG](31996L0022):

              richtlijn van de Raad van de Europese Unie van 29 april 1996 betreffende het verbod op het gebruik, in
      de veehouderij, van bepaalde stoffen met hormonale werking en van bepaalde stoffen met thyreostatische werking,
      alsmede van b-agonisten en tot intrekking van de [richtlijnen 81/602/EEG](31981L0602), [88/146/EEG](31988L0146) en
      [88/299/EEG](31988L0299) (PbEG L 125);



            b

              [richtlijn 96/23/EG](31996L0023):

              richtlijn van de Raad van de Europese Unie van 29 april 1996 inzake controlemaatregelen ten aanzien
      van bepaalde stoffen en residuen daarvan in levende dieren en in produkten daarvan en tot intrekking van de
      [Richtlijnen 85/358/EEG](31985L0358) en [86/469/EEG](31986L0469) en de Beschikkingen [89/187/EEG](31989L0187) en
      [91/664/EEG](31991L0664) (PbEG L 125);



            c

              [verordening (EEG) nr. 2377/90](31990R2377):

              [verordening (EEG) nr. 2377/90](31990R2377) van de Raad van de Europese Gemeenschappen van 26 juni 1990
      houdende een communautaire procedure tot vaststelling van maximumwaarden voor residuen van geneesmiddelen voor
      diergeneeskundig gebruik in levensmiddelen van dierlijke oorsprong (PbEG L 224);



            d
             communautaire regelgeving:

              verordening, richtlijn of beschikking als bedoeld in artikel 189 van het Verdrag tot oprichting van de
      Europese Economische gemeenschap (Trb. 1957, 91), ter zake van het in de handel brengen van diergeneesmiddelen en
      de daarmee verband houdende onderwerpen;



            e
             landbouwhuisdieren:

              als huisdier gehouden runderen, varkens, schapen, geiten, eenhoevigen, pluimvee en tamme konijnen, alsook
      wilde dieren van genoemde soorten en wilde herkauwers, voorzover zij op een bedrijf worden gehouden;



            f
            aquicultuurdieren:

              levende vissen en schaal- en weekdieren die afkomstig zijn van een bedrijf, met inbegrip van voor een
      bedrijf bestemde dieren die oorspronkelijk in het wild leefden;



            g
             in de handel brengen:

              voorhanden of in voorraad hebben, slachten, be- of verwerken, ge- en verbruiken, vervoeren, aanvoeren,
      ontvangen, afleveren, te koop aanbieden, kopen of vervreemden;



            h
             minister:

              Minister van Landbouw, Natuur en Voedselkwaliteit;



            i
             werkzaamheden:

              werkzaamheden, bedoeld in [artikel 3, eerste lid, onderdelen a, b en d][ref1];.



            j
             uur:

              spanne tijd van een uur, of enkel gedeelte daarvan, dat besteed is of zou zijn aan werkzaamheden, met
      uitzondering van de reistijd.


      [ref1]: https://wetten.overheid.nl/BWBR0008825#Artikel3
    url: https://wetten.overheid.nl/BWBR0008825/2006-01-13#Artikel1
    references:
