  - number: '4'
    text: >-
      1 Indien op een bedrijf de aanwezigheid wordt geconstateerd van diergeneesmiddelen of substanties die ingevolge
      de communautaire regelgeving niet aan landbouwhuisdieren of aquicultuurdieren mogen worden toegediend alsmede
      indien in monsters residuen worden aangetroffen van dergelijke stoffen, wordt het betrokken bedrijf onder officieel
      toezicht van de minister geplaatst.


      2 Dieren van een bedrijf als bedoeld in het eerste lid worden gemerkt of geïdentificeerd en mogen, zolang het
      onderzoek niet is afgerond, het bedrijf slechts onder officieel toezicht van de minister verlaten of aan een andere
      persoon worden overgedragen.


      3 De eigenaar of houder van dieren is verplicht te gedogen dat op of aan die dieren een merk als bedoeld in het
      tweede lid wordt aangebracht.


      4 Het is verboden de op grond van deze regeling aangebrachte merken geheel of gedeeltelijk te verwijderen, te
      veranderen, onleesbaar te maken, dan wel andere handelingen te verrichten waardoor die merken niet meer geschikt
      zijn ter identificatie van de betrokken dieren.
    url: https://wetten.overheid.nl/BWBR0008825/2006-01-13#Artikel4
  - number: '5'
    text: >-
      1 Indien blijkt dat in landbouwhuisdieren of aquicultuurdieren aangetroffen residuen van diergeneesmiddelen de
      voor die middelen toegestane maxima overschrijden, kan de minister alle maatregelen nemen die met het oog op de
      volksgezondheid noodzakelijk zijn.


      2 De in het eerste lid bedoelde maatregelen kunnen in ieder geval inhouden dat de desbetreffende dieren of
      producten van die dieren het betrokken bedrijf niet mogen verlaten zolang het onderzoek naar de redenen van de
      overschrijding niet is afgerond.


      3 Wanneer het onderzoek, bedoeld in artikel 18 van [richtlijn 96/23/EG](31996L0023), de juistheid van het vermoeden
      bevestigt worden de kosten van de analyses van de monsters door de minister in rekening gebracht bij de eigenaar of
      houder van de bemonsterde dieren.
    url: https://wetten.overheid.nl/BWBR0008825/2006-01-13#Artikel5
  - number: 5a
    text: >-
      1 Indien blijkt dat aan landbouwhuisdieren of aquicultuurdieren diergeneesmiddelen of substanties zijn toegediend
      die ingevolge de communautaire regelgeving niet aan landbouwhuisdieren of aquicultuurdieren mogen worden
      toegediend, kan de minister die dieren uit de handel nemen en vernietigen.


      2 De kosten voor het uit de handel nemen en vernietigen van dieren, overeenkomstig het eerste lid, worden door de
      minister in rekening gebracht bij de eigenaar of houder van de dieren, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008825/2006-01-13#Artikel5a
  - number: '6'
    text: |-
      1 Indien in een monster residuen van diergeneesmiddelen of substanties die niet aan landbouwhuisdieren of
      aquicultuurdieren mogen worden toegediend, worden aangetroffen, worden de kosten van onderzoeken als bedoeld in
      artikel 16 van [richtlijn 96/23/EG](31996L0023) in rekening gebracht door de minister bij de eigenaar of houder van
      de bemonsterde dieren dan wel van de dieren, waarvan de bemonsterde producten afkomstig zijn.

      2 De in het eerste lid bedoelde kosten hebben betrekking op:

      a. het onderzoek naar de redenen voor de aanwezigheid van residuen in de onderzochte monsters op enig bedrijf waar
      de bemonsterde dieren of producten van afkomstig zijn of zijn;

      b. het nemen van monsters;

      c. de analyse van de genomen monsters;

      d. overige onderzoeken.

      3 De kosten, bedoeld in het eerste lid, zijn, in voorkomend geval, opgebouwd uit de volgende componenten:

      a. de laboratoriumkosten;

      b. de met de analyse van de monsters gemoeide verzendkosten;

      c. de administratiekosten;

      d. de verblijfskosten van de bij de werkzaamheden betrokkenen;

      e. de reiskosten van de bij de werkzaamheden betrokkenen;

      f. een bedrag per uur per met de werkzaamheden belaste persoon van de Algemene Inspectiedienst;

      g. overige kosten die verband houden met de werkzaamheden.

      4 Indien kosten in rekening gebracht worden ingevolge [artikel 79 van het Diergeneesmiddelenbesluit][ref1], kunnen
      de in het tweede lid bedoelde kosten in rekening worden gebracht tezamen met de ingevolge dat besluit in rekening
      te brengen kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel79
    url: https://wetten.overheid.nl/BWBR0008825/2006-01-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '79'
  - number: '7'
    text: >-
      De analyse van een monster dient op kosten van ongelijk te worden bevestigd door een nationaal referentie-
      laboratorium als bedoeld in artikel 15, tweede lid, van [richtlijn 96/23/EG](31996L0023), indien de uitkomst wordt
      aangevochten op basis van een analyse op tegenspraak.
    url: https://wetten.overheid.nl/BWBR0008825/2006-01-13#Artikel7
  - number: '8'
    text: >-
      1 Wijzigingen van één of meer onderdelen van [richtlijn 96/22/EG](31996L0022) en [richtlijn 96/23/EG](31996L0023)
      treden voor de toepassing van de artikelen van deze regeling, waarin naar die onderdelen van de bedoelde
      richtlijnen wordt verwezen, in werking met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering
      moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een eerder of een
      ander aan die richtlijn ontleend tijdstip wordt vastgesteld.


      2 De minister doet van een wijzigingsrichtlijn als bedoeld in het eerste lid mededeling aan de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008825/2006-01-13#Artikel8
  - number: '9'
    text: >-
      Deze regeling treedt in werking met ingang van de tweede dag na de publicatie van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0008825/2006-01-13#Artikel9
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Regeling verbod handel met bepaalde stoffen behandelde dieren en producten.'
    url: https://wetten.overheid.nl/BWBR0008825/2006-01-13#Artikel10
