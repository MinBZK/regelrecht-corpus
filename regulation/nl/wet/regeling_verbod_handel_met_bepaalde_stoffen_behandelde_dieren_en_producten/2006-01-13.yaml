        artikel: '3'
        paragraaf: '2'
  - number: '2'
    text: |-
      1 De minister draagt ter uitvoering van [richtlijn 96/22/EG](31996L0022) en [richtlijn 96/23/EG](31996L0023) de aan
      hem in [artikel 19 van de Landbouwwet][ref1] toegekende bevoegdheden over aan het bestuur van het Produktschap voor
      Vee en Vlees, het bestuur van het Produktschap voor Pluimvee en Eieren en het bestuur van het Produktschap Vis voor
      wat betreft het stellen van regelen met betrekking tot:

      a. een verbod om landbouwhuisdieren en aquicultuurdieren waaraan op enigerlei wijze stoffen met thyreostatische,
      oestrogene, androgene of gestagene werking alsmede ß- agonisten zijn toegediend, in de handel te brengen, behalve
      wanneer de dieren zijn behandeld overeenkomstig bij of krachtens de [Diergeneesmiddelenwet][ref2] gestelde regels;

      b. een verbod om landbouwhuisdieren of aquicultuurdieren waaraan op enigerlei wijze farmacologisch werkzame
      substanties als bedoeld in bijlage IV bij [verordening (EEG) nr. 2377/90](31990R2377) zijn toegediend in de handel
      te brengen;

      c. een verbod om verwerkte producten of vlees van dieren als bedoeld in de onderdelen a en b in de handel te
      brengen, behalve wanneer de dieren, bedoeld in onderdeel a, zijn behandeld overeenkomstig bij of krachtens de
      [Diergeneesmiddelenwet][ref3] gestelde regels.

      2 Ter uitvoering van [richtlijn 96/22/EG](31996L0022) en [richtlijn 96/23/EG](31996L0023) draagt de minister de
      aan hem in [artikel 19 van de Landbouwwet][ref4] toegekende bevoegdheden over aan het bestuur van het Produktschap
      voor Vee en Vlees en het bestuur van het Produktschap voor Pluimvee voor wat betreft het stellen van regelen met
      betrekking tot:

      a. maatregelen ter zelfcontrole als bedoeld in artikel 9 van [richtlijn 96/23/EG](31996L0023);

      b. het uitoefenen van kwaliteitstoezicht door de verschillende betrokken sectoren als bedoeld in artikel 9,
      onderdeel B, van [richtlijn 96/23/EG](31996L0023);

      c. het aanwijzen van instellingen die belast zijn met het verrichten van kwaliteitscontroles in de verschillende
      sectoren.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0003818
      [ref3]: https://wetten.overheid.nl/BWBR0003818
      [ref4]: https://wetten.overheid.nl/BWBR0002252#Artikel19
