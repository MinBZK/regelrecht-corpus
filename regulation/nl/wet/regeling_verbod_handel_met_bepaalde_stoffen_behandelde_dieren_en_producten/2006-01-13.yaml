  - number: '3'
    text: |-
      1 Voorzover niet bij een door de minister goedgekeurde verordening van een productschap is voorzien in regelen als
      bedoeld in [artikel 2, eerste lid][ref1], is het verboden:

      a. landbouwhuisdieren of aquicultuurdieren waaraan op enigerlei wijze stoffen met thyreostatische, oestrogene,
      androgene of gestagene werking alsmede ß- agonisten zijn toegediend, in de handel te brengen;

      b. landbouwhuisdieren of aquicultuurdieren waaraan op enigerlei wijze farmacologisch werkzame substanties als
      bedoeld in bijlage IV bij [verordening (EEG) nr. 2377/90](31990R2377) zijn toegediend in de handel te brengen;

      c. verwerkte producten of vlees van dieren als bedoeld in de onderdelen a en b in de handel te brengen.

      2 Het eerste lid is niet van toepassing op dieren als bedoeld in het eerste lid, onderdeel a, en verwerkte
      producten of vlees van die dieren, indien de dieren zijn behandeld overeenkomstig bij of krachtens de
      [Diergeneesmiddelenwet][ref2] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0008825#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003818
