  - number: '3'
    text: |-
      1 Het is verboden:

      a. landbouwhuisdieren of aquacultuurdieren waaraan op enigerlei wijze stoffen met thyreostatische, oestrogene,
      androgene of gestagene werking alsmede ß- agonisten zijn toegediend, in de handel te brengen;

      b. landbouwhuisdieren of aquacultuurdieren in de handel te brengen waaraan op enigerlei wijze zijn toegediend:

      1°. farmacologisch werkzame substanties als bedoeld in bijlage IV bij verordening (EEG) nr. 2377/90, voor zover de
      in artikel 27, eerste lid, van verordening (EG) nr. 470/2009 bedoelde verordening nog niet in werking is getreden
      en de bijlagen bij verordening (EEG) nr. 2377/90 EG nog van toepassing zijn, of

      2°. farmacologisch werkzame substanties die in een lijst zijn ingedeeld overeenkomstig artikel 14, tweede lid,
      onderdeel d, van verordening (EG) nr. 470/2009;

      c. verwerkte producten of vlees van dieren als bedoeld in de onderdelen a en b in de handel te brengen.

      2 Het eerste lid is niet van toepassing op dieren als bedoeld in het eerste lid, onderdeel a, en verwerkte
      producten of vlees van die dieren, indien de dieren zijn behandeld overeenkomstig bij of krachtens de
      [Diergeneesmiddelenwet][ref1] gestelde regels.

      3 Het eerste lid, aanhef en onderdeel b, is niet van toepassing ingeval overeenkomstig de artikelen 18 en 19 van
      verordening (EG) nr. 470/2009 een actiedrempel voor een farmacologisch werkzame substantie is vastgesteld en deze
      actiedrempel niet is overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003818
    url: https://wetten.overheid.nl/BWBR0008825/2009-10-06#Artikel3
