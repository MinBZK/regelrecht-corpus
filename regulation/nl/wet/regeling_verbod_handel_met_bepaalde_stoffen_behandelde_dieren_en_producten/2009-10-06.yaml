  - number: 3a
    text: |-
      De eigenaar van een inrichting voor de eerste verwerking van primaire producten van dierlijke oorsprong treft alle
      nodige maatregelen:

      a. opdat alleen landbouwhuisdieren worden aanvaard die afkomstig zijn van een bedrijf dat kan garanderen dat na
      toediening van diergeneesmiddelen aan die dieren de wachttermijnen in acht zijn genomen;

      b. om zich ervan te vergewissen dat landbouwhuisdieren of producten van die dieren, die de inrichting worden
      binnengebracht:

      1°. geen residuen van diergeneesmiddelen bevatten in een hoger gehalte dan is toegestaan voor die middelen;

      2°. geen diergeneesmiddelen of substanties bevatten die ingevolge de communautaire regelgeving niet aan
      landbouwhuisdieren mogen worden toegediend.
    url: https://wetten.overheid.nl/BWBR0008825/2009-10-06#Artikel3a
  - number: 3b
    text: |-
      1 Met het oog op de uitvoering van artikel 9 van richtlijn nr. 96/23/EG kunnen de verschillende betrokken partners
      in de veehouderijsector zelf kwaliteitscontrole uitoefenen.

      2 Indien kwaliteitscontrole als bedoeld in het eerste lid plaatsvindt:

      a. worden de zelfcontrolemaatregelen opgenomen in daarvoor in aanmerking komende algemene voorwaarden voor merken
      en labels;

      b. vervallen de voordelen, verbonden aan de deelname aan een kwaliteitscontrolesysteem, voor een bedrijf dat
      overeenkomstig [artikel 4][ref1] onder toezicht is geplaatst, gedurende een periode van ten minste twaalf maanden
      vanaf de datum dat de ondertoezichtplaatsing van het bedrijf is opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0008825#Artikel4
    url: https://wetten.overheid.nl/BWBR0008825/2009-10-06#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0008825
        artikel: '4'
        paragraaf: '3'
  - number: '4'
    text: |-
      1 Indien op een bedrijf de aanwezigheid wordt geconstateerd van diergeneesmiddelen of substanties die ingevolge
      de communautaire regelgeving niet aan landbouwhuisdieren of aquacultuurdieren mogen worden toegediend alsmede
      indien in monsters residuen worden aangetroffen van dergelijke stoffen, wordt het betrokken bedrijf onder officieel
      toezicht van de minister geplaatst.

      2 Dieren van een bedrijf als bedoeld in het eerste lid worden gemerkt of geïdentificeerd en mogen, zolang het
      onderzoek niet is afgerond, het bedrijf slechts onder officieel toezicht van de minister verlaten of aan een andere
      persoon worden overgedragen.

      3 De eigenaar of houder van dieren is verplicht te gedogen dat op of aan die dieren een merk als bedoeld in het
      tweede lid wordt aangebracht.

      4 Het is verboden de op grond van deze regeling aangebrachte merken geheel of gedeeltelijk te verwijderen, te
      veranderen, onleesbaar te maken, dan wel andere handelingen te verrichten waardoor die merken niet meer geschikt
      zijn ter identificatie van de betrokken dieren.
    url: https://wetten.overheid.nl/BWBR0008825/2009-10-06#Artikel4
  - number: '5'
    text: |-
      1 Indien blijkt dat in landbouwhuisdieren of aquacultuurdieren aangetroffen residuen van diergeneesmiddelen de
      voor die middelen toegestane maxima overschrijden, kan de minister alle maatregelen nemen die met het oog op de
      volksgezondheid noodzakelijk zijn.

      2 De in het eerste lid bedoelde maatregelen kunnen in ieder geval inhouden dat de desbetreffende dieren of
      producten van die dieren het betrokken bedrijf niet mogen verlaten zolang het onderzoek naar de redenen van de
      overschrijding niet is afgerond.

      3 Wanneer het onderzoek, bedoeld in artikel 18 van [richtlijn 96/23/EG](31996L0023), de juistheid van het vermoeden
      bevestigt worden de kosten van de analyses van de monsters door de minister in rekening gebracht bij de eigenaar of
      houder van de bemonsterde dieren.
    url: https://wetten.overheid.nl/BWBR0008825/2009-10-06#Artikel5
  - number: 5a
    text: |-
      1 Indien blijkt dat aan landbouwhuisdieren of aquacultuurdieren diergeneesmiddelen of substanties zijn toegediend
      die ingevolge de communautaire regelgeving niet aan landbouwhuisdieren of aquacultuurdieren mogen worden
      toegediend, kan de minister die dieren uit de handel nemen en vernietigen.

      2 De kosten voor het uit de handel nemen en vernietigen van dieren, overeenkomstig het eerste lid, worden door de
      minister in rekening gebracht bij de eigenaar of houder van de dieren, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008825/2009-10-06#Artikel5a
  - number: '6'
    text: |-
      Indien in een monster residuen van diergeneesmiddelen of substanties die niet aan landbouwhuisdieren of
      aquacultuurdieren mogen worden toegediend, worden aangetroffen, worden de kosten van onderzoek of monsterneming,
      bedoeld in artikel 16, 17 en 23, tweede lid, van [richtlijn nr. 96/23/EG](31996L0023) door de minister in rekening
      gebracht bij de eigenaar of houder van de bemonsterde dieren dan wel van de dieren, waarvan de bemonsterde
      producten afkomstig zijn.
    url: https://wetten.overheid.nl/BWBR0008825/2009-10-06#Artikel6
  - number: 6a
    text: |-
      1 De in [artikel 5, derde lid][ref1], en [artikel 6][ref2] bedoelde kosten hebben betrekking op:

      a. het onderzoek naar de redenen voor de aanwezigheid van residuen in de onderzochte monsters op enig bedrijf waar
      de bemonsterde dieren of producten van afkomstig zijn of zijn;

      b. het nemen van monsters;

      c. de analyse van de genomen monsters;

      d. overige onderzoeken.

      2 De kosten, bedoeld in het eerste lid, zijn, in voorkomend geval, opgebouwd uit de volgende componenten:

      a. de laboratoriumkosten;

      b. de met de analyse van de monsters gemoeide verzendkosten;

      c. de administratiekosten;

      d. de verblijfskosten van de bij de werkzaamheden betrokkenen;

      e. de reiskosten van de bij de werkzaamheden betrokkenen;

      f. een bedrag per uur per met de werkzaamheden belaste persoon;

      g. overige kosten die verband houden met de werkzaamheden.

      3 Indien kosten in rekening gebracht worden ingevolge [artikel 79 van het Diergeneesmiddelenbesluit][ref3], kunnen
      de in het tweede lid bedoelde kosten in rekening worden gebracht tezamen met de ingevolge dat besluit in rekening
      te brengen kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0008825#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008825#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0018901#Artikel79
    url: https://wetten.overheid.nl/BWBR0008825/2009-10-06#Artikel6a
