  - number: '2'
    text: |-
      1 De minister draagt ter uitvoering van [richtlijn 96/22/EG](31996L0022) en [richtlijn 96/23/EG](31996L0023) de aan
      hem in [artikel 19 van de Landbouwwet][ref1] toegekende bevoegdheden over aan het bestuur van het Produktschap voor
      Vee en Vlees, het bestuur van het Produktschap voor Pluimvee en Eieren en het bestuur van het Produktschap Vis voor
      wat betreft het stellen van regelen met betrekking tot:

      a. een verbod om landbouwhuisdieren en aquacultuurdieren waaraan op enigerlei wijze stoffen met thyreostatische,
      oestrogene, androgene of gestagene werking alsmede ß- agonisten zijn toegediend, in de handel te brengen, behalve
      wanneer de dieren zijn behandeld overeenkomstig bij of krachtens de [Diergeneesmiddelenwet][ref2] gestelde regels;

      b. een verbod om landbouwhuisdieren of aquacultuurdieren in de handel te brengen waaraan op enigerlei wijze zijn
      toegediend:

      1°. farmacologisch werkzame substanties als bedoeld in bijlage IV bij verordening (EEG) nr. 2377/90, voor zover de
      in artikel 27, eerste lid, van verordening (EG) nr. 470/2009 bedoelde verordening nog niet in werking is getreden
      en de bijlagen bij verordening (EEG) nr. 2377/90 EG nog van toepassing zijn, of

      2°. farmacologisch werkzame substanties die in een lijst zijn ingedeeld overeenkomstig artikel 14, tweede lid,
      onderdeel d, van verordening (EG) nr. 470/2009;

      c. een verbod om verwerkte producten of vlees van dieren als bedoeld in de onderdelen a en b in de handel te
      brengen, behalve wanneer de dieren, bedoeld in onderdeel a, zijn behandeld overeenkomstig bij of krachtens de
      [Diergeneesmiddelenwet][ref3] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0003818
      [ref3]: https://wetten.overheid.nl/BWBR0003818
    url: https://wetten.overheid.nl/BWBR0008825/2009-10-06#Artikel2
    references:
