        artikel: '79'
  - number: '7'
    text: |-
      De analyse van een monster dient op kosten van ongelijk te worden bevestigd door een nationaal referentie-
      laboratorium als bedoeld in artikel 15, tweede lid, van [richtlijn 96/23/EG](31996L0023), indien de uitkomst wordt
      aangevochten op basis van een analyse op tegenspraak.
    url: https://wetten.overheid.nl/BWBR0008825/2009-10-06#Artikel7
  - number: '8'
    text: |-
      1 Wijzigingen van één of meer onderdelen van [richtlijn 96/22/EG](31996L0022) en [richtlijn 96/23/EG](31996L0023)
      treden voor de toepassing van de artikelen van deze regeling, waarin naar die onderdelen van de bedoelde
      richtlijnen wordt verwezen, in werking met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering
      moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een eerder of een
      ander aan die richtlijn ontleend tijdstip wordt vastgesteld.

      2 De minister doet van een wijzigingsrichtlijn als bedoeld in het eerste lid mededeling aan de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008825/2009-10-06#Artikel8
  - number: '9'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de publicatie van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0008825/2009-10-06#Artikel9
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Regeling verbod handel met bepaalde stoffen behandelde dieren en producten.'
    url: https://wetten.overheid.nl/BWBR0008825/2009-10-06#Artikel10
