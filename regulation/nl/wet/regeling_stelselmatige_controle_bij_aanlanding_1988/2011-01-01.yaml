---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_stelselmatige_controle_bij_aanlanding_1988
regulatory_layer: WET
publication_date: '2011-03-09'
valid_from: '2011-01-01'
bwb_id: BWBR0004267
url: https://wetten.overheid.nl/BWBR0004267/2011-01-01
preamble:
  text: |-
    Gelet op de artikelen 3 en 4 van het Reglement zee- en kustvisserij 1977 (Stb. 666);

    Na overleg met het Produktschap voor Vis en Visprodukten, het Visserijschap en het Bedrijfschap voor de Groothandel
    in Vis en Aanverwante Bedrijven;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#ArtikelAanhef
articles:
  - number: 1.1.a
    text: |-
      *ondernemer*: degene te wiens naam het vissersvaartuig in het visserijregister, bedoeld in
      [artikel 4 van het Besluit registratie vissersvaartuigen 1998][ref1], is geregistreerd;


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel4
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009353
        artikel: '4'
  - number: 1.1.b
    text: '*minister*: de Minister van Economische Zaken, Landbouw en Innovatie;'
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel1
  - number: 1.1.c
    text: '*AID*: Algemene Inspectiedienst van het Ministerie van Economische Zaken, Landbouw en Innovatie;'
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel1
  - number: 1.1.d
    text: |-
      *functionaris*: door de Minister voor de registratie- en verificatiewerkzaamheden in het kader van deze regeling
      aangewezen persoon;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel1
  - number: 1.1.e
    text: |-
      verordening ie.nzake vangstmogelijkheden: Verordening van 14 december 2010 van de Raad van de Europese Unie tot
      vaststelling, voor 2011, van de vangstmogelijkheden voor sommige visbestanden en groepen visbestanden welke in de
      EU-wateren en, voor EU-vaartuigen, in andere wateren met vangstbeperkingen van toepassing zijn;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel1
  - number: 1.1.f
    text: |-
      verordening nr. 1005/2008: Verordening nr. 1005/2008/EG van de Raad van de Europese Unie van 29 september 2008
      houdende de totstandbrenging van een communautair systeem om illegale, ongemelde en ongereglementeerde visserij te
      voorkomen, tegen te gaan en te beëindigen, tot wijziging van Verordeningen (EEG) nr. 2847/93, (EG) nr. 1936/2001 en
      (EG) nr. 601/2004 en tot intrekking van Verordeningen (EG) nr. 1093/94 en (EG) nr. 1447/1999 (PbEU L 286);
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel1
  - number: 1.1.g
    text: |-
      verordening nr. 1010/2009: Verordening nr. 1010/2009/EG van de Commissie van de Europese Gemeenschappen van 22
      oktober 2009 tot vaststelling van bepalingen ter uitvoering van Verordening nr. 1005/2008/EG van de Raad van
      de Europese Unie van 29 september 2008 houdende de totstandbrenging van een communautair systeem om illegale,
      ongemelde en ongereglementeerde visserij te voorkomen, tegen te gaan en te beëindigen (PbEU L 280).
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het bepaalde in deze regeling vindt het aanlanden van vis plaats op het tijdstip waarop het
      vissersvaartuig direct of indirect verbinding met de wal heeft gekregen.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel1
  - number: '1.3'
    text: |-
      Deze regeling is van toepassing op vis die is aangewezen krachtens
      [artikel 1, tweede lid, onderdeel a, van de Visserijwet 1963][ref1], met uitzondering van vissoorten waarop de
      binnenvisserij als genoemd in [artikel 1, vierde lid, onderdeel d, van die wet][ref2] wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002416
        artikel: '1'
  - number: '1.4'
    text: |-
      Voor de toepassing van [artikel 3b][ref1] wordt onder vissersvaartuig verstaan, hetgeen daaronder wordt verstaan in
      artikel 2, vijfde lid, van verordening nr. 1005/2008.


      [ref1]: https://wetten.overheid.nl/BWBR0004267#Artikel3b
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004267
        artikel: 3b
        paragraaf: '1'
  - number: '2.1'
    text: |-
      Het is verboden vis in Nederland aan te landen of te lossen in een andere haven dan de havens Breskens (Gemeente
      Oostburg), Vlissingen, Vlaardingen, Colijnsplaat (Gemeente Noord-Beveland), Stellendam (Gemeente Goedereede),
      Scheveningen (Gemeente 's-Gravenhage), IJmuiden en Velsen (Gemeente Velsen), Velsen, Den Helder, Den Oever
      (gemeente Wieringen), Harlingen, Lauwersoog (Gemeente De Marne), Delfzijl, Termunterzijl (Gemeente Delfzijl),
      Eemshaven (Gemeente Eemsmond) en Urk.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden vis aan te landen of te lossen in de havens Breskens, Vlissingen, Vlaardingen, Colijnsplaat,
      Stellendam, Scheveningen, IJmuiden, Velsen, Den Helder, Den Oever, Harlingen, Lauwersoog, Delfzijl, Termunterzijl,
      Eemshaven en Urk.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel2
  - number: '2.3'
    text: |-
      Het is verboden in een in het tweede lid genoemde haven op een andere plaats onderscheidenlijk plaatsen vis te
      lossen dan de in [Bijlage 1][ref1] behorende bij deze regeling genoemde plaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0004267
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004267
  - number: '2.4'
    text: 'Het verbod, bedoeld in het tweede lid, is niet van toepassing op vissersvaartuigen:'
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel2
  - number: 2.4.a
    text: |-
      die behoren tot het segment MFL1 of MFL2, bedoeld in [artikel 1, onderdeel l, van de Regeling visvergunning][ref1],
      met uitzondering van vissersvaartuigen met een brutotonnage van meer dan 1.200 BT waarmee de pelagische visserij
      wordt uitgeoefend, en die een lengte over alles van meer dan 10 meter hebben, voor het lossen dat is aangevangen in
      de havens, bedoeld in het eerste lid, behoudens de havens van Vlaardingen en Velsen;


      [ref1]: https://wetten.overheid.nl/BWBR0016244#Artikel1
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016244
        artikel: '1'
  - number: 2.4.b
    text: |-
      met een brutotonnage van meer dan 1.200 BT waarmee de pelagische visserij wordt uitgeoefend, voor het lossen dat is
      aangevangen in de havens, bedoeld in het eerste lid, behoudens de haven van Vlaardingen;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel2
  - number: 2.4.c
    text: met een lengte over alles van 10 meter of minder;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel2
  - number: 2.4.d
    text: |-
      die de vlag voeren van of geregistreerd zijn in een andere lid-staat van de Europese Unie dan Nederland en op
      vissersvaartuigen van een derde land met een lengte over alles van ten hoogste 59 meter, voor het lossen dat is
      aangevangen in de havens, bedoeld in het eerste lid, behoudens de havens van Vlaardingen en Velsen;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel2
  - number: 2.4.e
    text: |-
      die de vlag voeren van of geregistreerd zijn in een andere lid-staat van de Europese Unie dan Nederland en op
      vissersvaartuigen van een derde land met een lengte over alles van meer dan 59 meter, voor het lossen dat is
      aangevangen in de havens, bedoeld in het eerste lid, behoudens de haven van Vlaardingen.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel2
  - number: '2.5'
    text: |-
      Nadat het lossen is aangevangen, dient alle zich aan boord van het vissersvaartuig bevindende vis, met uitzondering
      van paling, in één ononderbroken losbeurt in zijn geheel te worden gelost.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel2
  - number: '2.6'
    text: |-
      Het is verboden aan te vangen met het lossen van vis indien de vis niet per verpakkingseenheid naar vissoort voor
      zover genoemd in de [bijlage 2][ref1], [3][ref2] en [4 van de Regeling vangstbeperking][ref3] is gesorteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006379
      [ref2]: https://wetten.overheid.nl/BWBR0006379
      [ref3]: https://wetten.overheid.nl/BWBR0006379
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006379
      - id: ref2
        bwb_id: BWBR0006379
      - id: ref3
        bwb_id: BWBR0006379
  - number: '2.7'
    text: |-
      Het is verboden vis van soorten als bedoeld in [bijlage 2][ref1], [3][ref2] en
      [4 van de Regeling vangstbeperking][ref3] te lossen tenzij deze vis per vissoort wordt gelost.


      [ref1]: https://wetten.overheid.nl/BWBR0006379
      [ref2]: https://wetten.overheid.nl/BWBR0006379
      [ref3]: https://wetten.overheid.nl/BWBR0006379
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006379
      - id: ref2
        bwb_id: BWBR0006379
      - id: ref3
        bwb_id: BWBR0006379
  - number: '2.8'
    text: |-
      Het verbod, bedoeld in het tweede lid, is niet van toepassing voor het aanlanden en lossen van vis in de havens
      van Eemshaven, Harlingen, IJmuiden, Scheveningen, Velsen en Vlissingen indien met een vissersvaartuig een
      hoeveelheid vis wordt aangeland die voor meer dan 10 ton bestaat uit de soort haring, makreel, horsmakreel of
      een combinatie daarvan die is gevangen in de gebieden, bedoeld in artikel 1 van de Verordening van 20 december
      2007 van de Commissie van de Europese Gemeenschappen betreffende aanvoer- en weegprocedures voor haring, makreel
      en horsmakreel.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel2
  - number: '2.9'
    text: |-
      Het in het tweede lid gestelde verbod is niet van toepassing voor het aanlanden en lossen van vis in de havens van
      IJmuiden en Scheveningen indien:
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel2
  - number: 2.9.a
    text: met een vissersvaartuig een hoeveelheid vis wordt aangeland die voor ten minste 95% uit de soort haring bestaat, en
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel2
  - number: 2.9.b
    text: |-
      de ondernemer voor het vissersvaartuig in het bezit is van een op de in onderdeel a bedoelde vissoort betrekking
      hebbend document als bedoeld in [artikel 12 van de Regeling instandhoudingsmaatregelen zeevisserij][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel12
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '12'
  - number: '2.10'
    text: |-
      In afwijking van het vierde lid, is het verbod, bedoeld in het tweede lid, niet van toepassing op het aanlanden
      en lossen van vis als bedoeld in artikel 1 van de Verordening van 19 december 2007 van de Raad van de Europese
      Unie tot vaststelling van een meerjarig herstelplan voor blauwvintonijn in het oostelijke deel van de Atlantische
      Oceaan en de Middellandse Zee en tot wijziging van verordening (EG) nr. 520/2007 in de havens van Vlissingen,
      Scheveningen, IJmuiden, Velsen, Harlingen en Eemshaven.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel2
  - number: 2a.1
    text: |-
      In afwijking van [artikel 2, eerste lid][ref1], is het toegestaan vis aan te landen of te lossen in de plaatsen,
      bedoeld in [bijlage 3][ref2], behorende bij deze regeling met een vissersvaartuig met een lengte over alles van 10
      meter of minder.


      [ref1]: https://wetten.overheid.nl/BWBR0004267#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004267
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0004267
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004267
  - number: 2a.2
    text: |-
      In afwijking van [artikel 3, zevende lid, onderdeel a, onder 1°][ref1], wordt bij het aanlanden of lossen van vis
      in de in het eerste lid genoemde plaatsen melding gemaakt van de plaats van aanlanding, waarbij de exacte locatie
      wordt aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004267#Artikel3
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0004267
        artikel: '3'
        paragraaf: '1'
  - number: '3.1'
    text: Het is verboden te lossen zonder toestemming van een ambtenaar van de AID.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: '3.2'
    text: |-
      Op verzoek van degene die vis aanlandt, kan de toestemming als bedoeld in het eerste lid worden verleend door een
      functionaris, namens een ambtenaar van de AID.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: '3.5'
    text: |-
      Het is verboden aan te landen zonder melding aan de AID, overeenkomstig de in de volgende leden opgenomen
      voorwaarden, waarbij het tijdstip van aanlanding in het meldingsbericht niet meer dan een half uur verschilt van
      het daadwerkelijke tijdstip van aanlanding en waarbij de AID toestemming kan verlenen om eerder dan het gemelde
      tijdstip van aanlanding aan te landen.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: '3.6'
    text: Toestemming als bedoeld in het eerste lid wordt gegeven in de volgorde van melding van het tijdstip van aanlanding.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: '3.7'
    text: 'Een melding als bedoeld in het vijfde lid dient:'
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.7.a
    text: |-
      plaats te vinden door verzending van een faxbericht door de kapitein, eigenaar of diens gemachtigde aan de
      meldkamer van de Algemene Inspectiedienst te Kerkrade (045–5461011), waarin ten minste is aangegeven:
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.7.a.1°
    text: de haven van aanlanding;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.7.a.2°
    text: de datum en het tijdstip van aanlanding;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.7.a.3°
    text: de datum en het tijdstip van het doen van de melding;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.7.a.4°
    text: de roepletters van het vissersvaartuig;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.7.a.5°
    text: de naam van de ondernemer;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.7.a.6°
    text: de naam van de kapitein;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.7.a.7°
    text: de lettertekens en het nummer van het vissersvaartuig;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.7.a.8°
    text: |-
      voor zover er meer dan 1 ton kabeljauw aan boord van het vissersvaartuig wordt gehouden, de hoeveelheden in
      kilogram levend gewicht per vissoort waarvan meer dan 50 kg aan boord wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.7.a.9°
    text: |-
      voor zover er meer dan 10 ton haring, makreel, horsmakreel of een combinatie daarvan, die is gevangen in de
      gebieden, bedoeld in [artikel 2, achtste lid][ref1], aan boord wordt gehouden, de hoeveelheden in kilogram levend
      gewicht per vissoort, het aantal dozen per vissoort en het gebied waar de vis is gevangen, bedoeld in artikel 1 van
      Verordening (EG) nr. 1542/2007 van de Commissie van 20 december 2007 betreffende aanvoer- en weegprocedures voor
      haring, makreel en horsmakreel (PbEU L337), en


      [ref1]: https://wetten.overheid.nl/BWBR0004267#Artikel2
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004267
        artikel: '2'
        paragraaf: '1'
  - number: 3.7.a.10°
    text: |-
      voor zover er meer dan 2 ton heek aan boord van het vissersvaartuig wordt gehouden, die is gevangen in de gebieden,
      bedoeld in artikel 1 van [Verordening (EG) Nr. 811/2004](32004R0811) van de Raad van 21 april 2004 tot vaststelling
      van herstelmaatregelen voor het noordelijke heekbestand (PbEU L 150), de hoeveelheden in kilogram levend gewicht
      per vissoort waarvan meer dan 50 kg aan boord wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.7.b
    text: ten minste 4 uur vóór het tijdstp van aanlanding plaats te vinden;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.7.c
    text: |-
      in afwijking van onderdeel b, door een vaartuig met een lengte over alles van 10 meter of minder ten minste twee
      uur voor het tijdstip van aanlanding plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: '3.8'
    text: |-
      In afwijking in zoverre van het zevende lid geschiedt de aldaar genoemde melding in de gevallen, bedoeld in artikel
      11 ter, vierde lid, van [Verordening (EG) nr. 894/97](31997R0894) van de Raad van de Europese Unie van 29 april
      1997 houdende technische maatregelen voor de instandhouding van de visbestanden (PbEG L 132) ten minste twee uur
      vóór het tijdstip van aanlanding.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: '3.9'
    text: |-
      Onverminderd [artikel 2][ref1] en het eerste, tweede en vijfde lid is degene die het voornemen heeft met een
      vissersvaartuig dat de vlag voert van, of geregistreerd is in, een andere lid-staat van de Europese Gemeenschap
      dan Nederland vis aan te landen of te lossen in een Nederlandse haven verplicht ten minste vier uur voor het
      tijdstip van aanlanding daarvan melding te doen door verzending van een faxbericht door de kapitein, eigenaar of
      diens gemachtigde aan de meldkamer van de Algemene Inspectiedienst te Kerkrade (045-5461011), waarin ten minste
      is aangegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0004267#Artikel2
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004267
        artikel: '2'
        paragraaf: '1'
  - number: 3.9.a
    text: de haven van aanlanding;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.9.b
    text: de datum en het tijdstip van aanlanding;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.9.c
    text: de datum en het tijdstip van de melding;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.9.d
    text: de roepletters van het vissersvaartuig;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.9.e
    text: de naam van de kapitein;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.9.f
    text: de lettertekens en het nummer van het vissersvaartuig en
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.9.g
    text: de hoeveelheden per vissoort die zullen worden aangeland.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: '3.10'
    text: |-
      Het negende lid is eveneens van toepassing op degene die het voornemen heeft met een vissersvaartuig van een derde
      land in een Nederlandse haven vis aan te landen en te lossen met dien verstande dat, behoudens voor zover het
      betreft een vissersvaartuig dat de vlag voert van, of geregistreerd is in Noorwegen of IJsland, de melding ten
      minste 72 uur voor het tijdstip van aanlanding moet plaatsvinden en dat die melding tevens inhoudt waar de vangsten
      zijn gedaan, aan te geven door vermelding van een of meer van de volgende gebieden:
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.10.a
    text: de communautaire visserijzone;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.10.b
    text: |-
      een visserijzone die onder de jurisdictie of soevereiniteit van een andere staat dan een lidstaat van de Europese
      Unie;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.10.c
    text: een gebied dat niet onder een van de in onderdelen a en b genoemde gebieden valt.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: '3.11'
    text: |-
      De melding, bedoeld in artikel 24, derde lid, van de verordening van 18 december 2008 van de Raad van de Europese
      Unie tot vaststelling van een langetermijnplan voor kabeljauwbestanden en de bevissing van deze bestanden, en
      tot intrekking van Verordening (EG) nr. 423/2004 en in artikel 8, derde lid, van [Verordening (EG) Nr. 811/2004]
      (32004R0811) van de Raad van 21 april 2004 tot vaststelling van herstelmaatregelen voor het noordelijke heekbestand
      (PbEU L 150), vindt plaats overeenkomstig het zevende lid, onderdeel a, en bevat de gegevens, bedoeld in dat
      onderdeel.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: '3.12'
    text: De melding, bedoeld in het tiende lid, wordt gesteld in de Nederlandse, Franse, Duitse of Engelse taal.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: '3.15'
    text: |-
      In afwijking van het zevende lid doet de kapitein of diens gemachtigde van een vissersvaartuig dat in de Noordzee
      heeft gevaren en die een hoeveelheid schol of tong wil aanlanden in een haven of op een plaats van aanlanding in
      een derde land, ten minste 24 uur vóór de aanlanding in het derde land een melding van:
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.15.a
    text: de naam van de haven of de plaats van aanlanding,
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.15.b
    text: het vermoedelijke tijdstip van aankomst in die haven of op die plaats van aanlanding,
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.15.c
    text: de hoeveelheden, in kilogram levend gewicht, per soort waarvan meer dan 50 kilogram aan boord is.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: '3.16'
    text: |-
      De kapitein, eigenaar of diens gemachtigde van een vissersvaartuig, een vissersvaartuig dat de vlag voert van, of
      geregistreerd is in, een andere lidstaat van de Europese Gemeenschap dan Nederland, of een vissersvaartuig van een
      derde land, dat Dissostichus spp. aan boord heeft en dat gevist heeft in het verdragsgebied, bedoeld in artikel
      2, onderdeel a, van verordening (EG) nr. 601/2004 van de Raad van 22  maart 2004 tot vaststelling van bepaalde
      controlemaatregelen voor de visserij in het verdragsgebied van het Verdrag inzake de instandhouding van de levende
      rijkdommen in de Antarctische wateren en tot intrekking van de Verordeningen (EEG) nr. 3943/90, (EG) nr. 66/98 en
      (EG) nr. 1721/1999 (PbEU L 97), laat de melding, bedoeld in het vijfde, negende of tiende lid, vergezeld gaan van
      een door hem ondertekende schriftelijke verklaring als bedoeld in artikel 27, tweede lid, van die verordening.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: '3.17'
    text: |-
      In afwijking in zoverre van het vijfde, zevende, negende en tiende lid stelt de kapitein, of zijn
      vertegenwoordiger, van een vissersvaartuig als bedoeld in artikel 3, onderdeel 1, van verordening (EG)
      nr. 1386/2007 van 22 oktober 2007 tot vaststelling van instandhoudings- en handhavingsmaatregelen in het
      gereglementeerde gebied van de Visserijorganisatie voor het noordwestelijk deel van de Atlantische Oceaan (PbEU
      L 318), die het voornemen heeft in een Nederlandse haven vis aan te landen en te lossen, de AID in kennis van de
      gegevens, bedoeld in artikel 64, tweede lid, onderdelen a tot en met d, van die verordening. De kapitein of diens
      vertegenwoordiger doet de melding ten minste 48 uur voor het vermoedelijke tijdstip van aankomst in de haven door
      verzending van een elektronisch bericht of een ondertekend faxbericht aan de meldkamer van de AID te Kerkrade (045-
      5461011).
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: '3.18'
    text: |-
      In afwijking van het zevende lid, doen vissersvaartuigen met een lengte over alles van 12 meter of meer
      of die betrokken zijn bij visserij op bestanden die onder een meerjarenplan vallen en die op grond van
      [artikel 19a, tweede lid, van de Regeling eisen, administratie en registratie inzake uitoefening visserij][ref1],
      verplicht zijn de gegevens opgenomen in de logboek-, tevens vangstopgaveformulieren, elektronisch in te dienen,
      die voornemens zijn vis aan te laden of te lossen in een Nederlandse haven ten minste vier uur voor tijdstip van
      aankomst in de haven daarvan elektronisch een melding bij de AID, waarin ten minste is aangegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel19a
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020043
        artikel: 19a
  - number: 3.18.a
    text: het externe identificatienummer en de naam van het vissersvaartuig;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.18.b
    text: de naam van de haven van bestemming en het beoogde doel van het aanmeren;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.18.c
    text: de data van de visreis en de betrokken geografische gebieden waar de vangsten zijn gedaan;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.18.d
    text: de datum en het tijdstip waarop de haven vermoedelijk wordt aangedaan;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: 3.18.e
    text: |-
      de in het visserijlogboek, bedoeld in
      [artikel 15 Regeling eisen, administratie en registratie inzake uitoefening visserij][ref1], geregistreerde
      hoeveelheden per soort, en


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel15
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020043
        artikel: '15'
  - number: 3.18.f
    text: de hoeveelheden van elke soort die zullen worden aangeland of overgeladen.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
  - number: '3.19'
    text: |-
      In afwijking van het negende lid, doen vissersvaartuigen met een lengte over alles van 12 meter of meer
      of die betrokken zijn bij visserij op bestanden die onder een meerjarenplan vallen en die op grond van
      [artikel 19a, tweede lid, van de Regeling eisen, administratie en registratie inzake uitoefening visserij][ref1],
      niet verplicht zijn de gegevens opgenomen in de logboek-, tevens vangstopgaveformulieren, elektronisch in te
      dienen en die voornemens zijn vis aan te landen of te lossen in Nederland, ten minste vier uur voor het tijdstip
      van aankomst in de haven een melding aan de AID waarin ten minste de gegevens, bedoeld in het achttiende lid, zijn
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel19a
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020043
        artikel: 19a
  - number: 3a.1
    text: Het is verboden vis over te laden zonder toestemming van een ambtenaar van de AID.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3a
  - number: 3a.2
    text: Het verbod, bedoeld in het eerste lid, is van overeenkomstige toepassing in het geval het overladen is onderbroken.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3a
  - number: 3a.3
    text: |-
      De toestemming, bedoeld in het eerste lid, wordt gegeven na een melding als bedoeld in
      [artikel 3, vijfde en negende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004267#Artikel3
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0004267
        artikel: '3'
        paragraaf: '1'
  - number: 3a.4
    text: |-
      In aanvulling op het eerste lid is overladen slechts mogelijk in de havens, bedoeld in
      [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004267#Artikel2
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0004267
        artikel: '2'
        paragraaf: '1'
  - number: 3b.1
    text: |-
      Het is voor vissersvaartuigen van derde landen verboden gebruik te maken van havendiensten in andere havens dan de
      havens, genoemd in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004267#Artikel2
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0004267
        artikel: '2'
        paragraaf: '1'
  - number: 3b.2
    text: |-
      Het is voor vissersvaartuigen van derde landen verboden de haven binnen te varen zonder door een ambtenaar van de
      AID verleende toestemming als bedoeld in artikel 7, eerste lid, van verordening nr. 1005/2008.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3b
  - number: 3b.3
    text: |-
      In afwijking van het [zevende tot en met het tiende lid van artikel 3][ref1], doet de kapitein van
      een vissersvaartuig van een derde land die voornemens is gebruik te maken van een haven als genoemd in
      [artikel 2, eerste lid][ref2], de melding, bedoeld in artikel 3, vijfde lid, ten minste drie werkdagen voor
      aankomst, door verzending van een door hem ondertekend elektronisch of faxbericht, met daarin de gegevens, bedoeld
      in artikel 6, eerste lid, van verordening nr. 1005/2008, aan de meldkamer van de Algemene Inspectiedienst te
      Kerkrade.


      [ref1]: https://wetten.overheid.nl/BWBR0004267#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004267#Artikel2
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0004267
        artikel: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004267
        artikel: '2'
        paragraaf: '1'
  - number: 3b.4
    text: |-
      Het is verboden in strijd te handelen met de artikelen 5, tweede lid, 6, eerste en tweede lid, 8, eerste lid, en
      10, vijfde lid, van verordening nr. 1005/2008.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3b
  - number: 3b.5
    text: |-
      De aangifte, bedoeld in [artikel 8, eerste lid][ref1], wordt ingediend bij de meldkamer van de Algemene
      Inspectiedienst te Kerkrade met gebruikmaking van het in artikel 3, eerste lid, van verordening nr. 1010/2009,
      bedoelde formulier indien de aangifte betrekking heeft op aanlanding, dan wel met gebruikmaking van het in artikel
      3, tweede lid, van verordening nr. 1010/2009, bedoelde formulier indien de aangifte betrekking heeft op overlading.


      [ref1]: https://wetten.overheid.nl/BWBR0004267#Artikel8
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0004267
        artikel: '8'
        paragraaf: '2'
  - number: '5.1'
    text: |-
      Het bepaalde in [artikel 2, derde lid][ref1], is, voor zover het niet betreft het lossen van vis in de haven van
      Velsen, niet van toepassing op een vissersvaartuig met een brutotonnage van meer dan 1.200 BT waarmee de pelagische
      visserij wordt uitgeoefend, met dien verstande dat voor het hervatten van de lossing toestemming door een ambtenaar
      van de AID moet zijn verleend, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004267#Artikel2
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004267
        artikel: '2'
        paragraaf: '1'
  - number: 5.1.a
    text: vis van onder meer de soorten makreel, haring, horsmakreel, sprot, blauwe wijting of kever wordt aangeland, en
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel5
  - number: 5.1.b
    text: 'voor zover in Vlissingen, IJmuiden of Scheveningen vis wordt gelost, het lossen plaatsvindt:'
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel5
  - number: 5.1.b.1º
    text: in Vlissingen op de kades in de Sloehaven (Bijleveldhaven);
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel5
  - number: 5.1.b.2º
    text: in Scheveningen op de kade gelegen aan de Vissershavenweg aan de oostzijde van de eerste binnenhaven.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel5
  - number: 5.1.b.3º
    text: in IJmuiden op de kades in de Haringhaven;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel5
  - number: '5.2'
    text: |-
      [Artikel 2, vijfde lid][ref1], is niet van toepassing op een vissersvaartuig met een brutotonnage van meer dan
      1.200 BT waarmee de pelagische visserij wordt uitgeoefend, met dien verstande dat het verboden is uit te varen
      voordat alle aan boord aanwezige vis geheel is gelost.


      [ref1]: https://wetten.overheid.nl/BWBR0004267#Artikel2
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004267
        artikel: '2'
        paragraaf: '1'
  - number: '6'
    text: |-
      Het in [artikel 2, eerste lid][ref1], gestelde verbod is, in de periode van 1 april tot en met 31 juli, voor het
      aanlanden en lossen van ansjovis en in de periode van 1 augustus van een kalenderjaar tot en met 31 maart van het
      daarop volgende kalenderjaar voor het aanlanden en lossen van sprot, niet van toepassing indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004267#Artikel2
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004267
        artikel: '2'
        paragraaf: '1'
  - number: 6.a
    text: |-
      met een vissersvaartuig een hoeveelheid vis wordt aangeland die voor ten minste 90% bestaat uit sprot
      onderscheidenlijk ansjovis;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel6
  - number: 6.b
    text: |-
      wordt aangeland en gelost in de westelijke voorhaven van de Bergsediepsluis en onderscheidenlijk of aan de loswal
      van Schore, gemeente Kapelle;
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel6
  - number: 6.c
    text: |-
      ten minste 4 uur vóór het tijdstip van aanlanding, de aanlanding overeenkomstig [artikel 3, vijfde lid][ref1],
      is gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004267#Artikel3
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004267
        artikel: '3'
        paragraaf: '1'
  - number: '7'
    text: Deze regeling treedt in werking met ingang van 1 januari 1988.
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel7
  - number: '8'
    text: |-
      Deze regeling kan worden aangehaald als. ‘[Regeling stelselmatige controle bij aanlanding 1988][ref1]’.


      [ref1]: https://wetten.overheid.nl/BWBR0004267
    url: https://wetten.overheid.nl/BWBR0004267/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004267
