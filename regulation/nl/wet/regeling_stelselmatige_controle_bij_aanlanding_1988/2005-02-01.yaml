  - number: '3'
    text: |-
      1 Het is verboden te lossen zonder toestemming van een ambtenaar van de AID.

      2 Op verzoek van degene die vis aanlandt, kan de toestemming als bedoeld in het eerste lid worden verleend door een
      functionaris, namens een ambtenaar van de AID.

      3 Het is verboden aan te landen zonder melding aan de AID, overeenkomstig de in de volgende leden opgenomen
      voorwaarden, waarbij het tijdstip van aanlanding in het meldingsbericht niet meer dan een half uur verschilt van
      het daadwerkelijke tijdstip van aanlanding.

      4 Toestemming als bedoeld in het eerste lid wordt gegeven in de volgorde van melding van het tijdstip van
      aanlanding.

      5 Een melding als bedoeld in het derde lid dient:

      a. plaats te vinden door verzending van een faxbericht door de kapitein, eigenaar of diens gemachtigde aan de
      meldkamer van de Algemene Inspectiedienst te Kerkrade (045–5461011), waarin ten minste is aangegeven:

      1°. de haven van aanlanding;

      2°. de datum en het tijdstip van aanlanding;

      3°. de datum en het tijdstip van het doen van de melding;

      4°. de roepletters van het vissersvaartuig;

      5°. de naam van de ondernemer;

      6°. de naam van de kapitein;

      7°. de lettertekens en het nummer van het vissersvaartuig;

      8°. voor zover er meer dan 1 ton kabeljauw aan boord van het vissersvaartuig wordt gehouden, de hoeveelheden in
      kilogram levend gewicht per vissoort waarvan meer dan 50 kg aan boord wordt gehouden;

      9°. voor zover er meer dan 10 ton haring, makreel, horsmakreel of een combinatie daarvan, die is gevangen in de
      gebieden, bedoeld in [artikel 2, achtste lid][ref1], aan boord wordt gehouden, de hoeveelheden in kilogram levend
      gewicht per vissoort en het aantal dozen per vissoort, en

      10°. voor zover er meer dan 2 ton heek aan boord van het vissersvaartuig wordt gehouden, die is gevangen in de
      gebieden, bedoeld in artikel 1 van [Verordening (EG) Nr. 811/2004](32004R0811) van de Raad van 21 april 2004 tot
      vaststelling van herstelmaatregelen voor het noordelijke heekbestand (PbEU L 150), de hoeveelheden in kilogram
      levend gewicht per vissoort waarvan meer dan 50 kg aan boord wordt gehouden;

      b. ten minste 4 uur vóór het tijdstp van aanlanding plaats te vinden;

      c. in afwijking van onderdeel b, door een vaartuig met een lengte over alles van 10 meter of minder ten minste twee
      uur voor het tijdstip van aanlanding plaats te vinden.

      6 In afwijking in zoverre van het vijfde lid geschiedt de aldaar genoemde melding in de gevallen, bedoeld in
      artikel 11 ter, vierde lid, van [Verordening (EG) nr. 894/97](31997R0894) van de Raad van de Europese Unie van 29
      april 1997 houdende technische maatregelen voor de instandhouding van de visbestanden (PbEG L 132) ten minste twee
      uur vóór het tijdstip van aanlanding.

      7 Onverminderd [artikel 2 en het eerste, tweede en derde lid][ref2] is degene die het voornemen heeft met een
      vissersvaartuig dat de vlag voert van, of geregistreerd is in, een andere lid-staat van de Europese Gemeenschap
      dan Nederland vis aan te landen of te lossen in een Nederlandse haven verplicht ten minste vier uur voor het
      tijdstip van aanlanding daarvan melding te doen door verzending van een faxbericht door de kapitein, eigenaar of
      diens gemachtigde aan de meldkamer van de Algemene Inspectiedienst te Kerkrade (045-5461011), waarin ten minste
      is aangegeven:

      a. de haven van aanlanding;

      b. de datum en het tijdstip van aanlanding;

      c. de datum en het tijdstip van de melding;

      d. de roepletters van het vissersvaartuig;

      e. de naam van de kapitein;

      f. de lettertekens en het nummer van het vissersvaartuig en

      g. de hoeveelheden per vissoort die zullen worden aangeland.

      8 Het zevende lid is eveneens van toepassing op degene die het voornemen heeft met een vissersvaartuig dat de
      vlag voert van, of geregistreerd is in, een andere staat dan een lid-staat van de Europese Gemeenschap in een
      Nederlandse haven vis aan te landen en te lossen met dien verstande dat, behoudens voor zover het betreft een
      vissersvaartuig dat de vlag voert van, of geregistreerd is in Noorwegen of IJsland, de melding ten minste 72 uur
      voor het tijdstip van aanlanding moet plaatsvinden en dat die melding tevens inhoudt waar de vangsten zijn gedaan,
      aan te geven door vermelding van een of meer van de volgende gebieden:

      a. de communautaire visserijzone;

      b. een visserijzone die onder de jurisdictie of soevereiniteit van een andere staat dan een lidstaat van de
      Europese Unie;

      c. een gebied dat niet onder een van de in onderdelen a en b genoemde gebieden valt.

      9 De melding, bedoeld in artikel 11, derde lid, van [Verordening (EG) Nr. 423/2004](32004R0423) van de Raad van 26
      februari 2004 tot vaststelling van herstelmaatregelen voor bepaalde kabeljauwbestanden (PbEU L 70) en in artikel
      8, derde lid, van [Verordening (EG) Nr. 811/2004](32004R0811) van de Raad van 21 april 2004 tot vaststelling van
      herstelmaatregelen voor het noordelijke heekbestand (PbEU L 150), vindt plaats overeenkomstig het vijfde lid,
      onderdeel a, en bevat de gegevens, bedoeld in dat onderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0004267#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004267#Artikel2
