  - number: 2a
    text: |-
      1 In afwijking van [artikel 2, eerste lid][ref1], is het toegestaan vis aan te landen of te lossen in de plaatsen,
      bedoeld in bijlage 3, behorende bij deze regeling met een vissersvaartuig met een lengte over alles van 10 meter
      of minder.

      2 In afwijking van [artikel 3, vijfde lid, onderdeel a, onder 1°][ref2], wordt bij het aanlanden of lossen van vis
      in de in het eerste lid genoemde plaatsen melding gemaakt van de plaats van aanlanding, waarbij de exacte locatie
      wordt aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004267#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004267#Artikel3
