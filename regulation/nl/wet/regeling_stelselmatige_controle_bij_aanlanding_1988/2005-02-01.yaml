preamble:
  text: >-
    Gelet op de artikelen 3 en 4 van het Reglement zee- en kustvisserij 1977 (Stb. 666);


    Na overleg met het Produktschap voor Vis en Visprodukten, het Visserijschap en het Bedrijfschap voor de Groothandel
    in Vis en Aanverwante Bedrijven;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0004267/2005-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 a. *ondernemer*: degene te wiens naam het vissersvaartuig in het visserijregister, bedoeld in
      [artikel 4 van het Besluit registratie vissersvaartuigen 1998][ref1], is geregistreerd;

      b.

      c. *minister*: minister van Landbouw, Natuur en Voedselkwaliteit;

      d. *AID*: Algemene Inspectiedienst van het ministerie van Landbouw, Natuur en Voedselkwaliteit;

      e. *functionaris*: door de minister van Landbouw, Natuur en Voedselkwaliteit voor de registratie- en
      verificatiewerkzaamheden in het kader van deze regeling aangewezen persoon.

      2 Voor de toepassing van het bepaalde in deze regeling vindt het aanlanden van vis plaats op het tijdstip waarop
      het vissersvaartuig direct of indirect verbinding met de wal heeft gekregen.

      3 Deze regeling is van toepassing op vis die is aangewezen krachtens
      [artikel 1, tweede lid, onderdeel a, van de Visserijwet 1963][ref2], met uitzondering van vissoorten waarop de
      binnenvisserij als genoemd in [artikel 1, vierde lid, onderdeel d, van die wet][ref3] wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002416#Artikel1
