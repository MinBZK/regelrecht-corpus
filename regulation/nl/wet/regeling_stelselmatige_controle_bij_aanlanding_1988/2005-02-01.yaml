  - number: '6'
    text: |-
      Het in [artikel 2, eerste lid][ref1], gestelde verbod is, in de periode van 1 april tot en met 31 juli, voor het
      aanlanden en lossen van ansjovis en in de periode van 1 augustus van een kalenderjaar tot en met 31 maart van het
      daarop volgende kalenderjaar voor het aanlanden en lossen van sprot, niet van toepassing indien:

      a. met een vissersvaartuig een hoeveelheid vis wordt aangeland die voor ten minste 90% bestaat uit sprot
      onderscheidenlijk ansjovis;

      b. wordt aangeland en gelost in de westelijke voorhaven van de Bergsediepsluis en onderscheidenlijk of aan de
      loswal van Schore, gemeente Kapelle;

      c. ten minste 4 uur vóór het tijdstip van aanlanding, de aanlanding overeenkomstig [artikel 3, vijfde lid][ref2],
      is gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004267#Artikel2
