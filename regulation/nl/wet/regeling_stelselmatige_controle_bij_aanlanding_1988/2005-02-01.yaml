  - number: '5'
    text: |-
      1 Het bepaalde in [artikel 2, derde lid][ref1], is, voor zover het niet betreft het lossen van vis in de haven van
      Velsen, niet van toepassing op een vissersvaartuig met een brutotonnage van meer dan 1.200 BT waarmee de pelagische
      visserij wordt uitgeoefend, met dien verstande dat voor het hervatten van de lossing toestemming door een ambtenaar
      van de AID moet zijn verleend, indien:

      a. vis van onder meer de soorten makreel, haring, horsmakreel, sprot, blauwe wijting of kever wordt aangeland, en

      b. voor zover in Vlissingen, IJmuiden of Scheveningen vis wordt gelost, het lossen plaatsvindt:

      1º. in Vlissingen op de kades in de Sloehaven (Bijleveldhaven);

      2º. in Scheveningen op de kade gelegen aan de Vissershavenweg aan de oostzijde van de eerste binnenhaven.

      3º. in IJmuiden op de kades in de Haringhaven;

      2 [Artikel 2, vijfde lid][ref2], is niet van toepassing op een vissersvaartuig met een brutotonnage van meer dan
      1.200 BT waarmee de pelagische visserij wordt uitgeoefend, met dien verstande dat het verboden is uit te varen
      voordat alle aan boord aanwezige vis geheel is gelost.


      [ref1]: https://wetten.overheid.nl/BWBR0004267#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004267#Artikel2
