  - number: '2'
    text: |-
      1 Het is verboden vis in Nederland aan te landen of te lossen in een andere haven dan de havens Breskens (Gemeente
      Oostburg), Vlissingen, Vlaardingen, Colijnsplaat (Gemeente Noord-Beveland), Stellendam (Gemeente Goedereede),
      Scheveningen (Gemeente 's-Gravenhage), IJmuiden (Gemeente Velsen), Velsen, Den Helder, Den Oever (gemeente
      Wieringen), Harlingen, Lauwersoog (Gemeente De Marne), Delfzijl, Termunterzijl (Gemeente Delfzijl), Eemshaven
      (Gemeente Eemsmond) en Urk.

      2 Het is verboden vis aan te landen of te lossen in de havens Breskens, Vlissingen, Vlaardingen, Colijnsplaat,
      Stellendam, Scheveningen, IJmuiden, Velsen, Den Helder, Den Oever, Harlingen, Lauwersoog, Delfzijl, Termunterzijl,
      Eemshaven en Urk.

      3 Het is verboden in een in het tweede lid genoemde haven op een andere plaats onderscheidenlijk plaatsen vis te
      lossen dan de in Bijlage 1 behorende bij deze regeling genoemde plaatsen.

      4 Het verbod, bedoeld in het tweede lid, is niet van toepassing op vissersvaartuigen:

      a. die behoren tot het segment MFL1 of MFL2, bedoeld in
      [artikel 1, onderdeel l, van de Regeling visvergunning][ref1], met uitzondering van vissersvaartuigen met een
      brutotonnage van meer dan 1.200 BT waarmee de pelagische visserij wordt uitgeoefend, en die een lengte over
      alles van meer dan 10 meter hebben, voor het lossen dat is aangevangen in de havens en binnen de daarbij vermelde
      lostijden, bedoeld in [Bijlage 2][ref2], behorende bij deze regeling;

      b. met een brutotonnage van meer dan 1.200 BT waarmee de pelagische visserij wordt uitgeoefend, voor het lossen
      dat is aangevangen in de havens, bedoeld in [Bijlage 2][ref3], behorende bij deze regeling, alsmede in de haven
      van Velsen;

      c. met een lengte over alles van 10 meter of minder;

      d. die de vlag voeren van of geregistreerd zijn in een andere staat dan Nederland met een lengte over alles van ten
      hoogste 59 meter, voor het lossen dat is aangevangen in de havens en binnen de daarbij vermelde lostijden, bedoeld
      in [Bijlage 2][ref4], behorend bij deze regeling;

      e. die de vlag voeren van of geregistreerd zijn in een andere staat dan Nederland met een lengte over alles van
      meer dan 59 meter, voor het lossen dat is aangevangen in de havens bedoeld in [Bijlage 2][ref5], behorend bij deze
      regeling, alsmede in de haven van Velsen.

      5 Nadat het lossen is aangevangen, dient alle zich aan boord van het vissersvaartuig bevindende vis, met
      uitzondering van paling, in één ononderbroken losbeurt in zijn geheel te worden gelost.

      6 Het is verboden aan te vangen met het lossen van vis indien de vis niet per verpakkingseenheid naar vissoort voor
      zover genoemd in de bijlage 2, 3 en 4 van de Regeling vangstbeperking is gesorteerd.

      7 Het is verboden vis van soorten als bedoeld in bijlage 2, 3 en 4 van de Regeling vangstbeperking te lossen tenzij
      deze vis per vissoort wordt gelost.

      8 Het verbod, bedoeld in het tweede lid, is niet van toepassing voor het aanlanden en lossen van vis in de
      havens van Eemshaven, Harlingen, IJmuiden, Scheveningen, Velsen en Vlissingen indien met een vissersvaartuig een
      hoeveelheid vis wordt aangeland die voor meer dan 10 ton bestaat uit de soort haring, makreel, horsmakreel of een
      combinatie daarvan die is gevangen in de gebieden, bedoeld in onderdeel 9.1 van bijlage III van [verordening (EG)
      nr. 27/2005](32005R0027) van de Raad van 22 december 2004 tot vaststelling, voor 2005, van de vangstmogelijkheden
      voor sommige visbestanden en groepen visbestanden welke in de wateren van de Gemeenschap en, voor vaartuigen van
      de Gemeenschap, in andere wateren met vangstbeperkingen van toepassing zijn, en tot vaststelling van de bij de
      visserij in acht te nemen voorschriften (PbEU L 12).

      9 Het in het tweede lid gestelde verbod is niet van toepassing voor het aanlanden en lossen van vis in de havens
      van IJmuiden en Scheveningen indien:

      a. met een vissersvaartuig een hoeveelheid vis wordt aangeland die voor ten minste 95% uit de soort haring bestaat,
      en

      b. de ondernemer voor het vissersvaartuig in het bezit is van een op de in onderdeel a bedoelde vissoort betrekking
      hebbend document als bedoeld in artikel 25 van de Regeling contingentering zeevis.


