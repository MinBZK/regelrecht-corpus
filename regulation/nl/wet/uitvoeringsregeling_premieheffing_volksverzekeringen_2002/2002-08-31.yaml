articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder de wet: de [Wet financiering volksverzekeringen][ref1].

      2 Voor de toepassing van deze regeling worden de landen van het Koninkrijk der Nederlanden aangemerkt als
      afzonderlijke mogendheden.


      [ref1]: https://wetten.overheid.nl/BWBR0004538
    url: https://wetten.overheid.nl/BWBR0013980/2002-08-31#Artikel1
    references:
      - id: ref1
