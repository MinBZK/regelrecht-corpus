  - number: '9'
    text: |-
      1 De [Uitvoeringsregeling premieheffing volksverzekeringen 1990](onbekend) wordt ingetrokken.

      2 Voor de premieheffing volksverzekeringen over de jaren voorafgaande aan het jaar 2002 blijft de
      [Uitvoeringsregeling premieheffing volksverzekeringen 1990](onbekend), zoals deze regeling luidde voor de datum van
      inwerkingtreding van deze regeling, van toepassing.
    url: https://wetten.overheid.nl/BWBR0013980/2002-08-31#Artikel9
  - number: '10'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst, en werkt terug tot en met 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0013980/2002-08-31#Artikel10
