  - number: '3'
    text: |-
      Ingeval zich ten aanzien van een verzekerde die in de premieheffing bij wege van aanslag wordt betrokken in
      het kalenderjaar tijdvakken voordoen waarin anders dan ingevolge [artikel 12 van de wet][ref1] verschillende
      premiepercentages gelden, wordt van hem de premie geheven naar een percentage (heffingspercentage) dat is
      samengesteld uit tijdsevenredige delen van die verschillende premiepercentages. Het heffingspercentage wordt
      afgerond op honderdsten naar beneden.


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel12
    url: https://wetten.overheid.nl/BWBR0013980/2002-08-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '12'
  - number: '4'
    text: |-
      Voor de premieheffing behoren niet tot het premie-inkomen:

      a. uitkeringen op grond van de socialezekerheidswetgeving van een andere mogendheid die zijn onderworpen aan
      premieheffing krachtens een wettelijke regeling inzake uitkeringen bij ouderdom en overlijden van die andere
      mogendheid;

      b. ten aanzien van degene die verzekerd is en die tevens werkzaamheden verricht of heeft verricht buiten Nederland:
      het gedeelte van het premie-inkomen waarop, op grond van een internationale regeling inzake sociale zekerheid
      die tussen Nederland en een of meer andere mogendheden van kracht is, de wetgeving van een andere mogendheid van
      toepassing is, of dat, bij gebreke van een internationale regeling, is onderworpen aan premieheffing krachtens een
      wettelijke regeling inzake uitkeringen bij ouderdom en overlijden van een andere mogendheid;

      c. ten aanzien van degene die niet is uitgezonderd van de volksverzekeringen op grond van de [artikelen 13, eerste
      lid, onderdeel a, 13, tweede lid, onderdeel c, 13, derde lid, onderdeel a, 13, vierde lid, onderdeel c](onbekend),
      [14, eerste lid, onderdeel a](onbekend), [15, eerste lid, onderdelen a, b en c, subonderdeel 1o](onbekend), of
      [16, eerste lid, onderdeel a, van het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999]
      (onbekend) in verband met het verrichten van de in die artikelen bedoelde andere werkzaamheden: het belastbare
      loon uit de dienstbetrekking uit hoofde waarvan hij zou zijn uitgezonderd van de volksverzekeringen indien hij die
      andere werkzaamheden niet zou hebben verricht.
    url: https://wetten.overheid.nl/BWBR0013980/2002-08-31#Artikel4
  - number: '5'
    text: |-
      1 Ten aanzien van degene die gedurende een gedeelte van het kalenderjaar niet premieplichtig doch gedurende
      die periode wel belastingplichtig is, wordt voor de premieheffing bij wege van aanslag het premie-inkomen naar
      tijdsevenredigheid afgeleid van het premie-inkomen dat in aanmerking zou zijn genomen als de premieplicht volledig
      zou zijn samengevallen met de belastingplicht.

      2 In afwijking van het eerste lid wordt als premie-inkomen geen hoger bedrag in aanmerking genomen dan het premie-
      inkomen verminderd met het gedeelte daarvan, waarop, op grond van een internationale regeling inzake sociale
      zekerheid die tussen Nederland en een of meer andere mogendheden van kracht is, de wetgeving van een andere
      mogendheid van toepassing is, of dat, bij gebreke van een internationale regeling, is onderworpen aan premieheffing
      krachtens een wettelijke regeling inzake uitkeringen bij ouderdom en overlijden van een andere mogendheid.
    url: https://wetten.overheid.nl/BWBR0013980/2002-08-31#Artikel5
  - number: '6'
    text: |-
      Ten aanzien van degene die gedurende een deel van het kalenderjaar anders dan door overlijden niet premieplichtig
      is, wordt voor de premieheffing bij wege van aanslag als premie-inkomen in aanmerking genomen het bedrag dat
      naar tijdsevenredigheid is afgeleid van het in [artikel 10, zesde lid, van de wet][ref1] vermelde premie-inkomen
      dat maximaal in aanmerking zou zijn genomen indien gedurende het gehele kalenderjaar sprake zou zijn geweest van
      premieplicht, tenzij toepassing van de bepalingen in de wet of van de overige bepalingen in deze regeling tot een
      lager premie-inkomen leidt.


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel10
    url: https://wetten.overheid.nl/BWBR0013980/2002-08-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '10'
  - number: '7'
    text: |-
      Ingeval voor de premieheffing bij wege van aanslag het heffingspercentage of het premie-inkomen moet worden bepaald
      door middel van tijdsevenredige vaststelling, wordt daarbij:

      a. een kalenderjaar op 360 dagen gesteld;

      b. een kalendermaand op 30 dagen gesteld;

      c. de dag waarop het tijdvak aanvangt als een gehele dag in aanmerking genomen;

      d. de dag waarop het tijdvak eindigt niet in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0013980/2002-08-31#Artikel7
  - number: '8'
    text: |-
      1 Voor de toepassing van [artikel 9 van de wet][ref1] wordt degene die verzekerd is uit hoofde van werkzaamheden
      of vroegere werkzaamheden dan wel uit hoofde van het recht op een uitkering waarvan de opbrengst niet aan de
      loonbelasting is onderworpen, geacht ook voor die opbrengst daaraan te zijn onderworpen.

      2 Voor de toepassing van [artikel 9 van de wet][ref2] wordt de in het eerste lid bedoelde verzekerde
      geacht aan de loonbelasting te zijn onderworpen voorzover hij uit een dienstbetrekking of vroegere
      dienstbetrekking in de zin van de wettelijke bepalingen betreffende de loonbelasting loon geniet van
      een inhoudingsplichtige in de zin van die bepalingen dan wel een uitkering geniet die is genoemd in
      [artikel 11, eerste lid, van het Uitvoeringsbesluit loonbelasting 1965][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004538#Artikel9
