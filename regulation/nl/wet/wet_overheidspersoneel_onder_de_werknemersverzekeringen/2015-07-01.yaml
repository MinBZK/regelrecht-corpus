    text: |-
      1 Het Landelijk instituut sociale verzekeringen liquideert vóór het tijdstip gelegen twee jaar na het tijdstip van
      aanvang van fase 1 van deze wet het vermogen van het FAOP.

      2 In verband met de uitvoering van het eerste lid gaan alle vermogensbestanddelen van het FAOP op het tijdstip van
      aanvang van fase 1 van deze wet over op het Landelijk instituut sociale verzekeringen.

      3 Het Landelijk instituut sociale verzekeringen beheert en administreert het vermogen dat op grond van het tweede
      lid is overgegaan in de vorm van een afzonderlijke rekening.

      4 Het Landelijk instituut sociale verzekeringen draagt vóór het tijdstip, gelegen een jaar na het tijdstip
      van aanvang van fase 1 van deze wet, een deel van het vermogen, bedoeld in het derde lid, over aan het
      Arbeidsongeschiktheidsfonds, bedoeld in [artikel 72 van de WAO][ref1].

      5 Het in het vierde lid bedoelde deel van het vermogen bestaat uit:

      a. een bedrag dat het resultaat is van een breuk, waarvan de teller wordt gevormd door het aanwezige vermogen
      van het Arbeidsongeschiktheidsfonds, bedoeld in [artikel 72 van de WAO][ref2], vermenigvuldigd met de
      lasten van het FAOP, bedoeld in [artikel 21a van de Wet FVP/ABP][ref3], en de noemer door de lasten van het
      Arbeidsongeschiktheidsfonds, bedoeld in [artikel 76, derde lid, van de WAO][ref4], en

      b. een bedrag ter dekking van de uitgaven op grond van [artikel 42, eerste lid][ref5], met inbegrip van
      de uitvoeringskosten van het Landelijk instituut sociale verzekeringen ter zake van de toepassing van
      [artikel 42, eerste lid][ref6].

      6 De toepassing van het vierde lid geldt de aldaar genoemde aanwezige vermogens en lasten op de dag voorafgaand aan
      het tijdstip van aanvang van fase 1 van deze wet.

      7 Onder «[artikel 72 van de WAO][ref7]» en «[artikel 76, derde lid, van de WAO][ref8]» in het vijfde lid, onderdeel
      a, genoemd, wordt verstaan de [artikelen 72][ref9] en [76, derde lid, van de WAO][ref10] zoals dat artikel en dat
      artikellid luidden op de dag voorafgaande aan het tijdstip van aanvang van fase 1 van deze wet.

      8 Bij algemene maatregel van bestuur op voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid, in
      overeenstemming met Onze Minister van Binnenlandse Zaken, worden regels gesteld met betrekking tot het vierde en
      het vijfde lid.

      9 Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, worden regels gesteld met betrekking tot de liquidatie van het FAOP.

      10 Met ingang van de datum van inwerkingtreding van de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref11]
      treedt het Uitvoeringsinstituut werknemersverzekeringen in de plaats van het Landelijk instituut sociale
      verzekeringen.


