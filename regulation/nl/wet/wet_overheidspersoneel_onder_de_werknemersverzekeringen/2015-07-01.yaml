    text: |-
      De TBA wordt toegepast op een ingevolge [artikel 13, eerste of tweede lid][ref1], toegekende uitkering op grond van
      de WAO, met inachtneming van het volgende:

      a. de datum van ingang van de in [artikel 12, eerste lid, onderdeel b of c][ref2], bedoelde WAO-conforme uitkering
      geldt als de datum van ingang van de uitkering op grond van de WAO;

      b. artikel XVI van de TBA is van toepassing op de overheidswerknemer of gewezen overheidswerknemer op wie op de dag
      voorafgaande aan het tijdstip van aanvang van fase 1 van deze wet artikel XX dan wel XXIV van de TBA van toepassing
      was, met dien verstande dat [artikel 18, zesde lid, van de WAO][ref3] niet van toepassing is;

      c. de artikelen XVII tot en met XIX van de TBA zijn van toepassing op de overheidswerknemer of gewezen
      overheidswerknemer op wie op de dag voorafgaande aan het tijdstip van aanvang van fase 1 van deze wet de artikelen
      XXI tot en met XXIII dan wel XXV tot en met XXVII van de TBA van toepassing waren.


