  - number: 32a
    text: |-
      1 Onder de in [artikel 16, eerste lid, van de WW][ref1] bedoelde arbeidsuren per kalenderweek wordt voor de
      gewezen overheidswerknemer, bedoeld in [artikel 31, eerste, tweede of derde lid][ref2], verstaan het aantal
      uren waarin die overheidswerknemer laatstelijk was aangesteld respectievelijk waarvoor hij laatstelijk in
      dienst was genomen in het dienstverband waarop het recht op uitkering op grond van de [WW][ref3], bedoeld in
      [artikel 31, eerste, tweede of derde lid][ref4], betrekking heeft.

      2 In afwijking van het eerste lid, wordt onder de in [artikel 16, eerste lid, van de WW][ref5] bedoelde arbeidsuren
      per kalenderweek voor de gewezen overheidswerknemer, bedoeld in [artikel 31, eerste of vierde lid][ref6],
      die op de dag voorafgaande aan het tijdstip van aanvang van fase 3 van deze wet recht heeft op
      een uitkering op grond van het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref7], het
      [Werkloosheidsbesluit beroepsmilitairen bepaalde tijd][ref8], het [Werkloosheidsbesluit defensiepersoneel][ref9]
      of een met die besluiten vergelijkbare regeling, verstaan het in het kader van dat recht vastgestelde aantal
      arbeidsuren per kalenderweek.

      3 In afwijking van het eerste lid, wordt onder de in [artikel 16, eerste lid, van de WW][ref10] bedoelde arbeidsuren
      per kalenderweek voor de gewezen overheidswerknemer, bedoeld in [artikel 31, tweede of vierde lid][ref11],
      wiens recht op uitkering op grond van het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref12], het
      [Werkloosheidsbesluit beroepsmilitairen bepaalde tijd][ref13], het [Werkloosheidsbesluit defensiepersoneel][ref14]
      of een met die besluiten vergelijkbare regeling, in verband met een omstandigheid als bedoeld in
      [artikel 20, eerste lid, onderdeel a, b, c of d, van de WW ][ref15]voorafgaande aan het tijdstip van aanvang van
      fase 3 van deze wet geëindigd is, verstaan het in het kader van dat recht vastgestelde aantal arbeidsuren per
      kalenderweek.


