  - number: '35'
    text: |-
      1 De overheidswerknemer of de gewezen overheidswerknemer, bedoeld in [artikel 3][ref1], [12][ref2], [20][ref3] of
      [30][ref4], dan wel de beroepsmilitair of de gewezen beroepsmilitair, bedoeld in [artikel 22][ref5] of [28][ref6],
      is verzekerd bij het Landelijk instituut sociale verzekeringen.

      2 Bij het Landelijk instituut sociale verzekeringen wordt, onder bijvoeging van alle relevante stukken die vereist
      zijn voor de uitvoering van deze wet, aangemeld:

      1°. door of namens een overheidswerkgever, een overheidswerknemer of gewezen overheidswerknemer als
      bedoeld in [artikel 3, eerste lid][ref7], [artikel 12, eerste lid, onderdeel a, d of f][ref8], danwel
      [artikel 30, eerste lid][ref9];

      2°. door of namens het bestuur van het FAOP, een overheidswerknemer of gewezen overheidswerknemer als bedoeld in
      [artikel 12, eerste lid, onderdeel b of c][ref10], of [artikel 20][ref11];

      3°. door of namens Onze Minister van Defensie, een beroepsmilitair of gewezen beroepsmilitair
      als bedoeld in [artikel 22, eerste lid][ref12], of [artikel 28][ref13] danwel, met het oog op
      de toepassing van [artikel 26, tweede lid][ref14], een gewezen beroepsmilitair als bedoeld in
      [artikel 22, eerste lid, onderdeel b][ref15].

      3 Het Landelijk instituut sociale verzekeringen kan voorschriften stellen met betrekking tot:

      a. de door de overheidswerkgevers en het FAOP te leveren gegevens ten behoeve van de toepassing van dit hoofdstuk;

      b. het tijdstip waarop de in onderdeel a bedoelde gegevens uiterlijk moeten zijn aangeleverd bij het Landelijk
      instituut sociale verzekeringen.

      4 Bij de toepassing van dit hoofdstuk mag het Landelijk instituut sociale verzekeringen uitgaan van de door de
      overheidswerkgevers en het FAOP geleverde gegevens.

      5 Met ingang van de datum van inwerkingtreding van de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref16]
      treedt het Uitvoeringsinstituut werknemersverzekeringen in de plaats van het Landelijk instituut sociale
      verzekeringen.


