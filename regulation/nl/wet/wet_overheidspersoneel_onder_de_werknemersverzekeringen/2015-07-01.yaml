  - number: '31'
    text: |-
      1 De gewezen overheidswerknemer, bedoeld in [artikel 30, eerste lid, onderdeel b, onder 3°][ref1], heeft vanaf het
      tijdstip van aanvang van fase 3 van deze wet recht op een uitkering op grond van de WW, indien zijn dienstverband
      op het moment van ingang van zijn recht op wachtgeld aangemerkt zou zijn als dienstbetrekking in de zin van de WW,
      indien de WW van toepassing zou zijn geweest op de dag waarop het recht op wachtgeld ontstond, en dat recht op een
      uitkering op grond van de WW zou voortduren na vorenbedoeld tijdstip.

      2 De gewezen overheidswerknemer, bedoeld in [artikel 30, eerste lid, onderdeel c][ref2], heeft recht op
      een uitkering op grond van de [WW][ref3] vanaf de eerste dag waarop dit recht na het tijdstip van aanvang
      van fase 3 van deze wet zou zijn ontstaan of zou herleven, indien zijn dienstverband aangemerkt zou zijn
      als dienstbetrekking in de zin van de [WW][ref4], indien de [WW][ref5] van toepassing zou zijn geweest
      op de dag waarop het recht op wachtgeld ontstond. De eerste zin is eveneens van toepassing op de gewezen
      overheidswerknemer, bedoeld in het eerste lid, voor wie op het tijdstip van aanvang van fase 3 van deze wet
      geen recht op uitkering op grond van de [WW][ref6] ontstaat in verband met omstandigheden als bedoeld in
      [artikel 20, eerste lid, onderdeel a, b, c of d][ref7], van die wet.

      3 De gewezen overheidswerknemer, bedoeld in [artikel 30, eerste lid, onderdeel d][ref8], heeft recht op een
      uitkering op grond van de WW vanaf de dag, waarop dit recht zou zijn ontstaan indien zijn dienstverband aangemerkt
      zou zijn als dienstbetrekking in de zin van de WW.

      4 De in het eerste onderscheidenlijk het tweede lid bedoelde gewezen overheidswerknemer heeft vanaf het tijdstip
      van aanvang van fase 3 van deze wet onderscheidenlijk vanaf de in het tweede lid bedoelde dag, recht op een
      kortdurende uitkering op grond van de WW, indien zijn dienstverband op het moment van ingang van zijn recht
      op kortdurende uitkering ingevolge het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref9], het
      [Werkloosheidsbesluit beroepsmilitairen bepaalde tijd][ref10], het [Werkloosheidsbesluit defensiepersoneel][ref11]
      of een met die besluiten vergelijkbare regeling, aangemerkt zou zijn als dienstbetrekking in de zin van de WW, en
      dat recht op een kortdurende uitkering op grond van de WW zou voortduren na het tijdstip van aanvang van fase 3 van
      deze wet onderscheidenlijk vanaf de in het tweede lid bedoelde dag.


