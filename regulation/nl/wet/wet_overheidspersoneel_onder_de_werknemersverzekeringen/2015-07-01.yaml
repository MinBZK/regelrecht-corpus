  - number: '64'
    text: |-
      Met ingang van het tijdstip van aanvang van fase 2 van deze wet, bedoeld in [artikel 53][ref1], wordt de
      [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref2] voor de overheidswerknemers,
      bedoeld in [artikel 1, onderdeel l][ref3], en de gewezen overheidswerknemers, op wie de [Werkloosheidswet][ref4]
      van toepassing wordt, als volgt gelezen:

      A. In [artikel 1, onderdeel a][ref5], wordt na «[Wet privatisering ABP][ref6]» toegevoegd:, invaliditeitspensioen,
      bedoeld in de Spoorwegpensioenwet of de Algemene burgerlijke pensioenwet.

      B. Artikel 1, onderdeel b, wordt als volgt gelezen:

      b. werkloze persoon: de persoon, bedoeld in [artikel 2][ref7];.

      C. Artikel 2, tweede lid, wordt als volgt gelezen:

      2. Deze wet en de daarop berustende bepalingen zijn mede van toepassing op
      de persoon, bedoeld in [artikel XX][ref8] , [XXI][ref9], [XXIV][ref10] of
      [XXV van de Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen][ref11], zoals die wet luidde op de dag
      voor inwerkingtreding van de Wet overheidspersoneel onder de werknemersverzekeringen, en die op 31 december 1986 de
      leeftijd van 35 jaar had bereikt en:

      a. die door de toepassing of overeenkomstige toepassing van
      [artikel 18 van de Wet op de arbeidsongeschiktheidsverzekering][ref12] zijn recht op een
      arbeidsongeschiktheidsuitkering verliest, dan wel voor een lagere arbeidsongeschiktheidsuitkering in aanmerking
      komt; of

      b. wiens recht op pensioen door toepassing van artikel E 6 van de Algemene militaire pensioenwet dan wel de
      militaire pensioenbepalingen inzake het recht op pensioen ter zake van arbeidsongeschiktheid op een lagere mate van
      arbeidsongeschiktheid wordt gebaseerd.

      D. Artikel 2, derde lid, wordt als volgt gelezen:

      3. Deze wet en de daarop berustende bepalingen zijn mede van toepassing op de persoon die op 1 augustus 1993
      de leeftijd van 45 jaar had bereikt en die op 31 juli 1993 recht had op een arbeidsongeschiktheidsuitkering of
      een herplaatsingstoelage of herplaatsingswachtgeld op grond van de Spoorwegpensioenwet, de Algemene militaire
      pensioenwet of de Algemene burgerlijke pensioenwet en die vanaf 1 augustus 1993 door de toepassing van artikel 5
      van de Algemene Arbeidsongeschiktheidswet, artikel F 7 van de Spoorwegpensioenwet, artikel F 8a van de Algemene
      burgerlijke pensioenwet, artikel E 6 van de Algemene militaire pensioenwet of de toepassing of overeenkomstige
      toepassing van [artikel 18 van de Wet op de arbeidsongeschiktheidsverzekering][ref13], zoals deze artikelen voor
      deze persoon na de inwerkingtreding van de [Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen][ref14]
      zijn blijven luiden, zijn recht op een arbeidsongeschiktheidsuitkering verliest of heeft verloren dan wel voor een
      lagere arbeidsongeschiktheidsuitkering in aanmerking komt of is gekomen.

      E. In artikel 9, eerste tot en met het derde lid, wordt «[artikel 2, eerste of derde lid][ref15]» vervangen door:
      [artikel 2, eerste, tweede of derde lid][ref16].

      F. In artikel 9, zesde tot en met het achtste lid, wordt «[artikel 2, tweede lid][ref17]» vervangen door:
      [artikel 2, tweede of derde lid][ref18].

      G. Onder vernummering van het negende en tiende lid van artikel 9 tot het elfde en twaalfde lid worden in dat
      artikel een nieuw negende en tiende lid ingevoegd, luidende:

      9. Het dagloon dat ten grondslag ligt aan de uitkering van de werkloze persoon, aan wie op de dag voor de
      toepassing, bedoeld in [artikel 2, derde lid][ref19], een invaliditeitspensioen wordt uitbetaald op grond van de
      Algemene burgerlijke pensioenwet of de Spoorwegpensioenwet, is gelijk aan de door 261 gedeelde berekeningsgrondslag
      waarnaar dat pensioen was berekend. Indien op het in de eerste volzin bedoelde pensioen ingevolge [artikel F 9a van
      de Algemene burgerlijke pensioenwet](onbekend) of artikel F 7a van de Spoorwegpensioenwet een toeslag was verleend,
      wordt voor de vaststelling van het dagloon het bedrag van de berekeningsgrondslag verhoogd met die toeslag.
      [Artikel 15 van de Wet op de arbeidsongeschiktheidsverzekering][ref20] is van toepassing op het dagloon, bedoeld in
      dit lid.

      10. Indien het recht op invaliditeitspensioen is toegekend uit een deeltijdbetrekking, geldt in afwijking van het
      negende lid als dagloon het bedrag dat overeenkomstig dat lid wordt verkregen en vervolgens is vermenigvuldigd met
      de deeltijdfactor.

      H. In het nieuwe [twaalfde lid van artikel 9][ref21] wordt «het negende lid» vervangen door: het elfde lid.


