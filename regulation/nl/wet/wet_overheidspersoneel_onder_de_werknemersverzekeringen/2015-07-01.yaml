      3 Voor de toepassing van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref8] wordt onder het
      bereiken van de volledige uitkeringsduur bedoeld in [hoofdstuk II van de Werkloosheidswet][ref9], mede verstaan het
      bereiken van de volledige uitkeringsduur van een wachtgeld, waarop in verband met de verlaging van een uitkering op
      grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref10] recht is ontstaan tussen 30 september 2004 en 1
      oktober 2005 voor de overheidswerknemer of de gewezen overheidswerknemer die op 31 december 2000 en op 30 september
      2004 recht had op een uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref11], berekend naar
      een mate van arbeidsongeschiktheid van 80% of meer.


