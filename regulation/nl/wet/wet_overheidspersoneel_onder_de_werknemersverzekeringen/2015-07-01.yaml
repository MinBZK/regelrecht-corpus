    text: |-
      1 Voor de vaststelling van de hoogte van de uitkering op grond van de WAO, bedoeld in
      [artikel 13, eerste of tweede lid][ref1], geldt als dagloon in de zin van die wet het dagloon waarnaar de WAO-
      conforme uitkering van de in [artikel 12, eerste lid, onderdeel b of c][ref2], bedoelde overheidswerknemer of
      gewezen overheidswerknemer op grond van artikel 32 van de WPA is berekend op de dag voorafgaande aan het tijdstip
      van aanvang van fase 1 van deze wet.

      2 Voor de vaststelling van de hoogte van de uitkering op grond van de WAO, bedoeld in
      [artikel 13, eerste of tweede lid][ref3], geldt als vervolgdagloon in de zin van die wet het vervolgdagloon
      waarnaar de WAO-conforme uitkering van de in [artikel 12, eerste lid, onderdeel b of c][ref4], bedoelde
      overheidswerknemer of gewezen overheidswerknemer, op grond van [artikel 32 van de WPA ][ref5]is berekend op de dag
      voorafgaande aan het tijdstip van aanvang van fase 1 van deze wet.

      3 Het dagloon bedraagt ten hoogste het bedrag, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref6], met betrekking tot een loontijdvak
      van een dag.

      4 Onze Minister van Sociale Zaken en Werkgelegenheid kan, tezamen met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties en Onze Minister van Defensie, nadere regels stellen met betrekking tot het eerste tot en met
      het derde lid.


