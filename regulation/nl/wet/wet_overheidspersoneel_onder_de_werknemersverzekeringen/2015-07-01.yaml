  - number: '43'
    text: |-
      1 Indien de overheidswerknemer of de gewezen overheidswerknemer, bedoeld in [artikel 4][ref1], ingevolge de op
      hem van toepassing zijnde rechtspositieregeling recht heeft op bezoldiging of uitkering ingeval van ziekte en
      tegelijkertijd ter zake van hetzelfde dienstverband recht heeft op ziekengeld op grond van de [ZW][ref2], wordt het
      eerstbedoelde recht verminderd met het ziekengeld.

      2 Zolang de overheidswerknemer of de gewezen overheidswerknemer, bedoeld in [artikel 31][ref3], ingevolge de op
      hem van toepassing zijnde rechtspositieregeling recht heeft op een wachtgeld en tegelijkertijd recht heeft op
      een uitkering op grond van de WW, wordt het eerstbedoelde recht verminderd met de uitkering op grond van de WW.
      De eerste volzin vindt geen toepassing in het geval de uitkering op grond van de WW wordt genoten ter zake van
      een dienstverband dat ter hand is genomen vóór de dag waarop het ontslag, ter zake waarvan hem het wachtgeld is
      toegekend, hem is aangezegd of door hem is aangevraagd, tenzij dat dienstverband ter hand is genomen gedurende non-
      activiteit, vakantie of verlof onmiddellijk voorafgaande aan bedoeld ontslag.

      3 Het eerste en tweede lid zijn uitsluitend van toepassing indien in de op betrokkene van toepassing zijnde
      rechtspositieregeling geen bepalingen zijn opgenomen ter zake van de in die leden bedoelde samenloop van rechten.


