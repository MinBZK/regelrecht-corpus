      1 De [ZW][ref1] wordt met ingang van het tijdstip van aanvang van fase 2, bedoeld in [artikel 48][ref2], van
      toepassing op de gewezen overheidswerknemer die op de dag voorafgaande aan dat tijdstip geen wachtgeld geniet
      en evenmin bezoldiging of uitkering ingeval van ziekte ontvangt, maar die op dat tijdstip uit hoofde van zijn
      voormalige dienstverband als overheidswerknemer recht zou krijgen op een uitkering op grond van de [WW][ref3], en
      die niet op de dag voorafgaande aan dat tijdstip maar wel op dat tijdstip ongeschikt tot werken is wegens ziekte.

      2 De [ZW][ref4] wordt met ingang van het tijdstip van aanvang van fase 3, bedoeld in [artikel 49][ref5], van
      toepassing op de gewezen overheidswerknemer die op de dag voorafgaande aan het tijdstip van aanvang van fase 2,
      bedoeld in [artikel 48][ref6], recht heeft op:

      a. een wachtgeld waarvan de uitkeringsduur niet op het tijdstip van aanvang van fase 3, bedoeld in
      [artikel 49][ref7], verstrijkt en die op dat tijdstip ongeschikt is tot werken wegens ziekte;

      b. bezoldiging of uitkering ingeval van ziekte, waarvan de uitkeringsduur niet op het tijdstip van aanvang van fase
      3, bedoeld in [artikel 49][ref8], verstrijkt en die op dat tijdstip ongeschikt is tot werken wegens ziekte.

      3 De [ZW][ref9] wordt met ingang van de datum van eindiging van het dienstverband van toepassing op de gewezen
      overheidswerknemer:

      a. die op het tijdstip van aanvang van fase 2, bedoeld in [artikel 48][ref10], bezoldiging of uitkering ingeval van
      ziekte ontvangt,

      b. wiens dienstverband eindigt op of na dat tijdstip doch voor het tijdstip van aanvang van fase 3, bedoeld in
      [artikel 49][ref11], en

      c. die op het moment van die eindiging ongeschikt is tot werken wegens ziekte.

      4 De [ZW][ref12] wordt met ingang van de datum van het intreden van de ongeschiktheid tot werken, doch niet eerder
      dan met ingang van het tijdstip van aanvang van fase 2, bedoeld in [artikel 48][ref13], van toepassing op:

      a. de gewezen overheidswerknemer wiens dienstverband is geëindigd in de maand voorafgaande aan genoemd tijdstip en
      die op de dag voorafgaande aan genoemde datum geen recht heeft op wachtgeld of op bezoldiging of uitkering ingeval
      van ziekte uit hoofde van dat dienstverband;

      b. de gewezen overheidswerknemer wiens recht op wachtgeld wegens het verstrijken van de terzake geldende
      uitkeringsduur is geëindigd in de maand voorafgaande aan genoemd tijdstip;

      c. de gewezen overheidswerknemer wiens recht op wachtgeld wegens het verstrijken van de terzake geldende
      uitkeringsduur is geëindigd op of na het tijdstip van aanvang van fase 2, bedoeld in [artikel 48][ref14], doch voor
      het tijdstip van aanvang van fase 3, bedoeld in [artikel 49][ref15];

      indien de ongeschiktheid is ontstaan binnen een maand na de bedoelde eindiging.


