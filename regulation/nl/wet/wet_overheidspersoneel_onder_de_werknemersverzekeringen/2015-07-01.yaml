  - number: '32'
    text: |-
      1 Voor de vaststelling van de duur van de uitkering op grond van de WW, bedoeld in
      [artikel 31, eerste, tweede of vierde lid][ref1], wordt het recht op uitkering op grond van de WW geacht te
      zijn aangevangen op het moment, waarop het in [artikel 30, eerste lid, onderdeel b, onder 3°][ref2], bedoelde
      wachtgeld, is aangevangen.

      2 Voor de vaststelling van de duur van de uitkering op grond van de WW, bedoeld in
      [artikel 31, eerste of tweede lid][ref3], wordt, voor de toepassing van de [artikelen 42][ref4],
      [43][ref5], [48][ref6], [49][ref7] en [50 van de WW][ref8], de overheidswerknemer geacht te hebben
      voldaan aan [artikel 17 van de WW][ref9], met dien verstande dat er ten aanzien van de toepassing van
      [artikel 17, onderdeel b, onder 1°, van de WW][ref10], van uitgegaan wordt dat hij in de bedoelde periode in vijf
      kalenderjaren loon heeft ontvangen over 52 of meer dagen per jaar.

      3 Voor de vaststelling van de duur van de kortdurende uitkering op grond van de WW, bedoeld in
      [artikel 31, vierde lid][ref11], geldt de duur van het recht op kortdurende uitkering, zoals die
      is vastgesteld ingevolge het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref12], het
      [Werkloosheidsbesluit beroepsmilitairen bepaalde tijd][ref13], het [Werkloosheidsbesluit defensiepersoneel][ref14]
      of een met die besluiten vergelijkbare regeling.

      4 De resterende duur van de uitkering op grond van de WW, bedoeld in artikel 31, op het tijdstip van aanvang van
      fase 3 van deze wet, wordt bepaald door op de krachtens het eerste tot en met derde lid vast te stellen duur van de
      uitkering in mindering te brengen de tot dat tijdstip verstreken duur van het wachtgeld.

      5 De resterende duur van de uitkering op grond van de WW, bedoeld in het vierde lid, bedraagt niet meer dan
      de duur van het wachtgeld waarop de betrokkene recht had op de dag voorafgaande aan het tijdstip van aanvang
      van fase 3 van deze wet en zoals dat zou hebben doorgelopen na dat tijdstip of zou hebben herleefd vanaf de in
      [artikel 31, tweede lid][ref15], bedoelde dag, indien deze wet niet zou hebben gegolden.


