  - number: '36'
    text: |-
      1 Het Landelijk instituut sociale verzekeringen stelt ambtshalve van iedere overheidswerknemer of gewezen
      overheidswerknemer als bedoeld in [artikel 4, eerste lid][ref1], [artikel 13, eerste of tweede lid][ref2],
      of [artikel 31, eerste lid][ref3], en van iedere beroepsmilitair of gewezen beroepsmilitair als bedoeld
      in [artikel 23, eerste lid][ref4], het recht op uitkering of voorziening vast met inachtneming van
      [de artikelen 3 tot en met 34][ref5] en [artikel 41][ref6].

      2 Het Landelijk instituut sociale verzekeringen stelt op schriftelijke aanvraag van iedere overheidswerknemer of
      gewezen overheidswerknemer als bedoeld in [artikel 31, tweede of derde lid][ref7], het recht op uitkering als daar
      bedoeld vast met inachtneming van [de artikelen 3][ref8] tot en met [34][ref9] en [artikel 41][ref10].

      3 Bij de in het eerste en het tweede lid bedoelde vaststelling wordt geen rekening gehouden met feiten,
      omstandigheden en gedragingen, niet zijnde een activiteit of gedraging als bedoeld in het vijfde lid, die zich
      hebben voorgedaan op enig moment vóór het tijdstip waarop fase 1, 2 of 3 van deze wet op betrokkene van toepassing
      wordt, en die op bedoeld moment van invloed zouden zijn geweest op de uitkering op grond van de WW, de ZW, of
      de WAO, de voorziening, vergoeding of toelage op grond van de WAO of de loonsuppletie, de reïntegratie-uitkering
      of de opleiding of scholing op grond van de WAO, indien één of meer van die wetten op betrokkene van toepassing
      zouden zijn geweest, maar die niet van invloed waren of zouden zijn geweest op een op de dag voorafgaande
      aan vorenbedoeld tijdstip bestaand recht als bedoeld in [artikel 3, eerste lid, onderdeel b of c][ref11],
      [artikel 12, eerste lid, onderdeel b of c][ref12], [artikel 22, eerste lid, onderdeel b, c of d][ref13], of
      [artikel 30, eerste lid, onderdeel b][ref14].

      4 Zo nodig in afwijking van het derde lid, wordt bij de in het eerste en het tweede lid bedoelde vaststelling, een
      sanctie die op de dag voorafgaande aan het tijdstip waarop fase 1, 2 of 3 van deze wet op betrokkene van toepassing
      wordt, ten aanzien van een bestaand recht als bedoeld in [artikel 3, eerste lid, onderdeel b of c][ref15],
      [artikel 12, eerste lid, onderdeel b of c][ref16], [artikel 22, eerste lid, onderdeel b, c of d][ref17], of
      [artikel 30, eerste lid, onderdeel b][ref18], op betrokkene wordt toegepast en die na dat tijdstip nog zou worden
      toegepast indien deze wet niet zou hebben gegolden, onverkort toegepast op de uitkering op grond van de WW, de ZW,
      of de WAO, de voorziening, vergoeding of toelage op grond van de WAO of de loonsuppletie, de reïntegratie-uitkering
      of de opleiding of scholing op grond van de WAO.

      5 Op en na het tijdstip waarop fase 1,2 of 3 van deze wet op betrokkene van toepassing wordt, wordt een
      activiteit of gedraging van betrokkene waarin door het bevoegd gezag in het kader van een bestaand recht als
      bedoeld in [artikel 3, eerste lid, onderdeel b of c][ref19], [artikel 12, eerste lid, onderdeel b of c][ref20],
      [artikel 22, eerste lid, onderdeel b, c of d][ref21], of [artikel 30, eerste lid onderdeel b][ref22], is
      toegestemd, niet getoetst aan de regels die voor die activiteit of gedraging ingevolge de [WW][ref23], de
      [ZW][ref24] of de [WAO][ref25] gelden, of, indien die wetten op hem van toepassing zouden zijn geweest, zouden
      hebben gegolden. In afwijking van de eerste zin, wordt de gegeven toestemming vanaf het tijdstip waarop fase 1,
      2 of 3 van deze wet op betrokkene van toepassing wordt, niet in aanmerking genomen, indien dit tot een zodanige
      afwijking van de systematiek van de [WW][ref26], de [ZW][ref27] of de [WAO][ref28] zou leiden, dat dit een normale
      uitvoering van die wetten in de weg zou staan.

      6 Onder een activiteit of gedraging als bedoeld in het vijfde lid, die de normale uitvoering van de [WW][ref29], de
      [ZW][ref30] of de [WAO][ref31] niet in de weg staat, wordt in ieder geval verstaan:

      a. deelnemen aan een scholing of opleiding;

      b. het verrichten van werkzaamheden als bedoeld in [artikel 8, eerste lid, van de WW][ref32], met uitzondering van
      werkzaamheden als bedoeld in het tweede en derde lid van dat artikel;

      c. niet voldoen aan de verplichting te solliciteren;

      d. niet voldoen aan de verplichting als werkzoekende ingeschreven te zijn bij het Uitvoeringsinstituut
      werknemersverzekeringen.

      7 Met ingang van de datum van inwerkingtreding van de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref33]
      treedt het Uitvoeringsinstituut werknemersverzekeringen in de plaats van het Landelijk instituut sociale
      verzekeringen.


