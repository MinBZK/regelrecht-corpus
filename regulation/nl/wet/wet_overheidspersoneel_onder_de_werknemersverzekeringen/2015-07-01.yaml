      1 Op verzoek van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties verstrekt een organisatie die
      een of meer bovenwettelijke regelingen ter zake van ziekte, arbeidsongeschiktheid, ontslag of werkloosheid van
      overheidswerknemers of gewezen overheidswerknemers uitvoert, kosteloos alle statistische informatie die hij
      wenselijk acht in verband met zijn bestuurlijke verantwoordelijkheid voor het overheidspersoneelsbeleid.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels stellen omtrent de verstrekking van de
