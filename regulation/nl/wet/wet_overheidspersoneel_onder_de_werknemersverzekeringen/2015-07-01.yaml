  - number: '37'
    text: |-
      1 De overheidswerkgever aan wie vóór het tijdstip van aanvang van fase 1 van deze wet ter zake van een
      overheidswerknemer of een gewezen overheidswerknemer dan wel een beroepsmilitair of een gewezen beroepsmilitair
      een loonkostensubsidie is toegekend overeenkomstig artikel 62 van de WAO, waarvan de duur niet eindigt
      vóór bedoeld tijdstip, wordt door het Landelijk instituut sociale verzekeringen, met inachtneming van
      [artikel 20, tweede lid][ref1], of [artikel 28, tweede lid][ref2], met ingang van dat tijdstip in aanmerking
      gebracht voor een loonkostensubsidie, bedoeld in artikel 62 van de WAO.

      2 Met ingang van de datum van inwerkingtreding van de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref3]
      treedt het Uitvoeringsinstituut werknemersverzekeringen in de plaats van het Landelijk instituut sociale
      verzekeringen.


