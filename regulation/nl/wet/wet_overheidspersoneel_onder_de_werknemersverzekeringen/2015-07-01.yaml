      wachtgeld, waarop recht is ontstaan voor het tijdstip van aanvang van fase 2 van deze wet. Onder wachtgeld wordt
      niet verstaan de kortdurende uitkering, bedoeld in het tweede lid.

      2 Voor de toepassing van
      __REF000___________________________________________________________________________________________________________
