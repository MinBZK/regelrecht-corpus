  - number: 45c
    text: |-
      Indien een overheidswerkgever in staat van faillissement is verklaard, dan wel aan hem surséance van betaling
      is verleend, of deze anderszins verkeert in de blijvende toestand dat hij heeft opgehouden te betalen, wordt, op
      verzoek van de gewezen overheidswerknemer die uit hoofde van een dienstverband met deze overheidswerkgever recht
      op wachtgeld heeft, welk recht is ontstaan voor het tijdstip van aanvang van fase 2 van deze wet, het tijdstip
      van aanvang van fase 3 van deze wet vastgesteld op het tijdstip dat de overheidswerkgever kwam te verkeren in een
      toestand als hiervoor bedoeld, doch niet eerder dan het tijdstip van aanvang van fase 2. De eerste zin is slechts
      van toepassing als de overheidswerknemer zijn verzoek doet binnen 26 weken na de dag waarop de overheidswerkgever
      is komen te verkeren in een toestand als bedoeld in de eerste zin.
    url: https://wetten.overheid.nl/BWBR0009267/2015-07-01#Artikel45c
