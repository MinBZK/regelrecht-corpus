    text: |-
      De TBA wordt toegepast op een ingevolge [artikel 23, eerste lid][ref1], toegekende uitkering op grond van de WAO,
      met inachtneming van het volgende:

      a. de datum van ingang van het in [artikel 22, eerste lid, onderdeel c][ref2], bedoelde pensioen ter zake
      van arbeidsongeschiktheid, dan wel van de in [artikel 22, eerste lid, onderdeel d][ref3], bedoelde uitkering
      overeenkomstig de normen van de WAO, geldt als de datum van ingang van het recht op die uitkering op grond van
      de WAO;

      b. artikel XVI van de TBA is van overeenkomstige toepassing op de beroepsmilitair of gewezen beroepsmilitair op wie
      op de dag voorafgaande aan het tijdstip van aanvang van fase 1 van deze wet artikel XXIV van de TBA van toepassing
      was, met dien verstande dat [artikel 18, zesde lid, van de WAO][ref4] niet van toepassing is;

      c. de artikelen XVII tot en met XIX van de TBA zijn van overeenkomstige toepassing op de beroepsmilitair of gewezen
      beroepsmilitair op wie op de dag voorafgaande aan het tijdstip van aanvang van fase 1 van deze wet de artikelen XXV
      tot en met XXVII van de TBA van toepassing waren.


