  - number: '90'
    text: |-
      1 Het bedrag dat de overheidswerkgever, bedoeld in [artikel 1, onderdeel k][ref1], moet betalen
      aan het Uitvoeringsinstituut werknemersverzekeringen, in verband met de door hem verschuldigde
      premie, bedoeld in [artikel 76a van de Wet op de arbeidsongeschiktheidsverzekering][ref2],
      wordt verminderd met het door het Uitvoeringsinstituut werknemersverzekeringen overeenkomstig
      het tweede lid vastgestelde, ten laste van het Arbeidsongeschiktheidsfonds, bedoeld in
      [artikel 72 van de Wet op de arbeidsongeschiktheidsverzekering][ref3] komende bedrag, dat bedoeld is om de over
      uitkeringen op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref4] van overheidswerknemers als
      bedoeld in [artikel 1, onderdeel l][ref5], en gewezen overheidswerknemers verschuldigde premies op grond van de
      [Werkloosheidswet][ref6] ten gunste te laten komen van de overheidswerkgevers. De in de eerste volzin bedoelde
      vermindering vindt plaats zo spoedig mogelijk na het in het tweede lid bedoelde, betreffende kalenderjaar.

      2 Het in het eerste lid bedoelde, te verminderen bedrag wordt berekend door de uitkomst van een breuk, waarvan:

      a. de teller wordt gevormd door het totaal van de over een kalenderjaar ontvangen premies op grond van
      de [artikelen 85, derde lid][ref7], en [86 van de Werkloosheidswet][ref8] over het totaal van de in het
      betreffende kalenderjaar uitbetaalde uitkeringen op grond van de Wet op de arbeidsongeschiktheidsverzekering van
      overheidswerknemers als bedoeld in [artikel 1, onderdeel l][ref9], en gewezen overheidswerknemers, vermeerderd met
      de over dat bedrag ontvangen rente en onder aftrek van:

      1°. een bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid, in overeenstemming met
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, vastgesteld bedrag, dat volgens een
      bij die ministeriële regeling te bepalen verdeling wordt afgedragen aan de wachtgeldfondsen, bedoeld
      in [artikel 102 van de Werkloosheidswet][ref10], of het Algemeen werkloosheidsfonds, bedoeld in
      [artikel 103 van de Werkloosheidswet][ref11], en

      2°. de door het Uitvoeringsinstituut werknemersverzekeringen vastgestelde uitvoeringskosten van de toepassing van
      [artikel 89 en het eerste lid][ref12], en.

      b. de noemer wordt gevormd door de som van de voor het totaal van de overheidswerkgevers vastgestelde premieloon
      voor de heffing van de in het eerste lid bedoelde premie in het betreffende kalenderjaar gedeeld door het
      premieloon voor de heffing van de in het eerste lid bedoelde premie van de betreffende overheidswerkgever in dat
      kalenderjaar.

      3 Het bedrag dat de overheidswerkgever, bedoeld in [artikel 1, onderdeel k][ref13], moet betalen aan het
      Uitvoeringsinstituut werknemersverzekeringen, in verband met de door hem verschuldigde premie, bedoeld in
      [artikel 76a van de Wet op de arbeidsongeschiktheidsverzekering][ref14], wordt verminderd met het door het
      Uitvoeringsinstituut werknemersverzekeringen overeenkomstig het vierde lid vastgestelde, ten laste van het
      Arbeidsongeschiktheidsfonds, bedoeld in [artikel 72 van de Wet op de arbeidsongeschiktheidsverzekering][ref15]
      komende bedrag, dat bedoeld is om het na de in [artikel 44, negende lid][ref16], bedoelde liquidatie van het Fonds
      arbeidsongeschiktheidsverzekering overheidspersoneel resterende vermogen van dat fonds ten gunste te laten komen
      van de overheidswerkgevers.

      4 Het in het derde lid bedoelde, te verminderen bedrag wordt volgens bij of krachtens de algemene maatregel van
      bestuur, bedoeld in [artikel 44, negende lid][ref17], te stellen regels vastgesteld. De in het derde lid bedoelde
      vermindering vindt niet eerder plaats dan nadat de in [artikel 44, negende lid][ref18], bedoelde liquidatie van
      het Fonds arbeidsongeschiktheidsverzekering overheidspersoneel is afgerond en vindt, zoveel mogelijk, plaats in de
      maand na de maand waarin de bedoelde liquidatie is afgerond.

      5 Het bedrag dat de overheidswerkgever, bedoeld in [artikel 1, onderdeel k][ref19], moet betalen aan het
      Uitvoeringsinstituut werknemersverzekeringen, in verband met de door hem verschuldigde premie, bedoeld in
      [artikel 76a van de Wet op de arbeidsongeschiktheidsverzekering][ref20], wordt vermeerderd met het door het
      Uitvoeringsinstituut werknemersverzekeringen overeenkomstig het zesde lid vastgestelde bedrag.

      6 Het in het vijfde lid bedoelde, te vermeerderen bedrag is het door de overheidswerkgever verschuldigde
      door het Uitvoeringsinstituut werknemersverzekeringen vastgestelde bedrag van de heffing, bedoeld in
      [artikel 46a van de Wet op de ondernemingsraden][ref21].

      7 De in het eerste en derde lid bedoelde vermindering en de in het vijfde lid bedoelde vermeerdering vervallen met
      ingang van het tijdstip van aanvang van fase 2 van deze wet, bedoeld in [artikel 53][ref22].

      8 Bij algemene maatregel van bestuur op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid kan worden bepaald dat het totaal van
      de in een kalenderjaar verschuldigde premie, bedoeld in het tweede lid, onderdeel a, dat na aftrek van de in het
      tweede lid, onderdeel a, onder 1° en 2°, bedoelde bedragen resteert, in afwijking van het eerste lid geheel of
      gedeeltelijk kan worden gebruikt voor de bekostiging van uitgaven in verband met het onder de werkingssfeer van de
      [Werkloosheidswet][ref23] en de [Ziektewet][ref24] brengen van het overheidspersoneel. In deze algemene maatregel
      van bestuur kan worden bepaald dat bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      nadere regels kunnen worden gesteld met betrekking tot de in de eerste volzin bedoelde bekostiging.


