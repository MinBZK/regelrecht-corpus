    text: |-
      1 Onverminderd artikel 38, eerste lid, van de Organisatiewet sociale verzekeringen 1997, heeft het Landelijk
      instituut sociale verzekeringen, bedoeld in artikel 30, eerste lid, van die wet met ingang van het tijdstip van
      aanvang van fase 1 van deze wet tot taak uitvoering te geven aan [hoofdstuk 1][ref1] van de Wet overheidspersoneel
      onder de werknemersverzekeringen.

      2 Onverminderd [artikel 30, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], treedt
      het Uitvoeringsinstituut werknemersverzekeringen, genoemd in [hoofdstuk 5 van die wet][ref3], met ingang van het
      tijdstip van inwerkingtreding van die wet voor de toepassing van het eerste lid in de plaats van het Landelijk
      instituut sociale verzekeringen.


