  - number: '16'
    text: |-
      Voor de eerste vaststelling van het recht op uitkering op grond van de WAO, bedoeld in
      [artikel 13, eerste of tweede lid][ref1], van de in [artikel 12, eerste lid, onderdeel b of c][ref2], bedoelde
      overheidswerknemer of gewezen overheidswerknemer is de door het FAOP met overeenkomstige toepassing van de WAO
      ten aanzien van betrokkene vastgestelde mate van arbeidsongeschiktheid in het kader van de WAO-conforme uitkering,
      zoals die geldt op de dag voorafgaande aan het tijdstip van aanvang van fase 1 van deze wet, bepalend.


