  - number: '29'
    text: |-
      1 De [artikelen 18, tweede tot en met vierde lid][ref1], en [30, eerste lid, onderdeel a, van de WAO][ref2]
      zijn niet van toepassing op de overheidswerknemers en de gewezen overheidswerknemers, bedoeld in
      [artikel 13][ref3], en de beroepsmilitairen en de gewezen beroepsmilitairen, bedoeld in [artikel 23][ref4],
      alsmede op de overheidswerknemers en gewezen overheidswerknemers, bedoeld in [artikel 12, eerste lid][ref5],
      en de beroepsmilitairen en gewezen beroepsmilitairen, bedoeld in [artikel 22, eerste lid][ref6], die op de dag
      voorafgaande aan het tijdstip van aanvang van fase 1 van deze wet ongeschikt zijn tot werken wegens ziekte,
      behoudens ingeval een of meer van de genoemde bepalingen reeds van toepassing of van overeenkomstige toepassing
      was op de betrokkene op de dag voorafgaande aan de datum waarop de WAO ingevolge deze wet van toepassing wordt op
      de betrokkene.

      2 Onze Minister van Sociale Zaken en Werkgelegenheid kan, tezamen met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties en Onze Minister van Defensie, nadere regels stellen met betrekking tot het eerste lid.


