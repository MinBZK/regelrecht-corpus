  - number: '21'
    text: Deze afdeling is van toepassing op beroepsmilitairen en de in deze afdeling bedoelde gewezen beroepsmilitairen.
    url: https://wetten.overheid.nl/BWBR0009267/2015-07-01#Artikel21
  - number: '22'
    text: |-
      1 Voor de vaststelling van het recht op uitkering op grond van de WAO, alsmede voor de toelating tot de vrijwillige
      verzekering op grond van de WAO, worden, vanaf de dag van aanvang van hun dienstverband tot aan het tijdstip van
      aanvang van fase 1 van deze wet, aangemerkt als verplicht verzekerd op grond van de WAO:

      a. beroepsmilitairen, voor zover niet bedoeld in onderdeel b of e;

      b. beroepsmilitairen die op de dag voorafgaande aan het vorenbedoelde tijdstip uit hoofde van hun dienstverband als
      beroepsmilitair recht hebben op bezoldiging of uitkering in geval van ziekte, welk recht niet zou zijn geëindigd op
      dat tijdstip indien fase 1 van deze wet niet in werking zou zijn getreden;

      c. gewezen beroepsmilitairen die op de dag voorafgaande aan het vorenbedoelde tijdstip uit hoofde van
      hun voormalige dienstverband als gewezen beroepsmilitair recht hebben op een pensioen ter zake van
      arbeidsongeschiktheid, welk recht niet zou zijn geëindigd op dat tijdstip indien fase 1 van deze wet niet in
      werking zou zijn getreden;

      d. gewezen beroepsmilitairen die op de dag voorafgaande aan het vorenbedoelde tijdstip uit hoofde van hun
      voormalige dienstverband als gewezen beroepsmilitair recht hebben op een uitkering overeenkomstig de normen van
      de WAO, welk recht niet zou zijn geëindigd op dat tijdstip indien fase 1 van deze wet niet in werking zou zijn
      getreden; en

      e. beroepsmilitairen en gewezen beroepsmilitairen die op de dag voorafgaande aan het vorenbedoelde tijdstip
      uit hoofde van hun dienstverband als beroepsmilitair onderscheidenlijk voormalige dienstverband als gewezen
      beroepsmilitair recht hebben op een wachtgeld, welk recht niet zou zijn geëindigd op dat tijdstip indien fase 1 van
      deze wet niet in werking zou zijn getreden.

      2 Aan het eerste lid kunnen geen rechten worden ontleend over tijdvakken, die gelegen zijn voor het tijdstip van
      aanvang van fase 1 van deze wet.
    url: https://wetten.overheid.nl/BWBR0009267/2015-07-01#Artikel22
  - number: '23'
    text: |-
      1 De beroepsmilitair, bedoeld in [artikel 22, eerste lid, onderdeel b][ref1], die op het tijdstip van
      aanvang van fase 1 van deze wet 52 weken of langer arbeidsongeschikt is in de zin van de WAO, de gewezen
      beroepsmilitair, bedoeld in [artikel 22, eerste lid, onderdeel c][ref2], en de gewezen beroepsmilitair, bedoeld in
      [artikel 22, eerste lid, onderdeel d][ref3], hebben vanaf dat tijdstip recht op een uitkering op grond van de WAO.

      2 Voor de toepassing van [de artikelen 21a][ref4], [21b][ref5], [34][ref6] juncto [36][ref7] en
      [61 van de WAO][ref8] en de [artikelen 29][ref9] en [29b van de ZW][ref10] wordt:

      a. ten aanzien van de beroepsmilitair, bedoeld in [artikel 22, eerste lid, onderdeel b][ref11], de datum waarop de
      periode van 52 weken arbeidsongeschiktheid is of geacht wordt te zijn verstreken; of

      b. ten aanzien van de gewezen beroepsmilitair, bedoeld in [artikel 22, eerste lid, onderdeel c][ref12], de datum
      van ingang van het recht op een pensioen ter zake van arbeidsongeschiktheid; of

      c. ten aanzien van de gewezen beroepsmilitair, bedoeld in [artikel 22, eerste lid, onderdeel d][ref13], de datum
      van ingang van het recht op een uitkering overeenkomstig de normen van de WAO;

      aangemerkt als de datum van ingang van het in het eerste lid bedoelde recht op een uitkering op grond van de WAO.


