      1 Voor de eerste vaststelling van het recht op uitkering ingevolge de WAO, bedoeld in
      [artikel 23, eerste lid][ref1], voor de in [artikel 22, eerste lid, onderdeel b][ref2], bedoelde beroepsmilitair
      die op het tijdstip van aanvang van fase 1 van deze wet 52 weken of langer arbeidsongeschikt is in de zin van de
      WAO, is de door Onze Minister van Defensie vastgestelde mate van arbeidsongeschiktheid, bedoeld in [artikel E6 van
      de Amp-wet](onbekend), bepalend.

      2 Ten aanzien van de in [artikel 22, eerste lid, onderdeel b][ref3], bedoelde beroepsmilitair die op het tijdstip
      van aanvang van fase 1 van deze wet 52 weken of langer arbeidsongeschikt is in de zin van de WAO, ten aanzien
      van wie op de dag voorafgaande aan dat tijdstip de mate van arbeidsongeschiktheid, bedoeld in [artikel E6 van de
      Amp-wet](onbekend) , nog niet is vastgesteld, wordt de mate van arbeidsongeschiktheid in de zin van de WAO voor
      de eerste vaststelling van het recht op uitkering ingevolge de WAO, bedoeld in [artikel 23, eerste lid][ref4],
      vastgesteld binnen een termijn van drie maanden na het vorenbedoelde tijdstip.

      3 Voor de eerste vaststelling van het recht op uitkering ingevolge de WAO, bedoeld in
      [artikel 23, eerste lid][ref5], voor de in [artikel 22, eerste lid, onderdeel c][ref6], bedoelde gewezen
      beroepsmilitair, is de door Onze Minister van Defensie vastgestelde mate van arbeidsongeschiktheid, bedoeld in
      [artikel E6 van de Amp-wet](onbekend) , bepalend.

      4 Voor de eerste vaststelling van het recht op uitkering ingevolge de WAO, bedoeld in
      [artikel 23, eerste lid][ref7], voor de in [artikel 22, eerste lid, onderdeel d][ref8], bedoelde gewezen
      beroepsmilitair, is de mate van arbeidsongeschiktheid, waarnaar zijn uitkering overeenkomstig de normen van de WAO
      is berekend, bepalend.


