  - number: '41'
    text: |-
      1 Onze Minister van Sociale Zaken en Werkgelegenheid stelt tezamen met Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties en Onze Minister van Defensie nadere regels ten aanzien van de betrokkene die als
      overheidswerknemer op het tijdstip waarop fase 1, 2 of 3 van deze wet op hem van toepassing wordt, tegelijkertijd
      recht heeft op twee of meer van de navolgende uitkeringen of voorzieningen danwel een combinatie daarvan:

      a. twee of meer van de navolgende rechten in verband met ongeschiktheid tot werken wegens ziekte:

      1°. bezoldiging of uitkering ingeval van ziekte;

      2°. een ziekengeld op grond van de [ZW][ref1];

      b. twee of meer van de navolgende arbeidsongeschiktheidsuitkeringen:

      1°. een WAO-conforme uitkering;

      2°. een pensioen ter zake van arbeidsongeschiktheid;

      3°. een uitkering op grond van de [WAO][ref2];

      4°. een of meer uitkeringen overeenkomstig de normen van de [WAO][ref3] in de zin van het Amar;

      5°. een uitkering terzake van arbeidsongeschiktheid op grond van een wettelijke regeling van de Nederlandse
      Antillen, Aruba of een vreemde mogendheid;

      c. twee of meer van de navolgende werkloosheidsuitkeringen:

      1°. een of meer wachtgelden;

      2°. een of meer uitkeringen op grond van de [WW][ref4];

      d. twee of meer loonsuppleties op grond van dan wel overeenkomstig [artikel 60 van de WAO][ref5];

      e. twee of meer reïntegratie-uitkeringen op grond van dan wel overeenkomstig [artikel 63 van de WAO][ref6].

      2 De in het eerste lid bedoelde regels hebben in ieder geval betrekking op de bepaling van:

      a. de datum waarop het in [artikel 4, eerste lid][ref7], bedoelde recht op een ziekengeld op grond van
      de [ZW][ref8], het in [artikel 13, eerste of tweede lid][ref9], of [artikel 23, eerste lid][ref10],
      bedoelde recht op een uitkering op grond van de [WAO][ref11], het in [artikel 20, tweede lid][ref12], of
      [artikel 28, tweede lid][ref13], bedoelde recht op een loonsuppletie of een reïntegratie-uitkering op grond van de
      [WAO][ref14], dan wel het in [artikel 31, eerste, tweede of derde lid][ref15], bedoelde recht op een uitkering op
      grond van de [WW][ref16] van de betrokkene ingaat;

      b. de mate van arbeidsongeschiktheid in de zin van de [WAO][ref17];

      c. het dagloon in de zin van de [WAO][ref18], dan wel in de zin van de [WW][ref19];

      d.

      e. de kostenverdeling, met inbegrip van de uitvoeringskosten, ter zake van de in [onderdeel a][ref20] bedoelde
      rechten.

      3 De in het eerste lid bedoelde regels hebben tot doel te bereiken dat een hoogte en een duur van het ingevolge
      deze wet aan de betrokkene toe te kennen ziekengeld op grond van de [ZW][ref21], uitkering op grond van de
      [WAO][ref22], loonsuppletie of reïntegratie-uitkering op grond van de [WAO][ref23], danwel uitkering op grond
      van de [WW][ref24] wordt vastgesteld die ten minste evenredig is aan de hoogte en duur van het met de betreffende
      werknemersverzekering overeenkomende deel van het wachtgeld, de uitkering of de voorziening waarop de betrokkene in
      zijn hoedanigheid als overheidswerknemer, danwel gewezen overheidswerknemer recht had op de dag voorafgaande aan de
      datum waarop de betreffende werknemersverzekering ingevolge deze wet op hem van toepassing werd.


