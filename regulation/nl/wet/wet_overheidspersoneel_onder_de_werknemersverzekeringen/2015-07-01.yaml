  - number: '17'
    text: |-
      1 Voor de vaststelling van de hoogte van de voorlopige uitkering op grond van de WAO, bedoeld in
      [artikel 13, tweede lid, tweede volzin][ref1], ten aanzien van de in [artikel 12, eerste lid, onderdeel c][ref2],
      bedoelde overheidswerknemer of gewezen overheidswerknemer, geldt:

      a. als dagloon het dagloon waarnaar die WAO-conforme uitkering op grond van [artikel 32 van de WPA][ref3] is
      berekend op de dag voorafgaande aan het tijdstip van aanvang van fase 1 van deze wet;

      b. als vervolgdagloon het vervolgdagloon waarnaar die WAO-conforme uitkering op grond van
      [artikel 32 van de WPA][ref4] is berekend op de dag voorafgaande aan het tijdstip van aanvang van fase 1 van deze
      wet.

      2 Voor de vaststelling van de voorlopige uitkering op grond van de WAO, bedoeld in
      [artikel 13, tweede lid, tweede volzin][ref5], ten aanzien van de in [artikel 12, eerste lid, onderdeel c][ref6],
      bedoelde overheidswerknemer of gewezen overheidswerknemer is de door het FAOP met overeenkomstige toepassing van
      de WAO ten aanzien van betrokkene vastgestelde mate van arbeidsongeschiktheid in het kader van de bij wijze van
      voorschot betaalde WAO-conforme uitkering, zoals die geldt op de dag voorafgaande aan het tijdstip van aanvang van
      fase 1 van deze wet, bepalend.

      3 Voor de toepassing van [hoofdstuk IV van de WAO][ref7] worden de voorlopige uitkeringen op grond van de WAO,
      bedoeld in [artikel 13, tweede lid, tweede volzin][ref8], aangemerkt als uitkeringen op grond van de WAO als
      bedoeld in [artikel 76d, eerste lid, onderdeel a][ref9], van die wet.

      4 Het op grond van [artikel 13, tweede lid, tweede volzin][ref10], betaalde bedrag aan voorlopige
      uitkeringen wordt verrekend met het bedrag van de uitkering op grond van de WAO, bedoeld in
      [artikel 13, tweede lid, eerste volzin][ref11].


