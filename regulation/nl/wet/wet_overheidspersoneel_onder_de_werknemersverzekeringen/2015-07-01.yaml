  - number: '42'
    text: |-
      1 Vanaf het tijdstip van aanvang van fase 1 van deze wet, treedt het Landelijk instituut sociale
      verzekeringen in de plaats van het FAOP wat betreft de overeenkomstige toepassing van de WAO, bedoeld in
      [artikel 32, eerste lid][ref1], juncto [artikel 46, tweede lid, van de WPA][ref2], alsmede wat betreft de
      toepassing van de AAW, bedoeld in artikel 8 van de AAW.

      2 Onze Minister van Defensie verricht handelingen met betrekking tot de toepassing van de Amp-wet zoals die wet
      luidde op de dag voorafgaande aan het tijdstip van aanvang van fase 1 van deze wet, voor zover het de toepassing
      van de Amp-wet tot dat tijdstip betreft.

      3 De overheidswerkgever verricht handelingen op grond van een regeling met betrekking tot bezoldiging of uitkering
      ingeval van ziekte dan wel wachtgeld zoals bedoelde regeling luidde op de dag voorafgaande aan het tijdstip van
      aanvang van fase 3 van deze wet, voor zover het de toepassing van bedoelde regeling tot dat tijdstip betreft.

      4 Onze Minister van Defensie en de overheidswerkgever doen mededeling aan het Landelijk instituut sociale
      verzekeringen van handelingen als bedoeld in het tweede onderscheidenlijk het derde lid. De artikelen 36 tot en met
      39 zijn van overeenkomstige toepassing.

      5 Onze Minister van Sociale Zaken en Werkgelegenheid kan tezamen met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties nadere regels stellen met betrekking tot het eerste tot en met het vierde lid.

      6 Met ingang van de datum van inwerkingtreding van de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref3]
      treedt het Uitvoeringsinstituut werknemersverzekeringen in de plaats van het Landelijk instituut sociale
      verzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0013060
