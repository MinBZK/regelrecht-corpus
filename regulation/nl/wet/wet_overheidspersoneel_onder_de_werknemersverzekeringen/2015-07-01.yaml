  - number: '77'
    text: Met ingang van het tijdstip van aanvang van fase 1 van deze wet wordt de Wet Stichting USZO ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009267/2015-07-01#Artikel77
  - number: '79'
    text: |-
      1 Op verzoek van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties verstrekt een organisatie die een
      of meer uitkeringsregelingen ter zake van ziekte, ontslag of werkloosheid van overheidswerknemers of gewezen
      overheidswerknemers uitvoert, kosteloos alle statistische informatie die hij wenselijk acht in verband met zijn
      bestuurlijke verantwoordelijkheid voor het overheidspersoneelsbeleid.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels stellen omtrent de verstrekking van de
      statistische informatie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009267/2015-07-01#Artikel79
  - number: '80'
    text: |-
      1 Het burgerservicenummer kan in een persoonsregistratie worden opgenomen en bij het verstrekken van gegevens
      daaruit worden gebruikt door een organisatie die een of meer uitkeringsregelingen ter zake van ziekte, ontslag of
      werkloosheid van overheidswerknemers of gewezen overheidswerknemers uitvoert.

      2 De organisatie die een of meer uitkeringsregelingen ter zake van ziekte, ontslag of werkloosheid van
      overheidswerknemers of gewezen overheidswerknemers uitvoert, gebruikt het burgerservicenummer slechts:

      a. in het verkeer met de persoon op wie het nummer betrekking heeft;

      b. in contacten met de personen en instanties, voor zover deze zelf gemachtigd zijn tot het opnemen van het
      burgerservicenummer in een persoonsregistratie.

      3 Ten behoeve van wetenschappelijk onderzoek of statistiek dan wel op grond van een dwingende en gewichtige reden,
      kan desgevraagd een burgerservicenummer, aan een derde worden verstrekt voor zover de persoonlijke levenssfeer van
      de geregistreerde daardoor niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0009267/2015-07-01#Artikel80
  - number: '81'
    text: |-
      De Algemene Rekenkamer heeft met betrekking tot de uitkeringsregelingen ter zake van ziekte, ontslag
      en werkloosheid ten aanzien van een organisatie die een of meer uitkeringsregelingen ter zake van
      ziekte, ontslag of werkloosheid van overheidswerknemers of gewezen overheidswerknemers uitvoert, de in
      [artikel 91 van de Comptabiliteitswet 2001][ref1] vermelde bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel91
    url: https://wetten.overheid.nl/BWBR0009267/2015-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '91'
  - number: '82'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verstrekt op verzoek aan een organisatie die een of
      meer uitkeringsregelingen ter zake van ziekte, ontslag of werkloosheid van overheidswerknemers of gewezen
      overheidswerknemers uitvoert, kosteloos alle gegevens en inlichtingen die de betreffende organisatie nodig acht
      voor de uitvoering van de desbetreffende [uitkeringsregeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002537
    url: https://wetten.overheid.nl/BWBR0009267/2015-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002537
  - number: '83'
    text: |-
      1

      2 Met ingang van het tijdstip van aanvang van fase 3 van deze wet kan bij of krachtens algemene maatregel van
      bestuur, op voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid tezamen met Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties, worden bepaald dat tot een daarin te bepalen tijdstip:

      a. niet als dienstbetrekking in de zin van de [Werkloosheidswet][ref1] of de [Ziektewet][ref2] wordt beschouwd de
      arbeidsverhouding van de overheidswerknemer, bedoeld in [artikel 1, onderdeel l][ref3], van deze wet; of

      b. [artikel 8a van de Ziektewet][ref4] niet van toepassing is op degene die uitsluitend uit hoofde van een
      of meer arbeidsverhoudingen als overheidswerknemer, dan wel uitsluitend uit hoofde van een of meer voormalige
      arbeidsverhoudingen als gewezen overheidswerknemer een uitkering ontvangt op grond van de verplichte verzekering op
      grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref5].

      3 Het in het tweede lid bedoelde tijdstip kan voor groepen van overheidswerknemers als bedoeld in onderdeel a van
      dat lid, alsmede voor groepen van overheidswerknemers en gewezen overheidswerknemers met recht op een uitkering
      op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref6] als bedoeld in onderdeel b van dat lid,
      verschillend worden vastgesteld.

      4 Bij of krachtens de algemene maatregel van bestuur, bedoeld in het derde lid, kunnen nadere regels worden
      gesteld.

      5 Met ingang van het tijdstip van aanvang van fase 3 van deze wet berust het
      [Faseringsbesluit overheidswerknemers onder de Ziektewet en de Werkloosheidswet][ref7] op het tweede tot en met
      vierde lid van dit artikel.


