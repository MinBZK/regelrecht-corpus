      1 Voorzieningen, vergoedingen of toelagen die zijn toegekend op grond van [artikel 32 van de WPA][ref1],
      met overeenkomstige toepassing van de artikelen 57, 57a en 58 van de AAW, worden met ingang van het tijdstip
      van aanvang van fase 1 van deze wet voortgezet als voorzieningen, vergoedingen en toelagen op grond van
      [artikel 65][ref2], [65a][ref3] of [65b van de WAO][ref4].

      2 Een loonsuppletie, een loonkostensubsidie, een reïntegratie-uitkering of een opleiding of scholing, die is
      toegekend op grond van [artikel 32 van de WPA][ref5] met overeenkomstige toepassing van [artikel 60][ref6],
      [62][ref7], [63][ref8] of [64 van de WAO][ref9], wordt met ingang van het tijdstip van aanvang van fase 1 van
      deze wet voortgezet als een loonsuppletie, een loonkostensubsidie, een reïntegratie-uitkering of een opleiding of
      scholing op grond van [artikel 60][ref10], [62][ref11], [63][ref12] of [64 van de WAO][ref13].


