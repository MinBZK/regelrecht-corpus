    text: |-
      1 Met ingang van het tijdstip van aanvang van fase 1 van deze wet tot en met de dag voorafgaande aan het
      tijdstip van aanvang van fase 2 van deze wet, bedoeld in [artikel 53][ref1], komt de premie op grond van de
      [Werkloosheidswet][ref2], bedoeld in de [artikelen 85 derde lid][ref3], en [86 van de Werkloosheidswet][ref4],
      over de uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref5] van een overheidswerknemer
      als bedoeld in [artikel 1, onderdeel l][ref6], of een gewezen overheidswerknemer, in afwijking van
      [artikel 92, onderdelen a en b, van de Werkloosheidswet][ref7], niet ten gunste van het wachtgeldfonds, bedoeld in
      [artikel 102][ref8] van die wet, of het Algemeen Werkloosheidsfonds, bedoeld in artikel 103 van die wet, maar van
      het Arbeidsongeschiktheidsfonds, bedoeld in [artikel 72 van de Wet op de arbeidsongeschiktheidsverzekering][ref9].
      De eerste volzin is slechts van toepassing, indien de werkzaamheden met betrekking tot de in die volzin bedoelde
      uitkering worden verricht door een rechtspersoon, die de in artikel 41, eerste lid, van de Organisatiewet sociale
      verzekeringen 1997 bedoelde werkzaamheden uitsluitend verricht voor een of meer sectoren of sectoronderdelen
      waarbij geen andere dan overheidswerkgevers als bedoeld in [artikel 1, onderdeel k][ref10], zijn aangesloten.

      2 Ingeval het Landelijk instituut sociale verzekeringen, genoemd in hoofdstuk 4 van de Organisatiewet sociale
      verzekeringen 1997, of een uitvoeringsinstelling als bedoeld in artikel 41, derde lid, van die wet, de aan
      een overheidswerknemer als bedoeld in [artikel 1, onderdeel l][ref11], toegekende uitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref12], bedoeld in artikel 10, eerste of tweede lid, van die wet, aan
      een overheidswerkgever als bedoeld in [artikel 1, onderdeel k][ref13], betaalt met het oogmerk die uitkering door
      diens tussenkomst te doen uitbetalen:

      a. wordt, in afwijking van [artikel 10, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref14],
      voor zover dat lid betrekking heeft op de premie op grond van de [artikelen 85, derde lid][ref15], en
      [86 van de Werkloosheidswet][ref16], de bedoelde uitkering niet vermeerderd met de daarover door de werkgever
      verschuldigde premie op grond van de [Werkloosheidswet][ref17] en wordt die uitkering verminderd met het door de
      overheidswerknemer of gewezen overheidswerknemer verschuldigde deel van de premie op grond van die wet;

      b. treedt, in afwijking van [artikel 10, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref18],
      voor zover dat lid betrekking heeft op de premie op grond van de [artikelen 85, derde lid][ref19], en
      [86 van de Werkloosheidswet][ref20], de overheidswerkgever niet in de plaats van het Landelijk instituut sociale
      verzekeringen of de uitvoeringsinstelling;

      c. wordt, zo nodig in afwijking van [artikel 28 van de Wet financiële voorzieningen privatisering ABP][ref21],
      voor de inhouding inzake werkloosheid, bedoeld in
      [artikel 31 van de Wet financiële voorzieningen privatisering ABP][ref22], onder loon verstaan de op de WAO-
      uitkering aanvullende bezoldiging.

      3 Het eerste en het tweede lid gelden uitsluitend voor uitkeringen op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref23], die betrekking hebben op de periode tot aan het tijdstip van
      aanvang van fase 2 van deze wet, bedoeld in [artikel 53][ref24].


