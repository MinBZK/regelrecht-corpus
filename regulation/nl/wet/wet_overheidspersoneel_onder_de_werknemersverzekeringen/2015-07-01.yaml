  - number: '30'
    text: |-
      1 Met ingang van de datum waarop de [WW][ref1] op grond van deze wet of de algemene maatregel van bestuur, bedoeld
      in [artikel 7 van de WW][ref2], van toepassing wordt op de overheidswerknemer wordt, vanaf de dag van aanvang van
      het betreffende dienstverband, voor de vaststelling van het recht op uitkering op grond van de [WW][ref3], alsmede
      voor de toelating tot de vrijwillige verzekering op grond van de [WW][ref4], aangemerkt als een dienstbetrekking
      als bedoeld in [artikel 3 van de WW][ref5]:

      a. het dienstverband van de overheidswerknemer;

      b. het voormalige dienstverband van de gewezen overheidswerknemer die op de dag voorafgaande aan bedoelde datum uit
      hoofde van zijn voormalige dienstverband als gewezen overheidswerknemer in het genot is van:

      1°. bezoldiging of uitkering in geval van ziekte;

      2°. een uitkering ter zake van arbeidsongeschiktheid; of

      3°. een wachtgeld;

      c. het voormalige dienstverband van de gewezen overheidswerknemer die in verband met omstandigheden als bedoeld in
      artikel 20, eerste lid, onderdeel a, b, c of d, van de WW, op de dag voorafgaande aan bedoelde datum geen wachtgeld
      uit hoofde van zijn voormalige dienstverband als gewezen overheidswerknemer geniet; en

      d. het voormalige dienstverband van de gewezen overheidswerknemer die niet op bedoelde datum, maar wel op de dag
      voorafgaande aan die datum, een dienstverband heeft.

      2 Aan het eerste lid kunnen geen rechten worden ontleend over tijdvakken, die gelegen zijn voor de datum waarop de
      WW ingevolge deze wet van toepassing wordt.


