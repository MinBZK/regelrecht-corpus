  - number: '33'
    text: |-
      1 Voor de berekening van de uitkering op grond van [artikel 31, eerste, tweede of vierde lid][ref1], geldt
      als dagloon de naar een jaarbedrag herleide berekeningsgrondslag waarnaar het wachtgeld is berekend op de dag
      voorafgaande aan het tijdstip van aanvang van fase 3 van deze wet, gedeeld door het getal 261.

      2 Indien het recht op wachtgeld is toegekend uit een deeltijdbetrekking, geldt in afwijking van het eerste
      lid als dagloon het bedrag dat overeenkomstig dat lid wordt verkregen en vervolgens is vermenigvuldigd met de
      deeltijdfactor.

      3 In afwijking van het eerste en tweede lid, geldt voor de gewezen overheidswerknemer,
      bedoeld in [artikel 31, eerste of vierde lid][ref2], die op de dag voorafgaande aan
      het tijdstip van aanvang van fase 3 van deze wet recht heeft op een uitkering op
      grond van het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref3], het
      [Werkloosheidsbesluit beroepsmilitairen bepaalde tijd][ref4], het [Werkloosheidsbesluit defensiepersoneel][ref5] of
      een met die besluiten vergelijkbare regeling, als dagloon het in het kader van dat recht vastgestelde dagloon.

      4 In afwijking van het eerste en tweede lid, geldt voor de gewezen overheidswerknemer,
      bedoeld in [artikel 31, tweede of vierde lid][ref6], wiens recht op uitkering op
      grond van het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref7], het
      [Werkloosheidsbesluit beroepsmilitairen bepaalde tijd][ref8], het [Werkloosheidsbesluit defensiepersoneel][ref9]
      of een met die besluiten vergelijkbare regeling, in verband met een omstandigheid als bedoeld in
      [artikel 20, eerste lid, onderdeel a, b, c of d, van de WW][ref10] voorafgaande aan het tijdstip van aanvang van
      fase 3 van deze wet geëindigd is, als dagloon het in het kader van dat recht vastgestelde dagloon.

      5 Het dagloon van de overheidswerknemer of gewezen overheidswerknemer, die op het in
      [artikel 32, eerste lid][ref11], bedoelde moment, dan wel daarna, een uitkering op grond van de [WAO][ref12]
      naar een arbeidsongeschiktheid van minder dan 80% ontvangt, dan wel, indien het bepaalde in [artikel 25][ref13],
      [28][ref14], [30][ref15] of [33 van de WAO][ref16] op hem niet van toepassing was, zou ontvangen, of
      een naar aard en strekking daarmee overeenkomende uitkering ontvangt of zou ontvangen, is gelijk aan het
      dagloon, berekend volgens [artikel 14][ref17] of [artikel 24][ref18], dan wel, indien [artikel 14][ref19] of
      [artikel 24][ref20] op hem niet van toepassing is, berekend volgens de bij of krachtens de [WAO][ref21] gestelde
      regels. Het met toepassing van de eerste volzin berekende dagloon wordt evenredig verlaagd door dat dagloon te
      vermenigvuldigen met een breuk, waarvan de teller wordt gevormd door het verschil tussen 100 en het midden van de
      arbeidsongeschiktheidsklasse waarin betrokkene is ingedeeld, en de noemer door het getal 100.

      6 Indien de in het vijfde lid bedoelde overheidswerknemer of gewezen overheidswerknemer op een tijdstip
      na de dagloonberekening overeenkomstig dat lid, op grond van de [WAO][ref22] wordt ingedeeld in een andere
      arbeidsongeschiktheidsklasse dan die, welke bij de evenredige verlaging is gehanteerd, wordt het krachtens
      de eerste volzin van dat lid berekende dagloon, in afwijking van de tweede volzin van het desbetreffende lid,
      evenredig verlaagd door dat dagloon te vermenigvuldigen met een breuk, waarvan de teller wordt gevormd door het
      verschil tussen 100 en het midden van de nieuwe arbeidsongeschiktheidsklasse, en de noemer door het getal 100.

      7 Indien de arbeidsongeschiktheidsuitkering van de werknemer, bedoeld
      in het vijfde lid, niet meer volledig wordt uitbetaald op grond van
      [artikel 44, eerste lid, onderdeel b, van de Wet op de arbeidsongeschiktheidsverzekering][ref23], wordt
      het krachtens de eerste zin van het vijfde lid berekende dagloon evenredig verlaagd door dat dagloon te
      vermenigvuldigen met een breuk, waarvan de teller wordt gevormd door het verschil tussen 100 en het midden van de
      arbeidsongeschiktheidsklasse, die bij de toepassing van laatstgenoemd artikel in acht wordt genomen, en de noemer
      door het getal 100.

      8 Voor de werknemer, bedoeld in het vijfde lid, wiens arbeidsongeschiktheidsuitkering wordt
      ingetrokken dan wel niet meer wordt uitbetaald op grond van [artikel 43, eerste lid][ref24], of
      [artikel 44, eerste lid, onderdeel a, van de Wet op de arbeidsongeschiktheidsverzekering][ref25], is het dagloon
      het krachtens de eerste zin van het vijfde lid berekende dagloon.

      9 Het vijfde tot en met achtste lid zijn niet van toepassing indien en zolang bij de vaststelling van de mate
      van arbeidsongeschiktheid rekening wordt gehouden met de arbeid die de werknemer, na het intreden van zijn
      arbeidsongeschiktheid, heeft verricht in de dienstbetrekking waaruit hij werkloos is geworden.

      10 De hoogte van de uitkering op grond van de [WW][ref26], bedoeld in
      [artikel 31, eerste, tweede en vierde lid][ref27], bedraagt niet meer dan de hoogte van het wachtgeld, waarop de
      betrokkene recht had op de dag voorafgaande aan het tijdstip van aanvang van fase 3 van deze wet en zoals dat zou
      hebben doorgelopen of zou hebben herleefd vanaf de in [artikel 31, tweede lid][ref28], bedoelde dag, indien deze
      wet niet zou hebben gegolden.

      11 Het dagloon bedraagt ten hoogste het bedrag, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref29], met betrekking tot een loontijdvak
      van een dag.


