    text: |-
      1 Voor de vaststelling van de hoogte van de uitkering op grond van de WAO, bedoeld in
      [artikel 23, eerste lid][ref1], voor de in [artikel 22, eerste lid, onderdeel b][ref2], bedoelde beroepsmilitair
      die op het tijdstip van aanvang van fase 1 van deze wet 52 weken of langer arbeidsongeschikt is in de zin van
      de WAO, geldt als dagloon respectievelijk vervolgdagloon in de zin van die wet de door het getal 261 gedeelde,
      naar een jaarbedrag herleide pensioengrondslag, bedoeld in [artikel F6](onbekend) van de Amp-wet, respectievelijk
      vervolguitkeringsgrondslag, bedoeld in [artikel F6a](onbekend) van de Amp-wet, die voor betrokkene zou zijn
      vastgesteld indien betrokkene op de dag voorafgaande aan de vorenbedoelde datum zou zijn ontslagen met recht op een
      pensioen ter zake van arbeidsongeschiktheid.

      2 Voor de vaststelling van de hoogte van de uitkering ingevolge de WAO, bedoeld in [artikel 23, eerste lid][ref3],
      voor de in [artikel 22, eerste lid, onderdeel c][ref4], bedoelde gewezen beroepsmilitair, geldt als dagloon
      respectievelijk vervolgdagloon in de zin van die wet de voor betrokkene geldende, door het getal 261 gedeelde,
      naar een jaarbedrag herleide pensioengrondslag, in voorkomend geval verhoogd met het percentage van de toeslag,
      bedoeld in [artikel F7a](onbekend) van de Amp-wet, respectievelijk de voor betrokkene geldende, door het getal 261
      gedeelde, naar een jaarbedrag herleide vervolguitkeringsgrondslag, bedoeld in [artikel F6a](onbekend) van de Amp-
      wet, en in voorkomend geval aangepast met het percentage waarmee het salaris, dat overeenkomt met de aangepaste
      pensioengrondslag, op grond van artikel 34 van de Wet FVP/ABP is aangepast.

      3 Voor de vaststelling van de hoogte van de uitkering ingevolge de WAO, bedoeld in [artikel 23, eerste lid][ref5],
      voor de in [artikel 22, eerste lid, onderdeel d][ref6], bedoelde gewezen beroepsmilitair, geldt als dagloon
      respectievelijk vervolgdagloon in de zin van die wet de naar een jaarbedrag herleide en door 261 gedeelde
      berekeningsgrondslag van de uitkering overeenkomstig de normen van de WAO zoals die geldt op de dag voorafgaande
      aan het tijdstip van aanvang van fase 1 van deze wet, aangepast op de voet van het Amar, zoals dat luidde op
      die dag, respectievelijk de voor betrokkene geldende, door het getal 261 gedeelde, naar een jaarbedrag herleide
      vervolguitkeringsgrondslag, bedoeld in [artikel F6a van de Amp-wet](onbekend).

      4 Het dagloon bedraagt ten hoogste het bedrag, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref7], met betrekking tot een loontijdvak
      van een dag.

      5 Onze Minister van Sociale Zaken en Werkgelegenheid kan, tezamen met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties en Onze Minister van Defensie, nadere regels stellen met betrekking tot het eerste tot en met
      het vierde lid.


