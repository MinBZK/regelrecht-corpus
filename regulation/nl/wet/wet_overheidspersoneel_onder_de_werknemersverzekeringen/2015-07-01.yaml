  - number: '11'
    text: |-
      Deze afdeling is van toepassing op overheidswerknemers en de in deze afdeling bedoelde gewezen overheidswerknemers,
      uitgezonderd beroepsmilitairen en gewezen beroepsmilitairen.
    url: https://wetten.overheid.nl/BWBR0009267/2015-07-01#Artikel11
  - number: '12'
    text: |-
      1 Voor de vaststelling van het recht op uitkering op grond van de WAO, alsmede voor de toelating tot de vrijwillige
      verzekering op grond van de WAO, worden, vanaf de dag van aanvang van hun dienstverband tot het tijdstip van
      aanvang van fase 1 van deze wet, aangemerkt als verplicht verzekerd op grond van de WAO:

      a. overheidswerknemers, voor zover niet bedoeld in onderdeel b, c of e;

      b. overheidswerknemers en gewezen overheidswerknemers die op de dag voorafgaande aan het vorenbedoelde tijdstip
      recht hebben op een WAO-conforme uitkering die zou hebben doorgelopen op of opnieuw zou zijn ingegaan met ingang
      van dat tijdstip indien deze wet niet in werking zou zijn getreden;

      c. overheidswerknemers en gewezen overheidswerknemers aan wie op de dag voorafgaande aan het vorenbedoelde tijdstip
      bij wijze van voorschot een WAO-conforme uitkering wordt betaald en die op of na dat tijdstip met terugwerkende
      kracht tot en met de dag voorafgaande aan dat tijdstip, recht verkrijgen op een WAO-conforme uitkering die zou
      hebben doorgelopen op of opnieuw zou zijn ingegaan met ingang van dat tijdstip indien deze wet niet in werking zou
      zijn getreden;

      d. overheidswerknemers en gewezen overheidswerknemers die uit hoofde van hun dienstverband als overheidswerknemer
      onderscheidenlijk voormalige dienstverband als gewezen overheidswerknemer recht hebben op een wachtgeld;

      e. overheidswerknemers en gewezen overheidswerknemers die in verband met omstandigheden als bedoeld in
      [artikel 20, eerste lid, onderdeel a, b, c of d, van de WW][ref1], op de dag voorafgaande aan het tijdstip
      van aanvang van fase 1 van deze wet uit hoofde van hun dienstverband als overheidswerknemer onderscheidenlijk
      voormalige dienstverband als gewezen overheidswerknemer geen wachtgeld genieten;

      f. gewezen overheidswerknemers die niet op het tijdstip van aanvang van fase 1 van deze wet, maar wel op de dag
      voorafgaande aan dat tijdstip, een dienstverband hebben; en

      g. de gewezen overheidswerknemers, voor zover niet bedoeld in onderdeel b, c, d, e of f, die recht zouden hebben op
      ziekengeld op grond van de ZW door de inwerkingtreding van [artikel 4][ref2] van deze wet, indien dat artikel reeds
      van toepassing zou zijn vanaf het tijdstip van aanvang van fase 1 van deze wet.

      2 Aan het eerste lid kunnen geen rechten worden ontleend over tijdvakken, die gelegen zijn voor het tijdstip van
      aanvang van fase 1 van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0009267#Artikel4
