  - number: 90a
    text: |-
      Betalingen die na het tijdstip van aanvang van fase 2, bedoeld in [artikel 53][ref1], worden gedaan als
      uitgave in verband met het onder de werkingssfeer van de [Werkloosheidswet][ref2] en de [Ziektewet][ref3]
      brengen van het overheidspersoneel, komen ten laste van het Uitvoeringsfonds voor de overheid, bedoeld in
      [artikel 104 van de Werkloosheidswet][ref4].


