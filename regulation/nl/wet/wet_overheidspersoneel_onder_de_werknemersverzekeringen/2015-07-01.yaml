  - number: '5'
    text: |-
      1 Voor de vaststelling van de hoogte van het ziekengeld op grond van de ZW, bedoeld in
      [artikel 4, eerste lid][ref1], geldt als dagloon in de zin van die wet de door het getal 261 gedeelde, naar een
      jaarbedrag herleide bezoldiging overeenkomstig het [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref2],
      al dan niet onder toepassing van [artikel 47, eerste lid, van het ARAR][ref3], of daarmee vergelijkbare regelingen,
      zoals dit besluit luidde respectievelijk deze regelingen luidden op de dag voorafgaande aan de datum waarop de
      ZW ingevolge deze wet van toepassing wordt op de betrokken overheidswerknemer of gewezen overheidswerknemer,
      waarnaar de bezoldiging of uitkering ingeval van ziekte van de in [artikel 4, eerste lid][ref4], bedoelde
      overheidswerknemer of gewezen overheidswerknemer wordt berekend op die dag, vermeerderd met de vakantie-uitkering
      of eindejaarsuitkering voorzover betrokkene geen recht heeft op onverminderde opbouw of doorbetaling van die
      uitkering.

      2 Voor de vaststelling van de hoogte van het ziekengeld op grond van de ZW voor de overheidswerknemer of gewezen
      overheidswerknemer die op grond van [artikel 31, eerste of tweede lid][ref5], recht heeft verkregen op een
      uitkering op grond van de WW, geldt als dagloon in de zin van de ZW het met toepassing van [artikel 33][ref6]
      vastgestelde dagloon.

      3 Indien het recht op bezoldiging of uitkering ingeval van ziekte is toegekend uit een deeltijdbetrekking, geldt
      in afwijking van het eerste en tweede lid als dagloon het bedrag dat overeenkomstig deze leden wordt verkregen en
      vervolgens is vermenigvuldigd met de deeltijdfactor.

      4 Het dagloon bedraagt ten hoogste het bedrag, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref7], met betrekking tot een loontijdvak
      van een dag.


