preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat wenselijk is het overheidspersoneel onder de werkingssfeer van de
    wettelijke werknemersverzekeringen te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009267/2015-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. Amar: het [Algemeen militair ambtenarenreglement][ref1], zoals dat luidde op de dag voorafgaande aan de datum
      waarop deze wet van toepassing wordt;

      b. militaire pensioenbepalingen: bij of krachtens de [Kaderwet militaire pensioenen][ref2] vastgestelde bepalingen;

      c. ARAR: het [Algemeen Rijksambtenarenreglement][ref3], zoals dat luidde op de dag voorafgaande aan de datum waarop
      deze wet van toepassing wordt;

      d. beroepsmilitair: de beroepsmilitair in de zin van de Amp-wet;

      e. bezoldiging of uitkering in geval van ziekte: bezoldiging in geval van ziekte tijdens het dienstverband
      als bedoeld in artikel 39 van het ARAR of een overeenkomstige bepaling van een soortgelijke regeling, alsmede
      bezoldiging of uitkering wegens ziekte na beëindiging van het dienstverband als bedoeld in artikel 42 van het ARAR
      of een overeenkomstige bepaling van een soortgelijke regeling, anders dan een WAO-conforme uitkering;

      f. deeltijdfactor: de breuk waarvan de noemer wordt gevormd door het bedrag van het salaris dat in het
      toepasselijke systeem zou gelden bij volledige werktijd, zo nodig vastgesteld op grond van functiewaardering, en de
      teller door het bedrag van het feitelijk genoten salaris;

      g. dienstverband: het dienstverband van de overheidswerknemer die door een overheidswerkgever is aangesteld of in
      dienst is genomen op arbeidsovereenkomst naar burgerlijk recht;

      h. FAOP: het Fonds arbeidsongeschiktheidsverzekering overheidspersoneel, bedoeld in [artikel 21][ref4] van de Wet
      FVP/ABP;

      i. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5];

      j.

      k. overheidswerkgever:

      1°. het orgaan van een publiekrechtelijk lichaam dan wel het privaatrechtelijk lichaam dat de overheidswerknemer
      rechtstreeks ten laste van dat lichaam bezoldigt of beloont; en

      2°. Onze Minister van Defensie in relatie tot de in [artikel 2, tweede lid, onderdeel f, van de WPA][ref6]
      uitgezonderde personen;

      l. overheidswerknemer:

      1°. de overheidswerknemer in de zin van artikel 2 van de WPA, jonger dan 65 jaar; en

      2°. de beroepsmilitair; en

      3°. degene die door de Koning in dienst is genomen om bij de Koninklijke Hofhouding werkzaam te zijn en die uit
      dien hoofde onder de Pensioenregeling van de Stichting tot verzorging van de pensioenen van het personeel van de
      Koninklijke Hofhouding van het Huis van Oranje-Nassau valt, jonger dan 65 jaar;

      m. pensioen ter zake van arbeidsongeschiktheid: een pensioen ter zake van arbeidsongeschiktheid ingevolge de
      militaire pensioenbepalingen, in voorkomende gevallen verhoogd met een ingevolge die bepalingen toegekende
      invaliditeitsverhoging;

      n. pensioengrondslag: de op de dag voorafgaande aan het tijdstip van aanvang van fase 1 van deze wet geldende
      pensioengrondslag waarnaar het pensioen ter zake van arbeidsongeschiktheid dan wel de invaliditeitsverhoging is
      berekend;

      o. TBA: de [Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen][ref7];

      p. uitkering overeenkomstig de normen van de WAO: een uitkering overeenkomstig de normen van de WAO als bedoeld in
      artikel 121 van het Amar;

      q. uitkering ter zake van arbeidsongeschiktheid: een WAO-conforme uitkering, een pensioen ter zake van
      arbeidsongeschiktheid, een uitkering overeenkomstig de normen van de WAO of een uitkering op grond van de WAO;

      r. wachtgeld: een wachtgeld in de zin van het [Rijkswachtgeldbesluit 1959][ref8], zoals dat luidde op de dag
      voorafgaande aan de datum waarop de WW ingevolge deze wet op de betreffende overheidswerknemer of gewezen
      overheidswerknemer van toepassing wordt, of een soortgelijke uitkering van een overheidswerknemer op grond van
      ontslag of werkloosheid alsmede een wachtgeld of daarmee gelijkgestelde uitkering in de zin van de bij of krachtens
      de [Kaderwet militaire pensioenen][ref9] vastgestelde bepalingen, met uitzondering van een uitkering in verband met
      functioneel leeftijdsontslag of vrijwillig vervroegd uittreden;

      s. WAO: de [Wet op de arbeidsongeschiktheidsverzekering][ref10];

      t. WAO-conforme uitkering: de met overeenkomstige toepassing van de WAO toegekende arbeidsongeschiktheidsuitkering,
      bedoeld in artikel 32, eerste lid, van de WPA;

      u. Wet FVP/ABP: de [Wet financiële voorzieningen privatisering ABP][ref11];

      v. WPA: de [Wet privatisering ABP][ref12], zoals die wet luidde op de dag voorafgaande aan het tijdstip van aanvang
      van fase 1 van deze wet;

      w. WW: de [Werkloosheidswet][ref13];

      x. ZW: de [Ziektewet][ref14].


