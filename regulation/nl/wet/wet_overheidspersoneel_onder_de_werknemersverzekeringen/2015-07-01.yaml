      1 Voor de vaststelling van de hoogte van de uitkering op grond van de WAO voor de in [artikel 4, eerste lid][ref1],
      bedoelde overheidswerknemers en gewezen overheidswerknemers, geldt als dagloon in de zin van die wet het met
      toepassing van [artikel 5, eerste en tweede lid][ref2], vastgestelde dagloon.

      2 Voor de vaststelling van de hoogte van de uitkering op grond van de WAO voor de overheidswerknemer of gewezen
      overheidswerknemer die op grond van [artikel 31, eerste of tweede lid][ref3], recht heeft verkregen op een
      uitkering op grond van de WW, geldt als dagloon in de zin van de WAO het met toepassing van [artikel 33][ref4]
