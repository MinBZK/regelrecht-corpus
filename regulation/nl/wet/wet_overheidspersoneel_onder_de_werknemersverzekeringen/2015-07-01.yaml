  - number: '86'
    text: |-
      [Artikel 32, eerste en tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] is niet van
      toepassing op een overheidswerkgever als bedoeld in [artikel 1, onderdeel k][ref2], of een overheidswerknemer als
      bedoeld in [artikel 1, onderdeel l][ref3], tot het tijdstip waarop ingevolge deze wet de [Ziektewet][ref4] op hem
      van toepassing wordt.


