  - number: '13'
    text: |-
      1 De overheidswerknemers en gewezen overheidswerknemers, bedoeld in [artikel 12, eerste lid, onderdeel b][ref1],
      hebben vanaf het tijdstip van aanvang van fase 1 van deze wet recht op een uitkering op grond van de WAO.

      2 De overheidswerknemers en gewezen overheidswerknemers, bedoeld in [artikel 12, eerste lid, onderdeel c][ref2],
      hebben vanaf het tijdstip van aanvang van fase 1 van deze wet recht op een uitkering op grond van de WAO indien
      aan hen op of na dat tijdstip met terugwerkende kracht tot en met de dag voorafgaande aan dat tijdstip een recht op
      een WAO-conforme uitkering wordt toegekend. Totdat de laatstbedoelde toekenning heeft plaatsgevonden, wordt aan hen
      een voorlopige uitkering op grond van de WAO betaald. Indien bij de vaststelling van het recht op een WAO-uitkering
      blijkt dat deze voorlopige uitkering ten onrechte is uitbetaald, of op een te hoog bedrag was vastgesteld, wordt
      het teveel betaalde niet teruggevorderd.

      3 Voor de toepassing van de [artikelen 21a][ref3], [21b][ref4], [34][ref5] juncto [36][ref6] en
      [61 van de WAO][ref7] en de [artikelen 29][ref8] en [29b van de ZW][ref9], wordt de datum waarop
      de in [artikel 12, eerste lid, onderdeel b][ref10], bedoelde WAO-conforme uitkering ingevolge
      [artikel 37, negende lid][ref11], [39, zevende lid][ref12], [40][ref13], [41][ref14], [42, zesde lid][ref15], of
      [43, zesde lid, van de WPA ][ref16]is ingegaan, aangemerkt als de datum waarop het in het eerste of het tweede lid
      bedoelde recht op een uitkering op grond van de WAO is ingegaan.


