  - number: '34'
    text: |-
      De in deze paragraaf bedoelde overheidswerknemer of gewezen overheidswerknemer, die het einde van de
      voor hem geldende duur van de uitkering op grond van de WW heeft bereikt, wordt voor de toepassing van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1] geacht te hebben
      voldaan aan het bepaalde in artikel 2, eerste lid, onderdeel a, onder 3°, onderdeel b, onder 3°, en onderdeel c,
      onder 3°, van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004044
