  - number: '28'
    text: |-
      1 Voorzieningen, vergoedingen of toelagen die zijn toegekend op grond van [artikel X5](onbekend) van de Amp-
      wet, met overeenkomstige toepassing van de artikelen 57, 57a en 58 van de AAW, worden met ingang van het
      tijdstip van aanvang van fase 1 van deze wet voortgezet als voorzieningen, vergoedingen en toelagen op grond van
      [artikel 65][ref1], [65a][ref2] of [65b van de WAO][ref3].

      2 Een loonsuppletie, een loonkostensubsidie, een reïntegratie-uitkering of een opleiding of scholing, die
      is toegekend op grond van artikel X 6 van de Amp-wet met overeenkomstige toepassing van [artikel 60][ref4],
      [62][ref5], [63][ref6] of [64 van de WAO][ref7], wordt met ingang van het tijdstip van aanvang van fase 1 van
      deze wet voortgezet als een loonsuppletie, een loonkostensubsidie, een reïntegratie-uitkering of een opleiding of
      scholing op grond van [artikel 60][ref8], [62][ref9], [63][ref10] of [64 van de WAO][ref11].


