      1 Voor de vaststelling van het recht op ziekengeld op grond van de [ZW][ref1], alsmede voor de toelating tot de
      vrijwillige verzekering op grond van de [ZW][ref2], worden de volgende personen, vanaf de dag van aanvang van hun
      dienstverband tot de datum waarop de [ZW][ref3] op grond van deze wet of de algemene maatregel van bestuur, bedoeld
      in [artikel 8b van de ZW][ref4], op hen van toepassing wordt, aangemerkt als verplicht verzekerd op grond van de
      ZW:

      a. de overheidswerknemers, voor zover niet bedoeld in onderdeel b of c;

      b. de overheidswerknemers en gewezen overheidswerknemers die op de dag voorafgaande aan de vorenbedoelde datum
      uit hoofde van hun dienstverband als overheidswerknemer onderscheidenlijk voormalige dienstverband als gewezen
      overheidswerknemer recht hebben op:

      1°. bezoldiging of uitkering ingeval van ziekte, waarvan de uitkeringsduur niet verstrijkt op die datum;

      2°. een uitkering ter zake van arbeidsongeschiktheid, die zou hebben doorgelopen op of opnieuw zou zijn ingegaan
      met ingang van die datum indien deze wet niet in werking zou zijn getreden; of

      3°. een wachtgeld, waarvan de uitkeringsduur niet verstrijkt op die datum;

      c. de overheidswerknemers wier dienstverband eindigt met ingang van de vorenbedoelde datum en die op grond daarvan
      met ingang van die datum een recht verkrijgen op een wachtgeld dan wel een uitkering op grond van de WW.

      2 Voor de vaststelling van het recht op ziekengeld op grond van de [ZW][ref5], alsmede voor
      de toelating tot de vrijwillige verzekering, wordt de gewezen overheidswerknemer, bedoeld in
      [artikel 2, vierde lid, onderdeel a][ref6], vanaf de dag van aanvang van zijn dienstverband tot de datum waarop het
      dienstverband is geëindigd, aangemerkt als verplicht verzekerd op grond van de [ZW][ref7].

      3 Voor de vaststelling van het recht op ziekengeld op grond van de [ZW][ref8], alsmede voor
      de toelating tot de vrijwillige verzekering, wordt de gewezen overheidswerknemer, bedoeld in
      [artikel 2, vierde lid, onderdelen b en c][ref9], vanaf de dag van aanvang van zijn dienstverband tot de datum
      waarop het recht op wachtgeld is geëindigd, aangemerkt als verplicht verzekerd op grond van de [ZW][ref10].

      4 Aan het eerste tot en met derde lid kunnen geen rechten worden ontleend over tijdvakken, die gelegen zijn voor de
      datum waarop de [ZW][ref11] ingevolge deze wet van toepassing wordt.


