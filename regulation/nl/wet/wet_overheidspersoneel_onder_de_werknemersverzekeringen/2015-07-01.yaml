      1 Onverminderd het bepaalde in deze wet zijn de ZW, de WAO, en de WW, alsmede de op die wetten berustende
      bepalingen, van toepassing op het in dit hoofdstuk bedoelde recht op uitkering op grond van die wetten, op het
      in aanmerking brengen voor voorzieningen, vergoedingen of toelagen op grond van [artikel 20, eerste lid][ref1],
      of [artikel 28, eerste lid][ref2], en op het in aanmerking brengen voor loonsuppleties, loonkostensubsidies,
      opleiding of scholing of reïntegratie-uitkeringen op grond van [artikel 20, tweede lid][ref3], of
      [artikel 28, tweede lid][ref4].

      2 Besluiten of uitkeringen op grond van onderscheidenlijk [artikel 4, eerste lid][ref5],
      [artikel 13, eerste of tweede lid][ref6], [artikel 23, eerste lid][ref7], of [artikel 31][ref8] worden beschouwd
      als besluiten of uitkeringen op grond van de verplichte verzekering krachtens de ZW, de WAO onderscheidenlijk de
      WW.

      3 Voorzieningen, toelagen of vergoedingen op grond van [artikel 20, eerste lid][ref9], of
      [artikel 28, eerste lid][ref10], worden beschouwd als voorzieningen, toelagen of vergoedingen op grond van de
      verplichte verzekering krachtens de WAO.

      4 Loonsuppleties, loonkostensubsidies, opleiding of scholing of reïntegratie-uitkeringen op grond van
      [artikel 20, tweede lid][ref11], of [artikel 28, tweede lid][ref12], worden beschouwd als loonsuppleties,
      loonkostensubsidies, opleiding of scholing of reïntegratie-uitkeringen op grond van de verplichte verzekering
      krachtens de WAO.


