      1 Indien de WAO-conforme uitkering met overeenkomstige toepassing van [artikel 46a van de WAO][ref1] op
      grond van [artikel 32 van de WPA][ref2] is verhoogd, wordt de uitkering op grond van de WAO, bedoeld in
      [artikel 13, eerste of tweede lid, eerste volzin][ref3], danwel de voorlopige uitkering op grond van de WAO,
      bedoeld in [artikel 13, tweede lid, tweede volzin][ref4], vastgesteld met inachtneming van die verhoging.

      2 Het eerste lid is van toepassing op de betrokkene zolang hij recht zou hebben gehad op de in dat lid bedoelde
      verhoging als [artikel 46a van de WAO][ref5] op grond van [artikel 32, eerste lid, van de WPA][ref6] op hem nog van
      overeenkomstige toepassing zou zijn geweest op het tijdstip van aanvang van fase 1 van deze wet.


