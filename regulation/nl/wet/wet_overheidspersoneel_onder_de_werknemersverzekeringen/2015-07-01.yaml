  - number: '4'
    text: |-
      1 Indien hij op die datum nog niet 52 weken ongeschikt is tot werken wegens ziekte, heeft recht op ziekengeld op
      grond van de [ZW][ref1]:

      a. met ingang van de datum waarop de [ZW][ref2] op hem van toepassing wordt, de gewezen overheidswerknemer, bedoeld
      in [artikel 2, eerste tot en met derde lid][ref3];

      b. met ingang van het tijdstip van aanvang van fase 3, bedoeld in [artikel 49][ref4], de overheidswerknemer, die op
      de dag voorafgaande aan dat tijdstip recht heeft op bezoldiging of uitkering ingeval van ziekte:

      1°. in verband met of in aansluiting op zwangerschaps- of bevallingsverlof;

      2°. op grond van ongeschiktheid tot het verrichten van zijn arbeid in verband met orgaandonatie;

      3°. die in een situatie verkeert overeenkomstig [artikel 29b, eerste lid, van de ZW][ref5].

      2 Een op grond van het eerste lid toegekend recht op ziekengeld op grond van de ZW wordt toegekend voor de
      duur van 52 weken van ongeschiktheid tot werken, verminderd met de periode beginnende met de eerste dag van de
      ongeschiktheid tot werken wegens ziekte tot en met de dag voorafgaande aan de datum waarop de ZW ingevolge deze wet
      van toepassing wordt op de betrokken overheidswerknemer of gewezen overheidswerknemer. Voor zover er sprake is van
      een situatie als bedoeld in artikel 29a, vijfde lid, van de ZW, geldt in afwijking van de eerste volzin de termijn
      van 16 weken, bedoeld in dat vijfde lid.

      3 Voor het bepalen van de in het eerste en het tweede lid bedoelde periode van 52 onderscheidenlijk 16 weken,
      worden perioden van arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier
      weken opvolgen.

      4 Voor het bepalen van de in het eerste en het tweede lid bedoelde periode van 52 onderscheidenlijk 16 weken,
      worden steeds perioden in aanmerking genomen, gedurende welke aanspraak bestaat op bezoldiging of uitkering in
      geval van ziekte.


