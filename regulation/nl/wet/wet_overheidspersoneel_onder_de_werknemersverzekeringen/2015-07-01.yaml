  - number: '40'
    text: |-
      1 Tot en met de dag waarop het dienstverband van de betrokkene eindigt, geschiedt de uitbetaling van de
      uitkering op grond van de WAO, bedoeld in [artikel 13, eerste of tweede lid][ref1], door tussenkomst van de
      overheidswerkgever die aan de betrokkene bezoldiging of uitkering in geval van ziekte is verschuldigd, indien de
      WAO-conforme uitkering, bedoeld in [artikel 12, eerste lid, onderdeel b of c][ref2], op de dag voorafgaande aan
      het tijdstip van aanvang van fase 1 van deze wet met toepassing van [artikel 47, eerste lid, van de WPA][ref3] door
      tussenkomst van de overheidswerkgever werd uitbetaald.

      2 Het eerste lid is niet van toepassing indien de betrokkene uit hoofde van twee of meer dienstverbanden recht
      heeft op een uitkering op grond van de WAO.

      3 In afwijking van het tweede lid, is het eerste lid van toepassing indien de betrokkene uit hoofde van twee of
      meer dienstbetrekkingen bij twee of meer overheidswerkgevers behorende tot de sector Onderwijs en Wetenschappen,
      bedoeld in [artikel 1, onderdeel q, onder 3°, van de WPA][ref4], recht heeft op een uitkering op grond van de
      [WAO][ref5].

      4 Ten aanzien van de in het derde lid bedoelde uitkering vindt de uitbetaling gesplitst plaats door tussenkomst
      van de betrokken overheidswerkgevers naar rato van het feitelijk verdiende loon uit hoofde van de desbetreffende
      dienstbetrekking.

      5 Indien de in het derde lid bedoelde overheidswerkgevers hun kosten declareren bij een ander orgaan, geschiedt de
      uitbetaling achtereenvolgens door tussenkomst van dat andere orgaan en de overheidswerkgever.

      6 De toepassing van het eerste lid eindigt in geval:

      a. het dienstverband wordt beëindigd, dan wel

      b. de betrokkene volledig voor de voor hem in het kader van de vaststelling van de arbeidsongeschiktheid in de zin
      van de [WAO][ref6] vastgestelde verdiencapaciteit wordt herplaatst in andere of aangepaste arbeid zonder dat sprake
      is van beëindiging van het dienstverband, dan wel

      c. de betrokkene het Landelijk instituut sociale verzekeringen verzoekt de uitkering op grond van de [WAO][ref7]
      rechtstreeks aan hemzelf of een derde uit te betalen.

      7 Met ingang van de datum van inwerkingtreding van de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref8]
      treedt het Uitvoeringsinstituut werknemersverzekeringen in de plaats van het Landelijk instituut sociale
      verzekeringen.


