    text: |-
      1 [Artikel 44, eerste lid, onderdeel a, van de ZW][ref1] is niet van toepassing op de overheidswerknemer en de
      gewezen overheidswerknemer, bedoeld in [de artikelen 2][ref2] en [3, eerste lid][ref3], die op de dag voorafgaande
      aan de datum waarop de [ZW][ref4] op grond van deze wet of de algemene maatregel van bestuur, bedoeld in
      [artikel 8b van de ZW][ref5], op hem van toepassing wordt, ongeschikt is tot werken wegens ziekte.

      2 Het eerste lid is niet van toepassing indien een bepaling, overeenkomend met
      [artikel 44, eerste lid, onderdeel a, van de ZW][ref6], reeds van toepassing was op de overheidswerknemer of de
      gewezen overheidswerknemer op de dag voorafgaande aan de datum waarop de [ZW][ref7] op grond van deze wet of de
      algemene maatregel van bestuur, bedoeld in [artikel 8b van de ZW][ref8], op hem van toepassing wordt.

      3 Onze Minister van Sociale Zaken en Werkgelegenheid kan, tezamen met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties en Onze Minister van Defensie, nadere regels stellen met betrekking tot het eerste en tweede
      lid.


