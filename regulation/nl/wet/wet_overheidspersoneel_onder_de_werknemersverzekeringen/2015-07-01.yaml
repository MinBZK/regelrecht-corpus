  - number: '93'
    text: 'Deze wet wordt aangehaald als: Wet overheidspersoneel onder de werknemersverzekeringen.'
    url: https://wetten.overheid.nl/BWBR0009267/2015-07-01#Artikel93
  - number: '94'
    text: |-
      1 Deze wet treedt in werking met ingang van een bij koninklijk besluit te bepalen tijdstip.

      2 Bij koninklijk besluit wordt bepaald met ingang van welk tijdstip de fase 1 van deze wet, de fase 2 van deze wet
      en de fase 3 van deze wet aanvangen.

      3 Het in het eerste en tweede lid bedoelde tijdstip kan voor de verschillende artikelen, onderdelen of
      subonderdelen daarvan alsmede voor groepen van overheidswerknemers en gewezen overheidswerknemers verschillend
      worden vastgesteld.

      4 In afwijking van het eerste en tweede lid treden [de artikelen 35 tot en met 42][ref1] in werking met ingang
      van 1 oktober 1997. Indien het Staatsblad waarin deze wet wordt geplaatst, wordt uitgegeven na 30 september 1997,
      treden de in de eerste volzin genoemde artikelen in werking met ingang van de dag na de datum van uitgifte van het
      Staatsblad waarin deze wet wordt geplaatst, en werken zij terug tot en met 1 oktober 1997.


      [ref1]: https://wetten.overheid.nl/BWBR0009267#Artikel35
