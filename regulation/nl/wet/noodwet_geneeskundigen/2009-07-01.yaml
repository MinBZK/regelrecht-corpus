  - number: '36'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel36
  - number: '37.1'
    text: |-
      Het bij of krachtens [artikel 8, eerste lid][ref1], [9, eerste lid][ref2], en [13, eerste lid][ref3], bepaalde is
      niet van toepassing ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002758#Artikel13
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002758
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002758
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002758
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
  - number: 37.1.a
    text: |-
      de leden van de Hoge Colleges van Staat, Onze Ministers, de Staatssecretarissen en de leden van de rechterlijke
      macht met rechtspraak belast;
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel37
  - number: 37.1.b
    text: de leden van provinciale staten en van gemeenteraden;
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel37
  - number: 37.1.c
    text: degenen, die in werkelijke militaire dienst zijn of in militaire dienst opgeroepen zijn;
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel37
  - number: 37.1.d
    text: bekleders van een geestelijk ambt of diegenen die een opleiding tot een zodanig ambt volgen;
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel37
  - number: 37.1.e
    text: degenen, die bij algemene maatregel van bestuur daartoe aangewezen openbare ambten bekleden.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel37
  - number: '37.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regelen gesteld ter nadere bepaling van de in het eerste
      lid, onder *d*, bedoelde categorie van personen.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel37
  - number: '38.1'
    text: |-
      Zolang één of meer paragrafen van [hoofdstuk II][ref1] in werking zijn, worden geneeskundigen zo mogelijk niet
      dan na overleg met het bevoegd gezag, op grond van het bij of krachtens een andere wet bepaalde verplicht tot het
      verrichten van werkzaamheden in het belang van de militaire of civiele verdediging.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002758
        hoofdstuk: II
  - number: '38.2'
    text: |-
      Geneeskundigen, die verplicht zijn zodanige werkzaamheden te verrichten, zijn, zolang deze verplichting duurt, van
      een verplichting, welke hun krachtens [artikel 13, eerste lid][ref1], is opgelegd, ontheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel13
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002758
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
  - number: '38.3'
    text: Het in het eerste lid bepaalde geldt niet bij een oproeping in militaire dienst.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel38
  - number: '39'
    text: |-
      Overtreding van het bij [artikel 11, derde lid][ref1], [13, vijfde lid][ref2],[19, tweede lid][ref3],
      [29, derde lid][ref4], [29a, eerste en tweede lid][ref5], [artikel 31a, tweede lid][ref6], voor zover het betreft
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref7] of [artikel 32, eerste lid][ref8], bepaalde,
      alsmede overtreding van het krachtens [artikel 36][ref9] bepaalde, voor zover zij daarbij is aangeduid als
      strafbaar feit, wordt gestraft met hechtenis van ten hoogste één maand of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0002758#Artikel19
