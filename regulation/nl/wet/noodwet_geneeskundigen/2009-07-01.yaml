---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: noodwet_geneeskundigen
regulatory_layer: WET
publication_date: '2011-12-09'
valid_from: '2009-07-01'
bwb_id: BWBR0002758
url: https://wetten.overheid.nl/BWBR0002758/2009-07-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is voor het geval van oorlog, oorlogsgevaar, daaraan
    verwante of daarmede verband houdende buitengewone omstandigheden nieuwe regelen te stellen met betrekking tot de
    geneeskundige, tandheelkundige, verloskundige en farmaceutische voorziening ten behoeve van de bevolking;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel1
  - number: 1.1.a
    text: '*Onze Minister*: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel1
  - number: 1.1.b
    text: |-
      *bevoegd gezag*: de Directeur-Generaal van de Volksgezondheid, of, voor zover krachtens
      [artikel 5, eerste lid][ref1], een andere autoriteit is aangewezen, deze autoriteit;


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel5
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002758
        artikel: '5'
        hoofdstuk: I
  - number: 1.1.c
    text: |-
      *geneeskundige*: degene, ten aanzien van wie geen grond tot weigering van inschrijving in het desbetreffende
      overeenkomstig [artikel 3, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref1] (*Stb*.
      1993, 655) ingestelde register als onderscheidenlijk arts, tandarts, apotheker of verloskundige van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
  - number: 1.1.d
    text: |-
      inwoner van Nederland: degene, die als ingezetene in een basisadministratie persoonsgegevens is ingeschreven of
      behoort te zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het eerste lid, onder *c*, blijft het bepaalde in
      [artikel 8, vijfde lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref1] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel8
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '8'
  - number: '2.1'
    text: |-
      Bij ministeriële regeling kan ten aanzien van personen, die geen geneeskundige zijn doch de opleiding daartoe
      gedeeltelijk hebben gevolgd, worden bepaald, dat zij, voor zover zij behoren tot in de regeling aangewezen
      categorieën, voor de toepassing van het bij of krachtens deze wet bepaalde met geneeskundigen gelijkstaan.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel2
  - number: '2.2'
    text: |-
      De personen, die krachtens toepassing van het eerste lid met geneeskundigen gelijkstaan, zijn verplicht
      geheimhouding in acht te nemen ten opzichte van al datgene, wat hun bij de nakoming van de in dat lid bedoelde
      verplichtingen als geheim is toevertrouwd, of wat daarbij als geheim te hunner kennis is gekomen of waarvan zij het
      vertrouwelijk karakter moesten begrijpen.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel2
  - number: 2a
    text: |-
      De geneeskundigen die niet ingeschreven staan in het desbetreffende overeenkomstig
      [artikel 3, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref1] ingestelde register,
      worden voor de toepassing van in andere wetten opgenomen bepalingen, betrekking hebbende op degenen die in dat
      register ingeschreven staan, gelijkgesteld met degenen die in dat register ingeschreven staan voor zover zulks
      noodzakelijk is ter nakoming van de hun krachtens deze wet opgelegde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
  - number: '3.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kunnen, ingeval buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, één of meer van de
      paragrafen van [hoofdstuk II][ref3] van deze wet in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002758#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002758
        hoofdstuk: II
  - number: '3.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde paragrafen.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel3
  - number: '3.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de paragrafen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel3
  - number: '3.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden de paragrafen die ingevolge het eerste
      lid in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel3
  - number: '3.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel3
  - number: '3.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel3
  - number: '5.1'
    text: |-
      Onze Minister kan autoriteiten aanwijzen, die, elk voor zover zulks in zijn besluit is bepaald, in de plaats van de
      Directeur- Generaal van de Volksgezondheid optreden als bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel5
  - number: '5.2'
    text: |-
      De Directeur-Generaal en elk der krachtens het eerste lid aangewezen autoriteiten worden in hun hoedanigheid van
      bevoegd gezag bijgestaan door een commissie van advies, waarvan de voorzitter, de overige leden en de secretaris
      door Onze Minister worden benoemd, geschorst en ontslagen. In de commissie van advies hebben in ieder geval zitting
      een of meer leden, te benoemen op aanbeveling van de door Ons aangewezen organisaties van geneeskundigen.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel5
  - number: '5.3'
    text: Van een krachtens het eerste lid vastgesteld besluit wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel5
  - number: '6'
    text: |-
      Het bevoegd gezag oefent de aan dit gezag bij of krachtens deze wet toegekende bevoegdheden uit met inachtneming
      van de door Onze Minister in overeenstemming met het gevoelen van de Raad van Ministers gestelde regelen en van de
      door Onze Minister gegeven instructies.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel6
  - number: '7'
    text: |-
      Bij algemene maatregel van bestuur worden de autoriteiten aangewezen, die, zolang de verbinding tussen Onze
      Minister en enig gebied verbroken is, in dat gebied met inachtneming van de bij de maatregel gestelde regelen de
      bij de [artikelen 8][ref1] en [9][ref2] aan Onze Minister toegekende bevoegdheden uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel9
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002758
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002758
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
  - number: '22'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regelen gesteld omtrent het ten laste van de staat:'
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel22
  - number: 22.a
    text: |-
      toekennen, voor zover nodig, van een vergoeding aan een geneeskundige in verband met een hem krachtens
      [artikel 13, eerste lid][ref1], opgelegde verplichting;


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel13
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002758
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
  - number: 22.b
    text: |-
      treffen, voor zover nodig, van voorzieningen bij ziekte, ongeval, invaliditeit en overlijden, verband houdende met
      het nakomen van een krachtens [artikel 13, eerste lid][ref1], aan een geneeskundige opgelegde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel13
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002758
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
  - number: '23'
    text: |-
      In afwijking van [artikel 6:4, eerste lid, van de Algemene wet bestuursrecht][ref1], wordt een bezwaarschrift
      tegen een besluit van Onze Minister of Onze Minister van Sociale zaken en Werkgelegenheid ingediend bij het bevoegd
      gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '25.1'
    text: |-
      Op een ingekomen bezwaarschrift, gericht tegen een beschikking van het bevoegd gezag, neemt dit, zo het terstond de
      aangevoerde bezwaren gegrond acht, zo spoedig mogelijk een beslissing.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel25
  - number: '25.2'
    text: |-
      Indien het bevoegd gezag niet terstond de aangevoerde bezwaren gegrond acht, brengt dit het bezwaarschrift
      onverwijld ter kennis van de in [artikel 5, tweede lid][ref1], bedoelde commissie. Deze brengt zo spoedig mogelijk
      advies uit.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel5
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002758
        artikel: '5'
        hoofdstuk: I
  - number: '25.3'
    text: |-
      Indien het bevoegd gezag zich met het door de commissie uitgebrachte advies kan verenigen, neemt het zo spoedig
      mogelijk dienovereenkomstig een beslissing.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel25
  - number: '25.4'
    text: |-
      Indien het bevoegd gezag zich met het door de commissie uitgebrachte advies niet kan verenigen, doet dit het
      bezwaarschrift, tezamen met dat advies en zijn oordeel ter zake, onverwijld aan Onze Minister toekomen. Onze
      Minister neemt zo spoedig mogelijk een beslissing.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel25
  - number: '26'
    text: |-
      Een bezwaarschrift, gericht tegen een beschikking van Onze Minister of van Onze Minister van Sociale Zaken, wordt
      onverwijld ter kennis van de in [artikel 5, tweede lid][ref1], bedoelde commissie gebracht. Deze brengt zo spoedig
      mogelijk advies uit.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel5
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002758
        artikel: '5'
        hoofdstuk: I
  - number: '28.1'
    text: |-
      Een door Onze Minister of Onze Minister van Sociale Zaken genomen beslissing wordt aan het bevoegd gezag
      medegedeeld.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel28
  - number: '28.2'
    text: |-
      Voordat een advies als bedoeld in [artikel 25, tweede lid][ref1], of [artikel 26][ref2], wordt uitgebracht, hoort
      de in [artikel 5, tweede lid][ref3], bedoelde commissie zo mogelijk de belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0002758#Artikel5
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002758
        artikel: '25'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002758
        artikel: '26'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0002758
        artikel: '5'
        hoofdstuk: I
  - number: '30'
    text: 'Het bevoegd gezag kan personen oproepen om voor hem of voor door hem daarbij aangewezen ambtenaren te verschijnen:'
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel30
  - number: 30.a
    text: |-
      tot het geven van inlichtingen, die naar zijn redelijk oordeel in het belang van de uitvoering van deze wet nodig
      zijn;
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel30
  - number: 30.b
    text: |-
      tot het overleggen van bescheiden, waarvan raadpleging naar zijn redelijk oordeel in het belang van de uitvoering
      van deze wet nodig is;
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel30
  - number: 30.c
    text: |-
      tot het ondergaan van een onderzoek naar hun geschiktheid voor het verrichten van werkzaamheden ingevolge
      [hoofdstuk II, paragraaf 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002758#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002758
        hoofdstuk: II
        paragraaf: '3'
  - number: '31.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel31
  - number: '31.2'
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur, een woning
      binnen te treden zonder toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel31
  - number: '31.3'
    text: |-
      De in het eerste lid bedoelde ambtenaren beschikken niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1]
      en [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '31.4'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel31
  - number: 31a.1
    text: |-
      Onze Minister wijst ambtenaren aan die belast zijn met het inwinnen van gegevens in het belang van de uitvoering
      van deze wet.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel31a
  - number: 31a.2
    text: |-
      De [artikelen 5:15 tot en met 5:17][ref1] en [5:20 van de Algemene wet bestuursrecht][ref2] zijn van
      overeenkomstige toepassing ten aanzien van de in het eerste lid bedoelde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 31a.3
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur, een woning
      binnen te treden zonder toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel31a
  - number: '32.1'
    text: |-
      Ieder die krachtens [artikel 30][ref1] is opgeroepen, is verplicht ter plaatse en ten tijde, bij de oproeping
      aangewezen, te verschijnen en desverlangd de in dat artikel, onder a tot en met c, bedoelde medewerking te
      verlenen. De verstrekking van de in dat artikel bedoelde inlichtingen dient volledig en naar waarheid te
      geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel30
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002758
        artikel: '30'
        hoofdstuk: VI
  - number: '32.2'
    text: |-
      Het bevoegd gezag is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de in het eerste lid
      gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel32
  - number: '32.3'
    text: |-
      [Artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '34'
    text: |-
      Indien naar het oordeel van het betrokken bevoegd gezag de geboden spoed of buitengewone omstandigheden
      zulks vereisen, kan de bekendmaking van besluiten geschieden op een andere wijze dan op grond van de
      [artikelen 3:41][ref1] en [3:42 van de Algemene wet bestuursrecht][ref2] is vereist. Deze bekendmaking wordt
      vervolgens zo spoedig mogelijk schriftelijk bevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '35.1'
    text: |-
      Indien door een besluit als bedoeld in [artikel 3, derde en vierde lid][ref1], van
      deze wet dan wel bij een besluit als bedoeld in de [artikelen 7, tweede lid][ref2], en
      [8, tweede lid, van de Coördinatiewet uitzonderingstoestanden][ref3], de werking van een of meer der
      [paragrafen 1 tot en met 3 van hoofdstuk II][ref4] wordt beëindigd, kan bij dat besluit worden bepaald, dat met
      betrekking tot geneeskundigen en rechtsbetrekkingen, de krachtens die paragrafen genomen maatregelen en het bij en
      krachtens die paragrafen bepaalde gedurende een bij dat besluit vast te stellen tijd van toepassing blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002758#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel35
    references:
      - id: ref1
