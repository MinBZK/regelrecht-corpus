  - number: '41'
    text: |-
      Opzettelijke overtreding van het krachtens [artikel 13, eerste lid][ref1], of [20, eerste of tweede lid][ref2],
      bepaalde wordt gestraft met gevangenisstraf van ten hoogste één jaar of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel20
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002758
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002758
        artikel: '20'
        hoofdstuk: II
        paragraaf: '3'
  - number: '42'
    text: |-
      Met gevangenisstraf van ten hoogste één jaar of geldboete van de derde categorie wordt gestraft hij die, nadat hem
      krachtens [artikel 13, eerste lid][ref1], een verplichting is opgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel13
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002758
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
  - number: 42.a
    text: |-
      opzettelijk of ondanks waarschuwing roekeloos zich zelf, anderen of de eigendom van degene, in dienst van wie dan
      wel voor wie of bij wie hij ter vervulling van de hem opgelegde verplichting werkzaamheden moet verrichten, aan
      ernstig gevaar blootstelt, dan wel
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel42
  - number: 42.b
    text: opzettelijk en grovelijk de plichten veronachtzaamt, welke voor hem uit de hem opgelegde verplichting voortvloeien.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel42
  - number: '43.1'
    text: |-
      De feiten, strafbaar gesteld bij de [artikelen 39][ref1] en [40][ref2], zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel40
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002758
        artikel: '39'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0002758
        artikel: '40'
        hoofdstuk: VIII
  - number: '43.2'
    text: |-
      De feiten, strafbaar gesteld bij de [artikelen 41][ref1] en [42][ref2], zijn misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel42
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002758
        artikel: '41'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0002758
        artikel: '42'
        hoofdstuk: VIII
  - number: '44'
    text: |-
      De voorgaande strafbepalingen zijn mede van toepassing op de Nederlander of de inwoner van Nederland, die een
      strafbaar feit begaat buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel44
  - number: '46.1'
    text: |-
      Met het opsporen van de feiten, bij deze wet strafbaar gesteld, zijn behalve de ambtenaren, aangewezen bij
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de krachtens [artikel 31][ref2] aangewezen
      ambtenaren, voor zover zij door Onze Minister van Justitie daartoe zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel31
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0002758
        artikel: '31'
        hoofdstuk: VI
  - number: '46.2'
    text: |-
      Bij het opsporen van een bij deze wet strafbaar gesteld feit hebben de in het eerste lid bedoelde ambtenaren
      toegang tot elke plaats, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel46
  - number: '48'
    text: De Wet genees- en tandheelkundige voorziening burgerbevolking (*Stb.* 1939, 802) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel48
  - number: '49'
    text: 'Deze wet kan worden aangehaald als: Noodwet Geneeskundigen.'
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel49
  - number: '50'
    text: |-
      Deze wet treedt, met uitzondering van [hoofdstuk II][ref1], in werking met ingang van de dag na de datum van
      uitgifte van het *Staatsblad*, waarin zij wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002758/2009-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002758
        hoofdstuk: II
