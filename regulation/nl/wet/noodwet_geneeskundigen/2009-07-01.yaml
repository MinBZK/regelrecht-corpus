  - number: '40'
    text: |-
      Overtreding van het bij of krachtens
      [artikel 8, eerste of tweede lid][ref1],[ 9, eerste, tweede of derde lid][ref2],[ 11, eerste lid][ref3],
      [13, eerste lid][ref4], [15][ref5], of [20, eerste of tweede lid][ref6], bepaalde, alsmede overtreding van het
      krachtens [artikel 12, tweede lid][ref7], bepaalde, voor zover zij daarbij is aangeduid als strafbaar feit, wordt
      gestraft met hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002758#Artikel11
