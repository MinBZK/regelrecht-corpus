        paragraaf: '3'
  - number: '43'
    text: |-
      1 De feiten, strafbaar gesteld bij de [artikelen 39][ref1] en [40][ref2], zijn overtredingen.

      2 De feiten, strafbaar gesteld bij de [artikelen 41][ref3] en [42][ref4], zijn misdrijven.


