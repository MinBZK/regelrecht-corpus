  - number: '38'
    text: |-
      1 Zolang één of meer paragrafen van [hoofdstuk II][ref1] in werking zijn, worden geneeskundigen zo mogelijk niet
      dan na overleg met het bevoegd gezag, op grond van het bij of krachtens een andere wet bepaalde verplicht tot het
      verrichten van werkzaamheden in het belang van de militaire of civiele verdediging.

      2 Geneeskundigen, die verplicht zijn zodanige werkzaamheden te verrichten, zijn, zolang deze verplichting duurt,
      van een verplichting, welke hun krachtens [artikel 13, eerste lid][ref2], is opgelegd, ontheven.

      3 Het in het eerste lid bepaalde geldt niet bij een oproeping in militaire dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel13
