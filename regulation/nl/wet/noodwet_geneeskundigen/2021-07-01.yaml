  - number: '30'
    text: |-
      Het bevoegd gezag kan personen oproepen om voor hem of voor door hem daarbij aangewezen ambtenaren te verschijnen:

      a. tot het geven van inlichtingen, die naar zijn redelijk oordeel in het belang van de uitvoering van deze wet
      nodig zijn;

      b. tot het overleggen van bescheiden, waarvan raadpleging naar zijn redelijk oordeel in het belang van de
      uitvoering van deze wet nodig is;

      c. tot het ondergaan van een onderzoek naar hun geschiktheid voor het verrichten van werkzaamheden ingevolge
      [hoofdstuk II, paragraaf 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002758#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002758
        hoofdstuk: II
        paragraaf: '3'
  - number: '31'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.

      2 De in het eerste lid bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur, een woning
      binnen te treden zonder toestemming van de bewoner.

      3 De in het eerste lid bedoelde ambtenaren beschikken niet over de bevoegdheden, genoemd in de
      [artikelen 5:18][ref1] en [5:19 van de Algemene wet bestuursrecht][ref2].

      4 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel519
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:18
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:19
  - number: 31a
    text: |-
      1 Onze Minister wijst ambtenaren aan die belast zijn met het inwinnen van gegevens in het belang van de uitvoering
      van deze wet.

      2 De [artikelen 5:15 tot en met 5:17][ref1] en [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref2]
      zijn van overeenkomstige toepassing ten aanzien van de in het eerste lid bedoelde ambtenaren.

      3 De in het eerste lid bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur, een woning
      binnen te treden zonder toestemming van de bewoner.

      4 Onze Minister is bevoegd tot overeenkomstige toepassing van
      [artikel 5:20, derde lid, van de Algemeen wet bestuursrecht][ref3] ter uitvoering van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel515
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel520
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel520
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel31a
    references:
