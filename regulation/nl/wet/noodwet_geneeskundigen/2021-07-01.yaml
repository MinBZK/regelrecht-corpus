  - number: '41'
    text: |-
      Opzettelijke overtreding van het krachtens [artikel 13, eerste lid][ref1], of [20, eerste of tweede lid][ref2],
      bepaalde wordt gestraft met gevangenisstraf van ten hoogste één jaar of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel20
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002758
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002758
        artikel: '20'
        hoofdstuk: II
        paragraaf: '3'
  - number: '42'
    text: |-
      Met gevangenisstraf van ten hoogste één jaar of geldboete van de derde categorie wordt gestraft hij die, nadat hem
      krachtens [artikel 13, eerste lid][ref1], een verplichting is opgelegd:

      a. opzettelijk of ondanks waarschuwing roekeloos zich zelf, anderen of de eigendom van degene, in dienst van wie
      dan wel voor wie of bij wie hij ter vervulling van de hem opgelegde verplichting werkzaamheden moet verrichten, aan
      ernstig gevaar blootstelt, dan wel

      b. opzettelijk en grovelijk de plichten veronachtzaamt, welke voor hem uit de hem opgelegde verplichting
      voortvloeien.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel13
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel42
    references:
