preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is voor het geval van oorlog, oorlogsgevaar, daaraan
    verwante of daarmede verband houdende buitengewone omstandigheden nieuwe regelen te stellen met betrekking tot de
    geneeskundige, tandheelkundige, verloskundige en farmaceutische voorziening ten behoeve van de bevolking;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      a. *Onze Minister*: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. *bevoegd gezag*: de Directeur-Generaal van de Volksgezondheid, of, voor zover krachtens
      [artikel 5, eerste lid][ref1], een andere autoriteit is aangewezen, deze autoriteit;

      c. *geneeskundige*: degene, ten aanzien van wie geen grond tot weigering van inschrijving in het desbetreffende
      overeenkomstig [artikel 3, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref2] (*Stb*.
      1993, 655) ingestelde register als onderscheidenlijk arts, tandarts, apotheker of verloskundige van toepassing is;

      d. inwoner van Nederland: degene, die als ingezetene in de basisregistratie personen is ingeschreven of behoort te
      zijn ingeschreven.

      2 Voor de toepassing van het eerste lid, onder c, blijft het bepaalde in
      [artikel 8, vijfde lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref3] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel8
