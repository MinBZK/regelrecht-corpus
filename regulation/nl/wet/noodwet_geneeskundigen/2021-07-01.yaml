  - number: '13'
    text: |-
      1 Het bevoegd gezag kan aan geneeskundigen, die Nederlander dan wel inwoner van Nederland zijn, met uitzondering
      van de Nederlanders, woonachtig in de Nederlandse Antillen of Aruba, de verplichting opleggen:

      a. in een daartoe aangewezen gebied, al dan niet van een bepaalde plaats uit, de praktijk uit te oefenen;

      b. bij ontstentenis of afwezigheid van een geneeskundige diens praktijk, geheel of voor een deel en al dan niet van
      een bepaalde plaats uit, waar te nemen;

      c. anderszins alle of een deel van zijn beroepswerkzaamheden, al dan niet van een bepaalde plaats uit en al dan
      niet in dienst van of voor een ander, te verrichten;

      d. daartoe aangewezen werkzaamheden, welke niet behoren tot de beroepswerkzaamheden van een geneeskundige, in het
      belang van de geneeskundige, tandheelkundige, verloskundige of farmaceutische voorziening, al dan niet in dienst
      van of voor een ander, te verrichten;

      e. daartoe aangewezen werkzaamheden, bestaande in het volgen van een opleiding op geneeskundig, tandheelkundig,
      verloskundig of farmaceutisch gebied, bij een ander te verrichten.

      2 Het in het eerste lid, onder *d* en *e*, bepaalde geldt niet ten aanzien van verloskundigen.

      3 Een beschikking krachtens het eerste lid bevat een zo nauwkeurig mogelijke omschrijving van de opgelegde
      verplichting, alsmede van de plaats en tijd van aanvang en, indien mogelijk, van de waarschijnlijke duur van
      de werkzaamheden, welke uit de opgelegde verplichting voortvloeien. In voorkomend geval wijst zij voorts de
      natuurlijke of rechtspersoon aan, in wiens dienst dan wel voor of bij wie de werkzaamheden moeten worden verricht,
      en geeft zij daarbij aan in welke verhouding de geneeskundige tot die persoon zal staan.

      4 De verplichtingen, die krachtens het eerste lid worden opgelegd, kunnen niet strekken tot het verrichten van
      werkzaamheden op plaatsen buiten Nederland.

      5 De geneeskundige, die ten tijde van de oplegging der verplichting een rechtsbetrekking heeft, strekkende tot
      de uitoefening van zijn beroepswerkzaamheden in dienst van of voor een ander of tot het verrichten van andere
      werkzaamheden dan de beroepswerkzaamheden van een geneeskundige in dienst van een ander, is verplicht binnen
      driemaal vierentwintig uur aan zijn wederpartij mededeling te doen van de hem opgelegde verplichting.
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel13
  - number: '14'
    text: |-
      De verplichtingen, bedoeld in [artikel 13, eerste lid][ref1], kunnen niet worden opgelegd aan geneeskundigen, die:

      a. ingevolge een overeenkomst met een andere mogendheid of met een volkenrechtelijke organisatie van oplegging van
      zodanige verplichtingen uitgesloten zijn, of

      b. behoren tot bij algemene maatregel van bestuur daartoe aangewezen categorieën of krachtens zodanige maatregel
      daartoe zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel13
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel14
