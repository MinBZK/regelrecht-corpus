  - number: '21'
    text: |-
      1 Onze Minister kan bij regeling onderscheidenlijk bij beschikking, ten aanzien van ondernemingen die werkzaam
      zijn op het gebied van de geneeskundige of farmaceutische voorziening en die hetzij behoren tot bij de regeling
      aangewezen categorieën, hetzij bij de beschikking afzonderlijk zijn aangewezen, vrijstelling, onderscheidenlijk
      ontheffing verlenen van verplichtingen en verboden, gesteld bij of krachtens wettelijke voorschriften ter zake van
      het tegengaan van gevaar, schade en hinder, teweeggebracht door inrichtingen.

      2 Onze Minister kan bij regeling onderscheidenlijk bij beschikking, ten aanzien van ondernemingen die werkzaam
      zijn op het gebied van de geneeskundige of farmaceutische voorziening en die hetzij behoren tot bij de regeling
      aangewezen categorieën, hetzij bij de beschikking afzonderlijk zijn aangewezen, vrijstelling, onderscheidenlijk
      ontheffing verlenen van verplichtingen en verboden, gesteld bij of krachtens wettelijke voorschriften ter zake van
      de beperking van de arbeidsduur en van de veiligheid en de hygiëne bij de arbeid.

      3 Een vrijstelling of ontheffing kan onder beperkingen, alsmede voorwaardelijk worden verleend; zij kan te allen
      tijde worden ingetrokken. Indien een vrijstelling of ontheffing voorwaardelijk is verleend, geldt zij slechts voor
      zover de gestelde voorwaarden worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel21
  - number: '22'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regelen gesteld omtrent het ten laste van de staat:

      a. toekennen, voor zover nodig, van een vergoeding aan een geneeskundige in verband met een hem krachtens
      [artikel 13, eerste lid][ref1], opgelegde verplichting;

      b. treffen, voor zover nodig, van voorzieningen bij ziekte, ongeval, invaliditeit en overlijden, verband houdende
      met het nakomen van een krachtens [artikel 13, eerste lid][ref2], aan een geneeskundige opgelegde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel13
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel22
