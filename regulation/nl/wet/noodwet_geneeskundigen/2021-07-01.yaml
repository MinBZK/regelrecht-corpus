  - number: '12'
    text: |-
      1 De [artikelen 9][ref1], [10][ref2] en [11][ref3] gelden niet ten aanzien van dienstbetrekkingen van
      geneeskundigen, die overheidswerknemer zijn in de zin van [artikel 2 van de Wet privatisering ABP][ref4].

      2 Ten aanzien van zodanige dienstbetrekkingen kunnen regelen van overeenkomstige strekking worden gesteld bij
      algemene maatregel van bestuur.

      3 Bij een algemene maatregel van bestuur als in het tweede lid bedoeld kunnen omtrent het vragen van voorziening
      tegen beschikkingen, krachtens die maatregelen genomen, en de rechtsgang ter zake, regelen worden gesteld in
      afwijking van [hoofdstuk IV][ref5].

      4 De voordracht tot een algemene maatregel van bestuur als in het tweede lid bedoeld wordt Ons gedaan door Onze
      Minister, te zamen met Onze Ministers, wie het mede aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002758#Artikel11
