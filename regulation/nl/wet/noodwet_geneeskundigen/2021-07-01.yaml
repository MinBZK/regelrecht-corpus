        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:20
  - number: '34'
    text: |-
      Indien naar het oordeel van het betrokken bevoegd gezag de geboden spoed of buitengewone omstandigheden
      zulks vereisen, kan de bekendmaking van besluiten geschieden op een andere wijze dan op grond van de
      [artikelen 3:41][ref1] en [3:42 van de Algemene wet bestuursrecht][ref2] is vereist. Deze bekendmaking wordt
      vervolgens zo spoedig mogelijk schriftelijk bevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel341
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel342
