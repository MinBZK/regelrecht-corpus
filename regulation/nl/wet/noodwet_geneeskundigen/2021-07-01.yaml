  - number: '23'
    text: |-
      In afwijking van [artikel 6:4, eerste lid, van de Algemene wet bestuursrecht][ref1], wordt een bezwaarschrift
      tegen een besluit van Onze Minister of Onze Minister van Sociale zaken en Werkgelegenheid ingediend bij het bevoegd
      gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel64
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 6:4
  - number: '25'
    text: |-
      1 Op een ingekomen bezwaarschrift, gericht tegen een beschikking van het bevoegd gezag, neemt dit, zo het terstond
      de aangevoerde bezwaren gegrond acht, zo spoedig mogelijk een beslissing.

      2 Indien het bevoegd gezag niet terstond de aangevoerde bezwaren gegrond acht, brengt dit het bezwaarschrift
      onverwijld ter kennis van de in [artikel 5, tweede lid][ref1], bedoelde commissie. Deze brengt zo spoedig mogelijk
      advies uit.

      3 Indien het bevoegd gezag zich met het door de commissie uitgebrachte advies kan verenigen, neemt het zo spoedig
      mogelijk dienovereenkomstig een beslissing.

      4 Indien het bevoegd gezag zich met het door de commissie uitgebrachte advies niet kan verenigen, doet dit het
      bezwaarschrift, tezamen met dat advies en zijn oordeel ter zake, onverwijld aan Onze Minister toekomen. Onze
      Minister neemt zo spoedig mogelijk een beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel5
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002758
        artikel: '5'
        hoofdstuk: I
  - number: '26'
    text: |-
      Een bezwaarschrift, gericht tegen een beschikking van Onze Minister of van Onze Minister van Sociale Zaken, wordt
      onverwijld ter kennis van de in [artikel 5, tweede lid][ref1], bedoelde commissie gebracht. Deze brengt zo spoedig
      mogelijk advies uit.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel5
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002758
        artikel: '5'
        hoofdstuk: I
  - number: '28'
    text: |-
      1 Een door Onze Minister of Onze Minister van Sociale Zaken genomen beslissing wordt aan het bevoegd gezag
      medegedeeld.

      2 Voordat een advies als bedoeld in [artikel 25, tweede lid][ref1], of [artikel 26][ref2], wordt uitgebracht, hoort
      de in [artikel 5, tweede lid][ref3], bedoelde commissie zo mogelijk de belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0002758#Artikel5
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel28
