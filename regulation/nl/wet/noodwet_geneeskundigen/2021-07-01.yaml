  - number: '18'
    text: |-
      1 Aan een geneeskundige, als bedoeld in [artikel 12, eerste lid][ref1], wordt voor de tijd, gedurende welke hij
      door het voldoen aan een hem krachtens [artikel 13, eerste lid][ref2], opgelegde verplichting verhinderd is zijn
      bestaande dienstbetrekking te vervullen, in die dienstbetrekking verlof verleend. Bij algemene maatregel van
      bestuur worden hieromtrent nadere regelen gesteld.

      2 De voordracht tot een algemene maatregel van bestuur als in het eerste lid bedoeld wordt Ons gedaan door Onze
      Minister van Binnenlandse Zaken, tezamen met Onze Minister en met Onze Ministers, wie het mede aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel13
