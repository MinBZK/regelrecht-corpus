  - number: '17'
    text: |-
      1 Zolang een geneeskundige door het voldoen aan een hem krachtens [artikel 13, eerste lid][ref1], opgelegde
      verplichting verhinderd is te voldoen aan de verplichtingen, welke op hem krachtens een bestaande rechtsbetrekking
      als bedoeld in [artikel 13, vijfde lid][ref2], rusten, is deze rechtsbetrekking geschorst, doch kan zij door
      partijen niet worden beëindigd zonder vergunning van het bevoegd gezag.

      2 Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de gevolgen van de schorsing voor de
      rechten en verplichtingen uit zodanige rechtsbetrekking.

      3 Een vergunning als in het eerste lid bedoeld kan onder beperkingen worden verleend. Aan zodanige vergunning
      kunnen voorschriften worden verbonden.

      4 [Artikel 10][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel13
