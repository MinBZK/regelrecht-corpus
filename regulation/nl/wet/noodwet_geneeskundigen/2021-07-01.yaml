  - number: '44'
    text: |-
      De voorgaande strafbepalingen zijn mede van toepassing op de Nederlander of de inwoner van Nederland, die een
      strafbaar feit begaat buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel44
  - number: '46'
    text: |-
      1 Met het opsporen van de feiten, bij deze wet strafbaar gesteld, zijn behalve de ambtenaren, aangewezen bij
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de krachtens [artikel 31][ref2] aangewezen
      ambtenaren, voor zover zij door Onze Minister van Justitie daartoe zijn aangewezen.

      2 Bij het opsporen van een bij deze wet strafbaar gesteld feit hebben de in het eerste lid bedoelde ambtenaren
      toegang tot elke plaats, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel31
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0002758
        artikel: '31'
        hoofdstuk: VI
  - number: '48'
    text: De Wet genees- en tandheelkundige voorziening burgerbevolking (*Stb.* 1939, 802) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel48
  - number: '49'
    text: 'Deze wet kan worden aangehaald als: Noodwet Geneeskundigen.'
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel49
  - number: '50'
    text: |-
      Deze wet treedt, met uitzondering van [hoofdstuk II][ref1], in werking met ingang van de dag na de datum van
      uitgifte van het *Staatsblad*, waarin zij wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel50
