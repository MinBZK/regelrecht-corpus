        artikel: 5:20
      - id: ref3
        bwb_id: BWBR0005537
        artikel: 5:20
  - number: '32'
    text: |-
      1 Ieder die krachtens [artikel 30][ref1] is opgeroepen, is verplicht ter plaatse en ten tijde, bij de oproeping
      aangewezen, te verschijnen en desverlangd de in dat artikel, onder a tot en met c, bedoelde medewerking te
      verlenen. De verstrekking van de in dat artikel bedoelde inlichtingen dient volledig en naar waarheid te
      geschieden.

      2 Het bevoegd gezag is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de in het eerste
      lid gestelde verplichtingen.

      3 [Artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel520
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel32
