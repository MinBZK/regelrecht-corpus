        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
  - number: '16'
    text: |-
      1 Te rekenen van de dag, waarop een geneeskundige, aan wie krachtens [artikel 13, eerste lid][ref1], de
      verplichting is opgelegd werkzaamheden als bedoeld in dat lid te verrichten in dienst van dan wel voor of bij
      een ander, deze werkzaamheden verricht, bestaat tussen die geneeskundige en degene, in wiens dienst dan wel voor
      of bij wie de werkzaamheden moeten worden verricht een rechtsbetrekking, die voor de toepassing van wettelijke
      voorschriften geacht wordt een rechtsbetrekking te zijn uit een ter zake van een verhouding als aangegeven
      krachtens [artikel 13, derde lid][ref2], aangegane overeenkomst.

      2 De inhoud van de rechtsbetrekking is zoveel mogelijk gelijk aan de wettelijk geoorloofde inhoud van
      rechtsbetrekkingen uit ter zake gebruikelijke overeenkomsten. Bij of krachtens algemene maatregel van bestuur
      kunnen daaromtrent nadere regelen worden gesteld. Partijen bij de rechtsbetrekking zijn bevoegd gezamenlijk haar
      inhoud nader vast te stellen. Op verzoek van de meest gerede partij geschiedt de nadere vaststelling door het
      bevoegd gezag.

      3 De rechtsbetrekking kan door partijen niet worden bëeindigd. Zij neemt van rechtswege een einde, zodra de
      geneeskundige van de opgelegde verplichting is ontslagen, of gaat behoren tot een der in [artikel 14][ref3]
      bedoelde categorieën.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0002758#Artikel14
