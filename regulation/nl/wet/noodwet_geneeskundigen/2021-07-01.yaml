      - id: ref2
        bwb_id: BWBR0002758
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
  - number: '20'
    text: |-
      1 Bij ministeriële regeling kan worden bepaald, dat het geneeskundigen, aan wie ingevolge
      [artikel 13, eerste lid][ref1], een verplichting kan worden opgelegd, verboden is het land te verlaten zonder door
      hem verleende vergunning.

      2 Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.

      4 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] is van toepassing op de vergunning, bedoeld in dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel20
