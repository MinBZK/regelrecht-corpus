        hoofdstuk: II
        paragraaf: '3'
  - number: '15'
    text: |-
      De overeenkomstig [artikel 13, derde lid][ref1], aangewezen persoon is verplicht de geneeskundige de werkzaamheden,
      welke uit de opgelegde verplichting voortvloeien, te laten verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel13
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel15
