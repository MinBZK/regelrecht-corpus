  - number: '19'
    text: |-
      1 Het bevoegd gezag kan een geneeskundige van een hem krachtens [artikel 13, eerste lid][ref1], opgelegde
      verplichting te allen tijde, hetzij ambtshalve, hetzij op verzoek van de geneeskundige of van de overeenkomstig het
      derde lid van dat artikel aangewezen persoon, ontslaan.

      2 [Artikel 13, vijfde lid][ref2], is met betrekking tot het ontslag van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel13
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel19
