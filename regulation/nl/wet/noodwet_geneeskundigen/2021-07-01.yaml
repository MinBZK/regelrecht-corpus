  - number: '35'
    text: |-
      1 Indien door een besluit als bedoeld in [artikel 3, derde en vierde lid][ref1], van
      deze wet dan wel bij een besluit als bedoeld in de [artikelen 7, tweede lid][ref2], en
      [8, tweede lid, van de Coördinatiewet uitzonderingstoestanden][ref3], de werking van een of meer der
      [paragrafen 1 tot en met 3 van hoofdstuk II][ref4] wordt beëindigd, kan bij dat besluit worden bepaald, dat met
      betrekking tot geneeskundigen en rechtsbetrekkingen, de krachtens die paragrafen genomen maatregelen en het bij en
      krachtens die paragrafen bepaalde gedurende een bij dat besluit vast te stellen tijd van toepassing blijven.

      2 Indien door een besluit als bedoeld in [artikel 3, derde en vierde lid][ref5], van
      deze wet dan wel bij een besluit als bedoeld in de [artikelen 7, tweede lid][ref6], en
      [8, tweede lid, van de Coördinatiewet uitzonderingstoestanden][ref7], de werking van
      [paragraaf 4 van hoofdstuk II][ref8] wordt beëindigd, kan bij dat besluit met betrekking tot, op grond van die
      paragraaf verleende, van kracht zijnde vrijstellingen en ontheffingen worden bepaald, dat deze te hunnen aanzien
      gedurende een bij dat besluit vast te stellen tijd van toepassing blijven.


