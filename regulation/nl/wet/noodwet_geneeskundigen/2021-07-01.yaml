  - number: '8'
    text: |-
      1 Bij ministeriële regeling kan worden bepaald, dat het geneeskundigen in het algemeen, dan wel dat het
      geneeskundigen, behorende tot bij de regeling aangewezen categorieën, verboden is zonder vergunning van het bevoegd
      gezag:

      a. de uitoefening van de praktijk geheel of voor een deel te staken;

      b. zich ter uitoefening van de praktijk te vestigen;

      c. bij ontstentenis of afwezigheid van een geneeskundige diens praktijk langer dan een week waar te nemen.

      2 Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.

      4 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op de vergunning, bedoeld in dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '9'
    text: |-
      1 Bij ministeriële regeling kan worden bepaald, dat het geneeskundigen in het algemeen, dan wel dat het
      geneeskundigen, behorende tot bij de regeling aangewezen categorieën, verboden is zonder vergunning van het bevoegd
      gezag een rechtsbetrekking, strekkende tot de uitoefening van hun beroepswerkzaamheden in dienst van of voor een
      ander:

      a. te beëindigen;

      b. aan te gaan.

      2 Een krachtens het eerste lid, onder *a*, gesteld verbod geldt mede voor de wederpartij.

      3 Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.

      5 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op de vergunning, bedoeld in dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '10'
    text: |-
      Indien een rechtsbetrekking door één der partijen is beëindigd in strijd met een krachtens
      [artikel 9, eerste lid, onder ][ref1], gesteld verbod of met een voorschrift, verbonden aan een krachtens dat lid
      verleende vergunning, kan de wederpartij gedurende zes maanden de nietigheid der beëindiging inroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel9
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002758
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
  - number: '11'
    text: |-
      1 Het is zowel de geneeskundige als de wederpartij verboden een rechtsbetrekking, aangegaan in strijd met een
      krachtens [artikel 9, eerste lid, onder ][ref1], gesteld verbod of met een voorschrift, verbonden aan een krachtens
      dat lid verleende vergunning, te laten voortduren.

      2 Ten aanzien van het beëindigen van zodanige rechtsbetrekking geldt een krachtens
      [artikel 9, eerste lid, onder ][ref2], gesteld verbod niet.

      3 De persoon, die zodanige rechtsbetrekking met de geneeskundige heeft aangegaan, is verplicht van de beëindiging
      van de rechtsbetrekking onverwijld aan het bevoegd gezag schriftelijk mededeling te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel9
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel11
