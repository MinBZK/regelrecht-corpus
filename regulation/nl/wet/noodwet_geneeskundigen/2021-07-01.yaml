  - number: '36'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002758/2021-07-01#Artikel36
  - number: '37'
    text: |-
      1 Het bij of krachtens [artikel 8, eerste lid][ref1], [9, eerste lid][ref2], en [13, eerste lid][ref3], bepaalde is
      niet van toepassing ten aanzien van:

      a. de leden van de Hoge Colleges van Staat, Onze Ministers, de Staatssecretarissen en de leden van de rechterlijke
      macht met rechtspraak belast;

      b. de leden van provinciale staten en van gemeenteraden;

      c. degenen, die in werkelijke militaire dienst zijn of in militaire dienst opgeroepen zijn;

      d. bekleders van een geestelijk ambt of diegenen die een opleiding tot een zodanig ambt volgen;

      e. degenen, die bij algemene maatregel van bestuur daartoe aangewezen openbare ambten bekleden.

      2 Bij of krachtens algemene maatregel van bestuur worden regelen gesteld ter nadere bepaling van de in het eerste
      lid, onder *d*, bedoelde categorie van personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002758#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002758#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002758#Artikel13
