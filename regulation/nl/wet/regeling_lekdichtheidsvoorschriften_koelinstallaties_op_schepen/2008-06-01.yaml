$id: regeling_lekdichtheidsvoorschriften_koelinstallaties_op_schepen
regulatory_layer: WET
publication_date: '2015-10-15'
valid_from: '2008-06-01'
bwb_id: BWBR0008743
url: https://wetten.overheid.nl/BWBR0008743/2008-06-01
preamble:
  text: |-
    Gelet op artikel 15, derde lid, van het Besluit inzake stoffen die de ozonlaag aantasten;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Een koelinstallatie op een schip is onvoldoende lekdicht, indien bij onderhouds- of installatiewerkzaamheden
      materialen of onderdelen worden toegepast die niet voldoen aan paragraaf 2 van de bij deze regeling behorende
      bijlage.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel1
  - number: '2.1'
    text: |-
      Een koelinstallatie op een schip die op of na 17 maart 1993 is geïnstalleerd of voor het eerst voor gebruik ter
      beschikking is gesteld, is voorts onvoldoende lekdicht indien het ontwerp of de ruimte waarin de koelinstallatie
      op een schip is geplaatst, niet voldoet aan het bepaalde in paragraaf 3 onderscheidenlijk paragraaf 5 van de bij
      deze regeling behorende bijlage, of indien tijdens de installatiewerkzaamheden niet is gehandeld overeenkomstig
      paragraaf 4 van die bijlage.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2
  - number: '2.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op veranderingen die op of na 17 maart 1993 aan een
      koelinstallatie op een schip zijn aangebracht, met dien verstande dat het vervangen van een onderdeel of van het
      koudemiddel niet wordt aangemerkt als een verandering aan de koelinstallatie op een schip.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2
  - number: '3.1'
    text: |-
      Een koelinstallatie op een schip die voor het eerst in bedrijf wordt gesteld en een bestaande koelinstallatie
      op een schip waaraan veranderingen zijn aangebracht, worden voordat die installatie in bedrijf wordt gesteld
      onderscheidenlijk opnieuw in bedrijf wordt gesteld, aan een controle onderworpen overeenkomstig paragraaf 7 van de
      bij deze regeling behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: '3.2'
    text: Een bestaande koelinstallatie op een schip die opnieuw in bedrijf wordt gesteld nadat
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: 3.2.a
    text: een lekkage van of een defect aan die installatie is verholpen,
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: 3.2.b
    text: een onderdeel van die installatie is vervangen, of
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: 3.2.c
    text: |-
      het koudemiddel van die installatie is vervangen door een ander koudemiddel, wordt, voordat die installatie opnieuw
      in bedrijf wordt gesteld, aan een beperkte controle onderworpen overeenkomstig paragraaf 7 van de bij deze regeling
      behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: '4'
    text: |-
      De [artikelen 2][ref1] en [3][ref2] zijn niet van toepassing op een koelinstallatie op een schip die vóór 17
      maart 1993 is geïnstalleerd of voor gebruik ter beschikking is gesteld en die tijdelijk, voor een periode van ten
      hoogste zes maanden, op een andere plaats wordt geïnstalleerd, waarna de koelinstallatie op een schip op dezelfde
      of op een andere plaats binnen de inrichting wordt teruggeplaatst zonder dat aan de installatie wijzigingen zijn
      aangebracht, mits deze tijdelijke verplaatsing vooraf in het logboek, behorend bij de koelinstallatie op een schip,
      is aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0008743#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008743#Artikel3
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008743
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008743
        artikel: '3'
  - number: '5'
    text: |-
      Deze regeling is niet van toepassing op een koelinstallatie op een schip die tijdelijk in bedrijf wordt gesteld
      met als enig oogmerk de installatie te beproeven op het correct functioneren ervan, waarna de installatie wordt
      uitgevoerd naar een ander land.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel5
  - number: '6'
    text: |-
      De beheerder van een koelinstallatie op een schip, de persoon die beschikt over een erkenningsbewijs als bedoeld
      in artikel 13, eerste lid, van het Besluit inzake stoffen die de ozonlaag aantasten of de persoon, belast met
      het beheer van een koelinstallatie op een schip, die in dienst is van een onderneming die over een zodanig
      erkenningsbewijs beschikt, neemt paragraaf 6 van de bij deze regeling behorende bijlage in acht. Onder beheerder
      wordt in deze regeling verstaan de eigenaar of degene die uit anderen hoofde bevoegd is tot het verrichten van
      handelingen met betrekking tot een koelinstallatie op een schip.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6
  - number: '8'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel8
  - number: 8a
    text: |-
      Deze regeling berust op [artikel 5, tweede lid, van het Besluit ozonlaagafbrekende stoffen milieubeheer][ref1] of
      [artikel 1, tweede lid, van het Besluit broeikasgassen in apparatuur op schepen milieubeheer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015507#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007617#Artikel1
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0015507
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007617
        artikel: '1'
  - number: '9'
    text: |-
      Deze regeling wordt aangehaald als: Regeling lekdichtheidsvoorschriften koelinstallaties op schepen. Deze regeling
      zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel9
  - number: 2.1.2.1.1
    text: |-
      Indien staal en gietstaal in aanraking komen met koudemiddel mogen deze materialen slechts worden toegepast indien
      zij voldoen aan de eisen die zijn vastgelegd in norm NEN-EN 10025.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.1
  - number: 2.1.2.1.2
    text: Koper dat in aanraking komt met een koudemiddel mag niet zuurstofhoudend of zuurstofonttrekkend zijn.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.1
  - number: 2.1.2.1.3
    text: |-
      Een koperlegering die in aanraking komt met een koudemiddel mag uitsluitend worden toegepast, indien deze legering
      niet door het koudemiddel kan worden aangetast.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.1
  - number: 2.1.2.1.4
    text: Indien aluminium wordt gebruikt als pakkingmateriaal, dient ongelegeerd aluminium te worden toegepast.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.1
  - number: 2.1.2.1.5
    text: |-
      Indien, anders dan als pakkingmateriaal, een aluminiumlegering wordt toegepast, mag deze legering niet meer dan 2%
      magnesium bevatten.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.1
  - number: 2.1.2.1.6
    text: |-
      Een magnesiumlegering die in aanraking komt met een koudemiddel mag uitsluitend worden toegepast indien deze
      legering niet door het koudemiddel kan worden aangetast.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.1
  - number: 2.1.2.1.7
    text: Zink mag uitsluitend in een koelinstallatie worden toegepast in zinkhoudende koperlegeringen.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.1
  - number: 2.1.2.1.8
    text: Lood mag uitsluitend in een koelinstallatie worden toegepast als pakkingmateriaal.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.1
  - number: 2.1.2.1.9
    text: |-
      Een tin- of loodlegering die in aanraking komt met een koudemiddel, mag uitsluitend worden toegepast indien deze
      legering niet door het koudemiddel kan worden aangetast.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.1
  - number: 2.1.2.1.10
    text: Een soldeerlegering op basis van tin mag niet worden toegepast.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.1
  - number: 2.1.2.1.11
    text: |-
      Een soldeerlegering die in aanraking komt met een koudemiddel, mag uitsluitend worden toegepast indien deze
      legering niet door het koudemiddel kan worden aangetast.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.1
  - number: 2.1.2.1.12
    text: |-
      Glas dat in een kijkglas of in leidingen is verwerkt, dient thermisch behandeld, kleurloos en vrij van luchtbellen
      te zijn. Voorts dient het bestand te zijn tegen de in een koelinstallatie optredende druk en temperatuur en tegen
      de chemische aantasting die door het koudemiddel kan worden veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.1
  - number: 2.1.2.1.13
    text: |-
      Indien kunststofslangen of -leidingen worden toegepast, dienen deze slangen of leidingen met inbegrip van hun
      verbindingsstukken zodanig te zijn geconstrueerd dat de mate van permeatie van de toegepaste koudemiddelen ten
      minste voldoet aan de eisen van permeabiliteit die voor CFK 12 zijn gesteld in SAE-norm J51 van mei 1985. Voorts
      dienen de kunststofleidingen en -slangen duurzaam bestand te zijn tegen mechanische, thermische, elektrische en
      chemische invloeden die in een koelinstallatie kunnen optreden, alsmede tegen eventueel optredende trekspanningen
      of krimpverschijnselen.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.1
  - number: 2.1.2.1.14
    text: |-
      Pakkingmateriaal dient bestand te zijn tegen het toegepaste koudemiddel, tegen de toegepaste smeerolie en tegen de
      optredende spanningen en temperaturen in een koelinstallatie.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.1
  - number: 2.1.2.1.15
    text: 'Gietijzer mag worden toegepast in leidingverbindingen indien aan de volgende eisen wordt voldaan:'
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.1
  - number: 2.1.2.1.15.a
    text: de ontwerpdruk mag niet hoger zijn dan 25 bar;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.1
  - number: 2.1.2.1.15.b
    text: het gietijzer dient onthard te zijn;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.1
  - number: 2.1.2.1.15.c
    text: het lassen van of aan gietijzer is niet toegestaan;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.1
  - number: 2.1.2.1.15.d
    text: de leidingen dienen beschermd te zijn tegen mogelijke beschadiging.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.1
  - number: 2.1.2.1.16
    text: |-
      Indien gebruik wordt gemaakt van een koudemiddel als koude- of warmtedrager dienen de voorschriften 2.1.1 tot en
      met 2.1.15 in acht te worden genomen met betrekking tot de materialen die in aanraking komen met het koudemiddel.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.1
  - number: 2.2.1.2.2.1.1
    text: |-
      Indien de totale hoeveelheid koudemiddelvulling van een koelinstallatie groter is dan of gelijk is aan tien
      kilogram maar kleiner is dan honderd kilogram, dienen aansluitingen voor het meten van de hoge en lage druk op of
      in de nabijheid van de compressoren te zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.1
  - number: 2.2.1.2.2.1.2
    text: |-
      Indien de totale hoeveelheid koudemiddelvulling van een koelinstallatie groter is dan of gelijk is aan honderd
      kilogram, dienen in ieder koudemiddelcircuit de compressoren voorzien te zijn van een drukmeter voor het meten van
      zowel de hoge als de lage druk van de koelinstallatie.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.1
  - number: 2.2.1.2.2.1.3
    text: |-
      Een compressor met een persafsluiter of een externe terugslagklep, en een compressor met een slagvolume van meer
      dan 90 m³ per uur dienen voorzien te zijn van een hogedrukpressostaat.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.1
  - number: 2.2.1.2.2.1.4
    text: |-
      Het drukmeetpunt van een hogedrukpressostaat en een hogedrukmanometer is aangebracht tussen de compressor en
      de persafsluiter of de externe terugslagklep. Indien een lagedrukpressostaat en een lagedrukmanometer zijn
      aangebracht, is het drukmeetpunt aangebracht tussen de compressor en de zuig-afsluiter.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.1
  - number: 2.2.1.2.2.1.5
    text: |-
      Indien in een koelinstallatie een verdringingscompressor met een slagvolume van meer dan 90 m³ per uur is
      toegepast, dient tussen de compressor en de persafsluiter of tussen de compressor en de externe terugslagklep
      een interne of externe ontlastklep of een breekplaat te zijn aangebracht, die afblaast naar de zuigzijde van de
      compressor of naar een speciaal hiervoor bestemd vat.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.1
  - number: 2.2.1.2.2.1.6
    text: |-
      In afwijking van voorschrift 2.2.1.5 hoeft geen ontlastklep of breekplaat te zijn aangebracht indien de maximaal
      toelaatbare werkdruk voor de koelinstallatie niet hoger is dan de maximaal toelaatbare werkdruk voor de compressor.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.1
  - number: 2.2.1.2.2.1.7
    text: |-
      In afwijking van voorschrift 2.2.1.3 hoeft een centrifugaalcompressor niet te zijn voorzien van een
      hogedrukpressostaat indien de maximaal toelaatbare werkdruk voor de koelinstallatie niet kan worden overschreden.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.1
  - number: 2.2.1.2.2.1.8
    text: |-
      Een asafdichting van een compressor dient duurzaam bestand te zijn tegen de maximaal toelaatbare werkdruk voor de
      koelinstallatie en tegen de optredende temperaturen.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.1
  - number: 2.2.1.2.2.1.9
    text: |-
      Een compressor dient te zijn voorzien van een kenplaat of een document, op of in de nabijheid van de
      koelinstallatie, waarop ten minste de volgende gegevens staan vermeld:
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.1
  - number: 2.2.1.2.2.1.9.a
    text: het type compressor;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.1
  - number: 2.2.1.2.2.1.9.b
    text: de beproevingsdruk;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.1
  - number: 2.2.1.2.2.1.9.c
    text: de maximaal toelaatbare werkdruk voor het hoge- en het lagedrukgedeelte.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.1
  - number: 2.2.1.2.2.1.10
    text: |-
      Bij een open compressor dient op de kenplaat of het document, bedoeld in voorschrift 2.2.1.9, tevens het maximale
      toerental te zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.1
  - number: 2.2.1.2.2.1.11
    text: |-
      De kenplaat of het document als bedoeld in voorschrift 2.2.1.9 en 2.2.1.10 is niet verplicht voor mobiele
      koelinstallaties met een koudemiddelinhoud die kleiner is dan drie kilogram.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.1
  - number: 2.2.1.2.2.1.12
    text: |-
      Bij een hermetische of een semi-hermetische compressor dienen op de kenplaat of het document, bedoeld in
      voorschrift 2.2.1.9, tevens de nominale spanning en de maximale stroomopname te zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.1
  - number: 2.2.1.2.2.1.13
    text: |-
      Een verdringingspomp dient te zijn voorzien van een ontlastklep op de perskant van de pomp die afblaast naar het
      lagedrukgedeelte van de koelinstallatie.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.1
  - number: 2.2.1.2.2.1.14
    text: |-
      Bij het verwijderen van de olie uit een compressor dienen zodanige maatregelen te worden genomen dat het
      koudemiddel dat vrijkomt uit de olie van de compressor wordt opgevangen.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.1
  - number: 2.2.2.2.2.2.1
    text: |-
      Een drukvat met een inwendige diameter die groter is dan of gelijk is aan 152 mm, dat een vloeibaar koudemiddel kan
      bevatten en dat afgesloten kan worden van de overige onderdelen van een koelinstallatie, dient te zijn beveiligd
      door een ontlastorgaan.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.2
  - number: 2.2.2.2.2.2.2
    text: |-
      Indien een drukvat een inwendig bruto volume van 0,1 m³ of meer heeft, dient het drukvat te zijn voorzien van een
      veiligheidsklep.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.2
  - number: 2.2.2.2.2.2.3
    text: |-
      Indien een drukvat een inwendig bruto volume van minder dan 0,1 m³ heeft, dient het te zijn voorzien van een
      ontlastklep die afblaast naar het lagedrukgedeelte van de koelinstallatie.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.2
  - number: 2.2.2.2.2.2.4
    text: |-
      In afwijking van de voorschriften 2.2.2.1 tot en met 2.2.2.3 behoeft geen ontlastorgaan te worden toegepast
      indien een drukvat niet kan worden afgesloten van de overige onderdelen van de koelinstallatie, anders dan door
      middel van een of meer afsluiters die in open stand geborgd kunnen worden, waarbij tevens is gewaarborgd dat de
      koelinstallatie niet in bedrijf kan worden gesteld bij een gesloten stand van een of meer van deze afsluiters.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.2
  - number: 2.2.2.2.2.2.5
    text: |-
      Op een drukvat dat is voorzien van een mantel die warmte toevoert, dient een drukmeter en een thermometer te zijn
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.2
  - number: 2.2.2.2.2.2.6
    text: |-
      Een voorziening om een ontlastorgaan met behulp van een omleiding te kunnen verwijderen, dient zodanig te zijn
      aangebracht, dat bij die handeling geen verlies van koudemiddel kan optreden.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.2
  - number: 2.2.3.2.2.3.1
    text: |-
      Indien in een koelinstallatie een vloeistofvat aanwezig is, mag bij zowel de maximaal als de minimaal optredende
      temperatuur van het koudemiddel dit vloeistofvat ten hoogste voor 80% zijn gevuld.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.3
  - number: 2.2.3.2.2.3.2
    text: |-
      Een vloeistofvat dient voorzien te zijn van een vloeistofniveaumeter. Het in voorschrift 2.2.3.1 bedoelde maximaal
      toelaatbare vloeistofniveau dient duidelijk te zijn aangegeven op de vloeistofniveaumeter.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.3
  - number: 2.2.3.2.2.3.3
    text: |-
      In afwijking van voorschrift 2.2.3.2. mag op een vloeistofvat met een bruto volume kleiner dan 0,3 m³ worden
      volstaan met een kijkglas; het kijkglas dient in dat geval duidelijk afleesbaar het maximaal toelaatbare
      vloeistofniveau aan te geven.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.3
  - number: 2.2.3.2.2.3.4
    text: |-
      Voorschrift 2.2.3.2 geldt niet voor een vloeistofvat met een bruto volume dat kleiner is dan 0,1 m³ dat niet
      kan worden afgesloten van de overige onderdelen van de koelinstallatie, anders dan door middel van een of meer
      afsluiters die in open stand geborgd kunnen worden, waarbij tevens is gewaarborgd dat de koelinstallatie niet in
      bedrijf kan worden gesteld bij een gesloten stand van een of meer van deze afsluiters.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.3
  - number: 2.2.3.2.2.3.5
    text: |-
      Een koelinstallatie mag zijn uitgevoerd met een standpijp voor het meten van het vloeistofniveau in een
      vloeistofvat, mits dit vat tevens is voorzien van een kijkglas ter hoogte van het maximaal toelaatbare
      vloeistofniveau en de standpijp corrosiebestendig is.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.3
  - number: 2.2.3.2.2.3.6
    text: |-
      Indien een afsluiter van een vloeistofniveaumeter gesloten is, mag de vloeistofniveaumeter ten hoogste voor 80%
      gevuld zijn.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.3
  - number: 2.2.4.2.2.4.1
    text: |-
      Een koperen leiding die koudemiddel bevat dient, afhankelijk van de uitwendige diameter, te zijn uitgevoerd met een
      wanddikte die is gegeven in tabel 1. Voorts is, afhankelijk van de uitwendige diameter en de daarbij voorgeschreven
      wanddikte, een maximale druk toegestaan die eveneens is gegeven in tabel 1.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.4
  - number: 2.2.4.2.2.4.2
    text: |-
      In afwijking van voorschrift 2.2.4.1 mag de wanddikte van koperen leidingen met een uitwendige diameter die groter
      is dan of gelijk is aan 9,5 mm, en kleiner is dan 15,9 mm, die zich bevinden in onderdelen met opgeperste vinnen,
      geringer zijn dan de in tabel 1 opgenomen waarden, met dien verstande dat de wanddikte ten minste 0,4 mm moet
      bedragen.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.4
  - number: 2.2.4.2.2.4.3
    text: |-
      In afwijking van voorschrift 2.2.4.1 mag voorts de wanddikte van koperen leidingen met een uitwendige diameter
      die kleiner is dan 9,5 mm, die zich bevinden in onderdelen met opgeperste vinnen, geringer zijn dan de in tabel 1
      opgenomen waarde, met dien verstande dat de wanddikte ten minste 0,3 mm moet bedragen.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.4
  - number: 2.2.4.2.2.4.4
    text: |-
      Koperen verdeelstukken voor gevinde onderdelen, en bochten voor leidingen die niet zijn beveiligd met een
      toereikende ommanteling, dienen geïnstalleerd te zijn met versterkte leidingverbindingen die voldoen aan de
      afmetingen die zijn vermeld in voorschrift 2.2.4.1.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.4
  - number: 2.2.4.2.2.4.5
    text: |-
      Onverminderd het bepaalde in voorschrift 2.1.1 gelden voor stalen leidingen en bijbehorende lasverbindin-gen die
      bij lage temperaturen worden toegepast, afhankelijk van de werktemperatuur en de wanddikte, de volgende minimale
      kerfslagwaarden:
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.4
  - number: 2.2.4.2.2.4.5.a
    text: |-
      bij een werktemperatuur die lager is dan of gelijk is aan -30 °C en hoger is dan -40 °C en bij een wanddikte die
      kleiner is dan of gelijk is aan 10 mm bedraagt de kerfslagwaarde ten minste 27 Joule bij -20 °C;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.4
  - number: 2.2.4.2.2.4.5.b
    text: |-
      bij een werktemperatuur die lager is dan of gelijk is aan -40 °C en bij een wanddikte die kleiner is dan of gelijk
      is aan 10 mm bedraagt de kerfslagwaarde ten minste 40 Joule bij -40 °C;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.4
  - number: 2.2.5.2.2.5.1
    text: |-
      De beproevingsdruk van een vloeistofniveaumeter dient ten minste gelijk te zijn aan die van het installatie-
      onderdeel waarop deze is aangebracht.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.5
  - number: 2.2.5.2.2.5.2
    text: |-
      Indien een vloeistofniveaumeter in de vorm van een glazen buis wordt gebruikt, dient deze aan beide zijden te zijn
      begrensd door een afsluiter die automatisch sluit bij een glasbreuk.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.5
  - number: 2.2.6.2.2.6.1
    text: |-
      Een afsluiter die in een koelinstallatie is aangebracht, dient met het oog op een lekdichte afsluiting te voldoen
      aan de stand der techniek op het tijdstip waarop de afsluiter is geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.6
  - number: 2.2.6.2.2.6.2
    text: |-
      Een koelinstallatie dient van voldoende afsluiters te zijn voorzien teneinde tijdens onderhouds- en
      installatiewerkzaamheden verlies van koudemiddel te kunnen voorkomen.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.6
  - number: 2.2.7.2.2.7.1
    text: |-
      Een permanent aangesloten drukmeter op een koelinstallatie dient geschikt te zijn voor gebruik bij ten minste de
      maximaal toelaatbare werkdruk van het onderdeel van de installatie waarop deze is gemonteerd. Dit dient te worden
      aangetoond met een fabriekscertificaat waarop dit staat vermeld, met inbegrip van de methode of de norm op basis
      waarvan dit is gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.7
  - number: 2.2.7.2.2.7.2
    text: |-
      Indien de wijzerplaat of het display van een permanent aangesloten drukmeter is voorzien van een bij de gemeten
      drukken behorende verzadigings-temperatuur, dient op die meter aangegeven te zijn voor welk koudemiddel deze meter
      geschikt is.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.7
  - number: 2.2.7.2.2.7.3
    text: |-
      Een drukmeter dient bestand te zijn tegen de beproevingsdruk van het onderdeel van de koelinstallatie waarop de
      meter is aangebracht, zonder dat de goede werking van de meter wordt verstoord.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.7
  - number: 2.2.8.2.2.8.1
    text: Leidingen dienen door middel van gelaste of hardsoldeerverbindingen met elkaar verbonden te zijn.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.8
  - number: 2.2.8.2.2.8.2
    text: |-
      In afwijking van voorschrift 2.2.8.1 is een flensverbinding, een knelkoppeling, een verbinding met een wartel en
      een vlakke of konische pakking of een opgesloten O-ring toegestaan, doch uitsluitend indien de pakking of O-ring
      dient als afdichtend element en wordt vernieuwd nadat de verbinding tijdelijk is losgemaakt om vervolgens opnieuw
      te worden vastgemaakt. Een snelkoppeling dient voorzien te zijn van een breekplaat en is uitsluitend toegestaan
      voor eenmalig gebruik, inhoudend dat de koppeling na het losmaken niet opnieuw mag worden vastgemaakt.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.8
  - number: 2.2.8.2.2.8.3
    text: |-
      Las- of soldeerwerkzaamheden mogen, met uitzondering van de fabrieksmatige serieproduktie van onderdelen,
      uitsluitend worden verricht door een persoon die dat doet onder verantwoordelijkheid van een onderneming die
      beschikt over een erkenningsbewijs als bedoeld in artikel 13, eerste lid, van het Besluit inzake stoffen die de
      ozonlaag aantasten.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.8
  - number: 2.2.8.2.2.8.4
    text: Zachtsoldeer mag uitsluitend zijn toegepast ten behoeve van het dichtsolderen van een schroefverbinding.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.8
  - number: 2.2.8.2.2.8.5
    text: |-
      Leidingen van verschillende diameters dienen verbonden te zijn met verloopstukken, voorzover die beschikbaar zijn
      volgens de stand der techniek, of met fabrieksmatig geproduceerde verbindingen.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.8
  - number: 2.2.8.2.2.8.6
    text: |-
      Leidingen van een gelijke diameter mogen slechts met elkaar verbonden zijn door een verbinding waarbij een van
      de leidinguiteinden is opgetrompt of een verbinding waarbij een fabriekssok is toegepast. Een zodanige verbinding
      dient gelast of gesoldeerd te zijn.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.8
  - number: 2.2.8.2.2.8.7
    text: Een flensverbinding dient zodanig te zijn aangebracht dat de pakking niet naar buiten kan worden gedrukt.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.8
  - number: 2.2.8.2.2.8.8
    text: |-
      Pakkingmateriaal mag niet doorlatend zijn en mag uitsluitend worden toegepast indien het niet door het in de
      koelinstallatie toegepaste koudemiddel of door de toegepaste smeerolie kan worden aangetast.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.8
  - number: 2.2.8.2.2.8.9
    text: |-
      Een schroefdraadverbinding mag slechts zijn toegepast in een vloeistofleiding met een uitwendige diameter die
      kleiner is dan 32 mm of in een dampleiding met een uitwendige diameter die kleiner is dan 40 mm.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.8
  - number: 2.2.8.2.2.8.10
    text: In een koelinstallatie zijn geen flareverbindingen toegestaan.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.8
  - number: 2.2.8.2.2.8.11
    text: |-
      In afwijking van voorschrift 2.2.8.10 mogen flareverbindingen in een koelinstallatie die is geïnstalleerd
      of voor het eerst voor gebruik ter beschikking is gesteld vóór 17 maart 1993 worden vervangen door nieuwe
      flareverbindingen.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel2.2.8
  - number: 3.3.1
    text: |-
      Degene die een koelinstallatie ontwerpt of installeert draagt er zorg voor dat de koelinstallatie zodanig is
      ontworpen en uitgevoerd dat:
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: 3.3.1.a
    text: bij een normaal gebruik van de koelinstallatie geen verlies van koudemiddel optreedt;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: 3.3.1.b
    text: |-
      door corrosie, spanningen of trillingen die bij een normaal gebruik van de koelinstallatie kunnen optreden, geen
      verlies van koudemiddel optreedt;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: 3.3.1.c
    text: |-
      installatie-, onderhouds- en controlewerkzaamheden kunnen worden uitgevoerd, zonder dat dit leidt tot verlies van
      koudemiddel;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: 3.3.1.d
    text: |-
      de druk die optreedt tijdens de periode waarin de koelinstallatie normaal in bedrijf is, tijdens de periode waarin
      de koelinstallaties buiten bedrijf is gesteld, of tijdens het transport van een koelinstallatie, niet leidt tot
      verlies van koudemiddel.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: 3.3.2
    text: |-
      Bij de bepaling van de maximaal toelaatbare werkdruk voor een koelinstallatie dient rekening te worden gehouden
      met:
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: 3.3.2.a
    text: de omgevingstemperatuur;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: 3.3.2.b
    text: de aanwezigheid van niet condenseerbare gassen;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: 3.3.2.c
    text: |-
      de verschillen tussen de inwendige druk van de koelinstallatie tijdens een normaal gebruik en de druk waarop de
      pressostaat is ingesteld;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: 3.3.2.d
    text: de ontdooimethode;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: 3.3.2.e
    text: de aard van de toepassing van de koelinstallatie;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: 3.3.2.f
    text: de invloed van zonneschijn;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: 3.3.2.g
    text: mogelijke vervuiling of beschadiging van de koelinstallatie.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: 3.3.3
    text: |-
      Indien een koelinstallatie is onderverdeeld in verschillende installatiegedeelten en voor ieder gedeelte
      een afzonderlijke maximaal toelaatbare werkdruk geldt, dient de druk waaronder de koelinstallatie of het
      installatiegedeelte normaal in bedrijf is, lager te zijn dan de maximaal toelaatbare werkdruk voor de
      koelinstallatie of het installatiegedeelte.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: 3.3.4
    text: |-
      De ontwerpdruk van een onderdeel mag niet lager zijn dan de maximaal toelaatbare werkdruk voor de koelinstallatie
      of voor het gedeelte van de koelinstallatie waarvan het onderdeel deel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: 3.3.5
    text: |-
      De verhouding tussen druk en maximaal toelaatbare werkdruk voor een koelinstallatie dient te voldoen aan de
      verhoudingen die zijn weergegeven in tabel 2.

                **Tabel 2. Drukverhoudingen**







                      **Druksoort**


                      **Drukwaarde**




                      Ontwerpdruk


                      Ten minste 1,0 maal de maximaal toelaatbare
                      werkdruk




                      Sterktebeproevingensdruk voor
                      een onderdeel van gietijzer


                      Ten minste 1,5 maal de maximaal toelaatbare
                      werkdruk




                      Sterktebeproevingsdruk voor een
                      onderdeel van gewalst of
                      getrokken materiaal


                      Ten minste 1,3 maal de maximaal toelaatbare
                      werkdruk




                      Beproevingsdruk voor een
                      volledige installatie of een
                      gedeelte van een installatie


                      Ten minste 1,0 maal en ten hoogste 1,3 maal de
                      maximaal toelaatbare werkdruk




                      Druk tijdens een lekkagetest


                      Ten hoogste 1,0 maal de maximaal toelaatbare
                      werkdruk




                      Instelling pressostaat


                      Kleiner dan of gelijk aan 0,9 maal de maximaal
                      toelaatbare werkdruk




                      Instelling van een ontlastorgaan


                      Gelijk aan 1,0 maal de maximaal toelaatbare
                      werkdruk




                      Druk waarbij de afblaascapaciteit
                      van een ontlastorgaan
                      wordt berekend


                      Ten hoogste 1,1 maal de maximaal toelaatbare
                      werkdruk
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: 3.3.6
    text: |-
      In een koelinstallatie, waarvan het lagedrukgedeelte niet gescheiden kan worden van het hogedrukgedeelte, mag
      de afpersdruk van de koelinstallatie gelijk zijn aan de maximaal toelaatbare werkdruk voor het lagedrukgedeelte,
      indien de onderdelen van het hogedrukgedeelte getest zijn overeenkomstig de drukken zoals weergegeven in tabel 2.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel3
  - number: 4.1.4.1.1
    text: |-
      Een koelinstallatie die in de open lucht is opgesteld, dient zodanig te zijn geconstrueerd dat weersinvloeden niet
      kunnen leiden tot verlies van koudemiddel.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.1
  - number: 4.1.4.1.2
    text: |-
      De met koudemiddel gevulde drukhouders van een koelinstallatie die in de open lucht staat opgesteld, mogen niet
      blootgesteld zijn aan overmatige zonnestraling.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.1
  - number: 4.3.4.3.1
    text: Een afsluiter dient volgens fabrieksvoorschrift te zijn geplaatst en dient eenvoudig toegankelijk te zijn.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.3
  - number: 4.3.4.3.2
    text: Een afsluiter mag niet zijn geplaatst in een kruipruimte.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.3
  - number: 4.3.4.3.3
    text: Een afsluiter van een vloeistofniveaumeter dient gesloten te kunnen worden indien de meter niet wordt afgelezen.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.3
  - number: 4.4.1.4.4.1.1
    text: |-
      De druk die in een koelinstallatie optreedt gedurende de periode waarin de installatie in bedrijf is, gedurende
      stilstand of gedurende transport mag de maximaal toelaatbare werkdruk voor de koelinstallatie met niet meer dan
      10% overschrijden.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.1
  - number: 4.4.1.4.4.1.2
    text: Een koelinstallatie dient beveiligd te zijn met ten minste een ontlastorgaan.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.1
  - number: 4.4.1.4.4.1.3
    text: |-
      In afwijking van voorschrift 4.4.1.2 is beveiliging toegestaan met een pressostaat, indien de totale hoeveelheid
      koudemiddelvulling van de koelinstallatie kleiner is dan honderd kilogram en het aangezogen slagvolume van elke
      compressor kleiner is dan 90 m³ per uur.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.1
  - number: 4.4.1.4.4.1.4
    text: |-
      In afwijking van voorschrift 4.4.1.2 en voorschrift 4.4.1.3 is beveiliging voorts toegestaan met een pressostaat
      mits de totale hoeveelheid koudemiddelvulling van de koelinstallatie groter is dan of gelijk is aan honderd
      kilogram en de pressostaat is voorzien van een handreset en een tweede parallel met een mechanische reset. Voorts
      dient iedere compressor te zijn voorzien van een ontlastklep die afblaast naar het lagedrukgedeelte of naar een
      speciaal hiervoor bestemd vat.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.1
  - number: 4.4.1.4.4.1.5
    text: |-
      Indien het drukverhogend element van een koelinstallatie een druk kan opbouwen die de van toepassing zijnde
      maximaal toelaatbare werkdruk voor de koelinstallatie overschrijdt, dient de koelinstallatie ten minste van een
      pressostaat te zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.1
  - number: 4.4.1.4.4.1.6
    text: |-
      Voorschrift 4.4.1.5 geldt niet voor een koelinstallatie met een totale hoeveelheid koudemiddelvulling die kleiner
      is dan drie kilogram en waarbij sprake is van een van de volgende situaties:
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.1
  - number: 4.4.1.4.4.1.6.a
    text: de motor draait permanent totdat er een evenwichtstoestand in de druk is bereikt;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.1
  - number: 4.4.1.4.4.1.6.b
    text: de motor stopt bij overbelasting;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.1
  - number: 4.4.1.4.4.1.6.c
    text: |-
      de stroomtoevoer naar het drukverhogend element wordt uitgeschakeld door een thermische beveiliging bij
      overschrijding van een vooraf bepaalde temperatuur;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.1
  - number: 4.4.1.4.4.1.6.d
    text: een inwendige ontlastklep verbindt het hogedrukgedeelte met het lagedrukgedeelte;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.1
  - number: 4.4.1.4.4.1.6.e
    text: |-
      het drukverhogend element is niet in staat een druk op te wekken die hoger is dan de maximaal toelaatbare werkdruk
      voor de installatie;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.1
  - number: 4.4.1.4.4.1.6.f
    text: |-
      een thermische beveiliging schakelt het drukverhogend element uit voordat de druk hoger wordt dan de maximaal
      toelaatbare werkdruk voor de installatie.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.1
  - number: 4.4.1.4.4.1.7
    text: |-
      Er mag zich geen afsluiter bevinden tussen een pressostaat, bedoeld in 4.4.1.5 en een drukverhogend element, tenzij
      er:
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.1
  - number: 4.4.1.4.4.1.7.a
    text: een tweede pressostaat is aangebracht en de afsluiter is uitgevoerd als een wisselafsluiter,
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.1
  - number: 4.4.1.4.4.1.7.b
    text: een ontlastklep of breekplaat in de koelinstallatie is aangebracht tussen het hoge- en lagedrukgedeelte, of
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.1
  - number: 4.4.1.4.4.1.7.c
    text: |-
      een afsluiter is toegepast die in geopende stand kan worden geborgd, waarbij tevens is gewaarborgd dat de
      koelinstallatie niet in bedrijf kan worden gesteld bij een gesloten stand van deze afsluiter.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.1
  - number: 4.4.2.4.4.2.1
    text: |-
      De druk waarbij een ontlastorgaan in werking treedt, mag niet hoger zijn dan de maximaal toelaatbare werkdruk voor
      de koelinstallatie of het hierop betrekking hebbende onderdeel. Tijdens de periode waarin een ontlastorgaan in
      werking is, mag de in die periode optredende druk de maximaal toelaatbare werkdruk voor de koelinstallatie of het
      hierop betrekking hebbende onderdeel met maximaal 10% overschrijden.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.2
  - number: 4.4.2.4.4.2.2
    text: |-
      Het ontlastorgaan dient te blijven functioneren in geval van een externe mechanische beschadiging van het
      ontlastorgaan.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.2
  - number: 4.4.2.4.4.2.3
    text: |-
      Het afblazen van koudemiddel dient plaats te hebben met behulp van een ontlastklep die afblaast naar het
      lagedrukgedeelte van een koelinstallatie, tenzij het afblazen naar het lagedrukgedeelte niet leidt tot een zodanige
      drukverlaging dat de noodzaak tot afblazen naar de atmosfeer wordt opgeheven.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.2
  - number: 4.4.2.4.4.2.4
    text: |-
      Een ontlastklep dient zodanig te zijn vervaardigd dat deze niet afgesloten kan worden en dat deze ten behoeve van
      controlewerkzaamheden eenvoudig verwijderd kan worden.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.2
  - number: 4.4.2.4.4.2.5
    text: |-
      Het uitstroomoppervlak van een ontlastorgaan mag niet zijn verkleind als gevolg van afzetting van lasmateriaal
      bij verbindingen.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.2
  - number: 4.4.2.4.4.2.6
    text: |-
      Fabrieksverbindingsstukken en wisselafsluiters die zijn geplaatst voor de ontlastorganen dienen ten minste dezelfde
      nominale doorlaat te hebben als de ontlastorganen.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.2
  - number: 4.4.3.4.4.3.1
    text: |-
      Een veiligheidsklep die afblaast naar de atmosfeer, dient voorzien te zijn van een parallel geschakelde
      veiligheidsklep. Beide veiligheidskleppen dienen te zijn aangesloten op een wisselafsluiter.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.3
  - number: 4.4.3.4.4.3.2
    text: |-
      Een veiligheidsklep dient met een breekplaat beschermd te zijn tegen lekkage. De breekplaat dient stroomopwaarts te
      zijn aangebracht. In de ruimte tussen de breekplaat en de veiligheidsklep dient een voorziening te zijn aangebracht
      voor het controleren van de druk.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.3
  - number: 4.4.3.4.4.3.3
    text: |-
      In afwijking van voorschrift 4.4.3.2 is het toegestaan de breekplaat stroomafwaarts te plaatsen, indien een
      gebalanceerde veiligheidsklep wordt toegepast waarvan de werking niet beïnvloed wordt door de druk tussen klep
      en breekplaat.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.3
  - number: 4.4.3.4.4.3.4
    text: |-
      De diameter van de breekplaat voor de afblaasveiligheid dient groter of gelijk te zijn aan de toevoeropening van
      de afblaasveiligheid. De breekplaat dient zodanig te zijn aangebracht dat onderdelen van de gebroken plaat de goede
      werking van de afblaasveiligheid niet kunnen beïnvloeden en de afblaascapaciteit van de breekplaat niet kunnen
      verminderen.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.3
  - number: 4.4.3.4.4.3.5
    text: |-
      Bij een wisselafsluiter dient een van de klepopeningen volledig geopend te zijn als de andere opening is
      afgesloten.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.3
  - number: 4.4.3.4.4.3.6
    text: |-
      Een veiligheidsklep en een afblaasleiding dienen zodanig geïnstalleerd te zijn dat de vorming van condensatie, rijp
      en het ontstaan van een breuk als gevolg van atmosferische invloeden wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.3
  - number: 4.4.3.4.4.3.7
    text: |-
      Op een veiligheidsklep dient de afblaasdruk te zijn vermeld op een zodanige wijze dat deze vermelding afgelezen
      kan worden.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.3
  - number: 4.4.4.4.4.4.1
    text: |-
      Een breekplaat mag alleen worden gebruikt als beveiliging tegen interne onder- of overdruk. In alle andere gevallen
      mag een breekplaat uitsluitend in serie met een veiligheidsklep worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.4
  - number: 4.4.4.4.4.4.2
    text: Een breekplaat dient stevig in een houder te zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.4
  - number: 4.4.4.4.4.4.3
    text: |-
      Op een breekplaat dient de nominale breekdruk te zijn vermeld op een zodanige wijze dat deze vermelding afgelezen
      kan worden zonder dat de houder van de breekplaat verwijderd hoeft te worden.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.4
  - number: 4.4.5.4.4.5.1
    text: |-
      Indien een koelinstallatie een totale hoeveelheid koudemiddelvulling heeft die groter is dan of gelijk is aan drie
      kilogram, mag een smeltveiligheid niet als enig ontlastorgaan worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.5
  - number: 4.4.5.4.4.5.2
    text: |-
      Voorschrift 4.4.5.1 is niet van toepassing indien de smeltveiligheid wordt toegepast als overstort van het
      hogedrukgedeelte naar het lagedrukgedeelte van een koelinstallatie en voor dat doel geen ontlastklep kan worden
      toegepast.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.5
  - number: 4.4.6.4.4.6.1
    text: |-
      Een ontlastorgaan dient gemonteerd te zijn op of in de nabijheid van het onderdeel van de koelinstallatie dat
      erdoor beveiligd wordt. Een ontlastorgaan dient goed toegankelijk te zijn en dient boven het vloeistofniveau te
      zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.6
  - number: 4.4.6.4.4.6.2
    text: |-
      De tweede volzin van voorschrift 4.4.6.1 geldt niet voor een ontlastorgaan dat is geplaatst in een
      vloeistofleiding.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.6
  - number: 4.4.6.4.4.6.3
    text: |-
      Er mag zich geen afsluiter bevinden tussen een ontlastorgaan en het deel van de koelinstallatie dat erdoor
      beveiligd wordt, anders dan een wisselafsluiter of een afsluiter die in geopende stand geborgd kan worden. Indien
      een geborgde afsluiter wordt toegepast, dient te zijn gewaarborgd dat de koelinstallatie niet in bedrijf kan worden
      gesteld bij een gesloten stand van deze afsluiter.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.6
  - number: 4.4.6.4.4.6.4
    text: |-
      Indien een ontlastorgaan afblaast naar het lagedrukgedeelte van een koelinstallatie dient deze ontlastklep zo min
      mogelijk beïnvloed te worden door tegendruk.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.6
  - number: 4.4.7.4.4.7.1
    text: Twee of meer parallel geplaatste ontlastorganen dienen beschouwd te worden als een ontlastorgaan.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.7
  - number: 4.4.7.4.4.7.2
    text: |-
      Indien twee ontlastorganen worden toegepast, voorafgegaan door een wisselafsluiter, dient elk ontlastorgaan over
      voldoende capaciteit te beschikken om de koelinstallatie te beveiligen.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.7
  - number: 4.4.7.4.4.7.3
    text: |-
      Ontlastorganen ten behoeve van drukvaten dienen afmetingen te hebben die gebaseerd zijn op de hoogst mogelijke
      warmtetoevoer volgens de eisen die zijn vastgelegd in deel 7 van DIN-norm 8975.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.7
  - number: 4.4.8.4.4.8.1
    text: |-
      Indien een afblaasleiding wordt gebruikt voor verschillende ontlastorganen, dient de drukval in de leiding berekend
      te zijn op basis van de laagste druk waarbij een ontlastorgaan in werking kan treden en de druk die optreedt
      tijdens het gelijktijdig afblazen van alle aangesloten ontlastorganen.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.8
  - number: 4.4.8.4.4.8.2
    text: |-
      Indien een leiding wordt gebruikt als bedoeld in voorschrift 4.4.8.1 worden de ontlastorganen als een enkele
      veiligheid beschouwd.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.8
  - number: 4.4.8.4.4.8.3
    text: |-
      De aansluitingen van de afblaasleiding van ontlastorganen dienen zodanig te zijn uitgevoerd dat het mogelijk is om
      de afdichting van de ontlastorganen afzonderlijk te testen. 4.4.8.4 Ontluchtingsapparatuur dient zodanig te zijn
      uitgevoerd dat het uitgestoten gas niet meer dan 20% koudemiddel bevat. Automatische ontluchtingsapparatuur dient
      te zijn voorzien van voorzieningen om de bedrijfstijd te registreren.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.8
  - number: 4.4.9.4.4.9.1
    text: |-
      Een koelinstallatie waarvan onderdelen door bevriezing beschadigd kunnen worden, dient te zijn voorzien van een
      beveiliging tegen een te lage temperatuur of van een lagedrukbeveiliging.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.9
  - number: 4.4.9.4.4.9.2
    text: |-
      Hogedruk- en temperatuurbegrenzers die dienen ter beveiliging van koelinstallaties met een totale hoeveelheid
      koudemiddelvulling die groter is dan of gelijk is aan dertig kilogram, dienen handmatig gereset te kunnen worden.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.9
  - number: 4.4.10.4.4.10.1
    text: |-
      In een koelinstallatie met een totale hoeveelheid koudemiddelvulling die groter is dan of gelijk is aan tien
      kilogram, dient de totale hoeveelheid koudemiddelvulling verzameld te kunnen worden in een of meer afsluitbare
      gedeelten van de koelinstallatie.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.10
  - number: 4.4.10.4.4.10.2
    text: |-
      Op een koelinstallatie met een totale hoeveelheid koudemiddelvulling die groter is dan of gelijk is aan tien
      kilogram, dienen ten minste twee afsluiters op zodanige wijze te zijn gemonteerd dat het hoge- en lagedrukgedeelte
      van elkaar gescheiden kunnen worden.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.10
  - number: 4.4.10.4.4.10.3
    text: |-
      De voorschriften 4.4.10.1 en 4.4.10.2 zijn niet van toepassing indien de totale hoeveelheid koudemiddelvulling door
      middel van een separate afpompunit verzameld kan worden in een permanent bij de koelinstallatie aanwezige separate
      cilinder of een separaat vat. Bij meerdere in een ruimte aanwezige koelinstallaties mag gebruik worden gemaakt van
      een enkele permanent in die ruimte aanwezige separate cilinder of een enkel separaat vat, indien de inhoud van de
      cilinder of het vat is gebaseerd op de grootste koudemiddelvulling van een van de aanwezige koelinstallaties en
      niet voor verschillende koudemiddelen wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.10
  - number: 4.4.10.4.4.10.4
    text: |-
      Een koelinstallatie met een totale hoeveelheid koudemiddelvulling die groter is dan of gelijk is aan duizend
      kilogram, dient te zijn voorzien van inblokafsluiters. De locatie en het aantal van deze inblokafsluiters dienen
      zodanig te worden gekozen dat het koudemiddelverlies ten gevolge van lekkages en reparaties tot een minimum kan
      worden beperkt.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.10
  - number: 4.4.10.4.4.10.5
    text: |-
      Een koelinstallatie met een totale hoeveelheid koudemiddelvulling die groter is dan of gelijk is aan drie kilogram,
      dient ten minste voorzien te zijn van twee afsluiters of schräderventielen, waarvan er een is geplaatst op het
      hoge- en een op het lagedrukgedeelte van de koelinstallatie, ten behoeve van het afvoeren van koudemiddel door
      middel van een externe afzuigpomp zonder dat dit leidt tot verlies van koudemiddel.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.10
  - number: 4.4.10.4.4.10.6
    text: |-
      Alvorens onderhouds- of installatiewerkzaamheden aan een koelinstallatie worden verricht, dient de druk in het
      gedeelte van de koelinstallatie waaraan de werkzaamheden worden verricht, gebracht te worden op 1,05 bar (absoluut)
      of lager.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.10
  - number: 4.4.10.4.4.10.7
    text: 'Alvorens een koelinstallatie wordt ontmanteld, dient de druk te worden gebracht op:'
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.10
  - number: 4.4.10.4.4.10.7.a
    text: 0,6 bar (absoluut) of lager voor koelinstallaties met een totale systeeminhoud die kleiner is dan 0,2 m³;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.10
  - number: 4.4.10.4.4.10.7.b
    text: |-
      0,3 bar (absoluut) of lager voor koelinstallaties met een totale systeeminhoud die groter is dan of gelijk is aan
      0,2 m³.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.10
  - number: 4.4.11.4.4.11.1
    text: |-
      De elektrische installatie van een koelinstallatie dient in overeenstemming met NEN 1010 en met de voorschriften
      van de plaatselijke elektriciteitsmaatschappij te worden geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.11
  - number: 4.4.11.4.4.11.2
    text: |-
      De elektrische krachtstroomvoorziening voor het gedeelte van een koelinstallatie dat koudemiddel bevat, dient
      zodanig te zijn aangelegd dat deze onafhankelijk van de elektrische voorzieningen voor andere gedeelten van de
      koelinstallatie kan worden uitgeschakeld.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.11
  - number: 4.4.11.4.4.11.3
    text: |-
      Alarmapparatuur en lekdetectie-apparatuur dienen op een van de hoofdbron onafhankelijk werkende spanningsbron te
      zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel4.4.11
  - number: 6.1.6.1.1
    text: |-
      De beheerder van een koelinstallatie dient zorg te dragen voor een zodanig beheer van deze installatie dat verlies
      van koudemiddel voorkomen wordt.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.1
  - number: 6.1.6.1.2
    text: |-
      De beheerder van een koelinstallatie dient zorg te dragen voor de controle en het onderhoud van een
      koelinstallatie.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.1
  - number: 6.1.6.1.3
    text: |-
      De beheerder van een koelinstallatie met een totale hoeveelheid koudemiddelvulling die groter is dan of gelijk
      is aan drie kilogram, dient deze installatie ten minste eenmaal in de twaalf maanden te laten controleren en
      onderhouden door een persoon die beschikt over een erkenningsbewijs als bedoeld in artikel 13, eerste lid, van het
      Besluit inzake stoffen die de ozonlaag aantasten, of door een persoon die in dienst is van een onderneming die over
      een zodanig erkenningsbewijs beschikt.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.1
  - number: 6.1.6.1.4
    text: 'De in voorschrift 6.1.3 bedoelde controle dient betrekking te hebben op:'
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.1
  - number: 6.1.6.1.4.a
    text: de lekkage van koudemiddel;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.1
  - number: 6.1.6.1.4.b
    text: de aanwezigheid van corrosie;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.1
  - number: 6.1.6.1.4.c
    text: de lekdichtheid van leidingverbindingen.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.1
  - number: 6.1.6.1.5
    text: |-
      Een koelinstallatie met een totale hoeveelheid koudemiddelvulling die groter is dan of gelijk is aan duizend
      kilogram dient onder voortdurend toezicht te staan.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.1
  - number: 6.1.6.1.6
    text: |-
      In afwijking van voorschrift 6.1.5 is periodiek toezicht toegestaan indien de beheerder er zorg voor gedragen heeft
      dat de koelinstallatie is voorzien van een automatisch controle- en alarmeringssysteem waardoor in geval van een
      storing een alarm in werking wordt gesteld in een bemande meldkamer.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.1
  - number: 6.1.6.1.7
    text: |-
      Indien een defect wordt geconstateerd waardoor verlies van koudemiddel kan optreden, dient de installatie
      onmiddellijk buiten werking gesteld te worden. De installatie mag pas weer in werking worden gesteld nadat het
      defect is verholpen en een installatiecontrole als bedoeld in paragraaf 7 is uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.1
  - number: 6.1.6.1.8
    text: Lekkage van koudemiddel en andere defecten dienen onverwijld te worden verholpen.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.1
  - number: 6.1.6.1.9
    text: |-
      Een koelinstallatie waaruit door lekkage of andersoortige defecten koudemiddel is ontsnapt, mag niet met
      koudemiddel worden bijgevuld voordat de lekkage of het defect is verholpen.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.1
  - number: 6.2.6.2.1
    text: |-
      De beheerder van een koelinstallatie met een totale hoeveelheid koudemiddelvulling die groter is dan of gelijk
      is aan drie kilogram beschikt over een installatiegebonden logboek dat zich bevindt in de nabijheid van de
      koelinstallatie; dit voorschrift geldt niet voor de beheerder van een koelinstallatie die is geplaatst in een
      container die bestemd is voor internationaal transport per zeeschip.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.2
  - number: 6.2.6.2.2
    text: |-
      In afwijking van voorschrift 6.2.1 is het toegestaan dat bij een mobiele koelinstallatie het logboek zich op een
      centrale plaats bij de beheerder van die koelinstallatie bevindt, waar het direct opvraagbaar is, indien zich bij
      de koelinstallatie een afschrift van een deel van het logboek bevindt, dat is afgegeven door het bedrijf dat de in
      paragraaf 6.4 bedoelde werkzaamheden aan de koelinstallatie heeft verricht. Op dit afschrift uit het logboek dienen
      de volgende gegevens te zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.2
  - number: 6.2.6.2.2.a
    text: de datum waarop het afschrift is afgegeven;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.2
  - number: 6.2.6.2.2.b
    text: |-
      de naam, het adres en het telefoonnummer van de beheerder van de koelinstallatie die het volledige logboek onder
      zijn beheer heeft op een centrale plaats;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.2
  - number: 6.2.6.2.2.c
    text: de feitelijke koudemiddelinhoud en het type koudemiddel dat in de koelinstallatie wordt toegepast;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.2
  - number: 6.2.6.2.2.d
    text: |-
      de datum waarop onderhouds- of installatiewerkzaamheden aan de koelinstallatie zijn uitgevoerd en de naam, het
      adres en het telefoonnummer van het bedrijf dat deze werkzaamheden heeft uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.2
  - number: 6.2.6.2.2.e
    text: |-
      een overzicht van de hoeveelheid koudemiddel waarmee de koelinstallatie is bijgevuld over een periode van
      vierentwintig maanden, voorafgaand aan de datum waarop voor het laatst onderhouds- of installatiewerkzaamheden aan
      de koelinstallatie zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.2
  - number: 6.2.6.2.3
    text: |-
      De beheerder van een koelinstallatie, bedoeld in voorschrift 6.2.1 en 6.2.2, dient ervoor zorg te dragen dat in het
      installatiegebonden logboek, onder vermelding van datum en tijdstip, worden bijgehouden: a.de aard van controle-,
      onderhouds-, herstel- en installatiewerkzaamheden die aan een koelinstallatie worden verricht;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.2
  - number: 6.2.6.2.3.a
    text: |-
      de aard van controle-, onderhouds-, herstel- en installatiewerkzaamheden die aan een koelinstallatie worden
      verricht;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.2
  - number: 6.2.6.2.3.b
    text: de storingen en alarmeringen met betrekking tot een koelinstallatie;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.2
  - number: 6.2.6.2.3.c
    text: de hoeveelheid en de soort koudemiddel die aan een koelinstallatie wordt toegevoegd;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.2
  - number: 6.2.6.2.3.d
    text: de hoeveelheid en de soort koudemiddel die uit een koelinstallatie wordt afgetapt;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.2
  - number: 6.2.6.2.3.e
    text: de resultaten van uitgevoerde lekdetecties;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.2
  - number: 6.2.6.2.3.f
    text: |-
      de persoon die werkzaamheden heeft verricht als genoemd onder a tot en met e en, indien van toepassing, de naam van
      de onderneming waarbij die persoon in dienst is;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.2
  - number: 6.2.6.2.3.g
    text: |-
      een waarmerk dat is afgegeven door de onder f bedoelde persoon met betrekking tot de door hem verrichte
      handelingen;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.2
  - number: 6.2.6.2.3.h
    text: de hoeveelheid koudemiddel die in de koelinstallatie aanwezig is voor de normale werking van de installatie.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.2
  - number: 6.3.6.3.1
    text: |-
      De beheerder van een koelinstallatie draagt er zorg voor dat ten minste eenmaal in de zes maanden de gasdetectie-
      apparatuur ten behoeve van het opsporen van koudemiddellekkage in een machinekamer op meetnauwkeurigheid
      en alarmniveau wordt gecontroleerd. Deze controle wordt uitgevoerd door de fabrikant, de leverancier of de
      installateur van de apparatuur of door een gespecialiseerd ijk- of controle-instituut.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.3
  - number: 6.3.6.3.2
    text: |-
      De resultaten van de controle van detectie-apparatuur, bedoeld in voorschrift 6.3.1, dienen in het
      installatiegebonden logboek, bedoeld in voorschrift 6.2.1, te worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.3
  - number: 6.4.6.4.1
    text: |-
      Een koelinstallatie met een totale hoeveelheid koudemiddelvulling die groter is dan of gelijk is aan drie
      kilogram, dient ten minste eenmaal in de twaalf maanden te worden gecontroleerd op het correct functioneren van
      de installatie en uit een oogpunt van preventie te worden gecontroleerd op mogelijke oorzaken van lekkage van
      koudemiddel.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.4
  - number: 6.4.6.4.2
    text: |-
      Indien een koelinstallatie een totale hoeveelheid koudemiddelvulling heeft die groter is dan of gelijk is aan
      dertig kilogram, dient de koelinstallatie ten minste eenmaal in de drie maanden te worden gecontroleerd op het
      correct functioneren van de installatie en uit een oogpunt van preventie te worden gecontroleerd op of mogelijke
      oorzaken van lekkage van koudemiddel. Een van deze controles die gedurende een periode van twaalf maanden
      plaatsvindt, valt samen met de controle, bedoeld in voorschrift 6.1.3.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.4
  - number: 6.4.6.4.3
    text: |-
      Indien een koelinstallatie een totale hoeveelheid koudemiddelvulling heeft die groter is dan of gelijk is aan
      driehonderd kilogram, dient de koelinstallatie ten minste eenmaal per kalendermaand te worden gecontroleerd op
      het correct functioneren van de installatie en uit een oogpunt van preventie te worden gecontroleerd op mogelijke
      oorzaken van lekkage van koudemiddel.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.4
  - number: 6.4.6.4.4
    text: |-
      In afwijking van voorschrift 6.4.3 mag een koelinstallatie die tijdelijk buiten bedrijf wordt gesteld en waarvan
      de totale koudemiddelinhoud wordt verzameld in een vloeistofvat of een condensor gedurende de periode waarin de
      installatie buiten bedrijf wordt gesteld eenmaal in de drie maanden worden gecontroleerd op koudemiddellekkage.
      In afwijking van voorschrift 6.4.2 mag een koelinstallatie die tijdelijk buiten bedrijf wordt gesteld en waarvan
      de totale koudemiddelinhoud wordt verzameld in een vloeistofvat of een condensor gedurende de periode waarin de
      installatie buiten bedrijf wordt gesteld eenmaal in de twaalf maanden worden gecontroleerd op koudemiddellekkage.
      In beide gevallen wordt door verzegeling van het vloeistofvat of de condensor te gewaarborgd dat de
      koelinstallatie tijdens deze periode niet in bedrijf wordt gesteld. Na het verbreken van de verzegeling wordt een
      installatiecontrole als bedoeld in voorschrift 7.1.2 uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.4
  - number: 6.4.6.4.5
    text: |-
      Bij een koelinstallatie met onderdelen die functioneren bij een druk beneden de atmosferische druk, kan in
      aanvulling op de voorschriften 6.4.1 tot en met 6.4.4 additionele controle op lekkage plaatsvinden door middel
      van het registreren van de automatische ontluchtingstijd van de installatie. Toename van de ontluchtingstijd ten
      opzichte van de normale ontluchtingstijd geeft een indicatie van de aanwezigheid van een of meerdere lekkages.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.4
  - number: 6.4.6.4.6
    text: |-
      Indien bij de in de voorschriften 6.4.1 tot en met 6.4.4 genoemde controle het vermoeden van lekkage bestaat, dient
      deze controle plaats te vinden met behulp van lekdetectie-apparatuur met een detectiegrens van ten minste 5 p.p.m.
      Deze controle dient te worden uitgevoerd bij de voor een lekkagetest voorgechreven druk, overeenkomstig tabel 2 bij
      voorschrift 3.5.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.4
  - number: 6.4.6.4.7
    text: |-
      De periodieke controle als bedoeld in de voorschriften 6.4.1 tot en met 6.4.4, dient te worden uitgevoerd door
      een persoon die beschikt over een erkenningsbewijs als bedoeld in artikel 13, eerste lid, van het Besluit inzake
      stoffen die de ozonlaag aantasten, of door een persoon die in dienst is van een onderneming die over een zodanig
      erkenningsbewijs beschikt.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.4
  - number: 6.4.6.4.8
    text: |-
      De beheerder van een koelinstallatie draagt er zorg voor dat de resultaten van de in de voorschriften 6.4.1 tot en
      met 6.4.4 genoemde controles in het installatiegebonden logboek, genoemd in voorschrift 6.2.1, worden geregistreerd
      en gewaarmerkt conform voorschrift 6.2.3, onderdeel g, door degene die de controle heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.4
  - number: 6.5.6.5.1
    text: |-
      Indien een koelinstallatie is geïnstalleerd of voor het eerst voor gebruik ter beschikking is gesteld na de datum
      van inwerkingtreding van de regeling waar deze bijlage bij behoort, dient op de installatie een kenplaat te zijn
      bevestigd waarop is vermeld:
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.5
  - number: 6.5.6.5.1.a
    text: de naam van de leverancier of installateur;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.5
  - number: 6.5.6.5.1.b
    text: het type koelinstallatie;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.5
  - number: 6.5.6.5.1.c
    text: een identificatienummer;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.5
  - number: 6.5.6.5.1.d
    text: |-
      de feitelijke hoeveelheid koudemiddel, die in de koelinstallatie aanwezig is voor de normale werking van de
      installatie;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.5
  - number: 6.5.6.5.1.e
    text: |-
      de datum waarop de installatiecontrole, bedoeld in paragraaf 7, is uitgevoerd, dan wel voor mobiele
      koelinstallaties waarvan de koudemiddelinhoud kleiner is dan drie kilogram, de datum waarop deze koelinstallatie
      voor het eerst voor gebruik ter beschikking is gesteld;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.5
  - number: 6.5.6.5.1.f
    text: het in de koelinstallatie aanwezige type koudemiddel.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.5
  - number: 6.5.6.5.2
    text: |-
      In afwijking van voorschrift 6.5.1 mogen bij een mobiele koelinstallatie met een koudemiddelinhoud die kleiner is
      dan drie kilogram, die in een voertuig is ingebouwd, de in dat voorschrift genoemde gegevens worden vermeld in een
      bij de koelinstallatie te leveren certificaat waarop het identificatienummer van de koelinstallatie is vervangen
      door het chassisnummer van het voertuig waarin de koelinstallatie is geplaatst.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.5
  - number: 6.5.6.5.3
    text: |-
      Indien een koelinstallatie of de daarvoor in aanmerking komende onderdelen ingevolge voorschrift 5.1 in een
      machinekamer is respectievelijk zijn geplaatst, dan is op de deur van deze machinekamer een kenplaat aangebracht
      waarop duidelijk leesbaar het type koudemiddel en de totale hoeveelheid koudemiddelvulling van de koelinstallatie
      zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.5
  - number: 6.5.6.5.4
    text: |-
      Indien in een machinekamer meerdere koelinstallaties zijn geïnstalleerd, dient op de deur van de machinekamer voor
      elke koelinstallatie het type koudemiddel en de totale hoeveelheid koudemiddelvulling van de koelinstallatie te
      worden vermeld.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.5
  - number: 6.5.6.5.5
    text: |-
      De beheerder dient bij een koelinstallatie op een goed toegankelijke plaats een instructiekaart beschikbaar te
      hebben. Deze instructiekaart dient ten minste te vermelden:
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.5
  - number: 6.5.6.5.5.a
    text: de naam, het adres en het telefoonnummer van de installateur en van de onderhoudsdienst;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.5
  - number: 6.5.6.5.5.b
    text: het type koudemiddel;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.5
  - number: 6.5.6.5.5.c
    text: |-
      de feitelijke hoeveelheid koudemiddel die in de koelinstallatie aanwezig is voor de normale werking van de
      installatie;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.5
  - number: 6.5.6.5.5.d
    text: instructies over de wijze waarop een koelinstallatie in of buiten bedrijf kan worden gesteld;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.5
  - number: 6.5.6.5.5.e
    text: instructies over de wijze waarop de koelinstallatie in geval van nood buiten bedrijf kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.5
  - number: 6.5.6.5.6
    text: |-
      In afwijking van voorschrift 6.5.5 mogen bij een mobiele koelinstallatie met een koudemiddelinhoud die kleiner is
      dan drie kilogram, die in een voertuig is ingebouwd, de in dat voorschrift genoemde gegevens verwerkt zijn in een
      bij de installatie behorend instructieboekje of bedieningsvoorschrift, dat zich samen met het in voorschrift 6.5.2
      genoemde certificaat bevindt op een goed toegankelijke plaats in het voertuig.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.5
  - number: 6.5.6.5.7
    text: |-
      In afwijking van voorschrift 6.5.5 mag voorts volstaan worden met een gemeenschappelijke instructiekaart
      indien er meerdere koelinstallaties met hetzelfde type koudemiddel aanwezig zijn, mits de totale hoeveelheid
      koudemiddelvulling voor de verschillende koelinstallaties afzonderlijk is vermeld.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.5
  - number: 6.5.6.5.8
    text: |-
      Indien een koelinstallatie een totale hoeveelheid koudemiddelvulling heeft die groter is dan of gelijk is
      aan dertig kilogram, dient een stroomschema bij de koelinstallatie aanwezig te zijn waarop de afsluiters zijn
      aangegeven die noodzakelijk zijn voor de werking en het onderhoud van de installatie.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.5
  - number: 6.5.6.5.9
    text: Voorschrift 6.5.8 is van overeenkomstige toepassing op koelinstallaties met twee of meer verdampers.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.5
  - number: 6.6.6.6.1
    text: |-
      Bij een koelinstallatie met een totale hoeveelheid koudemiddelvulling die groter is dan of gelijk is aan
      driehonderd kilogram, dienen bedieningsvoorschriften aanwezig te zijn die de volgende gegevens bevatten:
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.6
  - number: 6.6.6.6.1.a
    text: de functie van de koelinstallatie;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.6
  - number: 6.6.6.6.1.b
    text: |-
      een beschrijving van de apparaten en onderdelen van de installatie met een stroomschema voor het koudemiddel en een
      schema van het elektrische circuit;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.6
  - number: 6.6.6.6.1.c
    text: de naam, het adres en het telefoonnummer van de fabrikant of de installateur;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.6
  - number: 6.6.6.6.1.d
    text: de naam, het adres en het telefoonnummer van de storingsdienst;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.6
  - number: 6.6.6.6.1.e
    text: het type koudemiddel en de totale hoeveelheid koudemiddelvulling;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.6
  - number: 6.6.6.6.1.f
    text: de hoogst toelaatbare druk;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.6
  - number: 6.6.6.6.1.g
    text: instructies over de wijze waarop een koelinstallatie in of buiten bedrijf kan worden gesteld;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.6
  - number: 6.6.6.6.1.h
    text: |-
      instructies voor het verdelen van de totale hoeveelheid koudemiddelvulling over een of meerdere gedeelten van de
      koelinstallatie;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.6
  - number: 6.6.6.6.1.i
    text: |-
      een beschrijving van mogelijke storingen, van de oorzaken van deze storingen en van de maatregelen waarmee deze
      storingen kunnen worden verholpen.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.6
  - number: 6.6.6.6.2
    text: |-
      In aanvulling op voorschrift 6.6.1 dienen bij een koelinstallatie met een totale hoeveelheid koudemiddelvulling
      die groter is dan of gelijk is aan duizend kilogram, tevens de volgende gegevens in de bedieningsvoorschriften te
      zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.6
  - number: 6.6.6.6.2.a
    text: aanwijzingen voor het bedienen van lekdetectie-apparatuur;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.6
  - number: 6.6.6.6.2.b
    text: |-
      instructies voor het bedienen van de koudemiddelpomp of de zuigcompressor met het oog op het afvoeren van het
      koudemiddel;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.6
  - number: 6.6.6.6.2.c
    text: de te nemen maatregelen bij verlies van koudemiddel;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.6
  - number: 6.6.6.6.2.d
    text: aanwijzingen voor de bediening van het noodventilatiesysteem.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel6.6
  - number: 7.1.7.1.1
    text: |-
      Indien een nieuwe koelinstallatie in bedrijf wordt gesteld, of aan een koelinstallatie veranderingen zijn
      aangebracht, is een installatiecontrole vereist waarbij de volgende, in willekeurige volgorde vermelde, controles
      worden uitgevoerd:
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.1.a
    text: controle op de aanwezigheid van de bij de installatie vereiste documenten;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.1.b
    text: controle van de voor de installatie vereiste apparatuur voor drukbeveiliging, overeenkomstig paragraaf 7.2;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.1.c
    text: controle van de lekdichtheid van de koelinstallatie, overeenkomstig paragraaf 7.3;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.1.d
    text: drukbeproeving overeenkomstig paragraaf 7.4;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.1.e
    text: vacumeren en vullen van een koelinstallatie overeenkomstig paragraaf 7.5.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.2
    text: |-
      Indien een lekkage of een defect als bedoeld in voorschrift 6.1.7 is verholpen, of een onderdeel is vervangen, is
      een beperkte installatiecontrole vereist, waarbij de volgende, in willekeurige volgorde vermelde, controles worden
      uitgevoerd:
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.2.a
    text: controle op de aanwezigheid van de bij de installatie vereiste documenten;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.2.b
    text: controle van de voor de installatie vereiste apparatuur voor drukbeveiliging, overeenkomstig paragraaf 7.2;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.2.c
    text: controle van de lekdichtheid van de koelinstallatie, overeenkomstig voorschrift 7.3.2 en 7.3.3.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.3
    text: |-
      Degene die een installatiecontrole heeft uitgevoerd aan een koelinstallatie als bedoeld in voorschrift 7.1.1 of
      7.1.2, dient de uitkomsten van die controle schriftelijk en gewaarmerkt te registreren in het installatiegebonden
      logboek, genoemd in voorschrift 6.2.1 en 6.2.2.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.4
    text: 'De in voorschrift 7.1.3 bedoelde registratie dient de volgende gegevens te omvatten:'
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.4.a
    text: de naam van de leverancier of installateur;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.4.b
    text: de datum van de controle;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.4.c
    text: de naam van de controleur;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.4.d
    text: het type koelinstallatie;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.4.e
    text: het type koudemiddel;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.4.f
    text: de totale hoeveelheid koudemiddelvulling;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.4.g
    text: de hoogste en de laagste temperatuur en druk;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.4.h
    text: de afblaasdruk van de gemonteerde ontlastorganen;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.4.i
    text: een verklaring van lekdichtheid van de koelinstallatie;
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.4.j
    text: een verklaring van drukbeproeving en
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.4.k
    text: een verklaring van vacumeren en vullen, bedoeld in voorschrift 7.5.5.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.5
    text: |-
      In afwijking van voorschrift 7.1.1 tot en met 7.1.4 mag voor een fabrieksmatig voorgevulde koelinstallatie
      met een koudemiddelinhoud die kleiner is dan drie kilogram en die voor het eerst voor gebruik ter beschikking
      wordt gesteld, worden volstaan met een voor dat type koelinstallatie door de fabrikant of importeur afgegeven
      conformiteitsverklaring, waaruit blijkt dat de koelinstallatie voldoet aan de voorschriften die in deze bijlage
      zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.1.7.1.6
    text: |-
      Een installatiecontrole als bedoeld in voorschrift 7.1.1 en 7.1.2 dient te worden uitgevoerd door een persoon die
      beschikt over een erkenningsbewijs als bedoeld in artikel 13, eerste lid, van het Besluit inzake stoffen die de
      ozonlaag aantasten, of door een persoon die in dienst is van een onderneming die over een zodanig erkenningsbewijs
      beschikt.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.1
  - number: 7.2.7.2.1
    text: |-
      Tijdens de installatiecontrole dient vastgesteld te worden of de drukbeveiliging van de koelinstallatie is
      geïnstalleerd en functioneert overeenkomstig de voorschriften die zijn opgenomen in paragraaf 4.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.2
  - number: 7.2.7.2.2
    text: |-
      Een veiligheidsklep en een externe ontlastklep dienen te worden gecontroleerd op de juistheid van de op het label
      van de klep vermelde afblaasdruk.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.2
  - number: 7.2.7.2.3
    text: Een breekplaat dient te worden gecontroleerd op de juistheid van de op de breekplaat vermelde nominale breekdruk.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.2
  - number: 7.3.7.3.1
    text: |-
      Tijdens de installatiecontrole, bedoeld in voorschrift 7.1.1, dient de lekdichtheid van de koelinstallatie te
      worden gecontroleerd in combinatie met de drukbeproeving, bedoeld in paragraaf 7.4.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.3
  - number: 7.3.7.3.2
    text: |-
      Bij de installatiecontrole, bedoeld in voorschrift 7.1.1 en voorschrift 7.1.2 dient, nadat de koelinstallatie
      in werking is gesteld, de gehele installatie op lekdichtheid gecontroleerd te worden met behulp van lekdetectie-
      apparatuur waarvan de detectiegrens ten minste 5 p.p.m. bedraagt. Deze controle dient te worden uitgevoerd bij een
      zo hoog mogelijke druk, overeenkomstig tabel 2 bij voorschrift 3.5. Tevens dient hierbij de installatie te worden
      gecontroleerd op het correct functioneren van de installatie. Deze controle wordt beschouwd als een controle als
      bedoeld in paragraaf 6.4.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.3
  - number: 7.3.7.3.3
    text: |-
      Van de gevolgde procedure bij het controleren van de lekdichtheid en de resultaten daarvan dient een schriftelijk
      bewijs aan de beheerder van de koelinstallatie te worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.3
  - number: 7.4.7.4.1
    text: |-
      Het onder druk beproeven van een koelinstallatie dient te worden uitgevoerd bij een afpersdruk overeenkomstig tabel
      2 bij voorschrift 3.5. Deze drukbeproeving mag per deel van de installatie afzonderlijk worden uitgevoerd, mits
      alle onderdelen en verbindingen worden beproefd.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.4
  - number: 7.4.7.4.2
    text: |-
      In afwijking van voorschrift 7.4.1 mag het onder druk beproeven van een koelinstallatie, waarvan het
      lagedrukgedeelte niet gescheiden kan worden van het hogedrukgedeelte, worden uitgevoerd bij een beproevingsdruk
      die gelijk is aan de maximaal toelaatbare werkdruk voor het lagedrukgedeelte, mits de onderdelen van het
      hogedrukgedeelte vooraf beproefd zijn bij een afpersdruk overeenkomstig tabel 2 bij voorschrift 3.5.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.4
  - number: 7.4.7.4.3
    text: |-
      In afwijking van voorschrift 7.4.1 mag bij een koelinstallatie die bestaat uit meerdere voorgevulde delen die
      zijn verbonden door koppelingen, worden volstaan met het onder druk beproeven van deze afzonderlijke delen. Indien
      snelkoppelingen worden toegepast behoeven deze niet apart onder druk te worden beproefd.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.4
  - number: 7.4.7.4.4
    text: |-
      Indien tijdens een drukbeproeving een lekkage of vervorming is opgetreden, wordt de lekkage gerepareerd en wordt de
      drukbeproeving opnieuw uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.4
  - number: 7.4.7.4.5
    text: |-
      Het voor de eerste maal onder druk beproeven van een koelinstallatie of een onderdeel hiervan, alsmede het onder
      druk beproeven van een onderdeel van, of een verbinding in een koelinstallatie na de reparatie van een lek in dat
      onderdeel of die verbinding, mag niet worden uitgevoerd met een koudemiddel.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.4
  - number: 7.4.7.4.6
    text: Verbindingen dienen tijdens een drukbeproeving toegankelijk te zijn voor controle.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.4
  - number: 7.4.7.4.7
    text: |-
      Tijdens de drukbeproeving dient de installatie of het betreffende onderdeel van de installatie gedurende een
      zodanige tijd onder de afpersdruk te worden gehouden, dat de lekdichtheid van de installatie of het onderdeel
      gecontroleerd kan worden.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.4
  - number: 7.4.7.4.8
    text: |-
      Van de uitgevoerde drukbeproeving dient een schriftelijk bewijs aan de beheerder van de koelinstallatie te worden
      afgegeven. In dit bewijs is aangegeven welke beproevingsdrukken zijn gehanteerd en op welke wijze tijdens de
      drukbeproeving de lekdichtheid is gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.4
  - number: 7.5.7.5.1
    text: |-
      Een koelinstallatie met een totale hoeveelheid koudemiddelvulling die kleiner is dan tien kilogram dient na de
      drukbeproeving op een absolute druk kleiner dan 270 Pa te worden gebracht, waarna, met stilstaande vacuümpomp,
      de bereikte druk gehandhaafd dient te kunnen blijven gedurende minimaal een half uur. Vervolgens kan de
      koelinstallatie worden gevuld met het koudemiddel dat in de koelinstallatie wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.5
  - number: 7.5.7.5.2
    text: |-
      Een koelinstallatie met een totale hoeveelheid koudemiddelvulling die groter is dan of gelijk is aan tien
      kilogram en kleiner is dan tweehonderd kilogram, dient na de drukbeproeving op een absolute druk kleiner dan
      270 Pa te worden gebracht, waarna het vacuüm direct kan worden gebroken met droge stikstof. Vervolgens dient de
      koelinstallatie nogmaals op een absolute druk kleiner dan 270 Pa te worden gebracht, waarna, met een stilstaande
      vacuümpomp, de bereikte druk gehandhaafd dient te kunnen blijven gedurende minimaal een uur. Vervolgens kan de
      koelinstallatie worden gevuld met het koudemiddel dat in de koelinstallatie wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.5
  - number: 7.5.7.5.3
    text: |-
      Een koelinstallatie met een totale hoeveelheid koudemiddelvulling die groter is dan of gelijk is aan tweehonderd
      kilogram, dient na de drukbeproeving op een absolute druk kleiner dan 270 Pa te worden gebracht, waarna het vacuüm
      direct kan worden gebroken met droge stikstof. Vervolgens dient de koelinstallatie nogmaals op een absolute druk
      kleiner dan 270 Pa te worden gebracht, waarna het vacuüm direct kan worden gebroken met droge stikstof. Vervolgens
      dient de koelinstallatie voor een derde maal op een absolute druk, kleiner dan 270 Pa, te worden gebracht, waarna
      met een stilstaande vacuümpomp de bereikte druk gehandhaafd dient te kunnen blijven gedurende minimaal twee uur.
      Vervolgens kan de koelinstallatie worden gevuld met het koudemiddel dat in de koelinstallatie wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.5
  - number: 7.5.7.5.4
    text: |-
      In afwijking van de voorschriften 7.5.1 tot en met 7.5.3 mag bij voorgevulde delen van een koelinstallatie worden
      volstaan met het vacumeren en vullen van deze afzonderlijke delen, waarbij de hoeveelheid koudemiddelvulling van
      ieder deel bepalend is voor de vraag welke van de voorschriften 7.5.1 tot en met 7.5.3 van toepassing is.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.5
  - number: 7.5.7.5.5
    text: |-
      Van de gevolgde procedure bij het vacumeren en vullen van de koelinstallatie dient een schriftelijk bewijs aan de
      beheerder van de koelinstallatie te worden afgegeven. In dit bewijs is aangegeven welke drukken gedurende welke
      tijdsduur zijn gehanteerd.
    url: https://wetten.overheid.nl/BWBR0008743/2008-06-01#Artikel7.5
