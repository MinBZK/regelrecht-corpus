  - number: '20'
    text: |-
      1 De afdelingshoofden van de in het Organisatiebesluit Directoraten-Generaal Belastingdienst, Toeslagen en
      Douane 2021 genoemde afdelingen en hun plaatsvervangers kunnen het aan hen door de overige directeur verleende
      ondermandaat, doormandateren aan onder hen ressorterende teamleiders of daarmee gelijk te stellen leidinggevende
      functies, die daartoe worden doorgemandateerd in het mandaatregister.

      2 Aan de in het eerste lid ondergemandateerde functionarissen is, na afstemming met de overige directeur,
      voorbehouden het afdoen en ondertekenen van beslissingen met betrekking tot het aangaan (waaronder
      mede wordt verstaan het maken van afspraken over beloning), wijzigen en met inachtneming van de
      [artikelen 13][ref1] en [15 tot en met 15c van het Mandaatbesluit Ministerie van Financiën 2020][ref2] en
      [artikel 19, derde lid, aanhef en onder a][ref3], beëindigen van de arbeidsovereenkomst van medewerkers in de
      functie van teamleider of daarmee gelijk te stellen leidinggevende functies.


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0043022#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0045078#Artikel19
