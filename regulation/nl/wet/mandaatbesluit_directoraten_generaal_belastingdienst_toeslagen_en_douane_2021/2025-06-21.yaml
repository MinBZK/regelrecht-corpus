  - number: '13'
    text: |-
      1 De directeur-generaal Toeslagen kan voor zijn werkterrein ondermandaat verlenen aan personen binnen het DGTSL.

      2 In een ondermandaat wordt de omvang ervan aangegeven.
    url: https://wetten.overheid.nl/BWBR0045078/2025-06-21#Artikel13
  - number: '14'
    text: |-
      1 Onderdeel van deze regeling vormt een mandaatregister dat wordt gepubliceerd. Het mandaatregister bevat de
      functienamen van de gemandateerde, ondergemandateerde en gevolmachtigde functionarissen zoals bedoeld in de
      [hoofdstukken 2][ref1] en [3][ref2] van deze regeling.

      2 Het mandaatregister is in beheer bij de SSO Financieel en Managementinformatie.


      [ref1]: https://wetten.overheid.nl/BWBR0045078#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0045078#Hoofdstuk3
