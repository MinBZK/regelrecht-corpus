        bwb_id: BWBR0032203
        artikel: '2.24'
  - number: '12'
    text: |-
      1 Bij het maken van afspraken, afdoen van stukken en ondertekenen van uitgaande brieven door de verantwoordelijk
      leidinggevende met betrekking tot de in [Bijlage 2][ref1] opgenomen personeelsaangelegenheden is voorafgaand advies
      van de directeur Organisatie & Personeel (O&P), of een door de directeur O&P aan te wijzen afdelingshoofd, vereist
      voor het DGBD, of is voorafgaand advies van de directeur Mensen & Middelen of een door de directeur Mensen &
      Middelen aan te wijzen afdelingshoofd vereist indien het het DGD betreft, of is voorafgaand advies van de directeur
      FIOD vereist indien het de FIOD betreft, of is voorafgaand advies van de directeur Mensen, Middelen & Communicatie
      of een door de directeur Mensen, Middelen & Communicatie aan te wijzen afdelingshoofd vereist indien het het DGTSL
      betreft.

      2 Bij het beslissen over verzoeken ten aanzien van het starten van een gerechtelijke procedure met betrekking
      tot personeelsaangelegenheden is voorafgaande goedkeuring door de directeur O&P voor het DGBD en FIOD vereist,
      of is voorafgaande goedkeuring door de directeur-generaal Toeslagen vereist indien het het DGTSL betreft, of is
      voorafgaande goedkeuring door de directeur-generaal Douane vereist indien het het DGD betreft


      [ref1]: https://wetten.overheid.nl/BWBR0045078
    url: https://wetten.overheid.nl/BWBR0045078/2025-06-21#Artikel12
    references:
      - id: ref1
