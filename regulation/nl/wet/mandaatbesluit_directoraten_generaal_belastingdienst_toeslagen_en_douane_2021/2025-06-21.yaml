        hoofdstuk: '3'
  - number: '19'
    text: |-
      1 De overige directeuren van de in het
      [Organisatiebesluit Directoraten-Generaal Belastingdienst, Toeslagen en Douane 2021][ref1] genoemde directies en
      hun plaatsvervangers hebben binnen het kader van hun jaarplannen en behoudens de voorgaande bepalingen volmacht
      tot het nemen van beslissingen en afdoen van stukken betreffende aangelegenheden op het gebied van organisatie en
      personeel genoemd in het [Organisatiebesluit Directoraten-Generaal Belastingdienst, Toeslagen en Douane 2021][ref2]
      ten aanzien van onder hen ressorterende medewerkers.

      2 De functionarissen als bedoeld in het eerste lid kunnen ondermandaat verlenen. In dat ondermandaat wordt de
      omvang ervan aangegeven.

      3 Met inachtneming van voorgaande artikelen van dit besluit is aan de overige directeuren en hun plaatsvervangers,
      ten aanzien van onder hen ressorterende medewerkers voorbehouden het nemen van beslissingen:

      a. tot het aangaan (waaronder mede wordt verstaan het maken van afspraken
      over beloning), wijzigen en met inachtneming van de [artikelen 13][ref3] en
      [15 tot en met 15c van het Mandaatbesluit Ministerie van Financiën 2020][ref4] beëindigen van de
      arbeidsovereenkomst van medewerkers in de functie van afdelingshoofd of daarmee gelijk te stellen leidinggevende
      functies, na afstemming met de directeur topstructuur;

      b. over aansprakelijkheid, schadeloosstelling of schadevergoeding tot € 25.000, waarbij de pSG door de algemene
      leiding DGBD, de algemene leiding DGTSL respectievelijk de algemene leiding DGD wordt geïnformeerd voor zover het
      gaat om dienstongevallen, beroepsziektes en beroepsincidenten als bedoeld in de cao Rijk;

      c. het toekennen van maatregelen van sociaal flankerend beleid, uitgezonderd de toekenning van een
      stimuleringspremie;

      d. het inhouden van salaris;

      e. het toekennen dan wel stopzetten van een bovenschaalse periodiek;

      f. ten aanzien van het geen aanspraak hebben op salaris dan wel het vervallen van aanspraken op grond van het
      aflopen van het dienstverband tijdens ziekte, dan wel het niet nakomen van de verplichtingen tijdens ziekte;

      g. handelingen en beslissingen met betrekking tot het treffen van ordemaatregelen als opgenomen in de cao Rijk;

      h. het aanwijzen van vertegenwoordigers van de Staat der Nederlanden bij de behandeling van een gerechtelijke
      procedure, inclusief procedures bij het UWV en het College voor de Rechten van de Mens; en

      i. op verzoeken tot het niet laten vervallen dan wel verjaren van wettelijke vakantie-uren.


      [ref1]: https://wetten.overheid.nl/BWBR0045076
      [ref2]: https://wetten.overheid.nl/BWBR0045076
      [ref3]: https://wetten.overheid.nl/BWBR0043022#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0043022#Artikel15
