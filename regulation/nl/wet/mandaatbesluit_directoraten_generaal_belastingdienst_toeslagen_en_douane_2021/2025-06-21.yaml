  - number: '22'
    text: |-
      1 Met inachtneming van hetgeen is bepaald in voorgaande artikelen en in
      [hoofdstuk 4 van het Mandaatbesluit Ministerie van Financiën 2020][ref1] zijn de directeuren van de topstructuur
      DGBD, DGD en DGTSL bevoegd om ten aanzien van het tot het eigen directoraat-generaal behorende medewerkers namens
      de Staat der Nederlanden de eed en belofte af te nemen.

      2 In geval van verhindering kunnen de directeuren van de topstructuur DGBD, DGD en DGTSL zich bij het afnemen van
      de eed en belofte laten vervangen door de overige directeuren.

      3 In afwijking van voorgaande leden is het afdelingshoofd bevoegd om ten aanzien van de tot de eigen afdeling
      behorende medewerkers namens de Staat der Nederlanden de eed en belofte af te nemen bij medewerkers banenafspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0045078/2025-06-21#Artikel22
