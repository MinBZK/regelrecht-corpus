      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2.24'
  - number: '12'
    text: |-
      1 Bij het maken van afspraken, afdoen van stukken en ondertekenen van uitgaande brieven door de verantwoordelijk
      leidinggevende met betrekking tot de in [bijlage 2][ref1] opgenomen personeelsaangelegenheden is voorafgaand advies
      van de directeur SSO Organisatie & Personeel (O&P), of een door de directeur SSO O&P aan te wijzen afdelingshoofd,
      vereist voor het DGBD en het DGTSL, of is voorafgaand advies van de directeur DLSO vereist indien het het DGD
      betreft, of is voorafgaand advies van de directeur FIOD vereist indien het de FIOD betreft.

      2 Bij het beslissen over verzoeken ten aanzien van het starten van een gerechtelijke procedure met betrekking tot
      personeelsaangelegenheden is voorafgaande goedkeuring door de directeur concerndirectie Organisatie & Personeel
      voor het DGBD en FIOD vereist, of is voorafgaande goedkeuring door de directeur-generaal Toeslagen vereist indien
      het het DGTSL betreft, of is voorafgaande goedkeuring door de directeur-generaal Douane vereist indien het het
      DGD betreft

      3 De functionaris die bevoegd is tot het aangaan van een arbeidsovereenkomst voor een bepaalde functie is ook
      bevoegd de arbeidsovereenkomst op te zeggen in de proeftijd, na verlening van de ontslagvergunning door het UWV of
      vanwege het bereiken van de AOW-gerechtigde leeftijd. Ook is deze bevoegd het einde van de arbeidsovereenkomst voor
      bepaalde tijd aan te zeggen en de opzegging door de werknemer te bevestigen.


      [ref1]: https://wetten.overheid.nl/BWBR0045078
    url: https://wetten.overheid.nl/BWBR0045078/2022-03-19#Artikel12
    references:
