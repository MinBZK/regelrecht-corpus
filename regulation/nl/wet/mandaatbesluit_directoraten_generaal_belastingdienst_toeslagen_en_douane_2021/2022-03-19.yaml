  - number: '2'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt met de verlening van mandaat
      gelijkgesteld de verlening van:

      a) volmacht: de bevoegdheid om namens de Minister voor de Staat of de Staat der Nederlanden privaatrechtelijke
      rechtshandelingen te verrichten; en

      b) machtiging: de bevoegdheid om namens de Minister voor de Staat of de Staat der Nederlanden handelingen te
      verrichten die noch een besluit noch een privaatrechtelijke rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0045078/2022-03-19#Artikel2
  - number: '3'
    text: |-
      1 De taken en bevoegdheden van de gemandateerde kunnen ook worden uitgeoefend door een aangewezen
      plaatsvervanger. De aanwijzing van een plaatsvervanger geschiedt door de mandaatgever met inachtneming van het
      [Organisatiebesluit Directoraten-Generaal Belastingdienst, Toeslagen en Douane 2021][ref1] en in overeenstemming
      met de algemene leiding DGBD, de algemene leiding DGTSL of de algemene leiding DGD ten aanzien van de directeuren
      (van de topstructuur DGBD).

      De aanwijzing van een plaatsvervanger anders dan plaatsvervanger voor de directeuren (van de topstructuur DGBD),
      geschiedt door de directeur (van de topstructuur DGBD) van het betreffende organisatieonderdeel met inachtneming
      van het [Organisatiebesluit Directoraten-Generaal Belastingdienst, Toeslagen en Douane 2021][ref2].

      2 Bij gelijktijdige afwezigheid of verhindering van de gemandateerde en diens plaatsvervanger worden de taken
      volledig uitgeoefend door de naasthogere leidinggevende functionaris.

      3 In de situatie waarin de functie van algemeen directeur niet vervuld is, kan de DG maximaal twee plaatsvervangers
      voor de functie van algemeen directeur aanwijzen. Bij het aanwijzen van de plaatsvervanger(s), geeft de DG aan wat
      het specifieke werkdomein van die plaatsvervanger(s) is.


      [ref1]: https://wetten.overheid.nl/BWBR0045076
      [ref2]: https://wetten.overheid.nl/BWBR0045076
    url: https://wetten.overheid.nl/BWBR0045078/2022-03-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0045076
      - id: ref2
        bwb_id: BWBR0045076
  - number: '4'
    text: |-
      Indien beslissingsbevoegde functionarissen zoals bedoeld in dit besluit, in een onderdeel niet voorkomen behoren de
      bevoegdheden toe aan de naast hogere leidinggevende functionaris.
    url: https://wetten.overheid.nl/BWBR0045078/2022-03-19#Artikel4
  - number: '5'
    text: |-
      Over vraagstukken die van politiek gevoelige of anderszins zwaarwegende aard zijn, treden mandaathouders in overleg
      met de algemene leiding DGBD, de algemene leiding DGTSL of de algemene leiding DGD, voordat van bevoegdheden
      gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0045078/2022-03-19#Artikel5
  - number: '6'
    text: |-
      De ondertekening van uitgaande stukken zal luiden als volgt:

      *Voor alle besluiten met uitzondering van de personeelsbesluiten:*

      DE MINISTER VAN FINANCIËN, resp. DE STAATSSECRETARIS VAN FINANCIËN,

      Namens deze,

      Gevolgd door naam en functie van de (onder)gemandateerde functionaris

      *Voor personeelsbesluiten:*

      Staat der Nederlanden, waarvan de zetel is gevestigd te Den Haag, vertegenwoordigd door DE MINISTER VAN FINANCIËN,
      resp. DE STAATSSECRETARIS VAN FINANCIËN, meer in het bijzonder door het directoraat-generaal Belastingdienst, resp.
      het directoraat-generaal Toeslagen, resp. het directoraat-generaal Douane namens deze,

      Bas van den Dungen Secretaris-generaal
    url: https://wetten.overheid.nl/BWBR0045078/2022-03-19#Artikel6
  - number: '7'
    text: |-
      1 De pDGBD is (beheersmatig) verantwoordelijk voor de directies, genoemd in het
      [Organisatiebesluit Directoraten-Generaal Belastingdienst, Toeslagen en Douane 2021][ref1] opgenomen
      [artikel 4, onder a, c en d][ref2], voor de samenhang tussen die directies en – met inachtneming van hetgeen
      bepaald in de [artikelen 11 tot en met 16 van het Mandaatbesluit van het Ministerie van Financiën 2020][ref3] –
      voor de bijbehorende bedrijfsvoering.

      2 De directeuren (van de topstructuur DGBD) hebben binnen het kader van de jaarcontracten en binnen eventueel
      door de staatssecretaris of namens de staatssecretaris door de algemene leiding van het ministerie of de algemene
      leiding DGBD, de algemene leiding DGTSL of de algemene leiding DGD gegeven richtlijnen mandaat ten aanzien van het
      nemen van besluiten en afdoen van stukken betreffende alle aangelegenheden die behoren tot hun werkterrein, tenzij
      bij wet anders is bepaald of de aard van de bevoegdheid zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0045076
      [ref2]: https://wetten.overheid.nl/BWBR0043022#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0043022#Artikel11
