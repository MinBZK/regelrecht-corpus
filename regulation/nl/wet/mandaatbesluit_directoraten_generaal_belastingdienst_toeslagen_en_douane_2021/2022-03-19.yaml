  - number: '20'
    text: |-
      Met inachtneming van hetgeen bepaald in voorgaande artikelen en in
      [hoofdstuk 4 van het Mandaatbesluit Ministerie van Financiën 2020][ref1] zijn de afdelingshoofden of daarmee
      vergelijkbare leidinggevende functionarissen bevoegd om ten aanzien van het tot hun afdeling behorende personeel
      namens de Staat der Nederlanden de volgende handelingen en beslissingen te verrichten of te nemen:

      1. Ten aanzien van de onder het afdelingshoofd ressorterende teamleiders:

      a. Bij openstelling van een vacature is het afdelingshoofd ten aanzien van het eigen organisatieonderdeel waar
      de vacature bestaat bevoegd met betrekking tot de beslissing tot het aanbieden van een arbeidsovereenkomst aan de
      kandidaat die voor de functie in aanmerking komt en het afwijzen van de overige kandidaten; en

      b. Het stellen van voorwaarden voor het aangaan van een arbeidsovereenkomst zoals bedoeld in de CAO Rijk, de
      [Wet op de medische keuringen][ref2] en het werving- en selectiebeleid.

      2. Afwijzing van de aanvraag betreffende Partiële Arbeidsparticipatie Senioren (PAS);

      3. Het toekennen van toeslagen vanwege periodieke salarisverhoging, toelage eenmalige uitkering op een andere grond
      en toelage personenchauffeurs;

      4. Het toekennen van vergoedingen voor overwerk;

      5. Het vaststellen van een vacante functie zoals bedoeld in het [besluit Werving en Selectie][ref3];

      6. Het openstellen van een vacature op grond van het [besluit Werving en Selectie][ref4];

      7. Bij openstelling van een vacature is het afdelingshoofd ten aanzien van het eigen organisatieonderdeel waar
      de vacature bestaat bevoegd met betrekking tot het besluit tot het aanbieden van een arbeidsovereenkomst aan
      de kandidaat die voor de functie in aanmerking komt en het afwijzen van de overige kandidaten, uitgezonderd de
      teamleiders;

      8. Het stellen van voorwaarden voor het aangaan van een arbeidsovereenkomst zoals bedoeld in de CAO Rijk, de
      [Wet op de medische keuringen][ref5] en het werving- en selectiebeleid;

      9. Het toekennen van buitengewoon verlof op grond van de CAO Rijk;

      10. Het toekennen van toelagen voor:

      a. een periodieke verhoging van het salaris,

      b. toelage onregelmatige dienst,

      c. vaste toelage onregelmatige dienst,

      d. aflopende toelage onregelmatige dienst,

      e. toelage werktijdverschuiving,

      f. toelage bereikbaarheids- en beschikbaarheidsdienst,

      g. toelage bezwarende omstandigheden,

      h. toelage waarnemen hogere functie en

      i. toelagen die vallen onder de Van Werk Naar Werk voorzieningen;

      11. Ten aanzien van de goedkeuring van bijzondere beloningsregelingen zoals de vergoeding voor
      Bedrijfshulpverlening en stagevergoeding;

      12. Over het toekennen van studiefaciliteiten ten aanzien van werknemers met salarisschaal 15 of hoger, of vanaf
      een bedrag van € 5.000,–;

      13. Verzoeken tot uitbreiding tot en met 36 uur per week dan wel vermindering van de arbeidsduur;

      14. Het aanwijzen van bedrijfshulpverleners;

      15. Het met personeel direct ressorterend onder het afdelingshoofd voeren van voortgang dan wel
      personeelsgesprekken zoals bedoeld in de CAO Rijk;

      16. Het opmaken en bespreken van de personeelsbeoordeling en het indien wenselijk aanwijzen van informanten en
      adviseurs op grond van de CAO Rijk;

      17. Goedkeuring dan wel afwijzing van verzoeken tot vergoeding buitenlandse dienstreizen binnen Europa en de
      bijbehorende reis en verblijfskosten;

      18. Het beslissen over stopzetten of opschorten van loondoorbetaling tijdens ziekte wanneer zich één van de gronden
      daarvoor genoemd in de regelgeving voordoet;

      19. Het uitvoeren van de verplichtingen van de werkgever met betrekking tot de bedrijfsgeneeskundige begeleiding
      van de ambtenaar bij ziekte en arbeidsongeschiktheid;

      20. Het aangaan van detacheringsovereenkomsten ten behoeve van het eigen organisatieonderdeel;

      21. Het maken van loopbaanafspraken in het kader van studiefaciliteiten zonder garantie op een hogere functie; en

      22. De bevoegdheden opgenomen in [artikel 21][ref6] worden uitgeoefend door de afdelingshoofden voor zover het
      handelingen en beslissingen betreft aangaande de direct onder hen ressorterende leidinggevenden.


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0008819
