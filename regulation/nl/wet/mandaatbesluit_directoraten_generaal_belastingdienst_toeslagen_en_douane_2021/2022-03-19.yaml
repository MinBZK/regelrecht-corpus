  - number: '19'
    text: |-
      Met inachtneming van hetgeen bepaald in voorgaande artikelen en in
      [hoofdstuk 4 van het Mandaatbesluit Ministerie van Financiën 2020][ref1] zijn de overige directeuren bevoegd
      om ten aanzien van het tot het eigen organisatieonderdeel behorende personeel namens de Staat der Nederlanden de
      volgende handelingen en beslissingen te verrichten of te nemen:

      1. Ten aanzien van de onder de directeur ressorterende teamleiders of vergelijkbare leidinggevende functionarissen:

      a. Het vaststellen van een vacante functie zoals bedoeld in het [besluit Werving en Selectie][ref2]; en

      b. Het openstellen van een vacature op grond van het [besluit Werving en Selectie][ref3].

      2. Verzoeken tot uitbreiding van meer dan 36 uur per week;

      3. Het bepalen van de inhoud en het waarderingsniveau van de feitelijk opgedragen functie binnen de kaders van het
      functiegebouw Rijk dan wel op grond van de systematiek voor groepsfuncties;

      4. Het met personeel direct ressorterend onder de directeur en het personeel van salarisschaal 15 en hoger voeren
      van voortgangs- dan wel personeelsgesprekken;

      5. Het wijzigen van een salarisschaal zonder wijziging van de functie met instemming van de medewerker;

      6. Het opmaken en bespreken van de personeelsbeoordeling en het indien wenselijk aanwijzen van informanten en
      adviseurs ten aanzien van de direct onder de directeur ressorterend personeel;

      7. Het toekennen van een beloning dan wel non-activiteitswedde in verband met het vervullen van een openbare
      functie;

      8. Uitvoering geven aan een sociale dan wel medische indicatie;

      9. Het opmaken en bespreken van de personeelsbeoordeling en het indien wenselijk aanwijzen van informanten en
      adviseurs ten aanzien van personeel van het dienstonderdeel;

      10. Het beslissen ten aanzien van schadeloosstelling tot € 5.000,–, inclusief besluitvorming over schadevergoeding
      die voortvloeit uit door de rechter gedane uitspraken;

      11. Het toekennen van maatregelen van sociaal flankerend beleid, uitgezonderd de toekenning van een
      stimuleringspremie;

      12. Het inhouden van salaris;

      13 Ten aanzien van salaris aan de ambtenaar die als militair of als vrijwillig ambtenaar van politie, in werkelijke
      dienst is;

      14 Ten aanzien van de nabestaandenuitkering in geval van overlijden van de ambtenaar;

      15. Ten aanzien van de nabestaandenuitkering bij vermissing van een ambtenaar;

      16. Ten aanzien van het geen aanspraak hebben op salaris dan wel het vervallen van aanspraken op grond van het
      aflopen van het dienstverband tijdens ziekte, dan wel het niet nakomen van de verplichtingen tijdens ziekte;

      17. Handelingen en beslissingen met betrekking tot het treffen van ordemaatregelen als opgenomen in de cao Rijk;

      18. Het aanwijzen van vertegenwoordigers van de Staat der Nederlanden bij de behandeling van een procedure bij het
      UWV, de rechtbank, het Gerechtshof en bij de rechtbank bij beroep en de Centrale Raad van Beroep bij hoger beroep;

      19. Op verzoeken tot het niet laten vervallen / verjaren van wettelijke vakantie-uren; en

      20. De bevoegdheden opgenomen in [artikelen 20][ref4] en [21][ref5] worden uitgeoefend door de overige directeuren
      voor zover het rechtspositionele handelingen en besluiten betreft aangaande de direct onder hen ressorterende
      leidinggevenden.


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Hoofdstuk4
