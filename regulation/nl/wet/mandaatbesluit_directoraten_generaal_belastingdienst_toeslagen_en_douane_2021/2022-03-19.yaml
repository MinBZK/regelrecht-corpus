  - number: '17'
    text: |-
      Met inachtneming van hetgeen is bepaald in voorgaande artikelen en in
      [hoofdstuk 4 van het Mandaatbesluit Ministerie van Financiën 2020][ref1] zijn de directeuren (van de topstructuur
      DGBD) bevoegd om ten aanzien van het tot het eigen organisatieonderdeel behorende personeel namens de Staat der
      Nederlanden de navolgende handelingen en beslissingen te verrichten of te nemen:

      1. Het openstellen van een vacature op grond van het [besluit Werving en Selectie][ref2];

      2. Het geven van een opdracht tot het verrichten van onderzoek naar de integriteit van personeel en het beslissen
      tot opleggen van straffen (conform CAO Rijk), met uitzondering van de wettelijke mogelijkheden het dienstverband te
      beëindigen, aan functionarissen tot en met schaal 14 voor zover het geen leidinggevende functionarissen betreft;

      3. Toekennen van buitengewoon verlof van lange duur;

      4. Tot het aangaan van een arbeidsovereenkomst met werknemers met een bezoldiging van schaal 15;

      5. Het beslissen over het maken van een buitenlandse dienstreis voor zover deze voortvloeien uit activiteiten die
      zijn opgenomen in het door het DT Belastingdienst goedgekeurde Activiteitenplan Internationaal van het jaar waarin
      de reis wordt gemaakt, uitgezonderd de buitenlandse dienstreizen vanuit de directie Particulieren van het DGBD, het
      DGTSL en het DGD. Indien deze activiteit niet in het Activiteitenplan Internationaal is opgenomen, is de directeur
      van de concerndirectie Uitvoerings- en Handhavingsbeleid bevoegd hierover te beslissen;

      6. Het beslissen op verzoeken tot doorwerken na het bereiken van de AOW-gerechtigde leeftijd en het doorwerken na
      het bereiken van de leeftijd van 70 jaar;

      7. Tijdelijke ontheffing uit de functie in verband met het bekleden van een functie in een publiekrechtelijk
      college;

      8. Het toestaan of afwijzen van de door de ambtenaar opgegeven nevenwerkzaamheden op grond van de
      integriteitsbepalingen opgenomen in de [Ambtenarenwet 2017][ref3];

      9. Het beslissen over verzoeken om het starten van of verweren in een gerechtelijke procedure, voor
      zover die betrekking hebben op handelingen of beslissingen waarbij een werknemer als bedoeld in
      [artikel 1 van de Ambtenarenwet][ref4] als zodanig belanghebbende is;

      10. Het toekennen en stopzetten van een na het bereiken van het maximum van de salarisschaal periodieke
      salarisverhoging naar een bedrag in de naast hogere salarisschaal; en

      11. Het niet instellen van een vordering of het niet opleggen van een terugbetalingsverplichting, dan wel het
      (gedeeltelijk) kwijtschelden van een vordering op personeel; en

      12. De bevoegdheden opgenomen in [artikelen 19][ref5], [20][ref6] en [21][ref7] worden uitgeoefend door de
      directeuren (van de topstructuur DGBD) voor zover het handelingen en beslissingen betreft aangaande de direct onder
      hen ressorterende leidinggevenden.


