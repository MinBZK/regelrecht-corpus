        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0045078
        hoofdstuk: '3'
  - number: '15'
    text: |-
      Met inachtneming van [hoofdstuk 4 van het Mandaatbesluit Ministerie van Financiën 2020][ref1] is de algemene
      leiding DGBD, de algemene leiding DGTSL en de algemene leiding DGD bevoegd namens de Staat der Nederlanden, en voor
      lid 14 namens de Staatssecretaris van Financiën, ten aanzien van het personeel van het DGBD, respectievelijk het
      DGTSL, respectievelijk het DGD de navolgende handelingen en beslissingen te verrichten of te nemen:

      1. Tot het aangaan van een arbeidsovereenkomst met werknemers met een bezoldiging van schaal 15 of hoger in
      functies met een lagere schaal dan de voor de werknemers tot dan toe geldende schaal;

      2. Het voordragen van functies die ten behoeve van het instellen van een veiligheidsonderzoek voor aanwijzing als
      vertrouwensfuncties in aanmerking komen;

      3. Uitzending naar en plaatsing in het buitenland;

      4. Het beslissen tot directieoverstijgende groepsgewijze werving en selectie voor (groeps)functies;

      5. Het afkondigen van een vacaturestop;

      6. Het aanwijzen van vertrouwenspersonen integriteit en ongewenste omgangsvormen;

      7. Het beslissen over de toekenning van een stimuleringspremie;

      8. Het beslissen over de afwijkingen bij de toepassing van het sociaal flankerend beleid;

      9. Het beslissen over privéverlenging van een buitenlandse dienstreis;

      10. Het beslissen over de vergoeding van representatiekosten;

      11. Het aanwijzen van brugdagen;

      12. Het beslissen ten aanzien van schadeloosstelling (vanaf € 5.000,–), inclusief besluitvorming over
      schadevergoeding die voortvloeit uit door de rechter gedane uitspraken;

      13. Het opdracht geven tot het starten van een procedure ter beëindiging van de arbeidsovereenkomst middels:

      a. Het verzoeken tot ontbinding van de arbeidsovereenkomst wegens langdurige arbeidsongeschiktheid;

      b. Het verzoeken tot ontbinding van de arbeidsovereenkomst wegens het bij regelmaat niet kunnen verrichten van
      de bedongen arbeid als gevolg van ziekte of gebreken van de werknemer met voor de bedrijfsvoering onaanvaardbare
      gevolgen;

      c. Het verzoeken tot ontbinding van de arbeidsovereenkomst wegens de ongeschiktheid van de werknemer tot het
      verrichten van de bedongen arbeid, anders dan ten gevolge van ziekte of gebreken van de werknemer;

      d. Het verzoeken van ontbinding van de arbeidsovereenkomst wegens een combinatie van ontslaggronden, tenzij één
      ontbindingsgronden is voorbehouden aan de pSG.

      14. Het geven van toestemming op verzoeken om systemen te mogen raadplegen naar aanleiding van vermoedens van niet
      integer gedrag door medewerkers;

      15. Het aanwijzen van de voorzitter, de plaatsvervangend voorzitter, de leden en de plaatsvervangend leden, de
      secretaris en de plaatsvervangend secretaris van de Klachtencommissie ongewenste omgangsvormen;

      16. Handelingen en beslissingen verband houdende met de klachtenregeling ongewenste omgangsvormen;

      17. Handelingen en beslissingen verband houdende met een adviesaanvraag bij het College voor de rechten van de
      mens;

      18. Met inachtneming van de [artikelen 11 tot en met 13][ref2] en
      [15 van het Mandaatbesluit Ministerie van Financiën 2020][ref3] worden de bevoegdheden opgenomen in
      [artikelen 7][ref4], [10][ref5] en [11][ref6] uitgeoefend door de algemene leiding voor zover het rechtspositionele
      handelingen en beslissingen betreft aangaande directeuren (van de topstructuur DGBD); en

      19. Het verrichten van handelingen en nemen van beslissingen voor zover dit besluit daarin niet voorziet.


