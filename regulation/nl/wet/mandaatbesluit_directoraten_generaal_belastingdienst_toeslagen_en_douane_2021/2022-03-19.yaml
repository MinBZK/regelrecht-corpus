  - number: '13'
    text: |-
      1 De directeur-generaal Toeslagen kan voor zijn werkterrein ondermandaat verlenen aan personen binnen het DGTSL.

      2 In een ondermandaat wordt de omvang ervan aangegeven.
    url: https://wetten.overheid.nl/BWBR0045078/2022-03-19#Artikel13
  - number: '14'
    text: |-
      Onderdeel van deze regeling vormt een mandaat- en volmachtregister dat wordt gepubliceerd. Het mandaat- en
      volmachtregister bevat handtekeningen en parafen van de gemandateerde functionarissen zoals bedoeld in de
      [hoofdstukken 2][ref1] en [3][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0045078#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0045078#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0045078/2022-03-19#Artikel14
