      1 Met inachtneming van hetgeen is bepaald in voorgaande artikelen en in
      [hoofdstuk 4 van het Mandaatbesluit Ministerie van Financiën 2020][ref1] zijn de directeuren (van de topstructuur
      DGBD) bevoegd om ten aanzien van het tot het eigen directoraat-generaal behorende personeel namens de Staat der
      Nederlanden de eed en belofte af te nemen.

      2 In geval van verhindering kunnen de directeuren (van de topstructuur DGBD) zich bij het afnemen van de eed en
      belofte laten vervangen door de overige directeuren.


