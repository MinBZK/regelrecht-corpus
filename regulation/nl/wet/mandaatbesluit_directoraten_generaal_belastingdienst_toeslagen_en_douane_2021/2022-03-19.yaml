  - number: '9'
    text: |-
      1 Raamovereenkomsten/overige verplichtingen: de budgethouder is bevoegd tot het aangaan van raamovereenkomsten
      zoals bedoeld in [artikel 1.1 van de Aanbestedingswet 2012][ref1], alsmede tot het aangaan van andere financiële
      verplichtingen volgend uit de aanbestedingsprocedures zoals bedoeld in de [Aanbestedingswet 2012][ref2]. Het
      gunningsbesluit wordt door de budgethouder vastgesteld waarbij tevens machtiging wordt verleend aan de functionaris
      van SSO Centrum voor Facilitaire Dienstverlening conform de bevoegdheden genoemd in het derde, vierde en vijfde
      lid.

      2 Overeenkomsten voortkomend uit een Europese aanbesteding (ongeacht het bedrag) worden ondertekend door directeur
      SSO Centrum voor Facilitaire Dienstverlening, met uitzondering van diegenen die voortkomen uit Categoriemanagement.
      Het gunningsbesluit wordt door de budgethouder vastgesteld waarbij tevens machtiging wordt verleend aan de
      functionaris van SSO Centrum voor Facilitaire Dienstverlening.

      3 Overeenkomsten uit onderhandse aanbestedingen, mini-competities en contractmutaties worden ondertekend door
      het afdelingshoofd of de teammanager Inkoopuitvoeringscentrum (hierna: ‘IUC’) na akkoord van de budgethouder. Een
      teammanager is bevoegd te ondertekenen tot het bedrag van een Europese aanbesteding. Overeenkomsten uit onderhandse
      aanbestedingen, mini-competities en contractmutaties met een bedrag hoger dan het bedrag van de Europese
      aanbesteding worden ondertekend door het afdelingshoofd IUC.

      4 Proces gerelateerde stukken worden door het afdelingshoofd of de teammanager IUC getekend.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0032203
    url: https://wetten.overheid.nl/BWBR0045078/2022-03-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '1.1'
      - id: ref2
        bwb_id: BWBR0032203
  - number: '10'
    text: |-
      De directeuren van de dienstonderdelen kunnen verplichtingen aangaan tot het leveren van dienstverlening
      door het DGBD, het DGTSL of het DGD onder de € 1 mln. inclusief eventuele BTW – materieel – aan externe
      partijen buiten de Belastingdienst (zowel aan partijen binnen de rechtspersoon Staat, als daarbuiten), na
      instemming met deze – aanvullende- dienstverlening door het DT Belastingdienst, de DGTSL of de DGD conform
      de binnen de Rijksbelastingdienst geldende kaders daarvoor. Voor het aangaan van verplichtingen in de rol van
      concerndienstverlener (CDV) is het grensbedrag € 5 mln.

      Het aangaan van verplichtingen tot het leveren van dienstverlening door het DGBD, het DGTSL of het DGD boven de € 1
      mln., is voorbehouden aan de algemene leiding DGBD, de algemene leiding DGTSL of de algemene leiding DGD.
    url: https://wetten.overheid.nl/BWBR0045078/2022-03-19#Artikel10
  - number: '11'
    text: |-
      Aan de DG is voorbehouden te beslissen over het afwijken van de procedures als bedoeld in de
      [Aanbestedingswet 2012][ref1], alsmede over het toepassen van een uitzonderingsgrond als bedoeld in de
      [artikelen 2.24 tot en met 2.24c van de Aanbestedingswet 2012][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032203
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2.24
    url: https://wetten.overheid.nl/BWBR0045078/2022-03-19#Artikel11
