  - number: '5'
    text: |-
      1 Indien uit het onderzoek blijkt dat het apparaat dat storing ondervindt, niet voldoet aan het bepaalde in
      [artikel 4, eerste lid, onder a, b, c of d][ref1], zal geen verdere klachtbehandeling plaatsvinden.

      2 Indien uit het onderzoek blijkt dat het apparaat dat storing ondervindt voldoet aan het bepaalde in
      [artikel 4, eerste lid, onder a tot en met d][ref2], wordt een onderzoek aan het storende apparaat ingesteld.

      3 Indien het storende apparaat blijkens het onderzoek voldoet aan het bepaalde in
      [artikel 4, eerste lid, onder a tot en met c][ref3], zal geen verdere klachtbehandeling plaatsvinden. Alsdan kan
      aan de klager worden geadviseerd op eigen kosten bepaalde voorzieningen te treffen ten aanzien van het apparaat dat
      storing ondervindt.

      4 Indien het storende apparaat :

      1° blijkens het onderzoek niet aan het bepaalde in [artikel 4, eerste lid onder a, b, of c][ref4] voldoet; danwel

      2° een radiozendapparaat is waarvan de gemeten elektrische of magnetische veldsterkte ter plaatse van het storing
      ondervindende apparaat de voor laatstgenoemde apparaat geldende beschermingseisen overschrijdt, dan kan de houder
      van het apparaat dat storing veroorzaakt verplicht worden maatregelen te nemen om de klacht te verhelpen.

      5 Behalve door afdoening van de klacht overeenkomstig de voorgaande leden wordt de klachtbehandeling beëindigd
      indien:

      a. de klager de klacht intrekt;

      b. de klager onvoldoende medewerking verleent;

      c. de storing zich niet meer voordoet;

      d. de stoorbron niet kan worden opgespoord;

      e. de kosten van de klachtbehandeling, naar het oordeel van de minister, niet in verhouding staan tot het belang
      dat de klager bij opheffing van de storing heeft;

      f. het een storing betreft als bedoeld in Hoofdstuk SI, artikel S1, sectie VII, onderdeel S1.167 en S1.168 van het
      Internationale Radio Reglement.

      6 Van de beëindiging van de klachtbehandeling wordt door het Agentschap Telecom aan de klager en voor zover
      mogelijk aan de gebruiker van het storende apparaat onder opgave van redenen schriftelijk mededeling gedaan.


