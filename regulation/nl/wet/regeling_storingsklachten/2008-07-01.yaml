---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_storingsklachten
regulatory_layer: WET
publication_date: '2009-10-26'
valid_from: '2008-07-01'
bwb_id: BWBR0007511
url: https://wetten.overheid.nl/BWBR0007511/2008-07-01
preamble:
  text: |-
    Gelet op de artikelen 20 en 21 van het Besluit elektromagnetische compatibiliteit en de artikelen C.9.5 en F.7.4
    van het Besluit radio-elektrische inrichtingen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
             Besluit:

              het [Besluit elektromagnetische compatibiliteit 2007][ref1];



            b
            storing:

              elektromagnetische storing, ondervonden van het gebruik van apparaten of door een radiozendapparaat
      veroorzaakte belemmering in een ander radiozendapparaat;



            c
             beschermingseisen:

              de beschermingseisen genoemd in [artikel 4, eerste en tweede lid van het Besluit][ref2];



            d
            Agentschap Telecom:

              Agentschap Telecom van het Ministerie van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0021041
      [ref2]: https://wetten.overheid.nl/BWBR0021041#Artikel4
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021041
      - id: ref2
        bwb_id: BWBR0021041
        artikel: '4'
  - number: '2.1'
    text: |-
      Een klacht over een storing kan naar keuze van de klager telefonisch dan wel schriftelijk worden aangemeld bij het
      Agentschap Telecom.
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel2
  - number: '2.2'
    text: De ontvangst van de klacht wordt op verzoek van de klager schriftelijk bevestigd.
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel2
  - number: '3.1'
    text: 'Een klacht wordt niet in behandeling genomen indien:'
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel3
  - number: 3.1.a
    text: het duidelijk is dat de klacht geen betrekking heeft op een storing;
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel3
  - number: 3.1.b
    text: |-
      een ongestoorde ontvangst, in geval van klachten over de ontvangst van omroepzenders, naar het oordeel van de
      minister, mede gelet op de plaats van de betrokken ontvanginrichting en de betrokken omroepzenders, niet mag worden
      verwacht;
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel3
  - number: 3.1.c
    text: de klacht betrekking heeft op omroepontvangst in niet vast opgestelde voer-en vaartuigen;
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel3
  - number: '3.2'
    text: |-
      Indien een klacht niet in behandeling wordt genomen, wordt hiervan aan de klager onder opgave van redenen binnen
      vier weken na ontvangst van de klacht, schriftelijk mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel3
  - number: '4.1'
    text: |-
      Indien de klacht in behandeling wordt genomen, wordt overeenkomstig het bepaalde in [artikel 5][ref1], een
      onderzoek aan het apparaat dat storing ondervindt of aan het apparaat dat storing veroorzaakt of aan beide
      apparaten, ingesteld. Bij dit onderzoek wordt nagegaan of:


      [ref1]: https://wetten.overheid.nl/BWBR0007511#Artikel5
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007511
        artikel: '5'
  - number: 4.1.a
    text: het apparaat aan de beschermingseisen voldoet;
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel4
  - number: 4.1.b
    text: |-
      het apparaat geen konstruktiefouten of andere gebreken vertoont, die problemen in de werking van het apparaat
      kunnen veroorzaken;
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel4
  - number: 4.1.c
    text: |-
      het gebruik van het apparaat geschiedt in overeenstemming met de gebruiksaanwijzing en de bij of krachtens de
      [Telecommunicatiewet][ref1] gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: 4.1.d
    text: |-
      de eventuele antenne-inrichting, die bij het apparaat wordt gebruikt voldoet aan de bij of krachtens de
      [Telecommunicatiewet][ref1] gestelde eisen, danwel de criteria vermeld in [bijlage 1][ref2] behorend bij deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
      [ref2]: https://wetten.overheid.nl/BWBR0007511
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009950
      - id: ref2
        bwb_id: BWBR0007511
  - number: '4.2'
    text: |-
      Het onderzoek als bedoeld in het vorige lid onder a, vindt voor wat betreft het storing ondervindende apparaat,
      plaats overeenkomstig het gestelde in [bijlage 3][ref1], behorend bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007511
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007511
  - number: '4.3'
    text: |-
      Naar aanleiding van het onderzoek als bedoeld in het eerste lid wordt een inventarisatie opgemaakt van maatregelen
      welke tot opheffing van de storing kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel4
  - number: '5.1'
    text: |-
      Indien uit het onderzoek blijkt dat het apparaat dat storing ondervindt, niet voldoet aan het bepaalde in
      [artikel 4, eerste lid, onder a, b, c of d][ref1], zal geen verdere klachtbehandeling plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0007511#Artikel4
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007511
        artikel: '4'
  - number: '5.2'
    text: |-
      Indien uit het onderzoek blijkt dat het apparaat dat storing ondervindt voldoet aan het bepaalde in
      [artikel 4, eerste lid, onder a tot en met d][ref1], wordt een onderzoek aan het storende apparaat ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007511#Artikel4
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007511
        artikel: '4'
  - number: '5.3'
    text: |-
      Indien het storende apparaat blijkens het onderzoek voldoet aan het bepaalde in
      [artikel 4, eerste lid, onder a tot en met c][ref1], zal geen verdere klachtbehandeling plaatsvinden. Alsdan kan
      aan de klager worden geadviseerd op eigen kosten bepaalde voorzieningen te treffen ten aanzien van het apparaat dat
      storing ondervindt.


      [ref1]: https://wetten.overheid.nl/BWBR0007511#Artikel4
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007511
        artikel: '4'
  - number: '5.4'
    text: 'Indien het storende apparaat :'
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel5
  - number: 5.4.1
    text: |-
      blijkens het onderzoek niet aan het bepaalde in [artikel 4, eerste lid onder a, b, of c][ref1] voldoet; danwel


      [ref1]: https://wetten.overheid.nl/BWBR0007511#Artikel4
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007511
        artikel: '4'
  - number: 5.4.2
    text: |-
      een radiozendapparaat is waarvan de gemeten elektrische of magnetische veldsterkte ter plaatse van het storing
      ondervindende apparaat de voor laatstgenoemde apparaat geldende beschermingseisen overschrijdt, dan kan de houder
      van het apparaat dat storing veroorzaakt verplicht worden maatregelen te nemen om de klacht te verhelpen.
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel5
  - number: '5.5'
    text: |-
      Behalve door afdoening van de klacht overeenkomstig de voorgaande leden wordt de klachtbehandeling beëindigd
      indien:
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel5
  - number: 5.5.a
    text: de klager de klacht intrekt;
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel5
  - number: 5.5.b
    text: de klager onvoldoende medewerking verleent;
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel5
  - number: 5.5.c
    text: de storing zich niet meer voordoet;
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel5
  - number: 5.5.d
    text: de stoorbron niet kan worden opgespoord;
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel5
  - number: 5.5.e
    text: |-
      de kosten van de klachtbehandeling, naar het oordeel van de minister, niet in verhouding staan tot het belang dat
      de klager bij opheffing van de storing heeft;
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel5
  - number: 5.5.f
    text: |-
      het een storing betreft als bedoeld in Hoofdstuk SI, artikel S1, sectie VII, onderdeel S1.167 en S1.168 van het
      Internationale Radio Reglement.
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel5
  - number: '5.6'
    text: |-
      Van de beëindiging van de klachtbehandeling wordt door het Agentschap Telecom aan de klager en voor zover mogelijk
      aan de gebruiker van het storende apparaat onder opgave van redenen schriftelijk mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel5
  - number: '9'
    text: |-
      Deze regeling treedt in werking met ingang van de dag waarop het Besluit elektromagnetische compatibiliteit in
      werking treedt.
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel9
  - number: '10'
    text: |-
      Deze regeling wordt aangehaald als: [Regeling storingsklachten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007511
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007511
