        bwb_id: BWBR0021041
        artikel: '4'
  - number: '2'
    text: |-
      1 Een klacht over een storing kan naar keuze van de klager telefonisch dan wel schriftelijk worden aangemeld bij
      het Agentschap Telecom.

      2 De ontvangst van de klacht wordt op verzoek van de klager schriftelijk bevestigd.
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel2
  - number: '3'
    text: |-
      1 Een klacht wordt niet in behandeling genomen indien:

      a. het duidelijk is dat de klacht geen betrekking heeft op een storing;

      b. een ongestoorde ontvangst, in geval van klachten over de ontvangst van omroepzenders, naar het oordeel van de
      minister, mede gelet op de plaats van de betrokken ontvanginrichting en de betrokken omroepzenders, niet mag worden
      verwacht;

      c. de klacht betrekking heeft op omroepontvangst in niet vast opgestelde voer-en vaartuigen;

      2 Indien een klacht niet in behandeling wordt genomen, wordt hiervan aan de klager onder opgave van redenen binnen
      vier weken na ontvangst van de klacht, schriftelijk mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel3
  - number: '4'
    text: |-
      1 Indien de klacht in behandeling wordt genomen, wordt overeenkomstig het bepaalde in [artikel 5][ref1], een
      onderzoek aan het apparaat dat storing ondervindt of aan het apparaat dat storing veroorzaakt of aan beide
      apparaten, ingesteld. Bij dit onderzoek wordt nagegaan of:

      a. het apparaat aan de beschermingseisen voldoet;

      b. het apparaat geen konstruktiefouten of andere gebreken vertoont, die problemen in de werking van het apparaat
      kunnen veroorzaken;

      c. het gebruik van het apparaat geschiedt in overeenstemming met de gebruiksaanwijzing en de bij of krachtens de
      [Telecommunicatiewet][ref2] gestelde regels;

      d. de eventuele antenne-inrichting, die bij het apparaat wordt gebruikt voldoet aan de bij of krachtens de
      [Telecommunicatiewet][ref3] gestelde eisen, danwel de criteria vermeld in [bijlage 1][ref4] behorend bij deze
      regeling.

      2 Het onderzoek als bedoeld in het vorige lid onder a, vindt voor wat betreft het storing ondervindende apparaat,
      plaats overeenkomstig het gestelde in [bijlage 3][ref5], behorend bij deze regeling.

      3 Naar aanleiding van het onderzoek als bedoeld in het eerste lid wordt een inventarisatie opgemaakt van
      maatregelen welke tot opheffing van de storing kunnen leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0007511#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009950
      [ref3]: https://wetten.overheid.nl/BWBR0009950
