preamble:
  text: |-
    Gelet op de artikelen 20 en 21 van het Besluit elektromagnetische compatibiliteit en de artikelen C.9.5 en F.7.4
    van het Besluit radio-elektrische inrichtingen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
             Besluit:

              het [Besluit elektromagnetische compatibiliteit 2007][ref1];



            b
            storing:

              elektromagnetische storing, ondervonden van het gebruik van apparaten of door een radiozendapparaat
      veroorzaakte belemmering in een ander radiozendapparaat;



            c
             beschermingseisen:

              de beschermingseisen genoemd in [artikel 4, eerste en tweede lid van het Besluit][ref2];



            d
            Agentschap Telecom:

              Agentschap Telecom van het Ministerie van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0021041
      [ref2]: https://wetten.overheid.nl/BWBR0021041#Artikel4
    url: https://wetten.overheid.nl/BWBR0007511/2008-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021041
