$id: wet_toezicht_europese_subsidies
regulatory_layer: WET
publication_date: '2012-06-12'
valid_from: '2002-05-01'
bwb_id: BWBR0013352
url: https://wetten.overheid.nl/BWBR0013352/2002-05-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels vast te stellen betreffende ministeriële
    bevoegdheden ten aanzien van de besteding van subsidies die ten laste komen van de begroting van de Europese Unie;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013352/2002-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013352/2002-05-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister wie het aangaat;'
    url: https://wetten.overheid.nl/BWBR0013352/2002-05-01#Artikel1
  - number: 1.b
    text: |-
      EG-subsidie: een subsidie die door de Raad van de Europese Unie, het Europees Parlement en de Raad gezamenlijk of
      de Commissie van de Europese Gemeenschappen op grond van een vastgesteld programma rechtstreeks of middellijk wordt
      verstrekt, voorzover uit deze subsidie verplichtingen voortvloeien welke bij of krachtens de oprichtingsverdragen
      van de Europese Gemeenschappen op de Staat rusten;
    url: https://wetten.overheid.nl/BWBR0013352/2002-05-01#Artikel1
  - number: 1.c
    text: |-
      betrokken bestuursorgaan: een niet tot de Staat behorend bestuursorgaan dat een EG-subsidie ontvangt dan wel
      belast is met aan de lidstaat bij of krachtens de oprichtingsverdragen van de Europese Gemeenschappen opgelegde
      verplichtingen aangaande beheer, controle of toezicht ten aanzien van EG-subsidies.
    url: https://wetten.overheid.nl/BWBR0013352/2002-05-01#Artikel1
  - number: '2.1'
    text: |-
      Het betrokken bestuursorgaan dat een EG-subsidie ontvangt stelt Onze Minister in kennis van de verstrekte EG-
      subsidie. Deze kennisgeving vermeldt aard en omvang van de activiteiten waarvoor de EG-subsidie wordt verleend en
      de bij of krachtens de oprichtingsverdragen van de Europese Gemeenschappen opgelegde verplichtingen ten aanzien van
      de verstrekking.
    url: https://wetten.overheid.nl/BWBR0013352/2002-05-01#Artikel2
  - number: '2.2'
    text: |-
      Het betrokken bestuursorgaan doet Onze Minister jaarlijks verslag van de wijze waarop de EG-subsidie is aangewend
      dan wel invulling is gegeven aan beheer, controle of toezicht met betrekking tot de verstrekte EG-subsidie.
    url: https://wetten.overheid.nl/BWBR0013352/2002-05-01#Artikel2
  - number: '2.3'
    text: Het betrokken bestuursorgaan verstrekt desgevraagd nadere inlichtingen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013352/2002-05-01#Artikel2
  - number: '2.4'
    text: |-
      Onze Minister kan regels stellen ten aanzien van de wijze van kennisgeving, bedoeld in het eerste lid, de
      periodieke verslaggeving, bedoeld in het tweede lid, en het verstrekken van nadere inlichtingen, bedoeld in het
      derde lid.
    url: https://wetten.overheid.nl/BWBR0013352/2002-05-01#Artikel2
  - number: '2.5'
    text: |-
      Onze Minister wie het aangaat rapporteert, in overleg met Onze Minister van Financiën, jaarlijks aan de beide
      Kamers der Staten-Generaal omtrent de inhoud van de kennisgeving als bedoeld in het eerste lid en de inhoud van de
      jaarlijkse verslagen als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013352/2002-05-01#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister kan het betrokken bestuursorgaan aanwijzingen geven omtrent de rechtmatige en doelmatige
      aanwending van de EG-subsidie dan wel de wijze van beheer, controle of toezicht met betrekking tot de EG-
      subsidie, indien sprake is van verzuim van het betrokken bestuursorgaan in de nakoming van de bij of krachtens de
      oprichtingsverdragen van de Europese Gemeenschappen opgelegde verplichtingen dan wel in geval een dergelijk verzuim
      dreigt te ontstaan. Voorafgaand aan het geven van een dergelijke aanwijzing vindt overleg plaats met het betrokken
      bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0013352/2002-05-01#Artikel3
  - number: '3.2'
    text: |-
      Een aanwijzing als bedoeld in het eerste lid wordt, behoudens in spoedeisende gevallen, niet eerder gegeven dan
      nadat het betrokken bestuursorgaan in de gelegenheid is gesteld om binnen een door Onze Minister gestelde termijn
      alsnog het verzuim te herstellen dan wel een dergelijk verzuim te voorkomen.
    url: https://wetten.overheid.nl/BWBR0013352/2002-05-01#Artikel3
  - number: '4.1'
    text: |-
      In geval de Staat aansprakelijk wordt gesteld door een instelling van de Europese Gemeenschappen voor het verzuim
      van een betrokken bestuursorgaan in de nakoming van bij of krachtens de oprichtingsverdragen van de Europese
      Gemeenschappen opgelegde verplichtingen ten aanzien van de rechtmatige en doelmatige aanwending van de EG-subsidie
      dan wel de wijze van beheer, controle of toezicht met betrekking tot de EG-subsidie en verplicht wordt tot:
    url: https://wetten.overheid.nl/BWBR0013352/2002-05-01#Artikel4
  - number: 4.1.a
    text: het betalen van een forfaitaire som,
    url: https://wetten.overheid.nl/BWBR0013352/2002-05-01#Artikel4
  - number: 4.1.b
    text: het betalen van een dwangsom, of
    url: https://wetten.overheid.nl/BWBR0013352/2002-05-01#Artikel4
  - number: 4.1.c
    text: |-
      het terugbetalen van de aan het betrokken bestuursorgaan verstrekte EG-subsidie vermeerderd met de eventueel
      daarover berekende rente kan Onze Minister besluiten deze bedragen te verhalen op het betrokken bestuursorgaan,
      voorzover de aansprakelijkheid van de Staat het gevolg is van het verzuim van dit bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0013352/2002-05-01#Artikel4
  - number: '4.2'
    text: |-
      Voorafgaand aan het nemen van een besluit tot verhaal als bedoeld in het eerste lid vindt overleg plaats met het
      betrokken bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0013352/2002-05-01#Artikel4
  - number: '4.3'
    text: |-
      Onze Minister kan in overeenstemming met het betrokken bestuursorgaan bedragen die krachtens wettelijk voorschrift
      aan het betrokken bestuursorgaan worden uitbetaald, verrekenen met de op grond van het eerste lid door hem te innen
      bedragen.
    url: https://wetten.overheid.nl/BWBR0013352/2002-05-01#Artikel4
  - number: '5'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst. Indien het Staatsblad waarin deze wet wordt geplaatst, wordt uitgegeven na 1 januari 2002, treedt zij in
      werking met ingang van de eerste dag van de derde kalendermaand na de datum van uitgifte van het Staatsblad waarin
      zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0013352/2002-05-01#Artikel5
  - number: '6'
    text: 'Deze wet wordt aangehaald als: Wet toezicht Europese subsidies.'
    url: https://wetten.overheid.nl/BWBR0013352/2002-05-01#Artikel6
