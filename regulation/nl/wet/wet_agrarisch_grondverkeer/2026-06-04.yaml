  - number: '18'
    text: |-
      In geval van ontbinding van een rechtspersoon behoeft de overdracht krachtens
      [artikel 23, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref1], indien en voor zover tot het batig saldo
      landbouwgrond behoort, de toestemming van de grondkamer. De toestemming wordt verleend indien de verwerver van de
      landbouwgrond voldoet aan het bepaalde bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel23
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel18
