      1 Onze Minister kan in overeenstemming met Onze Minister van Veiligheid en Justitie tarieven vaststellen voor de
      uit hoofde van deze wet door de grondkamer en door de Centrale Grondkamer te verrichten werkzaamheden.

      2 [Artikel 44, tweede lid, van de Uitvoeringswet grondkamers][ref1] is van overeenkomstige toepassing.


