  - number: '16'
    text: |-
      1 Op vordering van of vanwege Onze Minister kan de toestemming, binnen het tijdvak genoemd in
      [artikel 15, eerste lid][ref1], door de grondkamer worden ingetrokken, indien:

      a. de te harer verkrijging verstrekte gegevens zodanig onjuist of onvolledig zijn, dat op het verzoek anders
      beslist zou zijn, als bij de beoordeling daarvan de juiste omstandigheden volledig bekend waren geweest;

      b. de rechtspersoon geen arbeidsovereenkomst heeft met een bedrijfsleider, dan wel indien de rechtspersoon niet
      meer optreedt als verpachter;

      c. de verplichtingen, welke voortvloeien uit [artikel 15, eerste lid][ref2], niet worden nagekomen, dan wel indien
      de toestemming als bedoeld in [artikel 15, tweede lid][ref3], niet is verleend.

      2 Van de intrekking, als bedoeld in het vorige lid, staat beroep open bij de Centrale Grondkamer.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003386#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0003386#Artikel15
