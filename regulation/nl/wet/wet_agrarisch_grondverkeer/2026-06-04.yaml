      Voor de toepassing van artikel 2, eerste lid, wordt met de daar bedoelde notariële verklaring gelijkgesteld
      de verklaring van een persoon die een onderhandse akte tot levering heeft opgesteld en daartoe krachtens
      [artikel 91 van de Overgangswet van het nieuwe Burgerlijk Wetboek][ref1] bevoegd was.


