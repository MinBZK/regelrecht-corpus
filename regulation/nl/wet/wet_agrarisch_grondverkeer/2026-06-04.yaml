  - number: '28'
    text: |-
      1 Er is een bureau beheer landbouwgronden.

      2 Het bureau heeft zijn zetel te 's-Gravenhage.

      3 Het bureau is rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel28
  - number: '29'
    text: |-
      1 Onverminderd het bepaalde in deze wet is het bureau belast met de uitvoering van de door Onze Minister of door
      Onze bij algemene maatregel van bestuur aan te wijzen Ministers opgedragen, op het verkrijgen, tijdelijk beheren of
      vervreemden van onroerende zaken betrekking hebbende op daarmede verwante werkzaamheden.

      2 Bij algemene maatregel van bestuur worden regelen gesteld betreffende het tijdelijk beheer van landbouwgrond,
      verworven ingevolge [artikel 53][ref1] en betreffende de wijze waarop zodanige landbouwgrond door het bureau
      wederom vervreemd dient te worden.

      3 Voor zover het betreft land, verworven in het kader van het voorkeursrecht dan wel land verworven uit anderen
      hoofde stelt Onze Minister in overeenstemming met Onze medebetrokken Ministers regelen betreffende het tijdelijk
      beheer en de wijze waarop zodanig land door het bureau wederom vervreemd dient te worden.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel53
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003386
        artikel: '53'
  - number: '30'
    text: |-
      1 Er is een commissie beheer landbouwgronden. De commissie heeft tot taak:

      a. het geven van de algemene leiding aan het bureau en het houden van toezicht op de werkzaamheden van het bureau;

      b. te beslissen omtrent aanvragen als bedoeld in [artikel 59][ref1];

      c. het verrichten van andere door Onze Minister of door Onze bij algemene maatregel van bestuur aan te wijzen
      Ministers opgedragen werkzaamheden.

      2 De commissie brengt jaarlijks verslag uit aan Onze Minister en Onze bij algemene maatregel van bestuur aan te
      wijzen Ministers over de werkzaamheden van het bureau. Onze Minister regelt de wijze en het tijdstip, waarop het
      verslag wordt uitgebracht. Het verslag wordt door Onze Minister aan de Staten-Generaal medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel59
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003386
        artikel: '59'
  - number: '31'
    text: |-
      1 Wij benoemen en ontslaan de voorzitter van de commissie.

      2 De benoeming en het ontslag van de overige leden geschiedt door Onze Minister, of Onze bij algemene maatregel van
      bestuur aan te wijzen Ministers, ieder tot een bij zodanige maatregel te bepalen aantal.

      3 De commissie bestaat uit ten hoogste 16 leden en is zodanig samengesteld, dat ten minste de helft van het
      aantal leden benoemd is op voordracht van bij algemene maatregel van bestuur aan te wijzen organisaties van
      belanghebbenden.

      4 De directeur van het bureau is secretaris van de commissie.

      5 Onze Minister kan adviserende leden benoemen.

      6 Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de samenstelling, de taak en de
      werkwijze van de commissie, alsmede omtrent het tijdvak waarvoor de leden worden benoemd.
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel31
  - number: '32'
    text: |-
      1 De dagelijkse leiding van het bureau berust bij een door Onze Minister aan te wijzen ambtenaar van het Ministerie
      van Landbouw, Natuur en Voedselkwaliteit, die de functie van directeur vervult.

      2 Het bureau wordt in en buiten rechte vertegenwoordigd door de directeur. Onze Minister stelt daaromtrent nadere
      regelen vast bij in de *Staatscourant* bekend te maken besluit. Onze Minister kan andere personen machtigen het
      bureau in en buiten rechte te vertegenwoordigen.

      3 De directeur van het bureau is verantwoording schuldig aan Onze Minister en is gehouden de opdrachten uit te
      voeren en aanwijzingen op te volgen, welke door Onze Minister of door Onze bij algemene maatregel van bestuur aan
      te wijzen Ministers worden gegeven.

      4 Het bureau heeft geen eigen personeel. Zijn werkzaamheden worden verricht door personen die door Onze Minister
      zijn aangesteld of op arbeidsovereenkomst naar burgerlijk recht in dienst zijn genomen en die deswege rechtstreeks
      ten laste van het Ministerie van Landbouw, Natuur en Voedselkwaliteit worden bezoldigd of beloond.
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel32
  - number: '33'
    text: |-
      1 Het boekjaar van het bureau is gelijk aan het kalenderjaar.

      2 Jaarlijks, vóór 15 oktober stelt de directeur een begroting van inkomsten en uitgaven vast voor het volgende
      kalenderjaar, welke na goedkeuring door de commissie aan Onze Minister ter goedkeuring wordt toegezonden.

      3 Jaarlijks, vóór 1 juli stelt de directeur de rekening en verantwoording, welke in ieder geval bevat een balans
      en een staat van inkomsten en uitgaven over het afgelopen kalenderjaar vast, welke na goedkeuring door de commissie
      aan Onze Minister ter goedkeuring wordt toegezonden. De goedkeuring van de rekening strekt tot décharge van de
      directeur en de commissie.

      4 Het saldo van inkomsten en uitgaven komt ten gunste dan wel ten laste van de rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel33
  - number: '34'
    text: |-
      Maatregelen, welke financiële lasten ten gevolge hebben, en welke niet als verplichting uit deze wet voortvloeien,
      worden door de directeur slechts genomen, voor zover door Onze Minister of Onze bij algemene maatregel van bestuur
      aan te wijzen Ministers daartoe kredieten beschikbaar zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel34
  - number: '35'
    text: |-
      1 Onze Minister stelt in overeenstemming met Onze Minister van Financiën regelen omtrent de begroting, het beheer
      der geldmiddelen en de rekening en verantwoording van het bureau. De regelen worden bekendgemaakt in de Nederlandse
      Staatscourant.

      2 Aan de door Onze Minister aan te wijzen ambtenaren wordt desverlangd inzage gegeven van de boeken en bescheiden
      van het bureau en aan hen worden alle inlichtingen verstrekt, welke zij voor een juist inzicht in het financieel
      beheer van het bureau nodig achten.
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel35
  - number: '36'
    text: |-
      De Staat waarborgt de financiële verplichtingen, welke voor het bureau uit de uitoefening van zijn taak
      voortvloeien.
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel36
  - number: '37'
    text: |-
      1 Overeenkomsten tot vervreemding van land, dat is aangewezen op grond van het derde lid, worden niet ingeschreven
      in de in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1] bedoelde openbare registers, dan
      nadat het bureau in de gelegenheid is gesteld een zodanige overeenkomst te sluiten.

      2 Bij algemene maatregel van bestuur kunnen voor een daarbij te bepalen tijdvak gebieden worden aangewezen,
      waarbinnen land als bedoeld in het eerste lid is gelegen. De maatregel bevat overwegingen omtrent de door het
      vestigen van een voorkeursrecht in zodanig gebied na te streven doeleinden. Als zodanige gebieden kunnen geheel of
      gedeeltelijk worden aangewezen:

      a. landinrichtingsgebieden, vanaf het moment dat overeenkomstig
      [artikel 16.33f, eerste lid, van de Omgevingswet][ref2] een ontwerp voor een inrichtingsbesluit ter inzage wordt
      gelegd;

      b. gebieden welke als reservaat zijn aangewezen;

      c. het gebied Midden-Delfland, zoals dit is vastgesteld op grond van de [Reconstructiewet Midden-Delfland][ref3]
      (*Stb.* 1977, 233);

      d. het gebied Oost-Groningen en de Gronings-Drentse Veenkoloniën, zoals dit is vastgesteld op grond van de
      [Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref4] (*Stb.* 1977, 694);

      e. gebieden, die bij een nationale omgevingsvisie als bedoeld in [artikel 3.1, derde lid, van de Omgevingswet][ref5]
      of programma van Onze Minister die het aangaat als bedoeld in [artikel 3.4 van die wet][ref6] na inwerkingtreding
      van deze wet zijn aangemerkt als gebieden, die als voorkeursgebied kunnen worden aangewezen;

      f. reconstructiegebieden als bedoeld in [artikel 1 van de Reconstructiewet concentratiegebieden][ref7], vanaf het
      moment dat overeenkomstig [artikel 15, tweede lid, van die wet][ref8] het ontwerp van het reconstructieplan ter
      inzage wordt gelegd.

      3 Binnen de op grond van het tweede lid bepaalde gebieden wijzen Wij de gronden aan, waarop het eerste lid van
      toepassing is.

      4 De aanwijzing als bedoeld in het derde lid kan geen gronden omvatten waarop ingevolge
      [artikel 9.1, eerste of tweede lid, van de Omgevingswet][ref9][afdeling 9.2 van die wet][ref10] van toepassing is.

      5 Het voorkeursrecht van het bureau op gronden die begrepen zijn in een aanwijzing als bedoeld in
      het derde lid vervalt, indien na de totstandkoming van Ons besluit op die gronden waarop ingevolge
      [artikel 9.1, eerste of tweede lid, van de Omgevingswet][ref11][afdeling 9.2 van die wet][ref12] van toepassing is.

      6 Een aanwijzing als bedoeld in het derde lid vervalt op het tijdstip waarop met betrekking tot een
      gebied, als bedoeld in het tweede lid, onder *a*, *c* of *d*, het plan van toedeling ter inzage is
      neergelegd overeenkomstig [artikel 199, eerste lid, van de Landinrichtingswet][ref13], onderscheidenlijk
      [artikel 79, tweede lid, van de Reconstructiewet Midden-Delfland][ref14], onderscheidenlijk
      [artikel 83, tweede lid, van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref15].
      De aanwijzing vervalt eveneens één week na het tijdstip waarop niet tot herinrichting, ruilverkaveling dan wel
      aanpassingsinrichting is besloten.

      7 Een aanwijzing als bedoeld in het derde lid vervalt op het tijdstip waarop met betrekking tot een
      gebied, als bedoeld in het tweede lid, onder f, het ruilplan ter inzage is gelegd overeenkomstig
      [artikel 75, eerste lid, van de Reconstructiewet concentratiegebieden][ref16].


