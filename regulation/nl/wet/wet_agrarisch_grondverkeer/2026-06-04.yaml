  - number: '45'
    text: |-
      1 Indien een verzoek als bedoeld in [artikel 44][ref1] aan de rechtbank wordt gedaan, benoemt deze één van haar
      leden als commissaris om, te zamen met de ingevolge [artikel 43][ref2] benoemde deskundigen en vergezeld van een
      griffier, een onderzoek in te stellen om te dien einde de ligging en gesteldheid van het land op te nemen. De
      tijd en plaats van opneming worden door de rechter-commissaris zo spoedig mogelijk bepaald en door de griffier
      medegedeeld aan de deskundigen, zomede aan de partijen die bij de opneming aanwezig kunnen zijn.

      2 Van de opneming maakt de griffier een door de rechter-commissaris en door hemzelf te ondertekenen proces-verbaal
      op. De rechter-commissaris draagt aan de deskundigen op een nader advies over de prijs uit te brengen en stelt
      de dag vast, waarop dit advies ter griffie van de rechtbank zal worden neergelegd. Deze dag zal niet later worden
      bepaald dan uiterlijk drie maanden na de dag van opneming. In het proces-verbaal wordt de dag van de nederlegging
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0003386#Artikel43
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003386
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0003386
        artikel: '43'
  - number: '46'
    text: |-
      In de eerste voor de behandeling van burgerlijke zaken bestemde zitting, welke plaats heeft na afloop van
      één maand na de in [artikel 45, tweede lid][ref1], bedoelde nederlegging, kunnen beide partijen hun belangen
      mondeling onderbouwen. De griffier roept partijen, zomede de deskundigen, op om ter zitting aanwezig
      te zijn. Uiterlijk vier weken na de zitting doet de rechtbank bij beschikking uitspraak over de prijs.
      [Artikel 43, vierde lid, derde en vierde zin][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0003386#Artikel43
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003386
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0003386
        artikel: '43'
  - number: '47'
    text: |-
      1 Binnen een maand na dagtekening van de beschikking van de rechtbank bericht het bureau aan de vervreemder, dat
      het zich met de daarin bepaalde prijs verenigt, of dat het van verwerving afziet.

      2 Ingeval het bureau binnen de in het vorige lid gestelde termijn aan de vervreemder heeft bericht, dat het zich
      met de aldaar bedoelde prijs kan verenigen, is het tot uiterlijk drie maanden na dagtekening van het bericht
      tegenover de vervreemder daaraan gebonden. Indien de vervreemder niet vóór de afloop van die termijn aan het bureau
      heeft bericht, dat hij zich met de prijs kan verenigen, kan hij zich tegenover het bureau niet meer beroepen op het
      bericht, bedoeld in de vorige zin.

      3 Ingeval het bureau binnen de in het eerste lid gestelde termijn aan de vervreemder heeft bericht, dat het bureau
      van verwerking afziet, is [artikel 42, derde lid][ref1], van overeenkomstige toepassing.

      4 Bij overschrijding door het bureau van de in het eerste lid gestelde termijn is [artikel 42, vierde lid][ref2],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0003386#Artikel42
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel47
