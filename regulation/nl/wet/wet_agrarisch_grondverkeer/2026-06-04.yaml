  - number: '58'
    text: Onze Minister stelt nadere regelen vast omtrent de uitgifte alsmede omtrent de bij uitgifte te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel58
  - number: '59'
    text: |-
      1 Op aanvragen tot de uitgifte in erfpacht van landbouwgrond wordt beslist door de commissie beheer
      landbouwgronden.

      2 Onze Minister stelt regelen met betrekking tot de bij een beschikking te volgen werkwijze.

      3 Tegen beschikkingen van de commissie beheer landbouwgronden staat beroep open bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel59
  - number: '60'
    text: |-
      Indien voor een provincie geen regelen zijn gesteld krachtens [artikel 8][ref1] treden voor die provincie de
      artikelen 2-19, met uitzondering van het bepaalde bedoeld in artikel 2, eerste, derde en vierde lid, buiten
      werking.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel8
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel60
