        artikel: '8'
  - number: '61'
    text: |-
      Het is verboden onjuiste of onvolledige opgaven te doen met het oog op het verkrijgen van de goedkeuring van een
      overeenkomst tot vervreemding van land.
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel61
  - number: '62'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, zijn belast de bij besluit van Onze
      Minister daartoe aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.

      3 De toezichthouder beschikt niet over de bevoegdheden, genoemd in de [artikelen 5:15][ref1], [5:18][ref2] en
      [5:19 van de Algemene wet bestuursrecht][ref3].


