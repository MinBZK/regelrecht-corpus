    text: Indien de grondkamer haar goedkeuring aan een overeenkomst onthoudt, verklaart zij deze nietig.
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel11
  - number: '12'
    text: |-
      Onverminderd het bepaalde in de [artikelen 6, tweede lid][ref1], [7][ref2] en [37, eerste lid][ref3], wordt een
      overeenkomst tot vervreemding van landbouwgrond aan een rechtspersoon goedgekeurd, indien:

      a. de grondkamer de rechtspersoon toestemming verleent tot het sluiten van een zodanige overeenkomst;

      b. voldaan wordt, hetzij aan het bepaalde bij of krachtens [artikel 8, tweede of vierde lid][ref4], hetzij aan het
      bepaalde bij of krachtens [artikel 9][ref5].


