  - number: '14'
    text: |-
      1 Toestemming, als bedoeld in [artikel 12, onder a][ref1], kan worden geweigerd:

      a. indien redelijkerwijs moet worden aangenomen, dat de feitelijke toestand niet met het in het verzoek vermelde in
      overeenstemming zal zijn;

      b. indien bij het verzoek een arbeidsovereenkomst met de bedrijfsleider, die op het bedrijf werkzaam zal zijn,
      is overgelegd:

      1°. indien niet wordt aangetoond, dat de bedrijfsleider voldoet aan bij algemene maatregel van bestuur te stellen
      vereisten met betrekking tot opleiding, ervaring of hoofdberoep.

      2°. indien redelijkerwijs moet worden aangenomen, dat de bedrijfsleider niet duurzaam met de leiding van het
      bedrijf belast zal zijn;

      3°. indien redelijkerwijs moet worden aangenomen, dat de bedrijfsleider tevens bedrijfsleider buiten het betrokken
      bedrijf zal zijn;

      c. indien bij het verzoek een pachtovereenkomst of een ontwerp-pachtovereenkomst met betrekking tot de te
      vervreemden landbouwgrond is overgelegd:

      1°. indien redelijkerwijs moet worden aangenomen, dat partijen niet werkelijk bedoelen de pachtovereenkomst tot
      stand te brengen, dan wel de pachtovereenkomst duurzaam in stand te houden;

      2°. indien redelijkerwijs moet worden aangenomen, dat de pachtovereenkomst binnen afzienbare tijd zal eindigen en
      niet aanstonds door een ander zal worden vervangen.

      2 Bij algemene maatregel van bestuur kunnen nadere regelen worden gesteld met betrekking tot de weigeringsgronden
      als omschreven in het vorige lid.

      3 Ingeval de toestemming niet verleend wordt, staat beroep open bij de Centrale Grondkamer.

      4 Ingeval de toestemming wordt verleend, worden de gegevens bedoeld in [artikel 13][ref2] in afwijking van
      [artikel 6, eerste lid, van de Uitvoeringswet grondkamers][ref3], onverwijld aan Onze Minister overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003386#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0021912#Artikel6
