  - number: '9'
    text: |-
      Een overeenkomst tot vervreemding van landbouwgrond, gelegen binnen een gebied waarvoor op grond van
      [artikel 8][ref1] vereisten ten aanzien van landbouwgrond zijn gesteld, wordt door de grondkamer goedgekeurd,
      indien de verwerver aannemelijk maakt, dat hij de landbouwgrond zal gebruiken voor een produktierichting, waarvoor
      op grond van [artikel 8][ref2] geen vereisten zijn gesteld, of ter uitoefening van een bij algemene maatregel van
      bestuur aan te wijzen beroep, en indien:

      a. de aard en de omvang van de te vervreemden landbouwgrond, en de eventueel daarop aanwezige opstallen, geschikt
      zijn voor het opgegeven gebruik;

      b. de verwerver voldoende garanties biedt, dat het opgegeven gebruik zal worden verwezenlijkt;

      c. de verwerver, indien deze een natuurlijke persoon is, voldoet aan vereisten met betrekking tot opleiding,
      ervaring of hoofdberoep die bij algemene maatregel van bestuur kunnen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003386#Artikel8
