    text: |-
      1 Een overeenkomst tot vervreemding van een landgoed wordt door de grondkamer goedgekeurd, indien het aannemelijk
      is, dat de verwerver het landgoed als eenheid in stand zal houden.

      2 Onder een landgoed wordt verstaan:

      a. een complex, aangemerkt als landgoed in de zin van [artikel 1 van de Natuurschoonwet 1928][ref1] (*Stb.* 63);

      b. andere geheel of gedeeltelijk met bos of andere houtopstanden bezette terreinen, waarvan het voortbestaan uit
      oogpunt van maatschappelijk belang wenselijk is, en die door Onze Minister zijn aangewezen als landgoed in de zin
      van deze wet.

      3 Een aanwijzing, als bedoeld in het vorige lid, onder b, geschiedt op verzoek van de eigenaar of op verzoek van
      meerdere eigenaren gezamenlijk.

      4 Een aanwijzing, als bedoeld in het tweede lid, onder b, heeft ten gevolge dat het land voor twee jaren, te
      rekenen vanaf de dagtekening van de beschikking wordt aangemerkt als een landgoed.

      5 Tegen de weigering van een aanwijzing als bedoeld in het tweede lid, onder b, staat beroep open op de Centrale
      Grondkamer.


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel1
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel7
