      1 De kosten van de in [artikel 45][ref1] omschreven procedure, de kosten van het advies bedoeld in
      [artikel 45, tweede lid][ref2], de kosten van de deskundigen, verbonden aan het bijwonen van de in
      [artikel 46][ref3] bedoelde zitting, alsmede de redelijkerwijze door de vervreemder voor rechtsbijstand en andere
      deskundige bijstand gemaakte kosten, komen ten laste van het bureau, met dien verstande echter dat de rechtbank,
      indien zij daartoe termen vindt in de omstandigheden van het geval, bevoegd is de kosten geheel of gedeeltelijk
      te compenseren.

      2 [Artikel 50, tweede lid][ref4], is van overeenkomstige toepassing.


