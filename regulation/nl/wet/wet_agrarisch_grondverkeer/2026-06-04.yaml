  - number: '41'
    text: |-
      1 Ter voldoening aan het bepaalde in [artikel 37, eerste lid][ref1], verstrekt de vervreemder een schriftelijke
      opgave aan het bureau van het land waarop de overeenkomst tot vervreemding betrekking heeft, zomede van de
      kadastrale aanduiding en van de oppervlakte van het land.

      2 Indien de overeenkomst tot vervreemding van land betrekking heeft op gronden die slechts ten dele in de
      aanwijzing bedoeld in [artikel 37, derde lid][ref2], zijn opgenomen, maar een samenhangend geheel vormen, kan de
      vervreemder eisen, dat dit geheel van onroerende zaken wordt betrokken bij de vervreemding aan het bureau.

      3 Indien de overeenkomst betrekking heeft op een bedrijf, als onderdeel waarvan de onroerende zaken die zijn
      opgenomen in de aanwijzing bedoeld in [artikel 37, derde lid][ref3], worden geëxploiteerd, kan de vervreemder
      eisen, dat het gehele bedrijf wordt betrokken bij de vervreemding aan het bureau. Desgevraagd maakt hij
      aannemelijk, dat anders de bestaansgrondslag aan het bedrijf zou komen te ontvallen.

      4 Het bureau bevestigt ten spoedigste schriftelijk de ontvangst van de opgave.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0003386#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0003386#Artikel37
