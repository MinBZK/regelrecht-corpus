    text: |-
      1 De grondkamer of de Centrale Grondkamer is bevoegd een mondelinge behandeling te gelasten van het bij haar
      ingediende verzoek op een door haar te bepalen zitting.

      2 De grondkamer of de Centrale Grondkamer is op verzoek van één der partijen verplicht een mondelinge behandeling
      te gelasten van het bij haar ingediende verzoek op een door haar te bepalen zitting.

      3 De secretaris roept de partijen op voor de mondelinge behandeling.
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel24
