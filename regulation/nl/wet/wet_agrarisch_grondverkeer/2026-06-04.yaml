  - number: '51'
    text: |-
      1 Onze Minister kan de nietigheid inroepen:

      a. van de overdracht of uitgifte van aandelen of certificaten van aandelen in besloten en naamloze
      vennootschappen tenzij van deze vennootschappen de aandelen of certificaten van aandelen zijn toegelaten
      tot de handel op een gereglementeerde markt of een multilaterale handelsfaciliteit, als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1] of een met een gereglementeerde markt of
      multilaterale handelsfaciliteit vergelijkbaar systeem uit een staat die geen lidstaat is als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref2], dan wel van de totstandbrenging of de overdracht
      van lidmaatschaps- of andere rechten in andere rechtspersonen ofwel van niet niet tot de handel op een zodanige
      markt toegelaten certificaatrechten of dergelijke deelnemingsrechten op land of beperkte rechten waaraan land is
      onderworpen, een en ander indien de vennootschappen of rechtspersonen onmiddellijk of middellijk eigenaar zijn
      van land of rechthebbende zijn op beperkte rechten waaraan dat land is onderworpen, dan wel certificaatrechten
      betrekking hebben op land of zulke beperkte rechten, en indien dat land is opgenomen in een besluit, als bedoeld in
      [artikel 37, derde lid][ref3];

      b. van de toedeling van onder a bedoelde aandelen, certificaten of rechten, in geval van ontbinding van enige
      gemeenschap met uitzondering van de huwelijksgemeenschap, de gemeenschap van een geregistreerd partnerschap of
      een nalatenschap.

      2 De nietigheid kan volgens het vorige lid worden ingeroepen op grond dat de overdracht, uitgifte of toedeling
      plaats vond met de kennelijke strekking, afbreuk te doen aan het belang van het bureau bij haar in deze wet
      geregelde voorkeurspositie.

      3 Het verzoek moet worden gedaan binnen twee maanden nadat de overdracht, uitgifte of toedeling ter kennis van
      Onze Minister is gekomen bij de rechtbank van het arrondissement binnen welker ressort het betreffende land is
      gelegen, de rechtspersoon haar woonplaats heeft dan wel de vennootschap of maatschappij is gevestigd. Onze Minister
      is niet ontvankelijk in zijn verzoek indien het bureau met de overdracht, uitgifte of toedeling schriftelijk heeft
      ingestemd.

      4 De vorige leden zijn van overeenkomstige toepassing in geval
      van een verkoop krachtens de [Eerste Afdeling A][ref4] of
      [Eerste Afdeling B van de Tweede Titel van het Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref5]
      dan wel ingevolge [artikel 248 van Boek 3 van het Burgerlijk Wetboek][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel11
