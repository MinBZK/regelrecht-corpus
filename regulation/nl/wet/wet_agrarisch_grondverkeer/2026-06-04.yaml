  - number: '13'
    text: |-
      De verzoeker dient ten behoeve van de toestemming als bedoeld in [artikel 12, onder ][ref1] de navolgende gegevens
      over te leggen:

      a. de rechtsvorm;

      b. de naam van de rechtspersoon;

      c. de arbeidsovereenkomst met de bedrijfsleider, dan wel een goedgekeurde pachtovereenkomst of ontwerp-
      pachtovereenkomst met betrekking tot de te vervreemden landbouwgrond;

      d. de statuten, voor zover de rechtspersoon deze heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel12
