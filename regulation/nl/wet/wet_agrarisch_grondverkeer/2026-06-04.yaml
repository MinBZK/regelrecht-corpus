    text: |-
      1 Het verzoek om goedkeuring dan wel toestemming moet worden ingediend bij de grondkamer, bedoeld in
      [artikel 22 van de Uitvoeringswet grondkamers][ref1].

      2 De grondkamer tekent de datum van ontvangst van een verzoek om goedkeuring onverwijld daarop aan.


      [ref1]: https://wetten.overheid.nl/BWBR0021912#Artikel22
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel21
