  - number: '57'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat het bureau kan overgaan tot de uitgifte in
      erfpacht van landbouwgrond aan een ondernemer in de landbouw, in bij zodanige maatregel te bepalen gevallen.

      2 Na afloop van het tijdvak waarvoor de landbouwgrond in erfpacht is uitgegeven, heeft de
      erfpachter de mogelijkheid de landbouwgrond te kopen tegen de werkelijke waarde als omschreven in
      [artikel 43, vierde lid, derde en vierde zin][ref1].

      3 De erfpachter heeft de in het tweede lid omschreven mogelijkheid, indien hij een daartoe strekkend verzoek
      ten minste één jaar en ten hoogste drie jaar voor het tijdstip waarop de erfpacht eindigt, bij het bureau heeft
      ingediend.

      4 Indien met het bureau geen overeenstemming over de prijs wordt verkregen, kan de erfpachter een verzoek
      richten tot de rechtbank binnen welks rechtsgebied het desbetreffende land geheel of grotendeels is gelegen. De
      [artikelen 45][ref2] en [46][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0003386#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0003386#Artikel46
