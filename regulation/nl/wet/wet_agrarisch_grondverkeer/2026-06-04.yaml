  - number: '64'
    text: |-
      1 Onze Minister verleent op aanvraag ontheffing van het bepaalde bij of krachtens de [artikelen 8][ref1],
      [9][ref2] en [14, eerste lid, onder b, sub 1°][ref3], indien naar zijn oordeel sprake is van een bijzondere
      omstandigheid en gewichtige belangen tot het verlenen van een ontheffing aanleiding geven.

      2 In afwijking van het bepaalde in het eerste lid verleent Onze Minister ontheffing van het bepaalde krachtens
      [artikel 8, derde lid][ref4].

      3 Een ontheffing kan onder beperkingen worden verleend; aan de ontheffing kunnen voorschriften worden verbonden.

      4 Bij of krachtens algemene maatregel van bestuur worden regelen gesteld met betrekking tot de procedure die bij
      het aanvragen van een ontheffing moet worden gevolgd, alsmede met betrekking tot de beslissing omtrent de aanvraag.

      5 Tegen een beschikking van Onze Minister omtrent de verlening, de weigering, de verlenging of de intrekking van
      een ontheffing staat beroep open bij de Centrale Grondkamer.


