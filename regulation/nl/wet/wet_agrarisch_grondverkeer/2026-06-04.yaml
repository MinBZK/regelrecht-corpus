    text: |-
      1 Een overeenkomst tot vervreemding van landbouwgrond aan een natuurlijke persoon wordt door de grondkamer
      goedgekeurd, indien een goedgekeurde pachtovereenkomst of ontwerp-pachtovereenkomst met betrekking tot de te
      vervreemden landbouwgrond wordt overgelegd.

      2 De [artikelen 14, eerste lid, onder ][ref1], [15][ref2], [16][ref3], [17][ref4], zijn in geval van een
      goedkeuring als bedoeld in het vorige lid van overeenkomstige toepassing, met dien verstande dat voor "toestemming"
      telkens "goedkeuring" moet worden gelezen.


