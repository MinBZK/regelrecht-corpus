preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen met betrekking tot een toetsing
    bij de vervreemding van landbouwgronden en natuurterreinen ter bevordering van een evenwichtige prijsontwikkeling,
    alsmede met betrekking tot de totstandkoming van een voorkeursrecht voor het bureau beheer landbouwgronden bij de
    verwerving van landbouwgronden en natuurterreinen.

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      Onze Minister: Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

      landbouw: akkerbouw, veehouderij - daaronder begrepen intensieve veehouderij -, tuinbouw - daaronder begrepen
      fruitteelt en het kweken van bomen, bloemen en bloembollen -, bosbouw en elke andere vorm van bodemcultuur;

      land: landbouwgrond en natuurterreinen;

      landbouwgrond: grond, waarop enige vorm van landbouw wordt of onmiddellijk kan worden uitgeoefend;

      natuurterreinen: heidevelden, hoogveenterrein, zandverstuivingen, duinterreinen, kwelders, schorren, gorzen,
      slikken, riet- en ruigtlanden, laagveenmoerassen, voor zover het geen landbouwgrond is;

      beperkt recht: het recht van erfpacht, opstal, beklemming of vruchtgebruik;

      vervreemding: de overdracht in eigendom of de toedeling van een onroerende zaak alsmede de overdracht of toedeling
      dan wel vestiging van een beperkt recht waaraan een onroerende zaak is onderworpen;

      vervreemder: de eigenaar van een onroerende zaak of de rechthebbende op een beperkt recht waaraan een onroerende
      zaak is onderworpen, die tot vervreemding wenst over te gaan, alsmede degene die bij ontbinding van een gemeenschap
      met de vereffening is belast en tot vervreemding wenst over te gaan;

      bedrijf: een complex, bestaande uit een of meer gebouwen of gedeelten daarvan en de daarbij behorende landbouwgrond
      dienende tot uitoefening van de landbouw;

      bedrijfsleider: de natuurlijke persoon die leiding geeft aan een in de vorm van een privaatrechtelijke
      rechtspersoon gedreven bedrijf;

      bureau: bureau beheer landbouwgronden als bedoeld in [artikel 28][ref1];

      hoofdberoep: het beroep, waaruit een persoon in overwegende mate zijn inkomsten trekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel28
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel1
