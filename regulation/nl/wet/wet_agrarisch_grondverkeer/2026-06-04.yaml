  - number: '20'
    text: |-
      1 Het verzoek om goedkeuring als bedoeld in [artikel 6, eerste lid][ref1], dan wel toestemming als bedoeld in de
      [artikelen 12, onder a][ref2], [15, tweede lid][ref3], en [18][ref4], wordt ingediend op een bij de grondkamer
      verkrijgbaar, volledig ingevuld formulier en onder overlegging van drie afschriften van de overeenkomst tot
      vervreemding van land, alsmede een opgave van de kadastrale aanduiding van de onroerende zaken waarop die
      overeenkomst betrekking heeft, en van de grootte van elk der desbetreffende percelen en perceelsgedeelten.

      2 Het model van het in het vorige lid bedoelde formulier wordt door Onze Minister vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel6
