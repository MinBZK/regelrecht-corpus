    text: |-
      1 Indien krachtens de [Titels II][ref1] of [III][ref2] geen vereisten met betrekking tot overeenkomsten tot
      vervreemding van land zijn gesteld is [artikel 53][ref3] niet van toepassing.

      2 Indien de nadere vereisten met betrekking tot de vervreemding van land zich beperken tot de vereisten gesteld
      krachtens [artikel 8, tweede lid, onder ][ref4] of [artikel 14, eerste lid, onder ][ref5], is [artikel 53][ref6]
      niet van toepassing.

      3 De Staat, een provincie, een gemeente, een rechtspersoonlijkheid bezittend lichaam, als bedoeld in de
      [Wet gemeenschappelijke regelingen][ref7], een waterschap, een veenschap of een veenpolder kunnen geen toepassing
      van [artikel 53][ref8] verzoeken.


