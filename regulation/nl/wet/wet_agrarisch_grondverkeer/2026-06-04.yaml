        artikel: '37'
  - number: '42'
    text: |-
      1 Binnen twee maanden na de ontvangst van de in [artikel 41, eerste lid][ref1], bedoelde opgave beslist het bureau
      of het in beginsel het land of het beperkte recht wenst te verwerven.

      2 Het bureau doet binnen de in het eerste lid genoemde termijn mededeling van zijn beschikking aan degene die tot
      vervreemding wenst over te gaan. Indien het bureau te kennen geeft een overeenkomst te willen sluiten, houdt de
      mededeling een bod in op de te vervreemden zaken.

      3 Indien het bureau binnen de in het eerste lid bedoelde termijn heeft bericht, dat het het land of het beperkte
      recht niet wenst te verwerven, heeft de vervreemder gedurende het tijdvak van één jaar na ontvangst van dat bericht
      de vrijheid om, onverminderd het bepaalde in de [Titels II][ref2] en [III][ref3], met derden een overeenkomst tot
      vervreemding aan te gaan, in dier voege dat de vervreemding moet betreffen al het in zijn opgave vermelde land of
      beperkte rechten, met inbegrip van het gedeelte van het bedrijf, waarvan de vervreemder bij het verstrekken van
      die opgave, ingevolge [artikel 41, tweede en derde lid][ref4], heeft geëist, dat het mede bij de vervreemding zou
      worden betrokken.

      4 Bij overschrijding door het bureau van de in het eerste lid genoemde termijn is het bepaalde in het vorige
      lid van overeenkomstige toepassing, met dien verstande, dat het aldaar genoemde tijdvak van één jaar aanvangt na
      verloop van die termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0003386
      [ref3]: https://wetten.overheid.nl/BWBR0003386
      [ref4]: https://wetten.overheid.nl/BWBR0003386#Artikel41
