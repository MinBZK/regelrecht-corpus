      - id: ref1
        bwb_id: BWBR0003386
        artikel: '37'
  - number: '39'
    text: |-
      1 De aanwijzing, bedoeld in [artikel 37, derde lid][ref1], vermeldt, onder verwijzing naar een bijgevoegde
      kadastrale kaart, ten aanzien van de onroerende zaken waarop zij betrekking heeft, de kadastrale aanduiding
      daarvan, de grootte van elk der desbetreffende percelen volgens de basisregistratie kadaster en, indien een in de
      aanwijzing opgenomen onroerende zaak een gedeelte van een perceel uitmaakt, bovendien de grootte van dat gedeelte.

      2 Het bureau doet mededeling van de aanwijzing, bedoeld in [artikel 37, derde lid][ref2], aan iedere eigenaar van
      de in de aanwijzing begrepen gronden, alsmede aan iedere rechthebbende op een beperkt recht waaraan die gronden
      zijn onderworpen. Deze mededeling bevat een beschrijving van de betekenis van de aanwijzing. Indien de gronden niet
      langer begrepen zijn in een aanwijzing als bedoeld in [artikel 37, derde lid][ref3], dan wel indien het bepaalde
      in [artikel 37, vijfde of zesde lid][ref4], zich voordoet, doet het bureau hiervan op overeenkomstige wijze
      mededeling.

      3 De aanwijzing, bedoeld in [artikel 37, derde lid][ref5], treedt in werking een week na de datum van uitgifte van
      de Staatscourant waarin zij is geplaatst.


