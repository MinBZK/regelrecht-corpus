        artikel: '1'
  - number: '8'
    text: |-
      1 Onverminderd het bepaalde in de [artikelen 6, tweede lid][ref1], [7][ref2] en [37, eerste lid][ref3], verleent
      de grondkamer haar goedkeuring aan een overeenkomst tot vervreemding van land, indien wordt voldaan aan vereisten,
      welke bij algemene maatregel van bestuur kunnen worden gesteld. Deze vereisten kunnen verschillen naar gelang de
      produktierichting van de bedrijven die bij de vervreemding betrokken zijn en naar gelang het gebied waarin het land
      gelegen is.

      2 Voor zover het landbouwgrond betreft kunnen de in het vorige lid bedoelde vereisten uitsluitend betrekking hebben
      op:

      a. de opleiding, de ervaring of het hoofdberoep van de verwerver, voor zover deze een natuurlijk persoon is;

      b. indien het betreft de vervreemding van een geheel bedrijf, dat niet wordt toegevoegd aan een ander bedrijf: de
      verkaveling van de landbouwgrond;

      c. indien het betreft de vervreemding van een bedrijf ter toevoeging aan een ander bedrijf: de maximale
      bedrijfsoppervlakte na toevoeging en de verkaveling van de toe te voegen landbouwgrond, mede ten opzichte van het
      bedrijf van de verwerver;

      d. indien het betreft de vervreemding van losse landbouwgrond: de maximale bedrijfsoppervlakte na toevoeging, de
      verkaveling van de toe te voegen landbouwgrond, mede ten opzichte van het bedrijf van de verwerver.

      3 Voor zover het natuurterreinen betreft kunnen in de in het eerste lid bedoelde vereisten uitsluitend betrekking
      hebben op:

      a. de hoedanigheid van de verwerver;

      b. het tegengaan van versnippering van natuurterrein;

      c. de garanties, die de verwerver moet bieden voor de instandhouding van het natuurterrein.

      4 Ten aanzien van overeenkomsten tot vervreemding van landbouwgrond gelegen binnen gebieden, waarin de uitoefening
      van de landbouw mede gericht dient te zijn op doeleinden van natuur- of landschapsbehoud, dan wel gelegen binnen
      gebieden, waarin het beheer in de toekomst uitsluitend of nagenoeg uitsluitend gericht zal zijn op doeleinden
      van natuur- of landschapsbehoud, kunnen bij algemene maatregel van bestuur nadere vereisten worden gesteld. Deze
      vereisten kunnen afwijkingen inhouden van de vereisten bedoeld in het tweede lid. De nadere vereisten kunnen niet
      de verplichting inhouden tot het afsluiten van een beheersovereenkomst, dan wel betrekking hebben op specifieke
      ervaring met landbouw, zoals in deze gebieden wordt nagestreefd.

      5 Een krachtens het eerste lid vastgestelde maatregel wordt aan de beide Kamers der Staten-Generaal overgelegd.
      Binnen 30 dagen na de overlegging kan door ten minste een vijfde van het grondwettelijk aantal leden van één der
      Kamers de wens te kennen worden gegeven dat het in de maatregel te regelen onderwerp bij de wet wordt geregeld.
      Indien zodanige wens te kennen is gegeven, dienen wij zo spoedig mogelijk een desbetreffend wetsontwerp in. De
      maatregel treedt in werking met ingang van een door Ons te bepalen tijdstip, dat niet eerder gelegen zal zijn dan
      nadat dertig dagen na de overlegging zijn verstreken, indien gedurende die termijn niet door of namens één der
      Kamers of door ten minste een vijfde van het grondwettelijk aantal leden van één der Kamers de wens wordt te kennen
      gegeven, dat de inwerkingtreding van de maatregel bij de wet zal worden geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003386#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003386#Artikel37
