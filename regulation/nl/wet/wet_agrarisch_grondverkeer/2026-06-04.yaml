        artikel: '42'
  - number: '48'
    text: |-
      Gedurende drie maanden na dagtekening van de beschikking van de rechtbank als bedoeld in [artikel 46][ref1], is het
      bureau, indien de vervreemder zulks verlangt, verplicht zijn medewerking te verlenen aan de totstandkoming van een
      akte tot levering aan hem van het betrokken land of beperkte recht tegen betaling aan de vervreemder van de door de
      rechtbank bij haar beschikking bepaalde prijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel46
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003386
        artikel: '46'
  - number: '49'
    text: |-
      De beschikking, bedoeld in [artikel 46][ref1] is niet vatbaar voor beroep of cassatie.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel46
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003386
        artikel: '46'
  - number: '50'
    text: |-
      1 De kosten van de in [artikel 44][ref1] en [45][ref2] omschreven procedures, de kosten van het in
      [artikel 43][ref3] bedoelde advies van de deskundigen, de kosten van het nader advies, bedoeld in
      [artikel 45, tweede lid][ref4], de kosten van de deskundigen, verbonden aan het bijwonen van de in
      [artikel 46][ref5] bedoelde zitting, alsmede de redelijkerwijze door de vervreemder voor rechtsbijstand en andere
      deskundige bijstand gemaakte kosten, komen ten laste van het bureau, met dien verstande echter dat de rechtbank,
      indien zij daartoe termen vindt in de omstandigheden van het geval, bevoegd is de kosten geheel of gedeeltelijk
      te compenseren.

      2 De beschikking van de rechtbank is, voor zover het betreft de daarin opgenomen kostenveroordeling, vatbaar voor
      tenuitvoerlegging.


