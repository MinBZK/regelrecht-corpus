  - number: '38'
    text: |-
      De aanwijzing, bedoeld in [artikel 37, derde lid][ref1], wordt bekendgemaakt door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel37
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel38
