  - number: '22'
    text: |-
      1 Zij, die voornemens zijn een overeenkomst tot vervreemding van land aan te gaan, zijn bevoegd een ontwerp-
      overeenkomst ter goedkeuring aan de grondkamer in te zenden.

      2 Het verzoek tot goedkeuring dient te zijn ondertekend door degenen, die in de ontwerp-overeenkomst als partijen
      zijn genoemd of door hun gemachtigden.

      3 Het verzoek om goedkeuring wordt ingediend op een volledig ingevuld formulier als bedoeld in
      [artikel 20, eerste lid, onder][ref1] overlegging van drie afschriften van de ontwerp-overeenkomst, alsmede een
      opgave van de kadastrale aanduiding van de onroerende zaken waarop die ontwerp-overeenkomst betrekking heeft, en
      van de grootte van elk der desbetreffende percelen en perceelsgedeelten.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel20
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003386
        artikel: '20'
  - number: '23'
    text: |-
      1 De grondkamer beoordeelt een ontwerp-overeenkomst als bedoeld in [artikel 22][ref1] met toepassing van
      de[ Titels II][ref2] en [III][ref3]; zij kan haar goedkeuring afhankelijk stellen van wijzigingen, welke zij nodig
      oordeelt.

      2 Indien binnen twee maanden nadat de grondkamer of de Centrale Grondkamer een goedgekeurde ontwerp-
      overeenkomst aan ieder der partijen heeft verzonden, een overeenkomst wordt ingezonden, die gelijk is
      aan de ontwerp-overeenkomst, zoals deze werd goedgekeurd, is de grondkamer onverminderd het bepaalde in
      [artikel 37, eerste lid][ref4], tot goedkeuring gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel22
