    text: |-
      1 Indien de grondkamer aan een overeenkomst of een ontwerp-overeenkomst haar goedkeuring onthoudt, of weigert
      een verklaring als bedoeld in artikel 2, tweede lid, onder c, af te geven, staat de betrokkenen beroep open op de
      Centrale Grondkamer.

      2 De [artikelen 37 tot en met 42 van de Uitvoeringswet grondkamers][ref1] zijn van overeenkomstige toepassing, met
      dien verstande, dat [artikel 37, vierde lid, van de Uitvoeringswet grondkamers][ref2], wordt gelezen als betrekking
      hebbend op een overeenkomst of een ontwerp-overeenkomst als bedoeld in deze wet.


