  - number: '15'
    text: |-
      1 Indien binnen een tijdvak van zeven jaren na het tijdstip van de toestemming wijziging optreedt in de aan de
      grondkamer overgelegde gegevens, dienen deze wijzigingen binnen één maand aan de grondkamer te worden gemeld.

      2 Voor zover de wijziging betreft een overeenkomst met een nieuwe bedrijfsleider dan wel met een nieuwe pachter,
      behoeft deze wijziging de toestemming van de grondkamer.

      3 De in het vorige lid bedoelde toestemming wordt verleend, indien voldaan wordt aan het bepaalde bij of krachtens
      [artikel 14, eerste lid][ref1].

      4 De in het eerste lid bedoelde gegevens worden, in afwijking van
      [artikel 6, eerste lid, van de Uitvoeringswet grondkamers][ref2], onverwijld aan Onze Minister overgelegd, tenzij
      het tweede lid toepassing vindt. In het laatste geval worden de gegevens overgelegd nadat de grondkamer heeft
      beslist over de aldaar bedoelde toestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0021912#Artikel6
