  - number: '53'
    text: |-
      1 Een ieder die wil overgaan tot overdracht in eigendom van land of tot overdracht van een recht van beklemming
      daarop kan de rechtbank bedoeld in [artikel 43, eerste lid][ref1], verzoeken te bepalen, dat het bureau gehouden is
      medewerking te verlenen aan de totstandkoming van een akte houdende een overeenkomst tot overdracht in eigendom van
      land of tot overdracht van een recht van beklemming daarop aan het bureau tegen betaling aan de vervreemder van de
      door de rechtbank bij beschikking te bepalen prijs.

      2 De [artikelen 43, eerste, derde, vierde lid, eerste volzin en vijfde lid][ref2],
      [44, eerste en tweede lid][ref3], [45][ref4] en [46][ref5] zijn van overeenkomstige toepassing met dien verstande,
      dat de verkeerswaarde als agrarische grond wordt gehanteerd als grondslag voor het bepalen van de prijs. Indien het
      land betreft waarop bosbouw wordt uitgeoefend, wordt de verkeerswaarde als bosgrond als prijsgrondslag gehanteerd.
      Indien het natuurterreinen betreft, wordt de desbetreffende verkeerswaarde gehanteerd.

      3 Het verzoek als bedoeld in het eerste lid kan, in geval van een executoriale verkoop, op verzoek van de
      executant worden gedaan door degene te wiens overstaan de openbare verkoop geschiedt, binnen veertien dagen na het
      plaatsvinden van zodanige verkoop.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel43
