  - number: '43'
    text: |-
      1 Indien het bureau in onderhandeling is getreden over het aangaan van een overeenkomst tot vervreemding, kan de
      vervreemder het bureau de wens te kennen geven, dat over de prijs advies zal worden uitgebracht door deskundigen,
      te benoemen door de rechtbank binnen welks rechtsgebied het desbetreffende land geheel of grotendeels is gelegen.
      Binnen twee weken na ontvangst van het desbetreffende schriftelijke verzoek van de vervreemder, verzoekt het bureau
      de rechtbank één of meer deskundigen te benoemen, ten einde het bedoelde advies uit te brengen.

      2 Bij overschrijding door het bureau van de in het vorige lid bedoelde termijn is [artikel 42, derde lid][ref1],
      van overeenkomstige toepassing.

      3 Bij het verzoekschrift legt het bureau een gewaarmerkt afschrift van het verzoek van de vervreemder over.

      4 De rechtbank benoemt één of meer deskundigen die zo spoedig mogelijk een met redenen omkleed schriftelijk
      advies uitbrengen. De deskundigen stellen hun advies vast met overeenkomstige toepassing van de
      [artikelen 15.22 tot en met 15.25 van de Omgevingswet][ref2].

      5 De kosten van het verzoek en van het advies van deskundigen komen ten laste van het bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel15.22
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel43
