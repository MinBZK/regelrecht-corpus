        artikel: '15.22'
  - number: '44'
    text: |-
      1 Binnen een maand na dagtekening van het in [artikel 43][ref1] bedoelde advies kan het bureau met redenen omkleed
      de rechtbank verzoeken een oordeel over de prijs te geven, of aan de vervreemder berichten, dat het zich met het
      advies kan verenigen.

      2 Ingeval het bureau binnen de in het eerste lid gestelde termijn aan de vervreemder heeft bericht, dat het zich
      met het advies van de deskundigen kan verenigen, is het bureau behoudens het bepaalde in het volgende lid tot
      uiterlijk drie maanden na dagtekening van het bericht tegenover de vervreemder daaraan gebonden. Tot het einde van
      die termijn kan de vervreemder de rechtbank met redenen omkleed verzoeken, een oordeel over de prijs te geven, of
      aan het bureau berichten dat hij zich met het advies kan verenigen, dan wel, dat hij afziet van de sluiting van een
      overeenkomst tot vervreemding. Indien de vervreemder niet vóór afloop van die termijn aan het bureau heeft bericht
      dat hij zich met het advies kan verenigen, kan hij zich tegenover hem niet meer beroepen op het bericht bedoeld in
      de eerste zin van dit lid.

      3 Ingeval de vervreemder binnen de in het vorige lid gestelde termijn van drie maanden het aldaar bedoelde verzoek
      aan de rechtbank heeft gedaan, kan het bureau hem binnen veertien dagen na dagtekening van dat verzoek berichten
      dat het bureau alsnog van de aankoop afziet. Bij gebreke aan zodanig bericht geldt na afloop van laatstgenoemde
      termijn [artikel 48][ref2].

      4 Ingeval het bureau binnen de in het eerste lid genoemde termijn van een maand of binnen de in het derde lid
      gestelde termijn van veertien dagen aan de vervreemder heeft bericht, dat het bureau van de koop afziet, is
      [artikel 42, derde lid][ref3], van overeenkomstige toepassing.

      5 Bij overschrijding door het bureau van de in het eerste lid gestelde termijn, is [artikel 42, vierde lid][ref4],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0003386#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0003386#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0003386#Artikel42
