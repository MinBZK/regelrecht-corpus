  - number: '6'
    text: |-
      1 Een overeenkomst tot vervreemding van land behoeft de goedkeuring van de grondkamer.

      2 Een overeenkomst tot vervreemding van land wordt goedgekeurd, indien het betreft:

      a. een overeenkomst tussen bloed- of aanverwanten in de rechte lijn of met een pleegkind. Onder pleegkind wordt
      verstaan degene, die duurzaam als een eigen kind is verzorgd en opgevoed;

      b. een overeenkomst tot vervreemding van land aan het bureau of aan door Ons aan te wijzen in het algemeen belang
      werkzame rechtspersonen;

      c. een overeenkomst tot vervreemding van land, voor zover het betreft overhoeken, waarvan de vervreemding
      plaatsvindt als onderdeel van een overeenkomst als bedoeld in onderdeel *j*;

      d. een overeenkomst tussen pachter en verpachter ter uitoefening van het voorkeursrecht van de pachter als bedoeld
      in [afdeling 11 van titel 5 van Boek 7 van het Burgerlijk Wetboek][ref1];

      e. een kavelruilovereenkomst als bedoeld in [artikel 12.44, eerste lid, van de Omgevingswet][ref2] in samenhang met
      [artikel 12.47, eerste lid, van die wet][ref3], welke voldoet aan door Onze Minister te stellen eisen;

      f. een overeenkomst tot vervreemding van land, waarvan de oppervlakte 50 are niet te boven gaat, dat een
      eenheid vormt met een opstal, welke niet dient ter uitoefening van de landbouw. Indien de opstal doorgaans
      dient ter uitoefening van de landbouw, dient de verwerver aannemelijk te maken dat hij de opstal voor andere dan
      landbouwkundige doeleinden zal gebruiken;

      g. een overeenkomst, waarbij de verwerver aannemelijk maakt, dat hij landbouwgrond voor andere dan landbouwkundige
      doeleinden zal gebruiken of doen gebruiken, en uit een verklaring van burgemeester en wethouders blijkt, dat die
      doeleinden niet in strijd zijn met een geldend of een in ontwerp ter inzage gelegd bestemmingsplan;

      h. een overeenkomst van verdeling van een ontbonden huwelijksgemeenschap, een ontbonden gemeenschap van een
      geregistreerd partnerschap of een nalatenschap;

      i. vervreemding ingevolge een uiterste wilsbeschikking;

      j. een overeenkomst tot vervreemding van land aan de Staat, een provincie, een gemeente, een rechtspersoonlijkheid
      bezittend lichaam als bedoeld in de [Wet gemeenschappelijke regelingen][ref4] (*Stb.* 1950, K 120), een waterschap,
      een veenschap of een veenpolder;

      k. een overeenkomst tot vervreemding van land door het bureau aan de Staat, een provincie, een gemeente,
      een rechtspersoonlijkheid bezittend lichaam als bedoeld in de [Wet gemeenschappelijke regelingen][ref5], een
      waterschap, een veenschap, een veenpolder of aan een door Ons aan te wijzen in het algemeen belang werkzame
      rechtspersoon.

      3 Een overeenkomst tot vervreemding van land tussen bloed- of aanverwanten in de zijlijn tot de tweede graad
      wordt goedgekeurd, indien voldaan wordt aan de vereisten als bedoeld in [artikel 8, tweede lid, onder a,][ref6]
      of [artikel 9, onder c][ref7].

      4 Wij kunnen voorschriften verbinden aan een aanwijzing als bedoeld in het tweede lid, onder *b.* Deze
      voorschriften kunnen beperkingen inhouden. De aanwijzing wordt door Onze Minister in de *Staatscourant* bekend
      gemaakt.

      5 Burgemeester en wethouders beslissen binnen dertig dagen na de indiening van een aanvraag tot het verkrijgen
      van een verklaring als bedoeld in het tweede lid, onder *g*. Indien burgemeester en wethouders binnen de gestelde
      termijn geen beslissing hebben genomen, kan de afgifte van een verklaring worden gevraagd aan gedeputeerde staten
      die binnen dertig dagen nadien beslissen.

      6 De in het tweede lid, onder *g*, bedoelde verklaringen zijn geldig gedurende zes maanden na de dagtekening,
      tenzij het college, dat de verklaring afgeeft daarop een kortere geldigheidsduur vermeldt.

      7 Het bepaalde in het tweede lid, onder *j*, vindt slechts toepassing indien het betreft landbouwgrond gelegen
      in een bestemmingsplan waar een niet-agrarische bestemming geldt of waarvan de betrokken overheid verklaart dat
      het gebruik anders dan landbouwkundig zal zijn. Omtrent deze verklaring kunnen bij algemene maatregel van bestuur
      regelen worden gesteld.

      8 Indien het betreft landbouwgrond waarvoor geen verklaring als bedoeld in het vorige lid wordt overgelegd, wordt
      de overeenkomst goedgekeurd, indien een goedgekeurde overeenkomst of ontwerp-overeenkomst wordt overgelegd, waarbij
      de betrokken overheid wederom tot vervreemding van de landbouwgrond overgaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling11
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel12.44
