  - number: '17'
    text: |-
      1 Indien een rechtspersoon binnen het tijdvak genoemd in [artikel 15, eerste lid][ref1], landbouwgrond, dan wel
      een beperkt recht waaraan landbouwgrond is onderworpen, daarop bezit, waarvoor de grondkamer geen toestemming heeft
      verleend, dan wel de toestemming heeft ingetrokken, vordert Onze Minister dat de rechtspersoon met betrekking tot
      die landbouwgrond een pachtovereenkomst sluit met het bureau of met een door hem aan te wijzen pachter.

      2 Een vordering als bedoeld in het vorige lid wordt niet ingesteld dan nadat zes maanden zijn verlopen na de datum
      van de intrekking van de toestemming.

      3 Indien een rechtspersoon in gebreke blijft een pachtovereenkomst, als voorzien in het eerste lid, te sluiten,
      vervalt met ingang van de dertigste dag na de vordering van Onze Minister, dagelijks een dwangsom ten belope van
      een bij algemene maatregel van bestuur te bepalen bedrag.

      4 Bij algemene maatregel van bestuur worden nadere regelen gesteld met betrekking tot de procedure van aanwijzing
      van pachters, de voorwaarden waaronder een pachtovereenkomst als bedoeld in het eerste lid gesloten wordt en de
      wijze waarop het bureau de landbouwgrond kan onderverpachten.

      5 In afwijking van het bepaalde in [artikel 355 van Boek 7 van het Burgerlijk Wetboek][ref2] behoeven
      onderverpachtingen door het bureau niet de schriftelijke toestemming van de verpachter.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel355
    url: https://wetten.overheid.nl/BWBR0003386/2026-06-04#Artikel17
