        artikel: '28'
  - number: '3'
    text: |-
      1 De verklaring van de grondkamer bedoeld in artikel 2, tweede lid, onder c, is niet vereist ten aanzien van
      een vervreemding met betrekking tot een onroerende zaak die gelegen is in een gebied waarvan bij besluit van
      burgemeester en wethouders is verklaard, dat daarin uitsluitend of nagenoeg uitsluitend gelegen zijn onroerende
      zaken, die duurzaam voor andere dan landbouwkundige doeleinden worden gebruikt en die niet als natuurterrein dienen
      te worden aangemerkt.

      2 Op de voorbereiding van het in het eerste lid bedoelde besluit is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.

      3 Het besluit vermeldt, onder verwijzing naar een bijgevoegde kadastrale kaart, de kadastrale aanduiding van de
      binnen dit gebied liggende onroerende zaken.

      4 Burgemeester en wethouders verstrekken een exemplaar van het besluit en de bijbehorende kadastrale kaart aan het
      desbetreffende kantoor van de Dienst voor het kadaster en de openbare registers.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven met betrekking tot de
      omschrijving en de aanduiding van het gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
