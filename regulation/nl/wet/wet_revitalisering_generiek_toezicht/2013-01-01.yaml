preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het toezicht op provincies en gemeenten te verminderen
    en daartoe de regels in de Provinciewet en de Gemeentewet inzake taakverwaarlozing en schorsing en vernietiging
    te herzien en beter toepasbaar te maken, zodat bijzondere vormen van toezicht op provincies en gemeenten in andere
    wetten kunnen vervallen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031628/2013-01-01#ArtikelAanhef
