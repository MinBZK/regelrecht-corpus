  - number: XXII.2
    text: |-
      Indien voor het tijdstip waarop [artikel I][ref1] van deze wet in werking treedt, met betrekking tot een
      inrichting als aangewezen krachtens [artikel 1, derde lid, van de Wet milieubeheer](onbekend), ontheffing
      is verleend van verboden of verplichtingen, gesteld bij een algemene maatregel van bestuur krachtens de
      [Wet bodembescherming][ref2], waarbij toepassing is gegeven aan artikel 29 van die wet, wordt de voor die
      inrichting geldende vergunning geacht toe te staan hetgeen die ontheffing toestaat, gedurende de termijn waarvoor
      die ontheffing is verleend, dan wel, indien die ontheffing niet voor een bepaalde termijn is verleend, gedurende
      tien jaar - behoudens eerdere intrekking - na het tijdstip waarop [artikel 19][ref3] in werking treedt. De
      betrokken vergunning wordt geacht mede te zijn verleend onder de beperkingen waaronder de ontheffing was verleend;
      voorschriften die aan de ontheffing waren verbonden, worden geacht mede aan de vergunning te zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005583#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0003994
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel19a
