        artikel: XI
  - number: XXII.4
    text: |-
      Indien de aanvraag tot het geven van een beschikking is ingediend of het voornemen tot het geven van een
      beschikking krachtens wettelijk voorschrift aan degene tot wie de beschikking zal zijn gericht, is bekendgemaakt
      voor het tijdstip waarop deze wet met betrekking tot zodanige beschikking in werking treedt, blijft het voor
      dat tijdstip ten aanzien van zodanige beschikkingen geldende recht van toepassing tot het tijdstip waarop de
      beschikking onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0005583/1994-01-01#ArtikelXXII
  - number: XXII.5
    text: |-
      Voor degene die een inrichting drijft als aangewezen krachtens [artikel 1, derde lid, van de Wet milieubeheer]
      (onbekend), die krachtens artikel 35, zevende lid, van de Hinderwet zonder vergunning in werking mocht worden
      gehouden, blijft [artikel 6, eerste lid, van de Wet milieubeheer](onbekend) buiten toepassing gedurende drie
      maanden na het tijdstip waarop [artikel I][ref1] van deze wet in werking treedt, en indien binnen die termijn een
      aanvraag om de vereiste vergunning is ingediend, ook nadien, tot twee maanden nadat de beschikking waarbij op de
      aanvraag is beslist, van kracht is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005583#ArtikelI
    url: https://wetten.overheid.nl/BWBR0005583/1994-01-01#ArtikelXXII
    references:
      - id: ref1
        bwb_id: BWBR0005583
        artikel: I
  - number: XXII.6.a
    text: |-
      Het vijfde lid is van overeenkomstige toepassing voor degene die een inrichting drijft als aangewezen krachtens
      [artikel 1, derde lid, van de Wet milieubeheer](onbekend), die ingevolge een verordening, vastgesteld krachtens
      artikel 3, eerste lid, van de Hinderwet zonder vergunning in werking mocht worden gehouden. De voorschriften
      die krachtens die verordening voor de inrichting golden onmiddellijk voor het tijdstip waarop [artikel I][ref1]
      van deze wet in werking treedt, blijven voor de inrichting van toepassing gedurende de periode waarin zij
      overeenkomstig het vijfde lid zonder vergunning in werking mag worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005583#ArtikelI
    url: https://wetten.overheid.nl/BWBR0005583/1994-01-01#ArtikelXXII
    references:
      - id: ref1
        bwb_id: BWBR0005583
        artikel: I
  - number: XXII.6.b
    text: |-
      In afwijking van onderdeel *a*, eerste volzin, blijft [artikel 6, eerste lid, van de Wet milieubeheer](onbekend)
      buiten toepassing voor degene die een inrichting voor glastuinbouw drijft, die ingevolge een verordening,
      vastgesteld krachtens artikel 3 van de Hinderwet zonder vergunning in werking mocht worden gehouden, indien de
      voor de betrokken inrichting van toepassing zijnde voorschriften van die verordening worden nageleefd, totdat een
      algemene maatregel van bestuur krachtens [artikel 38 van de Wet milieubeheer](onbekend) voor zodanige inrichtingen
      in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0005583/1994-01-01#ArtikelXXII
  - number: XXII.7
    text: |-
      Een vergunning ten aanzien waarvan [artikel 22 van de Wet milieubeheer](onbekend) kan worden toegepast
      en die voor het tijdstip waarop dat mogelijk werd, voor een bepaalde termijn is verleend met toepassing
      van artikel 41, tweede lid, van de Afvalstoffenwet of artikel 16 van de Hinderwet, dan wel onder
      tijdsbeperking krachtens de [Mijnwet 1903][ref1], de [Kernenergiewet][ref2], de [Wet geluidhinder][ref3],
      de [Wet inzake de luchtverontreiniging][ref4], de [Wet verontreiniging oppervlaktewateren][ref5], de
      [Wet verontreiniging zeewater][ref6] of de Wet chemische afvalstoffen, wordt gelijkgesteld met een vergunning
      verleend krachtens de [Wet milieubeheer][ref7], met toepassing van artikel 22 van die wet.


