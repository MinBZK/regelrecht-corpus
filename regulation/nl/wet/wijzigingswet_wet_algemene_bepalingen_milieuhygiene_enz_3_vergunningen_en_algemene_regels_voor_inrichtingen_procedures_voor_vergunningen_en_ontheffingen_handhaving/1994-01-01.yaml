  - number: XXII.8.a
    text: Indien een beschikking
    url: https://wetten.overheid.nl/BWBR0005583/1994-01-01#ArtikelXXII
  - number: XXII.8.a.1e
    text: |-
      houdende een bevel tot sluiting van een inrichting krachtens de Hinderwet, de
      [Wet inzake de luchtverontreiniging][ref1] of het [Mijnreglement 1964][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0002731
      [ref2]: https://wetten.overheid.nl/BWBR0002474
    url: https://wetten.overheid.nl/BWBR0005583/1994-01-01#ArtikelXXII
