$id: wijzigingswet_wet_algemene_bepalingen_milieuhygiene_enz_3_vergunningen_en_algemene_regels_voor_inrichtingen_procedures_voor_vergunningen_en_ontheffingen_handhaving
regulatory_layer: WET
publication_date: '1993-01-29'
valid_from: '1994-01-01'
bwb_id: BWBR0005583
url: https://wetten.overheid.nl/BWBR0005583/1994-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet algemene bepalingen milieuhygiëne verder uit te
    bouwen tot een Wet milieubeheer en daarvan in de naam van de wet en in de systematiek ervan blijk te geven;

    dat het voorts wenselijk is de stelsels voor vergunningen en algemene regels met betrekking tot inrichtingen te
    verbeteren en zoveel mogelijk te integreren in die wet, de procedures voor de totstandkoming van beschikkingen
    inzake vergunningen en ontheffingen te verbeteren en de bepalingen inzake de handhaving van het milieurecht te
    verbeteren en ook in die wet te integreren;

    dat het wenselijk is daarbij tevens verdere uitvoering te geven aan de met die onderwerpen verband houdende
    Richtlijnen van de Raad van de Europese Gemeenschappen van 24 juni 1982, 82/501/EEG (PbEG L 230) en van 28 juni
    1984, 84/360/EEG (PbEG L 188);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005583/1994-01-01#ArtikelAanhef
articles:
  - number: XXII
    text: |-
      1 Een vergunning voor een inrichting als aangewezen krachtens [artikel 1, derde lid, van de Wet
      milieubeheer](onbekend), die is verleend krachtens de Afvalstoffenwet, de [Wet geluidhinder][ref1],
      de [Wet inzake de luchtverontreiniging][ref2], de Wet chemische afvalstoffen, de Hinderwet of het
      [Mijnreglement 1964][ref3] voor het tijdstip waarop [artikel I][ref4] van deze wet in werking treedt, dan wel
      nadat tijdstip met toepassing van het vierde lid van dit artikel, wordt gelijkgesteld met een vergunning, verleend
      krachtens de [Wet milieubeheer][ref5]. Een inrichting waarvoor de vergunning met toepassing van artikel 4, vijfde
      lid, onder *c*, van de Hinderwet door Ons was verleend, en die niet behoort tot een categorie die is aangewezen
      krachtens [artikel 7, tweede lid, van de Wet milieubeheer](onbekend), wordt gelijkgesteld met een inrichting als
      aangewezen krachtens artikel 7, vierde lid, van die wet, tenzij Onze Minister in overeenstemming met Onze betrokken
      Minister anders bepaalt.

      2 Indien voor het tijdstip waarop [artikel I][ref6] van deze wet in werking treedt, met betrekking tot een
      inrichting als aangewezen krachtens [artikel 1, derde lid, van de Wet milieubeheer](onbekend), ontheffing
      is verleend van verboden of verplichtingen, gesteld bij een algemene maatregel van bestuur krachtens de
      [Wet bodembescherming][ref7], waarbij toepassing is gegeven aan artikel 29 van die wet, wordt de voor die
      inrichting geldende vergunning geacht toe te staan hetgeen die ontheffing toestaat, gedurende de termijn waarvoor
      die ontheffing is verleend, dan wel, indien die ontheffing niet voor een bepaalde termijn is verleend, gedurende
      tien jaar - behoudens eerdere intrekking - na het tijdstip waarop [artikel 19][ref8] in werking treedt. De
      betrokken vergunning wordt geacht mede te zijn verleend onder de beperkingen waaronder de ontheffing was verleend;
      voorschriften die aan de ontheffing waren verbonden, worden geacht mede aan de vergunning te zijn verbonden.

      3 Indien met betrekking tot een inrichting, als aangewezen krachtens [artikel 1, derde lid, van de Wet
      milieubeheer](onbekend), krachtens artikel 35 van de Wet chemische afvalstoffen ontheffing van het verbod, gesteld
      in artikel 31 van die wet, is verleend voor het tijdstip waarop [artikel I][ref9] en [artikel XI][ref10] van
      deze wet in werking treden, wordt de voor die inrichting geldende vergunning geacht toe te staan dat de bij die
      ontheffing aangewezen chemische afvalstoffen of afgewerkte olie binnen de inrichting op of in de bodem worden
      gebracht. De betrokken vergunning wordt geacht mede te zijn verleend onder de beperkingen waaronder de ontheffing
      was verleend; voorschriften die aan de ontheffing waren verbonden, worden geacht mede aan de vergunning te zijn
      verbonden.

      4 Indien de aanvraag tot het geven van een beschikking is ingediend of het voornemen tot het geven van een
      beschikking krachtens wettelijk voorschrift aan degene tot wie de beschikking zal zijn gericht, is bekendgemaakt
      voor het tijdstip waarop deze wet met betrekking tot zodanige beschikking in werking treedt, blijft het voor
      dat tijdstip ten aanzien van zodanige beschikkingen geldende recht van toepassing tot het tijdstip waarop de
      beschikking onherroepelijk is geworden.

      5 Voor degene die een inrichting drijft als aangewezen krachtens [artikel 1, derde lid, van de Wet milieubeheer]
      (onbekend), die krachtens artikel 35, zevende lid, van de Hinderwet zonder vergunning in werking mocht worden
      gehouden, blijft [artikel 6, eerste lid, van de Wet milieubeheer](onbekend) buiten toepassing gedurende drie
      maanden na het tijdstip waarop [artikel I][ref11] van deze wet in werking treedt, en indien binnen die termijn een
      aanvraag om de vereiste vergunning is ingediend, ook nadien, tot twee maanden nadat de beschikking waarbij op de
      aanvraag is beslist, van kracht is geworden.

      6 a. Het vijfde lid is van overeenkomstige toepassing voor degene die een inrichting drijft als aangewezen
      krachtens [artikel 1, derde lid, van de Wet milieubeheer](onbekend), die ingevolge een verordening, vastgesteld
      krachtens artikel 3, eerste lid, van de Hinderwet zonder vergunning in werking mocht worden gehouden. De
      voorschriften die krachtens die verordening voor de inrichting golden onmiddellijk voor het tijdstip waarop
      [artikel I][ref12] van deze wet in werking treedt, blijven voor de inrichting van toepassing gedurende de periode
      waarin zij overeenkomstig het vijfde lid zonder vergunning in werking mag worden gehouden.

      b. In afwijking van onderdeel *a*, eerste volzin, blijft [artikel 6, eerste lid, van de Wet milieubeheer](onbekend)
      buiten toepassing voor degene die een inrichting voor glastuinbouw drijft, die ingevolge een verordening,
      vastgesteld krachtens artikel 3 van de Hinderwet zonder vergunning in werking mocht worden gehouden, indien de
      voor de betrokken inrichting van toepassing zijnde voorschriften van die verordening worden nageleefd, totdat een
      algemene maatregel van bestuur krachtens [artikel 38 van de Wet milieubeheer](onbekend) voor zodanige inrichtingen
      in werking is getreden.

      7 Een vergunning ten aanzien waarvan [artikel 22 van de Wet milieubeheer](onbekend) kan worden toegepast
      en die voor het tijdstip waarop dat mogelijk werd, voor een bepaalde termijn is verleend met toepassing
      van artikel 41, tweede lid, van de Afvalstoffenwet of artikel 16 van de Hinderwet, dan wel onder
      tijdsbeperking krachtens de [Mijnwet 1903][ref13], de [Kernenergiewet][ref14], de [Wet geluidhinder][ref15],
      de [Wet inzake de luchtverontreiniging][ref16], de [Wet verontreiniging oppervlaktewateren][ref17], de
      [Wet verontreiniging zeewater][ref18] of de Wet chemische afvalstoffen, wordt gelijkgesteld met een vergunning
      verleend krachtens de [Wet milieubeheer][ref19], met toepassing van artikel 22 van die wet.

      8 a. Indien een beschikking

      1e. houdende een bevel tot sluiting van een inrichting krachtens de Hinderwet, de
      [Wet inzake de luchtverontreiniging][ref20] of het [Mijnreglement 1964][ref21],

      2e. houdende een waarschuwing dat bestuursdwang zal worden toegepast ter uitvoering van een der in [artikel 62 van
      de Wet milieubeheer](onbekend) bedoelde wetten, voor zover hoofdstuk 7 van die wet ten aanzien van een zodanige wet
      van toepassing is,

      3e. houdende vaststelling van een dwangsom krachtens artikel 28*a* van de Hinderwet,
      [artikel 76 van de Wet bodembescherming][ref22] of artikel 61*ap* van de Wet algemene bepalingen milieuhygiëne,

      is gegeven voor het tijdstip waarop deze wet in werking treedt, blijft het voor dat tijdstip ten aanzien van een
      zodanige beschikking geldende recht van toepassing tot het tijdstip waarop die beschikking onherroepelijk wordt.

      b. Een verzoek tot het geven van een beschikking als bedoeld onder *a*, waarop op het tijdstip waarop
      [artikel I][ref23] van deze wet in werking treedt, nog niet is beslist, wordt gelijkgesteld met een verzoek als
      bedoeld in [artikel 75, eerste lid, van de Wet milieubeheer](onbekend) tot het uitoefenen van bestuursdwang,
      onderscheidenlijk het vaststellen van een dwangsom.

      9 Een algemene maatregel van bestuur, vastgesteld krachtens artikel 2*a* van de Hinderwet met toepassing van het
      tweede lid van dat artikel, wordt gelijkgesteld met een algemene maatregel van bestuur krachtens [artikel 38 van de
      Wet milieubeheer](onbekend).

      10 Een algemene maatregel van bestuur, vastgesteld krachtens [artikel 20][ref24] of artikel 2*a* van de Hinderwet
      zonder toepassing van het tweede lid van dat artikel, wordt gelijkgesteld met een algemene maatregel van bestuur,
      vastgesteld krachtens [artikel 39 van de Wet milieubeheer](onbekend). Indien het bij koninklijke boodschap van 3
      februari 1992 ingediende voorstel van wet tot wijziging van de Afvalstoffenwet tot wet wordt verheven en in werking
      treedt voor het tijdstip waarop deze wet in werking treedt, wordt een algemene maatregel van bestuur, vastgesteld
      krachtens artikel 53*a* van de Afvalstoffenwet, gelijkgesteld met een algemene maatregel van bestuur, vastgesteld
      krachtens [artikel 39 van de Wet milieubeheer](onbekend).

      11 Een besluit krachtens de Hinderwet, de Interimwet bodemsanering of een der in [artikel 62 van de Wet
      milieubeheer](onbekend) bedoelde wetten tot aanwijzing van ambtenaren, belast met het toezicht op de naleving van
      het bij of krachtens de betrokken wet bepaalde, blijft - indien het een andere wet dan de Hinderwet betreft: voor
      zover [artikel 65 van de Wet milieubeheer](onbekend) ten aanzien van een zodanige wet van toepassing is - van
      kracht gedurende een jaar na het tijdstip waarop [artikel I][ref25] van deze wet in werking treedt. De aangewezen
      ambtenaren zijn, ook al is dat niet in het betrokken besluit bepaald, gedurende dat jaar tevens belast met het
      toezicht op de naleving van het bij of krachtens de [Wet milieubeheer][ref26] bepaalde. De eerste en de tweede
      volzin zijn van overeenkomstige toepassing ten aanzien van de opsporingsbevoegdheid van de opsporingsambtenaren
      die zijn aangewezen krachtens de Interimwet bodemsanering, een der in [artikel 62 van de Wet milieubeheer]
      (onbekend) bedoelde wetten of krachtens [artikel 17 van de Wet op de economische delicten][ref27], met dien
      verstande dat de periode, genoemd in de eerste volzin, wordt verlengd tot een jaar na het tijdstip waarop, indien
      het bij koninklijke boodschap van 27 maart 1992 ingediende voorstel van wet tot vaststelling van een nieuwe
      [Politiewet][ref28] (22 562) tot wet wordt verheven, die wet in werking treedt.

      12 Indien voor het tijdstip waarop [artikel I][ref29] van deze wet in werking treedt, overeenkomstig artikel 41*o*
      richtlijnen zijn gegeven inzake de inhoud van een milieu-effectrapport en door dat inwerkingtreden de bevoegdheid
      te beslissen op de aanvraag om een vergunning voor een inrichting, bij de voorbereiding waarvan dat rapport moet
      worden gemaakt, overgaat naar een ander orgaan, worden die richtlijnen gelijkgesteld met richtlijnen, gegeven door
      dat andere orgaan.

      13 Indien de bepalingen van gemeentelijke of provinciale verorderingen, vastgesteld krachtens de
      [artikelen 272 van de gemeentewet][ref30], onderscheidenlijk 148 van [Provinciewet][ref31] met betrekking tot
      leges of andere rechten terzake van het aanvragen of verlenen van vergunningen of ontheffingen voor inrichtingen
      als aangewezen krachtens [artikel 1, derde lid, van de Wet milieubeheer](onbekend), op het tijdstip waarop
      [artikel I][ref32] van deze wet in werking treedt, niet zijn aangepast aan de [Wet milieubeheer][ref33], worden
      zodanige inrichtingen voor de toepassing van die bepalingen gedurende ten hoogste een jaar na dat tijdstip
      gelijkgesteld met inrichtingen als aangewezen krachtens het voor dat tijdstip geldende recht.


