  - number: XXII.3
    text: |-
      Indien met betrekking tot een inrichting, als aangewezen krachtens [artikel 1, derde lid, van de Wet milieubeheer]
      (onbekend), krachtens artikel 35 van de Wet chemische afvalstoffen ontheffing van het verbod, gesteld in artikel
      31 van die wet, is verleend voor het tijdstip waarop [artikel I][ref1] en [artikel XI][ref2] van deze wet in
      werking treden, wordt de voor die inrichting geldende vergunning geacht toe te staan dat de bij die ontheffing
      aangewezen chemische afvalstoffen of afgewerkte olie binnen de inrichting op of in de bodem worden gebracht. De
      betrokken vergunning wordt geacht mede te zijn verleend onder de beperkingen waaronder de ontheffing was verleend;
      voorschriften die aan de ontheffing waren verbonden, worden geacht mede aan de vergunning te zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005583#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0005583#ArtikelXI
