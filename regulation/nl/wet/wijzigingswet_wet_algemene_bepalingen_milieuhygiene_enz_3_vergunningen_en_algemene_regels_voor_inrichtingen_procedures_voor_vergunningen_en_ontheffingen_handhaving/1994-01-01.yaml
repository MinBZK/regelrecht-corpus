    text: |-
      houdende een waarschuwing dat bestuursdwang zal worden toegepast ter uitvoering van een der in [artikel 62 van de
      Wet milieubeheer](onbekend) bedoelde wetten, voor zover hoofdstuk 7 van die wet ten aanzien van een zodanige wet
      van toepassing is,
    url: https://wetten.overheid.nl/BWBR0005583/1994-01-01#ArtikelXXII
  - number: XXII.8.a.3e
    text: |-
      houdende vaststelling van een dwangsom krachtens artikel 28*a* van de Hinderwet,
      [artikel 76 van de Wet bodembescherming][ref1] of artikel 61*ap* van de Wet algemene bepalingen milieuhygiëne,


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel76
    url: https://wetten.overheid.nl/BWBR0005583/1994-01-01#ArtikelXXII
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '76'
  - number: XXII.8.b
    text: |-
      Een verzoek tot het geven van een beschikking als bedoeld onder *a*, waarop op het tijdstip waarop
      [artikel I][ref1] van deze wet in werking treedt, nog niet is beslist, wordt gelijkgesteld met een verzoek als
      bedoeld in [artikel 75, eerste lid, van de Wet milieubeheer](onbekend) tot het uitoefenen van bestuursdwang,
      onderscheidenlijk het vaststellen van een dwangsom.


      [ref1]: https://wetten.overheid.nl/BWBR0005583#ArtikelI
    url: https://wetten.overheid.nl/BWBR0005583/1994-01-01#ArtikelXXII
    references:
      - id: ref1
        bwb_id: BWBR0005583
        artikel: I
  - number: XXII.9
    text: |-
      Een algemene maatregel van bestuur, vastgesteld krachtens artikel 2*a* van de Hinderwet met toepassing van het
      tweede lid van dat artikel, wordt gelijkgesteld met een algemene maatregel van bestuur krachtens [artikel 38 van de
      Wet milieubeheer](onbekend).
    url: https://wetten.overheid.nl/BWBR0005583/1994-01-01#ArtikelXXII
  - number: XXII.10
    text: |-
      Een algemene maatregel van bestuur, vastgesteld krachtens [artikel 20][ref1] of artikel 2*a* van de Hinderwet
      zonder toepassing van het tweede lid van dat artikel, wordt gelijkgesteld met een algemene maatregel van bestuur,
      vastgesteld krachtens [artikel 39 van de Wet milieubeheer](onbekend). Indien het bij koninklijke boodschap van 3
      februari 1992 ingediende voorstel van wet tot wijziging van de Afvalstoffenwet tot wet wordt verheven en in werking
      treedt voor het tijdstip waarop deze wet in werking treedt, wordt een algemene maatregel van bestuur, vastgesteld
      krachtens artikel 53*a* van de Afvalstoffenwet, gelijkgesteld met een algemene maatregel van bestuur, vastgesteld
      krachtens [artikel 39 van de Wet milieubeheer](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel20a
    url: https://wetten.overheid.nl/BWBR0005583/1994-01-01#ArtikelXXII
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: 20a
  - number: XXII.11
    text: |-
      Een besluit krachtens de Hinderwet, de Interimwet bodemsanering of een der in [artikel 62 van de Wet milieubeheer]
      (onbekend) bedoelde wetten tot aanwijzing van ambtenaren, belast met het toezicht op de naleving van het bij
      of krachtens de betrokken wet bepaalde, blijft - indien het een andere wet dan de Hinderwet betreft: voor zover
      [artikel 65 van de Wet milieubeheer](onbekend) ten aanzien van een zodanige wet van toepassing is - van kracht
      gedurende een jaar na het tijdstip waarop [artikel I][ref1] van deze wet in werking treedt. De aangewezen
      ambtenaren zijn, ook al is dat niet in het betrokken besluit bepaald, gedurende dat jaar tevens belast met het
      toezicht op de naleving van het bij of krachtens de [Wet milieubeheer][ref2] bepaalde. De eerste en de tweede
      volzin zijn van overeenkomstige toepassing ten aanzien van de opsporingsbevoegdheid van de opsporingsambtenaren
      die zijn aangewezen krachtens de Interimwet bodemsanering, een der in [artikel 62 van de Wet milieubeheer]
      (onbekend) bedoelde wetten of krachtens [artikel 17 van de Wet op de economische delicten][ref3], met dien
      verstande dat de periode, genoemd in de eerste volzin, wordt verlengd tot een jaar na het tijdstip waarop, indien
      het bij koninklijke boodschap van 27 maart 1992 ingediende voorstel van wet tot vaststelling van een nieuwe
      [Politiewet][ref4] (22 562) tot wet wordt verheven, die wet in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005583#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0003245
      [ref3]: https://wetten.overheid.nl/BWBR0002063#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0006299
