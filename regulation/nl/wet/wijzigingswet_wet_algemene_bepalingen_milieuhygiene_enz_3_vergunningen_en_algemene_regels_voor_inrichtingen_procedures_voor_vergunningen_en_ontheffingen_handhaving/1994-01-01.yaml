  - number: XXIII
    text: |-
      1 De tekst van de [Wet milieubeheer][ref1] wordt ingedeeld in de volgende hoofdstukken: Hoofdstuk 1.
      Algemeen Hoofdstuk 2. Adviesorganen Hoofdstuk 3. Internationale zaken Hoofdstuk 4. Plannen Hoofdstuk 5.
      Milieukwaliteitseisen Hoofdstuk 6. Milieuzonering Hoofdstuk 7. Milieu-effectrapportage Hoofdstuk 8. Inrichtingen
      Hoofdstuk 9. Stoffen en produkten Hoofdstuk 10. Afvalstoffen Hoofdstuk 11. Andere handelingen Hoofdstuk 12. Meet-
      en registratieverplichtingen Hoofdstuk 13. Procedures voor vergunningen en ontheffingen Hoofdstuk 14. Coördinatie
      Hoofdstuk 15. Financiële bepalingen Hoofdstuk 16. Financiële zekerheid Hoofdstuk 17. Maatregelen in bijzondere
      omstandigheden Hoofdstuk 18. Handhaving Hoofdstuk 19. Bepalingen in verband met de openbaarheid Hoofdstuk 20.
      Beroep Hoofdstuk 21. Verdere bepalingen Hoofdstuk 22. Slotbepalingen.

      2 De al vastgestelde hoofdstukken van de [Wet milieubeheer][ref2] worden door Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer in de volgorde geplaatst, die in het eerste lid is aangegeven. De onderdelen
      van die hoofdstukken, alsmede de artikelen van de wet worden door hem per hoofdstuk doorlopend genummerd; de
      verwijzingen worden aan die nummering aangepast, waarbij zo nodig de werkwoordsvormen worden aangepast en de
      verwijzingen weer in oplopende volgorde worden geplaatst. Daarbij wordt het voor de opsomming van een reeks van
      bepalingen gebruikte teken "-" telkens vervangen door: tot en met. Voorts wordt "*Nederlandse Staatscourant*"
      telkens vervangen door: *Staatscourant*.

      3 De tekst van de [Wet milieubeheer][ref3], zoals zij na de toepassing van het eerste en het tweede lid luidt,
      wordt door Onze Minister van Justitie in het *Staatsblad* geplaatst.

      4 De tekst van de [Mijnwet 1903][ref4], de [Destructiewet][ref5], de [Kernenergiewet][ref6], de Afvalstoffenwet,
      de [Wet geluidhinder][ref7], de [Grondwaterwet][ref8], de [Wet inzake de luchtverontreiniging][ref9],
      de [Wet verontreiniging oppervlaktewateren][ref10], de [Wet verontreiniging zeewater][ref11], de Wet
      chemische afvalstoffen, de Interimwet bodemsanering, de [Wet milieugevaarlijke stoffen][ref12] en de
      [Wet bodembescherming][ref13] wordt door Onze Minister van Justitie in het *Staatsblad* geplaatst, nadat de
      verwijzingen in die wetten naar hoofdstukken, onderdelen daarvan en artikelen van de [Wet milieubeheer][ref14],
      waarbij zo nodig de werkwoordsvormen worden aangepast en de verwijzingen weer in oplopende volgorde worden
      geplaatst, door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer zijn aangepast aan de
      vernummering van die hoofdstukken, onderdelen en artikelen ingevolge het eerste en tweede lid.

      5 Het vierde lid is van overeenkomstige toepassing ten aanzien van de krachtens [artikel XV][ref15] gewijzigde
      onderdelen van de [Wet op de economische delicten][ref16], voor zover daarin wordt verwezen naar bepalingen van
      de [Wet milieubeheer][ref17], en van de krachtens artikel XXI gewijzigde leden van de in dat artikel genoemde
      artikelen van de [Woningwet][ref18].


