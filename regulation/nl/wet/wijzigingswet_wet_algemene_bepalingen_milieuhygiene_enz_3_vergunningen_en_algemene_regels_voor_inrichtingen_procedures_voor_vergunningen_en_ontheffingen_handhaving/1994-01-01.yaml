preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet algemene bepalingen milieuhygiëne verder uit te
    bouwen tot een Wet milieubeheer en daarvan in de naam van de wet en in de systematiek ervan blijk te geven;

    dat het voorts wenselijk is de stelsels voor vergunningen en algemene regels met betrekking tot inrichtingen te
    verbeteren en zoveel mogelijk te integreren in die wet, de procedures voor de totstandkoming van beschikkingen
    inzake vergunningen en ontheffingen te verbeteren en de bepalingen inzake de handhaving van het milieurecht te
    verbeteren en ook in die wet te integreren;

    dat het wenselijk is daarbij tevens verdere uitvoering te geven aan de met die onderwerpen verband houdende
    Richtlijnen van de Raad van de Europese Gemeenschappen van 24 juni 1982, 82/501/EEG (PbEG L 230) en van 28 juni
    1984, 84/360/EEG (PbEG L 188);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005583/1994-01-01#ArtikelAanhef
articles:
  - number: XXII.1
    text: |-
      Een vergunning voor een inrichting als aangewezen krachtens [artikel 1, derde lid, van de Wet
      milieubeheer](onbekend), die is verleend krachtens de Afvalstoffenwet, de [Wet geluidhinder][ref1],
      de [Wet inzake de luchtverontreiniging][ref2], de Wet chemische afvalstoffen, de Hinderwet of het
      [Mijnreglement 1964][ref3] voor het tijdstip waarop [artikel I][ref4] van deze wet in werking treedt, dan wel
      nadat tijdstip met toepassing van het vierde lid van dit artikel, wordt gelijkgesteld met een vergunning, verleend
      krachtens de [Wet milieubeheer][ref5]. Een inrichting waarvoor de vergunning met toepassing van artikel 4, vijfde
      lid, onder *c*, van de Hinderwet door Ons was verleend, en die niet behoort tot een categorie die is aangewezen
      krachtens [artikel 7, tweede lid, van de Wet milieubeheer](onbekend), wordt gelijkgesteld met een inrichting als
      aangewezen krachtens artikel 7, vierde lid, van die wet, tenzij Onze Minister in overeenstemming met Onze betrokken
      Minister anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0003227
      [ref2]: https://wetten.overheid.nl/BWBR0002731
      [ref3]: https://wetten.overheid.nl/BWBR0002474
