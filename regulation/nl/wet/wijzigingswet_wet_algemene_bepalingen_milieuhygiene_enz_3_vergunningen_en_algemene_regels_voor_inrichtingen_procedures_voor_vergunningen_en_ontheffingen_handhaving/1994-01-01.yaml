  - number: XXII.12
    text: |-
      Indien voor het tijdstip waarop [artikel I][ref1] van deze wet in werking treedt, overeenkomstig artikel 41*o*
      richtlijnen zijn gegeven inzake de inhoud van een milieu-effectrapport en door dat inwerkingtreden de bevoegdheid
      te beslissen op de aanvraag om een vergunning voor een inrichting, bij de voorbereiding waarvan dat rapport moet
      worden gemaakt, overgaat naar een ander orgaan, worden die richtlijnen gelijkgesteld met richtlijnen, gegeven door
      dat andere orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005583#ArtikelI
    url: https://wetten.overheid.nl/BWBR0005583/1994-01-01#ArtikelXXII
    references:
      - id: ref1
        bwb_id: BWBR0005583
        artikel: I
  - number: XXII.13
    text: |-
      Indien de bepalingen van gemeentelijke of provinciale verorderingen, vastgesteld krachtens de
      [artikelen 272 van de gemeentewet][ref1], onderscheidenlijk 148 van [Provinciewet][ref2] met betrekking tot
      leges of andere rechten terzake van het aanvragen of verlenen van vergunningen of ontheffingen voor inrichtingen
      als aangewezen krachtens [artikel 1, derde lid, van de Wet milieubeheer](onbekend), op het tijdstip waarop
      [artikel I][ref3] van deze wet in werking treedt, niet zijn aangepast aan de [Wet milieubeheer][ref4], worden
      zodanige inrichtingen voor de toepassing van die bepalingen gedurende ten hoogste een jaar na dat tijdstip
      gelijkgesteld met inrichtingen als aangewezen krachtens het voor dat tijdstip geldende recht.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel272
      [ref2]: https://wetten.overheid.nl/BWBR0005645
