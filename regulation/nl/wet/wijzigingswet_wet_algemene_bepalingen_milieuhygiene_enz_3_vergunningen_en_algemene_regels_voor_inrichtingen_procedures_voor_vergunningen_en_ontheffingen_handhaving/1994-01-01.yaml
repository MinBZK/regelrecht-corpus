  - number: XXIII.5
    text: |-
      Het vierde lid is van overeenkomstige toepassing ten aanzien van de krachtens [artikel XV][ref1] gewijzigde
      onderdelen van de [Wet op de economische delicten][ref2], voor zover daarin wordt verwezen naar bepalingen van de
      [Wet milieubeheer][ref3], en van de krachtens artikel XXI gewijzigde leden van de in dat artikel genoemde artikelen
      van de [Woningwet][ref4].


