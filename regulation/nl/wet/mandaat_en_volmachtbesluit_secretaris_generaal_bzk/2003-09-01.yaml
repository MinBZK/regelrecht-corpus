---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: mandaat_en_volmachtbesluit_secretaris_generaal_bzk
regulatory_layer: WET
publication_date: '2004-04-19'
valid_from: '2003-09-01'
bwb_id: BWBR0013170
url: https://wetten.overheid.nl/BWBR0013170/2003-09-01
preamble:
  text: |-
    in overeenstemming met de Minister voor Grote Steden- en Integratiebeleid,

    Gelet op de Algemene wet bestuursrecht;

    Gelet op de Compatibiliteitswet en het Besluit privaatrechtelijke rechtshandelingen 1996;

    Gelet op het koninklijk besluit van 18 oktober 1988, houdende regeling van de functie en verantwoordelijkheid van
    de secretaris-generaal;

    Gezien het advies van de Groepsondernemingsraad;

    Besluit
  url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

            ministerie:

              het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;



            minister:

              de Minister van Binnenlandse Zaken en Koninkrijksrelaties;



            bewindspersoon:

              de Minister van Binnenlandse Zaken en Koninkrijksrelaties, onderscheidenlijk de Staatssecretaris van
      Binnenlandse Zaken en Koninkrijksrelaties;









            stuk:

              een stuk dat een besluit inhoudt of een ander stuk dat wordt toegerekend aan een bewindspersoon;



            diensthoofd:

              de plaatsvervangend secretaris-generaal, een directeur-generaal of, het hoofd van de Algemene Inlichtingen-
      en Veiligheidsdienst of het hoofd van de Inspectie Openbare Orde en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel1
  - number: 2:1.1
    text: |-
      De secretaris-generaal is bevoegd om namens een bewindspersoon besluiten te nemen en stukken af te doen en te
      ondertekenen.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel21
  - number: 2:1.2
    text: |-
      De secretaris-generaal is bevoegd om namens een bewindspersoon voor de Staat privaatrechtelijke rechtshandelingen
      te verrichten.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel21
  - number: 2:1.3
    text: De secretaris-generaal is bevoegd om een bewindspersoon in persoon te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel21
  - number: 2:1.4
    text: |-
      De bevoegdheden, bedoeld in het eerste tot en met derde lid, worden aangeduid als: het mandaat en de volmacht van
      de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel21
  - number: 2:2
    text: |-
      Het mandaat en de volmacht van de secretaris-generaal wordt uitgeoefend ten aanzien van aangelegenheden die,
      gelet op het koninklijk besluit van 18 oktober 1988, houdende regeling van de functie en verantwoordelijkheid van
      de secretaris-generaal, naar het oordeel van de secretaris-generaal en te zijner verantwoording behoren tot zijn
      werkterrein overeenkomstig het [Organisatiebesluit BZK][ref1] en die onverminderd het bepaalde in dit besluit,
      redelijkerwijs niet behoren te worden voorgelegd aan een bewindspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0013308
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0013308
  - number: 2:3
    text: |-
      Onverminderd het bepaalde in paragraaf 4 van dit besluit heeft het mandaat en de volmacht van de secretaris-
      generaal in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel23
  - number: 2:3.a)
    text: |-
      de taken van de functionarissen en organisatie-onderdelen, genoemd in het [Organisatiebesluit BZK][ref1], met
      uitzondering van de taken, genoemd in artikel 10, tweede lid, onder a tot en met c van dat besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0013308
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013308
  - number: 2:3.b)
    text: |-
      het beleid en beheer inzake alle aspecten van de bedrijfsvoering van het ministerie met inbegrip van
      aangelegenheden op organisatorisch, personeel, financieel en materieel gebied en aangelegenheden met betrekking tot
      het verrichten van privaatrechtelijke rechtshandelingen;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel23
  - number: 2:3.c)
    text: het vaststellen van de formatie van het ministerie;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel23
  - number: 2:3.d)
    text: |-
      het rechtstreeks leiding geven aan de diensthoofden en overige rechtstreeks onder de secretaris-generaal
      ressorterende functionarissen, voor zover ten aanzien van de directeur-generaal voor de Algemene Bestuursdienst
      niet anders is bepaald;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel23
  - number: 2:3.e)
    text: |-
      het nader vaststellen van de inrichting van de onder de plaatsvervangend secretaris-generaal, de directeuren-
      generaal, het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst en het hoofd van de Inspectie Openbare Orde
      en Veiligheid ressorterende dienstonderdelen op grond van het [Organisatiebesluit BZK][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013308
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013308
  - number: 2:3.f)
    text: |-
      aangelegenheden die op grond van bovendepartementale regelgeving of afspraken op centraal departementaal niveau
      dienen te worden afgehandeld;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel23
  - number: 2:3.g)
    text: het beslissen op bezwaarschriften;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel23
  - number: 2:3.h)
    text: |-
      het vertegenwoordigen van een bewindspersoon namens de Staat in gerechtelijke procedures waarbij het ministerie
      is betrokken;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel23
  - number: 2:3.i)
    text: |-
      het behandelen van klachten ingevolge een wettelijke regeling met betrekking tot klachtrecht, waarover door een
      commissie wordt gerapporteerd of geadviseerd;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel23
  - number: 2:3.j)
    text: |-
      het vertegenwoordigen van de minister namens de Staat bij de toepassing van de [Wet op de ondernemingsraden][ref1]
      bij het ministerie en het optreden als bestuurder in de zin van voornoemde wet in het overleg met de
      Groepsondernemingsraad van het ministerie;


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002747
  - number: 2:3.k)
    text: het vertegenwoordigen van de minister in het overleg met het departementaal georganiseerd overleg;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel23
  - number: 2:3.l)
    text: |-
      personele beheersbeslissingen op grond van het Beheersbesluit KABGNA/KABGA 1998 ten aanzien van de directeuren van
      de Kabinetten van de Gouverneurs van de Nederlandse Antillen en Aruba;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel23
  - number: 2:3.m)
    text: |-
      de verantwoordelijkheid voor het beheer van de archiefbescheiden bij het ministerie op grond van de desbetreffende
      departementale regelgeving;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel23
  - number: 2:3.n)
    text: |-
      het optreden als gemachtigd ambtenaar in de zin van de departementale regelgeving met betrekking tot de uitvoering
      van de [Wet openbaarheid van bestuur][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: 2:3.o)
    text: het vaststellen van beleidsregels en circulaires met betrekking tot de aangelegenheden, bedoeld in dit artikel;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel23
  - number: 2:3.p)
    text: |-
      het beslissen op bezwaarschriften tegen besluiten van of namens het hoofd van de
      Algemene Inlichtingen- en Veiligheidsdienst met betrekking tot aanvragen als bedoeld in
      [hoofdstuk 4 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013409
        hoofdstuk: '4'
  - number: '3.1'
    text: |-
      Ondertekening van besluiten en stukken op grond van het mandaat van de secretaris-generaal vindt plaats op de
      volgende wijze: - (aanduiding bewindspersoon),
        - voor deze,
        - de secretaris-generaal,
        - (handtekening)
        - (naam)
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel3
  - number: '3.2'
    text: |-
      Bij ondertekening van besluiten en stukken op grond van de volmacht van de secretaris-generaal wordt de aanduiding
      van de bewindspersoon voorafgegaan door: Namens de Staat der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel3
  - number: 4:1
    text: 'Het mandaat en de volmacht van de secretaris-generaal is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel41
  - number: 4:1.a)
    text: indien bij wettelijk voorschrift anders is bepaald;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel41
  - number: 4:1.b)
    text: indien de aard van de bevoegdheid of het stuk zich daartegen verzet;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel41
  - number: 4:1.c)
    text: |-
      indien het een stuk betreft dat bij de ontvanger de indruk kan wekken dat de ondertekenaar persoonlijk een
      beslissing neemt die door een bewindspersoon behoort te worden genomen;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel41
  - number: 4:1.d)
    text: op besluiten en stukken met betrekking tot politieke of maatschappelijke aangelegenheden van principiële aard.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel41
  - number: 4:2.1
    text: 'Aan de bewindspersonen is voorbehouden het afdoen en ondertekenen van stukken aan:'
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel42
  - number: 4:2.1.a)
    text: de Koningin;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel42
  - number: 4:2.1.b)
    text: de Raad van Ministers (van het Koninkrijk) en daaruit gevormde onderraden en commissies;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel42
  - number: 4:2.1.c)
    text: |-
      de voorzitters van de Eerste en Tweede Kamer der Staten-Generaal en de voorzitters van uit de Kamers gevormde
      commissies;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel42
  - number: 4:2.1.d)
    text: een minister of een staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel42
  - number: 4:2.1.e)
    text: de Raad van State (van het Koninkrijk);
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel42
  - number: 4:2.1.f)
    text: de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel42
  - number: 4:2.1.g)
    text: de Nationale Ombudsman;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel42
  - number: 4:2.1.h)
    text: de Gouverneurs van de Nederlandse Antillen en Aruba;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel42
  - number: 4:2.1.i)
    text: de ministers van de Nederlandse Antillen en Aruba;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel42
  - number: 4:2.1.j)
    text: de Gevolmachtigde Ministers van de Nederlandse Antillen en Aruba;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel42
  - number: 4:2.1.k)
    text: de besturen van de eilandgebieden van de Nederlandse Antillen;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel42
  - number: 4:2.1.l)
    text: |-
      andere binnenlandse of buitenlandse autoriteiten, in rang gelijk aan of hoger dan een minister of een
      staatssecretaris.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel42
  - number: 4:2.2
    text: |-
      Het eerste lid is niet van toepassing als het stuk van louter informatieve of administratieve aard is, dan wel een
      aangelegenheid betreft van ondergeschikt beleidsmatig of politiek belang.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel42
  - number: 4:2.3
    text: |-
      In afwijking van het eerste lid kan in bijzondere gevallen voor bepaalde aangelegenheden door een bewindspersoon
      aan de secretaris-generaal of de plaatsvervangend secretaris-generaal mandaat of een volmacht worden verleend.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel42
  - number: 4:3
    text: |-
      Aan de bewindspersonen is voorbehouden het nemen van besluiten en het afdoen en ondertekenen van stukken met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel43
  - number: 4:3.a)
    text: het vaststellen van een algemeen verbindend voorschrift;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel43
  - number: 4:3.b)
    text: |-
      het beslissen op een bezwaarschrift tegen een besluit dat door een bewindspersoon onderscheidenlijk de secretaris-
      generaal is genomen;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel43
  - number: 4:3.c)
    text: het beslissen op een beroepschrift;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel43
  - number: 4:3.d)
    text: het instellen van een agentschap bij het ministerie;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel43
  - number: 4:3.e)
    text: het oprichten van een rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel43
  - number: 4:3.f)
    text: het geven van aanwijzingen aan een ander bestuursorgaan op grond van een wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel43
  - number: 4:3.g)
    text: het toepassen van aanwijzing 3 van de Aanwijzingen inzake externe contacten van rijksambtenaren;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel43
  - number: 4:3.h)
    text: |-
      het vaststellen van het besluit, bedoeld in artikel 2, eerste lid, van het Coördinatiebesluit inrichting
      organisatie en formatie rijksdienst, houdende de vaststelling van de organisatie van het ministerie;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel43
  - number: 4:3.i)
    text: het uitoefenen van het houderschap van de departementale persoonsregistraties;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel43
  - number: 4:3.j)
    text: |-
      het uitoefenen van de op grond van departementale regelgeving aan de minister voorbehouden bevoegdheden met
      betrekking tot vertrouwensfuncties en veiligheidsonderzoeken;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel43
  - number: 4:3.k)
    text: |-
      het instellen van een adviescommissie of klachtencommissie en het benoemen en ontslaan van de (plaatsvervangend)
      voorzitter en (plaatsvervangend) leden van die commissie;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel43
  - number: 4:3.l)
    text: het benoemen en ontslaan van departementale vertrouwenspersonen;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel43
  - number: 4:3.m)
    text: |-
      het verlenen van goedkeuring aan, het schorsen of het vernietigen van, dan wel het onthouden van goedkeuring aan
      besluiten van een ander bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel43
  - number: 4:3.n)
    text: |-
      het definitief buiteninvorderingstellen onderscheidenlijk kwijtschelden van vorderingen op derden vanaf door de
      Minister van Financiën vastgestelde grensbedragen;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel43
  - number: 4:3.o)
    text: |-
      het definitief vaststellen van een sectorale arbeidsvoorwaardenovereenkomst waarvoor de bewindspersoon
      verantwoordelijk is.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel43
  - number: 4:4
    text: |-
      Het mandaat van de secretaris-generaal is niet van toepassing op het nemen van besluiten en het
      afdoen en ondertekenen van stukken met betrekking tot beslissingen ten aanzien van de directeur-
      generaal voor de Algemene Bestuursdienst, voor zover deze samenhangen met de taken, genoemd in
      [artikel 10, tweede lid, onder a tot en met c, van het Organisatiebesluit BZK][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013308#Artikel10
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0013308
        artikel: '10'
  - number: '5.1'
    text: |-
      Bij tijdelijke afwezigheid of verhindering van de secretaris-generaal wordt diens mandaat en volmacht volledig
      uitgeoefend door de plaatsvervangend secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel5
  - number: '5.2'
    text: |-
      Bij gelijktijdige tijdelijke afwezigheid of verhindering van de secretaris-generaal en de plaatsvervangend
      secretaris-generaal wordt het mandaat en de volmacht van de secretaris-generaal bij wijze van waarneming
      volledig uitgeoefend door de directeur-generaal die daartoe bij schriftelijk besluit van de secretaris-generaal
      in overeenstemming met de minister is aangewezen. Bij gebreke van voornoemd besluit of bij afwezigheid van de
      aangewezen directeur-generaal is een van de directeuren-generaal, met uitzondering van de directeur-generaal
      voor de Algemene Bestuursdienst, naar anciënniteit van de benoeming in de functie van directeur-generaal, met de
      waarneming belast.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel5
  - number: '5.3'
    text: |-
      Ondertekening van besluiten en stukken ingevolge het eerste en tweede lid vindt plaats overeenkomstig
      [artikel 3][ref1], met dien verstande dat de handtekening voorafgegaan wordt door: b/a.


      [ref1]: https://wetten.overheid.nl/BWBR0013170#Artikel3
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013170
        artikel: '3'
        paragraaf: '3'
  - number: 6:1.1
    text: |-
      De secretaris-generaal is bevoegd tot het verlenen van ondermandaat en het doorverlenen van zijn volmacht aan
      een diensthoofd, ten aanzien van aangelegenheden op het werkterrein van het diensthoofd overeenkomstig het
      [Organisatiebesluit BZK][ref1], respectievelijk tot het beperken of het intrekken daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0013308
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0013308
  - number: 6:1.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op onder de secretaris-generaal ressorterende functionarissen,
      niet zijnde diensthoofden.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel61
  - number: 6:1.3
    text: |-
      De secretaris-generaal kan met betrekking tot de bevoegdheid te beslissen op bezwaarschriften ondermandaat verlenen
      aan de diensthoofden met dien verstande dat ten aanzien van personele aangelegenheden alleen ondermandaat kan
      worden verleend aan de plaatsvervangend secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel61
  - number: 6:2
    text: |-
      De secretaris-generaal kan bij de uitoefening van de bevoegdheid, bedoeld in [artikel 6:1][ref1], tevens de
      bevoegdheid toekennen tot het verlenen van ondermandaat en het doorverlenen van de volmacht aan een rechtstreeks
      onder het desbetreffende diensthoofd of de desbetreffende functionaris ressorterende functionaris of in bijzondere
      gevallen aan een andere functionaris, ten aanzien van aangelegenheden op het werkterrein van de functionaris
      overeenkomstig het [Organisatiebesluit BZK][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013170#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013308
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0013170
        artikel: '6'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0013308
  - number: 6:3
    text: |-
      De secretaris-generaal is bevoegd om de plaatsvervangend secretaris-generaal, ten aanzien van door de secretaris-
      generaal met inachtneming van dit besluit en het [Organisatiebesluit BZK][ref1] vast te stellen aangelegenheden, in
      de bevoegdheden en verantwoordelijkheden van de secretaris-generaal te laten treden.


      [ref1]: https://wetten.overheid.nl/BWBR0013308
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0013308
  - number: 6:4
    text: |-
      De secretaris-generaal is bevoegd om de directeur-generaal Openbare Orde en Veiligheid, ten aanzien van
      aangelegenheden betreffende het Korps Landelijke Politiediensten onderscheidenlijk het agentschap Informatie- en
      communicatietechnologie Organisatie, in de bevoegdheden en verantwoordelijkheden van de secretaris-generaal te
      laten treden.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel64
  - number: 6:5
    text: |-
      De uitoefening door de secretaris-generaal van de bevoegdheden, bedoeld in de [artikelen 6:1][ref1] tot en met
      [6:4][ref2], geschiedt bij schriftelijk besluit en in overeenstemming met de bewindspersonen, en na advies van de
      directeur Constitutionele Zaken en Wetgeving, de directeur Financieel-Economische Zaken en de directeur Personeel
      en Organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0013170#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013170#Artikel6
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0013170
        artikel: '6'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0013170
        artikel: '6'
        paragraaf: '6'
  - number: 6:6
    text: |-
      De secretaris-generaal is bevoegd om in bijzondere gevallen, naast of in plaats van het bepaalde in
      deze paragraaf, mondeling of schriftelijk ondermandaat te verlenen onderscheidenlijk zijn volmacht door
      te verlenen aan een onder hem ressorterende functionaris voor een bepaald geval, met inachtneming van
      [artikel 1, derde lid, van het Besluit privaatrechtelijke rechtshandelingen 1996][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007804#Artikel1
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0007804
        artikel: '1'
  - number: 7:1
    text: |-
      De uitoefening door de secretaris-generaal onderscheidenlijk een op grond van of krachtens dit besluit
      gemandateerde en gevolmachtigde van diens mandaat en volmacht, geschiedt met inachtneming van:
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel71
  - number: 7:1.a)
    text: |-
      algemene en bijzondere aanwijzingen van hiërarchisch hogergeplaatsten ten aanzien van de uitoefening van het
      mandaat en de volmacht;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel71
  - number: 7:1.b)
    text: departementale richtlijnen met betrekking tot paraaf en medeparaaf en het voorleggen en afdoen van stukken;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel71
  - number: 7:1.c)
    text: |-
      de van toepassing zijnde wet- en regelgeving en overige departementale richtlijnen, in
      het bijzonder de [Comptabiliteitswet][ref1], de [Wet op de ondernemingsraden][ref2], het
      [Besluit privaatrechtelijke rechtshandelingen 1996][ref3], het [Besluit taak FEZ][ref4], het
      [Organisatiebesluit BZK][ref5] en (de richtlijnen inzake) administratieve organisatiebeschrijvingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013308
      [ref2]: https://wetten.overheid.nl/BWBR0013308
      [ref3]: https://wetten.overheid.nl/BWBR0013308
      [ref4]: https://wetten.overheid.nl/BWBR0013308
      [ref5]: https://wetten.overheid.nl/BWBR0013308
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0013308
      - id: ref2
        bwb_id: BWBR0013308
      - id: ref3
        bwb_id: BWBR0013308
      - id: ref4
        bwb_id: BWBR0013308
      - id: ref5
        bwb_id: BWBR0013308
  - number: 7:2
    text: |-
      De secretaris-generaal legt op verzoek van een bewindspersoon mondeling of schriftelijk verantwoording af over de
      uitoefening van zijn mandaat en volmacht.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel72
  - number: 7:3
    text: |-
      In gevallen waarin dit besluit niet voorziet, beslist de bewindspersoon die het aangaat over de verlening van
      mandaat of een volmacht.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel73
  - number: 8:1.1
    text: |-
      De directeur Personeel en Organisatie draagt zorg voor de inrichting en het beheer van een centraal mandaat- en
      volmachtregister.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel81
  - number: 8:1.2
    text: 'Het register biedt inzicht in:'
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel81
  - number: 8:1.2.a)
    text: |-
      de functies en namen van functionarissen aan wie door of namens een bewindspersoon (onder)mandaat of een volmacht
      is (door)verleend, met aanduiding van de verleende bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel81
  - number: 8:1.2.b)
    text: |-
      de functies en namen van functionarissen die een bewindspersoon vertegenwoordigen in een (bestuurs)orgaan van een
      rechtspersoon anders dan de Staat, met aanduiding van het (bestuurs)orgaan en de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel81
  - number: 8:1.4
    text: Het register is openbaar.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel81
  - number: 8:1.5
    text: |-
      De directeur Personeel en Organisatie draagt zorg voor de gegevensverstrekking uit het register. Bij de uitvoering
      van deze werkzaamheden pleegt hij zo nodig overleg met de directeur Constitutionele Zaken en Wetgeving en de
      directeur Voorlichting en Communicatie.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel81
  - number: 8:2.1
    text: |-
      In afwijking van [artikel 8:1, tweede lid][ref1], worden gegevens met betrekking tot de verlening van ondermandaat
      en de doorverlening van volmachten aan functionarissen in de rang van directeur en daaronder ressorterende
      functionarissen bij de Algemene Inlichtingen- en Veiligheidsdienst opgenomen in een door het hoofd van de
      Binnenlandse Veiligheidsdienst bijgehouden mandaat- en volmachtregister.


      [ref1]: https://wetten.overheid.nl/BWBR0013170#Artikel8
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0013170
        artikel: '8'
        paragraaf: '8'
  - number: 8:2.2
    text: |-
      Het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst kan in overeenstemming met de secretaris-generaal
      nadere regels stellen ten aanzien van het register, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel82
  - number: 9:1.1
    text: De directeur Personeel en Organisatie is belast met het beheer van dit besluit.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel91
  - number: 9:1.2
    text: |-
      De secretaris-generaal en de diensthoofden, ieder voor zover het hem aangaat, zijn verantwoordelijk voor een
      juiste, volledige en tijdige aanlevering aan de directeur Personeel en Organisatie van de gegevens die een goed
      beheer van dit besluit onderscheidenlijk het mandaat- en volmachtregister mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel91
  - number: 9:1.3
    text: |-
      Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel91
  - number: 9:1.4
    text: |-
      De directeur Personeel en Organisatie rapporteert jaarlijks aan de bewindspersonen en de secretaris-generaal over
      het beheer van dit besluit en het centrale mandaat- en volmachtregister.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel91
  - number: 9:2.1
    text: Wijziging van dit besluit is voorbehouden aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel92
  - number: 9:2.2
    text: |-
      Wijziging van dit besluit geschiedt op voordracht van de directeur Personeel en Organisatie na advies van de
      secretaris-generaal, de directeur Financieel-Economische Zaken en de directeur Constitutionele Zaken en Wetgeving.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel92
  - number: 10:1
    text: Dit besluit treedt in werking met ingang van 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel101
  - number: 10:2
    text: |-
      Dit besluit wordt aangehaald als: Mandaat- en volmachtbesluit secretaris-generaal BZK (MV-besluit secretaris-
      generaal BZK).
    url: https://wetten.overheid.nl/BWBR0013170/2003-09-01#Artikel102
