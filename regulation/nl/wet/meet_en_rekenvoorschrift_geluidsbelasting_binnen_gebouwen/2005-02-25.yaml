      3.3 De correctieterm C (gevelreflectie) bedraagt 3 dB indien de hoek tussen de kortste verbindingslijn geluidbron
      – gebouw en de normaal op de gevel of het gevelvlak 70° of minder is en bedraagt 0 dB indien deze hoek meer dan
      70° is. Bij de bepaling van de partiële geluidwering van een gevel volgens formule (3) wordt gerekend met de
      gebruikelijke gevelstructuren. Indien er sprake is van een bijzondere gevelstructuur kan een correctie worden
      toegepast welke wordt gemotiveerd.

      3.4 Indien de waarden R gegeven zijn voor het A-gewogen standaardreferentiespectrum – dus in dB(A) –, geven de
      formules (3) en (4) direct de geluidwering van de gevel in dB(A).

