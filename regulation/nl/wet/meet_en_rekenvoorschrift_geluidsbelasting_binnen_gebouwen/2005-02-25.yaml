  - number: '9'
    text: |-
      1 Dit besluit kan worden aangehaald als: Meet- en rekenvoorschrift geluidsbelasting binnen gebouwen.

      2 Dit besluit zal worden geplaatst in de Nederlandse Staatscourant. Het treedt in werking op de eerste dag na de
      datum van uitgifte van de Staatscourant waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0003529/2005-02-25#Artikel9
  - number: BI:1
    text: |-
      1.1 De bepaling van de geluidwering dient te geschieden voor de octaaf-banden met de middenfrequenties 125 Hz, 250
      Hz, 500 Hz, 1000 Hz en 2000 Hz.

      1.2 Bij de bepaling van de geluidwering van de gevel dient te worden uitgegaan van het A-gewogen
      referentiespectrum, behorend bij het equivalent geluidsniveau buiten de woning of het andere geluidsgevoelige
      gebouw.

      Het A-gewogen referentiespectrum wordt zodanig weergegeven, dat het bijbehorend geluidsniveau 0 dB is.

      1.3 Tenzij anders vermeld en gemotiveerd, wordt bij de bepaling van de geluidwering als referentiespectrum voor
      weg- of spoorweglawaai het in tabel 1 gegeven standaardspectrum gehanteerd.














                        Octaafbanden met middenfrequentie in Hz






                        frequentie (Hz)


                        125


                        250


                        500


                        1000


                        2000




                        Index i


                        1


                        2


                        3


                        4


                        5




                        C (dB)


                        –14


                        –10


                        –6


