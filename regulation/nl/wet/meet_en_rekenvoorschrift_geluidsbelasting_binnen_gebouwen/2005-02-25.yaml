articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van dit besluit wordt verstaan onder gevel: de bouwkundige constructie die een ruimte in een
      gebouw scheidt van de buitenlucht, daaronder mede begrepen het dak.

      2 In dit besluit worden mede tot de gevel gerekend konstruktiedelen, bevestigd aan het gebouw, die de
      geluidsbelasting binnen dat gebouw beinvloeden door reflectie of afscherming van het geluid.
    url: https://wetten.overheid.nl/BWBR0003529/2005-02-25#Artikel1
  - number: '2'
    text: |-
      1 Het equivalent geluidsniveau binnen een gebouw ten behoeve van de vaststelling van de geluidsbelasting
      ter plaatse, wordt bepaald door het equivalente geluidsniveau buiten het gebouw, bepaald overeenkomstig het
      [Meet- en rekenvoorschrift hoofdstuk V Wet geluidhinder][ref1] (Stcrt. 1982, 161) , het Reken- en Meetvoorschrift
      Verkeerslawaai (Stcrt. 1987, 107 of het [Reken- en meetvoorschrift railverkeerslawaai][ref2] (Stcrt. 1987, PM), te
      verminderen met de geluidwering van de gevel.

      2 De geluidwering van een gevel wordt bepaald door middel van meting. De geluidwering van een gevel kan worden
      bepaald door berekening indien het betreft de bepaling van de geluidwering van een gevel, voordat de voorzieningen
      zijn aangebracht, en alle voor die berekening benodigde gegevens bekend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003513
      [ref2]: https://wetten.overheid.nl/BWBR0004171
    url: https://wetten.overheid.nl/BWBR0003529/2005-02-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003513
      - id: ref2
        bwb_id: BWBR0004171
  - number: '3'
    text: |-
      Bij de bepaling van de geluidwering van de gevel wordt rekening gehouden met:

      a. het geluidsspectrum, behorend bij het equivalente geluidsniveau buiten het gebouw;

      b. de structuur van de gevel en de oriëntatie van de geveldelen ten opzichte van de geluidsbron;

      c. de geluidwerende kwaliteit en de afmetingen van de elementen waaruit de gevel is opgebouwd;

      d. het volume van het betreffend vertrek bij berekening, of de nagalmtijd van het betreffend vertrek bij meting;

      e. de geluidwerende kwaliteit van voorzieningen in de gevel voor ventilatie – niet zijnde ramen – in geopende
      stand;

      f. geluidlekken.
    url: https://wetten.overheid.nl/BWBR0003529/2005-02-25#Artikel3
  - number: '4'
    text: |-
      De meting van de geluidwering van een gevel wordt uitgevoerd volgens de in bijlage 1 bij dit besluit beschreven
      meetmethode.
    url: https://wetten.overheid.nl/BWBR0003529/2005-02-25#Artikel4
  - number: '5'
    text: |-
      De berekening van de geluidwering van een gevel wordt uitgevoerd volgens de in bijlage I bij dit besluit beschreven
      rekenmethode.
    url: https://wetten.overheid.nl/BWBR0003529/2005-02-25#Artikel5
  - number: '6'
    text: |-
      De invoergegevens en de resultaten van de metingen of berekeningen ter bepaling van de geluidsbelasting binnen een
      gebouw, worden vastgelegd overeenkomstig het in bijlage II van dit besluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0003529/2005-02-25#Artikel6
  - number: '7'
    text: |-
      De waarde van de door meting of berekening bepaalde geluidwering wordt afgerond naar het dichtstbijzijnde gehele
      getal, waarbij een halve eenheid wordt afgerond naar het even getal.
    url: https://wetten.overheid.nl/BWBR0003529/2005-02-25#Artikel7
  - number: '8'
    text: |-
      In gevallen waarin toepassing van de in [bijlage I][ref1] beschreven meet- of rekenmethode niet mogelijk is, of
      leidt tot een voor betreffende situatie onvoldoende representatief equivalent geluidsniveau binnen, kan een andere
      meet- of rekenmethode worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0003529
    url: https://wetten.overheid.nl/BWBR0003529/2005-02-25#Artikel8
    references:
