                        –7






      1.3.a Als in de maatgevende periode op de betreffende spoorweg geen railvoertuigen passeren behorende tot de
      categorieën 4 of 5, bedoeld in artikel 1 van het Reken- en meetvoorschrift railverkeerslawaai, kan de met behulp
      van het standaardspectrum bepaalde geluidwering met 3 dB(A) worden vermeerderd.

      1.4 De geluidwering van de gevel wordt genormeerd voor de nagalmtijd in de geluidsgevoelige ruimte. Voor
      geluidsgevoelige ruimten in woningen bedraagt de referentienagalmtijd T 0,5 seconde voor de onder 1.1. genoemde
      octaafbanden. Voor geluidsgevoelige ruimten, anders dan woonruimten, in andere geluidsgevoelige gebouwen dan
      woningen bedraagt de referentienagalmtijd T 0,8 seconde voor de onder 1.1. genoemde octaafbanden.

      1.5 Indien door een aanwezige gevel, anders dan door het openen van ramen, ventilatie kan plaatsvinden, zoals
      door kieren, ventilatieroosters of ventilatieklepjes, dan wordt de geluidwering bepaald voor de situatie dat
      desbetreffende ventilatieopeningen zijn gesloten en afgedicht. Ter compensatie wordt een opening in de gevel in
      rekening gebracht ter grootte van de helft van de volgens de bouwverordening te bepalen ventilatie-opening in de
      gevel, met een geluidsisolatiewaarde van 0 dB(A) voor het netto oppervlak van de opening.

      Indien evenwel ventilatie-openingen in de gevel aanwezig zijn of worden aangebracht waaraan een hogere
      geluidsisolatiewaarde wordt toegekend dan 0 dB(A), dan worden deze bij de bepaling van de geluidwering geopend
      respectievelijk geopend geacht.
    url: https://wetten.overheid.nl/BWBR0003529/2005-02-25#Artikel1
  - number: BI:2
    text: |-
      2.1 Ter bepaling van de waarde van de geluidwering van de gevel worden metingen uitgevoerd per begrenzingsvlak
      met behulp van een luidspreker of een luidsprekerscombinatie op zodanige wijze dat de metingen voor wat betreft de
      invalsrichtingen representatief kunnen worden geacht.

      Daarbij wordt uitgegaan van een geluidsbron op één of meer vaste posities.

      Het begrenzingsvlak wordt daartoe onder een hoek van 45° ± 5° ten opzichte van de normaal aangestraald, zodanig dat
      de geluidsbelasting op de andere van belang zijnde begrenzingsvlakken te verwaarlozen is. De afstand van de bron
      tot het begrenzingsvlak gemeten vanuit de geluidsgevoelige ruimte is ten minste tweemaal de gevelbreedte (van die
      ruimte). De bron dient een signaal voort te brengen met het karakter van een ruis en met een breedte van tenminste
      één octaaf waarvan de middenfrequentie overeenkomt met de middenfrequentie van het te meten octaafgeluiddrukniveau.
      De frequentiekarakteristiek moet vlak zijn binnen een hoek van ca. 40°.

      De door de bron op de meetplaatsen veroorzaakte geluidsniveaus dienen ten minste 10 dB hoger te zijn dan het
      achtergrondgeluid, dat wil zeggen alle geluiden die niet van de bron afkomstig zijn.

      2.2 Het geluiddrukniveau buiten het gebouw L wordt per octaafband bepaald op 2 meter afstand van het
      begrenzingsvlak. Het (ruimtelijk gemiddelde) geluiddrukniveau binnen de ruimte L wordt per octaafband bepaald.
      Voor indicatieve doeleinden kan voor de bepaling van het geluiddrukniveau binnen de geluidgevoelige ruimte – L
      – eventueel worden volstaan met één meting op 1 à 1,5 meter van het gevelvlak, ter hoogte van het middel van de
      gevel. Ter compensatie van een systematische fout dient het aldus gemeten geluiddrukniveau met 1 dB te worden
      verlaagd.

      2.3 In de geluidsgevoelige ruimte dient per octaafband met de middenfrequenties 125 Hz, 250 Hz, 500 Hz, 1000 Hz,
      2000 Hz, de nagalmtijd T te worden bepaald. Uit de waarden L, L  en T en de referentienagalmtijd T, (zie onder 1.4)
      wordt het partiële geluidsniveauverschil van de gevel D bepaald volgens de formule:

      D= L – L + 10 log (T/T) (dB) (1)

      2.4 In verband met reflecties van het geluid op de gevel dient het partiële geluidsniveauverschil gecorrigeerd te
      worden voor de bepaling van de partiële geluidwering volgens de formule:

      G = D–C (dB) (2)

      waarin C = o of 3 dB.

      Uit de partiele geluidwering G (voor de octaafbanden met de middenfrequenties 125 Hz, 250 Hz, 500 Hz, 1000 Hz,
      en 2000 Hz) wordt rekening houdende met het standaardspectrum de waarde van de geluidwering van de gevel bepaald
      volgens de formule (5) (zie onder 3.5.).

      2.5 De bij de bepaling van de geluiddrukniveaus te gebruiken apparatuur dient zodanig te zijn dat de meetketen
      voldoet aan IEC-publicatie 651, uitgave 1979, type 2.
    url: https://wetten.overheid.nl/BWBR0003529/2005-02-25#Artikel2
