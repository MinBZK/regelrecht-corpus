  - number: '4'
    text: |-
      1 Het staatsexamen en het deelstaatsexamen kan voor ieder vak bestaan uit een college-examen, uit een centraal
      examen of uit beide.

      2 Het college-examen vwo, havo en vmbo, voor zover het betreft de theoretische leerweg, bedoeld in
      [artikel 16 van de wet][ref1], of de gemengde leerweg, bedoeld in [artikel 18 van de wet][ref2], omvat mede een
      profielwerkstuk.

      3 Het profielwerkstuk vwo en havo heeft betrekking op één of meer vakken van het staatsexamen. Ten minste één of
      meer vakken heeft de omvang van 400 uur of meer voor vwo en 320 uur voor havo.

      4 Het profielwerkstuk vmbo heeft betrekking op een thema uit het profiel waarin de leerling onderwijs volgt.

      5 Het centraal examen kent in elk kalenderjaar een eerste, tweede en derde tijdvak of een nader door het College
      voor toetsen en examens, te bepalen tijdstip.

      6 Voor de aanvang van het derde tijdvak zendt Onze Minister aan de inspectie een opgave met de kandidaten, de in
      het eerste of tweede tijdvak door die kandidaten behaalde cijfers, voor zover van toepassing de alsnog behaalde
      cijfers voor het college-examen, en een overzicht van het vak of de vakken waarin elke kandidaat zal worden
      geëxamineerd.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel18
