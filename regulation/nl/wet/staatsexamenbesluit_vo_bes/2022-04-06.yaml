  - number: '5'
    text: |-
      1 Indien een kandidaat zich ten aanzien van enig onderdeel van het staatsexamen of deelstaatsexamen dan wel ten
      aanzien van een aanspraak op ontheffing aan enige onregelmatigheid schuldig maakt of heeft gemaakt, kan het College
      voor toetsen en examens maatregelen nemen.

      2 De maatregelen, bedoeld in het eerste lid, die afhankelijk van de aard van de onregelmatigheid ook in combinatie
      met elkaar genomen kunnen worden, zijn:

      a. het toekennen van het cijfer 1 voor een toets van het college-examen of het centraal examen;

      b. het ontzeggen van de deelname of de verdere deelname aan een of meer toetsen van het college-examen of het
      centraal examen van het desbetreffende vak;

      c. het ongeldig verklaren van een of meer toetsen van het reeds afgelegde deel van het college-examen of het
      centraal examen;

      d. minder vergaande maatregelen dan die, bedoeld onder a tot en met c.

      3 Indien de ontzegging, bedoeld in het tweede lid, onderdeel b, betrekking heeft op een kandidaat die in meer dan
      één vak examen aflegt, kan de ontzegging betrekking hebben op alle toetsen.

      4 Indien de onregelmatigheid pas wordt ontdekt na afloop van het examen, kan het College voor toetsen en examens de
      kandidaat het diploma, bedoeld in [artikel 28, derde lid][ref1], of het certificaat, bedoeld in [artikel 29][ref2],
      en de cijferlijst onthouden, of kan deze bepalen dat aan de betrokken kandidaat dat diploma of certificaat, en
      die cijferlijst, slechts kunnen worden uitgereikt na een hernieuwd examen in de door het College voor toetsen en
      examens aan te wijzen onderdelen en op de door deze te bepalen wijze.

      5 Het besluit waarbij een in het eerste lid bedoelde maatregel wordt genomen, wordt tegelijkertijd in afschrift
      toegezonden aan de inspectie en, indien de kandidaat minderjarig is, aan de wettelijke vertegenwoordigers van de
      kandidaat.

      6 De kandidaat kan tegen een besluit waarbij een in het eerste lid bedoelde maatregel wordt genomen bezwaar maken
      bij het College voor toetsen en examens. De termijn voor het indienen van een bezwaarschrift bedraagt vijf dagen
      nadat het besluit aan de kandidaat is bekendgemaakt op de voorgeschreven wijze. Het College voor toetsen en examens
      beslist binnen twee weken na ontvangst van het bezwaarschrift, tenzij het college deze termijn heeft verlengd met
      ten hoogste twee weken. Het College voor toetsen en examens stelt bij zijn beslissing zo nodig vast op welke wijze
      de kandidaat alsnog in de gelegenheid zal worden gesteld het examen geheel of gedeeltelijk af te leggen of opnieuw
      af te leggen. Het College voor toetsen en examens deelt zijn beslissing op het bezwaar mee aan de wettelijke
      vertegenwoordigers van de kandidaat die minderjarig is en aan de inspectie.

      7 De kandidaat die onaangekondigd afwezig is bij het centraal examen in een vak, dan wel met aankondiging maar
      zonder een door het College voor toetsen en examens aanvaarde reden, afwezig is bij enig onderdeel van het
      staatsexamen of deelstaatsexamen, is uitgesloten van verdere deelname aan het centraal examen in dat vak alsmede
      van deelname aan het college-examen in het desbetreffende vak.


      [ref1]: https://wetten.overheid.nl/BWBR0029981#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0029981#Artikel29
