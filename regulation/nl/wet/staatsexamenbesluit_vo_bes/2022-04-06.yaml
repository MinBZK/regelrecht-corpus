  - number: '6'
    text: |-
      1 Het staatsexamen wordt afgenomen overeenkomstig het desbetreffende examenprogramma, vastgesteld op grond van
      [artikel 6 van het Eindexamenbesluit VO BES][ref1].

      2 Ten aanzien van het college-examen geldt dat:

      a. keuzen die ingevolge het in het eerste lid bedoelde examenprogramma moeten of kunnen worden gemaakt door de
      school, worden gemaakt door het College voor toetsen en examens, en

      b. het College voor toetsen en examens kan afwijken van voorschriften met betrekking tot het schoolexamen die om
      praktische redenen in het college-examen niet uitvoerbaar zijn, met dien verstande dat het college-examen zoveel
      mogelijk gelijkwaardig blijft aan het schoolexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel6
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '6'
  - number: '7'
    text: |-
      1 De [artikelen 11][ref1], [12][ref2], [13][ref3], [13a](onbekend), [14][ref4] en [17a van het Eindexamenbesluit
      VO BES](onbekend) voor zover zij betrekking hebben op het eindexamen vwo van opleidingen vavo, het eindexamen
      havo van opleidingen vavo, het eindexamen vmbo theoretische leerweg van opleidingen vavo en het eindexamen in de
      algemene vakken van de overige leerwegen van het vmbo, zijn van overeenkomstige toepassing op respectievelijk het
      staatsexamen vwo, het staatsexamen havo en het staatsexamen vmbo.

      2 In afwijking van het eerste lid kan het College voor toetsen en examens, al dan niet voor een bepaalde groep van
      kandidaten, besluiten dat geen gelegenheid wordt gegeven tot het afleggen van examen in een vak dat uitsluitend
      behoort tot het vrije deel van de profielen of tot het vrije deel van een leerweg van het vmbo. De eerste volzin is
      van overeenkomstige toepassing ten aanzien van de vakken kunst (drama) en kunst (dans).


