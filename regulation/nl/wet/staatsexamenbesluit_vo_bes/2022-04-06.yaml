  - number: '24'
    text: |-
      1 De kandidaat die het staatsexamen van een leerweg in het vmbo heeft afgelegd, is geslaagd indien:

      a. het rekenkundig gemiddelde van zijn bij het centraal examen behaalde cijfers ten minste 5,5 is;

      b. hij:

      1°. voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 of meer en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald;

      2°. voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer waarvan ten minste één 7 of meer heeft behaald; of

      3°. voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald en voor de
      overige vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer waarvan ten minste één 7 of meer
      heeft behaald; en

      c. hij voor geen van de onderdelen, genoemd in het derde of vierde lid, lager dan het eindcijfer 4 heeft behaald;

      d. als het een staatsexamen gemengde of theoretische leerweg betreft: hij voor het profielwerkstuk de kwalificatie
      «voldoende» of «goed» heeft behaald.

      2 Bij de uitslagbepaling volgens het eerste lid, onderdeel b, wordt in de theoretische leerweg het eindcijfer
      van een profielvak of beroepsgericht keuzevak behorende tot het eindexamen van de gemengde leerweg als bedoeld in
      [artikel 17 van het Eindexamenbesluit VO BES][ref1] niet betrokken, tenzij deze vakken samen tenminste een volledig
      beroepsgericht programma als bedoeld in artikel 17, eerste lid, onderdeel d, van dat besluit vormen. In dat geval
      is het vierde lid van overeenkomstige toepassing.

      3 Bij de uitslagbepaling volgens het eerste lid, onderdeel b, wordt in de basisberoepsgerichte leerweg en de
      kaderberoepsgerichte leerweg het gemiddelde van de eindcijfers van alle beroepsgerichte keuzevakken aangemerkt als
      het eindcijfer van één vak.

      4 Bij de uitslagbepaling volgens het eerste lid, onderdeel b, wordt in de gemengde leerweg het gemiddelde van de
      eindcijfers van het profielvak en alle beroepsgerichte keuzevakken aangemerkt als het eindcijfer van één vak, met
      dien verstande dat het eindcijfer voor het profielvak daarbij net zo vaak meetelt als het aantal eindcijfers van
      beroepsgerichte keuzevakken dat in de berekening wordt betrokken.

      5 Het eindcijfer, bedoeld in het derde en vierde lid, wordt bepaald als het rekenkundig gemiddelde van de
      eindcijfers van de samenstellende onderdelen. Indien de uitkomst van deze berekening niet een geheel getal is,
      wordt dat getal indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat
      cijfer een 5 of hoger is, naar boven afgerond.

      6 De kandidaat die niet voldoet aan de voorwaarden, genoemd in het eerste lid, is afgewezen voor het staatsexamen.

      7 Zodra de uitslag ingevolge het eerste en tweede lid, is vastgesteld, maakt het College voor toetsen en examens
      deze samen met de eindcijfers schriftelijk aan de kandidaat bekend. Indien de kandidaat is afgewezen voor het
      staatsexamen, wordt bij de bekendmaking mededeling gedaan van het in [artikel 25][ref2] bepaalde. De in de eerste
      volzin bedoelde uitslag is de definitieve uitslag indien artikel 25 geen toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0029981#Artikel25
