  - number: '13'
    text: |-
      Het college-examen bestaat uit een examendossier. Het examendossier is het geheel van de onderdelen van het
      college-examen zoals gedocumenteerd in een door het College voor toetsen en examens gekozen vorm.
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel13
  - number: '14'
    text: |-
      1 Het college-examen wordt beoordeeld met een cijfer uit de reeks van 1 tot en met 10.

      2 Indien in een vak tevens centraal examen wordt afgelegd, worden de in het eerste lid genoemde cijfers gebruikt
      met de daartussenliggende cijfers met 1 decimaal.

      3 In afwijking van het eerste lid wordt het profielwerkstuk vmbo beoordeeld met «voldoende» of «goed».
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel14
  - number: '15'
    text: |-
      Indien bij het College voor toetsen en examens, al dan niet naar aanleiding van mededelingen van de kandidaat,
      twijfel is gerezen over de juistheid van de beoordeling van het college-examen in enig vak of onderdeel van een
      vak, kan het College voor toetsen en examens die beoordeling ongeldig verklaren en een nieuw examen in dat vak of
      onderdeel opleggen.
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel15
  - number: '16'
    text: |-
      1 Onze Minister zorgt voor het tijdig beschikbaar stellen van de opgaven, bedoeld in
      [artikel 2, tweede lid, onderdeel c, van de Wet College voor toetsen en examens][ref1] aan het College voor
      toetsen en examens.

      2 Het College voor toetsen en examens zorgt ervoor dat de opgaven en correctievoorschriften voor het centraal
      examen geheim blijven tot de aanvang van de toets waarbij deze opgaven aan de kandidaten worden voorgelegd.

      3 Tijdens een schriftelijke toets van het centraal examen worden aan de kandidaten geen mededelingen van welke aard
      ook aangaande de opgaven gedaan, uitgezonderd mededeling van door het College voor toetsen en examens vastgestelde
      errata.

      4 Het College voor toetsen en examens draagt er zorg voor dat het nodige toezicht bij het centraal examen wordt
      uitgeoefend. Zij die toezicht hebben gehouden, maken daarvan een proces-verbaal op en leveren dit samen met het
      gemaakte examenwerk in bij het College voor toetsen en examens.

      5 Een kandidaat die te laat komt, mag nog tot uiterlijk een half uur na de aanvang van een toets worden toegelaten.

      6 De aan de kandidaten voorgelegde opgaven voor een schriftelijke toets van het centraal examen blijven in het
      examenlokaal tot het einde van die toets.

      7 De kandidaten leveren de opgaven, de door hen gemaakte aantekeningen alsmede andere door hen gemaakte stukken in
      bij een van degenen die toezicht houden. Het College voor toetsen en examens bepaalt, in welke gevallen kan worden
      afgeweken van de eerste volzin, alsmede in welke gevallen en op welk tijdstip de opgaven, de aantekeningen en de
      andere stukken, bedoeld in die volzin, aan de kandidaten worden teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '17'
    text: |-
      1 Het College voor toetsen en examens draagt er zorg voor dat het gemaakte werk voor het centraal examen door twee
      door het College voor toetsen en examens aan te wijzen correctoren wordt beoordeeld.

      2 De correctoren kijken het werk onafhankelijk van elkaar na en zenden het met hun beoordeling aan het College
      voor toetsen en examens. De correctoren passen bij hun beoordeling toe de beoordelingsnormen, bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref1]. De correctoren drukken hun
      beoordeling uit in een score overeenkomstig de regels, bedoeld in artikel 2, tweede lid, onderdeel e, van de Wet
      College voor toetsen en examens.

      3 Indien dit het College voor toetsen en examens noodzakelijk voorkomt, wordt het oordeel van een derde corrector
      ingeroepen. Het tweede lid is van overeenkomstige toepassing.

      4 Het College voor toetsen en examens stelt op grond van de beoordelingen door de correctoren de eindscore vast.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '18'
    text: |-
      Het College voor toetsen en examens stelt op grond van de eindscore, bedoeld in [artikel 17, vierde lid][ref1], het
      cijfer vast voor het centraal examen. Het College voor toetsen en examens neemt daarbij in acht de regels, bedoeld
      in [artikel 2, tweede lid, onderdeel e, van de Wet College voor toetsen en examens][ref2] en gebruikt daarbij één
      van de cijfers uit de schaal lopend van 1 tot en met 10, met de tussenliggende cijfers met 1 decimaal.


      [ref1]: https://wetten.overheid.nl/BWBR0029981#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0025364#Artikel2
