  - number: '19'
    text: |-
      1 Indien het centraal examen naar het oordeel van de inspectie niet op regelmatige wijze heeft plaatsgevonden, kan
      zij besluiten dat het geheel of gedeeltelijk voor een of meer kandidaten opnieuw wordt afgenomen.

      2 Indien het eerste lid toepassing vindt, stelt het College voor toetsen en examens op verzoek van de inspectie
      nieuwe opgaven vast en bepaalt op welke wijze en door wie het examen zal worden afgenomen.
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel19
  - number: '20'
    text: |-
      Indien door onvoorziene omstandigheden het centraal examen in één of meer vakken niet op de voorgeschreven wijze
      kan worden afgenomen, beslist het College voor toetsen en examens hoe dan moet worden gehandeld.
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel20
  - number: '21'
    text: |-
      1 Indien een kandidaat om een geldige reden, ter beoordeling van het College voor toetsen en examens:

      a. is verhinderd bij één of meer toetsen van het centraal examen in het eerste tijdvak tegenwoordig te zijn, wordt
      hem in het tweede tijdvak de gelegenheid gegeven het centraal examen op ten hoogste twee toetsen te voltooien;

      b. ook in het tweede tijdvak verhinderd is, of wanneer hij het centraal examen in het tweede tijdvak niet kan
      voltooien, wordt hij in de gelegenheid gesteld in het derde tijdvak het centraal examen te voltooien;

      c. ook in het derde tijdvak verhinderd is, of wanneer hij het centraal examen in het derde tijdvak niet kan
      voltooien, wordt hij in de gelegenheid gesteld in het vierde tijdvak het centraal examen te voltooien.

      2 Toepassing van het eerste lid geschiedt onverminderd [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029981#Artikel5
