        artikel: 58nh
  - number: 34d
    text: |-
      1 De kandidaat die in 2022 door het College voor toetsen en examens is geëxamineerd heeft in afwijking van
      [artikel 25, tweede lid][ref1], het recht om:

      a. voor twee door de kandidaat te kiezen vakken opnieuw deel te nemen aan het college-examen of onderdelen daarvan;
      en

      b. voor de onder a bedoelde vakken opnieuw deel te nemen aan het centraal examen.

      2 Bij de toepassing van [artikel 25, derde lid][ref2], wordt [artikel 34e][ref3] buiten beschouwing gelaten.


