preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap, van 21 september 2010,
    nr. WJZ/236430 (3845), directie Wetgeving en Juridische Zaken, gedaan mede namens de Staatssecretaris van
    Binnenlandse Zaken en Koninkrijksrelaties;

    Gelet op de artikelen 72, 74, 75, 116 en 206, derde lid, van de Wet voortgezet onderwijs BES en artikel 7.4.13,
    derde en vijfde lid, van de Wet educatie en beroepsonderwijs BES;

    De Afdeling advisering van de Raad van State gehoord (advies van 20 oktober 2010, No. W05.10.0460);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschap, van 21 april 2011, nr. WJZ/256921
    (3845), directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van Binnenlandse Zaken en
    Koninkrijksrelaties;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *basisberoepsgerichte leerweg:* de basisberoepsgerichte leerweg, bedoeld in [artikel 18 van de wet][ref1];
        - *centraal examen:* het centraal examen, bedoeld in [artikel 4, derde lid][ref2];
        - *college-examen:* het college-examen, bedoeld in [artikel 4, tweede lid][ref3];
        - *College voor toetsen en examens:* College voor toetsen en examens, genoemd in
      [artikel 2, eerste lid, van de Wet College voor toetsen en examens][ref4];
        - *deeleindexamen:* het deeleindexamen, bedoeld in [artikel 1, eerste lid, van het Eindexamenbesluit VO BES][ref5];
        - *deelstaatsexamen:* het examen in één of meer van de voor het staatsexamen voorgeschreven vakken;
        - *digitale examinering*: het voorbereiden, afnemen en afwikkelen van het centraal examen in één of meer vakken met
      gebruikmaking van de daartoe door het College voor toetsen en examens beschikbaar gestelde programmatuur;
        - *gemengde leerweg:* de gemengde leerweg, bedoeld in [artikel 29 van de wet][ref6];
        - *havo:* hoger algemeen voortgezet onderwijs als bedoeld in [artikel 14 van de wet][ref7];
        - *herkansing*: het opnieuw deelnemen aan een toets van het centraal examen of het college-examen;
        - *inspectie:* de inspectie, bedoeld in [artikel 1 van de Wet op het onderwijstoezicht][ref8];
        - *instelling voor educatie en beroepsonderwijs:* een instelling als bedoeld in
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs BES][ref9], voor zover het betreft door die instelling
      verzorgde opleidingen vavo;
        - *kaderberoepsgerichte leerweg:* de kaderberoepsgerichte leerweg, bedoeld in [artikel 18 van de wet][ref10];
        - *kandidaat:* degene die zich op grond van [artikel 3][ref11] heeft aangemeld voor toelating tot het afleggen van
      het staatsexamen of deelstaatsexamen;
        - *mavo:* middelbaar algemeen voortgezet onderwijs, als bedoeld in [artikel 15 van de wet][ref12];
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *opleiding vavo:* een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs BES][ref13], voor zover leidend
      tot het diploma vwo, het diploma havo of het diploma vmbo theoretische leerweg;
        - *profiel:* een in [artikel 16][ref14], [18][ref15], [29][ref16] of [38 van de wet][ref17] genoemd profiel;
        - *profielwerkstuk:* het in [artikel 4, tweede lid, van het Eindexamenbesluit VO BES][ref18] bedoelde
      profielwerkstuk;
        - *school:* een school voor vwo, een school voor havo of een school voor vmbo, tenzij anders blijkt;
        - *staatsexamen:* het staatsexamen ter verkrijging van het diploma vwo, het diploma havo of het diploma
      vmbo, met dien verstande dat het staatsexamen vmbo voor zover het betreft de basisberoepsgerichte leerweg, de
      kaderberoepsgerichte leerweg of de gemengde leerweg enkel in de algemene vakken wordt afgenomen;
        - *theoretische leerweg:* de theoretische leerweg, bedoeld in [artikel 16 van de wet][ref19];
        - *toets:* een toets met schriftelijke of mondelinge vragen en opdrachten, of een praktische opdracht;
        - *vmbo:* voorbereidend middelbaar beroepsonderwijs als bedoeld in [artikel 44 van de wet][ref20];
        - *vwo:* voorbereidend wetenschappelijk onderwijs als bedoeld in [artikel 13 van de wet][ref21];
        - *wet:* [Wet voortgezet onderwijs BES][ref22].


