  - number: '2'
    text: |-
      1 Voor toelating tot het afleggen van het staatsexamen is een bedrag van USD 45 verschuldigd.

      2 Voor toelating tot het afleggen van deelstaatsexamens is USD 17 verschuldigd voor een vak ten aanzien waarvan
      alleen het centraal examen of alleen het college-examen wordt afgelegd, en USD 20 voor een vak ten aanzien waarvan
      zowel het college-examen als het centraal examen wordt afgelegd, met dien verstande dat per kalenderjaar in totaal
      niet meer is verschuldigd dan USD 45.

      3 Het verschuldigde bedrag wordt voldaan op de wijze en voor de datum, bepaald door het College voor toetsen en
      examens.

      4 Het eerste en tweede lid zijn niet van toepassing op kandidaten die afkomstig zijn van een school voor speciaal
      voortgezet onderwijs.

      5 Ten aanzien van kandidaten afkomstig van een school ten aanzien waarvan toepassing is gegeven aan
      [artikel 72, lid 1a, van de wet][ref1], of een instelling voor educatie en beroepsonderwijs ten aanzien waarvan
      toepassing is gegeven aan [artikel 6.2.2a van de Wet educatie en beroepsonderwijs BES][ref2], is het bedrag,
      bedoeld in het eerste en tweede lid, verschuldigd door het bevoegd gezag van die school of instelling.

      6 Zij die aan een staatsexamen of deelstaatsexamen deelnemen, zijn verplicht zich te legitimeren op verzoek van hen
      die deze examens afnemen of daarop toezicht houden.

      7 De in dit artikel bedoelde bedragen kunnen bij regeling van Onze Minister worden gewijzigd voor zover de
      consumentenprijsindex daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel6.2.2a
