        bwb_id: BWBR0029981
        artikel: '12'
        hoofdstuk: III
        afdeling: '1'
  - number: 34c
    text: |-
      1 De kandidaat kan de toetsen van het centraal examen in het eerste en in het tweede tijdvak voor het eerst
      afleggen.

      2 De kandidaat stelt het College voor toetsen en examens uiterlijk 22 april op een door het College voor toetsen
      en examens te bepalen wijze in kennis van de toetsen van het centraal examen die hij in het eerste of het tweede
      tijdvak voor het eerst wil afleggen.

      3 Indien de kandidaat het College voor toetsen en examens niet overeenkomstig het tweede lid in kennis stelt, laat
      het College voor toetsen en examens uiterlijk 29 april aan de kandidaat weten welke toetsen van het centraal examen
      de kandidaat in het eerste of tweede tijdvak voor het eerst aflegt.

      4 In aanvulling op [artikel 21, eerste lid][ref1], geeft het College voor toetsen en examens een kandidaat die
      door te voldoen aan de verplichting opgenomen in [artikel 58nh van de Wet publieke gezondheid][ref2], of aan de
      richtlijnen van het Rijksinstituut voor Volksgezondheid en Milieu zoals beschreven in het generiek kader voortgezet
      onderwijs en voortgezet speciaal onderwijs, niet in staat is om één of meerdere toetsen van het centraal examen af
      te leggen de gelegenheid die toetsen in het eerstvolgende tijdvak af te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0029981#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58nh
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel34c
