  - number: 2a
    text: |-
      Tot het staatsexamen vmbo in de basisberoepsgerichte leerweg, de kaderberoepsgerichte leerweg of de gemengde
      leerweg, wordt uitsluitend toegelaten de kandidaat die ten tijde van de aanmelding voor het staatsexamen is
      ingeschreven als student als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref1], eerder is afgewezen voor
      het eindexamen vmbo in een van de genoemde leerwegen, en een cijferlijst overlegt waaruit blijkt dat voor het
      beroepsgerichte programma waarin eindexamen is afgelegd, het eindcijfer 6 of meer is behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: '3'
    text: |-
      1 Het College voor toetsen en examens stelt de aanmeldingsprocedure vast. Onze Minister maakt de
      aanmeldingsprocedure tijdig bekend, voert die uit en bevestigt schriftelijk de aanmelding aan de kandidaat. Indien
      de kandidaat minderjarig is, wordt de aanmelding medeondertekend door diens wettelijke vertegenwoordigers.

      2 De aanmelding kan strekken tot:

      a. het verkrijgen van toelating tot het afleggen van het examen ten overstaan van het College voor toetsen en
      examens, of

      b. het overleggen aan het College voor toetsen en examens van de in [artikel 23, derde lid][ref1], bedoelde
      bewijsstukken ter verkrijging van het staatsexamendiploma, al dan niet in combinatie met het afleggen van het
      examen in een of meer vakken ten overstaan van het College voor toetsen en examens.

      3 Uit de aanmelding voor het staatsexamen blijkt tevens of sprake is van een of meer vrijstellingen of ontheffingen
      als bedoeld in de [artikelen 9][ref2] en [10][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0029981#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0029981#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0029981#Artikel10
