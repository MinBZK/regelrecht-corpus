  - number: '8'
    text: |-
      De kandidaat kiest, met inachtneming van dit hoofdstuk, in welke vakken hij het staatsexamen of deelstaatsexamen
      aflegt.
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel8
  - number: '9'
    text: |-
      1 Onverminderd vrijstellingen en ontheffingen op grond van de [artikelen 11][ref1], [12][ref2], [13][ref3], [13a]
      (onbekend) en [14][ref4] en voor zover het betreft de algemene vakken, de [artikelen 15][ref5], [16][ref6],
      [17][ref7] en [17a van het Eindexamenbesluit VO BES](onbekend), is de kandidaat die staatsexamen aflegt:

      a. vrijgesteld van het examen in een vak in het vwo op grond van een examen vwo, indien voor het overeenkomstige
      vak een eindcijfer 6 of hoger is behaald;

      b. vrijgesteld van het examen in een vak in het havo op grond van een examen vwo of havo, indien voor het
      overeenkomstige vak een eindcijfer 6 of hoger is behaald;

      c. vrijgesteld van het examen in een vak in de theoretische of gemengde leerweg van het vmbo op grond van een
      examen vwo, havo, vmbo theoretische leerweg of vmbo gemengde leerweg, indien voor het overeenkomstige vak een
      eindcijfer 6 of hoger is behaald;

      d. vrijgesteld van het examen in een vak in de basisberoepsgerichte of kaderberoepsgerichte leerweg van het vmbo op
      grond van een examen vwo, havo of vmbo, indien voor het overeenkomstige vak een eindcijfer 6 of hoger is behaald;

      e. vrijgesteld van het examen in een vak van het vwo, havo of vmbo op grond van het overeenkomstige examen,
      afgelegd in Aruba, Curaçao, Sint Maarten of Nederland, indien voor het overeenkomstige vak een eindcijfer 6 of
      hoger is behaald;

      f. vrijgesteld van het profielwerkstuk vwo of havo, indien reeds eerder een profielwerkstuk is gemaakt dat
      betrekking heeft op een of meer vakken van dezelfde schoolsoort, behorende tot het profiel van de kandidaat en
      waarvoor een eindcijfer 6 of hoger is behaald;

      g. vrijgesteld van het profielwerkstuk vmbo, indien reeds eerder een profielwerkstuk vmbo is gemaakt dat betrekking
      heeft op een thema uit dat profiel, en dat is beoordeeld als «voldoende» of «goed».

      2 Het eerste lid is uitsluitend van toepassing indien na het jaar waarin het eindcijfer of de beoordeling is
      vastgesteld, nog geen 10 jaren zijn verstreken.

      3 In aanvulling op het eerste lid, onder a tot en met d, is de kandidaat vrijgesteld van het onderdeel literatuur
      van elke moderne taal, indien de kandidaat bij het eerder afgelegde examen, voor literatuur een cijfer 6 of hoger
      heeft behaald.

      4 In aanvulling op het eerste lid, onder a tot en met f, en derde lid, is de daar bedoelde kandidaat eveneens
      vrijgesteld indien het eindcijfer 5 of 4 is behaald, mits de kandidaat voldoet aan de voorwaarden van
      [artikel 24][ref8] of [artikel 24a][ref9] om te slagen voor het staatsexamen.

      5 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven voor de toepassing van het eerste lid.

      6 [Artikel 39, achtste lid, van het Eindexamenbesluit VO BES][ref10] is van overeenkomstige toepassing.


