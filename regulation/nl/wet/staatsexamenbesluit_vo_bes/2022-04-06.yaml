        artikel: '10'
        hoofdstuk: II
  - number: '12'
    text: |-
      1 Het examenreglement bevat in elk geval informatie over de maatregelen, bedoeld in [artikel 5][ref1], en de
      toepassing daarvan, regels met betrekking tot de organisatie van het staatsexamen en deelstaatsexamen en de gang
      van zaken tijdens het staatsexamen en deelstaatsexamen, de herkansingsmogelijkheden van het centraal examen en het
      college-examen.

      2 Het College voor toetsen en examens stelt jaarlijks voor 1 oktober een programma van toetsing en afsluiting vast
      ten behoeve van het daaropvolgende kalenderjaar. Het programma vermeldt in elk geval per vak:

      a. welke onderdelen van het examenprogramma worden getoetst,

      b. de inhoud van de verschillende onderdelen,

      c. de wijze en de tijdstippen waarop het centraal examen en de toetsen van het college-examen aanvangen, alsmede de
      duur van de toetsen,

      d. regels omtrent verhindering voor het college-examen, alsmede

      e. de regels voor de wijze waarop het cijfer voor het college-examen voor een kandidaat tot stand komt.

      3 Het College voor toetsen en examens zendt het examenreglement en het programma van toetsing en afsluiting voor
      1 januari aan de inspectie. Deze documenten worden tegelijk met de bevestiging van de aanmelding, bedoeld in
      [artikel 3, eerste lid][ref2], door de bevestigende instantie aan de kandidaten ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0029981#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0029981#Artikel3
