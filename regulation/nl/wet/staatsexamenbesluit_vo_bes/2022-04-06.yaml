  - number: 34e
    text: |-
      1 Indien dat nodig is om de kandidaat te laten slagen, laat het College voor toetsen en examens bij de bepaling
      van de definitieve uitslag op grond van [artikel 23, tweede lid][ref1], het eindcijfer van één vak, of het
      profielwerkstuk buiten beschouwing.

      2 Een vak bedoeld in het eerste lid kan voor het staatsexamen vwo en havo niet bestaan uit het vak Nederlandse taal
      en literatuur, het vak Engelse taal en literatuur en voor zover van toepassing het vak wiskunde A, B of C, bedoeld
      in [artikel 24a, eerste lid, onderdeel b][ref2].

      3 Het eindcijfer bedoeld in het eerste lid kan niet zijn:

      a. het eindcijfer bedoeld in [artikel 24, derde en vierde lid][ref3], voor het staatsexamen van een leerweg in
      het vmbo;

      b. het eindcijfer bedoeld in [artikel 24a, tweede lid][ref4], voor het staatsexamen vwo en havo.

      4 Het eerste lid is alleen van toepassing op een kandidaat die:

      a. in het examenjaar 2022 één of meerdere vakken van het staatsexamen afrondt;

      b. met inbegrip van het vak dat buiten beschouwing wordt gelaten een staatsexamen heeft afgerond.

      5 Het cijfer, bedoeld in het eerste lid, wordt:

      a. opgenomen op de cijferlijst als bedoeld in [artikel 28, tweede lid][ref5];

      b. betrokken bij de toepassing van [artikel 28a][ref6].

      6 Bij de berekening, bedoeld in [artikel 24, vierde lid][ref7], wordt het gewicht van het profielvak bepaald
      voorafgaand aan toepassing van het eerste lid.


