  - number: '22'
    text: |-
      1 Het eindcijfer voor alle vakken van het staatsexamen en deelstaatsexamen wordt uitgedrukt in een geheel cijfer
      uit de reeks van 1 tot en met 10.

      2 Het College voor toetsen en examens bepaalt het eindcijfer voor een vak op het rekenkundig gemiddelde van het
      cijfer voor het college-examen en het cijfer voor het centraal examen. Indien de uitkomst van deze berekening
      niet een geheel getal is, wordt dat getal indien het eerste cijfer achter de komma een 4 of lager is, naar beneden
      afgerond en indien dat cijfer een 5 of hoger is, naar boven afgerond.

      3 Indien in een vak alleen een college-examen wordt afgenomen, is het cijfer voor het commissie-examen tevens het
      eindcijfer.

      4 Indien in een vak alleen een centraal examen wordt afgenomen, wordt het cijfer voor het centraal examen afgerond
      overeenkomstig het tweede lid en vormt als gevolg hiervan het eindcijfer.
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel22
  - number: '23'
    text: |-
      1 Het College voor toetsen en examens stelt vast of de kandidaat het examen heeft afgelegd in de voor het
      staatsexamen voorgeschreven vakken.

      2 Het College voor toetsen en examens stelt de uitslag van het staatsexamen vast, met inachtneming van de
      [artikelen 22][ref1] en [24][ref2] dan wel [24a][ref3].

      3 De uitslag van het staatsexamen wordt, onverminderd de leden 3a tot en met 3c, vastgesteld op grond van de
      eindcijfers die zijn behaald voor een volledig staatsexamen dat in dat jaar is afgelegd.

      3a In afwijking van het derde lid kan de kandidaat het staatsexamen afleggen door voor de desbetreffende vakken
      bewijsstukken te overleggen als bedoeld in lid 3c. De kandidaat maakt zijn voornemen daartoe bekend aan het College
      voor toetsen en examens.

      3b Indien de kandidaat deelstaatsexamen aflegt, kan de kandidaat daaraan voorafgaand aan het College kenbaar maken,
      het volledig staatsexamen te willen afleggen door voor de ontbrekende vakken, in aanvulling op de cijferlijst voor
      het deelstaatsexamen, aan het College bewijsstukken te overleggen als bedoeld in lid 3c.

      3c De bewijsstukken zijn:

      a. eindcijfers van deelstaatsexamens die in dat jaar zijn afgelegd;

      b. cijferlijsten als bedoeld in [artikel 28][ref4] en [artikel 29, eerste lid][ref5];

      c. cijferlijsten van een school voor voortgezet onderwijs;

      d. resultatenlijsten of cijferlijsten van instellingen voor educatie en beroepsonderwijs;

      e. bewijzen van ontheffing als bedoeld in [artikel 10, vierde lid][ref6];

      f. bewijzen van ontheffing als bedoeld in [artikel 9, vierde lid, van het Eindexamenbesluit VO BES][ref7].

      4 Cijferlijsten worden uitsluitend bij de vaststelling van de uitslag betrokken, indien na het jaar waarin zij
      zijn vastgesteld, nog geen 10 jaren zijn verstreken. Bewijzen van ontheffing worden uitsluitend bij de vaststelling
      van de uitslag betrokken indien na het jaar waarin het onderliggende diploma, getuigschrift of ander bewijsstuk is
      vastgesteld, nog geen 10 jaren zijn verstreken.

      5 De uitslag luidt «geslaagd» of «afgewezen».

      6 Indien dat nodig is om de kandidaat te laten slagen voor het staatsexamen, betrekt het College voor toetsen en
      examens een of meer eindcijfers van de vakken niet bij de bepaling van de definitieve uitslag. De overgebleven
      vakken dienen een staatsexamen te vormen.


