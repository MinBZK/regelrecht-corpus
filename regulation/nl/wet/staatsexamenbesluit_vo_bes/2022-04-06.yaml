  - number: '25'
    text: |-
      1 Onverminderd de [artikelen 5][ref1] en [21][ref2] heeft de kandidaat die in enig jaar met toepassing van
      [artikel 24][ref3] of [artikel 24a][ref4] is afgewezen voor het staatsexamen, recht op herkansing in het derde
      tijdvak van dat jaar. Indien de kandidaat op grond van artikel 21, eerste lid onderdeel b, in de gelegenheid
      wordt gesteld in het derde tijdvak het centraal examen te voltooien, wordt het recht op herkansing uitgeoefend,
      overeenkomstig artikel 21, eerste lid, onderdeel c, op een door het College voor toetsen en examens te bepalen
      tijdstip.

      2 Herkansing houdt in:

      a. het recht om voor één door de kandidaat te kiezen vak waarin hij in dat jaar door het College voor toetsen en
      examens is geëxamineerd, opnieuw deel te nemen aan het college-examen, in door het College voor toetsen en examens
      vast te stellen onderdelen van het examenprogramma, en

      b. het recht om voor één door de kandidaat te kiezen vak waarin hij in dat jaar door het College voor toetsen en
      examens is geëxamineerd, opnieuw deel te nemen aan het centraal examen.

      3 Voorwaarde voor toepassing van het eerste lid is dat de kandidaat daardoor alsnog kan slagen voor het
      staatsexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0029981#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0029981#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0029981#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0029981#Artikel24a
