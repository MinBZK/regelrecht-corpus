  - number: '35'
    text: |-
      De landsexamens, bedoeld in artikel 57 van de Landsverordening voortgezet onderwijs, zoals deze luidde op 9 oktober
      2010, worden voor de laatste maal afgenomen aan het einde van het schooljaar:

      a. 2014–2015 voor de landsexamens voorbereidend secundair beroepsonderwijs als bedoeld in artikel 9 van voornoemde
      landsverordening;

      b. 2015–2016 voor de landsexamens hoger algemeen voortgezet onderwijs als bedoeld in artikel 8 van voornoemde
      landsverordening;

      c. 2016–2017 voor de landsexamens voorbereidend wetenschappelijk onderwijs als bedoeld in artikel 7 van voornoemde
      landsverordening.
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel35
  - number: 35a
    text: |-
      1 Het cijfer van het schoolexamen van het profielvak, bedoeld in
      [artikel 47f, derde lid, Eindexamenbesluit VO BES][ref1], zoals dat artikel luidde op 1 mei 2021, wordt betrokken
      bij de berekening van het rekenkundig gemiddelde, bedoeld in [artikel 24, eerste lid, onderdeel a][ref2].

      2 Deze bepaling vervalt op 1 januari 2032.


