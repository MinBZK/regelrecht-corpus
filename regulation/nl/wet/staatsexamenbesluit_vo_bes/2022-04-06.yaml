  - number: '27'
    text: |-
      1 Het College voor toetsen en examens stelt vast op welke wijze het cijfer van de in [artikel 25][ref1] bedoelde
      herkansing voor het college-examen wordt bepaald. In zijn overwegingen betrekt het college de cijfers voor
      die toetsen van het eerder afgelegde college-examen die betrekking hebben op niet tot de herkansing behorende
      onderdelen van het examenprogramma.

      2 Het hoogste cijfer van de cijfers behaald bij de herkansing en bij het eerder afgelegde college-examen of
      centraal examen geldt als definitief cijfer voor het college-examen respectievelijk centraal examen.

      3 Na afloop van de herkansing wordt de uitslag definitief vastgesteld met overeenkomstige toepassing van
      [artikelen 22 tot en met 24a][ref2] en wordt de uitslag schriftelijk aan de kandidaat bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0029981#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0029981#Artikel22
