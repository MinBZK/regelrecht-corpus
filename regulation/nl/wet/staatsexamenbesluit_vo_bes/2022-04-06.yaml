  - number: '26'
    text: |-
      De kandidaat die recht heeft op de in [artikel 25][ref1] bedoelde herkansing, is alsnog afgewezen indien hij
      niet binnen acht dagen na de in [artikel 24, vierde lid][ref2], of [artikel 24a, vijfde lid][ref3], bedoelde
      bekendmaking het College voor toetsen en examens ervan in kennis stelt dat hij zich aan de herkansing wenst te
      onderwerpen en daarbij schriftelijk opgeeft in welk vak hij opnieuw wil deelnemen aan het college-examen en in welk
      vak hij opnieuw wil deelnemen aan het centraal examen. Het College voor toetsen en examens bevestigt zo spoedig
      mogelijk aan de kandidaat schriftelijk de ontvangst van deze kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0029981#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0029981#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0029981#Artikel24a
