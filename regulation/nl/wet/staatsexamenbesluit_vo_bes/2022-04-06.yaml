  - number: '29'
    text: |-
      1 Het College voor toetsen en examens reikt aan de kandidaat die deelstaatsexamen heeft afgelegd, een cijferlijst
      uit waarop zijn vermeld, voor zover van toepassing:

      a. de cijfers voor het college-examen en het centraal examen,

      b. het vak of de vakken en het onderwerp of de titel van het profielwerkstuk vwo of havo,

      c. het thema en de beoordeling van het profielwerkstuk vmbo, en

      d. de eindcijfers voor de examenvakken.

      2 Het College voor toetsen en examens reikt aan de in het eerste lid bedoelde kandidaat, alsmede aan de kandidaat
      aan wie op grond van de definitieve uitslag niet op grond van [artikel 28, derde lid][ref1], een diploma kan worden
      uitgereikt, een certificaat uit, waarop zijn vermeld, voor zover van toepassing:

      a. het vak of de vakken waarvoor de kandidaat een eindcijfer 6 of meer heeft behaald,

      b. het vak of de vakken en het onderwerp of de titel van het profielwerkstuk vwo of havo, en

      c. het thema en de beoordeling van het profielwerkstuk vmbo, voor zover beoordeeld met «goed» of «voldoende».

      3 Onze Minister stelt het model van het certificaat en de cijferlijst voor het deelstaatsexamen vast.

      4 Het College voor toetsen en examens tekent de certificaten en de cijferlijsten voor het deelstaatsexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0029981#Artikel28
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0029981
        artikel: '28'
        hoofdstuk: IV
  - number: '30'
    text: |-
      1 Duplicaten van afgegeven diploma’s, certificaten, bewijzen van ontheffing en cijferlijsten worden niet verstrekt.

      2 Een schriftelijke verklaring dat een in het eerste lid bedoeld document is afgegeven, welke verklaring dezelfde
      waarde heeft als dat document zelf, kan uitsluitend door of vanwege Onze Minister worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel30
  - number: '31'
    text: |-
      1 Het College voor toetsen en examens kan toestaan dat een gehandicapte kandidaat het examen geheel of gedeeltelijk
      aflegt op een wijze die is aangepast aan de mogelijkheden van die kandidaat. In dat geval bepaalt het College voor
      toetsen en examens de wijze waarop het examen zal worden afgelegd, met dien verstande dat aan de overige bepalingen
      in dit besluit wordt voldaan. Het College voor toetsen en examens doet hiervan zo spoedig mogelijk mededeling aan
      de inspectie.

      2 Tenzij sprake is van een objectief waarneembare lichamelijke handicap, geldt ten aanzien van de in het eerste lid
      bedoelde aangepaste wijze van examineren dat:

      a. een deskundigenverklaring voorligt die door een ter zake kundige psycholoog, orthopedagoog, neuroloog of
      psychiater is opgesteld,

      b. de aanpassing voor zover betrekking hebbend op het centraal examen in ieder geval kan bestaan uit een verlenging
      van de duur van de desbetreffende toets van het centraal examen met ten hoogste 30 minuten, en

      c. een andere aanpassing slechts kan worden toegestaan voor zover daartoe in de onder a genoemde
      deskundigenverklaring ten aanzien van betrokkene een voorstel wordt gedaan dan wel indien de aanpassing aantoonbaar
      aansluit bij de begeleidingsadviezen, vermeld in die deskundigenverklaring.

      3 Het College voor toetsen en examens kan ten aanzien van een kandidaat die de Nederlandse taal onvoldoende
      beheerst, afwijken van de bij of krachtens dit besluit vastgestelde voorschriften, indien de kandidaat met inbegrip
      van het jaar waarin hij staatsexamen of deelstaatsexamen aflegt, ten hoogste zes jaren onderwijs in Nederland
      heeft gevolgd en niet het Nederlands als moedertaal heeft. De in de eerste volzin bedoelde afwijking kan betrekking
      hebben op:

      a. het vak Nederlandse taal en literatuur;

      b. enig ander vak waarbij het gebruik van de Nederlandse taal van overwegende betekenis is.

      4 De in het derde lid bedoelde afwijking bestaat ten aanzien van het centraal examen uitsluitend uit een verlenging
      van de duur van de desbetreffende toets met een door het College voor toetsen en examens noodzakelijk geoordeelde
      periode, en het verlenen van toestemming tot het gebruik van een verklarend woordenboek der Nederlandse taal.

      5 Van elke afwijking op grond van het eerste en derde lid wordt mededeling gedaan aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel31
  - number: '32'
    text: |-
      1 Zo spoedig mogelijk na de vaststelling van de definitieve uitslag zendt het College voor toetsen en examens aan
      Onze Minister en aan de inspectie een lijst die voor iedere kandidaat die niet is geslaagd voor het staatsexamen,
      vermeldt, voor zover van toepassing:

      a. de vakken waarin examen is afgelegd;

      b. de cijfers van het college-examen;

      c. het vak of de vakken waarop het profielwerkstuk vwo of havo betrekking heeft;

      d. de beoordeling en het thema van het profielwerkstuk vmbo;

      e. de cijfers van het centraal examen;

      f. de eindcijfers;

      g. de uitslag van het staatsexamen.

      2 Zo spoedig mogelijk na de vaststelling van de definitieve uitslag zendt het College voor toetsen en examens
      aan Onze Minister en aan de inspectie een lijst die voor iedere kandidaat die is geslaagd voor het staatsexamen,
      vermeldt, voor zover van toepassing:

      a. het profiel of de profielen waarop het examen betrekking heeft;

      b. de vakken die zijn vermeld op de cijferlijst;

      c. de cijfers van het college-examen of in voorkomend geval van het schoolexamen;

      d. het vak of de vakken waarop het profielwerkstuk vwo of havo betrekking heeft;

      e. de beoordeling en het thema van het profielwerkstuk vmbo;

      f. de cijfers van het centraal examen;

      g. de eindcijfers;

      h. de vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend, met voor zover van toepassing de cijfers
      voor de desbetreffende vakken;

      i. de uitslag van het staatsexamen.

      3 Zo spoedig mogelijk na de vaststelling van de eindcijfers van de kandidaten die deelstaatsexamen hebben afgelegd,
      stuurt het College voor toetsen en examens aan Onze Minister en aan de inspectie een lijst die voor iedere
      kandidaat vermeldt, voor zover van toepassing:

      a. de vakken die zijn vermeld op de cijferlijst;

      b. de cijfers van het college-examen;

      c. het vak of de vakken waarop het profielwerkstuk vwo of havo betrekking heeft;

      d. de beoordeling en het thema van het profielwerkstuk vmbo;

      e. de cijfers van het centraal examen;

      f. de eindcijfers.
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel32
  - number: '33'
    text: |-
      1 Het schriftelijke werk van de kandidaten wordt gedurende ten minste zes maanden na afloop van het examen bewaard
      op een door het College voor toetsen en examens te bepalen wijze. Een kandidaat die voor een vak centraal examen
      aflegt met geheime opgaven kan omtrent zijn werk gedurende genoemde periode van zes maanden inlichtingen inwinnen
      bij het College voor toetsen en examens. Elk der overige kandidaten kan gedurende die periode zijn schriftelijk
      werk inzien.

      2 Een door het College voor toetsen en examens ondertekend exemplaar van de lijst, bedoeld in
      [artikel 32, eerste, tweede en derde lid][ref1], en de door de kandidaat overgelegde documenten, worden gedurende
      ten minste zes maanden na de vaststelling van de uitslag in het archief van het College voor toetsen en examens
      bewaard.

      3 Het College voor toetsen en examens draagt er zorg voor dat een volledig stel van de bij de centrale examens
      gebruikte opgaven gedurende ten minste zes maanden na de vaststelling van de uitslag bewaard blijft in het archief
      van het College voor toetsen en examens.


      [ref1]: https://wetten.overheid.nl/BWBR0029981#Artikel32
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0029981
        artikel: '32'
        hoofdstuk: V
  - number: '34'
    text: |-
      Het College voor toetsen en examens kan bij of krachtens dit besluit vastgestelde voorschriften buiten toepassing
      laten of daarvan afwijken voor zover toepassing gelet op de bijzondere functie van het staatsexamen mede voor
      kandidaten die in bijzondere omstandigheden verkeren, zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel34
  - number: 34a
    text: De bepalingen in dit hoofdstuk zijn van toepassing op de staatsexamens die worden afgenomen in het examenjaar 2022.
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel34a
  - number: 34b
    text: |-
      1 Het College voor toetsen en examens wijzigt het examenreglement en het programma van toetsing en afsluiting,
      bedoeld in [artikel 12][ref1], in het geval:

      a. onderdelen van het examenreglement of het programma van toetsing en afsluiting als gevolg van de covid-19
      epidemie praktisch onuitvoerbaar zijn; of

      b. dat ter uitvoering van dit hoofdstuk noodzakelijk is.

      2 Een wijziging, als bedoeld in het eerste lid, wordt schriftelijk gemotiveerd en na vaststelling onverwijld door
      het College voor toetsen en examens toegezonden aan de inspectie en verstrekt aan de kandidaten.


      [ref1]: https://wetten.overheid.nl/BWBR0029981#Artikel12
    url: https://wetten.overheid.nl/BWBR0029981/2022-04-06#Artikel34b
    references:
