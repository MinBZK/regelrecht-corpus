    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door een
      productie-installatie voor de productie van hernieuwbaar gas uit biomassa als bedoeld in de NTA 8003: 2008, met
      uitzondering van biomassa als bedoeld in de nummers 100, 150, 170 tot en met 179 van de NTA 8003: 2008, door middel
      van vergassing.

      2 Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat ten minste 95%
      van de energetische waarde van de jaarlijks in de productie-installatie gebruikte brandstof biogeen is.

      3 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 6][ref1].

      4 Productie-installaties als bedoeld in het eerste lid worden aangewezen als productie-installaties als bedoeld in
      de [artikelen 32, tweede lid][ref2], en [56, eerste lid, derde volzin, van het besluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0034817
