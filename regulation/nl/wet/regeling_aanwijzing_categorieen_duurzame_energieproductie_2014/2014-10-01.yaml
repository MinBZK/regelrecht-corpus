    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door
      een productie-installatie waarmee hernieuwbare elektriciteit wordt geproduceerd uit gas dat vrijkomt tengevolge
      van biologische afbraakreacties bij de zuivering van huishoudelijk afvalwater, bedrijfsafvalwater en afvloeiend
      hemelwater, gebruik makende van thermische drukhydrolyse, waarbij ten minste het deel van de productie-installatie,
      dat bedoeld is voor thermische drukhydrolyse nieuw is.

      2 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 3][ref1].

      3 Productie-installaties als bedoeld in het eerste lid worden aangewezen als productie-
      installaties als bedoeld in de [artikelen 3, vijfde lid][ref2], [15, tweede en vierde lid][ref3], en
      [56, eerste lid, derde volzin, van het besluit][ref4].


