  - number: '3'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door
      een productie-installatie waarmee door middel van hydro-mechanisch-elektrische omzetting hernieuwbare elektriciteit
      wordt geproduceerd uit potentiële dan wel kinetische energie van stromend water dat niet specifiek ten behoeve van
      de elektriciteitsproductie omhoog is gepompt:

      a. in installaties met een valhoogte gelijk aan of groter dan 50 centimeter, of

      b. in installaties met een valhoogte gelijk aan of groter dan 50 centimeter, die ingrijpend zijn gerenoveerd en
      waarbij ten minste de turbines nieuw zijn.

      2 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 2][ref1].

      3 Productie-installaties als bedoeld in het eerste lid worden aangewezen als productie-installaties als bedoeld in
      de [artikelen 15, tweede en vierde lid][ref2], en [56, eerste lid, derde volzin, van het besluit][ref3].

      4 Productie-installaties als bedoeld in het eerste lid, onderdeel b, worden aangewezen als productie-installaties
      als bedoeld in [artikel 3, eerste lid, onderdeel c, vierde lid, onderdeel b, en vijfde lid, van het besluit][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0034817
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0022735#Artikel56
      [ref4]: https://wetten.overheid.nl/BWBR0022735#Artikel3
