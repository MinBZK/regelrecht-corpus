      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door
      een productie-installatie waarmee door hydro-mechanisch-elektrische omzetting hernieuwbare elektriciteit wordt
      geproduceerd uit potentiële dan wel kinetische energie van stromend water dat niet specifiek ten behoeve van de
      elektriciteitsproductie omhoog is gepompt in installaties met een valhoogte kleiner dan 50 centimeter.

      2 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 2][ref1].

      3 Productie-installaties als bedoeld in het eerste lid worden aangewezen als productie-installaties als bedoeld in
      de [artikelen 15, tweede en vierde lid][ref2], en [56, eerste lid, derde volzin, van het besluit][ref3].


