  - number: '37'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door:

      a. een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd uitsluitend door middel van
      allesvergisting, waarbij ten minste de vergister nieuw is;

      b. een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd uitsluitend door middel van vergisting en
      co-vergisting van dierlijke mest, waarbij ten minste de vergister nieuw is, of

      c. een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd uitsluitend door middel van vergisting van
      meer dan 95% dierlijke mest, waarbij ten minste de vergister nieuw is.

      2 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 6][ref1].

      3 Productie-installaties als bedoeld in het eerste lid worden aangewezen als productie-installaties als bedoeld in
      de [artikelen 3, vijfde lid][ref2], [32, tweede en vierde lid][ref3], en [56, eerste lid, van het besluit][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0034817
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022735#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0022735#Artikel56
