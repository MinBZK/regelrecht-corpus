      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit en hernieuwbare
      warmte geproduceerd door een productie-installatie voor de productie van hernieuwbare elektriciteit en hernieuwbare
      warmte uitsluitend door middel van thermische conversie van vaste of vloeibare biomassa als bedoeld in de NTA 8003:
      2008, met uitzondering van biomassa als bedoeld in de nummers 100, 150, 170 tot en met 179 van de NTA 8003: 2008:

      a. met een nominaal elektrisch vermogen groter dan 10 MW en kleiner dan of gelijk aan 100 MW en waarbij het
      nominaal elektrisch vermogen ten minste 10% van de som van het nominale warmte en elektrisch vermogen bedraagt, of

      b. met een nominaal elektrisch vermogen kleiner dan of gelijk aan 10 MW en waarbij het nominaal elektrisch vermogen
      ten minste 6% van de som van het nominale warmte en elektrisch vermogen bedraagt.

      2 Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat ten minste 95%
      van de energetische waarde van jaarlijks in de productie-installatie gebruikte brandstof biogeen is.

      3 Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat wordt aangetoond
      dat de gebruikte vloeibare biomassa voldoet aan de duurzaamheidscriteria, bedoeld in artikel 17, eerste lid, van de
      richtlijn hernieuwbare energie.

      4 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 3][ref1].

      5 Productie-installaties als bedoeld in het eerste lid worden aangewezen als productie-installaties als bedoeld in
      de [artikelen 48, tweede en vijfde lid][ref2], en [56, eerste lid, derde volzin, van het besluit][ref3].


