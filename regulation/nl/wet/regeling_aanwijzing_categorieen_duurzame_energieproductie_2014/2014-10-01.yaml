  - number: '62'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte geproduceerd door:

      a. een productie-installatie, bestaande uit één of meerdere doubletten, waarmee hernieuwbare warmte wordt
      geproduceerd uitsluitend door middel van een of meerdere geothermische bronnen met een diepte van minimaal 500
      meter.

      b. een productie-installatie, bestaande uit één of meerdere doubletten, waarmee hernieuwbare warmte wordt
      geproduceerd uitsluitend door middel van een of meerdere geothermische bronnen met een diepte van minimaal 3.300
      meter.

      2 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 7][ref1].

      3 Productie-installaties als bedoeld in het eerste lid worden aangewezen als productie-installaties als bedoeld in
      de [artikelen 48, tweede lid][ref2], en [56, eerste lid, derde volzin, van het besluit][ref3].


