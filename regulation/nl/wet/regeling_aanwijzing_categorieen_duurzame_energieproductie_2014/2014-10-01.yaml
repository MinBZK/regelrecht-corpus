    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare
      elektriciteit en hernieuwbare warmte, geproduceerd door een bestaande productie-
      installatie waarvoor op grond van [artikel 72m van de Elektriciteitswet 1998][ref1] of
      [artikel 2 van de Subsidieregeling opwekken duurzame elektriciteit in vergistingsinstallaties][ref2] subsidie van
      meer dan € 0,00 is ontvangen en waarvoor op het moment van aanvraag de subsidieperiode op grond van voorgenoemde
      artikelen ten minste 7 jaar daarvoor is aangevangen:

      a. waarmee hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd uitsluitend door middel van
      allesvergisting en waarbij het nominaal elektrisch vermogen ten minste 20% van de som van het nominale warmte en
      elektrisch vermogen bedraagt;

      b. waarmee hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd uitsluitend door middel van
      vergisting en co-vergisting van dierlijke mest en waarbij het nominaal elektrisch vermogen ten minste 20% van de
      som van het nominale warmte en elektrisch vermogen bedraagt, of

      c. met een nominaal elektrisch vermogen kleiner dan of gelijk aan 50 MW en voor de productie van hernieuwbare
      elektriciteit en hernieuwbare warmte door middel van thermische conversie van vaste of vloeibare biomassa en
      waarbij het nominaal elektrisch vermogen ten minste 6% van de som van het nominale warmte en elektrisch vermogen
      bedraagt.

      2 Een producent aan wie subsidie is verstrekt op grond van het eerste lid, onderdeel c, draagt er zorg voor dat ten
      minste 95% van de energetische waarde van de jaarlijks in de productie-installatie gebruikte brandstof biogeen is.

      3 Een producent aan wie subsidie is verstrekt op grond van het eerste lid, onderdeel c, draagt er zorg voor dat
      wordt aangetoond dat de gebruikte vloeibare biomassa voldoet aan de duurzaamheidscriteria, bedoeld in artikel 17,
      eerste lid, van de richtlijn hernieuwbare energie.

      4 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 3][ref3].

      5 Indien de aanvrager in aanvulling op de subsidie op grond van [artikel 72m van de Elektriciteitswet 1998][ref4] of
      [artikel 2 van de Subsidieregeling opwekken duurzame elektriciteit in vergistingsinstallaties][ref5], subsidie heeft
      ontvangen op grond van [artikel 116 van de Regeling aanwijzing categorieën duurzame energieproductie 2012][ref6],
      [artikel 72 van de Regeling aanwijzing categorieën duurzame energieproductie 2013][ref7], of artikel 72 van deze
      regeling, eindigt de subsidieperiode van deze subsidie in ieder geval op het moment dat de subsidieperiode van de
      subsidie verstrekt op grond van het eerste lid aanvangt.

      6 Productie-installaties als bedoeld in het eerste lid worden aangewezen als productie-installaties
      als bedoeld in de [artikelen 3, eerste lid, onderdeel d, tweede lid, onderdeel a, vijfde lid][ref8],
      [48, tweede en vijfde lid][ref9], [56 eerste lid][ref10], en, indien subsidie is verstrekt op grond
      van [artikel 116 van de Regeling aanwijzing categorieën duurzame energieproductie 2012][ref11],
      [artikel 72 van de Regeling aanwijzing categorieën duurzame energieproductie 2013][ref12], of artikel 72 van deze
      regeling, als productie-installaties als bedoeld in [artikel 3, derde lid, onderdeel a, van het besluit][ref13].


