  - number: '72'
    text: |-
      1 De minister verstrekt op aanvraag subsidie voor de productie van hernieuwbare warmte die voor het eerst nuttig
      wordt gebruikt aan een producent van hernieuwbare elektriciteit en hernieuwbare warmte die de hernieuwbare
      elektriciteit en hernieuwbare warmte produceert door middel van:

      a. een productie-installatie waarmee elektriciteit en hernieuwbare warmte wordt geproduceerd uitsluitend door
      middel van allesvergisting;

      b. een productie-installatie waarmee elektriciteit en hernieuwbare warmte wordt geproduceerd uitsluitend door
      middel van vergisting en co-vergisting van dierlijke mest of door middel van vergisting op een landbouwbedrijf
      van uitsluitend plantaardige stoffen vermeld onder de categorieën A tot en met G1 onder categorie 1 van
      [Bijlage Aa, onderdeel IV van de Uitvoeringsregeling Meststoffenwet][ref1], of

      c. een productie-installatie voor de productie van hernieuwbare elektriciteit en hernieuwbare warmte door middel
      van thermische conversie van vaste of vloeibare biomassa.

      2 Een producent aan wie subsidie is verstrekt op grond van het eerste lid, onderdeel c, draagt er zorg voor dat
      wordt aangetoond dat de gebruikte vloeibare biomassa voldoet aan de duurzaamheidscriteria, bedoeld in artikel 17,
      eerste lid, van de richtlijn hernieuwbare energie.

      3 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 3][ref2].

      4 Productie-installaties als bedoeld in het eerste lid, worden aangewezen als productie-installaties als
      bedoeld in de [artikelen 3, eerste lid, onderdeel a, tweede lid, onderdeel d][ref3], [48, tweede lid][ref4], en
      [56, eerste lid, derde volzin, van het besluit][ref5].

      5 Productie-installaties als bedoeld in het eerste lid, worden, indien subsidie is verstrekt op grond van de
      [regeling aanwijzing categorieën duurzame energieproductie 2008][ref6], aangewezen als productie-installaties als
      bedoeld in [artikel 3, derde lid, onderdeel a, en vijfde lid van het besluit][ref7].

      6 Productie-installaties als bedoeld in het eerste lid worden, indien subsidie
      is verstrekt op grond van [artikel 72m van de Elektriciteitswet 1998][ref8] of
      [artikel 2 van de Subsidieregeling opwekken duurzame elektriciteit in vergistingsinstallaties][ref9], aangewezen
      als productie-installaties als bedoeld in [artikel 3, vijfde lid, van het besluit][ref10].


