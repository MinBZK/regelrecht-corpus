articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *algemene uitvoeringsregeling:* de [Algemene uitvoeringsregeling stimulering duurzame energieproductie][ref1];
        - *allesvergisting:* de biologische afbraakreacties van biomassa als bedoeld in de NTA 8003: 2008, met uitzondering
      van de nummers 410, 420, 500, 550 tot en met 559;
        - *besluit:* het [Besluit stimulering duurzame energieproductie][ref2];
        - *doublet:* combinatie die ten minste bestaat uit één productieput en één injectieput;
        - *groen gas hub:* een verzameling van productie-installaties voor de productie van hernieuwbaar gas waarvoor voor
      de invoeding van het hernieuwbaar gas op een gasnet gezamenlijk een of meerdere aansluitingen worden gebruikt,
      waarmee gezamenlijk hernieuwbare warmte wordt geproduceerd die nuttig wordt gebruikt of waarmee gezamenlijk
      hernieuwbare elektriciteit wordt geproduceerd die op een elektriciteitsnet of installatie, met uitzondering van de
      productie-installatie, wordt ingevoed;
        - *minister::* de Minister van Economische Zaken;
        - *NTA 8003: 2008:* de Nederlandse Technische Afspraak 8003, Classificatie van biomassa voor energietoepassing,
      uitgegeven door het Nederlands Normalisatie-instituut, zoals deze luidde op 31 december 2008;
        - *richtlijn hernieuwbare energie:* [richtlijn nr. 2009/28/EG](32009L0028) van het Europees Parlement en de Raad
      van 23 april 2009 ter bevordering van het gebruik van energie uit hernieuwbare bronnen en houdende wijziging en
      intrekking van [Richtlijn 2001/77/EG](32001L0077) en [Richtlijn 2003/30/EG](32003L0030) (PbEU 2009, L 140);
        - *thermische conversie van vaste of vloeibare biomassa:* de omzetting van vaste of vloeibare biomassa door middel
      van: 1°. verbranding, 2°. een andere thermische behandeling dan bedoeld onder 1° ingeval de producten daarvan
      vervolgens worden verbrand of 3°. de verbranding van producten die voortkomen uit thermische behandeling;
        - *valhoogte:* het verschil in waterpeil voor en achter de installatie voor de productie van hernieuwbare
      elektriciteit met behulp van waterkracht waarbij het maximaal elektrisch ontwerpvermogen van de turbine of de
      generator wordt gerealiseerd;
        - *vergisting en co-vergisting van dierlijke mest:* de biologische afbraakreacties van in hoofdzaak verpompbare
      vaste en vloeibare uitwerpselen van dieren, al dan niet aangevuld met een of meer producten genoemd in de
      [Uitvoeringsregeling Meststoffenwet][ref3], waarbij het restant na vergisting als meststof mag worden verhandeld;
        - *vergisting van meer dan 95% dierlijke mest:* de biologische afbraakreacties van verpompbare vaste en vloeibare
      uitwerpselen van dieren, waarbij minder dan 5% van de massa toegevoegde stoffen per kalenderjaar een andere stof,
      genoemd in de [Uitvoeringsregeling Meststoffenwet][ref4], is dan verpompbare vaste en vloeibare uitwerpselen van
      dieren, waarbij het restant na vergisting als meststof mag worden verhandeld;
        - *nominaal vermogen:* het maximale vermogen van de productie-installatie dat onder nominale condities benut kan
      worden voor de productie van hernieuwbare elektriciteit en/of hernieuwbare warmte en/of hernieuwbaar gas en wat
      door de leverancier gegarandeerd wordt bij continu gebruik. In het geval van geothermische productie-installaties
      dient het nominaal vermogen te zijn bepaald met een waarschijnlijkheid van ten minste 50%.


