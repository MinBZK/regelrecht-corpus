  - number: '80'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte, hernieuwbare elektriciteit
      of hernieuwbare elektriciteit en hernieuwbare warmte geproduceerd door:

      a. een productie-installatie waarmee hernieuwbare warmte wordt geproduceerd uitsluitend door middel van
      allesvergisting, waarbij ten minste de vergister nieuw is;

      b. een productie-installatie waarmee hernieuwbare warmte wordt geproduceerd uitsluitend door middel van vergisting
      en co-vergisting van dierlijke mest, waarbij ten minste de vergister nieuw is;

      c. een productie-installatie waarmee hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd
      uitsluitend door middel van allesvergisting, waarbij ten minste de vergister nieuw is en waarbij het nominaal
      elektrisch vermogen ten minste 20% van de som van het nominale warmte en elektrisch vermogen bedraagt;

      d. een productie-installatie waarmee hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd
      uitsluitend door middel van vergisting en co-vergisting van dierlijke mest, waarbij ten minste de vergister nieuw
      is en waarbij het nominaal elektrisch vermogen ten minste 20% van de som van het nominale warmte en elektrisch
      vermogen bedraagt, of

      e. een productie-installatie waarmee hernieuwbare elektriciteit wordt geproduceerd uitsluitend door middel van
      vergisting van meer dan 95% dierlijke mest, waarbij ten minste de vergister nieuw is.

      2 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 3][ref1].

      3 Productie-installaties als bedoeld in het eerste lid worden aangewezen als productie-installaties als
      bedoeld in de [artikelen 3, vijfde lid][ref2], [32, vijfde lid][ref3], [48, tweede en vijfde lid][ref4], en
      [56, eerste lid, van het besluit][ref5].


