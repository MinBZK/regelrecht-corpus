      1 Subsidie als bedoeld in [artikel 41, eerste lid][ref1], wordt voor een periode van 12 jaar verstrekt.
      De periode vangt niet eerder aan dan nadat de aanvraag om subsidie is gedaan, en de subsidieperiode
      van de subsidie verstrekt op grond van [artikel 72m van de Elektriciteitswet 1998][ref2] of
      [artikel 2 van de Subsidieregeling opwekken duurzame elektriciteit in vergistingsinstallaties][ref3], ten minste 10
      jaar daarvoor is aangevangen.

      2 De subsidie-ontvanger neemt de productie-installatie, bedoeld in [artikel 41, eerste lid][ref4], binnen 3 jaar na
      de datum van inwerkingtreding van de beschikking tot subsidieverlening opnieuw in gebruik.


