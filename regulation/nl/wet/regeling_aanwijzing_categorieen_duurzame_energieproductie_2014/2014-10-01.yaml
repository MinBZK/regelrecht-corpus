  - number: '2'
    text: |-
      1 Het subsidieplafond voor het verlenen van subsidie voor de productie van hernieuwbare elektriciteit,
      hernieuwbaar gas en hernieuwbare warmte op grond van de [artikelen 3, eerste lid][ref1], [5, eerste lid][ref2],
      [7, eerste lid][ref3], [9, eerste lid][ref4], [13, eerste lid][ref5], [15, eerste lid][ref6],
      [17, eerste lid][ref7], [37, eerste lid][ref8], [39, eerste lid][ref9], [41, eerste lid][ref10],
      [43, eerste lid][ref11], [60, eerste lid][ref12], [62, eerste lid][ref13], [64, eerste lid][ref14],
      [66, eerste lid][ref15], [68, eerste lid][ref16], [70, eerste lid][ref17], [72, eerste lid][ref18],
      [74, eerste lid][ref19], [76, eerste lid][ref20], [78, eerste lid][ref21] en [80, eerste lid][ref22],
      die is aangevraagd in de periode van 1 april 2014, 09:00 uur, tot 18 december 2014, 17:00 uur, bedraagt €
      3.500.000.000,00.

      2 De minister verdeelt het bedrag, genoemd in het eerste lid, op volgorde van binnenkomst van de aanvragen.

      3 Per categorie productie-installaties kan in de periode, genoemd in het eerste lid, per adres waarop een
      productie-installatie wordt geplaatst maximaal één aanvraag worden ingediend.

      4 De minister beslist afwijzend op een aanvraag om subsidie voor de productie van hernieuwbare elektriciteit,
      hernieuwbaar gas of hernieuwbare warmte door een productie-installatie van een categorie als bedoeld in het eerste
      lid indien op het moment van indienen van de aanvraag geen toestemming van de eigenaar van de beoogde locatie is
      verkregen voor het plaatsen van de productie-installatie.

      5 Een subsidie als bedoeld in het eerste lid van meer dan € 400.000.000,00 wordt verleend onder de opschortende
      voorwaarde dat binnen zes weken na afgifte van deze beschikking een uitvoeringsovereenkomst overeenkomstig de
      overeenkomst opgenomen in de bij deze regeling behorende [bijlage 1][ref23] tot stand is gekomen tussen de Staat en
      de subsidie-aanvrager.


