preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels te stellen omtrent de instelling, het
    bestuur, de taken en de financiering van de kamers van koophandel en fabrieken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel1
  - number: 1.b
    text: 'SER: Sociaal-Economische Raad;'
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel1
  - number: 1.c
    text: 'kamer: kamer van koophandel en fabrieken;'
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel1
  - number: 1.d
    text: |-
      hoofdvestigingskamer: de kamer waarbij de onderneming op grond van
      [artikel 18, zesde lid, van de Handelsregisterwet 2007][ref1] ingeschreven is of behoort te zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel18
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '18'
  - number: 1.e
    text: |-
      nevenvestigingskamer: de kamer in het gebied waarvan een nevenvestiging van de onderneming gelegen is, niet zijnde
      de hoofdvestigingskamer;
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel1
  - number: 1.f
    text: |-
      samenwerkingsverband: het samenwerkingsverband bedoeld in [artikel 22a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel22a
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: 22a
        hoofdstuk: 4A
  - number: 1.g
    text: |-
      overlegorganisatie: een privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid, die niet bedrijfsmatig
      werkzaam is, blijkens zijn statuten met betrekking tot meerdere bedrijfstakken tot doel heeft de belangen te
      behartigen van ondernemers of werknemers en door de SER voor meerdere kamers als organisatie als bedoeld in
      [artikel 11, eerste lid][ref1], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel11
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel1
    references:
      - id: ref1
