        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '2.1'
    text: |-
      Over het gehele land zijn er kamers van koophandel en fabrieken die tot doel hebben de bevordering van de
      economische belangen van handel, industrie, ambacht en dienstverlening in hun gebied.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel2
  - number: '2.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de kamers ingesteld en opgeheven en wordt voor elke kamer
      het gebied vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel2
  - number: '2.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de gevolgen van de
      instelling, opheffing en gebiedsindeling van de kamers, waarbij zonodig voor de duur van ten hoogste vier jaren
      kan worden afgeweken van het bepaalde bij of krachtens de [artikelen 8][ref1], [9][ref2], [10][ref3], [11][ref4],
      [17][ref5], [36][ref6], [45][ref7], [45a][ref8], [47][ref9], [48][ref10], [49][ref11], [51][ref12] en [52][ref13]
      en [artikel 49 van de Handelsregisterwet 200.][ref14].


