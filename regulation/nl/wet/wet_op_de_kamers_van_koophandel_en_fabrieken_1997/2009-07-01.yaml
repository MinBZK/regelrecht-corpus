        paragraaf: '2'
  - number: '37.2'
    text: Het in het eerste lid bedoelde besluit behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel37
  - number: '37.3'
    text: |-
      Een kamer zendt Onze Minister jaarlijks vóór 1 november een afschrift van het besluit tot vaststelling van de in
      het eerste lid bedoelde bijdrage.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel37
  - number: '37.4'
    text: |-
      Onze Minister beslist binnen 6 weken na het verstrijken van de in het derde lid bedoelde termijn, of de in het
      tweede lid bedoelde goedkeuring wordt verleend.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel37
  - number: '37.5'
    text: |-
      Goedkeuring kan worden onthouden wegens strijd met het recht of met het algemeen belang of indien Onze Minister
      bezwaar heeft tegen de hoogte van het in het desbetreffende besluit vastgestelde bedrag.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel37
  - number: '37.6'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld over de wijze waarop de hoogte van de in het
      eerste lid bedoelde bijdrage wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel37
  - number: '37.7'
    text: |-
      Een besluit als bedoeld in het eerste lid wordt bekendgemaakt door terinzagelegging daarvan ten kantore van de
      kamer en publicatie daarvan in een door Onze Minister aangewezen publicatieblad.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel37
  - number: '41.1'
    text: |-
      De in de [artikelen 36][ref1] en [37][ref2] bedoelde bijdragen zijn verschuldigd door degene aan wie de onderneming
      toebehoort onderscheidenlijk door de rechtspersoon. Behoort de onderneming aan meer dan één persoon toe, dan zijn
      allen hoofdelijk verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel37
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '36'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '37'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '41.2'
    text: |-
      Een kamer is bevoegd de betaling van een vergoeding of bijdrage af te dwingen door het uitvaardigen van een
      dwangbevel.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel41
  - number: '43.1'
    text: |-
      Van de heffingen, bedoeld in de [artikelen 36][ref1] en [37][ref2], zijn in het handelsregister ingeschreven
      ondernemingen waarin uitsluitend landbouw of visserij wordt uitgeoefend, vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel37
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '36'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '37'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '43.2'
    text: |-
      Van de heffingen, bedoeld in de [artikelen 36][ref1] en [37][ref2], zijn in het
      handelsregister ingeschreven ondernemingen die uitsluitend als doel hebben het doen van
      periodieke uitkeringen aan een houder of indirect houder van aandelen als bedoeld in
      [artikel 2, derde lid, onderdeel c, onder eerste, van de Pensioen- en spaarfondsenwet][ref3] en het doen van
      stamrechtuitkeringen als bedoeld in [artikel 19b van de Wet op de loonbelasting 1964][ref4] en uitsluitend
      activiteiten gericht hierop verrichten, vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '36'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '37'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002089
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0002471
        artikel: 19b
  - number: '45.1'
    text: |-
      Het algemeen bestuur stelt de begroting vast en zendt deze aan Onze Minister vóór 1 november van het jaar dat
      voorafgaat aan het kalenderjaar waarop de begroting betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel45
  - number: '45.2'
    text: Het besluit tot vaststelling van de begroting behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel45
  - number: '45.3'
    text: |-
      Onze Minister beslist binnen 6 weken na het verstrijken van de in het eerste lid bedoelde termijn, of de
      goedkeuring wordt verleend.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel45
  - number: '45.4'
    text: De goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel45
  - number: 45a.1
    text: |-
      De begroting behelst een raming van de baten en lasten, een raming van de voorgenomen investeringsuitgaven en een
      raming van de inkomsten en uitgaven.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel45a
  - number: 45a.2
    text: De begrotingsposten worden ieder afzonderlijk van een toelichting voorzien.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel45a
  - number: 45a.3
    text: |-
      Uit de toelichting blijkt voor elke taak of activiteit van een kamer welke begrotingsposten daarop betrekking
      hebben en tevens welke begrotingsposten betrekking hebben op de uitoefening van de bij of krachtens de wet aan een
      kamer opgedragen taken dan wel op andere taken.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel45a
  - number: 45a.4
    text: |-
      Tenzij de activiteiten waarop de begroting betrekking heeft nog niet eerder werden verricht, behelst de begroting
      een vergelijking met de begroting van het lopende jaar en de laatst goedgekeurde jaarrekening.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel45a
  - number: 45b
    text: |-
      Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en de
      begrote baten en lasten dan wel inkomsten en uitgaven, doet een kamer daarvan onverwijld mededeling aan Onze
      Minister onder vermelding van de oorzaak van de verschillen.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel45b
  - number: '46.1'
    text: |-
      Het samenwerkingsverband maakt een overzicht waaruit blijkt op welke wijze de door de kamers
      vastgestelde begrotingen in relatie staan tot de voor de uitvoering van de activiteiten, bedoeld
      in [artikel 27, eerste of zevende lid][ref1], en de voor de uitvoering van de taak, bedoeld in
      [artikel 3 van de Handelsregisterwet 200.][ref2], door het samenwerkingsverband geraamde budgetten en zendt
      dat overzicht aan Onze Minister vóór 1 november van het jaar dat voorafgaat aan het kalenderjaar waarop deze
      begrotingen en deze budgetten betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel3
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021777
        artikel: '3'
  - number: '46.2'
    text: |-
      Het samenwerkingsverband maakt een overzicht waaruit blijkt op welke wijze de door de kamers
      vastgestelde jaarrekeningen in relatie staan tot de in verband met de uitvoering van de activiteiten,
      bedoeld in [artikel 27, eerste of zevende lid][ref1], en de voor de uitvoering van de taak, bedoeld in
      [artikel 3 van de Handelsregisterwet 200.][ref2], gemaakte kosten en zendt dat overzicht aan Onze Minister vóór 1
      juli van het jaar dat volgt op het kalenderjaar waarop deze jaarrekeningen en deze kosten betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel3
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021777
        artikel: '3'
  - number: '46.3'
    text: |-
      De overzichten, bedoeld in het eerste en tweede lid, onderscheiden tussen de taak, bedoeld in
      [artikel 3 van de Handelsregisterwet 200.][ref1], de taak, bedoeld in [artikel 24][ref2], en de overige
      activiteiten, bedoeld in [artikel 27, eerste of zevende lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0009276#Artikel27
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '24'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009276
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '46.4'
    text: |-
      Bij ministeriële regeling kunnen nadere eisen worden gesteld aan de inrichting van de overzichten, bedoeld in het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel46
  - number: '47.1'
    text: |-
      Het algemeen bestuur stelt de jaarrekening vast en zendt deze, gelijktijdig met het jaarverslag als bedoeld in
      [artikel 52, tweede lid][ref1], aan Onze Minister vóór 1 juli van het jaar dat volgt op het kalenderjaar waarop de
      jaarrekening betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel52
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '52'
        hoofdstuk: '8'
  - number: '47.2'
    text: Het besluit tot vaststelling van de jaarrekening behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel47
  - number: '47.3'
    text: |-
      Onze Minister beslist binnen 6 weken na het verstrijken van de in het eerste lid bedoelde termijn of de goedkeuring
      wordt verleend.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel47
  - number: '47.4'
    text: De goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel47
  - number: '48.1'
    text: |-
      De jaarrekening, waarin rekening en verantwoording wordt afgelegd van het financieel beheer en van de geleverde
      prestaties over het verstreken boekjaar, wordt ingericht zoveel mogelijk met overeenkomstige toepassing van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '48.2'
    text: |-
      De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door de kamer
      aangewezen accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. Bij
      de aanwijzing van de accountant bedingt een kamer dat aan Onze Minister desgevraagd inzicht wordt geboden in de
      controlewerkzaamheden van de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '48.3'
    text: |-
      De verklaring, bedoeld in het tweede lid, heeft mede betrekking op de rechtmatige inning en besteding van de
      middelen door een kamer.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel48
  - number: '48.4'
    text: |-
      De accountant voegt bij de verklaring, bedoeld in het tweede lid, tevens een verslag van zijn bevindingen over de
      vraag of het beheer en de organisatie van een kamer voldoen aan de eisen van doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel48
  - number: '49'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de inrichting van en de toelichting op de
      begroting en de jaarrekening, omtrent eisen met betrekking tot de hoogte en samenstelling van het eigen vermogen en
      omtrent aandachtspunten voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel49
  - number: 49a.1
    text: 'Een kamer behoeft de voorafgaande instemming van Onze Minister voor:'
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel49a
  - number: 49a.1.a
    text: het oprichten van dan wel financieel deelnemen in een rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel49a
  - number: 49a.1.b
    text: |-
      het in eigendom verwerven, het vervreemden of het bezwaren van registergoederen, daaronder begrepen het aangaan
      of beëindigen van overeenkomsten daartoe, indien de prijs van het registergoed hoger is dan € 100 000 of indien de
      prijs van dat registergoed meer bedraagt dan 10 procent van de jaaromzet van de desbetreffende kamer;
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel49a
  - number: 49a.1.c
    text: |-
      het aangaan en beëindigen van overeenkomsten tot huur, verhuur of pacht van registergoederen, indien de huur-
      of pachtprijs van het registergoed op jaarbasis hoger is dan € 100 000 of indien die prijs meer bedraagt dan 10
      procent van de jaaromzet van de desbetreffende kamer;
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel49a
  - number: 49a.1.d
    text: |-
      het aangaan van overeenkomsten waarbij een kamer zich verbindt tot zekerheidstelling met inbegrip van
      zekerheidstelling voor schulden van derden of waarbij zij zich als borg of hoofdelijk medeschuldenaar verbindt of
      zich voor een derde sterk maakt;
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel49a
  - number: 49a.1.e
    text: het doen van aangifte tot haar faillissement of het aanvragen van surséance van betaling;
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel49a
  - number: 49a.1.f
    text: het beleggen van gelden;
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel49a
  - number: 49a.1.g
    text: het investeren in infrastructurele voorzieningen.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel49a
  - number: 49a.2
    text: |-
      Onze Minister kan bepalen dat een kamer zijn voorafgaande instemming behoeft voor het vormen van andere fondsen en
      reserveringen dan de egalisatiereserve, bedoeld in [artikel 49b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel49b
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: 49b
        hoofdstuk: '7'
  - number: 49a.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van rechtspersonen van wie de meerderheid
      van de aandelen of de stemrechten in de algemene vergadering direct of indirect in handen is van een of meer
      kamers, of van wie de meerderheid van de bestuurders of van de commissarissen direct of indirect door een of meer
      kamers wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel49a
  - number: 49b.1
    text: Een kamer vormt een egalisatiereserve.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel49b
  - number: 49b.2
    text: |-
      Het verschil tussen de gerealiseerde baten van een kamer en de gerealiseerde lasten van de activiteiten komt ten
      gunste onderscheidenlijk ten laste van de egalisatiereserve.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel49b
  - number: 49b.3
    text: De van de egalisatiereserve genoten rente wordt aan de egalisatiereserve toegevoegd.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel49b
  - number: '50.1'
    text: |-
      Een kamer verstrekt desgevraagd aan Onze Minister alle voor de uitoefening van diens taak benodigde inlichtingen.
      Onze Minister kan inzage vorderen van alle zakelijke gegevens en bescheiden, indien dat voor de vervulling van zijn
      taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel50
  - number: '50.2'
    text: |-
      Een kamer geeft bij het verstrekken van de in het eerste lid bedoelde inlichtingen waar nodig aan welke gegevens
      een vertrouwelijk karakter dragen. Dit vertrouwelijke karakter kan voortvloeien uit de aard van de gegevens, dan
      wel uit het feit dat natuurlijke of rechtspersonen deze aan de kamer hebben verstrekt onder het beding dat zij als
      vertrouwelijk zullen gelden.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel50
  - number: '50.3'
    text: |-
      De in het eerste lid opgenomen verplichting geldt ook ten aanzien van rechtspersonen van wie de meerderheid van
      de aandelen of de stemrechten in de algemene vergadering direct of indirect in handen is van een of meer kamers
      of van wie de meerderheid van de bestuurders of de commissarissen direct of indirect door een of meer kamers wordt
      benoemd.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel50
  - number: '51'
    text: |-
      Het algemeen bestuur stelt het activiteitenplan vast en zendt dit, gelijktijdig met de begroting als bedoeld
      in [artikel 45, eerste lid][ref1], vóór 1 november van het jaar dat voorafgaat aan het kalenderjaar waarop het
      activiteitenplan betrekking heeft aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel45
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '45'
        hoofdstuk: '7'
  - number: '52.1'
    text: |-
      Het jaarverslag beschrijft de taakuitoefening en het gevoerde beleid. Het jaarverslag beschrijft voorts het
      gevoerde beleid met betrekking tot de kwaliteitszorg.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel52
  - number: '52.2'
    text: |-
      Het algemeen bestuur stelt het jaarverslag vast en zendt dit vóór 1 juli van het jaar dat volgt op het kalenderjaar
      waarop het jaarverslag betrekking heeft aan Onze Minister en aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel52
  - number: '52.3'
    text: Het verslag wordt, tegen vergoeding van de kosten, voor een ieder verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel52
  - number: '53.1'
    text: |-
      De kamers stellen gezamenlijk een gedragscode op ter bevordering van de integriteit van het gedrag van de
      bestuurders en de werkwijze van de kamers.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel53
  - number: '53.2'
    text: Het besluit tot vaststelling van de gedragscode behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel53
  - number: '53.3'
    text: De goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel53
  - number: '54.1'
    text: Onze Minister kan een besluit van een kamer vernietigen.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel54
  - number: '54.2'
    text: Van het vernietigingsbesluit wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel54
  - number: 54a.1
    text: 'Een kamer ziet met betrekking tot de uitoefening van haar taken en bevoegdheden toe op:'
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel54a
  - number: 54a.1.a
    text: een tijdige voorbereiding en uitvoering;
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel54a
  - number: 54a.1.b
    text: de kwaliteit van de daarbij gebruikte procedures;
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel54a
  - number: 54a.1.c
    text: de zorgvuldige behandeling van personen en instellingen die met haar in aanraking komen;
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel54a
  - number: 54a.1.d
    text: de zorgvuldige behandeling van bezwaarschriften en klachten die worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel54a
  - number: 54a.2
    text: |-
      Een kamer treft voorzieningen, waardoor personen en instellingen, die met haar in aanraking komen, in de
      gelegenheid zijn voorstellen tot verbeteringen van werkwijzen en procedures te doen.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel54a
  - number: 54a.3
    text: |-
      In het jaarverslag, bedoeld in [artikel 52][ref1], doet een kamer verslag van hetgeen tot uitvoering van het eerste
      en tweede lid is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel52
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '52'
        hoofdstuk: '8'
  - number: 54b.1
    text: |-
      Een kamer draagt op de voet van de ter zake voor de Rijksdienst geldende voorschriften zorg voor de nodige
      technische en organisatorische voorzieningen ter beveiliging van haar gegevens tegen verlies of aantasting en tegen
      onbevoegde kennisneming, wijziging en verstrekking van die gegevens.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel54b
  - number: 54b.2
    text: De kamers werken samen ter bevordering van de uniforme uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel54b
  - number: 54c.1
    text: Onze Minister kan beleidsregels vaststellen met betrekking tot de taakuitoefening door een of meer kamers.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel54c
  - number: 54c.2
    text: De beleidsregels worden in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel54c
  - number: 54d.1
    text: |-
      Indien naar het oordeel van Onze Minister een kamer haar taak ernstig verwaarloost, kan Onze Minister de
      noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel54d
  - number: 54d.2
    text: |-
      De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat een kamer in de
      gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn alsnog haar taak naar behoren uit te
      voeren.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel54d
  - number: 54d.3
    text: |-
      Onze Minister stelt beide kamers der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel54d
  - number: 54e
    text: |-
      Een kamer behoeft voor instemming met mandaatverlening de goedkeuring van Onze Minister, tenzij het
      mandaatverlening door Onze Minister betreft. De goedkeuring kan worden onthouden wegens strijd met het recht of
      op de grond dat de te mandateren bevoegdheid naar het oordeel van Onze Minister een goede taakuitoefening door de
      kamer kan belemmeren.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel54e
  - number: '55.1'
    text: |-
      Tegen een op grond van deze wet genomen besluit en tegen een ander door een kamer genomen besluit, met
      uitzondering van besluiten op grond van de [Wet openbaarheid van bestuur][ref1] of op grond van de bevoegdheid
      tot het nemen van besluiten of het verrichten van handelingen ten aanzien van een ambtenaar als bedoeld in
      [artikel 1 van de Ambtenarenwet][ref2] als zodanig, zijn nagelaten betrekkingen of zijn rechtverkrijgenden, kan een
      belanghebbende beroep instellen bij het College van Beroep voor het bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0001947#Artikel1
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0001947
        artikel: '1'
  - number: '55.2'
    text: |-
      Het eerste lid geldt niet ten aanzien van besluiten waartegen bij of krachtens de wet een andere voorziening is
      opengesteld.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel55
  - number: '62'
    text: |-
      Onze Minister zendt twee jaar na de inwerkingtreding van deze wet en vervolgens elke vijf jaar een verslag aan
      beide kamers der Staten-Generaal ten behoeve van de beoordeling van de doelmatigheid en doeltreffendheid van het
      functioneren van de kamers.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel62
  - number: '63'
    text: |-
      De Wet op de Kamers van Koophandel en Fabrieken 1963 wordt ingetrokken op een bij koninklijk besluit te bepalen
      tijdstip dat voor de verschillende hoofdstukken of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel63
  - number: '64'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende hoofdstukken
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel64
  - number: '66'
    text: |-
      Deze wet wordt aangehaald als: Wet op de kamers van koophandel en fabrieken, met vermelding van het jaartal van het
      Staatsblad waarin zij zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel66
