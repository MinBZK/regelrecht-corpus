  - number: '2.4'
    text: |-
      Alvorens Onze Minister een voordracht voor een besluit als bedoeld in het tweede of derde lid doet, stelt hij de
      kamers, waarvan het gebied bij het in overweging zijnde besluit betrokken is, in de gelegenheid van hun inzicht te
      doen blijken.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel2
  - number: '2.5'
    text: |-
      De voordracht voor een besluit als bedoeld in het tweede of derde lid wordt niet gedaan dan nadat het ontwerp aan
      de beide kamers der Staten-Generaal is overgelegd en sedert die overlegging zes weken zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel2
  - number: '3'
    text: De kamers bezitten rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel3
  - number: '4'
    text: |-
      De bepalingen van deze wet zijn tevens van toepassing op instellingen die door de kamers met de uitvoering van een
      deel van hun taken als bedoeld in [de artikelen 23 tot en met 29][ref1] worden belast.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel23
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '5.1'
    text: Het bestuur van een kamer bestaat uit een algemeen bestuur en een voorzitter.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel5
  - number: '5.2'
    text: Het algemeen bestuur staat aan het hoofd van de kamer.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel5
  - number: '6.1'
    text: |-
      Het algemeen bestuur benoemt al dan niet uit zijn midden een voorzitter. De uit het midden van het algemeen bestuur
      benoemde voorzitter is lid van het algemeen bestuur en heeft stemrecht. De niet uit het midden van het algemeen
      bestuur benoemde voorzitter is lid van het algemeen bestuur en heeft geen stemrecht. Voor de toepassing van
      [artikel 7][ref1] wordt de niet uit het midden van het algemeen bestuur benoemde voorzitter niet als lid van het
      algemeen bestuur aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel7
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '6.2'
    text: Het algemeen bestuur benoemt uit zijn midden een plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel6
  - number: '6.3'
    text: |-
      De in het eerste en tweede lid bedoelde benoemingen geschieden voor een door het algemeen bestuur te bepalen
      termijn, die de zittingsduur van het algemeen bestuur niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel6
  - number: '6.4'
    text: |-
      Het algemeen bestuur kan een voorzitter of plaatsvervangend voorzitter schorsen of ontslaan, wegens ongeschiktheid
      of onbekwaamheid voor de vervulde functie dan wel wegens andere zwaarwegende in de persoon van de betrokkene
      gelegen redenen. Ontslag vindt voorts plaats op eigen verzoek.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel6
  - number: '6.5'
    text: |-
      Onze Minister kan in bijzondere omstandigheden een voorzitter of plaatsvervangend voorzitter schorsen of ontslaan,
      gehoord het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel6
  - number: '7.1'
    text: |-
      Het algemeen bestuur bestaat voor eenderde deel uit leden afkomstig uit de kring van ondernemers in het midden- en
      kleinbedrijf, voor eenderde deel uit leden afkomstig uit de kring van overige ondernemers en voor eenderde deel uit
      leden afkomstig uit de kring van werknemers.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel7
  - number: '7.2'
    text: Het aantal leden van het algemeen bestuur bedraagt ten hoogste vierentwintig.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel7
  - number: '7.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de criteria ter bepaling van het in het tweede
      lid bedoelde aantal.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel7
  - number: '8.1'
    text: |-
      De leden worden benoemd voor een periode van vier jaren. Zij treden tegelijk af en kunnen ten hoogste tweemaal
      worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel8
  - number: '8.2'
    text: |-
      Degene die lid is geworden ter vervulling van een tussentijds opengevallen plaats, treedt af op het tijdstip waarop
      degene in wiens plaats hij is getreden, had moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel8
  - number: '9.1'
    text: 'Tot lid van het algemeen bestuur van een kamer kunnen alleen worden benoemd degenen, die:'
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel9
  - number: 9.1.a
    text: nauw betrokken zijn bij een onderneming in het gebied van de kamer;
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel9
  - number: 9.1.b
    text: |-
      niet in staat van faillissement verkeren of anderszins de beschikking of het beheer over hun goederen verloren
      hebben;
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel9
  - number: 9.1.c
    text: voorafgaand aan de benoeming niet meer dan acht jaren hebben deel genomen aan het bestuur van een kamer;
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel9
  - number: 9.1.d
    text: niet reeds, voor dezelfde zittingsperiode, benoemd zijn tot lid van het algemeen bestuur van een andere kamer en
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel9
  - number: 9.1.e
    text: |-
      niet bij onherroepelijke rechterlijke uitspraak van het kiesrecht in de zin van de [Kieswet][ref1] zijn ontzet.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '9.2'
    text: |-
      Bij regeling van Onze Minister kunnen eisen worden gesteld met betrekking tot de benoembaarheid tot lid van het
      algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel9
  - number: '9.3'
    text: |-
      De in het tweede lid bedoelde regeling bevat in ieder geval een benoemingscode, op grond waarvan de
      benoemingsgerechtigde organisaties hun leden in het algemeen bestuur benoemen.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel9
  - number: '9.4'
    text: |-
      De in het tweede lid bedoelde regeling en iedere wijziging hiervan treden niet eerder in werking dan vier weken
      nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel9
  - number: '10.1'
    text: |-
      De SER bepaalt, met inachtneming van de bij of krachtens [artikel 7][ref1] gestelde regels, voor iedere kamer en
      voor iedere zittingsperiode afzonderlijk, de takken van handel, industrie, ambacht en dienstverlening waarvoor
      leden zitting hebben in de kamer, alsmede het aantal leden dat voor elk van de aangewezen takken in de kamer
      zitting heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel7
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '10.2'
    text: |-
      Voordat de SER een besluit als bedoeld in het eerste lid neemt, stelt hij het algemeen bestuur in de gelegenheid
      van zijn inzicht daaromtrent te doen blijken.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel10
  - number: '10.3'
    text: |-
      Van een besluit als bedoeld in het eerste lid alsmede van het openstellen van de in het tweede lid bedoelde
      gelegenheid doet de SER openbare kennisgeving.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel10
  - number: '11.1'
    text: |-
      De leden worden benoemd, geschorst en ontslagen door organisaties van ondernemers en van werknemers die daartoe,
      met inachtneming van het bij of krachtens de [artikelen 7][ref1] en [10][ref2] bepaalde, voor iedere kamer en
      iedere zittingsperiode afzonderlijk door de SER zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel10
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Voor aanwijzing komen uitsluitend in aanmerking organisaties die naar het oordeel van de SER van voldoende
      betekenis zijn voor de ondernemers of de werknemers in het gebied van de kamer.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel11
  - number: '11.3'
    text: |-
      Bij de aanwijzing van een organisatie bepaalt de SER het aantal leden dat die organisatie benoemt, alsmede
      voor welke tak elk te benoemen lid zitting heeft. De SER kan bepalen dat de benoeming van één of meer leden zal
      geschieden door twee of meer aangewezen organisaties gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel11
  - number: '11.4'
    text: |-
      Voordat de SER de organisaties aanwijst stelt hij het algemeen bestuur van de betrokken kamer in de gelegenheid van
      zijn inzicht omtrent de aanwijzing te doen blijken.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel11
  - number: '11.5'
    text: |-
      Schorsing en ontslag vinden slechts plaats wegens ongeschiktheid of onbekwaamheid voor de vervulde functie dan wel
      wegens andere zwaarwegende in de persoon van de betrokkene gelegen redenen. Ontslag vindt voorts plaats op eigen
      verzoek.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel11
  - number: '11.6'
    text: |-
      Onze Minister kan in bijzondere omstandigheden een lid schorsen of ontslaan, gehoord de organisatie die het
      betreffende lid heeft benoemd.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel11
  - number: '11.7'
    text: |-
      De leden hebben op persoonlijke titel zitting in het algemeen bestuur en oefenen hun functie uit zonder last of
      ruggespraak.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel11
  - number: 11a.1
    text: |-
      Een lid vervult geen andere functies die ongewenst zijn met het oog op de goede vervulling van zijn functie of de
      handhaving van zijn onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel11a
  - number: 11a.2
    text: |-
      Een voorzitter meldt het voornemen tot het aanvaarden van een andere functie anders dan uit hoofde van zijn functie
      aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel11a
  - number: 11a.3
    text: |-
      Andere functies van een lid anders dan uit hoofde van zijn functie worden openbaar gemaakt. Openbaarmaking
      geschiedt door het ter inzage leggen van een opgave van deze nevenfuncties bij de betreffende kamer.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel11a
  - number: '12.1'
    text: Een kamer kan naast een algemeen bestuur een dagelijks bestuur hebben.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel12
  - number: '12.2'
    text: De voorzitter van het algemeen bestuur is tevens voorzitter van het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel12
  - number: '12.3'
    text: |-
      Buiten de voorzitter bestaat het dagelijks bestuur uit een door het algemeen bestuur uit zijn midden te benoemen
      aantal overige leden dat ten minste twee en ten hoogste zes bedraagt.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel12
  - number: '12.4'
    text: De zittingsduur van het dagelijks bestuur is gelijk aan de zittingsduur van het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel12
  - number: '12.5'
    text: |-
      Het algemeen bestuur kan een of meer leden van het dagelijks bestuur schorsen of ontslaan wegens ongeschiktheid of
      onbekwaamheid voor de vervulde functie dan wel wegens andere zwaarwegende in de persoon van de betrokkene gelegen
      redenen. Ontslag vindt voorts plaats op eigen verzoek.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel12
  - number: '13.1'
    text: De leden van het algemeen bestuur en van het dagelijks bestuur ontvangen een schadeloosstelling.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel13
  - number: '13.2'
    text: |-
      Bij regeling van Onze Minister worden regels vastgesteld ten aanzien van de aan het lidmaatschap van het algemeen
      of dagelijks bestuur en de aan het voorzitterschap verbonden schadeloosstelling.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel13
  - number: '14.1'
    text: Het personeel van een kamer bestaat uit een directeur en het overige personeel.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel14
  - number: '14.2'
    text: |-
      Op het personeel zijn de rechtspositieregels die gelden voor ambtenaren die zijn aangesteld bij ministeries,
      van overeenkomstige toepassing. De in die regels neergelegde bevoegdheden, met uitzondering van de aan de Kroon
      en aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties toegekende bevoegdheden tot het stellen van
      regels, worden uitgeoefend door de kamer. Voor zover in die regels is bepaald dat bevoegdheden worden uitgeoefend
      met medebetrokkenheid van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, worden deze bevoegdheden
      uitgeoefend met medebetrokkenheid van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel14
  - number: '14.3'
    text: Bij algemene maatregel van bestuur kan gedeeltelijk worden afgeweken van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel14
  - number: '14.4'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld over de bezoldiging van het personeel.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel14
  - number: '16'
    text: Het algemeen bestuur draagt zorg voor de uitvoering van de taken van de kamer.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel16
  - number: '17.1'
    text: |-
      Het algemeen bestuur stelt een bestuursreglement vast. Daarin worden in elk geval regels gesteld omtrent de
      wijze waarop beslissingen van het algemeen en dagelijks bestuur worden voorbereid, genomen en uitgevoerd, wordt
      geregeld welke bevoegdheden, met uitzondering van de bevoegdheden, bedoeld in [artikel 17, eerste lid][ref1],
      [37, eerste lid][ref2], [45, eerste lid][ref3], [47, eerste lid][ref4], [51, derde lid][ref5], en
      [52, tweede lid][ref6], het algemeen bestuur overdraagt aan het dagelijks bestuur en worden regels gesteld omtrent
      de taak en bevoegdheden van de directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0009276#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0009276#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0009276#Artikel51
      [ref6]: https://wetten.overheid.nl/BWBR0009276#Artikel52
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '17'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '37'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0009276
        artikel: '45'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0009276
        artikel: '47'
        hoofdstuk: '7'
      - id: ref5
        bwb_id: BWBR0009276
        artikel: '51'
        hoofdstuk: '8'
      - id: ref6
        bwb_id: BWBR0009276
        artikel: '52'
        hoofdstuk: '8'
  - number: '17.2'
    text: Het bestuursreglement behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel17
  - number: '17.3'
    text: |-
      De goedkeuring kan worden onthouden wegens strijd met het recht of op de grond dat het bestuursreglement naar het
      oordeel van Onze Minister een goede taakuitoefening door de kamer kan belemmeren.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel17
  - number: '18.1'
    text: |-
      Het dagelijks bestuur is belast met de voorbereiding van al hetgeen in de vergadering van het algemeen bestuur ter
      overweging en beslissing moet worden gebracht.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel18
  - number: '18.2'
    text: Het dagelijks bestuur is belast met de uitvoering van de besluiten van het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel18
  - number: '19'
    text: De voorzitter vertegenwoordigt de kamer in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel19
  - number: '21.1'
    text: De vergaderingen van het algemeen bestuur worden in het openbaar gehouden.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel21
  - number: '21.2'
    text: |-
      De deuren worden gesloten wanneer ten minste een vijfde van de aanwezige leden daarom verzoekt of de voorzitter het
      nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel21
  - number: '21.3'
    text: Het algemeen bestuur beslist vervolgens of met gesloten deuren zal worden vergaderd.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel21
  - number: '22'
    text: 'In een besloten vergadering kan niet worden beraadslaagd of besloten over:'
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel22
  - number: 22.a
    text: de vaststelling van de begroting, van de jaarrekening, van het activiteitenplan en van het jaarverslag;
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel22
  - number: 22.b
    text: |-
      een besluit als bedoeld in [artikel 35, eerste lid][ref1], en [artikel 37, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel37
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '35'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '37'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 22.c
    text: |-
      de ontheffing uit zijn functie onderscheidenlijk het ontslag van een al dan niet uit het midden van het algemeen
      bestuur benoemde voorzitter of
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel22
  - number: 22.d
    text: de benoeming en de ontheffing uit hun functie van de leden van het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel22
  - number: 22a
    text: |-
      De vereniging met de naam Kamer van Koophandel Nederland wordt aangemerkt als samenwerkingsverband in de zin van
      deze wet.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel22a
  - number: 22b
    text: |-
      Behalve de in deze wet opgedragen taken kunnen bij algemene maatregel van bestuur aan het samenwerkingsverband
      coördinerende en faciliterende taken worden opgedragen met betrekking tot het verkeer tussen de kamers onderling of
      tussen Onze Minister en de kamers.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel22b
  - number: '23'
    text: |-
      Een kamer heeft tot taak desgevraagd inlichtingen van algemene aard te verstrekken ten aanzien van het oprichten en
      drijven van een onderneming in haar gebied.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel23
  - number: '24'
    text: 'Een kamer heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel24
  - number: 24.a
    text: |-
      gerichte voorlichting te geven op juridisch en economisch terrein ten aanzien van een in haar gebied gevestigde of
      nog te vestigen onderneming; en
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel24
  - number: 24.b
    text: |-
      voorlichting te geven over aangelegenheden op juridisch en economisch terrein aan groepen van personen die in haar
      gebied een onderneming drijven of overwegen een onderneming op te richten.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel24
  - number: '25.1'
    text: |-
      Een kamer heeft tot taak het stimuleren van economische ontwikkelingen in haar gebied door middel van het
      bevorderen van onderzoeken, overleg- en samenwerkingsvormen en het desgevraagd of uit eigen beweging adviseren
      van openbare lichamen over aangelegenheden die de economische belangen van handel, industrie, ambacht en
      dienstverlening in haar gebied raken.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel25
  - number: '25.2'
    text: |-
      Een kamer kan ten behoeve van een onderzoek, overleg- of samenwerkingsvorm als bedoeld in het eerste lid een
      subsidie verstrekken.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel25
  - number: '25.3'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot het totale bedrag dat een kamer in
      een jaar op grond van het tweede lid verstrekt.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel25
  - number: '26'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van de in de
      [artikelen 23][ref1], [24][ref2] en [25][ref3] bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0009276#Artikel25
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '24'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009276
        artikel: '25'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '27.1'
    text: |-
      Met betrekking tot de taken als bedoeld in [artikel 24][ref1] en [25][ref2] komen de kamers jaarlijks, na overleg
      met Onze Minister en de overlegorganisaties, overeen welke activiteiten door de kamers in het eerstkomende
      kalenderjaar op zoveel mogelijk uniforme wijze worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel25
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '24'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '25'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '27.2'
    text: |-
      Het secretariaat met betrekking tot de afspraken bedoeld in het eerste lid wordt gevoerd door het
      samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel27
  - number: '27.3'
    text: Het samenwerkingsverband zendt de afspraken jaarlijks vóór 15 september aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel27
  - number: '27.4'
    text: De afspraken behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel27
  - number: '27.5'
    text: |-
      Onze Minister beslist binnen 6 weken na het verstrijken van de in het derde lid genoemde termijn, of hij met de
      afspraken instemt.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel27
  - number: '27.6'
    text: |-
      De in het vijfde lid bedoelde instemming wordt geacht te zijn gegeven, indien binnen de in dat lid genoemde
      termijn van 6 weken geen bericht van instemming is verzonden of geen bericht is verzonden dat de beslissing omtrent
      instemming wordt verdaagd, dan wel binnen de termijn waarvoor de beslissing is verdaagd, geen beslissing omtrent
      instemming is genomen.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel27
  - number: '27.7'
    text: |-
      Indien de in het derde lid bedoelde termijn is verstreken zonder dat Onze Minister de afspraken heeft ontvangen
      of indien Onze Minister niet met de afspraken heeft ingestemd, kan Onze Minister bij regeling vaststellen welke
      activiteiten door de kamers in het eerstkomende kalenderjaar op zoveel mogelijk uniforme wijze worden verricht.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel27
  - number: '27.8'
    text: |-
      Het samenwerkingsverband brengt jaarlijks vóór 1 april aan Onze Minister verslag uit over de uitoefening van de
      activiteiten, bedoeld in het eerste of zevende lid, in het voorgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel27
  - number: '28.1'
    text: 'Voor zover daaromtrent geen andere regeling geldt heeft een kamer de bevoegdheid om desgevraagd:'
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel28
  - number: 28.1.a
    text: verklaringen ten dienste van handel, industrie, ambacht en dienstverlening af te geven;
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel28
  - number: 28.1.b
    text: handtekeningen van personen die bij handel, industrie, ambacht en dienstverlening betrokken zijn, te legaliseren;
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel28
  - number: 28.1.c
    text: een onderzoek te houden en een verklaring af te geven inzake de toelaatbaarheid van een handelsnaam.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel28
  - number: '28.2'
    text: De kamers werken samen ter bevordering van de uniforme uitvoering van de in het eerste lid bedoelde taken.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel28
  - number: '28.3'
    text: |-
      Bij ministeriële regeling kunnen ter implementatie van bepalingen uit bindende besluiten van de Raad van
      de Europese Unie of het Europees Parlement en de Raad gezamenlijk, die betrekking hebben op het afgeven van
      verklaringen als bedoeld in het eerste lid, onderdeel a, nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel28
  - number: '29'
    text: |-
      Een kamer kan besluiten andere dan de in dit hoofdstuk of elders bij of krachtens wet geregelde taken uit te
      oefenen, voor zover deze passen binnen de in [artikel 2, eerste lid][ref1], aangegeven doelstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel2
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '2'
        hoofdstuk: '2'
  - number: '30.1'
    text: |-
      Een kamer oefent de in [artikel 28][ref1] en [29][ref2] bedoelde werkzaamheden uit voor zover daarin niet
      in voldoende mate wordt voorzien door rechtspersonen die volgens hun statuten tot doel hebben de belangen
      van ondernemers te behartigen en draagt er zorg voor dat deze werkzaamheden niet leiden tot mededinging met
      ondernemingen of vrije beroepsbeoefenaren die uit een oogpunt van een goede marktwerking ongewenst is.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel29
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '28'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '30.2'
    text: |-
      Een kamer draagt er voorts zorg voor dat haar werkzaamheden niet leiden tot het verhinderen, beperken of vervalsen
      van de mededinging tussen ondernemingen of vrije beroepsbeoefenaren.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel30
  - number: '30.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen met het oog op het eerste en tweede lid regels worden gesteld die
      inhouden dat:
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel30
  - number: 30.3.a
    text: bepaalde werkzaamheden door de kamers niet mogen worden verricht of
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel30
  - number: 30.3.b
    text: de kamers zich bij bepaalde werkzaamheden dienen te gedragen overeenkomstig een in dat besluit aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel30
  - number: '30.4'
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing ten aanzien van rechtspersonen van wie de
      meerderheid van de aandelen of de stemrechten in de algemene vergadering direct of indirect in handen is van een of
      meer kamers, of van wie de meerderheid van de bestuurders of van de commissarissen direct of indirect door een of
      meer kamers wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel30
  - number: '34.1'
    text: |-
      Voor de uitvoering van activiteiten als bedoeld in [artikel 27, eerste of zevende lid][ref1], stelt Onze Minister
      bij regeling de vergoedingen vast die verschuldigd zijn ter gehele of gedeeltelijke financiering van de aan de
      uitvoering van deze activiteiten voor de kamers verbonden kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel27
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '34.2'
    text: |-
      Het samenwerkingsverband doet met het oog op de vaststelling, bedoeld in het eerste lid, aan Onze Minister
      jaarlijks vóór 1 november een voorstel toekomen.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel34
  - number: '34.3'
    text: |-
      Onze Minister stelt binnen 6 weken na het verstrijken van de in het tweede lid bedoelde termijn, de in het eerste
      lid bedoelde vergoedingen vast.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel34
  - number: '35.1'
    text: |-
      Voor activiteiten ter uitvoering van de taken, bedoeld in [artikel 24][ref1] en [25][ref2], stelt een
      kamer ter gehele of gedeeltelijke financiering van de aan de uitvoering van die activiteiten voor een
      kamer verbonden kosten, de vergoedingen vast voor zover die activiteiten geen deel uitmaken van de in
      [artikel 27, eerste of zevende lid][ref3], bedoelde activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0009276#Artikel27
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '24'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '25'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009276
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '35.2'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld over de wijze waarop de hoogte van de in het
      eerste lid bedoelde vergoeding wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel35
  - number: '35.3'
    text: |-
      De in het eerste lid bedoelde besluiten worden bekendgemaakt door terinzagelegging ten kantore van de kamer en
      publicatie daarvan in een door Onze Minister aangewezen publicatieblad.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel35
  - number: 35a.1
    text: |-
      Indien een kamer besluit tot het uitvoeren van taken als bedoeld in [artikel 28][ref1] of [29][ref2], geschiedt
      zulks tegen vergoeding van de aan de uitvoering van die taken voor de kamer verbonden kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel29
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '28'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 35a.2
    text: |-
      Vergoedingen en bijdragen die aan een kamer zijn verschuldigd anders dan op basis van het eerste lid, worden niet
      aangewend ter vergoeding van kosten die zijn verbonden aan de uitvoering van de in het eerste lid genoemde taken.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel35a
  - number: 35a.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van rechtspersonen van wie de meerderheid
      van de aandelen of de stemrechten in de algemene vergadering in handen is van een of meer kamers, of van wie de
      meerderheid van de bestuurders of van de commissarissen door een of meer kamers wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel35a
  - number: '36.1'
    text: |-
      Voor de uitvoering van de activiteiten, bedoeld in [artikel 27, eerste of zevende lid][ref1], alsmede van de
      taak, bedoeld in [artikel 23][ref2], stelt Onze Minister ter financiering van de aan de uitvoering van deze taken
      verbonden kosten, voor zover deze wat betreft de in [artikel 24][ref3] bedoelde taak niet worden gedekt door
      de in [artikel 34][ref4] bedoelde vergoedingen, bij regeling een bijdrage vast welke ondernemingen voor ieder
      kalenderjaar of gedeelte daarvan verschuldigd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0009276#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0009276#Artikel34
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel36
