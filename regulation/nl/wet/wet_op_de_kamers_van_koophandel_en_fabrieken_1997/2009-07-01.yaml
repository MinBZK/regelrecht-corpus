  - number: '36.2'
    text: |-
      Het samenwerkingsverband doet met het oog op de vaststelling, bedoeld in het eerste lid, aan Onze Minister
      jaarlijks vóór 1 november een voorstel toekomen.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel36
  - number: '36.3'
    text: |-
      Onze Minister stelt binnen 6 weken na het verstrijken van de in het tweede lid bedoelde termijn, de in het eerste
      lid bedoelde bijdragen vast.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel36
  - number: 36a.1
    text: |-
      Voor de uitvoering van bij of krachtens andere wetten dan deze wet geregelde taken stelt Onze Minister ter
      financiering van de aan de uitvoering van die taken verbonden kosten, voor zover bij of krachtens die wetten de
      financiering van de aan die uitvoering verbonden kosten niet is geregeld, bij regeling een bijdrage vast welke
      ondernemingen voor ieder kalenderjaar of gedeelte daarvan verschuldigd zijn.
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel36a
  - number: 36a.2
    text: |-
      [Artikel 36, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel36
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '36'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '37.1'
    text: |-
      Een kamer stelt ter financiering van de kosten verbonden aan de uitvoering van de taken, bedoeld in de
      [artikelen 24][ref1] en [25][ref2], voor zover de uitvoering van deze taken niet plaatsvindt door de in
      [artikel 27, eerste of zevende lid][ref3], bedoelde activiteiten, een bijdrage vast welke ondernemingen voor
      ieder kalenderjaar of een gedeelte daarvan verschuldigd zijn, voor zover deze kosten niet worden gedekt door de in
      [artikel 35][ref4] bedoelde vergoedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0009276#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0009276#Artikel35
    url: https://wetten.overheid.nl/BWBR0009276/2009-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '24'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '25'
        hoofdstuk: '5'
        paragraaf: '1'
