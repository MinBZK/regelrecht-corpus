  - number: '2.4'
    text: |-
      Alvorens Onze Minister een voordracht voor een besluit als bedoeld in het tweede of derde lid doet, stelt hij de
      kamers, waarvan het gebied bij het in overweging zijnde besluit betrokken is, in de gelegenheid van hun inzicht te
      doen blijken.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel2
  - number: '2.5'
    text: |-
      De voordracht voor een besluit als bedoeld in het tweede of derde lid wordt niet gedaan dan nadat het ontwerp aan
      de beide kamers der Staten-Generaal is overgelegd en sedert die overlegging zes weken zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel2
  - number: '3'
    text: De kamers bezitten rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel3
  - number: '4'
    text: |-
      De bepalingen van deze wet zijn tevens van toepassing op instellingen die door de kamers met de uitvoering van een
      deel van hun taken als bedoeld in [de artikelen 23 tot en met 29][ref1] worden belast.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel23
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '5.1'
    text: Het bestuur van een kamer bestaat uit een algemeen bestuur, een dagelijks bestuur en een voorzitter.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel5
  - number: '5.2'
    text: Het algemeen bestuur staat aan het hoofd van de kamer.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel5
  - number: '6.1'
    text: Het algemeen bestuur benoemt al dan niet uit zijn midden een voorzitter. De voorzitter heeft stemrecht.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel6
  - number: '6.2'
    text: Het algemeen bestuur benoemt uit zijn midden een plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel6
  - number: '6.3'
    text: |-
      De in het eerste en tweede lid bedoelde benoemingen geschieden voor een door het algemeen bestuur te bepalen
      termijn, die de zittingsduur van het algemeen bestuur niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel6
  - number: '6.4'
    text: |-
      Het algemeen bestuur kan een uit zijn midden benoemde voorzitter of plaatsvervangend voorzitter tussentijds van
      zijn functie ontheffen, dan wel een niet uit zijn midden benoemde voorzitter tussentijds ontslaan, op eigen verzoek
      of indien deze het vertrouwen van het algemeen bestuur niet meer bezit.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het algemeen bestuur bestaat voor eenderde deel uit leden afkomstig uit de kring van ondernemers in het midden- en
      kleinbedrijf, voor eenderde deel uit leden afkomstig uit de kring van overige ondernemers en voor eenderde deel uit
      leden afkomstig uit de kring van werknemers.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het aantal leden van het algemeen bestuur bedraagt ten minste dertig en ten hoogste achtenveertig en is,
      overeenkomstig een bij algemene maatregel van bestuur vast te stellen verhouding, afhankelijk van het aantal
      bij de kamer in het handelsregister ingeschreven ondernemingen en het aantal in het gebied van de kamer gelegen
      nevenvestigingen van in het handelsregister ingeschreven ondernemingen.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel7
  - number: '8.1'
    text: De leden worden benoemd voor een periode van vier jaren. Zij treden tegelijk af.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel8
  - number: '8.2'
    text: |-
      Degene die lid is geworden ter vervulling van een tussentijds opengevallen plaats, treedt af op het tijdstip waarop
      degene in wiens plaats hij is getreden, had moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel8
  - number: '9'
    text: 'Tot lid van het algemeen bestuur van een kamer kunnen alleen worden benoemd degenen, die:'
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel9
  - number: 9.a
    text: nauw betrokken zijn bij een onderneming in het gebied van de kamer;
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel9
  - number: 9.b
    text: |-
      niet in staat van faillissement verkeren of anderszins de beschikking of het beheer over hun goederen verloren
      hebben;
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel9
  - number: 9.c
    text: |-
      direct voorafgaand aan de benoeming niet meer dan acht jaren aaneengesloten hebben deel genomen aan het bestuur van
      een kamer;
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel9
  - number: 9.d
    text: niet reeds, voor dezelfde zittingsperiode, benoemd zijn tot lid van het algemeen bestuur van een andere kamer en
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel9
  - number: 9.e
    text: |-
      niet bij onherroepelijke rechterlijke uitspraak van het kiesrecht in de zin van de [Kieswet][ref1] zijn ontzet.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '10.1'
    text: |-
      De SER bepaalt, met inachtneming van de bij of krachtens [artikel 7][ref1] gestelde regels, voor iedere kamer en
      voor iedere zittingsperiode afzonderlijk, de takken van handel, industrie, ambacht en dienstverlening waarvoor
      leden zitting hebben in de kamer, alsmede het aantal leden dat voor elk van de aangewezen takken in de kamer
      zitting heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel7
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '10.2'
    text: |-
      Voordat de SER een besluit als bedoeld in het eerste lid neemt, stelt hij het algemeen bestuur in de gelegenheid
      van zijn inzicht daaromtrent te doen blijken.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel10
  - number: '10.3'
    text: |-
      Van een besluit als bedoeld in het eerste lid alsmede van het openstellen van de in het tweede lid bedoelde
      gelegenheid doet de SER openbare kennisgeving.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel10
  - number: '11.1'
    text: |-
      De leden worden benoemd door organisaties van ondernemers en van werknemers die daartoe, met inachtneming van
      het bij of krachtens [de artikelen 7][ref1] en [10][ref2] bepaalde, voor iedere kamer en iedere zittingsperiode
      afzonderlijk door de SER zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel10
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Voor aanwijzing komen uitsluitend in aanmerking organisaties die naar het oordeel van de SER van voldoende
      betekenis zijn voor de ondernemers of de werknemers in het gebied van de kamer.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel11
  - number: '11.3'
    text: |-
      Bij de aanwijzing van een organisatie bepaalt de SER het aantal leden dat die organisatie benoemt, alsmede
      voor welke tak elk te benoemen lid zitting heeft. De SER kan bepalen dat de benoeming van één of meer leden zal
      geschieden door twee of meer aangewezen organisaties gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel11
  - number: '11.4'
    text: |-
      Voordat de SER de organisaties aanwijst stelt hij het algemeen bestuur van de betrokken kamer in de gelegenheid van
      zijn inzicht omtrent de aanwijzing te doen blijken.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel11
  - number: '12.1'
    text: De voorzitter van het algemeen bestuur is tevens voorzitter van het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel12
  - number: '12.2'
    text: |-
      Buiten de voorzitter bestaat het dagelijks bestuur uit een door het algemeen bestuur uit zijn midden te benoemen
      aantal overige leden dat ten minste twee en ten hoogste zes bedraagt.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel12
  - number: '12.3'
    text: De zittingsduur van het dagelijks bestuur is gelijk aan de zittingsduur van het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel12
  - number: '12.4'
    text: |-
      Het algemeen bestuur kan een of meer leden van het dagelijks bestuur tussentijds op eigen verzoek of indien deze
      het vertrouwen van het algemeen bestuur niet meer bezitten, van hun functie ontheffen.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel12
  - number: '13.1'
    text: De leden van het algemeen bestuur en van het dagelijks bestuur genieten als zodanig geen bezoldiging.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel13
  - number: '13.2'
    text: |-
      Het algemeen bestuur stelt regels ten aanzien van de vergoeding aan zijn leden en aan de leden van het dagelijks
      bestuur voor het bijwonen van vergaderingen van het algemeen bestuur onderscheidenlijk het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel13
  - number: '13.3'
    text: |-
      Het algemeen bestuur stelt tevens regels ten aanzien van de vergoeding aan de voorzitter voor de door hem als
      zodanig verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel13
  - number: '13.4'
    text: De in het tweede en derde lid bedoelde regels worden aan Onze Minister ter kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel13
  - number: '13.5'
    text: Onze Minister kan regels stellen ten aanzien van de hoogte van de in het tweede en derde lid bedoelde vergoedingen.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel13
  - number: '14.1'
    text: |-
      Iedere kamer heeft een secretariaat, bestaande uit een secretaris en overig personeel. De secretaris wordt door het
      algemeen bestuur benoemd en ontslagen.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel14
  - number: '14.2'
    text: |-
      De secretaris staat het algemeen bestuur, het dagelijks bestuur en de voorzitter bij de uitoefening van hun taak
      terzijde.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel14
  - number: '14.3'
    text: |-
      Het algemeen bestuur stelt in een instructie nadere regels vast betreffende de taak en de bevoegdheden van de
      secretaris. Daarbij wordt tevens de vervanging van de secretaris geregeld.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel14
  - number: '15.1'
    text: |-
      Voorzover daarin niet reeds bij of krachtens wet is voorzien, stelt het algemeen bestuur regels met betrekking tot
      de benoeming, de schorsing en het ontslag van het personeel van de kamer, alsmede omtrent de bezoldiging en in het
      algemeen de rechten en verplichtingen van het personeel.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel15
  - number: '15.2'
    text: |-
      Een besluit als bedoeld in het eerste lid kan mede bepalingen inhouden betreffende de gevallen waarin en de
      voorwaarden waaronder indienstneming van personeel op arbeidsovereenkomst naar burgerlijk recht plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel15
  - number: '16'
    text: Het algemeen bestuur draagt zorg voor de uitvoering van de taken van de kamer.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel16
  - number: '17'
    text: |-
      Het algemeen bestuur kan bij reglement bevoegdheden overdragen aan het dagelijks bestuur, met uitzondering
      van de bevoegdheden, bedoeld in [de artikelen 14][ref1], [15][ref2], [20][ref3], [32, vierde lid][ref4],
      [33, eerste lid][ref5], [34][ref6], [35, eerste lid][ref7], [37, tweede lid][ref8], [45][ref9], [47][ref10],
      [51, derde lid][ref11], en [52, tweede lid][ref12].


