  - number: '39.2'
    text: |-
      Omtrent de goedkeuring beslist Onze Minister binnen vier weken na de datum waarop hij het desbetreffende besluit
      heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel39
  - number: '39.3'
    text: |-
      Goedkeuring kan worden onthouden wegens strijd met het recht of met het algemeen belang, of indien Onze Minister
      bezwaar heeft tegen de hoogte van het in het desbetreffende besluit vastgestelde bedrag.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel39
  - number: '39.4'
    text: De goedkeuring wordt verleend of onthouden voor het besluit in zijn geheel, zoals dit door de kamer is genomen.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel39
  - number: '40'
    text: |-
      De in [de artikelen 32, vierde lid][ref1], [33, eerste lid][ref2], [35, eerste lid][ref3], en
      [37, tweede lid][ref4], bedoelde besluiten worden bekendgemaakt door het ter inzage leggen ten kantore van de kamer
      en het kennisgeven daarvan in een door Onze Minister aangewezen publicatieblad.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0009276#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0009276#Artikel37
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '32'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009276
        artikel: '35'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0009276
        artikel: '37'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: '41.1'
    text: |-
      De in [de artikelen 32][ref1], [33][ref2], [35][ref3] en [37][ref4] bedoelde bijdragen zijn verschuldigd door
      degene aan wie de onderneming toebehoort onderscheidenlijk door de rechtspersoon. Behoort de onderneming aan meer
      dan één persoon toe, dan zijn allen hoofdelijk verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0009276#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0009276#Artikel37
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '32'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009276
        artikel: '35'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0009276
        artikel: '37'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: '41.2'
    text: |-
      Ingeval een bijdrage voor het geheel of voor een deel niet tijdig is voldaan, maant de kamer de nalatige
      schriftelijk aan om alsnog binnen veertien dagen na de ontvangst van de brief het daarin vermelde bedrag aan
      de kamer te doen toekomen. Volgt op deze aanmaning de betaling binnen de gestelde termijn niet, dan vaardigt
      de kamer een dwangbevel uit. Het dwangbevel levert een executoriale titel op, die met toepassing van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] kan worden tenuitvoergelegd. De aanmaning en incasso van het
      dwangbevel geschieden op kosten van de schuldenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '41.3'
    text: |-
      Binnen dertig dagen na de betekening staat verzet tegen het dwangbevel open door dagvaarding van de betrokken kamer
      voor de kantonrechter van de rechtbank van het arrondissement waarin de kamer haar zetel heeft. Het verzet schorst
      het ten uitvoer leggen van het dwangbevel.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel41
  - number: '41.4'
    text: Het verzet kan niet worden gegrond op de bewering dat de bijdrage ten onrechte is opgelegd of onjuist is bepaald.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel41
  - number: '42'
    text: |-
      Indien de toepassing van [de artikelen 32][ref1] en [33][ref2] voor een kamer tot ernstige onbillijkheden zou
      leiden, kan Onze Minister bepalen dat tussen deze kamer en de overige betrokken kamers verrekening op een daarbij
      aangewezen wijze plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel33
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '32'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '43'
    text: |-
      Van de heffingen, bedoeld in [de artikelen 35][ref1] en [37][ref2], zijn in het handelsregister ingeschreven
      ondernemingen waarin uitsluitend landbouw of visserij wordt uitgeoefend en die aan een rechtspersoon of
      vennootschap toebehoren, vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel37
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '35'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '37'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: '44.1'
    text: |-
      Het dagelijks bestuur biedt het algemeen bestuur jaarlijks vóór 1 oktober een ontwerp aan van een begroting van
      inkomsten en uitgaven voor de onderscheiden activiteiten van de kamer voor het komende kalenderjaar. Het ontwerp
      gaat vergezeld van een toelichting.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel44
  - number: '44.2'
    text: |-
      Nadat het ontwerp van de begroting en de toelichting aan het algemeen bestuur zijn aangeboden, worden deze voor een
      ieder ter inzage gelegd ten kantore van de kamer.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel44
  - number: '44.3'
    text: |-
      Van het ter inzage leggen wordt ten minste veertien dagen voordat het algemeen bestuur de begroting behandelt,
      mededeling gedaan in één of meer binnen het gebied van de kamer verspreide dagbladen.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel44
  - number: '45'
    text: |-
      Het algemeen bestuur stelt de begroting vast vóór 1 november van het jaar dat voorafgaat aan het jaar waarop de
      begroting betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel45
  - number: '46.1'
    text: |-
      Het dagelijks bestuur biedt het algemeen bestuur jaarlijks vóór 1 juni een ontwerp aan van een rekening van
      inkomsten en uitgaven van de kamer over het afgelopen kalenderjaar, van een overzicht van de grootte en de
      samenstelling van het vermogen aan het einde van dat jaar en van een bijbehorende toelichting.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel46
  - number: '46.2'
    text: |-
      Het ontwerp van de jaarrekening en van het overzicht van het vermogen gaan vergezeld van een verklaring omtrent
      de getrouwheid en een beoordeling van de rechtmatigheid van een door het algemeen bestuur benoemde accountant als
      bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '46.3'
    text: |-
      [Artikel 44, tweede en derde lid][ref1], is van overeenkomstige toepassing ten aanzien van de in
      [dit artikel][ref2] bedoelde stukken. De kamer stelt voorts deze stukken tegen vergoeding van de kosten voor een
      ieder verkrijgbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel46
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '44'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '46'
        hoofdstuk: '7'
  - number: '47'
    text: |-
      Het algemeen bestuur stelt vóór 1 juli de jaarrekening en het overzicht van het vermogen, alsmede de daarbij
      behorende toelichtingen vast.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel47
  - number: '48.1'
    text: |-
      De begroting, de jaarrekening, het overzicht van het vermogen alsmede de daarbij behorende toelichtingen worden na
      de vaststelling ervan binnen twee weken aan Onze Minister gezonden.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel48
  - number: '48.2'
    text: |-
      Beslissingen van het algemeen bestuur met financiële gevolgen die afwijken van de begroting, worden eveneens binnen
      twee weken nadat zij zijn genomen, aan Onze Minister gezonden.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel48
  - number: '49'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de inrichting van en de toelichting
      op de begroting, de jaarrekening en het overzicht van het vermogen alsmede omtrent aandachtspunten voor de
      accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel49
  - number: '50.1'
    text: |-
      Een kamer verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen. Onze
      Minister kan inzage verlangen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel50
  - number: '50.2'
    text: |-
      De in het eerste lid opgenomen verplichting geldt ook ten aanzien van rechtspersonen van wie de meerderheid van
      de aandelen of de stemrechten in de algemene vergadering direct of indirect in handen is van een of meer kamers
      of van wie de meerderheid van de bestuurders of de commissarissen direct of indirect door een of meer kamers wordt
      benoemd.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel50
  - number: '51.1'
    text: |-
      Het dagelijks bestuur biedt het algemeen bestuur jaarlijks vóór 1 oktober een ontwerp aan van een activiteitenplan
      voor het komende kalenderjaar. Alvorens het ontwerp aan het algemeen bestuur wordt aangeboden, raadpleegt het
      dagelijks bestuur de bij de kamer in het handelsregister ingeschreven ondernemingen over het voorgenomen beleid. In
      het activiteitenplan wordt verslag gedaan:
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel51
  - number: 51.1.a
    text: van de wijze waarop de raadpleging bedoeld in de tweede volzin heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel51
  - number: 51.1.b
    text: van de uitkomsten van de raadpleging en
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel51
  - number: 51.1.c
    text: van de wijze waarop de uitkomsten van de raadpleging in het activiteitenplan zijn verwerkt.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel51
  - number: '51.2'
    text: |-
      [Artikel 44, tweede en derde lid][ref1], is van overeenkomstige toepassing ten aanzien van het activiteitenplan.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel44
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '44'
        hoofdstuk: '7'
  - number: '51.3'
    text: Het algemeen bestuur stelt het activiteitenplan vóór 1 november vast.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel51
  - number: '52.1'
    text: |-
      Het dagelijks bestuur biedt het algemeen bestuur jaarlijks vóór 1 juni een ontwerp aan van een verslag van de
      werkzaamheden van de kamer, het gevoerde beleid en de doelmatigheid en de doeltreffendheid van haar werkwijze in
      het afgelopen kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel52
  - number: '52.2'
    text: Het algemeen bestuur stelt het verslag vóór 1 juli vast.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel52
  - number: '52.3'
    text: Het verslag wordt, tegen vergoeding van de kosten, voor een ieder verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel52
  - number: '53'
    text: |-
      Het activiteitenplan en het jaarverslag worden na de vaststelling ervan binnen twee weken aan Onze Minister
      gezonden.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel53
  - number: '54.1'
    text: |-
      De besluiten van een kamer, alsmede de beslissingen, bedoeld in [de artikelen 45][ref1], [47][ref2],
      [48, tweede lid][ref3], [51, derde lid][ref4], en [52, tweede lid][ref5], kunnen door Onze Minister worden
      vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0009276#Artikel48
      [ref4]: https://wetten.overheid.nl/BWBR0009276#Artikel51
      [ref5]: https://wetten.overheid.nl/BWBR0009276#Artikel52
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '45'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '47'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0009276
        artikel: '48'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0009276
        artikel: '51'
        hoofdstuk: '8'
      - id: ref5
        bwb_id: BWBR0009276
        artikel: '52'
        hoofdstuk: '8'
  - number: '54.2'
    text: |-
      Ten aanzien van de vernietiging van een beslissing als bedoeld in [de artikelen 45][ref1], [47][ref2],
      [48, tweede lid][ref3], [51, derde lid][ref4], en [52, tweede lid][ref5], zijn de [afdelingen 10.2.2][ref6] en
      [10.2.3 van de Algemene wet bestuursrecht][ref7] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0009276#Artikel48
      [ref4]: https://wetten.overheid.nl/BWBR0009276#Artikel51
      [ref5]: https://wetten.overheid.nl/BWBR0009276#Artikel52
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.2
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.3
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '45'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '47'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0009276
        artikel: '48'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0009276
        artikel: '51'
        hoofdstuk: '8'
      - id: ref5
        bwb_id: BWBR0009276
        artikel: '52'
        hoofdstuk: '8'
      - id: ref6
        bwb_id: BWBR0005537
        afdeling: 10.2.2
      - id: ref7
        bwb_id: BWBR0005537
        afdeling: 10.2.3
  - number: '55.1'
    text: |-
      Tegen een op grond van deze wet genomen besluit en tegen een ander door een kamer genomen besluit, met uitzondering
      van besluiten op grond van de [Wet openbaarheid van bestuur][ref1], kan een belanghebbende beroep instellen bij het
      College van Beroep voor het bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: '55.2'
    text: |-
      Het eerste lid geldt niet ten aanzien van besluiten waartegen bij of krachtens de wet een andere voorziening is
      opengesteld.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel55
  - number: '58'
    text: |-
      Tot het tijdstip waarop de gebiedsindeling van de kamers op grond van [artikel 2, tweede lid][ref1], wordt
      gewijzigd, blijven de kamers, zoals die laatstelijk zijn ingesteld op grond van artikel 2 van de Wet op de Kamers
      van Koophandel en Fabrieken 1963, in stand.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel2
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '2'
        hoofdstuk: '2'
  - number: '59'
    text: |-
      De laatstelijk op grond van artikel 14, tweede lid, van de Wet op de Kamers van Koophandel en Fabrieken 1963
      vastgestelde regelingen blijven van toepassing, totdat de regelingen, vastgesteld op grond van [artikel 15][ref1],
      in werking zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel15
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '60'
    text: |-
      Als begroting en plan van activiteiten voor het jaar waarin [artikel 2][ref1] in werking treedt gelden de begroting
      onderscheidenlijk het beleidsplan zoals deze voor dat jaar zijn vastgesteld op grond van de Wet op de Kamers van
      Koophandel en Fabrieken 1963.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel2
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '2'
        hoofdstuk: '2'
  - number: '61'
    text: |-
      Vanaf het tijdstip van inwerkingtreding van [hoofdstuk 6][ref1] worden bij de in
      [de artikelen 32, vierde lid][ref2], en [37, tweede lid][ref3], bedoelde besluiten de bedragen in drie jaarlijkse
      stappen gebracht op de bij algemene maatregel van bestuur vast te stellen verhouding van naar rechtsvorm en grootte
      ingedeelde ondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0009276#Artikel37
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0009276
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '32'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009276
        artikel: '37'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: '62'
    text: |-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van [artikel 2][ref1] van deze wet, en vervolgens
      telkens na vier jaar, aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in
      de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel2
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '2'
        hoofdstuk: '2'
  - number: '63'
    text: |-
      De Wet op de Kamers van Koophandel en Fabrieken 1963 wordt ingetrokken op een bij koninklijk besluit te bepalen
      tijdstip dat voor de verschillende hoofdstukken of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel63
  - number: '64'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende hoofdstukken
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel64
  - number: '66'
    text: |-
      Deze wet wordt aangehaald als: Wet op de kamers van koophandel en fabrieken, met vermelding van het jaartal van het
      Staatsblad waarin zij zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel66
