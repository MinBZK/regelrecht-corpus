  - number: '18.1'
    text: |-
      Het dagelijks bestuur is belast met de voorbereiding van al hetgeen in de vergadering van het algemeen bestuur ter
      overweging en beslissing moet worden gebracht.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel18
  - number: '18.2'
    text: Het dagelijks bestuur is belast met de uitvoering van de besluiten van het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel18
  - number: '19'
    text: De voorzitter vertegenwoordigt de kamer in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel19
  - number: '20'
    text: |-
      Het algemeen bestuur stelt een bestuursreglement vast waarin regels zijn opgenomen omtrent zijn werkwijze en de
      werkwijze van het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel20
  - number: '21.1'
    text: De vergaderingen van het algemeen bestuur worden in het openbaar gehouden.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel21
  - number: '21.2'
    text: |-
      De deuren worden gesloten wanneer ten minste een vijfde van de aanwezige leden daarom verzoekt of de voorzitter het
      nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel21
  - number: '21.3'
    text: Het algemeen bestuur beslist vervolgens of met gesloten deuren zal worden vergaderd.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel21
  - number: '22'
    text: 'In een besloten vergadering kan niet worden beraadslaagd of besloten over:'
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel22
  - number: 22.a
    text: de vaststelling van de begroting, van de jaarrekening, van het activiteitenplan en van het jaarverslag;
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel22
  - number: 22.b
    text: |-
      een besluit als bedoeld in [de artikelen 32, vierde lid][ref1], [33, eerste lid][ref2], [34][ref3],
      [35, eerste lid][ref4], en [37, tweede lid][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0009276#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0009276#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0009276#Artikel37
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '32'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009276
        artikel: '34'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009276
        artikel: '35'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0009276
        artikel: '37'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: 22.c
    text: |-
      de ontheffing uit zijn functie onderscheidenlijk het ontslag van een al dan niet uit het midden van het algemeen
      bestuur benoemde voorzitter of
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel22
  - number: 22.d
    text: de benoeming en de ontheffing uit hun functie van de leden van het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel22
  - number: '23'
    text: |-
      Naast de haar bij of krachtens andere wetten opgedragen taken, heeft een kamer tot taak desgevraagd inlichtingen
      van algemene aard te verstrekken ten aanzien van het oprichten en drijven van een onderneming in haar gebied.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel23
  - number: '24'
    text: 'Een kamer kan besluiten de volgende taken uit te oefenen:'
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel24
  - number: 24.a
    text: |-
      het desgevraagd geven van gerichte voorlichting op juridisch en economisch terrein ten aanzien van een in haar
      gebied gevestigde of nog te vestigen onderneming en
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel24
  - number: 24.b
    text: |-
      het desgevraagd of uit eigen beweging geven van voorlichting over aangelegenheden op juridisch en economisch
      terrein aan groepen van personen die in haar gebied een onderneming drijven of overwegen een onderneming op te
      richten.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel24
  - number: '25'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van de in
      [de artikelen 23][ref1] en [24][ref2] bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel24
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '24'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '26'
    text: |-
      Een kamer kan desgevraagd of uit eigen beweging openbare lichamen adviseren voor zover het betreft aangelegenheden
      die de economische belangen van handel, industrie, ambacht en dienstverlening in haar gebied raken.
      [Artikel 20, vijfde lid, tweede en derde volzin, van de Kaderwet adviescolleges][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel20
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '20'
  - number: '27.1'
    text: |-
      Een kamer kan besluiten tot het stimuleren van economische ontwikkelingen in haar gebied door middel van het
      bevorderen van onderzoeken, overlegvormen en samenwerkingsverbanden.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel27
  - number: '27.2'
    text: |-
      Een kamer kan ten behoeve van een onderzoek, overlegvorm of samenwerkingsverband als bedoeld in het eerste lid een
      subsidie verstrekken.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel27
  - number: '27.3'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot het totale bedrag dat een kamer in
      een jaar op grond van het tweede lid verstrekt.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel27
  - number: '28'
    text: 'Voor zover daaromtrent geen andere regeling geldt heeft een kamer de bevoegdheid om desgevraagd:'
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel28
  - number: 28.a
    text: |-
      certificaten van oorsprong en andere verklaringen ten dienste van handel, industrie, ambacht en dienstverlening af
      te geven;
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel28
  - number: 28.b
    text: handtekeningen van personen die bij handel, industrie, ambacht en dienstverlening betrokken zijn, te legaliseren;
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel28
  - number: 28.c
    text: een onderzoek te houden en een verklaring af te geven inzake de toelaatbaarheid van een handelsnaam of
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel28
  - number: '29'
    text: |-
      Een kamer kan besluiten andere dan de in dit hoofdstuk of elders bij of krachtens wet geregelde taken uit te
      oefenen, voor zover deze passen binnen de in [artikel 2, eerste lid][ref1], aangegeven doelstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel2
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '2'
        hoofdstuk: '2'
  - number: '30.1'
    text: |-
      Een kamer draagt er zorg voor dat zij geen werkzaamheden verricht die leiden tot mededinging met ondernemingen of
      vrije beroepsbeoefenaren die uit een oogpunt van een goede marktwerking ongewenst is.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel30
  - number: '30.2'
    text: |-
      Een kamer draagt er voorts zorg voor dat haar werkzaamheden niet leiden tot het verhinderen, beperken of vervalsen
      van de mededinging tussen ondernemingen of vrije beroepsbeoefenaren.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel30
  - number: '30.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen met het oog op het eerste en tweede lid regels worden gesteld die
      inhouden dat:
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel30
  - number: 30.3.a
    text: bepaalde werkzaamheden door de kamers niet mogen worden verricht of
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel30
  - number: 30.3.b
    text: de kamers zich bij bepaalde werkzaamheden dienen te gedragen overeenkomstig een in dat besluit aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel30
  - number: '30.4'
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing ten aanzien van rechtspersonen van wie de
      meerderheid van de aandelen of de stemrechten in de algemene vergadering direct of indirect in handen is van een of
      meer kamers, of van wie de meerderheid van de bestuurders of van de commissarissen direct of indirect door een of
      meer kamers wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel30
  - number: '31.1'
    text: |-
      Een kamer oefent de in [de artikelen 24][ref1] en [27][ref2] bedoelde taken en de in [artikel 29][ref3] bedoelde
      andere taken uit voor zover daarin niet in voldoende mate wordt voorzien door rechtspersonen die volgens hun
      statuten tot doel hebben de belangen van ondernemers te behartigen.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0009276#Artikel29
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '24'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009276
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '31.2'
    text: |-
      Het eerste lid geldt eveneens met betrekking tot de uitoefening van de in [artikel 26][ref1] bedoelde taak, voor
      zover het betreft advisering uit eigen beweging door de kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel26
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '26'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '32.1'
    text: |-
      Ter financiering van de aan uitvoering van andere wetten dan deze wet voor een kamer verbonden kosten, voor zover
      deze niet worden gedekt door bij of krachtens die wetten vastgestelde vergoedingen, zijn ondernemingen als bedoeld
      in [artikel 3 van de Handelsregisterwet 1996][ref1] voor ieder kalenderjaar of gedeelte daarvan waarin zij in
      Nederland gevestigd zijn, in Nederland een nevenvestiging hebben of in Nederland worden vertegenwoordigd door een
      gevolmachtigde handelsagent, een bijdrage verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel3
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '3'
  - number: '32.2'
    text: |-
      De bijdrage bestaat uit een bedrag ten behoeve van de hoofdvestigingskamer en, voor zover van toepassing, bedragen
      ten behoeve van de nevenvestigingskamers.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel32
  - number: '32.3'
    text: |-
      De onderneming is het totale bedrag van de bijdrage verschuldigd aan de hoofdvestigingskamer. Deze draagt zorg voor
      verrekening met de betrokken nevenvestigingskamers.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel32
  - number: '32.4'
    text: |-
      De bedragen worden vastgesteld door de kamer ten behoeve waarvan het bedrag verschuldigd is, overeenkomstig de bij
      algemene maatregel van bestuur vast te stellen verhouding van naar rechtsvorm en grootte ingedeelde ondernemingen.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel32
  - number: '32.5'
    text: |-
      De hoofdvestigingskamer kan op aanvraag de verplichting tot betaling van de verschuldigde bijdrage geheel of
      gedeeltelijk buiten toepassing laten voor zover naar haar oordeel sprake is van een bijzonder geval waarin
      invordering of onverkorte invordering onredelijk zou zijn.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel32
  - number: '33.1'
    text: |-
      Ter financiering van de aan inschrijving in het handelsregister voor een kamer verbonden kosten zijn rechtspersonen
      als bedoeld in [artikel 4 van de Handelsregisterwet 1996][ref1] voor ieder kalenderjaar of gedeelte daarvan
      waarin zij in Nederland gevestigd zijn, een door de kamer vast te stellen bijdrage verschuldigd, die per soort
      rechtspersoon kan verschillen.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel4
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '4'
  - number: '33.2'
    text: |-
      Het eerste lid is niet van toepassing op de rechtspersoon waaraan een onderneming toebehoort die overeenkomstig
      [artikel 32][ref1] als zodanig een bijdrage verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel32
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '32'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '34'
    text: |-
      Indien een kamer besluit tot het uitvoeren van taken als bedoeld in [de artikelen 24][ref1] en [28][ref2], stelt
      zij vergoedingen vast ter financiering van de aan de uitvoering van deze taken voor de kamer verbonden kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel28
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '24'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '28'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '35.1'
    text: |-
      Een kamer stelt een bijdrage vast welke ondernemingen als bedoeld in
      [artikel 3 van de Handelsregisterwet 1996][ref1] voor ieder kalenderjaar of gedeelte daarvan verschuldigd zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel3
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '3'
  - number: 35.1.a
    text: |-
      ter financiering van de kosten van uitvoering van de in [artikel 23][ref1] bedoelde taak;


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel23
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 35.1.b
    text: |-
      indien een kamer besluit tot het uitvoeren van taken als bedoeld in [artikel 24][ref1], ter financiering van de
      aan de uitvoering van deze taken verbonden kosten, voor zover deze niet worden gedekt door de in [artikel 34][ref2]
      voor deze taken bedoelde vergoedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel34
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '24'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '34'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '35.2'
    text: De bijdrage is voor alle ondernemingen gelijk.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel35
  - number: '36'
    text: |-
      Indien een kamer besluit tot het desgevraagd uitvoeren van de taak, bedoeld in [artikel 26][ref1], kan zulks
      geschieden tegen vergoeding van de aan de uitvoering van deze taak voor de kamer verbonden kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel26
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '26'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '37.1'
    text: |-
      Indien een kamer besluit tot het uitvoeren van taken als bedoeld in [de artikelen 26][ref1] en [27][ref2], stelt
      zij ter financiering van de aan de uitvoering van deze taken verbonden kosten, voor zover deze wat betreft de
      in [artikel 26][ref3] bedoelde taak niet worden gedekt door de in [de artikel 36][ref4] bedoelde vergoedingen,
      een bijdrage vast welke ondernemingen als bedoeld in [artikel 3 van de Handelsregisterwet 1996][ref5] voor ieder
      kalenderjaar of gedeelte daarvan verschuldigd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0009276#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0009276#Artikel36
      [ref5]: https://wetten.overheid.nl/BWBR0007893#Artikel3
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '26'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009276
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009276
        artikel: '26'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0009276
        artikel: '36'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0007893
        artikel: '3'
  - number: '37.2'
    text: |-
      De bedragen worden vastgesteld door de kamer, overeenkomstig de bij algemene maatregel van bestuur vast te stellen
      verhouding van naar rechtsvorm en grootte ingedeelde ondernemingen.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel37
  - number: '38.1'
    text: |-
      Indien een kamer besluit tot het uitvoeren van taken als bedoeld in [artikel 29][ref1], geschiedt zulks tegen
      vergoeding van de aan de uitvoering van deze taken voor de kamer verbonden kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel29
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '38.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van rechtspersonen van wie de meerderheid van
      de aandelen of de stemrechten in de algemene vergadering in handen is van een of meer kamers, of van wie de
      meerderheid van de bestuurders of van de commissarissen door een of meer kamers wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel38
  - number: '39.1'
    text: |-
      De in [de artikelen 32, vierde lid][ref1], [33, eerste lid][ref2], [35, eerste lid][ref3], en
      [37, tweede lid][ref4], bedoelde besluiten behoeven de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0009276#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0009276#Artikel37
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel39
