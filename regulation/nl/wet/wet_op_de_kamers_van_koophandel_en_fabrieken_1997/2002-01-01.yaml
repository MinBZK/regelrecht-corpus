preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels te stellen omtrent de instelling, het
    bestuur, de taken en de financiering van de kamers van koophandel en fabrieken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel1
  - number: 1.b
    text: 'SER: Sociaal-Economische Raad;'
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel1
  - number: 1.c
    text: 'kamer: kamer van koophandel en fabrieken;'
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel1
  - number: 1.d
    text: |-
      hoofdvestigingskamer: de kamer waarbij de onderneming op grond van [artikel 6 van de Handelsregisterwet 1996][ref1]
      ingeschreven is of behoort te zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel6
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '6'
  - number: 1.e
    text: |-
      nevenvestigingskamer: de kamer in het gebied waarvan een nevenvestiging van de onderneming gelegen is, niet zijnde
      de hoofdvestigingskamer.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel1
  - number: '2.1'
    text: |-
      Over het gehele land zijn er kamers van koophandel en fabrieken die tot doel hebben de bevordering van de
      economische belangen van handel, industrie, ambacht en dienstverlening in hun gebied.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel2
  - number: '2.2'
    text: |-
      Bij algemene maatregel van bestuur worden de kamers ingesteld en opgeheven en wordt voor elke kamer het gebied
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009276/2002-01-01#Artikel2
  - number: '2.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de gevolgen van de
      instelling, opheffing en gebiedsindeling van de kamers, waarbij zonodig voor de duur van ten hoogste vier jaren
      kan worden afgeweken van het bepaalde bij of krachtens [de artikelen 8][ref1], [9][ref2], [10][ref3], [11][ref4],
      [14][ref5], [15][ref6], [32][ref7], [33][ref8], [35][ref9], [37][ref10], [44][ref11], [45][ref12], [46][ref13],
      [47][ref14], [51][ref15] en [52][ref16].


