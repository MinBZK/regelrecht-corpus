preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels te stellen omtrent de instelling, het
    bestuur, de taken en de financiering van de kamers van koophandel en fabrieken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Economische Zaken, Landbouw en Innovatie;

      b. SER: Sociaal-Economische Raad;

      c. kamer: kamer van koophandel en fabrieken;

      d. hoofdvestigingskamer: de kamer waarbij de onderneming op grond van
      [artikel 18, zesde lid, van de Handelsregisterwet 2007][ref1] ingeschreven is of behoort te zijn;

      e. nevenvestigingskamer: de kamer in het gebied waarvan een nevenvestiging van de onderneming gelegen is, niet
      zijnde de hoofdvestigingskamer;

      f. samenwerkingsverband: het samenwerkingsverband bedoeld in [artikel 22a][ref2];

      g. overlegorganisatie: een privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid, die niet bedrijfsmatig
      werkzaam is, blijkens zijn statuten met betrekking tot meerdere bedrijfstakken tot doel heeft de belangen te
      behartigen van ondernemers of werknemers en door de SER voor meerdere kamers als organisatie als bedoeld in
      [artikel 11, eerste lid][ref3], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel22a
      [ref3]: https://wetten.overheid.nl/BWBR0009276#Artikel11
