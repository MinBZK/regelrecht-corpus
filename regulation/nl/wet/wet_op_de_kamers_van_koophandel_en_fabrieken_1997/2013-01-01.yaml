  - number: '34'
    text: |-
      1 Voor de uitvoering van activiteiten als bedoeld in [artikel 27, eerste of zevende lid][ref1], stelt Onze Minister
      bij regeling de vergoedingen vast die verschuldigd zijn ter gehele of gedeeltelijke financiering van de aan de
      uitvoering van deze activiteiten voor de kamers verbonden kosten.

      2 Het samenwerkingsverband doet met het oog op de vaststelling, bedoeld in het eerste lid, aan Onze Minister
      jaarlijks vóór 1 november een voorstel toekomen.

      3 Onze Minister stelt binnen 6 weken na het verstrijken van de in het tweede lid bedoelde termijn, de in het eerste
      lid bedoelde vergoedingen vast.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel27
