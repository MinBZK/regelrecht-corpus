  - number: 22a
    text: |-
      De vereniging met de naam Kamer van Koophandel Nederland wordt aangemerkt als samenwerkingsverband in de zin van
      deze wet.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel22a
  - number: 22b
    text: |-
      Behalve de in deze wet opgedragen taken kunnen bij algemene maatregel van bestuur aan het samenwerkingsverband
      coördinerende en faciliterende taken worden opgedragen met betrekking tot het verkeer tussen de kamers onderling of
      tussen Onze Minister en de kamers.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel22b
  - number: '23'
    text: |-
      Een kamer heeft tot taak desgevraagd inlichtingen van algemene aard te verstrekken ten aanzien van het oprichten en
      drijven van een onderneming in haar gebied.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel23
  - number: '24'
    text: |-
      Een kamer heeft tot taak:

      a. gerichte voorlichting te geven op juridisch en economisch terrein ten aanzien van een in haar gebied gevestigde
      of nog te vestigen onderneming; en

      b. voorlichting te geven over aangelegenheden op juridisch en economisch terrein aan groepen van personen die in
      haar gebied een onderneming drijven of overwegen een onderneming op te richten.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel24
  - number: '25'
    text: |-
      1 Een kamer heeft tot taak het stimuleren van economische ontwikkelingen in haar gebied door middel van het
      bevorderen van onderzoeken, overleg- en samenwerkingsvormen en het desgevraagd of uit eigen beweging adviseren
      van openbare lichamen over aangelegenheden die de economische belangen van handel, industrie, ambacht en
      dienstverlening in haar gebied raken.

      2 Een kamer kan ten behoeve van een onderzoek, overleg- of samenwerkingsvorm als bedoeld in het eerste lid een
      subsidie verstrekken.

      3 Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot het totale bedrag dat een kamer in
      een jaar op grond van het tweede lid verstrekt.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel25
  - number: '26'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van de in de
      [artikelen 23][ref1], [24][ref2] en [25][ref3] bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0009276#Artikel25
