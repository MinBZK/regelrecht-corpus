  - number: '35'
    text: |-
      1 Voor activiteiten ter uitvoering van de taken, bedoeld in [artikel 24][ref1] en [25][ref2], stelt een
      kamer ter gehele of gedeeltelijke financiering van de aan de uitvoering van die activiteiten voor een
      kamer verbonden kosten, de vergoedingen vast voor zover die activiteiten geen deel uitmaken van de in
      [artikel 27, eerste of zevende lid][ref3], bedoelde activiteiten.

      2 Bij regeling van Onze Minister kunnen nadere regels worden gesteld over de wijze waarop de hoogte van de in het
      eerste lid bedoelde vergoeding wordt bepaald.

      3 De in het eerste lid bedoelde besluiten worden bekendgemaakt door terinzagelegging ten kantore van de kamer en
      publicatie daarvan in een door Onze Minister aangewezen publicatieblad.

      4 In afwijking van [artikel 17, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref4], behoeven de
      vergoedingen, bedoeld in het eerste lid, geen goedkeuring van Onze Minister.


