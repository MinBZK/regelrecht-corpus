    text: |-
      1 Het algemeen bestuur stelt de begroting vast en zendt deze aan Onze Minister vóór 1 november van het jaar dat
      voorafgaat aan het kalenderjaar waarop de begroting betrekking heeft.

      2 Onze Minister beslist binnen 6 weken na het verstrijken van de in het eerste lid bedoelde termijn, of de
      goedkeuring wordt verleend.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel45
  - number: '46'
    text: |-
      1 Het samenwerkingsverband maakt een overzicht waaruit blijkt op welke wijze de door de kamers
      vastgestelde begrotingen in relatie staan tot de voor de uitvoering van de activiteiten, bedoeld
      in [artikel 27, eerste of zevende lid][ref1], en de voor de uitvoering van de taak, bedoeld in
      [artikel 3 van de Handelsregisterwet 200.][ref2], door het samenwerkingsverband geraamde budgetten en zendt
      dat overzicht aan Onze Minister vóór 1 november van het jaar dat voorafgaat aan het kalenderjaar waarop deze
      begrotingen en deze budgetten betrekking hebben.

      2 Het samenwerkingsverband maakt een overzicht waaruit blijkt op welke wijze de door de kamers
      vastgestelde jaarrekeningen in relatie staan tot de in verband met de uitvoering van de activiteiten,
      bedoeld in [artikel 27, eerste of zevende lid][ref3], en de voor de uitvoering van de taak, bedoeld in
      [artikel 3 van de Handelsregisterwet 200.][ref4], gemaakte kosten en zendt dat overzicht aan Onze Minister vóór 1
      juli van het jaar dat volgt op het kalenderjaar waarop deze jaarrekeningen en deze kosten betrekking hebben.

      3 De overzichten, bedoeld in het eerste en tweede lid, onderscheiden tussen de taak, bedoeld in
      [artikel 3 van de Handelsregisterwet 200.][ref5], de taak, bedoeld in [artikel 24][ref6], en de overige
      activiteiten, bedoeld in [artikel 27, eerste of zevende lid][ref7].

      4 Bij ministeriële regeling kunnen nadere eisen worden gesteld aan de inrichting van de overzichten, bedoeld in het
      eerste en tweede lid.


