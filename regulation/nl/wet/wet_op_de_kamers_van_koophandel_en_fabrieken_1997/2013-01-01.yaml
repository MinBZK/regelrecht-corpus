  - number: '18'
    text: |-
      1 Het dagelijks bestuur is belast met de voorbereiding van al hetgeen in de vergadering van het algemeen bestuur
      ter overweging en beslissing moet worden gebracht.

      2 Het dagelijks bestuur is belast met de uitvoering van de besluiten van het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel18
  - number: '19'
    text: De voorzitter vertegenwoordigt de kamer in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel19
  - number: '21'
    text: |-
      1 De vergaderingen van het algemeen bestuur worden in het openbaar gehouden.

      2 De deuren worden gesloten wanneer ten minste een vijfde van de aanwezige leden daarom verzoekt of de voorzitter
      het nodig oordeelt.

      3 Het algemeen bestuur beslist vervolgens of met gesloten deuren zal worden vergaderd.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel21
  - number: '22'
    text: |-
      In een besloten vergadering kan niet worden beraadslaagd of besloten over:

      a. de vaststelling van de begroting, van de jaarrekening, van het activiteitenplan en van het jaarverslag;

      b. een besluit als bedoeld in [artikel 35, eerste lid][ref1], en [artikel 37, eerste lid][ref2];

      c. de ontheffing uit zijn functie onderscheidenlijk het ontslag van een al dan niet uit het midden van het algemeen
      bestuur benoemde voorzitter of

      d. de benoeming en de ontheffing uit hun functie van de leden van het dagelijks bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel37
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel22
