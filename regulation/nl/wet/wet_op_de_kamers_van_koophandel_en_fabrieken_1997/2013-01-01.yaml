  - number: '2'
    text: |-
      1 Over het gehele land zijn er kamers van koophandel en fabrieken die tot doel hebben de bevordering van de
      economische belangen van handel, industrie, ambacht en dienstverlening in hun gebied.

      2 Bij of krachtens algemene maatregel van bestuur worden de kamers ingesteld en opgeheven en wordt voor elke kamer
      het gebied vastgesteld.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de gevolgen van de
      instelling, opheffing en gebiedsindeling van de kamers, waarbij zonodig voor de duur van ten hoogste vier jaren
      kan worden afgeweken van het bepaalde bij of krachtens de [artikelen 8][ref1], [9][ref2], [10][ref3], [11][ref4],
      [17][ref5], [36][ref6], [45][ref7], [45a][ref8], [47][ref9], [48][ref10], [49][ref11], [51][ref12] en [52][ref13]
      en [artikel 49 van de Handelsregisterwet 200.][ref14].

      4 Alvorens Onze Minister een voordracht voor een besluit als bedoeld in het tweede of derde lid doet, stelt hij de
      kamers, waarvan het gebied bij het in overweging zijnde besluit betrokken is, in de gelegenheid van hun inzicht te
      doen blijken.


