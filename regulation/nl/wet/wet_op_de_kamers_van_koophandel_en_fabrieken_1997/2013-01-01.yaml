  - number: 35a
    text: |-
      1 Indien een kamer besluit tot het uitvoeren van taken als bedoeld in [artikel 28][ref1] of [29][ref2], geschiedt
      zulks tegen vergoeding van de aan de uitvoering van die taken voor de kamer verbonden kosten.

      2 Vergoedingen en bijdragen die aan een kamer zijn verschuldigd anders dan op basis van het eerste lid, worden niet
      aangewend ter vergoeding van kosten die zijn verbonden aan de uitvoering van de in het eerste lid genoemde taken.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van rechtspersonen van wie de
      meerderheid van de aandelen of de stemrechten in de algemene vergadering in handen is van een of meer kamers, of
      van wie de meerderheid van de bestuurders of van de commissarissen door een of meer kamers wordt benoemd.

      4 In afwijking van [artikel 17, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref3], behoeft een
      vergoeding als bedoeld in het eerste lid geen goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel29
