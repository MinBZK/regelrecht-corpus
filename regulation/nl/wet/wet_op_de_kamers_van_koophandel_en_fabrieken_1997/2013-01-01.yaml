  - number: '27'
    text: |-
      1 Met betrekking tot de taken als bedoeld in [artikel 24][ref1] en [25][ref2] komen de kamers jaarlijks, na
      overleg met Onze Minister en de overlegorganisaties, overeen welke activiteiten door de kamers in het eerstkomende
      kalenderjaar op zoveel mogelijk uniforme wijze worden verricht.

      2 Het secretariaat met betrekking tot de afspraken bedoeld in het eerste lid wordt gevoerd door het
      samenwerkingsverband.

      3 Het samenwerkingsverband zendt de afspraken jaarlijks vóór 15 september aan Onze Minister.

      4 De afspraken behoeven de instemming van Onze Minister.

      5 Onze Minister beslist binnen 6 weken na het verstrijken van de in het derde lid genoemde termijn, of hij met de
      afspraken instemt.

      6 De in het vijfde lid bedoelde instemming wordt geacht te zijn gegeven, indien binnen de in dat lid genoemde
      termijn van 6 weken geen bericht van instemming is verzonden of geen bericht is verzonden dat de beslissing omtrent
      instemming wordt verdaagd, dan wel binnen de termijn waarvoor de beslissing is verdaagd, geen beslissing omtrent
      instemming is genomen.

      7 Indien de in het derde lid bedoelde termijn is verstreken zonder dat Onze Minister de afspraken heeft ontvangen
      of indien Onze Minister niet met de afspraken heeft ingestemd, kan Onze Minister bij regeling vaststellen welke
      activiteiten door de kamers in het eerstkomende kalenderjaar op zoveel mogelijk uniforme wijze worden verricht.

      8 Het samenwerkingsverband brengt jaarlijks vóór 1 april aan Onze Minister verslag uit over de uitoefening van de
      activiteiten, bedoeld in het eerste of zevende lid, in het voorgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel25
