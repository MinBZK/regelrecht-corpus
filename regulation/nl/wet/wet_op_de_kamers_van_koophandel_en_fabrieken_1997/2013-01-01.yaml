  - number: '4'
    text: |-
      De bepalingen van deze wet zijn tevens van toepassing op instellingen die door de kamers met de uitvoering van een
      deel van hun taken als bedoeld in [de artikelen 23 tot en met 29][ref1] worden belast.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel23
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '5'
    text: |-
      1 Het bestuur van een kamer bestaat uit een algemeen bestuur en een voorzitter.

      2 Het algemeen bestuur staat aan het hoofd van de kamer.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel5
  - number: '6'
    text: |-
      1 Het algemeen bestuur benoemt al dan niet uit zijn midden een voorzitter. De uit het midden van het algemeen
      bestuur benoemde voorzitter is lid van het algemeen bestuur en heeft stemrecht. De niet uit het midden van het
      algemeen bestuur benoemde voorzitter is lid van het algemeen bestuur en heeft geen stemrecht. Voor de toepassing
      van [artikel 7][ref1] wordt de niet uit het midden van het algemeen bestuur benoemde voorzitter niet als lid van
      het algemeen bestuur aangemerkt.

      2 Het algemeen bestuur benoemt uit zijn midden een plaatsvervangend voorzitter.

      3 De in het eerste en tweede lid bedoelde benoemingen geschieden voor een door het algemeen bestuur te bepalen
      termijn, die de zittingsduur van het algemeen bestuur niet overschrijdt.

      4 Het algemeen bestuur kan een voorzitter of plaatsvervangend voorzitter schorsen of ontslaan.

      5 Onze Minister kan in bijzondere omstandigheden een voorzitter of plaatsvervangend voorzitter schorsen of
      ontslaan, gehoord het algemeen bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel7
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '7'
    text: |-
      1 Het algemeen bestuur bestaat voor eenderde deel uit leden afkomstig uit de kring van ondernemers in het midden-
      en kleinbedrijf, voor eenderde deel uit leden afkomstig uit de kring van overige ondernemers en voor eenderde deel
      uit leden afkomstig uit de kring van werknemers.

      2 Het aantal leden van het algemeen bestuur bedraagt ten hoogste vierentwintig.

      3 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de criteria ter bepaling van het in het
      tweede lid bedoelde aantal.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel7
  - number: '8'
    text: |-
      1 De leden worden benoemd voor een periode van vier jaren. Zij treden tegelijk af en kunnen ten hoogste tweemaal
      worden herbenoemd.

      2 Degene die lid is geworden ter vervulling van een tussentijds opengevallen plaats, treedt af op het tijdstip
      waarop degene in wiens plaats hij is getreden, had moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel8
  - number: '9'
    text: |-
      1 Tot lid van het algemeen bestuur van een kamer kunnen alleen worden benoemd degenen, die:

      a. nauw betrokken zijn bij een onderneming in het gebied van de kamer;

      b. niet in staat van faillissement verkeren of anderszins de beschikking of het beheer over hun goederen verloren
      hebben;

      c. voorafgaand aan de benoeming niet meer dan acht jaren hebben deel genomen aan het bestuur van een kamer;

      d. niet reeds, voor dezelfde zittingsperiode, benoemd zijn tot lid van het algemeen bestuur van een andere kamer en

      e. niet bij onherroepelijke rechterlijke uitspraak van het kiesrecht in de zin van de [Kieswet][ref1] zijn ontzet.

      2 Bij regeling van Onze Minister kunnen eisen worden gesteld met betrekking tot de benoembaarheid tot lid van het
      algemeen bestuur.

      3 De in het tweede lid bedoelde regeling bevat in ieder geval een benoemingscode, op grond waarvan de
      benoemingsgerechtigde organisaties hun leden in het algemeen bestuur benoemen.

      4 De in het tweede lid bedoelde regeling en iedere wijziging hiervan treden niet eerder in werking dan vier weken
      nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '10'
    text: |-
      1 De SER bepaalt, met inachtneming van de bij of krachtens [artikel 7][ref1] gestelde regels, voor iedere kamer
      en voor iedere zittingsperiode afzonderlijk, de takken van handel, industrie, ambacht en dienstverlening waarvoor
      leden zitting hebben in de kamer, alsmede het aantal leden dat voor elk van de aangewezen takken in de kamer
      zitting heeft.

      2 Voordat de SER een besluit als bedoeld in het eerste lid neemt, stelt hij het algemeen bestuur in de gelegenheid
      van zijn inzicht daaromtrent te doen blijken.

      3 Van een besluit als bedoeld in het eerste lid alsmede van het openstellen van de in het tweede lid bedoelde
      gelegenheid doet de SER openbare kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel7
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '11'
    text: |-
      1 De leden worden benoemd, geschorst en ontslagen door organisaties van ondernemers en van werknemers die daartoe,
      met inachtneming van het bij of krachtens de [artikelen 7][ref1] en [10][ref2] bepaalde, voor iedere kamer en
      iedere zittingsperiode afzonderlijk door de SER zijn aangewezen.

      2 Voor aanwijzing komen uitsluitend in aanmerking organisaties die naar het oordeel van de SER van voldoende
      betekenis zijn voor de ondernemers of de werknemers in het gebied van de kamer.

      3 Bij de aanwijzing van een organisatie bepaalt de SER het aantal leden dat die organisatie benoemt, alsmede
      voor welke tak elk te benoemen lid zitting heeft. De SER kan bepalen dat de benoeming van één of meer leden zal
      geschieden door twee of meer aangewezen organisaties gezamenlijk.

      4 Voordat de SER de organisaties aanwijst stelt hij het algemeen bestuur van de betrokken kamer in de gelegenheid
      van zijn inzicht omtrent de aanwijzing te doen blijken.

      5 Onze Minister kan in bijzondere omstandigheden een lid schorsen of ontslaan, gehoord de organisatie die het
      betreffende lid heeft benoemd.

      6 De leden hebben op persoonlijke titel zitting in het algemeen bestuur en oefenen hun functie uit zonder last
      of ruggespraak.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel10
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel11
