    text: |-
      1 Voor de uitvoering van de activiteiten, bedoeld in [artikel 27, eerste of zevende lid][ref1], alsmede van de
      taak, bedoeld in [artikel 23][ref2], stelt Onze Minister ter financiering van de aan de uitvoering van deze taken
      verbonden kosten, voor zover deze wat betreft de in [artikel 24][ref3] bedoelde taak niet worden gedekt door
      de in [artikel 34][ref4] bedoelde vergoedingen, bij regeling een bijdrage vast welke ondernemingen voor ieder
      kalenderjaar of gedeelte daarvan verschuldigd zijn.

      2 Het samenwerkingsverband doet met het oog op de vaststelling, bedoeld in het eerste lid, aan Onze Minister
      jaarlijks vóór 1 november een voorstel toekomen.

      3 Onze Minister stelt binnen 6 weken na het verstrijken van de in het tweede lid bedoelde termijn, de in het eerste
      lid bedoelde bijdragen vast.


