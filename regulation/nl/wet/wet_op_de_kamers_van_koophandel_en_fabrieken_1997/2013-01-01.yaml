  - number: '47'
    text: |-
      1 Het algemeen bestuur stelt de jaarrekening vast.

      2 Onze Minister beslist binnen 6 weken na 1 juli of de goedkeuring, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1] wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel34
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '34'
  - number: '49'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de inrichting van en de toelichting op de
      begroting en de jaarrekening, omtrent eisen met betrekking tot de hoogte en samenstelling van het eigen vermogen en
      omtrent aandachtspunten voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel49
  - number: 49a
    text: |-
      1 Een kamer behoeft de voorafgaande instemming van Onze Minister voor:

      a. het oprichten van dan wel financieel deelnemen in een rechtspersoon;

      b. het in eigendom verwerven, het vervreemden of het bezwaren van registergoederen, daaronder begrepen het aangaan
      of beëindigen van overeenkomsten daartoe, indien de prijs van het registergoed hoger is dan € 100 000 of indien de
      prijs van dat registergoed meer bedraagt dan 10 procent van de jaaromzet van de desbetreffende kamer;

      c. het aangaan en beëindigen van overeenkomsten tot huur, verhuur of pacht van registergoederen, indien de huur-
      of pachtprijs van het registergoed op jaarbasis hoger is dan € 100 000 of indien die prijs meer bedraagt dan 10
      procent van de jaaromzet van de desbetreffende kamer;

      d. het aangaan van overeenkomsten waarbij een kamer zich verbindt tot zekerheidstelling met inbegrip van
      zekerheidstelling voor schulden van derden of waarbij zij zich als borg of hoofdelijk medeschuldenaar verbindt of
      zich voor een derde sterk maakt;

      e. het doen van aangifte tot haar faillissement of het aanvragen van surséance van betaling;

      f. het beleggen van gelden;

      g. het investeren in infrastructurele voorzieningen.

      2 Onze Minister kan bepalen dat een kamer zijn voorafgaande instemming behoeft voor het vormen van andere fondsen
      en reserveringen dan de egalisatiereserve, bedoeld in [artikel 49b][ref1].

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van rechtspersonen van wie de
      meerderheid van de aandelen of de stemrechten in de algemene vergadering direct of indirect in handen is van een of
      meer kamers, of van wie de meerderheid van de bestuurders of van de commissarissen direct of indirect door een of
      meer kamers wordt benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel49b
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: 49b
        hoofdstuk: '7'
  - number: '50'
    text: |-
      De verplichting, bedoeld in [artikel 20, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], geldt
      ook ten aanzien van rechtspersonen van wie de meerderheid van de aandelen of de stemrechten in de algemene
      vergadering direct of indirect in handen is van een of meer kamers of van wie de meerderheid van de bestuurders of
      de commissarissen direct of indirect door een of meer kamers wordt benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '20'
  - number: '51'
    text: |-
      Het algemeen bestuur stelt het activiteitenplan vast en zendt dit, gelijktijdig met de begroting als bedoeld
      in [artikel 45, eerste lid][ref1], vóór 1 november van het jaar dat voorafgaat aan het kalenderjaar waarop het
      activiteitenplan betrekking heeft aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel45
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '45'
        hoofdstuk: '7'
  - number: '52'
    text: |-
      1 Het algemeen bestuur stelt het jaarverslag vast en zendt dit vóór 1 juli van het jaar dat volgt op het
      kalenderjaar waarop het jaarverslag betrekking heeft aan Onze Minister en aan beide kamers der Staten-Generaal.

      2 Het verslag wordt, tegen vergoeding van de kosten, voor een ieder verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel52
  - number: '53'
    text: |-
      1 De kamers stellen gezamenlijk een gedragscode op ter bevordering van de integriteit van het gedrag van de
      bestuurders en de werkwijze van de kamers.

      2 Het besluit tot vaststelling van de gedragscode behoeft de goedkeuring van Onze Minister.

      3 De goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel53
  - number: 54b
    text: |-
      De kamers werken samen ter bevordering van de uniforme uitvoering van de verplichting, bedoeld in
      [artikel 41, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel41
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel54b
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '41'
  - number: '63'
    text: |-
      De Wet op de Kamers van Koophandel en Fabrieken 1963 wordt ingetrokken op een bij koninklijk besluit te bepalen
      tijdstip dat voor de verschillende hoofdstukken of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel63
  - number: '64'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende hoofdstukken
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel64
  - number: '66'
    text: |-
      Deze wet wordt aangehaald als: Wet op de kamers van koophandel en fabrieken, met vermelding van het jaartal van het
      Staatsblad waarin zij zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel66
