  - number: 11a
    text: |-
      1 Een voorzitter meldt het voornemen tot het aanvaarden van een andere functie anders dan uit hoofde van zijn
      functie aan Onze Minister.

      2 Andere functies van een lid anders dan uit hoofde van zijn functie worden openbaar gemaakt. Openbaarmaking
      geschiedt door het ter inzage leggen van een opgave van deze nevenfuncties bij de betreffende kamer.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel11a
  - number: '12'
    text: |-
      1 Een kamer kan naast een algemeen bestuur een dagelijks bestuur hebben.

      2 De voorzitter van het algemeen bestuur is tevens voorzitter van het dagelijks bestuur.

      3 Buiten de voorzitter bestaat het dagelijks bestuur uit een door het algemeen bestuur uit zijn midden te benoemen
      aantal overige leden dat ten minste twee en ten hoogste zes bedraagt.

      4 De zittingsduur van het dagelijks bestuur is gelijk aan de zittingsduur van het algemeen bestuur.

      5 Het algemeen bestuur kan een of meer leden van het dagelijks bestuur schorsen of ontslaan.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel12
  - number: '13'
    text: |-
      Bij regeling van Onze Minister worden regels vastgesteld ten aanzien van de aan het lidmaatschap van het algemeen
      of dagelijks bestuur en de aan het voorzitterschap verbonden schadeloosstelling.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel13
  - number: '14'
    text: |-
      1 Het personeel van een kamer bestaat uit een directeur en het overige personeel.

      2 Bij regeling van Onze Minister kunnen nadere regels worden gesteld over de bezoldiging van het personeel.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel14
  - number: '16'
    text: Het algemeen bestuur draagt zorg voor de uitvoering van de taken van de kamer.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel16
  - number: '17'
    text: |-
      Het algemeen bestuur stelt een bestuursreglement vast. Daarin worden in elk geval regels gesteld omtrent de
      wijze waarop beslissingen van het algemeen en dagelijks bestuur worden voorbereid, genomen en uitgevoerd, wordt
      geregeld welke bevoegdheden, met uitzondering van de bevoegdheden, bedoeld in [artikel 17, eerste lid][ref1],
      [37, eerste lid][ref2], [45, eerste lid][ref3], [47, eerste lid][ref4], [51][ref5], en [52, tweede lid][ref6], het
      algemeen bestuur overdraagt aan het dagelijks bestuur en worden regels gesteld omtrent de taak en bevoegdheden van
      de directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0009276#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0009276#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0009276#Artikel51
      [ref6]: https://wetten.overheid.nl/BWBR0009276#Artikel52
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel17
