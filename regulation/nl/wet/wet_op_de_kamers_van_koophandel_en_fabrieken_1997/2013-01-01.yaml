  - number: '28'
    text: |-
      1 Voor zover daaromtrent geen andere regeling geldt heeft een kamer de bevoegdheid om desgevraagd:

      a. verklaringen ten dienste van handel, industrie, ambacht en dienstverlening af te geven;

      b. handtekeningen van personen die bij handel, industrie, ambacht en dienstverlening betrokken zijn, te
      legaliseren;

      c. een onderzoek te houden en een verklaring af te geven inzake de toelaatbaarheid van een handelsnaam.

      2 De kamers werken samen ter bevordering van de uniforme uitvoering van de in het eerste lid bedoelde taken.

      3 Bij ministeriële regeling kunnen ter implementatie van bepalingen uit bindende besluiten van de Raad van
      de Europese Unie of het Europees Parlement en de Raad gezamenlijk, die betrekking hebben op het afgeven van
      verklaringen als bedoeld in het eerste lid, onderdeel a, nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel28
  - number: '29'
    text: |-
      Een kamer kan besluiten andere dan de in dit hoofdstuk of elders bij of krachtens wet geregelde taken uit te
      oefenen, voor zover deze passen binnen de in [artikel 2, eerste lid][ref1], aangegeven doelstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel2
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009276
        artikel: '2'
        hoofdstuk: '2'
  - number: '30'
    text: |-
      1 Een kamer oefent de in [artikel 28][ref1] en [29][ref2] bedoelde werkzaamheden uit voor zover daarin niet
      in voldoende mate wordt voorzien door rechtspersonen die volgens hun statuten tot doel hebben de belangen
      van ondernemers te behartigen en draagt er zorg voor dat deze werkzaamheden niet leiden tot mededinging met
      ondernemingen of vrije beroepsbeoefenaren die uit een oogpunt van een goede marktwerking ongewenst is.

      2 Een kamer draagt er voorts zorg voor dat haar werkzaamheden niet leiden tot het verhinderen, beperken of
      vervalsen van de mededinging tussen ondernemingen of vrije beroepsbeoefenaren.

      3 Bij algemene maatregel van bestuur kunnen met het oog op het eerste en tweede lid regels worden gesteld die
      inhouden dat:

      a. bepaalde werkzaamheden door de kamers niet mogen worden verricht of

      b. de kamers zich bij bepaalde werkzaamheden dienen te gedragen overeenkomstig een in dat besluit aangegeven wijze.

      4 Het eerste, tweede en derde lid zijn van overeenkomstige toepassing ten aanzien van rechtspersonen van wie de
      meerderheid van de aandelen of de stemrechten in de algemene vergadering direct of indirect in handen is van een of
      meer kamers, of van wie de meerderheid van de bestuurders of van de commissarissen direct of indirect door een of
      meer kamers wordt benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0009276#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0009276#Artikel29
    url: https://wetten.overheid.nl/BWBR0009276/2013-01-01#Artikel30
