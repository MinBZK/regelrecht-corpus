  - number: '37'
    text: |-
      1 Een kamer stelt ter financiering van de kosten verbonden aan de uitvoering van de taken, bedoeld in de
      [artikelen 24][ref1] en [25][ref2], voor zover de uitvoering van deze taken niet plaatsvindt door de in
      [artikel 27, eerste of zevende lid][ref3], bedoelde activiteiten, een bijdrage vast welke ondernemingen voor
      ieder kalenderjaar of een gedeelte daarvan verschuldigd zijn, voor zover deze kosten niet worden gedekt door de in
      [artikel 35][ref4] bedoelde vergoedingen.

      2 Een kamer zendt Onze Minister jaarlijks vóór 1 november een afschrift van het besluit tot vaststelling van de in
      het eerste lid bedoelde bijdrage.

      3 Onze Minister beslist binnen 6 weken na het verstrijken van de in het tweede lid bedoelde termijn, of de
      goedkeuring, bedoeld in [artikel 17, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref5], wordt
      verleend.

      4 Onverminderd [artikel 17, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref6] kan de goedkeuring
      worden onthouden indien Onze Minister bezwaar heeft tegen de hoogte van het in het desbetreffende besluit
      vastgestelde bedrag.

      5 Bij regeling van Onze Minister kunnen nadere regels worden gesteld over de wijze waarop de hoogte van de in het
      eerste lid bedoelde bijdrage wordt bepaald.

      6 Een besluit als bedoeld in het eerste lid wordt bekendgemaakt door terinzagelegging daarvan ten kantore van de
      kamer en publicatie daarvan in een door Onze Minister aangewezen publicatieblad.


