preamble:
  text: |-
    Handelende na overleg met de Minister van Landbouw, Natuur en Voedselkwaliteit en de Minister voor Klimaat en
    Energie;

    Gelet op artikel 5.14, derde lid, onderdeel a, en achtste lid, van de Wet inkomstenbelasting 2001;

    BESLUITEN:
  url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *accountantsverklaring:* verklaring, afgegeven door een registeraccountant
      of een accountant-administratieconsulent;
        - *Algemene Groepsvrijstellingsverordening:* [Verordening (EU) nr. 651/2014](32014R0651) van de Commissie van
      17 juni 2014 waarbij bepaalde categorieën steun op grond van de artikelen 107 en 108 van het Verdrag met de interne
      markt verenigbaar worden verklaard (PbEU 2014, L 187);
        - *bestaand project:* a. project als bedoeld van de bijlage, met uitzondering van projecten als bedoeld
      in categorie 5.3, waarvoor ten minste zes maanden voor de dag waarop de aanvraag tot afgifte van een
      groenverklaring wordt ingediend met de uitvoering van de werkzaamheden is aangevangen; b. project als
      bedoeld in categorie 1.1 van de bijlage, voor zover het gaat om opengestelde landgoederen als bedoeld in
      [artikel 7, eerste lid, van de Natuurschoonwet 1928][ref1], dat ten minste zes maanden voor de dag waarop de
      aanvraag tot afgifte van een groenverklaring wordt ingediend reeds voldeed aan een van de projectomschrijvingen in
      het betreffende onderdeel; c. project als bedoeld in categorie 5.3 van de bijlage, waarvoor meer dan acht maanden
      voor de dag waarop de aanvraag tot afgifte van een groenverklaring wordt ingediend de hypotheekakte werd gepasseerd
      dan wel de leenovereenkomst werd gesloten;
        - *biomassa:* biomassa als bedoeld in artikel 2 van de Algemene Groepsvrijstellingsverordening;
        - *brutovloeroppervlak:* oppervlakte gemeten op vloerniveau langs de buitenomtrek van opgaande
      scheidingsconstructies die de desbetreffende ruimte of groep van ruimten omsluiten;
        - *bruto-subsidie-equivalent:* bruto-subsidie-equivalent als bedoeld in artikel 2 van de Algemene
      Groepsvrijstellingsverordening;
        - *de-minimisverordening landbouw:* [Verordening (EU) nr. 1408/2013](32013R1408) van de Commissie van 18 december
      2013 betreffende de toepassing van de artikelen 107 en 108 van het Verdrag betreffende de werking van de Europese
      Unie op de-minimissteun in de landbouwsector (PbEU 2013, L 352);
        - *duurzaam geproduceerd hout:* hout dat voldoet aan de Dutch Procurement Criteria for Timber ten aanzien van
      duurzaam bosbeheer en de handelsketen, volgens de bijbehorende beoordelingsmethode, zoals bij brief van 24 juli
      2008 is vastgesteld door de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer (Kamerstukken II
      2007/08, 30 196, nr. 35);
        - *duurzame melkveehouderij:* bedrijfsmatig houden van melkkoeien op een duurzame wijze met een integraal
      duurzaam veehouderijsysteem dat in uitvoering overeenstemt met een duurzame melkveestal die op grond van
      [artikel 3.31][ref2] of [3.42a van de Wet inkomstenbelasting 2001][ref3] door de Minister van Infrastructuur en
      Waterstaat is aangewezen als bedrijfsmiddel dat in het belang is van het Nederlandse milieu;
        - *eigenaar-bewoner:* natuurlijk persoon die een woning in eigendom heeft dan wel verkrijgt en daarin zijn
      hoofdverblijf heeft of zal hebben, dan wel de erfpachter, vruchtgebruiker of gerechtigde tot een appartementsrecht
      als bedoeld in [artikel 106 van Boek 5 van het Burgerlijk Wetboek][ref4], voor zover deze rechten betrekking hebben
      op een woning;
        - *energielabelklasse:* energielabelklasse als bedoeld in
      [artikel 2.1, achtste lid, van het Besluit energieprestatie gebouwen][ref5];
        - *EU-Richtlijn 2018/2001:* [Richtlijn (EU) 2018/2001](32018L2001) van het Europees Parlement en de Raad van
      11 december 2018 ter bevordering van het gebruik van energie uit hernieuwbare bronnen (PbEU 2018, L 328);
        - *Groen Label Kas:* tuinbouwkas die wordt gebruikt voor het bedrijfsmatig telen van tuinbouwgewassen met
      een lagere milieubelasting en die in technische uitvoering overeenstemt met een tuinbouwkas die op grond van
      [artikel 3.31][ref6] of [3.42a van de Wet inkomstenbelasting 2001][ref7] door de Minister van Infrastructuur en
      Waterstaat is aangewezen als bedrijfsmiddel dat in het belang is van het Nederlandse milieu;
        - *groenverklaring:* schriftelijk besluit van de Minister van Infrastructuur en Waterstaat als bedoeld in
      [artikel 5.14, derde lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref8], waarin wordt verklaard dat een
      project in het belang is van de bescherming van het milieu, waaronder natuur en bos;
        - *groenfonds:* een bank of beleggingsinstelling als bedoeld in
      [artikel 5.14, tweede lid, van de Wet inkomstenbelasting 2001][ref9];
        - *Landbouw Groepsvrijstellingsverordening:* [Verordening (EU) nr. 2022/2472](32472R2022) van de Commissie van
      14 december 2022 waarbij bepaalde categorieën steun in de landbouw- en de bosbouwsector en in plattelandsgebieden
      op grond van de artikelen 107 en 108 van het Verdrag betreffende de werking van de Europese Unie met de interne
      markt verenigbaar worden verklaard (PbEU 2022, L 327);
        - *landbouwsector:* landbouwsector als bedoeld in artikel 2 van de Landbouw Groepsvrijstellingsverordening;
        - *Maatlat Duurzame Veehouderij:* certificatiesysteem voor veestallen met een lagere milieubelasting, met
      maatregelen voor diergezondheid en dierenwelzijn die bijdraagt aan verduurzaming van de veehouderij en
      die in technische uitvoering overeenstemt met een veehouderij die op grond van [artikel 3.31][ref10] of
      [3.42a, tweede lid, van de Wet inkomstenbelasting 2001][ref11] door de Minister van Infrastructuur en Waterstaat is
      aangewezen als bedrijfsmiddel dat in het belang is van het Nederlandse milieu;
        - *maatschappelijk vastgoed:* huisvesting van alle dienstverlening die, geheel of gedeeltelijk, publiek wordt
      gefinancierd;
        - *natuur- en landschappelijke waarden:* natuurlijke landschappen die formeel zijn erkend als cultuur- of
      natuurerfgoed door de bevoegde overheidsinstantie;
        - *project:* in Nederland gelegen technisch, functioneel en in de tijd samenhangend geheel van activa en
      werkzaamheden;
        - *projectbeheerder:* degene voor wiens rekening en risico een project wordt ontwikkeld en in stand wordt gehouden;
        - *projectvermogen:* vermogen dat nodig is voor de financiering van vaste activa en voor de werkzaamheden om de
      vaste activa te plaatsen, voor zover noodzakelijk voor en uitsluitend dienstbaar aan de totstandbrenging van een
      project;
        - *recycling:* recycling als bedoeld in artikel 2, aanhef en onder 128 van de Algemene
      Groepsvrijstellingsverordening;
        - *utiliteitsgebouw:* gebouw waarvoor in het [Bouwbesluit 2012][ref12] een energieprestatie-eis is vastgelegd, met
      uitzondering van woningen;
        - *verbeterproject:* project gericht op een wezenlijke verandering van een bestaand project, waardoor dit project
      naar inrichting, aard of omvang een wijziging ondergaat die het project aanmerkelijk waardevoller maakt voor het
      milieu, waaronder natuur en bos;
        - *Visserij Groepsvrijstellingsverordening:* [Verordening (EU) nr. 2022/2473](32473R2022) van de Commissie
      van 14 december 2022 waarbij bepaalde categorieën steun voor ondernemingen die actief zijn in de productie, de
      verwerking en de afzet van visserij- en aquacultuurproducten op grond van de artikelen 107 en 108 van het Verdrag
      betreffende de werking van de Europese Unie met de interne markt verenigbaar worden verklaard (PbEU 2022, L 327);
        - *voedselbos:* door mensen ontworpen productief ecosysteem naar het voorbeeld van een natuurlijk bos, met een hoge
      diversiteit aan meerjarige of houtige soorten, waarvan delen voor de mens als voedsel dienen;
        - *woning:* gebouw, bedoeld voor bewoning, dat voortdurend als hoofdverblijf ter beschikking staat aan een
      of meer natuurlijke personen en per wooneenheid ten minste is voorzien van een eigen toegang, toilet, bad- of
      douchevoorziening, alsmede van een energieaansluiting, bedoeld voor een kooktoestel om een maaltijd te kunnen
      bereiden.


