  - number: '2'
    text: |-
      De Minister van Infrastructuur en Waterstaat kan, in overeenstemming met de Minister van Financiën en na
      overleg met de Minister voor Klimaat en Energie en de Minister van Landbouw, Natuur en Voedselkwaliteit, een
      groenverklaring afgeven voor projecten of categorieën van projecten, opgenomen in de bijlage bij deze regeling, in
      de categorieën:
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel2
  - number: '2.1'
    text: Natuur;
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel2
  - number: '2.2'
    text: Duurzame landbouw;
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel2
  - number: '2.3'
    text: Circulaire economie;
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel2
  - number: '2.4'
    text: Duurzame energie;
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel2
  - number: '2.5'
    text: Duurzaam bouwen;
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel2
  - number: '2.6'
    text: Duurzame mobiliteit;
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel2
  - number: '2.7'
    text: Klimaatadaptatie.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel2
  - number: '3.1'
    text: |-
      Een groenverklaring wordt aangevraagd door en afgegeven aan een groenfonds die voornemens is in belangrijke mate
      bij te dragen aan het verstrekken van kredieten ten behoeve van een project dan wel het direct of indirect beleggen
      van vermogen in bedoeld project.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel3
  - number: '3.2'
    text: |-
      Een aanvraag wordt ingediend door middel van het daartoe bestemde aanvraagformulier bij de Rijksdienst voor
      Ondernemend Nederland.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel3
  - number: '3.3'
    text: |-
      De Rijksdienst voor Ondernemend Nederland kan een aanvrager verzoeken een accountantsverklaring te over leggen,
      waaruit de juistheid of aannemelijkheid van de in de aanvraag vermelde gegevens blijkt.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel3
  - number: '4.1'
    text: |-
      De Minister van Infrastructuur en Waterstaat beslist, in overeenstemming met de Minister van Financiën en na
      overleg met de Minister voor Klimaat en Energie en de Minister van Landbouw, Natuur en Voedselkwaliteit, op een
      volledige aanvraag binnen acht weken na de indiening ervan.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel4
  - number: '4.2'
    text: Een volledige aanvraag is een aanvraag waarbij geen aanvullende informatie nodig is voor de beoordeling ervan.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel4
  - number: '4.3'
    text: De Rijksdienst voor Ondernemend Nederland verzendt een afschrift van het besluit aan de projectbeheerder.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel4
  - number: '5.1'
    text: 'Een groenverklaring wordt in ieder geval niet afgegeven op aanvragen voor:'
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel5
  - number: 5.1.a
    text: bestaande projecten;
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel5
  - number: 5.1.b
    text: projecten waarvoor reeds een groenverklaring is verstrekt;
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel5
  - number: 5.1.c
    text: |-
      projecten in de landbouwsector die niet worden uitgevoerd door een kleine, middelgrote en micro-onderneming in de
      zin van bijlage 1 van de Landbouw Groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel5
  - number: 5.1.d
    text: |-
      projecten die niet voldoen aan de vereisten die zijn gesteld in de Algemene Groepsvrijstellingsverordening dan wel
      in de Landbouw Groepsvrijstellingsverordening of de Visserij Groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel5
  - number: 5.1.e
    text: projecten waarvan het projectvermogen minder dan € 25.000 bedraagt;
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel5
  - number: 5.1.f
    text: |-
      projecten waarvoor, vanwege toekenning van een financieel of ander voordeel door de overheid of de Europese
      Commissie uit dezen en anderen hoofde dan op grond van deze regeling, een zodanig voordeel ontstaat dat dit het
      totale toegestane voordeel op grond van regelgeving van de Europese Unie zou overschrijden;
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel5
  - number: 5.1.g
    text: |-
      projecten waarvan het niet aannemelijk is dat het enig eigen rendement heeft, subsidies van overheden daaronder
      begrepen;
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel5
  - number: 5.1.h
    text: |-
      projecten waarvan het te verwachten economische rendement van het project in verhouding tot het risico zodanig is
      dat het zonder toepassing van de regeling tot stand kan komen;
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel5
  - number: 5.1.i
    text: |-
      projecten door een onderneming ten aanzien waarvan een bevel tot terugvordering uitstaat, overeenkomstig artikel
      1, vierde lid, onderdelen a en b, van de Algemene Groepsvrijstellingsverordening of artikel 1, vierde lid, van de
      Landbouw Groepsvrijstellingsverordening of artikel 1, vijfde lid, van de Visserij Groepsvrijstellingsverordening;
      of
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel5
  - number: 5.1.j
    text: |-
      projecten door een onderneming in moeilijkheden, overeenkomstig artikel 1, vierde lid, onderdeel c, van de Algemene
      Groepsvrijstellingsverordening, artikel 1, vijfde lid, van de Landbouw Groepsvrijstellingsverordening of artikel 1,
      vierde lid van de Visserij Groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel5
  - number: '5.2'
    text: |-
      Een groenverklaring wordt niet afgegeven indien de aanvrager, na daartoe een verzoek ontvangen te hebben, niet
      binnen de gestelde termijn de gegevens verstrekt die van belang kunnen zijn voor de beoordeling van het project.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel5
  - number: '6.1'
    text: 'De groenverklaring geldt ten hoogste voor de levensduur van een project, maar niet langer dan:'
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel6
  - number: 6.1.a
    text: tien jaren;
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel6
  - number: 6.1.b
    text: vijf jaren indien de groenverklaring een project betreft als bedoeld in subcategorie 2.1.2 van de bijlage.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel6
  - number: '6.2'
    text: De groenverklaring treedt maximaal negen maanden na de afgifte hiervan in werking.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel6
  - number: '6.3'
    text: |-
      De groenverklaring vermeldt de aard van het project, het projectvermogen, de datum waarop de groenverklaring in
      werking treedt en de periode waarvoor de groenverklaring geldt.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel6
  - number: '6.4'
    text: |-
      De groenverklaring voor een project als bedoeld in projectcategorie 1 van de bijlage vervalt indien binnen twee
      jaar na de dag van afgifte hiervan geen aanvang is gemaakt met de uitvoering van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel6
  - number: '6.5'
    text: In de groenverklaring kunnen nadere voorschriften worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel6
  - number: '7.1'
    text: |-
      Indien het projectvermogen het bedrag van € 75.000.000 te boven gaat, beperkt de Minister van Infrastructuur en
      Waterstaat het projectvermogen tot € 75.000.000.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel7
  - number: '7.2'
    text: |-
      Het eerste lid is niet van toepassing indien naar het oordeel van de Minister van Infrastructuur en Waterstaat een
      hoger projectvermogen toegestaan kan worden vanwege het uitzonderlijke karakter van het project.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel7
  - number: '8'
    text: |-
      De Minister van Infrastructuur en Waterstaat maakt de gegevens, bedoeld in bijlage III van de
      Algemene Groepsvrijstellingsverordening, de Landbouw Groepsvrijstellingsverordening en de Visserij
      Groepsvrijstellingsverordening, van de begunstigde openbaar in de volgende gevallen:
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel8
  - number: 8.a
    text: |-
      als met een project waarvoor een groenverklaring is verstrekt een financieel voordeel wordt behaald van meer dan
      € 100.000;
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel8
  - number: 8.b
    text: |-
      als met een project als bedoeld in projectcategorie 1 of de subcategorieën 2.1.1, voor zover het de productie
      van landbouwproducten betreft, 2.1.3, 2.1.4 of 2.1.6 van de bijlage waarvoor een groenverklaring is verstrekt een
      financieel voordeel wordt behaald van meer dan € 10.000;
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel8
  - number: 8.c
    text: |-
      als met een project als bedoeld in de subcategorie 2.4.1 waarvoor een groenverklaring is verstrekt en een
      financieel voordeel wordt behaald van meer dan € 10.000.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel8
  - number: '9.1'
    text: |-
      De Minister van Infrastructuur en Waterstaat kan, in overeenstemming met de Minister van Financiën en na overleg
      met de Minister voor Klimaat en Energie en de Minister van Landbouw, Natuur en Voedselkwaliteit, de groenverklaring
      intrekken indien:
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel9
  - number: 9.1.a
    text: |-
      de ter zake verstrekte gegevens zodanig onjuist of onvolledig blijken, dat op de aanvraag een andere beslissing zou
      zijn genomen als bij de beoordeling daarvan de juiste of volledige gegevens bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel9
  - number: 9.1.b
    text: |-
      blijkt dat de uitvoering van het project in aanzienlijke mate afwijkt van de projectbeschrijving op grond waarvan
      de groenverklaring is afgegeven;
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel9
  - number: 9.1.c
    text: blijkt dat de projectbeheerder de vermogenstoestand van het project niet afzonderlijk administreert;
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel9
  - number: 9.1.d
    text: niet wordt voldaan aan de voorschriften die in de groenverklaring zijn opgenomen; of
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel9
  - number: 9.1.e
    text: |-
      niet wordt voldaan aan [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046599#Artikel10
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0046599
        artikel: '10'
        hoofdstuk: '5'
  - number: '9.2'
    text: Het besluit tot intrekking kan terugwerkende kracht hebben.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel9
  - number: '9.3'
    text: |-
      Het besluit tot intrekking wordt gezonden aan de aanvrager. Een afschrift van het besluit wordt gezonden aan de
      projectbeheerder en aan de inspecteur van de Belastingdienst.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel9
  - number: '10'
    text: |-
      Indien de uitvoering van een project wijzigt, meldt het groenfonds dat kapitaal verschaft ten behoeve van een
      project waarvoor een groenverklaring is afgegeven dat onverwijld aan de Minister van Infrastructuur en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel10
  - number: '11'
    text: |-
      Ten behoeve van de vaststelling van een groenverklaring is, ten aanzien van het groenfonds en de projectbeheerder,
      [hoofdstuk VIII, afdeling 2, van de Algemene wet inzake rijksbelastingen][ref1] van overeenkomstige toepassing
      inzake de verstrekking van de van belang zijnde gegevens en de daaraan verbonden rechten en plichten. Hierbij
      gelden de aan de inspecteur opgelegde verplichtingen eveneens voor de door de Minister van Infrastructuur en
      Waterstaat aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Afdeling2
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002320
        afdeling: '2'
  - number: '12'
    text: |-
      Aan de in deze regeling bedoelde normen, meetvoorschriften, tests en certificaten worden gelijkgesteld normen,
      meetvoorschriften, tests en certificaten die ten minste een gelijkwaardig beschermingsniveau bieden.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel12
  - number: '13'
    text: |-
      Op projecten waarvoor tussen 1 april 2016 en 1 juni 2022 een aanvraag voor een groenverklaring is ingediend,
      blijven de bepalingen van de [Regeling groenprojecten 2016][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037778
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037778
  - number: '14'
    text: |-
      De [Regeling groenprojecten 2016][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0037778
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0037778
  - number: '15'
    text: Deze regeling treedt in werking met ingang van 1 juni 2022.
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel15
  - number: '16'
    text: 'Deze regeling wordt aangehaald als: Regeling groenprojecten 2022.'
    url: https://wetten.overheid.nl/BWBR0046599/2024-05-01#Artikel16
