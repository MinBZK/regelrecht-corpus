valid_from: '2020-01-01'
bwb_id: BWBR0011955
url: https://wetten.overheid.nl/BWBR0011955/2020-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het militaire pensioenstelsel te vereenvoudigen en
    vernieuwen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel1
  - number: 1.b
    text: |-
      beroepsmilitair: militair ambtenaar als bedoeld in [artikel 1 van de Wet ambtenaren defensie][ref1], voor zover hij
      behoort tot degenen die zijn aangesteld bij het beroepspersoneel of daarmee gelijk zijn gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: '1'
  - number: 1.c
    text: |-
      dienstplichtige: dienstplichtige in de zin van de [Kaderwet dienstplicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008589
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008589
  - number: 1.d
    text: |-
      reservist: militair ambtenaar als bedoeld in [artikel 1 van de Wet ambtenaren defensie][ref1], voor zover behorende
      tot het reserve-personeel;


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: '1'
  - number: 1.e
    text: 'fonds: Stichting Pensioenfonds ABP;'
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel1
  - number: 1.f
    text: 'bestuur: bestuur van het fonds;'
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel1
  - number: 1.g
    text: 'pensioenreglement: pensioenreglement van het fonds.'
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel1
  - number: '2.1'
    text: |-
      De aanspraken op ouderdoms- en nabestaandenpensioen en de daarmee samenhangende verplichtingen van de
      beroepsmilitair, de gewezen beroepsmilitair en hun nagelaten betrekkingen worden, met inachtneming van de bij of op
      grond van deze wet vastgestelde afwijkingen en aanvullingen, neergelegd in de overeenkomst naar burgerlijk recht,
      bedoeld in [artikel 4, eerste lid, van de Wet privatisering ABP][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel4
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '4'
  - number: '2.2'
    text: |-
      De in het eerste lid bedoelde nadere overeenkomst strekt zich mede uit tot de aanspraken op militair ouderdoms- en
      nabestaandenpensioen die voor het sluiten daarvan zijn opgebouwd.
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel2
  - number: '2.3'
    text: |-
      De door het eerste en tweede lid beheerste pensioenaanspraken worden vastgelegd in het pensioenreglement.
      Aanspraken op militair pensioen worden rechtstreeks aan dat reglement ontleend.
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel2
  - number: '2.4'
    text: Prepensioneringsaanspraken vanaf 60 jaar zullen worden neergelegd in een overeenkomst naar burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel2
  - number: '2.5'
    text: |-
      Aanvullende aanspraken op militair pensioen bij arbeidsongeschiktheid, invaliditeit of overlijden van de
      beroepsmilitair, de pensioenaanspraken voor de dienstplichtige of reservist en hun nagelaten betrekkingen, alsmede
      de grondslag voor het verstrekken van de met die invaliditeit samenhangende bijzondere leef- en werkvoorzieningen,
      worden vastgesteld bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel2
  - number: '2.6'
    text: |-
      De noodzakelijke nadere regels ter uitvoering van de in het vijfde lid bedoelde algemene maatregelen van bestuur
      worden vastgesteld door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel2
  - number: '3.1'
    text: |-
      De wetten en regelingen waaraan de militairen en hun nagelaten betrekkingen op de datum van inwerkingtreding van
      deze wet een aanspraak op pensioen kunnen ontlenen, worden met ingang van een bij koninklijk besluit te bepalen
      datum, die voor de verschillende wetten of regelingen of groepen van rechthebbenden binnen die wetten of regelingen
      een andere kan zijn en niet kan liggen voor de datum waarop in de vervangende aanspraken is voorzien, buiten
      werking gesteld of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel3
  - number: '3.2'
    text: |-
      Voor zover en zolang de aanspraken ingevolge de in het eerste lid bedoelde wetten en regelingen nog niet door de
      toepassing van dat lid zijn vervallen, ontleent een betrokkene geen aanspraken aan het pensioenreglement of de in
      [artikel 2, vijfde lid][ref1], bedoelde algemene maatregelen van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0011955#Artikel2
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011955
        artikel: '2'
  - number: '3.3'
    text: |-
      Zodra aanspraken ingevolge de in het eerste lid bedoelde wetten en regelingen door de toepassing van dat lid zijn
      vervallen, zet Onze Minister deze onmiddellijk om in aanspraken of uitzichten op grond van het pensioenreglement
      dan wel – zo nodig in aanvullende zin – op grond van de in [artikel 2, vijfde lid][ref1], bedoelde algemene
      maatregelen van bestuur. De te volgen methode van omzetting garandeert individuele gelijkwaardigheid van uitzichten
      op pensioen en, voor het totaal van de aan dezelfde dienstverhouding te ontlenen nieuwe aanspraken, nominale
      gelijkheid van de op het omzettingsmoment al ingegane pensioenen. Het omzettingsproces laat de voorgeschreven
      periodieke betaling van de pensioenen onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0011955#Artikel2
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011955
        artikel: '2'
  - number: '3.4'
    text: |-
      Waar het een omzetting naar het pensioenreglement betreft, worden in elk geval de verschillen in pensioenniveau
      in acht genomen die krachtens de in te trekken regels tussen gehuwden en ongehuwden of daarmee gelijk te
      stellen rechthebbenden konden bestaan. Andere persoonlijke omstandigheden die ingevolge die vroegere regels het
      pensioenbedrag zouden kunnen beïnvloeden werken bij een omzetting naar het pensioenreglement door naar de situatie
      op een voor alle uitzichten en rechten geldende vaste peildatum. Tenzij dat uitdrukkelijk anders wordt bepaald
      heeft een wijziging van de laatstbedoelde omstandigheden na die peildatum geen invloed op de na omzetting gevonden
      nieuwe pensioenbedragen. Onze Minister legt de te hanteren werkwijze vast in een nadere regeling.
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel3
  - number: '3.5'
    text: |-
      Van de in het derde lid bedoelde omzettingen ontvangt de belanghebbende zo spoedig mogelijk een overzicht van Onze
      Minister. Dat overzicht geeft een beeld van de oude en de nieuwe pensioensituatie op het omzettingsmoment of, voor
      zover van toepassing, op de in het vierde lid bedoelde peildatum.
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel3
  - number: '4.1'
    text: |-
      De aan de uitvoering van deze wet verbonden kosten komen ten laste van Hoofdstuk X van de Rijksbegroting, wat de in
      [artikel 2, eerste lid][ref1],bedoelde pensioenaanspraken betreft, voor zoveel mogelijk in de vorm van een premie,
      nodig voor de instandhouding van een kapitaaldekkingsstelsel, en voor het overige als rechtstreekse begrotingslast.


      [ref1]: https://wetten.overheid.nl/BWBR0011955#Artikel2
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011955
        artikel: '2'
  - number: '4.2'
    text: |-
      De uitvoering van de pensioenaanspraken voor militairen en hun nagelaten betrekkingen, bedoeld in
      [artikel 2, eerste lid][ref1], wordt ondergebracht bij het fonds. Het fonds beheert de betreffende
      pensioenaanspraken en uitzichten voor zoveel mogelijk naar de grondslagen van het voor de pensioenen voor het
      overig overheidspersoneel geldende financieringsstelsel. Onze Minister en het bestuur sluiten met het oog op die
      uitvoering en dat beheer een overeenkomst naar burgerlijk recht.


      [ref1]: https://wetten.overheid.nl/BWBR0011955#Artikel2
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011955
        artikel: '2'
  - number: '4.3'
    text: 'De overeenkomst, bedoeld in het tweede lid, omvat ten minste:'
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel4
  - number: 4.3.a
    text: |-
      een nadere verdeling van de in het eerste lid bedoelde aanspraken naar aanspraken die worden gefinancierd op
      kapitaaldekkings- of declaratiebasis;
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel4
  - number: 4.3.b
    text: |-
      de wijze waarop en de voorwaarden waaronder de pensioenlasten en uitvoeringskosten van de niet op
      kapitaaldekkingsbasis te financieren aanspraken bij Onze Minister kunnen worden gedeclareerd.
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel4
  - number: '4.4'
    text: |-
      Met het oog op het aanvullende of aanverwante karakter daarvan is Onze Minister bevoegd ook de uitvoering van het
      niet door het tweede lid bestreken deel van de militaire pensioenvoorzieningen in zijn geheel of in delen buiten
      het ministerie van Defensie onder te brengen. Met het betreffende uitvoeringsorgaan sluit Onze Minister alsdan een
      overeenkomst naar burgerlijk recht, ten minste inhoudende de wijze waarop en de voorwaarden waaronder de bedoelde
      aanvullende pensioenlasten en daarmee samenhangende extra uitvoeringskosten bij hem kunnen worden gedeclareerd.
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel4
  - number: '5'
    text: |-
      De eigen bijdrage van de beroepsmilitair aan de op deze wet steunende pensioenvoorzieningen wordt, voor zover de
      in [artikel 2, eerste lid][ref1], bedoelde overeenkomst daarin niet voorziet, vastgesteld bij algemene maatregel
      van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0011955#Artikel2
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011955
        artikel: '2'
  - number: '6.1'
    text: |-
      De [Pensioenwet][ref1] is van toepassing op de nadere overeenkomst, bedoeld in [artikel 2, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809
      [ref2]: https://wetten.overheid.nl/BWBR0011955#Artikel2
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020809
      - id: ref2
        bwb_id: BWBR0011955
        artikel: '2'
  - number: '6.2'
    text: |-
      Behoudens de [artikelen 93][ref1] en [216 van de Pensioenwet][ref2] is het eerste lid niet van toepassing op de
      pensioenvoorzieningen van:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel216
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '93'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '216'
  - number: 6.2.a
    text: |-
      de militair, voor zover die zijn bepaald door pensioengeldige tijd die voorafgaat aan de in
      [artikel 3, eerste lid][ref1], bedoelde datum, en voor zover deze op grond van deze wet en binnen het raam van de
      overeenkomst, bedoeld in [artikel 4, tweede lid][ref2], op declaratiebasis worden gefinancierd;


      [ref1]: https://wetten.overheid.nl/BWBR0011955#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011955#Artikel4
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011955
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011955
        artikel: '4'
  - number: 6.2.b
    text: |-
      de nagelaten betrekkingen van de militair, die zijn afgeleid van de aanspraak dan wel het recht op
      ouderdomspensioen voor zover dat is opgebouwd tot aan de in [artikel 3, eerste lid][ref1], bedoelde datum.


      [ref1]: https://wetten.overheid.nl/BWBR0011955#Artikel3
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011955
        artikel: '3'
  - number: '7.1'
    text: |-
      Overeenkomstig het bepaalde in [artikel 3, eerste lid][ref1], zullen, zo nodig na een voorafgaande groepsgewijze
      buiten werking stelling als daar bedoeld, worden ingetrokken:


      [ref1]: https://wetten.overheid.nl/BWBR0011955#Artikel3
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011955
        artikel: '3'
  - number: 7.1.1°
    text: Algemene militaire pensioenwet;
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel7
  - number: 7.1.2°
    text: Pensioenwet voor de landmacht 1922;
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel7
  - number: 7.1.3°
    text: Pensioenwet voor de zeemacht 1922;
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel7
  - number: 7.1.4°
    text: Pensioenwet voor het reserve-personeel der landmacht 1923;
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel7
  - number: 7.1.5°
    text: Pensioenwet voor het personeel der Koninklijke marine-reserve 1923;
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel7
  - number: 7.1.6°
    text: Bijzondere pensioenwet reserve-personeel landmacht (Sb. 1949, J 344);
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel7
  - number: 7.1.7°
    text: Pensioenwet voor de vrijwilligers bij den landstorm 1925;
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel7
  - number: 7.1.8°
    text: Wet buitengewoon pensioen 1914–1918 (Sb. 1948, I 496);
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel7
  - number: 7.1.9°
    text: |-
      Wet van 4 november 1950 tot nadere vaststelling van de regelingen op het gebied van militaire pensioenen, welke
      gedurende de vijandelijke bezetting zijn uitgevaardigd, zomede nadere wijziging van verschillende wetten, welke
      regelen geven inzake militair pensioen (Sb. 1950, K 479);
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel7
  - number: 7.1.10°
    text: Pensioenwet bijzondere groepen reserve-personeel 1956;
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel7
  - number: 7.1.11°
    text: |-
      Wet van 22 december 1938, tot regeling van de pensioenen voor officieren der Koninklijke marine-reserve, die zich –
      ter aanvulling van een bij de Koninklijke Marine bestaand tekort aan beroepsofficieren – krachtens een daartoe door
      hen gesloten vrijwillige verbintenis voor onbepaalden tijd in actieven dienst bevinden, alsmede voor hunne weduwen
      en weezen (Stb. 1938, 504).
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel7
  - number: '7.2'
    text: |-
      De [artikelen 2, tweede lid, onderdeel f][ref1], [9][ref2], [16][ref3] en
      [28 tot en met 31 van de Wet privatisering ABP][ref4] vervallen met dien verstande, dat voor het buiten werking
      stellen of intrekken van het op [artikel 28 van die wet][ref5] steunende Nabestaandenreglement militairen en het op
      artikel 31 daarvan steunende Besluit bijzondere voorzieningen militair nabestaandenpensioen dezelfde procedure zal
      gelden als voor de in het eerste lid genoemde wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0007791#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0007791#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0007791#Artikel28
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0007791
        artikel: '16'
      - id: ref4
        bwb_id: BWBR0007791
        artikel: '28'
      - id: ref5
        bwb_id: BWBR0007791
        artikel: '28'
  - number: '8'
    text: |-
      Onze Minister is bevoegd om, in overeenstemming met de meerderheid van de Centrales van Overheidspersoneel die in
      het Sectoroverleg Defensie vertegenwoordigd zijn, ter uitwerking van hetgeen in deze wet wordt bepaald een nadere
      pensioenovereenkomst te sluiten met de Pensioenkamer van de Raad voor het Overheidspersoneelsbeleid.
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel8
  - number: '9'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel9
  - number: '10'
    text: 'Deze wet wordt aangehaald als: Kaderwet militaire pensioenen.'
    url: https://wetten.overheid.nl/BWBR0011955/2020-01-01#Artikel10
