$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: zeebrievenwet
regulatory_layer: WET
publication_date: '2023-05-10'
valid_from: '2010-10-10'
bwb_id: BWBR0001933
url: https://wetten.overheid.nl/BWBR0001933/2010-10-10
preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het naar aanleiding van de wet van 22 December 1924, Staatsblad n°.
    573, noodig is de afgifte van zeebrieven en vergunningen tot het voeren van de Nederlandsche vlag opnieuw te
    regelen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: In deze wet is onder kapitein begrepen degene, die de kapitein vervangt.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel1
  - number: '2'
    text: |-
      In deze wet worden onder zeeschepen verstaan alle schepen, bedoeld in artikel 2, eerste lid, van Boek 8 van het
      Burgerlijk Wetboek, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel2
  - number: 2.a
    text: oorlogsschepen;
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel2
  - number: 2.b
    text: |-
      vaartuigen van zeilverenigingen of jachtclubs, als zodanig erkend door de met de uitvoering van deze wet belaste
      Minister;
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel2
  - number: 2.c
    text: schepen, aan het Rijk of enig openbaar lichaam toebehorende, welke tot de openbare dienst zijn bestemd;
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel2
  - number: 2.d
    text: reddingsvaartuigen;
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel2
  - number: 2.e
    text: zeevissersschepen;
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel2
  - number: '3.1'
    text: |-
      Zeeschepen zijn gerechtigd de Nederlandse vlag te voeren, indien zij voorzien zijn van een zeebrief, afgegeven
      overeenkomstig de voorschriften dezer wet.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel3
  - number: '3.2'
    text: De kapitein draagt ervoor zorg dat het schip geen andere vlag voert dan de Nederlandse.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel3
  - number: '3.3'
    text: |-
      De voorwaarde, dat het schip voorzien zij van een zeebrief, geldt niet, wanneer het wordt gebezigd tot de openbare
      dienst of, voor zover betreft een in Nederland nieuw gebouwd schip, wanneer het een proefvaart doet.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel3
  - number: '4'
    text: |-
      Zeebrieven, met uitzondering van de voorlopige zeebrieven en de buitengewone zeebrieven, bedoeld in de
      [artikelen 11][ref1] en [12][ref2], worden alleen afgegeven voor zeeschepen die te boek staan in de openbare
      registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0001933#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0001933
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: 4a
    text: |-
      Zeebrieven en voorlopige zeebrieven worden voorts afgegeven voor zeeschepen, die zijn ingeschreven in het
      rompbevrachtingsregister, genoemd in [artikel 2 van de Wet nationaliteit zeeschepen in rompbevrachting][ref1]
      (*Stb.* 1992, 541).


      [ref1]: https://wetten.overheid.nl/BWBR0005681#Artikel2
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0005681
        artikel: '2'
  - number: '5'
    text: |-
      Een zeebrief, als bedoeld in [artikel 4][ref1], vermeldt:


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel4
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '4'
  - number: 5.a
    text: |-
      de naam van het schip en die van het kantoor, waar het te boek staat in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: 5.b
    text: de inhoud, waarop het volgens de bestaande wettelijke bepalingen is gemeten;
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel5
  - number: 5.c
    text: |-
      de beschrijving van het schip bevattende ten minste de in
      [artikel 85, tweede lid, onder f, van de Kadasterwet][ref1] bedoelde gegevens, alsmede het in
      [artikel 21, eerste lid, onder c, van die wet][ref2] bedoelde brandmerk van het schip;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel21
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '85'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '21'
  - number: 5.d
    text: de naam van de natuurlijke persoon, de rechtspersoon, de rederij of de vennootschap, waaraan het schip toebehoort.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel5
  - number: 5a
    text: |-
      Een zeebrief, als bedoeld in [artikel 4a][ref1], vermeldt:


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel4a
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: 4a
  - number: 5a.a
    text: de naam van het schip;
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel5a
  - number: 5a.b
    text: de bruto en netto tonnage van het schip volgens de meetbrief;
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel5a
  - number: 5a.c
    text: |-
      de beschrijving van het schip volgens de inschrijving in het rompbevrachtingsregister, genoemd in
      [artikel 2 van de Wet nationaliteit zeeschepen in rompbevrachting][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005681#Artikel2
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0005681
        artikel: '2'
  - number: 5a.d
    text: |-
      de naam en het adres van het kantoor, waar het schip buiten Nederland in een eigenaarsregister van zeeschepen
      teboekstaat;
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel5a
  - number: 5a.e
    text: |-
      de naam en het adres van de natuurlijke persoon, de rechtspersoon, de rederij of de vennootschap, aan wie het schip
      in rompbevrachting ter beschikking is gesteld;
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel5a
  - number: 5a.f
    text: de tijdsduur waarvoor de zeebrief is afgegeven.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel5a
  - number: '6.1'
    text: |-
      Een zeebrief, als bedoeld in [artikel 4][ref1], wordt in naam van de Koning uitgereikt door de met de uitvoering
      van deze wet belaste Minister op overlegging van een door de bewaarder van het kadaster en de openbare registers
      afgegeven verklaring dat het schip te boek staat, alsmede een uittreksel uit de registratie voor schepen als
      bedoeld in [artikel 101, eerste lid, van de Kadasterwet][ref2], vermeldende tenminste de gegevens, bedoeld
      in [artikel 85, tweede lid, onder a, c, d, e, f, g en i, van die wet][ref3], alsmede de gegevens omtrent niet
      doorgehaalde voorlopige aantekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel101
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '101'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '85'
  - number: '6.2'
    text: |-
      De in het eerste lid bedoelde verklaring en het in dat lid bedoelde uittreksel gaan vergezeld van de volgens de
      bestaande wettelijke voorschriften afgegeven meetbrief. Indien die verklaring en dat uittreksel meer dan twee
      dagen vóór de dag der overlegging zijn afgegeven, moeten op die bescheiden een verklaring van de bewaarder van
      het kadaster en de openbare registers voorkomen, afgegeven binnen voornoemde termijn van twee dagen, dat sedert de
      afgifte de op die bescheiden vermelde gegevens geen wijziging hebben ondergaan.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel6
  - number: '6.3'
    text: |-
      De uitreiking van een zeebrief, als bedoeld in [artikel 4][ref1], alsmede van een voorlopige zeebrief, als bedoeld
      in [artikel 11, eerste en vierde lid][ref2], geschiedt tegen betaling van een retributie, berekend volgens een door
      de met de uitvoering van deze wet belaste Minister vast te stellen tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001933#Artikel11
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001933
        artikel: '11'
  - number: 6a.1
    text: |-
      Een zeebrief, als bedoeld in [artikel 4a][ref1], wordt in naam van de Koning uitgereikt door de met de
      uitvoering van deze wet belaste Minister tegen overlegging van een recent afschrift van de inschrijving in het
      rompbevrachtingsregister, genoemd in [artikel 2 van de Wet nationaliteit zeeschepen in rompbevrachting][ref2],
      alsmede de meetbrief. Deze zeebrief kan slechts worden afgegeven voor de tijdsduur gedurende welke het schip
      krachtens de rompbevrachtingsovereenkomst ter beschikking van de rompbevrachter is gesteld, maar in elk geval niet
      langer dan vier jaren na de dag van afgifte.


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0005681#Artikel2
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0005681
        artikel: '2'
  - number: 6a.2
    text: |-
      Indien nog geen meetbrief kan worden overgelegd, kan de met de uitvoering van deze wet belaste
      Minister voor een zeeschip, dat is ingeschreven in het rompbevrachtingsregister, genoemd in
      [artikel 2 van de Wet nationaliteit zeeschepen in rompbevrachting][ref1], een voorlopige zeebrief uitreiken.
      Deze voorlopige zeebrief is geldig voor de daarin vermelde termijn, welke de tijdsduur van zes maanden niet mag
      overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0005681#Artikel2
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0005681
        artikel: '2'
  - number: 6a.3
    text: |-
      [Artikel 6, derde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel6
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '6'
  - number: '7.1'
    text: |-
      De aanvraag voor een zeebrief als bedoeld in [artikel 4][ref1], en een voorlopige zeebrief als bedoeld
      in [artikel 11][ref2], wordt gedaan door of vanwege degene die in de registratie voor schepen, bedoeld in
      [artikel 85 van de Kadasterwet][ref3], als eigenaar van het schip staat vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001933#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001933
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '85'
  - number: '7.2'
    text: |-
      De aanvraag voor een zeebrief en een voorlopige zeebrief als bedoeld in [artikel 4a][ref1],
      wordt gedaan door of vanwege degene die in het rompbevrachtingsregister, genoemd in
      [artikel 2 van de Wet nationaliteit zeeschepen in rompbevrachting][ref2], als rompbevrachter van het schip staat
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0005681#Artikel2
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0005681
        artikel: '2'
  - number: 7a.1
    text: |-
      Bij regeling van Onze met de uitvoering van deze wet belaste Minister worden regels gesteld met betrekking tot
      de gegevens en bescheiden, benodigd voor het effectief uitoefenen van de Nederlandse rechtsmacht over dat schip,
      alsmede de plaats waar inzage in die gegevens wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel7a
  - number: 7a.2
    text: |-
      Degene die een schip beheert waarvoor een zeebrief als bedoeld in de [artikelen 4][ref1] en [4a][ref2] is
      afgegeven, draagt er zorg voor dat in Nederland te allen tijde en onverwijld inzage kan worden gegeven in de
      gegevens en bescheiden, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001933#Artikel4a
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001933
        artikel: 4a
  - number: '8.1'
    text: 'Zeebrieven vervallen:'
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel8
  - number: 8.1.a
    text: door verloop van de tijdsduur indien zij voor bepaalde tijd zijn afgegeven;
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel8
  - number: 8.1.b
    text: wanneer het schip de hoedanigheid van Nederlands schip verliest;
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel8
  - number: 8.1.c
    text: wanneer de naam of de inhoud van het schip is veranderd of dit is verbouwd;
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel8
  - number: 8.1.d
    text: |-
      wanneer het schip is vergaan, is gesloopt, blijvend ongeschikt voor drijven is geworden of door rovers of door
      vijanden is genomen;
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel8
  - number: 8.1.e
    text: |-
      wanneer van het schip gedurende zes maanden na het laatste uitvaren of de dag waartoe zich de laatst ontvangen
      berichten uitstrekken, in het geheel geen tijding is aangekomen, zonder dat dit aan een algemene storing in de
      berichtgeving kan worden geweten.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel8
  - number: '8.2'
    text: |-
      Wanneer echter de termijn, onder *a* bepaald, verstrijkt of het geval, onder *b* bedoeld, zich voordoet, terwijl
      het schip in het buitenland is, blijft, behoudens het bepaalde bij het volgende lid, de zeebrief van kracht tot
      de terugkomst van het schip in Nederland, doch niet langer dan zes maanden. Hetzelfde geldt, wanneer de inhoud van
      het schip in het buitenland is veranderd of het schip daar is verbouwd, mits deze verandering of verbouwing op de
      zeebrief is aangetekend door de naastbijzijnde Nederlandse diplomatieke of consulaire ambtenaar of de daartoe in
      Aruba, Curaçao of Sint Maarten bevoegde ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel8
  - number: '8.3'
    text: |-
      Een zeebrief, als bedoeld in [artikel 4][ref1], vervalt terstond door gehele overgang van het schip naar een
      eigenaar die niet voldoet aan de vereisten van [artikel 311 van het Wetboek van Koophandel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel311
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '311'
  - number: '8.4'
    text: 'Een zeebrief kan door Onze met de uitvoering van deze wet belaste Minister worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel8
  - number: 8.4.a
    text: indien het schip wordt gebruikt tot kaapvaart, zeeroof of slavenhandel;
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel8
  - number: 8.4.b
    text: |-
      indien het schip opzettelijk zodanig wordt gebruikt, dat het gevaar ontstaat, dat de staat in een oorlog wordt
      betrokken;
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel8
  - number: 8.4.c
    text: |-
      indien met het schip enig van regeringswege gegeven en bekend gemaakt bijzonder voorschrift tot handhaving van het
      niet deelnemen aan een oorlog opzettelijk wordt overtreden.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel8
  - number: '9.1'
    text: |-
      De vervallen of ingetrokken zeebrief wordt door de eigenaar of de rompbevrachter van het schip, of, indien hij
      onder de kapitein berust, door deze met de eerste gelegenheid ingezonden aan de autoriteit, die de zeebrief heeft
      afgegeven, behoudens de gevallen voorzien bij de [artikelen 11, derde lid][ref1], [14, laatste lid][ref2], en
      [15, laatste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0001933#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0001933#Artikel15
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0001933
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0001933
        artikel: '15'
  - number: '9.2'
    text: |-
      Wanneer het schip buitenlands is vergaan, is gesloopt, blijvend ongeschikt voor drijven is geworden dan wel is
      genomen of de hoedanigheid van Nederlands schip verliest, terwijl het schip buitenlands is, geschiedt de inzending
      van de vervallen zeebrief door tussenkomst van de naastbijzijnde Nederlandse diplomatieke of consulaire ambtenaar
      of de daartoe in Aruba, Curaçao of Sint Maarten bevoegde ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel9
  - number: '9.3'
    text: De oorzaak van het vervallen van de zeebrief wordt bij de inzending opgegeven.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel9
  - number: '9.4'
    text: |-
      Voor de ingezonden zeebrief wordt aan de eigenaar, de rompbevrachter of de kapitein desgevraagd een bewijs van
      ontvangst uitgereikt.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel9
  - number: '10.1'
    text: |-
      In de gevallen, bedoeld in [artikel 8, eerste lid, onder a en c][ref1], wordt op aanvraag van de rechthebbende een
      nieuwe zeebrief uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel8
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '8'
  - number: '10.2'
    text: |-
      Deze aanvraag, met de vervallen zeebrief in te zenden, gaat vergezeld van de in [artikel 6][ref1] dan wel
      [artikel 6a][ref2] bedoelde stukken. Indien het schip echter buitenslands verblijft, wordt de vervallen zeebrief
      opgezonden onmiddellijk na ontvangst van de nieuwe zeebrief aan boord.


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001933#Artikel6a
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001933
        artikel: 6a
  - number: '10.3'
    text: |-
      Een nieuwe zeebrief kan op bovenstaande voet mede worden uitgereikt, wanneer voldoende blijkt, dat de vroegere
      buiten schuld der belanghebbenden is verloren gegaan of niet kan worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel10
  - number: '10.4'
    text: |-
      Op aanvraag wordt, na eigendomsovergang van het schip, aan de nieuwe eigenaar een zeebrief, als bedoeld
      in [artikel 4][ref1], te zijnen name uitgereikt, mits het schip de hoedanigheid van Nederlands schip
      heeft behouden. De uitreiking geschiedt tegen inlevering van de aan de vorige eigenaar uitgereikte
      zeebrief en op overlegging van een uittreksel uit de registratie voor schepen als bedoeld in
      [artikel 101, eerste lid, van de Kadasterwet][ref2], vermeldende ten minste de gegevens, bedoeld in
      [artikel 85, tweede lid, onder a, c, d, e, f, g en i, van die wet][ref3], de gegevens omtrent niet doorgehaalde
      voorlopige aantekeningen, alsmede vermeldende de aanvrager als eigenaar. Desgevraagd kan ook worden volstaan met de
      aantekening van de eigendomsovergang op de bestaande zeebrief.


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel101
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '101'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '85'
  - number: '11.1'
    text: |-
      Bij aankoop of aanbouw van een schip in het buitenland kan door de met de uitvoering van deze wet belaste
      Minister voor het schip een voorlopige zeebrief worden uitgereikt, indien het beantwoordt aan de vereisten in
      [artikel 311 van het Wetboek van Koophandel][ref1] voor Nederlandse schepen gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel311
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '311'
  - number: '11.2'
    text: |-
      Deze zeebrief vermeldt de naam van het schip, de inhoud van het schip naar de buitenlandse meting, de soort
      en andere kenmerken van het schip en de naam van de natuurlijke persoon, de rechtspersoon, de rederij of de
      vennootschap, waaraan het schip toebehoort. De zeebrief is geldig voor de daarin uit te drukken termijn, welke
      echter de tijd van zes maanden na de eigendomsoverdracht of de oplevering niet mag overschrijden. Hij mag niet
      anders worden afgegeven dan na voldoend bewijs van eigendom.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel11
  - number: '11.3'
    text: |-
      Bij de aankomst in Nederland wordt de voorlopige zeebrief, als bedoeld in het eerste lid, door de bevoegde
      ambtenaren van de rijksbelastingdienst, bevoegd inzake douane, ingehouden.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel11
  - number: '11.4'
    text: |-
      Door de met de uitvoering van deze wet belaste Minister kan voor een schip, dat beantwoordt aan de vereisten
      in [artikel 311 van het Wetboek van Koophandel][ref1] voor Nederlandse schepen gesteld, op grond van bijzondere
      omstandigheden eveneens een voorlopige zeebrief worden uitgereikt in andere dan de in het eerste lid genoemde
      gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel311
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '311'
  - number: '11.5'
    text: |-
      Een voorlopige zeebrief, uitgereikt op grond van het vorige lid, vermeldt de naam van het schip, de inhoud van
      het schip naar de Nederlandse dan wel een buitenlandse meting, de soort en andere kenmerken van het schip en de
      naam van de natuurlijke persoon, de rechtspersoon, de rederij of de vennootschap, waaraan het schip toebehoort.
      Zodanige voorlopige zeebrief is geldig voor de daarin uitgedrukte termijn, welke de tijd van zes maanden niet mag
      overschrijden.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel11
  - number: '12.1'
    text: |-
      De met de uitvoering van deze wet belaste Minister kan, zo nodig, een buitengewone zeebrief verlenen voor een zich
      hier te lande bevindend schip, dat voor buitenlandse rekening is gebouwd, gekocht of uitgerust, opdat dit schip
      onder Nederlandse vlag rechtstreeks binnen een bepaalde termijn naar het land zijner bestemming kan worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel12
  - number: '12.2'
    text: |-
      Bij aankomst ter bestemmingsplaats wordt met deze zeebrief gehandeld volgens de laatste drie leden van
      [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel9
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '9'
  - number: '12.3'
    text: |-
      Wanneer van een op de voet van dit artikel verleende buitengewone zeebrief misbruik wordt gemaakt, of gegrond
      vermoeden bestaat, dat zodanig misbruik zal worden gemaakt, wordt die zeebrief terstond ingetrokken.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel12
  - number: '13.1'
    text: |-
      Voor schepen, waarbij overwegend Nederlandse belangen zijn betrokken en welke alleen voor rivier- of kustvaart
      buiten Nederland worden gebruikt, kunnen de door Ons aangewezen Nederlandse diplomatieke en consulaire ambtenaren
      of andere Nederlandse autoriteiten tijdelijk vergunning verlenen tot het voeren van de Nederlandse vlag voor een in
      de vergunning aangegeven gebied.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel13
  - number: '13.2'
    text: Verdere voorschriften dienaangaande worden gegeven bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel13
  - number: '14.1'
    text: |-
      Alle kapiteins van zeeschepen, zowel Nederlandse als vreemde, zijn gehouden bij het in- of uitvaren van Nederlandse
      zeehavens of zeegaten, een geldige zeebrief of een ander geldig bewijs der nationaliteit van hun schip te vertonen
      aan de betrokken ambtenaren van de rijksbelastingdienst, bevoegd inzake douane. Bij gebreke daarvan wordt door die
      ambtenaren geen expeditie verleend, en kunnen zij het schip desnoods aanhouden, totdat het vereiste document wordt
      overgelegd. Bij het binnenkomen kan echter onder de nodige voorwaarden vergunning worden verleend, om zodanig schip
      naar de bestemmingsplaats over te brengen en om dáár of elders de lading op te slaan.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel14
  - number: '14.2'
    text: |-
      Ongeldige zeebrieven, waaronder begrepen vervallen en ingetrokken zeebrieven, worden door de bevoegde ambtenaren
      van de rijksbelastingdienst, bevoegd inzake douane, ingehouden.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel14
  - number: '15.1'
    text: |-
      De kapitein van een zeeschip, voor hetwelk een zeebrief of een vergunning, als bedoeld in [artikel 13][ref1] is
      verleend, is verplicht, wanneer het schip een buitenlandse haven aanloopt alwaar een Nederlandse diplomatieke of
      consulaire ambtenaar is gevestigd, op diens verzoek de zeebrief of de vergunning te tonen, waarna de diplomatieke
      of consulaire ambtenaar de zeebrief of de vergunning aftekent.


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel13
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '13'
  - number: '15.2'
    text: |-
      Ongeldige zeebrieven of vergunningen, waaronder begrepen vervallen of ingetrokken zeebrieven en vergunningen,
      worden door de diplomatieke of consulaire ambtenaar ingehouden, tenzij een nieuwe zeebrief of vergunning is
      aangevraagd.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel15
  - number: '16'
    text: |-
      Van elk schip, waarvoor een zeebrief, als bedoeld in [artikel 4][ref1], [artikel 4a][ref2],
      [artikel 11, vierde lid][ref3], of een vergunning, als bedoeld in [artikel 13][ref4], is verleend, moet door de
      zorg van de eigenaar of de rompbevrachter de naam met duidelijke goed zichtbare letters op het achterschip zijn
      vermeld. Hetzelfde geldt voor de naam van de plaats, waar het schip thuis behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001933#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0001933#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0001933#Artikel13
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001933
        artikel: 4a
      - id: ref3
        bwb_id: BWBR0001933
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0001933
        artikel: '13'
  - number: '17.1'
    text: De met de uitvoering van deze wet belaste Minister is bevoegd, uitsluitend op grond van bijzondere omstandigheden,
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel17
  - number: 17.1.a
    text: |-
      afwijking toe te staan van het bepaalde bij [artikel 6, tweede lid][ref1], en [artikel 6][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001933#Artikel6a
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001933
        artikel: 6a
  - number: 17.1.b
    text: |-
      de geldigheid van een zeebrief te doen voortduren ook na het in [artikel 8, tweede lid][ref1], bedoelde tijdstip,
      en wel gedurende een bepaalde tijd of tot het doen van een bepaalde reis;


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel8
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '8'
  - number: 17.1.c
    text: de geldigheidsduur van een voorlopige zeebrief en van een buitengewone zeebrief te verlengen.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel17
  - number: '17.2'
    text: |-
      Verlenging, als onder *b* bedoeld, alsmede de onder *c* bedoelde verlenging van een buitengewone zeebrief, kan
      slechts éénmaal plaats vinden.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel17
  - number: '18.1'
    text: |-
      Niet nakoming van het bepaalde bij deze wet betreffende het inzenden van vervallen en ingetrokken zeebrieven wordt
      gestraft met geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel18
  - number: '18.2'
    text: |-
      Niet nakoming van het bepaalde bij [artikel 15, eerste lid][ref1], of van het bepaalde bij [artikel 16][ref2],
      wordt gestraft met geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0001933#Artikel16
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0001933
        artikel: '16'
  - number: '18.3'
    text: |-
      Niet nakoming van hetgeen betreffende het inzenden van vervallen vergunningen tot het voeren van de Nederlandse
      vlag wordt bepaald bij de algemene maatregel van bestuur in [artikel 13][ref1], wordt gestraft met geldboete van de
      tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel13
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '13'
  - number: '18.4'
    text: |-
      De strafbepalingen zijn toepasselijk op ieder, die zich hetzij binnen hetzij buiten Nederland schuldig maakt aan
      het strafbaar gestelde feit.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel18
  - number: '18.5'
    text: De strafbaar gestelde feiten worden beschouwd als overtredingen.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel18
  - number: '19'
    text: |-
      Door de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane, en de diplomatieke en consulaire ambtenaren
      wordt proces-verbaal opgemaakt wegens alle overtredingen dezer wet, die te hunner kennis komen. De aldus opgemaakte
      processen-verbaal gelden als wettig bewijsmiddel der daarin geconstateerde overtredingen, mits zij voldoen aan de
      voorschriften van [artikel 153 van het Wetboek van Strafvordering][ref1], met dien verstande, dat, ingeval zij zijn
      opgemaakt door een diplomatieke of consulaire ambtenaar, zij bevestigd kunnen worden door zijn daarin opgenomen
      schriftelijke eed (belofte).


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel153
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '153'
  - number: '20.1'
    text: |-
      Zeebrieven, verleend en alsnog geldig bij de inwerkingtreding dezer wet, blijven van kracht voor zover en voor
      zolang zij niet vervallen ingevolge de desbetreffende voorschriften dezer wet.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel20
  - number: '20.2'
    text: |-
      Ten aanzien van vergunningen tot het voeren van de Nederlandse vlag blijven de bepalingen der wet van 28 mei 1869,
      *Staatsblad* no. 96, zoals die laatstelijk is gewijzigd, van toepassing zolang de in [artikel 13][ref1] bedoelde
      algemene maatregel van bestuur nog niet is in werking getreden. Deze algemene maatregel van bestuur moet bevatten
      een overgangsbepaling voor de vergunningen, welke zullen zijn verleend vóór zijn inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel13
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '13'
  - number: '20.3'
    text: |-
      Behoudens het bepaalde bij de vorige leden, wordt de wet van 28 mei 1869, *Staatsblad* no. 96, zoals die
      laatstelijk is gewijzigd, ingetrokken.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel20
  - number: '21.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de bij besluit van Onze met
      de uitvoering van deze wet belaste Minister aangewezen ambtenaren van de Inspectie Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel21
  - number: '21.2'
    text: |-
      Onze met de uitvoering van deze wet belaste Minister kan voor bepaalde door hem aan te wijzen taken, verband
      houdende met het toezicht op de naleving van het bij of krachtens deze wet bepaalde, ambtenaren ressorterende onder
      een ander ministerie aanwijzen. Het desbetreffende besluit wordt genomen in overeenstemming met Onze Minister wie
      het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel21
  - number: '21.3'
    text: Van een besluit als bedoeld in het eerste of tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel21
  - number: '23.1'
    text: Deze wet kan worden aangehaald onder de titel "Zeebrievenwet".
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel23
  - number: '23.2'
    text: Zij treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0001933/2010-10-10#Artikel23
