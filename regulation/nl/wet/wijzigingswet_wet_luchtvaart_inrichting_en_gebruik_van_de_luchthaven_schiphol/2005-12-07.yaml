$id: wijzigingswet_wet_luchtvaart_inrichting_en_gebruik_van_de_luchthaven_schiphol
regulatory_layer: WET
publication_date: '2005-10-11'
valid_from: '2005-12-07'
bwb_id: BWBR0013815
url: https://wetten.overheid.nl/BWBR0013815/2005-12-07
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen met het oog op het optimaal gebruik
    van de nationale luchthaven Schiphol als kwalitatief hoogwaardig knooppunt van nationaal en internationaal
    luchtverkeer, met inachtneming van de grenzen die met het oog op de veiligheid en het milieu noodzakelijk zijn,
    teneinde een duurzame balans te bewaren tussen het gebruik van de luchthaven en de kwaliteit van het leefmilieu,
    alsmede dat deze grenzen zodanig gesteld moeten worden dat er sprake is van een gelijkwaardige overgang van het
    huidige naar het nieuwe stelsel;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelAanhef
articles:
  - number: VI (Vervallen van PKB Schiphol en omgeving)
    text: |-
      Op het tijdstip waarop het eerste luchthavenindelingbesluit en het eerste luchthavenverkeerbesluit in werking
      treden vervalt de Planologische Kernbeslissing Schiphol en Omgeving.
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelVI_Vervallen_van_PKB_Schiphol_en_omgeving
  - number: VII
    text: |-
      Op het tijdstip waarop het eerste luchthavenindelingbesluit en het eerste luchthavenverkeerbesluit in werking
      treden vervalt de in [hoofdstuk IV van de Luchtvaartwet][ref1] bedoelde aanwijzing van het luchtvaartterrein
      Schiphol.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelVII
    references:
      - id: ref1
        bwb_id: BWBR0002267
        hoofdstuk: IV
  - number: VIII.1
    text: |-
      Bij de voorbereiding van het eerste luchthavenindelingbesluit en het eerste luchthavenverkeerbesluit wordt een
      milieueffectrapport gemaakt. De [paragrafen 7.5 tot en met 7.7 van de Wet milieubeheer][ref1] zijn op dit rapport
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Paragraaf7.5
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelVIII
    references:
      - id: ref1
        bwb_id: BWBR0003245
        paragraaf: '7.5'
  - number: VIII.2
    text: Het rapport wordt gemaakt door Onze Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelVIII
  - number: VIII.3
    text: |-
      Het rapport is gericht op een vergelijking van het beschermingsniveau, zoals dat wordt geboden bij de
      inwerkingtreding van de in het eerste lid bedoelde besluiten, met het beschermingsniveau zoals dat voor de
      inwerkingtreding van artikel VI ten aanzien van het vijfbanenstelsel is beschreven in de PKB Schiphol en Omgeving.
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelVIII
  - number: VIII.4
    text: |-
      Het rapport bevat in ieder geval de informatie, bedoeld in artikel 5, derde lid, van de [Richtlijn 85/337/EEG]
      (31985L0337) van de Raad van de Europese Gemeenschappen van 27 juni 1985 betreffende de milieu-effectbeoordeling
      van bepaalde openbare en particuliere projecten (PbEG L 175), zoals deze is gewijzigd bij [richtlijn 97/11/EG]
      (31997L0011) van de Raad van de Europese Unie van 3 maart 1997 (PbEG L 397).
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelVIII
  - number: IX
    text: |-
      Vanwege het streven naar een duurzame ontwikkeling moet verbetering plaatsvinden van de kwaliteit van het
      leefmilieu. Daartoe mag in de omgeving van Schiphol de situatie vanaf 2003 ten opzichte van 1990 niet verslechteren
      voor de parameters externe veiligheid en lokale luchtverontreiniging en moet de situatie verbeteren voor
      luchtvaartgeluid, zoals vastgesteld in de Planologische Kernbeslissing Schiphol en Omgeving en op de wijze zoals
      voorzien in de [artikelen X][ref1] tot en met [XIII][ref2]. Binnen het kader van deze milieugrenzen krijgt Schiphol
      de ruimte zich optimaal te ontwikkelen.


      [ref1]: https://wetten.overheid.nl/BWBR0013815#ArtikelX
      [ref2]: https://wetten.overheid.nl/BWBR0013815#ArtikelXIII
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0013815
        artikel: X
      - id: ref2
        bwb_id: BWBR0013815
        artikel: XIII
  - number: X
    text: |-
      Bij de vaststelling in het eerste luchthavenindelingbesluit van de regels voor het beperkingengebied worden bij de
      regels, bedoeld in [artikel 8.7, tweede lid, onderdelen a en b, van de Wet luchtvaart](onbekend), in ieder geval de
      gronden aangewezen die in de PKB Schiphol en Omgeving als vrijwaringszone zijn aangeduid, behoudens voor zover die
      gronden in de PKB tevens als rijksbufferzone zijn aangeduid en voor die gronden geen beperkingen noodzakelijk zijn
      met het oog op de veiligheid en de geluidbelasting in verband met de nabijheid van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelX
  - number: XI.1
    text: |-
      Ten behoeve van de vaststelling van het eerste luchthavenindelingbesluit en het eerste luchthavenverkeerbesluit met
      betrekking tot de externe veiligheid worden de volgende berekeningen gemaakt:
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXI
  - number: XI.1.a
    text: voor het individueel risico worden de 10-6 contouren berekend;
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXI
  - number: XI.1.b
    text: |-
      deze contouren omvatten tezamen niet meer woningen dan de overeenkomstige 10-6 contouren voor individueel risico,
      berekend op basis van de gegevens over 1990;
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXI
  - number: XI.1.c
    text: |-
      aan de hand van de gegevens die gebruikt zijn voor de onder a bedoelde berekening, worden de 10-5 contouren voor
      het individueel risico bepaald.
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXI
  - number: XI.2
    text: |-
      De in het eerste lid bedoelde berekeningen worden uitgevoerd aan de hand van het rekenmodel zoals dat is vastgelegd
      in het rapport van het Nationaal Lucht- en Ruimtevaartlaboratorium NLR CR 93372 L, nadien gewijzigd bij rapport
      NLR-CR-2000–147.
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXI
  - number: XI.3
    text: |-
      Bij de vaststelling van het eerste luchthavenindelingbesluit worden de gronden, bedoeld in
      [artikel 8.7, derde lid, van de Wet luchtvaart][ref1], zodanig bepaald dat zij in ieder geval de gronden gelegen
      binnen de in het eerste lid, onder c, bedoelde contouren omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXI
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
  - number: XI.4
    text: |-
      Bij de vaststelling van het eerste luchthavenverkeerbesluit worden de grenswaarden voor het externe-
      veiligheidsrisico afgestemd op de in het eerste lid, onder c, bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXI
  - number: XI.5
    text: |-
      Onze Minister van Verkeer en Waterstaat en Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      ontwikkelen zo spoedig als redelijkerwijs mogelijk een causaal model dat is gericht op interne veiligheid van het
      luchthavenluchtverkeer. Met de voor externe veiligheid relevante uitkomsten van het model wordt rekening gehouden
      in het [Luchthavenverkeerbesluit Schiphol][ref1] en het [Luchthavenindelingbesluit Schiphol][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014330
      [ref2]: https://wetten.overheid.nl/BWBR0014329
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXI
    references:
      - id: ref1
        bwb_id: BWBR0014330
      - id: ref2
        bwb_id: BWBR0014329
  - number: XII.1
    text: |-
      Bij de vaststelling in het eerste luchthavenverkeerbesluit van de grenswaarden voor de geluidbelasting wordt voor
      wat betreft de belasting gedurende het gehele etmaal in de in [artikel 8.17, vijfde lid, onderdeel b, van de Wet
      luchtvaart](onbekend) bedoelde punten, gebruik gemaakt van de L als geluidbelastingindicator. Daarbij worden de
      volgende regels gehanteerd in verband met de overgang van Ke naar L:
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXII
  - number: XII.1.a
    text: |-
      op een wijze die overeenstemt met de voorschriften zoals die gelden tot de inwerkingtreding van [artikel II][ref1]
      worden een 20 Ke-contour en een 35 Ke-contour berekend;


      [ref1]: https://wetten.overheid.nl/BWBR0013815#ArtikelII
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0013815
        artikel: II
  - number: XII.1.b
    text: |-
      het aantal ernstig gehinderden binnen de 20 Ke-contour bedraagt maximaal 45 000, vastgesteld overeenkomstig de
      wijze waarop dit aantal in de PKB Schiphol en Omgeving is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXII
  - number: XII.1.c
    text: |-
      de 35 Ke-contour omvat maximaal 10 000 woningen, vastgesteld overeenkomstig de wijze waarop dit aantal in de PKB
      Schiphol en Omgeving is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXII
  - number: XII.1.d
    text: |-
      de ligging van deze contour vormt het uitgangspunt voor de bepaling van de ligging van de punten waarop de
      grenswaarden van toepassing zijn;
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXII
  - number: XII.1.e
    text: |-
      aan de hand van de gegevens die gebruikt zijn voor de berekening van deze contour, wordt voor deze punten een
      berekening gemaakt van de geluidbelasting met de L als geluidbelastingindicator;
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXII
  - number: XII.1.f
    text: |-
      de aldus gevonden geluidbelastingen in deze punten vormen de grondslag voor de bepaling van de hoogte van de
      grenswaarden in de punten.
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXII
  - number: XII.2
    text: |-
      Bij de vaststelling in het eerste luchthavenverkeerbesluit van de grenswaarden voor de geluidbelasting wordt voor
      wat betreft de belasting gedurende de nacht in de in [artikel 8.17, vijfde lid, onderdeel b, van de Wet luchtvaart]
      (onbekend) bedoelde punten, gebruik gemaakt van de L als geluidbelastingindicator. Daarbij worden de volgende
      regels gehanteerd in verband met de overgang van L naar L:
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXII
  - number: XII.2.a
    text: |-
      op een wijze die overeenstemt met de voorschriften zoals die gelden tot de inwerkingtreding van [artikel II][ref1]
      worden een 20 dB(A) L-contour en een 26 dB(A) L-contour berekend;


      [ref1]: https://wetten.overheid.nl/BWBR0013815#ArtikelII
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0013815
        artikel: II
  - number: XII.2.b
    text: |-
      het aantal mensen dat slaapverstoring ondervindt binnen de 20 dB(A) L-contour bedraagt maximaal 39 000, vastgesteld
      overeenkomstig de wijze waarop dit aantal in de PKB Schiphol en Omgeving is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXII
  - number: XII.2.c
    text: |-
      de 26 dB(A) L-contour omvat maximaal 10 100 woningen, vastgesteld overeenkomstig de wijze waarop dit aantal in de
      PKB Schiphol en Omgeving is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXII
  - number: XII.2.d
    text: |-
      de ligging van deze contour vormt het uitgangspunt voor de bepaling van de ligging van de punten waarop de
      grenswaarden van toepassing zijn;
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXII
  - number: XII.2.e
    text: |-
      aan de hand van de gegevens die gebruikt zijn voor de berekening van deze contour, wordt voor deze punten een
      berekening gemaakt van de geluidbelasting met de L als geluidbelastingindicator;
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXII
  - number: XII.2.f
    text: |-
      de aldus gevonden geluidbelastingen in deze punten vormen de grondslag voor de bepaling van de hoogte van de
      grenswaarden in de punten.
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXII
  - number: XII.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de bepaling van een grenswaarde voor het totale
      volume van de geluidbelasting, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXII
  - number: XII.3.a
    text: |-
      bij de vaststelling in onderdeel c van die leden geen toeslag voor wisselende meteorologische omstandigheden wordt
      gehanteerd;
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXII
  - number: XII.3.b
    text: |-
      ten aanzien van de verzameling van punten, bedoeld in onderdeel d van die leden, slechts één grenswaarde wordt
      vastgesteld;
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXII
  - number: XII.3.c
    text: |-
      de ligging van deze punten mede bepaald kan worden door een herschikking met het oog op een vaststelling van een
      grenswaarde die onafhankelijk is van de verdeling van de geluidbelasting over de omgeving.
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXII
  - number: XIII.1
    text: |-
      Bij de vaststelling van het eerste luchthavenverkeerbesluit worden de grenswaarden voor de emissie van stoffen die
      lokale luchtverontreiniging veroorzaken zodanig bepaald dat de prognoses van dat moment ten aanzien van de emissies
      ten gevolge van luchtvaart, wegverkeer, industrie, land- en tuinbouw en ruimteverwarming in het studiegebied de
      volgende waarden niet overschrijden.






                    Stof


                    Maximum emissie per jaar






                    CO


                    45 701 ton




                    NO


                    19 771 ton




                    VOS


                    21 173 ton




                    SO


                    1 274 ton




                    PM10


                    1 208 ton
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXIII
  - number: XIII.2
    text: |-
      De emissies worden berekend overeenkomstig de methode zoals die is vastgelegd in de TNO-rapporten R 2000/100 en
      R 2000/496.
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXIII
  - number: XIV
    text: |-
      Na de inwerkingtreding van dit artikel berust de Regeling geluidwerende voorzieningen 1997 voor wat betreft de
      toepassing ten aanzien van de luchthaven Schiphol op [artikel 8.32 van de Wet luchtvaart](onbekend).
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXIV
  - number: XV
    text: |-
      Onze Minister van Verkeer en Waterstaat zendt voor 1 januari 2008 aan de Staten-Generaal een verslag over de
      doeltreffendheid van de handhaving van [titel 8.3 van de Wet luchtvaart](onbekend) door de Inspectie Verkeer en
      Waterstaat.
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXV
  - number: XVI.1
    text: |-
      Onze Minister van Verkeer en Waterstaat zendt uiterlijk drie jaar na de inwerkingtreding van deze wet,
      in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten in de praktijk van de krachtens de
      [artikelen 8.4][ref1] en [8.15 van de Wet luchtvaart][ref2] vastgestelde besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXVI
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
  - number: XVI.2
    text: |-
      In het verslag wordt in ieder geval aangegeven op welke wijze het groepsrisico voor mensen op de grond kan worden
      bepaald en beheerst door middel van instrumenten die zijn gericht op het gebruik van de luchthaven in combinatie
      met de ruimtelijke ordening in de omgeving van de luchthaven. Onze Minister van Verkeer en Waterstaat en Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer voeren daartoe een ex ante evaluatie ten
      aanzien van het groepsrisicobeleid uit.
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXVI
  - number: XVI.3
    text: |-
      Het verslag gaat vergezeld van een milieueffectrapport. Op dit rapport zijn de [artikelen 7.20, eerste lid][ref1],
      en [7.26, eerste lid, van de Wet milieubeheer][ref2] van overeenkomstige toepassing. In afwijking van
      [artikel 7.26, eerste lid, van de Wet milieubeheer][ref3] wordt de commissie tot uiterlijk vijf weken na ontvangst
      van het milieueffectrapport in de gelegenheid gesteld om advies uit te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXVI
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
  - number: XVI.4
    text: |-
      Het millieueffectrapport is gericht op een vergelijking van het beschermingsniveau zoals dat wordt geboden door
      de krachtens de [artikelen 8.4][ref1] en [8.15 van de Wet luchtvaart][ref2] vastgestelde besluiten, met het
      beschermingsniveau zoals dat voor de inwerkingtreding van [artikel VI][ref3] ten aanzien van het vijfbanenstelsel
      is beschreven in de PKB Schiphol en Omgeving. [Artikel IX][ref4] wordt hierbij in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0013815#ArtikelVI_
      [ref4]: https://wetten.overheid.nl/BWBR0013815#ArtikelIX
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXVI
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0013815
        artikel: VI_
      - id: ref4
        bwb_id: BWBR0013815
        artikel: IX
  - number: XVI.5
    text: |-
      Voor zover uit het rapport blijkt dat niet aan de [artikelen X tot en met XIII][ref1] is voldaan, bevordert
      Onze Minister van Verkeer en Waterstaat, in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer, dat zulks alsnog geschiedt door wijziging van de in de [artikelen 8.4][ref2] en
      [8.15 van de Wet luchtvaart][ref3] bedoelde besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0013815#ArtikelX
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXVI
    references:
      - id: ref1
        bwb_id: BWBR0013815
        artikel: X
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '8'
  - number: XVII
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013815/2005-12-07#ArtikelXVII
