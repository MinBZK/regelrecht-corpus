preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet op de arbeidsongeschiktheidsverzekering te
    wijzigen zodat op grond van de Wet op de arbeidsongeschiktheidsverzekering te heffen premies gedifferentieerd
    worden en werkgevers de mogelijkheid krijgen het risico van de arbeidsongeschiktheidsverzekering van hun werknemers
    bepaalde tijd zelf te dragen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008655/1998-01-01#ArtikelAanhef
