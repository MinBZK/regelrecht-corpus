  - number: VII.1
    text: |-
      Onder uitkeringen als bedoeld in artikel 75b en in [artikel 76f van de Wet op de arbeidsongeschiktheidsverzekering]
      (onbekend), worden uitsluitend verstaan, de uitkeringen die zijn ingegaan op of na de dag van inwerkingtreding van
      deze wet.
    url: https://wetten.overheid.nl/BWBR0008655/1998-01-01#ArtikelVII
  - number: VII.2
    text: |-
      Onder overgang van een onderneming als bedoeld in [artikel 78, vierde lid, van de Wet op de
      arbeidsongeschiktheidsverzekering](onbekend) wordt uitsluitend verstaan, de overgang van een onderneming die heeft
      plaatsgevonden op of na de dag van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0008655/1998-01-01#ArtikelVII
  - number: VIII
    text: Deze wet wordt aangehaald als «Wet premiedifferentiatie en marktwerking bij arbeidsongeschiktheidsverzekeringen».
    url: https://wetten.overheid.nl/BWBR0008655/1998-01-01#ArtikelVIII
  - number: IX.1
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008655/1998-01-01#ArtikelIX
  - number: IX.2
    text: |-
      In afwijking van het eerste lid treden van [Artikel I, onderdeel][ref1] FF, de artikelen 87 en 87 in werking met
      ingang van 1 januari 1997. Indien het Staatsblad waarin deze wet wordt geplaatst, dan wel het *Staatsblad* waarin
      de [Invoeringswet nieuwe en gewijzigde arbeidsongeschiktheidsregelingen][ref2] wordt geplaatst, wordt uitgegeven
      na 31 december 1996, treden de in de eerste zin genoemde artikelen in werking met ingang van de eerste dag van
      de kalendermaand na zowel de datum van uitgifte van *Staatsblad* waarin deze wet wordt geplaatst als de datum van
      uitgifte van het *Staatsblad* waarin de [Invoeringswet nieuwe en gewijzigde arbeidsongeschiktheidsregelingen][ref3]
      wordt geplaatst.


