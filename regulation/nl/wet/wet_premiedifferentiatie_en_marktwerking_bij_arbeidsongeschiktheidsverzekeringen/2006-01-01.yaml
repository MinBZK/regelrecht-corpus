preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet op de arbeidsongeschiktheidsverzekering te
    wijzigen zodat op grond van de Wet op de arbeidsongeschiktheidsverzekering te heffen premies gedifferentieerd
    worden en werkgevers de mogelijkheid krijgen het risico van de arbeidsongeschiktheidsverzekering van hun werknemers
    bepaalde tijd zelf te dragen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008655/2006-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 Onder de uitkeringen, bedoeld in
      [artikel 76d, eerste lid, onderdeel a, van de Wet op de arbeidsongeschiktheidsverzekering][ref1], worden mede
      verstaan:

      a. de op grond van
      __REF000___________________________________________________________________________________________________________
      ____ toegekende uitkeringen;

      b. de op grond van
      [artikel 13, tweede lid, tweede volzin, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref3] bij
      wijze van voorschot toegekende uitkeringen;

      c. de op grond van [artikel 23, eerste lid, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref4]
      toegekende uitkeringen.

      2 Onder de uitvoeringskosten, bedoeld in
      [artikel 76d, eerste lid, onderdeel b, van de Wet op de arbeidsongeschiktheidsverzekering][ref5], worden mede
      verstaan de kosten die zijn verbonden aan de uitvoering van de [artikelen 13][ref6], eerste en tweede lid, en
      [23, eerste lid, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref7].

      3 Onder de loonsuppletie, bedoeld in
      [artikel 76d, eerste lid, onderdeel c, van de Wet op de arbeidsongeschiktheidsverzekering][ref8], wordt mede
      verstaan de in [artikel 20, tweede lid, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref9] of
      artikel 28, tweede lid, van die wet bedoelde loonsuppletie.

      4 Onder de loonkostensubsidie, bedoeld in
      [artikel 76d, eerste lid, onderdeel d, van de Wet op de arbeidsongeschiktheidsverzekering][ref10], wordt mede
      verstaan de in [artikel 20, tweede lid, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref11] of
      artikel 28, tweede lid, van die wet bedoelde loonkostensubsidie.

      5 Onder de kosten van opleiding of scholing, bedoeld in
      [artikel 76d, eerste lid, onderdeel e, van de Wet op de arbeidsongeschiktheidsverzekering][ref12],
      worden mede verstaan de kosten van een opleiding of scholing als bedoeld in
      [artikel 20, tweede lid, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref13] of artikel 28,
      tweede lid, van die wet.

      6 Onder de voorzieningen, bedoeld in
      [artikel 76d, eerste lid, onderdeel f, van de Wet op de arbeidsongeschiktheidsverzekering][ref14], worden mede
      verstaan de in [artikel 20, tweede lid, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref15] of
      artikel 28, tweede lid, van die wet bedoelde voorzieningen.

      7 Onder de vergoedingen, bedoeld in
      [artikel 76d, eerste lid, onderdeel g, van de Wet op de arbeidsongeschiktheidsverzekering][ref16], worden mede
      verstaan de in [artikel 20, tweede lid, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref17] of
      artikel 28, tweede lid, van die wet bedoelde vergoedingen.

      8 Onder de toelagen en vergoedingen, bedoeld in
      [artikel 76d, eerste lid, onderdeel h, van de Wet op de arbeidsongeschiktheidsverzekering][ref18], worden mede
      verstaan de in [artikel 20, tweede lid, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref19] of
      artikel 28, tweede lid, van die wet bedoelde toelagen en vergoedingen.


