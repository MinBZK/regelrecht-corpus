  - number: VII
    text: |-
      1 Onder uitkeringen als bedoeld in [artikel 75b][ref1] en in
      [artikel 76f van de Wet op de arbeidsongeschiktheidsverzekering][ref2], zoals deze artikelen luidden
      op de dag voorafgaande aan het tijdstip van inwerkingtreding van de desbetreffende bepalingen van de
      [Invoeringswet Wet financiering sociale verzekeringen][ref3], worden uitsluitend verstaan, de uitkeringen die zijn
      ingegaan op of na de dag van inwerkingtreding van deze wet.

      2 Onder overgang van een onderneming als bedoeld in
      [artikel 78, vierde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref4], zoals dit artikel
      luidde op de dag voorafgaande aan het tijdstip van inwerkingtreding van de desbetreffende bepalingen van de
      [Invoeringswet Wet financiering sociale verzekeringen][ref5], wordt uitsluitend verstaan, de overgang van een
      onderneming die heeft plaatsgevonden op of na de dag van inwerkingtreding van deze wet.


