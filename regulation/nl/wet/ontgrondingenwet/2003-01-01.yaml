---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: ontgrondingenwet
regulatory_layer: WET
publication_date: '2002-11-14'
valid_from: '2003-01-01'
bwb_id: BWBR0002505
url: https://wetten.overheid.nl/BWBR0002505/2003-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is wettelijke regelen te stellen teneinde een
    doelmatige afweging van de verschillende bij ontgrondingen betrokken belangen te verzekeren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel1
  - number: 1.a
    text: 'zee: de Noordzee en de Waddenzee;'
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel1
  - number: 1.b
    text: |-
      planologische medewerking verlenen: het nemen van een of meer besluiten krachtens de
      [Wet op de Ruimtelijke Ordening][ref1] door het bestuur van een gemeente of van de provincie waarin die gemeente
      is gelegen, waardoor een ontgronding kan plaatsvinden zonder strijd met het bepaalde bij of krachtens de
      [Wet op de Ruimtelijke Ordening][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002375
      [ref2]: https://wetten.overheid.nl/BWBR0002375
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002375
      - id: ref2
        bwb_id: BWBR0002375
  - number: 1.c
    text: 'winplaats: een plaats die is bestemd voor de winning van vaste stoffen door middel van ontgronding;'
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel1
  - number: 1.d
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat.'
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel1
  - number: '2'
    text: |-
      Een ontgronding wordt geacht in de zee plaats te hebben, indien zij plaats heeft daar, waar de bodem bij gewone
      vloed of gewoon zomerpeil door het water van de zee wordt bedekt.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het is verboden, behoudens het bepaalde in de [artikelen 12][ref1] en [31][ref2], zonder vergunning te ontgronden
      dan wel als eigenaar, erfpachter, vruchtgebruiker, opstalhouder, beklemde meier of gebruiker van enige onroerende
      zaak toe te laten, dat aldaar zonder vergunning ontgronding plaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel31
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '12'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002505
        artikel: '31'
        hoofdstuk: VI
  - number: '3.2'
    text: |-
      Met inachtneming van de krachtens [artikel 5][ref1] gestelde nadere regelen kunnen aan een vergunning voorschriften
      worden verbonden ter bescherming van alle bij een ontgronding betrokken belangen alsmede ter bevordering en
      bescherming van belangen, betrokken bij de herinrichting van de ontgronde onroerende zaken en de aanpassing van de
      omgeving van de ontgronde onroerende zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel5
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '5'
        hoofdstuk: I
  - number: '3.3'
    text: 'De in het tweede lid bedoelde voorschriften kunnen in ieder geval inhouden:'
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel3
  - number: 3.3.a
    text: |-
      dat een werkplan wordt overgelegd, volgens hetwelk de ontgronding zal geschieden, en dat het toestemming behoeft
      van een bij het voorschrift aangewezen bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel3
  - number: 3.3.b
    text: |-
      dat de onroerende zaken waarvoor een vergunning tot ontgronding wordt verleend, geheel of bij gedeelten in een bij
      het voorschrift omschreven toestand dienen te worden gebracht;
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel3
  - number: 3.3.c
    text: |-
      dat in plaats van de onder *b* bedoelde verplichting een bepaald bedrag ineens of bij gedeelten moet worden
      betaald;
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel3
  - number: 3.3.d
    text: |-
      dat de kosten van het beheer van de onroerende zaken die zijn ontgrond geheel of gedeeltelijk moeten worden
      betaald;
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel3
  - number: 3.3.e
    text: |-
      dat de kosten in verband met de aanpassingsinrichting van de omgeving van de ontgronde onroerende zaken,
      alsmede van het beheer van de aangepaste omgeving, voor zover zij het gevolg zijn van de ontgronding, geheel of
      gedeeltelijk moeten worden betaald;
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel3
  - number: 3.3.f
    text: dat financiële zekerheid moet worden gesteld voor het nakomen van krachtens de vergunning geldende verplichtingen;
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel3
  - number: 3.3.g
    text: |-
      dat binnen een bij het voorschrift aangegeven periode ten hoogste een bepaalde hoeveelheid aangegeven vaste stoffen
      mag worden gewonnen;
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel3
  - number: 3.3.h
    text: |-
      dat bij het voorschrift aangegeven vaste stoffen voor geen andere bestemming mogen worden afgevoerd dan voor die
      welke bij het voorschrift is omschreven;
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel3
  - number: 3.3.i
    text: |-
      dat de vergunninghouder verplicht is toe te laten dat een aangewezen deel van de te ontgronden onroerende zaken
      wordt ontgrond door één of meer andere aangewezen derden en dat de daartoe tussen de vergunninghouder en die derden
      te sluiten overeenkomst de toestemming behoeft van een bij het voorschrift aangewezen bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel3
  - number: 3.3.j
    text: dat moet worden voldaan aan door een bij het voorschrift aangewezen bestuursorgaan gestelde nadere eisen.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel3
  - number: '3.4'
    text: |-
      Een financiële zekerheid als bedoeld in het derde lid, onder *f*, kan niet worden gevorderd van
      publiekrechtelijke lichamen. Op de toestemming, bedoeld in het derde lid, onder *a* en *i*, zijn de
      [artikelen 10:28 tot en met 10:31][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '3.5'
    text: |-
      Aan de vergunning kunnen ook voorschriften worden verbonden, inhoudende dat op een daarbij omschreven wijze moet
      worden aangegeven of aan andere vergunningvoorschriften wordt voldaan en dat de daarbij verkregen gegevens ter
      beschikking moeten worden gesteld van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel3
  - number: '3.6'
    text: |-
      Weigering, intrekking of wijziging van een vergunning kan geschieden op grond van strijd met de in het tweede lid
      bedoelde belangen.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel3
  - number: '4'
    text: 'Deze wet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel4
  - number: 4.a
    text: |-
      het – in geval van watersnood of dringend of dreigend gevaar voor doorbraak van dijken of voor overstroming – nemen
      van specie van gronden, welke ogenblikkelijk in bezit zijn genomen;
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel4
  - number: 4.b
    text: |-
      de uitvoering van een landinrichtingsplan of een aanpassingsplan als bedoeld in de [artikelen 73][ref1] en
      [101 van de Landinrichtingswet][ref2], met uitzondering van de ontgrondingen, welke geschieden ter verkrijging van
      het voor de werken nodige bodemmateriaal;


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel101
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '101'
  - number: 4.c
    text: |-
      de uitvoering van een provinciaal milieuprogramma, voor zover dit bevat een aanwijzing van gevallen waarin de bodem
      is of dreigt te worden verontreinigd, als bedoeld in [artikel 4.14, eerste en tweede lid, onder ][ref1] dan wel de
      toepassing van [artikel 30][ref2] of [31 van de Wet bodembescherming][ref3], met uitzondering van de ontgrondingen,
      welke geschieden ter verkrijging van het voor de werken nodige bodemmateriaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel31
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0003994
        artikel: '31'
  - number: 4a
    text: |-
      Deze wet is mede van toepassing op ontgrondingen op het continentaal plat, bedoeld in
      [artikel 1 van de Mijnbouwwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: 4b
    text: |-
      De Staat is eigenaar van de op of onmiddellijk onder de oppervlakte van het continentaal plat aanwezige vaste
      stoffen, met inbegrip van de delfstoffen, bedoeld in [artikel 1 van de Mijnbouwwet][ref1], voorzover die
      delfstoffen op een diepte van minder dan 100 meter beneden de oppervlakte van het continentaal plat aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: '5.1'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regelen omtrent ontgrondingen, bedoeld in
      [artikel 8, eerste lid][ref1], gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
  - number: '5.2'
    text: |-
      Bij provinciale verordening worden nadere regelen omtrent ontgrondingen, bedoeld in [artikel 8, tweede lid][ref1],
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
  - number: '6'
    text: |-
      Bij de maatregel, bedoeld in [artikel 5, eerste lid][ref1], kan worden bepaald dat overeenkomstig bij de maatregel
      te stellen regels een recht wordt geheven ter zake van de behandeling van de aanvraag om een vergunning of
      wijziging van een vergunning. Het tarief wordt zodanig vastgesteld dat de geraamde opbrengst van het recht de
      geraamde uitgaven niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel5
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '5'
        hoofdstuk: I
  - number: '7.1'
    text: |-
      Bij de maatregel, bedoeld in [artikel 5, eerste lid][ref1], kan worden bepaald dat het verbod van
      [artikel 3, eerste lid][ref2], niet geldt voor daarbij aan te duiden categorieën van ontgrondingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel3
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '5'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002505
        artikel: '3'
        hoofdstuk: I
  - number: '7.2'
    text: |-
      Bij de verordening, bedoeld in [artikel 5, tweede lid][ref1], kan voor daarbij aan te duiden categorieën van
      ontgrondingen, wegens haar bijzondere aard of met het oog op bijzondere gewestelijke omstandigheden, worden bepaald
      dat het verbod van [artikel 3, eerste lid][ref2], niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel3
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '5'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002505
        artikel: '3'
        hoofdstuk: I
  - number: '7.3'
    text: |-
      Een regeling als bedoeld in [artikel 5, eerste of tweede lid][ref1], kan voorts inhouden dat met betrekking tot
      ontgrondingen ten aanzien waarvan met toepassing van het eerste of tweede lid is bepaald dat het vergunningvereiste
      niet geldt, de verplichting geldt tot het melden van het voornemen te ontgronden aan een daarbij aangewezen
      bestuursorgaan. Bij toepassing van de eerste volzin worden voorts aangegeven het tijdstip, voorafgaand aan het
      ontgronden, waarop de melding uiterlijk moet zijn gedaan, alsmede de gegevens die bij de melding moeten worden
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel5
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '5'
        hoofdstuk: I
  - number: '7.4'
    text: |-
      Een regeling als bedoeld in [artikel 5, eerste of tweede lid][ref1], kan nadere regelen inhouden met betrekking tot
      de aan een vergunning te verbinden voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel5
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '5'
        hoofdstuk: I
  - number: 7a
    text: |-
      Met betrekking tot de oppervlaktedelfstoffenvoorziening door middel van ontgronding wordt een plan vastgesteld
      als bedoeld in [artikel 2][ref1], genaamd structuurschema oppervlaktedelfstoffen. Het structuurschema bevat
      de hoofdlijnen en beginselen van het beleid inzake de winning van vaste stoffen in Nederland door middel van
      ontgronding, alsmede het beleid ter bevordering van de toepassing van zodanige vaste stoffen vervangende materialen
      teneinde de winning van vaste stoffen te beperken. Het wordt telkens voor vijf jaren vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 2a
  - number: 7b.1
    text: |-
      Ter bevordering van een goede coördinatie tussen rijk en provincies van de besluitvorming inzake de winning van
      vaste stoffen door middel van ontgronding, in het bijzonder met betrekking tot de voorbereiding en uitvoering van
      het structuurschema oppervlaktedelfstoffen, voeren Onze Minister en gedeputeerde staten van de provincies periodiek
      overleg.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel7b
  - number: 7b.2
    text: |-
      Ten behoeve van het in het eerste lid bedoelde overleg verstrekken Onze Minister en gedeputeerde staten elkaar
      stelselmatig inlichtingen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel7b
  - number: 7b.2.a
    text: |-
      de behoeften aan winning van vaste stoffen door middel van ontgronding en de termijnen waarbinnen die behoeften
      zich doen gevoelen;
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel7b
  - number: 7b.2.b
    text: de gewonnen hoeveelheden per categorie van vaste stoffen per jaar;
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel7b
  - number: 7b.2.c
    text: |-
      de hoeveelheden per categorie van vaste stoffen, waarvoor een vergunning die haar gelding niet heeft verloren,
      is verleend;
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel7b
  - number: 7b.2.d
    text: |-
      het beleid met betrekking tot de winning van vaste stoffen door middel van ontgronding, waaronder begrepen de stand
      van zaken omtrent de uitvoering van het structuurschema oppervlaktedelfstoffen;
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel7b
  - number: 7b.2.e
    text: |-
      het bevorderen van het toepassen van materialen die door middel van ontgronding te verkrijgen vaste stoffen
      vervangen.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel7b
  - number: 7c
    text: |-
      Alvorens een winplaats wordt vastgesteld in een streekplan, verzoeken gedeputeerde staten aan de raad van ieder
      van de gemeenten op het gebied waarvan de beoogde winplaats betrekking heeft, mee te delen of zodanige winplaats
      in overeenstemming is met het geldende bestemmingsplan, een ter inzage gelegd ontwerp voor een herziening van het
      bestemmingsplan of een geldend voorbereidingsbesluit ter zake.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel7c
  - number: 7d
    text: |-
      Binnen drie maanden nadat het in [artikel 7][ref1] bedoelde verzoek is ingekomen, deelt de raad van ieder van de
      gemeenten op het gebied waarvan de beoogde winplaats betrekking heeft, aan gedeputeerde staten mee of zodanige
      winplaats in overeenstemming is met het geldende bestemmingsplan, een ter inzage gelegd ontwerp voor een herziening
      van het bestemmingsplan of een geldend voorbereidingsbesluit ter zake, en deelt, zo zulks niet het geval is, mee of
      het gemeentebestuur bereid is aan zodanige winplaats planologische medewerking te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel7c
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: 7c
        hoofdstuk: I
  - number: 7e
    text: |-
      Indien de beoogde winplaats in strijd is met het geldende bestemmingsplan, een ter inzage gelegd
      ontwerp voor een herziening van het bestemmingsplan of een geldend voorbereidingsbesluit ter zake, en
      de gemeenteraad niet binnen de in [artikel 7][ref1] gestelde termijn heeft meegedeeld bereid te zijn
      planologische medewerking te verlenen, geven gedeputeerde staten, indien wordt overgegaan tot het nemen
      van een besluit tot vaststelling van de winplaats in een streekplan, tegelijkertijd toepassing aan
      [artikel 37, vierde of vijfde lid, van de Wet op de Ruimtelijke Ordening][ref2], ertoe strekkende dat het
      bestemmingsplan in overeenstemming wordt gebracht met het besluit tot vaststelling van de winplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel7d
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel37
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel7e
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: 7d
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '37'
  - number: 7f
    text: |-
      Het gemeentebestuur verleent uiterlijk binnen een jaar na het onherroepelijk worden van het besluit tot
      vaststelling van een winplaats in een streekplan ter zake planologische medewerking, voor zover het overeenkomstig
      [artikel 7][ref1] ten aanzien van de winplaats de bereidheid tot het verlenen van zodanige medewerking heeft
      aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel7d
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel7f
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: 7d
        hoofdstuk: I
  - number: 7g
    text: |-
      Ten aanzien van de vaststelling van een winplaats in een streekplan is [artikel 4][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel7g
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 4a
  - number: '8.1'
    text: |-
      Onze Minister is bevoegd een vergunning als bedoeld in [artikel 3][ref1] te verlenen, te wijzigen of in te trekken,
      indien zij een ontgronding betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel3
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '3'
        hoofdstuk: I
  - number: 8.1.a
    text: in de zee;
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel8
  - number: 8.1.b
    text: in bij algemene maatregel van bestuur aan te wijzen rijkswateren;
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel8
  - number: 8.1.c
    text: in de ingepolderde gedeelten van het IJsselmeer, indien en zolang deze niet provinciaal zijn ingedeeld.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel8
  - number: '8.2'
    text: |-
      Ten aanzien van andere dan de in het eerste lid bedoelde ontgrondingen berust de bevoegdheid tot verlening,
      wijziging of intrekking van een vergunning bij gedeputeerde staten van de provincie waarin de betrokken onroerende
      zaak is gelegen.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel8
  - number: '8.3'
    text: |-
      Ten aanzien van ontgrondingen in een tot de rijkswateren behorende rivier omvat de in het eerste
      lid bedoelde bevoegdheid van Onze Minister de oppervlakte die de rivier inneemt bij gewoon
      hoog zomerwater of gewone vloed. Daarbuiten tot aan de begrenzing van het rivierbed ingevolge
      [artikel 1a van de Wet beheer rijkswaterstaatswerken][ref1] oefenen gedeputeerde staten hun in het tweede lid
      bedoelde bevoegdheid niet uit dan in overeenstemming met Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008331#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008331
        artikel: 1a
  - number: '8.4'
    text: |-
      Indien een bij gedeputeerde staten ingediende aanvrage betrekking heeft op een ontgronding, waarbij naar
      hun oordeel vrijwel uitsluitend huishoudelijke belangen van een waterschap zijn betrokken, kunnen zij
      deze ter beslissing in handen stellen van het bestuur van die instelling; zij doen daarvan mededeling aan
      de aanvrager. De beslissing op de aanvrage wordt genomen met overeenkomstige toepassing van de krachtens
      [artikel 5, tweede lid][ref1], vastgestelde regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel5
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '5'
        hoofdstuk: I
  - number: '8.5'
    text: |-
      Onze Minister kan, indien spoedige winning van bepaalde vaste stoffen door middel van ontgronding geboden is,
      aan gedeputeerde staten van de betrokken provincie een aanwijzing geven ten aanzien van een aanvrage om een
      vergunning of een in [artikel 12][ref1] bedoelde machtiging dan wel ten aanzien van een reeds verleende vergunning
      of machtiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel12
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '12'
        hoofdstuk: II
  - number: '8.6'
    text: |-
      Onze Minister pleegt over het voornemen tot het geven van een aanwijzing overleg met gedeputeerde staten van de
      betrokken provincie. Hij deelt het voornemen, onder vermelding van de redenen daarvoor, mee aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel8
  - number: '8.7'
    text: |-
      Gedeputeerde staten nemen bij de beslissing op de aanvrage om een vergunning of een in [artikel 12][ref1] bedoelde
      machtiging dan wel ten aanzien van een reeds verleende vergunning of machtiging de aanwijzing in acht die met
      betrekking tot de beslissing op de aanvrage krachtens het vijfde lid door Onze Minister is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel12
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '12'
        hoofdstuk: II
  - number: '8.8'
    text: De aanwijzing wordt vermeld in de beschikking van gedeputeerde staten, ter zake waarvan zij is gegeven.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel8
  - number: '10.1'
    text: |-
      Op de voorbereiding van een beschikking betreffende verlening of weigering onderscheidenlijk
      wijziging of intrekking van een vergunning zijn de in de [paragrafen 3.5.2 tot en met 3.5.5][ref1]
      onderscheidenlijk [paragraaf 3.5.6 van de Algemene wet bestuursrecht][ref2] geregelde
      procedure alsmede [afdeling 13.2 van de Wet milieubeheer][ref3] van toepassing. Voorts is
      [paragraaf 14.1 van de Wet milieubeheer][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf3.5.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf3.5.6
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Paragraaf14.1
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 3.5.2
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 3.5.6
      - id: ref3
        bwb_id: BWBR0003245
        afdeling: '13.2'
      - id: ref4
        bwb_id: BWBR0003245
        paragraaf: '14.1'
  - number: '10.2'
    text: |-
      Gelijktijdig met de in [artikel 3:19, eerste lid, van de Algemene wet bestuursrecht][ref1] bedoelde toezending
      wordt het in dat artikel bedoelde ontwerp toegezonden aan de eigenaar van de te ontgronden onroerende zaak, indien
      de aanvrage niet door hemzelf is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '10.3'
    text: |-
      De raad van ieder van de gemeenten op het gebied waarvan de aanvrage om vergunning betrekking heeft, deelt aan
      het ingevolge [artikel 8][ref1] bevoegde gezag binnen zes weken nadat het verzoek daartoe is ingekomen, mee of de
      beoogde ontgronding in overeenstemming is met het geldende bestemmingsplan, een ter inzage gelegd ontwerp voor een
      herziening van het bestemmingsplan of een geldend voorbereidingsbesluit ter zake, en deelt, zo zulks niet het geval
      is, mee of het gemeentebestuur bereid is aan de ontgronding planologische medewerking te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
  - number: '10.4'
    text: |-
      Indien Onze Minister het ingevolge [artikel 8][ref1] bevoegde gezag is, delen provinciale staten van de provincie
      op het gebied waarvan de aanvrage om vergunning betrekking heeft, binnen zes weken nadat het verzoek daartoe
      is ingekomen, mee of de beoogde ontgronding in overeenstemming is met het geldende streekplan of een ter inzage
      gelegd ontwerp van een streekplan, alsmede, zo zulks niet het geval is, of het provinciebestuur bereid is aan de
      ontgronding planologische medewerking te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
  - number: '10.5'
    text: |-
      Het derde en vierde lid zijn niet van toepassing indien de [artikelen 7][ref1] en [7][ref2] zijn toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel7c
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel7d
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: 7c
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002505
        artikel: 7d
        hoofdstuk: I
  - number: '10.6'
    text: |-
      Met betrekking tot ontgrondingen van eenvoudige aard, waarbij andere belangen niet of nauwelijks zijn betrokken,
      kan bij de regelingen, bedoeld in [artikel 5][ref1], voor daarbij aan te wijzen gevallen worden afgeweken van het
      bepaalde bij de voorgaande leden.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel5
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '5'
        hoofdstuk: I
  - number: '10.7'
    text: |-
      Beschikkingen als bedoeld in het eerste lid worden genomen na afweging van alle in [artikel 3, tweede lid][ref1],
      bedoelde belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel3
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '3'
        hoofdstuk: I
  - number: '10.8'
    text: |-
      Een vergunning wordt niet verleend of gewijzigd indien de beoogde ontgronding in strijd zou zijn met een
      bestemmingsplan, een ter inzage gelegd ontwerp voor een herziening van het bestemmingsplan of een geldend
      voorbereidingsbesluit ter zake, tenzij de raad van de betrokken gemeente heeft meegedeeld planologische medewerking
      te zullen verlenen, dan wel gedeputeerde staten onderscheidenlijk Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer ter zake toepassing hebben gegeven aan artikel 37, vierde of vijfde lid, onderscheidenlijk
      [artikel 37, eerste of tweede lid, van de Wet op de Ruimtelijke Ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel37
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '37'
  - number: '10.9'
    text: |-
      Een vergunning wordt voorts door Onze Minister niet verleend of gewijzigd indien de beoogde ontgronding in
      strijd zou zijn met het geldende streekplan, of een ter inzage gelegd ontwerp van een streekplan, tenzij
      provinciale staten van de betrokken provincie hebben meegedeeld planologische medewerking te zullen verlenen,
      dan wel Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer toepassing heeft gegeven aan
      [artikel 6, eerste of tweede lid, van de Wet op de Ruimtelijke Ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel6
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '6'
  - number: '10.10'
    text: |-
      Indien ingevolge het [eerste lid paragraaf 14.1 van de Wet milieubeheer][ref1] wordt toegepast, worden de in dat
      kader tot stand komende beschikkingen tot het verlenen, wijzigen of intrekken van een vergunning of enige andere
      bestuursrechtelijke toestemming inzake een ontgronding gelijktijdig door gedeputeerde staten bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Paragraaf14.1
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        paragraaf: '14.1'
  - number: '11.1'
    text: |-
      Het gemeentebestuur verleent uiterlijk binnen een jaar na het onherroepelijk worden van de beschikking van Onze
      Minister of van gedeputeerde staten op de aanvrage om een vergunning ter zake van de in die beschikking bedoelde
      ontgronding planologische medewerking, voor zover het overeenkomstig [artikel 10, derde lid][ref1], ten aanzien van
      die ontgronding de bereidheid tot het verlenen van zodanige medewerking heeft aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel10
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '10'
        hoofdstuk: II
  - number: '11.2'
    text: |-
      Provinciale staten verlenen uiterlijk binnen een jaar na het onherroepelijk worden van de beschikking van Onze
      Minister op de aanvrage om een vergunning ter zake van de in die beschikking bedoelde ontgronding planologische
      medewerking, voor zover zij overeenkomstig [artikel 10, vierde lid][ref1], ten aanzien van die ontgronding de
      bereidheid tot het verlenen van zodanige medewerking hebben aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel10
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '10'
        hoofdstuk: II
  - number: '12.1'
    text: |-
      Indien naar het oordeel van het ingevolge [artikel 8][ref1], bevoegde gezag met de uitvoering van een
      ontgronding niet kan worden gewacht, kan dat gezag machtiging verlenen om, zolang op de aanvrage niet
      onherroepelijk is beslist, de uitvoering aan te vangen. Deze machtiging wordt niet verleend, zolang de in
      [artikel 3:24, eerste lid, van de Algemene wet bestuursrecht][ref2] bedoelde termijn niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '12.2'
    text: |-
      Deze machtiging wordt verleend onder de voorwaarde, dat zekerheid wordt gesteld voor de betaling van de kosten om
      de betrokken onroerende zaak in een zodanige toestand te brengen als bij deze machtiging wordt bepaald, indien de
      vergunning wordt geweigerd of van een verleende vergunning geen gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel12
  - number: '16.1'
    text: |-
      Een beschikking op grond van [Hoofdstuk II][ref1] van deze wet tot verlening, wijziging of intrekking van een
      vergunning treedt in werking met ingang van de dag na de dag waarop de termijn afloopt voor het indienen van een
      bezwaarschrift dan wel, indien ingevolge [artikel 7:1, eerste lid, onder ][ref2] geen bezwaar kan worden gemaakt,
      van een beroepschrift. Indien gedurende de termijn bij de voorzitter van de Afdeling bestuursrechtspraak van de
      Raad van State een verzoek om voorlopige voorziening is gedaan, treedt de beschikking niet in werking voordat op
      dat verzoek is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002505
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '16.2'
    text: |-
      Zolang de werking van een beschikking tot wijziging of intrekking van een vergunning is opgeschort, kan het gezag
      hetwelk die beschikking heeft gegeven, de gehele of gedeeltelijke staking van de ontgronding bevelen, wanneer de
      bescherming van de bij de ontgronding betrokken belangen zulks onvermijdelijk maakt.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel16
  - number: '17.1'
    text: |-
      Tegen een beschikking van het bestuur van een waterschap op grond van [Hoofdstuk II][ref1] van deze wet kan een
      belanghebbende beroep instellen bij gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002505
        hoofdstuk: II
  - number: '17.2'
    text: |-
      Tegen een beschikking van Onze Minister of van gedeputeerde staten op grond van [Hoofdstuk II][ref1] van deze wet
      kan een belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002505
        hoofdstuk: II
  - number: '18'
    text: |-
      Tegen een beschikking van gedeputeerde staten op grond van [artikel 17, eerste lid][ref1], kan een belanghebbende
      beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel17
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '17'
        hoofdstuk: III
  - number: '20'
    text: |-
      Indien het beroep is ingesteld door een ander dan de aanvrager of houder van de vergunning, wordt aan deze door
      de secretaris van de Raad van State, indien het beroep bij de Afdeling bestuursrechtspraak van de Raad van State
      is ingediend en door gedeputeerde staten, indien het beroep bij dat college is ingediend, terstond schriftelijk
      medegedeeld, dat het beroep is ingesteld.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel20
  - number: '21.1'
    text: |-
      De Afdeling bestuursrechtspraak van de Raad van State beslist op het beroep tegen een in een streekplan vervat
      besluit, inhoudende vaststelling van een winplaats, binnen twaalf maanden na afloop van de beroepstermijn.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21
  - number: '21.2'
    text: |-
      Een krachtens [artikel 7][ref1] door gedeputeerde staten genomen maatregel, inhoudende toepassing van
      [artikel 37, vierde of vijfde lid, van de Wet op de Ruimtelijke Ordening][ref2], wordt geacht voor de mogelijkheid
      van beroep deel uit te maken van het desbetreffende in een streekplan vervatte besluit, inhoudende vaststelling van
      een winplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel7e
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel37
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: 7e
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '37'
  - number: 21a.1
    text: |-
      Indien tegen een aanvrage voor of het ontwerp van het besluit van Onze Minister of het bestuur van een provincie of
      een gemeente, dat nodig is voor de inrichting of het gebruik van een winplaats die is vastgesteld in een streekplan
      dan wel een bestemmingsplan, bedenkingen naar voren kunnen worden gebracht, kunnen deze bedenkingen geen grond
      vinden in bedenkingen tegen de vastgestelde winplaats.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21a
  - number: 21a.2
    text: |-
      Indien tegen een besluit van Onze Minister of het bestuur van een provincie of een gemeente, dat dient voor het
      verwezenlijken van een winplaats die is vastgesteld in een streekplan dan wel een bestemmingsplan, beroep kan
      worden ingesteld, kan dat beroep geen grond vinden in bedenkingen tegen de vastgestelde winplaats.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21a
  - number: 21b.1
    text: |-
      Indien op aanvragen om beschikkingen tot het verlenen, wijzigen of intrekken van een vergunning of enige andere
      bestuursrechtelijke toestemming inzake ontgronding [§ 14.1 van de Wet milieubeheer][ref1] is toegepast, worden
      zodanige beschikkingen voor de mogelijkheid van beroep ingevolge de desbetreffende wettelijke bepalingen als één
      beschikking aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Paragraaf14.1
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        paragraaf: '14.1'
  - number: 21b.2
    text: |-
      In de in het eerste lid bedoelde beschikkingen wordt vermeld dat zij zijn voorbereid met toepassing
      van[ § 14.1 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Paragraaf14.1
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        paragraaf: '14.1'
  - number: 21b.3
    text: |-
      Ten aanzien van de in het eerste lid bedoelde beschikkingen kan slechts beroep worden ingesteld bij de Afdeling
      bestuursrechtspraak van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21b
  - number: 21b.4
    text: De Afdeling beslist op het beroep binnen twaalf maanden na afloop van de beroepstermijn.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21b
  - number: 21c
    text: |-
      Een beschikking, houdende een aanwijzing als bedoeld in [artikel 8, vierde lid][ref1], maakt voor de toepassing van
      [artikel 17, tweede lid, deel][ref2] uit van de in [artikel 17, tweede lid][ref3], bedoelde beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0002505#Artikel17
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002505
        artikel: '17'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002505
        artikel: '17'
        hoofdstuk: III
  - number: 21d
    text: |-
      Niet vatbaar voor afzonderlijk beroep is een mededeling inzake het verlenen van planologische medewerking als
      bedoeld in de [artikelen 7][ref1] of [10, derde en vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel7d
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel10
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21d
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: 7d
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002505
        artikel: '10'
        hoofdstuk: II
  - number: 21e
    text: |-
      Indien beroep is ingesteld tegen een beschikking van gedeputeerde staten tot verlening, wijziging, intrekking
      of weigering van een vergunning en Onze Minister nadien met toepassing van [artikel 8, vierde lid][ref1],
      een aanwijzing heeft gegeven of gedeputeerde staten vervolgens overeenkomstig zodanige aanwijzing een andere
      beschikking op de aanvrage hebben genomen, wordt het beroepschrift met betrekking tot eerstbedoelde beschikking
      buiten verdere behandeling gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21e
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
  - number: 21f.1
    text: 'Provinciale staten zijn bevoegd bij wijze van provinciale belasting een heffing in te stellen ter bestrijding van:'
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21f
  - number: 21f.1.a
    text: |-
      ten hoogste vijftig procent van de ten laste van de provincie komende kosten van werkzaamheden in verband met
      onderzoek en planning met betrekking tot ontgrondingen en van werkzaamheden, voortvloeiende uit de toepassing van
      [artikel 7b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel7b
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21f
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: 7b
        hoofdstuk: I
  - number: 21f.1.b
    text: |-
      kosten van maatregelen, gericht op het bieden van compensatie in verband met de gevolgen van ingrijpende
      ontgrondingen ten behoeve van de grondstoffenvoorziening aan gebieden waar zodanige ontgrondingen plaatsvinden of
      plaatsgevonden hebben;
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21f
  - number: 21f.1.c
    text: |-
      kosten met betrekking tot schadevergoedingen ingevolge [artikel 26][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel26
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21f
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '26'
        hoofdstuk: V
  - number: 21f.2
    text: |-
      De heffing is verschuldigd ter zake van het verlenen van een vergunning of machtiging als bedoeld in de
      [artikelen 3][ref1] en [12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel12
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21f
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002505
        artikel: '12'
        hoofdstuk: II
  - number: 21f.3
    text: |-
      Aan de heffing worden onderworpen de houders van vergunningen en machtigingen als bedoeld in de [artikelen 3][ref1]
      en [12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel12
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21f
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002505
        artikel: '12'
        hoofdstuk: II
  - number: 21f.4
    text: |-
      Als grondslag voor de heffing geldt de ingevolge de vergunning of machtiging te winnen hoeveelheid vaste stoffen,
      gemeten in profiel van ontgraving.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21f
  - number: 21f.5
    text: 'Vrijgesteld van de heffing zijn:'
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21f
  - number: 21f.5.a
    text: |-
      hoeveelheden van minder dan 10 000 kubieke meter ingevolge de vergunning of machtiging te winnen vaste stoffen,
      gemeten in profiel van ontgraving;
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21f
  - number: 21f.5.b
    text: hoeveelheden ten aanzien waarvan de heffing eerder is geheven.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21f
  - number: 21f.6
    text: |-
      Het vijfde lid, aanhef en onder b, is niet van toepassing voor zover is geheven ten behoeve van een in het eerste
      lid bedoelde bestemming en nadien wordt geheven voor een andere in dat lid bedoelde bestemming.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21f
  - number: 21f.7
    text: |-
      Ten behoeve van de in het eerste lid, onder a, b en c, bedoelde bestemmingen worden afzonderlijke tarieven
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21f
  - number: 21f.8
    text: |-
      Het tarief dat betrekking heeft op de in het eerste lid, onder b, bedoelde bestemming bedraagt ten hoogste € 0,10
      per kubieke meter vaste stoffen.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21f
  - number: 21f.9
    text: |-
      Indien een vergunning of machtiging wordt vernietigd of ingetrokken dan wel wordt gewijzigd in die zin dat de
      toegestane te winnen hoeveelheid vaste stoffen wordt verminderd, vindt op verzoek van de heffingplichtige teruggaaf
      van de heffing plaats voor zover de vergunning of machtiging is vernietigd of ingetrokken dan wel de hoeveelheid
      vaste stoffen voor de winning waarvan vergunning of machtiging is verleend, is verminderd.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21f
  - number: 21f.10
    text: Teruggaaf blijft achterwege indien het bedrag dat moet worden teruggegeven minder bedraagt dan € 250.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21f
  - number: 21f.11
    text: De heffing wordt geheven bij wege van aanslag.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21f
  - number: 21g.1
    text: |-
      Indien Onze Minister in verband met de toepassing van deze wet onderzoek ter plaatse nodig oordeelt, is hij
      bevoegd de rechthebbenden ten aanzien van gronden of wateren waar dat onderzoek wordt ingesteld de verplichting
      op te leggen het verrichten van dat onderzoek, alsmede het aanbrengen, het aanwezig zijn, het onderhoud, het
      gebruik en het verwijderen van de voor dat onderzoek nodige middelen te gedogen, onverminderd het recht van deze
      rechthebbenden op schadevergoeding. Gelijke bevoegdheid als bedoeld in de vorige volzin komt toe aan gedeputeerde
      staten.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21g
  - number: 21g.2
    text: |-
      Een beschikking tot oplegging van een gedoogplicht wordt tenminste twee weken voor de aanvang van het onderzoek
      bekendgemaakt aan de rechthebbenden.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21g
  - number: 21h.1
    text: |-
      Indien de aanvrager of de houder van een vergunning of degene die voornemens is een
      aanvrage in te dienen ter verkrijging van de gegevens die ingevolge het bepaalde krachtens
      [artikel 5, eerste onderscheidenlijk tweede lid][ref1], moeten worden verschaft in een aanvrage om een vergunning
      of wijziging van een vergunning, onderzoek moet verrichten in gronden of wateren ten aanzien waarvan hij niet de
      rechthebbende is, kan hij Onze Minister onderscheidenlijk gedeputeerde staten verzoeken daartoe een gedoogplicht
      overeenkomstig [artikel 21g][ref2] op te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel21g
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21h
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '5'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002505
        artikel: 21g
        hoofdstuk: IV
  - number: 21h.2
    text: |-
      Hij legt hiertoe over een opgave van de ligging van de gronden of wateren, van de namen en woonplaatsen van de
      rechthebbenden daarvan, alsmede van de aard der onderzoekingen.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21h
  - number: 21h.3
    text: |-
      Bij de beschikking tot het opleggen van de gedoogplicht worden zodanige voorschriften gesteld jegens degene op
      wiens verzoek de gedoogplicht wordt opgelegd, dat de vergoeding van schade aan de rechthebbende op voldoende wijze
      is verzekerd.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel21h
  - number: '22'
    text: |-
      Met betrekking tot de handhaving van het bij of krachtens deze wet bepaalde zijn
      de [artikelen 18.4 tot en met 18.12][ref1], alsmede de [artikelen 18.14][ref2] en
      [18.16 van de Wet milieubeheer][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '18'
  - number: '26.1'
    text: |-
      Voorzover blijkt dat de aanvrager, de houder van de vergunning of degene die overeenkomstig
      [afdeling 3.5 van de Algemene wet bestuursrecht][ref1] bedenkingen heeft ingebracht dan wel overeenkomstig
      [afdeling 3.4][ref2] of [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref3] zijn zienswijze naar voren
      heeft gebracht, ten gevolge van een beschikking ter zake van een ontgronding als bedoeld in [artikel 8][ref4]
      schade lijdt of zal lijden, welke redelijkerwijze niet of niet geheel te zijnen laste behoort te blijven en
      waarvan de vergoeding niet of niet voldoende op andere wijze is verzekerd, wordt hem een naar billijkheid te
      bepalen schadevergoeding toegekend, en wel door Onze Minister ten laste van ’s Rijks kas, indien het betreft een
      ontgronding als bedoeld in [artikel 8, eerste lid][ref5], door gedeputeerde staten ten laste van de provinciale
      kas, indien het betreft een ontgronding als bedoeld in [artikel 8, tweede lid][ref6], en door het bestuur
      van het waterschap ten laste van de kas van die instelling, indien het betreft een ontgronding als bedoeld in
      [artikel 8, derde lid][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref4]: https://wetten.overheid.nl/BWBR0002505#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0002505#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0002505#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref4
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
      - id: ref7
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
  - number: '26.2'
    text: |-
      De vergoeding kan worden toegekend, hetzij bij de beschikking inzake de vergunning, hetzij bij afzonderlijke
      beschikking.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel26
  - number: '27'
    text: |-
      Indien door Onze Minister of door gedeputeerde staten ten behoeve van belangen, behartigd of mede behartigd door
      andere openbare lichamen dan het Rijk onderscheidenlijk de provincie, een beschikking wordt gegeven naar aanleiding
      waarvan een vergoeding wordt toegekend als bedoeld in [artikel 26][ref1], kan bij die beschikking aan die andere
      lichamen, hun bestuur gehoord, worden opgelegd de kosten, die het gevolg zijn van het behartigen van die belangen,
      geheel of gedeeltelijk te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel26
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '26'
        hoofdstuk: V
  - number: '28'
    text: |-
      Indien bij een beschikking als bedoeld in [artikel 8][ref1] geen vergoeding is toegekend, kan zij worden
      aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
  - number: '29.1'
    text: |-
      Tegen een door het bestuur van een waterschap gegeven beschikking op grond van [artikel 26, eerste lid][ref1], kan
      een belanghebbende beroep instellen bij gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel26
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '26'
        hoofdstuk: V
  - number: '29.2'
    text: |-
      Tegen een door Onze Minister of gedeputeerde staten gegeven beschikking op grond van
      [artikel 26, eerste lid][ref1], dan wel [artikel 27][ref2], alsmede tegen een beschikking van gedeputeerde staten
      op grond van het eerste lid kan een belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de Raad
      van State.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel27
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '26'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002505
        artikel: '27'
        hoofdstuk: V
  - number: 29a.1
    text: |-
      De [artikelen 26 tot en met 29][ref1] zijn van overeenkomstige toepassing ten aanzien van schade die een
      rechthebbende als bedoeld in [artikel 21g][ref2] lijdt of zal lijden tengevolge van het opleggen van een
      gedoogplicht als bedoeld in dat artikel in andere gevallen dan bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel21g
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '26'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002505
        artikel: 21g
        hoofdstuk: IV
  - number: 29a.2
    text: |-
      De schade tengevolge van het in [artikel 21h][ref1] bedoelde onderzoek wordt vergoed door degene op wiens verzoek
      de gedoogplicht is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel21h
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: 21h
        hoofdstuk: IV
  - number: '30'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt onder wijzigingswet verstaan: de wet van 20 juni 1996 tot wijziging van
      de Ontgrondingenwet en andere wetten (*Stb*. 411).
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel30
  - number: '31.1'
    text: |-
      De [artikelen 6][ref1] en [10][ref2] vinden geen toepassing ten aanzien van aanvragen om vergunning die zijn
      ingediend voor het tijdstip van inwerkingtreding van de wijzigingswet. Ten aanzien van zodanige aanvragen wordt
      [artikel 10][ref3], zoals dat luidde voor het bedoelde tijdstip, toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002505#Artikel10
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '6'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002505
        artikel: '10'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0002505
        artikel: '10'
        hoofdstuk: II
  - number: '31.2'
    text: |-
      [Artikel 21][ref1], vindt geen toepassing ten aanzien van houders van vergunningen en machtigingen die zijn
      verleend voor het tijdstip van inwerkingtreding van de wijzigingswet.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel21f
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: 21f
        hoofdstuk: IIIA
  - number: '32.1'
    text: |-
      Een vergunning welke vóór het tijdstip van inwerkingtreding van de wijzigingswet krachtens de Rivierenwet bij
      onherroepelijk geworden beschikking is verleend voor een ontgronding als bedoeld in [artikel 4, § 1, onderdeel ]
      (onbekend), wordt beschouwd als ingevolge deze wet te zijn verleend en blijft als zodanig van kracht gedurende
      vijf jaren na het tijdstip van inwerkingtreding van de wijzigingswet, voor zover zij niet eerder is vervallen of
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel32
  - number: '32.2'
    text: |-
      Indien vóór het eindigen van de geldigheidsduur van een in het eerste lid bedoelde vergunning een aanvraag om een
      vergunning krachtens deze wet wordt ingediend, blijft de vergunning van kracht totdat de beschikking op de aanvraag
      onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel32
  - number: '32.3'
    text: |-
      Indien op het tijdstip van inwerkingtreding van de wijzigingswet nog niet een beschikking op een aanvraag om een
      vergunning als bedoeld in [artikel 4, § 1, onderdeel ](onbekend) onherroepelijk is geworden, blijven ten aanzien
      van de behandeling van die aanvraag, de beschikking op de aanvraag en het beroep tegen de bedoelde beschikking de
      voor dat tijdstip toepasselijke wettelijke bepalingen gelden.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel32
  - number: '32.4'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van een vergunning welke is verleend
      overeenkomstig het derde lid.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel32
  - number: '32.5'
    text: |-
      Een door Onze Minister van Financiën, in overeenstemming met Onze Minister van Verkeer en Waterstaat, vóór het
      tijdstip van inwerkingtreding van de wijzigingswet verleende toestemming voor een ontgronding op het continentaal
      plat, bedoeld in [artikel 1, eerste lid, van de Mijnwet continentaal plat][ref1], wordt beschouwd als een
      vergunning in de zin van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel1
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '1'
  - number: '33'
    text: |-
      De bevoegdheid tot het maken van gemeentelijke verordeningen blijft ten aanzien van het onderwerp, waarin deze wet
      voorziet, gehandhaafd, voor zover die verordeningen niet met deze wet in strijd zijn.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel33
  - number: '34.1'
    text: |-
      Deze wet laat de bevoegdheden tot het vaststellen van wettelijke regelingen in het belang van de waterkering, ook
      voorzover daarbij het ontgronden wordt verboden of beperkt, onverlet.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel34
  - number: '34.2'
    text: Bestaande bepalingen van deze strekking blijven van kracht.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel34
  - number: '35'
    text: Deze wet kan worden aangehaald als "Ontgrondingenwet".
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel35
  - number: '36'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002505/2003-01-01#Artikel36
