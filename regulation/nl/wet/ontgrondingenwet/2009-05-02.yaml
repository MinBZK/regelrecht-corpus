  - number: 21f
    text: |-
      1 Provinciale staten zijn bevoegd bij wijze van provinciale belasting een heffing in te stellen ter bestrijding
      van:

      a. kosten met betrekking tot schadevergoedingen ingevolge [artikel 26][ref1];

      b. kosten met betrekking tot het onderzoek naar het verband tussen een ontgronding en schade aan onroerende zaken
      en de bepaling van de omvang van de schade.

      2 De heffing is verschuldigd ter zake van het verlenen van een vergunning of machtiging als bedoeld in de
      [artikelen 3][ref2] en [12][ref3].

      3 Aan de heffing worden onderworpen de houders van vergunningen en machtigingen als bedoeld in de
      [artikelen 3][ref4] en [12][ref5].

      4 Als grondslag voor de heffing geldt de ingevolge de vergunning of machtiging te winnen hoeveelheid vaste stoffen,
      gemeten in profiel van ontgraving.

      5 Vrijgesteld van de heffing zijn:

      a. hoeveelheden van minder dan 10 000 kubieke meter ingevolge de vergunning of machtiging te winnen vaste stoffen,
      gemeten in profiel van ontgraving;

      b. hoeveelheden ten aanzien waarvan de heffing eerder is geheven.

      6 Het vijfde lid, aanhef en onder b, is niet van toepassing voor zover is geheven ten behoeve van een in het eerste
      lid bedoelde bestemming en nadien wordt geheven voor een andere in dat lid bedoelde bestemming.

      7 Ten behoeve van de in het eerste lid, onder a en b, bedoelde bestemmingen worden afzonderlijke tarieven
      vastgesteld.

      8 Indien een vergunning of machtiging wordt vernietigd of ingetrokken dan wel wordt gewijzigd in die zin dat de
      toegestane te winnen hoeveelheid vaste stoffen wordt verminderd, vindt op verzoek van de heffingplichtige teruggaaf
      van de heffing plaats voor zover de vergunning of machtiging is vernietigd of ingetrokken dan wel de hoeveelheid
      vaste stoffen voor de winning waarvan vergunning of machtiging is verleend, is verminderd.

      9 Teruggaaf blijft achterwege indien het bedrag dat moet worden teruggegeven minder bedraagt dan € 250.

      10 De heffing wordt geheven bij wege van aanslag.

      11 Indien het eerste lid, onder b, wordt toegepast, worden bij provinciale verordening regels gesteld omtrent de
      procedure met betrekking tot de behandeling van de aanvraag om vergoeding van kosten als bedoeld in het eerste lid,
      onder b, en de advisering omtrent de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002505#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0002505#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0002505#Artikel12
