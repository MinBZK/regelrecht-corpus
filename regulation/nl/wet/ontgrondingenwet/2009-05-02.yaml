  - number: '2'
    text: |-
      Een ontgronding wordt geacht in de zee plaats te hebben, indien zij plaats heeft daar, waar de bodem bij gewone
      vloed of gewoon zomerpeil door het water van de zee wordt bedekt.
    url: https://wetten.overheid.nl/BWBR0002505/2009-05-02#Artikel2
  - number: '3'
    text: |-
      1 Het is verboden, behoudens het bepaalde in de [artikelen 12][ref1] en [31][ref2], zonder vergunning te ontgronden
      dan wel als eigenaar, erfpachter, vruchtgebruiker, opstalhouder, beklemde meier of gebruiker van enige onroerende
      zaak toe te laten, dat aldaar zonder vergunning ontgronding plaats heeft.

      2 Aan een vergunning kunnen voorschriften worden verbonden ter bevordering en bescherming van belangen, betrokken
      bij de ontgronding, de herinrichting van de ontgronde onroerende zaken en de aanpassing van de omgeving van de
      ontgronde onroerende zaken.

      3 De in het tweede lid bedoelde voorschriften kunnen in ieder geval inhouden:

      a. dat een werkplan wordt overgelegd, volgens hetwelk de ontgronding zal geschieden, en dat het toestemming behoeft
      van een bij het voorschrift aangewezen bestuursorgaan;

      b. dat de onroerende zaken waarvoor een vergunning tot ontgronding wordt verleend, geheel of bij gedeelten in een
      bij het voorschrift omschreven toestand dienen te worden gebracht;

      c. dat in plaats van de onder b bedoelde verplichting een bepaald bedrag ineens of bij gedeelten moet worden
      betaald;

      d. dat de kosten van het beheer van de onroerende zaken die zijn ontgrond geheel of gedeeltelijk moeten worden
      betaald;

      e. dat de kosten in verband met de aanpassingsinrichting van de omgeving van de ontgronde onroerende zaken,
      alsmede van het beheer van de aangepaste omgeving, voor zover zij het gevolg zijn van de ontgronding, geheel of
      gedeeltelijk moeten worden betaald;

      f. dat financiële zekerheid moet worden gesteld voor het nakomen van krachtens de vergunning geldende
      verplichtingen;

      g. dat moet worden voldaan aan door een bij het voorschrift aangewezen bestuursorgaan gestelde nadere eisen;

      h. dat de vergunninghouder verplicht is technische maatregelen te treffen waardoor monumenten als bedoeld in
      [artikel 1, onderdeel b, van de Monumentenwet 1988][ref3] in de bodem kunnen worden behouden;

      i. dat de vergunninghouder verplicht is opgravingen te doen als bedoeld in
      [artikel 1, onderdeel h, van de Monumentenwet 1988][ref4];

      j. dat de vergunninghouder verplicht is de ontgronding te laten begeleiden door een deskundige op het terrein
      van de archeologische monumentenzorg die voldoet aan door het vergunningverlenende bestuursorgaan te stellen
      kwalificaties.

      4 Een financiële zekerheid als bedoeld in het derde lid, onder f, kan niet worden gevorderd
      van publiekrechtelijke lichamen. Op de toestemming, bedoeld in het derde lid, onder a, zijn de
      [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref5] van overeenkomstige toepassing.

      5 Aan de vergunning kunnen ook voorschriften worden verbonden, inhoudende dat op een daarbij omschreven wijze moet
      worden aangegeven of aan andere vergunningvoorschriften wordt voldaan en dat de daarbij verkregen gegevens ter
      beschikking moeten worden gesteld van het bevoegd gezag.

      6 Weigering, intrekking of wijziging van een vergunning kan geschieden op grond van strijd met de in het tweede lid
      bedoelde belangen.


