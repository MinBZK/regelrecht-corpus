  - number: 4a
    text: |-
      Deze wet is mede van toepassing op ontgrondingen op het continentaal plat, bedoeld in
      [artikel 1 van de Mijnbouwwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0002505/2009-05-02#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: 4b
    text: |-
      De Staat is eigenaar van de op of onmiddellijk onder de oppervlakte van het continentaal plat aanwezige vaste
      stoffen, met inbegrip van de delfstoffen, bedoeld in [artikel 1 van de Mijnbouwwet][ref1], voorzover die
      delfstoffen op een diepte van minder dan 100 meter beneden de oppervlakte van het continentaal plat aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0002505/2009-05-02#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: '5'
    text: |-
      1 Bij algemene maatregel van bestuur worden omtrent ontgrondingen als bedoeld in [artikel 8, eerste lid][ref1],
      regels gesteld met betrekking tot de wijze waarop de aanvraag om een vergunning als bedoeld in
      [artikel 3, eerste lid][ref2], moet geschieden en de gegevens en bescheiden die door de aanvrager moeten worden
      verstrekt met het oog op de beslissing op de aanvraag.

      2 Bij provinciale verordening worden omtrent ontgrondingen als bedoeld in [artikel 8, tweede lid][ref3],
      regels gesteld met betrekking tot de wijze waarop de aanvraag om een vergunning als bedoeld in
      [artikel 3, eerste lid][ref4], moet geschieden en de gegevens en bescheiden die door de aanvrager moeten worden
      verstrekt met het oog op de beslissing op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
