preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is wettelijke regelen te stellen teneinde een
    doelmatige afweging van de verschillende bij ontgrondingen betrokken belangen te verzekeren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002505/2009-05-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Verkeer en Waterstaat;

      b. planologisch medewerking verlenen: het nemen van een of meer besluiten krachtens de
      [Wet ruimtelijke ordening][ref1] door de raad onderscheidenlijk het college van burgemeester en wethouders van een
      gemeente of het bestuur van een provincie waarin die gemeente is gelegen, waardoor een ontgronding kan plaatsvinden
      zonder strijd met het bepaalde bij of krachtens [die wet][ref2];

      c. zomerbed:

      1°. oppervlakte tussen de denkbeeldige lijnen ter weerszijden van de stroomgeul bij gewoon hoog zomerwater of
      gewone vloed, die de as van de rivier volgen en de worteleinden van de kribben in de rivier met elkaar verbinden;

      2°. voor zover geen kribben in de rivier aanwezig zijn: de oppervlakte tussen de oeverlijnen van de stroomgeul bij
      gewoon hoog zomerwater of gewone vloed, waarbij de oeverlijnen in een denkbeeldige lijn worden doorgetrokken op
      plaatsen waar water in de uiterwaard in open verbinding staat met de stroomgeul;

      3°. nevengeulen in beheer bij het Rijk;

      4°. bij het Rijk in beheer zijnde havens die in open verbinding staan met de stroomgeul.


      [ref1]: https://wetten.overheid.nl/BWBR0020449
      [ref2]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0002505/2009-05-02#Artikel1
