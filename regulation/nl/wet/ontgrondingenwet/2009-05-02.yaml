  - number: 29a
    text: |-
      1 De [artikelen 26 tot en met 29][ref1] zijn van overeenkomstige toepassing ten aanzien van schade die een
      rechthebbende als bedoeld in [artikel 21g][ref2] lijdt of zal lijden tengevolge van het opleggen van een
      gedoogplicht als bedoeld in dat artikel in andere gevallen dan bedoeld in het tweede lid.

      2 De schade tengevolge van het in [artikel 21h][ref3] bedoelde onderzoek wordt vergoed door degene op wiens verzoek
      de gedoogplicht is opgelegd.


