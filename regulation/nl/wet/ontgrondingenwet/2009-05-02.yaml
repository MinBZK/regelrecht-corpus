  - number: '4'
    text: |-
      Deze wet is niet van toepassing op:

      a. het – in geval van watersnood of dringend of dreigend gevaar voor doorbraak van dijken of voor overstroming –
      nemen van specie van gronden, welke ogenblikkelijk in bezit zijn genomen;

      b. de uitvoering van een inrichtingsplan als bedoeld in
      [artikel 17, eerste lid, van de Wet inrichting landelijk gebied][ref1], met uitzondering van de ontgrondingen,
      welke geschieden ter verkrijging van het voor de werken nodige bodemmateriaal;

      c. de uitvoering van een provinciaal milieuprogramma, voor zover dit bevat een aanwijzing
      van gevallen waarin de bodem is of dreigt te worden verontreinigd, als bedoeld in
      [artikel 4.14, eerste en tweede lid, onder a, 1°, van de Wet milieubeheer][ref2] dan wel de toepassing van
      [artikel 30][ref3] of [31 van de Wet bodembescherming][ref4], met uitzondering van de ontgrondingen, welke
      geschieden ter verkrijging van het voor de werken nodige bodemmateriaal.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel4.14
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0003994#Artikel31
