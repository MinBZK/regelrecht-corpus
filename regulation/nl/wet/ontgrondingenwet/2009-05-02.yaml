  - number: '12'
    text: |-
      1 Indien naar het oordeel van het ingevolge [artikel 8][ref1], bevoegde gezag met de uitvoering van een
      ontgronding niet kan worden gewacht, kan dat gezag machtiging verlenen om, zolang op de aanvrage niet
      onherroepelijk is beslist, de uitvoering aan te vangen. Deze machtiging wordt niet verleend, zolang de in
      [artikel 3:16, eerste lid, van de Algemene wet bestuursrecht][ref2] bedoelde termijn niet is verstreken.

      2 Deze machtiging wordt verleend onder de voorwaarde, dat zekerheid wordt gesteld voor de betaling van de kosten om
      de betrokken onroerende zaak in een zodanige toestand te brengen als bij deze machtiging wordt bepaald, indien de
      vergunning wordt geweigerd of van een verleende vergunning geen gebruik wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel316
