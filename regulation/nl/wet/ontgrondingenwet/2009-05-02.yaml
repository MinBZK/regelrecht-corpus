  - number: '10'
    text: |-
      1 Op de voorbereiding van een beschikking als bedoeld in [artikel 8][ref1] zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] en [afdeling 13.2 van de Wet milieubeheer][ref3] van
      toepassing.

      2 Het college van burgemeester en wethouders van ieder van de gemeenten op het gebied waarvan de aanvrage om
      vergunning betrekking heeft, deelt aan het ingevolge [artikel 8][ref4] bevoegde gezag binnen acht weken nadat
      het verzoek daartoe is ingekomen, mee of de beoogde ontgronding in overeenstemming is met het bestemmingsplan,
      een ter inzage gelegd ontwerp hiervoor, een voorbereidingsbesluit ter zake of een beheersverordening als bedoeld
      in [artikel 3.38 van de Wet ruimtelijke ordening][ref5], en deelt, zo zulks niet het geval is, mee of de raad
      onderscheidenlijk het college van burgemeester en wethouders bereid is aan de ontgronding planologische medewerking
      te verlenen.

      3 Indien Onze Minister het ingevolge [artikel 8][ref6] bevoegde gezag is, delen gedeputeerde staten van de
      provincie op het gebied waarvan de aanvrage om vergunning betrekking heeft, binnen zes weken nadat het verzoek
      daartoe is ingekomen, mee of de beoogde ontgronding in overeenstemming is met een inpassingsplan, als bedoeld
      in [artikel 3.26 van de Wet ruimtelijke ordening][ref7], een ter inzage gelegd ontwerp hiervoor of de regels,
      gesteld bij of krachtens een verordening als bedoeld in [artikel 4.1 van die wet][ref8], alsmede, zo zulks niet
      het geval is, of provinciale staten of gedeputeerde staten bereid zijn aan de ontgronding planologische medewerking
      te verlenen.

      4 Met betrekking tot ontgrondingen van eenvoudige aard, waarbij andere belangen niet of nauwelijks zijn betrokken,
      kan bij de regelingen, bedoeld in [artikel 5][ref9], voor daarbij aan te wijzen gevallen worden afgeweken van het
      bepaalde bij de voorgaande leden.

      5 Beschikkingen als bedoeld in het eerste lid worden genomen na afweging van de in [artikel 3, tweede lid][ref10],
      bedoelde belangen.

      6 Een vergunning wordt niet verleend of gewijzigd indien de beoogde ontgronding in strijd is met een ruimtelijk
      besluit, tenzij die strijd naar verwachting zal worden opgeheven.


