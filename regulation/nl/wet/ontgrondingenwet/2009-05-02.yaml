  - number: '8'
    text: |-
      1 Onze Minister is bevoegd een vergunning als bedoeld in [artikel 3][ref1] te verlenen, te wijzigen of in te
      trekken, indien zij een ontgronding betreft in bij ministeriële regeling aan te wijzen rijkswateren.

      2 Ten aanzien van andere dan de in het eerste lid bedoelde ontgrondingen berust de bevoegdheid tot verlening,
      wijziging of intrekking van een vergunning bij gedeputeerde staten van de provincie waarin de betrokken onroerende
      zaak is gelegen.

      3 Ten aanzien van ontgrondingen in een tot de rijkswateren behorende rivier heeft de in het eerste lid bedoelde
      bevoegdheid betrekking op het zomerbed van de rivier. Voor het niet tot het zomerbed behorende gedeelte van de
      rivier tot aan de begrenzing van de rivier ingevolge [artikel 1a van de Wet beheer rijkswaterstaatswerken][ref2]
      oefenen gedeputeerde staten hun in het tweede lid bedoelde bevoegdheid uit in overeenstemming met Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008331#Artikel1a
