        artikel: '26'
        hoofdstuk: V
  - number: '28'
    text: |-
      Indien bij een beschikking als bedoeld in [artikel 8][ref1] geen vergoeding is toegekend, kan zij worden
      aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0002505/2009-05-02#Artikel28
