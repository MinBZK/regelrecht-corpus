  - number: '33'
    text: |-
      De bevoegdheid tot het maken van gemeentelijke verordeningen blijft ten aanzien van het onderwerp, waarin deze wet
      voorziet, gehandhaafd, voor zover die verordeningen niet met deze wet in strijd zijn.
    url: https://wetten.overheid.nl/BWBR0002505/2009-05-02#Artikel33
  - number: '34'
    text: |-
      1 Deze wet laat de bevoegdheden tot het vaststellen van wettelijke regelingen in het belang van de waterkering, ook
      voorzover daarbij het ontgronden wordt verboden of beperkt, onverlet.

      2 Bestaande bepalingen van deze strekking blijven van kracht.
    url: https://wetten.overheid.nl/BWBR0002505/2009-05-02#Artikel34
  - number: '35'
    text: Deze wet kan worden aangehaald als "Ontgrondingenwet".
    url: https://wetten.overheid.nl/BWBR0002505/2009-05-02#Artikel35
  - number: '36'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002505/2009-05-02#Artikel36
