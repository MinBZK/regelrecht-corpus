  - number: 10c
    text: |-
      Op de voorbereiding van de in [artikel 10a, eerste lid][ref1], bedoelde besluiten is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing, met dien verstande dat:

      a. de ontwerpen van de besluiten binnen een door het ingevolge [artikel 8][ref3] bevoegde
      bestuursorgaan te bepalen termijn worden toegezonden aan het bestuursorgaan, dat zorg draagt voor de in
      [artikel 3:13, eerste lid, van die wet][ref4] bedoelde toezending;

      b. het ingevolge [artikel 8][ref5] bevoegde bestuursorgaan ten aanzien van de ontwerpen van de besluiten
      gezamenlijk toepassing kan geven aan de [artikelen 3:11, eerste lid][ref6], en [3:12 van die wet][ref7];

      c. zienswijzen naar voren kunnen worden gebracht door een ieder;

      d. in afwijking van [artikel 3:18, eerste lid, van die wet][ref8] de besluiten worden genomen binnen een door het
      ingevolge [artikel 8][ref9] bevoegde bestuursorgaan te bepalen termijn;

      e. de besluiten onverwijld worden gezonden aan het ingevolge [artikel 8][ref10] bevoegde bestuursorgaan.


