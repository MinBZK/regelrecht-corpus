  - number: 10b
    text: |-
      1 Het ingevolge [artikel 8][ref1] bevoegde bestuursorgaan kan van de andere betrokken bestuursorganen de
      medewerking vorderen, die voor het welslagen van de coördinatie nodig is.

      2 De in het eerste lid bedoelde bestuursorganen verlenen de van hen gevorderde medewerking.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
