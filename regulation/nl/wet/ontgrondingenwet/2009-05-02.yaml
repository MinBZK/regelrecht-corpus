    text: |-
      Tegen een beschikking op grond van [Hoofdstuk II][ref1] van deze wet of een ander in
      [artikel 10a, eerste lid][ref2], bedoeld besluit kan een belanghebbende beroep instellen bij de Afdeling
      bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel10a
