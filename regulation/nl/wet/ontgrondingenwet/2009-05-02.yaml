  - number: '26'
    text: |-
      1 Voorzover blijkt dat de aanvrager, de houder van de vergunning of degene die overeenkomstig [afdeling 3.4][ref1]
      of [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref2] zijn zienswijze naar voren heeft gebracht, ten
      gevolge van een beschikking ter zake van een ontgronding als bedoeld in [artikel 8][ref3] schade lijdt of zal
      lijden, welke redelijkerwijze niet of niet geheel te zijnen laste behoort te blijven en waarvan de vergoeding
      niet of niet voldoende op andere wijze is verzekerd, wordt hem een naar billijkheid te bepalen schadevergoeding
      toegekend, en wel door Onze Minister ten laste van ’s Rijks kas, indien het betreft een ontgronding als bedoeld in
      [artikel 8, eerste lid][ref4], en door gedeputeerde staten ten laste van de provinciale kas, indien het betreft een
      ontgronding als bedoeld in [artikel 8, tweede lid][ref5].

      2 De vergoeding kan worden toegekend, hetzij bij de beschikking inzake de vergunning, hetzij bij afzonderlijke
      beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
