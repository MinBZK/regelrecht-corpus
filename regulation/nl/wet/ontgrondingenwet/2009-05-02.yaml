  - number: '20'
    text: |-
      Indien het beroep is ingesteld door een ander dan de aanvrager of houder van de vergunning, wordt aan deze door de
      secretaris van de Raad van State terstond schriftelijk medegedeeld, dat het beroep is ingesteld.
    url: https://wetten.overheid.nl/BWBR0002505/2009-05-02#Artikel20
  - number: 21d
    text: |-
      Niet vatbaar voor afzonderlijk beroep is een mededeling inzake het verlenen van planologische medewerking als
      bedoeld in [artikel 10, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel10
