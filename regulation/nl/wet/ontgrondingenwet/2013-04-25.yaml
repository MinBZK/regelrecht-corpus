---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: ontgrondingenwet
regulatory_layer: WET
publication_date: '2002-11-14'
valid_from: '2013-04-25'
bwb_id: BWBR0002505
url: https://wetten.overheid.nl/BWBR0002505/2013-04-25
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is wettelijke regelen te stellen teneinde een
    doelmatige afweging van de verschillende bij ontgrondingen betrokken belangen te verzekeren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel1
  - number: 1.b
    text: |-
      planologisch medewerking verlenen: het nemen van een of meer besluiten krachtens de
      [Wet ruimtelijke ordening][ref1] door de raad onderscheidenlijk het college van burgemeester en wethouders van een
      gemeente of het bestuur van een provincie waarin die gemeente is gelegen, waardoor een ontgronding kan plaatsvinden
      zonder strijd met het bepaalde bij of krachtens [die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020449
      [ref2]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020449
      - id: ref2
        bwb_id: BWBR0020449
  - number: 1.c
    text: 'zomerbed:'
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel1
  - number: 1.c.1°
    text: |-
      oppervlakte tussen de denkbeeldige lijnen ter weerszijden van de stroomgeul bij gewoon hoog zomerwater of gewone
      vloed, die de as van de rivier volgen en de worteleinden van de kribben in de rivier met elkaar verbinden;
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel1
  - number: 1.c.2°
    text: |-
      voor zover geen kribben in de rivier aanwezig zijn: de oppervlakte tussen de oeverlijnen van de stroomgeul bij
      gewoon hoog zomerwater of gewone vloed, waarbij de oeverlijnen in een denkbeeldige lijn worden doorgetrokken op
      plaatsen waar water in de uiterwaard in open verbinding staat met de stroomgeul;
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel1
  - number: 1.c.3°
    text: nevengeulen in beheer bij het Rijk;
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel1
  - number: 1.c.4°
    text: bij het Rijk in beheer zijnde havens die in open verbinding staan met de stroomgeul.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel1
  - number: '2'
    text: |-
      Een ontgronding wordt geacht in de zee plaats te hebben, indien zij plaats heeft daar, waar de bodem bij gewone
      vloed of gewoon zomerpeil door het water van de zee wordt bedekt.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel2
  - number: '3.1'
    text: |-
      Het is verboden, behoudens het bepaalde in de [artikelen 12][ref1] en [31][ref2], zonder vergunning te ontgronden
      dan wel als eigenaar, erfpachter, vruchtgebruiker, opstalhouder, beklemde meier of gebruiker van enige onroerende
      zaak toe te laten, dat aldaar zonder vergunning ontgronding plaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel31
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '12'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002505
        artikel: '31'
        hoofdstuk: VI
  - number: '3.2'
    text: |-
      Aan een vergunning kunnen voorschriften worden verbonden ter bevordering en bescherming van belangen, betrokken
      bij de ontgronding, de herinrichting van de ontgronde onroerende zaken en de aanpassing van de omgeving van de
      ontgronde onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel3
  - number: '3.3'
    text: 'De in het tweede lid bedoelde voorschriften kunnen in ieder geval inhouden:'
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel3
  - number: 3.3.a
    text: |-
      dat een werkplan wordt overgelegd, volgens hetwelk de ontgronding zal geschieden, en dat het toestemming behoeft
      van een bij het voorschrift aangewezen bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel3
  - number: 3.3.b
    text: |-
      dat de onroerende zaken waarvoor een vergunning tot ontgronding wordt verleend, geheel of bij gedeelten in een bij
      het voorschrift omschreven toestand dienen te worden gebracht;
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel3
  - number: 3.3.c
    text: dat in plaats van de onder b bedoelde verplichting een bepaald bedrag ineens of bij gedeelten moet worden betaald;
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel3
  - number: 3.3.d
    text: |-
      dat de kosten van het beheer van de onroerende zaken die zijn ontgrond geheel of gedeeltelijk moeten worden
      betaald;
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel3
  - number: 3.3.e
    text: |-
      dat de kosten in verband met de aanpassingsinrichting van de omgeving van de ontgronde onroerende zaken,
      alsmede van het beheer van de aangepaste omgeving, voor zover zij het gevolg zijn van de ontgronding, geheel of
      gedeeltelijk moeten worden betaald;
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel3
  - number: 3.3.f
    text: dat financiële zekerheid moet worden gesteld voor het nakomen van krachtens de vergunning geldende verplichtingen;
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel3
  - number: 3.3.g
    text: dat moet worden voldaan aan door een bij het voorschrift aangewezen bestuursorgaan gestelde nadere eisen;
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel3
  - number: 3.3.h
    text: |-
      dat de vergunninghouder verplicht is technische maatregelen te treffen waardoor monumenten als bedoeld in
      [artikel 1, onderdeel b, van de Monumentenwet 1988][ref1] in de bodem kunnen worden behouden;


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel1
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '1'
  - number: 3.3.i
    text: |-
      dat de vergunninghouder verplicht is opgravingen te doen als bedoeld in
      [artikel 1, onderdeel h, van de Monumentenwet 1988][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel1
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '1'
  - number: 3.3.j
    text: |-
      dat de vergunninghouder verplicht is de ontgronding te laten begeleiden door een deskundige op het terrein
      van de archeologische monumentenzorg die voldoet aan door het vergunningverlenende bestuursorgaan te stellen
      kwalificaties.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel3
  - number: '3.4'
    text: |-
      Een financiële zekerheid als bedoeld in het derde lid, onder f, kan niet worden gevorderd van
      publiekrechtelijke lichamen. Op de toestemming, bedoeld in het derde lid, onder a, zijn de
      [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '3.5'
    text: |-
      Aan de vergunning kunnen ook voorschriften worden verbonden, inhoudende dat op een daarbij omschreven wijze moet
      worden aangegeven of aan andere vergunningvoorschriften wordt voldaan en dat de daarbij verkregen gegevens ter
      beschikking moeten worden gesteld van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel3
  - number: '3.6'
    text: |-
      Weigering, intrekking of wijziging van een vergunning kan geschieden op grond van strijd met de in het tweede lid
      bedoelde belangen.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel3
  - number: 3a
    text: |-
      Het is verboden te handelen in strijd met een voorschrift van een vergunning als bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel3
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '3'
        hoofdstuk: I
  - number: '4'
    text: 'Deze wet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel4
  - number: 4.a
    text: |-
      het – in geval van watersnood of dringend of dreigend gevaar voor doorbraak van dijken of voor overstroming – nemen
      van specie van gronden, welke ogenblikkelijk in bezit zijn genomen;
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel4
  - number: 4.b
    text: |-
      de uitvoering van een inrichtingsplan als bedoeld in
      [artikel 17, eerste lid, van de Wet inrichting landelijk gebied][ref1], met uitzondering van de ontgrondingen,
      welke geschieden ter verkrijging van het voor de werken nodige bodemmateriaal;


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel17
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '17'
  - number: 4.c
    text: |-
      de toepassing van [artikel 30][ref1] of [31 van de Wet bodembescherming][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel31
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: '31'
  - number: 4.d
    text: |-
      de toepassing van [artikel 13 van de Wet bodembescherming][ref1], de uitvoering van een saneringsplan als bedoeld
      in [artikel 39 van Wet bodembescherming][ref2] of een sanering als bedoeld in artikel 39b van die wet, mits de
      ontgronding niet verder gaat dan noodzakelijk is voor de technische realisering van een werk ter plaatse van de
      ontgronding;


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel39
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: '39'
  - number: 4.e
    text: |-
      de uitvoering van een beheerplan als bedoeld in [artikel 4.6 van de Waterwet][ref1], voor zover daarin maatregelen
      of voorzieningen zijn opgenomen in verband met een verontreiniging of aantasting van de bodem of oever van
      een oppervlaktewaterlichaam die een belemmering vormt voor het bereiken van de gewenste gebiedskwaliteit, met
      uitzondering van ontgrondingen, welke geschieden ter verkrijging van het voor die maatregelen of voorzieningen
      nodige bodemmateriaal;


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4'
  - number: 4.f
    text: |-
      de uitvoering van maatregelen als bedoeld in [artikel 5.15, eerste lid, van de Waterwet][ref1], met uitzondering
      van ontgrondingen, welke geschieden ter verkrijging van het voor die maatregelen nodige bodemmateriaal.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel5
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '5'
  - number: 4a
    text: |-
      Deze wet is mede van toepassing op ontgrondingen op het continentaal plat, bedoeld in
      [artikel 1 van de Mijnbouwwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: 4b
    text: |-
      De Staat is eigenaar van de op of onmiddellijk onder de oppervlakte van het continentaal plat aanwezige vaste
      stoffen, met inbegrip van de delfstoffen, bedoeld in [artikel 1 van de Mijnbouwwet][ref1], voorzover die
      delfstoffen op een diepte van minder dan 100 meter beneden de oppervlakte van het continentaal plat aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: '5.1'
    text: |-
      Bij algemene maatregel van bestuur worden omtrent ontgrondingen als bedoeld in [artikel 8, eerste lid][ref1],
      regels gesteld met betrekking tot de wijze waarop de aanvraag om een vergunning als bedoeld in
      [artikel 3, eerste lid][ref2], moet geschieden en de gegevens en bescheiden die door de aanvrager moeten worden
      verstrekt met het oog op de beslissing op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel3
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002505
        artikel: '3'
        hoofdstuk: I
  - number: '5.2'
    text: |-
      Bij provinciale verordening worden omtrent ontgrondingen als bedoeld in [artikel 8, tweede lid][ref1],
      regels gesteld met betrekking tot de wijze waarop de aanvraag om een vergunning als bedoeld in
      [artikel 3, eerste lid][ref2], moet geschieden en de gegevens en bescheiden die door de aanvrager moeten worden
      verstrekt met het oog op de beslissing op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel3
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002505
        artikel: '3'
        hoofdstuk: I
  - number: '6'
    text: |-
      Bij de maatregel, bedoeld in [artikel 5, eerste lid][ref1], kan worden bepaald dat overeenkomstig bij de maatregel
      te stellen regels een recht wordt geheven ter zake van de behandeling van de aanvraag om een vergunning of
      wijziging van een vergunning. Het tarief wordt zodanig vastgesteld dat de geraamde opbrengst van het recht de
      geraamde uitgaven niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel5
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '5'
        hoofdstuk: I
  - number: '7.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat het verbod van
      [artikel 3, eerste lid][ref1], niet geldt voor daarbij aan te duiden categorieën van ontgrondingen van beperkte
      betekenis voor de fysieke omgeving. Voor die categorieën kunnen bij of krachtens die maatregel regels worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel3
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '3'
        hoofdstuk: I
  - number: '7.2'
    text: |-
      Bij provinciale verordening kan voor daarbij aan te duiden categorieën van ontgrondingen, wegens haar
      bijzondere aard of met het oog op bijzondere gewestelijke omstandigheden, worden bepaald dat het verbod van
      [artikel 3, eerste lid][ref1], niet geldt. Voor die categorieën kunnen bij die verordening regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel3
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '3'
        hoofdstuk: I
  - number: '7.3'
    text: |-
      Een regeling als bedoeld in het eerste of tweede lid kan voorts inhouden dat met betrekking tot ontgrondingen ten
      aanzien waarvan met toepassing van het eerste of tweede lid is bepaald dat het vergunningvereiste niet geldt, de
      verplichting geldt tot het melden van het voornemen te ontgronden aan een daarbij aangewezen bestuursorgaan. Bij
      toepassing van de eerste volzin worden voorts aangegeven het tijdstip, voorafgaand aan het ontgronden, waarop de
      melding uiterlijk moet zijn gedaan, alsmede de gegevens die bij de melding moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel7
  - number: '8.1'
    text: |-
      Onze Minister is bevoegd een vergunning als bedoeld in [artikel 3][ref1] te verlenen, te wijzigen of in te trekken,
      indien zij een ontgronding betreft in bij ministeriële regeling aan te wijzen rijkswateren.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel3
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '3'
        hoofdstuk: I
  - number: '8.2'
    text: |-
      Ten aanzien van andere dan de in het eerste lid bedoelde ontgrondingen berust de bevoegdheid tot verlening,
      wijziging of intrekking van een vergunning bij gedeputeerde staten van de provincie waarin de betrokken onroerende
      zaak is gelegen.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel8
  - number: '8.3'
    text: |-
      Ten aanzien van ontgrondingen in een tot de rijkswateren behorende rivier heeft de in het eerste lid bedoelde
      bevoegdheid betrekking op het zomerbed van de rivier. Voor het niet tot het zomerbed behorende gedeelte van de
      rivier tot aan de begrenzing van de rivier ingevolge [artikel 3.1, tweede lid, van de Waterwet][ref1] oefenen
      gedeputeerde staten hun in het tweede lid bedoelde bevoegdheid uit in overeenstemming met Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '3'
  - number: '10.1'
    text: |-
      Op de voorbereiding van een beschikking als bedoeld in [artikel 8][ref1] zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] en [afdeling 13.2 van de Wet milieubeheer][ref3] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: '10.2'
    text: |-
      Het college van burgemeester en wethouders van ieder van de gemeenten op het gebied waarvan de aanvrage om
      vergunning betrekking heeft, deelt aan het ingevolge [artikel 8][ref1] bevoegde gezag binnen acht weken nadat
      het verzoek daartoe is ingekomen, mee of de beoogde ontgronding in overeenstemming is met het bestemmingsplan,
      een ter inzage gelegd ontwerp hiervoor, een voorbereidingsbesluit ter zake of een beheersverordening als bedoeld
      in [artikel 3.38 van de Wet ruimtelijke ordening][ref2], en deelt, zo zulks niet het geval is, mee of de raad
      onderscheidenlijk het college van burgemeester en wethouders bereid is aan de ontgronding planologische medewerking
      te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: '10.3'
    text: |-
      Indien Onze Minister het ingevolge [artikel 8][ref1] bevoegde gezag is, delen gedeputeerde staten van de
      provincie op het gebied waarvan de aanvrage om vergunning betrekking heeft, binnen zes weken nadat het verzoek
      daartoe is ingekomen, mee of de beoogde ontgronding in overeenstemming is met een inpassingsplan, als bedoeld
      in [artikel 3.26 van de Wet ruimtelijke ordening][ref2], een ter inzage gelegd ontwerp hiervoor of de regels,
      gesteld bij of krachtens een verordening als bedoeld in [artikel 4.1 van die wet][ref3], alsmede, zo zulks niet
      het geval is, of provinciale staten of gedeputeerde staten bereid zijn aan de ontgronding planologische medewerking
      te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '4'
  - number: '10.4'
    text: |-
      Met betrekking tot ontgrondingen van eenvoudige aard, waarbij andere belangen niet of nauwelijks zijn betrokken,
      kan bij de regelingen, bedoeld in [artikel 5][ref1], voor daarbij aan te wijzen gevallen worden afgeweken van het
      bepaalde bij de voorgaande leden.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel5
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '5'
        hoofdstuk: I
  - number: '10.5'
    text: |-
      Beschikkingen als bedoeld in het eerste lid worden genomen na afweging van de in [artikel 3, tweede lid][ref1],
      bedoelde belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel3
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '3'
        hoofdstuk: I
  - number: '10.6'
    text: |-
      Een vergunning wordt niet verleend of gewijzigd indien de beoogde ontgronding in strijd is met een ruimtelijk
      besluit, tenzij die strijd naar verwachting zal worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel10
  - number: 10a.1
    text: |-
      Het ingevolge [artikel 8][ref1] bevoegde bestuursorgaan bevordert een gecoördineerde voorbereiding van de voor de
      ontgronding benodigde besluiten wanneer de aanvrager daarom verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
  - number: 10a.2
    text: |-
      Indien een plaats die is bestemd voor de winning van vaste stoffen door middel van ontgronding is vastgesteld in een
      inpassings- of bestemmingsplan als bedoeld in [artikel 3.26][ref1] of [3.1 van de Wet ruimtelijke ordening][ref2]
      of in een beheersverordening als bedoeld in [artikel 3.38 van die wet][ref3], heeft de coördinatie betrekking op
      alle verder voor de ontgronding benodigde besluiten. In de andere gevallen heeft de coördinatie geen betrekking op
      de in [artikel 3][ref4] bedoelde vergunning, tenzij de aanvrager daarom verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002505#Artikel3
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0002505
        artikel: '3'
        hoofdstuk: I
  - number: 10b.1
    text: |-
      Het ingevolge [artikel 8][ref1] bevoegde bestuursorgaan kan van de andere betrokken bestuursorganen de medewerking
      vorderen, die voor het welslagen van de coördinatie nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
  - number: 10b.2
    text: De in het eerste lid bedoelde bestuursorganen verlenen de van hen gevorderde medewerking.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel10b
  - number: 10c
    text: |-
      Op de voorbereiding van de in [artikel 10a, eerste lid][ref1], bedoelde besluiten is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: 10a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 10c.a
    text: |-
      de ontwerpen van de besluiten binnen een door het ingevolge [artikel 8][ref1] bevoegde bestuursorgaan
      te bepalen termijn worden toegezonden aan het bestuursorgaan, dat zorg draagt voor de in
      [artikel 3:13, eerste lid, van die wet][ref2] bedoelde toezending;


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 10c.b
    text: |-
      het ingevolge [artikel 8][ref1] bevoegde bestuursorgaan ten aanzien van de ontwerpen van de besluiten gezamenlijk
      toepassing kan geven aan de [artikelen 3:11, eerste lid][ref2], en [3:12 van die wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 10c.c
    text: zienswijzen naar voren kunnen worden gebracht door een ieder;
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel10c
  - number: 10c.d
    text: |-
      in afwijking van [artikel 3:18, eerste lid, van die wet][ref1] de besluiten worden genomen binnen een door het
      ingevolge [artikel 8][ref2] bevoegde bestuursorgaan te bepalen termijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
  - number: 10c.e
    text: |-
      de besluiten onverwijld worden gezonden aan het ingevolge [artikel 8][ref1] bevoegde bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
  - number: 10d.1
    text: |-
      Indien het bestuursorgaan dat in eerste aanleg bevoegd is te beslissen op een aanvraag om een besluit als bedoeld
      in [artikel 10a, eerste lid][ref1], niet of niet tijdig op de aanvraag beslist, kan het ingevolge [artikel 8][ref2]
      bevoegde bestuursorgaan een beslissing op de aanvraag nemen. In dat laatste geval treedt zijn besluit in de
      plaats van het besluit van het in eerste aanleg bevoegde bestuursorgaan. Indien het ingevolge [artikel 8][ref3]
      bevoegde bestuursorgaan voornemens is zelf een beslissing op de aanvraag te nemen, pleegt het overleg met het
      bestuursorgaan, dat in eerste aanleg bevoegd is op de aanvraag te beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: 10a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
  - number: 10d.2
    text: Het eerste lid is van overeenkomstige toepassing op ambtshalve te nemen besluiten.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel10d
  - number: 10d.3
    text: |-
      Indien ingevolge het eerste of tweede lid de beslissing op een aanvraag of het ambtshalve te nemen besluit wordt
      genomen door het ingevolge [artikel 8][ref1] bevoegde bestuursorgaan, stort het bestuursorgaan dat in eerste aanleg
      bevoegd was, de ter zake ontvangen leges in de kas van dat bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
  - number: 10e
    text: |-
      De in [artikel 10a, eerste lid][ref1], bedoelde besluiten worden, voor zover ten aanzien daarvan
      [artikel 10c][ref2] is toegepast, gelijktijdig door het ingevolge [artikel 8][ref3] bevoegde bestuursorgaan
      bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel10c
      [ref3]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel10e
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: 10a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002505
        artikel: 10c
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
  - number: '11.1'
    text: |-
      De raad onderscheidenlijk het college van burgemeester en wethouders verleent uiterlijk binnen een jaar na het
      onherroepelijk worden van de beschikking van Onze Minister of van gedeputeerde staten op de aanvrage om een
      vergunning ter zake van de in die beschikking bedoelde ontgronding planologische medewerking, voor zover het
      overeenkomstig [artikel 10, tweede lid][ref1], ten aanzien van die ontgronding de bereidheid tot het verlenen van
      zodanige medewerking heeft aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel10
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '10'
        hoofdstuk: II
  - number: '11.2'
    text: |-
      Provinciale staten of gedeputeerde staten verlenen uiterlijk binnen een jaar na het onherroepelijk worden van
      de beschikking van Onze Minister op de aanvrage om een vergunning ter zake van de in die beschikking bedoelde
      ontgronding planologische medewerking, voor zover gedeputeerde staten overeenkomstig [artikel 10, derde lid][ref1],
      ten aanzien van die ontgronding de bereidheid tot het verlenen van zodanige medewerking hebben aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel10
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '10'
        hoofdstuk: II
  - number: '12.1'
    text: |-
      Indien naar het oordeel van het ingevolge [artikel 8][ref1], bevoegde gezag met de uitvoering van een
      ontgronding niet kan worden gewacht, kan dat gezag machtiging verlenen om, zolang op de aanvrage niet
      onherroepelijk is beslist, de uitvoering aan te vangen. Deze machtiging wordt niet verleend, zolang de in
      [artikel 3:16, eerste lid, van de Algemene wet bestuursrecht][ref2] bedoelde termijn niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '12.2'
    text: |-
      Deze machtiging wordt verleend onder de voorwaarde, dat zekerheid wordt gesteld voor de betaling van de kosten om
      de betrokken onroerende zaak in een zodanige toestand te brengen als bij deze machtiging wordt bepaald, indien de
      vergunning wordt geweigerd of van een verleende vergunning geen gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel12
  - number: '16'
    text: |-
      Een beschikking op grond van [Hoofdstuk II][ref1] van deze wet tot verlening, wijziging of intrekking van een
      vergunning treedt in werking met ingang van de dag na de dag waarop de termijn afloopt voor het indienen van een
      bezwaarschrift dan wel, indien ingevolge [artikel 7:1, eerste lid, onder d, van de Algemene wet bestuursrecht][ref2]
      geen bezwaar kan worden gemaakt, van een beroepschrift. Indien gedurende de termijn bij de voorzitter van de
      Afdeling bestuursrechtspraak van de Raad van State een verzoek om voorlopige voorziening is gedaan, treedt de
      beschikking niet in werking voordat op dat verzoek is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002505
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '20'
    text: |-
      Indien het beroep is ingesteld door een ander dan de aanvrager of houder van de vergunning, wordt aan deze door de
      secretaris van de Raad van State terstond schriftelijk medegedeeld, dat het beroep is ingesteld.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel20
  - number: 21f.1
    text: 'Provinciale staten zijn bevoegd bij wijze van provinciale belasting een heffing in te stellen ter bestrijding van:'
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel21f
  - number: 21f.1.a
    text: |-
      kosten met betrekking tot schadevergoedingen ingevolge [artikel 26][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel26
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel21f
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '26'
        hoofdstuk: V
  - number: 21f.1.b
    text: |-
      kosten met betrekking tot het onderzoek naar het verband tussen een ontgronding en schade aan onroerende zaken en
      de bepaling van de omvang van de schade.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel21f
  - number: 21f.2
    text: |-
      De heffing is verschuldigd ter zake van het verlenen van een vergunning of machtiging als bedoeld in de
      [artikelen 3][ref1] en [12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel12
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel21f
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002505
        artikel: '12'
        hoofdstuk: II
  - number: 21f.3
    text: |-
      Aan de heffing worden onderworpen de houders van vergunningen en machtigingen als bedoeld in de [artikelen 3][ref1]
      en [12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel12
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel21f
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002505
        artikel: '12'
        hoofdstuk: II
  - number: 21f.4
    text: |-
      Als grondslag voor de heffing geldt de ingevolge de vergunning of machtiging te winnen hoeveelheid vaste stoffen,
      gemeten in profiel van ontgraving.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel21f
  - number: 21f.5
    text: 'Vrijgesteld van de heffing zijn:'
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel21f
  - number: 21f.5.a
    text: |-
      hoeveelheden van minder dan 10 000 kubieke meter ingevolge de vergunning of machtiging te winnen vaste stoffen,
      gemeten in profiel van ontgraving;
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel21f
  - number: 21f.5.b
    text: hoeveelheden ten aanzien waarvan de heffing eerder is geheven.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel21f
  - number: 21f.6
    text: |-
      Het vijfde lid, aanhef en onder b, is niet van toepassing voor zover is geheven ten behoeve van een in het eerste
      lid bedoelde bestemming en nadien wordt geheven voor een andere in dat lid bedoelde bestemming.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel21f
  - number: 21f.7
    text: |-
      Ten behoeve van de in het eerste lid, onder a en b, bedoelde bestemmingen worden afzonderlijke tarieven
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel21f
  - number: 21f.8
    text: |-
      Indien een vergunning of machtiging wordt vernietigd of ingetrokken dan wel wordt gewijzigd in die zin dat de
      toegestane te winnen hoeveelheid vaste stoffen wordt verminderd, vindt op verzoek van de heffingplichtige teruggaaf
      van de heffing plaats voor zover de vergunning of machtiging is vernietigd of ingetrokken dan wel de hoeveelheid
      vaste stoffen voor de winning waarvan vergunning of machtiging is verleend, is verminderd.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel21f
  - number: 21f.9
    text: Teruggaaf blijft achterwege indien het bedrag dat moet worden teruggegeven minder bedraagt dan € 250.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel21f
  - number: 21f.10
    text: De heffing wordt geheven bij wege van aanslag.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel21f
  - number: 21f.11
    text: |-
      Indien het eerste lid, onder b, wordt toegepast, worden bij provinciale verordening regels gesteld omtrent de
      procedure met betrekking tot de behandeling van de aanvraag om vergoeding van kosten als bedoeld in het eerste lid,
      onder b, en de advisering omtrent de aanvraag.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel21f
  - number: 21g.1
    text: |-
      Indien Onze Minister in verband met de toepassing van deze wet onderzoek ter plaatse nodig oordeelt, is hij
      bevoegd de rechthebbenden ten aanzien van gronden of wateren waar dat onderzoek wordt ingesteld de verplichting
      op te leggen het verrichten van dat onderzoek, alsmede het aanbrengen, het aanwezig zijn, het onderhoud, het
      gebruik en het verwijderen van de voor dat onderzoek nodige middelen te gedogen, onverminderd het recht van deze
      rechthebbenden op schadevergoeding. Gelijke bevoegdheid als bedoeld in de vorige volzin komt toe aan gedeputeerde
      staten.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel21g
  - number: 21g.2
    text: |-
      Een beschikking tot oplegging van een gedoogplicht wordt tenminste twee weken voor de aanvang van het onderzoek
      bekendgemaakt aan de rechthebbenden.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel21g
  - number: 21h.1
    text: |-
      Indien de aanvrager of de houder van een vergunning of degene die voornemens is een
      aanvrage in te dienen ter verkrijging van de gegevens die ingevolge het bepaalde krachtens
      [artikel 5, eerste onderscheidenlijk tweede lid][ref1], moeten worden verschaft in een aanvrage om een vergunning
      of wijziging van een vergunning, onderzoek moet verrichten in gronden of wateren ten aanzien waarvan hij niet de
      rechthebbende is, kan hij Onze Minister onderscheidenlijk gedeputeerde staten verzoeken daartoe een gedoogplicht
      overeenkomstig [artikel 21g][ref2] op te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel21g
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel21h
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '5'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002505
        artikel: 21g
        hoofdstuk: IV
  - number: 21h.2
    text: |-
      Hij legt hiertoe over een opgave van de ligging van de gronden of wateren, van de namen en woonplaatsen van de
      rechthebbenden daarvan, alsmede van de aard der onderzoekingen.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel21h
  - number: 21h.3
    text: |-
      Bij de beschikking tot het opleggen van de gedoogplicht worden zodanige voorschriften gesteld jegens degene op
      wiens verzoek de gedoogplicht wordt opgelegd, dat de vergoeding van schade aan de rechthebbende op voldoende wijze
      is verzekerd.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel21h
  - number: '22'
    text: |-
      Met betrekking tot de handhaving van het bij of krachtens deze wet bepaalde zijn de [artikelen 5.10][ref1],
      [5.13 tot en met 5.16][ref2] en [5.18 tot en met 5.23 van de Wet algemene bepalingen omgevingsrecht][ref3] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel5
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '5'
  - number: '26.1'
    text: |-
      Voorzover blijkt dat de aanvrager, de houder van de vergunning of degene die overeenkomstig [afdeling 3.4][ref1]
      of [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref2] zijn zienswijze naar voren heeft gebracht, ten
      gevolge van een beschikking ter zake van een ontgronding als bedoeld in [artikel 8][ref3] schade lijdt of zal
      lijden, welke redelijkerwijze niet of niet geheel te zijnen laste behoort te blijven en waarvan de vergoeding
      niet of niet voldoende op andere wijze is verzekerd, wordt hem een naar billijkheid te bepalen schadevergoeding
      toegekend, en wel door Onze Minister ten laste van ’s Rijks kas, indien het betreft een ontgronding als bedoeld in
      [artikel 8, eerste lid][ref4], en door gedeputeerde staten ten laste van de provinciale kas, indien het betreft een
      ontgronding als bedoeld in [artikel 8, tweede lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref3]: https://wetten.overheid.nl/BWBR0002505#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002505#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref3
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
  - number: '26.2'
    text: |-
      De vergoeding kan worden toegekend, hetzij bij de beschikking inzake de vergunning, hetzij bij afzonderlijke
      beschikking.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel26
  - number: '27'
    text: |-
      Indien door Onze Minister of door gedeputeerde staten ten behoeve van belangen, behartigd of mede behartigd door
      andere openbare lichamen dan het Rijk onderscheidenlijk de provincie, een beschikking wordt gegeven naar aanleiding
      waarvan een vergoeding wordt toegekend als bedoeld in [artikel 26][ref1], kan bij die beschikking aan die andere
      lichamen, hun bestuur gehoord, worden opgelegd de kosten, die het gevolg zijn van het behartigen van die belangen,
      geheel of gedeeltelijk te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel26
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '26'
        hoofdstuk: V
  - number: '28'
    text: |-
      Indien bij een beschikking als bedoeld in [artikel 8][ref1] geen vergoeding is toegekend, kan zij worden
      aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
        hoofdstuk: II
  - number: 29a.1
    text: |-
      De [artikelen 26 tot en met 28][ref1] zijn van overeenkomstige toepassing ten aanzien van schade die een
      rechthebbende als bedoeld in [artikel 21g][ref2] lijdt of zal lijden tengevolge van het opleggen van een
      gedoogplicht als bedoeld in dat artikel in andere gevallen dan bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel21g
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '26'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002505
        artikel: 21g
        hoofdstuk: IV
  - number: 29a.2
    text: |-
      De schade tengevolge van het in [artikel 21h][ref1] bedoelde onderzoek wordt vergoed door degene op wiens verzoek
      de gedoogplicht is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel21h
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: 21h
        hoofdstuk: IV
  - number: '33'
    text: |-
      De bevoegdheid tot het maken van gemeentelijke verordeningen blijft ten aanzien van het onderwerp, waarin deze wet
      voorziet, gehandhaafd, voor zover die verordeningen niet met deze wet in strijd zijn.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel33
  - number: '34.1'
    text: |-
      Deze wet laat de bevoegdheden tot het vaststellen van wettelijke regelingen in het belang van de waterkering, ook
      voorzover daarbij het ontgronden wordt verboden of beperkt, onverlet.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel34
  - number: '34.2'
    text: Bestaande bepalingen van deze strekking blijven van kracht.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel34
  - number: '35'
    text: Deze wet kan worden aangehaald als "Ontgrondingenwet".
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel35
  - number: '36'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002505/2013-04-25#Artikel36
