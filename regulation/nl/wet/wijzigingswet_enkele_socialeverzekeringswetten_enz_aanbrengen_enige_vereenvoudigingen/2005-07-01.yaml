preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in enkele socialeverzekeringswetten en enige andere
    wetten enige vereenvoudigingen aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017841/2005-07-01#ArtikelAanhef
articles:
  - number: IX
    text: |-
      In afwijking van [artikel 28a van de Beroepswet][ref1]

      1. is de [bijlage bij de Beroepswet](onbekend), zoals deze komt te luiden op grond van [artikel VIII][ref2], van
      toepassing ten aanzien van de mogelijkheid om hoger beroep in te stellen tegen een uitspraak inzake een besluit als
      bedoeld in [nr. 33a van die bijlage](onbekend); en

      2. gaan de bij de Centrale Raad van Beroep aanhangige zaken inzake besluiten als bedoeld in [nr. 33a van de bijlage
      bij de Beroepswet](onbekend) van rechtswege over naar de Afdeling bestuursrechtspraak van de Raad van State, met
      uitzondering van de zaken waarin de uitnodiging of oproeping voor de zitting heeft plaatsgevonden dan wel partijen
      toestemming hebben gegeven het onderzoek ter zitting achterwege te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0002170#Artikel28a
      [ref2]: https://wetten.overheid.nl/BWBR0017841#ArtikelVIII
