preamble:
  text: |-
    Gelet op artikel 15, eerste lid, van de Algemene Ouderdomswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. de AOW: de [Algemene Ouderdomswet][ref1];

      b. de Bank: de Sociale Verzekeringsbank;

      c. ouderdomspensioen: ouderdomspensioen of toeslag ingevolge [Hoofdstuk III van de AOW][ref2];

      d. de pensioengerechtigde: degene aan wie ouderdomspensioen is toegekend;

      e. de partner: degene die op grond van [artikel 1, tweede en derde lid AOW][ref3] als echtgenoot van de
      pensioengerechtigde wordt beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0002221#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel1
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0002221
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '1'
  - number: '2'
    text: |-
      1 Dit besluit is van toepassing op:

      a. de pensioengerechtigde;

      b. de partner van de pensioengerechtigde;

      c. de wettelijke vertegenwoordiger van de pensioengerechtigde;

      d. de instelling waaraan ingevolge [artikel 20 AOW][ref1] ouderdomspensioen wordt uitbetaald.

      2 Dit besluit is ook van toepassing als de in het eerste lid bedoelde personen in het buitenland wonen en als de in
      het eerste lid bedoelde instelling in het buitenland is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel20
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '20'
  - number: '3'
    text: |-
      1 De in [artikel 2, eerste lid][ref1], bedoelde persoon of instelling stelt de Bank onverwijld in kennis van een
      wijziging in het adres van de pensioengerechtigde of diens partner.

      2 De kennisgeving bedoeld in het eerste lid kan bij een verhuizing in Nederland achterwege
      blijven, indien de wijziging in het adres aan de gemeente is gemeld binnen de in de
      [Wet gemeentelijke basisadministratie persoonsgegevens][ref2] gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007871#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007871
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006723
  - number: '4'
    text: |-
      1 Op verzoek van de Bank verstrekt de in [artikel 2, eerste lid][ref1], bedoelde persoon of instelling binnen
      de door de Bank gestelde termijn en met gebruikmaking van de door de Bank ter beschikking gestelde formulieren
      informatie welke van belang kan zijn voor het recht op, de hoogte van of de uitbetaling van het pensioen.

      2 Op verzoek van de Bank legt de in [artikel 2, eerste lid][ref2], bedoelde persoon of instelling binnen de door de
      Bank gestelde termijn over:

      a. een naar waarheid en volledig ingevuld, ondertekend formulier inzake het inkomen van de partner van de
      pensioengerechtigde, met betrekking tot perioden waarin die partner jonger is dan 65 jaar;

      b. bewijsstukken van het inkomen van die partner;

      c. bewijsstukken met betrekking tot het al dan niet voeren van een gezamenlijke huishouding met een partner;

      d. andere door de Bank gevraagde bewijsstukken welke van belang zijn voor de vaststelling van het recht op, de
      hoogte van of de uitbetaling van het pensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0007871#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007871#Artikel2
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel4
    references:
      - id: ref1
