  - number: '6'
    text: |-
      1 De in [artikel 2, eerste lid][ref1], bedoelde persoon verschijnt, indien hij in Nederland woont, na een oproep
      van de Bank op het kantoor van de Bank en verstrekt de gevraagde gegevens.

      2 De in [artikel 2, eerste lid][ref2], bedoelde persoon verschijnt, indien hij buiten Nederland woont, na een
      oproep van de Bank op een door de Bank te bepalen kantoor en verstrekt de gevraagde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0007871#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007871#Artikel2
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel6
