      - id: ref2
        bwb_id: BWBR0007871
        artikel: '2'
        hoofdstuk: '1'
  - number: '5'
    text: |-
      1 Op verzoek van de Bank geeft de in [artikel 2, eerste lid][ref1] bedoelde persoon of instelling op een door de
      Bank vastgesteld tijdstip aan de Bank boeken, documenten en andere informatiedragers ter inzage en stelt deze voor
      het maken van een kopie ter beschikking.

      2 Op verzoek van de Bank verstrekt de in [artikel 2, eerste lid][ref2], bedoelde persoon of instelling aan de Bank
      terstond een geldig identificatiebewijs, zoals bedoeld in de [Wet op de Identificatieplicht][ref3], ter inzage.

      3 Woont de pensioengerechtigde of diens partner in het buitenland, dan legt de in [artikel 2, eerste lid][ref4],
      bedoelde persoon of instelling op verzoek van de Bank op door de Bank vast te stellen tijdstippen een door een
      bevoegde autoriteit gewaarmerkt levensbewijs van degene die buiten Nederland woont over.


      [ref1]: https://wetten.overheid.nl/BWBR0007871#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007871#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006297
      [ref4]: https://wetten.overheid.nl/BWBR0007871#Artikel2
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel5
