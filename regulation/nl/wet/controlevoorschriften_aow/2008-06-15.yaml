---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: controlevoorschriften_aow
regulatory_layer: WET
publication_date: '2023-11-22'
valid_from: '2008-06-15'
bwb_id: BWBR0007871
url: https://wetten.overheid.nl/BWBR0007871/2008-06-15
preamble:
  text: |-
    Gelet op artikel 15, eerste lid, van de Algemene Ouderdomswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel1
  - number: 1.a
    text: |-
      de AOW: de [Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 1.b
    text: 'de Bank: de Sociale Verzekeringsbank;'
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel1
  - number: 1.c
    text: |-
      ouderdomspensioen: ouderdomspensioen of toeslag ingevolge [Hoofdstuk III van de AOW][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002221
        hoofdstuk: III
  - number: 1.d
    text: 'de pensioengerechtigde: degene aan wie ouderdomspensioen is toegekend;'
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel1
  - number: 1.e
    text: |-
      de partner: degene die op grond van [artikel 1, tweede en derde lid AOW][ref1] als echtgenoot van de
      pensioengerechtigde wordt beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel1
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '1'
  - number: '2.1'
    text: 'Dit besluit is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel2
  - number: 2.1.a
    text: de pensioengerechtigde;
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel2
  - number: 2.1.b
    text: de partner van de pensioengerechtigde;
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel2
  - number: 2.1.c
    text: de wettelijke vertegenwoordiger van de pensioengerechtigde;
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel2
  - number: 2.1.d
    text: |-
      de instelling waaraan ingevolge [artikel 20 AOW][ref1] ouderdomspensioen wordt uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel20
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '20'
  - number: '2.2'
    text: |-
      Dit besluit is ook van toepassing als de in het eerste lid bedoelde personen in het buitenland wonen en als de in
      het eerste lid bedoelde instelling in het buitenland is gevestigd.
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel2
  - number: '3.1'
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde persoon of instelling stelt de Bank onverwijld in kennis van een
      wijziging in het adres van de pensioengerechtigde of diens partner.


      [ref1]: https://wetten.overheid.nl/BWBR0007871#Artikel2
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007871
        artikel: '2'
        hoofdstuk: '1'
  - number: '3.2'
    text: |-
      De kennisgeving bedoeld in het eerste lid kan bij een verhuizing in Nederland achterwege
      blijven, indien de wijziging in het adres aan de gemeente is gemeld binnen de in de
      [Wet gemeentelijke basisadministratie persoonsgegevens][ref1] gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006723
  - number: '4.1'
    text: |-
      Op verzoek van de Bank verstrekt de in [artikel 2, eerste lid][ref1], bedoelde persoon of instelling binnen de door
      de Bank gestelde termijn en met gebruikmaking van de door de Bank ter beschikking gestelde formulieren informatie
      welke van belang kan zijn voor het recht op, de hoogte van of de uitbetaling van het pensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0007871#Artikel2
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007871
        artikel: '2'
        hoofdstuk: '1'
  - number: '4.2'
    text: |-
      Op verzoek van de Bank legt de in [artikel 2, eerste lid][ref1], bedoelde persoon of instelling binnen de door de
      Bank gestelde termijn over:


      [ref1]: https://wetten.overheid.nl/BWBR0007871#Artikel2
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007871
        artikel: '2'
        hoofdstuk: '1'
  - number: 4.2.a
    text: |-
      een naar waarheid en volledig ingevuld, ondertekend formulier inzake het inkomen van de partner van de
      pensioengerechtigde, met betrekking tot perioden waarin die partner jonger is dan 65 jaar;
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel4
  - number: 4.2.b
    text: bewijsstukken van het inkomen van die partner;
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel4
  - number: 4.2.c
    text: bewijsstukken met betrekking tot het al dan niet voeren van een gezamenlijke huishouding met een partner;
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel4
  - number: 4.2.d
    text: |-
      andere door de Bank gevraagde bewijsstukken welke van belang zijn voor de vaststelling van het recht op, de hoogte
      van of de uitbetaling van het pensioen.
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel4
  - number: '5.1'
    text: |-
      Op verzoek van de Bank geeft de in [artikel 2, eerste lid][ref1] bedoelde persoon of instelling op een door de Bank
      vastgesteld tijdstip aan de Bank boeken, documenten en andere informatiedragers ter inzage en stelt deze voor het
      maken van een kopie ter beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0007871#Artikel2
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007871
        artikel: '2'
        hoofdstuk: '1'
  - number: '5.2'
    text: |-
      Op verzoek van de Bank verstrekt de in [artikel 2, eerste lid][ref1], bedoelde persoon of instelling aan de Bank
      terstond een geldig identificatiebewijs, zoals bedoeld in de [Wet op de Identificatieplicht][ref2], ter inzage.


      [ref1]: https://wetten.overheid.nl/BWBR0007871#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006297
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007871
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006297
  - number: '5.3'
    text: |-
      Woont de pensioengerechtigde of diens partner in het buitenland, dan legt de in [artikel 2, eerste lid][ref1],
      bedoelde persoon of instelling op verzoek van de Bank op door de Bank vast te stellen tijdstippen een door een
      bevoegde autoriteit gewaarmerkt levensbewijs van degene die buiten Nederland woont over.


      [ref1]: https://wetten.overheid.nl/BWBR0007871#Artikel2
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007871
        artikel: '2'
        hoofdstuk: '1'
  - number: '6.1'
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde persoon verschijnt, indien hij in Nederland woont, na een oproep van
      de Bank op het kantoor van de Bank en verstrekt de gevraagde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0007871#Artikel2
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007871
        artikel: '2'
        hoofdstuk: '1'
  - number: '6.2'
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde persoon verschijnt, indien hij buiten Nederland woont, na een oproep
      van de Bank op een door de Bank te bepalen kantoor en verstrekt de gevraagde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0007871#Artikel2
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007871
        artikel: '2'
        hoofdstuk: '1'
  - number: '7'
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde persoon of instelling maakt controle mogelijk door personen die
      daarmee door de Bank zijn belast.


      [ref1]: https://wetten.overheid.nl/BWBR0007871#Artikel2
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007871
        artikel: '2'
        hoofdstuk: '1'
  - number: '8'
    text: Deze voorschriften treden in werking twee dagen na plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel8
  - number: '9'
    text: 'Dit besluit wordt aangehaald als: ’Controlevoorschriften AOW’.'
    url: https://wetten.overheid.nl/BWBR0007871/2008-06-15#Artikel9
