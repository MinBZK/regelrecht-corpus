---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: tijdelijke_beleidsregeling_bijdragen_vaarwegaansluitingen
regulatory_layer: WET
publication_date: '1995-12-20'
valid_from: '1996-01-01'
bwb_id: BWBR0007716
url: https://wetten.overheid.nl/BWBR0007716/1996-01-01
preamble:
  text: 'Besluit:'
  url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            vaarwegaansluiting:

              aansluiting van een bedrijfsterrein of haventerrein op het vaarwegennet via een niet-openbare terminal waar
      overslag plaatsvindt uitsluitend ten behoeve van één of enkele verladers;



            Minister:

              Minister van Verkeer en Waterstaat;



            Besluit:

              [Besluit Infrastructuurfonds][ref1];



            bijdrage:

              bijdrage voor een investering, bedoeld in [artikel 2, eerste lid][ref2], van het Besluit.



            infrastructuur:

              voorzieningen die ten behoeve van een vaarwegaansluiting moeten worden gerealiseerd, niet zijnde
      overslagfaciliteiten


      [ref1]: https://wetten.overheid.nl/BWBR0006264
      [ref2]: https://wetten.overheid.nl/BWBR0006264#Artikel2
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006264
      - id: ref2
        bwb_id: BWBR0006264
        artikel: '2'
  - number: '2'
    text: |-
      De Minister kan bijdragen verstrekken in de investeringskosten ten behoeve van vaarwegaansluitingen, waaronder
      mede begrepen de uitbreiding of verbetering van bestaande vaarwegaansluitingen of het reactiveren van in onbruik
      geraakte vaarwegaansluitingen in het kader van de stimulering van intermodaal en multimodaal vervoer. De bijdrage
      kan worden verstrekt voor zowel investeringen ten behoeve van de infrastructuur als ten behoeve van de vast
      geïnstalleerde en mobiele uitrusting die nodig is voor de overslag van en naar de vaarweg.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel2
  - number: '3.1'
    text: Het subsidieplafond bedraagt voor het jaar 1996 f 5.000.000,‐.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel3
  - number: '3.2'
    text: |-
      De Minister stelt in het meerjarenprogramma, bedoeld in [artikel 1 van de Wet Infrastructuurfonds][ref1], het
      subsidieplafond vast voor het eerstvolgende kalenderjaar, beginnend met het jaar 1997.


      [ref1]: https://wetten.overheid.nl/BWBR0006001#Artikel1
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006001
        artikel: '1'
  - number: '4.1'
    text: |-
      De aanvraag om een bijdrage wordt ingediend door tussenkomst van de Hoofdingenieur-Directeur van Rijkswaterstaat in
      de betrokken regio.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel4
  - number: '4.2'
    text: |-
      Bij een aanvraag verstrekt de aanvrager, onverminderd [artikel 4, eerste lid][ref1], van het Besluit:


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel4
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '4'
  - number: 4.2.a
    text: een onderbouwing van het project;
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel4
  - number: 4.2.b
    text: een overzicht van de financiering van het project;
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel4
  - number: 4.2.c
    text: een overzicht van alle maatregelen die voor de totstandkoming van de vaarwegaansluiting moeten worden getroffen;
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel4
  - number: 4.2.d
    text: een opgave van het jaar waarin het project wordt voltooid; en
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel4
  - number: 4.2.e
    text: |-
      de voorgenomen garantie, bedoeld in [artikel 7, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007716#Artikel7
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007716
        artikel: '7'
        paragraaf: '3'
  - number: '4.3'
    text: |-
      Indien een aanvraag niet volledig is, stelt de Minister de aanvrager in de gelegenheid binnen vier weken de
      aanvraag aan te vullen. Indien na ommekomst van deze termijn de aanvraag niet volledig is, besluit de Minister de
      aanvraag niet te behandelen.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel4
  - number: '5'
    text: |-
      De Minister beslist niet op de aanvraag zolang op een verzoek tot surséance van betaling of faillissement van de
      aanvrager de rechter niet onherroepelijk heeft beslist.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel5
  - number: '6'
    text: 'De Minister wijst de aanvraag in ieder geval af, indien:'
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel6
  - number: 6.a
    text: |-
      niet is voldaan aan het bepaalde bij of krachtens de [Wet Infrastructuurfonds][ref1] of aan deze beleidsregeling;


      [ref1]: https://wetten.overheid.nl/BWBR0006001
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006001
  - number: 6.b
    text: |-
      door toepassing van [artikel 5][ref1] van deze regeling de beslistermijn, bedoeld in [artikel 6, eerste lid][ref2],
      van het Besluit zou worden overschreden;


      [ref1]: https://wetten.overheid.nl/BWBR0007716#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006264#Artikel6
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007716
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006264
        artikel: '6'
  - number: 6.c
    text: |-
      de aanvrager niet heeft aangetoond, dat hem met inbegrip van de aangevraagde bijdrage voldoende gelden ter
      beschikking zullen staan om het voorgenomen project uit te voeren;
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel6
  - number: 6.d
    text: |-
      door inwilliging het subsidieplafond, bedoeld in [artikel 3][ref1], zou worden overschreden;


      [ref1]: https://wetten.overheid.nl/BWBR0007716#Artikel3
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007716
        artikel: '3'
        paragraaf: '1'
  - number: 6.e
    text: de aanvraag betrekking heeft op een ander jaar dan waarvoor een subsidieplafond is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel6
  - number: 6.f
    text: met de uitvoering van het project reeds een aanvang is gemaakt, of
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel6
  - number: 6.g
    text: het project niet voor ten minste 50% met niet van overheidswege verstrekte middelen wordt gefinancierd.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel6
  - number: '7.1'
    text: |-
      De bijdrage voor een project bedraagt ten hoogste 50% van de geraamde kosten van infrastructuur en van de vast
      geïnstalleerde en mobiele uitrusting die nodig is voor de overslag van en naar de vaarweg, doch niet meer dan
      f 1.500.000,-.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel7
  - number: '7.2'
    text: De Minister kan aan de verlening van een bijdrage nadere voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel7
  - number: '7.3'
    text: |-
      Bij de vaststelling van de bijdrage bepaalt de Minister tevens de hoeveelheid goederen die de aanvrager
      redelijkerwijs via de te subsidiëren vaarwegaansluiting ten minste moet overslaan. Deze vervoersgarantie wordt van
      kracht op het tijdstip dat het betrokken project in gebruik wordt genomen en geldt voor een periode van vijf jaar.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel7
  - number: '8'
    text: 'De aanvrager:'
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel8
  - number: 8.a
    text: |-
      draagt zorg voor een overzichtelijke en doelmatige administratie met betrekking tot het project, welke een juist en
      actueel inzicht geeft in de voortgang van het project, in de projectkosten en in de besteding van de bijdrage;
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel8
  - number: 8.b
    text: bewaart de bewijsstukken van de projectkosten gedurende ten minste vijf jaar na de afloop van het project;
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel8
  - number: 8.c
    text: toont op verzoek van de Minister de bescheiden op één adres;
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel8
  - number: 8.d
    text: neemt andere aanwijzingen van de Minister in acht ter zake van de administratie;
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel8
  - number: 8.e
    text: verleent op verzoek van de Minister medewerking aan de openbaarmaking van de resultaten van het project;
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel8
  - number: 8.f
    text: verleent op verzoek van de Minister medewerking aan een evaluatie van deze regeling;
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel8
  - number: 8.g
    text: |-
      doet onverwijld aan de Minister mededeling van de indiening van een verzoek als bedoeld in [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007716#Artikel5
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007716
        artikel: '5'
        paragraaf: '3'
  - number: 8.h
    text: |-
      doet onverwijld aan de Minister mededeling van overige omstandigheden die van invloed kunnen zijn op de bijdrage;
      en
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel8
  - number: 8.i
    text: |-
      doet de Minister jaarlijks rapportage van de hoeveelheid lading die via de betrokken vaarwegaansluiting is
      overgeslagen.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel8
  - number: '9.1'
    text: |-
      De Minister wijst toezichthouders aan, die bevoegd zijn inlichtingen te verlangen en inzage te verlangen van
      zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van hun taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel9
  - number: '9.2'
    text: Zij zijn bevoegd van de gegevens en bescheiden kopieën te maken.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel9
  - number: '9.3'
    text: |-
      Indien het maken van kopieën niet ter plaatse kan geschieden, zijn zij bevoegd de gegevens en bescheiden voor dat
      doel gedurende korte tijd mee te nemen tegen een bewijs van ontvangst.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel9
  - number: '10.1'
    text: |-
      De door de Minister aangewezen toezichthouders zijn bevoegd elke plaats te betreden, met uitzondering van een
      woning zonder toestemming van de bewoner, voor zover dat voor de vervulling van hun taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel10
  - number: '10.2'
    text: |-
      Zij zijn bevoegd zich te doen vergezellen door personen die daartoe door hen zijn aangewezen, voor zover dit voor
      het doel van het betreden redelijkerwijs noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel10
  - number: '11.1'
    text: |-
      De Minister stelt de definitieve bijdrage vast binnen vier weken na de indiening van de stukken, bedoeld in
      [artikel 14, tweede lid][ref1], van het Besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel14
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '14'
  - number: '11.2'
    text: |-
      De Minister betaalt de in het eerste lid bedoelde bijdrage uit binnen tien weken na de vaststelling onder
      verrekening van de reeds betaalde bedragen (slotdeclaratie).
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel11
  - number: '11.3'
    text: |-
      Voor zover de reeds betaalde bedragen de vastgestelde bijdrage overschrijden, zijn deze terstond en zonder enige
      ingebrekestelling opeisbaar.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel11
  - number: '11.4'
    text: |-
      Vaststelling vindt niet plaats zolang op een verzoek tot surséance van betaling of faillissement van de aanvrager
      niet onherroepelijk is beslist door de rechter.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel11
  - number: '12'
    text: |-
      Het project kan met toestemming van de Minister tussentijds worden beëindigd. Aan deze toestemming kan de Minister
      nadere voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel12
  - number: '13.1'
    text: 'In ieder geval kan de Minister de bijdrage geheel of gedeeltelijk intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel13
  - number: 13.1.a
    text: |-
      niet is voldaan aan het bepaalde bij of krachtens de [Wet Infrastructuur-fonds][ref1] of aan deze beleidsregeling;


      [ref1]: https://wetten.overheid.nl/BWBR0006001
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006001
  - number: 13.1.b
    text: |-
      hij de bijdrage heeft verleend op basis van zodanig onjuiste of onvolledige informatie, dat hij een andere
      beslissing op de aanvraag zou hebben genomen, indien hem de juiste gegevens waren verstrekt;
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel13
  - number: 13.1.c
    text: het project tussentijds wordt beëindigd;
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel13
  - number: 13.1.d
    text: de aanvrager onherroepelijk failliet is verklaard; of
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel13
  - number: 13.1.e
    text: |-
      de vervoersgarantie, bedoeld in [artikel 7, derde lid][ref1], niet is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007716#Artikel7
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007716
        artikel: '7'
        paragraaf: '3'
  - number: '13.2'
    text: |-
      De reeds betaalde bedragen zijn bij intrekking van de bijdrage terstond en zonder enige ingebrekestelling
      opeisbaar.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel13
  - number: '14'
    text: |-
      In 2001 brengt de Minister een rapport uit, houdende evaluatie van de doelmatigheid en doeltreffendheid van deze
      regeling.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel14
  - number: '15.1'
    text: Deze regeling treedt in werking met ingang van 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel15
  - number: '15.2'
    text: |-
      De Minister geeft voor het laatst in 2000 toepassing aan [§ 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007716#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007716
        paragraaf: '3'
  - number: '16'
    text: 'Deze beleidsregeling wordt aangehaald als: Tijdelijke beleidsregeling bijdragen vaarwegaansluitingen.'
    url: https://wetten.overheid.nl/BWBR0007716/1996-01-01#Artikel16
