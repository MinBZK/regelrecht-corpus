  - number: '165'
    text: |-
      1 Onze Minister kan aan de toezichthouder een aanwijzing geven over de uitoefening van de aan de toezichthouder bij
      of krachtens deze wet opgedragen taken en toegekende bevoegdheden wanneer de toezichthouder hierin naar het oordeel
      van Onze Minister tekort schiet. Onze Minister treedt daarbij niet in individuele gevallen.

      2 De toezichthouder is gehouden overeenkomstig de aanwijzing te handelen.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel165
  - number: '166'
    text: |-
      De bevoegdheid om de noodzakelijke voorzieningen te treffen, genoemd in
      [artikel 23, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], alsmede de verplichtingen, genoemd
      in artikel 23, tweede en derde lid, van de Kaderwet zelfstandige bestuursorganen, worden ten aanzien van ernstige
      verwaarlozing door de toezichthouder van de bij of krachtens deze wet opgedragen taken uitgeoefend dan wel
      uitgevoerd door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel23
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '23'
  - number: 166a
    text: |-
      Onze Minister kan beleidsregels vaststellen ten aanzien van de toepassing door de toezichthouders van
      [Hoofdstuk 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel166a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        hoofdstuk: '7'
  - number: '167'
    text: |-
      De pensioenuitvoerder, de werkgever, de accountant en de actuaris verstrekken aan de toezichthouder kosteloos de
      door deze gevorderde inlichtingen, gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel167
  - number: '168'
    text: |-
      1 De toezichthouder kan ten behoeve van het toezicht op de naleving van deze wet van een ieder inlichtingen
      vorderen.

      2 De [artikelen 5:13][ref1] en [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref2] zijn van
      overeenkomstige toepassing.

      3 De toezichthouder is bevoegd tot toepassing van [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref3]
      ten aanzien van de in het eerste lid bedoelde vordering.

      4 Voorzover de toezichthouder voor het uitoefenen van het gedragstoezicht ten aanzien van pensioenfondsen waaraan
      de andere toezichthouder een vergunning heeft verleend of welke in het register is opgenomen, gegevens nodig heeft
      over aspecten van de bedrijfsvoering, bedoeld in [artikel 143, tweede lid, onderdeel a en b][ref4], vordert de
      eerstgenoemde toezichthouder geen inlichtingen, dan nadat de andere toezichthouder is verzocht deze gegevens te
      verstrekken en is gebleken dat de andere toezichthouder niet aan dit verzoek tegemoet kan komen.

      5 Van het vierde lid kan, na overleg met de andere toezichthouder, worden afgeweken indien sprake is van een
      redelijk vermoeden van een overtreding van de regels bij of krachtens deze wet gesteld en onverwijlde spoed, gelet
      op de betrokken belangen, dat vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel513
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel520
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel520
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel143
