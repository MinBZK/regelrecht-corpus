  - number: '28'
    text: |-
      1 Een pensioenfonds informeert elk kwartaal schriftelijk het verantwoordingsorgaan of het belanghebbendenorgaan
      en, bij het ontbreken daarvan, de deelnemers, gewezen deelnemers en pensioengerechtigden wanneer sprake is van
      een premieachterstand ter grootte van 5% van de totale door het pensioenfonds te ontvangen jaarpremie en tevens
      niet voldaan wordt aan de bij of krachtens [artikel 131][ref1] geldende eisen inzake het minimaal vereist eigen
      vermogen.

      2 Gedurende de in het eerste lid bedoelde situatie informeert een pensioenfonds tevens elk kwartaal de
      ondernemingsraad van de onderneming die nog premie aan het pensioenfonds verschuldigd is.

      3 Bij een algemeen pensioenfonds worden de voorgaande twee leden toegepast per afgescheiden vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel131
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '131'
        hoofdstuk: '6'
  - number: '29'
    text: |-
      1 Een verzekeraar informeert de deelnemers en de werkgever wanneer de premieachterstand het noodzakelijk maakt de
      opbouw van pensioenaanspraken te beëindigen door premievrijmaking of pensioenaanspraken zonder premievrije waarde
      te laten vervallen.

      2 Een verzekeraar kan de in het eerste lid bedoelde mededeling aan de deelnemers pas doen indien hij zich
      aantoonbaar heeft ingespannen om de achterstallige premie te innen.

      3 De verzekeraar kan op zijn vroegst drie maanden na de in het eerste lid bedoelde mededeling de opbouw van
      pensioenaanspraken beëindigen door premievrijmaking of pensioenaanspraken zonder premievrije waarde laten
      vervallen.

      4 De premievrijmaking, bedoeld in het derde lid, vindt op zijn vroegst plaats per de datum die vijf maanden voor
      het tijdstip van informeren van de deelnemers is gelegen.

      5 De dekking van het arbeidsongeschiktheidsrisico of het overlijdensrisico blijft volledig in stand tot drie
      maanden na de in het eerste lid bedoelde mededeling.

      6 Bij de premievrijmaking wordt de verzekering premievrij voortgezet zonder verrekening van premie en rente met
      de pensioenaanspraken. Kosten, voor zover voortvloeiend uit het premievrij maken, worden evenmin verrekend met
      de pensioenaanspraken.

      7 Dit artikel is van overeenkomstige toepassing op een premiepensioeninstelling.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel29
  - number: '30'
    text: |-
      In een uitvoeringsovereenkomst met een verzekeraar met zetel buiten Nederland waarin bij de totstandkoming of op
      een later tijdstip wordt gekozen voor ander dan Nederlands recht, wordt de volgende clausule opgenomen:

      Ongeacht het gekozen rechtsstelsel is ten aanzien van deze uitvoeringsovereenkomst in ieder geval de Pensioenwet
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel30
  - number: '31'
    text: |-
      Verpanding van de uit de uitvoeringsovereenkomst voortvloeiende rechten door de werkgever of andere handelingen die
      door hem worden verricht waardoor aan anderen dan de aanspraak- of pensioengerechtigden rechten worden verleend,
      is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel31
  - number: '32'
    text: |-
      Een pensioenuitvoerder heeft tot taak een pensioenovereenkomst uit te voeren op basis van een
      uitvoeringsovereenkomst of een uitvoeringsreglement.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel32
  - number: '33'
    text: |-
      1 Een pensioenuitvoerder richt zijn organisatie zodanig in dat een goed bestuur is gewaarborgd waardoor er in ieder
      geval:

      a. verantwoording wordt afgelegd aan de aanspraak- en pensioengerechtigden en de werkgever; en

      b. intern toezicht is.

      2 Bij algemene maatregel van bestuur kunnen met betrekking tot het eerste lid regels worden gesteld. Die regels
      kunnen in het bijzonder betrekking hebben op de naleving van in die algemene maatregel van bestuur aan te wijzen
      principes voor goed pensioenfondsbestuur.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel33
  - number: '34'
    text: |-
      1 Indien een pensioenuitvoerder werkzaamheden uitbesteedt aan een derde draagt hij er zorg voor dat deze derde de
      bij of krachtens deze wet gestelde regels, die van toepassing zijn op de uitbestedende pensioenuitvoerder, naleeft.

      2 Door de pensioenuitvoerder mogen de volgende werkzaamheden niet worden uitbesteed:

      a. taken en werkzaamheden van personen die het dagelijks beleid bepalen, daaronder mede verstaan het vaststellen
      van beleid en het afleggen van verantwoording over het gevoerde beleid;

      b. het opstellen van en toezien op het strategisch beleid ten aanzien van vermogensbeheer;

      c. werkzaamheden waarvan uitbesteding de verantwoordelijkheid van de uitvoerder voor de organisatie en beheersing
      van bedrijfsprocessen en het toezicht daarop kan ondermijnen;

      d. indien de uitbesteding een belemmering kan vormen voor een adequaat toezicht op de naleving van het bij of
      krachtens de Pensioenwet bepaalde.

      3 Bij of krachtens algemene maatregel van bestuur kunnen:

      a. werkzaamheden worden aangewezen die niet mogen worden uitbesteed;

      b. regels worden gesteld met betrekking tot de uitbesteding in verband met het toezicht op de naleving van het bij
      of krachtens deze wet bepaalde; en

      c. regels worden gesteld met betrekking tot de beheersing van risico’s die verband houden met de uitbesteding.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel34
  - number: '35'
    text: |-
      1 De pensioenuitvoerder stelt een pensioenreglement vast in overeenstemming met de pensioenovereenkomst en de
      uitvoeringsovereenkomst of het uitvoeringsreglement.

      2 In het pensioenreglement worden in ieder geval bepalingen opgenomen betreffende:

      a. de wijze waarop de pensioenuitvoerder omgaat met inkomende waarden in het kader van waardeoverdracht;

      b. de hoogte van de ruilvoet en de opbouwkeuzevoet, bedoeld in [artikel 60][ref1] en [61][ref2], en de afkoopvoet,
      bedoeld in [artikel 66][ref3]; en

      c. de kortingsregel, bedoeld in [artikel 134][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel66
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel134
