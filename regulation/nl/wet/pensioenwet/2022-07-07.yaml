  - number: '196'
    text: |-
      1 Een pensioenfonds kan na ontvangst van de mededeling, bedoeld in [artikel 195, derde lid][ref1], dan wel nadat
      zes weken zijn verstreken na ontvangst van de mededeling, bedoeld in [artikel 195, tweede lid][ref2], beginnen met
      het uitvoeren van de voorgenomen pensioenregeling.

      2 Het pensioenfonds neemt bij de uitvoering van de pensioenregeling de op bedrijfspensioenvoorziening toepasselijke
      sociale en arbeidswetgeving en de voorschriften die krachtens titel IV van [richtlijn 2016/2341](32016L2341)/
      EU moeten worden nageleefd, in acht. De Nederlandse sociale en arbeidswetgeving is niet van toepassing op de
      uitvoering van de pensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel195
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel195
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel196
