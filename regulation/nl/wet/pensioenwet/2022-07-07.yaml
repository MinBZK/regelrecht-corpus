  - number: '139'
    text: |-
      1 Wanneer de beleidsdekkingsgraad die op grond van [artikel 138, zevende lid][ref1], is vastgesteld ligt
      onder de bij of krachtens [artikel 132][ref2] gestelde eisen ten aanzien van het vereist eigen vermogen, dient
      het pensioenfonds binnen drie maanden of zoveel eerder als de toezichthouder bepaalt ter instemming bij de
      toezichthouder een concreet en haalbaar geactualiseerd herstelplan in.

      2 In het in het eerste lid bedoelde herstelplan werkt het pensioenfonds uit hoe het in dezelfde termijn als de
      termijn die het pensioenfonds bij het herstelplan op grond van [artikel 138, tweede lid][ref3], heeft gebruikt,
      zal voldoen aan [artikel 132][ref4]. Het pensioenfonds kan, rekening houdend met de specifieke situatie van
      het pensioenfonds en in het belang van aanspraak- en pensioengerechtigden, een andere termijn hanteren voor het
      geactualiseerd herstelplan indien de toezichthouder daarmee instemt.

      3 [Artikel 138, vierde tot en met achtste lid][ref5], is van toepassing op de geactualiseerde herstelplannen.
      Op het moment dat het geactualiseerde herstelplan ingaat vervangt dit een eerder vastgesteld herstelplan of
      geactualiseerd herstelplan.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit
      artikel.


