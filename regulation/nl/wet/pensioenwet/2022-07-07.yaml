    text: |-
      1 Het onafhankelijke bestuur van een pensioenfonds bestaat uit ten minste twee bestuurders. De bestuurders zijn
      niet directe vertegenwoordigers van de belanghebbenden bij het pensioenfonds.

      2 Het bestuur stelt een profielschets op voor leden van het bestuur. Het bestuur kan een kandidaat bestuurder
      afwijzen indien deze niet aan de profielschets voldoet.
