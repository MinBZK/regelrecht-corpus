  - number: 220b
    text: |-
      1 [Artikel 55, zesde lid][ref1], is van toepassing indien de deelneming eindigt vanaf het tijdstip van
      inwerkingtreding van [artikel I, onderdeel E, van de Wet waardeoverdracht klein pensioen][ref2].

      2 Indien de deelneming is geëindigd voor het tijdstip van inwerkingtreding van
      [artikel I, onderdeel E, van de Wet waardeoverdracht klein pensioen][ref3] heeft de pensioenuitvoerder het recht
      om pensioenaanspraken van een gewezen deelnemer te laten vervallen indien op basis van de tot het tijdstip van
      beëindiging opgebouwde aanspraak op ouderdomspensioen de uitkering van het ouderdomspensioen op jaarbasis op de
      reguliere ingangsdatum niet meer zal bedragen dan € 2,– per jaar. De pensioenuitvoerder die gebruik maakt van het
      recht, bedoeld in de eerste zin, informeert de gewezen deelnemers hierover.

      3 [Artikel 70a][ref4] is van toepassing indien de deelneming is geëindigd of eindigt vanaf 1 januari 2018.

      4 Indien de deelneming is geëindigd voor 1 januari 2018:

      a. is [artikel 70a][ref5] van toepassing indien voldaan wordt aan bij of krachtens algemene maatregel van bestuur
      te stellen voorwaarden;

      b. geldt de in [artikel 71, eerste lid][ref6], opgenomen uitzondering voor de toepassing van [artikel 70a][ref7]
      niet; en

      c. zijn de [artikelen 104, derde lid, aanhef en onderdeel d][ref8], [115a, derde lid, aanhef en onderdeel f][ref9],
      en [115c, negende lid, aanhef en onderdeel a][ref10]:

      1°. voor zover het betreft de gehele of gedeeltelijke overdracht van de verplichtingen van het pensioenfonds, van
      toepassing op het beleid van het pensioenfonds ten aanzien van de toepassing van [artikel 70a][ref11]; en

      2°. voor zover het betreft de overname van verplichtingen door het pensioenfonds, niet van toepassing bij de
      overname van verplichtingen door het pensioenfonds als gevolg van de toepassing van [artikel 70a][ref12] of
      [artikel 81a van de Wet verplichte beroepspensioenregeling][ref13].

      5 Indien de deelneming is geëindigd voor 1 januari 2018 heeft de pensioenuitvoerder, in afwijking van de
      [artikelen 65][ref14] en [66][ref15], het recht om op zijn vroegst twee jaar na beëindiging van de deelneming
      pensioenaanspraken van een gewezen deelnemer af te kopen, indien op basis van de tot het tijdstip van beëindiging
      van de deelneming opgebouwde aanspraak op ouderdomspensioen de uitkering van het ouderdomspensioen op jaarbasis op
      de reguliere ingangsdatum, getoetst per 1 januari van dat jaar, minder zal bedragen dan het in artikel 66, eerste
      lid, onderdeel a, genoemde bedrag, tenzij de gewezen deelnemer binnen twee jaar na beëindiging van de deelneming
      een procedure tot waardeoverdracht is gestart. De pensioenuitvoerder die gebruik wil maken van dit recht informeert
      de gewezen deelnemer over zijn besluit hieromtrent binnen zes maanden na afloop van de periode van twee jaar na
      beëindiging van de deelneming en gaat over tot uitbetaling van de afkoopwaarde binnen die termijn van zes maanden.
      Artikel 66, vierde en vijfde lid, is van overeenkomstige toepassing.

      6 In afwijking van het vijfde lid en de [artikelen 65][ref16] en [66, tweede lid][ref17], heeft de
      pensioenuitvoerder tot 1 juli 2019 het recht om pensioenaanspraken van een gewezen deelnemer af te kopen
      indien de deelneming is geëindigd in 2017 of 2018 en op basis van de tot het tijdstip van beëindiging
      opgebouwde aanspraak op ouderdomspensioen de uitkering van het ouderdomspensioen op jaarbasis op de
      reguliere ingangsdatum niet meer zal bedragen dan € 2,– per jaar. Bij toepassing van deze bepaling is
      [artikel 19b, vierde lid, van de Wet op de loonbelasting 1964][ref18] van overeenkomstige toepassing.


