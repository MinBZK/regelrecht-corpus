      1 In geval van overdracht van pensioenkapitaal op de pensioendatum ten behoeve van aankoop van een periodieke
      pensioenuitkering, draagt de overdragende pensioenuitvoerder het pensioenkapitaal over:

      a. aan de door de deelnemer of gewezen deelnemer aangewezen ontvangende pensioenuitvoerder op de pensioendatum of
      binnen acht weken na het verzoek hiertoe van de deelnemer of gewezen deelnemer indien deze dat verzoek minder dan
      acht weken voor de pensioendatum heeft gedaan;

      b. aan de door de aanspraakgerechtigde, niet zijnde de deelnemer of gewezen deelnemer, aangewezen ontvangende
      pensioenuitvoerder binnen acht weken na het verzoek hiertoe van die aanspraakgerechtigde.

      2 De overdragende pensioenuitvoerder is verplicht tot vergoeding van de schade die de deelnemer, gewezen deelnemer
      of andere aanspraakgerechtigde ondervindt ten gevolge van de aan die pensioenuitvoerder toerekenbare niet tijdige
      overdracht; de schade is ten minste gelijk aan de wettelijke rente op het over te dragen pensioenkapitaal.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel82
  - number: '83'
    text: |-
      1 De pensioenuitvoerder is op verzoek van de werkgever of, bij bedrijfstakpensioenfondsen, de partijen die de
      pensioenregeling zijn overeengekomen bevoegd tot collectieve waardeoverdracht indien:

      a. de waardeoverdracht ertoe strekt in verband met de beëindiging van de uitvoeringsovereenkomst tussen de
      werkgever en de overdragende pensioenuitvoerder de waarde onder te brengen bij de ontvangende pensioenuitvoerder
      met wie de werkgever een uitvoeringsovereenkomst heeft gesloten;

      b. de werkgever wordt overgenomen als gevolg van een overgang van een onderneming als bedoeld
      in [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref1], en de overnemende onderneming een
      uitvoeringsovereenkomst heeft gesloten of gaat sluiten met een andere pensioenuitvoerder of dezelfde
      pensioenuitvoerder;

      c. de waardeoverdracht ertoe strekt in verband met een collectieve wijziging van de pensioenovereenkomsten de
      waarde van pensioenaanspraken of pensioenrechten aan te wenden bij dezelfde pensioenuitvoerder overeenkomstig die
      gewijzigde pensioenovereenkomsten; of

      d. de waardeoverdracht ertoe strekt de waarde onder te brengen in een andere collectiviteitkring bij hetzelfde
      algemeen pensioenfonds.

      2 Bij een collectieve waardeoverdracht als bedoeld in het eerste lid wordt voldaan aan de volgende voorwaarden:

      a. de deelnemers, gewezen deelnemers, gewezen partners of de pensioengerechtigden hebben geen bezwaren jegens
      de pensioenuitvoerder kenbaar gemaakt tegen de waardeoverdracht nadat zij over het voornemen schriftelijk zijn
      geïnformeerd;

      b. de overdrachtswaarde wordt door de overdragende pensioenuitvoerder zodanig vastgesteld dat de voor mannen
      en vrouwen te verwerven pensioenrechten gelijk zijn waarbij aan het vereiste van collectieve actuariële
      gelijkwaardigheid op basis van dezelfde grondslagen wordt voldaan; en

      c. het voornemen tot waardeoverdracht aan een pensioenuitvoerder wordt door de overdragende pensioenuitvoerder
      uiterlijk drie maanden voor de beoogde datum van waardeoverdracht schriftelijk gemeld aan de toezichthouder en de
      toezichthouder heeft binnen die periode geen verbod tot waardeoverdracht opgelegd.

      3 Het tweede lid, onderdelen a en c, is niet van toepassing voor zover de collectieve wijziging van de
      pensioenovereenkomsten, bedoeld in het eerste lid, onderdeel c, inhoudt dat de pensioenaanspraken worden omgezet in
      pensioenaanspraken die zijn berekend op basis van een hogere pensioenrichtleeftijd en voldaan wordt aan de volgende
      voorwaarden:

      a. de nieuwe pensioenrichtleeftijd betreft een pensioenrichtleeftijd als bedoeld in
      [artikel 18a, zesde lid, van de Wet op de loonbelasting 1964][ref2], zoals dit artikel op enig moment luidt of
      luidde;

      b. de pensioenregeling voorziet in de mogelijkheid de ingangsdatum van het pensioen te vervroegen naar de
      ingangsdatum voor de wijziging; en

      c. bij de vervroeging worden in de flexibiliseringfactoren naar de ingangsdatum van het pensioen voor de wijziging
      geen selectiefactoren in aanmerking genomen.

      4 Het tweede lid, onderdeel b, is met betrekking tot:

      a. uitkeringsovereenkomsten van toepassing op pensioenaanspraken die vanaf 1 januari 2002 zijn opgebouwd;

      b. premieovereenkomsten en kapitaalovereenkomsten van toepassing op pensioenaanspraken die vanaf 1 januari 2005
      zijn opgebouwd.

      5 Op pensioenaanspraken die voor de in het vierde lid genoemde data zijn opgebouwd is de eis van individuele
      actuariële gelijkwaardigheid, bedoeld in [artikel 71, vierde lid][ref3], van toepassing, tenzij in de
      pensioenovereenkomst is overeengekomen dat de voorwaarden, bedoeld in het tweede lid, onderdeel b, van toepassing
      zijn.

      6 Voorzover het bij de toepassing van het eerste lid pensioenaanspraken betreft die als gevolg van een premievrije
      voortzetting van die pensioenaanspraken worden opgebouwd is onderdeel b van het tweede lid van toepassing indien
      het recht op die premievrije voortzetting is ontstaan op of na 1 januari 2002.

      7 Elk beding strijdig met dit artikel is nietig.

      8 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld aan het vaststellen van de
      overdrachtswaarde en over collectieve waardeoverdracht in de situatie dat de onderneming van de werkgever heeft
      opgehouden te bestaan.


