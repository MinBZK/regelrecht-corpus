  - number: '21'
    text: |-
      1 De werkgever draagt er zorg voor dat de pensioenuitvoerder wordt geïnformeerd over het sluiten van een
      pensioenovereenkomst met een werknemer en de start van de verwerving van pensioenaanspraken door de werknemer. De
      pensioenuitvoerder informeert de werknemer binnen drie maanden na de start van het verwerven van pensioenaanspraken
      door de werknemer over de kenmerken van de pensioenregeling, waaronder de mogelijkheid te kiezen voor een
      variabele uitkering, de uitvoering van de pensioenregeling en over persoonlijke omstandigheden die een actie van de
      werknemer kunnen vergen. De werknemer wordt daarbij tevens gewezen op de website van de pensioenuitvoerder en op de
      mogelijkheid het pensioenregister te raadplegen.

      2 De werkgever informeert de pensioenuitvoerder over iedere wijziging in de pensioenovereenkomst, bedoeld
      in het eerste lid. De pensioenuitvoerder informeert de werknemer binnen drie maanden na een wijziging in de
      pensioenovereenkomst over die wijziging en de mogelijkheid om het gewijzigde pensioenreglement op te vragen bij
      de pensioenuitvoerder.

      3 Het eerste lid is niet van toepassing indien de werkgever uiterlijk zes maanden voor het sluiten van de
      pensioenovereenkomst met de werknemer een eerdere pensioenovereenkomst met dezelfde werknemer heeft gesloten op
      grond waarvan de werknemer de in het eerste lid bedoelde informatie heeft ontvangen. Informatie die sinds de vorige
      verstrekking is gewijzigd wordt wel verstrekt.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de te verstrekken informatie.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel21
  - number: '22'
    text: |-
      1 De werkgever stelt een vereniging van pensioengerechtigden in de gelegenheid haar oordeel uit te spreken over een
      voorgenomen besluit van de werkgever in het kader van een uitvoeringsovereenkomst met een verzekeraar indien:

      a. dit besluit van invloed is op de uitvoering of de hoogte van pensioenrechten van gepensioneerden; en

      b. de som van het aantal werknemers en het aantal gepensioneerden dat een pensioenovereenkomst heeft gesloten met
      de werkgever op dat moment gelijk is of meer bedraagt dan 250.

      2 Een vereniging van pensioengerechtigden als bedoeld in het eerste lid dient volledige rechtsbevoegdheid te
      bezitten en tevens te voldoen aan de volgende voorwaarden:

      a. haar statutaire doel omvat in elk geval het behartigen van de belangen van de gepensioneerden die in dienst zijn
      geweest bij de werkgever;

      b. ten minste 10% van alle gepensioneerden die in dienst zijn geweest bij de werkgever is lid van de vereniging;

      c. de vereniging meldt haar bestaan bij de werkgever en de verzekeraar.

      3 Het oordeel van een vereniging van pensioengerechtigden wordt op een zodanig tijdstip gevraagd dat het van
      invloed kan zijn op het in het eerste lid bedoelde besluit.

      4 Bij het vragen van een oordeel wordt aan de vereniging van pensioengerechtigden een overzicht verstrekt van de
      beweegredenen voor het besluit en van de gevolgen die het besluit naar verwachting voor de deelnemers, gewezen
      deelnemers, gepensioneerden en andere pensioengerechtigden zal hebben.

      5 De werkgever verstrekt desgevraagd aan een vereniging van pensioengerechtigden tijdig alle inlichtingen en
      gegevens, die deze voor het vormen van haar oordeel redelijkerwijze nodig heeft. De inlichtingen worden desgevraagd
      schriftelijk verstrekt.

      6 De verzekeraar informeert de pensioengerechtigden, die pensioen ontvangen op grond van een pensioenovereenkomst
      met de in het eerste lid bedoelde werkgever, over het bestaan van een vereniging van pensioengerechtigden als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel22
  - number: '23'
    text: |-
      1 De werkgever brengt een pensioenovereenkomst, uiterlijk wanneer een werknemer pensioenaanspraken verwerft, onder
      door onmiddellijk een schriftelijke uitvoeringsovereenkomst te sluiten met en in stand te houden bij:

      a. een pensioenuitvoerder;

      b. een pensioeninstelling uit een andere lidstaat die beschikt over een daartoe verleende vergunning als bedoeld in
      [artikel 199][ref1] en de bevoegde autoriteiten in kennis heeft gesteld overeenkomstig [artikel 199][ref2]; of

      c. een verzekeraar met een zetel buiten Nederland, mits die verzekeraar op grond van de
      [Wet op het financieel toezicht][ref3] in Nederland het bedrijf van levensverzekeraar of schadeverzekeraar mag
      uitoefenen.

      De werkgever kan bij een premiepensioeninstelling uitsluitend onderbrengen een premieovereenkomst waarbij de
      premiepensioeninstelling geen risico draagt.

      2 De in het eerste lid opgenomen verplichting van de werkgever tot het sluiten en instandhouden van een
      schriftelijke uitvoeringsovereenkomst geldt niet bij uitvoering door een bedrijfstakpensioenfonds:

      a. mits de werkgever gehouden is of zich verbonden heeft door lid te zijn van een werkgeversvereniging tot naleving
      van de statuten en reglementen van dit bedrijfstakpensioenfonds; en

      b. een uitvoeringsreglement door het bedrijfstakpensioenfonds is opgesteld dat voldoet aan de eisen die in
      [artikel 25][ref4] ten aanzien van de uitvoeringsovereenkomst zijn gesteld.

      3 De in het eerste lid opgenomen verplichtingen van de werkgever tot onderbrenging en het sluiten en in stand
      houden van een schriftelijke uitvoeringsovereenkomst gelden niet wanneer een pensioenovereenkomst is gesloten door
      een werkgever die tevens pensioenuitvoerder is, mits:

      a. de pensioenovereenkomsten van deze werknemers worden ondergebracht bij de werkgever in zijn hoedanigheid van
      pensioenuitvoerder; en

      b. een uitvoeringsreglement door de werkgever is opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel199
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel199
      [ref3]: https://wetten.overheid.nl/BWBR0020368
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel25
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel23
