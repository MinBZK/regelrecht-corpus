  - number: '135'
    text: |-
      1 Een pensioenfonds voert een beleggingsbeleid dat in overeenstemming is met de prudent-person regel en met name
      gebaseerd is op de volgende uitgangspunten:

      a. de waarden worden belegd in het belang van aanspraak- en pensioengerechtigden; en

      b. beleggingen in de bijdragende onderneming worden beperkt tot ten hoogste 5% van de portefeuille als geheel, en
      ingeval de bijdragende onderneming tot een groep behoort, worden beleggingen in de ondernemingen die tot dezelfde
      groep als de bijdragende onderneming behoren, beperkt tot ten hoogste 10% van de portefeuille. Wanneer een groep
      van ondernemingen aan het pensioenfonds premies betaalt, geschieden beleggingen in deze bijdragende ondernemingen
      prudent, waarbij rekening wordt gehouden met de noodzaak van een behoorlijke diversificatie;

      c. de beleggingen worden gewaardeerd op basis van marktwaardering.

      2 Bij of krachtens algemene maatregel van bestuur worden ter waarborging van het prudente beleggingsbeleid nadere
      regels gesteld.

      3 De eisen die zijn opgenomen in het eerste lid, aanhef en onderdeel b, en de regels die op grond van het tweede
      lid worden gesteld ten aanzien van de diversificatie van waarden zijn niet van toepassing op beleggingen in
      staatsobligaties.

      4 Een pensioenfonds vermeldt in zijn bestuursverslag op welke wijze in het beleggingsbeleid rekening wordt gehouden
      met milieu en klimaat, mensenrechten en sociale verhoudingen.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel135
  - number: '136'
    text: |-
      1 Een pensioenfonds gaat geen leningen aan, tenzij de lening tijdelijk wordt aangegaan voor
      liquiditeitsdoelstellingen en treedt niet namens derde partijen op als garant.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van het eerste lid met
      betrekking tot de tijdelijkheid van de lening en de liquiditeitsdoelstellingen.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel136
  - number: '137'
    text: |-
      1 Een pensioenfonds stelt beleid vast met betrekking tot de voorwaardelijke toeslagverlening.

      2 Voor een pensioenfonds geldt bij de voorwaardelijke toeslagverlening het volgende:

      a. bij een beleidsdekkingsgraad onder een bij algemene maatregel van bestuur te bepalen niveau wordt geen toeslag
      verleend;

      b. er wordt niet meer toeslag verleend dan naar verwachting in de toekomst te realiseren is; en

      c. incidentele toeslagverlening om in het verleden niet toegekende toeslag of in het verleden doorgevoerde
      vermindering van pensioenaanspraken en pensioenrechten te compenseren kan worden verleend indien die
      toeslagverlening geen gevolgen heeft voor de toeslagverlening in de toekomst overeenkomstig onderdeel b, de
      beleidsdekkingsgraad het niveau van het vereist eigen vermogen, bedoeld in [artikel 132][ref1], behoudt en in enig
      jaar ten hoogste een vijfde van het vermogen dat voor deze toeslagverlening beschikbaar is, wordt aangewend.

      3 Het tweede lid is niet van toepassing indien:

      a. een pensioenfonds volledig verzekerd is bij een verzekeraar;

      b. de werkgever een onvoorwaardelijke verplichting heeft tot het verstrekken van bijdragen aan een pensioenfonds
      zodanig dat dit pensioenfonds steeds voldoet aan de bij of krachtens [artikel 131][ref2] gestelde eisen ten aanzien
      van het minimaal vereist eigen vermogen en daarbij sprake is van onvoorwaardelijke toeslagverlening voor deelnemers
      conform minimaal de groeivoet van het prijsindexcijfer; of

      c. anderszins sprake is van bij of krachtens algemene maatregel van bestuur te bepalen bijzondere omstandigheden.

      4 Pensioenfondsen kunnen de voorwaardelijke toeslagverlening financieren door:

      a. het creëren van technische voorzieningen;

      b. het creëren van eigen vermogen boven het vereist eigen vermogen ten behoeve van de toeslagverlening;

      c. het putten uit het eigen vermogen boven het vereist eigen vermogen ten behoeve van de toeslagverlening;

      d. het hanteren van een opslag op de premie; of

      e. overrendement.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel131
