  - number: '47'
    text: |-
      1 De pensioenuitvoerder verstrekt deelnemers, gewezen deelnemers en gepensioneerden die zich in een andere lidstaat
      vestigen informatie over hun pensioenaanspraken en pensioenrechten en over de mogelijkheden die hun op grond van de
      pensioenregeling worden geboden.

      2 De informatie die op grond van het eerste lid wordt verstrekt is ten minste overeenkomstig de informatie die
      wordt verstrekt aan deelnemers, gewezen deelnemers en gepensioneerden die in Nederland blijven.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel47
  - number: 47a
    text: |-
      1 Voorafgaand aan de totstandkoming van een overeenkomst inzake een pensioenuitkering stelt een verzekeraar
      die bereid is op te treden als ontvangende pensioenuitvoerder, op basis van informatie die verstrekt is door de
      betrokkene die het uit een kapitaalovereenkomst of premieovereenkomst voortvloeiende kapitaal op de pensioendatum
      wenst aan te wenden voor een pensioenuitkering, de wensen en behoeften van de betrokkene vast en verstrekt hij de
      betrokkene informatie over overeenkomsten inzake een pensioenuitkering om hem in staat te stellen met kennis van
      zaken een beslissing te nemen.

      2 Een door de verzekeraar voorgestelde pensioenuitkering is in overeenstemming met de wensen en behoeften van de
      betrokkene.

      3 De verzekeraar neemt op zorgvuldige wijze de gerechtvaardigde belangen van de betrokkene in acht.

      4 De Autoriteit Financiële Markten geeft met betrekking tot het derde lid slechts toepassing aan
      [artikel 171][ref1] bij evidente misstanden die het vertrouwen in de verzekeraar of in de financiële markten kunnen
      schaden.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel171
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '171'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 47b
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de
      informatieverstrekking door een verzekeraar over een overeenkomst inzake een pensioenuitkering en de
      dienstverlening.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel47b
  - number: 47c
    text: |-
      Indien een verzekeraar de betrokkene adviseert over een overeenkomst inzake een pensioenuitkering, licht de
      verzekeraar de overwegingen toe die ten grondslag liggen aan zijn advies voor zover dit nodig is voor een goed
      begrip van zijn advies.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel47c
  - number: '48'
    text: |-
      1 De informatie die de pensioenuitvoerder verstrekt of beschikbaar stelt is correct, duidelijk en evenwichtig. De
      informatie wordt tijdig verstrekt of beschikbaar gesteld.

      2 De pensioenuitvoerder bevordert dat persoonlijke informatie aansluit bij de informatiebehoefte en kenmerken van
      de deelnemer, gewezen deelnemer, gewezen partner of pensioengerechtigde.

      3 De pensioenuitvoerder bevordert dat de informatie de deelnemer, gewezen deelnemer, gewezen partner of
      pensioengerechtigde inzicht geeft in de keuzemogelijkheden die er zijn in de pensioenregeling en de gevolgen van
      belangrijke gebeurtenissen voor het pensioen.

      4 De informatie, bedoeld in de [artikelen 38, eerste lid][ref1], [40, eerste lid][ref2], [42, eerste lid][ref3],
      en [44, eerste lid][ref4], wordt verstrekt door middel van een uniform pensioenoverzicht. In het uniform
      pensioenoverzicht wordt een verwijzing opgenomen naar de website van de pensioenuitvoerder, de website waarop het
      pensioenregister te raadplegen is en wordt gewezen op de mogelijkheden die [artikel 46][ref5] biedt.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel
      over onder meer het uniform pensioenoverzicht en het verstrekken van informatie door middel van het uniform
      pensioenoverzicht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel44
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel46
