  - number: '105'
    text: |-
      1 Ten minste twee natuurlijke personen bepalen het dagelijks beleid van een pensioenfonds.

      2 De personen die het beleid van een pensioenfonds bepalen of mede bepalen richten zich bij de vervulling
      van hun taak naar de belangen van de bij het pensioenfonds betrokken deelnemers, gewezen deelnemers, andere
      aanspraakgerechtigden, de pensioengerechtigden en de werkgever en zorgen ervoor dat dezen zich door hen op
      evenwichtige wijze vertegenwoordigd kunnen voelen.

      3 Iedere bestuurder van een pensioenfonds is bevoegd een deskundige te raadplegen, of zich krachtens een
      bestuursbesluit, waarbij ten minste één vierde van de bestuurders zich daarvoor heeft uitgesproken, ter vergadering
      door een deskundige te laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel105
  - number: '106'
    text: |-
      1 Het beleid van een pensioenfonds wordt bepaald of mede bepaald door personen die geschikt zijn in verband met de
      uitoefening van het bedrijf van het pensioenfonds.

      2 Het intern toezicht van een pensioenfonds door een visitatiecommissie wordt uitgeoefend door personen die
      geschikt zijn voor de uitoefening van dit toezicht.

      3 De risicobeheerfunctie, interne auditfunctie en actuariële functie bij een pensioenfonds worden uitgeoefend door
      personen die geschikt zijn voor de uitoefening van deze functies.

      4 Het beleid van een pensioenfonds wordt bepaald of mede bepaald door personen wier betrouwbaarheid buiten twijfel
      staat. Het intern toezicht van een pensioenfonds door een visitatiecommissie en de risicobeheerfunctie, interne
      auditfunctie en actuariële functie bij een pensioenfonds worden uitgeoefend door personen wier betrouwbaarheid
      buiten twijfel staat.

      5 Het bestuur van het pensioenfonds meldt elke wijziging in de samenstelling van de personen die het beleid van het
      pensioenfonds bepalen of mede bepalen vooraf aan de toezichthouder.

      6 Een wijziging als bedoeld in het vijfde lid wordt niet doorgevoerd indien:

      a. de toezichthouder binnen zes weken na ontvangst van de melding van de wijziging aan het pensioenfonds bekend
      maakt dat hij niet met de voorgenomen wijziging instemt; of

      b. de toezichthouder om nadere gegevens of inlichtingen heeft verzocht en binnen zes weken na ontvangst van die
      gegevens of inlichtingen aan het pensioenfonds bekend maakt dat hij niet met de voorgenomen wijziging instemt.

      7 Indien zich een wijziging voordoet van de antecedenten die van invloed is op de betrouwbaarheid van de personen
      die het beleid van het pensioenfonds bepalen of mede bepalen stelt het pensioenfonds de toezichthouder daarvan
      onverwijld schriftelijk in kennis.

      8 De betrouwbaarheid van een persoon staat buiten twijfel wanneer dat eenmaal door de toezichthouder voor de
      toepassing van deze wet is vastgesteld, zolang niet een wijziging in de relevante feiten of omstandigheden een
      redelijke aanleiding geeft tot een nieuwe beoordeling.

      9 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel. Die
      regels hebben onder meer betrekking op de misdrijven die, indien begaan door een persoon als bedoeld in het vierde
      lid, met het oog op de belangen die de wet beoogt te beschermen, tot de vaststelling leiden dat de betrouwbaarheid
      van die persoon niet buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel106
  - number: 106a
    text: |-
      Bestuurders en leden van de raad van toezicht van een pensioenfonds hebben voldoende tijd beschikbaar
      om hun functie naar behoren uit te oefenen. Bij algemene maatregel van bestuur worden nadere regels
      gesteld. De [artikelen 132a][ref1], [142a][ref2], [242a][ref3], [252a][ref4], [297a][ref5] en
      [297b van Boek 2 van het Burgerlijk Wetboek][ref6] zijn niet van toepassing.


