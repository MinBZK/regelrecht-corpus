  - number: '189'
    text: |-
      Alvorens over te gaan tot openbaarmaking op grond van [artikel 185, eerste lid][ref1], of
      [artikel 188, eerste lid][ref2], neemt de toezichthouder een besluit tot openbaarmaking. Dit besluit bevat de
      openbaar te maken gegevens, alsmede de wijze waarop en de termijn waarna de openbaarmaking zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel185
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel188
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel189
