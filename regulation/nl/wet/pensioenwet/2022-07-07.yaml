  - number: '42'
    text: |-
      1 De pensioenuitvoerder verstrekt de gewezen partner met aanspraak op bijzonder partnerpensioen ten minste een keer
      in vijf jaar:

      a. een opgave van de opgebouwde aanspraak op partnerpensioen;

      b. informatie over toeslagverlening; en

      c. informatie over vermindering van pensioenaanspraken en pensioenrechten op grond van [artikel 134][ref1].

      2 De pensioenuitvoerder informeert de gewezen partner binnen drie maanden na een wijziging van het toeslagbeleid
      over die wijziging.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid
      bedoelde opgave en informatie en de wijze waarop deze worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel42
