  - number: '43'
    text: |-
      1 De pensioenuitvoerder verstrekt degene die pensioengerechtigde wordt:

      a. een opgave van zijn pensioenrecht;

      b. een opgave van de opgebouwde aanspraken op nabestaandenpensioen wanneer de pensioenregeling daarin voorziet;

      c. informatie over toeslagverlening;

      d. informatie over vermindering van pensioenaanspraken en pensioenrechten op grond van [artikel 134][ref1]; en

      e. informatie die voor degene die pensioengerechtigde wordt specifiek in het kader van de pensioeningang van belang
      is.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid
      bedoelde opgaven en informatie en de wijze waarop deze worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel134
