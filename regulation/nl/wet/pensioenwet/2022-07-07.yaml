  - number: '2'
    text: |-
      1 Bij regeling van Onze Minister kunnen nadere regels worden gesteld over hetgeen onder de directeur-
      grootaandeelhouder wordt verstaan.

      2 Met een pensioenovereenkomst wordt gelijkgesteld:

      a. de uit de dienstbetrekking voortvloeiende rechtsbetrekking tussen een werkgever en een werknemer met betrekking
      tot pensioen in geval van deelneming in een bedrijfstakpensioenfonds op basis van een verplichtstelling; en

      b. de uit de dienstbetrekking voortvloeiende rechtsbetrekking tussen een overheidswerkgever en een
      overheidswerknemer als bedoeld in de [Wet privatisering ABP][ref1] met betrekking tot pensioen op grond van de
      overeenkomst, bedoeld in [artikel 4][ref2] en [5 van die wet][ref3].

      3 Bij regeling van Onze Minister kan een categorie van personen, niet zijnde werknemers, die werkt in een
      arbeidsverhouding waarbij tegen beloning persoonlijke arbeid wordt verricht, worden aangewezen die voor de
      toepassing van deze wet en de daarop berustende bepalingen wordt gelijkgesteld met werknemers.

      4 Een geldelijke uitkering voor een gewezen werknemer die wordt gedaan bij wijze van inkomensvoorziening bij
      ouderdom in verband met vervroegde uittreding is geen pensioen in de zin van deze wet, indien die uitkering:

      a. uiterlijk eindigt op de datum waarop volgens de [Algemene Ouderdomswet][ref4] recht op ouderdomspensioen
      ontstaat, bij het bereiken van de pensioenleeftijd voor het levenslange ouderdomspensioen of bij eerder overlijden
      en die gebaseerd is op een overeenkomst die alleen aanspraak op een uitkering toekent aan degenen die tijdens de
      looptijd van de regeling, welke ten hoogste vijf jaar bedraagt, een bepaalde leeftijd hebben bereikt; of

      b. gebaseerd is op de [Wet kaderregeling Vut overheidspersoneel][ref5].

      5 Een geldelijke uitkering voor een gewezen werknemer bij wijze van inkomensvoorziening bij ouderdom is geen
      pensioen in de zin van deze wet wanneer deze uitkering is gebaseerd op een regeling:

      a. die leidt tot uitkeringen vanaf een bepaalde leeftijd aan werknemers die werkzaamheden verrichten die door de
      werkgever als substantieel bezwarend zijn aangemerkt;

      b. die leidt tot een uitkering die uiterlijk eindigt op de datum waarop volgens de [Algemene Ouderdomswet][ref6]
      recht op ouderdomspensioen ontstaat, bij het bereiken van de pensioenleeftijd voor het ouderdomspensioen of bij
      eerder overlijden; en

      c. die bij regeling van Onze Minister is aangewezen.

      6 Een uitkering voor een gemoedsbezwaarde als bedoeld in
      [artikel 64, eerste lid, onderdeel a, van de Wet financiering sociale verzekeringen][ref7] is geen pensioen in de
      zin van deze wet.

      7 Bij algemene maatregel van bestuur kunnen regels worden gesteld op grond waarvan
      aanvullingen op een loonaanvullingsuitkering of een vervolguitkering als bedoeld in
      [artikel 60, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref8] die geen
      arbeidsongeschiktheidspensioen zijn als bedoeld in [artikel 1][ref9] worden aangemerkt als
      arbeidsongeschiktheidspensioen als bedoeld in [dat artikel][ref10].

      8 De voordracht voor een krachtens het zevende lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      9 Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot kapitaalovereenkomsten of
      premieovereenkomsten waarbij het op de pensioendatum beschikbaar komende kapitaal wordt gesplitst in een deel dat
      wordt aangewend voor aankoop van een direct ingaande tijdelijke uitkering en een deel dat later wordt aangewend
      voor de aankoop van een, op de tijdelijke uitkering aansluitende, levenslange uitkering. In deze regeling:

      a. kunnen dergelijke uitkeringen, en daarbij horende uitkeringen voor nabestaanden, worden gelijkgesteld met een
      pensioen als bedoeld in [artikel 1][ref11];

      b. kan worden bepaald dat dit pensioen voldoet aan de [artikelen 15][ref12] en [63][ref13];

      c. kan worden bepaald dat pensioenuitvoerders verplicht zijn mee te werken aan splitsing zoals beschreven in de
      aanhef; en

      d. kunnen regels worden gesteld betreffende een goede uitvoering.

      10 De regeling, bedoeld in het negende lid, is uitsluitend van toepassing indien de pensioendatum is gelegen na
      31 december 2008 en het op de pensioendatum beschikbaar komende kapitaal nog niet is aangewend voor aankoop van een
      levenslange uitkering.

      11 Waar in deze wet sprake is van de Nederlandse sociale en arbeidswetgeving betreft dit in ieder geval de
      [artikelen 1][ref14], [2][ref15], [4][ref16], [7 tot en met 29][ref17], [31][ref18], [35 tot en met 53][ref19],
      [55 tot en met 95][ref20], [97][ref21] en [98][ref22] van deze wet.

      12 Een nettolijfrente als bedoeld in [artikel 5.16, tweede lid, van de Wet inkomstenbelasting 2001][ref23] is geen
      pensioen in de zin van deze wet.

      13 Voor de toepassing van de[ artikelen 63c][ref24], [103, eerste en tweede lid][ref25],
      [137, derde lid, onderdeel a][ref26], [148a][ref27], [149][ref28] en [150, onderdeel b][ref29], wordt, voor zover
      het gaat om verzekeren bij een verzekeraar, onder verzekeraar mede verstaan een herverzekeraar als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref30].


