  - number: '6'
    text: |-
      De [Wet op het financieel toezicht][ref1] is niet van toepassing op de verhouding tussen een verzekeraar of een
      premiepensioeninstelling en een aanspraak- of pensioengerechtigde, tenzij in deze wet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '7'
    text: |-
      1 De werkgever informeert de werknemer binnen een maand na aanvang van de werkzaamheden schriftelijk of
      elektronisch of hij de werknemer al dan niet een aanbod tot het sluiten van een pensioenovereenkomst doet, en zo
      ja, binnen welke termijn het aanbod wordt gedaan en wie de pensioenuitvoerder is.

      2 Indien de werkgever de werknemer op basis van het eerste lid heeft medegedeeld dat hem geen aanbod tot het
      sluiten van een pensioenovereenkomst zal worden gedaan, maar de werkgever op een later tijdstip alsnog een
      aanbod tot het sluiten van een pensioenovereenkomst doet, informeert hij de werknemer hierover schriftelijk of
      elektronisch.

      3 Indien een pensioenovereenkomst is gesloten, maar de werknemer nog geen pensioen verwerft, informeert de
      werkgever de werknemer daarover en geeft de werkgever daarbij aan:

      a. aan welke voorwaarden voldaan moet worden om de verwerving van pensioenaanspraken te laten beginnen; en

      b. welke diensttijd in het kader van de pensioenovereenkomst relevant is.

      4 Indien de werkgever niet heeft voldaan aan het eerste of tweede lid, wordt een werkgever geacht aan een
      werknemer een onherroepelijk aanbod tot het sluiten van een pensioenovereenkomst gedaan te hebben, indien die
      werknemer behoort tot dezelfde groep van werknemers, aan wie de werkgever al een aanbod tot het sluiten van een
      pensioenovereenkomst heeft gedaan.

      5 Voor het elektronisch verstrekken van de informatie, bedoeld in het eerste en tweede lid, is uitdrukkelijke
      instemming van de werknemer vereist.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel7
  - number: '8'
    text: |-
      1 Ingeval een werkgever aan een of meer werknemers een aanbod doet tot het sluiten van een pensioenovereenkomst,
      mag deze werkgever het doen van een aanbod aan een andere werknemer niet achterwege laten vanwege het enkele feit
      dat die andere werknemer minder dan de volledige arbeidstijd werkt.

      2 Indien als voorwaarde voor het verwerven van pensioenaanspraken op basis van een pensioenovereenkomst het
      overstijgen van een minimumloongrens wordt gesteld, wordt voor de toepassing van die loongrens het loon van een
      werknemer die minder dan de volledige arbeidstijd werkzaam is, herleid naar het loon dat ingeval van een volledige
      arbeidstijd zou zijn verkregen.

      3 Bij de vaststelling van aanspraken op ouderdoms- en nabestaandenpensioen worden aan werknemers die minder dan de
      volledige arbeidstijd werkzaam zijn, pensioenaanspraken verleend naar evenredigheid van de pensioenaanspraken die
      ingeval van een volledige arbeidstijd zouden zijn verkregen.

      4 Bij de vaststelling van aanspraken op arbeidsongeschiktheidspensioen die aan de pensioenovereenkomst kunnen
      worden ontleend, is onderscheid op grond van het enkele feit van de omvang van de arbeidstijd niet toegestaan, met
      dien verstande dat bij de vaststelling van het arbeidsongeschiktheidspensioen rekening gehouden mag worden met een
      uitkering uit hoofde van de [Wet werk en inkomen naar arbeidsvermogen][ref1] voorzover die uitkering verband houdt
      met dezelfde dienstbetrekking.

      5 In geval een werkgever aan een of meer werknemers een aanbod doet tot het sluiten van een pensioenovereenkomst,
      mag deze werkgever het doen van een aanbod aan een andere werknemer niet achterwege laten vanwege het enkele feit
      dat die werknemer een bepaalde leeftijd nog niet heeft bereikt, tenzij:

      a. de werknemer jonger is dan 21 jaar; of

      b. het een ouderdomspensioen betreft dat uitsluitend voorziet in een uitkering tot het bereiken van de
      pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], of tot het
      bereiken van de pensioenleeftijd voor het levenslange ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '9'
    text: |-
      Door de overgang van een onderneming, bedoeld in [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref1], waarbij
      de vervreemder met de aan die onderneming verbonden werknemers geen pensioenovereenkomst heeft gesloten, wordt,
      indien de verkrijger met zijn werknemers vóór het tijdstip van de overgang een pensioenovereenkomst heeft gesloten,
      de verkrijger geacht op het moment van de overgang het aanbod tot het sluiten van een zelfde pensioenovereenkomst
      te hebben gedaan aan de werknemers van de vervreemder.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
  - number: '10'
    text: |-
      De pensioenovereenkomst houdt in:

      a. een uitkeringsovereenkomst;

      b. een kapitaalovereenkomst; of

      c. een premieovereenkomst.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel10
  - number: 10a
    text: |-
      1 Bij een kapitaalovereenkomst of een premieovereenkomst wordt het kapitaal voortvloeiend uit de beschikbaar
      gestelde premies uiterlijk op de pensioendatum omgezet in een vastgestelde uitkering.

      2 In afwijking van het eerste lid kan het kapitaal vanaf de pensioendatum geheel of gedeeltelijk worden gebruikt
      voor de financiering van een variabele uitkering.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel10a
  - number: '11'
    text: |-
      De uitkering, het kapitaal en de premie in het kader van een pensioenovereenkomst luiden in een Nederlands wettig
      betaalmiddel.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel11
  - number: '12'
    text: |-
      1 De werkgever kan zich bij het sluiten of bij een wijziging van de pensioenovereenkomst het recht voorbehouden de
      premiebetaling, voorzover deze betrekking heeft op de bijdrage van de werkgever, te verminderen of beëindigen in
      geval van een ingrijpende wijziging van omstandigheden.

      2 Andere bedingen dan die bedoeld in het eerste lid, waarin een voorbehoud wordt gemaakt inzake premiebetaling,
      zijn nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel12
  - number: '13'
    text: |-
      In de pensioenovereenkomst wordt bepaald of er toeslagen worden verleend en, zo ja, wat het ambitieniveau is en
      welke voorwaarden gelden bij de toeslagverlening.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel13
  - number: '14'
    text: |-
      1 Het verwerven van ouderdomspensioenaanspraken op basis van een pensioenovereenkomst begint uiterlijk op de 21-
      jarige leeftijd van de werknemer of op de latere datum van indiensttreding, tenzij het een ouderdomspensioen
      betreft dat uitsluitend voorziet in een uitkering tot het bereiken van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], of tot het bereiken van de pensioenleeftijd voor het
      levenslange ouderdomspensioen.

      2 Het in het eerste lid genoemde tijdstip waarop de verwerving begint kan, indien in de
      pensioenovereenkomst is voorzien in een wachttijd of drempelperiode, met betrekking tot ouderdompensioen
      worden uitgesteld met ten hoogste twee maanden of, indien sprake is van een uitzendovereenkomst
      als bedoeld in [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref2], tot de werknemer
      in meer dan 26 weken arbeid heeft verricht. Voor de berekening van de termijn van 26 weken is
      [artikel 691, vierde en vijfde lid, van Boek 7 van het Burgerlijk Wetboek][ref3] van overeenkomstige
      toepassing. Wachttijden of drempelperioden zijn niet toegestaan voor het nabestaandenpensioen en het
      arbeidsongeschiktheidspensioen. Indien een werknemer bij de beëindiging van zijn arbeidsovereenkomst naar
      burgerlijk recht of publiekrechtelijke aanstelling nog niet in de pensioenregeling is opgenomen, maar er door of
      namens hem een bijdrage is betaald, dan wordt de som van de bijdragen aan hem terugbetaald of wordt, in geval de
      werknemer het beleggingsrisico draagt, de som van de gestorte bijdragen of de met deze bijdragen gerealiseerde
      beleggingswaarde aan hem terugbetaald.

      3 In geval een werkgever die nog geen enkele pensioenovereenkomst heeft gesloten of die alleen een
      pensioenovereenkomst heeft gesloten met werknemers die tot een bepaalde groep behoren, over gaat tot het
      sluiten van een of meer pensioenovereenkomsten, geldt ten aanzien van zijn werknemers die bij het sluiten van de
      pensioenovereenkomst ouder zijn dan 21 jaar, niet de eis dat de verwerving van pensioen op 21-jarige leeftijd moet
      zijn begonnen.

      4 Elk beding in strijd met het eerste lid en tweede lid is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel690
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel691
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '690'
