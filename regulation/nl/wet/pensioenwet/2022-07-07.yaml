  - number: '194'
    text: |-
      1 Een pensioenfonds stelt de toezichthouder in kennis van een voornemen bijdragen te gaan ontvangen van een
      bijdragende onderneming met zetel in een andere lidstaat dan Nederland.

      2 De kennisgeving, bedoeld in het eerste lid, gaat vergezeld van een opgave van:

      a. de lidstaat waarvan de voor bedrijfspensioenvoorziening geldende sociale en arbeidswetgeving van toepassing is
      op de rechtsverhouding tussen de bijdragende onderneming en de werknemers of op de zelfstandige, die in voorkomend
      geval wordt opgegeven door de bijdragende onderneming;

      b. de naam van de bijdragende onderneming en de plaats waar de bijdragende onderneming haar hoofdbestuur heeft; en

      c. de voornaamste kenmerken van de pensioenregeling die voor die onderneming zal worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel194
  - number: '195'
    text: |-
      1 De toezichthouder doet binnen drie maanden na ontvangst van de gegevens, bedoeld in
      [artikel 194, tweede lid][ref1], mededeling van deze gegevens aan de bevoegde autoriteiten van de lidstaat waarvan
      de voor bedrijfspensioenvoorziening geldende sociale en arbeidswetgeving van toepassing is op de rechtsverhouding
      tussen de bijdragende onderneming en de werknemers, tenzij het pensioenfonds niet beschikt over de vergunning,
      bedoeld in [artikel 125][ref2], of de toezichthouder reden heeft te betwijfelen dat de administratieve structuur of
      de financiële positie van het pensioenfonds, of de deskundigheid en betrouwbaarheid van de personen die het fonds
      besturen met de in die lidstaat voorgenomen activiteiten verenigbaar zijn.

      2 De toezichthouder doet gelijktijdig mededeling aan het fonds van de verstrekking van de gegevens aan de bevoegde
      autoriteiten, bedoeld in het eerste lid.

      3 De toezichthouder doet mededeling aan het fonds van informatie over de toepasselijke bepalingen van sociale en
      arbeidswetgeving, ontvangen van de bevoegde autoriteiten, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel194
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel125
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel195
