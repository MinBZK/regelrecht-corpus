    text: |-
      Op een pensioenaanspraak die of een pensioenrecht dat een tot verevening gerechtigde echtgenoot of
      geregistreerde partner op grond van [artikel 5 van de Wet verevening pensioenrechten bij scheiding][ref1]
      verwerft, zijn de [artikelen 58][ref2] en [61][ref3] niet van overeenkomstige toepassing en zijn de
      [artikelen 71 tot en met 74][ref4], [78 tot en met 80][ref5] en [85 tot en met 89][ref6] van overeenkomstige
      toepassing indien de pensioenregeling daarin voorziet.


