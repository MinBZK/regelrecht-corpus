  - number: '71'
    text: |-
      1 De pensioenuitvoerder is verplicht om na een verzoek van de gewezen deelnemer tot waardeoverdracht de
      overdrachtswaarde van diens pensioenaanspraken over te dragen indien:

      a. er sprake is van een individuele beëindiging van de dienstbetrekking dan wel individuele beëindiging van de
      deelneming; en

      b. die waardeoverdracht ertoe strekt het de gewezen deelnemer mogelijk te maken pensioenaanspraken te verwerven bij
      de ontvangende pensioenuitvoerder van de nieuwe werkgever of de beroepspensioenregeling;

      tenzij sprake is van een van de in de [artikelen 72][ref1], [72a][ref2] en [73][ref3] omschreven situaties of het
      pensioenaanspraken betreft waarvoor de pensioenuitvoerder [artikel 70a][ref4] toepast.

      Indien het verzoek van de gewezen deelnemer tot waardeoverdracht partnerpensioen betreft is voor de
      waardeoverdracht van dit partnerpensioen tevens vereist dat de partner die begunstigde is voor het partnerpensioen
      met de waardeoverdracht instemt. Indien het verzoek van de gewezen deelnemer tot waardeoverdracht nettopensioen
      betreft is voor de waardeoverdracht van dit nettopensioen tevens vereist dat de ontvangende pensioenuitvoerder een
      regeling voor nettopensioen uitvoert.

      2 De ontvangende pensioenuitvoerder is verplicht om na een verzoek tot waardeoverdracht van een deelnemer de
      overdrachtswaarde aan te wenden ter verwerving van pensioenaanspraken voor die deelnemer.

      3 De plicht van de overdragende pensioenuitvoerder om de waarde rechtstreeks over te dragen en de plicht van
      de ontvangende pensioenuitvoerder om de waarde aan te wenden ontstaat indien de deelnemer na aanvang van de
      verwerving van pensioenaanspraken in de door de ontvangende pensioenuitvoerder uitgevoerde pensioenregeling een
      opgave heeft gevraagd van zijn pensioenaanspraken aan de ontvangende pensioenuitvoerder en daarna het verzoek tot
      waardeoverdracht doet aan de ontvangende pensioenuitvoerder.

      4 De ontvangende pensioenuitvoerder waarborgt dat de actuariële waarde van de door de deelnemer te verwerven
      pensioenaanspraken ten minste gelijk is aan de op dezelfde grondslagen berekende waarde van de over te dragen
      pensioenaanspraken.

      5 De overdragende en de ontvangende pensioenuitvoerder brengen in het kader van de waardeoverdracht geen kosten in
      rekening bij de gewezen deelnemer.

      6 Elk beding strijdig met dit artikel is nietig.

      7 Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van nadere aan de
      waardeoverdracht te stellen voorwaarden en eisen, de berekening van de overdrachtswaarde, de waarde van met de
      overdrachtswaarde te verwerven pensioenaanspraken alsmede de in acht te nemen procedures.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel72a
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel73
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel70a
