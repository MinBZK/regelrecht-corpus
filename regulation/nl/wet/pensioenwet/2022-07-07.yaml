  - number: '78'
    text: |-
      1 Indien in de in [artikel 76][ref1] bedoelde situatie geen plicht tot waardeoverdracht bestaat omdat de deelnemer
      niet voldaan heeft aan de in [artikel 76, derde lid][ref2], omschreven verplichting om binnen zes maanden
      een opgave te vragen, is de pensioenuitvoerder bevoegd tot waardeoverdracht indien voldaan wordt aan de in
      [artikel 76, eerste en vierde lid][ref3], opgenomen voorwaarden.

      2 Indien in de in [artikel 76][ref4] bedoelde situatie geen plicht tot waardeoverdracht bestaat omdat er geen
      sprake is van een individuele beëindiging, is de pensioenuitvoerder bevoegd tot waardeoverdracht indien:

      a. wordt voldaan aan de in [artikel 76, eerste lid, onderdeel b en tweede zin, en vierde lid][ref5], genoemde
      voorwaarden;

      b. de overdragende en de ontvangende pensioenuitvoerders aan wie door een groep gewezen deelnemers verzoeken tot
      waardeoverdracht worden gedaan niet identiek zijn hetgeen zij schriftelijk hebben gemeld aan de toezichthouder; en

      c. de toezichthouder binnen drie maanden na de melding geen verbod tot waardeoverdracht heeft opgelegd aan een van
      beide pensioenuitvoerders.


