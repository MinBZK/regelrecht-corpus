  - number: '190'
    text: |-
      1 De toezichthouder gaat pas over tot openbaarmaking op grond van [artikel 185, eerste lid][ref1], of
      [artikel 188, eerste lid][ref2], nadat vijf werkdagen zijn verstreken na de dag waarop het besluit tot
      openbaarmaking, bedoeld in artikel 189, aan de belanghebbende is bekendgemaakt.

      2 Indien de belanghebbende verzoekt om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref3] om openbaarmaking op grond van
      [artikel 185, eerste lid][ref4], of [artikel 188, eerste lid][ref5], te voorkomen, wordt de openbaarmaking
      opgeschort totdat er een uitspraak is van de voorzieningenrechter.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel185
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel188
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel881
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel185
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel188
