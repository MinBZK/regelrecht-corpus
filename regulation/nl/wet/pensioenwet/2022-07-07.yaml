  - number: '49'
    text: |-
      1 De pensioenuitvoerder verstrekt de informatie elektronisch of schriftelijk. Er wordt ten hoogste eenmaal per jaar
      gewisseld tussen schriftelijke verstrekking en elektronische verstrekking van de informatie.

      2 De pensioenuitvoerder informeert de deelnemer, gewezen deelnemer, gewezen partner of pensioengerechtigde
      schriftelijk of elektronisch over het voornemen tot elektronische verstrekking.

      3 De pensioenuitvoerder verstrekt de informatie schriftelijk, indien de deelnemer, gewezen deelnemer, gewezen
      partner of pensioengerechtigde over het voornemen tot elektronische verstrekking, bedoeld in het tweede lid:

      a. schriftelijk is geïnformeerd en hij bezwaar heeft gemaakt tegen elektronische verstrekking; of

      b. elektronisch om instemming is gevraagd en hij niet heeft ingestemd met elektronische verstrekking.

      4 Indien de pensioenuitvoerder de deelnemer of de gewezen deelnemer elektronisch informatie verstrekt,
      is hij verplicht de elektronisch verstrekte informatie te bewaren tot één jaar na het overlijden van de
      pensioengerechtigde dan wel tot één jaar na het aflopen van de uitkering aan de nabestaanden. De deelnemer of de
      gewezen deelnemer kan ten hoogste eenmaal per jaar de elektronisch verstrekte informatie opvragen.

      5 De pensioenuitvoerder verstrekt de deelnemer, gewezen deelnemer, gewezen partner of pensioengerechtigde aan wie
      de informatie elektronisch wordt verstrekt, op verzoek een papieren afschrift van de informatie.

      6 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel49
  - number: '50'
    text: |-
      1 De pensioenuitvoerder kan zich voor het schriftelijk verstrekken van de informatie, bedoeld in de
      [artikelen 38 tot en met 44][ref1], houden aan het laatst hem bekende adres van de deelnemer, gewezen deelnemer,
      pensioengerechtigde of gewezen partner.

      2 Indien dit adres onjuist blijkt te zijn, raadpleegt de pensioenuitvoerder de basisregistratie personen over het
      adres van de deelnemer, gewezen deelnemer, pensioengerechtigde of gewezen partner.

      3 Indien de pensioenuitvoerder kosten maakt in verband met werkzaamheden die voortvloeien uit het feit dat de
      deelnemer, gewezen deelnemer, pensioengerechtigde of gewezen partner verzuimd heeft de pensioenuitvoerder omtrent
      een wijziging van adres te informeren, kan de pensioenuitvoerder deze kosten bij deze in rekening brengen, maar
      kunnen deze kosten niet direct in mindering worden gebracht op de uitkering.

      4 Indien het bij de pensioenuitvoerder bekende adres voor de elektronische verstrekking van informatie onjuist
      blijkt, verstrekt de pensioenuitvoerder de informatie schriftelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel38
