  - number: '173'
    text: |-
      1 Op verzoek van de toezichthouder kan de ondernemingskamer van het gerechtshof Amsterdam over een pensioenfonds
      een bewindvoerder aanstellen, indien:

      a. een pensioenfonds blijk geeft van een zodanig wanbeleid dat de belangen van de aanspraak- en
      pensioengerechtigden een onmiddellijke voorziening vereisen; of

      b. het bestuur is komen te ontbreken.

      2 De toezichthouder dient zijn verzoekschrift tot aanstelling van een bewindvoerder in tweevoud in. De griffier
      doet een exemplaar van het verzoekschrift onverwijld aan het pensioenfonds toekomen.

      3 Indien de ondernemingskamer het verzoek toewijst, bepaalt zij de duur waarvoor de bewindvoerder wordt aangesteld.
      Zij kan deze duur op verzoek van de toezichthouder of van de bewindvoerder verlengen dan wel verkorten. De
      ondernemingskamer kent de bewindvoerder een bezoldiging toe ten laste van:

      a. het pensioenfonds of, wanneer de financiële omstandigheden van het pensioenfonds dit niet toestaan;

      b. de werkgever of, wanneer de financiële omstandigheden van de werkgever dit niet toestaan;

      c. de toezichthouder.

      4 De bewindvoerder treedt in de plaats van het bestuur of een of meerdere door de ondernemingskamer aangewezen
      leden van het bestuur van het pensioenfonds.

      5 De voorlopige tenuitvoerlegging van de beschikking tot aanstelling van een bewindvoerder kan worden bevolen,
      indien het verzoek daartoe is gedaan op een van de gronden, genoemd in het eerste lid, onderdelen a en b.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel173
  - number: '174'
    text: |-
      1 Indien een accountant of actuaris niet of niet meer de nodige waarborgen biedt dat deze zijn taak met betrekking
      tot het pensioenfonds naar behoren zal kunnen vervullen, kan de toezichthouder ten aanzien van deze accountant
      of actuaris bepalen dat hij niet langer bevoegd is de in deze wet bedoelde verklaringen met betrekking tot dat
      pensioenfonds af te leggen.

      2 De toezichthouder doet mededeling van het besluit, bedoeld in het eerste lid, aan het pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel174
  - number: '175'
    text: |-
      1 De toezichthouder kan een last onder dwangsom opleggen ter zake van een overtreding van de voorschriften, gesteld
