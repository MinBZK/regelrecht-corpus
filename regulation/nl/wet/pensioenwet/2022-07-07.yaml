  - number: '41'
    text: |-
      1 De pensioenuitvoerder verstrekt degene die gewezen partner wordt en een aanspraak verkrijgt op bijzonder
      partnerpensioen:

      a. een opgave van de opgebouwde pensioenaanspraak op partnerpensioen;

      b. informatie over toeslagverlening;

      c. informatie die voor de gewezen partner specifiek van belang is; en

      d. informatie over vermindering van pensioenaanspraken en pensioenrechten op grond van [artikel 134][ref1].

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid
      bedoelde opgave en informatie en de wijze waarop deze worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel41
