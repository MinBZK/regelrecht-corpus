  - number: 148a
    text: |-
      Een pensioenfonds kan niet overgaan tot verzekering bij een verzekeraar indien de verzekering gebaseerd is op een
      kapitaalcontract. Een kapitaalcontract is een overeenkomst tussen een pensioenfonds en een verzekeraar waarbij
      geldt dat:

      a. risico’s van het pensioenfonds gedurende de contractsperiode worden verzekerd;

      b. de daarbij behorende pensioenaanspraken en pensioenrechten na afloop van de contractsperiode niet op verzoek van
      het pensioenfonds premievrij bij de verzekeraar achter kunnen worden gelaten; en

      c. de waarden die behoren bij het ouderdomspensioen of nabestaandenpensioen op kapitaalbasis gedurende de
      contractsperiode geheel of gedeeltelijk in juridisch eigendom van de verzekeraar zijn.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel148a
  - number: '149'
    text: |-
      De toezichthouder kan een pensioenfonds de verplichting opleggen om binnen een door de toezichthouder te stellen
      termijn over te gaan tot verzekering bij een verzekeraar, overdracht aan een verzekeraar of onderbrenging bij een
      pensioenfonds indien dit naar het oordeel van de toezichthouder noodzakelijk is in verband met:

      a. de actuariële en bedrijfstechnische opzet van het pensioenfonds; of

      b. de deskundigheid en betrouwbaarheid van het bestuur.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel149
  - number: '150'
    text: |-
      Wanneer een pensioenregeling eindigt en er geen sprake meer is van verwerving van pensioen tijdens een periode
      waarin de beleidsdekkingsgraad van het pensioenfonds ligt onder de bij of krachtens [artikel 131][ref1] gestelde
      eisen ten aanzien van het minimaal vereist eigen vermogen:

      a. stelt het pensioenfonds de toezichthouder hiervan op de hoogte;

      b. gaat het pensioenfonds binnen een door de toezichthouder te stellen termijn over tot het verzekeren bij een
      verzekeraar, overdragen aan een verzekeraar of onderbrengen bij een pensioenfonds van de pensioenverplichtingen op
      basis van een procedure welke ter kennis en instemming van de toezichthouder wordt gebracht; en

      c. stelt het pensioenfonds een algemeen overzicht van de procedure, bedoeld in onderdeel b, beschikbaar voor
      de deelnemers, gewezen deelnemers en pensioengerechtigden of de vertegenwoordigers van de genoemde personen in
      overeenstemming met het vertrouwelijkheidbeginsel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel131
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '131'
        hoofdstuk: '6'
  - number: '151'
    text: |-
      1 De Stichting Autoriteit Financiële Markten is belast met het gedragstoezicht.

      2 Gedragstoezicht is toezicht gericht op de naleving van de normen ten aanzien van voorlichting door
      pensioenuitvoerders aan deelnemers, gewezen deelnemers, gewezen partners en pensioengerechtigden en de normen ten
      aanzien van de advisering van de deelnemer of gewezen deelnemer bij de uitvoering van premieovereenkomsten met
      beleggingsvrijheid waarbij de deelnemer of gewezen deelnemer de verantwoordelijkheid voor de beleggingen heeft
      overgenomen.

      3 De Nederlandsche Bank N.V. is belast met het prudentieel toezicht en het materieel toezicht.

      4 Prudentieel toezicht is toezicht gericht op de normen ten aanzien van de financiële soliditeit van
      pensioenfondsen, het bijdragen aan de financiële stabiliteit van de sector van pensioenfondsen en het beschermen
      van de rechten van deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en pensioengerechtigden.

      5 Materieel toezicht is toezicht gericht op alle normen in deze wet die geen onderdeel uitmaken van gedrags- of
      prudentieel toezicht.

      6 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn de bij besluit van de
      toezichthouder aangewezen personen belast. Van een besluit als bedoeld in de eerste volzin wordt mededeling gedaan
      door plaatsing in de Staatscourant.

      7 Bij algemene maatregel van bestuur:

      a. worden regels gesteld omtrent de toedeling van de taken en bevoegdheden met betrekking tot het prudentieel
      toezicht, het gedragstoezicht en het materieel toezicht van deze wet aan de toezichthouders;

      b. worden regels gesteld over de wijze waarop de toezichthouders samenwerken; en

      c. worden eisen gesteld aan de toezichthouders, waaronder voorschriften gericht op een zodanige besluitvorming
      binnen de toezichthouder dat een onafhankelijke vervulling van de uit deze wet voortvloeiende taken en bevoegdheden
      is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel151
  - number: '152'
    text: |-
      1 De toezichthouder treedt bij de uitoefening van het toezicht op de naleving van deze wet niet in de beoordeling
      van de individuele rechtsverhouding tussen:

      a. een werkgever en een werknemer;

      b. een pensioenuitvoerder en een werkgever; en

      c. een pensioenuitvoerder en een aanspraak- of pensioengerechtigde.

      2 Het eerste lid is niet van toepassing op de uitvoeringsovereenkomst en het pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel152
  - number: '153'
    text: |-
      1 In aanvulling op [artikel 19, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] draagt de
      toezichthouder met betrekking tot de uitoefening van zijn taken en bevoegdheden uit hoofde van deze wet zorg voor
      een voor de onder toezicht staanden kenbare, transparante en consistente uitvoering.

      2 De toezichthouder hanteert bij de uitoefening van zijn taak een vooruitziende en risicogebaseerde benadering.

      3 De toezichthouder neemt bij de uitoefening van zijn taak de gevolgen in overweging die zijn besluiten, met name
      in noodsituaties, kunnen hebben voor de stabiliteit van het financiële stelsel van alle andere betrokken lidstaten,
      uitgaande van de op het desbetreffende tijdstip beschikbare informatie.

      4 Het toezicht omvat een passende combinatie van werkzaamheden op afstand en controles ter plaatse.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel19
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '19'
  - number: '163'
    text: |-
      Onze Minister houdt toezicht op:

      a. de rechtmatigheid van de uitvoering van deze wet door de toezichthouder;

      b. de doeltreffendheid van de uitvoering van deze wet door de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel163
  - number: '164'
    text: |-
      1 Indien Onze Minister de toezichthouder gegevens of inlichtingen vraagt die naar zijn oordeel nodig zijn voor een
      onderzoek naar de wijze waarop de toezichthouder de uit deze wet voortvloeiende taken en bevoegdheden uitvoert of
      heeft uitgevoerd, geschiedt de verstrekking daarvan met inachtneming van dit artikel.

      2 De toezichthouder verstrekt kosteloos aan Onze Minister de in het eerste lid bedoelde gegevens of inlichtingen.
      Indien Onze Minister de toezichthouder vraagt bepaalde gegevens of inlichtingen te verstrekken die op grond van
      deze wet omtrent afzonderlijke pensioenuitvoerders, werkgevers of natuurlijke personen zijn verstrekt of zijn
      verkregen, is de toezichthouder niet verplicht deze gegevens of inlichtingen te verstrekken, indien deze betrekking
      hebben op of herleidbaar zijn tot een afzonderlijke pensioenuitvoerder, werkgever of natuurlijke persoon, met
      uitzondering van gegevens of inlichtingen die betrekking hebben op of herleidbaar zijn tot een pensioenuitvoerder
      of werkgever ten aanzien waarvan surséance van betaling is verleend, die in staat van faillissement is verklaard of
      op grond van een rechterlijke uitspraak is ontbonden.

      3 Onze Minister kan een derde opdragen de gegevens of inlichtingen die hem ingevolge het tweede lid zijn
      verstrekt te onderzoeken en aan hem verslag uit te brengen. Tevens kan Onze Minister de derde die in zijn opdracht
      handelt, machtigen namens hem gegevens of inlichtingen in te winnen, in welk geval het eerste en tweede lid van
      overeenkomstige toepassing zijn.

      4 Onze Minister gebruikt de gegevens of inlichtingen die hij ingevolge het tweede of derde lid heeft verkregen
      uitsluitend voor het vormen van zijn oordeel over de toereikendheid van deze wet of de wijze waarop de
      toezichthouder de bij of krachtens deze wet opgedragen taken en toegekende bevoegdheden uitoefent of heeft
      uitgeoefend.

      5 Onze Minister en degenen die in zijn opdracht handelen zijn verplicht tot geheimhouding van de op grond van het
      tweede lid, tweede volzin, ontvangen gegevens of inlichtingen.

      6 Niettegenstaande het vierde en vijfde lid kan Onze Minister de aan de gegevens of inlichtingen ontleende
      bevindingen en de daaruit getrokken conclusies aan de Staten-Generaal mededelen en de conclusies in algemene zin
      uit het onderzoek openbaar maken.

      7 De [Wet open overheid][ref1] en de [Wet Nationale ombudsman][ref2] zijn niet van toepassing met betrekking tot
      de in dit artikel bedoelde gegevens of inlichtingen die Onze Minister of de in zijn opdracht werkende derde onder
      zich heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0045754
      [ref2]: https://wetten.overheid.nl/BWBR0003372
