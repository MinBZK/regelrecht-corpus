    text: |-
      Indien in de in [artikel 76][ref1] bedoelde situatie de in [artikel 72][ref2] genoemde omstandigheden niet meer van
      toepassing zijn herleeft de plicht tot waardeoverdracht overeenkomstig [artikel 74][ref3].


