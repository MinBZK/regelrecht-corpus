      1 De verzekeraar is verplicht om op verzoek van de deelnemer, gewezen deelnemer of andere aanspraakgerechtigde de
      waarde van zijn pensioenaanspraken welke voortvloeien uit een kapitaalovereenkomst of een premieovereenkomst die
      voorziet in de uitkering van een aan te wenden kapitaal op de pensioendatum, per de pensioendatum rechtstreeks over
      te dragen aan een andere pensioenuitvoerder indien:

      a. de overdrachtswaarde zodanig door de overdragende verzekeraar wordt vastgesteld dat de voor mannen en vrouwen
      te verwerven pensioenrechten gelijk zijn waarbij aan het vereiste van collectieve actuariële gelijkwaardigheid op
      basis van dezelfde grondslagen wordt voldaan; en

      b. indien de ontvangende pensioenuitvoerder een pensioenfonds is, de deelnemer, gewezen deelnemer of andere
      aanspraakgerechtigde reeds pensioenaanspraken heeft jegens dat pensioenfonds.

      Indien het verzoek van de deelnemer of gewezen deelnemer tot waardeoverdracht partnerpensioen betreft is voor de
      waardeoverdracht van dit partnerpensioen tevens vereist dat de partner die begunstigde is voor het partnerpensioen
      met de waardeoverdracht instemt.

      2 Het eerste lid, onderdeel a, is van toepassing op pensioenaanspraken die vanaf 1 januari 2005 zijn opgebouwd.

      3 Voorzover het bij de toepassing van het eerste lid pensioenaanspraken betreft die als gevolg van een premievrije
      voortzetting van die aanspraken worden opgebouwd, is het eerste lid, onderdeel a, van toepassing indien het recht
      op die premievrije voortzetting is ontstaan op of na 1 januari 2002.

      4 In afwijking van het tweede lid kunnen de in het eerste lid, onderdeel a, opgenomen voorwaarden van
      toepassing zijn op pensioenaanspraken die zijn opgebouwd voor 1 januari 2005 indien dit is overeengekomen in de
      pensioenovereenkomst.

      5 Elk beding strijdig met dit artikel is nietig.

      6 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld aan het vaststellen van de
      overdrachtswaarde.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel81
  - number: 81a
    text: |-
      1 De premiepensioeninstelling is verplicht de waarde van de pensioenaanspraken van de deelnemer, gewezen deelnemer
      of andere aanspraakgerechtigde op de datum van omzetting van de aanspraken in een vastgestelde pensioenuitkering
      rechtstreeks over te dragen aan een door de premiepensioeninstelling aan te wijzen verzekeraar.

      2 In afwijking van het eerste lid is de premiepensioeninstelling verplicht op verzoek van de deelnemer, gewezen
      deelnemer of andere aanspraakgerechtigde de waarde van zijn pensioenaanspraken per de pensioendatum rechtstreeks
      over te dragen aan een pensioenuitvoerder die door de deelnemer, gewezen deelnemer of andere aanspraakgerechtigde
      is aangewezen. Daarbij gelden de volgende voorwaarden:

      a. indien de door de deelnemer, gewezen deelnemer of andere aanspraakgerechtigde aangewezen pensioenuitvoerder een
      pensioenfonds is, de deelnemer, gewezen deelnemer of andere aanspraakgerechtigde al pensioenaanspraken heeft jegens
      dat pensioenfonds; en

      b. de ontvangende pensioenuitvoerder hanteert dezelfde methode als de premiepensioeninstelling om aan het vereiste
      van gelijke behandeling van mannen en vrouwen te voldoen.

      Indien het verzoek van de deelnemer of gewezen deelnemer tot waardeoverdracht partnerpensioen betreft, is voor de
      waardeoverdracht van dit partnerpensioen tevens vereist dat de partner die begunstigde is voor het partnerpensioen
      met de waardeoverdracht instemt.

      3 De overdrachtswaarde wordt door de premiepensioeninstelling zodanig vastgesteld dat de voor mannen en vrouwen
      te verwerven pensioenrechten gelijk zijn waarbij aan het vereiste van collectieve actuariële gelijkwaardigheid op
      basis van dezelfde grondslagen wordt voldaan.

      4 Het derde lid is van toepassing op pensioenaanspraken die vanaf 1 januari 2005 zijn opgebouwd.

      5 Voor zover het pensioenaanspraken betreft die als gevolg van een premievrije voortzetting van die aanspraken
      worden opgebouwd, is het derde lid van toepassing indien het recht op die premievrije voortzetting is ontstaan op
      of na 1 januari 2002.

      6 In afwijking van het vierde lid kunnen de in het derde lid opgenomen voorwaarden van toepassing zijn op
      pensioenaanspraken die zijn opgebouwd voor 1 januari 2005 indien dit is overeengekomen in de pensioenovereenkomst.

      7 Elk beding strijdig met dit artikel is nietig.

      8 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld aan het vaststellen van de
      overdrachtswaarde.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel81a
