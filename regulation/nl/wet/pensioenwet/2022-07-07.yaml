  - number: '191'
    text: |-
      De toezichthouder maakt een besluit tot het aanstellen van een bewindvoerder ingevolge deze wet na bekendmaking
      openbaar, tenzij de openbaarmaking van het besluit in strijd is of zou kunnen komen met het doel van het door de
      toezichthouder uit te oefenen toezicht op de naleving van deze wet.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel191
  - number: '192'
    text: |-
      De vergunning, bedoeld in [artikel 125, eerste lid, onderdeel a][ref1], wordt op aanvraag door de toezichthouder
      verleend wanneer het pensioenfonds:

      a. is ingeschreven in het register, bedoeld in [artikel 210][ref2]; en

      b. voldoet aan de [artikelen 106][ref3], [126][ref4], [143][ref5] en [147, tweede lid][ref6] en titel IV van
      [richtlijn 2016/2341](32016L2341)/EU.


