  - number: '72'
    text: |-
      De in [artikel 71][ref1] genoemde plicht tot waardeoverdracht geldt niet zolang:

      a. de overdragende of ontvangende pensioenuitvoerder een pensioenfonds is waarbij gezien de beleidsdekkingsgraad de
      technische voorzieningen niet meer volledig door waarden worden gedekt;

      b. de overdragende of ontvangende pensioenuitvoerder een verzekeraar is:

      1°. ten aanzien waarvan een besluit als bedoeld in [artikel 3A:85 van de Wet op het financieel toezicht](onbekend)
      is genomen; of

      2°. die failliet is; of

      c. de overdragende pensioenuitvoerder een verzekeraar is en aanvullende bijdragen van de werkgever noodzakelijk
      zijn maar de financiële toestand van die werkgever blijkens een schriftelijke verklaring van een niet aan de
      onderneming van de werkgever verbonden registeraccountant of accountant-administratieconsulent die aanvullende
      bijdragen niet toelaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel72
