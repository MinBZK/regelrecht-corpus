  - number: '112'
    text: |-
      1 De oprichters melden de voorgenomen oprichting van een ondernemingspensioenfonds of bedrijfstakpensioenfonds
      uiterlijk zes weken voor de beoogde datum van oprichting aan de toezichthouder.

      2 Het ondernemingspensioenfonds of bedrijfstakpensioenfonds meldt binnen drie maanden na zijn oprichting deze
      oprichting aan de toezichthouder.

      3 Bij de melding, bedoeld in het tweede lid, worden gevoegd:

      a. een authentiek afschrift van de akte van oprichting van het pensioenfonds;

      b. een door het bestuur gewaarmerkt exemplaar van het reglement of de reglementen van het pensioenfonds;

      c. een door het bestuur gewaarmerkt afschrift van de uitvoeringsovereenkomst;

      d. een actuariële en bedrijfstechnische nota als bedoeld in [artikel 145][ref1]; en

      e. een eventuele overeenkomst tot verzekering, overdracht of onderbrenging.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel145
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel112
