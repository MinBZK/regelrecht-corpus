  - number: '130'
    text: |-
      Een pensioenfonds vermeldt in zijn jaarrekening en bestuursverslag:

      a. de hoogte van de totale kostendekkende premie, bedoeld in [artikel 128, eerste lid][ref1];

      b. de hoogte van de totale gedempte premie, bedoeld in [artikel 128, tweede lid][ref2]; en

      c. de hoogte van de totale feitelijke premie.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel128
