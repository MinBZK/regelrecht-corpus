  - number: '62'
    text: |-
      1 Indien de pensioenovereenkomst de deelnemer of gewezen deelnemer de mogelijkheid biedt:

      a. in plaats van een bepaald soort pensioen geheel of gedeeltelijk te kiezen voor een ander soort pensioen, dan het
      pensioen, bedoeld in de [artikelen 60][ref1] en [61][ref2];

      b. de ingangsdatum van het ouderdomspensioen te vervroegen of uit te stellen;

      c. de hoogte van het ouderdomspensioen te laten variëren als bedoeld in [artikel 63][ref3]; of

      d. tot een keuze anders dan bedoeld in de voorgaande onderdelen;

      waarborgt de pensioenuitvoerder dat bij gebruikmaking van de keuzemogelijkheid geen onderscheid gemaakt wordt
      tussen mannen en vrouwen door vaststelling van een ruilvoet of opbouwkeuzevoet per keuzerecht die voldoet aan het
      vereiste van collectieve actuariële gelijkwaardigheid.

      2 Bij gebruikmaking van een in het eerste lid bedoelde keuzemogelijkheid is de toestemming vereist van de partner
      die begunstigde is voor partnerpensioen indien de hoogte daarvan door gebruikmaking van de keuzemogelijkheid wordt
      verlaagd.

      3 Het eerste lid is:

      a. met betrekking tot uitkeringsovereenkomsten en kapitaalovereenkomsten van toepassing op pensioenaanspraken die
      vanaf 1 januari 2002 zijn opgebouwd;

      b. met betrekking tot premieovereenkomsten van toepassing op pensioenaanspraken die vanaf 1 januari 2005 zijn
      opgebouwd.

      4 Voorzover het bij de toepassing van het eerste lid pensioenaanspraken betreft die als gevolg van een premievrije
      voortzetting van die aanspraken worden opgebouwd, is het eerste lid van toepassing indien het recht op die
      premievrije voortzetting is ontstaan op of na 1 januari 2002.

      5 In afwijking van het derde lid kan het eerste lid van toepassing zijn op pensioenaanspraken die zijn opgebouwd
      voor 1 januari 2002 respectievelijk 1 januari 2005 indien dit is overeengekomen in de pensioenovereenkomst.

      6 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het eerste lid.


