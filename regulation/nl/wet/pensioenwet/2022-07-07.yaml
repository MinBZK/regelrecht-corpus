      Zaken betreffende vorderingen uit hoofde van een pensioenovereenkomst, een uitvoeringsovereenkomst, een
      uitvoeringsreglement of een pensioenreglement worden door de kantonrechter behandeld en beslist.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel216
  - number: '217'
    text: |-
      1 Het verantwoordingsorgaan of het belanghebbendenorgaan kan bij de ondernemingskamer van het gerechtshof Amsterdam
      beroep instellen tegen een besluit betreffende een aangelegenheid als bedoeld in [artikel 115a, derde lid][ref1]
      onderscheidenlijk [artikel 115c, eerste lid][ref2], indien:

      a. het verantwoordingsorgaan of het belanghebbendenorgaan met betrekking tot dat besluit niet voorafgaand in de
      gelegenheid is gesteld advies uit te brengen;

      b. dat besluit niet in overeenstemming is met het advies van het verantwoordingsorgaan of het
      belanghebbendenorgaan; of

      c. feiten en omstandigheden bekend zijn geworden die, waren zij aan het verantwoordingsorgaan of het
      belanghebbendenorgaan bekend geweest ten tijde van het uitbrengen van zijn advies, aanleiding zouden kunnen zijn
      geweest om dat advies niet uit te brengen zoals het is uitgebracht.

      2 Het beroep wordt ingediend bij verzoekschrift, binnen acht weken nadat het verantwoordingsorgaan of het
      belanghebbendenorgaan van het besluit in kennis is gesteld.

      3 Het pensioenfonds wordt van het ingestelde beroep in kennis gesteld.

      4 Het verzoek is niet-ontvankelijk indien met betrekking tot dezelfde aangelegenheid een aanwijzing is gegeven door
      de toezichthouder.

      5 Het beroep kan uitsluitend worden ingesteld terzake dat het pensioenfonds bij afweging van de betrokken belangen
      niet in redelijkheid tot zijn besluit had kunnen komen.

      6 De ondernemingskamer behandelt het verzoek met de meeste spoed. Alvorens te beslissen kan zij, ook ambtshalve,
      deskundigen, alsmede bij het pensioenfonds werkzame personen horen. Indien de ondernemingskamer het beroep gegrond
      bevindt, kan zij, indien het verantwoordingsorgaan of het belanghebbendenorgaan daarom heeft verzocht, een of meer
      van de volgende voorzieningen treffen:

      a. het opleggen van de verplichting aan het pensioenfonds om het besluit geheel of ten dele in te trekken, alsmede
      om aan te wijzen gevolgen van dat besluit ongedaan te maken;

      b. het opleggen van een verbod aan het pensioenfonds om handelingen te verrichten of te doen verrichten ter
      uitvoering van het besluit of onderdelen daarvan.

      7 Het pensioenfonds moet aan de getroffen voorziening voldoen; een voorziening kan door derden verworven rechten
      echter niet aantasten.

      8 De ondernemingskamer kan haar beslissing op een verzoek tot het treffen van voorzieningen voor een door haar
      te bepalen termijn aanhouden, indien beide partijen daar om verzoeken, dan wel indien het pensioenfonds op zich
      neemt het besluit waartegen beroep is ingesteld, in te trekken of te wijzigen, of bepaalde gevolgen van het besluit
      ongedaan te maken.

      9 Nadat het verzoekschrift is ingediend kan de ondernemingskamer, zo nodig onverwijld, voorlopige voorzieningen
      treffen. De derde zin van het zesde lid en het zevende lid zijn van overeenkomstige toepassing.

      10 Van een beschikking van de ondernemingskamer staat uitsluitend beroep in cassatie open.

      11 De kosten van het voeren van rechtsgedingen door het verantwoordingsorgaan of het belanghebbendenorgaan komen
      ten laste van het pensioenfonds indien zij redelijkerwijs noodzakelijk zijn voor de vervulling van de taak van het
      verantwoordingsorgaan of het belanghebbendenorgaan en het pensioenfonds van de te maken kosten vooraf in kennis is
      gesteld. In rechtsgedingen tussen het pensioenfonds en het verantwoordingsorgaan of het belanghebbendenorgaan kan
      het verantwoordingsorgaan of het belanghebbendenorgaan niet in de proceskosten worden veroordeeld.


