  - number: 101a
    text: |-
      1 Het gemengd bestuur van een pensioenfonds bestaat uit uitvoerende bestuurders en niet uitvoerende bestuurders.

      2 Voor de samenstelling, zetelverdeling en benoeming van de uitvoerende bestuurders bij een paritair gemengd
      bestuur zijn de [artikelen 100][ref1] en [102][ref2] van overeenkomstige toepassing. Voor de samenstelling van
      de uitvoerende bestuurders bij een onafhankelijk gemengd bestuur is [artikel 101][ref3] van overeenkomstige
      toepassing.

      3 Het gemengd bestuur heeft ten minste drie natuurlijke personen als niet uitvoerende bestuurders. De niet
      uitvoerende bestuurders zijn niet directe vertegenwoordigers van de belanghebbenden bij het pensioenfonds.

      4 Bij de statuten van een pensioenfonds met een gemengd bestuur wordt bepaald dat de bestuurstaken worden
      verdeeld over niet uitvoerende bestuurders en uitvoerende bestuurders. [Artikel 104, tweede lid][ref4], is van
      overeenkomstige toepassing op de taken van de niet uitvoerende bestuurders. De taak om toezicht te houden op de
      taakuitoefening door bestuurders kan niet door een taakverdeling worden ontnomen aan niet uitvoerende bestuurders.
      Het voorzitterschap van het bestuur, het doen van voordrachten voor benoeming van een bestuurder en het vaststellen
      van de bezoldiging van uitvoerende bestuurders kan niet aan een uitvoerende bestuurder worden toebedeeld.

      5 De uitvoerende bestuurders nemen niet deel aan de besluitvorming over het vaststellen van de bezoldiging van
      uitvoerende bestuurders.

      6 Bij of krachtens de statuten kan worden bepaald dat een of meer bestuurders rechtsgeldig kunnen besluiten over
      zaken die tot zijn respectievelijk hun taak behoren. Bepaling krachtens de statuten geschiedt schriftelijk.

      7 In afwijking van het tweede en derde lid kan een omgekeerd gemengd bestuur worden gevormd waarbij voor de
      samenstelling van de uitvoerende bestuurders [artikel 101][ref5] van overeenkomstige toepassing is en waarbij
      voor de samenstelling, zetelverdeling en benoeming van de niet uitvoerende bestuurders de [artikelen 100][ref6] en
      [102][ref7] van overeenkomstige toepassing zijn.

      8 Een omgekeerd gemengd bestuur heeft een onafhankelijke voorzitter die geen vertegenwoordiger is van de
      belanghebbenden bij het pensioenfonds.

      9 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de bevoegdheden van de
      onafhankelijk voorzitter, bedoeld in het achtste lid, de samenstelling van een omgekeerd gemengd bestuur en over de
      taakverdeling in en organisatie van dit bestuur.


