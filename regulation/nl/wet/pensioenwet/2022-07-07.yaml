  - number: '206'
    text: |-
      1 De toezichthouder kan, in afwijking van [artikel 204, eerste lid][ref1], vertrouwelijke gegevens of inlichtingen
      verkregen bij de uitvoering van de hem ingevolge deze wet opgedragen taak, verstrekken aan een persoon als bedoeld
      in de onderdelen a, b, c, d, of e voorzover de gegevens of inlichtingen dienstig zijn voor de uitoefening van zijn
      taak:

      a. een bewindvoerder die ingevolge [artikel 173][ref2] is benoemd;

      b. een rechter-commissaris die ingevolge [artikel 223a van de Faillissementswet][ref3] is benoemd;

      c. een bewindvoerder die ingevolge [artikel 215, tweede lid, van de Faillissementswet][ref4] is benoemd;

      d. een rechter-commissaris die ingevolge [artikel 14 van de Faillissementswet][ref5] is benoemd;

      e. een curator die ingevolge [artikel 14 van de Faillissementswet][ref6] is aangesteld.

      2 De toezichthouder verstrekt geen vertrouwelijke gegevens of inlichtingen als bedoeld in het eerste lid:

      a. indien de verstrekking van de vertrouwelijke gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen
      komen met de belangen die deze wet beoogt te beschermen;

      b. indien de vertrouwelijke gegevens of inlichtingen zijn verkregen van de andere toezichthouder of een
      toezichthoudende instantie, en deze andere toezichthouder of die toezichthoudende instantie niet instemt met het
      verstrekken van de vertrouwelijke gegevens of inlichtingen.

      3 De curator die is aangesteld in het faillissement van een pensioenuitvoerder kan, in afwijking van
      [artikel 204, eerste lid][ref7], vertrouwelijke gegevens of inlichtingen als bedoeld in het eerste lid verstrekken
      aan de rechtbank, voorzover die geen betrekking hebben op een onderneming die betrokken is of betrokken is geweest
      bij een poging de pensioenuitvoerder in staat te stellen zijn activiteiten voort te zetten.

      4 [Artikel 204, eerste lid][ref8], laat onverlet de toepasselijkheid van de bepalingen van het
      [Wetboek van Burgerlijke Rechtsvordering][ref9] welke betrekking hebben op het als getuige of als partij in een
      comparitie van partijen dan wel als deskundige in burgerlijke zaken afleggen van een verklaring omtrent gegevens
      of inlichtingen verkregen bij de vervulling van zijn ingevolge deze wet opgedragen taak, voorzover het gaat om
      vertrouwelijke gegevens of inlichtingen omtrent een pensioenuitvoerder die in staat van faillissement is verklaard
      of op grond van een rechterlijke uitspraak is ontbonden. De vorige volzin is niet van toepassing op vertrouwelijke
      gegevens of inlichtingen die betrekking hebben op een onderneming die betrokken is of betrokken is geweest bij een
      poging de desbetreffende pensioenuitvoerder in staat te stellen zijn activiteiten voort te zetten.

      5 De toezichthouder kan, in afwijking van [artikel 204, eerste lid][ref10], gegevens over het aantal deelnemers bij
      een pensioenuitvoerder verstrekken aan de op grond van [artikel 51, zesde lid][ref11], aangewezen instelling.


