  - number: '213'
    text: |-
      1 De ontheffing kan onder beperkingen worden verleend.

      2 Aan de ontheffing kunnen voorschriften worden verbonden.

      3 De ontheffing kan worden ingetrokken wanneer:

      a. een of meer van de redenen waarom zij is verleend is of zijn vervallen;

      b. na de verlening zich zodanige feiten of omstandigheden hebben voorgedaan of zijn gebleken dat, indien deze ook
      ten tijde van de verlening bekend waren geweest, de ontheffing niet of niet in die vorm zou zijn verleend;

      c. een of meer van de daaraan verbonden voorschriften niet wordt nageleefd.

      4 De toezichthouder stelt beleidsregels vast over de verlening van ontheffing.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel213
  - number: '214'
    text: |-
      1 Onze Minister zendt in aanvulling op [artikel 18, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1]
      alle van belang zijnde door de toezichthouder aan Onze Minister uitgebrachte toezichtrapportages, in de vorm waarin
      zij aan hem zijn voorgelegd, zo nodig voorzien van zijn oordeel, aan de Staten-Generaal.

      2 De verplichting om elke vijf jaar een verslag aan beide kamers der Staten-Generaal te zenden ten behoeve van
      de beoordeling van de doelmatigheid en doeltreffendheid van het functioneren van een zelfstandig bestuursorgaan,
      bedoeld in [artikel 39, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref2], berust ten aanzien van het
      functioneren van de toezichthouder op grond van deze wet bij Onze Minister.


