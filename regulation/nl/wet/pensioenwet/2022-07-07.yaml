        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 46a
    text: |-
      1 De pensioenuitvoerder stelt op zijn website voor in ieder geval de deelnemer, gewezen deelnemer, gewezen partner
      of pensioengerechtigde beschikbaar:

      a. informatie over de pensioenregeling als bedoeld in [artikel 21][ref1];

      b. verdere informatie over de pensioenregeling;

      c. informatie over uitvoeringskosten; en

      d. het bestuursverslag en de jaarrekening.

      2 Voor zover van toepassing stelt de pensioenuitvoerder op zijn website voor de deelnemer, gewezen deelnemer,
      gewezen partner of pensioengerechtigde beschikbaar:

      a. informatie over de gevolgen van significante wijzigingen in de technische voorzieningen;

      b. informatie over het financieel crisisplan;

      c. informatie over het herstelplan of geactualiseerd herstelplan;

      d. het pensioenreglement; en

      e. de uitvoeringsovereenkomst of het uitvoeringsreglement.

      3 Voor zover van toepassing stelt de pensioenuitvoerder op zijn website voor een ieder de verklaring inzake
      beleggingsbeginselen beschikbaar.

      4 In het bestuursverslag, bedoeld in het eerste lid, onderdeel d, neemt een pensioenfonds informatie op
      over de haalbaarheidstoets en de reële dekkingsgraad. Een pensioenuitvoerder neemt in het bestuursverslag
      informatie op over de totale waarde en de bestemming van de pensioenaanspraken die vervallen, bedoeld in
      [artikel 55, zesde lid][ref2].

      5 Indien de deelnemer, gewezen deelnemer, gewezen partner of pensioengerechtigde hierom verzoekt verstrekt
      de pensioenuitvoerder de in het eerste tot en met derde lid bedoelde informatie en stukken elektronisch of
      schriftelijk.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer het opnemen van gegevens over de vergelijkbaarheid van onderdelen van de pensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel55
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel46a
