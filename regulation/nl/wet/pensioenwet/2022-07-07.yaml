  - number: '84'
    text: |-
      1 De pensioenuitvoerder is verplicht tot waardeoverdracht aan een andere pensioenuitvoerder bij liquidatie van
      de eerstgenoemde pensioenuitvoerder. Het algemeen pensioenfonds is verplicht tot waardeoverdracht aan een andere
      pensioenuitvoerder of een andere collectiviteitkring bij beëindiging van een collectiviteitkring.

      2 In geval van een waardeoverdracht als bedoeld in het eerste lid gelden de volgende voorwaarden:

      a. het voornemen tot waardeoverdracht aan een pensioenuitvoerder wordt door de overdragende pensioenuitvoerder
      uiterlijk drie maanden voor de beoogde datum van waardeoverdracht schriftelijk gemeld aan de toezichthouder en de
      toezichthouder heeft binnen die periode geen verbod tot waardeoverdracht opgelegd;

      b. de overdrachtswaarde wordt zodanig door de overdragende pensioenuitvoerder vastgesteld dat de voor mannen
      en vrouwen te verwerven pensioenrechten gelijk zijn, waarbij aan het vereiste van collectieve actuariële
      gelijkwaardigheid op basis van dezelfde grondslagen wordt voldaan.

      3 Het tweede lid, onderdeel b, is met betrekking tot:

      a. uitkeringsovereenkomsten van toepassing op pensioenaanspraken die vanaf 1 januari 2002 zijn opgebouwd;

      b. premieovereenkomsten en kapitaalovereenkomsten van toepassing op pensioenaanspraken die vanaf 1 januari 2005
      zijn opgebouwd.

      4 Op pensioenaanspraken die voor de in het derde lid genoemde data zijn opgebouwd is de eis van individuele
      actuariële gelijkwaardigheid, bedoeld in [artikel 71, vierde lid][ref1], van toepassing tenzij in de
      pensioenovereenkomst is overeengekomen dat de voorwaarden, bedoeld in het tweede lid, onderdeel b, van toepassing
      zijn.

      5 Voorzover het bij de toepassing van het eerste lid pensioenaanspraken betreft die als gevolg van een premievrije
      voortzetting van die pensioenaanspraken worden opgebouwd is onderdeel b van het tweede lid van toepassing indien
      het recht op die premievrije voortzetting is ontstaan op of na 1 januari 2002.

      6 Elk beding strijdig met dit artikel is nietig.

      7 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld aan het vaststellen van de
      overdrachtswaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
