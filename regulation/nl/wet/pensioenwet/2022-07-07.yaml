  - number: '138'
    text: |-
      1 Wanneer de beleidsdekkingsgraad van een pensioenfonds per het einde van een kalenderkwartaal is komen te liggen
      onder de bij of krachtens [artikel 132][ref1] gestelde eisen ten aanzien van het vereist eigen vermogen, meldt het
      pensioenfonds dit onverwijld aan de toezichthouder. Wanneer de beleidsdekkingsgraad van een pensioenfonds, waarvan
      het minimaal vereist eigen vermogen hoger is dan het vereist eigen vermogen, per het einde van een kalenderkwartaal
      is komen te liggen onder de bij of krachtens [artikel 131][ref2] gestelde eisen ten aanzien van het minimaal
      vereist eigen vermogen, meldt het pensioenfonds dit onverwijld aan de toezichthouder.

      2 In de in de eerste zin van het eerste lid bedoelde situatie dient het pensioenfonds binnen drie maanden of zoveel
      eerder als de toezichthouder bepaalt ter instemming bij de toezichthouder een concreet en haalbaar herstelplan in,
      tenzij het pensioenfonds gezien de beleidsdekkingsgraad op dat moment weer voldoet aan [artikel 132][ref3]. In het
      herstelplan werkt het pensioenfonds uit hoe het uiterlijk binnen tien jaar zal voldoen aan artikel 132.

      3 In afwijking van het tweede lid kan de toezichthouder, in verband met de specifieke situatie van het
      pensioenfonds en in het belang van de aanspraak- en pensioengerechtigden, bepalen dat voor het herstelplan een
      kortere termijn geldt dan tien jaar.

      4 Een pensioenfonds dat bijdragen ontvangt van een in een andere lidstaat gevestigde bijdragende onderneming en
      een beleidsdekkingsgraad heeft die ligt onder de bij of krachtens [artikel 131][ref4] gestelde eisen ten aanzien
      van het minimaal vereist eigen vermogen werkt in het herstelplan tevens uit hoe het binnen een jaar zal voldoen aan
      artikel 131.

      5 Het herstelplan vertoont een in beginsel tijdsevenredig herstel. In afwijking hiervan kan het herstelplan een
      meer dan tijdsevenredig herstel vertonen in de eerste helft van de looptijd van het herstelplan.

      6 Het herstelplan gaat uiterlijk zes maanden nadat de beleidsdekkingsgraad is komen te liggen onder de bij
      of krachtens [artikel 132][ref5] gestelde eisen in. Het pensioenfonds handelt onverwijld overeenkomstig het
      herstelplan.

      7 Het pensioenfonds stelt jaarlijks de beleidsdekkingsgraad vast op het moment waarop een situatie als
      bedoeld in het eerste lid is vastgesteld. Zo nodig in afwijking van de vorige zin kan het pensioenfonds de
      beleidsdekkingsgraad jaarlijks vaststellen per het einde van het vierde kalenderkwartaal, door de eerste
      vaststelling van de beleidsdekkingsgraad na het moment waarop een situatie als bedoeld in het eerste lid, is
      vastgesteld te vervroegen.

      8 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel die
      onder meer betrekking hebben op de periode tot het herstelplan ingaat.


