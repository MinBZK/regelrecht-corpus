  - number: '56'
    text: |-
      Indien de pensioenovereenkomst voorziet in een partnerpensioen is het opnemen van onbetaald verlof tot een
      maximum van 18 maanden door de deelnemer tijdens de deelneming niet van invloed op de dekking uit hoofde van het
      partnerpensioen.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel56
  - number: '57'
    text: |-
      1 Indien de partnerrelatie van een deelnemer eindigt door scheiding verkrijgt de gewezen partner van de deelnemer
      een zodanige aanspraak op partnerpensioen als de deelnemer ten behoeve van die gewezen partner zou hebben behouden
      indien op het tijdstip van scheiding zijn deelneming zou zijn geëindigd.

      2 Indien de partnerrelatie van een gewezen deelnemer eindigt door scheiding, en de gewezen deelnemer ten behoeve
      van die partner een aanspraak op partnerpensioen heeft behouden bij beëindigen van de deelneming, gaat de aanspraak
      over op de gewezen partner van de gewezen deelnemer.

      3 Indien de partnerrelatie van een gepensioneerde eindigt door scheiding, en de gepensioneerde ten behoeve van
      die partner een aanspraak op partnerpensioen heeft behouden bij het ingaan van het ouderdomspensioen, gaat die
      aanspraak over op de gewezen partner van de gepensioneerde.

      4 Het eerste, tweede en derde lid vindt geen toepassing indien de partners bij voorwaarden in verband met de
      partnerrelatie of een schriftelijk gesloten overeenkomst met betrekking tot de scheiding anders overeenkomen. Deze
      voorwaarden of overeenkomst zijn respectievelijk is slechts geldig indien de pensioenuitvoerder zich bereid heeft
      verklaard hiermee in te stemmen en bereid is een uit de afwijking voortvloeiend risico te dekken dan wel het niveau
      van de uitkering aan te passen.

      5 Een gewezen partner met een recht op bijzonder partnerpensioen als bedoeld in het eerste, tweede of derde lid,
      heeft het recht dit te vervreemden aan een eerdere of latere partner van de overleden deelnemer, gewezen deelnemer
      of gepensioneerde, mits:

      a. de pensioenuitvoerder bereid is een eventueel uit die overdracht voortvloeiende wijziging van het risico te
      dekken;

      b. de vervreemding onherroepelijk is; en

      c. dit wordt overeengekomen bij notarieel verleden akte.

      6 Indien na toepassing van het eerste of tweede lid de gewezen partner overlijdt voordat de deelnemer of gewezen
      deelnemer overlijdt, maakt de aanspraak op het partnerpensioen vanaf het moment van overlijden van de gewezen
      partner weer deel uit van de pensioenaanspraken van de deelnemer of gewezen deelnemer, bedoeld in het eerste en
      tweede lid, voor zover dit in de betrokken pensioenregeling is bepaald.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel57
  - number: '58'
    text: |-
      1 Indien een ouderdomspensioenrecht van een gepensioneerde die geen gewezen deelnemer is geweest wordt verhoogd
      door middel van een toeslag, wordt het ouderdomspensioenrecht van een gepensioneerde die wel gewezen deelnemer is
      geweest in dezelfde mate verhoogd indien zij in dezelfde pensioenregeling hebben deelgenomen.

      2 Indien een recht op partnerpensioen van de partner van een overleden gepensioneerde die geen gewezen deelnemer is
      geweest wordt verhoogd door middel van een toeslag, worden de partnerpensioenrechten:

      a. ten behoeve van de partners van overleden gepensioneerden die gewezen deelnemer zijn geweest;

      b. ten behoeve van de partners van overleden gewezen deelnemers;

      c. ten behoeve van de partners van overleden deelnemers; en

      d. van de gewezen partners met een bijzonder partnerpensioen;

      in dezelfde mate verhoogd, mits deze rechten voortvloeien uit een pensioenovereenkomst die gebaseerd is op dezelfde
      pensioenregeling als die van de overleden gepensioneerde die geen gewezen deelnemer is geweest.

      3 Indien een ouderdomspensioenrecht wordt verhoogd door middel van een toeslag, wordt de aanspraak op
      ouderdomspensioen van een gewezen deelnemer die in dezelfde pensioenregeling heeft deelgenomen in dezelfde mate
      verhoogd.

      4 Indien een aanspraak op partnerpensioen van een gepensioneerde die geen gewezen deelnemer is geweest wordt
      verhoogd door middel van een toeslag, worden de partnerpensioenaanspraken:

      a. ten behoeve van de partner van een gepensioneerde die wel gewezen deelnemer is geweest;

      b. ten behoeve van de partner van een gewezen deelnemer; en

      c. van de gewezen partner van de gewezen deelnemer met een bijzonder partnerpensioen;

      in dezelfde mate verhoogd, mits deze aanspraken voortvloeien uit een pensioenovereenkomst die is gebaseerd op
      dezelfde pensioenregeling als die van de gepensioneerde die geen gewezen deelnemer is geweest.

      5 Bij de verlening van toeslagen op partnerpensioen wordt geen onderscheid gemaakt tussen partners.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel58
  - number: '59'
    text: |-
      Een rechtsvordering tegen een pensioenuitvoerder tot het doen van een uitkering verjaart niet bij leven van de
      pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel59
  - number: '60'
    text: |-
      1 Indien een pensioenregeling op basis van een pensioenovereenkomst voorziet in de opbouw van een ouderdomspensioen
      en een partnerpensioen, biedt de pensioenregeling aan de deelnemer of gewezen deelnemer met betrekking tot perioden
      van opbouw vanaf 1 januari 2002, ongeacht zijn burgerlijke staat, het recht in elk geval met ingang van de datum
      waarop het ouderdomspensioen ingaat of kan ingaan, in plaats van partnerpensioen te kiezen voor één van de volgende
      wijzigingen van het ouderdomspensioen:

      a. een hoger ouderdomspensioen;

      b. een eerder ingaand ouderdomspensioen; of

      c. een hoger en een eerder ingaand ouderdomspensioen.

      2 Het eerste lid is niet van toepassing op de aanspraak op bijzonder partnerpensioen van de gewezen partner.

      3 Indien er in de pensioenovereenkomst geen recht op de keuzemogelijkheid als bedoeld in het eerste lid is
      opgenomen heeft de deelnemer of gewezen deelnemer het recht om te kiezen voor één van deze mogelijkheden.

      4 De pensioenuitvoerder waarborgt dat bij gebruikmaking van het keuzerecht geen onderscheid gemaakt wordt tussen
      mannen en vrouwen door vaststelling van een ruilvoet of opbouwkeuzevoet.

      5 De pensioenuitvoerder waarborgt bij de vaststelling van een ruilvoet of opbouwkeuzevoet dat voldaan wordt aan
      het vereiste van collectieve actuariële gelijkwaardigheid hetgeen inhoudt dat de collectieve actuariële waarde van
      het ouderdomspensioen, bedoeld in het eerste lid, dat wordt gekozen in plaats van het partnerpensioen, bedoeld in
      het eerste lid, ongeacht de datum waarop de keuze wordt gemaakt, ten minste gelijkwaardig is aan de op dezelfde
      grondslagen berekende collectieve actuariële waarde van dat partnerpensioen.

      6 Bij de keuze, bedoeld in het eerste of derde lid, is de toestemming vereist van de partner die begunstigde is
      voor het in het eerste lid bedoelde partnerpensioen.

      7 Het vierde en vijfde lid zijn:

      a. met betrekking tot uitkeringsovereenkomsten en kapitaalovereenkomsten van toepassing op pensioenaanspraken die
      vanaf 1 januari 2002 zijn opgebouwd;

      b. met betrekking tot premieovereenkomsten van toepassing op pensioenaanspraken die vanaf 1 januari 2005 zijn
      opgebouwd.

      8 Voorzover het bij de toepassing van het eerste lid pensioenaanspraken betreft die als gevolg van een premievrije
      voortzetting van die pensioenaanspraken worden opgebouwd, is het eerste lid van toepassing indien het recht op die
      premievrije voortzetting is ontstaan op of na 1 januari 2002.

      9 In afwijking van het zevende lid kunnen het vierde en vijfde lid van toepassing zijn op pensioenaanspraken
      die zijn opgebouwd voor 1 januari 2002 respectievelijk 1 januari 2005 indien dit is overeengekomen in de
      pensioenovereenkomst.

      10 Elk beding strijdig met dit artikel is nietig.

      11 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het eerste tot en met
      het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel60
  - number: '61'
    text: |-
      1 Indien een pensioenovereenkomst voorziet in een ouderdomspensioen, heeft de deelnemer of gewezen deelnemer het
      recht, in plaats van ouderdomspensioen of een deel van het ouderdomspensioen te kiezen voor partnerpensioen in
      elk geval:

      a. bij beëindiging van de deelneming; en

      b. met ingang van de datum waarop het ouderdomspensioen ingaat of kan ingaan;

      waarbij de hoogte van het partnerpensioen maximaal 70 percent bedraagt van het ouderdomspensioen dat na de uitruil
      resteert.

      2 Indien een pensioenovereenkomst voorziet in een ouderdomspensioen, biedt de pensioenuitvoerder de deelnemer
      bij beëindiging van de deelneming en in het laatste jaar voor ingang van het ouderdomspensioen standaard de
      mogelijkheid, genoemd in het eerste lid, aan.

      3 De pensioenuitvoerder waarborgt dat bij gebruikmaking van het keuzerecht geen onderscheid gemaakt wordt tussen
      mannen en vrouwen door vaststelling van een ruilvoet of opbouwkeuzevoet.

      4 De pensioenuitvoerder waarborgt bij de vaststelling van een ruilvoet of opbouwkeuzevoet dat voldaan wordt aan
      het vereiste van collectieve actuariële gelijkwaardigheid hetgeen inhoudt dat de collectieve actuariële waarde van
      het partnerpensioen, bedoeld in het eerste lid, dat wordt gekozen in plaats van het ouderdomspensioen, bedoeld in
      het eerste lid, ongeacht de datum waarop de keuze wordt gemaakt, ten minste gelijkwaardig is aan de op dezelfde
      grondslagen berekende collectieve actuariële waarde van dat ouderdomspensioen.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de inhoud van
      de keuzemogelijkheid, de wijze waarop de keuzemogelijkheid wordt geboden en de collectieve actuariële
      gelijkwaardigheid, bedoeld in het vierde lid.

      6 De in het eerste lid omschreven mogelijkheid heeft geen betrekking op het deel van een ouderdomspensioen waarop
      een recht op uitbetaling rust als bedoeld in [artikel 2 van de Wet verevening pensioenrechten bij scheiding][ref1].

      7 Indien de deelnemer of gewezen deelnemer niet binnen de door de pensioenuitvoerder gestelde termijn reageert op
      de keuzemogelijkheid die hem ingevolge het tweede lid in het laatste jaar voor de ingang van het ouderdomspensioen
      is aangeboden, gaat de pensioenuitvoerder over tot het uitruilen van het ouderdomspensioen in partnerpensioen
      indien:

      a. de pensioenovereenkomst niet voorziet in een aanspraak op partnerpensioen vanaf de datum waarop het
      ouderdomspensioen ingaat; en

      b. de deelnemer of gewezen deelnemer gehuwd is of een geregistreerde partnerrelatie heeft.

      8 In de pensioenregeling wordt bepaald wat de verhouding is tussen ouderdomspensioen en partnerpensioen na uitruil
      als bedoeld in het zevende lid.

      9 Indien de uitruil, bedoeld in het zevende lid, ertoe zou leiden dat het ouderdomspensioen op jaarbasis lager
      wordt dan het op grond van [artikel 66][ref2] bepaalde bedrag wordt de in het achtste lid bedoelde verhouding
      tussen ouderdomspensioen en partnerpensioen zodanig aangepast dat het ouderdomspensioen op jaarbasis meer bedraagt
      dan het op grond van [artikel 66][ref3] bepaalde bedrag.

      10 Indien de pensioenovereenkomst voorziet in een partnerpensioen op risicobasis kan in de pensioenregeling worden
      bepaald dat het zevende lid, aanhef en onderdeel b, van overeenkomstige toepassing is bij beëindiging van de
      deelneming. Het achtste en negende lid is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel66
