  - number: '63'
    text: |-
      1 De hoogte van een pensioen kan na ingang variëren mits:

      a. de laagste uitkering niet minder bedraagt dan 75% van de hoogste uitkering; en

      b. de mate van variatie uiterlijk op de ingangsdatum van het pensioen wordt vastgesteld.

      2 Voor de toepassing van het eerste lid blijft in de periode tussen de ingangsdatum van het pensioen en het bereiken
      van de pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1],
      van de uitkering buiten aanmerking het gedeelte dat overeenkomt met het bedrag bedoeld in
      [artikel 18d, derde lid, van de Wet op de loonbelasting 1964][ref2]. Ingeval de pensioengerechtigde leeftijd,
      bedoeld in artikel 7a, eerste lid, van de Algemene Ouderdomswet, na de ingangsdatum van het pensioen wordt
      verlaagd, wordt voor de toepassing van de eerste zin uitgegaan van de pensioengerechtigde leeftijd, bedoeld in
      artikel 7a, eerste lid, van de Algemene Ouderdomswet, die van toepassing was voor deze verlaging.

      3 In afwijking in zoverre van het eerste lid, onderdeel b, wordt bij een aanpassing van de pensioengerechtigde
      leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref3], na de ingang van het pensioen,
      de mate van variatie uiterlijk vastgesteld bij het bereiken van de hoogste pensioengerechtigde leeftijd, bedoeld in
      artikel 7a, eerste lid, van de Algemene Ouderdomswet, die op enig moment na de ingangsdatum van het pensioen geldt
      of heeft gegolden voor de pensioengerechtigde.

      4 Voor de toepassing van het eerste lid wordt bij variabele uitkeringen de mate van variatie vastgesteld
      uitgaande van de rendementsverwachtingen op de ingangsdatum van het pensioen. Bij variabele uitkeringen blijven
      aanpassingen buiten aanmerking voor zover deze het gevolg zijn van de omstandigheid dat de opgetreden ontwikkeling
      van de levensverwachting, de behaalde sterfteresultaten of de behaalde beleggingsresultaten tot hogere of lagere
      uitkeringen leiden dan op de ingangsdatum van het pensioen het uitgangspunt was.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18d
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
