  - number: '208'
    text: |-
      1 De toezichthouder kan, in afwijking van [artikel 204, eerste lid][ref1], vertrouwelijke gegevens of inlichtingen
      verkregen bij de vervulling van de hem ingevolge deze wet opgedragen taak, verstrekken aan:

      a. een accountant die het onderzoek naar de staten uitvoert, bedoeld in [artikel 147, vijfde lid][ref2], of die
      is belast met de wettelijke controle van de jaarrekening van een pensioenuitvoerder, voorzover de vertrouwelijke
      gegevens of inlichtingen betrekking hebben op die pensioenuitvoerder en noodzakelijk zijn voor de controle;

      b. een actuaris die het onderzoek naar de staten uitvoert, bedoeld in [artikel 147, vierde lid][ref3], of die is
      belast met de wettelijke controle van een pensioenuitvoerder, voorzover de vertrouwelijke gegevens of inlichtingen
      betrekking hebben op die pensioenuitvoerder en noodzakelijk zijn voor de controle; of

      c. de Europese Centrale Bank, een buitenlandse nationale centrale bank of een andere buitenlandse instantie
      die is belast met een soortgelijke taak, handelend in haar hoedanigheid van monetaire autoriteit, voor zover de
      vertrouwelijke gegevens of inlichtingen dienstig zijn voor de uitoefening van haar wettelijke taken, waaronder de
      monetaire taak en de daarmee samenhangende beschikbaarstelling van liquide middelen, de uitoefening van toezicht op
      betalings- clearing- en afwikkelsystemen en de waarborging van de stabiliteit van het financiële stelsel, of voor
      de taakuitoefening van een andere buitenlandse instantie die is belast met het toezicht op betalingssystemen.

      2 De toezichthouder verstrekt geen vertrouwelijke gegevens of inlichtingen op grond van het eerste lid indien:

      a. het doel waarvoor de vertrouwelijke gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;

      b. het beoogde gebruik van de vertrouwelijke gegevens of inlichtingen niet past in het kader van het toezicht op
      pensioenuitvoerders;

      c. de verstrekking van de vertrouwelijke gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of
      de openbare orde;

      d. de geheimhouding van de vertrouwelijke gegevens of inlichtingen niet in voldoende mate is gewaarborgd;

      e. de verstrekking van de vertrouwelijke gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen
      met de belangen die deze wet beoogt te beschermen; of

      f. onvoldoende is gewaarborgd dat de vertrouwelijke gegevens of inlichtingen niet zullen worden gebruikt voor een
      ander doel dan waarvoor deze worden verstrekt.

      3 Voorzover de gegevens of inlichtingen, bedoeld in het eerste lid, zijn verkregen van een toezichthoudende
      instantie, verstrekt de toezichthouder deze niet aan de andere toezichthouder of aan een andere toezichthoudende
      instantie, tenzij de toezichthoudende instantie waarvan de gegevens of inlichtingen zijn verkregen uitdrukkelijk
      heeft ingestemd met de verstrekking van de gegevens of inlichtingen en in voorkomend geval heeft ingestemd met het
      gebruik voor een ander doel dan waarvoor de gegevens of inlichtingen zijn verstrekt.

      4 Indien een instantie of persoon als bedoeld in het eerste lid aan de toezichthouder die de vertrouwelijke
      gegevens of inlichtingen op grond van dat lid heeft verstrekt, verzoekt om die vertrouwelijke gegevens of
      inlichtingen te mogen gebruiken voor een ander doel dan waarvoor zij zijn verstrekt, willigt de toezichthouder dat
      verzoek slechts in:

      a. indien het beoogde gebruik niet in strijd is met het eerste, tweede of derde lid; of

      b. voorzover die instantie of persoon op een andere wijze dan in deze wet voorzien met inachtneming van de daarvoor
      geldende wettelijke procedures voor dat andere doel de beschikking over die gegevens of inlichtingen zou kunnen
      verkrijgen; en

      c. na overleg met Onze Minister van Veiligheid en Justitie indien het in de aanhef bedoelde verzoek betrekking
      heeft op een onderzoek naar strafbare feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel204
