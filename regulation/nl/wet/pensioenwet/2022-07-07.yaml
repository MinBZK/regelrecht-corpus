  - number: 69a
    text: |-
      1 Een pensioenuitvoerder is verplicht om na een verzoek van de deelnemer of gewezen deelnemer over te gaan tot
      afkoop van een deel van de waarde van diens aanspraken op ouderdomspensioen, indien:

      a. het maximaal 10% van de waarde van de aanspraken op ouderdomspensioen betreft;

      b. de afkoop geschiedt op de ingangsdatum van het ouderdomspensioen;

      c. ingeval de pensioenovereenkomst de mogelijkheid biedt om de hoogte van het ouderdomspensioen te laten variëren
      als bedoeld in [artikel 63][ref1], de deelnemer of gewezen deelnemer geen gebruik maakt van deze mogelijkheid;

      d. na de afkoop de uitkering van het ouderdomspensioen op jaarbasis gelijk is aan of meer bedraagt dan het bedrag,
      genoemd in [artikel 66, eerste lid, onderdeel a][ref2]; en

      e. ingeval door de afkoop de hoogte van het partnerpensioen wordt verlaagd, de partner van de deelnemer of gewezen
      deelnemer die begunstigde is voor het partnerpensioen toestemming heeft gegeven voor de afkoop.

      2 In afwijking van het eerste lid is een pensioenuitvoerder verplicht om na een verzoek van een
      deelnemer of gewezen deelnemer over te gaan tot afkoop van een deel van de waarde van diens recht op
      ouderdomspensioen in de maand februari volgend op het jaar waarin de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref3], is bereikt, met dien verstande dat afkoop op dat
      moment alleen mogelijk is als dat moment ligt na de ingangsdatum van het ouderdomspensioen. Het eerste lid,
      onderdelen a, c, d en e, zijn van overeenkomstige toepassing. Indien afkoop geschiedt in de maand februari, bedoeld
      in dit artikellid, wordt het ouderdomspensioen tot het moment van de afkoop vastgesteld alsof geen gebruik wordt
      gemaakt van het recht op afkoop.

      3 Het verzoek om gebruik te maken van het recht op afkoop, bedoeld in het eerste en tweede lid, geschiedt voor de
      ingangsdatum van het ouderdomspensioen.

      4 De pensioenuitvoerder waarborgt bij de vaststelling van de afkoopwaarde door vaststelling van een afkoopvoet
      dat geen onderscheid gemaakt wordt tussen mannen en vrouwen waarbij voldaan wordt aan het vereiste van collectieve
      actuariële gelijkwaardigheid.

      5 Elk beding strijdig met dit artikel is nietig.

      6 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel63
