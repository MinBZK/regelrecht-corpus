  - number: '113'
    text: |-
      Het pensioenfonds zendt:

      a. een authentiek afschrift van de akte houdende wijziging van de statuten;

      b. een door het bestuur gewaarmerkt exemplaar van wijziging van de reglementen;

      c. een door het bestuur gewaarmerkt afschrift van de wijzigingen in de uitvoeringsovereenkomst;

      d. een door het bestuur gewaarmerkt afschrift van de wijzigingen in de actuariële en bedrijfstechnische nota,
      bedoeld in [artikel 145][ref1]; en

      e. een door het bestuur gewaarmerkt afschrift van de wijzigingen in de eventuele overeenkomst tot verzekering,
      overdracht of onderbrenging;

      binnen twee weken na totstandkoming van die wijziging aan de toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel145
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '145'
        hoofdstuk: '6'
  - number: '114'
    text: |-
      1 Voor omzetting van een pensioenfonds in een andere rechtsvorm als bedoeld in
      [artikel 18 van Boek 2 van het Burgerlijk Wetboek][ref1] is een verklaring van geen bezwaar van de toezichthouder
      vereist. De toezichthouder verleent de verklaring indien hij van oordeel is dat de belangen van deelnemers, gewezen
      deelnemers, andere aanspraakgerechtigden, de pensioengerechtigden en de werkgever voldoende gewaarborgd zijn.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel18
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '18'
  - number: '115'
    text: |-
      1 Een ondernemingspensioenfonds of een bedrijfstakpensioenfonds met een paritair bestuur of een paritair gemengd
      dan wel omgekeerd gemengd bestuur stelt een verantwoordingsorgaan in. Een algemeen pensioenfonds met een paritair
      bestuur of een paritair gemengd dan wel omgekeerd gemengd bestuur stelt een verantwoordingsorgaan in voor elke
      collectiviteitkring.

      2 In het verantwoordingsorgaan zijn de deelnemers en de pensioengerechtigden evenredig op basis van onderlinge
      getalsverhoudingen vertegenwoordigd. Bij een algemeen pensioenfonds wordt het voorgaande beoordeeld aan de hand van
      de onderlinge getalsverhoudingen binnen de collectiviteitkring waarvoor het verantwoordingsorgaan is ingesteld. De
      leden van het verantwoordingsorgaan vormen een zo evenwichtig mogelijke afspiegeling van de betreffende geleding.
      De werkgever kan vertegenwoordigd zijn in het verantwoordingsorgaan, indien de werkgever of de deelnemers en
      pensioengerechtigden dit wensen.

      3 Indien een verantwoordingsorgaan van een algemeen pensioenfonds bij een collectiviteitkring hoort die
      bestaat uit meer dan een onderneming of groep, bedrijfstak of beroepspensioenregeling als bedoeld in
      [artikel 1 van de Wet verplichte beroepspensioenregeling][ref1] dan wel een combinatie hiervan, wordt iedere
      onderneming of groep, bedrijfstak dan wel beroepspensioenregeling door ten minste een deelnemer en een
      pensioengerechtigde vertegenwoordigd in het verantwoordingsorgaan.

      4 Op grond van door het bestuur van het pensioenfonds vast te stellen criteria kunnen naast de in het tweede lid
      bedoelde vertegenwoordigers ook één of meer vertegenwoordigers van gewezen deelnemers in het verantwoordingsorgaan
      zitting hebben.

      5 In geval van verkiezing van leden van het verantwoordingsorgaan door deelnemers, gewezen deelnemers en
      pensioengerechtigden kunnen kandidaten worden voorgedragen door verenigingen en door individuele deelnemers,
      gewezen deelnemers en pensioengerechtigden.

      6 Voor zover geen verkiezing door de deelnemers, gewezen deelnemers en pensioengerechtigden plaatsvindt, maar
      de leden worden benoemd door verenigingen, zijn deze verenigingen evenredig aan hun ledenaantallen binnen hun
      geleding binnen het pensioenfonds vertegenwoordigd in het verantwoordingsorgaan. Bij een algemeen pensioenfonds
      wordt het voorgaande beoordeeld aan de hand van de ledenaantallen binnen de collectiviteitkring waarvoor het
      verantwoordingsorgaan is ingesteld.

      7 Een vereniging als bedoeld in het vijfde en zesde lid bezit volledige rechtsbevoegdheid; haar statutair doel
      omvat mede het behartigen van de belangen van haar leden als belanghebbenden bij een pensioenfonds.

      8 Het bestuur van het pensioenfonds gaat over tot verkiezing van de leden van het verantwoordingsorgaan die de
      deelnemers, gewezen deelnemers en pensioengerechtigden vertegenwoordigen:

      a. op eigen initiatief van het pensioenfonds; of

      b. indien dit wordt verzocht door ten minste 1% van de deelnemers, gewezen deelnemers en pensioengerechtigden of
      door ten minste 500 deelnemers, gewezen deelnemers en pensioengerechtigden.

      Het pensioenfonds verleent medewerking aan ieder initiatief van deelnemers, gewezen deelnemers of
      pensioengerechtigden tot het organiseren van verkiezingen op grond van de vorige volzin, aanhef en onderdeel b. Bij
      een algemeen pensioenfonds wordt dit lid toegepast per verantwoordingsorgaan

      9 Een verantwoordingsorgaan van een algemeen pensioenfonds heeft uitsluitend de taken en bevoegdheden van het
      verantwoordingsorgaan voor zover ze betrekking hebben op de collectiviteitkring waarvoor het verantwoordingsorgaan
      is ingesteld. Het verantwoordingsorgaan stelt in overleg met het bestuur van het algemeen pensioenfonds een
      regeling vast ten aanzien van deze taken en bevoegdheden.

      10 Het verantwoordingsorgaan heeft recht op overleg met het intern toezicht.

      11 Het bestuur van het pensioenfonds en het verantwoordingsorgaan komen ten minste tweemaal per kalenderjaar in
      vergadering bijeen. Tijdens deze vergaderingen worden de aangelegenheden aan de orde gesteld waarover het bestuur
      van het pensioenfonds of het verantwoordingsorgaan overleg wenselijk acht.

      12 Het pensioenfonds verstrekt desgevraagd aan het verantwoordingsorgaan tijdig alle inlichtingen en gegevens, die
      deze voor de vervulling van zijn taak redelijkerwijze nodig heeft. De inlichtingen worden desgevraagd schriftelijk
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel1
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '1'
  - number: 115a
    text: |-
      1 Het bestuur van het pensioenfonds legt verantwoording af aan het verantwoordingsorgaan over het beleid en de
      wijze waarop het is uitgevoerd.

      2 Het verantwoordingsorgaan heeft de bevoegdheid een oordeel te geven over het handelen van het bestuur aan de hand
      van het bestuursverslag, de jaarrekening en andere informatie, waaronder de bevindingen van het intern toezicht,
      over het door het bestuur uitgevoerde beleid, evenals over beleidskeuzes voor de toekomst. Dit oordeel wordt, samen
      met de reactie van het bestuur daarop, bekend gemaakt en in het bestuursverslag opgenomen.

      3 Het pensioenfonds stelt het verantwoordingsorgaan in de gelegenheid advies uit te brengen over:

      a. het beleid inzake beloningen;

      b. de vorm en inrichting van het intern toezicht;

      c. de profielschets voor leden van de raad van toezicht;

      d. het vaststellen en wijzigen van een interne klachten- en geschillenprocedure;

      e. het vaststellen en wijzigen van het communicatie- en voorlichtingsbeleid;

      f. gehele of gedeeltelijke overdracht van de verplichtingen van het pensioenfonds of de overname van verplichtingen
      door het pensioenfonds;

      g. liquidatie, fusie of splitsing van het pensioenfonds;

      h. het sluiten, wijzigen of beëindigen van een uitvoeringsovereenkomst;

      i. het omzetten van het pensioenfonds in een andere rechtsvorm, bedoeld in
      [artikel 18 van Boek 2 van het Burgerlijk Wetboek][ref1];

      j. de samenstelling van de feitelijke premie en de hoogte van de premiecomponenten; en

      k. het wijzigen van een uitvoeringsreglement door een algemeen pensioenfonds.

      4 Het verantwoordingsorgaan adviseert het bestuur naar aanleiding van de melding van disfunctioneren van het
      bestuur, bedoeld in [artikel 104, vijfde lid][ref2].

      5 Het advies van het verantwoordingsorgaan wordt op een zodanig tijdstip gevraagd dat het van wezenlijke invloed
      kan zijn op de in het derde lid bedoelde besluiten.

      6 Bij het vragen van advies wordt aan het verantwoordingsorgaan een overzicht verstrekt van de beweegredenen
      voor het besluit en van de gevolgen die het besluit naar verwachting voor de deelnemers, gewezen deelnemers en
      pensioengerechtigden zal hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel104
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel115a
