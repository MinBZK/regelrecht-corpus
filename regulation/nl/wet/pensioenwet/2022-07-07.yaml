  - number: 130a
    text: |-
      Onverminderd [artikel 130][ref1] vermeldt een pensioenfonds in zijn jaarrekening en bestuursverslag de
      samenstelling van de feitelijke premie en de hoogte van de premiecomponenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel130
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel130a
