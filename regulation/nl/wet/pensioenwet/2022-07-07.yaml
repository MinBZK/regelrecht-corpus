      1 De pensioenuitvoerder is bevoegd om op verzoek van de werkgever over te gaan tot collectieve waardeoverdracht
      overeenkomstig [artikel 83][ref1] indien de werkgever een uitvoeringsovereenkomst heeft gesloten met een
      pensioeninstelling uit een andere lidstaat of een verzekeraar met zetel buiten Nederland als bedoeld in
      [artikel 23, eerste lid][ref2].

      2 Aan de in [artikel 84][ref3] geformuleerde verplichting tot waardeoverdracht in geval van liquidatie kan ook
      worden voldaan door waardeoverdracht aan een pensioeninstelling uit een andere lidstaat of een verzekeraar met
      zetel buiten Nederland als bedoeld in [artikel 23, eerste lid][ref4], in plaats van aan een pensioenuitvoerder.


