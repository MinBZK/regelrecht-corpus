  - number: '102'
    text: |-
      1 De verdeling van de zetels van vertegenwoordigers van werknemersverenigingen of werknemersvertegenwoordigers
      en vertegenwoordigers van pensioengerechtigden in het paritaire bestuur van een pensioenfonds vindt plaats op
      basis van de onderlinge getalsverhoudingen, met dien verstande dat de vertegenwoordigers van pensioengerechtigden
      ten hoogste de helft van het aantal zetels in het paritaire bestuur van een pensioenfonds bezetten dat
      vertegenwoordigers van werknemersverenigingen of werknemersvertegenwoordigers en vertegenwoordigers van
      pensioengerechtigden gezamenlijk bezetten. Van deze verdeling kan worden afgeweken indien de betrokken partijen
      daarmee akkoord zijn.

      2 In het paritaire bestuur van een ondernemingspensioenfonds kunnen, in afwijking van het eerste lid,
      vertegenwoordigers van pensioengerechtigden meer zetels bezetten dan werknemersvertegenwoordigers, indien het
      aantal deelnemers minder bedraagt dan 10% van de som van het aantal deelnemers en pensioengerechtigden.

      3 De benoeming van de werknemersvertegenwoordigers in het paritaire bestuur van een ondernemingspensioenfonds vindt
      plaats:

      a. na verkiezing van de vertegenwoordigers door de deelnemers;

      b. op voordracht van de vertegenwoordigers van de deelnemers in het verantwoordingsorgaan, bedoeld in
      [artikel 115][ref1];

      c. op voordracht van de ondernemingsraad; of

      d. op een andere wijze, mits de ondernemingsraad heeft ingestemd met deze benoemingswijze.

      4 De benoeming van de vertegenwoordigers van pensioengerechtigden in het paritaire bestuur van een pensioenfonds
      vindt plaats:

      a. na verkiezing van de vertegenwoordigers door de pensioengerechtigden; of

      b. op voordracht van de vertegenwoordigers van de pensioengerechtigden in het verantwoordingsorgaan, bedoeld in
      [artikel 115][ref2], mits deze vertegenwoordigers na verkiezing zijn benoemd.

      5 Het tweede en derde lid is van overeenkomstige toepassing voor zover een algemeen pensioenfonds met een paritair
      bestuur een pensioenregeling uitvoert voor een onderneming of groep.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel115
