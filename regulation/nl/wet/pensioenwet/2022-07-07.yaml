  - number: '70'
    text: |-
      1 Voor de toepassing van de [artikelen 70a tot en met 92a][ref1] wordt onder ontvangende pensioenuitvoerder mede
      verstaan een beroepspensioenfonds als bedoeld in [artikel 1 van de Wet verplichte beroepspensioenregeling][ref2].

      2 Bij regeling van Onze Minister kunnen instellingen worden aangewezen jegens wie een pensioenuitvoerder een
      verplichting tot waardeoverdracht heeft.

      3 Waardeoverdracht is slechts mogelijk in de in de [artikelen 70a tot en met 92a][ref3] bedoelde situaties.

      4 Voor de toepassing van de [artikelen 70a tot en met 92a][ref4] wordt onder een pensioenfonds dat
      optreedt als ontvangende pensioenuitvoerder mede verstaan een beroepspensioenfonds als bedoeld in
      [artikel 1 van de Wet verplichte beroepspensioenregeling][ref5].


