        artikel: '129'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0001860
  - number: '124'
    text: |-
      Een pensioenfonds kan de mogelijkheid bieden tot verhoging van de pensioenaanspraken indien het deel van
      de pensioenaanspraken dat voortvloeit uit deze inkoop overeenkomstig de pensioenaanspraken op grond van de
      basispensioenregeling wordt behandeld.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel124
  - number: 124a
    text: |-
      1 Een pensioenfonds draagt de eigendom van een pensioenvermogen slechts over aan een pensioenbewaarder nadat hij
      met deze een overeenkomst inzake het beheer en de bewaring van het pensioenvermogen heeft gesloten.

      2 Het pensioenfonds treft maatregelen opdat de pensioenbewaarder slechts met zijn medewerking over de bestanddelen
      van het pensioenvermogen zal beschikken.

      3 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de inhoud van de overeenkomst,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel124a
  - number: '125'
    text: |-
      1 Het is een pensioenfonds verboden bijdragen te ontvangen van een bijdragende onderneming die zetel heeft in een
      andere lidstaat dan Nederland:

      a. zonder een daartoe door de toezichthouder verleende vergunning; en

      b. zonder de toezichthouder van het voornemen daartoe in kennis te hebben gesteld, op de wijze, bedoeld in
      [artikel 194][ref1], en met inachtneming van [artikel 196][ref2].

      2 Voor de toepassing van het eerste lid, [artikel 138, vierde lid][ref3], [artikel 140, tweede lid][ref4], en
      de [paragrafen 7.4.2][ref5] en [7.4.3][ref6] wordt onder het ontvangen van bijdragen verstaan het ontvangen van
      bijdragen voor de uitvoering van een pensioenregeling die afkomstig is uit een andere lidstaat dan de lidstaat waar
      het pensioenfonds gevestigd is.


