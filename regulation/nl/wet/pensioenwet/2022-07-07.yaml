  - number: '66'
    text: |-
      1 De pensioenuitvoerder heeft het recht om bij de ingang van het ouderdomspensioen een aanspraak op
      ouderdomspensioen en andere aanspraken ten behoeve van de gepensioneerde of zijn nabestaanden af te kopen, indien:

      a. de uitkering van het ouderdomspensioen op de ingangsdatum minder bedraagt dan € 520,35 per jaar; en

      b. de gepensioneerde geen bezwaar maakt tegen de afkoop indien de deelneming is geëindigd voor 1 januari 2007 of de
      gepensioneerde instemt met de afkoop indien de deelneming is geëindigd vanaf 1 januari 2007.

      2 De pensioenuitvoerder heeft het recht om pensioenaanspraken van een gewezen deelnemer af te kopen, indien:

      a. op basis van de tot het tijdstip van beëindiging van de deelneming opgebouwde aanspraak op ouderdomspensioen de
      uitkering van het ouderdomspensioen op jaarbasis op de reguliere ingangsdatum, getoetst per 1 januari van dat jaar,
      minder zal bedragen dan het in het eerste lid, onderdeel a, genoemde bedrag;

      b. de gewezen deelnemer geen bezwaar maakt tegen de afkoop indien de deelneming is geëindigd voor 1 januari 2007 of
      de gewezen deelnemer instemt met de afkoop indien de deelneming is geëindigd vanaf 1 januari 2007; en

      c. in geval de deelneming is geëindigd vanaf 1 januari 2018, de pensioenuitvoerder na beëindiging van de deelneming
      ten minste vijf maal tevergeefs heeft gepoogd de overdrachtswaarde van de pensioenaanspraken van een gewezen
      deelnemer over te dragen als bedoeld in [artikel 70a][ref1] en na de beëindiging van de deelneming of, indien
      de deelneming is geëindigd tussen 1 januari 2018 en 1 januari 2019, na 1 januari 2019, ten minste vijf jaar is
      verstreken.

      3 De pensioenuitvoerder die gebruik wil maken van het in het eerste lid bedoelde recht informeert de gepensioneerde
      over zijn besluit hierover voor de ingang van het pensioen en gaat over tot uitbetaling van de afkoopwaarde binnen
      zes maanden na de ingang van het pensioen.

      4 De pensioenuitvoerder stelt de afkoopwaarde ter beschikking aan de gepensioneerde dan wel de gewezen deelnemer,
      met uitzondering van de afkoopwaarde van een bijzonder partnerpensioen, die ter beschikking wordt gesteld aan de
      gewezen partner.

      5 De pensioenuitvoerder betaalt de uitkering op de dag dat de aanspraken of rechten vervallen in verband met de
      afkoop.

      6 Het in het eerste lid, onderdeel a, genoemde bedrag wordt telkens gewijzigd met ingang van 1 januari op basis
      van de consumentenprijsindex Alle Huishoudens, zoals berekend door het Centraal Bureau voor de Statistiek. De
      wijziging wordt bepaald door de procentuele wijziging die dat indexcijfer over de maand oktober, voorafgaand aan
      de aanpassing, heeft ondergaan ten opzichte van de maand oktober van het daaraan voorafgaande jaar. Het gewijzigde
      bedrag wordt door of namens Onze Minister meegedeeld in de Staatscourant.

      7 De pensioenuitvoerder waarborgt met betrekking tot perioden van opbouw vanaf 1 januari 2005 bij de vaststelling
      van de afkoopwaarde door vaststelling van een afkoopvoet dat geen onderscheid gemaakt wordt tussen mannen en
      vrouwen waarbij voldaan wordt aan het vereiste van collectieve actuariële gelijkwaardigheid.

      8 Elk beding strijdig met dit artikel is nietig.

      9 Indien de pensioenuitvoerder wil afkopen op of na de reguliere ingangsdatum van het ouderdomspensioen en
      het moment waarop de pensioenuitvoerder wil afkopen ligt voor of op de datum waarop het ouderdomspensioen op
      grond van de [Algemene Ouderdomswet][ref2] ingaat, dan heeft de betrokkene het recht ervoor te kiezen dat het
      ouderdomspensioen waarop de afkoop betrekking heeft, ingaat op de eerste dag van de maand volgend op de datum
      waarop het ouderdomspensioen op grond van de Algemene Ouderdomswet ingaat. De pensioenuitvoerder koopt af op het
      moment dat het ouderdomspensioen waarop de afkoop betrekking heeft ingaat. [Artikel 62, eerste lid][ref3], is van
      overeenkomstige toepassing.

      10 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het vaststellen van
      de afkoopwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel70a
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel62
