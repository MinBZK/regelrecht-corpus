      1 De pensioenuitvoerder is verplicht om na een verzoek van de gewezen deelnemer tot waardeoverdracht de
      overdrachtswaarde van diens pensioenaanspraken over te dragen aan een van de Europese Gemeenschappen of aan een op
      grond van [artikel 70, tweede lid][ref1], door Onze Minister aangewezen instelling, indien:

      a. er sprake is van beëindiging van de dienstbetrekking dan wel beëindiging van de deelneming;

      b. die waardeoverdracht ertoe strekt het de gewezen deelnemer mogelijk te maken pensioenaanspraken te verwerven bij
      een van de Europese Gemeenschappen of de aangewezen genoemde instelling;

      c. de waarde rechtstreeks wordt overgedragen aan de betrokken Europese Gemeenschap of de aangewezen instelling; en

      d. de tot verevening gerechtigde echtgenoot, bedoeld in
      [artikel 2 van de Wet verevening pensioenrechten bij scheiding][ref2], met de waardeoverdracht instemt.

      Indien het verzoek van de gewezen deelnemer tot waardeoverdracht partnerpensioen betreft is voor de
      waardeoverdracht van dit partnerpensioen tevens vereist dat de partner die begunstigde is voor het partnerpensioen
      met de waardeoverdracht instemt.

      2 De overdragende pensioenuitvoerder brengt in het kader van de waardeoverdracht geen kosten in rekening bij de
      gewezen deelnemer.

      3 De op grond van [artikel 71, zevende lid][ref3], bij of krachtens algemene maatregel van bestuur gestelde regels
      ten aanzien van de berekening van de overdrachtswaarde zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel70
