  - number: '169'
    text: |-
      1 De pensioenuitvoerder en de werkgever zijn verplicht de zakelijke gegevens en bescheiden die betrekking hebben op
      pensioenregelingen en andere bij of krachtens deze wet geregelde onderwerpen in Nederland beschikbaar te hebben en
      deze gedurende ten minste zeven jaren na het boekjaar waarop ze betrekking hebben beschikbaar te houden.

      2 Het eerste lid is niet van toepassing op een verzekeraar met zetel in een andere lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel169
  - number: '170'
    text: |-
      1 Een accountant die het onderzoek naar de staten, bedoeld in [artikel 147, vijfde lid][ref1], uitvoert meldt de
      toezichthouder zo spoedig mogelijk elke omstandigheid waarvan hij bij de uitvoering van het onderzoek kennis heeft
      gekregen en die:

      a. in strijd is met deze wet;

      b. de nakoming van de door het pensioenfonds aangegane verplichtingen bedreigt; of

      c. leidt tot de weigering van het afgeven van de verklaring omtrent de getrouwheid of tot het maken van
      voorbehouden.

      2 Het eerste lid, aanhef en onderdelen a en b, is van overeenkomstige toepassing op de actuaris die het onderzoek
      naar de staten, bedoeld in [artikel 147, vierde lid][ref2], uitvoert.

      3 De accountant of actuaris verstrekt zo spoedig mogelijk kosteloos alle inlichtingen aan de toezichthouder
      die deze redelijkerwijs nodig heeft voor het toezicht op de naleving van deze wet. De toezichthouder stelt het
      betrokken pensioenfonds in de gelegenheid aanwezig te zijn bij het verstrekken van inlichtingen door de accountant
      of actuaris.

      4 De accountant of actuaris biedt desgevraagd de toezichthouder inzicht in zijn controlewerkzaamheden.

      5 De accountant of actuaris die op grond van dit artikel tot een melding of het verstrekken van inlichtingen aan
      de toezichthouder is overgegaan, is niet aansprakelijk voor schade die een derde als gevolg daarvan lijdt, tenzij
      aannemelijk wordt gemaakt dat, gelet op alle feiten en omstandigheden, in redelijkheid niet tot melding of het
      verstrekken van inlichtingen had mogen worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel147
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel147
