  - number: '76'
    text: |-
      1 De pensioenuitvoerder is verplicht om na een verzoek van de gewezen deelnemer tot waardeoverdracht de
      overdrachtswaarde van diens pensioenaanspraken over te dragen indien:

      a. sprake is van een individuele beëindiging van de deelneming bij een nieuwe of voortgezette dienstbetrekking bij
      dezelfde werkgever; en

      b. die waardeoverdracht ertoe strekt het de gewezen deelnemer mogelijk te maken pensioenaanspraken te verwerven bij
      de ontvangende pensioenuitvoerder;

      tenzij de overdragende en ontvangende pensioenuitvoerder niet identiek zijn en sprake is van de in
      [artikel 72][ref1] omschreven situaties.

      Indien het verzoek van de gewezen deelnemer tot waardeoverdracht partnerpensioen betreft is voor de
      waardeoverdracht van dit partnerpensioen tevens vereist dat de partner die begunstigde is voor het partnerpensioen
      met de waardeoverdracht instemt.

      2 De ontvangende pensioenuitvoerder is verplicht om na een verzoek tot waardeoverdracht van een deelnemer de
      overdrachtswaarde aan te wenden ter verwerving van pensioenaanspraken voor die deelnemer.

      3 De plicht van de overdragende pensioenuitvoerder om de waarde rechtstreeks over te dragen en de plicht van
      de ontvangende pensioenuitvoerder om de waarde aan te wenden ontstaat indien de deelnemer binnen zes maanden
      na aanvang van de verwerving van pensioenaanspraken in de door de ontvangende pensioenuitvoerder uitgevoerde
      pensioenregeling een opgave heeft gevraagd van zijn pensioenaanspraken aan de ontvangende pensioenuitvoerder en
      daarna het verzoek tot waardeoverdracht doet aan de ontvangende pensioenuitvoerder.

      4 De overdrachtswaarde wordt door de overdragende pensioenuitvoerder zodanig vastgesteld dat de voor mannen
      en vrouwen te verwerven pensioenrechten gelijk zijn waarbij aan het vereiste van collectieve actuariële
      gelijkwaardigheid op basis van dezelfde grondslagen wordt voldaan.

      5 Het vierde lid is:

      a. met betrekking tot uitkeringsovereenkomsten van toepassing op pensioenaanspraken die vanaf 1 januari 2002 zijn
      of worden opgebouwd;

      b. met betrekking tot premieovereenkomsten en kapitaalovereenkomsten van toepassing op pensioenaanspraken die vanaf
      1 januari 2005 zijn of worden opgebouwd.

      6 In afwijking van het vijfde lid kan het vierde lid van toepassing zijn op pensioenaanspraken die zijn opgebouwd
      voor 1 januari 2002 respectievelijk 1 januari 2005 indien dit is overeengekomen in de pensioenovereenkomst.

      7 De overdragende en de ontvangende pensioenuitvoerder brengen in het kader van de waardeoverdracht geen kosten in
      rekening bij de gewezen deelnemer.

      8 Elk beding strijdig met dit artikel is nietig.

      9 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de berekening van
      de overdrachtswaarde, de waarde van met de overdrachtswaarde te verwerven pensioenaanspraken alsmede de in acht te
      nemen procedures.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
