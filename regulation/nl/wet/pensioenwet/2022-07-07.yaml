  - number: '179'
    text: |-
      1 Het bedrag van de bestuurlijke boete wordt bepaald bij algemene maatregel van bestuur, met dien verstande dat
      de bestuurlijke boete voor een afzonderlijke overtreding ten hoogste € 4 000 000 bedraagt. Indien tijdens het
      plegen van de overtreding nog geen vijf jaren zijn verlopen sedert het opleggen van een bestuurlijke boete aan de
      overtreder ter zake van eenzelfde overtreding, wordt het bedrag van de bestuurlijke boete, bedoeld in de eerste
      volzin, voor een afzonderlijke overtreding verdubbeld.

      2 De algemene maatregel van bestuur, bedoeld in het eerste lid, bepaalt bij elke daarin omschreven overtreding het
      bedrag van de deswege op te leggen bestuurlijke boete. De overtredingen worden gerangschikt in categorieën naar
      zwaarte van de overtreding met de daarbij behorende basisbedragen, minimumbedragen en maximumbedragen. Daarbij
      wordt de volgende indeling gebruikt:










                    Categorie


                    Basisbedrag


                    Minimumbedrag


                    Maximumbedrag






                    1


                    € 10 000,–


                    € 0,–


                    € 10 000,–




                    2


                    € 500 000,–


                    € 0,–


                    € 1 000 000,–




                    3


                    € 2 000 000,–


                    € 0,–


                    € 4 000 000,–






      3 In afwijking van het eerste en tweede lid kan de toezichthouder de hoogte van de bestuurlijke boete vaststellen
      op ten hoogste twee keer het bedrag van het voordeel dat de overtreder door de overtreding heeft verkregen indien
      diens voordeel groter is dan € 2 000 000.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel179
  - number: '184'
    text: |-
      1 Indien tegen een besluit tot het opleggen van een bestuurlijke boete bezwaar of beroep wordt aangetekend, schorst
      dit de verplichting tot betaling van de bestuurlijke boete totdat de beroepstermijn is verstreken of, indien beroep
      is ingesteld, op het beroep is beslist.

      2 De schorsing van een verplichting tot betaling schorst niet de berekening van de wettelijke rente.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel184
  - number: '185'
    text: |-
      1 De toezichthouder maakt een besluit tot het opleggen van een bestuurlijke sanctie openbaar. De openbaarmaking
      geschiedt zodra het besluit onherroepelijk is geworden. Indien tegen het besluit bezwaar, beroep of hoger beroep is
      ingesteld, maakt de toezichthouder de uitkomst daarvan tezamen met het besluit openbaar.

      2 In aanvulling op [artikel 5:2, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1] wordt onder
      bestuurlijke sanctie mede verstaan: het door de toezichthouder wegens een overtreding beëindigen of beperken van
      een recht of bevoegdheid alsmede het opleggen van een verbod.

      3 De toezichthouder kan besluiten openbaarmaking uit te stellen, er niet toe over te gaan of het in een zodanige
      vorm te doen dat het besluit niet herleidbaar is tot een individuele rechtspersoon of een natuurlijk persoon,
      indien:

      a. de openbaarmaking van de identiteit van de rechtspersoon of van de identiteit of de persoonlijke gegevens van
      een natuurlijk persoon onevenredig wordt geacht;

      b. de openbaarmaking de stabiliteit van de financiële markten in gevaar brengt; of

      c. de openbaarmaking een lopend strafrechtelijk onderzoek of een lopend onderzoek door de toezichthouder naar
      mogelijke overtredingen ondermijnt.

      4 In afwijking van het derde lid blijft openbaarmaking van een besluit tot het opleggen van een bestuurlijke boete
      slechts achterwege, indien openbaarmaking de stabiliteit van de financiële markten in gevaar zou brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel52
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:2
  - number: '188'
    text: |-
      1 De toezichthouder kan met het oog op de bescherming van de belangen van de pensioen- of aanspraakgerechtigden ter
      openbare kennis brengen, indien nodig onder vermelding van de overwegingen die tot die kennisgeving hebben geleid:

      a. overtreding van de verbodsbepalingen uit deze wet en de overtredingen, bedoeld in [artikel 201][ref1];

      b. het feit ter zake waarvan een aanwijzing als bedoeld in [artikel 171, tweede lid][ref2], is gegeven, het feit
      dat de aanwijzing is gegeven en de door de pensioenfonds te volgen gedragslijn, alsmede de naam, het adres en de
      vestigingsplaats van de pensioenfonds aan wie de aanwijzing is gegeven;

      c. het feit dat een herstelplan als bedoeld in [artikel 138][ref3] of [artikel 140][ref4] is ingediend, alsmede de
      naam, het adres en de vestigingsplaats van het pensioenfonds dat het herstelplan heeft ingediend.

      2 Bij regeling van Onze Minister kunnen regels worden gesteld ter zake van de uitoefening van de bevoegdheden,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel201
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel171
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel138
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel140
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel188
