  - number: '126'
    text: |-
      1 Een pensioenfonds stelt toereikende technische voorzieningen vast met betrekking tot het geheel van
      pensioenverplichtingen.

      2 De berekening wordt uitgevoerd met inachtneming van de volgende beginselen:

      a. de technische voorzieningen worden berekend op basis van marktwaardering;

      b. de voor de berekening van de technische voorzieningen gebruikte grondslagen inzake overlijden of
      arbeidsongeschiktheid en levensverwachting worden gebaseerd op prudente beginselen; en

      c. de methode en de grondslag van de berekening van de technische voorzieningen blijven van boekjaar tot boekjaar
      ongewijzigd, tenzij wijzigingen daarin gerechtvaardigd zijn als gevolg van een verandering van de juridische,
      demografische of economische omstandigheden die aan de hypothesen ten grondslag liggen.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de wijze van berekening van het
      minimum bedrag van de technische voorzieningen, de daarbij in acht te nemen voorzichtigheidsmarges en kunnen regels
      worden gesteld over de frequentie waarmee de technische voorzieningen worden berekend.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel126
  - number: '127'
    text: Ouderdomspensioen wordt gefinancierd op basis van kapitaaldekking.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel127
  - number: '128'
    text: |-
      1 Een pensioenfonds stelt een kostendekkende premie vast die bestaat uit:

      a. de premie die actuarieel benodigd is in verband met de aangroei van de pensioenverplichtingen;

      b. de opslag die nodig is voor het bij de aangroei van de pensioenverplichtingen behorende vereist eigen vermogen
      als bedoeld in [artikel 132][ref1];

      c. de opslag die nodig is voor de bij de aangroei van de pensioenverplichtingen behorende uitvoeringskosten van het
      pensioenfonds; en

      d. de premie die actuarieel benodigd is ten behoeve van toeslagverlening indien gekozen is voor financiering op de
      wijze, bedoeld in [artikel 137, vierde lid, onderdeel a, b of d][ref2];

      2 De kostendekkende premie kan worden gedempt met een voortschrijdend gemiddelde van de rente of met verwacht
      rendement.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer het dempen van de kostendekkende premie.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel137
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel128
