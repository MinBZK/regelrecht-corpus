      1 De pensioenuitvoerder heeft jegens de gewezen partner het recht om een aanspraak op bijzonder partnerpensioen af
      te kopen indien de uitkering van het partnerpensioen op jaarbasis op de ingangsdatum minder zal bedragen dan het op
      basis van [artikel 66][ref1] bepaalde bedrag, tenzij dit recht op afkoop in de pensioen- en uitvoeringsovereenkomst
      is beperkt of uitgesloten.

      2 De pensioenuitvoerder die gebruik maakt van het in het eerste lid bedoelde recht informeert de gewezen partner
      hierover binnen zes maanden na de melding van de scheiding en gaat binnen die termijn over tot uitbetaling van de
      afkoopwaarde aan de gewezen partner.

      3 De pensioenuitvoerder kan na de in het tweede lid bedoelde termijn afkopen indien:

      a. de gewezen partner daarmee instemt; en

      b. indien de hoogte van het partnerpensioen op jaarbasis per 1 januari van dat jaar lager is dan het op basis van
      [artikel 66][ref2] bepaalde bedrag.

      4 [Artikel 66, vijfde, zevende, achtste en tiende lid][ref3], is van overeenkomstige toepassing.


