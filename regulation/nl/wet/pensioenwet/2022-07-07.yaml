  - number: '74'
    text: |-
      1 Indien de in [artikel 72][ref1] genoemde omstandigheden niet meer van toepassing zijn, herleven de in
      [artikel 71][ref2] bedoelde plichten van de overdragende pensioenuitvoerder en de ontvangende pensioenuitvoerder.

      2 Een overdragende pensioenuitvoerder die in de periode waarin de in [artikel 72][ref3] bedoelde omstandigheden
      op hem van toepassing zijn verzoeken tot waardeoverdracht heeft gekregen, informeert, wanneer deze omstandigheden
      niet meer van toepassing zijn, alle deelnemers die in die periode gewezen deelnemer zijn geworden en de betrokken
      ontvangende pensioenuitvoerders over de mogelijkheid alsnog waarde over te dragen.

      3 Een ontvangende pensioenuitvoerder die in de periode waarin de in [artikel 72][ref4] genoemde omstandigheden op
      hem van toepassing zijn verzoeken tot waardeoverdracht heeft gekregen, informeert wanneer deze omstandigheden niet
      meer van toepassing zijn, alle deelnemers die in die periode een verzoek tot waardeoverdracht hebben gedaan en de
      betrokken overdragende pensioenuitvoerders over de mogelijkheid alsnog waarde over te dragen.


