      1 De pensioenuitvoerder heeft jegens de nabestaanden het recht om een recht op partnerpensioen of wezenpensioen
      ten behoeve van de nabestaanden van dezelfde deelnemer, gewezen deelnemer of gepensioneerde af te kopen, indien de
      uitkering van het partnerpensioen of wezenpensioen op jaarbasis op de ingangsdatum minder bedraagt dan het op basis
      van [artikel 66][ref1] bepaalde bedrag, tenzij dit recht op afkoop in de pensioen- en uitvoeringsovereenkomst is
      beperkt of uitgesloten.

      2 De pensioenuitvoerder die gebruik maakt van het in het eerste lid bedoelde recht informeert de nabestaande
      hierover binnen zes maanden na de ingangsdatum en gaat binnen die termijn over tot uitbetaling van de afkoopwaarde
      aan de nabestaande.

      3 De pensioenuitvoerder kan na de in het tweede lid bedoelde termijn het partnerpensioen of wezenpensioen afkopen
      indien:

      a. de nabestaande daarmee instemt; en

      b. indien de hoogte van het partnerpensioen of wezenpensioen op jaarbasis per 1 januari van dat jaar lager is dan
      het op basis van [artikel 66][ref2] bepaalde bedrag.

      4 [Artikel 66, vijfde, zevende, achtste en tiende lid][ref3], is van overeenkomstige toepassing.


