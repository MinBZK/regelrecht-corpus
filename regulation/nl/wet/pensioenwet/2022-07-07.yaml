  - number: 115h
    text: |-
      Een pensioenfonds is gehouden om op verzoek van werknemers of een werknemersvereniging mee te werken aan de
      verstrekking van informatie aan de werknemers van het fonds over het voornemen tot oprichting, of over het bestaan,
      van een werknemersvereniging. Een pensioenfonds is tevens gehouden om op verzoek van pensioengerechtigden of een
      vereniging van pensioengerechtigden mee te werken aan de verstrekking van informatie aan de pensioengerechtigden
      van het fonds over het voornemen tot oprichting, of over het bestaan, van een vereniging van pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel115h
  - number: '116'
    text: |-
      1 Een pensioenfonds verricht slechts activiteiten in verband met pensioen en werkzaamheden die daarmee verband
      houden.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter zake van activiteiten die door
      pensioenfondsen kunnen worden verricht.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel116
  - number: '117'
    text: |-
      1 Een pensioenfonds kan uitsluitend een vrijwillige pensioenregeling uitvoeren indien dit een aanvulling op een
      door datzelfde pensioenfonds uitgevoerde basispensioenregeling betreft.

      2 Een pensioenfonds kan een fiscaal bovenmatige pensioenregeling uitsluitend uitvoeren als vrijwillige
      pensioenregeling.

      3 Onder een fiscaal bovenmatige pensioenregeling als bedoeld in het tweede lid wordt verstaan: een
      pensioenregeling die niet blijft binnen de begrenzingen die zijn opgenomen in de [hoofdstukken IIB][ref1] en
      [VIII van de Wet op de loonbelasting 1964][ref2].

      4 Voor de toepassing van het derde lid zijn de [artikelen 3.18, vierde en vijfde lid][ref3], en
      [3.95, eerste lid, tweede volzin, van de Wet inkomstenbelasting 2001][ref4] van overeenkomstige toepassing voor
      zover aan de pensioenregeling wordt deelgenomen door deelnemers die niet worden aangemerkt als werknemer in de zin
      van de [Wet op de loonbelasting 1964][ref5].

      5 Bij een algemeen pensioenfonds kan de vrijwillige pensioenregeling die in aanvulling op de basispensioenregeling
      wordt uitgevoerd deel uitmaken van een ander afgescheiden vermogen dan deze basispensioenregeling.

      6 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het bepaalde in het
      vijfde lid.

      7 De voordracht voor een krachtens het zesde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
      [ref2]: https://wetten.overheid.nl/BWBR0002471#HoofdstukVIII
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3.18
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3.95
