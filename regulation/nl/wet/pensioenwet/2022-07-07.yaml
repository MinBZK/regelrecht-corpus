        paragraaf: '2.2'
  - number: '55'
    text: |-
      1 Bij beëindiging van de deelneming behoudt de gewezen deelnemer de tot dat moment opgebouwde pensioenaanspraken
      indien er sprake is van een uitkeringsovereenkomst of een kapitaalovereenkomst. Deze pensioenaanspraak dient
      volledig gefinancierd te zijn op het moment van beëindiging. In geval van premievrijmaking op grond van
      [artikel 29, vierde lid][ref1], wordt daarmee bij de vaststelling van de opgebouwde aanspraken rekening gehouden.

      2 Bij een premieovereenkomst wordt bij beëindiging van de deelneming de vaststelling van de pensioenaanspraken
      als volgt uitgevoerd: het tot op dat moment ontstane kapitaal voortvloeiend uit de tot de beëindiging beschikbaar
      gestelde premies wordt:

      a. belegd tot de pensioendatum;

      b. aangewend voor de aankoop van een verzekerd kapitaal dat beschikbaar komt op de pensioendatum; of

      c. aangewend voor een verzekerde vastgestelde uitkering vanaf de pensioendatum, al dan niet in combinatie met een
      aanspraak op nabestaandenpensioen.

      3 Indien de opzet van de premieovereenkomst zodanig is dat de beschikbaar gestelde premie direct, en niet pas bij
      de beëindiging van de deelneming, wordt aangewend voor een uitkering of kapitaal, dan geldt het eerste lid.

      4 Deelnemers en andere aanspraakgerechtigden die na beëindiging van de deelneming aan een pensioenregeling naar een
      andere lidstaat van de Europese Unie verhuizen behouden hun pensioenaanspraak in dezelfde mate als deelnemers en
      andere aanspraakgerechtigden die na beëindiging van de deelneming in Nederland blijven.

      5 Indien de pensioenovereenkomst voorziet in een partnerpensioen op risicobasis behoudt de deelnemer, die na
      beëindiging van de deelneming recht heeft op een uitkering op grond van de [Werkloosheidswet][ref2] gedurende de
      periode dat hij de uitkering ontvangt, aanspraak op partnerpensioen ten behoeve van zijn partner. De hoogte van het
      partnerpensioen wordt vastgesteld alsof hetzelfde pensioen op opbouwbasis zou zijn overeengekomen, waarbij rekening
      wordt gehouden met het partnerpensioen verkregen op grond van [artikel 61][ref3]. Dit lid is van overeenkomstige
      toepassing op de deelnemer, die na beëindiging van de deelneming recht heeft op werkloosheidsuitkering van zijn
      woonland.

      6 In afwijking van het eerste en tweede lid en [artikel 134][ref4] vervallen de pensioenaanspraken van een
      deelnemer bij beëindiging van de deelneming, indien op basis van de tot het tijdstip van beëindiging opgebouwde
      aanspraak op ouderdomspensioen de uitkering van het ouderdomspensioen op jaarbasis op de reguliere ingangsdatum
      niet meer zal bedragen dan € 2,– per jaar. De eerste zin is niet van toepassing indien de deelnemer verhuist naar
      een andere lidstaat en hij de pensioenuitvoerder daarover bij beëindiging van de deelneming heeft geïnformeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel61
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel134
