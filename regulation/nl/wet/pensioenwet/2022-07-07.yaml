  - number: '52'
    text: |-
      1 Bij de uitvoering van een premieovereenkomst met beleggingsvrijheid in de opbouwfase is de pensioenuitvoerder
      verantwoordelijk voor de beleggingen en handelt daarbij overeenkomstig [artikel 135][ref1].

      2 De pensioenuitvoerder biedt de deelnemer en de gewezen deelnemer de mogelijkheid de verantwoordelijkheid voor de
      beleggingen over te nemen.

      3 Indien de deelnemer of de gewezen deelnemer de verantwoordelijkheid voor de beleggingen heeft overgenomen,
      adviseert de pensioenuitvoerder de deelnemer of de gewezen deelnemer over de spreiding van de beleggingen in
      relatie tot de duur van de periode tot pensioendatum, waarbij het beleggingsrisico kleiner wordt naarmate de
      pensioendatum nadert.

      4 De pensioenuitvoerder onderzoekt ten minste een keer per jaar of de beleggingen van de deelnemer of gewezen
      deelnemer zich binnen de op basis van het derde lid gestelde grenzen bevinden en informeert de deelnemer en de
      gewezen deelnemer hierover.

      5 Bij de uitvoering, bedoeld in het eerste lid, handelt de pensioenuitvoerder in het belang van de deelnemer of
      gewezen deelnemer.

      6 Ten behoeve van het advies, bedoeld in het derde lid, wint de pensioenuitvoerder informatie in over de financiële
      positie, kennis, ervaring, doelstellingen en risicobereidheid van de deelnemer of gewezen deelnemer, voor zover
      dit redelijkerwijs relevant is voor het advies. Het advies wordt, voor zover redelijkerwijs mogelijk, mede op deze
      informatie gebaseerd.

      7 Bij of krachtens algemene maatregel van bestuur kunnen regels gesteld worden met betrekking tot dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel135
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '135'
        hoofdstuk: '6'
  - number: 52a
    text: |-
      1 Bij de uitvoering van een premieovereenkomst zonder beleggingsvrijheid in de opbouwfase of een variabele
      uitkering voortvloeiend uit een premieovereenkomst of kapitaalovereenkomst is de pensioenuitvoerder
      verantwoordelijk voor de beleggingen en voert een beleggingsbeleid overeenkomstig [artikel 135][ref1]. Bij de
      uitvoering van dit beleggingsbeleid wordt rekening gehouden met de leeftijd van de deelnemers, gewezen deelnemers
      of pensioengerechtigden.

      2 Bij de uitvoering, bedoeld in het eerste lid, handelt de pensioenuitvoerder in het belang van de deelnemer,
      gewezen deelnemer of pensioengerechtigde.

      3 Indien de pensioenuitvoerder bij uitvoering van een variabele uitkering verschillende beleggingsprofielen
      hanteert, wordt voor de pensioengerechtigde een beleggingsprofiel toegepast dat passend is gezien zijn
      risicoprofiel. De pensioenuitvoerder informeert de pensioengerechtigde over het vastgestelde risicoprofiel en het
      beleggingsprofiel.

      4 De pensioenuitvoerder toetst periodiek het risicoprofiel van de pensioengerechtigde. Indien een wijziging in
      het risicoprofiel daartoe aanleiding geeft past de pensioenuitvoerder een ander, passend, beleggingsprofiel toe en
      informeert de pensioengerechtigde hierover.

      5 Ten behoeve van het risicoprofiel, bedoeld in het derde en vierde lid, wint de pensioenuitvoerder informatie in
      over de financiële positie, kennis, ervaring, doelstellingen en risicobereidheid van de pensioengerechtigde, voor
      zover dit redelijkerwijs relevant is voor het beleggingsprofiel.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de uitvoering van het beleggingsbeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel135
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '135'
        hoofdstuk: '6'
  - number: '53'
    text: |-
      De pensioenuitvoerder betaalt de uitkering uit hoofde van een pensioenrecht op verzoek van de pensioengerechtigde
      in een andere lidstaat van de Europese Unie dan de lidstaat waar die pensioenuitvoerder is gevestigd, waarbij
      transactiekosten op de uitkering uit hoofde van het pensioenrecht in mindering kunnen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel53
  - number: '54'
    text: |-
      1 Een pensioenuitvoerder kan voor de deelnemer die gewezen werknemer wordt een vrijwillige voortzetting van de
      pensioenregeling uitvoeren indien de vrijwillige voortzetting gedurende ten hoogste drie jaar vanaf de beëindiging
      van de dienstbetrekking voortduurt.

      2 In afwijking van het eerste lid geldt een termijn van tien jaar voor zover de genoemde gewezen werknemer,
      aansluitend aan de beëindiging van de dienstbetrekking, gedurende die periode winst uit onderneming geniet als
      bedoeld in [artikel 3.8 van de Wet inkomstenbelasting 2001][ref1].

      3 Van de in het eerste lid genoemde termijn kan worden afgeweken indien:

      a. de deelnemer ten tijde van de beëindiging van de dienstbetrekking arbeidsongeschikt is. De periode waarin sprake
      kan zijn van vrijwillige voortzetting is dan ten hoogste drie jaar of de duur van de arbeidsongeschiktheid indien
      deze langer is; of

      b. de deelnemer na de beëindiging van de dienstbetrekking een periodieke uitkering ontvangt ter vervanging van
      in verband met de beëindiging van de dienstbetrekking gederfde inkomsten op grond van een tussen één of meer
      werkgevers en één of meer werknemers afgesproken regeling. De periode waarin sprake kan zijn van vrijwillige
      voortzetting is dan ten hoogste drie jaar of de periode waarin de uitkering wordt ontvangen indien deze langer is.

      4 De deelnemer die vrijwillig wil voortzetten doet binnen negen maanden vanaf de beëindiging van de
      dienstbetrekking een verzoek daartoe bij de pensioenuitvoerder.

      5 De vrijwillige voortzetting begint uiterlijk vijftien maanden na beëindiging van de dienstbetrekking.
      [Artikel 14, tweede lid][ref2], is niet van toepassing op de periode vanaf de beëindiging van de dienstbetrekking
      tot het begin van de vrijwillige voortzetting.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.8
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel14
