  - number: '51'
    text: |-
      1 Er is een pensioenregister, ingericht en in stand gehouden door de pensioenuitvoerders, dat tot doel heeft
      op duidelijke en begrijpelijke wijze de aanspraakgerechtigde of de pensioengerechtigde in de gelegenheid te
      stellen gegevens over zijn pensioenaanspraken en pensioenrechten te raadplegen, waarbij deze gegevens, voor zover
      het ouderdomspensioen betreft, tevens weergegeven worden op basis van een pessimistisch scenario, een verwacht
      scenario en een optimistisch scenario. Het pensioenregister heeft verder tot doel inzicht te geven in de hoogte
      van het te bereiken pensioen, de keuzes ten aanzien van het pensioen, waaronder de mogelijkheid tot omzetting
      in een variabele uitkering, en de gevolgen van deze keuzes en van belangrijke gebeurtenissen op het pensioen
      van de aanspraakgerechtigde of de pensioengerechtigde. Onder pensioenaanspraken en pensioenrechten in de zin van
      dit artikel worden tevens verstaan aanspraken op ouderdomspensioen en recht op ouderdomspensioen op grond van de
      [Algemene Ouderdomswet][ref1].

      2 Het pensioenregister heeft mede tot doel op verzoek de pensioenuitvoerder te informeren bij welke andere
      pensioenuitvoerder een gewezen deelnemer pensioenaanspraken opbouwt ten behoeve van de toepassing van
      [artikel 70a][ref2].

      3 De pensioenuitvoerder verstrekt op verzoek van de aanspraakgerechtigde of de pensioengerechtigde tijdig zijn
      gegevens met betrekking tot pensioenaanspraken en pensioenrechten door middel van het pensioenregister.

      4 De Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], verstrekt op verzoek
      van de aanspraakgerechtigde of de pensioengerechtigde tijdig zijn gegevens over verzekeringstijdvakken
      en daarop gebaseerde aanspraak op ouderdomspensioen en recht op ouderdomspensioen op grond van de
      [Algemene Ouderdomswet][ref4] door middel van het pensioenregister.

      5 De gegevens die op grond van het derde en vierde lid worden verstrekt door middel van het pensioenregister worden
      in dat kader uitsluitend gebruikt voor het in het eerste en tweede lid omschreven doel.

      6 Een door Onze Minister aan te wijzen instelling ontwikkelt en beheert het pensioenregister en draagt zorg
      voor de tijdige verwerking van de gegevens, bedoeld in het derde en vierde lid, en het goed functioneren van het
      pensioenregister.

      7 De instelling, bedoeld in het zesde lid, is verwerker in de zin van de Algemene verordening gegevensbescherming
      voor het verwerken van de gegevens die door de pensioenuitvoerders en de Sociale verzekeringsbank, genoemd
      in [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5], door middel van het
      pensioenregister worden verstrekt.

      8 De instelling, bedoeld in het zesde lid, stelt in verband met haar rol als verwerker als bedoeld in het
      zevende lid een reglement vast waarin regels worden gesteld met betrekking tot het ontwikkelen en beheren van het
      pensioenregister. Dit reglement bevat in ieder geval regels over de gegevens die verstrekt worden, de wijze waarop
      deze gegevens verstrekt worden en de bekostiging en beveiliging van het pensioenregister.

      9 Het reglement alsmede elke wijziging daarvan behoeft de goedkeuring van Onze Minister.

      10 Hetgeen bij of krachtens [hoofdstuk 7][ref6] van toepassing is bij het toezicht op de uitvoering van dit artikel
      door pensioenuitvoerders is van overeenkomstige toepassing op de uitvoering van dit artikel door de instelling,
      bedoeld in het zesde lid.

      11 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de scenario’s, de actualisatie van de te verstrekken gegevens, het opnemen van gegevens met betrekking
      tot de keuzes ten aanzien van het pensioen en de gevolgen van deze keuzes en van belangrijke gebeurtenissen op het
      pensioen en de fasering van het opnemen van deze gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel70a
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
      [ref4]: https://wetten.overheid.nl/BWBR0002221
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
      [ref6]: https://wetten.overheid.nl/BWBR0020809#Hoofdstuk7
