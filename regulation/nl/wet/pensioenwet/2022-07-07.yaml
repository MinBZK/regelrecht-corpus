  - number: 78a
    text: |-
      De pensioenuitvoerder is bevoegd om na een verzoek van de gewezen deelnemer tot waardeoverdracht de
      overdrachtswaarde van diens pensioenaanspraken over te dragen indien:

      a. sprake is van een nieuwe pensioenregeling bij de gewezen werkgever;

      b. de nieuwe pensioenregeling in de mogelijkheid voorziet voor gewezen deelnemers van de oude pensioenregeling van
      de gewezen werkgever om waarde over te dragen; en

      c. wordt voldaan aan de in [artikel 76, eerste lid, met uitzondering van onderdeel a, en vierde lid][ref1],
      genoemde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel76
