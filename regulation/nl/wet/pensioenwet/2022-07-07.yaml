  - number: '107'
    text: |-
      In het bestuursverslag van een pensioenfonds wordt gerapporteerd over de samenstelling naar leeftijd en geslacht
      van het verantwoordingsorgaan, het belanghebbendenorgaan en het bestuur en over de inspanningen die zijn verricht
      om diversiteit in de organen van het pensioenfonds te bevorderen.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel107
  - number: '108'
    text: |-
      1 De werkgever draagt er zorg voor dat de werknemers die staan of gestaan hebben op een kandidatenlijst
      voor het verantwoordingsorgaan of het belanghebbendenorgaan alsmede de leden en de gewezen leden van
      het pensioenfondsbestuur, het verantwoordingsorgaan of het belanghebbendenorgaan niet uit hoofde van hun
      kandidaatstelling voor of hun lidmaatschap van het pensioenfondsbestuur, het verantwoordingsorgaan of het
      belanghebbendenorgaan worden benadeeld in hun positie als werknemer.

      2 Indien het pensioenfonds in zijn hoedanigheid als werkgever aan het verantwoordingsorgaan of het
      belanghebbendenorgaan een secretaris heeft toegevoegd is het eerste lid op die secretaris van overeenkomstige
      toepassing.

      3 Het verantwoordingsorgaan, het belanghebbendenorgaan en een werknemer als bedoeld in het eerste en tweede lid
      kunnen de kantonrechter verzoeken te bepalen dat de werkgever gevolg dient te geven aan hetgeen in deze leden is
      bepaald.

      4 De werkgever kan de arbeidsovereenkomst niet opzeggen met de werknemer die lid is van het bestuur van een
      pensioenfonds, een verantwoordingsorgaan of een belanghebbendenorgaan. Indien de werkgever aan het bestuur van een
      pensioenfonds, een verantwoordingsorgaan of een belanghebbendenorgaan een secretaris heeft toegevoegd, is de eerste
      zin op die secretaris van overeenkomstige toepassing.

      5 De werkgever kan de arbeidsovereenkomst niet opzeggen met een werknemer die geplaatst is op een kandidatenlijst
      voor het bestuur van een pensioenfonds, een verantwoordingsorgaan of een belanghebbendenorgaan of die korter
      dan twee jaar geleden lid is geweest van het bestuur van een pensioenfonds, een verantwoordingsorgaan of een
      belanghebbendenorgaan.

      6 Het vierde en vijfde lid zijn niet van toepassing bij een opzegging gedurende de proeftijd, wegens een dringende
      reden, indien de werknemer schriftelijk met de opzegging instemt of indien de opzegging geschiedt wegens de
      beëindiging van de werkzaamheden van de onderneming of van het onderdeel van de onderneming, waarin de werknemer
      uitsluitend of in hoofdzaak werkzaam is.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel108
  - number: '109'
    text: |-
      Iedere bepaling die het lidmaatschap van het bestuur, de raad van toezicht, de visitatiecommissie, het
      verantwoordingsorgaan of het belanghebbendenorgaan onmogelijk maakt op grond van het bereikt hebben van een
      bepaalde leeftijd is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel109
  - number: '110'
    text: |-
      Iedere bepaling die een goedkeuringsrecht inhoudt van een partij, die geen orgaan is van het pensioenfonds, inzake
      een besluit of voorgenomen besluit van het pensioenfonds is nietig, tenzij in deze wet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel110
  - number: '111'
    text: |-
      1 In de statuten van een pensioenfonds worden in ieder geval bepalingen opgenomen betreffende:

      a. het doel van het pensioenfonds, waaronder een omschrijving van de werkingssfeer;

      b. de bestemming van de middelen van het pensioenfonds;

      c. het beheer van het pensioenfonds;

      d. de inkomsten van het pensioenfonds;

      e. de belegging van de gelden;

      f. het bestuursmodel van het pensioenfonds, bedoeld in [artikel 99][ref1];

      g. de wijze waarop de bestuurders worden benoemd en ontslagen;

      h. de wijze waarop het intern toezicht is georganiseerd;

      i. de wijze waarop de leden van de raad van toezicht dan wel de visitatiecommissie worden benoemd en ontslagen;

      j. de wijze waarop de leden van het verantwoordingsorgaan dan wel het belanghebbendenorgaan worden benoemd en
      ontslagen;

      k. de wijziging van de statuten;

      l. de liquidatie van het pensioenfonds, waaronder begrepen de verplichtingen van de liquidateuren en de bestemming
      van de bezittingen van het pensioenfonds; en

      m. de toepassing van [artikel 105, derde lid][ref2].

      2 De omschrijving van de werkingssfeer, bedoeld in het eerste lid, onderdeel a, vindt ten aanzien van een
      bedrijfstakpensioenfonds plaats door het omschrijven van de bedrijfsactiviteiten van de bedrijfstak.

      3 Een bedrijfstakpensioenfonds dat aan werkgevers de mogelijkheid biedt om zich vrijwillig aan te sluiten bepaalt
      in zijn statuten onder welke voorwaarden deze vrijwillige aansluiting mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel105
