  - number: '75'
    text: |-
      1 Indien in de in [artikel 71][ref1] bedoelde situatie geen plicht tot waardeoverdracht bestaat omdat:

      a. de deelnemer niet voldaan heeft aan een in de algemene maatregel van bestuur op grond van
      [artikel 71, zevende lid][ref2], opgenomen voorwaarde om binnen een termijn een opgave te vragen; of

      b. sprake is van de in [artikel 73][ref3] bedoelde situatie;

      is de pensioenuitvoerder bevoegd tot waardeoverdracht indien voldaan wordt aan de in
      [artikel 71, eerste en vierde lid][ref4], genoemde voorwaarden.

      2 Indien in de in [artikel 71][ref5] bedoelde situatie geen plicht tot waardeoverdracht bestaat, omdat er geen
      sprake is van een individuele beëindiging, is de pensioenuitvoerder bevoegd tot waardeoverdracht indien:

      a. wordt voldaan aan de in [artikel 71, eerste lid, onderdeel b, tweede en derde zin, en vierde lid][ref6],
      genoemde voorwaarden;

      b. de overdragende en de ontvangende pensioenuitvoerders aan wie door een groep gewezen deelnemers verzoeken tot
      waardeoverdracht worden gedaan, dit schriftelijk hebben gemeld aan de toezichthouder; en

      c. de toezichthouder binnen drie maanden na de melding geen verbod tot waardeoverdracht heeft opgelegd aan een van
      beide pensioenuitvoerders.

      3 Indien de financiering van de aanspraken van de gewezen deelnemer bij de overdragende pensioenuitvoerder
      nog niet is voltooid overeenkomstig [artikel 55][ref7] kan de pensioenuitvoerder ondanks de lagere waarde en
      de daaruit bij de ontvangende pensioenuitvoerder resulterende lagere pensioenaanspraken de waarde overdragen
      indien de gewezen deelnemer en zijn partner schriftelijk hiermee instemmen en mits sprake is van de in
      [artikel 72, onderdeel c][ref8], of de in [artikel 73][ref9] bedoelde situatie.

      4 Indien in de in [artikel 71][ref10] bedoelde situatie geen plicht tot waardeoverdracht bestaat omdat sprake is
      van de in [artikel 72a][ref11] bedoelde situatie is de pensioenuitvoerder bevoegd tot waardeoverdracht indien:

      a. voldaan wordt aan de in [artikel 71, eerste en vierde lid][ref12], genoemde voorwaarden; en

      b. de oude of nieuwe werkgever bereid is de aanvullende bijdragen te betalen.


