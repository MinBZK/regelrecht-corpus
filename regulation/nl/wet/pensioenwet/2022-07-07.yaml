  - number: '198'
    text: |-
      De toezichthouder neemt, in coördinatie met de bevoegde autoriteiten van de lidstaat waarvan de voor
      bedrijfspensioenvoorziening geldende sociale en arbeidswetgeving van toepassing is op de pensioenregeling, de
      nodige maatregelen om ervoor te zorgen dat een pensioenfonds een einde maakt aan een vastgestelde inbreuk op de
      toepasselijke regelgeving.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel198
  - number: '199'
    text: |-
      Het is een pensioeninstelling uit een andere lidstaat verboden bijdragen te aanvaarden van een in Nederland zetel
      hebbende bijdragende onderneming zonder:

      a. een daartoe verleende vergunning van de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit een
      andere lidstaat haar zetel heeft; en

      b. de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling zetel heeft in kennis te hebben gesteld van
      het voornemen een pensioenregeling uit te voeren voor een in Nederland gevestigde bijdragende onderneming.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel199
  - number: 199a
    text: |-
      Een pensioeninstelling uit een andere lidstaat neemt bij de uitvoering van een pensioenregeling waarop de
      Nederlandse sociale en arbeidswetgeving van toepassing is deze wetgeving in acht.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel199a
  - number: '200'
    text: |-
      1 De toezichthouder informeert, binnen zes weken na de datum van ontvangst van gegevens als bedoeld in
      [artikel 194, tweede lid][ref1], de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit een andere
      lidstaat haar zetel heeft en die deze gegevens hebben verstrekt, over de bepalingen van de Nederlandse sociale
      en arbeidswetgeving die van toepassing zijn op de pensioenregeling waaraan wordt bijgedragen door de in Nederland
      zetel hebbende bijdragende onderneming.

      2 De toezichthouder stelt de bevoegde autoriteiten, bedoeld in het eerste lid, in kennis van elke significante
      wijziging in de op de pensioenregeling toepasselijke sociale en arbeidswetgeving die gevolgen kan hebben voor de
      kenmerken van de pensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel194
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '194'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '201'
    text: |-
      Wanneer de toezichthouder blijkt dat een pensioeninstelling uit een andere lidstaat bij de uitvoering van een
      pensioenregeling waaraan wordt bijgedragen door een in Nederland zetel hebbende bijdragende onderneming in strijd
      met de Nederlandse sociale en arbeidswetgeving handelt, stelt de toezichthouder de bevoegde autoriteiten van
      de lidstaat waar de pensioeninstelling haar zetel heeft hiervan onverwijld in kennis, onder mededeling van deze
      kennisgeving aan de pensioeninstelling uit een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel201
  - number: '202'
    text: |-
      1 Indien een pensioeninstelling uit een andere lidstaat inbreuk blijft maken op de op de pensioenregeling
      toepasselijke Nederlandse sociale en arbeidswetgeving, in weerwil van de door de bevoegde autoriteiten van de
      lidstaat waar de pensioeninstelling uit een andere lidstaat haar zetel heeft getroffen maatregelen of omdat
      die bevoegde autoriteiten geen passende maatregelen hebben getroffen, kan de toezichthouder, na die bevoegde
      autoriteiten daarvan in kennis te hebben gesteld, passende maatregelen nemen om de inbreuk op de toepasselijke
      regelgeving door de pensioeninstelling te beëindigen en, voorzover zulks volstrekt noodzakelijk is, de
      pensioeninstelling te beletten activiteiten te verrichten voor de Nederlandse bijdragende onderneming.

      2 De toezichthouder kan, ter uitvoering van het eerste lid, de bevoegdheden, bedoeld in de [artikelen 171][ref1],
      [175][ref2] en [176][ref3] toepassen.

      3 De toezichthouder kan, na toepassing van [artikel 201][ref4], de bevoegdheden, bedoeld in de
      [artikelen 171][ref5], [175][ref6] en [176][ref7] toepassen wanneer een pensioeninstelling uit een andere lidstaat
      [artikel 199][ref8] niet naleeft.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel171
