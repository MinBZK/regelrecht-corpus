  - number: '98'
    text: |-
      Overlijdt een deelnemer, gewezen deelnemer of gepensioneerde ten gevolge van een van het risico uitgesloten oorzaak
      en betrof het een partnerpensioen op opbouwbasis, dan keert de pensioenuitvoerder aan de partner een periodieke
      uitkering van partnerpensioen uit die gebaseerd is op de premievrije waarde berekend naar de dag voorafgaande aan
      het overlijden.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel98
  - number: 98a
    text: |-
      De Nederlandse sociale en arbeidswetgeving is niet van toepassing voor zover een pensioenuitvoerder een
      pensioenregeling uitvoert waarop de voor de bedrijfspensioenvoorziening geldende regels van een andere staat dan
      Nederland van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel98a
  - number: '99'
    text: |-
      Een pensioenfonds heeft een paritair, een onafhankelijk of een gemengd bestuur. Indien een pensioenfonds een
      gemengd bestuur heeft, dan is dit een paritair gemengd bestuur, een onafhankelijk gemengd bestuur of een omgekeerd
      gemengd bestuur.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel99
  - number: '100'
    text: |-
      1 In het paritaire bestuur van een bedrijfstakpensioenfonds zijn de belanghebbenden op een zo evenwichtig mogelijke
      wijze vertegenwoordigd met dien verstande dat de vertegenwoordigers van werknemersverenigingen in de betrokken
      bedrijfstak of bedrijfstakken en de vertegenwoordigers van pensioengerechtigden tezamen ten minste evenveel zetels
      bezetten als de vertegenwoordigers van werkgeversverenigingen in de betrokken bedrijfstak of bedrijfstakken.

      Vertegenwoordigers van pensioengerechtigden bezetten, zo nodig in afwijking van [artikel 102, eerste lid][ref1],
      niet meer dan 25% van het aantal zetels dat door vertegenwoordigers van werkgeversverenigingen, vertegenwoordigers
      van werknemersverenigingen en vertegenwoordigers van pensioengerechtigden tezamen wordt bezet.

      2 In het paritaire bestuur van een ondernemingspensioenfonds zijn de belanghebbenden op een zo evenwichtig
      mogelijke wijze vertegenwoordigd met dien verstande dat de werknemersvertegenwoordigers en vertegenwoordigers van
      pensioengerechtigden tezamen ten minste evenveel zetels bezetten als de werkgeversvertegenwoordigers.

      Vertegenwoordigers van pensioengerechtigden bezetten, zo nodig in afwijking van [artikel 102, eerste lid][ref2],
      niet meer dan 25% of, indien sprake is van de in artikel 102, tweede lid, bedoelde situatie 50%, van het
      aantal zetels dat door werknemersvertegenwoordigers, werkgeversvertegenwoordigers en vertegenwoordigers van
      pensioengerechtigden tezamen wordt bezet.

      3 In het paritaire bestuur van een algemeen pensioenfonds is het eerste lid van overeenkomstige
      toepassing voor zover het algemeen pensioenfonds een pensioenregeling uitvoert voor een of meer
      bedrijfstakken of delen van een bedrijfstak; is het tweede lid van overeenkomstige toepassing voor
      zover het algemeen pensioenfonds een pensioenregeling uitvoert voor een onderneming of groep en is
      [artikel 109 van de Wet verplichte beroepspensioenregeling][ref3] van overeenkomstige toepassing voor zover het
      algemeen pensioenfonds een beroepspensioenregeling uitvoert als bedoeld in [artikel 1 van die wet][ref4].

      4 Indien de statuten van een pensioenfonds voorzien in stemgerechtigde vertegenwoordigers in het paritaire
      bestuur van anderen dan werknemersverenigingen dan wel werknemers, werkgeversverenigingen dan wel de werkgever
      of pensioengerechtigden, worden die vertegenwoordigers voor de toepassing van het eerste, tweede en derde lid
      gelijkgesteld met vertegenwoordigers van pensioengerechtigden.

      5 Het tweede tot en met vierde lid is niet van toepassing voor zover een onderneming of groep waaraan het
      ondernemingspensioenfonds was verbonden heeft opgehouden te bestaan.

      6 Aan het paritaire bestuur van een pensioenfonds kunnen maximaal twee bestuurders worden toegevoegd die niet
      directe vertegenwoordigers zijn van de belanghebbenden bij het pensioenfonds. Het vierde lid is niet van toepassing
      op deze bestuurders.

      7 Het bestuur stelt een profielschets op voor leden van het bestuur. Het bestuur kan een kandidaat bestuurder
      afwijzen indien deze niet aan de profielschets voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel102
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel109
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel1
