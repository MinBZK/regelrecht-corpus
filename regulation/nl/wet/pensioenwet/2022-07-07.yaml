  - number: 92a
    text: |-
      1 Een pensioenfonds of premiepensioeninstelling is bevoegd een collectieve waardeoverdracht van een
      pensioeninstelling uit een andere lidstaat aan te nemen, mits de toezichthouder goedkeuring heeft verleend voor de
      collectieve waardeoverdracht.

      2 Het pensioenfonds of de premiepensioeninstelling dient de aanvraag tot goedkeuring van een collectieve
      waardeoverdracht als bedoeld in het eerste lid in bij de toezichthouder.

      3 De aanvraag tot goedkeuring bevat de volgende gegevens:

      a. de schriftelijke overeenkomst tussen het pensioenfonds of de premiepensioeninstelling en de pensioeninstelling
      uit de andere lidstaat met de voorwaarden van de voorgenomen collectieve waardeoverdracht;

      b. een beschrijving van de belangrijkste kenmerken van de over te dragen pensioenregeling;

      c. een beschrijving van de over te dragen passiva of technische voorzieningen en andere verplichtingen en rechten,
      en de overeenkomstige activa of de geldwaarde daarvan;

      d. de naam, alsmede de plaats van vestiging van het hoofdbestuur, van het pensioenfonds of de
      premiepensioeninstelling en de pensioeninstelling uit de andere lidstaat en de lidstaten waar deze instellingen
      zijn geregistreerd of een vergunning hebben verkregen;

      e. de naam, alsmede de plaats van vestiging van het hoofdbestuur, van de bijdragende onderneming;

      f. een bewijs dat een, op basis van het recht van de lidstaat waar de pensioeninstelling uit de andere lidstaat
      haar zetel heeft, vastgestelde meerderheid van de betrokken deelnemers, gewezen deelnemers en pensioengerechtigden
      of, in voorkomend geval, een meerderheid van hun vertegenwoordigers, de overdracht heeft goedgekeurd en, in
      voorkomend geval, de bijdragende onderneming; en

      g. in voorkomend geval, de namen van de lidstaten waarvan de geldende sociale en arbeidswetgeving van toepassing is
      op de betrokken pensioenregeling.

      4 De toezichthouder stuurt de aanvraag tot goedkeuring, bedoeld in het tweede lid, na ontvangst onverwijld aan de
      bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar zetel heeft.

      5 Na ontvangst van de beoordeling van de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit
      de andere lidstaat haar zetel heeft, neemt de toezichthouder een besluit omtrent het verlenen of weigeren van
      goedkeuring voor de collectieve waardeoverdracht, met dien verstande dat:

      a. indien de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar zetel
      heeft geen toestemming hebben verleend voor de collectieve waardeoverdracht een inhoudelijke beoordeling van de
      aanvraag tot goedkeuring van de collectieve waardeoverdracht door de toezichthouder achterwege kan blijven en
      goedkeuring voor de collectieve waardeoverdracht wordt geweigerd;

      b. indien de bevoegde autoriteiten toestemming hebben verleend voor de collectieve waardeoverdracht, de
      toezichthouder goedkeuring verleent voor de collectieve waardeoverdracht, mits:

      1°. de aanvraag tot goedkeuring de gegevens, bedoeld in het derde lid, bevat;

      2°. de administratieve structuur, de financiële positie van het pensioenfonds of de premiepensioeninstelling
      en de goede reputatie of de beroepskwalificaties of beroepservaring van de personen die het pensioenfonds of de
      premiepensioeninstelling besturen met de voorgenomen collectieve waardeoverdracht verenigbaar zijn;

      3°. de langetermijnbelangen van de deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en
      pensioengerechtigden van het pensioenfonds of de premiepensioeninstelling en het overgedragen deel van de
      pensioenregeling tijdens en na de collectieve waardeoverdracht afdoende worden beschermd;

      4°. de technische voorzieningen van het pensioenfonds of de premiepensioeninstelling op het moment van de
      collectieve waardeoverdracht volledig door kapitaal zijn gedekt, indien de collectieve waardeoverdracht in een
      grensoverschrijdende activiteit resulteert; en

      5°. de over te dragen activa toereikend en passend zijn om de over te dragen passiva, technische voorzieningen en
      andere verplichtingen en rechten te dekken.

      6 De toezichthouder deelt het besluit tot het verlenen of weigeren van goedkeuring voor de collectieve
      waardeoverdracht binnen drie maanden na ontvangst van de aanvraag tot goedkeuring mee aan het pensioenfonds of
      de premiepensioeninstelling.

      7 De toezichthouder deelt de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere
      lidstaat haar zetel heeft het in het zesde lid bedoelde besluit mee, binnen twee weken nadat het is genomen.

      8 De toezichthouder deelt informatie over de toepasselijke bepalingen van sociale en arbeidswetgeving ontvangen van
      de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar zetel heeft binnen
      een week na ontvangst mee aan het pensioenfonds of de premiepensioeninstelling.

      9 De kosten van de collectieve waardeoverdracht komen niet ten laste van de bij het pensioenfonds of
      de premiepensioeninstelling bestaande deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en
      pensioengerechtigden.

      10 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel92a
  - number: '93'
    text: |-
      Inlichtingen uit de basisregistratie personen en inlichtingen en uittreksels uit de registers van de burgerlijke
      stand, die de pensioenuitvoerder nodig heeft met het oog op de uitvoering van zijn taak, zijn vrij van leges.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel93
  - number: '94'
    text: |-
      1 Het burgerservicenummer kan door de pensioenuitvoerder bij het verwerken van persoonsgegevens worden gebruikt.

      2 De pensioenuitvoerder gebruikt dit burgerservicenummer uitsluitend:

      a. in het verkeer met de persoon op wie het nummer betrekking heeft; of

      b. in contacten met personen en instanties voor zover deze zelf bevoegd zijn gebruik te maken van het
      burgerservicenummer bij het verwerken van persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel94
  - number: '95'
    text: |-
      1 Bij voorwaardelijke toeslagverlening door een verzekeraar dient er een consistent geheel te zijn tussen de
      gewekte verwachtingen, de financiering en het realiseren van voorwaardelijke toeslagen.

      2 Bij regeling van Onze Minister wordt invulling gegeven aan de consistentie, bedoeld in het eerste lid.

      3 Een toeslag is alleen voorwaardelijk indien in de pensioenovereenkomst, de uitvoeringsovereenkomst,
      het pensioenreglement, de opgaven op grond van de [artikelen 21][ref1], [38 tot en met 46a][ref2] alsmede
      in de overige, persoonlijke, informatieverstrekking over toeslagverlening door de pensioenuitvoerder een
      voorwaardelijkheidsverklaring is opgenomen.

      4 Bij regeling van Onze Minister kunnen regels worden gesteld over de inhoud van de voorwaardelijkheidsverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel38
