  - number: 63a
    text: |-
      1 Onverminderd [artikel 63][ref1] kan de hoogte van een variabele uitkering na de ingangsdatum van het pensioen
      variëren door de verwerking van financiële mee- of tegenvallers als gevolg van het beleggingsrisico, de
      ontwikkeling van het sterfteresultaat of de ontwikkeling van de levensverwachting.

      2 De verwerking van financiële mee- of tegenvallers die het gevolg zijn van het beleggingsrisico of van de
      ontwikkeling van de levensverwachting gebeurt door middel van individuele toedeling of door middel van een
      collectief toedelingsmechanisme. De verwerking van financiële mee- of tegenvallers die het gevolg zijn van het
      sterfteresultaat gebeurt door middel van een collectief toedelingsmechanisme.

      3 De hoogte van een variabele uitkering kan ook variëren door een, uiterlijk op de ingangsdatum van het pensioen
      vastgestelde, periodieke vaste daling of vaste stijging van de uitkering. De periodieke vaste daling bedraagt ten
      hoogste 35% van het verschil tussen de parameter voor aandelenrendement en de risicovrije rente.

      4 De pensioenuitvoerder past een collectief toedelingsmechanisme toe op een toedelingskring die bestaat uit
      pensioengerechtigden.

      5 In afwijking van het vierde lid kunnen deelnemers of gewezen deelnemers deel uitmaken van de
      toedelingskring in de laatste tien jaar voorafgaand aan de pensioenrichtleeftijd, bedoeld in
      [artikel 18a, zesde lid, van de Wet op de loonbelasting 1964][ref2]. De deelname van deelnemers of
      gewezen deelnemers aan de toedelingskring vindt plaats door tijdsevenredige toetreding tot het collectief
      toedelingsmechanisme in deze periode.

      6 Bij toepassing van een collectief toedelingsmechanisme wordt ten minste een maal per jaar op het niveau van de
      toedelingskring het financiële resultaat vastgesteld en verwerkt. Bij een collectief toedelingsmechanisme kan een
      spreidingsperiode worden gehanteerd van maximaal tien jaar. Gedurende de spreidingsperiode worden uitsluitend de
      uitkeringen en aanspraken van de bij aanvang van de spreidingsperiode tot de toedelingskring behorende personen in
      gelijke stappen aangepast. Bij de vaststelling van de hoogte van de jaarlijkse aanpassing wordt rekening gehouden
      met de verwachte resterende levensverwachting van de toedelingskring.

      7 Bij toepassing van een collectief toedelingsmechanisme voor het beleggingsrisico wordt de projectierente
      gebaseerd op de risicovrije rente. De vormgeving van het collectief toedelingsmechanisme voor het beleggingsrisico
      en de hoogte van een periodieke vaste daling als bedoeld in het derde lid zijn zodanig dat er op voorhand geen
      herverdelingseffecten tussen leeftijdsgroepen plaatsvinden.

      8 Bij verwerking van financiële mee- of tegenvallers door middel van individuele toedeling wordt de projectierente
      gebaseerd op de risicovrije rente. Bij individuele toedeling wordt ten minste een maal per jaar het financiële
      resultaat vastgesteld en verwerkt, waarbij een spreidingsperiode van maximaal tien jaar kan worden gehanteerd. Bij
      de vaststelling van de omvang van de periodieke aanpassing van de uitkeringshoogte gedurende de spreidingsperiode
      wordt rekening gehouden met de verwachte resterende levensverwachting van de pensioengerechtigde.

      9 Bij of krachtens algemene maatregel van bestuur:

      a. kunnen regels worden gesteld voor de uitkering gebaseerd op pensioeneenheden; en

      b. worden nadere regels gesteld over dit artikel over onder meer het collectief toedelingsmechanisme en de
      projectierente.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
