      1 De pensioenuitvoerder die een verzoek tot waardeoverdracht ontvangt van een gewezen deelnemer waarbij beoogd
      wordt de waarde over te dragen aan een buitenlandse instelling, meldt dit aan de toezichthouder.

      2 Waardeoverdracht aan een buitenlandse instelling is alleen mogelijk wanneer ten genoegen van de toezichthouder
      wordt aangetoond dat:

      a. voldaan wordt aan de in [artikel 71, eerste lid][ref1], genoemde voorwaarden;

      b. de in [artikel 72][ref2] bedoelde omstandigheden op de overdragende pensioenuitvoerder niet van toepassing zijn;

      c. de buitenlandse instelling de pensioenregeling uitvoert van de nieuwe werkgever;

      d. de buitenlandse instelling in het land van vestiging is onderworpen aan een vorm van overheidstoezicht;

      e. de vermogens van de instelling en de werkgever juridisch zijn gescheiden door het bestaan van een aparte
      juridische entiteit van de instelling, door een speciale preferentieregeling ten gunste van pensioengerechtigden
      of anderszins;

      f. de mogelijkheden tot afkoop van de overgedragen pensioenaanspraken na de waardeoverdracht niet ruimer zijn dan
      op basis van deze wet; en

      g. de tot verevening gerechtigde echtgenoot, bedoeld in
      [artikel 2 van de Wet verevening pensioenrechten bij scheiding][ref3], met de waardeoverdracht instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0006641#Artikel2
