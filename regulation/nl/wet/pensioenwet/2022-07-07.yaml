  - number: 205b
    text: |-
      1 De toezichthouder deelt de gegevens uit het register, bedoeld in [artikel 210][ref1], mee aan de Europese
      Autoriteit voor verzekeringen en bedrijfspensioenen.

      2 De toezichthouder stelt de Europese Autoriteit voor verzekeringen en bedrijfspensioenen in kennis van een besluit
      om de activiteiten van een pensioenfonds te verbieden of beperken.

      3 De toezichthouder neemt bij de uitvoering van haar taak op grond van de wet artikel 32, derde lid, [Richtlijn
      2016/97](32016L0097) van het Europees Parlement en de Raad van 20 januari 2016 betreffende verzekeringsdistributie
      (herschikking) (PbEU 2016, L 26) in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel210
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel205b
    references:
