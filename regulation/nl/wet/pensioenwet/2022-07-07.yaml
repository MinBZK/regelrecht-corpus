  - number: '145'
    text: |-
      1 Het pensioenfonds stelt een actuariële en bedrijfstechnische nota vast waarin in elk geval een omschrijving
      is opgenomen van de wijze waarop uitvoering wordt gegeven aan het bij of krachtens de [artikelen 25][ref1],
      [126 tot en met 137][ref2] en [143][ref3] bepaalde. Daarbij wordt de samenstelling van de feitelijke premie en de
      hoogte van de premiecomponenten opgenomen. De actuariële en bedrijfstechnische nota bevat voorts een verklaring
      inzake beleggingsbeginselen.

      2 De actuariële en bedrijfstechnische nota van een pensioenfonds bevat verder:

      a. een financieel crisisplan waarin het pensioenfonds beschrijft welke maatregelen ingezet kunnen worden in
      de situatie dat niet aan de vereisten gesteld bij of krachtens [artikel 132][ref4] zal worden voldaan en welke
      maatregelen ingezet kunnen worden in de situatie, bedoeld in artikel 140, eerste lid;

      b. het niveau van de beleidsdekkingsgraad vanaf welke premiekortingen en terugstortingen als bedoeld in
      [artikel 129][ref5] zijn toegestaan; en

      c. een beschrijving van de overige sturingsmiddelen.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de actuariële en
      bedrijfstechnische nota.

      4 Voorzover risico’s zijn overgedragen, verzekerd of ondergebracht kan de omschrijving, bedoeld in het eerste lid,
      beperkt blijven tot een verwijzing naar hetgeen daarover in de betreffende overeenkomsten is opgenomen.

      5 De verklaring inzake beleggingsbeginselen wordt om de drie jaren en voorts onverwijld na iedere belangrijke
      wijziging van het beleggingsbeleid herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel25
