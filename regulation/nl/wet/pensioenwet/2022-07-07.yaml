  - number: 70a
    text: |-
      1 De pensioenuitvoerder heeft het recht om na beëindiging van de deelneming de overdrachtswaarde van de
      pensioenaanspraken van een gewezen deelnemer over te dragen indien:

      a. op basis van de opgebouwde aanspraak op ouderdomspensioen de uitkering van het ouderdomspensioen op jaarbasis op
      de reguliere ingangsdatum minder zal bedragen dan het op basis van [artikel 66][ref1] bepaalde bedrag;

      b. de pensioenuitvoerder bij de toepassing van dit lid niet een lager maximum hanteert dan het in onderdeel a
      bedoelde bedrag;

      c. de opgebouwde aanspraak geen nettopensioen betreft; en

      d. de waardeoverdracht ertoe strekt het de gewezen deelnemer mogelijk te maken pensioenaanspraken te verwerven bij
      de ontvangende pensioenuitvoerder van de nieuwe werkgever of de beroepspensioenregeling.

      2 De ontvangende pensioenuitvoerder is verplicht de overdrachtswaarde aan te wenden ter verwerving van
      pensioenaanspraken voor de deelnemer.

      3 De ontvangende pensioenuitvoerder waarborgt dat de actuariële waarde van de door de deelnemer te verwerven
      pensioenaanspraken ten minste gelijk is aan de op dezelfde grondslagen berekende waarde van de over te dragen
      pensioenaanspraken.

      4 De overdragende en ontvangende pensioenuitvoerder brengen in het kader van de waardeoverdracht geen kosten in
      rekening bij de gewezen deelnemer.

      5 Elk beding strijdig met dit artikel is nietig.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over dit artikel onder meer over de
      berekening van de overdrachtswaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
