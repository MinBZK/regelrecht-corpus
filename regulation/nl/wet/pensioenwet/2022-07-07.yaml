  - number: 63b
    text: |-
      1 Bij een kapitaalovereenkomst of een premieovereenkomst die voorziet in uitkering van een aan te wenden kapitaal
      op de pensioendatum, legt de pensioenuitvoerder de deelnemer of gewezen deelnemer in elk geval voorafgaand aan
      de datum waarop het ouderdomspensioen ingaat of kan ingaan de keuze voor tussen een vastgestelde uitkering of een
      variabele uitkering.

      2 Bij het bieden van de keuze verstrekt de pensioenuitvoerder de deelnemer of gewezen deelnemer de voor hem
      relevante informatie over de gevolgen en risico’s bij deze keuze waaronder een opgave van de hoogte van de
      vastgestelde uitkeringen en een opgave van de hoogte van de variabele uitkeringen. Deze opgaven worden tevens
      weergegeven op basis van een pessimistisch scenario, een verwacht scenario en een optimistisch scenario.

      3 Een pensioenuitvoerder die niet zowel vastgestelde als variabele uitkeringen uitvoert meldt dit aan de deelnemer
      of gewezen deelnemer. De pensioenuitvoerder verstrekt de in het tweede lid bedoelde informatie voor de uitkering
      die hij uitvoert en wijst de deelnemer of gewezen deelnemer op de mogelijkheden tot waardeoverdracht, bedoeld in de
      [artikelen 80][ref1], [81][ref2], en [81a, tweede lid][ref3].

      4 Indien de deelnemer of gewezen deelnemer niet binnen de door de pensioenuitvoerder gestelde termijn reageert
      op de keuzemogelijkheid die hem ingevolge het eerste lid is geboden, gaat de pensioenuitvoerder die vastgestelde
      uitkeringen uitvoert op de ingangsdatum van het pensioen over tot verstrekking van een vastgestelde uitkering.

      5 Een pensioenfonds dat uitsluitend variabele uitkeringen uitvoert waarbij deelnemers of gewezen deelnemers
      deel uitmaken van de toedelingskring waarop een collectief toedelingsmechanisme voor het beleggingsrisico wordt
      toegepast, legt de deelnemer of gewezen deelnemer, voorafgaand aan de eerste toetreding tot de toedelingskring,
      de keuze tot toetreding voor. Het tweede tot en met vierde lid zijn bij deze keuze van overeenkomstige toepassing,
      met dien verstande dat de partijen die betrokken zijn bij de vaststelling, wijziging of intrekking van de
      pensioenovereenkomst kunnen overeenkomen dat een deelnemer of gewezen deelnemer toetreedt tot de toedelingskring,
      indien de deelnemer of gewezen deelnemer niet binnen de door het pensioenfonds gestelde termijn reageert op de
      keuzemogelijkheid die hem ingevolge de eerste zin is geboden. Bij het bieden van de keuze wijst het pensioenfonds
      in dit geval expliciet op de consequenties van niet of niet tijdig reageren door de deelnemer of gewezen deelnemer.
      Voor zover de deelnemer of gewezen deelnemer is toegetreden tot de toedelingskring zijn het eerste tot en met
      vierde lid voorafgaand aan de datum waarop het ouderdomspensioen ingaat of kan ingaan niet van toepassing. Dit lid
      wordt bij een algemeen pensioenfonds toegepast per collectiviteitkring.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de te verstrekken informatie, de rekenregels en de wijze waarop de informatie wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel80
