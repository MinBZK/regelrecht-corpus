      1 Een pensioenuitvoerder is verplicht om op verzoek van de gerechtigde tot een pensioen over te gaan
      tot afkoop van het deel van de pensioenaanspraken dat uitgaat boven de begrenzingen die zijn opgenomen
      in de [hoofdstukken IIB][ref1] en [VIII van de Wet op de loonbelasting 1964][ref2]. De eerste zin
      is niet van toepassing met betrekking tot een nettopensioen, tenzij sprake is van toepassing van
      [artikel 5.17e, vijfde lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref3].

      2 Voor de toepassing van dit artikel zijn de [artikelen 3.18, vierde en vijfde lid][ref4], en
      [3.95, eerste lid, tweede volzin, van de Wet inkomstenbelasting 2001][ref5] van overeenkomstige toepassing voor
      zover aan de pensioenregeling wordt deelgenomen door deelnemers die niet worden aangemerkt als werknemer in de zin
      van de [Wet op de loonbelasting 1964][ref6].

      3 De afkoopwaarde wordt door de pensioenuitvoerder aan de deelnemer of gewezen deelnemer ter beschikking gesteld,
      met uitzondering van de afkoopwaarde voor een bijzonder partnerpensioen die ter beschikking wordt gesteld aan de
      gewezen partner.

      4 De pensioenuitvoerder waarborgt bij de vaststelling van de afkoopwaarde door vaststelling van een afkoopvoet
      dat geen onderscheid gemaakt wordt tussen mannen en vrouwen waarbij voldaan wordt aan het vereiste van collectieve
      actuariële gelijkwaardigheid.

      5 Voor zover het de toepassing van het eerste lid betreft heeft het vierde lid betrekking op pensioenaanspraken
      die zijn opgebouwd vanaf 1 januari 2015, tenzij in de pensioenovereenkomst is overeengekomen dat het vierde lid
      betrekking heeft op pensioenaanspraken die zijn opgebouwd voor 1 januari 2015.

      6 Elk beding strijdig met dit artikel is nietig.

      7 Bij of krachtens algemene maatregel van bestuur kunnen er regels worden gesteld aan het vaststellen van de
      afkoopwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
      [ref2]: https://wetten.overheid.nl/BWBR0002471#HoofdstukVIII
