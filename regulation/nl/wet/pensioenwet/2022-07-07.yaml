  - number: '36'
    text: |-
      1 De pensioenuitvoerder registreert de deelnemingsjaren van de deelnemers en verstrekt hierover informatie aan de
      deelnemers en gewezen deelnemers.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste lid, waaronder de
      perioden die in aanmerking komen als deelnemingsjaren.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel36
  - number: '37'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen meldt de arbeidsongeschiktheid van een deelnemer aan de
      pensioenuitvoerder.

      2 Bij regeling van Onze Minister worden regels gesteld ten aanzien van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel37
  - number: '38'
    text: |-
      1 De pensioenuitvoerder verstrekt de deelnemer jaarlijks:

      a. een opgave van de verworven pensioenaanspraken;

      b. een opgave van de aan het voorafgaande kalenderjaar toe te rekenen waardeaangroei van pensioenaanspraken
      overeenkomstig [artikel 3.127 van de Wet inkomstenbelasting 2001][ref1] en de daarop berustende bepalingen;

      c. informatie over toeslagverlening;

      d. informatie over vermindering van pensioenaanspraken en pensioenrechten op grond van [artikel 134][ref2];

      e. informatie over een variabele uitkering;

      f. informatie over de reglementaire pensioenleeftijd;

      g. een opgave van de reglementair te bereiken pensioenaanspraken, waarbij deze gegevens voor zover het
      ouderdomspensioen betreft, tevens weergegeven worden op basis van een pessimistisch scenario, een verwacht scenario
      en een optimistisch scenario, met de waarschuwing dat de projecties kunnen verschillen van de definitieve hoogte
      van de te ontvangen pensioenuitkeringen;

      h. informatie over de werkgeverspremie en werknemerspremie;

      i. informatie over garanties;

      j. informatie over het land waar het pensioen is ondergebracht en de toezichthouder waar het pensioen onder valt;

      k. voor zover van toepassing, informatie over de dekkingsgraad naar Nederlandse maatstaf; en

      l. voor zover van toepassing, informatie over de ingehouden kosten.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de in het eerste
      lid bedoelde opgaven en informatie en de wijze waarop deze worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.127
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3.127'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '134'
        hoofdstuk: '6'
  - number: '39'
    text: |-
      1 Voor zover van toepassing verstrekt de pensioenuitvoerder de deelnemer bij beëindiging van de deelneming:

      a. een opgave van de opgebouwde pensioenaanspraken op grond van [artikel 55][ref1];

      b. informatie over toeslagverlening;

      c. informatie die voor de deelnemer specifiek in het kader van de beëindiging relevant is;

      d. informatie over omstandigheden die betrekking hebben op het functioneren van de pensioenuitvoerder; en

      e. informatie over vermindering van pensioenaanspraken en pensioenrechten op grond van [artikel 134][ref2].

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid
      bedoelde opgave en informatie en de wijze waarop deze worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel39
