  - number: '143'
    text: |-
      1 Een pensioenfonds richt zijn organisatie zodanig in dat deze een beheerste en integere bedrijfsvoering waarborgt.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het eerste lid. De
      regels hebben in ieder geval betrekking op:

      a. het beheersen van bedrijfsprocessen en bedrijfsrisico’s;

      b. integriteit;

      c. de soliditeit van het pensioenfonds, waaronder wordt verstaan:

      1°. het beheersen van financiële risico’s; en

      2°. het beheersen van andere risico’s die de soliditeit van het pensioenfonds kunnen aantasten;

      d. het beheersen van de financiële positie over de lange termijn door periodiek een haalbaarheidstoets te maken.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel143
  - number: 143a
    text: |-
      1 Een pensioenfonds beschikt over een risicobeheerfunctie, interne auditfunctie en actuariële functie.

      2 De houders van de risicobeheerfunctie, interne auditfunctie of actuariële functie rapporteren materiële
      bevindingen en aanbevelingen op het gebied dat onder hun verantwoordelijkheid valt aan het bestuur van het
      pensioenfonds. Indien de houder van de risicobeheerfunctie, interne auditfunctie of actuariële functie tevens
      bestuurder is van het pensioenfonds worden de materiële bevindingen en aanbevelingen ook gerapporteerd aan de raad
      van toezicht of de visitatiecommissie.

      3 De houders van de risicobeheerfunctie, interne auditfunctie of actuariële functie melden het de toezichthouder
      zo spoedig mogelijk indien het bestuur van het pensioenfonds niet tijdig passende corrigerende maatregelen treft,
      nadat het bestuur op grond van het tweede lid op de hoogte is gesteld van:

      a. een substantieel risico dat het pensioenfonds niet aan een bij of krachtens de wet gesteld vereiste van
      significante betekenis zal voldoen en dit ernstige gevolgen kan hebben voor de belangen van deelnemers, gewezen
      deelnemers, andere aanspraakgerechtigden of pensioengerechtigden; of

      b. een significante inbreuk op de voor het pensioenfonds en haar activiteiten geldende bij of krachtens de wet
      gestelde vereisten.

      4 Het pensioenfonds draagt er zorg voor dat de houder van de risicobeheerfunctie, interne auditfunctie of
      actuariële functie die op grond van het derde lid te goeder trouw en naar behoren een melding heeft gedaan bij de
      toezichthouder als gevolg van deze melding niet wordt benadeeld.

      5 Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel143a
  - number: 143b
    text: De toezichthouder kan een pensioenfonds de verplichting opleggen om een stresstest uit te voeren.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel143b
  - number: '144'
    text: |-
      1 Bij algemene maatregel van bestuur worden, ten behoeve van de berekeningen, bedoeld bij de [artikelen 126][ref1],
      [128][ref2], [137][ref3], [138][ref4], [139][ref5], [140][ref6] en [143][ref7], regels gesteld over:

      a. het minimale percentage van het gemiddelde loon- of prijsindexcijfer;

      b. het maximaal te hanteren gemiddelde rendement op vastrentende waarden;

      c. de maximaal te hanteren risicopremies op onder andere aandelen en onroerend goed; en

      d. een uniforme set met economische scenario’s.

      2 De in het eerste lid bedoelde regels worden uiterlijk iedere vijf jaren getoetst, rekening houdend met
      financieel-economische ontwikkelingen in het verleden en realistische inzichten ten aanzien van toekomstige
      financieel-economische verwachtingen.

      3 Voordat de voordracht van de in het eerste lid bedoelde algemene maatregel van bestuur wordt gedaan vraagt Onze
      Minister het oordeel van een commissie bestaande uit onafhankelijke leden die door Onze Minister worden aangewezen,
      waaronder een voorzitter. Daarbij wordt tevens het oordeel van de commissie gevraagd over de technische uitwerking
      van de grondslagen voor de waardering van pensioenverplichtingen met een lange termijn.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het derde lid
      bedoelde commissie.

      5 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


