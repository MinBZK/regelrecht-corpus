      1 De [artikelen 929][ref1], [935, eerste lid][ref2], [936, tweede tot en met zesde lid][ref3],
      [941, vijfde lid][ref4], [969][ref5], [972][ref6], [977, tweede lid][ref7], [978][ref8], [979][ref9],
      [980, tweede lid][ref10] en [983 van Boek 7 van het Burgerlijk Wetboek][ref11] zijn niet van toepassing op
      verzekeringsovereenkomsten die worden gesloten in verband met een pensioenovereenkomst als bedoeld in deze wet of
      verzekeringsovereenkomsten die worden gesloten in verband met een rechtsbetrekking die op grond van deze wet is
      gelijkgesteld met een pensioenovereenkomst.

      2 Het verminderen of vervallen van een uitkering op grond van een verzekeringsovereenkomst als bedoeld in het
      eerste lid op basis van [artikel 930, derde tot en met vijfde lid, van Boek 7 van het Burgerlijk Wetboek][ref12]
      is niet mogelijk, tenzij door een persoon met wie een pensioenovereenkomst is gesloten of door een persoon voor wie
      een op grond van deze wet met de pensioenovereenkomst gelijkgestelde rechtsbetrekking geldt, niet is voldaan aan de
      in [artikel 928 van Boek 7 van het Burgerlijk Wetboek][ref13] omschreven mededelingsplicht betreffende zijn risico.
      In dat geval beperkt de vermindering of het verval van de uitkering zich tot het risico met betrekking tot de in
      de eerste zin bedoelde persoon. Voorzover de eerste zin in de weg staat aan vermindering dan wel verval van een
      uitkering, heeft het pensioenfonds of de verzekeraar een recht van verhaal op de werkgever.

      3 Een beding als bedoeld in [artikel 941, vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref14] is nietig
      wanneer dit is opgenomen in een verzekeringsovereenkomst als bedoeld in het eerste lid.

      4 Voor zover bepalingen van de [titels 17][ref15] en [18 van Boek 7 van het Burgerlijk Wetboek][ref16] in strijd
      zijn met het bij of krachtens deze wet bepaalde blijven die bepalingen van het [Burgerlijk Wetboek][ref17] buiten
      toepassing.


