  - number: 102a
    text: |-
      1 Het bestuur van een pensioenfonds draagt in overleg met de overige organen van het pensioenfonds zorg voor de
      vastlegging van de doelstellingen en beleidsuitgangspunten, waaronder de risicohouding, van het pensioenfonds.
      De organen van het pensioenfonds gebruiken deze doelstellingen en uitgangspunten bij de toetsing van de
      opdrachtaanvaarding van de door vertegenwoordigers van werkgevers of werkgeversverenigingen en werknemers
      of werknemersverenigingen overeengekomen pensioenregelingen, en bij de besluitvorming, de verantwoording, de
      advisering, en het toezicht binnen het pensioenfonds.

      2 Het bestuur van een pensioenfonds streeft er naar van de vertegenwoordigers, bedoeld in het eerste lid, zo
      veel mogelijk duidelijkheid te verkrijgen over de doelstellingen, het ambitieniveau van de toeslagverlening en
      de risicohouding, die ten grondslag liggen aan de pensioenregelingen die de vertegenwoordigers als opdracht in
      uitvoering aan het pensioenfonds geven.

      3 Het bestuur van een pensioenfonds draagt zorg voor de formele opdrachtaanvaarding van de door de
      vertegenwoordigers, bedoeld in het eerste lid, aan het pensioenfonds opgedragen pensioenregelingen. Het bestuur
      toetst bij de opdrachtaanvaarding voor het pensioenfonds als geheel en voor de relevante beleidsgebieden aan de
      doelstellingen en uitgangspunten, bedoeld in het eerste lid.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel102a
  - number: '103'
    text: |-
      1 Het intern toezicht bij een bedrijfstakpensioenfonds met een paritair of onafhankelijk bestuur wordt uitgeoefend
      door een raad van toezicht, tenzij het bedrijfstakpensioenfonds volledig is verzekerd bij een verzekeraar. In dat
      geval kan het intern toezicht ook worden uitgeoefend door jaarlijkse visitatie door een visitatiecommissie.

      2 Het intern toezicht bij een ondernemingspensioenfonds met een paritair of onafhankelijk bestuur wordt uitgeoefend
      door:

      a. een raad van toezicht of jaarlijkse visitatie door een visitatiecommissie indien het ondernemingspensioenfonds
      volledig is verzekerd bij een verzekeraar of een beheerd vermogen heeft van niet meer dan € 1 miljard; of

      b. een raad van toezicht indien het ondernemingspensioenfonds een beheerd vermogen heeft van meer dan € 1 miljard,
      tenzij het ondernemingspensioenfonds volledig verzekerd is bij een verzekeraar in welk geval het intern toezicht
      ook kan worden uitgeoefend door jaarlijkse visitatie als bedoeld in onderdeel a.

      3 Het intern toezicht bij een algemeen pensioenfonds met een paritair of onafhankelijk bestuur wordt uitgeoefend
      door een raad van toezicht.

      4 Het intern toezicht bij een pensioenfonds met een gemengd bestuur wordt uitgeoefend door de niet uitvoerende
      bestuurders.

      5 Voor de toepassing van het tweede lid:

      a. heeft een ondernemingspensioenfonds een beheerd vermogen van niet meer dan € 1 miljard indien het
      ondernemingspensioenfonds op twee opeenvolgende balansdata, zonder onderbreking nadien op twee opeenvolgende
      balansdata, een vermogen van niet meer dan € 1 miljard heeft; en

      b. wordt het intern toezicht bij een ondernemingspensioenfonds dat een raad van toezicht heeft ingesteld omdat het
      ondernemingspensioenfonds een beheerd vermogen van meer dan € 1 miljard heeft, ten minste vier jaar uitgeoefend
      door een raad van toezicht ook indien het beheerd vermogen in deze periode € 1 miljard of minder wordt.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel103
  - number: '104'
    text: |-
      1 De raad van toezicht of de visitatiecommissie bestaat uit ten minste drie natuurlijke personen. De leden van de
      raad van toezicht of de visitatiecommissie zijn onafhankelijk en laten dit tot uiting komen in het toezicht.

      2 De raad van toezicht heeft tot taak toezicht te houden op het beleid van het bestuur en op de algemene
      gang van zaken in het pensioenfonds. De raad van toezicht is ten minste belast met het toezien op adequate
      risicobeheersing en evenwichtige belangenafweging door het bestuur en legt verantwoording af over de uitvoering
      van de taken en de uitoefening van de bevoegdheden aan het verantwoordingsorgaan en de werkgever, het
      belanghebbendenorgaan en in het bestuursverslag. De raad van toezicht staat het bestuur met raad ter zijde.
      [Artikel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] is van overeenkomstige toepassing op de leden van de raad
      van toezicht.

      3 Aan de goedkeuring van de raad van toezicht zijn onderworpen de besluiten van het bestuur tot vaststelling van:

      a. het bestuursverslag en de jaarrekening;

      b. de profielschets voor bestuurders;

      c. het beleid inzake beloningen, met uitzondering van de beloning van de raad van toezicht;

      d. gehele of gedeeltelijke overdracht van de verplichtingen van het pensioenfonds of de overname van verplichtingen
      door het pensioenfonds;

      e. liquidatie, fusie of splitsing van het pensioenfonds;

      f. het beleid inzake het aangaan en beëindigen van uitvoeringsovereenkomsten en het opstellen en beëindigen van
      uitvoeringsreglementen door een algemeen pensioenfonds; en

      g. het omzetten van het pensioenfonds in een andere rechtsvorm, bedoeld in
      [artikel 18 van Boek 2 van het Burgerlijk Wetboek][ref2].

      4 De statuten voorzien in een regeling voor geschillen over goedkeuring van besluiten door de raad van toezicht.
      Het ontbreken van de goedkeuring van de raad van toezicht op een besluit als bedoeld in het derde lid tast de
      vertegenwoordigingsbevoegdheid van bestuur of bestuurders niet aan.

      5 De raad van toezicht meldt disfunctioneren van het bestuur aan het verantwoordingsorgaan, het
      belanghebbendenorgaan en aan de partij die bevoegd is tot benoeming van het bestuur. Indien de partij die
      bevoegd is tot benoeming van het bestuur naar aanleiding van de melding niet binnen een redelijke termijn, naar
      tevredenheid van de raad van toezicht, handelt, meldt de raad van toezicht het disfunctioneren van het bestuur aan
      De Nederlandsche Bank N.V.

      6 De raad van toezicht stelt een profielschets op voor leden van de raad van toezicht.

      7 Het bestuur van het pensioenfonds en de raad van toezicht komen ten minste tweemaal per kalenderjaar in
      vergadering bijeen.

      8 De visitatiecommissie heeft tot taak toezicht te houden op het beleid van het bestuur en op de algemene gang van
      zaken in het pensioenfonds. De visitatiecommissie is ten minste belast met het toezien op adequate risicobeheersing
      en evenwichtige belangenafweging door het bestuur en legt verantwoording af over de uitvoering van de taken aan het
      verantwoordingsorgaan en de werkgever, het belanghebbendenorgaan en in het bestuursverslag.

      9 Het pensioenfonds verstrekt desgevraagd aan de raad van toezicht of de visitatiecommissie tijdig alle
      inlichtingen en gegevens, die deze voor de vervulling van zijn taak redelijkerwijs nodig heeft. De inlichtingen
      worden desgevraagd schriftelijk verstrekt.

      10 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld inzake dit artikel die
      onder meer betrekking hebben op de bevoegdheden van de raad van toezicht ten aanzien van benoeming en ontslag van
      bestuurders.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel18
