  - number: 117a
    text: |-
      1 Bij algemene maatregel van bestuur worden regels gesteld over de uitvoering van een nettopensioen door een
      pensioenfonds.

      2 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel117a
  - number: '118'
    text: |-
      1 Een basispensioenregeling in de vorm van een uitkeringsovereenkomst welke wordt uitgevoerd door een pensioenfonds
      voldoet aan de volgende voorwaarden:

      a. de werkgever draagt ten minste 10 procent van de actuariële kosten van de basispensioenregeling bij; of

      b. de werknemerspremie voor de basispensioenregeling is voor alle deelnemers gelijk of bedraagt een gelijk
      percentage van het loon dan wel van het gedeelte van het loon dat voor de pensioenberekening in aanmerking wordt
      genomen, met dien verstande dat voor verschillende soorten pensioen en voor verschillende pensioenregelingen
      verschillende premies kunnen worden vastgesteld.

      2 Een vrijwillige pensioenregeling in de vorm van een uitkeringsovereenkomst welke wordt uitgevoerd door een
      pensioenfonds voldoet aan de volgende voorwaarden:

      a. de werkgever draagt ten minste 10 procent van de actuariële kosten van de vrijwillige pensioenregeling bij;

      b. de werknemerspremie voor de vrijwillige pensioenregeling is voor alle deelnemers gelijk of bedraagt een gelijk
      percentage van het loon dan wel van het gedeelte van het loon dat voor de pensioenberekening in aanmerking wordt
      genomen, met dien verstande dat voor verschillende soorten pensioen en voor verschillende pensioenregelingen
      verschillende premies kunnen worden vastgesteld; of

      c. de kosten verbonden aan het toeslagbeleid worden niet ten laste gebracht van de individuele deelnemers, maar ten
      laste van de collectiviteit van het pensioenfonds en voor de toeslagverlening gelden dezelfde voorwaarden die van
      toepassing zijn op de basispensioenregeling.

      3 Indien de vrijwillige pensioenregeling voldoet aan de voorwaarde, bedoeld in het tweede lid, onderdeel a, deelt
      het pensioenfonds dit schriftelijk aan de deelnemers en de toezichthouder mee.

      4 Het eerste lid is niet van toepassing op een verplichtgesteld bedrijfstakpensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel118
  - number: '119'
    text: |-
      1 Een basispensioenregeling in de vorm van een kapitaalovereenkomst welke wordt uitgevoerd door een pensioenfonds
      voldoet aan de volgende voorwaarden:

      a. de werkgever draagt ten minste 10 procent van de actuariële kosten van de basispensioenregeling bij; of

      b. de werknemerspremie voor de basispensioenregeling is voor alle deelnemers gelijk of bedraagt een gelijk
      percentage van het loon dan wel van het gedeelte van het loon dat voor de pensioenberekening in aanmerking wordt
      genomen, met dien verstande dat voor verschillende soorten pensioen en voor verschillende pensioenregelingen
      verschillende premies kunnen worden vastgesteld.

      2 Een vrijwillige pensioenregeling in de vorm van een kapitaalovereenkomst welke wordt uitgevoerd door een
      pensioenfonds voldoet aan de volgende voorwaarden:

      a. de werkgever draagt ten minste 10 procent van de actuariële kosten van de vrijwillige pensioenregeling bij; of

      b. indien de deelnemer overlijdt dan wel gepensioneerde of gewezen deelnemer wordt, wordt het opgebouwde kapitaal
      omgezet in een pensioenrecht of pensioenaanspraak in de vorm van een periodieke uitkering indien dat ook met
      betrekking tot de basispensioenregeling geschiedt of de basispensioenregeling een uitkeringsovereenkomst betreft
      en zijn daarop overeenkomstige voorwaarden van toepassing als welke gelden bij de basispensioenregeling bij
      beëindiging van de deelneming door deze omstandigheden.

      3 Indien de vrijwillige pensioenregeling voldoet aan de voorwaarde, bedoeld in het tweede lid, onderdeel a, deelt
      het pensioenfonds dit schriftelijk mee aan de deelnemers en de toezichthouder.

      4 Het eerste lid is niet van toepassing op een verplichtgesteld bedrijfstakpensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel119
  - number: '120'
    text: |-
      1 Voor een basispensioenregeling in de vorm van een premieovereenkomst welke wordt uitgevoerd door een
      pensioenfonds geldt dat de werkgeverspremie ten minste 10 procent van de premie van de basispensioenregeling
      bedraagt.

      2 Een vrijwillige pensioenregeling in de vorm van een premieovereenkomst welke wordt uitgevoerd door een
      pensioenfonds voldoet aan de volgende voorwaarden:

      a. de werkgever draagt ten minste 10 procent van de premie van de vrijwillige pensioenregeling bij;

      b. indien de deelnemer overlijdt dan wel gepensioneerde of gewezen deelnemer wordt, wordt het kapitaal dat
      is ontstaan uit de som van de beschikbaar gestelde premies en de daarop behaalde rendementen omgezet in een
      pensioenrecht of pensioenaanspraak in de vorm van een periodieke uitkering, indien dat ook met betrekking tot
      de basispensioenregeling geschiedt of de basispensioenregeling een uitkeringsovereenkomst betreft en zijn daarop
      overeenkomstige voorwaarden van toepassing als welke gelden bij de basispensioenregeling bij beëindiging van de
      deelneming door deze omstandigheden; of

      c. indien de deelnemer overlijdt dan wel gepensioneerde of gewezen deelnemer wordt, wordt het kapitaal dat is
      ontstaan uit de som van de beschikbaar gestelde premies en de daarop behaalde rendementen omgezet in een verzekerd
      kapitaal, indien dat ook met betrekking tot de basispensioenregeling geschiedt of de basispensioenregeling een
      kapitaalovereenkomst betreft en zijn daarop overeenkomstige voorwaarden van toepassing als welke gelden bij de
      basispensioenregeling bij beëindiging van de deelneming door deze omstandigheden.

      3 Indien de vrijwillige pensioenregeling voldoet aan de voorwaarde, bedoeld in het tweede lid, onderdeel a, deelt
      het pensioenfonds dit schriftelijk mee aan de deelnemers en de toezichthouder.

      4 Het eerste lid is niet van toepassing op een verplichtgesteld bedrijfstakpensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel120
  - number: '121'
    text: |-
      Een bedrijfstakpensioenfonds kan een uitvoeringsovereenkomst sluiten met een werkgever die niet onder
      de werkingssfeer van het bedrijfstakpensioenfonds valt, maar die zich op vrijwillige basis bij het
      bedrijfstakpensioenfonds wil aansluiten, indien:

      a. de loonontwikkeling bij deze werkgever ten minste gelijk is aan die in een bedrijfstak waarin het
      bedrijfstakpensioenfonds werkzaam is en de werkgever deelneemt in de sociale fondsen van dezelfde bedrijfstak;

      b. er sprake is van een groepsverhouding tussen de werkgever die zich vrijwillig wil aansluiten en een andere
      werkgever die onder de werkingssfeer van het bedrijfstakpensioenfonds valt; of

      c. dit aansluitend gebeurt aan een periode waarin de werkgever wel onder de werkingssfeer van het
      bedrijfstakpensioenfonds viel.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel121
  - number: 121a
    text: |-
      [Artikel 121][ref1] is van overeenkomstige toepassing bij uitbreiding van de werkingssfeer van een verplichtgesteld
      bedrijfstakpensioenfonds met een bedrijfstak of deel van een bedrijfstak waarbij deelneming aan het
      bedrijfstakpensioenfonds voor in die bedrijfstak werkzame personen niet verplicht is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel121
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel121a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '121'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '122'
    text: |-
      Indien een onderneming niet langer deel uitmaakt van een groep waaraan een ondernemingspensioenfonds verbonden
      is, of een groep die valt onder de werkingssfeer van een bedrijfstakpensioenfonds, kan dit pensioenfonds blijven
      optreden als pensioenuitvoerder voor deze onderneming, tenzij de onderneming onder de werkingssfeer van een
      verplichtgesteld bedrijfstakpensioenfonds valt.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel122
  - number: '123'
    text: |-
      1 Indien een ondernemingspensioenfonds of een bedrijfstakpensioenfonds meerdere pensioenregelingen uitvoert vormen
      deze pensioenregelingen financieel een geheel. Een algemeen pensioenfonds houdt een afgescheiden vermogen aan voor
      iedere collectiviteitkring.

      2 De werkingssfeer van de collectiviteitkring, bedoeld in het eerste lid, wordt vastgelegd in de statuten door
      omschrijving van de pensioenregelingen en vermelding van de uitvoeringsovereenkomsten of uitvoeringsreglementen die
      onderdeel uitmaken van de collectiviteitkring.

      3 Het vermogen voor een collectiviteitkring is een afgescheiden vermogen dat, onverminderd [artikel 129][ref1] en
      het vijfde lid, uitsluitend dient tot voldoening van vorderingen die voortvloeien uit:

      a. kosten die verband houden met de uitvoering van de pensioenregeling die volgens de uitvoeringsovereenkomst of
      het uitvoeringsreglement ten laste kunnen worden gebracht van het vermogen; en

      b. pensioenaanspraken en pensioenrechten van deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en
      pensioengerechtigden bij dat vermogen.

      4 Indien het afgescheiden vermogen bij vereffening ontoereikend is voor voldoening van de vorderingen, dient het
      vermogen ter voldoening van de vorderingen in de volgorde van het derde lid.

      5 In geval van een faillietverklaring van een algemeen pensioenfonds worden de boedelschulden, overeenkomstig de
      bepalingen van de [Faillissementswet][ref2], al naar gelang de aard van de betrokken boedelschuld hetzij omgeslagen
      over ieder deel van de boedel, hetzij uitsluitend van een bepaalde bate van de boedel afgetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0001860
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel123
    references:
