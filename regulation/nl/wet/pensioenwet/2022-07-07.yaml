    text: |-
      1 Onverminderd de [artikelen 80][ref1], [81][ref2] en [81a][ref3] is de pensioenuitvoerder bevoegd om op verzoek
      van de deelnemer, gewezen deelnemer of andere aanspraakgerechtigde de waarde van zijn pensioenaanspraken welke
      voortvloeien uit een kapitaalovereenkomst of een premieovereenkomst op de datum van omzetting van de aanspraken in
      een pensioenuitkering rechtstreeks over te dragen aan een andere pensioenuitvoerder indien:

      a. de pensioenovereenkomst hierin voorziet;

      b. de overdrachtswaarde zodanig door de overdragende pensioenuitvoerder wordt vastgesteld dat de voor mannen
      en vrouwen te verwerven pensioenrechten gelijk zijn waarbij aan het vereiste van collectieve actuariële
      gelijkwaardigheid op basis van dezelfde grondslagen wordt voldaan; en

      c. indien de ontvangende pensioenuitvoerder een pensioenfonds is, de deelnemer, gewezen deelnemer of andere
      aanspraakgerechtigde reeds aanspraken heeft jegens dit pensioenfonds.

      Indien het verzoek van de deelnemer of gewezen deelnemer tot waardeoverdracht partnerpensioen betreft is voor de
      waardeoverdracht van dit partnerpensioen tevens vereist dat de partner die begunstigde is voor het partnerpensioen
      met de waardeoverdracht instemt.

      2 [Artikel 80, derde tot en met zevende lid][ref4], en [artikel 81a, tweede lid, onderdeel b][ref5], zijn van
      overeenkomstige toepassing.


