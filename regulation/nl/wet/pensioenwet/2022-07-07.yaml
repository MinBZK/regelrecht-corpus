  - number: '147'
    text: |-
      1 Een pensioenfonds doet het boekjaar gelijk lopen met het kalenderjaar.

      2 Een pensioenfonds verstrekt periodiek binnen de daartoe vastgestelde termijnen staten aan de toezichthouder die
      de toezichthouder nodig heeft voor de juiste uitoefening van zijn taak, bedoeld in [artikel 151][ref1].

      3 De staten omvatten uitsluitend:

      a. informatie over de organisatie van het pensioenfonds;

      b. een bestuursverslag;

      c. een balans;

      d. informatie over financiële relaties en transacties van het pensioenfonds;

      e. een rekening van baten en lasten;

      f. informatie inzake de dekkingsgraad, de beleidsdekkingsgraad en de reële dekkingsgraad;

      g. informatie inzake het vereist eigen vermogen;

      h. actuariële staten, gewaarmerkt door een bevoegde actuaris, waaronder een actuarieel verslag voorzien van een
      verklaring van een actuaris;

      i. informatie over het deelnemersbestand;

      j. informatie inzake de uitgevoerde pensioenregeling en eventueel andere door het pensioenfonds uitgevoerde
      regelingen;

      k. premiegegevens;

      l. informatie inzake verzekering;

      m. informatie inzake verplichtingen van het pensioenfonds voor risico van de deelnemers;

      n. informatie over het herstelplan;

      o. informatie over de haalbaarheidstoets;

      p. informatie over toeslagverlening; en

      q. informatie over vermindering van pensioenaanspraken en pensioenrechten.

      4 Met zijn verklaring bedoeld in het derde lid, onderdeel h, bevestigt de actuaris dat hij zich ervan heeft
      overtuigd dat voldaan is aan de [artikelen 126 tot en met 140][ref2]. Hij is bevoegd zijn verklaring nader toe te
      lichten of op enig punt een voorbehoud te maken.

      5 De staten zijn periodiek voorzien van een verklaring omtrent de getrouwheid, afgegeven door een accountant. Ten
      bewijze dat de staten door hem zijn onderzocht, waarmerkt de accountant de staten.

      6 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:

      a. de inhoud en de modellen van de staten; en

      b. de wijze, de periodiciteit en de termijnen van de verstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel151
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel126
