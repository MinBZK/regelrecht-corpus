  - number: 90a
    text: |-
      1 Een pensioenfonds of premiepensioeninstelling is met inachtneming van [artikel 90][ref1] slechts bevoegd over
      te gaan tot collectieve waardeoverdracht naar een pensioeninstelling uit een andere lidstaat, indien de bevoegde
      autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar zetel heeft, goedkeuring hebben
      verleend voor de collectieve waardeoverdracht.

      2 Ten behoeve van een aanvraag tot goedkeuring van een collectieve waardeoverdracht als bedoeld in het eerste lid:

      a. stelt het pensioenfonds of de premiepensioeninstelling de informatie over de aan de voorgenomen collectieve
      waardeoverdracht verbonden voorwaarden tijdig ter beschikking aan de betrokken deelnemers, gewezen deelnemers en
      pensioengerechtigden, waarbij de deelnemers, gewezen deelnemers en pensioengerechtigden tevens worden geïnformeerd
      over het goedkeuringsrecht, bedoeld in onderdeel b, onder 1°; en

      b. is vereist dat:

      1°. een tweederdemeerderheid van de deelnemers en gewezen deelnemers en een tweederdemeerderheid van de
      pensioengerechtigden die hebben gereageerd op een daartoe strekkend schriftelijk verzoek het voorgenomen besluit
      met betrekking tot de collectieve waardeoverdracht hebben goedgekeurd; en

      2°. indien van toepassing, de werkgever het voorgenomen besluit met betrekking tot de collectieve waardeoverdracht
      heeft goedgekeurd.

      3 De bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar zetel
      heeft kunnen alleen goedkeuring verlenen voor de collectieve waardeoverdracht indien de toezichthouder die
      bevoegde autoriteiten heeft meegedeeld toestemming te verlenen voor de collectieve waardeoverdracht. De
      [artikelen 83, tweede lid, onderdeel c][ref2], en [84, tweede lid, onderdeel a][ref3], zijn niet van toepassing.

      4 De toezichthouder verleent alleen toestemming voor de collectieve waardeoverdracht, indien:

      a. in geval van een gedeeltelijke collectieve waardeoverdracht de langetermijnbelangen van de deelnemers, gewezen
      deelnemers, andere aanspraakgerechtigden en pensioengerechtigden van het resterende deel van de pensioenregeling
      afdoende worden beschermd;

      b. de individuele pensioenaanspraken en pensioenrechten van de deelnemers, gewezen deelnemers, andere
      aanspraakgerechtigden en pensioengerechtigden na de collectieve waardeoverdracht minstens gelijk blijven; en

      c. de met de over te dragen pensioenregeling overeenkomende activa toereikend en passend zijn om de over te dragen
      passiva, technische voorzieningen en andere verplichtingen en rechten te dekken.

      5 De toezichthouder deelt de resultaten van zijn beoordeling binnen acht weken na ontvangst van de aanvraag tot
      goedkeuring met de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar
      zetel heeft.

      6 Indien de collectieve waardeoverdracht in een grensoverschrijdende activiteit resulteert, informeert de
      toezichthouder de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar
      zetel heeft binnen vier weken na ontvangst van het besluit waarmee goedkeuring wordt verleend voor de collectieve
      waardeoverdracht over de bepalingen van de Nederlandse sociale en arbeidswetgeving die van toepassing zijn op
      de pensioenregeling waarvan de waarde is overgedragen. De [artikelen 200, tweede lid][ref4], [201][ref5] en
      [202][ref6] zijn van overeenkomstige toepassing.

      7 De kosten van de collectieve waardeoverdracht komen niet ten laste van de bij het pensioenfonds of
      de premiepensioeninstelling resterende deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en
      pensioengerechtigden.

      8 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit
      artikel.


