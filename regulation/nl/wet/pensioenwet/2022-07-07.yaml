  - number: 115g
    text: |-
      1 Een pensioenfonds staat de leden van het verantwoordingsorgaan of het belanghebbendenorgaan het gebruik toe van
      de voorzieningen waarover het kan beschikken, voor zover dat redelijkerwijs voor de vervulling van hun taken nodig
      is.

      2 Ten aanzien van de rechten en bevoegdheden van het verantwoordingsorgaan of het belanghebbendenorgaan in
      verhouding tot het bestuur van het pensioenfonds zijn de [artikelen 10][ref1], [16][ref2], [17][ref3], [18][ref4]
      en [22 van de Wet op de ondernemingsraden][ref5] van overeenkomstige toepassing.


