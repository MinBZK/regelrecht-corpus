  - number: 112a
    text: |-
      1 Het is verboden zonder een daartoe door de toezichthouder verleende vergunning in Nederland het bedrijf van een
      algemeen pensioenfonds uit te oefenen.

      2 De toezichthouder verleent op aanvraag een vergunning als bedoeld in het eerste lid indien de aanvrager zetel
      heeft in Nederland en aantoont dat zal worden voldaan aan:

      a. het achtste lid en de [artikelen 33][ref1] en [34][ref2];

      b. een van de [artikelen 100][ref3], [101][ref4] of [101a][ref5]; en

      c. de [artikelen 102a][ref6], [103, derde of vierde lid][ref7], [104][ref8], [105, eerste lid][ref9], [106][ref10],
      [106a][ref11], [111][ref12] en [143][ref13].

      3 De aanvraag van de vergunning geschiedt onder opgave van bij of krachtens algemene maatregel van bestuur te
      bepalen gegevens.

      4 Aan de vergunning kunnen voorschriften worden verbonden en beperkingen worden gesteld met het oog op de belangen
      die deze wet beoogt te beschermen.

      5 De toezichthouder kan de door hem verleende vergunning wijzigen of intrekken.

      6 De vergunning is persoonlijk en niet overdraagbaar.

      7 Een algemeen pensioenfonds meldt binnen drie maanden aan de toezichthouder:

      a. dat gestart is met het gebruikmaken van de vergunning; en

      b. het aanhouden van een nieuw afgescheiden vermogen.

      [Artikel 112, derde lid][ref14], is van overeenkomstige toepassing bij deze meldingen.

      8 Een algemeen pensioenfonds beschikt over voldoende weerstandsvermogen.

      9 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel die
      onder meer betrekking hebben op de aanvraag, de procedure, de omstandigheden die kunnen leiden tot het wijzigen of
      intrekken van de vergunning en het weerstandsvermogen.


