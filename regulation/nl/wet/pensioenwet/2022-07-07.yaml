  - number: '131'
    text: |-
      1 Een pensioenfonds beschikt over een minimaal vereist eigen vermogen, tenzij:

      a. een pensioenfonds tot volledige overdracht of onderbrenging is overgegaan; en

      b. de toezichthouder heeft ingestemd met het feit dat het pensioenfonds daarom niet beschikt over een minimaal
      vereist eigen vermogen.

      2 Bij of krachtens algemene maatregel van bestuur worden de omvang en de samenstelling van het minimaal vereist
      eigen vermogen bepaald.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel131
  - number: '132'
    text: |-
      1 Een pensioenfonds beschikt over een vereist eigen vermogen.

      2 Een pensioenfonds stelt het vereist eigen vermogen zodanig vast dat met een zekerheid van 971/2 procent wordt
      voorkomen dat het pensioenfonds binnen een periode van één jaar over minder waarden beschikt dan de hoogte van de
      technische voorzieningen.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld inzake de berekening en de
      samenstelling van het vereist eigen vermogen, bedoeld in het eerste lid, en het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel132
  - number: '133'
    text: De technische voorzieningen en de aan het pensioenfonds verstrekte leningen worden volledig door waarden gedekt.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel133
  - number: 133a
    text: |-
      1 De beleidsdekkingsgraad van een pensioenfonds is de gemiddelde dekkingsgraad van de 12 maanden voorafgaand aan
      het moment van vaststelling.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de
      beleidsdekkingsgraad en het moment van vaststelling van de beleidsdekkingsgraad.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel133a
  - number: 133b
    text: |-
      1 Een pensioenfonds is verplicht om jaarlijks de hoogte van de reële dekkingsgraad van het pensioenfonds aan de
      toezichthouder te melden.

      2 Bij regeling van Onze Minister worden regels gesteld over de reële dekkingsgraad.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel133b
  - number: '134'
    text: |-
      1 Een pensioenfonds kan verworven pensioenaanspraken en pensioenrechten uitsluitend verminderen indien:

      a. het pensioenfonds gezien de beleidsdekkingsgraad niet voldoet aan de bij of krachtens [artikel 131][ref1]
      gestelde eisen ten aanzien van het minimaal vereist eigen vermogen of de bij of krachtens [artikel 132][ref2]
      gestelde eisen ten aanzien van het vereist eigen vermogen;

      b. het pensioenfonds niet in staat is binnen een redelijke termijn te voldoen aan [artikel 131][ref3] of
      [artikel 132][ref4] zonder dat de belangen van deelnemers, gewezen deelnemers, pensioengerechtigden, andere
      aanspraakgerechtigden of de werkgever onevenredig worden geschaad; en

      c. alle overige beschikbare sturingsmiddelen, met uitzondering van het beleggingsbeleid, zijn ingezet in het
      herstelplan, bedoeld in [artikel 138][ref5] of [artikel 139][ref6].

      2 Een pensioenfonds informeert de deelnemers, gewezen deelnemers, pensioengerechtigden en de werkgever onverwijld
      schriftelijk over het besluit tot vermindering van pensioenaanspraken en pensioenrechten.

      3 De vermindering, bedoeld in het eerste lid, kan op zijn vroegst drie maanden nadat de pensioengerechtigden
      hierover zijn geïnformeerd en een maand nadat de deelnemers, gewezen deelnemers, werkgever en toezichthouder
      hierover zijn geïnformeerd, worden gerealiseerd.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit
      artikel.


