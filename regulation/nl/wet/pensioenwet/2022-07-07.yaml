    text: |-
      Een pensioenuitvoerder vermeldt in zijn bestuursverslag of in het afgelopen boekjaar:

      a. aan de pensioenuitvoerder dwangsommen en bestuurlijke boeten zijn opgelegd, en zo ja, hoeveel deze in totaal
      hebben bedragen;

      b. een aanwijzing als bedoeld in [artikel 171][ref1] aan de pensioenuitvoerder is gegeven;

      c. een bewindvoerder als bedoeld in [artikel 173][ref2] is aangesteld;

      d. een herstelplan als bedoeld in [artikel 138][ref3] of [artikel 139][ref4] van toepassing is;

      e. de beëindiging van de situatie, bedoeld in [artikel 172][ref5], waarin de bevoegdheidsuitoefening van alle of
      bepaalde organen van een pensioenfonds is gebonden aan toestemming van de toezichthouder.


