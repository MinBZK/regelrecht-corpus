  - number: 115c
    text: |-
      1 Het belanghebbendenorgaan adviseert het pensioenfonds desgevraagd of uit eigen beweging over aangelegenheden die
      het pensioenfonds betreffen.

      2 Het pensioenfonds stelt het belanghebbendenorgaan in ieder geval in de gelegenheid advies uit te brengen over elk
      voorgenomen besluit van het pensioenfonds met betrekking tot:

      a. het nemen van maatregelen van algemene strekking;

      b. wijziging van de statuten en reglementen van het pensioenfonds;

      c. vaststelling van het bestuursverslag, de jaarrekening en de actuariële en bedrijfstechnische nota, bedoeld in
      [artikel 145][ref1];

      d. het sluiten, wijzigen of beëindigen van een uitvoeringsovereenkomst;

      e. een overeenkomst van uitbesteding;

      f. het beleid inzake beloningen;

      g. de vorm en inrichting van het intern toezicht;

      h. de profielschets voor leden van de raad van toezicht;

      i. het vaststellen en wijzigen van een interne klachten- en geschillenprocedure; en

      j. het vaststellen en wijzigen van het communicatie- en voorlichtingsbeleid.

      3 Het advies van het belanghebbendenorgaan wordt op een zodanig tijdstip gevraagd dat het van wezenlijke invloed
      kan zijn op de in het tweede lid bedoelde besluiten.

      4 Het belanghebbendenorgaan adviseert het bestuur naar aanleiding van de melding van disfunctioneren van het
      bestuur, bedoeld in [artikel 104, vijfde lid][ref2].

      5 Bij het vragen van advies wordt aan het belanghebbendenorgaan een overzicht verstrekt van de beweegredenen
      voor het besluit en van de gevolgen die het besluit naar verwachting voor de deelnemers, gewezen deelnemers en
      pensioengerechtigden zal hebben.

      6 Het bestuur van het pensioenfonds legt verantwoording af aan het belanghebbendenorgaan over het beleid en de
      wijze waarop het is uitgevoerd.

      7 Het belanghebbendenorgaan heeft de bevoegdheid een oordeel te geven over het handelen van het bestuur aan de hand
      van het bestuursverslag, de jaarrekening en andere informatie, waaronder de bevindingen van het intern toezicht,
      over het door het bestuur uitgevoerde beleid, evenals over beleidskeuzes voor de toekomst. Dit oordeel wordt, samen
      met de reactie van het bestuur daarop, bekend gemaakt en in het bestuursverslag opgenomen.

      8 Besluiten van het bestuur kunnen bij of krachtens de statuten worden onderworpen aan de goedkeuring van het
      belanghebbendenorgaan, voor zover uit de wet niet anders voortvloeit. De statuten voorzien in een regeling voor
      geschillen over goedkeuring van besluiten door het belanghebbendenorgaan.

      9 Het bestuur heeft in ieder geval goedkeuring nodig van het belanghebbendenorgaan voor elk voorgenomen besluit met
      betrekking tot:

      a. gehele of gedeeltelijke overdracht van de verplichtingen van het pensioenfonds of de overname van verplichtingen
      door het pensioenfonds;

      b. liquidatie, fusie of splitsing van het pensioenfonds;

      c. het omzetten van het pensioenfonds in een andere rechtsvorm, bedoeld in
      [artikel 18 van Boek 2 van het Burgerlijk Wetboek][ref3];

      d. wijziging van de collectiviteitkring;

      e. het strategische beleggingsbeleid;

      f. de premie, waaronder mede wordt begrepen de samenstelling van de feitelijke premie en de hoogte van de
      premiecomponenten;

      g. het vaststellen en wijzigen van het toeslagbeleid;

      h. vaststelling van een herstelplan als bedoeld in [artikel 138][ref4] of [artikel 139][ref5];

      i. het terugstorten van premie of geven van premiekorting, bedoeld in [artikel 129][ref6]; en

      j. vermindering van de verworven pensioenaanspraken en pensioenrechten indien toepassing wordt gegeven aan
      [artikel 134][ref7].

      De goedkeuring wordt niet onthouden dan nadat het bestuur in de gelegenheid is gesteld het besluit te heroverwegen.

      10 Het ontbreken van de goedkeuring van het belanghebbendenorgaan op een besluit als bedoeld in het achtste of
      negende lid tast de vertegenwoordigingsbevoegdheid van bestuur of bestuurders niet aan.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel145
