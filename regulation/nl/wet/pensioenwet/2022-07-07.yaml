  - number: 190a
    text: |-
      1 De toezichthouder beëindigt het openbaar beschikbaar houden van informatie onverwijld indien het besluit tot
      openbaarmaking, bedoeld in [artikel 189][ref1], wordt ingetrokken of door de bestuursrechter onherroepelijk is
      vernietigd.

      2 In de gevallen, bedoeld in het eerste lid, biedt de toezichthouder de belanghebbende aan de intrekking of de
      vernietiging openbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel189
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel190a
