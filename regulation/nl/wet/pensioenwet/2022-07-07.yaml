  - number: '210'
    text: |-
      De toezichthouder beheert een register waarin alle pensioenfondsen met zetel in Nederland worden ingeschreven. In
      het register wordt, indien van toepassing, vermeld in welke lidstaten een fonds pensioenregelingen uitvoert.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel210
  - number: '211'
    text: |-
      De toezichthouder is verplicht nauw samen te werken met de Europese Commissie en de bevoegde autoriteiten uit
      andere lidstaten dan Nederland, overeenkomstig [richtlijn 2016/2341](32016L2341)/EU.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel211
  - number: '212'
    text: |-
      1 De toezichthouder kan desgevraagd in bijzondere gevallen van het bepaalde bij of krachtens
      [artikel 147, eerste en tweede lid][ref1], ontheffing verlenen, indien hij van oordeel is, dat de belangen van de
      personen die betrokken zijn bij een pensioenregeling voldoende gewaarborgd zijn.

      2 De toezichthouder kan desgevraagd in bijzondere gevallen van het bepaalde bij of krachtens de
      [artikelen 99 tot en met 102][ref2], [115, eerste lid][ref3], en [115b, eerste lid][ref4] ontheffing verlenen,
      indien het pensioenfonds ook pensioenregelingen uitvoert waarop de sociale en arbeidswetgeving van een andere
      lidstaat van toepassing is.

      3 De ontheffing wordt verleend bij beschikking.


