  - number: '64'
    text: |-
      1 Vervreemding of elke andere handeling, waardoor de aanspraakgerechtigde of de pensioengerechtigde enig recht op
      zijn pensioenaanspraken of pensioenrechten aan een ander toekent is nietig, tenzij:

      a. verpanding plaatsvindt voor het verlenen van zekerheid voor het verkrijgen van uitstel van betaling als bedoeld
      in [artikel 25, vijfde lid, van de Invorderingswet 1990][ref1];

      b. vervreemding plaatsvindt op grond van [artikel 57, vijfde lid][ref2];

      c. verevening plaatsvindt op basis van de [Wet verevening pensioenrechten][ref3] bij scheiding;

      d. in het kader van een verrekening van pensioenrechten bij scheiding in plaats van de aanspraakgerechtigde of de
      pensioengerechtigde diens gewezen partner respectievelijk diens partner wordt aangewezen als begunstigde voor het
      geheel of een deel van het ouderdomspensioen, mits de pensioenuitvoerder hiermee instemt; of

      e. in het kader van een verrekening van pensioenrechten bij scheiding de waarde van het geheel of een deel van
      het ouderdomspensioen van de aanspraakgerechtigde of de pensioengerechtigde bij dezelfde pensioenuitvoerder wordt
      aangewend voor een ouderdomspensioen op het leven van diens gewezen partner respectievelijk diens partner, mits de
      pensioenuitvoerder hiermee instemt.

      2 Een volmacht tot invordering van uitkeringen uit hoofde van een pensioenrecht, onder welke vorm of welke benaming
      ook verleend, is steeds herroepelijk.


