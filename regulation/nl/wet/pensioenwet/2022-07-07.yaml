      1 Deze wet is met uitzondering van de [artikelen 7][ref1] en [9][ref2] van overeenkomstige toepassing op de
      persoon die geen werkgever of werknemer is, die in een arbeidsverhouding werkt waarbij tegen beloning persoonlijke
      arbeid wordt verricht en die onder de werkingssfeer valt van een door een verplichtgesteld bedrijfstakpensioenfonds
      uitgevoerde pensioenregeling.

      2 Deze wet is met uitzondering van de [artikelen 7][ref3] en [9][ref4] van overeenkomstige toepassing op de
      persoon die als zelfstandige onder de werkingssfeer valt van een door een verplichtgesteld bedrijfstakpensioenfonds
      uitgevoerde pensioenregeling.


