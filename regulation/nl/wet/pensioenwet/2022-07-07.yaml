  - number: '44'
    text: |-
      1 De pensioenuitvoerder verstrekt de pensioengerechtigde jaarlijks:

      a. een opgave van zijn pensioenrecht;

      b. een opgave van de opgebouwde aanspraken op nabestaandenpensioen wanneer de pensioenregeling daarin voorziet;

      c. informatie over toeslagverlening;

      d. informatie over vermindering van pensioenaanspraken en pensioenrechten op grond van [artikel 134][ref1];

      e. informatie over garanties; en

      f. informatie over het land waar het pensioen is ondergebracht en de toezichthouder waar het pensioen onder valt.

      2 De pensioenuitvoerder informeert de pensioengerechtigde binnen drie maanden na een voor hem relevante wijziging
      in het pensioenreglement over die wijziging en de mogelijkheid om het gewijzigde pensioenreglement op te vragen bij
      de pensioenuitvoerder.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid
      bedoelde opgaven en informatie en de wijze waarop deze worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '134'
        hoofdstuk: '6'
  - number: 44a
    text: |-
      1 De pensioenuitvoerder die bereid is op te treden als ontvangende pensioenuitvoerder informeert degene die het
      uit een kapitaalovereenkomst of premieovereenkomst voortvloeiende kapitaal op de pensioendatum wenst aan te wenden
      voor een variabele uitkering over de voor hem relevante gevolgen en risico’s bij een variabele uitkering waaronder
      een opgave van de hoogte van de variabele uitkeringen en een opgave van de hoogte van de vastgestelde uitkeringen
      indien het kapitaal daarvoor zou worden aangewend. Deze opgaven worden, voor zover het ouderdomspensioen betreft,
      tevens weergegeven op basis van een pessimistisch scenario, een verwacht scenario en een optimistisch scenario. De
      pensioenuitvoerder die een spreidingsperiode van langer dan vijf jaar aanbiedt, informeert de deelnemer expliciet
      over de voor hem relevante gevolgen en risico’s daarvan.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de te verstrekken informatie, de rekenregels en de wijze waarop de informatie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel44a
  - number: '45'
    text: |-
      1 De pensioenuitvoerder informeert een deelnemer voorafgaand aan de deelneming in de vrijwillige pensioenregeling
      over:

      a. de inhoud van de vrijwillige pensioenregeling;

      b. een opgave van de reglementair te bereiken pensioenaanspraken uit hoofde van de vrijwillige pensioenregeling;

      c. de toeslagverlening;

      d. vermindering van pensioenaanspraken en pensioenrechten op grond van [artikel 134][ref1];

      e. voor zover van toepassing, informatie over beleggingsresultaten; en

      f. voor zover van toepassing, informatie over de structuur van de kosten die door deelnemers, gewezen deelnemers en
      pensioengerechtigden worden gedragen.

      2 De opgave van de reglementair te bereiken pensioenaanspraken wordt, voor zover het ouderdomspensioen betreft,
      tevens weergegeven op basis van een pessimistisch scenario, een verwacht scenario en een optimistisch scenario.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de te hanteren rekenregels.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '134'
        hoofdstuk: '6'
  - number: 45a
    text: |-
      1 Een pensioenfonds neemt in zijn bestuursverslag informatie op over de uitvoeringskosten over het verslagjaar,
      waarbij worden onderscheiden: administratieve uitvoeringskosten, de kosten van vermogensbeheer en transactiekosten.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel45a
  - number: '46'
    text: |-
      1 De pensioenuitvoerder verstrekt de deelnemer, de gewezen deelnemer, de gewezen partner of de pensioengerechtigde
      op verzoek:

      a. informatie over de gehanteerde aannamen bij de weergave van ouderdomspensioen op basis van een pessimistisch
      scenario, een verwacht scenario en een optimistisch scenario;

      b. de voor hem relevante informatie over beleggingen; en

      c. informatie over andere bij algemene maatregel van bestuur te bepalen onderwerpen.

      2 De pensioenuitvoerder verstrekt de deelnemer, de gewezen deelnemer of de gewezen partner op verzoek informatie
      die specifiek voor hem relevant is waaronder een indicatie van het mogelijk te bereiken kapitaal op de
      pensioendatum bij premieovereenkomsten waarbij de premie wordt belegd en een indicatie van de hoogte van de in
      te kopen periodieke uitkeringen bij aanwending van het mogelijk te bereiken kapitaal bij kapitaalovereenkomsten
      en premieovereenkomsten.

      3 De indicaties, bedoeld in het tweede lid, worden, voor zover het ouderdomspensioen betreft, tevens weergegeven op
      basis van een pessimistisch scenario, een verwacht scenario en een optimistisch scenario.

      4 De pensioenuitvoerder verstrekt de gewezen partner op verzoek de informatie in [artikel 42, eerste lid][ref1].

      5 De pensioenuitvoerder verstrekt de pensioengerechtigde op verzoek een opgave van zijn pensioenrecht, waarbij
      deze gegevens voor zover het ouderdomspensioen betreft, tevens weergegeven worden op basis van een pessimistisch
      scenario, een verwacht scenario en een optimistisch scenario.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de te hanteren rekenregels.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel42
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel46
