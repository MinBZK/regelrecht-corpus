  - number: '91'
    text: |-
      1 Indien een pensioenuitvoerder het verzoek krijgt om in het kader van waardeoverdracht een waarde van een
      pensioeninstelling uit een andere lidstaat of een verzekeraar met zetel buiten Nederland aan te nemen die verband
      houdt met een pensioenovereenkomst waarop deze wet tot het tijdstip van waardeoverdracht niet van toepassing is, is
      de pensioenuitvoerder gehouden daarvoor als ontvangende pensioenuitvoerder op te treden, mits:

      a. die waardeoverdracht ertoe strekt het de verzoekende werknemer mogelijk te maken pensioenaanspraken te verwerven
      bij de ontvangende pensioenuitvoerder;

      b. op de pensioenuitvoerder de in [artikel 72][ref1] genoemde omstandigheden niet van toepassing zijn; en

      c. aan de pensioenuitvoerder geen voorwaarden in verband met de waardeoverdracht worden gesteld die in strijd zijn
      met deze wet.

      Indien het verzoek tot waardeoverdracht partnerpensioen betreft is voor de waardeoverdracht van dit partnerpensioen
      tevens vereist dat de partner die begunstigde is voor het partnerpensioen met de waardeoverdracht instemt.

      2 De ontvangende pensioenuitvoerder brengt in het kader van de waardeoverdracht geen kosten in rekening bij de
      deelnemer.


