      1 De pensioenuitvoerder is verplicht om na een verzoek van de gewezen deelnemer tot waardeoverdracht de
      overdrachtswaarde van diens pensioenaanspraken over te dragen aan een pensioeninstelling uit een andere lidstaat of
      een verzekeraar met een zetel buiten Nederland als bedoeld in [artikel 23, eerste lid][ref1], indien voldaan wordt
      aan de in [artikel 71][ref2] genoemde voorwaarden, met dien verstande dat de in [artikel 72][ref3] gestelde eis
      inzake de ontvangende pensioenuitvoerder niet van toepassing is, en mits:

      a. de tot verevening gerechtigde echtgenoot, bedoeld in
      [artikel 2 van de Wet verevening pensioenrechten bij scheiding][ref4], met de waardeoverdracht instemt; en

      b. de mogelijkheden tot afkoop van de waarde van de overgedragen pensioenaanspraken na de waardeoverdracht niet
      ruimer zijn dan op basis van deze wet.

      2 Indien op grond van de in [artikel 72][ref5] genoemde omstandigheden tijdelijk geen plicht tot waardeoverdracht
      bestaat, maar deze plicht overeenkomstig [artikel 74][ref6] herleeft, is [artikel 74, derde lid][ref7], niet van
      toepassing.

      3 De overdragende pensioenuitvoerder brengt in het kader van de waardeoverdracht geen kosten in rekening bij de
      gewezen deelnemer.


