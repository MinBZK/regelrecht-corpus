  - number: 115d
    text: |-
      In de statuten van het pensioenfonds kunnen aan het verantwoordingsorgaan of het belanghebbendenorgaan verdere
      bevoegdheden dan de in deze wet genoemde worden toegekend.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel115d
  - number: 115e
    text: |-
      Het pensioenfonds deelt het verantwoordingsorgaan of het belanghebbendenorgaan zo spoedig mogelijk schriftelijk
      mee, of het een advies niet of niet geheel volgt, waarbij tevens wordt meegedeeld waarom van het advies of van een
      daarin vervat minderheidsadvies wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel115e
  - number: 115f
    text: |-
      Een pensioenfonds informeert het verantwoordingsorgaan of het belanghebbendenorgaan onverwijld schriftelijk over:

      a. de verplichting tot opstelling van een herstelplan als bedoeld in [artikel 138][ref1] of [artikel 139][ref2];

      b. de aanstelling van een bewindvoerder als bedoeld in [artikel 173][ref3]; en

      c. de beëindiging van de situatie, bedoeld in [artikel 172][ref4], waarin de bevoegdheiduitoefening van alle
      of bepaalde organen van een pensioenfonds is gebonden aan toestemming van een of meer door de toezichthouder
      aangewezen personen.


