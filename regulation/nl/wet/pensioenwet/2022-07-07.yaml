  - number: '205'
    text: |-
      1 De toezichthouder kan, in afwijking van [artikel 204, eerste lid][ref1], vertrouwelijke gegevens of inlichtingen
      verkregen bij de uitvoering van zijn taak op grond van deze wet, verstrekken aan de andere toezichthouder of een
      toezichthoudende instantie, tenzij:

      a. het doel waarvoor de vertrouwelijke gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;

      b. het beoogde gebruik van de vertrouwelijke gegevens of inlichtingen niet past in het kader van het toezicht op
      pensioenuitvoerders;

      c. de verstrekking van de vertrouwelijke gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of
      de openbare orde;

      d. de geheimhouding van de vertrouwelijke gegevens of inlichtingen niet in voldoende mate is gewaarborgd;

      e. de verstrekking van de vertrouwelijke gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen
      met de belangen die deze wet beoogt te beschermen; of

      f. onvoldoende is gewaarborgd dat de vertrouwelijke gegevens of inlichtingen niet zullen worden gebruikt voor een
      ander doel dan waarvoor deze worden verstrekt.

      2 Voorzover de gegevens of inlichtingen, bedoeld in het eerste lid, zijn verkregen van een toezichthoudende
      instantie, verstrekt de toezichthouder deze niet aan de andere toezichthouder of aan een andere toezichthoudende
      instantie, tenzij de toezichthoudende instantie waarvan de gegevens of inlichtingen zijn verkregen uitdrukkelijk
      heeft ingestemd met de verstrekking van de gegevens of inlichtingen en in voorkomend geval heeft ingestemd met het
      gebruik voor een ander doel dan waarvoor de gegevens of inlichtingen zijn verstrekt.

      3 Indien een toezichthoudende instantie aan de toezichthouder die de vertrouwelijke gegevens of inlichtingen op
      grond van het eerste of tweede lid heeft verstrekt, verzoekt om die vertrouwelijke gegevens of inlichtingen te
      mogen gebruiken voor een ander doel dan waarvoor zij zijn verstrekt, willigt de toezichthouder dat verzoek slechts
      in:

      a. indien het beoogde gebruik niet in strijd is met het eerste of tweede lid; of

      b. voorzover die toezichthoudende instantie op een andere wijze dan in deze wet voorzien vanuit Nederland met
      inachtneming van de daarvoor geldende wettelijke procedures voor dat andere doel de beschikking over die gegevens
      of inlichtingen zou kunnen verkrijgen; en

      c. na overleg met Onze Minister van Veiligheid en Justitie indien het in de aanhef bedoelde verzoek betrekking
      heeft op een onderzoek naar strafbare feiten.

      4 De Autoriteit Financiële Markten dan wel het organisatieonderdeel van de Nederlandsche Bank N.V. dat is belast
      met de in [artikel 151, derde lid][ref2], genoemde taak kan vertrouwelijke informatie of gegevens verstrekken aan
      het organisatieonderdeel van de Nederlandsche Bank N.V. dat is belast met het vervullen van haar monetaire taak,
      voorzover de vertrouwelijke gegevens of inlichtingen dienstig zijn voor de uitoefening van die taak.

      5 Het eerste tot en met derde lid is van overeenkomstige toepassing op het uitwisselen van vertrouwelijke gegevens
      of inlichtingen tussen de met verschillende taken belaste organisatieonderdelen van de toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel204
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel151
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel205
