        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 72a
    text: |-
      1 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de tijdelijke inperking van de in
      [artikel 71][ref1] genoemde plicht tot waardeoverdracht in verband met aanvullende bijdragen van de oude of de
      nieuwe werkgever.

      2 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
