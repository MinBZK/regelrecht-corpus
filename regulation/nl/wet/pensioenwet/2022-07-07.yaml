  - number: '171'
    text: |-
      1 De toezichthouder kan een pensioenuitvoerder die niet voldoet aan hetgeen bij of krachtens deze wet is bepaald,
      door middel van het geven van een aanwijzing verplichten om binnen een door de toezichthouder gestelde redelijke
      termijn ten aanzien van in de aanwijzingsbeschikking aangegeven punten een bepaalde gedragslijn te volgen.

      2 De toezichthouder kan een aanwijzing als bedoeld in het eerste lid eveneens aan een pensioenfonds geven
      indien hij tekenen ontwaart van een ontwikkeling die het eigen vermogen, de solvabiliteit, de liquiditeit of de
      bedrijfsvoering van het pensioenfonds in gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel171
  - number: '172'
    text: |-
      1 De toezichthouder kan besluiten een of meer personen te benoemen als curator ten aanzien van alle of bepaalde
      organen van het pensioenfonds indien dat pensioenfonds niet voldoet aan hetgeen ingevolge deze wet is bepaald.

      2 Het besluit ingevolge het eerste lid wordt slechts genomen:

      a. nadat door het pensioenfonds niet of niet volledig binnen de gestelde termijn aan een aanwijzing als bedoeld in
      [artikel 171][ref1] gevolg is gegeven;

      b. indien de in het eerste lid bedoelde overtreding een adequate functionering van het pensioenfonds ernstig in
      gevaar brengt en dat pensioenfonds voorafgaand in de gelegenheid is gesteld zijn zienswijze naar voren te brengen
      over het voorgenomen besluit; of

      c. indien de in het eerste lid bedoelde overtreding de belangen van de aanspraak- en pensioengerechtigden ernstig
      in gevaar brengt en dat pensioenfonds voorafgaand in de gelegenheid is gesteld zijn zienswijze naar voren te
      brengen over het voorgenomen besluit.

      3 Onverminderd het eerste en tweede lid kan de toezichthouder besluiten een of meer personen te benoemen als
      curator ten aanzien van alle of bepaalde organen of vertegenwoordigers van een pensioenfonds indien hij bij dat
      pensioenfonds tekenen ontwaart van een ontwikkeling die het eigen vermogen, de solvabiliteit, of de liquiditeit van
      dat pensioenfonds in gevaar kunnen brengen.

      4 Het benoemingsbesluit bevat onder meer een beschrijving van de belangen waardoor de curator zich dient te
      laten leiden. De toezichthouder benoemt de curator voor ten hoogste twee jaren, met de mogelijkheid om deze
      termijn telkens voor ten hoogste een jaar te verlengen; de verlenging wordt terstond van kracht. Met ingang van
      het tijdstip waarop het besluit tot benoeming van de curator aan het pensioenfonds is bekendgemaakt mogen de
      desbetreffende organen of vertegenwoordigers hun bevoegdheden slechts uitoefenen na goedkeuring door de curator en
      met inachtneming van de opdrachten van de curator.

      5 Na de benoeming van een curator:

      a. verlenen de organen en de vertegenwoordigers van het pensioenfonds de curator alle medewerking;

      b. kan de toezichthouder de betrokken organen of vertegenwoordigers van het pensioenfonds toestaan bepaalde
      rechtshandelingen zonder goedkeuring te verrichten;

      c. kan de toezichthouder te allen tijde de door hem aangewezen curator vervangen;

      d. is voor schade ten gevolge van handelingen, die zijn verricht in strijd met een besluit als bedoeld in het
      eerste of derde lid, elke persoon die deel uitmaakt van het orgaan van het pensioenfonds dat deze handelingen
      verrichtte, hoofdelijk aansprakelijk tegenover het pensioenfonds, tenzij het verrichten van deze handelingen niet
      aan hem is te verwijten en hij niet nalatig is geweest in het treffen van maatregelen om de gevolgen daarvan af
      te wenden;

      e. zijn de handelingen, bedoeld in onderdeel d, voorzover deze rechtshandelingen zijn, vernietigbaar, indien de
      wederpartij wist of behoorde te weten dat de vereiste goedkeuring ontbrak.

      6 Zodra de omstandigheid, bedoeld in het eerste of derde lid niet langer aanwezig is, trekt de toezichthouder het
      besluit tot benoeming van de curator in. De toezichthouder maakt het besluit tot intrekking onverwijld bekend aan
      het pensioenfonds.

      7 De toezichthouder kent aan een op grond van het eerste lid aangewezen persoon een bezoldiging toe. De bezoldiging
      komt ten laste van:

      a. het pensioenfonds of, wanneer de financiële omstandigheden van het pensioenfonds dit niet toestaan;

      b. de werkgever of, wanneer de financiële omstandigheden van de werkgever dit niet toestaan;

      c. de toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel171
