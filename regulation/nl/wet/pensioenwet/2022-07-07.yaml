  - number: 23a
    text: |-
      Indien een algemeen pensioenfonds een pensioenregeling die is beëindigd uitvoert stelt het algemeen pensioenfonds
      een uitvoeringsreglement op dat, voor zover van toepassing, voldoet aan de eisen die in [artikel 25][ref1] ten
      aanzien van de uitvoeringsovereenkomst zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel25
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '24'
    text: |-
      De werkgever voldoet de pensioenuitvoerder de verschuldigde premie, tenzij er sprake is van voldoening door de
      gewezen werknemer in geval van een vrijwillige voortzetting als bedoeld in [artikel 54][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel54
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '54'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '25'
    text: |-
      1 In de uitvoeringsovereenkomst wordt in ieder geval een regeling opgenomen met betrekking tot de volgende
      onderwerpen:

      a. de wijze waarop de verschuldigde premie wordt vastgesteld;

      b. de wijze waarop en termijnen waarin de verschuldigde premie moet worden voldaan met inachtneming van
      [artikel 26][ref1];

      c. de informatie welke door de werkgever aan de pensioenuitvoerder wordt verstrekt;

      d. de procedures welke gelden bij het niet nakomen van premiebetalingsverplichtingen door de werkgever;

      e. de procedures welke gelden bij het opstellen en wijzigen van het pensioenreglement in verband met het sluiten en
      wijzigen van een pensioenovereenkomst;

      f. de maatstaven voor en voorwaarden waaronder toeslagverlening plaatsvindt;

      g. de uitgangspunten en procedures welke gelden ten aanzien van de besluitvorming over vermogenstekorten en
      vermogensoverschotten dan wel winstdeling;

      h. de voorwaarden die gelden bij beëindiging van een met een verzekeraar, een premiepensioeninstelling of
      een algemeen pensioenfonds gesloten uitvoeringsovereenkomst. In deze regeling worden de belangen van zowel de
      verzekeraar, de premiepensioeninstelling of het algemeen pensioenfonds als de werkgever vanuit actuarieel en
      bedrijfseconomisch oogpunt op evenwichtige wijze gewaarborgd door rekening te houden met:

      1°. de overige voorwaarden in de uitvoeringsovereenkomst;

      2°. de gehanteerde tarieven; en

      3°. de winstdelingsvorm.

      De regeling kan geen uitsluiting van collectieve waardeoverdracht inhouden;

      i. de criteria die de premiepensioeninstelling hanteert bij de keuze voor een verzekeraar voor de inkoop van een
      pensioenuitkering;

      j. de kosten die verband houden met de uitvoering van de pensioenregeling en die in mindering kunnen worden
      gebracht op een afgescheiden vermogen dat wordt aangehouden door een algemeen pensioenfonds;

      k. de kosten die ten laste kunnen worden gebracht van de premie voor een afgescheiden vermogen dat wordt
      aangehouden door een algemeen pensioenfonds; en

      l. de afspraken die met een algemeen pensioenfonds worden gemaakt over de kwaliteit van de dienstverlening.

      2 In de uitvoeringsovereenkomst wordt, voor zover overeengekomen, een regeling opgenomen met betrekking tot de
      volgende onderwerpen:

      a. een voorbehoud van de werkgever als bedoeld in [artikel 12][ref2];

      b. in geval van premiekorting of terugstorting: de voorwaarden waaronder sprake is van premiekorting of
      terugstorting, de wijze van vaststelling van de hoogte van de premiekorting of terugstorting en de bestemming
      ervan;

      c. ingeval van een bijstortingsverplichting van de werkgever: onder welke voorwaarden sprake is van een
      bijstortingsverplichting en hoe de hoogte ervan wordt bepaald;

      d. de mogelijkheid tot vrijwillige voortzetting van de pensioenregeling na beëindiging van het dienstverband;

      e. de aansluitingscriteria op grond waarvan de vrijwillige aansluiting bij een bedrijfstakpensioenfonds heeft
      plaatsgevonden; of

      f. de rechten en verplichtingen met betrekking tot vrijwillige pensioenregelingen.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de kosten,
      bedoeld in het eerste lid, onderdeel j en k en de afspraken, bedoeld in het eerste lid, onderdeel l.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel12
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '26'
    text: |-
      In de uitvoeringsovereenkomst wordt vastgelegd hoe de betaling van de premies door de werkgever aan de
      pensioenuitvoerder geschiedt, waarbij aan de volgende voorwaarden wordt voldaan:

      a. een werkgever voldoet de werkgeverspremie en de op het loon van de werknemer ingehouden werknemerspremie aan de
      pensioenuitvoerder uiterlijk binnen:

      1°. twee maanden na afloop van elke maand waarover de premie verschuldigd is indien de pensioenuitvoerder op basis
      van actuele loonsomgegevens zijn administratie voert; of

      2°. een maand na afloop van elk kwartaal waarover de premie verschuldigd is;

      b. wanneer de premie op basis van een langere termijn dan een kwartaal wordt vastgesteld en in rekening gebracht,
      is deze termijn ten hoogste gelijk aan een jaar en voldoet de werkgever uiterlijk binnen een maand na afloop van
      elk kwartaal een vierde gedeelte van de door hem op basis van zijn eigen bijdrage verschuldigde jaarpremie op basis
      van een schatting van de pensioenuitvoerder en de op het loon van de werknemer ingehouden werknemerspremie, aan de
      pensioenuitvoerder; en

      c. de totale jaarpremie, bestaande uit de werkgeverspremie en de werknemerspremies, wordt uiterlijk binnen zes
      maanden na afloop van het kalenderjaar voldaan aan de pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel26
  - number: '27'
    text: |-
      De in [artikel 26][ref1] genoemde termijnen gelden niet indien sprake is van een beëindiging van de deelneming. In
      dat geval wordt de ten tijde van de beëindiging nog verschuldigde premie binnen dertien weken voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel26
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel27
