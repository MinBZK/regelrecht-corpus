  - number: 220a
    text: |-
      1 Indien een pensioenfonds voor de datum van inwerkingtreding van
      [artikel I, onderdeel E, van de Verzamelwet pensioenen 2012][ref1] is overgegaan tot verzekering bij een
      verzekeraar op basis van een kapitaalcontract als bedoeld in [artikel 148a][ref2] geldt het verbod tot verzekering
      op basis van een kapitaalcontract, bedoeld in artikel 148a, na afloop van het contract of een verlenging daarvan
      doch uiterlijk vijf jaar na het tijdstip van inwerkingtreding van artikel I, onderdeel E, van de Verzamelwet
      pensioenen 2012.

      2 [Artikel 104][ref3], zoals dat luidde voor inwerkingtreding van
      [artikel I, onderdeel D, van de Wet versterking bestuur pensioenfondsen][ref4], blijft van toepassing op de leden,
      gewezen leden, werknemers die op een kandidatenlijst staan of gestaan hebben voor en de toegevoegd secretaris van
      een deelnemersraad.

      3 De personen die op het tijdstip van inwerkingtreding van
      [artikel V, onderdeel B, van de Wet versterking bestuur pensioenfondsen][ref5] deel uitmaken van de raad van
      toezicht van een pensioenfonds, worden tot het einde van hun op dat tijdstip lopende benoemingstermijn, doch
      uiterlijk tot 1 januari 2017, geacht geschikt te zijn als bedoeld in [artikel 105, derde lid][ref6], en, vanaf het
      tijdstip van inwerkingtreding van [artikel I, onderdeel D, van de Wet versterking bestuur pensioenfondsen][ref7],
      [artikel 106, eerste lid][ref8], en betrouwbaar als bedoeld in artikel 105, vijfde lid, en vanaf het tijdstip van
      inwerkingtreding van artikel I, onderdeel D, van de Wet versterking bestuur pensioenfondsen, artikel 106, vierde
      lid, zolang niet een wijziging in de relevante feiten, omstandigheden of antecedenten een redelijke aanleiding
      geeft tot een beoordeling van die geschiktheid of betrouwbaarheid.

      4 Indien een persoon die het beleid van een pensioenfonds bepaalt of mede bepaalt voorafgaand aan het tijdstip van
      inwerkingtreding van [artikel V, onderdeel B, van de Wet versterking bestuur pensioenfondsen][ref9] deskundig is
      in verband met de uitoefening van het bedrijf van het pensioenfonds wordt die persoon vanaf dat tijdstip geacht
      geschikt te zijn als bedoeld in [artikel 105, derde lid][ref10], en vanaf het tijdstip van inwerkingtreding van
      [artikel I, onderdeel D, van de Wet versterking bestuur pensioenfondsen][ref11], [artikel 106, eerste lid][ref12],
      zolang niet een wijziging in de relevante feiten en omstandigheden een redelijke aanleiding geeft tot een
      beoordeling of herbeoordeling van die geschiktheid.

      5 Indien beroep is ingesteld op grond van de [artikelen 217][ref13] en [218][ref14], zoals deze luidden voor
      inwerkingtreding van [artikel I, onderdelen J en K, van de Wet versterking bestuur pensioenfondsen][ref15], wordt
      dit beroep afgehandeld met toepassing van de wet zoals die luidde voor inwerkingtreding van artikel I, onderdelen J
      en K, van de Wet versterking bestuur pensioenfondsen.

      6 Een pensioenfonds dat in het eerste jaar na het tijdstip van inwerkingtreding van
      [artikel I, onderdeel P, van de Wet aanpassing financieel toetsingskader][ref16] niet voldoet aan de bij of
      krachtens [artikel 132][ref17] gestelde eisen, dient een herstelplan in op grond van [artikel 138][ref18], waarbij
      het pensioenfonds, in afwijking van artikel 138, tweede lid, uitwerkt hoe het binnen 12 jaar zal voldoen aan
      artikel 132. Een pensioenfonds dat in het tweede jaar na het tijdstip van inwerkingtreding van artikel I, onderdeel
      P, van de Wet aanpassing financieel toetsingskader niet voldoet aan de bij of krachtens artikel 132 gestelde eisen
      dient een herstelplan in op grond van artikel 138 of [artikel 139][ref19], waarbij het pensioenfonds, in afwijking
      van artikel 138, tweede lid, of artikel 139, tweede lid, uitwerkt hoe het binnen 11 jaar zal voldoen aan artikel
      132. Indien een pensioenfonds een herstelplan heeft vastgesteld met een termijn van 12 of 11 jaar is artikel 139,
      tweede lid, voor zover het betreft het hanteren van een gelijke termijn voor herstelplannen, van toepassing vanaf
      het vierde jaar na het tijdstip van inwerkingtreding van artikel I, onderdeel P, van de Wet aanpassing financieel
      toetsingskader.

      7 [Artikel 140][ref20] is van toepassing op beleidsdekkingsgraden die zijn vastgesteld vanaf het tijdstip van
      inwerkingtreding van [artikel I, onderdeel R, van de Wet aanpassing financieel toetsingskader][ref21].

      8 [Artikel 51][ref22] is vanaf een bij koninklijk besluit te bepalen tijdstip van toepassing op
      pensioengerechtigden die vanaf dat tijdstip pensioengerechtigd geworden zijn.

      9 Op een op het tijdstip van inwerkingtreding van
      [artikel I, onderdeel A, onder 2, van de Wet algemeen pensioenfonds][ref23] bestaand ondernemingspensioenfonds
      verbonden aan meerdere ondernemingen of groepen als bedoeld in de definitie van ondernemingspensioenfonds in
      [artikel 1][ref24], zoals dat luidde voor het tijdstip van inwerkingtreding van artikel I, onderdeel A, onder 2,
      van de Wet algemeen pensioenfonds blijven tot uiterlijk 5 jaar na het tijdstip van inwerkingtreding van artikel
      I, onderdeel A, onder 2, van de Wet algemeen pensioenfonds de voor deze ondernemingspensioenfondsen gestelde
      regels in de artikelen 1, [2, elfde en twaalfde lid][ref25], [28, derde lid][ref26], [100, derde lid][ref27],
      [111, eerste lid, onderdeel m][ref28], [115, tweede lid][ref29], [115a, derde lid, onderdeel j][ref30],
      [123][ref31] en [125a][ref32], zoals deze luidden voor het tijdstip van inwerkingtreding van artikel I, onderdeel
      A, onder 2, van de Wet algemeen pensioenfonds, van toepassing.

      10 Een voor het tijdstip van inwerkingtreding van
      [artikel I, onderdeel A, onder 3, van de Wet algemeen pensioenfonds][ref33] bestaand pensioenfonds dat op het
      tijdstip van inwerkingtreding van artikel I, onderdeel A, onder 3, van de Wet algemeen pensioenfonds niet voldoet
      aan de definitie van pensioenfonds, bedoeld in [artikel 1][ref34], omdat het geen stichting is, wordt gelijkgesteld
      met een pensioenfonds als bedoeld in artikel 1.

      11 Indien een andere pensioenuitvoerder een algemeen pensioenfonds wordt is [artikel 84][ref35] van overeenkomstige
      toepassing.

      12 [Artikel 54][ref36] zoals dat artikel luidde op de dag voor inwerkingtreding van
      __REF001___________________________________________________________________________________________________________
      _____________________ blijft van toepassing indien sprake is van een dienstbetrekking die is beëindigd voor de
      inwerkingtreding van artikel II van die wet.

      13 In afwijking van [artikel 70, derde lid][ref38], is de pensioenuitvoerder verplicht om op verzoek
      van de pensioengerechtigde die vanaf 8 juli 2015 gebruik is gaan maken van de regeling, bedoeld in
      [artikel 2, negende lid][ref39], het deel van het kapitaal dat nog niet is aangewend voor aankoop van een
      levenslange uitkering over te dragen aan een andere pensioenuitvoerder ten behoeve van de aankoop van een
      levenslange uitkering.

      14 [Artikel 46a, eerste lid, onderdelen a en b, en tweede lid, onderdelen d en e][ref40], is niet van toepassing
      op informatie en stukken met betrekking tot tijdvakken gelegen voor 1 juli 2016. Indien de deelnemer, gewezen
      deelnemer, gewezen partner of pensioengerechtigde hierom verzoekt verstrekt de pensioenuitvoerder deze informatie
      en stukken schriftelijk of elektronisch. Artikel 46a, eerste en tweede lid, is voor gewezen deelnemers, gewezen
      partners en pensioengerechtigden van toepassing, indien de werknemer of gewezen werknemer op of na 1 juli 2016
      deelnemer was.

      15 Indien een verzekeraar en een pensioengerechtigde ter zake van een pensioen waarvan de ingangsdatum is gelegen
      tussen 1 januari 2014 en 8 juli 2015 en dat is gebaseerd op een premieovereenkomst of een kapitaalovereenkomst,
      zijn overeengekomen dat de pensioenuitkering wordt omgezet in een kapitaal dat wordt aangewend voor een variabele
      uitkering, is, in afwijking van [artikel 70, derde lid][ref41], de verzekeraar die geen variabele uitkeringen
      uitvoert, verplicht om op verzoek van de pensioengerechtigde het kapitaal over te dragen aan een andere
      pensioenuitvoerder ten behoeve van de aankoop van een variabele uitkering.


