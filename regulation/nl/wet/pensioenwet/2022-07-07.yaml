  - number: '40'
    text: |-
      1 De pensioenuitvoerder verstrekt de gewezen deelnemer jaarlijks:

      a. een opgave van zijn opgebouwde pensioenaanspraken, waarbij deze gegevens voor zover het ouderdomspensioen
      betreft, tevens weergegeven worden op basis van een pessimistisch scenario, een verwacht scenario en een
      optimistisch scenario, met de waarschuwing dat de projecties kunnen verschillen van de definitieve hoogte van de te
      ontvangen pensioenuitkeringen;

      b. informatie over toeslagverlening;

      c. informatie over vermindering van pensioenaanspraken en pensioenrechten op grond van [artikel 134][ref1];

      d. informatie over een variabele uitkering;

      e. informatie over de reglementaire pensioenleeftijd;

      f. informatie over garanties;

      g. informatie over het land waar het pensioen is ondergebracht en de toezichthouder waar het pensioen onder valt;

      h. voor zover van toepassing, informatie over de dekkingsgraad naar Nederlandse maatstaf; en

      i. voor zover van toepassing, informatie over de ingehouden kosten.

      2 De pensioenuitvoerder informeert de gewezen deelnemer binnen drie maanden na een voor hem relevante wijziging in
      het pensioenreglement over die wijziging en de mogelijkheid om het gewijzigde pensioenreglement op te vragen bij
      de pensioenuitvoerder.

      3 De in het eerste lid bedoelde informatie kan in afwijking van dat lid door de pensioenuitvoerder op zijn website
      ter beschikking worden gesteld, mits de informatie ten minste een keer in de vijf jaar met inachtneming van
      [artikel 49][ref2] wordt verstrekt. [Artikel 46a, vijfde lid][ref3], is van overeenkomstige toepassing bij het op
      de website ter beschikking stellen van de informatie.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid
      bedoelde opgave en informatie en de wijze waarop deze worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel46a
