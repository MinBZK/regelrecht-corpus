      1 De pensioenuitvoerder is verplicht om op verzoek van de deelnemer of gewezen deelnemer de waarde van diens
      pensioenaanspraken aan te wenden in het kader van het keuzerecht overeenkomstig de [artikelen 60][ref1] en
      [61][ref2] of de keuzemogelijkheden overeenkomstig [artikel 62][ref3] of [63b][ref4].

      2 De pensioenuitvoerder brengt in het kader van de waardeoverdracht geen kosten in rekening bij de deelnemer of
      gewezen deelnemer.


