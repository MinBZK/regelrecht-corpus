  - number: '80'
    text: |-
      1 Een pensioenfonds is bevoegd om op verzoek van de deelnemer, gewezen deelnemer of andere aanspraakgerechtigde de
      waarde van zijn pensioenaanspraken welke voortvloeien uit een kapitaalovereenkomst of een premieovereenkomst die
      voorziet in de uitkering van een aan te wenden kapitaal op de pensioendatum, per de pensioendatum rechtstreeks over
      te dragen aan een andere pensioenuitvoerder indien:

      a. de pensioenovereenkomst hierin voorziet;

      b. de overdrachtswaarde zodanig door het overdragende pensioenfonds wordt vastgesteld dat de voor mannen en vrouwen
      te verwerven pensioenrechten gelijk zijn waarbij aan het vereiste van collectieve actuariële gelijkwaardigheid op
      basis van dezelfde grondslagen wordt voldaan; en

      c. indien de ontvangende pensioenuitvoerder een pensioenfonds is, de deelnemer, gewezen deelnemer of andere
      aanspraakgerechtigde reeds pensioenaanspraken heeft jegens dat pensioenfonds.

      Indien het verzoek van de deelnemer of gewezen deelnemer tot waardeoverdracht partnerpensioen betreft is voor de
      waardeoverdracht van dit partnerpensioen tevens vereist dat de partner die begunstigde is voor het partnerpensioen
      met de waardeoverdracht instemt.

      2 In afwijking van het eerste lid is een pensioenfonds verplicht op verzoek van de deelnemer, gewezen deelnemer
      of andere aanspraakgerechtigde de waarde van zijn pensioenaanspraken als bedoeld in het eerste lid, per de
      pensioendatum rechtstreeks over te dragen aan een andere pensioenuitvoerder indien voldaan wordt aan de in het
      eerste lid, onderdelen b en c en tweede zin, genoemde voorwaarden en:

      a. het pensioenfonds uitsluitend variabele uitkeringen uitvoert en het pensioenkapitaal na de overdracht wordt
      aangewend voor een vastgestelde uitkering, tenzij de deelnemer of gewezen deelnemer voor de pensioendatum deel
      uitmaakt van de toedelingskring waarop een collectief toedelingsmechanisme voor het beleggingsrisico wordt
      toegepast; of

      b. het pensioenfonds uitsluitend vastgestelde uitkeringen uitvoert en het pensioenkapitaal na de overdracht wordt
      aangewend voor een variabele uitkering.

      Dit lid wordt bij een algemeen pensioenfonds toegepast per collectiviteitkring.

      3 Het eerste lid, onderdeel b, is van toepassing op pensioenaanspraken die vanaf 1 januari 2005 zijn opgebouwd.

      4 Voorzover het bij de toepassing van het eerste lid pensioenaanspraken betreft die als gevolg van een premievrije
      voortzetting van die aanspraken worden opgebouwd, is het eerste lid, onderdeel b, van toepassing indien het recht
      op die premievrije voortzetting is ontstaan op of na 1 januari 2002.

      5 In afwijking van het derde lid kunnen de in het eerste lid, onderdeel b, opgenomen voorwaarden van
      toepassing zijn op pensioenaanspraken die zijn opgebouwd voor 1 januari 2005 indien dit is overeengekomen in de
      pensioenovereenkomst.

      6 Elk beding strijdig met dit artikel is nietig.

      7 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld aan het vaststellen van de
      overdrachtswaarde.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel80
