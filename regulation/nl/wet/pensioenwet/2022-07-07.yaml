        bwb_id: BWBR0005290
        artikel: '691'
  - number: '15'
    text: |-
      1 Indien een pensioenovereenkomst voorziet in een ouderdomspensioen, wordt in de overeenkomst bepaald
      dat dat pensioen levenslang wordt uitgekeerd aan de gepensioneerde, tenzij het ouderdomspensioen
      uitsluitend voorziet in een uitkering tot het bereiken van de de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], of tot het bereiken van de pensioenleeftijd voor het
      levenslange ouderdomspensioen.

      2 Elk beding in strijd met het eerste lid is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '16'
    text: |-
      1 Indien een pensioenovereenkomst voorziet in een partnerpensioen ten behoeve van een partner met wie de deelnemer
      niet gehuwd is, noch een geregistreerd partnerschap heeft, gelden voor deze partner ten aanzien van de wijze van
      vaststelling van het partnerpensioen dezelfde rechten en plichten als voor een gehuwde of geregistreerde partner.

      2 Elk beding in strijd met het eerste lid is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel16
  - number: '17'
    text: |-
      De verwerving van pensioenaanspraken in het kader van een uitkeringsovereenkomst of een kapitaalovereenkomst vindt
      gedurende de deelneming ten minste evenredig in de tijd plaats.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel17
  - number: 17a
    text: Het doorberekenen van kosten in het kader van een premieovereenkomst vindt evenredig in de tijd plaats.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel17a
  - number: '18'
    text: |-
      1 In geval van verlaging van de pensioengrondslag van een werknemer worden de op grond van de pensioenovereenkomst
      tot het tijdstip van verlaging opgebouwde pensioenaanspraken niet gewijzigd.

      2 In geval van verlaging van de pensioengrondslag blijven de opgebouwde pensioenaanspraken behouden en worden de
      pensioenaanspraken vastgesteld overeenkomstig [artikel 55][ref1].

      3 Elk beding in strijd met het eerste of tweede lid is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel55
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '19'
    text: |-
      Een werkgever kan de pensioenovereenkomst zonder instemming van de werknemer wijzigen indien de bevoegdheid daartoe
      schriftelijk in de pensioenovereenkomst is opgenomen en er tevens sprake is van een zodanig zwaarwichtig belang van
      de werkgever dat het belang van de werknemer dat door de wijziging zou worden geschaad daarvoor naar maatstaven van
      redelijkheid en billijkheid moet wijken.
    url: https://wetten.overheid.nl/BWBR0020809/2022-07-07#Artikel19
  - number: '20'
    text: |-
      In geval van een wijziging van een pensioenovereenkomst worden de voor de aanspraakgerechtigden tot het tijdstip
      van wijziging opgebouwde pensioenaanspraken niet gewijzigd, behoudens het bepaalde in de [artikelen 76][ref1],
      [78][ref2], [83][ref3] en [134][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel83
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel134
