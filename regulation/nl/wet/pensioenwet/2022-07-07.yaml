      1 Een pensioenfonds met zetel in Nederland stelt binnen zes maanden na afloop van het boekjaar de jaarrekening
      en het bestuursverslag overeenkomstig [titel 9, Boek 2 van het Burgerlijk Wetboek][ref1] vast, met dien verstande
