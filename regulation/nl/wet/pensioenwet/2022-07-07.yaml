  - number: '129'
    text: |-
      1 Een pensioenfonds kan uitsluitend korting verlenen op de kostendekkende premie of de gedempte premie en kan
      uitsluitend terugstorten indien:

      a. gezien de beleidsdekkingsgraad ten aanzien van de pensioenverplichtingen wordt voldaan aan de
      [artikelen 126][ref1], [132][ref2] en [133][ref3];

      b. de voorwaardelijke toeslagen zowel met betrekking tot de voorgaande tien jaar zijn verleend als ook in de
      toekomst kunnen worden verleend; en

      c. de korting op de pensioenaanspraken en pensioenrechten op grond van [artikel 134][ref4] in de voorgaande tien
      jaar gecompenseerd is.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel132
