  - number: 125b
    text: |-
      Bij samenvoeging van pensioenfondsen als bedoeld in de definitie van ondernemingspensioenfonds in
      [artikel 1][ref1], brengt een deelnemend pensioenfonds zijn gehele vermogen in.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel125b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '126.1'
    text: |-
      Een pensioenfonds stelt toereikende technische voorzieningen vast met betrekking tot het geheel van
      pensioenverplichtingen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel126
  - number: '126.2'
    text: 'De berekening wordt uitgevoerd met inachtneming van de volgende beginselen:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel126
  - number: 126.2.a
    text: de technische voorzieningen worden berekend op basis van marktwaardering;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel126
  - number: 126.2.b
    text: |-
      de voor de berekening van de technische voorzieningen gebruikte grondslagen inzake overlijden of
      arbeidsongeschiktheid en levensverwachting worden gebaseerd op prudente beginselen; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel126
  - number: 126.2.c
    text: |-
      de methode en de grondslag van de berekening van de technische voorzieningen blijven van boekjaar tot boekjaar
      ongewijzigd, tenzij wijzigingen daarin gerechtvaardigd zijn als gevolg van een verandering van de juridische,
      demografische of economische omstandigheden die aan de hypothesen ten grondslag liggen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel126
  - number: '126.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de wijze van berekening van het minimum
      bedrag van de technische voorzieningen, de daarbij in acht te nemen voorzichtigheidsmarges en kunnen regels worden
      gesteld over de frequentie waarmee de technische voorzieningen worden berekend.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel126
  - number: '127'
    text: Ouderdomspensioen wordt gefinancierd op basis van kapitaaldekking.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel127
  - number: '128.1'
    text: 'Een pensioenfonds stelt een kostendekkende premie vast die bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel128
  - number: 128.1.a
    text: de premie die actuarieel benodigd is in verband met de aangroei van de pensioenverplichtingen;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel128
  - number: 128.1.b
    text: |-
      de opslag die nodig is voor het bij de aangroei van de pensioenverplichtingen behorende vereist eigen vermogen als
      bedoeld in [artikel 132][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel132
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '132'
        hoofdstuk: '6'
  - number: 128.1.c
    text: |-
      de opslag die nodig is voor de bij de aangroei van de pensioenverplichtingen behorende uitvoeringskosten van het
      pensioenfonds; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel128
  - number: 128.1.d
    text: |-
      de premie die actuarieel benodigd is ten behoeve van toeslagverlening indien gekozen is voor financiering op de
      wijze, bedoeld in [artikel 137, onderdeel a, b of d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel137
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '137'
        hoofdstuk: '6'
  - number: '128.2'
    text: De kostendekkende premie kan worden gedempt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel128
  - number: '128.3'
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld inzake het eerste en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel128
  - number: '129.1'
    text: |-
      Het pensioenfonds kan uitsluitend korting verlenen op de kostendekkende premie of de gedempte premie indien ten
      aanzien van de pensioenverplichtingen wordt voldaan aan de [artikelen 126][ref1], [132][ref2] en [133][ref3] en de
      eventuele voorwaardelijke toeslagen kunnen worden nagekomen overeenkomstig de [artikelen 95][ref4] en [137][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel132
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel133
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel95
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel137
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '126'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '132'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '133'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '95'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref5
        bwb_id: BWBR0020809
        artikel: '137'
        hoofdstuk: '6'
  - number: '129.2'
    text: 'Het pensioenfonds kan uitsluitend terugstorten indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel129
  - number: 129.2.a
    text: |-
      ten aanzien van de pensioenverplichtingen wordt voldaan aan de [artikelen 126][ref1], [132][ref2] en [133][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel132
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel133
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '126'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '132'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '133'
        hoofdstuk: '6'
  - number: 129.2.b
    text: |-
      de voorwaardelijke toeslagen met betrekking tot de voorgaande tien jaar zijn verleend en kunnen worden verleend
      overeenkomstig de [artikelen 95][ref1] en [137][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel137
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '95'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '137'
        hoofdstuk: '6'
  - number: 129.2.c
    text: |-
      de korting op de pensioenaanspraken en pensioenrechten op grond van [artikel 134][ref1] in de voorgaande tien jaar
      gecompenseerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '134'
        hoofdstuk: '6'
  - number: '130'
    text: 'Een pensioenfonds vermeldt in zijn jaarrekening en jaarverslag:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel130
  - number: 130.a
    text: |-
      de hoogte van de totale kostendekkende premie, bedoeld in [artikel 128, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel128
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '128'
        hoofdstuk: '6'
  - number: 130.b
    text: |-
      de hoogte van de totale gedempte premie, bedoeld in [artikel 128, tweede lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel128
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '128'
        hoofdstuk: '6'
  - number: 130.c
    text: de hoogte van de totale feitelijke premie.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel130
  - number: '131.1'
    text: 'Een pensioenfonds beschikt over een minimaal vereist eigen vermogen, tenzij:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel131
  - number: 131.1.a
    text: een pensioenfonds tot volledige overdracht, herverzekering of onderbrenging is overgegaan; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel131
  - number: 131.1.b
    text: |-
      de toezichthouder heeft ingestemd met het feit dat het pensioenfonds daarom niet beschikt over een minimaal vereist
      eigen vermogen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel131
  - number: '131.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de omvang en de samenstelling van het minimaal vereist eigen
      vermogen bepaald.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel131
  - number: '132.1'
    text: Een pensioenfonds beschikt over een vereist eigen vermogen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel132
  - number: '132.2'
    text: |-
      Een pensioenfonds stelt het vereist eigen vermogen zodanig vast dat met een zekerheid van 971/2 procent wordt
      voorkomen dat het pensioenfonds binnen een periode van één jaar over minder waarden beschikt dan de hoogte van de
      technische voorzieningen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel132
  - number: '132.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld inzake de berekening en de
      samenstelling van het vereist eigen vermogen, bedoeld in het eerste lid, en het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel132
  - number: '133'
    text: De technische voorzieningen en de aan het pensioenfonds verstrekte leningen worden volledig door waarden gedekt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel133
  - number: '134.1'
    text: 'Een pensioenfonds kan verworven pensioenaanspraken en pensioenrechten uitsluitend verminderen indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel134
  - number: 134.1.a
    text: de technische voorzieningen en het minimaal vereist eigen vermogen niet meer volledig door waarden zijn gedekt;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel134
  - number: 134.1.b
    text: |-
      het pensioenfonds niet in staat is binnen een redelijke termijn de technische voorzieningen en het minimaal
      vereist eigen vermogen door waarden te dekken zonder dat de belangen van deelnemers, gewezen deelnemers,
      pensioengerechtigden, andere aanspraakgerechtigden of de werkgever onevenredig worden geschaad; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel134
  - number: 134.1.c
    text: |-
      alle overige beschikbare sturingsmiddelen, met uitzondering van het beleggingsbeleid, zijn ingezet zoals uitgewerkt
      in het kortetermijnherstelplan, bedoeld in [artikel 140][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel140
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '140'
        hoofdstuk: '6'
  - number: '134.2'
    text: |-
      Een pensioenfonds informeert de deelnemers, gewezen deelnemers, pensioengerechtigden en de werkgever schriftelijk
      over het besluit tot vermindering van pensioenaanspraken en pensioenrechten.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel134
  - number: '134.3'
    text: |-
      De vermindering, bedoeld in het eerste lid, kan op zijn vroegst een maand nadat de deelnemers, gewezen deelnemers,
      pensioengerechtigden, werkgever en toezichthouder hierover geïnformeerd zijn, worden gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel134
  - number: '135.1'
    text: |-
      Een pensioenfonds voert een beleggingsbeleid dat in overeenstemming is met de prudent-person regel en met name
      gebaseerd is op de volgende uitgangspunten:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel135
  - number: 135.1.a
    text: de waarden worden belegd in het belang van aanspraak- en pensioengerechtigden; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel135
  - number: 135.1.b
    text: |-
      beleggingen in de bijdragende onderneming worden beperkt tot ten hoogste 5% van de portefeuille als geheel, en
      ingeval de bijdragende onderneming tot een groep behoort, worden beleggingen in de ondernemingen die tot dezelfde
      groep als de bijdragende onderneming behoren, beperkt tot ten hoogste 10% van de portefeuille. Wanneer een groep
      van ondernemingen aan het pensioenfonds premies betaalt, geschieden beleggingen in deze bijdragende ondernemingen
      prudent, waarbij rekening wordt gehouden met de noodzaak van een behoorlijke diversificatie;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel135
  - number: 135.1.c
    text: de beleggingen worden gewaardeerd op basis van marktwaardering.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel135
  - number: '135.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ter waarborging van het prudente beleggingsbeleid nadere
      regels gesteld.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel135
  - number: '135.3'
    text: |-
      De eisen die zijn opgenomen in het eerste lid, aanhef en onderdeel b, en de regels die op grond van het tweede
      lid worden gesteld ten aanzien van de diversificatie van waarden zijn niet van toepassing op beleggingen in
      staatsobligaties.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel135
  - number: '136.1'
    text: |-
      Een pensioenfonds gaat geen leningen aan, tenzij de lening tijdelijk wordt aangegaan voor
      liquiditeitsdoelstellingen en treedt niet namens derde partijen op als garant.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel136
  - number: '136.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van het eerste lid met
      betrekking tot de tijdelijkheid van de lening en de liquiditeitsdoelstellingen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel136
  - number: '137.1'
    text: 'Pensioenfondsen kunnen de voorwaardelijke toeslagverlening financieren door:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel137
  - number: 137.1.a
    text: het creëren van technische voorzieningen;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel137
  - number: 137.1.b
    text: het creëren van eigen vermogen boven het vereist eigen vermogen ten behoeve van de toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel137
  - number: 137.1.c
    text: het putten uit het eigen vermogen boven het vereist eigen vermogen ten behoeve van de toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel137
  - number: 137.1.d
    text: het hanteren van een opslag op de premie; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel137
  - number: 137.1.e
    text: overrendement.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel137
  - number: '137.2'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld inzake het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel137
  - number: '138.1'
    text: |-
      Wanneer een pensioenfonds voorziet of redelijkerwijs kan voorzien dat het niet meer voldoet of zal voldoen aan de
      bij of krachtens [artikel 132][ref1] gestelde vereisten ten aanzien van het eigen vermogen, meldt het pensioenfonds
      dit onverwijld aan de toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel132
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '132'
        hoofdstuk: '6'
  - number: '138.2'
    text: |-
      In de in het eerste lid bedoelde situatie dient het pensioenfonds binnen drie maanden of zoveel eerder als de
      toezichthouder bepaalt ter instemming bij de toezichthouder een concreet en haalbaar langetermijnherstelplan
      in. In dit langetermijnherstelplan werkt het pensioenfonds uit hoe het uiterlijk binnen 15 jaar zal voldoen aan
      [artikel 132][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel132
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '132'
        hoofdstuk: '6'
  - number: '138.3'
    text: Het pensioenfonds handelt onverwijld overeenkomstig het langetermijnherstelplan.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel138
  - number: '138.4'
    text: |-
      Het pensioenfonds rapporteert gedurende de uitvoering van het langetermijnherstelplan de toezichthouder jaarlijks
      of het herstel verloopt overeenkomstig de doelstellingen van het langetermijnherstelplan; waarbij wordt aangegeven:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel138
  - number: 138.4.a
    text: welke activiteiten het pensioenfonds in het afgelopen jaar heeft uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel138
  - number: 138.4.b
    text: welke resultaten deze activiteiten tot dan toe hebben gehad; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel138
  - number: 138.4.c
    text: hoe de actuele positie van het pensioenfonds is.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel138
  - number: '138.5'
    text: |-
      De toezichthouder beoordeelt ten minste eenmaal per drie jaar of aanvullende maatregelen nodig zijn zodat het
      langetermijnherstelplan ook daadwerkelijk kan worden gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel138
  - number: '138.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de inhoud en opstelling van een
      langetermijnherstelplan.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel138
  - number: '139.1'
    text: |-
      Wanneer gedurende de looptijd van het langetermijnherstelplan, bedoeld in [artikel 138][ref1], ingrijpende
      wijzigingen plaatsvinden in:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel138
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
  - number: 139.1.a
    text: de samenstelling van de technische voorzieningen; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel139
  - number: 139.1.b
    text: de samenstelling, de omvang en de waarde van de beleggingen;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel139
  - number: '139.2'
    text: 'De toezichthouder geeft aan of:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel139
  - number: 139.2.a
    text: het bestaande langetermijnherstelplan kan worden gehandhaafd;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel139
  - number: 139.2.b
    text: |-
      het bestaande langetermijnherstelplan binnen drie maanden dan wel eerder moet worden vervangen door een nieuw
      langetermijnherstelplan, waarbij rekening gehouden wordt met de reeds verstreken looptijd van het te vervangen
      langetermijnherstelplan. Dit nieuwe langetermijnherstelplan wordt ter instemming bij de toezichthouder ingediend;
      dan wel
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel139
  - number: 139.2.c
    text: |-
      het bestaande langetermijnherstelplan kan worden ingetrokken en niet vervangen hoeft te worden door een nieuw
      langetermijnherstelplan.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel139
  - number: '140.1'
    text: |-
      Wanneer een pensioenfonds voorziet of redelijkerwijs kan voorzien dat het niet meer voldoet of niet zal voldoen
      aan de bij of krachtens [artikel 131][ref1] gestelde vereisten ten aanzien van het minimaal vereist eigen vermogen,
      meldt het pensioenfonds dit onverwijld aan de toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel131
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '131'
        hoofdstuk: '6'
  - number: '140.2'
    text: |-
      In de in het eerste lid bedoelde situatie dient het pensioenfonds binnen twee maanden of zoveel eerder als de
      toezichthouder bepaalt, een concreet en haalbaar kortetermijnherstelplan ter instemming bij de toezichthouder
      in. In dit kortetermijnherstelplan werkt het pensioenfonds uit hoe het uiterlijk binnen drie jaar zal voldoen aan
      [artikel 131][ref1] waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel131
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '131'
        hoofdstuk: '6'
  - number: 140.2.a
    text: de kans op herstel verbetert;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel140
  - number: 140.2.b
    text: de risico’s voor de aanspraak- en pensioengerechtigden niet toenemen; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel140
  - number: 140.2.c
    text: de kans op toeslagverlening niet negatief wordt beïnvloed.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel140
  - number: '140.3'
    text: 'In afwijking van het tweede lid geldt voor het kortetermijnherstelplan een termijn van een jaar indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel140
  - number: 140.3.a
    text: niet is voldaan aan de voorwaarden in het tweede lid, sub a, b en c; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel140
  - number: 140.3.b
    text: het pensioenfonds bijdragen ontvangt van een in een andere lidstaat gevestigde bijdragende onderneming.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel140
  - number: '140.4'
    text: Het pensioenfonds handelt onverwijld overeenkomstig het kortetermijnherstelplan.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel140
  - number: '140.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de inhoud en opstelling van een
      kortetermijnherstelplan.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel140
  - number: '141.1'
    text: |-
      De toezichthouder kan, rekening houdend met de specifieke situatie van het pensioenfonds en in het belang van de
      aanspraak- en pensioengerechtigden, op aanvraag van een pensioenfonds geheel of gedeeltelijk, ontheffing verlenen
      van het bij of krachtens de [artikelen 131][ref1], [132][ref2], [134, eerste lid, onderdeel a][ref3], [137][ref4]
      en [138][ref5] bepaalde, indien het pensioenfonds aantoont dat daaraan redelijkerwijs niet kan worden voldaan en
      dat de doeleinden die deze artikelen beogen te bereiken anderszins worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel132
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel134
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel137
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel138
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '131'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '132'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '134'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '137'
        hoofdstuk: '6'
      - id: ref5
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
  - number: '141.2'
    text: |-
      De toezichthouder kan in bijzondere gevallen, rekening houdend met de specifieke situatie van het pensioenfonds
      en in het belang van de aanspraak- en pensioengerechtigden, op aanvraag van een pensioenfonds dat geen bijdragen
      ontvangt van een in een andere lidstaat gevestigde bijdragende onderneming, geheel of gedeeltelijk, ontheffing
      verlenen van het bij of krachtens [artikel 140][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel140
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '140'
        hoofdstuk: '6'
  - number: '141.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld waaraan de houder van een ontheffing
      dient te voldoen en met betrekking tot het verlenen van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel141
  - number: '142'
    text: |-
      Onze Minister kan na overleg met de toezichthouder vrijstelling verlenen van de in [artikel 138][ref1] en
      [140][ref2] genoemde termijnen van 15 jaar respectievelijk drie en een jaar, indien er sprake is van een
      uitzonderlijke economische situatie waardoor een groot aantal pensioenfondsen niet kan voldoen aan de bij of
      krachtens deze wet gestelde vereisten inzake het vereiste eigen vermogen en het minimaal vereist eigen vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel140
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '140'
        hoofdstuk: '6'
  - number: '143.1'
    text: Een pensioenfonds richt zijn organisatie zodanig in dat deze een beheerste en integere bedrijfsvoering waarborgt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel143
  - number: '143.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het eerste lid. De regels
      hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel143
  - number: 143.2.a
    text: het beheersen van bedrijfsprocessen en bedrijfsrisico’s;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel143
  - number: 143.2.b
    text: integriteit;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel143
  - number: 143.2.c
    text: 'de soliditeit van het pensioenfonds, waaronder wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel143
  - number: 143.2.c.1°
    text: het beheersen van financiële risico’s; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel143
  - number: 143.2.c.2°
    text: het beheersen van andere risico’s die de soliditeit van het pensioenfonds kunnen aantasten;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel143
  - number: 143.2.d
    text: het beheersen van de financiële positie over de lange termijn door periodiek een continuïteitsanalyse te maken.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel143
  - number: '144.1'
    text: |-
      Bij algemene maatregel van bestuur worden, ten behoeve van de berekeningen, bedoeld bij de [artikelen 126][ref1],
      [128][ref2], [138][ref3], [140][ref4] en [143][ref5], regels gesteld over:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel128
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel138
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel140
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel143
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '126'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '128'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '140'
        hoofdstuk: '6'
      - id: ref5
        bwb_id: BWBR0020809
        artikel: '143'
        hoofdstuk: '6'
  - number: 144.1.a
    text: het minimale percentage van het gemiddelde loon- of prijsindexcijfer;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel144
  - number: 144.1.b
    text: het maximaal te hanteren gemiddelde rendement op vastrentende waarden; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel144
  - number: 144.1.c
    text: de maximaal te hanteren risicopremies op onder andere aandelen en onroerend goed.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel144
  - number: '144.2'
    text: |-
      De in het eerste lid bedoelde regels worden iedere drie jaren getoetst, rekening houdend met financieel-economische
      ontwikkelingen in het verleden en realistische inzichten ten aanzien van toekomstige financieel-economische
      verwachtingen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel144
  - number: '144.3'
    text: |-
      Voordat de voordracht van de in het eerste lid bedoelde algemene maatregel van bestuur wordt gedaan vraagt Onze
      Minister het oordeel van een commissie bestaande uit een vertegenwoordiger van De Nederlandsche Bank N.V., van
      het Centraal Planbureau, twee leden op voordracht van de Stichting van de Arbeid en een door Onze Minister aan te
      wijzen lid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel144
  - number: '144.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het derde lid
      bedoelde commissie.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel144
  - number: '144.5'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel144
  - number: '145.1'
    text: |-
      Het pensioenfonds stelt een actuariële en bedrijfstechnische nota vast waarin in elk geval een omschrijving
      is opgenomen van de wijze waarop uitvoering wordt gegeven aan het bij of krachtens de [artikelen 25][ref1],
      [95][ref2], [126 tot en met 137][ref3] en [143][ref4] bepaalde. De actuariële en bedrijfstechnische nota bevat
      voorts een verklaring inzake beleggingsbeginselen en een beschrijving van de sturingsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel95
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel126
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel143
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '95'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '126'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '143'
        hoofdstuk: '6'
  - number: '145.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de actuariële en
      bedrijfstechnische nota.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel145
  - number: '145.3'
    text: |-
      Voorzover risico’s zijn overgedragen, herverzekerd of ondergebracht kan de omschrijving, bedoeld in het eerste lid,
      beperkt blijven tot een verwijzing naar hetgeen daarover in de betreffende overeenkomsten is opgenomen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel145
  - number: '145.4'
    text: |-
      De verklaring inzake beleggingsbeginselen wordt om de drie jaren en voorts onverwijld na iedere belangrijke
      wijziging van het beleggingsbeleid herzien.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel145
  - number: '146'
    text: |-
      Een pensioenfonds met zetel in Nederland stelt binnen zes maanden na afloop van het boekjaar de jaarrekening
      en het jaarverslag overeenkomstig [titel 9, Boek 2 van het Burgerlijk Wetboek][ref1] vast, met dien verstande
      dat [artikel 390 van genoemd wetboek][ref2] niet van toepassing is en dat de in [artikel 360, derde lid][ref3],
      [396][ref4] en [397 van genoemd wetboek][ref5] geformuleerde uitzonderingen niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel390
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel360
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel396
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel397
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '390'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '360'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '396'
      - id: ref5
        bwb_id: BWBR0003045
        artikel: '397'
  - number: '147.1'
    text: Een pensioenfonds doet het boekjaar gelijk lopen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
  - number: '147.2'
    text: |-
      Een pensioenfonds verstrekt periodiek binnen de daartoe vastgestelde termijnen staten aan de toezichthouder die de
      toezichthouder nodig heeft voor de juiste uitoefening van zijn taak, bedoeld in [artikel 151][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel151
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '151'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '147.3'
    text: 'De staten omvatten uitsluitend:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
  - number: 147.3.a
    text: informatie over de organisatie van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
  - number: 147.3.b
    text: een bestuursverslag;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
  - number: 147.3.c
    text: een balans;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
  - number: 147.3.d
    text: informatie over financiële relaties en transacties van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
  - number: 147.3.e
    text: een rekening van baten en lasten;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
  - number: 147.3.f
    text: informatie inzake de dekkingsgraad;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
  - number: 147.3.g
    text: informatie inzake het vereist eigen vermogen;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
  - number: 147.3.h
    text: |-
      actuariële staten, gewaarmerkt door een bevoegde actuaris, waaronder een actuarieel verslag voorzien van een
      verklaring van een actuaris;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
  - number: 147.3.i
    text: informatie over het deelnemersbestand;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
  - number: 147.3.j
    text: |-
      informatie inzake de uitgevoerde pensioenregeling en eventueel andere door het pensioenfonds uitgevoerde
      regelingen;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
  - number: 147.3.k
    text: premiegegevens;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
  - number: 147.3.l
    text: informatie inzake herverzekering;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
  - number: 147.3.m
    text: informatie inzake verplichtingen van het pensioenfonds voor risico van de deelnemers.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
  - number: '147.4'
    text: |-
      Met zijn verklaring bedoeld in het derde lid, onderdeel h, bevestigt de actuaris dat hij zich ervan heeft overtuigd
      dat voldaan is aan de [artikelen 126 tot en met 140][ref1]. Hij is bevoegd zijn verklaring nader toe te lichten of
      op enig punt een voorbehoud te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel126
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '126'
        hoofdstuk: '6'
  - number: '147.5'
    text: |-
      De staten zijn periodiek voorzien van een verklaring omtrent de getrouwheid, afgegeven door een accountant. Ten
      bewijze dat de staten door hem zijn onderzocht, waarmerkt de accountant de staten.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
  - number: '147.6'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
  - number: 147.6.a
    text: de inhoud en de modellen van de staten; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
  - number: 147.6.b
    text: de wijze, de periodiciteit en de termijnen van de verstrekking.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel147
  - number: '148.1'
    text: |-
      De bevoegde actuaris die het actuarieel verslag waarmerkt, is onafhankelijk van het pensioenfonds en verricht geen
      andere werkzaamheden voor het pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel148
  - number: '148.2'
    text: |-
      Het is de waarmerkende actuaris niet toegestaan de werkzaamheden, bedoeld in [artikel 147, vierde lid][ref1],
      uit te oefenen voor een pensioenfonds wanneer een andere actuaris of andere deskundige die behoort tot dezelfde
      organisatie als de waarmerkende actuaris, andere werkzaamheden verricht voor hetzelfde pensioenfonds, tenzij
      de organisatie van de waarmerkende actuaris een door de toezichthouder goedgekeurde gedragscode heeft over de
      onafhankelijkheid van de waarmerkende actuaris.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel147
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '147'
        hoofdstuk: '6'
  - number: '149'
    text: |-
      De toezichthouder kan een pensioenfonds de verplichting opleggen om binnen een door de toezichthouder te stellen
      termijn over te gaan tot herverzekering bij een verzekeraar, overdracht aan een verzekeraar of onderbrenging bij
      een pensioenfonds indien dit naar het oordeel van de toezichthouder noodzakelijk is in verband met:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel149
  - number: 149.a
    text: de actuariële en bedrijfstechnische opzet van het pensioenfonds; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel149
  - number: 149.b
    text: de deskundigheid en betrouwbaarheid van het bestuur.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel149
  - number: '150'
    text: 'Wanneer een pensioenregeling eindigt tijdens de periode waarin een kortetermijnherstelplan van kracht is:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel150
  - number: 150.a
    text: stelt het pensioenfonds de toezichthouder hiervan op de hoogte;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel150
  - number: 150.b
    text: |-
      gaat het pensioenfonds binnen een door de toezichthouder te stellen termijn over tot het herverzekeren bij een
      verzekeraar, overdragen aan een verzekeraar of onderbrengen bij een pensioenfonds van de pensioenverplichtingen op
      basis van een procedure welke ter kennis en instemming van de toezichthouder wordt gebracht; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel150
  - number: 150.c
    text: |-
      stelt het pensioenfonds een algemeen overzicht van de procedure, bedoeld in onderdeel b, beschikbaar voor de
      deelnemers, gewezen deelnemers en pensioengerechtigden of de vertegenwoordigers van de genoemde personen in
      overeenstemming met het vertrouwelijkheidbeginsel.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel150
  - number: '151.1'
    text: De Stichting Autoriteit Financiële Markten is belast met het gedragstoezicht.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel151
  - number: '151.2'
    text: |-
      Gedragstoezicht is toezicht gericht op de naleving van de normen ten aanzien van voorlichting door
      pensioenuitvoerders aan deelnemers, gewezen deelnemers, gewezen partners en pensioengerechtigden en de normen ten
      aanzien van de advisering van de deelnemer of gewezen deelnemer bij de uitvoering van premieovereenkomsten met
      beleggingsvrijheid waarbij de deelnemer of gewezen deelnemer de verantwoordelijkheid voor de beleggingen heeft
      overgenomen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel151
  - number: '151.3'
    text: De Nederlandsche Bank N.V. is belast met het prudentieel toezicht en het materieel toezicht.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel151
  - number: '151.4'
    text: |-
      Prudentieel toezicht is toezicht gericht op de normen ten aanzien van de financiële soliditeit van pensioenfondsen
      en het bijdragen aan de financiële stabiliteit van de sector van pensioenfondsen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel151
  - number: '151.5'
    text: |-
      Materieel toezicht is toezicht gericht op alle normen in deze wet die geen onderdeel uitmaken van gedrags- of
      prudentieel toezicht.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel151
  - number: '151.6'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn de bij besluit van de
      toezichthouder aangewezen personen belast. Van een besluit als bedoeld in de eerste volzin wordt mededeling gedaan
      door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel151
  - number: '151.7'
    text: 'Bij algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel151
  - number: 151.7.a
    text: |-
      worden regels gesteld omtrent de toedeling van de taken en bevoegdheden met betrekking tot het prudentieel
      toezicht, het gedragstoezicht en het materieel toezicht van deze wet aan de toezichthouders;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel151
  - number: 151.7.b
    text: worden regels gesteld over de wijze waarop de toezichthouders samenwerken; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel151
  - number: 151.7.c
    text: |-
      worden eisen gesteld aan de toezichthouders, waaronder voorschriften gericht op een zodanige besluitvorming binnen
      de toezichthouder dat een onafhankelijke vervulling van de uit deze wet voortvloeiende taken en bevoegdheden is
      gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel151
  - number: '152.1'
    text: |-
      De toezichthouder treedt bij de uitoefening van het toezicht op de naleving van deze wet niet in de beoordeling van
      de individuele rechtsverhouding tussen:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel152
  - number: 152.1.a
    text: een werkgever en een werknemer;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel152
  - number: 152.1.b
    text: een pensioenuitvoerder en een werkgever; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel152
  - number: 152.1.c
    text: een pensioenuitvoerder en een aanspraak- of pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel152
  - number: '152.2'
    text: Het eerste lid is niet van toepassing op de uitvoeringsovereenkomst en het pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel152
  - number: '153.1'
    text: |-
      De toezichthouder draagt met betrekking tot de uitoefening van zijn taken en bevoegdheden uit hoofde van deze wet
      zorg voor:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel153
  - number: 153.1.a
    text: een tijdige voorbereiding en een voor de onder toezicht staanden kenbare, transparante en consistente uitvoering;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel153
  - number: 153.1.b
    text: de kwaliteit van de daarbij gebruikte procedures;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel153
  - number: 153.1.c
    text: de zorgvuldige behandeling van een ieder die met hem in aanraking komt;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel153
  - number: 153.1.d
    text: de zorgvuldige behandeling van bezwaarschriften en klachten die worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel153
  - number: '153.2'
    text: |-
      De toezichthouder treft voorzieningen, waardoor een ieder die met hem in aanraking komt in de gelegenheid is
      voorstellen tot verbetering van werkwijzen en procedures te doen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel153
  - number: '153.3'
    text: |-
      In het jaarverslag, bedoeld in [artikel 156][ref1], doet de toezichthouder verslag van hetgeen tot uitvoering van
      het eerste en het tweede lid is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel156
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '156'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '154.1'
    text: |-
      De toezichthouder stelt jaarlijks een begroting op van de in het daaropvolgende jaar te verwachten baten en lasten,
      investeringsuitgaven alsmede inkomsten en uitgaven met betrekking tot de uitvoering van de bij en krachtens deze
      wet opgedragen taken en de daaruit voortvloeiende werkzaamheden. De begroting wordt op een zodanige wijze opgesteld
      dat de lasten en de uitgaven structureel worden gedekt door de baten en de inkomsten.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel154
  - number: '154.2'
    text: De begrotingsposten worden van een toelichting voorzien.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel154
  - number: '154.3'
    text: |-
      Tenzij de werkzaamheden waarop de begroting betrekking heeft nog niet eerder werden verricht, bevat de begroting
      een vergelijking met de begroting van het lopende jaar en de laatste jaarrekening of verantwoording waarmee Onze
      Minister heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel154
  - number: '154.4'
    text: |-
      Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en
      de begrote baten en lasten, dan wel inkomsten en uitgaven, of in het in de begroting vervatte beleid, doet de
      toezichthouder daarvan onverwijld mededeling aan Onze Minister onder vermelding van de verschillen en hun oorzaak
      en zonodig onder indiening van een gewijzigde of aanvullende begroting.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel154
  - number: '155.1'
    text: |-
      De toezichthouder zendt de begroting, bedoeld in [artikel 154, eerste lid][ref1], voor 1 december van het aan
      het begrotingsjaar voorafgaande jaar, en de begroting, bedoeld in [artikel 154, vierde lid][ref2], onverwijld ter
      instemming aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel154
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel154
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '154'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '154'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '155.2'
    text: |-
      De instemming met de begroting kan worden onthouden wegens strijd met het recht of het algemeen belang. Ingeval van
      gebleken strijdigheid wordt instemming niet onthouden dan nadat de toezichthouder in de gelegenheid is gesteld de
      begroting aan te passen, binnen een door Onze Minister te stellen redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel155
  - number: '155.3'
    text: |-
      De toezichthouder doet onverwijld na instemming mededeling van de begroting in de Staatscourant en houdt deze
      gedurende ten minste twee jaren na instemming op elektronische wijze ter inzage.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel155
  - number: '155.4'
    text: |-
      Wanneer Onze Minister niet voor 1 januari van het jaar waarop deze betrekking heeft met de begroting heeft
      ingestemd, kan de toezichthouder, in het belang van een juiste uitvoering van zijn taak, voor het aangaan van
      verplichtingen en het verrichten van uitgaven beschikken over ten hoogste vier twaalfde gedeelten van de bedragen
      die bij de overeenkomstige onderdelen in de begroting van het voorafgaande jaar waren toegestaan.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel155
  - number: '156.1'
    text: |-
      De toezichthouder stelt jaarlijks een jaarverslag op. Het jaarverslag beschrijft de taakuitoefening en het daartoe
      gevoerde beleid uit hoofde van deze wet in het voorafgaande jaar. Het jaarverslag beschrijft voorts het gevoerde
      beleid met betrekking tot de kwaliteitszorg.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel156
  - number: '156.2'
    text: De toezichthouder zendt het jaarverslag voor 1 mei van het op het boekjaar volgende jaar aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel156
  - number: '156.3'
    text: De toezichthouder houdt het jaarverslag gedurende ten minste twee jaren op elektronische wijze ter inzage.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel156
  - number: '157.1'
    text: |-
      De toezichthouder stelt jaarlijks een jaarrekening of verantwoording op van de bij of krachtens deze wet opgedragen
      taken en de daaruit voortvloeiende werkzaamheden. De jaarrekening van de Stichting Autoriteit Financiële Markten
      wordt zoveel mogelijk met overeenkomstige toepassing van [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1]
      ingericht.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '157.2'
    text: |-
      De jaarrekening of verantwoording gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door
      de toezichthouder aangewezen accountant.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel157
  - number: '157.3'
    text: |-
      De accountant voegt bij de verklaring, bedoeld in het tweede lid, een verslag van zijn bevindingen omtrent de
      rechtmatige inning en besteding van de middelen door de toezichthouder uit hoofde van deze wet.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel157
  - number: '157.4'
    text: |-
      De accountant voegt bij de verklaring, bedoeld in het tweede lid, tevens een verslag van zijn bevindingen over
      de vraag of het beheer en de organisatie van de toezichthouder uit hoofde van deze wet voldoen aan eisen van
      doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel157
  - number: '157.5'
    text: |-
      De toezichthouder zendt de jaarrekening of verantwoording voor 1 mei van het op het boekjaar volgende jaar ter
      instemming aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel157
  - number: '157.6'
    text: De instemming kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel157
  - number: '157.7'
    text: |-
      De toezichthouder houdt, na instemming, de jaarrekening of verantwoording gedurende ten minste twee jaren op
      elektronische wijze ter inzage.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel157
  - number: '158'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld over de inhoud en indiening van de begroting, het jaarverslag
      en de jaarrekening of verantwoording.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel158
  - number: '159.1'
    text: |-
      Het verschil tussen de aan het eind van een begrotingsjaar gerealiseerde baten en inkomsten van de toezichthouder
      en de gerealiseerde lasten en uitgaven van de toezichthouder vormt het exploitatiesaldo.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel159
  - number: '159.2'
    text: |-
      Indien in enig boekjaar een exploitatiesaldo ontstaat en de toezichthouder dit exploitatiesaldo wil betrekken
      bij de in het lopende jaar in rekening te brengen kosten, bedoeld in [artikel 160][ref1], doet de toezichthouder
      daaromtrent een voorstel in de jaarrekening of verantwoording.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel160
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '160'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '160.1'
    text: |-
      De toezichthouder brengt de kosten van de werkzaamheden die hij verricht in verband met de uitvoering van de taken
      op grond van deze wet in rekening bij de pensioenuitvoerders ten aanzien waarvan die werkzaamheden worden verricht,
      voor zover deze kosten niet ten laste komen van de Rijksbegroting. Tot de kosten behoren onder meer de kosten die
      hij ter voorbereiding op de uitvoering van nieuwe onderdelen van zijn taak heeft gemaakt, voordat deze aan hem
      werden opgedragen. De kosten voor verzekeraars en pensioenfondsen worden gescheiden in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel160
  - number: '160.2'
    text: |-
      De kosten worden gebaseerd op de begroting waarmee Onze Minister heeft ingestemd en op het exploitatiesaldo,
      indien Onze Minister heeft ingestemd met de jaarrekening of verantwoording waarin een voorstel als bedoeld in
      [artikel 159, tweede lid][ref1], is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel159
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '159'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '160.3'
    text: |-
      Op de begrote kosten worden de opbrengsten uit bestuurlijke boeten en verbeurde lasten onder dwangsom, voor zover
      de hieraan ten grondslag liggende besluiten van de toezichthouder in het voorafgaande jaar onherroepelijk zijn
      geworden, in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel160
  - number: '160.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel
      waarbij onderscheid kan worden gemaakt tussen incidenteel en jaarlijks in rekening te brengen kosten. De
      nadere regels hebben onder meer betrekking op de wijze waarop de toezichtkosten worden berekend, de toerekening
      van toezichthandelingen en -kosten aan pensioenuitvoerders en de doorberekening van de toezichtkosten aan de
      pensioenuitvoerders.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel160
  - number: '161.1'
    text: 'De toezichthouder organiseert overleg over:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel161
  - number: 161.1.a
    text: de door de toezichthouder op te stellen begroting;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel161
  - number: 161.1.b
    text: de door de toezichthouder gerealiseerde baten en lasten alsmede inkomsten en uitgaven, en verrichte werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel161
  - number: 161.1.c
    text: |-
      de kosten voor de pensioenuitvoerders die verband houden met de uitvoering van de taken op grond van deze wet en de
      daaruit voortvloeiende werkzaamheden; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel161
  - number: 161.1.d
    text: de jaarrekening of verantwoording.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel161
  - number: '161.2'
    text: |-
      Het overleg wordt gevoerd door de toezichthouder en een daarvoor in aanmerking komende representatieve
      vertegenwoordiging van de onder zijn toezicht staande pensioenuitvoerders. Onze Minister kan ambtenaren aanwijzen
      die namens hem het overleg bijwonen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel161
  - number: '161.3'
    text: Het overleg vindt minimaal twee maal per jaar plaats.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel161
  - number: '161.4'
    text: De toezichthouder maakt het verslag van het overleg binnen een redelijke termijn na het overleg openbaar.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel161
  - number: '162'
    text: |-
      Tegen besluiten van Onze Minister inzake instemming met de begroting of de jaarrekening of verantwoording kan geen
      beroep worden ingesteld als bedoeld in [artikel 8:1 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel162
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '163.1'
    text: 'Onze Minister houdt toezicht op:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel163
  - number: 163.1.a
    text: de rechtmatigheid van de uitvoering van deze wet door de toezichthouder;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel163
  - number: 163.1.b
    text: de doeltreffendheid van de uitvoering van deze wet door de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel163
  - number: '163.2'
    text: |-
      Het toezicht, bedoeld in het eerste lid, wordt onder gezag van Onze Minister uitgeoefend door de Inspectie
      Werk en Inkomen, genoemd in [hoofdstuk 7 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      onder leiding van het hoofd van die inspectie. De [artikelen 37][ref2], [38][ref3] en
      [44 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel44
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '38'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '44'
  - number: '164.1'
    text: |-
      Onze Minister is bevoegd aan de toezichthouder de gegevens of inlichtingen te vragen die naar zijn oordeel nodig
      zijn voor een onderzoek naar de wijze waarop de toezichthouder de uit deze wet voortvloeiende taken en bevoegdheden
      uitvoert of heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel164
  - number: '164.2'
    text: |-
      De toezichthouder verstrekt kosteloos aan Onze Minister de in het eerste lid bedoelde gegevens of inlichtingen.
      Indien Onze Minister de toezichthouder vraagt bepaalde gegevens of inlichtingen te verstrekken die op grond van
      deze wet omtrent afzonderlijke pensioenuitvoerders, werkgevers of natuurlijke personen zijn verstrekt of zijn
      verkregen, is de toezichthouder niet verplicht deze gegevens of inlichtingen te verstrekken, indien deze betrekking
      hebben op of herleidbaar zijn tot een afzonderlijke pensioenuitvoerder, werkgever of natuurlijke persoon, met
      uitzondering van gegevens of inlichtingen die betrekking hebben op of herleidbaar zijn tot een pensioenuitvoerder
      of werkgever ten aanzien waarvan surséance van betaling is verleend, die in staat van faillissement is verklaard of
      op grond van een rechterlijke uitspraak is ontbonden.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel164
  - number: '164.3'
    text: |-
      Onze Minister kan een derde opdragen de gegevens of inlichtingen die hem ingevolge het tweede lid zijn verstrekt
      te onderzoeken en aan hem verslag uit te brengen. Tevens kan Onze Minister de derde die in zijn opdracht
      handelt, machtigen namens hem gegevens of inlichtingen in te winnen, in welk geval het eerste en tweede lid van
      overeenkomstige toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel164
  - number: '164.4'
    text: |-
      Onze Minister gebruikt de gegevens of inlichtingen die hij ingevolge het tweede of derde lid heeft verkregen
      uitsluitend voor het vormen van zijn oordeel over de toereikendheid van deze wet of de wijze waarop de
      toezichthouder de bij of krachtens deze wet opgedragen taken en toegekende bevoegdheden uitoefent of heeft
      uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel164
  - number: '164.5'
    text: |-
      Onze Minister en degenen die in zijn opdracht handelen zijn verplicht tot geheimhouding van de op grond van het
      tweede lid, tweede volzin, ontvangen gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel164
  - number: '164.6'
    text: |-
      Niettegenstaande het vierde en vijfde lid kan Onze Minister de aan de gegevens of inlichtingen ontleende
      bevindingen en de daaruit getrokken conclusies aan de Staten-Generaal mededelen en de conclusies in algemene zin
      uit het onderzoek openbaar maken.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel164
  - number: '164.7'
    text: |-
      De [Wet openbaarheid van bestuur][ref1] en de [Wet Nationale ombudsman][ref2] zijn niet van toepassing met
      betrekking tot de in dit artikel bedoelde gegevens of inlichtingen die Onze Minister of de in zijn opdracht
      werkende derde onder zich heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0003372
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0003372
  - number: '165.1'
    text: |-
      Onze Minister kan aan de toezichthouder een aanwijzing geven over de uitoefening van de aan de toezichthouder bij
      of krachtens deze wet opgedragen taken en toegekende bevoegdheden wanneer de toezichthouder hierin naar het oordeel
      van Onze Minister tekort schiet. Onze Minister treedt daarbij niet in individuele gevallen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel165
  - number: '165.2'
    text: De toezichthouder is gehouden overeenkomstig de aanwijzing te handelen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel165
  - number: '166.1'
    text: |-
      Indien naar het oordeel van Onze Minister de toezichthouder een of meerdere van zijn bij of krachtens deze wet
      opgedragen taken ernstig verwaarloost, kan Onze Minister de noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel166
  - number: '166.2'
    text: |-
      Ter uitvoering van het eerste lid kan Onze Minister besluiten een of meer onderdelen van de taken van de
      toezichthouder zelf uit te voeren of door een andere organisatie te laten uitvoeren. Alsdan komen de desbetreffende
      bevoegdheden van de toezichthouder toe aan Onze Minister onderscheidenlijk de andere toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel166
  - number: '166.3'
    text: |-
      De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat de toezichthouder in
      de gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn alsnog zijn taak naar behoren uit
      te voeren.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel166
  - number: '166.4'
    text: |-
      Onze Minister stelt beide kamers der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel166
  - number: '167'
    text: |-
      De pensioenuitvoerder, de werkgever, de accountant en de actuaris verstrekken aan de toezichthouder kosteloos de
      door deze gevorderde inlichtingen, gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel167
  - number: '168.1'
    text: De toezichthouder kan ten behoeve van het toezicht op de naleving van deze wet van een ieder inlichtingen vorderen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel168
  - number: '168.2'
    text: |-
      De [artikelen 5:13][ref1] en [5:20 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '168.3'
    text: |-
      Voorzover de toezichthouder voor het uitoefenen van het gedragstoezicht ten aanzien van pensioenfondsen waaraan
      de andere toezichthouder een vergunning heeft verleend of welke in het register is opgenomen, gegevens nodig heeft
      over aspecten van de bedrijfsvoering, bedoeld in [artikel 143, tweede lid, onderdeel a en b][ref1], vordert de
      eerstgenoemde toezichthouder geen inlichtingen, dan nadat de andere toezichthouder is verzocht deze gegevens te
      verstrekken en is gebleken dat de andere toezichthouder niet aan dit verzoek tegemoet kan komen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel143
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '143'
        hoofdstuk: '6'
  - number: '168.4'
    text: |-
      Van het derde lid kan, na overleg met de andere toezichthouder, worden afgeweken indien sprake is van een redelijk
      vermoeden van een overtreding van de regels bij of krachtens deze wet gesteld en onverwijlde spoed, gelet op de
      betrokken belangen, dat vereist.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel168
  - number: '169.1'
    text: |-
      De pensioenuitvoerder en de werkgever zijn verplicht de zakelijke gegevens en bescheiden die betrekking hebben op
      pensioenregelingen en andere bij of krachtens deze wet geregelde onderwerpen in Nederland beschikbaar te hebben en
      deze gedurende ten minste zeven jaren na het boekjaar waarop ze betrekking hebben beschikbaar te houden.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel169
  - number: '169.2'
    text: Het eerste lid is niet van toepassing op een verzekeraar met zetel in een andere lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel169
  - number: '170.1'
    text: |-
      Een accountant die het onderzoek naar de staten, bedoeld in [artikel 147, vijfde lid][ref1], uitvoert meldt de
      toezichthouder zo spoedig mogelijk elke omstandigheid waarvan hij bij de uitvoering van het onderzoek kennis heeft
      gekregen en die:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel147
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '147'
        hoofdstuk: '6'
  - number: 170.1.a
    text: in strijd is met deze wet;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel170
  - number: 170.1.b
    text: de nakoming van de door het pensioenfonds aangegane verplichtingen bedreigt; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel170
  - number: 170.1.c
    text: leidt tot de weigering van het afgeven van de verklaring omtrent de getrouwheid of tot het maken van voorbehouden.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel170
  - number: '170.2'
    text: |-
      Het eerste lid, aanhef en onderdelen a en b, is van overeenkomstige toepassing op de actuaris die het onderzoek
      naar de staten, bedoeld in [artikel 147, vierde lid][ref1], uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel147
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '147'
        hoofdstuk: '6'
  - number: '170.3'
    text: |-
      De accountant of actuaris verstrekt zo spoedig mogelijk kosteloos alle inlichtingen aan de toezichthouder die deze
      redelijkerwijs nodig heeft voor het toezicht op de naleving van deze wet. De toezichthouder stelt het betrokken
      pensioenfonds in de gelegenheid aanwezig te zijn bij het verstrekken van inlichtingen door de accountant of
      actuaris.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel170
  - number: '170.4'
    text: De accountant of actuaris biedt desgevraagd de toezichthouder inzicht in zijn controlewerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel170
  - number: '170.5'
    text: |-
      De accountant of actuaris die op grond van dit artikel tot een melding of het verstrekken van inlichtingen aan
      de toezichthouder is overgegaan, is niet aansprakelijk voor schade die een derde als gevolg daarvan lijdt, tenzij
      aannemelijk wordt gemaakt dat, gelet op alle feiten en omstandigheden, in redelijkheid niet tot melding of het
      verstrekken van inlichtingen had mogen worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel170
  - number: '171.1'
    text: |-
      De toezichthouder kan een pensioenuitvoerder die niet voldoet aan hetgeen bij of krachtens deze wet is bepaald,
      door middel van het geven van een aanwijzing verplichten om binnen een door de toezichthouder gestelde redelijke
      termijn ten aanzien van in de aanwijzingsbeschikking aangegeven punten een bepaalde gedragslijn te volgen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel171
  - number: '171.2'
    text: |-
      De toezichthouder kan een aanwijzing als bedoeld in het eerste lid eveneens aan een pensioenfonds geven indien
      hij tekenen ontwaart van een ontwikkeling die het eigen vermogen, de solvabiliteit, de liquiditeit of de
      bedrijfsvoering van het pensioenfonds in gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel171
  - number: '172.1'
    text: |-
      De toezichthouder kan besluiten een of meer personen te benoemen als curator ten aanzien van alle of bepaalde
      organen van het pensioenfonds indien dat pensioenfonds niet voldoet aan hetgeen ingevolge deze wet is bepaald.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel172
  - number: '172.2'
    text: 'Het besluit ingevolge het eerste lid wordt slechts genomen:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel172
  - number: 172.2.a
    text: |-
      nadat door het pensioenfonds niet of niet volledig binnen de gestelde termijn aan een aanwijzing als bedoeld in
      [artikel 171][ref1] gevolg is gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel171
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '171'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 172.2.b
    text: |-
      indien de in het eerste lid bedoelde overtreding een adequate functionering van het pensioenfonds ernstig in gevaar
      brengt en dat pensioenfonds voorafgaand in de gelegenheid is gesteld zijn zienswijze naar voren te brengen over het
      voorgenomen besluit; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel172
  - number: 172.2.c
    text: |-
      indien de in het eerste lid bedoelde overtreding de belangen van de aanspraak- en pensioengerechtigden ernstig in
      gevaar brengt en dat pensioenfonds voorafgaand in de gelegenheid is gesteld zijn zienswijze naar voren te brengen
      over het voorgenomen besluit.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel172
  - number: '172.3'
    text: |-
      Onverminderd het eerste en tweede lid kan de toezichthouder besluiten een of meer personen te benoemen als
      curator ten aanzien van alle of bepaalde organen of vertegenwoordigers van een pensioenfonds indien hij bij dat
      pensioenfonds tekenen ontwaart van een ontwikkeling die het eigen vermogen, de solvabiliteit, of de liquiditeit van
      dat pensioenfonds in gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel172
  - number: '172.4'
    text: |-
      Het benoemingsbesluit bevat onder meer een beschrijving van de belangen waardoor de curator zich dient te
      laten leiden. De toezichthouder benoemt de curator voor ten hoogste twee jaren, met de mogelijkheid om deze
      termijn telkens voor ten hoogste een jaar te verlengen; de verlenging wordt terstond van kracht. Met ingang van
      het tijdstip waarop het besluit tot benoeming van de curator aan het pensioenfonds is bekendgemaakt mogen de
      desbetreffende organen of vertegenwoordigers hun bevoegdheden slechts uitoefenen na goedkeuring door de curator en
      met inachtneming van de opdrachten van de curator.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel172
  - number: '172.5'
    text: 'Na de benoeming van een curator:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel172
  - number: 172.5.a
    text: verlenen de organen en de vertegenwoordigers van het pensioenfonds de curator alle medewerking;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel172
  - number: 172.5.b
    text: |-
      kan de toezichthouder de betrokken organen of vertegenwoordigers van het pensioenfonds toestaan bepaalde
      rechtshandelingen zonder goedkeuring te verrichten;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel172
  - number: 172.5.c
    text: kan de toezichthouder te allen tijde de door hem aangewezen curator vervangen;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel172
  - number: 172.5.d
    text: |-
      is voor schade ten gevolge van handelingen, die zijn verricht in strijd met een besluit als bedoeld in het eerste
      of derde lid, elke persoon die deel uitmaakt van het orgaan van het pensioenfonds dat deze handelingen verrichtte,
      hoofdelijk aansprakelijk tegenover het pensioenfonds, tenzij het verrichten van deze handelingen niet aan hem is te
      verwijten en hij niet nalatig is geweest in het treffen van maatregelen om de gevolgen daarvan af te wenden;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel172
  - number: 172.5.e
    text: |-
      zijn de handelingen, bedoeld in onderdeel d, voorzover deze rechtshandelingen zijn, vernietigbaar, indien de
      wederpartij wist of behoorde te weten dat de vereiste goedkeuring ontbrak.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel172
  - number: '172.6'
    text: |-
      Zodra de omstandigheid, bedoeld in het eerste of derde lid niet langer aanwezig is, trekt de toezichthouder het
      besluit tot benoeming van de curator in. De toezichthouder maakt het besluit tot intrekking onverwijld bekend aan
      het pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel172
  - number: '172.7'
    text: |-
      De toezichthouder kent aan een op grond van het eerste lid aangewezen persoon een bezoldiging toe. De bezoldiging
      komt ten laste van:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel172
  - number: 172.7.a
    text: het pensioenfonds of, wanneer de financiële omstandigheden van het pensioenfonds dit niet toestaan;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel172
  - number: 172.7.b
    text: de werkgever of, wanneer de financiële omstandigheden van de werkgever dit niet toestaan;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel172
  - number: 172.7.c
    text: de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel172
  - number: '173.1'
    text: |-
      Op verzoek van de toezichthouder kan de ondernemingskamer van het gerechtshof te Amsterdam over een pensioenfonds
      een bewindvoerder aanstellen, indien:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel173
  - number: 173.1.a
    text: |-
      een pensioenfonds blijk geeft van een zodanig wanbeleid dat de belangen van de aanspraak- en pensioengerechtigden
      een onmiddellijke voorziening vereisen; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel173
  - number: 173.1.b
    text: het bestuur is komen te ontbreken.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel173
  - number: '173.2'
    text: |-
      De toezichthouder dient zijn verzoekschrift tot aanstelling van een bewindvoerder in tweevoud in. De griffier doet
      een exemplaar van het verzoekschrift onverwijld aan het pensioenfonds toekomen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel173
  - number: '173.3'
    text: |-
      Indien de ondernemingskamer het verzoek toewijst, bepaalt zij de duur waarvoor de bewindvoerder wordt aangesteld.
      Zij kan deze duur op verzoek van de toezichthouder of van de bewindvoerder verlengen dan wel verkorten. De
      ondernemingskamer kent de bewindvoerder een bezoldiging toe ten laste van:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel173
  - number: 173.3.a
    text: het pensioenfonds of, wanneer de financiële omstandigheden van het pensioenfonds dit niet toestaan;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel173
  - number: 173.3.b
    text: de werkgever of, wanneer de financiële omstandigheden van de werkgever dit niet toestaan;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel173
  - number: 173.3.c
    text: de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel173
  - number: '173.4'
    text: |-
      De bewindvoerder treedt in de plaats van het bestuur of een of meerdere door de ondernemingskamer aangewezen leden
      van het bestuur van het pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel173
  - number: '173.5'
    text: |-
      De voorlopige tenuitvoerlegging van de beschikking tot aanstelling van een bewindvoerder kan worden bevolen, indien
      het verzoek daartoe is gedaan op een van de gronden, genoemd in het eerste lid, onderdelen a en b.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel173
  - number: '174.1'
    text: |-
      Indien een accountant of actuaris niet of niet meer de nodige waarborgen biedt dat deze zijn taak met betrekking
      tot het pensioenfonds naar behoren zal kunnen vervullen, kan de toezichthouder ten aanzien van deze accountant
      of actuaris bepalen dat hij niet langer bevoegd is de in deze wet bedoelde verklaringen met betrekking tot dat
      pensioenfonds af te leggen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel174
  - number: '174.2'
    text: De toezichthouder doet mededeling van het besluit, bedoeld in het eerste lid, aan het pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel174
  - number: '175.1'
    text: |-
      De toezichthouder kan een last onder dwangsom opleggen ter zake van een overtreding van de voorschriften, gesteld
      bij of krachtens deze wet en van [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '175.2'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld ter zake van de uitoefening van de bevoegdheid tot het
      opleggen van een last onder dwangsom.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel175
  - number: '176.1'
    text: |-
      De toezichthouder kan een bestuurlijke boete opleggen ter zake van een overtreding van voorschriften,
      gesteld bij of krachtens de [artikelen 21, eerste lid, tweede lid, tweede volzin en vierde lid][ref1],
