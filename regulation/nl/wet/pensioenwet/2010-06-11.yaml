  - number: '2.1'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld over hetgeen onder de directeur-
      grootaandeelhouder wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
  - number: '2.2'
    text: 'Met een pensioenovereenkomst wordt gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
  - number: 2.2.a
    text: |-
      de uit de dienstbetrekking voortvloeiende rechtsbetrekking tussen een werkgever en een werknemer met betrekking tot
      pensioen in geval van deelneming in een bedrijfstakpensioenfonds op basis van een verplichtstelling; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
  - number: 2.2.b
    text: |-
      de uit de dienstbetrekking voortvloeiende rechtsbetrekking tussen een overheidswerkgever en een overheidswerknemer
      als bedoeld in de [Wet privatisering ABP][ref1] met betrekking tot pensioen op grond van de overeenkomst, bedoeld
      in [artikel 4][ref2] en [5 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007791
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007791#Artikel5
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007791
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0007791
        artikel: '5'
  - number: '2.3'
    text: |-
      Bij regeling van Onze Minister kan een categorie van personen, niet zijnde werknemers, die werkt in een
      arbeidsverhouding waarbij tegen beloning persoonlijke arbeid wordt verricht, worden aangewezen die voor de
      toepassing van deze wet en de daarop berustende bepalingen wordt gelijkgesteld met werknemers.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
  - number: '2.4'
    text: |-
      Een geldelijke, vastgestelde uitkering voor een gewezen werknemer die wordt gedaan bij wijze van
      inkomensvoorziening bij ouderdom in verband met vervroegde uittreding is geen pensioen in de zin van deze wet,
      indien die uitkering:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
  - number: 2.4.a
    text: |-
      uiterlijk eindigt bij het bereiken van de ingangsdatum van de uitkering op grond van de
      [Algemene Ouderdomswet][ref1], bij het bereiken van de pensioenleeftijd voor het levenslange ouderdomspensioen of
      bij eerder overlijden en die gebaseerd is op een overeenkomst die alleen aanspraak op een uitkering toekent aan
      degenen die tijdens de looptijd van de regeling, welke ten hoogste vijf jaar bedraagt, een bepaalde leeftijd hebben
      bereikt; of


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 2.4.b
    text: |-
      gebaseerd is op de [Wet kaderregeling Vut overheidspersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007792
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007792
  - number: '2.5'
    text: |-
      Een geldelijke, vastgestelde uitkering voor een gewezen werknemer bij wijze van inkomensvoorziening bij ouderdom is
      geen pensioen in de zin van deze wet wanneer deze uitkering is gebaseerd op een regeling:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
  - number: 2.5.a
    text: |-
      die leidt tot uitkeringen vanaf een bepaalde leeftijd aan werknemers die werkzaamheden verrichten die door de
      werkgever als substantieel bezwarend zijn aangemerkt;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
  - number: 2.5.b
    text: |-
      die leidt tot een uitkering die uiterlijk eindigt bij het bereiken van de ingangsdatum van de uitkering op grond
      van de [Algemene Ouderdomswet][ref1], bij het bereiken van de pensioenleeftijd voor het ouderdomspensioen of bij
      eerder overlijden; en


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 2.5.c
    text: die bij regeling van Onze Minister is aangewezen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
  - number: '2.6'
    text: |-
      Een uitkering voor een gemoedsbezwaarde als bedoeld in
      [artikel 64, eerste lid, onderdeel a, van de Wet financiering sociale verzekeringen][ref1] is geen pensioen in de
      zin van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel64
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '64'
  - number: '2.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld op grond waarvan
      aanvullingen op een loonaanvullingsuitkering of een vervolguitkering als bedoeld in
      [artikel 60, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] die geen
      arbeidsongeschiktheidspensioen zijn als bedoeld in [artikel 1][ref2] worden aangemerkt als
      arbeidsongeschiktheidspensioen als bedoeld in [dat artikel][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '2.8'
    text: |-
      De voordracht voor een krachtens het zevende lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
  - number: '2.9'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot kapitaalovereenkomsten of
      premieovereenkomsten waarbij het op de pensioendatum beschikbaar komende kapitaal wordt gesplitst in een deel dat
      wordt aangewend voor aankoop van een direct ingaande tijdelijke uitkering en een deel dat later wordt aangewend
      voor de aankoop van een, op de tijdelijke uitkering aansluitende, levenslange uitkering. In deze regeling:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
  - number: 2.9.a
    text: |-
      kunnen dergelijke uitkeringen, en daarbij horende uitkeringen voor nabestaanden, worden gelijkgesteld met een
      pensioen als bedoeld in [artikel 1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 2.9.b
    text: |-
      kan worden bepaald dat dit pensioen voldoet aan de [artikelen 15][ref1] en [63][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel63
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '63'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 2.9.c
    text: |-
      kan worden bepaald dat pensioenuitvoerders verplicht zijn mee te werken aan splitsing zoals beschreven in de
      aanhef; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
  - number: 2.9.d
    text: kunnen regels worden gesteld betreffende een goede uitvoering.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
  - number: '2.10'
    text: |-
      De regeling, bedoeld in het negende lid, is uitsluitend van toepassing indien de pensioendatum is gelegen na
      31 december 2008 en het op de pensioendatum beschikbaar komende kapitaal nog niet is aangewend voor aankoop van een
      levenslange uitkering.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
  - number: '2.11'
    text: |-
      Bij samenvoeging van pensioenfondsen als bedoeld in de definitie van ondernemingspensioenfonds in
      [artikel 1][ref1], geldt als voorwaarde dat de afzonderlijke pensioenfondsen voor de samenvoeging gedurende een
      periode van ten minste 5 jaar waren verbonden aan een onderneming of groep, tenzij de samenvoeging plaatsvindt
      omdat de ondernemingen of groepen waaraan de pensioenfondsen waren verbonden een onderneming of groep zijn
      geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '2.12'
    text: |-
      Bij een ondernemingspensioenfonds dat pensioenregelingen uitvoert voor meerdere ondernemingen of groepen als
      bedoeld in de definitie van [artikel 1][ref1] kan een uitvoeringsovereenkomst worden beëindigd overeenkomstig de
      hierover in de statuten opgenomen bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '3.1'
    text: |-
      Deze wet is met uitzondering van de [artikelen 7][ref1] en [9][ref2] van overeenkomstige toepassing op de persoon
      die geen werkgever of werknemer is, die in een arbeidsverhouding werkt waarbij tegen beloning persoonlijke arbeid
      wordt verricht en die onder de werkingssfeer valt van een door een verplichtgesteld bedrijfstakpensioenfonds
      uitgevoerde pensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel9
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '3.2'
    text: |-
      Deze wet is met uitzondering van de [artikelen 7][ref1] en [9][ref2] van overeenkomstige toepassing op de persoon
      die als zelfstandige onder de werkingssfeer valt van een door een verplichtgesteld bedrijfstakpensioenfonds
      uitgevoerde pensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel9
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '4'
    text: |-
      Op een pensioenaanspraak die of een pensioenrecht dat een tot verevening gerechtigde echtgenoot of geregistreerde
      partner op grond van [artikel 5 van de Wet verevening pensioenrechten bij scheiding][ref1] verwerft, zijn de
      [artikelen 58][ref2], [61][ref3], [71 tot en met 74][ref4], [78 tot en met 80][ref5], [85 tot en met 89][ref6] niet
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel61
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel71
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel78
      [ref6]: https://wetten.overheid.nl/BWBR0020809#Artikel85
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel4
    references:
