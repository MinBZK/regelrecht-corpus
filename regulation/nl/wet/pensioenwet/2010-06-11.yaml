      - id: ref4
        bwb_id: BWBR0020809
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 125a
    text: |-
      Indien een ondernemingspensioenfonds op grond van [artikel 123, tweede of derde lid][ref1], gescheiden vermogens
      aanhoudt, wordt hetgeen bij of krachtens de [artikelen 126][ref2], [128 tot en met 142][ref3], [143][ref4], voor
      zover het de continuïteitsanalyse betreft, [145][ref5], [147][ref6] en [149][ref7] is bepaald, toegepast per
      afgescheiden vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel126
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel128
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel143
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel145
      [ref6]: https://wetten.overheid.nl/BWBR0020809#Artikel147
      [ref7]: https://wetten.overheid.nl/BWBR0020809#Artikel149
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel125a
    references:
      - id: ref1
