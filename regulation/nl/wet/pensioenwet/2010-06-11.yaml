  - number: '176.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de uitoefening van de bevoegdheid,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel176
  - number: '179.1'
    text: |-
      Het bedrag van de bestuurlijke boete wordt bepaald bij algemene maatregel van bestuur, met dien verstande dat
      de bestuurlijke boete voor een afzonderlijke overtreding ten hoogste € 4 000 000 bedraagt. Indien tijdens het
      plegen van de overtreding nog geen vijf jaren zijn verlopen sedert het opleggen van een bestuurlijke boete aan de
      overtreder ter zake van eenzelfde overtreding, wordt het bedrag van de bestuurlijke boete, bedoeld in de eerste
      volzin, voor een afzonderlijke overtreding verdubbeld.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel179
  - number: '179.2'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, bepaalt bij elke daarin omschreven overtreding het
      bedrag van de deswege op te leggen bestuurlijke boete. De overtredingen worden gerangschikt in categorieën naar
      zwaarte van de overtreding met de daarbij behorende basisbedragen, minimumbedragen en maximumbedragen. Daarbij
      wordt de volgende indeling gebruikt:








                    Categorie


                    Basisbedrag


                    Minimumbedrag


                    Maximumbedrag






                    1


                    € 10 000,–


                    € 0,–


                    € 10 000,–




                    2


                    € 500 000,–


                    € 0,–


                    € 1 000 000,–




                    3


                    € 2 000 000,–


                    € 0,–


                    € 4 000 000,–
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel179
  - number: '179.3'
    text: |-
      In afwijking van het eerste en tweede lid kan de toezichthouder de hoogte van de bestuurlijke boete vaststellen
      op ten hoogste twee keer het bedrag van het voordeel dat de overtreder door de overtreding heeft verkregen indien
      diens voordeel groter is dan € 2 000 000.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel179
  - number: '184.1'
    text: |-
      Indien tegen een besluit tot het opleggen van een bestuurlijke boete bezwaar of beroep wordt aangetekend, schorst
      dit de verplichting tot betaling van de bestuurlijke boete totdat de beroepstermijn is verstreken of, indien beroep
      is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel184
  - number: '184.2'
    text: De schorsing van een verplichting tot betaling schorst niet de berekening van de wettelijke rente.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel184
  - number: '188.1'
    text: |-
      De toezichthouder kan met het oog op de bescherming van de belangen van de pensioen- of aanspraakgerechtigden ter
      openbare kennis brengen, indien nodig onder vermelding van de overwegingen die tot die kennisgeving hebben geleid:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel188
  - number: 188.1.a
    text: |-
      overtreding van de verbodsbepalingen uit deze wet en de overtredingen, bedoeld in [artikel 201][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel201
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '201'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 188.1.b
    text: |-
      het feit ter zake waarvan een aanwijzing is gegeven, het overtreden voorschrift, het feit dat de aanwijzing is
      gegeven en de door de pensioenuitvoerder te volgen gedragslijn, alsmede de naam, het adres en de vestigingsplaats
      van de pensioenuitvoerder aan wie de aanwijzing is gegeven;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel188
  - number: 188.1.c
    text: |-
      het feit ter zake waarvan een last onder dwangsom of een bestuurlijke boete is opgelegd, het overtreden
      voorschrift, het feit dat de last onder dwangsom of de bestuurlijke boete is opgelegd, alsmede de naam, het adres
      en de vestigingsplaats van de overtreder aan wie de last onder dwangsom of de bestuurlijke boete is opgelegd;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel188
  - number: 188.1.d
    text: |-
      het feit dat een herstelplan als bedoeld in [artikel 138][ref1] of [artikel 140][ref2] is ingediend, alsmede de
      naam, het adres en de vestigingsplaats van het pensioenfonds dat het herstelplan heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel140
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '140'
        hoofdstuk: '6'
  - number: '188.2'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld ter zake van de uitoefening van de bevoegdheden,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel188
  - number: '189.1'
    text: |-
      De toezichthouder stelt, indien hij besluit een openbare kennisgeving uit te zullen vaardigen als bedoeld in
      [artikel 188][ref1] de betrokken pensioenuitvoerder in kennis van het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel188
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '188'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '189.2'
    text: |-
      De beschikking vermeldt in ieder geval de geconstateerde overtreding, de inhoud van de kennisgeving, de gronden
      waarop het besluit berust alsmede de wijze waarop en de termijn waarna de openbare kennisgeving zal worden
      uitgevaardigd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel189
  - number: '190.1'
    text: |-
      Het ter openbare kennis brengen geschiedt niet eerder dan nadat vijf werkdagen zijn verstreken na de bekendmaking
      van de beschikking, bedoeld in [artikel 189][ref1], aan de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel189
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel190
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '189'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '190.2'
    text: |-
      Indien de betrokkene verzoekt om een voorlopige voorziening, bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1], wordt de werking van de beschikking opgeschort totdat er
      een uitspraak is van de voorzieningenrechter van de rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel190
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '191'
    text: |-
      De toezichthouder maakt een besluit tot het aanstellen van een bewindvoerder ingevolge deze wet na bekendmaking
      openbaar, tenzij de openbaarmaking van het besluit in strijd is of zou kunnen komen met het doel van het door de
      toezichthouder uit te oefenen toezicht op de naleving van deze wet.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel191
  - number: '192'
    text: |-
      De vergunning, bedoeld in [artikel 125, onderdeel a][ref1], wordt op aanvraag door de toezichthouder verleend
      wanneer het pensioenfonds:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel125
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel192
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '125'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 192.a
    text: |-
      is ingeschreven in het register, bedoeld in [artikel 210][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel210
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel192
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '210'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: 192.b
    text: |-
      voldoet aan de [artikelen 24][ref1], [26][ref2], [38 tot en met 46][ref3], [105][ref4], [126][ref5], [143][ref6]
      en [147, tweede lid][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel105
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel126
      [ref6]: https://wetten.overheid.nl/BWBR0020809#Artikel143
      [ref7]: https://wetten.overheid.nl/BWBR0020809#Artikel147
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel192
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '105'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref5
        bwb_id: BWBR0020809
        artikel: '126'
        hoofdstuk: '6'
      - id: ref6
        bwb_id: BWBR0020809
        artikel: '143'
        hoofdstuk: '6'
      - id: ref7
        bwb_id: BWBR0020809
        artikel: '147'
        hoofdstuk: '6'
  - number: '193'
    text: |-
      De toezichthouder kan de vergunning, bedoeld in [artikel 125, onderdeel a][ref1], geheel of gedeeltelijk intrekken
      of daaraan nadere voorschriften verbinden wanneer:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel125
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel193
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '125'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 193.a
    text: |-
      het pensioenfonds niet langer voldoet aan [artikel 192][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel192
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel193
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '192'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 193.b
    text: |-
      de bij de aanvraag verstrekte gegevens onjuist of onvolledig zijn en de verstrekking van de juiste of volledige
      gegevens tot een andere beschikking op de aanvraag tot verlening van de vergunning zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel193
  - number: 193.c
    text: de verlening van de vergunning anderszins onjuist was en het fonds dit wist of behoorde te weten; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel193
  - number: 193.d
    text: |-
      van de vergunning gedurende twee jaren, na de dagtekening van de beschikking waarbij de vergunning is verleend,
      geen gebruik is gemaakt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel193
  - number: '194.1'
    text: |-
      Een pensioenfonds stelt de toezichthouder in kennis van een voornemen bijdragen te gaan ontvangen van een
      bijdragende onderneming met zetel in een andere lidstaat dan Nederland.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel194
  - number: '194.2'
    text: 'De kennisgeving, bedoeld in het eerste lid, gaat vergezeld van een opgave van:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel194
  - number: 194.2.a
    text: |-
      de lidstaat waarvan de voor bedrijfspensioenvoorziening geldende sociale en arbeidswetgeving van toepassing is op
      de rechtsverhouding tussen de bijdragende onderneming en de werknemers of op degene die een vrij beroep uitoefent;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel194
  - number: 194.2.b
    text: de naam van de bijdragende onderneming; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel194
  - number: 194.2.c
    text: de voornaamste kenmerken van de pensioenregeling die voor die onderneming zal worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel194
  - number: '195.1'
    text: |-
      De toezichthouder doet binnen drie maanden na ontvangst van de gegevens, bedoeld in
      [artikel 194, tweede lid][ref1], mededeling van deze gegevens aan de bevoegde autoriteiten van de lidstaat waarvan
      de voor bedrijfspensioenvoorziening geldende sociale en arbeidswetgeving van toepassing is op de rechtsverhouding
      tussen de bijdragende onderneming en de werknemers, tenzij het pensioenfonds niet beschikt over de vergunning,
      bedoeld in [artikel 125][ref2], of de toezichthouder reden heeft te betwijfelen dat de administratieve structuur of
      de financiële positie van het pensioenfonds, of de deskundigheid en betrouwbaarheid van de personen die het fonds
      besturen met de in die lidstaat voorgenomen activiteiten verenigbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel194
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel125
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel195
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '194'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '125'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '195.2'
    text: |-
      De toezichthouder doet gelijktijdig mededeling aan het fonds van de verstrekking van de gegevens aan de bevoegde
      autoriteiten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel195
  - number: '195.3'
    text: |-
      De toezichthouder doet mededeling aan het fonds van informatie over de toepasselijke bepalingen van sociale en
      arbeidswetgeving, ontvangen van de bevoegde autoriteiten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel195
  - number: '196.1'
    text: |-
      Een pensioenfonds kan na ontvangst van de mededeling, bedoeld in [artikel 195, derde lid][ref1], dan wel nadat twee
      maanden zijn verstreken na ontvangst van de mededeling, bedoeld in [artikel 195, tweede lid][ref2], beginnen met
      het uitvoeren van de voorgenomen pensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel195
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel195
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '195'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '195'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '196.2'
    text: |-
      Het pensioenfonds neemt bij de uitvoering van de pensioenregeling de op bedrijfspensioenvoorziening toepasselijke
      sociale en arbeidswetgeving en de voorschriften die krachtens de artikelen 11 en 18, zevende lid, van [richtlijn
      2003/41/EG](32003L0041) moeten worden nageleefd, in acht. De Nederlandse sociale en arbeidswetgeving is niet van
      toepassing op de uitvoering van de pensioenregeling.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel196
  - number: '197.1'
    text: |-
      De toezichthouder verbiedt een pensioenfonds bijdragen te ontvangen van een onderneming met een zetel in een andere
      lidstaat wanneer de toezichthouder reden heeft tot twijfel als bedoeld in [artikel 195, eerste lid][ref1], of het
      fonds niet beschikt over een vergunning als bedoeld in [artikel 125, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel195
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel125
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel197
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '195'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '125'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '197.2'
    text: |-
      De toezichthouder kan een fonds verbieden nog langer bijdragen te ontvangen van een bijdragende onderneming
      met zetel in een andere lidstaat wanneer door de bevoegde autoriteiten van de lidstaat waarvan de voor
      bedrijfspensioenvoorziening geldende sociale en arbeidswetgeving van toepassing is, melding heeft gemaakt van een
      door het fonds gemaakte inbreuk op de toepasselijke sociale en arbeidswetgeving.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel197
  - number: '197.3'
    text: |-
      De toezichthouder legt een verbod als bedoeld in dit artikel op in de vorm van een aanwijzing als bedoeld in
      [artikel 171][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel171
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel197
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '171'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '198'
    text: |-
      De toezichthouder neemt, in coördinatie met de bevoegde autoriteiten van de lidstaat waarvan de voor
      bedrijfspensioenvoorziening geldende sociale en arbeidswetgeving van toepassing is op de pensioenregeling, de
      nodige maatregelen om ervoor te zorgen dat een pensioenfonds een einde maakt aan een vastgestelde inbreuk op de
      toepasselijke regelgeving.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel198
  - number: '199'
    text: |-
      Het is een pensioeninstelling uit een andere lidstaat verboden bijdragen te aanvaarden van een in Nederland zetel
      hebbende bijdragende onderneming zonder:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel199
  - number: 199.a
    text: |-
      een daartoe verleende vergunning van de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit een
      andere lidstaat haar zetel heeft; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel199
  - number: 199.b
    text: |-
      de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling zetel heeft in kennis te hebben gesteld van het
      voornemen een pensioenregeling uit te voeren voor een in Nederland gevestigde bijdragende onderneming.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel199
  - number: '200.1'
    text: |-
      De toezichthouder informeert, binnen twee maanden na de datum van ontvangst van gegevens als bedoeld in
      [artikel 194][ref1], tweede lid, de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit een andere
      lidstaat haar zetel heeft en die deze gegevens hebben verstrekt, over de bepalingen van de Nederlandse sociale
      en arbeidswetgeving die van toepassing zijn op de pensioenregeling waaraan wordt bijgedragen door de in Nederland
      zetel hebbende bijdragende onderneming en de [artikelen 38 tot en met 46][ref2] en [52][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel194
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel52
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '194'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '200.2'
    text: |-
      De toezichthouder stelt de bevoegde autoriteiten, bedoeld in het eerste lid, in kennis van elke significante
      wijziging in de op de pensioenregeling toepasselijke sociale en arbeidswetgeving die gevolgen kan hebben voor
      de kenmerken van de pensioenregeling en voorts van iedere wijziging in de [artikelen 38 tot en met 46][ref1] en
      [52][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel52
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '201'
    text: |-
      Wanneer de toezichthouder blijkt dat een pensioeninstelling uit een andere lidstaat bij de uitvoering van een
      pensioenregeling waaraan wordt bijgedragen door een in Nederland zetel hebbende bijdragende onderneming in strijd
      met de Nederlandse sociale en arbeidswetgeving of de [artikelen 38 tot en met 46][ref1] en [52][ref2] handelt,
      stelt de toezichthouder de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling haar zetel heeft
      hiervan onverwijld in kennis, onder mededeling van deze kennisgeving aan de pensioeninstelling uit een andere
      lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel52
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '202.1'
    text: |-
      Indien een pensioeninstelling uit een andere lidstaat inbreuk blijft maken op de op de pensioenregeling
      toepasselijke Nederlandse sociale en arbeidswetgeving, in weerwil van de door de bevoegde autoriteiten van de
      lidstaat waar de pensioeninstelling uit een andere lidstaat haar zetel heeft getroffen maatregelen of omdat
      die bevoegde autoriteiten geen passende maatregelen hebben getroffen, kan de toezichthouder, na die bevoegde
      autoriteiten daarvan in kennis te hebben gesteld, passende maatregelen nemen om de inbreuk op de toepasselijke
      regelgeving door de pensioeninstelling te beëindigen en, voorzover zulks volstrekt noodzakelijk is, de
      pensioeninstelling te beletten activiteiten te verrichten voor de Nederlandse bijdragende onderneming.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel202
  - number: '202.2'
    text: |-
      De toezichthouder kan, ter uitvoering van het eerste lid, de bevoegdheden, bedoeld in de [artikelen 171][ref1],
      [175][ref2] en [176][ref3] toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel171
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel175
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel176
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel202
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '171'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '175'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '176'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '202.3'
    text: |-
      De toezichthouder kan, na toepassing van [artikel 201][ref1], de bevoegdheden, bedoeld in de [artikelen 171][ref2],
      [175][ref3] en [176][ref4] toepassen wanneer een pensioeninstelling uit een andere lidstaat [artikel 199][ref5]
      niet naleeft.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel201
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel171
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel175
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel176
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel199
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel202
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '201'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '171'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '175'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '176'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref5
        bwb_id: BWBR0020809
        artikel: '199'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '203.1'
    text: |-
      De toezichthouder verstrekt op verzoek, kosteloos, aan Onze Minister alle gegevens en inlichtingen die voor
      het door Onze Minister te voeren beleid inzake pensioen en het onderzoek naar de toereikendheid van deze wet
      noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel203
  - number: '203.2'
    text: |-
      De toezichthouder beheert ten behoeve van de uitvoering van de in het eerste lid bedoelde taak een databank,
      stelt een informatieplan en een beheersplan op en zendt deze plannen aan Onze Minister. De toezichthouder zendt
      wijzigingen in het informatieplan en het beheersplan aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel203
  - number: '203.3'
    text: |-
      Pensioenuitvoerders en werkgevers verstrekken de toezichthouder desgevraagd en kosteloos alle gegevens en
      inlichtingen die deze nodig heeft voor het vervullen van de in het eerste lid beschreven taak.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel203
  - number: '203.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de in de databank op te nemen
      gegevens en inlichtingen, de wijze waarop de gegevens en inlichtingen worden verwerkt en beheerd en de instellingen
      aan wie gegevens uit de databank worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel203
  - number: '204.1'
    text: |-
      Het is een ieder die uit hoofde van de toepassing van deze wet of van ingevolge deze wet genomen besluiten enige
      taak vervult of heeft vervuld, verboden van vertrouwelijke gegevens of inlichtingen die ingevolge deze wet dan wel
      ingevolge [afdeling 5.2 van de Algemene wet bestuursrecht][ref1] zijn verstrekt of verkregen of van een persoon of
      instantie als bedoeld in [artikel 203, derde lid][ref2], onderscheidenlijk [205, eerste lid][ref3], zijn ontvangen,
      verder of anders gebruik te maken of daaraan verder of anders bekendheid te geven dan voor de uitvoering van zijn
      taak of door deze wet wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.2
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel203
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel205
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel204
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '5.2'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '203'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '205'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: '204.2'
    text: |-
      In afwijking van het eerste lid kan de toezichthouder met gebruikmaking van vertrouwelijke gegevens of inlichtingen
      verkregen bij de uitvoering van zijn taak op grond van deze wet, mededelingen doen, indien deze niet kunnen worden
      herleid tot afzonderlijke personen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel204
  - number: '205.1'
    text: |-
      De toezichthouder kan, in afwijking van [artikel 204, eerste lid][ref1], vertrouwelijke gegevens of inlichtingen
      verkregen bij de uitvoering van zijn taak op grond van deze wet, verstrekken aan de andere toezichthouder of een
      toezichthoudende instantie, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel204
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel205
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '204'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: 205.1.a
    text: het doel waarvoor de vertrouwelijke gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel205
  - number: 205.1.b
    text: |-
      het beoogde gebruik van de vertrouwelijke gegevens of inlichtingen niet past in het kader van het toezicht op
      pensioenuitvoerders;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel205
  - number: 205.1.c
    text: |-
      de verstrekking van de vertrouwelijke gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de
      openbare orde;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel205
  - number: 205.1.d
    text: de geheimhouding van de vertrouwelijke gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel205
  - number: 205.1.e
    text: |-
      de verstrekking van de vertrouwelijke gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met
      de belangen die deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel205
  - number: 205.1.f
    text: |-
      onvoldoende is gewaarborgd dat de vertrouwelijke gegevens of inlichtingen niet zullen worden gebruikt voor een
      ander doel dan waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel205
  - number: '205.2'
    text: |-
      Voorzover de gegevens of inlichtingen, bedoeld in het eerste lid, zijn verkregen van een toezichthoudende
      instantie, verstrekt de toezichthouder deze niet aan de andere toezichthouder of aan een andere toezichthoudende
      instantie, tenzij de toezichthoudende instantie waarvan de gegevens of inlichtingen zijn verkregen uitdrukkelijk
      heeft ingestemd met de verstrekking van de gegevens of inlichtingen en in voorkomend geval heeft ingestemd met het
      gebruik voor een ander doel dan waarvoor de gegevens of inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel205
  - number: '205.3'
    text: |-
      Indien een toezichthoudende instantie aan de toezichthouder die de vertrouwelijke gegevens of inlichtingen op grond
      van het eerste of tweede lid heeft verstrekt, verzoekt om die vertrouwelijke gegevens of inlichtingen te mogen
      gebruiken voor een ander doel dan waarvoor zij zijn verstrekt, willigt de toezichthouder dat verzoek slechts in:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel205
  - number: 205.3.a
    text: indien het beoogde gebruik niet in strijd is met het eerste of tweede lid; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel205
  - number: 205.3.b
    text: |-
      voorzover die toezichthoudende instantie op een andere wijze dan in deze wet voorzien vanuit Nederland met
      inachtneming van de daarvoor geldende wettelijke procedures voor dat andere doel de beschikking over die gegevens
      of inlichtingen zou kunnen verkrijgen; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel205
  - number: 205.3.c
    text: |-
      na overleg met Onze Minister van Justitie indien het in de aanhef bedoelde verzoek betrekking heeft op een
      onderzoek naar strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel205
  - number: '205.4'
    text: |-
      De Autoriteit Financiële Markten dan wel het organisatieonderdeel van de Nederlandsche Bank N.V. dat is belast
      met de in [artikel 151, derde lid][ref1], genoemde taak kan vertrouwelijke informatie of gegevens verstrekken aan
      het organisatieonderdeel van de Nederlandsche Bank N.V. dat is belast met het vervullen van haar monetaire taak,
      voorzover de vertrouwelijke gegevens of inlichtingen dienstig zijn voor de uitoefening van die taak.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel151
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel205
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '151'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '205.5'
    text: |-
      Het eerste tot en met derde lid is van overeenkomstige toepassing op het uitwisselen van vertrouwelijke gegevens of
      inlichtingen tussen de met verschillende taken belaste organisatieonderdelen van de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel205
  - number: '206.1'
    text: |-
      De toezichthouder kan, in afwijking van [artikel 204, eerste lid][ref1], vertrouwelijke gegevens of inlichtingen
      verkregen bij de uitvoering van de hem ingevolge deze wet opgedragen taak, verstrekken aan een persoon als bedoeld
      in de onderdelen a, b, c, d, of e voorzover de gegevens of inlichtingen dienstig zijn voor de uitoefening van zijn
      taak:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel204
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel206
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '204'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: 206.1.a
    text: |-
      een bewindvoerder die ingevolge [artikel 173][ref1] is benoemd;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel173
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel206
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '173'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 206.1.b
    text: |-
      een rechter-commissaris die ingevolge [artikel 223a van de Faillissementswet][ref1] is benoemd;


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel223a
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel206
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 223a
  - number: 206.1.c
    text: |-
      een bewindvoerder die ingevolge [artikel 215, tweede lid, van de Faillissementswet][ref1] is benoemd;


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel215
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel206
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '215'
  - number: 206.1.d
    text: |-
      een rechter-commissaris die ingevolge [artikel 14 van de Faillissementswet][ref1] is benoemd;


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel14
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel206
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '14'
  - number: 206.1.e
    text: |-
      een curator die ingevolge [artikel 14 van de Faillissementswet][ref1] is aangesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel14
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel206
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '14'
  - number: '206.2'
    text: 'De toezichthouder verstrekt geen vertrouwelijke gegevens of inlichtingen als bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel206
  - number: 206.2.a
    text: |-
      indien de verstrekking van de vertrouwelijke gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen
      komen met de belangen die deze wet beoogt te beschermen;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel206
  - number: 206.2.b
    text: |-
      indien de vertrouwelijke gegevens of inlichtingen zijn verkregen van de andere toezichthouder of een
      toezichthoudende instantie, en deze andere toezichthouder of die toezichthoudende instantie niet instemt met het
      verstrekken van de vertrouwelijke gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel206
  - number: '206.3'
    text: |-
      De curator die is aangesteld in het faillissement van een pensioenuitvoerder kan, in afwijking van
      [artikel 204, eerste lid][ref1], vertrouwelijke gegevens of inlichtingen als bedoeld in het eerste lid verstrekken
      aan de rechtbank, voorzover die geen betrekking hebben op een onderneming die betrokken is of betrokken is geweest
      bij een poging de pensioenuitvoerder in staat te stellen zijn activiteiten voort te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel204
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel206
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '204'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: '206.4'
    text: |-
      [Artikel 204, eerste lid][ref1], laat onverlet de toepasselijkheid van de bepalingen van het
      [Wetboek van Burgerlijke Rechtsvordering][ref2] welke betrekking hebben op het als getuige of als partij in een
      comparitie van partijen dan wel als deskundige in burgerlijke zaken afleggen van een verklaring omtrent gegevens
      of inlichtingen verkregen bij de vervulling van zijn ingevolge deze wet opgedragen taak, voorzover het gaat om
      vertrouwelijke gegevens of inlichtingen omtrent een pensioenuitvoerder die in staat van faillissement is verklaard
      of op grond van een rechterlijke uitspraak is ontbonden. De vorige volzin is niet van toepassing op vertrouwelijke
      gegevens of inlichtingen die betrekking hebben op een onderneming die betrokken is of betrokken is geweest bij een
      poging de desbetreffende pensioenuitvoerder in staat te stellen zijn activiteiten voort te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel204
      [ref2]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel206
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '204'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref2
        bwb_id: BWBR0001827
  - number: '207.1'
    text: |-
      De toezichthouder kan, in afwijking van [artikel 204][ref1], vertrouwelijke gegevens of inlichtingen verkregen
      bij de uitvoering van de hem ingevolge deze wet opgedragen taak, verstrekken aan een instantie die is belast met
      de uitoefening van strafvorderlijke bevoegdheden of aan een deskundige die door een dergelijke instantie met een
      opdracht is belast, voor zover de verlangde gegevens of inlichtingen noodzakelijk zijn voor de uitvoering van die
      opdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel204
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '204'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: '207.2'
    text: |-
      Indien de instantie, bedoeld in het eerste lid, het voornemen heeft toepassing te geven aan de bevoegdheid
      tot het bij de toezichthouder vorderen van de uitlevering van een voor inbeslagneming vatbaar voorwerp
      of aan de bevoegdheid tot het vorderen van de inzage of een afschrift van bescheiden als bedoeld in
      [artikel 96a][ref1], [105][ref2] of [126a van het Wetboek van Strafvordering][ref3], of [artikel 18][ref4] of
      [19 van de Wet op de economische delicten][ref5], en de vordering betreft vertrouwelijke gegevens of inlichtingen
      als bedoeld in [artikel 204, eerste lid][ref6], stelt die instantie voorafgaand aan de uitoefening van haar
      bevoegdheid de toezichthouder in de gelegenheid zijn zienswijze hierover kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel96a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel105
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel126a
      [ref4]: https://wetten.overheid.nl/BWBR0002063#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0002063#Artikel19
      [ref6]: https://wetten.overheid.nl/BWBR0020809#Artikel204
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 96a
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '105'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 126a
      - id: ref4
        bwb_id: BWBR0002063
        artikel: '18'
      - id: ref5
        bwb_id: BWBR0002063
        artikel: '19'
      - id: ref6
        bwb_id: BWBR0020809
        artikel: '204'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: '208.1'
    text: |-
      De toezichthouder kan, in afwijking van [artikel 204, eerste lid][ref1], vertrouwelijke gegevens of inlichtingen
      verkregen bij de vervulling van de hem ingevolge deze wet opgedragen taak, verstrekken aan:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel204
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel208
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '204'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: 208.1.a
    text: |-
      een accountant die het onderzoek naar de staten uitvoert, bedoeld in [artikel 147, vijfde lid][ref1], of die is
      belast met de wettelijke controle van de jaarrekening van een pensioenuitvoerder, voorzover de vertrouwelijke
      gegevens of inlichtingen betrekking hebben op die pensioenuitvoerder en noodzakelijk zijn voor de controle; of


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel147
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel208
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '147'
        hoofdstuk: '6'
  - number: 208.1.b
    text: |-
      een actuaris die het onderzoek naar de staten uitvoert, bedoeld in [artikel 147, vierde lid][ref1], of die is
      belast met de wettelijke controle van een pensioenuitvoerder, voorzover de vertrouwelijke gegevens of inlichtingen
      betrekking hebben op die pensioenuitvoerder en noodzakelijk zijn voor de controle.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel147
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel208
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '147'
        hoofdstuk: '6'
  - number: '208.2'
    text: 'De toezichthouder verstrekt geen vertrouwelijke gegevens of inlichtingen op grond van het eerste lid indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel208
  - number: 208.2.a
    text: het doel waarvoor de vertrouwelijke gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel208
  - number: 208.2.b
    text: |-
      het beoogde gebruik van de vertrouwelijke gegevens of inlichtingen niet past in het kader van het toezicht op
      pensioenuitvoerders;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel208
  - number: 208.2.c
    text: |-
      de verstrekking van de vertrouwelijke gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de
      openbare orde;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel208
  - number: 208.2.d
    text: de geheimhouding van de vertrouwelijke gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel208
  - number: 208.2.e
    text: |-
      de verstrekking van de vertrouwelijke gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met
      de belangen die deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel208
  - number: 208.2.f
    text: |-
      onvoldoende is gewaarborgd dat de vertrouwelijke gegevens of inlichtingen niet zullen worden gebruikt voor een
      ander doel dan waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel208
  - number: '208.3'
    text: |-
      Voorzover de gegevens of inlichtingen, bedoeld in het eerste lid, zijn verkregen van een toezichthoudende
      instantie, verstrekt de toezichthouder deze niet aan de andere toezichthouder of aan een andere toezichthoudende
      instantie, tenzij de toezichthoudende instantie waarvan de gegevens of inlichtingen zijn verkregen uitdrukkelijk
      heeft ingestemd met de verstrekking van de gegevens of inlichtingen en in voorkomend geval heeft ingestemd met het
      gebruik voor een ander doel dan waarvoor de gegevens of inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel208
  - number: '208.4'
    text: |-
      Indien een instantie of persoon als bedoeld in het eerste lid aan de toezichthouder die de vertrouwelijke gegevens
      of inlichtingen op grond van dat lid heeft verstrekt, verzoekt om die vertrouwelijke gegevens of inlichtingen te
      mogen gebruiken voor een ander doel dan waarvoor zij zijn verstrekt, willigt de toezichthouder dat verzoek slechts
      in:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel208
  - number: 208.4.a
    text: indien het beoogde gebruik niet in strijd is met het eerste, tweede of derde lid; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel208
  - number: 208.4.b
    text: |-
      voorzover die instantie of persoon op een andere wijze dan in deze wet voorzien met inachtneming van de daarvoor
      geldende wettelijke procedures voor dat andere doel de beschikking over die gegevens of inlichtingen zou kunnen
      verkrijgen; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel208
  - number: 208.4.c
    text: |-
      na overleg met Onze Minister van Justitie indien het in de aanhef bedoelde verzoek betrekking heeft op een
      onderzoek naar strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel208
  - number: '209'
    text: De toezichthouder organiseert ten minste één keer per jaar een overleg met belanghebbenden aangaande pensioenen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel209
  - number: '210'
    text: |-
      De toezichthouder beheert een register waarin alle pensioenfondsen met zetel in Nederland worden ingeschreven. In
      het register wordt, indien van toepassing, vermeld in welke lidstaten een fonds pensioenregelingen uitvoert.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel210
  - number: '211'
    text: |-
      De toezichthouder is verplicht nauw samen te werken met de Europese Commissie en de bevoegde autoriteiten uit
      andere lidstaten dan Nederland, overeenkomstig [richtlijn 2003/41/EG](32003L0041).
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel211
  - number: '212.1'
    text: |-
      De toezichthouder kan desgevraagd in bijzondere gevallen van het bepaalde bij of krachtens
      [artikel 147, eerste en tweede lid][ref1], ontheffing verlenen, indien hij van oordeel is, dat de belangen van de
      personen die betrokken zijn bij een pensioenregeling voldoende gewaarborgd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel147
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '147'
        hoofdstuk: '6'
  - number: '212.2'
    text: |-
      De toezichthouder kan desgevraagd in bijzondere gevallen van het bepaalde bij of krachtens de [artikelen 99][ref1],
      [100][ref2], [101][ref3], [109][ref4] en [110][ref5] ontheffing verlenen, indien het pensioenfonds ook
      pensioenregelingen uitvoert waarop de sociale en arbeidswetgeving van een andere lidstaat van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel101
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel109
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel110
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '99'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '100'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '101'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '109'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref5
        bwb_id: BWBR0020809
        artikel: '110'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '212.3'
    text: De ontheffing wordt verleend bij beschikking.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel212
  - number: '213.1'
    text: De ontheffing kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel213
  - number: '213.2'
    text: Aan de ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel213
  - number: '213.3'
    text: 'De ontheffing kan worden ingetrokken wanneer:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel213
  - number: 213.3.a
    text: een of meer van de redenen waarom zij is verleend is of zijn vervallen;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel213
  - number: 213.3.b
    text: |-
      na de verlening zich zodanige feiten of omstandigheden hebben voorgedaan of zijn gebleken dat, indien deze ook ten
      tijde van de verlening bekend waren geweest, de ontheffing niet of niet in die vorm zou zijn verleend;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel213
  - number: 213.3.c
    text: een of meer van de daaraan verbonden voorschriften niet wordt nageleefd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel213
  - number: '213.4'
    text: De toezichthouder stelt beleidsregels vast over de verlening van ontheffing.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel213
  - number: '214.1'
    text: |-
      Onze Minister zendt jaarlijks het jaarverslag, de verantwoording en alle andere van belang zijnde door de
      toezichthouder aan Onze Minister uitgebrachte toezichtrapportages, in de vorm waarin zij aan hem zijn voorgelegd,
      zonodig voorzien van zijn oordeel, aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel214
  - number: '214.2'
    text: |-
      Onze Minister zendt elke vijf jaar een verslag aan de Staten-Generaal over de doelmatigheid en doeltreffendheid van
      het functioneren van de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel214
  - number: '215.1'
    text: |-
      Overtreding van de [artikelen 23][ref1], [102][ref2], [167][ref3], [169][ref4],
      [170, eerste tot en met vierde lid][ref5], en [172, vijfde lid, onderdeel a][ref6], wordt gestraft met een
      geldboete van de tweede categorie. Overtreding van [artikel 171, eerste lid][ref7], wordt gestraft met een
      geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel102
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel167
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel169
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel170
      [ref6]: https://wetten.overheid.nl/BWBR0020809#Artikel172
      [ref7]: https://wetten.overheid.nl/BWBR0020809#Artikel171
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel215
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '102'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '167'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '169'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref5
        bwb_id: BWBR0020809
        artikel: '170'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref6
        bwb_id: BWBR0020809
        artikel: '172'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref7
        bwb_id: BWBR0020809
        artikel: '171'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '215.2'
    text: |-
      Met een geldboete van de tweede categorie wordt gestraft overtreding van voorschriften, krachtens deze wet bij
      algemene maatregel van bestuur gegeven, voor zover uitdrukkelijk als strafbaar feit in de zin dezer wet aangeduid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel215
  - number: '215.3'
    text: De in of krachtens dit artikel strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel215
  - number: '216'
    text: |-
      Zaken betreffende vorderingen uit hoofde van een pensioenovereenkomst, een uitvoeringsovereenkomst, een
      uitvoeringsreglement of een pensioenreglement worden door de kantonrechter behandeld en beslist.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel216
  - number: '217.1'
    text: |-
      De deelnemersraad kan bij de ondernemingskamer van het gerechtshof te Amsterdam beroep instellen tegen een besluit
      betreffende een aangelegenheid als bedoeld in [artikel 111, eerste lid][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel111
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '111'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 217.1.a
    text: |-
      de deelnemersraad met betrekking tot dat besluit niet voorafgaand in de gelegenheid is gesteld advies uit te
      brengen;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel217
  - number: 217.1.b
    text: dat besluit niet in overeenstemming is met het advies van de deelnemersraad; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel217
  - number: 217.1.c
    text: |-
      feiten en omstandigheden bekend zijn geworden die, waren zij aan de deelnemersraad bekend geweest ten tijde van
      het uitbrengen van zijn advies, aanleiding zouden kunnen zijn geweest om dat advies niet uit te brengen zoals het
      is uitgebracht.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel217
  - number: '217.2'
    text: |-
      Het beroep wordt ingediend bij verzoekschrift, binnen acht weken nadat de deelnemersraad van het besluit in kennis
      is gesteld.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel217
  - number: '217.3'
    text: Het pensioenfonds wordt van het ingestelde beroep in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel217
  - number: '217.4'
    text: |-
      Het verzoek is niet-ontvankelijk indien met betrekking tot dezelfde aangelegenheid een aanwijzing is gegeven door
      de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel217
  - number: '217.5'
    text: |-
      Het beroep kan uitsluitend worden ingesteld terzake dat het pensioenfonds bij afweging van de betrokken belangen
      niet in redelijkheid tot zijn besluit had kunnen komen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel217
  - number: '217.6'
    text: |-
      De ondernemingskamer behandelt het verzoek met de meeste spoed. Alvorens te beslissen kan zij, ook ambtshalve,
      deskundigen, alsmede bij het pensioenfonds werkzame personen horen. Indien de ondernemingskamer het beroep gegrond
      bevindt, kan zij, indien de deelnemersraad daarom heeft verzocht, een of meer van de volgende voorzieningen
      treffen:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel217
  - number: 217.6.a
    text: |-
      het opleggen van de verplichting aan het pensioenfonds om het besluit geheel of ten dele in te trekken, alsmede om
      aan te wijzen gevolgen van dat besluit ongedaan te maken;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel217
  - number: 217.6.b
    text: |-
      het opleggen van een verbod aan het pensioenfonds om handelingen te verrichten of te doen verrichten ter uitvoering
      van het besluit of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel217
  - number: '217.7'
    text: |-
      Het pensioenfonds moet aan de getroffen voorziening voldoen; een voorziening kan door derden verworven rechten
      echter niet aantasten.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel217
  - number: '217.8'
    text: |-
      De ondernemingskamer kan haar beslissing op een verzoek tot het treffen van voorzieningen voor een door haar te
      bepalen termijn aanhouden, indien beide partijen daar om verzoeken, dan wel indien het pensioenfonds op zich neemt
      het besluit waartegen beroep is ingesteld, in te trekken of te wijzigen, of bepaalde gevolgen van het besluit
      ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel217
  - number: '217.9'
    text: |-
      Nadat het verzoekschrift is ingediend kan de ondernemingskamer, zo nodig onverwijld, voorlopige voorzieningen
      treffen. De derde zin van het zesde lid en het zevende lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel217
  - number: '217.10'
    text: Van een beschikking van de ondernemingskamer staat uitsluitend beroep in cassatie open.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel217
  - number: '217.11'
    text: |-
      De kosten van het voeren van rechtsgedingen door de deelnemersraad komen ten laste van het pensioenfonds indien zij
      redelijkerwijs noodzakelijk zijn voor de vervulling van de taak van de deelnemersraad en het pensioenfonds van de
      te maken kosten vooraf in kennis is gesteld. In rechtsgedingen tussen het pensioenfonds en de deelnemersraad kan de
      deelnemersraad niet in de proceskosten worden veroordeeld.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel217
  - number: '218.1'
    text: |-
      Een geleding binnen de deelnemersraad kan bij de ondernemingskamer van het gerechtshof te Amsterdam beroep
      instellen tegen een besluit als bedoeld in [artikel 111, tweede lid, onderdeel f of g][ref1], van het
      pensioenfonds, wanneer dat besluit niet in overeenstemming is met het advies van de deelnemersraad.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel111
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel218
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '111'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '218.2'
    text: |-
      [Artikel 217, tweede tot en met elfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel217
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel218
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '217'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: '219.1'
    text: |-
      Het verantwoordingsorgaan, bedoeld in [artikel 33, eerste lid, onderdeel a][ref1], kan een verzoek in het kader van
      het recht van enquête, bedoeld in [afdeling 2 van titel 8 van Boek 2 van het Burgerlijk Wetboek][ref2], indienen
      bij de ondernemingskamer van het gerechtshof te Amsterdam indien voorafgaand aan de indiening van dat verzoek het
      intern toezicht, bedoeld in [artikel 33, eerste lid, onderdeel b][ref3], zich daarover heeft uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel33
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0003045
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '219.2'
    text: |-
      De [artikelen 346 tot en met 359 van Boek 2 van het Burgerlijk Wetboek][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel346
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '346'
  - number: '219.3'
    text: |-
      De kosten die verband houden met het indienen van het in het eerste lid bedoelde verzoek komen ten laste
      van het pensioenfonds indien zij redelijkerwijs noodzakelijk zijn voor de vervulling van de taak van het
      verantwoordingsorgaan en het pensioenfonds van de te maken kosten vooraf in kennis is gesteld.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel219
  - number: '220'
    text: |-
      Indien beroep wordt ingesteld tegen een besluit op grond van deze wet is, in afwijking van
      [artikel 8:7 van de Algemene wet bestuursrecht][ref1], de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel220
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '221'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag
      over de doeltreffendheid en de effecten van deze wet in de praktijk op het terrein van communicatie, toezicht en
      administratieve lasten.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel221
  - number: '222'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel222
  - number: '223'
    text: 'Deze wet wordt aangehaald als: Pensioenwet.'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel223
