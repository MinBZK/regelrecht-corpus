  - number: '125.2'
    text: |-
      Voor de toepassing van het eerste lid, [artikel 140, derde lid, onderdeel b][ref1],
      [artikel 141, tweede lid][ref2], en de [paragrafen 7.4.2][ref3] en [7.4.3][ref4] wordt onder het ontvangen van
      bijdragen verstaan het ontvangen van bijdragen voor de uitvoering van een pensioenregeling die afkomstig is uit een
      andere lidstaat dan de lidstaat waar het pensioenfonds gevestigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel140
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '140'
