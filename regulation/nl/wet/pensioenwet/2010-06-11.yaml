  - number: '5.2'
    text: |-
      Het verminderen of vervallen van een uitkering op grond van een verzekeringsovereenkomst als bedoeld in het eerste
      lid op basis van [artikel 930, derde tot en met vijfde lid, van Boek 7 van het Burgerlijk Wetboek][ref1] is niet
      mogelijk, tenzij door een persoon met wie een pensioenovereenkomst is gesloten of door een persoon voor wie een
      op grond van deze wet met de pensioenovereenkomst gelijkgestelde rechtsbetrekking geldt, niet is voldaan aan de
      in [artikel 928 van Boek 7 van het Burgerlijk Wetboek][ref2] omschreven mededelingsplicht betreffende zijn risico.
      In dat geval beperkt de vermindering of het verval van de uitkering zich tot het risico met betrekking tot de in
      de eerste zin bedoelde persoon. Voorzover de eerste zin in de weg staat aan vermindering dan wel verval van een
      uitkering, heeft het pensioenfonds of de verzekeraar een recht van verhaal op de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel930
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel928
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '930'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '928'
  - number: '5.3'
    text: |-
      Een beding als bedoeld in [artikel 941, vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref1] is nietig wanneer
      dit is opgenomen in een verzekeringsovereenkomst als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel941
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '941'
  - number: '5.4'
    text: |-
      Voor zover bepalingen van de [titels 17][ref1] en [18 van Boek 7 van het Burgerlijk Wetboek][ref2] in strijd
      zijn met het bij of krachtens deze wet bepaalde blijven die bepalingen van het [Burgerlijk Wetboek][ref3] buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
      [ref2]: https://wetten.overheid.nl/BWBR0005290
      [ref3]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005290
      - id: ref2
        bwb_id: BWBR0005290
      - id: ref3
        bwb_id: BWBR0005290
  - number: '6'
    text: |-
      De [Wet op het financieel toezicht][ref1] is niet van toepassing op de verhouding tussen een verzekeraar en een
      aanspraak- of pensioengerechtigde, tenzij in deze wet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '7.1'
    text: |-
      De werkgever informeert de werknemer binnen een maand na aanvang van de werkzaamheden schriftelijk of hij de
      werknemer al dan niet een aanbod tot het sluiten van een pensioenovereenkomst doet, en zo ja, binnen welke termijn
      het aanbod wordt gedaan en wie de pensioenuitvoerder is.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel7
  - number: '7.2'
    text: |-
      Indien de werkgever de werknemer op basis van het eerste lid heeft medegedeeld dat hem geen aanbod tot het sluiten
      van een pensioenovereenkomst zal worden gedaan, maar de werkgever op een later tijdstip alsnog een aanbod tot het
      sluiten van een pensioenovereenkomst doet, informeert hij de werknemer hierover schriftelijk.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel7
  - number: '7.3'
    text: |-
      Indien een pensioenovereenkomst is gesloten, maar de werknemer nog geen pensioen verwerft, informeert de werkgever
      de werknemer daarover en geeft de werkgever daarbij aan:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel7
  - number: 7.3.a
    text: aan welke voorwaarden voldaan moet worden om de verwerving van pensioenaanspraken te laten beginnen; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel7
  - number: 7.3.b
    text: welke diensttijd in het kader van de pensioenovereenkomst relevant is.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel7
  - number: '7.4'
    text: |-
      Indien de werkgever niet heeft voldaan aan het eerste of tweede lid, wordt een werkgever geacht aan een
      werknemer een onherroepelijk aanbod tot het sluiten van een pensioenovereenkomst gedaan te hebben, indien die
      werknemer behoort tot dezelfde groep van werknemers, aan wie de werkgever al een aanbod tot het sluiten van een
      pensioenovereenkomst heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel7
  - number: '8.1'
    text: |-
      Ingeval een werkgever aan een of meer werknemers een aanbod doet tot het sluiten van een pensioenovereenkomst, mag
      deze werkgever het doen van een aanbod aan een andere werknemer niet achterwege laten vanwege het enkele feit dat
      die andere werknemer minder dan de volledige arbeidstijd werkt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel8
  - number: '8.2'
    text: |-
      Indien als voorwaarde voor het verwerven van pensioenaanspraken op basis van een pensioenovereenkomst het
      overstijgen van een minimumloongrens wordt gesteld, wordt voor de toepassing van die loongrens het loon van een
      werknemer die minder dan de volledige arbeidstijd werkzaam is, herleid naar het loon dat ingeval van een volledige
      arbeidstijd zou zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel8
  - number: '8.3'
    text: |-
      Bij de vaststelling van aanspraken op ouderdoms- en nabestaandenpensioen worden aan werknemers die minder dan de
      volledige arbeidstijd werkzaam zijn, pensioenaanspraken verleend naar evenredigheid van de pensioenaanspraken die
      ingeval van een volledige arbeidstijd zouden zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel8
  - number: '8.4'
    text: |-
      Bij de vaststelling van aanspraken op arbeidsongeschiktheidspensioen die aan de pensioenovereenkomst kunnen worden
      ontleend, is onderscheid op grond van het enkele feit van de omvang van de arbeidstijd niet toegestaan, met dien
      verstande dat bij de vaststelling van het arbeidsongeschiktheidspensioen rekening gehouden mag worden met een
      uitkering uit hoofde van de [Wet werk en inkomen naar arbeidsvermogen][ref1] voorzover die uitkering verband houdt
      met dezelfde dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: '8.5'
    text: |-
      In geval een werkgever aan een of meer werknemers een aanbod doet tot het sluiten van een pensioenovereenkomst, mag
      deze werkgever het doen van een aanbod aan een andere werknemer niet achterwege laten vanwege het enkele feit dat
      die werknemer een bepaalde leeftijd nog niet heeft bereikt, tenzij:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel8
  - number: 8.5.a
    text: de werknemer jonger is dan 21 jaar; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel8
  - number: 8.5.b
    text: |-
      het een ouderdomspensioen betreft dat uitsluitend voorziet in een uitkering tot het bereiken van de
      pensioenleeftijd op grond van de [Algemene Ouderdomswet][ref1] of tot het bereiken van de pensioenleeftijd voor het
      levenslange ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: '9'
    text: |-
      Door de overgang van een onderneming, bedoeld in [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref1], waarbij
      de vervreemder met de aan die onderneming verbonden werknemers geen pensioenovereenkomst heeft gesloten, wordt,
      indien de verkrijger met zijn werknemers vóór het tijdstip van de overgang een pensioenovereenkomst heeft gesloten,
      de verkrijger geacht op het moment van de overgang het aanbod tot het sluiten van een zelfde pensioenovereenkomst
      te hebben gedaan aan de werknemers van de vervreemder.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
  - number: '10'
    text: 'De pensioenovereenkomst houdt in:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel10
  - number: 10.a
    text: een uitkeringsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel10
  - number: 10.b
    text: een kapitaalovereenkomst; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel10
  - number: 10.c
    text: een premieovereenkomst.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel10
  - number: '11'
    text: |-
      De uitkering, het kapitaal en de premie in het kader van een pensioenovereenkomst worden vastgesteld in Nederlands
      wettig betaalmiddel.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel11
  - number: '12.1'
    text: |-
      De werkgever kan zich bij het sluiten of bij een wijziging van de pensioenovereenkomst het recht voorbehouden de
      premiebetaling, voorzover deze betrekking heeft op de bijdrage van de werkgever, te verminderen of beëindigen in
      geval van een ingrijpende wijziging van omstandigheden.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel12
  - number: '12.2'
    text: |-
      Andere bedingen dan die bedoeld in het eerste lid, waarin een voorbehoud wordt gemaakt inzake premiebetaling, zijn
      nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel12
  - number: '13'
    text: |-
      In de pensioenovereenkomst wordt bepaald of er toeslagen worden verleend en, zo ja, wat het ambitieniveau is en
      welke voorwaarden gelden bij de toeslagverlening.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel13
  - number: '14.1'
    text: |-
      Het verwerven van ouderdomspensioenaanspraken op basis van een pensioenovereenkomst begint uiterlijk op de 21-
      jarige leeftijd van de werknemer of op de latere datum van indiensttreding, tenzij het een ouderdomspensioen
      betreft dat uitsluitend voorziet in een uitkering tot het bereiken van de pensioenleeftijd op grond van de
      [Algemene Ouderdomswet][ref1] of tot het bereiken van de pensioenleeftijd voor het levenslange ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: '14.2'
    text: |-
      Het in het eerste lid genoemde tijdstip waarop de verwerving begint kan, indien in de
      pensioenovereenkomst is voorzien in een wachttijd of drempelperiode, met betrekking tot ouderdompensioen
      worden uitgesteld met ten hoogste twee maanden of, indien sprake is van een uitzendovereenkomst
      als bedoeld in [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref1], tot de werknemer
      in meer dan 26 weken arbeid heeft verricht. Voor de berekening van de termijn van 26 weken is
      [artikel 691, vierde en vijfde lid, van Boek 7 van het Burgerlijk Wetboek][ref2] van overeenkomstige
      toepassing. Wachttijden of drempelperioden zijn niet toegestaan voor het nabestaandenpensioen en het
      arbeidsongeschiktheidspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel690
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel691
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '690'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '691'
  - number: '14.3'
    text: |-
      In geval een werkgever die nog geen enkele pensioenovereenkomst heeft gesloten of die alleen een
      pensioenovereenkomst heeft gesloten met werknemers die tot een bepaalde groep behoren, over gaat tot het
      sluiten van een of meer pensioenovereenkomsten, geldt ten aanzien van zijn werknemers die bij het sluiten van de
      pensioenovereenkomst ouder zijn dan 21 jaar, niet de eis dat de verwerving van pensioen op 21-jarige leeftijd moet
      zijn begonnen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel14
  - number: '14.4'
    text: Elk beding in strijd met het eerste lid en tweede lid is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel14
  - number: '15.1'
    text: |-
      Indien een pensioenovereenkomst voorziet in een ouderdomspensioen, wordt in de overeenkomst bepaald dat dat
      pensioen levenslang wordt uitgekeerd aan de gepensioneerde, tenzij het ouderdomspensioen uitsluitend voorziet in
      een uitkering tot het bereiken van de pensioenleeftijd op grond van de [Algemene Ouderdomswet][ref1] of tot het
      bereiken van de pensioenleeftijd voor het levenslange ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: '15.2'
    text: Elk beding in strijd met het eerste lid is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel15
  - number: '16.1'
    text: |-
      Indien een pensioenovereenkomst voorziet in een partnerpensioen ten behoeve van een partner met wie de deelnemer
      niet gehuwd is, noch een geregistreerd partnerschap heeft, gelden voor deze partner ten aanzien van de wijze van
      vaststelling van het partnerpensioen dezelfde rechten en plichten als voor een gehuwde of geregistreerde partner.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel16
  - number: '16.2'
    text: Elk beding in strijd met het eerste lid is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel16
  - number: '17'
    text: |-
      De verwerving van pensioenaanspraken in het kader van een uitkeringsovereenkomst of een kapitaalovereenkomst vindt
      gedurende de deelneming ten minste evenredig in de tijd plaats.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel17
  - number: 17a
    text: Het doorberekenen van kosten in het kader van een premieovereenkomst vindt evenredig in de tijd plaats.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel17a
  - number: '18.1'
    text: |-
      In geval van verlaging van de pensioengrondslag van een werknemer worden de op grond van de pensioenovereenkomst
      tot het tijdstip van verlaging opgebouwde pensioenaanspraken niet gewijzigd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel18
  - number: '18.2'
    text: |-
      In geval van verlaging van de pensioengrondslag blijven de opgebouwde pensioenaanspraken behouden en worden de
      pensioenaanspraken vastgesteld overeenkomstig [artikel 55][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel55
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '18.3'
    text: Elk beding in strijd met het eerste of tweede lid is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel18
  - number: '19'
    text: |-
      Een werkgever kan de pensioenovereenkomst zonder instemming van de werknemer wijzigen indien de bevoegdheid daartoe
      schriftelijk in de pensioenovereenkomst is opgenomen en er tevens sprake is van een zodanig zwaarwichtig belang van
      de werkgever dat het belang van de werknemer dat door de wijziging zou worden geschaad daarvoor naar maatstaven van
      redelijkheid en billijkheid moet wijken.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel19
  - number: '20'
    text: |-
      In geval van een wijziging van een pensioenovereenkomst worden de voor de aanspraakgerechtigden tot het tijdstip
      van wijziging opgebouwde pensioenaanspraken niet gewijzigd, behoudens het bepaalde in de [artikelen 76][ref1],
      [78][ref2], [83][ref3] en [134][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel83
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '78'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '83'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '134'
        hoofdstuk: '6'
  - number: '21.1'
    text: |-
      De werkgever draagt er zorg voor dat de werknemer waarmee hij een pensioenovereenkomst heeft gesloten en die
      pensioenaanspraken verwerft, binnen drie maanden na de start van de verwerving door de pensioenuitvoerder wordt
      geïnformeerd over:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel21
  - number: 21.1.a
    text: de inhoud van de basispensioenregeling;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel21
  - number: 21.1.b
    text: de toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel21
  - number: 21.1.c
    text: het recht van de werknemer om bij de pensioenuitvoerder het voor hem geldende pensioenreglement op te vragen;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel21
  - number: 21.1.d
    text: het bestaan van een vrijwillige pensioenregeling;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel21
  - number: 21.1.e
    text: omstandigheden die betrekking hebben op het functioneren van de pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel21
  - number: 21.1.f
    text: |-
      het recht van de werknemer om bij de pensioenuitvoerder een verzoek in te dienen voor een berekening van de
      effecten van uitruil op zijn pensioenaanspraak.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel21
  - number: '21.2'
    text: |-
      De werkgever informeert de pensioenuitvoerder over iedere wijziging in de pensioenovereenkomst, bedoeld in
      het eerste lid. De pensioenuitvoerder informeert de werknemer binnen drie maanden na een wijziging in de
      pensioenovereenkomst over die wijziging en de mogelijkheid om het gewijzigde pensioenreglement op te vragen bij
      de pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel21
  - number: '21.3'
    text: |-
      Het eerste lid is niet van toepassing indien de werkgever uiterlijk zes maanden voor het sluiten van de
      pensioenovereenkomst met de werknemer een eerdere pensioenovereenkomst met dezelfde werknemer heeft gesloten op
      grond waarvan de werknemer de in het eerste lid bedoelde informatie heeft ontvangen. Informatie die sinds de vorige
      verstrekking is gewijzigd wordt wel verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel21
  - number: '21.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de inhoud en de wijze van verstrekking
      van de in dit artikel bedoelde informatie.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel21
  - number: '22.1'
    text: |-
      De werkgever stelt een vereniging van pensioengerechtigden in de gelegenheid haar oordeel uit te spreken over een
      voorgenomen besluit van de werkgever in het kader van een uitvoeringsovereenkomst met een verzekeraar indien:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel22
  - number: 22.1.a
    text: dit besluit van invloed is op de uitvoering of de hoogte van pensioenrechten van gepensioneerden; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel22
  - number: 22.1.b
    text: |-
      de som van het aantal werknemers en het aantal gepensioneerden dat een pensioenovereenkomst heeft gesloten met de
      werkgever op dat moment gelijk is of meer bedraagt dan 250.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel22
  - number: '22.2'
    text: |-
      Een vereniging van pensioengerechtigden als bedoeld in het eerste lid dient volledige rechtsbevoegdheid te bezitten
      en tevens te voldoen aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel22
  - number: 22.2.a
    text: |-
      haar statutaire doel omvat in elk geval het behartigen van de belangen van de gepensioneerden die in dienst zijn
      geweest bij de werkgever;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel22
  - number: 22.2.b
    text: ten minste 10% van alle gepensioneerden die in dienst zijn geweest bij de werkgever is lid van de vereniging;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel22
  - number: 22.2.c
    text: de vereniging meldt haar bestaan bij de werkgever en de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel22
  - number: '22.3'
    text: |-
      Het oordeel van een vereniging van pensioengerechtigden wordt op een zodanig tijdstip gevraagd dat het van invloed
      kan zijn op het in het eerste lid bedoelde besluit.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel22
  - number: '22.4'
    text: |-
      Bij het vragen van een oordeel wordt aan de vereniging van pensioengerechtigden een overzicht verstrekt van de
      beweegredenen voor het besluit en van de gevolgen die het besluit naar verwachting voor de deelnemers, gewezen
      deelnemers, gepensioneerden en andere pensioengerechtigden zal hebben.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel22
  - number: '22.5'
    text: |-
      De werkgever verstrekt desgevraagd aan een vereniging van pensioengerechtigden tijdig alle inlichtingen en
      gegevens, die deze voor het vormen van haar oordeel redelijkerwijze nodig heeft. De inlichtingen worden desgevraagd
      schriftelijk verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel22
  - number: '22.6'
    text: |-
      De verzekeraar informeert de pensioengerechtigden, die pensioen ontvangen op grond van een pensioenovereenkomst met
      de in het eerste lid bedoelde werkgever, over het bestaan van een vereniging van pensioengerechtigden als bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel22
  - number: '23.1'
    text: |-
      De werkgever brengt een pensioenovereenkomst, uiterlijk wanneer een werknemer pensioenaanspraken verwerft, onder
      door onmiddellijk een schriftelijke uitvoeringsovereenkomst te sluiten met en in stand te houden bij:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel23
  - number: 23.1.a
    text: een pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel23
  - number: 23.1.b
    text: |-
      een pensioeninstelling uit een andere lidstaat die beschikt over een daartoe verleende vergunning als bedoeld in
      [artikel 199][ref1] en de bevoegde autoriteiten in kennis heeft gesteld overeenkomstig [artikel 199][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel199
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel199
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '199'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '199'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 23.1.c
    text: |-
      een verzekeraar met een zetel buiten Nederland, mits die verzekeraar op grond van de
      [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van levensverzekeraar of schadeverzekeraar mag
      uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '23.2'
    text: |-
      De in het eerste lid opgenomen verplichting van de werkgever tot het sluiten en instandhouden van een schriftelijke
      uitvoeringsovereenkomst geldt niet bij uitvoering door een bedrijfstakpensioenfonds:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel23
  - number: 23.2.a
    text: |-
      mits de werkgever gehouden is of zich verbonden heeft door lid te zijn van een werkgeversvereniging tot naleving
      van de statuten en reglementen van dit bedrijfstakpensioenfonds; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel23
  - number: 23.2.b
    text: |-
      een uitvoeringsreglement door het bedrijfstakpensioenfonds is opgesteld dat voldoet aan de eisen die in
      [artikel 25][ref1] ten aanzien van de uitvoeringsovereenkomst zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel25
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '23.3'
    text: |-
      De in het eerste lid opgenomen verplichtingen van de werkgever tot onderbrenging en het sluiten en in stand houden
      van een schriftelijke uitvoeringsovereenkomst gelden niet wanneer een pensioenovereenkomst is gesloten door een
      werkgever die tevens pensioenuitvoerder is, mits:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel23
  - number: 23.3.a
    text: |-
      de pensioenovereenkomsten van deze werknemers worden ondergebracht bij de werkgever in zijn hoedanigheid van
      pensioenuitvoerder; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel23
  - number: 23.3.b
    text: een uitvoeringsreglement door de werkgever is opgesteld.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel23
  - number: '23.4'
    text: |-
      Wanneer een werkgever het voornemen heeft een pensioenovereenkomst onder te brengen bij een pensioeninstelling
      uit een andere lidstaat of bij een pensioenfonds dat op grond van [artikel 212][ref1] ontheffing heeft
      gekregen van het bepaalde in de [artikelen 99][ref2], [100][ref3], [101][ref4], [109][ref5] en [110][ref6], is
      [artikel 27 van de Wet op de ondernemingsraden][ref7] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel212
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel99
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel100
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel101
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel109
      [ref6]: https://wetten.overheid.nl/BWBR0020809#Artikel99
      [ref7]: https://wetten.overheid.nl/BWBR0002747#Artikel27
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '212'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '99'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '100'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '101'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref5
        bwb_id: BWBR0020809
        artikel: '109'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref6
        bwb_id: BWBR0020809
        artikel: '99'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref7
        bwb_id: BWBR0002747
        artikel: '27'
  - number: '24'
    text: |-
      De werkgever voldoet de pensioenuitvoerder de verschuldigde premie, tenzij er sprake is van voldoening door de
      gewezen werknemer in geval van een vrijwillige voortzetting als bedoeld in [artikel 54][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel54
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '54'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '25.1'
    text: |-
      In de uitvoeringsovereenkomst wordt in ieder geval een regeling opgenomen met betrekking tot de volgende
      onderwerpen:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel25
  - number: 25.1.a
    text: de wijze waarop de verschuldigde premie wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel25
  - number: 25.1.b
    text: |-
      de wijze waarop en termijnen waarin de verschuldigde premie moet worden voldaan met inachtneming van
      [artikel 26][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel26
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 25.1.c
    text: de informatie welke door de werkgever aan de pensioenuitvoerder wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel25
  - number: 25.1.d
    text: de procedures welke gelden bij het niet nakomen van premiebetalingsverplichtingen door de werkgever;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel25
  - number: 25.1.e
    text: |-
      de procedures welke gelden bij het opstellen en wijzigen van het pensioenreglement in verband met het sluiten en
      wijzigen van een pensioenovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel25
  - number: 25.1.f
    text: de voorwaarden waaronder toeslagverlening plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel25
  - number: 25.1.g
    text: |-
      de uitgangspunten en procedures welke gelden ten aanzien van de besluitvorming over vermogenstekorten en
      vermogensoverschotten dan wel winstdeling; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel25
  - number: 25.1.h
    text: |-
      de voorwaarden die gelden bij beëindiging van een met een verzekeraar gesloten uitvoeringsovereenkomst. In deze
      regeling worden de belangen van zowel de verzekeraar als de werkgever vanuit actuarieel en bedrijfseconomisch
      oogpunt op evenwichtige wijze gewaarborgd door rekening te houden met:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel25
  - number: 25.1.h.1°
    text: de overige voorwaarden in de uitvoeringsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel25
  - number: 25.1.h.2°
    text: de gehanteerde tarieven; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel25
  - number: 25.1.h.3°
    text: de winstdelingsvorm.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel25
  - number: '25.2'
    text: |-
      In de uitvoeringsovereenkomst wordt, voor zover overeengekomen, een regeling opgenomen met betrekking tot de
      volgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel25
  - number: 25.2.a
    text: |-
      een voorbehoud van de werkgever als bedoeld in [artikel 12][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel12
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 25.2.b
    text: |-
      in geval van premiekorting of terugstorting: de voorwaarden waaronder sprake is van premiekorting of terugstorting,
      de wijze van vaststelling van de hoogte van de premiekorting of terugstorting en de bestemming ervan;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel25
  - number: 25.2.c
    text: |-
      ingeval van een bijstortingsverplichting van de werkgever: onder welke voorwaarden sprake is van een
      bijstortingsverplichting en hoe de hoogte ervan wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel25
  - number: 25.2.d
    text: de mogelijkheid tot vrijwillige voortzetting van de pensioenregeling na beëindiging van het dienstverband;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel25
  - number: 25.2.e
    text: |-
      de aansluitingscriteria op grond waarvan de vrijwillige aansluiting bij een bedrijfstakpensioenfonds heeft
      plaatsgevonden; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel25
  - number: 25.2.f
    text: de rechten en verplichtingen met betrekking tot vrijwillige pensioenregelingen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel25
  - number: '26'
    text: |-
      In de uitvoeringsovereenkomst wordt vastgelegd hoe de betaling van de premies door de werkgever aan de
      pensioenuitvoerder geschiedt, waarbij aan de volgende voorwaarden wordt voldaan:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel26
  - number: 26.a
    text: |-
      een werkgever voldoet uiterlijk binnen een maand na afloop van elk kwartaal de werkgeverspremie en de op het loon
      van de werknemer ingehouden werknemerspremie, welke over dat kwartaal zijn verschuldigd, aan de pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel26
  - number: 26.b
    text: |-
      wanneer de premie op basis van een langere termijn dan een kwartaal wordt vastgesteld en in rekening gebracht, is
      deze termijn ten hoogste gelijk aan een jaar en voldoet de werkgever uiterlijk binnen een maand na afloop van elk
      kwartaal een vierde gedeelte van de door hem op basis van zijn eigen bijdrage verschuldigde jaarpremie op basis
      van een schatting van de pensioenuitvoerder en de op het loon van de werknemer ingehouden werknemerspremie, aan de
      pensioenuitvoerder; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel26
  - number: 26.c
    text: |-
      de totale jaarpremie, bestaande uit de werkgeverspremie en de werknemerspremies, wordt uiterlijk binnen zes maanden
      na afloop van het kalenderjaar voldaan aan de pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel26
  - number: '27'
    text: |-
      De in [artikel 26][ref1] genoemde termijnen gelden niet indien sprake is van een beëindiging van de deelneming. In
      dat geval wordt de ten tijde van de beëindiging nog verschuldigde premie binnen dertien weken voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel26
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '28.1'
    text: |-
      Een pensioenfonds informeert elk kwartaal schriftelijk de deelnemersraad en, bij het ontbreken daarvan, de
      deelnemers, gewezen deelnemers en pensioengerechtigden wanneer sprake is van een premieachterstand ter grootte
      van 5% van de totale door het pensioenfonds te ontvangen jaarpremie en tevens niet voldaan wordt aan de bij of
      krachtens [artikel 131][ref1] geldende eisen inzake het minimaal vereist eigen vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel131
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '131'
        hoofdstuk: '6'
  - number: '28.2'
    text: |-
      Gedurende de in het eerste lid bedoelde situatie informeert een pensioenfonds tevens elk kwartaal de
      ondernemingsraad van de onderneming die nog premie aan het pensioenfonds verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel28
  - number: '28.3'
    text: |-
      Indien een ondernemingspensioenfonds op grond van [artikel 123, tweede of derde lid][ref1], gescheiden vermogens
      aanhoudt, worden de voorgaande twee leden toegepast per afgescheiden vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel123
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '123'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '29.1'
    text: |-
      Een verzekeraar informeert de deelnemers en de werkgever wanneer de premieachterstand het noodzakelijk maakt de
      opbouw van pensioenaanspraken te beëindigen door premievrijmaking of pensioenaanspraken zonder premievrije waarde
      te laten vervallen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel29
  - number: '29.2'
    text: |-
      Een verzekeraar kan de in het eerste lid bedoelde mededeling aan de deelnemers pas doen indien hij zich aantoonbaar
      heeft ingespannen om de achterstallige premie te innen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel29
  - number: '29.3'
    text: |-
      De verzekeraar kan op zijn vroegst drie maanden na de in het eerste lid bedoelde mededeling de opbouw van
      pensioenaanspraken beëindigen door premievrijmaking of pensioenaanspraken zonder premievrije waarde laten
      vervallen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel29
  - number: '29.4'
    text: |-
      De premievrijmaking, bedoeld in het derde lid, vindt op zijn vroegst plaats per de datum die vijf maanden voor het
      tijdstip van informeren van de deelnemers is gelegen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel29
  - number: '29.5'
    text: |-
      De dekking van het arbeidsongeschiktheidsrisico of het overlijdensrisico blijft volledig in stand tot drie maanden
      na de in het eerste lid bedoelde mededeling.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel29
  - number: '29.6'
    text: |-
      Bij de premievrijmaking wordt de verzekering premievrij voortgezet zonder verrekening van premie en rente met de
      pensioenaanspraken. Kosten, voor zover voortvloeiend uit het premievrij maken, worden evenmin verrekend met de
      pensioenaanspraken.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel29
  - number: '30'
    text: |-
      In een uitvoeringsovereenkomst met een verzekeraar met zetel buiten Nederland waarin bij de totstandkoming of op
      een later tijdstip wordt gekozen voor ander dan Nederlands recht, wordt de volgende clausule opgenomen: Ongeacht
      het gekozen rechtsstelsel is ten aanzien van deze uitvoeringsovereenkomst in ieder geval de Pensioenwet van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel30
  - number: '31'
    text: |-
      Verpanding van de uit de uitvoeringsovereenkomst voortvloeiende rechten door de werkgever of andere handelingen die
      door hem worden verricht waardoor aan anderen dan de aanspraak- of pensioengerechtigden rechten worden verleend,
      is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel31
  - number: '32'
    text: |-
      Een pensioenuitvoerder heeft tot taak een pensioenovereenkomst uit te voeren op basis van een
      uitvoeringsovereenkomst of een uitvoeringsreglement.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel32
  - number: '33.1'
    text: |-
      Een pensioenuitvoerder richt zijn organisatie zodanig in dat een goed bestuur is gewaarborgd waardoor er in ieder
      geval:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel33
  - number: 33.1.a
    text: |-
      verantwoording wordt afgelegd aan de aanspraak- en pensioengerechtigden en de werkgever; waarvoor bij
      pensioenfondsen een verantwoordingsorgaan is ingesteld; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel33
  - number: 33.1.b
    text: intern toezicht is.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel33
  - number: '33.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot het eerste lid regels worden gesteld. Die regels
      kunnen in het bijzonder betrekking hebben op de naleving van in die algemene maatregel van bestuur aan te wijzen
      principes voor goed pensioenfondsbestuur.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel33
  - number: '34.1'
    text: |-
      Indien een pensioenuitvoerder werkzaamheden uitbesteedt aan een derde draagt hij er zorg voor dat deze derde de bij
      of krachtens deze wet gestelde regels, die van toepassing zijn op de uitbestedende pensioenuitvoerder, naleeft.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel34
  - number: '34.2'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel34
  - number: 34.2.a
    text: werkzaamheden worden aangewezen die niet mogen worden uitbesteed;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel34
  - number: 34.2.b
    text: |-
      regels worden gesteld met betrekking tot de uitbesteding in verband met het toezicht op de naleving van het bij of
      krachtens deze wet bepaalde; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel34
  - number: 34.2.c
    text: regels worden gesteld met betrekking tot de beheersing van risico’s die verband houden met de uitbesteding.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel34
  - number: '35.1'
    text: |-
      De pensioenuitvoerder stelt een pensioenreglement vast in overeenstemming met de pensioenovereenkomst en de
      uitvoeringsovereenkomst of het uitvoeringsreglement.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel35
  - number: '35.2'
    text: 'In het pensioenreglement worden in ieder geval bepalingen opgenomen betreffende:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel35
  - number: 35.2.a
    text: de wijze waarop de pensioenuitvoerder omgaat met inkomende waarden in het kader van waardeoverdracht;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel35
  - number: 35.2.b
    text: |-
      de hoogte van de ruilvoet en de opbouwkeuzevoet, bedoeld in [artikel 60][ref1] en [61][ref2], en de afkoopvoet,
      bedoeld in [artikel 66][ref3]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '60'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 35.2.c
    text: |-
      de kortingsregel, bedoeld in [artikel 134][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '134'
        hoofdstuk: '6'
  - number: '36.1'
    text: |-
      De pensioenuitvoerder registreert de deelnemingsjaren van de deelnemers en verstrekt hierover informatie aan de
      deelnemers en gewezen deelnemers.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel36
  - number: '36.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste lid, waaronder de
      perioden die in aanmerking komen als deelnemingsjaren.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel36
  - number: '37'
    text: |-
      De pensioenuitvoerder sluit een overeenkomst met het Uitvoeringsinstituut werknemersverzekeringen op basis
      waarvan het Uitvoeringsinstituut werknemersverzekeringen de arbeidsongeschiktheid van een deelnemer aan de
      pensioenuitvoerder meldt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel37
  - number: '38.1'
    text: 'De pensioenuitvoerder verstrekt de deelnemer jaarlijks:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel38
  - number: 38.1.a
    text: een opgave van de verworven pensioenaanspraken;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel38
  - number: 38.1.b
    text: een opgave van de reglementair te bereiken pensioenaanspraken;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel38
  - number: 38.1.c
    text: informatie over toeslagverlening; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel38
  - number: 38.1.d
    text: |-
      een opgave van de aan het voorafgaande kalenderjaar toe te rekenen waardeaangroei van pensioenaanspraken
      overeenkomstig [artikel 3.127 van de Wet inkomstenbelasting 2001][ref1] en de daarop berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '38.2'
    text: |-
      De in het eerste lid bedoelde informatie wordt verstrekt in de vorm van een door de pensioenuitvoerders op te
      stellen uniform pensioenoverzicht.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel38
  - number: '38.3'
    text: |-
      De in het eerste lid bedoelde informatie kan in afwijking van het bepaalde in [artikel 49][ref1] elektronisch
      ter beschikking worden gesteld indien de verworven pensioenaanspraak minder bedraagt dan het op basis van
      [artikel 66][ref2] bepaalde bedrag, tenzij de deelnemer hiertegen bezwaar maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '38.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de in het eerste
      lid bedoelde opgaven en informatie en de wijze waarop deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel38
  - number: '39.1'
    text: 'De pensioenuitvoerder verstrekt de deelnemer bij beëindiging van de deelneming:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel39
  - number: 39.1.a
    text: |-
      een opgave van de opgebouwde pensioenaanspraken op grond van [artikel 55][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel55
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 39.1.b
    text: informatie over toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel39
  - number: 39.1.c
    text: informatie die voor de deelnemer specifiek in het kader van de beëindiging relevant is; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel39
  - number: 39.1.d
    text: informatie over omstandigheden die betrekking hebben op het functioneren van de pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel39
  - number: '39.2'
    text: |-
      De in het eerste lid bedoelde informatie kan in afwijking van het bepaalde in [artikel 49][ref1] elektronisch
      ter beschikking worden gesteld indien de verworven pensioenopbouw minder bedraagt dan het op basis van
      [artikel 66][ref2] bepaalde bedrag, tenzij de deelnemer hiertegen bezwaar maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '39.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid
      bedoelde opgave en informatie en de wijze waarop deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel39
  - number: '40.1'
    text: 'De pensioenuitvoerder verstrekt de gewezen deelnemer ten minste een keer in vijf jaar:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel40
  - number: 40.1.a
    text: een opgave van zijn opgebouwde pensioenaanspraken; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel40
  - number: 40.1.b
    text: informatie over toeslagverlening.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel40
  - number: '40.2'
    text: |-
      De pensioenuitvoerder informeert de gewezen deelnemer binnen drie maanden na een wijziging van het toeslagbeleid
      over die wijziging.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel40
  - number: '40.3'
    text: |-
      De in het eerste lid bedoelde informatie kan in afwijking van het bepaalde in [artikel 49][ref1] elektronisch
      ter beschikking worden gesteld indien de verworven pensioenopbouw minder bedraagt dan het op basis van
      [artikel 66][ref2] bepaalde bedrag, tenzij de gewezen deelnemer hiertegen bezwaar maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '40.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid
      bedoelde opgave en informatie en de wijze waarop deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel40
  - number: '41.1'
    text: |-
      De pensioenuitvoerder verstrekt degene die gewezen partner wordt en een aanspraak verkrijgt op bijzonder
      partnerpensioen:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel41
  - number: 41.1.a
    text: een opgave van de opgebouwde pensioenaanspraak op partnerpensioen;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel41
  - number: 41.1.b
    text: informatie over toeslagverlening; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel41
  - number: 41.1.c
    text: informatie die voor de gewezen partner specifiek van belang is.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel41
  - number: '41.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid
      bedoelde opgave en informatie en de wijze waarop deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel41
  - number: '42.1'
    text: 'De pensioenuitvoerder verstrekt de gewezen partner ten minste een keer in de vijf jaar:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel42
  - number: 42.1.a
    text: |-
      een opgave van zijn opgebouwde aanspraak op partnerpensioen op grond van [artikel 41][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel41
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 42.1.b
    text: informatie over toeslagverlening.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel42
  - number: '42.2'
    text: |-
      De pensioenuitvoerder informeert de gewezen partner binnen drie maanden na een wijziging van het toeslagbeleid over
      die wijziging.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel42
  - number: '42.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid
      bedoelde opgave en informatie en de wijze waarop deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel42
  - number: '43.1'
    text: 'De pensioenuitvoerder verstrekt degene die pensioengerechtigde wordt:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel43
  - number: 43.1.a
    text: een opgave van zijn pensioenrecht;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel43
  - number: 43.1.b
    text: een opgave van de opgebouwde aanspraken op nabestaandenpensioen wanneer de pensioenregeling daarin voorziet; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel43
  - number: 43.1.c
    text: informatie over toeslagverlening.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel43
  - number: '43.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid
      bedoelde opgaven en informatie en de wijze waarop deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel43
  - number: '44.1'
    text: 'De pensioenuitvoerder verstrekt de pensioengerechtigde jaarlijks:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel44
  - number: 44.1.a
    text: een opgave van zijn pensioenrecht;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel44
  - number: 44.1.b
    text: een opgave van de opgebouwde aanspraken op nabestaandenpensioen wanneer de pensioenregeling daarin voorziet; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel44
  - number: 44.1.c
    text: informatie over toeslagverlening.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel44
  - number: '44.2'
    text: |-
      De pensioenuitvoerder informeert de pensioengerechtigde binnen drie maanden na een wijziging van het toeslagbeleid
      over die wijziging.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel44
  - number: '44.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid
      bedoelde opgaven en informatie en de wijze waarop deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel44
  - number: '45.1'
    text: |-
      De pensioenuitvoerder informeert een deelnemer voorafgaand aan de deelneming in de vrijwillige pensioenregeling
      over:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel45
  - number: 45.1.a
    text: de inhoud van de vrijwillige pensioenregeling;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel45
  - number: 45.1.b
    text: een opgave van de reglementair te bereiken pensioenaanspraken uit hoofde van de vrijwillige pensioenregeling; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel45
  - number: 45.1.c
    text: de toeslagverlening.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel45
  - number: '45.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid
      bedoelde opgave en informatie en de wijze waarop deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel45
  - number: '46.1'
    text: |-
      De pensioenuitvoerder verstrekt de deelnemer, de gewezen deelnemer, de gewezen partner en de pensioengerechtigde
      op verzoek:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel46
  - number: 46.1.a
    text: het voor hem geldende pensioenreglement;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel46
  - number: 46.1.b
    text: het jaarverslag en de jaarrekening van de pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel46
  - number: 46.1.c
    text: de uitvoeringsovereenkomst of het uitvoeringsreglement;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel46
  - number: 46.1.d
    text: de voor hem relevante informatie over beleggingen; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel46
  - number: 46.1.e
    text: informatie over andere bij algemene maatregel van bestuur te bepalen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel46
  - number: '46.2'
    text: |-
      De pensioenuitvoerder verstrekt de deelnemer, de gewezen deelnemer en de gewezen partner op verzoek informatie
      die specifiek voor hem relevant is waaronder een indicatie van het mogelijk te bereiken kapitaal op de
      pensioendatum bij premieovereenkomsten waarbij de premie wordt belegd en een indicatie van de hoogte van de in
      te kopen periodieke uitkeringen bij aanwending van het mogelijk te bereiken kapitaal bij kapitaalovereenkomsten
      en premieovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel46
  - number: '46.3'
    text: |-
      De pensioenuitvoerder verstrekt de gewezen deelnemer op verzoek een opgave van de hoogte van zijn opgebouwde
      pensioenaanspraken.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel46
  - number: '46.4'
    text: |-
      De pensioenuitvoerder verstrekt de in het eerste lid bedoelde informatie op verzoek ook aan vertegenwoordigers van
      deelnemers, van gewezen deelnemers, van gewezen partners of van pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel46
  - number: '46.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in dit artikel bedoelde
      informatie en de wijze waarop deze wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel46
  - number: '47.1'
    text: |-
      De pensioenuitvoerder verstrekt deelnemers, gewezen deelnemers en gepensioneerden die zich in een andere lidstaat
      vestigen informatie over hun pensioenaanspraken en pensioenrechten en over de mogelijkheden die hun op grond van de
      pensioenregeling worden geboden.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel47
  - number: '47.2'
    text: |-
      De informatie die op grond van het eerste lid wordt verstrekt is ten minste overeenkomstig de informatie die wordt
      verstrekt aan deelnemers, gewezen deelnemers en gepensioneerden die in Nederland blijven.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel47
  - number: '48.1'
    text: |-
      De pensioenuitvoerder verstrekt de informatie, bedoeld in de [artikelen 21][ref1] en
      [38 tot en met 47][ref2], tijdig. De informatie, bedoeld in de [artikelen 21][ref3], [38 tot en met 45][ref4],
      [46, eerste lid, onderdeel d, tweede tot en met vierde lid][ref5], en [47][ref6] verstrekt de pensioenuitvoerder in
      duidelijke en begrijpelijke bewoordingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel38
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel46
      [ref6]: https://wetten.overheid.nl/BWBR0020809#Artikel47
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref5
        bwb_id: BWBR0020809
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref6
        bwb_id: BWBR0020809
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '48.2'
    text: |-
      De informatie over toeslagverlening, bedoeld in de [artikelen 21][ref1] en [38 tot en met 45][ref2], wordt in ieder
      geval uitgedrukt in een kwalitatieve en beeldende maatstaf.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel38
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '48.3'
    text: 'De in het tweede lid bedoelde maatstaf houdt in ieder geval rekening met:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel48
  - number: 48.3.a
    text: |-
      de verwachtingen ten aanzien van de toekomstige toeslagverlening, zoals deze uit de continuïteitsanalyse volgen en
      welke onderdeel zijn van de voorwaardelijkheidsverklaring, bedoeld in [artikel 95][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel95
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '95'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 48.3.b
    text: |-
      de te verwachten toeslagverlening in de pensioenovereenkomst afgezet tegen het minimale percentage van het
      gemiddelde prijsindexcijfer, bedoeld in [artikel 144, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel144
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '144'
        hoofdstuk: '6'
  - number: '48.4'
    text: Onze Minister kan regels stellen ten aanzien van het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel48
  - number: '49'
    text: |-
      De pensioenuitvoerder verstrekt de informatie schriftelijk, tenzij de deelnemer, gewezen deelnemer,
      pensioengerechtigde of gewezen partner instemt met elektronische verstrekking.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel49
  - number: '50.1'
    text: |-
      De pensioenuitvoerder kan zich voor het schriftelijk verstrekken van de informatie, bedoeld in de
      [artikelen 38 tot en met 44][ref1], houden aan het laatst hem bekende adres van de deelnemer, gewezen deelnemer,
      pensioengerechtigde of gewezen partner.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel38
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '50.2'
    text: |-
      Indien dit adres onjuist blijkt te zijn doet de pensioenuitvoerder navraag bij de gemeentelijke basisadministratie
      in de laatst bekende woonplaats van de deelnemer, gewezen deelnemer, pensioengerechtigde of gewezen partner.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel50
  - number: '50.3'
    text: |-
      Indien de pensioenuitvoerder kosten maakt in verband met werkzaamheden die voortvloeien uit het feit dat de
      deelnemer, gewezen deelnemer, pensioengerechtigde of gewezen partner verzuimd heeft de pensioenuitvoerder omtrent
      een wijziging van adres te informeren, kan de pensioenuitvoerder deze kosten bij deze in rekening brengen, maar
      kunnen deze kosten niet direct in mindering worden gebracht op de uitkering.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel50
  - number: '50.4'
    text: |-
      Indien het bij de pensioenuitvoerder bekende adres voor de elektronische verstrekking van informatie onjuist
      blijkt, verstrekt de pensioenuitvoerder de informatie schriftelijk.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel50
  - number: '51'
    text: De pensioenuitvoerders richten een pensioenregister in dat uiterlijk op 1 januari 2011 operationeel is.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel51
  - number: '52.1'
    text: |-
      Bij de uitvoering van een premieovereenkomst met beleggingsvrijheid is de pensioenuitvoerder verantwoordelijk voor
      de beleggingen en handelt daarbij overeenkomstig [artikel 135][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel135
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '135'
        hoofdstuk: '6'
  - number: '52.2'
    text: |-
      De pensioenuitvoerder biedt de deelnemer en de gewezen deelnemer de mogelijkheid de verantwoordelijkheid voor de
      beleggingen over te nemen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel52
  - number: '52.3'
    text: |-
      Indien de deelnemer of de gewezen deelnemer de verantwoordelijkheid voor de beleggingen heeft overgenomen,
      adviseert de pensioenuitvoerder de deelnemer of de gewezen deelnemer over de spreiding van de beleggingen in
      relatie tot de duur van de periode tot pensioendatum, waarbij het beleggingsrisico kleiner wordt naarmate de
      pensioendatum nadert.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel52
  - number: '52.4'
    text: |-
      De pensioenuitvoerder onderzoekt ten minste een keer per jaar of de beleggingen van de deelnemer of gewezen
      deelnemer zich binnen de op basis van het derde lid gestelde grenzen bevinden en informeert de deelnemer en de
      gewezen deelnemer hierover.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel52
  - number: '52.5'
    text: |-
      [Afdeling 4.2.3 van de Wet op het financieel toezicht][ref1] is van overeenkomstige toepassing op de in dit artikel
      bedoelde premieovereenkomsten ingeval de deelnemer of gewezen deelnemer de verantwoordelijkheid over de beleggingen
      heeft overgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Afdeling4.2.3
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0020368
        afdeling: 4.2.3
  - number: '52.6'
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels gesteld worden met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel52
  - number: '53'
    text: |-
      De pensioenuitvoerder betaalt de uitkering uit hoofde van een pensioenrecht op verzoek van de pensioengerechtigde
      in een andere lidstaat van de Europese Unie dan de lidstaat waar die pensioenuitvoerder is gevestigd, waarbij
      transactiekosten op de uitkering uit hoofde van het pensioenrecht in mindering kunnen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel53
  - number: '54.1'
    text: |-
      Een pensioenuitvoerder kan voor de deelnemer die gewezen werknemer wordt een vrijwillige voortzetting van de
      pensioenregeling uitvoeren indien de vrijwillige voortzetting gedurende ten hoogste drie jaar vanaf de beëindiging
      van de dienstbetrekking voortduurt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel54
  - number: '54.2'
    text: |-
      In afwijking van het eerste lid geldt een termijn van tien jaar voor zover de genoemde gewezen werknemer,
      aansluitend aan de beëindiging van de dienstbetrekking, gedurende die periode winst uit onderneming geniet als
      bedoeld in [artikel 3.8 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '54.3'
    text: 'Van de in het eerste lid genoemde termijn kan worden afgeweken indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel54
  - number: 54.3.a
    text: |-
      de deelnemer ten tijde van de beëindiging van de dienstbetrekking arbeidsongeschikt is. De periode waarin sprake
      kan zijn van vrijwillige voortzetting is dan ten hoogste drie jaar of de duur van de arbeidsongeschiktheid indien
      deze langer is; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel54
  - number: 54.3.b
    text: |-
      de deelnemer na de beëindiging van de dienstbetrekking een periodieke uitkering ontvangt ter vervanging van
      in verband met de beëindiging van de dienstbetrekking gederfde inkomsten op grond van een tussen één of meer
      werkgevers en één of meer werknemers afgesproken regeling. De periode waarin sprake kan zijn van vrijwillige
      voortzetting is dan ten hoogste drie jaar of de periode waarin de uitkering wordt ontvangen indien deze langer is.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel54
  - number: '54.4'
    text: |-
      De deelnemer die vrijwillig wil voortzetten doet binnen drie maanden vanaf de beëindiging van de dienstbetrekking
      het verzoek daartoe bij de pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel54
  - number: '55.1'
    text: |-
      Bij beëindiging van de deelneming behoudt de gewezen deelnemer de tot dat moment opgebouwde pensioenaanspraken
      indien er sprake is van een uitkeringsovereenkomst of een kapitaalovereenkomst. Deze pensioenaanspraak dient
      volledig gefinancierd te zijn op het moment van beëindiging. In geval van premievrijmaking op grond van
      [artikel 29, vierde lid][ref1], wordt daarmee bij de vaststelling van de opgebouwde aanspraken rekening gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel29
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '55.2'
    text: |-
      Bij een premieovereenkomst wordt bij beëindiging van de deelneming de vaststelling van de pensioenaanspraken als
      volgt uitgevoerd: het tot op dat moment ontstane kapitaal voortvloeiend uit de tot de beëindiging beschikbaar
      gestelde premies wordt:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel55
  - number: 55.2.a
    text: belegd tot de pensioendatum;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel55
  - number: 55.2.b
    text: aangewend voor de aankoop van een verzekerd kapitaal dat beschikbaar komt op de pensioendatum; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel55
  - number: 55.2.c
    text: |-
      aangewend voor een verzekerde levenslange uitkering vanaf de pensioendatum, al dan niet in combinatie met een
      aanspraak op nabestaandenpensioen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel55
  - number: '55.3'
    text: |-
      Indien de opzet van de premieovereenkomst zodanig is dat de beschikbaar gestelde premie direct, en niet pas bij de
      beëindiging van de deelneming, wordt aangewend voor een uitkering of kapitaal, dan geldt het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel55
  - number: '55.4'
    text: |-
      Deelnemers en andere aanspraakgerechtigden die na beëindiging van de deelneming aan een pensioenregeling naar een
      andere lidstaat van de Europese Unie verhuizen behouden hun pensioenaanspraak in dezelfde mate als deelnemers en
      andere aanspraakgerechtigden die na beëindiging van de deelneming in Nederland blijven.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel55
  - number: '55.5'
    text: |-
      Indien de pensioenovereenkomst voorziet in een partnerpensioen op risicobasis behoudt de deelnemer, die na
      beëindiging van de deelneming recht heeft op een uitkering op grond van de [Werkloosheidswet][ref1] gedurende de
      periode dat hij de uitkering ontvangt, aanspraak op partnerpensioen ten behoeve van zijn partner. De hoogte van het
      partnerpensioen wordt vastgesteld alsof hetzelfde pensioen op opbouwbasis zou zijn overeengekomen, waarbij rekening
      wordt gehouden met het partnerpensioen verkregen op grond van [artikel 61][ref2]. Dit lid is van overeenkomstige
      toepassing op de deelnemer, die na beëindiging van de deelneming recht heeft op werkloosheidsuitkering van zijn
      woonland.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel61
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '56'
    text: |-
      Indien de pensioenovereenkomst voorziet in een partnerpensioen is het opnemen van onbetaald verlof tot een
      maximum van 18 maanden door de deelnemer tijdens de deelneming niet van invloed op de dekking uit hoofde van het
      partnerpensioen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel56
  - number: '57.1'
    text: |-
      Indien de partnerrelatie van een deelnemer eindigt door scheiding verkrijgt de gewezen partner van de deelnemer
      een zodanige aanspraak op partnerpensioen als de deelnemer ten behoeve van die gewezen partner zou hebben behouden
      indien op het tijdstip van scheiding zijn deelneming zou zijn geëindigd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel57
  - number: '57.2'
    text: |-
      Indien de partnerrelatie van een gewezen deelnemer eindigt door scheiding, en de gewezen deelnemer ten behoeve van
      die partner een aanspraak op partnerpensioen heeft behouden bij beëindigen van de deelneming, gaat de aanspraak
      over op de gewezen partner van de gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel57
  - number: '57.3'
    text: |-
      Indien de partnerrelatie van een gepensioneerde eindigt door scheiding, en de gepensioneerde ten behoeve van
      die partner een aanspraak op partnerpensioen heeft behouden bij het ingaan van het ouderdomspensioen, gaat die
      aanspraak over op de gewezen partner van de gepensioneerde.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel57
  - number: '57.4'
    text: |-
      Het eerste, tweede en derde lid vindt geen toepassing indien de partners bij voorwaarden in verband met de
      partnerrelatie of een schriftelijk gesloten overeenkomst met betrekking tot de scheiding anders overeenkomen. Deze
      voorwaarden of overeenkomst zijn respectievelijk is slechts geldig indien de pensioenuitvoerder zich bereid heeft
      verklaard hiermee in te stemmen en bereid is een uit de afwijking voortvloeiend risico te dekken dan wel het niveau
      van de uitkering aan te passen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel57
  - number: '57.5'
    text: |-
      Een gewezen partner met een recht op bijzonder partnerpensioen als bedoeld in het eerste, tweede of derde lid,
      heeft het recht dit te vervreemden aan een eerdere of latere partner van de overleden deelnemer, gewezen deelnemer
      of gepensioneerde, mits:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel57
  - number: 57.5.a
    text: de pensioenuitvoerder bereid is een eventueel uit die overdracht voortvloeiende wijziging van het risico te dekken;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel57
  - number: 57.5.b
    text: de vervreemding onherroepelijk is; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel57
  - number: 57.5.c
    text: dit wordt overeengekomen bij notarieel verleden akte.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel57
  - number: '58.1'
    text: |-
      Indien een ouderdomspensioenrecht van een gepensioneerde die geen gewezen deelnemer is geweest wordt verhoogd
      door middel van een toeslag, wordt het ouderdomspensioenrecht van een gepensioneerde die wel gewezen deelnemer is
      geweest in dezelfde mate verhoogd indien zij in dezelfde pensioenregeling hebben deelgenomen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel58
  - number: '58.2'
    text: |-
      Indien een recht op partnerpensioen van de partner van een overleden gepensioneerde die geen gewezen deelnemer is
      geweest wordt verhoogd door middel van een toeslag, worden de partnerpensioenrechten:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel58
  - number: 58.2.a
    text: ten behoeve van de partners van overleden gepensioneerden die gewezen deelnemer zijn geweest;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel58
  - number: 58.2.b
    text: ten behoeve van de partners van overleden gewezen deelnemers;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel58
  - number: 58.2.c
    text: ten behoeve van de partners van overleden deelnemers; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel58
  - number: 58.2.d
    text: van de gewezen partners met een bijzonder partnerpensioen;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel58
  - number: '58.3'
    text: |-
      Indien een ouderdomspensioenrecht wordt verhoogd door middel van een toeslag, wordt de aanspraak op
      ouderdomspensioen van een gewezen deelnemer die in dezelfde pensioenregeling heeft deelgenomen in dezelfde mate
      verhoogd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel58
  - number: '58.4'
    text: |-
      Indien een aanspraak op partnerpensioen van een gepensioneerde die geen gewezen deelnemer is geweest wordt verhoogd
      door middel van een toeslag, worden de partnerpensioenaanspraken:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel58
  - number: 58.4.a
    text: ten behoeve van de partner van een gepensioneerde die wel gewezen deelnemer is geweest;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel58
  - number: 58.4.b
    text: ten behoeve van de partner van een gewezen deelnemer; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel58
  - number: 58.4.c
    text: van de gewezen partner van de gewezen deelnemer met een bijzonder partnerpensioen;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel58
  - number: '58.5'
    text: Bij de verlening van toeslagen op partnerpensioen wordt geen onderscheid gemaakt tussen partners.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel58
  - number: '58.6'
    text: |-
      Voor de toepassing van dit artikel wordt onder gewezen deelnemer niet verstaan de werknemer als bedoeld in
      [artikel 1, onderdeel g, van de Wet privatisering FVP][ref1] die recht heeft op een bijdrage van de Stichting
      Financiering Voortzetting Pensioenverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0009756#Artikel1
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0009756
        artikel: '1'
  - number: '59'
    text: |-
      Een rechtsvordering tegen een pensioenuitvoerder tot het doen van een uitkering verjaart niet bij leven van de
      pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel59
  - number: '60.1'
    text: |-
      Indien een pensioenregeling op basis van een pensioenovereenkomst voorziet in de opbouw van een ouderdomspensioen
      en een partnerpensioen, biedt de pensioenregeling aan de deelnemer of gewezen deelnemer met betrekking tot perioden
      van opbouw vanaf 1 januari 2002, ongeacht zijn burgerlijke staat, het recht in elk geval met ingang van de datum
      waarop het ouderdomspensioen ingaat of kan ingaan, in plaats van partnerpensioen te kiezen voor één van de volgende
      wijzigingen van het ouderdomspensioen:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel60
  - number: 60.1.a
    text: een hoger ouderdomspensioen;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel60
  - number: 60.1.b
    text: een eerder ingaand ouderdomspensioen; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel60
  - number: 60.1.c
    text: een hoger en een eerder ingaand ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel60
  - number: '60.2'
    text: Het eerste lid is niet van toepassing op de aanspraak op bijzonder partnerpensioen van de gewezen partner.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel60
  - number: '60.3'
    text: |-
      Indien er in de pensioenovereenkomst geen recht op de keuzemogelijkheid als bedoeld in het eerste lid is opgenomen
      heeft de deelnemer of gewezen deelnemer het recht om te kiezen voor één van deze mogelijkheden.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel60
  - number: '60.4'
    text: |-
      De pensioenuitvoerder waarborgt dat bij gebruikmaking van het keuzerecht geen onderscheid gemaakt wordt tussen
      mannen en vrouwen door vaststelling van een ruilvoet of opbouwkeuzevoet.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel60
  - number: '60.5'
    text: |-
      De pensioenuitvoerder waarborgt bij de vaststelling van een ruilvoet of opbouwkeuzevoet dat voldaan wordt aan het
      vereiste van collectieve actuariële gelijkwaardigheid hetgeen inhoudt dat de collectieve actuariële waarde van
      het ouderdomspensioen, bedoeld in het eerste lid, dat wordt gekozen in plaats van het partnerpensioen, bedoeld in
      het eerste lid, ongeacht de datum waarop de keuze wordt gemaakt, ten minste gelijkwaardig is aan de op dezelfde
      grondslagen berekende collectieve actuariële waarde van dat partnerpensioen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel60
  - number: '60.6'
    text: |-
      Bij de keuze, bedoeld in het eerste of derde lid, is de toestemming vereist van de partner die begunstigde is voor
      het in het eerste lid bedoelde partnerpensioen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel60
  - number: '60.7'
    text: 'Het vierde en vijfde lid zijn:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel60
  - number: 60.7.a
    text: |-
      met betrekking tot uitkeringsovereenkomsten en kapitaalovereenkomsten van toepassing op pensioenaanspraken die
      vanaf 1 januari 2002 zijn opgebouwd;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel60
  - number: 60.7.b
    text: |-
      met betrekking tot premieovereenkomsten van toepassing op pensioenaanspraken die vanaf 1 januari 2005 zijn
      opgebouwd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel60
  - number: '60.8'
    text: |-
      Voorzover het bij de toepassing van het eerste lid pensioenaanspraken betreft die als gevolg van een premievrije
      voortzetting van die pensioenaanspraken worden opgebouwd, is het eerste lid van toepassing indien het recht op die
      premievrije voortzetting is ontstaan op of na 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel60
  - number: '60.9'
    text: |-
      In afwijking van het zevende lid kunnen het vierde en vijfde lid van toepassing zijn op pensioenaanspraken
      die zijn opgebouwd voor 1 januari 2002 respectievelijk 1 januari 2005 indien dit is overeengekomen in de
      pensioenovereenkomst.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel60
  - number: '60.10'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel60
  - number: '60.11'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het eerste tot en met het
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel60
  - number: '61.1'
    text: |-
      Indien een pensioenovereenkomst voorziet in een ouderdomspensioen, heeft de deelnemer of gewezen deelnemer het
      recht, in plaats van ouderdomspensioen of een deel van het ouderdomspensioen te kiezen voor partnerpensioen in
      elk geval:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel61
  - number: 61.1.a
    text: bij beëindiging van het deelnemerschap; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel61
  - number: 61.1.b
    text: met ingang van de datum waarop het ouderdomspensioen ingaat of kan ingaan;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel61
  - number: '61.2'
    text: |-
      Indien een pensioenovereenkomst voorziet in een ouderdomspensioen, biedt de pensioenuitvoerder de deelnemer
      bij beëindiging van de deelneming en in het laatste jaar voor ingang van het ouderdomspensioen standaard de
      mogelijkheid, genoemd in het eerste lid, aan.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel61
  - number: '61.3'
    text: |-
      De pensioenuitvoerder waarborgt dat bij gebruikmaking van het keuzerecht geen onderscheid gemaakt wordt tussen
      mannen en vrouwen door vaststelling van een ruilvoet of opbouwkeuzevoet.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel61
  - number: '61.4'
    text: |-
      De pensioenuitvoerder waarborgt bij de vaststelling van een ruilvoet of opbouwkeuzevoet dat voldaan wordt aan het
      vereiste van collectieve actuariële gelijkwaardigheid hetgeen inhoudt dat de collectieve actuariële waarde van
      het partnerpensioen, bedoeld in het eerste lid, dat wordt gekozen in plaats van het ouderdomspensioen, bedoeld in
      het eerste lid, ongeacht de datum waarop de keuze wordt gemaakt, ten minste gelijkwaardig is aan de op dezelfde
      grondslagen berekende collectieve actuariële waarde van dat ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel61
  - number: '61.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de inhoud van
      de keuzemogelijkheid, de wijze waarop de keuzemogelijkheid wordt geboden en de collectieve actuariële
      gelijkwaardigheid, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel61
  - number: '61.6'
    text: |-
      De in het eerste lid omschreven mogelijkheid heeft geen betrekking op het deel van een ouderdomspensioen waarop een
      recht op uitbetaling rust als bedoeld in [artikel 2 van de Wet verevening pensioenrechten bij scheiding][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel2
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0006641
        artikel: '2'
  - number: '61.7'
    text: |-
      Indien de deelnemer of gewezen deelnemer niet binnen de door de pensioenuitvoerder gestelde termijn reageert op de
      keuzemogelijkheid die hem ingevolge het tweede lid in het laatste jaar voor de ingang van het ouderdomspensioen is
      aangeboden, gaat de pensioenuitvoerder over tot het uitruilen van het ouderdomspensioen in partnerpensioen indien:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel61
  - number: 61.7.a
    text: |-
      de pensioenovereenkomst niet voorziet in een aanspraak op partnerpensioen vanaf de datum waarop het
      ouderdomspensioen ingaat; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel61
  - number: 61.7.b
    text: de deelnemer of gewezen deelnemer gehuwd is of een geregistreerde partnerrelatie heeft.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel61
  - number: '61.8'
    text: |-
      In de pensioenregeling wordt bepaald wat de verhouding is tussen ouderdomspensioen en partnerpensioen na uitruil
      als bedoeld in het zevende lid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel61
  - number: '61.9'
    text: |-
      Indien de uitruil, bedoeld in het zevende lid, ertoe zou leiden dat het ouderdomspensioen op jaarbasis lager wordt
      dan het op grond van [artikel 66][ref1] bepaalde bedrag wordt de in het achtste lid bedoelde verhouding tussen
      ouderdomspensioen en partnerpensioen zodanig aangepast dat het ouderdomspensioen op jaarbasis meer bedraagt dan het
      op grond van [artikel 66][ref2] bepaalde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '62.1'
    text: 'Indien de pensioenovereenkomst de deelnemer of gewezen deelnemer de mogelijkheid biedt:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel62
  - number: 62.1.a
    text: |-
      in plaats van een bepaald soort pensioen geheel of gedeeltelijk te kiezen voor een ander soort pensioen, dan het
      pensioen, bedoeld in de [artikelen 60][ref1] en [61][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel61
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '60'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 62.1.b
    text: de ingangsdatum van het ouderdomspensioen te vervroegen of uit te stellen;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel62
  - number: 62.1.c
    text: de hoogte van het ouderdomspensioen te laten variëren; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel62
  - number: 62.1.d
    text: tot een keuze anders dan bedoeld in de voorgaande onderdelen;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel62
  - number: '62.2'
    text: |-
      Bij gebruikmaking van een in het eerste lid bedoelde keuzemogelijkheid is de toestemming vereist van de partner
      die begunstigde is voor partnerpensioen indien de hoogte daarvan door gebruikmaking van de keuzemogelijkheid wordt
      verlaagd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel62
  - number: '62.3'
    text: 'Het eerste lid is:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel62
  - number: 62.3.a
    text: |-
      met betrekking tot uitkeringsovereenkomsten en kapitaalovereenkomsten van toepassing op pensioenaanspraken die
      vanaf 1 januari 2002 zijn opgebouwd;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel62
  - number: 62.3.b
    text: |-
      met betrekking tot premieovereenkomsten van toepassing op pensioenaanspraken die vanaf 1 januari 2005 zijn
      opgebouwd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel62
  - number: '62.4'
    text: |-
      Voorzover het bij de toepassing van het eerste lid pensioenaanspraken betreft die als gevolg van een premievrije
      voortzetting van die aanspraken worden opgebouwd, is het eerste lid van toepassing indien het recht op die
      premievrije voortzetting is ontstaan op of na 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel62
  - number: '62.5'
    text: |-
      In afwijking van het derde lid kan het eerste lid van toepassing zijn op pensioenaanspraken die zijn opgebouwd voor
      1 januari 2002 respectievelijk 1 januari 2005 indien dit is overeengekomen in de pensioenovereenkomst.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel62
  - number: '62.6'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel62
  - number: '63.1'
    text: 'De hoogte van een pensioen kan na ingang variëren mits:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel63
  - number: 63.1.a
    text: de laagste uitkering niet minder bedraagt dan 75% van de hoogste uitkering; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel63
  - number: 63.1.b
    text: de mate van variatie uiterlijk op de ingangsdatum van het pensioen wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel63
  - number: '63.2'
    text: |-
      Voor de toepassing van het eerste lid blijft in de periode tussen de ingangsdatum van het pensioen en het bereiken
      van de 65-jarige leeftijd, van de uitkering buiten aanmerking het gedeelte dat overeenkomt met het bedrag bedoeld
      in [artikel 18d, derde lid, van de Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18d
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18d
  - number: '64.1'
    text: |-
      Vervreemding of elke andere handeling, waardoor de aanspraakgerechtigde of de pensioengerechtigde enig recht op
      zijn pensioenaanspraken of pensioenrechten aan een ander toekent is nietig, tenzij:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel64
  - number: 64.1.a
    text: |-
      verpanding plaatsvindt voor het verlenen van zekerheid voor het verkrijgen van uitstel van betaling als bedoeld in
      [artikel 25, vijfde lid, van de Invorderingswet 1990][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 64.1.b
    text: |-
      vervreemding plaatsvindt op grond van [artikel 57, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel57
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 64.1.c
    text: |-
      verevening plaatsvindt op basis van de [Wet verevening pensioenrechten][ref1] bij scheiding;


      [ref1]: https://wetten.overheid.nl/BWBR0006641
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0006641
  - number: 64.1.d
    text: |-
      in het kader van een verrekening van pensioenrechten bij scheiding in plaats van de aanspraakgerechtigde of de
      pensioengerechtigde diens gewezen partner respectievelijk diens partner wordt aangewezen als begunstigde voor het
      geheel of een deel van het ouderdomspensioen, mits de pensioenuitvoerder hiermee instemt; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel64
  - number: 64.1.e
    text: |-
      in het kader van een verrekening van pensioenrechten bij scheiding de waarde van het geheel of een deel van het
      ouderdomspensioen van de aanspraakgerechtigde of de pensioengerechtigde bij dezelfde pensioenuitvoerder wordt
      aangewend voor een ouderdomspensioen op het leven van diens gewezen partner respectievelijk diens partner, mits de
      pensioenuitvoerder hiermee instemt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel64
  - number: '64.2'
    text: |-
      Een volmacht tot invordering van uitkeringen uit hoofde van een pensioenrecht, onder welke vorm of welke benaming
      ook verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel64
  - number: '65.1'
    text: |-
      Afkoop is slechts mogelijk in bij of krachtens de [artikelen 66 tot en met 69][ref1] en [134][ref2] bedoelde
      situaties of in geval van toepassing van [artikel 3:160 van de Wet op het financieel toezicht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel134
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '134'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '65.2'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel65
  - number: '66.1'
    text: |-
      De pensioenuitvoerder heeft het recht om op zijn vroegst twee jaar na beëindiging van de deelneming
      pensioenaanspraken van een gewezen deelnemer af te kopen, indien op basis van de tot het tijdstip van beëindiging
      opgebouwde aanspraak op ouderdomspensioen de uitkering van het ouderdomspensioen op jaarbasis op de reguliere
      ingangsdatum minder zal bedragen dan € 400  per jaar, tenzij:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel66
  - number: 66.1.a
    text: dit recht op afkoop in de pensioen- en uitvoeringsovereenkomst is beperkt of uitgesloten; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel66
  - number: 66.1.b
    text: |-
      de gewezen deelnemer binnen twee jaar na beëindiging van de deelneming een procedure tot waardeoverdracht is
      gestart.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel66
  - number: '66.2'
    text: |-
      Indien de reguliere ingangsdatum van het ouderdomspensioen ligt voor het verstrijken van de in het eerste lid
      genoemde termijn van twee jaar, heeft de pensioenuitvoerder het recht om bij de ingang van het ouderdomspensioen
      een aanspraak op ouderdomspensioen en eventuele andere aanspraken ten behoeve van de gepensioneerde of zijn
      nabestaanden af te kopen, indien de uitkering van het ouderdomspensioen op de ingangsdatum minder bedraagt dan
      € 400  per jaar.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel66
  - number: '66.3'
    text: |-
      De pensioenuitvoerder die gebruik wil maken van het in het eerste lid bedoelde recht informeert de gewezen
      deelnemer over zijn besluit hieromtrent binnen zes maanden na afloop van de periode van twee jaar na beëindiging
      van de deelneming en gaat over tot de uitbetaling van de afkoopwaarde binnen die termijn van zes maanden.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel66
  - number: '66.4'
    text: |-
      De pensioenuitvoerder die gebruik wil maken van het in het tweede lid bedoelde recht informeert de gepensioneerde
      over zijn besluit hieromtrent binnen zes maanden na de ingang van het pensioen en gaat over tot de uitbetaling van
      de afkoopwaarde binnen die termijn van zes maanden.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel66
  - number: '66.5'
    text: |-
      De pensioenuitvoerder stelt de afkoopwaarde van de pensioenaanspraken ter beschikking aan de gewezen deelnemer dan
      wel de gepensioneerde, met uitzondering van de afkoopwaarde van een bijzonder partnerpensioen, die ter beschikking
      wordt gesteld aan de gewezen partner.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel66
  - number: '66.6'
    text: |-
      De pensioenuitvoerder betaalt de uitkering op de dag dat de aanspraken of rechten vervallen in verband met de
      afkoop.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel66
  - number: '66.7'
    text: 'De pensioenuitvoerder kan na de in het derde lid bedoelde termijn van 2 jaar en zes maanden afkopen indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel66
  - number: 66.7.a
    text: de gewezen deelnemer of gepensioneerde daarmee instemt; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel66
  - number: 66.7.b
    text: |-
      de hoogte van het ouderdomspensioen op jaarbasis per 1 januari van dat jaar lager is dan het in het eerste lid
      bedoelde grensbedrag.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel66
  - number: '66.8'
    text: |-
      Het in het eerste en tweede lid genoemde bedrag wordt bij regeling van Onze Minister telkens herzien met ingang van
      1 januari op basis van de consumentenprijsindex Alle Huishoudens, zoals berekend door het Centraal Bureau voor de
      Statistiek. De herziening wordt bepaald door de procentuele wijziging die dat indexcijfer over de maand oktober,
      voorafgaand aan de aanpassing heeft ondergaan ten opzichte van de maand oktober van het daaraan voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel66
  - number: '66.9'
    text: |-
      De pensioenuitvoerder waarborgt met betrekking tot perioden van opbouw vanaf 1 januari 2005 bij de vaststelling van
      de afkoopwaarde door vaststelling van een afkoopvoet dat geen onderscheid gemaakt wordt tussen mannen en vrouwen
      waarbij voldaan wordt aan het vereiste van collectieve actuariële gelijkwaardigheid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel66
  - number: '66.10'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel66
  - number: '66.11'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen er nadere regels worden gesteld aan het vaststellen van de
      afkoopwaarde, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel66
  - number: '67.1'
    text: |-
      De pensioenuitvoerder heeft jegens de nabestaanden het recht om een recht op partnerpensioen of wezenpensioen ten
      behoeve van de nabestaanden van dezelfde deelnemer, gewezen deelnemer of gepensioneerde af te kopen, indien de
      uitkering van het partnerpensioen of wezenpensioen op jaarbasis op de ingangsdatum minder bedraagt dan het op basis
      van [artikel 66][ref1] bepaalde bedrag, tenzij dit recht op afkoop in de pensioen- en uitvoeringsovereenkomst is
      beperkt of uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '67.2'
    text: |-
      De pensioenuitvoerder die gebruik maakt van het in het eerste lid bedoelde recht informeert de nabestaande hierover
      binnen zes maanden na de ingangsdatum en gaat binnen die termijn over tot uitbetaling van de afkoopwaarde aan de
      nabestaande.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel67
  - number: '67.3'
    text: |-
      De pensioenuitvoerder kan na de in het tweede lid bedoelde termijn het partnerpensioen of wezenpensioen afkopen
      indien:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel67
  - number: 67.3.a
    text: de nabestaande daarmee instemt; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel67
  - number: 67.3.b
    text: |-
      indien de hoogte van het partnerpensioen of wezenpensioen op jaarbasis per 1 januari van dat jaar lager is dan het
      op basis van [artikel 66][ref1] bepaalde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '67.4'
    text: |-
      [Artikel 66, zesde en negende tot en met elfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '68.1'
    text: |-
      De pensioenuitvoerder heeft jegens de gewezen partner het recht om een aanspraak op bijzonder partnerpensioen af
      te kopen indien de uitkering van het partnerpensioen op jaarbasis op de ingangsdatum minder zal bedragen dan het op
      basis van [artikel 66][ref1] bepaalde bedrag, tenzij dit recht op afkoop in de pensioen- en uitvoeringsovereenkomst
      is beperkt of uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '68.2'
    text: |-
      De pensioenuitvoerder die gebruik maakt van het in het eerste lid bedoelde recht informeert de gewezen partner
      hierover binnen zes maanden na de melding van de scheiding en gaat binnen die termijn over tot uitbetaling van de
      afkoopwaarde aan de gewezen partner.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel68
  - number: '68.3'
    text: 'De pensioenuitvoerder kan na de in het tweede lid bedoelde termijn afkopen indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel68
  - number: 68.3.a
    text: de gewezen partner daarmee instemt; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel68
  - number: 68.3.b
    text: |-
      indien de hoogte van het partnerpensioen op jaarbasis per 1 januari van dat jaar lager is dan het op basis van
      [artikel 66][ref1] bepaalde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '68.4'
    text: |-
      [Artikel 66, zesde en negende tot en met elfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '69.1'
    text: 'De pensioenuitvoerder is bevoegd om over te gaan tot afkoop van het deel van de pensioenaanspraken:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel69
  - number: 69.1.a
    text: |-
      dat op het tijdstip onmiddellijk voorafgaand aan het tijdstip van ingang van het pensioen uitgaat
      boven de begrenzingen, bedoeld in de [artikelen 18a, zevende lid][ref1], [18b, zevende lid][ref2],
      [18c, vijfde en zesde lid][ref3], en [18e, vierde lid, van de Wet op de loonbelasting 1964][ref4], met inachtneming
      van [artikel 18d, eerste lid, onderdelen a, b en d, van die wet][ref5]; of


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18b
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18c
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
      [ref5]: https://wetten.overheid.nl/BWBR0002471#Artikel18d
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18b
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 18c
      - id: ref4
        bwb_id: BWBR0002471
        artikel: 18e
      - id: ref5
        bwb_id: BWBR0002471
        artikel: 18d
  - number: 69.1.b
    text: |-
      dat op het tijdstip onmiddellijk voorafgaand aan het tijdstip waarop de deelnemer of de gewezen deelnemer ophoudt
      binnenlands belastingplichtige te zijn uitgaat boven de begrenzingen, bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel69
  - number: '69.2'
    text: |-
      De afkoopwaarde wordt door de pensioenuitvoerder aan de deelnemer of gewezen deelnemer ter beschikking gesteld,
      met uitzondering van de afkoopwaarde voor een bijzonder partnerpensioen die ter beschikking wordt gesteld aan de
      gewezen partner.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel69
  - number: '69.3'
    text: |-
      De pensioenuitvoerder waarborgt bij de vaststelling van de afkoopwaarde door vaststelling van een afkoopvoet dat
      geen onderscheid gemaakt wordt tussen mannen en vrouwen waarbij voldaan wordt aan het vereiste van collectieve
      actuariële gelijkwaardigheid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel69
  - number: '69.4'
    text: |-
      De vorige leden zijn van overeenkomstige toepassing op pensioenaanspraken als bedoeld in de [artikelen 38d][ref1],
      [38e][ref2] en [38f van de Wet op de loonbelasting 1964][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel38d
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel38e
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel38f
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 38d
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 38e
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 38f
  - number: '69.5'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel69
  - number: '69.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen er regels worden gesteld aan het vaststellen van de
      afkoopwaarde.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel69
  - number: '70.1'
    text: |-
      Voor de toepassing van de [artikelen 71 tot en met 92][ref1] wordt onder ontvangende pensioenuitvoerder mede
      verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 70.1.1°
    text: |-
      een beroepspensioenfonds als bedoeld in [artikel 1 van de Wet verplichte beroepspensioenregeling][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel1
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '1'
  - number: 70.1.2°
    text: |-
      de Stichting Notarieel pensioenfonds, bedoeld in [artikel 113a, eerste lid, van de Wet op het notarisambt][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel113a
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: 113a
  - number: '70.2'
    text: |-
      Bij regeling van Onze Minister kunnen instellingen worden aangewezen jegens wie een pensioenuitvoerder een
      verplichting tot waardeoverdracht heeft.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel70
  - number: '70.3'
    text: |-
      Waardeoverdracht is slechts mogelijk in de in de [artikelen 71 tot en met 92][ref1] bedoelde situaties.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '70.4'
    text: |-
      Voor de toepassing van de [artikelen 72][ref1], [80, eerste lid, onderdeel d][ref2],
      en [81, eerste lid, onderdeel c][ref3], wordt onder een pensioenfonds dat optreedt als
      ontvangende pensioenuitvoerder mede verstaan een beroepspensioenfonds als bedoeld in
      [artikel 1 van de Wet verplichte beroepspensioenregeling][ref4] of de Stichting Notarieel pensioenfonds, bedoeld in
      [artikel 113a, eerste lid, van de Wet op het notarisambt][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel81
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0010388#Artikel113a
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '80'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '81'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0010388
        artikel: 113a
  - number: '71.1'
    text: |-
      De pensioenuitvoerder is verplicht om na een verzoek van de gewezen deelnemer tot waardeoverdracht de
      overdrachtswaarde van diens pensioenaanspraken over te dragen indien:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel71
  - number: 71.1.a
    text: |-
      er sprake is van een individuele beëindiging van de dienstbetrekking dan wel individuele beëindiging van de
      deelneming; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel71
  - number: 71.1.b
    text: |-
      die waardeoverdracht ertoe strekt het de gewezen deelnemer mogelijk te maken pensioenaanspraken te verwerven bij de
      ontvangende pensioenuitvoerder van de nieuwe werkgever of de beroepspensioenregeling;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel71
  - number: '71.2'
    text: |-
      De ontvangende pensioenuitvoerder is verplicht om na een verzoek tot waardeoverdracht van een deelnemer de
      overdrachtswaarde aan te wenden ter verwerving van pensioenaanspraken voor die deelnemer.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel71
  - number: '71.3'
    text: |-
      De plicht van de overdragende pensioenuitvoerder om de waarde rechtstreeks over te dragen en de plicht van
      de ontvangende pensioenuitvoerder om de waarde aan te wenden ontstaat indien de deelnemer binnen zes maanden
      na aanvang van de verwerving van pensioenaanspraken in de door de ontvangende pensioenuitvoerder uitgevoerde
      pensioenregeling een opgave heeft gevraagd van zijn pensioenaanspraken aan de ontvangende pensioenuitvoerder en
      daarna het verzoek tot waardeoverdracht doet aan de ontvangende pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel71
  - number: '71.4'
    text: |-
      De ontvangende pensioenuitvoerder waarborgt dat de actuariële waarde van de door de deelnemer te verwerven
      pensioenaanspraken ten minste gelijk is aan de op dezelfde grondslagen berekende waarde van de over te dragen
      pensioenaanspraken.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel71
  - number: '71.5'
    text: |-
      De overdragende en de ontvangende pensioenuitvoerder brengen in het kader van de waardeoverdracht geen kosten in
      rekening bij de gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel71
  - number: '71.6'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel71
  - number: '71.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de berekening van de
      overdrachtswaarde, de waarde van met de overdrachtswaarde te verwerven pensioenaanspraken alsmede de in acht te
      nemen procedures.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel71
  - number: '72'
    text: |-
      De in [artikel 71][ref1] genoemde plicht tot waardeoverdracht geldt niet zolang:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 72.a
    text: |-
      de overdragende of ontvangende pensioenuitvoerder een pensioenfonds is waarbij de technische voorzieningen niet
      meer volledig door waarden worden gedekt;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel72
  - number: 72.b
    text: 'de overdragende of ontvangende pensioenuitvoerder een verzekeraar is:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel72
  - number: 72.b.1°
    text: |-
      waarop de noodregeling, bedoeld in [artikel 3:161 van de Wet op het financieel toezicht][ref1] van toepassing is;
      of


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 72.b.2°
    text: die failliet is; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel72
  - number: 72.c
    text: |-
      de overdragende pensioenuitvoerder een verzekeraar is en aanvullende bijdragen van de werkgever noodzakelijk zijn
      maar de financiële toestand van die werkgever blijkens een schriftelijke verklaring van een niet aan de onderneming
      van de werkgever verbonden registeraccountant of accountant-administratieconsulent die aanvullende bijdragen niet
      toelaat.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel72
  - number: '73'
    text: |-
      De in [artikel 71][ref1] genoemde plicht tot waardeoverdracht geldt niet met betrekking tot pensioenaanspraken
      ondergebracht bij:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 73.a
    text: een pensioenfonds, indien de deelneming is geëindigd vóór 8 juli 1994;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel73
  - number: 73.b
    text: een verzekeraar, indien de dienstbetrekking van de gewezen deelnemer is geëindigd vóór 8 juli 1994.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel73
  - number: '74.1'
    text: |-
      Indien de in [artikel 72][ref1] genoemde omstandigheden niet meer van toepassing zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 74.1.a
    text: |-
      herleven de in [artikel 71][ref1] bedoelde plichten van de overdragende pensioenuitvoerder en de ontvangende
      pensioenuitvoerder;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 74.1.b
    text: |-
      wordt de in [artikel 71, derde lid][ref1], omschreven verplichting van de deelnemer om binnen zes maanden een
      opgave te vragen en daarna een verzoek tot waardeoverdracht te doen verlengd tot zes maanden na ontvangst van de
      mededeling, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '74.2'
    text: |-
      Een overdragende pensioenuitvoerder die in de periode waarin de in [artikel 72][ref1] bedoelde omstandigheden op
      hem van toepassing zijn verzoeken tot waardeoverdracht heeft gekregen, informeert, wanneer deze omstandigheden
      niet meer van toepassing zijn, alle deelnemers die in die periode gewezen deelnemer zijn geworden en de betrokken
      ontvangende pensioenuitvoerders over de mogelijkheid alsnog waarde over te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '74.3'
    text: |-
      Een ontvangende pensioenuitvoerder die in de periode waarin de in [artikel 72][ref1] genoemde omstandigheden op
      hem van toepassing zijn verzoeken tot waardeoverdracht heeft gekregen, informeert wanneer deze omstandigheden niet
      meer van toepassing zijn, alle deelnemers die in die periode een verzoek tot waardeoverdracht hebben gedaan en de
      betrokken overdragende pensioenuitvoerders over de mogelijkheid alsnog waarde over te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '75.1'
    text: |-
      Indien in de in [artikel 71][ref1] bedoelde situatie geen plicht tot waardeoverdracht bestaat omdat:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 75.1.a
    text: |-
      de deelnemer niet voldaan heeft aan de in [artikel 71, derde lid][ref1], omschreven verplichting om binnen zes
      maanden een opgave te vragen; of


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 75.1.b
    text: |-
      sprake is van de in [artikel 73][ref1] bedoelde situatie;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel73
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '73'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '75.2'
    text: |-
      Indien in de in [artikel 71][ref1] bedoelde situatie geen plicht tot waardeoverdracht bestaat, omdat er geen sprake
      is van een individuele beëindiging, is de pensioenuitvoerder bevoegd tot waardeoverdracht indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 75.2.a
    text: |-
      wordt voldaan aan de in [artikel 71, eerste lid, onderdeel b en tweede zin, en vierde lid][ref1], genoemde
      voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 75.2.b
    text: |-
      de overdragende en de ontvangende pensioenuitvoerders aan wie door een groep gewezen deelnemers verzoeken tot
      waardeoverdracht worden gedaan, dit schriftelijk hebben gemeld aan de toezichthouder; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel75
  - number: 75.2.c
    text: |-
      de toezichthouder binnen drie maanden na de melding geen verbod tot waardeoverdracht heeft opgelegd aan een van
      beide pensioenuitvoerders.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel75
  - number: '75.3'
    text: |-
      Indien de financiering van de aanspraken van de gewezen deelnemer bij de overdragende pensioenuitvoerder nog
      niet is voltooid overeenkomstig [artikel 55][ref1] kan de pensioenuitvoerder ondanks de lagere waarde en de
      daaruit bij de ontvangende pensioenuitvoerder resulterende lagere pensioenaanspraken de waarde overdragen
      indien de gewezen deelnemer en zijn partner schriftelijk hiermee instemmen en mits sprake is van de in
      [artikel 72, onderdeel c][ref2], of de in [artikel 73][ref3] bedoelde situatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel73
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '73'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '76.1'
    text: |-
      De pensioenuitvoerder is verplicht om na een verzoek van de gewezen deelnemer tot waardeoverdracht de
      overdrachtswaarde van diens pensioenaanspraken over te dragen indien:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel76
  - number: 76.1.a
    text: |-
      sprake is van een individuele beëindiging van de deelneming bij een nieuwe of voortgezette dienstbetrekking bij
      dezelfde werkgever; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel76
  - number: 76.1.b
    text: |-
      die waardeoverdracht ertoe strekt het de gewezen deelnemer mogelijk te maken pensioenaanspraken te verwerven bij de
      ontvangende pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel76
  - number: '76.2'
    text: |-
      De ontvangende pensioenuitvoerder is verplicht om na een verzoek tot waardeoverdracht van een deelnemer de
      overdrachtswaarde aan te wenden ter verwerving van pensioenaanspraken voor die deelnemer.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel76
  - number: '76.3'
    text: |-
      De plicht van de overdragende pensioenuitvoerder om de waarde rechtstreeks over te dragen en de plicht van
      de ontvangende pensioenuitvoerder om de waarde aan te wenden ontstaat indien de deelnemer binnen zes maanden
      na aanvang van de verwerving van pensioenaanspraken in de door de ontvangende pensioenuitvoerder uitgevoerde
      pensioenregeling een opgave heeft gevraagd van zijn pensioenaanspraken aan de ontvangende pensioenuitvoerder en
      daarna het verzoek tot waardeoverdracht doet aan de ontvangende pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel76
  - number: '76.4'
    text: |-
      De overdrachtswaarde wordt door de overdragende pensioenuitvoerder zodanig vastgesteld dat de voor mannen
      en vrouwen te verwerven pensioenrechten gelijk zijn waarbij aan het vereiste van collectieve actuariële
      gelijkwaardigheid op basis van dezelfde grondslagen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel76
  - number: '76.5'
    text: 'Het vierde lid is:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel76
  - number: 76.5.a
    text: |-
      met betrekking tot uitkeringsovereenkomsten van toepassing op pensioenaanspraken die vanaf 1 januari 2002 zijn of
      worden opgebouwd;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel76
  - number: 76.5.b
    text: |-
      met betrekking tot premieovereenkomsten en kapitaalovereenkomsten van toepassing op pensioenaanspraken die vanaf
      1 januari 2005 zijn of worden opgebouwd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel76
  - number: '76.6'
    text: |-
      In afwijking van het vijfde lid kan het vierde lid van toepassing zijn op pensioenaanspraken die zijn opgebouwd
      voor 1 januari 2002 respectievelijk 1 januari 2005 indien dit is overeengekomen in de pensioenovereenkomst.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel76
  - number: '76.7'
    text: |-
      De overdragende en de ontvangende pensioenuitvoerder brengen in het kader van de waardeoverdracht geen kosten in
      rekening bij de gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel76
  - number: '76.8'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel76
  - number: '76.9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de berekening van de
      overdrachtswaarde, de waarde van met de overdrachtswaarde te verwerven pensioenaanspraken alsmede de in acht te
      nemen procedures.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel76
  - number: '77'
    text: |-
      Indien in de in [artikel 76][ref1] bedoelde situatie de in [artikel 72][ref2] genoemde omstandigheden niet meer van
      toepassing zijn herleeft de plicht tot waardeoverdracht overeenkomstig [artikel 74][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel74
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '74'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '78.1'
    text: |-
      Indien in de in [artikel 76][ref1] bedoelde situatie geen plicht tot waardeoverdracht bestaat omdat de deelnemer
      niet voldaan heeft aan de in [artikel 76, derde lid][ref2], omschreven verplichting om binnen zes maanden
      een opgave te vragen, is de pensioenuitvoerder bevoegd tot waardeoverdracht indien voldaan wordt aan de in
      [artikel 76, eerste en vierde lid][ref3], opgenomen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel76
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '78.2'
    text: |-
      Indien in de in [artikel 76][ref1] bedoelde situatie geen plicht tot waardeoverdracht bestaat omdat er geen sprake
      is van een individuele beëindiging, is de pensioenuitvoerder bevoegd tot waardeoverdracht indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel76
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 78.2.a
    text: |-
      wordt voldaan aan de in [artikel 76, eerste lid, onderdeel b en tweede zin, en vierde lid][ref1], genoemde
      voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel76
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 78.2.b
    text: |-
      de overdragende en de ontvangende pensioenuitvoerders aan wie door een groep gewezen deelnemers verzoeken tot
      waardeoverdracht worden gedaan niet identiek zijn hetgeen zij schriftelijk hebben gemeld aan de toezichthouder; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel78
  - number: 78.2.c
    text: |-
      de toezichthouder binnen drie maanden na de melding geen verbod tot waardeoverdracht heeft opgelegd aan een van
      beide pensioenuitvoerders.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel78
  - number: '79.1'
    text: |-
      De pensioenuitvoerder is verplicht om op verzoek van de deelnemer of gewezen deelnemer de waarde van diens
      pensioenaanspraken aan te wenden in het kader van het keuzerecht overeenkomstig de [artikelen 60][ref1] en
      [61][ref2] of de keuzemogelijkheden overeenkomstig [artikel 62][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel62
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '60'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '62'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '79.2'
    text: |-
      De pensioenuitvoerder brengt in het kader van de waardeoverdracht geen kosten in rekening bij de deelnemer of
      gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel79
  - number: '80.1'
    text: |-
      Een pensioenfonds is bevoegd om op verzoek van de deelnemer, gewezen deelnemer of andere aanspraakgerechtigde de
      waarde van zijn pensioenaanspraken welke voortvloeien uit een kapitaalovereenkomst of een premieovereenkomst die
      voorziet in de uitkering van een aan te wenden kapitaal op de pensioendatum, per de pensioendatum rechtstreeks over
      te dragen aan een andere pensioenuitvoerder indien:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel80
  - number: 80.1.a
    text: de pensioenovereenkomst hierin voorziet;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel80
  - number: 80.1.b
    text: |-
      de overdrachtswaarde zodanig door het overdragende pensioenfonds wordt vastgesteld dat de voor mannen en vrouwen
      te verwerven pensioenrechten gelijk zijn waarbij aan het vereiste van collectieve actuariële gelijkwaardigheid op
      basis van dezelfde grondslagen wordt voldaan; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel80
  - number: 80.1.c
    text: |-
      indien de ontvangende pensioenuitvoerder een pensioenfonds is, de deelnemer, gewezen deelnemer of andere
      aanspraakgerechtigde reeds pensioenaanspraken heeft jegens dat pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel80
  - number: '80.2'
    text: Het eerste lid, onderdeel b, is van toepassing op pensioenaanspraken die vanaf 1 januari 2005 zijn opgebouwd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel80
  - number: '80.3'
    text: |-
      Voorzover het bij de toepassing van het eerste lid pensioenaanspraken betreft die als gevolg van een premievrije
      voortzetting van die aanspraken worden opgebouwd, is het eerste lid, onderdeel b, van toepassing indien het recht
      op die premievrije voortzetting is ontstaan op of na 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel80
  - number: '80.4'
    text: |-
      In afwijking van het tweede lid kunnen de in het eerste lid, onderdeel b, opgenomen voorwaarden van toepassing
      zijn op pensioenaanspraken die zijn opgebouwd voor 1 januari 2005 indien dit is overeengekomen in de
      pensioenovereenkomst.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel80
  - number: '80.5'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel80
  - number: '80.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld aan het vaststellen van de
      overdrachtswaarde.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel80
  - number: '81.1'
    text: |-
      De verzekeraar is verplicht om op verzoek van de deelnemer, gewezen deelnemer of andere aanspraakgerechtigde de
      waarde van zijn pensioenaanspraken welke voortvloeien uit een kapitaalovereenkomst of een premieovereenkomst die
      voorziet in de uitkering van een aan te wenden kapitaal op de pensioendatum, per de pensioendatum rechtstreeks over
      te dragen aan een andere pensioenuitvoerder indien:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel81
  - number: 81.1.a
    text: |-
      de overdrachtswaarde zodanig door de overdragende verzekeraar wordt vastgesteld dat de voor mannen en vrouwen te
      verwerven pensioenrechten gelijk zijn waarbij aan het vereiste van collectieve actuariële gelijkwaardigheid op
      basis van dezelfde grondslagen wordt voldaan; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel81
  - number: 81.1.b
    text: |-
      indien de ontvangende pensioenuitvoerder een pensioenfonds is, de deelnemer, gewezen deelnemer of andere
      aanspraakgerechtigde reeds pensioenaanspraken heeft jegens dat pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel81
  - number: '81.2'
    text: Het eerste lid, onderdeel a, is van toepassing op pensioenaanspraken die vanaf 1 januari 2005 zijn opgebouwd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel81
  - number: '81.3'
    text: |-
      Voorzover het bij de toepassing van het eerste lid pensioenaanspraken betreft die als gevolg van een premievrije
      voortzetting van die aanspraken worden opgebouwd, is het eerste lid, onderdeel a, van toepassing indien het recht
      op die premievrije voortzetting is ontstaan op of na 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel81
  - number: '81.4'
    text: |-
      In afwijking van het tweede lid kunnen de in het eerste lid, onderdeel a, opgenomen voorwaarden van toepassing
      zijn op pensioenaanspraken die zijn opgebouwd voor 1 januari 2005 indien dit is overeengekomen in de
      pensioenovereenkomst.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel81
  - number: '81.5'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel81
  - number: '81.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld aan het vaststellen van de
      overdrachtswaarde.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel81
  - number: '82.1'
    text: |-
      In geval van overdracht van pensioenkapitaal op de pensioendatum ten behoeve van aankoop van een periodieke
      pensioenuitkering, draagt de overdragende pensioenuitvoerder het pensioenkapitaal over:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel82
  - number: 82.1.a
    text: |-
      aan de door de deelnemer of gewezen deelnemer aangewezen ontvangende pensioenuitvoerder op de pensioendatum of
      binnen acht weken na het verzoek hiertoe van de deelnemer of gewezen deelnemer indien deze dat verzoek minder dan
      acht weken voor de pensioendatum heeft gedaan;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel82
  - number: 82.1.b
    text: |-
      aan de door de aanspraakgerechtigde, niet zijnde de deelnemer of gewezen deelnemer, aangewezen ontvangende
      pensioenuitvoerder binnen acht weken na het verzoek hiertoe van die aanspraakgerechtigde.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel82
  - number: '82.2'
    text: |-
      De overdragende pensioenuitvoerder is verplicht tot vergoeding van de schade die de deelnemer, gewezen deelnemer
      of andere aanspraakgerechtigde ondervindt ten gevolge van de aan die pensioenuitvoerder toerekenbare niet tijdige
      overdracht; de schade is ten minste gelijk aan de wettelijke rente op het over te dragen pensioenkapitaal.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel82
  - number: '83.1'
    text: 'De pensioenuitvoerder is op verzoek van de werkgever bevoegd tot collectieve waardeoverdracht indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel83
  - number: 83.1.a
    text: |-
      de waardeoverdracht ertoe strekt in verband met de beëindiging van de uitvoeringsovereenkomst tussen de werkgever
      en de overdragende pensioenuitvoerder de waarde onder te brengen bij de ontvangende pensioenuitvoerder met wie de
      werkgever een uitvoeringsovereenkomst heeft gesloten;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel83
  - number: 83.1.b
    text: |-
      de werkgever wordt overgenomen als gevolg van een overgang van een onderneming als bedoeld in
      [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref1], en de overnemende onderneming een
      uitvoeringsovereenkomst heeft gesloten of gaat sluiten met een andere pensioenuitvoerder of dezelfde
      pensioenuitvoerder; of


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
  - number: 83.1.c
    text: |-
      de waardeoverdracht ertoe strekt in verband met een collectieve wijziging van de pensioenovereenkomsten de
      waarde van pensioenaanspraken of pensioenrechten aan te wenden bij dezelfde pensioenuitvoerder overeenkomstig die
      gewijzigde pensioenovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel83
  - number: '83.2'
    text: 'Bij een collectieve waardeoverdracht als bedoeld in het eerste lid wordt voldaan aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel83
  - number: 83.2.a
    text: |-
      de deelnemers, gewezen deelnemers, gewezen partners of de pensioengerechtigden hebben geen bezwaren jegens de
      pensioenuitvoerder kenbaar gemaakt tegen de waardeoverdracht nadat zij over het voornemen schriftelijk zijn
      geïnformeerd;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel83
  - number: 83.2.b
    text: |-
      de overdrachtswaarde wordt door de overdragende pensioenuitvoerder zodanig vastgesteld dat de voor mannen
      en vrouwen te verwerven pensioenrechten gelijk zijn waarbij aan het vereiste van collectieve actuariële
      gelijkwaardigheid op basis van dezelfde grondslagen wordt voldaan; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel83
  - number: 83.2.c
    text: |-
      het voornemen tot waardeoverdracht aan een pensioenuitvoerder wordt door de overdragende pensioenuitvoerder
      uiterlijk drie maanden voor de beoogde datum van waardeoverdracht schriftelijk gemeld aan de toezichthouder en de
      toezichthouder heeft binnen die periode geen verbod tot waardeoverdracht opgelegd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel83
  - number: '83.3'
    text: 'Het tweede lid, onderdeel b, is met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel83
  - number: 83.3.a
    text: uitkeringsovereenkomsten van toepassing op pensioenaanspraken die vanaf 1 januari 2002 zijn opgebouwd;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel83
  - number: 83.3.b
    text: |-
      premieovereenkomsten en kapitaalovereenkomsten van toepassing op pensioenaanspraken die vanaf 1 januari 2005 zijn
      opgebouwd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel83
  - number: '83.4'
    text: |-
      Op pensioenaanspraken die voor de in het derde lid genoemde data zijn opgebouwd is de eis van individuele
      actuariële gelijkwaardigheid, bedoeld in [artikel 71, vierde lid][ref1], van toepassing, tenzij in de
      pensioenovereenkomst is overeengekomen dat de voorwaarden, bedoeld in het tweede lid, onderdeel b, van toepassing
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '83.5'
    text: |-
      Voorzover het bij de toepassing van het eerste lid pensioenaanspraken betreft die als gevolg van een premievrije
      voortzetting van die pensioenaanspraken worden opgebouwd is onderdeel b van het tweede lid van toepassing indien
      het recht op die premievrije voortzetting is ontstaan op of na 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel83
  - number: '83.6'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel83
  - number: '83.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld aan het vaststellen van de
      overdrachtswaarde.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel83
  - number: '84.1'
    text: |-
      De pensioenuitvoerder is verplicht tot waardeoverdracht aan een andere pensioenuitvoerder bij liquidatie van de
      eerstgenoemde pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel84
  - number: '84.2'
    text: 'In geval van een waardeoverdracht als bedoeld in het eerste lid gelden de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel84
  - number: 84.2.a
    text: |-
      het voornemen tot waardeoverdracht aan een pensioenuitvoerder wordt door de overdragende pensioenuitvoerder
      uiterlijk drie maanden voor de beoogde datum van waardeoverdracht schriftelijk gemeld aan de toezichthouder en de
      toezichthouder heeft binnen die periode geen verbod tot waardeoverdracht opgelegd;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel84
  - number: 84.2.b
    text: |-
      de overdrachtswaarde wordt zodanig door de overdragende pensioenuitvoerder vastgesteld dat de voor mannen
      en vrouwen te verwerven pensioenrechten gelijk zijn, waarbij aan het vereiste van collectieve actuariële
      gelijkwaardigheid op basis van dezelfde grondslagen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel84
  - number: '84.3'
    text: 'Het tweede lid, onderdeel b, is met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel84
  - number: 84.3.a
    text: uitkeringsovereenkomsten van toepassing op pensioenaanspraken die vanaf 1 januari 2002 zijn opgebouwd;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel84
  - number: 84.3.b
    text: |-
      premieovereenkomsten en kapitaalovereenkomsten van toepassing op pensioenaanspraken die vanaf 1 januari 2005 zijn
      opgebouwd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel84
  - number: '84.4'
    text: |-
      Op pensioenaanspraken die voor de in het derde lid genoemde data zijn opgebouwd is de eis van individuele
      actuariële gelijkwaardigheid, bedoeld in [artikel 71, vierde lid][ref1], van toepassing tenzij in de
      pensioenovereenkomst is overeengekomen dat de voorwaarden, bedoeld in het tweede lid, onderdeel b, van toepassing
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '84.5'
    text: |-
      Voorzover het bij de toepassing van het eerste lid pensioenaanspraken betreft die als gevolg van een premievrije
      voortzetting van die pensioenaanspraken worden opgebouwd is onderdeel b van het tweede lid van toepassing indien
      het recht op die premievrije voortzetting is ontstaan op of na 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel84
  - number: '84.6'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel84
  - number: '84.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld aan het vaststellen van de
      overdrachtswaarde.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel84
  - number: '85.1'
    text: |-
      De pensioenuitvoerder is verplicht om na een verzoek van de gewezen deelnemer tot waardeoverdracht de
      overdrachtswaarde van diens pensioenaanspraken over te dragen aan een pensioeninstelling uit een andere lidstaat of
      een verzekeraar met een zetel buiten Nederland als bedoeld in [artikel 23, eerste lid][ref1], indien voldaan wordt
      aan de in [artikel 71][ref2] genoemde voorwaarden, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 85.1.a
    text: |-
      de in [artikel 72][ref1] gestelde eis inzake de ontvangende pensioenuitvoerder niet van toepassing is; en mits


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 85.1.b
    text: |-
      de mogelijkheden tot afkoop van de waarde van de overgedragen pensioenaanspraken na de waardeoverdracht niet ruimer
      zijn dan op basis van deze wet.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel85
  - number: '85.2'
    text: |-
      Indien op grond van de in [artikel 72][ref1] genoemde omstandigheden tijdelijk geen plicht tot waardeoverdracht
      bestaat, maar deze plicht overeenkomstig [artikel 74][ref2] herleeft, is [artikel 74, derde lid][ref3], niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel74
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '74'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '74'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '85.3'
    text: |-
      De overdragende pensioenuitvoerder brengt in het kader van de waardeoverdracht geen kosten in rekening bij de
      gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel85
  - number: '86.1'
    text: |-
      De pensioenuitvoerder is verplicht om na een verzoek van de gewezen deelnemer tot waardeoverdracht de
      overdrachtswaarde van diens pensioenaanspraken over te dragen aan een van de Europese Gemeenschappen of aan een op
      grond van [artikel 70, tweede lid][ref1], door Onze Minister aangewezen instelling, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel70
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '70'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 86.1.a
    text: er sprake is van beëindiging van de dienstbetrekking dan wel beëindiging van de deelneming;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel86
  - number: 86.1.b
    text: |-
      die waardeoverdracht ertoe strekt het de gewezen deelnemer mogelijk te maken pensioenaanspraken te verwerven bij
      een van de Europese Gemeenschappen of de aangewezen genoemde instelling; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel86
  - number: 86.1.c
    text: de waarde rechtstreeks wordt overgedragen aan de betrokken Europese Gemeenschap of de aangewezen instelling.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel86
  - number: '86.2'
    text: |-
      De overdragende pensioenuitvoerder brengt in het kader van de waardeoverdracht geen kosten in rekening bij de
      gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel86
  - number: '86.3'
    text: |-
      De op grond van [artikel 71, zevende lid][ref1], bij of krachtens algemene maatregel van bestuur gestelde regels
      ten aanzien van de berekening van de overdrachtswaarde zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '87.1'
    text: |-
      De pensioenuitvoerder die een verzoek tot waardeoverdracht ontvangt van een gewezen deelnemer waarbij beoogd wordt
      de waarde over te dragen aan een buitenlandse instelling, meldt dit aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel87
  - number: '87.2'
    text: |-
      Waardeoverdracht aan een buitenlandse instelling is alleen mogelijk wanneer ten genoegen van de toezichthouder
      wordt aangetoond dat:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel87
  - number: 87.2.a
    text: |-
      voldaan wordt aan de in [artikel 71, eerste lid][ref1], genoemde voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 87.2.b
    text: |-
      de in [artikel 72][ref1] bedoelde omstandigheden op de overdragende pensioenuitvoerder niet van toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 87.2.c
    text: de buitenlandse instelling de pensioenregeling uitvoert van de nieuwe werkgever;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel87
  - number: 87.2.d
    text: de buitenlandse instelling in het land van vestiging is onderworpen aan een vorm van overheidstoezicht;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel87
  - number: 87.2.e
    text: |-
      de vermogens van de instelling en de werkgever juridisch zijn gescheiden door het bestaan van een aparte
      juridische entiteit van de instelling, door een speciale preferentieregeling ten gunste van pensioengerechtigden of
      anderszins; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel87
  - number: 87.2.f
    text: |-
      de mogelijkheden tot afkoop van de overgedragen pensioenaanspraken na de waardeoverdracht niet ruimer zijn dan op
      basis van deze wet.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel87
  - number: '88'
    text: |-
      De pensioenuitvoerder is bevoegd om op verzoek van de gewezen deelnemer de waarde van zijn pensioenaanspraken over
      te dragen aan een pensioeninstelling uit een andere lidstaat of een verzekeraar met zetel buiten Nederland als
      bedoeld in [artikel 23, eerste lid][ref1], indien wordt voldaan aan de in [artikel 75][ref2] opgenomen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel75
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '75'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '89'
    text: |-
      De pensioenuitvoerder is bevoegd om op verzoek van de deelnemer, gewezen deelnemer of andere aanspraakgerechtigde
      de waarde van zijn pensioenaanspraken welke voortvloeien uit een kapitaalovereenkomst of een premieovereenkomst
      per de pensioendatum rechtstreeks over te dragen aan een pensioeninstelling uit een andere lidstaat of een
      verzekeraar met zetel buiten Nederland als bedoeld in [artikel 23, eerste lid][ref1], indien wordt voldaan aan de
      in [artikel 80][ref2] opgenomen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel80
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '80'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '90.1'
    text: |-
      De pensioenuitvoerder is bevoegd om op verzoek van de werkgever over te gaan tot collectieve waardeoverdracht
      overeenkomstig [artikel 83][ref1] indien de werkgever een uitvoeringsovereenkomst heeft gesloten met een
      pensioeninstelling uit een andere lidstaat of een verzekeraar met zetel buiten Nederland als bedoeld in
      [artikel 23, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel23
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '83'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '90.2'
    text: |-
      Aan de in [artikel 84][ref1] geformuleerde verplichting tot waardeoverdracht in geval van liquidatie kan ook worden
      voldaan door waardeoverdracht aan een pensioeninstelling uit een andere lidstaat of een verzekeraar met zetel
      buiten Nederland als bedoeld in [artikel 23, eerste lid][ref2], in plaats van aan een pensioenuitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel23
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '84'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '91.1'
    text: |-
      Indien een pensioenuitvoerder het verzoek krijgt om in het kader van waardeoverdracht een waarde van een
      pensioeninstelling uit een andere lidstaat of een verzekeraar met zetel buiten Nederland aan te nemen die verband
      houdt met een pensioenovereenkomst waarop deze wet tot het tijdstip van waardeoverdracht niet van toepassing is, is
      de pensioenuitvoerder gehouden daarvoor als ontvangende pensioenuitvoerder op te treden, mits:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel91
  - number: 91.1.a
    text: |-
      die waardeoverdracht ertoe strekt het de verzoekende werknemer mogelijk te maken pensioenaanspraken te verwerven
      bij de ontvangende pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel91
  - number: 91.1.b
    text: |-
      op de pensioenuitvoerder de in [artikel 72][ref1] genoemde omstandigheden niet van toepassing zijn; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 91.1.c
    text: |-
      aan de pensioenuitvoerder geen voorwaarden in verband met de waardeoverdracht worden gesteld die in strijd zijn met
      deze wet.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel91
  - number: '91.2'
    text: |-
      De ontvangende pensioenuitvoerder brengt in het kader van de waardeoverdracht geen kosten in rekening bij de
      deelnemer.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel91
  - number: '92'
    text: |-
      Indien een pensioenuitvoerder het verzoek krijgt om in het kader van waardeoverdracht een waarde van een
      buitenlandse instelling aan te nemen die verband houdt met een pensioenovereenkomst waarop deze wet tot het
      tijdstip van waardeoverdracht niet van toepassing is, is de pensioenuitvoerder bevoegd daarvoor als ontvangende
      pensioenuitvoerder op te treden, mits:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel92
  - number: 92.a
    text: |-
      die waardeoverdracht ertoe strekt het de verzoekende werknemer mogelijk te maken pensioenaanspraken te verwerven
      bij de ontvangende pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel92
  - number: 92.b
    text: |-
      op de pensioenuitvoerder de in [artikel 72][ref1] genoemde omstandigheden niet van toepassing zijn; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 92.c
    text: |-
      aan de pensioenuitvoerder geen voorwaarden in verband met de waardeoverdracht worden gesteld die in strijd zijn met
      deze wet.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel92
  - number: '93'
    text: |-
      Inlichtingen uit de gemeentelijke basisadministratie persoonsgegevens en inlichtingen en uittreksels uit de
      registers van de burgerlijke stand, die de pensioenuitvoerder nodig heeft met het oog op de uitvoering van zijn
      taak, zijn vrij van leges.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel93
  - number: '94.1'
    text: |-
      Het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer kan door de pensioenuitvoerder
      in een door hem beheerde persoonsregistratie worden opgenomen en bij het verstrekken van gegevens daaruit worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel94
  - number: '94.2'
    text: |-
      De pensioenuitvoerder gebruikt dit burgerservicenummer of, bij het ontbreken daarvan, dit sociaal-fiscaalnummer
      uitsluitend:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel94
  - number: 94.2.a
    text: in het verkeer met de persoon op wie het nummer betrekking heeft; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel94
  - number: 94.2.b
    text: |-
      in contacten met personen en instanties voor zover deze zelf gemachtigd zijn tot het opnemen van het
      burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer in een persoonsregistratie.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel94
  - number: '95.1'
    text: |-
      Bij voorwaardelijke toeslagverlening dient er een consistent geheel te zijn tussen de gewekte verwachtingen, de
      financiering en het realiseren van voorwaardelijke toeslagen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel95
  - number: '95.2'
    text: |-
      Bij regeling van Onze Minister wordt invulling gegeven aan het begrip consistentie, bedoeld in het eerste lid. Een
      regeling als bedoeld in de eerste volzin kan worden vastgesteld vier weken nadat het ontwerp is overgelegd aan de
      beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel95
  - number: '95.3'
    text: |-
      Een toeslag is alleen voorwaardelijk indien in de pensioenovereenkomst, de uitvoeringsovereenkomst, het
      pensioenreglement, de opgaven op grond van de [artikelen 21][ref1], [38 tot en met 46][ref2] en in de overige
      informatieverstrekking door de pensioenuitvoerder een voorwaardelijkheidsverklaring is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel38
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '95.4'
    text: Bij regeling van Onze Minister worden regels gesteld over de inhoud van de voorwaardelijkheidsverklaring.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel95
  - number: '96'
    text: 'Een pensioenuitvoerder vermeldt in zijn jaarverslag of in het afgelopen boekjaar:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel96
  - number: 96.a
    text: |-
      aan de pensioenuitvoerder dwangsommen en bestuurlijke boeten zijn opgelegd, en zo ja, hoeveel deze in totaal hebben
      bedragen;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel96
  - number: 96.b
    text: |-
      een aanwijzing als bedoeld in [artikel 171][ref1] aan de pensioenuitvoerder is gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel171
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '171'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 96.c
    text: |-
      een bewindvoerder als bedoeld in [artikel 173][ref1] is aangesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel173
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '173'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 96.d
    text: |-
      een kortetermijnherstelplan als bedoeld in [artikel 140][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel140
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '140'
        hoofdstuk: '6'
  - number: 96.e
    text: |-
      een langetermijnherstelplan als bedoeld in [artikel 138][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel138
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
  - number: 96.f
    text: |-
      de beëindiging van de situatie, bedoeld in [artikel 172][ref1], waarin de bevoegdheidsuitoefening van alle of
      bepaalde organen van een pensioenfonds is gebonden aan toestemming van de toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel172
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '172'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '97.1'
    text: Een gedetacheerde werknemer kan tijdens de detachering blijven deelnemen aan de pensioenregeling.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel97
  - number: '97.2'
    text: |-
      Indien tijdens detachering in Nederland de betaling van bijdragen in een andere lidstaat wordt voortgezet, worden
      de in Nederland gedetacheerde werknemer en diens werkgever vrijgesteld van de verplichting tot het betalen van
      bijdragen in Nederland.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel97
  - number: '97.3'
    text: Het eerste en tweede lid zijn van toepassing op detacheringen die op of na 25 juli 2001 zijn aangevangen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel97
  - number: '98'
    text: |-
      Overlijdt een deelnemer, gewezen deelnemer of gepensioneerde ten gevolge van een van het risico uitgesloten oorzaak
      en betrof het een partnerpensioen op opbouwbasis, dan keert de pensioenuitvoerder aan de partner een periodieke
      uitkering van partnerpensioen uit die gebaseerd is op de premievrije waarde berekend naar de dag voorafgaande aan
      het overlijden.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel98
  - number: '99.1'
    text: |-
      In het bestuur van een bedrijfstakpensioenfonds bezetten de vertegenwoordigers van werkgeversverenigingen en de
      vertegenwoordigers van werknemersverenigingen in de betrokken bedrijfstak of bedrijfstakken evenveel zetels.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel99
  - number: '99.2'
    text: |-
      Indien de statuten van een bedrijfstakpensioenfonds voorzien in stemgerechtigde vertegenwoordigers in het
      bestuur van anderen dan werknemers- of werkgeversverenigingen binnen de betrokken bedrijfstak of bedrijfstakken,
      worden die vertegenwoordigers voor de toepassing van het eerste lid gelijkgesteld met vertegenwoordigers van
      werknemersverenigingen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel99
  - number: '99.3'
    text: |-
      In het bestuur van een ondernemingspensioenfonds bezetten de werknemersvertegenwoordigers ten minste
      evenveel zetels als de werkgeversvertegenwoordigers, met dien verstande dat indien vertegenwoordigers van
      pensioengerechtigden zetels bezetten, zij tezamen met werknemersvertegenwoordigers ten minste evenveel zetels
      bezetten als de werkgeversvertegenwoordigers.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel99
  - number: '99.4'
    text: |-
      Indien een ondernemingspensioenfonds pensioenregelingen uitvoert voor meerdere ondernemingen of groepen wordt
      elke onderneming of groep door ten minste een werknemersvertegenwoordiger en een werkgeversvertegenwoordiger
      vertegenwoordigd in het bestuur.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel99
  - number: '99.5'
    text: 'De benoeming van de werknemersvertegenwoordigers in het bestuur van een ondernemingspensioenfonds vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel99
  - number: 99.5.a
    text: na verkiezing van de vertegenwoordigers door en uit de deelnemers;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel99
  - number: 99.5.b
    text: |-
      op voordracht van de vertegenwoordigers van de deelnemers in een deelnemersraad als bedoeld in [artikel 110][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel110
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '110'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 99.5.c
    text: op voordracht van de ondernemingsraad; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel99
  - number: 99.5.d
    text: op een andere wijze, mits de ondernemingsraad heeft ingestemd met deze benoemingswijze.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel99
  - number: '99.6'
    text: |-
      Indien de statuten van een ondernemingspensioenfonds voorzien in stemgerechtigde vertegenwoordigers in het bestuur
      van anderen dan werknemers of de werkgever, worden die vertegenwoordigers voor de toepassing van het derde en
      vierde lid gelijkgesteld met de werknemersvertegenwoordigers.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel99
  - number: '99.7'
    text: |-
      Het derde tot en met zesde lid is niet van toepassing voor zover een onderneming of groep waaraan het pensioenfonds
      verbonden was heeft opgehouden te bestaan.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel99
  - number: '100.1'
    text: 'Een ondernemingspensioenfonds waarvan:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel100
  - number: 100.1.a
    text: |-
      het aantal pensioengerechtigden ten minste 10% bedraagt van de som van het aantal deelnemers en het aantal
      pensioengerechtigden en waarvan het aantal pensioengerechtigden ten minste 25 personen bedraagt; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel100
  - number: 100.1.b
    text: het aantal pensioengerechtigden ten minste 1000 personen bedraagt;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel100
  - number: '100.2'
    text: |-
      Het ondernemingspensioenfonds raadpleegt schriftelijk de pensioengerechtigden over de wijze waarop de
      medezeggenschap van pensioengerechtigden, bedoeld in het eerste lid, wordt vorm gegeven, tenzij bij het
      ondernemingspensioenfonds al is voorzien in een deelnemersraad en een bestuur waarin vertegenwoordigers van
      pensioengerechtigden zitting hebben.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel100
  - number: '100.3'
    text: |-
      Het ondernemingspensioenfonds volgt met betrekking tot de wijze waarop de medezeggenschap van pensioengerechtigden
      vorm wordt gegeven de wens van de meerderheid van de responderende pensioengerechtigden, mits ten minste de helft
      van het aantal pensioengerechtigden zijn voorkeur kenbaar heeft gemaakt, tenzij er zwaarwegende redenen zijn om af
      te wijken van de door de meerderheid van de pensioengerechtigden gemaakte keuze.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel100
  - number: '101.1'
    text: |-
      De verdeling van de zetels van werknemersvertegenwoordigers en vertegenwoordigers van pensioengerechtigden
      vindt plaats op basis van de onderlinge getalsverhoudingen, met dien verstande dat de vertegenwoordigers van
      pensioengerechtigden ten hoogste de helft van het aantal zetels in het bestuur van een ondernemingspensioenfonds
      bezetten dat werknemersvertegenwoordigers en vertegenwoordigers van pensioengerechtigden gezamenlijk bezetten.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel101
  - number: '101.2'
    text: |-
      In afwijking van het eerste lid kunnen vertegenwoordigers van pensioengerechtigden meer zetels bezetten dan
      werknemersvertegenwoordigers, indien het aantal deelnemers minder bedraagt dan 10% van de som van het aantal
      deelnemers en pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel101
  - number: '101.3'
    text: |-
      In afwijking van het eerste lid kunnen vertegenwoordigers van pensioengerechtigden minder zetels bezetten dan
      het aantal op basis van de onderlinge getalsverhoudingen, bedoeld in het eerste lid, indien pensioengerechtigden
      bij de raadpleging, bedoeld in [artikel 100, tweede lid][ref1], hebben gekozen voor een deelnemersraad en de
      vertegenwoordigers van pensioengerechtigden al voor die raadpleging zetels in het bestuur bezetten.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel100
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '100'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '101.4'
    text: |-
      De benoeming van de vertegenwoordigers van pensioengerechtigden in het bestuur van een ondernemingspensioenfonds
      vindt plaats na verkiezing van de vertegenwoordigers door en uit de pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel101
  - number: '102.1'
    text: |-
      Het pensioenfonds meldt binnen drie maanden na zijn oprichting deze oprichting aan de toezichthouder door middel
      van een door de toezichthouder vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel102
  - number: '102.2'
    text: 'Bij de melding, bedoeld in het eerste lid, worden gevoegd:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel102
  - number: 102.2.a
    text: een authentiek afschrift van de akte van oprichting van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel102
  - number: 102.2.b
    text: een door het bestuur gewaarmerkt exemplaar van het reglement of de reglementen van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel102
  - number: 102.2.c
    text: een door het bestuur gewaarmerkt afschrift van de uitvoeringsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel102
  - number: 102.2.d
    text: |-
      een actuariële en bedrijfstechnische nota als bedoeld in [artikel 145][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel145
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '145'
        hoofdstuk: '6'
  - number: 102.2.e
    text: een eventuele overeenkomst tot herverzekering, overdracht of onderbrenging.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel102
  - number: '103'
    text: 'Het pensioenfonds zendt:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel103
  - number: 103.a
    text: een authentiek afschrift van de akte houdende wijziging van de statuten;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel103
  - number: 103.b
    text: een door het bestuur gewaarmerkt exemplaar van wijziging van de reglementen;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel103
  - number: 103.c
    text: een door het bestuur gewaarmerkt afschrift van de wijzigingen in de uitvoeringsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel103
  - number: 103.d
    text: |-
      een door het bestuur gewaarmerkt afschrift van de wijzigingen in de actuariële en bedrijfstechnische nota als
      bedoeld in [artikel 145][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel145
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '145'
        hoofdstuk: '6'
  - number: 103.e
    text: |-
      een door het bestuur gewaarmerkt afschrift van de wijzigingen in de eventuele overeenkomst tot herverzekering,
      overdracht of onderbrenging;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel103
  - number: '104.1'
    text: |-
      De werkgever draagt er zorg voor dat de werknemers die staan of gestaan hebben op een kandidatenlijst voor de
      deelnemersraad of het verantwoordingsorgaan alsmede de leden en de gewezen leden van het pensioenfondsbestuur,
      de deelnemersraad of het verantwoordingsorgaan niet uit hoofde van hun kandidaatstelling voor of hun lidmaatschap
      van het pensioenfondsbestuur, de deelnemersraad of het verantwoordingsorgaan worden benadeeld in hun positie als
      werknemer.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel104
  - number: '104.2'
    text: |-
      Indien het pensioenfonds in zijn hoedanigheid als werkgever aan de deelnemersraad of het verantwoordingsorgaan een
      secretaris heeft toegevoegd is het eerste lid op die secretaris van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel104
  - number: '104.3'
    text: |-
      Op degene die het initiatief neemt of heeft genomen tot het instellen van een deelnemersraad is het eerste lid van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel104
  - number: '104.4'
    text: |-
      De deelnemersraad, het verantwoordingsorgaan en een werknemer als bedoeld in het eerste tot en met derde lid kunnen
      de kantonrechter verzoeken te bepalen dat de werkgever gevolg dient te geven aan hetgeen in deze leden is bepaald.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel104
  - number: '104.5'
    text: |-
      De werkgever kan de arbeidsovereenkomst niet opzeggen met de werknemer die lid is van een bestuur van een
      pensioenfonds, een deelnemersraad of van een verantwoordingsorgaan. Indien de werkgever aan een pensioenfonds,
      deelnemersraad of een verantwoordingsorgaan een secretaris heeft toegevoegd, is de eerste volzin op die secretaris
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel104
  - number: '104.6'
    text: |-
      De werkgever kan zonder voorafgaande toestemming van de kantonrechter de arbeidsovereenkomst niet opzeggen met een
      werknemer die geplaatst is op een kandidatenlijst voor een bestuur van een pensioenfonds, een deelnemersraad of een
      verantwoordingsorgaan of die korter dan twee jaar geleden lid is geweest van een bestuur van een pensioenfonds, een
      deelnemersraad of een verantwoordingsorgaan.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel104
  - number: '104.7'
    text: |-
      De toestemming van de kantonrechter wordt gevraagd bij verzoekschrift. De kantonrechter verleent de toestemming
      slechts indien de werkgever aannemelijk heeft gemaakt dat opzegging geen verband houdt met een omstandigheid als
      bedoeld in het eerste lid. Van de uitspraak staat geen hoger beroep of beroep in cassatie open.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel104
  - number: '104.8'
    text: |-
      Ten aanzien van personen die krachtens publiekrechtelijke aanstelling bij de werkgever werkzaam zijn, treedt een
      andere sector van de rechtbank in de plaats van de kantonrechter.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel104
  - number: '104.9'
    text: |-
      Het vijfde tot en met achtste lid zijn niet van toepassing bij een opzegging gedurende de proeftijd, wegens een
      dringende reden, indien de werknemer schriftelijk met de opzegging instemt of indien de opzegging geschiedt wegens
      de beëindiging van de werkzaamheden van de onderneming of van het onderdeel van de onderneming, waarin de werknemer
      uitsluitend of in hoofdzaak werkzaam is.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel104
  - number: '105.1'
    text: Ten minste twee natuurlijke personen bepalen het dagelijks beleid van een pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel105
  - number: '105.2'
    text: |-
      De personen die het beleid van een pensioenfonds bepalen of mede bepalen richten zich bij de vervulling
      van hun taak naar de belangen van de bij het pensioenfonds betrokken deelnemers, gewezen deelnemers, andere
      aanspraakgerechtigden, de pensioengerechtigden en de werkgever en zorgen ervoor dat dezen zich door hen op
      evenwichtige wijze vertegenwoordigd kunnen voelen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel105
  - number: '105.3'
    text: |-
      Het beleid van een pensioenfonds wordt bepaald of mede bepaald door personen die deskundig zijn in verband met de
      uitoefening van het bedrijf van het pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel105
  - number: '105.4'
    text: |-
      Iedere bestuurder van een pensioenfonds is bevoegd een deskundige te raadplegen, of zich krachtens een
      bestuursbesluit, waarbij ten minste één vierde van de bestuurders zich daarvoor heeft uitgesproken, ter vergadering
      door een deskundige te laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel105
  - number: '105.5'
    text: |-
      Het bestuur van een pensioenfonds draagt er zorg voor dat de betrouwbaarheid van de personen die het beleid van het
      pensioenfonds bepalen of mede bepalen buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel105
  - number: '105.6'
    text: |-
      Het bestuur van het pensioenfonds meldt elke wijziging in de samenstelling van de personen die het beleid van het
      pensioenfonds bepalen of mede bepalen vooraf aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel105
  - number: '105.7'
    text: 'Een wijziging als bedoeld in het zesde lid wordt niet doorgevoerd indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel105
  - number: 105.7.a
    text: |-
      de toezichthouder binnen zes weken na ontvangst van de melding van de wijziging aan het pensioenfonds bekend maakt
      dat het niet met de voorgenomen wijziging instemt; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel105
  - number: 105.7.b
    text: |-
      de toezichthouder om nadere gegevens of inlichtingen heeft verzocht en binnen zes weken na ontvangst van die
      gegevens of inlichtingen aan het pensioenfonds bekend maakt dat het niet met de voorgenomen wijziging instemt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel105
  - number: '105.8'
    text: |-
      Indien zich een wijziging voordoet van de antecedenten die van invloed is op de betrouwbaarheid van de personen,
      bedoeld in het vijfde lid, stelt het pensioenfonds de toezichthouder daarvan onverwijld schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel105
  - number: '105.9'
    text: |-
      De betrouwbaarheid van een persoon staat buiten twijfel wanneer dat eenmaal door de toezichthouder voor de
      toepassing van deze wet is vastgesteld, zolang niet een wijziging in de relevante feiten of omstandigheden een
      redelijke aanleiding geeft tot een nieuwe beoordeling.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel105
  - number: '105.10'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het derde en het vijfde
      tot en met het achtste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel105
  - number: '106.1'
    text: 'In de statuten van een pensioenfonds worden bepalingen opgenomen betreffende:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel106
  - number: 106.1.a
    text: het doel van het pensioenfonds, waaronder een omschrijving van de werkingssfeer;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel106
  - number: 106.1.b
    text: de bestemming van de middelen van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel106
  - number: 106.1.c
    text: het beheer van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel106
  - number: 106.1.d
    text: de inkomsten van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel106
  - number: 106.1.e
    text: de belegging van de gelden;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel106
  - number: 106.1.f
    text: de wijze waarop de bestuursleden worden benoemd;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel106
  - number: 106.1.g
    text: de wijze waarop de leden van de deelnemersraad worden gekozen;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel106
  - number: 106.1.h
    text: de wijziging van de statuten;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel106
  - number: 106.1.i
    text: |-
      de liquidatie van het pensioenfonds, waaronder begrepen de verplichtingen van de liquidateuren en de bestemming van
      de bezittingen van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel106
  - number: 106.1.j
    text: de wijze waarop het intern toezicht is georganiseerd;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel106
  - number: 106.1.k
    text: de wijze waarop de leden van het verantwoordingsorgaan worden benoemd en ontslagen; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel106
  - number: 106.1.l
    text: |-
      de wijze waarop beëindiging van een uitvoeringsovereenkomst als bedoeld in [artikel 2, twaalfde lid][ref1]
      geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel2
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '106.2'
    text: |-
      De omschrijving van de werkingssfeer, bedoeld in het eerste lid, onderdeel a, vindt ten aanzien van een
      bedrijfstakpensioenfonds plaats door het omschrijven van de bedrijfsactiviteiten van de bedrijfstak.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel106
  - number: '106.3'
    text: |-
      Een bedrijfstakpensioenfonds dat aan werkgevers de mogelijkheid biedt om zich vrijwillig aan te sluiten bepaalt in
      zijn statuten onder welke voorwaarden deze vrijwillige aansluiting mogelijk is.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel106
  - number: '107'
    text: |-
      Iedere bepaling die het lidmaatschap van het bestuur, een deelnemersraad of een verantwoordingsorgaan onmogelijk
      maakt op grond van het bereikt hebben van een bepaalde leeftijd is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel107
  - number: '108'
    text: |-
      Iedere bepaling die een instemmingsrecht inhoudt van een partij, die geen orgaan is van het pensioenfonds, inzake
      een besluit of voorgenomen besluit van het pensioenfonds is nietig, tenzij in deze wet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel108
  - number: '109.1'
    text: Een bedrijfstakpensioenfonds stelt een deelnemersraad in.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel109
  - number: '109.2'
    text: |-
      In de deelnemersraad zijn de deelnemers en de pensioengerechtigden evenredig op basis van onderlinge
      getalsverhoudingen vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel109
  - number: '109.3'
    text: |-
      Op grond van door het bestuur van het pensioenfonds vast te stellen criteria kunnen naast de in het tweede lid
      bedoelde vertegenwoordigers ook één of meer vertegenwoordigers van gewezen deelnemers in de deelnemersraad zitting
      hebben.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel109
  - number: '109.4'
    text: |-
      In geval van verkiezing van de leden van de deelnemersraad door deelnemers, gewezen deelnemers en
      pensioengerechtigden worden kandidaten voorgedragen door een of meer verenigingen van wie:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel109
  - number: 109.4.a
    text: ten minste 1% van de geleding, voor welke die vereniging een kandidaat voordraagt, lid is; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel109
  - number: 109.4.b
    text: ten minste 250 personen van die geleding, voor welke die vereniging een kandidaat voordraagt, lid zijn.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel109
  - number: '109.5'
    text: |-
      Voor zover geen verkiezing door de deelnemers, gewezen deelnemers en pensioengerechtigden plaatsvindt, zijn
      verenigingen, die voldoen aan de in het vierde lid bedoelde criteria, evenredig aan hun ledentallen binnen het
      pensioenfonds vertegenwoordigd in de deelnemersraad binnen de betreffende geleding.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel109
  - number: '109.6'
    text: |-
      Een vereniging als bedoeld in het vierde en vijfde lid, bezit volledige rechtsbevoegdheid. Haar statutair doel
      omvat mede het behartigen van de belangen van haar leden als belanghebbenden bij een bedrijfstakpensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel109
  - number: '109.7'
    text: |-
      Bij regeling van Onze Minister kunnen verenigingen worden aangewezen op wie het vierde, vijfde en zesde lid, voor
      een bij die aanwijzing te bepalen periode niet van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel109
  - number: '110.1'
    text: 'Het bestuur van een ondernemingspensioenfonds gaat over tot het instellen van een deelnemersraad:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel110
  - number: 110.1.a
    text: op eigen initiatief van het ondernemingspensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel110
  - number: 110.1.b
    text: indien dit wordt verzocht door ten minste 5% van de deelnemers, gewezen deelnemers en pensioengerechtigden; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel110
  - number: 110.1.c
    text: |-
      indien de pensioengerechtigden in de raadpleging, bedoeld in [artikel 100][ref1], zich overeenkomstig
      [artikel 100, tweede en derde lid][ref2], hebben uitgesproken voor instelling van een deelnemersraad.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel100
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '100'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '100'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '110.2'
    text: |-
      In de deelnemersraad zijn de deelnemers en de pensioengerechtigden evenredig op basis van onderlinge
      getalsverhoudingen vertegenwoordigd. Indien een ondernemingspensioenfonds pensioenregelingen uitvoert voor meerdere
      ondernemingen of groepen wordt elke onderneming of groep door ten minste een deelnemer en een pensioengerechtigde
      vertegenwoordigd in de deelnemersraad.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel110
  - number: '110.3'
    text: |-
      Op grond van door het bestuur van het pensioenfonds vast te stellen criteria kunnen naast de in het tweede lid
      bedoelde vertegenwoordigers ook één of meer vertegenwoordigers van gewezen deelnemers in de deelnemersraad zitting
      hebben.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel110
  - number: '110.4'
    text: |-
      In geval van verkiezing van de leden van de deelnemersraad door deelnemers, gewezen deelnemers en
      pensioengerechtigden kunnen kandidaten worden voorgedragen door verenigingen en door individuele deelnemers,
      gewezen deelnemers en pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel110
  - number: '110.5'
    text: |-
      Voor zover geen verkiezing door de deelnemers, gewezen deelnemers en pensioengerechtigden plaatsvindt, maar de
      leden worden benoemd door verenigingen, zijn deze verenigingen evenredig aan hun ledenaantallen binnen hun geleding
      binnen het ondernemingspensioenfonds vertegenwoordigd in de deelnemersraad.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel110
  - number: '110.6'
    text: |-
      Een vereniging als bedoeld in het vierde en vijfde lid bezit volledige rechtsbevoegdheid; haar statutair doel omvat
      mede het behartigen van de belangen van haar leden als belanghebbenden bij een ondernemingspensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel110
  - number: '111.1'
    text: |-
      De deelnemersraad adviseert het pensioenfonds desgevraagd of uit eigen beweging over aangelegenheden die het
      pensioenfonds betreffen.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel111
  - number: '111.2'
    text: |-
      Het pensioenfonds stelt de deelnemersraad in ieder geval in de gelegenheid advies uit te brengen over elk
      voorgenomen besluit van het pensioenfonds tot:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel111
  - number: 111.2.a
    text: het nemen van maatregelen van algemene strekking;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel111
  - number: 111.2.b
    text: wijziging van de statuten en reglementen van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel111
  - number: 111.2.c
    text: |-
      vaststelling van het jaarverslag, de jaarrekening, de actuariële en bedrijfstechnische nota, bedoeld in
      [artikel 145][ref1] en een langetermijnherstelplan als bedoeld in [artikel 138][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel145
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel138
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '145'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
  - number: 111.2.d
    text: |-
      vermindering van de verworven pensioenaanspraken en pensioenrechten indien toepassing wordt gegeven aan
      [artikel 134][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '134'
        hoofdstuk: '6'
  - number: 111.2.e
    text: het vaststellen en wijzigen van het toeslagbeleid;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel111
  - number: 111.2.f
    text: |-
      gehele of gedeeltelijke overdracht van de verplichtingen van het pensioenfonds of de overname van verplichtingen
      door het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel111
  - number: 111.2.g
    text: liquidatie van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel111
  - number: 111.2.h
    text: het sluiten, wijzigen of beëindigen van een uitvoeringsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel111
  - number: 111.2.i
    text: |-
      het terugstorten van premie of geven van premiekorting, bedoeld in [artikel 129][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel129
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '129'
        hoofdstuk: '6'
  - number: 111.2.j
    text: |-
      samenvoeging van pensioenfondsen als bedoeld in de definitie van ondernemingspensioenfonds in [artikel 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '111.3'
    text: |-
      Het advies van de deelnemersraad wordt op een zodanig tijdstip gevraagd dat het van wezenlijke invloed kan zijn op
      de in het tweede lid bedoelde besluiten.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel111
  - number: '111.4'
    text: |-
      Het pensioenfonds stelt de deelnemersraad na de in [artikel 114, aanhef en onderdeel a][ref1], bedoelde mededeling
      over het kortetermijnherstelplan in de gelegenheid advies uit te brengen over dit kortetermijnherstelplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel114
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '114'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '111.5'
    text: |-
      Bij het vragen van advies wordt aan de deelnemersraad een overzicht verstrekt van de beweegredenen voor het besluit
      en van de gevolgen die het besluit naar verwachting voor de deelnemers, gewezen deelnemers en pensioengerechtigden
      zal hebben.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel111
  - number: '111.6'
    text: |-
      Het bestuur van het pensioenfonds en de deelnemersraad komen ten minste tweemaal per kalenderjaar in vergadering
      bijeen. Tijdens deze vergaderingen worden de aangelegenheden aan de orde gesteld waarover het bestuur van het
      pensioenfonds of de deelnemersraad overleg wenselijk acht.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel111
  - number: '111.7'
    text: |-
      Het pensioenfonds verstrekt desgevraagd aan de deelnemersraad tijdig alle inlichtingen en gegevens, die deze voor
      de vervulling van zijn taak redelijkerwijze nodig heeft. De inlichtingen worden desgevraagd schriftelijk verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel111
  - number: '112'
    text: |-
      In de statuten van het pensioenfonds kunnen aan de deelnemersraad verdere bevoegdheden dan de in deze wet genoemde
      worden toegekend.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel112
  - number: '113'
    text: |-
      Het pensioenfonds deelt de deelnemersraad zo spoedig mogelijk schriftelijk mee, of het een advies niet of niet
      geheel volgt, waarbij tevens wordt meegedeeld waarom van het advies of van een daarin vervat minderheidsadvies
      wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel113
  - number: '114'
    text: 'Een pensioenfonds informeert de deelnemersraad onverwijld schriftelijk over:'
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel114
  - number: 114.a
    text: |-
      de verplichting tot opstelling van een kortetermijnherstelplan als bedoeld in [artikel 140][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel140
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '140'
        hoofdstuk: '6'
  - number: 114.b
    text: |-
      de verplichting tot opstelling van een langetermijnherstelplan als bedoeld in [artikel 138][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel138
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
  - number: 114.c
    text: |-
      de aanstelling van een bewindvoerder als bedoeld in [artikel 173][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel173
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '173'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 114.d
    text: |-
      de beëindiging van de situatie, bedoeld in [artikel 172][ref1], waarin de bevoegdheiduitoefening van alle
      of bepaalde organen van een pensioenfonds is gebonden aan toestemming van een of meer door de toezichthouder
      aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel172
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '172'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '115.1'
    text: |-
      Een bedrijfstakpensioenfonds en een ondernemingspensioenfonds staan de leden van een deelnemersraad het gebruik toe
      van de voorzieningen waarover het kan beschikken, voor zover dat redelijkerwijs voor de vervulling van hun taken
      nodig is.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel115
  - number: '115.2'
    text: |-
      Ten aanzien van de rechten en bevoegdheden van een deelnemersraad in verhouding tot het bestuur van het
      bedrijfstakpensioenfonds en ondernemingspensioenfonds zijn de [artikelen 10][ref1], [16][ref2], [17][ref3],
      [18][ref4], [22 van de Wet op de ondernemingsraden][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0002747#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0002747#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0002747#Artikel22
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0002747
        artikel: '17'
      - id: ref4
        bwb_id: BWBR0002747
        artikel: '18'
      - id: ref5
        bwb_id: BWBR0002747
        artikel: '22'
  - number: '116.1'
    text: |-
      Een pensioenfonds verricht slechts activiteiten in verband met pensioen en werkzaamheden die daarmee verband
      houden.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel116
  - number: '116.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter zake van activiteiten die door
      pensioenfondsen kunnen worden verricht.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel116
  - number: '117'
    text: |-
      Een pensioenfonds kan uitsluitend een vrijwillige pensioenregeling uitvoeren indien dit een aanvulling op een door
      datzelfde pensioenfonds uitgevoerde basispensioenregeling betreft.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel117
  - number: '118.1'
    text: |-
      Een basispensioenregeling in de vorm van een uitkeringsovereenkomst welke wordt uitgevoerd door een pensioenfonds
      voldoet aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel118
  - number: 118.1.a
    text: de werkgever draagt ten minste 10 procent van de actuariële kosten van de basispensioenregeling bij; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel118
  - number: 118.1.b
    text: |-
      de werknemerspremie voor de basispensioenregeling is voor alle deelnemers gelijk of bedraagt een gelijk percentage
      van het loon dan wel van het gedeelte van het loon dat voor de pensioenberekening in aanmerking wordt genomen,
      met dien verstande dat voor verschillende soorten pensioen en voor verschillende pensioenregelingen verschillende
      premies kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel118
  - number: '118.2'
    text: |-
      Een vrijwillige pensioenregeling in de vorm van een uitkeringsovereenkomst welke wordt uitgevoerd door een
      pensioenfonds voldoet aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel118
  - number: 118.2.a
    text: de werkgever draagt ten minste 10 procent van de actuariële kosten van de vrijwillige pensioenregeling bij;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel118
  - number: 118.2.b
    text: |-
      de werknemerspremie voor de vrijwillige pensioenregeling is voor alle deelnemers gelijk of bedraagt een gelijk
      percentage van het loon dan wel van het gedeelte van het loon dat voor de pensioenberekening in aanmerking wordt
      genomen, met dien verstande dat voor verschillende soorten pensioen en voor verschillende pensioenregelingen
      verschillende premies kunnen worden vastgesteld; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel118
  - number: 118.2.c
    text: |-
      de kosten verbonden aan het toeslagbeleid worden niet ten laste gebracht van de individuele deelnemers, maar ten
      laste van de collectiviteit van het pensioenfonds en voor de toeslagverlening gelden dezelfde voorwaarden die van
      toepassing zijn op de basispensioenregeling.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel118
  - number: '118.3'
    text: |-
      Indien de vrijwillige pensioenregeling voldoet aan de voorwaarde, bedoeld in het tweede lid, onderdeel a, deelt het
      pensioenfonds dit schriftelijk aan de deelnemers en de toezichthouder mee.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel118
  - number: '118.4'
    text: Het eerste lid is niet van toepassing op een verplichtgesteld bedrijfstakpensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel118
  - number: '119.1'
    text: |-
      Een basispensioenregeling in de vorm van een kapitaalovereenkomst welke wordt uitgevoerd door een pensioenfonds
      voldoet aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel119
  - number: 119.1.a
    text: de werkgever draagt ten minste 10 procent van de actuariële kosten van de basispensioenregeling bij; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel119
  - number: 119.1.b
    text: |-
      de werknemerspremie voor de basispensioenregeling is voor alle deelnemers gelijk of bedraagt een gelijk percentage
      van het loon dan wel van het gedeelte van het loon dat voor de pensioenberekening in aanmerking wordt genomen,
      met dien verstande dat voor verschillende soorten pensioen en voor verschillende pensioenregelingen verschillende
      premies kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel119
  - number: '119.2'
    text: |-
      Een vrijwillige pensioenregeling in de vorm van een kapitaalovereenkomst welke wordt uitgevoerd door een
      pensioenfonds voldoet aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel119
  - number: 119.2.a
    text: de werkgever draagt ten minste 10 procent van de actuariële kosten van de vrijwillige pensioenregeling bij; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel119
  - number: 119.2.b
    text: |-
      indien de deelnemer overlijdt dan wel gepensioneerde of gewezen deelnemer wordt, wordt het opgebouwde kapitaal
      omgezet in een pensioenrecht of pensioenaanspraak in de vorm van een periodieke uitkering indien dat ook met
      betrekking tot de basispensioenregeling geschiedt of de basispensioenregeling een uitkeringsovereenkomst betreft
      en zijn daarop overeenkomstige voorwaarden van toepassing als welke gelden bij de basispensioenregeling bij
      beëindiging van de deelneming door deze omstandigheden.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel119
  - number: '119.3'
    text: |-
      Indien de vrijwillige pensioenregeling voldoet aan de voorwaarde, bedoeld in het tweede lid, onderdeel a, deelt het
      pensioenfonds dit schriftelijk mee aan de deelnemers en de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel119
  - number: '119.4'
    text: Het eerste lid is niet van toepassing op een verplichtgesteld bedrijfstakpensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel119
  - number: '120.1'
    text: |-
      Voor een basispensioenregeling in de vorm van een premieovereenkomst welke wordt uitgevoerd door een pensioenfonds
      geldt dat de werkgeverspremie ten minste 10 procent van de premie van de basispensioenregeling bedraagt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel120
  - number: '120.2'
    text: |-
      Een vrijwillige pensioenregeling in de vorm van een premieovereenkomst welke wordt uitgevoerd door een
      pensioenfonds voldoet aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel120
  - number: 120.2.a
    text: de werkgever draagt ten minste 10 procent van de premie van de vrijwillige pensioenregeling bij;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel120
  - number: 120.2.b
    text: |-
      indien de deelnemer overlijdt dan wel gepensioneerde of gewezen deelnemer wordt, wordt het kapitaal dat is
      ontstaan uit de som van de beschikbaar gestelde premies en de daarop behaalde rendementen omgezet in een
      pensioenrecht of pensioenaanspraak in de vorm van een periodieke uitkering, indien dat ook met betrekking tot
      de basispensioenregeling geschiedt of de basispensioenregeling een uitkeringsovereenkomst betreft en zijn daarop
      overeenkomstige voorwaarden van toepassing als welke gelden bij de basispensioenregeling bij beëindiging van de
      deelneming door deze omstandigheden; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel120
  - number: 120.2.c
    text: |-
      indien de deelnemer overlijdt dan wel gepensioneerde of gewezen deelnemer wordt, wordt het kapitaal dat is
      ontstaan uit de som van de beschikbaar gestelde premies en de daarop behaalde rendementen omgezet in een verzekerd
      kapitaal, indien dat ook met betrekking tot de basispensioenregeling geschiedt of de basispensioenregeling een
      kapitaalovereenkomst betreft en zijn daarop overeenkomstige voorwaarden van toepassing als welke gelden bij de
      basispensioenregeling bij beëindiging van de deelneming door deze omstandigheden.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel120
  - number: '120.3'
    text: |-
      Indien de vrijwillige pensioenregeling voldoet aan de voorwaarde, bedoeld in het tweede lid, onderdeel a, deelt het
      pensioenfonds dit schriftelijk mee aan de deelnemers en de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel120
  - number: '120.4'
    text: Het eerste lid is niet van toepassing op een verplichtgesteld bedrijfstakpensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel120
  - number: '121'
    text: |-
      Een bedrijfstakpensioenfonds kan een uitvoeringsovereenkomst sluiten met een werkgever die niet onder
      de werkingssfeer van het bedrijfstakpensioenfonds valt, maar die zich op vrijwillige basis bij het
      bedrijfstakpensioenfonds wil aansluiten, indien:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel121
  - number: 121.a
    text: |-
      de loonontwikkeling bij deze werkgever ten minste gelijk is aan die in een bedrijfstak waarin het
      bedrijfstakpensioenfonds werkzaam is en de werkgever deelneemt in de sociale fondsen van dezelfde bedrijfstak;
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel121
  - number: 121.b
    text: |-
      er sprake is van een groepsverhouding tussen de werkgever die zich vrijwillig wil aansluiten en een andere
      werkgever die onder de werkingssfeer van het bedrijfstakpensioenfonds valt; of
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel121
  - number: 121.c
    text: |-
      dit aansluitend gebeurt aan een periode waarin de werkgever wel onder de werkingssfeer van het
      bedrijfstakpensioenfonds viel.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel121
  - number: '122'
    text: |-
      Indien een onderneming niet langer deel uitmaakt van een groep waaraan een ondernemingspensioenfonds verbonden
      is, of een groep die valt onder de werkingssfeer van een bedrijfstakpensioenfonds, kan dit pensioenfonds blijven
      optreden als pensioenuitvoerder voor deze onderneming, tenzij de onderneming onder de werkingssfeer van een
      verplichtgesteld bedrijfstakpensioenfonds valt.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel122
  - number: '123.1'
    text: Indien een pensioenfonds meerdere pensioenregelingen uitvoert vormen deze pensioenregelingen financieel één geheel.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel123
  - number: '123.2'
    text: |-
      In afwijking van het eerste lid houdt een ondernemingspensioenfonds dat pensioenregelingen uitvoert voor meerdere
      ondernemingen of groepen gescheiden vermogens aan per onderneming of groep.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel123
  - number: '123.3'
    text: |-
      In afwijking van het eerste en, indien van toepassing, het tweede lid kan een ondernemingspensioenfonds, indien de
      bij een onderneming of groep horende pensioenregelingen waren ondergebracht bij verschillende pensioenfondsen die
      zijn samengevoegd met het ondernemingspensioenfonds, een gescheiden vermogen aanhouden voor de pensioenregelingen
      die voor de samenvoeging bij een afzonderlijk pensioenfonds waren ondergebracht.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel123
  - number: '124'
    text: |-
      Een pensioenfonds kan de mogelijkheid bieden tot verhoging van de pensioenaanspraken indien het deel van
      de pensioenaanspraken dat voortvloeit uit deze inkoop overeenkomstig de pensioenaanspraken op grond van de
      basispensioenregeling wordt behandeld.
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel124
  - number: '125.1'
    text: |-
      Het is een pensioenfonds verboden bijdragen te ontvangen van een bijdragende onderneming die zetel heeft in een
      andere lidstaat dan Nederland:
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel125
  - number: 125.1.a
    text: zonder een daartoe door de toezichthouder verleende vergunning; en
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel125
  - number: 125.1.b
    text: |-
      zonder de toezichthouder van het voornemen daartoe in kennis te hebben gesteld, op de wijze, bedoeld in
      [artikel 194][ref1], en met inachtneming van [artikel 196][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel194
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel196
    url: https://wetten.overheid.nl/BWBR0020809/2010-06-11#Artikel125
    references:
      - id: ref1
