  - number: '5.1'
    text: |-
      De [artikelen 929][ref1], [935, eerste lid][ref2], [936, tweede tot en met zesde lid][ref3],
      [941, vijfde lid][ref4], [969][ref5], [972][ref6], [977, tweede lid][ref7], [978][ref8], [979][ref9],
      [980, tweede lid][ref10] en [983 van Boek 7 van het Burgerlijk Wetboek][ref11] zijn niet van toepassing op
      verzekeringsovereenkomsten die worden gesloten in verband met een pensioenovereenkomst als bedoeld in deze wet of
      verzekeringsovereenkomsten die worden gesloten in verband met een rechtsbetrekking die op grond van deze wet is
      gelijkgesteld met een pensioenovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel929
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel935
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel936
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel941
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel969
      [ref6]: https://wetten.overheid.nl/BWBR0005290#Artikel972
      [ref7]: https://wetten.overheid.nl/BWBR0005290#Artikel977
      [ref8]: https://wetten.overheid.nl/BWBR0005290#Artikel978
      [ref9]: https://wetten.overheid.nl/BWBR0005290#Artikel979
      [ref10]: https://wetten.overheid.nl/BWBR0005290#Artikel980
      [ref11]: https://wetten.overheid.nl/BWBR0005290#Artikel983
