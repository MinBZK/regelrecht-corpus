  - number: '2.12'
    text: |-
      Onder pensioenovereenkomst wordt mede verstaan hetgeen tussen een werkgever en een gewezen werknemer, andere
      aanspraakgerechtigde of pensioengerechtigde is overeengekomen betreffende pensioen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2
  - number: 2a.1
    text: |-
      Er is sprake van een gezamenlijke huishouding indien de betrokkenen een notarieel verleden samenlevingscontract
      hebben gesloten of sprake is van een samenlevingsverklaring en wordt voldaan aan de voorwaarden, bedoeld in het
      tweede of derde lid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2a
  - number: 2a.2
    text: |-
      Bij een bepaald partnerpensioen is sprake van een gezamenlijke huishouding indien en zolang er een notarieel
      verleden samenlevingscontract is en dit samenlevingscontract gemeld is aan de pensioenuitvoerder of er een door
      beide betrokkenen ondertekende samenlevingsverklaring is, waarin zij verklaren woonachtig te zijn op hetzelfde
      adres en voor elkaar te zorgen en deze samenlevingsverklaring is gestuurd naar de pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2a
  - number: 2a.3
    text: 'Bij een onbepaald partnerpensioen is sprake van een gezamenlijke huishouding indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2a
  - number: 2a.3.a
    text: er een notarieel verleden samenlevingscontract is;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2a
  - number: 2a.3.b
    text: |-
      voor het overlijden van de werknemer of gewezen werknemer er een door beide betrokkenen ondertekende
      samenlevingsverklaring is waarin zij verklaren woonachtig te zijn op hetzelfde adres en voor elkaar te zorgen; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2a
  - number: 2a.3.c
    text: |-
      na het overlijden van de werknemer of gewezen werknemer er een door een betrokkene ondertekende
      samenlevingsverklaring is waarin hij verklaart partner van de overledene te zijn geweest en hij aannemelijk maakt
      ten tijde van het overlijden of, indien relevant, op enig moment voor het overlijden een gezamenlijke huishouding
      met de overledene te hebben gevoerd.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2a
  - number: 2a.4
    text: |-
      De betrokkene, bedoeld in het derde lid, onderdeel c, maakt in ieder geval aannemelijk met de overleden werknemer
      of gewezen werknemer een gezamenlijke huishouding te hebben gevoerd indien sprake is geweest van inschrijving op
      hetzelfde adres gedurende zes maanden en een van de volgende omstandigheden:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2a
  - number: 2a.4.a
    text: uit hun relatie is een kind geboren of heeft erkenning plaatsgevonden van een kind van de een door de ander;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2a
  - number: 2a.4.b
    text: het gezamenlijk eigendom van een huis;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2a
  - number: 2a.4.c
    text: een huurcontract op beider naam; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2a
  - number: 2a.4.d
    text: |-
      in de pensioenregeling van de betrokkene is de overleden werknemer of gewezen werknemer aangemerkt als partner van
      de betrokkene.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2a
  - number: 2a.5
    text: |-
      Indien van toepassing wordt de duur van de gezamenlijke huishouding bij een onbepaald partnerpensioen beoordeeld op
      grond van de omstandigheden, bedoeld in het derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2a
  - number: 2a.6
    text: |-
      Personen die partners waren omdat zij een gezamenlijke huishouding voerden blijven als partner aangemerkt wanneer
      zij niet langer ingeschreven zijn op hetzelfde adres als gevolg van opname in een zorginstelling, zolang geen van
      beiden door middel van een schriftelijke kennisgeving aan de pensioenuitvoerder heeft laten weten niet langer als
      partners te willen worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2a
  - number: 2a.7
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2a
  - number: '3.1'
    text: |-
      Deze wet is met uitzondering van de [artikelen 7][ref1] en [9][ref2] van overeenkomstige toepassing op de persoon
      die geen werkgever of werknemer is, die in een arbeidsverhouding werkt waarbij tegen beloning persoonlijke arbeid
      wordt verricht en die onder de werkingssfeer valt van een door een verplichtgesteld bedrijfstakpensioenfonds
      uitgevoerde pensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel9
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '3.2'
    text: |-
      Deze wet is met uitzondering van de [artikelen 7][ref1] en [9][ref2] van overeenkomstige toepassing op de persoon
      die als zelfstandige onder de werkingssfeer valt van een door een verplichtgesteld bedrijfstakpensioenfonds
      uitgevoerde pensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel9
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel3
    references:
