  - number: '85.3'
    text: |-
      De overdragende pensioenuitvoerder brengt in het kader van de waardeoverdracht geen kosten in rekening bij de
      gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel85
  - number: '86.1'
    text: |-
      De pensioenuitvoerder is verplicht om na een verzoek van de gewezen deelnemer tot waardeoverdracht de
      overdrachtswaarde van diens pensioenaanspraken over te dragen aan een andere lidstaat van de Europese Unie of aan
      een op grond van [artikel 70, tweede lid][ref1], door Onze Minister aangewezen instelling, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel70
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '70'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 86.1.a
    text: er sprake is van beëindiging van de dienstbetrekking dan wel beëindiging van de deelneming;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel86
  - number: 86.1.b
    text: |-
      die waardeoverdracht ertoe strekt het de gewezen deelnemer mogelijk te maken pensioenaanspraken te verwerven bij
      een andere lidstaat van de Europese Unie of de aangewezen genoemde instelling;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel86
  - number: 86.1.c
    text: |-
