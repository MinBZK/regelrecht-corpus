        paragraaf: '4.3'
  - number: '87.1'
    text: |-
      De pensioenuitvoerder die een verzoek tot waardeoverdracht ontvangt van een gewezen deelnemer waarbij beoogd wordt
      de waarde over te dragen aan een buitenlandse instelling, meldt dit aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel87
  - number: '87.2'
    text: |-
      Waardeoverdracht aan een buitenlandse instelling is alleen mogelijk wanneer ten genoegen van de toezichthouder
      wordt aangetoond dat:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel87
  - number: 87.2.a
    text: |-
      voldaan wordt aan de in [artikel 71, eerste lid][ref1], genoemde voorwaarden;


