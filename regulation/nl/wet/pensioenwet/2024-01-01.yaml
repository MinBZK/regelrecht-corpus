      Indien een verzekeraar en een pensioengerechtigde ter zake van een pensioen waarvan de ingangsdatum is gelegen
      tussen 1 januari 2014 en 8 juli 2015 en dat is gebaseerd op een premieovereenkomst of een kapitaalovereenkomst,
      zijn overeengekomen dat de pensioenuitkering wordt omgezet in een kapitaal dat wordt aangewend voor een variabele
      uitkering, is, in afwijking van [artikel 70, derde lid][ref1], de verzekeraar die geen variabele uitkeringen
      uitvoert, verplicht om op verzoek van de pensioengerechtigde het kapitaal over te dragen aan een andere
      pensioenuitvoerder ten behoeve van de aankoop van een variabele uitkering.


