      instelling; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel86
  - number: 86.1.d
    text: |-
      de tot verevening gerechtigde echtgenoot, bedoeld in
      [artikel 2 van de Wet verevening pensioenrechten bij scheiding][ref1], met de waardeoverdracht instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel2
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel86
    references:
