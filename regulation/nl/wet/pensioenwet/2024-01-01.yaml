  - number: 220e.1
    text: |-
      In afwijking van [artikel 17][ref1] mag de door of voor een deelnemer verschuldigde premie tot het moment van
      beëindiging van de deelneming een met de leeftijd oplopend percentage van het loon dat voor de pensioenberekening
      in aanmerking wordt genomen bedragen, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel17
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220e
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 220e.1.a
    text: |-
      op de dag voorafgaand aan het tijdstip van inwerkingtreding van de [Wet toekomst pensioenen][ref1] sprake was van
      een premieovereenkomst met een met de leeftijd oplopend premiepercentage of een uitkeringsovereenkomst als bedoeld
      in [artikel 1][ref2], zoals dat artikel luidde op de dag voorafgaand aan het tijdstip van inwerkingtreding van de
      Wet toekomst pensioenen, met een met de leeftijd oplopend premiepercentage ondergebracht bij een verzekeraar;


      [ref1]: https://wetten.overheid.nl/BWBR0048328
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220e
    references:
      - id: ref1
        bwb_id: BWBR0048328
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 220e.1.b
    text: |-
      de deelneming van de deelnemer reeds was aangevangen waarbij de deelnemer pensioenaanspraken opbouwt, op de dag
      voordat voor nieuwe deelnemers een pensioenovereenkomst geldt waarbij de premie conform [artikel 17][ref1] voor
      alle deelnemers een gelijk percentage van het loon dat voor de pensioenberekening in aanmerking wordt genomen
      bedraagt, doch uiterlijk op 31 december 2026; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel17
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220e
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 220e.1.c
    text: de pensioenovereenkomst niet het karakter heeft van een solidaire premieovereenkomst.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220e
  - number: 220e.2
    text: |-
      In aanvulling op de [artikelen 38, eerste lid][ref1], en [39, eerste lid][ref2], verstrekt de pensioenuitvoerder
      de deelnemer jaarlijks en bij beëindiging van de deelneming informatie over het hanteren van een met de leeftijd
      oplopend premiepercentage en de mogelijke effecten bij beëindiging van de deelneming en het aangaan van een
      nieuwe pensioenovereenkomst. De pensioenuitvoerder stelt deze informatie tevens op zijn website beschikbaar voor
      de deelnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel39
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220e
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '39'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 220e.3
    text: |-
      Indien op of na 1 januari 2027 de pensioenovereenkomst zodanig wordt gewijzigd dat de door of voor een deelnemer
      verschuldigde premie niet langer een met de leeftijd oplopend premiepercentage bedraagt maar een voor alle
      deelnemers gelijk premiepercentage maakt de werkgever de effecten van de wijziging van de pensioenovereenkomst
      en de wijze waarop wordt omgegaan met opgebouwde pensioenaanspraken en pensioenrechten voor deelnemers, gewezen
      deelnemers, gewezen partners en pensioengerechtigden per leeftijdscohort inzichtelijk.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220e
  - number: 220e.4
    text: |-
      Indien de pensioenovereenkomst na de wijziging, bedoeld in het derde lid, het karakter heeft van een solidaire
      premieovereenkomst of een flexibele premieovereenkomst met risicodelingsreserve worden de effecten van de wijziging
      van de pensioenovereenkomst en de wijze waarop wordt omgegaan met opgebouwde pensioenaanspraken en pensioenrechten,
      in ieder geval berekend door:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220e
  - number: 220e.4.a
    text: |-
      het netto profijt van het ongewijzigd voortzetten van de pensioenovereenkomst af te zetten tegen het netto profijt
      van het wijzigen van de pensioenovereenkomst en de wijze waarop wordt omgegaan met opgebouwde pensioenaanspraken
      en pensioenrechten, waarbij het netto profijt het verschil is tussen de marktwaarde van de te verwachten
      pensioenuitkeringen en de marktwaarde van de toekomstige premie-inleg; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220e
  - number: 220e.4.b
    text: |-
      de pensioenverwachting bij ongewijzigd voortzetten van de pensioenovereenkomst te vergelijken met de
      pensioenverwachting bij wijziging van de pensioenovereenkomst en de wijze waarop wordt omgegaan met opgebouwde
      pensioenaanspraken en pensioenrechten, waarbij de pensioenverwachting, voor zover het ouderdomspensioen betreft,
      wordt weergegeven op basis van een pessimistisch scenario, een verwacht scenario en een optimistisch scenario.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220e
  - number: 220e.5
    text: |-
      Indien de pensioenovereenkomst na de wijziging, bedoeld in het derde lid, het karakter heeft van een flexibele
      premieovereenkomst zonder risicodelingsreserve of een premie-uitkeringsovereenkomst, dan worden de effecten van
      de wijziging van de pensioenovereenkomst en de wijze waarop wordt omgegaan met opgebouwde pensioenaanspraken en
      pensioenrechten, in ieder geval berekend door:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220e
  - number: 220e.5.a
    text: |-
      het bruto profijt van het ongewijzigd voortzetten van de pensioenovereenkomst af te zetten tegen het bruto profijt
      van het wijzigen van de pensioenovereenkomst en de wijze waarop wordt omgegaan met opgebouwde pensioenaanspraken en
      pensioenrechten, waarbij het bruto profijt de contante waarde van de toekomstige premie-inleg is; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220e
  - number: 220e.5.b
    text: |-
      de pensioenverwachting bij ongewijzigd voortzetten van de pensioenovereenkomst te vergelijken met de
      pensioenverwachting bij wijziging van de pensioenovereenkomst en de wijze waarop wordt omgegaan met opgebouwde
      pensioenaanspraken en pensioenrechten, waarbij de pensioenverwachting, voor zover het ouderdomspensioen betreft,
      wordt weergegeven op basis van een pessimistisch scenario, een verwacht scenario en een optimistisch scenario.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220e
  - number: 220e.6
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220e
