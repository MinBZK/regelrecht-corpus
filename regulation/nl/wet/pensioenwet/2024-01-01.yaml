  - number: 220i.2
    text: |-
      De pensioenuitvoerder vermeldt het tijdstip van overgang op uitvoering van een gewijzigde pensioenovereenkomst op
      zijn website en meldt het aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220i
  - number: 220i.3
    text: |-
      Bij uitvoering van een pensioenregeling waarop de Nederlandse sociale en arbeidswetgeving van toepassing is door
      een pensioeninstelling uit een andere lidstaat, is het eerste lid van overeenkomstige toepassing voor zover het de
      Nederlandse sociale en arbeidswetgeving betreft en is het tweede lid van overeenkomstige toepassing voor zover het
      betreft de vermelding van het tijdstip van overgang op de website.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220i
  - number: '221'
    text: |-
      Onze Minister zendt binnen drie jaar na inwerkingtreding van de [Wet verbeterde premieregeling][ref1] aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van die wet in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0038177
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel221
    references:
      - id: ref1
        bwb_id: BWBR0038177
  - number: '222'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel222
  - number: '223'
    text: 'Deze wet wordt aangehaald als: Pensioenwet.'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel223
