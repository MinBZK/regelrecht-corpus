    text: de regels en procedures die gelden ten aanzien van de solidariteitsreserve of de risicodelingsreserve;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel35
  - number: 35.2.e
    text: de risicohouding;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel35
  - number: 35.2.f
    text: de toedelingsregels; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel35
  - number: 35.2.g
    text: het projectierendement.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel35
  - number: '36.1'
    text: |-
      De pensioenuitvoerder registreert de deelnemingsjaren van de deelnemers en verstrekt hierover informatie aan de
      deelnemers en gewezen deelnemers.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel36
  - number: '36.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste lid, waaronder de
      perioden die in aanmerking komen als deelnemingsjaren.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel36
  - number: '37.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen meldt de arbeidsongeschiktheid van een deelnemer aan de
      pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel37
  - number: '37.2'
    text: Bij regeling van Onze Minister worden regels gesteld ten aanzien van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel37
  - number: '38.1'
    text: 'De pensioenuitvoerder verstrekt de deelnemer jaarlijks:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel38
  - number: 38.1.a
    text: een opgave van de verworven pensioenaanspraken;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel38
  - number: 38.1.b
    text: |-
      een opgave van de aan het voorafgaande kalenderjaar toe te rekenen waardeaangroei van pensioenaanspraken
      overeenkomstig [artikel 3.127 van de Wet inkomstenbelasting 2001][ref1] en de daarop berustende bepalingen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 38.1.c
    text: voor zover van toepassing, informatie over toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel38
  - number: 38.1.d
    text: |-
      voor zover van toepassing, informatie over vermindering van pensioenaanspraken en pensioenrechten op grond van
      [artikel 134][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel38
    references:
