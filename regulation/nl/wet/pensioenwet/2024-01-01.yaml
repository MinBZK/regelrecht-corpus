    text: |-
      Een pensioenfonds dat in het eerste jaar na het tijdstip van inwerkingtreding van
      [artikel I, onderdeel P, van de Wet aanpassing financieel toetsingskader][ref1] niet voldoet aan de bij of
      krachtens [artikel 132][ref2] gestelde eisen, dient een herstelplan in op grond van [artikel 138][ref3], waarbij
      het pensioenfonds, in afwijking van artikel 138, tweede lid, uitwerkt hoe het binnen 12 jaar zal voldoen aan
      artikel 132. Een pensioenfonds dat in het tweede jaar na het tijdstip van inwerkingtreding van artikel I, onderdeel
      P, van de Wet aanpassing financieel toetsingskader niet voldoet aan de bij of krachtens artikel 132 gestelde eisen
      dient een herstelplan in op grond van artikel 138 of [artikel 139][ref4], waarbij het pensioenfonds, in afwijking
      van artikel 138, tweede lid, of artikel 139, tweede lid, uitwerkt hoe het binnen 11 jaar zal voldoen aan artikel
      132. Indien een pensioenfonds een herstelplan heeft vastgesteld met een termijn van 12 of 11 jaar is artikel 139,
      tweede lid, voor zover het betreft het hanteren van een gelijke termijn voor herstelplannen, van toepassing vanaf
      het vierde jaar na het tijdstip van inwerkingtreding van artikel I, onderdeel P, van de Wet aanpassing financieel
      toetsingskader.


