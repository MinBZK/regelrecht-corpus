        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 87.2.b
    text: |-
      de in [artikel 72][ref1] bedoelde omstandigheden op de overdragende pensioenuitvoerder niet van toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4.3'
