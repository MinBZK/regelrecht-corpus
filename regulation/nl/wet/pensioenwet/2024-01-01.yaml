  - number: '5.2'
    text: |-
      Het verminderen of vervallen van een uitkering op grond van een verzekeringsovereenkomst als bedoeld in het eerste
      lid op basis van [artikel 930, derde tot en met vijfde lid, van Boek 7 van het Burgerlijk Wetboek][ref1] is niet
      mogelijk, tenzij door een persoon met wie een pensioenovereenkomst is gesloten of door een persoon voor wie een
      op grond van deze wet met de pensioenovereenkomst gelijkgestelde rechtsbetrekking geldt, niet is voldaan aan de
      in [artikel 928 van Boek 7 van het Burgerlijk Wetboek][ref2] omschreven mededelingsplicht betreffende zijn risico.
      In dat geval beperkt de vermindering of het verval van de uitkering zich tot het risico met betrekking tot de in
      de eerste zin bedoelde persoon. Voorzover de eerste zin in de weg staat aan vermindering dan wel verval van een
      uitkering, heeft het pensioenfonds of de verzekeraar een recht van verhaal op de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel930
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel928
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '930'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '928'
  - number: '5.3'
    text: |-
      Een beding als bedoeld in [artikel 941, vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref1] is nietig wanneer
      dit is opgenomen in een verzekeringsovereenkomst als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel941
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '941'
  - number: '5.4'
    text: |-
      Voor zover bepalingen van de [titels 17][ref1] en [18 van Boek 7 van het Burgerlijk Wetboek][ref2] in strijd
      zijn met het bij of krachtens deze wet bepaalde blijven die bepalingen van het [Burgerlijk Wetboek][ref3] buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
      [ref2]: https://wetten.overheid.nl/BWBR0005290
      [ref3]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005290
      - id: ref2
        bwb_id: BWBR0005290
      - id: ref3
        bwb_id: BWBR0005290
  - number: '6'
    text: |-
      De [Wet op het financieel toezicht][ref1] is niet van toepassing op de verhouding tussen een verzekeraar of een
      premiepensioeninstelling en een aanspraak- of pensioengerechtigde, tenzij in deze wet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '7.1'
    text: |-
      De werkgever informeert de werknemer binnen een maand na aanvang van de werkzaamheden schriftelijk of elektronisch
      of hij de werknemer al dan niet een aanbod tot het sluiten van een pensioenovereenkomst doet, en zo ja, binnen
      welke termijn het aanbod wordt gedaan en wie de pensioenuitvoerder is.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel7
  - number: '7.2'
    text: |-
      Indien de werkgever de werknemer op basis van het eerste lid heeft medegedeeld dat hem geen aanbod tot het sluiten
      van een pensioenovereenkomst zal worden gedaan, maar de werkgever op een later tijdstip alsnog een aanbod tot het
      sluiten van een pensioenovereenkomst doet, informeert hij de werknemer hierover schriftelijk of elektronisch.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel7
  - number: '7.3'
    text: |-
      Indien een pensioenovereenkomst is gesloten, maar de werknemer nog geen pensioen verwerft, informeert de werkgever
      de werknemer daarover en geeft de werkgever daarbij aan:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel7
  - number: 7.3.a
    text: aan welke voorwaarden voldaan moet worden om de verwerving van pensioenaanspraken te laten beginnen; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel7
  - number: 7.3.b
    text: welke diensttijd in het kader van de pensioenovereenkomst relevant is.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel7
  - number: '7.4'
    text: |-
      Indien de werkgever niet heeft voldaan aan het eerste of tweede lid, wordt een werkgever geacht aan een
      werknemer een onherroepelijk aanbod tot het sluiten van een pensioenovereenkomst gedaan te hebben, indien die
      werknemer behoort tot dezelfde groep van werknemers, aan wie de werkgever al een aanbod tot het sluiten van een
      pensioenovereenkomst heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel7
  - number: '7.5'
    text: |-
      Voor het elektronisch verstrekken van de informatie, bedoeld in het eerste en tweede lid, is uitdrukkelijke
      instemming van de werknemer vereist.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel7
  - number: '8.1'
    text: |-
      Ingeval een werkgever aan een of meer werknemers een aanbod doet tot het sluiten van een pensioenovereenkomst, mag
      deze werkgever het doen van een aanbod aan een andere werknemer niet achterwege laten vanwege het enkele feit dat
      die andere werknemer minder dan de volledige arbeidstijd werkt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel8
  - number: '8.2'
    text: |-
      Indien als voorwaarde voor het verwerven van pensioenaanspraken op basis van een pensioenovereenkomst het
      overstijgen van een minimumloongrens wordt gesteld, wordt voor de toepassing van die loongrens het loon van een
      werknemer die minder dan de volledige arbeidstijd werkzaam is, herleid naar het loon dat ingeval van een volledige
      arbeidstijd zou zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel8
  - number: '8.3'
    text: |-
      Bij de vaststelling van aanspraken op ouderdoms- en nabestaandenpensioen worden aan werknemers die minder dan de
      volledige arbeidstijd werkzaam zijn, pensioenaanspraken verleend naar evenredigheid van de pensioenaanspraken die
      ingeval van een volledige arbeidstijd zouden zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel8
  - number: '8.4'
    text: |-
      Bij de vaststelling van aanspraken op arbeidsongeschiktheidspensioen die aan de pensioenovereenkomst kunnen worden
      ontleend, is onderscheid op grond van het enkele feit van de omvang van de arbeidstijd niet toegestaan, met dien
      verstande dat bij de vaststelling van het arbeidsongeschiktheidspensioen rekening gehouden mag worden met een
      uitkering uit hoofde van de [Wet werk en inkomen naar arbeidsvermogen][ref1] voorzover die uitkering verband houdt
      met dezelfde dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: '8.5'
    text: |-
      In geval een werkgever aan een of meer werknemers een aanbod doet tot het sluiten van een pensioenovereenkomst, mag
      deze werkgever het doen van een aanbod aan een andere werknemer niet achterwege laten vanwege het enkele feit dat
      die werknemer een bepaalde leeftijd nog niet heeft bereikt, tenzij:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel8
  - number: 8.5.a
    text: de werknemer jonger is dan 18 jaar; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel8
  - number: 8.5.b
    text: |-
      het een ouderdomspensioen betreft dat uitsluitend voorziet in een uitkering tot het bereiken van de
      pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], of tot het
      bereiken van de pensioenleeftijd voor het levenslange ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '9'
    text: |-
      Door de overgang van een onderneming, bedoeld in [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref1], waarbij
      de vervreemder met de aan die onderneming verbonden werknemers geen pensioenovereenkomst heeft gesloten, wordt,
      indien de verkrijger met zijn werknemers vóór het tijdstip van de overgang een pensioenovereenkomst heeft gesloten,
      de verkrijger geacht op het moment van de overgang het aanbod tot het sluiten van een zelfde pensioenovereenkomst
      te hebben gedaan aan de werknemers van de vervreemder.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
  - number: '10.1'
    text: De pensioenovereenkomst houdt een premieovereenkomst in.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10
  - number: '10.2'
    text: 'Een premieovereenkomst voor pensioen op opbouwbasis houdt in:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10
  - number: 10.2.a
    text: een solidaire premieovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10
  - number: 10.2.b
    text: een flexibele premieovereenkomst; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10
  - number: 10.2.c
    text: een premie-uitkeringsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10
  - number: '10.3'
    text: |-
      Indien een pensioenovereenkomst voorziet in een nabestaandenpensioen op risicobasis of een
      arbeidsongeschiktheidspensioen op risicobasis, wordt in de pensioenovereenkomst opgenomen of aan de nabestaanden of
      de arbeidsongeschikte een vastgestelde of een variabele uitkering wordt verstrekt. Indien een variabele uitkering
      wordt verstrekt wordt in de pensioenovereenkomst opgenomen bij welk karakter als bedoeld in het tweede lid voor
      het nabestaandenpensioen of het arbeidsongeschiktheidspensioen wordt aangesloten. De regels die bij of krachtens
      deze wet gelden voor een variabele pensioenuitkering bij een pensioenovereenkomst met dat karakter zijn van
      overeenkomstige toepassing bij de uitvoering van het nabestaandenpensioen of arbeidsongeschiktheidspensioen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10
  - number: 10a.1
    text: |-
      Bij een solidaire premieovereenkomst berekent de pensioenuitvoerder de kans dat met de premie de beoogde
      pensioendoelstelling wordt behaald. Deze berekening wordt door pensioenfondsen bij de opdrachtaanvaarding,
      door verzekeraars en premiepensioeninstellingen bij het sluiten van de uitvoeringsovereenkomst en door alle
      pensioenuitvoerders periodiek, uiterlijk iedere vijf jaar, gedaan aan de hand van een uniforme scenario-analyse. De
      pensioenuitvoerder informeert de werkgever of de partijen die de pensioenregeling zijn overeengekomen hierover.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10a
  - number: 10a.2
    text: |-
      Het voor de pensioenuitkering bestemd vermogen wordt gedurende de uitkeringsfase gebruikt voor financiering van een
      variabele uitkering.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10a
  - number: 10a.3
    text: De solidariteitsreserve is onderdeel van de solidaire premieovereenkomst.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10a
  - number: 10a.4
    text: |-
      De financiële mee- of tegenvallers als gevolg van het collectieve beleggingsbeleid worden in de voor
      pensioenuitkering bestemde vermogens en de solidariteitsreserve verwerkt door middel van vastgelegde
      toedelingsregels die in ieder geval aansluiten bij de risicohouding per leeftijdscohort, waarbij in de
      toedelingsregels bepaald kan worden dat het beschermingsrendement voor het renterisico wordt toebedeeld ofwel op
      basis van wijziging van de rentetermijnstructuur die de toezichthouder beschikbaar stelt ofwel rechtstreeks uit het
      rendement van de daarvoor bestemde beleggingen. De financiële mee- of tegenvallers als gevolg van de ontwikkeling
      van de levensverwachting en het sterfteresultaat worden verwerkt door middel van aparte toedelingsregels of de
      solidariteitsreserve.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10a
  - number: 10a.5
    text: |-
      De toedelingsregels voor de beschermingsrendementen en overrendementen voor het beleggingsrisico zijn zodanig
      dat er op voorhand geen herverdelingseffecten plaatsvinden. Van de eerste zin kan afgeweken worden voor zover
      dat nodig is om gelijke aanpassingen van de ingegane pensioenuitkeringen en van de opgebouwde aanspraak op
      nabestaandenpensioen van pensioengerechtigden te realiseren en alleen herverdelingseffecten optreden tussen de
      pensioengerechtigden onderling.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10a
  - number: 10a.6
    text: Het voor de pensioenuitkering bestemd vermogen is niet negatief.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10a
  - number: 10a.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de scenario-analyse en de toedelingsregels.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10a
  - number: 10b.1
    text: |-
      Bij een flexibele premieovereenkomst wordt de premie belegd tot de pensioendatum. Het kapitaal voortvloeiend uit de
      premies wordt vanaf de pensioendatum gebruikt voor financiering van een vastgestelde of variabele uitkering.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10b
  - number: 10b.2
    text: Een risicodelingsreserve kan onderdeel zijn van een flexibele premieovereenkomst.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10b
  - number: 10b.3
    text: |-
      Bij de variabele uitkering worden financiële mee- of tegenvallers die het gevolg zijn van het beleggingsrisico
      verwerkt door middel van individuele toedeling of een collectief toedelingsmechanisme. De verwerking van financiële
      mee- of tegenvallers die het gevolg zijn van de ontwikkeling van de levensverwachting gebeurt door middel
      van individuele toedeling, een collectief toedelingsmechanisme of een risicodelingsreserve. De verwerking van
      financiële mee- of tegenvallers die het gevolg zijn van het sterfteresultaat gebeurt door middel van een collectief
      toedelingsmechanisme of een risicodelingsreserve.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10b
  - number: 10b.4
    text: |-
      De vormgeving van het collectief toedelingsmechanisme voor het beleggingsrisico is zodanig dat er op voorhand
      geen herverdelingseffecten plaatsvinden. Van de eerste zin kan afgeweken worden voor zover dat nodig is om
      gelijke aanpassingen van de ingegane pensioenuitkeringen en van de opgebouwde aanspraak op nabestaandenpensioen
      van pensioengerechtigden te realiseren en alleen herverdelingseffecten optreden tussen de pensioengerechtigden
      onderling.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10b
  - number: 10b.5
    text: Het kapitaal is niet negatief.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10b
  - number: 10b.6
    text: |-
      De pensioenuitvoerder past een collectief toedelingsmechanisme toe op een toedelingskring die bestaat uit
      pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10b
  - number: 10b.7
    text: 'In afwijking van het zesde lid kunnen:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10b
  - number: 10b.7.a
    text: |-
      deelnemers of gewezen deelnemers deel uitmaken van de toedelingskring in de laatste tien jaar voorafgaand aan de
      reglementaire pensioenleeftijd, waarbij de deelname van deelnemers of gewezen deelnemers aan de toedelingskring
      plaatsvindt door tijdsevenredige toetreding tot het collectief toedelingsmechanisme in deze periode; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10b
  - number: 10b.7.b
    text: |-
      alle deelnemers, gewezen deelnemers of andere aanspraakgerechtigden deel uitmaken van de toedelingskring voor het
      collectief toedelingsmechanisme voor verwerking van het sterfteresultaat.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10b
  - number: 10b.8
    text: |-
      Bij uitvoering van een flexibele premieovereenkomst door een verplichtgesteld bedrijfstakpensioenfonds geldt, voor
      zover het basispensioenregelingen betreft die onder de verplichtstelling vallen, in afwijking van het tweede lid en
      het zevende lid, het volgende:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10b
  - number: 10b.8.a
    text: een risicodelingsreserve is onderdeel van de flexibele premieovereenkomst; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10b
  - number: 10b.8.b
    text: |-
      de verwerking van het sterfteresultaat vindt plaats over alle deelnemers, gewezen deelnemers, andere
      aanspraakgerechtigden en pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10b
  - number: 10b.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de tarieven voor een vastgestelde uitkering.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10b
  - number: 10c.1
    text: |-
      Bij een premie-uitkeringsovereenkomst wordt de premie belegd tot de pensioendatum. Het kapitaal voortvloeiend uit
      de premies wordt vanaf de pensioendatum gebruikt voor financiering van een vastgestelde of variabele uitkering.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10c
  - number: 10c.2
    text: |-
      In afwijking van het eerste lid is de verzekeraar verplicht om op verzoek van de deelnemer
      of gewezen deelnemer in de laatste 15 jaar voor de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], het tot op dat moment opgebouwde kapitaal of
      de vanaf dat moment beschikbaar gestelde premie geheel of gedeeltelijk aan te wenden voor een aanspraak op een
      vastgestelde uitkering vanaf de pensioendatum.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 10c.3
    text: |-
      In afwijking van het eerste lid is de premiepensioeninstelling verplicht om op verzoek van de deelnemer
      of gewezen deelnemer in de laatste vijftien jaar voor de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], het tot op dat moment opgebouwde kapitaal geheel
      of gedeeltelijk over te dragen aan een door de deelnemer of gewezen deelnemer aangewezen verzekeraar voor een
      aanspraak op een vastgestelde uitkering vanaf de pensioendatum.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 10c.4
    text: |-
      De verzekeraar of de premiepensioeninstelling informeert degene die het kapitaal of de premie wenst aan te wenden
      als bedoeld in het tweede lid of over te laten dragen als bedoeld in het derde lid over de voor hem relevante
      gevolgen en risico’s hierbij, waaronder een opgave van de hoogte van de vastgestelde uitkeringen indien het
      kapitaal of de premie daarvoor zou worden aangewend of overgedragen en de hoogte van de variabele uitkeringen als
      wordt belegd tot de pensioendatum. Deze opgaven worden tevens weergegeven op basis van een pessimistisch scenario,
      een verwacht scenario en een optimistisch scenario.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10c
  - number: 10c.5
    text: |-
      Bij de variabele uitkering worden financiële mee- of tegenvallers die het gevolg zijn van het beleggingsrisico of
      van de ontwikkeling van de levensverwachting verwerkt door middel van individuele toedeling.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10c
  - number: 10c.6
    text: Het kapitaal is niet negatief.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10c
  - number: 10c.7
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10c
  - number: 10d.1
    text: |-
      Een solidariteitsreserve heeft een maximale omvang van 15% van het geheel voor pensioen gereserveerde vermogen
      inclusief de solidariteitsreserve. De solidariteitsreserve is niet negatief.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10d
  - number: 10d.2
    text: |-
      Indien een solidariteitsreserve wordt gevuld uit premies of overrendement, bedraagt de inleg uit premie niet meer
      dan 10% van de premiesom per deelnemer per jaar en bedraagt de inleg uit overrendement niet meer dan 10% van het
      positieve collectieve overrendement per jaar.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10d
  - number: 10d.3
    text: |-
      Door middel van de solidariteitsreserve worden financiële mee- of tegenvallers collectief gedeeld op een wijze
      die op voorhand leidt tot gemiddeld stabielere of hogere toekomstige en al ingegane pensioenuitkeringen voor alle
      generaties, ten opzichte van de aanname dat de solidariteitsreserve geen onderdeel van de pensioenregeling zou
      zijn. De solidariteitsreserve wordt niet gebruikt voor deling van operationele kosten.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10d
  - number: 10d.4
    text: |-
      De pensioenuitvoerder stelt regels vast voor de doelstellingen van de solidariteitsreserve en het vullen en
      uitdelen uit de solidariteitsreserve. Deze regels zijn evenwichtig, transparant, onderling consistent en worden
      voor langere tijd vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10d
  - number: 10d.5
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10d
  - number: 10e.1
    text: |-
      Een risicodelingsreserve heeft een maximale omvang van 15% van het geheel voor pensioen gereserveerde kapitaal
      inclusief de risicodelingsreserve. De risicodelingsreserve is niet negatief.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10e
  - number: 10e.2
    text: |-
      Indien een risicodelingsreserve wordt gevuld uit premies of uit kapitaal bij toetreding tot het collectief
      toedelingsmechanisme voor de collectieve uitkeringsfase, bedraagt de inleg uit premie en de inleg uit kapitaal in
      totaal niet meer dan 10%.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10e
  - number: 10e.3
    text: |-
      Door middel van de risicodelingsreserve worden financiële mee- of tegenvallers collectief gedeeld op een wijze
      die op voorhand leidt tot gemiddeld stabielere of hogere toekomstige en al ingegane pensioenuitkeringen voor alle
      generaties, ten opzichte van de situatie dat de risicodelingsreserve geen onderdeel van de pensioenregeling is. De
      risicodelingsreserve wordt niet gebruikt voor deling van operationele kosten.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10e
  - number: 10e.4
    text: |-
      Bij een flexibele premieovereenkomst met beleggingsvrijheid worden financiële mee- of tegenvallers als gevolg van
      het beleggingsrisico niet gecompenseerd door de risicodelingsreserve.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10e
  - number: 10e.5
    text: |-
      De pensioenuitvoerder stelt regels vast voor de doelstellingen van de risicodelingsreserve en het vullen en
      uitdelen uit de risicodelingsreserve. Deze regels zijn evenwichtig, transparant, onderling consistent en worden
      voor langere tijd vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10e
  - number: 10e.6
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel10e
  - number: '11'
    text: |-
      De uitkering, het kapitaal, voor pensioenuitkering bestemd vermogen en de premie in het kader van een
      pensioenovereenkomst luiden in een Nederlands wettig betaalmiddel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel11
  - number: '12.1'
    text: |-
      De werkgever kan zich bij het sluiten of bij een wijziging van de pensioenovereenkomst het recht voorbehouden de
      premiebetaling, voorzover deze betrekking heeft op de bijdrage van de werkgever, te verminderen of beëindigen in
      geval van een ingrijpende wijziging van omstandigheden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel12
  - number: '12.2'
    text: |-
      Andere bedingen dan die bedoeld in het eerste lid, waarin een voorbehoud wordt gemaakt inzake premiebetaling, zijn
      nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel12
  - number: '14.1'
    text: |-
      Het verwerven van ouderdomspensioenaanspraken op basis van een pensioenovereenkomst begint uiterlijk op de 18-
      jarige leeftijd van de werknemer of op de latere datum van indiensttreding, tenzij het een ouderdomspensioen
      betreft dat uitsluitend voorziet in een uitkering tot het bereiken van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], of tot het bereiken van de pensioenleeftijd voor het
      levenslange ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '14.2'
    text: |-
      Het in het eerste lid genoemde tijdstip waarop de verwerving begint kan, indien in de pensioenovereenkomst is
      voorzien in een drempelperiode, met betrekking tot ouderdompensioen worden uitgesteld met ten hoogste twee maanden.
      Wachttijden zijn niet toegestaan voor het ouderdomspensioen. Wachttijden of drempelperioden zijn niet toegestaan
      voor het nabestaandenpensioen en het arbeidsongeschiktheidspensioen. Indien een werknemer bij de beëindiging van
      zijn arbeidsovereenkomst naar burgerlijk recht of publiekrechtelijke aanstelling nog niet in de pensioenregeling
      is opgenomen, maar er door of namens hem een bijdrage is betaald, dan wordt de som van de bijdragen aan hem
      terugbetaald of wordt, in geval de werknemer het beleggingsrisico draagt, de som van de gestorte bijdragen of de
      met deze bijdragen gerealiseerde beleggingswaarde aan hem terugbetaald.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel14
  - number: '14.3'
    text: |-
      In geval een werkgever die nog geen enkele pensioenovereenkomst heeft gesloten of die alleen een
      pensioenovereenkomst heeft gesloten met werknemers die tot een bepaalde groep behoren, over gaat tot het
      sluiten van een of meer pensioenovereenkomsten, geldt ten aanzien van zijn werknemers die bij het sluiten van de
      pensioenovereenkomst ouder zijn dan 18 jaar, niet de eis dat de verwerving van pensioen op 18-jarige leeftijd moet
      zijn begonnen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel14
  - number: '14.4'
    text: Elk beding in strijd met het eerste lid en tweede lid is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel14
  - number: '15.1'
    text: |-
      Indien een pensioenovereenkomst voorziet in een ouderdomspensioen, wordt in de overeenkomst bepaald
      dat dat pensioen levenslang wordt uitgekeerd aan de gepensioneerde, tenzij het ouderdomspensioen
      uitsluitend voorziet in een uitkering tot het bereiken van de de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], of tot het bereiken van de pensioenleeftijd voor het
      levenslange ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '15.2'
    text: Elk beding in strijd met het eerste lid is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel15
  - number: '16.1'
    text: 'Indien een pensioenovereenkomst voorziet in een nabestaandenpensioen wordt voldaan aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel16
  - number: 16.1.a
    text: |-
      een nabestaandenpensioen bij overlijden voor pensioendatum betreft een nabestaandenpensioen op risicobasis en de
      hoogte is diensttijdonafhankelijk;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel16
  - number: 16.1.b
    text: een partnerpensioen bij overlijden op of na pensioendatum betreft een partnerpensioen op opbouwbasis;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel16
  - number: 16.1.c
    text: |-
      indien sprake is van een partnerpensioen, voorziet de pensioenovereenkomst voor alle partnerrelaties in
      partnerpensioen en wordt geen onderscheid gemaakt al naar gelang het type partnerrelatie; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel16
  - number: 16.1.d
    text: |-
      indien sprake is van een wezenpensioen wordt in de pensioenovereenkomst bepaald dat het wezenpensioen wordt
      uitgekeerd tot het kind 25 jaar wordt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel16
  - number: '16.2'
    text: |-
      Voor de toepassing van deze wet kan een werknemer of gewezen werknemer op enig moment slechts één partner hebben.
      Indien de werknemer of gewezen werknemer op dat moment meer dan één partner zou hebben, wordt alleen de partner uit
      de oudste relatie als partner in de zin van deze wet aangemerkt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel16
  - number: '16.3'
    text: Elk beding in strijd met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel16
  - number: '17.1'
    text: |-
      De door of voor een deelnemer verschuldigde premie voor pensioen op opbouwbasis bedraagt voor alle deelnemers een
      gelijk percentage van het loon dat voor de pensioenberekening in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel17
  - number: '17.2'
    text: |-
      De door of voor een deelnemer verschuldigde premie voor pensioen op risicobasis bedraagt bij een pensioenregeling
      uitgevoerd door een verplichtgesteld bedrijfstakpensioenfonds een gelijk percentage van het loon dat voor de
      pensioenberekening in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel17
  - number: '17.3'
    text: |-
      Voor verschillende vormen van pensioen en voor verschillende pensioenregelingen kunnen verschillende premies
      worden vastgesteld. Voor verschillende pensioenregelingen die worden uitgevoerd door hetzelfde verplichtgestelde
      bedrijfstakpensioenfonds kunnen geen verschillende premies worden vastgesteld indien die pensioenregelingen
      dezelfde of nagenoeg dezelfde inhoud hebben.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel17
  - number: '17.4'
    text: Het eerste en tweede lid zijn niet van toepassing op de premie voor vrijwillige pensioenregelingen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel17
  - number: '17.5'
    text: |-
      De tweede zin van het derde lid is niet van toepassing indien bij een verplichtgesteld bedrijfstakpensioenfonds
      sprake is van een regeling die voor alle deelnemers geldt en de actuariële waarde van de uit die regeling
      voortvloeiende verplichtingen ten minste twee derde van de actuariële waarde van de uit het totaal
      van de pensioenregelingen van het bedrijfstakpensioenfonds anders dan regelingen voor nabestaanden- of
      arbeidsongeschiktheidspensioen, voortvloeiende verplichtingen met uitzondering van de uit de vrijwillige
      pensioenvoorzieningen voortvloeiende verplichtingen, betreft.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel17
  - number: 17a
    text: Het doorberekenen van kosten in het kader van een premieovereenkomst vindt evenredig in de tijd plaats.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel17a
  - number: '18.1'
    text: |-
      In geval van verlaging van de pensioengrondslag van een werknemer worden de op grond van de pensioenovereenkomst
      tot het tijdstip van verlaging opgebouwde pensioenaanspraken niet gewijzigd.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel18
  - number: '18.2'
    text: |-
      In geval van verlaging van de pensioengrondslag blijven de opgebouwde pensioenaanspraken behouden en worden de
      pensioenaanspraken vastgesteld overeenkomstig [artikel 55][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel55
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '18.3'
    text: Elk beding in strijd met het eerste of tweede lid is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel18
  - number: '19.1'
    text: |-
      Een werkgever kan de pensioenovereenkomst zonder instemming van de werknemer wijzigen indien de bevoegdheid daartoe
      schriftelijk in de pensioenovereenkomst is opgenomen en er tevens sprake is van een zodanig zwaarwichtig belang van
      de werkgever dat het belang van de werknemer dat door de wijziging zou worden geschaad daarvoor naar maatstaven van
      redelijkheid en billijkheid moet wijken.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel19
  - number: '19.2'
    text: |-
      Een werkgever kan de pensioenovereenkomst ook wijzigen voor gewezen werknemers, andere aanspraakgerechtigden en
      pensioengerechtigden. Het eerste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel19
  - number: '20'
    text: |-
      In geval van een wijziging van een pensioenovereenkomst worden de tot het tijdstip van wijziging opgebouwde
      pensioenaanspraken en de pensioenrechten niet gewijzigd, behoudens het bepaalde in de [artikelen 76][ref1],
      [78][ref2], [83][ref3] en [134][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel83
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '78'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '83'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '134'
        hoofdstuk: '6'
  - number: '21.1'
    text: |-
      De werkgever draagt er zorg voor dat de pensioenuitvoerder wordt geïnformeerd over het sluiten van een
      pensioenovereenkomst met een werknemer en de start van de verwerving van pensioenaanspraken door de werknemer. De
      pensioenuitvoerder informeert de werknemer binnen drie maanden na de start van het verwerven van pensioenaanspraken
      door de werknemer over de kenmerken van de pensioenregeling, de uitvoering van de pensioenregeling en over
      persoonlijke omstandigheden die een actie van de werknemer kunnen vergen. De werknemer wordt daarbij tevens gewezen
      op de website van de pensioenuitvoerder en op de mogelijkheid het pensioenregister te raadplegen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel21
  - number: '21.2'
    text: |-
      De werkgever informeert de pensioenuitvoerder over iedere wijziging in de pensioenovereenkomst, bedoeld in
      het eerste lid. De pensioenuitvoerder informeert de werknemer binnen drie maanden na een wijziging in de
      pensioenovereenkomst over die wijziging en de mogelijkheid om het gewijzigde pensioenreglement op te vragen bij
      de pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel21
  - number: '21.3'
    text: |-
      Het eerste lid is niet van toepassing indien de werkgever uiterlijk zes maanden voor het sluiten van de
      pensioenovereenkomst met de werknemer een eerdere pensioenovereenkomst met dezelfde werknemer heeft gesloten op
      grond waarvan de werknemer de in het eerste lid bedoelde informatie heeft ontvangen. Informatie die sinds de vorige
      verstrekking is gewijzigd wordt wel verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel21
  - number: '21.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de te verstrekken informatie.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel21
  - number: '22.1'
    text: |-
      De werkgever stelt een vereniging van pensioengerechtigden in de gelegenheid haar oordeel uit te spreken over een
      voorgenomen besluit van de werkgever in het kader van een uitvoeringsovereenkomst met een verzekeraar indien:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel22
  - number: 22.1.a
    text: dit besluit van invloed is op de uitvoering of de hoogte van pensioenrechten van gepensioneerden; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel22
  - number: 22.1.b
    text: |-
      de som van het aantal werknemers en het aantal gepensioneerden dat een pensioenovereenkomst heeft gesloten met de
      werkgever op dat moment gelijk is of meer bedraagt dan 250.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel22
  - number: '22.2'
    text: |-
      Een vereniging van pensioengerechtigden als bedoeld in het eerste lid dient volledige rechtsbevoegdheid te bezitten
      en tevens te voldoen aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel22
  - number: 22.2.a
    text: |-
      haar statutaire doel omvat in elk geval het behartigen van de belangen van de gepensioneerden die in dienst zijn
      geweest bij de werkgever;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel22
  - number: 22.2.b
    text: ten minste 10% van alle gepensioneerden die in dienst zijn geweest bij de werkgever is lid van de vereniging;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel22
  - number: 22.2.c
    text: de vereniging meldt haar bestaan bij de werkgever en de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel22
  - number: '22.3'
    text: |-
      Het oordeel van een vereniging van pensioengerechtigden wordt op een zodanig tijdstip gevraagd dat het van invloed
      kan zijn op het in het eerste lid bedoelde besluit.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel22
  - number: '22.4'
    text: |-
      Bij het vragen van een oordeel wordt aan de vereniging van pensioengerechtigden een overzicht verstrekt van de
      beweegredenen voor het besluit en van de gevolgen die het besluit naar verwachting voor de deelnemers, gewezen
      deelnemers, gepensioneerden en andere pensioengerechtigden zal hebben.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel22
  - number: '22.5'
    text: |-
      De werkgever verstrekt desgevraagd aan een vereniging van pensioengerechtigden tijdig alle inlichtingen en
      gegevens, die deze voor het vormen van haar oordeel redelijkerwijze nodig heeft. De inlichtingen worden desgevraagd
      schriftelijk verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel22
  - number: '22.6'
    text: |-
      De verzekeraar informeert de pensioengerechtigden, die pensioen ontvangen op grond van een pensioenovereenkomst met
      de in het eerste lid bedoelde werkgever, over het bestaan van een vereniging van pensioengerechtigden als bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel22
  - number: '23.1'
    text: |-
      De werkgever brengt een pensioenovereenkomst, uiterlijk wanneer een werknemer pensioenaanspraken verwerft, onder
      door onmiddellijk een schriftelijke uitvoeringsovereenkomst te sluiten met en in stand te houden bij:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel23
  - number: 23.1.a
    text: een pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel23
  - number: 23.1.b
    text: |-
      een pensioeninstelling uit een andere lidstaat die beschikt over een daartoe verleende vergunning als bedoeld in
      [artikel 199][ref1] en de bevoegde autoriteiten in kennis heeft gesteld overeenkomstig [artikel 199][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel199
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel199
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '199'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '199'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 23.1.c
    text: |-
      een verzekeraar met een zetel buiten Nederland, mits die verzekeraar op grond van de
      [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van levensverzekeraar of schadeverzekeraar mag
      uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '23.2'
    text: |-
      De in het eerste lid opgenomen verplichting van de werkgever tot het sluiten en instandhouden van een schriftelijke
      uitvoeringsovereenkomst geldt niet bij uitvoering door een bedrijfstakpensioenfonds:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel23
  - number: 23.2.a
    text: |-
      mits de werkgever gehouden is of zich verbonden heeft door lid te zijn van een werkgeversvereniging tot naleving
      van de statuten en reglementen van dit bedrijfstakpensioenfonds; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel23
  - number: 23.2.b
    text: |-
      een uitvoeringsreglement door het bedrijfstakpensioenfonds is opgesteld dat voldoet aan de eisen die in
      [artikel 25][ref1] ten aanzien van de uitvoeringsovereenkomst zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel25
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '23.3'
    text: |-
      De in het eerste lid opgenomen verplichtingen van de werkgever tot onderbrenging en het sluiten en in stand houden
      van een schriftelijke uitvoeringsovereenkomst gelden niet wanneer een pensioenovereenkomst is gesloten door een
      werkgever die tevens pensioenuitvoerder is, mits:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel23
  - number: 23.3.a
    text: |-
      de pensioenovereenkomsten van deze werknemers worden ondergebracht bij de werkgever in zijn hoedanigheid van
      pensioenuitvoerder; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel23
  - number: 23.3.b
    text: een uitvoeringsreglement door de werkgever is opgesteld.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel23
  - number: 23a
    text: |-
      Indien een algemeen pensioenfonds een pensioenregeling die is beëindigd uitvoert stelt het algemeen pensioenfonds
      een uitvoeringsreglement op dat, voor zover van toepassing, voldoet aan de eisen die in [artikel 25][ref1] ten
      aanzien van de uitvoeringsovereenkomst zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel25
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '24'
    text: |-
      De werkgever voldoet de pensioenuitvoerder de verschuldigde premie, tenzij er sprake is van voldoening door de
      gewezen werknemer in geval van een vrijwillige voortzetting als bedoeld in [artikel 54][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel54
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '54'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '25.1'
    text: |-
      In de uitvoeringsovereenkomst wordt in ieder geval een regeling opgenomen met betrekking tot de volgende
      onderwerpen:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.a
    text: de wijze waarop de verschuldigde premie wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.b
    text: |-
      de wijze waarop en termijnen waarin de verschuldigde premie moet worden voldaan met inachtneming van
      [artikel 26][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel26
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 25.1.c
    text: de informatie welke door de werkgever aan de pensioenuitvoerder wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.d
    text: de procedures welke gelden bij het niet nakomen van premiebetalingsverplichtingen door de werkgever;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.e
    text: |-
      de procedures welke gelden bij het opstellen en wijzigen van het pensioenreglement in verband met het sluiten en
      wijzigen van een pensioenovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.f
    text: |-
      indien van toepassing de uitgangspunten, regels en procedures welke gelden ten aanzien van een solidariteitsreserve
      of een risicodelingsreserve waaronder:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.f.1°
    text: de wijze waarop de reserve wordt gevuld;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.f.2°
    text: de regels voor het uitdelen uit de reserve;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.f.3°
    text: de wijze waarop de reserve meedeelt bij de verwerking van financiële mee- en tegenvallers;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.f.4°
    text: de gewenste en maximale omvang van de reserve;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.f.5°
    text: het beleid ten aanzien van een lege of volle reserve;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.f.6°
    text: de wijze waarop de reserve bijdraagt aan de intergenerationele risicodeling en stabiliteit; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.f.7°
    text: de samenhang en onderlinge consistentie van deze uitgangspunten, regels en procedures;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.g
    text: |-
      de uitgangspunten en procedures welke gelden ten aanzien van de besluitvorming over vermogenstekorten en
      vermogensoverschotten dan wel winstdeling;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.h
    text: |-
      de voorwaarden die gelden bij beëindiging van een met een verzekeraar, een premiepensioeninstelling of een algemeen
      pensioenfonds gesloten uitvoeringsovereenkomst. In deze regeling worden de belangen van zowel de verzekeraar, de
      premiepensioeninstelling of het algemeen pensioenfonds als de werkgever vanuit actuarieel en bedrijfseconomisch
      oogpunt op evenwichtige wijze gewaarborgd door rekening te houden met:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.h.1°
    text: de overige voorwaarden in de uitvoeringsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.h.2°
    text: de gehanteerde tarieven; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.h.3°
    text: de winstdelingsvorm.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.i
    text: |-
      de criteria die de premiepensioeninstelling hanteert bij de keuze voor een verzekeraar voor de inkoop van een
      pensioenuitkering;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.j
    text: |-
      de kosten die verband houden met de uitvoering van de pensioenregeling en die in mindering kunnen worden gebracht
      op een afgescheiden vermogen dat wordt aangehouden door een algemeen pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.k
    text: |-
      de kosten die ten laste kunnen worden gebracht van de premie voor een afgescheiden vermogen dat wordt aangehouden
      door een algemeen pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.l
    text: de afspraken die met een algemeen pensioenfonds worden gemaakt over de kwaliteit van de dienstverlening; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.1.m
    text: |-
      ingeval een premie-uitkeringsovereenkomst wordt uitgevoerd door een premiepensioeninstelling: de afspraken die
      worden gemaakt met een verzekeraar over de toepassing van [artikel 10c, derde lid][ref1], en over de wijze waarop
      na de waardeoverdracht wordt voldaan aan de bepalingen in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel10c
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 10c
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '25.2'
    text: |-
      In de uitvoeringsovereenkomst wordt, voor zover overeengekomen, een regeling opgenomen met betrekking tot de
      volgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.2.a
    text: |-
      een voorbehoud van de werkgever als bedoeld in [artikel 12][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel12
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 25.2.b
    text: |-
      in geval van terugstorting: de voorwaarden waaronder sprake is van terugstorting, de wijze van vaststelling van de
      hoogte van de terugstorting en de bestemming ervan;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.2.c
    text: |-
      ingeval van een bijstortingsverplichting van de werkgever: onder welke voorwaarden sprake is van een
      bijstortingsverplichting en hoe de hoogte ervan wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.2.d
    text: de mogelijkheid tot vrijwillige voortzetting van de pensioenregeling na beëindiging van het dienstverband;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.2.e
    text: |-
      de aansluitingscriteria op grond waarvan de vrijwillige aansluiting bij een bedrijfstakpensioenfonds heeft
      plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.2.f
    text: de rechten en verplichtingen met betrekking tot vrijwillige pensioenregelingen; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: 25.2.g
    text: de maatstaven voor en voorwaarden waaronder toeslagverlening plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: '25.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de kosten, bedoeld
      in het eerste lid, onderdeel j en k en de afspraken, bedoeld in het eerste lid, onderdeel l.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel25
  - number: '26'
    text: |-
      In de uitvoeringsovereenkomst wordt vastgelegd hoe de betaling van de premies door de werkgever aan de
      pensioenuitvoerder geschiedt, waarbij aan de volgende voorwaarden wordt voldaan:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel26
  - number: 26.a
    text: |-
      een werkgever voldoet de werkgeverspremie en de op het loon van de werknemer ingehouden werknemerspremie aan de
      pensioenuitvoerder uiterlijk binnen:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel26
  - number: 26.a.1°
    text: |-
      twee maanden na afloop van elke maand waarover de premie verschuldigd is indien de pensioenuitvoerder op basis van
      actuele loonsomgegevens zijn administratie voert; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel26
  - number: 26.a.2°
    text: een maand na afloop van elk kwartaal waarover de premie verschuldigd is;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel26
  - number: 26.b
    text: |-
      wanneer de premie op basis van een langere termijn dan een kwartaal wordt vastgesteld en in rekening gebracht, is
      deze termijn ten hoogste gelijk aan een jaar en voldoet de werkgever uiterlijk binnen een maand na afloop van elk
      kwartaal een vierde gedeelte van de door hem op basis van zijn eigen bijdrage verschuldigde jaarpremie op basis
      van een schatting van de pensioenuitvoerder en de op het loon van de werknemer ingehouden werknemerspremie, aan de
      pensioenuitvoerder; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel26
  - number: 26.c
    text: |-
      de totale jaarpremie, bestaande uit de werkgeverspremie en de werknemerspremies, wordt uiterlijk binnen zes maanden
      na afloop van het kalenderjaar voldaan aan de pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel26
  - number: '27'
    text: |-
      De in [artikel 26][ref1] genoemde termijnen gelden niet indien sprake is van een beëindiging van de deelneming. In
      dat geval wordt de ten tijde van de beëindiging nog verschuldigde premie binnen dertien weken voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel26
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '28.1'
    text: |-
      Een pensioenfonds informeert elk kwartaal schriftelijk het verantwoordingsorgaan of het belanghebbendenorgaan en,
      bij het ontbreken daarvan, de deelnemers, gewezen deelnemers en pensioengerechtigden wanneer sprake is van een
      premieachterstand ter grootte van 5% van de totale door het pensioenfonds te ontvangen jaarpremie.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel28
  - number: '28.2'
    text: |-
      Gedurende de in het eerste lid bedoelde situatie informeert een pensioenfonds tevens elk kwartaal de
      ondernemingsraad van de onderneming die nog premie aan het pensioenfonds verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel28
  - number: '28.3'
    text: Bij een algemeen pensioenfonds worden de voorgaande twee leden toegepast per afgescheiden vermogen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel28
  - number: '29.1'
    text: |-
      Een verzekeraar informeert de deelnemers en de werkgever wanneer de premieachterstand het noodzakelijk maakt de
      opbouw van pensioenaanspraken te beëindigen door premievrijmaking of pensioenaanspraken zonder premievrije waarde
      te laten vervallen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel29
  - number: '29.2'
    text: |-
      Een verzekeraar kan de in het eerste lid bedoelde mededeling aan de deelnemers pas doen indien hij zich aantoonbaar
      heeft ingespannen om de achterstallige premie te innen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel29
  - number: '29.3'
    text: |-
      De verzekeraar kan op zijn vroegst drie maanden na de in het eerste lid bedoelde mededeling de opbouw van
      pensioenaanspraken beëindigen door premievrijmaking of pensioenaanspraken zonder premievrije waarde laten
      vervallen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel29
  - number: '29.4'
    text: |-
      De premievrijmaking, bedoeld in het derde lid, vindt op zijn vroegst plaats per de datum die vijf maanden voor het
      tijdstip van informeren van de deelnemers is gelegen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel29
  - number: '29.5'
    text: |-
      De dekking van het arbeidsongeschiktheidsrisico of het overlijdensrisico blijft volledig in stand tot drie maanden
      na de in het eerste lid bedoelde mededeling.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel29
  - number: '29.6'
    text: |-
      Bij de premievrijmaking wordt de verzekering premievrij voortgezet zonder verrekening van premie en rente met de
      pensioenaanspraken. Kosten, voor zover voortvloeiend uit het premievrij maken, worden evenmin verrekend met de
      pensioenaanspraken.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel29
  - number: '29.7'
    text: Dit artikel is van overeenkomstige toepassing op een premiepensioeninstelling.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel29
  - number: '30'
    text: |-
      In een uitvoeringsovereenkomst met een verzekeraar met zetel buiten Nederland waarin bij de totstandkoming of op
      een later tijdstip wordt gekozen voor ander dan Nederlands recht, wordt de volgende clausule opgenomen: Ongeacht
      het gekozen rechtsstelsel is ten aanzien van deze uitvoeringsovereenkomst in ieder geval de Pensioenwet van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel30
  - number: '31'
    text: |-
      Verpanding van de uit de uitvoeringsovereenkomst voortvloeiende rechten door de werkgever of andere handelingen die
      door hem worden verricht waardoor aan anderen dan de aanspraak- of pensioengerechtigden rechten worden verleend,
      is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel31
  - number: '32'
    text: |-
      Een pensioenuitvoerder heeft tot taak een pensioenovereenkomst uit te voeren op basis van een
      uitvoeringsovereenkomst of een uitvoeringsreglement.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel32
  - number: '33.1'
    text: |-
      Een pensioenuitvoerder richt zijn organisatie zodanig in dat een goed bestuur is gewaarborgd waardoor er in ieder
      geval:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel33
  - number: 33.1.a
    text: verantwoording wordt afgelegd aan de aanspraak- en pensioengerechtigden en de werkgever; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel33
  - number: 33.1.b
    text: intern toezicht is.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel33
  - number: '33.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot het eerste lid regels worden gesteld. Die regels
      kunnen in het bijzonder betrekking hebben op de naleving van in die algemene maatregel van bestuur aan te wijzen
      principes voor goed pensioenfondsbestuur.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel33
  - number: '34.1'
    text: |-
      Indien een pensioenuitvoerder werkzaamheden uitbesteedt aan een derde draagt hij er zorg voor dat deze derde de bij
      of krachtens deze wet gestelde regels, die van toepassing zijn op de uitbestedende pensioenuitvoerder, naleeft.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel34
  - number: '34.2'
    text: 'Door de pensioenuitvoerder mogen de volgende werkzaamheden niet worden uitbesteed:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel34
  - number: 34.2.a
    text: |-
      taken en werkzaamheden van personen die het dagelijks beleid bepalen, daaronder mede verstaan het vaststellen van
      beleid en het afleggen van verantwoording over het gevoerde beleid;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel34
  - number: 34.2.b
    text: het opstellen van en toezien op het strategisch beleid ten aanzien van vermogensbeheer;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel34
  - number: 34.2.c
    text: |-
      werkzaamheden waarvan uitbesteding de verantwoordelijkheid van de uitvoerder voor de organisatie en beheersing van
      bedrijfsprocessen en het toezicht daarop kan ondermijnen;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel34
  - number: 34.2.d
    text: |-
      indien de uitbesteding een belemmering kan vormen voor een adequaat toezicht op de naleving van het bij of
      krachtens de Pensioenwet bepaalde.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel34
  - number: '34.3'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel34
  - number: 34.3.a
    text: werkzaamheden worden aangewezen die niet mogen worden uitbesteed;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel34
  - number: 34.3.b
    text: |-
      regels worden gesteld met betrekking tot de uitbesteding in verband met het toezicht op de naleving van het bij of
      krachtens deze wet bepaalde; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel34
  - number: 34.3.c
    text: regels worden gesteld met betrekking tot de beheersing van risico’s die verband houden met de uitbesteding.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel34
  - number: '35.1'
    text: |-
      De pensioenuitvoerder stelt een pensioenreglement vast in overeenstemming met de pensioenovereenkomst en de
      uitvoeringsovereenkomst of het uitvoeringsreglement.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel35
  - number: '35.2'
    text: 'In het pensioenreglement worden in ieder geval bepalingen opgenomen betreffende:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel35
  - number: 35.2.a
    text: de wijze waarop de pensioenuitvoerder omgaat met inkomende waarden in het kader van waardeoverdracht;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel35
  - number: 35.2.b
    text: |-
      de hoogte van de ruilvoet en de opbouwkeuzevoet, bedoeld in [artikel 60][ref1] en [61][ref2], en de afkoopvoet,
      bedoeld in [artikel 66][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '60'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 35.2.c
    text: |-
      de kortingsregel, bedoeld in [artikel 134][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel35
    references:
      - id: ref1
