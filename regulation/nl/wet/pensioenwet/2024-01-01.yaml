        artikel: '83'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref5
        bwb_id: BWBR0020809
        artikel: '84'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref6
        bwb_id: BWBR0020809
        artikel: 150m
        hoofdstuk: 6b
        paragraaf: 6b.5
  - number: 220g.1
    text: |-
      Voor de toepassing van dit artikel wordt onder overgangstijdstip verstaan: het tijdstip waarop de
      pensioenuitvoerder overgaat op uitvoering van een gewijzigde pensioenovereenkomst om te voldoen aan de regels
      omtrent het nabestaandenpensioen zoals geïntroduceerd met de [Wet toekomst pensioenen][ref1] maar uiterlijk
      1 januari 2027.


      [ref1]: https://wetten.overheid.nl/BWBR0048328
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220g
    references:
      - id: ref1
        bwb_id: BWBR0048328
  - number: 220g.2
    text: |-
      Een persoon die vóór het overgangstijdstip kwalificeerde als partner zoals gedefinieerd in
      [artikel 1][ref1], zoals dat artikel luidde op de dag voor de datum van inwerkingtreding van
      [artikel I, onderdeel A, van de Wet toekomst pensioenen][ref2] blijft als partner in de zin van deze wet
      aangemerkt zo lang de betreffende relatie tussen de persoon en de werknemer of gewezen werknemer wordt voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0048328#ArtikelI
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220g
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0048328
        artikel: I
  - number: 220g.3
    text: |-
      Een persoon die voor het overgangstijdstip als partner aanspraakgerechtigde was voor partnerpensioen op opbouwbasis
      blijft aanspraakgerechtigde voor de tot het overgangstijdstip opgebouwde aanspraak op partnerpensioen, met
      inachtneming van [artikel 57][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel57
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220g
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 220g.4
    text: |-
      Een partner of gewezen partner in de zin van de pensioenovereenkomst komt niet in aanmerking voor een
      partnerpensioen of, zo nodig in afwijking van [artikel 57][ref1], een bijzonder partnerpensioen op basis van
      partnerpensioen dat is opgebouwd voor het overgangstijdstip in een pensioenregeling zonder partnerpensioen voor
      partners in de zin van de pensioenovereenkomst of in een pensioenregeling met een partnerbegrip waaraan deze
      partner of gewezen partner niet voldeed of zou hebben voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel57
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220g
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 220g.5
    text: |-
      [Artikel 16, eerste lid, onderdeel d][ref1], is niet van toepassing op een wezenpensioen waarvan de ingangsdatum
      ligt voor het overgangstijdstip of dat is opgebouwd voor het overgangstijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel16
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220g
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 220g.6
    text: |-
      [Artikel 55, vierde lid][ref1], zoals dat komt te luiden na de inwerkingtreding van
      [artikel I, onderdeel GG, onder 4, van de Wet toekomst pensioenen][ref2] en [artikel 61a][ref3] zijn van
      toepassing indien het einde van de deelneming ligt vanaf het overgangstijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0048328#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel61a
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220g
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0048328
        artikel: I
      - id: ref3
        bwb_id: BWBR0020809
        artikel: 61a
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 220g.7
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220g
  - number: 220h.1
    text: |-
      In afwijking van [artikel 10][ref1] kan opbouw van pensioenaanspraken op grond van een uitkeringsovereenkomst als
      bedoeld in [artikel 1][ref2], zoals dat artikel luidde op de dag voorafgaand aan het tijdstip van inwerkingtreding
      van de [Wet toekomst pensioenen][ref3], ook vanaf het tijdstip van inwerkingtreding van de Wet toekomst pensioenen
      worden voortgezet indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0048328
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220h
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref3
        bwb_id: BWBR0048328
  - number: 220h.1.a
    text: |-
      de uitkeringsovereenkomst wordt uitgevoerd door een pensioenfonds dat een beëindigde pensioenregeling uitvoert en
      de onderneming van de werkgever heeft opgehouden te bestaan;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220h
  - number: 220h.1.b
    text: |-
      het pensioenaanspraken voor ouderdomspensioen betreft die als gevolg van een premievrije voortzetting van die
      pensioenaanspraken worden opgebouwd; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220h
  - number: 220h.1.c
    text: |-
      het recht op de premievrije voortzetting is ontstaan voorafgaand aan het tijdstip van inwerkingtreding van de
      [Wet toekomst pensioenen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0048328
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220h
    references:
      - id: ref1
        bwb_id: BWBR0048328
  - number: 220h.2
    text: |-
      Indien sprake is van premievrije voortzetting in de omstandigheden, bedoeld in het eerste lid, kan, in afwijking
      van [artikel 16][ref1] en [artikel 220g][ref2], de regeling van het nabestaandenpensioen ongewijzigd worden
      voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel220g
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220h
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 220g
        hoofdstuk: '9'
  - number: 220ha.1
    text: |-
      Indien het verwerven van pensioenaanspraken op grond van een uitkeringsovereenkomst, kapitaalovereenkomst of
      premieovereenkomst als bedoeld in [artikel 1][ref1], zoals dat artikel luidde op de dag voorafgaand aan het
      tijdstip van inwerkingtreding van de [Wet toekomst pensioenen][ref2], wordt uitgevoerd door een verzekeraar, dan
      kan de verwerving vanaf het tijdstip van inwerkingtreding van de Wet toekomst pensioenen worden voortgezet indien
      voldaan wordt aan de voorwaarden uit het tweede lid. Bij toepassing van de eerste zin kan van [artikel 10][ref3]
      worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0048328
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel10
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220ha
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0048328
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 220ha.2
    text: 'Het verwerven van pensioenaanspraken, bedoeld in het eerste lid, kan worden voortgezet indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220ha
  - number: 220ha.2.a
    text: |-
      de pensioenaanspraken worden verworven als gevolg van premievrije voortzetting vanwege arbeidsongeschiktheid
      van de werknemer of gewezen werknemer, waarop recht bestaat na afloop van de periode, bedoeld in
      [artikel 29, eerste lid, van de Ziektewet][ref1] of, indien de werknemer of gewezen werknemer een uitkering uit
      hoofde van de [Ziektewet][ref2] ontvangt, na afloop van de periode, bedoeld in artikel 29, vijfde en tiende lid,
      van de Ziektewet; en


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220ha
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0001888
  - number: 220ha.2.b
    text: 'het recht op premievrije voortzetting vanwege arbeidsongeschiktheid is ingegaan:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220ha
  - number: 220ha.2.b.1°
    text: |-
      voor het tijdstip dat de verzekeraar overgaat op uitvoering van een gewijzigde pensioenovereenkomst als bedoeld in
      [artikel 220i][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel220i
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220ha
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 220i
        hoofdstuk: '9'
  - number: 220ha.2.b.2°
    text: |-
      nadat de deelneming vanwege een individuele beëindiging van de dienstbetrekking voor afloop van de periode, bedoeld
      in onderdeel a, is beëindigd waarbij op het moment van einde deelneming de verzekeraar nog niet is overgegaan op
      uitvoering van een gewijzigde pensioenovereenkomst als bedoeld in [artikel 220i][ref1] en het recht op premievrije
      voortzetting uiterlijk op 31 december 2028 is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel220i
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220ha
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 220i
        hoofdstuk: '9'
  - number: 220ha.3
    text: |-
      Dit artikel is van overeenkomstige toepassing op de opbouw van pensioenaanspraken in een premieovereenkomst als
      bedoeld in [artikel 1][ref1], zoals dat artikel luidde op de dag voorafgaand aan het tijdstip van inwerkingtreding
      van de [Wet toekomst pensioenen][ref2], uitgevoerd door een premiepensioeninstelling waarbij premievrije
      voortzetting van deze opbouw vanwege arbeidsongeschiktheid van de werknemer of gewezen werknemer is verzekerd bij
      een verzekeraar. Bij deze verzekerde premievrije voortzetting voldoet de verzekeraar de verschuldigde premie aan de
      premiepensioeninstelling indien voldaan wordt aan de voorwaarden, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0048328
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220ha
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0048328
  - number: 220hb
    text: |-
      In afwijking van [artikel 54, tweede lid][ref1], geldt een termijn van vijftien jaar, voor
      de deelnemer die gewezen werknemer is geworden voor het tijdstip van inwerkingtreding van de
      [Wet toekomst pensioenen][ref2], en die gedurende die termijn winst uit onderneming geniet als bedoeld in
      [artikel 3.8 van de Wet inkomstenbelasting 2001][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0048328
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220hb
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '54'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0048328
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 220i.1
    text: |-
      De Pensioenwet, zoals die luidde op de dag voor het tijdstip van inwerkingtreding van de
      [Wet toekomst pensioenen][ref1], blijft van toepassing tot het tijdstip dat de pensioenuitvoerder overgaat
      op uitvoering van een gewijzigde pensioenovereenkomst, maar uiterlijk tot 1 januari 2027. In afwijking van de
      vorige zin zijn vanaf het tijdstip van inwerkingtreding van [artikel I][ref2], onderdelen A, B, eerste en derde
      onderdeel, Ca, H, K, L, X, Y, Z, AA, BB, CC, FFa, ZZ, BBB, BBBa, CCC, DDD, NNN, RRR, SSS, QQQ en UUU van de Wet
      toekomst pensioenen van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0048328
      [ref2]: https://wetten.overheid.nl/BWBR0048328#ArtikelI
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220i
    references:
      - id: ref1
        bwb_id: BWBR0048328
      - id: ref2
        bwb_id: BWBR0048328
        artikel: I
  - number: 220i.1.a
    text: |-
      de [artikelen 1][ref1], voor zover relevant voor de in dit lid genoemde artikelen en hoofdstukken, [2][ref2], voor
      zover het betreft de nadere duiding van de pensioenovereenkomst, [8][ref3], [14][ref4], [19][ref5], [20][ref6],
