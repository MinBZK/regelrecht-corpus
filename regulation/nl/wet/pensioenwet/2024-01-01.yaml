        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 85.1.a
    text: |-
      de tot verevening gerechtigde echtgenoot, bedoeld in
      [artikel 2 van de Wet verevening pensioenrechten bij scheiding][ref1], met de waardeoverdracht instemt; en


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel2
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0006641
        artikel: '2'
  - number: 85.1.b
    text: |-
      de mogelijkheden tot afkoop van de waarde van de overgedragen pensioenaanspraken na de waardeoverdracht niet ruimer
      zijn dan op basis van deze wet.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel85
  - number: '85.2'
    text: |-
      Indien op grond van de in [artikel 72][ref1] genoemde omstandigheden tijdelijk geen plicht tot waardeoverdracht
      bestaat, maar deze plicht overeenkomstig [artikel 74][ref2] herleeft, is [artikel 74, derde lid][ref3], niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel74
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel85
    references:
