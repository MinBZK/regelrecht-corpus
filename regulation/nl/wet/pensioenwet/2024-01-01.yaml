  - number: '2.1'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld over hetgeen onder de directeur-
      grootaandeelhouder wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2
  - number: '2.2'
    text: 'Met een pensioenovereenkomst wordt gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2
  - number: 2.2.a
    text: |-
      de uit de dienstbetrekking voortvloeiende rechtsbetrekking tussen een werkgever en een werknemer met betrekking tot
      pensioen in geval van deelneming in een bedrijfstakpensioenfonds op basis van een verplichtstelling; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2
  - number: 2.2.b
    text: |-
      de uit de dienstbetrekking voortvloeiende rechtsbetrekking tussen een overheidswerkgever en een overheidswerknemer
      als bedoeld in de [Wet privatisering ABP][ref1] met betrekking tot pensioen op grond van de overeenkomst, bedoeld
      in [artikel 4][ref2] en [5 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007791
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007791#Artikel5
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007791
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0007791
        artikel: '5'
  - number: '2.3'
    text: |-
      Bij regeling van Onze Minister kan een categorie van personen, niet zijnde werknemers, die werkt in een
      arbeidsverhouding waarbij tegen beloning persoonlijke arbeid wordt verricht, worden aangewezen die voor de
      toepassing van deze wet en de daarop berustende bepalingen wordt gelijkgesteld met werknemers.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2
  - number: '2.4'
    text: |-
      Een geldelijke uitkering voor een gewezen werknemer die wordt gedaan bij wijze van inkomensvoorziening bij ouderdom
      in verband met vervroegde uittreding is geen pensioen in de zin van deze wet, indien die uitkering:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2
  - number: 2.4.a
    text: |-
      uiterlijk eindigt op de datum waarop volgens de [Algemene Ouderdomswet][ref1] recht op ouderdomspensioen ontstaat,
      bij het bereiken van de pensioenleeftijd voor het levenslange ouderdomspensioen of bij eerder overlijden en die
      gebaseerd is op een overeenkomst die alleen aanspraak op een uitkering toekent aan degenen die tijdens de looptijd
      van de regeling, welke ten hoogste vijf jaar bedraagt, een bepaalde leeftijd hebben bereikt; of


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 2.4.b
    text: |-
      gebaseerd is op de [Wet kaderregeling Vut overheidspersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007792
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007792
  - number: '2.5'
    text: |-
      Een geldelijke uitkering voor een gewezen werknemer bij wijze van inkomensvoorziening bij ouderdom is geen pensioen
      in de zin van deze wet wanneer deze uitkering is gebaseerd op een regeling:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2
  - number: 2.5.a
    text: |-
      die leidt tot uitkeringen vanaf een bepaalde leeftijd aan werknemers die werkzaamheden verrichten die door de
      werkgever als substantieel bezwarend zijn aangemerkt;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2
  - number: 2.5.b
    text: |-
      die leidt tot een uitkering die uiterlijk eindigt op de datum waarop volgens de [Algemene Ouderdomswet][ref1] recht
      op ouderdomspensioen ontstaat, bij het bereiken van de pensioenleeftijd voor het ouderdomspensioen of bij eerder
      overlijden; en


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 2.5.c
    text: die bij regeling van Onze Minister is aangewezen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2
  - number: '2.6'
    text: |-
      Een uitkering voor een gemoedsbezwaarde als bedoeld in
      [artikel 64, eerste lid, onderdeel a, van de Wet financiering sociale verzekeringen][ref1] is geen pensioen in de
      zin van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel64
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '64'
  - number: '2.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld op grond waarvan
      aanvullingen op een loonaanvullingsuitkering of een vervolguitkering als bedoeld in
      [artikel 60, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] die geen
      arbeidsongeschiktheidspensioen zijn als bedoeld in [artikel 1][ref2] worden aangemerkt als
      arbeidsongeschiktheidspensioen als bedoeld in [dat artikel][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel2
