      het pensioenreglement over die wijziging en de mogelijkheid om het gewijzigde pensioenreglement op te vragen bij
      de pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel44
  - number: '44.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid
      bedoelde opgaven en informatie en de wijze waarop deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel44
  - number: 44a.1
    text: |-
      De pensioenuitvoerder die bereid is op te treden als ontvangende pensioenuitvoerder informeert degene die het
      uit een flexibele premieovereenkomst of premie-uitkeringsovereenkomst voortvloeiende kapitaal op de pensioendatum
      wenst aan te wenden voor een variabele uitkering over de voor hem relevante gevolgen en risico’s bij een variabele
      uitkering waaronder een opgave van de hoogte van de variabele uitkeringen en een opgave van de hoogte van de
      vastgestelde uitkeringen indien het kapitaal daarvoor zou worden aangewend. Deze opgaven worden, voor zover het
      ouderdomspensioen betreft, tevens weergegeven op basis van een pessimistisch scenario, een verwacht scenario en
      een optimistisch scenario. De pensioenuitvoerder die een spreidingsperiode van langer dan vijf jaar aanbiedt,
      informeert de deelnemer expliciet over de voor hem relevante gevolgen en risico’s daarvan.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel44a
  - number: 44a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de te verstrekken informatie, de rekenregels en de wijze waarop de informatie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel44a
  - number: '45.1'
    text: |-
      De pensioenuitvoerder informeert een deelnemer voorafgaand aan de deelneming in de vrijwillige pensioenregeling
      over:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel45
  - number: 45.1.a
    text: de inhoud van de vrijwillige pensioenregeling;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel45
  - number: 45.1.b
    text: een opgave van de reglementair te bereiken pensioenaanspraken uit hoofde van de vrijwillige pensioenregeling;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel45
  - number: 45.1.c
    text: voor zover van toepassing, de toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel45
  - number: 45.1.d
    text: |-
      voor zover van toepassing, vermindering van pensioenaanspraken en pensioenrechten op grond van [artikel 134][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '134'
        hoofdstuk: '6'
  - number: 45.1.e
    text: voor zover van toepassing, informatie over beleggingsresultaten; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel45
  - number: 45.1.f
    text: |-
      voor zover van toepassing, informatie over de structuur van de kosten die door deelnemers, gewezen deelnemers en
      pensioengerechtigden worden gedragen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel45
  - number: '45.2'
    text: |-
      De opgave van de reglementair te bereiken pensioenaanspraken wordt, voor zover het ouderdomspensioen betreft,
      tevens weergegeven op basis van een pessimistisch scenario, een verwacht scenario en een optimistisch scenario.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel45
  - number: '45.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de te hanteren rekenregels.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel45
  - number: 45a.1
    text: |-
      Een pensioenfonds neemt in zijn bestuursverslag informatie op over de uitvoeringskosten over het verslagjaar,
      waarbij worden onderscheiden: administratieve uitvoeringskosten, de kosten van vermogensbeheer en transactiekosten.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel45a
  - number: 45a.2
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel45a
  - number: '46.1'
    text: |-
      De pensioenuitvoerder verstrekt de deelnemer, de gewezen deelnemer, de gewezen partner of de pensioengerechtigde
      op verzoek:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46
  - number: 46.1.a
    text: |-
      informatie over de gehanteerde aannamen bij de weergave van ouderdomspensioen op basis van een pessimistisch
      scenario, een verwacht scenario en een optimistisch scenario;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46
  - number: 46.1.b
    text: de voor hem relevante informatie over beleggingen; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46
  - number: 46.1.c
    text: informatie over andere bij algemene maatregel van bestuur te bepalen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46
  - number: '46.2'
    text: |-
      De pensioenuitvoerder verstrekt de deelnemer, de gewezen deelnemer of de gewezen partner op verzoek informatie
      die specifiek voor hem relevant is waaronder een indicatie van het mogelijk te bereiken kapitaal op de
      pensioendatum bij flexibele premieovereenkomsten of premie-uitkeringsovereenkomsten en een indicatie van de hoogte
      van de in te kopen periodieke uitkeringen bij aanwending van het mogelijk te bereiken kapitaal bij flexibele
      premieovereenkomsten en bij premie-uitkeringsovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46
  - number: '46.3'
    text: |-
      De indicaties, bedoeld in het tweede lid, worden, voor zover het ouderdomspensioen betreft, tevens weergegeven op
      basis van een pessimistisch scenario, een verwacht scenario en een optimistisch scenario.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46
  - number: '46.4'
    text: |-
      De pensioenuitvoerder verstrekt de gewezen partner op verzoek de informatie in [artikel 42, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel42
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '46.5'
    text: |-
      De pensioenuitvoerder verstrekt de pensioengerechtigde op verzoek een opgave van zijn pensioenrecht, waarbij
      deze gegevens voor zover het ouderdomspensioen betreft, tevens weergegeven worden op basis van een pessimistisch
      scenario, een verwacht scenario en een optimistisch scenario.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46
  - number: '46.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de te hanteren rekenregels.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46
  - number: 46a.1
    text: |-
      De pensioenuitvoerder stelt op zijn website voor in ieder geval de deelnemer, gewezen deelnemer, gewezen partner of
      pensioengerechtigde beschikbaar:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46a
  - number: 46a.1.a
    text: |-
      informatie over de pensioenregeling als bedoeld in [artikel 21][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel21
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 46a.1.b
    text: verdere informatie over de pensioenregeling;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46a
  - number: 46a.1.c
    text: informatie over uitvoeringskosten; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46a
  - number: 46a.1.d
    text: het bestuursverslag en de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46a
  - number: 46a.2
    text: |-
      Voor zover van toepassing stelt de pensioenuitvoerder op zijn website voor de deelnemer, gewezen deelnemer, gewezen
      partner of pensioengerechtigde beschikbaar:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46a
  - number: 46a.2.a
    text: informatie over de gevolgen van significante wijzigingen in de technische voorzieningen;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46a
  - number: 46a.2.b
    text: informatie over het financieel crisisplan;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46a
  - number: 46a.2.c
    text: informatie over het herstelplan of geactualiseerd herstelplan;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46a
  - number: 46a.2.d
    text: informatie over de beleggingen en het beleggingsbeleid;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46a
  - number: 46a.2.e
    text: het pensioenreglement; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46a
  - number: 46a.2.f
    text: de uitvoeringsovereenkomst of het uitvoeringsreglement.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46a
  - number: 46a.3
    text: |-
      Voor zover van toepassing stelt de pensioenuitvoerder op zijn website voor een ieder de verklaring inzake
      beleggingsbeginselen beschikbaar.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46a
  - number: 46a.4
    text: |-
      In het bestuursverslag, bedoeld in het eerste lid, onderdeel d, neemt een pensioenfonds informatie op
      over de haalbaarheidstoets en de reële dekkingsgraad. Een pensioenuitvoerder neemt in het bestuursverslag
      informatie op over de totale waarde en de bestemming van de pensioenaanspraken die vervallen, bedoeld in
      [artikel 55, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel55
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 46a.5
    text: |-
      Indien de deelnemer, gewezen deelnemer, gewezen partner of pensioengerechtigde hierom verzoekt verstrekt
      de pensioenuitvoerder de in het eerste tot en met derde lid bedoelde informatie en stukken elektronisch of
      schriftelijk.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46a
  - number: 46a.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer het opnemen van gegevens over de vergelijkbaarheid van onderdelen van de pensioenregeling.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel46a
  - number: '47.1'
    text: |-
      De pensioenuitvoerder verstrekt deelnemers, gewezen deelnemers en gepensioneerden die zich in een andere lidstaat
      vestigen informatie over hun pensioenaanspraken en pensioenrechten en over de mogelijkheden die hun op grond van de
      pensioenregeling worden geboden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel47
  - number: '47.2'
    text: |-
      De informatie die op grond van het eerste lid wordt verstrekt is ten minste overeenkomstig de informatie die wordt
      verstrekt aan deelnemers, gewezen deelnemers en gepensioneerden die in Nederland blijven.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel47
  - number: 47a.1
    text: |-
      Voorafgaand aan de totstandkoming van een overeenkomst inzake een pensioenuitkering stelt een verzekeraar die
      bereid is op te treden als ontvangende pensioenuitvoerder, op basis van informatie die verstrekt is door de
      betrokkene die het uit een flexibele premieovereenkomst en premie-uitkeringsovereenkomst voortvloeiende kapitaal op
      de pensioendatum wenst aan te wenden voor een pensioenuitkering, de wensen en behoeften van de betrokkene vast en
      verstrekt hij de betrokkene informatie over overeenkomsten inzake een pensioenuitkering om hem in staat te stellen
      met kennis van zaken een beslissing te nemen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel47a
  - number: 47a.2
    text: |-
      Een door de verzekeraar voorgestelde pensioenuitkering is in overeenstemming met de wensen en behoeften van de
      betrokkene.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel47a
  - number: 47a.3
    text: De verzekeraar neemt op zorgvuldige wijze de gerechtvaardigde belangen van de betrokkene in acht.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel47a
  - number: 47a.4
    text: |-
      De Autoriteit Financiële Markten geeft met betrekking tot het derde lid slechts toepassing aan [artikel 171][ref1]
      bij evidente misstanden die het vertrouwen in de verzekeraar of in de financiële markten kunnen schaden.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel171
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '171'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 47b
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de
      informatieverstrekking door een verzekeraar over een overeenkomst inzake een pensioenuitkering en de
      dienstverlening.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel47b
  - number: 47c
    text: |-
      Indien een verzekeraar de betrokkene adviseert over een overeenkomst inzake een pensioenuitkering, licht de
      verzekeraar de overwegingen toe die ten grondslag liggen aan zijn advies voor zover dit nodig is voor een goed
      begrip van zijn advies.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel47c
  - number: '48.1'
    text: |-
      De informatie die de pensioenuitvoerder verstrekt of beschikbaar stelt is correct, duidelijk en evenwichtig. De
      informatie wordt tijdig verstrekt of beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel48
  - number: '48.2'
    text: |-
      De pensioenuitvoerder bevordert dat persoonlijke informatie aansluit bij de informatiebehoefte en kenmerken van de
      deelnemer, gewezen deelnemer, gewezen partner of pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel48
  - number: '48.3'
    text: |-
      De pensioenuitvoerder bevordert dat de informatie de deelnemer, gewezen deelnemer, gewezen partner of
      pensioengerechtigde inzicht geeft in de keuzemogelijkheden die er zijn in de pensioenregeling, de gevolgen van
      belangrijke gebeurtenissen voor het pensioen en de gevolgen van een keuze of combinatie van keuzes voor het
      pensioen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel48
  - number: '48.4'
    text: |-
      De pensioenuitvoerder bevordert dat de informatie de deelnemer, gewezen deelnemer, gewezen partner of
      pensioengerechtigde aanzet tot relevante actie.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel48
  - number: '48.5'
    text: |-
      De informatie, bedoeld in de [artikelen 38, eerste lid][ref1], [40, eerste lid][ref2], [42, eerste lid][ref3],
      en [44, eerste lid][ref4], wordt verstrekt door middel van een uniform pensioenoverzicht. In het uniform
      pensioenoverzicht wordt een verwijzing opgenomen naar de website van de pensioenuitvoerder, de website waarop het
      pensioenregister te raadplegen is en wordt gewezen op de mogelijkheden die [artikel 46][ref5] biedt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel44
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel46
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref5
        bwb_id: BWBR0020809
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '48.6'
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel48
  - number: 48a
    text: |-
      De pensioenuitvoerder begeleidt de deelnemer, gewezen deelnemer, gewezen partner of pensioengerechtigde op
      een adequate wijze bij het maken van een keuze binnen de pensioenovereenkomst, zorgt voor de inrichting van de
      keuzeomgeving en stelt de deelnemer, gewezen deelnemer, gewezen partner of pensioengerechtigde daarmee in staat om
      een passende keuze te maken.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel48a
  - number: 48b.1
    text: |-
      Een pensioenuitvoerder draagt zorg voor een adequate behandeling van klachten van deelnemers, gewezen deelnemers,
      andere aanspraakgerechtigden of pensioengerechtigden. Hiertoe beschikt de pensioenuitvoerder over een interne
      klachten- en geschillenprocedure.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel48b
  - number: 48b.2
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel48b
  - number: 48c.1
    text: |-
      Een pensioenuitvoerder is aangesloten bij een door Onze Minister aangewezen instantie tot beslechting van
      geschillen tussen deelnemers, gewezen deelnemers, andere aanspraakgerechtigden of pensioengerechtigden enerzijds
      en pensioenuitvoerders anderzijds, tenzij een dergelijke instantie er niet is. Van een besluit tot aanwijzing
      of intrekking van een aangewezen instantie wordt mededeling gedaan door plaatsing in de Staatscourant. De
      Implementatiewet buitengerechtelijke geschillenbeslechting consumenten is van overeenkomstige toepassing, met
      uitzondering van de [artikelen 13][ref1], [14][ref2], [15][ref3], [16][ref4], [17][ref5], [18][ref6], [19][ref7]
      en [20][ref8], met dien verstande dat voor «consument» telkens wordt gelezen: deelnemer, gewezen deelnemer, andere
      aanspraakgerechtigde of pensioengerechtigde en dat voor «ondernemer» telkens wordt gelezen: pensioenuitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel17
      [ref6]: https://wetten.overheid.nl/BWBR0020809#Artikel18
      [ref7]: https://wetten.overheid.nl/BWBR0020809#Artikel19
      [ref8]: https://wetten.overheid.nl/BWBR0020809#Artikel20
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel48c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref5
        bwb_id: BWBR0020809
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref6
        bwb_id: BWBR0020809
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref7
        bwb_id: BWBR0020809
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref8
        bwb_id: BWBR0020809
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 48c.2
    text: |-
      In aanvulling op de bij de Implementatiewet buitengerechtelijke geschillenbeslechting consumenten gestelde regels,
      worden bij algemene maatregel van bestuur nadere regels gesteld met betrekking tot de aan de geschilleninstantie te
      stellen eisen en de geschillenprocedure, alsmede regels met betrekking tot de door de geschilleninstantie aan Onze
      Minister te verstrekken informatie.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel48c
  - number: '49.1'
    text: |-
      De pensioenuitvoerder verstrekt de informatie elektronisch, schriftelijk of via een website, waarbij
      informatieverstrekking via een website wordt gecombineerd met persoonlijk attenderen als er nieuwe of gewijzigde
      informatie op de website staat.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel49
  - number: '49.2'
    text: |-
      Indien de deelnemer, gewezen deelnemer, gewezen partner of pensioengerechtigde niet heeft bepaald op welke
      wijze hij informatie wil ontvangen, verstrekt de pensioenuitvoerder de informatie schriftelijk, elektronisch
      of via een website. Bij verstrekking via een website wordt de deelnemer, gewezen deelnemer, gewezen partner of
      pensioengerechtigde persoonlijk geattendeerd op deze website en op de mogelijkheid te kiezen voor een andere
      wijze van informatieverstrekking. De pensioenuitvoerder meldt op de website dat informatie ook elektronisch of
      schriftelijk kan worden verstrekt en biedt op de website de mogelijkheid om de wijze van informatieverstrekking te
      regelen. Het persoonlijk attenderen gebeurt elektronisch, indien het email adres bij de pensioenuitvoerder bekend
      is, of schriftelijk.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel49
  - number: '49.3'
    text: Er wordt ten hoogste een maal per jaar gewisseld in de wijze waarop informatie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel49
  - number: '49.4'
    text: |-
      Indien de pensioenuitvoerder de deelnemer of de gewezen deelnemer elektronisch of via een website informatie
      verstrekt, is hij verplicht de elektronisch of via een website verstrekte informatie te bewaren tot één jaar na het
      overlijden van de pensioengerechtigde dan wel tot één jaar na het aflopen van de uitkering aan de nabestaanden. De
      deelnemer of de gewezen deelnemer kan ten hoogste eenmaal per jaar de elektronisch of via een website verstrekte
      informatie opvragen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel49
  - number: '49.5'
    text: |-
      De pensioenuitvoerder verstrekt de deelnemer, gewezen deelnemer, gewezen partner of pensioengerechtigde aan wie de
      informatie elektronisch of via een website wordt verstrekt, op verzoek een papieren afschrift van de informatie.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel49
  - number: '49.6'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel49
  - number: '50.1'
    text: |-
      De pensioenuitvoerder kan zich voor het schriftelijk verstrekken van de informatie, bedoeld in de
      [artikelen 38 tot en met 44][ref1], houden aan het laatst hem bekende adres van de deelnemer, gewezen deelnemer,
      pensioengerechtigde of gewezen partner.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel38
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '50.2'
    text: |-
      Indien dit adres onjuist blijkt te zijn, raadpleegt de pensioenuitvoerder de basisregistratie personen over het
      adres van de deelnemer, gewezen deelnemer, pensioengerechtigde of gewezen partner.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel50
  - number: '50.3'
    text: |-
      Indien de pensioenuitvoerder kosten maakt in verband met werkzaamheden die voortvloeien uit het feit dat de
      deelnemer, gewezen deelnemer, pensioengerechtigde of gewezen partner verzuimd heeft de pensioenuitvoerder omtrent
      een wijziging van adres te informeren, kan de pensioenuitvoerder deze kosten bij deze in rekening brengen, maar
      kunnen deze kosten niet direct in mindering worden gebracht op de uitkering.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel50
  - number: '50.4'
    text: |-
      Indien het bij de pensioenuitvoerder bekende adres voor de elektronische verstrekking van informatie onjuist
      blijkt, biedt de pensioenuitvoerder de mogelijkheid het juiste adres voor elektronische verstrekking van informatie
      op te geven.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel50
  - number: '51.1'
    text: |-
      Er is een pensioenregister, ingericht en in stand gehouden door de pensioenuitvoerders. Dit pensioenregister heeft
      de volgende doelen:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51
  - number: 51.1.a
    text: |-
      op duidelijke wijze de aanspraakgerechtigde of de pensioengerechtigde in de gelegenheid stellen gegevens
      over zijn pensioenaanspraken en pensioenrechten te raadplegen, waarbij deze gegevens, voor zover het
      ouderdomspensioen betreft, tevens weergegeven worden op basis van een pessimistisch scenario, een verwacht
      scenario en een optimistisch scenario, en waarbij onder pensioenaanspraken en pensioenrechten in de zin van
      dit artikel mede worden verstaan aanspraken op ouderdomspensioen en recht op ouderdomspensioen op grond van de
      [Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 51.1.b
    text: |-
      inzicht geven in de hoogte van het te bereiken pensioen, de keuzes ten aanzien van het pensioen, en de
      gevolgen van deze keuzes en van belangrijke gebeurtenissen op het pensioen van de aanspraakgerechtigde of de
      pensioengerechtigde; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51
  - number: 51.1.c
    text: een melding te geven indien er geen ouderdomspensioen wordt opgebouwd.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51
  - number: '51.2'
    text: 'Het pensioenregister heeft mede tot doel op verzoek:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51
  - number: 51.2.a
    text: |-
      de pensioenuitvoerder te informeren bij welke andere pensioenuitvoerder een gewezen deelnemer pensioenaanspraken
      opbouwt ten behoeve van de toepassing van [artikel 70a][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel70a
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 70a
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 51.2.b
    text: |-
      van de deelnemer, de gewezen deelnemer, gewezen partner of pensioengerechtigde de gegevens aan een door de
      deelnemer, de gewezen deelnemer, gewezen partner of pensioengerechtigde aan te wijzen pensioenuitvoerder te
      verstrekken ten behoeve van de toepassing van [artikel 48a][ref1], voor zover deze aangewezen uitvoerder daarmee
      heeft ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel48a
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 48a
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '51.3'
    text: |-
      De pensioenuitvoerder verstrekt op verzoek van de aanspraakgerechtigde of de pensioengerechtigde tijdig zijn
      gegevens met betrekking tot pensioenaanspraken en pensioenrechten door middel van het pensioenregister.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51
  - number: '51.4'
    text: |-
      De Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], verstrekt op verzoek
      van de aanspraakgerechtigde of de pensioengerechtigde tijdig zijn gegevens over verzekeringstijdvakken
      en daarop gebaseerde aanspraak op ouderdomspensioen en recht op ouderdomspensioen op grond van de
      [Algemene Ouderdomswet][ref2] door middel van het pensioenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0002221
  - number: '51.5'
    text: |-
      De gegevens die op grond van het derde en vierde lid worden verstrekt door middel van het pensioenregister worden
      in dat kader uitsluitend gebruikt voor het in het eerste en tweede lid omschreven doel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51
  - number: '51.6'
    text: |-
      Een door Onze Minister aan te wijzen instelling ontwikkelt en beheert het pensioenregister en draagt zorg voor
      de tijdige verwerking van de gegevens, bedoeld in het derde en vierde lid, en het goed functioneren van het
      pensioenregister.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51
  - number: '51.7'
    text: |-
      De instelling, bedoeld in het zesde lid, is verwerker in de zin van de Algemene verordening gegevensbescherming
      voor het verwerken van de gegevens die door de pensioenuitvoerders en de Sociale verzekeringsbank, genoemd
      in [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], door middel van het
      pensioenregister worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
  - number: '51.8'
    text: |-
      De instelling, bedoeld in het zesde lid, stelt in verband met haar rol als verwerker als bedoeld in het zevende
      lid een reglement vast waarin regels worden gesteld met betrekking tot het ontwikkelen en beheren van het
      pensioenregister. Dit reglement bevat in ieder geval regels over de gegevens die verstrekt worden, de wijze waarop
      deze gegevens verstrekt worden en de bekostiging en beveiliging van het pensioenregister.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51
  - number: '51.9'
    text: Het reglement alsmede elke wijziging daarvan behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51
  - number: '51.10'
    text: |-
      Hetgeen bij of krachtens [hoofdstuk 7][ref1] van toepassing is bij het toezicht op de uitvoering van dit artikel
      door pensioenuitvoerders is van overeenkomstige toepassing op de uitvoering van dit artikel door de instelling,
      bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0020809
        hoofdstuk: '7'
  - number: '51.11'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de gegevensverstrekking aan de aangewezen pensioenuitvoerder, de scenario’s, de actualisatie van de
      te verstrekken gegevens, het opnemen van gegevens met betrekking tot de keuzes ten aanzien van het pensioen en de
      gevolgen van deze keuzes en van belangrijke gebeurtenissen op het pensioen en de fasering van het opnemen van deze
      gegevens.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51
  - number: 51a.1
    text: |-
      De instelling, bedoeld in [artikel 51, zesde lid][ref1], stelt een gebruikersorgaan in samengesteld uit gebruikers
      van het pensioenregister. Het gebruikersorgaan overlegt met en adviseert het bestuur van de instelling over
      voorgenomen besluitvorming over opzet, bestaan en werking van het pensioenregister, waaronder in ieder geval wordt
      verstaan de functionaliteiten en ontwikkeling van het pensioenregister alsmede de wijze waarop het pensioenregister
      invulling geeft aan haar wettelijke taak.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel51
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '51'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 51a.2
    text: |-
      De instelling stelt een regeling vast voor samenstelling, werkwijze, taken en bevoegdheden van het
      gebruikersorgaan.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51a
  - number: 51a.3
    text: |-
      Het bestuur van de instelling en het gebruikersorgaan komen ten minste twee maal per kalenderjaar in vergadering
      bijeen. Tijdens deze vergaderingen worden de aangelegenheden aan de orde gesteld waarover het bestuur of het
      gebruikersorgaan overleg wenselijk acht.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51a
  - number: 51a.4
    text: |-
      De instelling verstrekt desgevraagd aan het gebruikersorgaan tijdig alle inlichtingen en gegevens die deze
      redelijkerwijs nodig heeft voor de vervulling van de taak.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51a
  - number: 51a.5
    text: De instelling deelt het gebruikersorgaan onderbouwd mee waarom het een advies niet of niet geheel volgt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel51a
  - number: '52.1'
    text: |-
      Bij de uitvoering van een flexibele premieovereenkomst met beleggingsvrijheid in de opbouwfase en een premie-
      uitkeringsovereenkomst voor zover de premie wordt belegd met beleggingsvrijheid in de opbouwfase is de
      pensioenuitvoerder verantwoordelijk voor de beleggingen en handelt daarbij overeenkomstig [artikel 135][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel135
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '135'
        hoofdstuk: '6'
  - number: '52.2'
    text: |-
      De pensioenuitvoerder biedt de deelnemer of gewezen deelnemer in een flexibele premieovereenkomst of in een
      premie-uitkeringsovereenkomst tot het moment dat het opgebouwde kapitaal of de beschikbaar gestelde premie geheel
      of gedeeltelijk wordt aangewend voor een aanspraak op een vastgestelde uitkering vanaf de pensioendatum, de
      mogelijkheid om de verantwoordelijkheid voor de beleggingen over te nemen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel52
  - number: '52.3'
    text: |-
      Indien de deelnemer of de gewezen deelnemer de verantwoordelijkheid voor de beleggingen heeft overgenomen,
      adviseert de pensioenuitvoerder de deelnemer of de gewezen deelnemer over de spreiding van de beleggingen in
      relatie tot de duur van de periode tot pensioendatum, waarbij het beleggingsrisico kleiner wordt naarmate de
      pensioendatum nadert.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel52
  - number: '52.4'
    text: |-
      De pensioenuitvoerder onderzoekt ten minste een keer per jaar of de beleggingen van de deelnemer of gewezen
      deelnemer zich binnen de op basis van het derde lid gestelde grenzen bevinden en informeert de deelnemer en de
      gewezen deelnemer hierover.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel52
  - number: '52.5'
    text: |-
      Bij de uitvoering, bedoeld in het eerste lid, handelt de pensioenuitvoerder in het belang van de deelnemer of
      gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel52
  - number: '52.6'
    text: |-
      Ten behoeve van het advies, bedoeld in het derde lid, wint de pensioenuitvoerder informatie in over de financiële
      positie, kennis, ervaring, doelstellingen en risicobereidheid van de deelnemer of gewezen deelnemer, voor zover
      dit redelijkerwijs relevant is voor het advies. Het advies wordt, voor zover redelijkerwijs mogelijk, mede op deze
      informatie gebaseerd.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel52
  - number: '52.7'
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels gesteld worden met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel52
  - number: 52a.1
    text: |-
      Bij de uitvoering van een premieovereenkomst in de opbouwfase, een premie-uitkeringsovereenkomst voor zover de
      premie wordt belegd of een variabele uitkering is de pensioenuitvoerder verantwoordelijk voor de beleggingen en
      voert een beleggingsbeleid overeenkomstig [artikel 135][ref1]. Bij de uitvoering van dit beleggingsbeleid wordt
      rekening gehouden met de risicohouding van de deelnemers, gewezen deelnemers of pensioengerechtigden.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel135
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '135'
        hoofdstuk: '6'
  - number: 52a.2
    text: |-
      Bij de uitvoering, bedoeld in het eerste lid, handelt de pensioenuitvoerder in het belang van de deelnemer, gewezen
      deelnemer of pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel52a
  - number: 52a.3
    text: |-
      Indien de pensioenuitvoerder bij uitvoering van een variabele uitkering verschillende beleggingsprofielen hanteert,
      wordt voor de pensioengerechtigde een beleggingsprofiel toegepast dat passend is gezien zijn risicoprofiel. De
      pensioenuitvoerder informeert de pensioengerechtigde over het vastgestelde risicoprofiel en het beleggingsprofiel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel52a
  - number: 52a.4
    text: |-
      De pensioenuitvoerder toetst periodiek het risicoprofiel van de pensioengerechtigde. Indien een wijziging in het
      risicoprofiel daartoe aanleiding geeft past de pensioenuitvoerder een ander, passend, beleggingsprofiel toe en
      informeert de pensioengerechtigde hierover.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel52a
  - number: 52a.5
    text: |-
      Ten behoeve van het risicoprofiel, bedoeld in het derde en vierde lid, wint de pensioenuitvoerder informatie in
      over de financiële positie, kennis, ervaring, doelstellingen en risicobereidheid van de pensioengerechtigde, voor
      zover dit redelijkerwijs relevant is voor het beleggingsprofiel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel52a
  - number: 52a.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de uitvoering van het beleggingsbeleid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel52a
  - number: 52b.1
    text: |-
      De pensioenuitvoerder, bedoeld in [artikel 52a][ref1], baseert zijn beleggingsbeleid en de toedelingsregels voor
      het beleggingsrisico op de risicohouding van de deelnemers, gewezen deelnemers of pensioengerechtigden. Bij het
      vaststellen van de risicohouding wordt in ieder geval onderscheid gemaakt naar leeftijdscohorten en wordt per
      leeftijdscohort een risicohouding vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel52a
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 52a
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 52b.2
    text: |-
      De risicohouding wordt door de pensioenuitvoerder vastgesteld en periodiek getoetst, waarbij gebruik wordt
      gemaakt van onderzoek naar de risicopreferentie van de deelnemers, gewezen deelnemers of pensioengerechtigden,
      wetenschappelijke inzichten en deelnemerskenmerken. De resultaten hiervan worden door een pensioenfonds beoordeeld
      na overleg met de andere organen van het pensioenfonds. De toetsing van de risicohouding vindt plaats ten minste
      eenmaal in vijf jaar en bij een ingrijpende wijziging.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel52b
  - number: 52b.3
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel52b
  - number: '53'
    text: |-
      De pensioenuitvoerder betaalt de uitkering uit hoofde van een pensioenrecht op verzoek van de pensioengerechtigde
      in een andere lidstaat van de Europese Unie dan de lidstaat waar die pensioenuitvoerder is gevestigd, waarbij
      transactiekosten op de uitkering uit hoofde van het pensioenrecht in mindering kunnen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel53
  - number: '54.1'
    text: |-
      Een pensioenuitvoerder kan voor de deelnemer die gewezen werknemer wordt een vrijwillige voortzetting van de
      pensioenregeling uitvoeren indien de vrijwillige voortzetting gedurende ten hoogste drie jaar vanaf de beëindiging
      van de dienstbetrekking voortduurt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel54
  - number: '54.2'
    text: |-
      In afwijking van het eerste lid geldt een termijn van tien jaar voor zover de genoemde gewezen werknemer,
      aansluitend aan de beëindiging van de dienstbetrekking, gedurende die periode winst uit onderneming geniet als
      bedoeld in [artikel 3.8 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '54.3'
    text: 'Van de in het eerste lid genoemde termijn kan worden afgeweken indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel54
  - number: 54.3.a
    text: |-
      de deelnemer ten tijde van de beëindiging van de dienstbetrekking arbeidsongeschikt is. De periode waarin sprake
      kan zijn van vrijwillige voortzetting is dan ten hoogste drie jaar of de duur van de arbeidsongeschiktheid indien
      deze langer is; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel54
  - number: 54.3.b
    text: |-
      de deelnemer na de beëindiging van de dienstbetrekking een periodieke uitkering ontvangt ter vervanging van
      in verband met de beëindiging van de dienstbetrekking gederfde inkomsten op grond van een tussen één of meer
      werkgevers en één of meer werknemers afgesproken regeling. De periode waarin sprake kan zijn van vrijwillige
      voortzetting is dan ten hoogste drie jaar of de periode waarin de uitkering wordt ontvangen indien deze langer is.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel54
  - number: '54.4'
    text: |-
      De deelnemer die vrijwillig wil voortzetten doet binnen negen maanden vanaf de beëindiging van de dienstbetrekking
      een verzoek daartoe bij de pensioenuitvoerder. De vrijwillige voortzetting begint uiterlijk vijftien maanden na
      beëindiging van de dienstbetrekking. [Artikel 14, tweede lid][ref1], is niet van toepassing op de periode vanaf de
      beëindiging van de dienstbetrekking tot het begin van de vrijwillige voortzetting.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel14
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '54.5'
    text: |-
      Voor zover de pensioenregeling daar in voorziet kan, in afwijking van het vierde lid, de gewezen werknemer, bedoeld
      in het tweede lid, die vrijwillig wil voortzetten een verzoek daartoe doen bij de pensioenuitvoerder uiterlijk
      binnen drie jaar vanaf de beëindiging van de dienstbetrekking. De vrijwillige voortzetting begint uiterlijk zes
      maanden na het verzoek daartoe. [Artikel 14, tweede lid][ref1], is niet van toepassing op de periode vanaf de
      beëindiging van de dienstbetrekking tot het begin van de vrijwillige voortzetting.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel14
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '55.1'
    text: |-
      Bij een solidaire premieovereenkomst of een flexibele premieovereenkomst wordt bij beëindiging van de deelneming
      het tot op dat moment ontstane voor pensioenuitkering bestemd vermogen of kapitaal voortvloeiend uit de
      tot de beëindiging beschikbaar gestelde premies belegd in overeenstemming met de afspraken hierover in de
      pensioenregeling.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel55
  - number: '55.2'
    text: |-
      Bij een premie-uitkeringsovereenkomst wordt bij beëindiging van de deelneming het tot op dat moment ontstane
      kapitaal voortvloeiend uit de tot de beëindiging beschikbaar gestelde premies belegd in overeenstemming met
      de afspraken hierover in de pensioenregeling. Indien de gewezen deelnemer voor beëindiging van de deelneming
      de premie of het uit de premie voortvloeiende kapitaal heeft aangewend voor aanspraak op een vastgestelde
      uitkering vanaf de pensioendatum behoudt de gewezen deelnemer deze pensioenaanspraak. Deze pensioenaanspraak
      dient volledig gefinancierd te zijn op het moment van beëindiging. In geval van premievrijmaking op grond van
      [artikel 29, vierde lid][ref1], wordt daarmee bij de vaststelling van de opgebouwde aanspraken rekening gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel29
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '55.3'
    text: |-
      Deelnemers en andere aanspraakgerechtigden die na beëindiging van de deelneming aan een pensioenregeling naar een
      andere lidstaat van de Europese Unie verhuizen behouden hun pensioenaanspraak in dezelfde mate als deelnemers en
      andere aanspraakgerechtigden die na beëindiging van de deelneming in Nederland blijven.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel55
  - number: '55.4'
    text: |-
      Indien de pensioenovereenkomst voorziet in een nabestaandenpensioen op risicobasis wordt de dekking uit hoofde van
      het nabestaandenpensioen voortgezet, waarbij voor de hoogte van de dekking wordt uitgegaan van de situatie op de
      dag voor beëindiging van de deelneming:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel55
  - number: 55.4.a
    text: |-
      gedurende de periode dat de gewezen deelnemer direct na beëindiging van de deelneming recht heeft op een uitkering
      op grond van de [Werkloosheidswet][ref1] of een werkloosheidsuitkering van zijn woonland en de uitkering ontvangt,
      waarbij voor de hoogte van de dekking rekening wordt gehouden met de omvang van de werkloosheid;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 55.4.b
    text: |-
      gedurende de periode dat de gewezen deelnemer direct aansluitend op de voortzetting van het nabestaandenpensioen op
      grond van onderdeel a recht heeft op een uitkering op grond van de [Ziektewet][ref1] en deze uitkering ontvangt;


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 55.4.c
    text: |-
      gedurende de periode dat de gewezen deelnemer direct aansluitend op de voortzetting van het nabestaandenpensioen
      op grond van onderdeel b recht heeft op een uitkering als bedoeld in onderdeel a en de uitkering ontvangt, waarbij
      voor de hoogte van de dekking rekening wordt gehouden met de omvang van de werkloosheid;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel55
  - number: 55.4.d
    text: |-
      gedurende de periode dat de gewezen deelnemer direct na de beëindiging van de deelneming recht heeft op een
      uitkering op grond van de [Ziektewet][ref1] en de uitkering ontvangt; of


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 55.4.e
    text: |-
      gedurende de periode dat de gewezen deelnemer direct aansluitend op de voortzetting van het nabestaandenpensioen op
      grond van onderdeel d recht heeft op een uitkering als bedoeld in onderdeel a en deze uitkering ontvangt, waarbij
      voor de hoogte van de dekking rekening wordt gehouden met de omvang van de werkloosheid; dan wel
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel55
  - number: 55.4.f
    text: |-
      gedurende een periode van drie maanden, tenzij in de pensioenovereenkomst een periode van zes maanden is opgenomen,
      rechtstreeks na beëindiging van de deelneming indien er geen sprake is van een aansluitend dienstverband of een
      uitkering als bedoeld in onderdeel a, b, c, d of e doch uiterlijk tot het moment dat sprake is van een nieuw
      dienstverband dan wel de ingangsdatum van het ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel55
  - number: '55.5'
    text: |-
      In afwijking van het eerste en tweede lid en [artikel 134][ref1] vervallen de pensioenaanspraken van een deelnemer
      bij beëindiging van de deelneming, indien op basis van de tot het tijdstip van beëindiging opgebouwde aanspraak
      op ouderdomspensioen de uitkering van het ouderdomspensioen op jaarbasis op de reguliere ingangsdatum niet meer
      zal bedragen dan € 2,– per jaar. De eerste zin is niet van toepassing indien de deelnemer verhuist naar een andere
      lidstaat en hij de pensioenuitvoerder daarover bij beëindiging van de deelneming heeft geïnformeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '134'
        hoofdstuk: '6'
  - number: '55.6'
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel55
  - number: '56'
    text: |-
      Indien de pensioenovereenkomst voorziet in een partnerpensioen is het opnemen van onbetaald verlof tot een
      maximum van 18 maanden door de deelnemer tijdens de deelneming niet van invloed op de dekking uit hoofde van het
      partnerpensioen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel56
  - number: '57.1'
    text: |-
      Indien de partnerrelatie van een deelnemer eindigt door scheiding verkrijgt de gewezen partner van de deelnemer
      een zodanige aanspraak op partnerpensioen als de deelnemer ten behoeve van die gewezen partner zou hebben behouden
      indien op het tijdstip van scheiding zijn deelneming zou zijn geëindigd.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel57
  - number: '57.2'
    text: |-
      Indien de partnerrelatie van een gewezen deelnemer eindigt door scheiding, en de gewezen deelnemer ten behoeve van
      die partner een aanspraak op partnerpensioen heeft behouden bij beëindigen van de deelneming, gaat de aanspraak
      over op de gewezen partner van de gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel57
  - number: '57.3'
    text: |-
      Indien de partnerrelatie van een gepensioneerde eindigt door scheiding, en de gepensioneerde ten behoeve van
      die partner een aanspraak op partnerpensioen heeft behouden bij het ingaan van het ouderdomspensioen, gaat die
      aanspraak over op de gewezen partner van de gepensioneerde.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel57
  - number: '57.4'
    text: |-
      Het eerste, tweede en derde lid vindt geen toepassing indien de partners bij voorwaarden in verband met de
      partnerrelatie of een schriftelijk gesloten overeenkomst met betrekking tot de scheiding anders overeenkomen. Deze
      voorwaarden of overeenkomst zijn respectievelijk is slechts geldig indien de pensioenuitvoerder zich bereid heeft
      verklaard hiermee in te stemmen en bereid is een uit de afwijking voortvloeiend risico te dekken dan wel het niveau
      van de uitkering aan te passen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel57
  - number: '57.5'
    text: |-
      Een gewezen partner met een recht op bijzonder partnerpensioen als bedoeld in het eerste, tweede of derde lid,
      heeft het recht dit te vervreemden aan een eerdere of latere partner van de overleden deelnemer, gewezen deelnemer
      of gepensioneerde, mits:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel57
  - number: 57.5.a
    text: de pensioenuitvoerder bereid is een eventueel uit die overdracht voortvloeiende wijziging van het risico te dekken;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel57
  - number: 57.5.b
    text: de vervreemding onherroepelijk is; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel57
  - number: 57.5.c
    text: dit wordt overeengekomen bij notarieel verleden akte.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel57
  - number: '57.6'
    text: |-
      Indien na toepassing van het eerste of tweede lid de gewezen partner overlijdt voordat de deelnemer of gewezen
      deelnemer overlijdt, maakt de aanspraak op het partnerpensioen vanaf het moment van overlijden van de gewezen
      partner weer deel uit van de pensioenaanspraken van de deelnemer of gewezen deelnemer, bedoeld in het eerste en
      tweede lid, voor zover dit in de betrokken pensioenregeling is bepaald.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel57
  - number: '58.1'
    text: |-
      Indien een ouderdomspensioenrecht van een gepensioneerde die geen gewezen deelnemer is geweest wordt verhoogd
      door middel van een toeslag, wordt het ouderdomspensioenrecht van een gepensioneerde die wel gewezen deelnemer is
      geweest in dezelfde mate verhoogd indien zij in dezelfde pensioenregeling hebben deelgenomen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel58
  - number: '58.2'
    text: |-
      Indien een recht op partnerpensioen van de partner van een overleden gepensioneerde die geen gewezen deelnemer is
      geweest wordt verhoogd door middel van een toeslag, worden de partnerpensioenrechten:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel58
  - number: 58.2.a
    text: ten behoeve van de partners van overleden gepensioneerden die gewezen deelnemer zijn geweest;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel58
  - number: 58.2.b
    text: ten behoeve van de partners van overleden gewezen deelnemers;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel58
  - number: 58.2.c
    text: ten behoeve van de partners van overleden deelnemers; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel58
  - number: 58.2.d
    text: van de gewezen partners met een bijzonder partnerpensioen;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel58
  - number: '58.3'
    text: |-
      Indien een ouderdomspensioenrecht wordt verhoogd door middel van een toeslag, wordt de aanspraak op
      ouderdomspensioen van een gewezen deelnemer die in dezelfde pensioenregeling heeft deelgenomen in dezelfde mate
      verhoogd.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel58
  - number: '58.4'
    text: |-
      Indien een aanspraak op partnerpensioen van een gepensioneerde die geen gewezen deelnemer is geweest wordt verhoogd
      door middel van een toeslag, worden de partnerpensioenaanspraken:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel58
  - number: 58.4.a
    text: ten behoeve van de partner van een gepensioneerde die wel gewezen deelnemer is geweest;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel58
  - number: 58.4.b
    text: ten behoeve van de partner van een gewezen deelnemer; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel58
  - number: 58.4.c
    text: van de gewezen partner van de gewezen deelnemer met een bijzonder partnerpensioen;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel58
  - number: '58.5'
    text: Bij de verlening van toeslagen op partnerpensioen wordt geen onderscheid gemaakt tussen partners.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel58
  - number: '59'
    text: |-
      Een rechtsvordering tegen een pensioenuitvoerder tot het doen van een uitkering verjaart niet bij leven van de
      pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel59
  - number: '60.1'
    text: |-
      Indien een pensioenregeling op basis van een pensioenovereenkomst voorziet in de opbouw van een ouderdomspensioen
      en een partnerpensioen, biedt de pensioenregeling aan de deelnemer of gewezen deelnemer met betrekking tot perioden
      van opbouw vanaf 1 januari 2002, ongeacht zijn burgerlijke staat, het recht in elk geval met ingang van de datum
      waarop het ouderdomspensioen ingaat of kan ingaan, in plaats van partnerpensioen te kiezen voor één van de volgende
      wijzigingen van het ouderdomspensioen:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel60
  - number: 60.1.a
    text: een hoger ouderdomspensioen;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel60
  - number: 60.1.b
    text: een eerder ingaand ouderdomspensioen; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel60
  - number: 60.1.c
    text: een hoger en een eerder ingaand ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel60
  - number: '60.2'
    text: Het eerste lid is niet van toepassing op de aanspraak op bijzonder partnerpensioen van de gewezen partner.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel60
  - number: '60.3'
    text: |-
      Indien er in de pensioenovereenkomst geen recht op de keuzemogelijkheid als bedoeld in het eerste lid is opgenomen
      heeft de deelnemer of gewezen deelnemer het recht om te kiezen voor één van deze mogelijkheden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel60
  - number: '60.4'
    text: |-
      De pensioenuitvoerder waarborgt dat bij gebruikmaking van het keuzerecht geen onderscheid gemaakt wordt tussen
      mannen en vrouwen door vaststelling van een ruilvoet of opbouwkeuzevoet.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel60
  - number: '60.5'
    text: |-
      De pensioenuitvoerder waarborgt bij de vaststelling van een ruilvoet of opbouwkeuzevoet dat voldaan wordt aan het
      vereiste van collectieve actuariële gelijkwaardigheid hetgeen inhoudt dat de collectieve actuariële waarde van
      het ouderdomspensioen, bedoeld in het eerste lid, dat wordt gekozen in plaats van het partnerpensioen, bedoeld in
      het eerste lid, ongeacht de datum waarop de keuze wordt gemaakt, ten minste gelijkwaardig is aan de op dezelfde
      grondslagen berekende collectieve actuariële waarde van dat partnerpensioen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel60
  - number: '60.6'
    text: |-
      Bij de keuze, bedoeld in het eerste of derde lid, is de toestemming vereist van de partner die begunstigde is voor
      het in het eerste lid bedoelde partnerpensioen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel60
  - number: '60.7'
    text: |-
      Voorzover het bij de toepassing van het eerste lid pensioenaanspraken betreft die als gevolg van een premievrije
      voortzetting van die pensioenaanspraken worden opgebouwd, is het eerste lid van toepassing indien het recht op die
      premievrije voortzetting is ontstaan op of na 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel60
  - number: '60.8'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel60
  - number: '60.9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het eerste tot en met het
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel60
  - number: '61.1'
    text: |-
      Indien een pensioenovereenkomst voorziet in een ouderdomspensioen heeft de deelnemer of gewezen deelnemer met
      ingang van de datum waarop het ouderdomspensioen ingaat of kan ingaan het recht om in plaats van een deel van
      het ouderdomspensioen te kiezen voor partnerpensioen op opbouwbasis, onder de voorwaarde dat de hoogte van het
      partnerpensioen maximaal 70% bedraagt van het ouderdomspensioen dat na de uitruil resteert.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel61
  - number: '61.2'
    text: |-
      De pensioenuitvoerder biedt de deelnemer of gewezen deelnemer in het laatste jaar voor ingang van het
      ouderdomspensioen standaard de mogelijkheid, genoemd in het eerste lid, aan.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel61
  - number: '61.3'
    text: |-
      De pensioenuitvoerder waarborgt dat bij gebruikmaking van het keuzerecht geen onderscheid gemaakt wordt tussen
      mannen en vrouwen door vaststelling van een ruilvoet of opbouwkeuzevoet.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel61
  - number: '61.4'
    text: |-
      De pensioenuitvoerder waarborgt bij de vaststelling van een ruilvoet of opbouwkeuzevoet dat voldaan wordt aan het
      vereiste van collectieve actuariële gelijkwaardigheid hetgeen inhoudt dat de collectieve actuariële waarde van
      het partnerpensioen, bedoeld in het eerste lid, dat wordt gekozen in plaats van het ouderdomspensioen, bedoeld in
      het eerste lid, ongeacht de datum waarop de keuze wordt gemaakt, ten minste gelijkwaardig is aan de op dezelfde
      grondslagen berekende collectieve actuariële waarde van dat ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel61
  - number: '61.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de inhoud van
      de keuzemogelijkheid, de wijze waarop de keuzemogelijkheid wordt geboden en de collectieve actuariële
      gelijkwaardigheid, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel61
  - number: '61.6'
    text: |-
      De in het eerste lid omschreven mogelijkheid heeft geen betrekking op het deel van een ouderdomspensioen waarop een
      recht op uitbetaling rust als bedoeld in [artikel 2 van de Wet verevening pensioenrechten bij scheiding][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel2
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0006641
        artikel: '2'
  - number: '61.7'
    text: |-
      Indien de deelnemer of gewezen deelnemer niet binnen de door de pensioenuitvoerder gestelde termijn reageert op de
      keuzemogelijkheid die hem ingevolge het tweede lid in het laatste jaar voor de ingang van het ouderdomspensioen is
      aangeboden, gaat de pensioenuitvoerder over tot het uitruilen van het ouderdomspensioen in partnerpensioen indien:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel61
  - number: 61.7.a
    text: |-
      de pensioenovereenkomst niet voorziet in een aanspraak op partnerpensioen vanaf de datum waarop het
      ouderdomspensioen ingaat; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel61
  - number: 61.7.b
    text: de deelnemer of gewezen deelnemer gehuwd is of een geregistreerde partnerrelatie heeft.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel61
  - number: '61.8'
    text: |-
      In de pensioenregeling wordt bepaald wat de verhouding is tussen ouderdomspensioen en partnerpensioen na uitruil
      als bedoeld in het zevende lid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel61
  - number: '61.9'
    text: |-
      Indien de uitruil, bedoeld in het zevende lid, ertoe zou leiden dat het ouderdomspensioen op jaarbasis lager wordt
      dan het op grond van [artikel 66][ref1] bepaalde bedrag wordt de in het achtste lid bedoelde verhouding tussen
      ouderdomspensioen en partnerpensioen zodanig aangepast dat het ouderdomspensioen op jaarbasis meer bedraagt dan het
      op grond van [artikel 66][ref2] bepaalde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 61a.1
    text: |-
      Indien een pensioenovereenkomst voorziet in een ouderdomspensioen en een partnerpensioen op risicobasis heeft
      de gewezen deelnemer na afloop van de periode waarin het nabestaandenpensioen op risicobasis op grond van
      [artikel 55, vierde lid][ref1], wordt voortgezet recht om in plaats van ouderdomspensioen of een deel van het
      ouderdomspensioen te kiezen voor het voortzetten van het partnerpensioen op risicobasis.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel55
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 61a.2
    text: 'In afwijking van het eerste lid is er geen recht op uitruil:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel61a
  - number: 61a.2.a
    text: |-
      indien de uitruil ertoe zou leiden dat op basis van de opgebouwde aanspraak op ouderdomspensioen de uitkering
      van het ouderdomspensioen op jaarbasis op de reguliere ingangsdatum minder zou bedragen dan het op basis van
      [artikel 66][ref1] bepaalde bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 61a.2.b
    text: |-
      indien de pensioenregeling voorziet in een maximale duur voor de vrijwillige voortzetting die langer of gelijk is
      aan vijftien jaar, bij het bereiken van de maximale duur; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel61a
  - number: 61a.2.c
    text: |-
      voor zover de pensioenregeling voorziet in een maximum voor de omvang van de uitruil bij het bereiken van dat
      maximum.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel61a
  - number: 61a.3
    text: |-
      Indien de gewezen deelnemer gebruik maakt van de keuzemogelijkheid, bedoeld in het eerste lid, informeert de
      pensioenuitvoerder de gewezen deelnemer jaarlijks over de gevolgen van voortzetting van de uitruil. De uitruil
      wordt stopgezet indien er niet langer recht op uitruil op grond van het tweede lid is, dan wel indien de gewezen
      deelnemer aangeeft de uitruil niet te willen voortzetten.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel61a
  - number: 61a.4
    text: |-
      [Artikel 61, derde, vierde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel61
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 61a.5
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel61a
  - number: '62.1'
    text: 'Indien de pensioenovereenkomst de deelnemer of gewezen deelnemer de mogelijkheid biedt:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel62
  - number: 62.1.a
    text: |-
      in plaats van een bepaald soort pensioen geheel of gedeeltelijk te kiezen voor een ander soort pensioen, dan het
      pensioen, bedoeld in de [artikelen 60][ref1], [61][ref2] en [61a][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel61a
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '60'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: 61a
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 62.1.b
    text: de ingangsdatum van het ouderdomspensioen te vervroegen of uit te stellen;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel62
  - number: 62.1.c
    text: |-
      de hoogte van het ouderdomspensioen te laten variëren als bedoeld in [artikel 63][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel63
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '63'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 62.1.d
    text: tot een keuze anders dan bedoeld in de voorgaande onderdelen;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel62
  - number: '62.2'
    text: |-
      Bij gebruikmaking van een in het eerste lid bedoelde keuzemogelijkheid is de toestemming vereist van de partner
      die begunstigde is voor partnerpensioen indien de hoogte daarvan door gebruikmaking van de keuzemogelijkheid wordt
      verlaagd.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel62
  - number: '62.3'
    text: |-
      Voorzover het bij de toepassing van het eerste lid pensioenaanspraken betreft die als gevolg van een premievrije
      voortzetting van die aanspraken worden opgebouwd, is het eerste lid van toepassing indien het recht op die
      premievrije voortzetting is ontstaan op of na 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel62
  - number: '62.4'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel62
  - number: '63.1'
    text: 'De hoogte van een pensioen kan na ingang variëren mits:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63
  - number: 63.1.a
    text: de laagste uitkering niet minder bedraagt dan 75% van de hoogste uitkering; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63
  - number: 63.1.b
    text: de mate van variatie uiterlijk op de ingangsdatum van het pensioen wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63
  - number: '63.2'
    text: |-
      Voor de toepassing van het eerste lid blijft in de periode tussen de ingangsdatum van het pensioen en het bereiken
      van de pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1],
      van de uitkering buiten aanmerking het gedeelte dat overeenkomt met het bedrag bedoeld in
      [artikel 18d, derde lid, van de Wet op de loonbelasting 1964][ref2]. Ingeval de pensioengerechtigde leeftijd,
      bedoeld in artikel 7a, eerste lid, van de Algemene Ouderdomswet, na de ingangsdatum van het pensioen wordt
      verlaagd, wordt voor de toepassing van de eerste zin uitgegaan van de pensioengerechtigde leeftijd, bedoeld in
      artikel 7a, eerste lid, van de Algemene Ouderdomswet, die van toepassing was voor deze verlaging.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18d
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18d
  - number: '63.3'
    text: |-
      In afwijking in zoverre van het eerste lid, onderdeel b, wordt bij een aanpassing van de pensioengerechtigde
      leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], na de ingang van het pensioen,
      de mate van variatie uiterlijk vastgesteld bij het bereiken van de hoogste pensioengerechtigde leeftijd, bedoeld in
      artikel 7a, eerste lid, van de Algemene Ouderdomswet, die op enig moment na de ingangsdatum van het pensioen geldt
      of heeft gegolden voor de pensioengerechtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '63.4'
    text: |-
      Voor de toepassing van het eerste lid wordt bij variabele uitkeringen de mate van variatie vastgesteld uitgaande
      van de rendementsverwachtingen op de ingangsdatum van het pensioen. Bij variabele uitkeringen blijven aanpassingen
      buiten aanmerking voor zover deze het gevolg zijn van de omstandigheid dat de opgetreden ontwikkeling van
      de levensverwachting, de behaalde sterfteresultaten of de behaalde beleggingsresultaten tot hogere of lagere
      uitkeringen leiden dan op de ingangsdatum van het pensioen het uitgangspunt was of sprake is van een periodieke
      vaste daling of vaste stijging van de uitkering of toepassing van een projectierendement hoger of lager dan de
      risicovrije rente als bedoeld in [artikel 63a, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel63a
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 63a
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '63.5'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63
  - number: 63a.1
    text: |-
      Onverminderd [artikel 63][ref1] kan de hoogte van een variabele uitkering na de ingangsdatum van het pensioen
      variëren door de verwerking van financiële mee- of tegenvallers als gevolg van het beleggingsrisico, de
      ontwikkeling van het sterfteresultaat of de ontwikkeling van de levensverwachting.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel63
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '63'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 63a.2
    text: |-
      De hoogte van een variabele uitkering in een flexibele premieovereenkomst of een premie-uitkeringsovereenkomst kan
      ook variëren door een, uiterlijk op de ingangsdatum van het pensioen vastgestelde, periodieke vaste daling of vaste
      stijging van de uitkering. De periodieke vaste daling bedraagt ten hoogste 35% van het verschil tussen de parameter
      voor aandelenrendement en de risicovrije rente op de ingangsdatum van het pensioen en is niet hoger dan consistent
      met het beleggingsbeleid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63a
  - number: 63a.3
    text: |-
      De hoogte van een variabele uitkering in een solidaire premieovereenkomst kan ook variëren door inrekenen van
      een projectierendement op het voor pensioen bestemde vermogen dat hoger of lager is dan de risicovrije rente. Het
      toepassen van het projectierendement wordt per regeling, uiterlijk op de ingangsdatum van het pensioen, vastgesteld
      en is van toepassing op alle pensioengerechtigden. Voor het projectierendement mag ten hoogste worden uitgegaan
      van een risicopremie die 35% bedraagt van het verschil tussen de parameter voor aandelenrendement en de risicovrije
      rente op de ingangsdatum van het pensioen. Het projectierendement is daarbij niet hoger dan consistent met het
      beleggingsbeleid en de toedelingsregels voor pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63a
  - number: 63a.4
    text: |-
      De periodieke vaste daling of het projectierendement is zodanig vormgegeven dat er op voorhand geen
      herverdelingseffecten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63a
  - number: 63a.5
    text: |-
      Bij toepassing van een collectief toedelingsmechanisme wordt ten minste een maal per jaar op het niveau van de
      toedelingskring het financiële resultaat vastgesteld en verwerkt. Bij een collectief toedelingsmechanisme kan een
      spreidingsperiode worden gehanteerd van maximaal tien jaar. Gedurende de spreidingsperiode worden uitsluitend de
      uitkeringen en aanspraken van de bij aanvang van de spreidingsperiode tot de toedelingskring behorende personen in
      gelijke stappen aangepast. Bij de vaststelling van de hoogte van de jaarlijkse aanpassing wordt rekening gehouden
      met de verwachte resterende levensverwachting van de toedelingskring.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63a
  - number: 63a.6
    text: |-
      Bij toepassing van een collectief toedelingsmechanisme voor het beleggingsrisico wordt de projectierente gebaseerd
      op de risicovrije rente.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63a
  - number: 63a.7
    text: |-
      Bij verwerking van financiële mee- of tegenvallers door middel van individuele toedeling in de flexibele
      premieovereenkomst of de premie-uitkeringsovereenkomst wordt de projectierente gebaseerd op de risicovrije rente.
      Bij individuele toedeling wordt ten minste een maal per jaar het financiële resultaat vastgesteld en verwerkt,
      waarbij een spreidingsperiode van maximaal tien jaar kan worden gehanteerd. Bij de vaststelling van de omvang van
      de periodieke aanpassing van de uitkeringshoogte gedurende de spreidingsperiode wordt rekening gehouden met de
      verwachte resterende levensverwachting van de pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63a
  - number: 63a.8
    text: |-
      Bij toepassing van toedelingsregels in de solidaire premieovereenkomst wordt het financiële resultaat ten minste
      een maal per jaar vastgesteld en verwerkt, waarbij een spreidingsperiode kan worden gehanteerd van maximaal tien
      jaar in het voor de pensioenuitkering bestemd vermogen. Bij de verwerking van het financiële resultaat kunnen het
      projectierendement of de toedeling van rendementen worden aangepast voor zover dat nodig is om gelijke aanpassingen
      van de pensioenuitkeringen te realiseren.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63a
  - number: 63a.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over dit artikel over onder meer de
      vaste daling en het projectierendement.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63a
  - number: 63b.1
    text: |-
      Bij een flexibele premieovereenkomst of een premie-uitkeringsovereenkomst die voorziet in uitkering van een aan
      te wenden kapitaal op de pensioendatum, legt de pensioenuitvoerder de deelnemer of gewezen deelnemer in elk geval
      voorafgaand aan de datum waarop het ouderdomspensioen ingaat of kan ingaan de keuze voor tussen een vastgestelde
      uitkering of een variabele uitkering.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63b
  - number: 63b.2
    text: |-
      Bij het bieden van de keuze verstrekt de pensioenuitvoerder de deelnemer of gewezen deelnemer de voor hem relevante
      informatie over de gevolgen en risico’s bij deze keuze waaronder een opgave van de hoogte van de vastgestelde
      uitkeringen en een opgave van de hoogte van de variabele uitkeringen. Deze opgaven worden tevens weergegeven op
      basis van een pessimistisch scenario, een verwacht scenario en een optimistisch scenario.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63b
  - number: 63b.3
    text: |-
      Een pensioenuitvoerder die niet zowel vastgestelde als variabele uitkeringen uitvoert meldt dit aan de deelnemer
      of gewezen deelnemer. De pensioenuitvoerder verstrekt de in het tweede lid bedoelde informatie voor de uitkering
      die hij uitvoert en wijst de deelnemer of gewezen deelnemer op de mogelijkheden tot waardeoverdracht, bedoeld in de
      [artikelen 80][ref1], [81][ref2], en [81a, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel81a
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '80'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '81'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: 81a
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 63b.4
    text: |-
      Indien de deelnemer of gewezen deelnemer niet binnen de door de pensioenuitvoerder gestelde termijn reageert op
      de keuzemogelijkheid die hem ingevolge het eerste lid is geboden, gaat de pensioenuitvoerder die vastgestelde
      uitkeringen uitvoert op de ingangsdatum van het pensioen over tot verstrekking van een vastgestelde uitkering.
      In afwijking van de eerste zin kunnen de partijen die betrokken zijn bij de vaststelling, wijziging of intrekking
      van de pensioenovereenkomst overeenkomen dat de pensioenuitvoerder op de ingangsdatum van het pensioen overgaat
      tot verstrekking van een variabele uitkering aan een deelnemer of gewezen deelnemer die niet binnen de door de
      pensioenuitvoerder gestelde termijn reageert op de keuzemogelijkheid die hem ingevolge het eerste lid is geboden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63b
  - number: 63b.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de te verstrekken informatie, de rekenregels en de wijze waarop de informatie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63b
  - number: 63c
    text: |-
      De toezichthouder kan een pensioenuitvoerder die een variabele uitkering uitvoert de verplichting opleggen om
      binnen een door de toezichthouder te stellen termijn over te gaan tot verzekering bij een verzekeraar, overdracht
      aan een verzekeraar of onderbrenging bij een pensioenfonds indien dit naar het oordeel van de toezichthouder
      noodzakelijk is in verband met de actuariële en bedrijfstechnische risico’s met betrekking tot deze variabele
      uitkering.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel63c
  - number: '64.1'
    text: |-
      Vervreemding of elke andere handeling, waardoor de aanspraakgerechtigde of de pensioengerechtigde enig recht op
      zijn pensioenaanspraken of pensioenrechten aan een ander toekent is nietig, tenzij:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel64
  - number: 64.1.a
    text: |-
      verpanding plaatsvindt voor het verlenen van zekerheid voor het verkrijgen van uitstel van betaling als bedoeld in
      [artikel 25, vijfde lid, van de Invorderingswet 1990][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 64.1.b
    text: |-
      vervreemding plaatsvindt op grond van [artikel 57, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel57
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 64.1.c
    text: |-
      verevening plaatsvindt op basis van de [Wet verevening pensioenrechten][ref1] bij scheiding;


      [ref1]: https://wetten.overheid.nl/BWBR0006641
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0006641
  - number: 64.1.d
    text: |-
      in het kader van een verrekening van pensioenrechten bij scheiding in plaats van de aanspraakgerechtigde of de
      pensioengerechtigde diens gewezen partner respectievelijk diens partner wordt aangewezen als begunstigde voor het
      geheel of een deel van het ouderdomspensioen, mits de pensioenuitvoerder hiermee instemt; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel64
  - number: 64.1.e
    text: |-
      in het kader van een verrekening van pensioenrechten bij scheiding de waarde van het geheel of een deel van het
      ouderdomspensioen van de aanspraakgerechtigde of de pensioengerechtigde bij dezelfde pensioenuitvoerder wordt
      aangewend voor een ouderdomspensioen op het leven van diens gewezen partner respectievelijk diens partner, mits de
      pensioenuitvoerder hiermee instemt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel64
  - number: '64.2'
    text: |-
      Een volmacht tot invordering van uitkeringen uit hoofde van een pensioenrecht, onder welke vorm of welke benaming
      ook verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel64
  - number: '65.1'
    text: |-
      Afkoop is slechts mogelijk in bij of krachtens de [artikelen 66 tot en met 69][ref1] bedoelde situaties.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '65.2'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel65
  - number: '66.1'
    text: |-
      De pensioenuitvoerder heeft het recht om bij de ingang van het ouderdomspensioen een aanspraak op ouderdomspensioen
      en andere aanspraken ten behoeve van de gepensioneerde of zijn nabestaanden af te kopen, indien:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel66
  - number: 66.1.a
    text: de uitkering van het ouderdomspensioen op de ingangsdatum minder bedraagt dan € 592,51 per jaar; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel66
  - number: 66.1.b
    text: |-
      de gepensioneerde geen bezwaar maakt tegen de afkoop indien de deelneming is geëindigd voor 1 januari 2007 of de
      gepensioneerde instemt met de afkoop indien de deelneming is geëindigd vanaf 1 januari 2007.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel66
  - number: '66.2'
    text: 'De pensioenuitvoerder heeft het recht om pensioenaanspraken van een gewezen deelnemer af te kopen, indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel66
  - number: 66.2.a
    text: |-
      op basis van de tot het tijdstip van beëindiging van de deelneming opgebouwde aanspraak op ouderdomspensioen de
      uitkering van het ouderdomspensioen op jaarbasis op de reguliere ingangsdatum, getoetst per 1 januari van dat jaar,
      minder zal bedragen dan het in het eerste lid, onderdeel a, genoemde bedrag;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel66
  - number: 66.2.b
    text: |-
      de gewezen deelnemer geen bezwaar maakt tegen de afkoop indien de deelneming is geëindigd voor 1 januari 2007 of de
      gewezen deelnemer instemt met de afkoop indien de deelneming is geëindigd vanaf 1 januari 2007; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel66
  - number: 66.2.c
    text: |-
      in geval de deelneming is geëindigd vanaf 1 januari 2018, de pensioenuitvoerder na beëindiging van de deelneming
      ten minste vijf maal tevergeefs heeft gepoogd de overdrachtswaarde van de pensioenaanspraken van een gewezen
      deelnemer over te dragen als bedoeld in [artikel 70a][ref1] en na de beëindiging van de deelneming of, indien
      de deelneming is geëindigd tussen 1 januari 2018 en 1 januari 2019, na 1 januari 2019, ten minste vijf jaar is
      verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel70a
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 70a
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '66.3'
    text: 'Onverminderd het eerste en tweede lid, heeft de pensioenuitvoerder het recht tot afkoop indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel66
  - number: 66.3.a
    text: er sprake is van beëindiging van de verwerving van pensioenaanspraken bij de pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel66
  - number: 66.3.b
    text: |-
      wordt voldaan aan het eerste of tweede lid, met dien verstande dat in plaats van beëindiging van de deelneming
      wordt gelezen beëindiging van de verwerving; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel66
  - number: 66.3.c
    text: |-
      geen sprake is van een pensioenaanspraak bij een verzekeraar in de vorm van een vastgestelde uitkering vanaf de
      pensioendatum.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel66
  - number: '66.4'
    text: |-
      De pensioenuitvoerder die gebruik wil maken van het in het eerste lid bedoelde recht informeert de gepensioneerde
      over zijn besluit hierover voor de ingang van het pensioen en gaat over tot uitbetaling van de afkoopwaarde binnen
      zes maanden na de ingang van het pensioen. Dit lid is van overeenkomstige toepassing bij afkoop bij ingang van het
      ouderdomspensioen op grond van het derde lid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel66
  - number: '66.5'
    text: |-
      De pensioenuitvoerder stelt de afkoopwaarde ter beschikking aan de gepensioneerde dan wel de gewezen deelnemer,
      met uitzondering van de afkoopwaarde van een bijzonder partnerpensioen, die ter beschikking wordt gesteld aan de
      gewezen partner.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel66
  - number: '66.6'
    text: |-
      De pensioenuitvoerder betaalt de uitkering op de dag dat de aanspraken of rechten vervallen in verband met de
      afkoop.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel66
  - number: '66.7'
    text: |-
      Het in het eerste lid, onderdeel a, genoemde bedrag wordt telkens gewijzigd met ingang van 1 januari op basis
      van de consumentenprijsindex Alle Huishoudens, zoals berekend door het Centraal Bureau voor de Statistiek. De
      wijziging wordt bepaald door de procentuele wijziging die dat indexcijfer over de maand oktober, voorafgaand aan
      de aanpassing, heeft ondergaan ten opzichte van de maand oktober van het daaraan voorafgaande jaar. Het gewijzigde
      bedrag wordt door of namens Onze Minister meegedeeld in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel66
  - number: '66.8'
    text: |-
      De pensioenuitvoerder waarborgt bij de vaststelling van de afkoopwaarde door vaststelling van een afkoopvoet dat
      geen onderscheid gemaakt wordt tussen mannen en vrouwen waarbij voldaan wordt aan het vereiste van collectieve
      actuariële gelijkwaardigheid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel66
  - number: '66.9'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel66
  - number: '66.10'
    text: |-
      Indien de pensioenuitvoerder wil afkopen op of na de reguliere ingangsdatum van het ouderdomspensioen en
      het moment waarop de pensioenuitvoerder wil afkopen ligt voor of op de datum waarop het ouderdomspensioen op
      grond van de [Algemene Ouderdomswet][ref1] ingaat, dan heeft de betrokkene het recht ervoor te kiezen dat het
      ouderdomspensioen waarop de afkoop betrekking heeft, ingaat op de eerste dag van de maand volgend op de datum
      waarop het ouderdomspensioen op grond van de Algemene Ouderdomswet ingaat. De pensioenuitvoerder koopt af op het
      moment dat het ouderdomspensioen waarop de afkoop betrekking heeft ingaat. [Artikel 62, eerste lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel62
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '62'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '66.11'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het vaststellen van de
      afkoopwaarde.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel66
  - number: '67.1'
    text: |-
      De pensioenuitvoerder heeft jegens de nabestaanden het recht om een recht op partnerpensioen of wezenpensioen ten
      behoeve van de nabestaanden van dezelfde deelnemer, gewezen deelnemer of gepensioneerde af te kopen, indien de
      uitkering van het partnerpensioen of wezenpensioen op jaarbasis op de ingangsdatum minder bedraagt dan het op basis
      van [artikel 66][ref1] bepaalde bedrag, tenzij dit recht op afkoop in de pensioen- en uitvoeringsovereenkomst is
      beperkt of uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '67.2'
    text: |-
      De pensioenuitvoerder die gebruik maakt van het in het eerste lid bedoelde recht informeert de nabestaande hierover
      binnen zes maanden na de ingangsdatum en gaat binnen die termijn over tot uitbetaling van de afkoopwaarde aan de
      nabestaande.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel67
  - number: '67.3'
    text: |-
      De pensioenuitvoerder kan na de in het tweede lid bedoelde termijn het partnerpensioen of wezenpensioen afkopen
      indien:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel67
  - number: 67.3.a
    text: de nabestaande daarmee instemt; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel67
  - number: 67.3.b
    text: |-
      indien de hoogte van het partnerpensioen of wezenpensioen op jaarbasis per 1 januari van dat jaar lager is dan het
      op basis van [artikel 66][ref1] bepaalde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '67.4'
    text: |-
      [Artikel 66, zesde, achtste, negende en elfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '68.1'
    text: |-
      De pensioenuitvoerder heeft jegens de gewezen partner het recht om een aanspraak op bijzonder partnerpensioen af
      te kopen indien de uitkering van het partnerpensioen op jaarbasis op de ingangsdatum minder zal bedragen dan het op
      basis van [artikel 66][ref1] bepaalde bedrag, tenzij dit recht op afkoop in de pensioen- en uitvoeringsovereenkomst
      is beperkt of uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '68.2'
    text: |-
      De pensioenuitvoerder die gebruik maakt van het in het eerste lid bedoelde recht informeert de gewezen partner
      hierover binnen zes maanden na de melding van de scheiding en gaat binnen die termijn over tot uitbetaling van de
      afkoopwaarde aan de gewezen partner.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel68
  - number: '68.3'
    text: 'De pensioenuitvoerder kan na de in het tweede lid bedoelde termijn afkopen indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel68
  - number: 68.3.a
    text: de gewezen partner daarmee instemt; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel68
  - number: 68.3.b
    text: |-
      indien de hoogte van het partnerpensioen op jaarbasis per 1 januari van dat jaar lager is dan het op basis van
      [artikel 66][ref1] bepaalde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '68.4'
    text: |-
      [Artikel 66, zesde, achtste, negende en elfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '69.1'
    text: |-
      Een pensioenuitvoerder is verplicht om op verzoek van de gerechtigde tot een pensioen over te gaan
      tot afkoop van het deel van de pensioenaanspraken dat uitgaat boven de begrenzingen die zijn opgenomen
      in de [hoofdstukken IIB][ref1] en [VIII van de Wet op de loonbelasting 1964][ref2]. De eerste zin
      is niet van toepassing met betrekking tot een nettopensioen, tenzij sprake is van toepassing van
      [artikel 5.17e, vijfde lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
      [ref2]: https://wetten.overheid.nl/BWBR0002471#HoofdstukVIII
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '69.2'
    text: |-
      Een pensioenuitvoerder heeft jegens de gerechtigde tot een nettopensioen het recht om een aanspraak op
      nettopensioen af te kopen indien:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69
  - number: 69.2.a
    text: |-
      de gerechtigde tot het nettopensioen een gewezen deelnemer is of de opbouw van nettopensioen anderszins beëindigd
      is;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69
  - number: 69.2.b
    text: |-
      op basis van de opgebouwde aanspraak op nettopensioen de uitkering van het nettopensioen op jaarbasis op de
      reguliere ingangsdatum minder zal bedragen dan het op basis van [artikel 66][ref1] bepaalde bedrag; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 69.2.c
    text: de gerechtigde tot het nettopensioen instemt met de afkoop.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69
  - number: '69.3'
    text: |-
      Voor de toepassing van dit artikel zijn de [artikelen 3.18, vierde en vijfde lid][ref1], en
      [3.95, eerste lid, tweede volzin, van de Wet inkomstenbelasting 2001][ref2] van overeenkomstige toepassing voor
      zover aan de pensioenregeling wordt deelgenomen door deelnemers die niet worden aangemerkt als werknemer in de zin
      van de [Wet op de loonbelasting 1964][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002471
  - number: '69.4'
    text: |-
      De afkoopwaarde wordt door de pensioenuitvoerder aan de deelnemer of gewezen deelnemer ter beschikking gesteld,
      met uitzondering van de afkoopwaarde voor een bijzonder partnerpensioen die ter beschikking wordt gesteld aan de
      gewezen partner.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69
  - number: '69.5'
    text: |-
      De pensioenuitvoerder waarborgt bij de vaststelling van de afkoopwaarde door vaststelling van een afkoopvoet dat
      geen onderscheid gemaakt wordt tussen mannen en vrouwen waarbij voldaan wordt aan het vereiste van collectieve
      actuariële gelijkwaardigheid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69
  - number: '69.6'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69
  - number: '69.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen er regels worden gesteld aan het vaststellen van de
      afkoopwaarde.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69
  - number: 69a.1
    text: |-
      Een pensioenuitvoerder is verplicht om na een verzoek van de deelnemer of gewezen deelnemer over te gaan tot afkoop
      van een deel van de waarde van diens aanspraken op ouderdomspensioen, indien:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69a
  - number: 69a.1.a
    text: het maximaal 10% van de waarde van de aanspraken op ouderdomspensioen betreft;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69a
  - number: 69a.1.b
    text: de afkoop geschiedt op de ingangsdatum van het ouderdomspensioen;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69a
  - number: 69a.1.c
    text: |-
      ingeval de pensioenovereenkomst de mogelijkheid biedt om de hoogte van het ouderdomspensioen te laten variëren als
      bedoeld in [artikel 63][ref1], de deelnemer of gewezen deelnemer geen gebruik maakt van deze mogelijkheid;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel63
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '63'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 69a.1.d
    text: |-
      na de afkoop de uitkering van het ouderdomspensioen op jaarbasis gelijk is aan of meer bedraagt dan het bedrag,
      genoemd in [artikel 66, eerste lid, onderdeel a][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 69a.1.e
    text: |-
      ingeval door de afkoop de hoogte van het partnerpensioen wordt verlaagd, de partner van de deelnemer of gewezen
      deelnemer die begunstigde is voor het partnerpensioen toestemming heeft gegeven voor de afkoop.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69a
  - number: 69a.2
    text: |-
      In afwijking van het eerste lid is een pensioenuitvoerder verplicht om na een verzoek van een
      deelnemer of gewezen deelnemer over te gaan tot afkoop van een deel van de waarde van diens recht op
      ouderdomspensioen in de maand februari volgend op het jaar waarin de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], is bereikt, met dien verstande dat afkoop op dat
      moment alleen mogelijk is als dat moment ligt na de ingangsdatum van het ouderdomspensioen. Het eerste lid,
      onderdelen a, c, d en e, zijn van overeenkomstige toepassing. Indien afkoop geschiedt in de maand februari, bedoeld
      in dit artikellid, wordt het ouderdomspensioen tot het moment van de afkoop vastgesteld alsof geen gebruik wordt
      gemaakt van het recht op afkoop.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 69a.3
    text: |-
      Het verzoek om gebruik te maken van het recht op afkoop, bedoeld in het eerste en tweede lid, geschiedt voor de
      ingangsdatum van het ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69a
  - number: 69a.4
    text: |-
      De pensioenuitvoerder waarborgt bij de vaststelling van de afkoopwaarde door vaststelling van een afkoopvoet dat
      geen onderscheid gemaakt wordt tussen mannen en vrouwen waarbij voldaan wordt aan het vereiste van collectieve
      actuariële gelijkwaardigheid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69a
  - number: 69a.5
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69a
  - number: 69a.6
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel69a
  - number: '70.1'
    text: |-
      Voor de toepassing van de [artikelen 70a tot en met 92a][ref1] wordt onder ontvangende pensioenuitvoerder mede
      verstaan een beroepspensioenfonds als bedoeld in [artikel 1 van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel1
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '1'
  - number: '70.2'
    text: |-
      Bij regeling van Onze Minister kunnen instellingen worden aangewezen jegens wie een pensioenuitvoerder een
      verplichting tot waardeoverdracht heeft.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel70
  - number: '70.3'
    text: |-
      Waardeoverdracht is slechts mogelijk in de in de [artikelen 70a tot en met 92a][ref1] bedoelde situaties.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '70.4'
    text: |-
      Voor de toepassing van de [artikelen 70a tot en met 92a][ref1] wordt onder een pensioenfonds dat
      optreedt als ontvangende pensioenuitvoerder mede verstaan een beroepspensioenfonds als bedoeld in
      [artikel 1 van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel1
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '1'
  - number: 70a.1
    text: |-
      De pensioenuitvoerder heeft het recht om na beëindiging van de deelneming de overdrachtswaarde van de
      pensioenaanspraken van een gewezen deelnemer over te dragen indien:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel70a
  - number: 70a.1.a
    text: |-
      op basis van de opgebouwde aanspraak op ouderdomspensioen de uitkering van het ouderdomspensioen op jaarbasis op de
      reguliere ingangsdatum minder zal bedragen dan het op basis van [artikel 66][ref1] bepaalde bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel70a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 70a.1.b
    text: |-
      de pensioenuitvoerder bij de toepassing van dit lid niet een lager maximum hanteert dan het in onderdeel a bedoelde
      bedrag;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel70a
  - number: 70a.1.c
    text: de opgebouwde aanspraak geen nettopensioen betreft; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel70a
  - number: 70a.1.d
    text: |-
      de waardeoverdracht ertoe strekt het de gewezen deelnemer mogelijk te maken pensioenaanspraken te verwerven bij de
      ontvangende pensioenuitvoerder van de nieuwe werkgever of de beroepspensioenregeling.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel70a
  - number: 70a.2
    text: |-
      Onverminderd het eerste lid, heeft de pensioenuitvoerder het recht de overdrachtswaarde van de pensioenaanspraken
      van de aanspraakgerechtigde over te dragen indien:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel70a
  - number: 70a.2.a
    text: er geen sprake meer is van verwerving van pensioenaanspraken bij de pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel70a
  - number: 70a.2.b
    text: wordt voldaan aan de voorwaarden, bedoeld in het eerste lid, onderdelen a, b en c;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel70a
  - number: 70a.2.c
    text: |-
      de waardeoverdracht ertoe strekt pensioenaanspraken te verwerven bij de ontvangende pensioenuitvoerder waarbij de
      aanspraakgerechtigde als deelnemer pensioen verwerft; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel70a
  - number: 70a.2.d
    text: |-
      er geen sprake is van een pensioenaanspraak bij een verzekeraar in de vorm van een vastgestelde uitkering vanaf
      de pensioendatum.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel70a
  - number: 70a.3
    text: |-
      De ontvangende pensioenuitvoerder is verplicht de overdrachtswaarde aan te wenden ter verwerving van
      pensioenaanspraken voor de deelnemer.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel70a
  - number: 70a.4
    text: |-
      De ontvangende pensioenuitvoerder waarborgt dat de actuariële waarde van de door de deelnemer te verwerven
      pensioenaanspraken ten minste gelijk is aan de op dezelfde grondslagen berekende waarde van de over te dragen
      pensioenaanspraken.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel70a
  - number: 70a.5
    text: |-
      De overdragende en ontvangende pensioenuitvoerder brengen in het kader van de waardeoverdracht geen kosten in
      rekening bij de gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel70a
  - number: 70a.6
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel70a
  - number: 70a.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over dit artikel onder meer over de
      berekening van de overdrachtswaarde.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel70a
  - number: '71.1'
    text: |-
      De pensioenuitvoerder is verplicht om na een verzoek van de gewezen deelnemer tot waardeoverdracht de
      overdrachtswaarde van diens pensioenaanspraken over te dragen indien:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel71
  - number: 71.1.a
    text: |-
      er sprake is van een individuele beëindiging van de dienstbetrekking dan wel individuele beëindiging van de
      deelneming; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel71
  - number: 71.1.b
    text: |-
      die waardeoverdracht ertoe strekt het de gewezen deelnemer mogelijk te maken pensioenaanspraken te verwerven bij de
      ontvangende pensioenuitvoerder van de nieuwe werkgever of de beroepspensioenregeling;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel71
  - number: '71.2'
    text: |-
      De ontvangende pensioenuitvoerder is verplicht om na een verzoek tot waardeoverdracht van een deelnemer de
      overdrachtswaarde aan te wenden ter verwerving van pensioenaanspraken voor die deelnemer.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel71
  - number: '71.3'
    text: |-
      De plicht van de overdragende pensioenuitvoerder om de waarde rechtstreeks over te dragen en de plicht van
      de ontvangende pensioenuitvoerder om de waarde aan te wenden ontstaat indien de deelnemer na aanvang van de
      verwerving van pensioenaanspraken in de door de ontvangende pensioenuitvoerder uitgevoerde pensioenregeling een
      opgave heeft gevraagd van zijn pensioenaanspraken aan de ontvangende pensioenuitvoerder en daarna het verzoek tot
      waardeoverdracht doet aan de ontvangende pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel71
  - number: '71.4'
    text: |-
      De ontvangende pensioenuitvoerder waarborgt dat de actuariële waarde van de door de deelnemer te verwerven
      pensioenaanspraken ten minste gelijk is aan de op dezelfde grondslagen berekende waarde van de over te dragen
      pensioenaanspraken.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel71
  - number: '71.5'
    text: |-
      De overdragende en de ontvangende pensioenuitvoerder brengen in het kader van de waardeoverdracht geen kosten in
      rekening bij de gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel71
  - number: '71.6'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel71
  - number: '71.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van nadere aan de
      waardeoverdracht te stellen voorwaarden en eisen, de berekening van de overdrachtswaarde, de waarde van met de
      overdrachtswaarde te verwerven pensioenaanspraken alsmede de in acht te nemen procedures.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel71
  - number: 71a
    text: |-
      De in [artikel 71][ref1] genoemde plicht tot waardeoverdracht geldt niet indien na de waardeoverdracht de
      voor de bedrijfspensioenvoorziening geldende wetgeving van een andere staat dan Nederland op de overgedragen
      pensioenaanspraken van toepassing is en de mogelijkheden tot afkoop van de waarde van de overgedragen
      pensioenaanspraken na de waardeoverdracht ruimer zijn dan op basis van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '72'
    text: |-
      De in [artikel 71][ref1] genoemde plicht tot waardeoverdracht geldt niet zolang:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 72.a
    text: |-
      de overdragende of ontvangende pensioenuitvoerder een pensioenfonds is waarbij gezien de beleidsdekkingsgraad de
      technische voorzieningen niet meer volledig door waarden worden gedekt;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel72
  - number: 72.b
    text: 'de overdragende of ontvangende pensioenuitvoerder een verzekeraar is:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel72
  - number: 72.b.1°
    text: |-
      ten aanzien waarvan een besluit als bedoeld in [artikel 3A:85 van de Wet op het financieel toezicht](onbekend) is
      genomen; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel72
  - number: 72.b.2°
    text: die failliet is; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel72
  - number: 72.c
    text: |-
      de overdragende pensioenuitvoerder een verzekeraar is en aanvullende bijdragen van de werkgever noodzakelijk zijn
      maar de financiële toestand van die werkgever blijkens een schriftelijke verklaring van een niet aan de onderneming
      van de werkgever verbonden registeraccountant of accountant-administratieconsulent die aanvullende bijdragen niet
      toelaat.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel72
  - number: 72a.1
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de tijdelijke inperking van de in
      [artikel 71][ref1] genoemde plicht tot waardeoverdracht in verband met aanvullende bijdragen van de oude of de
      nieuwe werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 72a.2
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel72a
  - number: '73'
    text: |-
      De in [artikel 71][ref1] genoemde plicht tot waardeoverdracht geldt niet met betrekking tot pensioenaanspraken
      ondergebracht bij:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 73.a
    text: een pensioenfonds, indien de deelneming is geëindigd vóór 8 juli 1994;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel73
  - number: 73.b
    text: een verzekeraar, indien de dienstbetrekking van de gewezen deelnemer is geëindigd vóór 8 juli 1994.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel73
  - number: '74.1'
    text: |-
      Indien de in [artikel 72][ref1] genoemde omstandigheden niet meer van toepassing zijn, herleven de in
      [artikel 71][ref2] bedoelde plichten van de overdragende pensioenuitvoerder en de ontvangende pensioenuitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '74.2'
    text: |-
      Een overdragende pensioenuitvoerder die in de periode waarin de in [artikel 72][ref1] bedoelde omstandigheden op
      hem van toepassing zijn verzoeken tot waardeoverdracht heeft gekregen, informeert, wanneer deze omstandigheden
      niet meer van toepassing zijn, alle deelnemers die in die periode gewezen deelnemer zijn geworden en de betrokken
      ontvangende pensioenuitvoerders over de mogelijkheid alsnog waarde over te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '74.3'
    text: |-
      Een ontvangende pensioenuitvoerder die in de periode waarin de in [artikel 72][ref1] genoemde omstandigheden op
      hem van toepassing zijn verzoeken tot waardeoverdracht heeft gekregen, informeert wanneer deze omstandigheden niet
      meer van toepassing zijn, alle deelnemers die in die periode een verzoek tot waardeoverdracht hebben gedaan en de
      betrokken overdragende pensioenuitvoerders over de mogelijkheid alsnog waarde over te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '75.1'
    text: |-
      Indien in de in [artikel 71][ref1] bedoelde situatie geen plicht tot waardeoverdracht bestaat omdat:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 75.1.a
    text: |-
      de deelnemer niet voldaan heeft aan een in de algemene maatregel van bestuur op grond van
      [artikel 71, zevende lid][ref1], opgenomen voorwaarde om binnen een termijn een opgave te vragen; of


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 75.1.b
    text: |-
      sprake is van de in [artikel 73][ref1] bedoelde situatie;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel73
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '73'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '75.2'
    text: |-
      Indien in de in [artikel 71][ref1] bedoelde situatie geen plicht tot waardeoverdracht bestaat, omdat er geen sprake
      is van een individuele beëindiging, is de pensioenuitvoerder bevoegd tot waardeoverdracht indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 75.2.a
    text: |-
      wordt voldaan aan de in [artikel 71, eerste lid, onderdeel b, tweede en derde zin, en vierde lid][ref1], genoemde
      voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 75.2.b
    text: |-
      de overdragende en de ontvangende pensioenuitvoerders aan wie door een groep gewezen deelnemers verzoeken tot
      waardeoverdracht worden gedaan, dit schriftelijk hebben gemeld aan de toezichthouder; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel75
  - number: 75.2.c
    text: |-
      de toezichthouder binnen drie maanden na de melding geen verbod tot waardeoverdracht heeft opgelegd aan een van
      beide pensioenuitvoerders.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel75
  - number: '75.3'
    text: |-
      Indien de financiering van de aanspraken van de gewezen deelnemer bij de overdragende pensioenuitvoerder nog
      niet is voltooid overeenkomstig [artikel 55][ref1] kan de pensioenuitvoerder ondanks de lagere waarde en de
      daaruit bij de ontvangende pensioenuitvoerder resulterende lagere pensioenaanspraken de waarde overdragen
      indien de gewezen deelnemer en zijn partner schriftelijk hiermee instemmen en mits sprake is van de in
      [artikel 72, onderdeel c][ref2], of de in [artikel 73][ref3] bedoelde situatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel73
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '73'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '75.4'
    text: |-
      Indien in de in [artikel 71][ref1] bedoelde situatie geen plicht tot waardeoverdracht bestaat omdat sprake is van
      de in [artikel 72a][ref2] bedoelde situatie is de pensioenuitvoerder bevoegd tot waardeoverdracht indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel72a
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 72a
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 75.4.a
    text: |-
      voldaan wordt aan de in [artikel 71, eerste en vierde lid][ref1], genoemde voorwaarden; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 75.4.b
    text: de oude of nieuwe werkgever bereid is de aanvullende bijdragen te betalen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel75
  - number: '76.1'
    text: |-
      De pensioenuitvoerder is verplicht om na een verzoek van de gewezen deelnemer tot waardeoverdracht de
      overdrachtswaarde van diens pensioenaanspraken over te dragen indien:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel76
  - number: 76.1.a
    text: |-
      sprake is van een individuele beëindiging van de deelneming bij een nieuwe of voortgezette dienstbetrekking bij
      dezelfde werkgever; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel76
  - number: 76.1.b
    text: |-
      die waardeoverdracht ertoe strekt het de gewezen deelnemer mogelijk te maken pensioenaanspraken te verwerven bij de
      ontvangende pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel76
  - number: '76.2'
    text: |-
      De ontvangende pensioenuitvoerder is verplicht om na een verzoek tot waardeoverdracht van een deelnemer de
      overdrachtswaarde aan te wenden ter verwerving van pensioenaanspraken voor die deelnemer.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel76
  - number: '76.3'
    text: |-
      De plicht van de overdragende pensioenuitvoerder om de waarde rechtstreeks over te dragen en de plicht van
      de ontvangende pensioenuitvoerder om de waarde aan te wenden ontstaat indien de deelnemer binnen zes maanden
      na aanvang van de verwerving van pensioenaanspraken in de door de ontvangende pensioenuitvoerder uitgevoerde
      pensioenregeling een opgave heeft gevraagd van zijn pensioenaanspraken aan de ontvangende pensioenuitvoerder en
      daarna het verzoek tot waardeoverdracht doet aan de ontvangende pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel76
  - number: '76.4'
    text: |-
      De overdrachtswaarde wordt door de overdragende pensioenuitvoerder zodanig vastgesteld dat de voor mannen
      en vrouwen te verwerven pensioenrechten gelijk zijn waarbij aan het vereiste van collectieve actuariële
      gelijkwaardigheid op basis van dezelfde grondslagen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel76
  - number: '76.5'
    text: |-
      De overdragende en de ontvangende pensioenuitvoerder brengen in het kader van de waardeoverdracht geen kosten in
      rekening bij de gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel76
  - number: '76.6'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel76
  - number: '76.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de berekening van de
      overdrachtswaarde, de waarde van met de overdrachtswaarde te verwerven pensioenaanspraken alsmede de in acht te
      nemen procedures.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel76
  - number: '77'
    text: |-
      Indien in de in [artikel 76][ref1] bedoelde situatie de in [artikel 72][ref2] genoemde omstandigheden niet meer van
      toepassing zijn herleeft de plicht tot waardeoverdracht overeenkomstig [artikel 74][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel74
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '74'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '78.1'
    text: |-
      Indien in de in [artikel 76][ref1] bedoelde situatie geen plicht tot waardeoverdracht bestaat omdat de deelnemer
      niet voldaan heeft aan de in [artikel 76, derde lid][ref2], omschreven verplichting om binnen zes maanden
      een opgave te vragen, is de pensioenuitvoerder bevoegd tot waardeoverdracht indien voldaan wordt aan de in
      [artikel 76, eerste en vierde lid][ref3], opgenomen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel76
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '78.2'
    text: |-
      Indien in de in [artikel 76][ref1] bedoelde situatie geen plicht tot waardeoverdracht bestaat omdat er geen sprake
      is van een individuele beëindiging, is de pensioenuitvoerder bevoegd tot waardeoverdracht indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel76
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 78.2.a
    text: |-
      wordt voldaan aan de in [artikel 76, eerste lid, onderdeel b en tweede zin, en vierde lid][ref1], genoemde
      voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel76
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 78.2.b
    text: |-
      de overdragende en de ontvangende pensioenuitvoerders aan wie door een groep gewezen deelnemers verzoeken tot
      waardeoverdracht worden gedaan niet identiek zijn hetgeen zij schriftelijk hebben gemeld aan de toezichthouder; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel78
  - number: 78.2.c
    text: |-
      de toezichthouder binnen drie maanden na de melding geen verbod tot waardeoverdracht heeft opgelegd aan een van
      beide pensioenuitvoerders.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel78
  - number: 78a
    text: |-
      De pensioenuitvoerder is bevoegd om na een verzoek van de gewezen deelnemer tot waardeoverdracht de
      overdrachtswaarde van diens pensioenaanspraken over te dragen indien:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel78a
  - number: 78a.a
    text: sprake is van een nieuwe pensioenregeling bij de gewezen werkgever;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel78a
  - number: 78a.b
    text: |-
      de nieuwe pensioenregeling in de mogelijkheid voorziet voor gewezen deelnemers van de oude pensioenregeling van de
      gewezen werkgever om waarde over te dragen; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel78a
  - number: 78a.c
    text: |-
      wordt voldaan aan de in [artikel 76, eerste lid, met uitzondering van onderdeel a, en vierde lid][ref1], genoemde
      voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel76
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel78a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '79.1'
    text: |-
      De pensioenuitvoerder is verplicht om op verzoek van de deelnemer of gewezen deelnemer de waarde van diens
      pensioenaanspraken aan te wenden in het kader van het keuzerecht overeenkomstig de [artikelen 10c][ref1],
      [60][ref2], [61][ref3] en [61a][ref4] of de keuzemogelijkheden overeenkomstig [artikel 62][ref5] of [63b][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel10c
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel61
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel61a
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel62
      [ref6]: https://wetten.overheid.nl/BWBR0020809#Artikel63b
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 10c
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '60'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: 61a
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref5
        bwb_id: BWBR0020809
        artikel: '62'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref6
        bwb_id: BWBR0020809
        artikel: 63b
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '79.2'
    text: |-
      De pensioenuitvoerder brengt in het kader van de waardeoverdracht geen kosten in rekening bij de deelnemer of
      gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel79
  - number: '80.1'
    text: |-
      Een pensioenfonds is bevoegd om op verzoek van de deelnemer, gewezen deelnemer of andere aanspraakgerechtigde de
      waarde van zijn pensioenaanspraken welke voortvloeien uit een flexibele premieovereenkomst per de pensioendatum
      rechtstreeks over te dragen aan een andere pensioenuitvoerder indien:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel80
  - number: 80.1.a
    text: de pensioenovereenkomst hierin voorziet;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel80
  - number: 80.1.b
    text: |-
      de overdrachtswaarde zodanig door het overdragende pensioenfonds wordt vastgesteld dat de voor mannen en vrouwen
      te verwerven pensioenrechten gelijk zijn waarbij aan het vereiste van collectieve actuariële gelijkwaardigheid op
      basis van dezelfde grondslagen wordt voldaan; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel80
  - number: 80.1.c
    text: |-
      indien de ontvangende pensioenuitvoerder een pensioenfonds is, de deelnemer, gewezen deelnemer of andere
      aanspraakgerechtigde reeds pensioenaanspraken heeft jegens dat pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel80
  - number: '80.2'
    text: |-
      In afwijking van het eerste lid is een pensioenfonds verplicht op verzoek van de deelnemer, gewezen deelnemer
      of andere aanspraakgerechtigde de waarde van zijn pensioenaanspraken als bedoeld in het eerste lid, per de
      pensioendatum rechtstreeks over te dragen aan een andere pensioenuitvoerder indien voldaan wordt aan de in het
      eerste lid, onderdelen b en c en tweede zin, genoemde voorwaarden en:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel80
  - number: 80.2.a
    text: |-
      het pensioenfonds uitsluitend variabele uitkeringen uitvoert en het pensioenkapitaal na de overdracht wordt
      aangewend voor een vastgestelde uitkering; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel80
  - number: 80.2.b
    text: |-
      het pensioenfonds uitsluitend vastgestelde uitkeringen uitvoert en het pensioenkapitaal na de overdracht wordt
      aangewend voor een variabele uitkering.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel80
  - number: '80.3'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel80
  - number: '80.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld aan het vaststellen van de
      overdrachtswaarde.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel80
  - number: '81.1'
    text: |-
      De verzekeraar is verplicht om op verzoek van de deelnemer, gewezen deelnemer of andere aanspraakgerechtigde
      de waarde van zijn pensioenaanspraken welke voortvloeien uit een flexibele premieovereenkomst of een premie-
      uitkeringsovereenkomst die voorziet in de uitkering van een aan te wenden kapitaal op de pensioendatum, per de
      pensioendatum rechtstreeks over te dragen aan een andere pensioenuitvoerder indien:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel81
  - number: 81.1.a
    text: |-
      de overdrachtswaarde zodanig door de overdragende verzekeraar wordt vastgesteld dat de voor mannen en vrouwen te
      verwerven pensioenrechten gelijk zijn waarbij aan het vereiste van collectieve actuariële gelijkwaardigheid op
      basis van dezelfde grondslagen wordt voldaan; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel81
  - number: 81.1.b
    text: |-
      indien de ontvangende pensioenuitvoerder een pensioenfonds is, de deelnemer, gewezen deelnemer of andere
      aanspraakgerechtigde reeds pensioenaanspraken heeft jegens dat pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel81
  - number: '81.2'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel81
  - number: '81.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld aan het vaststellen van de
      overdrachtswaarde.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel81
  - number: 81a.1
    text: |-
      De premiepensioeninstelling is verplicht de waarde van de pensioenaanspraken van de deelnemer, gewezen
      deelnemer of andere aanspraakgerechtigde welke voortvloeien uit een flexibele premieovereenkomst of een premie-
      uitkeringsovereenkomst per de pensioendatum voor omzetting van de aanspraken in een vastgestelde pensioenuitkering
      rechtstreeks over te dragen aan een door de premiepensioeninstelling aan te wijzen verzekeraar.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel81a
  - number: 81a.2
    text: |-
      In afwijking van het eerste lid is de premiepensioeninstelling verplicht op verzoek van de deelnemer, gewezen
      deelnemer of andere aanspraakgerechtigde de waarde van zijn pensioenaanspraken welke voortvloeien uit een flexibele
      premieovereenkomst of een premie-uitkeringsovereenkomst per de pensioendatum rechtstreeks over te dragen aan een
      pensioenuitvoerder die door de deelnemer, gewezen deelnemer of andere aanspraakgerechtigde is aangewezen. Daarbij
      gelden de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel81a
  - number: 81a.2.a
    text: |-
      indien de door de deelnemer, gewezen deelnemer of andere aanspraakgerechtigde aangewezen pensioenuitvoerder een
      pensioenfonds is, de deelnemer, gewezen deelnemer of andere aanspraakgerechtigde al pensioenaanspraken heeft jegens
      dat pensioenfonds; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel81a
  - number: 81a.2.b
    text: |-
      de ontvangende pensioenuitvoerder hanteert dezelfde methode als de premiepensioeninstelling om aan het vereiste van
      gelijke behandeling van mannen en vrouwen te voldoen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel81a
  - number: 81a.3
    text: |-
      De overdrachtswaarde wordt door de premiepensioeninstelling zodanig vastgesteld dat de voor mannen en vrouwen te
      verwerven pensioenrechten gelijk zijn waarbij aan het vereiste van collectieve actuariële gelijkwaardigheid op
      basis van dezelfde grondslagen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel81a
  - number: 81a.4
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel81a
  - number: 81a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld aan het vaststellen van de
      overdrachtswaarde.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel81a
  - number: 81b.1
    text: |-
      De premiepensioeninstelling is verplicht op verzoek van de deelnemer of gewezen deelnemer in de laatste vijftien
      jaar voor de pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1]
      de waarde van zijn pensioenaanspraken welke voortvloeien uit een premie-uitkeringsovereenkomst over te dragen aan
      een verzekeraar voor een aanspraak op een vastgestelde uitkering vanaf de pensioendatum. Indien het verzoek van
      de deelnemer of gewezen deelnemer tot waardeoverdracht partnerpensioen betreft is voor de waardeoverdracht van dit
      partnerpensioen tevens vereist dat de partner die begunstigde is voor het partnerpensioen met de waardeoverdracht
      instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel81b
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 81b.2
    text: |-
      [Artikel 81a, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel81a
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel81b
    references:
      - id: ref1
        bwb_id: BWBR0020809
