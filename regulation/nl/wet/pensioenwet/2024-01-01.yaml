        bwb_id: BWBR0020809
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 90a.1
    text: |-
      Een pensioenfonds of premiepensioeninstelling is met inachtneming van [artikel 90][ref1] slechts bevoegd over
      te gaan tot collectieve waardeoverdracht naar een pensioeninstelling uit een andere lidstaat, indien de bevoegde
      autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar zetel heeft, goedkeuring hebben
      verleend voor de collectieve waardeoverdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel90
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '90'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 90a.2
    text: 'Ten behoeve van een aanvraag tot goedkeuring van een collectieve waardeoverdracht als bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel90a
  - number: 90a.2.a
    text: |-
      stelt het pensioenfonds of de premiepensioeninstelling de informatie over de aan de voorgenomen collectieve
      waardeoverdracht verbonden voorwaarden tijdig ter beschikking aan de betrokken deelnemers, gewezen deelnemers en
      pensioengerechtigden, waarbij de deelnemers, gewezen deelnemers en pensioengerechtigden tevens worden geïnformeerd
      over het goedkeuringsrecht, bedoeld in onderdeel b, onder 1°; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel90a
  - number: 90a.2.b
    text: 'is vereist dat:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel90a
  - number: 90a.2.b.1°
    text: |-
      een tweederdemeerderheid van de deelnemers en gewezen deelnemers en een tweederdemeerderheid van de
      pensioengerechtigden die hebben gereageerd op een daartoe strekkend schriftelijk verzoek het voorgenomen besluit
      met betrekking tot de collectieve waardeoverdracht hebben goedgekeurd; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel90a
  - number: 90a.2.b.2°
    text: |-
      indien van toepassing, de werkgever het voorgenomen besluit met betrekking tot de collectieve waardeoverdracht
      heeft goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel90a
  - number: 90a.3
    text: |-
      De bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar zetel
      heeft kunnen alleen goedkeuring verlenen voor de collectieve waardeoverdracht indien de toezichthouder die
      bevoegde autoriteiten heeft meegedeeld toestemming te verlenen voor de collectieve waardeoverdracht. De
      [artikelen 83, tweede lid, onderdeel c][ref1], en [84, tweede lid, onderdeel a][ref2], zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel84
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '83'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '84'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 90a.4
    text: 'De toezichthouder verleent alleen toestemming voor de collectieve waardeoverdracht, indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel90a
  - number: 90a.4.a
    text: |-
      in geval van een gedeeltelijke collectieve waardeoverdracht de langetermijnbelangen van de deelnemers, gewezen
      deelnemers, andere aanspraakgerechtigden en pensioengerechtigden van het resterende deel van de pensioenregeling
      afdoende worden beschermd;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel90a
  - number: 90a.4.b
    text: |-
      de individuele pensioenaanspraken en pensioenrechten van de deelnemers, gewezen deelnemers, andere
      aanspraakgerechtigden en pensioengerechtigden na de collectieve waardeoverdracht minstens gelijk blijven; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel90a
  - number: 90a.4.c
    text: |-
      de met de over te dragen pensioenregeling overeenkomende activa toereikend en passend zijn om de over te dragen
      passiva, technische voorzieningen en andere verplichtingen en rechten te dekken.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel90a
  - number: 90a.5
    text: |-
      De toezichthouder deelt de resultaten van zijn beoordeling binnen acht weken na ontvangst van de aanvraag tot
      goedkeuring met de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar
      zetel heeft.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel90a
  - number: 90a.6
    text: |-
      Indien de collectieve waardeoverdracht in een grensoverschrijdende activiteit resulteert, informeert de
      toezichthouder de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar
      zetel heeft binnen vier weken na ontvangst van het besluit waarmee goedkeuring wordt verleend voor de collectieve
      waardeoverdracht over de bepalingen van de Nederlandse sociale en arbeidswetgeving die van toepassing zijn op
      de pensioenregeling waarvan de waarde is overgedragen. De [artikelen 200, tweede lid][ref1], [201][ref2] en
      [202][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel200
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel201
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel202
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '200'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '201'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '202'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 90a.7
    text: |-
      De kosten van de collectieve waardeoverdracht komen niet ten laste van de bij het pensioenfonds of de
      premiepensioeninstelling resterende deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en
      pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel90a
  - number: 90a.8
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel90a
  - number: '91.1'
    text: |-
      Indien een pensioenuitvoerder het verzoek krijgt om in het kader van waardeoverdracht een waarde van een
      pensioeninstelling uit een andere lidstaat of een verzekeraar met zetel buiten Nederland aan te nemen die verband
      houdt met een pensioenovereenkomst waarop deze wet tot het tijdstip van waardeoverdracht niet van toepassing is, is
      de pensioenuitvoerder gehouden daarvoor als ontvangende pensioenuitvoerder op te treden, mits:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel91
  - number: 91.1.a
    text: |-
      die waardeoverdracht ertoe strekt het de verzoekende werknemer mogelijk te maken pensioenaanspraken te verwerven
      bij de ontvangende pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel91
  - number: 91.1.b
    text: |-
      op de pensioenuitvoerder de in [artikel 72][ref1] genoemde omstandigheden niet van toepassing zijn; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 91.1.c
    text: |-
      aan de pensioenuitvoerder geen voorwaarden in verband met de waardeoverdracht worden gesteld die in strijd zijn met
      deze wet.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel91
  - number: '91.2'
    text: |-
      De ontvangende pensioenuitvoerder brengt in het kader van de waardeoverdracht geen kosten in rekening bij de
      deelnemer.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel91
  - number: '92'
    text: |-
      Indien een pensioenuitvoerder het verzoek krijgt om in het kader van waardeoverdracht een waarde van een
      buitenlandse instelling aan te nemen die verband houdt met een pensioenovereenkomst waarop deze wet tot het
      tijdstip van waardeoverdracht niet van toepassing is, is de pensioenuitvoerder bevoegd daarvoor als ontvangende
      pensioenuitvoerder op te treden, mits:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92
  - number: 92.a
    text: |-
      die waardeoverdracht ertoe strekt het de verzoekende werknemer mogelijk te maken pensioenaanspraken te verwerven
      bij de ontvangende pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92
  - number: 92.b
    text: |-
      op de pensioenuitvoerder de in [artikel 72][ref1] genoemde omstandigheden niet van toepassing zijn; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 92.c
    text: |-
      aan de pensioenuitvoerder geen voorwaarden in verband met de waardeoverdracht worden gesteld die in strijd zijn met
      deze wet.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92
  - number: 92a.1
    text: |-
      Een pensioenfonds of premiepensioeninstelling is bevoegd een collectieve waardeoverdracht van een
      pensioeninstelling uit een andere lidstaat aan te nemen, mits de toezichthouder goedkeuring heeft verleend voor de
      collectieve waardeoverdracht.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.2
    text: |-
      Het pensioenfonds of de premiepensioeninstelling dient de aanvraag tot goedkeuring van een collectieve
      waardeoverdracht als bedoeld in het eerste lid in bij de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.3
    text: 'De aanvraag tot goedkeuring bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.3.a
    text: |-
      de schriftelijke overeenkomst tussen het pensioenfonds of de premiepensioeninstelling en de pensioeninstelling uit
      de andere lidstaat met de voorwaarden van de voorgenomen collectieve waardeoverdracht;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.3.b
    text: een beschrijving van de belangrijkste kenmerken van de over te dragen pensioenregeling;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.3.c
    text: |-
      een beschrijving van de over te dragen passiva of technische voorzieningen en andere verplichtingen en rechten, en
      de overeenkomstige activa of de geldwaarde daarvan;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.3.d
    text: |-
      de naam, alsmede de plaats van vestiging van het hoofdbestuur, van het pensioenfonds of de premiepensioeninstelling
      en de pensioeninstelling uit de andere lidstaat en de lidstaten waar deze instellingen zijn geregistreerd of een
      vergunning hebben verkregen;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.3.e
    text: de naam, alsmede de plaats van vestiging van het hoofdbestuur, van de bijdragende onderneming;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.3.f
    text: |-
      een bewijs dat een, op basis van het recht van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar
      zetel heeft, vastgestelde meerderheid van de betrokken deelnemers, gewezen deelnemers en pensioengerechtigden of,
      in voorkomend geval, een meerderheid van hun vertegenwoordigers, de overdracht heeft goedgekeurd en, in voorkomend
      geval, de bijdragende onderneming; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.3.g
    text: |-
      in voorkomend geval, de namen van de lidstaten waarvan de geldende sociale en arbeidswetgeving van toepassing is op
      de betrokken pensioenregeling.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.4
    text: |-
      De toezichthouder stuurt de aanvraag tot goedkeuring, bedoeld in het tweede lid, na ontvangst onverwijld aan de
      bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar zetel heeft.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.5
    text: |-
      Na ontvangst van de beoordeling van de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit
      de andere lidstaat haar zetel heeft, neemt de toezichthouder een besluit omtrent het verlenen of weigeren van
      goedkeuring voor de collectieve waardeoverdracht, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.5.a
    text: |-
      indien de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar zetel heeft
      geen toestemming hebben verleend voor de collectieve waardeoverdracht een inhoudelijke beoordeling van de aanvraag
      tot goedkeuring van de collectieve waardeoverdracht door de toezichthouder achterwege kan blijven en goedkeuring
      voor de collectieve waardeoverdracht wordt geweigerd;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.5.b
    text: |-
      indien de bevoegde autoriteiten toestemming hebben verleend voor de collectieve waardeoverdracht, de toezichthouder
      goedkeuring verleent voor de collectieve waardeoverdracht, mits:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.5.b.1°
    text: de aanvraag tot goedkeuring de gegevens, bedoeld in het derde lid, bevat;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.5.b.2°
    text: |-
      de administratieve structuur, de financiële positie van het pensioenfonds of de premiepensioeninstelling en
      de goede reputatie of de beroepskwalificaties of beroepservaring van de personen die het pensioenfonds of de
      premiepensioeninstelling besturen met de voorgenomen collectieve waardeoverdracht verenigbaar zijn;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.5.b.3°
    text: |-
      de langetermijnbelangen van de deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en pensioengerechtigden
      van het pensioenfonds of de premiepensioeninstelling en het overgedragen deel van de pensioenregeling tijdens en na
      de collectieve waardeoverdracht afdoende worden beschermd;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.5.b.4°
    text: |-
      de technische voorzieningen van het pensioenfonds of de premiepensioeninstelling op het moment van de
      collectieve waardeoverdracht volledig door kapitaal zijn gedekt, indien de collectieve waardeoverdracht in een
      grensoverschrijdende activiteit resulteert; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.5.b.5°
    text: |-
      de over te dragen activa toereikend en passend zijn om de over te dragen passiva, technische voorzieningen en
      andere verplichtingen en rechten te dekken.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.6
    text: |-
      De toezichthouder deelt het besluit tot het verlenen of weigeren van goedkeuring voor de collectieve
      waardeoverdracht binnen drie maanden na ontvangst van de aanvraag tot goedkeuring mee aan het pensioenfonds of
      de premiepensioeninstelling.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.7
    text: |-
      De toezichthouder deelt de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat
      haar zetel heeft het in het zesde lid bedoelde besluit mee, binnen twee weken nadat het is genomen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.8
    text: |-
      De toezichthouder deelt informatie over de toepasselijke bepalingen van sociale en arbeidswetgeving ontvangen van
      de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar zetel heeft binnen
      een week na ontvangst mee aan het pensioenfonds of de premiepensioeninstelling.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.9
    text: |-
      De kosten van de collectieve waardeoverdracht komen niet ten laste van de bij het pensioenfonds of
      de premiepensioeninstelling bestaande deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en
      pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: 92a.10
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel92a
  - number: '93'
    text: |-
      Inlichtingen uit de basisregistratie personen en inlichtingen en uittreksels uit de registers van de burgerlijke
      stand, die de pensioenuitvoerder nodig heeft met het oog op de uitvoering van zijn taak, zijn vrij van leges.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel93
  - number: '94.1'
    text: Het burgerservicenummer kan door de pensioenuitvoerder bij het verwerken van persoonsgegevens worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel94
  - number: '94.2'
    text: 'De pensioenuitvoerder gebruikt dit burgerservicenummer uitsluitend:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel94
  - number: 94.2.a
    text: in het verkeer met de persoon op wie het nummer betrekking heeft; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel94
  - number: 94.2.b
    text: |-
      in contacten met personen en instanties voor zover deze zelf bevoegd zijn gebruik te maken van het
      burgerservicenummer bij het verwerken van persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel94
  - number: '95.1'
    text: |-
      Bij voorwaardelijke toeslagverlening door een verzekeraar dient er een consistent geheel te zijn tussen de gewekte
      verwachtingen, de financiering en het realiseren van voorwaardelijke toeslagen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel95
  - number: '95.2'
    text: Bij regeling van Onze Minister wordt invulling gegeven aan de consistentie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel95
  - number: '95.3'
    text: |-
      Een toeslag is alleen voorwaardelijk indien in de pensioenovereenkomst, de uitvoeringsovereenkomst, het
      pensioenreglement, de opgaven op grond van de [artikelen 21][ref1], [38 tot en met 46a][ref2] alsmede
      in de overige, persoonlijke, informatieverstrekking over toeslagverlening door de pensioenuitvoerder een
      voorwaardelijkheidsverklaring is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel38
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '95.4'
    text: Bij regeling van Onze Minister kunnen regels worden gesteld over de inhoud van de voorwaardelijkheidsverklaring.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel95
  - number: '96'
    text: 'Een pensioenuitvoerder vermeldt in zijn bestuursverslag of in het afgelopen boekjaar:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel96
  - number: 96.a
    text: |-
      aan de pensioenuitvoerder dwangsommen en bestuurlijke boeten zijn opgelegd, en zo ja, hoeveel deze in totaal hebben
      bedragen;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel96
  - number: 96.b
    text: |-
      een aanwijzing als bedoeld in [artikel 171][ref1] aan de pensioenuitvoerder is gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel171
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '171'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 96.c
    text: |-
      een bewindvoerder als bedoeld in [artikel 173][ref1] is aangesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel173
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '173'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 96.d
    text: |-
      een herstelplan als bedoeld in [artikel 138][ref1] of [artikel 139][ref2] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel139
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '139'
        hoofdstuk: '6'
  - number: 96.e
    text: |-
      de beëindiging van de situatie, bedoeld in [artikel 172][ref1], waarin de bevoegdheidsuitoefening van alle of
      bepaalde organen van een pensioenfonds is gebonden aan toestemming van de toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel172
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '172'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '97.1'
    text: Een gedetacheerde werknemer kan tijdens de detachering blijven deelnemen aan de pensioenregeling.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel97
  - number: '97.2'
    text: |-
      Indien tijdens detachering in Nederland de betaling van bijdragen in een andere lidstaat wordt voortgezet, worden
      de in Nederland gedetacheerde werknemer en diens werkgever vrijgesteld van de verplichting tot het betalen van
      bijdragen in Nederland.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel97
  - number: '97.3'
    text: Het eerste en tweede lid zijn van toepassing op detacheringen die op of na 25 juli 2001 zijn aangevangen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel97
  - number: '98'
    text: |-
      Overlijdt een deelnemer, gewezen deelnemer of gepensioneerde ten gevolge van een van het risico uitgesloten oorzaak
      en betrof het een partnerpensioen op opbouwbasis, dan keert de pensioenuitvoerder aan de partner een periodieke
      uitkering van partnerpensioen uit die gebaseerd is op de premievrije waarde berekend naar de dag voorafgaande aan
      het overlijden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel98
  - number: 98a
    text: |-
      De Nederlandse sociale en arbeidswetgeving is niet van toepassing voor zover een pensioenuitvoerder een
      pensioenregeling uitvoert waarop de voor de bedrijfspensioenvoorziening geldende regels van een andere staat dan
      Nederland van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel98a
  - number: '99'
    text: |-
      Een pensioenfonds heeft een paritair, een onafhankelijk of een gemengd bestuur. Indien een pensioenfonds een
      gemengd bestuur heeft, dan is dit een paritair gemengd bestuur, een onafhankelijk gemengd bestuur of een omgekeerd
      gemengd bestuur.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel99
  - number: '100.1'
    text: |-
      In het paritaire bestuur van een bedrijfstakpensioenfonds zijn de belanghebbenden op een zo evenwichtig mogelijke
      wijze vertegenwoordigd met dien verstande dat de vertegenwoordigers van werknemersverenigingen in de betrokken
      bedrijfstak of bedrijfstakken en de vertegenwoordigers van pensioengerechtigden tezamen ten minste evenveel zetels
      bezetten als de vertegenwoordigers van werkgeversverenigingen in de betrokken bedrijfstak of bedrijfstakken.
      Vertegenwoordigers van pensioengerechtigden bezetten, zo nodig in afwijking van [artikel 102, eerste lid][ref1],
      niet meer dan 25% van het aantal zetels dat door vertegenwoordigers van werkgeversverenigingen, vertegenwoordigers
      van werknemersverenigingen en vertegenwoordigers van pensioengerechtigden tezamen wordt bezet.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel102
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '102'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '100.2'
    text: |-
      In het paritaire bestuur van een ondernemingspensioenfonds zijn de belanghebbenden op een zo evenwichtig
      mogelijke wijze vertegenwoordigd met dien verstande dat de werknemersvertegenwoordigers en vertegenwoordigers
      van pensioengerechtigden tezamen ten minste evenveel zetels bezetten als de werkgeversvertegenwoordigers.
      Vertegenwoordigers van pensioengerechtigden bezetten, zo nodig in afwijking van [artikel 102, eerste lid][ref1],
      niet meer dan 25% of, indien sprake is van de in artikel 102, tweede lid, bedoelde situatie 50%, van het
      aantal zetels dat door werknemersvertegenwoordigers, werkgeversvertegenwoordigers en vertegenwoordigers van
      pensioengerechtigden tezamen wordt bezet.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel102
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '102'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '100.3'
    text: |-
      In het paritaire bestuur van een algemeen pensioenfonds is het eerste lid van overeenkomstige
      toepassing voor zover het algemeen pensioenfonds een pensioenregeling uitvoert voor een of meer
      bedrijfstakken of delen van een bedrijfstak; is het tweede lid van overeenkomstige toepassing voor
      zover het algemeen pensioenfonds een pensioenregeling uitvoert voor een onderneming of groep en is
      [artikel 109 van de Wet verplichte beroepspensioenregeling][ref1] van overeenkomstige toepassing voor zover het
      algemeen pensioenfonds een beroepspensioenregeling uitvoert als bedoeld in [artikel 1 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel1
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '109'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '1'
  - number: '100.4'
    text: |-
      Indien de statuten van een pensioenfonds voorzien in stemgerechtigde vertegenwoordigers in het paritaire
      bestuur van anderen dan werknemersverenigingen dan wel werknemers, werkgeversverenigingen dan wel de werkgever
      of pensioengerechtigden, worden die vertegenwoordigers voor de toepassing van het eerste, tweede en derde lid
      gelijkgesteld met vertegenwoordigers van pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel100
  - number: '100.5'
    text: |-
      Het tweede tot en met vierde lid is niet van toepassing voor zover een onderneming of groep waaraan het
      ondernemingspensioenfonds was verbonden heeft opgehouden te bestaan.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel100
  - number: '100.6'
    text: |-
      Aan het paritaire bestuur van een pensioenfonds kunnen maximaal twee bestuurders worden toegevoegd die niet directe
      vertegenwoordigers zijn van de belanghebbenden bij het pensioenfonds. Het vierde lid is niet van toepassing op
      deze bestuurders.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel100
  - number: '100.7'
    text: |-
      Het bestuur stelt een profielschets op voor leden van het bestuur. Het bestuur kan een kandidaat bestuurder
      afwijzen indien deze niet aan de profielschets voldoet.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel100
  - number: '101.1'
    text: |-
      Het onafhankelijke bestuur van een pensioenfonds bestaat uit ten minste twee bestuurders. De bestuurders zijn niet
      directe vertegenwoordigers van de belanghebbenden bij het pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel101
  - number: '101.2'
    text: |-
      Het bestuur stelt een profielschets op voor leden van het bestuur. Het bestuur kan een kandidaat bestuurder
      afwijzen indien deze niet aan de profielschets voldoet.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel101
  - number: 101a.1
    text: Het gemengd bestuur van een pensioenfonds bestaat uit uitvoerende bestuurders en niet uitvoerende bestuurders.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel101a
  - number: 101a.2
    text: |-
      Voor de samenstelling, zetelverdeling en benoeming van de uitvoerende bestuurders bij een paritair gemengd
      bestuur zijn de [artikelen 100][ref1] en [102][ref2] van overeenkomstige toepassing. Voor de samenstelling van
      de uitvoerende bestuurders bij een onafhankelijk gemengd bestuur is [artikel 101][ref3] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel102
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel101
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel101a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '100'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '102'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '101'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 101a.3
    text: |-
      Het gemengd bestuur heeft ten minste drie natuurlijke personen als niet uitvoerende bestuurders. De niet
      uitvoerende bestuurders zijn niet directe vertegenwoordigers van de belanghebbenden bij het pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel101a
  - number: 101a.4
    text: |-
      Bij de statuten van een pensioenfonds met een gemengd bestuur wordt bepaald dat de bestuurstaken worden
      verdeeld over niet uitvoerende bestuurders en uitvoerende bestuurders. [Artikel 104, tweede lid][ref1], is van
      overeenkomstige toepassing op de taken van de niet uitvoerende bestuurders. De taak om toezicht te houden op de
      taakuitoefening door bestuurders kan niet door een taakverdeling worden ontnomen aan niet uitvoerende bestuurders.
      Het voorzitterschap van het bestuur, het doen van voordrachten voor benoeming van een bestuurder en het vaststellen
      van de bezoldiging van uitvoerende bestuurders kan niet aan een uitvoerende bestuurder worden toebedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel104
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel101a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '104'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 101a.5
    text: |-
      De uitvoerende bestuurders nemen niet deel aan de besluitvorming over het vaststellen van de bezoldiging van
      uitvoerende bestuurders.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel101a
  - number: 101a.6
    text: |-
      Bij of krachtens de statuten kan worden bepaald dat een of meer bestuurders rechtsgeldig kunnen besluiten over
      zaken die tot zijn respectievelijk hun taak behoren. Bepaling krachtens de statuten geschiedt schriftelijk.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel101a
  - number: 101a.7
    text: |-
      In afwijking van het tweede en derde lid kan een omgekeerd gemengd bestuur worden gevormd waarbij voor de
      samenstelling van de uitvoerende bestuurders [artikel 101][ref1] van overeenkomstige toepassing is en waarbij
      voor de samenstelling, zetelverdeling en benoeming van de niet uitvoerende bestuurders de [artikelen 100][ref2] en
      [102][ref3] van overeenkomstige toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel102
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel101a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '101'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '100'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '102'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 101a.8
    text: |-
      Een omgekeerd gemengd bestuur heeft een onafhankelijke voorzitter die geen vertegenwoordiger is van de
      belanghebbenden bij het pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel101a
  - number: 101a.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de bevoegdheden van de
      onafhankelijk voorzitter, bedoeld in het achtste lid, de samenstelling van een omgekeerd gemengd bestuur en over de
      taakverdeling in en organisatie van dit bestuur.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel101a
  - number: '102.1'
    text: |-
      De verdeling van de zetels van vertegenwoordigers van werknemersverenigingen of werknemersvertegenwoordigers
      en vertegenwoordigers van pensioengerechtigden in het paritaire bestuur van een pensioenfonds vindt plaats op
      basis van de onderlinge getalsverhoudingen, met dien verstande dat de vertegenwoordigers van pensioengerechtigden
      ten hoogste de helft van het aantal zetels in het paritaire bestuur van een pensioenfonds bezetten dat
      vertegenwoordigers van werknemersverenigingen of werknemersvertegenwoordigers en vertegenwoordigers van
      pensioengerechtigden gezamenlijk bezetten. Van deze verdeling kan worden afgeweken indien de betrokken partijen
      daarmee akkoord zijn.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel102
  - number: '102.2'
    text: |-
      In het paritaire bestuur van een ondernemingspensioenfonds kunnen, in afwijking van het eerste lid,
      vertegenwoordigers van pensioengerechtigden meer zetels bezetten dan werknemersvertegenwoordigers, indien het
      aantal deelnemers minder bedraagt dan 10% van de som van het aantal deelnemers en pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel102
  - number: '102.3'
    text: |-
      De benoeming van de werknemersvertegenwoordigers in het paritaire bestuur van een ondernemingspensioenfonds vindt
      plaats:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel102
  - number: 102.3.a
    text: na verkiezing van de vertegenwoordigers door de deelnemers;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel102
  - number: 102.3.b
    text: |-
      op voordracht van de vertegenwoordigers van de deelnemers in het verantwoordingsorgaan, bedoeld in
      [artikel 115][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel115
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '115'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 102.3.c
    text: op voordracht van de ondernemingsraad; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel102
  - number: 102.3.d
    text: op een andere wijze, mits de ondernemingsraad heeft ingestemd met deze benoemingswijze.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel102
  - number: '102.4'
    text: |-
      De benoeming van de vertegenwoordigers van pensioengerechtigden in het paritaire bestuur van een pensioenfonds
      vindt plaats:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel102
  - number: 102.4.a
    text: na verkiezing van de vertegenwoordigers door de pensioengerechtigden; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel102
  - number: 102.4.b
    text: |-
      op voordracht van de vertegenwoordigers van de pensioengerechtigden in het verantwoordingsorgaan, bedoeld in
      [artikel 115][ref1], mits deze vertegenwoordigers na verkiezing zijn benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel115
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '115'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '102.5'
    text: |-
      Het tweede en derde lid is van overeenkomstige toepassing voor zover een algemeen pensioenfonds met een paritair
      bestuur een pensioenregeling uitvoert voor een onderneming of groep.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel102
  - number: 102a.1
    text: |-
      Het bestuur van een pensioenfonds draagt na overleg met de overige organen van het pensioenfonds zorg voor de
      vastlegging van de doelstellingen en beleidsuitgangspunten, waaronder de risicohouding, van het pensioenfonds.
      De organen van het pensioenfonds gebruiken deze doelstellingen en uitgangspunten bij de toetsing van de
      opdrachtaanvaarding van de door vertegenwoordigers van werkgevers of werkgeversverenigingen en werknemers
      of werknemersverenigingen overeengekomen pensioenregelingen, en bij de besluitvorming, de verantwoording, de
      advisering, en het toezicht binnen het pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel102a
  - number: 102a.2
    text: |-
      Het bestuur van een pensioenfonds streeft er naar van de vertegenwoordigers, bedoeld in het eerste lid, zo veel
      mogelijk duidelijkheid te verkrijgen over de doelstellingen die ten grondslag liggen aan de pensioenregelingen die
      de vertegenwoordigers als opdracht in uitvoering aan het pensioenfonds geven.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel102a
  - number: 102a.3
    text: |-
      Het bestuur van een pensioenfonds draagt zorg voor de formele opdrachtaanvaarding van de door de
      vertegenwoordigers, bedoeld in het eerste lid, aan het pensioenfonds opgedragen pensioenregelingen. Het bestuur
      toetst bij de opdrachtaanvaarding voor het pensioenfonds als geheel en voor de relevante beleidsgebieden aan de
      doelstellingen en uitgangspunten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel102a
  - number: 102a.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot dit artikel over
      onder meer de vastlegging van de doelstellingen en beleidsuitgangspunten en het proces van opdrachtaanvaarding.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel102a
  - number: '103.1'
    text: |-
      Het intern toezicht bij een bedrijfstakpensioenfonds met een paritair of onafhankelijk bestuur wordt uitgeoefend
      door een raad van toezicht, tenzij het bedrijfstakpensioenfonds volledig is verzekerd bij een verzekeraar. In dat
      geval kan het intern toezicht ook worden uitgeoefend door jaarlijkse visitatie door een visitatiecommissie.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel103
  - number: '103.2'
    text: |-
      Het intern toezicht bij een ondernemingspensioenfonds met een paritair of onafhankelijk bestuur wordt uitgeoefend
      door:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel103
  - number: 103.2.a
    text: |-
      een raad van toezicht of jaarlijkse visitatie door een visitatiecommissie indien het ondernemingspensioenfonds
      volledig is verzekerd bij een verzekeraar of een beheerd vermogen heeft van niet meer dan € 1 miljard; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel103
  - number: 103.2.b
    text: |-
      een raad van toezicht indien het ondernemingspensioenfonds een beheerd vermogen heeft van meer dan € 1 miljard,
      tenzij het ondernemingspensioenfonds volledig verzekerd is bij een verzekeraar in welk geval het intern toezicht
      ook kan worden uitgeoefend door jaarlijkse visitatie als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel103
  - number: '103.3'
    text: |-
      Het intern toezicht bij een algemeen pensioenfonds met een paritair of onafhankelijk bestuur wordt uitgeoefend door
      een raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel103
  - number: '103.4'
    text: |-
      Het intern toezicht bij een pensioenfonds met een gemengd bestuur wordt uitgeoefend door de niet uitvoerende
      bestuurders.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel103
  - number: '103.5'
    text: 'Voor de toepassing van het tweede lid:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel103
  - number: 103.5.a
    text: |-
      heeft een ondernemingspensioenfonds een beheerd vermogen van niet meer dan € 1 miljard indien het
      ondernemingspensioenfonds op twee opeenvolgende balansdata, zonder onderbreking nadien op twee opeenvolgende
      balansdata, een vermogen van niet meer dan € 1 miljard heeft; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel103
  - number: 103.5.b
    text: |-
      wordt het intern toezicht bij een ondernemingspensioenfonds dat een raad van toezicht heeft ingesteld omdat het
      ondernemingspensioenfonds een beheerd vermogen van meer dan € 1 miljard heeft, ten minste vier jaar uitgeoefend
      door een raad van toezicht ook indien het beheerd vermogen in deze periode € 1 miljard of minder wordt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel103
  - number: '104.1'
    text: |-
      De raad van toezicht of de visitatiecommissie bestaat uit ten minste drie natuurlijke personen. De leden van de
      raad van toezicht of de visitatiecommissie zijn onafhankelijk en laten dit tot uiting komen in het toezicht.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel104
  - number: '104.2'
    text: |-
      De raad van toezicht heeft tot taak toezicht te houden op het beleid van het bestuur en op de algemene
      gang van zaken in het pensioenfonds. De raad van toezicht is ten minste belast met het toezien op adequate
      risicobeheersing en evenwichtige belangenafweging door het bestuur en legt verantwoording af over de uitvoering
      van de taken en de uitoefening van de bevoegdheden aan het verantwoordingsorgaan en de werkgever, het
      belanghebbendenorgaan en in het bestuursverslag. De raad van toezicht staat het bestuur met raad ter zijde.
      [Artikel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] is van overeenkomstige toepassing op de leden van de raad
      van toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel9
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '9'
  - number: '104.3'
    text: 'Aan de goedkeuring van de raad van toezicht zijn onderworpen de besluiten van het bestuur tot vaststelling van:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel104
  - number: 104.3.a
    text: het bestuursverslag en de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel104
  - number: 104.3.b
    text: de profielschets voor bestuurders;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel104
  - number: 104.3.c
    text: het beleid inzake beloningen, met uitzondering van de beloning van de raad van toezicht;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel104
  - number: 104.3.d
    text: |-
      gehele of gedeeltelijke overdracht van de verplichtingen van het pensioenfonds of de overname van verplichtingen
      door het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel104
  - number: 104.3.e
    text: liquidatie, fusie of splitsing van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel104
  - number: 104.3.f
    text: |-
      het beleid inzake het aangaan en beëindigen van uitvoeringsovereenkomsten en het opstellen en beëindigen van
      uitvoeringsreglementen; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel104
  - number: 104.3.g
    text: |-
      het omzetten van het pensioenfonds in een andere rechtsvorm, bedoeld in
      [artikel 18 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel18
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '18'
  - number: '104.4'
    text: |-
      De statuten voorzien in een regeling voor geschillen over goedkeuring van besluiten door de raad van toezicht.
      Het ontbreken van de goedkeuring van de raad van toezicht op een besluit als bedoeld in het derde lid tast de
      vertegenwoordigingsbevoegdheid van bestuur of bestuurders niet aan.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel104
  - number: '104.5'
    text: |-
      De raad van toezicht meldt disfunctioneren van het bestuur aan het verantwoordingsorgaan, het belanghebbendenorgaan
      en aan de partij die bevoegd is tot benoeming van het bestuur. Indien de partij die bevoegd is tot benoeming van
      het bestuur naar aanleiding van de melding niet binnen een redelijke termijn, naar tevredenheid van de raad van
      toezicht, handelt, meldt de raad van toezicht het disfunctioneren van het bestuur aan De Nederlandsche Bank N.V.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel104
  - number: '104.6'
    text: De raad van toezicht stelt een profielschets op voor leden van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel104
  - number: '104.7'
    text: |-
      Het bestuur van het pensioenfonds en de raad van toezicht komen ten minste tweemaal per kalenderjaar in vergadering
      bijeen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel104
  - number: '104.8'
    text: |-
      De visitatiecommissie heeft tot taak toezicht te houden op het beleid van het bestuur en op de algemene gang van
      zaken in het pensioenfonds. De visitatiecommissie is ten minste belast met het toezien op adequate risicobeheersing
      en evenwichtige belangenafweging door het bestuur en legt verantwoording af over de uitvoering van de taken aan het
      verantwoordingsorgaan en de werkgever, het belanghebbendenorgaan en in het bestuursverslag.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel104
  - number: '104.9'
    text: |-
      Het pensioenfonds verstrekt desgevraagd aan de raad van toezicht of de visitatiecommissie tijdig alle inlichtingen
      en gegevens, die deze voor de vervulling van zijn taak redelijkerwijs nodig heeft. De inlichtingen worden
      desgevraagd schriftelijk verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel104
  - number: '104.10'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld inzake dit artikel die onder
      meer betrekking hebben op de bevoegdheden van de raad van toezicht ten aanzien van benoeming en ontslag van
      bestuurders.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel104
  - number: '105.1'
    text: Ten minste twee natuurlijke personen bepalen het dagelijks beleid van een pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel105
  - number: '105.2'
    text: |-
      De personen die het beleid van een pensioenfonds bepalen of mede bepalen richten zich bij de vervulling
      van hun taak naar de belangen van de bij het pensioenfonds betrokken deelnemers, gewezen deelnemers, andere
      aanspraakgerechtigden, de pensioengerechtigden en de werkgever en zorgen ervoor dat dezen zich door hen op
      evenwichtige wijze vertegenwoordigd kunnen voelen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel105
  - number: '105.3'
    text: |-
      Iedere bestuurder van een pensioenfonds is bevoegd een deskundige te raadplegen, of zich krachtens een
      bestuursbesluit, waarbij ten minste één vierde van de bestuurders zich daarvoor heeft uitgesproken, ter vergadering
      door een deskundige te laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel105
  - number: '106.1'
    text: |-
      Het beleid van een pensioenfonds wordt bepaald of mede bepaald door personen die geschikt zijn in verband met de
      uitoefening van het bedrijf van het pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel106
  - number: '106.2'
    text: |-
      Het intern toezicht van een pensioenfonds door een visitatiecommissie wordt uitgeoefend door personen die geschikt
      zijn voor de uitoefening van dit toezicht.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel106
  - number: '106.3'
    text: |-
      De risicobeheerfunctie, interne auditfunctie en actuariële functie bij een pensioenfonds worden uitgeoefend door
      personen die geschikt zijn voor de uitoefening van deze functies.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel106
  - number: '106.4'
    text: |-
      Het beleid van een pensioenfonds wordt bepaald of mede bepaald door personen wier betrouwbaarheid buiten twijfel
      staat. Het intern toezicht van een pensioenfonds door een visitatiecommissie en de risicobeheerfunctie, interne
      auditfunctie en actuariële functie bij een pensioenfonds worden uitgeoefend door personen wier betrouwbaarheid
      buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel106
  - number: '106.5'
    text: |-
      Het bestuur van het pensioenfonds meldt elke wijziging in de samenstelling van de personen die het beleid van het
      pensioenfonds bepalen of mede bepalen vooraf aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel106
  - number: '106.6'
    text: 'Een wijziging als bedoeld in het vijfde lid wordt niet doorgevoerd indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel106
  - number: 106.6.a
    text: |-
      de toezichthouder binnen zes weken na ontvangst van de melding van de wijziging aan het pensioenfonds bekend maakt
      dat hij niet met de voorgenomen wijziging instemt; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel106
  - number: 106.6.b
    text: |-
      de toezichthouder om nadere gegevens of inlichtingen heeft verzocht en binnen zes weken na ontvangst van die
      gegevens of inlichtingen aan het pensioenfonds bekend maakt dat hij niet met de voorgenomen wijziging instemt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel106
  - number: '106.7'
    text: |-
      Indien zich een wijziging voordoet van de antecedenten die van invloed is op de betrouwbaarheid van de personen
      die het beleid van het pensioenfonds bepalen of mede bepalen stelt het pensioenfonds de toezichthouder daarvan
      onverwijld schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel106
  - number: '106.8'
    text: |-
      De betrouwbaarheid van een persoon staat buiten twijfel wanneer dat eenmaal door de toezichthouder voor de
      toepassing van deze wet is vastgesteld, zolang niet een wijziging in de relevante feiten of omstandigheden een
      redelijke aanleiding geeft tot een nieuwe beoordeling.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel106
  - number: '106.9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel. Die
      regels hebben onder meer betrekking op de misdrijven die, indien begaan door een persoon als bedoeld in het vierde
      lid, met het oog op de belangen die de wet beoogt te beschermen, tot de vaststelling leiden dat de betrouwbaarheid
      van die persoon niet buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel106
  - number: 106a
    text: |-
      Bestuurders en leden van de raad van toezicht van een pensioenfonds hebben voldoende tijd beschikbaar
      om hun functie naar behoren uit te oefenen. Bij algemene maatregel van bestuur worden nadere regels
      gesteld. De [artikelen 132a][ref1], [142a][ref2], [242a][ref3], [252a][ref4], [297a][ref5] en
      [297b van Boek 2 van het Burgerlijk Wetboek][ref6] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel132a
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel142a
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel242a
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel252a
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel297a
      [ref6]: https://wetten.overheid.nl/BWBR0003045#Artikel297b
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel106a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 132a
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 142a
      - id: ref3
        bwb_id: BWBR0003045
        artikel: 242a
      - id: ref4
        bwb_id: BWBR0003045
        artikel: 252a
      - id: ref5
        bwb_id: BWBR0003045
        artikel: 297a
      - id: ref6
        bwb_id: BWBR0003045
        artikel: 297b
  - number: '107'
    text: |-
      In het bestuursverslag van een pensioenfonds wordt gerapporteerd over de samenstelling naar leeftijd en geslacht
      van het verantwoordingsorgaan, het belanghebbendenorgaan en het bestuur en over de inspanningen die zijn verricht
      om diversiteit in de organen van het pensioenfonds te bevorderen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel107
  - number: '108.1'
    text: |-
      De werkgever draagt er zorg voor dat de werknemers die staan of gestaan hebben op een kandidatenlijst
      voor het verantwoordingsorgaan of het belanghebbendenorgaan alsmede de leden en de gewezen leden van
      het pensioenfondsbestuur, het verantwoordingsorgaan of het belanghebbendenorgaan niet uit hoofde van hun
      kandidaatstelling voor of hun lidmaatschap van het pensioenfondsbestuur, het verantwoordingsorgaan of het
      belanghebbendenorgaan worden benadeeld in hun positie als werknemer.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel108
  - number: '108.2'
    text: |-
      Indien het pensioenfonds in zijn hoedanigheid als werkgever aan het verantwoordingsorgaan of het
      belanghebbendenorgaan een secretaris heeft toegevoegd is het eerste lid op die secretaris van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel108
  - number: '108.3'
    text: |-
      Het verantwoordingsorgaan, het belanghebbendenorgaan en een werknemer als bedoeld in het eerste en tweede lid
      kunnen de kantonrechter verzoeken te bepalen dat de werkgever gevolg dient te geven aan hetgeen in deze leden is
      bepaald.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel108
  - number: '108.4'
    text: |-
      De werkgever kan de arbeidsovereenkomst niet opzeggen met de werknemer die lid is van het bestuur van een
      pensioenfonds, een verantwoordingsorgaan of een belanghebbendenorgaan. Indien de werkgever aan het bestuur van een
      pensioenfonds, een verantwoordingsorgaan of een belanghebbendenorgaan een secretaris heeft toegevoegd, is de eerste
      zin op die secretaris van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel108
  - number: '108.5'
    text: |-
      De werkgever kan de arbeidsovereenkomst niet opzeggen met een werknemer die geplaatst is op een kandidatenlijst
      voor het bestuur van een pensioenfonds, een verantwoordingsorgaan of een belanghebbendenorgaan of die korter
      dan twee jaar geleden lid is geweest van het bestuur van een pensioenfonds, een verantwoordingsorgaan of een
      belanghebbendenorgaan.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel108
  - number: '108.6'
    text: |-
      Het vierde en vijfde lid zijn niet van toepassing bij een opzegging gedurende de proeftijd, wegens een dringende
      reden, indien de werknemer schriftelijk met de opzegging instemt of indien de opzegging geschiedt wegens de
      beëindiging van de werkzaamheden van de onderneming of van het onderdeel van de onderneming, waarin de werknemer
      uitsluitend of in hoofdzaak werkzaam is.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel108
  - number: '109'
    text: |-
      Iedere bepaling die het lidmaatschap van het bestuur, de raad van toezicht, de visitatiecommissie, het
      verantwoordingsorgaan of het belanghebbendenorgaan onmogelijk maakt op grond van het bereikt hebben van een
      bepaalde leeftijd is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel109
  - number: '110'
    text: |-
      Iedere bepaling die een goedkeuringsrecht inhoudt van een partij, die geen orgaan is van het pensioenfonds, inzake
      een besluit of voorgenomen besluit van het pensioenfonds is nietig, tenzij in deze wet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel110
  - number: '111.1'
    text: 'In de statuten van een pensioenfonds worden in ieder geval bepalingen opgenomen betreffende:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel111
  - number: 111.1.a
    text: het doel van het pensioenfonds, waaronder een omschrijving van de werkingssfeer;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel111
  - number: 111.1.b
    text: de bestemming van de middelen van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel111
  - number: 111.1.c
    text: het beheer van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel111
  - number: 111.1.d
    text: de inkomsten van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel111
  - number: 111.1.e
    text: de belegging van de gelden;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel111
  - number: 111.1.f
    text: |-
      het bestuursmodel van het pensioenfonds, bedoeld in [artikel 99][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel99
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '99'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 111.1.g
    text: de wijze waarop de bestuurders worden benoemd en ontslagen;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel111
  - number: 111.1.h
    text: de wijze waarop het intern toezicht is georganiseerd;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel111
  - number: 111.1.i
    text: de wijze waarop de leden van de raad van toezicht dan wel de visitatiecommissie worden benoemd en ontslagen;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel111
  - number: 111.1.j
    text: |-
      de wijze waarop de leden van het verantwoordingsorgaan dan wel het belanghebbendenorgaan worden benoemd en
      ontslagen;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel111
  - number: 111.1.k
    text: de wijziging van de statuten;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel111
  - number: 111.1.l
    text: |-
      de liquidatie van het pensioenfonds, waaronder begrepen de verplichtingen van de liquidateuren en de bestemming van
      de bezittingen van het pensioenfonds; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel111
  - number: 111.1.m
    text: |-
      de toepassing van [artikel 105, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel105
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '105'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '111.2'
    text: |-
      De omschrijving van de werkingssfeer, bedoeld in het eerste lid, onderdeel a, vindt ten aanzien van een
      bedrijfstakpensioenfonds plaats door het omschrijven van de bedrijfsactiviteiten van de bedrijfstak.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel111
  - number: '111.3'
    text: |-
      Een bedrijfstakpensioenfonds dat aan werkgevers de mogelijkheid biedt om zich vrijwillig aan te sluiten bepaalt in
      zijn statuten onder welke voorwaarden deze vrijwillige aansluiting mogelijk is.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel111
  - number: '112.1'
    text: |-
      De oprichters melden de voorgenomen oprichting van een ondernemingspensioenfonds of bedrijfstakpensioenfonds
      uiterlijk zes weken voor de beoogde datum van oprichting aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112
  - number: '112.2'
    text: |-
      Het ondernemingspensioenfonds of bedrijfstakpensioenfonds meldt binnen drie maanden na zijn oprichting deze
      oprichting aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112
  - number: '112.3'
    text: 'Bij de melding, bedoeld in het tweede lid, worden gevoegd:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112
  - number: 112.3.a
    text: een authentiek afschrift van de akte van oprichting van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112
  - number: 112.3.b
    text: een door het bestuur gewaarmerkt exemplaar van het reglement of de reglementen van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112
  - number: 112.3.c
    text: een door het bestuur gewaarmerkt afschrift van de uitvoeringsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112
  - number: 112.3.d
    text: |-
      een actuariële en bedrijfstechnische nota als bedoeld in [artikel 145][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel145
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '145'
        hoofdstuk: '6'
  - number: 112.3.e
    text: een eventuele overeenkomst tot verzekering, overdracht of onderbrenging.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112
  - number: 112a.1
    text: |-
      Het is verboden zonder een daartoe door de toezichthouder verleende vergunning in Nederland het bedrijf van een
      algemeen pensioenfonds uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112a
  - number: 112a.2
    text: |-
      De toezichthouder verleent op aanvraag een vergunning als bedoeld in het eerste lid indien de aanvrager zetel heeft
      in Nederland en aantoont dat zal worden voldaan aan:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112a
  - number: 112a.2.a
    text: |-
      het achtste lid en de [artikelen 33][ref1] en [34][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel34
