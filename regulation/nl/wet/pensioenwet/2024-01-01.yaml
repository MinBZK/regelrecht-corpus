  - number: 112a.3
    text: |-
      De aanvraag van de vergunning geschiedt onder opgave van bij of krachtens algemene maatregel van bestuur te bepalen
      gegevens.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112a
  - number: 112a.4
    text: |-
      Aan de vergunning kunnen voorschriften worden verbonden en beperkingen worden gesteld met het oog op de belangen
      die deze wet beoogt te beschermen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112a
  - number: 112a.5
    text: De toezichthouder kan de door hem verleende vergunning wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112a
  - number: 112a.6
    text: De vergunning is persoonlijk en niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112a
  - number: 112a.7
    text: 'Een algemeen pensioenfonds meldt binnen drie maanden aan de toezichthouder:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112a
  - number: 112a.7.a
    text: dat gestart is met het gebruikmaken van de vergunning; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112a
  - number: 112a.7.b
    text: het aanhouden van een nieuw afgescheiden vermogen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112a
  - number: 112a.8
    text: Een algemeen pensioenfonds beschikt over voldoende weerstandsvermogen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112a
  - number: 112a.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel die
      onder meer betrekking hebben op de aanvraag, de procedure, de omstandigheden die kunnen leiden tot het wijzigen of
      intrekken van de vergunning en het weerstandsvermogen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112a
  - number: 112b.1
    text: |-
      Een pensioenfonds meldt een voorgenomen fusie of splitsing van het pensioenfonds uiterlijk drie maanden voor de
      beoogde datum van de fusie of splitsing aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112b
  - number: 112b.2
    text: De toezichthouder kan tot die beoogde datum een verbod tot fusie of splitsing opleggen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel112b
  - number: '113'
    text: 'Het pensioenfonds zendt:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel113
  - number: 113.a
    text: een authentiek afschrift van de akte houdende wijziging van de statuten;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel113
  - number: 113.b
    text: een door het bestuur gewaarmerkt exemplaar van wijziging van de reglementen;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel113
  - number: 113.c
    text: een door het bestuur gewaarmerkt afschrift van de wijzigingen in de uitvoeringsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel113
  - number: 113.d
    text: |-
      een door het bestuur gewaarmerkt afschrift van de wijzigingen in de actuariële en bedrijfstechnische nota, bedoeld
      in [artikel 145][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel145
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '145'
        hoofdstuk: '6'
  - number: 113.e
    text: |-
      een door het bestuur gewaarmerkt afschrift van de wijzigingen in de eventuele overeenkomst tot verzekering,
      overdracht of onderbrenging;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel113
  - number: '114.1'
    text: |-
      Voor omzetting van een pensioenfonds in een andere rechtsvorm als bedoeld in
      [artikel 18 van Boek 2 van het Burgerlijk Wetboek][ref1] is een verklaring van geen bezwaar van de toezichthouder
      vereist. De toezichthouder verleent de verklaring indien hij van oordeel is dat de belangen van deelnemers, gewezen
      deelnemers, andere aanspraakgerechtigden, de pensioengerechtigden en de werkgever voldoende gewaarborgd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel18
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '18'
  - number: '114.2'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel114
  - number: '115.1'
    text: |-
      Een ondernemingspensioenfonds of een bedrijfstakpensioenfonds met een paritair bestuur of een paritair gemengd
      dan wel omgekeerd gemengd bestuur stelt een verantwoordingsorgaan in. Een algemeen pensioenfonds met een paritair
      bestuur of een paritair gemengd dan wel omgekeerd gemengd bestuur stelt een verantwoordingsorgaan in voor elke
      collectiviteitkring.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115
  - number: '115.2'
    text: |-
      In het verantwoordingsorgaan zijn de deelnemers en de pensioengerechtigden evenredig op basis van onderlinge
      getalsverhoudingen vertegenwoordigd. Bij een algemeen pensioenfonds wordt het voorgaande beoordeeld aan de hand van
      de onderlinge getalsverhoudingen binnen de collectiviteitkring waarvoor het verantwoordingsorgaan is ingesteld. De
      leden van het verantwoordingsorgaan vormen een zo evenwichtig mogelijke afspiegeling van de betreffende geleding.
      De werkgever kan vertegenwoordigd zijn in het verantwoordingsorgaan, indien de werkgever of de deelnemers en
      pensioengerechtigden dit wensen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115
  - number: '115.3'
    text: |-
      Indien een verantwoordingsorgaan van een algemeen pensioenfonds bij een collectiviteitkring hoort die
      bestaat uit meer dan een onderneming of groep, bedrijfstak of beroepspensioenregeling als bedoeld in
      [artikel 1 van de Wet verplichte beroepspensioenregeling][ref1] dan wel een combinatie hiervan, wordt iedere
      onderneming of groep, bedrijfstak dan wel beroepspensioenregeling door ten minste een deelnemer en een
      pensioengerechtigde vertegenwoordigd in het verantwoordingsorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel1
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '1'
  - number: '115.4'
    text: |-
      Op grond van door het bestuur van het pensioenfonds vast te stellen criteria kunnen naast de in het tweede lid
      bedoelde vertegenwoordigers ook één of meer vertegenwoordigers van gewezen deelnemers in het verantwoordingsorgaan
      zitting hebben.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115
  - number: '115.5'
    text: |-
      In geval van verkiezing van leden van het verantwoordingsorgaan door deelnemers, gewezen deelnemers en
      pensioengerechtigden kunnen kandidaten worden voorgedragen door verenigingen en door individuele deelnemers,
      gewezen deelnemers en pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115
  - number: '115.6'
    text: |-
      Voor zover geen verkiezing door de deelnemers, gewezen deelnemers en pensioengerechtigden plaatsvindt, maar
      de leden worden benoemd door verenigingen, zijn deze verenigingen evenredig aan hun ledenaantallen binnen hun
      geleding binnen het pensioenfonds vertegenwoordigd in het verantwoordingsorgaan. Bij een algemeen pensioenfonds
      wordt het voorgaande beoordeeld aan de hand van de ledenaantallen binnen de collectiviteitkring waarvoor het
      verantwoordingsorgaan is ingesteld.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115
  - number: '115.7'
    text: |-
      Een vereniging als bedoeld in het vijfde en zesde lid bezit volledige rechtsbevoegdheid; haar statutair doel omvat
      mede het behartigen van de belangen van haar leden als belanghebbenden bij een pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115
  - number: '115.8'
    text: |-
      Het bestuur van het pensioenfonds gaat over tot verkiezing van de leden van het verantwoordingsorgaan die de
      deelnemers, gewezen deelnemers en pensioengerechtigden vertegenwoordigen:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115
  - number: 115.8.a
    text: op eigen initiatief van het pensioenfonds; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115
  - number: 115.8.b
    text: |-
      indien dit wordt verzocht door ten minste 1% van de deelnemers, gewezen deelnemers en pensioengerechtigden of door
      ten minste 500 deelnemers, gewezen deelnemers en pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115
  - number: '115.9'
    text: |-
      Een verantwoordingsorgaan van een algemeen pensioenfonds heeft uitsluitend de taken en bevoegdheden van het
      verantwoordingsorgaan voor zover ze betrekking hebben op de collectiviteitkring waarvoor het verantwoordingsorgaan
      is ingesteld. Het verantwoordingsorgaan stelt in overleg met het bestuur van het algemeen pensioenfonds een
      regeling vast ten aanzien van deze taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115
  - number: '115.10'
    text: Het verantwoordingsorgaan heeft recht op overleg met het intern toezicht.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115
  - number: '115.11'
    text: |-
      Het bestuur van het pensioenfonds en het verantwoordingsorgaan komen ten minste tweemaal per kalenderjaar in
      vergadering bijeen. Tijdens deze vergaderingen worden de aangelegenheden aan de orde gesteld waarover het bestuur
      van het pensioenfonds of het verantwoordingsorgaan overleg wenselijk acht.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115
  - number: '115.12'
    text: |-
      Het pensioenfonds verstrekt desgevraagd aan het verantwoordingsorgaan tijdig alle inlichtingen en gegevens, die
      deze voor de vervulling van zijn taak redelijkerwijze nodig heeft. De inlichtingen worden desgevraagd schriftelijk
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115
  - number: '115.13'
    text: |-
      Indien een leeftijdscohort voorafgaand aan het vaststellen van de risicohouding ondervertegenwoordigd is in
      het verantwoordingsorgaan, vraagt het pensioenfonds bij het uitvragen van de risicohouding de leden van dit
      leeftijdscohort actief zich aan te melden voor het verantwoordingsorgaan.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115
  - number: 115a.1
    text: |-
      Het bestuur van het pensioenfonds legt verantwoording af aan het verantwoordingsorgaan over het beleid en de wijze
      waarop het is uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115a
  - number: 115a.2
    text: |-
      Het verantwoordingsorgaan heeft de bevoegdheid een oordeel te geven over het handelen van het bestuur aan de hand
      van het bestuursverslag, de jaarrekening en andere informatie, waaronder de bevindingen van het intern toezicht,
      over het door het bestuur uitgevoerde beleid, evenals over beleidskeuzes voor de toekomst waaronder de keuzes
      die van invloed zijn op de uitvoeringskosten. Dit oordeel wordt, samen met de reactie van het bestuur daarop,
      bekend gemaakt en in het bestuursverslag opgenomen. Het oordeel omvat in ieder geval een oordeel over de gemaakte
      uitvoeringskosten.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115a
  - number: 115a.3
    text: 'Het pensioenfonds stelt het verantwoordingsorgaan in de gelegenheid advies uit te brengen over:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115a
  - number: 115a.3.a
    text: het beleid inzake beloningen;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115a
  - number: 115a.3.b
    text: de vorm en inrichting van het intern toezicht;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115a
  - number: 115a.3.c
    text: de profielschets voor leden van de raad van toezicht;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115a
  - number: 115a.3.d
    text: het vaststellen en wijzigen van een interne klachten- en geschillenprocedure;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115a
  - number: 115a.3.e
    text: het vaststellen en wijzigen van het communicatie- en voorlichtingsbeleid;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115a
  - number: 115a.3.f
    text: |-
      gehele of gedeeltelijke overdracht van de verplichtingen van het pensioenfonds of de overname van verplichtingen
      door het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115a
  - number: 115a.3.g
    text: liquidatie, fusie of splitsing van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115a
  - number: 115a.3.h
    text: |-
      het sluiten, wijzigen of beëindigen van een uitvoeringsovereenkomst of het vaststellen, wijzigen of beëindigen van
      een uitvoeringsreglement; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115a
  - number: 115a.3.i
    text: |-
      het omzetten van het pensioenfonds in een andere rechtsvorm, bedoeld in
      [artikel 18 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel18
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '18'
  - number: 115a.4
    text: |-
      Het verantwoordingsorgaan adviseert het bestuur naar aanleiding van de melding van disfunctioneren van het bestuur,
      bedoeld in [artikel 104, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel104
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '104'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 115a.5
    text: |-
      Het advies van het verantwoordingsorgaan wordt op een zodanig tijdstip gevraagd dat het van wezenlijke invloed kan
      zijn op de in het derde lid bedoelde besluiten.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115a
  - number: 115a.6
    text: |-
      Bij het vragen van advies wordt aan het verantwoordingsorgaan een overzicht verstrekt van de beweegredenen
      voor het besluit en van de gevolgen die het besluit naar verwachting voor de deelnemers, gewezen deelnemers en
      pensioengerechtigden zal hebben.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115a
  - number: 115b.1
    text: |-
      Een ondernemingspensioenfonds of een bedrijfstakpensioenfonds met een onafhankelijk bestuur of een onafhankelijk
      gemengd bestuur stelt een belanghebbendenorgaan in. Een algemeen pensioenfonds met een onafhankelijk of
      onafhankelijk gemengd bestuur stelt een belanghebbendenorgaan in voor elke collectiviteitkring. In een algemeen
      pensioenfonds met meerdere belanghebbendenorganen kunnen belanghebbendenorganen worden samengevoegd indien de
      betrokken belanghebbendenorganen hiermee instemmen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115b
  - number: 115b.2
    text: |-
      Voor de samenstelling van het belanghebbendenorgaan zijn de [artikelen 100, eerste tot en met vijfde lid][ref1],
      en [102][ref2] van overeenkomstige toepassing. Bij een belanghebbendenorgaan voor een collectiviteitkring waarvan
      de pensioenregeling is beëindigd kan worden afgezien van vertegenwoordiging door de werkgever, indien de betrokken
      belanghebbenden in het belanghebbendenorgaan daarmee instemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel102
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '100'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '102'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 115b.3
    text: |-
      Een belanghebbendenorgaan van een algemeen pensioenfonds heeft uitsluitend de taken en bevoegdheden
      van het belanghebbendenorgaan voor zover ze betrekking hebben op de collectiviteitkring waarvoor het
      belanghebbendenorgaan is ingesteld. Indien belanghebbendenorganen zijn samengevoegd tot één belanghebbendenorgaan
      heeft dit belanghebbendenorgaan de taken en bevoegdheden van de afzonderlijke belanghebbendenorganen. Het
      belanghebbendenorgaan stelt in overleg met het bestuur van het algemeen pensioenfonds een regeling vast ten aanzien
      van deze taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115b
  - number: 115b.4
    text: Het belanghebbendenorgaan heeft recht op overleg met het intern toezicht.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115b
  - number: 115b.5
    text: |-
      Het bestuur van het pensioenfonds en het belanghebbendenorgaan komen ten minste tweemaal per kalenderjaar in
      vergadering bijeen. Tijdens deze vergaderingen worden de aangelegenheden aan de orde gesteld waarover het bestuur
      van het pensioenfonds of het belanghebbendenorgaan overleg wenselijk acht.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115b
  - number: 115b.6
    text: |-
      Het pensioenfonds verstrekt desgevraagd aan het belanghebbendenorgaan tijdig alle inlichtingen en gegevens, die
      deze voor de vervulling van zijn taak redelijkerwijze nodig heeft. De inlichtingen worden desgevraagd schriftelijk
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115b
  - number: 115c.1
    text: |-
      Het belanghebbendenorgaan adviseert het pensioenfonds desgevraagd of uit eigen beweging over aangelegenheden die
      het pensioenfonds betreffen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.2
    text: |-
      Het pensioenfonds stelt het belanghebbendenorgaan in ieder geval in de gelegenheid advies uit te brengen over elk
      voorgenomen besluit van het pensioenfonds met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.2.a
    text: het nemen van maatregelen van algemene strekking;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.2.b
    text: wijziging van de statuten en reglementen van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.2.c
    text: |-
      vaststelling van het bestuursverslag, de jaarrekening en de actuariële en bedrijfstechnische nota, bedoeld in
      [artikel 145][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel145
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '145'
        hoofdstuk: '6'
  - number: 115c.2.d
    text: |-
      het sluiten, wijzigen of beëindigen van een uitvoeringsovereenkomst of het vaststellen, wijzigen of beëindigen van
      een uitvoeringsreglement;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.2.e
    text: een overeenkomst van uitbesteding;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.2.f
    text: het beleid inzake beloningen;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.2.g
    text: de vorm en inrichting van het intern toezicht;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.2.h
    text: de profielschets voor leden van de raad van toezicht;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.2.i
    text: het vaststellen en wijzigen van een interne klachten- en geschillenprocedure; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.2.j
    text: het vaststellen en wijzigen van het communicatie- en voorlichtingsbeleid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.3
    text: |-
      Het advies van het belanghebbendenorgaan wordt op een zodanig tijdstip gevraagd dat het van wezenlijke invloed kan
      zijn op de in het tweede lid bedoelde besluiten.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.4
    text: |-
      Het belanghebbendenorgaan adviseert het bestuur naar aanleiding van de melding van disfunctioneren van het bestuur,
      bedoeld in [artikel 104, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel104
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '104'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 115c.5
    text: |-
      Bij het vragen van advies wordt aan het belanghebbendenorgaan een overzicht verstrekt van de beweegredenen
      voor het besluit en van de gevolgen die het besluit naar verwachting voor de deelnemers, gewezen deelnemers en
      pensioengerechtigden zal hebben.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.6
    text: |-
      Het bestuur van het pensioenfonds legt verantwoording af aan het belanghebbendenorgaan over het beleid en de wijze
      waarop het is uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.7
    text: |-
      Het belanghebbendenorgaan heeft de bevoegdheid een oordeel te geven over het handelen van het bestuur aan de hand
      van het bestuursverslag, de jaarrekening en andere informatie, waaronder de bevindingen van het intern toezicht,
      over het door het bestuur uitgevoerde beleid, evenals over beleidskeuzes voor de toekomst waaronder de keuzes
      die van invloed zijn op de uitvoeringskosten. Dit oordeel wordt, samen met de reactie van het bestuur daarop,
      bekend gemaakt en in het bestuursverslag opgenomen. Het oordeel omvat in ieder geval een oordeel over de gemaakte
      uitvoeringskosten.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.8
    text: |-
      Besluiten van het bestuur kunnen bij of krachtens de statuten worden onderworpen aan de goedkeuring van het
      belanghebbendenorgaan, voor zover uit de wet niet anders voortvloeit. De statuten voorzien in een regeling voor
      geschillen over goedkeuring van besluiten door het belanghebbendenorgaan. Bij het vragen van goedkeuring is het
      vijfde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.9
    text: |-
      Het bestuur heeft in ieder geval goedkeuring nodig van het belanghebbendenorgaan voor elk voorgenomen besluit met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.9.a
    text: |-
      gehele of gedeeltelijke overdracht van de verplichtingen van het pensioenfonds of de overname van verplichtingen
      door het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.9.b
    text: liquidatie, fusie of splitsing van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.9.c
    text: |-
      het omzetten van het pensioenfonds in een andere rechtsvorm, bedoeld in
      [artikel 18 van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel18
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '18'
  - number: 115c.9.d
    text: wijziging van de collectiviteitkring;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.9.e
    text: het strategische beleggingsbeleid;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.9.f
    text: de solidariteitsreserve of risicodelingsreserve;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.9.g
    text: de toedelingsregels;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.9.h
    text: het vaststellen en wijzigen van het toeslagbeleid;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115c.9.i
    text: |-
      vaststelling van een herstelplan als bedoeld in [artikel 138][ref1] of [artikel 139][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel139
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '139'
        hoofdstuk: '6'
  - number: 115c.9.j
    text: |-
      het terugstorten van premie, bedoeld in [artikel 129][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel129
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '129'
        hoofdstuk: '6'
  - number: 115c.9.k
    text: |-
      vermindering van de verworven pensioenaanspraken en pensioenrechten indien toepassing wordt gegeven aan
      [artikel 134][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '134'
        hoofdstuk: '6'
  - number: 115c.10
    text: |-
      Het ontbreken van de goedkeuring van het belanghebbendenorgaan op een besluit als bedoeld in het achtste of negende
      lid tast de vertegenwoordigingsbevoegdheid van bestuur of bestuurders niet aan.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115c
  - number: 115d
    text: |-
      In de statuten van het pensioenfonds kunnen aan het verantwoordingsorgaan of het belanghebbendenorgaan verdere
      bevoegdheden dan de in deze wet genoemde worden toegekend.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115d
  - number: 115e
    text: |-
      Het pensioenfonds deelt het verantwoordingsorgaan of het belanghebbendenorgaan zo spoedig mogelijk schriftelijk
      mee, of het een advies niet of niet geheel volgt, waarbij tevens wordt meegedeeld waarom van het advies of van een
      daarin vervat minderheidsadvies wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115e
  - number: 115f
    text: 'Een pensioenfonds informeert het verantwoordingsorgaan of het belanghebbendenorgaan onverwijld schriftelijk over:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115f
  - number: 115f.a
    text: |-
      de verplichting tot opstelling van een herstelplan als bedoeld in [artikel 138][ref1] of [artikel 139][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel139
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115f
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '139'
        hoofdstuk: '6'
  - number: 115f.b
    text: |-
      de aanstelling van een bewindvoerder als bedoeld in [artikel 173][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel173
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115f
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '173'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 115f.c
    text: |-
      de beëindiging van de situatie, bedoeld in [artikel 172][ref1], waarin de bevoegdheiduitoefening van alle
      of bepaalde organen van een pensioenfonds is gebonden aan toestemming van een of meer door de toezichthouder
      aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel172
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115f
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '172'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 115g.1
    text: |-
      Een pensioenfonds staat de leden van het verantwoordingsorgaan of het belanghebbendenorgaan het gebruik toe van de
      voorzieningen waarover het kan beschikken, voor zover dat redelijkerwijs voor de vervulling van hun taken nodig is.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115g
  - number: 115g.2
    text: |-
      Ten aanzien van de rechten en bevoegdheden van het verantwoordingsorgaan of het belanghebbendenorgaan in verhouding
      tot het bestuur van het pensioenfonds zijn de [artikelen 10][ref1], [16][ref2], [17][ref3], [18][ref4] en
      [22 van de Wet op de ondernemingsraden][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0002747#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0002747#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0002747#Artikel22
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115g
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0002747
        artikel: '17'
      - id: ref4
        bwb_id: BWBR0002747
        artikel: '18'
      - id: ref5
        bwb_id: BWBR0002747
        artikel: '22'
  - number: 115h
    text: |-
      Een pensioenfonds is gehouden om op verzoek van werknemers of een werknemersvereniging mee te werken aan de
      verstrekking van informatie aan de werknemers van het fonds over het voornemen tot oprichting, of over het bestaan,
      van een werknemersvereniging. Een pensioenfonds is tevens gehouden om op verzoek van pensioengerechtigden of een
      vereniging van pensioengerechtigden mee te werken aan de verstrekking van informatie aan de pensioengerechtigden
      van het fonds over het voornemen tot oprichting, of over het bestaan, van een vereniging van pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel115h
  - number: '116.1'
    text: |-
      Een pensioenfonds verricht slechts activiteiten in verband met pensioen en werkzaamheden die daarmee verband
      houden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel116
  - number: '116.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter zake van activiteiten die door
      pensioenfondsen kunnen worden verricht.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel116
  - number: '117.1'
    text: |-
      Een pensioenfonds kan uitsluitend een vrijwillige pensioenregeling uitvoeren indien dit een aanvulling op een door
      datzelfde pensioenfonds uitgevoerde basispensioenregeling betreft.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel117
  - number: '117.2'
    text: |-
      Een pensioenfonds kan een fiscaal bovenmatige pensioenregeling uitsluitend uitvoeren als vrijwillige
      pensioenregeling.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel117
  - number: '117.3'
    text: |-
      Onder een fiscaal bovenmatige pensioenregeling als bedoeld in het tweede lid wordt verstaan: een
      pensioenregeling die niet blijft binnen de begrenzingen die zijn opgenomen in de [hoofdstukken IIB][ref1] en
      [VIII van de Wet op de loonbelasting 1964][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
      [ref2]: https://wetten.overheid.nl/BWBR0002471#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        hoofdstuk: VIII
  - number: '117.4'
    text: |-
      Voor de toepassing van het derde lid zijn de [artikelen 3.18, vierde en vijfde lid][ref1], en
      [3.95, eerste lid, tweede volzin, van de Wet inkomstenbelasting 2001][ref2] van overeenkomstige toepassing voor
      zover aan de pensioenregeling wordt deelgenomen door deelnemers die niet worden aangemerkt als werknemer in de zin
      van de [Wet op de loonbelasting 1964][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002471
  - number: '117.5'
    text: |-
      Bij een algemeen pensioenfonds kan de vrijwillige pensioenregeling die in aanvulling op de basispensioenregeling
      wordt uitgevoerd deel uitmaken van een ander afgescheiden vermogen dan deze basispensioenregeling.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel117
  - number: '117.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het bepaalde in het
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel117
  - number: '117.7'
    text: |-
      De voordracht voor een krachtens het zesde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel117
  - number: 117a.1
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de uitvoering van een nettopensioen door een
      pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel117a
  - number: 117a.2
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel117a
  - number: '120.1'
    text: |-
      Voor een basispensioenregeling in de vorm van een premieovereenkomst welke wordt uitgevoerd door een pensioenfonds
      geldt dat de werkgeverspremie ten minste 10 procent van de premie van de basispensioenregeling bedraagt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel120
  - number: '120.2'
    text: |-
      Voor een vrijwillige pensioenregeling in de vorm van een premieovereenkomst welke wordt uitgevoerd door een
      pensioenfonds geldt:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel120
  - number: 120.2.a
    text: dat de werkgever ten minste 10 procent van de premie van de vrijwillige pensioenregeling bijdraagt; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel120
  - number: 120.2.b
    text: |-
      dat op de vrijwillige pensioenregeling in beginsel dezelfde regels en voorwaarden van toepassing zijn als op
      de basispensioenregeling en de basispensioenregeling een solidaire premieovereenkomst betreft of een flexibele
      premieovereenkomst met een risicodelingsreserve.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel120
  - number: '120.3'
    text: |-
      Indien de vrijwillige pensioenregeling voldoet aan de voorwaarde, bedoeld in het tweede lid, onderdeel a, deelt het
      pensioenfonds dit schriftelijk mee aan de deelnemers en de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel120
  - number: '120.4'
    text: Het eerste lid is niet van toepassing op een verplichtgesteld bedrijfstakpensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel120
  - number: '121'
    text: |-
      Een bedrijfstakpensioenfonds kan een uitvoeringsovereenkomst sluiten met een werkgever die niet onder
      de werkingssfeer van het bedrijfstakpensioenfonds valt, maar die zich op vrijwillige basis bij het
      bedrijfstakpensioenfonds wil aansluiten, indien:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel121
  - number: 121.a
    text: |-
      de loonontwikkeling bij deze werkgever ten minste gelijk is aan die in een bedrijfstak waarin het
      bedrijfstakpensioenfonds werkzaam is en de werkgever deelneemt in de sociale fondsen van dezelfde bedrijfstak;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel121
  - number: 121.b
    text: |-
      er sprake is van een groepsverhouding tussen de werkgever die zich vrijwillig wil aansluiten en een andere
      werkgever die onder de werkingssfeer van het bedrijfstakpensioenfonds valt; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel121
  - number: 121.c
    text: |-
      dit aansluitend gebeurt aan een periode waarin de werkgever wel onder de werkingssfeer van het
      bedrijfstakpensioenfonds viel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel121
  - number: 121a
    text: |-
      [Artikel 121][ref1] is van overeenkomstige toepassing bij uitbreiding van de werkingssfeer van een verplichtgesteld
      bedrijfstakpensioenfonds met een bedrijfstak of deel van een bedrijfstak waarbij deelneming aan het
      bedrijfstakpensioenfonds voor in die bedrijfstak werkzame personen niet verplicht is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel121
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel121a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '121'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '122'
    text: |-
      Indien een onderneming niet langer deel uitmaakt van een groep waaraan een ondernemingspensioenfonds verbonden
      is, of een groep die valt onder de werkingssfeer van een bedrijfstakpensioenfonds, kan dit pensioenfonds blijven
      optreden als pensioenuitvoerder voor deze onderneming, tenzij de onderneming onder de werkingssfeer van een
      verplichtgesteld bedrijfstakpensioenfonds valt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel122
  - number: '123.1'
    text: |-
      Indien een ondernemingspensioenfonds of een bedrijfstakpensioenfonds meerdere pensioenregelingen
      uitvoert vormen deze pensioenregelingen financieel een geheel, tenzij toepassing wordt gegeven aan
      [artikel 150l, zevende lid][ref1]. Een algemeen pensioenfonds houdt een afgescheiden vermogen aan voor
      iedere collectiviteitkring, waarbij ten aanzien van een collectiviteitkring toepassing kan worden gegeven aan
      artikel 150l, zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150l
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150l
        hoofdstuk: 6b
        paragraaf: 6b.5
  - number: '123.2'
    text: |-
      De werkingssfeer van de collectiviteitkring, bedoeld in het eerste lid, wordt vastgelegd in de statuten door
      omschrijving van de pensioenregelingen en vermelding van de uitvoeringsovereenkomsten of uitvoeringsreglementen die
      onderdeel uitmaken van de collectiviteitkring.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel123
  - number: '123.3'
    text: |-
      Het vermogen voor een collectiviteitkring is een afgescheiden vermogen dat, onverminderd [artikel 129][ref1] en het
      vijfde lid, uitsluitend dient tot voldoening van vorderingen die voortvloeien uit:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel129
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '129'
        hoofdstuk: '6'
  - number: 123.3.a
    text: |-
      kosten die verband houden met de uitvoering van de pensioenregeling die volgens de uitvoeringsovereenkomst of het
      uitvoeringsreglement ten laste kunnen worden gebracht van het vermogen; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel123
  - number: 123.3.b
    text: |-
      pensioenaanspraken en pensioenrechten van deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en
      pensioengerechtigden bij dat vermogen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel123
  - number: '123.4'
    text: |-
      Indien het afgescheiden vermogen bij vereffening ontoereikend is voor voldoening van de vorderingen, dient het
      vermogen ter voldoening van de vorderingen in de volgorde van het derde lid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel123
  - number: '123.5'
    text: |-
      In geval van een faillietverklaring van een algemeen pensioenfonds worden de boedelschulden, overeenkomstig de
      bepalingen van de [Faillissementswet][ref1], al naar gelang de aard van de betrokken boedelschuld hetzij omgeslagen
      over ieder deel van de boedel, hetzij uitsluitend van een bepaalde bate van de boedel afgetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0001860
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0001860
  - number: '124'
    text: |-
      Een pensioenfonds kan de mogelijkheid bieden tot verhoging van de pensioenaanspraken indien het deel van
      de pensioenaanspraken dat voortvloeit uit deze inkoop overeenkomstig de pensioenaanspraken op grond van de
      basispensioenregeling wordt behandeld.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel124
  - number: 124a.1
    text: |-
      Een pensioenfonds draagt de eigendom van een pensioenvermogen slechts over aan een pensioenbewaarder nadat hij met
      deze een overeenkomst inzake het beheer en de bewaring van het pensioenvermogen heeft gesloten.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel124a
  - number: 124a.2
    text: |-
      Het pensioenfonds treft maatregelen opdat de pensioenbewaarder slechts met zijn medewerking over de bestanddelen
      van het pensioenvermogen zal beschikken.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel124a
  - number: 124a.3
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de inhoud van de overeenkomst, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel124a
  - number: '125.1'
    text: |-
      Het is een pensioenfonds verboden bijdragen te ontvangen van een bijdragende onderneming die zetel heeft in een
      andere lidstaat dan Nederland:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel125
  - number: 125.1.a
    text: zonder een daartoe door de toezichthouder verleende vergunning; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel125
  - number: 125.1.b
    text: |-
      zonder de toezichthouder van het voornemen daartoe in kennis te hebben gesteld, op de wijze, bedoeld in
      [artikel 194][ref1], en met inachtneming van [artikel 196][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel194
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel196
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '194'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '196'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '125.2'
    text: |-
      Voor de toepassing van het eerste lid, [artikel 138, vierde lid][ref1], [artikel 140, tweede lid][ref2], en de
      [paragrafen 7.4.2][ref3] en [7.4.3][ref4] wordt onder het ontvangen van bijdragen verstaan het ontvangen van
      bijdragen voor de uitvoering van een pensioenregeling die afkomstig is uit een andere lidstaat dan de lidstaat waar
      het pensioenfonds gevestigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel140
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '140'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0020809
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref4
        bwb_id: BWBR0020809
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 125a
    text: |-
      Indien een algemeen pensioenfonds afgescheiden vermogens aanhoudt, wordt hetgeen bij of krachtens de
      [artikelen 126][ref1], [129 tot en met 142][ref2], [143][ref3], voor zover het de haalbaarheidstoets betreft,
      [145][ref4], [147][ref5], [149][ref6] en [150][ref7] is bepaald, toegepast per afgescheiden vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel129
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel143
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel145
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel147
      [ref6]: https://wetten.overheid.nl/BWBR0020809#Artikel149
      [ref7]: https://wetten.overheid.nl/BWBR0020809#Artikel150
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel125a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '126'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '129'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '143'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '145'
        hoofdstuk: '6'
      - id: ref5
        bwb_id: BWBR0020809
        artikel: '147'
        hoofdstuk: '6'
      - id: ref6
        bwb_id: BWBR0020809
        artikel: '149'
        hoofdstuk: '6'
      - id: ref7
        bwb_id: BWBR0020809
        artikel: '150'
        hoofdstuk: '6'
  - number: '126.1'
    text: |-
      Een pensioenfonds stelt toereikende technische voorzieningen vast met betrekking tot het geheel van
      pensioenverplichtingen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel126
  - number: '126.2'
    text: 'De berekening wordt uitgevoerd met inachtneming van de volgende beginselen:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel126
  - number: 126.2.a
    text: de technische voorzieningen worden berekend op basis van marktwaardering;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel126
  - number: 126.2.b
    text: |-
      de voor de berekening van de technische voorzieningen gebruikte grondslagen inzake overlijden of
      arbeidsongeschiktheid en levensverwachting worden gebaseerd op prudente beginselen; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel126
  - number: 126.2.c
    text: |-
      de methode en de grondslag van de berekening van de technische voorzieningen blijven van boekjaar tot boekjaar
      ongewijzigd, tenzij wijzigingen daarin gerechtvaardigd zijn als gevolg van een verandering van de juridische,
      demografische of economische omstandigheden die aan de hypothesen ten grondslag liggen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel126
  - number: '126.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de wijze van berekening van het minimum
      bedrag van de technische voorzieningen, de daarbij in acht te nemen voorzichtigheidsmarges en kunnen regels worden
      gesteld over de frequentie waarmee de technische voorzieningen worden berekend.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel126
  - number: '127'
    text: Ouderdomspensioen wordt gefinancierd op basis van kapitaaldekking.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel127
  - number: '129.1'
    text: 'Een pensioenfonds kan uitsluitend terugstorten indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel129
  - number: 129.1.a
    text: |-
      gezien de beleidsdekkingsgraad ten aanzien van de pensioenverplichtingen wordt voldaan aan de
      [artikelen 126][ref1], [132][ref2] en [133][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel132
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel133
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '126'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '132'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '133'
        hoofdstuk: '6'
  - number: 129.1.b
    text: |-
      de voorwaardelijke toeslagen zowel met betrekking tot de voorgaande tien jaar zijn verleend als ook in de toekomst
      kunnen worden verleend; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel129
  - number: 129.1.c
    text: |-
      de korting op de pensioenaanspraken en pensioenrechten op grond van [artikel 134][ref1] in de voorgaande tien jaar
      gecompenseerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '134'
        hoofdstuk: '6'
  - number: '129.2'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel129
  - number: '131.1'
    text: 'Een pensioenfonds beschikt over een minimaal vereist eigen vermogen, tenzij:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel131
  - number: 131.1.a
    text: een pensioenfonds tot volledige overdracht of onderbrenging is overgegaan; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel131
  - number: 131.1.b
    text: |-
      de toezichthouder heeft ingestemd met het feit dat het pensioenfonds daarom niet beschikt over een minimaal vereist
      eigen vermogen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel131
  - number: '131.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de omvang en de samenstelling van het minimaal vereist eigen
      vermogen bepaald.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel131
  - number: '132.1'
    text: Een pensioenfonds beschikt over een vereist eigen vermogen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel132
  - number: '132.2'
    text: |-
      Een pensioenfonds stelt het vereist eigen vermogen zodanig vast dat met een zekerheid van 971/2 procent wordt
      voorkomen dat het pensioenfonds binnen een periode van één jaar over minder waarden beschikt dan de hoogte van de
      technische voorzieningen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel132
  - number: '132.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld inzake de berekening en de
      samenstelling van het vereist eigen vermogen, bedoeld in het eerste lid, en het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel132
  - number: '133'
    text: De technische voorzieningen en de aan het pensioenfonds verstrekte leningen worden volledig door waarden gedekt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel133
  - number: 133a.1
    text: |-
      De beleidsdekkingsgraad van een pensioenfonds is de gemiddelde dekkingsgraad van de 12 maanden voorafgaand aan het
      moment van vaststelling.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel133a
  - number: 133a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de
      beleidsdekkingsgraad en het moment van vaststelling van de beleidsdekkingsgraad.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel133a
  - number: 133b.1
    text: |-
      Een pensioenfonds is verplicht om jaarlijks de hoogte van de reële dekkingsgraad van het pensioenfonds aan de
      toezichthouder te melden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel133b
  - number: 133b.2
    text: Bij regeling van Onze Minister worden regels gesteld over de reële dekkingsgraad.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel133b
  - number: '134.1'
    text: 'Een pensioenfonds kan verworven pensioenaanspraken en pensioenrechten uitsluitend verminderen indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel134
  - number: 134.1.a
    text: |-
      het pensioenfonds gezien de beleidsdekkingsgraad niet voldoet aan de bij of krachtens [artikel 131][ref1] gestelde
      eisen ten aanzien van het minimaal vereist eigen vermogen of de bij of krachtens [artikel 132][ref2] gestelde eisen
      ten aanzien van het vereist eigen vermogen;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel132
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '131'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '132'
        hoofdstuk: '6'
  - number: 134.1.b
    text: |-
      het pensioenfonds niet in staat is binnen een redelijke termijn te voldoen aan [artikel 131][ref1] of
      [artikel 132][ref2] zonder dat de belangen van deelnemers, gewezen deelnemers, pensioengerechtigden, andere
      aanspraakgerechtigden of de werkgever onevenredig worden geschaad; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel132
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '131'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '132'
        hoofdstuk: '6'
  - number: 134.1.c
    text: |-
      alle overige beschikbare sturingsmiddelen, met uitzondering van het beleggingsbeleid, zijn ingezet in het
      herstelplan, bedoeld in [artikel 138][ref1] of [artikel 139][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel139
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '139'
        hoofdstuk: '6'
  - number: '134.2'
    text: |-
      Een pensioenfonds informeert de deelnemers, gewezen deelnemers, pensioengerechtigden en de werkgever onverwijld
      over het besluit tot vermindering van pensioenaanspraken en pensioenrechten.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel134
  - number: '134.3'
    text: |-
      De vermindering, bedoeld in het eerste lid, kan op zijn vroegst drie maanden nadat de pensioengerechtigden hierover
      zijn geïnformeerd en een maand nadat de deelnemers, gewezen deelnemers, werkgever en toezichthouder hierover zijn
      geïnformeerd, worden gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel134
  - number: '134.4'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel134
  - number: '135.1'
    text: |-
      Een pensioenfonds voert een beleggingsbeleid dat in overeenstemming is met de prudent-person regel en met name
      gebaseerd is op de volgende uitgangspunten:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel135
  - number: 135.1.a
    text: de waarden worden belegd in het belang van aanspraak- en pensioengerechtigden;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel135
  - number: 135.1.b
    text: |-
      beleggingen in de bijdragende onderneming worden beperkt tot ten hoogste 5% van de portefeuille als geheel, en
      ingeval de bijdragende onderneming tot een groep behoort, worden beleggingen in de ondernemingen die tot dezelfde
      groep als de bijdragende onderneming behoren, beperkt tot ten hoogste 10% van de portefeuille. Wanneer een groep
      van ondernemingen aan het pensioenfonds premies betaalt, geschieden beleggingen in deze bijdragende ondernemingen
      prudent, waarbij rekening wordt gehouden met de noodzaak van een behoorlijke diversificatie;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel135
  - number: 135.1.c
    text: de beleggingen worden gewaardeerd op basis van marktwaardering; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel135
  - number: 135.1.d
    text: de blootstelling aan beleggingsrisico is niet hoger dan 150%.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel135
  - number: '135.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ter waarborging van het prudente beleggingsbeleid nadere
      regels gesteld.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel135
  - number: '135.3'
    text: |-
      De eisen die zijn opgenomen in het eerste lid, aanhef en onderdeel b, en de regels die op grond van het tweede
      lid worden gesteld ten aanzien van de diversificatie van waarden zijn niet van toepassing op beleggingen in
      staatsobligaties.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel135
  - number: '135.4'
    text: |-
      Een pensioenfonds vermeldt in zijn bestuursverslag op welke wijze in het beleggingsbeleid rekening wordt gehouden
      met milieu en klimaat, mensenrechten en sociale verhoudingen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel135
  - number: '136.1'
    text: |-
      Een pensioenfonds gaat geen leningen aan, tenzij de lening tijdelijk wordt aangegaan voor
      liquiditeitsdoelstellingen en treedt niet namens derde partijen op als garant.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel136
  - number: '136.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van het eerste lid met
      betrekking tot de tijdelijkheid van de lening en de liquiditeitsdoelstellingen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel136
  - number: '137.1'
    text: |-
      Voor zover van toepassing stelt een pensioenfonds beleid vast met betrekking tot de voorwaardelijke
      toeslagverlening.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel137
  - number: '137.2'
    text: 'Voor een pensioenfonds geldt bij de voorwaardelijke toeslagverlening het volgende:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel137
  - number: 137.2.a
    text: |-
      bij een beleidsdekkingsgraad onder een bij algemene maatregel van bestuur te bepalen niveau wordt geen toeslag
      verleend;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel137
  - number: 137.2.b
    text: er wordt niet meer toeslag verleend dan naar verwachting in de toekomst te realiseren is; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel137
  - number: 137.2.c
    text: |-
      incidentele toeslagverlening om in het verleden niet toegekende toeslag of in het verleden doorgevoerde
      vermindering van pensioenaanspraken en pensioenrechten te compenseren kan worden verleend indien die
      toeslagverlening geen gevolgen heeft voor de toeslagverlening in de toekomst overeenkomstig onderdeel b, de
      beleidsdekkingsgraad het niveau van het vereist eigen vermogen, bedoeld in [artikel 132][ref1], behoudt en in enig
      jaar ten hoogste een vijfde van het vermogen dat voor deze toeslagverlening beschikbaar is, wordt aangewend.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel132
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '132'
        hoofdstuk: '6'
  - number: '137.3'
    text: 'Het tweede lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel137
  - number: 137.3.a
    text: een pensioenfonds volledig verzekerd is bij een verzekeraar;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel137
  - number: 137.3.b
    text: |-
      de werkgever een onvoorwaardelijke verplichting heeft tot het verstrekken van bijdragen aan een pensioenfonds
      zodanig dat dit pensioenfonds steeds voldoet aan de bij of krachtens [artikel 131][ref1] gestelde eisen ten aanzien
      van het minimaal vereist eigen vermogen en daarbij sprake is van onvoorwaardelijke toeslagverlening voor deelnemers
      conform minimaal de groeivoet van het prijsindexcijfer; of


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel131
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '131'
        hoofdstuk: '6'
  - number: 137.3.c
    text: anderszins sprake is van bij of krachtens algemene maatregel van bestuur te bepalen bijzondere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel137
  - number: '137.4'
    text: 'Pensioenfondsen kunnen de voorwaardelijke toeslagverlening financieren door:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel137
  - number: 137.4.a
    text: het creëren van technische voorzieningen;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel137
  - number: 137.4.b
    text: het creëren van eigen vermogen boven het vereist eigen vermogen ten behoeve van de toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel137
  - number: 137.4.c
    text: het putten uit het eigen vermogen boven het vereist eigen vermogen ten behoeve van de toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel137
  - number: 137.4.d
    text: het hanteren van een opslag op de premie; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel137
  - number: 137.4.e
    text: overrendement.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel137
  - number: '137.5'
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel137
  - number: '138.1'
    text: |-
      Wanneer de beleidsdekkingsgraad van een pensioenfonds per het einde van een kalenderkwartaal is komen te liggen
      onder de bij of krachtens [artikel 132][ref1] gestelde eisen ten aanzien van het vereist eigen vermogen, meldt het
      pensioenfonds dit onverwijld aan de toezichthouder. Wanneer de beleidsdekkingsgraad van een pensioenfonds, waarvan
      het minimaal vereist eigen vermogen hoger is dan het vereist eigen vermogen, per het einde van een kalenderkwartaal
      is komen te liggen onder de bij of krachtens [artikel 131][ref2] gestelde eisen ten aanzien van het minimaal
      vereist eigen vermogen, meldt het pensioenfonds dit onverwijld aan de toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel131
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '132'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '131'
        hoofdstuk: '6'
  - number: '138.2'
    text: |-
      In de in de eerste zin van het eerste lid bedoelde situatie dient het pensioenfonds binnen drie maanden of zoveel
      eerder als de toezichthouder bepaalt ter instemming bij de toezichthouder een concreet en haalbaar herstelplan in,
      tenzij het pensioenfonds gezien de beleidsdekkingsgraad op dat moment weer voldoet aan [artikel 132][ref1]. In het
      herstelplan werkt het pensioenfonds uit hoe het uiterlijk binnen tien jaar zal voldoen aan artikel 132.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel132
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '132'
        hoofdstuk: '6'
  - number: '138.3'
    text: |-
      In afwijking van het tweede lid kan de toezichthouder, in verband met de specifieke situatie van het pensioenfonds
      en in het belang van de aanspraak- en pensioengerechtigden, bepalen dat voor het herstelplan een kortere termijn
      geldt dan tien jaar.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel138
  - number: '138.4'
    text: |-
      Een pensioenfonds dat bijdragen ontvangt van een in een andere lidstaat gevestigde bijdragende onderneming en een
      beleidsdekkingsgraad heeft die ligt onder de bij of krachtens [artikel 131][ref1] gestelde eisen ten aanzien van
      het minimaal vereist eigen vermogen werkt in het herstelplan tevens uit hoe het binnen een jaar zal voldoen aan
      artikel 131.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel131
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '131'
        hoofdstuk: '6'
  - number: '138.5'
    text: |-
      Het herstelplan vertoont een in beginsel tijdsevenredig herstel. In afwijking hiervan kan het herstelplan een meer
      dan tijdsevenredig herstel vertonen in de eerste helft van de looptijd van het herstelplan.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel138
  - number: '138.6'
    text: |-
      Het herstelplan gaat uiterlijk zes maanden nadat de beleidsdekkingsgraad is komen te liggen onder de bij
      of krachtens [artikel 132][ref1] gestelde eisen in. Het pensioenfonds handelt onverwijld overeenkomstig het
      herstelplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel132
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '132'
        hoofdstuk: '6'
  - number: '138.7'
    text: |-
      Het pensioenfonds stelt jaarlijks de beleidsdekkingsgraad vast op het moment waarop een situatie als bedoeld in het
      eerste lid is vastgesteld. Zo nodig in afwijking van de vorige zin kan het pensioenfonds de beleidsdekkingsgraad
      jaarlijks vaststellen per het einde van het vierde kalenderkwartaal, door de eerste vaststelling van de
      beleidsdekkingsgraad na het moment waarop een situatie als bedoeld in het eerste lid, is vastgesteld te vervroegen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel138
  - number: '138.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel die
      onder meer betrekking hebben op de periode tot het herstelplan ingaat.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel138
  - number: '139.1'
    text: |-
      Wanneer de beleidsdekkingsgraad die op grond van [artikel 138, zevende lid][ref1], is vastgesteld ligt onder de bij
      of krachtens [artikel 132][ref2] gestelde eisen ten aanzien van het vereist eigen vermogen, dient het pensioenfonds
      binnen drie maanden of zoveel eerder als de toezichthouder bepaalt ter instemming bij de toezichthouder een
      concreet en haalbaar geactualiseerd herstelplan in.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel132
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '132'
        hoofdstuk: '6'
  - number: '139.2'
    text: |-
      In het in het eerste lid bedoelde herstelplan werkt het pensioenfonds uit hoe het in dezelfde termijn als de
      termijn die het pensioenfonds bij het herstelplan op grond van [artikel 138, tweede lid][ref1], heeft gebruikt,
      zal voldoen aan [artikel 132][ref2]. Het pensioenfonds kan, rekening houdend met de specifieke situatie van
      het pensioenfonds en in het belang van aanspraak- en pensioengerechtigden, een andere termijn hanteren voor het
      geactualiseerd herstelplan indien de toezichthouder daarmee instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel132
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '132'
        hoofdstuk: '6'
  - number: '139.3'
    text: |-
      [Artikel 138, vierde tot en met achtste lid][ref1], is van toepassing op de geactualiseerde herstelplannen. Op het
      moment dat het geactualiseerde herstelplan ingaat vervangt dit een eerder vastgesteld herstelplan of geactualiseerd
      herstelplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel138
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
  - number: '139.4'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel139
  - number: '140.1'
    text: |-
      Indien de beleidsdekkingsgraad in een situatie als bedoeld in [artikel 138, eerste lid][ref1], of vastgesteld
      op grond van artikel 138, zevende lid, zes maal opeenvolgend ligt onder de bij of krachtens [artikel 131][ref2]
      gestelde eisen ten aanzien van het minimaal vereist eigen vermogen en de dekkingsgraad bij die laatste vaststelling
      ook onder dat niveau ligt neemt het pensioenfonds binnen zes maanden maatregelen waardoor de dekkingsgraad van het
      pensioenfonds direct voldoet aan artikel 131. Voor zover het bij de maatregelen vermindering van pensioenaanspraken
      en pensioenrechten betreft worden deze direct in de technische voorzieningen verwerkt en ofwel direct doorgevoerd,
      ofwel in beginsel evenredig gespreid in de tijd gedurende maximaal de termijn die wordt gebruikt voor het
      herstelplan dat is opgesteld na constatering van de situatie, bedoeld in de eerste zin.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel131
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '131'
        hoofdstuk: '6'
  - number: '140.2'
    text: |-
      Voor een pensioenfonds dat bijdragen ontvangt van een in een andere lidstaat gevestigde bijdragende onderneming
      geldt in plaats van het in het eerste lid genoemde aantal van zes een aantal van twee.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel140
  - number: '140.3'
    text: |-
      Indien een pensioenfonds in de situatie, bedoeld in het eerste lid, maatregelen heeft genomen waardoor de
      dekkingsgraad direct voldoet aan [artikel 131][ref1], begint voor de volgende toepassing van het eerste lid een
      nieuwe termijn. Indien een pensioenfonds in de situatie, bedoeld in het eerste lid, geen maatregelen heeft genomen
      omdat bij de laatste vaststelling van de beleidsdekkingsgraad de dekkingsgraad niet onder het minimaal vereist
      eigen vermogen lag, is het eerste lid van overeenkomstige toepassing bij iedere volgende vaststelling van de
      beleidsdekkingsgraad op grond van [artikel 138, zevende lid][ref2], totdat de beleidsdekkingsgraad ligt op of boven
      het niveau van het minimaal vereist eigen vermogen of de beleidsdekkingsgraad en de dekkingsgraad liggen onder
      dat niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel138
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '131'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
  - number: '140.4'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel140
  - number: '141.1'
    text: |-
      De toezichthouder kan, rekening houdend met de specifieke situatie van het pensioenfonds en in het belang van de
      aanspraak- en pensioengerechtigden, op aanvraag van een pensioenfonds geheel of gedeeltelijk, ontheffing verlenen
      van het bij of krachtens de [artikelen 131][ref1], [132][ref2], [134, eerste lid, onderdeel a][ref3], [137][ref4],
      [138][ref5], [139][ref6] en [140][ref7] bepaalde, indien het pensioenfonds aantoont dat daaraan redelijkerwijs niet
      kan worden voldaan en dat de doeleinden die deze artikelen beogen te bereiken anderszins worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel132
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel134
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel137
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel138
      [ref6]: https://wetten.overheid.nl/BWBR0020809#Artikel139
      [ref7]: https://wetten.overheid.nl/BWBR0020809#Artikel140
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '131'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '132'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '134'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '137'
        hoofdstuk: '6'
      - id: ref5
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
      - id: ref6
        bwb_id: BWBR0020809
        artikel: '139'
        hoofdstuk: '6'
      - id: ref7
        bwb_id: BWBR0020809
        artikel: '140'
        hoofdstuk: '6'
  - number: '141.2'
    text: |-
      In afwijking van het eerste lid kan de toezichthouder geen ontheffing verlenen van [artikel 138, vierde lid][ref1],
      en [artikel 140, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel140
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '140'
        hoofdstuk: '6'
  - number: '141.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld waaraan de houder van een ontheffing
      dient te voldoen en met betrekking tot het verlenen van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel141
  - number: '142'
    text: |-
      Bij regeling van Onze Minister, na overleg met de toezichthouder, kan vrijstelling worden verleend van de in
      [artikel 138][ref1] genoemde termijn van tien jaar en het in [artikel 140][ref2] genoemde aantal van zes, indien
      er sprake is van een uitzonderlijke economische situatie waardoor een groot aantal pensioenfondsen niet kan voldoen
      aan de bij of krachtens deze wet gestelde vereisten inzake het vereist eigen vermogen en het minimaal vereist eigen
      vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel140
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '140'
        hoofdstuk: '6'
  - number: '143.1'
    text: Een pensioenfonds richt zijn organisatie zodanig in dat deze een beheerste en integere bedrijfsvoering waarborgt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel143
  - number: '143.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het eerste lid. De regels
      hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel143
  - number: 143.2.a
    text: het beheersen van bedrijfsprocessen en bedrijfsrisico’s;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel143
  - number: 143.2.b
    text: integriteit;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel143
  - number: 143.2.c
    text: 'de soliditeit van het pensioenfonds, waaronder wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel143
  - number: 143.2.c.1°
    text: het beheersen van financiële risico’s; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel143
  - number: 143.2.c.2°
    text: het beheersen van andere risico’s die de soliditeit van het pensioenfonds kunnen aantasten;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel143
  - number: 143.2.d
    text: het beheersen van de financiële positie over de lange termijn door periodiek een haalbaarheidstoets te maken.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel143
  - number: 143a.1
    text: Een pensioenfonds beschikt over een risicobeheerfunctie, interne auditfunctie en actuariële functie.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel143a
  - number: 143a.2
    text: |-
      De houders van de risicobeheerfunctie, interne auditfunctie of actuariële functie rapporteren materiële bevindingen
      en aanbevelingen op het gebied dat onder hun verantwoordelijkheid valt aan het bestuur van het pensioenfonds.
      Indien de houder van de risicobeheerfunctie, interne auditfunctie of actuariële functie tevens bestuurder is van
      het pensioenfonds worden de materiële bevindingen en aanbevelingen ook gerapporteerd aan de raad van toezicht of
      de visitatiecommissie.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel143a
  - number: 143a.3
    text: |-
      De houders van de risicobeheerfunctie, interne auditfunctie of actuariële functie melden het de toezichthouder
      zo spoedig mogelijk indien het bestuur van het pensioenfonds niet tijdig passende corrigerende maatregelen treft,
      nadat het bestuur op grond van het tweede lid op de hoogte is gesteld van:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel143a
  - number: 143a.3.a
    text: |-
      een substantieel risico dat het pensioenfonds niet aan een bij of krachtens de wet gesteld vereiste van
      significante betekenis zal voldoen en dit ernstige gevolgen kan hebben voor de belangen van deelnemers, gewezen
      deelnemers, andere aanspraakgerechtigden of pensioengerechtigden; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel143a
  - number: 143a.3.b
    text: |-
      een significante inbreuk op de voor het pensioenfonds en haar activiteiten geldende bij of krachtens de wet
      gestelde vereisten.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel143a
  - number: 143a.4
    text: |-
      Het pensioenfonds draagt er zorg voor dat de houder van de risicobeheerfunctie, interne auditfunctie of
      actuariële functie die op grond van het derde lid te goeder trouw en naar behoren een melding heeft gedaan bij de
      toezichthouder als gevolg van deze melding niet wordt benadeeld.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel143a
  - number: 143a.5
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel143a
  - number: 143b
    text: De toezichthouder kan een pensioenfonds de verplichting opleggen om een stresstest uit te voeren.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel143b
  - number: '144.1'
    text: |-
      Bij algemene maatregel van bestuur worden, ten behoeve van de berekeningen noodzakelijk voor de uitvoering van een
      pensioenregeling, regels gesteld over:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel144
  - number: 144.1.a
    text: het minimale percentage van het gemiddelde loon- of prijsindexcijfer;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel144
  - number: 144.1.b
    text: het maximaal te hanteren gemiddelde rendement op vastrentende waarden;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel144
  - number: 144.1.c
    text: de maximaal te hanteren risicopremies op onder andere aandelen en onroerend goed; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel144
  - number: 144.1.d
    text: een uniforme set met economische scenario’s.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel144
  - number: '144.2'
    text: |-
      De in het eerste lid bedoelde regels worden uiterlijk iedere vijf jaren getoetst, rekening houdend met financieel-
      economische ontwikkelingen in het verleden en realistische inzichten ten aanzien van toekomstige financieel-
      economische verwachtingen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel144
  - number: '144.3'
    text: |-
      Ten behoeve van de toetsing, bedoeld in het tweede lid, stelt Onze Minister een commissie in met toepassing van
      [artikel 6 van de Kaderwet adviescolleges][ref1]. Onze Minister kan tevens het oordeel van de commissie vragen
      over de toepassing van de rentetermijnstructuur bij rentes met een lange looptijd.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel6
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '6'
  - number: '144.4'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel144
  - number: '145.1'
    text: |-
      Het pensioenfonds stelt een actuariële en bedrijfstechnische nota vast waarin in elk geval een omschrijving
      is opgenomen van de wijze waarop uitvoering wordt gegeven aan het bij of krachtens de [artikelen 25][ref1],
      [126 tot en met 137][ref2] en [143][ref3] bepaalde en de wijze waarop uitvoering wordt gegeven aan de regels ten
      aanzien van de solidariteitsreserve of de risicodelingsreserve, de toedelingsregels, het projectierendement of
      de vaste daling en de risicohouding. De actuariële en bedrijfstechnische nota bevat voorts een verklaring inzake
      beleggingsbeginselen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel126
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel143
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '126'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '143'
        hoofdstuk: '6'
  - number: '145.2'
    text: 'De actuariële en bedrijfstechnische nota van een pensioenfonds bevat verder:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel145
  - number: 145.2.a
    text: |-
      een beschrijving van de wijze waarop het pensioenfonds voorkomt dat de voor pensioen bestemde vermogens, de
      solidariteitsreserve of de risicodelingsreserve negatief kunnen worden;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel145
  - number: 145.2.b
    text: |-
      een financieel crisisplan waarin het pensioenfonds beschrijft welke maatregelen ingezet kunnen worden in de
      situatie dat niet aan de vereisten gesteld bij of krachtens [artikel 132][ref1] zal worden voldaan en welke
      maatregelen ingezet kunnen worden in de situatie, bedoeld in [artikel 140, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel140
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '132'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '140'
        hoofdstuk: '6'
  - number: 145.2.c
    text: |-
      het niveau van de beleidsdekkingsgraad vanaf welke premiekortingen en terugstortingen als bedoeld in
      [artikel 129][ref1] zijn toegestaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel129
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '129'
        hoofdstuk: '6'
  - number: 145.2.d
    text: een beschrijving van de overige sturingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel145
  - number: '145.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de actuariële en
      bedrijfstechnische nota.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel145
  - number: '145.4'
    text: |-
      Voorzover risico’s zijn overgedragen, verzekerd of ondergebracht kan de omschrijving, bedoeld in het eerste lid,
      beperkt blijven tot een verwijzing naar hetgeen daarover in de betreffende overeenkomsten is opgenomen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel145
  - number: '145.5'
    text: |-
      De verklaring inzake beleggingsbeginselen wordt om de drie jaren en voorts onverwijld na iedere belangrijke
      wijziging van het beleggingsbeleid herzien.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel145
  - number: '146.1'
    text: |-
      Een pensioenfonds met zetel in Nederland stelt binnen zes maanden na afloop van het boekjaar de jaarrekening en
      het bestuursverslag overeenkomstig [titel 9, Boek 2 van het Burgerlijk Wetboek][ref1] vast, met dien verstande
      dat [artikel 390 van genoemd wetboek][ref2] niet van toepassing is en dat de in [artikel 360, derde lid][ref3],
      [396][ref4] en [397 van genoemd wetboek][ref5] geformuleerde uitzonderingen niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel390
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel360
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel396
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel397
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '390'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '360'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '396'
      - id: ref5
        bwb_id: BWBR0003045
        artikel: '397'
  - number: '146.2'
    text: |-
      Een algemeen pensioenfonds beschrijft ieder afgescheiden vermogen afzonderlijk in de jaarrekening en het
      bestuursverslag.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel146
  - number: '147.1'
    text: Een pensioenfonds doet het boekjaar gelijk lopen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel147
  - number: '147.2'
    text: |-
      Een pensioenfonds verstrekt periodiek binnen de daartoe vastgestelde termijnen staten aan de toezichthouder die de
      toezichthouder nodig heeft voor de juiste uitoefening van zijn taak, bedoeld in [artikel 151][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel151
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '151'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '147.3'
    text: |-
      De actuariële staten zijn gewaarmerkt door een bevoegd actuaris. Bij de actuariële staten hoort een actuarieel
      verslag voorzien van een verklaring van een actuaris.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel147
  - number: '147.4'
    text: |-
      Met zijn verklaring bedoeld in het derde lid bevestigt de actuaris dat hij zich ervan heeft overtuigd dat voldaan
      is aan de [artikelen 126 tot en met 140][ref1], de correcte toepassing van de toedelingsregels en de regels ten
      aanzien van de risicohouding. Hij is bevoegd zijn verklaring nader toe te lichten of op enig punt een voorbehoud
      te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel126
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '126'
        hoofdstuk: '6'
  - number: '147.5'
    text: |-
      De staten zijn periodiek voorzien van een verklaring omtrent de getrouwheid, afgegeven door een accountant. Ten
      bewijze dat de staten door hem zijn onderzocht, waarmerkt de accountant de staten.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel147
  - number: '147.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald welke staten worden verstrekt en worden regels
      gesteld met betrekking tot de inhoud en de modellen van de staten en de wijze, de periodiciteit en de termijnen van
      de verstrekking.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel147
  - number: '148.1'
    text: |-
      De bevoegde actuaris die het actuarieel verslag waarmerkt, is onafhankelijk van het pensioenfonds en verricht geen
      andere werkzaamheden voor het pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel148
  - number: '148.2'
    text: |-
      Het is de waarmerkende actuaris niet toegestaan de werkzaamheden, bedoeld in [artikel 147, vierde lid][ref1],
      uit te oefenen voor een pensioenfonds wanneer een andere actuaris of andere deskundige die behoort tot dezelfde
      organisatie als de waarmerkende actuaris, andere werkzaamheden verricht voor hetzelfde pensioenfonds, tenzij
      de organisatie van de waarmerkende actuaris een door de toezichthouder goedgekeurde gedragscode heeft over de
      onafhankelijkheid van de waarmerkende actuaris.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel147
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '147'
        hoofdstuk: '6'
  - number: '148.3'
    text: |-
      In afwijking van het eerste lid kan de waarmerkende actuaris andere werkzaamheden voor het pensioenfonds
      verrichten, voor zover het gaat om werkzaamheden van de actuariële functie.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel148
  - number: 148a
    text: |-
      Een pensioenfonds kan niet overgaan tot verzekering bij een verzekeraar indien de verzekering gebaseerd is op een
      kapitaalcontract. Een kapitaalcontract is een overeenkomst tussen een pensioenfonds en een verzekeraar waarbij
      geldt dat:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel148a
  - number: 148a.a
    text: risico’s van het pensioenfonds gedurende de contractsperiode worden verzekerd;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel148a
  - number: 148a.b
    text: |-
      de daarbij behorende pensioenaanspraken en pensioenrechten na afloop van de contractsperiode niet op verzoek van
      het pensioenfonds premievrij bij de verzekeraar achter kunnen worden gelaten; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel148a
  - number: 148a.c
    text: |-
      de waarden die behoren bij het ouderdomspensioen of nabestaandenpensioen op kapitaalbasis gedurende de
      contractsperiode geheel of gedeeltelijk in juridisch eigendom van de verzekeraar zijn.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel148a
  - number: '149'
    text: |-
      De toezichthouder kan een pensioenfonds de verplichting opleggen om binnen een door de toezichthouder te stellen
      termijn over te gaan tot verzekering bij een verzekeraar, overdracht aan een verzekeraar of onderbrenging bij een
      pensioenfonds indien dit naar het oordeel van de toezichthouder noodzakelijk is in verband met:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel149
  - number: 149.a
    text: de actuariële en bedrijfstechnische opzet van het pensioenfonds; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel149
  - number: 149.b
    text: de deskundigheid en betrouwbaarheid van het bestuur.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel149
  - number: '150'
    text: |-
      Wanneer een pensioenregeling eindigt en er geen sprake meer is van verwerving van pensioen tijdens een periode
      waarin de beleidsdekkingsgraad van het pensioenfonds ligt onder de bij of krachtens [artikel 131][ref1] gestelde
      eisen ten aanzien van het minimaal vereist eigen vermogen:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel131
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '131'
        hoofdstuk: '6'
  - number: 150.a
    text: stelt het pensioenfonds de toezichthouder hiervan op de hoogte;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150
  - number: 150.b
    text: |-
      gaat het pensioenfonds binnen een door de toezichthouder te stellen termijn over tot het verzekeren bij een
      verzekeraar, overdragen aan een verzekeraar of onderbrengen bij een pensioenfonds van de pensioenverplichtingen op
      basis van een procedure welke ter kennis en instemming van de toezichthouder wordt gebracht; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150
  - number: 150.c
    text: |-
      stelt het pensioenfonds een algemeen overzicht van de procedure, bedoeld in onderdeel b, beschikbaar voor de
      deelnemers, gewezen deelnemers en pensioengerechtigden of de vertegenwoordigers van de genoemde personen in
      overeenstemming met het vertrouwelijkheidbeginsel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150
  - number: 150a.1
    text: |-
      Bij algemene maatregel van bestuur kan bij wijze van experiment, met het oog op het onderzoeken van de effecten
      van de mogelijkheid om een pensioenregeling aan zelfstandigen aan te bieden ten einde het sparen voor de oude dag
      onder zelfstandigen te stimuleren, worden afgeweken van het bepaalde bij of krachtens de [artikelen 17][ref1],
      [65][ref2], [70][ref3], [117][ref4] en [120 van deze wet][ref5]. Bij toepassing van de eerste zin wordt bij
      algemene maatregel van bestuur geregeld op welke wijze en gedurende welke periode van welke artikelen van de wet
      wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel70
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel117
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel120
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '65'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '70'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '117'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref5
        bwb_id: BWBR0020809
        artikel: '120'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 150a.2
    text: |-
      Een experiment als bedoeld in het eerste lid duurt ten hoogste vijf jaar. Indien, voor een experiment is afgelopen,
      een voorstel van wet is ingediend bij de Staten-Generaal om het experiment om te zetten in een structurele
      wettelijke regeling, kan het experiment worden verlengd tot het tijdstip waarop het voorstel van wet in werking
      treedt dan wel tot het tijdstip waarop duidelijk is dat het voorstel van wet niet in werking treedt. Het eerste
      lid, tweede zin, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150a
  - number: 150a.3
    text: |-
      Onverminderd het eerste lid is deze wet met uitzondering van de [artikelen 7][ref1] en [9][ref2] van
      overeenkomstige toepassing op de zelfstandige die deelneemt in een pensioenregeling die wordt uitgevoerd in het
      kader van een experiment als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel9
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 150a.4
    text: |-
      Bij de uitvoering van een experiment als bedoeld in het eerste lid kan de pensioenuitvoerder persoonsgegevens van
      gewezen deelnemers uitsluitend voor het in het eerste lid omschreven doel verwerken.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150a
  - number: 150a.5
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen regels worden gesteld
      met betrekking tot de uitvoering van een experiment en voorzieningen worden getroffen voor zich gedurende een
      experiment voordoende onvoorziene gevallen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150a
  - number: 150a.6
    text: |-
      Onze Minister zendt uiterlijk negen maanden voor het einde van de werkingsduur van een algemene maatregel van
      bestuur als bedoeld in het eerste lid aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten
      van het experiment in de praktijk alsmede een standpunt inzake de voortzetting ervan anders dan als experiment.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150a
  - number: 150a.7
    text: |-
      De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150a
  - number: 150b.1
    text: 'Dit hoofdstuk is van toepassing, indien:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150b
  - number: 150b.1.a
    text: |-
      op de dag voorafgaand aan het tijdstip van inwerkingtreding van de [Wet toekomst pensioenen][ref1] een
      pensioenovereenkomst gold;


      [ref1]: https://wetten.overheid.nl/BWBR0048328
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150b
    references:
      - id: ref1
        bwb_id: BWBR0048328
  - number: 150b.1.b
    text: |-
      de pensioenovereenkomst wordt gewijzigd met als doel om te voldoen aan het nieuwe kader zoals geïntroduceerd met de
      [Wet toekomst pensioenen][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0048328
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150b
    references:
      - id: ref1
        bwb_id: BWBR0048328
  - number: 150b.1.c
    text: |-
      er geen gebruik wordt gemaakt van het overgangsrecht, bedoeld in [artikel 220e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel220e
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 220e
        hoofdstuk: '9'
  - number: 150b.2
    text: |-
      Voor de toepassing van dit hoofdstuk wordt onder werkgever mede verstaan de partijen die de wijziging van de
      pensioenregeling overeenkomen of zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150b
  - number: 150b.3
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de risico-neutrale economische scenario’s die
      worden gebruikt bij de berekening van de transitie-effecten, bedoeld in [artikel 150e, vijfde lid][ref1], en de
      collectieve waardeoverdracht indien gebruik wordt gemaakt van de vba-methode, bedoeld in [artikel 150n][ref2].
      Voordat de voordracht van de algemene maatregel van bestuur wordt gedaan vraagt Onze Minister het oordeel van de
      commissie, bedoeld in [artikel 144, derde lid][ref3]. De voordracht voor deze algemene maatregel van bestuur wordt
      niet eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150e
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel150n
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel144
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150e
        hoofdstuk: 6b
        paragraaf: 6b.3
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 150n
        hoofdstuk: 6b
        paragraaf: 6b.5
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '144'
        hoofdstuk: '6'
  - number: 150b.4
    text: |-
      [Artikel 144, eerste lid][ref1], is van toepassing op de berekeningen, bedoeld in dit hoofdstuk met uitzondering
      van de berekeningen waarvoor de risico-neutrale scenario’s worden gebruikt, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel144
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '144'
        hoofdstuk: '6'
  - number: 150c.1
    text: |-
      Ten behoeve van de wijziging van de pensioenovereenkomst en de uitvoering daarvan door een pensioenfonds wordt
      voldaan aan de volgende mijlpalen:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150c
  - number: 150c.1.a
    text: de werkgever zendt de gewijzigde pensioenovereenkomst en het transitieplan aan het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150c
  - number: 150c.1.b
    text: het pensioenfonds dient het implementatieplan met inbegrip van het communicatieplan in bij de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150c
  - number: 150c.2
    text: |-
      Ten behoeve van de wijziging van de pensioenovereenkomst en de uitvoering daarvan door een verzekeraar of
      premiepensioeninstelling wordt voldaan aan de volgende mijlpalen:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150c
  - number: 150c.2.a
    text: |-
      de werkgever zendt de gewijzigde pensioenovereenkomst en het transitieplan aan de verzekeraar of de
      premiepensioeninstelling;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150c
  - number: 150c.2.b
    text: |-
      de verzekeraar of premiepensioeninstelling dient het implementatieplan met inbegrip van het communicatieplan in bij
      de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150c
  - number: 150c.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld voor de tijdstippen waarin voldaan is
      aan de mijlpalen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150c
  - number: 150d.1
    text: |-
      In het transitieplan legt de werkgever de keuzes, overwegingen en berekeningen die ten grondslag liggen aan de
      wijziging van de pensioenovereenkomst en de wijze waarop wordt omgegaan met opgebouwde pensioenaanspraken en
      pensioenrechten schriftelijk vast, alsmede de verantwoording waarom sprake is van een evenwichtige transitie.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150d
  - number: 150d.2
    text: 'Het transitieplan bevat in ieder geval de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150d
  - number: 150d.2.a
    text: |-
      het karakter van de gewijzigde pensioenovereenkomst, bedoeld in [artikel 10, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel10
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150d
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 150d.2.b
    text: de wijze waarop wordt omgegaan met opgebouwde pensioenaanspraken en pensioenrechten;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150d
  - number: 150d.2.c
    text: |-
      de effecten van de wijziging van de pensioenovereenkomst en de wijze waarop wordt omgegaan met opgebouwde
      pensioenaanspraken en pensioenrechten voor deelnemers, gewezen deelnemers, gewezen partners en pensioengerechtigden
      berekend op de wijze vastgelegd in [artikel 150e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150e
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150d
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150e
        hoofdstuk: 6b
        paragraaf: 6b.3
  - number: 150d.2.d
    text: de gemaakte afspraken over compensatie;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150d
  - number: 150d.2.e
    text: |-
      indien afspraken zijn gemaakt over compensatie in de vorm van het toekennen van extra pensioenaanspraken aan
      deelnemers, het financieringsplan voor deze compensatie waarbij inzichtelijk wordt gemaakt in welke mate elke bron
      ingezet zal worden; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150d
  - number: 150d.2.f
    text: |-
      voor zover van toepassing, de gemaakte afspraken over de initiële vulling van de solidariteitsreserve of
      risicodelingsreserve.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150d
  - number: 150d.3
    text: |-
      De werkgever zendt het transitieplan binnen twee weken na de afronding aan de pensioenuitvoerder. De
      pensioenuitvoerder stelt het transitieplan op zijn website beschikbaar voor de deelnemer, gewezen deelnemer,
      gewezen partner en pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150d
  - number: 150d.4
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150d
  - number: 150e.1
    text: |-
      De transitie-effecten van de wijziging van de pensioenovereenkomst en de wijze waarop wordt omgegaan met opgebouwde
      pensioenaanspraken en pensioenrechten worden in ieder geval berekend door:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150e
  - number: 150e.1.a
    text: |-
      het netto profijt van het ongewijzigd voortzetten van de pensioenovereenkomst af te zetten tegen het netto profijt
      van het wijzigen van de pensioenovereenkomst en de wijze waarop wordt omgegaan met opgebouwde pensioenaanspraken en
      pensioenrechten; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150e
  - number: 150e.1.b
    text: |-
      de pensioenverwachting bij ongewijzigd voortzetten van de pensioenovereenkomst te vergelijken met de
      pensioenverwachting bij wijziging van de pensioenovereenkomst en de wijze waarop wordt omgegaan met opgebouwde
      pensioenaanspraken en pensioenrechten, waarbij de pensioenverwachting, voor zover het ouderdomspensioen betreft,
      wordt weergegeven op basis van een pessimistisch scenario, een verwacht scenario en een optimistisch scenario.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150e
  - number: 150e.2
    text: |-
      Het netto profijt is het verschil tussen de marktwaarde van de te verwachten pensioenuitkeringen en de marktwaarde
      van de toekomstige premie-inleg.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150e
  - number: 150e.3
    text: |-
      In afwijking van het eerste lid, onderdeel a, worden de effecten van de wijziging van de pensioenovereenkomst en
      de wijze waarop wordt omgegaan met opgebouwde pensioenaanspraken en pensioenrechten berekend door het bruto profijt
      van het ongewijzigd voortzetten van de pensioenovereenkomst af te zetten tegen het bruto profijt van het wijzigen
      van de pensioenovereenkomst en de wijze waarop wordt omgegaan met opgebouwde pensioenaanspraken en pensioenrechten,
      indien:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150e
  - number: 150e.3.a
    text: |-
      de pensioenovereenkomst voor de wijziging het karakter heeft van een premieovereenkomst of een kapitaalovereenkomst
      als bedoeld in [artikel 1][ref1], zoals dat artikel luidde op de dag voorafgaand aan het tijdstip van
      inwerkingtreding van de [Wet toekomst pensioenen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0048328
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150e
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0048328
  - number: 150e.3.b
    text: |-
      de pensioenovereenkomst na de wijziging het karakter heeft van een flexibele premieovereenkomst zonder
      risicodelingsreserve of een premie-uitkeringsovereenkomst; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150e
  - number: 150e.3.c
    text: |-
      geen gebruik wordt gemaakt van het overgangsrecht, bedoeld in [artikel 220e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel220e
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150e
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 220e
        hoofdstuk: '9'
  - number: 150e.4
    text: Het bruto profijt is de contante waarde van de toekomstige premie-inleg.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150e
  - number: 150e.5
    text: |-
      De pensioenuitvoerder stelt op de website een kwalitatieve toelichting op de transitie-effecten beschikbaar en
      verstrekt de deelnemer, gewezen deelnemer, gewezen partner en pensioengerechtigde op verzoek een berekening van de
      transitie-effecten per leeftijdscohort.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150e
  - number: 150e.6
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150e
  - number: 150e.7
    text: |-
      Bij algemene maatregel van bestuur kunnen kwantitatieve voorwaarden worden gesteld met betrekking tot de transitie-
      effecten, bedoeld in het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150e
  - number: 150e.8
    text: |-
      De voordracht voor een krachtens het zevende lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150e
  - number: 150f.1
    text: |-
      Indien een pensioenovereenkomst afspraken bevat over compensatie in de vorm van het toekennen van extra
      pensioenaanspraken, wordt voldaan aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150f
  - number: 150f.1.a
    text: |-
      de werknemer heeft recht op compensatie als voor het leeftijdscohort waartoe de werknemer behoort compensatie
      is overeengekomen in de pensioenovereenkomst, waarbij niet is vereist dat de werknemer bij aanvang van de
      compensatieperiode reeds werkzaam was bij de werkgever;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150f
  - number: 150f.1.b
    text: |-
      de compensatie wordt tijdsevenredig aan de werknemer toegekend over de compensatieperiode, die aanvangt op de
      ingangsdatum van de gewijzigde pensioenovereenkomst en uiterlijk 31 december 2036 eindigt; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150f
  - number: 150f.1.c
    text: de compensatie is gefinancierd op het moment dat de compensatie onvoorwaardelijk wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150f
  - number: 150f.2
    text: |-
      In aanvulling op de [artikelen 38, eerste lid][ref1], en [39, eerste lid][ref2], verstrekt de pensioenuitvoerder
      voor zover van toepassing de deelnemer jaarlijks en bij beëindiging van de deelneming informatie over de
      compensatieperiode en de mogelijke effecten voor compensatie bij beëindiging van de deelneming en het aangaan van
      een nieuwe pensioenovereenkomst. De pensioenuitvoerder stelt deze informatie tevens op zijn website beschikbaar
      voor de deelnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel39
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150f
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '39'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 150f.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de gewezen werknemer die op grond van de pensioenovereenkomst
      recht heeft op premievrije voortzetting.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150f
  - number: 150g.1
    text: |-
      Indien de pensioenovereenkomst is ondergebracht bij een pensioenfonds stelt de werkgever, voor zover van
      toepassing, een vereniging van gewezen deelnemers die aantoont een substantieel gedeelte van alle gewezen
      deelnemers van het pensioenfonds te vertegenwoordigen of een vereniging van pensioengerechtigden die aantoont een
      substantieel gedeelte van alle pensioengerechtigden van het pensioenfonds te vertegenwoordigen in de gelegenheid
      een oordeel uit te spreken over het transitieplan. Het oordeel wordt op een zodanig tijdstip gevraagd dat het van
      invloed kan zijn op de inhoud van het transitieplan en de daarin verantwoorde keuzes. Indien een oordeel gegeven
      wordt, geeft de werkgever aan wat met het oordeel gedaan is.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150g
  - number: 150g.2
    text: |-
      Onverminderd [artikel 115h][ref1] is een pensioenfonds gehouden om op verzoek van gewezen deelnemers of een
      vereniging van gewezen deelnemers mee te werken aan de verstrekking van informatie aan de gewezen deelnemers van
      het fonds over het voornemen tot oprichting, of over het bestaan, van een vereniging van gewezen deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel115h
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150g
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 115h
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 150g.3
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over in ieder
      geval de voorwaarde dat een vereniging van gewezen deelnemers dan wel vereniging van pensioengerechtigden een
      substantieel gedeelte van de gewezen deelnemers respectievelijk pensioengerechtigden dient te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150g
  - number: 150h.1
    text: Er is een onafhankelijke transitiecommissie.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150h
  - number: 150h.2
    text: |-
      De transitiecommissie heeft tot taak het bemiddelen tussen partijen die een pensioenovereenkomst sluiten, indien
      deze partijen daartoe gezamenlijk een verzoek doen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150h
  - number: 150h.3
    text: |-
      De transitiecommissie heeft tot taak het adviseren van partijen die een pensioenovereenkomst sluiten, indien
      deze partijen daartoe gezamenlijk een verzoek doen en zij overeenkomen zich te binden aan het advies van de
      transitiecommissie.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150h
  - number: 150h.4
    text: |-
      Bij of krachtens algemene maatregel worden nadere regels gesteld met betrekking tot dit artikel, waarbij onder meer
      wordt geregeld voor welk tijdstippen een verzoek wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150h
  - number: 150i.1
    text: |-
      In het implementatieplan legt de pensioenuitvoerder schriftelijk vast op welke wijze voorbereidingen worden
      getroffen voor de uitvoering van de gewijzigde pensioenovereenkomst en invulling zal worden gegeven aan de
      uitvoering van de gewijzigde pensioenovereenkomst, alsmede de wijze waarop zal worden omgegaan met opgebouwde
      pensioenaanspraken en pensioenrechten.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150i
  - number: 150i.2
    text: 'Het implementatieplan bevat in ieder geval de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150i
  - number: 150i.2.a
    text: de technische uitvoerbaarheid van de pensioenovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150i
  - number: 150i.2.b
    text: de kosten die verband houden met de uitvoering van de pensioenovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150i
  - number: 150i.2.c
    text: de risico’s die verband houden met de uitvoering van de pensioenovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150i
  - number: 150i.2.d
    text: de risicobeheersmaatregelen die worden getroffen in verband met de uitvoering van de pensioenovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150i
  - number: 150i.2.e
    text: de wijze waarop zal worden omgegaan met opgebouwde pensioenaanspraken en pensioenrechten;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150i
  - number: 150i.2.f
    text: |-
      de wijze waarop uitvoering zal worden gegeven aan de pensioenovereenkomst met inachtneming van de toepasselijke
      wet- en regelgeving, waaronder de gelijkebehandelingswetgeving;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150i
  - number: 150i.2.g
    text: een communicatieplan; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150i
  - number: 150i.2.h
    text: |-
      indien van toepassing, de effecten van het toepassen van het financieel toetsingskader tijdens de transitie en
      van toeslagverlening tussen 1 juli 2022 en de aanvang van de transitie op grond van de verwachting dat zal worden
      overgegaan tot een collectieve waardeoverdracht als bedoeld in [artikel 150m][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150i
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150m
        hoofdstuk: 6b
        paragraaf: 6b.5
  - number: 150i.3
    text: |-
      Indien het implementatieplan wordt opgesteld door een pensioenfonds legt het pensioenfonds tevens vast, voor
      zover van toepassing, op welke wijze voorbereidingen worden getroffen voor en invulling zal worden gegeven aan de
      uitvoering van een besluit als bedoeld in [artikel 150n][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150n
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150i
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150n
        hoofdstuk: 6b
        paragraaf: 6b.5
  - number: 150i.4
    text: |-
      De pensioenuitvoerder stelt per pensioenregeling een implementatieplan op. In afwijking van de eerste zin kan een
      implementatieplan zich uitstrekken tot meerdere pensioenregelingen, voor zover de pensioenregelingen:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150i
  - number: 150i.4.a
    text: 'bij uitvoering door een pensioenfonds: behoren tot hetzelfde financieel geheel; en'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150i
  - number: 150i.4.b
    text: |-
      bij uitvoering door verzekeraars of premiepensioeninstellingen: dezelfde karakteristieken hebben en gebaseerd zijn
      op hetzelfde producttype.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150i
  - number: 150i.5
    text: |-
      De pensioenuitvoerder dient het implementatieplan binnen twee weken na de afronding in bij de toezichthouder. De
      pensioenuitvoerder stelt het implementatieplan op zijn website beschikbaar voor de deelnemer, gewezen deelnemer,
      gewezen partner en pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150i
  - number: 150i.6
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150i
  - number: 150j.1
    text: |-
      In het communicatieplan, bedoeld in [artikel 150i, tweede lid, onderdeel g][ref1], legt de pensioenuitvoerder
      schriftelijk vast dat en op welke wijze de informatieverstrekking aan deelnemers, gewezen deelnemers,
      gewezen partners en pensioengerechtigden wordt ingevuld, en gaat daarbij ten minste in op de voor deelnemers,
      gewezen deelnemers, gewezen partners en pensioengerechtigden relevante gevolgen van de wijziging van de
      pensioenovereenkomst en de wijze waarop wordt omgegaan met opgebouwde pensioenaanspraken en pensioenrechten.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150i
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150j
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150i
        hoofdstuk: 6b
        paragraaf: 6b.4
  - number: 150j.2
    text: |-
      Het communicatieplan bevat in ieder geval de wijze waarop deelnemers, gewezen deelnemers, gewezen partners en
      pensioengerechtigden, voor zover van toepassing, worden geïnformeerd over:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150j
  - number: 150j.2.a
    text: |-
      de hoogte van het reglementair te bereiken pensioen, de opgebouwde pensioenaanspraken of het pensioenrecht met
      en zonder wijziging van de pensioenovereenkomst, waarbij bij de informatie over de hoogte met wijziging van
      de pensioenovereenkomst rekening is gehouden met de effecten van de wijze waarop wordt omgegaan met opgebouwde
      pensioenaanspraken en pensioenrechten. Voor zover de informatie betrekking heeft op het reglementair te bereiken
      ouderdomspensioen voor deelnemers of de opgebouwde aanspraken op ouderdomspensioen voor gewezen deelnemers,
      wordt deze informatie tevens weergegeven op basis van een pessimistisch scenario, een verwacht scenario en een
      optimistisch scenario;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150j
  - number: 150j.2.b
    text: |-
      de mate waarin het verwacht scenario voor het reglementair te bereiken ouderdomspensioen voor deelnemers of de
      opgebouwde aanspraken op ouderdomspensioen voor gewezen deelnemers zich na ingang kan ontwikkelen op basis van een
      pessimistisch scenario, een verwacht scenario en een optimistisch scenario; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150j
  - number: 150j.2.c
    text: |-
      indien afspraken zijn gemaakt over compensatie in de vorm van het toekennen van extra pensioenaanspraken aan
      deelnemers, de inhoud van deze afspraken en het financieringsplan voor de compensatie waarbij inzichtelijk wordt
      gemaakt in welke mate welke bron ingezet zal worden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150j
  - number: 150j.3
    text: |-
      De pensioenuitvoerder verstrekt de informatie, bedoeld in het tweede lid, en de overige relevante informatie
      bij de transitie, aan deelnemers, gewezen deelnemers, gewezen partners en pensioengerechtigden voorafgaand aan
      het tijdstip, bedoeld in [artikel 220i, tweede lid][ref1], op basis van een zo nauwkeurig mogelijke prognose en
      verstrekt na dit tijdstip de informatie, bedoeld in het tweede lid, zoals die definitief is vastgesteld, waarbij de
      pensioenuitvoerder de verschillen tussen de prognose en de vastgestelde informatie toelicht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel220i
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150j
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 220i
        hoofdstuk: '9'
  - number: 150j.4
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150j
  - number: 150k
    text: |-
      In aanvulling op [artikel 25][ref1] wordt in de uitvoeringsovereenkomst, voor zover overeengekomen, een regeling
      opgenomen met betrekking tot de toekenning en financiering van de compensatie aan deelnemers door het toekennen van
      extra pensioenaanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel25
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150k
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 150l.1
    text: |-
      De wijze waarop wordt omgegaan met opgebouwde pensioenaanspraken en pensioenrechten als bedoeld in
      [artikel 150d, tweede lid, onderdeel b][ref1], houdt voor pensioenfondsen in dat na de collectieve wijziging van
      de pensioenovereenkomsten door collectieve waardeoverdracht de waarde van de pensioenaanspraken en pensioenrechten
      wordt aangewend bij het pensioenfonds overeenkomstig de gewijzigde pensioenovereenkomsten, tenzij dit onevenredig
      ongunstig zou zijn voor deelnemers, gewezen deelnemers, andere aanspraakgerechtigden, pensioengerechtigden of de
      werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150d
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150l
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150d
        hoofdstuk: 6b
        paragraaf: 6b.3
  - number: 150l.2
    text: |-
      Het besluit van de werkgever om het pensioenfonds niet te verzoeken over te gaan tot collectieve waardeoverdracht
      moet evenwichtig zijn en alle relevante belangen moeten in acht zijn genomen. De onderbouwing van dit besluit wordt
      opgenomen in het transitieplan.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150l
  - number: 150l.3
    text: |-
      Het pensioenfonds meldt de werkgever of de analyse en de onderbouwing voor het afzien van collectieve
      waardeoverdracht wordt gedeeld en informeert het verantwoordingsorgaan, het belanghebbendenorgaan of de raad van
      toezicht.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150l
  - number: 150l.4
    text: |-
      Indien de werkgever een verzoek tot collectieve waardeoverdracht doet, wijst het pensioenfonds het verzoek van de
      werkgever alleen af indien:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150l
  - number: 150l.4.a
    text: sprake is van strijd met wettelijke voorschriften;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150l
  - number: 150l.4.b
    text: |-
      de effecten van de voorgenomen wijzigingen ten aanzien van het pensioen als geheel tot onevenwichtig nadeel zou
      leiden voor deelnemers, gewezen deelnemers, andere aanspraakgerechtigden of pensioengerechtigden; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150l
  - number: 150l.4.c
    text: de waardeoverdracht niet uitvoerbaar is binnen de grenzen van een beheerste en integere bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150l
  - number: 150l.5
    text: |-
      Bij de collectieve waardeoverdracht, bedoeld in dit artikel, is, in afwijking van de [artikelen 20][ref1] en
      [83][ref2], [artikel 150m][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel83
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150l
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '83'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: 150m
        hoofdstuk: 6b
        paragraaf: 6b.5
  - number: 150l.6
    text: |-
      Indien de wijziging van de pensioenovereenkomsten betekent dat een pensioenfonds overgaat van uitvoering
      van een pensioenovereenkomst die het karakter heeft van een uitkeringsovereenkomst als bedoeld in
      [artikel 1][ref1], zoals dat artikel luidde op de dag voorafgaand aan het tijdstip van inwerkingtreding van de
      [Wet toekomst pensioenen][ref2], naar uitvoering van een flexibele premieovereenkomst, legt het pensioenfonds
      binnen een jaar na de collectieve waardeoverdracht, bedoeld in [artikel 150m][ref3], gepensioneerden de
      keuze voor tussen een vastgestelde of variabele uitkering. In afwijking van [artikel 70, derde lid][ref4],
      is [artikel 80][ref5] van overeenkomstige toepassing. De [artikelen 44a][ref6], [47a][ref7], [47b][ref8],
      [47c][ref9] en [63b][ref10] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0048328
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel70
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel80
      [ref6]: https://wetten.overheid.nl/BWBR0020809#Artikel44a
      [ref7]: https://wetten.overheid.nl/BWBR0020809#Artikel47a
      [ref8]: https://wetten.overheid.nl/BWBR0020809#Artikel47b
      [ref9]: https://wetten.overheid.nl/BWBR0020809#Artikel47c
      [ref10]: https://wetten.overheid.nl/BWBR0020809#Artikel63b
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150l
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0048328
      - id: ref3
        bwb_id: BWBR0020809
        artikel: 150m
        hoofdstuk: 6b
        paragraaf: 6b.5
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '70'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref5
        bwb_id: BWBR0020809
        artikel: '80'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref6
        bwb_id: BWBR0020809
        artikel: 44a
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref7
        bwb_id: BWBR0020809
        artikel: 47a
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref8
        bwb_id: BWBR0020809
        artikel: 47b
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref9
        bwb_id: BWBR0020809
        artikel: 47c
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref10
        bwb_id: BWBR0020809
        artikel: 63b
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 150l.7
    text: |-
      Voor zover een pensioenfonds niet overgaat tot een collectieve waardeoverdracht als bedoeld in
      [artikel 150m][ref1], worden de pensioenaanspraken en pensioenrechten die voortvloeien uit de
      pensioenovereenkomsten zoals die luidden voor de wijziging van deze pensioenovereenkomsten aangemerkt als een te
      onderscheiden financieel geheel. [Artikel 125a][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel125a
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150l
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150m
        hoofdstuk: 6b
        paragraaf: 6b.5
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 125a
        hoofdstuk: '6'
  - number: 150l.8
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150l
  - number: 150m.1
    text: |-
      Een pensioenfonds is op verzoek van de werkgever bevoegd tot collectieve waardeoverdracht indien de
      waardeoverdracht ertoe strekt in verband met een collectieve wijziging van de pensioenovereenkomsten de waarde
      van pensioenaanspraken of pensioenrechten aan te wenden bij het pensioenfonds overeenkomstig die gewijzigde
      pensioenovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150m
  - number: 150m.2
    text: |-
      Het voornemen tot waardeoverdracht wordt door het pensioenfonds, onverwijld nadat het besluit tot waardeoverdracht
      is genomen maar uiterlijk zes maanden voor de beoogde datum van waardeoverdracht, elektronisch gemeld aan
      de toezichthouder. De toezichthouder kan binnen die periode een verbod tot waardeoverdracht opleggen. De
      toezichthouder kan de termijn van zes maanden gemotiveerd verlengen met maximaal twee maal drie maanden. De
      toezichthouder richt een proces in voor de melding van de interne collectieve waardeoverdracht en schrijft voor
      welke stukken daarvoor benodigd zijn.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150m
  - number: 150m.3
    text: |-
      Het intern toezicht bij een pensioenfonds houdt toezicht op de voorgenomen interne collectieve waardeoverdracht met
      inbegrip van het aanwenden van het vermogen en legt hierover verantwoording af in het bestuursverslag.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150m
  - number: 150m.4
    text: |-
      Het pensioenfonds stelt het verantwoordingsorgaan in de gelegenheid advies uit te brengen over de voorgenomen
      collectieve waardeoverdracht met inbegrip van het aanwenden van het vermogen van het pensioenfonds bij de
      collectieve waardeoverdracht. Ten aanzien van dit advies zijn de [artikelen 115a, vijfde en zesde lid][ref1],
      [115e][ref2] en [217][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel115a
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel115e
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel217
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150m
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 115a
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 115e
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '217'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: 150m.5
    text: |-
      Indien het verantwoordingsorgaan of een geleding binnen het verantwoordingsorgaan negatief adviseert over de
      voorgenomen collectieve waardeoverdracht, informeert het pensioenfonds de werkgever die het verzoek tot collectieve
      waardeoverdracht heeft gedaan hierover en vraagt de werkgever het verzoek tot waardeoverdracht te heroverwegen
      met inachtneming van het advies van het verantwoordingsorgaan of een geleding van het verantwoordingsorgaan. De
      werkgever onderbouwt het resultaat van de heroverweging.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150m
  - number: 150m.6
    text: |-
      Het pensioenfonds heeft de goedkeuring nodig van het belanghebbendenorgaan voor elk voorgenomen besluit
      met betrekking tot de collectieve waardeoverdracht met inbegrip van het aanwenden van het vermogen van het
      pensioenfonds bij de collectieve waardeoverdracht. [Artikel 115c, vijfde, achtste, negende en tiende lid][ref1],
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel115c
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150m
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 115c
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 150m.7
    text: |-
      Het pensioenfonds heeft de goedkeuring nodig van de raad van toezicht voor elk voorgenomen besluit met
      betrekking tot de collectieve waardeoverdracht met inbegrip van het aanwenden van het vermogen bij de collectieve
      waardeoverdracht. [Artikel 104, vierde, achtste en negende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel104
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150m
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '104'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 150m.8
    text: |-
      Bij de collectieve waardeoverdracht wordt de overdrachtswaarde door het pensioenfonds zodanig vastgesteld dat de
      voor mannen en vrouwen te verwerven pensioenrechten gelijk zijn waarbij aan het vereiste van collectieve actuariële
      gelijkwaardigheid op basis van dezelfde grondslagen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150m
  - number: 150m.9
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150m
  - number: 150m.10
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150m
  - number: 150n.1
    text: |-
      Voor de waardering van pensioenaanspraken en pensioenrechten bij een collectieve waardeoverdracht als bedoeld in
      [artikel 150m][ref1] en het aanwenden van het vermogen maakt een pensioenfonds gebruik van de standaardmethode.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150n
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150m
        hoofdstuk: 6b
        paragraaf: 6b.5
  - number: 150n.2
    text: |-
      In afwijking van het eerste lid kan een pensioenfonds gebruik maken van de vba-methode indien deze methode beter de
      bijzondere kenmerken van de pensioenregeling en het pensioenfonds modelleert en het pensioenfonds het toepassen van
      de vba-methode onderbouwt in het implementatieplan.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150n
  - number: 150n.3
    text: |-
      Bij toepassing van de standaardmethode wordt voor de waardering van pensioenaanspraken en pensioenrechten gebruik
      gemaakt van de standaardregel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150n
  - number: 150n.4
    text: |-
      Bij toepassing van de vba-methode is per cohort de inclusieve marktwaarde van de opgebouwde pensioenaanspraken en
      pensioenrechten na de collectieve waardeoverdracht minimaal gelijk aan de inclusieve marktwaarde van de opgebouwde
      pensioenaanspraken en pensioenrechten voor de collectieve waardeoverdracht.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150n
  - number: 150n.5
    text: |-
      Bij toepassing van de standaardmethode kan een pensioenfonds na toepassing van de standaardregel afwijken van
      de uitkomsten voor zover dit nodig is om gelijke aanpassingen van pensioenuitkeringen mogelijk te maken en de
      verschuiving van vermogen daarvoor binnen de groep pensioengerechtigden blijft.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150n
  - number: 150n.6
    text: |-
      Bij toepassing van de standaardmethode kan een pensioenfonds met een dekkingsgraad waarbij de technische
      voorzieningen voor meer dan 110% door waarden worden gedekt, na toepassing van de standaardregel afwijken van de
      uitkomsten mits de waarde van de pensioenaanspraak of het pensioenrecht van iedere deelnemer, gewezen deelnemer,
      andere aanspraakgerechtigde of pensioengerechtigde tenminste 95% bedraagt van de uitkomst van de standaardregel,
      na de initiële vulling van een solidariteitsreserve, een risicodelingsreserve of een compensatiedepot. Bij
      dekkingsgraden tussen 105% en 110% mag 5% van het vermogen verschoven worden, mits deze verschuiving bijdraagt aan
      de evenwichtigheid van de transitie.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150n
  - number: 150n.7
    text: |-
      Een pensioenfonds is bij de collectieve waardeoverdracht bevoegd om op verzoek van de werkgever het vermogen, met
      uitzondering van het minimaal vereist eigen vermogen, van het pensioenfonds aan te wenden voor de initiële vulling
      van een solidariteitsreserve of risicodelingsreserve of de compensatie van deelnemers door het toekennen van extra
      pensioenaanspraken, mits:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150n
  - number: 150n.7.a
    text: |-
      bij toepassing van de standaardmethode: voor de initiële vulling van een solidariteitsreserve of
      risicodelingsreserve of de compensatie van deelnemers alleen het vermogen wordt aangewend dat op het moment van de
      collectieve waardeoverdracht niet strekt ter dekking van de technische voorzieningen;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150n
  - number: 150n.7.b
    text: |-
      bij toepassing van de vba-methode: voor het aanwenden van het vermogen ten behoeve van de compensatie van
      deelnemers reeds zonder toedeling van de compensatie aan de in het vierde lid genoemde voorwaarde is voldaan; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150n
  - number: 150n.7.c
    text: |-
      voor zover het vermogen wordt aangewend voor de compensatie van deelnemers, de verdelingsregels van het vermogen
      dat hiervoor wordt benut vastliggen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150n
  - number: 150n.8
    text: |-
      Met inachtneming van het zevende lid, aanhef, kan, in afwijking van het zevende lid, onderdeel a of b, een
      pensioenfonds dat op het tijdstip van de collectieve waardeoverdracht een dekkingsgraad heeft waarbij de
      technische voorzieningen voor minder dan 105% door waarden worden gedekt, ten hoogste 5% van de waarde van de
      opgebouwde pensioenaanspraken en pensioenrechten aanwenden voor de initiële vulling van een solidariteitsreserve
      of risicodelingsreserve, de compensatie van deelnemers door het toekennen van extra pensioenaanspraken of het
      toekennen van extra pensioenrechten aan pensioengerechtigden tot maximaal hun technische voorziening mits:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150n
  - number: 150n.8.a
    text: |-
      de aanwending is opgenomen in het transitieplan, bedoeld in [artikel 150d][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150d
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150n
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150d
        hoofdstuk: 6b
        paragraaf: 6b.3
  - number: 150n.8.b
    text: |-
      het pensioenfonds advies dan wel goedkeuring heeft verkregen van het verantwoordingsorgaan of het
      belanghebbendenorgaan op grond van [artikel 150m, vierde en zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150n
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150m
        hoofdstuk: 6b
        paragraaf: 6b.5
  - number: 150n.9
    text: |-
      Een pensioenfonds kan na de collectieve waardeoverdracht een solidariteitsreserve of risicodelingsreserve hebben
      die, in afwijking van de [artikelen 10d][ref1] of [10e][ref2], een omvang heeft van meer dan 15% van het geheel
      voor pensioen gereserveerd vermogen of kapitaal inclusief de solidariteitsreserve of risicodelingsreserve. Voor
      deze reserve geldt de eis van de maximale omvang van 15% op 1 januari 2037 of zoveel eerder als de omvang van de
      reserve maximaal 15% is gaan bedragen. Voor het uitdelen uit de reserve boven de maximale omvang van 15% kan worden
      afgeweken van de [artikelen 10d, derde lid][ref3], of [10e, derde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel10d
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel10e
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel10d
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel10e
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150n
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 10d
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 10e
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: 10d
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: 10e
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 150n.10
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over in
      ieder geval de standaardmethode en de vba-methode.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150n
  - number: 150o.1
    text: |-
      Een pensioenfonds dat over wil gaan tot een collectieve waardeoverdracht als bedoeld in [artikel 150m][ref1] en
      een dekkingsgraad heeft waarbij de technische voorzieningen voor minder dan 90% door waarden worden gedekt, neemt
      tijdig maatregelen die ten tijde van de collectieve waardeoverdracht in de technische voorzieningen zijn verwerkt
      en doorgevoerd, waardoor de technische voorzieningen van het pensioenfonds bij de collectieve waardeoverdracht ten
      minste voor 90% door waarden zijn gedekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150o
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150m
        hoofdstuk: 6b
        paragraaf: 6b.5
  - number: 150o.2
    text: |-
      Zo nodig in afwijking van [artikel 150n, derde en vierde lid][ref1], is bij een collectieve waardeoverdracht als
      bedoeld in [artikel 150m][ref2], de waarde van de pensioenaanspraak of het pensioenrecht van iedere deelnemer,
      gewezen deelnemer, andere aanspraakgerechtigde of pensioengerechtigde tenminste 95% van de uitkomst van de
      toepassing van de standaardregel, tenzij de technische voorziening voor de pensioenaanspraak of het pensioenrecht
      van de deelnemer, gewezen deelnemer, andere aanspraakgerechtigde of pensioengerechtigde lager is, dan bedraagt de
      waarde tenminste de technische voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150n
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150o
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150n
        hoofdstuk: 6b
        paragraaf: 6b.5
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 150m
        hoofdstuk: 6b
        paragraaf: 6b.5
  - number: 150o.3
    text: |-
      Indien bij een collectieve waardeoverdracht als bedoeld in [artikel 150m][ref1] de waarde van de pensioenaanspraak
      of het pensioenrecht van een deelnemer, gewezen deelnemer, andere aanspraakgerechtigde of pensioengerechtigde
      minder bedraagt dan de technische voorziening, kan de waarde voor een andere deelnemer, gewezen deelnemer,
      aanspraakgerechtigde of pensioengerechtigde niet meer bedragen dan de technische voorziening, tenzij het meerdere
      een gevolg is van compensatie door het toekennen van extra pensioenaanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150o
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150m
        hoofdstuk: 6b
        paragraaf: 6b.5
  - number: 150o.4
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150o
  - number: 150oa.1
    text: |-
      De toezichthouder kan op aanvraag van een pensioenfonds, geheel of gedeeltelijk, ontheffing verlenen van het bij of
      krachtens de [artikelen 150n, achtste lid][ref1], of [150o][ref2] bepaalde, indien het pensioenfonds aantoont dat
      daaraan redelijkerwijs niet kan worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150n
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel150o
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150oa
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150n
        hoofdstuk: 6b
        paragraaf: 6b.5
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 150o
        hoofdstuk: 6b
        paragraaf: 6b.5
  - number: 150oa.2
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150oa
  - number: 150p.1
    text: |-
      Een pensioenfonds dat naar verwachting zal overgaan op een collectieve waardeoverdracht als bedoeld in
      [artikel 150m][ref1], kan in de periode tot die collectieve waardeoverdracht plaatsvindt, in afwijking van de
      [artikelen 138][ref2], [139][ref3], of [140, eerste en derde lid][ref4], afzien van het jaarlijks indienen van een
      herstelplan en kan in plaats daarvan jaarlijks een concreet en haalbaar overbruggingsplan indienen dat voldoet aan
      de daarvoor gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel138
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel139
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel140
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150p
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150m
        hoofdstuk: 6b
        paragraaf: 6b.5
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '138'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '139'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '140'
        hoofdstuk: '6'
  - number: 150p.2
    text: |-
      In afwijking van het eerste lid kan een pensioenfonds dat op 1 juli 2025 geen implementatieplan heeft ingediend bij
      de toezichthouder geen overbruggingsplan indienen voor de jaren 2025 en 2026.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150p
  - number: 150p.3
    text: |-
      In het overbruggingsplan beschrijft het pensioenfonds de financiële situatie van het pensioenfonds in de periode
      tot het pensioenfonds overgaat tot collectieve waardeoverdracht maar uiterlijk op 1 januari 2027. Het uitgangspunt
      voor de beschrijving is de dekkingsgraad van het pensioenfonds op 31 december van enig jaar.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150p
  - number: 150p.4
    text: 'Een pensioenfonds:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150p
  - number: 150p.4.a
    text: 'onderbouwt in het overbruggingsplan:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150p
  - number: 150p.4.a.1°
    text: |-
      waarom het vanuit het belang van deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en
      pensioengerechtigden een overbruggingsplan indient;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150p
  - number: 150p.4.a.2°
    text: hoe de invaardekkingsgraad is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150p
  - number: 150p.4.a.3°
    text: hoe de premiedekkingsgraad bijdraagt aan de financiële positie van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150p
  - number: 150p.4.a.4°
    text: |-
      hoe zal worden voldaan aan de vereisten van het minimaal vereist eigen vermogen en het vereist eigen vermogen
      indien het pensioenfonds niet of niet meer gebruik maakt van de regeling voor overbruggingsplannen; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150p
  - number: 150p.4.a.5°
    text: |-
      hoe het rekening heeft gehouden met generatie-effecten in termen van netto-profijt die ontstaan door het indienen
      van een overbruggingsplan, waarbij deze onderbouwing alleen wordt opgenomen in het eerste overbruggingsplan dat
      wordt ingediend voor het implementatieplan is ingediend en vervolgens in het eerste overbruggingsplan nadat het
      implementatieplan is ingediend; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150p
  - number: 150p.4.b
    text: |-
      stelt informatie over het overbruggingsplan en de onderbouwing daarvan tijdig ter beschikking van de deelnemers,
      gewezen deelnemers, andere aanspraakgerechtigden en pensioengerechtigden of verstrekt deze informatie tijdig.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150p
  - number: 150p.5
    text: |-
      Het pensioenfonds stelt het verantwoordingsorgaan in de gelegenheid advies uit te brengen over de vaststelling
      van het overbruggingsplan. Ten aanzien van dit advies zijn de [artikelen 115a, vijfde en zesde lid][ref1],
      [115e][ref2] en [217][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel115a
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel115e
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel217
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150p
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 115a
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 115e
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '217'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: 150p.6
    text: |-
      Het pensioenfonds heeft de goedkeuring nodig van het belanghebbendenorgaan voor elk
      voorgenomen besluit met betrekking tot de vaststelling van een overbruggingsplan.
      [Artikel 115c, vijfde, achtste, negende en tiende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel115c
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150p
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 115c
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 150p.7
    text: |-
      Voor de toepassing van [artikel 140][ref1] telt de vaststelling van een beleidsdekkingsgraad in de periode dat op
      grond van dit artikel geen herstelplan wordt ingediend mee voor de bepaling hoe veel maal opeenvolgend sprake is
      van een beleidsdekkingsgraad onder het minimaal vereist eigen vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel140
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150p
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '140'
        hoofdstuk: '6'
  - number: 150p.8
    text: |-
      [Artikel 137, tweede lid, onderdeel a en b][ref1], is niet van toepassing zolang een pensioenfonds een
      overbruggingsplan indient. Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld voor de
      toeslagverlening in die situatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel137
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150p
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '137'
        hoofdstuk: '6'
  - number: 150p.9
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de overbruggingsplannen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150p
  - number: 150q.1
    text: |-
      Een pensioenfonds dat na een of meer jaren overbruggingsplannen te hebben ingediend, in een jaar in plaats van een
      overbruggingsplan een herstelplan indient bij toezichthouder, doet dit binnen drie maanden na de in het tweede lid,
      onderdeel b of c, genoemde tijdstippen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150q
  - number: 150q.2
    text: |-
      Het pensioenfonds dient het overbruggingsplan ter instemming in bij de toezichthouder nadat het pensioenfonds
      de dekkingsgraad heeft vastgesteld op 31 december van enig jaar. Indien een pensioenfonds voor het jaar 2023
      een overbruggingsplan indient, terwijl het pensioenfonds voor het jaar 2023 al een herstelplan heeft waarmee
      de toezichthouder heeft ingestemd, vervangt dit overbruggingsplan als het is vastgesteld het herstelplan. Het
      pensioenfonds dient het overbruggingsplan in:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150q
  - number: 150q.2.a
    text: 'in het jaar 2023: uiterlijk 1 september 2023;'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150q
  - number: 150q.2.b
    text: 'in de jaren 2024 en 2025: uiterlijk 1 juli 2024 respectievelijk 2025; en'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150q
  - number: 150q.2.c
    text: 'in het jaar 2026: uiterlijk 1 april 2026.'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150q
  - number: 150q.3
    text: |-
      Het overbruggingsplan heeft steeds een looptijd tot het tijdstip waarop het pensioenfonds verwacht over te gaan tot
      collectieve waardeoverdracht maar uiterlijk 1 januari 2027.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150q
  - number: 150q.4
    text: |-
      Indien het pensioenfonds op 31 december van enig jaar een dekkingsgraad heeft waarbij de technische voorzieningen
      voor minder dan 90% door waarden worden gedekt, neemt het binnen drie maanden na het tijdstip waarop het
      overbruggingsplan moet zijn ingediend maatregelen waardoor de dekkingsgraad van het pensioenfonds direct zodanig
      wordt dat de technische voorzieningen voor 90% door waarden worden gedekt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150q
  - number: 150q.5
    text: |-
      Indien een pensioenfonds dat nog geen implementatieplan heeft ingediend een dekkingsgraad heeft waarbij de
      technische voorzieningen voor minder dan 95% door waarden worden gedekt, werkt het, eventueel in aanvulling op
      het vierde lid, in het overbruggingsplan uit hoe het in de looptijd van het overbruggingsplan zal komen tot een
      invaardekkingsgraad waarbij de technische voorzieningen minimaal voor 95% door waarden worden gedekt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150q
  - number: 150q.6
    text: |-
      In de overbruggingsplannen die worden ingediend nadat het pensioenfonds het implementatieplan heeft ingediend
      werkt het pensioenfonds, eventueel in aanvulling op het vierde lid, onderbouwd uit hoe het zal komen tot een
      specifieke invaardekkingsgraad voor het pensioenfonds. De invaardekkingsgraad is de dekkingsgraad die een
      pensioenfonds nodig heeft om te komen tot een verantwoorde, uitlegbare en evenwichtige overstap naar de uitvoering
      van de gewijzigde pensioenovereenkomsten en is een financiële uitwerking van de besluitvorming over de gewijzigde
      pensioenovereenkomsten en de compensatie.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150q
  - number: 150q.7
    text: |-
      Voor zover het bij de maatregelen die in het overbruggingsplan zijn opgenomen een vermindering van
      pensioenaanspraken en pensioenrechten betreft, worden deze voor zover het betreft een vermindering die betrekking
      heeft op:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150q
  - number: 150q.7.a
    text: |-
      het vierde lid: direct in de technische voorzieningen verwerkt en direct ofwel in beginsel evenredig gespreid in
      de tijd doorgevoerd gedurende maximaal de termijn die wordt gebruikt voor het overbruggingsplan, waarbij de eerste
      termijn wordt doorgevoerd in het jaar waarin het overbruggingsplan is ingediend;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150q
  - number: 150q.7.b
    text: |-
      het vijfde lid in het overbruggingsplan voor het jaar 2023 of 2024: evenredig gespreid in de tijd gedurende
      maximaal de termijn die wordt gebruikt voor het overbruggingsplan, waarbij de eerste termijn direct in de
      technische voorzieningen wordt verwerkt en doorgevoerd in het jaar waarin het overbruggingsplan is ingediend; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150q
  - number: 150q.7.c
    text: |-
      het zesde lid in de overbruggingsplannen voor de jaren 2024, 2025 of 2026: direct in de technische voorzieningen
      verwerkt en direct doorgevoerd in het jaar waarin het overbruggingsplan is ingediend.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150q
  - number: 150r.1
    text: |-
      De in [artikel 71][ref1] genoemde plicht tot waardeoverdracht geldt niet zolang:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150r
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 150r.1.a
    text: |-
      bij het overdragende pensioenfonds geen waardeoverdracht als bedoeld in [artikel 150m][ref1] heeft plaatsgevonden,
      maar bij het ontvangende pensioenfonds wel; of


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150r
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150m
        hoofdstuk: 6b
        paragraaf: 6b.5
  - number: 150r.1.b
    text: |-
      bij het ontvangende pensioenfonds geen waardeoverdracht als bedoeld in [artikel 150m][ref1] heeft plaatsgevonden,
      maar bij het overdragende pensioenpensioenfonds wel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150r
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150m
        hoofdstuk: 6b
        paragraaf: 6b.5
  - number: 150r.2
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing indien het overdragende pensioenfonds bij de
      opdrachtaanvaarding, bedoeld in [artikel 102a][ref1], heeft aangegeven geen gebruik te maken van de mogelijkheid
      tot waardeoverdracht als bedoeld in [artikel 150m][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel102a
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150r
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 102a
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 150m
        hoofdstuk: 6b
        paragraaf: 6b.5
  - number: 150r.3
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing indien het ontvangende pensioenfonds bij de
      opdrachtaanvaarding, bedoeld in [artikel 102a][ref1], heeft aangegeven geen gebruik te maken van de mogelijkheid
      tot waardeoverdracht als bedoeld in [artikel 150m][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel102a
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150r
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 102a
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 150m
        hoofdstuk: 6b
        paragraaf: 6b.5
  - number: 150r.4
    text: |-
      De in [artikel 71][ref1] genoemde plicht tot waardeoverdracht herleeft zodra zowel bij het ontvangende als het
      overdragende pensioenfonds waardeoverdracht als bedoeld in [artikel 150m][ref2] heeft plaatsgevonden, dan wel
      indien er sprake is van een situatie als bedoeld in het tweede of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel150r
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 150m
        hoofdstuk: 6b
        paragraaf: 6b.5
  - number: '151.1'
    text: De Stichting Autoriteit Financiële Markten is belast met het gedragstoezicht.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel151
  - number: '151.2'
    text: |-
      Gedragstoezicht is toezicht gericht op de naleving van de normen ten aanzien van voorlichting in ruime zin aan en
      zorgvuldige bejegening in ruime zin door pensioenuitvoerders van deelnemers, gewezen deelnemers, gewezen partners,
      andere aanspraakgerechtigden en pensioengerechtigden en de normen ten aanzien van de advisering van de deelnemer of
      gewezen deelnemer bij de uitvoering van premieovereenkomsten met beleggingsvrijheid waarbij de deelnemer of gewezen
      deelnemer de verantwoordelijkheid voor de beleggingen heeft overgenomen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel151
  - number: '151.3'
    text: De Nederlandsche Bank N.V. is belast met het prudentieel toezicht en het materieel toezicht.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel151
  - number: '151.4'
    text: |-
      Prudentieel toezicht is toezicht gericht op de normen ten aanzien van de financiële soliditeit van
      pensioenfondsen, het bijdragen aan de financiële stabiliteit van de sector van pensioenfondsen en het beschermen
      van de rechten van deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel151
  - number: '151.5'
    text: |-
      Materieel toezicht is toezicht gericht op alle normen in deze wet die geen onderdeel uitmaken van gedrags- of
      prudentieel toezicht.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel151
  - number: '151.6'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn de bij besluit van de
      toezichthouder aangewezen personen belast. Van een besluit als bedoeld in de eerste volzin wordt mededeling gedaan
      door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel151
  - number: '151.7'
    text: 'Bij algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel151
  - number: 151.7.a
    text: |-
      worden regels gesteld omtrent de toedeling van de taken en bevoegdheden met betrekking tot het prudentieel
      toezicht, het gedragstoezicht en het materieel toezicht van deze wet aan de toezichthouders;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel151
  - number: 151.7.b
    text: worden regels gesteld over de wijze waarop de toezichthouders samenwerken; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel151
  - number: 151.7.c
    text: |-
      worden eisen gesteld aan de toezichthouders, waaronder voorschriften gericht op een zodanige besluitvorming binnen
      de toezichthouder dat een onafhankelijke vervulling van de uit deze wet voortvloeiende taken en bevoegdheden is
      gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel151
  - number: '152.1'
    text: |-
      De toezichthouder treedt bij de uitoefening van het toezicht op de naleving van deze wet niet in de beoordeling van
      de individuele rechtsverhouding tussen:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel152
  - number: 152.1.a
    text: een werkgever en een werknemer;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel152
  - number: 152.1.b
    text: een pensioenuitvoerder en een werkgever; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel152
  - number: 152.1.c
    text: een pensioenuitvoerder en een aanspraak- of pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel152
  - number: '152.2'
    text: Het eerste lid is niet van toepassing op de uitvoeringsovereenkomst en het pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel152
  - number: '153.1'
    text: |-
      In aanvulling op [artikel 19, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] draagt de
      toezichthouder met betrekking tot de uitoefening van zijn taken en bevoegdheden uit hoofde van deze wet zorg voor
      een voor de onder toezicht staanden kenbare, transparante en consistente uitvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel19
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '19'
  - number: '153.2'
    text: De toezichthouder hanteert bij de uitoefening van zijn taak een vooruitziende en risicogebaseerde benadering.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel153
  - number: '153.3'
    text: |-
      De toezichthouder neemt bij de uitoefening van zijn taak de gevolgen in overweging die zijn besluiten, met name in
      noodsituaties, kunnen hebben voor de stabiliteit van het financiële stelsel van alle andere betrokken lidstaten,
      uitgaande van de op het desbetreffende tijdstip beschikbare informatie.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel153
  - number: '153.4'
    text: Het toezicht omvat een passende combinatie van werkzaamheden op afstand en controles ter plaatse.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel153
  - number: '163'
    text: 'Onze Minister houdt toezicht op:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel163
  - number: 163.a
    text: de rechtmatigheid van de uitvoering van deze wet door de toezichthouder;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel163
  - number: 163.b
    text: de doeltreffendheid van de uitvoering van deze wet door de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel163
  - number: '164.1'
    text: |-
      Indien Onze Minister de toezichthouder gegevens of inlichtingen vraagt die naar zijn oordeel nodig zijn voor een
      onderzoek naar de wijze waarop de toezichthouder de uit deze wet voortvloeiende taken en bevoegdheden uitvoert of
      heeft uitgevoerd, geschiedt de verstrekking daarvan met inachtneming van dit artikel.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel164
  - number: '164.2'
    text: |-
      De toezichthouder verstrekt kosteloos aan Onze Minister de in het eerste lid bedoelde gegevens of inlichtingen.
      Indien Onze Minister de toezichthouder vraagt bepaalde gegevens of inlichtingen te verstrekken die op grond van
      deze wet omtrent afzonderlijke pensioenuitvoerders, werkgevers of natuurlijke personen zijn verstrekt of zijn
      verkregen, is de toezichthouder niet verplicht deze gegevens of inlichtingen te verstrekken, indien deze betrekking
      hebben op of herleidbaar zijn tot een afzonderlijke pensioenuitvoerder, werkgever of natuurlijke persoon, met
      uitzondering van gegevens of inlichtingen die betrekking hebben op of herleidbaar zijn tot een pensioenuitvoerder
      of werkgever ten aanzien waarvan surséance van betaling is verleend, die in staat van faillissement is verklaard of
      op grond van een rechterlijke uitspraak is ontbonden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel164
  - number: '164.3'
    text: |-
      Onze Minister kan een derde opdragen de gegevens of inlichtingen die hem ingevolge het tweede lid zijn verstrekt
      te onderzoeken en aan hem verslag uit te brengen. Tevens kan Onze Minister de derde die in zijn opdracht
      handelt, machtigen namens hem gegevens of inlichtingen in te winnen, in welk geval het eerste en tweede lid van
      overeenkomstige toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel164
  - number: '164.4'
    text: |-
      Onze Minister gebruikt de gegevens of inlichtingen die hij ingevolge het tweede of derde lid heeft verkregen
      uitsluitend voor het vormen van zijn oordeel over de toereikendheid van deze wet of de wijze waarop de
      toezichthouder de bij of krachtens deze wet opgedragen taken en toegekende bevoegdheden uitoefent of heeft
      uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel164
  - number: '164.5'
    text: |-
      Onze Minister en degenen die in zijn opdracht handelen zijn verplicht tot geheimhouding van de op grond van het
      tweede lid, tweede volzin, ontvangen gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel164
  - number: '164.6'
    text: |-
      Niettegenstaande het vierde en vijfde lid kan Onze Minister de aan de gegevens of inlichtingen ontleende
      bevindingen en de daaruit getrokken conclusies aan de Staten-Generaal mededelen en de conclusies in algemene zin
      uit het onderzoek openbaar maken.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel164
  - number: '164.7'
    text: |-
      De [Wet open overheid][ref1] en de [Wet Nationale ombudsman][ref2] zijn niet van toepassing met betrekking tot
      de in dit artikel bedoelde gegevens of inlichtingen die Onze Minister of de in zijn opdracht werkende derde onder
      zich heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0045754
      [ref2]: https://wetten.overheid.nl/BWBR0003372
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0045754
      - id: ref2
        bwb_id: BWBR0003372
  - number: '165.1'
    text: |-
      Onze Minister kan aan de toezichthouder een aanwijzing geven over de uitoefening van de aan de toezichthouder bij
      of krachtens deze wet opgedragen taken en toegekende bevoegdheden wanneer de toezichthouder hierin naar het oordeel
      van Onze Minister tekort schiet. Onze Minister treedt daarbij niet in individuele gevallen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel165
  - number: '165.2'
    text: De toezichthouder is gehouden overeenkomstig de aanwijzing te handelen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel165
  - number: '166'
    text: |-
      De bevoegdheid om de noodzakelijke voorzieningen te treffen, genoemd in
      [artikel 23, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], alsmede de verplichtingen, genoemd
      in artikel 23, tweede en derde lid, van de Kaderwet zelfstandige bestuursorganen, worden ten aanzien van ernstige
      verwaarlozing door de toezichthouder van de bij of krachtens deze wet opgedragen taken uitgeoefend dan wel
      uitgevoerd door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel23
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '23'
  - number: 166a
    text: |-
      Onze Minister kan beleidsregels vaststellen ten aanzien van de toepassing door de toezichthouders van
      [Hoofdstuk 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel166a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        hoofdstuk: '7'
  - number: '167'
    text: |-
      De pensioenuitvoerder, de werkgever, de accountant en de actuaris verstrekken aan de toezichthouder kosteloos de
      door deze gevorderde inlichtingen, gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel167
  - number: '168.1'
    text: De toezichthouder kan ten behoeve van het toezicht op de naleving van deze wet van een ieder inlichtingen vorderen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel168
  - number: '168.2'
    text: |-
      De [artikelen 5:13][ref1] en [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '168.3'
    text: |-
      De toezichthouder is bevoegd tot toepassing van [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref1]
      ten aanzien van de in het eerste lid bedoelde vordering.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '168.4'
    text: |-
      Voorzover de toezichthouder voor het uitoefenen van het gedragstoezicht ten aanzien van pensioenfondsen waaraan
      de andere toezichthouder een vergunning heeft verleend of welke in het register is opgenomen, gegevens nodig heeft
      over aspecten van de bedrijfsvoering, bedoeld in [artikel 143, tweede lid, onderdeel a en b][ref1], vordert de
      eerstgenoemde toezichthouder geen inlichtingen, dan nadat de andere toezichthouder is verzocht deze gegevens te
      verstrekken en is gebleken dat de andere toezichthouder niet aan dit verzoek tegemoet kan komen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel143
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '143'
        hoofdstuk: '6'
  - number: '168.5'
    text: |-
      Van het vierde lid kan, na overleg met de andere toezichthouder, worden afgeweken indien sprake is van een redelijk
      vermoeden van een overtreding van de regels bij of krachtens deze wet gesteld en onverwijlde spoed, gelet op de
      betrokken belangen, dat vereist.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel168
  - number: '169.1'
    text: |-
      De pensioenuitvoerder en de werkgever zijn verplicht de zakelijke gegevens en bescheiden die betrekking hebben op
      pensioenregelingen en andere bij of krachtens deze wet geregelde onderwerpen in Nederland beschikbaar te hebben en
      deze gedurende ten minste zeven jaren na het boekjaar waarop ze betrekking hebben beschikbaar te houden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel169
  - number: '169.2'
    text: Het eerste lid is niet van toepassing op een verzekeraar met zetel in een andere lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel169
  - number: '170.1'
    text: |-
      Een accountant die het onderzoek naar de staten, bedoeld in [artikel 147, vijfde lid][ref1], uitvoert meldt de
      toezichthouder zo spoedig mogelijk elke omstandigheid waarvan hij bij de uitvoering van het onderzoek kennis heeft
      gekregen en die:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel147
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '147'
        hoofdstuk: '6'
  - number: 170.1.a
    text: in strijd is met deze wet;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel170
  - number: 170.1.b
    text: de nakoming van de door het pensioenfonds aangegane verplichtingen bedreigt; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel170
  - number: 170.1.c
    text: leidt tot de weigering van het afgeven van de verklaring omtrent de getrouwheid of tot het maken van voorbehouden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel170
  - number: '170.2'
    text: |-
      Het eerste lid, aanhef en onderdelen a en b, is van overeenkomstige toepassing op de actuaris die het onderzoek
      naar de staten, bedoeld in [artikel 147, vierde lid][ref1], uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel147
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '147'
        hoofdstuk: '6'
  - number: '170.3'
    text: |-
      De accountant of actuaris verstrekt zo spoedig mogelijk kosteloos alle inlichtingen aan de toezichthouder die deze
      redelijkerwijs nodig heeft voor het toezicht op de naleving van deze wet. De toezichthouder stelt het betrokken
      pensioenfonds in de gelegenheid aanwezig te zijn bij het verstrekken van inlichtingen door de accountant of
      actuaris.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel170
  - number: '170.4'
    text: De accountant of actuaris biedt desgevraagd de toezichthouder inzicht in zijn controlewerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel170
  - number: '170.5'
    text: |-
      De accountant of actuaris die op grond van dit artikel tot een melding of het verstrekken van inlichtingen aan
      de toezichthouder is overgegaan, is niet aansprakelijk voor schade die een derde als gevolg daarvan lijdt, tenzij
      aannemelijk wordt gemaakt dat, gelet op alle feiten en omstandigheden, in redelijkheid niet tot melding of het
      verstrekken van inlichtingen had mogen worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel170
  - number: '171.1'
    text: |-
      De toezichthouder kan een pensioenuitvoerder die niet voldoet aan hetgeen bij of krachtens deze wet is bepaald,
      door middel van het geven van een aanwijzing verplichten om binnen een door de toezichthouder gestelde redelijke
      termijn ten aanzien van in de aanwijzingsbeschikking aangegeven punten een bepaalde gedragslijn te volgen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel171
  - number: '171.2'
    text: |-
      De toezichthouder kan een aanwijzing als bedoeld in het eerste lid eveneens aan een pensioenfonds geven indien
      hij tekenen ontwaart van een ontwikkeling die het eigen vermogen, de solvabiliteit, de liquiditeit of de
      bedrijfsvoering van het pensioenfonds in gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel171
  - number: '172.1'
    text: |-
      De toezichthouder kan besluiten een of meer personen te benoemen als curator ten aanzien van alle of bepaalde
      organen van het pensioenfonds indien dat pensioenfonds niet voldoet aan hetgeen ingevolge deze wet is bepaald.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel172
  - number: '172.2'
    text: 'Het besluit ingevolge het eerste lid wordt slechts genomen:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel172
  - number: 172.2.a
    text: |-
      nadat door het pensioenfonds niet of niet volledig binnen de gestelde termijn aan een aanwijzing als bedoeld in
      [artikel 171][ref1] gevolg is gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel171
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '171'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 172.2.b
    text: |-
      indien de in het eerste lid bedoelde overtreding een adequate functionering van het pensioenfonds ernstig in gevaar
      brengt en dat pensioenfonds voorafgaand in de gelegenheid is gesteld zijn zienswijze naar voren te brengen over het
      voorgenomen besluit; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel172
  - number: 172.2.c
    text: |-
      indien de in het eerste lid bedoelde overtreding de belangen van de aanspraak- en pensioengerechtigden ernstig in
      gevaar brengt en dat pensioenfonds voorafgaand in de gelegenheid is gesteld zijn zienswijze naar voren te brengen
      over het voorgenomen besluit.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel172
  - number: '172.3'
    text: |-
      Onverminderd het eerste en tweede lid kan de toezichthouder besluiten een of meer personen te benoemen als
      curator ten aanzien van alle of bepaalde organen of vertegenwoordigers van een pensioenfonds indien hij bij dat
      pensioenfonds tekenen ontwaart van een ontwikkeling die het eigen vermogen, de solvabiliteit, of de liquiditeit van
      dat pensioenfonds in gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel172
  - number: '172.4'
    text: |-
      Het benoemingsbesluit bevat onder meer een beschrijving van de belangen waardoor de curator zich dient te
      laten leiden. De toezichthouder benoemt de curator voor ten hoogste twee jaren, met de mogelijkheid om deze
      termijn telkens voor ten hoogste een jaar te verlengen; de verlenging wordt terstond van kracht. Met ingang van
      het tijdstip waarop het besluit tot benoeming van de curator aan het pensioenfonds is bekendgemaakt mogen de
      desbetreffende organen of vertegenwoordigers hun bevoegdheden slechts uitoefenen na goedkeuring door de curator en
      met inachtneming van de opdrachten van de curator.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel172
  - number: '172.5'
    text: 'Na de benoeming van een curator:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel172
  - number: 172.5.a
    text: verlenen de organen en de vertegenwoordigers van het pensioenfonds de curator alle medewerking;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel172
  - number: 172.5.b
    text: |-
      kan de toezichthouder de betrokken organen of vertegenwoordigers van het pensioenfonds toestaan bepaalde
      rechtshandelingen zonder goedkeuring te verrichten;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel172
  - number: 172.5.c
    text: kan de toezichthouder te allen tijde de door hem aangewezen curator vervangen;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel172
  - number: 172.5.d
    text: |-
      is voor schade ten gevolge van handelingen, die zijn verricht in strijd met een besluit als bedoeld in het eerste
      of derde lid, elke persoon die deel uitmaakt van het orgaan van het pensioenfonds dat deze handelingen verrichtte,
      hoofdelijk aansprakelijk tegenover het pensioenfonds, tenzij het verrichten van deze handelingen niet aan hem is te
      verwijten en hij niet nalatig is geweest in het treffen van maatregelen om de gevolgen daarvan af te wenden;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel172
  - number: 172.5.e
    text: |-
      zijn de handelingen, bedoeld in onderdeel d, voorzover deze rechtshandelingen zijn, vernietigbaar, indien de
      wederpartij wist of behoorde te weten dat de vereiste goedkeuring ontbrak.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel172
  - number: '172.6'
    text: |-
      Zodra de omstandigheid, bedoeld in het eerste of derde lid niet langer aanwezig is, trekt de toezichthouder het
      besluit tot benoeming van de curator in. De toezichthouder maakt het besluit tot intrekking onverwijld bekend aan
      het pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel172
  - number: '172.7'
    text: |-
      De toezichthouder kent aan een op grond van het eerste lid aangewezen persoon een bezoldiging toe. De bezoldiging
      komt ten laste van:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel172
  - number: 172.7.a
    text: het pensioenfonds of, wanneer de financiële omstandigheden van het pensioenfonds dit niet toestaan;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel172
  - number: 172.7.b
    text: de werkgever of, wanneer de financiële omstandigheden van de werkgever dit niet toestaan;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel172
  - number: 172.7.c
    text: de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel172
  - number: '172.8'
    text: |-
      De curator is niet aansprakelijk voor schade veroorzaakt door een handelen of nalaten in de uitoefening van de taak
      op grond van dit artikel, tenzij deze schade in belangrijke mate het gevolg is van een opzettelijk onbehoorlijke
      taakuitoefening of een opzettelijk onbehoorlijke uitoefening van bevoegdheden of in belangrijke mate te wijten is
      aan grove schuld.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel172
  - number: '173.1'
    text: |-
      Op verzoek van de toezichthouder kan de ondernemingskamer van het gerechtshof Amsterdam over een pensioenfonds een
      bewindvoerder aanstellen, indien:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel173
  - number: 173.1.a
    text: |-
      een pensioenfonds blijk geeft van een zodanig wanbeleid dat de belangen van de aanspraak- en pensioengerechtigden
      een onmiddellijke voorziening vereisen; of
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel173
  - number: 173.1.b
    text: het bestuur is komen te ontbreken.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel173
  - number: '173.2'
    text: |-
      De toezichthouder dient zijn verzoekschrift tot aanstelling van een bewindvoerder in tweevoud in. De griffier doet
      een exemplaar van het verzoekschrift onverwijld aan het pensioenfonds toekomen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel173
  - number: '173.3'
    text: |-
      Indien de ondernemingskamer het verzoek toewijst, bepaalt zij de duur waarvoor de bewindvoerder wordt aangesteld.
      Zij kan deze duur op verzoek van de toezichthouder of van de bewindvoerder verlengen dan wel verkorten. De
      ondernemingskamer kent de bewindvoerder een bezoldiging toe ten laste van:
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel173
  - number: 173.3.a
    text: het pensioenfonds of, wanneer de financiële omstandigheden van het pensioenfonds dit niet toestaan;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel173
  - number: 173.3.b
    text: de werkgever of, wanneer de financiële omstandigheden van de werkgever dit niet toestaan;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel173
  - number: 173.3.c
    text: de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel173
  - number: '173.4'
    text: |-
      De bewindvoerder treedt in de plaats van het bestuur of een of meerdere door de ondernemingskamer aangewezen leden
      van het bestuur van het pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel173
  - number: '173.5'
    text: |-
      De voorlopige tenuitvoerlegging van de beschikking tot aanstelling van een bewindvoerder kan worden bevolen, indien
      het verzoek daartoe is gedaan op een van de gronden, genoemd in het eerste lid, onderdelen a en b.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel173
  - number: '174.1'
    text: |-
      Indien een accountant of actuaris niet of niet meer de nodige waarborgen biedt dat deze zijn taak met betrekking
      tot het pensioenfonds naar behoren zal kunnen vervullen, kan de toezichthouder ten aanzien van deze accountant
      of actuaris bepalen dat hij niet langer bevoegd is de in deze wet bedoelde verklaringen met betrekking tot dat
      pensioenfonds af te leggen.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel174
  - number: '174.2'
    text: De toezichthouder doet mededeling van het besluit, bedoeld in het eerste lid, aan het pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel174
  - number: '175.1'
    text: |-
      De toezichthouder kan een last onder dwangsom opleggen ter zake van een overtreding van de voorschriften, gesteld
      bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel175
  - number: '175.2'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld ter zake van de uitoefening van de bevoegdheid tot het
      opleggen van een last onder dwangsom.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel175
  - number: '176.1'
    text: |-
      De toezichthouder kan een bestuurlijke boete opleggen ter zake van een overtreding van voorschriften,
      gesteld bij of krachtens de [artikelen 10a][ref1], [10b][ref2], [10c][ref3], [10d][ref4], [10e][ref5],
