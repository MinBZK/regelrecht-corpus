      inwerkingtreding van [artikel V, onderdeel B, van de Wet versterking bestuur pensioenfondsen][ref1] deskundig is
      in verband met de uitoefening van het bedrijf van het pensioenfonds wordt die persoon vanaf dat tijdstip geacht
      geschikt te zijn als bedoeld in [artikel 105, derde lid][ref2], en vanaf het tijdstip van inwerkingtreding van
      [artikel I, onderdeel D, van de Wet versterking bestuur pensioenfondsen][ref3], [artikel 106, eerste lid][ref4],
      zolang niet een wijziging in de relevante feiten en omstandigheden een redelijke aanleiding geeft tot een
      beoordeling of herbeoordeling van die geschiktheid.


