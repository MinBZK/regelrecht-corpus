    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel38
  - number: 38.1.m
    text: |-
      de totaal ingelegde pensioenpremies die zijn ingelegd op grond van een solidaire premieovereenkomst, flexibele
      premieovereenkomst of premie-uitkeringsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel38
  - number: 38.1.n
    text: |-
      de totaal behaalde beleggingsrendementen per deelnemer die op grond van een solidaire premieovereenkomst, flexibele
      premieovereenkomst of premie-uitkeringsovereenkomst zijn behaald; en
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel38
  - number: 38.1.o
    text: andere per algemene maatregel van bestuur bepaalde vereiste informatie.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel38
  - number: '38.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de in het eerste
      lid bedoelde opgaven en informatie en de wijze waarop deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel38
  - number: '39.1'
    text: 'Voor zover van toepassing verstrekt de pensioenuitvoerder de deelnemer bij beëindiging van de deelneming:'
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel39
  - number: 39.1.a
    text: |-
