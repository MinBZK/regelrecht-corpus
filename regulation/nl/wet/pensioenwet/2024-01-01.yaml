  - number: 87.2.e
    text: |-
      de vermogens van de instelling en de werkgever juridisch zijn gescheiden door het bestaan van een aparte
      juridische entiteit van de instelling, door een speciale preferentieregeling ten gunste van pensioengerechtigden
      of anderszins;
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel87
  - number: 87.2.f
    text: |-
