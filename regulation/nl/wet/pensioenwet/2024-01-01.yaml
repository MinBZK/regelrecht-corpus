      [artikel I, onderdeel A, onder 2, van de Wet algemeen pensioenfonds][ref1] bestaand ondernemingspensioenfonds
      verbonden aan meerdere ondernemingen of groepen als bedoeld in de definitie van ondernemingspensioenfonds in
