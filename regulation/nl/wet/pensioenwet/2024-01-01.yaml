        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '4'
    text: |-
      Op een pensioenaanspraak die of een pensioenrecht dat een tot verevening gerechtigde echtgenoot of
      geregistreerde partner op grond van [artikel 5 van de Wet verevening pensioenrechten bij scheiding][ref1]
      verwerft, zijn de [artikelen 58][ref2] en [61][ref3] niet van overeenkomstige toepassing en zijn de
      [artikelen 71 tot en met 74][ref4], [78 tot en met 80][ref5] en [85 tot en met 89][ref6] van overeenkomstige
      toepassing indien de pensioenregeling daarin voorziet.


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel61
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel71
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel78
      [ref6]: https://wetten.overheid.nl/BWBR0020809#Artikel85
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel4
    references:
