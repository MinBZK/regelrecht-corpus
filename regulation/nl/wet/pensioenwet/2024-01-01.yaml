    text: |-
      De personen die op het tijdstip van inwerkingtreding van
      [artikel V, onderdeel B, van de Wet versterking bestuur pensioenfondsen][ref1] deel uitmaken van de raad van
      toezicht van een pensioenfonds, worden tot het einde van hun op dat tijdstip lopende benoemingstermijn, doch
      uiterlijk tot 1 januari 2017, geacht geschikt te zijn als bedoeld in [artikel 105, derde lid][ref2], en, vanaf het
      tijdstip van inwerkingtreding van [artikel I, onderdeel D, van de Wet versterking bestuur pensioenfondsen][ref3],
      [artikel 106, eerste lid][ref4], en betrouwbaar als bedoeld in artikel 105, vijfde lid, en vanaf het tijdstip van
      inwerkingtreding van artikel I, onderdeel D, van de Wet versterking bestuur pensioenfondsen, artikel 106, vierde
      lid, zolang niet een wijziging in de relevante feiten, omstandigheden of antecedenten een redelijke aanleiding
      geeft tot een beoordeling van die geschiktheid of betrouwbaarheid.


