      regels in de artikelen 1, [2, elfde en twaalfde lid][ref3], [28, derde lid][ref4], [100, derde lid][ref5],
      [111, eerste lid, onderdeel m][ref6], [115, tweede lid][ref7], [115a, derde lid, onderdeel j][ref8], [123][ref9] en
