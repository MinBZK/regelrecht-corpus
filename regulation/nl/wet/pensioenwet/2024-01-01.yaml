  - number: 220b.5
    text: |-
      Het derde en vierde lid zijn van overeenkomstige toepassing indien de verwerving van pensioen is geëindigd om
      andere redenen dan beëindiging van de deelneming.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220b
  - number: 220ca
    text: |-
      Werknemers van 18 jaar of ouder die op het tijdstip van inwerkingtreding van
      [artikel I, onderdelen Ca en H, eerste en derde onderdeel, van de Wet toekomst pensioenen][ref1] niet in de
      pensioenregeling van hun werkgever deelnemen, omdat zij jonger zijn dan de op basis van de pensioenregeling
      gehanteerde toetredingsleeftijd, verwerven pensioenaanspraken vanaf het tijdstip van inwerkingtreding van
      artikel I, onderdelen Ca en H, eerste en derde onderdeel, van de Wet toekomst pensioenen.


      [ref1]: https://wetten.overheid.nl/BWBR0048328#ArtikelI
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel220ca
    references:
      - id: ref1
        bwb_id: BWBR0048328
        artikel: I
  - number: 220d
    text: |-
      In afwijking van [artikel 14, tweede lid][ref1], verwerft een werknemer die werkzaam is in een
      uitzendovereenkomst als bedoeld in [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref2] en die op het
      tijdstip van inwerkingtreding van [artikel I, onderdeel H, van de Wet toekomst pensioenen][ref3] in minder
      dan 26 weken arbeid heeft verricht, ouderdomspensioenaanspraken vanaf het tijdstip van inwerkingtreding van
      artikel I, onderdeel H, van de Wet toekomst pensioenen. Voor de berekening van de termijn van 26 weken is
      [artikel 691, vierde en vijfde lid, van Boek 7 van het Burgerlijk Wetboek][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel690
      [ref3]: https://wetten.overheid.nl/BWBR0048328#ArtikelI
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel691
