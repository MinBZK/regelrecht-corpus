  - number: '40.2'
    text: |-
      De pensioenuitvoerder informeert de gewezen deelnemer binnen drie maanden na een voor hem relevante wijziging in
      het pensioenreglement over die wijziging en de mogelijkheid om het gewijzigde pensioenreglement op te vragen bij
      de pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0020809/2024-01-01#Artikel40
  - number: '40.3'
    text: |-
      De in het eerste lid bedoelde informatie kan in afwijking van dat lid door de pensioenuitvoerder op zijn website
      ter beschikking worden gesteld, mits de informatie ten minste een keer in de vijf jaar met inachtneming van
      [artikel 49][ref1] wordt verstrekt. [Artikel 46a, vijfde lid][ref2], is van overeenkomstige toepassing bij het op
      de website ter beschikking stellen van de informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel46a
