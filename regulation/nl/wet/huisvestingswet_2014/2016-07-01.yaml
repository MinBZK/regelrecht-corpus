        artikel: '8'
  - number: '1.2'
    text: |-
      Indien de gemeenteraad bij de aanwijzing van categorieën woonruimte op grond van [artikel 7][ref1] gebruik maakt
      van huurprijsgrenzen of koopprijsgrenzen wordt verstaan onder: - *huurprijs:* prijs die bij huur en verhuur is
      verschuldigd voor het enkele gebruik van een woonruimte, uitgedrukt in een bedrag per maand;
        - *koopprijs:* prijs die voor de enkele koop van een woonruimte daadwerkelijk is of zal worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel7
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '2.1'
    text: |-
      De gemeenteraad maakt van zijn bevoegdheden op grond van deze wet slechts gebruik indien dat noodzakelijk
      en geschikt is voor het bestrijden van onevenwichtige en onrechtvaardige effecten van schaarste aan goedkope
      woonruimte.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel2
  - number: '2.2'
    text: |-
      De gemeenteraad kan van zijn bevoegdheden op grond van de [artikelen 12][ref1] en [13][ref2], alsmede, voor zover
      daartoe noodzakelijk, van die op grond van [artikel 7][ref3], ook gebruik maken indien daartoe geen noodzaak is
      vanuit het oogpunt van het bestrijden van onevenwichtige en onrechtvaardige effecten van schaarste aan goedkope
      woonruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0035303#Artikel7
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0035303
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '3.1'
    text: |-
      Op verzoek van burgemeester en wethouders van een of meer gemeenten kunnen gedeputeerde staten, indien
      een evenwichtige regionale verdeling van woonruimte dat naar hun oordeel vereist, een woningmarktregio
      aanwijzen waarin de in [artikel 4][ref1] gegeven bevoegdheid uitsluitend met toepassing van de
      [Wet gemeenschappelijke regelingen][ref2] kan worden uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003740
  - number: '3.2'
    text: |-
      Gebieden, bedoeld in [artikel 5, eerste lid, van de Wet bijzondere maatregelen grootstedelijke problematiek][ref1]
      zijn van een aanwijzing als bedoeld in het eerste lid uitgezonderd.


      [ref1]: https://wetten.overheid.nl/BWBR0019388#Artikel5
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019388
        artikel: '5'
  - number: '3.3'
    text: |-
      Indien de woningmarktregio in meer dan een provincie is gelegen, wordt de aanwijzing gegeven door gedeputeerde
      staten van de provincie waarin de meerderheid van de bevolking van de woningmarktregio woont, na overleg met
      gedeputeerde staten van de andere provincie of provincies.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel3
  - number: '3.4'
    text: |-
      Alvorens een aanwijzing te geven plegen gedeputeerde staten overleg met burgemeester en wethouders van de gemeenten
      in de woningmarktregio.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel3
  - number: '3.5'
    text: |-
      De gemeentelijke huisvestingsverordeningen die op het tijdstip waarop de aanwijzing wordt gegeven van kracht
      zijn, vervallen een jaar na dat tijdstip. Deze vervaltermijn treedt in de plaats van de termijnen waarop die
      verordeningen waren vervallen, indien geen aanwijzing zou zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel3
  - number: '4.1'
    text: |-
      De gemeenteraad kan uitsluitend bij verordening voor de duur van ten hoogste vier jaar regels geven met betrekking
      tot:
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel4
  - number: 4.1.a
    text: het in gebruik nemen of geven van goedkope woonruimte, en
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel4
  - number: 4.1.b
    text: wijzigingen in de bestaande woonruimtevoorraad.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel4
  - number: '4.2'
    text: |-
      Het eerste lid is ten aanzien van het kunnen geven van regels met betrekking tot het in gebruik nemen of geven
      van voor verkoop bestemde goedkope woonruimte slechts van toepassing op de gemeenten Ameland, Schiermonnikoog,
      Terschelling, Texel en Vlieland.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel4
  - number: '5'
    text: |-
      De gemeenteraad stelt, indien hij toepassing heeft gegeven aan [artikel 7][ref1], [21][ref2] of [22][ref3], in de
      huisvestingsverordening regels over:


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0035303#Artikel22
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0035303
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 5.a
    text: de wijze van aanvragen van vergunningen als bedoeld in die artikelen, en
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel5
  - number: 5.b
    text: de gegevens die door de aanvrager worden verstrekt bij de aanvraag van een vergunning als bedoeld in die artikelen.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel5
  - number: '6.1'
    text: |-
      Bij de voorbereiding van de vaststelling of wijziging van een huisvestingsverordening plegen burgemeester en
      wethouders overleg met de in de gemeente werkzame toegelaten instellingen, met woonconsumentenorganisaties en met
      andere daarvoor naar hun oordeel in aanmerking komende organisaties.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel6
  - number: '6.2'
    text: |-
      Bij de voorbereiding van de vaststelling of wijziging van een huisvestingsverordening stemmen burgemeester
      en wethouders deze af met burgemeester en wethouders van de overige gemeenten die deel uitmaken van de
      woningmarktregio waarin de gemeente is gelegen.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel6
  - number: '7.1'
    text: |-
      In de huisvestingsverordening kan de gemeenteraad categorieën goedkope woonruimte aanwijzen die niet voor bewoning
      in gebruik mogen worden genomen of gegeven indien daarvoor geen huisvestingsvergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel7
  - number: '7.2'
    text: |-
      Het eerste lid is ten aanzien van het kunnen aanwijzen van voor verkoop bestemde goedkope woonruimte slechts van
      toepassing op de gemeenten Ameland, Schiermonnikoog, Terschelling, Texel en Vlieland.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel7
  - number: '8.1'
    text: |-
      Het is verboden om woonruimte die is aangewezen krachtens [artikel 7][ref1] voor bewoning in gebruik te nemen
      zonder vergunning van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel7
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '8.2'
    text: |-
      Het is verboden om woonruimte die is aangewezen krachtens [artikel 7][ref1] voor bewoning in gebruik te geven aan
      een persoon die niet beschikt over een huisvestingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel7
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '9.1'
    text: |-
      Indien de gemeenteraad toepassing heeft gegeven aan [artikel 7][ref1] legt hij in de huisvestingsverordening de
      criteria vast voor de verlening van huisvestingsvergunningen.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel7
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '9.2'
    text: |-
      De criteria, bedoeld in het eerste lid, hebben geen betrekking op het stellen van eisen aan de minimale hoogte van
      het huishoudinkomen.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel9
  - number: '9.3'
    text: |-
      De criteria, bedoeld in het eerste lid, hebben niet tot gevolg dat toegelaten instellingen die feitelijk werkzaam
      zijn in de gemeente belemmerd worden om bij de toewijzing van hun woongelegenheden uitvoering te geven aan
      wettelijke voorschriften die zijn gegeven met het oog op de nakoming van voor Nederland verbindende internationale
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel9
  - number: '10.1'
    text: |-
      De gemeenteraad wijst indien hij toepassing heeft gegeven aan [artikel 7][ref1] in de huisvestingsverordening de
      categorieën woningzoekenden aan die voor het verkrijgen van een huisvestingsvergunning in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel7
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '10.2'
    text: 'Voor een huisvestingsvergunning komen slechts in aanmerking woningzoekenden die:'
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel10
  - number: 10.2.a
    text: de Nederlandse nationaliteit bezitten of op grond van een wettelijke bepaling als Nederlander worden behandeld, of
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel10
  - number: 10.2.b
    text: |-
      vreemdeling zijn en rechtmatig verblijf in Nederland hebben als bedoeld in
      [artikel 8, onderdelen a tot en met e en l, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '11'
    text: |-
      In de huisvestingsverordening kan de gemeenteraad bepalen dat voor een of meer daarbij aangewezen
      categorieën woonruimte in verband met de aard, grootte of prijs van die woonruimte bij het verlenen van
      huisvestingsvergunningen voorrang wordt gegeven aan een daarbij aangewezen gedeelte van de overeenkomstig
      [artikel 10, eerste lid][ref1], aangewezen categorieën woningzoekenden.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel10
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11a
    text: |-
      In de huisvestingsverordening bepaalt de gemeenteraad dat indien een jongere als bedoeld in
      [artikel 7:274a, tweede lid, van het Burgerlijk Wetboek][ref1] een huurovereenkomst op grond van dat artikel is
      aangegaan, de inschrijving van die jongere om in aanmerking te komen voor een woonruimte niet vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel274a
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 274a
  - number: '12.1'
    text: |-
      In de huisvestingsverordening kan de gemeenteraad bepalen dat voor een of meer daarbij aangewezen categorieën
      woonruimte bij het verlenen van huisvestingsvergunningen voorrang wordt gegeven aan woningzoekenden waarvoor de
      voorziening in de behoefte aan woonruimte dringend noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel12
  - number: '12.2'
    text: |-
      De gemeenteraad legt, indien hij toepassing heeft gegeven aan het eerste lid, in de huisvestingsverordening de
      criteria vast volgens welke de woningzoekenden, bedoeld in dat lid, worden ingedeeld in urgentiecategorieën.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel12
  - number: '12.3'
    text: |-
      Woningzoekenden die verblijven in een voorziening voor tijdelijke opvang van personen, die in verband met problemen
      van relationele aard of geweld hun woonruimte hebben verlaten, woningzoekenden die mantelzorg als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Wet maatschappelijke ondersteuning][ref1] verlenen of ontvangen alsmede
      vergunninghouders als bedoeld in [artikel 28][ref2] behoren in ieder geval tot de woningzoekenden, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel28
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '28'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '13.1'
    text: |-
      Burgemeester en wethouders beslissen over de indeling van woningzoekenden in de urgentiecategorieën, bedoeld in
      [artikel 12, tweede lid][ref1]. Burgemeester en wethouders kunnen van deze bevoegdheid mandaat verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel12
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '13.2'
    text: |-
      In de huisvestingsverordening stelt de gemeenteraad regels omtrent de wijze waarop woningzoekenden kunnen verzoeken
      om indeling in een urgentiecategorie.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel13
  - number: '14.1'
    text: |-
      In de huisvestingsverordening kan de gemeenteraad bepalen dat bij de verlening van huisvestingsvergunningen
      voorrang wordt gegeven aan woningzoekenden die economisch of maatschappelijk gebonden zijn aan de woningmarktregio,
      de gemeente of een tot de gemeente behorende kern voor een of meer daarbij aangewezen categorieën woonruimte
      voor zover de gemeente als gevolg van regels gesteld bij of krachtens een algemene maatregel van bestuur als
      bedoeld in [artikel 4.3 van de Wet ruimtelijke ordening][ref1] of bij een provinciale verordening als bedoeld in
      [artikel 4.1 van die wet][ref2] geringe of geen mogelijkheden heeft tot uitbreiding van de woonruimtevoorraad.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '4'
  - number: '14.2'
    text: |-
      In de huisvestingsverordening kan de gemeenteraad voor zover het een andere gemeente dan die, bedoeld in eerste
      lid, betreft, bepalen dat bij de verlening van huisvestingsvergunningen voor ten hoogste 50 procent van een
      of meer daarbij aangewezen categorieën woonruimte, voorrang wordt gegeven aan woningzoekenden die economisch
      of maatschappelijk gebonden zijn aan de woningmarktregio. Voor ten hoogste de helft van dat percentage mag
      bij de verlening van huisvestingsvergunningen voorrang worden gegeven aan woningzoekenden die economisch of
      maatschappelijk gebonden zijn aan een tot de gemeente behorende kern.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel14
  - number: '14.3'
    text: 'Voor de toepassing van het eerste en tweede lid is een woningzoekende:'
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel14
  - number: 14.3.a
    text: |-
      economisch gebonden aan de woningmarktregio, de gemeente of de kern indien hij met het oog op de voorziening in het
      bestaan een redelijk belang heeft zich in die woningmarktregio, die gemeente of die kern te vestigen, en
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel14
  - number: 14.3.b
    text: 'maatschappelijk gebonden aan de woningmarktregio, de gemeente of de kern indien hij:'
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel14
  - number: 14.3.b.1°
    text: |-
      een redelijk, met de plaatselijke samenleving verband houdend belang heeft zich in die woningmarktregio, die
      gemeente of die kern te vestigen, of
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel14
  - number: 14.3.b.2°
    text: |-
      ten minste zes jaar onafgebroken ingezetene is dan wel gedurende de voorafgaande tien jaar ten minste zes jaar
      onafgebroken ingezetene is geweest van die woningmarktregio, die gemeente of die kern.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel14
  - number: '15.1'
    text: |-
      Een huisvestingsvergunning wordt verleend indien de aanvrager behoort tot een krachtens
      [artikel 10, eerste lid][ref1], aangewezen categorie woningzoekenden en hij voldoet aan het bepaalde in artikel 10,
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel10
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '15.2'
    text: |-
      Indien de woonruimte is aangewezen op grond van [artikel 11][ref1], [12, eerste lid][ref2], of
      [14, eerste of tweede lid][ref3], kan de huisvestingsvergunning worden geweigerd indien een of meer andere
      woningzoekenden aan wie op grond van die artikelen voorrang kan worden gegeven in aanmerking wensen te komen voor
      die woonruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0035303#Artikel14
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0035303
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '15.3'
    text: |-
      De vergunning kan, in afwijking van het eerste lid, worden geweigerd in het geval en onder de voorwaarden, bedoeld
      in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '15.4'
    text: |-
      Voordat toepassing wordt gegeven aan het eerste lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '16'
    text: |-
      [Artikel 15, tweede lid][ref1], is met betrekking tot een op grond van [artikel 14, eerste of tweede lid][ref2],
      aangewezen woonruimte niet van toepassing ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel14
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 16.a
    text: vergunninghouders die na de verlening van de verblijfsvergunning voor de eerste maal woonruimte zoeken, en
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel16
  - number: 16.b
    text: |-
      woningzoekenden die verblijven in een voorziening voor tijdelijke opvang van personen die in verband met problemen
      van relationele aard of geweld hun woonruimte hebben verlaten.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel16
  - number: 16a.1
    text: |-
      De vergunning kan, in afwijking van [artikel 16, eerste lid][ref1], worden geweigerd in het geval en onder de
      voorwaarden, bedoeld in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 16a.2
    text: |-
      Voordat toepassing wordt gegeven aan het eerste lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '17.1'
    text: |-
      [Artikel 15, tweede lid][ref1], is met betrekking tot een op grond van [artikel 14, eerste of tweede lid][ref2],
      aangewezen woonruimte voorts niet van toepassing indien de eigenaar van de woonruimte gedurende een door de
      gemeenteraad in de huisvestingsverordening vastgestelde termijn die woonruimte vruchteloos heeft aangeboden aan
      woningzoekenden als bedoeld in dat lid, en:


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel14
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 17.1.a
    text: |-
      ingeval de woonruimte te huur wordt aangeboden en
      [onderafdeling 2 van afdeling 5 van titel 4 van Boek 7 van het Burgerlijk Wetboek][ref1] op die woonruimte van
      toepassing is, de gevraagde huurprijs niet hoger is dan de voor die woonruimte ingevolge die onderafdeling geldende
      maximale huurprijsgrens;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#ParagraafOnderafdeling_2
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005290
        paragraaf: Onderafdeling_2
  - number: 17.1.b
    text: |-
      ingeval de woonruimte te huur wordt aangeboden en de in onderdeel a genoemde onderafdeling op die woonruimte
      niet van toepassing is, de gevraagde huurprijs niet hoger is dan redelijk is, gelet op de huurprijs die in het
      economisch verkeer voor vergelijkbare woonruimten wordt overeengekomen, en
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel17
  - number: 17.1.c
    text: |-
      ingeval de woonruimte te koop wordt aangeboden, de koopprijs niet hoger is dan de waarde, bedoeld in
      [artikel 17, eerste lid, van de Wet waardering onroerende zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel17
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '17'
  - number: '17.2'
    text: |-
      De gemeenteraad stelt in de huisvestingsverordening een termijn als bedoeld in het eerste lid van ten hoogste
      dertien weken en stelt regels met betrekking tot de wijze waarop de aanbieding, bedoeld in het eerste lid, dient
      plaats te vinden. De gemeenteraad kan daarbij regels stellen omtrent de wijze waarop ten genoegen van burgemeester
      en wethouders moet worden aangetoond dat de aanbieding in overeenstemming met het bij en krachtens deze wet
      bepaalde heeft plaatsgevonden, alsmede met betrekking tot de wijze waarop aan burgemeester en wethouders verslag
      moet worden uitgebracht over het verloop van de aanbiedingsprocedure.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel17
  - number: '18.1'
    text: 'Burgemeester en wethouders kunnen een huisvestingsvergunning intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel18
  - number: 18.1.a
    text: |-
      de houder van de vergunning de in die vergunning vermelde woonruimte niet binnen de door burgemeester en wethouders
      bij de verlening gestelde termijn in gebruik heeft genomen, of
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel18
  - number: 18.1.b
    text: |-
      die vergunning is verleend op grond van door de houder van de vergunning verstrekte gegevens waarvan deze wist of
      redelijkerwijs moest vermoeden dat zij onjuist of onvolledig waren.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel18
  - number: '18.2'
    text: |-
      Burgemeester en wethouders kunnen een huisvestingsvergunning voorts intrekken in het geval en onder de voorwaarden,
      bedoeld in [artikel 3 van de Wet integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '18.3'
    text: |-
      Voordat toepassing wordt gegeven aan het tweede lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '19'
    text: |-
      Burgemeester en wethouders kunnen van de bevoegdheden krachtens de [artikelen 15 tot en met 17][ref1] mandaat
      verlenen aan eigenaren of beheerders van woonruimte voor zover het die woonruimte betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel15
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '20'
    text: |-
      In de huisvestingsverordening kan de gemeenteraad regels stellen omtrent de wijze van bekendmaken van het aanbod
      van de op grond van [artikel 7][ref1] aangewezen categorieën woonruimte die bestemd zijn voor verhuur.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel7
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '21'
    text: |-
      Het is verboden om een woonruimte, behorend tot een met het oog op het behoud of de samenstelling van de
      woonruimtevoorraad door de gemeenteraad in de huisvestingsverordening aangewezen categorie gebouwen en die gelegen
      is in een in de huisvestingsverordening aangewezen wijk, zonder vergunning van burgemeester en wethouders:
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel21
  - number: 21.a
    text: |-
      anders dan ten behoeve van de bewoning of het gebruik als kantoor of praktijkruimte door de eigenaar aan de
      bestemming tot bewoning te onttrekken;
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel21
  - number: 21.b
    text: |-
      anders dan ten behoeve van de bewoning of het gebruik als kantoor of praktijkruimte door de eigenaar met andere
      woonruimte samen te voegen;
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel21
  - number: 21.c
    text: van zelfstandige in onzelfstandige woonruimte om te zetten;
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel21
  - number: 21.d
    text: te verbouwen tot twee of meer woonruimten.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel21
  - number: '22.1'
    text: |-
      Het is verboden om een recht op een gebouw dat behoort tot een door de gemeenteraad in de huisvestingsverordening
      daartoe aangewezen categorie gebouwen zonder vergunning van burgemeester en wethouders te splitsen in
      appartementsrechten als bedoeld in [artikel 106, eerste en vierde lid, van Boek 5 van het Burgerlijk Wetboek][ref1]
      indien een of meer appartementsrechten de bevoegdheid omvatten tot het gebruik van een of meer gedeelten van het
      gebouw als woonruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel106
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '106'
  - number: '22.2'
    text: |-
      Op het verlenen van deelnemings- of lidmaatschapsrechten of het aangaan van een verbintenis daartoe door een
      rechtspersoon is het eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel22
  - number: '23'
    text: |-
      Een vergunning als bedoeld in [artikel 21][ref1] of [22][ref2] kan slechts worden aangevraagd door de eigenaar van
      de woonruimte respectievelijk het gebouw.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel22
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '24'
    text: |-
      De gemeenteraad stelt in de huisvestingsverordening regels omtrent de gronden die tot weigering van een vergunning
      als bedoeld in [artikel 21][ref1] of [22][ref2] kunnen leiden en de voorwaarden en voorschriften die burgemeester
      en wethouders kunnen verbinden aan een vergunning als bedoeld in die artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel22
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '25.1'
    text: |-
      De vergunning, bedoeld in [artikel 21][ref1] of [22][ref2], kan worden geweigerd in het geval en onder de
      voorwaarden, bedoeld in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '25.2'
    text: |-
      Voordat toepassing wordt gegeven aan het eerste lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '25.3'
    text: |-
      Burgemeester en wethouders beslissen op de aanvraag om een vergunning als bedoeld in [artikel 21][ref1] of
      [22][ref2] binnen acht weken na de datum van ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel22
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '25.2'
    text: |-
      Burgemeester en wethouders kunnen de termijn, bedoeld in het eerste lid, eenmaal verlengen met ten hoogste zes
      weken. Zij maken hun besluit daartoe bekend binnen de termijn, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel25
  - number: '25.3'
    text: |-
      [Afdeling 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '26.1'
    text: |-
      Burgemeester en wethouders kunnen een vergunning als bedoeld in [artikel 21][ref1] of [22][ref2] intrekken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel22
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 26.1.a
    text: |-
      de houder van die vergunning niet binnen een jaar nadat die vergunning onherroepelijk is geworden is overgegaan tot
      onttrekking, samenvoeging of omzetting, onderscheidenlijk tot inschrijving in de openbare registers van de akte van
      splitsing in appartementsrechten, bedoeld in [artikel 109 van Boek 5 van het Burgerlijk Wetboek][ref1], of tot het
      verlenen van deelnemings- of lidmaatschapsrechten;


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel109
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '109'
  - number: 26.1.b
    text: |-
      die vergunning is verleend op grond van door de houder van die vergunning verstrekte gegevens waarvan deze wist of
      redelijkerwijs moest vermoeden dat zij onjuist of onvolledig waren, of
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel26
  - number: 26.1.c
    text: |-
      de voorwaarden of voorschriften, bedoeld in [artikel 24][ref1], niet worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel24
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '26.2'
    text: |-
      De vergunning, bedoeld in [artikel 21][ref1] of [22][ref2], kan voorts worden ingetrokken in het geval en onder de
      voorwaarden, bedoeld in [artikel 3 van de Wet integriteitsbeoordelingen door het openbaar bestuur][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '26.3'
    text: |-
      Voordat toepassing wordt gegeven aan het tweede lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '27'
    text: |-
      Inschrijving in de openbare registers van een akte als bedoeld in
      [artikel 109 van Boek 5 van het Burgerlijk Wetboek][ref1] vindt alleen plaats indien onder de akte een
      notariële verklaring is opgenomen dat ten tijde van het verlijden van de akte een vergunning als bedoeld in
      [artikel 22][ref2] niet was vereist dan wel onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel22
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '109'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '28'
    text: |-
      Burgemeester en wethouders dragen zorg voor de voorziening in de huisvesting van vergunninghouders in de gemeente
      overeenkomstig de voor de gemeente geldende taakstelling.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel28
  - number: '29.1'
    text: |-
      De taakstelling, bedoeld in [artikel 28][ref1], is de uitkomst, naar boven afgerond op een geheel getal, van de
      formule: 'in welke formule voorstelt: - *vg:* het door Onze Minister van Veiligheid en Justitie in de Staatscourant'
      bekendgemaakte totale aantal vergunninghouders in wier huisvesting in het daarbij aangegeven kalenderhalfjaar
      naar verwachting voorzien zal moeten worden, welke bekendmaking ten minste dertien weken voor de aanvang van het
      kalenderhalfjaar geschiedt;
        - *iG:* het aantal inwoners van de gemeente volgens de door het Centraal bureau voor de statistiek gepubliceerde
      bevolkingscijfers op 1 januari van het kalenderjaar dat voorafgaat aan het kalenderjaar waartoe het
      kalenderhalfjaar, bedoeld in onderdeel a, behoort onderscheidenlijk het door gedeputeerde staten op grond van
      [artikel 30, eerste lid][ref2], vastgestelde aantal inwoners;
        - *iN:* het aantal inwoners van Nederland volgens de door het Centraal bureau voor de statistiek gepubliceerde
      bevolkingscijfers op 1 januari van het kalenderjaar dat voorafgaat aan het kalenderjaar waartoe het
      kalenderhalfjaar, bedoeld in onderdeel a, behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel30
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '28'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '30'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '29.2'
    text: |-
      Burgemeester en wethouders van twee of meer gemeenten kunnen gezamenlijk besluiten de taakstelling die voor hun
      onderscheidenlijke gemeenten volgt uit de formule, genoemd in het eerste lid, te wijzigen, met dien verstande dat
      de som van de aantallen vergunninghouders in wier huisvesting na die wijziging in de betrokken gemeenten tezamen
      dient te worden voorzien niet wijzigt.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel29
  - number: '30.1'
    text: |-
      Gedeputeerde staten van de betrokken provincie of de betrokken provincies stellen het aantal inwoners van een
      gemeente op de datum, bedoeld in [artikel 29, eerste lid, onderdeel a][ref1], vast voor de gemeenten die zijn
      betrokken bij een wijziging van de gemeentelijke indeling met ingang van 1 januari van het kalenderjaar waartoe het
      kalenderhalfjaar, bedoeld in artikel 29, eerste lid, onderdeel c, behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel29
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '30.2'
    text: |-
      Bij de vaststelling, bedoeld in het eerste lid, wordt zo veel mogelijk rekening gehouden met de aantallen inwoners
      van de samenstellende delen van de bij de wijziging van de gemeentelijke indeling betrokken gemeenten.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel30
  - number: '30.3'
    text: |-
      Gedeputeerde staten maken het aantal inwoners bekend voor 1 oktober van het in
      [artikel 29, eerste lid, onderdeel a][ref1], laatstbedoelde kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel29
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '31.1'
    text: |-
      Bij ministeriële regeling kunnen categorieën van woningzoekenden worden aangewezen, wier huisvesting bijzondere
      zorg van rijkswege behoeft.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel31
  - number: '31.2'
    text: |-
      Onze Minister kan burgemeester en wethouders een aanwijzing geven met betrekking tot de voorziening in de
      huisvesting van een of meer personen die behoren tot een krachtens het eerste lid aangewezen categorie indien dat
      met het oog op de huisvesting van die persoon of personen noodzakelijk is. Alvorens een aanwijzing te geven pleegt
      Onze Minister overleg met burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel31
  - number: '31.3'
    text: Burgemeester en wethouders zijn verplicht aan een aanwijzing gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel31
  - number: '31.4'
    text: |-
      Onze Minister stelt een regeling als bedoeld in het eerste lid slechts vast indien omstandigheden van bijzondere
      aard naar zijn oordeel daartoe aanleiding geven. De regeling geldt voor een daarbij aangegeven periode van ten
      hoogste twee jaar.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel31
  - number: '32'
    text: |-
      Burgemeester en wethouders dragen zorg voor de bestuursrechtelijke handhaving van het bij of krachtens deze wet
      bepaalde.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel32
  - number: '33.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de bij besluit van
      burgemeester en wethouders aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel33
  - number: '33.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel33
  - number: '34'
    text: |-
      De toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, een woning binnen te treden zonder
      toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel34
  - number: '35.1'
    text: |-
      De gemeenteraad kan in de huisvestingsverordening bepalen dat een bestuurlijke boete kan worden opgelegd ter zake
      van de overtreding van de verboden bedoeld in de [artikelen 8][ref1], [21][ref2] of [22][ref3], of van het handelen
      in strijd met de voorwaarden of voorschriften, bedoeld in [artikel 26][ref4]. Burgemeester en wethouders zijn
      bevoegd tot het opleggen van een bestuurlijke boete.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0035303#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0035303#Artikel26
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0035303
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0035303
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '35.2'
    text: 'De op te leggen bestuurlijke boete bedraagt ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel35
  - number: 35.2.a
    text: |-
      het bedrag dat is vastgesteld voor de eerste categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1], voor overtreding van het verbod, bedoeld in
      [artikel 8, eerste lid][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel8
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 35.2.b
    text: |-
      het bedrag dat is vastgesteld voor de vierde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1], voor overtreding van de verboden, bedoeld in de
      [artikelen 8, tweede lid][ref2], [21][ref3] of [22][ref4], of voor het handelen in strijd met de voorwaarden of
      voorschriften, bedoeld in [artikel 26][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0035303#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0035303#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0035303#Artikel26
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0035303
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0035303
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0035303
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '35.3'
    text: |-
      De gemeenteraad stelt in de huisvestingsverordening het bedrag vast van de bestuurlijke boete die voor de
      verschillende overtredingen kan worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel35
  - number: '50'
    text: 'De volgende wetten worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel50
  - number: 50.a
    text: |-
      de __REF000___________________________________________________________________________________________________________
      _______________________________ (Stb. 159);


      [ref1]: https://wetten.overheid.nl/BWBR0007313
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0007313
  - number: 50.b
    text: |-
      de __REF000___________________________________________________________________________________________________________
      _________________________ (Stb. 620);


      [ref1]: https://wetten.overheid.nl/BWBR0007736
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0007736
  - number: 50.c
    text: |-
      de __REF000___________________________________________________________________________________________________________
      ___________________________________________________________ (Stb. 459), en


      [ref1]: https://wetten.overheid.nl/BWBR0009752
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0009752
  - number: 50.d
    text: |-
      de __REF000___________________________________________________________________________________________________________
      ______________________________________ (Stb. 136).


      [ref1]: https://wetten.overheid.nl/BWBR0018067
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0018067
  - number: '51.1'
    text: |-
      De [Huisvestingswet][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005674
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005674
  - number: '51.2'
    text: |-
      Een verordening die berust op de [Huisvestingswet][ref1] vervalt zes maanden na het tijdstip van inwerkingtreding
      van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005674
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005674
  - number: '51.3'
    text: |-
      Het tweede lid is niet van toepassing op de huisvestingsverordeningen, bedoeld
      in [artikel 2, derde lid, van de Huisvestingswet][ref1]. Op deze verordeningen is
      [artikel XXIII van de Wet afschaffing plusregio’s][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0036043#ArtikelXXIII
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0036043
        artikel: XXIII
  - number: '51.4'
    text: |-
      Een vergunning als bedoeld in de [artikelen 25][ref1] en [26, eerste en tweede lid, van de Huisvestingswet][ref2],
      die is verleend voor het tijdstip van inwerkingtreding van een huisvestingsverordening, wordt gelijkgesteld met
      een huisvestingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel26
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '26'
  - number: '51.5'
    text: |-
      Een vergunning als bedoeld in de [artikelen 30, eerste lid][ref1], en [33, van de Huisvestingswet][ref2], die
      is verleend voor het tijdstip van inwerkingtreding van een huisvestingsverordening, wordt gelijkgesteld met een
      vergunning die is verleend met toepassing van [artikel 21][ref3] onderscheidenlijk [22][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0035303#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0035303#Artikel22
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '33'
      - id: ref3
        bwb_id: BWBR0035303
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0035303
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '51.6'
    text: |-
      Aanvragen om een vergunning die zijn ingediend voor het tijdstip van inwerkingtreding van een
      huisvestingsverordening, worden behandeld volgens het voor het tijdstip van inwerkingtreding van deze wet geldende
      recht.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel51
  - number: '52'
    text: |-
      Onze Minister zendt binnen vijf jaar na het tijdstip van inwerkingtreding van deze wet aan de Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel52
  - number: '53'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel53
  - number: '54'
    text: 'Deze wet wordt aangehaald als: Huisvestingswet 2014.'
    url: https://wetten.overheid.nl/BWBR0035303/2016-07-01#Artikel54
