  - number: 23a
    text: |-
      1 Het is verboden om een woonruimte, behorend tot een met het oog op het behoud of de samenstelling van
      de woonruimtevoorraad of het behoud van de leefbaarheid van de woonomgeving door de gemeenteraad in de
      huisvestingsverordening aangewezen categorie woonruimte en gelegen in een in die verordening aangewezen gebied,
      voor een in die verordening omschreven vorm van toeristische verhuur aan te bieden zonder het registratienummer van
      die woonruimte te vermelden bij iedere aanbieding van die woonruimte voor toeristische verhuur.

      2 Een registratienummer als bedoeld in het eerste lid, wordt aangevraagd door degene die een woonruimte aanbiedt
      voor toeristische verhuur.
    url: https://wetten.overheid.nl/BWBR0035303/2021-01-01#Artikel23a
  - number: 23b
    text: |-
      1 Indien de gemeenteraad toepassing heeft gegeven aan [artikel 23a][ref1], kan hij in die huisvestingsverordening
      tevens bepalen dat het verboden is een op basis van dat artikel aangewezen categorie van woonruimte die gelegen
      is in een in die verordening aangewezen gebied voor een in de verordening omschreven vorm van toeristische verhuur
      meer dan een in die verordening bepaald aantal nachten per jaar in gebruik te geven voor toeristische verhuur.

      2 Indien de gemeenteraad toepassing heeft gegeven aan het eerste lid, kan hij in de huisvestingsverordening bepalen
      dat het verboden is de woonruimte in gebruik te geven voor toeristische verhuur, zonder deze verhuring vooraf te
      melden bij burgemeester en wethouders.

      3 Een melding als bedoeld in het tweede lid, wordt gedaan door degene die de woonruimte in gebruik geeft voor
      toeristische verhuur.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel23a
    url: https://wetten.overheid.nl/BWBR0035303/2021-01-01#Artikel23b
