  - number: 23f
    text: |-
      1 In afwijking van [artikel 2:15, eerste lid, van de Algemene wet bestuursrecht][ref1] kan het registratienummer,
      bedoeld in [artikel 23a][ref2], uitsluitend via elektronische weg worden aangevraagd.

      2 Burgemeester en wethouders zijn verantwoordelijk voor de inrichting van het systeem ten behoeve van het afgeven
      van het registratienummer, bedoeld in [artikel 23a][ref3], en voor de verwerking van persoonsgegevens in dit
      systeem. Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de inrichting van
      dit registratiesysteem.

      3 De persoonsgegevens die verwerkt worden in het kader van de aanvraag van het registratienummer, bedoeld in
      [artikel 23a][ref4], kunnen ook verwerkt worden voor:

      a. het toezicht op de naleving van de krachtens [artikel 2 van de Woningwet][ref5] gegeven voorschriften vanuit het
      oogpunt van veiligheid, gezondheid en bruikbaarheid van de woonruimte, en

      b. de heffing en invordering van de toeristenbelasting, bedoeld in [artikel 224 van de Gemeentewet][ref6].


