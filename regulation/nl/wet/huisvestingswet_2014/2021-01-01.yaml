    text: |-
      Inschrijving in de openbare registers van een akte als bedoeld in
      [artikel 109 van Boek 5 van het Burgerlijk Wetboek][ref1] vindt alleen plaats indien onder de akte een
      notariële verklaring is opgenomen dat ten tijde van het verlijden van de akte een vergunning als bedoeld in
      [artikel 22][ref2] niet was vereist dan wel onherroepelijk is geworden.


