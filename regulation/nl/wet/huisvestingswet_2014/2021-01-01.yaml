  - number: '4'
    text: |-
      1 De gemeenteraad kan uitsluitend bij verordening voor de duur van ten hoogste vier jaar regels geven met
      betrekking tot:

      a. het in gebruik nemen of geven van woonruimte, en

      b. wijzigingen in de bestaande woonruimtevoorraad.

      2 Het eerste lid is ten aanzien van het kunnen geven van regels met betrekking tot het in gebruik nemen of geven
      van voor verkoop bestemde woonruimte slechts van toepassing op de gemeenten Ameland, Schiermonnikoog, Terschelling,
      Texel en Vlieland.
    url: https://wetten.overheid.nl/BWBR0035303/2021-01-01#Artikel4
  - number: '5'
    text: |-
      De gemeenteraad stelt, indien hij toepassing heeft gegeven aan [artikel 7][ref1], [21][ref2] of [22][ref3], in de
      huisvestingsverordening regels over:

      a. de wijze van aanvragen van vergunningen als bedoeld in die artikelen, en

      b. de gegevens die door de aanvrager worden verstrekt bij de aanvraag van een vergunning als bedoeld in die
      artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0035303#Artikel22
