        artikel: '106'
  - number: '23'
    text: |-
      1 Een vergunning als bedoeld in [artikel 21][ref1] of [22][ref2] kan slechts worden aangevraagd door de eigenaar
      van de woonruimte respectievelijk het gebouw.

      2 In afwijking van [artikel 2:15, eerste lid, van de Algemene wet bestuursrecht][ref3], stellen burgemeester en
      wethouders de elektronische weg open voor de aanvraag van een vergunning als bedoeld in [artikel 21][ref4] of
      [22][ref5].


