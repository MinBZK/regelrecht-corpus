        paragraaf: '1'
  - number: '31'
    text: |-
      1 Bij ministeriële regeling kunnen categorieën van woningzoekenden worden aangewezen, wier huisvesting bijzondere
      zorg van rijkswege behoeft.

      2 Onze Minister kan burgemeester en wethouders een aanwijzing geven met betrekking tot de voorziening in de
      huisvesting van een of meer personen die behoren tot een krachtens het eerste lid aangewezen categorie indien dat
      met het oog op de huisvesting van die persoon of personen noodzakelijk is. Alvorens een aanwijzing te geven pleegt
      Onze Minister overleg met burgemeester en wethouders.

      3 Burgemeester en wethouders zijn verplicht aan een aanwijzing gevolg te geven.

      4 Onze Minister stelt een regeling als bedoeld in het eerste lid slechts vast indien omstandigheden van bijzondere
      aard naar zijn oordeel daartoe aanleiding geven. De regeling geldt voor een daarbij aangegeven periode van ten
      hoogste twee jaar.
    url: https://wetten.overheid.nl/BWBR0035303/2021-01-01#Artikel31
  - number: '32'
    text: |-
      Burgemeester en wethouders dragen zorg voor de bestuursrechtelijke handhaving van het bij of krachtens deze wet
      bepaalde.
    url: https://wetten.overheid.nl/BWBR0035303/2021-01-01#Artikel32
  - number: '33'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de bij besluit van
      burgemeester en wethouders aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0035303/2021-01-01#Artikel33
  - number: 33a
    text: |-
      De gemeenteraad kan in de huisvestingsverordening bepalen dat burgemeester en wethouders:

      a. een verbod tot het in gebruik geven van een woonruimte voor toeristische verhuur kunnen opleggen voor ten
      hoogste een jaar aan een aanbieder indien binnen een tijdvak van vijf jaar voorafgaand aan de constatering door een
      ambtenaar als bedoeld in [artikel 33, eerste lid][ref1], van een overtreding van de bij de huisvestingsverordening
      aan toeristische verhuur gestelde eisen, ten minste twee maal een bestuurlijke boete is opgelegd voor overtreding
      van de bij de huisvestingsverordening aan toeristische verhuur gestelde eisen;

      b. een aanwijzing kunnen geven aan een digitaal platform om de aanbieding voor toeristische verhuur van de
      aanbieder aan wie een verbod tot het in gebruik geven van een woning voor toeristische verhuur als bedoeld in het
      eerste lid is opgelegd te blokkeren.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel33
    url: https://wetten.overheid.nl/BWBR0035303/2021-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '34'
    text: |-
      De toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, een woning binnen te treden zonder
      toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0035303/2021-01-01#Artikel34
  - number: '35'
    text: |-
      1 De gemeenteraad kan in de huisvestingsverordening bepalen dat een bestuurlijke boete kan worden
      opgelegd ter zake van de overtreding van de verboden bedoeld in [artikel 8, eerste en tweede lid][ref1],
      [artikel 21][ref2], [artikel 22, eerste lid][ref3], [artikel 23a, eerste of derde lid][ref4],
      [artikel 23b, eerste en tweede lid][ref5], [artikel 23c, eerste lid][ref6], [artikel 23d][ref7] of
      [artikel 23e][ref8], of van het handelen in strijd met de voorwaarden of voorschriften, bedoeld in
      [artikel 26][ref9]. Burgemeester en wethouders zijn bevoegd tot het opleggen van een bestuurlijke boete.

      2 De op te leggen bestuurlijke boete bedraagt ten hoogste:

      a. het bedrag dat is vastgesteld voor de eerste categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref10], voor overtreding van het verbod, bedoeld in
      [artikel 8, eerste lid][ref11];

      b. het bedrag dat is vastgesteld voor de derde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref12], voor overtreding van het verbod, bedoeld in de
      [artikelen 23a, eerste of derde lid][ref13], [23b, tweede lid][ref14], [23d][ref15] of [23e][ref16];

      c. het bedrag dat is vastgesteld voor de vierde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref17], voor overtreding van de verboden,
      bedoeld in [artikel 8, tweede lid][ref18], [artikel 21][ref19], [artikel 22, eerste lid][ref20],
      [artikel 23b, eerste lid][ref21], of [artikel 23c, eerste lid][ref22], of voor het handelen in strijd met de
      voorwaarden of voorschriften, bedoeld in [artikel 26][ref23], en

      d. het bedrag dat is vastgesteld voor de vijfde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref24], voor overtreding van een verbod als
      bedoeld in [artikel 8, tweede lid][ref25], [artikel 21][ref26], [artikel 23b, eerste lid][ref27], of
      [artikel 23c, eerste lid][ref28], indien binnen een tijdvak van vier jaar voorafgaand aan de constatering door een
      ambtenaar als bedoeld in [artikel 33, eerste lid][ref29], van die overtreding een bestuurlijke boete is opgelegd
      voor overtreding van hetzelfde verbod.

      3 De gemeenteraad stelt in de huisvestingsverordening het bedrag vast van de bestuurlijke boete die voor de
      verschillende overtredingen kan worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0035303#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0035303#Artikel23a
      [ref5]: https://wetten.overheid.nl/BWBR0035303#Artikel23b
