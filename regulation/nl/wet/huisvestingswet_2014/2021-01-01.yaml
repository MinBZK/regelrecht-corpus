    text: |-
      1 In afwijking van [artikel 2:15, eerste lid, van de Algemene wet bestuursrecht][ref1] kan de melding, bedoeld in
      [artikel 23b, tweede lid][ref2], uitsluitend via elektronische weg worden gedaan.

      2 Burgemeester en wethouders zijn verantwoordelijk voor de inrichting van het systeem ten behoeve van de melding,
      bedoeld in [artikel 23b, tweede lid][ref3], en voor de verwerking van persoonsgegevens in dit systeem.

      3 De persoonsgegevens die verwerkt worden in het kader van de melding, bedoeld in [artikel 23b, tweede lid][ref4],
      kunnen ook verwerkt worden voor de heffing en invordering van de toeristenbelasting, bedoeld in
      [artikel 224 van de Gemeentewet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel215
