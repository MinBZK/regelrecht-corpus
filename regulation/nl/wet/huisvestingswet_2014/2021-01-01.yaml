  - number: '52'
    text: |-
      1 Onze Minister zendt binnen vijf jaar na het tijdstip van inwerkingtreding van deze wet aan de Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.

      2 Onze Minister zendt binnen vijf jaar na het tijdstip van inwerkingtreding van de wet van 7 oktober 2020 tot
      wijziging van de Huisvestingswet 2014 in verband met de aanpak van ongewenste neveneffecten van toeristische
      verhuur van woonruimte (Wet toeristische verhuur van woonruimte) aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van die wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0035303/2021-01-01#Artikel52
