  - number: '3'
    text: |-
      1 Op verzoek van burgemeester en wethouders van een of meer gemeenten kunnen gedeputeerde staten, indien
      een evenwichtige regionale verdeling van woonruimte dat naar hun oordeel vereist, een woningmarktregio
      aanwijzen waarin de in [artikel 4][ref1] gegeven bevoegdheid uitsluitend met toepassing van de
      [Wet gemeenschappelijke regelingen][ref2] kan worden uitgeoefend.

      2 Complexen, straten of gebieden als bedoeld in
      [artikel 5, eerste, tweede of derde lid, van de Wet bijzondere maatregelen grootstedelijke problematiek][ref3] zijn
      van een aanwijzing als bedoeld in het eerste lid uitgezonderd.

      3 Indien de woningmarktregio in meer dan een provincie is gelegen, wordt de aanwijzing gegeven door gedeputeerde
      staten van de provincie waarin de meerderheid van de bevolking van de woningmarktregio woont, na overleg met
      gedeputeerde staten van de andere provincie of provincies.

      4 Alvorens een aanwijzing te geven plegen gedeputeerde staten overleg met burgemeester en wethouders van de
      gemeenten in de woningmarktregio.

      5 De gemeentelijke huisvestingsverordeningen die op het tijdstip waarop de aanwijzing wordt gegeven van kracht
      zijn, vervallen een jaar na dat tijdstip. Deze vervaltermijn treedt in de plaats van de termijnen waarop die
      verordeningen waren vervallen, indien geen aanwijzing zou zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003740
      [ref3]: https://wetten.overheid.nl/BWBR0019388#Artikel5
