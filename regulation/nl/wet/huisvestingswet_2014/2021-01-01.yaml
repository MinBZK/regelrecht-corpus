    text: |-
      In afwijking van [artikel 2:15, eerste lid, van de Algemene wet bestuursrecht][ref1], stellen
      burgemeester en wethouders de elektronische weg open voor de aanvraag van een vergunning als bedoeld in
      [artikel 23c, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel215
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel23c
