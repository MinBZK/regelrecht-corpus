  - number: '39'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *akte:* akte als bedoeld in [artikel 89 lid 1 van Boek 3 van het Burgerlijk Wetboek][ref1];
        - *openbare registers:* openbare registers als bedoeld in [artikel 16 van Boek 3 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel16
