  - number: '42'
    text: |-
      De vergunning, bedoeld in [artikel 41, eerste lid][ref1], kan slechts worden aangevraagd door de eigenaar van de
      woonruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel41
    url: https://wetten.overheid.nl/BWBR0035303/2026-01-01#Artikel42
