  - number: '2'
    text: |-
      1 De gemeenteraad maakt van zijn bevoegdheden op grond van deze wet slechts gebruik indien dat noodzakelijk en
      geschikt is voor het bestrijden van onevenwichtige en onrechtvaardige effecten van schaarste aan woonruimte.

      2 De gemeenteraad kan van zijn bevoegdheden op grond van:

      a. de [artikelen 12][ref1] en [13][ref2], alsmede, voor zover daartoe noodzakelijk, van die op grond van
      [artikel 7][ref3], of

      b. de [artikelen 21 tot en met 23c][ref4], voor zover dit noodzakelijk is voor het behoud van de leefbaarheid van
      de woonomgeving,

      ook gebruik maken indien daartoe geen noodzaak is vanuit het oogpunt van het bestrijden van onevenwichtige en
      onrechtvaardige effecten van schaarste aan woonruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel12
