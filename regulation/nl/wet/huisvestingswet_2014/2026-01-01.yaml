  - number: '9'
    text: |-
      1 Indien de gemeenteraad toepassing heeft gegeven aan [artikel 7][ref1] legt hij in de huisvestingsverordening de
      criteria vast voor de verlening van huisvestingsvergunningen.

      2 De criteria, bedoeld in het eerste lid:

      a. hebben geen betrekking op het stellen van eisen als bedoeld in
      [artikel 8, eerste lid, van de Wet bijzondere maatregelen grootstedelijke problematiek][ref2], behoudens in
      gebieden die daartoe zijn aangewezen op grond van [artikel 5 van die wet][ref3];

      b. hebben niet tot gevolg dat woningzoekenden met een huishoudinkomen onder een gestelde ondergrens geheel
      uitgesloten worden van toegang tot de woningvoorraad in de gemeente;

      c. hebben niet tot gevolg dat toegelaten instellingen die feitelijk werkzaam zijn in de gemeente belemmerd
      worden om bij de toewijzing van hun woongelegenheden uitvoering te geven aan het bepaalde bij of krachtens de
      [artikelen 46, tweede lid][ref4], en [48 van de Woningwet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0019388#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0019388#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel48
