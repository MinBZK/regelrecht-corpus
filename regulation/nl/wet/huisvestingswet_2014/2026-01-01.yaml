  - number: '15'
    text: |-
      1 Een huisvestingsvergunning wordt verleend indien de aanvrager behoort tot een krachtens
      [artikel 10, eerste lid][ref1], aangewezen categorie woningzoekenden en hij voldoet aan het bepaalde in artikel 10,
      tweede respectievelijk derde lid.

      2 Indien de woonruimte is aangewezen op grond van [artikel 11][ref2], [12, eerste lid][ref3], of
      [14, eerste, tweede of derde lid][ref4], kan de huisvestingsvergunning worden geweigerd indien een of meer andere
      woningzoekenden aan wie op grond van die artikelen voorrang kan worden gegeven in aanmerking wensen te komen voor
      die woonruimte.

      3 Indien de woonruimte is gelegen in een op grond van
      [artikel 5, tweede lid van de Wet bijzondere maatregelen grootstedelijke problematiek][ref5] aangewezen complex,
      straat of gebied, kan de huisvestingsvergunning worden geweigerd, indien een of meer woningzoekenden, aan wie op
      grond van [artikel 9 van die wet][ref6] voorrang wordt gegeven, in aanmerking wensen te komen voor die woonruimte.

      4 De vergunning wordt voor de woonruimte die gelegen is in een op grond van
      [artikel 5, eerste of derde lid, van de Wet bijzondere maatregelen grootstedelijke problematiek][ref7]
      aangewezen complex, straat of gebied, in afwijking van het eerste lid, geweigerd, indien
      de woningzoekende niet voldoet aan de voorwaarden, bedoeld in [artikel 8][ref8] of
      [artikel 10 van de Wet bijzondere maatregelen grootstedelijke problematiek][ref9].

      5 De vergunning kan, in afwijking van het eerste lid, worden geweigerd in het geval en onder de voorwaarden,
      bedoeld in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref10].

      6 Voordat toepassing wordt gegeven aan het eerste lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref11], om een advies als
      bedoeld in [artikel 9 van die wet][ref12] worden gevraagd.


