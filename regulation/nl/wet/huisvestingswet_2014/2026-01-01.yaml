  - number: '51'
    text: |-
      1 Indien de gemeenteraad toepassing heeft gegeven aan [artikel 23a][ref1], geldt voor aanbieders die hun woonruimte
      al voor de inwerkingtreding van het verbod aanboden voor toeristische verhuur het verbod, bedoeld in het eerste lid
      van dat artikel, en voor digitale platforms het verbod, bedoeld in het derde lid van dat artikel niet eerder dan
      zes maanden na de inwerkingtreding ervan.

      2 Indien in de huisvestingsverordening voor het tijdstip van inwerkingtreding van de wet van 7 oktober 2020 tot
      wijziging van de Huisvestingswet 2014 in verband met de aanpak van ongewenste neveneffecten van toeristische
      verhuur van woonruimte (Wet toeristische verhuur van woonruimte) regels zijn opgenomen over toeristische verhuur
      van woonruimte met toepassing van [artikel 21][ref2]:

      a. vervallen deze regels één jaar na het tijdstip, bedoeld in de aanhef;

      b. kan de gemeenteraad bepalen dat een vergunning voor toeristische verhuur verleend met toepassing van
      [artikel 21][ref3], voor het tijdstip van inwerkingtreding van de huisvestingsverordening waarin toeristische
      verhuur van woonruimte wordt geregeld op basis van [hoofdstuk 4, paragraaf 1a][ref4], wordt gelijkgesteld met een
      vergunning die is verleend met toepassing van [artikel 23c][ref5].

      3 Een vergunning als bedoeld in de [artikelen 25][ref6] en [26, eerste en tweede lid, van de Huisvestingswet][ref7],
      die is verleend voor het tijdstip van inwerkingtreding van een huisvestingsverordening, wordt gelijkgesteld met
      een huisvestingsvergunning.

      4 Een vergunning als bedoeld in de [artikelen 30, eerste lid][ref8], en [33, van de Huisvestingswet][ref9], die
      is verleend voor het tijdstip van inwerkingtreding van een huisvestingsverordening, wordt gelijkgesteld met een
      vergunning die is verleend met toepassing van [artikel 21][ref10] onderscheidenlijk [22][ref11].

      5 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties zendt uiterlijk vijf jaar na de datum van
      inwerkingtreding van [hoofdstuk 7][ref12] en vervolgens iedere vijf jaar een verslag over de noodzaak en de
      relevantie in de economische situatie van dat moment in de praktijk van de maatregelen in hoofdstuk 7 aan beide
      Kamers der Staten-Generaal.

      6 Indien uit het verslag, bedoeld in het vijfde lid, blijkt dat de noodzaak of de relevantie in de economische
      situatie van dat moment van de maatregelen onvoldoende kan worden aangetoond, vervalt [hoofdstuk 7][ref13] op een
      bij koninklijk besluit te bepalen tijdstip.

      7 De voordracht voor een krachtens het zesde lid vast te stellen koninklijk besluit wordt niet eerder gedaan dan
      twee maanden nadat het ontwerp aan beide Kamers van de Staten-Generaal is overgelegd.

      8 Indien toepassing wordt gegeven aan het zesde lid, vervalt de regeling in een huisvestingsverordening op basis
      van [hoofdstuk 7][ref14], twee jaar na het tijdstip bedoeld in het zesde lid.


