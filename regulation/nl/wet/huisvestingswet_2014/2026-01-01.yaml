      1 Voor zover de gemeenteraad toepassing heeft gegeven aan [artikel 23a, eerste lid][ref1],
      [artikel 23b, eerste of tweede lid][ref2], of [artikel 23c, eerste lid][ref3], informeert degene die een dienst
      verleent gericht op het publiceren van aanbiedingen voor toeristische verhuur van woonruimte, degene die een
      woonruimte aanbiedt voor toeristische verhuur over de verboden, bedoeld in artikel 23a, eerste lid, artikel 23b,
      eerste of tweede lid, of artikel 23c, eerste lid.

      2 Indien de gemeenteraad toepassing heeft gegeven aan [artikel 23a][ref4], [23b][ref5] of [23c][ref6], doen
