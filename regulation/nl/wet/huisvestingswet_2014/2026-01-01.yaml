  - number: '7'
    text: |-
      1 In de huisvestingsverordening kan de gemeenteraad categorieën woonruimte aanwijzen die niet voor bewoning in
      gebruik mogen worden genomen of gegeven indien daarvoor geen huisvestingsvergunning is verleend.

      2 Het eerste lid is ten aanzien van het kunnen aanwijzen van voor verkoop bestemde woonruimte alleen van toepassing
      op nieuw te bouwen voor verkoop bestemde woonruimte met een koopprijs van ten hoogste € 420.000,– nadat het bij
      koninklijke boodschap van 9 september 2022 ingediende voorstel van wet tot wijziging van de Huisvestingswet 2014
      naar aanleiding van de evaluatie van de herziene Huisvestingswet 2014 (Kamerstukken ) tot wet is verheven en in
      werking is getreden.

      3 Het tweede lid is ten aanzien van het kunnen aanwijzen van voor verkoop bestemde goedkope woonruimte niet van
      toepassing op de gemeenten Ameland, Schiermonnikoog, Terschelling, Texel en Vlieland.

      4 De koopprijs, genoemd in het tweede lid, wordt bij ministeriële regeling met ingang van elk kalenderjaar
      gewijzigd aan de hand van de consumentenprijsindex.
    url: https://wetten.overheid.nl/BWBR0035303/2026-01-01#Artikel7
  - number: '8'
    text: |-
      1 Het is verboden om woonruimte die is aangewezen krachtens [artikel 7][ref1] voor bewoning in gebruik te nemen
      zonder vergunning van burgemeester en wethouders.

      2 Het is verboden om woonruimte die is aangewezen krachtens [artikel 7][ref2] voor bewoning in gebruik te geven aan
      een persoon die niet beschikt over een huisvestingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel7
