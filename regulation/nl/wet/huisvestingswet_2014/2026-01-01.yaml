  - number: '21'
    text: |-
      1 Het is verboden om een woonruimte, behorend tot een met het oog op het behoud of de samenstelling van de
      woonruimtevoorraad door de gemeenteraad in de huisvestingsverordening aangewezen categorie woonruimte en
      die gelegen is in een in de huisvestingsverordening aangewezen gebied, zonder vergunning van burgemeester en
      wethouders:

      a. anders dan ten behoeve van de bewoning of het gebruik als kantoor of praktijkruimte door de eigenaar aan de
      bestemming tot bewoning te onttrekken of onttrokken te houden;

      b. anders dan ten behoeve van de bewoning of het gebruik als kantoor of praktijkruimte door de eigenaar met andere
      woonruimte samen te voegen of samengevoegd te houden;

      c. van zelfstandige in onzelfstandige woonruimte om te zetten of omgezet te houden;

      d. van onzelfstandige in zelfstandige woonruimte om te zetten of omgezet te houden;

      e. tot twee of meer zelfstandige woonruimten te verbouwen of in die verbouwde staat te houden.

      2 De gemeenteraad kan in de huisvestingsverordening gevallen aanwijzen waarvoor een vrijstelling geldt of waarin
      een ontheffing kan worden verleend van een verbod als bedoeld in het eerste lid. Aan een vrijstelling of ontheffing
      kunnen voorschriften en beperkingen worden verbonden.

      3 De gemeenteraad kan in de huisvestingsverordening bepalen dat een vergunning als bedoeld in het eerste lid,
      onderdeel a of c, slechts wordt afgegeven voor een in die huisvestingsverordening aangegeven termijn. Na afloop van
      de termijn vervalt de vergunning van rechtswege.
    url: https://wetten.overheid.nl/BWBR0035303/2026-01-01#Artikel21
  - number: '22'
    text: |-
      1 Het is verboden om een recht op een gebouw dat behoort tot een door de gemeenteraad in de huisvestingsverordening
      daartoe aangewezen categorie gebouwen zonder vergunning van burgemeester en wethouders te splitsen in
      appartementsrechten als bedoeld in [artikel 106, eerste en vierde lid, van Boek 5 van het Burgerlijk Wetboek][ref1]
      indien een of meer appartementsrechten de bevoegdheid omvatten tot het gebruik van een of meer gedeelten van het
      gebouw als woonruimte.

      2 De gemeenteraad kan in de huisvestingsverordening gevallen aanwijzen waarvoor een vrijstelling geldt of waarin
      een ontheffing kan worden verleend van het verbod, bedoeld in het eerste lid. Aan een vrijstelling of ontheffing
      kunnen voorschriften en beperkingen worden verbonden.

      3 Op het verlenen van deelnemings- of lidmaatschapsrechten of het aangaan van een verbintenis daartoe door een
      rechtspersoon is het eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel106
    url: https://wetten.overheid.nl/BWBR0035303/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '106'
  - number: '23'
    text: |-
      Een vergunning als bedoeld in [artikel 21][ref1] of [22][ref2] kan slechts worden aangevraagd door de eigenaar van
      de woonruimte respectievelijk het gebouw.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel22
