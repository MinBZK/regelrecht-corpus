  - number: '45'
    text: |-
      1 De gemeenteraad kan in de huisvestingsverordening bepalen dat een bestuurlijke boete kan worden opgelegd ter zake
      van de overtreding van het verbod, bedoeld in [artikel 41, eerste lid][ref1].

      2 De op te leggen bestuurlijke boete bedraagt ten hoogste:

      a. het bedrag dat is vastgesteld voor de vierde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2], voor overtreding van het verbod, bedoeld in
      [artikel 41, eerste lid][ref3], en

      b. het bedrag dat is vastgesteld voor de vijfde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref4], voor overtreding van een verbod als bedoeld in
      [artikel 41, eerste lid][ref5], indien binnen een tijdvak van vier jaar voorafgaand aan de constatering door een
      ambtenaar als bedoeld in [artikel 33, eerste lid][ref6], van die overtreding een bestuurlijke boete is opgelegd
      voor overtreding van hetzelfde verbod.

      3 De gemeenteraad stelt in de huisvestingsverordening het bedrag vast van de bestuurlijke boete die voor de
      overtreding kan worden opgelegd.


