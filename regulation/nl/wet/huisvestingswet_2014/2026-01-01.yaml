    text: |-
      1 In afwijking van de [artikelen 2:7, tweede lid][ref1], en [2:8 van de Algemene wet bestuursrecht][ref2] kan het
      registratienummer, bedoeld in [artikel 23a][ref3], uitsluitend via elektronische weg worden aangevraagd.

      2 Burgemeester en wethouders zijn verantwoordelijk voor de inrichting van het systeem ten behoeve van het afgeven
      van het registratienummer, bedoeld in [artikel 23a][ref4], en voor de verwerking van persoonsgegevens in dit
      systeem. Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de inrichting van
      dit registratiesysteem.

      3 De persoonsgegevens die verwerkt worden in het kader van de aanvraag van het registratienummer, bedoeld in
      [artikel 23a][ref5], kunnen ook verwerkt worden voor:

      a. het toezicht op de naleving van de krachtens [artikel 4.3 van de Omgevingswet][ref6] gegeven voorschriften
      vanuit het oogpunt van veiligheid, gezondheid en bruikbaarheid van de woonruimte, en

      b. de heffing en invordering van de toeristenbelasting, bedoeld in [artikel 224 van de Gemeentewet][ref7].


