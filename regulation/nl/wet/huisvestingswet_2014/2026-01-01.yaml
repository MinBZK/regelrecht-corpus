  - number: '25'
    text: |-
      1 De vergunning, bedoeld in [artikel 21][ref1], [artikel 22, eerste lid][ref2], of
      [artikel 23c, eerste lid][ref3], kan worden geweigerd in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref4].

      2 Voordat toepassing wordt gegeven aan het eerste lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref5], om een advies als
      bedoeld in [artikel 9 van die wet][ref6] worden gevraagd.

      3 Burgemeester en wethouders beslissen op de aanvraag om een vergunning als bedoeld in [artikel 21][ref7],
      [artikel 22, eerste lid][ref8], of [artikel 23c, eerste lid][ref9] binnen acht weken na de datum van ontvangst van
      de aanvraag.

      4 Burgemeester en wethouders kunnen de termijn, bedoeld in het derde lid, eenmaal verlengen met ten hoogste zes
      weken. Zij maken hun besluit daartoe bekend binnen de termijn, bedoeld in het derde lid.

      5 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref10] is van toepassing.


