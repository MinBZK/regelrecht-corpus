  - number: '41'
    text: |-
      1 Het is verboden om een bestaande woonruimte behorend tot een met het oog op de samenstelling van de
      woonruimtevoorraad door de gemeenteraad in de huisvestingsverordening aangewezen categorie van woonruimten, die
      gelegen is in een in die verordening aangewezen gebied zonder vergunning van burgemeester en wethouders, in gebruik
      te geven binnen een periode van vier jaar na de datum van inschrijving in de openbare registers van de akte van
      levering van die bestaande woonruimte aan de nieuwe eigenaar.

      2 De gemeenteraad kan in de huisvestingsverordening slechts categorieën van woonruimten als bedoeld in het eerste
      lid, aanwijzen voor zover:

      a. dit goedkope en middeldure koopwoningen zijn;

      b. de woonruimte op de datum van inschrijving in de openbare registers van de akte van levering aan de nieuwe
      eigenaar:

      1°. vrij van huur en gebruik was;

      2°. in verhuurde of gebruikte staat was voor een periode van minder dan 6 maanden, of

      3°. werd verhuurd met een vergunning als bedoeld in het eerste lid.

      c. de datum van inschrijving in de openbare registers van de akte van levering van die woonruimte aan de nieuwe
      eigenaar ligt na het tijdstip van inwerkingtreding van het verbod, bedoeld in het eerste lid.

      3 De gemeenteraad bepaalt in de huisvestingverordening voor welke vormen van het in gebruik geven van een in die
      verordening aangewezen woonruimte een vergunning als bedoeld in het eerste lid, wordt verleend. Een vergunning als
      bedoeld in het eerste lid, wordt in ieder geval verleend indien:

      a. de woonruimte in gebruik wordt gegeven aan een woningzoekende die een bloed- of aanverwantschap in de eerste of
      tweede graad heeft met de eigenaar;

      b. de eigenaar na de datum van inschrijving in de openbare registers van de akte van
      levering van die woonruimte aan hem, ten minste 12 maanden zijn woonadres als bedoeld in
      [artikel 1.1, onderdeel o, onder 1°, van de Wet basisregistratie personen][ref1], in die woonruimte heeft en de
      eigenaar met een woningzoekende schriftelijk overeenkomt dat de woningzoekende de woonruimte voor een termijn van
      ten hoogste 12 maanden, anders dan voor toeristische verhuur, in gebruik neemt, of

      c. de woonruimte onlosmakelijk deel uitmaakt van een winkel-, kantoor- of bedrijfsruimte.

      4 Een vergunning als bedoeld in het eerste lid geldt uitsluitend voor die vorm van het in gebruik geven die de
      gemeenteraad op grond van het derde lid heeft aangewezen in de huisvestingsverordening en waarvoor de vergunning
      is verleend.

      5 De gemeenteraad kan in de huisvestingsverordening aan burgemeester en wethouders de bevoegdheid geven om
      ontheffing van dat verbod te verlenen. Aan een ontheffing kunnen voorschriften en beperkingen worden verbonden.

      6 De gemeenteraad stelt in de huisvestingsverordening regels over de wijze van aanvragen van een vergunning
      als bedoeld in het eerste lid, en de gegevens die door de aanvrager worden verstrekt bij de aanvraag van die
      vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1.1
