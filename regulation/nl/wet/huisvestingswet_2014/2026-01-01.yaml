  - number: '26'
    text: |-
      1 Burgemeester en wethouders kunnen een vergunning als bedoeld in [artikel 21][ref1],
      [artikel 22, eerste lid][ref2], of [artikel 23c, eerste lid][ref3] intrekken indien:

      a. de houder van die vergunning niet binnen een jaar nadat die vergunning onherroepelijk is geworden is overgegaan
      tot:

      1°. onttrekking als bedoeld in [artikel 21, onderdeel a][ref4];

      2°. samenvoeging als bedoeld in [artikel 21, onderdeel b][ref5];

      3°. omzetting als bedoeld in [artikel 21, onderdeel c][ref6];

      4°. verbouwing als bedoeld in [artikel 21, onderdeel d][ref7];

      5°. onderscheidenlijk tot inschrijving in de openbare registers van de akte van splitsing in appartementsrechten,
      bedoeld in [artikel 109 van Boek 5 van het Burgerlijk Wetboek][ref8], of tot het verlenen van deelnemings- of
      lidmaatschapsrechten, of

      6°. toeristische verhuring als bedoeld in [artikel 23c, eerste lid][ref9];

      b. die vergunning is verleend op grond van door de houder van die vergunning verstrekte gegevens waarvan deze wist
      of redelijkerwijs moest vermoeden dat zij onjuist of onvolledig waren, of

      c. de voorwaarden of voorschriften, bedoeld in [artikel 24][ref10], niet worden nageleefd.

      2 De vergunning, bedoeld in [artikel 21][ref11], [artikel 22, eerste lid][ref12], of
      [artikel 23c, eerste lid][ref13], kan voorts worden ingetrokken in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref14].

      3 Voordat toepassing wordt gegeven aan het tweede lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref15], om een advies als
      bedoeld in [artikel 9 van die wet][ref16] worden gevraagd.


