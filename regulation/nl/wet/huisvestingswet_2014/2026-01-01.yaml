    text: |-
      Indien de gemeenteraad toepassing heeft gegeven aan [artikel 23b, eerste en tweede lid][ref1], kan hij in
      die huisvestingsverordening tevens verbieden dat degene die een dienst verleent gericht op het publiceren van
      aanbiedingen voor toeristische verhuur van woonruimte een aanbieding voor toeristische verhuur toont gedurende
      de rest van het jaar, indien diegene door burgemeester en wethouders ervan in kennis is gesteld dat de woonruimte
      die wordt aangeboden reeds voor het in de huisvestingsverordening bepaald aantal nachten in dat jaar in gebruik is
      gegeven voor toeristische verhuur.


