        hoofdstuk: '2'
        paragraaf: '2'
  - number: '14'
    text: |-
      1 In de huisvestingsverordening kan de gemeenteraad bepalen dat bij de verlening van huisvestingsvergunningen
      voorrang wordt gegeven aan woningzoekenden die economisch of maatschappelijk gebonden zijn aan de
      woningmarktregio, de gemeente of een tot de gemeente behorende kern voor een of meer daarbij aangewezen
      categorieën woonruimte voor zover de gemeente als gevolg van regels gesteld bij of krachtens een algemene
      maatregel van bestuur als bedoeld in [artikel 2.24 van de Omgevingswet][ref1] of bij een omgevingsverordening
      als bedoeld in [artikel 2.22 van de Omgevingswet][ref2] geringe of geen mogelijkheden heeft tot uitbreiding van
      de woonruimtevoorraad.

      2 In de huisvestingsverordening kan de gemeenteraad voor zover het een andere gemeente dan die, bedoeld in eerste
      lid, betreft, bepalen dat bij de verlening van huisvestingsvergunningen voor ten hoogste 50 procent van een of
      meer daarbij aangewezen categorieën woonruimte, voorrang wordt gegeven aan woningzoekenden die economisch of
      maatschappelijk gebonden zijn aan de woningmarktregio, de gemeente of een deel van de gemeente.

      3 De gemeenteraad kan in de huisvestingsverordening bepalen dat binnen de groep van woningzoekenden die economisch
      of maatschappelijk gebonden zijn aan de gemeente voorrang wordt gegeven aan in de huisvestingsverordening
      aangewezen vitale beroepsgroepen. De gemeenteraad kan in de huisvestingsverordening bepalen dat een aantal van de
      aangewezen categorieën woonruimte met voorrang kan worden toegewezen aan de vitale beroepsgroepen.

      4 Voor de toepassing van het eerste en tweede lid is een woningzoekende:

      a. economisch gebonden aan de woningmarktregio, de gemeente of een deel van de gemeente indien hij met het oog op
      de voorziening in het bestaan een redelijk belang heeft zich in die woningmarktregio, die gemeente of dat deel van
      de gemeente te vestigen, en

      b. maatschappelijk gebonden aan de woningmarktregio, de gemeente of een deel van de gemeente indien hij:

      1°. een redelijk, met de plaatselijke samenleving verband houdend belang heeft zich in die woningmarktregio, die
      gemeente of dat deel van de gemeente te vestigen, of

      2°. ten minste zes jaar onafgebroken ingezetene is dan wel gedurende de voorafgaande tien jaar ten minste zes jaar
      onafgebroken ingezetene is geweest van die woningmarktregio, die gemeente of dat deel van de gemeente.

      5 Indien bij het verlenen van huisvestingsvergunningen aan woningzoekenden als bedoeld in [artikel 12][ref3],
      tevens voorrang wordt verleend omdat zij economische of maatschappelijke binding als bedoeld in het tweede lid
      hebben, worden deze huisvestingvergunningen meegeteld bij de percentages, bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2.24
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2.22
      [ref3]: https://wetten.overheid.nl/BWBR0035303#Artikel12
