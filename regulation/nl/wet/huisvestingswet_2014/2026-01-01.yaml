  - number: '28'
    text: |-
      Burgemeester en wethouders dragen zorg voor de voorziening in de huisvesting van vergunninghouders in de gemeente
      overeenkomstig de voor de gemeente geldende taakstelling.
    url: https://wetten.overheid.nl/BWBR0035303/2026-01-01#Artikel28
  - number: '29'
    text: |-
      1 De taakstelling, bedoeld in [artikel 28][ref1], is de uitkomst, naar boven afgerond op een geheel getal, van
      de formule:

      in welke formule voorstelt:

        - *vg:* het door Onze Minister van Justitie en Veiligheid in de Staatscourant bekendgemaakte totale aantal
      vergunninghouders in wier huisvesting in het daarbij aangegeven kalenderhalfjaar naar verwachting voorzien zal
      moeten worden, welke bekendmaking ten minste dertien weken voor de aanvang van het kalenderhalfjaar geschiedt;
        - *iG:* het aantal inwoners van de gemeente volgens de door het Centraal bureau voor de statistiek
      gepubliceerde bevolkingscijfers op 1 januari van het kalenderjaar dat voorafgaat aan het kalenderjaar waartoe
      het kalenderhalfjaar, bedoeld in onderdeel a, behoort onderscheidenlijk het op grond van [artikel 30][ref2]
      vastgestelde aantal inwoners;
        - *iN:* het aantal inwoners van Nederland volgens de door het Centraal bureau voor de statistiek gepubliceerde
      bevolkingscijfers op 1 januari van het kalenderjaar dat voorafgaat aan het kalenderjaar waartoe het
      kalenderhalfjaar, bedoeld in onderdeel a, behoort.

      2 Burgemeester en wethouders van twee of meer gemeenten kunnen gezamenlijk besluiten de taakstelling die voor hun
      onderscheidenlijke gemeenten volgt uit de formule, genoemd in het eerste lid, te wijzigen, met dien verstande dat
      de som van de aantallen vergunninghouders in wier huisvesting na die wijziging in de betrokken gemeenten tezamen
      dient te worden voorzien niet wijzigt.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel30
    url: https://wetten.overheid.nl/BWBR0035303/2026-01-01#Artikel29
    references:
      - id: ref1
