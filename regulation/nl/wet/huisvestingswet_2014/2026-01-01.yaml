preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels te stellen met betrekking tot de
    verdeling van woonruimte en de samenstelling van de woonruimtevoorraad;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0035303/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *digitaal platform:* degene die een dienst van de informatiemaatschappij verleent gericht op het publiceren van
      aanbiedingen voor toeristische verhuur;
        - *huishoudinkomen:* gezamenlijke verzamelinkomens als bedoeld in
      [artikel 2.3 van de Wet op de inkomstenbelasting 2001][ref1] van de aanvragers van een huisvestingsvergunning
      voor een bij huisvestingsverordening aangewezen woonruimte, met uitzondering van kinderen in de zin van
      [artikel 4 van de Algemene wet inkomensafhankelijke regelingen][ref2], met dien verstande dat in het eerste lid van
      dat artikel voor «belanghebbende» telkens wordt gelezen «aanvrager»;
        - *huisvestingsvergunning:* vergunning als bedoeld in [artikel 8, eerste lid][ref3];
        - *huisvestingsverordening:* verordening als bedoeld in [artikel 4][ref4];
        - *middeldure huurwoonruimte:* zelfstandige woning als bedoeld in
      [artikel 234 van Boek 7 van het Burgerlijk Wetboek][ref5]: 1°. met een krachtens
      [artikel 10, eerste lid, van de Uitvoeringswet huurprijzen woonruimte][ref6] bepaalde waardering
      van de kwaliteit die leidt tot een maximale huurprijs die hoger is dan het bedrag, bedoeld in
      [artikel 13, eerste lid, onder a, van de Wet op de huurtoeslag][ref7], en niet hoger is dan het bij of krachtens
      [artikel 3, tweede lid, van de Uitvoeringswet huurprijzen woonruimte][ref8] vastgestelde bedrag, of; 2°. waarvoor
      bij aanvang van de huurovereenkomst een huurprijs is overeengekomen die hoger is dan het bedrag, bedoeld in
      [artikel 13, eerste lid, onder a, van de Wet op de huurtoeslag][ref9], en lager dan of gelijk is aan het bij of
      krachtens [artikel 3, tweede lid, van de Uitvoeringswet huurprijzen woonruimte][ref10] vastgestelde bedrag;
        - *Onze Minister:* Onze Minister van Volkshuisvesting en Ruimtelijke Ordening;
        - *standplaats:* kavel, bestemd voor het plaatsen van een woonwagen, waarop voorzieningen aanwezig zijn die op het
      leidingnet van de openbare nutsbedrijven, andere instellingen of van gemeenten kunnen worden aangesloten;
        - *taakstelling:* aantal in opvangcentra of op gemeentelijke opvangplaatsen verkerende vergunninghouders in wier
      huisvesting per gemeente per kalenderhalfjaar dient te worden voorzien;
        - *toegelaten instelling:* instelling als bedoeld in [artikel 19 van de Woningwet][ref11];
        - *toeristische verhuur:* in een woonruimte tegen betaling bieden van verblijf aan personen die niet als ingezetene
      zijn ingeschreven met een adres in de gemeente in de basisregistratie personen;
        - *vergunninghouder:* vreemdeling die in Nederland een verblijfsvergunning asiel voor bepaalde
      tijd heeft aangevraagd en als gevolg daarvan een verblijfsvergunning heeft ontvangen als bedoeld in
      [artikel 8, onderdeel a, b, c, of d, van de Vreemdelingenwet 2000][ref12];
        - *woningmarktregio:* gebied dat vanuit het oogpunt van het functioneren van de woningmarkt als een geheel kan
      worden beschouwd;
        - *woonruimte:* 1° besloten ruimte die, al dan niet tezamen met een of meer andere ruimten, bestemd of geschikt is
      voor bewoning door een huishouden, en 2° standplaats;
        - *woonvisie:* woonvisie als bedoeld in [artikel 42, eerste lid, van de Woningwet][ref13].

      2 Indien de gemeenteraad bij de aanwijzing van categorieën woonruimte op grond van [artikel 7][ref14] gebruik maakt
      van huurprijsgrenzen of koopprijsgrenzen wordt verstaan onder:

        - *huurprijs:* prijs die bij huur en verhuur is verschuldigd voor het enkele gebruik van een woonruimte, uitgedrukt
      in een bedrag per maand;
        - *koopprijs:* prijs die voor de enkele koop van een woonruimte daadwerkelijk is of zal worden betaald.

      3 Voor de toepassing van het bij of krachtens [Hoofdstuk 2][ref15] en [paragraaf 1a van Hoofdstuk 4][ref16] van
      deze wet bepaalde wordt onder woonruimte als bedoeld in het eerste lid, onderdeel l, onder 1° zowel zelfstandige
      woonruimte als bedoeld in [artikel 234 van Boek 7 van het Burgerlijk Wetboek][ref17], als onzelfstandige woonruimte
      verstaan.


