    text: |-
      De gemeenteraad stelt in de huisvestingsverordening regels omtrent de gronden die tot weigering van een vergunning
      als bedoeld in [artikel 21][ref1], [artikel 22, eerste lid][ref2], of [artikel 23c, eerste lid][ref3] kunnen leiden
      en de voorwaarden en voorschriften die burgemeester en wethouders kunnen verbinden aan een vergunning als bedoeld
      in die artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel21
