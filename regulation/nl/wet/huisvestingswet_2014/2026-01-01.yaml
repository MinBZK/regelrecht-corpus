  - number: '6'
    text: |-
      1 Bij de voorbereiding van de vaststelling of wijziging van een huisvestingsverordening plegen burgemeester en
      wethouders overleg met de in de gemeente werkzame toegelaten instellingen, met woonconsumentenorganisaties en met
      andere daarvoor naar hun oordeel in aanmerking komende organisaties.

      2 Bij de voorbereiding van de vaststelling of wijziging van een huisvestingsverordening stemmen burgemeester
      en wethouders deze af met burgemeester en wethouders van de overige gemeenten die deel uitmaken van de
      woningmarktregio waarin de gemeente is gelegen.

      3 Bij de voorbereiding van de vaststelling of wijziging van een huisvestingsverordening vragen burgemeester en
      wethouders advies aan gedeputeerde staten van de provincie waarin de gemeente is gelegen over de gevolgen voor
      de regionale woningmarkt, de woningbouwopgave en de toepassing van [artikel 14][ref1]. Gedeputeerde staten doen
      binnen zes weken na ontvangst van het verzoek hun advies toekomen aan burgemeester en wethouders. Burgemeester en
      wethouders kunnen gemotiveerd afwijken van het advies.

      4 Indien de gemeenteraad voornemens is een huisvestingsverordening vast te stellen vanuit het oogpunt van:

      a. het bestrijden van onevenwichtige en onrechtvaardige effecten van schaarste aan woonruimte, onderbouwt de
      gemeenteraad in de woonvisie de maatregelen die zij neemt om deze schaarste tegen te gaan, de inzet van de gemeente
      op het gebied van de regionale woningbouwopgave en het al dan niet aanwijzen van middeldure huurwoonruimten als
      bedoeld in [artikel 1][ref2] als categorie van woonruimte die niet voor bewoning in gebruik mogen worden genomen
      of gegeven anders dan aan woningzoekenden met een middeninkomen als bedoeld in [artikel 10, vierde lid][ref3];

      b. het behoud van de leefbaarheid van de woonomgeving, onderbouwt de gemeenteraad in de woonvisie hoe de inzet van
      dit instrument bijdraagt aan het behoud van de leefbaarheid.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0035303#Artikel10
