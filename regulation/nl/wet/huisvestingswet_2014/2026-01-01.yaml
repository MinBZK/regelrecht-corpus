  - number: '10'
    text: |-
      1 De gemeenteraad wijst indien hij toepassing heeft gegeven aan [artikel 7][ref1] in de huisvestingsverordening de
      categorieën woningzoekenden aan die voor het verkrijgen van een huisvestingsvergunning in aanmerking komen.

      2 Voor een huisvestingsvergunning komen slechts in aanmerking woningzoekenden die:

      a. de Nederlandse nationaliteit bezitten of op grond van een wettelijke bepaling als Nederlander worden behandeld;

      b. vreemdeling zijn en rechtmatig verblijf in Nederland hebben als bedoeld in
      [artikel 8, onderdelen a tot en met e en l, van de Vreemdelingenwet 2000][ref2], of

      c. vreemdeling zijn en rechtmatig verblijf hebben in Nederland als bedoeld in
      [artikel 8, onderdelen g en h, van de Vreemdelingenwet 2000][ref3] en in afwachting zijn van een verlenging van de
      geldigheidsduur van de verblijfsvergunning als bedoeld in de [artikelen 14][ref4] of [28][ref5] van die wet.

      3 Indien de gemeenteraad op grond van [artikel 7, eerste lid][ref6], middeldure huurwoonruimte als categorie heeft
      aangewezen, bepaalt hij dat met betrekking tot de categorie middeldure huurwoonruimte slechts woningzoekenden met
      een middeninkomen in aanmerking komen voor het verkrijgen van een huisvestingsvergunning.

      4 Als woningzoekende met een middeninkomen wordt aangemerkt een eenpersoonshuishouden met een huishoudinkomen dat
      niet hoger is dan € 70.149 en een meerpersoonshuishouden met een huishoudinkomen dat niet hoger is dan € 93.531. De
      gemeenteraad kan in de huisvestingsverordening de in de eerste zin genoemde bedragen hoger vaststellen.

      5 Bij ministeriële regeling worden de bedragen, genoemd in het vierde lid, met ingang van 1 januari
      van elk jaar gewijzigd met de procentuele wijziging per 1 januari van het peiljaar, bedoeld in
      [artikel 252a, tweede lid, onderdeel f, van Boek 7 van het Burgerlijk Wetboek][ref7], van het bedrag, genoemd in
      [artikel 17, eerste lid, onderdeel b, van de Wet op de huurtoeslag][ref8].


