  - number: '11'
    text: |-
      In de huisvestingsverordening kan de gemeenteraad bepalen dat voor een of meer daarbij aangewezen
      categorieën woonruimte in verband met de aard, grootte of prijs van die woonruimte bij het verlenen van
      huisvestingsvergunningen voorrang wordt gegeven aan een daarbij aangewezen gedeelte van de overeenkomstig
      [artikel 10, eerste lid][ref1], aangewezen categorieën woningzoekenden.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel10
    url: https://wetten.overheid.nl/BWBR0035303/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11a
    text: |-
      In de huisvestingsverordening bepaalt de gemeenteraad dat indien een jongere als bedoeld in
      [artikel 7:274c, tweede lid, van het Burgerlijk Wetboek][ref1] een huurovereenkomst op grond van dat artikel is
      aangegaan, de inschrijving van die jongere om in aanmerking te komen voor een woonruimte niet vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel274c
    url: https://wetten.overheid.nl/BWBR0035303/2026-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 274c
  - number: 11b
    text: |-
      In de huisvestingsverordening bepaalt de gemeenteraad dat indien een huurder een huurovereenkomst voor bepaalde
      tijd als bedoeld in [artikel 7:271, eerste lid, tweede volzin, van het Burgerlijk Wetboek][ref1] is aangegaan, de
      inschrijving van die huurder om in aanmerking te komen voor een woonruimte niet vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel271
    url: https://wetten.overheid.nl/BWBR0035303/2026-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '271'
  - number: 11c
    text: |-
      In de huisvestingsverordening bepaalt de gemeenteraad dat indien een huurder een huurovereenkomst is aangegaan
      voor een zelfstandige woning als bedoeld in [artikel 234 van Boek 7 van het Burgerlijk Wetboek][ref1] in een gebouw
      waarvoor een omgevingsvergunning als bedoeld in [artikel 5.36, tweede lid, van de Omgevingswet][ref2] is verleend
      met een termijn van maximaal vijftien jaren, de inschrijving van die huurder om in aanmerking te komen voor een
      woonruimte niet vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel234
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5.36
