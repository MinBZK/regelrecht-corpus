  - number: '17'
    text: |-
      1 [Artikel 15, tweede lid][ref1], is met betrekking tot een op grond van
      [artikel 14, eerste, tweede of derde lid][ref2], aangewezen woonruimte voorts niet van toepassing indien de
      eigenaar van de woonruimte gedurende een door de gemeenteraad in de huisvestingsverordening vastgestelde termijn
      die woonruimte vruchteloos heeft aangeboden aan woningzoekenden als bedoeld in dat lid, en:

      a. ingeval de woonruimte te huur wordt aangeboden en
      [onderafdeling 2 van afdeling 5 van titel 4 van Boek 7 van het Burgerlijk Wetboek][ref3] op die woonruimte van
      toepassing is, de gevraagde huurprijs niet hoger is dan de voor die woonruimte ingevolge die onderafdeling geldende
      maximale huurprijsgrens;

      b. ingeval de woonruimte te huur wordt aangeboden en de in onderdeel a genoemde onderafdeling op die woonruimte
      niet van toepassing is, de gevraagde huurprijs niet hoger is dan redelijk is, gelet op de huurprijs die in het
      economisch verkeer voor vergelijkbare woonruimten wordt overeengekomen, en

      c. ingeval de woonruimte te koop wordt aangeboden, de koopprijs niet hoger is dan de waarde, bedoeld in
      [artikel 17, eerste lid, van de Wet waardering onroerende zaken][ref4].

      2 In afwijking van [artikel 15, eerste lid][ref5], kan een huisvestingsvergunning voor een middeldure
      huurwoonruimte worden verleend aan een woningzoekende met een inkomen hoger dan het voor die woningzoekende in
      [artikel 10, vierde lid][ref6], genoemde toepasselijke bedrag, indien de eigenaar van die woonruimte gedurende een
      door de gemeenteraad in de huisvestingsverordening vastgestelde termijn, die woonruimte vruchteloos te huur heeft
      aangeboden aan woningzoekenden als bedoeld in artikel 10, vierde lid, en de gevraagde huurprijs niet hoger is dan
      de voor die woonruimte krachtens [artikel 10 van de Uitvoeringswet huurprijzen woonruimte][ref7] geldende maximale
      huurprijsgrens.

      3 De gemeenteraad stelt in de huisvestingsverordening een termijn als bedoeld in het eerste of tweede lid van ten
      hoogste dertien weken en stelt regels met betrekking tot de wijze waarop de aanbieding, bedoeld in het eerste of
      tweede lid, dient plaats te vinden. De gemeenteraad kan daarbij regels stellen omtrent de wijze waarop ten genoegen
      van burgemeester en wethouders moet worden aangetoond dat de aanbieding in overeenstemming met het bij en krachtens
      deze wet bepaalde heeft plaatsgevonden, alsmede met betrekking tot de wijze waarop aan burgemeester en wethouders
      verslag moet worden uitgebracht over het verloop van de aanbiedingsprocedure.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005290#ParagraafOnderafdeling_2
