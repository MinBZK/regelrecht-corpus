        hoofdstuk: '7'
        paragraaf: '3'
  - number: '43'
    text: |-
      1 De vergunning, bedoeld in [artikel 41, eerste lid][ref1], kan worden geweigerd in het geval en onder de
      voorwaarden, bedoeld in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref2].

      2 Voordat toepassing wordt gegeven aan het eerste lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref3], om een advies als
      bedoeld in [artikel 9 van die wet][ref4] worden gevraagd.

      3 Burgemeester en wethouders beslissen op de aanvraag om een vergunning als bedoeld in
      [artikel 41, eerste lid][ref5], binnen acht weken na de datum van ontvangst van de aanvraag.

      4 Burgemeester en wethouders kunnen de termijn, bedoeld in het derde lid, eenmaal verlengen met ten hoogste zes
      weken. Zij maken hun besluit daartoe bekend binnen de termijn, bedoeld in het derde lid.

      5 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref6] is van toepassing.


