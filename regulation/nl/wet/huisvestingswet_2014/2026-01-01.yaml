  - number: '40'
    text: |-
      1 In afwijking van het bepaalde in [artikel 2][ref1] maakt de gemeenteraad van zijn bevoegdheden op grond van
      dit hoofdstuk slechts gebruik indien zij dat noodzakelijk en geschikt acht voor het bestrijden van schaarste aan
      goedkope en middeldure koopwoningen of voor het behoud van de leefbaarheid van de woonomgeving.

      2 Aanvullend op het bepaalde in [artikel 4][ref2] kan de gemeenteraad op grond van dit hoofdstuk in de
      huisvestingsverordening regels stellen omtrent het in gebruik geven van in die verordening aangewezen goedkope en
      middeldure koopwoningen.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel4
    url: https://wetten.overheid.nl/BWBR0035303/2026-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '2'
