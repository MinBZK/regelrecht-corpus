  - number: '18'
    text: |-
      1 Burgemeester en wethouders kunnen een huisvestingsvergunning intrekken indien:

      a. de houder van de vergunning de in die vergunning vermelde woonruimte niet binnen de door burgemeester en
      wethouders bij de verlening gestelde termijn in gebruik heeft genomen, of

      b. die vergunning is verleend op grond van door de houder van de vergunning verstrekte gegevens waarvan deze wist
      of redelijkerwijs moest vermoeden dat zij onjuist of onvolledig waren.

      2 Burgemeester en wethouders kunnen een huisvestingsvergunning voorts intrekken in het geval en onder de voorwaarden,
      bedoeld in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].

      3 Voordat toepassing wordt gegeven aan het tweede lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref2], om een advies als
      bedoeld in [artikel 9 van die wet][ref3] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel8
