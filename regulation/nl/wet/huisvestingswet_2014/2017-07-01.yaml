  - number: '10'
    text: |-
      1 De gemeenteraad wijst indien hij toepassing heeft gegeven aan [artikel 7][ref1] in de huisvestingsverordening de
      categorieën woningzoekenden aan die voor het verkrijgen van een huisvestingsvergunning in aanmerking komen.

      2 Voor een huisvestingsvergunning komen slechts in aanmerking woningzoekenden die:

      a. de Nederlandse nationaliteit bezitten of op grond van een wettelijke bepaling als Nederlander worden behandeld,
      of

      b. vreemdeling zijn en rechtmatig verblijf in Nederland hebben als bedoeld in
      [artikel 8, onderdelen a tot en met e en l, van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0035303/2017-07-01#Artikel10
