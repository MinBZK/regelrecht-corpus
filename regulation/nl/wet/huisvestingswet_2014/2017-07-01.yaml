  - number: '51'
    text: |-
      1 De [Huisvestingswet][ref1] wordt ingetrokken.

      2 Een verordening die berust op de [Huisvestingswet][ref2] vervalt zes maanden na het tijdstip van inwerkingtreding
      van deze wet.

      3 Het tweede lid is niet van toepassing op de huisvestingsverordeningen, bedoeld
      in [artikel 2, derde lid, van de Huisvestingswet][ref3]. Op deze verordeningen is
      [artikel XXIII van de Wet afschaffing plusregio’s][ref4] van toepassing.

      4 Een vergunning als bedoeld in de [artikelen 25][ref5] en [26, eerste en tweede lid, van de Huisvestingswet][ref6],
      die is verleend voor het tijdstip van inwerkingtreding van een huisvestingsverordening, wordt gelijkgesteld met
      een huisvestingsvergunning.

      5 Een vergunning als bedoeld in de [artikelen 30, eerste lid][ref7], en [33, van de Huisvestingswet][ref8], die
      is verleend voor het tijdstip van inwerkingtreding van een huisvestingsverordening, wordt gelijkgesteld met een
      vergunning die is verleend met toepassing van [artikel 21][ref9] onderscheidenlijk [22][ref10].

      6 Aanvragen om een vergunning die zijn ingediend voor het tijdstip van inwerkingtreding van een
      huisvestingsverordening, worden behandeld volgens het voor het tijdstip van inwerkingtreding van deze wet geldende
      recht.


