  - number: '31'
    text: |-
      1 Bij ministeriële regeling kunnen categorieën van woningzoekenden worden aangewezen, wier huisvesting bijzondere
      zorg van rijkswege behoeft.

      2 Onze Minister kan burgemeester en wethouders een aanwijzing geven met betrekking tot de voorziening in de
      huisvesting van een of meer personen die behoren tot een krachtens het eerste lid aangewezen categorie indien dat
      met het oog op de huisvesting van die persoon of personen noodzakelijk is. Alvorens een aanwijzing te geven pleegt
      Onze Minister overleg met burgemeester en wethouders.

      3 Burgemeester en wethouders zijn verplicht aan een aanwijzing gevolg te geven.

      4 Onze Minister stelt een regeling als bedoeld in het eerste lid slechts vast indien omstandigheden van bijzondere
      aard naar zijn oordeel daartoe aanleiding geven. De regeling geldt voor een daarbij aangegeven periode van ten
      hoogste twee jaar.
    url: https://wetten.overheid.nl/BWBR0035303/2017-07-01#Artikel31
  - number: '32'
    text: |-
      Burgemeester en wethouders dragen zorg voor de bestuursrechtelijke handhaving van het bij of krachtens deze wet
      bepaalde.
    url: https://wetten.overheid.nl/BWBR0035303/2017-07-01#Artikel32
  - number: '33'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de bij besluit van
      burgemeester en wethouders aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0035303/2017-07-01#Artikel33
  - number: '34'
    text: |-
      De toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, een woning binnen te treden zonder
      toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0035303/2017-07-01#Artikel34
  - number: '35'
    text: |-
      1 De gemeenteraad kan in de huisvestingsverordening bepalen dat een bestuurlijke boete kan worden opgelegd ter zake
      van de overtreding van de verboden bedoeld in de [artikelen 8][ref1], [21][ref2] of [22][ref3], of van het handelen
      in strijd met de voorwaarden of voorschriften, bedoeld in [artikel 26][ref4]. Burgemeester en wethouders zijn
      bevoegd tot het opleggen van een bestuurlijke boete.

      2 De op te leggen bestuurlijke boete bedraagt ten hoogste:

      a. het bedrag dat is vastgesteld voor de eerste categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref5], voor overtreding van het verbod, bedoeld in
      [artikel 8, eerste lid][ref6], en

      b. het bedrag dat is vastgesteld voor de vierde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref7], voor overtreding van de verboden, bedoeld in de
      [artikelen 8, tweede lid][ref8], [21][ref9] of [22][ref10], of voor het handelen in strijd met de voorwaarden of
      voorschriften, bedoeld in [artikel 26][ref11].

      3 De gemeenteraad stelt in de huisvestingsverordening het bedrag vast van de bestuurlijke boete die voor de
      verschillende overtredingen kan worden opgelegd.


