  - number: '6'
    text: |-
      1 Bij de voorbereiding van de vaststelling of wijziging van een huisvestingsverordening plegen burgemeester en
      wethouders overleg met de in de gemeente werkzame toegelaten instellingen, met woonconsumentenorganisaties en met
      andere daarvoor naar hun oordeel in aanmerking komende organisaties.

      2 Bij de voorbereiding van de vaststelling of wijziging van een huisvestingsverordening stemmen burgemeester
      en wethouders deze af met burgemeester en wethouders van de overige gemeenten die deel uitmaken van de
      woningmarktregio waarin de gemeente is gelegen.
    url: https://wetten.overheid.nl/BWBR0035303/2017-07-01#Artikel6
  - number: '7'
    text: |-
      1 In de huisvestingsverordening kan de gemeenteraad categorieën goedkope woonruimte aanwijzen die niet voor
      bewoning in gebruik mogen worden genomen of gegeven indien daarvoor geen huisvestingsvergunning is verleend.

      2 Het eerste lid is ten aanzien van het kunnen aanwijzen van voor verkoop bestemde goedkope woonruimte slechts van
      toepassing op de gemeenten Ameland, Schiermonnikoog, Terschelling, Texel en Vlieland.
    url: https://wetten.overheid.nl/BWBR0035303/2017-07-01#Artikel7
  - number: '8'
    text: |-
      1 Het is verboden om woonruimte die is aangewezen krachtens [artikel 7][ref1] voor bewoning in gebruik te nemen
      zonder vergunning van burgemeester en wethouders.

      2 Het is verboden om woonruimte die is aangewezen krachtens [artikel 7][ref2] voor bewoning in gebruik te geven aan
      een persoon die niet beschikt over een huisvestingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel7
