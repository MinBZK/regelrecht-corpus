  - number: '26'
    text: |-
      1 Burgemeester en wethouders kunnen een vergunning als bedoeld in [artikel 21][ref1] of [22][ref2] intrekken
      indien:

      a. de houder van die vergunning niet binnen een jaar nadat die vergunning onherroepelijk is geworden is overgegaan
      tot onttrekking, samenvoeging of omzetting, onderscheidenlijk tot inschrijving in de openbare registers van de akte
      van splitsing in appartementsrechten, bedoeld in [artikel 109 van Boek 5 van het Burgerlijk Wetboek][ref3], of tot
      het verlenen van deelnemings- of lidmaatschapsrechten;

      b. die vergunning is verleend op grond van door de houder van die vergunning verstrekte gegevens waarvan deze wist
      of redelijkerwijs moest vermoeden dat zij onjuist of onvolledig waren, of

      c. de voorwaarden of voorschriften, bedoeld in [artikel 24][ref4], niet worden nageleefd.

      2 De vergunning, bedoeld in [artikel 21][ref5] of [22][ref6], kan voorts worden ingetrokken in het geval en onder
      de voorwaarden, bedoeld in [artikel 3 van de Wet integriteitsbeoordelingen door het openbaar bestuur][ref7].

      3 Voordat toepassing wordt gegeven aan het tweede lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref8], om een advies als
      bedoeld in [artikel 9 van die wet][ref9] worden gevraagd.


