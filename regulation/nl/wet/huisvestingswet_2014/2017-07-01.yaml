  - number: '11'
    text: |-
      In de huisvestingsverordening kan de gemeenteraad bepalen dat voor een of meer daarbij aangewezen
      categorieën woonruimte in verband met de aard, grootte of prijs van die woonruimte bij het verlenen van
      huisvestingsvergunningen voorrang wordt gegeven aan een daarbij aangewezen gedeelte van de overeenkomstig
      [artikel 10, eerste lid][ref1], aangewezen categorieën woningzoekenden.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel10
    url: https://wetten.overheid.nl/BWBR0035303/2017-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11a
    text: |-
      In de huisvestingsverordening bepaalt de gemeenteraad dat indien een jongere als bedoeld in
      [artikel 7:274c, tweede lid, van het Burgerlijk Wetboek][ref1] een huurovereenkomst op grond van dat artikel is
      aangegaan, de inschrijving van die jongere om in aanmerking te komen voor een woonruimte niet vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel274c
    url: https://wetten.overheid.nl/BWBR0035303/2017-07-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 274c
  - number: 11b
    text: |-
      In de huisvestingsverordening bepaalt de gemeenteraad dat indien een huurder een huurovereenkomst voor bepaalde
      tijd als bedoeld in [artikel 7:271, eerste lid, tweede volzin, van het Burgerlijk Wetboek][ref1] is aangegaan, de
      inschrijving van die huurder om in aanmerking te komen voor een woonruimte niet vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel271
    url: https://wetten.overheid.nl/BWBR0035303/2017-07-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '271'
  - number: '12'
    text: |-
      1 In de huisvestingsverordening kan de gemeenteraad bepalen dat voor een of meer daarbij aangewezen categorieën
      woonruimte bij het verlenen van huisvestingsvergunningen voorrang wordt gegeven aan woningzoekenden waarvoor de
      voorziening in de behoefte aan woonruimte dringend noodzakelijk is.

      2 De gemeenteraad legt, indien hij toepassing heeft gegeven aan het eerste lid, in de huisvestingsverordening de
      criteria vast volgens welke de woningzoekenden, bedoeld in dat lid, worden ingedeeld in urgentiecategorieën.

      3 Woningzoekenden die verblijven in een voorziening voor tijdelijke opvang van personen, die in verband met
      problemen van relationele aard of geweld hun woonruimte hebben verlaten en woningzoekenden die mantelzorg als
      bedoeld in [artikel 1.1.1, eerste lid, van de Wet maatschappelijke ondersteuning 2015][ref1] verlenen of ontvangen,
      behoren in ieder geval tot de woningzoekenden, bedoeld in het eerste lid.

      4 Indien de gemeenteraad toepassing heeft gegeven aan het eerste lid legt hij in de huisvestingsverordening vast
      op welke wijze de gemeente voldoet aan de zorg voor de voorziening in de huisvesting van vergunninghouders in de
      gemeente overeenkomstig de voor de gemeente geldende taakstelling, behoudens in die gevallen dat burgemeester en
      wethouders daarin op andere wijze voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1.1.1
    url: https://wetten.overheid.nl/BWBR0035303/2017-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: 1.1.1
  - number: '13'
    text: |-
      1 Burgemeester en wethouders beslissen over de indeling van woningzoekenden in de urgentiecategorieën, bedoeld in
      [artikel 12, tweede lid][ref1]. Burgemeester en wethouders kunnen van deze bevoegdheid mandaat verlenen.

      2 In de huisvestingsverordening stelt de gemeenteraad regels omtrent de wijze waarop woningzoekenden kunnen
      verzoeken om indeling in een urgentiecategorie.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel12
    url: https://wetten.overheid.nl/BWBR0035303/2017-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '14'
    text: |-
      1 In de huisvestingsverordening kan de gemeenteraad bepalen dat bij de verlening van huisvestingsvergunningen
      voorrang wordt gegeven aan woningzoekenden die economisch of maatschappelijk gebonden zijn aan de woningmarktregio,
      de gemeente of een tot de gemeente behorende kern voor een of meer daarbij aangewezen categorieën woonruimte
      voor zover de gemeente als gevolg van regels gesteld bij of krachtens een algemene maatregel van bestuur als
      bedoeld in [artikel 4.3 van de Wet ruimtelijke ordening][ref1] of bij een provinciale verordening als bedoeld in
      [artikel 4.1 van die wet][ref2] geringe of geen mogelijkheden heeft tot uitbreiding van de woonruimtevoorraad.

      2 In de huisvestingsverordening kan de gemeenteraad voor zover het een andere gemeente dan die, bedoeld in
      eerste lid, betreft, bepalen dat bij de verlening van huisvestingsvergunningen voor ten hoogste 50 procent van
      een of meer daarbij aangewezen categorieën woonruimte, voorrang wordt gegeven aan woningzoekenden die economisch
      of maatschappelijk gebonden zijn aan de woningmarktregio. Voor ten hoogste de helft van dat percentage mag
      bij de verlening van huisvestingsvergunningen voorrang worden gegeven aan woningzoekenden die economisch of
      maatschappelijk gebonden zijn aan een tot de gemeente behorende kern.

      3 Voor de toepassing van het eerste en tweede lid is een woningzoekende:

      a. economisch gebonden aan de woningmarktregio, de gemeente of de kern indien hij met het oog op de voorziening in
      het bestaan een redelijk belang heeft zich in die woningmarktregio, die gemeente of die kern te vestigen, en

      b. maatschappelijk gebonden aan de woningmarktregio, de gemeente of de kern indien hij:

      1°. een redelijk, met de plaatselijke samenleving verband houdend belang heeft zich in die woningmarktregio, die
      gemeente of die kern te vestigen, of

      2°. ten minste zes jaar onafgebroken ingezetene is dan wel gedurende de voorafgaande tien jaar ten minste zes jaar
      onafgebroken ingezetene is geweest van die woningmarktregio, die gemeente of die kern.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4.3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4.1
    url: https://wetten.overheid.nl/BWBR0035303/2017-07-01#Artikel14
    references:
      - id: ref1
