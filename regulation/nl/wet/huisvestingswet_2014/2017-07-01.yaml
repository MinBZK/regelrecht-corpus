        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '24'
    text: |-
      De gemeenteraad stelt in de huisvestingsverordening regels omtrent de gronden die tot weigering van een vergunning
      als bedoeld in [artikel 21][ref1] of [22][ref2] kunnen leiden en de voorwaarden en voorschriften die burgemeester
      en wethouders kunnen verbinden aan een vergunning als bedoeld in die artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel22
