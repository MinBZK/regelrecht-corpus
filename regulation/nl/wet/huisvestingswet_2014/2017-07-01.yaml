preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels te stellen met betrekking tot de
    verdeling van woonruimte en de samenstelling van de woonruimtevoorraad;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0035303/2017-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *huishoudinkomen:* gezamenlijke verzamelinkomens als bedoeld in
      [artikel 2.3 van de Wet op de inkomstenbelasting 2001][ref1] van de aanvragers van een huisvestingsvergunning
      voor een bij huisvestingsverordening aangewezen woonruimte, met uitzondering van kinderen in de zin van
      [artikel 4 van de Algemene wet inkomensafhankelijke regelingen][ref2], met dien verstande dat in het eerste lid van
      dat artikel voor «belanghebbende» telkens wordt gelezen «aanvrager»;
        - *huisvestingsvergunning:* vergunning als bedoeld in [artikel 8, eerste lid][ref3];
        - *huisvestingsverordening:* verordening als bedoeld in [artikel 4][ref4];
        - *Onze Minister:* Onze Minister voor Wonen en Rijksdienst;
        - *standplaats:* kavel, bestemd voor het plaatsen van een woonwagen, waarop voorzieningen aanwezig zijn die op het
      leidingnet van de openbare nutsbedrijven, andere instellingen of van gemeenten kunnen worden aangesloten;
        - *taakstelling:* aantal in opvangcentra of op gemeentelijke opvangplaatsen verkerende vergunninghouders in wier
      huisvesting per gemeente per kalenderhalfjaar dient te worden voorzien;
        - *toegelaten instelling:* instelling als bedoeld in [artikel 19 van de Woningwet][ref5];
        - *vergunninghouder:* vreemdeling die in Nederland een verblijfsvergunning asiel voor bepaalde
      tijd heeft aangevraagd en als gevolg daarvan een verblijfsvergunning heeft ontvangen als bedoeld in
      [artikel 8, onderdeel a, b, c, of d, van de Vreemdelingenwet 2000][ref6];
        - *woningmarktregio:* gebied dat vanuit het oogpunt van het functioneren van de woningmarkt als een geheel kan
      worden beschouwd;
        - *woonruimte:* 1° besloten ruimte die, al dan niet tezamen met een of meer andere ruimten, bestemd of geschikt is
      voor bewoning door een huishouden, en 2° standplaats.

      2 Indien de gemeenteraad bij de aanwijzing van categorieën woonruimte op grond van [artikel 7][ref7] gebruik maakt
      van huurprijsgrenzen of koopprijsgrenzen wordt verstaan onder:

        - *huurprijs:* prijs die bij huur en verhuur is verschuldigd voor het enkele gebruik van een woonruimte, uitgedrukt
      in een bedrag per maand;
        - *koopprijs:* prijs die voor de enkele koop van een woonruimte daadwerkelijk is of zal worden betaald.


