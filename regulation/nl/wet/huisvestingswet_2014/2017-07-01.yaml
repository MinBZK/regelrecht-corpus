  - number: '30'
    text: |-
      1 Gedeputeerde staten van de betrokken provincie of de betrokken provincies stellen het aantal inwoners van een
      gemeente op de datum, bedoeld in [artikel 29, eerste lid, onderdeel a][ref1], vast voor de gemeenten die zijn
      betrokken bij een wijziging van de gemeentelijke indeling met ingang van 1 januari van het kalenderjaar waartoe het
      kalenderhalfjaar, bedoeld in artikel 29, eerste lid, onderdeel c, behoort.

      2 Bij de vaststelling, bedoeld in het eerste lid, wordt zo veel mogelijk rekening gehouden met de aantallen
      inwoners van de samenstellende delen van de bij de wijziging van de gemeentelijke indeling betrokken gemeenten.

      3 Gedeputeerde staten maken het aantal inwoners bekend voor 1 oktober van het in
      [artikel 29, eerste lid, onderdeel a][ref2], laatstbedoelde kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel29
