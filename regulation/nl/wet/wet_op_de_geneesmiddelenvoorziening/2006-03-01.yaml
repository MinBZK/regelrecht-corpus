  - number: 2f
    text: |-
      1 Bevoegd, uitsluitend tot het aan particuliere verbruikers anders dan op recept afleveren van farmaceutische
      specialités en farmaceutische preparaten die blijkens de standaardverpakking waarin zij zich bevinden kennelijk
      bestemd zijn om in die verpakking aan zodanige verbruikers te worden afgeleverd, zijn:

      a. personen, aan wie ingevolge artikel 2 van het Vestigingsbesluit kleinhandel in drogisterij-artikelen 1961
      (*Stb.* 21) vergunning is verleend, voor zover die vergunning voor wat betreft de verkoop van geneesmiddelen haar
      geldigheid niet vóór 1 januari 1978 heeft verloren;

      b. personen, aan wie ingevolge [artikel 15 van de Vestigingswet Bedrijven 1954][ref1] (*Stb.* 1964, 66) een
      in tijdsduur onbeperkte ontheffing is verleend van het verbod de kleinhandel in drogisterij-artikelen zonder
      vergunning uit te oefenen, voor zover die ontheffing voor wat betreft de verkoop van geneesmiddelen haar geldigheid
      niet vóór 1 januari 1978 heeft verloren;

      c. personen, aan wie ingevolge [artikel 15 van de Vestigingswet Bedrijven 1954][ref2] een in tijdsduur beperkte
      ontheffing is verleend van het verbod de kleinhandel in drogisterij-artikelen zonder vergunning uit te oefenen,
      voor zover die ontheffing voor wat betreft de verkoop van geneesmiddelen haar geldigheid niet vóór 31 december 1977
      heeft verloren;

      d. personen, aan wie ingevolge [artikel 4 van het Vestigingsbesluit levensmiddelenbedrijven 1961](onbekend) (*Stb.*
      1967, 353) vergunning is verleend, voor zover die vergunning voor wat betreft de verkoop van geneesmiddelen haar
      geldigheid niet vóór 1 januari 1978 heeft verloren;

      e. personen, aan wie ingevolge [artikel 15 van de Vestigingswet Bedrijven 1954][ref3] een in tijdsduur onbeperkte
      ontheffing is verleend van het verbod het kruideniersbedrijf zonder vergunning uit te oefenen, voor zover die
      ontheffing voor wat betreft de verkoop van geneesmiddelen haar geldigheid niet vóór 1 januari 1978 heeft verloren;

      f. andere personen, aan wie door Onze Minister daartoe vergunning is verleend.

      2 De in het eerste lid, onder *f*, bedoelde vergunning wordt slechts verleend aan;

      a. personen die in het bezit zijn van een bewijsstuk van vakbekwaamheid als bedoeld in het besluit, genoemd
      in het eerste lid, onder *a*, dan wel van een bewijsstuk van vakbekwaamheid, hetwelk uiterlijk op 31 december
      van het vijftiende kalenderjaar na 31 december 1977 is afgegeven door of namens de Stichting Pharmaceutische
      Kleinhandelsconventie op grond van het met gunstig gevolg afleggen van een examen, afgenomen overeenkomstig een
      door Onze Minister goedgekeurd examenreglement;

      b. personen die de aflevering van geneesmiddelen doen geschieden onder de onmiddellijke leiding van een persoon die
      in het bezit is van een bewijsstuk van vakbekwaamheid als bedoeld onder *a*;

      c. personen die naar het oordeel van Onze Minister, indien plaatselijke of regionale omstandigheden daartoe
      aanleiding geven, daarvoor in aanmerking komen, zulks na overleg met burgemeester en wethouders van die gemeente.

      3 De bevoegdheid van de personen, bedoeld in het eerste lid, onder *d* en *e*, geldt uitsluitend voor de aflevering
      van de geneesmiddelen genoemd in het [Vestigingsbesluit levensmiddelenbedrijven 1961](onbekend).

      4 Ten aanzien van de bevoegdheid van de personen, bedoeld in het eerste lid, onder *b*, gelden dezelfde beperkingen
      als die waaronder de in dat artikelonderdeel genoemde ontheffing is verleend.

      5 De bevoegdheid van de personen, bedoeld in het eerste lid, onder *c*, geldt slechts tot de datum, genoemd in de
      in dat artikelonderdeel genoemde ontheffing.

      6 De ingevolge het tweede lid, onder *c*, verleende bevoegdheid geldt uitsluitend voor door Onze Minister aan te
      wijzen geneesmiddelen.

      Deze aanwijzing wordt in de *Staatscourant* bekend gemaakt.


