  - number: 2j
    text: |-
      Bij algemene maatregel van bestuur kan het tijdvak, genoemd in [artikel 2f, tweede lid, onder a][ref1], éénmaal
      worden verlengd met een bij die maatregel vermeld tijdvak van ten minste vijf en ten hoogste vijftien jaren, indien
      dit in het belang van de geneesmiddelenvoorziening nodig wordt geacht. De voordracht tot zodanige maatregel wordt
      Ons gedaan in het tiende kalenderjaar na 31 december 1977.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel2f
