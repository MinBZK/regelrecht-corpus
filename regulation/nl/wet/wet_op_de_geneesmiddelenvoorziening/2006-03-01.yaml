        artikel: '5'
  - number: '14'
    text: |-
      1 De in [artikel 2, eerste lid, onder ][ref1] genoemde personen mogen geen gebruik maken van hun bevoegdheid tot
      uitoefening van de artsenijbereidkunst, zolang de inspecteur binnen wiens ambtsgebied zij zich ter uitoefening
      van hun beroep vestigen, hen niet, met het oog op het toezicht op de uitvoering van deze wet, op hun verzoek heeft
      ingeschreven in het register der gevestigde apothekers, der apotheekhoudende artsen, der waarnemende apothekers,
      der tweede apothekers of der apothekers-assistenten. De inschrijving geschiedt voor een apotheek gevestigd in een
      bepaald aangewezen perceel.

      2 Apothekers, apotheekhoudende artsen en apothekers-assistenten in dienstbetrekking bij de zeemacht en de landmacht
      behoeven voor de uitoefening der artsenijbereidkunst uit hoofde van hun dienstbetrekking geen inschrijving.
      Hetzelfde geldt voor apothekers in dienstbetrekking bij de in [artikel 2, eerste lid, onder ][ref2] genoemde
      personen, binnen de grenzen van de aan deze personen verleende vergunningen.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel2
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel14
    references:
