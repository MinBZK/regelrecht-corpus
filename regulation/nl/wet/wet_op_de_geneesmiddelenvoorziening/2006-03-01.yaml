  - number: '6'
    text: |-
      1 De arts die zich voor het uitoefenen van de geneeskundige praktijk vestigt, is, behoudens het bepaalde in het
      tweede en vierde lid en het bepaalde in [artikel 7, eerste lid][ref1], daarnevens bevoegd tot uitoefening der
      artsenijbereidkunst in een uitsluitend aan hem toebehorende apotheek ten behoeve van de tot zijn geneeskundige
      praktijk behorende personen, indien zijn vestiging niet geschiedt in een gemeente, waar een apotheker is gevestigd,
      of in één der aan zodanige gemeente grenzende gemeenten. Deze bevoegdheid geldt voor elk gebied liggende buiten de
      gemeenten, waar een apotheker gevestigd is op het tijdstip dat de arts zich vestigt en de aan zodanige gemeenten
      grenzende gemeenten.

      2 De in het eerste lid genoemde bevoegdheid geldt niet voor:

      1°. het bereiden van farmaceutische specialités;

      2°. het bereiden of afleveren van geneesmiddelen, welke bestemd zijn voor personen, die hun woonplaats in de zin
      van het Burgerlijk Wetboek niet hebben in het gebied, waarvoor de bevoegdheid geldt; deze uitzondering geldt niet
      ten aanzien van personen, die kennelijk tijdelijk in het gebied verblijf houden, zolang dat verblijf duurt.

      3 Het door een arts, tandarts of verloskundige toedienen van geneesmiddelen aan degene, die hij of zij behandelt,
      wordt niet geacht aflevering van geneesmiddelen te zijn.

      4 De commissies, genoemd in [artikel 28, lid 1][ref2], zijn, indien zij dit in het belang van de
      geneesmiddelenvoorziening noodzakelijk oordelen, elk voor haar gebied bevoegd, aan een arts bij diens vestiging
      een groter of kleiner gebied, dan in het eerste lid, tweede volzin, genoemd, aan te wijzen of ingeval van vestiging
      van een arts binnen een gemeente als bedoeld in het eerste lid op diens verzoek een vergunning te verlenen
      tot uitoefening der artsenijbereidkunst in de gemeenten of gedeelten van gemeenten, welke in de vergunning
      zijn aangewezen. De vergunning kan voor bepaalde of onbepaalde tijd worden verleend. Indien de vergunning voor
      onbepaalde tijd is verleend kan zij worden ingetrokken, wanneer de grond voor de verlening ervan is vervallen.

      5 Aan een arts kan op zijn verzoek door de bevoegde commissie, bedoeld in artikel 28, lid 1, in het belang der
      geneesmiddelenvoorziening vergunning worden verleend de geneesmiddelen, ten behoeve der door hem behandelde
      patiënten voorgeschreven, in een apotheek van een apotheekhoudend arts met wie hij gezamenlijk de praktijk
      uitoefent, te bereiden en af te leveren, mits deze patiënten hun woonplaats in de zin van het Burgerlijk Wetboek
      hebben in het gebied, waarin deze apotheekhoudend arts bevoegd is tot het uitoefenen der artsenijbereidkunst.
      De vergunning vervalt op het tijdstip, waarop de inschrijving van de apotheekhoudend arts op grond van
      [artikel 16][ref3] vervalt of wordt ingetrokken.

      6 De arts en de apotheker of apothekers die het aangaat, kunnen tegen de beschikking ingevolge het vierde lid
      bij Onze Minister beroep instellen. De werking van de beschikking wordt opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.

      7 De arts die het aangaat, kan tegen de weigering of de intrekking van de vergunning ingevolge het vijfde lid bij
      Onze Minister in beroep komen.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002290#Artikel16
