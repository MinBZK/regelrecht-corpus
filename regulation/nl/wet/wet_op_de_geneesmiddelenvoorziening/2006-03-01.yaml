  - number: '33'
    text: |-
      1 Met het opsporen van de feiten, strafbaar gesteld in deze wet, zijn, behalve de bij of krachtens
      [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen personen, belast de hoofdinspecteur, de
      inspecteurs en de aan de hoofdinspecteur en de inspecteurs toegevoegde ambtenaren alsmede de door Onze Minister
      aangewezen personen.

      2 Zij zijn te allen tijde bevoegd om in beslag te nemen, zomede ter inbeslagneming de uitlevering te vorderen
      van alle substanties en voorwerpen, welke tot ontdekking der waarheid kunnen dienen of welker verbeurdverklaring,
      vernietiging of onbruikbaarmaking kan worden bevolen.

      3 Zij hebben bij het opsporen van de bij deze wet strafbaar gestelde feiten toegang tot elke plaats, voor zover dat
      redelijkerwijs voor de vervulling van hun taak nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '34'
    text: |-
      1 De geneeskundigen, die op het tijdstip van inwerkingtreding van deze wet als zodanig gevestigd zijn en gebruik
      maken van de bevoegdheid, hun toekomende krachtens artikel 9 van de wet van 1 juni 1865 (*Staatsblad* No. 60)
      en artikel 21 van de wet van 1 juni 1865 (*Staatsblad* No. 61), tot bereiding en aflevering van geneesmiddelen
      in de plaats, waar zij gevestigd zijn en in andere plaatsen in welke geen apotheker gevestigd is, behouden die
      voorschreven bevoegdheid zolang zij daarvan gebruik blijven maken, echter uiterlijk zolang zij in dezelfde gemeente
      als geneeskundige gevestigd blijven en met uitzondering van de bereiding van farmaceutische specialités.

      2 Apothekers en apothekers-assistenten, die op het tijdstip van inwerkingtreden van deze wet van hun
      bevoegdheid volgens de bepalingen van de wet van 1 Juni 1865 (*Staatsblad* No. 61), regelende de uitoefening der
      artsenijbereidkunst, gebruik maken, behouden deze bevoegdheid tot het tijdstip, waarop zij door de inspecteur in
      de registers, bedoeld in [artikel 14][ref1], zijn ingeschreven, doch ten hoogste gedurende een termijn van acht
      maanden.

      3 De geneeskundigen, bedoeld in het eerste lid, en de apothekers en apothekers-assistenten, bedoeld in het
      tweede lid, die na het tijdstip, waarop deze wet in werking is getreden, van de bevoegdheid tot uitoefening der
      artsenijbereidkunst gebruik willen maken, zijn verplicht zich binnen zes maanden na dat tijdstip tot de inspecteur
      te wenden met een verzoek om inschrijving en, voor zover het waarnemende apothekers betreft, met een verzoek om
      toestemming tot waarneming.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel14
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel34
