  - number: '9'
    text: |-
      Indien de praktijk van een apotheekhoudend arts door een andere arts wordt waargenomen, gaan tijdens de waarneming
      de bevoegdheden en verplichtingen, welke de apotheekhoudende arts ingevolge deze wet heeft, over op degene, die
      zijn praktijk waarneemt, voor zover niet door enig voorschrift bij of krachtens deze wet gegeven, daarop een
      uitzondering wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel9
  - number: '10'
    text: |-
      De arts, die zich als zodanig voor de dienst op een schip heeft verbonden, is aan boord van dat schip, nadat
      hij krachtens [artikel 14][ref1] door de inspecteur als apotheekhoudend arts op dat schip is ingeschreven, van
      het tijdstip der inschrijving af tot de beëindiging van zijn dienst aan boord, bevoegd tot de uitoefening der
      artsenijbereidkunst ten behoeve van de kapitein en de opvarenden.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel14
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
  - number: '11'
    text: |-
      1 De eigenaar of, in geval van rompbevrachting, de rompbevrachter van een schip, waarop zich een arts voor de
      dienst heeft verbonden, is verplicht zorg te dragen, dat tijdig voor iedere reis de geneesmiddelen, werktuigen en
      verdere benodigdheden, vermeld op een door de arts opgemaakte en door hem ondertekende lijst, in deugdelijke staat
      en in voldoende hoeveelheid aan boord van het schip aanwezig zijn in een daartoe geschikte ruimte en dat de arts de
      ingevolge deze wet op hem rustende verplichtigen kan nakomen.

      2 Indien de inspecteur van tekortkomingen in de verplichtingen van de eigenaar of rompbevrachter, in het eerste
      lid bedoeld, niet is gebleken en een arts ingevolge het bepaalde in [artikel 10][ref1] is ingeschreven, geeft de
      inspecteur van een en ander een schriftelijke verklaring af, welke bij vertrek van het schip door de kapitein aan
      de bevoegde ambtenaren van de divisie Scheepvaart van de Inspectie Verkeer en Waterstaat moet worden getoond.

      3 Op de in het eerste lid bedoelde lijst mogen de geneesmiddelen door Onze Minister aan te wijzen, niet ontbreken.

      4 Het toedienen van de geneesmiddelen, welke ingevolge de [Schepenwet][ref2] aan boord van een schip, waarop geen
      arts gemonsterd is, aanwezig zijn, wordt niet geacht aflevering van geneesmiddelen te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001876
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel11
    references:
