  - number: '7'
    text: |-
      1 Onze Minister is bevoegd gemeenten of gedeelten van gemeenten, waar geen apotheker is gevestigd, aan te wijzen
      als een gebied waar artsen, die zich na de datum der aanwijzing daarin vestigen, de bevoegdheid tot uitoefening
      der artsenijbereidkunst op grond van [artikel 6][ref1] slechts hebben, zolang in dit gebied geen apotheker is
      gevestigd.

      2 De arts, die op het tijdstip van aanwijzing, in het eerste lid bedoeld, reeds binnen dit gebied gevestigd is
      en op grond van [artikel 6][ref2] de artsenijbereidkunst uitoefent, behoudt, ook wanneer zich in dat gebied een
      apotheker heeft gevestigd, zijn bevoegdheid tot uitoefening der artsenijbereidkunst, zolang hij daarvan gebruik
      blijft maken.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel6
