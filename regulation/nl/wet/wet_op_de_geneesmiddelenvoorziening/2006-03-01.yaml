        artikel: '16'
        hoofdstuk: III
        paragraaf: '1'
  - number: '22'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van het
      Staatstoezicht op de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel22
  - number: '24'
    text: |-
      Indien de inspecteur bij zijn onderzoek blijkt, dat niet voldaan is of wordt aan de bepalingen, bij of krachtens
      deze wet gesteld, doet hij, onverminderd de bevoegdheid, bedoeld in [artikel 33, eerste lid][ref1], daarvan
      mededeling aan de gevestigde apotheker, de waarnemende apotheker of de apotheekhoudend arts met vermelding van een
      termijn, binnen welke aan de gestelde bepalingen moet zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel33
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '33'
        hoofdstuk: VI
  - number: '25'
    text: |-
      1 De inspecteur is bevoegd de gevestigde apotheker, de waarnemende apotheker en de apotheekhoudend arts
      aanwijzingen te geven ter verbetering van de inrichting en de toestand van de apotheek en van de wijze waarop
      daarin de artsenijbereidkunst wordt uitgeoefend.

      2 De inspecteur is bevoegd de in het eerste lid bedoelde aanwijzing schriftelijk te geven, waarbij hij een termijn
      bepaalt, binnen welke aan de aanwijzing gevolg moet zijn gegeven.

      3 De gevestigde apotheker, de waarnemende apotheker of de apotheekhoudende arts behoeven aan de gegeven aanwijzing
      geen gevolg te geven, zolang deze aanwijzing nog niet onherroepelijk is geworden. De eerste volzin is niet van
      toepassing indien naar het oordeel van de inspecteur een onmiddellijke opvolging van de aanwijzing in het belang
      van de volksgezondheid noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel25
  - number: '26'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven betreffende:

      a. de uitoefening van de artsenijbereidkunst, waarbij tevens verboden kan worden, dat anderen dan gevestigde
      apothekers, waarnemende apothekers, tweede apothekers, en apotheekhoudende artsen aankondigingen bezigen, welke de
      indruk wekken of zouden kunnen wekken, dat zij de artsenijbereidkunst uitoefenen;

      b. de overdracht van hetgeen in een apotheek, waarin de artsenijbereidkunst niet meer wordt uitgeoefend, aanwezig
      is;

      c. de inschrijving der in [artikel 14][ref1] genoemde personen en de kennisgeving, bedoeld in [artikel 17][ref2];

      d. het toezicht op apotheken, het zonder schadeloosstelling vernietigen of onbruikbaar maken van ondeugdelijke
      geneesmiddelen en van voorwerpen ten gebruike bij de uitoefening der artsenijbereidkunst, welke niet voldoen aan de
      daaraan gestelde eisen;

      e. het vaststellen van gebieden, als bedoeld in [artikel 7, eerste lid][ref3], en de vestiging van een apotheker in
      een gebied als bedoeld in [artikel 7, eerste lid][ref4];

      f. de registratie, bedoeld in [artikel 3][ref5], de schorsing en de doorhaling van die registratie, en voorts
      betreffende de bereiding, de verpakking, de etikettering van de verpakking, de geschriften in of gevoegd bij
      de verpakking, het verkopen, de aflevering, de invoer, de uitvoer, de handel, het ter aflevering in voorraad
      hebben en de aanprijzing van farmaceutische specialités en van farmaceutische preparaten, alsmede betreffende
      de door belanghebbenden te betalen vergoedingen voor onderzoek, registratie en toezicht op de naleving van
      deze voorschriften; daarbij kunnen een of meer van die voorschriften van toepassing worden verklaard op enige
      substantie, indien dit in het belang van de volksgezondheid nodig wordt geacht;

      g. de vereisten waaraan personen moeten voldoen om voor een vergunning, bedoeld in
      de[ artikelen 2, eerste lid, onder ][ref6], [4, eerste lid, onder ][ref7], in aanmerking te komen, alsmede de
      vereisten waaraan lokaliteiten moeten voldoen, waarin deze personen de farmaceutische specialités en farmaceutische
      preparaten bereiden, bewaren, afleveren en controleren; de vereisten, waaraan personen moeten voldoen, mogen
      slechts betrekking hebben op de vakbekwaamheid van deze personen;

      h. de aflevering en de bewaring van en het omgaan met de bij of krachtens die voorschriften aangewezen vergiften;

      i. de wijze van aanvragen van door Onze Minister krachtens deze wet te verlenen vergunningen.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0002290#Artikel7
