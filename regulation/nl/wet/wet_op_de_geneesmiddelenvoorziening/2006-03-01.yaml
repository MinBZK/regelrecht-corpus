  - number: 3a
    text: |-
      1 Bij algemene maatregel van bestuur kan, indien het belang van de volksgezondheid zulks vordert, worden bepaald
      dat daarbij aangewezen geneesmiddelen slechts mogen worden afgeleverd na vrijgifte van de partij, waartoe die
      geneesmiddelen behoren, door een bij die maatregel aangewezen bestuursorgaan. Een partij wordt vrijgegeven indien
      uit het onderzoek van die partij blijkt dat de tot die partij behorende geneesmiddelen voldoen aan de bij of
      krachtens de wet gestelde eisen. Voor elke uitgifte is een vergoeding verschuldigd volgens een door Onze Minister
      vastgesteld tarief.

      2 Een verzoek om vrijgifte van een partij dient vergezeld te gaan van de op die partij betrekking hebbende
      bereidings- en onderzoeksprotocollen. Indien de in het eerste lid bedoelde instantie zulks met het oog op
      de beoordeling van de deugdelijkheid van de desbetreffende partij noodzakelijk acht, is zij bevoegd nadere
      schriftelijke inlichtingen en monsters van die partij te verlangen.

      3 Onze Minister kan ontheffing verlenen van het bepaalde in het eerste lid. De ontheffing kan onder beperkingen
      worden verleend, aan de ontheffing kunnen voorschriften worden verbonden en de aan de ontheffing verbonden
      voorschriften, alsmede de beperkingen waaronder de ontheffing is verleend, kunnen worden gewijzigd of ingetrokken.

      4 Het bepaalde in het eerste lid is niet van toepassing in geval de partij, waartoe de geneesmiddelen behoren,
      reeds is onderzocht door de bevoegde instantie van een andere lid-staat van de Europese Gemeenschappen en die
      instantie heeft verklaard dat de desbetreffende partij in overeenstemming is met de goedgekeurde specificaties.
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel3a
  - number: '4'
    text: |-
      1 Bij algemene maatregel van bestuur wordt, voor zover het belang van de volksgezondheid zulks vordert, bepaald
      welke geneesmiddelen slechts mogen worden afgeleverd:

      a. door hen, die ingevolge [artikel 2, eerste lid, onder ][ref1], tot uitoefening der artsenijbereidkunst bevoegd
      zijn en door de inspecteur ingevolge [artikel 14][ref2] zijn ingeschreven, mits de aflevering geschiedt in de
      apotheek, waarvoor zij zijn ingeschreven;

      b.

      c. door in Nederland gevestigde personen, rechtspersonen daaronder begrepen, aan wie daartoe door Onze Minister
      vergunning is verleend. De vergunninghouder mag de in de aanhef bedoelde geneesmiddelen uitsluitend afleveren aan
      in Nederland gevestigde personen, rechtspersonen daaronder begrepen, die zodanige geneesmiddelen ingevolge deze
      wet mogen afleveren, alsmede aan ziekenhuizen en aan bij algemene maatregel van bestuur aangewezen categorieën
      van personen of instellingen met inachtneming van de bij of krachtens die maatregel gegeven voorschriften;
      hij mag niet over de toonbank verkopen, noch open winkel houden. Het bepaalde in de laatste drie volzinnen van
      [artikel 2, eerste lid, onder ][ref3], is van toepassing.

      2 Het ontwerp van een algemene maatregel van bestuur, bedoeld in het eerste lid, wordt algemeen bekendgemaakt door
      plaatsing in de *Staatscourant*. De voordracht tot die algemene maatregel van bestuur wordt Ons niet gedaan, dan
      nadat één maand sinds die bekendmaking is verstreken.

      3 Het College ter beoordeling van geneesmiddelen, genoemd in artikel 29, eerste lid, besluit bij de inschrijving
      in het in [artikel 3, eerste lid][ref4], bedoelde register tevens, welke geneesmiddelen, indien het belang van de
      volksgezondheid zulks vordert, uitsluitend door de in het eerste lid, onder *a*, bedoelde personen, en uitsluitend
      op recept mogen worden afgeleverd. Bij ministeriële regeling worden de criteria vastgesteld die door het College
      bij het besluit in acht worden genomen. Tevens wordt bij ministeriële regeling bepaald in welke bijzondere
      omstandigheden een geneesmiddel waarop de eerste volzin toepassing heeft gevonden, zonder recept kan worden
      afgeleverd. Van het besluit van het College wordt mededeling gedaan in de Staatscourant. Ieder jaar zendt het
      College aan Onze Minister naar de stand per 1 april van dat jaar een lijst van alle geneesmiddelen waarop de eerste
      volzin toepassing heeft gevonden. De geneesmiddelen ten aanzien waarvan de eerste volzin toepassing heeft gevonden
      mogen anders dan op recept slechts worden afgeleverd door de personen, bedoeld in het eerste lid, onder *c*, met
      inachtneming van hetgeen in dat artikel-onderdeel is bepaald.

      4 Het is verboden de in het eerste en derde lid bedoelde geneesmiddelen op of in voor het publiek toegankelijke
      verkoopplaatsen andere dan apotheken, alsmede in de bij deze verkoopplaatsen behorende werk- en bergplaatsen, in
      verkoopautomaten en op of aan de openbare weg zich bevindende verkoopgelegenheden, aanwezig te hebben.

      5 Indien het belang der volksgezondheid zulks vordert, is Onze Minister bevoegd ten aanzien van door hem aangewezen
      substanties:

      a. regelen te stellen voor de bereiding, de vervaardiging, de winning, de teelt, de verwerking, de bewerking, de
      verpakking, de deugdelijkheid, de bewaring, het vervoer, de aflevering en het toezicht daarop;

      b. te bepalen, dat zij niet mogen worden ingevoerd, dan wel dat zij niet mogen worden ingevoerd anders dan met
      inachtneming van bij zijn beschikking gestelde voorwaarden;

      c. te bepalen, dat zij niet mogen worden afgeleverd, dan wel dat zij gedurende een bij zijn beschikking aangewezen
      tijdvak van ten hoogste twaalf maanden niet mogen worden afgeleverd dan met inachtneming van de bij zijn
      beschikking gestelde voorwaarden.

      6 Kosten van onderzoek en toezicht ten behoeve van de naleving der voorschriften, welke door Onze Minister
      krachtens het vorige lid zijn gegeven, worden gedragen door hen, die de substanties, in dat lid bedoeld, bereiden,
      vervaardigen, winnen, telen, verwerken, bewerken, verpakken, afleveren of invoeren, volgens regelen door Onze
      Minister vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0002290#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0002290#Artikel3
