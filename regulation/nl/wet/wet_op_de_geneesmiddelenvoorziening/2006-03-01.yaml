        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002290
        artikel: '2'
        hoofdstuk: I
  - number: '15'
    text: |-
      1 De inschrijving wordt door de inspecteur geweigerd:

      a. ingeval het een apotheker betreft: indien de aanvrager niet ingeschreven staat in het desbetreffende
      overeenkomstig [artikel 3, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref1] (*Stb.*
      1993, 655) ingestelde register;

      b. ingeval het een apotheekhoudende arts betreft: indien de aanvrager niet ingeschreven staat in het desbetreffende
      overeenkomstig [artikel 3, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref2]
      ingestelde register of hem de bevoegdheid tot uitoefening van de artsenijbereidkunst niet toekomt;

      c. ingeval het een apothekers-assistent betreft: indien de aanvrager niet de wettelijk geregelde opleiding tot dat
      beroep of een door Onze Minister daarmee gelijkgestelde buitenlandse opleiding heeft voltooid.

      2 De inspecteur is bevoegd de inschrijving te weigeren:

      a. indien niet voldaan is aan de voorschriften ingevolge [artikel 26, onder ][ref3], ten aanzien van het verzoek om
      inschrijving gesteld;

      b. indien de apotheek niet voldoet aan de eisen bij of krachtens deze wet aan apotheken gesteld;

      c. indien niet de nodige waarborgen aanwezig zijn voor de aflevering van deugdelijke geneesmiddelen; onder deze
      waarborgen is mede begrepen, dat het toezicht door de apotheker in zijn apotheek uit te oefenen voldoende zal zijn.

      3 Het bepaalde in het tweede lid, onder *b* en *c*, is niet van toepassing op apothekers-assistenten.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002290#Artikel26
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002290
        artikel: '26'
        hoofdstuk: IV
  - number: '16'
    text: |-
      1 De inschrijving vervalt:

      a. bij overlijden van de ingeschrevene;

      b. indien de ingeschrevene aan de inspecteur te kennen geeft, dat hij ophoudt de artsenijbereidkunst uit te oefenen
      in de apotheek, waarvoor hij is ingeschreven;

      c. ingeval het een apotheker betreft: indien de ingeschrevene niet meer ingeschreven staat in het desbetreffende
      overeenkomstig [artikel 3, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref1]
      ingestelde register;

      d. ingeval het een apotheekhoudende arts betreft: indien de ingeschrevene
      niet meer ingeschreven staat in het desbetreffende overeenkomstig
      [artikel 3, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref2] ingestelde register, of
      hij zijn bevoegdheid tot uitoefening van de artsenijbereidkunst heeft verloren.

      2 De inspecteur is bevoegd de inschrijving van een gevestigd apotheker, een waarnemend apotheker, een tweede
      apotheker, of een apotheekhoudend arts in te trekken, indien naar zijn oordeel voldoende waarborgen voor de
      aflevering van deugdelijke geneesmiddelen niet aanwezig zijn. Onder deze waarborgen is mede begrepen, dat het
      toezicht door de apotheker in zijn apotheek uit te oefenen voldoende zal zijn.

      3 In de gevallen, bedoeld in het eerste en tweede lid, is de inspecteur bevoegd de apotheek te sluiten en de
      toegang, de kasten en de werktuigen te verzegelen gedurende de tijd, dat geen nieuwe inschrijving is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '3'
  - number: '17'
    text: |-
      De apotheker zowel als de arts is verplicht, zodra hijzelf, dan wel een in zijn apotheek werkzame apothekers-
      assistent ophoudt de artsenijbereidkunst uit te oefenen in de apotheek, waarvoor hij is ingeschreven, daarvan
      kennis te geven aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel17
  - number: '18'
    text: |-
      1 De inspecteur mag zijn bevoegdheid tot sluiting ingevolge [artikel 16, derde lid][ref1], niet uitoefenen
      voordat de beschikking tot weigering of intrekking van de inschrijving, bedoeld in [artikel 15, tweede lid][ref2],
      onderscheidenlijk [artikel 16, tweede lid][ref3], onherroepelijk is geworden.

      2 Het eerste lid is niet van toepassing indien naar het oordeel van de inspecteur een onmiddellijke sluiting in het
      belang van de volksgezondheid noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002290#Artikel16
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '16'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002290
        artikel: '15'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002290
        artikel: '16'
        hoofdstuk: III
        paragraaf: '1'
  - number: '19'
    text: |-
      De apotheker of de apotheekhoudend arts mag de artsenijbereidkunst slechts in één apotheek uitoefenen, behoudens in
      de gevallen voorzien in de[ artikelen 9][ref1] en [21][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel21
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '9'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002290
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '20'
    text: |-
      Indien in een apotheek meer dan één apotheker de artsenijbereidkunst uitoefent, rusten alle verplichtingen,
      welke deze wet de apotheker oplegt, op de gevestigde apotheker, tenzij belanghebbenden schriftelijk anders zijn
      overeengekomen en de inspecteur aan belanghebbenden schriftelijk van zijn instemming met deze overeenkomst heeft
      doen blijken.
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel20
  - number: '21'
    text: |-
      1 Indien een apotheker door ziekte of afwezigheid verhinderd is de artsenijbereidkunst in zijn apotheek uit te
      oefenen, dan wel de inschrijving volgens [artikel 16][ref1] is vervallen of ingetrokken, kan de inspecteur aan een
      andere apotheker op diens verzoek toestaan de artsenijbereidkunst in die apotheek als waarnemend apotheker uit te
      oefenen. De inspecteur kan aan deze toestemming voorwaarden verbinden.

      2 Tijdens de waarneming gaan de bevoegdheden en verplichtingen, welke de gevestigde apotheker ingevolge deze wet
      heeft, op de waarnemende apotheker over, voor zover niet door enig voorschrift bij of krachtens deze wet gegeven,
      daarop een uitzondering wordt gemaakt.

      3 De in het eerste lid bedoelde toestemming wordt door de inspecteur verleend, indien naar zijn oordeel voldoende
      waarborgen aanwezig zijn voor het nakomen van de verplichtingen in het tweede lid bedoeld. De toestemming wordt
      voor een bepaalde tijd verleend en kan telkens op aanvrage voor een bepaalde tijd worden verlengd.

      4 De inspecteur is bevoegd een verleende toestemming in te trekken, indien aan de verplichtingen in het tweede lid
      gesteld of aan de voorwaarden, waaronder de toestemming is verleend, niet wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel16
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel21
    references:
      - id: ref1
