preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wet van 1 Juni 1865 (Staatsblad no. 61) regelende de
    uitoefening der artsenijbereidkunst door een nieuwe regeling nopens de geneesmiddelenvoorziening en de uitoefening
    der artsenijbereidkunst te vervangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid en Milieuhygiëne;

      b. hoofdinspecteur: de bevoegde hoofdinspecteur van het Staatstoezicht op de volksgezondheid;

      c. inspecteur: de bevoegde regionale inspecteur van het Staatstoezicht op de volksgezondheid;

      d. substantie: stof van menselijke, dierlijke, plantaardige of chemische oorsprong, daaronder begrepen dieren,
      planten, delen van dieren of planten, alsmede micro-organismen;

      e. geneesmiddel: substantie of samenstelling van substanties, welke is bestemd te worden gebruikt of op enigerlei
      wijze wordt aangeduid of aanbevolen als zijnde geschikt voor:

      1°. het genezen, lenigen of voorkomen van enige aandoening, ziekte, ziekteverschijnsel, pijn, verwonding of gebrek
      bij de mens,

      2°. het herstellen, verbeteren of wijzigen van het functioneren van organen bij de mens,

      3°. het stellen van een medische diagnose door toediening aan of aanwending bij de mens;

      f. farmaceutische vorm: vorm welke met het oog op de toediening of aanwending van een geneesmiddel wordt gebezigd;

      g. speciale benaming: benaming, welke niet of niet uitsluitend een soortnaam of wetenschappelijke benaming is;

      h. farmaceutische specialité: geneesmiddel in een farmaceutische vorm, dat in de handel wordt gebracht onder een
      speciale benaming en in een standaardverpakking;

      i. farmaceutisch preparaat: geneesmiddel in een farmaceutische vorm dat in de handel wordt gebracht, niet onder een
      speciale benaming of niet in een standaardverpakking;

      j. artsenijbereidkunst:

      1°. bereiden van geneesmiddelen, daaronder begrepen het in een farmaceutische vorm brengen, alsmede het verpakken
      en het etiketteren van de verpakking;

      2°. afleveren van geneesmiddelen;

      k. apotheek: lokaal dat, of bij elkaar behorende lokalen en bewaarplaatsen, welke door een apotheker of een
      apotheekhoudend arts wordt of worden gebruikt voor of in verband met de uitoefening van de artsenijbereidkunst;

      l. recept: schriftelijke aanwijzing nopens de bereiding of de aflevering van een geneesmiddel, afgegeven door
      een arts, een tandarts of een verloskundige ten behoeve van een of meer met name genoemde dan wel met cijfers of
      letters aangeduide personen; met een recept wordt gelijkgesteld een afschrift, dat voldoet aan de voorschriften
      krachtens [artikel 26][ref1] gegeven;

      m. gevestigde apotheker: apotheker, ingeschreven in het register der gevestigde apothekers, bedoeld in
      [artikel 14][ref2];

      n. tweede apotheker: apotheker, ingeschreven in het register der tweede apothekers, bedoeld in [artikel 14][ref3];

      o. ziekenhuis: inrichting, waarin personen worden opgenomen voor het ondergaan van een genees-, heel- of
      verloskundig onderzoek of van een genees-, heel- of verloskundige behandeling;

      p. geneesmiddel voor onderzoek: een middel als bedoeld in
      [artikel 1, eerste lid, onder o, van de Wet medisch-wetenschappelijk onderzoek met mensen][ref4].

      2 Deze wet is op bloedproducten in de zin van de [Wet inzake bloedvoorziening][ref5] slechts van toepassing voor
      zover die bloedproducten overeenkomstig de regelgeving van de Europese Unie als geneesmiddel worden aangemerkt
      en met betrekking daartoe bindende regels zijn vastgesteld ter uitvoering van het Verdrag betreffende de Europese
      Unie.

      3 Bij algemene maatregel van bestuur kunnen de[ artikelen 2, eerste lid, onder ][ref6], [3][ref7] en [8][ref8],
      geheel of gedeeltelijk niet van toepassing worden verklaard in bij die maatregel te bepalen gevallen of ten aanzien
      van bij die maatregel aangewezen geneesmiddelen, indien deze toepassing in het belang van de volksgezondheid niet
      nodig wordt geacht.

      4 Indien een geneesmiddel mede bestaat uit andere dan bloedproducten, in de zin van de
      [Wet inzake bloedvoorziening][ref9], maar die daarin geen therapeutische functie hebben, is niet de
      [Wet inzake bloedvoorziening][ref10] maar de onderhavige wet van toepassing op dat geneesmiddel.


