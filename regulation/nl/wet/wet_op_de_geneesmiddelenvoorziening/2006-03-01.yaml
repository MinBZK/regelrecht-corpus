  - number: '3'
    text: |-
      1 Het College ter beoordeling van geneesmiddelen, genoemd in [artikel 29, eerste lid][ref1], houdt van
      farmaceutische specialités en van farmaceutische preparaten, welke mogen worden bereid en afgeleverd, registers
      bij. Een aanvraag tot inschrijving in het register van farmaceutische specialités of van farmaceutische preparaten
      wordt bij het College schriftelijk ingediend door de in Nederland gevestigde fabrikant of importeur, dan wel in
      geval een ander in Nederland gevestigd persoon, rechtspersoon daaronder begrepen, dan de fabrikant of importeur
      voor het in Nederland in de handel brengen van een farmaceutische specialité of een farmaceutisch preparaat
      verantwoordelijk zal zijn, door deze laatste. Het College schrijft in het desbetreffende register slechts
      farmaceutische specialités, onderscheidenlijk farmaceutische preparaten in, indien:

      a. na onderzoek van de door de aanvrager overgelegde gegevens blijkt dat zij:

      1°. bij gebruik overeenkomstig het door de aanvrager opgegeven voorschrift naar redelijkerwijs mag worden
      aangenomen de gestelde werking, waaronder begrepen de werkzaamheid ten aanzien van de opgegeven indicaties,
      bezitten en niet schadelijk zijn voor de gezondheid;

      2°. de opgegeven kwalitatieve en kwantitatieve samenstelling bezitten;

      b. is voldaan aan de voorschriften, gegeven krachtens [artikel 26, onder f][ref2].

      2 Behoudens in geval van doorhaling, geldt een inschrijving voor een tijdvak van vijf jaren, te rekenen vanaf
      de dagtekening van de brief, bedoeld in de eerste volzin van het vierde lid, en wordt telkenmale met een gelijk
      tijdvak verlengd indien degeen, te wiens name de farmaceutische specialité of het farmaceutisch preparaat in het
      desbetreffende register staat ingeschreven, het College binnen drie maanden vóór het verstrijken van dat tijdvak
      zulks per aangetekend schrijven heeft verzocht.

      3 Een inschrijving wordt door het College geschorst of doorgehaald met inachtneming van de voorschriften, gegeven
      krachtens [artikel 26, onder f][ref3].

      4 Het is verboden:

      a. ongeregistreerde farmaceutische specialités en farmaceutische preparaten, dan wel geregistreerde farmaceutische
      specialités en farmaceutische preparaten, waarvan de inschrijving is geschorst, te bereiden, te verkopen, af te
      leveren, in te voeren of te verhandelen;

      b. ongeregistreerde farmaceutische specialités en farmaceutische preparaten ter aflevering in voorraad te hebben.

      5 Het vierde lid is niet van toepassing op ongeregistreerde geneesmiddelen voor onderzoek voor de bereiding of
      aflevering waarvan door Onze Minister vergunning is verleend.

      6 Het eerste tot en met het vijfde lid zijn niet van toepassing ten aanzien van farmaceutische preparaten,
      welke door de personen bedoeld in [artikel 4, eerste lid, onder a][ref4] in hun apotheek zijn bereid en door hen
      uitsluitend worden afgeleverd aan personen die deze geneesmiddelen voor eigen gebruik of ter uitoefening van de
      geneeskunst aanwenden.

      7 Ter uitvoering van een krachtens het Verdrag tot oprichting van de Europese Economische Gemeenschap, de
      Overeenkomst betreffende de Europese Economische Ruimte, of krachtens het Verdrag tot instelling van de Benelux
      Economische Unie tot stand gekomen bindende regeling inzake het in de handel brengen van geneesmiddelen kunnen bij
      algemene maatregel van bestuur regelen worden gesteld, waarbij kan worden afgeweken van de voorgaande bepalingen
      van dit artikel.

      8 Het is verboden een farmaceutische specialité of een farmaceutisch preparaat aan te prijzen op een wijze welke
      misleidend is ten aanzien van de werking van het geneesmiddel, waaronder begrepen de werkzaamheid ten aanzien van
      de indicaties welke in het register, bedoeld in het eerste lid, zijn ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0002290#Artikel26
