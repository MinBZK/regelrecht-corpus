  - number: '5'
    text: |-
      Voor elke vergunning, bedoeld in [artikel 2, eerste lid, onder d][ref1], en in
      [artikel 4, eerste lid, onder c][ref2], wordt een jaarlijkse vergoeding geheven volgens een tarief, overeenkomstig
      door Onze Minister vast te stellen regelen. Voor een vergunning voor het bereiden en afleveren van geneesmiddelen
      voor onderzoek dan wel voor het uitsluitend afleveren daarvan kan een jaarlijkse vergoeding worden geheven. De
      hoogte van de vergoeding wordt bij ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel4
