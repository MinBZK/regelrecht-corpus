        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001876
  - number: '12'
    text: |-
      1 De kapitein maakt, telkens wanneer hij van oordeel is dat de arts een der bij of krachtens deze wet vastgestelde
      bepalingen heeft overtreden, daarvan melding in het scheepsdagboek.

      2 Hij zendt een afschrift van zijn hierop betrekking hebbende aantekeningen, bij aankomst ter plaatse van
      bestemming hier te lande, aan de inspecteur, binnen wiens ambtsgebied de plaats van bestemming is gelegen.
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel12
  - number: '13'
    text: |-
      1 In dit artikel wordt verstaan onder «ziekenhuis»: een krachtens
      [artikel 5 van de Wet toelating zorginstellingen][ref1] als zodanig toegelaten instelling.

      2 In een ziekenhuis met een grootte, gelijk aan of meer dan een bij ministeriële regeling vast te stellen
      aantal bedden, bestemd voor opname van patiënten, is een apotheek gevestigd waarin de bereiding en aflevering
      van geneesmiddelen geschiedt door een in het register van gevestigde apothekers, bedoeld in [artikel 14][ref2],
      ingeschreven apotheker die in dienst is van de rechtspersoon die het ziekenhuis in stand houdt.

      3 De aflevering van geneesmiddelen ten behoeve van patiënten die zijn opgenomen in een krachtens
      [artikel 5 van de Wet toelating zorginstellingen][ref3] als zodanig toegelaten psychiatrisch ziekenhuis,
      verpleeginrichting of zwakzinnigeninrichting, of in een ziekenhuis waarin geen apotheek is gevestigd, geschiedt
      door of onder toezicht van een apotheker die is ingeschreven in het register bedoeld in het tweede lid.

      4 Onze Minister kan voor een bepaald ziekenhuis of voor bepaalde groepen van ziekenhuizen, al dan niet onder het
      stellen van voorwaarden, ontheffing verlenen van de in het tweede lid bedoelde verplichting tot het vestigen van
      een apotheek.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0018906#Artikel5
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel13
    references:
      - id: ref1
