  - number: '37'
    text: |-
      Deze wet kan worden aangehaald onder de naam Wet op de Geneesmiddelenvoorziening en treedt in werking op een
      door Ons te bepalen tijdstip. Wij kunnen het inwerkingtreden van de verschillende onderdelen van deze wet op
      verschillende tijdstippen bepalen.
