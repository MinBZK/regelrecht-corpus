  - number: '8'
    text: |-
      1 De artsen, niet bevoegd tot uitoefening der artsenijbereidkunst of die deze bevoegdheid niet mogen uitoefenen,
      tandartsen en verloskundigen mogen geneesmiddelen aan anderen dan de leden van hun gezin niet afleveren.

      2 Een arts, die tevens apotheker is, heeft, zolang hij de geneeskundige praktijk uitoefent, geen bevoegdheid tot
      uitoefening der artsenijbereidkunst, behoudens het bepaalde in de[ artikelen 6][ref1] en [10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel10
