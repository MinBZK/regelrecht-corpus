  - number: '28'
    text: |-
      1 Er is in elke provincie een commissie, Commissie voor gebiedsaanwijzing genaamd, welker leden en secretaris Wij
      benoemen en ontslaan en welker taak het is de beslissingen bedoeld in [artikel 6, vierde en vijfde lid][ref1],
      te nemen.

      2 De in het voorgaande lid genoemde commissies bestaan uit een voorzitter, die noch apotheker, noch arts is, een
      pharmaceutische en een geneeskundige inspecteur van de volksgezondheid en vier andere leden. Van de vier andere
      leden worden twee benoemd op voordracht van Onze Minister na de door hem aangewezen organisatie van apothekers en
      twee op voordracht van Onze Minister na de door hem aangewezen organisatie van artsen te hebben gehoord.

      3 Wij kunnen voor elk lid van de in het eerste lid bedoelde commissies een plaatsvervangend lid benoemen, dat
      slechts optreedt bij verhindering of ontstentenis van het lid, in wiens plaats het is aangewezen.

      4 Wij geven nadere voorschriften voor de samenstelling en de werkwijze van de in het eerste lid bedoelde
      commissies. Wij bepalen de vergoeding, welke door de leden en de secretaris terzake van hun werkzaamheden kan
      worden genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel6
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel28
    references:
