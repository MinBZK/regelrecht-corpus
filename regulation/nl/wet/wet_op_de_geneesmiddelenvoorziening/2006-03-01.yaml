        paragraaf: '1'
  - number: '29'
    text: |-
      1 Er is een College ter beoordeling van geneesmiddelen, waarvan Wij de leden en de secretaris benoemen en ontslaan
      en dat belast is met de registratie van farmaceutische specialités en farmaceutische preparaten, de schorsing en de
      doorhaling van die registratie, overeenkomstig de bij of krachtens deze wet gegeven voorschriften.

      2 Wij geven nadere voorschriften voor de samenstelling en de werkwijze van het College. Wij bepalen daarbij tevens
      de vergoeding, welke door de leden en door de secretaris terzake van hun werkzaamheden kan worden genoten.

      3 De leden en de secretaris van het College, zijn verplicht tot geheimhouding van hetgeen hun bij het verrichten
      van hun taak is bekend geworden omtrent de samenstelling of de bereiding van of de handel in farmaceutische
      specialités en farmaceutische preparaten. Deze verplichting geldt niet jegens de hoofdinspecteur en de inspecteurs.
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel29
  - number: '30'
    text: |-
      1 Er is een Keuringsraad, Keuringsraad voor de aanprijzing van geneesmiddelen genaamd, welks leden en secretaris
      Wij benoemen en ontslaan en welke belast is met de beoordeling van de aanprijzing van farmaceutische specialités
      volgens de bij of krachtens deze wet gegeven voorschriften. Wij benoemen de leden op voordracht van de door Onze
      Minister aangewezen organisaties en instellingen.

      2 In de Keuringsraad hebben in elk geval zitting vertegenwoordigers van één of meer organisaties van apothekers
      en artsen en van één of meer organisaties van fabrikanten, groothandelaren en kleinhandelaren in farmaceutische
      specialités, alsmede van één of meer organisaties, welke zich op het gebied der publiciteit bewegen.

      3 Wij geven nadere voorschriften voor de samenstelling en de werkwijze van de Raad. Wij bepalen daarbij tevens de
      vergoeding, welke door de leden en de secretaris terzake van hun werkzaamheden kan worden genoten.

      4 Van de beslissingen van de Raad staat voor belanghebbenden beroep open bij Onze Minister volgens bij algemene
      maatregel van bestuur te stellen regelen. Onze Minister beslist niet, dan nadat hij overleg heeft gepleegd met Onze
      Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0002290/2006-03-01#Artikel30
  - number: '31'
    text: |-
      1 Met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft hij, die:

      a. de in [artikel 2, eerste lid, onder ][ref1] bedoelde bevoegdheid overschrijdt;

      b. één der [artikelen 2g, tweede lid][ref2], [3, achtste lid][ref3], [4, derde lid][ref4], [8, eerste lid][ref5],
      [11, eerste lid][ref6], [12][ref7], [13][ref8], [14, eerste lid][ref9], [17][ref10], [19][ref11], [22][ref12],
      [23][ref13] of [34, derde lid][ref14], overtreedt;

      c. voorschriften, uitgevaardigd op grond van de[ artikelen 3, zevende lid][ref15], [3][ref16], [4][ref17],
      [5][ref18] of [26][ref19] overtreedt;

      d. geen gevolg geeft aan een aanwijzing, bedoeld in [artikel 25, tweede lid][ref20];

      e. niet voldoet aan de voorschriften, verbonden aan een vergunning of ontheffing krachtens deze wet verleend.

      2 De substanties en de voorwerpen, waarmede of met betrekking tot welke het feit is gepleegd, kunnen worden
      verbeurd verklaard, ongeacht of zij de veroordeelde toebehoren.

      3

      4 De bij dit artikel strafbaar gestelde feiten zijn overtredingen.


