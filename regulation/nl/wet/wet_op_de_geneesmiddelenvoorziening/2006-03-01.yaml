      1 Tot uitoefening der artsenijbereidkunst zijn bevoegd:

      a. apothekers;

      b. apotheekhoudende artsen, voor zoveel hun dat is toegestaan krachtens de[ artikelen 6][ref1] en [10][ref2];

      c. apothekers-assistenten, gedurende de uitoefening hunner werkzaamheden in een apotheek, mits onder toezicht van
      een apotheker of van een apotheekhoudend arts;

      d. in Nederland gevestigde personen, rechtspersonen daaronder begrepen, aan wie door Onze Minister vergunning is
      verleend, hetzij tot het bereiden van geneesmiddelen en het afleveren daarvan, hetzij uitsluitend tot het afleveren
      van geneesmiddelen. De vergunninghouder mag geneesmiddelen uitsluitend afleveren aan in Nederland gevestigde
      personen, rechtspersonen daaronder begrepen, die ingevolge deze wet geneesmiddelen mogen afleveren, alsmede aan
      ziekenhuizen en aan bij algemene maatregel van bestuur aangewezen categorieën van personen of instellingen met
      inachtneming van de bij of krachtens die maatregel gegeven voorschriften; hij mag niet over de toonbank verkopen
      noch open winkel houden. In het belang van de geneesmiddelenvoorziening kan een vergunning onder beperkingen
      worden verleend, kunnen aan de vergunning voorschriften worden verbonden en kunnen de aan een vergunning verbonden
      voorschriften worden gewijzigd. Onze Minister kan een vergunning weigeren, indien het belang van de volksgezondheid
      zulks vordert, en een vergunning intrekken, indien de vergunninghouder handelt in strijd met de bij of krachtens
      deze wet gegeven voorschriften, met de beperkingen waaronder de vergunning is verleend of met de aan de vergunning
      verbonden voorschriften;

      e. de in Nederland gevestigde personen, rechtspersonen daaronder begrepen, bedoeld in [artikel 2f][ref3], voor
      zover hun dat krachtens dat artikel is toegestaan.

      2 Het bepaalde in het eerste lid geldt onverminderd het bepaalde in [artikel 4][ref4].

      3 Aan personen, die niet bevoegd zijn tot uitoefening der artsenijbereidkunst, is het bereiden of het afleveren van
      geneesmiddelen verboden.

      4 Tot het bereiden en afleveren van geneesmiddelen voor onderzoek zijn bevoegd:

      a. de apothekers die staan ingeschreven in het register van gevestigde apothekers, en

      b. de in het eerste lid, onder d, eerste zin, bedoelde personen, rechtspersonen daaronder begrepen, die bevoegd
      zijn tot het bereiden en afleveren van geneesmiddelen,

      indien Onze Minister daartoe vergunning heeft verleend.

      5 Tot het uitsluitend afleveren van geneesmiddelen voor onderzoek zijn bevoegd de in het eerste lid, onder d,
      eerste zin, bedoelde personen, rechtspersonen daaronder begrepen, die bevoegd zijn tot het uitsluitend afleveren
      van geneesmiddelen die uit een andere staat dan een lidstaat van de Europese Unie zijn betrokken, indien Onze
      Minister daartoe vergunning heeft verleend.

      6 Het is verboden om zonder vergunning van Onze Minister geneesmiddelen voor onderzoek te bereiden of af te
      leveren.


