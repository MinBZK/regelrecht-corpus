preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het uit het oogpunt van kostenbeheersing en coördinatie wenselijk
    is om de taken die in de Wet educatie en beroepsonderwijs zijn toegekend aan kenniscentra beroepsonderwijs en
    bedrijfsleven toe te kennen aan een bij ministeriële regeling aan te wijzen organisatie; dat in verband hiermee de
    bepalingen over deze kenniscentra in voornoemde wet en enige andere wetten moeten worden geschrapt of aangepast;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036592/2022-08-01#ArtikelAanhef
articles:
  - number: V
    text: |-
      1 Onverminderd het derde, vierde en vijfde lid kan Onze Minister de eerste keer uitsluitend een rechtspersoon
      als bedoeld in [artikel 1.5.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref1] aanwijzen, indien
      de rechtspersoon een door Onze Minister goedgekeurde overeenkomst heeft gesloten met alle kenniscentra
      beroepsonderwijs bedrijfsleven waarin een regeling is opgenomen voor

      a. het overnemen van personeelsleden die zijn belast met wettelijke taken van kenniscentra door de in aanhef
      bedoelde rechtspersoon,

      b. de uitkeringen van gewezen personeelsleden die waren belast met wettelijke taken van kenniscentra en van
      personeelsleden die zijn belast met wettelijke taken van de kenniscentra en niet worden overgenomen door de in
      aanhef bedoelde rechtspersoon,

      c. de overdracht door de kenniscentra aan de in de aanhef bedoelde rechtspersoon van vermogensrechtelijke reserves
      die zijn opgebouwd met middelen uit ’s Rijks kas en

      d. de overige activa en de passiva van de kenniscentra, voor zover deze zijn toe te rekenen aan de wettelijke taken
      van de kenniscentra,

      2 Een overeenkomst als bedoeld in het eerste lid leidt ertoe dat het kenniscentrum beroepsonderwijs bedrijfsleven
      na de beëindiging van de bekostiging op grond van [artikel VI][ref2] geen financiële aanspraken op het Rijk meer
      heeft.

      3 Het kenniscentrum beroepsonderwijs bedrijfsleven en de rechtspersoon, bedoeld in het eerste lid, leggen voor
      1 juni 2015, of, indien dat later is, binnen 2 maanden na de inwerkingtreding van dit artikel een overeenkomst die
      voldoet aan de eisen, bedoeld in het eerste en tweede lid, ter goedkeuring voor aan Onze Minister.

      4 Indien een of meer overeenkomsten als bedoeld in het derde lid niet of niet tijdig ter goedkeuring aan Onze
      Minister worden voorgelegd, kan Onze Minister een rechtspersoon als bedoeld in het eerste lid aanwijzen in
      afwijking van de eis, dat met alle kenniscentra beroepsonderwijs bedrijfsleven een door Onze Minister goedgekeurde
      overeenkomst is gesloten die voldoet aan de eisen, bedoeld in het eerste en tweede lid.

      5 Spoedeisende gevallen uitgezonderd vindt de aanwijzing, bedoeld in het vierde lid, niet eerder plaats dan nadat
      de betrokken partijen in de gelegenheid zijn gesteld om binnen een door Onze Minister te stellen termijn alsnog een
      overeenkomst als bedoeld in het derde lid, ter goedkeuring voor te leggen aan Onze Minister.

      6 Het bestuur van een kenniscentrum beroepsonderwijs bedrijfsleven dat geen door Onze Minister goedgekeurde
      overeenkomst als bedoeld in het derde lid heeft gesloten, stort bij beëindiging van de bekostiging van het
      kenniscentrum de vermogensrechtelijke reserves die zijn opgebouwd met middelen uit ’s Rijks kas terug in ’s Rijks
      kas. Indien het desbetreffende kenniscentrum bij beëindiging van de bekostiging een negatieve reserve heeft, blijft
      dit voor rekening van het kenniscentrum.


