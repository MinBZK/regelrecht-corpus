  - number: VI
    text: |-
      1 De wettelijke taken en de aanspraak op bekostiging van de kenniscentra beroepsonderwijs bedrijfsleven, bedoeld in
      [artikel 1.5.1 van de Wet educatie en beroepsonderwijs][ref1] zoals luidend op 31 juli 2015, vervallen met ingang
      van de datum waarop [artikel I, met uitzondering van onderdeel B][ref2], en de [artikelen II][ref3], [III][ref4] en
      [IV][ref5] van deze wet in werking treden.

      2 Indien op de dag waarop [artikel I, met uitzondering van onderdeel B][ref6], en de [artikelen II][ref7],
      [III][ref8] en [IV][ref9] in werking treden nog geen rechtspersoon als bedoeld in artikel I, onderdeel B, is
      aangewezen, blijven tot een bij koninklijk besluit te bepalen datum

      a. de wettelijke taken en de aanspraak op bekostiging van de kenniscentra beroepsonderwijs bedrijfsleven van
      kracht, en

      b. de [artikelen 2.1.4][ref10], [2.1.5][ref11], [2.1.6][ref12], [2.4.1][ref13], [2.4.2][ref14],
      [2.4.3][ref15], [2.5.10][ref16], [4.3.1][ref17], [4.3.2][ref18], [4.3.3][ref19], [6.1.3, tweede lid][ref20],
      [7.2.4, tweede en derde lid][ref21], [7.2.5][ref22], [7.2.5a][ref23], [7.2.6, eerste lid][ref24],
      [7.2.9, tweede lid][ref25], [7.2.10][ref26], [11.1, eerste lid][ref27], [12.2.2, tweede lid][ref28], en
      [12.2.6 van de Wet educatie en beroepsonderwijs][ref29], de [artikelen 3, tweede lid][ref30], [15l][ref31],
      [15n, eerste en tweede lid][ref32], en [24f, tiende lid, van de Wet op het onderwijstoezicht][ref33],
      de [artikelen 10b3, eerste lid][ref34], [10b4][ref35] en [10b5 van de Wet voortgezet onderwijs][ref36]
      en punt 18 van onderdeel «Ministerie van Onderwijs, Cultuur en Wetenschap» van
      [bijlage 1 bij de Wet normering bezoldiging topfunctionarissen publieke en semi-publieke sector][ref37], zoals
      luidend op 31 juli 2015 van toepassing.

      3 Ten aanzien van bedragen waarop de kenniscentra beroepsonderwijs bedrijfsleven voorafgaand aan de in het eerste
      of tweede lid bedoelde datum aanspraak hebben, maar die nog niet zijn vastgesteld of uitbetaald, blijven de bij of
      krachtens de [Wet educatie en beroepsonderwijs][ref38] of de [Wet op het voortgezet onderwijs][ref39] vastgestelde
      voorschriften zoals luidend op de dag voorafgaand aan de in het eerste lid bedoelde datum van toepassing.


