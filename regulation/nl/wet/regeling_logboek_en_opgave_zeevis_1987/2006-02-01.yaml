  - number: '5'
    text: |-
      In de gevallen dat geen logboek, tevens vangstopgaveformulier, wordt ingediend dan wel in het logboek, tevens
      vangstopgaveformulier, bij een gevangen hoeveelheid van een vissoort geen vangstgebied is vermeld, wordt als
      vangstgebied van de aangelande hoeveelheden vis geregistreerd:

      a. voor makreel: deelgebieden VI, VII, VIII, XII en XIV

      b. voor alle andere soorten: gebied IV b.
    url: https://wetten.overheid.nl/BWBR0004217/2006-02-01#Artikel5
  - number: '6'
    text: |-
      De ondernemer is verplicht een kopie te bewaren van alle door of namens hem ingevulde logboeken, tevens
      vangstopgaveformulieren, gedurende een periode van drie jaar vanaf 1 januari van het jaar dat volgt op het jaar
      waarin een formulier is ingediend.
    url: https://wetten.overheid.nl/BWBR0004217/2006-02-01#Artikel6
  - number: '7'
    text: |-
      1 De Regeling bijhouden EEG-logboek en opgave zeevis (Stcrt. 1985, 64) wordt ingetrokken.

      2 Deze regeling treedt in werking met ingang van de dag na die van haar bekendmaking in de Nederlandse
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004217/2006-02-01#Artikel7
