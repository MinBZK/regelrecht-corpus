      1 Degene die met een vissersvaartuig de visserij uitoefent, vult dagelijks voor 24.00 uur en uiterlijk bij aankomst
      in een haven, alsmede bij controle op zee het logboekgedeelte van het originele exemplaar van het logboek-, tevens
      vangstopgaveformulier in.

      2 Degene die met een vissersvaartuig in een Nederlandse haven vis aanlandt, is verplicht:

      a. onverwijld maar uiterlijk een half uur na aanlanding en vóór de lossing de eerste kopie van het logboek-, tevens
      vangstopgaveformulier waarop de in het eerste lid bedoelde gegevens zijn ingevuld, in te dienen en

      b. terstond na verkoop maar uiterlijk binnen 48 uur na afloop van de lossing het volledig ingevulde originele
      exemplaar van het logboek-, tevens vangstopgaveformulier in te dienen.

      3 Het indienen van de exemplaren van het logboek-, tevens vangstopgaveformulier, bedoeld in het tweede lid, vindt
      plaats door het in de haven van aanlanding:

      a. te overhandigen aan een functionaris of aan een ambtenaar van de AID of

      b. te deponeren in een opgavebus als bedoeld in de Beschikking plaatsing opgavebussen.

      4 Indien de vis in een andere haven dan de haven van aanlanding wordt verkocht, is in afwijking van het tweede
      lid, onder b, en de aanhef van het derde lid, degene die met een vissersvaartuig vis in een Nederlandse haven
      heeft aangeland, verplicht terstond na verkoop maar uiterlijk binnen 48 uur na afloop van de lossing het volledig
      ingevulde originele exemplaar van het logboek-, tevens vangstopgaveformulier in de haven van verkoop in te dienen
      of te doen indienen door een daartoe door hem gemachtigde.

      5 De exemplaren van het logboek-, tevens vangstopgaveformulier, bedoeld in het tweede en vierde lid, dienen:

      a. volledig en naar waarheid te zijn ingevuld;

      b. betrekking te hebben op de periode sinds de vorige aanlanding, voor zover doorgebracht op zee;

      c. te zijn ondertekend door degene die met een vissersvaartuig in een Nederlandse haven vis aanlandt of, in de
      situatie, bedoeld in het vierde lid, diens gemachtigde en

      d. de vangsthoeveelheden per sector en uitgedrukt in kilogrammen te vermelden.

      6 Het eerste tot en met vijfde lid zijn van overeenkomstige toepassing op degene die:

      a. vis heeft overgeladen op een ander vaartuig;

      b. met zijn vissersvaartuig de visserij in span uitoefent en geen vis aanlandt.

      7 In afwijking van het tweede lid, onder b, en vierde lid is degene die met een buitenlands vissersvaartuig vis in
      een Nederlandse haven heeft aangeland, verplicht terstond na verkoop maar uiterlijk binnen 48 uur na afloop van de
      lossing een kopie van het volledig ingevulde logboek-, tevens vangstopgaveformulier in te dienen.

      8 Degene die met een buitenlands vissersvaartuig met een lengte over alles van meer dan 59 meter in een Nederlandse
      haven vis, afkomstig uit de wateren van een ander derde land dan Noorwegen of IJsland, aanlandt, is verplicht een
      kopie van het door dat derde land voorgeschreven logboek binnen 48 uur na afloop van de lossing in te dienen.

      9 Degene die met een vissersvaartuig vis aanlandt op een andere plaats dan de havens, bedoeld in artikel 2, eerste
      lid, van de Regeling stelselmatige controle bij aanlanding 1988, waar geen opgavebus is geplaatst, is verplicht het
      originele exemplaar van het logboek- tevens vangstopgaveformulier terstond na verkoop maar uiterlijk binnen 48 uur
      na lossing in te dienen door middel van toezending aan het dichtstbijzijnde havenkantoor van de AID dan wel aan het
      havenkantoor van de AID in de plaats waar de vis wordt verkocht.

      10 De verplichtingen, bedoeld in dit artikel, gelden niet voor buitenlandse vissersvaartuigen voor zover het
      betreft het vermelden van de vangsthoeveelheden in kilogrammen.
    url: https://wetten.overheid.nl/BWBR0004217/2006-02-01#Artikel2
  - number: 2a
    text: |-
      1 De kapitein van een vaartuig als bedoeld in artikel 2, tweede lid, van [verordening (EG) nr. 1093/94](31994R1093)
      van de Raad van de Europese Unie van 6 mei 1994 tot vaststelling van de voorwaarden waaronder vissersvaartuigen
      van derde landen vangsten rechtstreeks mogen aanlanden en verkopen in de havens van de Gemeenschap (PbEG L 121)
      dat de vlag voert van, of geregistreerd is, in een andere staat dan een Lid-Staat van de Europese Gemeenschap is
      verplicht:

      a. aan boord een logboek bij te houden waarin wordt vermeld:

      1º per vissoort de hoeveelheden die aan boord worden gehouden;

      2º de datum waarop de vangsten hebben plaatsgevonden en in welk deelgebied of welke sector;

      3º het gebruikte type vistuig.

      b. overeenkomstig [artikel 2, derde lid][ref1], binnen 48 uur na afloop van de lossing een aangifte in te dienen
      waarin per sector en per vissoort wordt vermeld:

      1º de datum en de plaats van de vangsten;

      2º de aangevoerde hoeveelheden;

      3º in geval van overlading letterteken, nummer en nationaliteit van het vaartuig waarmee de vis is gevangen en
      waarvan de vis is overgeladen;

      4º de wijze van verkoop.

      2 Onverminderd het eerste lid, is de kapitein van een in dat lid genoemd vaartuig verplicht het logboek bij te
      houden en gegevens aan de Commissie van de Europese Gemeenschappen mee te delen, overeenkomstig artikel 14, tweede
      en derde lid, van Verordening (EG) van de Raad van de Europese Unie van 19 december 1999 tot vaststelling, voor
      het jaar 2000, van vangstmogelijkheden die gelden voor bepaalde visbestanden en groepen visbestanden in de wateren
      van de Gemeenschap en, wat vaartuigen van de Gemeenschap betreft, in andere wateren met vangstbeperkingen, tot
      vaststelling voorts van de bij de visserij in acht te nemen voorschriften, en tot wijziging van [Verordening (EG)
      nr. 66/98](31998R0066).

      3 De aangifte, bedoeld in onderdeel b, van het eerste lid, wordt gesteld in de Nederlandse, Franse, Duitse of
      Engelse taal.


