  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:




                *ondernemer:*


                degene te wiens naam het vissersvaartuig in het visserijregister, bedoeld in
      [artikel 4 van het Besluit registratie vissersvaartuigen 1998][ref1], is geregistreerd;




                [Verordening (EEG) nr. 2807/83](31983R2807):

                [Verordening (EEG) nr. 2807/83](31983R2807) van de Commissie van de Europese Gemeenschappen van 22
      september 1983 houdende de uitvoeringsbepalingen inzake de registratie van gegevens over de visvangst van de Lid
      Staten (PbEG L276);




                *logboek-, tevens vangstopgaveformulier:*


                het in [verordening (EEG) nr. 2807/83](31983R2807) voorgeschreven formulier overeenkomstig het model dat
      als bijlage 1 bij de regeling is opgenomen;




                *deelgebied:*


                zeegebied als zodanig omschreven in [bijlage 1 van de Regeling vangstbeperking][ref2];




                *sector:*


                zeegebied als zodanig omschreven in [bijlage 1 van de Regeling vangstbeperking][ref3];



              AID:

                Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;



              functionaris:

                functionaris als bedoeld in [artikel 1 van de Regeling stelselmatige controle bij aanlanding 1988][ref4];



              buitenlands vissersvaartuig:

                vaartuig dat de vlag voert van en geregistreerd is in een andere lid-staat van de Europese Gemeenschap
      dan Nederland.




      2 Voor de toepassing van het bepaalde in deze regeling vindt het aanlanden plaats op het tijdstip waarop het
      vissersvaartuig direct of indirect verbinding met de wal heeft gekregen.

      3 Deze regeling is van toepassing op de vissoorten, bedoeld in bijlage I van [verordening (EEG) nr. 3880/91]
      (31991R3880) van de Raad van 17 december 1991 inzake de verstrekking van statistieken van de nominale vangsten
      van Lid-Staten die in het noordoostelijke gedeelte van de Atlantische Oceaan vissen (PbEG L 365), in bijlage I van
      [verordening (EEG) nr. 2018/93](31993R2018) van de Raad van 30 juni 1993 inzake de indiening van de vangsten en de
      visserijactiviteit van de Lid-Staten die in het noordwestelijk deel van de Atlantische Oceaan vissen (PbEG L 186)
      en in bijlage 4 van verordening (EEG) van de Raad van 23 oktober 1995 inzake de verstrekking van statistieken van
      de nominale vangsten van Lid-Staten in bepaalde gebieden buiten de Noordatlantische Oceaan (PbEG L 270).


