  - number: 4a
    text: |-
      1 Degene die de visserij uitoefent met een vissersvaartuig met een lengte over alles van meer dan 59 meter in
      de wateren van een derde land, met uitzondering van Noorwegen of IJsland, dat een ander logboek dan het logboek-
      tevens vangstopgaveformulier voorschrijft, is verplicht:

      a. bij het binnenvaren van de wateren van dat derde land:

      1e door middel van datatransmissie met behulp van de satellietvolgapparatuur als bedoeld in
      [artikel 10 van de Regeling technische maatregelen 2000][ref1] of door verzending van een faxbericht aan de
      meldkamer van de AID te Kerkrade (045 – 5461011) voorafgaand aan het binnenvaren van die wateren melding te maken
      van:

        - de lettertekens en het nummer van het vissersvaartuig;
        - de naam van de kapitein van het vissersvaartuig;
        - de geografische positie van het vissersvaartuig;
        - de wateren van welk derde land het vissersvaartuig gaat binnenvaren;
        - de datum en het tijdstip waarop het vissersvaartuig vermoedelijk die wateren zal binnenvaren en
        - de vangst aan boord, gespecificeerd naar soort; en

      2e het logboek- tevens vangstopgaveformulier volledig in te vullen overeenkomstig [artikel 4][ref2], waarbij
      wordt vermeld welke vangsten aan boord zijn en op welke datum en tijdstip de wateren van dat derde land zijn
      binnengevaren;

      b. tijdens de visreis in de wateren van het derde land het aldaar voorgeschreven logboek overeenkomstig de
      wetgeving van dat land bij te houden;

      c. in het geval van aanlanding van vis in een haven, binnen 48 uur na afloop van de lossing het roze exemplaar
      van het logboek- tevens vangstopgaveformulier, dat voldoet aan [artikel 2, vijfde lid][ref3], en een exemplaar van
      het in het derde land voorgeschreven logboek af te geven of toe te zenden aan de bevoegde instanties van het land
      van aanvoer;

      d. binnen 48 uur na afloop van lossing van vis in een haven het originele exemplaar van het logboek- tevens
      vangstopgaveformulier, dat voldoet aan [artikel 2, vijfde lid][ref4], en een exemplaar van het in het derde land
      voorgeschreven logboek toe te zenden aan de AID, Kerkrade, Postbus 234, Postcode 6460 AE;

      e. binnen 8 dagen na het tijdstip van aanlanding in een haven melding te maken van de aanlanding door middel
      van het inleveren van het blauwe exemplaar van het logboek- tevens vangstopgaveformulier, dat voldoet aan
      [artikel 2, vijfde lid][ref5], en een ingevuld exemplaar van het in het derde land voorgeschreven logboek te zenden
      aan de AID, Kerkrade, Postbus 234, Postcode 6460 AE;

      f. in geval van het verlaten van de wateren van het derde land:

      1e voor het verlaten van die wateren door middel van datatransmissie met behulp van de satellietvolgapparatuur als
      bedoeld in [artikel 10 van de Regeling technische maatregelen 2000][ref6] of door verzending van een faxbericht aan
      de meldkamer van de AID te Kerkrade (045 – 5461011) melding te maken van:

        - de roepletters van het vissersvaartuig;
        - de naam van de kapitein van het vissersvaartuig;
        - de geografische positie van het vissersvaartuig;
        - de wateren van welk derde land het vissersvaartuig gaat verlaten;
        - de datum en het tijdstip waarop het vissersvaartuig vermoedelijk die wateren zal verlaten en
        - de vangst aan boord, gespecificeerd naar soort; en

      2e het in het derde land voorgeschreven logboek volledig in te vullen, waarbij wordt vermeld welke vangsten aan
      boord zijn en op welke datum en tijdstip de wateren van dat derde land zijn verlaten.

      2 Het eerste lid is van toepassing op een vissersvaartuig met een lengte over alles van meer dan 24 meter dat in
      het gebied, bedoeld in artikel 2, onderdeel a, van [Verordening (EG) nr. 1936/2001](32001R1936) van de Raad van de
      Europese Unie van 27 september 2001 tot vaststelling van technische maatregelen voor de instandhouding van bepaalde
      over grote afstanden trekkende visbestanden (PbEU L 263), vist op soorten genoemd in bijlage I van die verordening.

      3 In afwijking van artikel 5, tweede lid, van [Verordening (EEG) nr. 2807/83](31983R2807) en in afwijking van
      [artikel 4, vijfde lid][ref7], vermeldt de kapitein van een in het tweede lid bedoeld vaartuig in het logboek alle
      vangsten van de soorten, genoemd in bijlage I en II van de in het tweede lid genoemde verordening, voor zover deze
      gevangen zijn in het gebied, bedoeld in artikel 2, onderdeel a, van die verordening.


