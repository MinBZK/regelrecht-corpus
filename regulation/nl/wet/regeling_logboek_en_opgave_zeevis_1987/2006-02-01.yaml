      1 Degene die met een vissersvaartuig de visserij uitoefent, is verplicht het logboek-, tevens
      vangstopgaveformulier, overeenkomstig het bepaalde inzake het invullen en opnemen van gegevens in [Verordening
      (EEG) nr. 2807/83](31983R2807) alsmede in [bijlage 3][ref1] bij te houden en in te vullen.

      2 In aanvulling op het eerste lid is degene die met een vissersvaartuig met een lengte over alles van minder dan 10
      meter de visserij uitoefent, verplicht alle vangsten van elke soort die aan boord worden gehouden in het logboek-,
      tevens vangstopgaveformulier te vermelden.

      3 Degene die met een vissersvaartuig een visreis maakt van meer dan 15 dagen is verplicht uiterlijk op de
      vijftiende dag en, voor zolang de visreis duurt, om de 15 dagen, op de wijze als bedoeld in bijlage VIII van
      [Verordening (EEG) nr. 2807/83](31983R2807), te melden aan de AID, Kerkrade, Postbus 234, 6460 AE, telefax (31)
      455461011:

      a. de vangsthoeveelheden in kilogrammen van elke in [bijlage 3][ref2] vermelde soorten, uitgezonderd haring die
      is gevangen in de deelgebieden I of II, die sinds het vertrek, onderscheidenlijk sinds de vorige melding, zijn
      gevangen en aan boord worden gehouden of zijn overgeladen, dan wel zijn aangevoerd buiten de Lid-Staten van de EG;

      b. het ICES- of NAFO-gebied waar de vangsten hebben plaatsgevonden, waarbij onderscheidenlijk de vangsten in
      de wateren van een ander land dan één van de Lid-Staten van de EG en die in de wateren die vallen buiten de
      souvereiniteit of jurisdictie van enige Staat, afzonderlijk worden opgegeven.

      4

      5 Degene die meer dan 50 kg van een bepaalde vissoort aanlandt, is verplicht deze hoeveelheid in te vullen op het
      vangstopgave-gedeelte van het logboek- tevens vangstopgaveformulier.

      6 Indien er meer dan 10 ton haring, makreel, horsmakreel of een combinatie daarvan aan boord wordt
      gehouden, komt de opgave in het logboekgedeelte van het logboek, tevens vangstopgaveformulier, van
      de hoeveelheden aan boord gehouden vis, overeen met de hoeveelheden die zijn opgegeven ingevolge
      [artikel 3, vijfde lid, onderdeel 9°, van de Regeling stelselmatige controle bij aanlanding 1988][ref3].

      7 In afwijking van artikel 5, tweede lid, van [Verordening (EEG) nr. 2807/83](31983R2807), geldt een
      tolerantiemarge van 8%, indien het betreft visreizen gemaakt door vissersvaartuigen in de geografische gebieden:

      a. bedoeld in onderdeel 1.5.1 van bijlage III van [Verordening (EG) nr. 51/2006](32006R0051) van de Raad van
      de Europese Unie van 22 december 2005 tot vaststelling, voor 2006, van de vangstmogelijkheden voor sommige
      visbestanden en groepen visbestanden welke in de wateren van de Gemeenschap en, voor vaartuigen van de Gemeenschap,
      in andere wateren met vangstbeperkingen van toepassing zijn, en tot vaststelling van de bij de visserij in acht
      te nemen voorschriften (PbEU L 16), voor zover meer dan 10 ton haring, makreel of horsmakreel aan boord wordt
      gehouden;

      b. bedoeld in artikel 2 van [verordening (EG) nr. 423/2004](32004R0423) van de Raad van 26 februari 2004 tot
      vaststelling van herstelmaatregelen voor bepaalde kabeljauwbestanden (PbEU L 70), en het vaartuigen betreft met een
      lengte over alles van ten minste 10 meter;

      c. bedoeld in artikel 1 van [Verordening (EG) nr. 811/2004](32004R0811) van de Raad van 21 april 2004 tot
      vaststelling van herstelmaatregelen voor het noordelijke heekbestand (PbEU L 150).


