preamble:
  text: |-
    Gelet op de artikelen 3 en 4 van het Reglement zee- en kustvisserij 1977 (Stb. 666);

    Na overleg met het Produktschap voor Vis en Visprodukten, het Visserijschap en het Bedrijfschap voor de Groothandel
    in Vis en Aanverwante Bedrijven;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004217/2006-02-01#ArtikelAanhef
