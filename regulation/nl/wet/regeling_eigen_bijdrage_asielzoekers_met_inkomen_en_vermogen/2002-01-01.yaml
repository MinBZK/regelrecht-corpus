  - number: '11'
    text: Deze regeling treedt in werking de tweede dag na dagtekening van de Staatscourant waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009876/2002-01-01#Artikel11
  - number: '12'
    text: Deze regeling wordt aangehaald als Regeling eigen bijdrage asielzoekers met inkomen en vermogen, afgekort als Reba.
    url: https://wetten.overheid.nl/BWBR0009876/2002-01-01#Artikel12
