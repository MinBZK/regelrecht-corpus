        artikel: '1'
        afdeling: I
  - number: '3'
    text: |-
      De tegemoetkoming bedoeld in [artikel 17, tweede lid, van de Rva 1997][ref1], is per maand gelijk aan de in
      aanmerking te nemen middelen van de alleenstaande of het gezin tot een maximum van de economische waarde van de
      verstrekkingen bedoeld in [artikel 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0009876#Artikel2
    url: https://wetten.overheid.nl/BWBR0009876/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0009876
        artikel: '2'
        afdeling: I
  - number: '4'
    text: |-
      1 Tot de middelen bedoeld in [artikel 3][ref1] worden gerekend alle vermogens- en inkomensbestandsdelen waarover de
      alleenstaande of het gezin beschikt of redelijkerwijs kan beschikken.

      2 Niet tot de middelen van de belanghebbende worden gerekend:

      a. kinderbijslag;

      b. vergoedingen en tegemoetkomingen voor verwervingskosten, alsmede de vermindering of teruggave van loonbelasting
      of inkomstenbelasting en van premies volksverzekeringen voor verwervingskosten die de in artikel 37 van de Wet op
      de inkomstenbelasting genoemde bedragen te boven gaan;

      c. rente ontvangen over op grond van [artikel 9, onder b, c, en d][ref2], niet in aanmerking genomen vermogen;

      d. een uitkering in verband met geleden immateriële schade voor zover dit, gelet op de aard en de hoogte van de
      uitkering, uit een oogpunt van het verlenen van verstrekkingen als bedoeld in [artikel 5 van de Rva 1997][ref3],
      verantwoord is;

      e. inkomsten uit of in verband met arbeid tot € 71,70 per maand, alsmede de helft van het meerdere tot een maximum
      van in totaal € 131,60 per maand.


      [ref1]: https://wetten.overheid.nl/BWBR0009876#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009876#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0009205#Artikel5
    url: https://wetten.overheid.nl/BWBR0009876/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009876
        artikel: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0009876
        artikel: '9'
        paragraaf: '3'
        afdeling: III
      - id: ref3
        bwb_id: BWBR0009205
        artikel: '5'
  - number: '5'
    text: |-
      Bij de vaststelling van de middelen worden giften van instellingen en personen niet in aanmerking genomen voor
      zover dit, gezien de bestemming en de hoogte van de giften, uit een oogpunt van het verlenen van verstrekkingen als
      bedoeld in [artikel 5 van de Rva 1997][ref1], verantwoord is.


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel5
    url: https://wetten.overheid.nl/BWBR0009876/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '5'
  - number: '6'
    text: |-
      De middelen worden in aanmerking genomen tot het bedrag dat resteert na aftrek van:

      a. de daarover door de belanghebbende verschuldigde loonbelasting of inkomstenbelasting;

      b. de daarover door de belanghebbende verschuldigde premies volksverzekeringen en ziekenfondspremie dan wel een
      inhouding die met een of meer van deze premies overeenkomt;

      c. ten laste van de belanghebbende komende verplichte bijdragen ingevolge een pensioenregeling en daarmee
      vergelijkbare regelingen; en

      d. andere ten laste van de belanghebbende komende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0009876/2002-01-01#Artikel6
  - number: '7'
    text: |-
      1 Onder inkomen wordt verstaan de op grond van [paragraaf 1][ref1] in aanmerking genomen middelen voor zover deze:

      a. betreffen inkomsten uit of in verband met arbeid, inkomsten uit vermogen, sociale zekerheidsuitkeringen,
      uitkeringen tot levensonderhoud op grond van [Boek 1 van het Burgerlijk Wetboek][ref2], teruggave van loonbelasting
      en premies volksverzekeringen, dan wel naar hun aard met deze inkomsten of uitkeringen overeenkomen;

      b. betrekking hebben op een periode waarover beroep op opvang wordt gedaan.

      2 Middelen die het karakter hebben van uitgesteld inkomen worden in aanmerking genomen naar de periode waarin deze
      zijn verworven. Middelen die het karakter hebben van doorbetaling van inkomen over een periode worden in aanmerking
      genomen naar de periode waarin deze te gelde kunnen worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0009876#AfdelingIII
      [ref2]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0009876/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009876
        paragraaf: '1'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0002656
  - number: '8'
    text: |-
      Onder het vermogen wordt verstaan:

      a. de waarde van de bezittingen waarover de alleenstaande of het gezin bij de aanvang van de opvang beschikt of
      redelijkerwijs kan beschikken, verminderd met de op dat tijdstip aanwezige schulden;

      b. de op grond van de in [paragraaf 1][ref1] in aanmerking genomen middelen die worden ontvangen tijdens de periode
      waarover beroep op opvang wordt gedaan, voor zover deze geen inkomen zijn als bedoeld in [artikel 7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009876#AfdelingIII
      [ref2]: https://wetten.overheid.nl/BWBR0009876#Artikel7
    url: https://wetten.overheid.nl/BWBR0009876/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009876
        paragraaf: '1'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0009876
        artikel: '7'
        paragraaf: '2'
        afdeling: III
  - number: '9'
    text: |-
      Niet als vermogen wordt in aanmerking genomen:

      a. bezittingen in natura die naar hun aard en waarde algemeen gebruikelijk zijn dan wel, gelet op de omstandigheden
      van persoon en gezin, noodzakelijk zijn;

      b. het bij de aanvang van de opvang aanwezige vermogen voor zover dit minder bedraagt dan de vermogensgrens als
      genoemd in [artikel 17, tweede lid, van de Rva 1997][ref1];

      c. vermogen ontvangen tijdens de periode waarover beroep op opvang wordt gedaan, tot het bedrag dat
      het bij de aanvang van de opvang aanwezige vermogen minder bedroeg dan de vermogensgrens, genoemd in
      [artikel 17, tweede lid, van de Rva 1997][ref2];

      d. spaargelden opgebouwd tijdens de periode waarin opvang wordt geboden;

      e. een uitkering in verband met geleden immateriële schade voor zover dit, gelet op de aard en de hoogte van de
      uitkering, vanuit een oogpunt van het verlenen van verstrekkingen als bedoeld in [artikel 5 van de Rva 1997][ref3],
      verantwoord is.


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0009205#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0009205#Artikel5
    url: https://wetten.overheid.nl/BWBR0009876/2002-01-01#Artikel9
