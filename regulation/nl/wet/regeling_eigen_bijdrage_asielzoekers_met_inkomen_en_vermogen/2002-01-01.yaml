preamble:
  text: |-
    gelet op artikel 12 van de Wet Centraal Orgaan opvang asielzoekers (Stb. 1994, 422);

    Overwegende:

    – dat er mede in verband met de mogelijkheid dat ten behoeve van een bepaalde categorie vreemdelingen aan wie
    met toepassing van de Regeling verstrekkingen asielzoekers en andere categorieën vreemdelingen 1997 (Rva 1997)
    opvang wordt geboden een tewerkstellingsvergunning wordt verleend, behoefte bestaat aan eenduidige regels voor de
    berekening van de eigen bijdrage in de kosten van de opvang;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009876/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Tot de aan de alleenstaande of het gezin feitelijk geboden verstrekkingen, bedoeld in
      [artikel 17, tweede lid, van de Rva 1997][ref1], worden gerekend:

      a. de aan of ten behoeve van de alleenstaande of het gezin verstrekte financiële toelage ten behoeve van voedsel,
      kleding en andere persoonlijke uitgaven en de in natura verstrekte maaltijden;

      b. het onderdak in een opvangcentrum of de financiële toelage ten behoeve van de huisvesting buiten een
      opvangcentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel17
    url: https://wetten.overheid.nl/BWBR0009876/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '17'
  - number: '2'
    text: |-
      De economische waarde per maand, bedoeld in [artikel 17, tweede lid, van de Rva 1997][ref1], bedraagt:

      a. van de verstrekkingen bedoeld in [artikel 1, onder a][ref2]: de toelage bedoeld in
      [artikel 11, tweede lid, van de Rva 1997][ref3], die aan of ten behoeve van de alleenstaande of het gezin wordt of
      zou worden verstrekt voor het volledig zelf verzorgen van maaltijden, vermenigvuldigd met de factor 4,33;

      b. van de verstrekkingen bedoeld in [artikel 1, onder b][ref4]: f 100,- voor een alleenstaande of eerste gezinslid,
      f 50,-, voor het tweede gezinslid en f 25,- per volgend gezinslid, vermenigvuldigd met de factor 4,33, tot een
      maximum van € 393,43.


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0009876#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0009205#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0009876#Artikel1
    url: https://wetten.overheid.nl/BWBR0009876/2002-01-01#Artikel2
