      Deze wet treedt in werking met ingang van 1 januari 2013. Indien het Staatsblad waarin deze wet wordt geplaatst,
      wordt uitgegeven na 31 december 2012, treedt deze wet in werking op de dag na de datum van uitgifte van het
      Staatsblad waarin zij wordt geplaatst en is zij voor het eerst van toepassing op het kalenderjaar, volgend op die
