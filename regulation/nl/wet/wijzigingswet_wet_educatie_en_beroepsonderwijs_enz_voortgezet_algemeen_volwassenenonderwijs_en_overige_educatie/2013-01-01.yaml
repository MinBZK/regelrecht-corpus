preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met een voldoende aanbod van voortgezet algemeen
    volwassenenonderwijs en een adequaat aanbod van de overige educatie wenselijk is om het voortgezet algemeen
    volwassenenonderwijs rechtstreeks uit ’s Rijks kas te bekostigen en de overige educatie te richten op Nederlandse
    taal en rekenen; dat daartoe onder meer de Wet educatie en beroepsonderwijs dient te worden gewijzigd;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0032074/2013-01-01#ArtikelAanhef
articles:
  - number: VI
    text: |-
      1 In afwijking van het bepaalde bij en krachtens de [artikelen 2.2a.1][ref1] en
      [2.2a.2 van de Wet educatie en beroepsonderwijs][ref2] wordt de rijksbijdrage voor het voortgezet algemeen
      volwassenenonderwijs waarop de in [artikel 1.3.1][ref3] bedoelde aanspraak betrekking heeft, voor de twee jaren,
      volgend op de inwerkingtreding van deze wet, per instelling binnen het raam van de door de begrotingswetgever
      beschikbaar gestelde middelen berekend op grond van de formule:

      { (bi1 + bi2) : (bl1 + bl2) } x bl

      waarbij

      bi1: instellingsbudget voortgezet algemeen volwassenenonderwijs in het jaar 2010,

      bi2: instellingsbudget voorgezet algemeen volwassenenonderwijs in het jaar 2011,

      bl1: landelijk budget voortgezet algemeen volwassenenonderwijs in het jaar 2010,

      bl2: landelijk budget voorgezet algemeen volwassenenonderwijs in het jaar 2011,

      bl: landelijk budget voorgezet algemeen volwassenenonderwijs in het jaar waarvoor de bekostiging geldt.

      2 De in het eerste lid bedoelde instellingsbudgetten worden vastgesteld bij ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2.2a.1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2.2a.2
