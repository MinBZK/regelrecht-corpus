  - number: VIa
    text: |-
      Een opleiding educatie als bedoeld in
      [artikel 7.3.1, eerste lid, onder b of f, van de Wet educatie en beroepsonderwijs][ref1] zoals luidend op de dag
      voor de inwerkingtreding van deze wet, wordt in het jaar waarin deze wet in werking treedt voor de toepassing
      van de [Wet educatie en beroepsonderwijs][ref2], de [Wet participatiebudget][ref3] en de op die wetten gebaseerde
      regelgeving gelijkgesteld met een opleiding als bedoeld in artikel 7.3.1, eerste lid, onder b, van de Wet educatie
      en beroepsonderwijs zoals luidend na de inwerkingtreding van deze wet, voor zover de deelnemers met de opleiding
      zijn gestart voor de inwerkingtreding van deze wet.


