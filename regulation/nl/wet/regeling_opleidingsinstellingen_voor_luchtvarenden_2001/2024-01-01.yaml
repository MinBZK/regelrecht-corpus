  - number: '2'
    text: |-
      De aanvraag tot registratie, erkenning of goedkeuring dan wel hernieuwde afgifte van een registratie, erkenning of
      goedkeuring wordt gedaan op een daartoe door de minister verstrekt aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel2
  - number: '3'
    text: |-
      1 De minister registreert op aanvraag een opleidingsinstelling voor de opleiding RPL(A)MLA, RPL(H)MLH, RPL(GC),
      RPA-L of de module RT indien de aanvrager voldoet aan de eisen, bedoeld in [artikel 10][ref1].

      2 De minister erkent een opleidingsinstelling met betrekking tot het aanbieden en afnemen van de test ten behoeve
      van de taalvaardigheidsaantekening indien de aanvrager voldoet aan de eis, bedoeld in [artikel 11a][ref2].

      3 De minister keurt overeenkomstig artikel ARA.CC.200, onderdeel a, van bijlage VI van verordening (EU)
      nr. 1178/2011, een opleidingsorganisatie goed voor het verzorgen van de basisopleiding van cabinebemanningsleden,
      bedoeld in artikel CC.TRA.220, onderdelen a en b, van bijlage V van verordening (EU) nr. 1178/ 2011, indien de
      aanvrager voldoet aan de eisen bedoeld in hoofdstuk 1 van [bijlage 5][ref3]. Het goedkeuringsbesluit bevat mede het
      opleidingsprogramma en de syllabus van de opleidingsorganisatie.

      4 De minister kan een goedgekeurde opleidingsinstelling, als bedoeld in het derde lid, overeenkomstig artikel
      ARA.CC.200, onderdeel b, van bijlage VI van verordening (EU) nr. 1178/2011, mandaat verlenen om namens hem attesten
      voor cabinebemanningsleden af te geven indien die opleidingsinstelling:

      a. voldoet aan de eisen, bedoeld in hoofdstuk 2 van [bijlage 5][ref4], en

      b. gedocumenteerde procedures heeft ingevoerd voor de examinering en het afgeven van attesten overeenkomstig
      de artikelen CC.TRA.220, onderdeel c, van bijlage V en ARA.CC.200, onderdeel b, onder 2, van bijlage VI van
      verordening (EU) nr. 1178/2011.

      5 Een opleidingsinstelling die overeenkomstig het vierde lid gemandateerd is om namens de minister attesten af te
      geven stelt daartoe ook namens de minister de examenuitslagen van cabinebemanningsleden vast en registreert namens
      de minister de afgegeven attesten.

      6 De minister kan een geregistreerde opleidingsinstelling erkennen als erkende entiteit voor de onbemande
      luchtvaart indien wordt voldaan aan de voorwaarden als bedoeld in Aanhangsel 3 en Aanhangsel 6, van de Bijlage bij
      uitvoeringsverordening (EU) nr. 2019/947.

      7 Op de door de Minister aangewezen entiteiten, zoals bedoeld in
      [artikel 13, vierde lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref5], zijn de voorwaarden
      van toepassing zoals opgenomen in [bijlage 6][ref6] bij deze regeling.

      8 Een aanwijzing als aangewezen entiteit voor de onbemande luchtvaart, wordt verleend voor een termijn van twaalf
      maanden. De aanwijzing kan door de minister worden verlengd.

      9 De Minister erkent op aanvraag een opleidingsinstelling voor de opleiding voor typebevoegdverklaring en voor
      de opleiding voor instructeursbevoegdheid voor een luchtvaartuig als bedoeld in bijlage I behorende bij de
      basisverordening indien de aanvrager voldoet aan de eisen bedoeld in deel ORA, subdeel GEN en subdeel ATO, van
      [verordening (EU) nr. 1178/2011](32011R1178).


      [ref1]: https://wetten.overheid.nl/BWBR0012923#Artikel10
