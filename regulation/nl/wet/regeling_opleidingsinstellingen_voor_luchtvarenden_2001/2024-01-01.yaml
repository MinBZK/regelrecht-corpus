  - number: '1.2'
    text: 'In deze regeling wordt met de volgende toevoegingen bedoeld:'
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel1
  - number: 1.2.a
    text: '**A**: de categorie vliegtuigen (Aircraft);'
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel1
  - number: 1.2.b
    text: '**GC**: de categorie gyrokopters (Gyrocopters);'
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel1
  - number: 1.2.c
    text: '**H**: de categorie helikopters (Helicopters).'
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust mede op [artikel 1.5 van de Wet luchtvaart][ref1] en op
      [artikel 13, vijfde lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010629#Artikel13
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0010629
        artikel: '13'
  - number: '2'
    text: |-
      De aanvraag tot registratie, erkenning of goedkeuring dan wel hernieuwde afgifte van een registratie, erkenning of
      goedkeuring wordt gedaan op een daartoe door de minister verstrekt aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel2
  - number: '3.1'
    text: |-
      De minister registreert op aanvraag een opleidingsinstelling voor de opleiding RPL(A)MLA, RPL(H)MLH, RPL(GC), RPA-L
      of de module RT indien de aanvrager voldoet aan de eisen, bedoeld in [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012923#Artikel10
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012923
        artikel: '10'
        hoofdstuk: '3'
  - number: '3.2'
    text: |-
      De minister erkent een opleidingsinstelling met betrekking tot het aanbieden en afnemen van de test ten behoeve van
      de taalvaardigheidsaantekening indien de aanvrager voldoet aan de eis, bedoeld in [artikel 11a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012923#Artikel11a
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012923
        artikel: 11a
        hoofdstuk: '3'
  - number: '3.3'
    text: |-
      De minister keurt overeenkomstig artikel ARA.CC.200, onderdeel a, van bijlage VI van verordening (EU)
      nr. 1178/2011, een opleidingsorganisatie goed voor het verzorgen van de basisopleiding van cabinebemanningsleden,
      bedoeld in artikel CC.TRA.220, onderdelen a en b, van bijlage V van verordening (EU) nr. 1178/ 2011, indien de
      aanvrager voldoet aan de eisen bedoeld in hoofdstuk 1 van [bijlage 5][ref1]. Het goedkeuringsbesluit bevat mede het
      opleidingsprogramma en de syllabus van de opleidingsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0012923
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012923
  - number: '3.4'
    text: |-
      De minister kan een goedgekeurde opleidingsinstelling, als bedoeld in het derde lid, overeenkomstig artikel
      ARA.CC.200, onderdeel b, van bijlage VI van verordening (EU) nr. 1178/2011, mandaat verlenen om namens hem attesten
      voor cabinebemanningsleden af te geven indien die opleidingsinstelling:
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel3
  - number: 3.4.a
    text: |-
      voldoet aan de eisen, bedoeld in hoofdstuk 2 van [bijlage 5][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0012923
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012923
  - number: 3.4.b
    text: |-
      gedocumenteerde procedures heeft ingevoerd voor de examinering en het afgeven van attesten overeenkomstig
      de artikelen CC.TRA.220, onderdeel c, van bijlage V en ARA.CC.200, onderdeel b, onder 2, van bijlage VI van
      verordening (EU) nr. 1178/2011.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel3
  - number: '3.5'
    text: |-
      Een opleidingsinstelling die overeenkomstig het vierde lid gemandateerd is om namens de minister attesten af te
      geven stelt daartoe ook namens de minister de examenuitslagen van cabinebemanningsleden vast en registreert namens
      de minister de afgegeven attesten.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel3
  - number: '3.6'
    text: |-
      De minister kan een geregistreerde opleidingsinstelling erkennen als erkende entiteit voor de onbemande
      luchtvaart indien wordt voldaan aan de voorwaarden als bedoeld in Aanhangsel 3 en Aanhangsel 6, van de Bijlage bij
      uitvoeringsverordening (EU) nr. 2019/947.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel3
  - number: '3.7'
    text: |-
      Op de door de Minister aangewezen entiteiten, zoals bedoeld in
      [artikel 13, vierde lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref1], zijn de voorwaarden
      van toepassing zoals opgenomen in [bijlage 6][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0012923
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0012923
  - number: '3.8'
    text: |-
      Een aanwijzing als aangewezen entiteit voor de onbemande luchtvaart, wordt verleend voor een termijn van twaalf
      maanden. De aanwijzing kan door de minister worden verlengd.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel3
  - number: '3.9'
    text: |-
      De Minister erkent op aanvraag een opleidingsinstelling voor de opleiding voor typebevoegdverklaring en voor
      de opleiding voor instructeursbevoegdheid voor een luchtvaartuig als bedoeld in bijlage I behorende bij de
      basisverordening indien de aanvrager voldoet aan de eisen bedoeld in deel ORA, subdeel GEN en subdeel ATO, van
      [verordening (EU) nr. 1178/2011](32011R1178).
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel3
  - number: '4'
    text: 'De aanvraag tot registratie of goedkeuring gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.a
    text: 'voor de registratie van een opleidingsinstelling voor RPL(A)MLA of RPL(H)MLH of RPL(GC):'
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.a.1°
    text: het trainingshandboek dat wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.a.2°
    text: |-
      verklaring waarin de aanvrager aangeeft dat de aangeleverde informatie juist is en dat de training zal worden
      uitgevoerd in overeenstemming met deze regeling;
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.b
    text: 'indien de registratie van een opleidingsinstelling enkel betrekking heeft op de module RT:'
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.b.1°
    text: overzicht en curriculum vitae van het bij de opleiding betrokken onderwijzend personeel;
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.b.2°
    text: beschrijving van de accommodatie en theorie-instructievoorzieningen;
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.b.3°
    text: bewijs van beschikbaarheid van simulatieapparatuur en instructeurs;
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.b.4°
    text: exemplaar van de syllabus die wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.b.5°
    text: |-
      verklaring waarin de aanvrager aangeeft dat de aangeleverde informatie juist is en dat de training zal worden
      uitgevoerd in overeenstemming met deze regeling;
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.c
    text: 'voor de registratie van een opleidingsinstelling voor RPA L:'
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.c.1°
    text: naam of model van het trainingshandboek en het examenhandboek dat wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.c.2°
    text: kopie van het intern trainingsprogramma voor zowel theoriedocenten als vlieginstructeurs;
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.c.3°
    text: beschrijving van de accommodatie en theorie-instructievoorziening;
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.c.4°
    text: overzicht en curriculum vitae van het bij de opleiding betrokken leidinggevend en onderwijzend personeel; en
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.c.5°
    text: |-
      verklaring waarin de aanvrager aangeeft dat de aangeleverde informatie juist is en dat de training zal worden
      uitgevoerd in overeenstemming met deze regeling,
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.d
    text: 'voor de goedkeuring van een opleidingsinstelling voor de basisopleiding van cabinebemanningsleden:'
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.d.1°
    text: de datum van aanvang van de opleiding;
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.d.2°
    text: overzicht en curriculum vitae van het bij de opleiding betrokken leidinggevend personeel en onderwijzend personeel;
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.d.3°
    text: naam en adres van de plaatsen waar de opleiding zal plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.d.4°
    text: |-
      een beschrijving van de faciliteiten, opleidingsmethoden, handboeken en representatieve toestellen die gebruikt
      zullen worden; en
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: 4.d.5°
    text: de syllabi en bijbehorende programma’s voor de opleiding.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: '5.1'
    text: De geldigheidsduur van een eerste registratie is ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel5
  - number: '5.2'
    text: |-
      De geldigheidsduur van een eerste erkenning met betrekking tot het aanbieden en afnemen van de test ten behoeve van
      de taalvaardigheidsaantekening is ten minste 6 maanden.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel5
  - number: '5.3'
    text: |-
      In afwijking van het eerste lid wordt een registratie voor onbepaalde tijd verleend, indien de registratie enkel
      betrekking heeft op de module RT, of als de houder van de registratie een DTO dan wel een ATO is.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel5
  - number: '5.4'
    text: De registratie van een opleidinginstelling voor RPA-L kan met terugwerkende kracht worden verleend.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel5
  - number: '5.5'
    text: |-
      In afwijking van het eerste lid is de registratie van een opleidinginstelling voor RPA-L die met terugwerkende
      kracht is verleend geldig tot een jaar na de datum van deze registratie.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel5
  - number: '5.6'
    text: |-
      De goedkeuring van een opleidingsinstelling voor het verzorgen van de basisopleiding van cabinebemanningsleden
      alsmede de machtiging, bedoeld in [artikel 3, derde en vierde lid][ref1], gelden voor onbepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0012923#Artikel3
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012923
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '5.7'
    text: |-
      In afwijking van het eerste lid is voor een opleidingsinstelling voor de opleiding voor de typebevoegdverklaring en
      voor de instructeursbevoegdheid voor een luchtvaartuig als bedoeld in bijlage I behorende bij de basisverordening,
      ORA.GEN.135 in deel ORA, subdeel GEN van [verordening (EU) nr. 1178/2011](32011R1178) van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel5
  - number: '6.1'
    text: |-
      De minister registreert op aanvraag een opleidingsinstelling opnieuw voor ten hoogste twee jaar indien de aanvrager
      voldoet aan de eisen bedoeld in [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012923#Artikel10
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012923
        artikel: '10'
        hoofdstuk: '3'
  - number: '6.2'
    text: |-
      De minister verlengt op aanvraag de erkenning van een erkende taalbeoordelingsinstantie indien de aanvrager voldoet
      aan de eis, bedoeld in [artikel 11a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012923#Artikel11a
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012923
        artikel: 11a
        hoofdstuk: '3'
  - number: '6.3'
    text: |-
      De minister registreert op aanvraag een opleidingsinstelling voor RPA-L opnieuw voor de termijn van twee jaar,
      indien de aanvrager voldoet aan de eisen, bedoeld in [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012923#Artikel10
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012923
        artikel: '10'
        hoofdstuk: '3'
  - number: '7'
    text: |-
      De aanvraag tot opnieuw registreren van een opleidingsinstelling gaat vergezeld van die gegevens en bescheiden,
      genoemd in [artikel 4][ref1], ten aanzien waarvan wijzigingen hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0012923#Artikel4
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012923
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '8'
    text: |-
      Een goedgekeurde opleidingsinstelling, geregistreerde opleidingsinstelling of erkende taalbeoordelingsinstantie
      stelt de minister terstond op de hoogte van wijzigingen met betrekking tot bij de aanvraag tot goedkeuring,
      registratie of erkenning aan de minister geleverde informatie.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel8
  - number: '9.1'
    text: |-
      Wijzigingen in door geregistreerde opleidingsinstellingen aangeboden opleidingen kunnen op aanvraag tussentijds
      onder de al bestaande registratie worden gebracht indien de minister met deze wijzigingen instemt.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel9
  - number: '9.2'
    text: Het eerste lid is van overeenkomstige toepassing op erkende taalbeoordelingsinstanties.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel9
  - number: '9.3'
    text: |-
      Met betrekking tot het eerste lid zijn de [artikelen 3][ref1] en [4][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012923#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012923#Artikel4
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012923
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0012923
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '10.1'
    text: 'Voor registratie van een opleidingsinstelling dient de aanvrager aan de volgende eisen te voldoen:'
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel10
  - number: 10.1.a
    text: |-
      wat betreft de opleidingsinstelling: de eisen, bedoeld in [bijlage 1][ref1] bij deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0012923
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012923
  - number: 10.1.b
    text: |-
      wat betreft de aangeboden opleidingen: 1°. voor SE-SPA CR de eisen, bedoeld in Deel FCL.725; 2°. voor RPL de
      eisen, bedoeld in [bijlage 2][ref1] bij deze regeling; 3°. voor RFI de eisen, bedoeld in [bijlage 3][ref2] bij
      deze regeling; 4°. voor de module RT de eisen, bedoeld in [bijlage 4][ref3] bij deze regeling; 5°. voor RPA-L,
      de eis dat de opleidingsinstelling zorg draagt voor correct, volledig en passend lesmateriaal ten behoeve van een
      theorie- en praktijkopleiding en voor een procedure die waarborgt dat de examens op correcte en passende wijze
      worden afgenomen door examinatoren die niet de theorie- en praktijkopleiding hebben verzorgd van de kandidaat die
      de examens aflegt.


      [ref1]: https://wetten.overheid.nl/BWBR0012923
      [ref2]: https://wetten.overheid.nl/BWBR0012923
      [ref3]: https://wetten.overheid.nl/BWBR0012923
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012923
      - id: ref2
        bwb_id: BWBR0012923
      - id: ref3
        bwb_id: BWBR0012923
  - number: '10.2'
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing op de registratie van een opleidingsinstelling met betrekking
      tot de module RT.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel10
  - number: '10.3'
    text: Een DTO of ATO wordt geacht te voldoen aan de eisen bedoeld in het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel10
  - number: 11a
    text: |-
      Voor de erkenning van een opleidingsinstelling met betrekking tot het aanbieden en afnemen van de test ten behoeve
      van de taalvaardigheidsaantekening, dient de aanvrager te beschikken over een test waarmee de taalvaardigheid,
      bedoeld in FCL.055 van verordening (EU) nr. 1178/2011, kan worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel11a
  - number: 11b.1
    text: |-
      De in [artikel 3, vierde lid][ref1], bedoelde opleidingsinstelling hanteert voor de afgifte respectievelijk
      de registratie van attesten voor cabinebemanningsleden procedures overeenkomstig de artikelen ARA.GEN.315
      respectievelijk ARA.GEN.220 van bijlage VI van verordening (EU) nr. 1178/2011.


      [ref1]: https://wetten.overheid.nl/BWBR0012923#Artikel3
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0012923
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 11b.2
    text: |-
      De in het eerste lid bedoelde opleidingsinstelling verstrekt de bevoegde autoriteit de informatie en documentatie
      over de afgegeven attesten en de houders van deze attesten, voor zover de bevoegde autoriteit die nodig heeft om
      zijn gegevensbeheer-, toezichts- en handhavingstaken uit te voeren.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel11b
  - number: '12'
    text: |-
      Een bewijs van registratie, onderscheidenlijk, een registratie, afgegeven op basis van [artikel 3][ref1] van de
      Regeling opleidingsinstellingen voor luchtvarenden, worden een bewijs van registratie, onderscheidenlijk, een
      registratie op basis van de Regeling opleidingsinstellingen voor luchtvarenden 2001.


      [ref1]: https://wetten.overheid.nl/BWBR0012923#Artikel3
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012923
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '13'
    text: |-
      De bijlagen bij deze regeling, met uitzondering van de [bijlagen 2][ref1], [4][ref2] en [5][ref3], liggen ter
      inzage bij het Ministerie van Infrastructuur en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0012923
      [ref2]: https://wetten.overheid.nl/BWBR0012923
      [ref3]: https://wetten.overheid.nl/BWBR0012923
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012923
      - id: ref2
        bwb_id: BWBR0012923
      - id: ref3
        bwb_id: BWBR0012923
  - number: '14'
    text: De Regeling opleidingsinstellingen voor luchtvarenden wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel14
  - number: '15'
    text: Deze regeling treedt in werking met ingang van 1 november 2001 en werkt terug tot en met 1 oktober 2001.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel15
  - number: '16'
    text: |-
      Deze regeling wordt aangehaald als: Regeling opleidingsinstellingen voor luchtvarenden 2001. Deze regeling zal met
      de toelichting in de Staatscourant worden geplaatst met uitzondering van de bijlagen, die ter inzage worden gelegd
      bij het Ministerie van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel16
