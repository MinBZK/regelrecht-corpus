  - number: '6'
    text: |-
      1 De minister registreert op aanvraag een opleidingsinstelling opnieuw voor ten hoogste twee jaar indien de
      aanvrager voldoet aan de eisen bedoeld in [artikel 10][ref1].

      2 De minister verlengt op aanvraag de erkenning van een erkende taalbeoordelingsinstantie indien de aanvrager
      voldoet aan de eis, bedoeld in [artikel 11a][ref2].

      3 De minister registreert op aanvraag een opleidingsinstelling voor RPA-L opnieuw voor de termijn van twee jaar,
      indien de aanvrager voldoet aan de eisen, bedoeld in [artikel 10][ref3].


