  - number: '10'
    text: |-
      1 Voor registratie van een opleidingsinstelling dient de aanvrager aan de volgende eisen te voldoen:

      a. wat betreft de opleidingsinstelling: de eisen, bedoeld in [bijlage 1][ref1] bij deze regeling;

      b. wat betreft de aangeboden opleidingen:

      1°. voor SE-SPA CR de eisen, bedoeld in Deel FCL.725;

      2°. voor RPL de eisen, bedoeld in [bijlage 2][ref2] bij deze regeling;

      3°. voor RFI de eisen, bedoeld in [bijlage 3][ref3] bij deze regeling;

      4°. voor de module RT de eisen, bedoeld in [bijlage 4][ref4] bij deze regeling;

      5°. voor RPA-L, de eis dat de opleidingsinstelling zorg draagt voor correct, volledig en passend lesmateriaal ten
      behoeve van een theorie- en praktijkopleiding en voor een procedure die waarborgt dat de examens op correcte en
      passende wijze worden afgenomen door examinatoren die niet de theorie- en praktijkopleiding hebben verzorgd van de
      kandidaat die de examens aflegt.

      2 Het eerste lid, onderdeel a, is niet van toepassing op de registratie van een opleidingsinstelling met betrekking
      tot de module RT.

      3 Een DTO of ATO wordt geacht te voldoen aan de eisen bedoeld in het eerste lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0012923
      [ref2]: https://wetten.overheid.nl/BWBR0012923
