preamble:
  text: |-
    Gelet op artikel 13, eerste lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - *aangewezen entiteit voor de onbemande luchtvaart:* een aangewezen entiteit, als bedoeld in
      [artikel 13, vierde lid, Besluit bewijzen van bevoegdheid][ref1];
        - *ATO:* erkende opleidingsorganisatie (approved training organisation) als bedoeld in verordening (EU) 1178/2011;
        - *attest voor cabinebemanningsleden:* document als bedoeld in subdeel CCA van bijlage V van verordening (EU)
      nr. 1178/2011, waaruit blijkt dat een bemanningslid met goed gevolg het examen heeft afgelegd na voltooiing van de
      basisopleiding voor cabinebemanningslid;
        - *bevoegde autoriteit:* instantie als bedoeld in artikel CC.GEN.001 van bijlage V van verordening (EU)
      nr. 1178/2011;
        - *DTO:* verklaarde opleidingsorganisatie (declared training organisation) als bedoeld in verordening (EU)
      1178/2011;
        - *erkende entiteit voor de onbemande luchtvaart:* een erkende entiteit, als bedoeld in UAS.STS-01.20 en UAS.STS-
      02.20, Hoofdstuk 1 en Hoofdstuk 2, Aanhangsel 1, van de Bijlage bij uitvoeringsverordening (EU) nr. 2019/947;
        - *erkende taalbeoordelingsinstantie:* door de minister met betrekking tot het aanbieden en afnemen van de test ten
      behoeve van de taalvaardigheidsaantekening erkende opleidingsinstelling;
        - *geregistreerde opleidingsinstelling:* een door de minster geregistreerde opleidingsinstelling voor het geven van
      training voor het verkrijgen van bepaalde bewijzen van bevoegdheid en bevoegdverklaringen;
        - *goedgekeurde opleidingsinstelling:* door de minister goedgekeurde opleidingsorganisatie voor het verzorgen van
      de basisopleiding van cabinebemanningsleden;
        - *gyrokopter:* gyrokopter als bedoeld in [artikel 1 van het Besluit luchtvaartuigen 2008][ref2];
        - *minister:* Minister van Infrastructuur en Waterstaat;
        - *MLA (Micro Light Aeroplane):* vliegtuig als bedoeld in het [Besluit luchtvaartuigen 2008][ref3];
        - *uitvoeringsverordening (EU) nr. 2019/947:* Uitvoeringsverordening (EU) nr. 2019/947 van de Commissie van 24 mei
      2019 inzake de regels en procedures voor de exploitatie van onbemande luchtvaartuigen (PbEU 20139, L 152).

      2 In deze regeling wordt met de volgende toevoegingen bedoeld:

      a. **A**: de categorie vliegtuigen (Aircraft);

      b. **GC**: de categorie gyrokopters (Gyrocopters);

      c. **H**: de categorie helikopters (Helicopters).


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0023922#Artikel1
