  - number: '4'
    text: |-
      De aanvraag tot registratie of goedkeuring gaat vergezeld van:

      a. voor de registratie van een opleidingsinstelling voor RPL(A)MLA of RPL(H)MLH of RPL(GC):

      1°. het trainingshandboek dat wordt gebruikt;

      2°. verklaring waarin de aanvrager aangeeft dat de aangeleverde informatie juist is en dat de training zal worden
      uitgevoerd in overeenstemming met deze regeling;

      b. indien de registratie van een opleidingsinstelling enkel betrekking heeft op de module RT:

      1°. overzicht en curriculum vitae van het bij de opleiding betrokken onderwijzend personeel;

      2°. beschrijving van de accommodatie en theorie-instructievoorzieningen;

      3°. bewijs van beschikbaarheid van simulatieapparatuur en instructeurs;

      4°. exemplaar van de syllabus die wordt gebruikt;

      5°. verklaring waarin de aanvrager aangeeft dat de aangeleverde informatie juist is en dat de training zal worden
      uitgevoerd in overeenstemming met deze regeling;

      c. voor de registratie van een opleidingsinstelling voor RPA L:

      1°. naam of model van het trainingshandboek en het examenhandboek dat wordt gebruikt;

      2°. kopie van het intern trainingsprogramma voor zowel theoriedocenten als vlieginstructeurs;

      3°. beschrijving van de accommodatie en theorie-instructievoorziening;

      4°. overzicht en curriculum vitae van het bij de opleiding betrokken leidinggevend en onderwijzend personeel; en

      5°. verklaring waarin de aanvrager aangeeft dat de aangeleverde informatie juist is en dat de training zal worden
      uitgevoerd in overeenstemming met deze regeling,

      d. voor de goedkeuring van een opleidingsinstelling voor de basisopleiding van cabinebemanningsleden:

      1°. de datum van aanvang van de opleiding;

      2°. overzicht en curriculum vitae van het bij de opleiding betrokken leidinggevend personeel en onderwijzend
      personeel;

      3°. naam en adres van de plaatsen waar de opleiding zal plaatsvinden;

      4°. een beschrijving van de faciliteiten, opleidingsmethoden, handboeken en representatieve toestellen die gebruikt
      zullen worden; en

      5°. de syllabi en bijbehorende programma’s voor de opleiding.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel4
  - number: '5'
    text: |-
      1 De geldigheidsduur van een eerste registratie is ten hoogste een jaar.

      2 De geldigheidsduur van een eerste erkenning met betrekking tot het aanbieden en afnemen van de test ten behoeve
      van de taalvaardigheidsaantekening is ten minste 6 maanden.

      3 In afwijking van het eerste lid wordt een registratie voor onbepaalde tijd verleend, indien de registratie enkel
      betrekking heeft op de module RT, of als de houder van de registratie een DTO dan wel een ATO is.

      4 De registratie van een opleidinginstelling voor RPA-L kan met terugwerkende kracht worden verleend.

      5 In afwijking van het eerste lid is de registratie van een opleidinginstelling voor RPA-L die met terugwerkende
      kracht is verleend geldig tot een jaar na de datum van deze registratie.

      6 De goedkeuring van een opleidingsinstelling voor het verzorgen van de basisopleiding van cabinebemanningsleden
      alsmede de machtiging, bedoeld in [artikel 3, derde en vierde lid][ref1], gelden voor onbepaalde tijd.

      7 In afwijking van het eerste lid is voor een opleidingsinstelling voor de opleiding voor de typebevoegdverklaring
      en voor de instructeursbevoegdheid voor een luchtvaartuig als bedoeld in bijlage I behorende bij de
      basisverordening, ORA.GEN.135 in deel ORA, subdeel GEN van [verordening (EU) nr. 1178/2011](32011R1178) van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012923#Artikel3
