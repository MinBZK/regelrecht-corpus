  - number: 11a
    text: |-
      Voor de erkenning van een opleidingsinstelling met betrekking tot het aanbieden en afnemen van de test ten behoeve
      van de taalvaardigheidsaantekening, dient de aanvrager te beschikken over een test waarmee de taalvaardigheid,
      bedoeld in FCL.055 van verordening (EU) nr. 1178/2011, kan worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel11a
  - number: 11b
    text: |-
      1 De in [artikel 3, vierde lid][ref1], bedoelde opleidingsinstelling hanteert voor de afgifte respectievelijk
      de registratie van attesten voor cabinebemanningsleden procedures overeenkomstig de artikelen ARA.GEN.315
      respectievelijk ARA.GEN.220 van bijlage VI van verordening (EU) nr. 1178/2011.

      2 De in het eerste lid bedoelde opleidingsinstelling verstrekt de bevoegde autoriteit de informatie en documentatie
      over de afgegeven attesten en de houders van deze attesten, voor zover de bevoegde autoriteit die nodig heeft om
      zijn gegevensbeheer-, toezichts- en handhavingstaken uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0012923#Artikel3
    url: https://wetten.overheid.nl/BWBR0012923/2024-01-01#Artikel11b
