  - number: '12'
    text: |-
      Een bewijs van registratie, onderscheidenlijk, een registratie, afgegeven op basis van [artikel 3][ref1] van de
      Regeling opleidingsinstellingen voor luchtvarenden, worden een bewijs van registratie, onderscheidenlijk, een
      registratie op basis van de Regeling opleidingsinstellingen voor luchtvarenden 2001.


      [ref1]: https://wetten.overheid.nl/BWBR0012923#Artikel3
