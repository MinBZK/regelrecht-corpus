preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is doelstellingen voor Nederland te formuleren voor het
    terugdringen van de Nederlandse emissies van broeikasgassen en een wettelijk kader te scheppen voor het ontwikkelen
    van beleid hiervoor ter invulling van de eigenstandige verantwoordelijkheid die Nederland heeft om de mondiale
    stijging van temperatuur en de verandering van het klimaat te beperken, en dat het wenselijk is de bindende
    verplichtingen die Nederland met de op 12 december 2015 te Parijs tot stand gekomen Overeenkomst van Parijs is
    aangegaan in te vullen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder: - *aandeel hernieuwbare energie:* aandeel hernieuwbare energie, berekend in
      overeenstemming met de artikelen 5 tot en met 11 van de Richtlijn hernieuwbare energie, in het brutoeindverbruik
      van energie;
        - *broeikasgassen:* gassen genoemd in bijlage V, deel 2, van de Verordening governance van de Energie-unie;
        - *CO2-neutrale elektriciteitsproductie:* elektriciteitsproductie waarbij geen broeikasgassen vrijkomen in de
      atmosfeer of waarbij biomassa als brandstof gebruikt wordt;
        - *Europese klimaatwet:* [Verordening (EU) 2021/1119](32021R1119) van het Europees Parlement en de Raad van
      30 juni 2021 tot vaststelling van een kader voor de verwezenlijking van klimaatneutraliteit, en tot wijziging van
      [Verordening (EG) nr. 401/2009](32009R0401) en [Verordening (EU) 2018/1999](32018R1999) (Pb EU 2021, L 243);
        - *hernieuwbare energie:* energie uit hernieuwbare bronnen als bedoeld in artikel 2, onderdeel a, van de Richtlijn
      hernieuwbare energie;
        - *Onze Minister:* Onze Minister van Klimaat en Groene Groei;
        - *Richtlijn hernieuwbare energie:* [Richtlijn 2009/28/EG](32009L0028) van het Europees Parlement en de Raad
      van 23 april 2009 ter bevordering van het gebruik van energie uit hernieuwbare bronnen en houdende wijziging en
      intrekking van [Richtlijn 2001/77/EG](32001L0077) en [Richtlijn 2003/30/EG](32003L0030) (PbEU 2009, L 140)
        - *verordening governance van de energie-unie:* [Verordening (EU) 2018/1999](32018R1999) van het Europees Parlement
      en de Raad van 11 december 2018 inzake de governance van de energie-unie en van de klimaatactie, tot wijziging van
      [Richtlijn 94/22/EG](31994L0022), [Richtlijn 98/70/EG](31998L0070), [Richtlijn 2009/31/EG](32009L0031), Verordening
      (EG) nr. 663/2009, Verordening (EG) nr. 715/2009, [Richtlijn 2009/73/EG](32009L0073), [Richtlijn 2009/119/EG]
      (32009L0119) van de Raad, [Richtlijn 2010/31](32010L0031)/EU, [Richtlijn 2012/27](32012L0027)/EU, [Richtlijn
      2013/30](32013L0030)/EU en [Richtlijn (EU) 2015/652](32015L0652) van de Raad, en tot intrekking van Verordening
      (EU) nr. 525/2013 (PbEU 2018, L328);
        - *Wetenschappelijke Klimaatraad:* de Wetenschappelijke Klimaatraad, bedoeld in [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042394#Artikel8
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0042394
        artikel: '8'
        hoofdstuk: '4'
  - number: '2.1'
    text: |-
      Deze wet biedt een kader voor de ontwikkeling van beleid gericht op het onomkeerbaar en stapsgewijs terugdringen
      van de emissies van broeikasgassen in Nederland teneinde wereldwijde opwarming van de aarde en de verandering van
      het klimaat te beperken, waarbij Nederland overeenkomstig artikel 2, eerste lid, van de Europese klimaatwet:
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel2
  - number: 2.1.a
    text: de netto-uitstoot van broeikasgassen uiterlijk in 2050 tot nul reduceert, en
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel2
  - number: 2.1.b
    text: streeft naar negatieve emissies van broeikasgassen na 2050.
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel2
  - number: '2.2'
    text: |-
      Teneinde deze doelstelling voor 2050 te bereiken streven Onze Ministers die het aangaat naar een reductie
      van de emissies van broeikasgassen van 55% ten opzichte van 1990 in 2030 en een volledige CO-neutrale
      elektriciteitsproductie in 2050. Zij treffen daarnaast passende maatregelen opdat Nederland voldoet aan de
      reductieverplichtingen op grond van artikel 4, eerste lid, van de Europese klimaatwet en de ter uitwerking daarvan
      vastgestelde bindende EU-rechtshandelingen.
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel2
  - number: '2.3'
    text: |-
      Voor de toepassing van deze wet geldt als de emissies van broeikasgassen de emissies binnen Nederland
      van broeikasgassen afkomstig van sectoren en bronnen en de verwijdering per put die in de nationale
      broeikasgasinventarissen overeenkomstig artikel 4, eerste lid, onder a, van het Raamverdrag van de Verenigde Naties
      inzake Klimaatverandering (Trb. 1992, 189) zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het klimaatplan bevat de hoofdzaken van het door Onze Ministers die het aangaat te voeren klimaatbeleid gericht op
      het realiseren van de doelstellingen, bedoeld in [artikel 2][ref1], voor de eerstvolgende tien jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0042394#Artikel2
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0042394
        artikel: '2'
        hoofdstuk: '1'
  - number: '3.2'
    text: 'Het klimaatplan bevat tevens:'
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel3
  - number: 3.2.a
    text: |-
      de maatregelen die worden getroffen zodat de doelstellingen, bedoeld in [artikel 2][ref1], worden bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0042394#Artikel2
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0042394
        artikel: '2'
        hoofdstuk: '1'
  - number: 3.2.b
    text: het verwachte aandeel hernieuwbare energie en de verwachte besparing op het primaire energiegebruik;
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel3
  - number: 3.2.c
    text: |-
      de maatregelen die worden getroffen om het aandeel hernieuwbare energie en de besparing op het primaire
      energiegebruik te stimuleren;
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel3
  - number: 3.2.d
    text: een beschouwing over de meest recente wetenschappelijke inzichten omtrent het beperken van klimaatverandering;
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel3
  - number: 3.2.e
    text: |-
      een beschouwing van de ontwikkeling in de technologische mogelijkheden om de emissies van broeikasgassen te
      beperken en de daarmee samenhangende inzet van Onze Ministers op innovatie;
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel3
  - number: 3.2.f
    text: |-
      een beschouwing van de wereldwijde en Europese ontwikkelingen op het gebied van de beperking van klimaatverandering
      voor zover deze relevant zijn voor het Nederlandse beleid, en
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel3
  - number: 3.2.g
    text: |-
      een beschouwing van de gevolgen die het te voeren klimaatbeleid van de regering heeft op de financiële positie
      van huishoudens, bedrijven en overheden, de werkgelegenheid inclusief scholing en opleiding van werknemers,
      de ontwikkeling van de economie, het tot stand komen van een eerlijke en betaalbare transitie en voor de
      betrouwbaarheid van de energievoorziening.
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel3
  - number: '4.1'
    text: |-
      Het klimaatplan wordt voor de eerste maal vastgesteld in 2019 en ten minste eens in de vijf jaren opnieuw
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel4
  - number: '4.2'
    text: Het eerste klimaatplan heeft betrekking op de periode van 2021 tot en met 2030.
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister stelt in overeenstemming met het gevoelen van de ministerraad en nadat het is overgelegd aan beide
      kamers der Staten-Generaal, het klimaatplan vast.
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel5
  - number: '5.2'
    text: |-
      Op de voorbereiding van het klimaatplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.
      Zienswijzen kunnen naar voren worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '5.3'
    text: De Afdeling advisering van de Raad van State wordt over het klimaatplan gehoord.
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel5
  - number: '5.4'
    text: |-
      Onze Minister kan, in overeenstemming met het gevoelen van de ministerraad en gehoord beide kamers der Staten-
      Generaal, het klimaatplan wijzigen indien dit naar zijn oordeel noodzakelijk is om de doelstellingen, bedoeld in
      [artikel 2][ref1], te realiseren. Het tweede en derde lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0042394#Artikel2
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0042394
        artikel: '2'
        hoofdstuk: '1'
  - number: '6.1'
    text: |-
      Het Planbureau voor de Leefomgeving brengt eenmaal per jaar aan Onze Minister een klimaat- en energieverkenning
      uit.
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel6
  - number: '6.2'
    text: |-
      De klimaat- en energieverkenning is een wetenschappelijke rapport over de gevolgen van het gevoerde klimaatbeleid
      in het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel6
  - number: '6.3'
    text: 'De klimaat- en energieverkenning bevat in ieder geval voor het voorafgaande kalenderjaar:'
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel6
  - number: 6.3.a
    text: de emissies van broeikasgassen;
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel6
  - number: 6.3.b
    text: de emissies van broeikasgassen per sector, en
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel6
  - number: 6.3.c
    text: de ontwikkelingen en maatregelen die invloed hebben gehad op de emissies van broeikasgassen.
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister zendt de klimaat- en energieverkenning op de derde dinsdag van september aan beide kamers der Staten-
      Generaal.
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister zendt gelijktijdig met de verzending van de klimaat- en energieverkenning de klimaatnota aan beide
      kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel7
  - number: '7.3'
    text: 'De klimaatnota bevat:'
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel7
  - number: 7.3.a
    text: het totaalbeeld van de realisatie van het klimaatbeleid zoals dit is opgenomen in het klimaatplan;
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel7
  - number: 7.3.b
    text: een weergave per Ministerie van de voornaamste aspecten van de realisatie van het klimaatbeleid;
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel7
  - number: 7.3.c
    text: een weergave van de gevolgen voor de departementale begrotingen van het klimaatbeleid;
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel7
  - number: 7.3.d
    text: |-
      de financiële gevolgen voor huishoudens, ondernemingen en overheden van significante ontwikkelingen in het
      klimaatbeleid die afwijken van het klimaatplan; en
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel7
  - number: 7.3.e
    text: |-
      de wijze waarop de klimaat- en energieverkenning wordt betrokken bij de eerstvolgende herziening of de evaluatie
      van de voortgang van het klimaatplan.
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel7
  - number: '7.4'
    text: De Afdeling advisering van de Raad van State wordt over de klimaatnota gehoord.
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel7
  - number: '8.1'
    text: Er is een Wetenschappelijke Klimaatraad.
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel8
  - number: '8.2'
    text: De Wetenschappelijke Klimaatraad bestaat uit een voorzitter en ten hoogste negen andere leden.
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel8
  - number: '8.3'
    text: |-
      De Wetenschappelijke Klimaatraad heeft tot taak de regering en beide kamers der Staten-Generaal te adviseren
      over het te voeren klimaatbeleid. De Wetenschappelijke Klimaatraad brengt daarbij ten minste een advies uit ter
      voorbereiding van het klimaatplan, bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042394#Artikel3
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0042394
        artikel: '3'
        hoofdstuk: '2'
  - number: '9.1'
    text: |-
      Ten behoeve van de uitvoering van deze wet en het behalen van de doelstellingen, bedoeld in [artikel 2][ref1],
      voert Onze Minister overleg met bestuursorganen van provincies, waterschappen, gemeenten en overige relevante
      partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0042394#Artikel2
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0042394
        artikel: '2'
        hoofdstuk: '1'
  - number: '9.2'
    text: |-
      In het overleg worden in ieder geval de voortgang van de uitvoering van het vigerende klimaatplan en voorstellen
      voor maatregelen voor het in voorbereiding zijnde klimaatplan besproken.
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel9
  - number: '9.3'
    text: |-
      Onze Minister bevordert door middel van het overleg het sluiten van overeenkomsten met partijen, gericht op het
      bereiken van de doelstellingen, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042394#Artikel2
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0042394
        artikel: '2'
        hoofdstuk: '1'
  - number: '10'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel10
  - number: '11'
    text: 'Deze wet wordt aangehaald als: Klimaatwet.'
    url: https://wetten.overheid.nl/BWBR0042394/2026-01-01#Artikel11
