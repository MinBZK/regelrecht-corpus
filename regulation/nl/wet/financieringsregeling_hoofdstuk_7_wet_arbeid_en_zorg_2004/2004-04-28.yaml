  - number: '5'
    text: |-
      1 Uiterlijk op 1 juni dient het UWV de afrekening over het afgelopen kalenderjaar bij de Minister in.

      2 In de afrekening wordt, op basis van de jaarrekening, bedoeld in [artikel 49 van de Wet SUWI][ref1], de
      kasstroom inzichtelijk gemaakt voor de totale uitgaven voor de financiële tegemoetkomingen.

      3 Indien de afrekening, bedoeld in het eerste lid, daartoe aanleiding geeft, vindt voor 15 juli een betaling plaats
      ten gunste of ten laste van het AWF.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel5
