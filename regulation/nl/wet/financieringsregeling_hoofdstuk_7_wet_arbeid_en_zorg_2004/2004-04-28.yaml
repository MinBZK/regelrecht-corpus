preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Financiën;

    Gelet op artikel 53 van de Wet structuur uitvoeringsorganisatie werk en inkomen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Minister: de Minister van Sociale Zaken en Werkgelegenheid;

      b. UWV: Uitvoeringsinstituut werknemersverzekeringen;

      c. WW: [Werkloosheidswet][ref1];

      d. AWF: Algemeen Werkloosheidsfonds, genoemd in [artikel 103 van de Werkloosheidswet][ref2];

      e. uitgaven financiële tegemoetkomingen: de financiële tegemoetkomingen, bedoeld in
      [artikel 7:6 van de Wet arbeid en zorg][ref3] aan de verlofganger en de daaraan verbonden uitvoeringskosten, die
      op grond van [artikel 93, onderdeel i, van de WW][ref4] ten laste komen van het AWF, en de op grond van enige wet
      over die tegemoetkoming verschuldigde premies die niet daarop in mindering kunnen worden gebracht;**

      f. WWB: [Wet werk en bijstand][ref5];

      g. IOAW: [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref6];

      h. IOAZ: [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref7];

      i. WAJONG: [Wet arbeidsongeschiktheidsheidsvoorziening jonggehandicapten][ref8];

      j. WAO: [Wet op de arbeidsongeschiktheidsheidsverzekering][ref9];

      k. WAZ: [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref10];

      l. ANW: [Algemene nabestaandenwet][ref11];

      m. Wet SUWI: [Wet structuur uitvoeringsorganisatie werk en inkomen][ref12].


