  - number: '2.1'
    text: |-
      De Rijksbijdrage, bedoeld in [artikel 92, onderdeel g, van de WW][ref1], dient ter financiering van de
      uitgaven voor de financiële tegemoetkomingen, voorzover deze samenhangen met tegemoetkomingen met betrekking
      tot verlofgangers die worden vervangen door een persoon, die recht op uitkering heeft op grond van de
      [WWB][ref2], de [IOAW][ref3], de [IOAZ][ref4], of de [WAJONG][ref5] dan wel door een persoon die geen recht
      heeft op enige uitkering alsmede ter financiering van de uitvoeringskosten verbonden aan de overige financiële
      tegemoetkomingen, bedoeld in [artikel 7:6 van de Wet arbeid en zorg][ref6] aan de verlofganger, die op grond van
      [artikel 93, onderdeel i, van de WW][ref7] ten laste komen van het AWF.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0015703
      [ref3]: https://wetten.overheid.nl/BWBR0004044
      [ref4]: https://wetten.overheid.nl/BWBR0004163
      [ref5]: https://wetten.overheid.nl/BWBR0008657
      [ref6]: https://wetten.overheid.nl/BWBR0013008#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0004045#Artikel93
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '92'
      - id: ref2
        bwb_id: BWBR0015703
      - id: ref3
        bwb_id: BWBR0004044
      - id: ref4
        bwb_id: BWBR0004163
      - id: ref5
        bwb_id: BWBR0008657
      - id: ref6
        bwb_id: BWBR0013008
        artikel: '7'
      - id: ref7
        bwb_id: BWBR0004045
        artikel: '93'
  - number: '2.2'
    text: |-
      Indien een verlofganger wordt vervangen door een vervanger bij wie sprake is van samenloop van uitkeringen als
      bedoeld in het eerste lid en een uitkering op grond van de [WW][ref1], [WAZ][ref2], [WAO][ref3] of [ANW][ref4],
      wordt de gehele tegemoetkoming gefinancierd uit de rijksbijdrage, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0007795
  - number: '2.3'
    text: |-
      Indien een verlofganger wordt vervangen door meer dan één vervanger waarbij zowel een vervanger is betrokken
      zonder uitkering of met een uitkering als bedoeld in het eerste lid, als een vervanger met een uitkering op grond
      van de [WW][ref1], [WAZ][ref2], [WAO][ref3] of [ANW][ref4] wordt de gehele tegemoetkoming gefinancierd uit de
      rijksbijdrage, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0007795
  - number: '3.1'
    text: 'Op de zesde dag van februari, mei, augustus en november verstrekt het UWV aan de Minister:'
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel3
  - number: 3.1.a
    text: een raming van de uitgaven voor de financiële tegemoetkomingen in het lopende kalenderkwartaal; en
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel3
  - number: 3.1.b
    text: |-
      een opgave van de gerealiseerde uitgaven voor de financiële tegemoetkomingen in het laatst verstreken
      kalenderkwartaal;
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel3
  - number: '3.2'
    text: |-
      Indien de dag, bedoeld in het eerste lid, een zaterdag, zondag of algemeen erkende feestdag is, vindt de
      verstrekking plaats op de eerstvolgende dag die niet een zaterdag, zondag of algemeen erkende feestdag is.
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel3
  - number: '3.3'
    text: |-
      In de raming, bedoeld in het eerste lid, onderdeel a, worden, overeenkomstig de bij deze regeling behorende
      [bijlage 1][ref1], vermeld: de totaalbedragen aan geraamde uitgaven voor financiële tegemoetkomingen, waarbij
      zowel de uitgaven die door middel van een rijksbijdrage worden gefinancierd als de uitgaven die anders dan door
      middel van een rijksbijdrage worden gefinancierd worden weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0016619
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016619
  - number: '3.4'
    text: |-
      In de opgave van de gerealiseerde uitgaven, bedoeld in het eerste lid, onderdeel b, worden overeenkomstig de
      bij deze regeling behorende [bijlage 2][ref1], vermeld: de totaalbedragen aan gerealiseerde uitgaven voor de
      financiële tegemoetkomingen, waarbij zowel de uitgaven die door middel van een rijksbijdrage worden gefinancierd
      als de uitgaven die anders dan door middel van een rijksbijdrage worden gefinancierd worden weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0016619
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016619
  - number: '4.1'
    text: |-
      Met als valutadag de elfde dag van februari, mei, augustus en november stort de Minister het bedrag van de geraamde
      uitgaven voor de financiële tegemoetkomingen en de uitvoeringskosten, bedoeld in [artikel 2, eerste lid][ref1], in
      dat kalenderkwartaal op de rekening-courant ten name van het UWV bij de Minister van Financiën. De Minister kan, na
      overleg met het UWV, van het geraamde bedrag afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0016619#Artikel2
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016619
        artikel: '2'
  - number: '4.2'
    text: |-
      Met als valutadag de elfde dag van februari, mei, augustus en november verrekent de Minister het verschil tussen
      de gerealiseerde en de geraamde uitgaven voor de financiële tegemoetkomingen en de uitvoeringskosten, bedoeld in
      [artikel 2, eerste lid][ref1], van het laatst verstreken kalenderkwartaal, met het bedrag, bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0016619#Artikel2
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016619
        artikel: '2'
  - number: '4.3'
    text: |-
      Indien de dag, bedoeld in het eerste en tweede lid, een zaterdag, zondag of algemeen erkende feestdag is, vindt de
      afdracht plaats met als valutadag de eerstvolgende dag die niet een zaterdag, zondag of algemeen erkende feestdag
      is.
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel4
  - number: '5.1'
    text: Uiterlijk op 1 juni dient het UWV de afrekening over het afgelopen kalenderjaar bij de Minister in.
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel5
  - number: '5.2'
    text: |-
      In de afrekening wordt, op basis van de jaarrekening, bedoeld in [artikel 49 van de Wet SUWI][ref1], de kasstroom
      inzichtelijk gemaakt voor de totale uitgaven voor de financiële tegemoetkomingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
  - number: '5.3'
    text: |-
      Indien de afrekening, bedoeld in het eerste lid, daartoe aanleiding geeft, vindt voor 15 juli een betaling plaats
      ten gunste of ten laste van het AWF.
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel5
  - number: '6'
    text: |-
      De Minister stelt jaarlijks vóór 31 oktober de Rijksbijdrage, bedoeld in [artikel 2][ref1], over het afgelopen
      kalenderjaar vast.


      [ref1]: https://wetten.overheid.nl/BWBR0016619#Artikel2
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016619
        artikel: '2'
  - number: '7'
    text: |-
      De [Financieringsregeling hoofdstuk 7 Wet arbeid en zorg][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009877
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009877
  - number: '8.1'
    text: |-
      Deze regeling treedt in werking met ingang met ingang van de tweede dag na de dagtekening van de Staatscourant
      waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel8
  - number: '8.2'
    text: |-
      [Artikel 3][ref1] en [4][ref2] worden voor de eerste maal toegepast over het tweede kwartaal van 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0016619#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0016619#Artikel4
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0016619
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0016619
        artikel: '4'
  - number: '9'
    text: 'Deze regeling wordt aangehaald als: Financieringsregeling hoofdstuk 7 Wet arbeid en zorg 2004.'
    url: https://wetten.overheid.nl/BWBR0016619/2004-04-28#Artikel9
