  - number: '3'
    text: |-
      1 Op de zesde dag van februari, mei, augustus en november verstrekt het UWV aan de Minister:

      a. een raming van de uitgaven voor de financiële tegemoetkomingen in het lopende kalenderkwartaal; en

      b. een opgave van de gerealiseerde uitgaven voor de financiële tegemoetkomingen in het laatst verstreken
      kalenderkwartaal;

      2 Indien de dag, bedoeld in het eerste lid, een zaterdag, zondag of algemeen erkende feestdag is, vindt de
      verstrekking plaats op de eerstvolgende dag die niet een zaterdag, zondag of algemeen erkende feestdag is.

      3 In de raming, bedoeld in het eerste lid, onderdeel a, worden, overeenkomstig de bij deze regeling behorende
      [bijlage 1][ref1], vermeld: de totaalbedragen aan geraamde uitgaven voor financiële tegemoetkomingen, waarbij
      zowel de uitgaven die door middel van een rijksbijdrage worden gefinancierd als de uitgaven die anders dan door
      middel van een rijksbijdrage worden gefinancierd worden weergegeven.

      4 In de opgave van de gerealiseerde uitgaven, bedoeld in het eerste lid, onderdeel b, worden overeenkomstig de
      bij deze regeling behorende [bijlage 2][ref2], vermeld: de totaalbedragen aan gerealiseerde uitgaven voor de
      financiële tegemoetkomingen, waarbij zowel de uitgaven die door middel van een rijksbijdrage worden gefinancierd
      als de uitgaven die anders dan door middel van een rijksbijdrage worden gefinancierd worden weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0016619
      [ref2]: https://wetten.overheid.nl/BWBR0016619
