  - number: '4'
    text: |-
      1 Met als valutadag de elfde dag van februari, mei, augustus en november stort de Minister het bedrag
      van de geraamde uitgaven voor de financiële tegemoetkomingen en de uitvoeringskosten, bedoeld in
      [artikel 2, eerste lid][ref1], in dat kalenderkwartaal op de rekening-courant ten name van het UWV bij de Minister
      van Financiën. De Minister kan, na overleg met het UWV, van het geraamde bedrag afwijken.

      2 Met als valutadag de elfde dag van februari, mei, augustus en november verrekent de Minister het verschil tussen
      de gerealiseerde en de geraamde uitgaven voor de financiële tegemoetkomingen en de uitvoeringskosten, bedoeld in
      [artikel 2, eerste lid][ref2], van het laatst verstreken kalenderkwartaal, met het bedrag, bedoeld in het eerste
      lid.

      3 Indien de dag, bedoeld in het eerste en tweede lid, een zaterdag, zondag of algemeen erkende feestdag is,
      vindt de afdracht plaats met als valutadag de eerstvolgende dag die niet een zaterdag, zondag of algemeen erkende
      feestdag is.


      [ref1]: https://wetten.overheid.nl/BWBR0016619#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016619#Artikel2
