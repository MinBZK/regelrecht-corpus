    Besluit:
  url: https://wetten.overheid.nl/BWBR0004193/1987-07-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het bepaalde in artikel 8 van het Eisen- en controlebesluit vergunningen diergeneesmiddelen (Stb. 1986, 343) is
      niet van toepassing op diergeneesmiddelen, die als toevoegingsmiddel in diervoeder worden verwerkt overeenkomstig
      de [richtlijn 70/524/EEG](31970L0524) van de Raad van de Europese Gemeenschappen van 23 november 1970, betreffende
      toevoegingsmiddel in diervoeding (Pb EG L 270) zoals deze is of zal worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0004193/1987-07-17#Artikel1
  - number: '2'
    text: |-
      Deze regeling treedt in werking met ingang van de dag volgende op die van haar bekendmaking in de Nederlandse
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004193/1987-07-17#Artikel2
