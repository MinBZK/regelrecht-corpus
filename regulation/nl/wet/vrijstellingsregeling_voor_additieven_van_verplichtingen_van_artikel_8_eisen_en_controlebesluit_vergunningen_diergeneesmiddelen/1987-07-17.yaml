preamble:
  text: |-
    in overeenstemming met de staatssecretaris van Welzijn, Volksgezondheid en Cultuur,

    Gelet op artikel 45 van de Diergeneesmiddelenwet (Stb. 1985, 410);

    Gehoord de Dibevo, de Vereniging voor Fabrikanten en Groothandelaren in Veterinaire Produkten (Fagrovet), de
    Vereniging van Fabrikanten en Importeurs van Diergeneesmiddelen in Nederland (FIDIN), de Vereniging van Fabrikanten
