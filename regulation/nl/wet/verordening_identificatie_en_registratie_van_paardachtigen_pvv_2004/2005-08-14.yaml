  - number: '22'
    text: |-
      1 De voorzitter kan, voor zover het belang van bestrijding van dierziekten zich daartegen niet verzet, op
      schriftelijk verzoek van belanghebbende, van het bepaalde in de [artikelen 2][ref1], [4, eerste lid][ref2], en
      [9][ref3] vrijstelling of ontheffing verlenen in geval het paardachtigen betreft die in een dierentuin of op een
      natuurterrein worden gehouden.

      2 Aan een vrijstelling of ontheffing kunnen voorschriften of voorwaarden worden verbonden. Zij kunnen onder
      beperkingen worden verleend. Zij kunnen te allen tijde worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0015767#Artikel2
