    text: |-
      1 De [artikelen 2][ref1] en [3, tweede lid][ref2], zijn tot 1 januari 2005 niet van toepassing op paardachtigen
      die vóór inwerkingtreding van deze verordening staan ingeschreven bij erkende instellingen of hippische
      sportorganisaties alsmede op slachtpaarden en paardachtigen die worden vervoerd met een bestemming buiten het
      grondgebied van Nederland.

      2 De [artikelen 2][ref3] en [3, tweede lid][ref4], zijn tot 1 januari 2007 niet van toepassing op paardachtigen die
      zijn geboren vóór inwerkingtreding van deze verordening, mei uitzondering van paardachtigen die na inwerkingtreding
      van deze verordening een veulen hebben geworpen, alsmede paardachtigen waaraan medicatie is toegediend als gevolg
      waarvan de paardachtigen niet voor menselijke consumptie mag worden bestemd.


