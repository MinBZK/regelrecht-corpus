        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0015767
        artikel: '13'
        paragraaf: '4'
  - number: '12'
    text: |-
      De eigenaar is verplicht om na ontvangst van het paspoort uiterlijk vóór het moment dat aan de paardachtigen
      voor de eerste keer medicatie wordt toegediend, in het daartoe bestemde vak van het paspoort aan te tekenen of de
      paardachtigen al dan niet is bestemd voor de slacht ten behoeve van menselijke consumptie.
    url: https://wetten.overheid.nl/BWBR0015767/2005-08-14#Artikel12
  - number: '13'
    text: |-
      1 De dierenarts tekent elke enting van de paardachtigen in het paspoort aan.

      2 Voor zover de paardachtigen is bestemd voor menselijke consumptie, tekent de dierenerts tevens de aan de
      paardachtigen toegediende en voorgeschreven medicatie, voor zover deze stoffen bevat die niet zijn opgenomen in de
      bijlagen I, II, III en IV van [Verordening (EG) nr. 2377/90](31990R2377) van de Raad van 26 juni 1990 houdende een
      communautaire procedure tot vaststelling van maximumwaarden voor residuen van geneesmiddelen voor diergeneeskundig
      gebruik in levensmiddelen van dierlijke oorsprong (PbEG L 224) in het paspoort aan.
    url: https://wetten.overheid.nl/BWBR0015767/2005-08-14#Artikel13
  - number: '14'
    text: |-
      Behoudens het bepaalde in [artikel 15][ref1], retourneert de eigenaar het paspoort aan de in
      [artikel 6, eerste lid][ref2], bedoelde erkende instelling of hippische sportorganisatie die het paspoort heeft
      uitgegeven uiterlijk twee weken na overlijden van de paardachtigen.


      [ref1]: https://wetten.overheid.nl/BWBR0015767#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0015767#Artikel6
    url: https://wetten.overheid.nl/BWBR0015767/2005-08-14#Artikel14
    references:
      - id: ref1
