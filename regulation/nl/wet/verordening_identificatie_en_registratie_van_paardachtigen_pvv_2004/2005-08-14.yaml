  - number: '21'
    text: |-
      Degene die een paardachtigen uit een lidstaat van de Europese Unie binnen het grondgebied van Nederland brengt,
      is verplicht de paardachtigen binnen 6 maanden na de dag waarop de paardachtigen binnen het grondgebied van
      Nederland is gebracht te voorzien van een transponder, voor zover de paardachtigen niet reeds is voorzien van een
      transponder. In het laatste geval wordt het transpondernummer onverwijld schriftelijk medegedeeld aan de voorzitter
      ten behoeve van registratie in de in [artikel 19, derde lid][ref1], bedoelde databank.


      [ref1]: https://wetten.overheid.nl/BWBR0015767#Artikel19
