        paragraaf: '3'
  - number: '16'
    text: |-
      1 In geval van verlies of diefstal van het paspoort stelt de eigenaar de in [artikel 6, eerste lid][ref1], bedoelde
      erkende instelling of hippische sportorganisatie die het paspoort heeft uitgegeven schriftelijk en onverwijld van
      het feit op de hoogte.

      2 De eigenaar dient in het in het eerste lid bedoelde geval overeenkomstig [artikel 7][ref2] een paspoort aanvraag
      in onder vermeIding "aanvraag duplicaat".

      3 Het paspoort wordt voorzien van de opdruk "duplicaat paspoort".

      4 In het in het eerste lid bedoelde geval wordt de paardachtigen niet eerder ter slacht aangeboden dan na
      verstrijken van een termijn van 6 maanden te rekenen vanaf de dag van uitgifte van het duplicaat paspoort.

      5 Van de uitgifte van een duplicaat paspoort wordt in het in [artikel 19, eerste lid][ref3], bedoelde register een
      aantekening gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0015767#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015767#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0015767#Artikel19
