        artikel: '6'
        paragraaf: '3'
  - number: '8'
    text: |-
      1 Voor het paspoort is een vergoeding verschuldigd. De hoogte van de vergoeding wordt; bij besluit van de
      voorzitter vastgesteld.

      2 Het paspoort wordt niet eerder in handen van de aanvrager gesteld dan nadat de vergoeding aan de in
      [artikel 6, eerste lid][ref1], bedoelde erkende instelling of hippische sportorganisatie is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0015767#Artikel6
    url: https://wetten.overheid.nl/BWBR0015767/2005-08-14#Artikel8
