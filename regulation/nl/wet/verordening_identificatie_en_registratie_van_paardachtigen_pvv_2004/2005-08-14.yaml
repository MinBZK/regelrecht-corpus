  - number: '19'
    text: |-
      1 De in [artikel 6 , eerste lid][ref1], bedoelde erkende instelling of hippische sportorganisatie houdt in een
      gegevensbestand een register bij waarin met betrekking tot elke paardachtigen waarvoor door genoemde organisatie
      een paspoort is uitgegeven, ten minste de volgende gegevens worden opgenomen:

      a. Het unieke levensnummer/UELN nummer;

      b. Het transpondernummer;

      c. De datum van uitgifte van het paspoort;

      d. Naam;

      e. Geslacht;

      f. Geboortedatum;

      g. Geboorteplaats;

      h. Registratiedatum;

      i. Naam en adres van de eigenaar.

      2 Voorts houdt de in [artikel 6, eerste lid][ref2], bedoelde erkende instelling of hippische sportorganisatie in
      een gegevensbestand de uitgegeven transpondernummers en de niet meer in gebruik zijnde transpondernummers bij.

      3 De in het tweede lid bedoelde gegevensbestanden worden tenminste één maal per kwartaal doorgegeven aan een door
      de voorzitter aangewezen databank onder zijn beheer.

      4 De voorzitter geeft de in [artikel 6 , eerste lid][ref3], bedoelde erkende instelling of hippische
      sportorganisatie aanwijzingen ter zake van de registratie en de periodieke doorgifte van gegevensbestanden.


      [ref1]: https://wetten.overheid.nl/BWBR0015767#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015767#Artikel6
