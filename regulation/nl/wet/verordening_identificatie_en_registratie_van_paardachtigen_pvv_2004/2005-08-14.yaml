      1 Onverminderd het bepaalde in [artikel 3, derde lid][ref1], is degene die een paardachtigen invoert verplicht de
      paardachtigen uiterlijk op de dag van invoer te voorzien van een geldig paspoort.

      2 Onverminderd het bepaalde in [artikel 3, derde lid][ref2], is degene die een paardachtigen invoert verplicht
      de paardachtigen uiterlijk op de dag van invoer te voorzien van een transponder, voor zover de paardachtigen niet
      reeds is voorzien van een transponder. in het laatste geval wordt het transpondernummer onverwijld schriftelijk
      medegedeeld aan de voorzitter ten behoeve van registratie in de in [artikel 19, derde lid][ref3], bedoelde databank


