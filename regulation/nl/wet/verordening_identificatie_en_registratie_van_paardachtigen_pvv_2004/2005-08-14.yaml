        artikel: '15'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015767
        artikel: '6'
        paragraaf: '3'
  - number: '15'
    text: |-
      1 De eigenaar die een paardachtigen ter slachting aanbiedt, overlegt het paspoort aan de degene die de paardachtige
      slacht of doet slachten.

      2 De degene die de paardachtige slacht of doet slachten retourneert het paspoort na slachting aan de in
      [artikel 6, eerste lid][ref1], bedoelde erkende instelling of hippische sportorganisatie die het paspoort heeft
      uitgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0015767#Artikel6
    url: https://wetten.overheid.nl/BWBR0015767/2005-08-14#Artikel15
