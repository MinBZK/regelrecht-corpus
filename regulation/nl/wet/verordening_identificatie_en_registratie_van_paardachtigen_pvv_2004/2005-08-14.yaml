        artikel: '6'
        paragraaf: '3'
  - number: '9'
    text: De eigenaar is verplicht de paardachtigen binnen 7 maanden na geboorte te laten voorzien van een transponder.
    url: https://wetten.overheid.nl/BWBR0015767/2005-08-14#Artikel9
  - number: '10'
    text: |-
      1 De transponder wordt geïmplanteerd door een dierenarts of door een paarden paspoortconsulent.

      2 De voorzitter stelt bij besluit een protocol vast, waarin voorschriften worden gegeven ter zake van het
      implanteren van transponders. Het besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.

      3 De in het tweede lid bedoelde voorschriften kunnen bepalen dat in afwijking van het bepaalde in artikel 5,
      tweede lid, het nummer van de in de paardachtige geïmplanteerde transponder door de in het eerste lid bedoelde
      dierenarts of de paardenpaspoortconsulent in het paspoort wordt aangetekend bij gelegenheid van de implantatie van
      de transponder.
    url: https://wetten.overheid.nl/BWBR0015767/2005-08-14#Artikel10
  - number: '11'
    text: |-
      In het paspoort worden geen wijzigingen of aantekeningen aangebracht, behoudens de aantekeningen als bedoeld in de
      [artikelen 10, derde lid][ref1], [12][ref2] en [13][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015767#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0015767#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0015767#Artikel13
    url: https://wetten.overheid.nl/BWBR0015767/2005-08-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0015767
        artikel: '10'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015767
