  - number: '18'
    text: |-
      1 In geval één of meer onderdelen van het paspoort geen ruimte meer biedt voor het aanbrengen van
      aantekeningen vraagt de eigenaar, onder overlegging van het paspoort, een vervolgpaspoort aan bij de in
      [artikel 6, eerste lid][ref1], bedoelde erkende instelling of hippische sportorganisatie die het paspoort heeft
      uitgegeven.

      2 Het vervolgpaspoort wordt slechts uitgegeven na overlegging van het paspoort. Het vervolgpaspoort wordt
      voorzien van de opdruk "vervolgpaspoort". Het overgelegde paspoort wordt voorzien van de opdruk "vervolg paspoort
      uitgegeven".


      [ref1]: https://wetten.overheid.nl/BWBR0015767#Artikel6
