preamble:
  text: |-
    Gelet op artikel 2 van het Besluit identificatie en registratie van dieren, de artikelen 1 en 2 van de Regeling
    medebewind vergoeding en tuchtrechtelijke maatregelen identificatie en registratie van eenhoevige dieren en de
    artikelen 96, 97 en 98 van de Wet op de bedrijfsorganisatie;

    Gezien Richtlijn nr. 90/426/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990 tot vaststelling
    van veterinairrechtelijke voorschriften voor het verkeer van paardachtigen en de invoer van paardachtigen uit
    derde landen (PbEG L224), Richtlijn nr. 90/427/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990
    tot vaststelling van zoötechnische en genealogische voorschriften voor het intracommunautaire handelsverkeer
    in paardachtigen (PbEG L224), Beschikking nr. 93/623/EEG van de Commissie van de Europese Gemeenschappen van
    20 oktober 1993 tot vaststelling van een identificatiedocument (paspoort) dat geregistreerde paardachtigen moet
    vergezellen (PbEG L 298), Beschikking nr. 2000/68/EG van de Commissie van de Europese Gemeenschappen van 22
    december 1999 houdende wijziging van Beschikking 93/623/EEG en tot vaststelling van de identificatievoorschriften
    voor als fok- en gebruiksdier gehouden paardachtigen (PbEG L 23);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015767/2005-08-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening wordt verstaan onder:










                  1.


                  productschap


                  :


                  Productschap Vee en Vlees;




                  2.


                  voorzitter


                  :


                  de voorzitter van het productschap;




                  3.


                  bestuur


                  :


                  het bestuur van het productschap;




                  4.


                  eigenaar


                  :


                  de natuurlijke of rechtspersoon die de paardachtigen in eigendom heeft dan wel beroepsmatig de
      beschikkingsmacht uitoefent over de paardachtigen;




                  5.


                  paardachtigen


                  :


                  als huisdier gehouden of in het wild levende paarden, met inbegrip van zebra’s, en ezels of kruisingen
      daarvan;




                  6.


                  geregistreerde paardachtigen


                  :


                  paardachtigen die zijn ingeschreven in een stamboek of register dat wordt bijgehouden door een erkende
      instelling;




                  7.


                  slachtpaarden


                  :


                  paardachtigen die zijn bestemd om hetzij rechtstreeks, hetzij na via een markt of een erkend
      verzamelcentrum te zijn doorgevoerd, naar een slachthuis te worden gebracht om daar te worden geslacht;




                  8.


                  erkende instelling


                  :


                  een krachtens het Fokkerijbesluit erkende organisatie die één of meer stamboeken of registers van
      paardachtigen bijhoudt;




                  9.


                  hippische sportorganisatie


                  :


                  een organisatie die de paardensport professioneel bevordert;




                  10.


                  levensnummer/UELN nummer


                  :


                  het door de voorzitter aan de paardachtigen toegewezen unieke 15-cijferige nummer als bedoeld in
      [artikel 5, tweede lid][ref1];




                  11.


                  erkende paardendierenarts


                  :


                  een in het register van de Stichting Veterinair Kwaliteitsorgaan ingeschreven paardendierenarts:




                  12.


                  dierenarts


                  :


                  degene die krachtens de [Wet op de uitoefening van de diergeneeskunde][ref2] (stb. 1990, 214) is
      toegelaten tot de uitoefening van de diergeneeskunde;




                  13.


                  paardenpaspoortconsulent


                  :


                  door de voorzitter aangewezen persoon die is gekwalificeerd tot het schetsen van paardachtigen en tot
      het implanteren van transponders;




                  14.


                  transponder


                  :


                  elektronisch implantaat ter identificatie van de paardachtigen dat voldoet aan het door de voorzitter
      bij besluit vastgestelde programma van eisen;




                  15.


                  paspoort


                  :


                  het identificatiedocument als bedoeld in Beschikking 93/623 EEG en Beschikking 2000/68/EG;




                  16.


                  invoer


                  :


                  het in Nederland in het vrije verkeer van de Gemeenschap brengen van één of meer paardachtigen uit
      derde landen;




                  17.


                  dierentuin


                  :


                  een inrichting met een permanent karakter, waar levende dieren van wilde diersoorten worden gehouden om
      gedurende tenminste zeven dagen per jaar te worden tentoongesteld aan het publiek;




                  18.


                  natuurterrein


                  :


                  grond met een houtopstand, of heideveld, ven, hoogveenterrein, zandverstuiving, duinterein, kwelder,
      schor, gors, slik, riet- en ruigtland, griend en laagveenmoeras, voor zover het geen landbouwgrond is.


      [ref1]: https://wetten.overheid.nl/BWBR0015767#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004730
