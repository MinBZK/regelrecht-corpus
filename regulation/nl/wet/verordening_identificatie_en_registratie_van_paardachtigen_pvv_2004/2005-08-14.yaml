  - number: '2'
    text: |-
      1 Het is verboden paardachtigen ouder dan 7 maanden te houden die niet zijn voorzien van een geldig paspoort.

      2 Het is verboden paardachtigen ouder dan 7 maanden te houden die niet zijn voorzien van een transponder.
    url: https://wetten.overheid.nl/BWBR0015767/2005-08-14#Artikel2
  - number: '3'
    text: |-
      1 Het is verboden paardachtigen te vervoeren of te doen vervoeren, die niet vergezeld gaan van een geldig paspoort.

      2 Het is verboden paardachtigen te vervoeren of te doen vervoeren, die niet zijn voorzien van een transponder.

      3 Het bepaalde in het eerste en tweede lid is niet van toepassing op slachtpaarden die worden ingevoerd, op
      paardachtigen die voor de duur van een periode niet langer dar, 6 maanden worden ingevoerd met het oog op deelname
      aan wedstrijden, keuringen, trainingsstages of spermawinning, op kadavers van paardachtigen, voor zover deze
      rechtstreeks worden vervoerd naar een verwerkingsbedrijf als bedoeld in Hoofdstuk III van [Verordening (EG) Nr.
      1774/2002](32002R1774) van het Europees Parlement en de Raad van de Europese Gemeenschappen van 3 oktober 2002 tot
      vaststelling van gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde dierlijke bijproducten
      (PbEG L273) alsmede op paardachtigen jonger dan 7 maanden die aan de voet van de moeder worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0015767/2005-08-14#Artikel3
  - number: '4'
    text: |-
      1 De eigenaar is verplicht de paardachtigen binnen 7 maanden na geboorte te voorzien van een paspoort.

      2 Onverminderd het bepaalde in [artikel 21][ref1], wordt het paspoort slechts uitgegeven indien de paardachtigen is
      voorzien van een transponder.

      3 Het bepaalde in het tweede lid is niet van toepassing in het geval dat aan [artikel 22a, vierde lid][ref2],
      toepassing wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0015767#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0015767#Artikel22a
    url: https://wetten.overheid.nl/BWBR0015767/2005-08-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0015767
        artikel: '21'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0015767
        artikel: 22a
        paragraaf: '7'
  - number: '5'
    text: |-
      1 Het model van het paspoort is opgenomen in de bijlage.

      2 Het paspoort wordt bij uitgifte voorzien van het aan de paardachtigen toegekende levensnummer/UELN nummer alsmede
      van het nummer van de in de paardachtigen geïmplanteerde transponder.
    url: https://wetten.overheid.nl/BWBR0015767/2005-08-14#Artikel5
  - number: '6'
    text: |-
      1 Het paspoort wordt door het bestuur uitgegeven. Hiertoe gemandateerde erkende instellingen en hippische
      sportorganisaties dragen namens het bestuur zorg voor de uitgifte van het paspoort. De mandatering geschiedt bij
      afzonderlijk bestuursbesluit.

      2 Bij het in het eerste lid bedoelde besluit stelt het bestuur een protocol vast waarin de door de erkende
      instellingen en hippische sportorganisaties in acht te nemen aanwijzingen ter zake van de beoordeling van
      paspoortaanvragen, de uitgifte van paspoorten en de daarbij te volgen procedures en te voeren registers worden
      gegeven en wijst het bestuur de functionarissen van de erkende instellingen en hippische sportorganisaties aan die
      worden gemandateerd om de paspoortaanvragen te beoordelen respectievelijk paspoorten uit te geven.

      3 Het in het eerste lid bedoelde bestuursbesluit wordt gepubliceerd in het Verordeningen blad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0015767/2005-08-14#Artikel6
  - number: '7'
    text: |-
      1 Het paspoort wordt door de eigenaar aangevraagd door indiening van een aanvraagformulier dat volledig en naar
      waarheid is ingevuld en ondertekend door een erkende paardendierenarts door een daartoe gekwalificeerde dierenarts,
      door een paardenpaspoortconsulent of door een daartoe in [artikel 6, tweede lid][ref1], bedoelde gemandateerde
      functionaris van een erkende instelling. Het formulier wordt door de eigenaar ondertekend.

      2 Paspoortaanvragen die betrekking hebben op geregistreerde paardachtigen worden: ingediend bij de erkende
      instelling waar de paardachtigen is geregistreerd.

      3 Paspoortaanvragen die betrekking hebben op andere dan geregistreerde paardachtigen. worden naar keuze van de
      aanvrager ingediend bij één van de in [artikel 6, eerste lid][ref2], bedoelde erkende instellingen of hippische
      sportorganisaties.

      4 De voorzitter stelt bij besluit de gegevens vast die ten minste in het aanvraagformulier- worden opgenomen. Het
      besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0015767#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015767#Artikel6
    url: https://wetten.overheid.nl/BWBR0015767/2005-08-14#Artikel7
