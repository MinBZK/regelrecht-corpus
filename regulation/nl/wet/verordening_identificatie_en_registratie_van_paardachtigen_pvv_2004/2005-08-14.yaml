  - number: '17'
    text: |-
      1 In het geval wordt vastgesteld dat er wijzigingen of aantekeningen, anders dan aantekeningen als bedoeld in de
      [artikelen 12][ref1] en [13][ref2], in het paspoort zijn aangebrachte, kan het paspoort op last van de voorzitter
      worden ingenomen.

      2 Het bepaalde in [artikel 16, leden 2 tot en met 5][ref3] is in het in het eerste lid bedoelde geval van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015767#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0015767#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0015767#Artikel16
