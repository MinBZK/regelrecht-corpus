    text: |-
      1 Op overtreding van het bepaalde in de [artikelen 7, eerste lid][ref1], [9][ref2], [10][ref3], [11][ref4],
      [12][ref5], [14][ref6], [15][ref7], [16, eerste en vierde lid][ref8], [18, eerste lid][ref9], [20][ref10] en
      [21][ref11] worden tuchtrechtelijke maatregelen gesteld.

      2 De tuchtrechtelijke maatregelen zijn:

      a. een berisping;

      b. een geldboete tot ten hoogste het bedrag van de derde categorie bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref12];

      c. het stellen van de betrokkene onder verscherpte controle op zijn kosten, voor ten hoogste 2 jaren;

      d. openbaarmaking van de tuchtbeschikking op kosten van de betrokkene.


