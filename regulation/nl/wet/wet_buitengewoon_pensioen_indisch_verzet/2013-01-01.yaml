  - number: 1a
    text: 'Voor de toepassing van deze wet wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel1a
  - number: 1a.a
    text: 'huwelijk: het geregistreerd partnerschap;'
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel1a
  - number: 1a.b
    text: 'gehuwd: als partner geregistreerd;'
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel1a
  - number: 1a.c
    text: 'echtgenoot of echtgenote: de geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel1a
  - number: 1a.d
    text: 'weduwe of weduwnaar: de achtergebleven partij bij een geregistreerd partnerschap;'
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel1a
  - number: 1b
    text: |-
      Waar in deze wet in een artikel of artikellid sprake is van «de Raad of de Sociale
      verzekeringsbank» is de taakverdeling in overeenstemming met de [artikelen 4][ref1] en
      [6 van de Wet uitvoering wetten voor verzetsdeelnemers en oorlogsgetroffenen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027660#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0027660#Artikel6
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0027660
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0027660
        artikel: '6'
  - number: '2.1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel2
  - number: 2.1.a
    text: |-
      verzet: activiteiten welke na de capitulatie van het Koninklijk Nederlandsch-Indisch Leger, anders dan in militair
      verband, werden verricht met het oogmerk door daad of houding afbreuk te doen aan de militaire of ideologische
      doeleinden van de bezetter zonder dat daarbij persoonlijk gewin of andere persoonlijke motieven een rol speelden
      en welke een zekere mate van duurzaamheid of intensiteit inhielden en waaraan voor betrokkene een duidelijk risico
      verbonden was;
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel2
  - number: 2.1.b
    text: |-
      deelnemers aan het verzet: zij die verzet hebben gepleegd tegen de vijandelijke bezettende macht van het Rijk in
      Azië.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel2
  - number: '2.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën van personen worden aangewezen op wie deze wet van
      overeenkomstige toepassing zal zijn.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel2
  - number: '3.1'
    text: |-
      Deze wet is van toepassing op de deelnemers aan het verzet en hun nagelaten betrekkingen, die de Nederlandse
      nationaliteit bezitten.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel3
  - number: '3.2'
    text: |-
      De Raad kan deze wet van toepassing verklaren op de verzetsdeelnemer of zijn nagelaten betrekkingen indien
      ten aanzien van hen sprake is van zodanige bij hen gelegen omstandigheden dat als gevolg daarvan het een
      klaarblijkelijke hardheid zou zijn hen van de toepassing van deze wet uit te sluiten. Een dergelijk besluit wordt
      niet genomen dan nadat Onze Minister daarin heeft toegestemd. Toestemming kan worden onthouden wegens strijd met
      het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel3
  - number: '3.3'
    text: |-
      Voor toekenning van buitengewoon pensioen dan wel erkenning als deelnemer aan het verzet komen niet in aanmerking
      zij, die zich tijdens de vijandelijke bezetting van het Rijk in Azië uit Nederlands nationaal oogpunt beschouwd,
      onwaardig hebben gedragen. Evenmin komen in aanmerking de nagelaten betrekkingen van de deelnemers aan het verzet,
      op wie vorenbedoelde omschrijving van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel3
  - number: '5'
    text: |-
      De voordracht voor een krachtens deze wet vast te stellen algemene maatregel van bestuur wordt niet gedaan dan
      nadat het ontwerp in de *Staatscourant* is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen vier
      weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister te brengen.
      Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel5
  - number: '6.1'
    text: |-
      De deelnemer aan het verzet heeft recht op buitengewoon pensioen ingeval van verwonding, verminking, ziekten
      of gebreken welke door of in verband met het verzet zijn ontstaan of verergerd dan wel het gevolg zijn van de
      behandeling ondervonden tijdens gevangenschap ter zake van het verzet, mits de toestand van de belanghebbende ten
      gevolge van de verwonding, verminking, ziekten of gebreken een invaliditeit blijkt te veroorzaken van tenminste
      10%.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel6
  - number: '6.2'
    text: |-
      Indien de in het eerste lid bedoelde verwonding, verminking, ziekten of gebreken een invaliditeit veroorzaken
      van tenminste 40%, doch het totaal der invaliditeit een hoger percentage bedraagt, geldt voor de vaststelling van
      de mate van invaliditeit waarnaar het buitengewoon pensioen wordt berekend, dit hogere percentage voorzover de
      meerdere invaliditeit niet duidelijk uit andere oorzaken dan het verzet is ontstaan.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel6
  - number: '6.3'
    text: |-
      Het verband of gevolg, bedoeld in het eerste lid, wordt geacht aanwezig te zijn, indien de deelnemer aan het
      verzet:
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel6
  - number: 6.3.a
    text: |-
      tijdens de bezetting of in aansluiting daarop in verband met het verzet drie maanden of langer in gevangenschap
      heeft doorgebracht dan wel naar het oordeel van de Raad, de Stichting Pelita gehoord, in verband met de aard van
      zijn verzetsactiviteiten aan buitengewoon zware en langdurige spanningen heeft blootgestaan en
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel6
  - number: 6.3.b
    text: voor tenminste 60% invalide is en deze invaliditeit niet duidelijk uit andere oorzaken dan het verzet is ontstaan.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel6
  - number: '6.4'
    text: |-
      Bij de toepassing van dit artikel wordt rekening gehouden met de inzichten en ervaringen van de medische wetenschap
      met betrekking tot de relatie tussen het verzet en de geestelijke en lichamelijke gezondheidstoestand.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel6
  - number: '7'
    text: Het buitengewoon pensioen kan als blijvend of voorlopig pensioen worden toegekend.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel7
  - number: '8'
    text: |-
      Het blijvend buitengewoon pensioen wordt toegekend, indien, hetzij bij eerste toekenning, hetzij bij vernieuwing
      van pensioen, verandering van het invaliditeitspercentage voor de toekomst niet aannemelijk wordt geacht.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel8
  - number: '9.1'
    text: |-
      Het voorlopig buitengewoon pensioen wordt toegekend, indien verandering van het invaliditeitspercentage voor de
      toekomst aannemelijk wordt geacht.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het voorlopig buitengewoon pensioen wordt voor tenminste één jaar en voor ten hoogste vijf jaren toegekend; een
      zodanig pensioen wordt opnieuw toegekend, zo dikwijls daartoe aanleiding bestaat. De termijn van tenminste één jaar
      is niet van toepassing bij de tweede of verdere toekenning van voorlopig buitengewoon pensioen.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel9
  - number: '10.1'
    text: |-
      Ingeval krachtens deze wet aanspraak op buitengewoon pensioen bestaat, stelt de Raad de pensioengrondslag vast,
      waarnaar het buitengewoon pensioen wordt berekend.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel10
  - number: 10.2.a
    text: |-
      Indien de deelnemer aan het verzet voor het bereiken van de leeftijd, waarop gelijksoortige valide personen in
      de regel hun werkzaamheden beëindigen, ten gevolge van de verwonding, verminking, ziekten of gebreken, bedoeld
      in [artikel 6][ref1], gedwongen werd of wordt zijn werkzaamheden in beroep of bedrijf te beëindigen of blijvend
      te verminderen, wordt de pensioengrondslag vastgesteld naar het inkomen uit arbeid, dat de deelnemer aan het
      verzet ten tijde van de aanvraag, bedoeld in [artikel 26][ref2], in Nederland, ware hij niet invalide geweest,
      zou hebben genoten uit het door hem uitgeoefende beroep of bedrijf, waarin hij voor het eerst ten gevolge van zijn
      invaliditeit zijn werkzaamheden moest beëindigen of blijvend verminderen;


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003968#Artikel6
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '6'
        hoofdstuk: Tweede
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003968
        artikel: '6'
        hoofdstuk: Tweede
        paragraaf: '1'
  - number: 10.2.b
    text: |-
      indien de deelnemer aan het verzet, bedoeld onder a, na het tot uiting komen van de invaliditeit ten gevolge
      waarvan hij zijn werkzaamheden in beroep of bedrijf heeft moeten beëindigen of blijvend verminderen, arbeid heeft
      aanvaard in een ander beroep of bedrijf, wordt, indien dat voor hem gunstiger is, de pensioengrondslag vastgesteld
      naar het inkomen dat de deelnemer aan het verzet ten tijde van de aanvraag, bedoeld in [artikel 26][ref1], in
      Nederland uit arbeid in laatstbedoeld beroep of bedrijf zou hebben genoten, indien hij deze werkzaamheden door of
      in verband met zijn invaliditeit niet had moeten beëindigen of blijvend verminderen;


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel26
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '26'
        hoofdstuk: Vijfde
  - number: 10.2.c
    text: |-
      onder arbeid in een ander beroep of bedrijf, bedoeld onder b, wordt verstaan: arbeid, welke gedurende een
      aaneengesloten periode van tenminste drie jaar in de voor dat beroep of bedrijf gebruikelijke arbeidstijd is
      verricht;
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel10
  - number: 10.2.d
    text: |-
      de Raad kan, bij beschikking, van het bepaalde onder c afwijken, indien naar zijn oordeel de onverkorte toepassing
      daarvan, gelet op alle omstandigheden, in een individueel geval onredelijk zou zijn.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel10
  - number: '10.3'
    text: |-
      Indien het in het tweede lid bedoelde beroep of bedrijf buiten Nederland werd uitgeoefend, wordt bij de
      vaststelling van de pensioengrondslag, waarnaar het buitengewoon pensioen wordt berekend, rekening gehouden met het
      meest vergelijkbare beroep of bedrijf in Nederland, alsmede met de (vak)opleiding, bekwaamheid en andere factoren,
      welke ter zake van belang kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel10
  - number: '10.4'
    text: |-
      Bij de vaststelling van de pensioengrondslag, bedoeld in het tweede en derde lid, wordt geen rekening gehouden met
      de mogelijkheid van inkomensvermeerdering ten gevolge van bevordering, verhoging van de vakbekwaamheid, uitbreiding
      van het bedrijf of andere dergelijke factoren.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel10
  - number: '10.5'
    text: |-
      Bij door Onze Minister te stellen regelen wordt bepaald wat onder inkomen uit arbeid in beroep of bedrijf, bedoeld
      in het tweede lid, moet worden verstaan.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel10
  - number: '10.6'
    text: |-
      Indien de deelnemer aan het verzet vóór het tot uiting komen van zijn invaliditeit ten gevolge van de verwonding,
      verminking, ziekten of gebreken, bedoeld in [artikel 6][ref1], door of in verband met het volgen van onderwijs
      nog geen arbeid in beroep of bedrijf uitoefende, en hij ten gevolge van die invaliditeit nimmer in staat is
      geweest door arbeid in beroep of bedrijf een inkomen te verwerven dat in overeenstemming was met het niveau van
      het gevolgde onderwijs, wordt de pensioengrondslag vastgesteld met inachtneming van door Onze Minister te stellen
      regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel6
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '6'
        hoofdstuk: Tweede
        paragraaf: '1'
  - number: '10.7'
    text: |-
      Indien de deelnemer aan het verzet ten tijde van het tot uiting komen van de invaliditeit, als bedoeld in
      [artikel 6, eerste lid][ref1], niet was aangewezen op inkomen uit arbeid in beroep of bedrijf dan wel de leeftijd
      heeft of had bereikt waarop gelijksoortige valide personen in de regel hun werkzaamheden beëindigen dan wel indien
      die invaliditeit niet heeft geleid tot beëindiging of vermindering van zijn werkzaamheden in beroep of bedrijf,
      wordt de pensioengrondslag vastgesteld op het bedrag genoemd in het achtste lid, onder a.


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel6
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '6'
        hoofdstuk: Tweede
        paragraaf: '1'
