                        van het overeenkomstig de voorgaande leden vastgestelde jaarinkomen.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel10
  - number: '11.1'
    text: |-
      Het buitengewoon pensioen bedraagt zoveel procent van de pensioengrondslag als het voor de belanghebbende
      vastgestelde invaliditeitspercentage beloopt.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel11
  - number: '11.2'
    text: Invaliditeitspercentages hoger dan tien worden naar boven afgerond in veelvouden van tien.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel11
  - number: '11.3'
    text: Bij een percentage van minder dan tien wordt invaliditeit geacht niet te bestaan.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel11
  - number: '12.1'
    text: |-
      Het buitengewoon pensioen wordt éénmaal met 20% van de pensioengrondslag vermeerderd, wanneer een blijvend
      buitengewoon pensioen is verleend, dat is berekend naar een invaliditeit van 80 of 90%.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel12
  - number: '12.2'
    text: |-
      Het buitengewoon pensioen wordt éénmaal met 40% van de pensioengrondslag vermeerderd, wanneer een blijvend
      buitengewoon pensioen is verleend, dat is berekend naar een invaliditeit van 100%.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel12
  - number: '13'
    text: |-
      Tenzij de belanghebbende reeds op grond van het bepaalde in artikel 12 recht heeft op een vermeerdering, wordt het
      buitengewoon pensioen éénmaal met 20% van de pensioengrondslag vermeerderd, wanneer ten gevolge van de verwonding,
      verminking, ziekten of gebreken die ontstaan zijn als gevolg van het verzet: a. een der ledematen is verloren
      gegaan of voorgoed geheel onbruikbaar is geworden dan wel een toestand is ontstaan die met een zodanig verlies
      of een zodanige onbruikbaarheid is gelijk te stellen; b. twee of meer der ledematen dermate in beweeglijkheid
      of bruikbaarheid zijn verminderd dat de toestand van de belanghebbende met die onder *a* beschreven is gelijk te
      stellen; c. het gezichtsvermogen door organische oorzaken zodanig is beperkt dat het vermogen om zich zelfstandig
      te bewegen er ernstig door wordt getroffen; òf d. belangrijke misvorming van het gelaat is ontstaan, welke door
      hulpmiddelen niet voldoende te verbergen is, zodat de belanghebbende de omgang met zijn medemensen ernstig wordt
      bemoeilijkt.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel13
  - number: '14'
    text: |-
      Tenzij de belanghebbende reeds op grond van het bepaalde in artikel 12 recht heeft op een vermeerdering, wordt het
      buitengewoon pensioen éénmaal met 40% van de pensioengrondslag vermeerderd, wanneer ten gevolge van de verwonding,
      verminking, ziekten of gebreken, die ontstaan zijn als gevolg van het verzet: a. twee of meer ledematen zijn
      verloren gegaan of voorgoed geheel onbruikbaar zijn geworden dan wel een toestand is ontstaan die met een zodanig
      verlies of een zodanige onbruikbaarheid is gelijk te stellen; b. het gezichtsvermogen voorgoed geheel verloren is
      gegaan of een toestand is ontstaan welke met blindheid is gelijk te stellen; òf c. onherstelbare krankzinnigheid is
      ontstaan of een toestand welke daarmee is gelijk te stellen.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel14
  - number: '15.1'
    text: |-
      Wanneer op grond van verwonding, verminking, ziekten of gebreken als bedoeld in artikel 6, een buitengewoon
      pensioen wordt toegekend en uit hoofde van die verwonding, verminking, ziekten of gebreken behandeling of
      verpleging is vereist, wordt aan de gepensioneerde ter zake daarvan vergoeding verleend volgens bij of krachtens
      algemene maatregel van bestuur te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel15
  - number: '15.2'
    text: |-
      In afwijking van het eerste lid kan aan categorieën gepensioneerden vergoeding ter zake van bepaalde de behandeling
      of verpleging omvattende voorzieningen worden verleend zonder dat deze voorzieningen uit hoofde van verwonding,
      verminking, ziekten of gebreken als bedoeld in artikel 6, eerste lid, zijn vereist. Bij algemene maatregel van
      bestuur worden ter zake regels gesteld.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel15
  - number: '15.3'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld betreffende de mogelijkheid om de vergoeding ter zake van
      bepaalde de behandeling of verpleging omvattende voorzieningen na het overlijden van de gepensioneerde gedurende
      een bepaalde tijd ten gunste van de weduwe of weduwnaar voort te zetten..
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel15
  - number: '16.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden met inachtneming van de volgende leden regelen vastgesteld
      betreffende de inkomsten, die voor verrekening met het buitengewoon pensioen in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel16
  - number: 16.2.a
    text: |-
      De inkomsten van de betrokkene worden op het buitengewoon pensioen in mindering gebracht voor het bedrag,
      waarmede het buitengewoon pensioen, ongeacht de vermeerdering of vergoeding ingevolge de [artikelen 12][ref1],
      [13][ref2], [14][ref3] en [15][ref4], vermeerderd met de inkomsten uit vermogen, alsmede met 75% van het
      genoten pensioen ingevolge de [Algemene Ouderdomswet][ref5] (*Stb.* 1965, 429) en de uitkering ingevolge de
      [Algemene nabestaandenwet][ref6] en 70% van de overige inkomsten de grondslag, waarover het buitengewoon pensioen
      is berekend, overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003968#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0003968#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0003968#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0002221
      [ref6]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '12'
        hoofdstuk: Tweede
