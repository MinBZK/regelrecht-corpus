        bwb_id: BWBR0002368
  - number: '17'
    text: |-
      Het bedrag, genoemd in [artikel 16, tweede lid, onder b, ten derde][ref1], wordt door Onze Minister telkens
      herzien met ingang van 1 januari, indien en voor zover de ontwikkeling van de consumentenprijsindex in de periode 1
      november tot en met 31 oktober daaraan voorafgaand, daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel16
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '16'
        hoofdstuk: Tweede
        paragraaf: '4'
  - number: '18.1'
    text: |-
      Geen buitengewoon pensioen wordt verleend of gewijzigd, zonder dat over het ontstaan, de aard en de gevolgen van
      de verwonding, verminking, ziekten of gebreken, welke recht geven op buitengewoon pensioen, op kosten van het Rijk
      een geneeskundig onderzoek heeft plaatsgehad en op grond daarvan het invaliditeitspercentage is vastgesteld, een en
      ander naar regelen te stellen bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel18
  - number: '18.2'
    text: |-
      Het geneeskundig onderzoek zal, op last van de Raad of de Sociale verzekeringsbank éénmaal worden herhaald, indien
      de belanghebbende daartoe de wens te kennen geeft in zijn bezwaarschrift, als bedoeld in [artikel 44][ref1] en
      voorts in elk geval waarin een herhaling door de Raad of de Sociale verzekeringsbank wenselijk wordt geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel44
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '44'
        hoofdstuk: Negende
  - number: '19.1'
    text: |-
      Recht op buitengewoon pensioen heeft de weduwe van een deelnemer aan het verzet, indien haar echtgenoot het
      leven heeft verloren in verband met het verzet dan wel indien hij op het tijdstip van zijn overlijden recht op
      buitengewoon pensioen ontleende aan het bepaalde in artikel 6 of zou hebben ontleend, indien hij op het tijdstip
      van het in werking treden van deze wet nog in leven was geweest.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel19
  - number: '19.2'
    text: |-
      Eveneens recht op buitengewoon pensioen heeft de vrouw, met wie een overleden deelnemer aan het verzet gehuwd is
      geweest, mits:
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel19
  - number: 19.2.a
    text: |-
      de man op de dag waarop de beschikking tot echtscheiding of de ontbinding van het huwelijk is uitgesproken dan
      wel het geregistreerd partnerschap ingevolge artikel 80c, onder c en d, van Boek 1 van het Burgerlijk Wetboek
      is beëindigd, recht op buitengewoon pensioen ontleende aan het bepaalde in artikel 6 en hij dat recht ook op het
      tijdstip van zijn overlijden kon doen gelden, dan wel zodanig recht zou hebben ontleend, indien hij op het tijdstip
      van het in werking treden van deze wet nog in leven was geweest;
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel19
  - number: 19.2.b
    text: |-
      de onder *a* bedoelde dag ligt na het tijdstip van de inwerkingtreding van de Wet herziening echtscheidingsrecht
      en de echtscheiding of de ontbinding van het huwelijk niet is uitgesproken met toepassing van het vóór genoemd
      tijdstip geldende recht, en
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel19
  - number: 19.2.c
    text: |-
      de vrouw niet als gevolg van hertrouwen, het aangaan van een huwelijk na een geregistreerd partnerschap, het
      aangaan van een geregistreerd partnerschap na een huwelijk dan wel het opnieuw aangaan van een geregistreerd
      partnerschap met haar vroegere echtgenoot ter zake van diens overlijden recht op een buitengewoon weduwenpensioen
      verkrijgt, met dien verstande, dat indien de vrouw op de datum van overlijden van haar vroegere echtgenoot is
      hertrouwd of geregistreerd dan wel opnieuw geregistreerd, het recht op buitengewoon pensioen, hetwelk zij aan dat
      overlijden ontleent, eerst ontstaat op de dag, volgende op die, waarop dat volgende door haar gesloten huwelijk
      is ontbonden.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel19
  - number: '19.3'
    text: |-
      Voor de toepassing van deze wet wordt met een weduwe (echtgenote) gelijkgesteld de vrouw, die ingevolge enige
      rechterlijke uitspraak in vermogensrechtelijk en/of erfrechtelijk opzicht gelijk wordt gesteld met een weduwe
      (echtgenote).
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel19
  - number: '19.4'
    text: 'Buitengewoon pensioen als in het eerste, tweede en derde lid bedoeld, komt eveneens toe aan:'
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel19
  - number: 19.4.a
    text: de weduwnaar van een deelneemster aan het verzet;
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel19
  - number: 19.4.b
    text: de man, met wie een overleden deelneemster aan het verzet gehuwd is geweest.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel19
  - number: '19.5'
    text: |-
      Op het buitengewoon pensioen van de in het vierde lid genoemde personen zijn de bepalingen van deze wet, betrekking
      hebbende op het buitengewoon pensioen van de in het eerste onderscheidenlijk het tweede lid van dit artikel
      genoemde personen, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel19
  - number: '20.1'
    text: |-
      Recht op uitkering heeft de minderjarige volle en halve wees van de deelnemer aan het verzet, mits deze op het
      tijdstip van zijn overlijden recht op buitengewoon pensioen ontleende aan het bepaalde in artikel 6 of zou hebben
      ontleend, indien hij op het tijdstip van het in werking treden van deze wet nog in leven was geweest.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel20
  - number: '20.2'
    text: |-
      De in het eerste lid bedoelde uitkering wordt naar behoefte individueel bepaald. Bij de vaststelling ervan wordt
      rekening gehouden met geëigende voorzieningen ter zake van kosten van onderwijs en opleiding.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel20
  - number: '20.3'
    text: |-
      De in het eerste lid bedoelde uitkering kan zo nodig worden voortgezet tot uiterlijk het bereiken van de 27-jarige
      leeftijd, indien de betrokkene, hetzij in verband met een dagstudie, hetzij in verband met arbeidsongeschiktheid,
      door het ontbreken van andere geëigende voorzieningen op die uitkering is aangewezen.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel20
  - number: '20.4'
    text: Op deze uitkering is het bepaalde in de artikelen 16 en 43 niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel20
  - number: '20.5'
    text: |-
      Voor de toepassing van deze wet worden onder minderjarige volle en halve wezen verstaan volle en halve wezen, die
      de leeftijd van 21 jaar nog niet hebben bereikt en niet gehuwd zijn of gehuwd geweest zijn.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel20
  - number: '21'
    text: |-
      Voor de vaststelling van het recht op buitengewoon pensioen, waarop krachtens de bepalingen van dit hoofdstuk recht
      kan bestaan, is het bepaalde in artikel 18, eerste lid, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel21
  - number: '22'
    text: |-
      Het buitengewoon pensioen, bedoeld in artikel 19, bedraagt: a. voor de weduwe, wier echtgenoot het leven heeft
      verloren in verband met het verzet, dan wel is overleden aan de gevolgen van verwonding, verminking, ziekten
      of gebreken, als bedoeld in artikel 6, alsmede voor de weduwe van de deelnemer aan het verzet, die is overleden
      door andere oorzaken dan hiervoor genoemd en wiens invaliditeit, waarnaar zijn buitengewoon pensioen laatstelijk
      was of zou zijn berekend, tenminste 60% bedroeg, 65% van de pensioengrondslag, die op grond van het bepaalde in
      artikel 10 voor de echtgenoot heeft of zou hebben gegolden, indien deze als deelnemer aan het verzet recht op
      buitengewoon pensioen had of zou hebben gehad. Indien er bij het overlijden van de deelnemer aan het verzet tevens
      recht of krachtens artikel 19, tweede lid, uitzicht op een of meerdere buitengewone pensioenen, als bedoeld onder
      *c*, bestaat, wordt het buitengewoon weduwenpensioen met het bedrag daarvan verminderd; b. voor de weduwe van de
      deelnemer aan het verzet, die het leven heeft verloren door andere oorzaken dan verwonding, verminking, ziekten of
      gebreken, als bedoeld in artikel 6, en wiens invaliditeit, waarnaar zijn buitengewoon pensioen laatstelijk was of
      zou zijn berekend, minder dan 60% bedroeg, 65% van het buitengewoon pensioen, waarop de deelnemer aan het verzet
      op het tijdstip van zijn overlijden recht had of zou hebben gehad. Indien er bij het overlijden van de deelnemer
      aan het verzet tevens recht of krachtens artikel 19, tweede lid, uitzicht op een of meer buitengewone pensioenen,
      als bedoeld onder *d*, bestaat, wordt het buitengewoon weduwenpensioen met het bedrag daarvan verminderd; c. voor
      de gewezen echtgenote van een overleden deelnemer aan het verzet, die is overleden aan de gevolgen van verwonding,
      verminking, ziekten of gebreken, als bedoeld in artikel 6, alsmede voor de gewezen echtgenote van een overleden
      deelnemer aan het verzet, die is overleden door andere oorzaken dan hiervoor genoemd en wiens invaliditeit,
      waarnaar zijn buitengewoon pensioen laatstelijk was of zou zijn berekend, tenminste 60% bedroeg, een bedrag,
      berekend volgens de formule: , in welke formule: *p voorstelt:* het aantal volle jaren, gedurende hetwelk de
      man in zijn leeftijdsperiode van 25 tot 65 jaar met de vrouw gehuwd is geweest, vermeerderd met het aantal volle
      jaren, gedurende hetwelk de man in dezelfde leeftijdsperiode vóór het sluiten van dat huwelijk zonder onderbreking
      ongehuwd is geweest, en *q voorstelt:* de pensioengrondslag, welke voor de man op het tijdstip van zijn overlijden
      gold of zou hebben gegolden; d. voor de gewezen echtgenote van een overleden deelnemer aan het verzet, die is
      overleden door andere oorzaken dan verwonding, verminking, ziekten of gebreken, als bedoeld in artikel 6, en wiens
      invaliditeit, waarnaar zijn buitengewoon pensioen laatstelijk was of zou zijn berekend, minder dan 60% bedroeg, een
      bedrag, berekend volgens de formule: , in welke formule: *x voorstelt:* het aantal volle jaren, gedurende hetwelk
      de man in zijn leeftijdsperiode van 25 tot 65 jaar met de vrouw gehuwd is geweest, vermeerderd met het aantal volle
      jaren, gedurende hetwelk de man in dezelfde leeftijdsperiode vóór het sluiten van dat huwelijk zonder onderbreking
      ongehuwd is geweest, en *y voorstelt:* het buitengewoon pensioen als bedoeld in artikel 11, waarop de man op het
      tijdstip van zijn overlijden recht had of zou hebben gehad.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel22
  - number: 22a
    text: |-
      Het buitengewoon pensioen van de weduwe, wier echtgenoot over een periode van ten minste drie maanden, voorafgaande
      aan zijn overlijden in het genot was gesteld van een blijvend buitengewoon pensioen uit hoofde van een invaliditeit
      van ten minste negentig procent wordt gedurende het eerste jaar na het overlijden van de echtgenoot verhoogd met
      twintig procent van de pensioengrondslag en gedurende het tweede jaar na het overlijden met tien procent van die
      grondslag, voor zover het verhoogde buitengewoon weduwen-pensioen daardoor gedurende het eerste jaar niet meer
      dan vijfentachtig procent van de minimum-pensioengrondslag bedraagt en gedurende het tweede jaar niet meer dan
      vijfenzeventig procent van die grondslag.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel22a
  - number: '23.1'
    text: |-
      Op de buitengewone pensioenen, toegekend aan de personen, bedoeld in [artikel 22][ref1], is het bepaalde
      in [artikel 16, eerste lid, tweede lid, onder b, ten eerste, alsmede het derde en vierde lid][ref2], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003968#Artikel16
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '22'
        hoofdstuk: Derde
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003968
        artikel: '16'
        hoofdstuk: Tweede
        paragraaf: '4'
  - number: '23.2'
    text: |-
      Voor zover door de weduwe of de gewezen echtgenote inkomsten uit vermogen worden genoten, worden deze voor 50%
      van die inkomsten op het buitengewoon pensioen in mindering gebracht, met dien verstande, dat indien die inkomsten
      minder dan € 680,67 per jaar bedragen, slechts een zodanig bedrag in mindering wordt gebracht als waarmede die
      inkomsten een som van € 340,34 mochten te boven gaan.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel23
  - number: '23.3'
    text: |-
      Voor zover door de weduwe of de gewezen echtgenote andere inkomsten dan waarop in het eerste en tweede lid wordt
      gedoeld, worden genoten, wordt 50% van het bedrag, waarmede die inkomsten de som van € 453,78 overschrijden, op
      het buitengewoon pensioen in mindering gebracht. Onverminderd het bepaalde in de vorige volzin worden, indien
      de daar bedoelde overschrijding uitsluitend of mede het gevolg is van het genot van een pensioen ingevolge de
      [Algemene Ouderdomswet][ref1] van meer dan € 453,78, van het bedrag, waarmede dat ouderdomspensioen de som van €
      453,78 overschrijdt, in plaats van 50% de volgende percentages op het buitengewoon pensioen in mindering gebracht:


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 23.3.a
    text: |-
      op een buitengewoon weduwenpensioen, dat geen vermindering als bedoeld in [artikel 22, onder a en b][ref1], heeft
      ondergaan: 60;


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel22
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '22'
        hoofdstuk: Derde
        paragraaf: '3'
  - number: 23.3.b
    text: |-
      op een buitengewoon weduwenpensioen, dat een vermindering als bedoeld in [artikel 22, onder a en b][ref1], heeft
      ondergaan: een evenredig deel van het onder *a* genoemde percentage;


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel22
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '22'
        hoofdstuk: Derde
        paragraaf: '3'
  - number: 23.3.c
    text: |-
      op het buitengewoon pensioen van de gewezen echtgenote, bedoeld in [artikel 22, onder c en d][ref1], een deel
      van 60%, hetwelk tot dat percentage in dezelfde verhouding staat als het aantal jaren, hetwelk in de in die
      artikelonderdelen genoemde berekeningsformule door de letter p onderscheidenlijk x wordt voorgesteld, zich verhoudt
      tot 40 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel22
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '22'
        hoofdstuk: Derde
        paragraaf: '3'
  - number: '23.4'
    text: |-
      Indien door de weduwe of de gewezen echtgenote zowel inkomsten bedoeld in het tweede lid als inkomsten bedoeld in
      het derde lid worden genoten, worden, in afwijking van het bepaalde aan het slot van het tweede lid, de inkomsten
      uit vermogen voor 50% van die inkomsten op het buitengewoon pensioen in mindering gebracht, met dien verstande, dat
      in elk geval een bedrag van € 340,34 van het totaal der inkomsten buiten mindering blijft.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel23
  - number: '23.5'
    text: |-
      Indien een uitkering ingevolge de [Algemene nabestaandenwet][ref1] wordt genoten, wordt die uitkering niet
      gerekend tot de met het buitengewoon pensioen verrekenbare inkomsten, als in de voorgaande leden bedoeld. In
      dat geval worden echter, nadat de voorgaande leden zijn toegepast, van het bedrag van de uitkering ingevolge de
      [Algemene nabestaandenwet][ref2] de volgende percentages op het buitengewoon pensioen in mindering gebracht:


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0007795
  - number: 23.5.a
    text: |-
      op een buitengewoon weduwenpensioen, dat geen vermindering als bedoeld in [artikel 22, onder a en b][ref1], heeft
      ondergaan: 60;


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel22
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '22'
        hoofdstuk: Derde
        paragraaf: '3'
  - number: 23.5.b
    text: |-
      op een buitengewoon weduwenpensioen, dat een vermindering als bedoeld in [artikel 22, onder a en b][ref1], heeft
      ondergaan: een evenredig deel van het onder *a* genoemde percentage;


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel22
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '22'
        hoofdstuk: Derde
        paragraaf: '3'
  - number: 23.5.c
    text: |-
      op het buitengewoon pensioen van de gewezen echtgenote, bedoeld in [artikel 22, onder c en d][ref1], een deel
      van 60%, hetwelk tot dat percentage in dezelfde verhouding staat als het aantal jaren, hetwelk in de in die
      artikelonderdelen genoemde berekeningsformule door de letter p onderscheidenlijk x wordt voorgesteld, zich verhoudt
      tot 40 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel22
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '22'
        hoofdstuk: Derde
        paragraaf: '3'
  - number: '23.6'
    text: |-
      Het ingevolge het eerste tot en met het vijfde lid met het buitengewoon pensioen van de weduwe en/of de gewezen
      echtgenote wegens het genot van neveninkomsten verrekenbare bedrag wordt beperkt tot het bedrag, waarmede het
      buitengewoon pensioen, vermeerderd met die neveninkomsten, 65% van de in [artikel 16, tweede lid, onder a][ref1],
      bedoelde grondslag overschrijdt, met dien verstande evenwel, dat de verrekening van een pensioen of uitkering als
      bedoeld in [artikel 16, derde lid][ref2], zomede de verrekening ter zake van een genoten uitkering ingevolge de
      [Algemene nabestaandenwet][ref3] en ter zake van een genoten pensioen ingevolge de [Algemene Ouderdomswet][ref4]
      onverkort gehandhaafd blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003968#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0007795
      [ref4]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '16'
        hoofdstuk: Tweede
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003968
        artikel: '16'
        hoofdstuk: Tweede
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0007795
      - id: ref4
        bwb_id: BWBR0002221
  - number: '26.1'
    text: |-
      Zij, die aanspraak menen te hebben op de voorzieningen van deze wet, dienen daartoe bij de Raad of de Sociale
      verzekeringsbank een aanvraag in.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel26
  - number: '26.2'
    text: Zij die erkend willen worden als deelnemer aan het verzet dienen daartoe bij de Raad een aanvraag in.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel26
  - number: '26.3'
    text: Op de aanvraag wordt de datum van ontvangst aangetekend.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel26
  - number: '26.4'
    text: |-
      De ontvangst van de aanvraag wordt de aanvrager schriftelijk bevestigd. Daarbij wordt hem voorlichting gegeven over
      de verdere procedure en de geldende behandeltermijnen.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel26
  - number: '26.5'
    text: Voor de begeleiding van zijn aanvraag kan de aanvrager zich wenden tot de Stichting Pelita.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel26
  - number: '27.1'
    text: |-
      Alvorens op een aanvraag om een buitengewoon pensioen dan wel een aanvraag erkend te worden als deelnemer aan het
      verzet wordt beslist, wordt een rapport opgesteld omtrent de omstandigheden waarop de aanvraag berust.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel27
  - number: '27.2'
    text: |-
      Binnen vier maanden nadat de opdracht daartoe is ingekomen, wordt door de Stichting Pelita in de opstelling van het
      rapport voorzien, met dien verstande dat in de opstelling van het rapport binnen vier weken wordt voorzien, indien
      de aanvraag afkomstig is van een persoon als bedoeld in de [artikelen 19][ref1] en [20][ref2] en de overledene aan
      wie de aanvrager zijn aanspraken wenst te ontlenen, aanspraken op deze wet heeft doen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0003968#Artikel20
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '19'
        hoofdstuk: Derde
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003968
        artikel: '20'
        hoofdstuk: Derde
        paragraaf: '1'
  - number: '27.3'
    text: |-
      De Stichting Pelita voegt binnen de in het tweede lid genoemde termijn van vier maanden aan het rapport een
      verklaring toe dat op grond van de daarin opgenomen gegevens naar haar oordeel de aanvrager of de overledene al dan
      niet kan worden aangemerkt als deelnemer aan het verzet in de zin van deze wet en dat een omstandigheid als bedoeld
      in [artikel 3, derde lid][ref1], al dan niet aanwezig is. Indien de aanvraag afkomstig is van een persoon, bedoeld
      in de [artikelen 19][ref2] en [20][ref3], en de overledene aan wie de aanvrager zijn aanspraken wenst te ontlenen
      aanspraken op deze wet heeft doen gelden, geeft de Stichting Pelita de verklaring, waaruit blijkt of ten aanzien
      van de aanvrager een omstandigheid als bedoeld in [artikel 3, derde lid][ref4], al dan niet aanwezig is, binnen de
      in het tweede lid gestelde termijn van vier weken af.


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003968#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0003968#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0003968#Artikel3
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '3'
        hoofdstuk: Eerste
      - id: ref2
        bwb_id: BWBR0003968
        artikel: '19'
        hoofdstuk: Derde
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003968
        artikel: '20'
        hoofdstuk: Derde
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0003968
        artikel: '3'
        hoofdstuk: Eerste
  - number: '27.4'
    text: |-
      Indien de Stichting Pelita niet tijdig in de rapportage en de verklaring voorziet, kan de Raad, met instemming van
      de betrokkene, besluiten op andere wijze de benodigde informatie in te winnen.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel27
  - number: '28.1'
    text: |-
      Van de beschikking wordt mededeling gedaan aan de Stichting Pelita. Bij de bekendmaking van de beschikking wordt
      voorlichting gegeven over de procedure en de voor het bezwaarschrift geldende termijn van behandeling.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel28
  - number: '28.2'
    text: |-
      De beschikking op een aanvraag krachtens [artikel 6][ref1] onderscheidenlijk de [artikelen 19][ref2] en [20][ref3]
      voor zover de overleden deelnemer aan het verzet geen aanspraken op deze wet heeft doen gelden, wordt gegeven
      binnen negen maanden na de datum waarop de aanvraag is ingekomen. Indien de Raad ten gevolge van bijzondere
      omstandigheden niet binnen deze termijn kan beslissen, kan hij eenmaal met ten hoogste acht weken worden verlengd.
      Van de verlenging doet de Raad schriftelijk mededeling aan de belanghebbende en de Stichting Pelita.


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003968#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0003968#Artikel20
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '6'
        hoofdstuk: Tweede
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003968
        artikel: '19'
        hoofdstuk: Derde
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003968
        artikel: '20'
        hoofdstuk: Derde
        paragraaf: '1'
  - number: '28.3'
    text: |-
      De beschikking op een aanvraag krachtens [artikel 26, tweede lid][ref1], wordt gegeven binnen zes maanden na de
      datum waarop de aanvraag is ingekomen. Indien de Raad ten gevolge van bijzondere omstandigheden niet binnen deze
      termijn kan beslissen, kan hij eenmaal met ten hoogste vier weken worden verlengd. Van de verlenging doet de Raad
      schriftelijk mededeling aan de belanghebbende en aan de Stichting Pelita.


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel26
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '26'
        hoofdstuk: Vijfde
  - number: '28.4'
    text: |-
      De beschikking op een aanvraag krachtens [artikel 15][ref1], [artikel 6][ref2], voorzover de aanvrager reeds
      op grond van [artikel 26, tweede lid][ref3], als deelnemer aan het verzet is erkend, onderscheidenlijk de
      [artikelen 19][ref4] en [20][ref5] voor zover de overleden deelnemer aan het verzet aanspraken op deze wet heeft
      doen gelden, wordt gegeven binnen dertien weken na de datum waarop de aanvraag is ingekomen. Indien de Raad of de
      Sociale verzekeringsbank ten gevolge van bijzondere omstandigheden niet binnen deze termijn kan beslissen, kan hij
      eenmaal met ten hoogste vier weken worden verlengd. Van de verlenging doet de Raad of de Sociale verzekeringsbank
      schriftelijk mededeling aan de belanghebbende en de Stichting Pelita.


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003968#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003968#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0003968#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0003968#Artikel20
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '15'
        hoofdstuk: Tweede
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003968
        artikel: '6'
        hoofdstuk: Tweede
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003968
        artikel: '26'
        hoofdstuk: Vijfde
      - id: ref4
        bwb_id: BWBR0003968
        artikel: '19'
        hoofdstuk: Derde
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0003968
        artikel: '20'
        hoofdstuk: Derde
        paragraaf: '1'
  - number: '28.5'
    text: |-
      Met betrekking tot een aanvraag, bedoeld in het derde lid, die wordt ingediend terwijl een aanvraag, bedoeld
      in het tweede lid, nog in behandeling is geldt, in afwijking van het derde lid, de termijn die resteert voor de
      beschikking op de aanvraag, bedoeld in het tweede lid, tenzij de resterende termijn korter is dan de termijn,
      bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel28
  - number: 28a.1
    text: |-
      Indien de Raad vier weken voor het verstrijken van de verlengde termijn, bedoeld in [artikel 28, tweede lid][ref1],
      onvoldoende gegevens aanwezig acht om tot een beoordeling van de aanvraag te komen en dientengevolge niet in staat
      is een beschikking te geven, stelt hij de aanvrager gedurende die vier weken in de gelegenheid zijn zienswijze naar
      voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel28
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '28'
        hoofdstuk: Vijfde
  - number: 28a.2
    text: |-
      [Artikel 4:9 van de Algemene wet bestuursrecht][ref1] is op het horen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 28a.3
    text: Indien de aanvrager zijn zienswijze mondeling naar voren brengt, wordt een verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel28a
  - number: '29.1'
    text: |-
      Indien de aanvrager kennis wenst te nemen van gegevens welke mede tot de beschikking van de Raad of de Sociale
      verzekeringsbank hebben geleid, worden deze hem op zijn verzoek alsnog door de Raad of de Sociale verzekeringsbank
      verstrekt, indien en voor zover door het verstrekken van deze gegevens geen inbreuk wordt gemaakt op de
      persoonlijke levenssfeer van derden.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel29
  - number: '29.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de vergoeding welke verschuldigd is,
      indien afschrift wordt verstrekt van de op de beschikking betrekking hebbende bescheiden.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel29
  - number: '30.1'
    text: 'Het buitengewoon pensioen of de uitkering gaat in:'
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel30
  - number: 30.1.a
    text: |-
      met ingang van de eerste dag van de maand volgende op die waarin de aanvraag is ingediend, behoudens het bepaalde
      onder *b* en in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel30
  - number: 30.1.b
    text: |-
      voor de weduwe, gewezen echtgenote of de minderjarige volle of halve wees, die binnen dertien weken na het
      overlijden van de deelnemer aan het verzet die een buitengewoon pensioen ingevolge deze wet genoot, aanspraak op
      een buitengewoon pensioen of uitkering maakt, met ingang van de eerste dag van de maand volgend op die, waarin het
      overlijden heeft plaatsgehad.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel30
  - number: '30.2'
    text: |-
      Een buitengewoon pensioen, dat verleend wordt na beëindiging van een voorlopig buitengewoon pensioen, gaat in op de
      dag, volgende op die, waarop het vorige buitengewoon pensioen heeft opgehouden, mits binnen dertien weken na afloop
      van dat voorlopig buitengewoon pensioen door of namens betrokkene een aanvraag daartoe wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel30
  - number: '31.1'
    text: Elk buitengewoon pensioen eindigt met het einde van de maand, waarin de rechthebbende is overleden.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel31
  - number: '31.2'
    text: |-
      De uitkering van de in artikel 20, eerste lid, bedoelde kinderen eindigt tevens met het einde van de maand, waarin
      de rechthebbende:
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel31
  - number: 31.2.a
    text: de leeftijd van 21 jaren heeft bereikt tenzij artikel 20, derde lid, van toepassing is;
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel31
  - number: 31.2.b
    text: in het huwelijk is getreden;
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel31
  - number: 31.2.c
    text: is geadopteerd.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel31
  - number: '31.3'
    text: |-
      Een vervallen verklaard of ingetrokken buitengewoon pensioen of uitkering eindigt met het einde van de maand,
      waarin de beschikking inzake het vervallen verklaren of de intrekking is gegeven.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel31
  - number: '32'
    text: |-
      Het buitengewoon pensioen van de weduwe en dat van een gewezen echtgenote eindigen voorts met het einde van het
      kwartaal, waarin een volgend door haar gesloten huwelijk heeft plaatsgehad. Indien dat huwelijk wordt ontbonden,
      wordt op haar aanvraag bij de Sociale verzekeringsbank haar vroeger buitengewoon pensioen weder toegekend. Zouden
      haar echter ter zake van het latere huwelijk pensioen of andere inkomsten toekomen, als bedoeld in artikel 16,
      derde lid, dan vindt deze wetsbepaling overeenkomstige toepassing. Het buitengewoon pensioen gaat opnieuw in op
      de eerste dag van de maand volgende op die waarin de ontbinding van het huwelijk heeft plaatsgevonden, mits de
      aanvraag binnen dertien weken na de datum van de ontbinding van het vorige huwelijk is ingediend. Wordt de aanvraag
      later ingediend, dan gaat het buitengewoon pensioen in op de eerste dag van de maand volgende op die waarop de
      aanvraag bij de Sociale verzekeringsbank is binnengekomen.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel32
  - number: '33'
    text: |-
      Het buitengewoon pensioen van de weduwe en dat van een gewezen echtgenote worden niet uitbetaald over de tijd,
      gedurende welke de vrouw in concubinaat leeft.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel33
  - number: '34.1'
    text: |-
      Zo spoedig mogelijk na het overlijden van een deelnemer aan het verzet, die op het tijdstip van zijn overlijden
      recht op buitengewoon pensioen ontleende aan [artikel 6][ref1], wordt een uitkering (overlijdensuitkering) ten
      bedrage van tweemaal het bedrag van het buitengewoon pensioen van de overledene over de maand, waarin hij is
      overleden, uitbetaald aan de langstlevende der echtgenoten, indien de overledene niet duurzaam van de andere
      echtgenoot gescheiden leefde, dan wel bij diens ontstentenis aan degenen, ten aanzien van wie de overledene ten
      tijde van het overlijden grotendeels in de kosten van het bestaan voorzag en met wie hij tot zijn overlijden
      duurzaam in gezinsverband heeft geleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel6
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '6'
        hoofdstuk: Tweede
        paragraaf: '1'
  - number: '34.2'
    text: |-
      In het eerste lid wordt onder buitengewoon pensioen verstaan: het pensioen, bedoeld in [artikel 11][ref1], verhoogd
      met de vermeerdering, bedoeld in de [artikelen 12][ref2], [13][ref3] en [14][ref4], ongeacht het bepaalde in
      [artikel 16][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003968#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0003968#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0003968#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0003968#Artikel16
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '11'
        hoofdstuk: Tweede
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003968
        artikel: '12'
        hoofdstuk: Tweede
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0003968
        artikel: '13'
        hoofdstuk: Tweede
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0003968
        artikel: '14'
        hoofdstuk: Tweede
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0003968
        artikel: '16'
        hoofdstuk: Tweede
        paragraaf: '4'
  - number: '34.3'
    text: |-
      Indien er geen rechthebbenden als bedoeld in het eerste lid zijn, is de Sociale verzekeringsbank bevoegd de in
      dat lid bedoelde uitkering geheel of gedeeltelijk uit te betalen aan de persoon, die daarvoor naar zijn oordeel op
      billijkheidsoverwegingen in aanmerking komt, mits deze daartoe binnen zes maanden na het overlijden een verzoek bij
      genoemde Raad heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel34
  - number: '34.4'
    text: |-
      Op een krachtens dit artikel verleende uitkering worden op grond van hetzelfde overlijden krachtens andere
      wettelijke voorschriften verstrekte uitkeringen van overeenkomstige aard in mindering gebracht, indien die andere
      uitkeringen voortvloeien uit door de overledene genoten inkomsten als bedoeld in [artikel 16, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel16
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '16'
        hoofdstuk: Tweede
        paragraaf: '4'
  - number: '34.5'
    text: |-
      Indien meer pensioen is uitbetaald dan overeenstemt met [artikel 31][ref1], wordt het te veel betaalde
      teruggevorderd, voor zover verrekening daarvan kan plaatsvinden met een overlijdensuitkering krachtens dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel31
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '31'
        hoofdstuk: Zesde
  - number: '35.1'
    text: |-
      Het buitengewoon pensioen of de garantietoeslag wordt door de Sociale verzekeringsbank
      aangepast overeenkomstig de normen en voorwaarden waarmee het bedrag, genoemd in
      [artikel 8, eerste lid, onder a, van de Wet minimumloon en minimumvakantiebijslag][ref1] ingevolge
      [artikel 14 van die wet][ref2] wordt herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '14'
  - number: '35.2'
    text: |-
      De pensioengrondslagen, bedoeld in [artikel 10, eerste, tweede en zesde lid][ref1], en de bedragen, genoemd in
      [artikel 10, achtste lid][ref2], worden door Onze Minister aangepast overeenkomstig de normen en voorwaarden waarmee
      het bedrag, genoemd in [artikel 8, eerste lid, onder a, van de Wet minimumloon en minimumvakantiebijslag][ref3]
      ingevolge [artikel 14 van die wet][ref4] wordt herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003968#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '10'
        hoofdstuk: Tweede
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003968
        artikel: '10'
        hoofdstuk: Tweede
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002638
        artikel: '14'
  - number: '35.3'
    text: |-
      Bij de aanpassing, bedoeld in het eerste lid, wordt uitgegaan van het laatst vastgestelde dan wel overeenkomstig
      het eerste lid aangepaste buitengewoon pensioen of de laatst vastgestelde dan wel overeenkomstig het eerste lid
      aangepaste garantietoeslag.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel35
  - number: '35.4'
    text: De aanpassing, bedoeld in het eerste lid, vindt plaats zonder dat dit bij beschikking is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel35
  - number: '35.5'
    text: |-
      Het aangepaste buitengewoon pensioen of de aangepaste garantietoeslag, bedoeld in het vierde lid, wordt betaald bij
      de eerstvolgende betaling nadat de aanpassing heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel35
  - number: 35a.1
    text: Indien het maandinkomen van
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel35a
  - number: 35a.1.a
    text: een deelnemer aan het verzet die recht heeft op een buitengewoon pensioen,
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel35a
  - number: 35a.1.b
    text: de weduwe, genoemd in artikel 19, eerste lid, die recht heeft op een buitengewoon pensioen, dan wel
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel35a
  - number: 35a.1.c
    text: de weduwnaar, genoemd in artikel 19, vierde lid, onder *a*, die recht heeft op een buitengewoon pensioen,
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel35a
  - number: 35a.2
    text: Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot het inkomen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel35a
  - number: 35b
    text: 'Het van toepassing zijnde normbedrag bedraagt:'
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel35b
  - number: 35b.a
    text: |-
      voor de gepensioneerde die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], nog niet heeft bereikt: zeventig procent van de
      minimum-pensioengrondslag op maandbasis;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 35b.b
    text: |-
      voor de gepensioneerde die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft bereikt: vijftig procent van de minimum-
      pensioengrondslag op maandbasis, vermeerderd met twintig procent van het bedrag van het bruto-ouderdomspensioen
      voor de pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onder a, van de Algemene Ouderdomswet][ref2]
      alsmede van het bedrag van de bruto-vakantie-uitkering, vastgesteld overeenkomstig
      [artikel 29, eerste lid, aanhef en onder b, van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel29
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '29'
  - number: 35c
    text: De garantietoeslag gaat in op de eerste dag van de maand, waarin het recht op de garantietoeslag is ontstaan.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel35c
  - number: 35d.1
    text: |-
      Indien de pensioengerechtigde over zijn buitengewoon pensioen of garantietoeslag de inkomensafhankelijke bijdrage,
      bedoeld in [artikel 43 van de Zorgverzekeringswet][ref1], verschuldigd is, heeft hij recht op een toeslag. Deze
      toeslag bedraagt het percentage van het buitengewoon pensioen of de garantietoeslag dat overeenkomt met het
      bijdragepercentage, bedoeld in [artikel 45, tweede lid, van de Zorgverzekeringswet][ref2], vermenigvuldigd met
      anderhalf, voorzover het pensioen of garantietoeslag is te rekenen tot het deel van het bijdrage-inkomen, bedoeld
      in [artikel 43, tweede lid, onderdeel a, van de Zorgverzekeringswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel43
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '45'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '43'
  - number: 35d.2
    text: |-
      Indien de pensioengerechtigde over zijn buitengewoon pensioen of garantietoeslag de bijdrage, bedoeld in
      [artikel 69, tweede lid, van de Zorgverzekeringswet][ref1], verschuldigd is, heeft hij recht op een toeslag. Voor
      de berekening van deze toeslag is het eerste lid, tweede volzin, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '69'
  - number: 35d.3
    text: |-
      Het in aanmerking te nemen bijdrage-inkomen bedraagt op jaarbasis ten hoogste het bedrag, bedoeld in
      [artikel 43, derde lid, van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel43
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '43'
  - number: 35d.4
    text: |-
      Op de toeslagen, bedoeld in het eerste en tweede lid, is het [achtste hoofdstuk][ref1] van toepassing, met
      uitzondering van de [artikelen 36][ref2] en [41][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003968#HoofdstukAchtste
      [ref2]: https://wetten.overheid.nl/BWBR0003968#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0003968#Artikel41
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0003968
        hoofdstuk: Achtste
      - id: ref2
        bwb_id: BWBR0003968
        artikel: '36'
        hoofdstuk: Achtste
      - id: ref3
        bwb_id: BWBR0003968
        artikel: '41'
        hoofdstuk: Achtste
  - number: '36'
    text: |-
      Het buitengewoon pensioen, bedoeld in de artikelen 11, 22 en 22*a*, de garantietoeslag genoemd in artikel 35*a*,
      alsmede de vermeerdering, genoemd in de artikelen 12, 13 en 14, worden naar boven afgerond tot hele euro’s.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel36
  - number: '37.1'
    text: De buitengewone pensioenen en de garantietoeslagen worden maandelijks voldaan.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel37
  - number: '37.2'
    text: |-
      De eerste termijn wordt zo spoedig mogelijk, doch uiterlijk binnen dertien weken na de toekenning, vastgesteld
      en betaald.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel37
  - number: '37.3'
    text: |-
      Indien de door belanghebbende verstrekte gegevens en bescheiden onvoldoende zijn voor het vaststellen van het
      bedrag van de eerste termijn, verzoekt de Sociale verzekeringsbank de belanghebbende deze gegevens en bescheiden
      alsnog te verstrekken. De periode van dertien weken, bedoeld in het tweede lid, wordt in zodanig geval opgeschort
      met ingang van de dag waarop de Sociale verzekeringsbank vorenbedoeld verzoek heeft gedaan tot de dag waarop de
      gegevens en bescheiden zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel37
  - number: '37.4'
    text: |-
      De termijnen van een buitengewoon pensioen en van een garantietoeslag, welke niet zijn ingevorderd binnen een jaar
      na de eerste maand, waarin de uitkering daarvan had mogen plaats hebben, worden niet meer uitbetaald, tenzij de
      belanghebbende ten genoegen van de Sociale verzekeringsbank kan aantonen, dat het overschrijden van die termijn het
      gevolg is geweest van omstandigheden, van zijn wil onafhankelijk.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel37
  - number: '37.5'
    text: |-
      Het betaalbaar stellen van een buitengewoon pensioen en van een garantietoeslag door de Sociale verzekeringsbank
      geschiedt op dezelfde voet als het betaalbaar stellen van de pensioenen ten laste van het Algemeen burgerlijk
      pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel37
  - number: '38.1'
    text: |-
      De gepensioneerde, die is veroordeeld tot een vrijheidsstraf van drie maanden, tot plaatsing in een
      Rijkswerkinrichting, tot plaatsing in een tuchtschool voor drie maanden, of tot enige zwaardere straf, of op
      bevel van de rechter ter beschikking van de Regering is gesteld, mist over de tijd gedurende welke hij zijn straf
      ondergaat of van Regeringswege in zijn opvoeding wordt voorzien, of gedurende welke hij zich door de vlucht aan de
      tenuitvoerlegging van het vonnis onttrekt, het genot van buitengewoon pensioen en garantietoeslag.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel38
  - number: '38.2'
    text: |-
      De Sociale verzekeringsbank is bevoegd het buitengewoon pensioen en de garantietoeslag over die tijd geheel of ten
      dele aan of ten behoeve van de echtgenoot of minderjarige kinderen van de gepensioneerde te doen uitbetalen.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel38
  - number: '38.3'
    text: |-
      De Sociale verzekeringsbank is tevens bevoegd om, voor zover van de bevoegdheid in het tweede lid bedoeld, geen
      gebruik is gemaakt, de gepensioneerde, die al of niet voorwaardelijk uit de gevangenis, uit de Rijkswerkinrichting
      of uit de tuchtschool is ontslagen, of wiens opvoeding van Regeringswege is beëindigd, in het genot te stellen van
      een uitkering ten bedrage van ten hoogste de helft van het niet uitgekeerde bedrag, tot een maximum van de helft
      van het jaarlijkse bedrag van het buitengewoon pensioen en garantietoeslag.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel38
  - number: '39.1'
    text: 'Het buitengewoon pensioen wordt door de Sociale verzekeringsbank vervallen verklaard:'
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel39
  - number: 39.1.a
    text: |-
      wanneer gedurende vijf achtereenvolgende jaren na de eerste dag, waarop een termijn daarvan kan worden geïnd,
      iedere invordering is achterwege gebleven;
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel39
  - number: 39.1.b
    text: |-
      wanneer de gepensioneerde zonder Onze toestemming zich in vreemde krijgsdienst of vreemde burgerlijke
      overheidsdienst begeeft.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel39
  - number: '39.2'
    text: |-
      In bijzondere gevallen kan een op grond van dit artikel vervallen buitengewoon pensioen door de Sociale
      verzekeringsbank opnieuw worden toegekend. Een dergelijk besluit wordt niet genomen dan nadat daarin bij koninklijk
      besluit is toegestemd. Toestemming kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel39
  - number: '40'
    text: |-
      Indien een gepensioneerde in een inrichting ter verpleging van geesteszieken of zwakzinnigen is opgenomen, of, niet
      opgenomen zijnde in een zodanige inrichting, op grond van geestelijke gestoordheid niet in staat is kwijting te
      verlenen voor de uitbetaling van zijn buitengewoon pensioen en zijn garantietoeslag, is de Sociale verzekeringsbank
      bevoegd het buitengewoon pensioen en de garantietoeslag uit te betalen aan een door hem aan te wijzen persoon of
      instelling. In andere bijzondere gevallen is de Sociale verzekeringsbank eveneens bevoegd het buitengewoon pensioen
      en de garantietoeslag in plaats van aan de gepensioneerde zonder diens machtiging uit te betalen aan een door hem
      aan te wijzen persoon of instelling.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel40
  - number: '41'
    text: |-
      De Sociale verzekeringsbank is bevoegd geheel of gedeeltelijk van invordering af te zien van uit de toepassing van
      deze wet voortvloeiende aan het Rijk toekomende vorderingen, dan wel deze vorderingen geheel of gedeeltelijk kwijt
      te schelden. Een dergelijk besluit wordt niet genomen dan nadat Onze Minister daarin heeft toegestemd. Toestemming
      kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel41
  - number: '42.1'
    text: Geen enkele voorziening ingevolge deze wet is vatbaar voor vervreemding of verpanding.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel42
  - number: '42.2'
    text: De overlijdensuitkering, genoemd in artikel 34, en de vergoedingen zijn niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel42
  - number: '42.3'
    text: |-
      Volmacht tot ontvangst van een buitengewoon pensioen, van de overlijdensuitkering, genoemd in artikel 34, de
      garantietoeslag, genoemd in artikel 35*a*, of van de vergoedingen is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel42
  - number: '42.4'
    text: Elk beding, strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel42
  - number: '44'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor het indienen van
      het bezwaarschrift dertien weken, indien de belanghebbende in het buitenland gevestigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 44b.1
    text: Van de beslissing op het bezwaarschrift wordt mededeling gedaan aan de Stichting Pelita.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel44b
  - number: 44b.2
    text: Artikel 29 is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel44b
  - number: 44b.3
    text: |-
      In afwijking van [artikel 7:10, eerste, derde en vierde lid, van de Algemene wet bestuursrecht][ref1] beslist de
      Raad of de Sociale verzekeringsbank binnen dertien weken gerekend vanaf de dag na die waarop de termijn voor het
      indienen van het bezwaarschrift is verstreken. Ingeval van bijzondere omstandigheden kan deze termijn eenmaal met
      ten hoogste vier weken worden verlengd. Van de verlenging doet de Raad of de Sociale verzekeringsbank schriftelijk
      mededeling aan de belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 44b.4
    text: |-
      Indien de belanghebbende in het buitenland gevestigd is, worden de termijnen, bedoeld in het derde lid, ieder met
      acht weken verlengd.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel44b
  - number: '45'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor het indienen van
      een beroepschrift dertien weken, indien de belanghebbende in het buitenland is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '47'
    text: |-
      Indien de verwonding, verminking, ziekten of gebreken, als bedoeld in artikel 6, de deelnemer aan het verzet
      in een toestand brengen die hem recht geven op een hoger buitengewoon pensioen dan verleend werd, wordt het
      invaliditeitspercentage opnieuw vastgesteld en wordt hij met ingang van de eerste dag van de maand volgend op die
      waarin door of namens hem een aanvraag daartoe is ingediend, alsnog in het genot gesteld van een hoger buitengewoon
      pensioen.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel47
  - number: '48.1'
    text: |-
      Een beschikking van de Raad of de Sociale verzekeringsbank kan door hem in het nadeel van de bij die beschikking
      betrokkene worden herzien op grond van gebleken onjuistheid van aan die beschikking ten grondslag gelegde feiten,
      dan wel op grond van gegevens die niet bekend waren ten tijde van het geven van die beschikking, en die, zo zij wel
      bekend waren geweest, tot een andersluidende beschikking zouden hebben geleid. Indien deze herziening zou leiden
      tot intrekking van het recht op buitengewoon pensioen, wordt de herzieningsbeschikking eerst gegeven, nadat de
      betrokkene door de Raad of de Sociale verzekeringsbank is gehoord.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel48
  - number: '48.2'
    text: |-
      Indien een ingevolge deze wet genomen beschikking in het nadeel van de belanghebbende wordt herzien, wordt
      hetgeen reeds was uitbetaald ingevolge die beschikking niet teruggevorderd of verrekend, tenzij in de
      herzieningsbeschikking is uitgesproken, dat de gebleken onjuistheid van de aan de oorspronkelijke beschikking ten
      grondslag gelegde feiten was te wijten aan opzet dan wel grove nalatigheid van belanghebbende.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel48
  - number: '48.3'
    text: Een beschikking, voortvloeiende uit de toepassing van dit artikel, wordt aan de Stichting Pelita medegedeeld.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel48
  - number: '49'
    text: |-
      De Raad of de Sociale verzekeringsbank is bevoegd, op daartoe door of vanwege de belanghebbende gedane aanvraag,
      een door de Raad of de Sociale verzekeringsbank of de Centrale Raad van Beroep gegeven beschikking dan wel
      uitspraak in het voordeel van de bij die beschikking dan wel uitspraak betrokkene te herzien.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel49
  - number: 49a
    text: |-
      Op een beschikking, voortvloeiende uit de toepassing van de [artikelen 47][ref1] en [49][ref2] is het
      vijfde hoofdstuk van overeenkomstige toepassing, met uitzondering van [artikel 28, tweede lid][ref3] en
      [artikel 28a][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0003968#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0003968#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0003968#Artikel28a
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '47'
        hoofdstuk: Tiende
      - id: ref2
        bwb_id: BWBR0003968
        artikel: '49'
        hoofdstuk: Tiende
      - id: ref3
        bwb_id: BWBR0003968
        artikel: '28'
        hoofdstuk: Vijfde
      - id: ref4
        bwb_id: BWBR0003968
        artikel: 28a
        hoofdstuk: Vijfde
  - number: 49b.1
    text: |-
      Het buitengewoon pensioen of de garantietoeslag wordt, met uitzondering van de op grond van [artikel 10][ref1]
      vastgestelde pensioengrondslag en het invaliditeitspercentage, bedoeld in [artikel 11][ref2], opnieuw vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003968#Artikel11
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '10'
        hoofdstuk: Tweede
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003968
        artikel: '11'
        hoofdstuk: Tweede
        paragraaf: '4'
  - number: 49b.1.a
    text: |-
      wanneer de pensioengerechtigde of zijn echtgenoot de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 49b.1.b
    text: |-
      wanneer de pensioengerechtigde in het huwelijk treedt of zijn huwelijk wordt beëindigd door echtscheiding of
      overlijden van zijn echtgenoot;
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel49b
  - number: 49b.1.c
    text: wanneer de pensioengerechtigde duurzaam gescheiden van zijn echtgenoot gaat leven;
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel49b
  - number: 49b.1.d
    text: wanneer een kind of pleegkind van de pensioengerechtigde meerderjarig wordt;
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel49b
  - number: 49b.1.e
    text: wanneer de pensioengerechtigde aanspraak maakt op de betaling uit een nieuwe bron van inkomsten, of
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel49b
  - number: 49b.1.f
    text: |-
      wanneer de pensioengerechtigde geen aanspraak meer kan maken op de betaling uit een bron van inkomsten, tenzij hij
      het vervallen van die aanspraak heeft bewerkstelligd.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel49b
  - number: 49b.2
    text: |-
      Het eerste lid, onder e en f, is van overeenkomstige toepassing op de inkomsten van de echtgenoot van de
      pensioengerechtigde, voor zover die inkomsten de hoogte van het buitengewoon pensioen of de garantietoeslag mede
      bepalen.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel49b
  - number: 49b.3
    text: |-
      De beschikking, bedoeld in het eerste en tweede lid, wordt genomen binnen 13 weken nadat de noodzakelijke gegevens
      ter kennis van de Sociale verzekeringsbank zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel49b
  - number: 49b.4
    text: |-
      Hetgeen als gevolg van een beschikking als bedoeld in het eerste of tweede lid te veel dan wel te weinig is
      uitbetaald, wordt door de Sociale verzekeringsbank teruggevorderd of verrekend dan wel nabetaald. De terugvordering
      kan in door de Sociale verzekeringsbank te bepalen termijnen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel49b
  - number: 49c.1
    text: |-
      Op aanvraag van de gerechtigde wordt het buitengewoon pensioen of de garantietoeslag, met uitzondering van
      de op grond van [artikel 10][ref1] vastgestelde pensioengrondslag en het invaliditeitspercentage, bedoeld in
      [artikel 11][ref2], opnieuw vastgesteld indien het vast te stellen pensioen ten minste 1% van de op de datum van
      deze aanvraag geldende pensioengrondslag of de vast te stellen garantietoeslag ten minste 1% van de op de datum van
      deze aanvraag geldende minimum-pensioengrondslag op maandbasis hoger is dan het laatst vastgestelde of aangepaste
      pensioen of de laatst vastgestelde of aangepaste garantietoeslag, mits dit niet uitsluitend het gevolg is van de
      koersomrekening van inkomsten die door de gerechtigde of zijn echtgenoot worden ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003968#Artikel11
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel49c
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '10'
        hoofdstuk: Tweede
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003968
        artikel: '11'
        hoofdstuk: Tweede
        paragraaf: '4'
  - number: 49c.2
    text: |-
      Indien toepassing is gegeven aan het eerste lid gaat het opnieuw vastgestelde buitengewoon pensioen of de opnieuw
      vastgestelde garantietoeslag in op de eerste dag van de maand waarin de aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel49c
  - number: 49c.3
    text: |-
      Op een beschikking, voortvloeiende uit de toepassing van het eerste lid, is [artikel 28, vijfde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003968#Artikel28
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel49c
    references:
      - id: ref1
        bwb_id: BWBR0003968
        artikel: '28'
        hoofdstuk: Vijfde
  - number: '50'
    text: |-
      De belanghebbende is verplicht desgevraagd die inlichtingen te verstrekken die noodzakelijk zijn voor de uitvoering
      van deze wet of krachtens deze wet vastgestelde algemene maatregelen van bestuur.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel50
  - number: '54.1'
    text: |-
      Van de beschikkingen van de Raad of de Sociale verzekeringsbank wordt mededeling gedaan aan Onze Minister door
      toezending van een afschrift.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel54
  - number: '54.2'
    text: |-
      Onze Minister kan, indien hij daartoe aanleiding aanwezig acht, van de Raad of de Sociale verzekeringsbank inzage
      vorderen van de bescheiden, die tot enige beschikking van de Raad of de Sociale verzekeringsbank hebben geleid.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel54
  - number: '54.3'
    text: |-
      Indien Onze Minister daartoe aanleiding aanwezig acht, verstrekt de Raad of de Sociale verzekeringsbank hem op zijn
      verzoek schriftelijk inlichtingen omtrent de achtergronden die tot enige beschikking hebben geleid.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel54
  - number: '54.4'
    text: |-
      Onze Minister voert, indien hij daartoe aanleiding aanwezig acht, ter zake overleg met de Raad of de Sociale
      verzekeringsbank.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel54
  - number: '54.5'
    text: |-
      Indien het in het vierde lid bedoelde overleg niet tot overeenstemming leidt, beslist de Raad of de Sociale
      verzekeringsbank dat de oorspronkelijke beschikking blijft gehandhaafd dan wel wordt herzien. Hiervan doet de Raad
      of de Sociale verzekeringsbank terstond, met redenen omkleed, schriftelijk mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel54
  - number: '54.6'
    text: |-
      Het bepaalde in het vierde en vijfde lid vindt geen toepassing indien en voor zolang geen beschikking is
      genomen ter zake van een bezwaarschrift dan wel een beroepschrift tenzij Onze Minister de Raad of de Sociale
      verzekeringsbank om inlichtingen, bedoeld in het derde lid, heeft verzocht ter zake van een uitspraak of onderdeel
      daarvan waartegen het bezwaarschrift of het beroep zich niet richt.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel54
  - number: '60'
    text: |-
      Voor degene die een aanvraag om een buitengewoon pensioen indient binnen drie maanden na de datum van het in
      werking treden van deze wet, gaat het buitengewoon pensioen zonodig in op de datum tot welke deze wet terugwerkt.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel60
  - number: '61'
    text: |-
      In afwijking van hetgeen is bepaald in artikel 35 omtrent de herziening van de pensioengrondslagen en de bedragen
      bedoeld in artikel 10, worden deze pensioengrondslagen en bedragen over de periode 1 januari 1983 tot de datum van
      de eerstvolgende herziening na de datum van inwerkingtreding van deze wet herzien overeenkomstig de ontwikkelingen
      welke de pensioenbedragen ingevolge de [Wet buitengewoon pensioen 1940-1945][ref1] over genoemde periode hebben
      gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002032
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002032
  - number: '62.1'
    text: |-
      In het belang van een goede uitvoering van deze wet kunnen bij of krachtens algemene maatregel van bestuur nadere
      regelen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel62
  - number: '62.2'
    text: |-
      De krachtens het eerste lid vastgestelde maatregel van bestuur wordt aan beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 30 dagen na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een der Kamers of door ten minste een vijfde van het grondwettelijk aantal
      leden van een der Kamers de wens is te kennen gegeven dat het in die maatregel geregelde onderwerp bij wet wordt
      geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel62
  - number: '63'
    text: Deze wet kan worden aangehaald onder de titel "Wet buitengewoon pensioen Indisch verzet".
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel63
  - number: '64'
    text: |-
      Deze wet treedt in werking met ingang van de eerste dag van de maand volgende op de datum van uitgifte van het
      *Staatsblad* waarin zij wordt geplaatst en werkt met uitzondering van de artikelen 55, onder D, 56, onder D, 57,
      onder A en 58, onder A, terug tot 1 januari 1983. De artikelen 55, onder C en 56, onder C treden op 1 januari 1986
      in werking.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel64
