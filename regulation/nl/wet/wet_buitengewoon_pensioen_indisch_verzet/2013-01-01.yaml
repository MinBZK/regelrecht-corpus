preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen betreffende het toekennen van
    buitengewoon pensioen aan hen, die tijdens de vijandelijke bezetting van het voormalige Nederlands-Indië hebben
    deelgenomen aan het verzet, alsmede aan hun nagelaten betrekkingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#ArtikelAanhef
