  - number: '16.4'
    text: |-
      Tot de inkomsten bedoeld in dit artikel worden niet gerekend uitkeringen onder welke benaming ook
      ingevolge of op de voet van de [Wet uitkeringen vervolgingsslachtoffers 1940-1945][ref1] (*Stb.* 1977,
      494), de [Wet uitkeringen burger-oorlogsslachtoffers 1940-1945][ref2] (*Stb.* 1984, 94) en de Algemene
      Oorlogsongevallenregeling (Indonesië) (*Stb.* Ned.-Indië 1946, nr. 48) dan wel de kinderbijslag ingevolge de
      [Algemene Kinderbijslagwet][ref3] (*Stb.* 1980, 1).


      [ref1]: https://wetten.overheid.nl/BWBR0002844
      [ref2]: https://wetten.overheid.nl/BWBR0003664
      [ref3]: https://wetten.overheid.nl/BWBR0002368
