  - number: 16.2.b
    text: 'Tot de inkomsten van betrokkene als bedoeld onder a worden niet gerekend:'
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel16
  - number: 16.2.b.1e
    text: |-
      inkomsten uit arbeid indien de betrokkene de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 16.2.b.2e
    text: inkomsten uit arbeid, arbeidsvervangende inkomsten en inkomsten uit onderneming van zijn echtgenoot;
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel16
  - number: 16.2.b.3e
    text: inkomsten uit vermogen, tot een bedrag van f 984,-.
    url: https://wetten.overheid.nl/BWBR0003968/2013-01-01#Artikel16
  - number: '16.3'
    text: |-
      Indien op grond van hetzelfde feit, als waaraan het genot van een buitengewoon pensioen wordt ontleend,
      gelijktijdig een uitkering, een pensioen of andere inkomsten worden genoten ten laste van het Rijk, de Republiek
      Suriname, de Nederlandse Antillen, Aruba, de Republiek Indonesië, een publiekrechtelijk lichaam in een van deze
      gebieden of een door het openbaar gezag aldaar ingesteld fonds, wordt het bedrag van het buitengewoon pensioen,
      ongeacht de vermeerdering of vergoeding ingevolge de [artikelen 12][ref1], [13][ref2], [14][ref3] en [15][ref4],
      met het bedrag van die uitkering, dat pensioen of die andere inkomsten verminderd, nadat daarvan is afgetrokken
      het bedrag der compensatie ter zake van de premie ingevolge de [Wet financiering sociale verzekeringen][ref5],
      hetwelk daarin is of naar de voor de buitengewone pensioen geldende wettelijke maatstaven moet worden geacht te
      zijn begrepen. Voor zover echter die uitkering, dat pensioen of die andere inkomsten worden genoten uit hoofde van
      een vrijwillige verzekering, welke werd gesloten op grond van een wettelijk verleende bevoegdheid, of uit hoofde
      van een verplichte verzekering, welke voor eigen rekening is voortgezet, en door de Sociale verzekeringsbank
      als zodanig wordt aangemerkt, dan wel krachtens een wettelijke regeling van overeenkomstige strekking als de
      [Ziektewet][ref6], is het bepaalde in de vorige volzin niet van toepassing. Indien onder het pensioen of andere
      inkomsten, bedoeld in de eerste volzin zijn begrepen bedragen, welke worden genoten krachtens in andere wettelijke
      regelingen voorkomende bepalingen van overeenkomstige strekking als die van de [artikelen 12][ref7], [13][ref8],
      [14][ref9] en [15][ref10] worden die bedragen niet op het buitengewoon pensioen in mindering gebracht; is evenwel
      een vermeerdering of vergoeding ingevolge de [artikelen 12][ref11], [13][ref12], [14][ref13] en [15][ref14]
      toegekend, dan wordt die vermeerdering of vergoeding verminderd met het bedrag, dat genoten wordt krachtens de met
      die artikelen overeenkomende bepalingen in andere wettelijke regelingen.


