  - number: 3.5.12
    text: |-
      In afwijking van [artikel 11 van het besluit][ref1] komen uitsluitend de volgende kosten voor subsidie in
      aanmerking:

      a. het aantal uren gemaakt door personeel van de IPC-penvoerder danwel door derden ten behoeve van reis, overleg
      en rapportage in verband met activiteiten als bedoeld in [artikel 3.5.10, eerste lid, onderdeel a][ref2], alsmede
      begeleiding van het collectief onderzoek, bedoeld in artikel 3.5.10, onderdeel b, vermenigvuldigd met een vast
      uurtarief van € 87,50, alsmede de reis- en verblijfkosten in verband met deze activiteiten;

      b. de kosten voor collectief onderzoek, verschuldigd aan een onderzoeksorganisatie waarmee de IPC-penvoerder niet
      in een groep verbonden is, voor zover deze kosten worden gedragen door de IPC-penvoerder, alsmede de kosten voor de
      verspreiding van de resultaten, bedoeld in [artikel 3.5.10, eerste lid, onderdeel b][ref3].


