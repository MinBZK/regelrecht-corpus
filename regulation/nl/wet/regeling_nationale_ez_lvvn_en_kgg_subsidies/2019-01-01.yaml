  - number: 4.5.12
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien:

      a. de aanvrager voor dezelfde installatie voor de productie van duurzame energie op grond van
      [artikel 3.42, eerste lid, van de Wet inkomstenbelasting 2001][ref1] een verzoek heeft ingediend bij de minister om
      een verklaring dat sprake is van een energie-investering als bedoeld in dat artikel;

      b. de installatie voor de productie van duurzame energie is of wordt geïnstalleerd om te voldoen aan de wettelijke
      voorschriften, bedoeld in [hoofdstuk 5 van het Bouwbesluit 2012][ref2];

      c. blijkens het bewijs van aanschaf de installatie voor de productie van duurzame energie vóór 1 januari 2016 is
      aangeschaft;

      d. ten aanzien van dezelfde installatie voor de productie van duurzame energie reeds subsidie is verstrekt;

      e. in geval van een aanvraag van een natuurlijke persoon ten behoeve van een installatie voor de productie van
      duurzame energie bestemd voor de eigen woning, de installatie nog niet is geïnstalleerd;

      f. in geval van een aanvraag van een natuurlijke persoon ten behoeve van een installatie voor de productie van
      duurzame energie bestemd voor de eigen woning, de aanvraag later dan zes maanden na het installeren ervan is
      ingediend;

      g. de aanvraag betrekking heeft op een gebruikte installatie voor de productie van duurzame energie.

      2 De afwijzingsgrond, bedoeld in het eerste lid, onderdeel f, is niet van toepassing op een hernieuwde aanvraag,
      indien deze aanvraag is ingediend binnen twaalf maanden nadat een aanvraag voor dezelfde installatie voor de
      productie van duurzame energie is afgewezen in verband met de uitputting van het subsidieplafond.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.42
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.5.12
