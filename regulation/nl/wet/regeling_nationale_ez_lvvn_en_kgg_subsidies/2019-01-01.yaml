    text: |-
      Deze titel, [bijlage 3.10.1][ref1] en [bijlage 3.10.2][ref2] vervallen met ingang van 1 juli 2019, met dien
      verstande dat deze van toepassing blijven op subsidies die voor die datum zijn verleend.


