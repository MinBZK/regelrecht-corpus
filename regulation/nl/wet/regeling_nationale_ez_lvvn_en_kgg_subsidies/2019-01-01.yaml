  - number: 4.3.8
    text: |-
      1 De hoogte van de subsidie wordt berekend overeenkomstig de formule:

      Subsidiebedrag = e/f * (a – c + d)

      en maximaal:

      Subsidiebedrag = e/f * (a – b)

      In deze formules betekent:

      a: de gerealiseerde subsidiabele kosten van de eerste boring, tot een maximum van de verwachte subsidiabele kosten,

      b: de restwaarde bij alternatief gebruik zonder alternatiefwerkzaamheden,

      c: de restwaarde bij alternatief gebruik na alternatiefwerkzaamheden,

      d: de additionele kosten voor de realisatie van alternatief gebruik voor ten hoogste 15 jaar,

      e: het maximale subsidiebedrag,

      f: de verwachte subsidiabele kosten.

      2 Indien de put definitief wordt afgedicht is de restwaarde nul. Indien de restwaarde negatief is wordt de
      restwaarde op nul gesteld.

      3 Indien subsidie is verstrekt voor een doublet dan bedraagt de subsidie ten hoogste 60 procent van het maximale
      subsidiebedrag. Indien subsidie is verstrekt voor een half-doublet dan bedraagt het subsidiebedrag ten hoogste het
      maximale subsidiebedrag.

      4 Indien de formule in het eerste lid een negatieve uitkomst oplevert wordt de subsidie op nul gesteld.

      5 Indien subsidie is verstrekt voor een doublet dan wordt de betaalde premie minus 5,95 procent van de tot en met
      de eerste boring gerealiseerde subsidiabele kosten gerestitueerd.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.3.8
  - number: 4.3.9
    text: |-
      1 De hoogte van de subsidie wordt berekend overeenkomstig de formule:

      Subsidiebedrag = f/g * a * (1 – d / c) + f/g * e

      en maximaal:

      Subsidiebedrag = f/g * a * (1 – b / c)

      In deze formules betekent:

      a: de gerealiseerde subsidiabele kosten, tot een maximum van de verwachte subsidiabele kosten,

      b: het gerealiseerd vermogen in MW, zonder verbeterwerkzaamheden,

      c: het verwacht vermogen in MW, zoals vermeld in de beschikking,

      d: het gerealiseerd vermogen in MW, na verbeterwerkzaamheden,

      e: de additionele kosten voor de verbeterwerkzaamheden voor ten hoogste 15 jaar,

      f: het maximale subsidiebedrag,

      g: de verwachte subsidiabele kosten.

      2 De subsidie wordt op nul gesteld indien het gerealiseerd vermogen in MW, zonder verbeterwerkzaamheden, meer
      bedraagt dan het verwacht vermogen in MW, zoals vermeld in de beschikking.

      3 Indien het gerealiseerd vermogen in MW, na verbeterwerkzaamheden, meer bedraagt dan het verwacht vermogen in MW,
      zoals vermeld in de beschikking, wordt de term f/g * a (1 – d / c) in het eerste lid op nul gesteld.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.3.9
  - number: 4.3.10
    text: |-
      1 De subsidieontvanger betaalt voorafgaand aan de start van het aardwarmteproject of diep aardwarmteproject een
      premie van 7 procent van het maximale subsidiebedrag.

      2 Bij verwachte subsidiabele kosten van meer dan € 8.500.000 bedraagt de premie, bedoeld in het eerste lid,
      € 505.750.

      3 Bij een diep aardwarmteproject en verwachte subsidiabele kosten van meer dan € 15.000.000 bedraagt de premie,
      bedoeld in het eerste lid, € 892.500.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.3.10
  - number: 4.3.11
    text: |-
      1 De subsidieontvanger start binnen twaalf maanden na de datum van de beschikking tot subsidieverlening de
      uitvoering van het aardwarmteproject of diep aardwarmteproject en meldt de datum van aanvang binnen twee dagen na
      aanvang aan de minister. De minister kan op voorafgaand verzoek van de subsidieontvanger uitstel verlenen.

      2 Het boorgereed maken van de locatie wordt aangemerkt als start van het aardwarmteproject of diep
      aardwarmteproject.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.3.11
  - number: 4.3.12
    text: |-
      1 Een subsidieontvanger doet na de puttest of puttesten mededeling aan de minister over:

      a. het al dan niet uitvoeren van op toename van het gerealiseerde vermogen respectievelijk verhoging van de
      restwaarde gerichte verbeter- of alternatiefwerkzaamheden;

      b. het al dan niet toepassen van een beter renderend alternatief gebruik van de put of putten.

      2 Aan vaststelling van de subsidie is de verplichting verbonden gedurende vijf jaar na vaststelling af te zien van
      werkzaamheden en van alternatief gebruik als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.3.12
  - number: 4.3.13
    text: |-
      1 De subsidieontvanger verstrekt binnen acht weken na de boring van een put, de resultaten van deze puttest aan
      de minister.

      2 De subsidieontvanger verstrekt binnen acht weken na verbeterwerkzaamheden, de resultaten van deze puttest aan
      de minister.

      3 Het geologisch onderzoek en de puttest worden uitgevoerd door een ISO 9001 gecertificeerde instelling.

      4 De subsidieontvanger maakt de resultaten van het geologische onderzoek en het advies van TNO binnen acht weken na
      de start, bedoeld in [artikel 4.3.11, eerste lid][ref1], openbaar.

      5 De subsidieontvanger maakt binnen vier weken na datum van de beschikking tot subsidievaststelling de resultaten
      openbaar van de puttest of puttesten, voor zover van toepassing het advies van TNO over de puttest of de
      puttesten, en overige onderzoeksresultaten die door de subsidieontvanger als subsidiabele kosten als bedoeld in
      [artikel 4.3.5][ref2] worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.3.11
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel4.3.5
