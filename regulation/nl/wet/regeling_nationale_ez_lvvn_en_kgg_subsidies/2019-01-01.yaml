  - number: 2.2.8
    text: |-
      1 De minister verdeelt het subsidieplafond voor de ingediende projecten, bedoeld in
      [artikel 2.2.2, onderdeel a][ref1], respectievelijk het subsidieplafond voor de ingediende projecten, bedoeld in
      artikel 2.2.2, onderdeel b, op volgorde van rangschikking van de aanvragen. De minister rangschikt een aanvraag
      hoger naarmate de activiteiten waarop de aanvraag betrekking heeft hoger scoort op de criteria, bedoeld in
      [artikel 2.2.9, derde en vierde lid][ref2].

      2 Indien blijkt dat het totale bedrag van de toe te kennen subsidies voor de ingediende projecten, bedoeld in
      [artikel 2.2.2, onderdeel a][ref3], respectievelijk artikel 2.2.2, onderdeel b, die voor verlening van subsidie in
      aanmerking komen, lager is dan het subsidieplafond dat voor deze projecten is vastgesteld, wordt het voor de ene
      soort project overblijvende bedrag zo nodig aan het beschikbare bedrag voor de andere soort project toegevoegd.


