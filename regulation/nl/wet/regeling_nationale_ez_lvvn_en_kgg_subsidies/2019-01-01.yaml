  - number: 3.5.1
    text: |-
      In deze titel wordt verstaan onder:

        - *collectief onderzoek:* industrieel onderzoek of experimentele ontwikkeling waarvan de resultaten naar hun aard
      voor een bredere groep toepasbaar zijn;
        - *collectieve activiteiten:* activiteiten die op basis van innovatieplannen door twee of meer IPC-deelnemers
      gezamenlijk zullen worden gefinancierd en uitgevoerd en waarvan de resultaten evenredig over deze deelnemers worden
      verdeeld;
        - *innovatieplan:* planmatige beschrijving van de activiteiten in het kader van industrieel onderzoek en
      experimentele ontwikkeling als bedoeld in artikel 2 van de algemene groepsvrijstellingsverordening, inclusief
      de planning en kosten daarvan, die een IPC-deelnemer zal verrichten met het oog op innovatie van zijn producten,
      diensten of productieproces, met inbegrip van zijn collectieve activiteiten;
        - *IPC-deelnemer:* MKB-ondernemer die deelneemt aan een IPC-verband;
        - *IPC-penvoerder:* rechtspersoon die: a. namens de IPC-deelnemers optreedt als projectleider van een IPC-
      verband en het overkoepelend plan uitvoert als bedoeld in de [paragrafen 3.5.2][ref1] en [3.5.4][ref2], of b. de
      mogelijkheden onderzoekt om in samenwerking met ten minste één soortgelijke organisatie uit een ander land te komen
      tot collectief onderzoek en dit onderzoek laat uitvoeren, als bedoeld in [paragraaf 3.5.3][ref3] en niet werkzaam
      is in een van de sectoren die ingevolge artikel 1 van de algemene de-minimisverordening is uitgesloten van de
      toepassing van die verordening;
        - *IPC-project:* project bestaande uit activiteiten die de IPC-penvoerder en de IPC-deelnemers binnen een periode
      van twee jaar verrichten ter uitvoering van het overkoepelende plan en de daarmee samenhangende innovatieplannen;
        - *overkoepelend plan:* plan waarin de IPC-penvoerder beschrijft wat de samenhang is tussen de verschillende
      innovatieplannen, welke collectieve activiteiten worden verricht en door welke deelnemers, welke activiteiten hij
      ten behoeve van de IPC-deelnemers en het IPC-project zal verrichten, waaronder ten minste het begeleiden van de
      IPC-deelnemers bij het uitvoeren van de innovatieplannen, het begeleiden van samenwerkingsverbanden van de IPC-
      deelnemers en het begeleiden en uitvoeren van administratieve activiteiten die samen hangen met een IPC-project,
      alsmede een globale omschrijving van de planning en de geraamde kosten van deze activiteiten;
        - *regionaal IPC-project:* project als bedoeld in [artikel 3.5.4, tweede lid][ref4], bestaande uit activiteiten
      die de IPC-penvoerder en de IPC-deelnemers, waarvan ten minste de helft is gevestigd in Zuid-Holland, binnen
      een periode van twee jaar verrichten ter uitvoering van het overkoepelende plan en de daarmee samenhangende
      innovatieplannen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0035474#Artikel3.5.4
