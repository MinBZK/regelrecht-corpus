  - number: 3.16.18
    text: |-
      1 De subsidieverlening aan een academische innovatieve starter, hbo-innovatieve starter of TO2-innovatieve starter
      vindt plaats onder de opschortende voorwaarde dat de uitvoeringsovereenkomst die bij de beschikking tot verlening
      van de subsidie is gevoegd en uit hoofde waarvan de geldlening wordt verstrekt binnen acht weken na die beschikking
      is ondertekend door de academische innovatieve starter, hbo-innovatieve starter of TO2-innovatieve starter.

      2 De subsidie wordt ambtshalve vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.16.18
  - number: 3.16.19
    text: |-
      1 Een aanvraag voor subsidie op grond van deze titel bevat ten minste de gegevens, bedoeld in artikel 6, tweede
      lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie op grond van deze titel ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het KvK-nummer, het post- en bezoekadres en
      het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. de kerngegevens en onderbouwing van het vroegefaseplan of vernieuwingsfaseplan.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.16.19
  - number: 3.16.20
    text: |-
      1 De uitvoeringsovereenkomst, bedoeld in [artikel 3.16.6][ref1] bestaat uit een samenstelling van de
      standaardbepalingen die zijn opgenomen in [bijlage 3.16.2][ref2] en andere bepalingen die strekken tot
      verwezenlijking van het doel van deze titel.

      2 De uitvoeringsovereenkomst, bedoeld in de [artikelen 3.16.11][ref3] en [3.16.18][ref4] bestaat uit een
      samenstelling van de standaardbepalingen die zijn opgenomen in [bijlage 3.16.3][ref5] en andere bepalingen die
      strekken tot verwezenlijking van het doel van dit hoofdstuk.


