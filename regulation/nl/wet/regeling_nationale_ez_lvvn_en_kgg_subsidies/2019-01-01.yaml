  - number: 3.5.17
    text: |-
      1 De minister verstrekt op aanvraag aan de deelnemers in een IPC-verband subsidie voor het uitvoeren van een IPC-
      project, waarbij:

      a. de IPC-penvoerder subsidie ontvangt voor de uitvoering van zijn activiteiten die zijn beschreven in het
      overkoepelende plan en

      b. een IPC-deelnemer subsidie ontvangt voor de uitvoering van zijn innovatieplan.

      2 De subsidiabele kosten voor de activiteiten van een IPC-deelnemer in het kader van een innovatieplan:

      a. bedragen € 30.000 of meer,

      b. bestaan voor ten minste 20 procent uit kosten voor collectieve activiteiten en

      c. bestaan voor ten minste 60 procent uit overige kosten.

      3 In aanvulling op [artikel 3, eerste lid, van het besluit][ref1] kan ook subsidie worden verstrekt aan een IPC-
      penvoerder of een IPC-deelnemer die gevestigd is in het openbaar lichaam Bonaire, Sint Eustatius of Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel3
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.5.17
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '3'
  - number: 3.5.18
    text: |-
      De subsidie bedraagt:

      a. voor activiteiten als bedoeld in [artikel 3.5.17, eerste lid, aanhef en onderdeel a][ref1], € 3.000 per IPC-
      deelnemer;

      b. voor activiteiten als bedoeld in [artikel 3.5.17, eerste lid, aanhef en onderdeel b][ref2], 35 procent van de
      subsidiabele kosten van de IPC-deelnemer tot een maximum van € 25.000.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.5.17
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.5.17
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.5.18
