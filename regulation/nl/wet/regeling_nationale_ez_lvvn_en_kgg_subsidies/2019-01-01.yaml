  - number: 3.2.12
    text: |-
      1 Het TKI dat PPS-projecttoeslag ontvangt, wendt deze toeslag zodanig aan dat het totale bedrag aan steun dat voor
      de begunstigde deelnemer in een samenwerkingsproject beschikbaar is niet meer bedraagt dan:

      a. 100% van de subsidiabele kosten voor zover deze betrekking hebben op fundamenteel onderzoek,

      b. 50% van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek, en

      c. 25% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling.

      2 De PPS-projecttoeslag aan een deelnemer in een samenwerkingsverband bedraagt, voor zover het steun betreft, niet
      meer dan:

      a. 100% van de subsidiabele kosten voor zover deze betrekking hebben op fundamenteel onderzoek,

      b. 50% van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek, en

      c. 25% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling.

      3 De subsidiabele kosten, bedoeld in het eerste en tweede lid, zijn kosten als bedoeld in artikel 25, derde lid,
      van de algemene groepsvrijstellingsverordening.

      4 Het TKI dat, onderscheidenlijk de deelnemer in een samenwerkingsverband die de PPS-toeslag ontvangt, neemt
      bij de aanwending van de PPS-projecttoeslag, indien van toepassing, de gemeenschappelijke ordening van de
      landbouwproducten in acht, bedoeld in artikel 40, eerste lid, van het Verdrag betreffende de werking van de
      Europese Unie.

      5 Het TKI dat, onderscheidenlijk de deelnemer van het samenwerkingsverband die de PPS-projecttoeslag ontvangt,
      wendt de PPS-projecttoeslag aan voor het desbetreffende project.

      6 De PPS-projecttoeslag wordt aangewend gedurende de looptijd van het project.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.2.12
  - number: 3.2.13
    text: |-
      1 Onverminderd het bepaalde in [artikel 38 van het besluit][ref1], draagt het TKI dat, onderscheidenlijk de
      deelnemer in een samenwerkingsverband die PPS-projecttoeslag ontvangt, zorg voor een administratie:

      a. waaruit op eenvoudige en duidelijke wijze kan worden afgeleid hoe de PPS-projecttoeslag wordt aangewend voor het
      uitvoeren van het samenwerkingsproject;

      b. waaruit op eenvoudige wijze kennis genomen kan worden van de samenwerkingsovereenkomst voor het
      samenwerkingsproject waarvoor de PPS-projecttoeslag wordt aangewend, en van de private bijdragen of inzet in natura
      die op basis van die overeenkomst verschuldigd is;

      c. waarin de wijze wordt vastgelegd waarop deelnemers in het samenwerkingsverband dat het samenwerkingsproject
      uitvoert, omgaan met intellectueel eigendom dat voorkomt uit het betreffende project.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel38
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.2.13
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '38'
  - number: 3.2.14
    text: |-
      1 De rapportage, bedoeld in [artikel 39, eerste lid, van het besluit][ref1], bevat in ieder geval:

      a. een overzicht van de mate waarin het samenwerkingsproject, de private bijdrage aan en de inzet in natura voor
      dit project van het lopende jaar zijn gerealiseerd;

      b. een opgave van de afwijkingen van het TKI-programma;

      c. een overzicht van de activiteiten en doelen voor het eerstvolgende jaar.

      2 Het TKI, onderscheidenlijk de penvoerder, bedoeld in [artikel 3.2.9, tweede lid][ref2], zorgt dat actuele
      informatie over het samenwerkingsproject waarvoor de PPS-projecttoeslag wordt aangewend, op eenvoudige wijze voor
      het algemene publiek kenbaar is. De informatie omvat ten minste een beschrijving van het onderzoek, de deelnemende
      ondernemers en onderzoeksinstellingen en de planning en voortgang.

      3 Het tweede lid, eerste volzin, is van overeenkomstige toepassing op informatie over de voorwaarden waaronder
      deelname door ondernemers en onderzoeksinstellingen aan het samenwerkingsproject waarvoor de PPS-projecttoeslag
      wordt verleend, openstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.9
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.2.14
