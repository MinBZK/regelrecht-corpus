  - number: 4.3.6
    text: |-
      1 Indien subsidie is verstrekt voor het boren van een doublet geldt dat:

      a. indien het gerealiseerde vermogen van de eerste boring gelijk aan of meer dan 75% van het verwacht vermogen is
      en de subsidieontvanger het project staakt, de subsidie op nihil wordt vastgesteld;

      b. indien het gerealiseerd vermogen van de eerste boring meer dan 50% van het verwacht vermogen is en de
      subsidieontvanger het project voltooit, [artikel 4.3.9][ref1] van toepassing is;

      c. indien het gerealiseerd vermogen van de eerste boring meer dan 50%, maar minder dan 75% van het verwacht
      vermogen is en de subsidieontvanger het project na de eerste boring staakt, [artikel 4.3.8][ref2] van toepassing
      is;

      d. indien het gerealiseerd vermogen van de eerste boring 50% of minder van het verwacht vermogen is,
      [artikel 4.3.8][ref3] van toepassing is.

      2 De subsidieontvanger staakt het aardwarmteproject of diep aardwarmteproject door eigen aangifte dan wel wordt
      geacht dit project te staken door niet binnen een jaar na voltooiing van de eerste boring het doublet te voltooien.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.3.9
