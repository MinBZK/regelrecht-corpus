    text: |-
      De minister kan besluiten dat de verstrekte subsidie in de vorm van krediet versneld of in een keer terugbetaald
      wordt, indien:

      a. de aandelen van de subsidieontvanger worden vervreemd;

      b. de resultaten van het project geheel of gedeeltelijk worden vervreemd.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.9.10
  - number: 3.9.11
    text: |-
      1 Indien ontheffing is verleend op basis van [artikel 37, derde lid, van het besluit][ref1], kan de minister
      op aanvraag van de subsidieontvanger het bedrag van een eerder voor een ontwikkelingsproject verleende subsidie
      verhogen tot maximaal het bedrag dat voor dat ontwikkelingsproject kan worden verkregen.

      2 De aanvraag, bedoeld in het eerste lid, wordt volgens eenzelfde procedure en volgens dezelfde criteria behandeld
      als een eerste aanvraag om subsidie voor een ontwikkelingsproject.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel37
