  - number: 3.13a.1
    text: |-
      1 In deze titel wordt verstaan onder:

        - *energietransitieproject:* samenhangend geheel van activiteiten, uitgevoerd in de vorm van een exclusief daarvoor
      bestemde rechtspersoon, gericht op het stimuleren van energie-efficiëntie, het gebruik van energie uit hernieuwbare
      energiebronnen of het stimuleren van energie-efficiënte stadsverwarming en -koeling als bedoeld in artikel 2,
      onderdelen 103, 109, 110 respectievelijk 124 van de algemene groepsvrijstellingsverordening;
        - *fundingkosten:* kosten die de bank maakt om geld aan te trekken op de kapitaalmarkt;
        - *lening:* achtergestelde lening van geld door een financier aan een ondernemer, welke lening: a. al dan niet
      door enige vorm van zekerheid is gedekt; b. niet converteerbaar is; c. is afgesloten met de afspraak dat de
      rente vast is; d. strekt tot financiering van een energiestransitieproject van de ondernemer; e. maximaal 50
      procent bedraagt van de totale behoefte van de ondernemer aan risicodragend vermogen, met dien verstande dat de
      totale behoefte aan risicodragend vermogen minimaal 30 procent bedraagt van de totale financieringsbehoefte van
      het energietransitieproject en de ondernemer minimaal 50 procent van het risicodragend vermogen zelf inbrengt
      en daarmee de eerste verliezen opvangt, en f. waarvoor een rente in rekening wordt gebracht die ten minste 200
      basispunten hoger is dan de hoogste rente die in rekening wordt gebracht voor de niet-achtergestelde senior lening
      of leningen, zijnde het niet risico-dragend vreemd vermogen, die voor hetzelfde energietransitieproject wordt of
      worden verstrekt;
        - *liquiditeitsopslag:* door een financier aan een ondernemer in rekening gebracht percentage van de lening,
      waarvan de hoogte gelijk is voor alle door de desbetreffende financier op dezelfde dag afgesloten of af te
      sluiten leningen met dezelfde looptijd. Indien een dergelijk percentage niet beschikbaar is, zal in overleg met de
      financier een ander redelijk, transparant en verifieerbaar percentage worden vastgesteld.

      2 Voor de toepassing van deze titel wordt als financier aangewezen een ontwikkelingsbank die voldoet aan de
      definitie van kredietinstelling als bedoeld in artikel 4, eerste lid, onderdeel 1), van Verordening (EU) 575/2013
      van het Europees Parlement en de Raad van 26 juni 2013 betreffende prudentiële vereisten voor kredietinstellingen
      en beleggingsondernemingen en tot wijziging van Verordening (EU) nr. 648/2012 en beschikt over een vergunning als
      bedoeld in [artikel 2:11, eerste lid, van de Wet op het financieel toezicht][ref1].

      3 Voor de toepassing van [artikel 3.13a.2, tweede lid][ref2], wordt als financier aangewezen een ontwikkelingsbank
      als bedoeld in het tweede lid, die tevens kredietinstelling is in de zin van de [Wet financiële markten BES][ref3]
      die op grond van die wet bevoegd is in Bonaire, Sint Eustatius of Saba het bedrijf van kredietinstelling uit te
      oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel211
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.13a.2
      [ref3]: https://wetten.overheid.nl/BWBR0030883
