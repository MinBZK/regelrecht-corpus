  - number: 3.13a.10
    text: |-
      1 Het tarief van de provisie, bedoeld in [artikel 32, derde lid, van het besluit][ref1], wordt voor de garantie
      op de verstrekte lening, berekend door alle door de financier over het gegarandeerde deel van de lening ontvangen
      inkomsten te verminderen met:

      a. 1,2 procent per jaar voor beheerskosten;

      b. fundingkosten, vermeerderd met de liquiditeitsopslag;

      c. een risico-opslag van 0,05 procent per procent van de onder b genoemde fundingkosten, en

      d. de afsluitprovisie.

      2 Indien de afsluitprovisie meer bedraagt dan 0,5 procent van de lening, wordt het meerdere toegevoegd aan de in
      het eerste lid, aanhef, genoemde inkomsten.

      3 De minister kan een hoger tarief voor de provisie vaststellen, indien de provisie te laag is in relatie tot het
      risico dat de Staat loopt.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel32
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.13a.10
