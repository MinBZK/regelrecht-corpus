    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.14.8
  - number: 3.14.9
    text: |-
      De minister beslist afwijzend op een aanvraag om een bankgarantiefaciliteit indien:

      a. de financier geen garantstellingsovereenkomst met de Staat heeft gesloten;

      b. er niet wordt voldaan aan de voorwaarden, genoemd in artikel 3 van het model garantstellingsovereenkomst, met
      uitzondering van onderdelen f, h en i, zoals opgenomen in [bijlage 3.14.1][ref1];

      c. de aanvrager eerder tekort is geschoten bij de naleving van verplichtingen op grond van de
      garantstellingsovereenkomst;

      d. het bedrag van een bankgarantiefaciliteit minder bedraagt dan € 1.500.000.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.14.9
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 3.14.10
    text: |-
      1 De financier is voor het verstrekken van een bankgarantiefaciliteit een eenmalige provisie van 0,25 procent van
      50 procent van de bankgarantiefaciliteit verschuldigd.

      2 Voor zover de opbrengsten uit de provisie, bedoeld in het eerste lid, die de financier bij de onderneming
      in rekening brengt voor het verstrekken van de bankgarantiefaciliteit hoger zijn dan 0,5 procent van de
      bankgarantiefaciliteit, is de financier het meerdere voor 50 procent aan de Staat verschuldigd.

      3 Voor zover de opbrengsten uit een eventuele bereidstellingsprovisie die een financier bij een onderneming in
      rekening brengt over het onbenutte deel van een bankgarantiefaciliteit hoger zijn dan 25 procent van een door een
      financier aan een onderneming in rekening gebrachte provisie op bankgaranties, is de financier het meerdere voor 50
      procent aan de Staat verschuldigd.

      4 Het tarief van de periodieke provisie, bedoeld in [artikel 32, derde lid, van het besluit][ref1], wordt voor de
      garantstelling op een afgegeven bankgarantie berekend over de waarde van de afgegeven bankgaranties op de eerste
      dag van het kwartaal en is gelijk aan de door een financier aan een onderneming in rekening gebrachte provisie
      over het door de staat gegarandeerde deel van de afgegeven bankgaranties met aftrek van 0,15 procent op jaarbasis
      als vergoeding voor de financier voor het beheer van de bankgarantiefaciliteit en met een minimum van 0,5 procent
      op jaarbasis.

      5 In afwijking van het vierde lid kan een financier eenmalig en vooraf aangeven de provisie per kwartaal te willen
      verrekenen op basis van een controleerbare opgave van de provisieberekening op dagbasis.

      6 De minister kan een hoger tarief voor de provisie, bedoeld in het eerste tot en met het vierde lid, vaststellen,
      indien de provisie te laag is in relatie tot het risico dat de Staat loopt.


