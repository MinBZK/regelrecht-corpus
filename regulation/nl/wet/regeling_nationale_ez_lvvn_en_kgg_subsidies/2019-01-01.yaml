  - number: 4.2.19
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.19
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 4.2.20
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. de aanvrager niet aannemelijk heeft gemaakt dat het project leidt tot hernieuwbare energieproductie in 2030, en

      1°. leidt tot een besparing op de uitgaven aan subsidies in het kader van het
      [Besluit stimulering duurzame energieproductie][ref1], die groter is dan de aangevraagde subsidie onder deze
      paragraaf, hetgeen uit een berekening blijkt, of

      2°. indien het project betrekking heeft op windenergie op zee, het project leidt tot kostenvoordelen bij de bouw of
      exploitatie van in de territoriale wateren en de exclusieve economische zone van Nederland te realiseren windparken
      op zee die groter zijn dan de aangevraagde subsidie onder deze paragraaf, hetgeen uit een berekening blijkt;

      b. de kwaliteit van het project onvoldoende is, blijkend uit de uitwerking van aanpak en methodiek, de omgang
      met risico’s, de uitvoerbaarheid, de deelnemende partijen of de mate waarin de beschikbare middelen effectief en
      efficiënt worden ingezet;

      c. in onvoldoende mate is voorzien in een kwalitatief goede kennisverspreiding;

      d. eerder op grond van dit hoofdstuk of de Subsidieregeling energie en innovatie een subsidie is verstrekt voor een
      soortgelijk project;

      e. de samenwerking onvoldoende evenwichtig is, blijkend uit:

      1°. de verdeling van de kosten tussen de deelnemers, of

      2°. de verhouding tussen private en publieke financiering van het project.


      [ref1]: https://wetten.overheid.nl/BWBR0022735
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.20
    references:
      - id: ref1
        bwb_id: BWBR0022735
