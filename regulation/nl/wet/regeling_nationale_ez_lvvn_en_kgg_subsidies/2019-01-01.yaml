  - number: 2.3.7
    text: |-
      1 De subsidie bedraagt 25% van de subsidiabele kosten.

      2 De subsidie bedraagt ten minste € 5.000 per aanvraag en voor de apparatuur, installaties of machines, bedoeld in:

      a. [artikel 2.3.2, eerste lid, onderdelen a en b][ref1], ten hoogste € 150.000 per glastuinbouwonderneming of
      glastuinbouwonderneming die deelneemt aan een samenwerkingsverband;

      b. [artikel 2.3.2, eerste lid, onderdeel c][ref2], ten hoogste € 50.000 per glastuinbouwonderneming of
      glastuinbouwonderneming die deelneemt aan een samenwerkingsverband;

      c. [artikel 2.3.2, eerste lid, onderdeel d][ref3], ten hoogste € 187.500 per glastuinbouwonderneming of
      glastuinbouwonderneming die deelneemt aan een samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.3.2
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel2.3.2
