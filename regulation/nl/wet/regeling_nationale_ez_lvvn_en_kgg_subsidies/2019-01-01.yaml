  - number: 3.10.12a
    text: |-
      1 In deze paragraaf wordt verstaan onder:

        - *eigen bijdragen:* geldelijke middelen die door de fondspartijen in een seed business angel fonds zijn
      ingebracht en die door het seed business angels fonds daadwerkelijk zijn of worden gebruikt voor het verkrijgen
      van participaties;
        - *fondspartij:* investeerder die eigen bijdragen inbrengt in een seed business angel fonds en die tevens samen met
      de andere fondspartij als aandeelhouder, hoofdelijk aansprakelijk vennoot, lid of oprichter een belang heeft in het
      seed business angel fonds;
        - *seed business angel fonds:* a. kapitaalvennootschap, vennootschap met een afgescheiden vermogen, of
      rechtspersoon met een afgescheiden vermogen niet zijnde een vennootschap, ingericht naar het recht van één van
      de lidstaten van de Europese Unie, b. die blijkens de akte waarbij zijn statuten zijn vastgesteld of blijkens
      de overeenkomst waarbij hij is ingesteld uitsluitend tot doel heeft het verstrekken van risicokapitaal aan
      technostartersvennootschappen teneinde winst te behalen, en c. waarin twee fondspartijen die informal investor
      zijn deelnemen respectievelijk samenwerken, zonder dat zij tot dezelfde groep behoren en zonder dat één van hen een
      economisch of juridisch meerderheidsbelang in het fonds heeft.

      2 Voor de toepassing van deze paragraaf wordt verstaan onder startersfonds: seed business angel fonds.

      3 Voor de toepassing van deze paragraaf wordt als financier aangewezen een seed business angel fonds.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.10.12a
  - number: 3.10.12b
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een seed business angel fonds voor het uitvoeren van een
      fondsplan.

      2 De subsidie wordt verleend in de vorm van een geldlening.

      3 De beschikking tot verlening van een subsidie kan worden verleend onder voorwaarden die zijn gericht op het
      wegnemen of beperken van risico’s die aan de subsidieverstrekking, bedoeld in het eerste lid, verbonden kunnen
      zijn.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.10.12b
  - number: 3.10.12c
    text: |-
      1 De subsidievoorwaarden uit [artikel 3.10.3][ref1] zijn van overeenkomstige toepassing op een seed business angel
      fonds.

      2 In de overeenkomst van geldlening wordt bepaald dat de financier tot zekerheid van nakoming van het in die
      overeenkomst bepaalde aan de Staat een pandrecht verstrekt op de aandelen en achtergestelde vorderingen die in het
      kader van een participatie zijn verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.10.3
