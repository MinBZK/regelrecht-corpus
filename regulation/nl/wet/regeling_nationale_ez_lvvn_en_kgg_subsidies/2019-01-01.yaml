      a. subsidies op grond van het [Besluit stimulering duurzame energieproductie][ref2];

      b. bijdragen van de Europese Commissie op grond van Besluit nr. 1982/2006/EG van het Europees Parlement en de
      Raad van 18 december 2006 betreffende het zevende kaderprogramma voor activiteiten op het gebied van onderzoek,
