  - number: 4.2.64
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *DEI-project:* a. een energiedemonstratieproject dat past binnen de in de [bijlage 4.2.9][ref1] (Demonstratie
      energie innovatie) opgenomen beschrijving van demonstratie energie-innovatie; b. een project bestaande uit
      experimentele ontwikkeling in de vorm van een pilot biobrandstoffen of pilot energie-efficiëntie industrie, die
      past binnen de in de [bijlage 4.2.9][ref2] (Demonstratie energie innovatie) opgenomen beschrijving van demonstratie
      energie-innovatie; of c. een combinatie van een energiedemonstratieproject en project bestaande uit experimentele
      ontwikkeling in een andere vorm dan een pilot, die past binnen de in de [bijlage 4.2.9][ref3] (Demonstratie energie
      innovatie) opgenomen beschrijving van demonstratie energie-innovatie;
        - *industrie:* het geheel van ondernemingen die materiële goederen produceren, waarbij grondstoffen
      worden verwerkt en waarbij sprake is van een hoge graad van mechanisering en automatisering, genoemd in de
      Standaardbedrijfsindeling van het Centraal Bureau voor de Statistiek, hoofdgroep C;
        - *pilot biobrandstoffen:* een project bestaande uit experimentele ontwikkeling waarbij een experimentele prototype
      installatie wordt getest in omgevingen die representatief zijn voor het functioneren onder reële omstandigheden,
      met als hoofddoel om één of meer vooraf adequaat gedefinieerde biomassastromen om te kunnen zetten naar
      biobrandstoffen die geschikt zijn voor wegtransport, luchtvaart of scheepvaart;
        - *pilot energie-efficiëntie industrie:* een project bestaande uit experimentele ontwikkeling waarbij in de sector
      industrie energiebesparende maatregelen worden getest in omgevingen die representatief zijn voor het functioneren
      onder reële omstandigheden, met als hoofddoel verdere energiebesparing te realiseren in het productieproces.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
      [ref2]: https://wetten.overheid.nl/BWBR0035474
      [ref3]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.64
    references:
      - id: ref1
        bwb_id: BWBR0035474
      - id: ref2
        bwb_id: BWBR0035474
      - id: ref3
        bwb_id: BWBR0035474
