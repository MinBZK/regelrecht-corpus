    text: |-
      De subsidie, bedoeld in [artikel 4.2.121][ref1], bevat staatssteun en wordt gerechtvaardigd door de artikelen 25,
      38 en 41 van de algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.121
