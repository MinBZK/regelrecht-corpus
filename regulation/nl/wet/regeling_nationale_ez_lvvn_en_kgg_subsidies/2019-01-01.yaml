        artikel: 4.5.6
        hoofdstuk: '4'
  - number: 4.5.11
    text: |-
      De subsidie voor een op biomassa gestookte ketel als bedoeld in [artikel 4.5.7][ref1] bedraagt bij een thermisch
      vermogen:

      a. tot en met 40 kW: € 2.500, en

      b. vanaf 40 kW: € 2.500 vermeerderd met € 110 per kW vermogen van de ketel hoger dan 40 kW.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.7
