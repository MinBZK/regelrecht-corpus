      In deze paragraaf wordt verstaan onder:

      *early adopter-project*: project bestaande uit industrieel onderzoek, experimentele ontwikkeling, of een
      combinatie van deze vormen, gericht op het in een realistische industriële omgeving valideren van een nieuwe
      energiebesparende technologie, passend binnen de in [bijlage 4.2.15][ref1] (Programmalijnen Energie en industrie:
      early adopterprojecten) opgenomen programmalijnen.

      *eindgebruiker*: onderneming die de ontwikkelde technologie gaat toepassen en daarmee energiebesparing in zijn
      onderneming realiseert.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.106
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 4.2.107
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een deelnemer in een samenwerkingsverband voor het uitvoeren
      van een early adopter-project.

      2 Een samenwerkingsverband bestaat uit ten minste drie ondernemingen.

      3 Ten minste twee van de deelnemers zijn potentiële eindgebruikers van de technologie.

      4 De penvoerder van het samenwerkingsverband is een MKB-deelnemer in het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.107
  - number: 4.2.108
    text: |-
      1 De subsidie bedraagt voor een early adopter-project:

      a. 50% van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek;

      b. 25% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling.

      2 De in het eerste lid genoemde percentages worden met 20 procentpunten verhoogd indien de aanvrager een kleine
      onderneming is en de subsidiabele kosten worden gemaakt en betaald door de kleine ondernemer.

      3 De in het eerste lid genoemde percentages worden met 10 procentpunten verhoogd indien de aanvrager een
      middelgrote onderneming is en de subsidiabele kosten worden gemaakt en betaald door de middelgrote ondernemer.

      4 Onverminderd het tweede en derde lid, worden de in het eerste lid genoemde percentages voor ondernemingen met 10
      procentpunten verhoogd indien geen van de ondernemingen meer dan 70% van de subsidiabele kosten voor rekening moet
      nemen en ten minste één deelnemer in het samenwerkingsverband een MKB-ondernemer is.

      5 De subsidie bedraagt maximaal € 50.000 per early adopter-project.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.108
  - number: 4.2.109
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.109
  - number: 4.2.110
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is 18 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.110
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 4.2.111
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. het project onvoldoende bijdraagt aan de energiebesparing in industriële processen;

      b. er onvoldoende sprake is van een vernieuwende technologie;

      c. het project niet voldoende bijdraagt aan het creëren van economische waarde voor de deelnemers in het
      samenwerkingsverband en de daarmee samenhangende positieve gevolgen voor de Nederlandse economie;

      d. de kwaliteit van het samenwerkingsverband ontoereikend is om het project uit te voeren;

      e. in onvoldoende mate is voorzien in een kwalitatief goede kennisverspreiding;

      f. eerder op grond van deze titel een subsidie is verstrekt voor een soortgelijk project.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.111
  - number: 4.2.111a
    text: |-
      Het eindverslag dat bij de aanvraag voor subsidievaststelling wordt ingediend, bedoeld in
      [artikel 50, eerste lid, onderdeel a, van het besluit][ref1], geeft in ieder geval inzicht in:

      a. de toepasbaarheid van de technologie in de industrie;

      b. de duurzaamheidseffecten en kostenbesparing van de eindgebruiker;

      c. de slagingskans dat de technologie verder uitgerold kan worden;

      d. de wijze waarop de onder c bedoelde uitrol plaats moet gaan vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel50
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.111a
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '50'
  - number: 4.2.111b
    text: |-
      De subsidie, bedoeld in [artikel 4.2.107][ref1] bevat staatssteun en wordt gerechtvaardigd door artikel 25 van de
      algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.107
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.111b
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 4.2.107
        hoofdstuk: '4'
        paragraaf: 4.2.16
  - number: 4.2.112
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *Topsector Energiestudie:* een haalbaarheidsstudie of verkennende studie die past binnen de in
      [bijlage 4.2.16][ref1] (Programmalijnen Topsector Energiestudies) opgenomen programmalijnen;
        - *verkennende studie:* het verkennen van de mogelijkheden van nieuwe oplossingsrichtingen om het energiesysteem te
      verduurzamen, niet-zijnde een haalbaarheidsstudie.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.112
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 4.2.113
    text: |-
      De minister verstrekt op aanvraag een subsidie voor een Topsector Energiestudie aan:

      a. een deelnemer in een samenwerkingsverband dat tenminste:

      1°. één onderneming bevat, indien deze een verkennende studie zal uitvoeren of een haalbaarheidsstudie binnen de
      programmalijn CCUS, bedoeld in [bijlage 4.2.16][ref1];

      2°. één middelgrote of kleine onderneming bevat, indien deze een andere haalbaarheidsstudie zal uitvoeren dan de
      haalbaarheidsstudie, bedoeld in sub 1°;

      b. een onderneming, indien deze zelfstandig een haalbaarheidsstudie zal uitvoeren binnen de programmalijn CCUS,
      bedoeld in [bijlage 4.2.16][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035474
      [ref2]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.113
    references:
      - id: ref1
        bwb_id: BWBR0035474
      - id: ref2
        bwb_id: BWBR0035474
  - number: 4.2.114
    text: |-
      1 De subsidie bedraagt voor een Topsector Energiestudie 50% van de subsidiabele kosten.

      2 Het in het eerste lid genoemde percentage wordt met 20 procentpunten verhoogd, indien de aanvrager een kleine
      onderneming is en de subsidiabele kosten worden gemaakt en betaald door de kleine onderneming.

      3 Het in het eerste lid genoemde percentage wordt met 10 procentpunten verhoogd, indien de aanvrager een
      middelgrote onderneming is en de subsidiabele kosten worden gemaakt en betaald door de middelgrote onderneming.

      4 Het totale bedrag aan de-minimissteun bedraagt bij een verkennende studie per deelnemer in een
      samenwerkingsverband maximaal het bedrag, bedoeld in artikel 3, tweede lid, van de algemene de-minimisverordening.

      5 De subsidie bedraagt maximaal:

      a. € 75.000 per verkennende studie;

      b. € 50.000 per haalbaarheidsstudie;

      c. € 2.000.000 per haalbaarheidsstudie binnen de programmalijn CCUS, bedoeld in [bijlage 4.2.16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.114
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 4.2.115
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.115
  - number: 4.2.116
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is:

      a. een jaar, indien door de onderneming of alle deelnemers in een samenwerkingsverband minder dan € 125.000
      subsidie is aangevraagd;

      b. de periode van de datum van aanvang van de activiteiten tot en met 31 december 2018, indien door de onderneming
      of één of meer deelnemers in een samenwerkingsverband € 125.000 of meer subsidie is aangevraagd voor een
      haalbaarheidsstudie binnen het thema CCUS als bedoeld in [bijlage 4.2.16][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.116
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0035474
  - number: 4.2.117
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. de kwaliteit van het project onvoldoende is, blijkend uit de uitwerking van aanpak en methodiek, de omgang met
      de risico’s, de uitvoerbaarheid, de deelnemende partijen of de mate waarin de beschikbare middelen effectief en
      efficiënt worden ingezet;

      b. het project onvoldoende aandacht besteedt aan het creëren van flexibiliteit in het energiesysteem, aan een of
      meer mogelijke verdienmodellen, en aan de niet-technologische factoren die een rol kunnen spelen bij de toepassing
      van innovaties in de markt en de wijze waarop daarmee wordt omgegaan;

      c. in onvoldoende mate is voorzien in een kwalitatief goede kennisverspreiding;

      d. in geval van een samenwerkingsverband, de samenwerking onvoldoende evenwichtig is, blijkend uit:

      1°. de verdeling van de kosten tussen de deelnemers, of

      2°. de verhouding tussen private en publieke financiering van het project;

      e. het projectplan niet in voldoende mate de vervolgstappen beschrijft die na afloop van het project bij een
      positief resultaat gezet zullen gaan worden om tot uitvoering en implementatie van hetgeen onderzocht is te komen;

      f. de aanvraag voor subsidie voor een verkennende studie is gedaan door een samenwerkingsverband waarvan één of
      meerdere van dedeelnemers een onderneming in stand houdt dan wel houden, die actief is respectievelijk zijn in:

      1°. de sector visserij en aquacultuur;

      2°. de primaire productie van landbouwproducten, of

      3°. de sector verwerking en afzet van landbouwproducten in de gevallen, bedoeld in artikel 1, eerste lid, onder c,
      van de algemene de-minimisverordening;

      g. de aanvraag voor subsidie voor een verkennende studieactiviteiten bevat die direct verband houden met:

      1°. de omvang van de uitvoer naar andere lidstaten van de Europese Unie of derde landen;

      2°. het oprichten en exploiteren van een distributienet ten behoeve van de uitvoer, of

      3°. andere lopende uitgaven direct verband houdend met activiteiten op het gebied van uitvoer.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.117
  - number: 4.2.117a
    text: |-
      1 Onverminderd [artikel 4.2.3, eerste en tweede lid][ref1], bevat een aanvraag om subsidie voor een verkennende
      studie tenminste een verklaring de-minimissteun van elke deelnemer in het samenwerkingsverband.

      2 Tegelijkertijd met de aanvraag tot subsidievaststelling, geeft de subsidieontvanger door middel van een verslag
      tenminste inzicht in:

      a. de vervolgstappen die het samenwerkingsverband gaat zetten na afloop van het project om tot uitvoering en
      implementatie in de markt van wat onderzocht is te komen;

      b. de verwachte CO-reductie die zou ontstaan bij uitvoering en implementatie in de markt van wat onderzocht is.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.3
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.117a
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 4.2.3
        hoofdstuk: '4'
        paragraaf: 4.2.1
  - number: 4.2.118
    text: |-
      Het eindverslag dat bij de aanvraag voor subsidievaststelling wordt ingediend, bedoeld in
      [artikel 50, tweede lid, onderdeel a van het besluit][ref1], geeft in ieder geval inzicht in:

      a. de financiële of economische kansen, inclusief een of meer mogelijke verdienmodellen die noodzakelijk zijn om
      het concept of de technologie succesvol toe te kunnen passen;

      b. de niet-technologische factoren die een rol kunnen spelen bij de toepassing van het concept of de technologie in
      de markt en de wijze waarop daarmee wordt omgegaan;

      c. indien het project een technologieontwikkeling betreft: de inbedding van de technologie in de
      energiewaardeketen;

      d. de opschalingsmogelijkheden en het herhaalpotentieel van wat onderzocht is;

      e. indien het een haalbaarheidsstudie binnen de programmalijn CCUS, bedoeld in [bijlage 4.2.16][ref2],
      betreft, voor zover van toepassing, een algemene en technische omschrijving van de onderzochte installaties en
      infrastructuur, een exploitatieberekening inclusief de financiële parameters van het onderzochte project, de
      investeringskosten per component van het onderzochte project, de kostenopbouw toegespitst op de verschillende
      kostencomponenten, inclusief risico-opslag, en een overzicht van alle kosten en baten.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.118
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0035474
  - number: 4.2.119
    text: |-
      1 De subsidie voor een verkennende studie bevat staatssteun en wordt gerechtvaardigd door de algemene de-
      minimisverordening.

      2 De subsidie voor de haalbaarheidsstudies bevat staatssteun en wordt gerechtvaardigd door artikel 25 van de
      algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.119
  - number: 4.2.120
    text: |-
      1 In deze paragraaf wordt verstaan onder:

        - *ERA-NET energiecall:* gezamenlijke oproep van deelnemende lidstaten voor aanvragen voor ERA-NET
      energieprojecten, genoemd in de ministeriële regeling, bedoeld in [artikel 16 van het besluit][ref1], gedurende de
      daarin genoemde openstellingsperiode;
        - *ERA-NET energieproject:* internationaal project bestaande uit fundamenteel onderzoek voor zover het niet-
      economische activiteiten van onderzoeksorganisaties betreft, industrieel onderzoek, experimentele ontwikkeling,
      een energiedemonstratieproject of een combinatie van deze vormen, dat is ingediend op grond van een ERA-NET
      energiecall;
        - *internationale expert-panel:* panel als bedoeld in de ERA-NET energiecall, dat de ERA-NET energieprojecten
      beoordeelt;
        - *internationale rangschikking:* rangschikking van de aanvragen voor een ERA-NET energieproject door het
      internationale expert-panel;
        - *internationale voorselectie:* voorselectie van de conceptaanvragen voor een ERA-NET energieproject door de
      lidstaten als bedoeld in de ERA-NET energiecall.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel16
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.120
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '16'
  - number: 4.2.121
    text: |-
      De minister verstrekt op aanvraag een subsidie voor het uitvoeren van activiteiten in een ERA-NET energieproject
      aan:

      a. een in Nederland gevestigde deelnemer aan een ERA-NET energieproject, of

      b. een deelnemer in een samenwerkingsverband van in Nederland gevestigde deelnemers aan een ERA-NET energieproject.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.121
  - number: 4.2.122
    text: |-
      1 De subsidie bedraagt:

      a. 50% van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek;

      b. 25% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling;

      c. 80% van de subsidiabele kosten voor zover deze betrekking hebben op niet-economische activiteiten door
      onderzoeksorganisaties;

      d. indien het ERA-NET energieproject bestaat uit een energiedemonstratieproject:

      1°. 30% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat energie-
      efficiëntiemaatregelen betreft;

      2°. 45% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat maatregelen betreft
      ter bevordering van energie uit hernieuwbare energiebronnen en waarbij de subsidiabele kosten worden berekend in
      overeenstemming met artikel 41, zesde lid, onderdeel a of b, van de algemene groepsvrijstellingsverordening;

      3°. 30% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat maatregelen betreft
      ter bevordering van energie uit hernieuwbare energiebronnen en waarbij de subsidiabele kosten worden berekend in
      overeenstemming met artikel 41, zesde lid, onderdeel c, van de algemene groepsvrijstellingsverordening.

      2 De subsidiabele kosten van een ERA-NET energieproject bestaande uit een energiedemonstratieproject worden
      berekend volgens de artikelen 38 en 41 van de algemene groepsvrijstellingsverordening.

      3 De in het eerste lid, onderdelen a, b en d, genoemde percentages worden met 20 procentpunten verhoogd, indien de
      aanvrager een kleine onderneming is en de subsidiabele kosten worden gemaakt en betaald door de kleine onderneming.

      4 De in het eerste lid, onderdelen a, b en d, genoemde percentages worden met 10 procentpunten verhoogd, indien de
      aanvrager een middelgrote onderneming is en de subsidiabele kosten worden gemaakt en betaald door de middelgrote
      onderneming.

      5 Onverminderd het derde en vierde lid, worden de in het eerste lid, onderdelen a en b, genoemde percentages voor
      ondernemingen met 10 procentpunten verhoogd, indien het project samenwerking met een onderzoeksorganisatie betreft,
      de onderzoeksorganisatie minstens 10% van de subsidiabele projectkosten draagt en de onderzoeksorganisatie het
      recht heeft de resultaten van het project te publiceren voor zover deze afkomstig zijn van het door die organisatie
      uitgevoerde onderzoek.

      6 Het maximale subsidiebedrag is het maximale subsidiebedrag, bedoeld in de ERA-NET energiecall.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.122
  - number: 4.2.123
    text: De minister verdeelt het subsidieplafond per ERA-NET energiecall op volgorde van de internationale rangschikking.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.123
  - number: 4.2.124
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is de termijn, genoemd in de ERA-NET
      energiecall.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.124
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 4.2.125
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. het ERA-NET energieproject in de internationale voorselectie wordt afgewezen;

      b. het ERA-NET energieproject in de internationale rangschikking een lager aantal punten krijgt toegekend dan het
      minimaal aantal punten, genoemd in de ERA-NET energiecall;

      c. het ERA-NET energieproject in de internationale rangschikking niet aanbevolen wordt voor financiering;

      d. het ERA-NET energieproject niet voldoet aan de voorwaarden, bedoeld in de ERA-NET energiecall;

      e. een of meer niet in Nederland gevestigde deelnemers niet worden ondersteund vanuit hun nationale programma’s
      voor hun aandeel in het ERA-NET energieproject.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.125
  - number: 4.2.126
    text: |-
      1 De subsidieontvanger voldoet aan voorwaarden en verplichtingen die zijn opgenomen in de ERA-NET energiecall.

      2 In afwijking van [artikel 4.2.2, vierde lid][ref1], wordt iedere publicatie door of met medewerking van de in
      Nederland gevestigde deelnemers in het project of diens medewerkers voorzien van de vermelding dat het een ERA-NET
      energieproject betreft en van de naam van de ERA-NET energiecall.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.2
