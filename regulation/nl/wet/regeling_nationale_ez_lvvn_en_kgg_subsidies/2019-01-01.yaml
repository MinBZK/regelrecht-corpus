  - number: 4.2.8
    text: |-
      In deze paragraaf wordt verstaan onder BBEGR Innovatieproject: project bestaande uit industrieel onderzoek
      of experimentele ontwikkeling of een combinatie van deze vormen, dat past binnen de in [bijlage 4.2.1][ref1]
      (Programmalijnen BBEGR Innovatieprojecten) opgenomen programmalijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.8
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 4.2.9
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een deelnemer in een samenwerkingsverband voor het uitvoeren
      van een BBEGR Innovatieproject.

      2 Een samenwerkingsverband bevat ten minste één onderneming.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.9
  - number: 4.2.10
    text: |-
      1 De subsidie bedraagt voor een BBEGR Innovatieproject:

      a. 50% van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek;

      b. 25% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling;

      c. 80% van de subsidiabele kosten voor zover deze betrekking hebben op niet-economische activiteiten van
      onderzoeksorganisaties.

      2 De in het eerste lid, onderdelen a en b, genoemde percentages worden met 20 procentpunten verhoogd, indien de
      aanvrager een kleine onderneming is en de subsidiabele kosten worden gemaakt en betaald door de kleine onderneming.

      3 De in het eerste lid, onderdelen a en b, genoemde percentages worden met 10 procentpunten verhoogd, indien de
      aanvrager een middelgrote onderneming is en de subsidiabele kosten worden gemaakt en betaald door de middelgrote
      ondernemer.

      4 De subsidie bedraagt maximaal € 500.000 per BBEGR Innovatieproject.

      5 De subsidie bedraagt per deelnemer in een samenwerkingsverband minder dan € 125.000, indien deze een BBEGR
      Innovatieproject uitvoert als bedoeld in programmalijn 3 (Chemische recycling van kunststoffen), opgenomen in
      [bijlage 4.2.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.10
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 4.2.11
    text: |-
      Per programmalijn, zoals beschreven in [bijlage 4.2.1][ref1], verdeelt de minister het subsidieplafond op volgorde
      van de rangschikking van de aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.11
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 4.2.12
    text: |-
      1 De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is vier jaar.

      2 In afwijking van het eerste lid is de termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref2], één
      jaar voor een BBEGR Innovatieproject als bedoeld in programmalijn 3 (Chemische recycling van kunststoffen), zoals
      beschreven in [bijlage 4.2.1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.12
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0035474
  - number: 4.2.13
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. na toepassing van [artikel 4.2.14, eerste lid][ref1], minder dan 3 punten per criterium zijn toegekend;

      b. eerder op grond van deze titel een subsidie is verstrekt voor een soortgelijk project.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.14
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.13
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 4.2.14
        hoofdstuk: '4'
        paragraaf: 4.2.2
  - number: 4.2.14
    text: |-
      1 De minister kent aan een project een hoger aantal punten toe naarmate:

      a. het project meer bijdraagt aan verduurzaming van de Nederlandse energiehuishouding en maatschappelijk relevanter
      is, binnen de context van het innovatiecontract van de topsector energie (Kamerstukken II 2011/12, 32 637, nr. 32);

      b. de mogelijke bijdrage van het project aan de Nederlandse economie groter is;

      c. het project vernieuwender is ten opzichte van de internationale stand van onderzoek of techniek en de
      Nederlandse kennispositie meer versterkt;

      d. de kwaliteit van het project beter is, blijkend uit de uitwerking van aanpak en methodiek, de omgang met
      risico’s, de uitvoerbaarheid en de deelnemende partijen.

      2 De minister kent per onderdeel van het eerste lid ten minste één en ten hoogste vijf punten toe.

      3 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.

      4 Geen subsidie wordt verleend voor een project dat lager is gerangschikt dan een soortgelijk project.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.14
  - number: 4.2.14a
    text: |-
      De subsidie, bedoeld in [artikel 4.2.9][ref1]. bevat staatssteun en wordt gerechtvaardigd door artikel 25 van de
      algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.9
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.14a
