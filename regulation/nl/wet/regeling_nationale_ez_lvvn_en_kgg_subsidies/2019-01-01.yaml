  - number: 3.2.3a
    text: |-
      1 Voor de toepassing van [3.2.3, eerste lid, aanhef en onderdeel b][ref1], worden ter bepaling
      van de hoogte van de PPS-programmatoeslag ook private bijdragen aan onderzoeksinstellingen
      voor onderzoek dat past binnen het TKI-programma, afkomstig van instellingen als bedoeld in
      [artikel 5b, eerste lid, van de Algemene wet inzake rijksbelastingen][ref2], in aanmerking genomen tot ten hoogste
      een plafond van € 90.000.000 per openstellingsperiode voor alle TKI’s tezamen.

      2 Indien het totaal van de private bijdragen, bedoeld in het eerste lid, die in een openstellingsperiode door de
      TKI’s zijn opgevoerd in aanvragen voor PPS-programmatoeslag uitstijgt boven het plafond, bedoeld in het eerste lid,
      verdeelt de minister dit plafond naar evenredigheid over de TKI’s die private bijdragen als bedoeld in het eerste
      lid hebben opgevoerd.

      3 Bij de in het tweede lid bedoelde verdeling wordt het bedrag aan private bijdragen dat per TKI in een
      kalenderjaar in aanmerking wordt genomen, berekend overeenkomstig de formule

      **(A / A-totaal) x Plafond**, waarbij wordt verstaan onder:

      **A**: het totaal van de private bijdragen, bedoeld in het eerste lid, die door een TKI in een openstellingsperiode
      in een of meer aanvragen voor PPS-programmatoeslag zijn opgevoerd, tot een maximum van € 75.000.000;

      **A-totaal**: het bedrag dat wordt berekend door het als ‘A’ gedefinieerde totaal van elk van de TKI’s bij elkaar
      op te tellen;

      **Plafond**: het plafond, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.3
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel5b
