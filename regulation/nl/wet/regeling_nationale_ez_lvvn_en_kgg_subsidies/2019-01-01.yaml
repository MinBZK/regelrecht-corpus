  - number: 2.3.5
    text: |-
      1 De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.

      2 Indien blijkt dat het totale bedrag van de te verlenen subsidies voor projecten als bedoeld in
      [artikel 2.10.2, eerste lid][ref1], lager is dan het daarvoor vastgestelde subsidieplafond, wordt het overblijvende
      bedrag zo nodig aan het subsidieplafond voor projecten als bedoeld in [artikel 2.3.2, eerste lid][ref2],
      toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.10.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.3.2
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.3.5
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.10.2
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 2.3.2
        hoofdstuk: '2'
  - number: 2.3.6
    text: |-
      1 De kosten, genoemd onder punt 144, onder a en b, van het Landbouwsteunkader, komen in aanmerking voor de
      subsidie.

      2 Onverminderd het eerste lid komen de kosten voor de fysieke aansluiting, bedoeld in
      [artikel 2.3.2, eerste lid, onderdelen b en c][ref1], voor subsidie in aanmerking, voor zover deze kosten
      bestaan uit de werkelijke kosten voor materialen en aanleg van deze aansluiting, zoals de kosten voor buizen,
      verdeelstukken, pomp- en leidingenwerk, graafwerkzaamheden en overige toebehoren.

      3 Bij de kosten voor de verwerving van onroerende zaken zijn inbegrepen de daaraan verbonden kosten van
      overdrachtsbelasting, notariële kosten en de kosten van inschrijving bij het kadaster.

      4 Voor de subsidie komen niet in aanmerking kosten voor de verwerving van onroerende zaken met uitzondering van
      grond, ten behoeve waarvan subsidie door een bestuursorgaan is verleend in de periode van tien jaar voorafgaand aan
      de ontvangstdatum van de aanvraag tot subsidieverlening.

      5 Voor de subsidie komen niet in aanmerking de kosten, genoemd onder punt 145 van het Landbouwsteunkader.

      6 De maximale subsidiabele kosten per vierkante meter geïnstalleerd kasoppervlak bedragen voor:

      a. een tweede energiescherm:

      1°. € 6;

      2°. € 7, voor zover het totaal aantal vierkante meters geïnstalleerd kasoppervlak minder dan 4 hectare bedraagt;

      b. een luchtbehandelingssysteem als bedoeld in [artikel 2.3.2, eerste lid, onderdeel d][ref2], € 15.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.3.2
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.3.6
