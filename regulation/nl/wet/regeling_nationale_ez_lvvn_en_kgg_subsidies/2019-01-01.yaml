  - number: 3.8.9
    text: |-
      De minister beslist afwijzend op een aanvraag:

      a. indien van het innovatieproject onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten zijn;

      b. afkomstig van een overheid of overheidsinstelling, tenzij het een onderzoeksorganisatie betreft;

      c. indien, in het geval van een Global Stars-innovatieproject, aannemelijk is dat het Global Stars-innovatieproject
      geen doorgang kan vinden om redenen die samenhangen met andere omstandigheden in de andere deelnemende landen van
      het Global Stars-innovatieproject of met financiële of technische problemen van een van de deelnemende partijen in
      een ander deelnemend land.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.8.9
  - number: 3.8.10
    text: |-
      1 De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate:

      a. een innovatieproject meer bijdraagt aan technologische vernieuwing of wezenlijk nieuwe toepassingen van een
      bestaande technologie;

      b. de bijdrage aan de doelmatigheid en doeltreffendheid van een innovatieproject, de nieuwheid van een
      samenwerkingsverband en de betrokkenheid van onderzoeksorganisaties groter zijn;

      c. de projectresultaten meer economische waarde creëren voor Nederland;

      d. meer wordt aangesloten bij de doelstellingen van de deelnemende ondernemingen en de toepassingsmogelijkheden van
      de projectresultaten uitgebreider zijn.

      2 Voor de rangschikking wegen de in het eerste lid vermelde criteria even zwaar.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.8.10
