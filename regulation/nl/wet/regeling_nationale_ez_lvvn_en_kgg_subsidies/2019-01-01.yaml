  - number: 4.4.7
    text: De minister verdeelt het subsidieplafond evenredig over de ingediende aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.4.7
  - number: 4.4.8
    text: |-
      1 De afwijzingsgronden, genoemd in [artikel 23, onderdelen a tot met h, van het besluit][ref1] zijn niet van
      toepassing.

      2 De minister beslist afwijzend op een aanvraag om subsidie indien:

      a. de subsidieaanvrager geen deelnemer is van een convenant, waarin de subsidieaanvrager in het kader van met de
      minister, de Minister van Financiën en de minister van Infrastructuur en Milieu gemaakte afspraken verplichtingen
      op zich heeft genomen ter verbetering van de energie-efficiëntie,

      b. de subsidieaanvrager de minister niet voor 16 april van het jaar van aanvraag heeft gerapporteerd over de
      voortgang van de uitvoering van haar door de minister van een positief advies voorzien energie-efficiëntieplan en

      c. de subsidieaanvrager:

      1°. de in het energie-efficiëntieplan vastgelegde maatregel ter verbetering van de energie-efficiëntie voor het
      jaar voorafgaand aan het jaar van de aanvraag niet heeft gerealiseerd in het voorafgaande jaar,

      2°. geen andere maatregel heeft getroffen tot verbetering van de energie-efficiëntie in het jaar voorafgaand aan
      het jaar van de aanvraag of

      3°. geen argument heeft aangeleverd dat door de minister als valide wordt aangemerkt voor het niet realiseren van
      de in het energie efficiency plan vastgelegde maatregel tot verbetering van de energie-efficiëntie.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.4.8
    references:
