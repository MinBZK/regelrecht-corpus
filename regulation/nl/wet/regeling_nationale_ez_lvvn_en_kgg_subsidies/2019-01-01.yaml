  - number: 4.4.2
    text: |-
      De minister verstrekt op aanvraag subsidie aan een ondernemer die een inrichting drijft waar producten worden
      vervaardigd in bedrijfstakken of deeltakken die worden geacht te zijn blootgesteld aan een significant CO-
      weglekrisico ten gevolge van in de elektriciteitsprijzen doorberekende kosten in verband met broeikasgasemissies,
      bedoeld in [bijlage 4.4.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.4.2
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 4.4.3
    text: |-
      1 De hoogte van de subsidie voor de kosten die in het jaar t zijn gemaakt, wordt:

      a. voor elk product waarvoor een efficiëntiebenchmark voor elektriciteitsgebruik is vastgesteld, afzonderlijk
      berekend overeenkomstig de volgende formule:

      Ait * C * Pt-1 * E * BO.

      In deze formule betekent:

      Ait: de steunintensiteit in jaar t, bedoeld in het derde lid, uitgedrukt als een percentage;

      C: de CO-emissiefactor;

      Pt-1: de EUA-termijnkoers in jaar t-1 (Euro/tCO);

      E: de toepasselijk productspecifieke efficiëntiebenchmark als omschreven in [bijlage 4.4.2][ref1];

      BO: de referentie-output van het toepasselijk product.

      b. voor producten waarvoor geen efficiëntiebenchmark voor elektriciteitsgebruik is vastgesteld, berekend met
      gebruikmaking van de fallback-efficiëntiebenchmark voor elektriciteitsverbruik overeenkomstig de volgende formule:

      Ait *C *Pt-1 * EF *BEC.

      In deze formule betekent:

      Ait: de steunintensiteit in jaar t, bedoeld in het derde lid, uitgedrukt als een percentage;

      C: de CO-emissiefactor;

      Pt-1: de EUA-termijnkoers in jaar t-1 (Euro/tCO);

      EF: de fallback-benchmark voor elektriciteitsverbruik;

      BEC: het referentie-elekriciteitsverbruik (MWh).

      2 De hoogte van het subsidiebedrag wordt verminderd met het bedrag in euro dat overeenkomt met de indirecte
      emissiekosten ETS van 1.000 MWh, berekend overeenkomstig de volgende formule:

      Ait *C *Pt-1 * EF *BEC.

      In deze formule betekent

      Ait: de steunintensiteit in jaar t, bedoeld in het derde lid, uitgedrukt als een percentage;

      C: de CO-emissiefactor;

      Pt-1: de EUA-termijnkoers in jaar t-1 (Euro/tCO);

      EF: de fallback-benchmark voor elektriciteitsverbruik;

      BEC: 1.000 (MWh).

      3 De steunintensiteit in jaar t, bedoeld in het eerste en tweede lid, bedraagt 85 procent van de subsidiabele
      kosten gemaakt in 2013 tot en met 2015, 80 procent van de subsidiabele kosten gemaakt in 2016 tot en met 2018, en
      75 procent van de subsidiabele kosten gemaakt in 2019 en 2020.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.4.3
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 4.4.4
    text: |-
      In aanvulling op [artikel 4.4.3][ref1] wordt:

      a. de hoogte van het subsidiebedrag dat overeenstemt met de referentie-output gehalveerd wanneer het
      productieniveau van het product waarvoor een efficiëntie benchmark voor elektriciteitsverbruik is vastgesteld in
      het kalenderjaar voorafgaand aan het jaar waarin de subsidie wordt aangevraagd 50 tot 75 procent daalt ten opzichte
      van de referentie-output;

      b. de hoogte van het subsidiebedrag dat overeenstemt met de referentie-output met 75 procent verminderd wanneer het
      productieniveau van het product waarvoor een efficiëntiebenchmark voor elektriciteitsverbruik is vastgesteld in het
      kalenderjaar voorafgaand aan het jaar waarin de subsidie wordt aangevraagd 75 tot 90 procent daalt ten opzichte van
      de referentie-output;

      c. de subsidie op nihil vastgesteld wanneer het productieniveau van het product waarvoor een efficiëntiebenchmark
      voor elektriciteitsverbruik is vastgesteld in het kalenderjaar voorafgaand aan het jaar waarin de subsidie wordt
      aangevraagd 90 procent of meer daalt ten opzichte van de referentie-output.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.4.3
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.4.4
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 4.4.3
        hoofdstuk: '4'
  - number: 4.4.5
    text: |-
      In aanvulling op [artikel 4.4.3][ref1] wordt:

      a. de hoogte van het subsidiebedrag dat overeenstemt met het referentie-elektriciteitsgebruik gehalveerd wanneer
      het elektriciteitsverbruik voor de vervaardiging van producten waarvoor geen efficiëntiebenchmark is vastgesteld
      van een inrichting in het kalenderjaar voorafgaand aan het jaar waarin de subsidie wordt aangevraagd 50 tot 75
      procent daalt ten opzichte van het referentie-elektriciteitsverbruik;

      b. de hoogte van het subsidiebedrag dat overeenstemt met het referentie-elektriciteitsgebruik met 75
      procent verminderd wanneer het elektriciteitsverbruik voor de vervaardiging van producten waarvoor geen
      efficiëntiebenchmark is vastgesteld van een inrichting in het kalenderjaar voorafgaand aan het jaar waarin de
      subsidie wordt aangevraagd 75 tot 90 procent daalt ten opzichte van de het referentie-elektriciteitsverbruik;

      c. de subsidie op nihil vastgesteld wanneer het elektriciteitsverbruik voor de vervaardiging van producten waarvoor
      geen efficiëntiebenchmark is vastgesteld van een inrichting in het kalenderjaar voorafgaand aan het jaar waarin de
      subsidie wordt aangevraagd 90 procent of meer daalt ten opzichte van de het referentie-elektriciteitsverbruik.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.4.3
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.4.5
    references:
