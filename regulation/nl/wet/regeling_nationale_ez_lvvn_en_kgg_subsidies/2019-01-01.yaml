  - number: 3.2.4
    text: |-
      De minister beslist afwijzend op een aanvraag voor PPS-programmatoeslag indien: (Externe link)

      a. ten aanzien van de beoogde aanwending door een TKI van PPS-programmatoeslag voor een samenwerkingsproject niet
      wordt voldaan aan de voorwaarden in paragraaf 2.2.2, onderdeel 28, onder b, c of d in samenhang met onderdeel 29,
      van het O&O&I-steunkader;

      b. het bestaan van een samenwerkingsproject, en de verschuldigdheid van private bijdragen en inzet in natura
      daaraan, op basis waarvan de hoogte van de PPS-programmatoeslag wordt bepaald, niet kan worden aangetoond aan de
      hand van een schriftelijke ondertekende samenwerkingsovereenkomst;

      c. de beoogde aanwending van de PPS-programmatoeslag voor een samenwerkingsproject niet bijdraagt aan het TKI-
      programma;

      d. de beoogde aanwending van de PPS-programmatoeslag voor een samenwerkingsproject zou leiden tot een
      overschrijding van de aanmeldingsdrempel, bedoeld in artikel 4 van de algemene groepsvrijstellingsverordening, voor
      fundamenteel of industrieel onderzoek of experimentele ontwikkeling, of voor innovatieadviesdiensten

      e. een bepaald samenwerkingsproject of een bepaalde innovatieactiviteit is gestart voorafgaand aan de eerste
      aanvraag waarbij aanwending van de PPS-toeslag of TKI-toeslag voor dat project of die activiteit werd aangevraagd.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.2.4
  - number: 3.2.5
    text: |-
      1 Het TKI dat PPS-programmatoeslag ontvangt, wendt deze toeslag voor samenwerkingsprojecten zodanig aan dat:

      a. wordt voldaan aan de voorwaarden in paragraaf 2.2.2, onderdeel 28, onder b, c of d, in samenhang met onderdeel
      29, van de O&O&I-kaderregeling;

      b. het totale bedrag aan steun dat voor een begunstigde deelnemer in een samenwerkingsproject beschikbaar is niet
      meer bedraagt dan:

      1°. 100% van de subsidiabele kosten voor zover deze betrekking hebben op fundamenteel onderzoek;

      2°. 50% van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek;

      3°. 25% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling;

      c. verzekerd is dat ondernemers en onderzoeksinstellingen onder transparante en redelijke voorwaarden in aanmerking
      komen voor deelname aan samenwerkingsprojecten die bijdragen aan het TKI-programma;

      d. deze uitsluitend wordt ingezet indien het bestaan van het samenwerkingsproject, en de verschuldigdheid van
      private bijdragen en inzet in natura daaraan, kan worden aangetoond aan de hand van een schriftelijke ondertekende
      samenwerkingsovereenkomst; en

      e. het samenwerkingsproject bijdraagt aan de Nederlandse kennisinfrastructuur.

      2 De subsidiabele kosten, bedoeld in het eerste lid, onderdeel b, zijn kosten als bedoeld in artikel 25, derde lid,
      van de algemene groepsvrijstellingsverordening.

      3 Het TKI dat PPS-programmatoeslag ontvangt, wendt deze toeslag voor innovatieactiviteiten zodanig aan dat:

      a. bij netwerkactiviteiten:

      1°. slechts aan derden verschuldigde kosten met betrekking tot de netwerkactiviteiten met PPS-programmatoeslag
      betaald worden;

      2°. de opdrachtverlening door het TKI aan derden plaatsvindt op basis van transparante criteria en tegen
      marktconforme tarieven; en

      3°. de netwerkactiviteiten en hieruit voortkomende resultaten voor iedere MKB-onderneming zonder onderscheid
      toegankelijk zijn, ofwel, indien de netwerkactiviteiten niet voortdurend en voor een ieder vrij toegankelijk zijn,
      per € 1000 PPS-programmatoeslag minstens één MKB-ondernemer deelneemt aan de netwerkactiviteiten.

      b. bij innovatieadviesdiensten:

      1°. de door het TKI in te zetten innovatiemakelaars op basis van transparante en redelijke criteria geselecteerd
      worden;

      2°. het totale bedrag aan PPS-programmatoeslag niet meer bedraagt dan 50% van de subsidiabele kosten verbonden aan
      een innovatieadviesdienst, uitgezonderd opleiding, met een maximum van € 10.000 per MKB-ondernemer over een periode
      van één jaar, en

      3°. aan een MKB-ondernemer gedurende maximaal drie jaar innovatieadviesdiensten worden geleverd.

      4 De subsidiabele kosten, bedoeld in het derde lid, onderdeel b, onder 2°, zijn kosten als bedoeld in artikel 28,
      tweede lid, onderdeel c, van de algemene groepsvrijstellingsverordening.

      5 Het TKI dat PPS-programmatoeslag ontvangt, neemt bij de aanwending van de PPS-programmatoeslag, indien van
      toepassing, de gemeenschappelijke ordening van de landbouwproducten in acht, bedoeld in artikel 40, eerste lid, van
      het Verdrag betreffende de werking van de Europese Unie.

      6 De PPS-programmatoeslag wordt aangewend binnen vijf jaar na verlening.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.2.5
  - number: 3.2.6
    text: |-
      Onverminderd het bepaalde in [artikel 38 van het besluit][ref1], draagt het TKI dat PPS-programmatoeslag ontvangt,
      zorg voor een administratie:

      a. waaruit op eenvoudige en duidelijke wijze kan worden afgeleid of en hoe de PPS-programmatoeslag wordt aangewend
      voor het uitvoeren van de in het TKI-programma opgenomen samenwerkingsprojecten en voor innovatieactiviteiten;

      b. waaruit op eenvoudige wijze kennis genomen kan worden van de samenwerkingsovereenkomsten voor de projecten
      waarvoor de PPS-programmatoeslag wordt aangewend, en van de private bijdragen of inzet in natura die op basis van
      die overeenkomst verschuldigd zijn, en

      c. waarin de wijze wordt vastgelegd waarop deelnemers aan samenwerkingsprojecten waarvoor PPS-programmatoeslag
      wordt aangewend, omgaan met intellectueel eigendom dat voorkomt uit deze projecten.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel38
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.2.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '38'
  - number: 3.2.7
    text: |-
      1 De rapportage, bedoeld in [artikel 39, eerste lid, van het besluit][ref1], bevat in ieder geval:

      a. een overzicht van de mate waarin de samenwerkingsprojecten waarvoor de PPS-programmatoeslag wordt aangewend,
      alsmede de private bijdragen aan en de inzet in natura voor deze projecten van het lopende jaar zijn gerealiseerd;

      b. een opgave van de afwijkingen van het TKI-programma;

      c. een overzicht van de activiteiten en doelen voor het eerstvolgende jaar;

      d. een overzicht van de mate waarin de uit TKI-relevante onderzoeksopdrachten, waarvoor op grond van
      [artikel 3.2.3, eerste lid, aanhef en onderdeel a, onder 2°][ref2], PPS-programmatoeslag is ontvangen,
      voortgevloeide kennis toegepast wordt binnen samenwerkingsprojecten van het TKI-programma;

      e. ingeval de PPS-programmatoeslag wordt aangewend voor innovatieactiviteiten: een overzicht van de mate waarin
      deze innovatieactiviteiten van het lopende jaar zijn gerealiseerd.

      2 Het TKI dat PPS-programmatoeslag ontvangt, zorgt dat actuele informatie over de samenwerkingsprojecten waarvoor
      de PPS-programmatoeslag wordt aangewend op eenvoudige wijze voor het algemene publiek kenbaar is. De informatie
      omvat ten minste een beschrijving van het onderzoek, de deelnemende ondernemers en onderzoeksinstellingen, de
      planning en voortgang.

      3 Het tweede lid, eerste volzin, is van overeenkomstige toepassing op informatie over de voorwaarden waaronder
      deelname door ondernemers en onderzoeksinstellingen aan samenwerkingsprojecten van het TKI-programma openstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.3
