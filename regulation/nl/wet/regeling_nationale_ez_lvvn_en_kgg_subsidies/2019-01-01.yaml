  - number: 3.4.3
    text: |-
      1 Een aanvraag van een MKB-ondernemer voor een MIT-innovatie-adviesproject of een MIT-haalbaarheidsproject wordt
      afgewezen indien aan hem in hetzelfde kalenderjaar al subsidie is verstrekt op grond van deze titel voor een MIT-
      innovatie-adviesproject of een MIT-haalbaarheidsproject.

      2 Een aanvraag van een MKB-ondernemer voor een MIT-R&D-samenwerkingsproject wordt afgewezen indien aan hem in
      hetzelfde kalenderjaar al subsidie is verstrekt op grond van deze titel voor een MIT-R&D-samenwerkingsproject.

      3 Een aanvraag voor een subsidie op grond van deze titel voor een MIT-innovatie-adviesproject, een MIT-
      haalbaarheidsproject of een MIT-R&D-samenwerkingsproject wordt afgewezen indien in hetzelfde kalenderjaar door
      een provincie of een samenwerkingsverband van provincies een subsidie voor een van de genoemde soorten projecten,
      waarop de aanvraag betrekking heeft, kan worden verstrekt of is verstrekt voor respectievelijk een MIT-innovatie-
      adviesproject, een MIT-haalbaarheidsproject of een MIT-R&D-samenwerkingsproject.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.3
  - number: 3.4.3a
    text: |-
      De aanvrager voegt bij de aanvraag een samenvatting van het project waarvoor de subsidie wordt aangevraagd die door
      de minister kan worden gebruikt in voor een ieder toegankelijke publicaties.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.3a
  - number: 3.4.4
    text: Subsidie voor een haalbaarheidsproject wordt verleend aan een MKB-ondernemer.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.4
  - number: 3.4.5
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een MKB-ondernemer die een MIT-haalbaarheidsproject uitvoert
      dat voor ten minste 60% bestaat uit een haalbaarheidsstudie en voor ten hoogste 40% uit industrieel onderzoek of
      experimentele ontwikkeling.

      2 Het subsidiebedrag bedraagt ten hoogste € 25.000,–.

      3 De subsidie bedraagt 40% van de subsidiabele kosten, met dien verstande dat indien een MIT-haalbaarheidsproject
      ook bestaat uit experimentele ontwikkeling, de subsidie 35% van de subsidiabele kosten voor dat deel van het
      project bedraagt.

      4 De subsidiabele kosten zijn de kosten, bedoeld in artikel 25, derde lid, van de algemene
      groepsvrijstellingsverordening voor zover het kosten betreft voor industrieel onderzoek of experimentele
      ontwikkeling, en de kosten, bedoeld in artikel 25, vierde lid, van de algemene groepsvrijstellingsverordening voor
      zover het kosten betreft voor een haalbaarheidsstudie.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.5
  - number: 3.4.6
    text: |-
      1 Met de uitvoering van het haalbaarheidsproject wordt gestart binnen vier maanden na indiening van de
      subsidieaanvraag.

      2 Het haalbaarheidsproject wordt uitgevoerd binnen twaalf maanden na de start van het haalbaarheidsproject.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.6
  - number: 3.4.7
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. de voorgenomen activiteiten waarop het haalbaarheidsproject betrekking heeft in technische of financiële zin
      onvoldoende risicovol zijn om de haalbaarheidsstudie te rechtvaardigen;

      b. het haalbaarheidsproject onvoldoende inzicht geeft in het economisch perspectief en de uitvoerbaarheid van de
      voorgenomen activiteiten waarop de haalbaarheidsstudie betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.7
  - number: 3.4.8
    text: |-
      Een MIT-kennisvoucher heeft een waarde van maximaal € 3.750 en wordt aan een MKB-ondernemer verstrekt die een MIT-
      kennisoverdrachtsproject wil laten uitvoeren waarvan de resultaten ten goede komen aan de activiteiten die de
      ondernemer in Nederland verricht.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.8
  - number: 3.4.9
    text: |-
      1 De MKB-ondernemer vermeldt bij de aanvraag de kennisvraag die hij in het kader van het MIT-
      kennisoverdrachtsproject wil stellen.

      2 In de aanvraag wordt één kennisinstelling opgenomen.

      3 De MKB-ondernemer legt binnen vier maanden na de dagtekening van de toekenning van een MIT-kennisvoucher een
      offerte of een ondertekende opdrachtbevestiging van de kennisinstelling over.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.9
  - number: 3.4.10
    text: De MKB-ondernemer draagt de MIT-kennisvoucher over aan de in de aanvraag opgenomen kennisinstelling.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.10
  - number: 3.4.12
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. de ondernemer en de kennisinstelling reeds voor de afgiftedatum van de MIT-kennisvoucher verplichtingen jegens
      elkaar zijn aangegaan met betrekking tot het MIT-kennisoverdrachtsproject;

      b. de ondernemer de MIT-kennisvoucher wil aanwenden voor een MIT-kennisoverdrachtsproject waarvoor reeds door een
      bestuursorgaan of de Europese Commissie subsidie is verstrekt of dat deel uitmaakt van een project of programma
      waarvoor reeds door een bestuursorgaan of de Europese Commissie subsidie is verstrekt.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.12
  - number: 3.4.13
    text: |-
      Subsidie wordt verleend aan een kennisinstelling die één of meer MIT-kennisoverdrachtsprojecten heeft uitgevoerd en
      in verband daarmee één of meer geldige MIT-kennisvouchers overlegt.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.13
  - number: 3.4.14
    text: |-
      De subsidie bedraagt 50 procent van de door de kennisinstelling ten behoeve van de uitvoering van een MIT-
      kennisoverdrachtsproject in rekening gebrachte kosten, maar niet meer dan € 3.750 per MIT-kennisvoucher.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.14
  - number: 3.4.15
    text: |-
      1 Een aanvraag om subsidie wordt na afloop van het MIT-kennisoverdrachtsproject door de kennisinstelling ingediend.

      2 De aanvraag moet binnen een jaar nadat de MIT-kennisvoucher aan de ondernemer is verstrekt zijn ontvangen. Op
      een voor het einde van de termijn daartoe ingediend verzoek kan de minister deze termijn eenmalig verlengen met ten
      hoogste zes maanden.

      3 Indien de aanvraag niet binnen de termijn, bedoeld in het tweede lid, of indien de offerte of een ondertekende
      opdrachtbevestiging van de kennisinstelling niet binnen de termijn, bedoeld in [artikel 3.4.9, derde lid][ref1],
      door de minister is ontvangen, vervalt de MIT-kennisvoucher van rechtswege.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.4.9
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.15
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.4.9
        hoofdstuk: '3'
        paragraaf: 3.4.3
  - number: 3.4.15a
    text: Subsidie voor een MIT-innovatie-adviesproject wordt verleend aan een MKB-ondernemer.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.15a
  - number: 3.4.15b
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een MKB-ondernemer die een MIT-innovatie-adviesproject laat
      uitvoeren.

      2 Het subsidiebedrag bedraagt ten hoogste € 10.000,–.

      3 De subsidie bedraagt 50% van de subsidiabele kosten.

      4 De subsidiabele kosten zijn de kosten, waaronder loonkosten, van het verstrekken van advies en procesbegeleiding
      door kennisinstellingen of door onafhankelijke adviesorganisaties.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.15b
  - number: 3.4.15c
    text: |-
      1 Bij de aanvraag wordt een beknopt plan gevoegd, waarin de kennisvraag en de doelstelling van het innovatietraject
      zijn gevoegd, alsmede de kennisinstelling of adviesorganisatie worden genoemd die het MIT-innovatieadviesproject
      gaat uitvoeren.

      2 Bij de aanvraag wordt een verklaring gevoegd waaruit blijkt dat de adviesorganisatie die met de aanvrager het
      innovatieadviesproject gaat uitvoeren organisatorisch en financieel onafhankelijk van de aanvrager is.

      3 Met de uitvoering van het innovatieadviesproject wordt gestart binnen vier maanden na de subsidieverlening.

      4 Het innovatieadviesproject wordt uitgevoerd binnen twaalf maanden na de start van het project.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.15c
  - number: 3.4.15d
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. de ondernemer en de kennisinstelling reeds voor de subsidieverlening verplichtingen jegens elkaar zijn aangegaan
      met betrekking tot het MIT-innovatie-adviesproject;

      b. de kennisvraag in het beknopte plan kennelijk onvoldoende aansluit bij het in het beknopte plan beschreven
      innovatietraject.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.15d
  - number: 3.4.16
    text: |-
      Subsidie wordt verleend aan een MKB-ondernemer bij wie een onderzoeksorganisatie of grote onderneming
      hooggekwalificeerd personeel heeft gedetacheerd.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.16
  - number: 3.4.17
    text: |-
      De subsidiabele kosten zijn de kosten, bedoeld in artikel 28, tweede lid, onderdeel b, van de algemene
      groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.17
  - number: 3.4.18
    text: |-
      1 De gedetacheerde werknemers zijn ten minste twee jaar in dienst bij de onderzoeksorganisatie of de grote
      onderneming die de werknemers detacheert.

      2 De datum waarop de detachering van start gaat ligt maximaal zes maanden na indiening van de subsidieaanvraag.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.18
  - number: 3.4.19
    text: |-
      1 Het maximum subsidiebedrag bedraagt € 50.000 per subsidieontvanger per jaar.

      2 Aan een MKB-ondernemer wordt per gedetacheerde werknemer voor maximaal één jaar subsidie verleend tot een maximum
      van € 50.000.

      3 Aan een MKB-ondernemer wordt gedurende maximaal drie jaar op grond van deze titel subsidie verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.19
  - number: 3.4.20
    text: |-
      De minister verstrekt op aanvraag subsidie aan een deelnemer in een MIT-R&D-samenwerkingsverband dat een MIT-R&D-
      samenwerkingsproject uitvoert.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.20
  - number: 3.4.21
    text: De penvoerder is een onderneming die deelneemt aan het MIT-R&D-samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.21
  - number: 3.4.22
    text: |-
      1 De subsidiabele kosten zijn de kosten, bedoeld in artikel 25, derde lid, van de algemene
      groepsvrijstellingsverordening.

      2 De subsidie bedraagt voor een MIT-R&D-samenwerkingsproject 35 procent van de subsidiabele kosten.

      3 Elke individuele deelnemer aan het MIT-R&D-samenwerkingsverband neemt niet meer dan 70 procent van de voor
      subsidie in aanmerking komende kosten van het MIT-R&D-samenwerkingsproject voor zijn rekening.

      4 Het subsidiebedrag bedraagt ten hoogste € 350.000,–.

      5 Het subsidiebedrag bedraagt ten minste € 25.000 en ten hoogste € 100.000 per deelnemer aan het MIT-R&D-
      samenwerkingsverband.

      6 In afwijking van het vijfde lid bedraagt het subsidiebedrag per deelnemer ten hoogste € 175.000, indien de
      subsidiabele kosten voor het MIT-R&D-samenwerkingsproject meer dan € 571.428 bedragen.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.22
  - number: 3.4.23
    text: |-
      1 Met de uitvoering van het MIT-R&D-samenwerkingsproject wordt gestart binnen zes maanden na de subsidieaanvraag.

      2 De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.4.23
