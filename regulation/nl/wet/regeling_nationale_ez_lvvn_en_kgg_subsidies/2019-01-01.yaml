    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. na toepassing van [artikel 4.2.84., eerste lid][ref1], minder dan 3 punten per criterium zijn toegekend;

      b. eerder op grond van deze titel een subsidie is verstrekt voor een soortgelijk project;

      c. in onvoldoende mate is voorzien in een kwalitatief goede kennisverspreiding;

      d. na toepassing van [artikel 4.2.84., eerste lid][ref2], een project lager is gerangschikt dan een soortgelijk
      project;

      e. de aanvraag betrekking heeft op programmalijn 2 (Systeemintegratie – Flexibilisering en elektrificatie) of
      programmalijn 3 (Circulariteit) van [bijlage 4.2.11][ref3] en na toepassing van [artikel 4.2.84, eerste lid][ref4],
      niet tot de drie hoogst gerangschikte aanvragen voor deze programmalijnen behoort;

      f. de samenwerking onvoldoende evenwichtig is, blijkend uit:

      1°. de verdeling van de kosten tussen de deelnemers, of

      2°. de verhouding tussen private en publieke financiering van het project.


