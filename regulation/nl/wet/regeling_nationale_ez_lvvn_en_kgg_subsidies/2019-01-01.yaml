  - number: 2.10.8
    text: |-
      1 Binnen de termijn, genoemd in [artikel 2.10.7][ref1]:

      a. voldoet de glastuinbouwonderneming aan wie op grond van [artikel 24, eerste lid, van de Landbouwwet][ref2] door
      de minister beschrijvingsbiljetten worden uitgereikt of gezonden, telkens aan artikel 24, tweede lid, van die wet
      voor in ieder geval het jaar waarin de gegevens zijn opgevraagd, en

      b. dient de glastuinbouwonderneming jaarlijks een emissieaangifte in als bedoeld in
      [artikel 3, eerste of tweede lid, van de Regeling kostenverevening reductie CO][ref3].

      2 De verplichting, bedoeld in het eerste lid, aanhef en onderdeel b, is niet van toepassing op een
      glastuinbouwonderneming als bedoeld in [artikel 15.51, tweede lid, onderdeel b, van de Wet milieubeheer][ref4].


