    text: De subsidie bedraagt 100% van de kosten van de haalbaarheidsstudie doch ten hoogste € 40.000.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.16.11b
  - number: 3.16.11c
    text: |-
      1 Met de uitvoering van de haalbaarheidsstudie wordt gestart binnen zes maanden nadat de subsidie is verleend.

      2 De haalbaarheidsstudie wordt uitgevoerd binnen zes maanden na de start van de haalbaarheidsstudie.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.16.11c
  - number: 3.16.11d
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. de voorgenomen activiteiten waarop de haalbaarheidsstudie betrekking heeft in technische of financiële zin
      onvoldoende risicovol zijn om de haalbaarheidsstudie te rechtvaardigen;

      b. de haalbaarheidsstudie naar verwachting onvoldoende inzicht zal geven in het commercieel perspectief en de
      uitvoerbaarheid van de voorgenomen activiteiten waarop de haalbaarheidsstudie betrekking heeft;

      c. er op voorhand onvoldoende vertrouwen bestaat in het commercieel perspectief of de uitvoerbaarheid van de
      voorgenomen activiteiten waarop de haalbaarheidsstudie betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.16.11d
