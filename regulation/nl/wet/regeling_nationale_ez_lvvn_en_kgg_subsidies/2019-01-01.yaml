  - number: 2.7.1
    text: |-
      In deze titel wordt verstaan onder:

        - *jacht:* jagen als bedoeld in [artikel 31, eerste lid, van de Flora- en faunawet][ref1];
        - *natuur- en landschapsbeheer:* geheel van activiteiten die zien op het behoud en de ontwikkeling van de natuur of
      het landschap, de instandhouding van de natuur of het landschap bevorderen, daaronder mede begrepen het ontwikkelen
      van nieuwe natuur of herstellen van landschapskenmerken, het opdoen van vaardigheden ten behoeve van het opzetten
      en doen functioneren van een vrijwilligersorganisatie die zich bezig houdt met natuur- en landschapsbeheer en het
      betrekken van mensen met een beperking bij natuur- en landschapsbeheer;
        - *vrijwilliger:* natuurlijk persoon die, anders dan bij wijze van beroep, onverplicht arbeid om niet verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel31
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.7.1
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '31'
  - number: 2.7.2
    text: |-
      1 De Minister kan subsidie verstrekken voor de opleiding van vrijwilligers ter bevordering van natuur- en
      landschapsbeheer.

      2 Geen subsidie wordt verstrekt, indien de activiteiten in het kader van een dergelijke opleiding:

      a. in strijd zijn met overheidsbeleid ten aanzien van natuur of landschap;

      b. verband houden met de jacht.

      3 De subsidie wordt verstrekt aan vrijwilligers.

      4 Iedere vrijwilliger kan ten hoogste één aanvraag doen.

      5 De opleiding wordt afgerond binnen een jaar nadat de subsidie is verstrekt.

      6 De subsidieontvanger stemt er mee in dat de Minister de informatie, bedoeld in [artikel 2.7.3][ref1] openbaar
      maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.7.3
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.7.2
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.7.3
        hoofdstuk: '2'
  - number: 2.7.3
    text: |-
      Bij de aanvraag wordt ten minste de volgende informatie verstrekt:

      a. een beschrijving van de opleiding, waarbij onder meer wordt ingegaan op de aanbieder van de opleiding, het doel
      van de opleiding, de wijze waarop het volgen van de opleiding leidt tot het betrekken van nieuwe mensen bij natuur-
      en landschapsbeheer, de activiteiten die zullen worden verricht in het kader van de opleiding en het beoogde
      resultaat; en

      b. een opgave van de kosten die de opleidingsactiviteiten met zich zullen brengen.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.7.3
  - number: 2.7.4
    text: |-
      Geen subsidie wordt verstrekt in een van de volgende gevallen:

      a. de aanvraag voldoet niet aan het bepaalde in deze titel;

      b. de subsidiabele kosten bedragen minder dan € 1.000,–;

      c. het is aannemelijk dat de door de aanvrager verstrekte gegevens onjuist zijn;

      d. er bestaat onvoldoende vertrouwen in het niveau van de kennis die met de opleiding wordt verkregen.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.7.4
  - number: 2.7.5
    text: |-
      In afwijking van [artikel 10, tweede lid, van het Kaderbesluit EZ-subsidies][ref1] zijn de subsidiabele kosten
      alle rechtstreeks aan de uitvoering van de opleiding toe te rekenen kosten, met uitzondering van kosten voor eigen
      arbeid van de subsidieaanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.7.5
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '10'
  - number: 2.7.6
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.7.6
  - number: 2.7.7
    text: De subsidie bedraagt per aanvraag € 1.000,–.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.7.7
  - number: 2.7.8
    text: Deze regeling bevat geen staatssteun.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.7.8
  - number: 2.7.9
    text: |-
      Deze titel vervalt met ingang van 1 oktober 2020, met dien verstande dat deze van toepassing blijven op subsidies
      die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.7.9
  - number: 2.9.1
    text: |-
      In deze titel wordt verstaan onder:

        - *pluimveehouder:* ondernemer die werkzaam is in de primaire landbouwproductie en die fok- of
      vermeerderingspluimvee voor de consumptie-ei-sector dan wel leghennen houdt, dan wel pluimvee dat daarvoor wordt
      opgefokt;
        - *gevaccineerd pluimvee:* met toegelaten vaccin volledig gevaccineerd fokpluimvee, vermeerderingspluimvee voor de
      consumptie-ei-sector, volledig gevaccineerde leghennen of pluimvee dat daarvoor wordt opgefokt;
        - *toegelaten vaccin:* vaccin dat op grond van de [Wet dieren][ref1] is toegelaten voor gebruik bij fokpluimvee,
      vermeerderingspluimvee voor de consumptie-ei-sector of leghennen ter voorkoming van een besmetting met Salmonella
      enteritidis of Salmonella typhimurium.


      [ref1]: https://wetten.overheid.nl/BWBR0030250
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.9.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
  - number: 2.9.2
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een pluimveehouder voor de aankoop van tegen Salmonella
      enteritidis gevaccineerd pluimvee of tegen Salmonella enteritidis en Salmonella typhimurium gevaccineerd pluimvee.

      2 Het in het eerste lid bedoelde gevaccineerd pluimvee dient te zijn geregistreerd in een op grond van
      [artikel 38hh van de Regeling identificatie en registratie dieren][ref1] aangewezen databank voor identificatie en
      registratie van pluimvee.

      3 Aan de pluimveehouder wordt slechts subsidie verstrekt indien de aankoop van gevaccineerd pluimvee is
      gefactureerd in de periode van 1 januari 2018 tot en met 31 december 2018.

      4 In afwijking van het tweede lid komt voor subsidie in aanmerking gevaccineerd pluimvee dat vóór 1 januari 2018 is
      aangeschaft en op of na 1 januari 2018 is geleverd aan een pluimveehouder.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38hh
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.9.2
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38hh
  - number: 2.9.3
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.9.3
  - number: 2.9.4
    text: |-
      De aanvraag tot subsidievaststelling gaat vergezeld van:

      a. nota’s en betaalbewijzen van de aanschaf van gevaccineerd pluimvee;

      b. een bewijs waarmee wordt aangetoond dat het gevaccineerd pluimvee geregistreerd is in een op grond van
      [artikel 38hh van de Regeling identificatie en registratie dieren][ref1] aangewezen databank voor identificatie en
      registratie van pluimvee;

      c. een bewijs waarmee wordt aangetoond dat vaccinatie overeenkomstig de toelatingsvoorwaarden van het betreffende
      vaccin is uitgevoerd;

      d. indien de vaccinatie van het pluimvee in een andere lidstaat van de Europese Unie dan Nederland is uitgevoerd,
      tevens een schriftelijk bewijs dat in de betreffende lidstaat voor het jaar 2018 geen subsidie voor de aankoop van
      vaccins ten behoeve van het betreffende pluimvee is of wordt aangevraagd dan wel is of wordt toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38hh
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.9.4
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38hh
  - number: 2.9.5
    text: |-
      1 Voor subsidie komen in aanmerking kosten voor de aankoop van tegen Salmonella enteritidis gevaccineerd pluimvee
      of tegen Salmonella enteritidis en Salmonella typhimurium gevaccineerd pluimvee.

      2 Niet verrekenbare BTW komt niet in aanmerking voor subsidie.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.9.5
  - number: 2.9.6
    text: |-
      De subsidie bedraagt:

      a. € 0,09 per stuks tegen Salmonella enteritidis gevaccineerd pluimvee;

      b. € 0,15 per stuks tegen Salmonella enteritidis en Salmonella typhimurium gevaccineerd pluimvee.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.9.6
  - number: 2.9.7
    text: |-
      De subsidie, bedoeld in [artikel 2.9.2][ref1], bevat staatssteun en wordt gerechtvaardigd door Steunmaatregel
      SA.39008 (2014/N).


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.9.2
