        bwb_id: BWBR0035474
        artikel: 2.5.2
        hoofdstuk: '2'
  - number: 2.5.10
    text: |-
      Deze titel en [bijlage 2.5.1][ref1] vervallen met ingang van 31 december 2019, met dien verstande dat deze van
      toepassing blijven op subsidies die voor die datum zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.5.10
