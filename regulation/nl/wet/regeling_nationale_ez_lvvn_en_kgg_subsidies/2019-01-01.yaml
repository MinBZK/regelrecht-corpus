    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.16.11e
  - number: 3.16.11f
    text: |-
      1 De minister rangschikt de aanvragen waarop niet met toepassing van [artikel 3.16.11d][ref1] afwijzend is beslist,
      zodanig dat een aanvraag voor een haalbaarheidsstudie hoger gerangschikt wordt naarmate op voorhand:

      a. het commercieel perspectief van het voorgenomen vroegefasetraject groter wordt geacht;

      b. de kennisbasis en innovativiteit van het voorgenomen vroegefasetraject groter wordt geacht;

      c. de kwaliteit van de TO2-innovatieve starter en het team dat betrokken is bij het voorgenomen vroegefasetraject
      hoger wordt geacht;

      d. de kwaliteit van het voorgenomen vroegefasetraject hoger wordt geacht.

      2 Voor de rangschikking tellen de criteria, genoemd in het eerste lid, ieder voor 25 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.16.11d
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.16.11f
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.16.11d
        hoofdstuk: '3'
        paragraaf: 3.16.3a
  - number: 3.16.12
    text: |-
      1 De minister verstrekt op aanvraag een subsidie in de vorm van een geldlening aan een academische innovatieve
      starter, hbo-innovatieve starter of TO2-innovatieve starter ten behoeve van de financiering van een
      vroegefasetraject.

      2 Bij zijn aanvraag legt de academische innovatieve starter, hbo-innovatieve starter of TO2-innovatieve starter:

      a. een rapport van een haalbaarheidsstudie over;

      b. een overeenkomst over als bedoeld in de definitie van academische innovatieve starter, hbo-innovatieve starter
      of TO2-innovatieve starter in [artikel 3.16.1][ref1].

      3 De termijn, bedoeld in [artikel 23, onderdeel b, van het Kaderbesluit nationale EZ-subsidies][ref2] bedraagt
      24 maanden.

      4 Geen subsidie wordt verstrekt:

      a. indien voor het vroegefasetraject reeds door de minister subsidie is verstrekt;

      b. indien met de uitvoering van het vroegefasetraject is begonnen voor de datum van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.16.1
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.16.12
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.16.1
        hoofdstuk: '3'
        paragraaf: 3.16.1
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.16.13
    text: |-
      1 De subsidie bestaat uit een geldlening voor een bedrag gelijk aan het totaal van de door de academische
      innovatieve starter, hbo-innovatieve starter of TO2-innovatieve starter voorziene kosten voor het vroegefasetraject
      doch ten hoogste € 250.000.

      2 De kosten gemaakt door de academische innovatieve starter, hbo-innovatieve starter of TO2-innovatieve starter
      als natuurlijke persoon worden berekend door het aantal uren dat hij ten behoeve van het vroegefasetraject heeft
      gemaakt te vermenigvuldigen met een vast uurtarief.

      3 Het vaste uurtarief bedoeld in het tweede lid is € 35 per uur.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.16.13
  - number: 3.16.14
    text: |-
      De minister beslist afwijzend op een aanvraag:

      a. indien aannemelijk is dat de academische innovatieve starter, hbo-innovatieve starter of TO2-innovatieve starter
      de financiering waarvoor de aanvraag is ingediend zelf heeft of kan verkrijgen bij anderen;

      b. voor zover de voorziene kosten van het vroegefasetraject hoger zijn dan € 250.000 of lager dan zijn € 50.000;

      c. indien onvoldoende vertrouwen bestaat dat de academische innovatieve starter, hbo-innovatieve starter of TO2-
      innovatieve starter het vroegefasetraject in uitvoeringstechnische zin zo zal kunnen voltooien dat hij financiering
      voor de fase na het vroegefasetraject zal kunnen verkrijgen;

      d. indien onvoldoende vertrouwen bestaat dat de academische innovatieve starter, hbo-innovatieve starter of TO2-
      innovatieve starter de geldlening, bedoeld in [artikel 3.16.12, eerste lid][ref1], kan terugbetalen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.16.12
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.16.14
    references:
