  - number: 3.2.10a
    text: |-
      1 Voor de toepassing van [artikel 3.2.10, eerste lid, aanhef en onderdeel b][ref1], worden ter bepaling van
      de hoogte van de PPS-projecttoeslag ook private bijdragen aan onderzoeksinstellingen voor onderzoek dat past
      binnen het TKI-programma als bedoeld in [artikel 3.2.2][ref2], afkomstig van instellingen als bedoeld in
      [artikel 5b, eerste lid, van de Algemene wet inzake rijksbelastingen][ref3], in aanmerking genomen tot ten hoogste
      een plafond van € 8.000.000 per openstellingsperiode voor alle aanvragers van PPS-projecttoeslag tezamen.

      2 Indien het totaal van de private bijdragen, bedoeld in het eerste lid, die in de openstellingsperiode zijn
      opgevoerd in aanvragen voor PPS-projecttoeslag uitstijgt boven het plafond, bedoeld in het eerste lid, worden de
      private bijdragen in aanmerking genomen op volgorde van binnenkomst van de aanvragen voor PPS-projecttoeslag waarin
      deze private bijdragen zijn opgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.10
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel5b
