  - number: 4a.2.5
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4a.2.5
  - number: 4a.2.6
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is drie jaar, en wordt gerekend vanaf de
      aanvang van de activiteiten, bedoeld in [artikel 4a.2.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel4a.2.2
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4a.2.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 4a.2.2
        hoofdstuk: 4a
  - number: 4a.2.7
    text: |-
      De minister beslist afwijzend op een aanvraag, indien:

      a. door de subsidieaanvrager niet aannemelijk wordt gemaakt dat uitvoering van het cyberweerbaarheidsplan leidt tot
      een duurzaam netwerk voor de versterking van de cyberweerbaarheid van niet-vitale ondernemingen;

      b. onvoldoende vertrouwen bestaat dat uitvoering van het cyberweerbaarheidsplan een bijdrage levert aan de
      versterking van de cyberweerbaarheid van niet-vitale ondernemingen;

      c. het netwerk voor de versterking van de cyberweerbaarheid van niet-vitale ondernemingen niet openstaat voor
      nieuwe toetreders;

      d. in het cyberweerbaarheidsplan activiteiten zijn opgenomen die bestaan uit:

      1°. het ontwikkelen van hardware of software om de cyberweerbaarheid van ondernemingen te versterken,
      of het aanschaffen daarvan anders dan voor het verwerken of delen van informatie voor de versterking van
      cyberweerbaarheid;

      2°. het continu op afstand monitoren van de cybersecurity van ondernemingen om aanvallen op de IT-infrastructuur te
      voorkomen, af te weren, op te sporen of op te lossen; of

      3°. het adviseren van ondernemingen die door een cybersecurityincident zijn getroffen, over het oplossen van het
      incident;

      e. meer dan 25 procent van de kosten voor de uitvoering van het cyberweerbaarheidsplan bestaat uit het aanschaffen
      van hardware en software voor het verwerken of delen van informatie voor de versterking van cyberweerbaarheid.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4a.2.7
  - number: 4a.2.8
    text: |-
      1 Er is een Adviescommissie cyberweerbaarheid die tot taak heeft de minister op diens verzoek te adviseren omtrent
      de rangschikkingscriteria, bedoeld in [artikel 4a.2.9, eerste lid][ref1].

      2 De commissie bestaat uit ten minste vier en ten hoogste zeven leden.

      3 De voorzitter en de andere leden van de commissie worden door de minister voor een termijn van ten hoogste één
      jaar benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4a.2.9
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4a.2.8
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 4a.2.9
        hoofdstuk: 4a
  - number: 4a.2.9
    text: |-
      1 De minister kent aan een cyberweerbaarheidsplan een hoger aantal punten toe, naarmate:

      a. het cyberweerbaarheidsplan een grotere bijdrage levert aan het versterken van de cyberweerbaarheid van niet-
      vitale ondernemingen, waardoor maatschappelijke en economische schade kan worden beperkt;

      b. het netwerk waarbinnen het cyberweerbaarheidsplan wordt uitgevoerd:

      1˚. in hogere mate aantoonbaar tot doel heeft en door de samenstelling van het netwerk geschikt is om de
      cyberweerbaarheid van niet-vitale ondernemingen duurzaam te versterken;

      2˚. een groter netwerk kan vormen waarbinnen ervaring en kennis over cyberweerbaarheid aanwezig is en wordt
      uitgewisseld;

      c. het cyberweerbaarheidsplan innovatiever is.

      2 Het aantal punten bedraagt bij de onderdelen a en b van het eerste lid ten minste één en ten hoogste veertig
      punten, en bij onderdeel c van het eerste lid ten minste één en ten hoogste twintig punten.

      3 De minister rangschikt de aanvragen, waarop niet afwijzend is beslist, hoger, naarmate in totaal meer punten aan
      het cyberweerbaarheidsplan zijn toegekend.

      4 Geen subsidie wordt verleend voor een cyberweerbaarheidsplan dat lager is gerangschikt dan een soortgelijk
      cyberweerbaarheidsplan.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4a.2.9
  - number: 4a.2.10
    text: |-
      1 De subsidieontvanger verleent medewerking aan een evaluatie van de effecten van de door hem uitgevoerde
      activiteiten, bedoeld in [artikel 4a.2.2][ref1], voor zover deze medewerking redelijkerwijs van hem verlangd kan
      worden.

      2 De subsidieontvanger verleent medewerking aan de verdere verspreiding van ervaringen en resultaten van het
      cyberweerbaarheidsplan door de minister of door een door de minister aangewezen derde.

      3 De verplichtingen, bedoeld in het eerste en tweede lid, gelden tot drie jaar na de datum van de beschikking tot
      subsidievaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4a.2.2
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4a.2.10
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 4a.2.2
        hoofdstuk: 4a
  - number: 4a.2.11
    text: |-
      1 Indien de aanvrager een mkb-ondernemer betreft bevat een aanvraag voor subsidie op grond van
      [artikel 4a.2.2.][ref1] ten minste de gegevens, bedoeld in artikel 6, tweede lid, van de algemene
      groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie op grond van [artikel 4a.2.2][ref2] ten minste:

      a. een verklaring de-minimissteun;

      b. gegevens over de aanvrager, waaronder de naam van de organisatie, het KvK-nummer, het post- en bezoekadres en
      het rekeningnummer;

      c. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      d. een begroting waarin de totale kosten van de uitvoering van het cyberweerbaarheidsplan en de omvang van de
      gevraagde subsidie zijn opgenomen;

      e. een cyberweerbaarheidsplan;

      f. een planning van de uitvoering van de activiteiten in het cyberweerbaarheidsplan;

      g. een samenvatting van het cyberweerbaarheidsplan die door de minister kan worden gebruikt in voor een ieder
      toegankelijke publicaties.

      3 De aanvraag voor de vaststelling van de subsidie bevat ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de aanvrager en het door de minister verstrekte
      referentienummer;

      b. de omvang van de vast te stellen subsidie en de kerngegevens voor de onderbouwing van de subsidievaststelling;

      c. een samenvatting van de resultaten van het cyberweerbaarheidsplan die door de minister kan worden gebruikt in
      voor ieder toegankelijke publicaties.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4a.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel4a.2.2
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4a.2.11
    references:
