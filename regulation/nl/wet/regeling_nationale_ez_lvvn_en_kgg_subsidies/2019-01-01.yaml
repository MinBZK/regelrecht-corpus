  - number: 4.5.13
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.5.13
  - number: 4.5.14
    text: |-
      1 De subsidie wordt verleend onder de opschortende voorwaarde dat:

      a. een overeenkomst wordt gesloten in verband met de aanschaf van de installatie of installaties voor de productie
      van duurzame energie, en

      b. de installatie of installaties waarop de overeenkomst, bedoeld in onderdeel a betrekking heeft, zijn
      geïnstalleerd.

      2 Het eerste lid is niet van toepassing op de subsidie die wordt verleend aan een natuurlijke persoon ten behoeve
      van de installatie bestemd voor de eigen woning.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.5.14
  - number: 4.5.15
    text: |-
      1 In het geval de subsidieontvanger een natuurlijke persoon betreft en de subsidie is bestemd voor de installatie
      voor de eigen woning wordt de subsidie vastgesteld zonder voorafgaande beschikking tot subsidieverlening.

      2 Een subsidie op grond van deze titel wordt niet ambtshalve vastgesteld.

      3 De aanvraag, bedoeld in [artikel 50, eerste lid, van het besluit][ref1], gaat vergezeld van het bewijs van
      aanschaf van elk van de installaties voor de productie van duurzame energie.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel50
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.5.15
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '50'
  - number: 4.5.16
    text: |-
      1 Een installatie voor de productie van duurzame energie, waarvoor op grond van deze titel een subsidie is
      verleend, wordt binnen 12 maanden na de verlening van de subsidie in gebruik genomen.

      2 De subsidieontvanger vervreemdt de installatie voor de productie van duurzame energie waarvoor subsidie is
      verleend niet binnen een jaar na de datum van de subsidievaststelling.

      3 Het tweede lid is niet van toepassing op de vervreemding van de woning of het bedrijf waarin de installatie voor
      de productie van duurzame energie is geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.5.16
  - number: 4.5.17
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 4.5.2][ref1] bevat de gegevens van de aanvrager, waaronder
      ten minste:

      a. de naam, het post- en bezoekadres, het e-mailadres en het telefoonnummer;

      b. het Burgerservicenummer of het nummer waaronder de onderneming is geregistreerd bij de Kamer van Koophandel, en

      c. het rekeningnummer.

      2 Onverminderd het eerste lid bevat de aanvraag door een natuurlijke persoon ten behoeve van de installatie bestemd
      voor de eigen woning tevens:

      a. een vermelding van de locatie waar de installatie voor de productie van duurzame energie is geïnstalleerd indien
      deze afwijkt van het post- en bezoekadres;

      b. het bewijs van aanschaf van de installatie voor de productie van duurzame energie, en

      c. een omschrijving van de installatie voor de productie van duurzame energie, voorzien van het merk en type, of
      indien beschikbaar, de meldcode.

      3 Onverminderd het eerste lid bevat de aanvraag door een andere aanvrager dan een natuurlijke persoon als bedoeld
      in het tweede lid, de gegevens, bedoeld in artikel 6, tweede lid, van de groepsvrijstellingsverordening, alsmede:

      a. een omschrijving van de aard van de installaties voor de productie van duurzame energie, voorzien van het merk
      en type, of – indien beschikbaar – de meldcode;

      b. een vermelding van de beoogde locatie van elk van de installaties voor de productie van duurzame energie;

      c. het aantal installaties voor de productie van duurzame energie, en

      d. het nominale thermische vermogen van elke te installeren installatie voor de productie van duurzame energie of,
      indien het een zonneboiler betreft, de gegevens ten aanzien van de energetische opbrengst.

      4 De aanvraag voor de vaststelling van een subsidie krachtens deze titel bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de aanvrager en het door de minister verstrekte
      referentienummer;

      b. de omvang van de vast te stellen subsidie;

      c. de kerngegevens voor de onderbouwing van de subsidievaststelling, waaronder de locaties waar het project is
      uitgevoerd en de omschrijving van de aard van de installaties voor de productie van duurzame energie die zijn
      geïnstalleerd.

      5 De subsidieaanvrager verstrekt gegevens waaruit blijkt dat de installatie voor de productie van duurzame energie
      voldoet aan de technische eisen, afhankelijk van de installatie, bedoeld in [artikel 4.5.4][ref2], [4.5.5][ref3],
      [4.5.6][ref4] of [4.5.7][ref5].

      6 De subsidieaanvrager overlegt een bewijs dat de installatie voor de productie van duurzame energie is
      geïnstalleerd door een deskundige installateur.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.4
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.5
      [ref4]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.6
      [ref5]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.7
