    text: |-
      1 Er wordt garant gestaan voor 50 procent van de waarde van een bankgarantie.

      2 Indien de financier bij het afgeven van een bankgarantie een gedeelte daarvan niet onder de garantstelling
      van de Staat brengt, zijn de bepalingen van deze titel slechts van toepassing op het gedeelte van de afgegeven
