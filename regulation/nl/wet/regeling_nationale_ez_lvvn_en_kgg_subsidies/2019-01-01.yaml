    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. na toepassing van [artikel 4.2.70, eerste lid][ref1], minder dan drie punten per criterium, zijn toegekend;

      b. eerder op grond van deze regeling of de Subsidieregeling energie en innovatie een subsidie is verstrekt voor een
      soortgelijk project;

      c. het project lager is gerangschikt dan een soortgelijk project;

      d. bij een DEI-project dat bestaat uit een combinatie van een energiedemonstratieproject en een project bestaande
      uit experimentele ontwikkeling als bedoeld in [artikel 4.2.64, onderdeel c][ref2], niet ten minste 70% van de
      subsidiabele kosten is toe te rekenen aan het energiedemonstratieproject.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.70
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.64
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.69
