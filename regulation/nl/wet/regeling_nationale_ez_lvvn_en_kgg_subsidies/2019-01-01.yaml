  - number: 3.10.12g
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien:

      a. onvoldoende aannemelijk is dat de financier gedurende de fondsperiode daadwerkelijk beschikt over de middelen
      die de financier aan het investeringsbudget bijdraagt;

      b. onvoldoende vertrouwen bestaat dat de betrokkenen de capaciteiten hebben voor het verkrijgen van participaties
      en voor het beheer hiervan op een wijze zoals bij participatiefondsen gebruikelijk is;

      c. een fondsplan niet is gebaseerd op de uitgangspunten dat:

      1.° een financier participaties verkrijgt gedurende een investeringsperiode van ten hoogste zes jaar, en deze
      uiterlijk zes jaar na afloop van de investeringsperiode vervreemdt;

      2.° de totale verkrijgingsprijs van de participaties die gedurende de fondsperiode in één
      technostartersvennootschap wordt geïnvesteerd, ten minste € 50.000 en ten hoogste € 500.000 bedraagt;

      3.° de gemiddelde totale verkrijgingsprijs van de participaties die een financier gedurende de fondsperiode per
      technostartersvennootschap investeert, over alle technostartersvennootschappen genomen ten hoogste € 350.000
      bedraagt;

      4.° de relatieve omvang van achtergestelde vorderingen zodanig wordt beperkt dat aan het eind van de fondsperiode
      ten hoogste 25 procent van het totaal van de verkrijgingsprijzen van alle participaties betrekking heeft op
      achtergestelde vorderingen;

      5.° voor achtergestelde vorderingen een rente wordt bedongen die ten minste gelijk is aan de referentierente;

      6.° de participaties verkregen worden in technostartersvennootschappen waarvan de rentabiliteits- en
      continuïteitsperspectieven ten minste redelijk zijn;

      7.° de participaties verkregen worden in meerdere, van elkaar onafhankelijke technostartersvennootschappen;

      8.° bij de beslissing van de financier inzake de verkrijging van participaties rekening wordt gehouden met het
      ondernemingsplan van de desbetreffende technostartersvennootschap;

      9.° de participaties verkregen worden in technostartersvennootschappen waaraan niet eerder door een andere
      participatiemaatschappij risicokapitaal in de vorm van aandelen of een aan eigen vermogen gelijk te stellen lening
      is verstrekt, behoudens indien deze participatiemaatschappij een informal investor is;

      d. het fondsplan onvoldoende is onderbouwd;

      e. het fondsplan onvoldoende bijdraagt aan de opbouw van succesvolle ondernemingen door
      technostartersvennootschappen;

      f. het fondsplan onvoldoende doelmatig is ingericht;

      g. onvoldoende vertrouwen bestaat dat het fondsplan naar behoren wordt uitgevoerd;

      h. de aanvrager onvoldoende relevante ervaring of deskundigheid heeft;

      i. de gedragslijn, bedoeld in [artikel 3.10.12k, tweede lid][ref1], onvoldoende vertrouwen geeft dat hiermee
      belangenverstrengeling voorkomen kan worden;

      j. de belangen van de Staat kunnen worden geschaad.

      2 [Artikel 23, onderdeel b, van het besluit][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.10.12k
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
