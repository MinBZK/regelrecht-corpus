  - number: 2.3.9
    text: |-
      Deze titel vervalt met ingang van 1 juli 2022, met dien verstande dat deze van toepassing blijft op subsidies die
      voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.3.9
  - number: 2.5.1
    text: |-
      In deze titel wordt verstaan onder:

        - *landbouwinnovatie:* product, productieproces of concept bestemd voor toepassing in de primaire landbouw dat een
      vernieuwing en een verduurzaming inhoudt met als oogmerk het onderscheidend positioneren van een landbouwproduct in
      de markt;
        - *MKB-landbouwondernemer:* MKB-ondernemer die een landbouwonderneming in stand houdt;
        - *overnemer:* natuurlijke persoon of rechtspersoon die voor het eerst voor eigen rekening en risico als MKB-
      ondernemer een landbouwonderneming in stand gaat houden door van een bestaande landbouwonderneming: a. zijnde een
      eenmanszaak, een maatschap of vennootschap onder firma de meerderheidswaarde van de activa in eigendom, pacht of
      erfpacht te verwerven; b. zijnde een vennootschap met een in aandelen verdeeld kapitaal: 1°. de meerderheid van het
      geplaatste kapitaal van die vennootschap direct of indirect te verwerven, en 2°. de overwegende zeggenschap van die
      vennootschap te verkrijgen zonder op een eerder moment daarvan de enige of overwegende zeggenschap gehad te hebben;
        - *starter:* MKB-landbouwondernemer zijnde: a. een natuurlijke persoon die niet langer dan drie jaar een
      landbouwonderneming in stand houdt; b. een vennootschap met een in aandelen verdeeld kapitaal, waarvan de
      bestuurder een natuurlijke persoon is die ten tijde van het sluiten van de kredietovereenkomst direct of indirect
      de meerderheid van het geplaatst en gestort kapitaal houdt en deze meerderheid niet langer dan drie jaar houdt.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.5.1
  - number: 2.5.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een bank voor het sluiten van kredietovereenkomsten met MKB-
      landbouwondernemers die betrekking hebben op landbouwborgstellingskredieten.

      2 De subsidie wordt verstrekt in de vorm van een borgstelling voor de terugbetaling van een krediet dat de
      bank op grond van een kredietovereenkomst aan een MKB-landbouwondernemer zal verstrekken voor de duur van de
      kredietovereenkomst.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.5.2
  - number: 2.5.3
    text: |-
      1 Voor subsidie komt niet in aanmerking een bank die een landbouwkredietovereenkomst sluit met een MKB-
      landbouwondernemer:

      a. die over voldoende financiële middelen beschikt om zijn landbouwonderneming op economisch verantwoorde wijze
      te drijven;

      b. die een substantieel deel van de activiteiten van de landbouwonderneming niet in Nederland uitvoert;

      c. die een aanbieder is als bedoeld in [artikel 1, onderdeel c, van de Wet marktordening gezondheidszorg][ref1] of
      het beroep van dierenarts, notaris, advocaat of gerechtsdeurwaarder uitoefent, of

      d. die een landbouwonderneming in stand houdt waarvan de laatste jaaromzet voor 50 procent of meer is verkregen,
      of, indien de landbouwonderneming nog geen heel jaar in stand is gehouden, waarvan de omzet naar verwachting voor
      50 procent of meer zal worden verkregen, uit:

      1°. de uitoefening van het bank-, verzekerings- of beleggingsbedrijf, of het financieren van een of meer andere
      ondernemingen, of

      2°. het verwerven, vervreemden, beheren of exploiteren van onroerende zaken of het ontwikkelen van onroerende
      zaakprojecten.

      2 Geen subsidie wordt verstrekt voor activiteiten die direct verband houden met:

      a. de uitvoer naar andere lidstaten van de Europese Unie of derde landen;

      b. andere lopende uitgaven direct verband houdend met activiteiten op het gebied van uitvoer;

      c. het oprichten en exploiteren van een distributienet ten behoeve van uitvoer, of

      d. investeringen die niet in overeenstemming zijn met de wetgeving van de Europese Unie en met de nationale
      milieubeschermingswetgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel1
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.5.3
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '1'
  - number: 2.5.4
    text: |-
      1 Het tarief van de provisie, bedoeld in [artikel 32, derde lid, van het besluit][ref1] bedraagt eenmalig 3
      procent.

      2 In afwijking van het eerste lid bedraagt de provisie eenmalig 1 procent indien de overeenkomst van borgtocht een
      landbouwborgstellingskrediet betreft voor een starter of overnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel32
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.5.4
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '32'
  - number: 2.5.5
    text: |-
      1 De minister verdeelt het subsidieplafond door vaststelling van een maximum subsidiebedrag per bank die zich bij
      de minister heeft aangemeld.

      2 De minister stelt uiterlijk op 1 februari van elk kalenderjaar ambtshalve het maximum subsidiebedrag per bank
      vast waarbij hij onderscheid maakt tussen landbouwborgstellingskredieten die al dan niet betrekking hebben op
      landbouwinnovatie.

      3 De minister verdeelt het subsidieplafond voor de banken, bedoeld in het eerste lid, op volgorde van binnenkomst
      van de verleningen, bedoeld in artikel 8, tweede lid, van het model landbouwborgstellingskredietovereenkomst, zoals
      opgenomen in [bijlage 2.5.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.5.5
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 2.5.6
    text: |-
      1 Er wordt borg gestaan voor 70 procent van het kredietbedrag.

      2 Onverminderd het eerste lid, bedraagt het krediet waarvoor wordt borg gestaan:

      a. ten hoogste € 1.200.000 of

      b. ten hoogste € 2.500.000 indien het krediet strekt tot financiering van nieuwe investeringen die voor meer dan
      50% worden gedaan:

      1°. voor de bouw of verbetering van een stal voor zover uit het investeringsplan behorend bij de
      kredietovereenkomst blijkt dat de stal voldoet aan de eisen van het certificatieschema Maatlat Duurzame Veehouderij
      met een hoger niveau dan Plusstal hetgeen blijkt uit een voorlopig certificaat dat is afgegeven door een hiervoor
      door de Raad voor Accreditatie geaccrediteerde organisatie;

      2°. voor een kas die bestemd is voor het bedrijfsmatig telen van gewassen voor zover uit het investeringsplan
      behorend bij de kredietovereenkomst blijkt dat die kas voldoet aan de eisen van het certificatieschema Groen Label
      Kas, hetgeen aantoonbaar wordt gemaakt met een voorlopig certificaat dat is afgegeven door een hiervoor door de
      Raad voor Accreditatie geaccrediteerde organisatie;

      3°. voor landbouwinnovatie.

      3 Bij toepassing van het tweede lid, onderdeel b, onder 1°, wordt in de kredietovereenkomst opgenomen dat de MKB-
      landbouwondernemer na het verstrekken van het landbouwborgstellingskrediet een definitief certificaat verkrijgt
      volgens de dan vigerende Maatlat Duurzame Veehouderij.

      4 Bij toepassing van het tweede lid, onderdeel b, onder 2°, wordt in de kredietovereenkomst opgenomen dat de MKB-
      landbouwondernemer na het verstrekken van het landbouwborgstellingskrediet een definitief certificaat verkrijgt
      volgens het dan vigerende certificeringsschema Groen Label Kas.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.5.6
  - number: 2.5.7
    text: |-
      Het model voor de landbouwborgstellingsovereenkomst is opgenomen in [bijlage 2.5.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.5.7
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 2.5.8
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 2.5.2][ref1] bevat ten minste de gegevens, bedoeld in artikel
      6, tweede lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie als bedoeld in [artikel 2.5.2][ref2] ten minste:

      a. gegevens over de bank, waaronder de statutaire naam, het KvK-nummer, het post- en bezoekadres en het
      rekeningnummer;

      b. gegevens over de contactpersoon bij de bank, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. kerngegevens over de bank, waaronder de deskundigheid, het financieringsbeleid, het financieringsproces, het
      beheer en het uitwinningsbeleid van krediet.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.5.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.5.2
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.5.8
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.5.2
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 2.5.2
        hoofdstuk: '2'
  - number: 2.5.9
    text: |-
      De subsidie, bedoeld in [artikel 2.5.2][ref1], bevat staatssteun en wordt gerechtvaardigd door artikel 21 van de
      algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.5.2
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.5.9
    references:
