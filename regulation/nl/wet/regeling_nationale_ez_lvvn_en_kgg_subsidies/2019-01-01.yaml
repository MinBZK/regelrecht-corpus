  - number: 3.11.1
    text: |-
      1 Voor de toepassing van deze titel wordt als financier aangewezen een bank en een door de minister aangewezen
      kredietverstrekker.

      2 Voor de toepassing van [artikel 3.11.2, derde lid][ref1], wordt als financier aangewezen een kredietinstelling
      in de zin van de [Wet financiële markten BES][ref2] die op grond van die wet bevoegd is in Bonaire, Sint Eustatius
      of Saba het bedrijf van kredietinstelling uit te oefenen en een door de minister aangewezen, op Bonaire, Sint
      Eustatius of Saba gevestigde, kredietverstrekker.

      3 In deze titel wordt verstaan onder:

        - *afzet van landbouwproducten:* afzet van landbouwproducten als bedoeld in artikel 2, eerste lid, onderdeel c, van
      de algemene de-minimisverordening;
        - *innovatieve MKB-ondernemer:* MKB-ondernemer ten aanzien van wie de financier beschikt over:
      a. een gewaarmerkte kopie van een verklaring als bedoeld in [artikel 23, eerste lid][ref3], of
      [artikel 27, eerste lid, van de Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref4]
      , waarvan het origineel ten hoogste zestien maanden voor de datum waarop de kredietovereenkomst is gesloten
      is afgegeven, of b. een advies van de minister waaruit blijkt dat de MKB-ondernemer is aan te merken als een
      innovatieve MKB-ondernemer;
        - *verwerking van landbouwproducten:* verwerking van landbouwproducten als bedoeld in artikel 2, eerste lid,
      onderdeel b, van de algemene de-minimisverordening.


