  - number: 3.16.2
    text: |-
      1 De minister verstrekt op aanvraag een subsidie in de vorm van een geldlening aan een MKB-ondernemer, niet zijnde
      een MKB-ondernemer die werkzaam is in de visserij- en aquacultuursector, ten behoeve van de financiering van een
      vernieuwingsfasetraject.

      2 Bij zijn aanvraag legt de MKB-ondernemer een verklaring van een toekomstige investeerder over die is opgesteld
      overeenkomstig het model dat in [bijlage 3.16.1][ref1] is opgenomen.

      3 De termijn, bedoeld in [artikel 23, onderdeel b, van het Kaderbesluit nationale EZ-subsidies][ref2] bedraagt
      24 maanden.

      4 Geen subsidie wordt verstrekt:

      a. indien voor het vernieuwingsfasetraject reeds door de minister subsidie is verstrekt;

      b. indien met de uitvoering van het vernieuwingsfasetraject is begonnen voor de datum van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.16.2
