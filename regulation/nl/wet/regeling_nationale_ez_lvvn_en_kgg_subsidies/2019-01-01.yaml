  - number: 2.3.2
    text: |-
      1 De minister verstrekt aan een glastuinbouwonderneming of aan een glastuinbouwonderneming in een
      samenwerkingsverband van glastuinbouwondernemingen op aanvraag subsidie voor de hierna opgesomde apparatuur,
      installaties of machines:

      a. een tweede energiescherm;

      b. de fysieke aansluiting op een warmtenetwerk of -cluster;

      c. de fysieke aansluiting op een biogas- of kooldioxide-netwerk of -cluster;

      d. luchtbehandelingssysteem waarmee energiezuinig kaslucht wordt ontvochtigd.

      2 Geen subsidie wordt verstrekt voor:

      a. gevelschermen, teeltkundig vereiste verduisteringsschermen, wettelijk verplichte lichtafschermingsschermen,
      schermen waarvan het gebruik een energiebesparing van minder dan 45% tot gevolg heeft, schaduw- en
      zonweringsschermen of lichtdoorlatende energieschermen met een lichtafscherming van meer dan 25%;

      b. apparatuur, installaties of machines die al gebruikt zijn;

      c. vervangingsinvesteringen;

      d. investeringen in installaties die vooral tot doel hebben elektriciteit op te wekken uit biomassa;

      e. investeringen met het oog op de productie, op het landbouwbedrijf, van biobrandstoffen in de zin van Richtlijn
      2009/28/EG van het Europees Parlement en de Raad van 23 april 2009 ter bevordering van het gebruik van energie uit
      hernieuwbare bronnen en houdende wijziging en intrekking van Richtlijn 2001/77/EG en Richtlijn 2003/30/EG (PbEU
      2009, L 140);

      f. investeringen in installaties voor de productie van hernieuwbare energie;

      g. investeringen die niet in overeenstemming zijn met de wetgeving van de Europese Unie en met de nationale
      milieubeschermingswetgeving;

      h. investeringen met betrekking tot irrigatie op nieuwe en bestaande geïrrigeerde arealen.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel2.3.2
  - number: 2.3.3
    text: |-
      1 De minister verstrekt subsidie voor een investering als bedoeld in [artikel 2.3.2][ref1], indien de investering
      ten minste gericht is op één van de doelstellingen, genoemd in punt 143, onder a en b, van het landbouwsteunkader.

      2 De glastuinbouwonderneming of de glastuinbouwonderneming in een samenwerkingsverband komt uitsluitend voor
      subsidie in aanmerking, indien:

      a. de glastuinbouwonderneming of de glastuinbouwonderneming die deelneemt aan een samenwerkingsverband
      voor de aanschaf, de bouw of levering van de apparatuur, installaties of machines, bedoeld in
      [artikel 2.3.2, eerste lid][ref2], een overeenkomst heeft gesloten met de bouwer of leverancier, waarin is
      aangegeven welke apparatuur, installatie of machine zal worden aangeschaft, gebouwd of geleverd, en, indien de
      overeenkomst betrekking heeft op een installatie, wat de maximale en werkelijke capaciteit van de installatie is;

      b. de aanschaf, bouw of levering van de apparatuur, installaties of machines, bedoeld in
      [artikel 2.3.2, eerste lid][ref3], tegen marktconforme voorwaarden zal plaatsvinden, blijkend uit een duidelijke
      kostenspecificatie in de overeenkomst waaruit volgt wat de kostenposten zijn voor iedere afzonderlijke investering
      voor de aanschaf, bouw of levering van de apparatuur, installaties of machines;

      c. in de overeenkomst een ontbindende voorwaarde is opgenomen waaruit volgt dat de overeenkomst wordt ontbonden
      voor zover geen subsidie wordt verleend aan de glastuinbouwonderneming of de glastuinbouwonderneming die deelneemt
      aan een samenwerkingsverband voor de desbetreffende investering;

      d. de glastuinbouwonderneming of de glastuinbouwonderneming die deelneemt aan een samenwerkingsverband
      overeenkomstig [artikel 5 van de Handelsregisterwet 2007][ref4] in het handelsregister is ingeschreven;

      e. de glastuinbouwonderneming of de glastuinbouwonderneming die deelneemt aan een samenwerkingsverband voldaan
      heeft aan [artikel 24, tweede lid, van de Landbouwwet][ref5], indien aan hem op grond van artikel 24, eerste lid,
      van die wet door de minister beschrijvingsbiljetten zijn uitgereikt of gezonden, voor:

      1°. het jaar waarin de subsidie wordt aangevraagd, of

      2°. het jaar voorafgaand daaraan indien de gegevens van het jaar waarin de subsidie wordt aangevraagd nog niet
      beschikbaar zijn;

      f. de glastuinbouwonderneming of de glastuinbouwonderneming die deelneemt aan een samenwerkingsverband een
      emissieaangifte als bedoeld in [artikel 3, eerste of tweede lid, van de Regeling kostenverevening reductie CO][ref6]
      heeft ingediend voor:

      1°. het jaar waarin de subsidie wordt aangevraagd, of

      2°. het jaar voorafgaand daaraan, indien de gegevens voor de aangifte van het jaar waarin de subsidie is
      aangevraagd nog niet beschikbaar zijn.

      3 De glastuinbouwonderneming of de glastuinbouwonderneming die deelneemt aan een samenwerkingsverband houdt
      voor apparatuur, installaties of machines als bedoeld in [artikel 2.3.2, eerste lid, onderdeel a, b of c][ref7],
      waarvoor de subsidie wordt verstrekt een ordelijke administratie bij waaruit, indien verzocht, de volgende
      documenten kunnen worden overgelegd:

      a. een kopie van de laatste jaarafrekening respectievelijk jaarafrekeningen waarop het energieverbruik van de
      glastuinbouwonderneming of de glastuinbouwonderneming die deelneemt aan een samenwerkingsverband staat voor de
      installatie, bedoeld in [artikel 2.3.2, eerste lid, onderdeel a][ref8], en

      b. een kaart met daarop ingetekend de totale oppervlakte van de betrokken opstand en met daarop gearceerd
      ingetekend de oppervlakte waarop de investering betrekking heeft inclusief opgave van de lengte van
      de voorziening in meters en de afstand tussen de glastuinbouwonderneming of de glastuinbouwonderneming
      die deelneemt aan een samenwerkingsverband en het netwerk in meters voor investeringen als bedoeld in
      [artikel 2.3.2, eerste lid, onderdeel b of c][ref9].

      4 De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref10], is twee jaar en zes maanden.

      5 Binnen de termijn, genoemd in het vijfde lid,:

      a. voldoet de glastuinbouwonderneming of de glastuinbouwonderneming die deelneemt aan een samenwerkingsverband aan
      wie op grond van [artikel 24, eerste lid, van de Landbouwwet][ref11] door de minister beschrijvingsbiljetten worden
      uitgereikt of gezonden, telkens aan artikel 24, tweede lid, van die wet voor in ieder geval het jaar waarin de
      gegevens zijn opgevraagd, en

      b. dient de glastuinbouwonderneming of de glastuinbouwonderneming die deelneemt
      aan een samenwerkingsverband jaarlijks een emissieaangifte in als bedoeld in
      [artikel 3, eerste of tweede lid, van de Regeling kostenverevening reductie CO][ref12].

      6 De verplichtingen, bedoeld in het tweede lid, onderdeel f, en het zesde lid, onderdeel b, zijn niet van
      toepassing op een glastuinbouwonderneming of een glastuinbouwonderneming die deelneemt aan een samenwerkingsverband
      als bedoeld in [artikel 15.51, tweede lid, onderdeel b, van de Wet milieubeheer][ref13].


