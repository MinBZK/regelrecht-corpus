        bwb_id: BWBR0035474
  - number: 3.21.1
    text: |-
      In deze titel wordt verstaan onder:

        - *anticipeerregio:* regio, opgenomen in [bijlage 3.21.1][ref1], onderdeel B;
        - *gedragswetenschappelijke inzichten:* combinatie van inzichten uit de psychologie, cognitieve wetenschappen en de
      sociale en economische wetenschappen, onderbouwd door empirisch bewijs, in de wijze waarop mensen keuzes maken;
        - *krimpregio:* regio, opgenomen in [bijlage 3.21.1][ref2], onderdeel A;
        - *menselijk kapitaal:* kennis en vaardigheden die mensen in staat stellen om economische en maatschappelijke
      waarde te creëren;
        - *leercultuur:* cultuur waarbij leren gedurende het werkende leven een vanzelfsprekendheid is en er continue
      aandacht bestaat voor het op peil houden van kennis en vaardigheden;
        - *technische sectoren:* sectoren winning van delfstoffen, industrie, productie en distributie van en handel in
      elektriciteit, aardgas, stoom en gekoelde lucht, winning en distributie van water, afval- en afvalwaterbeheer en
      sanering, bouwnijverheid en informatie en communicatie.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
      [ref2]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.21.1
    references:
      - id: ref1
        bwb_id: BWBR0035474
      - id: ref2
        bwb_id: BWBR0035474
  - number: 3.21.2
    text: |-
      De Minister verstrekt op aanvraag subsidie aan een MKB-ondernemer of een samenwerkingsverband bestaande uit
      ondernemers, kennisinstellingen of andere organisaties, waarvan ten minste 65% van het totaal aan deelnemers MKB-
      ondernemer is, voor een project dat tot doel heeft oplossingen te bieden voor knelpunten voor MKB-ondernemers
      in technische sectoren om te investeren in scholing en ontwikkeling van huidig of toekomstige werkenden en dat
      betrekking heeft op een van de volgende categorieën:

      a. het bevorderen van regionale samenwerking ten aanzien van menselijk kapitaal tussen kleine of middelgrote
      ondernemingen enerzijds en grote ondernemingen anderzijds in technische sectoren;

      b. het versterken van een leercultuur binnen kleine en middelgrote ondernemingen in technische sectoren;

      c. het stimuleren van samenwerking tussen kleine en middelgrote ondernemingen in technische sectoren enerzijds en
      onderwijsinstellingen anderzijds ten behoeve van het vergroten van de vraag naar beroepsgerichte opleidingen of het
      aanbod of de kwaliteit van technische docenten;

      d. het oplossen van huidige of toekomstige tekorten aan werkenden in technische sectoren in krimpregio’s of
      anticipeerregio’s; of

      e. het anticiperen op marktontwikkelingen die voorvloeien uit de klimaat- en energietransitie.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.21.2
  - number: 3.21.3
    text: |-
      1 De subsidie bedraagt voor een mkb-ondernemer 100% van de subsidiabele kosten doch minder dan € 125.000.

      2 De subsidie bedraagt voor een samenwerkingsverband 100% van de subsidiabele kosten doch ten hoogste € 200.000,
      met dien verstande dat de subsidie per deelnemer aan het samenwerkingsverband minder dan € 125.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.21.3
  - number: 3.21.4
    text: De Minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.21.4
  - number: 3.21.5
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is één jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.21.5
