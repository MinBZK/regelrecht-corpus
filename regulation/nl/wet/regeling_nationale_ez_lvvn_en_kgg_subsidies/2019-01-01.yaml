  - number: 3.17.1
    text: |-
      In deze titel wordt verstaan onder:

        - *onderzoeksinfrastructuur:* onderzoeksinfrastructuur als bedoeld in artikel 2, onderdeel 91, van de algemene
      groepsvrijstellingsverordening;
        - *onderzoeksorganisatie:* organisatie voor onderzoek en kennisverspreiding als bedoeld in artikel 2, onderdeel 83,
      van de algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.17.1
  - number: 3.17.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie voor de financiering van de bouw van nieuwe onderzoeksinfrastructuur
      of het verbeteren van bestaande onderzoeksinfrastructuur aan:

      a. een onderzoeksorganisatie;

      b. een hogeschool als bedoeld in
      [artikel 1.3, derde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], of

      c. een door of mede door een onderzoeksorganisatie dan wel hogeschool of onderzoeksorganisaties dan wel hogescholen
      opgerichte of op te richten rechtspersoon die de onderzoeksinfrastructuur exploiteert respectievelijk zal gaan
      exploiteren.

      2 De subsidie wordt verstrekt in de vorm van een renteloze lening.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.3
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.17.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1.3'
  - number: 3.17.3
    text: |-
      1 De subsidie bedraagt 50 procent van de subsidiabele kosten.

      2 De subsidie bedraagt minimaal € 1.000.000 en maximaal € 15.000.000.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.17.3
  - number: 3.17.4
    text: |-
      Voor subsidie komen uitsluitend de kosten, bedoeld in artikel 26, vijfde lid, van de algemene
      groepsvrijstellingsverordening, in aanmerking.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.17.4
  - number: 3.17.5
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.17.5
  - number: 3.17.6
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.17.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.17.7
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. onvoldoende vertrouwen bestaat dat de subsidieontvanger de lening kan terugbetalen binnen de termijn, genoemd in
      [artikel 3.17.10, eerste lid][ref1];

      b. de subsidiabele kosten minder dan € 2.000.000 bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.10
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.17.7
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.17.10
        hoofdstuk: '3'
  - number: 3.17.8
    text: |-
      De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate:

      a. de verwachte kwaliteit van de bouw van de nieuwe onderzoeksinfrastructuur of de verbetering van de bestaande
      onderzoeksinfrastructuur hoger is (20%);

      b. de verwachte bijdrage van de onderzoeksinfrastructuur aan de economische en maatschappelijke waardecreatie en
      wetenschappelijke kwaliteit hoger is (30%);

      c. de verwachte kwaliteit van het toezicht op de onderzoeksinfrastructuur hoger is, gelet op in het verleden
      behaalde resultaten, financiële draagkracht, transparantie en organisatie van de managementlagen van de
      onderzoeksorganisatie (20%);

      d. de terugbetaling van de lening aannemelijker is, gelet op het verwachte gebruik en de exploitatie van de
      onderzoeksinfrastructuur (30%).
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.17.8
  - number: 3.17.9
    text: |-
      1 De subsidieontvanger zorgt ervoor dat:

      a. indien met de onderzoeksinfrastructuur zowel economische als niet-economische activiteiten worden verricht, voor
      de financiering, kosten en inkomsten van elke soort activiteiten een gescheiden boekhouding wordt gevoerd, op basis
      van consequent toegepaste en objectief te rechtvaardigen beginselen van kostprijsadministratie;

      b. voor zover met de onderzoeksinfrastructuur economische activiteiten worden verricht, de prijs die voor de
      exploitatie of het gebruik van de onderzoeksinfrastructuur bij iedere gebruiker in rekening wordt gebracht,
      overeenstemt met de marktprijs;

      c. de toegang tot de onderzoeksinfrastructuur:

      1°. open zal staan voor meerdere gebruikers, en

      2°. op transparante en niet-discriminerende basis verleend zal worden.

      2 Onder iedere gebruiker, bedoeld in het eerste lid, onderdeel b, wordt mede de subsidieontvanger verstaan.

      3 In afwijking van het eerste lid, onderdeel c, kan de subsidieontvanger iedere onderneming die ten minste 10% van
      de investeringskosten van de onderzoeksinfrastructuur heeft gefinancierd preferente toegang geven op gunstigere
      voorwaarden dan gelden voor de andere gebruikers, indien:

      a. deze toegang evenredig is aan de bijdrage van deze onderneming in de investeringskosten, en

      b. deze voorwaarden publiek beschikbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.17.9
  - number: 3.17.10
    text: |-
      1 De subsidieontvanger betaalt de subsidie volgens een in de beschikking tot subsidieverlening vastgelegd schema
      binnen vijftien jaar na de datum van de beschikking tot vaststelling van de subsidie terug aan de minister.

      2 De minister kan de ontheffing, bedoeld in [artikel 42, derde lid, van het besluit][ref1], slechts verlenen voor
      zover hierdoor de steunintensiteit, voor zover de subsidie betrekking heeft op economische activiteiten die met
      de onderzoeksinfrastructuur verricht gaan worden, 50% van de subsidiabele kosten niet zal overschrijden. Deze
      ontheffing kan ook na het tijdstip van vaststelling van de subsidie worden verleend.

      3 De minister kan besluiten dat de verstrekte lening versneld of in een keer terugbetaald wordt, indien de
      onderzoeksinfrastructuur geheel of gedeeltelijk wordt vervreemd.

      4 Indien de vervreemding, bedoeld in het derde lid, tot winst bij de subsidieontvanger leidt, is deze daarover een
      vergoeding van 50% verschuldigd aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel42
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.17.10
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '42'
  - number: 3.17.11
    text: |-
      1 De subsidieontvanger verleent medewerking aan een evaluatie van de effecten van de door hem uitgevoerde
      activiteiten, bedoeld in [artikel 3.17.2, eerste lid][ref1], voor zover deze medewerking redelijkerwijs van hem
      verlangd kan worden.

      2 De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.2
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.17.11
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.17.2
        hoofdstuk: '3'
  - number: 3.17.12
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 3.17.2, eerste lid][ref1], bevat ten minste de gegevens,
      bedoeld in artikel 6, tweede lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie als bedoeld in [artikel 3.17.2, eerste lid][ref2],
      ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het KvK-nummer, het post- en bezoekadres en
      het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. gegevens over het plan, waaronder de activiteit waarvoor subsidie wordt aangevraagd, de start- en einddatum, de
      totale kosten en de omvang van de gevraagde subsidie;

      d. een businessplan, een projectplan en een financieel plan, waar onder meer uit volgt in welke mate de
      onderzoeksinfrastructuur economische en niet-economische activiteiten zal verrichten;

      e. een berekening van de marktrente voor de aangevraagde lening door een erkende kredietbeoordelaar.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.2
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.17.12
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.17.2
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 3.17.2
        hoofdstuk: '3'
  - number: 3.17.13
    text: |-
      1 Voor zover de subsidie, bedoeld in [artikel 3.17.2, eerste lid][ref1], betrekking heeft op economische
      activiteiten die met de onderzoeksinfrastructuur verricht gaan worden, bevat de subsidie staatssteun die wordt
      gerechtvaardigd door artikel 26 van de algemene groepsvrijstellingsverordening.

      2 Voor zover de subsidie, bedoeld in [artikel 3.17.2, eerste lid][ref2], betrekking heeft op niet-economische
      activiteiten die met de onderzoeksinfrastructuur verricht gaan worden, bevat de subsidie geen staatssteun.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.2
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.17.13
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.17.2
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 3.17.2
        hoofdstuk: '3'
  - number: 3.17.14
    text: |-
      Deze titel vervalt met ingang van 1 juli 2020, met dien verstande dat deze van toepassing blijft op subsidies die
      voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.17.14
  - number: 3.19.1
    text: |-
      In deze titel wordt verstaan onder:

        - *drijvende en bewegende offshore-constructie:* constructie voor de exploratie, exploitatie of productie van
      olie, gas of hernieuwbare energie of winning van grond- en voedingsstoffen op zee die: a. de kenmerken van
      een commercieel schip bezit; b. niet beschikt over eigen voortstuwing, en c. bedoeld is om meermaals op eigen
      drijfvermogen te worden verplaatst terwijl zij in bedrijf is;
        - *scheepsbouwinnovatieproject:* een project dat bestaat uit de experimentele ontwikkeling van nieuwe of verbeterde
      onderdelen bij de bouw of verbouw van een schip of de bouw van een drijvende en bewegende offshore-constructie
      in vergelijking met die welke in de scheepsbouwsector gewoonlijk binnen de Europese Unie worden gebruikt of
      beschikbaar zijn en waarvan de implementatie of toepassing een risico op technologische of industriële mislukking
      inhoudt;
        - *scheepswerf:* onderneming die schepen ontwerpt, ontwikkelt, bouwt en uitrust, hetzij zelfstandig, hetzij deel
      uitmakend van een groep;
        - *schip:* zichzelf voortstuwend zeeschip of binnenvaartschip dat is bestemd om voor commerciële doeleinden te
      worden gebruikt en tot één van de volgende categorieën behoort: a. zeeschepen of binnenvaartschepen, niet zijnde
      vissersvaartuigen, met een minimaal tonnage van 100 bruto ton, bestemd voor het vervoer van passagiers of goederen
      of voor het verrichten van een speciale dienst; b. sleepboten met een minimaal vermogen van 365 kW.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.19.1
  - number: 3.19.2
    text: |-
      De minister kan op aanvraag subsidie verstrekken aan een scheepswerf voor een scheepsbouwinnovatieproject dat een
      bijdrage levert aan duurzame ontwikkeling op de gebieden, beschreven in [bijlage 3.19.1][ref1], en gericht is op:

      a. de ontwikkeling en het ontwerp van een nieuwe scheepsklasse of een nieuwe klasse drijvende en bewegende
      offshore-constructies;

      b. de ontwikkeling van een nieuw onderdeel van een schip of drijvende en bewegende offshore-constructie dat als
      afzonderlijk element van het schip of de drijvende en bewegende offshore-constructie kan worden onderscheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.19.2
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 3.19.3
    text: De subsidie bedraagt 25% van de subsidiabele kosten en bedraagt maximaal € 1.250.000.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.19.3
  - number: 3.19.4
    text: |-
      Voor subsidie komen uitsluitend de kosten in aanmerking, bedoeld in artikel 25, derde lid, onderdelen a, b, d en e,
      van de algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.19.4
  - number: 3.19.5
    text: |-
      1 De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.

      2 Indien de minister op de dag dat het subsidieplafond is bereikt meer aanvragen van één aanvrager of aanvragers
      behorend tot één groep heeft ontvangen, verdeelt hij die dag het beschikbare budget door te beginnen met de door de
      aanvrager of groep als hoogst gerangschikte aanvraag, daarna de door de aanvrager of groep als tweede gerangschikte
      aanvraag en zo verder.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.19.5
  - number: 3.19.6
    text: |-
      1 De subsidie wordt verleend onder de opschortende voorwaarde dat de subsidieontvanger binnen 13 weken na de
      beschikking tot subsidieverlening aantoont dat:

      a. de opdrachtgever en de subsidieontvanger de overeenkomst tot de bouw of verbouw van een schip of de bouw van
      een drijvende en bewegende offshore-constructie waarvoor een scheepsbouwinnovatieproject wordt uitgevoerd hebben
      gesloten;

      b. de opdrachtgever ter uitvoering van de overeenkomst, bedoeld in onderdeel a, een of meer betalingen heeft
      gedaan, en

      c. de overeenkomst, bedoeld in onderdeel a, een volledige weergave vormt van de tussen subsidieontvanger en
      opdrachtgever gemaakte afspraken.

      2 De minister kan op verzoek van de subsidieontvanger de termijn, bedoeld in het eerste lid, verlengen tot een
      periode van maximaal twee jaar na de beschikking tot subsidieverlening.

      3 Met de uitvoering van het scheepsbouwinnovatieproject wordt gestart binnen de termijn die ingevolge het eerste of
      tweede lid op de subsidieverlening van toepassing is.

      4 Het scheepsbouwinnovatieproject wordt uitgevoerd binnen drie jaar na de aanvang daarvan.

      5 De minister kan op verzoek van de subsidieontvanger de termijn, bedoeld in het vierde lid, verlengen met een
      periode van maximaal twee jaar.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.19.6
  - number: 3.19.7
    text: |-
      1 Er is een Adviescommissie duurzame scheepsbouw die tot taak heeft de minister op zijn verzoek te
      adviseren omtrent de afwijzingsgronden, bedoeld in [artikelen 22][ref1] en [23 van het besluit][ref2] en
      [artikel 3.19.8][ref3].

      2 De commissie bestaat uit ten minste drie en ten hoogste vijf leden.

      3 De voorzitter en de andere leden worden door de minister voor een termijn van ten hoogste drie jaar benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.19.8
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.19.7
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0035474
        artikel: 3.19.8
        hoofdstuk: '3'
  - number: 3.19.8
    text: |-
      De minister beslist afwijzend op een aanvraag om subsidie, indien:

      a. tussen de subsidieontvanger en de opdrachtgever voor indiening van de aanvraag om subsidie een overeenkomst
      tot de bouw of verbouw van een schip of de bouw van een drijvende en bewegende offshore-constructie waarbij een
      scheepsbouwinnovatieproject wordt uitgevoerd is gesloten;

      b. door verstrekking van de subsidie, bedoeld in [artikel 3.19.2][ref1], het totaal van de op grond van dit artikel
      ontvangen subsidie ten behoeve van een scheepswerf of een groep van ondernemingen waartoe deze scheepswerf behoort,
      meer bedraagt dan 30% van het voor deze titel toepasselijke subsidieplafond;

      c. van het scheepsbouwinnovatieproject onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten
      zijn;

      d. het scheepsbouwinnovatieproject niet leidt tot een voldoende mate van vernieuwing van een product;

      e. het scheepsbouwinnovatieproject onvoldoende bijdraagt aan duurzame ontwikkeling op de gebieden, beschreven in
      [bijlage 3.19.1][ref2];

      f. de kwaliteit van het projectplan onvoldoende is;

      g. het scheepsbouwinnovatieproject een niveau van milieubescherming beoogt te bereiken dat niet verder gaat dan
      verplicht op grond van EU-rechtshandelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.19.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.19.8
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.19.2
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0035474
  - number: 3.19.9
    text: |-
      1 Een aanvraag om subsidie bevat ten minste de gegevens, bedoeld in artikel 6, tweede lid, van de algemene
      groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag om subsidie ten minste:

      a. gegevens over de aanvrager, waaronder het nummer waaronder de onderneming geregistreerd is bij de Kamer van
      Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. gegevens over de bouw of verbouw van het schip of de bouw van de drijvende en bewegende offshore-constructie;

      d. een projectplan voor uitvoering van het scheepsbouwinnovatieproject;

      e. een verklaring van de scheepswerf en de opdrachtgever voor de bouw of verbouw van een schip of de bouw van een
      drijvende en bewegende offshore-constructie waaruit de intentie tot uitvoering van het scheepsbouwinnovatieproject
      blijkt.

      3 Onverminderd het eerste en tweede lid bevat een aanvraag om subsidie voor een grote onderneming tevens door die
      onderneming opgestelde documenten waaruit blijkt dat de subsidie zal leiden tot:

      a. een wezenlijke toename van de omvang van het scheepsbouwinnovatieproject;

      b. een wezenlijke toename van de totale uitgaven van de subsidieontvanger voor het scheepsbouwinnovatieproject als
      gevolg van de subsidie, of

      c. een wezenlijke toename van de snelheid waarmee het scheepsbouwinnovatieproject wordt voltooid.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.19.9
  - number: 3.19.10
    text: |-
      1 De subsidieontvanger verleent medewerking aan een evaluatie van de effecten van de door hem op grond van deze
      titel uitgevoerde activiteiten, voor zover medewerking redelijkerwijs van hem kan worden verlangd.

      2 De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.19.10
  - number: 3.19.11
    text: |-
      De subsidie, bedoeld in [artikel 3.19.2][ref1], bevat staatssteun en wordt gerechtvaardigd door artikel 25 van de
      algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.19.2
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.19.11
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.19.2
        hoofdstuk: '3'
  - number: 3.19.12
    text: |-
      Deze titel en [bijlage 3.19.1][ref1] vervallen met ingang van 4 juni 2019, met dien verstande dat deze van
      toepassing blijven op subsidies die voor die datum zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.19.12
