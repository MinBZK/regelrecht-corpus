  - number: 4.1.1
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *energiedemonstratieproject:* op bescherming van het milieu gericht samenhangend geheel van activiteiten die
      een technisch en economisch risico inhouden, waarbij die activiteiten bestaan uit het door de aanvrager treffen
      van energie-efficiëntie maatregelen of maatregelen ter bevordering van energie uit hernieuwbare energiebronnen met
      behulp van: a. voor Nederland nieuwe apparaten, systemen of technieken, of b. een voor Nederland nieuwe toepassing
      van apparaten, systemen of technieken;
        - *duurzame energiehuishouding:* energiehuishouding die economisch efficiënt is, het milieu minder zwaar belast of
      voorziet in beschikbaarheid van energie in voldoende mate en van voldoende kwaliteit;
        - *kennisinstelling:* a. onder a, b, c, f, g of h van de [bijlage van de Wet op het hoger onderwijs en
      wetenschappelijk onderzoek](onbekend) genoemde instelling voor hoger onderwijs, b. andere dan onder a bedoelde
      geheel of gedeeltelijk door de rijksoverheid gefinancierde onderzoeksorganisatie die activiteiten verricht met als
      doel de algemene wetenschappelijke en technische kennis uit te breiden, c. geheel of gedeeltelijk door een andere
      staat gefinancierde openbare instelling voor hoger onderwijs gelijkwaardig aan een instelling als bedoeld onder a,
      of d. geheel of gedeeltelijk door een andere staat gefinancierde onderzoeksinstelling die activiteiten verricht met
      als doel de algemene wetenschappelijke en technische kennis uit te breiden;
        - *milieubescherming:* milieubescherming als bedoeld in paragraaf 1.3, onderdeel 19, onder 1, van het milieu- en
      energiesteunkader;
        - *milieustudie:* milieustudie als bedoeld in artikel 49, eerste lid, van de algemene
      groepsvrijstellingsverordening;
        - *niet-economische activiteiten van onderzoeksorganisaties:* fundamenteel onderzoek, industrieel onderzoek of
      experimentele ontwikkeling of een combinatie van deze vormen, onafhankelijk uitgevoerd door onderzoeksorganisaties
      en in de boekhouding van deze organisaties opgenomen als niet-economische activiteiten;
        - *ondernemer in de landbouwsector:* ondernemer die activiteiten verricht op het gebied van de productie,
      verwerking en afzet van landbouwproducten als bedoeld in bijlage 1 bij het Verdrag tot oprichting van de Europese
      Gemeenschap, met uitzondering van ondernemers in de visserij- en aquacultuursector en in de bosbouwsector;
        - *referentiekosten:* kosten voor een investering ten behoeve van een in Nederland gangbaar systeem, apparaat of
      techniek die in technisch opzicht vergelijkbaar is met een in Nederland uit te voeren project maar waarmee niet
      hetzelfde niveau van milieubescherming kan worden bereikt als met het uit te voeren project, terwijl, in geval van
      een uit te voeren project voor hernieuwbare energie, de capaciteit voor de opwekking van energie van dat project
      ten minste overeenkomt met die van de eerstbedoelde investering.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.1.1
  - number: 4.1.3
