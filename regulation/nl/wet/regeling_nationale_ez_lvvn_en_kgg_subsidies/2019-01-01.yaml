  - number: 3.13a.4
    text: |-
      1 Er wordt garant gestaan voor 80 procent van het nog niet afgeloste deel van de lening.

      2 Indien de financier bij het verkrijgen van een lening een gedeelte daarvan niet onder de garantstelling van de
      Staat brengt, zijn de bepalingen van deze titel slechts van toepassing op het gedeelte van de verkregen lening dat
      onder de garantstelling is gebracht.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.13a.4
  - number: 3.13a.5
    text: |-
      1 De garantstelling heeft uitsluitend betrekking op een lening waarbij de aan de

      ondernemer verstrekte lening niet minder bedraagt dan € 750.000.

      2 De garantstelling heeft uitsluitend betrekking op een lening waarbij de aan de ondernemer of, indien de
      ondernemer deel uitmaakt van een groep, aan de groep verstrekte lening tezamen met het nog niet afgeloste deel van
      een of meer leningen die door een financier:

      a. met toepassing van deze titel aan de ondernemer onderscheidenlijk de groep is of zijn verstrekt of gelijktijdig
      wordt of worden verstrekt niet meer bedraagt dan € 25.000.000, of

      b. met toepassing van deze titel en [titel 3.13][ref1] aan de ondernemer onderscheidenlijk de groep is of zijn
      verstrekt of gelijktijdig wordt of worden verstrekt niet meer bedraagt dan € 50.000.000.


