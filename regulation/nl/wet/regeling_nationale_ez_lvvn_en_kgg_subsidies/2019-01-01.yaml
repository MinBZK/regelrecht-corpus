  - number: 4.3.4
    text: |-
      1 De subsidie bedraagt maximaal € 11.050.000 per aardwarmteproject.

      2 De subsidie bedraagt maximaal € 18.700.000 per diep aardwarmteproject.

      3 Het subsidiebedrag wordt zodanig verminderd, dat de som van de volgende bedragen niet meer dan 95 procent van de
      gerealiseerde subsidiabele kosten bedraagt:

        - het subsidiebedrag,
        - het bedrag aan overige voor het betreffende project aan de subsidieontvanger verleende dan wel vastgestelde
      subsidies, en
        - het bedrag waarop de subsidieontvanger voor het desbetreffende project op grond van een verzekering of
      garantstelling aanspraak kan doen.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.3.4
  - number: 4.3.5
    text: |-
      1 De [artikelen 10 tot en met 14 van het besluit][ref1] zijn niet van toepassing.

      2 Bij een doublet komen de volgende kosten voor subsidie in aanmerking:

      a. kosten boring productie- en injectieput;

      b. premie die door de subsidieontvanger krachtens [artikel 4.3.10][ref2] wordt betaald;

      c. kosten op- en afbouwen boorinstallatie;

      d. kosten boormanagement en -toezicht;

      e. kosten locatie boorgereed maken;

      f. cuttings/spoeling afvoeren;

      g. kosten puttest en rapportage;

      h. kosten voor de acquisitie van data ten behoeve van de geologische evaluatie van het boorgat;

      i. additionele kosten voor de realisatie van alternatief gebruik voor ten hoogste 15 jaar;

      j. additionele kosten voor de verbeterwerkzaamheden voor ten hoogste 15 jaar;

      k. onvoorziene kosten tot en met de realisatie van het doublet met inbegrip van de puttesten van het doublet.

      3 Bij een half-doublet komen de volgende kosten voor de subsidie in aanmerking:

      a. kosten boring gegarandeerde put;

      b. premie die door de subsidieontvanger krachtens [artikel 4.3.10][ref3] wordt betaald;

      c. kosten op- of afbouwen boorinstallatie voor de gegarandeerde put;

      d. kosten boormanagement en -toezicht voor de realisatie van de gegarandeerde put met inbegrip van de puttest van
      deze put;

      e. kosten locatie boorgereed maken voor de gegarandeerde put;

      f. kosten cuttings/spoeling afvoeren van de gegarandeerde put;

      g. kosten puttest en rapportage van de gegarandeerde put;

      h. kosten voor de acquisitie van data ten behoeve van de geologische evaluatie van het boorgat van de gegarandeerde
      put;

      i. de additionele kosten voor de realisatie van alternatief gebruik voor de gegarandeerde put voor ten hoogste
      15 jaar;

      j. de additionele kosten voor de verbeterwerkzaamheden voor de gegarandeerde put voor ten hoogste 15 jaar;

      k. onvoorziene kosten bij de realisatie van de gegarandeerde put van het half doublet met inbegrip van de puttest
      van deze put.

      4 Indien subsidie wordt verstrekt voor een doublet komt voor subsidie in aanmerking een vast bedrag van € 500.000
      voor het plaatsen van een pompinstallatie of het dichten van de put of putten.

      5 Indien subsidie wordt verstrekt voor een half-doublet komt voor subsidie in aanmerking een vast bedrag van
      € 250.000 voor het plaatsen van een pompinstallatie voor de gegarandeerde put of het dichten van deze put.

      6 Voor zover kosten uit andere hoofde zijn of worden gesubsidieerd van overheidswege komen zij niet in aanmerking
      voor subsidie.

      7 Bij de toepassing van [artikel 6, eerste lid, van het besluit][ref4] blijven buiten beschouwing:

      a. de subsidies op grond van:

      1°. hoofdstuk 2 van [bijlage 2 Marktintroductie energie-innovaties van de Regeling LNV-subsidies][ref5],

      2°. de [Unieke kansen regeling][ref6],

      3°. de Subsidieregeling internationaal innoveren,

      4°. [hoofdstuk 3 van de Tijdelijke energieregeling markt en innovatie][ref7],

      5°. het [Besluit stimulering duurzame energieproductie][ref8],

      6°. paragraaf 4.2.10, Demonstratie energie-innovatie (DEI),

      7°. paragraaf 4.2.3, Hernieuwbare energie,

      8°. titel 2.3, Energie-efficiëntie en hernieuwbare energie glastuinbouw; en

      b. bijdragen van de Europese Commissie op grond van:

      1°. het Zevende Kaderprogramma voor activiteiten op het gebied van onderzoek, technologische ontwikkeling en
      demonstratie,

      2°. het Kaderprogramma voor concurrentievermogen en innovatie,

      3°. het meerjarenprogramma voor acties op energiegebied: ‘Intelligente energie- Europa’,

      4°. het financieringsinstrument voor het Milieu: ‘Life’,

      5°. [Richtlijn 2003/87/EG](32003L0087) van het Europees Parlement en de Raad van de Europese Unie van 13 oktober
      2003 tot vaststelling van een regeling voor de handel in broeikasemissierechten binnen de Gemeenschap en tot
      wijziging van [Richtlijn 96/61/EG](31996L0061) van de Raad (Pb EG 2003/L275),

      6° Verordening (EG) nr. 1234 /2007 van de Raad van 22 oktober 2007 houdende een gemeenschappelijke ordening van
      de landbouwmarkten en specifieke bepalingen voor een aantal landbouwproducten (Integrale-GMO-verordening) en
      Verordening (EU) nr. 1308/2013 van het Europees Parlement en de Raad van 17 december 2013 tot vaststelling van een
      gemeenschappelijke ordening van de markten voor landbouwproducten en tot intrekking van de Verordeningen (EEG) nr.
      922/72, (EEG) nr. 234/79, (EG) nr. 1037/2001 en (EG) nr. 1234/2007 van de Raad (PbEU 2013, L 347),

      7°. Het Europees Fonds voor Regionale Ontwikkeling,

      8°. INTERREG,

      9°. de Europese Structuur- en Cohesiefondsen, en

      10°. verordening (EU) nr. 1291/2013 van het Europees Parlement en de Raad van 11 december 2013 tot vaststelling
      van Horizon 2020 – het kaderprogramma voor onderzoek en innovatie (2014–2020) en tot intrekking van Besluit
      nr. 1982/2006/EG (PbEU 2013, L 347).

      8 Bijdragen van gemeenten, provincies, waterschappen en openbare lichamen als bedoeld in
      [artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen][ref9], worden aangemerkt als publieke
      cofinanciering en blijven bij de toepassing van [artikel 6, eerste lid, van het besluit][ref10] buiten beschouwing
      voor zover het de berekening betreft van het maximumbedrag dat krachtens deze titel per project kan worden
      verstrekt.


