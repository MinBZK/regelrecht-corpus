  - number: 2.2.9
    text: |-
      1 Er is een Adviescommissie udv-subsidies die tot taak heeft de Minister te adviseren over de rangschikking van de
      aanvragen van subsidie voor projecten als bedoeld in [artikel 2.2.2, onderdelen a en b][ref1].

      2 De voorzitter en de leden worden voor de duur van vier jaar benoemd.

      3 De Adviescommissie udv-subsidies rangschikt bij haar advisering aanvragen van subsidie voor projecten als bedoeld
      in [artikel 2.2.2, onderdeel a][ref2], hoger naarmate:

      a. er meer aandacht wordt gegeven aan de mogelijkheden voor sociale innovatie of nieuwe marktconcepten (30%);

      b. er meer wordt bijgedragen aan de diverse udv-ambities (30%);

      c. er meer verschillende partners in het project worden betrokken, waaronder één of meer detailhandelaren of
      partijen van buiten de dierlijke keten (40%).

      4 De Adviescommissie udv-subsidies neemt bij haar advisering over de rangschikking van aanvragen van subsidie voor
      projecten als bedoeld in [artikel 2.2.2, onderdeel b][ref3], in aanmerking:

      a. de aard en de omvang van de weg te nemen drempel (25%);

      b. het potentieel van het udv-project om systeeminnovaties te bewerkstelligen (25%);

      c. de mate waarin wordt bijgedragen aan de diverse udv-ambities (15%);

      d. de betrokkenheid van een of meer partners van buiten de dierlijke productieketen in het project, waaronder één
      of meer detailhandelaren of een privaatrechtelijke belangenorganisatie (25%);

      e. de mate van vernieuwing ten opzichte van de gangbare praktijk en techniek groter is (10%).

      5 De Adviescommissie udv-subsidies, bedoeld in het eerste lid, kan de minister adviseren om een aanvraag tot
      subsidieverlening af te wijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.2
