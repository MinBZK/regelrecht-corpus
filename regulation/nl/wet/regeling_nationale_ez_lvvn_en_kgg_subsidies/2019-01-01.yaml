    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.14.4
  - number: 3.14.5
    text: |-
      1 De garantstelling heeft uitsluitend betrekking op een bankgarantie waarbij de door een financier ten laste van
      een ondernemer afgegeven bankgarantie niet minder bedraagt dan € 250.000.

      2 De garantstelling heeft uitsluitend betrekking op een bankgarantie waarbij de aan de ondernemer of, indien de
      ondernemer deel uitmaakt van een groep, aan de groep verstrekte bankgarantiefaciliteit tezamen met

      a. een of meer bankgarantiefaciliteiten of

      b. het nog niet afgeloste deel van een of meer leningen als bedoeld in [artikel 3.13.2][ref1]

      die door een financier met toepassing van dit hoofdstuk aan de ondernemer onderscheidenlijk de groep is of zijn
      verstrekt of gelijktijdig wordt of worden verstrekt niet meer bedraagt dan € 50.000.000.


