  - number: 3.3.12
    text: |-
      Deze titel vervalt met ingang van 1 maart 2023, met dien verstande dat deze van toepassing blijft op subsidies die
      voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.3.12
  - number: 3.4.1
    text: |-
      1 In deze titel wordt verstaan onder:

        - *Adviesorganisatie:* organisatie, niet zijnde een kennisinstelling, die deskundigheid heeft op het gebied van de
      op grond van deze regeling te subsidiëren activiteiten, en die als bedrijfsactiviteit adviesopdrachten uitvoert;
        - *detachering:* detachering als bedoeld in artikel 2, onderdeel 98, van de algemene
      groepsvrijstellingsverordening;
        - *hooggekwalificeerd personeel:* hooggekwalificeerd personeel als bedoeld in artikel 2, onderdeel 93, van de
      algemene groepsvrijstellingsverordening;
        - *kennisinstelling:* a. onder a, b, c, g of h van de [bijlage van de Wet op het hoger onderwijs en
      wetenschappelijk onderzoek](onbekend) genoemde instelling voor hoger onderwijs en een onder j van de bijlage bij
      die wet bedoeld academisch ziekenhuis en Nyenrode Business Universiteit; b. andere dan onder a bedoelde geheel of
      gedeeltelijk, meerjarig door de overheid gefinancierde onderzoeksorganisatie zonder winstoogmerk die activiteiten
      verricht met als doel de algemene wetenschappelijke of technische kennis uit te breiden; c. geheel of gedeeltelijk,
      meerjarig door een andere lidstaat van de Europese Unie gefinancierde: 1°. openbare instelling voor hoger onderwijs
      of een daaraan verbonden ziekenhuis gelijkwaardig aan een instelling respectievelijk academisch ziekenhuis als
      bedoeld onder a, 2°. onderzoeksorganisatie zonder winstoogmerk die activiteiten verricht met als doel de algemene
      wetenschappelijke en technische kennis uit te breiden; d. rechtspersoon ten aanzien waarvan een instelling
      als bedoeld onder a, b of c direct of indirect: 1°. meer dan de helft van het geplaatste kapitaal verschaft,
      2°. volledig aansprakelijk vennoot is of 3°. overwegende zeggenschap heeft; e. onderzoeksorganisatie zonder
      winstoogmerk met eigen medewerkers in loondienst, die tot doel heeft via het structureel doen van eigen onderzoek
      en het ontwikkelen en testen van technische toepassingen door haar medewerkers, de technologische kennis op een
      specifiek terrein te bevorderen, die geen instelling is als bedoeld onder a tot en met d;
        - *MIT-haalbaarheidsproject:* een project dat bestaat uit een haalbaarheidsstudie, of uit een combinatie van een
      haalbaarheidsstudie en experimentele ontwikkeling of industrieel onderzoek;
        - *MIT-innovatie-adviesproject:* een door een kennisinstelling of een onafhankelijke adviesorganisatie
      verrichte activiteit bestaande uit het, al dan niet op basis van te verrichten nader onderzoek, adviseren
      over een toepassingsgerichte kennisvraag van een ondernemer, uitgaande van voor de ondernemer nieuwe kennis
      met betrekking tot de vernieuwing van producten, productieprocessen of diensten, dan wel het verstrekken van
      innovatieadviesdiensten of innovatieondersteunings-diensten als bedoeld in artikel 2, nrs. 94 en 95 van de algemene
      groeps-vrijstellingsverordening;
        - *MIT-kennisoverdrachtsproject:* een door een kennisinstelling verrichte activiteit bestaande uit het, al dan
      niet op basis van te verrichten nader onderzoek, beantwoorden van een toepassingsgerichte kennisvraag van een
      ondernemer, uitgaande van voor de ondernemer nieuwe kennis met betrekking tot de vernieuwing van producten,
      productieprocessen of diensten;
        - *MIT-kennisvoucher:* een op grond van [artikel 3.4.8][ref1] door de minister aan een MKB-ondernemer afgegeven
      document, dat deze ondernemer kan inleveren bij een kennisinstelling ten behoeve van de uitvoering van een MIT-
      kennisoverdrachtsproject;
        - *MIT-R&D-samenwerkingsproject:* project, bestaande uit industrieel onderzoek of experimentele ontwikkeling of een
      combinatie hiervan, in daadwerkelijke samenwerking uitgevoerd door een MIT-R&D-samenwerkingsverband;
        - *MIT-R&D-samenwerkingsverband:* verband dat geen rechtspersoonlijkheid bezit, bestaande uit twee of meer niet
      in een groep verbonden MKB-ondernemers, welk verband is opgericht ten behoeve van de uitvoering van een MIT-R&D-
      samenwerkingsproject.

      2 Onder een MIT-kennisoverdrachtsproject als bedoeld in het eerste lid wordt niet verstaan een project waarbij
      de beantwoording van een toepassingsgerichte kennisvraag plaatsvindt door het leveren van goederen, het geven
      van cursussen of het verrichten van activiteiten op het gebied van verkoop van producten of diensten, zoals het
      ontwikkelen en vervaardigen van marketinginstrumenten en verkoopondersteunend promotiemateriaal.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.4.8
