  - number: 3.11.9
    text: |-
      Een aanvraag voor een borgstelling als bedoeld in [artikel 3.11.2, eerste en derde lid][ref1], bevat in ieder
      geval:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het KvK-nummer, het post- en bezoekadres en
      het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. kerngegevens over de organisatie, waaronder de funding, de deskundigheid, het financieringsbeleid, het
      financieringsproces, het beheer, en het uitwinningsbeleid van krediet;

      d. een brief van DNB en AFM aan uw organisatie waaruit blijkt dat u aan de door hen gestelde eisen voldoet, dan wel
      dat deze eisen op u niet van toepassing zijn;

      e. een ondernemersplan;

      f. een uittreksel uit het Handelsregister;

      g. een volledige C.V. van steutelfunctionarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.11.2
