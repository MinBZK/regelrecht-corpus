    text: |-
      1 De subsidieontvanger voltooit het aardwarmteproject of diep aardwarmteproject uiterlijk twaalf
      maanden na de datum van aanvang van het aardwarmteproject of diep aardwarmteproject, bedoeld in
      [artikel 4.3.11, eerste lid][ref1].

      2 De termijn, bedoeld in het eerste lid, wordt met twaalf maanden verlengd indien uit de mededeling,
      bedoeld in [artikel 4.3.12, eerste lid][ref2], blijkt dat de subsidieontvanger verbeterwerkzaamheden of
      alternatiefwerkzaamheden wil uitvoeren.

      3 De minister kan voor het vertragen, essentieel wijzigen of het stopzetten van activiteiten op voorafgaand verzoek
      van de subsidieontvanger ontheffing verlenen van de verplichting, bedoeld in het eerste of tweede lid.


