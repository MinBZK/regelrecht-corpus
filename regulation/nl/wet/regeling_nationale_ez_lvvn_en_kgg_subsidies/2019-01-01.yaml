  - number: 3.16.16
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.16.16
  - number: 3.16.17
    text: |-
      1 De minister rangschikt de aanvragen waarop niet met toepassing van [artikel 3.16.14][ref1] afwijzend is beslist,
      zodanig dat een vroegefasetraject hoger gerangschikt wordt naarmate:

      a. het commercieel perspectief van het vroegefasetraject groter is;

      b. de kennisbasis en innovativiteit van het vroegefasetraject groter is;

      c. de kwaliteit van de academische innovatieve starter, hbo-innovatieve starter of TO2-innovatieve starter en het
      team dat betrokken is bij het vroegefasetraject hoger is;

      d. de kwaliteit van het vroegefasetraject hoger is.

      2 Voor de rangschikking telt het criterium, genoemd in onderdeel a, voor 40 procent en de criteria, genoemd in de
      onderdelen b tot en met d, elk voor 20 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.16.14
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel3.16.17
