  - number: 4.2.63a
    text: |-
      Tegelijkertijd met de aanvraag tot subsidievaststelling voor een Urban Energy-project als bedoeld in Urban
      Energy-programmalijn 0 (Korte termijn innovaties aardgasloze wijken, woningen en gebouwen), zoals beschreven in
      [bijlage 4.2.8][ref1], geeft de subsidieontvanger door middel van een verslag tenminste inzicht in:

      a. de vervolgstappen die het samenwerkingsverband gaat zetten na afloop van het project om tot uitvoering en
      implementatie in de markt van wat onderzocht is te komen;

      b. de verwachte kosten en prijsreductie ten opzichte van de referentie van het aardgasloos maken van een woning,
      wijk, of gebouw op basis van dit project;

      c. de verwachte energieprestatie van een woning of gebouw bij implementatie in de markt van hetgeen ontwikkeld is
      in de vorm van een EPC (Energieprestatiecoëfficiënt) die berekend is via de EPN-systematiek.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.2.63a
