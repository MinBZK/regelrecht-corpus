  - number: 4.5.19
    text: |-
      Deze titel vervalt met ingang van 1 januari 2021, met dien verstande dat deze van toepassing blijft op subsidies
      die voor deze datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.5.19
  - number: 4.7.1
    text: |-
      In deze titel wordt verstaan onder:

        - *energieadvies:* verkenning van de mogelijkheden om de energie-efficiency van een bestaande sportaccommodatie te
      verbeteren, vastgelegd in een adviesrapport;
        - *landelijke koepelorganisatie:* NOC*NSF, alsmede de in NOC*NSF vertegenwoordigde Nederlandse Christelijke sport
      Unie, de Nederlandse Katholieke Sportfederatie en de Nederlandse Culturele Sportbond;
        - *maatregel:* maatregel als bedoeld in [artikel 4.7.2][ref1];
        - *NOC*NSF:* Vereniging Nederlands Olympisch Comité* Nederlandse Sport Federatie te Arnhem;
        - *sportaccommodatie:* accommodatie, bestemd en in gebruik voor activiteiten van een sportvereniging;
        - *sportstichting:* stichting die ten minste een gedeelte van een sportaccommodatie in eigendom heeft;
        - *sportvereniging:* vereniging met volledige rechtsbevoegdheid die lid is van een landelijke koepelorganisatie of
      een in NOC*NSF vertegenwoordigde landelijke sportorganisatie en waarbinnen een door NOC*NSF erkende tak van sport
      wordt beoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.7.2
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.7.1
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 4.7.2
        hoofdstuk: '4'
  - number: 4.7.2
    text: |-
      De minister verstrekt op aanvraag een subsidie aan een sportvereniging of een sportstichting voor het uitvoeren
      van een maatregel die is opgenomen in bijlage 4.7.1 ten behoeve van energiebesparing of het opwekken van duurzame
      energie voor sportaccommodaties.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.7.2
  - number: 4.7.3
    text: |-
      In afwijking van de [artikelen 10, eerste lid][ref1], en [11 van het besluit][ref2] komen uitsluitend voor subsidie
      in aanmerking de kosten voor het uitvoeren van een maatregel bestaande uit de aanschaf van een installatie of
      apparatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel11
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.7.3
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '11'
  - number: 4.7.4
    text: |-
      1 De subsidie aan een sportvereniging bedraagt 30% van de subsidiabele kosten.

      2 De subsidie aan een sportstichting bedraagt 15% van de subsidiabele kosten.

      3 De subsidie wordt verhoogd met 500 euro, indien een maatregel waarvoor subsidie wordt aangevraagd gebaseerd is op
      een van een datum voorzien energieadvies dat uiterlijk zes jaar voor de eerste dag van de openstellingsperiode is
      uitgebracht en waarin zijn opgenomen:

      a. een beschrijving van de sportaccommodatie;

      b. een overzicht van de totale energiehuishouding van de bestaande totale sportaccommodatie;

      c. een energiebalans van de relevante onderdelen van de bestaande totale sportaccommodatie;

      d. een overzicht van de mogelijkheden en kwantificering tot energiebesparing;

      e. een overzicht van de noodzakelijke organisatorische en administratieve aanpassingen;

      f. een raming van de te verwachten investeringskosten en de te verwachten baten.

      4 De verhoging, bedoeld in het derde lid, wordt eenmaal toegekend per uitgebracht energieadvies.

      5 De subsidie bedraagt maximaal € 125.000 per jaar.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.7.4
  - number: 4.7.5
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.7.5
  - number: 4.7.6
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is een jaar na subsidieverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.7.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 4.7.7
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. de energierekening van de sportaccommodatie waar de maatregel wordt gerealiseerd niet wordt afgeschreven van een
      bankrekening die op naam staat van de aanvrager;

      b. de kosten van de investering niet worden afgeschreven van een bankrekening die op naam staat van de aanvrager;

      c. aan de aanvrager voor de desbetreffende maatregel gedurende het desbetreffende kalenderjaar op grond van deze
      titel reeds subsidie is verleend;

      d. de subsidiabele kosten minder dan € 3.000 bedragen;

      e. de aanvrager geen toestemming heeft van de eigenaar van de sportaccommodatie om de maatregel uit te voeren;

      f. de sportvereniging of sportstichting voor de maatregel geen overeenkomst heeft gesloten met de bouwer of
      leverancier, waarin is aangegeven welke apparatuur of installatie als bedoeld in de maatregelenlijst in bijlage
      4.7.1, zal worden aangeschaft;

      g. de overeenkomst, bedoeld in onderdeel f, betrekking heeft op de aanschaf van gebruikte apparatuur of
      installaties;

      h. de overeenkomst, bedoeld in onderdeel f, voor 1 september 2015 is aangegaan;

      i. de overeenkomst, bedoeld in onderdeel f, op het moment van ontvangst van de aanvraag meer dan negen maanden
      daarvoor is gesloten;

      j. de sportvereniging of sportstichting werkzaam is in een van de sectoren die ingevolge artikel 1 van de de-
      minimis verordening is uitgesloten van de toepassing van die verordening.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.7.7
  - number: 4.7.8
    text: |-
      De subsidieontvanger vervreemdt de installatie of apparatuur waarvoor subsidie is verstrekt niet binnen een jaar na
      de datum van de subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.7.8
  - number: 4.7.9
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in deze titel bevat ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de aanvrager, het KvK-nummer, het post- en bezoekadres en het
      bankrekeningnummer en lidmaatschap van de sportvereniging van een landelijke koepelorganisatie of een in NOC*NSF
      vertegenwoordigde landelijke sportorganisatie en waarbinnen een door NOC*NSF erkende tak van sport wordt beoefend;

      b. gegevens over de contactpersoon bij de aanvrager waaronder de naam, het telefoonnummer en het e-mailadres;

      c. gegevens over de maatregel of maatregelen waarvoor subsidie wordt aangevraagd;

      d. gegevens over de sportaccommodatie, waaronder het post- en bezoekadres;

      e. een verklaring de-minimissteun.

      2 De aanvraag tot subsidieverlening gaat vergezeld van een kopie van het energieadvies,
      indien [artikel 4.7.4, derde lid][ref1], van toepassing is en van de overeenkomst, bedoeld in
      [artikel 4.7.7, onderdeel f][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.7.4
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel4.7.7
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.7.9
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 4.7.4
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 4.7.7
        hoofdstuk: '4'
  - number: 4.7.10
    text: |-
      De subsidie, bedoeld in [artikel 4.7.2][ref1], bevat mogelijk staatssteun en wordt gerechtvaardigd door de algemene
      de-minimisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.7.2
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.7.10
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 4.7.2
        hoofdstuk: '4'
  - number: 4.7.11
    text: |-
      Onze Minister van Economische Zaken zendt binnen 5 jaar na de inwerkingtreding van deze titel aan de Tweede Kamer
      een verslag over de doeltreffendheid en de effecten van deze titel in de praktijk.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.7.11
  - number: 4.7.12
    text: |-
      Deze titel en bijlage 4.7.1 vervallen met ingang van 1 juli 2020, met dien verstande dat deze van toepassing
      blijven op subsidies die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4.7.12
  - number: 4a.2.1
    text: |-
      In deze titel wordt verstaan onder niet-vitale onderneming: onderneming die geen product of dienst aanbiedt waarvan
      de beschikbaarheid en de betrouwbaarheid van vitaal belang zijn voor de Nederlandse samenleving.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4a.2.1
  - number: 4a.2.2
    text: |-
      1 De minister verleent op aanvraag subsidie voor de uitvoering van een cyberweerbaarheidsplan aan:

      a. een rechtspersoon die de cyberweerbaarheid van niet-vitale ondernemingen, behartigt, of

      b. een deelnemer aan een samenwerkingsverband dat de cyberweerbaarheid van niet-vitale ondernemingen behartigt.

      2 Het cyberweerbaarheidsplan:

      a. strekt tot versterking van de cyberweerbaarheid van niet-vitale ondernemingen in Nederland;

      b. wordt uitgevoerd door, of in samenwerking met, ten minste twee niet in een groep verbonden niet-vitale
      ondernemingen;

      c. is gebaseerd op een integrale visie ten aanzien van de ambitie om de cyberweerbaarheid van niet-vitale
      ondernemingen duurzaam te versterken; en

      d. heeft een looptijd van ten minste één en ten hoogste drie jaar.

      3 Het cyberweerbaarheidsplan bestaat uit een samenhangend geheel van ten minste twee van de volgende activiteiten:

      a. het vormen en in stand houden van een netwerk voor de versterking van niet-vitale ondernemingen met
      behulp waarvan contacten worden onderhouden met relevante derden, alsmede het door derden laten uitvoeren van
      netwerkactiviteiten ten behoeve van niet-vitale ondernemingen;

      b. het stimuleren van bewustwording van cyberweerbaarheid bij niet-vitale ondernemingen;

      c. het geven van inzicht in digitale kwetsbaarheden van niet-vitale ondernemingen;

      d. het verrichten van diensten voor niet-vitale ondernemingen om de cyberweerbaarheid van de desbetreffende
      ondernemingen te versterken;

      e. het anderszins versterken van de cyberweerbaarheid van niet-vitale ondernemingen.

      4 Een samenwerkingsverband bevat maximaal acht deelnemers en de penvoerder is een ondernemer.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4a.2.2
  - number: 4a.2.3
    text: De subsidie bedraagt 50% van de subsidiabele kosten, doch ten hoogste € 200.000 per cyberweerbaarheidsplan.
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4a.2.3
  - number: 4a.2.4
    text: |-
      1 In afwijking van [artikel 11 van het besluit][ref1] worden de kosten voor activiteiten als bedoeld in
      [artikel 4a.2.2, derde lid][ref2], berekend overeenkomstig [artikel 14 van het besluit][ref3].

      2 Voor de toepassing van deze titel bedraagt het vaste uurtarief, bedoeld in [artikel 14 van het besluit][ref4],
      € 80.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel4a.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0024796#Artikel14
    url: https://wetten.overheid.nl/BWBR0035474/2019-01-01#Artikel4a.2.4
