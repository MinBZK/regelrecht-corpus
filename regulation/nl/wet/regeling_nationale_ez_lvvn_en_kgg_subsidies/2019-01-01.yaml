  - number: 3.5.2
    text: |-
      1 Op een IPC-penvoerder en een IPC-verband zijn de [artikelen 20][ref1], [29][ref2], [39, tweede lid][ref3], en
      [51 van het besluit][ref4] van overeenkomstige toepassing.

      2 Een IPC-penvoerder is een rechtspersoon zonder winstoogmerk met volledige rechtsbevoegdheid, niet zijnde een
      rechtspersoon die krachtens publiekrecht is ingesteld, die volgens haar statuten tot doel heeft de behartiging van
      belangen van ondernemingen en hier volgens feitelijk handelen ook aantoonbaar minimaal één jaar ervaring mee heeft.

      3 Een IPC-verband bestaat, naast de IPC-penvoerder, uit ten minste tien en ten hoogste twintig niet met een andere
      IPC-deelnemer of de IPC-penvoerder in een groep verbonden MKB-ondernemers.

      4 Indien er betrokkenheid bestaat tussen IPC-penvoerder en een of meer IPC-deelnemers, neemt het IPC-verband
      maatregelen om belangenverstrengeling te voorkomen.


