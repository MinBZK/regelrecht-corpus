        artikel: 4a.2.2
        hoofdstuk: 4a
  - number: 4a.2.12
    text: |-
      De subsidie, bedoeld in [artikel 4a.2.2][ref1], bevat staatssteun en wordt gerechtvaardigd door de algemene de-
