      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.21.6
    text: |-
      De Minister besluit afwijzend op een aanvraag, indien:

      a. de kwaliteit van het projectplan onvoldoende is;

      b. het projectplan onvoldoende inzicht geeft in de toepassingsmogelijkheden van de projectresultaten;

      c. het project naar verwachting niet leidt tot een voldoende mate van vernieuwing;

      d. het project naar verwachting onvoldoende bijdraagt aan het doel, genoemd in [artikel 3.21.2][ref1];

      e. de aanvrager bij de aanvraag niet heeft ingestemd met het verlenen van medewerking aan een evaluatie van de
      effecten van deze titel.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.21.2
