        artikel: '10'
  - number: 2.13.5
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.13.5
  - number: 2.13.6
    text: |-
      Een aanvraag voor subsidie bevat ten minste:

      a. gegevens over de subsidieaanvrager, waaronder de naam van de aanvrager, de naam van de rechtspersoon of publieke
      instelling, het ubn-nummer, het post- en bezoekadres en het rekeningnummer van de onderneming;

      b. een bewijs waarmee wordt aangetoond dat de toediening van de betreffende vaccindosis is uitgevoerd;

      c. een bewijs waarmee wordt aangetoond dat het pluimvee, waaraan de vaccindoses zijn toegediend, staat
      geregistreerd in een op grond van [artikel 38hh van Regeling identificatie en registratie dieren][ref1] aangewezen
      elektronisch portaal;

      d. gegevens over het aantal gevaccineerde dieren, het aantal vaccindoses en de toedieningsronde.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38hh
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.13.6
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38hh
