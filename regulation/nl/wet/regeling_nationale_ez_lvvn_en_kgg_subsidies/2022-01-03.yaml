        artikel: '252'
  - number: B2.15.1:5
    text: |-
      1 Indien de Begunstigde één of meer bepalingen in artikel 3 van deze overeenkomst niet nakomt, kan de Staat de
      overeenkomst geheel of gedeeltelijk ontbinden dan wel nakoming vorderen. De Staat gaat niet over tot ontbinding
      voordat hij de Begunstigde schriftelijk heeft aangemaand om binnen een redelijke termijn alsnog aan zijn
      verplichtingen te voldoen en nakoming binnen deze termijn uitblijft.

      2 Als de Staat de overeenkomst ontbindt naar aanleiding van niet-nakoming door de Begunstigde van één of
      meer bepalingen van artikel 3 van deze overeenkomst, is de Begunstigde – onverminderd het recht van de Staat
      om wettelijke ontbindingsschade te vorderen – een direct opeisbare boete verschuldigd van ten hoogste het
      subsidiebedrag als bedoeld in [artikel 2.15.3, tweede lid][ref1], van de Regeling nationale EZK- en LNV-subsidies,
      subsidiemodule Versneld natuurherstel, voor het Terrein bedoeld in artikel 2, vermeerderd met wettelijke rente.

      3 Als de Staat nakoming van de overeenkomst vordert, is de Begunstigde verplicht om de niet-nakoming van één of
      meer der bepalingen van artikel 3 van deze overeenkomst op eerste aanzegging te staken en gestaakt te houden en
      het Terrein in de staat te herstellen waarin het verkeerde vóór de niet-nakoming van één of meer der bepalingen van
      artikel 3 van deze overeenkomst, zulks op straffe van een onmiddellijk opeisbare boete ten belope van ten hoogste
      € 500,– vermenigvuldigd met het aantal hectares, bedoeld in artikel 2 voor iedere week dat de Begunstigde één of
      meer der bepalingen van artikel 3 van deze overeenkomst niet naleeft.


