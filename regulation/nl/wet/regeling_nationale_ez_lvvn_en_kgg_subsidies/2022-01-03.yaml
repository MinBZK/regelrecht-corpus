  - number: 4.2.65
    text: |-
      1 De minister verstrekt op aanvraag een subsidie voor het uitvoeren van een DEI+-project aan:

      a. een ondernemer die zelfstandig een DEI+-project zal uitvoeren;

      b. een deelnemer in een samenwerkingsverband.

      2 Een samenwerkingsverband dat een DEI+-project uitvoert, bevat ten minste één onderneming.

      3 In aanvulling op [artikel 3, eerste lid, van het besluit][ref1] kan ook subsidie worden verstrekt aan:

      a. een ondernemer die zelfstandig een DEI+-project zal uitvoeren;

      b. een deelnemer in een samenwerkingsverband;

      die gevestigd is in het openbaar lichaam Bonaire, Sint Eustatius of Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel3
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.65
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '3'
  - number: 4.2.66
    text: |-
      1 De subsidie bedraagt voor een DEI+-project:

      a. voor een DEI+-demonstratieproject:

      1°. 30% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat energie-efficiëntie
      maatregelen betreft en waarbij de subsidiabele kosten worden berekend in overeenstemming met artikel 38, derde lid,
      van de algemene groepsvrijstellingsverordening;

      2°. 45% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat maatregelen betreft
      ter bevordering van energie uit hernieuwbare energiebronnen en waarbij de subsidiabele kosten worden berekend in
      overeenstemming met artikel 41, zesde lid, onderdeel a of b, van de algemene groepsvrijstellingsverordening;

      3°. 30% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat maatregelen betreft
      ter bevordering van energie uit hernieuwbare energiebronnen en waarbij de subsidiabele kosten worden berekend in
      overeenstemming met artikel 41, zesde lid, onderdeel c, van de algemene groepsvrijstellingsverordening;

      4°. 50% van de subsidiabele kosten voor een project ten behoeve van een lokale infrastructuurvoorziening als
      bedoeld in artikel 56 van de algemene groepsvrijstellingsverordening, maar niet meer dan het verschil tussen de
      subsidiabele kosten en de exploitatiewinst van de investering;

      5°. 40% van de subsidiabele kosten, voor zover deze betrekking hebben op een investering als bedoeld in artikel
      36, tweede lid, van de algemene groepsvrijstellingsverordening, waarbij de subsidiabele kosten worden berekend in
      overeenstemming met dat artikel;

      6°. 35% van de subsidiabele kosten, voor zover deze betrekking hebben op een investering in recycling en hergebruik
      van afval als bedoeld in artikel 47 van de algemene groepsvrijstellingsverordening, waarbij de subsidiabele kosten
      worden berekend in overeenstemming met dat artikel;

      7°. 50% van de subsidiabele kosten voor een project ten behoeve van een distributienetwerk als bedoeld in
      artikel 46, vijfde lid, van de algemene groepsvrijstellingsverordening, maar niet meer dan het verschil tussen de
      subsidiabele kosten en de exploitatiewinst van de investering.

      b. 25% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling, waarbij
      de subsidiabele kosten worden berekend in overeenstemming met artikel 25, derde lid, van de algemene
      groepsvrijstellingsverordening.

      c. 80% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling onafhankelijk
      uitgevoerd door onderzoeksorganisaties en in de boekhouding van deze organisaties opgenomen als niet-economische
      activiteiten.

      2 De in het eerste lid genoemde percentages worden met 20 procentpunten verhoogd, indien de aanvrager een kleine
      onderneming is en de subsidiabele kosten worden gemaakt en betaald door de kleine ondernemer.

      3 De in het eerste lid genoemde percentages worden met 10 procentpunten verhoogd, indien de aanvrager een
      middelgrote onderneming is en de subsidiabele kosten worden gemaakt en betaald door de middelgrote ondernemer.

      4 De subsidie bedraagt maximaal € 15.000.000 per DEI+-project.

      5 [Artikel 4.2.4][ref1] is van overeenkomstige toepassing op DEI+-demonstratieprojecten.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.4
