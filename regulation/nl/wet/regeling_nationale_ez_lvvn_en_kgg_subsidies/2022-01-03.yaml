  - number: 3.6.8
    text: |-
      1 De minister kent aan een R&D-mobiliteitsproject een hoger aantal punten toe naarmate:

      a. het project meer bijdraagt aan de doelen, bedoeld in [artikel 3.6.2, eerste lid][ref1], en de thema’s, opgenomen
      in [bijlage 3.6][ref2];

      b. de kwaliteit van het project beter is, blijkend uit de uitwerking van aanpak en methodiek, de omgang met
      risico’s, de uitvoerbaarheid en de mate waarin de beschikbare middelen effectiever en efficiënter worden ingezet;

      c. het project vernieuwender is ten opzichte van de internationale stand van onderzoek of techniek, de Nederlandse
      kennis- en innovatiepositie meer versterkt en, voor zover van toepassing, cross-sectorale samenwerking stimuleert;

      d. de impact op het betrokken ecosysteem voor onderzoek en innovatie groter is, blijkend uit:

      1°. de kwaliteit van het samenwerkingsverband, waaronder begrepen de samenstelling van de projectorganisatie en de
      mate van deelname van kleine of middelgrote ondernemingen aan het samenwerkingsverband;

      2°. een brede betrokkenheid van ondernemingen, onderzoeksorganisaties en mogelijke andere verschillende soorten
      partijen uit de hele keten van de desbetreffende sector of aanverwante sectoren bij het project;

      e. de impact van het project op de markt groter is, blijkend uit ten minste de toepassingsmogelijkheden en
      slaagkans van de met het project te ontwikkelen innovatie of innovaties op de Nederlandse en internationale markt,
      de ontwikkeling van omzet en arbeidsplaatsen binnen de mobiliteitssectoren en de snelheid waarmee impact kan worden
      gerealiseerd op het gebied van duurzaamheid en digitalisering.

      2 De minister kent per onderdeel van het eerste lid ten minste één en ten hoogste tien punten toe.

      3 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.6.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.6.8
    references:
