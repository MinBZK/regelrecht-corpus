  - number: 2.5.5
    text: |-
      1 De minister verdeelt het subsidieplafond door vaststelling van een maximum subsidiebedrag per financier die zich
      bij de minister heeft aangemeld.

      2 De minister stelt uiterlijk op 1 februari van elk kalenderjaar ambtshalve het maximum subsidiebedrag per
      financier vast waarbij hij onderscheid maakt tussen:

      a. landbouwborgstellingskredieten die al dan niet betrekking hebben op landbouwinnovatie, aanvullende investeringen
      of omschakeling;

      b. landbouwborgstellingskredieten als bedoeld in artikel 6 van het model borgstellingsovereenkomst, zoals opgenomen
      in [bijlage 2.5.1][ref1].

      3 De minister verdeelt het subsidieplafond voor de banken, bedoeld in het eerste lid, op volgorde van binnenkomst
      van de verleningen, bedoeld in artikel 8, tweede lid, van het model borgstellingsovereenkomst, zoals opgenomen
      in [bijlage 2.5.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035474
      [ref2]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.5.5
    references:
      - id: ref1
        bwb_id: BWBR0035474
      - id: ref2
        bwb_id: BWBR0035474
  - number: 2.5.6
    text: |-
      1 Er wordt borg gestaan voor:

      a. 70 procent van het kredietbedrag voor zover het krediet niet strekt tot financiering van aanvullende
      investeringen;

      b. 90 procent van het kredietbedrag voor zover het krediet strekt tot financiering van aanvullende investeringen.

      2 Onverminderd het eerste lid, bedraagt het krediet waarvoor wordt borg gestaan:

      a. ten hoogste € 1.200.000 of

      b. ten hoogste € 2.500.000 indien het krediet strekt tot financiering van:

      1°. nieuwe investeringen die voor meer dan 50% worden gedaan voor de bouw of verbetering van een stal voor zover
      uit het investeringsplan behorend bij de kredietovereenkomst blijkt dat de stal voldoet aan de eisen van het
      certificatieschema Maatlat Duurzame Veehouderij hetgeen blijkt uit een voorlopig certificaat dat is afgegeven door
      een hiervoor door de Raad voor Accreditatie geaccrediteerde organisatie;

      2°. nieuwe investeringen die voor meer dan 50% worden gedaan voor een kas die bestemd is voor het bedrijfsmatig
      telen van gewassen voor zover uit het investeringsplan behorend bij de kredietovereenkomst blijkt dat die kas
      voldoet aan de eisen van het certificatieschema Groen Label Kas, hetgeen blijkt uit een voorlopig certificaat dat
      is afgegeven door een hiervoor door de Raad voor Accreditatie geaccrediteerde organisatie;

      3°. nieuwe investeringen die voor meer dan 50% worden gedaan voor landbouwinnovaties tenzij reeds vijfmaal een
      landbouwborgstellingskrediet voor een soortgelijke landbouwinnovatie is verleend;

      4°. nieuwe investeringen die voor meer dan 50% worden gedaan voor biologische landbouw, alsmede de daarbij
      behorende omschakeling naar biologische landbouw of omschakeling naar duurzame landbouwbedrijfsvoering;

      5°. aanvullende investeringen.

      3 Bij toepassing van het tweede lid, onderdeel b, onder 1°, wordt in de kredietovereenkomst opgenomen dat de MKB-
      landbouwondernemer na het verstrekken van het landbouwborgstellingskrediet een definitief certificaat verkrijgt
      volgens de dan vigerende Maatlat Duurzame Veehouderij.

      4 Bij toepassing van het tweede lid, onderdeel b, onder 2°, wordt in de kredietovereenkomst opgenomen dat de MKB-
      landbouwondernemer na het verstrekken van het landbouwborgstellingskrediet een definitief certificaat verkrijgt
      volgens het dan vigerende certificeringsschema Groen Label Kas.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.5.6
