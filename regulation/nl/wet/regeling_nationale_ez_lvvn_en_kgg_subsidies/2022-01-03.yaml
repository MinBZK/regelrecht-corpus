  - number: 2.2.12
    text: |-
      Voor de onderzoeks- en ontwikkelingsfase komen uitsluitend voor subsidie in aanmerking de kosten, bedoeld in
      artikel 25, derde lid, van de algemene groepsvrijstellingsverordening, voor zover deze betrekking hebben op
      industrieel onderzoek of experimentele ontwikkeling.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.2.12
  - number: 2.2.13
    text: |-
      1 Onverminderd [artikel 2.2.8][ref1] bevat een aanvraag voor subsidie ten minste de volgende informatie over de
      onderzoeks- en ontwikkelingsfase:

      a. gegevens over de grootte van het bedrijf van de aanvrager, indien de aanvrager aanspraak wil maken
      op een verhoogd percentage aan subsidie voor een kleine of middelgrote onderneming als bedoeld in
      [artikel 2.2.11, tweede lid][ref2];

      b. gegevens over de wijze waarop de projectresultaten ruim worden verspreid, indien de aanvrager aanspraak wil
      maken op een verhoogd percentage aan subsidie voor de ruime verspreiding van de projectresultaten, bedoeld in
      [artikel 2.2.11, derde lid, onderdeel b][ref3].

      2 Indien de aanvrager aanspraak wil maken op een verhoogd percentage aan subsidie voor de ruime verspreiding van
      de projectresultaten, bedoeld in [artikel 2.2.11, derde lid][ref4], verstrekt de subsidieontvanger gedurende de
      looptijd van het innovatieproject jaarlijks een voortgangsrapportage waaruit blijkt op welke wijze de openbare
      ruime verspreiding van de projectresultaten heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.8
