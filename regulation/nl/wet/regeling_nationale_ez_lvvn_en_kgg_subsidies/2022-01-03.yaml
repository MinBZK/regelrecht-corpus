  - number: 2.4.42
    text: |-
      1 Een bedrijfsplanvoucher heeft een waarde van ten hoogste € 6.000,– en wordt door de minister op aanvraag
      verstrekt aan een landbouwonderneming voor het verkrijgen van een bedrijfsplan.

      2 De landbouwonderneming vermeldt bij de aanvraag een erkende bedrijfsadviseur naar keuze, geregistreerd
      in tenminste een van de volgende aandachtsgebieden in het Bedrijfsadviseringssysteem: E3 bedrijfsopvolging,
      (bedrijfsovername & bedrijfsplannen) of E4 verdienvermogen.

      3 De landbouwonderneming dient een de-minimisverklaring in als bedoeld in Verordening (EU) nr. 1408/2013 van de
      Commissie van 18 december 2013 inzake de toepassing van de artikelen 107 en 108 van het Verdrag betreffende de
      werking van de Europese Unie op de-minimissteun in de landbouwsector (PbEU 2013, L 352).
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.42
  - number: 2.4.43
    text: |-
      De minister bepaalt op volgorde van binnenkomst aan welke landbouwondernemingen, binnen het subsidieplafond voor
      bedrijfsplanvouchers, vouchers worden verstrekt, uitgaande van de waarde per voucher.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.43
  - number: 2.4.44
    text: |-
      De landbouwonderneming draagt de door de minister verstrekte voucher over aan de in de aanvraag opgenomen erkende
      bedrijfsadviseur.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.44
  - number: 2.4.45
    text: |-
      Subsidie wordt verstrekt aan een erkende bedrijfsadviseur die ten behoeve van een landbouwonderneming een
      bedrijfsplan heeft opgesteld met daarin minimaal vijf onderwerpen, genoemd in [2.4.49., onderdeel b][ref1], waarop
      het bedrijfsplan gericht zal zijn en in verband daarmee een geldige voucher overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.49
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.45
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.4.49
        hoofdstuk: '2'
        paragraaf: 2.4.9
  - number: 2.4.46
    text: De subsidie bedraagt ten hoogste 80% van de subsidiabele kosten en niet meer dan € 6.000,– per voucher.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.46
  - number: 2.4.47
    text: |-
      Voor subsidie voor het opstellen van een bedrijfsplan als bedoeld in [artikel 2.4.42, eerste lid][ref1], komen
      niet in aanmerking kosten die de erkende bedrijfsadviseur maakt voor de inhuur van personen die organisatorisch of
      financieel niet onafhankelijk zijn van de landbouwonderneming waaraan het advies is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.42
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.47
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.4.42
        hoofdstuk: '2'
        paragraaf: 2.4.8
  - number: 2.4.48
    text: |-
      1 Een aanvraag voor subsidie wordt ingediend na afloop van het opstellen van een bedrijfsplan als bedoeld in
      [artikel 2.4.42, eerste lid][ref1], door een erkende bedrijfsadviseur.

      2 De aanvraag moet binnen een jaar zijn ontvangen na de dagtekening van een aan de landbouwonderneming verstrekte
      voucher. Op een voor het einde van de termijn daartoe ingediend verzoek kan de minister besluiten deze termijn
      eenmalig te verlengen met ten hoogste zes maanden.

      3 Indien de aanvraag niet door de minister is ontvangen binnen de termijn, bedoeld in het tweede lid, vervalt de
      voucher van rechtswege.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.42
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.48
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.4.42
        hoofdstuk: '2'
        paragraaf: 2.4.8
  - number: 2.4.49
    text: |-
      De minister beslist afwijzend op een aanvraag voor subsidie voor het opstellen van een bedrijfsplan indien:

      a. het opstellen van een bedrijfsplan in groepsverband heeft plaatsgevonden aan meer dan één landbouwonderneming;

      b. het niet ingaat op minimaal vijf van de volgende onderwerpen, waarvan emissiereductie stikstof één van de
      onderwerpen moet zijn:

      1°. emissiereductie stikstof;

      2°. reductie gebruik gewasbeschermingsmiddelen;

      3°. emissiereductie broeikasgassen;

      4°. emissiereductie nitraat;

      5°. vergroten biodiversiteit;

      6°. versterken duurzaam bodembeheer;

      7°. verhogen aandeel circulair veevoergebruik;

      8°. verbeteren dierenwelzijn/diergezondheid.

      c. het bedrijfsplan geen uitgewerkte beschrijving van de onderdelen 1 tot en met 5 bevat met betrekking tot:

      1°. de aard en omvang van het huidige bedrijf inclusief SWOT-analyse;

      2°. de beoogde en onderbouwde vermarkting van de meerwaarde van de omschakeling (producten / diensten, markten,
      doelgroepen, promotie, ketenpartners, verdienmodel);

      3°. welke maatregelen of investeringen er door het bedrijf per onderwerp worden voorgesteld;

      4°. de maatregelen en investeringen, en de uitwerking daarvan, in een reële en zo mogelijk sluitende begroting voor
      de exploitatie, investeringen, financiering en liquiditeit;

      5°. de (juridische) haalbaarheid van het initiatief en indien er belemmeringen zijn om het plan te realiseren, hoe
      er hiervoor ondersteuning of oplossingsrichtingen kunnen worden geboden.

      d. de erkende bedrijfsadviseur financieel niet onafhankelijk is van de aanvrager;

      e. de erkende bedrijfsadviseur niet deskundig of onvoldoende betrouwbaar is;

      f. de agrarische onderneming al in de afgelopen 3 kalenderjaren van een bedrijfsplanvoucher gebruik heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.49
  - number: 2.4.50
    text: |-
      De subsidie, bedoeld in [artikel 2.4.42][ref1], bevat staatssteun en wordt gerechtvaardigd door overlegging van
      een de-minimisverklaring als bedoeld in Verordening (EU) nr. 1408/2013 van de Commissie van 18 december 2013
      inzake de toepassing van de artikelen 107 en 108 van het Verdrag betreffende de werking van de Europese Unie op
      de-minimissteun in de landbouwsector (PbEU 2013, L 352) waaruit blijkt dat het totale bedrag van de-minimissteun
      dat wordt verleend niet hoger is dan € 20.000,– gerekend over het huidige belastingjaar en de twee voorgaande
      belastingjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.42
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.50
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.4.42
        hoofdstuk: '2'
        paragraaf: 2.4.8
  - number: 2.5.1
    text: |-
      1 In deze titel wordt verstaan onder:

        - *aanvullende investering:* nieuwe investering binnen drie jaar na de start van een landbouwonderneming door een
      starter of de overname van een landbouwonderneming door een overnemer;
        - *biologische landbouw:* biologische productie in de zin van [Verordening (EG) 834/2007](32007R0834) van de Raad
      van 28 juni 2007 inzake de biologische productie van landbouwproducten en de etikettering van biologische producten
      en intrekking van [Verordening (EEG) 2092/91](31991R2092) (PbEU 2007, L 189);
        - *duurzame landbouwbedrijfsvoering:* bedrijfsvoering van een landbouwonderneming op basis van een bedrijfsplan
      dat gericht is op verduurzaming, zoals: a. emissiereductie van stikstof; b. reductie van het gebruik van
      gewasbeschermingsmiddelen; c. emissiereductie van broeikasgassen; d. emissiereductie van nitraat; e. vergroten
      van biodiversiteit; f. versterken van duurzaam bodembeheer; g. circulair veevoergebruik; of h. verbeteren van
      dierenwelzijn of diergezondheid;
        - *landbouwinnovatie:* product, productieproces of concept bestemd voor toepassing in de primaire landbouw dat een
      vernieuwing en een verduurzaming inhoudt met als oogmerk het onderscheidend positioneren van een landbouwproduct in
      de markt;
        - *MKB-landbouwondernemer:* MKB-ondernemer die een landbouwonderneming in stand houdt;
        - *MKB-visserij- of aquacultuurondernemer:* MKB-ondernemer die een visserij- of aquacultuuronderneming in stand
      houdt;
        - *omschakeling:* beperkt exploitatie- en liquiditeitstekort voor een specifiek bepaalde periode in een
      liquiditeitsbegroting van een MKB-landbouwondernemer als gevolg van het omschakelen naar: a. biologische landbouw;
      b. duurzame landbouwbedrijfsvoering;
        - *overnemer:* natuurlijke persoon of rechtspersoon die voor het eerst voor eigen rekening en risico als MKB-
      ondernemer een landbouwonderneming of visserij- of aquacultuuronderneming in stand gaat houden door van een
      bestaande landbouwonderneming of visserij- of aquacultuuronderneming: a. zijnde een eenmanszaak, een maatschap of
      vennootschap onder firma de meerderheidswaarde van de activa in eigendom, pacht of erfpacht te verwerven; b. zijnde
      een vennootschap met een in aandelen verdeeld kapitaal: 1°. de meerderheid van het geplaatste kapitaal van die
      vennootschap direct of indirect te verwerven, en 2°. de overwegende zeggenschap van die vennootschap te verkrijgen
      zonder op een eerder moment daarvan de enige of overwegende zeggenschap gehad te hebben;
        - *starter:* MKB-landbouwondernemer of MKB-visserij- of aquacultuurondernemer zijnde: a. een natuurlijke persoon
      die niet langer dan drie jaar een landbouwonderneming of visserij- of aquacultuuronderneming in stand houdt; b. een
      vennootschap met een in aandelen verdeeld kapitaal, waarvan de bestuurder een natuurlijke persoon is die ten tijde
      van het sluiten van de kredietovereenkomst direct of indirect de meerderheid van het geplaatst en gestort kapitaal
      houdt en deze meerderheid niet langer dan drie jaar houdt;
        - *visserij- of aquacultuuronderneming:* onderneming die actief is in de visserij- of aquacultuursector zijnde alle
      activiteiten voor de productie, verwerking en afzet van visserij- of aquacultuurproducten;
        - *visserij- of aquacultuurproduct:* product als bedoeld in bijlage I bij Verordening (EU) nr. 1379/2013 van
      het Europees Parlement en de Raad van 11 december 2013 houdende een gemeenschappelijke marktordening voor
      visserijproducten en aquacultuurproducten, tot wijziging van [Verordeningen (EG) nr. 1184/2006](32006R1184) en
      [(EG) nr. 1224/2009](32009R1224) van de Raad en tot intrekking van [Verordening (EG) nr. 104/2000](32000R0104) van
      de Raad (PbEU 2013, L 354).

      2 Voor de toepassing van deze titel kan de minister een instelling aanwijzen als financier.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.5.1
  - number: 2.5.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een financier voor het sluiten van kredietovereenkomsten
      met MKB-landbouwondernemers die betrekking hebben op landbouwborgstellingskredieten of met MKB-visserij- of
      aquacultuurondernemers die betrekking hebben op visserij- en aquacultuurborgstellingskredieten.

      2 De subsidie wordt verstrekt in de vorm van een borgstelling voor de terugbetaling van een krediet dat
      de financier op grond van een kredietovereenkomst aan een MKB-landbouwondernemer of MKB-visserij- of
      aquacultuurondernemer zal verstrekken voor de duur van de kredietovereenkomst.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.5.2
  - number: 2.5.3
    text: |-
      1 Voor subsidie komt niet in aanmerking een financier die een kredietovereenkomst sluit met een MKB-
      landbouwondernemer of MKB-visserij- of aquacultuurondernemer:

      a. die over voldoende financiële middelen beschikt om zijn landbouwonderneming of visserij- of
      aquacultuuronderneming op economisch verantwoorde wijze te drijven;

      b. die een substantieel deel van de activiteiten van de landbouwonderneming niet in Nederland uitvoert of die meer
      dan de helft van de activiteiten van de visserij- of aquacultuuronderneming niet in Nederland uitvoert; of

      c. die een landbouwonderneming of visserij- of aquacultuuronderneming in stand houdt waarvan de laatste jaaromzet
      voor 50 procent of meer is verkregen, of, indien de landbouwonderneming of visserij- of aquacultuuronderneming
      nog geen heel jaar in stand is gehouden, waarvan de omzet naar verwachting voor 50 procent of meer zal worden
      verkregen, uit:

      1°. de uitoefening van het bank-, verzekerings- of beleggingsbedrijf, of het financieren van een of meer andere
      ondernemingen, of

      2°. het verwerven, vervreemden, beheren of exploiteren van onroerende zaken of het ontwikkelen van onroerende
      zaakprojecten.

      2 Geen subsidie wordt verstrekt voor activiteiten die direct verband houden met:

      a. de uitvoer naar andere lidstaten van de Europese Unie of derde landen;

      b. andere lopende uitgaven direct verband houdend met activiteiten op het gebied van uitvoer;

      c. het oprichten en exploiteren van een distributienet ten behoeve van uitvoer, of

      d. investeringen die niet in overeenstemming zijn met de wetgeving van de Europese Unie en met de nationale
      milieubeschermingswetgeving.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.5.3
  - number: 2.5.4
    text: |-
      1 Het tarief van de provisie, bedoeld in [artikel 32, derde lid, van het besluit][ref1] bedraagt eenmalig 3
      procent.

      2 In afwijking van het eerste lid bedraagt de provisie eenmalig 1 procent indien de overeenkomst van borgtocht een
      landbouwborgstellingskrediet of visserij- of aquacultuurborgstellingskrediet betreft voor een starter of overnemer.

      3 In afwijking van het eerste lid bedraagt de provisie eenmalig 1,5 procent indien de overeenkomst van borgtocht
      een landbouwborgstellingskrediet of visserij- of aquacultuurborgstellingskrediet betreft als bedoeld in artikel 6
      van het model borgstellingsovereenkomst, zoals opgenomen in [bijlage 2.5.1][ref2], met een looptijd van ten hoogste
      twee jaar.

      4 In afwijking van het eerste lid bedraagt de provisie eenmalig 0,5 procent indien de overeenkomst van borgtocht
      een landbouwborgstellingskrediet of visserij- of aquacultuurborgstellingskrediet betreft als bedoeld in artikel 6
      van het model borgstellingsovereenkomst, zoals opgenomen in [bijlage 2.5.1][ref3], voor een starter of overnemer,
      met een looptijd van ten hoogste twee jaar.

      5 In afwijking van het eerste lid bedraagt de provisie eenmalig 2,25 procent indien de overeenkomst van borgtocht
      een landbouwborgstellingskrediet of visserij- of aquacultuurborgstellingskrediet betreft als bedoeld in artikel 6
      van het model borgstellingsovereenkomst, zoals opgenomen in [bijlage 2.5.1][ref4], met een looptijd van meer dan
      twee jaar, maar niet langer dan vier jaar.

      6 In afwijking van het eerste lid bedraagt de provisie eenmalig 0,75 procent indien de overeenkomst van borgtocht
      een landbouwborgstellingskrediet of visserij- of aquacultuurborgstellingskrediet betreft als bedoeld in artikel 6
      van het model borgstellingsovereenkomst, zoals opgenomen in [bijlage 2.5.1][ref5], voor een starter of overnemer,
      met een looptijd van meer dan twee jaar, maar niet langer dan vier jaar.


