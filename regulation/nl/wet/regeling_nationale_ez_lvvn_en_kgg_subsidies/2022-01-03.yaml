        artikel: 4.7.4
        hoofdstuk: '4'
  - number: 4.7.3
    text: |-
      1 De Minister verdeelt het beschikbare bedrag op volgorde van binnenkomst van de aanvragen.

      2 De subsidie voor het advies, bedoeld in [artikel 4.7.2, eerste lid, onder a][ref1], bedraagt 80% van de gemaakte
      kosten, bedoeld in het eerste lid, met een minimumbedrag van € 400 en tot een maximumbedrag van € 750.

      3 De subsidie voor de ondersteuning, bedoeld in [artikel 4.7.2, eerste lid, onder b][ref2], bedraagt 80% van de
      gemaakte kosten, met dien verstande dat het bedrag van de subsidie of de som van de bedragen van de subsidies,
      bedoeld in artikel 4.7.2, eerste lid, niet hoger is dan € 2.500.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.7.2
