  - number: 3.24.11
    text: |-
      1 Een aanvraag voor subsidie op grond van deze titel bevat ten minste:

      a. gegevens over de aanvrager of aanvragers, waaronder het post- en bezoekadres en het rekeningnummer van de
      aanvrager of aanvragers;

      b. gegevens over de contactpersoon bij de aanvrager of aanvragers, waaronder de naam, het telefoonnummer en het
      e-mailadres;

      c. indien van toepassing: gegevens over de contactpersoon bij de penvoerder, waaronder de naam, het telefoonnummer,
      het e-mailadres en het postadres;

      d. een projectplan;

      e. een begroting en financieel plan, waaruit blijkt hoe de aanvrager of de aanvragers het deel dat de aanvrager
      of aanvragers zelf in de subsidiabele kosten bijdraagt of bijdragen, gaat of gaan financieren en, indien van
      toepassing, een intentieverklaring van de betrokken derden-financiers;

      f. een activiteitenplanning; en

      g. een samenvatting van het projectplan.

      2 Het projectplan bevat in ieder geval een beschrijving van:

      a. de doelstelling en de productiviteitsverhogende technologie of technologieën waarop de mkb-werkplaats gericht
      is;

      b. de activiteiten van de mkb-werkplaats, inclusief de planning van deze activiteiten;

      c. de wijze waarop regionale partijen, waaronder in ieder geval een regionale overheid, betrokken zijn bij de mkb-
      werkplaats;

      d. de wijze waarop de effecten en resultaten van de mkb-werkplaats worden gemonitord en geëvalueerd;

      e. het verwachte aantal te bereiken mkb-ondernemers gedurende de subsidieperiode en in het bijzonder het te
      verwachten aantal te bereiken mkb-ondernemers met een kleine onderneming;

      f. de wijze waarop de aanvrager of aanvragers ervoor zorgt draagt of zorg dragen dat studenten toegang hebben tot
      de mkb-werkplaats, de wijze waarop de mkb-werkplaats bijdraagt aan verbetering van het praktijkleren van studenten
      en de wijze waarop dit in het onderwijscurriculum tot uitdrukking komt; en

      g. de wijze waarop de aanvrager of aanvragers na de subsidieperiode zorg draagt of dragen voor continuering van de
      activiteiten waarvoor subsidie is verstrekt.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.24.11
