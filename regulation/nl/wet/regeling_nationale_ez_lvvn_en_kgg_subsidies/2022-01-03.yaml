      1 Met de uitvoering van een op grond van deze titel gesubsidieerd R&D-mobiliteitsproject wordt gestart binnen twee
      maanden na de subsidieverlening.

      2 De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is vier jaar.


