  - number: 4.2.77
    text: |-
      1 De minister kent aan een project een hoger aantal punten toe naarmate:

      a. het project meer bijdraagt aan de doelstellingen van de programmalijnen, genoemd in [bijlage 4.2.10][ref1];

      b. de slaagkans van de innovatie in de Nederlandse markt en maatschappij groter is;

      c. de kwaliteit van het project beter is, blijkend uit de uitwerking van aanpak en methodiek, de omgang met
      risico’s, de uitvoerbaarheid en de mate waarin de beschikbare middelen effectiever en efficiënter worden ingezet;

      d. de kwaliteit van het samenwerkingsverband beter is, blijkend uit de samenstelling van het samenwerkingsverband
      en de projectorganisatie;

      e. het project vernieuwender is ten opzichte van de internationale stand van onderzoek of techniek en de
      Nederlandse kennispositie meer versterkt.

      2 De minister kent per onderdeel van het eerste lid ten minste één en ten hoogste tien punten toe.

      3 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.

      4 Geen subsidie wordt verleend voor een project dat lager is gerangschikt dan het hoogst gerangschikte project in
      een programmalijn, genoemd in [bijlage 4.2.10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035474
      [ref2]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.77
