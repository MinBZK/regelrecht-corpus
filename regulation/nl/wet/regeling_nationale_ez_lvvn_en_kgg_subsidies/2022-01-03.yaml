  - number: 3.20.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een werkgever voor het faciliteren van een of meer
      omscholingstrajecten die zijn gericht op het verwerven van de benodigde competenties, kennis en ervaring door een
      of meer werknemers ten behoeve van de uitoefening van een ICT- en techniek-kansrijk beroep.

      2 Een omscholingstraject bevat een samenhangend geheel van activiteiten dat relevant is voor de adequate
      uitoefening van een ICT- en techniek-kansrijk beroep, bestaande uit:

      a. scholing via een opleiding, cursus, training, of andere vorm van kennisverwerving die door een opleider namens
      de werkgever wordt aangeboden aan de werknemer; en

      b. praktijkondersteuning via het inwerken, coachen, geven van feedback of andere vorm van ondersteuning door een
      praktijkbegeleider namens de werkgever aan de werknemer.

      3 Een subsidieaanvrager als bedoeld in het eerste lid dient per omscholingstraject een aanvraag voor subsidie in.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.20.2
  - number: 3.20.3
    text: |-
      1 De subsidie bedraagt € 3.750 per omscholingstraject.

      2 Het totale bedrag aan de-minimissteun bedraagt per subsidieontvanger ten hoogste het bedrag, bedoeld in artikel
      3, tweede lid, van de algemene de-minimisverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.20.3
  - number: 3.20.4
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.20.4
  - number: 3.20.5
    text: |-
      1 Met een op grond van deze titel gesubsidieerd omscholingstraject wordt gestart binnen drie maanden na de
      subsidieverlening.

      2 De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.20.5
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.20.6
    text: |-
      De minister beslist afwijzend op een aanvraag voor subsidie indien:

      a. de werknemer:

      1°. in een periode van minder dan twee jaar voorafgaand aan de aanvraag voor subsidie bij een school voor
      voortgezet onderwijs als bedoeld in [artikel 1 van de Wet op het voortgezet onderwijs][ref1] het eindexamen heeft
      afgelegd; of

      2°. voor 1 juli 2021 werkzaam was binnen een beroepssegment als bedoeld in [bijlage 3.20][ref2] waartoe het ICT- en
      techniek-kansrijke beroep behoort waarop het omscholingstraject betrekking heeft;

      b. niet aannemelijk is dat de subsidieaanvrager voornemens is met de werknemer een arbeidsovereenkomst te sluiten
      of heeft gesloten voor ten minste:

      1°. de looptijd van het omscholingstraject; en

      2°. een periode van zes maanden na afronding van het omscholingstraject, in het geval de werknemer het
      omscholingstraject met een voldoende resultaat afrondt;

      c. de bij het desbetreffende omscholingstraject behorende scholing niet:

      1°. wordt aangeboden door een opleider die door de Minister van Onderwijs, Cultuur en Wetenschap erkend onderwijs
      verzorgt en dat leidt tot een diploma of certificaat, dan wel verband houdt met onderdelen van een door deze
      minister vastgesteld kwalificatiedossier, vastgestelde kwalificatie of een door de Nederlands-Vlaamse Accreditatie
      Organisatie geaccrediteerde opleiding;

      2°. leidt tot een door het Nationaal Coördinatiepunt NLQF ingeschaalde kwalificatie, die is opgenomen in het NCP-
      register;

      3°. wordt gegeven door een opleidingsinstituut, een trainingsbureau of examenaanbieder die in het bezit is van het
      NRTO-keurmerk; of

      4°. leidt tot een door de overheid, branche of sector erkend certificaat.

      d. niet aannemelijk is dat de bij het desbetreffende omscholingstraject behorende praktijkondersteuning wordt
      aangeboden door een praktijkbegeleider die beschikt over de benodigde kennis en ervaring;

      e. op grond van deze titel voor hetzelfde omscholingstraject voor dezelfde werknemer, of in totaal voor ten minste
      zes omscholingstrajecten eerder subsidie is verstrekt aan de subsidieaanvrager;

      f. aan de subsidieaanvrager voor hetzelfde omscholingstraject voor dezelfde werknemer
      subsidie is verleend op grond van de [Subsidieregeling praktijkleren][ref3] of de
      __REF001___________________________________________________________________________________________________________
      ________________________________________; of

      g. de subsidiabele kosten niet ten minste:

      1°. € 1.000 zouden bedragen voor de bij het desbetreffende omscholingstraject behorende scholing;

      2°. € 1.000 zouden bedragen voor de bij het desbetreffende omscholingstraject behorende praktijkondersteuning; of

      3°. € 7.500 zouden bedragen voor het gehele omscholingstraject.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035474
      [ref3]: https://wetten.overheid.nl/BWBR0034144
      [ref4]: https://wetten.overheid.nl/BWBR0043015
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.20.6
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0035474
      - id: ref3
        bwb_id: BWBR0034144
