        hoofdstuk: '3'
  - number: 3.23.12
    text: |-
      Deze titel vervalt met ingang van 1 januari 2025, met dien verstande dat deze van toepassing blijft op subsidies
      die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.23.12
  - number: 3.24.1
    text: |-
      In deze titel wordt verstaan onder:

        - *expertbedrijf:* bedrijf dat deskundig is op het gebied van ten minste een productiviteitsverhogende technologie;
        - *mkb-werkplaats:* regionaal, open kennisnetwerk van een of meer onderwijsinstellingen, met een focus op een
      of meer productiviteitsverhogende technologieën, waarbinnen de onderwijsinstelling of de onderwijsinstellingen
      tezamen met partijen in de regio mkb-ondernemers, met name die met een kleine onderneming, helpt of helpen met
      hun digitaliseringsvraagstukken, door in ieder geval: a. het afnemen van intakes bij mkb-ondernemers ten behoeve
      van het in kaart brengen van de vragen van mkb-ondernemers en het samenbrengen van student en mkb-ondernemer voor
      het maken van een roadmap; b. studenten in te zetten die roadmaps maken voor mkb-ondernemers; en c. het geven van
      algemene voorlichting en het breed delen en verspreiden van kennis met betrekking tot digitalisering;
        - *onderwijsinstelling:* instelling als bedoeld in de [artikelen 1.3.1][ref1], [1.3.2a][ref2] of
      [1.3.3 van de Wet educatie en beroepsonderwijs][ref3] of als bedoeld in de [bijlage behorende bij de Wet op het
      hoger onderwijs en wetenschappelijk onderzoek](onbekend), onder a tot en met i;
        - *roadmap:* door een of meer studenten opgesteld advies, met praktische tips en concreet handelingsperspectief,
      aan een mkb-ondernemer met betrekking tot zijn digitaliseringsmogelijkheden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.2a
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.3
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.24.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 1.3.1
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 1.3.2a
      - id: ref3
        bwb_id: BWBR0007625
        artikel: 1.3.3
  - number: 3.24.2
    text: |-
      De minister verstrekt op aanvraag subsidie aan een onderwijsinstelling of aan een onderwijsinstelling in een
      samenwerkingsverband van onderwijsinstellingen voor het initiëren en opzetten van een mkb-werkplaats en voor het
      verrichten van de volgende activiteiten in het kader van die mkb-werkplaats:

      a. het in kaart brengen van de digitaliseringsvraagstukken van mkb-ondernemers en het samenbrengen van student en
      mkb-ondernemer voor het maken van een roadmap;

      b. algemene voorlichting en brede kennisdeling en -verspreiding op het gebied van digitalisering en brede
      verspreiding van de resultaten van de mkb-werkplaats, op niet-exclusieve en niet-discriminerende basis, middels in
      ieder geval een openbaar toegankelijk digitaal platform;

      c. het monitoren en evalueren van de effecten en resultaten van de mkb-werkplaats;

      d. het geven van openbare en brede bekendheid aan de mkb-werkplaats.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.24.2
  - number: 3.24.3
    text: De subsidie bedraagt 50 procent van de subsidiabele kosten, doch ten hoogste € 450.000 per aanvraag.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.24.3
  - number: 3.24.3a
    text: |-
      In afwijking van [artikel 3.1.1][ref1], bedraagt het uurtarief, bedoeld in de [artikelen 13, tweede lid][ref2], en
      [14 van het besluit][ref3], voor de toepassing van deze titel € 80.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel14
