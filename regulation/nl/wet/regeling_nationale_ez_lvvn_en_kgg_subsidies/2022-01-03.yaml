        bwb_id: BWBR0035474
        artikel: 2.16.3
        hoofdstuk: '2'
  - number: 2.16.11
    text: Deze titel vervalt met ingang van 1 juli 2023.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.16.11
  - number: 2.17.1
    text: |-
      In deze titel wordt verstaan onder:

        - *aanvrager:* organisatie, gemeente of gemeentelijke gezondheidsdienst met expertise op het raakvlak van natuur en
      voedseleducatie of op het raakvlak van gezondheid en voedseleducatie;
        - *groene Jong Leren Eten-makelaar:* een natuurlijk persoon met aantoonbare expertise op het raakvlak van natuur en
      voedseleducatie die in het werkplan van de aanvrager wordt genoemd;
        - *Jong Leren Eten-makelaar:* een groene of witte Jong Leren Eten-makelaar;
        - *Programma Jong Leren Eten 2022–2024:* meerjarig beleidsprogramma waarin de rijksoverheid provincies,
      onderwijsinstellingen en maatschappelijke organisaties stimuleert om samen te werken om kinderen en jongeren
      structureel meer kennis te bieden over zowel de herkomst van voedsel, als het leren maken van verstandige, gezonde,
      duurzame keuzes op het gebied van voeding;
        - *witte Jong Leren Eten-makelaar:* een natuurlijk persoon met aantoonbare expertise op het raakvlak van gezondheid
      en voedseleducatie die in het werkplan van de aanvrager wordt genoemd.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.17.1
  - number: 2.17.2
    text: |-
      1 De Minister verstrekt op aanvraag subsidie aan een aanvrager die een Jong Leren Eten-makelaar, met de benodigde
      competenties en kennis op minimaal HBO werk- en denkniveau, inzet ter uitvoering van het Programma Jong Leren Eten
      2022–2024 voor de volgende door die makelaar uit te voeren activiteiten:

      a. het verbinden van de vraag van scholen en kinderopvangcentra in de desbetreffende provincie met het aanbod aan
      educatief materiaal en activiteiten op het gebied van duurzaam en gezond voedsel;

      b. het fungeren als aanspreekpunt voor de bij het Programma Jong Leren Eten 2022–2024 betrokken partijen;

      c. het organiseren van activiteiten ten behoeve van de samenwerking tussen regionale partijen en de Jong Leren
      Eten-makelaars in die provincie.

      2 Geen subsidie wordt verstrekt voor de volgende activiteiten:

      a. het door een Jong Leren Eten-makelaar zelf optreden als aanbieder van eigen projecten;

      b. het uitvoeren van activiteiten door een Jong Leren Eten-makelaar op scholen.

      3 De benodigde competenties en kennis, bedoeld in het eerste lid, zijn:

      a. omgevingsbewustzijn en netwerken;

      b. bestuurssensitiviteit;

      c. creativiteit;

      d. plannen en organiseren;

      e. initiatiefrijk en analytisch;

      f. het hebben van visie;

      g. kennis over de invloed van gezonde voeding op gezondheid, voor zover het een witte Jong Leren Eten-makelaar
      betreft;

      h. kennis over duurzame voeding, voor zover het een groene Jong Leren Eten-makelaar betreft.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.17.2
  - number: 2.17.3
    text: |-
      De subsidie bedraagt 100 procent van de subsidiabele kosten, doch ten hoogste:

      a. € 195.000 voor de subsidiabele kosten, bedoeld in [artikel 2.17.4, eerste lid, onderdeel a][ref1];

      b. € 82.500 voor de subsidiabele kosten, bedoeld in [artikel 2.17.4, eerste lid, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.17.4
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.17.4
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.17.3
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.17.4
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 2.17.4
        hoofdstuk: '2'
  - number: 2.17.4
    text: |-
      1 Voor subsidie komen in aanmerking:

      a. loonkosten of de kosten van inhuur van de Jong Leren Eten-makelaar;

      b. aan derden verschuldigde kosten die direct voor de subsidiabele activiteiten, bedoeld in
      [artikel 2.17.2, eerste lid, onder a, b, of c][ref1], worden gemaakt.

      2 In afwijking van [artikel 10, tweede lid, van het besluit][ref2] zijn de kosten, bedoeld in het eerste lid,
      subsidiabel vanaf 1 januari 2022.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.17.2
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel10
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.17.4
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.17.2
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '10'
  - number: 2.17.5
    text: |-
      1 De Minister verstrekt per provincie maximaal drie subsidies, waarvan in elk geval één subsidie voor het uitvoeren
      van de subsidiabele activiteiten, bedoeld in [artikel 2.17.2, eerste lid, onder a, b, of c][ref1], door een groene
      Jong Leren Eten makelaar en één subsidie voor de uitvoering van die activiteiten door een witte Jong Leren Eten
      makelaar.

      2 De Minister wijst per provincie de subsidies toe op volgorde van rangschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.17.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.17.5
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.17.2
        hoofdstuk: '2'
  - number: 2.17.6
    text: |-
      Met de uitvoering van de op grond van deze titel gesubsidieerde activiteiten wordt gestart binnen uiterlijk een
      maand na de subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.17.6
  - number: 2.17.7
    text: |-
      De Minister beslist afwijzend op een aanvraag indien na toepassing van [artikel 2.17.8][ref1], aan de criteria,
      bedoeld in artikel 2.17.8, eerste lid, onderdelen a tot en met c, in totaal minder dan 15 punten zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.17.8
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.17.7
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.17.8
        hoofdstuk: '2'
  - number: 2.17.8
    text: |-
      1 De Minister rangschikt de aanvragen hoger naarmate:

      a. het werkplan meer bijdraagt aan de doelen van het Programma Jong Leren Eten 2022–2024;

      b. de kwaliteit van het werkplan en de begroting hoger is;

      c. de makelaar meer beschikt over een voor het Programma Jong Leren Eten 2022–2024 relevant netwerk, en de
      benodigde competenties, kennis, en ervaring.

      2 De Minister kent per onderdeel van het eerste lid ten minste één en ten hoogste tien punten toe aan een aanvraag.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.17.8
  - number: 2.17.9
    text: |-
      1 Een aanvraag wordt ingediend met gebruikmaking van een middel dat hiervoor door de Minister ter beschikking wordt
      gesteld en bevat ten minste:

      a. een werkplan voor 2022 tot en met 2024, inclusief een jaarplan voor 2022;

      b. een begroting voor 2022 tot en met 2024, inclusief een specifieke begroting voor 2022;

      c. het curriculum vitae van de Jong Leren Eten-makelaar.

      2 Het werkplan, bedoeld in het eerste lid, onderdeel a, bevat in ieder geval een beschrijving van:

      a. de geplande activiteiten voor 2022–2024 en hoe deze activiteiten bijdragen aan het realiseren van de
      doelstellingen van het Programma Jong Leren Eten 2022–2024;

      b. de activiteiten die de Jong Leren Eten-makelaar voornemens is te organiseren ten behoeve van de samenwerking
      tussen de verschillende partijen die een rol spelen bij de uitvoering van het Programma Jong Leren Eten 2022–2024
      in de provincie waarin de Jong Leren Eten-makelaar wordt ingezet en de doelstellingen van dat programma die daarmee
      worden bereikt;

      c. de kansen en mogelijke risico’s door samenwerking met de verschillende partijen, bedoeld in onderdeel b, voor
      zover zij activiteiten uitvoeren ten behoeve van kinderopvangcentra of onderwijsinstellingen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.17.9
  - number: 2.17.10
    text: |-
      1 Uiterlijk op 1 november 2022 respectievelijk 2023 worden een jaarplan en begroting voor 2023 respectievelijk
      2024 ingediend.

      2 Uiterlijk op 1 april 2023 respectievelijk 2024 wordt de jaarrapportage 2022 respectievelijk 2023 ingediend en
      uiterlijk bij de aanvraag om subsidievaststelling wordt de jaarrapportage 2024 ingediend.

      3 De subsidieontvanger waarborgt de kwaliteit en inzet van de Jong Leren Eten-makelaar.

      4 In afwijking van [artikel 50, tweede lid, onderdeel c, van het besluit][ref1], behoeft, indien de
      subsidie € 125.000 of meer bedraagt, het verzoek om subsidievaststelling niet vergezeld te gaan van een
      accountantsverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel50
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.17.10
