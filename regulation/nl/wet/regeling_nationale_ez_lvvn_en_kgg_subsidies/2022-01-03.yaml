        bwb_id: BWBR0035474
        artikel: 3.13.2
        hoofdstuk: '3'
  - number: 3.13.12a
    text: |-
      Met schriftelijke instemming van een financier zijn de wijzigingen van de artikelen 5, 8, 9, 12, 12a en 13 van
      [bijlage 3.13.1][ref1] ingevolge de Regeling van de Staatssecretaris van Economische Zaken en Klimaat en de
      Minister van Landbouw, Natuur en Voedselkwaliteit van 9 februari 2021, nr. WJZ/ 20257211, tot wijziging van de
      Regeling nationale EZK- en LNV-subsidies in verband met aanpassing van de garant- en borgstellingsmodules aan
      Verordening (EU) nr. 575/2013 van het Europees Parlement en de Raad van 26 juni 2013 betreffende prudentiële
      vereisten voor kredietinstellingen en beleggingsondernemingen en tot wijziging van Verordening (EU) nr. 648/2012
      (PbEU 2013, L 176) (Stcrt. 2021, 6766) eveneens van toepassing op een garantstellingsovereenkomst als bedoeld in
      [artikel 3.13.7][ref2], die voor de inwerkingtreding van de voornoemde regeling tot stand is gekomen tussen de
      betreffende financier en de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.13.7
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.13.12a
