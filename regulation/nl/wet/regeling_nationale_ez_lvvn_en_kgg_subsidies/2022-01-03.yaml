  - number: 4.2.77b
    text: |-
      Onverminderd [artikel 4.2.2, tweede en derde lid][ref1], verstrekt de subsidieontvanger gedurende de looptijd van
      het project jaarlijks een voortgangsrapportage die de minister kan gebruiken voor de openbare brede verspreiding
      van de niet-bedrijfsgevoelige kennis en informatie die met het project worden opgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.77b
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 4.2.2
        hoofdstuk: '4'
        paragraaf: 4.2.1
  - number: 4.2.77c
    text: |-
      De subsidie, bedoeld in [artikel 4.2.72, eerste lid][ref1], met uitzondering van de subsidie voor zover deze
      betrekking heeft op niet-economische activiteiten van onderzoeksorganisaties of overige niet-economische
      projectactiviteiten van onderzoeksorganisaties, bevat staatsteun en wordt gerechtvaardigd door:

      a. artikel 25 van de algemene groepsvrijstellingsverordening, voor zover de subsidie bestemd is voor industrieel
      onderzoek en experimentele ontwikkeling;

      b. de algemene de-minimisverordening, voor zover de subsidie bestemd is voor de overige projectactiviteiten die
      worden uitgevoerd door ondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.72
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.77c
