  - number: 3.26.1
    text: |-
      In deze titel wordt verstaan onder:

        - *ambachtsonderneming:* een onderneming die zich bezighoudt met het uitoefenen van een beroep dat past binnen de
      in [bijlage 3.26][ref1] opgenomen lijst met ambachtsberoepen, binnen de beroepssegmenten bouw, dier verzorgend,
      gebouw verzorgend, medische hulpmiddelen techniek, productie, reparatie, uiterlijke verzorging of voeding;
        - *belangenorganisatie voor ambachtsondernemingen:* a. een vereniging die de belangen behartigt van haar leden,
      bestaande uit ambachtsondernemingen; b. een vereniging die zich, eventueel namens of in samenwerking met één of
      meerdere verenigingen als bedoeld in onderdeel a, inzet voor de belangen van ambachtsondernemingen; of c. een
      stichting die zich inzet voor de belangen van ambachtsondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.26.1
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 3.26.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een belangenorganisatie voor ambachtsondernemingen voor het
      zelfstandig, of in een samenwerkingsverband van belangenorganisaties voor ambachtsondernemingen, uitvoeren van één
      of meer ambachts-ondernemerschapsprojecten om, ten behoeve van ambachtsondernemingen in Nederland, een bijdrage te
      leveren aan één of meer van de volgende doelstellingen:

      a. vergroting van de instroom van nieuwe ondernemers in ambachtsondernemingen, gericht op het door deze nieuwe
      ondernemers oprichten of overnemen van ambachtsondernemingen;

      b. verbetering van ondernemerschapsvaardigheden, waaronder ten minste begrepen de strategische en digitale
      vaardigheden, van een ondernemer die een ambachtsonderneming in stand houdt dan wel beoogt op te richten of over
      te nemen;

      c. professionalisering en innovatie van de bedrijfsprocessen, waaronder mede begrepen de digitalisering, van
      ambachtsondernemingen;

      d. verbetering van het inzicht van ambachtsondernemingen in de voor hen relevante wet- en regelgeving, waaronder
      mede begrepen het geven van voorlichting en het op andere wijze verlenen van ondersteuning bij de naleving van deze
      wet- en regelgeving.

      2 Een ambachts-ondernemerschapsproject bevat een samenhangend geheel van activiteiten, bestaande uit de
      ontwikkeling van, of het ondersteunen bij de ontwikkeling van, faciliterende diensten of producten ten behoeve
      van ambachtsondernemingen.

      3 De subsidieontvanger houdt geen onderneming in stand, die actief is in:

      a. de sector visserij en aquacultuur;

      b. de primaire productie van landbouwproducten; of

      c. de sector verwerking en afzet van landbouwproducten in de gevallen, bedoeld in artikel 1, eerste lid, onder c,
      van de algemene de-minimisverordening.

      4 Een subsidieaanvrager dient per ambachts-ondernemerschapsproject één aanvraag voor subsidie in.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.26.2
  - number: 3.26.3
    text: |-
      1 De subsidie voor de uitvoering van een ambachts-ondernemerschapsproject bedraagt 100% van de subsidiabele kosten,
      doch:

      a. minder dan € 125.000 per subsidieaanvrager die het ambachts-ondernemerschapsproject zelfstandig dan wel in een
      samenwerkingsverband uitvoert;

      b. ten hoogste € 500.000 per ambachts-ondernemerschapsproject, indien een ambachts-ondernemerschapsproject wordt
      uitgevoerd in een samenwerkingsverband.

      2 Het totale bedrag aan de-minimissteun bedraagt per subsidieontvanger maximaal het bedrag, bedoeld in artikel 3,
      tweede lid, van de algemene de-minimisverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.26.3
  - number: 3.26.4
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
