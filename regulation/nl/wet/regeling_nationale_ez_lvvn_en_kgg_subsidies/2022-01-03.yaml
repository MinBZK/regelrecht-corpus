  - number: 3.3.1
    text: |-
      In deze titel wordt verstaan onder:

        - *innovatiemakelaar:* een verstrekker van innovatieadviesdiensten;
        - *netwerkactiviteiten:* masterclasses, workshops of conferenties om kennisdeling en netwerking tussen MKB-
      ondernemers te bevorderen;
        - *TKI:* Topconsortium voor Kennis en Innovatie als bedoeld in [artikel 3.2.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.1
