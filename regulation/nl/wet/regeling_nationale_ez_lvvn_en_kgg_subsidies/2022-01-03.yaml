  - number: 4.2.69
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. de bijdrage aan de verduurzaming in uiterlijk 2030 onvoldoende is, blijkend uit de bijdrage aan CO-reductie,
      de bijdrage aan flexibilisering van het energiesysteem, of de bijdrage aan de optimale benutting van het
      energielandschap;

      b. de kwaliteit van het project onvoldoende is, blijkend uit de uitwerking van aanpak en methodiek, de omgang
      met risico's, de uitvoerbaarheid, de deelnemende partijen of de mate waarin de beschikbare middelen effectief en
      efficiënt worden ingezet;

      c. de slaagkans van de innovatie in de Nederlandse markt en maatschappij onvoldoende is, waarbij onder de
      Nederlandse markt en maatschappij ook wordt verstaan de markt en maatschappij van de openbare lichamen Bonaire,
      Sint Eustatius of Saba;

      d. er onvoldoende sprake is van vernieuwing, blijkende uit een vernieuwende technologie of een vernieuwende
      toepassing van een bestaande technologie;

      e. onvoldoende aannemelijk is dat een project dat hergebruik van CO betreft zonder subsidie niet tot stand zou
      komen, blijkend uit een beschrijving van de globale kosten en baten van het project;

      f. er eerder op grond van deze titel of [titel 3.20][ref1] een subsidie is verstrekt voor drie of meer soortgelijke
      projecten;

      g. de samenwerking tussen een ondernemer en een onderzoeksorganisatie onvoldoende evenwichtig is, blijkend uit de
      omstandigheid dat de onderzoeksorganisatie het merendeel van de kosten maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Hoofdstuk3
