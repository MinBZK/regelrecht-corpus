  - number: B2.15.1:8
    text: |-
      1 De overeenkomst en elk geschil, elke procedure of vordering voortvloeiend uit of verband houdende met de
      overeenkomst worden beheerst door en uitgelegd in overeenstemming met Nederlands recht.

      2 Alle geschillen in verband met of voortvloeiend uit deze overeenkomst zullen worden voorgelegd aan de daartoe
      bevoegde rechter in het arrondissement Den Haag.
