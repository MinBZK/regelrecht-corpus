      b. bedoeld in [artikel 2.2.16][ref3], voor zover het de emissiemetingenfase, bedoeld in [artikel 2.2.15][ref4],
      betreft;

      c. bedoeld in [artikel 2.2.22][ref5], voor zover het de resterende productieve levensduurfase, bedoeld in
      [artikel 2.2.21][ref6], betreft.


