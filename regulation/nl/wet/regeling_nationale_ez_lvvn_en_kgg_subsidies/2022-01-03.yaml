  - number: 2.2.6
    text: |-
      De minister beslist afwijzend op een aanvraag voor subsidie indien:

      a. op basis van het projectplan, bedoeld in [artikel 2.2.8, derde lid][ref1], aannemelijk is dat met de uitvoering
      van het innovatieproject:

      1°. de op grond van het [Besluit emissiearme huisvesting][ref2] veehouderij van toepassing zijnde maximale
      emissiewaarde wordt overschreden;

      2°. de reductie van broeikasgasemissies of stalemissies lager is dan de van toepassing zijnde minimale
      reductiepercentages van de emissiewaarde, bedoeld in [bijlage 2.2.1][ref3] of geen reductiepercentage voor de
      betreffende emissie is vastgesteld in bijlage 2.2.1;

      3°. niet voldaan wordt aan het op grond van het [Bouwbesluit][ref4] van toepassing zijnde niveau van
      brandveiligheid op een veehouderijlocatie;

      4°. het niveau van dierenwelzijn, waaronder ten minste ook de brandveiligheid, op een veehouderijlocatie niet zou
      verbeteren;

      5°. een investering als bedoeld in [artikel 2.2.10, onderdeel a][ref5], wordt toegepast in meer dan vier
      stalsystemen;

      6°. minder dan 40% vast voer wordt verstrekt, indien het een innovatieproject gericht op investeringen als bedoeld
      in [artikel 2.2.10, onderdeel a][ref6], ten behoeve van een vleeskalverhouderijonderneming betreft als bedoeld in
      [artikel 2.2.2, eerste lid, onderdeel d][ref7];

      7°. de leghennen of vleeskuikens dan wel grootouder- of ouderdieren hiervan niet op grondhuisvesting
      worden gehouden, indien het een innovatieproject gericht op investeringen, managementmaatregelen of een
      combinatie hiervan als bedoeld in [artikel 2.2.10][ref8], ten behoeve van een leghennenhouderijonderneming,
      vleeskuikenhouderijonderneming of vleeskuikenouderdierhouderijonderneming betreft;

      b. na toepassing van:

      1°. [artikel 2.2.7, eerste lid, onderdeel a, tweede en derde lid][ref9], minder dan 12 punten zijn toegekend,
      indien het een innovatieproject ten behoeve van een varkenshouderijonderneming, melkgeitenhouderijonderneming,
      vleeskalverhouderijonderneming, leghennenhouderijonderneming, vleeskuikenhouderijonderneming of
      vleeskuikenouderdierhouderijonderneming betreft;

      2°. [artikel 2.2.7, eerste, tweede en derde lid][ref10], minder dan 27 punten zijn toegekend, indien het een
      innovatieproject ten behoeve van een melkveehouderijonderneming betreft;

      c. de kwaliteit van het projectplan, bedoeld in [artikel 2.2.8, derde lid][ref11], onvoldoende is, blijkend uit de
      omschrijving en uitwerking van aanpak en methodiek, de omgang met de risico’s, de uitvoerbaarheid, de deelnemende
      partijen, de onderbouwing van de te realiseren emissiereductie of de mate waarin de beschikbare middelen effectief
      en efficiënt worden ingezet;

      d. de afwijzingsgrond voor de emissiemetingenfase, genoemd in [artikel 2.2.18][ref12] zich voordoet;

      e. de afwijzingsgronden, bedoeld in [artikel 2.2.24][ref13] zich voordoen voor de resterende levensduurfase, indien
      een innovatieproject de drie fases, bedoeld in [artikel 2.2.2, tweede lid, onderdeel a][ref14], betreft.


