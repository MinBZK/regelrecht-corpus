      2 In afwijking van het eerste lid is de termijn, bedoeld in [artikel 23, onderdeel b][ref2], van het besluit
      voor projecten die passen binnen het in paragraaf 4.5 van [bijlage 4.2.9][ref3], onderdeel B, opgenomen thema
