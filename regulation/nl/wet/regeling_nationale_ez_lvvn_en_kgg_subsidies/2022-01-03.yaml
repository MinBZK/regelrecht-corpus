        artikel: '23'
  - number: 3.10.8
    text: |-
      1 De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger, naarmate:

      a. de aanvrager meer kan steunen op relevante ervaring en deskundigheid. Dit blijkt uit:

      1°. de ervaring en deskundigheid van management en direct betrokkenen op financieel gebied;

      2°. de ervaring en deskundigheid van management en direct betrokkenen met betrekking tot business aspecten van
      technostarters;

      3°. de omvang en toegevoegde waarde van relatienetwerk;

      4°. de diversiteit in de samenstelling van het fondsmanagement;

      b. het fondsplan doelmatiger is ingericht en meer bijdraagt aan de opbouw van succesvolle ondernemingen door
      technostartervennootschappen. Dit blijkt uit:

      1°. de kwaliteit van het plan en de mate van zekerheid dat het plan ook daadwerkelijk zal worden uitgevoerd;

      2°. de prijskwaliteitsverhouding en efficiency;

      3°. het financieel-economisch rendement;

      c. het fondsplan effectiever is in relatie tot de doelstelling van de regeling. Dit blijkt uit:

      1°. de mate van maatschappelijk rendement;

      2°. de mate waarin het fondsplan vernieuwend is.

      2 Voor de rangschikking wegen de in het eerste lid vermelde criteria even zwaar.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.10.8
  - number: 3.10.9
    text: |-
      De in [artikel 30, eerste lid, van het besluit][ref1] genoemde termijn waarbinnen een overeenkomst tot stand moet
      zijn gekomen, kan, indien dit naar het oordeel van de minister redelijkerwijs geoorloofd is, met maximaal acht
      weken verlengd worden.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel30
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.10.9
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '30'
  - number: 3.10.10
    text: |-
      1 De vergoeding, bedoeld in [artikel 33, tweede lid, van het besluit][ref1], verschilt al naar gelang de inkomsten
      door de financier worden ontvangen in één van de volgende perioden:

      a. periode A: vanaf het tot stand komen van deze overeenkomst van geldlening totdat het totaal van de door de
      financier uit de participaties verkregen inkomsten na aftrek van het totaal van de aan de Staat overgeboekte
      bedragen gelijk is aan de eigen bijdragen voor de verkregen participaties, gemeten aan het einde van de
      fondsperiode;

      b. periode B: vanaf het einde van periode A totdat het totaal van de aan de Staat overgeboekte bedragen gelijk is
      aan het totaal op grond van de overeenkomst van lening opgenomen bedrag, gemeten aan het einde van de fondsperiode;

      c. periode C: vanaf het einde van periode B tot het einde van de fondsperiode.

      2 De vergoeding, bedoeld in [artikel 33, tweede lid, van het besluit][ref2], bedraagt:

      a. in periode A: 20 procent van de inkomsten;

      b. in periode B: 50 procent van de inkomsten;

      c. in periode C: 20 procent van de inkomsten.

      De percentages, bedoeld in de onderdelen a, b en c, worden naar rato verlaagd, indien de geldlening minder dan de
      helft van het investeringsbudget uitmaakt.

      3 De minister kan de hoogte van de vergoeding, bedoeld in het tweede lid, per periode A, B en C, afwijkend
      vaststellen, indien de financier in strijd heeft gehandeld met hetgeen in deze regeling of in de overeenkomst tot
      geldlening, bedoeld in [artikel 3.10.3][ref3], is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.10.3
