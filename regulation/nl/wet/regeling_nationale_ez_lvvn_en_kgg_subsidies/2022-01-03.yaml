  - number: 4.2.78
    text: |-
      In deze paragraaf wordt verstaan onder joint industry project: project, bestaande uit industrieel onderzoek,
      experimentele ontwikkeling, of een combinatie van deze vormen, dat past binnen de in [bijlage 4.2.11][ref1]
      (Programmalijnen Energie en industrie: joint industry projects) opgenomen programmalijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.78
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 4.2.79
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een deelnemer in een samenwerkingsverband voor het uitvoeren
      van een joint industry project.

      2 Een samenwerkingsverband bevat ten minste één onderneming.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.79
  - number: 4.2.80
    text: |-
      1 De subsidie bedraagt voor een joint industry project:

      a. 50% van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek;

      b. 25% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling;

      c. 80% van de subsidiabele kosten voor zover deze betrekking hebben op niet-economische activiteiten van
      onderzoeksorganisaties.

      2 De in het eerste lid, onderdelen a en b, genoemde percentages worden met 20 procentpunten verhoogd indien de
      aanvrager een kleine onderneming is en de subsidiabele kosten worden gemaakt en betaald door de kleine ondernemer.

      3 De in het eerste lid, onderdelen a en b, genoemde percentages worden met 10 procentpunten verhoogd indien de
      aanvrager een middelgrote onderneming is en de subsidiabele kosten worden gemaakt en betaald door de middelgrote
      ondernemer.

      4 De subsidie bedraagt maximaal € 2.000.000 per joint industry project.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.80
  - number: 4.2.81
    text: |-
      1 De minister verdeelt het subsidieplafond per programmalijn, genoemd in [bijlage 4.2.11][ref1], op volgorde van
      rangschikking van de aanvragen.

      2 Bij de verdeling, bedoeld in het eerste lid, verleent de minister eerst tot maximaal € 250.000 subsidie aan
      projecten waarvoor ten hoogste € 50.000 subsidie is aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.81
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 4.2.82
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.82
