  - number: 4.2.77a
    text: |-
      1 Onverminderd [artikel 4.2.3, eerste en tweede lid][ref1], bevat een aanvraag om subsidie:

      a. gegevens over de grootte van het bedrijf van de aanvrager, indien de aanvrager aanspraak wil maken
      op een verhoogd percentage aan subsidie voor een kleine of middelgrote onderneming als bedoeld in
      [artikel 4.2.73, tweede lid][ref2];

      b. voor zover het overige projectactiviteiten betreft die worden uitgevoerd door ondernemingen, een verklaring de-
      minimissteun van elke onderneming in het samenwerkingsverband die deze activiteiten uitvoert.

      2 De aanvraag gaat vergezeld van:

      a. een beknopte beschrijving van de kennis, ervaring en capaciteiten van de bij de uitvoering van het
      systeemintegratieproject betrokken personen, die relevant zijn om de kwaliteit van het samenwerkingsverband te
      kunnen beoordelen;

      b. een plan dat betrekking heeft op de wijze waarop de kennisverspreiding plaatsvindt;

      c. bewijsstukken waaruit de inbreng van alle afzonderlijke deelnemers in een samenwerkingsverband voor de
      uitvoering van het desbetreffende systeemintegratie-project volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.3
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.73
