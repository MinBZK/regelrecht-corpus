  - number: 3.27.7
    text: |-
      De minister beslist afwijzend op een aanvraag voor subsidie indien:

      a. het project in onvoldoende mate bijdraagt aan de doelstellingen, bedoeld in [artikel 3.27.2, eerste lid][ref1],
      blijkend uit de omstandigheid dat:

      1°. het aannemelijk is dat in onvoldoende mate invulling wordt gegeven aan de doelstellingen en criteria, bedoeld
      in paragrafen 3.2.1, onderdelen 14, 15, 16, 18, 19 en 20, 3.2.3, onderdelen 22, 23, 24 en 25, en 3.3, onderdeel 26,
      van het IPCEI-steunkader; of

      2°. na toepassing van [artikel 3.27.8, eerste lid, onderdelen a tot en met d, en tweede lid][ref2], minder dan zes
      punten per criterium zijn toegekend;

      b. de aanvraag betrekking heeft op een Nederlands belangrijk project:

      1°. waarvoor niet op uiterlijk 11 juli 2021 om 18:00 uur voor projectactiviteiten op het gebied van Cloud
      Infrastructuur en Services of 21 mei 2021 om 17:00 uur voor projectactiviteiten op het gebied van micro-
      elektronica en halfgeleiders als bedoeld in [artikel 3.27.2, eerste lid, onderdelen a en b][ref3], een
      voorlopig projectvoorstel ingediend was bij de minister op grond van de oproep, opgenomen in Stcrt. 2021, 30783
      respectievelijk Stcrt. 2021, 20378; of

      2°. dat geen onderdeel uit heeft gemaakt van een Europees matchmakingsproces;

      c. de subsidiabele kosten per Nederlands belangrijk project minder zouden bedragen dan € 5.000.000;

      d. de te verlenen subsidie minder dan € 125.000 per subsidieaanvrager zou bedragen;

      e. in onvoldoende mate is gewaarborgd dat de uitvoering van het Europese of Nederlandse belangrijke project door de
      betrokken partijen in overeenstemming zal zijn met:

      1°. internationale en Europese verdragen, waaronder in ieder geval de Overeenkomst inzake de handelsaspecten van de
      intellectuele eigendom en het Europees Verdrag voor de Rechten van de Mens; of

      2°. het recht van de Europese Unie, waaronder in ieder geval het Handvest van de grondrechten van de Europese
      Unie, [Verordening (EU) 608/2013](32013R0608) van het Europees Parlement en de Raad van 12 juni 2013 inzake de
      handhaving van intellectuele-eigendomsrechten door de douane en tot intrekking van Verordening (EG) nr. 1383/2003
      van de Raad (PbEU 2013, L 181), [Verordening (EU) 2016/679](32579R2016) van het Europees Parlement en de Raad van
      27 april 2016 betreffende de bescherming van natuurlijke personen in verband met de verwerking van persoonsgegevens
      en betreffende het vrije verkeer van die gegevens en tot intrekking van [Richtlijn 95/46/EG](31995L0046) (algemene
      verordening gegevensbescherming) (PbEU 2016, L 119), [Verordening (EU) 2019/452](32352R2019) van het Europees
      Parlement en de Raad van 19 maart 2019 tot vaststelling van een kader voor de screening van buitenlandse directe
      investeringen in de Unie (PbEU 2019, L 79 I), [Richtlijn (EU) 2016/943](32016L0943) van het Europees Parlement
      en de Raad van 8 juni 2016 betreffende de bescherming van niet-openbaar gemaakte knowhow en bedrijfsinformatie
      (bedrijfsgeheimen) tegen het onrechtmatig verkrijgen, gebruiken en openbaar maken daarvan (PbEU 2016, L 157) en
      [Richtlijn 2016/1148](32016L1148) van het Europees Parlement en de Raad van 6 juli 2016 houdende maatregelen voor
      een hoog gemeenschappelijk niveau van beveiliging van netwerk- en informatiesystemen in de Unie (PbEU 2016, L 194);

      f. in het geval er sprake is van een Nederlands samenwerkingsverband waaraan een onderzoeksorganisatie deelneemt,
      de samenwerking tussen die onderzoeksorganisatie en de overige deelnemers in het samenwerkingsverband onvoldoende
      evenwichtig is, blijkend uit de omstandigheid dat de onderzoeksorganisatie meer dan 65 procent van de subsidiabele
      kosten maakt.


