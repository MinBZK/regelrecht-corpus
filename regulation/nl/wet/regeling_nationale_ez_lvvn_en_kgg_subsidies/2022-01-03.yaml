        artikel: '14'
  - number: 3.24.4
    text: |-
      De volgende kosten komen niet in aanmerking voor subsidie:

      a. kosten die direct toerekenbaar zijn aan het maken van individuele roadmaps voor mkb-ondernemers;

      b. kosten die verband houden met vervolgactiviteiten die uit de gemaakte roadmaps voortkomen; en

      c. kosten die aan expertbedrijven verschuldigd zijn.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.24.4
  - number: 3.24.5
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.24.5
  - number: 3.24.6
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.24.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.24.7
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. onvoldoende vertrouwen bestaat in structurele voortzetting van de mkb-werkplaats na afloop van de
      subsidieperiode door middel van structurele inbedding van de mkb-werkplaats in het onderwijscurriculum;

      b. onvoldoende vertrouwen bestaat dat de aanvrager of de aanvragers kan of kunnen voldoen aan de verplichtingen,
      bedoeld in [artikel 3.24.10][ref1];

      c. voor de mkb-werkplaats reeds door de rijksoverheid subsidie is verstrekt;

      d. geen regionale overheid betrokken is als regionale partner bij de mkb-werkplaats;

      e. na toepassing van [artikel 3.24.8, eerste lid][ref2], minder dan 9 punten zijn toegekend aan onderdeel a van dat
      lid of minder dan 12 punten zijn toegekend aan onderdeel c of onderdeel d van dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.24.10
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.24.8
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.24.7
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.24.10
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 3.24.8
        hoofdstuk: '3'
  - number: 3.24.8
    text: |-
      1 De minister kent een aanvraag een hoger aantal punten toe naarmate:

      a. de kwaliteit van het projectplan hoger wordt geacht;

      b. de potentiële impact van de mkb-werkplaats op de regio hoger wordt geacht;

      c. de mkb-werkplaats effectiever bijdraagt aan de digitalisering van mkb-ondernemers;

      d. de mkb-werkplaats meer bijdraagt aan verbetering van het praktijkleren voor de aan de mkb-werkplaats verbonden
      studenten;

      e. de betrokkenheid van partijen in de regio groter is.

      2 Het aantal punten bedraagt bij de onderdelen a, b en e van het eerste lid ten minste één en ten hoogste achttien
      punten, en bij de onderdelen c en d van het eerste lid ten minste één en ten hoogste 23 punten.

      3 De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate in totaal meer punten aan de
      aanvraag zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.24.8
  - number: 3.24.9
    text: |-
      1 Er is een Adviescommissie mkb-werkplaatsen die tot taak heeft de minister op zijn verzoek te adviseren omtrent de
      afwijzingsgronden, bedoeld in de [artikelen 22][ref1] en [23 van het besluit][ref2] en in [artikel 3.24.7][ref3],
      en de rangschikkingscriteria, bedoeld in [artikel 3.24.8][ref4].

      2 De commissie bestaat uit ten minste 3 en ten hoogste 5 leden.

      3 De voorzitter en de andere leden worden benoemd voor een termijn van ten hoogste vier jaar.


