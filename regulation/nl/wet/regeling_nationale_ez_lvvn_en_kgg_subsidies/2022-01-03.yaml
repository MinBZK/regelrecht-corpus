  - number: 3.8.15
    text: |-
      Deze titel vervalt met ingang van 1 januari 2026, met dien verstande dat deze van toepassing blijft op subsidies
      die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.8.15
  - number: 3.9.1
    text: |-
      In deze titel wordt verstaan onder:

        - *certificeringstraject:* certificering op basis van de resultaten van uitvoerige beproevingen en berekeningen;
        - *klinisch ontwikkelingsproject:* planmatig geheel van activiteiten in de fase van experimentele ontwikkeling,
      gericht op het omzetten van resultaten van industrieel onderzoek in plannen, schema’s of ontwerpen voor nieuwe,
      gewijzigde of verbeterde producten of processen, die nieuw zijn voor Nederland, en a. aan de ontwikkeling van
      welke producten en processen klinische risico’s en daarmee samenhangende financiële risico’s zijn verbonden en
      b. welke producten of processen door het goede commerciële perspectief kunnen leiden tot substantiële economische
      activiteiten van de onderneming;
        - *klinisch risico:* risico voor het welslagen van het product of proces dat voortvloeit uit de noodzaak dat het
      nieuwe product of proces een testfase in de mens doorloopt;
        - *ontwikkelingsproject:* een technisch ontwikkelingsproject of een klinisch ontwikkelingsproject;
        - *opslag:* eenmalige en niet rentedragende opslag als bedoeld in [artikel 3.9.8, vierde lid][ref1], in de vorm
      van een bij de beschikking tot subsidieverlening, overeenkomstig [artikel 3.9.9][ref2], bepaald percentage van het
      bedrag dat in totaal is uitbetaald als subsidie in de vorm van krediet op het moment van subsidievaststelling;
        - *technisch ontwikkelingsproject:* een planmatig geheel van activiteiten in de fase van experimentele
      ontwikkeling, gericht op het omzetten van resultaten van industrieel onderzoek in plannen, schema’s of ontwerpen
      voor nieuwe, gewijzigde of verbeterde producten, processen of diensten, die nieuw zijn voor Nederland, en a.
      waaraan substantiële technische, maar geen klinische, risico’s en daarmee samenhangende financiële risico’s zijn
      verbonden en b. welke producten, processen of diensten door het goede commerciële perspectief kunnen leiden tot
      substantiële economische activiteiten van de onderneming;
        - *uitstaand saldo:* totaalbedrag dat aan de subsidieontvanger is uitbetaald als subsidie in de vorm van krediet,
      verhoogd met de verschenen rente, bedoeld in [artikel 3.9.8, tweede en derde lid][ref3], en, voor zover reeds van
      toepassing, met de opslag en verminderd met de betalingen, gedaan overeenkomstig artikel 3.9.8, vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.9.8
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.9.9
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.9.8
