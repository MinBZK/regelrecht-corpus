  - number: 3.6.1
    text: |-
      In deze titel wordt verstaan onder:

        - *onderzoeksorganisatie:* organisatie voor onderzoek en kennisverspreiding als bedoeld in artikel 2, onderdeel 83,
      van de algemene groepsvrijstellingsverordening en paragraaf 1.3, onderdeel ee, van het O&O&I-steunkader.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.6.1
  - number: 3.6.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een deelnemer in een samenwerkingsverband voor het uitvoeren van
      een R&D-mobiliteitsproject met als doel:

      a. het behouden en verbeteren van de concurrentiepositie van Nederlandse ondernemingen binnen de automotive,
      luchtvaart of maritieme sector en het herstel van de negatieve economische gevolgen die zijn veroorzaakt door de
      uitbraak van het coronavirus; en

      b. het leveren van een bijdrage aan de maatschappelijke opgaven op het vlak van duurzaamheid of digitalisering.

      2 Een R&D-mobiliteitsproject bevat een samenhangend geheel van activiteiten dat past binnen de in
      [bijlage 3.6][ref1] opgenomen thema’s en dat ten minste bestaat uit industrieel onderzoek of experimentele
      ontwikkeling door één of meer ondernemingen en daarnaast kan bestaan uit niet-economisch industrieel onderzoek of
      experimentele ontwikkeling door één of meer onderzoeksorganisaties dat onafhankelijk wordt uitgevoerd met het oog
      op meer kennis en een beter inzicht.

      3 Een samenwerkingsverband bevat ten minste:

      a. twee ondernemingen; of

      b. een onderneming en een onderzoeksorganisatie.

      4 De penvoerder van een samenwerkingsverband is een onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.6.2
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 3.6.3
    text: |-
      1 De subsidie bedraagt voor een R&D-mobiliteitsproject:

      a. 45% van de subsidiabele kosten, voor zover deze betrekking hebben op industrieel onderzoek door een onderneming;

      b. 25% van de subsidiabele kosten, voor zover deze betrekking hebben op experimentele ontwikkeling door een
      onderneming;

      c. 80% van de subsidiabele kosten, voor zover deze betrekking hebben op niet-economisch industrieel onderzoek of
      experimentele ontwikkeling door een onderzoeksorganisatie.

      2 De percentages, genoemd in het eerste lid, onderdelen a en b, worden verhoogd met:

      a. 10 procentpunten, indien de aanvrager een middelgrote of kleine onderneming is en de subsidiabele kosten worden
      gemaakt en betaald door deze middelgrote respectievelijk kleine onderneming;

      b. 15 procentpunten, indien voldaan wordt aan ten minste één van de voorwaarden, bedoeld in artikel 25, zesde lid,
      onderdeel b, onder i, aanhef en eerste of tweede streepje van de algemene groepsvrijstellingsverordening.

      3 De subsidie bedraagt ten hoogste:

      a. € 25.000.000 per R&D-mobiliteitsproject;

      b. € 15.000.000 per deelnemer in een samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.6.3
  - number: 3.6.4
    text: |-
      Voor zover een R&D-mobiliteitsproject betrekking heeft op industrieel onderzoek of experimentele ontwikkeling door
      een onderneming komen uitsluitend voor subsidie in aanmerking de kosten, bedoeld in artikel 25, derde lid, van de
      algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.6.4
