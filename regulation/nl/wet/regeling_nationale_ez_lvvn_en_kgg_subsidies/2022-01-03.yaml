  - number: 3.12.7
    text: |-
      1 In [bijlage 3.12.1][ref1] is een model opgenomen voor een garantstellingsovereenkomst ten aanzien van
      achtergestelde leningen en aandelenkapitaal.

      2 in [bijlage 3.12.2][ref2] is een model opgenomen voor een garantstellingsovereenkomst ten aanzien van niet
