    text: |-
      1 De subsidies, bedoeld in [artikel 4.7.2, eerste lid][ref1], worden alleen uitgekeerd wanneer de mkb-onderneming
      aantoont minstens één maatregel uit het advies, bedoeld in artikel 4.7.2, eerste lid, onder a, te zullen uitvoeren
      of te hebben uitgevoerd binnen twee jaar na de datum van opstellen van dat advies, door overlegging van een
      getekende offerte, opdracht of betaalbewijs, bedoeld in [artikel 4.7.7, onder e][ref2].

      2 De mkb-onderneming is verplicht de in het kader van de subsidieverlening gevoerde administratie te bewaren tot
