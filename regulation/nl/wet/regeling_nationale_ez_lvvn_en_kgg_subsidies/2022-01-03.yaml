  - number: '1.8'
    text: |-
      1 Indien een subsidie die op grond van deze regeling wordt verleend, staatssteun bevat die door de algemene
      groepsvrijstellingsverordening wordt gerechtvaardigd, maakt de minister binnen zes maanden na de datum van
      subsidieverlening de volgende gegevens bekend:

      a. de gegevens, bedoeld in artikel 9, eerste lid, onderdelen a en b, van de algemene
      groepsvrijstellingsverordening, en

      b. de gegevens, bedoeld in artikel 9, eerste lid, onderdeel c, van de algemene groepsvrijstellingsverordening, voor
      zover de individuele steun meer bedraagt dan € 500.000.

      2 Indien een subsidie die op grond van deze regeling wordt verleend, staatssteun bevat die door artikel 16 of 21
      van de algemene groepsvrijstellingsverordening wordt gerechtvaardigd, worden de gegevens, bedoeld in het eerste
      lid, onderdeel b, geacht te zijn bekendgemaakt indien de individuele steunbedragen bekend zijn gemaakt volgens de
      tranches, bedoeld in artikel 9, tweede lid, van de algemene groepsvrijstellingsverordening.

      3 Indien een subsidie die op grond van deze regeling wordt verleend, staatssteun bevat die door de
      groepsvrijstellingsverordening landbouw wordt gerechtvaardigd, maakt de minister binnen zes maanden na de datum van
      subsidieverlening de volgende gegevens bekend:

      a. de gegevens, bedoeld in artikel 9, tweede lid, onderdelen a en b, van de groepsvrijstellingsverordening
      landbouw, en

      b. de gegevens, bedoeld in artikel 9, tweede lid, onderdeel c, van de groepsvrijstellingsverordening landbouw, voor
      zover de individuele steun meer bedraagt dan:

      1°. € 60.000 voor begunstigden die actief zijn in de primaire landbouwproductie, of

      2°. € 500.000 voor begunstigden die actief zijn in de sector verwerking van landbouwproducten, de sector afzet van
      landbouwproducten of de bosbouwsector, of die activiteiten uitoefenen die buiten het toepassingsgebied van artikel
      42 van het Verdrag betreffende de werking van de Europese Unie vallen.

      4 Indien een subsidie die op grond van deze regeling wordt verleend, staatssteun bevat die door het O&O&I-
      steunkader wordt gerechtvaardigd, maakt de minister binnen zes maanden na de datum van subsidieverlening de
      gegevens, bedoeld in paragraaf 4.7, onderdeel 119, van het O&O&I-steunkader, bekend, voor zover de individuele
      steun meer bedraagt dan € 500.000.

      5 Indien een subsidie die op grond van deze regeling wordt verleend, staatssteun bevat die door het
      landbouwsteunkader wordt gerechtvaardigd, maakt de minister binnen zes maanden na de datum van subsidieverlening de
      volgende gegevens bekend:

      a. de gegevens, bedoeld in deel I, paragraaf 3.7, onderdeel 128, onder a en b, van het landbouwsteunkader, en

      b. de gegevens, bedoeld in deel I, paragraaf 3.7, onderdeel 128, onder c, van het landbouwsteunkader, voor zover de
      individuele steun meer bedraagt dan:

      1°. € 60.000 voor begunstigden die actief zijn in de primaire landbouwproductie, of

      2°. € 500.000 voor begunstigden in de sectoren van de verwerking van landbouwproducten, de afzet van
      landbouwproducten, de bosbouwsector of activiteiten die buiten het toepassingsgebied van artikel 42 van het Verdrag
      betreffende de werking van de Europese Unie vallen.

      6 Indien een subsidie die op grond van deze regeling wordt verleend, staatssteun bevat die door het milieu- en
      energiesteunkader wordt gerechtvaardigd, maakt de minister binnen zes maanden na de datum van subsidieverlening de
      gegevens, bedoeld in paragraaf 5.2.7, onderdeel 104, van het milieu- en energiesteunkader, bekend, voor zover de
      individuele steun meer bedraagt dan € 500.000.

      7 Indien een subsidie die op grond van deze regeling wordt verleend, staatssteun bevat die wordt gerechtvaardigd
      door de Tijdelijke kaderregeling inzake staatssteun ter ondersteuning van de economie vanwege de huidige COVID-19-
      uitbraak (PbEU 2020, C 91 I), maakt de minister na de datum van subsidieverlening de gegevens bekend, bedoeld in
      paragraaf 4, onderdeel 103, van die kaderregeling.

      8 Indien een subsidie die op grond van deze regeling wordt verleend, staatssteun bevat die door het IPCEI-
      steunkader wordt gerechtvaardigd, maakt de minister binnen zes maanden na de datum van subsidieverlening de
      gegevens, bedoeld in paragraaf 4.3, onderdeel 48, van het IPCEI-steunkader bekend, voor zover de individuele steun
      meer bedraagt dan € 100.000.

      9 De gegevens, bedoeld in het eerste tot en met zevende lid, blijven voor ten minste tien jaar openbaar
      beschikbaar.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel1.8
  - number: '1.9'
    text: |-
      1 Indien een geheel of gedeeltelijk van overheidswege gefinancierde onderzoeksorganisatie deelneemt aan een
      project dat wordt uitgevoerd in daadwerkelijke samenwerking, sluiten de deelnemers voorafgaand aan het project
      een overeenkomst over de wijze waarop wordt omgegaan met de bijdrage in de kosten, het delen in de risico’s en
      uitkomsten, de verspreiding van de resultaten en de toegang tot en de regels voor de toewijzing van intellectuele
      eigendomsrechten.

      2 Indien een project als bedoeld in het eerste lid gezamenlijk door ondernemingen en van overheidswege
      gefinancierde onderzoeksorganisaties of onderzoeksinfrastructuren wordt uitgevoerd, legt de penvoerder de afspraken
      voor aan de minister, tenzij:

      a. de deelnemende ondernemingen de volledige kosten van het project dragen;

      b. de resultaten van de samenwerking die geen intellectuele eigendomsrechten opleveren, breed kunnen
      worden verspreid en alle intellectuele eigendomsrechten die de activiteiten van de onderzoeksorganisatie of
      onderzoeksinfrastructuur opleveren, volledig worden toegekend aan die entiteiten;

      c. uit het project ontstane intellectuele eigendomsrechten, alsmede daarmee verband houdende toegangsrechten aan
      de verschillende deelnemers worden toegekend op een wijze die een passende afspiegeling is van hun werkpakketten,
      bijdragen en respectieve belangen, of

      d. de van overheidswege gefinancierde onderzoeksorganisaties of onderzoeksinfrastructuren een vergoeding ontvangen
      die gelijkwaardig is aan de marktprijs voor de intellectuele eigendomsrechten die uit hun activiteiten ontstaan en
      worden toegewezen aan de deelnemende ondernemingen of waartoe de deelnemende ondernemingen toegangsrechten kregen
      toegewezen.

      3 Op de vergoeding, bedoeld in het tweede lid, onderdeel d, kan het absolute bedrag van financiële en niet-
      financiële bijdragen van de deelnemende ondernemingen in de kosten van de activiteiten van de van overheidswege
      gefinancierde onderzoeksorganisatie of onderzoeksinfrastructuur die de betrokken intellectuele-eigendomsrechten
      hebben opgeleverd, in mindering worden gebracht.

      4 Indien uit de aan de minister op basis van het tweede lid voorgelegde afspraken blijkt dat sprake is van
      staatssteun als gevolg van de overdracht van kennis of andere resultaten uit activiteiten, wordt slechts een
      zodanig bedrag aan subsidie verstrekt dat het totale bedrag aan subsidie niet meer bedraagt dan het in de
      beschikking tot subsidieverlening aangegeven bedrag dat ten hoogste mag worden verstrekt ingevolge een Europees
      steunkader.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel1.9
  - number: '1.10'
    text: |-
      1 De minister kan op grond van deze regeling uitsluitend subsidie verstrekken indien hij de mogelijkheid tot het
      doen van een aanvraag tot subsidieverlening heeft opengesteld door vaststelling van een subsidieplafond en een
      periode voor indiening van de aanvraag.

      2 De minister kan de openstelling beperken tot bepaalde activiteiten, categorieën van aanvragers of een bepaald
      aantal aanvragen.

      3 De minister kan verschillende subsidieplafonds vaststellen voor verschillende activiteiten of categorieën van
      aanvragers.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel1.10
  - number: 2.1.1
    text: |-
      Voor de toepassing van dit hoofdstuk bedraagt het uurtarief, bedoeld in [artikel 13, tweede lid][ref1], en
      [14 van het besluit][ref2], € 60.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel14
