  - number: 2.16.1
    text: |-
      In deze titel wordt verstaan onder:

        - *aquacultuurproducten:* aquacultuurproducten als bedoeld in artikel 4, eerste lid, onderdeel 34, van [verordening
      1380/2013](32013R1380);
        - *onderzoeksorganisatie:* een organisatie voor onderzoek en kennisverspreiding als bedoeld in artikel 2, punt
      86, van de algemene groepsvrijstellingsverordening, zijnde een: a. instelling voor hoger onderwijs, genoemd
      in onderdelen a, b, g of h van de [bijlage van de Wet op het hoger onderwijs en wetenschappelijk onderzoek]
      (onbekend); b. andere dan in onderdeel a bedoelde geheel of gedeeltelijk meerjarig door de overheid gefinancierde
      onderzoeksorganisatie die activiteiten verricht met als doel de algemene wetenschappelijke en technische kennis uit
      te breiden; c. geheel of gedeeltelijk door een andere staat gefinancierde openbare instelling voor hoger onderwijs,
      gelijkwaardig aan een instelling als bedoeld in onderdeel a; of d. geheel of gedeeltelijk door een andere staat
      meerjarig gefinancierde onderzoeksorganisatie die activiteiten verricht met als doel de algemene wetenschappelijke
      en technische kennis uit te breiden gelijkwaardig aan een instelling als bedoeld in onderdeel b;
        - *verordening 1380/2013:* verordening (EU) nr. 1380/2013 van het Europees Parlement en de Raad van 11 december
      2013 inzake het gemeenschappelijk visserijbeleid, tot wijziging van Verordeningen (EG) nr. 1954/2003 en (EG)
      nr. 1224/2009 van de Raad en tot intrekking van Verordeningen (EG) nr. 2371/2002 en (EG) nr. 639/2004 van de Raad
      en Besluit 2004/585/EG van de Raad (PbEU 2013, L354);
        - *visserij- of aquacultuuronderneming:* onderneming die actief is in de visserij- of aquacultuursector, bedoeld
      in artikel 5, onderdeel d, van Verordening (EU) nr. 1379/2013 van het Europees Parlement en de Raad van 11 december
      2013 houdende een gemeenschappelijke marktordening voor visserijproducten en aquacultuurproducten, tot wijziging
      van Verordeningen (EG) nr. 1184/2006 en (EG) nr. 1224/2009 van de Raad en tot intrekking van Verordening (EG)
      nr. 104/2000 van de Raad (PbEU 2013, L 354);
        - *visserijproducten:* visserijproducten als bedoeld in artikel 4, eerste lid, onderdeel 34, van [verordening
      1380/2013](32013R1380);
        - *visserij- of aquacultuurorganisatie:* een organisatie waarvan uit de doelstellingen in de statuten blijkt dat
      zij het collectief belang van visserij- of aquacultuurondernemingen behartigt.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.16.1
  - number: 2.16.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie voor de uitvoering van een innovatieproject, dat betrekking
      heeft op industrieel onderzoek of experimentele ontwikkeling en gericht is op de innovatie van visserij- of
      aquacultuurproducten of de productie daarvan met het oog op:

      a. vermindering van de negatieve invloed op klimaat of milieu door visserij- of aquacultuuractiviteiten; of

      b. de ontwikkeling van andere vangst- of kweekmethoden, die bijdragen aan een duurzamere visserij of aquacultuur.

      2 De subsidie wordt verstrekt aan:

      a. een visserij- of aquacultuuronderneming;

      b. een visserij- of aquacultuurorganisatie;

      c. een onderzoeksorganisatie; of

      d. een samenwerkingsverband van twee of meer van de in de onderdelen a tot en met c bedoelde partijen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.16.2
  - number: 2.16.3
    text: |-
      1 De subsidie bedraagt 65 procent van de subsidiabele kosten voor een innovatieproject dat betrekking heeft op
      industrieel onderzoek.

      2 De subsidie bedraagt 40 procent van de subsidiabele kosten voor een innovatieproject dat betrekking heeft op
      experimentele ontwikkeling.

      3 De percentages, bedoeld in het eerste en tweede lid, worden verhoogd met 10 procentpunten, indien de
      subsidieontvanger een mkb-onderneming is.

      4 In afwijking van het eerste, tweede en derde lid bedraagt de subsidie 100 procent van de subsidiabele kosten,
      indien:

      a. de subsidieontvanger een onderzoeksorganisatie is; en

      b. het project van belang is voor alle marktdeelnemers in de betrokken sector of subsector.

      5 De subsidie bedraagt ten hoogste € 1.000.000 per innovatieproject.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.16.3
  - number: 2.16.4
    text: |-
      De subsidiabele kosten zijn de kosten, bedoeld in artikel 25, derde lid, onderdelen a, b, d en e, van de algemene
      groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.16.4
  - number: 2.16.5
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.16.5
  - number: 2.16.6
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is de termijn tot en met 31 december 2024.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.16.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 2.16.7
    text: |-
      De minister beslist afwijzend op een aanvraag tot subsidieverlening voor een innovatieproject, indien:

      a. de subsidiabele kosten minder bedragen dan € 500.000 per project;

      b. de beoogde innovatie niet binnen vijf jaar zal kunnen leiden tot de commerciële toepassing van het geïnnoveerde
      product of productieproces;

      c. het innovatieproject niet leidt tot een voldoende mate van vernieuwing van een product of productieproces;

      d. het innovatieproject niet leidt tot een substantiële vermindering van milieubelastende effecten of
      verduurzaming, in vergelijking met wat kan worden bereikt door onderhoud of andere activiteiten in het kader van de
      gangbare bedrijfsvoering;

      e. de kwaliteit van het projectplan onvoldoende is;

      f. in het geval het innovatieproject wordt uitgevoerd door een samenwerkingsverband, de kwaliteit van het
      samenwerkingsverband ontoereikend is om het innovatieproject uit te voeren.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.16.7
  - number: 2.16.8
    text: |-
      1 De subsidieontvanger draagt er zorg voor dat de projectresultaten ruim worden verspreid via conferenties,
      publicaties, open access-repositories of gratis of opensource-software.

      2 Indien toepassing wordt gegeven aan [artikel 2.16.3, vierde lid][ref1], voldoet de onderzoeksorganisatie aan
      artikel 30, derde en vierde lid, van de algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.16.3
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.16.8
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.16.3
        hoofdstuk: '2'
  - number: 2.16.9
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in deze titel bevat ten minste de gegevens, bedoeld in artikel 6, tweede
      lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie als bedoeld in deze titel ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het nummer waarmee de onderneming is
      geregistreerd bij de Kamer van Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. de gegevens over het plan, waaronder de activiteit waarvoor subsidie wordt aangevraagd, de start- en einddatum,
      de totale kosten en de omvang van de gevraagde subsidie;

      d. een projectplan, inclusief planning en begroting;

      e. een samenvatting van het project waarvoor de subsidie wordt aangevraagd die door de minister kan worden gebruikt
      in voor een ieder toegankelijke publicaties.

      3 Behoudens het geval dat toepassing wordt gegeven aan [artikel 50, negende lid, van het besluit][ref1], bevat de
      aanvraag voor de vaststelling van een subsidie in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de aanvrager en het door de minister verstrekte
      referentienummer;

      b. de omvang van de vast te stellen subsidie;

      c. de bescheiden, bedoeld in [artikel 50, tweede lid, onderdelen a, b en c van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel50
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.16.9
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '50'
  - number: 2.16.10
    text: |-
      1 De subsidie bevat staatssteun en wordt gerechtvaardigd door artikel 25 van de algemene
      groepsvrijstellingsverordening.

      2 De subsidie, die met toepassing van [artikel 2.16.3, vierde lid][ref1], wordt verstrekt aan een
      onderzoeksorganisatie, bevat staatssteun en wordt gerechtvaardigd door artikel 30 van de algemene
      groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.16.3
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.16.10
    references:
