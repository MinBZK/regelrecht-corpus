  - number: 4.2.13
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. na toepassing van [artikel 4.2.14, eerste lid][ref1], minder dan 3 punten per criterium zijn toegekend;

      b. eerder op grond van deze titel een subsidie is verstrekt voor een soortgelijk project.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.14
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.13
