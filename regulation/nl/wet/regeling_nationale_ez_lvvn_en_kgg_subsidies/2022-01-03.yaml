  - number: 3.4.27
    text: |-
      1 De subsidieontvanger verleent medewerking aan een evaluatie van de effecten van de door hem op grond van dit
      hoofdstuk uitgevoerde activiteiten, voor zover medewerking redelijkerwijs van hem kan worden verlangd.

      2 De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.4.27
  - number: 3.4.28
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in deze titel bevat ten minste de gegevens, bedoeld in artikel 6, tweede
      lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie als bedoeld in deze titel ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het nummer waarmee de onderneming is
      geregistreerd bij de Kamer van Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. de gegevens over het plan, waaronder de activiteit waarvoor subsidie wordt aangevraagd, de start- en einddatum,
      de totale kosten en de omvang van de gevraagde subsidie;

      d. een projectplan, behoudens wanneer de aanvraag uitsluitend ziet op een kennisvoucher;

      e. een projectbegroting, behoudens wanneer de aanvraag ziet op een kennisvoucher of op het inhuren van
      hooggekwalificeerd personeel;

      f. een aanmelding en machtiging per deelnemer bij een haalbaarheidsstudie of R&D-samenwerkingsproject;

      g. een verklaring de-minimissteun indien de aanvraag ziet op een kennisvoucher.

      3 De aanvraag voor de vaststelling van een subsidie die krachtens deze titel is verleend bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de aanvrager en het door de minister verstrekte
      referentienummer;

      b. de omvang van de vast te stellen subsidie;

      c. de kerngegevens voor de onderbouwing van de subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.4.28
  - number: 3.4.29
    text: |-
      1 Subsidie die krachtens deze titel wordt verleend bevat staatssteun en wordt, behoudens [paragraaf 3.4.3][ref1],
      gerechtvaardigd door de artikelen 25 en 28 van de algemene groepsvrijstellingsverordening.

      2 Subsidie die krachtens [paragraaf 3.4.3][ref2] wordt verleend, en subsidie voor een MIT-innovatie-adviesproject
      dat niet onder artikel 28 van de algemene groepsvrijstellingsverordening valt, bevatten staatssteun en worden
      gerechtvaardigd door de algemene de-minimisverordening.


