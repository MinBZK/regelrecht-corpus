      Onverminderd [artikel 4.2.2, tweede en derde lid][ref1], verstrekt de subsidieontvanger gedurende de looptijd
      van het DEI+-project jaarlijks een voortgangsrapportage die de minister kan gebruiken voor de openbare brede
      verspreiding van de niet bedrijfsgevoelige kennis en informatie die met het project worden opgedaan.


