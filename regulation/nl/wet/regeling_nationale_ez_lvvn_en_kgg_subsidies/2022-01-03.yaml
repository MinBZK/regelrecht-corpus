  - number: 2.4.32
    text: |-
      De subsidie, bedoeld in [artikel 2.4.24][ref1], bevat staatssteun en wordt gerechtvaardigd door artikel 21 van de
      groepsvrijstellingsverordening landbouw.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.24
