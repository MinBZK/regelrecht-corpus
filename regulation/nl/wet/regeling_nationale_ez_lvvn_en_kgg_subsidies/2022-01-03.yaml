  - number: 3.27.1
    text: |-
      In deze titel wordt verstaan onder:

        - *Europees belangrijk project:* project als bedoeld in paragraaf 3.1 van het IPCEI-steunkader dat is voorzien van
      een Europees goedkeuringsbesluit en wordt uitgevoerd door een Europees samenwerkingsverband;
        - *Europees goedkeuringsbesluit:* besluit waarin de Europese Commissie een project heeft gekwalificeerd als
      belangrijk project van gemeenschappelijk Europees belang en overheidssteun voor één of meer ondernemingen die
      deelnemen aan het desbetreffende Europese samenwerkingsverband verenigbaar heeft verklaard met de interne markt, in
      de zin van artikel 107, derde lid, onderdeel b, van het Verdrag betreffende de werking van de Europese Unie;
        - *Europees samenwerkingsverband:* samenwerkingsverband dat bestaat uit ondernemingen of onderzoeksorganisaties die
      overeenkomstig paragraaf 3.2.1, onderdeel 16, van het IPCEI-steunkader gevestigd zijn in ten minste vier landen die
      lid zijn van de Europese Unie of Europese Vrijhandelsassociatie, behoudens gevallen waarin de aard van een Europees
      belangrijk project vestiging in een kleiner aantal lidstaten rechtvaardigt;
        - *Europees matchmakingsproces:* interactief multilateraal en publiek-privaat proces: a. dat door een of meerdere
      lidstaten van de Europese Unie geïnitieerd is en plaatsvindt tussen lidstaten van de Europese Unie, eventueel met
      een of meer lidstaten van de Europese Vrijhandelsassociatie, en op vrijwillige basis participerende ondernemingen;
      b. dat gericht is op het tot stand brengen van een Europees belangrijk project;
        - *financieringskloof:* financieringskloof als bedoeld in paragraaf 4.1, onderdeel 33, van het IPCEI-steunkader;
        - *grote onderneming:* grote onderneming als bedoeld in artikel 2, onderdeel 24, van de algemene
      groepsvrijstellingsverordening;
        - *Nederlands belangrijk project:* deelproject of projectonderdeel van een Europees belangrijk project;
        - *nul-scenario:* nul-scenario als bedoeld in paragraaf 4.1, onderdeel 31, van het IPCEI-steunkader;
        - *onderzoeksinfrastructuur:* onderzoeksinfrastructuur als bedoeld in artikel 2, onderdeel 91, van de algemene
      groepsvrijstellingsverordening;
        - *onderzoeksorganisatie:* organisatie voor onderzoek en kennisverspreiding als bedoeld in artikel 2, onderdeel 83,
      van de algemene groepsvrijstellingsverordening en paragraaf 1.3, onderdeel ee, van het O&O&I-steunkader;
        - *organisatie-innovatie:* organisatie-innovatie als bedoeld in artikel 2, onderdeel 96, van de algemene
      groepsvrijstellingsverordening;
        - *procesinnovatie:* procesinnovatie als bedoeld in artikel 2, onderdeel 97, van de algemene
      groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.27.1
  - number: 3.27.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan één of meer in Nederland gevestigde ondernemingen of
      onderzoeksorganisaties uit een Europees samenwerkingsverband voor het uitvoeren van een Nederlands belangrijk
      project dat gericht is op het verwezenlijken van één of meer van de doelstellingen, bedoeld in paragraaf 3.2.1,
      onderdeel 14, van het IPCEI-steunkader, op het gebied van:

      a. Cloud Infrastructuur en Services; of

      b. micro-elektronica en halfgeleiders.

      2 Een Nederlands belangrijk project als bedoeld in het eerste lid omvat een samenhangend geheel van activiteiten
      dat kan bestaan uit:

      a. onderzoek en ontwikkeling, de eerste industriële toepassing van innovatieve producten of diensten of
      infrastructuurprojectactiviteiten in de sectoren milieu, energie of digitalisering door een onderneming die voor
      het verrichten van deze activiteiten als directe partner is vermeld in het Europees goedkeuringsbesluit;

      b. industrieel onderzoek, experimentele ontwikkeling of een haalbaarheidsstudie door een onderneming;

      c. niet-economisch industrieel onderzoek, experimentele ontwikkeling of een haalbaarheidsstudie door een
      onderzoeksorganisatie, onafhankelijk uitgevoerd met het oog op meer kennis en een beter inzicht;

      d. investeringen door een middelgrote of kleine onderneming voor de aanschaf of het gebruiksklaar maken van
      materiële of immateriële activa ten behoeve van de oprichting van een nieuwe vestiging, de uitbreiding van
      een bestaande vestiging, de diversificatie van de productie van een bestaande vestiging in nieuwe, bijkomende
      producten, of een fundamentele wijziging van het volledige productieproces van een bestaande vestiging van deze
      onderneming, waarbij bij het gebruik van immateriële activa wordt voldaan aan de voorwaarden die zijn opgenomen in
      artikel 17, vierde lid, van de algemene groepsvrijstellingsverordening;

      e. de bouw of het upgraden van onderzoeksinfrastructuur door een onderneming;

      f. proces- en organisatie-innovatie door een onderneming.

      3 Voor zover dit uit het Europees goedkeuringsbesluit volgt of naar het oordeel van de minister passend is, kan de
      subsidie, bedoeld in het eerste lid, aan een onderneming, bedoeld in het tweede lid, onderdeel a, worden verstrekt
      in de vorm van:

      a. een subsidie met terugbetalingsverplichting; of

      b. een geldlening.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.27.2
  - number: 3.27.3
    text: |-
      1 De subsidie bedraagt voor een Nederlands belangrijk project:

      a. het in het Europees goedkeuringsbesluit opgenomen percentage van de financieringskloof, voor zover de kosten
      betrekking hebben op onderzoek en ontwikkeling, de eerste industriële toepassing van innovatieve producten of
      diensten of infrastructuurprojectactiviteiten in de sectoren milieu, energie of digitalisering door een onderneming
      als bedoeld in [artikel 3.27.2, tweede lid, onderdeel a][ref1];

      b. 50% van de subsidiabele kosten, voor zover deze betrekking hebben op industrieel onderzoek door een onderneming
      als bedoeld in [artikel 3.27.2, tweede lid, onderdeel b][ref2];

      c. 25% van de subsidiabele kosten, voor zover deze betrekking hebben op experimentele ontwikkeling door een
      onderneming als bedoeld in [artikel 3.27.2, tweede lid, onderdeel b][ref3];

      d. 50% van de subsidiabele kosten, voor zover deze betrekking hebben op een haalbaarheidsstudie door een
      onderneming als bedoeld in [artikel 3.27.2, tweede lid, onderdeel b][ref4];

      e. 80% van de subsidiabele kosten, voor zover deze betrekking hebben op niet-economisch industrieel
      onderzoek, experimentele ontwikkeling of een haalbaarheidsstudie door een onderzoeksorganisatie als bedoeld in
      [artikel 3.27.2, tweede lid, onderdeel c][ref5];

      f. 10% van de subsidiabele kosten, voor zover deze betrekking hebben op investeringen door een middelgrote
      onderneming als bedoeld in [artikel 3.27.2, tweede lid, onderdeel d][ref6];

      g. 20% van de subsidiabele kosten, voor zover deze betrekking hebben op investeringen door een kleine onderneming
      als bedoeld in [artikel 3.27.2, tweede lid, onderdeel d][ref7];

      h. 50% van de subsidiabele kosten, voor zover deze betrekking hebben op de bouw of het upgraden van
      onderzoeksinfrastructuur door een onderneming als bedoeld in [artikel 3.27.2, tweede lid, onderdeel e][ref8];

      i. 15% van de subsidiabele kosten, voor zover deze betrekking hebben op proces- en organisatie-innovatie door een
      grote onderneming als bedoeld in [artikel 3.27.2, tweede lid, onderdeel f][ref9];

      j. 50% van de subsidiabele kosten, voor zover deze betrekking hebben op proces- en organisatie-innovatie door een
      middelgrote of kleine onderneming als bedoeld in [artikel 3.27.2, tweede lid, onderdeel f][ref10].

      2 De percentages, genoemd in het eerste lid, onderdelen b, c en d, worden verhoogd met:

      a. 10 procentpunten, indien de aanvrager een middelgrote onderneming is en de subsidiabele kosten worden gemaakt en
      betaald door deze middelgrote onderneming;

      b. 20 procentpunten, indien de aanvrager een kleine onderneming is en de subsidiabele kosten worden gemaakt en
      betaald door deze kleine onderneming.

      3 De percentages, genoemd in het eerste lid, onderdelen b en c, worden verhoogd met 10 procentpunten, indien
      voldaan wordt aan ten minste één van de voorwaarden, bedoeld in artikel 25, zesde lid, onderdeel b, onder i, aanhef
      en eerste of tweede streepje, of ii, van de algemene groepsvrijstellingsverordening.

      4 De subsidie bedraagt per Nederlands belangrijk project ten hoogste het bedrag dat beschikbaar is op grond van het
      toepasselijke subsidieplafond en niet meer dan:

      a. het in het Europees goedkeuringsbesluit opgenomen maximum subsidiebedrag per subsidieaanvrager die het
      Nederlandse belangrijke project uitvoert, indien de activiteiten bestaan uit onderzoek en ontwikkeling, de
      eerste industriële toepassing van innovatieve producten of diensten of infrastructuurprojectactiviteiten
      in de sectoren milieu, energie of digitalisering door een onderneming als bedoeld in
      [artikel 3.27.2, tweede lid, onderdeel a][ref11];

      b. € 15.000.000 per subsidieaanvrager, voor zover de activiteiten bestaan uit industrieel onderzoek
      of experimentele ontwikkeling door een onderneming of onderzoeksorganisatie als bedoeld in
      [artikel 3.27.2, tweede lid, onderdelen b en c][ref12];

      c. € 7.500.000 per subsidieaanvrager, voor zover de activiteiten bestaan uit:

      1°. een haalbaarheidsstudie door een onderneming of onderzoeksorganisatie als bedoeld in
      [artikel 3.27.2, tweede lid, onderdelen b en c][ref13];

      2°. het verrichten van investeringen door een middelgrote of kleine onderneming als bedoeld in
      [artikel 3.27.2, tweede lid, onderdeel d][ref14]; of

      3°. proces- en organisatie-innovatie door een onderneming als bedoeld in
      [artikel 3.27.2, tweede lid, onderdeel f][ref15];

      d. € 20.000.000 per onderzoeksinfrastructuur van de subsidieaanvrager of het Nederlandse samenwerkingsverband, voor
      zover de activiteiten bestaan uit de bouw of het upgraden van onderzoeksinfrastructuur door een onderneming als
      bedoeld in [artikel 3.27.2, tweede lid, onderdeel e][ref16].


