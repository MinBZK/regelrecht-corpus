  - number: 3.11.3
    text: |-
      1 Voor subsidie komt niet in aanmerking een financier die een kredietovereenkomst sluit met een MKB-ondernemer die:

      a. een onderneming in stand houdt waarvan de laatste jaaromzet voor 50 procent of meer is verkregen, of, indien de
      onderneming nog geen heel jaar is gedreven, waarvan de omzet naar verwachting voor 50 procent of meer zal worden
      verkregen, uit:

      1°. de uitoefening van het bank, verzekerings- of beleggingsbedrijf, of het financieren van een of meer andere
      ondernemingen of

      2°. het verwerven, vervreemden, beheren of exploiteren van onroerende zaken of het ontwikkelen van onroerende
      zaakprojecten;

      b. een aanbieder is als bedoeld in [artikel 1, onderdeel c, van de Wet marktordening gezondheidszorg][ref1];

      c. een onderneming in stand houdt die actief is in:

      1°. de sector visserij en aquacultuur;

      2°. de primaire productie van landbouwproducten, of

      3°. de sector verwerking en afzet van landbouwproducten in de gevallen, bedoeld in artikel 1, eerste lid, onder c,
      van de algemene de-minimisverordening;

      d. een onderneming in stand houdt:

      1°. waartegen een collectieve insolventieprocedure loopt, of

      2°. die voldoet aan de criteria om op verzoek van zijn schuldeisers aan een collectieve insolventieprocedure te
      worden onderworpen.

      2 In afwijking van het eerste lid kan een financier die een kredietovereenkomst sluit met een MKB-ondernemer die
      actief is in een van het toepassingsgebied van de algemene de-minimisverordening uitgesloten sector, bedoeld in het
      eerste lid, onder c, wel voor subsidie in aanmerking komen, indien:

      a. de MKB-ondernemer ook actief is in één of meer van de sectoren of andere activiteiten verricht die onder de
      algemene de-minimisverordening vallen, en

      b. de financier aan de MKB-ondernemer door middel van de kredietovereenkomst de verplichting oplegt dat:

      1°. de MKB-ondernemer de verleende subsidie uitsluitend zal gebruiken voor de financiering van activiteiten die
      zullen plaatsvinden binnen de sectoren die binnen het toepassingsgebied van de algemene de-minimisverordening
      vallen;

      2°. de inrichting van de administratie van de MKB-ondernemer zodanig zal zijn dat voor zover de MKB-ondernemer
      activiteiten verricht die buiten het toepassingsgebied van de algemene de-minimisverordening vallen, deze
      activiteiten zowel financieel als administratief gescheiden worden uitgevoerd van de activiteiten dat met deze
      subsidie wordt ondersteund.

      3 Geen subsidie wordt verleend voor activiteiten die direct verband houden met:

      1°. de omvang van de uitvoer naar andere lidstaten van de Europese Unie of derde landen;

      2°. het oprichten en exploiteren van een distributienet ten behoeve van de uitvoer, of

      3°. andere lopende uitgaven direct verband houdend met activiteiten op het gebied van uitvoer.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel1
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.11.3
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '1'
  - number: 3.11.4
    text: |-
      1 Voor een kredietovereenkomst met een MKB-ondernemer dan wel een innovatieve MKB-ondernemer bedraagt het tarief,
      bedoeld in [artikel 32, derde lid, van het besluit][ref1], eenmalig:

      a. 3,90 procent respectievelijk 5,55 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet
      betreft met een looptijd van niet langer dan twee jaar;

      b. 4,25 procent respectievelijk 6,10 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet
      betreft met een looptijd van meer dan twee jaar, maar niet langer dan zes jaar, en

      c. 5,85 procent respectievelijk 8,35 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet
      betreft met een looptijd van meer dan zes jaar, maar niet langer dan twaalf jaar.

      2 In afwijking van het eerste lid, kan in een kredietovereenkomst waarvoor op of na 1 januari 2017 een aanvraag als
      bedoeld in [artikel 3.11.2][ref2] wordt ingediend, worden gekozen voor een gespreide provisiebetaling, indien deze
      keuze betrekking heeft op alle bedrijfsborgstellingskredieten die onder de overeenkomst van borgtocht vallen.

      3 Voor een kredietovereenkomst met een MKB-ondernemer dan wel een innovatieve MKB-ondernemer bestaat de gespreide
      provisie, bedoeld in het tweede lid, uit:

      a. een afsluitprovisie van 2,35 procent respectievelijk 3,35 procent voor de afsluiting van de kredietovereenkomst,
      en

      b. een jaarlijkse provisie van 0,68 procent respectievelijk 1,03 procent van de door de minister actueel
      geregistreerde borgstellingsstand op 1 januari van ieder kalenderjaar na de afsluiting van de kredietovereenkomst.

      4 Indien het bedrijfsborgstellingskrediet waar de overeenkomst van borgtocht betrekking op heeft voor het einde
      van de bij de afsluiting van de kredietovereenkomst overeengekomen looptijd is afgelost, bedraagt de hoogte van de
      te betalen resterende provisie de som van de gespreide provisie die voor de resterende looptijd betaald had moeten
      worden.

      5 In afwijking van het eerste en tweede lid, bedraagt voor een kredietovereenkomst met een MKB-ondernemer het
      tarief, bedoeld in [artikel 32, derde lid, van het besluit][ref3], eenmalig:

      a. 2 procent, indien sprake is van een bedrijfsborgstellingskrediet als bedoeld in [bijlagen 3.11.1][ref4], artikel
      3, eerste lid, onderdeel k, subonderdeel 5°, [3.11.2][ref5], artikel 3, eerste lid, onderdeel k, subonderdeel
      5°, of [3.11.3][ref6], artikel 3, eerste lid, onderdeel k, subonderdeel 5°, en de overeenkomst van borgtocht een
      bedrijfsborgstellingskrediet betreft met een looptijd van ten hoogste twee jaar;

      b. 3 procent, indien sprake is van een bedrijfsborgstellingskrediet als bedoeld in [bijlagen 3.11.1][ref7], artikel
      3, eerste lid, onderdeel k, subonderdeel 5°, [3.11.2][ref8], artikel 3, eerste lid, onderdeel k, subonderdeel
      5°, of [3.11.3][ref9], artikel 3, eerste lid, onderdeel k, subonderdeel 5°, en de overeenkomst van borgtocht een
      bedrijfsborgstellingskrediet betreft met een looptijd van meer dan twee jaar tot en met ten hoogste vier jaar.


