    text: |-
      1 Een aanvraag voor subsidie op grond van deze titel bevat ten minste de gegevens, bedoeld in artikel 6, tweede
      lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie op grond van deze titel ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het nummer waarmee de onderneming is
      geregistreerd bij de Kamer van Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. de kerngegevens en onderbouwing van het financieringsplan, vroegefaseplan of vernieuwingsfaseplan.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.16.19
  - number: 3.16.20
    text: |-
      1 De uitvoeringsovereenkomst, bedoeld in [artikel 3.16.1i][ref1], bestaat uit een samenstelling van de
      standaardbepalingen die zijn opgenomen in [bijlage 3.16.1a][ref2] en andere bepalingen die strekken tot
      verwezenlijking van het doel van deze titel.

      2 De uitvoeringsovereenkomst, bedoeld in [artikel 3.16.6][ref3] bestaat uit een samenstelling van de
      standaardbepalingen die zijn opgenomen in [bijlage 3.16.2][ref4] en andere bepalingen die strekken tot
      verwezenlijking van het doel van deze titel.

      3 De uitvoeringsovereenkomst, bedoeld in de [artikelen 3.16.11][ref5] en [3.16.18][ref6] bestaat uit een
      samenstelling van de standaardbepalingen die zijn opgenomen in [bijlage 3.16.3][ref7] en andere bepalingen die
      strekken tot verwezenlijking van het doel van deze titel.


