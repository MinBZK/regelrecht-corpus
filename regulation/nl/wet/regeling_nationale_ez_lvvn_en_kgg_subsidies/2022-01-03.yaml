    text: |-
      1 De subsidie bedraagt voor een MVI Energie-project:

      a. 50% van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek;

      b. 80% van de subsidiabele kosten voor zover deze betrekking hebben op niet-economische activiteiten van
      onderzoeksorganisaties.

      2 Het in het eerste lid, onderdeel a, genoemde percentage wordt voor ondernemingen met 10 procentpunten verhoogd,
      indien het project samenwerking met een onderzoeksorganisatie betreft, de onderzoeksorganisatie minstens 10% van
      de subsidiabele projectkosten draagt en de onderzoeksorganisatie het recht heeft de resultaten van het project te
      publiceren voor zover deze afkomstig zijn van het door die organisatie uitgevoerde onderzoek.

      3 De subsidie bedraagt maximaal € 250.000 per MVI Energie-project.
