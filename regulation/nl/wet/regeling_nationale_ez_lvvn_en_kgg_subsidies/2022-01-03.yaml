  - number: 4.2.70b
    text: |-
      De subsidie, bedoeld in [artikel 4.2.65][ref1], met uitzondering van de subsidie voor zover deze betrekking heeft
      op niet-economische activiteiten van onderzoeksorganisaties, bevat staatssteun en wordt gerechtvaardigd door de
      artikelen 25, 36, 38, 41, 46, 47 en 56 van de algemene groepsvrijstellingsverordening.


