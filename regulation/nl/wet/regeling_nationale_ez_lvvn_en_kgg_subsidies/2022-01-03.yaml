  - number: 4.7.1
    text: |-
      In deze titel wordt verstaan onder:

        - *bedrijfspand:* pand dat de mkb-onderneming in eigendom heeft of huurt, en waarin de mkb-onderneming diens
      werkzaamheden verricht, met een jaarlijks energieverbruik van minder dan 25.000 kubieke meter aardgasequivalenten
      en minder dan 50.000 kilowatt uur elektriciteit;
        - *bedrijfsvoering:* alle handelingen die een mkb-onderneming bedrijfsmatig onderneemt die niet zien op het gebruik
      van het bedrijfspand;
        - *energieadviseur:* **onderneming die bedrijfsmatig onderzoek doet naar en adviseert over mogelijke door een mkb-
      onderneming te nemen verduurzamingsmaatregelen en die niet werkzaam is bij die mkb-onderneming;
        - *energieregisseur:* onderneming die bedrijfsmatig ondersteunt bij de door een mkb-onderneming te nemen
      verduurzamingsmaatregelen en die niet werkzaam is bij die mkb-onderneming;
        - *mkb-onderneming:* onderneming naar Nederlands recht met maximaal 250 fte’s in dienst en een jaaromzet van
      maximaal € 50.000.000, die minstens één bedrijfspand bezit of huurt;
        - *verduurzamingsmaatregel:* maatregel die aantoonbaar direct leidt tot energiebesparing of een reductie van CO-
      uitstoot, niet zijnde een gedragsmaatregel.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.7.1
  - number: 4.7.2
    text: |-
      1 De Minister verstrekt op aanvraag aan een mkb-onderneming:

      a. subsidie voor de gemaakte kosten voor het advies van een energieadviseur, opgesteld na 2 augustus 2021, over
      verduurzamingsmaatregelen voor het bedrijfspand of voor de bedrijfsvoering van die mkb-onderneming, indien het
      advies aan de mkb-onderneming is opgesteld vóór het in opdracht geven van de verduurzamingsmaatregelen;

      b. subsidie voor de gemaakte kosten voor de ondersteuning door een energieadviseur of energieregisseur bij het
      uitvoeren van één of meer verduurzamingsmaatregelen welke volgen uit het advies, bedoeld onder a;

      2 Het eerste lid, onder b, is van overeenkomstige toepassing, indien voor het advies, bedoeld in het eerste
      lid, onder a, geen subsidie is aangevraagd, en de kosten zien op ondersteuning bij het uitvoeren van één of meer
      verduurzamingsmaatregelen die volgen uit een advies dat is opgesteld na 2 augustus 2021 en vóór het in opdracht
      geven van de verduurzamingsmaatregelen en dat advies de gegevens, bedoeld in [artikel 4.7.4, tweede lid][ref1],
      bevat.

      3 Een mkb-onderneming die voor één bedrijfspand beide subsidies, bedoeld in het eerste lid, wil aanvragen, doet dat
      in één aanvraag.

      4 Een mkb-onderneming kan per bedrijfspand eenmalig de subsidies, bedoeld in het eerste lid, aanvragen. De mkb-
      onderneming dient per bedrijfspand één aanvraag in.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.7.4
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.7.2
    references:
