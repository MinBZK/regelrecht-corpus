  - number: 4.5.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie voor een investering of combinatie van investeringen die bestemd is
      voor:

      a. de productie van duurzame energie;

      b. energiebesparende isolatiemaatregelen; of

      c. de aansluiting op een warmtenet.

      2 Voor zover de subsidie betrekking heeft op een investering voor de productie van duurzame energie als bedoeld in
      het eerste lid, onderdeel a, wordt deze verstrekt aan een ondernemer, vereniging, stichting, eigenaar-bewoner dan
      wel andere rechtspersoon of natuurlijke persoon ten behoeve van de aanschaf en het door een bouwinstallatiebedrijf
      laten installeren van één of meer van de volgende installaties:

      a. een ruimteverwarmingstoestel of een waterverwarmingstoestel dat:

      1°. is uitgerust met een lucht-waterwarmtepomp, een grond-waterwarmtepomp of een water-waterwarmtepomp;

      2°. een thermisch vermogen heeft van ten hoogste 70kW bij bivalente temperatuur in geval van een lucht-
      waterwarmtepomp dan wel bij een referentieontwerptemperatuur in geval van een grond-waterwarmtepomp of een water-
      waterwarmtepomp; en

      3°. is voorzien van een etiket, een productkaart en de bijbehorende technische documentatie;

      b. een zonneboiler, waaronder begrepen een zonneboilercombi, bestaande uit een zonne-energie-installatie die:

      1°. is bedoeld voor het maken van warm tapwater of voor het leveren van ruimteverwarming in combinatie met het
      maken van warm tapwater;

      2°. een totale apertuuroppervlakte van ten hoogste 200 vierkante meter heeft;

      3°. is voorzien van een productkaart en de bijbehorende technische documentatie; en

      4°. is voorzien van een etiket, indien sprake is van een zonneboilercombi;

      c. een installatie die wordt geplaatst op of aan een gebouw bestaande uit een samenstel van voorzieningen voor de
      productie van hernieuwbare elektriciteit uit zonlicht via fotovoltaïsche zonnepanelen:

      1°. die wordt aangesloten op het openbare Nederlandse elektriciteitsnet via een aansluiting met ten hoogste een
      totale doorlaatwaarde van 3*80 A en geschikt is voor het invoeden van de hiermee geproduceerde elektriciteit op dit
      net; en

      2°. waarvan de fotovoltaïsche zonnepanelen een gezamenlijk vermogen hebben van ten minste 15 kWp;

      d. een installatie voor de productie van hernieuwbare elektriciteit met één of meer windturbines in een daarvoor
      bestemd gebied:

      1°. die wordt aangesloten op het openbare Nederlandse elektriciteitsnet via een aansluiting met ten hoogste een
      totale doorlaatwaarde van 3*80 A; en

      2°. waarvan het rotoroppervlak per windturbine ten minste 50 m2 is.

      3 Voor zover de subsidie betrekking heeft op een investering voor energiebesparende isolatiemaatregelen als
      bedoeld in het eerste lid, onderdeel b, wordt deze verstrekt aan een eigenaar-bewoner ten behoeve van de aanschaf
      en het door een bouwbedrijf in een koopwoning laten aanbrengen van isolatiemateriaal, dat is voorzien van een
      prestatieverklaring, voor één of meer van de volgende typen energiebesparende isolatiemaatregelen:

      a. dakisolatie dan wel zolder- of vlieringvloerisolatie, waarbij:

      1°. ten minste 20 vierkante meter van de oppervlakte van het bestaande dak in de bestaande thermische schil dan
      wel, indien de zolder of vliering onverwarmd is, van ten minste 20 vierkante meter van de oppervlakte van de
      bestaande zolder- of vlieringvloer, wordt geïsoleerd;

      2°. het isolatiemateriaal een Rd-waarde van ten minste 3,5 m2K/W heeft; en

      3°. het aanbrengen van lokaal gespoten PIR of PUR gebeurt met HFK-vrije blaasmiddelen;

      b. gevelisolatie, waarbij:

      1°. ten minste 10 vierkante meter van de oppervlakte van de binnen- of buitengevel van de bestaande thermische
      schil wordt geïsoleerd; en

      2°. het isolatiemateriaal een Rd-waarde van ten minste 3,5 m2K/W heeft;

      c. glas-, kozijnpaneel- of deurisolatie in de bestaande thermische schil door het vervangen van ten minste
      8 vierkante meter van de oppervlakte van:

      1°. glas, kozijnpanelen of deuren door HR++ glas, eventueel in combinatie met nieuwe isolerende kozijnpanelen of
      nieuwe isolerende deuren met een Ud-waarde van ten hoogste 1,5 W/m2K; of

      2°. glas, kozijnpanelen of deuren door triple-glas, in combinatie met een nieuw isolerend kozijn met een U-waarde
      van ten hoogste 1,5 W/ m2K, eventueel in combinatie met nieuwe isolerende kozijnpanelen of nieuwe isolerende deuren
      met een Ud-waarde van ten hoogste 1,0 W/m2K;

      d. spouwmuurisolatie, waarbij:

      1°. ten minste 10 vierkante meter van de oppervlakte van bestaande spouwmuren in de bestaande thermische schil
      wordt geïsoleerd;

      2°. het isolatiemateriaal een Rd-waarde van ten minste 1,1 m2K/W heeft; en

      3°. het aanbrengen van lokaal gespoten PIR of PUR gebeurt met HFK-vrije blaasmiddelen;

      e. vloer- dan wel bodemisolatie, waarbij:

      1°. ten minste 20 vierkante meter van de oppervlakte van de bestaande vloer of de bestaande bodem in de bestaande
      thermische schil wordt geïsoleerd;

      2°. het isolatiemateriaal een Rd-waarde van ten minste 3,5 m2K/W heeft; en

      3°. het aanbrengen van lokaal gespoten PIR of PUR gebeurt met HFK-vrije blaasmiddelen.

      4 Voor zover de subsidie betrekking heeft op een investering voor de aansluiting op een warmtenet als bedoeld in
      het eerste lid, onderdeel c, wordt deze verstrekt aan een eigenaar-bewoner dan wel vereniging van eigenaren ten
      behoeve van het door een warmteleverancier aansluiten van:

      a. een bestaande koopwoning op een individuele aansluiting op een warmtenet; respectievelijk

      b. een bestaand appartementencomplex op een centrale aansluiting op een warmtenet.

      5 Het tweede lid is van overeenkomstige toepassing op een aanvraag van een provincie of gemeente die, of
      openbaar lichaam als bedoeld in de [Wet gemeenschappelijke regelingen][ref1] dat, optreedt als marktpartij of als
      eigenaar of huurder van een roerende of onroerende zaak, onder dezelfde voorwaarden als natuurlijke personen en
      rechtspersonen niet zijnde medeoverheden.

      6 Subsidie voor een installatie als bedoeld in het tweede lid, onderdeel c of d, wordt aan natuurlijke personen
      uitsluitend verstrekt voor een installatie die bestemd is voor gebruik ten behoeve van een onderneming die door de
      desbetreffende natuurlijke persoon in stand wordt gehouden.

      7 Het gezamenlijk vermogen, bedoeld in het tweede lid, onderdeel c, wordt bepaald door het totale vermogen dat
      geleverd wordt door alle fotovoltaïsche zonnepanelen die onderling met elkaar verbonden zijn voor de productie van
      elektriciteit met een instraling van 1.000 W/ m2 en een zonneceltemperatuur van 25°C.

      8 Het rotoroppervlak per windturbine, bedoeld in het tweede lid, onderdeel d, subonderdeel 2°, wordt berekend door:

      a. het kwadraat van de diameter van de rotor in meters te delen door vier en vervolgens te vermenigvuldigen met pi
      (π), indien het een windturbine met een horizontale as betreft; of

      b. de diameter van de rotor in meters te vermenigvuldigen met de hoogte van de rotor in meters, indien het een
      windturbine met een verticale as betreft.


