  - number: 4.2.8
    text: |-
      In deze paragraaf wordt verstaan onder TSE Industrieproject: project bestaande uit industrieel onderzoek of
      experimentele ontwikkeling of een combinatie van deze vormen, dat past binnen de in [bijlage 4.2.1][ref1] (TSE
      Industrie) opgenomen beschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.8
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 4.2.9
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een deelnemer in een samenwerkingsverband voor het uitvoeren
      van een TSE Industrieproject.

      2 Een samenwerkingsverband bevat ten minste één onderneming.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.9
  - number: 4.2.10
    text: |-
      1 De subsidie bedraagt voor een TSE Industrieproject:

      a. 50% van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek;

      b. 25% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling;

      c. 80% van de subsidiabele kosten voor zover deze betrekking hebben op niet-economische activiteiten van
      onderzoeksorganisaties.

      2 De percentages, genoemd in het eerste lid, onderdelen a en b, worden verhoogd met:

      a. 10 procentpunten, indien de aanvrager een middelgrote onderneming is en de subsidiabele kosten worden gemaakt en
      betaald door de middelgrote onderneming; of

      b. 20 procentpunten, indien de aanvrager een kleine onderneming is en de subsidiabele kosten worden gemaakt en
      betaald door de kleine onderneming.

      3 De subsidie bedraagt maximaal € 500.000 per TSE Industrieproject.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.10
  - number: 4.2.11
    text: De minister verdeelt de subsidieplafonds op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.11
  - number: 4.2.12
    text: |-
      1 De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is vier jaar.

      2 In afwijking van het eerste lid is de termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref2]
      twee jaar voor projecten die passen binnen het in [bijlage 4.2.1][ref3], onderdeel B, opgenomen thema ‘Circulaire
      economie’.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
