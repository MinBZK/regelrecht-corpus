  - number: '5.3'
    text: |-
      1 Op aanvragen om subsidie die vóór de inwerkingtreding van deze regeling zijn ingediend, op subsidies die vóór
      de inwerkingtreding van deze regeling zijn verleend en op subsidies die vóór de inwerkingtreding van deze regeling
      zijn vastgesteld blijft het recht van toepassing zoals dat luidde onmiddellijk vóór dat tijdstip.

      2 Op subsidies die vóór 1 januari 2015 zijn verleend en op subsidies die vóór 1 januari 2015 zijn vastgesteld
      blijft het recht van toepassing zoals dat luidde vóór dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel5.3
  - number: '5.4'
    text: |-
      Op aanvragen om subsidie die zijn ingediend voor het tijdstip van inwerkingtreding van een wijziging van deze
      regeling, op subsidies die voor dat tijdstip zijn verleend en op subsidies die voor dat tijdstip zijn vastgesteld,
      blijft deze regeling van toepassing zoals deze luidde voor dat tijdstip tenzij de wijziging met terugwerkende
      kracht in werking treedt.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel5.4
  - number: '5.5'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst, met dien verstande dat [titel 2.2][ref1] terugwerkt tot en met het tijdstip waarop de Regeling van
      de Staatssecretaris van Economische Zaken van 30 juni 2014, nr. WJZ / 14104248, houdende wijziging van de Regeling
      LNV-subsidies in verband met de openstelling van de mogelijkheid van subsidies ten behoeve van de verduurzaming van
      de veehouderij in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Hoofdstuk2
