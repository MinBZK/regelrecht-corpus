  - number: 3.22.13
    text: |-
      1 De subsidieontvanger draagt er zorg voor dat bij alle op het publiek gerichte voorlichtings- en
      publiciteitsmaatregelen die betrekking hebben op de gesubsidieerde activiteiten, duidelijk wordt gemaakt dat voor
      de desbetreffende activiteiten subsidie is verkregen van de minister.

      2 De subsidieontvanger verleent medewerking aan voorlichtings- en publiciteitsmaatregelen met betrekking tot de
      gesubsidieerde activiteiten door de minister of een door de minister aangewezen derde.

      3 De verplichtingen, bedoeld in het eerste en tweede lid, gelden tot één jaar na de dag waarop de subsidie wordt
      vastgesteld.
