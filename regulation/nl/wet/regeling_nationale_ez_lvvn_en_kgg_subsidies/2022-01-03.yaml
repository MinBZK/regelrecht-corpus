  - number: 3.6.14
    text: |-
      De subsidie, bedoeld in [artikel 3.6.2, eerste lid][ref1], bevat, met uitzondering van niet-economisch industrieel
      onderzoek of experimentele ontwikkeling door een onderzoeksorganisatie, staatsteun en wordt gerechtvaardigd door
      artikel 25 van de algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.6.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.6.14
