  - number: 4.5.9a
    text: |-
      Bijdragen van gemeenten, provincies, waterschappen of openbare lichamen als bedoeld in
      [artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen][ref1], aan eigenaar-bewoners worden aangemerkt
      als publieke cofinanciering, en blijven bij de toepassing van [artikel 6, eerste lid, van het besluit][ref2] buiten
      beschouwing voor zover het de berekening betreft van het maximumbedrag dat krachtens deze titel per investering kan
      worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel6
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.5.9a
