  - number: 2.15.4
    text: |-
      1 Voor subsidie, bedoeld in [artikel 2.15.2, eerste lid][ref1], komen uitsluitend de kosten in aanmerking:

      a. bedoeld in artikel 53, vierde lid, onderdeel c van de algemene groepsvrijstellingsverordening, indien de
      aanvrager niet hoofdzakelijk actief is in de primaire landbouwproductie;

      b. bedoeld in artikel 14, zesde lid, onderdeel e van de groepsvrijstellingsverordening landbouw, indien de
      aanvrager hoofdzakelijk actief is in de primaire landbouwproductie.

      2 Voor subsidie, bedoeld in [artikel 2.15.2, tweede lid][ref2], komen uitsluitend de kosten in aanmerking, bedoeld
      in artikel 53, vierde lid, onderdeel c, van de algemene groepsvrijstellingsverordening, waaronder de kosten voor
      de verwerving, bodemonderzoek, de kosten voor het kadastraal recht en het registratierecht, de notariskosten,
      waaronder mede worden verstaan de kosten van het opmaken van de notariële akte, en de kosten van inschrijving in
      openbare registers, indien de aanvrager niet hoofdzakelijk actief is in de primaire landbouwproductie.

      3 Voor subsidie komen niet in aanmerking:

      a. kosten die verband houden met de activiteiten, bedoeld in artikel 14, negende lid, van de
      groepsvrijstellingsverordening landbouw, indien de aanvrager hoofdzakelijk actief is in de primaire landbouw;

      b. kosten die verband houden met regulier beheer van natuurerfgoed.


