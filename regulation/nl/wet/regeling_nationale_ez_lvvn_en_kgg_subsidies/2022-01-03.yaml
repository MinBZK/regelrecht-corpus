  - number: 4.6.7
    text: |-
      1 De minister besluit afwijzend op een aanvraag indien:

      a. er onvoldoende vertrouwen is dat de terugverdientijd, bedoeld in
      [artikel 2.15, eerste lid, van het Activiteitenbesluit milieubeheer][ref1] van de investering meer dan vijf jaar
      zou zijn in het geval geen subsidie op grond van deze titel verleend zou worden;

      b. het project zekere of voorwaardelijke maatregelen betreft ten aanzien waarvan de aanvrager als deelnemer van de
      Meerjarenafspraak energie-efficiëntie 2001–2020, de Meerjarenafspraak Energie-efficiëntie ETS-ondernemingen (MEE)
      of het Addendum Meerjarenafspraak energie-efficiëntie ETS-ondernemingen (MEE) verplichtingen op zich heeft genomen
      ter verbetering van de energie-efficiëntie;

      c. de kwaliteit van het project onvoldoende is, blijkend uit de uitwerking van aanpak en methodiek, de omgang
      met risico’s, de uitvoerbaarheid, de deelnemende partijen en de mate waarin de beschikbare middelen effectief en
      efficiënt worden ingezet;

      d. de te verlenen subsidie minder dan € 125.000,– zou bedragen;

      e. de aanvrager onvoldoende aannemelijk heeft gemaakt dat het een project betreft ten behoeve van een investering
      die zich in drie of meer soortgelijke projecten in de industrie in Nederland bewezen heeft;

      f. voor het project op grond van [artikel 4.2.65][ref2] een aanvraag om subsidie ingediend kan worden.

      2 Bij de berekening van de terugverdientijd, bedoeld in het eerste lid, onderdeel a, wordt gebruikgemaakt van de
      methode die is opgenomen in bijlage 10a van de Activiteitenregeling milieubeheer.

      3 In afwijking van het tweede lid kunnen bij de berekening van de terugverdientijd, bedoeld in het eerste
      lid, onderdeel a, bedrijfsspecifieke energieprijzen gehanteerd worden die afwijken van de standaardwaarden
      in [bijlage 10a van de Activiteitenregeling milieubeheer][ref3], indien de aanvrager aantoont dat de
      in [artikel 4.6.2][ref4] bedoelde investeringen geen energiebesparende maatregelen zijn als bedoeld in
      [artikel 2.15, eerste lid, van het Activiteitenbesluit milieubeheer][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.15
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.65
