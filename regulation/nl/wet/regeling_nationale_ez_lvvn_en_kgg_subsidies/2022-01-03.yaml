    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een TO2-innovatieve starter voor het uitvoeren van een
      haalbaarheidsstudie TO2-innovatieve starter.

      2 Bij zijn aanvraag legt de TO2-innovatieve starter een overeenkomst over als bedoeld in de definitie van TO2-
      innovatieve starter in [artikel 3.16.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.16.1
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.16.11a
