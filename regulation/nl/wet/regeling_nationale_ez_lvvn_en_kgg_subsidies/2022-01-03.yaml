  - number: B2.15.1:6
    text: |-
      De Staat en de Begunstigde kunnen beiden de andere Partij verzoeken de gevolgen van de overeenkomst te wijzigen of
      deze geheel of gedeeltelijk te ontbinden op grond van onvoorziene omstandigheden welke van dien aard zijn dat de
      wederpartij naar maatstaven van redelijkheid en billijkheid ongewijzigde instandhouding van de overeenkomst niet
      mag verwachten. In geval van een beroep door een van de partijen op dit artikel wordt voor de toepassing van het
      artikel aansluiting gezocht bij [artikel 258 e.v. van Boek 6 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel258
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '258'
  - number: B2.15.1:7
    text: |-
      1 De Staat en de Begunstigde komen overeen dat de overeengekomen verplichtingen om te dulden of niet te doen
      ten aanzien van het Terrein zullen overgaan op diegenen die het desbetreffende goed onder bijzondere titel
      zullen verkrijgen en dat mede gebonden zullen zijn degenen, die van de rechthebbende op het desbetreffende
      goed een recht tot gebruik van het goed zullen verkrijgen. De Staat en de Begunstigde geven elkaar over
      en weer een onherroepelijke volmacht om de inhoud van deze overeenkomst daartoe als beding in de zin van
      [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref1] in te schrijven in de desbetreffende (openbare) registers
      op de wijze, zoals de toepasselijke wetten dit voorschrijven. Deze volmacht is als onderdeel van deze overeenkomst
      onherroepelijk en vervalt niet door overlijden of onbekwaamheid van de Begunstigde of beperkt gerechtigde.

      2 Indien en voor zover één of meer bepalingen in artikel 3 van deze overeenkomst niet kunnen kwalificeren als
      kwalitatieve verplichtingen als bedoeld in [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref2], zal de
      Begunstigde (alsmede diens rechtsopvolgers) jegens de Staat verplicht zijn de betreffende verplichtingen bij
      overdracht van het Terrein als kettingbeding op te leggen aan opvolgende eigenaar(s) en door deze te doen
      aanvaarden en voorts de daaruit voor de Staat voortvloeiende rechten namens de Staat aan te nemen. In verband met
      dit kettingbeding is Begunstigde (alsmede diens rechtsopvolgers) jegens de Staat verplicht om de bepalingen in
      artikel 3 van deze overeenkomst, in iedere akte van overdracht letterlijk aan te halen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel252
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel252
