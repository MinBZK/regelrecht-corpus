  - number: 3.2.11
    text: |-
      1 De minister beslist afwijzend op een aanvraag voor PPS-projecttoeslag indien: (Externe link)

      a. ten aanzien van de aanwending van PPS-projecttoeslag voor een samenwerkingsproject niet wordt voldaan aan
      de voorwaarden in paragraaf 2.2.2, nummer 28, onderdeel b, c of d in samenhang met nummer 29, van de O&O&I-
      kaderregeling;

      b. de aanwending van PPS-projecttoeslag voor een samenwerkingsproject leidt tot een overschrijding van de
      aanmeldingsdrempel, bedoeld in artikel 4 van de algemene groepsvrijstellingsverordening, voor fundamenteel of
      industrieel onderzoek of experimentele ontwikkeling;

      c. niet verzekerd is dat ondernemers en onderzoeksinstellingen onder transparante en redelijke voorwaarden in
      aanmerking komen voor deelname aan samenwerkingsprojecten die bijdragen aan het TKI-programma;

      d. het bestaan van een samenwerkingsproject, en de verschuldigdheid van private bijdragen en inzet in natura
      daaraan, niet kan worden aangetoond aan de hand van een schriftelijke ondertekende samenwerkingsovereenkomst;

      e. het samenwerkingsproject waarvoor de projecttoeslag wordt aangewend niet bijdraagt aan de Nederlandse
      kennisinfrastructuur;

      f. een bepaald samenwerkingsproject is gestart voorafgaand aan de eerste aanvraag waarbij aanwending van de PPS-
      toeslag of TKI-toeslag voor dat project werd aangevraagd;

      g. in geval van een aanvraag van een TKI: de aanwending van de projecttoeslag voor het samenwerkingsproject niet
      bijdraagt aan het TKI-programma;

      h. in geval van een aanvraag van een penvoerder als bedoeld in [artikel 3.2.9, eerste lid, onderdeel b][ref1]:

      1°. de totale subsidiabele kosten van het samenwerkingsproject waarvoor de PPS-projecttoeslag wordt aangevraagd,
      gerekend over de gehele looptijd van het samenwerkingsproject, minder dan € 2.000.000 bedragen;

      2°. de gezamenlijke private bijdragen en inzet in natura voor de uitvoering van het samenwerkingsproject minder dan
      30% van de totale subsidiabele kosten van het samenwerkingsproject bedragen.

      i. het samenwerkingsproject een looptijd heeft van meer dan tien jaar.

      2 De subsidiabele kosten, bedoeld in het eerste lid, onderdeel h, zijn kosten als bedoeld in artikel 25, derde lid,
      van de algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.9
