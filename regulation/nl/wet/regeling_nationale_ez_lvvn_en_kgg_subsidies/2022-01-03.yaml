  - number: '5.6'
    text: 'Deze regeling wordt aangehaald als: Regeling nationale EZK- en LNV-subsidies.'
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel5.6
  - number: B2.15.1:1
    text: |-
      Voor de betekenis van de gehanteerde begrippen wordt aangesloten bij hetgeen in de Regeling nationale EZK- en LNV-
      subsidies, subsidiemodule Versneld natuurherstel, is bepaald.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel1
  - number: B2.15.1:2
    text: |-
      De Begunstigde is eigenaar van het terrein, kadastraal bekend onder [naam gemeente], sectie [sectie-aanduiding],
      nummer(s) [nummer(s)], met een totale grootte van [aantal hectares] hectares (hierna te noemen: het ‘Terrein’).
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2
  - number: B2.15.1:3
    text: |-
      a. de Begunstigde gebruikt het Terrein niet voor of in verband met de uitoefening van de landbouw;

      b. de Begunstigde gedoogt op het Terrein voor onbepaalde tijd het uitvoeren van natuurherstelmaatregelen die leiden
      tot verbetering van de kwaliteit of uitbreiding van de oppervlakte van stikstofgevoelige natuurlijke habitats of
      habitats van soorten, alsmede de instandhouding daarvan, waarvoor subsidie is verleend op grond van de Regeling
      nationale EZK- en LNV-subsidies, subsidiemodule Versneld natuurherstel;

      c. de Begunstigde laat al datgene na dat het gestelde onder b belemmert, bemoeilijkt of verhindert;

      d. de Begunstigde gebruikt het Terrein niet voor andere doeleinden dan voor de ontwikkeling dan wel de
      natuurherstelmaatregelen die leiden tot verbetering van de kwaliteit of uitbreiding van de oppervlakte van
      stikstofgevoelige natuurlijke habitats of habitats van soorten, alsmede de instandhouding daarvan, waarvoor
      subsidie is verleend op grond van de subsidiemodule Versneld natuurherstel.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3
  - number: B2.15.1:4
    text: |-
      1 De verplichting ten laste van het (deel van het) Terrein zoals weergegeven op bijgevoegde kaart
      ten behoeve van de Staat dient te worden opgemaakt als een kwalitatieve verplichting in de zin van
      [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref1] met de inhoud als omschreven in artikel 3 van deze
      overeenkomst.

      2 Partijen zullen op de kortst mogelijke termijn zorgdragen voor opmaking van deze overeenkomst
      in een notariële akte, gevolgd door inschrijving daarvan in de openbare registers als bedoeld in
      artikel 252, tweede lid, van het Burgerlijk Wetboek. Voor zover een derde betrokken is als bedoeld in
      [artikel 252, derde lid, onderdeel a, van Boek 6 van het Burgerlijk Wetboek][ref2], heeft Begunstigde hiertoe
      voorafgaande schriftelijke toestemming verkregen van de betreffende derde, welke als bijlage aan deze overeenkomst
      wordt gevoegd.

      3 De kosten van het opmaken van de notariële akte en van de inschrijving in de openbare registers zijn ten laste
      van de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel252
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel252
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4
    references:
