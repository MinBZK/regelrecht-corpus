        artikel: 3.26.7
        hoofdstuk: '3'
  - number: 3.26.7
    text: |-
      1 De minister kent aan een subsidieaanvraag voor een ambachts-ondernemerschapsproject een hoger aantal punten toe
      naarmate:

      a. het ambachts-ondernemerschapsproject meer bijdraagt aan de verwezenlijking van de doelstellingen van de
      subsidie, bedoeld in [artikel 3.26.2, eerste lid][ref1], blijkend uit:

      1°. de inhoudelijke bijdrage van de activiteiten van het ambachts-ondernemerschapsproject aan één of meer van deze
      doelstellingen; en

      2°. de mate waarin het desbetreffende ambachts-ondernemerschapsproject na afronding hiervan naar verwachting voor
      een groter aantal en verschillende typen ambachtsondernemingen een blijvend effect zal hebben;

      b. de kwaliteit van het projectplan van het ambachts-ondernemerschapsproject beter is, blijkend uit de uitwerking
      van de aanpak en de methodiek, de uitvoerbaarheid en de mate waarin de financiële middelen efficiënter worden
      ingezet;

      c. de subsidieaanvrager die het ambachts-ondernemerschapsproject zelfstandig uitvoert dan wel het
      samenwerkingsverband dat het ambachts-ondernemerschapsproject uitvoert meer geschikt is om een ambachts-
      ondernemerschapsproject uit te voeren, blijkend uit de mate waarin de daarvoor benodigde competenties,
      infrastructuur en projectorganisatie aanwezig zijn bij de subsidieaanvrager dan wel in het samenwerkingsverband.

      2 De minister kent per onderdeel van het eerste lid ten minste één en ten hoogste vijf punten toe.

      3 Voor de rangschikking wordt het aantal punten gegeven voor het eerste lid, onderdeel a, vermenigvuldigd met
      3, het eerste lid, onderdeel b, vermenigvuldigd met 2, het eerste lid, onderdeel c, vermenigvuldigd met 3, en
      vervolgens opgeteld.

      4 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.

      5 Geen subsidie wordt verleend voor een project dat lager is gerangschikt dan een project met soortgelijke
      activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.26.2
