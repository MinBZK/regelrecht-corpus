        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '8.3'
  - number: 2.12.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een vertegenwoordiger nationaal park of nationaal park in
      oprichting of aan een deelnemer in een samenwerkingsverband nationaal park of nationaal park in oprichting voor de
      volgende activiteiten die gericht zijn op het toewerken naar de ambities uit de standaard nationaal park:

      a. het organiseren van gebiedsprocessen ten behoeve van visievorming en planvorming over:

      1°. de in het gebied te realiseren ambities;

      2°. de mogelijkheden waarmee het nationaal park of het nationaal park in oprichting kan bijdragen aan de
      transitieopgaven op het gebied van klimaat, duurzame energie en landbouw; en

      3°. de wijze waarop de ambities, bedoeld onder 1°, en de mogelijkheden, bedoeld onder 2°, gerealiseerd kunnen
      worden;

      b. het opstellen van een ambitiedocument als bedoeld in de standaard nationaal park of onderdelen daarvan;

      c. het uitvoeren van studies op het gebied van regionale samenhang, ecologie of natuur;

      d. het opstellen van voorlichtings- en educatiematerialen over het gebied; of

      e. het opstellen van educatieplannen en wetenschappelijke onderzoeksplannen.

      2 De minister verstrekt ten hoogste één subsidie per nationaal park of nationaal park in oprichting.

      3 Een samenwerkingsverband nationaal park of nationaal park in oprichting is een samenwerkingsverband, bestaande
      uit organisaties die gezamenlijk de belangen behartigen van het betreffende nationaal park of nationaal park in
      oprichting, waaronder, indien van toepassing, in ieder geval de vertegenwoordiger nationaal park of nationaal park
      in oprichting.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.12.2
  - number: 2.12.3
    text: De subsidie bedraagt per aanvraag 50 procent van de subsidiabele kosten, doch ten hoogste € 400.000.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.12.3
  - number: 2.12.4
    text: |-
      De volgende kosten komen niet in aanmerking voor subsidie:

      a. kosten voor fysieke investeringen;

      b. kosten voor economische activiteiten;

      c. kosten voor natuurbeheer.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.12.4
  - number: 2.12.5
    text: De minister verdeelt het subsidieplafond evenredig over de ingediende aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.12.5
  - number: 2.12.6
    text: |-
      1 Met de uitvoering van de op grond van deze titel gesubsidieerde activiteiten wordt uiterlijk een maand na de
      datum van de beschikking tot subsidieverlening gestart.

      2 De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1] is drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.12.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 2.12.7
    text: |-
      De minister besluit afwijzend op een aanvraag indien:

      a. uit het projectplan onvoldoende blijkt hoe de activiteiten bijdragen aan het realiseren van de ambities in de
      standaard nationaal park;

      b. uit het projectplan onvoldoende blijkt hoe de subsidieaanvrager voldoet aan de subsidievoorwaarden, bedoeld in
      artikel 2.12.8;

      c. uit het projectplan onvoldoende blijkt dat het project kan steunen op draagvlak en betrokkenheid vanuit de
      regio;

      d. in het projectplan geen activiteit is opgenomen die betrekking heeft op de mogelijkheden of op een verkenning
      van de mogelijkheden waarmee het nationaal park of het nationaal park in oprichting kan bijdragen aan de
      transitieopgaven op het gebied van klimaat, duurzame energie en landbouw.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.12.7
  - number: 2.12.8
    text: |-
      1 Indien een subsidieontvanger naast de niet-economische activiteiten, bedoeld in artikel 2.12.2, eerste lid, ook
      economische activiteiten verricht, voert de subsidieontvanger met betrekking tot de financiering van en de kosten
      en inkomsten uit die economische activiteiten een gescheiden boekhouding.

      2 De activiteiten, bedoeld in artikel 2.12.2, eerste lid, bevoordelen geen individuele bedrijven.

      3 Opdrachtverlening aan derden voor het verrichten van de activiteiten, bedoeld in artikel 2.12.2, eerste lid, of
      een deel van die activiteiten, vindt plaats op basis van transparante criteria en tegen marktconforme tarieven.

      4 Alle resultaten van de activiteiten, bedoeld in artikel 2.12.2, eerste lid, worden voor een ieder zonder
      onderscheid kosteloos toegankelijk gemaakt.

      5 De voorlichtings- en educatiematerialen, bedoeld in artikel 2.12.2, eerste lid, onderdeel d, bevatten slechts
      neutrale informatie en geen gegevens of reclames van of herleidbaar tot individuele bedrijven.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.12.8
  - number: 2.12.9
    text: |-
      Bijdragen van gemeenten, provincies, waterschappen, openbare lichamen als bedoeld in
      [artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen][ref1], of andere
      bestuursorganen, worden aangemerkt als publieke cofinanciering, en blijven bij de toepassing van
      [artikel 6, eerste lid, van het besluit][ref2] buiten beschouwing voor zover het de berekening betreft van het
      maximumbedrag dat krachtens deze titel per aanvraag kan worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel6
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.12.9
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '6'
  - number: 2.12.10
    text: |-
      1 Een aanvraag voor subsidie op grond van artikel 2.12.2, eerste lid, bevat ten minste:

      a. gegevens over de aanvrager of, in geval van een samenwerkingsverband nationaal park of nationaal park in
      oprichting, over de deelnemers, waaronder de naam van de organisatie, het post- en bezoekadres, het rekeningnummer,
      en, indien van toepassing, het nummer waarmee de onderneming is geregistreerd bij de Kamer van Koophandel;

      b. gegevens over de contactpersoon bij de aanvrager of aanvragers, waaronder de naam, het telefoonnummer en het
      e-mailadres;

      c. in geval van een samenwerkingsverband nationaal park of nationaal park in oprichting: gegevens over de
      contactpersoon bij de penvoerder, waaronder de naam, het telefoonnummer, het e-mailadres en het postadres;

      d. een projectplan inclusief planning;

      e. een begroting;

      f. een intentieverklaring van een regionale overheid, waaruit blijkt dat die regionale overheid verantwoordelijk is
      voor het realiseren van de cofinanciering van de activiteiten; en

      g. indien de aanvraag betrekking heeft op een nationaal park in oprichting: een intentieverklaring van de
      gedeputeerde staten van de provincie of de provincies waarin het gebied ligt, waaruit blijkt dat de gedeputeerde
      staten van die provincie of provincies voornemens zijn uiterlijk 1 september 2021 voor het desbetreffende gebied
      een verzoek als bedoeld in [artikel 8.3, eerste lid, van de Wet natuurbescherming][ref1] te doen.

      2 Het projectplan, bedoeld in het eerste lid, onderdeel d, bevat in ieder geval een beschrijving van:

      a. de ambities uit de standaard nationaal park waar de aanvrager of aanvragers aan wil of willen werken;

      b. de geplande activiteiten en hoe deze activiteiten bijdragen aan het realiseren van de ambities uit de standaard
      nationaal park;

      c. de wijze waarop samengewerkt wordt met partners in de regio; en

      d. in geval van een nationaal park in oprichting: een beschrijving van de grenzen van het nationaal park in
      oprichting.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel8.3
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.12.10
    references:
