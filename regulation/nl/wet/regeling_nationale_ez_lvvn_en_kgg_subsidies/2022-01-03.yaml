    text: |-
      In deze paragraaf wordt verstaan onder wind op zee R&D-project: project bestaande uit industrieel onderzoek,
      experimentele ontwikkeling, of een combinatie van deze vormen, dat past binnen de in [bijlage 4.2.12][ref1]
      (Programmalijnen Wind op zee) opgenomen innovatiethema’s.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
