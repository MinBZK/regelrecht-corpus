  - number: 3.27.8
    text: |-
      1 De minister kent aan een aanvraag om subsidie voor een Nederlands belangrijk project een hoger aantal punten
      toe naarmate:

      a. de kwaliteit van het projectplan van het Nederlandse belangrijke project beter is, blijkend uit:

      1°. een onderbouwing waaruit volgt op welke wijze de doelstellingen uit het Europese belangrijke project en
      bjhorende doelstellingen van het Nederlandse belangrijke project, bedoeld in [artikel 3.27.2, eerste lid][ref1],
      gerealiseerd zullen worden;

      2°. een beschrijving van aanpak en methodiek van het Nederlandse belangrijke project, de projectactiviteiten, de
      uitvoerbaarheid van het project en de omgang met risico’s en intellectuele eigendomsrechten;

      3°. een overzicht van de wijze waarop monitoring plaatsvindt en welke prestatie-indicatoren hierbij gehanteerd
      worden;

      4°. de uitwerking van het financieringsplan en de begroting, waaronder begrepen de onderbouwing van de
      noodzakelijkheid van de benodigde subsidie per subsidieaanvrager, de mate waarin er een financieringskloof aanwezig
      is en uitwerking van het nul-scenario;

      b. de subsidieaanvrager die het Nederlandse belangrijke project zelfstandig uitvoert dan wel het Nederlandse
      samenwerkingsverband dat het Nederlandse belangrijke project uitvoert meer geschikt is om een Nederlands belangrijk
      project uit te voeren, blijkend uit:

      1°. de mate waarin de daarvoor benodigde competenties aanwezig zijn;

      2°. de mate waarin er draagvlak bestaat voor het Nederlands belangrijke project binnen het Nederlands en Europees
      samenwerkingsverband en bij andere relevante partijen;

      3°. de mate waarin de subsidieaanvrager of deelnemers aan het samenwerkingsverband succesvolle ervaring hebben
      met de uitvoering van soortgelijke projecten dan wel samen met de deelnemers in het Europese en Nederlandse
      samenwerkingsverband een innovatieve samenstelling vormen en kleine en middelgrote ondernemingen en startups
      betrekken bij de uitvoering van het project;

      4°. de kwaliteit van de projectorganisaties die aanwezig zijn bij de subsidieaanvrager dan wel in het Nederlands
      samenwerkingsverband;

      5°. de binnen het Nederlands samenwerkingsverband gemaakte afspraken en overeengekomen werkwijze;

      c. het Nederlandse belangrijke project technologisch meer vooruitstrevend is en een grotere impact heeft op de
      economie en samenleving blijkend uit de omstandigheid dat:

      1°. het project vernieuwender is ten opzichte van de internationale stand van onderzoek of techniek;

      2°. het project naar verwachting een grotere bijdrage zal leveren aan de doelstelling van het overkoepelende
      Europese belangrijk project;

      3°. het project naar verwachting zal zorgen voor grotere positieve overloopeffecten en toepassingsmogelijkheden
      voor de Europese en Nederlandse markt en samenleving, waaronder mede begrepen de verwachte bijdrage aan brede
      welvaart, de productiviteit en het verdienvermogen van Nederlandse ondernemingen en overige publieke belangen;

      4°. het project een grotere slagingskans heeft en een blijvend effect zal hebben;

      d. de financiële middelen effectiever en efficiënter worden ingezet, blijkend uit de hoogte van de gevraagde
      subsidie ten opzichte van andere financiële bijdragen aan het Nederlandse belangrijke project en de verhouding van
      de inzet van deze financiële middelen tot het beoogde resultaat, mede gelet op het nul-scenario van het Nederlandse
      belangrijke project.

      2 De minister kent per onderdeel van het eerste lid ten minste één en ten hoogste tien punten toe.

      3 Voor de rangschikking wordt het aantal punten gegeven voor het eerste lid, onderdelen c en d, vermenigvuldigd met
      2, waarna alle punten worden opgeteld.

      4 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.27.2
