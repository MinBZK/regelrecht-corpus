  - number: 4.5.11
    text: |-
      1 Een installatie, waarop de investering voor de productie van duurzame energie, bedoeld in
      [artikel 4.5.2, tweede lid][ref1], betrekking heeft, en waarvoor op grond van deze titel een subsidie is verleend,
      wordt niet binnen een jaar na de datum van de subsidievaststelling vervreemd.

      2 Het eerste lid is niet van toepassing op de vervreemding van een installatie tezamen met de woning, het bedrijf
      of de grond waarin respectievelijk waarop de investering voor de productie van duurzame energie is geïnstalleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.5.11
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 4.5.2
        hoofdstuk: '4'
  - number: 4.5.12
    text: |-
      1 Een aanvraag voor subsidie bevat ten minste:

      a. gegevens over de aanvrager, waaronder de naam, het post- en bezoekadres, het e-mailadres, het telefoonnummer,
      het rekeningnummer, en voor zover van toepassing het Burgerservicenummer of het nummer waaronder de onderneming is
      geregistreerd bij de Kamer van Koophandel en gegevens over de contactpersoon bij de aanvrager;

      b. een vermelding van het adres van de locatie of locaties waarvoor een investering bestemd is en het soort locatie
      of locaties;

      c. de meldcode van de investering, en indien er geen meldcode beschikbaar is gesteld, een omschrijving van de
      investering;

      d. indien het een investering voor een ruimteverwarmingstoestel of een waterverwarmingstoestel als bedoeld
      in [artikel 4.5.2, tweede lid, onderdeel a][ref1], betreft, het thermische vermogen bij bivalente of
      referentieontwerptemperatuur van deze installatie;

      e. indien het een investering voor een zonneboiler als bedoeld in [artikel 4.5.2, tweede lid, onderdeel b][ref2],
      betreft, de gegevens ten aanzien van de energetische opbrengst van deze installatie;

      f. indien de subsidieaanvraag betrekking heeft op een investering voor dakisolatie dan wel zolder- of
      vlieringvloerisolatie in een koopwoning via het isoleren van de bestaande zolder- of vlieringvloer als bedoeld in
      [artikel 4.5.2, derde lid, onderdeel a][ref3], een verklaring van de eigenaar-bewoner dat de zolder of vliering
      onverwarmd is;

      g. indien de subsidieaanvraag betrekking heeft op een individuele of collectieve aansluiting op een warmtenet
      als bedoeld in [artikel 4.5.2, vierde lid, onderdelen a respectievelijk b][ref4], voor zover van toepassing, een
      verklaring van de eigenaar-bewoner of van de vereniging van eigenaren dat de bestaande koopwoning of het bestaande
      appartementencomplex, waarop de desbetreffende investering betrekking heeft, geen aansluiting op een warmtenet had
      voordat deze investering plaatsvond.

      2 De aanvraag voor subsidie die betrekking heeft op een investering door een rechtspersoon of natuurlijke persoon,
      niet-zijnde eigenaar-bewoner, bevat, onverminderd het eerste lid, de gegevens, bedoeld in artikel 6, tweede lid,
      van de algemene groepsvrijstellingsverordening.

      3 De aanvraag voor subsidie die betrekking heeft op een investering door een rechtspersoon of natuurlijke persoon,
      niet-zijnde eigenaar-bewoner, gaat:

      a. indien het een investering voor een installatie voor de productie van hernieuwbare elektriciteit uit zonlicht
      als bedoeld in [artikel 4.5.2, tweede lid, onderdeel c][ref5], betreft, vergezeld van:

      1°. een document waarin aannemelijk wordt gemaakt dat het verwachte gezamenlijke vermogen van de fotovoltaïsche
      zonnepanelen ten minste 15 kWp zou bedragen;

      2°. een document waaruit blijkt dat de installatie zal worden aangesloten op het openbare Nederlandse
      elektriciteitsnet via een aansluiting met ten hoogste een totale doorlaatwaarde van 3*80 A die op naam staat van
      de aanvrager;

      3°. een afschrift van de door de aanvrager van de energieleverancier in het jaar voorafgaand
      aan de aanvraag ontvangen jaarafrekening waaruit het netto elektriciteitsverbruik, bedoeld in
      [artikel 4.5.9, tweede lid, onderdeel d][ref6], blijkt;

      b. indien het een investering voor een installatie voor de productie van hernieuwbare elektriciteit via één of meer
      windturbines als bedoeld in [artikel 4.5.2, tweede lid, onderdeel d][ref7], betreft, vergezeld van:

      1°. een aanvraag van een vergunning op grond van de [Wet algemene bepalingen omgevingsrecht][ref8];

      2°. een document waarin aannemelijk wordt gemaakt dat het verwachte rotoroppervlak per windturbine ten minste 50 m2
      zal bedragen;

      3°. een document waaruit blijkt dat de installatie zal worden aangesloten op het openbare Nederlandse
      elektriciteitsnet via een aansluiting met ten hoogste een totale doorlaatwaarde van 3*80 A die op naam staat van
      de aanvrager.

      4 De aanvraag voor subsidie die betrekking heeft op een koopwoning van een eigenaar-bewoner, gaat vergezeld van de
      volgende documenten:

      a. een factuur en betaalbewijs van de aanschaf en de installatie of het aanbrengen van de investering voor een
      ruimteverwarmingstoestel, een waterverwarmingstoestel, zonneboiler, energiebesparende isolatiemaatregelen als
      bedoeld in [artikel 4.5.2, derde lid, onderdeel a][ref9], waaronder begrepen de door het bouwinstallatiebedrijf of
      bouwbedrijf getekende factuur in geval van contante betaling van de investeringen, waarop ten minste het betaalde
      bedrag, de begunstigde en betaaldatum vermeld wordt;

      b. indien het een investering voor energiebesparende isolatiemaatregelen als bedoeld in
      [artikel 4.5.2, derde lid][ref10], betreft:

      1°. een factuur en betaalbewijs als bedoeld in onderdeel a, met daarin ten minste de naam en het adres van de
      eigenaar-bewoner en het bouwbedrijf dat werkzaamheden betreffende de investering of investeringen heeft uitgevoerd,
      een omschrijving van het soort energiebesparende isolatiemaatregel en aanverwante werkzaamheden die door het
      bouwbedrijf uitgevoerd zijn, de naam, het type, het merk, de dikte en indien beschikbaar de meldcode, van het
      isolatiemateriaal dat gebruikt is en de plaats en bijhorende oppervlakte die in de desbetreffende koopwoning
      geïsoleerd is;

      2°. ten minste één foto per energiebesparende isolatiemaatregel, genomen tijdens de uitvoering van de werkzaamheden
      door het bouwbedrijf, met daarop zichtbaar de naam, merk, soort, en dikte van het isolatiemateriaal;

      c. indien het een investering voor glas-, kozijnpaneel- of deurisolatie als bedoeld in
      [artikel 4.5.2, derde lid, onderdeel c][ref11], betreft, voor zover van toepassing, een kozijnstaat met daarin merk
      en type van het kozijn en het daarbij behorende frame, glas en netto afmetingen van het glas of de kozijnpanelen
      per kozijn;

      d. indien het een investering in een individuele aansluiting op een warmtenet als bedoeld in
      [artikel 4.5.2, vierde lid, onderdeel a][ref12], betreft:

      1°. een overeenkomst met een warmteleverancier waaruit blijkt dat de koopwoning is aangesloten op een warmtenet;

      2°. een document waaruit blijkt dat de woning niet is aangesloten op het gastransportnet als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Gaswet][ref13].


