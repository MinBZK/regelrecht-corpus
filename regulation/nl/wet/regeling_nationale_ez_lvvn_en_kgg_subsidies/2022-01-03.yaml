  - number: 4.5.3
    text: |-
      1 De subsidie voor een investering voor de productie van duurzame energie als bedoeld in
      [artikel 4.5.2, tweede lid][ref1], bedraagt voor:

      a. een verwarmingstoestel dat is geïnstalleerd voor 1 januari 2022 en is uitgerust met een lucht-waterwarmtepomp
      als bedoeld in [artikel 4.5.2, tweede lid, onderdeel a][ref2], bij een thermisch vermogen ten behoeve van
      ruimteverwarming bij bivalente temperatuur:

      1°. tot 1 kW: € 500;

      2°. vanaf 1 kW: € 1.100, vermeerderd met € 100 voor elke kW thermisch vermogen bij bivalente temperatuur vanaf
      1 kW;

      b. een verwarmingstoestel dat is geïnstalleerd op of na 1 januari 2022 en is uitgerust met een lucht-
      waterwarmtepomp als bedoeld in [artikel 4.5.2, tweede lid, onderdeel a][ref3], bij een thermisch vermogen ten
      behoeve van ruimteverwarming bij bivalente temperatuur:

      1°. tot 1 kW: € 500;

      2°. vanaf 1 kW: € 1.650, vermeerderd met € 150 voor elke kW thermisch vermogen bij bivalente temperatuur vanaf
      1 kW;

      c. een verwarmingstoestel dat is geïnstalleerd voor 1 januari 2022 en is uitgerust met een grond-waterwarmtepomp
      of met een water-waterwarmtepomp als bedoeld in [artikel 4.5.2, tweede lid, onderdeel a][ref4], bij een thermisch
      vermogen bij referentieontwerptemperatuur:

      1°. tot 1 kW: € 500;

      2°. van 1 kW tot en met 10 kW: € 2.500;

      3°. van meer dan 10 kW: € 2.500, vermeerderd met € 100 voor elke kW thermisch vermogen hoger dan 10 kW;

      d. een verwarmingstoestel dat is geïnstalleerd op of na 1 januari 2022 en is uitgerust met een grond-
      waterwarmtepomp of met een water-waterwarmtepomp als bedoeld in [artikel 4.5.2, tweede lid, onderdeel a][ref5],
      bij een thermisch vermogen bij referentieontwerptemperatuur:

      1°. tot 1 kW: € 500;

      2°. van 1 kW tot en met 10 kW: € 3.750;

      3°. van meer dan 10 kW: € 3.750, vermeerderd met € 150 voor elke kW thermisch vermogen hoger dan 10 kW;

      e. een zonneboiler als bedoeld in artikel 4.5.2, tweede lid, onderdeel b, € 0,68 per kWh jaarlijkse zonne-
      energiebijdrage van de zonneboiler bij een apertuuroppervlakte van ten hoogste 10 vierkante meter en € 0,30 per kWh
      jaarlijkse zonne-energiebijdrage van de zonneboiler bij een apertuuroppervlakte van meer dan 10 vierkante meter;

      f. een installatie voor de productie van hernieuwbare elektriciteit uit zonlicht als bedoeld in
      [artikel 4.5.2, tweede lid, onderdeel c][ref6], € 125 per kWp gezamenlijk vermogen;

      g. een installatie voor de productie van hernieuwbare elektriciteit met één of meer windturbines als bedoeld in
      [artikel 4.5.2, tweede lid, onderdeel d][ref7], € 66 per m2 rotoroppervlak.

      2 De subsidie, bedoeld in:

      a. het eerste lid, onderdelen a en c, wordt verhoogd met:

      1°. € 150, indien de warmtepomp blijkens het etiket behoort tot de energie-efficiëntieklasse A+;

      2°. € 300, indien de warmtepomp blijkens het etiket behoort tot de energie-efficiëntieklasse A++ of hoger;

      b. het eerste lid, onderdelen b en d, wordt verhoogd met:

      1°. € 225, indien de warmtepomp blijkens het etiket behoort tot de energie-efficiëntieklasse A+;

      2°. € 450, indien de warmtepomp blijkens het etiket behoort tot de energie-efficiëntieklasse A++.

      3 De jaarlijkse zonne-energiebijdrage, bedoeld in het eerste lid, onderdeel e, wordt voor zonneboilers vastgesteld
      op:

      a. 2.799 kWh, minus het jaarlijks aandeel van niet uit zonne-energie verkregen warmte volgens de productkaart
      conform het capaciteitsprofiel L, en minus het supplementair elektriciteitsgebruik volgens de productkaart, indien
      er sprake is van een apertuuroppervlakte van ten hoogste 5 vierkante meter;

      b. 4.427 kWh, minus het jaarlijks aandeel van niet uit zonne-energie verkregen warmte volgens de productkaart
      conform het capaciteitsprofiel XL, en minus het supplementair elektriciteitsgebruik volgens de productkaart, indien
      er sprake is van een apertuuroppervlakte van meer dan 5 en ten hoogste 10 vierkante meter;

      c. het product van 1.293 kWh, het totale collectoroppervlak van alle collectoren volgens de productkaart, het
      collectorrendement volgens de productkaart, de instralingshoekmodifier volgens de productkaart en de verliesfactor
      van de warmwatertank, bedoeld in het vierde of vijfde lid, indien er sprake is van een apertuuroppervlakte van meer
      dan 10 vierkante meter.

      4 Afhankelijk van de energie-efficiëntieklasse vermeld op het etiket of de energie-efficiëntieklasse vastgesteld
      volgens de methode, bedoeld in bijlage II, onderdeel 2, van verordening (EU) nr. 812/2013, bedraagt de
      verliesfactor van de warmwatertank, bedoeld in het derde lid, onderdeel c:

      a. 0,95 bij energie-efficiëntieklasse A+;

      b. 0,91 bij energie-efficiëntieklasse A;

      c. 0,86 bij energie-efficiëntieklasse B;

      d. 0,83 bij energie-efficiëntieklasse C;

      e. 0,81 bij energie-efficiëntieklasse D tot en met G.

      5 In afwijking van het vierde lid bedraagt de verliesfactor voor een warmwatertank met een volume van 2000 liter en
      meer 0,81.

      6 Indien de zonneboiler naast warm tapwater tevens ruimteverwarming produceert, wordt de subsidie voor de
      zonneboiler, bedoeld in het eerste lid, onderdeel e, eenmalig verhoogd met:

      a. € 150, indien de zonneboiler behoort tot de energie-efficiëntieklasse A+ voor ruimteverwarming;

      b. € 300, indien de zonneboiler behoort tot de energie-efficiëntieklasse A++ of hoger voor ruimteverwarming.


