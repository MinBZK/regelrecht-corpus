  - number: 2.15.9
    text: |-
      1 Indien voor een project een milieueffectbeoordeling moet worden uitgevoerd als bedoeld in artikel 14, vijfde lid,
      van de groepsvrijstellingsverordening landbouw, is deze beoordeling uitgevoerd of de vergunning voor het betrokken
      project verleend vóór de datum waarop het project van start gaat.

      2 Indien voor een project een toestemming of vergunning van een bestuursorgaan, anders dan bedoeld in het eerste
      lid, vereist is, is deze toestemming of vergunning verleend voor de datum waarop het project van start gaat.

      3 Indien de subsidieontvanger mede actief is in de primaire landbouwproductie, maar als terreinbeheerder
      hoofdzakelijk activiteiten verricht die betrekking hebben op natuurbeheer of natuurherstel, voert de
      subsidieontvanger een zodanige administratie dat met passende middelen zoals een scheiding van de activiteiten
      of een uitsplitsing van de kosten aantoonbaar is dat de subsidie niet ten goede komt aan de primaire
      landbouwproductie.

      4 Binnen twee jaar na subsidieverlening vindt de verwerving, bedoeld in [artikel 2.15.2, tweede lid][ref1], plaats.
      Hierbij sluiten de subsidieontvanger en de Minister een overeenkomst.

      5 De overeenkomst, bedoeld in het vierde lid, wordt zo spoedig mogelijk ingeschreven in de openbare registers.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.15.2
