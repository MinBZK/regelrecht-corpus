  - number: 2.2.10
    text: |-
      Voor zover de subsidie betrekking heeft op de onderzoeks- en ontwikkelingsfase wordt deze verstrekt aan de
      veehouderijonderneming of veehouderijondernemingen, of een andere onderneming of andere ondernemingen, binnen het
      samenwerkingsverband ten behoeve van experimentele ontwikkeling of industrieel onderzoek met betrekking tot:

      a. investeringen in technieken, installaties, apparatuur, machines en uitrusting die zouden kunnen leiden tot
      brongerichte verduurzaming en verbetering van het dierenwelzijn, waaronder ten minste ook de brandveiligheid, in
      bestaande stalsystemen of in nieuw te ontwikkelen en te bouwen typen stalsystemen;

      b. managementmaatregelen die zouden kunnen leiden tot brongerichte verduurzaming en verbetering van het
      dierenwelzijn, waaronder ten minste ook de brandveiligheid, in bestaande stalsystemen of in nieuw te ontwikkelen en
      te bouwen typen stalsystemen; dan wel

      c. een combinatie van investeringen en managementmaatregelen als bedoeld in onderdeel a respectievelijk b die zou
      kunnen leiden tot brongerichte verduurzaming en verbetering van het dierenwelzijn, waaronder ten minste ook de
      brandveiligheid, in bestaande stalsystemen of in nieuw te ontwikkelen en te bouwen typen stalsystemen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.2.10
  - number: 2.2.11
    text: |-
      1 Voor de onderzoeks- en ontwikkelingsfase bedraagt de subsidie 25% van de subsidiabele kosten, voor zover deze
      betrekking hebben op industrieel onderzoek of experimentele ontwikkeling.

      2 Het percentage, genoemd in het eerste lid, wordt verhoogd met:

      a. 10 procentpunten, indien de aanvrager een middelgrote onderneming is en de subsidiabele kosten worden gemaakt en
      betaald door de middelgrote onderneming;

      b. 20 procentpunten, indien de aanvrager een kleine onderneming is en de subsidiabele kosten worden gemaakt en
      betaald door de kleine onderneming.

      3 Het percentage, genoemd in het eerste lid, wordt overeenkomstig artikel 25, zesde lid, onderdeel b, van de
      algemene groepsvrijstellingsverordening verhoogd met 15 procentpunten indien:

      a. de onderzoeks- en ontwikkelingsfase daadwerkelijke samenwerking behelst en voldaan wordt aan de voorwaarden,
      bedoeld in artikel 25, zesde lid, onderdeel b, onder i, van de algemene groepsvrijstellingsverordening;

      b. de projectresultaten uit de onderzoeks- en ontwikkelingsfase ruim worden verspreid via conferenties,
      publicaties, open access-repositories of gratis of opensource-software.

      4 Voor de onderzoeks- en ontwikkelingsfase bedraagt de subsidie ten hoogste € 1.000.000 per veehouderijlocatie in
      een innovatieproject, voor zover het innovatieproject betrekking heeft op investeringen, managementmaatregelen of
      een combinatie hiervan als bedoeld in [artikel 2.2.10, onderdelen a, b. of c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.10
