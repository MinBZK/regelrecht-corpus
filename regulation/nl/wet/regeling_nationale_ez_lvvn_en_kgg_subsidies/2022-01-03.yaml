  - number: 3.22.1
    text: |-
      1 In deze titel wordt verstaan onder:

        - *achtergestelde vordering:* vordering van een thematisch technology transferfonds ten laste van een
      kennisstarter: a. die het thematisch technology transferfonds heeft verkregen door in het kader van een
      participatie aan de kennisstarter geld ter leen te verstrekken; b. die met instemming van de crediteur
      een lagere rang inneemt dan alle andere, niet achtergestelde vorderingen op de debiteur als bedoeld in
      [artikel 277, tweede lid, van boek 3 van het Burgerlijk Wetboek][ref1]; c. waarop de debiteur krachtens een daartoe
      strekkende bepaling in de akte van geldlening eerst verplicht is rente en aflossing te betalen nadat alle andere
      op dat moment bestaande niet achtergestelde vorderingen op de debiteur zijn voldaan; d. terwijl ingevolge de
      vorenbedoelde akte van geldlening de crediteur afstand heeft gedaan van alle rechten tot verrekening van de rente
      en aflossing;
        - *begeleidingskosten:* kosten die een thematisch technology transferfonds maakt voor de inhoudelijke begeleiding
      van kennisstarters;
        - *converteerbare lening:* geldlening, steeds resulterend in een achtergestelde vordering, van een thematisch
      technology transferfonds aan een kennisstarter die door het thematisch technology transferfonds geconverteerd kan
      worden in aandelen in het kapitaal van de kennisstarter;
        - *desinvesteringsperiode:* periode waarbinnen een thematisch technology transferfonds de participaties vervreemdt
      of overdraagt;
        - *eerste commerciële verkoop:* eerste verkoop door een onderneming op een product- of dienstenmarkt, met
      uitsluiting van beperkte verkopen om de markt te testen;
        - *fondsbeheerder:* feitelijke uitvoerder van een fondsplan, zijnde een door het thematisch technology
      transferfonds daartoe gecontracteerde derde;
        - *fondspartij:* onafhankelijke particuliere investeerder die direct of indirect particuliere geldelijke middelen
      inbrengt in een thematisch technology transferfonds en die tevens direct of indirect als aandeelhouder, hoofdelijk
      aansprakelijk vennoot, lid of oprichter een belang heeft in het thematisch technology transferfonds;
        - *fondsperiode:* periode bestaande uit de investeringsperiode en de desinvesteringsperiode;
        - *fondsplan:* fondsplan als bedoeld in [artikel 3.22.7, vierde lid][ref2];
        - *informal investor:* particulier die, al dan niet via een kapitaalvennootschap waarvan hij enig aandeelhouder is,
      voor eigen rekening en risico participeert en investeert in ondernemingen;
        - *inkomsten:* op geld waardeerbare voordelen die een thematisch technology transferfonds heeft verkregen uit een
      participatie, waaronder dividend, rente, aflossingen, opties, de prijs waartegen de participatie is vervreemd, de
      prijs waartegen de participatie door de desbetreffende kennisstarter is ingekocht of terugbetaald en de liquidatie-
      uitkering;
        - *investeringsbudget:* financiële middelen die een thematisch technology transferfonds beschikbaar heeft of zal
      hebben en die bestemd zijn om de verkrijgingprijs van participaties te voldoen;
        - *investeringsperiode:* periode gedurende welke een thematisch technology transferfonds activiteiten verricht ter
      verkrijging van nieuwe participaties;
        - *kennisoverdracht:* kennisoverdracht als bedoeld in paragraaf 1.3, onderdeel 15, onder v, van het O&O&I-
      steunkader;
        - *kennisoverdrachtplan:* kennisoverdrachtplan als bedoeld in [artikel 3.22.7, derde lid][ref3];
        - *kennisstarter:* **rechtspersoon die een onderneming drijft in de vorm van een kapitaalvennootschap en
      die: a. een substantieel deel van zijn activiteiten in Nederland uitvoert; b. voldoet aan de definitie
      van niet-beursgenoteerde kmo, bedoeld in artikel 2, onderdelen 2 en 76, en bijlage I van de algemene
      groepsvrijstellingsverordening en ten tijde van de eerste verstrekking van risicokapitaal door een thematisch
      technology transferfonds op grond van deze titel niet actief is en is geweest op een markt; en c. voor eigen
      rekening en risico producten, processen of diensten, niet zijnde adviezen, verkoopt en levert of gaat verkopen en
      leveren, die zijn gebaseerd op een nieuwe technische vinding of een nieuwe toepassing van bestaande technologie,
      voortkomend uit onderzoek van een onderzoeksorganisatie;
        - *managementkosten:* kosten die een thematisch technology transferfonds maakt voor het verkrijgen, behouden
      en beëindigen van participaties, met uitzondering van de begeleidingskosten en de verkrijgingprijs van de
      participaties;
        - *netto-inkomsten:* **inkomsten van een thematisch technology transferfonds minus de eventuele marktconforme
      prestatieafhankelijke beloning voor de fondsbeheerder;
        - *onafhankelijke particuliere investeerder:* **onafhankelijke particuliere investeerder als bedoeld in artikel 2,
      onderdeel 72, van de algemene groepsvrijstellingsverordening;
        - *participatie:* risicokapitaal in de vorm van: a. aandelen in het kapitaal van een kennisstarter die een
      thematisch technology transferfonds rechtstreeks van de kennisstarter heeft verkregen tegen volstorting van
      die aandelen in geld, of door omzetting van een converteerbare lening; b. aandelen in het kapitaal van een
      kennisstarter als bedoeld onder a in combinatie met een achtergestelde vordering; of c. een uit een converteerbare
      lening voortvloeiende achtergestelde vordering;
        - *referentierente:* referentiepercentage als bedoeld in de mededeling van de Commissie over de herziening van de
      methode waarmee de referentie- en disconteringspercentages worden vastgesteld (PbEU 2008, C 14), zoals laatstelijk
      vastgesteld voor Nederland, en vermeerderd met vier procentpunten;
        - *starter:* **natuurlijke persoon die voorbereidingen treft voor de oprichting van een kennisstarter;
        - *thematisch consortium:* **onderzoeksorganisatie met rechtspersoonlijkheid opgericht door ten minste
      drie onderzoeksorganisaties die niet tot dezelfde groep behoren ten behoeve van de uitvoering van een
      kennisoverdrachtplan;
        - *thematisch technology transferfonds:* kapitaalvennootschap, vennootschap met een afgescheiden vermogen,
      of rechtspersoon met een afgescheiden vermogen niet zijnde een vennootschap, ingericht naar het recht van één
      van de lidstaten van de Europese Unie, die blijkens de akte waarbij zijn statuten zijn vastgesteld of blijkens
      de overeenkomst waarbij hij is ingesteld uitsluitend tot doel heeft het verstrekken van risicokapitaal aan
      kennisstarters die actief zijn binnen één thema teneinde winst te behalen;
        - *thematisch technology transferplan:* thematisch technology transferplan als bedoeld in
      [artikel 3.22.7, eerste lid, onderdeel d][ref4];
        - *TTT-samenwerkingsverband:* TTT-samenwerkingsverband als bedoeld in [artikel 3.22.2, tweede lid][ref5];
        - *validatieproject:* validatieproject als bedoeld in [artikel 3.22.2, derde lid, onderdeel e][ref6].

      2 Voor de toepassing van deze titel wordt als financier aangewezen een thematisch technology transferfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel277
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.22.7
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.22.7
      [ref4]: https://wetten.overheid.nl/BWBR0035474#Artikel3.22.7
      [ref5]: https://wetten.overheid.nl/BWBR0035474#Artikel3.22.2
      [ref6]: https://wetten.overheid.nl/BWBR0035474#Artikel3.22.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.22.1
