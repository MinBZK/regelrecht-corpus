  - number: 3.27.14
    text: |-
      De subsidie, bedoeld in [artikel 3.27.2, eerste lid][ref1], bevat, met uitzondering van niet-economisch industrieel
      onderzoek, experimentele ontwikkeling of een haalbaarheidsstudie door een onderzoeksorganisatie, staatssteun en
      wordt gerechtvaardigd door:

      a. paragraaf 3.2.3, onderdelen 22, 23, 24 en 25, van het IPCEI-steunkader, voor zover de subsidiabele activiteiten
      betrekking hebben op onderzoek en ontwikkeling, de eerste industriële toepassing van innovatieve producten of
      diensten of infrastructuuractiviteiten op het gebied van milieu, energie of digitalisering door een onderneming als
      bedoeld in [artikel 3.27.2, tweede lid, onderdeel a][ref2];

      b. artikel 25 van de algemene groepsvrijstellingsverordening, voor zover de subsidiabele activiteiten betrekking
      hebben op industrieel onderzoek, experimentele ontwikkeling of een haalbaarheidsstudie door een onderneming als
      bedoeld in [artikel 3.27.2, tweede lid, onderdeel b][ref3];

      c. artikel 17 van de algemene groepsvrijstellingsverordening, voor zover de subsidiabele activiteiten
      betrekking hebben op investeringen door een middelgrote of kleine onderneming als bedoeld in
      [artikel 3.27.2, tweede lid, onderdeel d][ref4];

      d. artikel 26 van de algemene groepsvrijstellingsverordening, voor zover de subsidiabele
      activiteiten betrekking hebben op de bouw of upgrading van onderzoeksinfrastructuur als bedoeld in
      [artikel 3.27.2, tweede lid, onderdeel e][ref5];

      e. artikel 29 van de algemene groepsvrijstellingsverordening, voor zover de subsidiabele activiteiten betrekking
      hebben op proces- en organisatie innovatie als bedoeld in [artikel 3.27.2, tweede lid, onderdeel f][ref6].


