  - number: 3.22.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een deelnemer in een TTT-samenwerkingsverband voor het uitvoeren
      van een thematisch technology transferplan.

      2 Een TTT-samenwerkingsverband is een samenwerkingsverband dat bestaat uit:

      a. ten minste drie onderzoeksorganisaties of een thematisch consortium; en

      b. een thematisch technology transferfonds.

      3 De subsidie voor een onderzoeksorganisatie is bestemd voor het uitvoeren van de volgende activiteiten uit een
      kennisoverdrachtplan:

      a. activiteiten ter bevordering van aanwending van kennis binnen het thema waarover de betreffende
      onderzoeksorganisatie beschikt, met betrekking tot:

      1°. het beoordelen in hoeverre deze kennis geschikt is voor economische of maatschappelijke benutting;

      2°. het zoeken naar starters, kennisstarters, andere ondernemingen en maatschappelijke organisaties om de onder 1°
      bedoelde kennis toe te passen en het stimuleren van het gebruik van deze kennis, voor zover deze activiteiten niet
      bestaan uit advisering op individuele basis;

      b. het verwerven van rechten van intellectueel eigendom met het oog op het verlenen van gebruiksrechten of latere
      overdracht daarvan;

      c. activiteiten ten behoeve van het creëren van spin-offs;

      d. activiteiten gericht op:

      1°. samenwerking en informatiedeling binnen het thematisch consortium of tussen de onderzoeksorganisaties in het
      TTT-samenwerkingsverband;

      2°. openbare bekendheid geven aan het thematisch consortium of aan de samenwerking tussen de onderzoeksorganisaties
      in het TTT-samenwerkingsverband;

      3°. brede verspreiding van de resultaten en tussenresultaten van de gesubsidieerde activiteiten op een niet-
      exclusieve en niet-discriminerende basis;

      e. het onfhankelijk uitvoeren van validatieprojecten die bestaan uit activiteiten gericht op het technisch of
      klinisch verbeteren van een product, procedé of dienst om de resultaten van deze activiteiten over te dragen voor
      bedrijfsmatige toepassing.

      4 De subsidie voor een thematisch technology transferfonds is bestemd voor:

      a. het verkrijgen van participaties in het kader van het uitvoeren van een fondsplan; en

      b. de in het kader van het fondsplan, bedoeld onder a, gemaakte managementkosten.

      5 De subsidie, bedoeld in het vierde lid, onderdeel a, wordt verstrekt in de vorm van een geldlening op basis van
      een overeenkomst.

      6 De subsidie aan een onderzoeksorganisatie wordt verleend onder de opschortende voorwaarde dat binnen acht weken
      na dagtekening van de beschikking de overeenkomst van geldlening tot stand is gekomen tussen de Staat en het
      thematisch technology transferfonds dat deelneemt aan het TTT-samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.22.2
  - number: 3.22.3
    text: |-
      1 De subsidie voor de activiteiten, bedoeld in [artikel 3.22.2, derde lid][ref1], bedraagt 100 procent van de
      subsidiabele kosten, doch ten hoogste € 2.500.000 per aanvraag en maximaal de helft van de subsidie voor de
      activiteiten, bedoeld in artikel 3.22.2, vierde lid.

      2 De subsidie voor de activiteiten, bedoeld in [artikel 3.22.2, derde lid, onderdeel b][ref2], bedraagt ten hoogste
      € 32.000 per octrooiaanvraag.

      3 De subsidie voor de activiteiten, bedoeld in [artikel 3.22.2, derde lid, onderdeel e][ref3], bedraagt ten hoogste
      € 25.000 per validatieproject.

      4 De geldlening, bedoeld in [artikel 3.22.2, vijfde lid][ref4], die op grond van de overeenkomst van geldlening
      geleend kan worden, bedraagt maximaal 90 procent van het investeringsbudget, doch ten hoogste € 5.300.000.

      5 De subsidie voor de activiteiten, bedoeld in [artikel 3.22.2, vierde lid, onderdeel b][ref5], bedraagt 100
      procent van de managementkosten, doch ten hoogste € 200.000.


