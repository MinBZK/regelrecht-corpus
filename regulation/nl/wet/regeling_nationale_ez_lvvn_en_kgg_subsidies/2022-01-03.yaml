    text: |-
      De subsidie, bedoeld in [artikel 2.13.2][ref1] bevat staatssteun en wordt gerechtvaardigd door staatssteunmaatregel
      SA.312008 (2014/N).


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.13.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.13.7
