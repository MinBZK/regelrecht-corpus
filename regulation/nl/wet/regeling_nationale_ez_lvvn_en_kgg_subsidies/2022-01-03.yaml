        artikel: 2.2.2
        hoofdstuk: '2'
        paragraaf: 2.2.2
  - number: 2.2.22
    text: |-
      1 Voor de resterende productieve levensduurfase bedraagt de subsidie het percentage van de subsidiabele kosten dat
      op grond van [artikel 2.2.11, eerste tot en met derde lid][ref1], van toepassing is op de investeringen, bedoeld
      in [artikel 2.2.10, onderdeel a][ref2], met dien verstande dat dit percentage niet meer bedraagt dan 40% van de
      subsidiabele kosten, verhoogd met 20 procentpunten, indien:

      a. subsidie wordt verstrekt aan jonge landbouwers of landbouwers die zich hebben gevestigd in de periode van vijf
      jaar voorafgaand aan de datum van de subsidieaanvraag als bedoeld in artikel 14, dertiende lid, onderdeel a, van de
      groepsvrijstellingsverordening landbouw;

      b. subsidie wordt verstrekt voor de extra kosten voor investeringen om het natuurlijke milieu, de
      hygiëneomstandigheden of de normen inzake dierenwelzijn te verbeteren om een hoger niveau dan de geldende normen
      van de Europese Unie te halen, en die niet leiden tot een verhoging van de productiecapaciteit, bedoeld in artikel
      14, dertiende lid, onderdeel e, van de groepsvrijstellingsverordening landbouw.

      2 Voor de resterende productieve levensduurfase bedraag de subsidie ten hoogste € 500.000 per
      veehouderijonderneming in een innovatieproject.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.11
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.10
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.2.22
