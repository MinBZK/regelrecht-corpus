  - number: 3.5.14
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. minder dan drie jaar geleden reeds subsidie krachtens deze titel of de Subsidieregeling innoveren is verleend,
      betrekking hebbend op dezelfde of vergelijkbare activiteiten;

      b. van de activiteiten onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten zijn;

      c. de IPC-penvoerder niet aannemelijk maakt dat er een aanzienlijke kans is, dat de subsidiabele activiteiten,
      bedoeld in [artikel 3.5.10, eerste lid, onderdeel a][ref1], zullen leiden tot het tot stand komen van activiteiten
      als bedoeld in artikel 3.5.10, eerste lid, onderdeel b;

      d. de IPC-penvoerder geen maatregelen heeft genomen om de betrokkenheid van het midden- en kleinbedrijf uit de
      branche bij het collectief onderzoek, bedoeld in [artikel 3.5.10, eerste lid, onderdeel b][ref2], te borgen;

      e. van de totale kosten voor het collectief onderzoek, bedoeld in [artikel 3.5.10, eerste lid, onderdeel b][ref3],
      meer dan 80 procent wordt gedragen door de IPC-penvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.5.10
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.5.10
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.5.10
