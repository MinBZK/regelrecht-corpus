        hoofdstuk: '2'
        paragraaf: 2.4.2
  - number: 2.4.12
    text: |-
      De minister beslist afwijzend op een aanvraag voor subsidie voor het geven van advies indien:

      a. advisering in een groepsverband heeft plaatsgevonden aan zestien of meer landbouwondernemingen;

      b. de advisering niet hoofdzakelijk was gericht op het in de aanvraag vermelde onderwerp;

      c. de erkende bedrijfsadviseur financieel niet onafhankelijk is van de aanvrager;

      d. de erkende bedrijfsadviseur niet deskundig of onvoldoende betrouwbaar is als bedoeld in artikel 22, zesde lid,
      van de groepsvrijstellingsverordening landbouw;

      e. de erkende bedrijfsadviseur niet deskundig is op het onderwerp, bedoeld in [artikel 2.4.3., eerste lid][ref1],
      waarop de advisering is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.3
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.12
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.4.3
        hoofdstuk: '2'
        paragraaf: 2.4.2
  - number: 2.4.13
    text: |-
      De subsidie, bedoeld in [artikel 2.4.8][ref1], bevat staatssteun en wordt gerechtvaardigd door de artikelen 21 en
      22 van de groepsvrijstellingsverordening landbouw.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.8
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.13
    references:
