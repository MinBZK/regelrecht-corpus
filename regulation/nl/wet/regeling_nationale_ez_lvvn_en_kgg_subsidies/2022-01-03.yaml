  - number: 4a.2.9
    text: |-
      1 De minister kent aan een cyberweerbaarheidsplan een hoger aantal punten toe, naarmate:

      a. het cyberweerbaarheidsplan een grotere bijdrage levert aan het versterken van de cyberweerbaarheid van niet-
      vitale ondernemingen, waardoor maatschappelijke en economische schade kan worden beperkt;

      b. het netwerk waarbinnen het cyberweerbaarheidsplan wordt uitgevoerd:

      1˚. in hogere mate aantoonbaar tot doel heeft en door de samenstelling van het netwerk geschikt is om de
      cyberweerbaarheid van niet-vitale ondernemingen duurzaam te versterken;

      2˚. een groter netwerk kan vormen waarbinnen ervaring en kennis over cyberweerbaarheid aanwezig is en wordt
      uitgewisseld;

      c. het cyberweerbaarheidsplan innovatiever is, blijkende uit de mate waarin het cyberweerbaarheidsplan best
      practices of blauwdrukken oplevert, of de mate waarin het plan complementair is aan eerder uitgevoerde plannen.

      2 Het aantal punten bedraagt bij de onderdelen a en b van het eerste lid ten minste één en ten hoogste veertig
      punten, en bij onderdeel c van het eerste lid ten minste één en ten hoogste twintig punten.

      3 De minister rangschikt de aanvragen, waarop niet afwijzend is beslist, hoger, naarmate in totaal meer punten aan
      het cyberweerbaarheidsplan zijn toegekend.

      4 Geen subsidie wordt verleend voor een cyberweerbaarheidsplan dat lager is gerangschikt dan een soortgelijk
      cyberweerbaarheidsplan.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4a.2.9
  - number: 4a.2.10
    text: |-
      1 Gedurende de uitvoering van het cyberweerbaarheidsplan verstrekt de subsidieontvanger jaarlijks een
      voortgangsrapportage die de minister kan gebruiken voor de openbare brede verspreiding van de niet-
      bedrijfsgevoelige kennis en informatie die met de uitvoering van het cyberweerbaarheidsplan worden opgedaan.

      2 De subsidieontvanger verleent medewerking aan een evaluatie van de effecten van de door hem uitgevoerde
      activiteiten, bedoeld in [artikel 4a.2.2][ref1], voor zover deze medewerking redelijkerwijs van hem verlangd kan
      worden.

      3 Onverminderd het eerste lid verleent de subsidieontvanger medewerking aan de verdere verspreiding van ervaringen
      en resultaten van het cyberweerbaarheidsplan door de minister of door een door de minister aangewezen derde.

      4 De verplichtingen, bedoeld in het tweede en derde lid, gelden tot drie jaar na de datum van de beschikking tot
      subsidievaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4a.2.2
