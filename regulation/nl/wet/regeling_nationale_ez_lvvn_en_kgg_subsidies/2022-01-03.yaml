        artikel: 2.4.8
        hoofdstuk: '2'
        paragraaf: 2.4.3
  - number: 2.4.14
    text: |-
      Een opleidingsvoucher heeft een waarde van ten hoogste € 1.250,– en wordt door de minister aan een bedrijfsadviseur
      op aanvraag verstrekt voor het volgen van de Opleiding bedrijfscoach stikstof in de landbouw bij een
      kennisinstelling.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.14
  - number: 2.4.15
    text: In de aanvraag wordt één kennisinstelling naar keuze opgenomen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.15
  - number: 2.4.16
    text: |-
      De minister bepaalt op volgorde van binnenkomst aan welke bedrijfsadviseurs binnen het subsidieplafond
      opleidingsvouchers worden verstrekt, uitgaande van de maximumwaarde per voucher.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.16
  - number: 2.4.17
    text: |-
      De minister beslist afwijzend op een aanvraag indien aan de aanvrager al eerder een voucher als bedoeld in
      [artikel 2.4.14][ref1] is toegekend in hetzelfde kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.14
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.17
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.4.14
        hoofdstuk: '2'
        paragraaf: 2.4.4
  - number: 2.4.18
    text: De bedrijfsadviseur draagt de voucher over aan de in de aanvraag opgenomen kennisinstelling.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.18
  - number: 2.4.19
    text: |-
      Subsidie wordt verstrekt aan een kennisinstelling die een opleiding heeft verstrekt aan een bedrijfsadviseur en in
      verband daarmee een geldige voucher overlegt.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.19
  - number: 2.4.20
    text: De subsidie bedraagt ten hoogste 50% van de subsidiabele kosten en niet meer dan € 1.250,– per voucher.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.20
  - number: 2.4.21
    text: |-
      Voor subsidie komen in aanmerking:

      a. personeelskosten van de opleiders als bedoeld in artikel 31, derde lid, onderdeel a, van de algemene
      groepsvrijstellingsverordening;

      b. rechtstreeks met het opleidingsproject verband houdende operationele kosten als bedoeld in artikel 31, derde
      lid, onderdeel b, van de algemene groepsvrijstellingsverordening, met uitzondering van materiaalkosten.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.21
  - number: 2.4.22
    text: |-
      1 Een aanvraag voor subsidie wordt na afloop van de opleiding door de kennisinstelling ingediend.

      2 De aanvraag moet binnen een jaar na de dagtekening van de aan de bedrijfsadviseur verstrekte voucher zijn
      ontvangen. Op een voor het einde van de termijn daartoe ingediend verzoek kan de minister besluiten deze termijn
      eenmalig te verlengen met ten hoogste zes maanden.

      3 Indien de aanvraag niet binnen de termijn, bedoeld in het tweede lid, door de minister is ontvangen, vervalt de
      voucher van rechtswege.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.22
  - number: 2.4.23
    text: |-
      De subsidie, bedoeld in [artikel 2.4.19][ref1], bevat staatssteun en wordt gerechtvaardigd door artikel 31 van de
      algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.19
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.23
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.4.19
        hoofdstuk: '2'
        paragraaf: 2.4.5
  - number: 2.4.24
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een onderneming voor de uitvoering van trainingen, workshops,
      coaching, voorlichtingsactiviteiten en demonstratieactiviteiten ten behoeve van een samenwerkingsverband, bestaande
      uit:

      a. landbouwondernemingen;

      b. tenminste een landbouwonderneming en een verwerker of een afzetkanaal in de dierlijke agroketen, voor zover het
      daarbij gaat om kmo’s of kleine, middelgrote en micro-ondernemingen als bedoeld in artikel 2, onderdeel (2), van de
      groepsvrijstellingsverordening landbouw.

      2 De activiteiten, bedoeld in het eerste lid, hebben voor een samenwerkingsverband als bedoeld in het eerste lid,
      onderdeel a, als onderwerp:

      a. Kringlooplandbouw:

      1°. (stikstof)emissie en hergebruik nutriënten;

      2°. gezonde bodem, water en teeltsystemen;

      3°. weerbare teeltsystemen en gewasbescherming;

      4°. circulair gebruik van gewassen, grondstoffen en nieuwe plantaardige eiwitbronnen;

      5°. natuurinclusieve landbouw;

      6°. precisielandbouw.

      b. Duurzaam Ondernemerschap:

      1°. persoonlijke ontwikkeling van ondernemers en hun bedrijf;

      2°. horizontale samenwerking;

      3°. bedrijfsopvolging;

      4°. duurzaam verdienvermogen.

      3 De activiteiten, bedoeld in het eerste lid, hebben voor een samenwerkingsverband als bedoeld in het eerste lid,
      onderdeel b, in het kader van een duurzaam dierlijk marktconcept een of meer van de volgende onderwerpen:

      a. Kringlooplandbouw:

      1°. (stikstof)emissie en hergebruik nutriënten;

      2°. gezonde bodem en water;

      3°. circulair gebruik van gewassen, grondstoffen en nieuwe plantaardige eiwitbronnen;

      4°. natuurinclusieve landbouw;

      5°. verbeteren van diergezondheid;

      6° 6°.Verbeteren van dierenwelzijn.

      b. Duurzaam Ondernemerschap:

      1°. persoonlijke ontwikkeling van ondernemers en hun bedrijf;

      2°. horizontale samenwerking;

      3°. verticale samenwerking;

      4°. duurzaam verdienvermogen.

      4 De subsidie, bedoeld in het eerste lid, wordt niet verstrekt aan:

      a. een landbouwonderneming of een schakel in de dierlijke agroketen;

      b. een onderneming, die landbouwproducten, gewasbeschermingsmiddelen, diervoeders, landbouwmechanisatieproducten of
      meststoffen verkoopt; of

      c. een onderneming die in een groep verbonden is aan een onderneming die producten als bedoeld onder b verkoopt.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.24
  - number: 2.4.25
    text: |-
      1 De subsidie bedraagt ten hoogste 80% van de subsidiabele kosten.

      2 De subsidie bedraagt ten minste € 15.000,– en ten hoogste € 200.000,– per project.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.25
  - number: 2.4.26
    text: |-
      1 Voor subsidie komen in aanmerking kosten van de organisatie en uitvoering van trainingen, workshops, coaching,
      voorlichtingsacties en demonstratieactiviteiten als bedoeld in artikel 21, derde lid, onderdeel a, van de
      groepsvrijstellingsverordening landbouw.

      2 Voor subsidie komen niet in aanmerking kosten voor de ontwikkeling van middelen ten behoeve van de
      kennisoverdracht.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.26
  - number: 2.4.27
    text: |-
      1 De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.

      2 Indien blijkt dat het totale bedrag van de te verlenen subsidies voor projecten als bedoeld in
      [artikel 2.4.24, tweede lid, onderdeel a, subonderdeel 1°][ref1], lager is dan het daarvoor vastgestelde
      subsidieplafond, wordt het overblijvende bedrag zo nodig aan het subsidieplafond toegevoegd voor overige projecten
      als bedoeld in artikel 2.4.24, tweede lid.

      3 Indien blijkt dat het totale bedrag van de te verlenen subsidies voor projecten als bedoeld in
      [artikel 2.4.24, derde lid][ref2], lager is dan het daarvoor vastgestelde subsidieplafond, wordt het overblijvende
      bedrag zo nodig toegevoegd voor projecten als bedoeld in artikel 2.4.24, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.24
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.24
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.27
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.4.24
        hoofdstuk: '2'
        paragraaf: 2.4.6
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 2.4.24
        hoofdstuk: '2'
        paragraaf: 2.4.6
  - number: 2.4.28
    text: |-
      1 Met de uitvoering van de op grond van deze paragraaf gesubsidieerde activiteiten wordt gestart binnen drie
      maanden na de subsidieverlening.

      2 De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.28
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 2.4.29
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. de aanvrager niet beschikt over voor het project gekwalificeerd en geregeld opgeleid personeel als bedoeld in
      artikel 21, zesde lid, van de groepsvrijstellingsverordening landbouw;

      b. na toepassing van [artikel 2.4.30][ref1] op één van de onderdelen a tot en met d van het eerste lid van dat
      artikel minder dan drie punten zijn toegekend;

      c. de aanvrager een producentengroepering of -organisatie is die een landbouwonderneming verplicht lid te zijn van
      de groepering of organisatie om deel te kunnen nemen aan het project;

      d. het project niet past binnen de onderwerpen van [artikel 2.4.24, tweede of derde lid][ref2];

      e. het samenwerkingsverband, bedoeld in [artikel 2.4.24, eerste lid, onderdeel b][ref3], niet bestaat uit ten
      minste twee van de drie genoemde schakels van de dierlijke agroketen;

      f. het project, bedoeld in [artikel 2.4.24, derde lid][ref4], geen duurzaam dierlijk marktconcept betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.30
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.24
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.24
      [ref4]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.24
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.29
    references:
