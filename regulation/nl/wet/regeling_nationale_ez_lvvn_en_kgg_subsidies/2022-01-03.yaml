  - number: 2.15.2
    text: |-
      1 De Minister verstrekt op aanvraag subsidie aan een terreinbeheerder of een deelnemer in een samenwerkingsverband,
      waaraan één of meerdere partijen deelnemen die terreinbeheerder zijn voor een project bestaande uit één of
      meer natuurherstelmaatregelen die leiden tot verbetering van de kwaliteit of uitbreiding van de oppervlakte van
      stikstofgevoelige natuurlijke habitats of habitats van soorten.

      2 De Minister verstrekt op aanvraag subsidie aan een natuurlijke persoon, ondernemer, stichting, vereniging of
      andere rechtspersoon voor het zelfstandig of in een samenwerkingsverband verwerven van landbouwgrond gelegen binnen
      Natuurnetwerk Nederland ten behoeve van een project als bedoeld in het eerste lid.

      3 Voor de toepassing van het eerste lid worden Natura 2000-gebieden aangewezen als natuurerfgoed als bedoeld in
      artikel 53, tweede lid, onderdeel b, van de algemene groepsvrijstellingsverordening.

      4 De subsidie, bedoeld in het eerste lid, kan slechts worden aangevraagd door een terreinbeheerder, indien het
      terrein niet in erfpacht is uitgegeven en op dit terrein geen recht van beklemming rust.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.15.2
  - number: 2.15.3
    text: |-
      1 De subsidie, bedoeld in [artikel 2.15.2, eerste lid][ref1], bedraagt 100 procent van de subsidiabele kosten.

      2 De subsidie, bedoeld in [artikel 2.15.2, tweede lid][ref2], bedraagt:

      a. 85 procent van de subsidiabele kosten ten behoeve van de verwerving, bepaald op basis van een taxatie, die in
      opdracht van de Minister wordt uitgevoerd door een onafhankelijke taxateur;

      b. 100 procent van de subsidiabele kosten voor het bodemonderzoek, het kadastraal recht en het registratierecht,
      de notariskosten, waaronder mede worden verstaan de kosten van het opmaken van de notariële akte en de kosten van
      inschrijving in de openbare registers.

      3 In afwijking van het eerste en het tweede lid, bedraagt de subsidie overeenkomstig artikel 53, zesde
      lid, van de algemene groepsvrijstellingsverordening niet meer dan het verschil tussen de kosten, bedoeld
      in [artikel 2.15.4, eerste lid, onderdeel a][ref3], en de exploitatiewinst van de investering, indien de
      aanvrager niet hoofdzakelijk actief is in de primaire landbouwproductie, dan wel in de verwerking en afzet van
      landbouwproducten.

      4 De subsidie, bedoeld in [2.15.2, eerste lid][ref4], bedraagt maximaal € 500.000, indien de aanvrager hoofzakelijk
      actief is in de primaire landbouwproductie.


