  - number: 2.2.23
    text: |-
      1 Voor de resterende productieve levensduurfase komen voor subsidie uitsluitend de afschrijvingskosten
      van de investeringen, bedoeld in [artikel 2.2.10, onderdeel a][ref1], in aanmerking, voor zover deze
      afschrijvingskosten vallen onder de kosten, bedoeld in artikel 14, zesde lid, onderdelen a tot en met d, van de
      groepsvrijstellingsverordening landbouw.

      2 Op de subsidiabele kosten van de resterende productieve levensduurfase is
      [artikel 10, derde lid, van het besluit][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.10
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel10
