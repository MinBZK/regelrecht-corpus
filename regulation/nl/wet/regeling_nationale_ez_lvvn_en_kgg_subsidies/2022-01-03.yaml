    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.6.5
  - number: 4.6.6
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.6.6
