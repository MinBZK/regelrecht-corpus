  - number: 3.27.4
    text: |-
      Voor subsidie komen uitsluitend in aanmerking:

      a. de kosten, bedoeld in de bijlage bij het IPCEI-steunkader, voor zover deze zijn opgenomen in het Europees
      goedkeuringsbesluit en betrekking hebben op onderzoek en ontwikkeling, de eerste industriële toepassing van
      innovatieve producten of diensten of infrastructuurprojectactiviteiten in de sectoren milieu, energie of
      digitalisering door een onderneming als bedoeld in [artikel 3.27.2, tweede lid, onderdeel a][ref1];

      b. de kosten, bedoeld in artikel 25, derde lid, van de algemene groepsvrijstellingsverordening, voor zover deze
      betrekking hebben op industrieel onderzoek en experimentele ontwikkeling door een onderneming als bedoeld in
      [artikel 3.27.2, tweede lid, onderdeel b][ref2];

      c. de kosten, bedoeld in artikel 25, vierde lid, van de algemene groepsvrijstellingsverordening,
      voor zover deze betrekking hebben op een haalbaarheidsstudie door een onderneming als bedoeld in
      [artikel 3.27.2, tweede lid, onderdeel b][ref3];

      d. de kosten, bedoeld in artikel 17, tweede lid, onderdeel a, van de algemene groepsvrijstellingsverordening,
      voor zover deze betrekking hebben op investeringen door een middelgrote of kleine onderneming als bedoeld in
      [artikel 3.27.2, tweede lid, onderdeel d][ref4];

      e. de kosten, bedoeld in artikel 26, vijfde lid, van de algemene groepsvrijstellingverordening, voor zover deze
      betrekking hebben op de bouw of het upgraden van onderzoeksinfrastructuur door een onderneming als bedoeld in
      [artikel 3.27.2, tweede lid, onderdeel e][ref5];

      f. de kosten, bedoeld in artikel 29, derde lid, van de algemene groepsvrijstellingsverordening, voor
      zover deze betrekking hebben op proces- en organisatie-innovatie door een onderneming als bedoeld in
      [artikel 3.27.2, tweede lid, onderdeel f][ref6].


