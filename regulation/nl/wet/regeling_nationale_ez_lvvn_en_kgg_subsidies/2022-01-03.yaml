  - number: 3.20.9
    text: |-
      Deze titel vervalt met ingang van 1 juli 2026, met dien verstande dat deze van toepassing blijft op subsidies die
      voor deze datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.20.9
  - number: 3.21.1
    text: |-
      In deze titel wordt verstaan onder:

        - *brancheorganisatie:* een rechtspersoon met volledige rechtsbevoegdheid, niet zijnde een rechtspersoon die
      krachtens publiekrecht is ingesteld, die niet bedrijfsmatig werkzaam is en die blijkens zijn statuten als doel
      heeft de belangen te behartigen van ondernemers die behoren tot eenzelfde bedrijfstak of een samenhangend deel
      ervan;
        - *leercultuur:* cultuur waarbij leren gedurende het werkende leven een vanzelfsprekendheid is en er continue
      aandacht bestaat voor het op peil houden van kennis en vaardigheden;
        - *menselijk kapitaal:* kennis en vaardigheden die mensen in staat stellen om economische en maatschappelijke
      waarde te creëren;
        - *technische en ICT sectoren:* sectoren winning van delfstoffen, industrie, productie en distributie van en handel
      in elektriciteit, aardgas, stoom en gekoelde lucht, winning en distributie van water, afval- en afvalwaterbeheer en
      sanering, bouwnijverheid en informatie en communicatie;
        - *visserijactiviteit:* het zoeken naar vis, het te water laten, uitzetten, slepen en ophalen van vistuig, het
      aan boord halen van de vangst, het overladen, het aan boord houden, het verwerken aan boord, het overbrengen, het
      kooien, vetmesten en aanlanden van vis en visserijproducten;
        - *visserijonderneming:* onderneming die zich bezighoudt met visserijactiviteiten.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.21.1
  - number: 3.21.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie voor een project dat tot doel heeft belemmeringen weg te nemen
      bij MKB-ondernemers om te investeren in scholing en ontwikkeling van hun personeel, zodat de leercultuur in hun
      onderneming wordt versterkt.

      2 Subsidie wordt verleend aan een MKB-ondernemer of een deelnemer in een samenwerkingsverband bestaande uit
      ondernemers, kennisinstellingen, brancheorganisaties of andere organisaties, waarbij ten minste 65% van het totaal
      aan deelnemers aan het samenwerkingsverband MKB-ondernemer is.

      3 Subsidie wordt niet verleend aan een landbouwonderneming of een visserijonderneming.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.21.2
  - number: 3.21.3
    text: |-
      1 De subsidie bedraagt voor een mkb-ondernemer 100% van de subsidiabele kosten doch minder dan € 125.000.

      2 De subsidie bedraagt voor een deelnemer in een samenwerkingsverband 100% van de subsidiabele kosten doch minder
      dan € 125.000, met dien verstande dat het totaal aan subsidie voor alle deelnemers in het samenwerkingsverband ten
      hoogste € 200.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.21.3
  - number: 3.21.4
    text: De Minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.21.4
  - number: 3.21.5
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.21.5
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.21.6
    text: |-
      De Minister besluit afwijzend op een aanvraag, indien:

      a. de kwaliteit van het projectplan onvoldoende is;

      b. het projectplan onvoldoende inzicht geeft in de toepassingsmogelijkheden van de projectresultaten bij andere
      ondernemers en de manier waarop toepassing van de projectresultaten gerealiseerd kan worden;

      c. het projectplan onvoldoende inzichtelijk maakt dat het project vernieuwend is voor de bij de aanvraag betrokken
      MKB-ondernemers;

      d. het project naar verwachting onvoldoende bijdraagt aan het doel, genoemd in [artikel 3.21.2, eerste lid][ref1];

      e. de aanvrager bij de aanvraag niet heeft ingestemd met het verlenen van medewerking aan een evaluatie van de
      effecten van deze titel;

      f. het projectplan onvoldoende inzicht geeft in actieve betrokkenheid van MKB-ondernemers bij het project;

      g. de subsidiabele kosten minder bedragen dan € 25.000 per project of in geval de subsidie wordt aangevraagd
      door een deelnemer in een samenwerkingsverband de subsidiabele kosten van één of meerdere deelnemers in dat
      samenwerkingsverband minder bedragen dan € 25.000.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.21.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.21.6
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.21.2
        hoofdstuk: '3'
  - number: 3.21.8
    text: |-
      1 De Minister kent aan de aanvraag een hoger aantal punten toe naarmate:

      a. het project meer bijdraagt aan de verwezenlijking van het doel, genoemd in [artikel 3.21.2, eerste lid][ref1];

      b. het project naar verwachting kwalitatief beter is;

      c. het project vernieuwender of origineler is voor de bij de aanvraag betrokken MKB-ondernemers;

      d. de verwachte projectresultaten een grotere bijdrage leveren aan:

      1°. het oplossen van belemmeringen die leiden tot meer en beter inzetbaar personeel in technische en ICT sectoren;

      2°. menselijk kapitaal met betrekking tot digitalisering;

      3°. menselijk kapitaal met betrekking tot de klimaat- en energietransitie; of

      4°. het versterken van de leercultuur bij een kleine onderneming;

      e. de verwachte projectresultaten meer perspectief bieden voor toepassing bij andere MKB-ondernemers.

      2 De Minister kent per onderdeel van het eerste lid ten hoogste 10 punten toe.

      3 De Minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.21.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.21.8
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.21.2
        hoofdstuk: '3'
  - number: 3.21.9
    text: |-
      1 Met de uitvoering van het project wordt gestart binnen twee maanden na de subsidieverlening.

      2 De subsidieontvanger verleent gedurende twee jaar na de datum van de beschikking tot subsidievaststelling
      medewerking aan een evaluatie van de effecten van het door hem uitgevoerde project, bedoeld in
      [artikel 3.21.2][ref1], voor zover deze medewerking redelijkerwijs van hem verlangd kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.21.2
