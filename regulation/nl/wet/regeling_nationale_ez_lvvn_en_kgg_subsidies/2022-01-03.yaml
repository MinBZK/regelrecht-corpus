  - number: 2.2.32
    text: |-
      1 De minister besluit afwijzend op een aanvraag voor subsidie, indien:

      a. een investering als bedoeld in [artikel 2.2.27, tweede lid][ref1], niet past binnen ten minste een van de
      doelstellingen, bedoeld in artikel 14, derde lid, onderdelen a, b en d, van de groepsvrijstellingsverordening
      landbouw;

      b. een investering als bedoeld in [artikel 2.2.27, tweede lid][ref2], niet in overeenstemming is met de wetgeving
      van de Europese Unie en met de nationale milieubeschermingswetgeving, als bedoeld in artikel 14, vijfde lid, van de
      groepsvrijstellingsverordening landbouw;

      c. de verlening van subsidie in strijd zou zijn met de verboden of beperkingen, bedoeld in artikel 14, elfde lid,
      van de groepsvrijstellingsverordening landbouw;

      d. de te verlenen subsidie lager is dan € 4.000;

      e. de aanvraag om subsidie betrekking heeft op gebruikte installaties, apparatuur, machines, technieken of
      uitrusting;

      f. op basis van de projectomschrijving, bedoeld in [artikel 2.2.35, derde lid, onderdeel a][ref3], aannemelijk is
      dat door het investeringsproject, bedoeld in [artikel 2.2.27, eerste lid][ref4], de totale reductie van emissie
      van fijnstof vanuit het desbetreffende type stalsysteem lager is dan 45% ten opzichte van de situatie waarin geen
      fijnstofreducerende techniek toegepast zou worden.

      2 In de berekening van de totale reductie van emissie van fijnstof, bedoeld in het eerste lid, onderdeel e,
      kunnen niet-gesubsidieerde fijnstofreducerende technieken worden meegenomen, indien deze technieken tijdens het
      investeringsproject toegepast worden of blijven worden en die zijn opgenomen in het Rekenmodel Vee-combistof
      zoals dat beschikbaar is via www.infomil.nl tijdens de openstellingsperiode waarin de aanvraag voor subsidie is
      ingediend.


