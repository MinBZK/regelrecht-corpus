      van een MVI Energie-project.

      2 Een samenwerkingsverband bevat ten minste één onderneming of een organisatie zonder winstoogmerk die
      ondernemingen als achterban heeft.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.23
