  - number: 3.10.13a
    text: |-
      1 Voor een startersfonds waaraan op grond van
      [artikel 4.3 van de Subsidieregeling starten, groeien en overdragen van ondernemingen][ref1] een subsidie is
      verstrekt voor het tijdstip van de inwerkingtreding van de regeling van de Minister van Economische Zaken van
      9 juli 2014 tot wijziging van de Subsidieregeling starten, groeien en overdragen van ondernemingen in verband met
      actualisatie van de subsidiemodule Seed capital technostarters (Stcrt. 2014, 19382) en waarvoor de overeenkomst van
      geldlening, bedoeld in [artikel 4.5 van de Subsidieregeling starten, groeien en overdragen van ondernemingen][ref2],
      nog geldig is, blijft die regeling van toepassing, zoals die gold voor dat tijdstip.

      2 Op verzoek van een startersfonds als bedoeld in het eerste lid kan de overeenkomst van geldlening worden
      aangepast overeenkomstig het model opgenomen in [bijlage 3.10.1][ref3], indien de aanpassing heeft plaatsgevonden
      binnen vier maanden na het in het eerste lid bedoelde tijdstip.

      3 Het tweede lid is niet van toepassing met betrekking tot het bepaalde in [bijlage 3.10.1][ref4], artikel 5,
      eerste lid, onderdeel c.

      4 Voor een startersfonds waaraan op grond van
      [artikel 2, eerste lid, van de Regeling seed capital technostarters][ref5], zoals die gold voor 1 januari 2009,
      een subsidie is verstrekt en waarvoor de overeenkomst tot geldlening, bedoeld in artikel 2, tweede lid, van die
      regeling nog geldig is, kan de overeenkomst tot geldlening op verzoek van het startersfonds worden aangepast
      overeenkomstig het model opgenomen in [bijlage 3.10.1][ref6], indien de aanpassing heeft plaatsgevonden binnen
      vier maanden na de inwerkingtreding van de regeling van de Minister van Economische Zaken van 4 september 2014, tot
      wijziging van de Regeling nationale EZ-subsidies in verband met het opnemen van een overgangsbepaling in titel 3.10
      (Stcrt. 2014, 25439).

      5 Het vierde lid is niet van toepassing met betrekking tot het bepaalde in
      [bijlage 3.10.1, artikel 5, eerste lid, onderdeel c][ref7].


