  - number: 3.20.7
    text: |-
      1 Een aanvraag voor subsidie bevat ten minste:

      a. gegevens over de subsidieaanvrager, waaronder het post- en bezoekadres van de subsidieaanvrager, het
      rekeningnummer van de subsidieaanvrager, en het nummer waarmee de onderneming van de subsidieaanvrager is
      geregistreerd bij de Kamer van Koophandel;

      b. gegevens over de praktijkbegeleider en de contactpersoon bij de subsidieaanvrager, waaronder de naam, het
      telefoonnummer en het e-mailadres van de desbetreffende persoon;

      c. een beknopte omschrijving en informatie betreffende:

      1°. de inhoud van het omscholingstraject en het ICT- en techniek-kansrijke beroep waarop het omscholingstraject
      betrekking heeft, inclusief de functietitel van het ICT- en techniek-kansrijke beroep en het beroepssegment als
      bedoeld in [bijlage 3.20][ref1] waartoe dit ICT- en techniek-kansrijke beroep behoort;

      2°. het opleidings- en arbeidsverleden van de werknemer, voor zover relevant in verband met
      [artikel 3.20.6, onderdeel a][ref2];

      3°. het perspectief van de werknemer op een of meer arbeidsovereenkomsten bij de werkgever, voor zover relevant in
      verband met [artikel 3.20.6, onderdeel b][ref3];

      4°. de in het kader van het omscholingstraject te volgen scholing, inclusief de aan die scholing verbonden
      certificeringen en keurmerken, voor zover relevant in verband met [artikel 3.20.6, eerste lid, onderdeel c][ref4];
      en

      5°. de aanwezigheid van de benodigde kennis en ervaring van de praktijkbegeleider, voor zover relevant in verband
      met [artikel 3.20.6, onderdeel d][ref5];

      d. een verklaring waaruit volgt dat de subsidiabele kosten ten minste:

      1°. € 1.000 bedragen voor de bij het desbetreffende omscholingstraject behorende scholing;

      2°. € 1.000 bedragen voor de bij het desbetreffende omscholingstraject behorende praktijkondersteuning; en

      3°. € 7.500 bedragen voor het gehele omscholingstraject;

      e. een verklaring waaruit volgt dat voor hetzelfde omscholingstraject voor dezelfde werknemer
      geen subsidie is verleend op grond van de [Subsidieregeling praktijkleren][ref6] of de
      __REF001___________________________________________________________________________________________________________
      ________________________________________; en

      f. een verklaring de-minimissteun van de subsidieaanvrager.

      2 Een aanvraag voor subsidie, bedoeld in het eerste lid, gaat vergezeld van:

      a. een verklaring van de werknemer waaruit volgt:

      1°. wat de naam, het telefoonnummer en het e-mailadres van de werknemer is;

      2°. dat de werknemer niet in een periode van minder dan twee jaar voorafgaand aan de aanvraag om subsidie bij
      een school voor voortgezet onderwijs als bedoeld in [artikel 1 van de Wet op het voortgezet onderwijs][ref8] het
      eindexamen heeft afgelegd;

      3°. dat de werknemer niet voor 1 juli 2021 werkzaam was binnen een beroepssegment als bedoeld in
      [bijlage 3.20][ref9] waartoe het ICT- en techniek-kansrijke beroep behoort waarop het omscholingstraject betrekking
      heeft; en

      4°. dat de werknemer voornemens is om met de werkgever een arbeidsovereenkomst te sluiten respectievelijk dat de
      werknemer een arbeidsovereenkomst heeft gesloten voor ten minste de looptijd van het omscholingstraject en een
      periode van zes maanden na afronding van het omscholingstraject, in het geval de werknemer het omscholingstraject
      met een voldoende resultaat afrondt; en

      b. een verklaring van een opleider, waaruit volgt:

      1°. wat de gegevens van de opleider zijn, waaronder het post- en bezoekadres van de opleider en de naam, het
      telefoonnummer en het e-mailadres van de contactpersoon bij de opleider;

      2°. dat hij bekend is met de inschrijving van de desbetreffende medewerker voor de desbetreffende scholing;

      3°. wat de subsidiabele kosten voor de desbetreffende scholing ten minste bedragen; en

      4°. voor zover van toepassing, dat de desbetreffende scholing past binnen een van de beschrijvingen, bedoeld in
      [artikel 3.20.6, eerste lid, onderdeel c, subonderdelen 1°, 2° en 3°][ref10]; en

      c. voor zover van toepassing, een verklaring van een brancheorganisatie waaruit volgt dat de
      desbetreffende scholing leidt tot een overheids-, branche- of sector-erkend certificaat als bedoeld in
      [artikel 3.20.6, onderdeel c, subonderdeel 4°][ref11].


      [ref1]: https://wetten.overheid.nl/BWBR0035474
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.20.6
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.20.6
      [ref4]: https://wetten.overheid.nl/BWBR0035474#Artikel3.20.6
