  - number: 3.9.2
    text: |-
      1 De minister verstrekt op aanvraag ten behoeve van de financiering van een ontwikkelingsproject subsidie met een
      terugbetalingsverplichting als bedoeld in [artikel 42 van het besluit][ref1] aan een ondernemer, die:

      a. een klinisch ontwikkelingsproject uitvoert, of

      b. een technisch ontwikkelingsproject uitvoert.

      2 In aanvulling op [artikel 3, eerste lid, van het besluit][ref2] kan ook subsidie worden verstrekt aan een
      ondernemer die gevestigd is in het openbaar lichaam Bonaire, Sint Eustatius of Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel3
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.9.2
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '3'
  - number: 3.9.3
    text: |-
      1 De subsidie heeft betrekking op experimentele ontwikkeling en bedraagt 25% van de subsidiabele kosten.

      2 Het percentage, genoemd in het eerste lid, wordt verhoogd met:

      a. 10 procentpunten, indien de aanvrager een middelgrote onderneming is en de subsidiabele kosten worden gemaakt en
      betaald door de middelgrote onderneming; of

      b. 20 procentpunten, indien de aanvrager een kleine onderneming is en de subsidiabele kosten worden gemaakt en
      betaald door de kleine onderneming.

      3 Indien het project daadwerkelijke samenwerking behelst en voldaan is aan de voorwaarden, bedoeld in artikel 25,
      zesde lid, onderdeel b, onder i, van de algemene groepsvrijstellingsverordening, wordt het percentage verhoogd met:

      a. 5 procentpunten, indien de aanvrager een kleine onderneming is en de subsidiabele kosten worden gemaakt en
      betaald door de kleine onderneming; of

      b. 15 procentpunten, indien de aanvrager een andere onderneming is.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.9.3
  - number: 3.9.4
    text: |-
      1 Het maximum subsidiebedrag bedraagt:

      a. € 5.000.000 per subsidieontvanger die een klinisch ontwikkelingsproject uitvoert, of

      b. € 10.000.000 per subsidieontvanger die een technisch ontwikkelingsproject uitvoert.

      2 Indien door een ondernemer, dan wel door ondernemers die behoren tot eenzelfde groep, meer dan één
      ontwikkelingsproject wordt uitgevoerd en daarvoor subsidieaanvragen in het kader van deze titel zijn ingediend,
      wordt in een kalenderjaar aan die ondernemer, dan wel aan die ondernemers die tot eenzelfde groep behoren
      gezamenlijk, ten hoogste € 10.000.000 aan subsidie verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.9.4
  - number: 3.9.4a
    text: |-
      Voor subsidie komen uitsluitend de kosten in aanmerking, bedoeld in artikel 25, derde lid, van de algemene
      groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.9.4a
  - number: 3.9.5
    text: De minister verdeelt de subsidieplafonds op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.9.5
  - number: 3.9.6
    text: |-
      1 De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1] is vijf jaar.

      2 De minister kan de termijn, bedoeld in het eerste lid, op verzoek met ten hoogste twee jaar verlengen indien
      sprake is van een technisch ontwikkelingsproject met een certificeringstraject.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.9.6
