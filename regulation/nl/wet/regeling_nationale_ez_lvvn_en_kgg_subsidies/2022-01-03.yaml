        bwb_id: BWBR0035474
        artikel: 3.16.1
        hoofdstuk: '3'
        paragraaf: 3.16.1
  - number: 3.16.11b
    text: De subsidie bedraagt 100% van de kosten van de haalbaarheidsstudie doch ten hoogste € 40.000.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.16.11b
  - number: 3.16.11c
    text: |-
      1 Met de uitvoering van de haalbaarheidsstudie wordt gestart binnen zes maanden nadat de subsidie is verleend.

      2 De haalbaarheidsstudie wordt uitgevoerd binnen zes maanden na de start van de haalbaarheidsstudie.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.16.11c
  - number: 3.16.11d
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. de voorgenomen activiteiten waarop de haalbaarheidsstudie betrekking heeft in technische of financiële zin
      onvoldoende risicovol zijn om de haalbaarheidsstudie te rechtvaardigen;

      b. de haalbaarheidsstudie naar verwachting onvoldoende inzicht zal geven in het commercieel perspectief en de
      uitvoerbaarheid van de voorgenomen activiteiten waarop de haalbaarheidsstudie betrekking heeft;

      c. er op voorhand onvoldoende vertrouwen bestaat in het commercieel perspectief of de uitvoerbaarheid van de
      voorgenomen activiteiten waarop de haalbaarheidsstudie betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.16.11d
  - number: 3.16.11e
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.16.11e
  - number: 3.16.11f
    text: |-
      1 De minister rangschikt de aanvragen waarop niet met toepassing van [artikel 3.16.11d][ref1] afwijzend is beslist,
      zodanig dat een aanvraag voor een haalbaarheidsstudie hoger gerangschikt wordt naarmate op voorhand:

      a. het commercieel perspectief van het voorgenomen vroegefasetraject groter wordt geacht;

      b. de kennisbasis en innovativiteit van het voorgenomen vroegefasetraject groter wordt geacht;

      c. de kwaliteit van de TO2-innovatieve starter en het team dat betrokken is bij het voorgenomen vroegefasetraject
      hoger wordt geacht;

      d. de kwaliteit van het voorgenomen vroegefasetraject hoger wordt geacht.

      2 Voor de rangschikking tellen de criteria, genoemd in het eerste lid, ieder voor 25 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.16.11d
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.16.11f
