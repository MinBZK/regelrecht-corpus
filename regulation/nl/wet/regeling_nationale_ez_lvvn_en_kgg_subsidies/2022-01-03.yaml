  - number: 3.8.14
    text: |-
      De subsidie, bedoeld in [artikel 3.8.2][ref1], bevat staatssteun en wordt gerechtvaardigd door artikel 25 van de
      algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.8.2
