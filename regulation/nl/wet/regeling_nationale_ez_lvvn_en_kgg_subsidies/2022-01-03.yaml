  - number: 4.2.70
    text: |-
      1 Onverminderd [artikel 4.2.3][ref1] bevat een aanvraag om subsidie een projectomschrijving, een financieringsplan
      en voor projecten die geen experimentele ontwikkeling betreffen, een exploitatieberekening inclusief de financiële
      parameters van het project.

      2 Uit de projectomschrijving blijkt de CO-reductie in kilogrammen die het project realiseert ten opzichte van het
      gangbare minder milieuvriendelijke alternatief naar de huidige stand van de techniek.

      3 Het eindverslag dat bij de aanvraag voor subsidievaststelling wordt ingediend, bedoeld in artikel 50, tweede lid,
      onderdeel a, van het besluit, bevat, voor zover van toepassing, in ieder geval:

      a. een algemene en technische omschrijving van de onderzochte en gebruikte installaties en infrastructuur;

      b. een exploitatieberekening inclusief de financiële parameters van het project;

      c. een overzicht van de investeringskosten per component van het project;

      d. een overzicht van de kostenopbouw toegespitst op de verschillende kostencomponenten, inclusief risico-opslag; en

      e. een overzicht van alle kosten en baten.

      4 Tegelijkertijd met de aanvraag tot subsidievaststelling voor een project dat past binnen het in paragraaf 3.6
      van [bijlage 4.2.9][ref2], onderdeel B, opgenomen thema, geeft de subsidieontvanger door middel van een verslag ten
      minste inzicht in:

      a. de vervolgstappen die het samenwerkingsverband na afloop van het project zet om te komen tot uitvoering en
      implementatie in de markt van wat onderzocht is;

      b. de verwachte kosten en prijsreductie ten opzichte van de referentie van het aardgasloos maken van een woning,
      wijk, of gebouw op basis van dit project.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.3
      [ref2]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.70
