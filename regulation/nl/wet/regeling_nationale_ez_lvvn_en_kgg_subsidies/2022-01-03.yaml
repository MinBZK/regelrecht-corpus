  - number: 3.23.6
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.23.6
  - number: 3.23.7
    text: |-
      De minister beslist afwijzend op een aanvraag voor subsidie, indien:

      a. de werking van het nieuwe product of proces of de nieuwe dienst onvoldoende wetenschappelijk onderbouwd is
      middels concrete, experimentele data;

      b. een duidelijk concurrentievoordeel voor de al dan niet toekomstige Venture Challenge startup ontbreekt;

      c. de al dan niet toekomstige Venture Challenge startup of het nieuwe product of proces of de nieuwe dienst
      onvoldoende commerciële potentie heeft;

      d. er onvoldoende vertrouwen is dat bij elke Venture Challenge bijeenkomst minimaal twee leden van het Venture
      Challenge team aanwezig zijn;

      e. een of meerdere leden van het Venture Challenge team reeds eerder met dezelfde nieuwe technologische vinding of
      nieuwe toepassing van een reeds bestaande technologie mee hebben gedaan aan het Venture Challenge programma of een
      voorloper daarvan, zonder dat deze technologie of nieuwe toepassing sterk verbeterd is;

      f. er onvoldoende vertrouwen bestaat dat de leden van het Venture Challenge team de capaciteiten hebben om een
      succesvolle Venture Challenge startup op te bouwen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.23.7
  - number: 3.23.8
    text: |-
      1 De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger, naarmate:

      a. het commerciële perspectief van het nieuwe product of proces of de nieuwe dienst groter is;

      b. het nieuwe product of proces of de nieuwe dienst meer vernieuwend is;

      c. de concurrentiepositie van de al dan niet toekomstige Venture Challenge startup een beter perspectief heeft;

      d. de financieringspotentie van de al dan niet toekomstige Venture Challenge startup groter is;

      e. de kwaliteit van het Venture Challenge team hoger is, gelet op de mate van complementariteit van de leden, de
      capaciteiten van de leden en de rolverdeling binnen het team;

      f. de toegevoegde waarde van deelname aan het Venture Challenge Programma voor de al dan niet toekomstige Venture
      Challenge startup groter is.

      2 Voor de rangschikking wegen de in het eerste lid genoemde criteria even zwaar.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.23.8
  - number: 3.23.9
    text: |-
      1 De subsidie wordt slechts aangewend ter dekking van de subsidiabele kosten van het Venture Challenge programma
      dat start op de in de beschikking tot subsidieverlening genoemde datum.

      2 Aan iedere Venture Challenge bijeenkomst nemen minimaal twee en maximaal vier leden van het Venture Challenge
      team deel, doch nooit meer dan opgegeven bij de subsidieaanvraag.

      3 De leden van het Venture Challenge team houden de niet-openbare kennis van de andere deelnemende Venture
      Challenge teams, die gedeeld wordt tijdens het Venture Challenge programma, geheim.

      4 Indien de subsidieontvanger een Venture Challenge startup is, zorgt deze ervoor dat het Venture Challenge team
      voldoet aan de verplichtingen, bedoeld in het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.23.9
  - number: 3.23.10
    text: |-
      1 Een aanvraag om subsidie bevat ten minste de gegevens, bedoeld in artikel 6, tweede lid, van de algemene
      groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag om subsidie ten minste:

      a. indien een subsidieaanvraag wordt gedaan door een Venture Challenge startup:

      1°. gegevens over de Venture Challenge startup, waaronder de naam van de Venture Challenge startup, de grootte
      van de onderneming, het nummer waaronder de onderneming geregistreerd is bij de Kamer van Koophandel en het post-
      en bezoekadres;

      2°. gegevens van de leden van het Venture Challenge team en de contactpersoon, waaronder de namen, telefoonnummers
      en e-mailadressen;

      b. indien een subsidieaanvraag wordt gedaan door deelnemers in een Venture Challenge samenwerkingsverband:

      1°. gegevens over de deelnemers en de contactpersoon van de penvoerder, waaronder de namen, de namen van de
      organisaties waar zij werkzaam zijn, de post- en bezoekadressen, telefoonnummers en e-mailadressen;

      2°. de werktitel van de toekomstige Venture Challenge startup;

      c. een opgave van het aantal leden van het Venture Challenge team dat zal deelnemen aan de Venture Challenge
      bijeenkomsten, met een minimum van drie en een maximum van vier leden;

      d. een applicatieformulier, inhoudende:

      1°. een korte beschrijving van de verbetering die het product, proces of de nieuwe dienst beoogd te
      bewerkstelligen;

      2°. een korte beschrijving van het nieuwe product of proces of de nieuwe dienst en de achterliggende wetenschap
      of technologie en de mate waarin de werking van het nieuwe product of proces of de nieuwe dienst gevalideerd is
      middels concrete, experimentele data;

      3°. een inschatting van de markt;

      4°. een beschrijving van de uniciteit van het nieuwe product of proces of de nieuwe dienst;

      5°. een beschrijving van het Venture Challenge team, waaruit in ieder geval de achtergrond van, de motivatie van en
      de rolverdeling binnen het team blijkt;

      e. een opgave van beschikbaarheid voor een interview als bedoeld in het derde lid;

      f. de innovatieadviesdienstverklaring of, in geval van een Venture Challenge samenwerkingsverband, de
      innovatieadviesdienstverklaringen.

      3 Indien dit wenselijk wordt geacht voor de beoordeling van de aanvraag, kan een interview deel uitmaken van de
      aanvraagprocedure.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.23.10
  - number: 3.23.11
    text: |-
      De subsidie, bedoeld in [artikel 3.23.2, eerste lid][ref1], bevat staatssteun en wordt gerechtvaardigd door artikel
      28 van de algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.23.2
