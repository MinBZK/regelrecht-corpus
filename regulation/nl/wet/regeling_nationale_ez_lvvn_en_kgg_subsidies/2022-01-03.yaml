  - number: 4.5.13
    text: |-
      1 Een aanvraag tot subsidievaststelling van een rechtspersoon of natuurlijke persoon, niet-zijnde eigenaar-bewoner,
      bevat ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de aanvrager, het post- en bezoekadres, het e-mailadres, het
      telefoonnummer, het rekeningnummer, gegevens over de contactpersoon bij de aanvrager en voor zover van toepassing
      het Burgerservicenummer of het nummer waaronder de onderneming is geregistreerd bij de Kamer van Koophandel en en
      het door de minister verstrekte referentienummer;

      b. de omvang van de vast te stellen subsidie;

      c. de kerngegevens voor de onderbouwing van de subsidievaststelling, waaronder de locatie of locaties waar het
      project is uitgevoerd, en voor zover de investering betrekking heeft op de productie van duurzame energie, bedoeld
      in [artikel 4.5.2, tweede lid][ref1], de omschrijving van de aard van de installaties die zijn geïnstalleerd.

      2 Onverminderd [artikel 50, tweede lid, van het besluit][ref2] gaat de aanvraag tot subsidievaststelling van een
      rechtspersoon of natuurlijke persoon, niet-zijnde eigenaar-bewoner, vergezeld van:

      a. een factuur en betaalbewijs van de aanschaf en installatie van de investering voor de productie van duurzame
      energie als bedoeld in [artikel 4.5.2, tweede lid][ref3], waaronder begrepen de door het bouwinstallatiebedrijf
      getekende factuur in geval van contante betaling van deze investeringen, waarop ten minste het betaalde bedrag, de
      begunstigde en betaaldatum vermeld wordt;

      b. indien het een investering voor de productie van duurzame energie als bedoeld in
      [artikel 4.5.2, tweede lid][ref4], betreft, een document waaruit blijkt dat een investering:

      1°. in gebruik is genomen;

      2°. voldoet aan de technische eisen; en

      3°. is geïnstalleerd of aangebracht door een bouwinstallatiebedrijf;

      c. indien het een investering voor een installatie voor de productie van hernieuwbare elektriciteit uit zonlicht
      als bedoeld in [artikel 4.5.2, tweede lid, onderdeel c][ref5], betreft:

      1°. een document waaruit blijkt dat het gezamenlijke vermogen van de fotovoltaïsche zonnepanelen ten minste 15
      kWp bedraagt;

      2°. een document waaruit blijkt dat de installatie is aangesloten op het openbare Nederlandse elektriciteitsnet via
      een aansluiting met ten hoogste een totale doorlaatwaarde van 3*80 A die op naam staat van de aanvrager;

      d. indien het een investering voor een installatie voor de productie van hernieuwbare elektriciteit met één of meer
      windturbines als bedoeld in [artikel 4.5.2, tweede lid, onderdeel d][ref6], betreft:

      1°. een vergunning op grond van de [Wet algemene bepalingen omgevingsrecht][ref7];

      2°. een document waaruit blijkt dat het rotoroppervlak per windturbine ten minste 50 m2 bedraagt;

      3°. een document waaruit blijkt dat de installatie is aangesloten op het openbare Nederlandse elektriciteitsnet via
      een aansluiting met ten hoogste een totale doorlaatwaarde van 3*80 A die op naam staat van de aanvrager;

      e. indien het een investering voor de centrale aansluiting op een warmtenet als bedoeld in
      [artikel 4.5.2, vierde lid, onderdeel b][ref8], betreft, een overeenkomst met een warmteleverancier waaruit blijkt
      dat het appartementencomplex is aangesloten op een warmtenet.

      3 In het geval de subsidieontvanger een eigenaar-bewoner is, wordt op grond van de aanvraag voor subsidie en de
      documenten waardoor deze vergezeld gaat, bedoeld in [artikel 4.5.12, eerste en vierde lid][ref9], de subsidie
      vastgesteld zonder voorafgaande beschikking tot subsidieverlening.

      4 De subsidie voor een investering, bedoeld in [artikel 4.5.2, tweede, derde en vierde lid][ref10], wordt niet
      ambtshalve vastgesteld.


