  - number: 3.27.11
    text: |-
      1 Op verzoek van de minister verleent de subsidieontvanger medewerking aan het verspreiden van de resultaten van de
      op grond van deze titel gesubsidieerde activiteiten.

      2 De subsidieontvanger verstrekt gedurende de looptijd van het Nederlandse belangrijke project jaarlijks een
      voortgangsrapportage over het project die de minister kan gebruiken voor de openbare brede verspreiding van de
      niet-bedrijfsgevoelige kennis en informatie die met het project worden opgedaan.

      3 De subsidieontvanger maakt de niet bedrijfsgevoelige kennis en informatie die met het project wordt opgedaan na
      afloop van het project openbaar in een, naar het oordeel van de minister, kwalitatief voldoende verslag.

      4 De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.

      5 De informatie, bedoeld in het tweede en derde lid, wordt verstrekt met gebruikmaking van een middel dat door de
      minister beschikbaar wordt gesteld.

      6 In afwijking van het tweede en derde lid kan de minister, in overeenstemming met de minister die het mede
      aangaat, voor zover dit noodzakelijk is voor de bescherming van wezenlijke belangen voor de veiligheid van de
      staat, de openbare orde en de openbare veiligheid:

      a. besluiten dat resultaten niet bekend gemaakt worden of aan derden beschikbaar gesteld worden; of

      b. op aanvraag van de subsidieontvanger ontheffing verlenen van de verplichtingen, bedoeld in het tweede of derde
      lid.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.27.11
  - number: 3.27.12
    text: |-
      1 Een aanvraag om subsidie bevat ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het nummer waarmee de onderneming is
      geregistreerd bij de Kamer van Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. kerngegevens over het Nederlandse belangrijke project, die bestaan uit een samenvatting van de
      projectomschrijving en, voor zover van toepassing, een lijst met deelnemers aan het samenwerkingsverband dat het
      Nederlandse belangrijke project zal uitvoeren en de activiteiten die iedere deelnemer in het samenwerkingsverband
      zal verrichten;

      d. gegevens over de grootte van de onderneming van de aanvrager, indien de aanvrager aanspraak wil
      maken op een verhoogd percentage aan subsidie voor een kleine of middelgrote onderneming als bedoeld in
      [artikel 3.27.3, tweede lid, onderdelen a en b][ref1].

      2 De aanvraag gaat vergezeld van:

      a. een projectomschrijving van de doelstelling of doelstellingen en de werkzaamheden van het Nederlandse
      belangrijke project;

      b. een financieringsplan en begroting waarin een omschrijving wordt gegeven van:

      1°. de omvang van de gevraagde subsidie;

      2°. de totale kosten van het Nederlandse belangrijke project, inclusief een beschrijving van welk deel van de
      kosten betrekking heeft op één of meer van de activiteiten als bedoeld in [artikel 3.27.2, tweede lid][ref2];

      3°. informatie over de wijze waarop de deelnemers in het Europees of Nederlands samenwerkingsverband hun eigen
      aandeel in de projectkosten van het Nederlandse belangrijke project financieren;

      4°. voor zover van toepassing, het nul-scenario, waaronder mede begrepen een beschrijving van de wijze van
      financiering voor de situatie waarin geen subsidie op grond van deze titel verstrekt zou worden;

      5°. voor zover van toepassing, de aanwezige financieringskloof, waaronder, voor zover van toepassing, mede begrepen
      informatie over de verwachte opbrengsten gedurende de levensduur van een investering;

      c. documenten met daarin een beknopte beschrijving van de projectorganisatie en de kennis, ervaring en capaciteiten
      van de bij de uitvoering van het Nederlandse belangrijke project betrokken organisaties of personen, voor zover
      deze relevant zijn voor de toepassing van [artikel 3.27.8, eerste lid, onderdeel c, en tweede lid][ref3];

      d. een plan dat betrekking heeft op de wijze waarop de kennisverspreiding plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.27.3
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.27.2
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.27.8
