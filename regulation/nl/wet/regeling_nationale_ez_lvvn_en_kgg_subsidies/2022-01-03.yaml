  - number: 3.19.8a
    text: |-
      1 De minister kent aan een project een hoger aantal punten toe naarmate:

      a. het innovatiegehalte van het scheepsbouwinnovatieproject hoger is;

      b. de bijdrage van het scheepsbouwinnovatieproject aan de verduurzaming van de scheepvaart groter is;

      c. de economische potentie en toepassingsmogelijkheden van het scheepsbouwinnovatieproject groter zijn;

      d. de kwaliteit van de aanvraag beter is.

      2 De minister kent per onderdeel van het eerste lid ten hoogste 25 punten toe.

      3 Indien de minister in één kalenderjaar meer aanvragen van een aanvrager of aanvragers behorende tot één groep
      heeft ontvangen, wordt bij de tweede aanvraag tien punten in mindering gebracht, bij de derde aanvraag vijftien
      punten en elke volgende aanvraag twintig punten.

      4 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekent.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.19.8a
  - number: 3.19.9
    text: |-
      1 Een aanvraag om subsidie bevat ten minste de gegevens, bedoeld in artikel 6, tweede lid, van de algemene
      groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag om subsidie ten minste:

      a. gegevens over de aanvrager, waaronder het nummer waaronder de onderneming geregistreerd is bij de Kamer van
      Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. gegevens over de bouw of verbouw van het schip of de bouw van de drijvende en bewegende offshore-constructie;

      d. een projectplan voor uitvoering van het scheepsbouwinnovatieproject;

      e. een verklaring van de scheepswerf en de opdrachtgever voor de bouw of verbouw van een schip of de bouw van een
      drijvende en bewegende offshore-constructie waaruit de intentie tot uitvoering van het scheepsbouwinnovatieproject
      blijkt.

      3 Onverminderd het eerste en tweede lid bevat een aanvraag om subsidie voor een grote onderneming tevens door die
      onderneming opgestelde documenten waaruit blijkt dat de subsidie zal leiden tot:

      a. een wezenlijke toename van de omvang van het scheepsbouwinnovatieproject;

      b. een wezenlijke toename van de totale uitgaven van de subsidieontvanger voor het scheepsbouwinnovatieproject als
      gevolg van de subsidie, of

      c. een wezenlijke toename van de snelheid waarmee het scheepsbouwinnovatieproject wordt voltooid.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.19.9
  - number: 3.19.10
    text: |-
      De subsidieontvanger maakt de niet bedrijfsgevoelige kennis en informatie die met de op grond van deze titel
      uitgevoerde activiteiten worden opgedaan na afloop van het project openbaar in een, naar het oordeel van de
      minister, kwalitatief voldoende verslag.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.19.10
  - number: 3.19.11
    text: |-
      De subsidie, bedoeld in [artikel 3.19.2][ref1], bevat staatssteun en wordt gerechtvaardigd door artikel 25 van de
      algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.19.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.19.11
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.19.2
        hoofdstuk: '3'
  - number: 3.19.12
    text: |-
      Deze titel en [bijlage 3.19.1][ref1] vervallen met ingang van 1 mei 2023, met dien verstande dat deze van
      toepassing blijven op subsidies die voor die datum zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.19.12
