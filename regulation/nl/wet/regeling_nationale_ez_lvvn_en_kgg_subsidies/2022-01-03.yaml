        bwb_id: BWBR0035474
        artikel: 3.23.5
        hoofdstuk: '3'
  - number: 3.23.2
    text: |-
      1 Op aanvraag verstrekt de minister subsidie voor deelname van een Venture Challenge team aan het Venture Challenge
      programma aan de deelnemers in een Venture Challenge samenwerkingsverband of aan een Venture Challenge startup,
      dat of die erop gericht is een nieuw product of proces of een nieuwe dienst op de markt te brengen dat of die past
      binnen de doelstellingen van de topsector Life Sciences & Health.

      2 Een nieuw product of proces of een nieuwe dienst als bedoeld in het eerste lid, is een nieuw medicijn of nieuwe
      therapie, een nieuw diagnosticum, een nieuw medisch hulpmiddel, dan wel een nieuwe technologie die het ontdekken,
      ontwikkelen of het gebruik van medicijnen, therapieën, diagnostica of medische hulpmiddelen verbetert of mogelijk
      maakt.

      3 De subsidie, bedoeld in het eerste lid, wordt uitsluitend verstrekt, indien, na toepassing van de
      afwijzingsgronden, bedoeld in de [artikelen 22][ref1] en [23 van het besluit][ref2] en [artikel 3.23.7][ref3],
      ten minste vijf subsidieaanvragen in aanmerking komen voor subsidie en deze aanvragen zijn ingediend gedurende de
      openstellingsperiode, genoemd in de ministeriële regeling, bedoeld in [artikel 16 van het besluit][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.23.7
      [ref4]: https://wetten.overheid.nl/BWBR0024796#Artikel16
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.23.2
