        hoofdstuk: '3'
  - number: 3.27.9
    text: |-
      1 Indien in het Nederlandse belangrijke project niet-economisch onafhankelijk industrieel onderzoek, experimentele
      ontwikkeling of een haalbaarheidsstudie door een onderzoeksorganisatie wordt verricht in een Europees of Nederlands
      samenwerkingsverband:

      a. wordt voorafgaand aan de start van het Nederlandse belangrijke project een samenwerkingsovereenkomst gesloten
      tussen de deelnemers aan het samenwerkingsverband over de wijze waarop wordt omgegaan met de bijdrage in de kosten,
      het delen in de risico’s en uitkomsten, de verspreiding van de resultaten en de toegang tot en de regels voor de
      toewijzing van intellectuele eigendomsrechten;

      b. worden de projectactiviteiten door de onderzoeksorganisatie:

      1°. uitgevoerd in daadwerkelijke samenwerking met ondernemingen; en

      2°. in de boekhouding opgenomen als niet-economische activiteiten; en

      c. draagt de onderzoeksorganisatie er zorg voor dat:

      1°. de deelnemende ondernemingen de volledige kosten van de activiteiten dragen;

      2°. de resultaten van de activiteiten waaraan geen intellectuele eigendomsrechten kunnen worden ontleend,
      ruim mogen worden verspreid en eventuele intellectuele eigendomsrechten die uit de activiteiten van de
      onderzoeksorganisatie voortvloeien, volledig aan haar worden toegekend;

      3°. uit de activiteiten ontstane intellectuele eigendomsrechten, alsmede daarmee verband houdende toegangsrechten,
      aan de verschillende samenwerkende deelnemers worden toegekend op een wijze die een passende afspiegeling is van
      hun werkpakketten, bijdragen en respectieve belangen; of

      4°. het van de deelnemende ondernemingen een vergoeding ontvangt die overeenstemt met de marktprijs voor de
      intellectuele eigendomsrechten die voortvloeien uit het samenwerkingsproject die worden overgedragen aan de
      deelnemende ondernemingen.

      2 Het absolute bedrag van financiële en niet-financiële bijdragen van de deelnemende ondernemingen in de kosten van
      de activiteiten van de onderzoeksorganisatie die de betrokken intellectuele eigendomsrechten hebben opgeleverd, kan
      op de vergoeding, bedoeld in het eerste lid, onderdeel c, subonderdeel 4°, in mindering worden gebracht.

      3 De vergoeding, bedoeld in het eerste lid, onderdeel c, subonderdeel 4°, stemt overeen met de marktprijs indien:

      a. het bedrag van de vergoeding is vastgesteld via een publieke, open en transparante concurrerende
      verkoopprocedure;

      b. een taxatie van een onafhankelijke deskundige bevestigt dat de prijs overeenstemt met de marktprijs;

      c. de onderzoeksorganisatie als verkoper kan aantonen dat zij heeft onderhandeld over de vergoeding, om rekening
      houdende met haar algemene doelstellingen, maximaal economisch voordeel te behalen op het tijdstip dat de
      overeenkomst betreffende de vergoeding wordt afgesloten; of

      d. in de gevallen waarin de samenwerkingsovereenkomst, bedoeld in het eerste lid onderdeel a, de onderneming een
      voorkeursrecht geeft ten aanzien van het door de onderzoeksorganisatie gegenereerde intellectuele eigendomsrecht,
      wanneer hieraan voor de onderzoeksorganisatie het recht is gekoppeld derden te verzoeken om economisch meer
      voordelige aanbiedingen, zodat de onderneming haar aanbod daaraan moet aanpassen.

      4 De voorwaarden van een overeenkomst, gesloten ingevolge het derde lid, onderdeel c, wijken niet af van
      voorwaarden die onafhankelijke ondernemingen overeen zouden komen en behelzen geen enkele vorm van heimelijke
      verstandhouding.

      5 [Artikel 1.9][ref1] is niet van toepassing op deze titel.


