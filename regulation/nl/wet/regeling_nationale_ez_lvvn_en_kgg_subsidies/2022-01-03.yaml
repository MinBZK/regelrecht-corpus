  - number: 3.16.1c
    text: |-
      De minister verstrekt op aanvraag een subsidie in de vorm van een geldlening aan een financier voor het
      verstrekken van geldleningen aan MKB-ondernemers, uitgezonderd MKB-ondernemers die werkzaam zijn in de
      visserij- en aquacultuursector, of innovatieve starters ten behoeve van de financiering van vernieuwingsfase- of
      vroegefasetrajecten en voor verrekening van de kosten, bedoeld in [artikel 3.16.1h][ref1].


