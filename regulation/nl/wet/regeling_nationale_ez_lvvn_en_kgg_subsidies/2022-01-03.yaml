      1 De minister kent aan een project een hoger aantal punten toe naarmate:

      a. het project meer bijdraagt aan de doelstelling van de subsidie, opgenomen in [bijlage 4.2.18][ref1];

      b. de slaagkans van de innovatie in de internationale markt groter is;

      c. de bijdrage aan de Nederlandse economie groter is;

      d. het project meer bijdraagt aan versterking van de positie van Nederlandse partijen in het Clean-
      Aviationpartnerschap;

      e. de kwaliteit van het project beter is, blijkend uit de uitwerking van aanpak en methodiek, de omgang met
      risico’s, de uitvoerbaarheid, het samenwerkingsverband en de deelnemende partijen;

      f. het project meer bijdraagt aan de realisatie van de klimaatdoelstellingen voor 2030 zoals vastgelegd in het
      klimaatakkoord.

      2 De minister kent per onderdeel van het eerste lid ten minste één en ten hoogste vijf punten toe.

      3 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.

      4 Geen subsidie wordt verleend voor een project dat lager is gerangschikt dan een soortgelijk project.


