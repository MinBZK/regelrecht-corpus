    text: |-
      1 De subsidievoorwaarden uit [artikel 3.10.3][ref1] zijn van overeenkomstige toepassing op een seed business angel
      fonds.

      2 In de overeenkomst van geldlening wordt bepaald dat de financier tot zekerheid van nakoming van het in die
      overeenkomst bepaalde aan de Staat een pandrecht verstrekt op de aandelen en achtergestelde vorderingen die in het
      kader van een participatie zijn verkregen.


