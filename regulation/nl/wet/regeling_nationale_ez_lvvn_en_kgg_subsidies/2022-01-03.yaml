      1 Het rapport van feitelijke bevindingen, bedoeld in [artikel 12, derde lid, van het besluit][ref1], wordt
      opgesteld overeenkomstig het protocol dat is opgenomen in [bijlage 1.1][ref2].

      2 Als rapport als bedoeld in [artikel 12, derde lid, van het besluit][ref3], wordt aangewezen een afschrift van het
      rapport van feitelijke bevindingen van een externe accountant inzake de actueel gebruikte methode voor berekening
      van de personeelskosten en indirecte kosten dat is opgesteld in het kader van [verordening (EG) nr. 1906/2006]
      (32006R1906) van het Europees Parlement en de Raad van de Europese Unie van 18 december 2006 tot vaststelling
      van de regels voor de deelname van ondernemingen, onderzoekscentra en universiteiten aan acties op grond van het
      zevende kaderprogramma, en voor verspreiding van onderzoeksresultaten (2007–2013) (PbEU 2006, L 391) en, indien de
      subsidieontvanger daarover beschikt, een afschrift van de goedkeuring door de Europese Commissie van dat rapport.


