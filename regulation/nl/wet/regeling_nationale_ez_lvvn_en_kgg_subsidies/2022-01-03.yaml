  - number: 3.9.8
    text: |-
      1 De subsidieontvanger is verplicht de verstrekte subsidie volgens een in de beschikking tot subsidieverlening
      vastgelegd schema terug te betalen aan de minister.

      2 De subsidieontvanger is verplicht over het uitstaande saldo, met uitzondering van de opslag, aan de
      minister jaarlijks een bij de beschikking tot subsidieverlening, overeenkomstig [artikel 3.9.9][ref1],
      bepaald rentepercentage te betalen, dat op een ontwikkelingsproject van toepassing blijft tot aan de
      betalingsverplichtingen geheel is voldaan.

      3 De rente wordt aan het eind van elk kalenderjaar rentedragend bij het uitstaande saldo bijgeschreven.

      4 Onverminderd het tweede lid, is de subsidieontvanger eenmalig verplicht om aan de minister een bij de beschikking
      tot subsidieverlening, overeenkomstig [artikel 3.9.9][ref2], bepaald opslagpercentage te betalen over het bedrag
      dat is uitbetaald als subsidie in de vorm van krediet. De opslag wordt aan het eind van het kalenderjaar waarin de
      subsidie is vastgesteld, bij het uitstaand saldo bijgeschreven.

      5 De subsidieontvanger is verplicht het uitstaande saldo binnen 10 jaar na vaststelling van de subsidie aan de
      minister te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.9.9
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.9.9
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.9.8
