  - number: 4.2.1
    text: |-
      1 Bij de toepassing van [artikel 6, eerste lid, van het besluit][ref1] worden bij het verlenen van subsidie op
      basis van deze titel buiten beschouwing gelaten:

      a. subsidies op grond van:

      1°. het [Besluit stimulering duurzame energieproductie][ref2];

      2°. het [Besluit stimulering duurzame energieproductie en klimaattransitie][ref3];

      3°. de [Eerste tijdelijke noodmaatregel overbrugging voor behoud van werkgelegenheid][ref4],
      de [Tweede tijdelijke noodmaatregel overbrugging voor behoud van werkgelegenheid][ref5] of de
      [Derde tijdelijke noodmaatregel overbrugging voor behoud van werkgelegenheid][ref6];

      b. bijdragen van de Europese Commissie op grond van:

      1°. verordening (EU) nr. 1291/2013 van het Europees Parlement en de Raad van 11 december 2013 tot vaststelling
      van Horizon 2020 - het kaderprogramma voor onderzoek en innovatie (2014 2020) en tot intrekking van Besluit nr.
      1982/2006/EG (PbEU 2013, L 347);

      2°. verordening (EU) 2019/856 van de Europese commissie van 26 februari 2019 houdende aanvulling van [Richtlijn
      2003/87/EG](32003L0087) van het Europees Parlement en de Raad met betrekking tot de werking van het innovatiefonds
      (PbEU 2019, L 140/6);

      c. bijdragen van een managementautoriteit als bedoeld in
      [artikel 1.1 van de Regeling Europese EZK- en LNV-subsidies][ref7] die worden gefinancierd door de Europese Unie
      overeenkomstig de artikelen 92 bis en 92 ter van verordening (EU) nr. 1303/2013 van het Europees Parlement en
      de Raad van 17 december 2013 houdende gemeenschappelijke bepalingen inzake het Europees Fonds voor regionale
      ontwikkeling, het Europees Sociaal Fonds, het Cohesiefonds, het Europees Landbouwfonds voor plattelandsontwikkeling
      en het Europees Fonds voor maritieme zaken en visserij en algemene bepalingen inzake het Europees Fonds voor
      regionale ontwikkeling, het Europees Sociaal Fonds, het Cohesiefonds en het Europees Fonds voor maritieme zaken en
      visserij, en tot intrekking van [Verordening (EG) nr. 1083/2006](32006R1083) van de Raad (PbEU 2013, L347).

      2 Bijdragen van gemeenten, provincies, waterschappen en openbare lichamen als bedoeld in
      [artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen][ref8], worden aangemerkt als publieke
      cofinanciering, en blijven bij de toepassing van [artikel 6, eerste lid, van het besluit][ref9] buiten beschouwing
      voor zover het de berekening betreft van het maximum bedrag dat krachtens deze titel per project kan worden
