  - number: 4.5.10
    text: |-
      Voor een investering voor de productie van duurzame energie of centrale aansluiting op een warmtenet als bedoeld in
      [artikel 4.5.2, tweede lid, respectievelijk vierde lid, onderdeel b][ref1], wordt de subsidie aan een rechtspersoon
      of natuurlijke persoon, niet-zijnde eigenaar-bewoner, verleend onder de opschortende voorwaarde dat:

      a. een overeenkomst wordt gesloten met een bouwinstallatiebedrijf of warmteleverancier in verband met de aanschaf
      van de installatie of installaties dan wel de centrale aansluiting op een warmtenet;

      b. de installatie of installaties dan wel de centrale aansluiting op een warmtenet waarop de overeenkomst, bedoeld
      in onderdeel a, betrekking heeft, zijn geïnstalleerd respectievelijk aangesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.5.10
    references:
      - id: ref1
