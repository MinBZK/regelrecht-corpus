  - number: 3.17.1
    text: |-
      In deze titel wordt verstaan onder:

        - *innovatiecluster:* innovatiecluster als bedoeld in artikel 2, onderdeel 92, van de algemene
      groepsvrijstellingsverordening;
        - *onderzoeksorganisatie:* organisatie voor onderzoek en kennisverspreiding als bedoeld in artikel 2, onderdeel 83,
      van de algemene groepsvrijstellingsverordening;
        - *opschalen:* het uitvoeren van activiteiten waarmee een supportprogramma, dat na eerdere toepassing positieve
      gevolgen heeft gehad voor de oprichting en groei van startups of scale-ups in een bepaalde provincie in Nederland
      of in het buitenland, wordt uitgebreid naar minimaal twee andere Nederlandse provincies, eventueel door middel van
      samenvoeging met één of meer andere supportprogramma’s tot één groter supportprogramma;
        - *supportprogramma:* samenhangend geheel van activiteiten dat gericht is op het creëren van gunstige
      randvoorwaarden voor de oprichting en groei van startups of scale-ups, bestaande uit ondersteuning bij het
      verkrijgen van toegang tot: a. financiering; b. markten; c. voldoende gekwalificeerde werknemers als bedoeld
      in [artikel 610 van Boek 7 van het Burgerlijk Wetboek][ref1]; d. samenwerkingspartners; of e. technologische of
      wetenschappelijke kennis die bruikbaar is bij het ontwikkelen van een product;
        - *scale-up:* een startup die substantieel is doorgegroeid en waarvan de verwachting is dat deze zou kunnen blijven
      doorgroeien;
        - *startup:* een kleine of middelgrote onderneming die: a. actief in stand gehouden wordt voor een aaneengesloten
      periode van ten hoogste tien jaar; en b. een vernieuwend product of dienst ontwikkelt of levert: 1°. die tot
      stand komt respectievelijk is gekomen door het gebruik van een nieuwe of bestaande technologie; en 2°. waarvan het
      aannemelijk is dat deze voor langere tijd door een steeds groter aantal klanten gebruikt zal worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.17.1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 3.17.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een deelnemer in een samenwerkingsverband voor het uitvoeren
      van een opschalingsproject dat door middel van de opschaling van één of meer supportprogramma’s gericht is op een
      effectieve en efficiënte ondersteuning van de oprichting of groei van startups en scale-ups.

      2 Een opschalingsproject bestaat uit het opschalen van één of meer supportprogramma’s via het verzorgen
      van communicatie, coördinatie, kennisdeling, procesmanagement, advisering inzake de opschaling en overige
      projectactiviteiten die bijdragen aan het doel van het opschalingsproject.

      3 Een samenwerkingsverband bevat ten minste twee deelnemers, bestaande uit één of meer:

      a. natuurlijke personen, ondernemers, onderzoeksorganisaties, onderwijsinstellingen, stichtingen, verenigingen of
      andere organisaties die, ten behoeve van de subsidiabele activiteiten, bedoeld in het tweede lid, geen onderneming
      in stand houden, die actief is in:

      1°. de sector visserij en aquacultuur;

      2°. de primaire productie van landbouwproducten; of

      3°. de sector verwerking en afzet van landbouwproducten in de gevallen, bedoeld in artikel 1, eerste lid, onder c,
      van de algemene de-minimisverordening; of

      b. onderzoeksorganisaties die een innovatiecluster:

      1°. beheren; en

      2°. exploiteren ten behoeve van de subsidiabele activiteiten, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.17.2
  - number: 3.17.3
    text: |-
      1 De subsidie voor de uitvoering van een opschalingsproject bedraagt 50% van de subsidiabele kosten.

      2 De subsidie bedraagt:

      a. minder dan € 125.000 per subsidieaanvrager;

      b. ten hoogste € 500.000 per opschalingsproject.

      3 Het totale bedrag aan de-minimissteun bedraagt per subsidieontvanger als bedoeld in
      [artikel 3.17.2, derde lid, onderdeel a][ref1], maximaal het bedrag, bedoeld in artikel 3, tweede lid, van de
      algemene de-minimisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.17.3
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.17.2
        hoofdstuk: '3'
  - number: 3.17.3a
    text: |-
      1 Voor zover de subsidie wordt verstrekt aan een subsidieaanvrager als bedoeld in
      [artikel 3.17.2, derde lid, onderdeel b][ref1], komen uitsluitend voor subsidie in aanmerking de kosten, bedoeld in
      artikel 27, achtste lid, van de algemene groepsvrijstellingsverordening die direct met de activiteiten, bedoeld in
      artikel 3.17.2, tweede lid, verband houden.

      2 In afwijking van het eerste lid komen niet voor subsidie in aanmerking de kosten voor het beheer van de
      faciliteiten van het innovatiecluster, bedoeld in artikel 27, achtste lid, onderdeel c, van de algemene
      groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.17.3a
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.17.2
        hoofdstuk: '3'
  - number: 3.17.4
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.17.4
  - number: 3.17.5
    text: |-
      1 Met de uitvoering van de op grond van deze titel gesubsidieerde opschalingsprojecten wordt gestart binnen twee
      maanden na de subsidieverlening.

      2 De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.17.5
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.17.6
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. na toepassing van [artikel 3.17.7, eerste lid, onderdelen a, b en c, en tweede lid][ref1], minder dan 6 punten
      per criterium, zijn toegekend;

      b. de te verlenen subsidie minder dan € 25.000 per subsidieaanvrager zou bedragen;

      c. de aanvraag, voor zover deze aanvraag is ingediend door een subsidieaanvrager als bedoeld in
      [artikel 3.17.2, derde lid, onderdeel a][ref2], activiteiten bevat die direct verband houden met:

      1°. de omvang van de uitvoer naar andere lidstaten van de Europese Unie of derde landen;

      2°. het oprichten en exploiteren van een distributienet ten behoeve van de uitvoer; of

      3° andere lopende uitgaven direct verband houdend met activiteiten op het gebied van uitvoer.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.7
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.17.6
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.17.7
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 3.17.2
        hoofdstuk: '3'
  - number: 3.17.7
    text: |-
      1 De minister kent aan een opschalingsproject een hoger aantal punten toe naarmate:

      a. het opschalingsproject meer bijdraagt aan de verwezenlijking van de doelstelling van de subsidie, bedoeld in
      [artikel 3.17.2, eerste lid][ref1];

      b. de kwaliteit van het projectplan beter is, blijkend uit de uitwerking van aanpak en methodiek, de omgang met
      risico’s, de uitvoerbaarheid, de mate waarin de beschikbare middelen efficiënt worden ingezet en de mate waarin de
      opschaling van een supportprogramma na afronding van het opschalingsproject naar verwachting in stand gehouden of
      uitgebreid wordt met behulp van private vervolgfinanciering;

      c. het samenwerkingsverband dat het project uitvoert meer geschikt is om een opschalingsproject uit te voeren,
      blijkend uit:

      1°. de mate waarin de daarvoor benodigde competenties daarvoor aanwezig zijn in het samenwerkingsverband;

      2°. de intrinsieke motivatie die de deelnemers aan het samenwerkingsverband hebben voor het project;

      3°. de mate waarin er extern draagvlak bestaat voor het desbetreffende opschalingsproject;

      4°. de mate waarin de deelnemers aan het samenwerkingsverband succesvolle ervaring hebben met de uitvoering van
      supportprogramma’s; en

      5°. de kwaliteit van de projectorganisatie binnen het samenwerkingsverband.

      2 De minister kent per onderdeel van het eerste lid ten minste één en ten hoogste tien punten toe.

      3 Voor de rangschikking wordt het aantal punten gegeven voor het eerste lid, onderdeel a, vermenigvuldigd met
      4, het eerste lid, onderdeel b, vermenigvuldigd met 3, het eerste lid, onderdeel c, vermenigvuldigd met 3, en
      vervolgens opgeteld.

      4 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.17.7
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.17.2
        hoofdstuk: '3'
  - number: 3.17.8
    text: |-
      1 Er is een Adviescommissie Opschaling supportprogramma’s startups en scale-ups, die tot taak heeft de minister op
      zijn verzoek te adviseren omtrent de rangschikkingscriteria, bedoeld in [artikel 3.17.7][ref1].

      2 De commissie bestaat uit ten minste drie en ten hoogste vijf leden.

      3 De voorzitter en de andere leden van de commissie worden door de minister voor een termijn van ten hoogste drie
      jaar benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.7
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.17.8
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.17.7
        hoofdstuk: '3'
  - number: 3.17.8a
    text: |-
      1 Indien op grond van deze titel subsidie wordt verstrekt aan een beheerder van een innovatiecluster als bedoeld in
      [artikel 3.17.2, derde lid, onderdeel b][ref1], draagt deze subsidieontvanger er zorg voor dat:

      a. de toegang tot de panden, faciliteiten en activiteiten van het innovatiecluster openstaat voor meerdere
      gebruikers en dat deze op transparante en niet-discriminerende basis verleend wordt; en

      b. de vergoedingen die voor het gebruik van de faciliteiten van het innovatiecluster en voor deelname aan de
      activiteiten van het cluster worden berekend, overeenstemmen met de marktprijs of de kosten ervan weerspiegelen.

      2 In afwijking van het eerste lid, aanhef en onderdeel a, kunnen ondernemingen die ten minste 10 procent van
      de investeringskosten van het innovatiecluster hebben gefinancierd preferente toegang krijgen op gunstigere
      voorwaarden, indien deze toegang evenredig is aan de bijdrage van de onderneming in de investeringskosten en deze
      gunstigere voorwaarden publiek beschikbaar worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.17.8a
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.17.2
        hoofdstuk: '3'
  - number: 3.17.9
    text: |-
      1 Een aanvraag voor subsidie bevat ten minste:

      a. gegevens over de aanvrager, waaronder het post- en bezoekadres, het rekeningnummer en, voor zover van
      toepassing, het nummer waarmee de onderneming is geregistreerd bij de Kamer van Koophandel;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. kerngegevens over het opschalingsproject, die bestaan uit een samenvatting van het projectvoorstel en, voor
      zover van toepassing, een lijst met deelnemers van het samenwerkingsverband dat het opschalingsproject zal
      uitvoeren;

      d. voor zover de subsidiabele activiteiten, bedoeld in [artikel 3.17.2, tweede lid][ref1], worden uitgevoerd door
      een subsidieaanvrager als bedoeld in artikel 3.17.2, derde lid, onderdeel a, een verklaring de-minimissteun van
      deze subsidieaanvrager;

      e. voor zover de subsidiabele activiteiten, bedoeld in [artikel 3.17.2, tweede lid][ref2], worden uitgevoerd door
      een subsidieaanvrager als bedoeld in artikel 3.17.2, derde lid, onderdeel b, een beschrijving van de activiteiten,
      bedoeld in artikel 3.17.2, tweede lid, die deze subsidieaanvrager via het beheer en de exploitatie van een
      innovatiecluster uit zal voeren en de partijen die onderdeel uitmaken van het innovatiecluster.

      2 De aanvraag gaat vergezeld van:

      a. een projectplan dat in ieder geval de volgende onderdelen bevat:

      1°. een omschrijving van de doelstelling van het project, een omschrijving van de werkzaamheden, inclusief een
      beschrijving van de positieve gevolgen van de eerdere toepassing van het op te schalen supportprogramma op het
      ontstaan van startups of de groei van startups en scale-ups en een onderbouwing van de verwachte positieve gevolgen
      bij opschaling hiervan;

      2°. een begroting waarin de totale kosten van de subsidiabele activiteiten en de omvang van de gevraagde subsidie
      zijn opgenomen, informatie over de wijze waarop de subsidieaanvrager of de deelnemers van het samenwerkingsverband
      hun eigen aandeel in de projectkosten financieren;

      b. een plan voor vervolgfinanciering voor het verder uitbreiden of in stand houden van de opschaling in de periode
      nadat het opschalingsproject is afgerond;

      c. een omschrijving van de samenwerking met lokale partners en documenten met daarin een beknopte omschrijving
      van de kennis, ervaring en capaciteiten van de bij de uitvoering van het opschalingsproject betrokken personen
      en getuigenschriften waaruit het externe draagvlak blijkt, voor zover deze relevant zijn voor de toepassing van
      [artikel 3.17.7, eerste lid, onderdeel c, en tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.2
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.7
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.17.9
