  - number: 3.6.7
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. na toepassing van [artikel 3.6.8, eerste lid, onderdelen a tot en met e, en tweede lid][ref1]:

      1°. aan het criterium, bedoeld in [artikel 3.6.8, eerste lid, onderdeel a][ref2], minder dan 6 punten zijn
      toegekend; of

      2°. aan de criteria, bedoeld in [artikel 3.6.8, eerste lid, onderdelen a tot en met e][ref3], in totaal minder dan
      30 punten zijn toegekend;

      b. de subsidiabele kosten minder dan € 5.000.000 per R&D-mobiliteitsproject bedragen;

      c. de te verlenen subsidie minder dan € 125.000 per subsidieaanvrager in het samenwerkingsverband zou bedragen.


