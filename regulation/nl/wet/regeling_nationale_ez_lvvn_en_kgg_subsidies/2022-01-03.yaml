  - number: 3.27.10
    text: |-
      1 Indien in het Nederlandse belangrijke project activiteiten betreffende onderzoek en ontwikkeling, de
      eerste industriële toepassing van innovatieve producten of diensten of infrastructuurprojectactiviteiten
      in de sectoren milieu, energie of digitalisering door een onderneming als bedoeld in
      [artikel 3.27.2, tweede lid, onderdeel a][ref1], worden verricht, worden deze projectactiviteiten door deze
      onderneming overeenkomstig de in het Europese goedkeuringsbesluit opgenomen verplichtingen uitgevoerd.

      2 Indien in het Nederlandse belangrijke project activiteiten betreffende proces- en organisatie-innovatie door
      een grote onderneming als bedoeld in [artikel 3.27.2, tweede lid, onderdeel f][ref2], worden verricht, worden deze
      projectactiviteiten door de grote onderneming uitgevoerd in daadwerkelijke samenwerking met middelgrote en kleine
      ondernemingen, die ten minste 30% van de totale subsidiabele kosten dragen.

      3 Indien in het Nederlandse belangrijke project activiteiten betreffende de bouw of het upgraden van
      onderzoeksinfrastructuur door een onderneming als bedoeld in [artikel 3.27.2, tweede lid, onderdeel e][ref3],
      worden verricht:

      a. worden deze projectactiviteiten door deze onderneming in de boekhouding opgenomen als niet-economische
      activiteiten; en

      b. draagt deze onderneming er zorg voor dat:

      1°. de toegang tot deze onderzoeksinfrastructuur openstaat voor meerdere gebruikers en dat deze op transparante en
      niet-discriminerende basis verleend wordt;

      2°. de vergoedingen die voor de exploitatie of het gebruik van de onderzoeksinfrastructuur worden berekend,
      overeenstemmen met de marktprijs.

      4 In afwijking van het derde lid, aanhef en onderdeel b, subonderdeel 1°, kunnen ondernemingen die ten minste
      10 procent van de investeringskosten van de onderzoeksinfrastructuur hebben gefinancierd preferente toegang
      krijgen op gunstigere voorwaarden, indien deze toegang evenredig is aan de bijdrage van de onderneming in de
      investeringskosten en deze gunstigere voorwaarden publiek beschikbaar worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.27.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.27.2
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.27.2
