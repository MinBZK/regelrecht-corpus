  - number: 4.2.112
    text: |-
      In deze paragraaf wordt verstaan onder Topsector Energiestudie Industrie: binnen de in [bijlage 4.2.16][ref1]
      (Programmalijnen Topsector Energiestudies Industrie) opgenomen programmalijnen passende:

      a. haalbaarheidsstudie;

      b. milieustudie, waaronder een procesefficiëntiestudie; of

      c. vergelijkbare studie die geen haalbaarheidsstudie of milieustudie is.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.112
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 4.2.113
    text: |-
      De minister verstrekt op aanvraag een subsidie voor een Topsector Energiestudie Industrie aan:

      a. een onderneming die zelfstandig een Topsector Energiestudie Industrie zal uitvoeren;

      b. een deelnemer in een samenwerkingsverband dat ten minste één onderneming bevat.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.113
  - number: 4.2.114
    text: |-
      1 De subsidie bedraagt voor een Topsector Energiestudie Industrie 50% van de subsidiabele kosten.

      2 Het in het eerste lid genoemde percentage wordt met 20 procentpunten verhoogd, indien de aanvrager een kleine
      onderneming is en de subsidiabele kosten worden gemaakt en betaald door de kleine onderneming.

      3 Het in het eerste lid genoemde percentage wordt met 10 procentpunten verhoogd, indien de aanvrager een
      middelgrote onderneming is en de subsidiabele kosten worden gemaakt en betaald door de middelgrote onderneming.

      4 De subsidie bedraagt maximaal € 500.000 per milieustudie of haalbaarheidsstudie.

      5 In afwijking van het vierde lid, bedraagt de subsidie maximaal € 2.000.000 per haalbaarheidsstudie binnen de
      programmalijn CCUS, bedoeld in [bijlage 4.2.16][ref1].

      6 Het totale bedrag aan de-minimissteun bedraagt bij een vergelijkbare studie voor een onderneming die deze studie
      zelfstandig uitvoert of per deelnemer in een samenwerkingsverband maximaal het bedrag, bedoeld in artikel 3, tweede
      lid, van de algemene de-minimisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.114
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 4.2.114a
    text: |-
      1 In geval van een haalbaarheidsstudie komen de kosten als bedoeld in artikel 25, vierde lid, van de algemene
      groepsvrijstellingsverordening voor subsidie in aanmerking.

      2 In geval van een milieustudie, niet zijnde een procesefficiëntiestudie, komen de kosten als bedoeld in artikel
      49, tweede lid, van de algemene groepsvrijstellingsverordening voor subsidie in aanmerking.

      3 In geval van een procesefficiëntiestudie komen de kosten als bedoeld in artikel 49, tweede lid, van de algemene
      groepsvrijstellingsverordening voor subsidie in aanmerking, voor zover het gaat om aan derden verschuldigde kosten.

      4 In geval van een vergelijkbare studie komen de kosten van de studie in aanmerking voor subsidie.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.114a
