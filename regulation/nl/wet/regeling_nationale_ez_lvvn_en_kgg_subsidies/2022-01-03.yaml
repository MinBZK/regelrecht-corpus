  - number: 3.10.12
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 3.10.2, eerste en tweede lid][ref1], bevat ten minste de
      gegevens, bedoeld in artikel 6, tweede lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie als bedoeld in
      [artikel 3.10.2, eerste en tweede lid][ref2], ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het nummer waarmee de onderneming is
      geregistreerd bij de Kamer van Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. een fondsplan, inclusief de start- en einddatum en de omvang van de gevraagde subsidie;

      d. een financieel plan, waaronder de investeringsbegroting en een begroting van de beheerskosten;

      e. bewijsstukken, waaruit blijkt dat de aanvrager financiële toezeggingen heeft verkregen ter hoogte van minimaal
      vijftig procent van de som van de eigen bijdragen en de beheerskosten; en

      f. de juridische documentatie van het startersfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.10.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.10.2
