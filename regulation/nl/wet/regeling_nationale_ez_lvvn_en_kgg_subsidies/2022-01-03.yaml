    text: |-
      1 De subsidie voor activiteiten van een IPC-deelnemer voor de uitvoering van zijn innovatieplan bedraagt 50 procent
      van de subsidiabele kosten van de IPC-deelnemer tot een maximum van € 125.000.

      2 De subsidie voor de activiteiten van een IPC-penvoerder bedraagt € 4.000 per IPC-deelnemer.

      3 De som van subsidies bedraagt voor het gehele IPC-project ten hoogste € 550.000.
