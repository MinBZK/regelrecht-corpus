  - number: 3.10.7
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien:

      a. onvoldoende aannemelijk is dat de financier gedurende de fondsperiode daadwerkelijk beschikt over de middelen
      die de financier aan het investeringsbudget bijdraagt of over de middelen ter dekking van de beheerskosten;

      b. onvoldoende vertrouwen bestaat dat de betrokkenen de capaciteiten hebben voor het verkrijgen van participaties
      en voor het beheer hiervan op een wijze zoals bij participatiefondsen gebruikelijk is;

      c. een fondsplan niet is gebaseerd op de uitgangspunten dat:

      1°. een financier participaties verkrijgt gedurende een investeringsperiode van ten hoogste zes jaar, en deze
      uiterlijk zes jaar na afloop van de investeringsperiode vervreemdt;

      2°. de totale verkrijgingprijs van de participaties die gedurende de fondsperiode in één technostartersvennootschap
      wordt geïnvesteerd, ten minste € 100.000 en ten hoogste € 3.500.000 bedraagt;

      3°. de gemiddelde totale verkrijgingprijs van de participaties die een financier gedurende de investeringsperiode
      per technostartersvennootschap investeert, over alle technostartersvennootschappen genomen ten hoogste € 2.000.000
      bedraagt;

      4°. de middelen die door een financier over een periode van twaalf maanden aan een technostartersvennootschap
      worden verstrekt ten hoogste € 2.000.000 bedragen;

      5°. de beheerskosten jaarlijks ten hoogste 5 procent bedragen van het investeringsbudget;

      6°. de fondsbeheerder voor zijn werkzaamheden een beloning verkrijgt die afhankelijk is van zijn individuele
      prestatie;

      7°. de relatieve omvang van achtergestelde vorderingen zodanig wordt beperkt dat aan het einde van de fondsperiode
      ten hoogste 50 procent van het totaal van de verkrijgingsprijzen van alle participaties betrekking heeft op
      achtergestelde vorderingen;

      8°. voor achtergestelde vorderingen een rente wordt bedongen die ten minste gelijk is aan de referentierente;

      9°. de participaties verkregen worden in technostartersvennootschappen waarvan de rentabiliteits- en
      continuïteitsperspectieven ten minste redelijk zijn;

      10°. bij de beslissing van de financier inzake de verkrijging van een participatie rekening wordt gehouden met het
      ondernemingsplan van de desbetreffende technostartersvennootschap;

      11°. de participaties verkregen worden in technostartersvennootschappen waaraan niet eerder door een
      participatiemaatschappij risicokapitaal is verstrekt, behoudens indien:

        - deze participatiemaatschappij een financier is en voor zover het totaal aan verkrijgingsprijzen van de
      participaties die alle financiers gezamenlijk in de technostartersvennootschap investeren, niet boven € 3.500.000
      uitkomt;
        - deze participatiemaatschappij naar het oordeel van de Minister niet in staat is nieuwe participaties
      in de technostartersvennootschap te verkrijgen, voor zover als gevolg van de nieuwe participatie door het
      startersfonds het totaal aan risicokapitaal dat verstrekt is aan de technostartersvennootschap door alle
      participatiemaatschappijen en de financier gezamenlijk, niet boven € 3.500.000 uitkomt, of
        - deze participatiemaatschappij een informal investor is;

      12°. de financier uitsluitend vervolginvesteringen doet in een technostarter, indien voldaan is aan de voorwaarden
      van artikel 21, zesde lid, van de algemene groepsvrijstellingsverordening en, ingeval de desbetreffende
      technostarter ten tijde van de vervolginvestering zeven jaar of langer na de eerste commerciële verkoop actief is
      op een producten- of dienstenmarkt, de financier tevens het minimale particuliere deelnemingspercentage, opgenomen
      in artikel 21, tiende lid, van de algemene groepsvrijstellingsverordening, bereikt, overeenkomstig artikel 21,
      tiende en elfde lid, van de algemene groepsvrijstellingsverordening;

      d. het fondsplan onvoldoende is onderbouwd;

      e. onvoldoende vertrouwen bestaat dat het fondsplan naar behoren wordt uitgevoerd;

      f. de belangen van de Staat kunnen worden geschaad.

      2 [Artikel 23, onderdeel b, van het besluit][ref1] is niet van toepassing.

      3 Indien een starterfonds een aanvraag die betrekking heeft op het uitvoeren van een fondsplan voor eHealth
      technostarters, onder zowel een generieke openstelling voor fondsplannen voor technostarters als onder een
      gelijktijdige specifieke openstelling voor fondsplannen voor eHealth technostarters heeft ingediend, en dit
      fondsplan op basis van de rangschikking en hoogte van het subsidieplafond bij beide openstellingen in aanmerking
      komt voor subsidiëring, beslist de minister afwijzend op de aanvraag onder de generieke openstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.10.7
    references:
