  - number: 3.13.1
    text: |-
      1 In deze titel wordt verstaan onder:

      fundingkosten: kosten die de bank maakt om geld aan te trekken op de kapitaalmarkt;

      lening: 'een al dan niet achtergestelde lening van geld door een financier aan een ondernemer, welke lening:'

      a. al dan niet door enige vorm van zekerheid is gedekt,

      b. niet converteerbaar is en

      c. is afgesloten met de afspraak dat de rente vast is, of een gedeelte van de rente vast is en een gedeelte van
      de rente flexibel is en gekoppeld is aan Euribor, met het oog op de financiering door deze onderneming van eigen
      activiteiten;

      liquiditeitsopslag: door een financier aan een ondernemer in rekening gebracht percentage van de lening, waarvan
      de hoogte gelijk is voor alle door de desbetreffende financier op dezelfde dag afgesloten of af te sluiten leningen
      met dezelfde looptijd. Indien een dergelijk percentage niet beschikbaar is, zal in overleg met de financier een
      ander redelijk, transparant en verifieerbaar percentage worden vastgesteld.

      2 Voor de toepassing van deze titel wordt als financier aangewezen een bank.

      3 Voor de toepassing van [artikel 3.13.2, tweede lid][ref1], wordt als financier aangewezen een kredietinstelling
      in de zin van de [Wet financiële markten BES][ref2] die op grond van die wet bevoegd is in Bonaire, Sint Eustatius
      of Saba het bedrijf van kredietinstelling uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.13.2
      [ref2]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.13.1
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.13.2
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0030883
  - number: 3.13.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie in de vorm van een garantstelling aan een financier voor de
      terugbetaling van een lening die de financier op grond van een overeenkomst aan een ondernemer heeft verstrekt voor
      de duur van de overeenkomst met een maximum van acht jaar.

      2 De minister kan ook subsidie in de vorm van een garantstelling verstrekken aan een financier voor de
      terugbetaling van een lening die de financier op grond van een overeenkomst aan een ondernemer die gevestigd is in
      het openbaar lichaam Bonaire, Sint Eustatius of Saba heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.13.2
  - number: 3.13.3
    text: |-
      1 De financier verstrekt geen lening aan een ondernemer wiens activiteiten in overwegende mate betrekking hebben
      op:

      a. landbouw, visserij en aquacultuur, met uitzondering van toelevering en dienstverlening;

      b. onroerend goed voor zover de activiteiten gericht zijn op het behalen van resultaten door waardestijging van
      onroerend goed zonder dat er sprake is van significante waardetoevoeging door eigen productieve activiteiten;

      c. de financiële sector voor zover de ondernemer het bank-, verzekerings- of beleggingsbedrijf uitoefent, of een
      participatiemaatschappij heeft;

      d. de gezondheidszorg, voor zover de onderneming een aanbieder is als bedoeld in
      [artikel 1, onderdeel c, van de Wet marktordening gezondheidszorg][ref1].

      2 De financier verstrekt geen lening aan een instelling als bedoeld in [artikel 70 van de Woningwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.13.3
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '70'
  - number: 3.13.4
    text: |-
      1 Er wordt garant gestaan voor 50 procent van het nog niet afgeloste deel van de lening.

      2 Indien de financier bij het verkrijgen van een lening een gedeelte daarvan niet onder de garantstelling van de
      Staat brengt, zijn de bepalingen van deze titel slechts van toepassing op het gedeelte van de verkregen lening dat
      onder de garantstelling is gebracht.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.13.4
  - number: 3.13.5
    text: |-
      1 De garantstelling heeft uitsluitend betrekking op een lening waarbij de aan de ondernemer verstrekte lening niet
      minder bedraagt dan € 1.500.000.

      2 De garantstelling heeft uitsluitend betrekking op een lening waarbij de aan de ondernemer of, indien de
      ondernemer deel uitmaakt van een groep, aan de groep verstrekte lening tezamen met

      a. het nog niet afgeloste deel van een of meer leningen of

      b. een of meer bankgarantiefaciliteiten als bedoeld in [artikel 3.14.2][ref1]

      die door een financier met toepassing van dit hoofdstuk aan de ondernemer onderscheidenlijk de groep is of zijn
      verstrekt of gelijktijdig wordt of worden verstrekt niet meer bedraagt dan € 150.000.000.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.14.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.13.5
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.14.2
        hoofdstuk: '3'
  - number: 3.13.6
    text: |-
      1 Er is een Adviescommissie Kredietcommissie die tot taak heeft de minister op zijn verzoek te adviseren
      omtrent de afwijzingsgronden voor aanvragen om het sluiten van een garantstellingsovereenkomst, bedoeld in de
      [artikelen 22][ref1] en [24 van het besluit][ref2].

      2 De commissie heeft tevens tot taak de minister op zijn verzoek te adviseren omtrent de afwijzingsgronden voor
      aanvragen om garantstelling, bedoeld in [artikel 3.13.9][ref3].

      3 De commissie bestaat uit ten minste drie en ten hoogste vier leden.

      4 De voorzitter en de andere leden van de commissie worden benoemd voor een termijn van ten hoogste drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.13.9
