  - number: 3.2.15
    text: |-
      1 Een aanvraag voor PPS-projecttoeslag als bedoeld in [artikel 3.2.9][ref1] bevat ten minste de gegevens, bedoeld
      in artikel 6, tweede lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor PPS-projecttoeslag als bedoeld in [artikel 3.2.9][ref2] ten
      minste:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het nummer waarmee de onderneming is
      geregistreerd bij de Kamer van Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. gegevens over de grondslag, waaronder de topsector of topsectoren waarop de aanvraag ziet, en de omvang van de
      private bijdrage en inzet in natura voor het samenwerkingsproject;

      d. de periode waarover PPS-projecttoeslag wordt aangevraagd, de hoeveelheid PPS-projecttoeslag die wordt
      aangevraagd, alsmede de projectgegevens, waaronder een korte aanduiding van de activiteit waarvoor de PPS-
      projecttoeslag wordt aangevraagd, de start- en einddatum en de totale kosten van het samenwerkingsproject;

      e. een overzicht van de subsidiabele kosten per deelnemer van het samenwerkingsverband dat het project uitvoert
      waarvoor de PPS-projecttoeslag wordt aangevraagd, waarbij wordt aangegeven of de betreffende kosten betrekking
      hebben op fundamenteel onderscheidenlijk industrieel onderzoek of experimentele ontwikkeling;

      f. een afschrift van de door alle partijen ondertekende samenwerkingsovereenkomst waaruit het bestaan blijkt van
      het samenwerkingsproject waarvoor projecttoeslag wordt aangevraagd, alsmede van de verschuldigdheid en omvang van
      private bijdragen en inzet in natura, daaraan;

      g. een projectplan;

      h. ingeval van een aanvraag van een penvoerder als bedoeld in [artikel 3.2.9, tweede lid][ref3]: een verklaring,
      afgegeven door het TKI dat actief is op het terrein of de terreinen waarop het betreffende samenwerkingsproject
      betrekking heeft, waaruit blijkt dat het samenwerkingsproject bijdraagt aan het TKI-programma.

      3 Voor de toepassing van het tweede lid, onderdeel h, geldt dat indien er meerdere TKI’s actief zijn op het terrein
      of de terreinen waarop het betreffende samenwerkingsproject betrekking heeft, de aanvraag de verklaring, bedoeld in
      het hier genoemde onderdeel h, van elk van deze TKI’s bevat.

      4 De aanvraag voor de vaststelling van PPS-projecttoeslag bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de aanvrager en het door de minister verstrekte
      referentienummer;

      b. gegevens over:

      1°. de totale subsidiabele kosten die met de uitvoering van het betreffende samenwerkingsproject gemoeid zijn, per
      deelnemer in het samenwerkingsverband dat dit project uitvoert;

      2°. de omvang per deelnemer van de PPS-projecttoeslag die voor vaststelling in aanmerking komt.

      5 De subsidiabele kosten, bedoeld in het tweede lid, onderdeel e, en in het vierde lid, onderdeel b, onder 1°, zijn
      kosten als bedoeld in artikel 25, derde lid, van de algemene groepsvrijstellingsverordening.

      6 Indien de op of na 1 februari 2017 aan een TKI verleende PPS-projecttoeslag of de vóór 1 februari 2017 verleende
      TKI-projecttoeslag € 125.000 of meer bedraagt, kan de aanvraag tot vaststelling van deze PPS-projecttoeslag
      onderscheidenlijk TKI-projecttoeslag, in afwijking van [artikel 50, tweede lid, onderdeel c, van het besluit][ref4],
      vergezeld gaan van een rapport van feitelijke bevindingen als bedoeld in artikel 50, zesde lid, van het besluit,
      dat met inachtneming van de voorschriften, gesteld in [bijlage 3.2.1][ref5], is opgesteld.


