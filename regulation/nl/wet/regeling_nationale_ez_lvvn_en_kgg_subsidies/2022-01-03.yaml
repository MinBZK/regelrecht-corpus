  - number: 3.7.12
    text: |-
      Deze titel vervalt met ingang van 1 januari 2026, met dien verstande dat deze van toepassing blijft op subsidies
      die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.7.12
  - number: 3.8.1
    text: |-
      In deze titel wordt verstaan onder:

        - *AI-innovatieproject:* Artificial Intelligence (AI) innovatieproject dat wordt uitgevoerd door een EUREKA-
      innovatiesamenwerkingsverband en is voorzien van een EUREKA-label;
        - *EUREKA-innovatiesamenwerkingsverband:* samenwerkingsverband waarbij ten minste één van de partijen een in
      Nederland gevestigde ondernemer is en ten minste één van de partijen een ondernemer of onderzoeksorganisatie is die
      is gevestigd in een land dat deelneemt aan het EUREKA-netwerk;
        - *EUREKA-netwerkproject:* innovatieproject dat wordt uitgevoerd door een EUREKA-innovatiesamenwerkingsverband en
      is voorzien van een EUREKA-label;
        - *Global Stars-innovatieproject:* innovatieproject dat wordt uitgevoerd door een internationaal
      innovatiesamenwerkingsverband en dat voorzien is van een EUREKA-label;
        - *internationaal innovatiesamenwerkingsverband:* samenwerkingsverband waarbij ten minste één van de partijen een
      in Nederland gevestigde ondernemer is en ten minste één van de partijen een ondernemer of onderzoeksorganisatie is
      die is gevestigd in een land dat niet deelneemt aan het EUREKA-netwerk;
        - *ITEA4-innovatieproject:* innovatieproject dat wordt uitgevoerd door een EUREKA-innovatiesamenwerkingsverband en
      is voorzien van een label van het EUREKA cluster ITEA4;
        - *waterstof-innovatieproject:* innovatieproject dat zich richt op de infrastructuur voor het transport van
      waterstof dat wordt uitgevoerd door een EUREKA-innovatiesamenwerkingsverband en is voorzien van een EUREKA-label;
        - *XECS-innovatieproject:* innovatieproject dat wordt uitgevoerd door een EUREKA-innovatiesamenwerkingsverband en
      is voorzien van een label van het EUREKA cluster XECS.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.8.1
  - number: 3.8.2
    text: |-
      De minister verstrekt op aanvraag subsidie aan een deelnemer:

      a. in een EUREKA-innovatiesamenwerkingsverband voor het uitvoeren van een XECS-innovatieproject, een EUREKA-
      netwerkproject, een ITEA4-innovatieproject, AI-innovatieproject of een waterstof-innovatieproject; of

      b. in een internationaal innovatiesamenwerkingsverband voor het uitvoeren van een Global Stars-innovatieproject.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.8.2
  - number: 3.8.3
    text: De penvoerder is een ondernemer.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.8.3
  - number: 3.8.4
    text: |-
      1 De subsidie bedraagt:

      a. 50 procent van de subsidiabele kosten van een innovatieproject voor zover deze betrekking hebben op industrieel
      onderzoek;

      b. 35 procent van de subsidiabele kosten van een innovatieproject voor zover deze betrekking hebben op industrieel
      onderzoek en worden gemaakt door een ondernemer;

      c. 25 procent van de subsidiabele kosten van een innovatieproject voor zover deze betrekking hebben op
      experimentele ontwikkeling.

      2 De percentages, genoemd in het eerste lid, onder b en c, worden verhoogd met 10 procentpunten indien subsidie
      wordt verstrekt aan een MKB-ondernemer.

      3 Indien het totale subsidiebedrag voor de deelnemers van een EUREKA-innovatiesamenwerkingsverband voor het
      uitvoeren van een EUREKA-netwerkproject meer bedraagt dan € 750.000, wordt het meerdere naar rato in mindering
      gebracht op de aan de betrokken aanvragers te verstrekken subsidie.

      4 Indien het totale subsidiebedrag voor de deelnemers in een EUREKA-innovatiesamenwerkingsverband voor het
      uitvoeren van een XECS-innovatieproject, een ITEA4-innovatieproject of een AI-innovatieproject, meer bedraagt dan
      € 4.000.000, wordt het meerdere naar rato in mindering gebracht op de aan de betrokken aanvragers te verstrekken
      subsidie.

      5 Indien het totale subsidiebedrag voor de deelnemers van een internationaal innovatiesamenwerkingsverband voor
      het uitvoeren van een Global Stars-innovatieproject meer bedraagt dan € 350.000, wordt het meerdere naar rato in
      mindering gebracht op de aan de betrokken aanvragers te verstrekken subsidie.

      6 Indien het totale subsidiebedrag voor de deelnemers van een internationaal innovatiesamenwerkingsverband voor het
      uitvoeren van een waterstof-innovatieproject meer bedraagt dan € 500.000, wordt het meerdere naar rato in mindering
      gebracht op de aan de betrokken aanvragers te verstrekken subsidie.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.8.4
  - number: 3.8.4a
    text: |-
      Voor subsidie komen uitsluitend de kosten in aanmerking, bedoeld in artikel 25, derde lid, van de algemene
      groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.8.4a
  - number: 3.8.5
    text: |-
      Geen subsidie wordt verstrekt indien de aanvrager vóór indiening van de aanvraag om subsidie, bedoeld in
      [artikel 3.8.2][ref1], reeds gestart is met zijn deel van het XECS-innovatieproject, het EUREKA-netwerkproject, het
      Global Stars-innovatieproject, het ITEA4-innovatieproject, AI-innovatieproject of een waterstof-innovatieproject.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.8.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.8.5
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.8.2
        hoofdstuk: '3'
  - number: 3.8.6
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.8.6
  - number: 3.8.7
    text: |-
      1 Er is een Adviescommissie Internationaal Innoveren die tot taak heeft de minister op zijn
      verzoek te adviseren omtrent de afwijzingsgronden, bedoeld in de [artikelen 22][ref1] en
      [23, onderdelen d tot en met g, van het besluit][ref2] en in [artikel 3.8.9][ref3] en de rangschikkingscriteria,
      bedoeld in [artikel 3.8.10][ref4].

      2 De commissie bestaat uit ten minste drie en ten hoogste vijftien leden.

      3 De voorzitter en de andere leden worden benoemd voor een termijn van ten hoogste vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.8.9
      [ref4]: https://wetten.overheid.nl/BWBR0035474#Artikel3.8.10
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.8.7
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0035474
        artikel: 3.8.9
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0035474
        artikel: 3.8.10
        hoofdstuk: '3'
  - number: 3.8.8
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1] is drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.8.8
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.8.9
    text: |-
      De minister beslist afwijzend op een aanvraag:

      a. indien van het innovatieproject onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten zijn;

      b. afkomstig van een overheid of overheidsinstelling, tenzij het een onderzoeksorganisatie betreft;

      c. indien, in het geval van een Global Stars-innovatieproject, aannemelijk is dat het Global Stars-innovatieproject
      geen doorgang kan vinden om redenen die samenhangen met andere omstandigheden in de andere deelnemende landen van
      het Global Stars-innovatieproject of met financiële of technische problemen van een van de deelnemende partijen in
      een ander deelnemend land;

      d. indien, in het geval van een waterstof-innovatieproject, aannemelijk is dat het waterstof-innovatieproject geen
      doorgang kan vinden om redenen die samenhangen met andere omstandigheden in de andere deelnemende landen van het
      waterstof-innovatieproject of met financiële of technische problemen van een van de deelnemende partijen in een
      ander deelnemend land.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.8.9
  - number: 3.8.10
    text: |-
      1 De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate:

      a. een innovatieproject meer bijdraagt aan technologische vernieuwing of wezenlijk nieuwe toepassingen van een
      bestaande technologie;

      b. de bijdrage aan de doelmatigheid en doeltreffendheid van een innovatieproject, de nieuwheid van een
      samenwerkingsverband en de betrokkenheid van onderzoeksorganisaties groter zijn;

      c. de projectresultaten meer economische waarde creëren voor Nederland;

      d. meer wordt aangesloten bij de doelstellingen van de deelnemende ondernemingen en de toepassingsmogelijkheden van
      de projectresultaten uitgebreider zijn.

      2 Voor de rangschikking wegen de in het eerste lid vermelde criteria even zwaar.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.8.10
  - number: 3.8.11
    text: |-
      Voor EUREKA-netwerkprojecten brengen de subsidieontvangers, in afwijking van [artikel 39 van het besluit][ref1]
      gezamenlijk steeds na afloop van een periode van zes maanden aan de minister schriftelijk verslag uit omtrent de
      uitvoering van EUREKA-netwerkprojecten met inbegrip van een vergelijking van die uitvoering met het projectplan en
      de bij de beschikking tot subsidieverlening vermelde raming van de subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel39
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.8.11
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '39'
  - number: 3.8.12
    text: |-
      1 De subsidieontvanger verleent medewerking aan een evaluatieonderzoek van de effecten van het door hem uitgevoerde
      innovatieproject, voor zover deze medewerking redelijkerwijs van hem kan worden verlangd.

      2 De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de dag waarop subsidie wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.8.12
  - number: 3.8.13
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 3.8.2][ref1] bevat ten minste de gegevens, bedoeld in artikel
      6, tweede lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie als bedoeld in [artikel 3.8.2][ref2] ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het nummer waarmee de onderneming is
      geregistreerd bij de Kamer van Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. de gegevens over het plan, waaronder de activiteit waarvoor subsidie wordt aangevraagd, de start- en einddatum,
      de totale kosten en de omvang van de gevraagde subsidie.

      3 De aanvraag voor de vaststelling van een subsidie als bedoeld in [artikel 3.7.2][ref3] bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de aanvrager en het door de minister verstrekte
      referentienummer;

      b. de omvang van de vast te stellen subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.8.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.8.2
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.7.2
