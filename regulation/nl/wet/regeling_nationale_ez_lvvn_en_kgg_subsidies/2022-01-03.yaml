  - number: 4.2.117
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. de kwaliteit van het project onvoldoende is, blijkend uit de uitwerking van aanpak en methodiek, de omgang met
      de risico’s, de uitvoerbaarheid, de deelnemende partijen of de mate waarin de beschikbare middelen effectief en
      efficiënt worden ingezet;

      b. het project onvoldoende aandacht besteedt aan het creëren van flexibiliteit in het energiesysteem, aan een of
      meer mogelijke verdienmodellen, en aan de niet-technologische factoren die een rol kunnen spelen bij de toepassing
      van innovaties in de markt en de wijze waarop daarmee wordt omgegaan;

      c. in onvoldoende mate is voorzien in een kwalitatief goede kennisverspreiding;

      d. in geval van een samenwerkingsverband, de samenwerking onvoldoende evenwichtig is, blijkend uit:

      1°. de verdeling van de kosten tussen de deelnemers, of

      2°. de verhouding tussen private en publieke financiering van het project;

      e. het projectplan niet in voldoende mate de vervolgstappen beschrijft die na afloop van het project bij een
      positief resultaat gezet zullen gaan worden om tot uitvoering en implementatie van hetgeen onderzocht is te komen;

      f. de aanvraag betrekking heeft op een vergelijkbare studie en deze is gedaan door een onderneming die deze studie
      zelfstandig uitvoert of één of meerdere deelnemers in een samenwerkingsverband die een onderneming in stand houdt
      dan wel houden, die actief is respectievelijk zijn in:

      1°. de sector visserij en aquacultuur;

      2°. de primaire productie van landbouwproducten; of

      3°. de sector verwerking en afzet van landbouwproducten in de gevallen, bedoeld in artikel 1, eerste lid, onder c,
      van de algemene de-minimisverordening;

      g. de aanvraag betrekking heeft op een vergelijkbare studie en deze ziet op activiteiten die direct verband houden
      met:

      1°. de omvang van de uitvoer naar andere lidstaten van de Europese Unie of derde landen;

      2°. het oprichten en exploiteren van een distributienet ten behoeve van de uitvoer; of

      3°. andere lopende uitgaven direct verband houdend met activiteiten op het gebied van uitvoer;

      h. de aanvraag betrekking heeft op een procesefficiëntiestudie waarvoor de te verlenen subsidie minder dan € 50.000
      zou bedragen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.117
  - number: 4.2.117a
    text: |-
      1 Onverminderd [artikel 4.2.3, eerste en tweede lid][ref1], bevat een aanvraag om subsidie voor een vergelijkbare
      studie ten minste een verklaring de-minimissteun van een onderneming die deze studie zelfstandig uitvoert of van
      elke deelnemer in het samenwerkingsverband dat een vergelijkbare studie uitvoert.

      2 Tegelijkertijd met de aanvraag tot subsidievaststelling, geeft de subsidieontvanger door middel van een verslag
      tenminste inzicht in:

      a. de vervolgstappen die het samenwerkingsverband gaat zetten na afloop van het project om tot uitvoering en
      implementatie in de markt van wat onderzocht is te komen;

      b. de verwachte CO-reductie die zou ontstaan bij uitvoering en implementatie in de markt van wat onderzocht is.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.3
