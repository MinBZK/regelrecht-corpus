  - number: 2.3.5
    text: |-
      1 De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.

      2 Indien blijkt dat het totale bedrag van de te verlenen subsidies voor projecten als bedoeld
      in [artikel 2.10.2, eerste lid][ref1], lager is dan het daarvoor vastgestelde subsidieplafond,
      wordt het overblijvende bedrag zo nodig aan het subsidieplafond voor projecten als bedoeld in
      [artikel 2.3.2, eerste lid][ref2], toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.10.2
