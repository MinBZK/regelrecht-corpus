  - number: 3.2.1
    text: |-
      In deze titel wordt verstaan onder:

        - *geldmiddelen:* chartaal geld, giraal geld of elektronisch geld;
        - *innovatieactiviteiten:* ondersteunende activiteiten, gericht op het betrekken van MKB-ondernemers bij een
      samenwerkingsproject of het stimuleren van de valorisatie van de kennis op het terrein van het TKI-programma,
      bestaande uit: a. netwerkactiviteiten, bestaande uit voor ieder openstaande masterclasses, workshops, conferenties
      of het delen of uitwisselen van informatie via een website om kennisdeling en het netwerken tussen MKB-ondernemers
      te bevorderen, of b. innovatieadviesdiensten, uitgezonderd opleiding, verstrekt aan een MKB-ondernemer door een
      innovatiemakelaar;
        - *innovatiemakelaar:* een verstrekker van innovatieadviesdiensten;
        - *inzet in natura:* op geld waardeerbare inbreng in een samenwerkingsproject die: a. niet direct of indirect
      afkomstig is van een onderzoeksinstelling of een openbaar lichaam als bedoeld in de definitie van private
      bijdrage, en b. wordt berekend op basis van een voor de deelnemers aan een samenwerkingsproject gebruikelijke en
      controleerbare methode, die gebaseerd is op bedrijfseconomische grondslagen en normen die in het maatschappelijk
      verkeer als aanvaardbaar worden beschouwd en die de deelnemers aan een samenwerkingsproject stelselmatig toepassen;
        - *onderzoeksinstelling:* onderzoeksorganisatie die alle winst opnieuw investeert in fundamenteel onderzoek,
      industrieel onderzoek, experimentele ontwikkeling, in het verspreiden van de resultaten daarvan, of in onderwijs;
        - *private bijdrage:* geldmiddelen die niet direct of indirect afkomstig zijn van: a. een onderzoeksinstelling met
      inbegrip van de Nederlandse organisatie voor wetenschappelijk onderzoek en de Koninklijke Nederlandse Akademie van
      Wetenschappen, b. een openbaar lichaam;
        - *samenwerkingsproject:* project dat: a. in daadwerkelijke samenwerking plaatsvindt; b. door minimaal twee
      deelnemers waaronder een onderzoeksinstelling en een ondernemer wordt uitgevoerd, en c. bestaat uit fundamenteel
      onderzoek, industrieel onderzoek, experimentele ontwikkeling of een combinatie daarvan;
        - *TKI:* Topconsortium voor Kennis en Innovatie, zijnde een rechtspersoon die als zodanig is genoemd in de wet
      houdende vaststelling van de begrotingsstaten van het Ministerie van Economische Zaken van het kalenderjaar waarin
      de aanvraag, bedoeld in [artikel 3.2.2][ref1] of [artikel 3.2.9][ref2], wordt ingediend;
        - *TKI-programma:* op onderzoek en innovatie gericht meerjarig programma, houdende de samenwerkingsprojecten en de
      innovatie-activiteiten van het TKI;
        - *TKI-relevante onderzoeksopdracht:* opdracht van een onderneming: a. die wordt uitgevoerd door een
      onderzoeksinstelling, b. die bestaat uit fundamenteel onderzoek, industrieel onderzoek, experimentele ontwikkeling
      of een combinatie daarvan, en c. die kennis oplevert voor de onderzoeksinstelling die toepasbaar is in binnen het
      TKI-programma mogelijke samenwerkingsprojecten.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.9
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.2.1
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.2.2
        hoofdstuk: '3'
        paragraaf: 3.2.2
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 3.2.9
        hoofdstuk: '3'
        paragraaf: 3.2.3
  - number: 3.2.2
    text: |-
      1 De minister verstrekt op aanvraag PPS-toeslag aan een TKI voor uitvoering van het TKI-programma (PPS-
      programmatoeslag).

      2 De minister geeft een beschikking op een aanvraag voor PPS-programmatoeslag binnen acht weken na de dag van
      ontvangst van de aanvraag.

      3 Indien in de aanvraag mede of uitsluitend private bijdragen als bedoeld in [artikel 3.2.3a eerste lid][ref1]
      als grondslag zijn opgevoerd ter bepaling van de hoogte van de PPS-programmatoeslag, geeft de minister, in
      afwijking van het tweede lid, een beschikking op de aanvraag uiterlijk acht weken na de laatste dag van de
      openstellingsperiode waarin aanvragen voor PPS-programmatoeslag kunnen worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.3a
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.2.3a
        hoofdstuk: '3'
        paragraaf: 3.2.2
  - number: 3.2.3
    text: |-
      1 De hoogte van de PPS-programmatoeslag bedraagt:

      a. 30% van de som van:

      1°. de private bijdragen voor de samenwerkingsprojecten van het TKI-programma, niet zijnde private bijdragen als
      bedoeld in [artikel 3.2.3a][ref1], en

      2°. 80% van de private bijdragen aan TKI-relevante onderzoeksopdrachten, voor zover deze op grond van het derde lid
      in aanmerking worden genomen,

      vermeerderd met

      b. 25% van de private bijdragen, bedoeld in [artikel 3.2.3a][ref2], waarbij de in de onderdelen a en b
      bedoelde private bijdragen in aanmerking worden genomen voor zover die in het kalenderjaar, voorafgaand aan het
      kalenderjaar waarin de aanvraag van de PPS-programmatoeslag is ingediend, blijkens onderbouwing in de aanvraag aan
      onderzoeksinstellingen verschuldigd zijn geworden.

      2 Over de eerste € 20.000 van de som van de private bijdragen van een bepaalde deelnemer aan samenwerkingsprojecten
      van het TKI-programma per jaar bedraagt de hoogte van de PPS-programmatoeslag, in afwijking van het eerste lid,
      40%.

      3 Voor de toepassing van het eerste lid, aanhef en onderdeel a, onder 2°, worden de private bijdragen aan TKI-
      relevante onderzoeksopdrachten in aanmerking genomen tot ten hoogste 40% van de som van:

      a. de private bijdragen, bedoeld in het eerste lid, onderdeel a, onder 1°;

      b. de private bijdragen, bedoeld in het eerste lid, onderdeel a, onder 2°;

      c. de private bijdragen, bedoeld in [artikel 3.2.3a, eerste lid][ref3], die op grond van dat artikel in aanmerking
      worden genomen ter bepaling van de hoogte van de PPS-programmatoeslag;

      d. de private bijdragen, bedoeld in [artikel 3.2.10, eerste lid, onderdeel a][ref4], en

      e. de private bijdragen, bedoeld in [artikel 3.2.10a, eerste lid][ref5], die op grond van dat artikel in aanmerking
      worden genomen ter bepaling van de hoogte van de PPS-projecttoeslag,

      voor zover deze private bijdragen, bedoeld in de onderdelen a tot en met e, in totaal gerealiseerd zijn in het
      kalenderjaar voorafgaand aan het kalenderjaar waarin de aanvraag van de PPS-programmatoeslag is ingediend.

      4 In afwijking van het eerste lid blijven de in het eerste lid, onderdeel a, onder 2°, bedoelde private bijdragen
      buiten beschouwing bij het bepalen van de hoogte van de PPS-programmatoeslag, voor zover de uit een TKI-relevante
      onderzoeksopdracht voortvloeiende kennis van de onderzoeksinstelling slechts ten goede kan of zal komen aan de
      onderneming, de onderzoeksinstelling, of beide partijen bij de TKI-relevante onderzoeksopdracht.

      5 Een TKI bevordert dat kennis die voortvloeit uit TKI-relevante onderzoeksopdrachten waarvoor het op grond
      van het eerste lid, onderdeel b, PPS-programmatoeslag heeft ontvangen, daadwerkelijk wordt toegepast binnen een
      samenwerkingsproject van het TKI-programma.

      6 Voor toepassing van het tweede lid kan de waarde van inzet in natura die in het kalenderjaar, voorafgaand aan het
      kalenderjaar waarin de aanvraag van de PPS-programmatoeslag is ingediend, aan onderzoeksinstellingen verschuldigd
      is geworden, tot ten hoogste € 20.000 als private bijdrage in aanmerking worden genomen, mits de betreffende inzet
      in natura afkomstig is van een onderneming die een vaste inrichting of dochteronderneming in Nederland heeft.

      7 Voor de toepassing van dit artikel worden private bijdragen en inzet in natura aan een fundamenteel of
      industrieel onderzoeks- of experimenteel ontwikkelingsproject dat op het moment van aanvraag al anders dan als
      samenwerkingsproject van een TKI-programma wordt uitgevoerd slechts in aanmerking genomen indien bestaande publieke
      of private bijdragen aan dat project niet bij gelegenheid van opneming in het TKI-programma worden verlaagd.


