    text: |-
      1 Een aanvraag voor subsidie bevat ten minste:

      a. gegevens over de aanvrager, waaronder het post- en bezoekadres, het rekeningnummer en het nummer waarmee de
      subsidieaanvrager is geregistreerd bij de Kamer van Koophandel;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. kerngegevens over het ambachts-ondernemerschapsproject, die bestaan uit een samenvatting van het projectvoorstel
      en, voor zover van toepassing, een lijst met deelnemers van het samenwerkingsverband dat het ambachts-
      ondernemerschapsproject zal uitvoeren;

      d. een verklaring de-minimissteun van de subsidieaanvrager of, indien van toepassing, van de subsidieaanvragers
      in een samenwerkingsverband die het desbetreffende ambachts-ondernemerschapsproject zal respectievelijk zullen
      uitvoeren.

      2 De aanvraag gaat vergezeld van:

      a. een projectplan dat in ieder geval de volgende onderdelen bevat:

      1°. een omschrijving van de doelstelling of doelstellingen, de werkzaamheden en de omvang van het verwachte
      blijvende effect van het ambachts-ondernemerschapsproject, voor zover dit relevant is voor de toepassing van
      [artikel 3.26.7, eerste lid, onderdelen a en b, en tweede lid][ref1];

      2°. een begroting waarin de totale kosten van de subsidiabele activiteiten en de omvang van de gevraagde subsidie
      zijn opgenomen;

      b. documenten met daarin een beknopte beschrijving van de projectorganisatie en van de kennis en ervaring die bij
      de uitvoering van het ambachts-ondernemerschapsproject betrokken personen aanwezig is, voor zover deze relevant
      zijn voor de toepassing van [artikel 3.26.7, eerste lid, onderdeel c, en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.26.7
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.26.7
