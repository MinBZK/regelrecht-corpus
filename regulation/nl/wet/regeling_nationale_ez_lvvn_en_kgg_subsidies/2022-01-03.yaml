  - number: 2.15.7a
    text: |-
      1 De Minister kent een aanvraag een hoger aantal punten toe, naarmate:

      a. de effectiviteit van het projectplan hoger is;

      b. de duurzaamheid van het project hoger is;

      c. de urgentie van het project hoger is;

      d. de efficiëntie van het project hoger is;

      e. de haalbaarheid van het project hoger is.

      2 Voor de rangschikking wordt het aantal punten gegeven voor het eerste lid, onderdelen a en c, vermenigvuldigd met
      drie, voor het eerste lid, onderdelen b en d, vermenigvuldigd met twee, en vervolgens bij elkaar opgeteld.

      3 Het aantal punten bedraagt bij onderdelen a en c van het eerste lid ten hoogste vijftien punten, bij de
      onderdelen b en d van het eerste lid ten hoogste tien punten en bij onderdeel e van het eerste lid ten hoogste
      vijf punten.

      4 De Minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger, naarmate in totaal meer punten aan
      het project zijn toegekend.

      5 De Minister verdeelt het subsidieplafond onder de aanvragen die het hoogste zijn gerangschikt.

      6 Indien aan twee of meer aanvragen voor een project dat bijdraagt aan de doelstellingen als bedoeld in
      [artikel 2.15.2, eerste lid][ref1], in totaal een gelijk aantal punten is toegekend, rangschikt de Minister een
      aanvraag hoger, naarmate meer punten zijn toegekend aan respectievelijk de onderdelen a, c, b, d en e, van het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.15.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.15.7a
