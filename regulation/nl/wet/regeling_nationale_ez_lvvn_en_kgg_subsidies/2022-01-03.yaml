  - number: 4.2.76
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. na toepassing van [artikel 4.2.77, eerste en tweede lid][ref1], minder dan 6 punten per criterium zijn
      toegekend;

      b. eerder op grond van dit hoofdstuk of de [Subsidieregeling energie en innovatie][ref2] een subsidie is verstrekt
      voor een soortgelijk project;

      c. in geval aan een samenwerkingsverband een onderzoeksorganisatie deelneemt, de samenwerking tussen die
      onderzoeksorganisatie en de overige deelnemers in het samenwerkingsverband onvoldoende evenwichtig is, blijkend uit
      de omstandigheid dat de onderzoeksorganisatie meer dan 65 procent van de subsidiabele kosten maakt;

      d. in geval een ICT-voorziening als bedoeld in programmalijn 1 (Multi-modelling voor integrale besluitvorming) of
      programmalijn 3 (Besluitvormingstools flexibiliteit), opgenomen in [bijlage 4.2.10][ref3], ontwikkeld en getest
      wordt, deze voorziening niet werkt op basis van open standaarden;

      e. in de aanvraag onvoldoende aannemelijk is gemaakt dat andere partijen na afloop van het project toegang hebben
      tot de projectresultaten zonder belemmerende of discriminerende voorwaarden;

      f. onvoldoende vertrouwen bestaat dat met het project ontwikkelde producten na afloop van het project zonder
      subsidie, zo nodig na doorontwikkeling, aangeboden worden op een markt;

      g. de aanvraag, voor zover het overige projectactiviteiten betreft die worden uitgevoerd door ondernemingen,
      activiteiten bevat die direct verband houden met:

      1°. de omvang van de uitvoer naar andere lidstaten van de Europese Unie of derde landen;

      2°. het oprichten en exploiteren van een distributienet ten behoeve van de uitvoer; of

      3°. andere lopende uitgaven direct verband houdend met activiteiten op het gebied van uitvoer.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.77
      [ref2]: https://wetten.overheid.nl/BWBR0026952
      [ref3]: https://wetten.overheid.nl/BWBR0035474
