  - number: 3.23.1
    text: |-
      In deze titel wordt verstaan onder:

        - *eigen bijdrage:* eigen bijdrage van de subsidieontvanger of subsidieontvangers in de subsidiabele kosten als
      bedoeld in [artikel 3.23.5][ref1];
        - *innovatieadviesdienstverklaring:* verklaring van een deelnemer aan een Venture Challenge samenwerkingsverband of
      van een Venture Challenge startup waaruit blijkt dat subsidieverlening niet zal leiden tot overschrijding van het
      plafond voor innovatiediensten en diensten inzake innovatieondersteuning, bedoeld in artikel 28, vierde lid, van de
      algemene groepsvrijstellingsverordening;
        - *Venture Challenge programma:* in opdracht van de Nederlandse Organisatie voor Wetenschappelijk Onderzoek
      georganiseerde innovatieadviesdienst als bedoeld in de artikelen 2, onderdeel 94, en 28, vierde lid, van de
      algemene groepsvrijstellingsverordening, bestaande uit Venture Challenge bijeenkomsten waarin de deelnemende
      Venture Challenge teams onder begeleiding van ervaren business coaches, andere experts en ondernemers uit de sector
      werken aan het opzetten of aanscherpen van het venture plan van hun al dan niet toekomstige Venture Challenge
      startup en dit venture plan leren presenteren;
        - *Venture Challenge samenwerkingsverband:* samenwerkingsverband, bestaande uit ten minste drie natuurlijke
      personen, waaronder in ieder geval de persoon die die de nieuwe technische vinding heeft gedaan of de nieuwe
      toepassing van een reeds bestaande technologie heeft ontdekt, en die voornemens zijn gezamenlijk een Venture
      Challenge startup op te richten;
        - *Venture Challenge startup:* kleine onderneming of middelgrote onderneming die: a. ten tijde van de verstrekking
      van de subsidie op grond van deze titel niet actief is of is geweest op een markt; en b. erop gericht is een nieuw
      product of proces, of nieuwe dienst op de markt te brengen, gebaseerd op een nieuwe technische vinding of een
      nieuwe toepassing van een reeds bestaande technologie, voortkomend uit wetenschappelijk onderzoek;
        - *Venture Challenge team:* team van minimaal drie en maximaal vier natuurlijke personen, bestaande uit: a. de
      oprichter of oprichters en eventuele medewerkers of adviseurs van een Venture Challenge startup, waaronder in ieder
      geval de persoon die de nieuwe technische vinding heeft gedaan of de nieuwe toepassing van een reeds bestaande
      technologie heeft ontdekt; of b. de deelnemers in een Venture Challenge samenwerkingsverband;
        - *venture plan:* beschrijving van de commerciële potentie van de al dan niet toekomstige Venture Challenge
      startup met het oog op exploitatie van de nieuwe technische vinding of de nieuwe toepassing van een reeds
      bestaande technologie en het aantrekken van financiers, inhoudend in ieder geval een beschrijving van: a. het
      probleem; b. de unieke oplossing die het nieuwe product of proces of de nieuwe dienst biedt; c. het stadium van het
      ontwikkelingstraject van het nieuwe product of proces of de nieuwe dienst; d. de financieringsbehoefte en verwachte
      opbrengsten van de al dan niet toekomstige Venture Challenge startup; e. de belangrijkste risico’s en een plan van
      aanpak om deze risico’s te mitigeren.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.23.5
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.23.1
