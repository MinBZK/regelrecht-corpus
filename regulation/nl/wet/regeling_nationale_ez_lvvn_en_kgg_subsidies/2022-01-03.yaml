        artikel: 2.13.2
        hoofdstuk: '2'
  - number: 2.13.8
    text: |-
      Deze titel vervalt met ingang van 15 augustus 2025, met dien verstande dat deze van toepassing blijft op subsidies
      die voor deze datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.13.8
  - number: 2.14.1
    text: |-
      In deze titel wordt verstaan onder:

        - *houder:* houder van zeldzame melkkoeien die melk levert aan een zuivelonderneming of die de op het eigen bedrijf
      geproduceerde melk zelf verwerkt tot eindproducten en die een relatienummer heeft;
        - *I&R-systeem rund:* I&R-systeem rund als bedoeld in
      [artikel 14, onderdeel a, van de Regeling identificatie en registratie van dieren][ref1];
        - *melkkoe:* vrouwelijk rund dat ten minste eenmaal heeft gekalfd en wordt gemolken;
        - *relatienummer:* relatienummer als bedoeld in
      [artikel 1 van de Regeling identificatie en registratie van dieren][ref2];
        - *zeldzame melkkoeien:* a. zeldzame runderrassen: raszuivere runderen behorend tot een van de rassen Brandrood
      rund, Fries-Hollands vee (zwartbont), Groninger blaarkop, Lakenvelder, Roodbont Fries vee; of b. dubbeldoel
      runderen met zeldzame kleurslagen: runderen behorend tot een dubbeldoeltype met een van de kleurslagen Baggerbont,
      Blauwbont, Vaal, Vaalbont of Witrik.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel1
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.14.1
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '1'
  - number: 2.14.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan houders voor het houden van zeldzame melkkoeien die als zodanig
      bekend zijn in het I&R-systeem rund.

      2 De subsidie wordt maximaal eenmaal per jaar verstrekt voor het aantal zeldzame melkkoeien dat is gehouden in het
      kalenderjaar voorafgaand aan het kalenderjaar waarin de aanvraag wordt ingediend.

      3 Het aantal zeldzame melkkoeien dat in een kalenderjaar wordt gehouden wordt berekend door het aantal blijkens het
      I&R-systeem rund aanwezige zeldzame melkkoeien op 1 februari, 1 mei, 1 augustus en 1 november van dat kalenderjaar
      op te tellen en de uitkomst te delen door vier.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.14.2
  - number: 2.14.3
    text: |-
      1 De hoogte van de subsidie betreft het aantal zeldzame melkkoeien per kalenderjaar berekend op grond van
      [artikel 2.14.2., derde lid][ref1], vermenigvuldigd met € 150,–.

      2 De hoogte van de subsidie wordt naar beneden bijgesteld voor zover blijkens de door de houder ingevulde
      verklaring landbouw de-minimissteun, als gevolg van de verlening van de subsidie het de-minimis plafond, bedoeld in
      artikel 3, tweede lid, van de landbouw de-minimisverordening, overschreden zou worden.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.14.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.14.3
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.14.2
        hoofdstuk: '2'
  - number: 2.14.4
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.14.4
  - number: 2.14.5
    text: |-
      Een aanvraag voor subsidie wordt ingediend met gebruikmaking van een middel dat hiervoor door de minister
      beschikbaar wordt gesteld en bevat ten minste:

      a. gegevens over de aanvrager, waaronder het nummer waaronder de onderneming geregistreerd is bij de Kamer van
      Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. het aantal zeldzame melkkoeien waarvoor de subsidie aangevraagd wordt;

      d. een verklaring landbouw de-minimissteun.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.14.5
  - number: 2.14.6
    text: |-
      De subsidie, bedoeld in [artikel 2.14.2][ref1]., bevat staatssteun en wordt gerechtvaardigd door de landbouw de-
      minimisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.14.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.14.6
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.14.2
        hoofdstuk: '2'
  - number: 2.14.7
    text: |-
      Deze titel vervalt met ingang van 1 juli 2023, met dien verstande dat deze van toepassing blijft op subsidies die
      voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.14.7
  - number: 2.15.1
    text: |-
      In deze titel wordt verstaan onder:

        - *aanwijzingsbesluit van een Natura 2000-gebied:* aanwijzingsbesluit als bedoeld in
      [artikel 2.1 van de Wet natuurbescherming][ref1];
        - *habitat van een soort:* door specifieke abiotische en biotische factoren bepaald milieu waarin de soort tijdens
      één van de fasen van zijn biologische cyclus leeft;
        - *kritische depositiewaarde:* de grens waarboven het risico bestaat dat de kwaliteit van het habitat significant
      wordt aangetast door de verzurende of vermestende invloed van atmosferische stikstofdepositie;
        - *landbouwgrond:* alle grond die wordt gebruikt als bouwland, blijvend grasland of blijvend weiland, of voor
      blijvende teelten als bedoeld in artikel 4, eerste lid, onderdeel g, van [Verordening (EU) nr. 1307/2013]
      (32013R1307) van het Europees parlement en de Raad van 17 december 2013 tot vaststelling van voorschriften
      voor rechtstreekse betalingen aan landbouwers in het kader van de steunregelingen van het gemeenschappelijk
      landbouwbeleid en tot intrekking van [Verordening (EG) nr. 637/2008](32008R0637) van de Raad en [Verordening (EG)
      nr. 73/2009](32009R0073) van de Raad (PbEU 2013 L 347);
        - *Natura 2000-gebied:* Natura 2000-gebied als bedoeld in
      [artikel 1.1, eerste lid, van de Wet natuurbescherming][ref2];
        - *natuurherstelmaatregel:* niet-productieve investering in de vorm van een maatregel die is vermeld in het rapport
      Herstelstrategieën stikstofgevoelige habitats, zoals te raadplegen via www.natura2000.nl;
        - *natuurlijke habitat:* geheel natuurlijke of halfnatuurlijke land- of waterzone met bijzondere geografische,
      abiotische en biotische kenmerken;
        - *Natuurnetwerk Nederland:* stelsel van natuurgebieden van internationaal of nationaal belang dat strekt tot
      veiligstelling van ecosystemen met daarbij behorende soorten;
        - *openbare registers:* openbare registers als bedoeld in [artikel 16 van Boek 3 van het Burgerlijk Wetboek][ref3]
      juncto [artikel 8, eerste lid, van de Kadasterwet][ref4];
        - *stikstofdepositie:* neerslag van stikstofverbindingen uit de atmosfeer op een habitat, waarbij de belasting op
      een punt binnen het habitat wordt uitgedrukt in mol N/ha/jr en de belasting op het totale habitat in mol N/jr;
        - *stikstofgevoelige natuurlijke habitats of habitats van soorten:* typen natuurlijke habitats, habitats van
      soorten en leefgebieden van vogelsoorten met een kritische depositiewaarde van <2400 mol N/ha/jaar waarvoor in
      het aanwijzingsbesluit van het Natura 2000-gebied een instandhoudingsdoelstelling is vastgesteld of waarvoor
      een instandhoudingsdoelstelling is voorzien in een ontwerpaanwijzingsbesluit of ontwerpwijzigingsbesluit van een
      aanwijzingsbesluit dat overeenkomstig [artikel 2.1, vijfde of zevende lid, van de Wet natuurbescherming][ref5] en
      [artikel 3:12 van de Algemene wet bestuursrecht][ref6] is bekend gemaakt;
        - *terreinbeheerder:* degene die zeggenschap heeft over een terrein krachtens eigendom, erfpacht of recht van
      beklemming;
        - *verwerving:* verkrijging van het recht van eigendom van landbouwgrond.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel1.1
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0004541#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0037552#Artikel2.1
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel312
