        paragraaf: 2.2.2
  - number: 2.2.8
    text: |-
      1 Een aanvraag voor subsidie bevat ten minste de gegevens:

      a. bedoeld in artikel 6, tweede lid, van de algemene groepsvrijstellingsverordening en artikel 6, tweede
      lid, van de groepsvrijstellingsverordening landbouw, indien een innovatieproject de drie fases, bedoeld in
      [artikel 2.2.2, tweede lid, onderdeel a][ref1], betreft;

      b. bedoeld in artikel 6, tweede lid, van de groepsvrijstellingsverordening landbouw, indien het innovatieproject
      uitsluitend de emissiemetingenfase, bedoeld in [artikel 2.2.2, onderdeel b][ref2], betreft.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie ten minste:

      a. gegevens over de aanvrager, waaronder het nummer waarmee de onderneming is geregistreerd bij de Kamer van
      Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. kerngegevens over het project;

      d. de gegevens over de onderzoeks- en ontwikkelingsfase, bedoeld in [artikel 2.2.13][ref3], indien een
      innovatieproject de drie fases, bedoeld in [artikel 2.2.2, tweede lid, onderdeel a][ref4], betreft.

      3 De aanvraag gaat vergezeld van een projectplan, projectbegroting en samenwerkingsovereenkomst tussen de
      deelnemers in het samenwerkingsverband.

      4 Het projectplan, bedoeld in het derde lid, bevat ten minste:

      a. een onderbouwing van de reductie van broeikasgasemissies of stalemissies die met het innovatieproject op een
      veehouderijlocatie wordt beoogd te realiseren;

      b. voor zover van toepassing, een omschrijving van de kans buiten het stalsysteem op afwenteling van de
      binnen het stalsysteem gerealiseerde reductie van broeikasgas- en stalemissies in het innovatieproject en
      de wijze waarop deze afwenteling wordt voorkomen in verband met het rangschikkingscriterium, bedoeld in
      [artikel 2.2.7, eerste lid, onderdeel a, subonderdeel 1°][ref5].

      5 De projectbegroting, bedoeld in het derde lid, bevat ten minste:

      a. de omvang van de gevraagde subsidie per deelnemer in het samenwerkingsverband;

      b. de totale kosten van:

      1°. indien een innovatieproject de drie fases, bedoeld in [artikel 2.2.2, tweede lid, onderdeel a][ref6],
      betreft: de investeringen, managementmaatregelen of combinatie hiervan, bedoeld in [artikel 2.2.10][ref7], en de
      emissiemetingen, bedoeld in [artikel 2.2.15][ref8];

      2°. indien het innovatieproject uitsluitend de emissiemetingenfase, bedoeld in [artikel 2.2.2][ref9], onderdeel b,
      betreft: de emissiemetingenfase, bedoeld in [artikel 2.2.15][ref10];

      c. onderbouwde informatie over de wijze waarop de deelnemers van het samenwerkingsverband hun eigen aandeel in de
      projectkosten financieren.

      6 De samenwerkingsovereenkomst, bedoeld in het derde lid, bevat ten minste een omschrijving van de wijze waarop
      ten aanzien van de deelnemers in het samenwerkingsverband wordt omgegaan met de bijdrage in de kosten, het delen in
      de risico’s en uitkomsten, de verspreiding van de resultaten en de toegang tot en de regels voor de toewijzing van
      intellectuele eigendomsrechten.


