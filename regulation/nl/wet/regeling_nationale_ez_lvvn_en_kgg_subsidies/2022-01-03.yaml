  - number: 3.27.13
    text: |-
      Het eindverslag, bedoeld in [artikel 50, tweede lid, onderdeel a, van het besluit][ref1], waarvan de aanvraag tot
      subsidievaststelling vergezeld gaat, bevat, voor zover van toepassing, in ieder geval:

      a. een omschrijving van de projectresultaten van het Nederlandse belangrijke project;

      b. op welke wijze het Nederlandse belangrijke project heeft bijgedragen aan de doelen op de gebieden, bedoeld in
      [artikel 3.27.8, eerste lid, onderdeel a][ref2];

      c. een overzicht waarin de totale kosten van de subsidiabele activiteiten zijn opgenomen, inclusief een
      kostenopbouw die is toegespitst op de verschillende kostencomponenten;

      d. een omschrijving van de wijze waarop voldaan is aan de verplichtingen, bedoeld in de [artikelen 3.27.9][ref3]
      en [3.27.10][ref4].


