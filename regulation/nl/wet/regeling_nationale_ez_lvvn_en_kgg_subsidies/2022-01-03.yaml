  - number: 2.4.38
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien:

      a. de aanvrager niet beschikt over voor het demonstratieproject gekwalificeerd en geregeld opgeleid personeel als
      bedoeld in artikel 21, zesde lid, van de groepsvrijstellingsverordening landbouw of zelf over deze kwalificaties
      beschikt;

      b. na toepassing van [artikel 2.4.39][ref1]. op één van de onderdelen a tot en met e van het eerste lid van dat
      artikel minder dan drie punten zijn toegekend;

      c. de aanvrager een producentengroepering of -organisatie is die een landbouwonderneming verplicht lid te zijn van
      de groepering of organisatie om deel te kunnen nemen aan het project;

      d. het project niet past binnen de onderwerpen van [artikel 2.4.33, tweede lid][ref2].

      2 De aanvrager, bedoeld in [artikel 2.4.33, eerste lid, onderdeel a of b][ref3], kan voor maximaal een aanvraag
      subsidie toegewezen krijgen, de aanvrager, bedoeld in artikel 2.4.33, eerste lid, onderdeel c, kan voor maximaal
      twee aanvragen subsidie toegewezen krijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.39
