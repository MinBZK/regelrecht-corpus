  - number: 4.7.7
    text: |-
      De aanvraag voor subsidie bevat:

      a. het Kamer van Koophandel-nummer van de subsidieaanvrager;

      b. het Kamer van Koophandel-nummer van de energieadviseur en van de energieregisseur, indien de ondersteuning,
      bedoeld in [artikel 4.7.2, eerste lid, onder b][ref1], daardoor is verleend;

      c. het advies, bedoeld in [artikel 4.7.2, eerste lid, onder a][ref2];

      d. een factuur van de energieadviseur voor de gemaakte kosten als bedoeld in
      [artikel 4.7.2, eerste lid, onder a][ref3], en, indien ook de subsidie, bedoeld in artikel 4.7.2, eerste lid, onder
      b, wordt aangevraagd, een factuur van de energieadviseur of energieregisseur voor de gemaakte kosten als bedoeld in
      artikel 4.7.2, eerste lid, onder b, waarin de kosten worden gespecificeerd;

      e. een namens de mkb-onderneming binnen één jaar na de datum, bedoeld in [artikel 4.7.4, tweede lid, onder a][ref4],
      getekende offerte of namens de mkb-onderneming getekende opdracht aan een andere onderneming voor het
      uitvoeren van minstens één van de verduurzamingsmaatregelen, bedoeld in artikel 4.7.4, tweede lid, onder f,
      dan wel een betaalbewijs voor materialen of diensten die aantonen dat de mkb-onderneming minstens één van de
      verduurzamingsmaatregelen, bedoeld in artikel 4.7.4, tweede lid, onder f, zelf uitvoert of laat uitvoeren;

      f. een verklaring de-minimissteun; en

      g. het adres van het bedrijfspand waarvoor de mkb-onderneming een subsidie, bedoeld in
      [artikel 4.7.2, eerste lid][ref5], aanvraagt.


