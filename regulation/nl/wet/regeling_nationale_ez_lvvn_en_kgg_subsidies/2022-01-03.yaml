      1 Indien voor een investering als bedoeld in [artikel 2.2.27, tweede lid][ref1], een milieueffectbeoordeling moet
      worden uitgevoerd als bedoeld in artikel 14, vijfde lid, van de groepsvrijstellingsverordening landbouw wordt de
      subsidie verleend onder de opschortende voorwaarde dat de subsidieontvanger binnen één jaar na de beschikking tot
      subsidieverlening via bescheiden aantoont dat deze beoordeling is uitgevoerd of de benodigde vergunning voor het
      betrokken investeringsproject is verleend.

      2 De minister kan op verzoek van de subsidieontvanger de termijn, bedoeld in het eerste lid, verlengen tot een
      periode van maximaal twee jaar na de beschikking tot subsidieverlening.

      3 De subsidieontvanger verstrekt de bescheiden, bedoeld in het eerste lid, binnen één maand na de uitvoering van de
      milieueffectbeoordeling of ontvangst van de benodigde vergunning, bedoeld in het eerste lid, aan de minister.


