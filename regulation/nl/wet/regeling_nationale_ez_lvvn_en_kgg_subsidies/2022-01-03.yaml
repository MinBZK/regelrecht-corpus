  - number: 3.6.11
    text: |-
      1 Op verzoek van de minister verleent de subsidieontvanger medewerking aan het verspreiden van de resultaten van de
      op grond van deze titel gesubsidieerde activiteiten.

      2 De subsidieontvanger verstrekt gedurende de looptijd van het R&D-mobiliteitsproject jaarlijks een
      voortgangsrapportage over het project die de minister kan gebruiken voor de openbare brede verspreiding van de
      niet-bedrijfsgevoelige kennis en informatie die met het project worden opgedaan.

      3 De subsidieontvanger maakt de niet bedrijfsgevoelige kennis en informatie die met het project wordt opgedaan na
      afloop van het project openbaar in een, naar het oordeel van de minister, kwalitatief voldoende verslag.

      4 De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.

      5 De informatie, bedoeld in het tweede en derde lid, wordt verstrekt met gebruikmaking van een middel dat door de
      minister beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.6.11
  - number: 3.6.12
    text: |-
      1 Een aanvraag om subsidie bevat ten minste de gegevens, bedoeld in artikel 6, tweede lid, van de algemene
      groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag om subsidie ten minste:

      a. gegevens over de aanvrager, waaronder het post- en bezoekadres, het rekeningnummer en, voor zover van
      toepassing, het nummer waarmee de onderneming is geregistreerd bij de Kamer van Koophandel;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. kerngegevens over het R&D-mobiliteitsproject, die bestaan uit een samenvatting van de projectomschrijving en een
      lijst met deelnemers in het samenwerkingsverband dat het R&D-mobiliteitsproject zal uitvoeren;

      d. gegevens over de grootte van de onderneming van de aanvrager, indien de aanvrager aanspraak wil
      maken op een verhoogd percentage aan subsidie voor een kleine of middelgrote onderneming als bedoeld in
      [artikel 3.6.3, tweede lid, onderdeel a][ref1].

      3 De aanvraag gaat vergezeld van:

      a. een projectomschrijving van de activiteiten van het R&D-mobiliteitsproject;

      b. een financieringsplan en begroting waarin een omschrijving wordt gegeven van:

      1°. de omvang van de gevraagde subsidie;

      2°. de totale kosten van het R&D-mobiliteitsproject, inclusief een beschrijving van welk deel van de kosten
      betrekking heeft op industrieel onderzoek of experimentele ontwikkeling door één of meer ondernemingen dan wel op
      niet-economisch industrieel onderzoek of experimentele ontwikkeling door een onderzoeksorganisatie;

      3°. informatie over de wijze waarop de deelnemers in het samenwerkingsverband hun eigen aandeel in de projectkosten
      financieren;

      c. een beknopte beschrijving van de kennis, ervaring en capaciteiten van de bij de uitvoering van het R&D-
      mobiliteitsproject betrokken organisaties of personen, die relevant is om de kwaliteit van het samenwerkingsverband
      te kunnen beoordelen;

      d. een plan dat betrekking heeft op de wijze waarop de kennisverspreiding plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.6.3
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.6.12
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.6.3
        hoofdstuk: '3'
  - number: 3.6.13
    text: |-
      Het eindverslag, bedoeld in [artikel 50, tweede lid, onderdeel a, van het besluit][ref1], waarvan de aanvraag tot
      subsidievaststelling vergezeld gaat, bevat, voor zover van toepassing, in ieder geval:

      a. een omschrijving van de projectresultaten van het R&D-mobiliteitsproject;

      b. op welke wijze het R&D-mobiliteitsproject heeft bijgedragen aan de doelen en thema’s, bedoeld in
      [artikel 3.6.8, eerste lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.6.8
