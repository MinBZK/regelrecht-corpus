  - number: 3.16.9
    text: |-
      De minister beslist afwijzend op een aanvraag:

      a. indien aannemelijk is dat de innovatieve starter de financiering waarvoor de aanvraag is ingediend zelf heeft of
      kan verkrijgen bij anderen;

      b. indien onvoldoende aannemelijk is dat de toekomstige investeerder aan de hand van het vroegefaseplan het plan
      heeft opgevat de innovatieve starter te financieren of de toekomstige investeerder daar naar verwachting niet toe
      in staat zal zijn;

      c. voor zover de voorziene kosten van het vroegefasetraject hoger zijn dan € 350.000 of lager zijn dan € 50.000;

      d. indien onvoldoende vertrouwen bestaat dat de innovatieve starter het vroegefasetraject in uitvoeringstechnische
      zin zo zal kunnen voltooien dat hij financiering voor de fase na het vroegefasetraject zal kunnen verkrijgen van de
      toekomstige investeerder;

      e. indien onvoldoende vertrouwen bestaat dat de innovatieve starter de geldlening bedoeld in
      [artikel 3.16.7, eerste lid][ref1], kan terugbetalen;

      f. indien voor het vroegefasetraject reeds door de minister subsidie is verstrekt;

      g. indien voor het vroegefasetraject een geldlening bij een financier kan worden aangevraagd;

      h. indien met de uitvoering van het vroegefasetraject is begonnen voor de datum van de aanvraag.


