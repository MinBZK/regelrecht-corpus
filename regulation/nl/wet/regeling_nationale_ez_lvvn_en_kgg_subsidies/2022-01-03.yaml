    text: |-
      Deze titel en de [bijlagen 3.12.1][ref1] en [3.12.2][ref2] vervallen met ingang van 1 juli 2023, met dien verstande
      dat deze van toepassing blijven op subsidies die voor die datum zijn verleend.


