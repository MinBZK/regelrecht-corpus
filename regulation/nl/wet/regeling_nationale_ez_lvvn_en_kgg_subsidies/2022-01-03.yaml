  - number: 2.2.35
    text: |-
      1 Een aanvraag voor subsidie bevat ten minste de gegevens, bedoeld in artikel 6, tweede lid, van de
      groepsvrijstellingsverordening landbouw.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie ten minste:

      a. gegevens over de aanvrager, waaronder het nummer waarmee de onderneming is geregistreerd bij de Kamer van
      Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres.

      3 De aanvraag gaat vergezeld van

      a. een projectomschrijving;

      b. offertes behorend bij de kosten voor een investering als bedoeld in [artikel 2.2.27, tweede lid][ref1];

      c. een onderbouwing waaruit blijkt hoe een investering als bedoeld in [artikel 2.2.27, tweede lid][ref2], wordt
      gefinancierd;

      d. voor zover van toepassing, bescheiden waaruit blijkt welke niet-gesubsidieerde fijnstofreducerende technieken,
      bedoeld in [artikel 2.2.32, tweede lid][ref3], worden toegepast.

      4 De projectomschrijving, bedoeld in het derde lid, onderdeel a, bevat in ieder geval:

      a. de benaming van een investering als bedoeld in [artikel 2.2.27, tweede lid][ref4], en bijbehorende code zoals
      deze is opgenomen in [bijlage 2.2.2][ref5];

      b. voor zover van toepassing, voor welk type bestaand stalsysteem op de veehouderijlocatie een investering als
      bedoeld in [artikel 2.2.27, tweede lid][ref6], bestemd is;

      c. voor zover van toepassing, de benaming en het reductiepercentage van een niet-gesubsidieerde fijnstofreducerende
      techniek als bedoeld in [artikel 2.2.32, tweede lid][ref7], die zijn opgenomen in het Rekenmodel Vee-combistof
      zoals dat beschikbaar is via www.infomil.nl tijdens de openstellingsperiode waarin de aanvraag voor subsidie is
      ingediend;

      d. een berekening van de verwachte reductie van de emissie van fijnstof die met één of meerdere investeringen als
      bedoeld in [artikel 2.2.27, tweede lid][ref8], en, voor zover van toepassing, in combinatie met niet-gesubsidieerde
      technieken als bedoeld in [artikel 2.2.32, tweede lid][ref9], behaald wordt.

      5 Voor de berekening van de verwachte reductie van emissie van fijnstof, bedoeld in het vierde lid, onderdeel
      d, wordt gebruik gemaakt van het Rekenmodel Vee-combistof zoals dat beschikbaar is via www.infomil.nl tijdens de
      openstellingsperiode waarin de aanvraag voor subsidie is ingediend.


