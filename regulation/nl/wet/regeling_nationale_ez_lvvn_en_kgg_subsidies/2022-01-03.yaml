        bwb_id: BWBR0037552
        artikel: '8.3'
  - number: 2.12.11
    text: De subsidie, bedoeld in artikel 2.12.2, eerste lid, bevat geen staatssteun.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.12.11
  - number: 2.12.12
    text: |-
      Deze titel vervalt met ingang van 1 juli 2025, met dien verstande dat deze van toepassing blijft op subsidies die
      voor deze datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.12.12
  - number: 2.13.1
    text: |-
      In deze titel wordt verstaan onder:

        - *pluimvee:* fokpluimvee, vermeerderingspluimvee voor de consumptie-ei-sector, leghennen of pluimvee dat daarvoor
      wordt opgefokt;
        - *pluimveehouder:* ondernemer die werkzaam is in de primaire landbouwproductie en pluimvee houdt;
        - *vaccindosis:* standaardhoeveelheid per toediening van een op de grond van de [Wet dieren][ref1] toegelaten
      vaccin;
        - *vaccineren:* het toedienen van een vaccindosis bij pluimvee overeenkomstig de voorwaarden die daaraan bij de
      registratie van het betreffende vaccin zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0030250
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.13.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
  - number: 2.13.2
    text: |-
      De minister verstrekt op aanvraag subsidie aan een pluimveehouder voor het in een kalenderjaar vaccineren van
      pluimvee met een vaccindosis ter voorkoming van een besmetting met Salmonella enteritidis of Salmonella typhimurium
      in maximaal drie toedieningsrondes.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.13.2
  - number: 2.13.3
    text: |-
      De subsidie bedraagt:

      a. € 0,028 per vaccindosis tegen Salmonella enteritidis;

      b. € 0,048 per vaccindosis tegen Salmonella enteritidis en Salmonella typhimurium.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.13.3
  - number: 2.13.4
    text: |-
      1 Voor subsidie komen in aanmerking de aanschafkosten voor een vaccindosis ter voorkoming van een besmetting met
      Salmonella enteritidis of Salmonella typhimurium.

      2 [Artikel 10, tweede en vierde lid, van het besluit][ref1] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.13.4
