  - number: 4.2.49
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. niet uiterlijk op 4 mei 2021 vóór 17.00 uur een vooraanmelding bij de Adviescommissie MOOI is ingediend;

      b. na toepassing van [artikel 4.2.49a, eerste en tweede lid][ref1], minder dan 6 punten per criterium zijn
      toegekend;

      c. in geval aan een samenwerkingsverband een onderzoeksorganisatie deelneemt, de samenwerking tussen die
      onderzoeksorganisatie en de overige deelnemers in het samenwerkingsverband onvoldoende evenwichtig is, blijkend uit
      de omstandigheid dat de onderzoeksorganisatie meer dan 65 procent van de subsidiabele kosten maakt;

      d. de subsidiabele kosten minder dan € 2.000.000 bedragen;

      e. de aanvraag voor zover het overige projectactiviteiten betreft die worden uitgevoerd door ondernemingen,
      activiteiten bevat die direct verband houden met:

      1°. de omvang van de uitvoer naar andere lidstaten van de Europese Unie of derde landen;

      2°. het oprichten en exploiteren van een distributienet ten behoeve van de uitvoer; of

      3°. andere lopende uitgaven direct verband houdend met activiteiten op het gebied van uitvoer.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.49a
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.49
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 4.2.49a
        hoofdstuk: '4'
        paragraaf: 4.2.7
  - number: 4.2.49a
    text: |-
      1 De minister kent aan een MOOI-project een hoger aantal punten toe naarmate:

      a. het MOOI-project meer bijdraagt aan de doelstellingen van de subsidie, opgenomen in [bijlage 4.2.6][ref1];

      b. het MOOI-project vernieuwender is ten opzichte van de internationale stand van onderzoek of techniek en de
      Nederlandse kennispositie meer versterkt;

      c. de slaagkans van de innovatie in de Nederlandse markt en maatschappij groter is;

      d. de kwaliteit van het MOOI-project beter is, blijkend uit de uitwerking van aanpak en methodiek, de omgang met
      risico’s, de uitvoerbaarheid en de mate waarin de beschikbare middelen effectiever en efficiënter worden ingezet;

      e. de kwaliteit van het samenwerkingsverband beter is, blijkend uit de samenstelling en de projectorganisatie.

      2 De minister kent per onderdeel van het eerste lid ten minste één en ten hoogste tien punten toe.

      3 In afwijking van het tweede lid, kent de minister voor het eerste lid, onderdeel e:

      a. 0,5 punt extra toe, indien ondernemingen meer dan 40 procent en ten hoogste 50 procent van de subsidiabele
      kosten dragen;

      b. 1 punt extra toe, indien ondernemingen meer dan 50 procent van de subsidiabele kosten dragen.

      4 Voor de rangschikking wordt het aantal punten gegeven voor het eerste lid, onderdelen a en e, per onderdeel
      vermenigvuldigd met 25, het eerste lid, onderdelen b, c, en d, per onderdeel vermenigvuldigd met 16,67, en
      vervolgens opgeteld.

      5 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.

      6 Geen subsidie wordt verleend voor een project dat lager is gerangschikt dan een soortgelijk project.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.49a
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 4.2.49b
    text: |-
      1 Er is een Adviescommissie MOOI die tot taak heeft de minister op zijn verzoek te adviseren omtrent de
      vooraanmelding, de afwijzingsgronden, bedoeld in [artikel 23, aanhef en onderdelen d en e, van het besluit][ref1],
      en de rangschikkingscriteria, bedoeld in [artikel 4.2.49a][ref2].

      2 De commissie bestaat uit ten minste vier en ten hoogste veertig leden.

      3 De voorzitter en de andere leden van de commissie worden door de minister voor een termijn van ten hoogste twee
      jaar benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.49a
