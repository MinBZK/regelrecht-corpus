  - number: 3.6.15
    text: |-
      Deze titel en [bijlage 3.6][ref1] vervallen met ingang van 1 juli 2022, met dien verstande dat deze van toepassing
      blijven op subsidies die voor deze datum zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
