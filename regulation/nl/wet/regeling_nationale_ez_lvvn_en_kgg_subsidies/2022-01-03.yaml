  - number: 2.12.1
    text: |-
      In deze titel wordt verstaan onder:

        - *nationaal park:* a. nationaal park, genoemd in
      [artikel 2, eerste lid, van de Regeling aanwijzing nationale parken][ref1]; b. Nationaal Park Veluwezoom; c.
      Nationaal Park De Hoge Veluwe; d. Grenspark Zoom-Kalmthoutse Heide;
        - *nationaal park in oprichting:* gebied waarvoor de gedeputeerde staten van de provincie of provincies
      waarin het gebied is gelegen voornemens zijn uiterlijk 1 september 2021 een verzoek als bedoeld in
      [artikel 8.3, eerste lid, van de Wet natuurbescherming][ref2] te doen;
        - *samenwerkingsverband nationaal park of nationaal park in oprichting:* samenwerkingsverband als bedoeld in
      artikel 2.12.2, derde lid;
        - *standaard nationaal park:* standaard voor de gebiedsaanduiding nationaal park (werkversie), zoals opgenomen in
      bijlage 4 bij Kamerstukken II 2018/19, 33 576, nr. 165;
        - *vertegenwoordiger nationaal park of nationaal park in oprichting:* rechtspersoon die volgens zijn statuten tot
      doel heeft de belangen van het nationaal park of van het nationaal park in oprichting te behartigen.


      [ref1]: https://wetten.overheid.nl/BWBR0022396#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel8.3
