  - number: 2.4.2
    text: |-
      Deze titel vervalt met ingang van 1 januari 2024, met dien verstande dat deze van toepassing blijft op subsidies
      die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.2
  - number: 2.4.3
    text: |-
      1 Een adviesvoucher heeft een waarde van ten hoogste € 1.500,– en wordt door de minister op aanvraag verstrekt
      aan een landbouwonderneming voor het verkrijgen van een bedrijfsspecifiek bedrijfsadvies over één van de volgende
      aandachtsgebieden:

      a. Kringlooplandbouw:

      1°. (stikstof)emissie en hergebruik nutriënten;

      2°. gezonde bodem, water en teeltsystemen;

      3°. weerbare teeltsystemen en gewasbescherming;

      4°. circulair gebruik van gewassen, grondstoffen en nieuwe plantaardige eiwitbronnen;

      5°. natuurinclusieve landbouw;

      6°. precisielandbouw.

      b. Duurzaam Ondernemerschap:

      1°. persoonlijke ontwikkeling van ondernemers en hun bedrijf;

      2°. horizontale samenwerking;

      3°. bedrijfsopvolging;

      4°. duurzaam verdienvermogen.

      2 De landbouwonderneming vermeldt bij de aanvraag:

      a. de bedrijfsspecifieke adviesvraag die zij in het kader van het bedrijfsadvies wil stellen;

      b. op welk aandachtsgebied, genoemd in het eerste lid, het bedrijfsadvies gericht zal zijn;

      c. of de landbouwonderneming in groepsverband wil worden geadviseerd; en

      d. een erkende bedrijfsadviseur naar keuze, voor dat specifieke aandachtsgebied.

      3 Aan de in het tweede lid, onderdeel d, genoemde erkende bedrijfsadviseur wordt de verstrekte voucher
      overgedragen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.3
  - number: 2.4.4
    text: |-
      1 Een cursusvoucher heeft een waarde van € 800,– en wordt door de minister op aanvraag verstrekt aan een
      landbouwonderneming voor het volgen van de Verdiepingscursus ‘stikstof in de landbouw’.

      2 De landbouwonderneming vermeldt bij de aanvraag een kennisinstelling naar keuze die deze cursus geeft.

      3 Aan de in het tweede lid genoemde kennisinstelling wordt de verstrekte voucher overgedragen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.4
  - number: 2.4.5
    text: |-
      De minister bepaalt op volgorde van binnenkomst aan welke landbouwondernemingen, binnen het subsidieplafond voor
      adviesvouchers of binnen het subsidieplafond voor cursusvouchers, vouchers worden verstrekt, uitgaande van de
      (maximum)waarde per voucher.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.5
  - number: 2.4.6
    text: |-
      De minister beslist afwijzend op een aanvraag indien aan de aanvrager al eerder een voucher als bedoeld in
      [artikel 2.4.3][ref1] of [artikel 2.4.4][ref2] is toegekend in hetzelfde kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.3
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.4
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.6
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.4.3
        hoofdstuk: '2'
        paragraaf: 2.4.2
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 2.4.4
        hoofdstuk: '2'
        paragraaf: 2.4.2
  - number: 2.4.8
    text: |-
      Subsidie wordt verstrekt aan een erkende bedrijfsadviseur die een advies heeft verstrekt of een kennisinstelling
      die een cursus heeft uitgevoerd ten behoeve van een landbouwonderneming en in verband daarmee een geldige voucher
      overlegt.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.8
  - number: 2.4.9
    text: De subsidie bedraagt ten hoogste 100% van de subsidiabele kosten en niet meer dan € 1.500,– per voucher.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.9
  - number: 2.4.10
    text: |-
      1 Voor subsidie voor het geven van advies, bedoeld in [artikel 2.4.3][ref1], komen in aanmerking kosten van advies
      als bedoeld in artikel 22 van de groepsvrijstellingsverordening landbouw.

      2 Voor subsidie voor het geven van advies, bedoeld in [artikel 2.4.3][ref2], komen niet in aanmerking kosten die
      de erkende bedrijfsadviseur maakt voor de inhuur van personen die organisatorisch of financieel niet onafhankelijk
      zijn van de landbouwonderneming waaraan het advies is verstrekt.

      3 Voor subsidie voor de uitvoering van de cursus, bedoeld in [artikel 2.4.4][ref3], komen in aanmerking
      kosten van de beroepsopleiding, waaronder cursussen als bedoeld in artikel 21, derde lid, onderdeel a, van de
      groepsvrijstellingsverordening landbouw.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.3
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.3
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.4
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.10
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.4.3
        hoofdstuk: '2'
        paragraaf: 2.4.2
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 2.4.3
        hoofdstuk: '2'
        paragraaf: 2.4.2
      - id: ref3
        bwb_id: BWBR0035474
        artikel: 2.4.4
        hoofdstuk: '2'
        paragraaf: 2.4.2
  - number: 2.4.11
    text: |-
      1 Een aanvraag voor subsidie wordt na afloop van de uitvoering van het advies, bedoeld in [artikel 2.4.3][ref1], of
      de cursus, bedoeld in [artikel 2.4.4][ref2], door de kennisinstelling of de erkende bedrijfsadviseur ingediend.

      2 De aanvraag moet binnen een jaar zijn ontvangen na de dagtekening van een aan de landbouwonderneming verstrekte
      voucher. Op een voor het einde van de termijn daartoe ingediend verzoek kan de minister besluiten deze termijn
      eenmalig te verlengen met ten hoogste zes maanden.

      3 Indien de aanvraag niet door de minister is ontvangen binnen de termijn, bedoeld in het tweede lid, vervalt de
      voucher van rechtswege.

      4 Indien de erkende bedrijfsadviseur in groepsverband adviezen heeft verstrekt en hiervoor subsidie beoogt te
      ontvangen, worden de subsidieaanvragen voor de in het groepsverband verstrekte adviezen op dezelfde dag ingediend
      en worden de aanvragen voorzien van een document waarop de aanwezigheid van de landbouwondernemingen bij de
      advisering is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.3
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.4
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.11
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.4.3
        hoofdstuk: '2'
        paragraaf: 2.4.2
      - id: ref2
