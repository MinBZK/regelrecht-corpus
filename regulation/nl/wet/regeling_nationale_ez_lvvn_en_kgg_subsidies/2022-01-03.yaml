        artikel: 4.2.14
        hoofdstuk: '4'
        paragraaf: 4.2.2
  - number: 4.2.14
    text: |-
      1 De minister kent aan een project een hoger aantal punten toe naarmate:

      a. het project meer bijdraagt aan de doelstelling van de subsidie, opgenomen in [bijlage 4.2.1][ref1];

      b. de slaagkans van de innovatie in de Nederlandse markt en maatschappij groter is;

      c. het project vernieuwender is ten opzichte van de internationale stand van onderzoek of techniek en de
      Nederlandse kennispositie meer versterkt;

      d. de kwaliteit van het project beter is, blijkend uit de uitwerking van aanpak en methodiek, de omgang met
      risico’s, de uitvoerbaarheid en de deelnemende partijen.

      2 De minister kent per onderdeel van het eerste lid ten minste één en ten hoogste vijf punten toe.

      3 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.

      4 Geen subsidie wordt verleend voor een project dat lager is gerangschikt dan een soortgelijk project.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.14
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 4.2.14a
    text: |-
      De subsidie, bedoeld in [artikel 4.2.9][ref1]. bevat staatssteun en wordt gerechtvaardigd door artikel 25 van de
      algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.9
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.14a
