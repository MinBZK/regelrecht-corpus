      worden uitgevoerd als bedoeld in artikel 14, vijfde lid, van de groepsvrijstellingsverordening landbouw, is deze
      beoordeling uitgevoerd of de vergunning voor het betrokken investeringsproject verleend vóór de datum waarop de
