  - number: 2.4.33
    text: |-
      1 De minister verstrekt op aanvraag subsidie voor kennisoverdracht over de omschakeling naar duurzame landbouw in
      de vorm van demonstratieprojecten aan:

      a. een individuele landbouwonderneming die een aanvraag indient om zelf demonstratiebedrijf en daarmee aanbieder
      van kennisoverdracht en voorlichting te willen zijn;

      b. een landbouwonderneming die een aanvraag indient voor zichzelf en maximaal twee andere landbouwondernemingen die
      alle demonstratiebedrijf willen zijn;

      c. een onderneming niet zijnde een landbouwonderneming die een aanvraag indient voor maximaal drie
      landbouwondernemingen die alle demonstratiebedrijf willen zijn.

      2 De omschakeling naar duurzame landbouw, bedoeld in het eerste lid, heeft betrekking op vijf van de volgende
      onderwerpen, waarvan emissiereductie stikstof één van de vijf onderwerpen moet zijn:

      a. emissiereductie stikstof;

      b. reductie gebruik gewasbeschermingsmiddelen;

      c. emissiereductie broeikasgassen;

      d. emissiereductie nitraat;

      e. vergroten biodiversiteit;

      f. versterken duurzaam bodembeheer;

      g. verhogen aandeel circulair veevoergebruik;

      h. verbeteren dierenwelzijn en diergezondheid.

      3 De subsidie, bedoeld in het eerste lid, wordt niet verstrekt aan:

      a. een onderneming die gewasbeschermingsmiddelen, diervoeders, landbouwmechanisatieproducten of meststoffen
      verkoopt;

      b. een onderneming die in een groep verbonden is aan een onderneming die producten als bedoeld in onderdeel b
      verkoopt.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.33
  - number: 2.4.34
    text: |-
      1 De subsidie bedraagt ten hoogste 100% van de subsidiabele kosten.

      2 De subsidie bedraagt ten minste € 75.000,– en ten hoogste € 360.000,– per demonstratieproject.

      3 De subsidie bedraagt ten minste € 75.000,– en ten hoogste € 120.000 per demonstratiebedrijf in drie jaar.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.34
  - number: 2.4.35
    text: |-
      1 Voor subsidie komen in aanmerking kosten van de uitvoering van voorlichtings- en demonstratieactiviteiten,
      met inbegrip van kosten voor inhuur van derden voor het verzamelen en analyseren van data noodzakelijk voor
      de voorlichting over het effect van duurzame maatregelen en toepassingen, kosten voor de inrichting van
      ontvangstruimte en materiaalkosten ten behoeve van deze activiteiten door de aanvragers, als bedoeld in artikel 21,
      derde lid, onderdeel a, van de groepsvrijstellingsverordening landbouw.

      2 Voor subsidie komen niet in aanmerking kosten voor de ontwikkeling, aanschaf of aanleg van middelen ten behoeve
      van demonstratieprojecten in verband met investeringen, ten behoeve van de omschakelmaatregelen, als bedoeld in
      artikel 21, derde lid, onderdeel d, van de groepsvrijstellingsverordening landbouw.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.4.35
  - number: 2.4.36
    text: |-
      1 De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.

      2 Indien blijkt dat het totale bedrag van de te verlenen subsidies voor projecten als bedoeld in
      [artikel 2.4.33, eerste lid][ref1], lager is dan het daarvoor vastgestelde subsidieplafond, wordt het overblijvende
      bedrag gereserveerd voor een volgende openstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.33
