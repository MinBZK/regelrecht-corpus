  - number: 3.14.11
    text: |-
      1 Een aanvraag om een garantstellingsovereenkomst op grond van deze titel, bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het nummer waarmee de onderneming is
      geregistreerd bij de Kamer van Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. kerngegevens over de organisatie, waaronder de funding, de deskundigheid, het financieringsbeleid, het
      financieringsproces, het beheer, en het uitwinningsbeleid van krediet.

      2 Een aanvraag om een bankgarantiefaciliteit op grond van deze titel, bevat in ieder geval:

      a. kerngegevens over de financier;

      b. kerngegevens over de ondernemer;

      c. een verklaring van de financier dat is voldaan aan de garantstellingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.14.11
  - number: 3.14.12
    text: |-
      De subsidie, bedoeld in [artikel 3.14.2][ref1] bevat geen staatssteun.


