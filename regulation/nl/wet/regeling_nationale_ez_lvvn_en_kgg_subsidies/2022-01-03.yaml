  - number: 3.17.11
    text: |-
      De subsidie, bedoeld in [artikel 3.17.2, eerste lid][ref1], bevat staatsteun en wordt gerechtvaardigd door:

      a. de algemene de-minimisverordening, indien de subsidie wordt verstrekt aan een subsidieaanvrager als bedoeld in
      [artikel 3.17.2, derde lid, onderdeel a][ref2]; en

      b. artikel 27 van de algemene groepsvrijstellingsverordening, indien de subsidie wordt verstrekt aan een
      subsidieaanvrager als bedoeld in [artikel 3.17.2, derde lid, onderdeel b][ref3].


