  - number: 4.2.43
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *MOOI-project:* samenhangend geheel van activiteiten dat past binnen de in [bijlage 4.2.6][ref1]
      opgenomen beschrijving, bestaande uit: a. industrieel onderzoek of experimentele ontwikkeling; of b. overige
      projectactiviteiten;
        - *overige niet-economische projectactiviteiten van onderzoeksorganisaties:* overige projectactiviteiten,
      onafhankelijk uitgevoerd door onderzoeksorganisaties en in de boekhouding van deze organisaties opgenomen als niet-
      economische activiteiten, bestaande uit de brede verspreiding van onderzoeksresultaten op een niet-exclusieve en
      niet-discriminerende basis;
        - *overige projectactiviteiten:* activiteiten die bijdragen aan het doel van een MOOI-project, niet zijnde
      fundamenteel onderzoek, industrieel onderzoek, experimentele ontwikkeling of een haalbaarheidsstudie;
        - *vooraanmelding:* vooraanmelding als bedoeld in [artikel 21 van het besluit][ref2], die betrekking heeft op ten
      hoogste één subsidieaanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel21
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.43
    references:
      - id: ref1
        bwb_id: BWBR0035474
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '21'
  - number: 4.2.44
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een deelnemer in een samenwerkingsverband voor het uitvoeren
      van een MOOI-project.

      2 Een samenwerkingsverband bevat ten minste drie ondernemingen die niet met elkaar in een groep verbonden zijn, en
      die voor zover het gaat om overige projectactiviteiten niet actief zijn in:

      a. de sector visserij en aquacultuur;

      b. de primaire productie van landbouwproducten; of

      c. de sector verwerking en afzet van landbouwproducten in de gevallen, bedoeld in artikel 1, eerste lid, onder c,
      van de algemene de-minimisverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.44
  - number: 4.2.45
    text: |-
      1 De subsidie bedraagt voor een MOOI-project:

      a. voor zover deze betrekking heeft op industrieel onderzoek, experimentele ontwikkeling of overige
      projectactiviteiten die uitgevoerd worden door een onderneming:

      1°. 40% van de subsidiabele kosten indien de aanvrager een grote onderneming is en de subsidiabele kosten worden
      gemaakt en betaald door de grote onderneming;

      2°. 50% van de subsidiabele kosten indien de aanvrager een middelgrote onderneming is en de subsidiabele kosten
      worden gemaakt en betaald door de middelgrote onderneming;

      3°. 60% van de subsidiabele kosten indien de aanvrager een kleine onderneming is en de subsidiabele kosten worden
      gemaakt en betaald door de kleine onderneming;

      b. 80% van de subsidiabele kosten, voor zover deze betrekking hebben op niet-economische activiteiten of op overige
      niet-economische projectactiviteiten van onderzoeksorganisaties.

      2 De percentages, genoemd in het eerste lid, onderdeel a, worden verlaagd met 15 procentpunten indien niet voldaan
      wordt aan ten minste één van de voorwaarden, bedoeld in artikel 25, zesde lid, onderdeel b, onder i, aanhef en
      eerste of tweede streepje van de algemene groepsvrijstellingsverordening.

      3 De subsidie bedraagt:

      a. ten minste € 25.000 per deelnemer in het samenwerkingsverband; en

      b. ten hoogste € 4.000.000 per MOOI-project.

      4 In afwijking van het derde lid, onderdeel b, bedraagt de subsidie per MOOI-project dat valt onder ‘onderdeel 3.
      Missie B Gebouwde Omgeving’ van [bijlage 4.2.6][ref1] ten hoogste € 7.000.000.

      5 De subsidie voor overige projectactiviteiten bedraagt ten hoogste 5% van de totale subsidiabele kosten van het
      MOOI-project, en niet meer dan € 350.000 per MOOI-project.

      6 Onverminderd het vijfde lid bedraagt de subsidie, voor zover het overige projectactiviteiten betreft die door
      een onderneming worden uitgevoerd, per onderneming in een samenwerkingsverband ten hoogste het bedrag, bedoeld in
      artikel 3, tweede lid, van de algemene de-minimisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.45
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 4.2.46
    text: |-
      1 Voor zover de projectactiviteiten bestaan uit industrieel onderzoek of experimentele ontwikkeling, bedoeld in
      [artikel 4.2.45, eerste lid, onderdelen a en b][ref1], komen de kosten, bedoeld in artikel 25, derde lid, van de
      algemene groepsvrijstellingsverordening voor subsidie in aanmerking.

      2 Voor subsidie komen niet in aanmerking de kosten voor activiteiten, voor zover eerder op grond van deze titel
      subsidie is verstrekt voor soortgelijke activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.45
