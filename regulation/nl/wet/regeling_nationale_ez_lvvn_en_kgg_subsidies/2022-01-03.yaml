    text: |-
      1 Met de uitvoering van het op grond van deze paragraaf gesubsidieerde Nederlands belangrijk project wordt gestart
      binnen zes maanden na de subsidieverlening.

      2 De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is zeven jaar.


