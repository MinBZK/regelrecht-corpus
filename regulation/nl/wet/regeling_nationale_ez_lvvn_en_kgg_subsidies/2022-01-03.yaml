  - number: 4.7.5
    text: |-
      De Minister beslist afwijzend op een aanvraag indien:

      a. de activiteiten zullen worden verricht aan een bedrijfspand dat niet gelegen is in Nederland;

      b. het bedrijfspand zich op een adres bevindt met slechts een woonbestemming;

      c. het advies, bedoeld in [artikel 4.7.2, eerste lid, onder a][ref1], ook ziet op andere zaken dan verduurzaming
      en aannemelijk is dat de kosten voor het advies door die andere zaken aanzienlijk hoger zijn dan wanneer het advies
      slechts op verduurzaming had gezien, waardoor een hogere subsidie is aangevraagd;

      d. de aanvrager een verzoek om een verklaring dat sprake is van een energie-investering als bedoeld in
      [artikel 3.42, eerste lid, van de Wet inkomstenbelasting 2001][ref2] heeft ingediend en daarbij het advies, bedoeld
      in [artikel 4.7.2, eerste lid, onder a][ref3], heeft aangemerkt als de aanschaffings- of voortbrengingskosten ter
      zake van een energie-investering, bedoeld in artikel 3.42, vijfde lid, van de Wet inkomstenbelasting 2001.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.7.2
