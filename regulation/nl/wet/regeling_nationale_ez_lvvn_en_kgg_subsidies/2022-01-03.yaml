  - number: 3.12.8
    text: De minister verdeelt het subsidieplafond voor garantstellingen op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.12.8
  - number: 3.12.9
    text: |-
      De minister beslist afwijzend op een aanvraag voor een garantstelling indien:

      a. de financier geen garantstellingsovereenkomst met de Staat heeft gesloten;

      b. er niet wordt voldaan aan de voorwaarden, bedoeld in artikel 3 van het model garantstellingsovereenkomst zoals
      opgenomen in [bijlage 3.12.1][ref1] respectievelijk [3.12.2][ref2];

      c. de aanvrager eerder tekort is geschoten bij de naleving van verplichtingen op grond van de
      garantstellingsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
      [ref2]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.12.9
    references:
      - id: ref1
        bwb_id: BWBR0035474
      - id: ref2
        bwb_id: BWBR0035474
  - number: 3.12.10
    text: |-
      1 Het tarief van de provisie, bedoeld in [artikel 32, derde lid, van het besluit][ref1], wordt voor de garantie op
      het verstrekte risicokapitaal vastgesteld op een eenmalige provisie van 1 procent van de gegarandeerde waarde van
      dit risicokapitaal en:

      a. 3 procent per jaar van de gegarandeerde waarde van dit risicokapitaal indien de kapitaalverstrekking bestaat
      uit een niet converteerbare achtergestelde lening zonder dat deze gepaard gaat met een kapitaalverstrekking aan
      dezelfde ondernemer door de financier of door een andere financier die deel uitmaakt van dezelfde groep in de vorm
      van een converteerbare achtergestelde lening of aandelenkapitaal; of

      b. 3 procent van de gegarandeerde waarde van dit risicokapitaal, die per kwartaal wordt berekend, in andere
      gevallen.

      2 De minister kan in plaats van het tarief van de provisie, genoemd in het tweede lid, een vergoeding vaststellen,
      indien het tarief van de provisie te laag is in relatie tot het risico dat de Staat loopt.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel32
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.12.10
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '32'
  - number: 3.12.11
    text: |-
      Jaarlijks vindt een evaluatie van de toepassing van deze titel plaats, onder meer ter beoordeling of de inkomsten
      en de uitgaven ingevolge garantstellingen op grond van deze regeling met elkaar in evenwicht zijn.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.12.11
  - number: 3.12.12
    text: |-
      Een aanvraag om een garantstellingovereenkomst als bedoeld in [artikel 3.12.7][ref1], bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het nummer waarmee de onderneming is
      geregistreerd bij de Kamer van Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. kerngegevens over de organisatie, waaronder de funding, de deskundigheid, het financieringsbeleid, het
      financieringsproces, het beheer en het uitwinningsbeleid van risicokapitaal.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.12.7
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.12.12
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.12.7
        hoofdstuk: '3'
  - number: 3.12.13
    text: |-
      De subsidie, bedoeld in [artikel 3.12.2][ref1] bevat geen staatssteun.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.12.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel3.12.13
