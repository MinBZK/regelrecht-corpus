  - number: 2.2.21
    text: |-
      Voor zover de subsidie betrekking heeft op de resterende productieve levensduurfase wordt deze verstrekt aan
      de veehouderijonderneming of veehouderijondernemingen binnen het samenwerkingsverband voor de afschrijving
      van de investeringen, materiële activa van managementmaatregelen of combinatie hiervan, bedoeld in
      [artikel 2.2.10][ref1], in het geval de onderzoeks- en ontwikkelingsfase en emissiemetingenfase, bedoeld
      in [artikel 2.2.2, tweede lid, onderdeel a][ref2], zijn afgerond en hieruit blijkt dat de investeringen,
      managementmaatregelen of combinatie hiervan:

      a. leiden tot brongerichte verduurzaming en verbetering van het dierenwelzijn, waaronder ten minste ook de
      brandveiligheid, op de desbetreffende veehouderijlocatie; en

      b. gebruiksklaar zijn ten behoeve van het gebruik bij de primaire landbouwproductie op de desbetreffende
      veehouderijlocatie.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.10
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.2
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel2.2.21
    references:
      - id: ref1
