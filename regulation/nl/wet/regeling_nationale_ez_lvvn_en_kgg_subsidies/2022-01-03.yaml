  - number: 4.2.72
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een deelnemer in een samenwerkingsverband voor het uitvoeren
      van een systeemintegratieproject.

      2 Een samenwerkingsverband bevat ten minste één onderneming die voor zover het gaat om overige projectactiviteiten
      niet actief is in:

      a. de sector visserij en aquacultuur;

      b. de primaire productie van landbouwproducten; of

      c. de sector verwerking en afzet van landbouwproducten in de gevallen, bedoeld in artikel 1, eerste lid, onder c,
      van de algemene de-minimisverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.72
  - number: 4.2.73
    text: |-
      1 De subsidie bedraagt voor een systeemintegratieproject:

      a. 50% van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek;

      b. 25% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling;

      c. 80% van de subsidiabele kosten voor zover deze betrekking hebben op niet-economische activiteiten van
      onderzoeksorganisaties;

      d. 50% van de subsidiabele kosten, voor zover deze betrekking hebben op overige projectactiviteiten.

      2 De percentages, genoemd in het eerste lid, onderdelen a en b, worden verhoogd met:

      a. 10 procentpunten, indien de aanvrager een middelgrote onderneming is en de subsidiabele kosten worden gemaakt en
      betaald door de middelgrote onderneming; of

      b. 20 procentpunten, indien de aanvrager een kleine onderneming is en de subsidiabele kosten worden gemaakt en
      betaald door de kleine onderneming.

      3 De subsidie bedraagt maximaal € 1.200.000 per systeemintegratieproject.

      4 In afwijking van het derde lid bedraagt de subsidie per systeemintegratieproject dat valt onder programmalijn 2
      (Smart multi-commodity energy system (SMCES)), opgenomen in [bijlage 4.2.10][ref1], ten hoogste € 1.400.000.

      5 Onverminderd het derde lid bedraagt de subsidie, voor zover het overige projectactiviteiten betreft die door
      een onderneming worden uitgevoerd, per onderneming in een samenwerkingsverband ten hoogste het bedrag, bedoeld in
      artikel 3, tweede lid, van de algemene de-minimisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.73
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 4.2.73a
    text: |-
      1 Voor zover de projectactiviteiten bestaan uit industrieel onderzoek of experimentele
      ontwikkeling dan wel niet-economische activiteiten van onderzoeksorganisaties, bedoeld in
      [artikel 4.2.73, eerste lid, onderdelen a en b respectievelijk c][ref1], komen de kosten, bedoeld in artikel 25,
      derde lid, van de algemene groepsvrijstellingsverordening voor subsidie in aanmerking.

      2 Binnenlandse reiskosten komen niet voor subsidie in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.73
