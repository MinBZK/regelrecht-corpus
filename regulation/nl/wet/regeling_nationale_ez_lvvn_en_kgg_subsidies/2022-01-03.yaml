  - number: 4.7.4
    text: |-
      1 [Artikel 10, tweede lid, van het besluit][ref1] is niet van toepassing.

      2 Voor de subsidie, bedoeld in [artikel 4.7.2, eerste lid, onder a][ref2], komen in aanmerking kosten voor een
      advies dat de volgende gegevens bevat:

      a. de datum van opstellen van het advies aan de mkb-onderneming;

      b. de naam en het Kamer van Koophandel-nummer van de energieadviseur of indien van toepassing de energieregisseur;

      c. de naam van de mkb-onderneming en het adres van het bedrijfspand;

      d. een opgave van het energieverbruik van het bedrijfspand en de bedrijfsvoering in aardgasequivalenten en kWh van
      het afgelopen jaar, of, indien de mkb-onderneming minder dan een jaar opereert, van de werkzame maanden, met een
      onderbouwde inschatting van het jaarlijks energieverbruik;

      e. een beschrijving van het jaarlijks energieverbruik, bedoeld onder d, omgerekend naar CO-uitstoot volgens de
      omrekeningswaarden, bedoeld in de tabel in [bijlage 4.7.1][ref3], van het bedrijfspand en van de bedrijfsvoering,
      uitgesplitst naar onderdeel van de bedrijfsvoering;

      f. een beschrijving van de mogelijke verduurzamingsmaatregelen van het bedrijfspand en van de bedrijfsvoering van
      de betreffende mkb-onderneming, die leiden tot de grootste energiebesparing, omgerekend naar CO-uitstoot volgens
      de omrekeningswaarden, bedoeld in de tabel in [bijlage 4.7.1][ref4], of reductie van CO-uitstoot, waarbij rekening
      wordt gehouden met de financiële haalbaarheid van de maatregelen; en

      g. per mogelijke verduurzamingsmaatregel, bedoeld onder f, een beschrijving van de potentiële energiebesparing,
      omgerekend naar CO-uitstoot volgens de omrekeningswaarden, bedoeld in de tabel in [bijlage 4.7.1][ref5], of
      reductie van CO-uitstoot van die maatregel, de kosten voor de maatregel en de verwachte terugverdientijd van de
      maatregel.

      2 Voor de subsidie, bedoeld in [artikel 4.7.2, eerste lid, onder b][ref6], komen in aanmerking kosten voor:

      a. het opstellen van een financieringsplan;

      b. het opstellen van een overzicht van de te nemen stappen;

      c. de ondersteuning bij het aanschaffen en installeren van materialen of diensten;

      d. het opvragen en op geschiktheid beoordelen van offertes;

      e. het aanvragen van één of meer subsidies of andere financieringsmogelijkheden;

      f. het opstellen en uitzetten van een opdracht;

      g. het begeleiden van en toezien op de uitvoering;

      h. het aanvragen van de subsidies, bedoeld in [artikel 4.7.2, eerste lid][ref7].


