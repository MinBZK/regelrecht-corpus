        bwb_id: BWBR0024796
        artikel: '23'
  - number: 4.2.83
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. na toepassing van [artikel 4.2.84., eerste lid][ref1], minder dan 3 punten per criterium zijn toegekend;

      b. eerder op grond van deze titel een subsidie is verstrekt voor een soortgelijk project;

      c. in onvoldoende mate is voorzien in een kwalitatief goede kennisverspreiding;

      d. na toepassing van [artikel 4.2.84., eerste lid][ref2], een project lager is gerangschikt dan een soortgelijk
      project;

      e. de samenwerking onvoldoende evenwichtig is, blijkend uit:

      1°. de verdeling van de kosten tussen de deelnemers, of

      2°. de verhouding tussen private en publieke financiering van het project.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.84
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.84
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.83
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 4.2.84
        hoofdstuk: '4'
        paragraaf: 4.2.12
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 4.2.84
        hoofdstuk: '4'
        paragraaf: 4.2.12
  - number: 4.2.84
    text: |-
      1 De minister kent aan een project een hoger aantal punten toe naarmate:

      a. het project meer bijdraagt aan verduurzaming van de Nederlandse energiehuishouding en maatschappelijk relevanter
      is, binnen de context van [bijlage 4.2.11][ref1];

      b. de slaagkans van de innovatie in de Nederlandse markt en maatschappij groter is;

      c. het project vernieuwender is ten opzichte van de internationale stand van onderzoek of techniek en de
      Nederlandse kennispositie meer versterkt;

      d. de kwaliteit van het project beter is, blijkend uit de uitwerking van aanpak en methodiek, de omgang met
      risico’s, de uitvoerbaarheid, de deelnemende partijen en de mate waarin de beschikbare middelen effectiever en
      efficiënter worden ingezet.

      2 De minister kent per onderdeel van het eerste lid ten minste één en ten hoogste vijf punten toe.

      3 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2022-01-03#Artikel4.2.84
    references:
      - id: ref1
        bwb_id: BWBR0035474
