        bwb_id: BWBR0035474
  - number: 3.20.1
    text: |-
      1 In deze titel wordt verstaan onder:

        - *arbeidsovereenkomst:* een arbeidsovereenkomst als bedoeld in
      [artikel 610 van Boek 7 van het Burgerlijk Wetboek][ref1];
        - *brancheorganisatie:* een vereniging, opgericht voor 1 januari 2020, die belangen behartigt van haar leden,
      bestaande uit ondernemingen die tot eenzelfde bedrijfstak behoren;
        - *ICT- en techniek-kansrijk beroep:* een beroep dat past binnen de in [bijlage 3.20][ref2] opgenomen lijst
      met kansrijke beroepen, dat valt binnen de beroepssegmenten techniek-industrie, techniek-bouw, techniek-auto en
      voertuigtechniek, techniek-installatietechniek of ICT;
        - *opleider:* een natuurlijke persoon of rechtspersoon die zich bij de uitoefening van zijn beroep of bedrijf
      bezighoudt met het geven van scholing;
        - *praktijkbegeleider:* een werknemer die zich bij de uitoefening van zijn beroep namens zijn werkgever bezighoudt
      met het geven van praktijkondersteuning;
        - *werknemer:* werknemer als bedoeld in [artikel 610 van Boek 7 van het Burgerlijk Wetboek][ref3];
        - *werkgever:* werkgever als bedoeld in [artikel 610 van Boek 7 van het Burgerlijk Wetboek][ref4].

      2 In aanvulling op het eerste lid wordt mede verstaan onder:

      a. werknemer: een natuurlijke persoon die voornemens is om in de hoedanigheid van werknemer een arbeidsovereenkomst
      te sluiten;

      b. werkgever: een natuurlijke persoon of rechtspersoon die voornemens is om in de hoedanigheid van werkgever een
      arbeidsovereenkomst te sluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
      [ref2]: https://wetten.overheid.nl/BWBR0035474
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel610
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel610
