  - number: 3.16.1d
    text: |-
      1 De subsidie bedraagt ten hoogste 50 procent van het financieringsbudget, doch ten minste € 1.000.000 en ten
      hoogste € 5.000.000 per subsidieontvanger.

      2 Het resterende financieringsbudget van ten minste 50 procent wordt door provinciale overheden ingebracht.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.16.1d
  - number: 3.16.1e
    text: |-
      De minister beslist afwijzend op een aanvraag:

      a. indien onvoldoende vertrouwen bestaat dat provinciale overheden het resterende financieringsbudget van ten
      minste 50 procent daadwerkelijk inbrengen;

      b. indien een financieringsplan zich onvoldoende aantoonbaar richt op het verstrekken van geldleningen aan MKB-
      ondernemers of innovatieve starters ten behoeve van de financiering van vernieuwingsfase- of vroegefasetrajecten;

      c. indien onvoldoende vertrouwen bestaat dat een financier de capaciteiten heeft voor het verstrekken van
      geldleningen aan MKB-ondernemers of innovatieve starters ten behoeve van vernieuwingsfase- of vroegefasetrajecten
      en voor het beheer hiervan;

      d. indien door een financier onvoldoende de term ‘vroegefasefinanciering’ wordt gehanteerd;

      e. indien een financieringsplan onvoldoende aandacht besteedt aan het converteren van geldleningen gericht op het
      mogelijk maken van vervolgfinanciering;

      f. indien een financieringsplan niet is gebaseerd op de uitgangspunten dat:

      1°. geldleningen die worden verstrekt aan MKB-ondernemers, gelijk zijn aan:

      i. 35 procent van de door een MKB-ondernemer die een middelgrote onderneming in stand houdt, voorziene kosten van
      een vernieuwingstraject, doch ten minste € 50.000 en ten hoogste € 122.500,

      ii. 45 procent van de door een MKB-ondernemer die een kleine onderneming in stand houdt, voorziene kosten van een
      vernieuwingstraject, doch ten minste € 50.000 en ten hoogste € 157.500;

      2°. geldleningen die worden verstrekt aan innovatieve starters, gelijk zijn aan het totaal van de door een
      innovatieve starter voorziene kosten voor een vroegefasetraject, doch ten minste € 50.000 en ten hoogste € 350.000;

      3°. ten aanzien van geldleningen die worden verstrekt aan MKB-ondernemers of innovatieve starters, een rentevoet
      wordt gehanteerd van 5 procent plus referentierente;

      4°. geldleningen die worden verstrekt aan MKB-ondernemers of innovatieve starters, worden terugbetaald in zes
      jaarlijkse termijnen, waarbij de eerste termijn in principe wordt afgelost drie jaar na ingang van de geldlening;

      5°. aan MKB-ondernemers eenmaal of aan innovatieve starters tweemaal een jaar uitstel van de verplichting tot
      aflossing kan worden gegeven;

      6°. bij beslissingen inzake het verstrekken van geldleningen aan MKB-ondernemers of innovatieve starters rekening
      wordt gehouden met het advies van een nader in te stellen onafhankelijk comité;

      7°. geldleningen slechts worden verstrekt aan MKB-ondernemers of innovatieve starters waarvan de rentabiliteits- en
      continuïteitsperspectieven ten minste redelijk zijn;

      8°. geldleningen slechts worden verstrekt ten behoeve van financiering van vernieuwingsfase- of vroegefasetrajecten
      waarvan aannemelijk is dat een traject binnen 24 maanden is afgerond;

      9°. geldleningen aan MKB-ondernemers of innovatieve starters worden verstrekt gedurende een periode van ten hoogste
      drie jaar;

      10°. de totale kosten die een financier maakt in verband met de verstrekking van geldleningen aan MKB-ondernemers
      of innovatieve starters, ten hoogste 17 procent bedragen van het financieringsbudget;

      g. indien aan een financier voor het verstrekken van geldleningen aan MKB-ondernemers of innovatieve starters ten
      behoeve van de financiering van vernieuwingsfase- of vroegefasetrajecten minder dan drie jaar geleden al subsidie
      is verstrekt; uitgezonderd is een aanvraag voor een tussentijdse ophoging van het financieringsbudget;

      h. indien met de uitvoering van het financieringsplan is begonnen voor de datum van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.16.1e
  - number: 3.16.1f
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.16.1f
  - number: 3.16.1g
    text: |-
      1 De financier is aan de Staat uitsluitend verschuldigd:

      a. 50 procent van de rente die op de rekening is aangewassen en te eniger tijd is bijgeschreven, en van de lopende
      rente bij beëindiging van de rekening; en

      b. 50 procent van alle opbrengsten die hij ontvangt uit de verstrekking van geldleningen aan MKB-ondernemers of
      innovatieve starters.

      2 Het percentage, bedoeld in het eerste lid, onderdelen a en b, wordt naar rato verlaagd, indien de geldlening
      minder dan 50 procent van het financieringsbudget uitmaakt.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.16.1g
  - number: 3.16.1h
    text: |-
      1 De door de financier te maken kosten in verband met de verstrekking van geldleningen aan MKB-ondernemers of
      innovatieve starters komen voor 50 procent voor rekening van de Staat en kunnen worden verrekend met de geldlening.

      2 Het percentage, bedoeld in het eerste lid, wordt naar rato verlaagd, indien de geldlening minder dan 50 procent
      van het financieringsbudget uitmaakt.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.16.1h
  - number: 3.16.1i
    text: |-
      De subsidieverlening vindt plaats onder de opschortende voorwaarde dat de uitvoeringsovereenkomst die bij de
      beschikking tot verlening van de subsidie is gevoegd en uit hoofde waarvan de geldlening wordt verstrekt, binnen
      acht weken na die beschikking is ondertekend door de financier.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.16.1i
  - number: 3.16.2
    text: |-
      1 De minister verstrekt op aanvraag een subsidie in de vorm van een subsidie met een terugbetalingsverplichting als
      bedoeld in [artikel 42 van het besluit][ref1] aan een MKB-ondernemer, niet zijnde een MKB-ondernemer die werkzaam
      is in de visserij- en aquacultuursector, ten behoeve van de financiering van een vernieuwingsfasetraject.

      2 Bij zijn aanvraag legt de MKB-ondernemer een verklaring van een toekomstige investeerder over die is opgesteld
      overeenkomstig het model dat in [bijlage 3.16.1][ref2] is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.16.2
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0035474
  - number: 3.16.3
    text: |-
      1 De subsidie bestaat uit een geldlening voor een bedrag gelijk aan:

      a. 35 procent van de door de MKB-ondernemer die een middelgrote onderneming in stand houdt voorziene kosten van het
      vernieuwingsfasetraject doch ten hoogste € 122.500;

      b. 45 procent van de door de MKB-ondernemer die een kleine onderneming in stand houdt voorziene kosten van het
      vernieuwingsfasetraject doch ten hoogste € 157.500.

      2 De kosten gemaakt door de MKB-ondernemer als natuurlijke persoon worden berekend door het aantal uren dat hij ten
      behoeve van het vernieuwingstraject heeft gemaakt te vermenigvuldigen met een vast uurtarief van € 35.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.16.3
  - number: 3.16.3a
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1] bedraagt 24 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.16.3a
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.16.4
    text: |-
      De minister beslist afwijzend op een aanvraag:

      a. indien het vernieuwingsfasetraject geen experimentele ontwikkeling vormt;

      b. indien aannemelijk is dat de MKB-ondernemer de financiering waarvoor de aanvraag is ingediend zelf heeft of kan
      verkrijgen bij anderen;

      c. indien onvoldoende aannemelijk is dat de toekomstige investeerder aan de hand van het vernieuwingsfaseplan het
      plan heeft opgevat de MKB-ondernemer te financieren of de toekomstige investeerder daar naar verwachting niet toe
      in staat zal zijn;

      d. voor zover de begrote kosten van het vernieuwingsfasetraject hoger zijn dan € 350.000 of

      1°. lager zijn dan € 142.000 indien de MKB-ondernemer een middelgrote onderneming in stand houdt, of

      2°. lager zijn dan € 110.000 indien de MKB-ondernemer een kleine onderneming in stand houdt;

      e. indien onvoldoende vertrouwen bestaat dat de MKB-ondernemer een vernieuwingsfasetraject in uitvoeringstechnische
      zin zo zal kunnen voltooien dat hij financiering voor de fase na het vernieuwingsfasetraject zal kunnen verkrijgen
      van de toekomstige investeerder;

      f. indien onvoldoende vertrouwen bestaat dat de MKB-ondernemer de geldlening bedoeld in
      [artikel 3.16.2, eerste lid][ref1], kan terugbetalen;

      g. indien voor het vernieuwingsfasetraject reeds door de minister subsidie is verstrekt;

      h. indien voor het vernieuwingsfasetraject een geldlening bij een financier kan worden aangevraagd;

      i. indien met de uitvoering van het vernieuwingsfasetraject is begonnen voor de datum van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.16.2
