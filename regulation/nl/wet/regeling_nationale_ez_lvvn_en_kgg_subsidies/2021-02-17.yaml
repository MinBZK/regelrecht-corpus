  - number: 3.22.6
    text: |-
      1 De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate:

      a. het kennisoverdrachtplan meer gebaseerd is op een helder afgebakend thema, waar de meest relevante en excellente
      onderzoeksgroepen van de onderzoeksorganisaties binnen het thema aan verbonden zijn en het plan meer bijdraagt aan
      het realiseren van oplossingen voor maatschappelijke vraagstukken en het creëren van economische impact;

      b. het thematisch consortium respectievelijk de onderzoeksorganisaties in het TTT-samenwerkingsverband meer
      in verbinding staat of staan met andere onderzoeksorganisaties of kennisinstellingen, kennisstarters, andere
      ondernemingen, investeerders en maatschappelijke organisaties rondom het thema;

      c. het aannemelijker is dat de in het kennisoverdrachtplan beschreven activiteiten bijdragen aan kennisoverdracht
      en met name het ontstaan van kennisstarters waarin onder andere door het thematisch technology transferfonds in het
      TTT-samenwerkingsverband met risicokapitaal geïnvesteerd kan worden;

      d. de kwaliteit van de uitvoering van het kennisoverdrachtplan hoger is, mede gelet op de samenstelling,
      competenties en het netwerk van het team dat het plan feitelijk uitvoert;

      e. het thematisch technology transferfonds meer kan steunen op relevante ervaring en deskundigheid;

      f. het fondsplan meer bijdraagt aan de opbouw van succesvolle kennisstarters; en

      g. het fondsplan doelmatiger is ingericht.

      2 Voor de rangschikking wegen de in het eerste lid vermelde criteria even zwaar.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.22.6
  - number: 3.22.7
    text: |-
      1 Een aanvraag voor subsidie op grond van deze titel bevat ten minste:

      a. gegevens over de subsidieaanvragers, waaronder de namen van de organisaties, de nummers waarmee de ondernemingen
      zijn geregistreerd bij de Kamer van Koophandel, de post- en bezoekadressen en de rekeningnummers;

      b. gegevens over het thematisch technology transferfonds als bedoeld in artikel 6, tweede lid, van de algemene
      groepsvrijstellingsverordening;

      c. gegevens over de contactpersoon bij de penvoerder, waaronder de naam, het telefoonnummer, het e-mailadres en
      het postadres;

      d. een thematisch technology transferplan, bestaande uit een kennisoverdrachtplan en een fondsplan met dezelfde
      thematische focus, en een omschrijving van de samenhang tussen deze twee plannen;

      e. de gegevens en onderbouwing van het thematisch technology transferplan, waaronder de start- en einddata, de
      begrotingen en de omvang van de gevraagde subsidie;

      f. de de-minimisverklaring(en) van de fondspartij(en), ten behoeve van de subsidie voor de activiteiten, bedoeld in
      [artikel 3.22.2, vierde lid, onderdeel b][ref1].

      2 Indien een subsidieaanvrager een thematisch consortium is, bevat de aanvraag voor subsidie tevens:

      a. de gegevens, bedoeld in het eerste lid, onderdeel a, van de onderzoeksorganisaties die het thematisch consortium
      hebben opgericht; en

      b. de statuten van het thematisch consortium.

      3 Een kennisoverdrachtplan is een plan van het thematisch consortium respectievelijk de onderzoeksorganisaties
      in het TTT-samenwerkingsverband, dat bestaat uit een samenhangend geheel van activiteiten die kennisoverdracht
      bevorderen rondom een thema en dat een looptijd heeft van ten minste vijf jaar.

      In het kennisoverdrachtplan is tevens opgenomen hoe wordt omgegaan met het verwerven en overdragen van rechten van
      intellectueel eigendom en het verlenen van gebruiksrechten en, in geval het TTT-samenwerkingsverband bestaat uit
      een thematisch technology transferfonds en drie of meer onderzoeksorganisaties, hoe de onderzoeksorganisaties de
      daadwerkelijke samenwerking zullen inrichten.

      4 Een fondsplan is een plan van het thematisch technology transferfonds tot uitvoering van een met elkaar
      samenhangend geheel van activiteiten, die bestaan uit het verkrijgen, behouden en beëindigen van participaties en
      het begeleiden van de kennisstarters.

      5 De ontvangers van de subsidie voor de activiteiten, bedoeld in [artikel 3.22.2, derde lid][ref2], dienen
      uiterlijk 12 weken voorafgaand aan een nieuwe projectjaar een jaarplan in, dat een nadere beschrijving bevat
      van de subsidiabele activiteiten die gedurende het daarop volgende jaar worden verricht ter uitvoering van het
      kennisoverdrachtplan, inclusief een jaarbegroting.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.22.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.22.2
