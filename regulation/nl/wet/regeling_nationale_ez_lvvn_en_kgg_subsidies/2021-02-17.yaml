  - number: 2.10.4
    text: |-
      1 De subsidie bedraagt:

      a. 30% van de subsidiabele kosten voor een grote onderneming, of

      b. 40% van de subsidiabele kosten voor een middelgrote of kleine onderneming, doch ten hoogste € 1.500.000.

      2 In afwijking van het eerste lid, onderdeel a, bedraagt de subsidie 40% van de subsidiabele kosten voor een grote
      onderneming in het geval dat de subsidiabele kosten worden berekend op grond van de berekenmethode, bedoeld in
      artikel 41, zesde lid, onderdeel a of b, van de algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.10.4
  - number: 2.10.5
    text: |-
      1 De subsidiabele kosten zijn uitsluitend:

      a. de bijkomende investeringskosten ten behoeve van energie-efficiëntiemaatregelen, bedoeld in artikel 38, derde
      lid, van de algemene groepsvrijstellingsverordening, of

      b. de bijkomende investeringskosten ter bevordering van energie uit hernieuwbare energiebronnen, bedoeld in artikel
      41, zesde lid, van de algemene groepsvrijstellingsverordening.

      2 De subsidiabele kosten, bedoeld in het eerste lid, onderdelen a en b, worden berekend in overeenstemming met
      artikel 38, derde lid, respectievelijk 41, zesde lid, van de algemene groepsvrijstellingsverordening.

      3 De volgende kosten komen niet voor subsidie in aanmerking:

      a. kosten voor grondaankoop;

      b. kosten verbonden aan het verrichten van haalbaarheidsstudies;

      c. kosten voor een warmtekrachtkoppelingsinstallatie die gebruik maakt van tropische oliën of tropische biomassa,
      voor zover niet voorzien van duurzaamheidscertificaten, en

      d. kosten voor in de glastuinbouwsector gangbare investeringen.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.10.5
  - number: 2.10.6
    text: |-
      1 De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.

      2 De minister rangschikt aanvragen van subsidie voor kassen en kasenergiesystemen als bedoeld in
      [artikel 2.10.2, eerste lid][ref1], hoger naarmate deze investering naar het oordeel van de minister:

      a. meer bijdraagt aan klimaat-neutrale glastuinbouw door:

      1°. een zo laag mogelijk gebruik van primaire energie, en

      2°. een zo laag mogelijke CO-uitstoot;

      b. meer bijdraagt aan de kennisontwikkeling in de glastuinbouwsector;

      c. meer technisch, teelttechnisch en economisch perspectief heeft, en

      d. gericht is op teelt-technisch of economisch inpasbare systemen die een hoger niveau van ontwikkeling of
      doorontwikkeling vertegenwoordigen.

      3 Onverminderd het tweede lid rangschikt de minister aanvragen van subsidie als bedoeld in
      [artikel 2.10.2, eerste lid][ref2], hoger voor zover deze aanvraag een investering in een kas betreft.

      4 Indien blijkt dat het totale bedrag van de te verlenen subsidies voor projecten als bedoeld in
      [artikel 2.3.2, eerste lid][ref3], lager is dan het daarvoor vastgestelde subsidieplafond, wordt het overblijvende
      bedrag zo nodig aan het subsidieplafond voor projecten als bedoeld in [artikel 2.10.2, eerste lid][ref4],
      toegevoegd.


