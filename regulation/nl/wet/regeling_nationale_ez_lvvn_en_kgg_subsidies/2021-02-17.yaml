  - number: 3.8.9
    text: |-
      De minister beslist afwijzend op een aanvraag:

      a. indien van het innovatieproject onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten zijn;

      b. afkomstig van een overheid of overheidsinstelling, tenzij het een onderzoeksorganisatie betreft;

      c. indien, in het geval van een Global Stars-innovatieproject, aannemelijk is dat het Global Stars-innovatieproject
      geen doorgang kan vinden om redenen die samenhangen met andere omstandigheden in de andere deelnemende landen van
      het Global Stars-innovatieproject of met financiële of technische problemen van een van de deelnemende partijen in
      een ander deelnemend land.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.8.9
  - number: 3.8.10
    text: |-
      1 De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate:

      a. een innovatieproject meer bijdraagt aan technologische vernieuwing of wezenlijk nieuwe toepassingen van een
      bestaande technologie;

      b. de bijdrage aan de doelmatigheid en doeltreffendheid van een innovatieproject, de nieuwheid van een
      samenwerkingsverband en de betrokkenheid van onderzoeksorganisaties groter zijn;

      c. de projectresultaten meer economische waarde creëren voor Nederland;

      d. meer wordt aangesloten bij de doelstellingen van de deelnemende ondernemingen en de toepassingsmogelijkheden van
      de projectresultaten uitgebreider zijn.

      2 Voor de rangschikking wegen de in het eerste lid vermelde criteria even zwaar.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.8.10
  - number: 3.8.11
    text: |-
      Voor EUREKA-netwerkprojecten brengen de subsidieontvangers, in afwijking van [artikel 39 van het besluit][ref1]
      gezamenlijk steeds na afloop van een periode van zes maanden aan de minister schriftelijk verslag uit omtrent de
      uitvoering van EUREKA-netwerkprojecten met inbegrip van een vergelijking van die uitvoering met het projectplan en
      de bij de beschikking tot subsidieverlening vermelde raming van de subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel39
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.8.11
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '39'
  - number: 3.8.12
    text: |-
      1 De subsidieontvanger verleent medewerking aan een evaluatieonderzoek van de effecten van het door hem uitgevoerde
      innovatieproject, voor zover deze medewerking redelijkerwijs van hem kan worden verlangd.

      2 De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de dag waarop subsidie wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.8.12
  - number: 3.8.13
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 3.8.2][ref1] bevat ten minste de gegevens, bedoeld in artikel
      6, tweede lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie als bedoeld in [artikel 3.8.2][ref2] ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het nummer waarmee de onderneming is
      geregistreerd bij de Kamer van Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. de gegevens over het plan, waaronder de activiteit waarvoor subsidie wordt aangevraagd, de start- en einddatum,
      de totale kosten en de omvang van de gevraagde subsidie.

      3 De aanvraag voor de vaststelling van een subsidie als bedoeld in [artikel 3.7.2][ref3] bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de aanvrager en het door de minister verstrekte
      referentienummer;

      b. de omvang van de vast te stellen subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.8.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.8.2
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.7.2
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.8.13
