  - number: 2.2.16
    text: |-
      Voor de emissiemetingenfase bedraagt de subsidie 100% van de subsidiabele kosten, doch ten hoogste € 200.000 per
      veehouderijlocatie in een innovatieproject.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.2.16
  - number: 2.2.17
    text: |-
      Voor de emissiemetingenfase komen voor subsidie uitsluitend in aanmerking de kosten, bedoeld in artikel 31, zesde
      lid, van de groepsvrijstellingsverordening landbouw.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.2.17
  - number: 2.2.18
    text: |-
      De minister beslist afwijzend op een aanvraag om subsidie als bedoeld in [artikel 2.2.6][ref1], indien de
      subsidiabele activiteiten voor de emissiemetingenfase niet van belang zijn voor alle veehouderijondernemingen die
      in de betrokken specifieke landbouwsector of subsector actief zijn als bedoeld in artikel 31, tweede lid, van de
      algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.6
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.2.18
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.2.6
        hoofdstuk: '2'
        paragraaf: 2.2.2
  - number: 2.2.19
    text: |-
      1 Voor het meten van het effect van de investeringen en managementmaatregelen, bedoeld in [artikel 2.2.15][ref1],
      maakt de onderzoeksorganisatie gebruik van meetprotocollen die voldoen aan de internationale stand van onderzoek
      of techniek.

      2 Voorafgaand aan de datum waarop de subsidiabele activiteiten aanvangen, maakt de onderzoeksorganisatie de
      informatie, bedoeld in artikel 31, derde lid, van de groepsvrijstellingsverordening landbouw, bekend op het
      internet.

      3 De onderzoeksorganisatie stelt de resultaten van de subsidiabele activiteiten overeenkomstig artikel 31, vierde
      lid, van de groepsvrijstellingsverordening landbouw, op het internet beschikbaar:

      a. vanaf de datum waarop deze subsidiabele activiteiten zijn afgerond; of

      b. vanaf de datum waarop informatie over deze resultaten aan leden van specifieke organisaties wordt gegeven.

      4 De resultaten blijven op het internet beschikbaar gedurende ten minste vijf jaar nadat de subsidiabele
      activiteiten zijn afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.15
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.2.19
