  - number: 4.5.7
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.5.7
  - number: 4.5.8
    text: |-
      1 Indien de aanvraag voor subsidie is ingediend door een rechtspersoon of door een natuurlijke persoon, niet zijnde
      eigenaar-bewoner, is de termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1]:

      a. één jaar, indien het een investering voor de productie van duurzame energie als bedoeld in
      [artikel 4.5.2, tweede lid][ref2], betreft;

      b. twee jaar, indien het een investering voor een centrale aansluiting als bedoeld in
      [artikel 4.5.2, vierde lid, onder b][ref3], betreft.

      2 Geen subsidie wordt verstrekt voor een investering van een eigenaar-bewoner, indien de investering nog niet is
      geïnstalleerd, aangebracht of aangesloten op het moment van indiening van de subsidieaanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.2
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.2
