  - number: 3.9.15
    text: |-
      Deze titel vervalt met ingang van 1 juli 2024, met dien verstande dat deze van toepassing blijft op subsidies die
      voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.9.15
  - number: 3.10.1
    text: |-
      1 In deze titel wordt verstaan onder:

        - *achtergestelde vordering:* vordering van een startersfonds ten laste van een technostartersvennootschap:
      a. die het startersfonds heeft verkregen door in het kader van een participatie aan de
      technostartersvennootschap geld ter leen te verstrekken; b. die met instemming van de crediteur een
      lagere rang inneemt dan alle andere, niet achtergestelde vorderingen op de debiteur als bedoeld in
      [artikel 277, tweede lid, van Boek 3 van het Burgerlijk Wetboek][ref1]; c. waarop de debiteur krachtens een daartoe
      strekkende bepaling in de akte van geldlening eerst verplicht is rente en aflossing te betalen nadat alle andere
      op dat moment bestaande niet achtergestelde vorderingen op de debiteur zijn voldaan; d. terwijl ingevolge de
      vorenbedoelde akte van geldlening de crediteur afstand heeft gedaan van alle rechten tot verrekening van de rente
      en aflossing;
        - *beheerskosten:* alle kosten die een startersfonds maakt voor het verkrijgen, behouden en beëindigen van
      participaties, met inbegrip van de kosten van begeleiding van technostartersvennootschappen, uitgezonderd de
      verkrijgingprijs van de participaties;
        - *converteerbare lening:* geldlening, steeds resulterend in een achtergestelde vordering, van het startersfonds
      aan een technostartersvennootschap die door het startersfonds geconverteerd kan worden in aandelen in het kapitaal
      van de technostartersvennootschap;
        - *desinvesteringsperiode:* periode waarbinnen het startersfonds de participaties vervreemdt of overdraagt;
        - *eerste commerciële verkoop:* eerste verkoop door een onderneming op een product- of dienstenmarkt, met
      uitsluiting van beperkte verkopen om de markt te testen;
        - *eHealth technostarter:* technostarter wiens onderneming producten, processen of diensten verkoopt en
      levert, die zijn gebaseerd op een nieuwe technische of creatieve vinding of een nieuwe toepassing van bestaande
      technologie onderscheidenlijk van een bestaande creatieve vinding onder meer op het gebied van ICT om gezondheid en
      gezondheidszorg te ondersteunen of te verbeteren, en die bijdragen aan zelfregie, zelfredzaamheid of zelfzorg van
      de patiënt;
        - *eigen bijdragen:* particuliere geldelijke middelen die direct of indirect door de fondspartijen in een
      startersfonds zijn ingebracht en die door het startersfonds daadwerkelijk zijn of worden gebruikt voor het
      verkrijgen van participaties;
        - *fondsbeheerder:* feitelijke uitvoerder van een fondsplan, zijnde het startersfonds of een door het startersfonds
      daartoe gecontracteerde derde;
        - *fondspartij:* investeerder die eigen bijdragen inbrengt in een startersfonds en die tevens samen met de andere
      fondspartijen als direct of indirect aandeelhouder, hoofdelijk aansprakelijk vennoot, lid of oprichter een belang
      heeft in het startersfonds;
        - *fondsperiode:* de periode bestaande uit de investeringsperiode en de desinvesteringsperiode, welke periodes
      gezamenlijk gelijk staan aan de looptijd van de lening van de Staat aan het startersfonds;
        - *fondsplan:* plan van een startersfonds tot uitvoering van een met elkaar samenhangend geheel van activiteiten
      die bestaan uit het verkrijgen, beheren en beëindigen van participaties en het begeleiden van de desbetreffende
      technostartersvennootschappen;
        - *informal investor:* een particulier die, al dan niet via een kapitaalvennootschap waarvan hij enig aandeelhouder
      is, voor eigen rekening en risico participeert en investeert in ondernemingen;
        - *inkomsten:* alle op geld waardeerbare voordelen die een startersfonds heeft verkregen uit een participatie,
      waaronder dividend, rente, aflossingen, opties, de prijs waartegen de participatie is vervreemd, de prijs waartegen
      de participatie door de technostartersvennootschap is ingekocht of terugbetaald en de liquidatie-uitkering;
        - *investeringsbudget:* geldelijke middelen die een startersfonds beschikbaar heeft of zal hebben en die bestemd
      zijn om de verkrijgingprijs van participaties te voldoen, bestaande uit de optelsom van de eigen bijdragen en het
      maximale bedrag van de geldlening, bedoeld in [artikel 3.10.2, derde lid][ref2];
        - *investeringsperiode:* periode gedurende welke een startersfonds activiteiten verricht ter verkrijging van nieuwe
      participaties;
        - *participatie:* risicokapitaal in de vorm van: a. aandelen in het kapitaal van een technostartersvennootschap
      die het startersfonds rechtstreeks van de technostartersvennootschap heeft verkregen tegen volstorting van
      die aandelen in geld, of door omzetting van een converteerbare lening, b. aandelen in het kapitaal van een
      technostartersvennootschap als bedoeld onder a in combinatie met een achtergestelde vordering, of c. een uit een
      converteerbare lening voortvloeiende achtergestelde vordering;
        - *referentierente:* referentiepercentage als bedoeld in de Mededeling van de Commissie over de herziening van de
      methode waarmee de referentie- en disconteringspercentages worden vastgesteld (PbEU 2008, C14), zoals laatstelijk
      vastgesteld voor Nederland, en vermeerderd met 4 procentpunt;
        - *risicokapitaal:* risicofinancieringsinvestering als bedoeld in artikel 21, vierde lid, van de algemene
      groepsvrijstellingsverordening;
        - *startersfonds:* a. kapitaalvennootschap, vennootschap met een afgescheiden vermogen, of rechtspersoon met
      een afgescheiden vermogen niet zijnde een vennootschap, ingericht naar het recht van één van de lidstaten van de
      Europese Unie; b. die blijkens de akte waarbij zijn statuten zijn vastgesteld of blijkens de overeenkomst waarbij
      hij is ingesteld, uitsluitend tot doel heeft het verstrekken van risicokapitaal aan technostartersvennootschappen
      teneinde winst te behalen, en c. waarin ten minste drie fondspartijen deelnemen respectievelijk samenwerken
      zonder dat twee of drie van hen tot dezelfde groep behoren en zonder dat één van hen een economisch of juridisch
      meerderheidsbelang in het fonds heeft;
        - *technostarter*: rechtspersoon die een onderneming drijft die: a. ten tijde van de eerste participatie op
      grond van deze titel minder dan zeven jaar na haar eerste commerciële verkoop actief is op een producten- of
      dienstenmarkt; b. voldoet aan de definitie van niet-beursgenoteerde kmo, bedoeld in artikel 2, onderdelen 2 en 76,
      en bijlage I van de algemene groepsvrijstellingsverordening; en c. hetzij voor eigen rekening en risico producten,
      processen of diensten – niet zijnde adviezen – verkoopt en levert, die zijn gebaseerd op een nieuwe technische
      vinding of een nieuwe toepassing van bestaande technologie, d. hetzij deel uitmaakt van één van de creatieve
      sectoren en voor eigen rekening en risico producten, processen of diensten – niet zijnde adviezen – verkoopt en
      levert, die zijn gebaseerd op een nieuwe creatieve vinding of op een nieuwe toepassing van een bestaande creatieve
      vinding;
        - *technostartersvennootschap:* een technostarter die a. een onderneming drijft in de vorm van een
      kapitaalvennootschap of in de vorm van een vennootschap met een afgescheiden vermogen waarin door een startersfonds
      een participatie verkregen kan worden, en b. zijn primaire bedrijfsactiviteiten in Nederland uitvoert, behoudens
      voor zover de onderneming behoort tot de economische sectoren van landbouw, visserij, aquacultuur of scheepsbouw of
      tot de EGKS-sectoren;
        - *verkrijgingprijs:* deel van het investeringsbudget waarvoor een startersfonds een participatie heeft verkregen.

      2 Voor de toepassing van deze titel wordt als financier aangewezen een startersfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel277
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.10.2
