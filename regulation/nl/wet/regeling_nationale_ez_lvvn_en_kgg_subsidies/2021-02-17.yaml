        artikel: 2.2.10
        hoofdstuk: '2'
        paragraaf: 2.2.2
  - number: 2.2.26
    text: |-
      Voor zover de subsidie betrekking heeft op de activiteiten, bedoeld in [artikel 2.2.21][ref1], bevat deze
      staatssteun en wordt deze gerechtvaardigd door artikel 14 van de groepsvrijstellingsverordening landbouw.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.21
