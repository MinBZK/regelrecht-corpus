      1 Een aanvraag voor subsidie als bedoeld in [artikel 2.10.2, eerste lid][ref1], bevat ten minste de gegevens,
      bedoeld in artikel 6, tweede lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidieverlening ten minste:

      a. gegevens over de aanvrager, waaronder het nummer waaronder de onderneming geregistreerd is bij de Kamer van
      Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres, en

      c. een begroting waarin de totale kosten van het project en de omvang van de gevraagde subsidie zijn opgenomen.

      3 De aanvraag tot subsidieverlening gaat vergezeld van:

      a. een technische beschrijving en onderbouwing van de te subsidiëren activiteiten waaruit blijkt dat:

      1°. de investering zal leiden tot energie-efficiëntie of de productie van energie uit hernieuwbare energiebronnen;

      2°. indien de investering op een kas betrekking heeft, de kas voldoet aan de eisen, bedoeld in
      [artikel 2.10.3, eerste lid, onderdeel a][ref2];

      3°. de investering, indien deze op een kasenergiesysteem betrekking heeft, zal leiden tot de te bereiken CO-
      reductie en primaire energiereductie, bedoeld in [artikel 2.10.3, eerste lid, onderdeel b][ref3];

      b. een nader gespecificeerde begroting van:

      1°. de bijkomende investeringskosten, bedoeld in [artikel 2.10.5, eerste lid, onderdelen a en b][ref4];

      2°. de totale investeringskosten;

      c. offertes behorend bij de investeringskosten, bedoeld in onderdeel b;

      d. een jaarafrekening van de energieleverancier aan de betrokken glastuinbouwonderneming over het meest recente
      jaar;

      e. een onderbouwing waaruit blijkt hoe de investering, bedoeld in [artikel 2.10.2, eerste lid][ref5], wordt
      gefinancierd, en

      f. voor zover van toepassing, de aanvragen voor bescheiden, zoals aanvragen voor vergunningen, waaruit blijkt dat
      de activiteiten waar de aanvraag tot subsidieverlening betrekking op heeft, uitgevoerd worden met inachtneming van
      de wettelijke voorschriften die daarop van toepassing zijn.

      4 De aanvraag tot subsidievaststelling bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de aanvrager en het door de minister verstrekte
      referentienummer;

      b. de omvang van de vast te stellen subsidie, en

      c. de onderbouwing van het vast te stellen subsidiebedrag.

      5 Onverminderd [artikel 50, tweede lid, van het besluit][ref6] gaat de aanvraag tot subsidievaststelling vergezeld
      van:

      a. een bewijs dat het energiesysteem of de kas waarvoor subsidie is aangevraagd, in gebruik is, respectievelijk
      zijn genomen, en

      b. een jaarafrekening van de energieleverancier aan de betrokken glastuinbouwonderneming over het meest recente
      jaar.

      6 De subsidieontvanger verleent tot drie jaar na de subsidievaststelling desgevraagd medewerking aan:

      a. een door de minister geëntameerd onderzoek, of

      b. voorlichting in het kader van het energietransitie-programma Kas als Energiebron.


