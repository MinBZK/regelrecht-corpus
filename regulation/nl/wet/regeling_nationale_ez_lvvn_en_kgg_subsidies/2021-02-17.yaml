  - number: 3.25.1
    text: |-
      1 Voor de toepassing van deze titel wordt als financier aangewezen een bank en een ingevolge
      [artikel 3.11.1, eerste lid][ref1], door de minister aangewezen kredietverstrekker.

      2 Voor de toepassing van [artikel 3.25.2, vierde lid][ref2], wordt als financier aangewezen een kredietinstelling
      in de zin van de [Wet financiële markten BES][ref3] die op grond van die wet bevoegd is in Bonaire,
      Sint Eustatius of Saba het bedrijf van kredietinstelling uit te oefenen en een door de minister ingevolge
      [artikel 3.11.1, tweede lid][ref4], aangewezen, op Bonaire, Sint Eustatius of Saba gevestigde, kredietverstrekker.

      3 In deze titel wordt verstaan onder:

        - *financier-gelieerde:* een rechtspersoon waaraan een financier direct of indirect meer dan de helft van het
      geplaatste kapitaal verschaft of voor het handelen waarvan een financier volledig aansprakelijk is;
        - *winst:* winst uit een onderneming, zijnde het bedrag van de gezamenlijke voordelen die, onder welke naam en in
      welke vorm ook, worden verkregen uit een onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.11.1
