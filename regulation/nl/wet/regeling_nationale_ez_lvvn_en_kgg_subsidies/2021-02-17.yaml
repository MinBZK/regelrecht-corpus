    text: |-
      In deze paragraaf wordt verstaan onder:

        - *MOOI-project:* samenhangend geheel van activiteiten dat past binnen de in [bijlage 4.2.6][ref1] opgenomen
      beschrijving, bestaande uit: a. industrieel onderzoek of experimentele ontwikkeling, met uitzondering van
      pilotactiviteiten; of b. overige projectactiviteiten;
        - *overige niet-economische projectactiviteiten van onderzoeksorganisaties:* overige projectactiviteiten,
      onafhankelijk uitgevoerd door onderzoeksorganisaties en in de boekhouding van deze organisaties opgenomen als niet-
      economische activiteiten;
        - *overige projectactiviteiten:* activiteiten die bijdragen aan het doel van een MOOI-project, niet zijnde
      fundamenteel onderzoek, industrieel onderzoek, experimentele ontwikkeling of een haalbaarheidsstudie;
        - *pilotactiviteiten:* activiteiten bestaande uit een vorm van experimentele ontwikkeling waarbij een experimenteel
      prototype product, procedé of dienst wordt getest in een omgeving die representatief is voor het functioneren onder
      reële omstandigheden, met als hoofddoel verdere technische verbeteringen aan te brengen aan producten, procedés of
      diensten die niet grotendeels vaststaan;
        - *vooraanmelding:* vooraanmelding als bedoeld in [artikel 21 van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035474
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel21
