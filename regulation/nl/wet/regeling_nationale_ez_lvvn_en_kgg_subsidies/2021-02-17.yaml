  - number: B3.25.1:1
    text: |-
      1 De begrippen die in het [Kaderbesluit nationale EZ-subsidies][ref1] en [artikel 1.1][ref2] en
      [paragraaf 3.25][ref3] van de Regeling nationale EZK- en LNV-subsidies zijn gedefinieerd hebben in deze
      overeenkomst de in deze regelingen gegeven betekenis.

      2 Voorts wordt in deze overeenkomst verstaan onder:

      a. *financier-gelieerde:* een rechtspersoon waaraan de Financier direct of indirect meer dan de helft van het
      geplaatste kapitaal verschaft of voor het handelen waarvan de Financier volledig aansprakelijk is, en die als
      Financier-gelieerde is vermeld in artikel 18 van deze overeenkomst;

      b. *garantstellingskrediet:* krediet of een deel van een krediet dat overeenkomstig artikel 5 is gemeld;

      c. *krediet:* bedrag dat de Financier uit hoofde van een kredietovereenkomst verstrekt of zal verstrekken;

      d. *kredietovereenkomst:* overeenkomst uit hoofde waarvan:

      1°. de Financier aan een MKB-ondernemer geld ter leen verstrekt of zal verstrekken, of

      2°. de MKB-ondernemer tot een bepaald bedrag trekt of zal kunnen trekken op de Financier, of

      3°. de Financier tegenover een derde, niet zijnde een rechtspersoon waarmee de Financier in een groep verbonden
      is of een Financier-gelieerde, onherroepelijk een verplichting is aangegaan om ten laste van de MKB-ondernemer aan
      de derde een of meer betalingen te doen, welke verplichting niet afhankelijk is van voorwaarden op de vervulling
      waarvan het handelen van de Financier van invloed is;

      e. *minister:* de Minister van Economische Zaken en Klimaat;

      f. *uitwinning:*

      1°. uitwinning door de Financier, naar normaal bankgebruik, van de door de MKB-ondernemer aan de Financier
      verstrekte zekerheden;

      2°. onderhandse verkoop met toestemming van de Financier door de MKB-ondernemer van de vermogensbestanddelen van de
      MKB-ondernemer, inning van vorderingen daaronder begrepen; en

      3°. executoriale verkoop van de vermogensbestanddelen van de MKB-ondernemer;

      4°. indien het faillissement van de MKB-ondernemer is uitgesproken of aan hem surseance van betaling is verleend
      (of een andere insolventieprocedure onder de [Faillissementswet][ref4] op hem wordt toegepast), de onderhandse of
      executoriale verkoop van de vermogensbestanddelen van de MKB-ondernemer door of met medewerking van de curator of
      de bewindvoerder.


