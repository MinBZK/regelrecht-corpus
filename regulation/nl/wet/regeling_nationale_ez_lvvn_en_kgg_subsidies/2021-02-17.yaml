        artikel: '10'
  - number: 2.2.24
    text: |-
      De minister beslist afwijzend op een aanvraag voor subsidie als bedoeld in [artikel 2.2.6][ref1], indien voor de
      resterende productieve levensduurfase:

      a. de investeringen, bedoeld in [artikel 2.2.10, onderdeel a][ref2], niet passen binnen ten minste een van de
      doelstellingen, bedoeld in artikel 14, derde lid, onderdelen a, b en d, van de groepsvrijstellingsverordening
      landbouw;

      b. de investeringen, bedoeld in [artikel 2.2.10, onderdeel a][ref3], niet in overeenstemming zijn met de wetgeving
      van de Europese Unie en met de nationale milieubeschermingswetgeving als bedoeld in artikel 14, vijfde lid, van de
      groepsvrijstellingsverordening landbouw;

      c. de verlening van subsidie in strijd zou zijn met de verboden of beperkingen, bedoeld in artikel 14, elfde lid,
      van de groepsvrijstellingsverordening landbouw.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.6
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.10
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.10
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.2.24
