  - number: 2.11.3
    text: |-
      1 De subsidie voor activiteiten van een IPC-deelnemer voor de uitvoering van zijn innovatieplan bedraagt 50 procent
      van de subsidiabele kosten van de IPC-deelnemer tot een maximum van € 125.000.

      2 De subsidie voor de activiteiten van een IPC-penvoerder bedraagt € 4.000 per IPC-deelnemer.

      3 De som van subsidies bedraagt voor het gehele IPC-project ten hoogste € 550.000.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.11.3
  - number: 2.11.4
    text: |-
      De minister beslist afwijzend op een aanvraag voor subsidieverlening, indien:

      a. er geen sprake is van daadwerkelijke samenwerking binnen het IPC-project; of

      b. een IPC-deelnemer binnen het IPC-project waaraan hij deelneemt meer dan 70 procent van het totaal van de voor
      alle IPC-deelnemers in aanmerking komende subsidiabele kosten voor zijn rekening neemt.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.11.4
