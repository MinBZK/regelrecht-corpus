  - number: 3.13b.1
    text: |-
      1 In deze titel wordt verstaan onder:

        - *fundingkosten:* kosten die de bank maakt om geld aan te trekken op de kapitaalmarkt;
        - *investeringskosten:* kosten voor investeringen die noodzakelijk zijn voor de bedrijfsvoering dan wel waarvoor
      reeds verplichtingen zijn aangegaan die moeten worden nagekomen en waarvan de nakoming niet kan worden uitgesteld;
        - *lening:* niet achtergestelde lening van geld door een financier aan een ondernemer, welke lening: a. al dan niet
      door enige vorm van zekerheid is gedekt; b. niet converteerbaar is; c. is afgesloten met de afspraak dat de rente
      vast is, of een gedeelte van de rente vast is en een gedeelte van de rente flexibel is en gekoppeld is aan Euribor,
      met het oog op de financiering door deze onderneming van eigen activiteiten; d. wordt verstrekt om te voorzien in
      de liquiditeitsbehoefte voor werkkapitaal of investeringskosten van een ondernemer, die is ontstaan als gevolg van
      de uitbraak van het coronavirus; e. een hoofdsom kent die niet meer bedraagt dan: 1°. het dubbele van de jaarlijkse
      loonsom van de begunstigde, met inbegrip van de sociale lasten en de kosten van personeel dat op de locatie van
      de onderneming werkt, maar formeel op de loonlijst van onderaannemers staat, voor 2019 of voor het laatste jaar
      waarvoor dit bedrag bekend is; bij op of na 1 januari 2019 opgerichte ondernemingen mag het maximumbedrag van
      de lening niet hoger zijn dan de geraamde jaarlijkse loonsom voor de eerste twee exploitatiejaren; 2°. 25% van
      de totale omzet van de begunstigde in 2019; of 3°. met passende motivering en op basis van zelfcertificering
      door de begunstigde van zijn liquiditeitsbehoeften, op basis van een liquiditeitsplan dat zowel werkkapitaal als
      investeringskosten kan omvatten, mag het bedrag van de lening worden verhoogd om de liquiditeitsbehoeften vanaf het
      moment van toekenning te dekken voor de komende achttien maanden voor een MKB-ondernemer en voor de komende twaalf
      maanden voor een grote onderneming; f. wordt verstrekt aan ondernemingen die niet al in moeilijkheden verkeerden,
      in de zin van artikel 2, onderdeel 18, van de algemene groepsvrijstellingsverordening, op 31 december 2019; en
      g. met een rente wordt verstrekt die gelijk is aan de rente die voor een vergelijkbare lening die zonder garantie
      wordt verstrekt, in rekening wordt gebracht;
        - *liquiditeitsopslag:* door een financier aan een ondernemer in rekening gebracht percentage van de lening,
      waarvan de hoogte gelijk is voor alle door de desbetreffende financier op dezelfde dag afgesloten of af te
      sluiten leningen met dezelfde looptijd. Indien een dergelijk percentage niet beschikbaar is, zal in overleg met de
      financier een ander redelijk, transparant en verifieerbaar percentage worden vastgesteld.

      2 Voor de toepassing van deze titel wordt als financier aangewezen een bank.

      3 Voor de toepassing van [artikel 3.13b.2, tweede lid][ref1], wordt als financier aangewezen een kredietinstelling
      in de zin van de [Wet financiële markten BES][ref2] die op grond van die wet bevoegd is in Bonaire, Sint Eustatius
      of Saba het bedrijf van kredietinstelling uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.13b.2
      [ref2]: https://wetten.overheid.nl/BWBR0030883
