  - number: B3.13b.1:1
    text: |-
      In deze overeenkomst wordt verstaan onder:

      a. *minister:* de Minister van Economische Zaken en Klimaat;

      b. *bank:* binnen het grondgebied van de Europese Unie gevestigde bank die is toegelaten het bedrijf van bank uit
      te oefenen;

      ba. *investeringskosten:* kosten voor investeringen die noodzakelijk zijn voor de bedrijfsvoering dan wel waarvoor
      reeds verplichtingen zijn aangegaan die moeten worden nagekomen en waarvan de nakoming niet kan worden uitgesteld;

      c. *lening:* niet achtergestelde lening van geld door een financier aan een ondernemer, welke lening:

      1°. al dan niet door enige vorm van zekerheid is gedekt,

      2°. niet converteerbaar is,

      3°. is afgesloten met de afspraak dat de rente vast is, of een gedeelte van de rente vast is en een gedeelte van
      de rente flexibel is en gekoppeld is aan Euribor, met het oog op de financiering door deze onderneming van eigen
      activiteiten,

      4°. wordt verstrekt om te voorzien in de liquiditeitsbehoefte voor werkkapitaal of investeringskosten van een
      ondernemer, die is ontstaan als gevolg van de uitbraak van het coronavirus,

      5°. een hoofdsom kent die niet meer bedraagt dan:

        - het dubbele van de jaarlijkse loonsom van de begunstigde, met inbegrip van de sociale lasten en de kosten van
      personeel dat op de locatie van de onderneming werkt, maar formeel op de loonlijst van onderaannemers staat, voor
      2019 of voor het laatste jaar waarvoor dit bedrag bekend is; bij op of na 1 januari 2019 opgerichte ondernemingen
      mag het maximumbedrag van de lening niet hoger zijn dan de geraamde jaarlijkse loonsom voor de eerste twee
      exploitatiejaren,
        - 25% van de totale omzet van de begunstigde in 2019, of
        - met passende motivering en op basis van zelfcertificering door de begunstigde van zijn liquiditeitsbehoeften,
      op basis van een liquiditeitsplan dat zowel werkkapitaal als investeringskosten kan omvatten, mag het bedrag van
      de lening worden verhoogd om de liquiditeitsbehoeften vanaf het moment van toekenning te dekken voor de komende
      achttien maanden voor een MKB-ondernemer en voor de komende twaalf maanden voor een grote onderneming,

      6°. wordt verstrekt aan ondernemingen die niet al in moeilijkheden verkeerden, in de zin van artikel 2, onderdeel
      18, van de algemene groepsvrijstellingsverordening, op 31 december 2019, en

      7°. met een rente wordt verstrekt die gelijk is aan de rente die voor een vergelijkbare lening die zonder garantie
      wordt verstrekt, in rekening wordt gebracht;

      d. *liquiditeitsopslag:* een door een financier aan een ondernemer in rekening gebracht percentage van de lening,
      waarvan de hoogte gelijk is voor alle door de desbetreffende financier op dezelfde dag afgesloten of af te
      sluiten leningen met dezelfde looptijd. Indien een dergelijk percentage niet beschikbaar is, zal in overleg met de
      financier een ander redelijk, transparant en verifieerbaar percentage worden vastgesteld;

      e. *waarde van een lening:* het nog niet afgeloste deel van de lening;

      f. *ondernemer:* een natuurlijke persoon, een rechtspersoon of een vennootschap, die een onderneming in stand
      houdt, niet zijnde een rechtspersoon die krachtens publiekrecht is ingesteld;

      g. *groep:* een economische eenheid, waarin organisatorisch zijn verbonden:

      a. een natuurlijke persoon of privaatrechtelijke rechtspersoon, die direct of indirect:

      1°. meer dan de helft van het geplaatste kapitaal verschaft aan,

      2°. volledig aansprakelijk vennoot is van, of

      3°. overwegende zeggenschap heeft over een of meer rechtspersonen of vennootschappen, en

      b. laatstbedoelde rechtspersonen of vennootschappen;

      **

      h. *financier:* een bank;

      i. *onderneming:* iedere eenheid, ongeacht haar rechtsvorm of wijze van financiering, die een economische
      activiteit uitoefent;

      j. *fundingkosten:* kosten die de bank maakt om geld aan te trekken op de kapitaalmarkt;

      k. *MKB-ondernemer:* ondernemer die een kleine onderneming of een middelgrote onderneming in stand houdt in de zin
      van artikel 2, onderdeel 2, van de algemene groepsvrijstellingsverordening;

      l. *grote onderneming:* onderneming als bedoeld in artikel 2, onderdeel 24, van de algemene
      groepsvrijstellingsverordening;

      m. *algemene groepsvrijstellingsverordening:* verordening (EU) nr. 651/2014 van de Commissie van 17 juni 2014
      waarbij bepaalde categorieën steun op grond van de artikelen 107 en 108 van het Verdrag met de interne markt
      verenigbaar worden verklaard (PbEU 2014, L 187).
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel1
  - number: B3.13b.1:2
    text: |-
      1 De Staat stelt zich tegenover de financier garant voor 90% van de waarde van door de financier verstrekte
      leningen indien deze zijn verstrekt aan een MKB-ondernemer en 80% van de waarde van door de financier verstrekte
      leningen indien deze zijn verstrekt aan een grote onderneming, voor welke garantstelling de financier een provisie
      is verschuldigd.

      2 De garantie wordt verleend voor de duur van deze leningen met een maximum van zes jaar.

      3 De garantstelling heeft alleen betrekking op leningen:

      a. die worden verstrekt overeenkomstig de in artikel 3 genoemde voorwaarden;

      b. die onder de garantstelling zijn gebracht overeenkomstig de procedure van artikel 4.

      4 Indien de financier bij de verstrekking van een lening een gedeelte daarvan niet onder de garantstelling van de
      Staat brengt, is deze overeenkomst slechts van toepassing op het gedeelte van de lening dat onder de garantstelling
      is gebracht, tenzij uitdrukkelijk anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2
  - number: B3.13b.1:3
    text: |-
      Een lening aan een ondernemer kan onder de garantstelling van de Staat worden gebracht indien wordt voldaan aan de
      volgende voorwaarden:

      a. de rentabiliteits- en continuïteitsperspectieven van de onderneming van de ondernemer zijn bevredigend;

      b. in de voorafgaande periode van twaalf maanden zijn niet meer middelen ten behoeve van derden aan de onderneming
      onttrokken dan noodzakelijk voor een redelijk te achten bedrijfsvoering en evenmin is een verplichting tot een
      zodanige onttrekking aangegaan;

      c. de verstrekking van de lening dient niet ter vervanging van aan een ondernemer verschaft krediet of
      risicokapitaal door dezelfde financier of door een financier die deel uitmaakt van de groep van dezelfde financier,
      tenzij de lening dient ter vervanging van een krediet dat is verstrekt vanaf 24 maart 2020 tot en met het tijdstip
      waarop de regeling van de Staatssecretaris van Economische Zaken en Klimaat van 23 april 2020, nr. WJZ / 20095811,
      tot wijziging van de Regeling nationale EZK- en LNV-subsidies en de Regeling openstelling EZK- en LNV-subsidies
      2020 in werking treedt;

      d. de waarde van de lening die aan de ondernemer wordt verstrekt bedraagt niet minder dan € 1.500.000;

      e. bij of in verband met het verstrekken van de lening verstrekt de financier geen andere goederen dan geld;

      f. de lening draagt zelfstandig bij aan het realiseren van een actief en winstgericht beleid van de financier;

      g. de ondernemer verplicht zich aan een door de minister als toezichthouder in de zin van de
      [Algemene wet bestuursrecht][ref1] aangewezen persoon of aan een door de minister aangewezen deskundige derde, voor
      zover deze dit redelijkerwijs noodzakelijk acht voor de vervulling van zijn taak:

      1°. inlichtingen te verstrekken en inzage in zakelijke gegevens en bescheiden te verstrekken en de gelegenheid te
      bieden daarvan kopieën te maken;

      2°. toegang te verlenen tot plaatsen niet zijnde woningen;

      3°. anderszins binnen de door hem gestelde termijn alle door hem gewenste medewerking te verlenen;

      h. de waarde van de lening die aan de ondernemer of, indien de ondernemer deel uitmaakt van een groep, aan de
      groep wordt verstrekt tezamen met het nog niet afgeloste deel van een of meer leningen die door een financier
      met toepassing van de [titels 3.13][ref2], [3.13a][ref3] en [3.14][ref4] van de Regeling nationale EZK- en LNV-
      subsidies of een of meer bankgarantiegarantiefaciliteiten als bedoeld in [artikel 3.14.2][ref5] aan de ondernemer
      onderscheidenlijk de groep is of zijn verstrekt of gelijktijdig wordt of worden verstrekt, bedraagt niet meer dan
      € 150.000.000;

      ha. de waarde van de lening waarbij de aan de ondernemer of, indien de ondernemer deel uitmaakt van een
      groep, aan de groep verstrekte lening tezamen met andere leningen die door een financier met toepassing van
      [titel 3.13b][ref6] aan de ondernemer onderscheidenlijk de groep is of zijn verstrekt of gelijktijdig wordt of
      worden verstrekt, bedraagt niet meer dan het maximum bedoeld artikel 1, onderdeel c, subonderdeel 5°;

      i. de lening dient niet ter vervanging van een bestaande lening die is opgezegd om de reden dat een ondernemer niet
      meer aan de financiële ratio’s uit de leningovereenkomst kan voldoen, behoudens indien de bestaande lening wordt
      overgenomen door een andere financier die geen deel uitmaakt van de groep van de bestaande financier;

      j. de lening dient in overwegende mate niet ter vervanging door dezelfde financier of door een financier die
      deel uitmaakt van de groep van dezelfde financier van aan een ondernemer verschaft krediet waarvan de aflossing
      is vervroegd;

      k. de lening dient niet ter overname van een aandelenkapitaal of ter vervanging van een converteerbare
      achtergestelde lening;

      l. de lening dient niet ter vervanging van een bestaande lening, indien dit uitsluitend ten doel heeft betere
      leningsvoorwaarden te verkrijgen;

      m. de lening heeft niet als doel de afwenteling van bestaande risico’s op de Staat;

      n. de lening wordt na verloop van ieder kalenderkwartaal afgelost met een zodanig vast bedrag, dat de lening op de
      laatste datum waarop het moet zijn afgelost, maar uiterlijk na verloop van zes jaar, nihil bedraagt;

      o. het eerste kalenderkwartaal van aflossing van de lening vangt aan uiterlijk achttien maanden nadat de lening is
      verstrekt indien de lening is verstrekt aan een MKB-ondernemer en twaalf maanden indien de lening is verstrekt aan
      een grote onderneming;

      p. de financier spant zich ervoor in dat, naast de op het moment van verstrekken van de gegarandeerde lening
      reeds bestaande zekerheden, de ondernemer ten gunste van de financier aanvullende zekerheden vestigt, zo hoog
      mogelijk in rang, tot zekerheid voor nakoming van de verplichtingen van de ondernemer jegens de financier uit
      hoofde van de gegarandeerde lening. Bij uitwinning wordt de opbrengst van deze aanvullende zekerheden in eerste
      instantie aangewend voor het aflossen van de gegarandeerde lening. Bij uitwinning wordt de opbrengst van de
      reeds bestaande zekerheden in eerste instantie aangewend voor het aflossen van de overige niet gegarandeerde
      financieringsfaciliteiten, voor zover deze financieringsfaciliteiten voor het moment van verstrekken van
      de gegarandeerde lening door de financier zijn verstrekt, en in tweede instantie voor het aflossen van de
      gegarandeerde lening;

      q. de lening wordt uitsluitend verstrekt aan ondernemingen die een substantieel deel van hun activiteiten in
      Nederland uitvoeren;

      r. de afsluitprovisie bedraagt nooit meer dan 1 procent van de lening;

      s. de financier verleent voor de duur van minimaal twee kalenderkwartalen uitstel van de verplichting tot aflossing
      van alle financieringsfaciliteiten van de ondernemer bij de financier, waarbij de kalenderkwartalen vanaf 31 maart
      2020 mogen worden meegerekend, met uitzondering van die financieringsfaciliteiten waarbij dit niet mogelijk is
      omdat deze samen, en onder dezelfde voorwaarden, met een of meer andere financiers zijn verstrekt, en de andere
      financiers hiermee niet instemmen.


