        artikel: '16'
  - number: 4.2.121
    text: |-
      De minister verstrekt op aanvraag een subsidie voor het uitvoeren van activiteiten in een ERA-NET energieproject
      aan:

      a. een in Nederland gevestigde deelnemer aan een ERA-NET energieproject, of

      b. een deelnemer in een samenwerkingsverband van in Nederland gevestigde deelnemers aan een ERA-NET energieproject.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.2.121
  - number: 4.2.122
    text: |-
      1 De subsidie bedraagt:

      a. 50% van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek;

      b. 25% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling;

      c. 80% van de subsidiabele kosten voor zover deze betrekking hebben op niet-economische activiteiten door
      onderzoeksorganisaties;

      d. indien het ERA-NET energieproject bestaat uit een energiedemonstratieproject:

      1°. 30% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat energie-
      efficiëntiemaatregelen betreft;

      2°. 45% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat maatregelen betreft
      ter bevordering van energie uit hernieuwbare energiebronnen en waarbij de subsidiabele kosten worden berekend in
      overeenstemming met artikel 41, zesde lid, onderdeel a of b, van de algemene groepsvrijstellingsverordening;

      3°. 30% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat maatregelen betreft
      ter bevordering van energie uit hernieuwbare energiebronnen en waarbij de subsidiabele kosten worden berekend in
      overeenstemming met artikel 41, zesde lid, onderdeel c, van de algemene groepsvrijstellingsverordening.

      2 De subsidiabele kosten van een ERA-NET energieproject bestaande uit een energiedemonstratieproject worden
      berekend volgens de artikelen 38 en 41 van de algemene groepsvrijstellingsverordening.

      3 De in het eerste lid, onderdelen a, b en d, genoemde percentages worden met 20 procentpunten verhoogd, indien de
      aanvrager een kleine onderneming is en de subsidiabele kosten worden gemaakt en betaald door de kleine onderneming.

      4 De in het eerste lid, onderdelen a, b en d, genoemde percentages worden met 10 procentpunten verhoogd, indien de
      aanvrager een middelgrote onderneming is en de subsidiabele kosten worden gemaakt en betaald door de middelgrote
      onderneming.

      5 Onverminderd het derde en vierde lid, worden de in het eerste lid, onderdelen a en b, genoemde percentages voor
      ondernemingen met 10 procentpunten verhoogd, indien het project samenwerking met een onderzoeksorganisatie betreft,
      de onderzoeksorganisatie minstens 10% van de subsidiabele projectkosten draagt en de onderzoeksorganisatie het
      recht heeft de resultaten van het project te publiceren voor zover deze afkomstig zijn van het door die organisatie
      uitgevoerde onderzoek.

      6 Het maximale subsidiebedrag is het maximale subsidiebedrag, bedoeld in de ERA-NET energiecall.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.2.122
