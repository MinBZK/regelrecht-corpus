  - number: 2.5.8
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 2.5.2][ref1] bevat ten minste de gegevens, bedoeld in artikel
      6, tweede lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie als bedoeld in [artikel 2.5.2][ref2] ten minste:

      a. gegevens over de financier, waaronder de statutaire naam, het nummer waarmee de onderneming is geregistreerd bij
      de Kamer van Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de financier, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. kerngegevens over de financier, waaronder de deskundigheid, het financieringsbeleid, het financieringsproces,
      het beheer en het uitwinningsbeleid van krediet.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.5.2
