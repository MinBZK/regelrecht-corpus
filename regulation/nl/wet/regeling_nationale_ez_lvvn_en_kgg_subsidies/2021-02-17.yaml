  - number: 4.5.14
    text: |-
      1 De subsidie voor een investering voor de productie van duurzame energie, bedoeld in
      [artikel 4.5.2, tweede lid][ref1], bevat:

      a. mogelijk staatssteun die wordt gerechtvaardigd door artikel 41 van de algemene groepsvrijstellingsverordening,
      indien de subsidie wordt verstrekt aan een rechtspersoon of natuurlijke persoon, niet zijnde eigenaar-bewoner;

      b. geen staatsteun, indien deze subsidie verstrekt wordt aan een eigenaar-bewoner.

      2 De subsidie voor een investering voor energiebesparende isolatiemaatregelen en aansluiting op een warmtenet,
      bedoeld in [artikel 4.5.2, derde en vierde lid][ref2], bevat geen staatssteun.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.2
