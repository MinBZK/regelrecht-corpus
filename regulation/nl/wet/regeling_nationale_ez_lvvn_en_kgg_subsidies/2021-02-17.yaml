      d. bij deelname van een onderzoeksorganisatie aan een samenwerkingsverband, de samenwerking tussen die
      onderzoeksorganisatie en de overige deelnemers in het samenwerkingsverband onvoldoende evenwichtig is, blijkend uit
      de omstandigheid dat de onderzoeksorganisatie meer dan 50 procent van de subsidiabele kosten maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.63
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.63
