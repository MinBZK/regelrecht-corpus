  - number: 2.14.1
    text: |-
      In deze titel wordt verstaan onder:

        - *houder:* houder van zeldzame melkkoeien die melk levert aan een zuivelonderneming of die de op het eigen bedrijf
      geproduceerde melk zelf verwerkt tot eindproducten en die een relatienummer heeft;
        - *I&R-systeem rund:* I&R-systeem rund als bedoeld in
      [artikel 14, onderdeel a, van de Regeling identificatie en registratie van dieren][ref1];
        - *melkkoe:* vrouwelijk rund dat ten minste eenmaal heeft gekalfd en wordt gemolken;
        - *relatienummer:* relatienummer als bedoeld in
      [artikel 1 van de Regeling identificatie en registratie van dieren][ref2];
        - *zeldzame melkkoeien:* a. zeldzame runderrassen: raszuivere runderen behorend tot een van de rassen Brandrood
      rund, Fries-Hollands vee (zwartbont), Groninger blaarkop, Lakenvelder, Roodbont Fries vee; of b. dubbeldoel
      runderen met zeldzame kleurslagen: runderen behorend tot een dubbeldoeltype met een van de kleurslagen Baggerbont,
      Blauwbont, Vaal, Vaalbont of Witrik.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel1
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.14.1
