  - number: 4.5.4
    text: |-
      De subsidie voor een investering voor energiebesparende isolatiemaatregelen als bedoeld in
      [artikel 4.5.2, derde lid][ref1], bedraagt voor:

      a. dakisolatie:

      1°. voor het isoleren van het bestaande dak, bedoeld in [artikel 4.5.2, derde lid, onderdeel a][ref2], € 20 per
      vierkante meter van de te isoleren oppervlakte, voor zover de subsidiabele kosten betrekking hebben op ten hoogste
      200 vierkante meter te isoleren oppervlakte;

      2°. voor het isoleren van de bestaande zolder- of vlieringvloer, bedoeld in
      [artikel 4.5.2, derde lid, onderdeel a][ref3], € 5 per vierkante meter van de te isoleren oppervlakte, voor zover
      de subsidiabele kosten betrekking hebben op ten hoogste 130 vierkante meter te isoleren oppervlakte;

      b. gevelisolatie als bedoeld in [artikel 4.5.2, derde lid, onderdeel c][ref4], € 25 per vierkante meter van de te
      isoleren oppervlakte, voor zover de subsidiabele kosten betrekking hebben op ten hoogste 170 vierkante meter te
      isoleren oppervlakte;

      c. glas-, kozijnpaneel- of deurisolatie in de bestaande thermische schil, voor zover de totale subsidiabele kosten
      betrekking hebben op ten hoogste 45 vierkante meter te isoleren oppervlakte, door het vervangen van:

      1°. glas, kozijnpanelen of deuren door HR ++ glas, eventueel in combinatie met nieuwe isolerende deuren als bedoeld
      in [artikel 4.5.2, derde lid, onderdeel c, subonderdeel 1°][ref5], € 35 per vierkante meter van de te isoleren
      oppervlakte;

      2°. glas of kozijnpanelen door nieuwe isolerende kozijnpanelen, € 15 per vierkante meter, voor zover de
      subsidiabele kosten mede betrekking hebben op het vervangen van glas door HR++ glas, bedoeld in subonderdeel 1°;

      3°. glas, kozijnpanelen of deuren door triple-glas, in combinatie met een nieuw kozijn, eventueel in combinatie met
      nieuwe isolerende deuren als bedoeld in [artikel 4.5.2, derde lid, onderdeel c, subonderdeel 2°][ref6], € 100 per
      vierkante meter van de te isoleren oppervlakte;

      4°. glas of kozijnpanelen door nieuwe isolerende kozijnpanelen, € 75 per vierkante meter, voor zover de
      subsidiabele kosten mede betrekking hebben op het vervangen van glas door triple glas, bedoeld in subonderdeel 3°;

      d. spouwmuurisolatie als bedoeld in [artikel 4.5.2, derde lid, onderdeel d][ref7], € 5 per vierkante meter te
      isoleren oppervlakte, voor zover de subsidiabele kosten betrekking hebben op ten hoogste 170 vierkante meter te
      isoleren oppervlakte;

      e. vloer- of bodemisolatie via:

      1°. het isoleren van de bestaande vloer, bedoeld in [artikel 4.5.2, derde lid, onderdeel e][ref8], € 7 per
      vierkante meter te isoleren oppervlakte, voor zover de subsidiabele kosten betrekking hebben op ten hoogste 130
      vierkante meter te isoleren oppervlakte;

      2°. het isoleren van de bestaande bodem, eventueel in combinatie met de bestaande vloer, bedoeld in
      [artikel 4.5.2, derde lid, onderdeel e][ref9], € 4 per vierkante meter te isoleren oppervlakte, voor zover de
      subsidiabele kosten betrekking hebben op ten hoogste 130 vierkante meter te isoleren oppervlakte.


