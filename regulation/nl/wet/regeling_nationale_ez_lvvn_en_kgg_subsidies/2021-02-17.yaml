      financier nog geen garantstellingsovereenkomst is gesloten als bedoeld in de [titels 3.12][ref4] of [3.13][ref5] en
      de afwijzingsgronden voor aanvragen om een bankgarantiefaciliteit, bedoeld in [artikel 3.14.9][ref6].


