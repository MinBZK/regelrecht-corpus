  - number: 4.6.5
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.6.5
  - number: 4.6.6
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is de periode van de datum van aanvang van
      het project tot en met 31 december 2023.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.6.6
