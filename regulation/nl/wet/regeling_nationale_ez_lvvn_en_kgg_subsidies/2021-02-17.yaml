  - number: 2.2.6
    text: |-
      De minister beslist afwijzend op een aanvraag voor subsidie indien:

      a. op basis van de projectomschrijving, bedoeld in [artikel 2.2.8, derde lid][ref1], aannemelijk is dat met de
      uitvoering van het innovatieproject:

      1°. de op grond van het [Besluit emissiearme huisvesting][ref2] veehouderij van toepassing zijnde maximale
      emissiewaarde wordt overschreden;

      2°. de reductie van broeikasgasemissies of stalemissies lager is dan de van toepassing zijnde minimale
      reductiepercentages van de emissiewaarde, bedoeld in [bijlage 2.2.1][ref3] of geen reductiepercentage voor de
      betreffende emissie is vastgesteld in bijlage 2.2.1;

      3°. het niveau van dierenwelzijn en brandveiligheid op een veehouderijlocatie zou verminderen;

      4°. minder dan 40% vast voer wordt verstrekt, indien het een innovatieproject gericht op investeringen als bedoeld
      in [artikel 2.2.10, onderdeel a][ref4], ten behoeve van een vleeskalverhouderijonderneming betreft als bedoeld in
      [artikel 2.2.2, eerste lid, onderdeel d][ref5];

      5°. de leghennen of vleeskuikens dan wel grootouder- of ouderdieren hiervan niet op grondhuisvesting
      worden gehouden, indien het een innovatieproject gericht op investeringen, managementmaatregelen of een
      combinatie hiervan als bedoeld in [artikel 2.2.10][ref6], ten behoeve van een leghennenhouderijonderneming,
      vleeskuikenhouderijonderneming of vleeskuikenouderdierhouderijonderneming betreft;

      b. na toepassing van:

      1°. [artikel 2.2.7, eerste lid, onderdeel a][ref7], minder dan 14 punten zijn toegekend, indien het
      een innovatieproject ten behoeve van een varkenshouderijonderneming, melkgeitenhouderijonderneming,
      vleeskalverhouderijonderneming, leghennenhouderijonderneming, vleeskuikenhouderijonderneming of
      vleeskuikenouderdierhouderijonderneming betreft;

      2°. [artikel 2.2.7, eerste lid][ref8], minder dan 29 punten zijn toegekend, indien het een innovatieproject ten
      behoeve van een melkveehouderijonderneming betreft;

      c. de afwijzingsgrond voor de emissiemetingenfase, genoemd in [artikel 2.2.18][ref9] zich voordoet;

      d. de afwijzingsgronden, bedoeld in [artikel 2.2.24][ref10] zich voordoen voor de resterende levensduurfase, indien
      een innovatieproject de drie fases, bedoeld in [artikel 2.2.2, tweede lid, onderdeel a][ref11], betreft.


