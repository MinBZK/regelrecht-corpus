  - number: 4.5.6
    text: |-
      1 Voor een investering voor de productie van duurzame energie als bedoeld in [artikel 4.5.2, tweede lid][ref1],
      die niet bestemd is voor een koopwoning van een eigenaar-bewoner, komen voor subsidie in aanmerking de bijkomende
      investeringskosten, bedoeld in artikel 41, zesde lid, van de algemene groepsvrijstellingsverordening.

      2 Voor een investering voor de productie van duurzame energie, energiebesparende
      isolatiemaatregelen of de individuele aansluiting op een warmtenet als bedoeld in
      [artikel 4.5.2, tweede lid, onderdelen a en b, derde lid en vierde lid, onderdeel a][ref2], die bestemd is voor een
      koopwoning van een eigenaar-bewoner komen, in afwijking van artikel 10, tweede lid, van het besluit, voor subsidie
      in aanmerking de kosten in verband met investeringen die vóór indiening van de aanvraag zijn gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.2
