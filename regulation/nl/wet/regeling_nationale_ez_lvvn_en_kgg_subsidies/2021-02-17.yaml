  - number: 3.12.14
    text: |-
      1 Op aanvragen om reserveringsquotum die zijn ingediend voor 1 juli 2018 en op reserveringsquota die voor dat
      tijdstip zijn toegekend, blijft deze regeling van toepassing zoals deze luidde voor dat tijdstip.

      2 De eenmalig provisie van 1 procent, genoemd in [artikel 3.12.10, eerste lid, aanhef][ref1], is niet verschuldigd
      voor een garantie die ten laste komt van een reserveringsquotum.

      3 Met schriftelijke instemming van een financier zijn de wijzigingen van de artikelen 5, 8, 9, 11, 11a en 12
      van [bijlage 3.12.2][ref2] ingevolge de Regeling van de Staatssecretaris van Economische Zaken en Klimaat en de
      Minister van Landbouw, Natuur en Voedselkwaliteit van 9 februari 2021, nr. WJZ/ 20257211, tot wijziging van de
      Regeling nationale EZK- en LNV-subsidies in verband met aanpassing van de garant- en borgstellingsmodules aan
      Verordening (EU) nr. 575/2013 van het Europees Parlement en de Raad van 26 juni 2013 betreffende prudentiële
      vereisten voor kredietinstellingen en beleggingsondernemingen en tot wijziging van Verordening (EU) nr. 648/2012
      (PbEU 2013, L 176) (Stcrt. 2021, 6766) eveneens van toepassing op een garantstellingsovereenkomst als bedoeld in
      [artikel 3.12.7, tweede lid][ref3], die voor de inwerkingtreding van de voornoemde regeling tot stand is gekomen
      tussen de betreffende financier en de Staat.


