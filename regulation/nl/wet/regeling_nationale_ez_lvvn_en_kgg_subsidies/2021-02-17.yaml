        bwb_id: BWBR0035474
        artikel: 4.4.3
        hoofdstuk: '4'
  - number: 4.4.6
    text: |-
      In afwijking van de [artikelen 10, eerste tot en met vijfde en zevende lid][ref1], en
      [11 tot en met 14 van het besluit][ref2] komen de indirecte emissiekosten ETS in aanmerking voor subsidie, voor
      zover deze kosten betrekking hebben op de vervaardiging van producten in bedrijfstakken of deeltakken, bedoeld
      in [bijlage 4.4.1][ref3].


