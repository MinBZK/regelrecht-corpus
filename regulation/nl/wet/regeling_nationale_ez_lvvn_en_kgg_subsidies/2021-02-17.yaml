    text: |-
      Deze titel en [bijlagen 4.6.1][ref1] en [4.6.2][ref2] vervallen met ingang van 1 augustus 2024, met dien verstande
      dat deze van toepassing blijft op subsidies die voor deze datum zijn verleend.


