  - number: 2.4.2
    text: |-
      Deze titel vervalt met ingang van 1 januari 2024, met dien verstande dat deze van toepassing blijft op subsidies
      die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.2
  - number: 2.4.3
    text: |-
      1 Een advies- en cursusvoucher heeft een waarde van ten hoogste € 1.500,– en wordt door de minister op aanvraag
      verstrekt aan een landbouwonderneming voor:

      a. het verkrijgen van een bedrijfsadvies over:

      1°. het brongericht verminderen van de emissie van ammoniak, nitraat en fosfaat naar bodem, water en lucht, met
      name door: aanpassing van het gebruik van diervoeders, weidegang, het gebruik van dierlijke meststoffen, het
      gebruik van emissiearme stallen en het vergroten van het gebruik van nutriënten uit meststoffen, drainage- en
      afvalwater, slib en andere organische reststromen;

      2°. duurzaam bodembeheer of groeimediumbeheer met integrale aandacht voor (grond)water en het teeltsysteem;

      3°. weerbare teeltsystemen waarbij minder behoefte is aan gewasbeschermingsmiddelen;

      4°. nieuwe en aangepaste gewassen, grondstoffen en bewerkingen hiervan die bijdragen aan optimaal hergebruik door
      de landbouwonderneming of de omgeving waarin de landbouwonderneming is gelegen, alsmede nieuwe, meer diverse of
      verbeterde plantaardige eiwitteelten en -bronnen;

      5°. de ontwikkeling van natuurinclusieve landbouw en het herstel van biodiversiteit op en rondom
      landbouwondernemingen;

      6° precisielandbouw, met name door: de inzet van gegevens, software en autonome- en precisiewerktuigen om de
      doelen, genoemd in de onderdelen 1° tot en met 5°, te behalen;

      7°. de ontwikkeling van vaardigheden van medewerkers van de landbouwonderneming die verband houden met hun
      persoonlijke ontwikkeling en de duurzame ontwikkeling van het bedrijf;

      8°. het stimuleren van samenwerking tussen landbouwondernemingen, producentenorganisaties of telersverenigingen,
      gericht op het versterken van de positie van de landbouwonderneming; of

      9°. het starten, overnemen of beëindigen van een landbouwonderneming.

      b. het volgen van de Verdiepingscursus stikstof in de landbouw bij een kennisinstelling.

      2 Het bedrijfsadvies, bedoeld in het eerste lid, onderdeel a, is bedrijfsspecifiek en hoofdzakelijk gericht op één
      van de subonderdelen van het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.3
  - number: 2.4.4
    text: |-
      1 Indien de aanvraag betrekking heeft op het verkrijgen van een bedrijfsadvies, vermeldt de landbouwonderneming bij
      de aanvraag:

      a. de bedrijfsspecifieke adviesvraag die zij in het kader van het bedrijfsadvies wil stellen;

      b. op welk onderwerp als bedoeld in [artikel 2.4.3, eerste lid, onderdeel a][ref1], het bedrijfsadvies
      hoofdzakelijk gericht zal zijn; en

      c. of de landbouwonderneming in groepsverband wil worden geadviseerd.

      2 De landbouwonderneming vermeldt bij de aanvraag naar keuze een erkende bedrijfsadviseur of kennisinstelling
      waaraan de voucher wordt overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.3
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.4
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.4.3
        hoofdstuk: '2'
        paragraaf: 2.4.2
  - number: 2.4.5
    text: |-
      De minister bepaalt op volgorde van binnenkomst aan welke landbouwondernemingen binnen het subsidieplafond advies-
      en cursusvouchers worden verstrekt, uitgaande van de maximumwaarde per voucher.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.5
  - number: 2.4.6
    text: |-
      De minister beslist afwijzend op een aanvraag indien aan de aanvrager al eerder een voucher als bedoeld in
      [artikel 2.4.3][ref1] is toegekend in hetzelfde kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.3
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.6
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.4.3
        hoofdstuk: '2'
        paragraaf: 2.4.2
  - number: 2.4.7
    text: |-
      De landbouwonderneming draagt de door de minister verstrekte voucher over aan de in de aanvraag opgenomen erkende
      bedrijfsadviseur of kennisinstelling.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.7
  - number: 2.4.8
    text: |-
      Subsidie wordt verstrekt aan een erkende bedrijfsadviseur die een advies heeft verstrekt of een kennisinstelling
      die een cursus heeft uitgevoerd ten behoeve van een landbouwonderneming en in verband daarmee een geldige voucher
      overlegt.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.8
  - number: 2.4.9
    text: De subsidie bedraagt ten hoogste 100% van de subsidiabele kosten en niet meer dan € 1.500,– per voucher.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.9
  - number: 2.4.10
    text: |-
      1 Voor subsidie voor het geven van advies, bedoeld in [artikel 2.4.3, onderdeel a][ref1], komen in aanmerking
      kosten van advies als bedoeld in artikel 22 van de groepsvrijstellingsverordening landbouw.

      2 Voor subsidie voor het geven van advies, bedoeld in [artikel 2.4.3, onderdeel a][ref2], komen niet in aanmerking
      kosten die de erkende bedrijfsadviseur maakt voor de inhuur van personen die organisatorisch of financieel niet
      onafhankelijk zijn van de landbouwonderneming waaraan het advies is verstrekt.

      3 Voor subsidie voor de uitvoering van de cursus, bedoeld in [artikel 2.4.3, onderdeel b][ref3], komen in
      aanmerking kosten van de beroepsopleiding, waaronder cursussen als bedoeld in artikel 21, derde lid, onderdeel a,
      van de groepsvrijstellingsverordening landbouw.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.3
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.3
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.3
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.10
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.4.3
        hoofdstuk: '2'
        paragraaf: 2.4.2
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 2.4.3
        hoofdstuk: '2'
        paragraaf: 2.4.2
      - id: ref3
        bwb_id: BWBR0035474
        artikel: 2.4.3
        hoofdstuk: '2'
        paragraaf: 2.4.2
  - number: 2.4.11
    text: |-
      1 Een aanvraag voor subsidie wordt na afloop van de uitvoering van het advies, bedoeld in
      [artikel 2.4.3, onderdeel a][ref1], of de cursus, bedoeld in artikel 2.4.3, onderdeel b, door de kennisinstelling
      of de erkende bedrijfsadviseur ingediend.

      2 De aanvraag moet binnen een jaar zijn ontvangen na de dagtekening van een aan de landbouwonderneming verstrekte
      voucher. Op een voor het einde van de termijn daartoe ingediend verzoek kan de minister besluiten deze termijn
      eenmalig te verlengen met ten hoogste zes maanden.

      3 Indien de aanvraag niet door de minister is ontvangen binnen de termijn, bedoeld in het tweede lid, vervalt de
      voucher van rechtswege.

      4 Indien de erkende bedrijfsadviseur in groepsverband adviezen heeft verstrekt en hiervoor subsidie beoogt te
      ontvangen, worden de subsidieaanvragen voor de in het groepsverband verstrekte adviezen op dezelfde dag ingediend
      en worden de aanvragen voorzien van een document waarop de aanwezigheid van de landbouwondernemingen bij de
      advisering is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.3
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.11
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.4.3
        hoofdstuk: '2'
        paragraaf: 2.4.2
  - number: 2.4.12
    text: |-
      De minister beslist afwijzend op een aanvraag voor subsidie voor het geven van advies indien:

      a. advisering in een groepsverband heeft plaatsgevonden aan zestien of meer landbouwondernemingen;

      b. de advisering niet hoofdzakelijk was gericht op het in de aanvraag vermelde onderwerp;

      c. de erkende bedrijfsadviseur financieel niet onafhankelijk is van de aanvrager;

      d. de erkende bedrijfsadviseur niet deskundig of onvoldoende betrouwbaar is als bedoeld in artikel 22, zesde lid,
      van de groepsvrijstellingsverordening landbouw;

      e. de erkende bedrijfsadviseur niet deskundig is op het onderwerp, bedoeld in
      [artikel 2.4.3, onderdeel a, subonderdelen 1° tot en met 9°][ref1], waarop de advisering is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.3
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.12
    references:
