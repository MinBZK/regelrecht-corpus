  - number: 4.6.9
    text: |-
      1 Een aanvraag om subsidie bevat ten minste de gegevens, bedoeld in artikel 6, tweede lid, van de algemene
      groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidieverlening ten minste:

      a. gegevens over de aanvrager, waaronder het nummer waarmee de onderneming is geregistreerd bij de Kamer van
      Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres, en

      c. kerngegevens over het project;

      d. gegevens over de grootte van het bedrijf van de aanvrager, indien de aanvrager aanspraak wil maken
      op een verhoogd percentage aan subsidie voor een kleine of middelgrote onderneming als bedoeld in
      [artikel 4.6.3, vijfde lid][ref1].

      3 De aanvraag gaat vergezeld van een projectomschrijving, een financieringsplan en een exploitatieberekening
      inclusief de financiële parameters van het project, zoals de terugverdientijd.

      4 De projectomschrijving bevat in ieder geval:

      a. de CO-reductie in kilogrammen die het project in Nederland realiseert ten opzichte van de referentie-
      investering;

      b. een beschrijving van de referentie-investering.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.6.3
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.6.9
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 4.6.3
        hoofdstuk: '4'
  - number: 4.6.10
    text: |-
      1 Op verzoek van de minister verleent de subsidieontvanger medewerking aan het verspreiden van de resultaten.

      2 De subsidieontvanger maakt de niet bedrijfsgevoelige kennis en informatie die met het project worden opgedaan na
      afloop van het project openbaar in een, naar het oordeel van de minister, kwalitatief voldoende verslag.

      3 [Artikel 38, eerste lid, onderdelen b tot en met d, van het besluit][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel38
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.6.10
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '38'
  - number: 4.6.11
    text: |-
      Het eindverslag, bedoeld in [artikel 50, tweede lid, onderdeel a, van het besluit][ref1], waarmee de aanvraag tot
      subsidievaststelling vergezeld gaat, bevat, voor zover van toepassing, in ieder geval:

      a. een algemene en technische omschrijving van de aangeschafte en gebruikte installaties of lokale infrastructuur;

      b. een exploitatieberekening inclusief de financiële parameters van het project;

      c. een overzicht van de investeringskosten per component van het project;

      d. een overzicht van de kostenopbouw toegespitst op de verschillende kostencomponenten, inclusief risico-opslag;

      e. een overzicht van alle kosten en baten; en

      f. een berekening van de daadwerkelijk gerealiseerde CO-reductie in Nederland ten opzichte van de referentie-
      investering.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel50
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.6.11
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '50'
  - number: 4.6.12
    text: |-
      De subsidie, bedoeld in [artikel 4.6.2][ref1], bevat staatssteun en wordt gerechtvaardigd door de artikelen 36, 38,
      47 en 56 van de algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.6.2
