  - number: 3.25.3
    text: |-
      1 Voor subsidie komt niet in aanmerking een financier die een kredietovereenkomst sluit met een MKB-ondernemer die:

      a. een onderneming in stand houdt waarvan de activiteiten in overwegende mate betrekking hebben op;

      1°. onroerende zaken voor zover de activiteiten gericht zijn op het behalen van resultaten door waardestijging van
      onroerende zaken zonder dat er sprake is van een significante waardetoevoeging door eigen productieve activiteiten;

      2°. de financiële sector voor zover de ondernemer het bank-, verzekerings- of beleggingsbedrijf uitoefent, of een
      participatiemaatschappij heeft;

      b. een onderneming in stand houdt die een aanbieder als bedoeld in
      [artikel 1, onderdeel c, van de Wet marktordening gezondheidszorg][ref1] is;

      c. een onderneming in stand houdt die actief is in:

      1°. de sector visserij en aquacultuur;

      2°. de primaire productie van landbouwproducten, of

      3°. de sector verwerking en afzet van landbouwproducten;

      d. een onderneming in stand houdt waarvoor de totale ontvangen steun die wordt gerechtvaardigd door paragraaf 3.1
      van de Tijdelijke kaderregeling inzake staatssteun ter ondersteuning van de economie vanwege de huidige COVID-19-
      uitbraak (PbEU 2020, C 91 I) na toepassing van deze titel meer bedraagt dan € 800.000,– waarbij uit wordt gegaan
      van bruto bedragen;

      e. gelijktijdig met een kredietovereenkomst als bedoeld in [artikel 3.25.2. eerste lid][ref2], een andere
      kredietovereenkomst met dezelfde financier heeft gesloten of dit voorzienbaar op korte termijn zal doen;

      f. een onderneming in stand houdt waarbij het uitstaand obligo bij financiers en financier-gelieerden na
      verstrekking van het krediet meer is dan € 250.000,– waarbij alle zakelijke financieringen, met uitzondering van
      een zakelijke hypotheek, worden meegenomen;

      g. een onderneming in stand houdt waarmee een kredietovereenkomst is gesloten of waaraan een lening is verstrekt
      met toepassing van de [titels 2.5][ref3], [3.11][ref4], [3.13][ref5], [3.13a][ref6] of [3.13b][ref7];

      h. een onderneming in stand houdt die geen winst heeft gemaakt in 2019 of gemiddeld genomen over minimaal de
      laatste twee boekjaren;

      i. een onderneming in stand houdt:

      1°. die al op 31 december 2019 kwalificeerde als een onderneming in moeilijkheden zoals bedoeld in artikel 2, punt
      18, van de algemene groepsvrijstellingsverordening;

      2°. waartegen een collectieve insolventieprocedure loopt, of

      3°. die voldoet aan de criteria om op verzoek van zijn schuldeisers aan een collectieve insolventieprocedure te
      worden onderworpen.

      2 In aanvulling op het eerste lid beslist de minister tevens afwijzend op een aanvraag voor een garantstelling
      indien:

      a. de financier geen garantstellingsovereenkomst met de Staat heeft gesloten;

      b. de aanvrager eerder tekort is geschoten bij de naleving van verplichtingen op grond van de
      garantstellingsovereenkomst.


