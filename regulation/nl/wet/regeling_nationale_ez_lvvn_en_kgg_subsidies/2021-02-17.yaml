  - number: 3.13b.6
    text: |-
      De in [artikel 3.13.6, eerste lid][ref1], genoemde adviescommissie heeft tevens tot taak de minister op zijn
      verzoek te adviseren omtrent:

      a. de afwijzingsgronden voor aanvragen om het sluiten van een garantstellingsovereenkomst, bedoeld in de
      [artikelen 22][ref2] en [24 van het besluit][ref3] indien met de financier nog geen garantstellingsovereenkomst is
      gesloten als bedoeld in de [titels 3.13][ref4] of [3.14][ref5]; en

      b. de afwijzingsgronden voor aanvragen om een garantstelling, bedoeld in [artikel 3.13b.9][ref6].


