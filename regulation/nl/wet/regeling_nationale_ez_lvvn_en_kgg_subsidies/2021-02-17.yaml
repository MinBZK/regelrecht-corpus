  - number: 3.22.9
    text: |-
      1 Het thematisch technology transferfonds boekt een deel van de inkomsten uit participaties over aan de minister,
      overeenkomstig het bepaalde in [artikel 3.22.10][ref1].

      2 Het thematisch technology transferfonds verricht geen andere activiteiten dan de uitvoering van het fondsplan.

      3 Het thematisch technology transferfonds doet uitsluitend vervolginvesteringen in een kennisstarter indien:

      a. het totale bedrag aan risicofinanciering, bedoeld in artikel 21, negende lid, van de algemene
      groepsvrijstellingsverordening niet wordt overschreden voor de desbetreffende kennisstarter;

      b. in de mogelijkheid van vervolginvesteringen is voorzien in het oorspronkelijke ondernemingsplan van de
      desbetreffende kennisstarter;

      c. de desbetreffende kennisstarter niet verbonden is geraakt in de zin van artikel 3, derde lid, van bijlage
      I bij de algemene groepsvrijstellingsverordening, met een andere onderneming dan het thematisch technology
      transferfonds of een onafhankelijke particuliere investeerder die in het kader van artikel 21 van de algemene
      groepsvrijstellingsverordening risicofinanciering verschaft, tenzij de nieuwe entiteit voldoet aan de definitie van
      kmo, bedoeld in artikel 2, onderdeel 2 en bijlage I van de algemene groepsvrijstellingsverordening; en

      d. de desbetreffende kennisstarter:

      1°. nog steeds niet actief is of is geweest op een markt;

      2°. minder dan zeven jaar na zijn eerste commerciële verkoop actief is op een markt en het risicokapitaal dat het
      thematisch technology transferfonds verstrekt als hefboom dient voor aanvullende verstrekking van risicokapitaal
      door een of meer onafhankelijke particuliere investeerders op het niveau van de desbetreffende kennisstarter, zodat
      bij de vervolginvestering het totale particuliere deelnemingspercentage minimaal 40 procent bedraagt; of

      3°. zeven jaar of langer na de eerste commerciële verkoop actief is op de markt en het risicokapitaal dat het
      thematisch technology transferfonds verstrekt als hefboom dient voor aanvullende verstrekking van risicokapitaal
      door een of meer onafhankelijke particuliere investeerders op het niveau van de desbetreffende kennisstarter, zodat
      bij de vervolginvestering het totale particuliere deelnemingspercentage minimaal 60 procent bedraagt.

      4 Het thematisch technology transferfonds stelt zeker dat het geld dat de kennisstarter verkrijgt als gevolg van
      een participatie niet wordt gebruikt om bestaande financiële verplichtingen te herfinancieren.

      5 In de overeenkomst van geldlening, bedoeld in [artikel 3.22.2, vijfde lid][ref2], kunnen verplichtingen worden
      opgenomen die strekken tot verwezenlijking van het doel van de subsidie.

      6 Een fondsplan van een thematisch technology transferfonds is gebaseerd op de uitgangspunten dat:

      a. het thematisch technology transferfonds participaties verkrijgt gedurende een investeringsperiode van ten
      hoogste zes jaar, en deze uiterlijk negen jaar na afloop van de investeringsperiode vervreemdt;

      b. de totale verkrijgingprijs van de participaties die gedurende de fondsperiode in één kennisstarter wordt
      geïnvesteerd, ten minste € 25.000 en ten hoogste € 1.500.000 bedraagt;

      c. de gemiddelde totale verkrijgingprijs van de participaties die het thematisch technology transferfonds gedurende
      de investeringsperiode per kennisstarter investeert, over alle kennisstarters genomen ten hoogste € 750.000
      bedraagt;

      d. voor achtergestelde vorderingen een rente wordt bedongen die ten minste gelijk is aan de referentierente;

      e. de relatieve omvang van achtergestelde vorderingen zodanig wordt beperkt dat aan het eind van de fondsperiode
      ten hoogste 50 procent van het totaal van de verkrijgingsprijs van alle participaties betrekking heeft op
      achtergestelde vorderingen;

      f. de participaties verkregen worden in kennisstarters waarvan de rentabiliteits- en continuïteitsperspectieven ten
      minste redelijk zijn;

      g. bij de beslissing van het thematisch technology transferfonds inzake de verkrijging van een participatie
      rekening wordt gehouden met het ondernemingsplan van de desbetreffende kennisstarter;

      h. de participaties verkregen worden in kennisstarters waaraan niet eerder door een participatiemaatschappij
      risicokapitaal in de vorm van aandelen of een aan eigen vermogen gelijk te stellen lening is verstrekt, behoudens
      indien:

      1°. deze participatiemaatschappij een ander thematisch technology transferfonds is en voor zover het totaal
      aan verkrijgingsprijzen van de participaties die alle thematisch technology transferfondsen gezamenlijk in de
      kennisstarter investeren, niet boven € 1.500.000 uitkomt;

      2°. deze participatiemaatschappij, niet zijnde een thematisch technology transferfonds, een aan eigen vermogen
      gelijk te stellen lening voor Proof of Concept doeleinden heeft verstrekt, voor zover het totaal aan risicokapitaal
      dat verstrekt is aan de kennisstarter door alle participatiemaatschappijen en het thematisch technology
      transferfonds gezamenlijk het totale bedrag aan risicofinanciering, bedoeld in artikel 21, negende lid, van de
      algemene groepsvrijstellingsverordening niet overschrijdt;

      3°. deze participatiemaatschappij een informal investor is;

      i. de begeleidingskosten in totaal ten hoogste 10 procent bedragen van het investeringsbudget;

      j. de fondsbeheerder geen vergoeding voor de begeleiding van kennisstarters bedingt die hoger is
      dan hetgeen in de markt gebruikelijk is, waarbij de betrekking in ieder geval tijdelijk is en de
      vergoeding berekend is op basis van een uurtarief dat gebaseerd is op het gebruikelijk loon, bedoeld in
      [artikel 12a, eerste lid, van de Wet op de loonbelasting 1964][ref3];

      k. de fondsbeheerder voor zijn werkzaamheden een marktconforme prestatieafhankelijke beloning verkrijgt.


