  - number: 4.5.1
    text: |-
      In deze titel wordt verstaan onder:

        - *aansluiting op een warmtenet:* individuele of centrale aansluiting op een warmtenet;
        - *bouwbedrijf:* bedrijf dat in een handelsregister van een lidstaat van de Europese Unie of een van de overige
      staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte is ingeschreven in de sectie
      bouwnijverheid of een vergelijkbare sectie;
        - *bouwinstallatiebedrijf:* bedrijf dat in een handelsregister van een lidstaat van de Europese Unie of een van de
      overige staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte is ingeschreven in de
      sectie bouwinstallatiebedrijf of een vergelijkbare sectie;
        - *centrale aansluiting op een warmtenet:* centrale aansluiting als bedoeld in
      [artikel 1, eerste lid, van de Warmtewet][ref1];
        - *eigenaar-bewoner:* natuurlijke persoon die: a. een woning in eigendom heeft waarin hij zijn hoofdverblijf
      heeft of direct na renovatie van deze woning zal hebben; of b. gerechtigde is van een bestaand appartementsrecht
      als bedoeld in [artikel 106, eerste lid, van Boek 5 van het Burgerlijk Wetboek][ref2] en in het desbetreffende
      appartement zijn hoofdverblijf heeft of direct na renovatie van dat appartement zal hebben;
        - *etiket:* gedrukt etiket als bedoeld in artikel 3, eerste lid, onderdeel a, van verordening (EU) nr. 811/2013 of
      artikel 3, eerste lid, onderdeel a, van verordening (EU) nr. 812/2013;
        - *gebouw:* gebouw als bedoeld in [artikel 1 van de Woningwet][ref3] of een aan de grond gebonden overkapping ten
      behoeve van het tegen weersinvloeden beschermd parkeren van voertuigen;
        - *HR++ glas:* glas met een maximale U-waarde van 1,2 W/m2K;
        - *individuele aansluiting op een warmtenet:* individuele aansluiting als bedoeld in
      [artikel 1, eerste lid, van de Warmtewet][ref4];
        - *isolerende kozijnpanelen:* kozijnpanelen met minimaal dezelfde U-waarde als de glassoort waarmee deze worden
      gecombineerd in kozijnen;
        - *koopwoning:* woning van een eigenaar-bewoner;
        - *meldcode:* code beschikbaar gesteld door de minister: a. per type en merk installatie voor de productie van
      duurzame energie; b. per soort isolatiemateriaal voor energiebesparende isolatiemaatregelen;
        - *prestatieverklaring:* prestatieverklaring of kwaliteitsverklaring als bedoeld in
      [artikel 1.8 van het Bouwbesluit 2012][ref5];
        - *productkaart:* productkaart als bedoeld in artikel 3, eerste lid, onderdeel b, van verordening (EU) nr. 811/2013
      of artikel 3, eerste lid, onderdeel b, van verordening (EU) nr. 812/2013;
        - *ruimteverwarmingstoestel:* ruimteverwarmingstoestel met warmtepomp als bedoeld in bijlage I, onderdeel 3 of
      onderdeel 4, van verordening (EU) nr. 811/2013, niet zijnde een lucht-luchtwarmtepomp;
        - *technische documentatie:* technische documentatie als bedoeld in artikel 3, eerste lid, onderdeel c, en bijlage
      V van verordening (EU) nr. 811/2013 of artikel 3, eerste lid, onderdeel c, en bijlage V van verordening (EU) nr.
      812/2013;
        - *thermisch vermogen bij bivalente temperatuur:* thermisch vermogen bij bivalente temperatuur als bedoeld in tabel
      8 van bijlage V van verordening (EU) nr. 811/2013;
        - *thermisch vermogen bij referentieontwerptemperatuur:* thermisch vermogen bij referentieontwerptemperatuur als
      bedoeld in tabel 10 van bijlage VII van verordening (EU) nr. 811/2013;
        - *triple-glas:* glas met een maximale U-waarde van 0,7 W/m2K;
        - *verordening (EU) nr. 305/2011:* verordening (EU) nr. 305/2011 van het Europees parlement en de Raad van 9 maart
      2011 tot vaststelling van geharmoniseerde voorwaarden voor het verhandelen van bouwproducten en tot intrekking van
      [Richtlijn 89/106/EEG](31989L0106) van de Raad van de Europese Unie (PbEU 2011, L 88/5);
        - *verordening (EU) nr. 811/2013:* verordening (EU) nr. 811/2013 van de Commissie van 18 februari 2013 ter
      aanvulling van [Richtlijn 2010/30](32010L0030)/EU van het Europees parlement en de Raad wat de energie-etikettering
      van ruimteverwarmingstoestellen, combinatieverwarmingstoestellen, pakketten van ruimteverwarmingstoestellen,
      temperatuurregelaars en zonne-energie-installaties en pakketten van combinatieverwarmingstoestellen,
      temperatuurregelaars en zonne-energie-installaties betreft (PbEU 2013, L 239);
        - *verordening (EU) nr. 812/2013:* verordening (EU) nr. 812/2013 van de Commissie van 18 februari 2013 ter
      aanvulling van [Richtlijn 2010/30](32010L0030)/EU van het Europees parlement en de Raad wat de energie-etikettering
      van waterverwarmingstoestellen, warmwatertanks en pakketten van waterverwarmingstoestellen en zonne-energie-
      installaties betreft (PbEU 2013, L 239);
        - *warmteleverancier:* leverancier als bedoeld in [artikel 1, eerste lid, van de Warmtewet][ref6];
        - *warmtenet:* warmtenet als bedoeld in [artikel 1, eerste lid, van de Warmtewet][ref7];
        - *waterverwarmingstoestel:* waterverwarmingstoestel met warmtepomp als bedoeld in artikel 2, onderdeel zeventien,
      van verordening (EU) nr. 812/2013;
        - *woning:* a. bestaande gebouwde onroerende zaak, die een zelfstandige woongelegenheid
      vormt alvorens investering plaatsvindt en in de basisregistratie, bedoeld in
      [artikel 2 van de Wet basisregistratie adressen en gebouwen][ref8], met een woonfunctie is geregistreerd; dan
      wel b. bestaand appartement, dat een zelfstandige woongelegenheid vormt alvorens investering plaatsvindt en
      in de basisregistratie, bedoeld in [artikel 2 van de Wet basisregistratie adressen en gebouwen][ref9], met een
      woonfunctie is geregistreerd.


