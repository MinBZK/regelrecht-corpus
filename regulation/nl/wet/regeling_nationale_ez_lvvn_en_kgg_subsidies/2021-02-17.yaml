  - number: 3.10.12d
    text: |-
      De geldlening die op grond van de overeenkomst van geldlening ten hoogste kan worden geleend, bedraagt maximaal 50
      procent van het investeringsbudget.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.10.12d
  - number: 3.10.12e
    text: Het maximum subsidiebedrag bedraagt € 1.000.000 per subsidieontvanger.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.10.12e
