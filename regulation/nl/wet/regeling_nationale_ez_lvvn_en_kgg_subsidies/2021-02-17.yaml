  - number: 4.3.1
    text: |-
      In deze titel wordt verstaan onder:

        - *aardwarmte:* aardwarmte in de zin van [artikel 1, onderdeel b, van de Mijnbouwwet][ref1];
        - *aardwarmteproject:* mogelijk maken van de winning en toepassing van aardwarmte met een diepte van de top van de
      aquifer van ten minste 500 meter tot ten hoogste 3500 meter, door het boren van een doublet of een half doublet;
        - *alternatiefwerkzaamheden:* activiteiten om het alternatief gebruik van een put met een lager dan verwacht
      gerealiseerd vermogen in MW mogelijk te maken;
        - *alternatief gebruik:* gebruik van een aardwarmteput voor andere doeleinden dan het overeenkomstig de aanvraag
      winnen en toepassen van aardwarmte;
        - *diep aardwarmteproject:* mogelijk maken van de winning en toepassing van aardwarmte vanaf ten minste 3500 meter
      diepte van de top van de aquifer door het boren van een doublet of een half doublet;
        - *doublet:* productieput en injectieput;
        - *droge exploratieput:* put voor olie- of gasexploratie waar geen koolwaterstoffen in vrije fase zijn aangetroffen
      in de aquifer die gebruikt gaat worden voor de winning van aardwarmte;
        - *geologisch onderzoek:* geologisch onderzoek, inclusief het rapport opgesteld overeenkomstig het model in
      [bijlage 4.3.1][ref2];
        - *geologisch risico:* risico op een te laag gerealiseerd vermogen voor zover dit te wijten is aan specifieke
      aquifer parameters bestaande uit: a. de bruto aquiferdikte, b. de netto-bruto verhouding van de aquifer, c. de
      aquifer permeabiliteit, d. de diepte van de top van de aquifer, e. de saliniteit van het formatiewater, of f. de
      geothermische gradient;
        - *gerealiseerde subsidiabele kosten:* rechtstreeks aan het aardwarmteproject toe te rekenen, door de
      subsidieontvanger gemaakte en betaalde subsidiabele kosten;
        - *gerealiseerd vermogen:* uit de puttest gebleken werkelijke vermogen in MW, met een correctie op skin = 0;
        - *half-doublet:* eerste of tweede put van een doublet, of vervolgput;
        - *maximale subsidiebedrag:* in de beschikking tot subsidieverlening vermelde maximale subsidiebedrag, bestaande
      uit 85 procent van de verwachte subsidiabele kosten met een maximum van € 7.225.000 voor een aardwarmteproject en
      € 12.750.000 voor een diep aardwarmteproject;
        - *niet-geologische parameters:* niet-geologische parameters, genoemd in de tabel in hoofdstuk 1, paragraaf 1.1,
      van het geologisch onderzoek;
        - *puttest:* test van het vermogen van de put of putten met als resultaat meetreeksen plus interpretatie,
      uitgevoerd en geïnterpreteerd overeenkomstig [bijlage 4.3.2][ref3];
        - *putstimulatie:* uitvoeren van technieken die leiden tot een verlaagde weerstand voor het toestromen van
      vloeistof van het reservoir naar de put of vice versa, zodat de productiviteit of injectiviteit van de put wordt
      verhoogd;
        - *restwaarde:* opbrengst van het project bij de economisch meest rendabele alternatieve toepassing gedurende 15
      jaar;
        - *verbeterwerkzaamheden:* werkzaamheden aan de productieput, injectieput of pompinstallatie om het gerealiseerde
      vermogen van het doublet in MW te verhogen;
        - *vervolgput:* nieuwe put vanuit of naast een productie- of injectieput van een beëindigd of bestaand
      aardwarmteproject of diep aardwarmteproject die gebruikt wordt voor een bestaand of nieuw aardwarmteproject of
      diep aardwarmteproject;
        - *verwachte subsidiabele kosten:* in de beschikking tot subsidieverlening vermelde subsidiabele kosten;
        - *verwacht vermogen:* n de beschikking tot subsidieverlening vermelde verwacht vermogen in MW.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035474
      [ref3]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.3.1
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0035474
      - id: ref3
        bwb_id: BWBR0035474
  - number: 4.3.2
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan degene die in Nederland uitvoert:

      a. een aardwarmteproject;

      b. een diep aardwarmteproject.

      2 De minister verdeelt het subsidieplafond voor aardwarmteprojecten, respectievelijk het subsidieplafond voor diep
      aardwarmteprojecten, in de volgorde van binnenkomst van de aanvragen.

      3 Indien blijkt dat het totale bedrag van de te verlenen subsidies voor projecten als bedoeld in het eerste
      lid, onderdeel a, respectievelijk het eerste lid onderdeel b, lager is dan het subsidieplafond dat voor de
      desbetreffende soort projecten is vastgesteld, wordt het voor de ene soort project overblijvende bedrag zo nodig
      aan het subsidieplafond voor de andere soort project toegevoegd.

      4 De subsidie wordt verstrekt onder de opschortende voorwaarde dat door het geologische risico op het beoogde
      stratigrafische niveau op de beoogde locatie en bij de in de beschikking tot subsidieverlening vermelde niet-
      geologische parameters, het gerealiseerd vermogen lager is dan het verwacht vermogen.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.3.2
  - number: 4.3.3
    text: |-
      1 De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1] is twee jaar.

      2 De minister beslist afwijzend op een aanvraag indien:

      a. uit het geologisch onderzoek blijkt dat de geschatte kans op het realiseren van het verwachte vermogen kleiner
      is dan 90 procent;

      b. op het moment van indiening van de aanvraag om subsidie geen vergunning als bedoeld in
      [artikel 6 van de Mijnbouwwet][ref2] is afgegeven voor het betreffende gebied;

      c. in het projectplan niet aannemelijk is gemaakt dat het aardwarmteproject of diep aardwarmteproject binnen twee
      jaar na voltooiing van de boringen zal leiden tot de start van toepassing van aardwarmte in Nederland;

      d. het verwacht vermogen lager is dan 0,5 MW zonder putstimulatie bij aardwarmteprojecten met een diepte van de top
      van de aquifer van ten minste 500 meter tot ten hoogste 1.500 meter;

      e. het verwacht vermogen lager is dan 2 MW zonder putstimulatie voor de andere aardwarmteprojecten;

      f. bij een half doublet, als de gegarandeerde put de tweede put van een doublet of een vervolgput betreft, de
      resultaten van de eerste put aardwarmtewinning niet aannemelijk maken;

      g. bij een half doublet, als de gegarandeerde put de tweede put van een doublet betreft, de eerste put van een
      doublet geen droge exploratieput of geen bestaande aardwarmteput is.

      3 Bij de beoordeling van de aanvragen wint de minister advies in van TNO.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel6
