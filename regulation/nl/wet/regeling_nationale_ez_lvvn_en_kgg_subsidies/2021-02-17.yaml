  - number: 4.4.7
    text: De minister verdeelt het subsidieplafond evenredig over de ingediende aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.4.7
  - number: 4.4.8
    text: |-
      1 De afwijzingsgronden, genoemd in [artikel 23, onderdelen a tot met h, van het besluit][ref1] zijn niet van
      toepassing.

      2 De minister beslist afwijzend op een aanvraag om subsidie indien:

      a. de subsidieaanvrager geen deelnemer is aan een convenant, waarin de subsidieaanvrager in het kader van
      met de minister, de Minister van Financiën en de Minister van Infrastructuur en Waterstaat gemaakte afspraken
      verplichtingen op zich heeft genomen ter verbetering van de energie-efficiëntie;

      b. de subsidieaanvrager de minister niet voor 16 april van het jaar van aanvraag heeft gerapporteerd over de
      voortgang van de uitvoering van het door de minister van een positief advies voorzien energie-efficiëntieplan; en

      c. de subsidieaanvrager:

      1°. de in het energie-efficiëntieplan vastgelegde maatregel ter verbetering van de energie-efficiëntie voor het
      jaar voorafgaand aan het jaar van de aanvraag niet heeft gerealiseerd in het voorafgaande jaar;

      2°. geen andere maatregel heeft getroffen tot verbetering van de energie-efficiëntie in het jaar voorafgaand aan
      het jaar van de aanvraag; of

      3°. geen argument heeft aangeleverd dat door de minister als valide wordt aangemerkt voor het niet realiseren van
      de in het energie efficiency plan vastgelegde maatregel tot verbetering van de energie-efficiëntie.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.4.8
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 4.4.9
    text: |-
      Op een subsidie voor de indirecte emissiekosten ETS zijn de [artikelen 37 tot en met 42 van het besluit][ref1] niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel37
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.4.9
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '37'
  - number: 4.4.10
    text: |-
      1 Een aanvraag om subsidie op grond van [artikel 4.4.2][ref1], bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het nummer waarmee de onderneming is
      geregistreerd bij de Kamer van Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. kerngegevens over het project.

      2 De aanvraag voor de vaststelling van een subsidie die krachtens deze titel is verleend bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de aanvrager en het door de minister verstrekte
      referentienummer;

      b. de omvang van de vast te stellen subsidie;

      c. de kerngegevens voor de onderbouwing van de subsidievaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.4.2
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.4.10
