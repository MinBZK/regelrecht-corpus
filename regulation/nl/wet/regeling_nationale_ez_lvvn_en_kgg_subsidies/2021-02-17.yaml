      - id: ref1
        bwb_id: BWBR0035474
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 3.13b.7
        hoofdstuk: '3'
  - number: 3.13b.13
    text: |-
      Deze titel en [bijlage 3.13b.1][ref1] vervallen met ingang van 1 juli 2021, met dien verstande dat deze van
      toepassing blijven op subsidies die voor die datum zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
