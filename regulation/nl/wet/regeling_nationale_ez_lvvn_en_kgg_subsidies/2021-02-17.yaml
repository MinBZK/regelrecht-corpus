  - number: B3.13b.1:7
    text: |-
      1 De financier draagt er voor zorg dat een administratie wordt gevoerd die zodanig is ingericht, dat daaruit te
      allen tijde op eenvoudige en duidelijke wijze gegevens kunnen worden afgelezen over de verstrekkingen, het beheer
      en de vervreemdingen van gegarandeerde leningen en van ander kapitaal dat zij aan dezelfde ondernemer heeft
      verstrekt. Deze administratie moet ten minste tien jaar na het verstrekken van de lening worden bewaard.

      2 De financier informeert de Staat binnen acht weken nadat de desbetreffende gebeurtenis heeft plaatsgevonden
      schriftelijk over wezenlijke wijzigingen in het financieringsbeleid of de organisatie van de financier en over
      wijzigingen ten aanzien van gegarandeerde leningen, waaronder:

      a. een aflossing van een lening, tenzij deze aflossing overeenkomt met een aflossingsschema waarover de Staat
      eerder is geïnformeerd;

      b. een wijziging van de looptijd van een lening;

      c. de materiële verslechtering van de kredietwaardigheid van de ondernemer.

      3 De financier verstrekt de Staat jaarlijks zijn jaarverslag.

      4 Desgevraagd verstrekt de financier de Staat gegevens en bescheiden over de verstrekkingen, het beheer en
      de vervreemdingen van gegarandeerde leningen en van ander kapitaal dat zij aan dezelfde ondernemer heeft
      verstrekt, en de jaarrekeningen van de ondernemingen waaraan kapitaal is verstrekt, vergezeld van desbetreffende
      accountantsverklaringen als bedoeld in [artikel 393, vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref1] of
      een mededeling waarom deze ontbreekt, en van de bijbehorende toelichtingen voor het bestuur van de onderneming.

      5 De financier doet onverwijld mededeling aan de Staat van de indiening bij de rechtbank van een verzoek tot
      verlening van surséance van betaling aan hem, een verzoek tot faillietverklaring van hem of een verzoek om ten
      aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing te verklaren.


