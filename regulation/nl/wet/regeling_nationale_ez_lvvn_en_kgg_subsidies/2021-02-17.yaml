  - number: B3.25.1:5
    text: |-
      1 De Financier meldt ten minste eens per kwartaal aan de Staat de in dat kwartaal verstrekte kredieten waarop
      deze garantstellingsovereenkomst van toepassing is, onder de gelijktijdige verstrekking van de door de minister
      gevraagde informatie.

      2 De minister bevestigt de ontvangst van een melding binnen 35 dagen na ontvangst.

      3 Voor de toepassing van artikel 3, tweede lid, is de volgorde van ontvangst van de meldingen door de minister
      bepalend.
