  - number: 2.15.6
    text: De termijn, bedoeld in artikel 23, onderdeel b, van het besluit, is drie jaar.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.15.6
  - number: 2.15.7
    text: |-
      De minister beslist afwijzend op een aanvraag om subsidie, indien:

      a. het project niet past binnen:

      1⁰. de doelstelling, bedoeld in artikel 53, tweede lid, onderdeel b, van de algemene
      groepsvrijstellingsverordening, indien de aanvrager niet hoofdzakelijk actief is in de primaire landbouwproductie;

      2⁰. de doelstelling, bedoeld in artikel 14, derde lid, onderdeel d, van de groepsvrijstellingsverordening landbouw,
      indien de aanvrager hoofdzakelijk actief is in de primaire landbouwproductie;

      b. het project niet in overeenstemming is met de wetgeving van de Europese Unie en met de nationale
      milieubeschermingswetgeving als bedoeld in artikel 14, vijfde lid, van de groepsvrijstellingsverordening landbouw;

      c. de verlening van subsidie in strijd zou zijn met de verboden of beperkingen, bedoeld in artikel 14, elfde lid,
      van de groepsvrijstellingsverordening landbouw;

      d. de aanvrager kwalificeert als grote onderneming en hoofdzakelijk actief is in de primaire landbouwproductie;

      e. de aanvrager mede actief is in de primaire landbouwproductie, en niet met passende middelen zoals een scheiding
      van de activiteiten of een uitsplitsing van de kosten kan aantonen dat de subsidie uitsluitend ten goede komt aan
      de natuurherstelmaatregel of natuurherstelmaatregelen, bedoeld in [artikel 2.15.2, eerste lid][ref1];

      f. de aanvrager een publiekrechtelijke rechtspersoon, met uitzondering van een waterschap, is;

      g. de natuurherstelmaatregel of natuurherstelmaatregelen, bedoeld in [artikel 2.15.2, eerste lid][ref2],
      onvoldoende bijdraagt of bijdragen aan de verbetering van de kwaliteit of uitbreiding van het areaal van de typen
      natuurlijke habitats of de habitats van soorten in de Natura 2000-gebieden;

      h. de natuurherstelmaatregel of natuurherstelmaatregelen, bedoeld in [artikel 2.15.2, eerste lid][ref3], is of
      zijn opgenomen in een beheerplan als bedoeld in [artikel 2.3, eerste lid, van de Wet natuurbescherming][ref4] om
      te worden uitgevoerd in het tijdvak, bedoeld in artikel 2.3, vierde lid, van de Wet natuurbescherming waarin de
      aanvraag om subsidie is ingediend;

      i. de kwaliteit van het projectplan onvoldoende is;

      j. de subsidiabele kosten minder dan € 25.000 bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.15.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.15.2
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel2.15.2
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel2.3
