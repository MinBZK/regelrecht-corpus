        bwb_id: BWBR0024796
        artikel: '23'
  - number: 4.2.117
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. de kwaliteit van het project onvoldoende is, blijkend uit de uitwerking van aanpak en methodiek, de omgang met
      de risico’s, de uitvoerbaarheid, de deelnemende partijen of de mate waarin de beschikbare middelen effectief en
      efficiënt worden ingezet;

      b. het project onvoldoende aandacht besteedt aan het creëren van flexibiliteit in het energiesysteem, aan een of
      meer mogelijke verdienmodellen, en aan de niet-technologische factoren die een rol kunnen spelen bij de toepassing
      van innovaties in de markt en de wijze waarop daarmee wordt omgegaan;

      c. in onvoldoende mate is voorzien in een kwalitatief goede kennisverspreiding;

      d. in geval van een samenwerkingsverband, de samenwerking onvoldoende evenwichtig is, blijkend uit:

      1°. de verdeling van de kosten tussen de deelnemers, of

      2°. de verhouding tussen private en publieke financiering van het project;

      e. het projectplan niet in voldoende mate de vervolgstappen beschrijft die na afloop van het project bij een
      positief resultaat gezet zullen gaan worden om tot uitvoering en implementatie van hetgeen onderzocht is te komen;

      f. de aanvraag betrekking heeft op een vergelijkbare studie en deze is gedaan door een onderneming die deze studie
      zelfstandig uitvoert of één of meerdere deelnemers in een samenwerkingsverband die een onderneming in stand houdt
      dan wel houden, die actief is respectievelijk zijn in:

      1°. de sector visserij en aquacultuur;

      2°. de primaire productie van landbouwproducten; of

      3°. de sector verwerking en afzet van landbouwproducten in de gevallen, bedoeld in artikel 1, eerste lid, onder c,
      van de algemene de-minimisverordening;

      g. de aanvraag betrekking heeft op een vergelijkbare studie en deze ziet op activiteiten die direct verband houden
      met:

      1°. de omvang van de uitvoer naar andere lidstaten van de Europese Unie of derde landen;

      2°. het oprichten en exploiteren van een distributienet ten behoeve van de uitvoer; of

      3°. andere lopende uitgaven direct verband houdend met activiteiten op het gebied van uitvoer.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.2.117
  - number: 4.2.117a
    text: |-
      1 Onverminderd [artikel 4.2.3, eerste en tweede lid][ref1], bevat een aanvraag om subsidie voor een vergelijkbare
      studie ten minste een verklaring de-minimissteun van een onderneming die deze studie zelfstandig uitvoert of van
      elke deelnemer in het samenwerkingsverband dat een vergelijkbare studie uitvoert.

      2 Tegelijkertijd met de aanvraag tot subsidievaststelling, geeft de subsidieontvanger door middel van een verslag
      tenminste inzicht in:

      a. de vervolgstappen die het samenwerkingsverband gaat zetten na afloop van het project om tot uitvoering en
      implementatie in de markt van wat onderzocht is te komen;

      b. de verwachte CO-reductie die zou ontstaan bij uitvoering en implementatie in de markt van wat onderzocht is.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.2.3
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.2.117a
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 4.2.3
        hoofdstuk: '4'
        paragraaf: 4.2.1
  - number: 4.2.118
    text: |-
      Het eindverslag dat bij de aanvraag voor subsidievaststelling wordt ingediend, bedoeld in
      [artikel 50, tweede lid, onderdeel a van het besluit][ref1], geeft in ieder geval inzicht in:

      a. de financiële of economische kansen, inclusief een of meer mogelijke verdienmodellen die noodzakelijk zijn om
      het concept of de technologie succesvol toe te kunnen passen;

      b. de niet-technologische factoren die een rol kunnen spelen bij de toepassing van het concept of de technologie in
      de markt en de wijze waarop daarmee wordt omgegaan;

      c. indien het project een technologieontwikkeling betreft: de inbedding van de technologie in de
      energiewaardeketen;

      d. de opschalingsmogelijkheden en het herhaalpotentieel van wat onderzocht is;

      e. indien het een haalbaarheidsstudie binnen de programmalijn CCUS, bedoeld in [bijlage 4.2.16][ref2],
      betreft, voor zover van toepassing, een algemene en technische omschrijving van de onderzochte installaties en
      infrastructuur, een exploitatieberekening inclusief de financiële parameters van het onderzochte project, de
      investeringskosten per component van het onderzochte project, de kostenopbouw toegespitst op de verschillende
      kostencomponenten, inclusief risico-opslag, en een overzicht van alle kosten en baten.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.2.118
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0035474
  - number: 4.2.119
    text: |-
      1 De subsidie voor een milieustudie bevat staatssteun en wordt gerechtvaardigd door artikel 49 van de algemene
      groepsvrijstellingsverordening.

      2 De subsidie voor de haalbaarheidsstudies bevat staatssteun en wordt gerechtvaardigd door artikel 25 van de
      algemene groepsvrijstellingsverordening.

      3 De subsidie voor een vergelijkbare studie bevat staatssteun en wordt gerechtvaardigd door de algemene de-
      minimisverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.2.119
  - number: 4.2.120
    text: |-
      1 In deze paragraaf wordt verstaan onder:

        - *ERA-NET energiecall:* gezamenlijke oproep van deelnemende lidstaten voor aanvragen voor ERA-NET
      energieprojecten, genoemd in de ministeriële regeling, bedoeld in [artikel 16 van het besluit][ref1], gedurende de
      daarin genoemde openstellingsperiode;
        - *ERA-NET energieproject:* internationaal project bestaande uit fundamenteel onderzoek voor zover het niet-
      economische activiteiten van onderzoeksorganisaties betreft, industrieel onderzoek, experimentele ontwikkeling,
      een energiedemonstratieproject of een combinatie van deze vormen, dat is ingediend op grond van een ERA-NET
      energiecall;
        - *internationale expert-panel:* panel als bedoeld in de ERA-NET energiecall, dat de ERA-NET energieprojecten
      beoordeelt;
        - *internationale rangschikking:* rangschikking van de aanvragen voor een ERA-NET energieproject door het
      internationale expert-panel;
        - *internationale voorselectie:* voorselectie van de conceptaanvragen voor een ERA-NET energieproject door de
      lidstaten als bedoeld in de ERA-NET energiecall.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel16
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.2.120
