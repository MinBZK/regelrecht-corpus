  - number: 2.2.33
    text: |-
      1 De minister kent aan een aanvraag van een investeringsproject:

      a. drie punten toe, in het geval een investering bestemd is voor een veehouderijlocatie die zich bevindt in een
      pluimveedicht gebied als bedoeld in [bijlage 2.2.3][ref1];

      b. per stalsysteem van een veehouderijlocatie:

      1°. één punt toe, in het geval een investering bestemd is voor een nieuw te bouwen type stalsysteem;

      2°. twee punten toe, in het geval een investering bestemd is voor een bestaand type stalsysteem.

      2 Het aantal punten dat op grond van het eerste lid, onderdeel b aan een investeringsproject wordt toegekend, wordt
      gedeeld door het aantal stalsystemen waarop de aanvraag voor subsidie betrekking heeft.

      3 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan een
      aanvraag van een investeringsproject zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.2.33
