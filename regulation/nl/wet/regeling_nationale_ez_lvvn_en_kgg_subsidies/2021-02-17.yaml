  - number: 2.2.8
    text: |-
      1 Een aanvraag voor subsidie bevat ten minste de gegevens:

      a. bedoeld in artikel 6, tweede lid, van de algemene groepsvrijstellingsverordening en artikel 6, tweede
      lid, van de groepsvrijstellingsverordening landbouw, indien een innovatieproject de drie fases, bedoeld in
      [artikel 2.2.2, tweede lid, onderdeel a][ref1], betreft;

      b. bedoeld in artikel 6, tweede lid, van de groepsvrijstellingsverordening landbouw, indien het innovatieproject
      uitsluitend de emissiemetingenfase, bedoeld in [artikel 2.2.2, onderdeel b][ref2], betreft.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie ten minste:

      a. gegevens over de aanvrager, waaronder het nummer waarmee de onderneming is geregistreerd bij de Kamer van
      Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. kerngegevens over het project;

      d. de gegevens over de onderzoeks- en ontwikkelingsfase, bedoeld in [artikel 2.2.13][ref3], indien een
      innovatieproject de drie fases, bedoeld in [artikel 2.2.2, tweede lid, onderdeel a][ref4], betreft.

      3 De aanvraag gaat vergezeld van een projectomschrijving en een begroting.

      4 De projectomschrijving bevat in ieder geval een onderbouwing van de reductie van broeikasgasemissies of
      stalemissies die met het innovatieproject op een veehouderijlocatie wordt beoogd te realiseren.

      5 De begroting bevat ten minste:

      a. de omvang van de gevraagde subsidie;

      b. de totale kosten van:

      1°. indien een innovatieproject de drie fases, bedoeld in [artikel 2.2.2, tweede lid, onderdeel a][ref5],
      betreft: de investeringen, managementmaatregelen of combinatie hiervan, bedoeld in [artikel 2.2.10][ref6], en de
      emissiemetingen, bedoeld in [artikel 2.2.15][ref7];

      2°. indien het innovatieproject uitsluitend de emissiemetingenfase, bedoeld in [artikel 2.2.2][ref8], onderdeel b,
      betreft: de emissiemetingenfase, bedoeld in [artikel 2.2.15][ref9];

      c. onderbouwde informatie over de wijze waarop de deelnemers van het samenwerkingsverband hun eigen aandeel in de
      projectkosten financieren.


