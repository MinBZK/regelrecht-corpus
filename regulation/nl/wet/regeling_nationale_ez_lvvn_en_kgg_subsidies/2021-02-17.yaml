  - number: 2.2.5
    text: |-
      1 Met de uitvoering van de op grond van deze paragraaf gesubsidieerde innovatieprojecten wordt gestart binnen drie
      maanden na de subsidieverlening.

      2 De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is:

      a. vijf jaar, indien een innovatieproject de drie fases, bedoeld in [artikel 2.2.2, tweede lid, onderdeel a][ref2],
      betreft;

      b. twee jaar, indien het innovatieproject uitsluitend de emissiemetingenfase, bedoeld in
      [artikel 2.2.2, onderdeel b][ref3], betreft.


