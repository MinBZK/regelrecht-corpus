  - number: B3.13b.1:4
    text: |-
      1 De financier stelt de Staat in kennis van een voorgenomen verstrekking van een lening met gebruikmaking van
      een formulier, overeenkomstig een model dat als bijlage bij deze overeenkomst is gevoegd, onder bijvoeging van de
      bescheiden, genoemd in het model.

      2 Indien de verstrekking van de lening naar het oordeel van de Staat voldoet aan de in artikel 3 bedoelde
      voorwaarden, geldt de garantstelling op grond van deze overeenkomst voor deze lening. De Staat bericht hierover
      de financier binnen drie weken na ontvangst van de aanmelding onder vermelding van de omvang, duur en provisie
      van de garantie. De minister kan, in afwijking van het voorstel van de financier, een hoger tarief van de provisie
      vaststellen indien de door de financier voorgestelde provisie, zoals bedoeld in artikel 6.1, naar het oordeel van
      de Minister te laag is in relatie tot het risico.

      3 De garantie wordt afgegeven onder de opschortende voorwaarde dat een door partijen gesloten overeenkomst over de
      in het eerste lid bedoelde voorgenomen verstrekking aan de Staat wordt overgelegd en dat ook dan wordt voldaan aan
      de in artikel 3 bedoelde voorwaarden.

      4 Indien de lening niet meer bedraagt dan € 25.000.000, kan de minister, in afwijking van het eerste tot en met
      derde lid, de financier schriftelijk meedelen dat in de daarin genoemde omstandigheden en onder de daarin genoemde
      voorwaarden, de volgende procedure wordt gevolgd:

      a. de financier meldt de lening waarop deze overeenkomst van toepassing is binnen 35 dagen na het sluiten van
      de leningsovereenkomst aan de Staat onder de gelijktijdige verstrekking van de door de minister vastgestelde
      informatie;

      b. de minister bevestigt de ontvangst van een melding binnen 35 dagen na ontvangst;

      c. voor de toepassing van [artikel 3.13b.8][ref1] van de Regeling nationale EZK- en LNV-subsidies, is de volgorde
      van ontvangst van de meldingen door de minister bepalend.


