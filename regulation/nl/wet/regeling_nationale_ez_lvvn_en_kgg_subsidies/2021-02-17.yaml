        artikel: 2.4.14
        hoofdstuk: '2'
        paragraaf: 2.4.4
  - number: 2.4.18
    text: De bedrijfsadviseur draagt de voucher over aan de in de aanvraag opgenomen kennisinstelling.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.18
  - number: 2.4.19
    text: |-
      Subsidie wordt verstrekt aan een kennisinstelling die een opleiding heeft verstrekt aan een bedrijfsadviseur en in
      verband daarmee een geldige voucher overlegt.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.19
  - number: 2.4.20
    text: De subsidie bedraagt ten hoogste 50% van de subsidiabele kosten en niet meer dan € 1.250,– per voucher.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.20
  - number: 2.4.21
    text: |-
      Voor subsidie komen in aanmerking:

      a. personeelskosten van de opleiders als bedoeld in artikel 31, derde lid, onderdeel a, van de algemene
      groepsvrijstellingsverordening;

      b. rechtstreeks met het opleidingsproject verband houdende operationele kosten als bedoeld in artikel 31, derde
      lid, onderdeel b, van de algemene groepsvrijstellingsverordening, met uitzondering van materiaalkosten.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.21
  - number: 2.4.22
    text: |-
      1 Een aanvraag voor subsidie wordt na afloop van de opleiding door de kennisinstelling ingediend.

      2 De aanvraag moet binnen een jaar na de dagtekening van de aan de bedrijfsadviseur verstrekte voucher zijn
      ontvangen. Op een voor het einde van de termijn daartoe ingediend verzoek kan de minister besluiten deze termijn
      eenmalig te verlengen met ten hoogste zes maanden.

      3 Indien de aanvraag niet binnen de termijn, bedoeld in het tweede lid, door de minister is ontvangen, vervalt de
      voucher van rechtswege.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.22
  - number: 2.4.23
    text: |-
      De subsidie, bedoeld in [artikel 2.4.19][ref1], bevat staatssteun en wordt gerechtvaardigd door artikel 31 van de
      algemene groepsvrijstellingsverordening.


