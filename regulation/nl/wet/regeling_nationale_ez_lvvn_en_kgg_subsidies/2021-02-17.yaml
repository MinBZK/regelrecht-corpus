    text: |-
      1 Er is een Adviescommissie Natuurherstelmaatregelen die tot taak heeft de minister op zijn verzoek te adviseren
      omtrent de afwijzingsgronden, bedoeld in artikel 23, aanhef en onderdelen b en d tot en met g van het besluit en
