  - number: 3.3.11
    text: |-
      1 De subsidie, bedoeld in [artikel 3.3.4][ref1], bevat geen staatssteun.

      2 De subsidie, bedoeld in [artikel 3.3.6][ref2], bevat staatssteun en wordt gerechtvaardigd door artikel 28 van de
      algemene groepsvrijstellingsverordening.


