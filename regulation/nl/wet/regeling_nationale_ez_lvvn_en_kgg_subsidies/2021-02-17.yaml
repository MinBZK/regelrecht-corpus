  - number: 3.5.21
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is twee jaar en wordt gerekend vanaf de
      aanvang van de activiteiten, bedoeld in [artikel 3.5.17, eerste lid][ref2].


