  - number: 3.22.11
    text: |-
      Het model voor de overeenkomst van geldlening, bedoeld in [artikel 3.22.2, vijfde lid][ref1], is opgenomen in
      [bijlage 3.22.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.22.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.22.11
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.22.2
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0035474
  - number: 3.22.12
    text: |-
      1 De subsidie voor de activiteiten, bedoeld in [artikel 3.22.2, derde lid][ref1], bevat geen staatssteun.

      2 De subsidie voor de activiteiten, bedoeld in [artikel 3.22.2, vierde lid, onderdeel a][ref2], bevat staatssteun
      en wordt gerechtvaardigd door artikel 21 van de algemene groepsvrijstellingsverordening.

      3 De subsidie voor de activiteiten, bedoeld in [artikel 3.22.2, vierde lid, onderdeel b][ref3], bevat staatssteun
      en wordt gerechtvaardigd door de algemene de-minimisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.22.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.22.2
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.22.2
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.22.12
