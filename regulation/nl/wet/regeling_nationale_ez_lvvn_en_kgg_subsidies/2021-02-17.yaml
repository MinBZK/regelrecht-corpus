  - number: B3.25.1:4
    text: |-
      Ten tijde van het sluiten van een kredietovereenkomst uit hoofde waarvan een garantstellingskrediet aan een MKB-
      ondernemer wordt verstrekt, moet aan de volgende criteria zijn voldaan:

      a. de MKB-ondernemer heeft verklaard:

      1°. dat het krediet dient ter financiering van het door de MKB-onderneming geleden of te verwachten verlies aan
      inkomsten dat is ontstaan of naar verwachting ontstaat tussen 19 maart 2020 en 30 juni 2021, als gevolg van het
      coronavirus;

      2°. in Nederland te zijn gevestigd en daar een substantieel deel van de activiteiten van de onderneming uit te
      voeren;

      3°. te zijn opgenomen in het Handelsregister van de Kamer van Koophandel, waarbij de registratie is terug te voeren
      naar een datum vóór 1 januari 2019;

      4°. geen aanbieder te zijn als bedoeld in [artikel 1, onderdeel c, van de Wet marktordening gezondheidszorg][ref1];

      5°. geen onderneming in stand te houden waarvan de activiteiten in overwegende mate betrekking hebben op;

        - onroerende zaken voor zover de activiteiten gericht zijn op het behalen van resultaten door waardestijging van
      onroerende zaken zonder dat sprake is van een significante waardetoevoeging door eigen productieve activiteiten;
        - de financiële sector voor zover de ondernemer het bank-, verzekerings- of beleggingsbedrijf uitoefent, of een
      participatiemaatschappij heeft;

      6°. geen onderneming in stand te houden die actief is in:

        - de sector visserij en aquacultuur;
        - de primaire productie van landbouwproducten;
        - de sector verwerking en afzet van landbouwproducten;

      7°. geen onderneming in stand te houden waarvoor de ontvangen steun die wordt gerechtvaardigd door paragraaf 3.1
      van de Tijdelijke kaderregeling inzake staatssteun ter ondersteuning van de economie vanwege de huidige COVID-19-
      uitbraak (PbEU 2020, C 91 I) meer is dan € 800.000,–, waarbij wordt uitgegaan van bruto bedragen;

      8°. niet gelijktijdig met een kredietovereenkomst als bedoeld in [artikel 3.25.2, eerste lid][ref2], van de
      Regeling nationale EZK- en LNV-subsidies een andere kredietovereenkomst met dezelfde financier te hebben gesloten
      of dit voorzienbaar op korte termijn te zullen doen;

      9°. geen onderneming in stand te houden:

        - die al op 31 december 2019 kwalificeerde als een onderneming in moeilijkheden als bedoeld in artikel 2, punt 18,
      van de algemene groepsvrijstellingsverordening;
        - waartegen een collectieve insolventieprocedure loopt; of
        - die voldoet aan de criteria om op verzoek van zijn schuldeisers, aan een collectieve insolventieprocedure te
      worden onderworpen;

      10°. winst te hebben gemaakt in 2019 of gemiddeld genomen over minimaal de laatste twee boekjaren;

      11°. geen onderneming in stand te houden waarmee een kredietovereenkomst is gesloten of waaraan een lening is
      verstrekt met toepassing van de [titels 2.5][ref3], [3.11][ref4], [3.13][ref5], [3.13a][ref6] of [3.13b][ref7];

      12°. geen onderneming in stand te houden waarbij het uitstaand obligo bij financiers en financier-gelieerden na
      verstrekking van het krediet meer is dan € 250.000,– waarbij alle zakelijke financieringen, met uitzondering van
      een zakelijke hypotheek, worden meegenomen.


