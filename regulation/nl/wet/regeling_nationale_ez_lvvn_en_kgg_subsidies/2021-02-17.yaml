        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.7.7
    text: |-
      De minister rangschikt de aanvragen waarop niet afwijzend is beslist overeenkomstig de door de Eurostars High Level
      Group vastgestelde rangschikking.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.7.7
  - number: 3.7.8
    text: |-
      In afwijking van [artikel 39 van het besluit][ref1] brengt de subsidieontvanger steeds na afloop van een periode
      van zes maanden aan de minister schriftelijk verslag uit omtrent de uitvoering van het Eurostarsproject, met
      inbegrip van een vergelijking van die uitvoering met het projectplan en de bij de subsidieverlening vermelde raming
      van de subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel39
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.7.8
