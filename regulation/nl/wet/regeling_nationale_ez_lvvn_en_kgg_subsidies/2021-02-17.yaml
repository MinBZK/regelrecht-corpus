      2 De subsidieontvanger verleent gedurende twee jaar na de datum van de beschikking tot subsidievaststelling
      medewerking aan een evaluatie van de effecten van het door hem uitgevoerde project, bedoeld in
      [artikel 3.21.2][ref1], voor zover deze medewerking redelijkerwijs van hem verlangd kan worden.


