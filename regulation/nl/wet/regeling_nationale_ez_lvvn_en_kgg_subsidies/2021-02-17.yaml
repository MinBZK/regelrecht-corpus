  - number: B3.13b.1:8
    text: |-
      1 De financier kan een beroep doen op de garantie indien zij op een gegarandeerde lening verwacht verlies te
      lijden:

      a. bij gehele of gedeeltelijke vervreemding van de lening;

      b. door gehele of gedeeltelijke kwijtschelding van de lening door de financier;

      c. door het onvermogen van de ondernemer om de lening af te lossen;

      d. als gevolg van een faillietverklaring, een surséance van betaling of een van toepassing verklaren van de
      schuldsaneringsregeling natuurlijke personen met betrekking tot de ondernemer waaraan de lening is verstrekt;

      e. bij een in kracht van gewijsde gegane homologatie van een akkoord na de faillietverklaring, na de verlening van
      surséance van betaling of na het van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen met
      betrekking tot de ondernemer waaraan de lening is verstrekt;

      f. indien de ondernemer een rechtspersoon is, bij ontbinding van de rechtspersoon;

      g. bij wanbetaling onder de lening.

      2 De minister kan het beroep afwijzen of een korting toepassen op het gevraagde bedrag indien in de voorafgaande
      periode van twaalf maanden meer middelen aan de onderneming zijn onttrokken ten behoeve van derden dan noodzakelijk
      voor een redelijk te achten bedrijfsvoering, dan wel een verplichting tot een zodanige onttrekking is aangegaan,
      mits de financier hieraan op enigerlei wijze medewerking heeft verleend.

      3 Bij verlies ingevolge vervreemding van een lening geldt de garantie alleen indien de vervreemding:

      a. na instemming van de Staat plaatsvindt;

      b. gebeurt tegen een prijs die past in het voeren van een actief en winstgericht beleid;

      c. voor zover de financier daarbij de lening geheel of voor een deel overdraagt aan één van zijn aandeelhouders,
      hoofdelijk aansprakelijke vennoten, bestuurders, beheerders of andere betrokkenen, tegen een prijs die is gebaseerd
      op een taxatie van twee onafhankelijke deskundigen, dan wel gepaard gaat met vervreemding van ten minste een derde
      deel van de lening aan onafhankelijke derden.

      4 Bij verlies ingevolge gehele of gedeeltelijke kwijtschelding van een lening geldt de garantie alleen indien
      de kwijtschelding noodzakelijk is voor de continuïteit van de onderneming waarvoor de lening is verstrekt en
      indien rekening is gehouden en wordt gehouden met het belang van de Staat als garantsteller, onder meer door een
      evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de aflossing van bestaande leningen, met
      inachtneming van de eventuele achterstelling en zekerheden die voor de gegarandeerde lening gelden.

      5 Als onvermogen van de ondernemer om de lening af te lossen, bedoeld in het eerste lid, onder c, wordt aangemerkt
      de situatie waarin:

      a. de ondernemer niet in staat is te voldoen aan zijn betalingsverplichtingen;

      b. aannemelijk is dat de ondernemer in de eerstvolgende jaren niet in staat zal zijn te voldoen aan zijn
      betalingsverplichtingen; en

      c. aannemelijk is dat rekening is gehouden en wordt gehouden met het belang van de Staat als garantsteller, onder
      meer door een evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de aflossing van bestaande
      leningen, met inachtneming van de eventuele achterstelling en zekerheden die voor de gegarandeerde lening gelden.

      6 Verlies als gevolg van faillietverklaring, een verlening van surséance van betaling of een van toepassing
      verklaren van de schuldsaneringsregeling natuurlijke personen, bedoeld in het eerste lid, aanhef en onder d, wordt
      aanwezig geacht:

      a. voor zover aannemelijk is dat de financier bij het einde van het faillissement, van de surséance
      onderscheidenlijk van de toepassing van de schuldsaneringsregeling een verlies als bedoeld in het achtste lid zal
      leiden;

      b. mits aannemelijk is dat rekening is gehouden met het belang van de Staat als garantsteller.

      7 De minister kan het beroep afwijzen of een korting toepassen op het gevraagde bedrag indien de financier tekort
      is geschoten bij de naleving van verplichtingen op grond van deze overeenkomst of indien de financier niet kan
      aantonen die maatregelen te hebben genomen die een redelijk handelend en redelijk bekwaam beheerder zou hebben
      genomen in het kader van een actief en winstgericht beleid.

      8 Het verlies wordt berekend op basis van de waarde van de lening of, indien het verlies slechts op een deel van de
      lening is geleden, het hiermee overeenkomende deel van die waarde, in een voorkomend geval verminderd met:

      a. in geval van vervreemding: de prijs waarvoor die vervreemding heeft plaatsgevonden;

      b. in geval van ontbinding: de liquidatie-uitkering;

      c. in geval van homologatie van een akkoord als bedoeld in het eerste lid, onder e, de in het kader van het akkoord
      voor de lening verrichte uitkering.

      9 Indien de financier meermalen gegarandeerde leningen aan een ondernemer heeft verstrekt en slechts op een deel
      daarvan verlies lijdt, wordt het verlies geacht te zijn geleden op de lening die de financier het eerst heeft
      verstrekt.

      10 Indien de financier aan een ondernemer leningen heeft verstrekt die slechts ten dele onder de garantstelling
      zijn gebracht en slechts op een deel daarvan verlies lijdt, wordt het verlies, onverminderd het zesde lid, naar
      rato toegerekend aan de leningen die onder de garantstelling zijn gebracht.

      11 Voor de toepassing van het eerste lid, onderdeel g, is sprake van wanbetaling wanneer een MKB-ondernemer een
      achterstand heeft van meer dan 90 kalenderdagen in de betaling van de lening.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel8
  - number: B3.13b.1:9
    text: |-
      1 De financier verzoekt de Staat binnen zes maanden nadat zich de in artikel 8, eerste lid, bedoelde situatie heeft
      voorgedaan om betaling op grond van de garantie met gebruikmaking van een formulier, overeenkomstig een model dat
      als bijlage bij deze overeenkomst is gevoegd, onder bijvoeging van een kopie van de vervreemdingsovereenkomst, de
      inschrijving in het register van de ontbinding van de rechtspersoon of van de in artikel 8, eerste lid, onderdeel
      e, bedoelde akkoorden en van andere bescheiden als genoemd in het model.

      2 Indien op grond van de feiten die door de financier aan de Staat zijn medegedeeld blijkt dat sprake is van een
      verlies als bedoeld in artikel 8, maakt de financier aanspraak op betaling van 90% van het geleden verlies indien
      de lening is verstrekt aan een MKB-ondernemer en 80% indien deze is verstrekt aan een grote onderneming, tenzij
      de financier in gebreke is gebleven bij de naleving van deze overeenkomst. De Staat bericht hierover de financier
      binnen dertien weken na ontvangst van het betalingsverzoek onder vermelding van het te betalen bedrag.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel9
  - number: B3.13b.1:10
    text: |-
      Alle betalingen in verband met deze overeenkomst door de financier geschieden door overmaking van de betreffende
      bedragen naar rekeningnummer [P.M.] bij de ---bank, ten name van RVO.nl, onder vermelding van het [P.M.] nummer.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel10
  - number: B3.13b.1:11
    text: |-
      1 Overdracht van de rechten en verplichtingen uit hoofde van de garantie op de lening is uitsluitend mogelijk na
      goedkeuring door de minister.

      2 Toestemming door de minister voor de overdracht vindt uitsluitend plaats indien de overdracht plaatsvindt met het
      oogmerk de lening beleenbaar te maken.

      3 De minister kan voorwaarden verbinden aan de goedkeuring.

      4 Verlies ontstaan als gevolg van overdracht, bedoeld in het eerste lid, kan niet gerekend worden tot verlies als
      bedoeld in artikel 8.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel11
  - number: B3.13b.1:12
    text: |-
      1 Reeds uitgekeerde bedragen zijn terstond en zonder enige ingebrekestelling opeisbaar zodra blijkt dat de
      financier zodanig onjuiste of onvolledige informatie heeft verschaft dat de Staat op een verzoek om betaling een
      andere beslissing zou hebben genomen, indien hem de juiste gegevens volledig waren verschaft.

      2 Indien vanwege een verlies als bedoeld in artikel 8, eerste lid, onderdeel c, d of g, een uitkering op grond
      van de garantie heeft plaatsgevonden, is de financier verplicht 90% van de aflossingen die na de uitkering worden
      verricht, indien de lening is verstrekt aan een MKB-ondernemer en 80% indien deze is verstrekt aan een grote
      onderneming, uit te betalen aan de Staat.

      3 Indien de financier na de uitkering op grond van de garantie nog opbrengsten ontvangt die de gegarandeerde lening
      toekomen, is de financier verplicht 90% van deze opbrengsten, indien de lening is verstrekt aan een MKB-ondernemer,
      onderscheidenlijk 80% van deze opbrengsten, indien deze is verstrekt aan een grote onderneming, uit te betalen aan
      de Staat.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel12
  - number: B3.13b.1:12a
    text: |-
      1 Indien de financier de garantie inroept en door de Staat een uitkering is gedaan op grond van de garantie voordat
      alle ten gunste van de financier gevestigde zekerheden zijn uitgewonnen, is de financier gehouden deze zekerheden
      binnen vijf jaar na de uitkering uit te winnen, op dezelfde wijze als de financier zou hebben gedaan indien de
      gegarandeerde lening geheel voor eigen rekening en risico door de financier zou zijn verstrekt.

      2 Indien een verzoek om betaling als bedoeld in artikel 9, eerste lid, is ingediend op een moment waarop de
      uitwinning van de ten gunste van de financier gevestigde zekerheden nog niet is voltooid en ook niet aannemelijk is
      geworden dat geen opbrengsten meer zijn te verwachten die in mindering komen op de gegarandeerde lening, brengt de
      financier de minister ten minste jaarlijks verslag uit over de voortgang van de uitwinning.

      3 De minister kan over het verloop van de uitwinning binnen een door hem te stellen termijn nader gegevens van de
      financier verlangen.

      4 De financier zal, binnen drie maanden nadat alle ten gunste van de financier gevestigde zekerheden zijn
      uitgewonnen, aan de minister verslag uitbrengen en de definitieve afrekening ter goedkeuring aan de minister
      voorleggen.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel12a
  - number: B3.13b.1:13
    text: |-
      1 De Staat is gerechtigd deze overeenkomst schriftelijk op te zeggen indien:

      a. de financier tekort schiet bij de nakoming van één van zijn verplichtingen uit hoofde van deze overeenkomst;

      b. ten aanzien van de financier een verzoek bij de rechtbank is ingediend tot verlening van surseance van betaling,
      een verzoek tot faillietverklaring of een verzoek tot van toepassing verklaring van de schuldsaneringsregeling
      natuurlijke personen of een buitengerechtelijk akkoord aan crediteuren wordt aangeboden;

      c. de financier, in geval deze rechtspersoonlijkheid heeft, is ontbonden;

      d. de bepalingen in [titel 3.13b][ref1] van de Regeling nationale EZK- en LNV-subsidies niet langer verenigbaar
      zijn met de regels van de Europese Unie ten aanzien van staatssteun.

      2 Een opzegging op grond van het eerste lid, onder a, geschiedt uitsluitend nadat de Staat de financier op
      de hoogte heeft gesteld van het voornemen tot opzegging en nadat deze in de gelegenheid is gesteld om een
      tekortschieten dat hersteld kan worden te herstellen binnen een redelijke termijn.

      3 Een opzegging in verband met de in het eerste lid, onderdeel b of d, bedoelde omstandigheid heeft geen gevolgen
      voor de verplichtingen ten aanzien van verstrekkingen van leningen die voor het tijdstip van de opzegging onder de
      garantstelling zijn gebracht.

      4 Een opzegging heeft geen gevolgen voor de verplichtingen ten aanzien van verstrekkingen van leningen die voor het
      tijdstip van de opzegging onder de garantstelling zijn gebracht, indien overdracht van verplichtingen, bedoeld in
      artikel 11, van toepassing is.

      5 De inwerkingtreding van een wijziging van het besluit, of van [titel 3.13b][ref2] van de Regeling nationale EZK-
      en LNV-subsidies leidt terzelfder tijd tot een gelijke wijziging van deze overeenkomst.

      6 Een wijziging als bedoeld in het vijfde lid heeft geen gevolgen ten aanzien van verstrekkingen van leningen die
      voor het tijdstip van de wijziging onder de garantstelling zijn gebracht of voor leningen die zijn of zullen worden
      verstrekt uit hoofde van een overeenkomst die is aangegaan voor het tijdstip van inwerkingtreding van de wijziging.

      7 Het zesde lid is niet van toepassing ten aanzien van de wijzigingen van de artikelen 5, 8, 9, 12 en 12a ingevolge
      de Regeling van de Staatssecretaris van Economische Zaken en Klimaat en de Minister van Landbouw, Natuur en
      Voedselkwaliteit van 9 februari 2021, nr. WJZ/ 20257211, tot wijziging van de Regeling nationale EZK- en LNV-
      subsidies in verband met aanpassing van de garant- en borgstellingsmodules aan Verordening (EU) nr. 575/2013 van
      het Europees Parlement en de Raad van 26 juni 2013 betreffende prudentiële vereisten voor kredietinstellingen en
      beleggingsondernemingen en tot wijziging van Verordening (EU) nr. 648/2012 (PbEU 2013, L 176) (Stcrt. 2021, 6766).


