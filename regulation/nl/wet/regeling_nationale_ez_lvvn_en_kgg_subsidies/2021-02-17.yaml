  - number: 2.4.14
    text: |-
      Een opleidingsvoucher heeft een waarde van ten hoogste € 1.250,– en wordt door de minister aan een bedrijfsadviseur
      op aanvraag verstrekt voor het volgen van de Opleiding bedrijfscoach stikstof in de landbouw bij een
      kennisinstelling.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.14
  - number: 2.4.15
    text: In de aanvraag wordt één kennisinstelling naar keuze opgenomen.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.15
  - number: 2.4.16
    text: |-
      De minister bepaalt op volgorde van binnenkomst aan welke bedrijfsadviseurs binnen het subsidieplafond
      opleidingsvouchers worden verstrekt, uitgaande van de maximumwaarde per voucher.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.16
  - number: 2.4.17
    text: |-
      De minister beslist afwijzend op een aanvraag indien aan de aanvrager al eerder een voucher als bedoeld in
      [artikel 2.4.14][ref1] is toegekend in hetzelfde kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.14
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.17
    references:
