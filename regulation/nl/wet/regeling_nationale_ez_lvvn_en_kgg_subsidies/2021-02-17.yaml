  - number: 4.2.49c
    text: |-
      1 De vooraanmelding, bedoeld in [artikel 4.2.49, onderdeel a][ref1], bevat ten minste een beknopte omschrijving van
      het beoogde MOOI-project waarin de volgende informatie wordt verstrekt:

      a. de onderdelen van de in [bijlage 4.2.6][ref2] opgenomen missie of missies waaraan het MOOI-project invulling
      beoogt te geven en de wijze waarop deze invulling wordt gegeven;

      b. de met het MOOI-project beoogde resultaten per missie;

      c. de beoogde uitvoerende partijen van het MOOI-project;

      d. de verwachte totale kosten van het MOOI-project;

      e. het subsidiebedrag dat naar verwachting nodig is om het MOOI-project te kunnen uitvoeren.

      2 Onverminderd [artikel 4.2.3, eerste en tweede lid][ref3], bevat een aanvraag om subsidie:

      a. gegevens over de grootte van het bedrijf van de aanvrager, indien de aanvrager aanspraak wil maken
      op een verhoogd percentage aan subsidie voor een kleine of middelgrote onderneming als bedoeld in
      [artikel 4.2.45, tweede lid][ref4];

      b. voor zover het overige projectactiviteiten betreft die worden uitgevoerd door ondernemingen, een verklaring de-
      minimissteun van elke onderneming in het samenwerkingsverband die deze activiteiten uitvoert.

      3 De aanvraag gaat vergezeld van:

      a. het advies dat de adviescommissie MOOI op basis van de vooraanmelding heeft uitgebracht;

      b. een projectomschrijving van het MOOI-project dat ten minste de mijlpalen en go/no go momenten van het MOOI-
      project bevat, inclusief meetbare indicatoren;

      c. een financieringsplan, inclusief mijlpalenbegroting;

      d. een beknopte beschrijving van de kennis, ervaring en capaciteiten van de bij de uitvoering van het MOOI-project
      betrokken personen, die relevant is om de kwaliteit van het samenwerkingsverband te kunnen beoordelen;

      e. een plan dat betrekking heeft op de wijze waarop de kennisverspreiding plaatsvindt;

      f. bewijsstukken waaruit de inbreng van alle afzonderlijke deelnemers in een samenwerkingsverband voor de
      uitvoering van het desbetreffende MOOI-project volgt.


