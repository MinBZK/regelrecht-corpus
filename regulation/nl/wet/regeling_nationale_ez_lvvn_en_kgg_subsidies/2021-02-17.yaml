  - number: 2.15.9
    text: |-
      1 Indien voor een project een milieueffectbeoordeling moet worden uitgevoerd als bedoeld in artikel 14, vijfde lid,
      van de groepsvrijstellingsverordening landbouw, is deze beoordeling uitgevoerd of de vergunning voor het betrokken
      project verleend vóór de datum waarop het project van start gaat.

      2 Indien voor een project een toestemming of vergunning van een bestuursorgaan, anders dan bedoeld in het eerste
      lid, vereist is, is deze toestemming of vergunning verleend voor de datum waarop het project van start gaat.

      3 Indien de subsidieontvanger mede actief is in de primaire landbouwproductie, maar als terreinbeheerder
      hoofdzakelijk activiteiten verricht die betrekking hebben op natuurbeheer of natuurherstel, voert de
      subsidieontvanger een zodanige administratie dat met passende middelen zoals een scheiding van de activiteiten
      of een uitsplitsing van de kosten aantoonbaar is dat de subsidie niet ten goede komt aan de primaire
      landbouwproductie.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.15.9
  - number: 2.15.10
    text: |-
      1 Een aanvraag om subsidie bevat ten minste de gegevens, bedoeld in bedoeld in artikel 6, tweede lid, van de
      algemene groepsvrijstellingsverordening en artikel 6, tweede lid, van de groepsvrijstellingsverordening landbouw.

      2 Onverminderd het eerste lid bevat een aanvraag om subsidie ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de aanvrager, voor zover van toepassing het nummer waaronder
      de onderneming is ingeschreven bij de Kamer van Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. in geval van een samenwerkingsverband: gegevens over de contactpersoon bij de penvoerder, waaronder de naam, het
      telefoonnummer, het e-mailadres en het postadres;

      d. kerngegevens over het project;

      e. een projectplan;

      f. een gespecificeerde begroting.

      3 Het projectplan, bedoeld in het tweede lid, onderdeel e, bevat in ieder geval:

      a. de aanduiding van het Natura 2000-gebied waar het project betrekking op heeft;

      b. een kwalitatieve probleemanalyse inclusief onderbouwing;

      c. een omschrijving van de te treffen natuurherstelmaatregelen, inclusief het gebied waar de
      natuurherstelmaatregelen worden uitgevoerd en, indien dit afwijkt, het gebied waar de natuurherstelmaatregelen
      effect hebben, beide weergegeven op een kaart, de frequentie van de natuurherstelmaatregelen en de tijdplanning
      waarbinnen de natuurherstelmaatregelen worden gerealiseerd;

      d. de met de natuurherstelmaatregelen beoogde eindsituatie van het gebied, waarbij ten minste wordt ingegaan
      op: het beoogde habitat, inclusief de oppervlakte en de mate waarin de natuurherstelmaatregelen bijdragen aan de
      verbetering van de kwaliteit of uitbreiding van het areaal van de typen natuurlijke habitats of de habitats van
      soorten in de Natura 2000-gebieden;

      e. een beschrijving van de risico’s en beheersmaatregelen, inclusief een beschrijving van de betrokkenheid van
      andere organisaties bij het project;

      f. een verklaring dat de provincie op wiens grondgebied het project het meeste effect sorteert is geïnformeerd over
      het voorgenomen project.

      4 Voor het maken van de kaart, bedoeld in het derde lid, onderdeel c, wordt gebruik gemaakt van een topografische
      kaart met een schaal van ten hoogste 1:10.000, waarop de grenzen zijn aangegeven van het gebied waar de
      natuurherstelmaatregelen worden uitgevoerd, en, indien dit afwijkt, het gebied waar de natuurherstelmaatregelen
      effect hebben.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.15.10
  - number: 2.15.11
    text: |-
      De subsidie, bedoeld in [artikel 2.15.2][ref1], bevat staatssteun en wordt gerechtvaardigd door artikel 53 van
      de algemene groepsvrijstellingsverordening, voor zover de aanvrager niet hoofdzakelijk actief is in de primaire
      landbouw, en artikel 14 van de groepsvrijstellingsverordening landbouw voor zover de aanvrager hoofdzakelijk actief
      is in de primaire landbouw.


