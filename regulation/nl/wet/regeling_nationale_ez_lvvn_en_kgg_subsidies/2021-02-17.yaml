  - number: 2.3.3a
    text: |-
      Een glastuinbouwonderneming of een glastuinbouwonderneming die deelneemt aan een samenwerkingsverband kan per
      investering als bedoeld in [artikel 2.3.2, eerste lid][ref1], één aanvraag indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.3.2
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.3.3a
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.3.2
        hoofdstuk: '2'
  - number: 2.3.4
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 2.3.2][ref1] bevat ten minste de gegevens, bedoeld in punt 71
      van het landbouwsteunkader.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie ten minste:

      a. gegevens over de aanvrager, waaronder het nummer waaronder de onderneming geregistreerd is bij de Kamer van
      Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. indien van toepassing de topsector waarbinnen het project wordt uitgevoerd;

      d. een begroting waarin de totale kosten van het project en de omvang van de gevraagde subsidie zijn opgenomen.

      3 De aanvraag tot subsidieverlening gaat vergezeld van een kopie van de door beide partijen getekende overeenkomst,
      bedoeld in [artikel 2.3.3, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.3.3
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.3.4
    references:
