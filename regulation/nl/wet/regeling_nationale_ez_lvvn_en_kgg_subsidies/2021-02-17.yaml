      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.11.1
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.11.1
      [ref4]: https://wetten.overheid.nl/BWBR0035474#Artikel3.11.4
