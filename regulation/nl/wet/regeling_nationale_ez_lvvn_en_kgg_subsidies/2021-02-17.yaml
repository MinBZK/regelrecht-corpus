  - number: 4.2.64
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *CO2:* CO of CO equivalent;
        - *CO2-equivalent:* de hoeveelheid CH4, N2O, HFK’s, PFK’s en SF6, die overeenkomstig de factoren in
      [bijlage 4.2.9][ref1], onderdeel A, eenzelfde broeikaseffect oplevert als een massa-eenheid CO;
        - *DEI+-pilot:* een project dat past binnen de in [bijlage 4.2.9][ref2], onderdeel B, opgenomen thema’s bestaande
      uit experimentele ontwikkeling waarbij een experimenteel prototype product, procedé of dienst wordt getest in
      een omgeving die representatief is voor het functioneren onder reële omstandigheden, met als hoofddoel verdere
      technische verbeteringen aan te brengen aan producten, procedés of diensten die niet grotendeels vaststaan;
        - *DEI+-project:* a. een DEI+-demonstratieproject; b. een DEI+-pilot; of c. een combinatie van een
      DEI+-demonstratieproject en een project bestaande uit experimentele ontwikkeling in een andere vorm dan een pilot,
      die past binnen één van de in [bijlage 4.2.9][ref3], onderdeel B, opgenomen thema’s;
        - *DEI+-demonstratieproject:* op bescherming van het milieu gericht samenhangend geheel van activiteiten die een
      technisch en economisch risico inhouden, waarbij die activiteiten bestaan uit het door de aanvrager treffen van CO-
      reducerende maatregelen die passen binnen de in [bijlage 4.2.9][ref4], onderdeel B, opgenomen thema’s, met behulp
      van: a. voor Nederland nieuwe apparaten, systemen of technieken, of b. een voor Nederland nieuwe toepassing van
      apparaten, systemen of technieken.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
      [ref2]: https://wetten.overheid.nl/BWBR0035474
      [ref3]: https://wetten.overheid.nl/BWBR0035474
      [ref4]: https://wetten.overheid.nl/BWBR0035474
