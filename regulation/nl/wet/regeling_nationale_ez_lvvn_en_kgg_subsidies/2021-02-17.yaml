  - number: 3.2.9
    text: |-
      1 De minister verstrekt op aanvraag PPS-toeslag voor de uitvoering van een samenwerkingsproject (PPS-
      projecttoeslag) aan:

      a. een TKI, of

      b. een deelnemer in een samenwerkingsverband, op basis van een aanvraag door een penvoerder namens het
      samenwerkingsverband.

      2 De minister geeft een beschikking op een aanvraag voor PPS-projecttoeslag binnen acht weken na de dag van
      ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.2.9
  - number: 3.2.10
    text: |-
      1 De hoogte van de PPS-projecttoeslag bedraagt:

      a. 30% van de som van de private bijdragen voor de samenwerkingsprojecten die in totaal voor het desbetreffende
      samenwerkingsproject aan onderzoeksinstellingen verschuldigd zullen worden, niet zijnde private bijdragen als
      bedoeld in [artikel 3.2.10a][ref1],

      vermeerderd met

      b. 25% van de som van de private bijdragen, bedoeld in [artikel 3.2.10a][ref2], die in totaal voor het
      desbetreffende samenwerkingsproject aan onderzoeksinstellingen verschuldigd zullen worden.

      2 [Artikel 3.2.3, tweede en zesde lid][ref3], is op de hoogte van de PPS-projecttoeslag van overeenkomstige
      toepassing, met dien verstande dat niet de private bijdrage en de inzet in natura in een jaar, maar de private
      bijdrage en de inzet in natura voor het project als geheel in aanmerking wordt genomen.

      3 De op grond van dit artikel voor PPS-projecttoeslag in aanmerking genomen private bijdragen en inzet in natura
      worden niet tevens in aanmerking genomen voor bepaling van de hoogte van de PPS-programmatoeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.10a
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.10a
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.3
