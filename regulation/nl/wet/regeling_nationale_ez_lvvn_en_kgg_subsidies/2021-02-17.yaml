  - number: 2.14.5
    text: |-
      Een aanvraag voor subsidie wordt ingediend met gebruikmaking van een middel dat hiervoor door de minister
      beschikbaar wordt gesteld en bevat ten minste:

      a. gegevens over de aanvrager, waaronder het nummer waaronder de onderneming geregistreerd is bij de Kamer van
      Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. het aantal zeldzame melkkoeien waarvoor de subsidie aangevraagd wordt;

      d. een verklaring landbouw de-minimissteun.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.14.5
