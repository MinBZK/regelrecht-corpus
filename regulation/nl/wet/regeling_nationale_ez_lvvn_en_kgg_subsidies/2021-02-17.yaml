        bwb_id: BWBR0024796
        artikel: '3'
  - number: 3.5.18
    text: |-
      De subsidie bedraagt:

      a. voor activiteiten als bedoeld in [artikel 3.5.17, eerste lid, aanhef en onderdeel a][ref1], € 3.000 per IPC-
      deelnemer;

      b. voor activiteiten als bedoeld in [artikel 3.5.17, eerste lid, aanhef en onderdeel b][ref2], 35 procent van de
      subsidiabele kosten van de IPC-deelnemer tot een maximum van € 25.000.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.5.17
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.5.17
