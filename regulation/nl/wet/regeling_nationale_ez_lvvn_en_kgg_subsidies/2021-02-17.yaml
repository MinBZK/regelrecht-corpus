  - number: 2.2.7
    text: |-
      1 De minister kent aan een innovatieproject:

      a. een hoger aantal punten toe naarmate:

      1°. het innovatieproject naar verwachting leidt tot een hoger percentage emissiereductie van de relevante
      broeikasgas- of stalemissies voor de betreffende dierlijke sector, uitgaande van de streefwaarden, opgenomen in
      [bijlage 2.2.1][ref1];

      2°. het innovatieproject meer gericht is op vernieuwingen die economisch meer perspectief bieden voor toepassing op
      een veehouderijlocatie;

      3°. het innovatieproject meer bijdraagt aan dierenwelzijn en brandveiligheid op een veehouderijlocatie;

      4°. het innovatieproject vernieuwender is ten opzichte van de internationale stand van onderzoek of techniek;

      b. 15 punten toe, in het geval het aannemelijk is dat de frequentie van de weidegang op een veehouderijlocatie
      gelijk is aan of meer zou bedragen dan 6 uur per dag gedurende minimaal 120 dagen per jaar, indien
      het een innovatieproject ten behoeve van een melkveehouderijonderneming betreft als bedoeld in
      [artikel 2.2.2, eerste lid, onderdeel c][ref2].

      2 De minister kent per subonderdeel van het eerste lid, onderdeel a, ten minste één en ten hoogste vijf punten toe.

      3 Voor de rangschikking wordt het aantal punten gegeven voor het eerste lid, onderdeel a, onder 1°, vermenigvuldigd
      met 3, voor het eerste lid, onderdeel a, onder 2°, vermenigvuldigd met 2, en voor het eerste lid, onderdeel a,
      onder 3° en 4°, telkens vermenigvuldigd met 1, en vervolgens opgeteld.

      4 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      innovatieproject zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.2
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.2.7
