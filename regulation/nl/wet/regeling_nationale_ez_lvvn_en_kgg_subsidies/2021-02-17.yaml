  - number: 2.2.15
    text: |-
      Voor zover de subsidie betrekking heeft op de emissiemetingenfase wordt deze verstrekt aan de onderzoeksorganisatie
      of onderzoeksorganisaties binnen het samenwerkingsverband voor het meten van het effect op de broeikasgasemissies
      en stalemissies op een veehouderijlocatie van:

      a. indien een innovatieproject de drie fases, bedoeld in [artikel 2.2.2, tweede lid, onderdeel a][ref1], betreft:
      de gesubsidieerde investeringen, managementmaatregelen of combinatie hiervan, bedoeld in [artikel 2.2.10][ref2]; of

      b. indien het innovatieproject uitsluitend de emissiemetingenfase, bedoeld in [artikel 2.2.2, onderdeel b][ref3],
      betreft: de gebruikte investeringen, managementmaatregelen of combinatie hiervan die op grond van
      [artikel 2.2.10][ref4] voor subsidie in aanmerking zouden zijn gekomen indien het project betrekking zou hebben
      gehad op de onderzoeks- en ontwikkelingsfase.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.10
