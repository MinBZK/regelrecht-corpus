        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.21.6
    text: |-
      De Minister besluit afwijzend op een aanvraag, indien:

      a. de kwaliteit van het projectplan onvoldoende is;

      b. het projectplan onvoldoende inzicht geeft in de toepassingsmogelijkheden van de projectresultaten bij andere
      ondernemers en de manier waarop toepassing van de projectresultaten gerealiseerd kan worden;

      c. het projectplan onvoldoende inzichtelijk maakt dat het project vernieuwend is voor de bij de aanvraag betrokken
      MKB-ondernemers;

      d. het project naar verwachting onvoldoende bijdraagt aan het doel, genoemd in [artikel 3.21.2, eerste lid][ref1];

      e. de aanvrager bij de aanvraag niet heeft ingestemd met het verlenen van medewerking aan een evaluatie van de
      effecten van deze titel;

      f. het projectplan onvoldoende inzicht geeft in actieve betrokkenheid van MKB-ondernemers bij het project;

      g. de subsidiabele kosten minder bedragen dan € 25.000 per project of in geval de subsidie wordt aangevraagd
      door een deelnemer in een samenwerkingsverband de subsidiabele kosten van één of meerdere deelnemers in dat
      samenwerkingsverband minder bedragen dan € 25.000.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.21.2
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.21.6
