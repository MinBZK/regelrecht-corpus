    text: |-
      De subsidie, bedoeld in [artikel 2.3.2][ref1] bevat staatssteun en wordt gerechtvaardigd door Steunmaatregel
      SA.50448 (2018/N) en paragraaf 1.1.1.1. van het landbouwsteunkader.


