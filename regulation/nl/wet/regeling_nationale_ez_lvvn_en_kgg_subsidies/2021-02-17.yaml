  - number: 3.24.8
    text: |-
      1 De minister kent een aanvraag een hoger aantal punten toe naarmate:

      a. de kwaliteit van het projectplan hoger wordt geacht;

      b. de potentiële impact van de mkb-werkplaats op de regio hoger wordt geacht;

      c. de mkb-werkplaats effectiever bijdraagt aan de digitalisering van mkb-ondernemers;

      d. de mkb-werkplaats meer bijdraagt aan verbetering van het praktijkleren voor de aan de mkb-werkplaats verbonden
      studenten;

      e. de betrokkenheid van partijen in de regio groter is.

      2 Het aantal punten bedraagt bij de onderdelen a, b en e van het eerste lid ten minste één en ten hoogste achttien
      punten, en bij de onderdelen c en d van het eerste lid ten minste één en ten hoogste 23 punten.

      3 De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate in totaal meer punten aan de
      aanvraag zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.24.8
  - number: 3.24.9
    text: |-
      1 Er is een Adviescommissie mkb-werkplaatsen die tot taak heeft de minister op zijn verzoek te adviseren omtrent de
      afwijzingsgronden, bedoeld in de [artikelen 22][ref1] en [23 van het besluit][ref2] en in [artikel 3.24.7][ref3],
      en de rangschikkingscriteria, bedoeld in [artikel 3.24.8][ref4].

      2 De commissie bestaat uit ten minste 3 en ten hoogste 5 leden.

      3 De voorzitter en de andere leden worden benoemd voor een termijn van ten hoogste vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
