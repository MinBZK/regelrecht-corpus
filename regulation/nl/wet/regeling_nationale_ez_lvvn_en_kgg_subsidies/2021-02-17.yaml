  - number: 3.22.8
    text: |-
      1 Een onderzoeksorganisatie investeert alle winst uit de activiteiten, bedoeld in
      [artikel 3.22.2, derde lid][ref1], opnieuw in de primaire activiteiten, bedoeld in paragraaf 2.1.1, onderdeel 19,
      onder a, van het O&O&I-steunkader, van de onderzoeksorganisatie.

      2 Een onderzoeksorganisatie voert met betrekking tot de financiering van en de kosten en inkomsten uit economische
      activiteiten een gescheiden boekhouding.

      3 De activiteiten, bedoeld in [artikel 3.22.2, derde lid][ref2], bevoordelen geen individuele bedrijven.

      4 Opdrachtverlening aan een derde voor de uitvoering van de activiteiten, bedoeld in
      [artikel 3.22.2, derde lid][ref3], of een deel daarvan, vindt plaats op basis van transparante criteria en tegen
      marktconforme tarieven.

      5 De activiteiten, bedoeld in [artikel 3.22.2, derde lid, onderdeel a, onder 2°][ref4], zijn voor een ieder zonder
      onderscheid toegankelijk.

      6 De activiteiten, bedoeld in [artikel 3.22.2, derde lid, onderdeel c][ref5], worden alleen binnen de
      onderzoeksorganisatie zelf uitgevoerd.

      7 De overdracht van of de verlening van gebruiksrechten voor de resultaten van de activiteiten, bedoeld in
      [artikel 3.22.2, derde lid][ref6], gebeurt tegen transparante voorwaarden en marktconforme tarieven, overeenkomstig
      paragraaf 2.2.2, onderdeel 29, van het O&O&I-steunkader.

      8 Indien uit de activiteiten, bedoeld in [artikel 3.22.2, derde lid][ref7], een kennisstarter ontstaat, informeert
      de onderzoeksorganisatie het thematisch technology transferfonds uit het TTT-samenwerkingsverband daarover
      uiterlijk bij oprichting van deze kennisstarter.


