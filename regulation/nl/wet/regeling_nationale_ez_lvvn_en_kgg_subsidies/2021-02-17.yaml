        paragraaf: 2.2.2
  - number: 2.2.25
    text: |-
      Indien voor een investering als bedoeld in [artikel 2.2.10, onderdeel a][ref1], een milieueffectbeoordeling moet
      worden uitgevoerd als bedoeld in artikel 14, vijfde lid, van de groepsvrijstellingsverordening landbouw, is deze
      beoordeling uitgevoerd of de vergunning voor het betrokken investeringsproject verleend vóór de datum waarop de
      investering wordt aangeschaft en de resterende productieve levensduurfase van start gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.10
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.2.25
