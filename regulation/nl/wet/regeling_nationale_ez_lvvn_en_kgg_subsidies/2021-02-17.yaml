  - number: 4.5.9
    text: |-
      1 De minister beslist afwijzend op een aanvraag voor subsidie voor een investering voor de productie van
      duurzame energie, energiebesparende isolatiemaatregelen of de aansluiting op een warmtenet als bedoeld in
      [artikel 4.5.2, tweede, derde of vierde lid][ref1], indien:

      a. ten aanzien van dezelfde investering dan wel een investering in een zelfde type energiebesparende
      isolatiemaatregel eerder subsidie is verstrekt;

      b. de omgevingsvergunning voor een bouwwerk, waarvoor een investering bestemd is, is aangevraagd na 30 juni 2018;

      c. een aanvraag voor subsidie van een eigenaar-bewoner later is ingediend dan 12 maanden na het installeren van een
      installatie voor de productie van duurzame energie, het aanbrengen van isolatiemateriaal of de aansluiting op een
      warmtenet, bedoeld in [artikel 4.5.2, tweede lid, onderdelen a en b, derde en vierde lid][ref2];

      d. de aanvrager voor dezelfde investering op grond van
      [artikel 3.42, eerste lid, van de Wet inkomstenbelasting 2001][ref3] een verzoek heeft ingediend bij de minister om
      een verklaring dat sprake is van een energie-investering als bedoeld in dat artikel.

      2 De minister beslist afwijzend op een aanvraag voor subsidie voor een investering voor de productie van duurzame
      energie als bedoeld in [artikel 4.5.2, tweede lid][ref4], indien:

      a. de installatie waar de investering betrekking op heeft is of wordt geïnstalleerd om te voldoen aan de wettelijke
      voorschriften, bedoeld in [hoofdstuk 5 van het Bouwbesluit 2012][ref5];

      b. de aanvraag voor subsidie betrekking heeft op een gebruikte installatie;

      c. de installatie waar de investering betrekking op heeft voor 1 juli 2020 is geïnstalleerd;

      d. het totale netto elektriciteitsverbruik via de aansluiting waarop de installatie wordt aangesloten, zoals
      dat blijkt uit de in het jaar voorafgaand aan de aanvraag van de energieleverancier ontvangen jaarafrekening,
      minder dan 50.000 kWh bedroeg, indien het een investering voor een installatie voor de productie van hernieuwbare
      elektriciteit uit zonlicht als bedoeld in [artikel 4.5.2, tweede lid, onderdeel c][ref6], betreft;

      e. er geen aanvraag voor een vergunning krachtens de [Wet algemene bepalingen omgevingsrecht][ref7] is ingediend,
      indien het een investering voor een installatie voor de productie van hernieuwbare elektriciteit met één of meer
      windturbines als bedoeld in [artikel 4.5.2, tweede lid, onderdeel d][ref8], betreft.

      3 De minister beslist afwijzend op een aanvraag voor subsidie voor een investering voor energiebesparende
      isolatiemaatregelen als bedoeld in [artikel 4.5.2, derde lid][ref9], indien:

      a. de aanvraag voor subsidie geen betrekking heeft op:

      1°. twee of meer verschillende typen investeringen die op het moment van indiening van de aanvraag op grond van
      deze titel voor subsidie in aanmerking kunnen komen; of

      2°. een investering in ten minste twee typen energiebesparende isolatiemaatregelen als bedoeld in
      [artikel 4.5.2, derde lid][ref10], dan wel een investering in ten minste één type isolatiemaatregel als bedoeld
      in artikel 4.5.2, derde lid, in combinatie met een investering in ten minste één installatie voor de productie
      van duurzame energie of aansluiting op een warmtenet als bedoeld in artikel 4.5.2, tweede lid, onderdelen a en b,
      respectievelijk vierde lid;

      b. meer dan 12 maanden zijn verstreken tussen het installeren of aanbrengen van de eerste van de twee typen
      investeringen, bedoeld in onderdeel a, en de aanvraag voor subsidie.

      4 De minister beslist afwijzend op een aanvraag voor subsidie voor een investering voor de aansluiting op een
      warmtenet als bedoeld in [artikel 4.5.2, vierde lid][ref11], indien:

      a. de aanvraag voor subsidie betrekking heeft op een investering voor:

      1°. een individuele aansluiting op een warmtenet als bedoeld in [artikel 4.5.2, vierde lid, onderdeel a][ref12],
      en niet kan worden aangetoond dat de aardgasaansluiting van de bestaande koopwoning waarvoor subsidie wordt
      aangevraagd is afgekoppeld en de gasmeter is verwijderd;

      2°. een individuele aansluiting op een warmtenet als bedoeld in [artikel 4.5.2, vierde lid, onderdeel a][ref13],
      van een appartement van een eigenaar-bewoner in een appartementencomplex en er voor dit appartementencomplex eerder
      subsidie is aangevraagd door een vereniging van eigenaren voor een investering voor een centrale aansluiting op een
      warmtenet als bedoeld in artikel 4.5.2, vierde lid, onderdeel b;

      3°. een centrale aansluiting op een warmtenet als bedoeld in [artikel 4.5.2, vierde lid, onderdeel b][ref14], in
      een appartementencomplex van een vereniging van eigenaren en er ten minste door een eigenaar-bewoner of voormalig
      eigenaar-bewoner ten behoeve van een appartement in dit appartementencomplex eerder subsidie is aangevraagd
      voor een investering voor een individuele aansluiting op een warmtenet als bedoeld in artikel 4.5.2, vierde lid,
      onderdeel a;

      b. voor een investering op grond van de [Stimuleringsregeling aardgasvrije huurwoningen][ref15] een aanvraag voor
      subsidie ingediend kan worden door:

      1°. de subsidieaanvrager; of

      2°. indien de subsidieaanvrager een vereniging van eigenaren is, een lid van deze vereniging;

      c. de aansluiting op een warmtenet als bedoeld in [artikel 4.5.2, vierde lid][ref16], voor 1 januari 2021 heeft
      plaatsgevonden.

      5 Indien een aanvraag voor subsidie, die is ingediend binnen de termijn, genoemd in het eerste lid, onderdeel c,
      is afgewezen in verband met de uitputting van het subsidieplafond, is de afwijzingsgrond, bedoeld in het eerste
      lid, onderdeel c, niet van toepassing op een hernieuwde aanvraag voor subsidie voor dezelfde investering die binnen
      twaalf maanden na afwijzing van de oorspronkelijke aanvraag wordt ingediend.

      6 De afwijzingsgrond, bedoeld in het eerste lid, onderdeel b, is niet van toepassing op een aanvraag voor subsidie
      indien deze aanvraag betrekking heeft op:

      a. een investering voor een ruimteverwarmingstoestel, een waterverwarmingstoestel of een zonneboiler als bedoeld
      in [artikel 4.5.2, tweede lid, onderdelen a en b][ref17], die voor 1 januari 2020 aangeschaft is en voor 1 januari
      2021 geïnstalleerd is;

      b. een investering voor de productie van duurzame energie als bedoeld in
      [artikel 4.5.2, tweede lid, onderdelen c en d][ref18].

      7 Het netto elektriciteitsverbruik, bedoeld in het tweede lid, onderdeel d, wordt berekend door de hoeveelheid
      elektriciteit die volgens de in dat onderdeel genoemde jaarafrekening aan het net wordt onttrokken, indien van
      toepassing te verminderen met de hoeveelheid elektriciteit die volgens de in dat onderdeel genoemde jaarafrekening
      op het net wordt ingevoed.


