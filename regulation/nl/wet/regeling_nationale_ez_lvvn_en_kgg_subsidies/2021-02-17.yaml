  - number: 4.2.71
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *overige niet-economische projectactiviteiten van onderzoeksorganisaties:* overige projectactiviteiten, bestaande
      uit kennisoverdracht in de vorm van de brede verspreiding van onderzoeksresultaten op een niet-exclusieve en
      niet-discriminerende basis, onafhankelijk uitgevoerd door onderzoeksorganisaties en in de boekhouding van deze
      onderzoeksorganisaties opgenomen als niet-economische activiteiten;
        - *overige projectactiviteiten:* activiteiten die bijdragen aan het doel van een systeemintegratieproject, voor
      zover de activiteiten betrekking hebben op programmalijn 1. (Multi-modelling voor integrale besluitvorming),
      opgenomen in [bijlage 4.2.10][ref1], en bestaan uit kennisoverdracht of het vormen en in stand houden van een
      netwerk waarbinnen kennis en ervaring aanwezig is en wordt uitgewisseld over deze programmalijn;
        - *systeemintegratieproject:* project dat past binnen de in [bijlage 4.2.10][ref2] opgenomen programmalijnen,
      bestaande uit: a. industrieel onderzoek of experimentele ontwikkeling; of b. overige projectactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
      [ref2]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.2.71
    references:
      - id: ref1
