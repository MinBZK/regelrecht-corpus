  - number: 3.22.13
    text: |-
      1 De subsidieontvanger draagt er zorg voor dat bij alle op het publiek gerichte voorlichtings- en
      publiciteitsmaatregelen die betrekking hebben op de gesubsidieerde activiteiten, duidelijk wordt gemaakt dat voor
      de desbetreffende activiteiten subsidie is verkregen van de minister.

      2 De subsidieontvanger verleent medewerking aan voorlichtings- en publiciteitsmaatregelen met betrekking tot de
      gesubsidieerde activiteiten door de minister of een door de minister aangewezen derde.

      3 De verplichtingen, bedoeld in het eerste en tweede lid, gelden tot één jaar na de dag waarop de subsidie wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.22.13
  - number: 3.22.14
    text: |-
      Deze titel en [bijlage 3.22.1][ref1] vervallen met ingang van 1 april 2024, met dien verstande dat deze van
      toepassing blijven op subsidies die voor die datum zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.22.14
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 3.23.1
    text: |-
      In deze titel wordt verstaan onder:

        - *eigen bijdrage:* eigen bijdrage van de subsidieontvanger of subsidieontvangers in de subsidiabele kosten als
      bedoeld in [artikel 3.23.5][ref1];
        - *innovatieadviesdienstverklaring:* verklaring van een deelnemer aan een Venture Challenge samenwerkingsverband of
      van een Venture Challenge startup waaruit blijkt dat subsidieverlening niet zal leiden tot overschrijding van het
      plafond voor innovatiediensten en diensten inzake innovatieondersteuning, bedoeld in artikel 28, vierde lid, van de
      algemene groepsvrijstellingsverordening;
        - *Venture Challenge programma:* in opdracht van de Nederlandse Organisatie voor Wetenschappelijk Onderzoek
      georganiseerde innovatieadviesdienst als bedoeld in de artikelen 2, onderdeel 94, en 28, vierde lid, van de
      algemene groepsvrijstellingsverordening, bestaande uit Venture Challenge bijeenkomsten waarin de deelnemende
      Venture Challenge teams onder begeleiding van ervaren business coaches, andere experts en ondernemers uit de sector
      werken aan het opzetten of aanscherpen van het venture plan van hun al dan niet toekomstige Venture Challenge
      startup en dit venture plan leren presenteren;
        - *Venture Challenge samenwerkingsverband:* samenwerkingsverband, bestaande uit ten minste drie natuurlijke
      personen, waaronder in ieder geval de persoon die die de nieuwe technische vinding heeft gedaan of de nieuwe
      toepassing van een reeds bestaande technologie heeft ontdekt, en die voornemens zijn gezamenlijk een Venture
      Challenge startup op te richten;
        - *Venture Challenge startup:* kleine onderneming of middelgrote onderneming die: a. ten tijde van de verstrekking
      van de subsidie op grond van deze titel niet actief is of is geweest op een markt; en b. erop gericht is een nieuw
      product of proces, of nieuwe dienst op de markt te brengen, gebaseerd op een nieuwe technische vinding of een
      nieuwe toepassing van een reeds bestaande technologie, voortkomend uit wetenschappelijk onderzoek;
        - *Venture Challenge team:* team van ten minste drie natuurlijke personen, bestaande uit: a. de oprichter of
      oprichters en eventuele medewerkers of adviseurs van een Venture Challenge startup, waaronder in ieder geval de
      persoon die de nieuwe technische vinding heeft gedaan of de nieuwe toepassing van een reeds bestaande technologie
      heeft ontdekt; of b. de deelnemers in een Venture Challenge samenwerkingsverband;
        - *venture plan:* beschrijving van de commerciële potentie van de al dan niet toekomstige Venture Challenge
      startup met het oog op exploitatie van de nieuwe technische vinding of de nieuwe toepassing van een reeds
      bestaande technologie en het aantrekken van financiers, inhoudend in ieder geval een beschrijving van: a. het
      probleem; b. de unieke oplossing die het nieuwe product of proces of de nieuwe dienst biedt; c. het stadium van het
      ontwikkelingstraject van het nieuwe product of proces of de nieuwe dienst; d. de financieringsbehoefte en verwachte
      opbrengsten van de al dan niet toekomstige Venture Challenge startup; e. de belangrijkste risico’s en een plan van
      aanpak om deze risico’s te mitigeren.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.23.5
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.23.1
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.23.5
        hoofdstuk: '3'
  - number: 3.23.2
    text: |-
      1 Op aanvraag verstrekt de minister subsidie voor deelname van een Venture Challenge team aan het Venture Challenge
      programma aan de deelnemers in een Venture Challenge samenwerkingsverband of aan een Venture Challenge startup,
      dat of die erop gericht is een nieuw product of proces of een nieuwe dienst op de markt te brengen dat of die past
      binnen de doelstellingen van de topsector Life Sciences & Health.

      2 Een nieuw product of proces of een nieuwe dienst als bedoeld in het eerste lid, is een nieuw medicijn of nieuwe
      therapie, een nieuw diagnosticum, een nieuw medisch hulpmiddel, dan wel een nieuwe technologie die het ontdekken,
      ontwikkelen of het gebruik van medicijnen, therapieën, diagnostica of medische hulpmiddelen verbetert of mogelijk
      maakt.

      3 De subsidie, bedoeld in het eerste lid, wordt uitsluitend verstrekt, indien, na toepassing van de
      afwijzingsgronden, bedoeld in de [artikelen 22][ref1] en [23 van het besluit][ref2] en [artikel 3.23.7][ref3],
      ten minste vijf subsidieaanvragen in aanmerking komen voor subsidie en deze aanvragen zijn ingediend gedurende de
      openstellingsperiode, genoemd in de ministeriële regeling, bedoeld in [artikel 16 van het besluit][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.23.7
      [ref4]: https://wetten.overheid.nl/BWBR0024796#Artikel16
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.23.2
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0035474
        artikel: 3.23.7
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0024796
        artikel: '16'
  - number: 3.23.3
    text: |-
      De subsidie, bedoeld in [artikel 3.23.2, eerste lid][ref1], bedraagt de subsidiabele kosten verminderd met de eigen
      bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.23.2
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.23.3
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.23.2
        hoofdstuk: '3'
  - number: 3.23.4
    text: |-
      In afwijking van [artikel 10 van het besluit][ref1] zijn de subsidiabele kosten alle kosten voor deelname van het
      Venture Challenge team aan het Venture Challenge programma, die verschuldigd zijn aan de derde die het Venture
      Challenge programma uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.23.4
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '10'
  - number: 3.23.5
    text: |-
      De eigen bijdrage wordt bepaald aan de hand van de opgave, bedoeld in
      [artikel 3.23.10, tweede lid, onderdeel c][ref1], van het aantal leden van het Venture Challenge team dat deelneemt
      aan het Venture Challenge programma, en is vastgesteld op:

      a. € 2000, bij deelname van drie leden;

      b. € 2500, bij deelname van vier leden;

      c. € 3000, bij deelname van vijf leden.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.23.10
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.23.5
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.23.10
        hoofdstuk: '3'
  - number: 3.23.6
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.23.6
  - number: 3.23.7
    text: |-
      De minister beslist afwijzend op een aanvraag voor subsidie, indien:

      a. de werking van het nieuwe product of proces of de nieuwe dienst onvoldoende wetenschappelijk onderbouwd is
      middels concrete, experimentele data;

      b. een duidelijk concurrentievoordeel voor de al dan niet toekomstige Venture Challenge startup ontbreekt;

      c. de al dan niet toekomstige Venture Challenge startup of het nieuwe product of proces of de nieuwe dienst
      onvoldoende commerciële potentie heeft;

      d. er onvoldoende vertrouwen is dat bij elke Venture Challenge bijeenkomst minimaal twee leden van het Venture
      Challenge team aanwezig zijn;

      e. een of meerdere leden van het Venture Challenge team reeds eerder met dezelfde nieuwe technologische vinding of
      nieuwe toepassing van een reeds bestaande technologie mee hebben gedaan aan het Venture Challenge programma of een
      voorloper daarvan, zonder dat deze technologie of nieuwe toepassing sterk verbeterd is;

      f. er onvoldoende vertrouwen bestaat dat de leden van het Venture Challenge team de capaciteiten hebben om een
      succesvolle Venture Challenge startup op te bouwen.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.23.7
  - number: 3.23.8
    text: |-
      1 De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger, naarmate:

      a. het commerciële perspectief van het nieuwe product of proces of de nieuwe dienst groter is;

      b. het nieuwe product of proces of de nieuwe dienst meer vernieuwend is;

      c. de concurrentiepositie van de al dan niet toekomstige Venture Challenge startup een beter perspectief heeft;

      d. de financieringspotentie van de al dan niet toekomstige Venture Challenge startup groter is;

      e. de kwaliteit van het Venture Challenge team hoger is, gelet op de mate van complementariteit van de leden, de
      capaciteiten van de leden en de rolverdeling binnen het team;

      f. de toegevoegde waarde van deelname aan het Venture Challenge Programma voor de al dan niet toekomstige Venture
      Challenge startup groter is.

      2 Voor de rangschikking wegen de in het eerste lid genoemde criteria even zwaar.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.23.8
  - number: 3.23.9
    text: |-
      1 De subsidie wordt slechts aangewend ter dekking van de subsidiabele kosten van het Venture Challenge programma
      dat start op de in de beschikking tot subsidieverlening genoemde datum.

      2 Aan iedere Venture Challenge bijeenkomst nemen minimaal twee en maximaal vijf leden van het Venture Challenge
      team deel, doch nooit meer dan opgegeven bij de subsidieaanvraag.

      3 De leden van het Venture Challenge team houden de niet-openbare kennis van de andere deelnemende Venture
      Challenge teams, die gedeeld wordt tijdens het Venture Challenge programma, geheim.

      4 Indien de subsidieontvanger een Venture Challenge startup is, zorgt deze ervoor dat het Venture Challenge team
      voldoet aan de verplichtingen, bedoeld in het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.23.9
  - number: 3.23.10
    text: |-
      1 Een aanvraag om subsidie bevat ten minste de gegevens, bedoeld in artikel 6, tweede lid, van de algemene
      groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag om subsidie ten minste:

      a. indien een subsidieaanvraag wordt gedaan door een Venture Challenge startup:

      1°. gegevens over de Venture Challenge startup, waaronder de naam van de Venture Challenge startup, de grootte
      van de onderneming, het nummer waaronder de onderneming geregistreerd is bij de Kamer van Koophandel en het post-
      en bezoekadres;

      2°. gegevens van de leden van het Venture Challenge team en de contactpersoon, waaronder de namen, telefoonnummers
      en e-mailadressen;

      b. indien een subsidieaanvraag wordt gedaan door deelnemers in een Venture Challenge samenwerkingsverband:

      1°. gegevens over de deelnemers en de contactpersoon van de penvoerder, waaronder de namen, de namen van de
      organisaties waar zij werkzaam zijn, de post- en bezoekadressen, telefoonnummers en e-mailadressen;

      2°. de werktitel van de toekomstige Venture Challenge startup;

      c. een opgave van het aantal leden van het Venture Challenge team dat zal deelnemen aan de Venture Challenge
      bijeenkomsten, met een minimum van drie en een maximum van vijf leden;

      d. een applicatieformulier, inhoudende:

      1°. een korte beschrijving van de verbetering die het product, proces of de nieuwe dienst beoogd te
      bewerkstelligen;

      2°. een korte beschrijving van het nieuwe product of proces of de nieuwe dienst en de achterliggende wetenschap
      of technologie en de mate waarin de werking van het nieuwe product of proces of de nieuwe dienst gevalideerd is
      middels concrete, experimentele data;

      3°. een inschatting van de markt;

      4°. een beschrijving van de uniciteit van het nieuwe product of proces of de nieuwe dienst;

      5°. een beschrijving van het Venture Challenge team, waaruit in ieder geval de achtergrond van, de motivatie van en
      de rolverdeling binnen het team blijkt;

      e. een opgave van beschikbaarheid voor een interview als bedoeld in het derde lid;

      f. de innovatieadviesdienstverklaring of, in geval van een Venture Challenge samenwerkingsverband, de
      innovatieadviesdienstverklaringen.

      3 Indien dit wenselijk wordt geacht voor de beoordeling van de aanvraag, kan een interview deel uitmaken van de
      aanvraagprocedure.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.23.10
  - number: 3.23.11
    text: |-
      De subsidie, bedoeld in [artikel 3.23.2, eerste lid][ref1], bevat staatssteun en wordt gerechtvaardigd door artikel
      28 van de algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.23.2
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.23.11
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.23.2
        hoofdstuk: '3'
  - number: 3.23.12
    text: |-
      Deze titel vervalt met ingang van 1 januari 2025, met dien verstande dat deze van toepassing blijft op subsidies
      die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.23.12
  - number: 3.24.1
    text: |-
      In deze titel wordt verstaan onder:

        - *expertbedrijf:* bedrijf dat deskundig is op het gebied van ten minste een productiviteitsverhogende technologie;
        - *mkb-werkplaats:* regionaal, open kennisnetwerk van een of meer onderwijsinstellingen, met een focus op een
      of meer productiviteitsverhogende technologieën, waarbinnen de onderwijsinstelling of de onderwijsinstellingen
      tezamen met partijen in de regio mkb-ondernemers, met name die met een kleine onderneming, helpt of helpen met
      hun digitaliseringsvraagstukken, door in ieder geval: a. het afnemen van intakes bij mkb-ondernemers ten behoeve
      van het in kaart brengen van de vragen van mkb-ondernemers en het samenbrengen van student en mkb-ondernemer voor
      het maken van een roadmap; b. studenten in te zetten die roadmaps maken voor mkb-ondernemers; en c. het geven van
      algemene voorlichting en het breed delen en verspreiden van kennis met betrekking tot digitalisering;
        - *onderwijsinstelling:* instelling als bedoeld in de [artikelen 1.3.1][ref1], [1.3.2a][ref2] of
      [1.3.3 van de Wet educatie en beroepsonderwijs][ref3] of als bedoeld in de [bijlage behorende bij de Wet op het
      hoger onderwijs en wetenschappelijk onderzoek](onbekend), onder a tot en met i;
        - *roadmap:* door een of meer studenten opgesteld advies, met praktische tips en concreet handelingsperspectief,
      aan een mkb-ondernemer met betrekking tot zijn digitaliseringsmogelijkheden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.2a
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.3
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.24.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 1.3.1
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 1.3.2a
      - id: ref3
        bwb_id: BWBR0007625
        artikel: 1.3.3
  - number: 3.24.2
    text: |-
      De minister verstrekt op aanvraag subsidie aan een onderwijsinstelling of aan een onderwijsinstelling in een
      samenwerkingsverband van onderwijsinstellingen voor het initiëren en opzetten van een mkb-werkplaats en voor het
      verrichten van de volgende activiteiten in het kader van die mkb-werkplaats:

      a. het in kaart brengen van de digitaliseringsvraagstukken van mkb-ondernemers en het samenbrengen van student en
      mkb-ondernemer voor het maken van een roadmap;

      b. algemene voorlichting en brede kennisdeling en -verspreiding op het gebied van digitalisering en brede
      verspreiding van de resultaten van de mkb-werkplaats, op niet-exclusieve en niet-discriminerende basis, middels in
      ieder geval een openbaar toegankelijk digitaal platform;

      c. het monitoren en evalueren van de effecten en resultaten van de mkb-werkplaats;

      d. het geven van openbare en brede bekendheid aan de mkb-werkplaats.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.24.2
  - number: 3.24.3
    text: De subsidie bedraagt 50 procent van de subsidiabele kosten, doch ten hoogste € 450.000 per aanvraag.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.24.3
  - number: 3.24.3a
    text: |-
      In afwijking van [artikel 3.1.1][ref1], bedraagt het uurtarief, bedoeld in de [artikelen 13, tweede lid][ref2], en
      [14 van het besluit][ref3], voor de toepassing van deze titel € 80.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel14
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.24.3a
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.1.1
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0024796
        artikel: '14'
  - number: 3.24.4
    text: |-
      De volgende kosten komen niet in aanmerking voor subsidie:

      a. kosten die direct toerekenbaar zijn aan het maken van individuele roadmaps voor mkb-ondernemers;

      b. kosten die verband houden met vervolgactiviteiten die uit de gemaakte roadmaps voortkomen; en

      c. kosten die aan expertbedrijven verschuldigd zijn.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.24.4
  - number: 3.24.5
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.24.5
  - number: 3.24.6
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.24.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.24.7
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. onvoldoende vertrouwen bestaat in structurele voortzetting van de mkb-werkplaats na afloop van de
      subsidieperiode door middel van structurele inbedding van de mkb-werkplaats in het onderwijscurriculum;

      b. onvoldoende vertrouwen bestaat dat de aanvrager of de aanvragers kan of kunnen voldoen aan de verplichtingen,
      bedoeld in [artikel 3.24.10][ref1];

      c. voor de mkb-werkplaats reeds door de rijksoverheid subsidie is verstrekt;

      d. geen regionale overheid betrokken is als regionale partner bij de mkb-werkplaats;

      e. na toepassing van [artikel 3.24.8, eerste lid][ref2], minder dan 9 punten zijn toegekend aan onderdeel a van dat
      lid of minder dan 12 punten zijn toegekend aan onderdeel c of onderdeel d van dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.24.10
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.24.8
