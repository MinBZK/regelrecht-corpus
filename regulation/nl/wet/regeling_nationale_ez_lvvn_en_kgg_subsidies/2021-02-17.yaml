  - number: B3.25.1:6
    text: |-
      1 Het tarief van de provisie bedraagt voor een kredietovereenkomst met een MKB-ondernemer eenmalig 2% van het
      kredietbedrag.

      2 Indien overeenkomstig artikel 3, eerste lid, onderdeel c, een provisie is betaald met betrekking tot een
      kredietovereenkomst en indien het desbetreffende krediet niet is opgenomen vanwege omstandigheden die niet zijn toe
      te rekenen aan de kredietnemer of aan de Financier, wordt de provisie door de Staat terugbetaald aan de Financier
      mits de Financier binnen een jaar na het sluiten van de kredietovereenkomst daartoe een verzoek aan de Staat heeft
      gedaan.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel6
  - number: B3.25.1:7
    text: |-
      1 De Staat stelt zich garant voor 95 procent van ieder garantstellingskrediet, bestaande uit de hoofdsom van dat
      krediet, de verschuldigde achterstallige rente en de voor dat krediet gemaakte kosten, waaronder kosten voor de
      uitwinning.

      2 De Financier kan, zodra er sprake is van een wanbetaling onder een garantstellingskrediet, een verzoek doen aan
      de Staat tot betaling van het verwachte verlies, bedoeld in artikel 8. Dit verzoek wordt ingediend in ieder geval
      binnen negen maanden na de datum waartegen het garantstellingskrediet is opgeëist of, indien dit eerder is, na de
      datum van het faillissement.

      3 Voor de toepassing van het tweede lid is sprake van wanbetaling wanneer een MKB-ondernemer een achterstand heeft
      van meer dan 90 kalenderdagen in de betaling van een verplichting onder het krediet.

      4 Het verzoek wordt ingediend onder gelijktijdige verstrekking van de door de minister gevraagde informatie.

      5 De minister geeft binnen 35 dagen na de ontvangst uitvoering aan het verzoek aan de Financier.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel7
  - number: B3.25.1:8
    text: |-
      De omvang van het verwachte verlies bedraagt per krediet 95 procent van hetgeen de MKB-ondernemer ten tijde van het
      overeenkomstig artikel 7 ingediende verzoek uit hoofde van het garantstellingskrediet pro resto verschuldigd is van
      het krediet, bestaande uit de hoofdsom van dat krediet, de verschuldigde rente en voor dat krediet gemaakte kosten,
      waaronder kosten voor de uitwinning.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel8
  - number: B3.25.1:9
    text: |-
      1 De minister betaalt hetgeen de Staat uit hoofde van deze overeenkomst met het oog op de door de Financier in haar
      verzoek bedoelde garantstellingskrediet verschuldigd is.

      2 De Staat is niet verplicht tot betaling op het verzoek van de Financier, indien:

      a. niet voldaan is aan de artikelen 3 en 4;

      b. de Financier in het kader van het verzoek gegevens heeft verstrekt, waarvan zij wist of behoorde te weten dat
      deze onjuist of onvolledig waren en de verstrekking van deze gegevens tot een onjuiste beslissing op het verzoek
      heeft geleid;

      c. de Financier niet heeft voldaan aan zijn informatieverplichting als bedoeld in artikel 13.

      3 De Staat en de Financier betalen op het door de ontvangende partij opgegeven rekeningnummer.

      4 Er zal door de Staat geen regres of subrogatie plaatsvinden.

      5 De Financier is niet gehouden een vordering op de MKB-ondernemer in te stellen voordat de Staat tot betaling over
      zal gaan.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel9
  - number: B3.25.1:10
    text: |-
      1 In het geval van wanbetaling, als bedoeld in artikel 7, derde lid, is het de verantwoordelijkheid van de
      Financier om naar normaal bancair gebruik in samenspraak met de MKB-ondernemer te bezien op welke wijze deze zo
      veel als mogelijk aan zijn verplichtingen jegens de Financier kan voldoen.

      2 Indien een uitwinningsproces wordt gestart komen de opbrengsten daarvan ten gunste aan de aflossing voor eerder
      verstrekte reguliere financieringen. De persoonlijke borgtocht verstrekt ten behoeve van het garantstellingskrediet
      en resterende opbrengsten uit zekerheden komen ten gunste van de aflossing van het garantstellingskrediet.

      3 De Financier zal geen restvorderingen uit hoofde van het garantstellingskrediet verkopen aan derde partijen.

      4 Financier en Staat delen naar rato van garantiepercentage in de uitwinning van zekerheden

      (indien van toepassing). Dit is inclusief persoonlijke borgtocht verstrekt ten behoeve van het
      garantstellingskrediet voor deze lening en met inachtneming van de volgorde bij meerdere financieringen zoals
      bedoeld in het tweede lid.

      5 Indien na de uitwinning van zekerheden en de persoonlijke borgtocht sprake is van een restschuld kan conform
      beleid van de Financier een betalingsregeling getroffen worden met een maximale looptijd van drie jaar. Individuele
      omstandigheden kunnen aanleiding zijn voor kwijtschelding.

      6 De Financier kan de restschuld van de borg (max. 10%) herfinancieren door omzetting in consumptief of
      hypothecaire krediet, waarbij de looptijd van de restschuldregeling in acht wordt genomen en het nieuwe krediet
      moet passen binnen de geldende leennormen. Kosten van herstructurering en uitwinning kunnen conform regulier
      beleid van de Financier worden verhaald op de MKB-ondernemer. Dit is inclusief de kosten die zijn gemaakt door
      inschakeling van een derde partij. Hierbij geldt ook de reguliere incassovergoeding (provisie) van 20%.

      7 De BKR registratie in het geval van wanbetaling wordt gedaan conform bancair gebruik.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel10
  - number: B3.25.1:11
    text: |-
      1 Uiterlijk het tweede kwartaal na de maximale looptijd van het laatste verstrekte krediet wordt het totale
      verlies vastgesteld. Het totale verlies wordt gebaseerd op de uit hoofde van de garantstellingskredieten pro
      resto verschuldigde hoofdsommen, de verschuldigde achterstallige rentes en de voor die kredieten gemaakte kosten,
      waaronder de kosten voor de uitwinning, minus de opbrengsten van de uitwinning, met inachtneming van de omvang van
      de garantstelling door de Staat als bepaald in artikel 7, eerste lid, en de verdeling van de uitwinningsopbrengsten
      conform artikel 10, vierde lid. Op basis daarvan vindt verrekening plaats met de reeds betaalde verwachte verliezen
      met betrekking tot de garantstellingskredieten.

      2 Afhankelijk van het resultaat van de in het eerste lid genoemde verrekening, betaalt de Staat of de
      Financier hetgeen zij uit hoofde daarvan aan de andere partij verschuldigd is op het door die partij opgegeven
      rekeningnummer.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel11
  - number: B3.25.1:12
    text: |-
      Reeds uitgekeerde bedragen zijn terstond en zonder enige ingebrekestelling opeisbaar zodra de minister blijkt dat
      de Financier zodanig onjuiste of onvolledige informatie heeft verschaft dat hij op een verzoek om betaling een
      andere beslissing zou hebben genomen, indien hem de juiste gegevens volledig waren verschaft, terwijl de Financier
      wist of behoorde te weten dat deze onjuist of onvolledig waren en dat de verstrekking van deze gegevens tot een
      onjuiste beslissing op het verzoek zou leiden.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel12
  - number: B3.25.1:13
    text: |-
      1 De Financier draagt er zorg voor dat een administratie wordt gevoerd die zodanig is ingericht, dat daaruit te
      allen tijde op eenvoudige en duidelijke wijze gegevens kunnen worden afgelezen over de verstrekkingen, het beheer
      en de vervreemdingen van gegarandeerde leningen en van ander kapitaal dat zij aan dezelfde ondernemer heeft
      verstrekt. Deze administratie moet ten minste tien jaar na het verstrekken van de lening worden bewaard.

      2 De Financier doet aan de minister onverwijld mededeling van de indiening bij de rechtbank van een verzoek tot
      verlening van surseance van betaling aan hem, een verzoek tot faillietverklaring van hem of een verzoek om ten
      aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing te verklaren

      3 De Financier stelt de minister eenmaal per kwartaal via batch levering voor alle door hem onder deze
      garantstellingsovereenkomst gesloten kredietovereenkomsten op de hoogte van de door de minister gevraagde
      informatie, waaronder in ieder geval bij het verstrekken van het krediet:

      a. de naam van de onderneming;

      b. de naam van de ondernemer;

      c. het nummer van inschrijving bij Kamer van Koophandel;

      d. de SBI-code;

      e. het kredietbedrag;

      f. de looptijd van de kredietovereenkomst;

      g. de eventuele aflossingsvrije periode.

      4 De Financier stelt de minister eenmaal per kwartaal via batch levering op de hoogte van de door de minister
      gevraagde informatie, waaronder gedurende de looptijd en afwikkeling van het krediet:

      a. de vervroegde volledige aflossing van het garantstellingskrediet;

      b. het door de afdeling bijzonder beheer of een vergelijkbare afdeling van de Financier in beheer nemen van het
      garantstellingskrediet;

      c. de opeising van het garantstellingskrediet;

      d. de omvang van de opschorting van het garantstellingskrediet;

      e. de omvang van de gedeeltelijke aflossing van het garantstellingskrediet;

      f. de wanbetaling en het resterende kredietbedrag;

      g. het verzoek om betaling met resterende hoofdsom, verschuldigde rente en gemaakte kosten;

      h. de restschuldregeling met het bedrag en de looptijd;

      i. het einde van de restschuldregeling, opbrengsten en gemaakte kosten.

      5 Aan de hand van een steekproef wordt getoetst of de Financier conform deze garantstellingsovereenkomst handelt.
      Bij ernstige afwijkingen daarvan kan de garantstellingsovereenkomst met de Financier worden opgezegd. De minister
      kan ten behoeve van de steekproef om informatie verzoeken, welke de financier conform verzoek dient te verstrekken,
      bijvoorbeeld aangaande het kredietbeoordelings- en uitwinningsproces.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel13
  - number: B3.25.1:14
    text: |-
      1 Tijdens de looptijd van de kredietovereenkomst uit hoofde waarvan een garantstellingskrediet wordt verstrekt en
      tijdens de uitwinning zal de Financier waken over de belangen van de Staat als garant.

      2 De Financier zal er voor zorg dragen dat het garantstellingskrediet niet wordt gebruikt voor de nakoming van
      verplichtingen van de MKB-ondernemer aan de Financier die het garantstellingskrediet verstrekt, aan een financier-
      gelieerde. Dit verhindert de Financier echter niet om in het geval het garantstellingskrediet wordt verstrekt in de
      vorm van een rekening-courant krediet, de verschuldigde rente van de rekening-courant incasseren.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel14
  - number: B3.25.1:15
    text: |-
      Indien naar het oordeel van de minister de kans dat de toepasselijkheid van deze overeenkomst op een
      garantstellingskrediet of een deel van een garantstellingskrediet wordt ingeroepen in belangrijke mate wordt
      verkleind of indien naar het oordeel van de minister aannemelijk is dat daardoor het bedrag waarvoor de
      toepasselijkheid van deze overeenkomst wordt ingeroepen in belangrijke mate wordt verlaagd, kan de minister voor
      de toepassing van deze overeenkomst met betrekking tot dat krediet instemmen met een gemotiveerd verzoek van de
      Financier om afwijking van deze overeenkomst.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel15
  - number: B3.25.1:16
    text: |-
      Waar in deze overeenkomst sprake is van een vorm van communicatie geschiedt deze langs elektronische weg. De
      aanlevering door de Financier kan in afwijking en bij wijze van alternatief en ter keuze van de Financier ook
      geschieden in schriftelijke vorm en door aanlevering van een fysieke gegevensdrager.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel16
  - number: B3.25.1:17
    text: |-
      1 De inwerkingtreding van een wijziging van het [Kaderbesluit nationale EZ-subsidies][ref1] of
      [paragraaf 3.25][ref2] van de Regeling nationale EZK- en LNV-subsidies leidt te zelfder tijd tot een gelijke
      wijziging van deze overeenkomst.

      2 Deze overeenkomst kan worden gewijzigd door een schriftelijke mededeling van de minister aan de Financier.

      3 Deze overeenkomst is aangegaan voor onbepaalde tijd en kan door de minister en de Financier schriftelijk worden
      opgezegd met inachtneming van een opzegtermijn van drie hele kalendermaanden.

      4 In afwijking van het derde lid kan deze overeenkomst door de minister met onmiddellijke ingang worden ontbonden,
      indien de Financier in strijd heeft gehandeld met het gestelde in deze overeenkomst.

      5 In afwijking van het derde lid kan de Financier deze overeenkomst met onmiddellijke ingang
      opzeggen binnen een termijn van een maand na publicatie in het Staatsblad van een wijziging van het
      [Kaderbesluit nationale EZ-subsidies][ref3], publicatie in de Staatscourant van een wijziging van
      [paragraaf 3.25][ref4] van de Regeling nationale EZK- en LNV-subsidies of een schriftelijke mededeling van de
      minister, inhoudende een wijziging van deze overeenkomst.

      6 Deze overeenkomst eindigt van rechtswege door de intrekking van het [Kaderbesluit nationale EZ-subsidies][ref5]
      of door intrekking van [artikel 3.25.2][ref6] van de Regeling nationale EZK- en LNV-subsidies.

      7 Wijziging, opzegging, ontbinding of beëindiging van deze overeenkomst heeft geen gevolg ten aanzien van
      garantstellingskredieten, welke ten tijde van de inwerkingtreding van de wijziging, opzegging, ontbinding of
      beëindiging overeenkomstig artikel 5 zijn gemeld en ten aanzien van garantstellingskredieten die zijn of zullen
      worden verstrekt uit hoofde van een kredietovereenkomst die is aangegaan voor de inwerkingtreding van de wijziging,
      opzegging, ontbinding of beëindiging.

      8 Het zevende lid is ten aanzien van de wijzigingen van artikel 4, onderdeel a, onder 11, ingevolge regeling van
      de Staatssecretaris van Economische Zaken en Klimaat van 16 december 2020, nr. WJZ / 20277916, houdende wijziging
      van de Regeling nationale EZK- en LNV-subsidies, de Regeling openstelling EZK- en LNV-subsidies 2020 en de
      Regeling openstelling EZK- en LNV-subsidies 2021 in verband met het wijzigen van de vervaldatum en openstelling
      van de subsidiemodules Garantie ondernemingsfinanciering uitbraak coronavirus en de Garantie Klein Krediet niet
      van toepassing op garantstellingskredieten welke zijn verstrekt tussen 10 oktober 2020 en het tijdstip waarop de
      voornoemde regeling in werking treedt.

      9 Als het [Kaderbesluit nationale EZ-subsidies][ref7] en [artikel 3.25.2][ref8] van de Regeling nationale EZK- en
      LNV-subsidies gelijktijdig worden ingetrokken en vervangen door materieel identieke wettelijke voorschriften in een
      andere algemene maatregel van bestuur of ministeriële regeling dan is het zesde lid niet van toepassing.


