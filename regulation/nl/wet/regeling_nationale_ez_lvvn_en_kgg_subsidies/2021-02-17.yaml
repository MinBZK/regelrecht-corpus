  - number: 4.6.1
    text: |-
      In deze titel wordt verstaan onder:

        - *CO:* CO of CO-equivalent;
        - *CO-equivalent:* de hoeveelheid CH4, N2O, HFK’s, PFK’s en SF6, die overeenkomstig de factoren in
      [bijlage 4.6.1][ref1] eenzelfde broeikaseffect oplevert als een massa-eenheid CO;
        - *Referentie-investering:* investering ten behoeve van een in Nederland gangbaar systeem, apparaat of techniek
      die in technisch opzicht vergelijkbaar is met een in Nederland uit te voeren project, maar waarmee niet hetzelfde
      niveau van milieubescherming kan worden bereikt als met het uit te voeren project.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.6.1
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 4.6.2
    text: |-
      De minister verstrekt op aanvraag subsidie aan een ondernemer voor een project dat is gericht op het doen van
      investeringen in de eigen bedrijfsvoering die bijdragen aan de reductie van de uitstoot van CO op een van de wijzen
      beschreven in [bijlage 4.6.2][ref1] in een onderneming die:

      a. materiële goederen produceert waarbij grondstoffen worden verwerkt en waarbij sprake is van een hoge graad van
      mechanisering en automatisering, genoemd in de Standaardbedrijfsindeling 2008, versie 2019, van het Centraal Bureau
      voor de Statistiek, hoofdgroep C;

      b. energie distribueert, genoemd in de Standaardbedrijfsindeling 2008, versie 2019, van het Centraal Bureau voor de
      Statistiek, hoofdgroep D; of

      c. afval en afvalwater verwerkt, genoemd in de Standaardbedrijfsindeling 2008, versie 2019, van het Centraal Bureau
      voor de Statistiek, hoofdgroep E.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.6.2
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 4.6.3
    text: |-
      1 De subsidie voor een project dat een investering als bedoeld in artikel 36 van de algemene
      groepsvrijstellingsverordening inhoudt, bedraagt 40% van de subsidiabele kosten.

      2 De subsidie voor een project dat een investering als bedoeld in artikel 38 ten behoeve van energie-efficiëntie
      van de algemene groepsvrijstellingsverordening inhoudt, bedraagt 30% van de subsidiabele kosten.

      3 De subsidie voor een project dat een investering ten behoeve van recycling en hergebruik van afval als bedoeld in
      artikel 47 van de algemene groepsvrijstellingsverordening inhoudt, bedraagt 35% van de subsidiabele kosten.

      4 De subsidie voor een project dat een investering ten behoeve van een lokale infrastructuurvoorziening als bedoeld
      in artikel 56 van de algemene groepsvrijstellingsverordening inhoudt, bedraagt 50% van de subsidiabele kosten, maar
      niet meer dan het verschil tussen de subsidiabele kosten en de exploitatiewinst van de investering.

      5 Het percentage, genoemd in het eerste tot en met vierde lid, wordt verhoogd met:

      a. 10 procentpunten, indien de aanvrager een middelgrote onderneming is en de subsidiabele kosten worden gemaakt en
      betaald door de middelgrote onderneming; of

      b. 20 procentpunten, indien de aanvrager een kleine onderneming is en de subsidiabele kosten worden gemaakt en
      betaald door de kleine onderneming.

      6 De subsidie bedraagt ten hoogste € 3.000.000.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.6.3
  - number: 4.6.4
    text: |-
      1 De subsidiabele kosten zijn:

      a. voor een project als bedoeld in [artikel 4.6.3, eerste lid][ref1], de bijkomende investeringskosten, bedoeld in
      artikel 36, vijfde lid, van de algemene groepsvrijstellingsverordening die worden berekend in overeenstemming met
      dat artikellid;

      b. voor een project als bedoeld in [artikel 4.6.3, tweede lid][ref2], de bijkomende investeringskosten, bedoeld in
      artikel 38, derde lid, van de algemene groepsvrijstellingsverordening die worden berekend in overeenstemming met
      dat artikellid;

      c. voor een project als bedoeld in [artikel 4.6.3, derde lid][ref3], de bijkomende investeringskosten, bedoeld in
      artikel 47, zevende lid, van de algemene groepsvrijstellingsverordening die worden berekend in overeenstemming met
      dat artikellid;

      d. voor een project als bedoeld in [artikel 4.6.3, vierde lid][ref4], de kosten, bedoeld in artikel 56, vijfde lid,
      van de algemene groepsvrijstellingsverordening die worden berekend in overeenstemming met artikel 56, zesde lid,
      van de algemene groepsvrijstellingsverordening.

      2 Op de subsidiabele kosten is [artikel 10, derde lid, van het besluit][ref5] niet van toepassing.


