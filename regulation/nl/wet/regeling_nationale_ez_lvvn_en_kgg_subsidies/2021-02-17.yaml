  - number: 2.15.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een terreinbeheerder van natuurerfgoed of een deelnemer in een
      samenwerkingsverband waaraan één of meerdere partijen deelnemen die terreinbeheerder zijn van natuurerfgoed, voor
      een project, bestaande uit één of meer natuurherstelmaatregelen die leiden tot verbetering van de kwaliteit of
      uitbreiding van de oppervlakte van stikstofgevoelige natuurlijke habitats of habitats van soorten.

      2 Voor de toepassing van het eerste lid worden Natura 2000-gebieden aangewezen als natuurerfgoed als bedoeld in
      artikel 53, tweede lid, onderdeel b, van de algemene groepsvrijstellingsverordening.

      3 Subsidie kan slechts worden aangevraagd door een terreinbeheerder van natuurerfgoed die stikstofgevoelig areaal
      in eigendom heeft, indien dit stikstofgevoelig areaal niet in erfpacht is uitgegeven en op dit stikstofgevoelig
      areaal geen recht van beklemming rust.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.15.2
  - number: 2.15.3
    text: |-
      1 De subsidie bedraagt 100% van de subsidiabele kosten.

      2 In afwijking van het eerste lid bedraagt de subsidie overeenkomstig artikel 53, zesde lid, van
      de algemene groepsvrijstellingsverordening niet meer dan het verschil tussen de kosten, bedoeld in
      [artikel 2.15.4, eerste lid, onderdeel a][ref1], en de exploitatiewinst van de investering, indien de aanvrager
      niet hoofzakelijk actief is in de primaire landbouwproductie.

      3 De subsidie bedraagt per aanvrager ten hoogste de uitkomst van € 719 vermenigvuldigd met het aantal hectaren
      stikstofgevoelig areaal waarover de aanvrager zeggenschap heeft.

      4 De subsidie bedraagt maximaal € 500.000 indien de aanvrager hoofzakelijk actief is in de primaire
      landbouwproductie.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.15.4
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.15.3
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.15.4
        hoofdstuk: '2'
  - number: 2.15.4
    text: |-
      1 Voor subsidie komen uitsluitend de kosten in aanmerking:

      a. bedoeld in artikel 53, vierde lid, onderdeel c van de algemene groepsvrijstellingsverordening, indien de
      aanvrager niet hoofdzakelijk actief is in de primaire landbouwproductie;

      b. bedoeld in artikel 14, zesde lid, onderdeel e van de groepsvrijstellingsverordening landbouw, indien de
      aanvrager hoofdzakelijk actief is in de primaire landbouwproductie.

      2 Voor subsidie komen niet in aanmerking:

      a. kosten die verband houden met de activiteiten, bedoeld in artikel 14, negende lid, van de
      groepsvrijstellingsverordening landbouw, indien de aanvrager hoofdzakelijk actief is in de primaire landbouw;

      b. kosten die verband houden met regulier beheer van natuurerfgoed;

      c. kosten voor verwerving of afwaardering van grond.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.15.4
  - number: 2.15.5
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
