  - number: 3.25.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een financier voor het sluiten van kredietovereenkomsten met MKB-
      ondernemers.

      2 De subsidie wordt verstrekt in de vorm van een garantstelling voor de terugbetaling van een krediet, bestaande
      uit de hoofdsom van dat krediet, de verschuldigde achterstallige rente en de voor dat krediet gemaakte kosten,
      waaronder kosten voor de uitwinning, dat de financier op grond van een kredietovereenkomst aan een MKB-ondernemer
      heeft verstrekt voor de duur van de kredietovereenkomst.

      3 De garantstelling heeft uitsluitend betrekking op een kredietovereenkomst in de vorm van een geldlening of een
      krediet in rekening-courant, niet zijnde een achtergestelde of een converteerbare lening:

      a. met een reguliere looptijd van maximaal 5 jaar;

      b. waarbij het kredietbedrag dat wordt verleend aan de MKB-ondernemer ten minste € 10.000,– maar niet meer dan
      € 50.000,– bedraagt;

      c. waarbij de kosten die de financier per jaar aan de MKB-ondernemer in rekening brengt, maximaal 4% van het
      kredietbedrag voor de gehele looptijd van het krediet bedragen;

      d. waarbij het krediet dient ter financiering van door de MKB-ondernemer geleden of te verwachten verlies aan
      inkomsten dat is ontstaan of naar verwachting ontstaat tussen 19 maart 2020 en 30 juni 2021, als gevolg van het
      coronavirus;

      e. die voldoet aan de voorwaarden en verplichtingen ten aanzien van het krediet zoals opgenomen in het model voor
      een garantstellingsovereenkomst, opgenomen in [bijlage 3.25.1][ref1].

      4 In aanvulling op het eerste lid kan de minister ook subsidie verstrekken aan een financier voor het sluiten
      van kredietovereenkomsten met MKB-ondernemers die gevestigd zijn in het openbaar lichaam Bonaire, Sint Eustatius
      of Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.25.2
