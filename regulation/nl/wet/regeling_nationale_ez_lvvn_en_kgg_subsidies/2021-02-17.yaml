  - number: 2.5.1
    text: |-
      1 In deze titel wordt verstaan onder:

        - *aanvullende investering:* nieuwe investering binnen drie jaar na de start van een landbouwonderneming door een
      starter of de overname van een landbouwonderneming door een overnemer;
        - *landbouwinnovatie:* product, productieproces of concept bestemd voor toepassing in de primaire landbouw dat een
      vernieuwing en een verduurzaming inhoudt met als oogmerk het onderscheidend positioneren van een landbouwproduct in
      de markt;
        - *MKB-landbouwondernemer:* MKB-ondernemer die een landbouwonderneming in stand houdt;
        - *MKB-visserij- of aquacultuurondernemer:* MKB-ondernemer die een visserij- of aquacultuuronderneming in stand
      houdt;
        - *overnemer:* natuurlijke persoon of rechtspersoon die voor het eerst voor eigen rekening en risico als MKB-
      ondernemer een landbouwonderneming of visserij- of aquacultuuronderneming in stand gaat houden door van een
      bestaande landbouwonderneming of visserij- of aquacultuuronderneming: a. zijnde een eenmanszaak, een maatschap of
      vennootschap onder firma de meerderheidswaarde van de activa in eigendom, pacht of erfpacht te verwerven; b. zijnde
      een vennootschap met een in aandelen verdeeld kapitaal: 1°. de meerderheid van het geplaatste kapitaal van die
      vennootschap direct of indirect te verwerven, en 2°. de overwegende zeggenschap van die vennootschap te verkrijgen
      zonder op een eerder moment daarvan de enige of overwegende zeggenschap gehad te hebben;
        - *starter:* MKB-landbouwondernemer of MKB-visserij- of aquacultuurondernemer zijnde: a. een natuurlijke persoon
      die niet langer dan drie jaar een landbouwonderneming of visserij- of aquacultuuronderneming in stand houdt; b. een
      vennootschap met een in aandelen verdeeld kapitaal, waarvan de bestuurder een natuurlijke persoon is die ten tijde
      van het sluiten van de kredietovereenkomst direct of indirect de meerderheid van het geplaatst en gestort kapitaal
      houdt en deze meerderheid niet langer dan drie jaar houdt;
        - *visserij- of aquacultuuronderneming:* onderneming die actief is in de visserij- of aquacultuursector zijnde alle
      activiteiten voor de productie, verwerking en afzet van visserij- of aquacultuurproducten;
        - *visserij- of aquacultuurproduct:* product als bedoeld in bijlage I bij Verordening (EU) nr. 1379/2013 van
      het Europees Parlement en de Raad van 11 december 2013 houdende een gemeenschappelijke marktordening voor
      visserijproducten en aquacultuurproducten, tot wijziging van [Verordeningen (EG) nr. 1184/2006](32006R1184) en
      [(EG) nr. 1224/2009](32009R1224) van de Raad en tot intrekking van [Verordening (EG) nr. 104/2000](32000R0104) van
      de Raad (PbEU 2013, L 354).

      2 Voor de toepassing van deze titel kan de minister een instelling aanwijzen als financier.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.5.1
  - number: 2.5.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een financier voor het sluiten van kredietovereenkomsten
      met MKB-landbouwondernemers die betrekking hebben op landbouwborgstellingskredieten of met MKB-visserij- of
      aquacultuurondernemers die betrekking hebben op visserij- en aquacultuurborgstellingskredieten.

      2 De subsidie wordt verstrekt in de vorm van een borgstelling voor de terugbetaling van een krediet dat
      de financier op grond van een kredietovereenkomst aan een MKB-landbouwondernemer of MKB-visserij- of
      aquacultuurondernemer zal verstrekken voor de duur van de kredietovereenkomst.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.5.2
  - number: 2.5.3
    text: |-
      1 Voor subsidie komt niet in aanmerking een financier die een kredietovereenkomst sluit met een MKB-
      landbouwondernemer of MKB-visserij- of aquacultuurondernemer:

      a. die over voldoende financiële middelen beschikt om zijn landbouwonderneming of visserij- of
      aquacultuuronderneming op economisch verantwoorde wijze te drijven;

      b. die een substantieel deel van de activiteiten van de landbouwonderneming niet in Nederland uitvoert of die meer
      dan de helft van de activiteiten van de visserij- of aquacultuuronderneming niet in Nederland uitvoert; of

      c. die een landbouwonderneming of visserij- of aquacultuuronderneming in stand houdt waarvan de laatste jaaromzet
      voor 50 procent of meer is verkregen, of, indien de landbouwonderneming of visserij- of aquacultuuronderneming
      nog geen heel jaar in stand is gehouden, waarvan de omzet naar verwachting voor 50 procent of meer zal worden
      verkregen, uit:

      1°. de uitoefening van het bank-, verzekerings- of beleggingsbedrijf, of het financieren van een of meer andere
      ondernemingen, of

      2°. het verwerven, vervreemden, beheren of exploiteren van onroerende zaken of het ontwikkelen van onroerende
      zaakprojecten.

      2 Geen subsidie wordt verstrekt voor activiteiten die direct verband houden met:

      a. de uitvoer naar andere lidstaten van de Europese Unie of derde landen;

      b. andere lopende uitgaven direct verband houdend met activiteiten op het gebied van uitvoer;

      c. het oprichten en exploiteren van een distributienet ten behoeve van uitvoer, of

      d. investeringen die niet in overeenstemming zijn met de wetgeving van de Europese Unie en met de nationale
      milieubeschermingswetgeving.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.5.3
  - number: 2.5.4
    text: |-
      1 Het tarief van de provisie, bedoeld in [artikel 32, derde lid, van het besluit][ref1] bedraagt eenmalig 3
      procent.

      2 In afwijking van het eerste lid bedraagt de provisie eenmalig 1 procent indien de overeenkomst van borgtocht een
      landbouwborgstellingskrediet of visserij- of aquacultuurborgstellingskrediet betreft voor een starter of overnemer.

      3 In afwijking van het eerste lid bedraagt de provisie eenmalig 1,5 procent indien de overeenkomst van borgtocht
      een landbouwborgstellingskrediet of visserij- of aquacultuurborgstellingskrediet betreft als bedoeld in artikel 6
      van het model borgstellingsovereenkomst, zoals opgenomen in [bijlage 2.5.1][ref2], met een looptijd van ten hoogste
      twee jaar.

      4 In afwijking van het eerste lid bedraagt de provisie eenmalig 0,5 procent indien de overeenkomst van borgtocht
      een landbouwborgstellingskrediet of visserij- of aquacultuurborgstellingskrediet betreft als bedoeld in artikel 6
      van het model borgstellingsovereenkomst, zoals opgenomen in [bijlage 2.5.1][ref3], voor een starter of overnemer,
      met een looptijd van ten hoogste twee jaar.

      5 In afwijking van het eerste lid bedraagt de provisie eenmalig 2,25 procent indien de overeenkomst van borgtocht
      een landbouwborgstellingskrediet of visserij- of aquacultuurborgstellingskrediet betreft als bedoeld in artikel 6
      van het model borgstellingsovereenkomst, zoals opgenomen in [bijlage 2.5.1][ref4], met een looptijd van meer dan
      twee jaar, maar niet langer dan vier jaar.

      6 In afwijking van het eerste lid bedraagt de provisie eenmalig 0,75 procent indien de overeenkomst van borgtocht
      een landbouwborgstellingskrediet of visserij- of aquacultuurborgstellingskrediet betreft als bedoeld in artikel 6
      van het model borgstellingsovereenkomst, zoals opgenomen in [bijlage 2.5.1][ref5], voor een starter of overnemer,
      met een looptijd van meer dan twee jaar, maar niet langer dan vier jaar.


