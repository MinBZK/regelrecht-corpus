  - number: 2.4.24
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een onderneming voor de uitvoering van trainingen, workshops,
      coaching, voorlichtingsacties en demonstratieactiviteiten voor een samenwerkingsverband, bestaande uit
      landbouwondernemingen. De activiteiten hebben als onderwerp:

      a. een onderwerp als bedoeld in [artikel 2.4.3, onderdeel a][ref1];

      b. methaanemissiereductie in de veehouderij;

      c. duurzaam bodembeheer en (grond)waterbeheer in de veenweiden;

      d. het verminderen van lachgasemissie bij bemesting;

      e. het vastleggen van koolstof in de bodem;

      f. het verbeteren van de diergezondheid en het dierenwelzijn; of

      g. het op een duurzame manier verbeteren van het verdienvermogen van landbouwondernemingen.

      2 De subsidie, bedoeld in het eerste lid, wordt niet verstrekt aan:

      a. een landbouwonderneming;

      b. een onderneming die landbouwproducten, gewasbeschermingsmiddelen, diervoeders, landbouwmechanisatieproducten of
      meststoffen verkoopt; of

      c. een onderneming die in een groep verbonden is aan een onderneming die producten als bedoeld in onderdeel b
      verkoopt.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.3
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.24
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.4.3
        hoofdstuk: '2'
        paragraaf: 2.4.2
  - number: 2.4.25
    text: |-
      1 De subsidie bedraagt ten hoogste 80% van de subsidiabele kosten.

      2 De subsidie bedraagt ten minste € 15.000,– en ten hoogste € 200.000,– per project.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.25
  - number: 2.4.26
    text: |-
      1 Voor subsidie komen in aanmerking kosten van de organisatie en uitvoering van trainingen, workshops, coaching,
      voorlichtingsacties en demonstratieactiviteiten als bedoeld in artikel 21, derde lid, onderdeel a, van de
      groepsvrijstellingsverordening landbouw.

      2 Voor subsidie komen niet in aanmerking kosten voor de ontwikkeling van middelen ten behoeve van de
      kennisoverdracht.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.26
  - number: 2.4.27
    text: |-
      1 De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.

      2 Indien blijkt dat het totale bedrag van de te verlenen subsidies voor projecten
      als bedoeld in [artikel 2.4.24, eerste lid, onderdeel a][ref1], in samenhang met
      [artikel 2.4.3, onderdeel a, subonderdeel 1°][ref2], lager is dan het daarvoor vastgestelde subsidieplafond, wordt
      het overblijvende bedrag zo nodig aan het subsidieplafond toegevoegd voor projecten als bedoeld in artikel 2.4.24,
      eerste lid, onderdelen a tot en met g.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.24
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.3
