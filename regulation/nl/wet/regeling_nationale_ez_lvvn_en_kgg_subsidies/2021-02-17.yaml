  - number: 2.10.1
    text: |-
      In deze titel wordt verstaan onder:

        - *kasenergiesysteem:* alle apparatuur, installaties of machines ten behoeve van de energievoorziening van de kas
      of de beheersing van het kasklimaat;
        - *kasteeltsysteem:* geheel van maatregelen, technieken en voorzieningen voor de productie, oogst en verwerking van
      gewassen, niet zijnde een kasenergiesysteem;
        - *primaire energie:* energie uitgedrukt in hoeveelheid fossiele brandstof berekend op basis van de benodigde
      productie van de afzonderlijke energiesoorten waaronder in ieder geval elektriciteit en warmte.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.10.1
  - number: 2.10.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een glastuinbouwonderneming of een samenwerkingsverband van
      glastuinbouwondernemingen voor investeringen in een kas of een kasenergiesysteem:

      a. die tot energie-efficiëntie leiden binnen de regels die in artikel 38 van de algemene
      groepsvrijstellingsverordening zijn gesteld, of

      b. die de productie van energie uit hernieuwbare energiebronnen van de glastuinbouwonderneming bevorderen binnen de
      regels die in artikel 41 van de algemene groepsvrijstellingsverordening zijn gesteld.

      2 Per glastuinbouwonderneming of samenwerkingsverband kan één aanvraag worden ingediend voor een investering als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.10.2
  - number: 2.10.3
    text: |-
      1 De minister beslist afwijzend op een aanvraag:

      a. voor investeringen in een kas, indien:

      1°. de kas geen diffuus kasdek heeft:

        - met een lichttransmissie voor PAR-licht die minimaal 73% hemisferisch op gewashoogte is, en
        - waarvan het glas een Haze heeft van minimaal 35%;

      2°. de kas niet is voorzien van:

        - minimaal 2 tegelijkertijd en onafhankelijk van elkaar te sluiten energieschermen;
        - minimaal een energiescherm voor overdag met een lichtdoorlatendheid dat minimaal 70% hemisferisch is, en
        - minimaal een hoogisolerend energiescherm voor de nacht;

      3°. de kas op grond van de IDT-methode uit het jaar 2007 geen U-waarde heeft van maximaal 3 in een situatie met
      gesloten schermen;

      b. voor investeringen in een kasenergiesysteem die niet ten minste leiden tot:

      1°. 25% reductie van CO-emissie uit de glasopstanden van de glastuinbouwonderneming, en

      2°. 15% primaire energiereductie op nationaal niveau;

      c. voor investeringen in een kas of kasenergiesysteem die respectievelijk dat zich niet in de beginfase van de
      marktintroductie bevindt;

      d. indien de subsidie aan een glastuinbouwonderneming of per glastuinbouwonderneming die deelneemt aan een
      samenwerkingsverband van glastuinbouwondernemingen op grond van [artikel 2.10.4][ref1] lager zou zijn dan
      € 125.000;

      e. indien het aannemelijk is dat de activiteiten waar de aanvraag tot subsidieverlening
      betrekking op heeft in strijd zijn met de toepasselijke wettelijke voorschriften, bedoeld in
      [artikel 2.10.9, derde lid, onderdeel f][ref2];

      f. voor investeringen:

      1°. in een ketel of kachel gestookt op biomassa niet zijnde een biowarmtekrachtkoppelinginstallatie, vergasser op
      basis van niet-houtige biomassa of wervelbed ketel;

      2°. in een kasteeltsysteem;

      3°. in een aardwarmteproject waarvoor eerder op grond van het [Besluit stimulering duurzame energieproductie][ref3]
      subsidie verstrekt is of subsidie kan worden aangevraagd, of

      4°. waarvoor eerder op grond van [hoofdstuk 4][ref4] van deze regeling of
      [artikel 2.3.2 van de Subsidieregeling energie en innovatie][ref5], een subsidie is verstrekt;

      g. voor investeringen in energie-efficiëntie die betrekking hebben op verbeteringen die worden uitgevoerd om ervoor
      te zorgen dat de glastuinbouwonderneming of de glastuinbouwondernemingen die deelnemen aan een samenwerkingsverband
      voldoet respectievelijk voldoen aan reeds vastgestelde Unienormen;

      h. voor investeringen ter bevordering van energie uit hernieuwbare energiebronnen die bestemd zijn voor:

      1°. de productie van biobrandstoffen, voor zover de gesteunde investering niet wordt gebruikt voor de productie van
      duurzame biobrandstoffen niet zijnde biobrandstoffen op basis van voedingsgewassen;

      2°. biobrandstoffen waarvoor een leverings- of bijmengverplichting geldt;

      3°. waterkrachtinstallaties die niet aan richtlijn 2000/60/EG van het Europees Parlement en de Raad van 23 oktober
      2000 tot vaststelling van een kader voor communautaire maatregelen betreffende het waterbeleid (PbEG 2000, L 327)
      voldoen;

      4°. een installatie die niet nieuw is, of

      5°. een installatie die al in bedrijf is;

      i. indien de glastuinbouwonderneming of glastuinbouwondernemingen die deelnemen aan een samenwerkingsverband niet
      overeenkomstig [artikel 5 van de Handelsregisterwet 2007][ref6] in het handelsregister is respectievelijk zijn
      ingeschreven;

      j. indien de glastuinbouwonderneming of glastuinbouwondernemingen die deelnemen aan een samenwerkingsverband
      niet voldaan heeft respectievelijk hebben aan [artikel 24, tweede lid, van de Landbouwwet][ref7], indien aan hem
      respectievelijk hen op grond van artikel 24, eerste lid, van die wet door de minister beschrijvingsbiljetten zijn
      uitgereikt of gezonden, voor:

      1°. het jaar waarin de subsidie wordt aangevraagd, of

      2°. het jaar voorafgaand daaraan indien de gegevens van het jaar waarin de subsidie wordt aangevraagd nog niet
      beschikbaar zijn;

      k. indien de glastuinbouwonderneming of glastuinbouwondernemingen die deelnemen aan een samenwerkingsverband geen
      emissieaangifte als bedoeld in [artikel 3, eerste of tweede lid, van de Regeling kostenverevening reductie CO][ref8]
      heeft respectievelijk hebben ingediend voor:

      1°. het jaar waarin de subsidie wordt aangevraagd, of

      2°. het jaar voorafgaand daaraan, indien de gegevens voor de aangifte van het jaar waarin de subsidie is
      aangevraagd nog niet beschikbaar zijn.

      2 Een kas of kasenergiesysteem bevindt zich niet in de beginfase van de marktintroductie, bedoeld in het eerste
      lid, onderdeel c, indien:

      a. de kas of het kasenergiesysteem wordt toegepast:

      1°. op meer dan 5% van het potentiële toepassingsareaal, of

      2°. op meer dan 5% van de daarbij behorende ondernemingen, of

      b. er al op grond van [artikel 2.10.2, eerste lid][ref9], voor 15 aanvragen voor het desbetreffende type kas of
      kasenergiesysteem subsidie is verleend.

      3 In afwijking van het eerste lid, aanhef en onderdeel h, onder 1°, komt investeringssteun om bestaande
      installaties voor biobrandstoffen op basis van voedingsgewassen om te bouwen tot installaties voor geavanceerde
      biobrandstoffen wel voor subsidie in aanmerking, indien die op voedingsgewassen gebaseerde productie wordt
      verminderd naar rato van de nieuwe capaciteit.

      4 De afwijzingsgrond, bedoeld in het eerste lid, aanhef en onderdeel k, is niet van toepassing op een
      glastuinbouwonderneming of glastuinbouwondernemingen die deelnemen aan een samenwerkingsverband als bedoeld in
      [artikel 15.51, tweede lid, onderdeel b, van de Wet milieubeheer][ref10].


