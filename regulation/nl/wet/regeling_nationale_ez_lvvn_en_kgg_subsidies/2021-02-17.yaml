  - number: 2.1.2
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

        - *glasopstand:* kas en toebehorende installaties;
        - *glastuinbouwonderneming:* landbouwonderneming met glasopstanden;
        - *vervangingsinvestering:* investering voor het eenvoudige vervangen van een bestaand gebouw of een bestaande
      machine, of delen daarvan, door een nieuw modern gebouw of een nieuwe moderne machine, zonder dat daarbij de
      productiecapaciteit met meer dan 25% wordt verhoogd of de betrokken productie of technologie fundamenteel wordt
      gewijzigd.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.1.2
  - number: 2.2.1
    text: |-
      In deze titel wordt verstaan onder:

        - *broeikasgasemissies:* emissies van methaan, koolstofdioxide en lachgas vanuit het stalsysteem naar de lucht
      binnen de stal en de omgeving;
        - *brongerichte verduurzaming:* het zo veel mogelijk voorkomen van de vorming van broeikasgasemissies of
      stalemissies op een veehouderijlocatie;
        - *eindgebruiker:* veehouderijonderneming die ontwikkelde technologie gaat toepassen en daarmee brongerichte
      verduurzaming op zijn veehouderijlocatie realiseert;
        - *jonge landbouwer:* jonge landbouwer als bedoeld in artikel 2, onderdeel 34, van de
      groepsvrijstellingsverordening landbouw;
        - *leghennenhouderijonderneming:* pluimveehouderijonderneming waarin leghennen dan wel grootouder- of ouderdieren
      hiervan worden gehouden voor de primaire productie van consumptie-eieren respectievelijk broedeieren;
        - *managementmaatregelen:* maatregelen a. die op structurele basis worden uitgevoerd door de veehouderijonderneming
      aan de hand van een vooraf opgesteld protocol, waarin zich relevante parameters bevinden; b. waarvan de resultaten
      bijgehouden worden in een logboek; en c. waarbij de reductie van broeikasgasemissies of stalemissies wordt geborgd
      en wordt aangetoond via de methode van directe emissiemonitoring of een vergelijkbare registratiemethode;
        - *melkgeitenhouderijonderneming:* veehouderijonderneming waarin melkgeiten worden gehouden voor de primaire
      productie van melk of de vermeerdering van de desbetreffende dieren;
        - *melkveehouderijonderneming:* veehouderijonderneming waarin melkkoeien worden gehouden voor de primaire productie
      van melk of de vermeerdering van de desbetreffende dieren;
        - *onderzoeksorganisatie:* organisatie voor onderzoek en kennisverspreiding als bedoeld in artikel 2, onderdeel 83,
      van de algemene groepsvrijstellingsverordening;
        - *pluimveehouderijonderneming:* veehouderijonderneming waarin eenden, kalkoenen of kippen, waaronder begrepen
      leghennen, vleeskuikens dan wel grootouder- of ouderdieren hiervan, worden gehouden voor de primaire productie van
      vlees, consumptie-eieren of broedeieren;
        - *stalemissies:* emissies van ammoniak, endotoxinen, fijnstof en geur vanuit het stalsysteem naar de lucht binnen
      de stal en de omgeving;
        - *stalsysteem:* mest- en voeropslag, mestkelder, mestbewerkingsinstallatie of dierenverblijven, of een combinatie
      hiervan, die zich bevindt respectievelijk die zich bevinden op een veehouderijlocatie;
        - *varkenshouderijonderneming:* veehouderijonderneming waarin varkens worden gehouden voor de primaire productie
      van vlees of de vermeerdering van varkens;
        - *veehouderijonderneming:* een landbouwonderneming waarin dieren worden gehouden voor de primaire productie van
      landbouwproducten of vermeerdering van de desbetreffende dieren;
        - *veehouderijlocatie:* vestiging van een veehouderijonderneming;
        - *vleeskalverhouderijonderneming:* veehouderijonderneming waarin vleeskalveren worden gehouden voor de primaire
      productie van vlees;
        - *vleeskuikenhouderijonderneming:* pluimveehouderijonderneming waarin vleeskuikens worden gehouden voor de
      primaire productie van vlees;
        - *vleeskuikenouderdierhouderijonderneming:* pluimveehouderijonderneming waarin grootouder- of ouderdieren van
      vleeskuikens worden gehouden voor de primaire productie van broedeieren.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.2.1
  - number: 2.2.2
    text: |-
      1 De minister verstrekt op grond van deze paragraaf op aanvraag subsidie aan een deelnemer in een
      samenwerkingsverband voor het uitvoeren van een innovatieproject gericht op brongerichte verduurzaming op een
      veehouderijlocatie van:

      a. een varkenshouderijonderneming;

      b. een melkgeitenhouderijonderneming;

      c. een melkveehouderijonderneming; of

      d. een vleeskalverhouderijonderneming;

      e. een leghennenhouderijonderneming;

      f. een vleeskuikenhouderijonderneming;

      g. een vleeskuikenouderdierhouderijonderneming.

      2 Een innovatieproject bestaat uit:

      a. een onderzoeks- en ontwikkelingsfase, een emissiemetingenfase en een resterende productieve levensduurfase;
      dan wel

      b. uitsluitend een emissiemetingenfase.

      3 Aan een samenwerkingsverband nemen ten minste één onderzoeksorganisatie en één veehouderijonderneming deel.

      4 Een veehouderijonderneming in een samenwerkingsverband als bedoeld in het derde lid, is potentiële eindgebruiker
      van:

      a. indien een innovatieproject de drie fases, bedoeld in het tweede lid, onderdeel a, betreft: de te subsidiëren
      investeringen, managementmaatregelen of combinatie hiervan, bedoeld in [artikel 2.2.10][ref1]; of

      b. indien het innovatieproject uitsluitend de emissiemetingenfase, bedoeld in het tweede lid onderdeel b, betreft:
      de bij de emissiemeting te gebruiken investeringen, managementmaatregelen of combinatie hiervan, die op grond van
      [artikel 2.2.10][ref2], voor subsidie in aanmerking zouden zijn gekomen indien het project betrekking zou hebben
      gehad op de onderzoeks- en ontwikkelingsfase.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.10
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.10
