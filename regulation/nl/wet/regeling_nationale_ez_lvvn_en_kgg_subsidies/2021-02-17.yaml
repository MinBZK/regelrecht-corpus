  - number: 3.17.1
    text: |-
      In deze titel wordt verstaan onder:

        - *opschalen:* het uitvoeren van activiteiten waarmee een supportprogramma, dat na eerdere toepassing positieve
      gevolgen heeft gehad voor de oprichting en groei van startups of scale-ups in een bepaalde provincie in Nederland
      of in het buitenland, wordt uitgebreid naar minimaal twee andere Nederlandse provincies, eventueel door middel van
      samenvoeging met één of meer andere supportprogramma’s tot één groter supportprogramma;
        - *supportprogramma:* samenhangend geheel van activiteiten dat gericht is op het creëren van gunstige
      randvoorwaarden voor de oprichting en groei van startups of scale-ups, bestaande uit ondersteuning bij het
      verkrijgen van toegang tot: a. financiering; b. markten; c. talent; d. samenwerkingspartners; of e. technologische
      of wetenschappelijke kennis die bruikbaar is bij het ontwikkelen van een product;
        - *scale-up:* een startup die substantieel is doorgegroeid en waarvan de verwachting is dat deze zou kunnen blijven
      doorgroeien;
        - *startup:* een kleine of middelgrote onderneming die: a. actief in stand gehouden wordt voor een aaneengesloten
      periode van ten hoogste tien jaar; en b. een vernieuwend product of dienst ontwikkelt of levert: 1°. die tot
      stand komt respectievelijk is gekomen door het gebruik van een nieuwe of bestaande technologie; en 2°. waarvan het
      aannemelijk is dat deze voor langere tijd door een steeds groter aantal klanten gebruikt zal worden.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.17.1
  - number: 3.17.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een natuurlijke persoon, ondernemer, onderwijsinstelling,
      stichting, vereniging of andere organisatie voor het zelfstandig of in een samenwerkingsverband uitvoeren van
      een opschalingsproject dat door middel van de opschaling van één of meer supportprogramma’s gericht is op een
      effectieve en efficiënte ondersteuning van de oprichting of groei van startups en scale-ups.

      2 Een opschalingsproject bestaat uit het opschalen van één of meer supportprogramma’s via het verzorgen van
      advisering inzake de opschaling, communicatie, coördinatie, procesmanagement en overige projectactiviteiten die
      bijdragen aan het doel van een opschalingsproject.

      3 De subsidieaanvrager, bedoeld in het eerste lid, houdt geen onderneming in stand, die actief is in:

      a. de sector visserij en aquacultuur;

      b. de primaire productie van landbouwproducten; of

      c. de sector verwerking en afzet van landbouwproducten in de gevallen, bedoeld in artikel 1, eerste lid, onder c,
      van de algemene de-minimisverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.17.2
  - number: 3.17.3
    text: |-
      1 De subsidie voor de uitvoering van een opschalingsproject bedraagt 50% van de subsidiabele kosten.

      2 De subsidie bedraagt:

      a. minder dan € 125.000 per subsidieaanvrager die het opschalingsproject zelfstandig dan wel in een
      samenwerkingsverband uitvoert;

      b. ten hoogste € 500.000 per opschalingsproject, indien een opschalingsproject wordt uitgevoerd in een
      samenwerkingsverband.

      3 Het totale bedrag aan de-minimissteun bedraagt bij een opschalingsproject voor een subsidieontvanger die dit
      project zelfstandig dan wel in een samenwerkingsverband uitvoert maximaal het bedrag, bedoeld in artikel 3, tweede
      lid, van de algemene de-minimisverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.17.3
  - number: 3.17.4
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.17.4
  - number: 3.17.5
    text: |-
      1 Met de uitvoering van de op grond van deze titel gesubsidieerde opschalingsprojecten wordt gestart binnen twee
      maanden na de subsidieverlening.

      2 De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.17.5
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.17.6
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. na toepassing van [artikel 3.17.7, eerste lid, onderdelen a, b en c, en tweede lid][ref1], minder dan 6 punten
      per criterium, zijn toegekend;

      b. de te verlenen subsidie minder dan € 25.000 per subsidieaanvrager zou bedragen;

      c. de aanvraag activiteiten bevat die direct verband houden met:

      1°. de omvang van de uitvoer naar andere lidstaten van de Europese Unie of derde landen;

      2°. het oprichten en exploiteren van een distributienet ten behoeve van de uitvoer; of

      3° andere lopende uitgaven direct verband houdend met activiteiten op het gebied van uitvoer.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.7
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.17.6
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.17.7
        hoofdstuk: '3'
  - number: 3.17.7
    text: |-
      1 De minister kent aan een opschalingsproject een hoger aantal punten toe naarmate:

      a. het opschalingsproject meer bijdraagt aan de verwezenlijking van de doelstelling van de subsidie, bedoeld in
      [artikel 3.17.2, eerste lid][ref1];

      b. de kwaliteit van het opschalingsproject beter is, blijkend uit de uitwerking van aanpak en methodiek, de omgang
      met risico’s, de uitvoerbaarheid, de mate waarin de beschikbare middelen efficiënt worden ingezet en de mate waarin
      de opschaling van een supportprogramma na afronding van het opschalingsproject naar verwachting in stand gehouden
      of uitgebreid wordt met behulp van private vervolgfinanciering;

      c. de subsidieaanvrager die het opschalingsproject zelfstandig uitvoert dan wel het samenwerkingsverband
      dat het project uitvoert meer geschikt is om een opschalingsproject uit te voeren, blijkend uit de daarvoor
      benodigde competenties, de intrinsieke motivatie voor het project, het externe draagvlak voor het project, de
      succesvolle ervaring met de uitvoering van supportprogramma’s en de projectorganisatie die aanwezig zijn bij de
      subsidieaanvrager dan wel in het samenwerkingsverband;

      d. het door het opschalingsproject op te schalen supportprogramma naar verwachting een positieve impact zal hebben
      op het herstel van de negatieve gevolgen van de economische crisis, die is veroorzaakt door de uitbraak van het
      coronavirus, voor startups en scale-ups.

      2 De minister kent per onderdeel van het eerste lid ten minste één en ten hoogste tien punten toe.

      3 Voor de rangschikking wordt het aantal punten gegeven voor het eerste lid, onderdeel a, vermenigvuldigd met 4,
      het eerste lid, onderdeel b, vermenigvuldigd met 3, het eerste lid, onderdeel c, vermenigvuldigd met 2, het eerste
      lid, onderdeel d, vermenigvuldigd met 1, en vervolgens opgeteld.

      4 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.2
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.17.7
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.17.2
        hoofdstuk: '3'
  - number: 3.17.8
    text: |-
      1 Er is een Adviescommissie Opschaling supportprogramma’s startups en scale-ups, die tot taak heeft de minister op
      zijn verzoek te adviseren omtrent de rangschikkingscriteria, bedoeld in [artikel 3.17.7][ref1].

      2 De commissie bestaat uit ten minste drie en ten hoogste vijf leden.

      3 De voorzitter en de andere leden van de commissie worden door de minister voor een termijn van ten hoogste drie
      jaar benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.7
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.17.8
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.17.7
        hoofdstuk: '3'
  - number: 3.17.9
    text: |-
      1 Een aanvraag voor subsidie bevat ten minste:

      a. gegevens over de aanvrager, waaronder het post- en bezoekadres, het rekeningnummer en, voor zover van
      toepassing, het nummer waarmee de onderneming is geregistreerd bij de Kamer van Koophandel;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. kerngegevens over het opschalingsproject, die bestaan uit een samenvatting van het projectvoorstel en, voor
      zover van toepassing, een lijst met deelnemers van het samenwerkingsverband dat het opschalingsproject zal
      uitvoeren;

      d. een verklaring de-minimissteun van een subsidieaanvrager die zelfstandig of als deelnemer in een
      samenwerkingsverband de subsidiabele activiteiten uitvoert.

      2 De aanvraag gaat vergezeld van:

      a. een projectplan dat in ieder geval de volgende onderdelen bevat:

      1°. een omschrijving van de doelstelling van het project, een omschrijving van de werkzaamheden, inclusief een
      beschrijving van de positieve gevolgen van de eerdere toepassing van het op te schalen supportprogramma op het
      ontstaan van startups of de groei van startups en scale-ups en een onderbouwing van de verwachte positieve gevolgen
      bij opschaling hiervan;

      2°. een begroting waarin de totale kosten van de subsidiabele activiteiten en de omvang van de gevraagde subsidie
      zijn opgenomen, informatie over de wijze waarop de subsidieaanvrager of de deelnemers van het samenwerkingsverband
      hun eigen aandeel in de projectkosten financieren;

      b. een plan voor vervolgfinanciering voor het verder uitbreiden of in stand houden van de opschaling in de periode
      nadat het opschalingsproject is afgerond;

      c. documenten met daarin een beknopte beschrijving van de kennis, ervaring en capaciteiten van de bij de uitvoering
      van het opschalingsproject betrokken personen en getuigenschriften waaruit het externe draagvlak blijkt, voor zover
      deze relevant zijn voor de toepassing van [artikel 3.17.7, eerste lid, onderdeel c, en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.7
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.17.9
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.17.7
        hoofdstuk: '3'
  - number: 3.17.10
    text: |-
      Het eindverslag, bedoeld in [artikel 50, tweede lid, onderdeel a, van het besluit][ref1], waarmee de aanvraag tot
      subsidievaststelling vergezeld gaat, bevat, voor zover van toepassing, in ieder geval:

      a. een omschrijving van de projectresultaten;

      b. het type en aantal startups en scale-ups dat door het opgeschaalde supportprogramma is ondersteund en de wijze
      waarop deze ondersteuning plaatsgevonden heeft;

      c. op welke wijze het opschalingsproject heeft bijgedragen aan de doelstelling van de subsidie, bedoeld in
      [artikel 3.17.2, eerste lid][ref2];

      d. welke inspanningen zijn verricht om de vervolgfinanciering te realiseren voor het verder uitbreiden of in stand
      houden van het opgeschaalde supportprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.2
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.17.10
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 3.17.2
        hoofdstuk: '3'
  - number: 3.17.11
    text: |-
      De subsidie, bedoeld in [artikel 3.17.2, eerste lid][ref1], bevat staatsteun en wordt gerechtvaardigd door de
      algemene de-minimisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.2
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.17.11
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.17.2
        hoofdstuk: '3'
  - number: 3.17.12
    text: |-
      Deze titel vervalt met ingang van 1 september 2025, met dien verstande dat deze van toepassing blijft op subsidies
      die voor deze datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.17.12
  - number: 3.19.1
    text: |-
      In deze titel wordt verstaan onder:

        - *drijvende en bewegende offshore-constructie:* constructie voor de exploratie, exploitatie of productie van olie,
      gas of hernieuwbare energie of winning van grond- en voedingsstoffen op zee of opslag van CO in de zeebodem die:
      a. niet beschikt over eigen voortstuwing; en b. bedoeld is om meermaals op eigen drijfvermogen te worden verplaatst
      terwijl zij in bedrijf is;
        - *scheepsbouwinnovatieproject:* een project dat bestaat uit de experimentele ontwikkeling van nieuwe of verbeterde
      onderdelen bij de bouw of verbouw van een schip of de bouw van een drijvende en bewegende offshore-constructie
      in vergelijking met die welke in de scheepsbouwsector gewoonlijk binnen de Europese Unie worden gebruikt of
      beschikbaar zijn en waarvan de implementatie of toepassing een risico op technologische of industriële mislukking
      inhoudt;
        - *scheepswerf:* onderneming die schepen of drijvende en bewegende offshore-constructies ontwerpt, ontwikkelt,
      bouwt en uitrust;
        - *schip:* zichzelf voortstuwend zeeschip of binnenvaartschip dat is bestemd om voor commerciële doeleinden te
      worden gebruikt en tot één van de volgende categorieën behoort: a. zeeschepen of binnenvaartschepen, niet zijnde
      vissersvaartuigen, met een minimaal tonnage van 100 bruto ton, bestemd voor het vervoer van passagiers of goederen
      of voor het verrichten van een speciale dienst; b. sleepboten met een minimaal vermogen van 365 kW.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.19.1
  - number: 3.19.2
    text: |-
      De minister kan op aanvraag subsidie verstrekken aan een scheepswerf voor een scheepsbouwinnovatieproject dat een
      bijdrage levert aan duurzame ontwikkeling op de gebieden, beschreven in [bijlage 3.19.1][ref1], en gericht is op:

      a. de ontwikkeling en het ontwerp van een nieuwe scheepsklasse of een nieuwe klasse drijvende en bewegende
      offshore-constructies;

      b. de ontwikkeling van een nieuw onderdeel van een schip of drijvende en bewegende offshore-constructie dat als
      afzonderlijk element van het schip of de drijvende en bewegende offshore-constructie kan worden onderscheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.19.2
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 3.19.3
    text: De subsidie bedraagt 25% van de subsidiabele kosten en bedraagt maximaal € 1.250.000.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.19.3
  - number: 3.19.4
    text: |-
      Voor subsidie komen uitsluitend de kosten in aanmerking, bedoeld in artikel 25, derde lid, onderdelen a, b, d en e,
      van de algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.19.4
  - number: 3.19.5
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.19.5
  - number: 3.19.6
    text: |-
      1 De subsidie wordt verleend onder de opschortende voorwaarde dat de subsidieontvanger binnen 13 weken na de
      beschikking tot subsidieverlening aantoont dat:

      a. de opdrachtgever en de subsidieontvanger de overeenkomst tot de bouw of verbouw van een schip of de bouw van
      een drijvende en bewegende offshore-constructie waarvoor een scheepsbouwinnovatieproject wordt uitgevoerd hebben
      gesloten;

      b. de opdrachtgever ter uitvoering van de overeenkomst, bedoeld in onderdeel a, een of meer betalingen heeft
      gedaan, en

      c. de overeenkomst, bedoeld in onderdeel a, een volledige weergave vormt van de tussen subsidieontvanger en
      opdrachtgever gemaakte afspraken.

      2 De minister kan op verzoek van de subsidieontvanger de termijn, bedoeld in het eerste lid, verlengen tot een
      periode van maximaal twee jaar na de beschikking tot subsidieverlening.

      3 Met de uitvoering van het scheepsbouwinnovatieproject wordt gestart binnen de termijn die ingevolge het eerste of
      tweede lid op de subsidieverlening van toepassing is.

      4 Het scheepsbouwinnovatieproject wordt uitgevoerd binnen drie jaar na de aanvang daarvan.

      5 De minister kan op verzoek van de subsidieontvanger de termijn, bedoeld in het vierde lid, verlengen met een
      periode van maximaal twee jaar.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.19.6
  - number: 3.19.7
    text: |-
      1 Er is een Adviescommissie duurzame scheepsbouw die tot taak heeft de minister op zijn verzoek te
      adviseren omtrent de afwijzingsgronden, bedoeld in [artikelen 22][ref1] en [23 van het besluit][ref2] en
      [artikel 3.19.8][ref3], alsmede de rangschikkingscriteria, bedoeld in [artikel 3.19.8a][ref4].

      2 De commissie bestaat uit ten minste drie en ten hoogste vijf leden.

      3 De voorzitter en de andere leden worden door de minister voor een termijn van ten hoogste drie jaar benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.19.8
      [ref4]: https://wetten.overheid.nl/BWBR0035474#Artikel3.19.8a
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.19.7
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0035474
        artikel: 3.19.8
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0035474
        artikel: 3.19.8a
        hoofdstuk: '3'
  - number: 3.19.8
    text: |-
      De minister beslist afwijzend op een aanvraag om subsidie, indien:

      a. tussen de subsidieontvanger en de opdrachtgever voor indiening van de aanvraag om subsidie een overeenkomst
      tot de bouw of verbouw van een schip of de bouw van een drijvende en bewegende offshore-constructie waarbij een
      scheepsbouwinnovatieproject wordt uitgevoerd is gesloten;

      b. door verstrekking van de subsidie, bedoeld in [artikel 3.19.2][ref1], het totaal van de op grond van dit artikel
      ontvangen subsidie ten behoeve van een scheepswerf of een groep van ondernemingen waartoe deze scheepswerf behoort,
      meer bedraagt dan € 1.250.000;

      c. van het scheepsbouwinnovatieproject onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten
      zijn;

      d. het scheepsbouwinnovatieproject niet leidt tot een voldoende mate van vernieuwing van een product;

      e. het scheepsbouwinnovatieproject onvoldoende bijdraagt aan duurzame ontwikkeling op de gebieden, beschreven in
      [bijlage 3.19.1][ref2];

      f. de kwaliteit van het projectplan onvoldoende is;

      g. het scheepsbouwinnovatieproject een niveau van milieubescherming beoogt te bereiken dat niet verder gaat dan
      verplicht op grond van EU-rechtshandelingen;

      h. na toepassing van [artikel 3.19.8a, eerste lid][ref3], minder dan tien punten voor één of meer criteria zijn
      toegekend;

      i. na toepassing van [artikel 3.19.8a, eerste lid][ref4], minder dan zestig punten zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.19.2
