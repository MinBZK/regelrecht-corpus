  - number: 2.2.27
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een pluimveehouderijonderneming voor de uitvoering van een
      investeringsproject betreffende een investering of combinatie van investeringen die bestemd is respectievelijk zijn
      voor de inrichting of herinrichting van een stalsysteem op een veehouderijlocatie en waarvan de toepassing leidt
      tot brongerichte verduurzaming.

      2 Een investering betreft de aanschaf en het gebruiksklaar maken van één of meer technieken, installaties,
      apparatuur, machines of uitrusting die zijn opgenomen in [bijlage 2.2.2][ref1].

      3 Een pluimveehouderijonderneming dient per veehouderijlocatie één aanvraag om subsidie in.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.2.27
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 2.2.28
    text: |-
      1 De subsidie bedraagt 40% van de subsidiabele kosten.

      2 Het percentage, genoemd in het eerste lid, wordt verhoogd met 20 procentpunten indien:

      a. subsidie wordt verstrekt aan jonge landbouwers of landbouwers die zich hebben gevestigd in de periode van vijf
      jaar voorafgaand aan de datum van de subsidieaanvraag als bedoeld in artikel 14, dertiende lid, onderdeel a, van de
      groepsvrijstellingsverordening landbouw;

      b. subsidie wordt verstrekt voor de extra kosten voor investeringen om het natuurlijke milieu, de
      hygiëneomstandigheden of de normen inzake dierenwelzijn te verbeteren om een hoger niveau dan de geldende normen
      van de Europese Unie te halen, en die niet leiden tot een verhoging van de productiecapaciteit, bedoeld in artikel
      14, dertiende lid, onderdeel e, van de groepsvrijstellingsverordening landbouw.

      3 De subsidie bedraagt ten hoogste € 500.000 per pluimveehouderijonderneming.

      4 Onverminderd het derde lid bedraagt de subsidie ten hoogste:

      a. € 140.000 per veehouderijlocatie;

      b. € 35.000 per stalsysteem.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.2.28
  - number: 2.2.29
    text: |-
      1 Voor subsidie komen uitsluitend in aanmerking de kosten, bedoeld in artikel 14, zesde lid, onderdelen a tot en
      met d, van de groepsvrijstellingsverordening landbouw.

      2 Voor subsidie komen niet in aanmerking de kosten die gemaakt worden om te voldoen aan wettelijke verplichtingen,
      waaronder verplichtingen ingevolge het Besluit emissiearme huisvesting veehouderij.
