  - number: 4.2.16
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een deelnemer in een samenwerkingsverband voor het uitvoeren
      van een HER+-project.

      2 Een samenwerkingsverband bevat ten minste één onderneming.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.2.16
  - number: 4.2.17
    text: |-
      1 De subsidie bedraagt voor een HER+-project:

      a. 50% van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek;

      b. 25% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling;

      c. 80% van de subsidiabele kosten voor zover deze betrekking hebben op niet-economische activiteiten van
      onderzoeksorganisaties;

      d. voor een energiedemonstratieproject:

      1°. 45% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat maatregelen betreft
      ter bevordering van energie uit hernieuwbare energiebronnen en waarbij de subsidiabele kosten worden berekend in
      overeenstemming met artikel 41, zesde lid, onderdeel a of b, van de algemene groepsvrijstellingsverordening;

      2°. 30% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat maatregelen betreft
      ter bevordering van energie uit hernieuwbare energiebronnen en waarbij de subsidiabele kosten worden berekend in
      overeenstemming met artikel 41, zesde lid, onderdeel c, van de algemene groepsvrijstellingsverordening;

      3°. 30% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat energie-efficiëntie
      maatregelen betreft en waarbij de subsidiabele kosten worden berekend in overeenstemming met artikel 38, derde lid,
      van de algemene groepsvrijstellingsverordening.

      2 De subsidiabele kosten van een energiedemonstratieproject worden berekend in overeenstemming met artikel 41 van
      de algemene groepsvrijstellingsverordening.

      3 De percentages, genoemd in het eerste lid, onderdelen a, b en d, worden verhoogd met:

      a. 10 procentpunten, indien de aanvrager een middelgrote onderneming is en de subsidiabele kosten worden gemaakt en
      betaald door de middelgrote onderneming; of

      b. 20 procentpunten, indien de aanvrager een kleine onderneming is en de subsidiabele kosten worden gemaakt en
      betaald door de kleine onderneming.

      4 Onverminderd het derde lid, worden de in het eerste lid, onderdelen a en b, genoemde percentages voor
      ondernemingen met 10 procentpunten verhoogd, indien het project samenwerking met een onderzoeksorganisatie betreft,
      de onderzoeksorganisatie minstens 10% van de subsidiabele projectkosten draagt en de onderzoeksorganisatie het
      recht heeft de resultaten van het project te publiceren voor zover deze afkomstig zijn van het door die organisatie
      uitgevoerde onderzoek.

      5 De subsidie bedraagt maximaal € 6.000.000 per HER+-project.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.2.17
  - number: 4.2.18
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.2.18
  - number: 4.2.19
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.2.19
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 4.2.20
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. de aanvrager niet aannemelijk heeft gemaakt dat het project leidt tot CO-reductie in 2030, en

      1°. leidt tot een besparing op de uitgaven aan subsidies in het kader van het
      [Besluit stimulering duurzame energieproductie][ref1], die groter is dan de aangevraagde subsidie onder deze
      paragraaf, hetgeen uit een berekening blijkt, of

      2°. indien het project betrekking heeft op windenergie op zee, het project leidt tot kostenvoordelen bij de bouw of
      exploitatie van in de territoriale wateren en de exclusieve economische zone van Nederland te realiseren windparken
      op zee die groter zijn dan de aangevraagde subsidie onder deze paragraaf, hetgeen uit een berekening blijkt;

      b. de kwaliteit van het project onvoldoende is, blijkend uit de uitwerking van aanpak en methodiek, de omgang
      met risico’s, de uitvoerbaarheid, de deelnemende partijen of de mate waarin de beschikbare middelen effectief en
      efficiënt worden ingezet;

      c. in onvoldoende mate is voorzien in een kwalitatief goede kennisverspreiding;

      d. eerder op grond van dit hoofdstuk of de Subsidieregeling energie en innovatie een subsidie is verstrekt voor een
      soortgelijk project;

      e. de samenwerking onvoldoende evenwichtig is, blijkend uit:

      1°. de verdeling van de kosten tussen de deelnemers, of

      2°. de verhouding tussen private en publieke financiering van het project.


      [ref1]: https://wetten.overheid.nl/BWBR0022735
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel4.2.20
    references:
      - id: ref1
        bwb_id: BWBR0022735
  - number: 4.2.21
    text: |-
