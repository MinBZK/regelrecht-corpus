  - number: 4.5.5
    text: |-
      De subsidie voor een investering voor de aansluiting op een warmtenet als bedoeld in
      [artikel 4.5.2, vierde lid][ref1], bedraagt:

      a. voor een individuele aansluiting op een warmtenet als bedoeld in [artikel 4.5.2, vierde lid][ref2], onderdeel
      a, € 3.325;

      b. voor een centrale aansluiting op een warmtenet als bedoeld in [artikel 4.5.2, vierde lid, onderdeel b][ref3],
      bij een vermogen van:

      1°. ten hoogste 100 kW: € 2.925;

      2°. meer dan 100 kW tot en met 400 kW: € 12.334;

      3°. meer dan 400 kW: € 21.906.


