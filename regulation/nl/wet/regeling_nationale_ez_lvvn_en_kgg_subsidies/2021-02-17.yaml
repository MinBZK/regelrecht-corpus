  - number: 3.11.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan:

      a. een bank voor het sluiten van kredietovereenkomsten met MKB-ondernemers die betrekking hebben op
      bedrijfsborgstellingskredieten;

      b. een door de minister aangewezen kredietverstrekker, als bedoeld in [artikel 3.11.1, eerste lid][ref1], voor het
      sluiten van kredietovereenkomsten met MKB-ondernemers die betrekking hebben op bedrijfsborgstellingskredieten.

      2 De subsidie wordt verstrekt in de vorm van een borgstelling voor de terugbetaling van een krediet dat de
      financier op grond van een kredietovereenkomst aan een MKB-ondernemer heeft verstrekt voor de duur van de
      kredietovereenkomst.

      3 In aanvulling op het eerste lid kan de minister ook subsidie verstrekken aan:

      a. een kredietinstelling als bedoeld in [artikel 3.11.1, tweede lid][ref2], voor het sluiten van
      kredietovereenkomsten met MKB-ondernemers die gevestigd zijn in het openbaar lichaam Bonaire, Sint Eustatius of
      Saba, die betrekking hebben op bedrijfsborgstellingskredieten;

      b. een door de minister aangewezen kredietverstrekker als bedoeld in [artikel 3.11.1, tweede lid][ref3],
      voor het sluiten van kredietovereenkomsten met MKB-ondernemers die gevestigd zijn in het openbaar
      lichaam Bonaire Sint Eustatius of Saba, die betrekking hebben op bedrijfsborgstellingskredieten.
      [Artikel 3.11.4, eerste lid, onderdeel a, onder 1][ref4], is niet van toepassing op de in dit lid bedoelde MKB-
      ondernemers.


