  - number: 2.2.9
    text: |-
      1 Het eindverslag, bedoeld in [artikel 50, tweede lid, onderdeel a, van het besluit][ref1], waarvan de aanvraag tot
      subsidievaststelling vergezeld gaat, bevat, voor zover van toepassing, in ieder geval:

      a. een algemene en technische omschrijving van de aangeschafte en gebruikte installaties, indien een
      innovatieproject de drie fases, bedoeld in [artikel 2.2.2, tweede lid, onderdeel a][ref2], betreft;

      b. een overzicht van de kostenopbouw toegespitst op de verschillende kostencomponenten, indien een innovatieproject
      uitsluitend de emissiemetingenfase, bedoeld in [artikel 2.2.2, tweede lid, onderdeel a][ref3], betreft.

      2 Onverminderd het eerste lid gaat de aanvraag tot subsidievaststelling vergezeld van:

      a. een afschrift van de factuur en het betalingsbewijs voor investeringen als bedoeld in
      [artikel 2.2.10, onderdeel a][ref4], indien een innovatieproject de drie fases, bedoeld in
      [artikel 2.2.2, tweede lid, onderdeel a][ref5], betreft, en de verleende subsidie minder dan € 125.000 per
      subsidieaanvrager bedraagt;

      b. een effectmeting als bedoeld in [artikel 2.2.15][ref6];

      c. een document waaruit blijkt of investeringen als bedoeld in [artikel 2.2.10, onderdeel a][ref7], in gebruik
      zijn genomen, indien een innovatieproject de drie fases, bedoeld in [artikel 2.2.2, tweede lid, onderdeel a][ref8],
      betreft;

      d. de benodigde milieueffectbeoordeling of de vergunning voor het betrokken investeringsproject,
      bedoeld in [artikel 2.2.25][ref9], indien een innovatieproject de drie fases, bedoeld in
      [artikel 2.2.2, tweede lid, onderdeel a][ref10], betreft;

      e. een berekening van de met het innovatieproject gerealiseerde reductie van broeikasgasemissies en stalemissies.


