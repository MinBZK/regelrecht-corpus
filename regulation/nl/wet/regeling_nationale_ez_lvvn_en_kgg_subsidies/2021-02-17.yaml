  - number: B3.25.1:2
    text: |-
      De Staat stelt zich garant ten behoeve van de Financier voor de terugbetaling van garantstellingskredieten die
      met inachtneming van het [Kaderbesluit nationale EZ-subsidies][ref1] en [paragraaf 3.25][ref2] van de Regeling
      nationale EZK- en LNV-subsidies en deze overeenkomst door de Financier worden verstrekt, met dien verstande dat
      deze garantstelling wordt aangegaan onder de navolgende bedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0035474
        hoofdstuk: '3'
  - number: B3.25.1:3
    text: |-
      1 De Financier draagt er zorg voor dat:

      a. het krediet voldoet aan de volgende voorwaarden:

      1°. het kredietbedrag dat wordt verleend aan de MKB-ondernemer bedraagt ten minste € 10.000,– maar niet meer dan
      € 50.000,–;

      2°. het krediet heeft een maximale reguliere looptijd van 5 jaar, met de mogelijkheid tot opschorting met een
      periode van maximaal 8 kwartalen, waarbij de opschorting gepaard gaat met een verlenging van de looptijd met
      dezelfde periode;

      3°. het tarief, dat de Financier per jaar aan de MKB-ondernemer in rekening brengt, bedraagt maximaal 4% van het
      kredietbedrag voor de gehele looptijd van het krediet;

      4°. de verstrekking van het krediet dient niet ter vervanging van aan een ondernemer verschaft krediet of
      risicokapitaal door dezelfde financier of door een financier die deel uitmaakt van de groep van dezelfde financier,
      tenzij het krediet dient ter vervanging van een krediet dat is verstrekt of aangeboden vanaf 7 mei 2020 tot en
      met het tijdstip waarop de regeling van de Staatssecretaris van Economische Zaken en Klimaat van 28 mei 2020, nr.
      WJZ/20154102, houdende wijziging van de Regeling nationale EZK- en LNV-subsidies en de Regeling openstelling EZK-
      en LNV-subsidies 2020 in verband met de invoering en openstelling van de subsidiemodule Garantie Klein Krediet
      Corona in werking treedt;

      5°. het krediet dient, na een eventuele aflossingsvrije periode van maximaal 12 maanden na verstrekking van het
      krediet, op annuïtaire of lineaire basis te worden afgelost, althans de rekening-courant verhouding dient te wordt
      gereduceerd, tot een nulstand aan het einde van de looptijd;

      b. het krediet is gemeld overeenkomstig artikel 5;

      c. de door de minister op grond van [artikel 3.25.4][ref1] van de Regeling nationale EZK- en LNV-subsidies
      vastgestelde eenmalige provisie, bedoeld in dat artikel, door de Financier aan de Staat is betaald binnen 35 dagen
      na het verstrekken van het krediet;

      d. de kredietovereenkomst in schriftelijke vorm of langs elektronische weg tot stand is gekomen;

      6°. de relaties tussen de Financier en de bij zijn onderneming betrokkenen enerzijds, en de ondernemers aan wie
      kapitaal wordt verschaft anderzijds, transparant zijn.

      2 De toepasselijkheid van deze garantstellingsovereenkomst kan slechts worden ingeroepen indien en voor zover door
      de melding, bedoeld in het eerste lid, onderdeel b, de som van de in een kalenderjaar gemelde kredieten of delen
      daarvan de door de minister op grond van [artikel 3.25.5, tweede lid][ref2], van de Regeling nationale EZK- en LNV-
      subsidies met betrekking tot dat kalenderjaar vastgestelde maximumbedrag per financier niet is overschreden.

      3 Indien de MKB-ondernemer een rechtspersoon is of een personenvennootschap met een rechtspersoon als vennoot,
      geldt een persoonlijke borgstelling van 10% van de hoofdsom van het garantstellingskrediet.

      4 De MKB-ondernemer kan het garantstellingskrediet slechts zonder vergoeding aflossen wanneer de hoofdsom in zijn
      geheel wordt afgelost.

      5 De MKB-ondernemer kan het garantstellingskrediet tussentijds aanvullend aflossen onder voorwaarde dat dit eenmaal
      per jaar gebeurt voor minimaal 20% van de hoofdsom van het garantstellingskrediet (of openstaand saldo bij krediet
      in rekening-courant) of volgens een andere afspraak conform de Gedragscode Kleinzakelijke Financiering zoals
      toegepast door de Financier.

      6 Het garantstellingskrediet heeft niet als doel de afwenteling van bestaande risico’s op de Staat.

      7 Het garantstellingskrediet wordt niet later aangevraagd dan 15 juni 2021 en wordt verstrekt uiterlijk tot en met
      30 juni 2021.

      8 De opschorting, bedoeld in artikel 3, lid 1, onderdeel a, onder 2, vereist niet de voorafgaande goedkeuring van
      de Staat.


