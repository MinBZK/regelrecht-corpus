  - number: 4.3.18
    text: |-
      Deze titel en de [bijlagen 4.3.1][ref1] en [4.3.2][ref2] vervallen met ingang van 1 juli 2022, met dien verstande
      dat deze van toepassing blijven op subsidies die voor die datum zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
      [ref2]: https://wetten.overheid.nl/BWBR0035474
