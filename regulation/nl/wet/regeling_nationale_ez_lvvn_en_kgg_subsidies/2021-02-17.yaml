  - number: 3.24.10
    text: |-
      1 Indien een subsidieontvanger naast de niet-economische activiteiten voor de mkb-werkplaats ook economische
      activiteiten verricht, voert de subsidieontvanger met betrekking tot de financiering van en de kosten en inkomsten
      uit economische activiteiten een gescheiden boekhouding.

      2 Indien een subsidieontvanger voor activiteiten binnen de mkb-werkplaats expertbedrijven inzet, worden deze
      uitsluitend ingezet om mee te denken met de student en de onderwijsinstelling, instrumentarium te ontwikkelen
      en online tools beschikbaar te stellen, voor het begeleiden van studenten en om de kwaliteit van de geleverde
      resultaten te bewaken. Aan mkb-ondernemers wordt binnen de mkb-werkplaats niet rechtstreeks geadviseerd door
      expertbedrijven.

      3 De resultaten en tussenresultaten van de mkb-werkplaats worden actief en breed gedeeld op niet-exclusieve en
      niet-discriminerende basis, in ieder geval via een openbaar toegankelijk digitaal platform.

      4 Voorlichtings- en kennisdelingsactiviteiten zijn voor een ieder zonder onderscheid toegankelijk, onder meer via
      een openbaar toegankelijk digitaal platform.

      5 De mkb-werkplaats is een open netwerk, inhoudende in ieder geval dat iedere mkb-ondernemer die geïnteresseerd
      is in digitalisering, zich kan melden bij de mkb-werkplaats voor een intake en dat geïnteresseerde partijen in de
      regio zich, onder transparante en redelijke voorwaarden, bij de mkb-werkplaats kunnen aansluiten.

      6 Opdrachtverlening aan een derde voor uitvoering van de activiteiten, bedoeld in [artikel 3.24.2][ref1], of een
      deel daarvan, vindt plaats op basis van transparante en redelijke criteria en tegen ten hoogste marktconforme
      tarieven.

      7 De subsidieontvanger monitort en evalueert op aantoonbare en systematische wijze de effecten en resultaten van de
      mkb-werkplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.24.2
