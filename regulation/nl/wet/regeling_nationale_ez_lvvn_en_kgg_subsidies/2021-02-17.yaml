  - number: 3.21.10
    text: |-
      Een aanvraag voor subsidie op grond van [artikel 3.21.2.][ref1] bevat:

      a. gegevens over de aanvrager, waaronder het nummer waaronder de onderneming geregistreerd is bij de Kamer van
      Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. gegevens over het project, waaronder de activiteit waarvoor subsidie wordt aangevraagd, de start- en einddatum,
      de totale kosten, de omvang van de gevraagde subsidie en een samenvatting van het project;

      d. antwoorden op vragen ten aanzien van bedrijfsspecifieke informatie, waaronder investeringen in menselijk
      kapitaal, die in het middel, bedoeld in [artikel 19, eerste lid, van het besluit][ref2] zijn opgenomen ten behoeve
      van een nulmeting;

      e. een verklaring de-minimissteun;

      f. ten minste twee concrete voorbeelden van belemmeringen als bedoeld in [artikel 3.21.2][ref3], uit de praktijk
      van bij de aanvraag betrokken MKB-ondernemers die weggenomen worden door het project.


