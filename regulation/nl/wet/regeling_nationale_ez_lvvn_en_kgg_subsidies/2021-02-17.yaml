  - number: 3.13b.8
    text: De minister verdeelt het subsidieplafond voor garantstellingen op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.13b.8
  - number: 3.13b.9
    text: |-
      De minister beslist afwijzend op een aanvraag voor een garantstelling indien:

      a. de financier geen garantstellingsovereenkomst met de Staat heeft gesloten;

      b. er niet wordt voldaan aan de voorwaarden, bedoeld in artikel 3 van het model garantstellingsovereenkomst zoals
      opgenomen in [bijlage 3.13b.1][ref1];

      c. de aanvrager eerder tekort is geschoten bij de naleving van verplichtingen op grond van de
      garantstellingsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.13b.9
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 3.13b.10
    text: |-
      1 Het tarief van de provisie, bedoeld in [artikel 32, derde lid, van het besluit][ref1], wordt voor de garantie
      op de verstrekte lening, berekend door alle door de financier over het gegarandeerde deel van de lening ontvangen
      inkomsten te verminderen met:

      a. een half procent per jaar voor beheerskosten;

      b. fundingkosten, vermeerderd met een liquiditeitsopslag; en

      c. de afsluitprovisie.

      2 De minister kan een hoger tarief voor de provisie vaststellen, indien de provisie te laag is in relatie tot het
      risico dat de Staat loopt.

      3 De provisie, bedoeld in het eerste en tweede lid, bedraagt ten minste:

      a. voor het eerste jaar na verstrekking van de lening:

      1°. voor een MKB-onderneming: 25 basispunten;

      2°. voor een grote onderneming: 50 basispunten;

      b. voor het tweede en derde jaar na verstrekking van de lening:

      1°. voor een MKB-onderneming: 50 basispunten;

      2°. voor een grote onderneming: 100 basispunten;

      c. voor het vierde, vijfde en zesde jaar na verstrekking van de lening:

      1°. voor een MKB-onderneming: 100 basispunten;

      2°. voor een grote onderneming: 200 basispunten.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel32
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.13b.10
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '32'
  - number: 3.13b.11
    text: |-
      Een aanvraag om een garantstellingsovereenkomst op grond van deze titel, bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het nummer waarmee de onderneming is
      geregistreerd bij de Kamer van Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. kerngegevens over de organisatie, waaronder de funding, de deskundigheid, het financieringsbeleid, het
      financieringsproces, het beheer, en het uitwinningsbeleid van krediet.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.13b.11
  - number: 3.13b.12
    text: |-
      De subsidie, bedoeld in [artikel 3.13b.2][ref1] bevat staatssteun en wordt gerechtvaardigd door
      staatssteunmaatregel SA.59925 (2020/N).


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.13b.2
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.13b.12
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.13b.2
        hoofdstuk: '3'
  - number: 3.13b.12a
    text: |-
      Met schriftelijke instemming van een financier zijn de wijzigingen van de artikelen 5, 8, 9, 12, 12a en 13 van
      [bijlage 3.13b.1][ref1] ingevolge de Regeling van de Staatssecretaris van Economische Zaken en Klimaat en de
      Minister van Landbouw, Natuur en Voedselkwaliteit van 9 februari 2021, nr. WJZ/ 20257211, tot wijziging van de
      Regeling nationale EZK- en LNV-subsidies in verband met aanpassing van de garant- en borgstellingsmodules aan
      Verordening (EU) Nr. 575/2013 van het Europees Parlement en de Raad van 26 juni 2013 betreffende prudentiële
      vereisten voor kredietinstellingen en beleggingsondernemingen en tot wijziging van Verordening (EU) nr. 648/2012
      (PbEU 2013, L 176) (Stcrt. 2021, 6766) eveneens van toepassing op:

      a. een garantstellingsovereenkomst als bedoeld in [artikel 3.13b.7][ref2] die voor de inwerkingtreding van de
      regeling, bedoeld in de aanhef, tot stand is gekomen tussen de betreffende financier en de Staat; en

      b. de leningen die voor het tijdstip van inwerkingtreding van de regeling, bedoeld in de aanhef, onder de
      garantstellingsovereenkomst, bedoeld in onderdeel a, zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.13b.7
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.13b.12a
