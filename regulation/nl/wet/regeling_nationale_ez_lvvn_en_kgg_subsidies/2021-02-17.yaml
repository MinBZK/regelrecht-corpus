        artikel: 2.4.30
        hoofdstuk: '2'
        paragraaf: 2.4.6
  - number: 2.4.30
    text: |-
      1 De minister kent aan een project een hoger aantal punten toe naarmate:

      a. de impact van het project groter is;

      b. de kwaliteit van de combinatie van het samenwerkingsverband en de aanvrager hoger is;

      c. de kwaliteit van het projectplan hoger is;

      d. de kosteneffectiviteit van het project hoger is.

      2 Het aantal punten bedraagt per onderdeel van het eerste lid ten hoogste vijf punten.

      3 Voor de rangschikking wordt het aantal punten gegeven voor het eerste lid, onderdelen a en b, vermenigvuldigd
      met twee.

      4 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.4.30
  - number: 2.4.31
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 2.4.24][ref1] bevat ten minste:

      a. gegevens over de aanvrager, waaronder contactgegevens en het nummer waaronder zijn onderneming geregistreerd is
      bij de Kamer van Koophandel;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. het projectplan, waarin onder meer is opgenomen de activiteiten waarvoor subsidie wordt aangevraagd, de
      doelstellingen van het project, de start- en einddatum, de samenstelling van het samenwerkingsverband, de totale
      kosten, de omvang van de gevraagde subsidie en een samenvatting van het project;

      d. een verklaring van het samenwerkingsverband waarin het samenwerkingsverband aangeeft behoefte te hebben aan
      kennisoverdracht.

      2 [Artikel 50, tweede lid, onderdeel c, van het besluit][ref2] is niet van toepassing op de aanvraag voor
      vaststelling van een subsidie als bedoeld in [artikel 2.4.24][ref3].


