        paragraaf: 4.2.2
  - number: 4.2.15
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *CO:* CO of CO-equivalent;
        - *CO-equivalent:* de hoeveelheid CH, NO, HFK’s, PFK’s en SF6, die overeenkomstig de factoren in
      [bijlage 4.2.2, onderdeel A][ref1], eenzelfde broeikaseffect oplevert als een massa-eenheid CO;
        - *HER+-project:* project bestaande uit industrieel onderzoek of experimentele ontwikkeling of
      zijnde een energiedemonstratieproject of een combinatie van deze vormen, dat past binnen de in
      [bijlage 4.2.2 (Hernieuwbare energietransitie (HER+)), onderdeel B][ref2], opgenomen beschrijving.


