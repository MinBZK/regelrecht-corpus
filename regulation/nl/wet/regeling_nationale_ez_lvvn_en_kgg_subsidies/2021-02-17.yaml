  - number: 3.7.10
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 3.7.2][ref1] bevat ten minste de gegevens, bedoeld in artikel
      6, tweede lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie als bedoeld in [artikel 3.7.2][ref2] ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, de grootte van de onderneming, het
      nummer waarmee de onderneming is geregistreerd bij de Kamer van Koophandel, het post- en bezoekadres en het
      rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. de gegevens over het project, waaronder de activiteiten waarvoor subsidie wordt aangevraagd, de locatie van het
      project, de start- en einddatum, een overzicht van de totale kosten van het project en de omvang van de gevraagde
      subsidie.

      3 De aanvraag voor de vaststelling van een subsidie als bedoeld in [artikel 3.7.2][ref3] bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de aanvrager en het door de minister verstrekte
      referentienummer;

      b. de omvang van de vast te stellen subsidie.


