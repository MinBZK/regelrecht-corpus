  - number: '1.9'
    text: |-
      1 Indien een geheel of gedeeltelijk van overheidswege gefinancierde onderzoeksorganisatie deelneemt aan een
      project dat wordt uitgevoerd in daadwerkelijke samenwerking, sluiten de deelnemers voorafgaand aan het project
      een overeenkomst over de wijze waarop wordt omgegaan met de bijdrage in de kosten, het delen in de risico’s en
      uitkomsten, de verspreiding van de resultaten en de toegang tot en de regels voor de toewijzing van intellectuele
      eigendomsrechten.

      2 Indien een project als bedoeld in het eerste lid gezamenlijk door ondernemingen en van overheidswege
      gefinancierde onderzoeksorganisaties of onderzoeksinfrastructuren wordt uitgevoerd, legt de penvoerder de afspraken
      voor aan de minister, tenzij:

      a. de deelnemende ondernemingen de volledige kosten van het project dragen;

      b. de resultaten van de samenwerking die geen intellectuele eigendomsrechten opleveren, breed kunnen
      worden verspreid en alle intellectuele eigendomsrechten die de activiteiten van de onderzoeksorganisatie of
      onderzoeksinfrastructuur opleveren, volledig worden toegekend aan die entiteiten;

      c. uit het project ontstane intellectuele eigendomsrechten, alsmede daarmee verband houdende toegangsrechten aan
      de verschillende deelnemers worden toegekend op een wijze die een passende afspiegeling is van hun werkpakketten,
      bijdragen en respectieve belangen, of

      d. de van overheidswege gefinancierde onderzoeksorganisaties of onderzoeksinfrastructuren een vergoeding ontvangen
      die gelijkwaardig is aan de marktprijs voor de intellectuele eigendomsrechten die uit hun activiteiten ontstaan en
      worden toegewezen aan de deelnemende ondernemingen of waartoe de deelnemende ondernemingen toegangsrechten kregen
      toegewezen.

      3 Op de vergoeding, bedoeld in het tweede lid, onderdeel d, kan het absolute bedrag van financiële en niet-
      financiële bijdragen van de deelnemende ondernemingen in de kosten van de activiteiten van de van overheidswege
      gefinancierde onderzoeksorganisatie of onderzoeksinfrastructuur die de betrokken intellectuele-eigendomsrechten
      hebben opgeleverd, in mindering worden gebracht.

      4 Indien uit de aan de minister op basis van het tweede lid voorgelegde afspraken blijkt dat sprake is van
      staatssteun als gevolg van de overdracht van kennis of andere resultaten uit activiteiten, wordt slechts een
      zodanig bedrag aan subsidie verstrekt dat het totale bedrag aan subsidie niet meer bedraagt dan het in de
      beschikking tot subsidieverlening aangegeven bedrag dat ten hoogste mag worden verstrekt ingevolge een Europees
      steunkader.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel1.9
  - number: '1.10'
    text: |-
      1 De minister kan op grond van deze regeling uitsluitend subsidie verstrekken indien hij de mogelijkheid tot het
      doen van een aanvraag tot subsidieverlening heeft opengesteld door vaststelling van een subsidieplafond en een
      periode voor indiening van de aanvraag.

      2 De minister kan de openstelling beperken tot bepaalde activiteiten, categorieën van aanvragers of een bepaald
      aantal aanvragen.

      3 De minister kan verschillende subsidieplafonds vaststellen voor verschillende activiteiten of categorieën van
      aanvragers.
