  - number: 2.3.9
    text: |-
      Deze titel vervalt met ingang van 1 juli 2022, met dien verstande dat deze van toepassing blijft op subsidies die
      voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.3.9
  - number: 2.4.1
    text: |-
      In deze titel wordt verstaan onder:

        - *bedrijfsadviseringssysteem:* het bedrijfsadviseringssysteem, bedoeld in artikel 12, eerste lid, van Verordening
      (EU) nr. 1306/2013 van het Europees parlement en de Raad van 17 december 2013 inzake de financiering, het beheer
      en de monitoring van het gemeenschappelijk landbouwbeleid en tot intrekking van [Verordeningen (EG) nr. 814/2000]
      (32000R0814), [(EG) nr. 1290/2005](32005R1290) en [(EG) nr. 485/2008](32008R0485) van de Raad (PbEU 2013, L 347);
        - *bedrijfsadviseur:* een adviseur die landbouwondernemingen adviseert;
        - *erkende bedrijfsadviseur:* bedrijfsadviseur die: a. overeenkomstig
      [artikel 3.4, tweede lid, van de Uitvoeringsregeling rechtstreekse betalingen GLB][ref1] is erkend
      in het kader van het bedrijfsadviseringssysteem; en b. naar het oordeel van een op grond van
      [artikel 3.4, eerste lid, van de Uitvoeringsregeling rechtstreekse betalingen GLB][ref2] aangewezen
      beroepsorganisatie: 1°. beschikt over actuele kennis over ten minste één van de onderwerpen, genoemd in
      [artikel 2.4.3, eerste lid, onderdeel a][ref3]; 2° niet werkzaam is bij een onderneming die landbouwproducten,
      gewasbeschermingsmiddelen, diervoeders, landbouwmechanisatieproducten of meststoffen verkoopt of een
      onderneming die in een groep verbonden is aan een onderneming die deze producten verkoopt; 3°. in staat is
      landbouwondernemingen op strategisch en tactisch niveau te adviseren;
        - *diervoeders:* diervoeders als bedoeld in artikel 3, vierde lid, van [Verordening (EG) nr. 178/2002](32002R0178)
      van het Europees Parlement en de Raad van 28 januari 2002 (PbEG 2002, L 31);
        - *dierlijke meststoffen:* dierlijke meststoffen als bedoeld in
      [artikel 1, eerste lid, onderdeel c, van de Meststoffenwet][ref4];
        - *gewasbeschermingsmiddel:* gewasbeschermingsmiddel als bedoeld in artikel 2, eerste lid, van [Verordening (EG)
      Nr. 1107/2009](32009R1107) van het Europees Parlement en de Raad van 21 oktober 2009 betreffende het op de markt
      brengen van gewasbeschermingsmiddelen en tot intrekking van de [Richtlijnen 79/117/EEG](31979L0117) en [91/414/EEG]
      (31991L0414) van de Raad (PbEU 2009, L 309);
        - *kennisinstelling:* de volgende in de [bijlage van de Wet op het hoger onderwijs en wetenschappelijk onderzoek]
      (onbekend) genoemde instellingen voor hoger onderwijs: – De openbare universiteit te Wageningen; – Aeres
      Hogeschool, uitgaande van de Stichting Aeres Groep; – HAS Hogeschool, uitgaande van de Stichting HAS Opleidingen te
      ‘s- Hertogenbosch; – Van Hall Larenstein, uitgaande van de Stichting Van Hall Larenstein; – Hogeschool INHOLLAND,
      uitgaande van de Stichting Hoger Onderwijs Nederland;
        - *meststoffen:* meststoffen als bedoeld in [artikel 1, eerste lid, onderdeel d, van de Meststoffenwet][ref5];
        - *Opleiding bedrijfscoach stikstof in de landbouw:* de Opleiding bedrijfscoach stikstof in de landbouw, ontwikkeld
      in 2020 door de openbare universiteit te Wageningen, HAS Hogeschool, Aeres Hogeschool, Van Hall Larenstein en
      Hogeschool INHOLLAND;
        - *Verdiepingscursus stikstof in de landbouw:* de Verdiepingscursus stikstof in de landbouw, ontwikkeld in 2020
      door de openbare universiteit te Wageningen, HAS Hogeschool, Aeres Hogeschool, Van Hall Larenstein en Hogeschool
      INHOLLAND.


      [ref1]: https://wetten.overheid.nl/BWBR0035925#Artikel3.4
      [ref2]: https://wetten.overheid.nl/BWBR0035925#Artikel3.4
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.3
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0004054#Artikel1
