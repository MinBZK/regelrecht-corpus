      - id: ref2
        bwb_id: BWBR0005181
        artikel: '70'
  - number: 3.13b.4
    text: |-
      1 Er wordt garant gestaan voor 90 procent van het nog niet afgeloste deel van de lening indien deze is verstrekt
      aan een MKB-ondernemer en 80 procent van het nog niet afgeloste deel van de lening indien deze is verstrekt aan een
      grote onderneming.

      2 Indien de financier bij het verkrijgen van een lening een gedeelte daarvan niet onder de garantstelling van de
      Staat brengt, zijn de bepalingen van deze titel slechts van toepassing op het gedeelte van de verkregen lening dat
      onder de garantstelling is gebracht.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.13b.4
  - number: 3.13b.5
    text: |-
      1 De garantstelling heeft uitsluitend betrekking op een lening waarbij de aan de ondernemer verstrekte lening niet
      minder bedraagt dan € 1.500.000.

      2 De garantstelling heeft uitsluitend betrekking op een lening waarbij de aan de ondernemer of, indien de
      ondernemer deel uitmaakt van een groep, aan de groep verstrekte lening tezamen met

      a. het nog niet afgeloste deel van een of meer leningen of

      b. een of meer bankgarantiefaciliteiten als bedoeld in [artikel 3.14.2][ref1]

      die door een financier met toepassing van deze titel en de [titels 3.13][ref2], [3.13a][ref3] en [3.14.][ref4] aan
      de ondernemer onderscheidenlijk de groep is of zijn verstrekt of gelijktijdig wordt of worden verstrekt niet meer
      bedraagt dan € 150.000.000.

      3 De garantstelling heeft uitsluitend betrekking op een lening waarbij de aan de ondernemer of, indien
      de ondernemer deel uitmaakt van een groep, aan de groep verstrekte lening tezamen met andere leningen
      die door een financier met toepassing van deze titel aan de ondernemer onderscheidenlijk de groep is of
      zijn verstrekt of gelijktijdig wordt of worden verstrekt niet meer bedraagt dan het maximum bedoeld in
      [artikel 3.13b.1, eerste lid, onderdeel e][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.14.2
