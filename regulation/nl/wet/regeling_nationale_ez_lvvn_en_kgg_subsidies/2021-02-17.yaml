    text: |-
      1 De subsidieontvanger voert het Eurostarsproject in Nederland uit, behoudens voorafgaande schriftelijke ontheffing
      van de minister voor gedeeltelijke uitvoering buiten Nederland.

      2 Aan een ontheffing als bedoeld in het eerste lid kunnen voorschriften worden verbonden.
