  - number: 2.11.1
    text: |-
      In deze titel wordt verstaan onder:

        - *visserijactiviteit:* het zoeken naar vis, het te water laten, uitzetten, slepen en ophalen van vistuig, het
      aan boord halen van de vangst, het overladen, het aan boord houden, het verwerken aan boord, het overbrengen, het
      kooien, vetmesten en aanlanden van vis en visserijproducten;
        - *visserijonderneming:* onderneming die zich bezighoudt met visserijactiviteiten.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel2.11.1
  - number: 2.11.2
    text: |-
      1 [Artikel 3.5.17, eerste lid][ref1], is van overeenkomstige toepassing op IPC-projecten die gericht zijn op:

      a. vangstmethoden of vistuigen om selectiever te vissen;

      b. vangstmethoden of vistuigen die minder bodemberoering tot gevolg hebben dan de huidige in de visserij gebruikte
      methoden of tuigen;

      c. vermindering van de negatieve invloed op klimaat of milieu door visserijactiviteiten; of

      d. andere vangstmethoden of kweekmethoden, die bijdragen aan een duurzame visserij.

      2 Een IPC-verband ten behoeve van een duurzame visserij bestaat, naast de IPC-penvoerder, uit ten minste twee en
      ten hoogste twintig niet met een andere IPC-deelnemer of de IPC-penvoerder in een groep verbonden MKB-ondernemers,
      van wie ten minste de helft een visserijonderneming in stand houdt.

      3 De [artikelen 3.1.1][ref2], [3.5.1][ref3], [3.5.2][ref4], [3.5.17, eerste lid][ref5],
      [3.5.19][ref6], [3.5.20][ref7], [3.5.21][ref8], [3.5.22, aanhef en onderdelen a, b, d en e][ref9],
      [3.5.25, eerste en tweede lid][ref10], en [3.5.26][ref11] zijn van overeenkomstige toepassing op deze titel.


