  - number: 3.22.4
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2021-02-17#Artikel3.22.4
  - number: 3.22.5
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien:

      a. het thema waarop het thematisch technology transferplan gericht is, onvoldoende aantoonbaar sterk potentieel
      heeft, vanuit een excellente wetenschappelijke basis, voor innovaties van processen, producten of diensten met een
      hoge economisch en maatschappelijk toegevoegde waarde;

      b. het thematisch technology transferplan onvoldoende is onderbouwd;

      c. onvoldoende vertrouwen bestaat dat het thematisch technology transferplan naar behoren wordt uitgevoerd;

      d. uit de aanvraag niet of onvoldoende blijkt hoe de subsidieaanvragers zullen voldoen aan de toepasselijke
      subsidieverplichtingen, bedoeld in de [artikelen 3.22.8][ref1] en [3.22.9][ref2];

      e. onvoldoende aannemelijk is dat het thematisch technology transferfonds gedurende de fondsperiode daadwerkelijk
      beschikt over de middelen die de fondspartij of fondspartijen aan het investeringsbudget bijdraagt of bijdragen;

      f. onvoldoende vertrouwen bestaat dat de betrokkenen bij het thematisch technology transferfonds de
      capaciteiten hebben voor het verkrijgen van participaties en voor het beheer hiervan op een wijze zoals bij
      participatiemaatschappijen gebruikelijk is;

      g. de belangen van de Staat kunnen worden geschaad bij de uitvoering van het fondsplan.

      2 De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref3], voor het uitvoeren van de activiteiten,
      bedoeld in [artikel 3.22.2, derde lid][ref4], is zes jaar.

      3 Onverminderd het eerste en tweede lid beslist de minister afwijzend op het deel van een aanvraag dat ziet op
      subsidie voor activiteiten als bedoeld in [artikel 3.22.2, vierde lid, onderdeel b][ref5], indien de subsidie voor
      deze activiteiten niet op grond van de algemene de-minimisverordening verstrekt kan worden.


