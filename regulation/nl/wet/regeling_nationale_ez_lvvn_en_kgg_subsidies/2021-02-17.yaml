  - number: 3.2.8
    text: |-
      1 Een aanvraag voor PPS-programmatoeslag als bedoeld in [artikel 3.2.2][ref1] bevat ten minste de gegevens, bedoeld
      in artikel 6, tweede lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor PPS-programmatoeslag als bedoeld in [artikel 3.2.2][ref2]
      ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het nummer waarmee de onderneming is
      geregistreerd bij de Kamer van Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. gegevens over de grondslag, waaronder de topsector of topsectoren waarop de aanvraag ziet, het kalenderjaar
      waarin de private bijdrage en inzet in natura verschuldigd zijn geworden, de omvang van de private bijdrage
      en de inzet in natura voor samenwerkingsprojecten, de omvang van de private bijdrage voor TKI-relevante
      onderzoeksopdrachten, alsmede de hoeveelheid PPS-programmatoeslag die wordt aangevraagd;

      d. een overzicht van de gerealiseerde private bijdragen in het kalenderjaar, voorafgaand aan het kalenderjaar
      waarop de aanvraag betrekking heeft en, voor zover sprake is van inzet in natura, een aanduiding van de waarde
      daarvan in euro’s;

      e. een overzicht van de subsidiabele kosten van de activiteiten waarvoor de PPS-programmatoeslag wordt aangewend
      per mijlpaal of per kalenderjaar, waarbij wordt aangegeven of de betreffende kosten betrekking hebben op
      fundamenteel of industrieel onderzoek, experimentele ontwikkeling of op innovatieactiviteiten.

      3 De gegevens, bedoeld in het tweede lid, onderdeel c, omvatten voor iedere private bijdrage en inzet in natura op
      basis waarvan de hoogte van de PPS-programmatoeslag wordt bepaald, ten minste:

      a. de naam van het samenwerkingsproject zoals vermeld in de samenwerkingsovereenkomst, of de naam van de TKI-
      relevante onderzoeksopdracht;

      b. de naam van de deelnemer van wie de private bijdrage of inzet in natura afkomstig is;

      c. de naam van de onderzoeksinstelling waaraan de private bijdrage of inzet in natura verschuldigd is of is
      geworden;

      d. het nummer waarmee de deelnemer onderscheidenlijk de onderzoekinstelling is geregistreerd bij de Kamer van
      Koophandel of, voor zover zij hier niet over beschikken, een ander uniek identificerend nummer;

      e. de hoogte van de private bijdrage en inzet in natura in euro’s.

      4 De aanvraag voor de vaststelling van PPS-programmatoeslag bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de aanvrager en het door de minister verstrekte
      referentienummer;

      b. gegevens over:

      1°. de totale subsidiabele kosten die zijn gemoeid met de uitvoering van het samenwerkingsproject, de
      netwerkactiviteit of de innovatieadviesdienst waarvoor de PPS-programmatoeslag is aangewend, waarbij wordt
      aangegeven of het gaat om kosten gemoeid met een samenwerkingsproject, netwerkactiviteit of innovatieadviesdienst;

      2°. de omvang van de aanwending van de PPS-programmatoeslag per begunstigde deelnemer die voor vaststelling in
      aanmerking komt.

      5 Indien de op of na 1 februari 2017 aan een TKI verleende PPS-programmatoeslag of de vóór 1 februari 2017
      verleende TKI-programmatoeslag € 125.000 of meer bedraagt, kan de aanvraag tot vaststelling van deze toeslag
      voor het deel van de toeslag dat is aangewend voor de uitvoering van samenwerkingsprojecten, in afwijking van
      [artikel 50, tweede lid, onderdeel c, van het besluit][ref3], vergezeld gaan van een rapport van feitelijke
      bevindingen als bedoeld in artikel 50, zesde lid, van het besluit, dat met inachtneming van de voorschriften,
      gesteld in [bijlage 3.2.1][ref4], is opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0035474
