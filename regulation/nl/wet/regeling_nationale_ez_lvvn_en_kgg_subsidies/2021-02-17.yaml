  - number: 4.6.8
    text: |-
      1 Bij de toepassing van [artikel 6, eerste lid, van het besluit][ref1] worden bij het verlenen van subsidie op
      basis van deze titel buiten beschouwing gelaten:

      a. subsidies op grond van het [Besluit stimulering duurzame energieproductie][ref2];

      b. bijdragen van de Europese Commissie op grond van Verordening (EU) nr. 1291/2013 van het Europees Parlement en de
      Raad van 11 december 2013 tot vaststelling van Horizon 2020 - het kaderprogramma voor onderzoek en innovatie (2014–
      2020) en tot intrekking van Besluit nr. 1982/2006/EG (PbEU 2013, L 347).

      2 Bijdragen van gemeenten, provincies, waterschappen en openbare lichamen als bedoeld in
      [artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen][ref3], worden aangemerkt als publieke
      cofinanciering, en blijven bij de toepassing van [artikel 6, eerste lid, van het besluit][ref4] buiten beschouwing
      voor zover het de berekening betreft van het maximumbedrag dat krachtens deze titel per project kan worden
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0022735
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0024796#Artikel6
