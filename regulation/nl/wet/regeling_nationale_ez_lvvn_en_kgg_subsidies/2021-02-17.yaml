  - number: 3.16.1
    text: |-
      In deze titel wordt verstaan onder:

        - *academische innovatieve starter:* innovatieve starter van wie de economische activiteiten
      rechtstreeks en onmiddellijk voortkomen uit onderzoek van een universiteit als bedoeld in
      [artikel 1.3 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], een academisch ziekenhuis
      als bedoeld in onderdeel j van de [Bijlage behorende bij de Wet op het hoger onderwijs en wetenschappelijk
      onderzoek](onbekend), een onderzoeksorganisatie als bedoeld in [artikel 4.1 van het Reglement NWO 2002][ref2], een
      onderzoeksinstituut van de Koninklijke Nederlandse Akademie van Wetenschappen, het Nederlands Kanker Instituut,
      het Max Planck Instituut voor Psycholinguïstiek te Nijmegen, onderzoekers van de Dubble-bundellijn bij de European
      Synchrotron Radiation Facility te Grenoble, Frankrijk, het Naturalis Biodiversity Center, of het Advanced Research
      Centre for NanoLithography, hetgeen blijkt uit een overeenkomst gesloten tussen de innovatieve starter en de
      desbetreffende universiteit, het desbetreffende academisch ziekenhuis, de desbetreffende onderzoeksorganisatie of
      het desbetreffende onderzoeksinstituut;
        - *financier:* een (onderdeel met een afgescheiden boekhouding van een) kapitaalvennootschap, een vennootschap
      met een afgescheiden vermogen of een rechtspersoon met een afgescheiden vermogen niet zijnde een vennootschap,
      ingericht naar het recht van één van de lidstaten van de Europese Unie, die, blijkens de akte waarbij zijn statuten
      zijn vastgesteld of blijkens de overeenkomst waarbij hij is ingesteld, tot doel heeft het op provinciaal niveau
      verstrekken van geldleningen aan MKB-ondernemers of innovatieve starters ten behoeve van de financiering van
      vernieuwingsfase- of vroegefasetrajecten;
        - *financieringsbudget:* geldelijke middelen die een financier beschikbaar heeft of zal hebben en die bestemd zijn
      voor het verstrekken van geldleningen aan MKB-ondernemers of innovatieve starters ten behoeve van de financiering
      van vernieuwingsfase- of vroegefasetrajecten en voor verrekening van de kosten, bedoeld in [artikel 3.16.1h][ref3],
      bestaande uit de provinciale bijdrage en het bedrag van de geldlening, bedoeld in [artikel 3.16.1c][ref4];
        - *financieringsplan:* een plan van een financier tot uitvoering van een met elkaar samenhangend geheel van
      activiteiten in verband met de verstrekking van geldleningen aan MKB-ondernemers of innovatieve starters ten
      behoeve van de financiering van vernieuwingsfase- of vroegefasetrajecten;
        - *haalbaarheidsstudie TO2-innovatieve starter:* samenstel van activiteiten dat leidt tot een schriftelijk
      rapport met een inschatting van de commerciële en technische mogelijkheden van de door een TO2-starter voorgenomen
      activiteiten en de kansen voor de haalbaarheid van een vroegefasetraject;
        - *hbo-innovatieve starter:* innovatieve starter van wie de economische activiteiten
      rechtstreeks en onmiddellijk voortkomen uit onderzoek van een hogeschool als bedoeld in
      [artikel 1.3 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5], hetgeen blijkt uit een
      overeenkomst gesloten tussen de innovatieve starter en de desbetreffende hogeschool;
        - *innovatieve starter:* innovatieve onderneming als bedoeld in artikel 2, onderdeel 80, van de algemene
      groepsvrijstellingsverordening, die tevens starter is, als bedoeld in artikel 22, tweede lid, van die verordening;
        - *kosten:* door een financier in verband met de verstrekking van geldleningen aan MKB-ondernemers of innovatieve
      starters ten behoeve van de financiering van vernieuwingsfase- of vroegefasetrajecten te maken kosten, waaronder
      doch niet beperkt tot kosten voor door een financier in te zetten medewerkers en kosten voor door een financier in
      te schakelen externe deskundigen, welke kosten marktconform dienen te zijn;
        - *rekening:* rekening ten name van een financier welke uitsluitend wordt gebruikt voor alle betalingsverkeer
      dat op welke wijze dan ook verband houdt met het verstrekken van geldleningen aan MKB-ondernemers of innovatieve
      starters ten behoeve van de financiering van vernieuwingsfase- of vroegefasetrajecten;
        - *TO2-innovatieve starter:* innovatieve starter van wie de economische activiteiten rechtstreeks en onmiddellijk
      voortkomen uit onderzoek van de Nederlandse Organisatie voor toegepast-natuurwetenschappelijk onderzoek TNO, de
      Stichting Deltares, de Stichting Wageningen Research, de Stichting Energieonderzoek Centrum Nederland, de Stichting
      Maritiem Research Instituut Nederland of de Stichting Nationaal Lucht- en Ruimtevaartlaboratorium, hetgeen blijkt
      uit een overeenkomst gesloten tussen de innovatieve starter en de desbetreffende onderzoeksinstelling;
        - *toekomstige investeerder:* persoon die in het kader van een vernieuwingsfasetraject of een vroegefasetraject
      van plan is na uitvoering van het vernieuwingsfaseplan of het vroegefaseplan aan de aanvrager van de subsidie
      financiering te verstrekken voor een bedrag dat ten minste gelijk is aan het bedrag van de maximale hoofdsom,
      bedoeld in de [artikelen 3.16.3][ref6], [3.16.8][ref7] en [3.16.13][ref8], voor de fase na de vernieuwingsfase of
      de vroegefase;
        - *vernieuwingsfaseplan:* document waarin wordt uiteengezet op welke wijze en op welke termijn de MKB-ondernemer
      door experimentele ontwikkeling komt tot de ontwikkeling of de verdere ontwikkeling van een product, proces
      of dienst op basis waarvan de toekomstige investeerder definitief kan besluiten tot financiering van het
      vervolgtraject;
        - *vernieuwingsfasetraject:* samenhangend geheel van activiteiten beschreven in het vernieuwingsfaseplan;
        - *vroegefaseplan:* document waarin: a. de aanvrager van de subsidie uiteenzet op welke wijze en op welke
      termijn een uitvinding, een resultaat van een onderzoek, een idee of een concept zo kan worden ontwikkeld dat de
      toekomstige investeerder in staat is te besluiten tot de voorgenomen financiering, of; b. indien het gaat om een
      uiteenzetting van een academische innovatieve starter, hbo-innovatieve starter of TO2-innovatieve starter, de
      vragen van toekomstige financiers omtrent de ontwikkeling worden beantwoord zodat de toekomstige financiers over
      financiering kunnen besluiten;
        - *vroegefasetraject:* samenhangend geheel van activiteiten beschreven in het vroegefaseplan.


