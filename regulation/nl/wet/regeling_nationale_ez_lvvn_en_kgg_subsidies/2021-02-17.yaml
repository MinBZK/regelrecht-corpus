  - number: B3.13b.1:6
    text: |-
      1 De financier is een door de Minister vastgestelde provisie verschuldigd voor de garantie op leningen die
      overeenkomstig de procedure van artikel 4 onder de garantstelling zijn gebracht. Het tarief van de provisie voor
      de garantie op de verstrekte lening wordt berekend door alle door de financier over het gegarandeerde deel van de
      lening ontvangen inkomsten te verminderen met:

      a. een half procent per jaar voor beheerskosten,

      b. fundingkosten, vermeerderd met een liquiditeitsopslag, en

      c. de afsluitprovisie.

      2 De provisie, bedoeld in het eerste lid en artikel 4, tweede lid, bedraagt ten minste:

      a. voor het eerste jaar na verstrekking van de lening:

      1°. voor een MKB-onderneming: 25 basispunten;

      2°. voor een grote onderneming: 50 basispunten;

      b. voor het tweede en derde jaar na verstrekking van de lening:

      1°. voor een MKB-onderneming: 50 basispunten;

      2°. voor een grote onderneming: 100 basispunten;

      c. voor het vierde, vijfde en zesde jaar na verstrekking van de lening:

      1°. voor een MKB-onderneming: 100 basispunten;

      2°. voor een grote onderneming: 200 basispunten.

      3 Per kwartaal wordt een vierde deel van de periodieke provisie, bedoeld in het eerste lid, bij de financier in
      rekening gebracht, uitgaand van de waarde van de leningen op de eerste dag van het kwartaal.

      4 Indien een lening waarvoor een garantie is verstrekt, geheel vervroegd wordt afgelost, wordt de te betalen reeds
      verschuldigde provisie betaald bij de beëindiging van de garantstelling.

      5 De in het eerste lid bedoelde provisie is verschuldigd voor de duur van de garantie of zoveel korter als zich één
      van de in artikel 8, eerste lid, genoemde omstandigheden voordoet.

      6 Indien de lening wordt afgestoten om verlies op die lening in de zin van artikel 8, eerste lid, te beperken, kan
      de minister op verzoek van de financier de over de resterende termijn verschuldigde provisie geheel of gedeeltelijk
      kwijtschelden indien sprake is van klemmende redenen, gelegen in het belang van de onderneming van de ondernemer.
