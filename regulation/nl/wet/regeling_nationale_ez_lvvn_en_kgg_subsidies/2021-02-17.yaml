  - number: 3.13b.7
    text: |-
      In [bijlage 3.13b.1][ref1] is een model opgenomen voor een garantstellingsovereenkomst ten aanzien van leningen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
