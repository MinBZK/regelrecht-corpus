    text: |-
      De activiteiten, bedoeld in [artikel 3.5.3, eerste lid][ref1], vinden plaats binnen veertien maanden na de
      subsidieaanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.5.3
