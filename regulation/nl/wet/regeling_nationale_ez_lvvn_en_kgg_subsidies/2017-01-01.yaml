  - number: '1.9'
    text: |-
      1 Indien een geheel of gedeeltelijk van overheidswege gefinancierde onderzoeksorganisatie deelneemt aan een
      project dat wordt uitgevoerd in daadwerkelijke samenwerking, sluiten de deelnemers voorafgaand aan het project
      een overeenkomst over de wijze waarop wordt omgegaan met de bijdrage in de kosten, het delen in de risico’s en
      uitkomsten, de verspreiding van de resultaten en de toegang tot en de regels voor de toewijzing van intellectuele
      eigendomsrechten.

      2 Indien een project als bedoeld in het eerste lid gezamenlijk door ondernemingen en van overheidswege
      gefinancierde onderzoeksorganisaties of onderzoeksinfrastructuren wordt uitgevoerd, legt de penvoerder de afspraken
      voor aan de minister, tenzij:

      a. de deelnemende ondernemingen de volledige kosten van het project dragen;

      b. de resultaten van de samenwerking die geen intellectuele eigendomsrechten opleveren, breed kunnen
      worden verspreid en alle intellectuele eigendomsrechten die de activiteiten van de onderzoeksorganisatie of
      onderzoeksinfrastructuur opleveren, volledig worden toegekend aan die entiteiten;

      c. uit het project ontstane intellectuele eigendomsrechten, alsmede daarmee verband houdende toegangsrechten aan
      de verschillende deelnemers worden toegekend op een wijze die een passende afspiegeling is van hun werkpakketten,
      bijdragen en respectieve belangen, of

      d. de van overheidswege gefinancierde onderzoeksorganisaties of onderzoeksinfrastructuren een vergoeding ontvangen
      die gelijkwaardig is aan de marktprijs voor de intellectuele eigendomsrechten die uit hun activiteiten ontstaan en
      worden toegewezen aan de deelnemende ondernemingen of waartoe de deelnemende ondernemingen toegangsrechten kregen
      toegewezen.

      3 Op de vergoeding, bedoeld in het tweede lid, onderdeel d, kan het absolute bedrag van financiële en niet-
      financiële bijdragen van de deelnemende ondernemingen in de kosten van de activiteiten van de van overheidswege
      gefinancierde onderzoeksorganisatie of onderzoeksinfrastructuur die de betrokken intellectuele-eigendomsrechten
      hebben opgeleverd, in mindering worden gebracht.

      4 Indien uit de aan de minister op basis van het tweede lid voorgelegde afspraken blijkt dat sprake is van
      staatssteunals gevolg van de overdracht van kennis of andere resultaten uit activiteiten, wordt slechts een zodanig
      bedrag aan subsidie verstrekt dat het totale bedrag aan subsidie niet meer bedraagt dan het in de beschikking tot
      subsidieverlening aangegeven bedrag dat maximaal mag worden verstrekt ingevolge een Europees steunkader.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel1.9
  - number: 2.1.2
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

        - *glasopstand:* kas en toebehorende installaties;
        - *glastuinbouwonderneming:* landbouwonderneming met glasopstanden;
        - *vervangingsinvestering:* investering voor het eenvoudige vervangen van een bestaand gebouw of een bestaande
      machine, of delen daarvan, door een nieuw modern gebouw of een nieuwe moderne machine, zonder dat daarbij de
      productiecapaciteit met meer dan 25% wordt verhoogd of de betrokken productie of technologie fundamenteel wordt
      gewijzigd.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.1.2
  - number: 2.2.1
    text: |-
      In deze titel wordt verstaan onder:

        - *dierlijke productieketen:* keten van veehouderijbedrijven, ondernemingen die dieren en dierlijke
      producten verwerken en verhandelen, en ondernemingen die productiegerelateerde producten, zoals grondstoffen,
      uitgangsmateriaal, installaties en houderijsystemen leveren aan veehouderijbedrijven, met uitzondering van
      adviseurs en adviesbureaus;
        - *udv-ambities:* doelstellingen, geformuleerd in de Uitvoeringsagenda duurzame veehouderij, die zijn opgenomen in
      de [bijlage 2.2.1][ref1] bij deze regeling;
        - *udv-project:* samenhangend geheel van activiteiten, gericht op: a. het uitvoeren van een verbeterplan; b. de
      ontwikkeling van een nieuwe bedrijfsvoering, een nieuw bedrijfsproces, een nieuw product of een prototype, met het
      oog op het wegnemen van drempels die de ontwikkeling of toepassing belemmeren van een nieuw product of proces dat
      bijdraagt aan de verbetering van de duurzaamheid binnen een of meer udv-ambities;
        - *udv-verbeterplan:* document waarin een beschrijving is opgenomen van samenhangende activiteiten, gericht op het
      oplossen van een of meer problemen die verduurzaming in ten minste één van de udv-ambities in de weg staan;


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 2.2.2
    text: |-
      De minister kan een subsidie verstrekken:

      a. voor een project tot opstelling van een udv-verbeterplan waaraan ten minste twee ondernemingen in de dierlijke
      productieketen actief bijdragen, aan een onderneming of een organisatie die in het handelsregister is opgenomen,
      dan wel aan een samenwerkingsverband van ondernemingen of organisaties die in het handelsregister zijn opgenomen;

      b. voor een udv-project, aan een samenwerkingsverband waarin ten minste twee ondernemingen die tot de dierlijke
      productieketen behoren, en ten minste een onderneming of organisatie die niet tot de dierlijke productieketen
      behoort, samenwerken.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.2.2
  - number: 2.2.3
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 2.2.2][ref1] bevat ten minste de gegevens, bedoeld
      in artikel 6, tweede lid, van de algemene groepsvrijstellingsverordening en artikel 6, tweede lid, van de
      groepsvrijstellingsverordening landbouw.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie ten minste:

      a. gegevens over de aanvrager, waaronder het nummer waaronder de onderneming geregistreerd is bij de Kamer van
      Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. indien van toepassing de topsector waarbinnen het project wordt uitgevoerd;

      d. een begroting waarin de totale kosten van het project en de omvang van de gevraagde subsidie zijn opgenomen.

      3 De aanvrager motiveert bij de aanvraag van subsidie:

      a. voor een project als bedoeld in [artikel 2.2.2, eerste lid, onderdeel a][ref2], op welke wijze voldaan wordt aan
      de criteria, genoemd in [artikel 2.2.9, derde lid][ref3].

      b. voor een project als bedoeld in [artikel 2.2.2, eerste lid, onderdeel b][ref4], op welke wijze voldaan wordt aan
      de criteria, genoemd in [artikel 2.2.9, vierde lid][ref5].


