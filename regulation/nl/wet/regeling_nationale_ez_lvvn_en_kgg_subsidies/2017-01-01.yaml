  - number: 4.8.6
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], bedraagt:

      a. negen maanden na toetreding tot de MJA3 voor het opstellen van een energie-efficiëntieplan;

      b. de periode van het moment van indiening van de aanvraag voor subsidie als bedoeld in [artikel 4.8.2.][ref2] tot
      de datum, bedoeld in [bijlage 4.8.1.][ref3], voor het actualiseren van een energie-efficiëntieplan.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel4.8.2
      [ref3]: https://wetten.overheid.nl/BWBR0035474
