    text: |-
      In deze paragraaf wordt verstaan onder:

      *early adopter-project*: project bestaande uit experimentele ontwikkeling, gericht op het in een realistische
      industriële omgeving valideren van een nieuwe energiebesparende technologie, passend binnen de in
      [bijlage 4.2.15][ref1] (Programmalijnen Energie en industrie: early adopterprojecten) opgenomen programmalijnen.

      *eindgebruiker*: onderneming die de ontwikkelde technologie gaat toepassen en daarmee energiebesparing in zijn
      onderneming realiseert.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.2.106
