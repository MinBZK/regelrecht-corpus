  - number: 3.4.30
    text: |-
      Deze titel vervalt met ingang van 1 november 2017, met dien verstande dat deze van toepassing blijft op subsidies
      die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.4.30
  - number: 3.5.1
    text: |-
      In deze titel wordt verstaan onder:

        - *collectief onderzoek:* industrieel onderzoek of experimentele ontwikkeling waarvan de resultaten naar hun aard
      voor een bredere groep toepasbaar zijn;
        - *collectieve activiteiten:* activiteiten die op basis van innovatieplannen door twee of meer IPC-deelnemers
      gezamenlijk zullen worden gefinancierd en uitgevoerd en waarvan de resultaten evenredig over deze deelnemers worden
      verdeeld;
        - *innovatieplan:* planmatige beschrijving van de activiteiten, inclusief de planning en kosten daarvan, die een
      IPC-deelnemer zal verrichten met het oog op innovatie van zijn producten, diensten of productieproces, met inbegrip
      van zijn collectieve activiteiten en van zijn activiteiten in het kader van het overkoepelende plan;
        - *IPC-deelnemer:* MKB-ondernemer die deelneemt aan een IPC-verband;
        - *IPC-penvoerder:* rechtspersoon die: a. de mogelijkheden onderzoekt om tot een IPC-verband te komen als bedoeld
      in [paragraaf 3.5.2][ref1], b. de mogelijkheden onderzoekt om in samenwerking met ten minste één soortgelijke
      organisatie uit een ander land te komen tot collectief onderzoek en dit onderzoek laat uitvoeren, als bedoeld
      in [paragraaf 3.5.3][ref2], of c. namens de IPC-deelnemers optreedt als projectleider van een IPC-verband en het
      overkoepelende plan uitvoert als bedoeld in [paragraaf 3.5.4][ref3], en d. niet werkzaam is in een van de sectoren
      die ingevolge artikel 1 van de algemene de-minimisverordening is uitgesloten van de toepassing van die verordening;
        - *IPC-project:* project bestaande uit activiteiten die de IPC-penvoerder en de IPC-deelnemers binnen een periode
      van twee jaar verrichten ter uitvoering van het overkoepelende plan en de daarmee samenhangende innovatieplannen;
        - *overkoepelend plan:* plan waarin de IPC-penvoerder beschrijft wat de samenhang is tussen de verschillende
      innovatieplannen, welke collectieve activiteiten worden verricht en door welke deelnemers, hoe en in welke mate
      het IPC-project voldoet aan de criteria van [artikel 3.5.23][ref4], welke activiteiten hij ten behoeve van de
      IPC-deelnemers en het IPC-project zal verrichten, waaronder ten minste het begeleiden van de IPC-deelnemers bij
      het uitvoeren van de innovatieplannen, het begeleiden van samenwerkingsverbanden van de IPC-deelnemers en het
      begeleiden en uitvoeren van administratieve activiteiten die samen hangen met een IPC-project, alsmede een globale
      omschrijving van de planning en de geraamde kosten van deze activiteiten;
        - *publieke kennisinstelling:* a. onder a, b, c, f of g van de [bijlage van de Wet op het hoger
      onderwijs en wetenschappelijk onderzoek](onbekend) genoemde instelling voor hoger onderwijs
      en een onder i van de bijlage bij die wet bedoeld academisch ziekenhuis, Nyenrode Business
      Universiteit alsmede andere instellingen van hoger onderwijs, die op basis van [artikel 6.9][ref5]
      of [16.14 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6] zijn aangewezen;
      b. instelling als bedoeld in [artikel 1.1.1, onderdeel b][ref7], [artikel 12.3.8][ref8] en
      [artikel 12.3.9 van de Wet educatie en beroepsonderwijs][ref9]; c. andere dan onder a bedoelde geheel of
      gedeeltelijk, meerjarig door de overheid gefinancierde onderzoeksorganisatie zonder winstoogmerk die activiteiten
      verricht met als doel de algemene wetenschappelijke of technische kennis uit te breiden; d. geheel of gedeeltelijk,
      meerjarig door een andere lidstaat van de Europese Unie gefinancierde: 1°. openbare instelling voor hoger onderwijs
      of een daaraan verbonden ziekenhuis gelijkwaardig aan een instelling respectievelijk academisch ziekenhuis als
      bedoeld onder a, 2°. instelling van middelbaar beroepsonderwijs gelijkwaardig aan een instelling als bedoeld
      onder b of 3°. onderzoeksorganisatie zonder winstoogmerk die activiteiten verricht met als doel de algemene
      wetenschappelijke en technische kennis uit te breiden; e. rechtspersoon ten aanzien waarvan een instelling als
      bedoeld onder a, b, c of d direct of indirect: 1°. meer dan de helft van het geplaatste kapitaal verschaft, 2°.
      volledig aansprakelijk vennoot is of 3°. overwegende zeggenschap heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Hoofdstuk3
