  - number: 3.2.1
    text: |-
      1 In deze titel wordt verstaan onder:

        - *geldmiddelen:* chartaal geld, giraal geld of elektronisch geld;
        - *innovatieactiviteiten:* ondersteunende activiteiten, gericht op het betrekken van MKB-ondernemers bij een
      samenwerkingsproject of het stimuleren van de valorisatie van de kennis op het terrein van het TKI-programma,
      bestaande uit: a. netwerkactiviteiten, bestaande uit masterclasses, workshops, conferenties of het delen of
      uitwisselen van informatie via een website om kennisdeling en netwerking tussen MKB-ondernemers te bevorderen, of
      b. innovatieadviesdiensten, uitgezonderd opleiding, verstrekt aan een MKB-ondernemer door een innovatiemakelaar;
        - *inzet in natura:* op geld waardeerbare inbreng in een samenwerkingsproject die a. niet direct of indirect
      afkomstig is van een onderzoeksorganisatie of een openbaar lichaam als bedoeld in de definitie van private
      bijdrage, en b. wordt berekend op basis van een voor de deelnemers aan een samenwerkingsproject gebruikelijke en
      controleerbare methode, die gebaseerd is op bedrijfseconomische grondslagen en normen die in het maatschappelijk
      verkeer als aanvaardbaar worden beschouwd en die de deelnemers aan een samenwerkingsproject stelselmatig toepassen;
        - *private bijdrage:* geldmiddelen die niet direct of indirect afkomstig zijn van: a. een onderzoeksorganisatie met
      inbegrip van de Nederlandse organisatie voor wetenschappelijk onderzoek en de Koninklijke Nederlandse Akademie van
      Wetenschappen, b. een openbaar lichaam;
        - *samenwerkingsproject:* project dat: a. in daadwerkelijke samenwerking plaatsvindt; b. door minimaal twee
      deelnemers waaronder een onderzoeksorganisatie en een ondernemer wordt uitgevoerd, en c. bestaat uit fundamenteel
      onderzoek, industrieel onderzoek, experimentele ontwikkeling of een combinatie daarvan.
        - *TKI:* Topconsortium voor Kennis en Innovatie, zijnde een rechtspersoon die als zodanig is genoemd in de wet
      houdende vaststelling van de begrotingsstaten van het Ministerie van Economische Zaken van het jaar waarop de
      aanvraag, bedoeld in [artikel 3.2.2][ref1], betrekking heeft;
        - *TKI-programma:* op onderzoek en innovatie gericht meerjarig programma, houdende de samenwerkingsprojecten en de
      innovatie-activiteiten van het TKI;
        - *TKI-relevante onderzoeksopdracht:* opdracht: a. die wordt uitgevoerd door een onderzoeksorganisatie, b. die
      bestaat uit fundamenteel onderzoek, industrieel onderzoek, experimentele ontwikkeling of een combinatie daarvan,
      en c. die kennis oplevert voor de onderzoeksorganisatie die toepasbaar is in binnen het TKI-programma mogelijke
      samenwerkingsprojecten;

      2 In deze titel wordt onder onderzoeksorganisatie verstaan, een onderzoeksorganisatie zonder winstoogmerk.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.2
