      van innovaties in de markt en de wijze waarop daarmee wordt omgegaan;

      c. in onvoldoende mate is voorzien in een kwalitatief goede kennisverspreiding;

      d. eerder op grond van dit hoofdstuk of de [Subsidieregeling energie en innovatie][ref1] een subsidie is verstrekt
      voor een soortgelijk project;

      e. de samenwerking onvoldoende evenwichtig is.


