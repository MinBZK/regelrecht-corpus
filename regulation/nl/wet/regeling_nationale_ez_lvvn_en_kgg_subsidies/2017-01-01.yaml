  - number: 3.5.10
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een IPC-penvoerder voor:

      a. het onderzoeken van de mogelijkheden om in samenwerking met ten minste één soortgelijke organisatie uit een
      ander land te komen tot collectief onderzoek dat ten goede komt aan de gehele branche, resulterende in een verslag
      van dit onderzoek en, indien de conclusie is dat collectief onderzoek mogelijk is, het opstellen van een plan voor
      een hierop volgend collectief onderzoek;

      b. het door één of meer onderzoeksorganisaties laten uitvoeren van het collectief onderzoek, bedoeld in onderdeel
      a, resulterende in een rapport met onderzoeksresultaten en het kosteloos verspreiden van die resultaten binnen
      de branche.

      2 In aanvulling op [artikel 3, eerste lid, van het besluit][ref1] kan ook subsidie worden verstrekt aan een IPC-
      penvoerder die gevestigd is in het openbaar lichaam Bonaire, Sint Eustatius of Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel3
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.5.10
