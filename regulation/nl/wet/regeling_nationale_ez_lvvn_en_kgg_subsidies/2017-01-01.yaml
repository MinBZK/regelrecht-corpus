        hoofdstuk: '3'
  - number: 3.2.2
    text: |-
      De minister verstrekt op aanvraag TKI-toeslag aan een TKI voor:

      a. uitvoering van het TKI-programma (programmatoeslag), of

      b. uitvoering van een bepaald samenwerkingsproject (projecttoeslag).
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.2.2
  - number: 3.2.3
    text: |-
      1 De hoogte van de programmatoeslag bedraagt 25% van de som van:

      a. de private bijdragen voor de samenwerkingsprojecten van het TKI-programma, en

      b. de private bijdragen aan TKI-relevante onderzoeksopdrachten,

      die in het kalenderjaar, voorafgaand aan het kalenderjaar waarin de aanvraag is ingediend, blijkens onderbouwing in
      de aanvraag aan onderzoeksorganisaties verschuldigd zijn geworden;

      2 Over de eerste € 20.000 van de som van de private bijdragen van een bepaalde deelnemer aan samenwerkingsprojecten
      van het TKI-programma per jaar bedraagt de hoogte van de programmatoeslag, in afwijking van het eerste lid, 40%.

      3 De private bijdragen aan TKI-relevante onderzoeksopdrachten, die zijn gerealiseerd in het kalenderjaar
      voorafgaand aan het kalenderjaar waarin de aanvraag is ingediend, worden in aanmerking genomen tot ten hoogste
      40% van de totale gerealiseerde private bijdragen in het kalenderjaar voorafgaand aan het kalenderjaar waarin de
      aanvraag is ingediend.

      4 Het eerste lid, onderdeel b, is niet van toepassing voor zover de uit een TKI-relevante onderzoeksopdracht
      voortvloeiende kennis van de onderzoeksorganisatie redelijkerwijs slechts ten goede kan of zal komen aan de
      onderneming, de onderzoeksinstelling, of beide partijen bij de TKI-relevante onderzoeksopdracht.

      5 Een TKI bevordert dat kennis die voortvloeit uit TKI-relevante onderzoeksopdrachten waarvoor hij op grond van het
      eerste lid, onderdeel b, TKI-toeslag heeft ontvangen, daadwerkelijk wordt toegepast binnen een samenwerkingsproject
      van het TKI-programma.

      6 Voor toepassing van het tweede lid kan de waarde van inzet in natura tot ten hoogste € 20.000 als private
      bijdrage in aanmerking worden genomen.

      7 Voor de toepassing van dit artikel worden private bijdragen aan een onderzoeks- of experimenteel
      ontwikkelingsproject dat op het moment van aanvraag al anders dan als samenwerkingsproject van een TKI-programma
      wordt uitgevoerd slechts in aanmerking genomen indien bestaande publieke of private bijdragen aan dat project niet
      bij gelegenheid van opneming in het TKI-programma worden verlaagd.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.2.3
  - number: 3.2.5
    text: |-
      1 De hoogte van de projecttoeslag bedraagt 25% van de som van de private bijdragen die in totaal voor het
      desbetreffende samenwerkingsproject aan onderzoeksorganisaties verschuldigd zullen worden.

      2 [Artikel 3.2.3, tweede en zesde lid][ref1], is op de hoogte van projecttoeslag van toepassing met dien verstande
      dat niet de private bijdrage in een jaar maar de private bijdrage voor het project als geheel in aanmerking wordt
      genomen.

      3 De minister verstrekt uitsluitend projecttoeslag indien de verschuldigdheid van de private bijdragen en de inzet
      in natura blijkt uit een bij de aanvraag gevoegd afschrift van een ondertekende samenwerkingsovereenkomst.

      4 Projecttoeslag wordt niet verstrekt voor samenwerkingsprojecten die een looptijd hebben van meer dan tien jaar.

      5 Op grond van dit artikel voor projecttoeslag in aanmerking genomen private bijdragen en inzet in natura worden
      niet in aanmerking genomen voor bepaling van de hoogte van de programmatoeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.3
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.2.5
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.2.3
        hoofdstuk: '3'
  - number: 3.2.6
    text: |-
      1 In afwijking van de [artikelen 3.2.3, eerste lid][ref1], en [3.2.5, eerste lid][ref2], worden private
      bijdragen aan onderzoeksorganisaties, al dan niet binnen een samenwerkingsproject, voor onderzoek dat past
      binnen een programma als bedoeld in [artikel 3.2.2 eerste lid][ref3], afkomstig van instellingen als bedoeld in
      [artikel 5b, eerste lid, van de Algemene wet inzake rijksbelastingen][ref4], in aanmerking genomen tot ten hoogste
      € 75.000.000 per jaar.

      2 Indien het totaal van de in een bepaalde openstellingsperiode ingediende aanvragen het bedrag, bedoeld in het
      eerste lid, overschrijden, worden de in de desbetreffende aanvragen opgenomen bedragen op volgorde van binnenkomst
      in aanmerking genomen.


