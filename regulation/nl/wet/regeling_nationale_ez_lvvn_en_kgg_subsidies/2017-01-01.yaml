  - number: 3.9.15
    text: |-
      Deze titel vervalt met ingang van 1 juli 2019, met dien verstande dat deze van toepassing blijft op subsidies die
      voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.9.15
  - number: 3.10.1
    text: |-
      1 In deze titel wordt verstaan onder:

        - *achtergestelde vordering:* vordering van een startersfonds ten laste van een technostartersvennootschap; a. die
      het startersfonds heeft verkregen door aan de technostartersvennootschap geld ter leen te verstrekken, b. waarop
      de debiteur krachtens een daartoe strekkende bepaling in de akte van geldlening in geval van ontbinding, een
      akkoord na verlening van surseance van betaling of een akkoord in faillissement van de debiteur, eerst verplicht
      is rente en aflossing te betalen nadat alle andere op dat moment bestaande schulden van de debiteur zijn voldaan,
      met uitzondering van de schulden die voortvloeien uit leningen waaraan een bepaling van gelijke aard als voornoemde
      bepaling is verbonden, c. terwijl ingevolge de vorenbedoelde akte van geldlening de crediteur afstand heeft gedaan
      van alle rechten tot verrekening van de rente en aflossing;
        - *agri-horti-food-tech technostarter:* technostarter wiens onderneming producten, processen of diensten verkoopt
      en levert die zijn gebaseerd op een nieuwe technische of creatieve vinding of een nieuwe toepassing van bestaande
      technologie onderscheidenlijk van een bestaande creatieve vinding voornamelijk op het gebied van hightech,
      inclusief ICT, met betrekking tot agrifood, tuinbouw of uitgangsmaterialen;
        - *beheerskosten:* alle kosten die een startersfonds maakt voor het verkrijgen, behouden en beëindigen van
      participaties, met inbegrip van de kosten van begeleiding van technostartersvennootschappen, uitgezonderd de
      verkrijgingprijs van de participaties;
        - *creatieve technostarter:* technostarter die actief is in de creatieve zakelijke dienstverlening, media,
      entertainment, of kunsten;
        - *eerste commerciële verkoop:* eerste verkoop door een onderneming op een product- of dienstenmarkt;
        - *eHealth technostarter:* technostarter wiens onderneming producten, processen of diensten verkoopt en
      levert, die zijn gebaseerd op een nieuwe technische of creatieve vinding of een nieuwe toepassing van bestaande
      technologie onderscheidenlijk van een bestaande creatieve vinding onder meer op het gebied van ICT om gezondheid en
      gezondheidszorg te ondersteunen of te verbeteren, en die bijdragen aan zelfregie, zelfredzaamheid of zelfzorg van
      de patiënt;
        - *fondsplan:* plan van een startersfonds tot uitvoering van een met elkaar samenhangend geheel van activiteiten
      die bestaan uit het verkrijgen, beheren en beëindigen van participaties en het begeleiden van de desbetreffende
      technostartersvennootschappen;
        - *informal investor:* een particulier die voor eigen rekening en risico participeert en investeert in
      ondernemingen;
        - *inkomsten:* alle op geld waardeerbare voordelen die een startersfonds heeft verkregen uit een participatie,
      waaronder dividend, rente, aflossingen, opties, de prijs waartegen de participatie is vervreemd, de prijs waartegen
      de participatie door de technostartersvennootschap is ingekocht of terugbetaald en de liquidatie-uitkering;
        - *investeringsbudget:* financiële middelen die een startersfonds beschikbaar heeft of zal hebben en die bestemd
      zijn om de verkrijgingprijs van participaties te voldoen;
        - *investeringsperiode:* periode gedurende welke een startersfonds activiteiten verricht ter verkrijging van
      participaties;
        - *participatie:* risicodragend kapitaal in de vorm van: a. aandelen in het kapitaal van een
      technostartersvennootschap die het startersfonds rechtstreeks van de technostartersvennootschap heeft verkregen
      tegen volstorting van die aandelen in geld, of door omzetting van een achtergestelde vordering of b. aandelen in
      het kapitaal van een technostartersvennootschap als bedoeld onder a in combinatie met een achtergestelde vordering;
        - *referentierente:* referentierentevoet, bedoeld in de Mededeling van de Commissie over de methode waarmee de
      referentie- en disconteringspercentages worden vastgesteld (PbEG 1997, C273), zoals laatstelijk vastgesteld voor
      Nederland, en vermeerderd met 4 procent;
        - *startersfonds:* vennootschap: a. in de vorm van een kapitaalvennootschap of een vennootschap met een
      afgescheiden vermogen, ingericht naar het recht van één van de andere lidstaten van de Europese Unie; b. die
      blijkens de akte waarbij haar statuten zijn vastgesteld of blijkens de overeenkomst waarbij zij is aangegaan
      uitsluitend tot doel heeft het verstrekken van risicodragend kapitaal aan technostartersvennootschappen teneinde
      winst te behalen; en c. waarin ten minste drie aandeelhouders of hoofdelijk aansprakelijke vennoten deelnemen
      respectievelijk samenwerken zonder dat twee of drie van hen tot dezelfde groep behoren en zonder dat één van hen
      een meerderheidsbelang in het fonds heeft;
        - *technostarter*: rechtspersoon die een onderneming drijft die: a. minder dan zeven jaar na haar eerste
      commerciële verkoop actief is op een product- of dienstenmarkt, b. ten tijde van de eerste verstrekking van
      risicodragend kapitaal op grond van deze titel voldoet aan de definitie van middelgrote, kleine of micro-
      ondernemingen in de zin van Aanbeveling 2003/361/EG van de Commissie van 6 mei 2003 betreffende de definitie
      van kleine, middelgrote en micro-onderneming en (PbEU 2003, L124); en c. hetzij voor eigen rekening en risico
      producten, processen of diensten – niet zijnde adviezen – verkoopt en levert, die zijn gebaseerd op een nieuwe
      technische vinding of een nieuwe toepassing van bestaande technologie, d. hetzij deel uitmaakt van één van de
      creatieve sectoren en voor eigen rekening en risico producten, processen of diensten – niet zijnde adviezen
      – verkoopt en levert, die zijn gebaseerd op een nieuwe creatieve vinding of op een nieuwe toepassing van een
      bestaande creatieve vinding;
        - *technostartersvennootschap:* een technostarter die a. een onderneming drijft in de vorm van een
      kapitaalvennootschap, en b. zijn primaire bedrijfsactiviteiten in Nederland uitvoert, behoudens voor zover de
      onderneming behoort tot de economische sectoren van landbouw, visserij, aquacultuur of scheepsbouw of tot de EGKS-
      sectoren;
        - *verkrijgingprijs van een participatie:* bedrag in geld waarvoor het startersfonds de participatie heeft
      verkregen.

      2 Voor de toepassing van deze titel wordt als financier aangewezen een startersfonds.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.10.1
  - number: 3.10.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een startersfonds voor het uitvoeren van een fondsplan.

      2 De minister verstrekt op aanvraag subsidie aan een startersfonds voor het uitvoeren van een fondsplan voor een
      creatieve technostarter.

      3 De minister verstrekt op aanvraag subsidie aan een startersfonds voor het uitvoeren van een fondsplan voor agri-
      horti-food-tech technostarters.

      4 De minister verstrekt op aanvraag subsidie aan een startersfonds voor het uitvoeren van een fondsplan voor
      eHealth technostarters.

      5 De subsidie wordt verleend in de vorm van een geldlening.

      6 De beschikking tot verlening van een subsidie kan worden verleend onder voorwaarden die zijn gericht op het
      wegnemen of beperken van risico’s die aan de subsidieverstrekking, bedoeld in het eerste en tweede lid, verbonden
      kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.10.2
  - number: 3.10.3
    text: |-
      1 In de overeenkomst van geldlening wordt bepaald dat:

      a. de financier een deel van de inkomsten uit participaties overboekt aan de minister;

      b. de financier geen andere activiteiten verricht dan de uitvoering van het fondsplan.

      2 In de overeenkomst van geldlening kunnen bepalingen worden opgenomen die strekken tot verwezenlijking van het
      doel van de subsidie.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.10.3
  - number: 3.10.4
    text: |-
      De geldlening die op grond van de overeenkomst van geldlening ten hoogste kan worden geleend, bedraagt 50 procent
      van het investeringsbudget.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.10.4
  - number: 3.10.5
    text: Het maximum subsidiebedrag bedraagt € 6.000.000 per subsidieontvanger.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.10.5
  - number: 3.10.6
    text: |-
      1 Er is een Adviescommissie seed capital technostarters die tot taak heeft de minister op zijn verzoek te
      adviseren omtrent de afwijzingsgronden, bedoeld in de [artikelen 22][ref1] en [24 van het besluit][ref2] en in
      [artikel 3.10.7][ref3], en de rangschikkingscriteria, bedoeld in [artikel 3.10.8][ref4].

      2 De commissie bestaat uit ten minste vier en ten hoogste negen leden.

      3 De voorzitter en de andere leden worden door de minister voor een termijn van ten hoogste drie jaar benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.10.7
      [ref4]: https://wetten.overheid.nl/BWBR0035474#Artikel3.10.8
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.10.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0035474
        artikel: 3.10.7
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0035474
        artikel: 3.10.8
        hoofdstuk: '3'
  - number: 3.10.7
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien:

      a. onvoldoende aannemelijk is dat de financier gedurende de investeringsperiode daadwerkelijk zal beschikken over
      de middelen die de financier aan het investeringsbudget bijdraagt;

      b. onvoldoende vertrouwen bestaat dat de betrokkenen de capaciteiten hebben voor het verkrijgen van participaties
      en voor het beheer van de financier op een wijze zoals bij participatiefondsen gebruikelijk is;

      c. een fondsplan niet is gebaseerd op de uitgangspunten dat:

      1°. een financier participaties verkrijgt gedurende een investeringsperiode van ten hoogste zes jaar, en deze
      uiterlijk zes jaar na afloop van de investeringsperiode vervreemdt;

      2°. de totale verkrijgingprijs van de participaties die gedurende de investeringsperiode in één
      technostartersvennootschap worden verkregen, ten minste € 100.000 en ten hoogste € 3.500.000 bedraagt;

      3°. de gemiddelde totale verkrijgingprijs van de participaties die een financier gedurende de investeringsperiode
      per technostartersvennootschap verkrijgt, over alle technostartersvennootschappen genomen ten hoogste € 1.200.000
      bedraagt;

      4°. de middelen die door een financier over een periode van twaalf maanden aan een technostartersvennootschap
      worden verstrekt ten hoogste € 2.000.000 bedragen;

      5°. de beheerskosten jaarlijks ten hoogste 5 procent bedragen van het investeringsbudget;

      6°. de fondsbeheerder voor zijn werkzaamheden een beloning verkrijgt die afhankelijk is van zijn individuele
      prestatie;

      7°. de relatieve omvang van achtergestelde vorderingen zodanig wordt beperkt dat ten hoogste 50 procent van het
      totaal van de verkrijgingsprijzen van de participaties betrekking heeft op achtergestelde vorderingen;

      8°. voor achtergestelde vorderingen een rente wordt bedongen die ten minste gelijk is aan de referentierente;

      9°. de participaties verkregen worden in technostartersvennootschappen waarvan de rentabiliteits- en
      continuïteitsperspectieven ten minste redelijk zijn;

      10°. bij de beslissing van de financier inzake de verkrijging van een participatie rekening wordt gehouden met het
      ondernemingsplan van de desbetreffende technostartersvennootschap;

      11°. de participaties verkregen worden in technostartersvennootschappen waarin niet eerder een participatie
      is verkregen door een investeringsfonds, niet zijnde een financier, behoudens indien de eerdere participatie
      is verkregen door een informal investor of door een investeringsfonds dat uitsluitend het verstrekken van
      risicodragend kapitaal aan technostartersvennootschappen tot doel heeft en dat naar het oordeel van de minister
      niet in staat is nieuwe participaties in de technostartersvennootschap te verkrijgen;

      d. het fondsplan onvoldoende is onderbouwd;

      e. onvoldoende vertrouwen bestaat dat het fondsplan naar behoren wordt uitgevoerd;

      f. indien de belangen van de Staat kunnen worden geschaad.

      2 [Artikel 23, onderdeel b, van het besluit][ref1] is niet van toepassing.

      3 Indien een starterfonds een aanvraag die betrekking heeft op het uitvoeren van een fondsplan voor eHealth
      technostarters, onder zowel een generieke openstelling voor fondsplannen voor technostarters als onder een
      gelijktijdige specifieke openstelling voor fondsplannen voor eHealth technostarters heeft ingediend, en dit
      fondsplan op basis van de rangschikking en hoogte van het subsidieplafond bij beide openstellingen in aanmerking
      komt voor subsidiëring, beslist de minister afwijzend op de aanvraag onder de generieke openstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.10.7
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.10.8
    text: |-
      1 De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate:

      a. de aanvrager meer kan steunen op relevante ervaring en deskundigheid;

      b. het fondsplan meer bijdraagt aan de opbouw van succesvolle ondernemingen door technostartersvennootschappen;

      c. het fondsplan doelmatiger is ingericht.

      2 Voor de rangschikking wegen de in het eerste lid vermelde criteria even zwaar.
