  - number: 3.17.1
    text: |-
      In deze titel wordt verstaan onder:

        - *onderzoeksinfrastructuur:* onderzoeksinfrastructuur als bedoeld in artikel 2, onderdeel 91, van de algemene
      groepsvrijstellingsverordening;
        - *onderzoeksorganisatie:* organisatie voor onderzoek en kennisverspreiding als bedoeld in artikel 2, onderdeel 83,
      van de algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.17.1
  - number: 3.17.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie voor de financiering van de bouw van nieuwe onderzoeksinfrastructuur
      of het verbeteren van bestaande onderzoeksinfrastructuur aan:

      a. een onderzoeksorganisatie;

      b. een hogeschool als bedoeld in
      [artikel 1.3, derde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], of

      c. een door of mede door een onderzoeksorganisatie dan wel hogeschool of onderzoeksorganisaties dan wel hogescholen
      opgerichte of op te richten rechtspersoon die de onderzoeksinfrastructuur exploiteert respectievelijk zal gaan
      exploiteren.

      2 De subsidie wordt verstrekt in de vorm van een renteloze lening.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.3
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.17.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1.3'
  - number: 3.17.3
    text: |-
      1 De subsidie bedraagt maximaal 50 procent van de subsidiabele kosten.

      2 De subsidie bedraagt minimaal € 1.000.000 en maximaal € 15.000.000.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.17.3
  - number: 3.17.4
    text: |-
      Voor subsidie komen uitsluitend de kosten, bedoeld in artikel 26, vijfde lid, van de algemene
      groepsvrijstellingsverordening, in aanmerking.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.17.4
  - number: 3.17.5
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.17.5
  - number: 3.17.6
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1], is vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.17.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.17.7
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. onvoldoende vertrouwen bestaat dat de subsidieontvanger de lening kan terugbetalen binnen de termijn, genoemd in
      [artikel 3.17.10, eerste lid][ref1];

      b. de subsidiabele kosten minder dan € 2.000.000 bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.10
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.17.7
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.17.10
        hoofdstuk: '3'
  - number: 3.17.8
    text: |-
      De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate:

      a. de verwachte kwaliteit van de bouw van de nieuwe onderzoeksinfrastructuur of de verbetering van de bestaande
      onderzoeksinfrastructuur hoger is (20%);

      b. de verwachte bijdrage van de onderzoeksinfrastructuur aan de economische en maatschappelijke waardecreatie en
      wetenschappelijke kwaliteit hoger is (30%);

      c. de verwachte kwaliteit van het toezicht op de onderzoeksinfrastructuur hoger is, gelet op in het verleden
      behaalde resultaten, financiële draagkracht, transparantie en organisatie van de managementlagen van de
      onderzoeksorganisatie (20%);

      d. de terugbetaling van de lening aannemelijker is, gelet op het verwachte gebruik en de exploitatie van de
      onderzoeksinfrastructuur (30%).
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.17.8
  - number: 3.17.9
    text: |-
      1 De subsidieontvanger zorgt ervoor dat:

      a. indien met de onderzoeksinfrastructuur zowel economische als niet-economische activiteiten worden verricht, voor
      de financiering, kosten en inkomsten van elke soort activiteiten een gescheiden boekhouding wordt gevoerd, op basis
      van consequent toegepaste en objectief te rechtvaardigen beginselen van kostprijsadministratie;

      b. voor zover met de onderzoeksinfrastructuur economische activiteiten worden verricht, de prijs die voor de
      exploitatie of het gebruik van de onderzoeksinfrastructuur bij iedere gebruiker in rekening wordt gebracht,
      overeenstemt met de marktprijs;

      c. de toegang tot de onderzoeksinfrastructuur:

      1°. open zal staan voor meerdere gebruikers, en

      2°. op transparante en niet-discriminerende basis verleend zal worden.

      2 Onder iedere gebruiker, bedoeld in het eerste lid, onderdeel b, wordt mede de subsidieontvanger verstaan.

      3 In afwijking van het eerste lid, onderdeel c, kan de subsidieontvanger iedere onderneming die ten minste 10% van
      de investeringskosten van de onderzoeksinfrastructuur heeft gefinancierd preferente toegang geven op gunstigere
      voorwaarden dan gelden voor de andere gebruikers, indien:

      a. deze toegang evenredig is aan de bijdrage van deze onderneming in de investeringskosten, en

      b. deze voorwaarden publiek beschikbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.17.9
  - number: 3.17.10
    text: |-
      1 De subsidieontvanger betaalt de subsidie volgens een in de beschikking tot subsidieverlening vastgelegd schema
      binnen vijftien jaar na de datum van de beschikking tot vaststelling van de subsidie terug aan de minister.

      2 De minister kan de ontheffing, bedoeld in [artikel 42, derde lid, van het besluit][ref1], slechts verlenen voor
      zover hierdoor de steunintensiteit, voor zover de subsidie betrekking heeft op economische activiteiten die met de
      onderzoeksinfrastructuur verricht gaan worden, 50% van de subsidiabele kosten niet zal overschrijden.

      3 De minister kan besluiten dat de verstrekte lening versneld of in een keer terugbetaald wordt, indien de
      onderzoeksinfrastructuur geheel of gedeeltelijk wordt vervreemd.

      4 Indien de vervreemding, bedoeld in het derde lid, tot winst bij de subsidieontvanger leidt, is deze daarover een
      vergoeding van 50% verschuldigd aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel42
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.17.10
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '42'
  - number: 3.17.11
    text: |-
      1 De subsidieontvanger verleent medewerking aan een evaluatie van de effecten van de door hem uitgevoerde
      activiteiten, bedoeld in [artikel 3.17.2, eerste lid][ref1], voor zover deze medewerking redelijkerwijs van hem
      verlangd kan worden.

      2 De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.2
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.17.11
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.17.2
        hoofdstuk: '3'
  - number: 3.17.12
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 3.17.2, eerste lid][ref1], bevat ten minste de gegevens,
      bedoeld in artikel 6, tweede lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie als bedoeld in [artikel 3.17.2, eerste lid][ref2],
      ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het KvK-nummer, het post- en bezoekadres en
      het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. gegevens over het plan, waaronder de activiteit waarvoor subsidie wordt aangevraagd, de start- en einddatum, de
      totale kosten en de omvang van de gevraagde subsidie;

      d. een businessplan, een projectplan en een financieel plan, waar onder meer uit volgt in welke mate de
      onderzoeksinfrastructuur economische en niet-economische activiteiten zal verrichten;

      e. een berekening van de marktrente voor de aangevraagde lening door een erkende kredietbeoordelaar.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.2
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.17.12
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.17.2
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 3.17.2
        hoofdstuk: '3'
  - number: 3.17.13
    text: |-
      1 Voor zover de subsidie, bedoeld in [artikel 3.17.2, eerste lid][ref1], betrekking heeft op economische
      activiteiten die met de onderzoeksinfrastructuur verricht gaan worden, bevat de subsidie staatssteun die wordt
      gerechtvaardigd door artikel 26 van de algemene groepsvrijstellingsverordening.

      2 Voor zover de subsidie, bedoeld in [artikel 3.17.2, eerste lid][ref2], betrekking heeft op niet-economische
      activiteiten die met de onderzoeksinfrastructuur verricht gaan worden, bevat de subsidie geen staatssteun.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.17.2
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.17.13
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.17.2
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 3.17.2
        hoofdstuk: '3'
  - number: 3.17.14
    text: |-
      Deze titel vervalt met ingang van 1 juli 2020, met dien verstande dat deze van toepassing blijft op subsidies die
      voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.17.14
  - number: 3.18.1
    text: |-
      In deze titel wordt verstaan onder:

        - *adviesbureau:* organisatie, niet zijnde een kennisinstelling, die deskundigheid heeft op het gebied van de op
      grond van deze titel te subsidiëren activiteiten, en die als hoofdactiviteit adviesopdrachten uitvoert;
        - *kennisinstelling:*
        - a. onder a, b, c, g of h van de [bijlage van de Wet op het hoger onderwijs en wetenschappelijk onderzoek]
      (onbekend) genoemde instelling voor hoger onderwijs en een onder j van de bijlage bij die wet bedoeld academisch
      ziekenhuis en Nyenrode Business Universiteit; b. andere dan onder a bedoelde geheel of gedeeltelijk, meerjarig
      door de overheid gefinancierde onderzoeksorganisatie zonder winstoogmerk die activiteiten verricht met als doel
      de algemene wetenschappelijke of technische kennis uit te breiden; c. geheel of gedeeltelijk, meerjarig door een
      andere lidstaat van de Europese Unie gefinancierde: 1°. openbare instelling voor hoger onderwijs of een daaraan
      verbonden ziekenhuis gelijkwaardig aan een instelling respectievelijk academisch ziekenhuis als bedoeld onder a,
      2°. onderzoeksorganisatie zonder winstoogmerk die activiteiten verricht met als doel de algemene wetenschappelijke
      en technische kennis uit te breiden; d. rechtspersoon ten aanzien waarvan een instelling als bedoeld onder a, b
      of c direct of indirect: 1°. meer dan de helft van het geplaatste kapitaal verschaft, 2°. volledig aansprakelijk
      vennoot is of 3°. overwegende zeggenschap heeft; e. onderzoeksorganisatie zonder winstoogmerk met eigen medewerkers
      in loondienst, die tot doel heeft via het structureel doen van eigen onderzoek en het ontwikkelen en testen van
      technische toepassingen door haar medewerkers, de technologische kennis op een specifiek terrein te bevorderen, die
      geen instelling is als bedoeld onder a tot en met d;
        - *service design-project:* project waarin een vooraf gespecificeerde kennisvraag over een nieuw dienstengebaseerd
      businessmodel wordt gesteld aan een kennisinstelling die of een adviesbureau dat gebruik maakt van service design-
      kennis of service design-methoden waarbij op praktische wijze nieuwe businessmodellen worden verkend, ontwikkeld en
      toegepast op basis van kennis van en inzicht in behoeften van gebruikers;
        - *service design-voucher:* op grond van [artikel 3.18.2][ref1] door de minister aan een MKB-ondernemer afgegeven
      document, dat deze ondernemer kan inleveren bij een kennisinstelling of een adviesbureau ten behoeve van de
      uitvoering van een service design-project.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.18.2
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.18.1
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.18.2
        hoofdstuk: '3'
        paragraaf: 3.18.2
  - number: 3.18.2
    text: |-
      Een service design-voucher heeft een waarde van maximaal € 3.000 en wordt aan een MKB-ondernemer verstrekt die
      actief is in een van de in de [bijlage 3.18.1][ref1] genoemde sectoren en daarin productieactiviteiten verricht,
      zodat hij een service design-project kan laten uitvoeren waarvan de resultaten ten goede komen aan de activiteiten
      die de ondernemer in Nederland verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.18.2
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 3.18.3
    text: |-
      1 De MKB-ondernemer vermeldt bij de aanvraag de kennisvraag die hij in het kader van het service design-project
      wil stellen.

      2 De MKB-ondernemer beantwoordt bij de aanvraag vragen die in het middel, bedoeld in
      [artikel 19, eerste lid, van het besluit][ref1] zijn opgenomen ten behoeve van een nulmeting.

      3 De MKB-ondernemer vermeldt bij de aanvraag een kennisinstelling of een adviesbureau waarbij de service design-
      voucher kan worden ingeleverd.

      4 De aanvraag bevat een verklaring de-minimissteun.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel19
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.18.3
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '19'
  - number: 3.18.4
    text: |-
      De minister bepaalt door loting aan welke MKB-ondernemers binnen het subsidieplafond vouchers worden verstrekt,
      uitgaande van de maximum waarde per voucher.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.18.4
  - number: 3.18.5
    text: |-
      1 De MKB-ondernemer die een service design-voucher heeft ontvangen overlegt binnen een maand na de dagtekening
      van de toekenning van een service design-voucher een offerte of een ondertekende opdrachtbevestiging van een
      kennisinstelling of een adviesbureau.

      2 De MKB-ondernemer draagt de service design-voucher over aan de kennisinstelling of het adviesbureau, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.18.5
  - number: 3.18.6
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. de MKB-ondernemer en de kennisinstelling of het adviesbureau reeds voor de datum van indienen van een aanvraag
      voor een service design-voucher verplichtingen jegens elkaar zijn aangegaan met betrekking tot het service design-
      project;

      b. de MKB-ondernemer de service design-voucher wil aanwenden voor een service design-project waarvoor reeds door
      een bestuursorgaan of de Europese Commissie subsidie is verstrekt of dat deel uitmaakt van een project of programma
      waarvoor reeds door een bestuursorgaan of de Europese Commissie subsidie is verstrekt;

      c. het adviesbureau organisatorisch en financieel niet onafhankelijk is van de aanvrager;

      d. al eerder een service design-voucher is toegekend in hetzelfde kalenderjaar;

      e. de MKB-ondernemer bij de aanvraag niet heeft ingestemd met het verlenen van medewerking aan monitoring en
      evaluatie van de effecten van deze titel bij zowel toewijzing als afwijzing van zijn aanvraag.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.18.6
  - number: 3.18.7
    text: |-
      Subsidie wordt verstrekt aan een kennisinstelling die of een adviesbureau dat een of meer service design-projecten
      heeft uitgevoerd en in verband daarmee een of meer geldige service design-vouchers overlegt.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.18.7
  - number: 3.18.8
    text: |-
      De subsidie bedraagt 75 procent van de door de kennisinstelling of het adviesbureau ten behoeve van de uitvoering
      van een service design-project in rekening gebrachte kosten, maar niet meer dan € 3.000 per service design-voucher.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.18.8
  - number: 3.18.9
    text: |-
      1 De kennisinstelling of het adviesbureau bij wie de service design-voucher wordt ingeleverd dient een aanvraag om
      subsidie na afloop van het service design-project in.

      2 De aanvraag moet binnen vijf maanden nadat de service design-voucher aan de MKB-ondernemer is verstrekt, zijn
      ontvangen.

      3 Indien de aanvraag niet binnen de termijn, bedoeld in het tweede lid, of indien de offerte of een ondertekende
      opdrachtbevestiging van de kennisinstelling of het adviesbureau aan de MKB-ondernemer niet binnen de termijn,
      bedoeld in [artikel 3.18.5, eerste lid][ref1], door de minister is ontvangen, vervalt de service design-voucher
      van rechtswege.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.18.5
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.18.9
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.18.5
        hoofdstuk: '3'
        paragraaf: 3.18.2
  - number: 3.18.10
    text: |-
      De kennisinstelling of het adviesbureau bij wie de service design-voucher wordt ingeleverd stuurt binnen een maand
      na afloop van het service design-project een schriftelijk verslag omtrent de uitvoering van het service design-
      project aan de minister.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.18.10
  - number: 3.18.11
    text: |-
      Subsidie die krachtens deze titel wordt verleend, bevat staatssteun en wordt gerechtvaardigd door de algemene de-
      minimisverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.18.11
  - number: 3.18.12
    text: |-
      1 De MKB-ondernemer die een service design-voucher heeft ontvangen en de kennisinstelling of het adviesbureau bij
      wie de service design-voucher wordt ingeleverd, verlenen medewerking aan monitoring en evaluatie van de effecten
      van de door hen op grond van deze titel uitgevoerde activiteiten, voor zover medewerking redelijkerwijs van hen kan
      worden verlangd.

      2 De verplichting, bedoeld in het eerste lid, geldt gedurende twee jaar na de datum van de beschikking tot
      subsidieverstrekking.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.18.12
  - number: 3.18.13
    text: |-
      Deze titel vervalt met ingang van 1 januari 2018, met dien verstande dat deze van toepassing blijft op subsidies
      die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.18.13
  - number: 4.1.1
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *energiedemonstratieproject:* op bescherming van het milieu gericht samenhangend geheel van activiteiten die
      een technisch en economisch risico inhouden, waarbij die activiteiten bestaan uit het door de aanvrager treffen
      van energie-efficiëntie maatregelen of maatregelen ter bevordering van energie uit hernieuwbare energiebronnen met
      behulp van: a. voor Nederland nieuwe apparaten, systemen of technieken, of b. een voor Nederland nieuwe toepassing
      van apparaten, systemen of technieken;
        - *duurzame energiehuishouding:* energiehuishouding die economisch efficiënt is, het milieu minder zwaar belast of
      voorziet in beschikbaarheid van energie in voldoende mate en van voldoende kwaliteit;
        - *kennisinstelling:* a. onder a, b, c, f, g of h van de [bijlage van de Wet op het hoger onderwijs en
      wetenschappelijk onderzoek](onbekend) genoemde instelling voor hoger onderwijs, b. andere dan onder a bedoelde
      geheel of gedeeltelijk door de rijksoverheid gefinancierde onderzoeksorganisatie die activiteiten verricht met als
      doel de algemene wetenschappelijke en technische kennis uit te breiden, c. geheel of gedeeltelijk door een andere
      staat gefinancierde openbare instelling voor hoger onderwijs gelijkwaardig aan een instelling als bedoeld onder a,
      of d. geheel of gedeeltelijk door een andere staat gefinancierde onderzoeksinstelling die activiteiten verricht met
      als doel de algemene wetenschappelijke en technische kennis uit te breiden;
        - *milieubescherming:* milieubescherming als bedoeld in paragraaf 1.3, onderdeel 19, onder 1, van het milieu- en
      energiesteunkader;
        - *milieustudie:* milieustudie als bedoeld in artikel 49, eerste lid, van de algemene
      groepsvrijstellingsverordening;
        - *niet-economische activiteiten van onderzoeksorganisaties:* fundamenteel onderzoek, industrieel onderzoek of
      experimentele ontwikkeling of een combinatie van deze vormen, onafhankelijk uitgevoerd door onderzoeksorganisaties
      en in de boekhouding van deze organisaties opgenomen als niet-economische activiteiten;
        - *ondernemer in de landbouwsector:* ondernemer die activiteiten verricht op het gebied van de productie,
      verwerking en afzet van landbouwproducten als bedoeld in bijlage 1 bij het Verdrag tot oprichting van de Europese
      Gemeenschap, met uitzondering van ondernemers in de visserij- en aquacultuursector en in de bosbouwsector;
        - *referentiekosten:* kosten voor een investering ten behoeve van een in Nederland gangbaar systeem, apparaat of
      techniek die in technisch opzicht vergelijkbaar is met een in Nederland uit te voeren project maar waarmee niet
      hetzelfde niveau van milieubescherming kan worden bereikt als met het uit te voeren project, terwijl, in geval van
      een uit te voeren project voor hernieuwbare energie, de capaciteit voor de opwekking van energie van dat project
      ten minste overeenkomt met die van de eerstbedoelde investering.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.1.1
  - number: 4.1.3
    text: |-
      Voor de toepassing van dit hoofdstuk bedraagt het uurtarief, bedoeld in [artikel 13, tweede lid][ref1], en
      [14 van het besluit][ref2], € 60.


