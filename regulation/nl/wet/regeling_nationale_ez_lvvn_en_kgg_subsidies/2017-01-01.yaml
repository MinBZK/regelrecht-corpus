    text: |-
      1 In afwijking van [artikel 11 van het besluit][ref1] worden de kosten voor activiteiten als bedoeld in
      [artikel 3.5.17, eerste lid, onderdeel b][ref2], berekend overeenkomstig [artikel 14 van het besluit][ref3].

      2 De subsidiabele kosten voor activiteiten als bedoeld in [artikel 3.5.17, eerste lid, onderdeel b][ref4], zijn de
      kosten, bedoeld in artikel 25, derde lid, van de algemene groepsvrijstellingsverordening.

      3 In afwijking van het eerste lid komen de volgende kosten niet voor subsidie in aanmerking: de kosten van
      het maken van een innovatieplan; de kosten van implementatie van de innovatie, waaronder begrepen marketing-
      en salesactiviteiten, herhalingstesten en het inrichten van de productie; de kosten van het opzetten van
      kwaliteitssystemen; de kosten van opleidingen; de kosten van deelname aan tentoonstellingen en symposia; de
      reiskosten en kosten die verband houden met penvoerdersactiviteiten.


