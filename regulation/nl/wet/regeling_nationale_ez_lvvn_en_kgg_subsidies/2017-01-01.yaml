  - number: 4a.1.8
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 4a.1.2][ref1] bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder het nummer waaronder de onderneming geregistreerd is bij de Kamer van
      Koophandel en Nijverheid, bedoeld in de [Wet op de Kamers van Koophandel en Nijverheid BES][ref2], het post- en
      bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. een projectplan;

      d. een projectbegroting;

      e. een financiële onderbouwing waaruit blijkt dat de aanvrager op het moment van indiening van de aanvraag niet in
      staat is het project zonder subsidie rendabel te maken.

      2 De aanvraag voor de vaststelling van een subsidie die krachtens deze titel is verleend bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de aanvrager en het door de minister verstrekte
      referentienummer;

      b. de omvang van de vast te stellen subsidie;

      c. de kerngegevens voor de onderbouwing van de subsidievaststelling;

      d. de datum waarop met de uitvoering van de op grond van deze titel gesubsidieerde activiteiten is gestart.

      3 In afwijking van [artikel 50, tweede lid, onderdeel c, van het besluit][ref3], behoeft, indien de subsidie
      € 125.000 of meer bedraagt, het verzoek om subsidievaststelling niet vergezeld te gaan van een controleverklaring.

      4 De aanvragen, bedoeld in het eerste en tweede lid, zijn in de Nederlandse taal gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4a.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0028238
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel50
