  - number: 4.7.11
    text: |-
      Onze Minister van Economische Zaken zendt binnen 5 jaar na de inwerkingtreding van deze titel aan de Tweede Kamer
      een verslag over de doeltreffendheid en de effecten van deze titel in de praktijk.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.7.11
  - number: 4.7.12
    text: |-
      Deze titel en bijlage 4.7.1 vervallen met ingang van 1 juli 2020, met dien verstande dat deze van toepassing
      blijven op subsidies die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.7.12
  - number: 4.8.1
    text: |-
      In deze titel wordt verstaan onder:

        - *energie-efficiëntieplan:* energie-efficiëntieplan, bedoeld in artikel 3.2 van de MJA3;
        - *inrichting:* inrichting, bedoeld in artikel 1, onderdeel l, van de MJA3;
        - *MJA3:* Meerjarenafspraak Energie-Efficiëntie 2001-2020.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.8.1
  - number: 4.8.2
    text: |-
      De minister verstrekt op aanvraag een subsidie aan een ondernemer die een kleine of middelgrote onderneming drijft
      en ten aanzien van die onderneming is toegetreden tot de MJA3 voor de kosten voor:

      a. het opstellen van een energie-efficiëntieplan als bedoeld in artikel 3.1 van de MJA3 ten behoeve van een
      inrichting die deel uitmaakt van die onderneming;

      b. het actualiseren van een energie-efficiëntieplan als bedoeld in artikel 3.3 van de MJA3 ten behoeve van een
      inrichting die deel uitmaakt van die onderneming.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.8.2
  - number: 4.8.3
    text: |-
      1 De volgende kosten komen in aanmerking voor subsidie:

      a. de loonkosten van het bij het opstellen of actualiseren van een energie-efficiëntieplan betrokken personeel van
      de subsidieontvanger;

      b. de kosten voor het inhuren van consultatie en bijstand ten behoeve van het opstellen of actualiseren van een
      energie-efficiëntieplan.

      2 Indien de subsidie wordt aangevraagd voor het opstellen van een energie-efficiëntieplan komen de kosten, bedoeld
      in het eerste lid, onderdeel b, slechts voor subsidie in aanmerking voor zover het kosten betreft voor:

      a. het beschrijven en kwantificeren van de positie van de inrichting in de keten met betrekking tot energie-
      efficiëntie;

      b. het identificeren van maatregelen, gericht op energie-efficiëntie;

      c. het bepalen van de besparingsomvang van de maatregelen, bedoeld in onderdeel b;

      d. het opstellen of actualiseren van een energiebalans en het verzamelen van gegevens daartoe;

      e. het bepalen van de rentabiliteit van de maatregelen, bedoeld in onderdeel b.

      3 Indien de subsidie wordt aangevraagd voor het actualiseren van een energie-efficiëntieplan komen de kosten,
      bedoeld in het eerste lid, onderdeel b, slechts voor subsidie in aanmerking voor zover het kosten betreft, bedoeld
      in het tweede lid, onderdelen b tot en met e.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.8.3
  - number: 4.8.4
    text: |-
      De subsidie bedraagt € 4.500,– per inrichting waarvoor een energie-efficiëntieplan wordt opgesteld en € 2.500,–
      per inrichting waarvoor een energie-efficiëntieplan wordt geactualiseerd, met dien verstande dat de subsidie, in
      afwijking van [artikel 1.3][ref1], ten hoogste bedraagt:

      a. 70% van de subsidiabele kosten indien het een kleine onderneming betreft;

      b. 60% van de subsidiabele kosten inden het een middelgrote onderneming betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel1.3
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.8.4
