  - number: 4.5.2
    text: |-
      De minister verstrekt op aanvraag subsidie voor een installatie of meer installaties voor de productie van duurzame
      energie.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.5.2
  - number: 4.5.3
    text: |-
      1 Voor een aanvraag, anders dan de aanvraag van een natuurlijke persoon ten behoeve van een installatie bestemd
      voor de eigen woning, komen voor subsidie in aanmerking de bijkomende investeringskosten, bedoeld in artikel 41,
      zesde lid, van de algemene groepsvrijstellingsverordening.

      2 Voor een aanvraag van een natuurlijke persoon ten behoeve van een installatie bestemd voor de eigen woning komen
      in afwijking van [artikel 10, tweede lid, van het besluit][ref1], kosten in verband met installaties die vóór
      indiening van de aanvraag, maar na 1 januari 2016, zijn gemaakt voor subsidie in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.5.3
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '10'
  - number: 4.5.4
    text: |-
      Een ruimteverwarmingstoestel of een waterverwarmingstoestel met warmtepomp:

      a. is uitgerust met een lucht-waterwarmtepomp, een grond-waterwarmtepomp of een water-waterwarmtepomp;

      b. heeft een nominaal vermogen van ten hoogste 70 kW, en

      c. is voorzien van een etiket, een productkaart en de bijbehorende technische documentatie.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.5.4
  - number: 4.5.5
    text: |-
      Een zonneboiler, waaronder tevens begrepen een zonneboilercombi, is:

      a. een zonne-energie-installatie met een totale apertuuroppervlakte van ten hoogste 200 vierkante meter;

      b. bedoeld voor het maken van warm tapwater of voor het leveren van ruimteverwarming in combinatie met het maken
      van warm tapwater;

      c. voorzien van een productkaart en de bijbehorende technische documentatie, en

      d. in het geval van een zonneboilercombi voorzien van een etiket.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.5.5
  - number: 4.5.6
    text: |-
      1 Een pelletkachel is bestemd voor de productie van warmte en wordt automatisch gestookt op samengeperst hout in de
      vorm van pellets.

      2 Een pelletkachel als bedoeld in het eerste lid:

      a. heeft een gesloten voorkant;

      b. voldoet aan de norm EN 14785;

      c. heeft een vermogen van 5 kW tot 500 kW;

      d. heeft een minimaal warmterendement van 85% op nominaal vermogen, en

      e. voldoet aan de technische eisen met betrekking tot de uitstoot gesteld in bijlage II, onderdeel 2, van
      Verordening (EU) 2015/1185, vastgesteld door een geaccrediteerde instelling.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.5.6
  - number: 4.5.7
    text: |-
      1 Een op houtachtige biomassa gestookte ketel is bestemd voor de productie van warmte.

      2 Een op houtachtige biomassa gestookte ketel:

      a. voldoet aan de norm EN 303-5;

      b. heeft een vermogen van 5 kW tot 500 kW;

      c. kent een minimaal warmterendement van 89% op nominaal vermogen, en

      d. kent een uitstoot aan zwevende deeltjes die ten hoogste 38 mg/Nm³ in droog rookgas bij 6% zuurstof, een uitstoot
      van koolstofoxiden die ten hoogste 750 mg/Nm³ in droog rookgas bij 6% zuurstof en een uitstoot van stikstofoxiden
      die ten hoogste 300 mg/ Nm³ in droog rookgas bij 6% zuurstof bedraagt, vastgesteld door een geaccrediteerde
      instelling.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.5.7
  - number: 4.5.8
    text: |-
      1 De subsidie voor een verwarmingstoestel als bedoeld in [artikel 4.5.4][ref1] met een lucht-waterwarmtepomp
      bedraagt bij een thermisch vermogen:

      a. tot 3,5 kW: € 1.000;

      b. van 3,5 kW tot en met 10 kW: € 2.000, en

      c. van meer dan 10 kW: € 2.000 vermeerderd met € 100 voor elke kW thermisch vermogen hoger dan 10 kW.

      2 De subsidie voor een verwarmingstoestel als bedoeld in [artikel 4.5.4][ref2] met een grond-waterwarmtepomp of met
      een water-waterwarmtepomp bedraagt bij een thermisch vermogen:

      a. tot en met 10 kW: € 2.500, en

      b. van meer dan 10 kW: € 2.500 vermeerderd met € 100 voor elke kW thermisch vermogen hoger dan 10 kW.

      3 De subsidie, bedoeld in het eerste en tweede lid, wordt verhoogd met een bedrag van € 150 indien de warmtepomp
      blijkens het etiket behoort tot de energie-efficiëntieklasse A+ of met een bedrag van € 300 indien de warmtepomp
      blijkens het etiket behoort tot de energie-efficiëntieklasse A++ of hoger.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.4
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.4
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.5.8
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 4.5.4
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 4.5.4
        hoofdstuk: '4'
  - number: 4.5.9
    text: |-
      1 De subsidie voor een zonneboiler als bedoeld in artikel 4.5.5 bedraagt € 0,75 per kWh jaarlijkse zonne-
      energiebijdrage van de zonneboiler bij een apertuuroppervlakte van ten hoogste 10 vierkante meter en bedraagt
      € 0,30 per kWh jaarlijkse zonne-energiebijdrage van de zonneboiler bij een apertuuroppervlakte van meer dan 10
      vierkante meter.

      2 De jaarlijkse zonne-energiebijdrage, bedoeld in het eerste lid, wordt voor zonneboilers bij een
      apertuuroppervlakte van ten hoogste 5 vierkante meter vastgesteld op 2799 kWh minus het jaarlijks aandeel van
      niet uit zonne-energie verkregen warmte volgens de productkaart conform het capaciteitsprofiel L, en minus het
      supplementair elektriciteitsgebruik volgens de productkaart.

      3 De jaarlijkse zonne-energiebijdrage, bedoeld in het eerste lid, wordt voor zonneboilers bij een
      apertuuroppervlakte van meer dan 5 en ten hoogste 10 vierkante meter vastgesteld op 4427 kWh minus het jaarlijks
      aandeel van niet uit zonne-energie verkregen warmte volgens de productkaart conform het capaciteitsprofiel XL, en
      minus het supplementair elektriciteitsgebruik volgens de productkaart.

      4 De jaarlijkse zonne-energiebijdrage, bedoeld in het eerste lid, voor zonneboilers bij een apertuuroppervlakte van
      meer dan 10 vierkante meter bedraagt het product van 1215 kWh, het totale collectoroppervlak van alle collectoren
      volgens de productkaart, het collectorrendement volgens de productkaart, en de verliesfactor van de warmwatertank,
      bedoeld in het vijfde lid.

      5 De verliesfactor van de warmwatertank bedraagt afhankelijk van de energie-efficiëntieklasse vermeld op het etiket
      of de energie-efficiëntieklasse vastgesteld volgens de methode, bedoeld in bijlage II, onderdeel 2, van Verordening
      (EU) nr. 812/2013:

      a. bij energie-efficiëntieklasse A+: 0,95;

      b. bij energie-efficiëntieklasse A: 0,91;

      c. bij energie-efficiëntieklasse B: 0,86;

      d. bij energie-efficiëntieklasse C: 0,83, en

      e. bij energie-efficiëntieklasse D tot en met G: 0,81.

      6 In afwijking van het vijfde lid bedraagt de verliesfactor voor een warmwatertank met een volume van 2000 liter en
      meer 0,81.

      7 Indien de zonneboiler naast warm tapwater tevens ruimteverwarming produceert, wordt de subsidie voor de
      zonneboiler, bedoeld in het eerste lid, eenmalig verhoogd met een bedrag van € 150 indien de zonneboiler behoort
      tot de energie-efficiëntieklasse A+ voor ruimteverwarming vermeld op het etiket en met een bedrag van € 300 indien
      de zonneboiler behoort tot de energie-efficiëntieklasse A++ voor ruimteverwarming vermeld op het etiket of hoger.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.5.9
  - number: 4.5.10
    text: |-
      De subsidie voor een pelletkachel als bedoeld in[ artikel 4.5.6][ref1] bedraagt € 50 per kW vermogen van de kachel
      met een minimum van € 500 voor de kachel die geen warmte overdraagt aan een vloeistof en een minimum van € 1.400
      voor de kachel die tevens warmte overdraagt aan een vloeistof.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.6
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.5.10
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 4.5.6
        hoofdstuk: '4'
  - number: 4.5.11
    text: |-
      De subsidie voor een op biomassa gestookte ketel als bedoeld in [artikel 4.5.7][ref1] bedraagt bij een thermisch
      vermogen:

      a. tot en met 40 kW: € 2.500, en

      b. vanaf 40 kW: € 2.500 vermeerderd met € 110 per kW vermogen van de ketel hoger dan 40 kW.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.7
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.5.11
