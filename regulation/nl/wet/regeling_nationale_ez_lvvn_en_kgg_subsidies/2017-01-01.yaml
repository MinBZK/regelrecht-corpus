    text: |-
      1 Voor subsidies die € 125.000 of meer bedragen geldt, in afwijking van
      [artikel 38, eerste lid, van het besluit][ref1], niet de verplichting van dat artikellid, maar de verplichting van
      [artikel 38, derde lid, van het besluit][ref2].

      2 In afwijking van [artikel 50, tweede lid, onder b, van het besluit][ref3], behoeft, indien de subsidie € 125.000
      of meer bedraagt, het verzoek om subsidievaststelling niet vergezeld te gaan van een accountantsverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel50
