  - number: 2.5.1
    text: |-
      In deze titel wordt verstaan onder:

        - *landbouwinnovatie:* product, productieproces of concept bestemd voor toepassing in de primaire landbouw dat een
      vernieuwing en een verduurzaming inhoudt met als oogmerk het onderscheidend positioneren van een landbouwproduct in
      de markt;
        - *MKB-landbouwondernemer:* MKB-ondernemer die een landbouwonderneming in stand houdt;
        - *overnemer:* natuurlijke persoon of rechtspersoon die voor het eerst voor eigen rekening en risico als MKB-
      ondernemer een landbouwonderneming in stand gaat houden door van een bestaande landbouwonderneming: a. zijnde een
      eenmanszaak, een maatschap of vennootschap onder firma de meerderheidswaarde van de activa in eigendom, pacht of
      erfpacht te verwerven; b. zijnde een vennootschap met een in aandelen verdeeld kapitaal: 1°. de meerderheid van het
      geplaatste kapitaal van die vennootschap direct of indirect te verwerven, of 2°. de overwegende zeggenschap van die
      vennootschap te verkrijgen zonder op een eerder moment daarvan de enige of overwegende zeggenschap gehad te hebben;
        - *starter:* MKB-landbouwondernemer zijnde: a. een natuurlijke persoon die niet langer dan drie jaar een
      landbouwonderneming in stand houdt; b. een vennootschap met een in aandelen verdeeld kapitaal, waarvan de
      bestuurder een natuurlijke persoon is die ten tijde van het sluiten van de kredietovereenkomst direct of indirect
      de meerderheid van het geplaatst en gestort kapitaal houdt en deze meerderheid niet langer dan drie jaar houdt.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.5.1
  - number: 2.5.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een bank voor het sluiten van kredietovereenkomsten met MKB-
      landbouwondernemers die betrekking hebben op landbouwborgstellingskredieten.

      2 De subsidie wordt verstrekt in de vorm van een borgstelling voor de terugbetaling van een krediet dat de
      bank op grond van een kredietovereenkomst aan een MKB-landbouwondernemer zal verstrekken voor de duur van de
      kredietovereenkomst.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.5.2
  - number: 2.5.3
    text: |-
      1 Voor subsidie komt niet in aanmerking een bank die een landbouwkredietovereenkomst sluit met een MKB-
      landbouwondernemer:

      a. die over voldoende financiële middelen beschikt om zijn landbouwonderneming op economisch verantwoorde wijze
      te drijven;

      b. die een substantieel deel van de activiteiten van de landbouwonderneming niet in Nederland uitvoert;

      c. die een aanbieder is als bedoeld in [artikel 1, onderdeel c, van de Wet marktordening gezondheidszorg][ref1] of
      het beroep van dierenarts, notaris, advocaat of gerechtsdeurwaarder uitoefent, of

      d. die een landbouwonderneming in stand houdt waarvan de laatste jaaromzet voor 50 procent of meer is verkregen,
      of, indien de landbouwonderneming nog geen heel jaar in stand is gehouden, waarvan de omzet naar verwachting voor
      50 procent of meer zal worden verkregen, uit:

      1°. de uitoefening van het bank-, verzekerings- of beleggingsbedrijf, of het financieren van een of meer andere
      ondernemingen, of

      2°. het verwerven, vervreemden, beheren of exploiteren van onroerende zaken of het ontwikkelen van onroerende
      zaakprojecten.

      2 Geen subsidie wordt verstrekt voor activiteiten die direct verband houden met:

      a. de uitvoer naar andere lidstaten van de Europese Unie of derde landen;

      b. andere lopende uitgaven direct verband houdend met activiteiten op het gebied van uitvoer;

      c. het oprichten en exploiteren van een distributienet ten behoeve van uitvoer, of

      d. investeringen die niet in overeenstemming zijn met de wetgeving van de Europese Unie en met de nationale
      milieubeschermingswetgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel1
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.5.3
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '1'
  - number: 2.5.4
    text: |-
      1 Het tarief van de provisie, bedoeld in [artikel 32, derde lid, van het besluit][ref1] bedraagt eenmalig 3
      procent.

      2 In afwijking van het eerste lid bedraagt de provisie eenmalig 1 procent indien de overeenkomst van borgtocht een
      landbouwborgstellingskrediet betreft voor een starter of overnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel32
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.5.4
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '32'
  - number: 2.5.5
    text: |-
      1 De minister verdeelt het subsidieplafond door vaststelling van een maximum subsidiebedrag per bank die zich bij
      de minister heeft aangemeld.

      2 De minister stelt uiterlijk op 1 februari van elk kalenderjaar ambtshalve het maximum subsidiebedrag per bank
      vast waarbij hij onderscheid maakt tussen landbouwborgstellingskredieten die al dan niet betrekking hebben op
      landbouwinnovatie.

      3 De minister verdeelt het subsidieplafond voor de banken, bedoeld in het eerste lid, op volgorde van binnenkomst
      van de verleningen, bedoeld in artikel 8, tweede lid, van het model landbouwborgstellingskredietovereenkomst, zoals
      opgenomen in [bijlage 2.5.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.5.5
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 2.5.6
    text: |-
      1 Er wordt borg gestaan voor 70 procent van het kredietbedrag.

      2 Onverminderd het eerste lid, bedraagt het krediet waarvoor wordt borg gestaan:

      a. ten hoogste € 1.200.000 of

      b. ten hoogste € 2.500.000 indien het krediet strekt tot financiering van nieuwe investeringen die voor meer dan
      50% worden gedaan:

      1°. voor de bouw of verbetering van een stal voor zover uit het investeringsplan behorend bij de
      kredietovereenkomst blijkt dat de stal voldoet aan de eisen van het certificatieschema Maatlat Duurzame Veehouderij
      met een hoger niveau dan Plusstal hetgeen blijkt uit een voorlopig certificaat dat is afgegeven door een hiervoor
      door de Raad voor Accreditatie geaccrediteerde organisatie;

      2°. voor een kas die bestemd is voor het bedrijfsmatig telen van gewassen voor zover uit het investeringsplan
      behorend bij de kredietovereenkomst blijkt dat die kas voldoet aan de eisen van het certificatieschema Groen Label
      Kas, hetgeen aantoonbaar wordt gemaakt met een voorlopig certificaat dat is afgegeven door een hiervoor door de
      Raad voor Accreditatie geaccrediteerde organisatie;

      3°. voor landbouwinnovatie.

      3 Bij toepassing van het tweede lid, onderdeel b, onder 1°, wordt in de kredietovereenkomst opgenomen dat de MKB-
      landbouwondernemer na het verstrekken van het landbouwborgstellingskrediet een definitief certificaat verkrijgt
      volgens de dan vigerende Maatlat Duurzame Veehouderij.

      4 Bij toepassing van het tweede lid, onderdeel b, onder 2°, wordt in de kredietovereenkomst opgenomen dat de MKB-
      landbouwondernemer na het verstrekken van het landbouwborgstellingskrediet een definitief certificaat verkrijgt
      volgens het dan vigerende certificeringsschema Groen Label Kas.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.5.6
  - number: 2.5.7
    text: |-
      Het model voor de landbouwborgstellingsovereenkomst is opgenomen in [bijlage 2.5.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.5.7
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 2.5.8
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 2.5.2][ref1] bevat ten minste de gegevens, bedoeld in artikel
      6, tweede lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie als bedoeld in [artikel 2.5.2][ref2] ten minste:

      a. gegevens over de bank, waaronder de statutaire naam, het KvK-nummer, het post- en bezoekadres en het
      rekeningnummer;

      b. gegevens over de contactpersoon bij de bank, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. kerngegevens over de bank, waaronder de deskundigheid, het financieringsbeleid, het financieringsproces, het
      beheer en het uitwinningsbeleid van krediet.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.5.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.5.2
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.5.8
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.5.2
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 2.5.2
        hoofdstuk: '2'
  - number: 2.5.9
    text: |-
      De subsidie, bedoeld in [artikel 2.5.2][ref1], bevat staatssteun en wordt gerechtvaardigd door artikel 21 van de
      algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.5.2
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.5.9
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.5.2
        hoofdstuk: '2'
  - number: 2.5.10
    text: |-
      Deze titel en [bijlage 2.5.1][ref1] vervallen met ingang van 31 december 2019, met dien verstande dat deze van
      toepassing blijven op subsidies die voor die datum zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.5.10
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: 2.7.1
    text: |-
      In deze titel wordt verstaan onder:

        - *jacht:* jagen als bedoeld in [artikel 31, eerste lid, van de Flora- en faunawet][ref1];
        - *natuur- en landschapsbeheer:* geheel van activiteiten die zien op het behoud en de ontwikkeling van de natuur of
      het landschap, de instandhouding van de natuur of het landschap bevorderen, daaronder mede begrepen het ontwikkelen
      van nieuwe natuur of herstellen van landschapskenmerken, het opdoen van vaardigheden ten behoeve van het opzetten
      en doen functioneren van een vrijwilligersorganisatie die zich bezig houdt met natuur- en landschapsbeheer en het
      betrekken van mensen met een beperking bij natuur- en landschapsbeheer;
        - *vrijwilliger:* natuurlijk persoon die, anders dan bij wijze van beroep, onverplicht arbeid om niet verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel31
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.7.1
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '31'
  - number: 2.7.2
    text: |-
      1 De Minister kan subsidie verstrekken voor de opleiding van vrijwilligers ter bevordering van natuur- en
      landschapsbeheer.

      2 Geen subsidie wordt verstrekt, indien de activiteiten in het kader van een dergelijke opleiding:

      a. in strijd zijn met overheidsbeleid ten aanzien van natuur of landschap;

      b. verband houden met de jacht.

      3 De subsidie wordt verstrekt aan vrijwilligers.

      4 Iedere vrijwilliger kan ten hoogste één aanvraag doen.

      5 De opleiding wordt afgerond binnen een jaar nadat de subsidie is verstrekt.

      6 De subsidieontvanger stemt er mee in dat de Minister de informatie, bedoeld in [artikel 2.7.3][ref1] openbaar
      maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.7.3
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.7.2
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.7.3
        hoofdstuk: '2'
  - number: 2.7.3
    text: |-
      Bij de aanvraag wordt ten minste de volgende informatie verstrekt:

      a. een beschrijving van de opleiding, waarbij onder meer wordt ingegaan op de aanbieder van de opleiding, het doel
      van de opleiding, de wijze waarop het volgen van de opleiding leidt tot het betrekken van nieuwe mensen bij natuur-
      en landschapsbeheer, de activiteiten die zullen worden verricht in het kader van de opleiding en het beoogde
      resultaat; en

      b. een opgave van de kosten die de opleidingsactiviteiten met zich zullen brengen.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.7.3
  - number: 2.7.4
    text: |-
      Geen subsidie wordt verstrekt in een van de volgende gevallen:

      a. de aanvraag voldoet niet aan het bepaalde in deze titel;

      b. de subsidiabele kosten bedragen minder dan € 1.000,–;

      c. het is aannemelijk dat de door de aanvrager verstrekte gegevens onjuist zijn;

      d. er bestaat onvoldoende vertrouwen in het niveau van de kennis die met de opleiding wordt verkregen.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.7.4
  - number: 2.7.5
    text: |-
      In afwijking van [artikel 10, tweede lid, van het Kaderbesluit EZ-subsidies][ref1] zijn de subsidiabele kosten
      alle rechtstreeks aan de uitvoering van de opleiding toe te rekenen kosten, met uitzondering van kosten voor eigen
      arbeid van de subsidieaanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.7.5
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '10'
  - number: 2.7.6
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.7.6
  - number: 2.7.7
    text: De subsidie bedraagt per aanvraag € 1.000,–.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.7.7
  - number: 2.7.8
    text: Deze regeling bevat geen staatssteun.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.7.8
  - number: 2.7.9
    text: |-
      Deze titel vervalt met ingang van 1 oktober 2020, met dien verstande dat deze van toepassing blijven op subsidies
      die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.7.9
  - number: 2.8.1
    text: |-
      In deze titel wordt verstaan onder:

        - *voucher genotypering TSE:* voucher voor het bepalen door middel van DNA analyse van de erfelijke gevoeligheid
      voor klassieke scrapie bij schapen waarvoor niet eerder een DNA analyse voor dit doel is uitgevoerd;
        - *erkend laboratorium:* laboratorium als bedoeld in
      [artikel 2 van de Regeling erkenning en aanwijzing veterinaire laboratoria][ref1];
        - *schapenhouder:* een hobbyschapenhouder of kleine of middelgrote ondernemer als bedoeld in artikel 2, onderdeel
      2, van de groepsvrijstellingsverordening landbouw die werkzaam is in de primaire landbouwproductie en die schapen
      houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel2
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.8.1
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '2'
  - number: 2.8.2
    text: |-
      1 De minister verstrekt op aanvraag een of meerdere vouchers genotypering TSE ter waarde van € 6 aan een
      schapenhouder.

      2 Een voucher genotypering TSE is geldig voor genotyperingen TSE uitgevoerd in de periode van 1 januari 2016 tot en
      met 31 december 2016.

      3 Een voucher genotypering TSE kan worden gebruikt bij een erkend laboratorium ten behoeve van de bekostiging van
      een genotyperingstest TSE:

      a. in het kader van een erkend fokprogramma als bedoeld in
      __REF000___________________________________________________________________________________________________________
      __________, of

      b. bij vermeerderingsrammen in niet aan een fokprogramma deelnemende koppels.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel99
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.8.2
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '99'
  - number: 2.8.3
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. een schapenhouder en het erkend laboratorium voor 1 januari 2016 verplichtingen jegens elkaar zijn aangegaan met
      betrekking tot de genotyperingstest TSE;

      b. een schapenhouder een voucher genotypering TSE wil aanwenden voor een genotyperingstest waarvoor reeds door een
      bestuursorgaan of de Europese Commissie subsidie is verstrekt of dat deel uitmaakt van een project of programma
      waarvoor reeds door een bestuursorgaan of de Europese Commissie subsidie is verstrekt;

      c. een schapenhouder eerder een genotyperingstest TSE bij het betrokken dier heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.8.3
  - number: 2.8.4
    text: |-
      1 Een voucher genotypering TSE kan uitsluitend worden aangevraagd indien de minister heeft vastgesteld:

      a. in welke periode de voucher genotypering TSE kan worden aangevraagd, en

      b. hoeveel vouchers genotypering TSE beschikbaar zijn.

      2 De minister bepaalt per aanvraagperiode tot welke datum de in die aanvraagperiode verstrekte vouchers
      genotypering TSE kunnen worden ingeleverd bij een erkend laboratorium.

      3 De minister maakt een besluit als bedoeld in dit artikel bekend in de Staatscourant.

      4 De minister verdeelt de beschikbare vouchers genotypering TSE in de volgorde van ontvangst van de aanvragen.
      Indien honorering van alle aanvragen die op één dag zijn ontvangen ertoe zou leiden dat het beschikbare aantal
      vouchers genotypering TSE zou worden overschreden, stelt de minister de onderlinge rangschikking van deze aanvragen
      vast door middel van loting.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.8.4
  - number: 2.8.5
    text: |-
      De minister verstrekt op aanvraag subsidie aan een erkend laboratorium dat één of meer geldige vouchers
      genotypering TSE overlegt.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.8.5
  - number: 2.8.6
    text: De subsidie bedraagt € 6 per voucher genotypering TSE.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.8.6
  - number: 2.8.7
    text: |-
      De voucher genotypering TSE, bedoeld in [artikel 2.8.2][ref1], bevat staatssteun en wordt gerechtvaardigd door
      Steunmaatregel SA.39008 (2014/N).


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.8.2
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.8.7
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 2.8.2
        hoofdstuk: '2'
