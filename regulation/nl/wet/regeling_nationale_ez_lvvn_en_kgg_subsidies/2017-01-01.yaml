        artikel: '1.2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1.1'
  - number: 2.4.2
    text: |-
      1 Ter versterking van de onderwijsvernieuwing op het gebied van landbouw en natuurlijke omgeving, kan de minister
      subsidie aan het bevoegd gezag van een agrarische HBO-instelling verstrekken voor activiteiten die leiden tot het
      vergroten van kennisinnovatie en de daarmee samenhangende kwaliteitsverbetering van het onderwijs en de externe
      oriëntatie naar bedrijfsleven en maatschappelijke organisaties.

      2 De activiteiten, bedoeld in het eerste lid, hebben een duur van ten hoogste vier jaar en zijn gericht op:

      a. het uitvoeren van vraaggestuurd praktijkgericht onderzoek;

      b. de doorvertaling van de kennisontwikkeling in het onderwijs;

      c. het professionaliseren van docenten en kenniskringleden;

      d. een landelijke doorwerking, het versterken van de kenniscirculatie tussen onderwijs, onderzoek en praktijk via
      kenniskringen op het gebied van landbouw en natuurlijke omgeving;

      e. het op waarde schatten van elders ontwikkelde nieuwe kennis en het benutten en overdragen van deze kennis aan
      docenten, studenten en andere kenniskringleden.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.4.2
  - number: 2.4.3
    text: |-
      De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen. De minister rangschikt een
      aanvraag hoger naarmate de activiteiten waarop de aanvraag betrekking heeft:

      a. qua thema waarop het groene-plus lectoraat betrekking heeft, beter aansluiten bij de agenda’s van de
      topsectoren Agro & Food en Tuinbouw en Uitgangsmaterialen, de beleidsreactie van het kabinet op deze agenda’s en
      de beleidsagenda’s in de begroting van het Ministerie van Economische Zaken in het domein Landbouw en Natuurlijke
      omgeving;

      b. qua werkveld meer vernieuwend zijn ten opzichte van de werkvelden van bestaande lectoraten op het gebied van
      landbouw en natuurlijke omgeving;

      c. een grotere bijdrage leveren aan de doelstelling en subsidiabele activiteiten, bedoeld in [artikel 2.4.2][ref1];

      d. meer kwaliteitswinst in de groene kennisinfrastructuur opleveren, waarbij een landelijke doorwerking van
      verworven kennis beter geborgd wordt en verdergaande zwaartepuntvorming bij de HBO-instellingen passend bij het
      profiel van de instellingen verkregen wordt;

      e. een goede benutting van eerder gedane investeringen in de groene kennisinfrastructuur bewerkstelligen;

      f. beter uitvoerbaar zijn;

      g. een grotere betrokkenheid van het bedrijfsleven of maatschappelijke organisaties in de regio van de
      subsidieaanvrager bewerkstelligen;

      h. meer vertrouwen geven dat na afloop van de subsidieperiode een structurele verankering van de resultaten
      plaatsvindt binnen de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.2
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.4.3
