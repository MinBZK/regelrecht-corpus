    text: |-
      Deze titel vervalt met ingang van 1 januari 2021, met dien verstande dat deze van toepassing blijft op subsidies
      die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.8.15
  - number: 3.9.1
    text: |-
      In deze titel wordt verstaan onder:

        - *certificeringstraject:* certificering op basis van de resultaten van uitvoerige beproevingen en berekeningen;
        - *klinisch ontwikkelingsproject:* planmatig geheel van activiteiten in de fase van experimentele ontwikkeling,
      gericht op het omzetten van resultaten van industrieel onderzoek in plannen, schema’s of ontwerpen voor nieuwe,
      gewijzigde of verbeterde producten of processen, die nieuw zijn voor Nederland, en a. aan de ontwikkeling van
      welke producten en processen klinische risico’s en daarmee samenhangende financiële risico’s zijn verbonden en
      b. welke producten of processen door het goede commerciële perspectief kunnen leiden tot substantiële economische
      activiteiten van de onderneming;
        - *klinisch risico:* risico voor het welslagen van het product of proces dat voortvloeit uit de noodzaak dat het
      nieuwe product of proces een testfase in de mens doorloopt;
        - *ontwikkelingsproject:* een technisch ontwikkelingsproject of een klinisch ontwikkelingsproject;
        - *technisch ontwikkelingsproject:* een planmatig geheel van activiteiten in de fase van experimentele
      ontwikkeling, gericht op het omzetten van resultaten van industrieel onderzoek in plannen, schema’s of ontwerpen
      voor nieuwe, gewijzigde of verbeterde producten, processen of diensten, die nieuw zijn voor Nederland, en a.
      waaraan substantiële technische, maar geen klinische, risico’s en daarmee samenhangende financiële risico’s zijn
      verbonden en b. welke producten, processen of diensten door het goede commerciële perspectief kunnen leiden tot
      substantiële economische activiteiten van de onderneming;
        - *uitstaand saldo:* het totaalbedrag dat aan de subsidieontvanger is uitbetaald als subsidie in de vorm van
      krediet, verhoogd met de verschenen rente, bedoeld in [artikel 3.9.8, tweede en derde lid][ref1], en verminderd met
      de betalingen, gedaan overeenkomstig artikel 3.9.8, vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.9.8
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.9.1
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.9.8
        hoofdstuk: '3'
  - number: 3.9.2
    text: |-
      1 De minister verstrekt op aanvraag ten behoeve van de financiering van een ontwikkelingsproject subsidie aan een
      ondernemer, die een ontwikkelingsproject uitvoert. De subsidie wordt verstrekt in de vorm van krediet.

      2 In aanvulling op [artikel 3, eerste lid, van het besluit][ref1] kan ook subsidie worden verstrekt aan een
      ondernemer die gevestigd is in het openbaar lichaam Bonaire, Sint Eustatius of Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel3
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.9.2
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '3'
  - number: 3.9.3
    text: |-
      De subsidie bedraagt in de vorm van krediet aan een kleine onderneming die deel uitmaakt van een samenwerking als
      bedoeld in artikel 25 van de algemene groepsvrijstellingsverordening, 50 procent van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.9.3
  - number: 3.9.4
    text: |-
      1 Het maximum subsidiebedrag bedraagt € 10.000.000 per subsidieontvanger.

      2 Indien door een ondernemer, dan wel door ondernemers die behoren tot eenzelfde groep, meer dan één
      ontwikkelingsproject wordt uitgevoerd en daarvoor subsidieaanvragen in het kader van deze titel zijn ingediend,
      wordt in een kalenderjaar aan die ondernemer, dan wel aan die ondernemers die tot eenzelfde groep behoren
      gezamenlijk, ten hoogste het in het eerste lid genoemde bedrag aan subsidie verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.9.4
  - number: 3.9.4a
    text: |-
      Voor subsidie komen uitsluitend de kosten in aanmerking, bedoeld in artikel 25, derde lid, van de algemene
      groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.9.4a
  - number: 3.9.5
    text: De minister verdeelt de subsidieplafonds op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.9.5
  - number: 3.9.6
    text: |-
      1 De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref1] is vijf jaar.

      2 De minister kan de termijn, bedoeld in het eerste lid, op verzoek met ten hoogste twee jaar verlengen indien
      sprake is van een technisch ontwikkelingsproject met een certificeringstraject.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.9.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.9.7
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien:

      a. hij de subsidiabele kosten raamt op minder dan € 150.000;

      b. onvoldoende vertrouwen bestaat dat de subsidieontvanger het ontwikkelingsproject en de daarop volgende fase van
      commercialisatie kan financieren;

      c. onvoldoende vertrouwen bestaat dat de subsidieontvanger een ontwikkelingsproject zowel in technische als in
      economische zin tot een succes zal kunnen maken;

      d. onvoldoende vertrouwen bestaat dat de subsidieontvanger de subsidie terug kan betalen binnen de in
      [artikel 3.9.8, vierde lid][ref1], genoemde periode;

      e. van het ontwikkelingsproject onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten zijn.

      2 De afwijzingsgrond, genoemd in [artikel 23, onderdeel a, van het besluit][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.9.8
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.9.7
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.9.8
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.9.8
    text: |-
      1 De subsidieontvanger is verplicht de verstrekte subsidie volgens een in de beschikking tot subsidieverlening
      vastgelegd schema terug te betalen aan de minister.

      2 De subsidieontvanger is verplicht over het uitstaande saldo aan de minister jaarlijks een bij de beschikking
      tot subsidieverlening, overeenkomstig [artikel 3.9.9][ref1], bepaald rentepercentage te betalen, dat op een
      ontwikkelingsproject van toepassing blijft tot aan de betalingsverplichtingen geheel is voldaan.

      3 De rente wordt aan het eind van elk kalenderjaar rentedragend bij het uitstaande saldo bijgeschreven.

      4 De subsidieontvanger is verplicht het uitstaande saldo binnen 10 jaar na vaststelling van de subsidie aan de
      minister te betalen.

      5 De termijn genoemd in het vierde lid kan naar aanleiding van een ontheffingsverzoek als bedoeld in
      [artikel 42, vijfde lid, van het besluit][ref2] worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.9.9
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel42
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.9.8
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.9.9
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '42'
  - number: 3.9.9
    text: |-
      1 Het rentepercentage, bedoeld in [artikel 3.9.8, tweede lid][ref1], is opgebouwd uit:

      a. het basispercentage en de opslag voor technische ontwikkelingsprojecten onderscheidenlijk voor klinische
      ontwikkelingsprojecten, of

      b. het op grond van onderdeel a vastgestelde percentage vermeerderd met de opslag voor het risico dat de
      ontvanger niet in staat is om de subsidie terug te betalen bij uitblijven van commercieel succes van het
      ontwikkelingsproject.

      2 De percentages, bedoeld in het eerste lid, worden jaarlijks bij ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.9.8
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.9.9
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.9.8
        hoofdstuk: '3'
  - number: 3.9.10
    text: |-
      De minister kan besluiten dat de verstrekte subsidie in de vorm van krediet versneld of in een keer terugbetaald
      wordt, indien:

      a. de aandelen van de subsidieontvanger worden vervreemd;

      b. de resultaten van het project geheel of gedeeltelijk worden vervreemd.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.9.10
  - number: 3.9.11
    text: |-
      1 Indien ontheffing is verleend op basis van [artikel 37, derde lid, van het besluit][ref1], kan de minister
      op aanvraag van de subsidieontvanger het bedrag van een eerder voor een ontwikkelingsproject verleende subsidie
      verhogen tot maximaal het bedrag dat voor dat ontwikkelingsproject kan worden verkregen.

      2 De aanvraag, bedoeld in het eerste lid, wordt volgens eenzelfde procedure en volgens dezelfde criteria behandeld
      als een eerste aanvraag om subsidie voor een ontwikkelingsproject.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel37
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.9.11
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '37'
  - number: 3.9.12
    text: |-
      1 De subsidieontvanger verleent medewerking aan evaluatie van de effecten van het door hem uitgevoerde
      ontwikkelingsproject, voor zover deze medewerking redelijkerwijs van hem verlangd kan worden.

      2 De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.9.12
  - number: 3.9.13
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 3.9.2][ref1] bevat ten minste de gegevens, bedoeld in artikel
      6, tweede lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie als bedoeld in [artikel 3.9.2][ref2] ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het KvK-nummer, het post- en bezoekadres en
      het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. de gegevens over het plan, waaronder de activiteit waarvoor subsidie wordt aangevraagd, de start- en einddatum,
      de totale kosten en de omvang van de gevraagde subsidie;

      d. een businessplan, een projectplan en een financieel plan;

      e. de meest recente jaarrekening en openingsbalans.

      3 De aanvraag voor de vaststelling van een subsidie als bedoeld in [artikel 3.9.2][ref3] bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de aanvrager en het door de minister verstrekte
      referentienummer;

      b. de omvang van de vast te stellen subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.9.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.9.2
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.9.2
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.9.13
