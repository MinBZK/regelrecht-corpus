  - number: 3.5.4
    text: De subsidie bedraagt 50 procent van de subsidiabele kosten, met een maximum van € 30.000.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.5.4
  - number: 3.5.5
    text: |-
      In afwijking van [artikel 11 van het besluit][ref1] komen uitsluitend voor subsidie in aanmerking het aantal uren
      gemaakt door personeel van de IPC-penvoerder danwel door derden, waaronder begrepen overige organisaties waarmee de
      verkenning wordt uitgevoerd, vermenigvuldigd met een vast uurtarief van € 87,50.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel11
