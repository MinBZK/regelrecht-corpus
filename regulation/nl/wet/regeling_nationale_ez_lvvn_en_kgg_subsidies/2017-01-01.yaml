        artikel: 3.7.2
        hoofdstuk: '3'
  - number: 3.7.12
    text: |-
      Deze titel vervalt met ingang van 1 januari 2021, met dien verstande dat deze van toepassing blijft op subsidies
      die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.7.12
  - number: 3.8.1
    text: |-
      In deze titel wordt verstaan onder:

        - *PENTA-innovatieproject:* innovatieproject dat wordt uitgevoerd door een internationaal
      innovatiesamenwerkingsverband en is voorzien van een label van het EUREKA cluster PENTA;
        - *EUREKA-innovatieproject:* innovatieproject dat wordt uitgevoerd door een internationaal
      innovatiesamenwerkingsverband en is voorzien van een EUREKA-label;
        - *internationaal innovatiesamenwerkingsverband:* samenwerkingsverband waarbij ten minste één van de partijen een
      in Nederland gevestigde ondernemer is en ten minste één van de partijen een ondernemer of onderzoeksorganisatie is
      die is gevestigd in een land dat deelneemt aan het EUREKA-programma;
        - *ITEA3-innovatieproject:* innovatieproject dat wordt uitgevoerd door een internationaal
      innovatiesamenwerkingsverband en is voorzien van een label van het EUREKA cluster ITEA3;
        - *PENTA-innovatieproject:* innovatieproject dat wordt uitgevoerd door een internationaal
      innovatiesamenwerkingsverband en is voorzien van een label van het EUREKA cluster PENTA.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.8.1
  - number: 3.8.2
    text: |-
      De minister verstrekt op aanvraag subsidie aan een deelnemer in een internationaal innovatiesamenwerkingsverband
      dat een PENTA-innovatieproject, een EUREKA-innovatieproject of een ITEA3-innovatieproject uitvoert.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.8.2
  - number: 3.8.3
    text: De penvoerder is een ondernemer.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.8.3
  - number: 3.8.4
    text: |-
      1 De subsidie bedraagt:

      a. 50 procent van de subsidiabele kosten van een innovatieproject voor zover deze betrekking hebben op industrieel
      onderzoek;

      b. 35 procent van de subsidiabele kosten van een innovatieproject voor zover deze betrekking hebben op industrieel
      onderzoek en worden gemaakt door een ondernemer;

      c. 25 procent van de subsidiabele kosten van een innovatieproject voor zover deze betrekking hebben op
      experimentele ontwikkeling.

      2 De percentages, genoemd in het eerste lid, onder b en c, worden verhoogd met 10 procentpunten indien subsidie
      wordt verstrekt aan een MKB-ondernemer.

      3 Indien het totale subsidiebedrag voor de deelnemers van een internationaal innovatiesamenwerkingsverband dat een
      EUREKA-innovatieproject uitvoert meer bedraagt dan € 750.000, wordt het meerdere naar rato in mindering gebracht op
      de aan de betrokken aanvragers te verstrekken subsidie.

      4 Indien het totale subsidiebedrag voor de deelnemers in een internationaal samenwerkingsverband dat een PENTA-
      innovatieproject of een ITEA3-innovatieproject uitvoert, meer bedraagt dan € 4.000.000, wordt het meerdere naar
      rato in mindering gebracht op de aan de betrokken aanvragers te verstrekken subsidie.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.8.4
  - number: 3.8.4a
    text: |-
      Voor subsidie komen uitsluitend de kosten in aanmerking, bedoeld in artikel 25, derde lid, van de algemene
      groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.8.4a
  - number: 3.8.5
    text: |-
      Geen subsidie wordt verstrekt indien de aanvrager vóór indiening van de aanvraag om subsidie, bedoeld in
      [artikel 3.8.2][ref1], reeds gestart is met zijn deel van het PENTA-innovatieproject, het EUREKA-innovatieproject
      of het ITEA3-innovatieproject.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.8.2
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.8.5
    references:
