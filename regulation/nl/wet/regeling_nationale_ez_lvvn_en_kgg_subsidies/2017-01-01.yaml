  - number: 4.4.9
    text: |-
      Op een subsidie voor de indirecte emissiekosten ETS zijn de [artikelen 37 tot en met 42 van het besluit][ref1] niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel37
