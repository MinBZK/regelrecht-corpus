  - number: 3.14.1
    text: |-
      1 In deze titel wordt verstaan onder:

        - *bankgarantie:* verplichting van een financier om aan een begunstigde, ten laste van een ondernemer, te
      behoeve van eigen activiteiten van die ondernemer, een bedrag te betalen, indien de begunstigde aanspraak maakt,
      uitgezonderd kredietgaranties;
        - *bankgarantiefaciliteit:* bedrag waarvoor een financier aan een begunstigde ten laste van een ondernemer
      bankgaranties kan afnemen die onder de garantstelling van de staat kunnen vallen;
        - *waarde van een bankgarantie:* hoogte van het bedrag waarop maximaal aanspraak kan worden gemaakt onder een
      afgegeven bankgarantie.

      2 Voor de toepassing van deze titel wordt als financier aangewezen:

      a. een bank;

      b. een schadeverzekeraar als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel11
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.14.1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 1:1
  - number: 3.14.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een financier voor het afgeven van een bankgarantie.

      2 De subsidie wordt verstrekt in de vorm van een garantstelling aan een financier voor de terugbetaling van een
      vordering die een financier op een ondernemer krijgt uit hoofde van een betaling onder een bankgarantie die een
      financier op grond van een overeenkomst ten laste van een ondernemer heeft afgegeven voor de duur van minimaal zes
      maanden en maximaal 8 jaar.

      3 In afwijking van het tweede lid kan, indien een bankgarantie geen vaste looptijd heeft en het inroepen daarvan
      afhankelijk is van het zich voordoen van een bepaalde gebeurtenis, een financier een bankgarantie onder de
      garantstelling brengen onder de voorwaarde dat de gebeurtenis bij het aangaan van de bankgarantie zich naar
      verwachting niet meer dan 7 jaar na het afsluiten van de bankgarantiefaciliteit voordoet en dat de begunstigde een
      provincie, gemeente, openbaar lichaam als bedoeld in de [Wet gemeenschappelijke regelingen][ref1] of een dienst,
      instelling of bedrijf van de rijksoverheid is.

      4 De garantstelling heeft slechts betrekking op bankgaranties die worden afgegeven nadat de minister desgevraagd
      een bankgarantiefaciliteit heeft goedgekeurd en voor zover deze faciliteit toereikend en geldig is.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.14.2
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: 3.14.3
    text: |-
      1 De financier verstrekt geen bankgarantiefaciliteit aan een ondernemer wiens activiteiten in overwegende mate
      betrekking hebben op:

      a. landbouw, visserij en aquacultuur, met uitzondering van toelevering en dienstverlening;

      b. onroerend goed voor zover de activiteiten gericht zijn op het behalen van resultaten door waardestijging van
      onroerend goed zonder dat er sprake is van significante waardetoevoeging door eigen productieve activiteiten;

      c. de financiële sector voor zover de ondernemer het bank-, verzekerings- of beleggingsbedrijf uitoefent, of een
      participatiemaatschappij heeft;

      d. de gezondheidszorg, voor zover de onderneming een aanbieder is als bedoeld in
      [artikel 1, onderdeel c, van de Wet marktordening gezondheidszorg][ref1].

      2 De financier verstrekt geen bankgarantiefaciliteit aan een instelling als bedoeld in
      [artikel 70 van de Woningwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel70
