  - number: 4a.1.1
    text: |-
      In deze titel wordt verstaan onder:

        - *eindgebruiker:* natuurlijke persoon of rechtspersoon die van een openbare elektronische communicatiedienst
      gebruik maakt of wil gaan maken en die niet tevens openbare elektronische communicatienetwerken of openbare
      elektronische communicatiediensten aanbiedt;
        - *telecommunicatie:* iedere overdracht, uitzending of ontvangst van gegevens van welke aard ook door middel van
      kabels, langs radio-elektrische weg of door middel van optische of andere elektromagnetische systemen;
        - *telecommunicatie-infrastructuur:* een stelsel van inrichtingen met daarbij behorende middelen, bestemd voor
      telecommunicatie die, geheel of gedeeltelijk, openbare gronden overschrijdt, welk stelsel is begrensd door daartoe
      behorende aansluitpunten en met inbegrip van de aansluitingen op telecommunicatie-inrichtingen buitenslands.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4a.1.1
  - number: 4a.1.2
    text: |-
      De minister kan op aanvraag subsidie verstrekken aan een onderneming of een samenwerkingsverband van ondernemingen
      voor een project dat ten goede komt aan de eindgebruikers in de openbare lichamen Bonaire, Sint-Eustatius of Saba
      en gericht is op het:

      a. opwaarderen van een mobiel telecommunicatienetwerk naar een hogere technologische standaard;

      b. verbeteren van de capaciteit van de telecommunicatie-infrastructuur;

      c. verbeteren van robuustheid of redundantie van onderdelen van de telecommunicatie-infrastructuur om uitval te
      voorkomen;

      d. realiseren van telecommunicatievoorzieningen ten behoeve van voorzieningen in het algemeen belang, waaronder in
      ieder geval gezondheidszorg en onderwijs.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4a.1.2
  - number: 4a.1.3
    text: |-
      De volgende kosten komen in aanmerking voor subsidie:

      a. de kosten voor bouw, verwerving, inrichting of verbetering van onroerende zaken die noodzakelijk zijn voor de
      uitvoering van het project, bedoeld in [artikel 4a.1.2][ref1] en de instandhouding daarvan;

      b. de kosten voor de aanschaf van apparatuur die noodzakelijk is voor de uitvoering van het project, bedoeld in
      [artikel 4a.1.2][ref2] en de aanleg daarvan;

      c. loonkosten van het personeel van de subsidieontvanger dat betrokken is bij de activiteiten, bedoeld in de
      onderdelen a en b.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4a.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel4a.1.2
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4a.1.3
    references:
