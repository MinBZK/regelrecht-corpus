  - number: 3.5.6
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.5.6
  - number: 3.5.7
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. de IPC-penvoerder niet aannemelijk maakt dat er een aanzienlijke kans is dat de subsidiabele activiteiten zullen
      leiden tot het tot stand komen van een IPC-verband, waarvan de deelnemers overeenkomstig paragraaf 4 van deze titel
      voor subsidie in aanmerking komen en de IPC-penvoerder niet het vertrouwen geeft in staat te zijn om de daarbij
      benodigde inzet te leveren;

      b. van de activiteiten onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten zijn;

      c. in dezelfde indieningsperiode reeds subsidie is aangevraagd op grond van deze titel voor dezelfde activiteiten
      door een andere organisatie als bedoeld in [artikel 3.5.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.5.3
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.5.7
