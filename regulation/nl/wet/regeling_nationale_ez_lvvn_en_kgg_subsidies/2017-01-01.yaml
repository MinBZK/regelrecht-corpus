  - number: 4.8.7
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien de aanvrager ten aanzien van de inrichting waarvoor een
      energie-efficiëntieplan wordt opgesteld of geactualiseerd:

      a. niet is toegetreden tot de MJA3 of wel is toegetreden tot de MJA3 maar niet actief is in de sectoren, bedoeld
      in [bijlage 4.8.1.][ref1];

      b. ingevolge
      __REF000___________________________________________________________________________________________________________
      _____ verplicht is een energie-audit uit te voeren, of ingevolge [artikel 3 van deze regeling][ref3] van deze
      verplichting is vrijgesteld;

      c. over het kalenderjaar voorafgaand aan het jaar waarin subsidie als bedoeld in
      [artikel 4.8.2.][ref4] wordt aangevraagd een verzoek tot teruggaaf heeft gedaan van de belasting
      met betrekking tot elektriciteit die geleverd is ten behoeve van zakelijk verbruik, bedoeld in
      [artikel 66, eerste lid, van de Wet belastingen op milieugrondslag][ref5];

      d. eerder op grond van deze titel voor het opstellen of actualiseren van een energie-efficiëntieplan subsidie heeft
      ontvangen.

      2 De minister beslist afwijzend op een aanvraag indien de inrichting waarvoor een energie-efficiëntieplan wordt
      opgesteld of geactualiseerd:

      a. geen kleine of middelgrote onderneming is of daarvan geen onderdeel uitmaakt;

      b. onderdeel uitmaakt van een onderneming, bestaande uit meerdere inrichtingen waarvoor gebruik wordt gemaakt
      van de concernaanpak, bedoeld in hoofdstuk 5 van de bijlage bij de MJA3 en ten aanzien van de betreffende
      inrichting het energieverbruik in het kalenderjaar voorafgaand aan het jaar van de aanvraag minder dan 50.000 kWh
      elektriciteit en 25.000 m3 aardgas bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
