  - number: 3.2.13
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 3.2.2][ref1] bevat ten minste de gegevens, bedoeld in artikel
      6, tweede lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie als bedoeld in [artikel 3.2.2][ref2] ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het KvK-nummer, het post- en bezoekadres en
      het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. gegevens over de grondslag, waaronder de topsector waarop de aanvraag ziet, het type TKI-toeslag, het jaar
      waarover TKI-toeslag wordt aangevraagd, de omvang van de private bijdrage voor samenwerkingsprojecten, de omvang
      van de private bijdrage voor TKI-relevante onderzoeksopdrachten, de hoeveelheid TKI-toeslag die wordt aangevraagd
      alsmede de projectgegevens van eventuele project-toeslag die wordt aangevraagd;

      d. in geval van programmatoeslag, een overzicht van de gerealiseerde private bijdragen in het kalenderjaar,
      voorafgaand aan het kalenderjaar waarop de aanvraag betrekking heeft;

      e. Het overzicht, bedoeld in onderdeel d, bevat voor iedere private bijdrage ten minste:

      i. de naam van het samenwerkingsproject of de TKI-relevante onderzoeksopdracht zoals dat in de
      samenwerkingsovereenkomst staat;

      ii. de naam van de deelnemer van wie de private bijdrage afkomstig is;

      iii. de naam van de onderzoeksorganisatie waaraan de private bijdrage verschuldigd is of is geworden;

      iv. het KvK-nummer van de deelnemer en onderzoeksorganisatie of, voor zover zij hier niet over beschikken, een
      ander uniek identificeren nummer;

      v. de hoogte van de private bijdrage in euro;

      f. een overzicht van de begrote inzet TKI-toeslag;

      g. in geval van projecttoeslag, een afschrift van de door alle partijen getekende samenwerkingsovereenkomst met
      daarin de verschuldigde private bijdragen, en een projectplan.

      3 De aanvraag voor de vaststelling van een subsidie als bedoeld in [artikel 3.2.2][ref3] bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de aanvrager en het door de minister verstrekte
      referentienummer;

      b. gegevens over de grondslag, waaronder de topsector waarop de vaststelling ziet, het jaar waarop de vaststelling
      van de TKI-toeslag betrekking heeft, de totale aangewende private bijdrage voor samenwerkingsprojecten, de totale
      aangewende private bijdrage voor onderzoeksopdrachten en de omvang van de TKI-toeslag die voor vaststelling in
      aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.2
