  - number: 3.12.14
    text: |-
      De subsidie, bedoeld in [artikel 3.12.2][ref1] bevat geen staatssteun.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.12.2
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.12.14
