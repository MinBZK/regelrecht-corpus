      Deze titel en de [bijlagen 3.16.1][ref1], [3.16.2][ref2] en [3.16.3][ref3] vervallen met ingang van 1 juli 2019,
      met dien verstande dat deze van toepassing blijven op subsidies die voor die datum zijn verleend.


