    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.8.8
  - number: 2.9.1
    text: |-
      In deze titel wordt verstaan onder:

        - *pluimveehouder:* ondernemer die werkzaam is in de primaire landbouwproductie en die fok- of
      vermeerderingspluimvee voor de consumptie-ei-sector dan wel leghennen houdt, dan wel pluimvee dat daarvoor wordt
      opgefokt;
        - *gevaccineerd pluimvee:* met toegelaten vaccin gevaccineerd fokpluimvee, vermeerderingspluimvee voor de
      consumptie-ei-sector, gevaccineerde leghennen of pluimvee dat daarvoor wordt opgefokt;
        - *toegelaten vaccin:* vaccin dat op grond van de [Wet dieren][ref1] is toegelaten voor gebruik bij fokpluimvee,
      vermeerderingspluimvee voor de consumptie-ei-sector of leghennen ter voorkoming van een besmetting met Salmonella
      enteritidis of Salmonella typhimurium;
        - *vaccinatie:* toediening van een toegelaten vaccin bij fokpluimvee, vermeerderingspluimvee voor de consumptie-
      ei-sector, leghennen of pluimvee dat daarvoor wordt opgefokt overeenkomstig de voorwaarden die daaraan bij de
      registratie van het betreffende vaccin zijn verbonden;
        - *vaccindoses:* standaardhoeveelheid van een toegelaten vaccin per dier.


      [ref1]: https://wetten.overheid.nl/BWBR0030250
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.9.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
  - number: 2.9.2
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een pluimveehouder voor de aankoop van tegen Salmonella
      enteritidis of Salmonella typhimurium gevaccineerd pluimvee.

      2 Het in het eerste lid bedoelde gevaccineerd pluimvee dient te zijn geregistreerd in een op grond van
      [artikel 38hh van de Regeling identificatie en registratie dieren][ref1] aangewezen databank voor identificatie en
      registratie van pluimvee.

      3 Aan de pluimveehouder wordt slechts subsidie verstrekt indien de aankoop van gevaccineerd pluimvee is
      gefactureerd in de periode van 1 januari 2016 tot en met 31 december 2016.

      4 In afwijking van het tweede lid komt voor subsidie in aanmerking gevaccineerd pluimvee dat vóór 1 januari 2016 is
      aangeschaft en op of na 1 januari 2016 is geleverd aan een pluimveehouder.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38hh
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.9.2
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38hh
  - number: 2.9.3
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.9.3
  - number: 2.9.4
    text: |-
      De aanvraag tot subsidievaststelling gaat vergezeld van:

      a. nota’s en betaalbewijzen van de aanschaf van gevaccineerd pluimvee;

      b. een bewijs waarmee wordt aangetoond dat het gevaccineerd pluimvee geregistreerd is in een op grond van
      [artikel 38hh van de Regeling identificatie en registratie dieren][ref1] aangewezen databank voor identificatie en
      registratie van pluimvee;

      c. een bewijs waarmee wordt aangetoond dat vaccinatie overeenkomstig de toelatingsvoorwaarden van het betreffende
      vaccin is uitgevoerd, alsmede het aantal vaccindoses dat is toegediend;

      d. indien de vaccinatie van het pluimvee in een andere lidstaat van de Europese Unie dan Nederland is uitgevoerd,
      tevens een schriftelijk bewijs dat in de betreffende lidstaat voor het jaar 2016 geen subsidie voor de aankoop van
      vaccins ten behoeve van het betreffende pluimvee is of wordt aangevraagd dan wel is of wordt toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38hh
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.9.4
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38hh
  - number: 2.9.5
    text: |-
      1 Voor subsidie komen in aanmerking kosten voor de aankoop van tegen Salmonella enteritidis of Salmonella
      typhimurium gevaccineerd pluimvee.

      2 Niet verrekenbare BTW komt niet in aanmerking voor subsidie.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.9.5
  - number: 2.9.6
    text: De subsidie bedraagt ten hoogste € 0,10 per vaccindosis.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.9.6
  - number: 2.9.7
    text: |-
      De subsidie, bedoeld in [artikel 2.9.2][ref1], bevat staatssteun en wordt gerechtvaardigd door Steunmaatregel
      SA.39008 (2014/N).


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.9.2
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.9.7
    references:
