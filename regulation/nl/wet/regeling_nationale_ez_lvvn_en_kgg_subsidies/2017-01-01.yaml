        artikel: 4a.1.2
        hoofdstuk: 4a
  - number: 4a.1.4
    text: De subsidie bedraagt 50% van de subsidiabele kosten tot een maximum van € 300.000,– per project.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4a.1.4
  - number: 4a.1.5
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4a.1.5
  - number: 4a.1.6
    text: |-
      1 Met de uitvoering van de op grond van deze titel gesubsidieerde activiteiten wordt gestart binnen drie maanden na
      de datum van subsidieverlening.

      2 De activiteiten, bedoeld in [artikel 4a.1.2][ref1], vinden plaats binnen twaalf maanden na aanvang van deze
      activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4a.1.2
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4a.1.6
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 4a.1.2
        hoofdstuk: 4a
  - number: 4a.1.7
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien:

      a. het project na afloop van de termijn, bedoeld in [artikel 4a.1.6, tweede lid][ref1], niet zelfstandig kan
      functioneren;

      b. aan de aanvrager geen concessie is verleend als bedoeld in
      [artikel 2, eerste lid, van de Wet telecommunicatievoorzieningen BES][ref2];

      c. de aanvrager niet heeft voldaan aan het bij of krachtens [artikel 7, vijfde lid][ref3] of
      [artikel 31, eerste lid, van de Wet telecommunicatievoorzieningen BES][ref4] bepaalde;

      d. het project waarvoor subsidie wordt aangevraagd niet voldoende bijdraagt aan realisatie van de doelen, genoemd
      in [artikel 4a.1.2][ref5];

      e. de kwaliteit van het projectplan onvoldoende is;

      f. de aanvrager op het moment van indiening van de aanvraag in staat is het project zonder subsidie rendabel te
      maken;

      g. de aanvrager eerder op grond van deze titel subsidie heeft ontvangen.

      2 De minister kan afwijzend beslissen op een aanvraag indien de aanvrager niet voldoet aan de bij of krachtens de
      [Wet telecommunicatievoorzieningen BES][ref6] gestelde voorschriften, anders dan bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4a.1.6
