  - number: 3.12.8
    text: |-
      De minister verdeelt het subsidieplafond voor het toekennen van reserveringsquota op volgorde van binnenkomst van
      de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.12.8
  - number: 3.12.9
    text: |-
      De minister beslist afwijzend op een aanvraag om een reserveringsquotum indien:

      a. de financier geen garantstellingsovereenkomst met de Staat heeft gesloten of geen aanvraag voor het sluiten van
      een garantstellingsovereenkomst heeft ingediend;

      b. de aanvrager eerder tekort is geschoten bij de naleving van verplichtingen op grond van de
      garantstellingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.12.9
  - number: 3.12.10
    text: |-
      1 De financier is voor het verkrijgen van een reserveringsquotum een eenmalige provisie van 1 procent van dit
      quotum verschuldigd.

      2 Het tarief van de provisie, bedoeld in [artikel 32, derde lid, van het besluit][ref1], wordt voor de garantie op
      het verstrekte risicokapitaal vastgesteld op:

      a. 2,5 procent per jaar van de gegarandeerde waarde van dit risicokapitaal indien de kapitaalverstrekking bestaat
      uit een niet converteerbare achtergestelde lening zonder dat deze gepaard gaat met een kapitaalverstrekking aan
      dezelfde ondernemer door de financier of door een andere financier die deel uitmaakt van dezelfde groep in de vorm
      van een converteerbare achtergestelde lening of aandelenkapitaal;

      b. 3 procent van de gegarandeerde waarde van dit risicokapitaal, die per kwartaal wordt berekend, in andere
      gevallen.

      3 De minister kan in plaats van het tarief van de provisie, genoemd in het tweede lid, een vergoeding vaststellen,
      indien het tarief van de provisie te laag is in relatie tot het risico dat de Staat loopt.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel32
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.12.10
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '32'
  - number: 3.12.11
    text: |-
      Op gemeenschappelijk verzoek van een financier die beschikt over een reserveringsquotum en van een andere financier
      die een garantstellingsovereenkomst met de staat heeft, kan dit quotum geheel of gedeeltelijk voor de resterende
      periode worden overdragen aan de laatstgenoemde financier.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.12.11
  - number: 3.12.12
    text: |-
      Jaarlijks vindt een evaluatie van de toepassing van deze titel plaats, onder meer ter beoordeling of de inkomsten
      en de uitgaven ingevolge garantstellingen op grond van deze regeling met elkaar in evenwicht zijn.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.12.12
  - number: 3.12.13
    text: |-
      1 Een aanvraag om een garantstellingovereenkomst als bedoeld in [artikel 3.12.7][ref1], bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het KvK-nummer, het post- en bezoekadres en
      het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. kerngegevens over de organisatie, waaronder de funding, de deskundigheid, het financieringsbeleid, het
      financieringsproces, het beheer en het uitwinningsbeleid van risicokapitaal.

      2 Een aanvraag om een reserveringsquotum als bedoeld in [artikel 3.12.8][ref2], bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het KvK-nummer, het post- en bezoekadres;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. het bedrag van het gevraagde reserveringsquotum.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.12.7
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.12.8
