  - number: 4a.1.9
    text: |-
      Voor subsidies die € 125.000 of meer bedragen geldt, in afwijking van
      [artikel 38, eerste lid, van het besluit][ref1], niet de verplichting van dat artikellid, maar de verplichting van
      artikel 38, derde lid, van het besluit.


