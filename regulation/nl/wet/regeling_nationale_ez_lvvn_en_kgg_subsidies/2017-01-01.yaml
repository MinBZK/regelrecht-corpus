  - number: 3.15.5
    text: |-
      1 De financier dient de aanvraag om een garantstelling in binnen zeven werkdagen na het sluiten van de
      kredietovereenkomst.

      2 De minister stuurt de financier binnen vijf werkdagen een bevestiging van ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.15.5
  - number: 3.15.6
    text: |-
      De minister beslist afwijzend op een aanvraag om subsidie indien:

      a. ten laste van de Staat een garantstelling, borgstelling, verzekering of herverzekering voor een
      kredietovereenkomst voor de bouw van hetzelfde schip is afgegeven;

      b. de contractprijs minder dan € 3.000.000 bedraagt;

      c. onvoldoende vertrouwen bestaat in de technische en economische haalbaarheid van de bouw van het schip;

      d. het kredietbedrag meer dan 80 procent van de contractprijs betreft;

      e. de kredietovereenkomst ten aanzien van het kredietbedrag een looptijd heeft van meer dan 48 maanden of de
      looptijd van de kredietovereenkomst langer is dan de termijn voor de bouw en technische-/financiële oplevering van
      het schip;

      f. de financier op het moment van het verstrekken van het kredietbedrag waarvoor de Staat garant staat een lopende
      financieringsfaciliteit verlaagt;

      g. de financier onvoldoende naar normaal bankgebruik te vestigen zekerheden heeft gevestigd of zal vestigen bij de
      verstrekking van het kredietbedrag aan de scheepswerf;

      h. door de verlening van de garantstelling het totaal van de op grond van deze titel verleende garantstellingen ten
      behoeve van de scheepswerf of van de groep, waartoe deze scheepswerf behoort, meer zou bedragen dan 30 procent van
      het subsidieplafond;

      i. gegronde vrees bestaat dat de scheepswerf zich in financiële moeilijkheden bevindt;

      j. de rentabiliteits- en continuïteitsperspectieven van de scheepswerf onvoldoende bevredigend zijn;

      k. onvoldoende vertrouwen bestaat dat de scheepswerf de capaciteiten heeft om de bouw van het schip naar behoren
      uit te voeren;

      l. uit het contract tussen de opdrachtgever en de scheepswerf die de opdracht zal uitvoeren niet blijkt dat
      de opdrachtgever, ter zake van de opdracht waarvoor de scheepswerf een kredietovereenkomst heeft afgesloten,
      voorafgaand aan een uitbetaling van het krediet op grond van de kredietovereenkomst, een of meer aanbetalingen doet
      ter hoogte van ten minste 5 procent van de contractprijs;

      m. uit het contract tussen de opdrachtgever en de scheepswerf die de opdracht zal uitvoeren niet blijkt dat de
      aanbetaling door de opdrachtgever, ter zake van de opdracht waarvoor de scheepswerf een kredietovereenkomst heeft
      afgesloten, oploopt tot ten minste 20 procent van de contractprijs tot aflevering van het schip;

      n. van de bouw van het schip onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten zijn.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.15.6
