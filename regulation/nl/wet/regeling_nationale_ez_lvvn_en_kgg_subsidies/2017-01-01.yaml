  - number: 2.3.2
    text: |-
      1 De minister verstrekt aan een glastuinbouwonderneming op aanvraag subsidie voor de hierna opgesomde apparatuur,
      installaties of machines:

      a. een tweede energiescherm;

      b. verticale ventilatoren;

      c. meerinvesteringen diffuus glas met antireflectiecoating;

      d. de aansluiting op een warmtenetwerk of -cluster;

      e. de aansluiting op een biogas- of kooldioxide-netwerk of -cluster;

      f. een ketel of kachel gestookt op biomassa of uit biomassa verkregen gasvormige of vloeibare energiedragers voor
      het verwarmen van gebouwen of processen;

      g. luchtbehandelingssysteem met frequentiegeregelde ventilatoren en luchtdistributie of luchtdistributieslurven:

      1°. waarmee buitenlucht via warmtewisseling verwarmd of voorverwarmd in de kas gebracht wordt, en

      2°. die de kaslucht op een energiezuinige manier ontvochtigen, bij het gebruik van energieschermen.

      2 Geen subsidie wordt verstrekt voor:

      a. gevelschermen, (teeltkundig vereiste) verduisteringsschermen of wettelijk verplichte lichtafschermingsschermen;

      b. een tweede energiescherm, indien het totale energieverbruik van de onderneming meer dan 20 kubieke meter
      aardgasequivalenten per vierkante meter kasoppervlak bedraagt;

      c. diffuus glas met antireflectiecoating, indien de lichtdoorlatendheid van het glas lager is dan 80% hemisferische
      PAR transmissie of waarbij de loodrechte PAR transmissie lager is dan 90% of de hazefactor lager is dan 25%;

      d. een ketel of kachel als bedoeld in het eerste lid, onderdeel f, indien het warmterendement lager is dan 80%;

      e. vervangingsinvesteringen;

      f. investeringen in installaties die vooral tot doel hebben elektriciteit op te wekken uit biomassa;

      g. investeringen met het oog op de productie, op het landbouwbedrijf, van biobrandstoffen in de zin van Richtlijn
      2009/28/EG van het Europees Parlement en de Raad van 23 april 2009 ter bevordering van het gebruik van energie uit
      hernieuwbare bronnen en houdende wijziging en intrekking van Richtlijn 2001/77/EG en Richtlijn 2003/30/EG (PbEU
      2009, L 140);

      h. investeringen in installaties voor de productie van hernieuwbare energie met het oog op de productie, op het
      glastuinbouwbedrijf, van thermische energie of elektriciteit uit hernieuwbare bronnen, indien:

      1°. het niet de bedoeling is in de eigen energiebehoeften te voorzien;

      2°. de productiecapaciteit van die installaties groter is dan de capaciteit die overeenstemt met het gecombineerde
      gemiddelde jaarlijkse energieverbruik van thermische energie en elektriciteit van het glastuinbouwbedrijf, met
      inbegrip van het glastuinbouwhuishouden, of

      3°. verkoop van elektriciteit aan het net plaatsvindt die buiten de jaarlijkse limiet van het eigen verbruik,
      bedoeld onder 2°, valt;

      i. investeringen die niet in overeenstemming zijn met de wetgeving van de Europese Unie en met de nationale
      milieubeschermingswetgeving;

      j. investeringen die in strijd zouden zijn met de beperkingen als bedoeld in punt 151 van het landbouwsteunkader;

      k. de investeringen met betrekking tot irrigatie op nieuwe en bestaande geïrrigeerde arealen die niet voldoen aan
      de voorwaarden van punt 149 en 150 van het landbouwsteunkader.

      3 Indien meer dan één glastuinbouwbedrijf de investering met het oog op de productie, op het glastuinbouwbedrijf,
      van energie uit hernieuwbare bronnen om in de eigen energiebehoeften te voorzien, wordt onder het gemiddelde,
      bedoeld in het tweede lid, onderdeel g, mede verstaan het gemiddelde jaarlijkse verbruik van elk van die bedrijven
      opgeteld tot de hoeveelheid die overeenstemt met het gemiddelde jaarlijkse verbruik van alle begunstigden van de
      subsidie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.3.2
  - number: 2.3.3
    text: |-
      1 De minister verstrekt subsidie voor een investering als bedoeld in [artikel 2.3.2][ref1], indien de investering
      ten minste gericht is op één van de doelstellingen, genoemd in punt 143, onder a en b, van het landbouwsteunkader.

      2 De glastuinbouwonderneming komt uitsluitend voor subsidie in aanmerking, indien:

      a. de glastuinbouwonderneming voor de aanschaf, de bouw of levering van de apparatuur, installaties of machines,
      bedoeld in [artikel 2.3.2, eerste lid][ref2], een overeenkomst heeft gesloten met de bouwer of leverancier, waarin
      is aangegeven welke apparatuur, installatie of machine zal worden aangeschaft, gebouwd of geleverd, en, indien de
      overeenkomst betrekking heeft op een installatie, wat de maximale en werkelijke capaciteit van de installatie is;

      b. de aanschaf, bouw of levering van de apparatuur, installaties of machines, bedoeld in
      [artikel 2.3.2, eerste lid][ref3], tegen marktconforme voorwaarden zal plaatsvinden, blijkend uit een duidelijke
      kostenspecificatie in de overeenkomst waaruit volgt wat de kostenposten zijn voor iedere afzonderlijke investering
      voor de aanschaf, bouw of levering van de apparatuur, installaties of machines;

      c. in de overeenkomst een ontbindende voorwaarde is opgenomen waaruit volgt dat de overeenkomst wordt ontbonden
      voor zover geen subsidie wordt verleend aan de glastuinbouwonderneming voor de desbetreffende investering;

      d. deze overeenkomstig [artikel 6 van het Handelsregisterbesluit 2008][ref4] als glastuinbouwonderneming in het
      handelsregister is ingeschreven;

      e. de glastuinbouwonderneming voldaan heeft aan [artikel 24, tweede lid, van de Landbouwwet][ref5], indien aan
      hem op grond van artikel 24, eerste lid, van die wet door de minister beschrijvingsbiljetten zijn uitgereikt of
      gezonden, voor:

      1°. het jaar waarin de subsidie wordt aangevraagd, of

      2°. het jaar voorafgaand daaraan indien de gegevens van het jaar waarin de subsidie wordt aangevraagd nog niet
      beschikbaar zijn;

      f. de glastuinbouwonderneming een emissieaangifte als bedoeld in
      [artikel 3, eerste of tweede lid, van de Regeling kostenverevening reductie CO][ref6] heeft ingediend voor:

      1°. het jaar waarin de subsidie wordt aangevraagd, of

      2°. het jaar voorafgaand daaraan, indien de gegevens voor de aangifte van het jaar waarin de subsidie is
      aangevraagd nog niet beschikbaar zijn.

      3 De glastuinbouwonderneming houdt voor apparatuur, installaties of machines als bedoeld in
      [artikel 2.3.2, eerste lid, onderdeel a, d, e of f][ref7], waarvoor de subsidie wordt verstrekt een ordelijke
      administratie bij waaruit, indien verzocht, de volgende documenten kunnen worden overgelegd:

      a. een kopie van de laatste jaarafrekening waarop het energieverbruik van de landbouwonderneming staat voor de
      installatie, bedoeld in [artikel 2.3.2, eerste lid, onderdeel a of f][ref8], en

      b. een kaart met daarop ingetekend de totale oppervlakte van de betrokken opstand en met daarop gearceerd
      ingetekend de oppervlakte waarop de investering betrekking heeft inclusief opgave van de lengte van de voorziening
      in meters en de afstand tussen de onderneming en het netwerk in meters voor investeringen als bedoeld in
      [artikel 2.3.2, eerste lid, onderdeel d of e][ref9].

      4 Subsidie voor apparatuur, installaties of machines als bedoeld in
      [artikel 2.3.2, eerste lid, onderdeel f][ref10], wordt uitsluitend verstrekt indien de energie die wordt opgewekt
      door de apparatuur, installaties of machines uitsluitend wordt gebruikt door de glastuinbouwonderneming die de
      subsidie heeft aangevraagd ten behoeve van tuinbouwdoeleinden van die onderneming.

      5 De termijn, bedoeld in [artikel 23, onderdeel b, van het besluit][ref11], is twee jaar en zes maanden.

      6 Binnen de termijn, genoemd in het vijfde lid,:

      a. voldoet de glastuinbouwonderneming aan wie op grond van [artikel 24, eerste lid, van de Landbouwwet][ref12] door
      de minister beschrijvingsbiljetten worden uitgereikt of gezonden, telkens aan artikel 24, tweede lid, van die wet
      voor in ieder geval het jaar waarin de gegevens zijn opgevraagd, en

      b. dient de glastuinbouwonderneming jaarlijks een emissieaangifte in als bedoeld in
      [artikel 3, eerste of tweede lid, van de Regeling kostenverevening reductie CO][ref13].

      7 De verplichtingen, bedoeld in het tweede lid, onderdeel c, en het zesde lid,
      onderdeel b, zijn niet van toepassing op een glastuinbouwonderneming als bedoeld in
      [artikel 15.51, tweede lid, onderdeel b, van de Wet milieubeheer][ref14].


