    text: |-
      1 De volgende kosten komen in aanmerking voor de subsidie:

      a. de loonkosten van het bij de uitvoering van de in [artikel 2.4.2][ref1] bedoelde activiteiten betrokken
      personeel van de subsidieontvanger, waarbij de loonkosten van docenten uitsluitend in aanmerking komen tot ten
      hoogste het bedrag dat als normbedrag is opgenomen in de Handleiding Overheidstarieven van het Ministerie van
      Financiën, behorende bij salarisschaal 11, en de loonkosten van de lectoren uitsluitend in aanmerking komen tot
      ten hoogste het bedrag dat als normbedrag is opgenomen in de Handleiding Overheidstarieven van het Ministerie van
      Financiën, behorende bij ten hoogste salarisschaal 16;

      b. de kosten, die aantoonbaar noodzakelijk zijn en daadwerkelijk door de subsidieontvanger zijn betaald
      voor het inhuren van ondersteuning, ondersteuningsinstellingen, bedrijven, maatschappelijke organisaties en
      onderzoeksinstellingen vanwege hun expertise of specifieke voorzieningen tot ten hoogste 10% van de subsidiabele
      kosten, bedoeld in onderdeel a;

      c. materiële kosten die aantoonbaar noodzakelijk zijn en daadwerkelijk door de subsidieontvanger zijn betaald voor
      de uitvoering van de activiteiten tot ten hoogste 15% van de subsidiabele kosten, bedoeld in onderdeel a.

      2 Voor loonkosten komen uitsluitend kosten voor subsidie in aanmerking die als indicatief uurtarief vallen onder
      de categorie ‘kosten-plus tarief exclusief BTW’, bedoeld in de Handleiding Overheidstarieven van het Ministerie
      van Financiën.


