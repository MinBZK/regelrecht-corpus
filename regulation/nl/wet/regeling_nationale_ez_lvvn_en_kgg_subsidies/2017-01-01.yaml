  - number: 3.5.11
    text: |-
      De subsidie bedraagt 50 procent van de subsidiabele kosten, met een maximum van:

      a. € 20.000 met betrekking tot de kosten bedoeld in [artikel 3.5.12, onderdeel a][ref1], en

      b. € 150.000 in totaal.


