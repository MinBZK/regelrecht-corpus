    text: |-
      1 Bij de toepassing van [artikel 6, eerste lid, van het besluit][ref1] worden bij het verlenen van subsidie op
      basis van deze titel buiten beschouwing gelaten:

      a. subsidies op grond van het [Besluit stimulering duurzame energieproductie][ref2];

      b. bijdragen van de Europese Commissie op grond van Besluit nr. 1982/2006/EG van het Europees Parlement en de
      Raad van 18 december 2006 betreffende het zevende kaderprogramma voor activiteiten op het gebied van onderzoek,
      technologische ontwikkeling en demonstratie (PbEU 2006, L412) en Verordening (EU) nr. 1291/2013 van het Europees
      Parlement en de Raad van 11 december 2013 tot vaststelling van Horizon 2020 – het kaderprogramma voor onderzoek en
      innovatie (2014–2020) en tot intrekking van Besluit nr. 1982/2006/EG (PbEU 2013, L347).

      2 Bijdragen van gemeenten, provincies, waterschappen en openbare lichamen als bedoeld in
      [artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen][ref3], worden aangemerkt als publieke
      cofinanciering, en blijven bij de toepassing van [artikel 6, eerste lid, van het besluit][ref4] buiten beschouwing
      voor zover het de berekening betreft van het maximum bedrag dat krachtens deze titel per project kan worden
      verstrekt.


