  - number: 3.2.7
    text: |-
      1 De minister verstrekt uitsluitend TKI-toeslag indien ten aanzien van de inzet van TKI-toeslag voor een
      samenwerkingsproject wordt voldaan aan de voorwaarden in paragraaf 2.2.2, nummer 28, onderdeel b, c of d in
      samenhang met nummer 29, van de O&O&I-steunkader.

      2 De minister verstrekt voorts uitsluitend TKI-toeslag voor zover:

      a. verzekerd is dat op het terrein van het programma werkzame ondernemers en onderzoeksorganisaties onder
      transparante en redelijke voorwaarden in aanmerking komen voor deelname aan samenwerkingsprojecten die passen in
      het programma;

      b. het bestaan van samenwerkingsprojecten en de verschuldigdheid van private bijdragen daaraan kan worden
      aangetoond aan de hand van schriftelijke samenwerkingsovereenkomsten;

      c. de aanwending van de TKI-toeslag meerwaarde levert voor het TKI-programma;

      d. het samenwerkingsproject waarvoor de TKI-toeslag wordt aangewend bijdraagt aan de Nederlandse
      kennisinfrastructuur;

      e. een bepaald samenwerkingsproject of een bepaalde innovatie-activiteit niet is gestart voorafgaand aan de eerste
      aanvraag waarbij aanwending van TKI toeslag voor dat project of die activiteit werd aangevraagd.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.2.7
  - number: 3.2.8
    text: |-
      1 De ontvanger van TKI-toeslag wendt de TKI-toeslag zodanig aan dat het totale bedrag aan steun dat voor een
      begunstigde in een samenwerkingsproject beschikbaar is niet meer bedraagt dan:

      a. 100 procent van de subsidiabele kosten voor zover deze betrekking hebben op fundamenteel onderzoek,

      b. 50 procent van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek, en

      c. 25 procent van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling.

      De subsidiabele kosten zijn kosten als bedoeld in artikel 25, derde lid, van de algemene
      groepsvrijstellingsverordening.

      2 Het TKI wendt de TKI-toeslag voor innovatie-activiteiten zodanig aan dat:

      a. bij netwerkactiviteiten:

      1°. slechts aan derden verschuldigde kosten met betrekking tot de netwerkactiviteiten met TKI-toeslag betaald
      worden,

      2°. de opdrachtverlening door de ontvanger van TKI-toeslag aan derden plaats vindt op basis van transparante
      criteria en tegen marktconforme tarieven,

      3°. de netwerkactiviteiten en hieruit voortkomende resultaten voor iedere MKB-onderneming zonder onderscheid
      toegankelijk zijn, en

      4°. indien de netwerkactiviteiten niet voortdurend en voor een ieder vrij toegankelijk zijn, per € 1000 TKI-toeslag
      minstens één MKB-ondernemer deelneemt aan de netwerkactiviteiten;

      b. bij innovatieadviesdiensten:

      1°. de in te zetten innovatiemakelaars op basis van transparante en redelijke criteria geselecteerd worden,

      2°. het totale bedrag aan TKI-toeslag niet meer bedraagt dan 50% van de subsidiabele kosten verbonden aan een
      innovatieadviesdienst, uitgezonderd opleiding, als bedoeld in artikel in artikel 28, tweede lid, onderdeel c, van
      de algemene groepsvrijstellingsverordening met een maximum van € 10.000 per MKB-ondernemer over een periode van
      één jaar.

      3°. aan een MKB-ondernemer gedurende maximaal drie jaar innovatieadviesdiensten worden geleverd.

      3 De ontvanger van TKI-toeslag neemt bij de aanwending van de TKI-toeslag, indien van toepassing, de
      gemeenschappelijke ordening van de landbouwproducten in acht, bedoeld in artikel 40, eerste lid, van het Verdrag
      betreffende de werking van de Europese Unie.

      4 De ontvanger van projecttoeslag wendt de projecttoeslag aan voor het desbetreffende project.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.2.8
  - number: 3.2.10
    text: |-
      1 De programmatoeslag, bedoeld in [artikel 3.2.2, onderdeel a][ref1], wordt aangewend binnen vijf jaar na
      verlening.

      2 De projecttoeslag, bedoeld in [artikel 3.2.2, onderdeel b][ref2], wordt aangewend gedurende de looptijd van het
      project.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.2
