      [ref3]: https://wetten.overheid.nl/BWBR0036841#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0035474#Artikel4.8.2
      [ref5]: https://wetten.overheid.nl/BWBR0007168#Artikel66
