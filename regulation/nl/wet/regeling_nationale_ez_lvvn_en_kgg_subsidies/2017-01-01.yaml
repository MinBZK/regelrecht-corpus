  - number: 4.2.64
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *DEI-project:* energiedemonstratieproject of combinatie van industrieel onderzoek, experimentele ontwikkeling
      en energiedemonstratieproject, dat respectievelijk die past binnen de in de [bijlage 4.2.9][ref1] (Demonstratie
      energie-innovatie) opgenomen beschrijving van demonstratie energie-innovatie;
        - *industrie:* het geheel van ondernemingen die materiële goederen produceren, waarbij grondstoffen
      worden verwerkt en waarbij sprake is van een hoge graad van mechanisering en automatisering, genoemd in de
      Standaardbedrijfsindeling van het Centraal Bureau voor de Statistiek, hoofdgroep C.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
