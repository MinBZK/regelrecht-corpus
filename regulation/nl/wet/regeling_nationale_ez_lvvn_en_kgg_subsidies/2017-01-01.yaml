  - number: 4.4.11
    text: De subsidie wordt vastgesteld zonder voorafgaande beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.4.11
  - number: 4.4.12
    text: |-
      De subsidie, bedoeld in [artikel 4.4.2][ref1], bevat staatssteun en wordt gerechtvaardigd door staatssteunmaatregel
      SA.37084 (2013/N).


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.4.2
