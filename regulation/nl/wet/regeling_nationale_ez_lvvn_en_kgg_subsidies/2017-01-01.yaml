        artikel: 2.4.2
        hoofdstuk: '2'
  - number: 2.4.4
    text: |-
      De aanvraag tot subsidieverlening gaat vergezeld van een beschrijving van de doelen en van de activiteiten die
      ondernomen worden, welke bijdrage aan innovatie en duurzaamheid gerealiseerd wordt, welke partijen, doelgroepen en
      bestaande kennisnetwerken betrokken worden en welke instrumenten ingezet worden om het doel te bereiken.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.4.4
  - number: 2.4.5
    text: |-
      1 De subsidieontvanger draagt zorg voor een functionerend kwaliteitszorgmechanisme dat zorgt voor een samenhang
      tussen de doelstelling en activiteiten van de groene-plus lectoraten.

      2 De subsidieontvanger vangt met de activiteiten aan binnen zes maanden na de datum van subsidieverlening.

      3 De subsidieontvanger draagt zorg voor de deelname van minimaal één mbo-docent aan de kenniskring van het
      desbetreffende groene-plus lectoraat.

      4 De subsidieontvanger moet in elk geval meer dan 40% van de kosten, bedoeld in [artikel 2.4.6, onderdeel a][ref1],
      gebruiken voor docenten van de aanvragende instelling.

      5 De subsidieontvanger en de deelnemers aan de groene-plus lectoraten werken mee aan door of namens de minister
      ingestelde activiteiten die gericht zijn op het monitoren en verspreiden van kennis.

      6 De subsidieontvanger brengt uiterlijk op 1 oktober van elk jaar een tussenrapportage uit van de voortgang van het
      groene-plus lectoraat voor de doelstelling en de subsidiabele activiteiten, bedoeld in [artikel 2.4.2][ref2].

      7 De tussenrapportages bedoeld in het zesde lid worden ingediend bij de minister met behulp van het format, bedoeld
      in bijlage 2.4.1, en bevatten een beschrijving van:

      a. de activiteiten die tot dan toe zijn verricht;

      b. de mate waarin de activiteiten hebben bijgedragen aan de in de aanvraag omschreven doelstelling;

      c. de stand van zaken en planning ter zake van de financiën, waarbij de subsidieontvanger jaarlijks in een door
      een accountant gecontroleerde jaarrekening, waarin uitgaven en ontvangsten van het lectoraat inzichtelijk worden
      gemaakt, verantwoording aflegt over de uitgaven en ontvangsten van het lectoraat.

      8 De subsidieontvanger dient binnen 3 maanden na aanstelling van een lector een uitgewerkt activiteitenplan in.

      9 De subsidieontvanger legt jaarlijks in het jaarverslag verantwoording af over de inzet
      van de op basis van deze titel verstrekte subsidie. Een controleverklaring als bedoeld in
      [artikel 50, tweede lid, onderdeel c, van het besluit][ref3] blijft bij de aanvraag tot subsidievaststelling
      achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.6
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel2.4.2
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel50
