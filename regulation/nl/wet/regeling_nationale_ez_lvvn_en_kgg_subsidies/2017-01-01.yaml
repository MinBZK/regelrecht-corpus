articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *afzet van landbouwproducten:* afzet van landbouwproducten als bedoeld in artikel 2, onderdeel 8, van de algemene
      groepsvrijstellingsverordening, artikel 2, onderdeel 7, van de groepsvrijstellingsverordening landbouw, deel i,
      paragraaf 2.4, onderdeel 35, onder 12, van het landbouwsteunkader en artikel 2, eerste lid, onderdeel c, van de
      algemene de-minimisverordening;
        - *algemene de-minimisverordening:* verordening (EU) nr. 1407/2013 van de Commissie van 18 december 2013
      betreffende de toepassing van de artikelen 107 en 108 van het Verdrag betreffende de werking van de Europese Unie
      op de-minimissteun (PbEU 2013, L 352);
        - *algemene groepsvrijstellingsverordening:* verordening (EU) nr. 651/2014 van de Commissie van 17 juni 2014
      waarbij bepaalde categorieën steun op grond van de artikelen 107 en 108 van het Verdrag met de interne markt
      verenigbaar worden verklaard (PbEU 2014, L 187);
        - *besluit:* [Kaderbesluit nationale EZ-subsidies][ref1];
        - *daadwerkelijke samenwerking:* daadwerkelijke samenwerking als bedoeld in artikel 2, onderdeel 90, van de
      algemene groepsvrijstellingsverordening en paragraaf 1.3, onderdeel h, van het O&O&I-steunkader;
        - *eco-innovatie:* eco-innovatie als bedoeld in paragraaf 1.3, onderdeel 19, onder 4, van het milieu- en
      energiesteunkader;
        - *energie uit hernieuwbare energiebronnen:* energie uit hernieuwbare energiebronnen als bedoeld in artikel 2,
      onderdeel 109, van de algemene groepsvrijstellingsverordening, en paragraaf 1.3, onderdeel 19, onder 11, van het
      milieu- en energiesteunkader;
        - *energie-efficiëntie:* energie-efficiëntie als bedoeld in artikel 2, onderdeel 103, van de algemene
      groepsvrijstellingsverordening, en paragraaf 1.3, onderdeel 19, onder 2, van het milieu- en energiesteunkader;
        - *experimentele ontwikkeling:* experimentele ontwikkeling als bedoeld in artikel 2, onderdeel 86, van de algemene
      groepsvrijstellingsverordening en paragraaf 1.3, onderdeel j, van het O&O&I-steunkader;
        - *fundamenteel onderzoek:* fundamenteel onderzoek als bedoeld in artikel 2, onderdeel 84, van de algemene
      groepsvrijstellingsverordening en paragraaf 1.3, onderdeel m, van het O&O&I-steunkader;
        - *groepsvrijstellingsverordening landbouw:* Verordening (EU) nr. 702/2014 van de Commissie van 25 juni 2014
      waarbij bepaalde categorieën steun in de landbouw- en de bosbouwsector en in plattelandsgebieden op grond van de
      artikelen 107 en 108 van het Verdrag betreffende de werking van de Europese Unie met de interne markt verenigbaar
      worden verklaard (PbEU 2014, L 193);
        - *haalbaarheidsstudie:* haalbaarheidsstudie als bedoeld in artikel 2, onderdeel 87, van de algemene
      groepsvrijstellingsverordening en paragraaf 1.3, onderdeel k, van het O&O&I-steunkader;
        - *hernieuwbare energiebronnen:* hernieuwbare energiebronnen als bedoeld in artikel 2, onderdeel 110, van
      de algemene groepsvrijstellingsverordening, en paragraaf 1.3, onderdeel 19, onder 5, van het milieu- en
      energiesteunkader;
        - *hooggekwalificeerd personeel:* hooggekwalificeerd personeel als bedoeld in artikel 2, onderdeel 93, van de
      algemene groepsvrijstellingsverordening en paragraaf 1.3, onderdeel o, van het O&O&I-steunkader;
        - *industrieel onderzoek:* industrieel onderzoek als bedoeld in artikel 2, onderdeel 85, van de algemene
      groepsvrijstellingsverordening en paragraaf 1.3, onderdeel q, van het O&O&I-steunkader;
        - *innovatieadviesdiensten:* innovatieadviesdiensten als bedoeld in artikel 2, onderdeel 94, van de algemene
      groepsvrijstellingsverordening en paragraaf 1.3, onderdeel r, van het O&O&I-steunkader;
        - *innovatieclusters:* innovatieclusters als bedoeld in artikel 2, onderdeel 92, van de algemene
      groepsvrijstellingsverordening en paragraaf 1.3, onderdeel s, van het O&O&I-steunkader;
        - *jonge landbouwer:* natuurlijke persoon die ten hoogste 39 jaar oud is en sinds ten hoogste drie jaar voor
      het eerst voor eigen rekening en risico een landbouwonderneming beheert die hij: a. alleen in eigendom, pacht of
      erfpacht heeft, of b. volledig in eigendom, pacht of erfpacht heeft met een andere natuurlijke persoon die niet
      eerder een landbouwonderneming volledig in eigendom, pacht of erfpacht heeft gehad.
        - *landbouwsteunkader:* Richtsnoeren van de Europese Unie voor staatssteun in de landbouw- en de bosbouwsector en
      in plattelandsgebieden 2014-2020 (PbEU 2014, C 204);
        - *milieu- en energiesteunkader:* Richtsnoeren staatssteun ten behoeve van milieubescherming en energie 2014-2020
      (PbEU 2014, C 200);
        - *minister:* Minister van Economische Zaken;
        - *O&O&I-steunkader:* Kaderregeling betreffende staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2014/C
      198/01 (PbEU 2014, C 198);
        - *primaire landbouwproductie:* primaire landbouwproductie als bedoeld in artikel 2, onderdeel 9, van de algemene
      groepsvrijstellingsverordening, artikel 2, onderdeel 5, van de groepsvrijstellingsverordening landbouw en deel i,
      paragraaf 2.4, onderdeel 35, onder 10, van het landbouwsteunkader;
        - *Unienorm:* Unienorm als bedoeld in artikel 2, onderdeel 102, van de algemene groepsvrijstellingsverordening, en
      paragraaf 1.3, onderdeel 19, onder 3, van de Richtsnoeren staatssteun ten behoeve van milieubescherming en energie
      2014–2020 (PbEU 2014, C200);
        - *universiteit:* onder a of b van de bijlage van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] genoemde instelling voor hoger onderwijs, alsmede
      een onder i van de [bijlage van die wet](onbekend) genoemd academisch ziekenhuis;
        - *verwerking van landbouwproducten:* verwerking van landbouwproducten als bedoeld in artikel 2, onderdeel 10, van
      de algemene groepsvrijstellingsverordening, artikel 2, onderdeel 6, van de groepsvrijstellingsverordening landbouw,
      deel i, paragraaf 2.4, onderdeel 35, onder 11, van het landbouwsteunkader en artikel 2, eerste lid, onderdeel b,
      van de algemene de-minimisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0005682
