  - number: 4.5.1
    text: |-
      In deze titel wordt verstaan onder:

        - *installatie voor de productie van duurzame energie:* installatie die bijdraagt aan de Nederlandse
      doelstelling voor de productie van hernieuwbare energie en die energie produceert door middel van een: a.
      ruimteverwarmingstoestel met warmtepomp als bedoeld in bijlage I, onderdeel 3 of onderdeel 4, van Verordening
      (EU) nr. 811/2013, niet zijnde een lucht-luchtwarmtepomp; b. waterverwarmingstoestel met warmtepomp als bedoeld in
      artikel 2, zeventiende lid, van Verordening (EU) nr. 812/2013; c. zonneboiler als bedoeld in [artikel 4.5.5][ref1];
      d. pelletkachel als bedoeld in [artikel 4.5.6][ref2], of e. op houtachtige biomassa gestookte ketel als bedoeld
      in [artikel 4.5.7][ref3];
        - *etiket:* gedrukt etiket als bedoeld in artikel 3, eerste lid, onderdeel a, van Verordening (EU) nr. 811/2013 of
      artikel 3, eerste lid, onderdeel a, van Verordening (EU) nr. 812/2013;
        - *meldcode:* code beschikbaar gesteld door de minister per type en merk installatie voor de productie van duurzame
      energie;
        - *productkaart:* productkaart als bedoeld in artikel 3, eerste lid, onderdeel b, van Verordening (EU) nr. 811/2013
      of artikel 3, eerste lid, onderdeel b, van Verordening (EU) nr. 812/2013;
        - *technische documentatie:* technische documentatie als bedoeld in artikel 3, eerste lid, onderdeel c, en bijlage
      V van Verordening (EU) nr. 811/2013 of artikel 3, eerste lid, onderdeel c, en bijlage V van Verordening (EU) nr.
      812/2013;
        - *Verordening (EU) nr. 811/2013:* Verordening (EU) nr. 811/2013 van de Commissie van 18 februari 2013 ter
      aanvulling van Richtlijn 2010/30/EU van het Europees Parlement en de Raad wat de energie-etikettering van
      ruimteverwarmingstoestellen, combinatieverwarmingstoestellen, pakketten van ruimteverwarmingstoestellen,
      temperatuurregelaars en zonne-energie-installaties en pakketten van combinatieverwarmingstoestellen,
      temperatuurregelaars en zonne-energie-installaties betreft (PbEU 2013, L 239);
        - *Verordening (EU) nr. 812/2013:* Verordening (EU) nr. 812/2013 van de Commissie van 18 februari 2013 ter
      aanvulling van Richtlijn 2010/30/EU van het Europees Parlement en de Raad wat de energie-etikettering van
      verwarmingstoestellen, warmwatertanks en pakketten van verwarmingstoestellen en zonne-energie-installaties betreft
      (PbEU 2013, L 239);
        - *Verordening (EU) 2015/1185:* Verordening (EU) nr. 2015/1185 van de Commissie van 24 april 2015 tot uitvoering
      van Richtlijn 2009/125/EG van het Europees Parlement en de Raad wat eisen inzake ecologisch ontwerp betreft voor
      toestellen voor lokale ruimteverwarming die vaste brandstoffen gebruiken (PbEU 2015, L 293);
        - *Verordening (EU) 2015/1189:* Verordening (EU) nr. 2015/1189 van de Commissie van 28 april 2015 tot uitvoering
      van Richtlijn 2009/125/EG van het Europees Parlement en de Raad wat de eisen inzake ecologisch ontwerp voor
      verwarmingsketels voor vaste brandstoffen betreft (PbEU 2015, L 193).


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.5
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.6
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel4.5.5
