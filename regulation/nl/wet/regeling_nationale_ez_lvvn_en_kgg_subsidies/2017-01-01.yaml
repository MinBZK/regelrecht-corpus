    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.8.6
  - number: 3.8.7
    text: |-
      1 Er is een Adviescommissie Internationaal Innoveren die tot taak heeft de minister op zijn
      verzoek te adviseren omtrent de afwijzingsgronden, bedoeld in de [artikelen 22][ref1] en
      [23, onderdelen d tot en met g, van het besluit][ref2] en in [artikel 3.8.9][ref3] en de rangschikkingscriteria,
      bedoeld in [artikel 3.8.10][ref4].

      2 De commissie bestaat uit ten minste drie en ten hoogste vijftien leden.

      3 De voorzitter en de andere leden worden benoemd voor een termijn van ten hoogste vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
