      1 De minister verstrekt op aanvraag een subsidie in de vorm van een geldlening aan een academische innovatieve
      starter of hbo-innovatieve starter ten behoeve van de financiering van een vroegefasetraject.

      2 Bij zijn aanvraag legt de academische innovatieve starter of hbo-innovatieve starter:

      a. een rapport van een haalbaarheidsstudie over;

      b. een overeenkomst over als bedoeld in de definitie van academische innovatieve starter of hbo-innovatieve starter
      in [artikel 3.16.1][ref1].

      3 De termijn, bedoeld in [artikel 23, onderdeel b, van het Kaderbesluit nationale EZ-subsidies][ref2] bedraagt
      24 maanden.

      4 Geen subsidie wordt verstrekt:

      a. indien voor het vroegefasetraject reeds door de minister subsidie is verstrekt;

      b. indien met de uitvoering van het vroegefasetraject is begonnen voor de datum van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.16.1
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.16.12
    references:
