  - number: 3.16.15
    text: |-
      1 Er is een Adviescommissie vroegefasefinanciering academische innovatieve starters en hbo-innovatieve
      starters die tot taak heeft de minister op zijn verzoek te adviseren omtrent de beoordeling van de
      aanvragen op grond van de afwijzingsgronden voor aanvragen, bedoeld in de [artikelen 22][ref1] en
      [23 van het Kaderbesluit nationale EZ-subsidies][ref2] en [3.16.14][ref3], en de rangschikkingscriteria, bedoeld
      in [artikel 3.16.17][ref4].

      2 De commissie bestaat uit ten minste 3 en ten hoogste 20 leden.

      3 De voorzitter en de andere leden van de commissie worden door de minister voor een termijn van ten hoogste 2
      jaar benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
