        artikel: '39'
  - number: 3.8.12
    text: |-
      1 De subsidieontvanger verleent medewerking aan een evaluatieonderzoek van de effecten van het door hem uitgevoerde
      innovatieproject, voor zover deze medewerking redelijkerwijs van hem kan worden verlangd.

      2 De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de dag waarop subsidie wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.8.12
  - number: 3.8.13
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 3.8.2][ref1] bevat ten minste de gegevens, bedoeld in artikel
      6, tweede lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie als bedoeld in [artikel 3.8.2][ref2] ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het KvK-nummer, het post- en bezoekadres en
      het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. de gegevens over het plan, waaronder de activiteit waarvoor subsidie wordt aangevraagd, de start- en einddatum,
      de totale kosten en de omvang van de gevraagde subsidie.

      3 De aanvraag voor de vaststelling van een subsidie als bedoeld in [artikel 3.7.2][ref3] bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de aanvrager en het door de minister verstrekte
      referentienummer;

      b. de omvang van de vast te stellen subsidie.


