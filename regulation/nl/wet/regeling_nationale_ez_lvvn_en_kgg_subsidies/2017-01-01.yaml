  - number: 4.4.13
    text: |-
      Deze titel en de [bijlagen 4.4.1][ref1] en [4.4.2][ref2] vervallen met ingang van 1 juli 2017, met dien verstande
      dat deze van toepassing blijven op subsidies die voor die datum zijn verleend.


