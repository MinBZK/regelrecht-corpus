  - number: 3.4.2
    text: |-
      1 De minister verstrekt op grond van deze titel op aanvraag subsidie voor activiteiten die passen binnen de
      volgende programma’s of plannen, die bij het Ministerie van Economische Zaken ter inzage liggen en op de website
      van RVO.nl zijn te raadplegen:

      a. MKB-Innovatiestimuleringsplan 2016 voor de topsector HTSM (en ICT);

      b. MIT-programma Tuinbouw & Uitgangsmaterialen (T&U) 2016;

      c. MIT MKB versterkingsplan topsector Logistiek 2016;

      d. MIT-programma topsector Life Sciences and Health 2016;

      e. MIT-programma Water 2016;

      f. MKB-Innovatiestimuleringsplan (MIT) 2016 voor Chemie en Energie (inclusief Biobased Economy);

      g. MIT-MKB-plan Creatieve Industrie 2016;

      h. MIT-programma Agri&Food 2016.

      2 De minister verdeelt de aan deze activiteiten verbonden subsidieplafonds voor de [paragrafen 2][ref1],
      [3][ref2], [3a][ref3], [4][ref4] en [6][ref5] van deze titel op volgorde van binnenkomst van de aanvragen en
      voor [titel 5][ref6] op volgorde van rangschikking van de aanvragen.

      3 Indien een aanvraag voor een subsidie voor een MIT-innovatie-adviesproject, een MIT-haalbaarheidsproject of
      een MIT-R&D-samenwerkingsproject is ingediend bij een provinciebestuur en indien dat bestuur de aanvraag niet in
      behandeling kan nemen, neemt de minister de aanvraag in behandeling waarbij als datum van indiening de datum van
      indiening bij het provinciebestuur wordt gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0035474#Hoofdstuk3
      [ref5]: https://wetten.overheid.nl/BWBR0035474#Hoofdstuk3
      [ref6]: https://wetten.overheid.nl/BWBR0035474#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.4.2
