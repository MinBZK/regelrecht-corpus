  - number: 3.2.12
    text: |-
      1 De rapportage, genoemd in [artikel 39, eerste lid, van het besluit][ref1], bevat in ieder geval:

      a. een overzicht van de mate waarin de samenwerkingsprojecten, de private bijdragen aan en de inzet in natura voor
      deze projecten van het lopende jaar zijn gerealiseerd;

      b. een opgave van de afwijkingen van het TKI-programma;

      c. een overzicht van de activiteiten en doelen voor het eerstvolgende jaar;

      d. een overzicht van de mate waarin de uit TKI-relevante onderzoeksopdrachten, waarvoor op grond van
      [artikel 3.2.3, eerste lid][ref2], onderdeel b, TKI-toeslag is ontvangen, voortgevloeide kennis toegepast wordt
      binnen samenwerkingsprojecten van het TKI-programma.

      2 De ontvanger van TKI-toeslag zorgt dat actuele informatie over de samenwerkingsprojecten waarvoor de toeslag
      wordt aangewend op eenvoudige wijze voor het algemene publiek kenbaar is. De informatie omvat ten minste een
      beschrijving van het onderzoek, de deelnemende ondernemers en onderzoeksorganisaties en de planning en voortgang.

      3 Het tweede lid, eerste volzin, is van overeenkomstige toepassing op informatie over de voorwaarden
      waaronder deelname door op het terrein van het programma werkzame ondernemers en onderzoeksorganisaties aan
      samenwerkingsprojecten van het TKI-programma openstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.3
