  - number: 3.3.2
    text: |-
      1 De minister verstrekt op grond van deze titel op aanvraag subsidie voor activiteiten die passen binnen de
      programma´s die als bijlagen op het Ministerie van Economische Zaken ter inzage liggen.

      2 De minister verdeelt de aan deze activiteiten verbonden subsidieplafonds op volgorde van binnenkomst van de
      aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.3.2
  - number: 3.3.3
    text: |-
      1 Met de uitvoering van de op grond van deze titel gesubsidieerde activiteiten wordt gestart binnen zes maanden na
      de subsidieaanvraag.

      2 De op grond van dit hoofdstuk gesubsidieerde activiteiten worden uitgevoerd binnen twaalf maanden na de start van
      de activiteiten.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.3.3
  - number: 3.3.4
    text: |-
      Subsidie wordt verstrekt aan een TKI voor het door derden laten uitvoeren van netwerkactiviteiten ten behoeve van
      MKB-ondernemers.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.3.4
  - number: 3.3.5
    text: |-
      1 Slechts aan derden verschuldigde kosten met betrekking tot de netwerkactiviteiten zijn subsidiabel.

      2 De opdrachtverlening door de subsidieontvanger aan derden vindt plaats op basis van transparante criteria en
      tegen marktconforme tarieven.

      3 De netwerkactiviteiten en hieruit voortkomende resultaten zijn voor iedere MKB-onderneming zonder onderscheid
      toegankelijk.

      4 Per € 1.000 subsidie neemt minstens één MKB-ondernemer deel aan de netwerkactiviteiten.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.3.5
  - number: 3.3.6
    text: |-
      Subsidie wordt verstrekt aan een TKI voor het door innovatiemakelaars laten leveren van innovatieadviesdiensten,
      uitgezonderd opleiding, aan MKB-ondernemers.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.3.6
  - number: 3.3.7
    text: |-
      1 De TKI selecteert op basis van transparante en redelijke criteria de in te zetten innovatiemakelaars.

      2 Innovatieadviesdiensten zijn slechts subsidiabel indien zij tegen marktconforme tarieven door een
      innovatiemakelaar worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.3.7
  - number: 3.3.8
    text: |-
      1 De subsidiabele kosten zijn de kosten verbonden aan een innovatieadviesdienst, uitgezonderd opleiding, als
      bedoeld in artikel 28, tweede lid, onderdeel c, van de algemene groepsvrijstellingsverordening.

      2 De subsidie bedraagt voor innovatieadviesdiensten 50 procent van de subsidiabele kosten.

      3 Het maximale subsidiebedrag bedraagt € 10.000 per MKB-onderneming waaraan de innovatieadviesdiensten zijn
      geleverd over een periode van maximaal één jaar.

      4 Aan een MKB-ondernemer worden gedurende maximaal drie jaar innovatieadviesdiensten geleverd.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.3.8
  - number: 3.3.9
    text: |-
      1 De subsidieontvanger verleent medewerking aan een evaluatie van de effecten van de door hem op grond van dit
      hoofdstuk uitgevoerde activiteiten, voor zover medewerking redelijkerwijs van hem kan worden verlangd.

      2 De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.3.9
  - number: 3.3.10
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 3.3.2][ref1] bevat ten minste de gegevens, bedoeld in artikel
      6, tweede lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie als bedoeld in [artikel 3.3.2][ref2] ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het KvK-nummer, het post- en bezoekadres en
      het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. de gegevens over het plan, waaronder de activiteit waarvoor subsidie wordt aangevraagd, de topsector waarbinnen
      het wordt uitgevoerd, de start- en einddatum, de totale kosten en de omvang van de gevraagde subsidie;

      d. een projectplan;

      e. een begroting.

      3 De aanvraag voor de vaststelling van een subsidie die krachtens deze titel is verleend bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de aanvrager en het door de minister verstrekte
      referentienummer;

      b. de omvang van de vast te stellen subsidie;

      c. de kerngegevens voor de onderbouwing van de subsidievaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.3.2
