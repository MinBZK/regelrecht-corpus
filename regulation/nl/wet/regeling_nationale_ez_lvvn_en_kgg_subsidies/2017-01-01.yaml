    text: |-
      Deze titel vervalt met ingang van 1 juli 2017, met dien verstande dat deze van toepassing blijft op subsidies die
      voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.5.27
  - number: 3.6.1
    text: |-
      In deze titel wordt verstaan onder:

        - *Smart Industry fieldlab:* een samenwerkingsverband dat een praktijkomgeving vormt waarin sprake is van een
      slimme inzet van nieuwe productietechnologieën en ICT door de industrie waarmee productiemiddelen binnen bedrijven
      en tussen bedrijven onderling verweven raken met als doel procesinnovatie, productinnovatie of het vernieuwen van
      businessmodellen.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.6.1
  - number: 3.6.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een deelnemer in een Smart Industry fieldlab voor de uitvoering
      van een project dat bestaat uit experimentele ontwikkeling, het beheren van een innovatiecluster of een combinatie
      daarvan.

      2 Een Smart Industry fieldlab bevat in elk geval vier of meer niet in een groep verbonden ondernemers, waaronder
      twee of meer MKB-ondernemers, een of meer onderzoeksorganisaties en een of meer onderwijsinstellingen.

      3 Subsidie voor het beheren van een innovatiecluster wordt uitsluitend verstrekt aan een rechtspersoon die
      deelneemt in een Smart Industry fieldlab die tevens het innovatiecluster zal beheren.

      4 De subsidie wordt voor tweederde deel verstrekt in de vorm van een subsidie met terugbetalingsverplichting als
      bedoeld in [artikel 42 van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel42
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.6.2
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '42'
  - number: 3.6.3
    text: |-
      1 De subsidie bedraagt 60 procent van de subsidiabele kosten.

      2 Indien de som van het rentevoordeel uit de subsidie met terugbetalingsverplichting en het een derde deel subsidie
      meer dan 40 procent van de subsidiabele kosten voor experimentele ontwikkeling of 50 procent van de subsidiabele
      kosten voor het beheren van een innovatiecluster bedraagt, wordt het meerdere in mindering gebracht op de aan de
      aanvrager te verstrekken subsidie.

      3 Het in het tweede lid genoemde percentage voor experimentele ontwikkeling wordt met 10 procentpunten verhoogd,
      indien de subsidie wordt verstrekt aan een MKB-ondernemer.

      4 De subsidie bedraagt ten hoogste € 3.000.000 per project.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.6.3
  - number: 3.6.4
    text: |-
      Indien het totale subsidiebedrag voor de deelnemers van een Smart Industry fieldlab meer zou bedragen dan het
      in [artikel 3.6.3, vierde lid][ref1], genoemde maximum subsidiebedrag, wordt het meerdere naar rato in mindering
      gebracht op de aan de betrokken aanvragers te verstrekken subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.6.3
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.6.4
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.6.3
        hoofdstuk: '3'
  - number: 3.6.5
    text: |-
      Voor subsidie komen uitsluitend de volgende kosten in aanmerking:

      a. voor zover het subsidie voor experimentele ontwikkeling betreft, de kosten, bedoeld in artikel 25, derde lid,
      van de algemene groepsvrijstellingsverordening;

      b. voor zover het subsidie voor het beheren van een innovatiecluster betreft, de kosten, bedoeld in artikel 27,
      vijfde en achtste lid, van de algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.6.5
  - number: 3.6.6
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.6.6
  - number: 3.6.7
    text: |-
      De termijn, bedoeld in [artikel 23, eerste lid, onderdeel c, van het besluit][ref1], is vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.6.7
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.6.8
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. in het geval van subsidie voor experimentele ontwikkeling, geen sprake is van daadwerkelijke samenwerking;

      b. onvoldoende vertrouwen bestaat dat de subsidieontvanger de lening kan terugbetalen binnen de termijn, genoemd
      in [artikel 3.6.10][ref1];

      c. de subsidiabele kosten per project minder dan € 1.000.000 bedragen;

      d. het subsidiebedrag per subsidieontvanger lager zou zijn dan € 25.000;

      e. het project niet leidt tot een voldoende mate van vernieuwing van een product of een proces;

      f. het project onvoldoende economische waarde creëert voor de deelnemers in het Smart Industry fieldlab, de
      industrie of de Nederlandse economie;

      g. de kwaliteit van het Smart Industry fieldlab onvoldoende is, ten minste blijkend uit de mate van de
      complementariteit van de deelnemers, de daadwerkelijke betrokkenheid van de deelnemers, de capaciteiten van de
      deelnemers en de kwaliteit van de projectorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.6.10
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.6.8
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.6.10
        hoofdstuk: '3'
  - number: 3.6.9
    text: |-
      De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate:

      a. er een grotere mate van vernieuwing van een product of een proces wordt verwacht;

      b. er meer economische waarde wordt gecreëerd voor de deelnemers in het Smart Industry fieldlab, de industrie of de
      Nederlandse economie;

      c. de kwaliteit van het Smart Industry fieldlab hoger is, ten minste blijkend uit de mate van de complementariteit
      van de deelnemers, de daadwerkelijke betrokkenheid van de deelnemers, de capaciteiten van de deelnemers en de
      kwaliteit van de projectorganisatie.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.6.9
  - number: 3.6.10
    text: |-
      De subsidieontvanger betaalt het tweederde deel van de subsidie volgens een in de beschikking tot subsidieverlening
      vastgelegd schema binnen vijf jaar na de datum van de beschikking tot vaststelling van de subsidie terug aan de
      minister.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.6.10
  - number: 3.6.11
    text: |-
      1 De subsidieontvanger verleent medewerking aan een evaluatie van de effecten van de door hem uitgevoerde
      activiteiten, bedoeld in [artikel 3.6.2, eerste lid][ref1], voor zover deze medewerking redelijkerwijs van hem
      verlangd kan worden.

      2 De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.6.2
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.6.11
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.6.2
        hoofdstuk: '3'
  - number: 3.6.12
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 3.6.2, eerste lid][ref1], bevat ten minste de gegevens,
      bedoeld in artikel 6, tweede lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het KvK-nummer, het post- en bezoekadres en
      het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. gegevens over het project, waaronder de activiteit waarvoor subsidie wordt aangevraagd, de start- en einddatum,
      de totale kosten en de omvang van de gevraagde subsidie;

      d. een businessplan, een projectplan waarin tevens is aangegeven hoe de samenwerking in het Smart Industry fieldlab
      is georganiseerd, en een financieel plan;

      e. per subsidieaanvrager een berekening van de marktrente door een erkende kredietbeoordelaar voor een geldlening
      voor de financiering van de uitvoering van het project.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.6.2
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.6.12
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.6.2
        hoofdstuk: '3'
  - number: 3.6.13
    text: |-
      Subsidie die krachtens [artikel 3.6.2, eerste lid][ref1], wordt verleend bevat staatssteun en wordt gerechtvaardigd
      door de artikelen 25 en 27 van de algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.6.2
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.6.13
    references:
