  - number: 3.10.9
    text: |-
      In afwijking van [artikel 30, eerste lid, van het besluit][ref1] bedraagt de termijn waarbinnen een overeenkomst
      tot stand moet zijn gekomen twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel30
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.10.9
