    text: |-
      1 Het tarief van de provisie, bedoeld in [artikel 32, derde lid, van het besluit][ref1], bedraagt jaarlijks tussen
      0,39 procent en 4,19 procent van het bedrag dat op enig moment gedurende de bouw van een schip op basis van een
      kredietovereenkomst daadwerkelijk door een scheepswerf als krediet is opgenomen.

      2 De minister bepaalt in de beschikking tot verlening van subsidie in de vorm van een garantstelling het tarief per
      individuele garantstelling.

      3 Het tarief, bedoeld in het tweede lid, wordt zodanig vastgesteld dat:

      a. het marktconform is;

      b. de provisie zowel de met de garantstelling verbonden risico´s als de beheerskosten dekt;

      c. rekening wordt gehouden met een realistische risicoanalyse.


