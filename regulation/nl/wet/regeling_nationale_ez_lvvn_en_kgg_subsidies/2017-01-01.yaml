  - number: 3.12.1
    text: |-
      In deze titel wordt verstaan onder:

        - *aandelenkapitaal:* aandelen in het kapitaal van een onderneming van een ondernemer, die de financier
      rechtstreeks van de ondernemer heeft verkregen tegen volstorting van die aandelen in geld, of door omzetting van
      een achtergestelde lening;
        - *achtergestelde lening:* a. een lening van geld door een financier aan een ondernemer met het oog op de
      financiering door deze onderneming van eigen activiteiten, 1°. welke lening niet door enige vorm van zekerheid
      is gedekt, met uitzondering van een borgstelling die een aandeelhouder in de onderneming van de ondernemer
      op persoonlijke titel heeft gegeven, 2°. waarop de ondernemer krachtens een daartoe strekkende bepaling in de
      akte van geldlening in geval van ontbinding, een akkoord na verlening van surseance van betaling, een akkoord
      in faillissement of een akkoord na het van toepassing verklaren van de schuldsaneringsregeling natuurlijke
      personen met betrekking tot de ondernemer waaraan de achtergestelde lening is verstrekt, eerst verplicht is de
      niet vervallen aflossingen te betalen nadat alle andere op dat moment bestaande schulden van de debiteur zijn
      voldaan, met uitzondering van schulden ingevolge vorderingen waaraan een bepaling van gelijke aard als voornoemde
      bepaling zijn verbonden en ingevolge geldleningen die zijn verstrekt door aandeelhouders in de onderneming van de
      ondernemer en 3°. ten aanzien waarvan de financier in de vorenbedoelde akte van geldlening afstand heeft gedaan
      van alle rechten tot verrekening van de niet vervallen aflossingen, of b. een lening van geld door een financier
      aan een ondernemer die een rechtspersoon is wiens activa slechts bestaan uit deelnemingen in of vorderingen op
      een dochtermaatschappij in de zin van [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref1], met het oog
      op financiering door deze ondernemer van activiteiten van deze dochtermaatschappij, 1°. welke lening niet door
      enige vorm van zekerheid is gedekt, met uitzondering van een persoonlijke borgstelling van een aandeelhouder in
      de onderneming van de ondernemer en van een pandrecht gevestigd op aandelen in de dochtermaatschappij en 2°. ten
      aanzien waarvan de financier in de akte van geldlening afstand heeft gedaan van alle rechten tot verrekening van de
      niet vervallen aflossingen;
        - *reserveringsquotum:* bedrag dat de minister op aanvraag van een financier vaststelt als maximum voor de som van
      de garanties voor verstrekkingen van risicokapitaal die: a. gedurende drie jaar vanaf de datum van de beschikking
      aan de financier kunnen worden verschaft indien het een eerste toekenning van een reserveringsquotum betreft; b.
      gedurende twee jaar vanaf de datum van de beschikking aan de financier kunnen worden verschaft indien reeds eerder
      een reserveringsquotum is toegekend;
        - *risicokapitaal:* kapitaal in de vorm van aandelenkapitaal of een achtergestelde lening;
        - *waarde van aandelenkapitaal:* bedrag in geld dat de financier bij de volstorting van de aandelen heeft betaald
      dan wel, in geval van omzetting van een achtergestelde lening, of een deel daarvan, in aandelenkapitaal, de waarde
      van de uitstaande lening voor zover die is omgezet in aandelen, vermeerderd onderscheidenlijk verminderd met het
      bedrag in geld dat wegens de omzetting is bijbetaald door, onderscheidenlijk terugbetaald aan de financier;
        - *waarde van een achtergestelde lening:* nog niet afgeloste deel van de lening.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.12.1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24a
  - number: 3.12.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een financier, niet zijnde een startersfonds als bedoeld in
      [artikel 3.10.1][ref1] voor het verstrekken van risicokapitaal aan een ondernemer.

      2 De subsidie wordt verstrekt in de vorm van een garantstelling voor de terugbetaling van risicokapitaal dat de
      financier op grond van een overeenkomst aan een ondernemer heeft verstrekt voor de duur van de overeenkomst met een
      maximum van twaalf jaar.

      3 De garantstelling heeft slechts betrekking op risicokapitaal dat wordt verstrekt nadat de minister desgevraagd
      een reserveringsquotum heeft toegekend en voor zover het quotum toereikend en geldig is.

      4 In aanvulling op het eerste lid kan de minister ook subsidie verstrekken aan een financier voor het verstrekken
      van risicokapitaal aan een ondernemer die gevestigd is in het openbaar lichaam Bonaire, Sint Eustatius of Saba.

      5 Voor de toepassing van het vierde lid wordt als financier aangewezen een kredietinstelling in de zin van de
      [Wet financiële markten BES][ref2] die op grond van die wet bevoegd is in Bonaire, Sint Eustatius of Saba het
      bedrijf van kredietinstelling uit te oefenen, of een in Bonaire, Sint Eustatius of Saba gevestigde vennootschap in
      de vorm van een kapitaalvennootschap of een vennootschap met een afgescheiden vermogen die blijkens haar statuten
      of blijkens de overeenkomst waarbij zij is aangegaan tot doel heeft of mede tot doel heeft het verstrekken van
      risicokapitaal aan ondernemers teneinde winst te behalen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.10.1
      [ref2]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.12.2
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.10.1
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0030883
  - number: 3.12.3
    text: |-
      1 De financier verstrekt geen risicokapitaal aan een ondernemer wiens activiteiten in overwegende mate betrekking
      hebben op:

      a. landbouw, visserij en aquacultuur, met uitzondering van toelevering en dienstverlening;

      b. onroerend goed voor zover de activiteiten gericht zijn op het behalen van resultaten door waardestijging van
      onroerend goed zonder dat er sprake is van significante waardetoevoeging door eigen productieve activiteiten;

      c. de financiële sector voor zover de ondernemer het bank-, verzekerings- of beleggingsbedrijf uitoefent, of een
      participatiemaatschappij heeft;

      d. de gezondheidszorg, voor zover de onderneming een aanbieder is als bedoeld in
      [artikel 1, onderdeel c, van de Wet marktordening gezondheidszorg][ref1].

      2 De financier verstrekt geen risicokapitaal aan een instelling als bedoeld in [artikel 70 van de Woningwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.12.3
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '70'
  - number: 3.12.4
    text: |-
      1 Er wordt garant gestaan voor 50 procent van de waarde van het risicokapitaal.

      2 Indien de financier bij het verkrijgen van risicokapitaal een gedeelte daarvan niet onder de garantstelling
      van de Staat brengt, zijn de bepalingen van deze titel slechts van toepassing op het gedeelte van het verkregen
      risicokapitaal dat onder de garantstelling is gebracht, tenzij uitdrukkelijk anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.12.4
  - number: 3.12.5
    text: |-
      1 De garantstelling heeft uitsluitend betrekking op risicokapitaal waarbij de waarde van het risicokapitaal dat
      aan de ondernemer of, indien de ondernemer deel uitmaakt van een groep, aan de groep wordt verstrekt tezamen met
      de waarde van risicokapitaal dat door een andere financier met toepassing van dit hoofdstuk en van risicokapitaal
      dat met toepassing van [titel 3.10][ref1] aan de ondernemer onderscheidenlijk de groep is verstrekt of gelijktijdig
      wordt verstrekt, niet meer bedraagt dan € 5.000.000.

      2 In afwijking van het eerste lid heeft de garantstelling voor participatiemaatschappijen uitsluitend betrekking
      op risicokapitaal waarbij de waarde van het risicokapitaal dat aan de ondernemer of, indien de ondernemer deel
      uitmaakt van een groep, aan de groep wordt verstrekt tezamen met de waarde van het risicokapitaal dat door een
      andere participatiemaatschappij met toepassing van dit hoofdstuk en van risicokapitaal dat met toepassing van
      [titel 3.10][ref2] aan de ondernemer onderscheidenlijk de groep is verstrekt of gelijktijdig wordt verstrekt, niet
      meer bedraagt dan € 25.000.000.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0035474#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.12.5
