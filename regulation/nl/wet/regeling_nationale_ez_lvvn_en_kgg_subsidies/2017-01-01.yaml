  - number: 2.2.5
    text: |-
      1 De volgende kosten voor een project als bedoeld in [artikel 2.2.2, onderdeel a of b][ref1], komen in aanmerking
      voor subsidie:

      a. de kosten voor de inhuur van een procesbegeleider of projectuitvoerder;

      b. de kosten van derden voor de organisatie en facilitering van bijeenkomsten ten behoeve van kennisuitwisseling,
      waaronder begrepen zaalhuur en vergaderfaciliteiten;

      c. de kosten voor het vastleggen en verspreiden van kennis, waaronder begrepen drukwerk en de kosten van de
      ontwikkeling en het beheer van internetapplicaties;

      d. de kosten voor het inhuren van consultatie en bijstand in het kader van innovatieadvies.

      2 Voor een project als bedoeld in [artikel 2.2.2, onderdeel b][ref2], komen tevens in aanmerking voor subsidie de
      kosten apparatuur en materiaal, die rechtstreeks uit het project voortvloeien.

      3 De kosten, bedoeld in het eerste en tweede lid, komen slechts voor subsidie in aanmerking voor zover deze kosten
      vallen binnen de kostensoorten, genoemd in de artikelen 28 en 29 van de algemene groepsvrijstellingsverordening en
      artikel 14 van de groepsvrijstellingsverordening landbouw.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel2.2.2
