  - number: 4.2.2
    text: |-
      1 Met de uitvoering van de op grond van deze titel gesubsidieerde activiteiten wordt gestart binnen zes maanden na
      de verlening.

      2 Op verzoek van de minister verleent de subsidieontvanger medewerking aan het verspreiden van de resultaten en
      medewerking aan een evaluatie van de effecten van de op grond van deze titel gesubsidieerde activiteiten.

      3 De subsidieontvanger maakt de niet bedrijfsgevoelige kennis en informatie die met het project wordt opgedaan na
      afloop van het project openbaar in een, naar het oordeel van de minister, kwalitatief voldoende verslag.

      4 Iedere publicatie door of met medewerking van de deelnemers in het project of diens medewerkers wordt voorzien
      van de vermelding dat het project wordt uitgevoerd met Topsector Energie-subsidie van het Ministerie van
      Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.2.2
  - number: 4.2.3
    text: |-
      1 Een aanvraag om subsidie op grond van deze titel bevat ten minste de gegevens, bedoeld in artikel 6, tweede lid,
      van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag om subsidie op grond van deze titel ten minste:

      a. gegevens over de aanvrager, waaronder de naam van de organisatie, het KvK-nummer, het post- en bezoekadres en
      het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. kerngegevens over het project;

      d. informatie over de wijze waarop de aanvrager en indien van toepassing de deelnemers van een samenwerkingsverband
      hun eigen aandeel in de projectkosten financieren.

      3 De aanvraag voor de vaststelling van een subsidie die krachtens deze titel is verleend bevat in ieder geval:

      a. gegevens over de aanvrager, waaronder de naam van de aanvrager en het door de minister verstrekte
      referentienummer;

      b. de omvang van de vast te stellen subsidie;

      c. de kerngegevens voor de onderbouwing van de subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.2.3
  - number: 4.2.4
    text: |-
      1 Voor zover de subsidiabele projectkosten betrekking hebben op een energiedemonstratieproject
      als bedoeld in deze titel, zijn de [artikelen 10, derde lid][ref1], en
      [38, eerste lid, onderdelen b tot en met d, van het besluit][ref2] niet van toepassing.

      2 Voor een energiedemonstratieproject dat maatregelen betreft ter bevordering van energie uit hernieuwbare bronnen,
      wordt geen subsidie uitgekeerd nadat de installatie in bedrijf is genomen.

      3 Voor de berekening van de subsidiabele kosten geldt dat van de som van de per kostensoort berekende
      investeringskosten van het energiedemonstratieproject verminderd met de referentiekosten, de aan derden
      verschuldigde kosten ten hoogste 50 procent deel uitmaken.

      4 Onder de aan derden verschuldigde kosten, bedoeld in het derde lid, wordt verstaan de subsidiabele kosten voor de
      activiteiten in het project die worden uitbesteed.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel38
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel4.2.4
    references:
