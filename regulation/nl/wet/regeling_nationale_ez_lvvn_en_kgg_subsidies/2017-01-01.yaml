  - number: '1.7'
    text: |-
      1 In aanvulling op [artikel 10, vierde lid, van het besluit][ref1], worden, indien de subsidie valt onder
      de algemene groepsvrijstellingsverordening, respectievelijk de groepsvrijstellingsverordening landbouw,
      respectievelijk het landbouwsteunkader:

      a. de in aanmerking komende kosten berekend en gestaafd met bewijsstukken, overeenkomstig artikel 7,
      eerste lid, van de algemene groepsvrijstellingsverordening, respectievelijk artikel 7, eerste lid, van
      de groepsvrijstellingsverordening landbouw, respectievelijk deel i, paragraaf 3.5, onderdeel 85, van het
      landbouwsteunkader;

      b. indien de steun in meerdere tranches wordt uitgekeerd, de in aanmerking komende kosten gedisconteerd
      overeenkomstig artikel 7, derde lid, van de algemene groepsvrijstellingsverordening, respectievelijk artikel 7,
      vierde lid, van de groepsvrijstellingsverordening landbouw, respectievelijk deel i, paragraaf 3.5, onderdeel 88,
      van het landbouwsteunkader;

      c. indien de steun wordt toegekend in de vorm van belastingvoordelen, de steuntranches gedisconteerd overeenkomstig
      artikel 7, vierde lid, van de algemene groepsvrijstellingsverordening, respectievelijk artikel 7, vijfde lid,
      van de groepsvrijstellingsverordening landbouw, respectievelijk deel i, paragraaf 3.5, onderdeel 89, van het
      landbouwsteunkader.

      2 In aanvulling op [artikel 10, vierde lid, van het besluit][ref2], worden, indien de subsidie valt onder het
      O&O&I-steunkader, respectievelijk het milieu- en energiesteunkader:

      a. de in aanmerking komende kosten berekend overeenkomstig paragraaf 1.3, onderdeel 15, onder c, van het O&O&I-
      steunkader, respectievelijk paragraaf 1.3, onderdeel 19, onder 20, van het milieu- en energiesteunkader;

      b. indien de steun in meerdere tranches wordt uitgekeerd, de in aanmerking komende kosten gedisconteerd
      overeenkomstig paragraaf 1.3, onderdeel 15, onder c, van het O&O&I-steunkader, respectievelijk paragraaf 1.3,
      onderdeel 19, onder 20, van het milieu- en energiesteunkader.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel10
