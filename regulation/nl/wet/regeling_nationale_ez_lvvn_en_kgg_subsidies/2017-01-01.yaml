  - number: 3.15.1
    text: |-
      1 In deze titel wordt verstaan onder:

        - *contractprijs:* tussen opdrachtgever en scheepswerf overeengekomen prijs voor de bouw van een schip, met
      inbegrip van stelposten voor zover daarvoor in het contract vaste of geschatte bedragen zijn opgenomen en met
      uitzondering van de eventueel verschuldigde omzetbelasting;
        - *kredietbedrag:* bedrag dat op grond van de kredietovereenkomst als krediet wordt verstrekt ten behoeve van de
      bouw in Nederland van een nieuw schip;
        - *kredietovereenkomst:* schriftelijke overeenkomst tussen een scheepswerf en een financier waarbij de financier op
      verzoek van de scheepswerf krediet verstrekt aan de scheepswerf voor de bouw in Nederland van een nieuw schip;
        - *opdrachtgever:* natuurlijke of rechtspersoon die opdracht heeft gegeven tot de bouw van een schip;
        - *scheepswerf:* ondernemer die schepen ontwerpt, ontwikkelt, bouwt en uitrust, hetzij zelfstandig, hetzij deel
      uitmakend van een groep;
        - *schip:* zichzelf voortstuwend schip, met een minimaal vermogen van 365 kW of een minimaal tonnage van 500 bruto
      ton, niet zijnde een schip dat overeenkomstig zijn fundamentele en technisch vermogen is bedoeld om voor militaire
      doeleinden te worden gebruikt.

      2 Voor de toepassing van dit hoofdstuk wordt als financier aangewezen een bank, niet zijnde een bank die
      uitsluitend beleggingsonderneming is.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.15.1
  - number: 3.15.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een financier voor het verstrekken van een krediet aan een
      scheepswerf ten behoeve van de bouw in Nederland van een nieuw schip.

      2 De subsidie wordt verstrekt in de vorm van een garantstelling.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.15.2
  - number: 3.15.3
    text: |-
      1 Er wordt garant gestaan voor maximaal 80 procent van de financiële verplichtingen die ingevolge artikel 2 van
      de overeenkomst tot garantstelling die is opgemaakt conform het model dat is opgenomen in [bijlage 3.15.1][ref1],
      onder de garantstelling vallen, doch ten hoogste voor € 80.000.000.

      2 Er wordt niet garant gestaan voor de kosten die de financier in rekening brengt aan de scheepswerf, met
      uitzondering van de kosten ten behoeve van de financiering van de bouw van het schip.


