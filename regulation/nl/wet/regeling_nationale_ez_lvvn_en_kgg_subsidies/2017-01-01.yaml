        hoofdstuk: '3'
  - number: 3.12.6
    text: |-
      1 Er is een Adviescommissie Groeifaciliteit die tot taak heeft de minister op zijn verzoek te adviseren
      omtrent de afwijzingsgronden voor aanvragen om garantstelling, bedoeld in de [artikelen 22][ref1] en
      [24 van het besluit][ref2].

      2 De commissie bestaat uit ten minste vier en ten hoogste zes leden.

      3 De voorzitter en de andere leden worden door de minister voor een termijn van ten hoogste drie jaar benoemd.


