  - number: 3.2.11
    text: |-
      1 De ontvanger van TKI-toeslag draagt zorg voor een administratie:

      a. waaruit op eenvoudige en duidelijke wijze kan worden afgeleid hoe de TKI-toeslag wordt aangewend voor het
      uitvoeren van de in het TKI-programma opgenomen samenwerkingsprojecten en innovatie activiteiten;

      b. waarin de wijze wordt vastgelegd waarop participanten van samenwerkingsprojecten omgaan met intellectueel
      eigendom dat voorkomt uit deze projecten;

      c. waaruit op eenvoudige wijze kennis genomen kan worden van de samenwerkingsovereenkomsten voor de projecten
      waarvoor een private bijdrage als bedoeld in [artikel 3.2.3, eerste lid][ref1], verschuldigd is geworden.

      2 De TKI-toeslag kan op nihil worden vastgesteld indien de administratie, bedoeld in het eerste lid, geheel of
      gedeeltelijk ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.2.3
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.2.11
