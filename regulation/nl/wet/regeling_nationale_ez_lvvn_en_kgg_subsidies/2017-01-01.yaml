  - number: 4.3.7
    text: |-
      1 Indien subsidie is verstrekt voor het boren van een half-doublet en de gegarandeerde put de eerste put van het
      doublet is, geldt dat:

      a. indien het gerealiseerde vermogen van de eerste put gelijk aan of meer dan 75% van het verwacht vermogen is, de
      subsidie op nihil wordt vastgesteld indien de subsidieontvanger niet overgaat tot het boren van het doublet en het
      plaatsen van een pompinstallatie;

      b. indien de subsidieontvanger na het boren van de eerste put overgaat tot het boren van het doublet en het
      plaatsen van een pompinstallatie, [artikel 4.3.9][ref1] van toepassing is op de eerste put;

      c. indien het gerealiseerde vermogen van de eerste put minder dan 75% van het verwacht vermogen is,
      [artikel 4.3.8][ref2] van toepassing is wanneer de subsidieontvanger niet overgaat tot het boren van het doublet.

      2 Indien subsidie is verstrekt voor het boren van een half doublet, en de gegarandeerde put de tweede put van het
      doublet, of een vervolgput is, is [artikel 4.3.9][ref3] van toepassing op deze put.

      3 [Artikel 4.3.6, tweede lid][ref4], is van overeenkomstige toepassing op een aardwarmteproject en een diep
      aardwarmteproject waarbij de subsidie is verstrekt voor het boren van een half-doublet.


