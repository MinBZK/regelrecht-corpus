        bwb_id: BWBR0035474
        artikel: 3.16.1
        hoofdstuk: '3'
        paragraaf: 3.16.1
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.16.13
    text: |-
      1 De subsidie bestaat uit een geldlening voor een bedrag gelijk aan het totaal van de door de academische
      innovatieve starter of hbo-innovatieve starter voorziene kosten voor het vroegefasetraject doch ten hoogste
      € 250.000.

      2 De kosten gemaakt door de academische innovatieve starter of hbo-innovatieve starter als natuurlijke
      persoon worden berekend door het aantal uren dat hij ten behoeve van het vroegefasetraject heeft gemaakt te
      vermenigvuldigen met een vast uurtarief.

      3 Het vaste uurtarief bedoeld in het tweede lid is € 35 per uur.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.16.13
  - number: 3.16.14
    text: |-
      De minister beslist afwijzend op een aanvraag:

      a. indien aannemelijk is dat de academische innovatieve starter of hbo-innovatieve starter de financiering waarvoor
      de aanvraag is ingediend zelf heeft of kan verkrijgen bij anderen;

      b. voor zover de voorziene kosten van het vroegefasetraject hoger zijn dan € 250.000 of lager dan zijn € 50.000;

      c. indien onvoldoende vertrouwen bestaat dat de academische innovatieve starter of hbo-innovatieve starter het
      vroegefasetraject in uitvoeringstechnische zin zo zal kunnen voltooien dat hij financiering voor de fase na het
      vroegefasetraject zal kunnen verkrijgen;

      d. indien onvoldoende vertrouwen bestaat dat de academische innovatieve starter of hbo-innovatieve starter de
      geldlening, bedoeld in [artikel 3.16.12, eerste lid][ref1], kan terugbetalen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.16.12
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.16.14
