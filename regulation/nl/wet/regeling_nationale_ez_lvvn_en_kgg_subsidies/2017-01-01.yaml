      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.9.2
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0035474
        artikel: 3.9.2
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0035474
        artikel: 3.9.2
        hoofdstuk: '3'
  - number: 3.9.14
    text: |-
      De subsidie, bedoeld in [artikel 3.9.2][ref1] bevat staatssteun en wordt gerechtvaardigd door artikel 25 van de
      algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.9.2
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.9.14
