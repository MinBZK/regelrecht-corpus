    text: |-
      1 De subsidie bestaat uit een geldlening voor een bedrag gelijk aan:

      a. 35 procent van de door de MKB-ondernemer die een middelgrote onderneming in stand houdt voorziene kosten van het
      vernieuwingsfasetraject doch ten hoogste € 122.500;

      b. 45 procent van de door de MKB-ondernemer die een kleine onderneming in stand houdt voorziene kosten van het
      vernieuwingsfasetraject doch ten hoogste € 157.500.

      2 De kosten gemaakt door de MKB-ondernemer als natuurlijke persoon worden berekend door het aantal uren dat hij ten
      behoeve van het vernieuwingstraject heeft gemaakt te vermenigvuldigen met een vast uurtarief.

      3 Het vaste uurtarief bedoeld in het tweede lid is € 35 per uur.
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel3.16.3
  - number: 3.16.4
    text: |-
      1 De minister beslist afwijzend op een aanvraag:

      a. indien het vernieuwingsfasetraject geen experimentele ontwikkeling vormt;

      b. indien aannemelijk is dat de MKB-ondernemer de financiering waarvoor de aanvraag is ingediend zelf heeft of kan
      verkrijgen bij anderen;

      c. indien onvoldoende aannemelijk is dat de toekomstige investeerder aan de hand van het vernieuwingsfaseplan het
      plan heeft opgevat de MKB-ondernemer te financieren of de toekomstige investeerder daar naar verwachting niet toe
      in staat zal zijn;

      d. voor zover de begrote kosten van het vernieuwingsfasetraject hoger zijn dan € 350.000 of

      1°. lager zijn dan € 142.000 indien de MKB-ondernemer een middelgrote onderneming in stand houdt, of

      2°. lager zijn dan € 110.000 indien de MKB-ondernemer een kleine onderneming in stand houdt;

      e. indien onvoldoende vertrouwen bestaat dat de MKB-ondernemer een vernieuwingsfasetraject in uitvoeringstechnische
      zin zo zal kunnen voltooien dat hij financiering voor de fase na het vernieuwingsfasetraject zal kunnen verkrijgen
      van de toekomstige investeerder;

      f. indien onvoldoende vertrouwen bestaat dat de MKB-ondernemer de geldlening bedoeld in
      [artikel 3.16.2, eerste lid][ref1], kan terugbetalen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.16.2
