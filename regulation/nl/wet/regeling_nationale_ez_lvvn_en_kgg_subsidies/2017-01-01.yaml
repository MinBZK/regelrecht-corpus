      1 Een aanvraag voor subsidie als bedoeld in [artikel 4.8.2][ref1] bevat ten minste de gegevens, bedoeld in artikel
      6, tweede lid, van de algemene groepsvrijstellingsverordening.

      2 Onverminderd het eerste lid bevat een aanvraag voor subsidie ten minste:

      a. gegevens over de aanvrager, waaronder het nummer waaronder de onderneming geregistreerd is bij de Kamer van
      Koophandel, het post- en bezoekadres en het rekeningnummer;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. gegevens over de inrichting waarvoor een energie-efficiëntieplan wordt opgesteld of geactualiseerd waaronder het
      post- en bezoekadres;

      d. een verklaring dat de subsidie voor het opstellen of actualiseren van het energie-efficiëntieplan niet meer
      bedraagt dan is toegestaan op grond van [artikel 4.8.4.][ref2];

      e. een verklaring dat de afwijzingsgronden, bedoeld in [artikel 4.8.7.][ref3] niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4.8.2
