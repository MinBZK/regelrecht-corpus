  - number: 2.4.1
    text: |-
      In deze titel wordt verstaan onder:

        - *agrarische HBO-instelling:* instelling voor hoger onderwijs als bedoeld in
      [artikel 1.2, onderdeel a, van de Wet op het Hoger Onderwijs en Wetenschappelijk onderzoek][ref1], op het gebied
      van landbouw en natuurlijke omgeving;
        - *groene-plus lectoraat:* lectoraat dat zich op basis van deze regeling bezighoudt met thema’s op het gebied van
      landbouw en natuurlijke omgeving;
        - *HBO:* Hoger beroepsonderwijs als bedoeld in
      [artikel 1.1, onderdeel d, van de Wet op Hoger Onderwijs en Wetenschappelijk onderzoek][ref2];
        - *kenniskring:* samenwerkingsverband van een lectoraat, docenten en anderen waarbinnen inhoudelijke expertise op
      een bepaald gebied gebundeld en verder ontwikkeld wordt;
        - *lector:* hoog gekwalificeerde professional die ruime ervaring heeft met onderwijs en onderzoek op een bepaald
      vakgebied en die door zijn prestaties een groot gezag geniet als deskundige;
        - *lectoraat:* samenwerkingsverband dat onder leiding staat van een lector.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0035474/2017-01-01#Artikel2.4.1
    references:
