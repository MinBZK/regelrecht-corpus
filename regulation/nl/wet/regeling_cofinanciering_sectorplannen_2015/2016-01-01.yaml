  - number: '4.5'
    text: |-
      1 De hoofdaanvrager dient binnen dertien weken na beëindiging van de uitvoering van de in de subsidiebeschikking
      genoemde maatregelen, doch uiterlijk binnen dertien weken na afloop van de termijn, bedoeld in
      [artikel 1.2, zesde lid][ref1], een verzoek tot vaststelling van subsidie in bij de minister onder gebruikmaking
      van het daartoe door de minister beschikbaar gestelde (elektronisch) formulier.

      2 Bij het verzoek tot vaststelling van subsidie wordt een verantwoording inclusief einddeclaratie gevoegd. De
      hoofdaanvrager verstrekt bij de verantwoording het burgerservicenummer van de deelnemers per maatregel in het
      sectorplan waarvoor cofinanciering is verstrekt. De verantwoording bevat ten minste de gerealiseerde aantallen, de
      aard en de kosten van de maatregelen en de resultaten.

      3 Indien de minister toestemming heeft gegeven om een sectorplan te verlengen als bedoeld in [artikel 1.2a][ref2],
      dient de hoofdaanvrager binnen dertien weken na beëindiging van de uitvoering van de in de subsidiebeschikking
      genoemde maatregelen, doch uiterlijk binnen dertien weken na afloop van een termijn van dertig maanden na de datum
      van die subsidiebeschikking, een verzoek tot vaststelling van subsidie van het sectorplan in bij de minister onder
      gebruikmaking van het daartoe door de minister beschikbaar gestelde (elektronisch) formulier.

      4 De minister beslist binnen 22 weken na ontvangst van het verzoek tot vaststelling van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0035840#Artikel1.2
      [ref2]: https://wetten.overheid.nl/BWBR0035840#Artikel1.2a
