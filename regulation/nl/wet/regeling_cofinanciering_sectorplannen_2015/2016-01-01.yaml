  - number: '2.3'
    text: |-
      1 Het aangevraagde subsidiebedrag bedraagt ten minste 125.000 EUR, exclusief overhead als bedoeld in
      [artikel 4.6, tweede lid][ref1].

      2 De subsidieaanvraag wordt gedaan middels een namens de minister verstrekt (elektronisch) formulier.

      3 De subsidieaanvraag wordt niet in behandeling genomen indien de hoofdaanvrager in hetzelfde aanvraagtijdvak reeds
      een aanvraag heeft ingediend met betrekking tot dezelfde sectoren, branches of arbeidsmarktregio’s, en die aanvraag
      op grond van deze regeling geheel of gedeeltelijk is toegekend.

      4 Bij de aanvraag worden de volgende stukken overlegd:

      a. een samenwerkingsovereenkomst die is ondertekend door alle partijen die zijn betrokken in het
      samenwerkingsverband dat het sectorplan heeft opgesteld;

      b. een schriftelijke machtiging waaruit blijkt dat de hoofdaanvrager gemachtigd is het samenwerkingsverband in en
      buiten rechte te vertegenwoordigen;

      c. een analyse waarin inzicht wordt gegeven in de arbeidsbehoefte en het beschikbare arbeidsaanbod, hetgeen
      leidt tot een arbeidsmarktknelpunt nu en in de komende vijf jaren in beroepen in de sectoren, branches of
      arbeidsmarktregio’s waarop het sectorplan betrekking heeft;

      d. een plan van aanpak met ten minste de doelstellingen en beoogde effecten, maatregelen, de doelgroepen voor
      de maatregelen, het aantal toepassingen per maatregel en de hiermee beoogde resultaten voor het oplossen van de
      knelpunten, bedoeld in onderdeel c;

      e. een beschrijving van de uitvoering van het sectorplan, die in ieder geval een omschrijving van de organisatie en
      een tijdpad bevat;

      f. een beschrijving van de voorwaarden waaronder de verschillende maatregelen worden uitgevoerd en de wijze waarop
      deze voorwaarden worden gehandhaafd;

      g. een onderbouwde begroting van de kosten van de maatregelen waarvoor cofinanciering wordt aangevraagd, waaruit
      blijkt welke activiteiten zullen worden ondernomen, de bij behorende kosten en hoe tot de inschatting van deze
      kosten is gekomen, met inbegrip van een liquiditeitsprognose en een financieringsplan waaruit blijkt hoe de
      maatregelen gefinancierd worden en dat de aangevraagde cofinanciering noodzakelijk is voor de uitvoering van de
      maatregelen in het sectorplan;

      h. een omschrijving van de wijze van financiering van structurele maatregelen die worden voortgezet nadat de
      tijdelijke cofinanciering is beëindigd; en

      i. een overeenkomst tussen de werkgevers- en werknemersorganisaties waarin, indien gebruik is gemaakt van de
      mogelijkheid tot afwijken als bedoeld in [artikel 3.6, vijfde lid][ref2], de afwijkende termijn en afwijkende
      regels zijn opgenomen.

      5 Dertien weken na ontvangst van de volledige aanvraag wordt beschikt. Deze termijn wordt opgeschort gerekend vanaf
      de dag na de dag waarop de indiener, op grond van [artikel 4:5 van de Algemene wet bestuursrecht][ref3], in de
      gelegenheid is gesteld om zijn aanvraag aan te vullen.

      6 Door het indienen van een aanvraag stemt de hoofdaanvrager er namens het samenwerkingsverband mee in dat het
      subsidiedossier met uitzondering van persoonsgegevens openbaar wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0035840#Artikel4.6
      [ref2]: https://wetten.overheid.nl/BWBR0035840#Artikel3.6
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel45
