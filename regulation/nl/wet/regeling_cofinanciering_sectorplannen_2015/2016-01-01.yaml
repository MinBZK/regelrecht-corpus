preamble:
  text: |-
    Gelet op de artikelen 2, 3 en 5 van de Kaderwet SZW-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0035840/2016-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *aanvraagtijdvak:* een door de minister vastgesteld tijdvak waarin aanvragen tot cofinanciering van sectorplannen
      kunnen worden ingediend;
        - *algemene opleiding:* een interne of externe opleiding, niet zijnde bedrijfsspecifieke training, met als
      oogmerk de leerling vakspecifieke beroepsvaardigheden aan te leren, de opleiding leidt tot een erkend diploma of
      certificaat;
        - *ander beroep:* een ander beroep dan het beroep dat de werknemer of de zelfstandige zonder personeel uitoefent of
      dat de WW-gerechtigde voorheen uitoefende, voor zover dit beroep wordt uitgeoefend bij een andere werkgever, en in
      het geval van een WW-gerechtigde bij een andere werkgever dan de werkgever waarbij de werkloosheid is ontstaan;
        - *arbeidsmarktregio:* een arbeidsmarktregio die is opgenomen in [bijlage 1][ref1] bij deze regeling;
        - *arbeidsorganisatie:* iedere eenheid, ongeacht haar rechtsvorm, die economische activiteiten uitoefent;
        - *baangarantie:* zekerheid op een arbeidsovereenkomst of een aanstelling in openbare dienst van ten minste één
      jaar direct nadat de algemene opleiding succesvol is afgerond, met een minimale omvang per week van het gemiddelde
      aantal gewerkte uren en het aantal uren gevolgde scholing in de scholingsperiode voorafgaand aan het afronden
      daarvan;
        - *beroepsbegeleidende leerweg:* een leerweg als bedoeld in
      [artikel 7.2.7, tweede en vierde lid, van de Wet educatie en beroepsonderwijs][ref2];
        - *branche:* een tak van een handel of nijverheid binnen een sector;
        - *beroep:* een beroep opgenomen in de Standaard Beroepenclassificatie 2010, van het Centraal Bureau voor de
      Statistiek, dan wel in afwijking daarvan een door de sector erkend beroep;
        - *bijscholing:* een algemene opleiding om de vakspecifieke beroepsvaardigheden binnen een beroep te actualiseren;
        - *CAO:* een collectieve arbeidsovereenkomst als bedoeld in
      [artikel 1, eerste lid, van de Wet op de collectieve arbeidsovereenkomst][ref3];
        - *centrale werkgeversorganisatie:* een organisatie van werkgevers die is opgenomen in [bijlage 2][ref4] bij deze
      regeling;
        - *centrumgemeente:* een als zodanig in [bijlage 1][ref5] bij deze regeling aangemerkte gemeente;
        - *cofinanciering:* het deel van de kosten in de begroting van het sectorplan dat op grond van deze regeling wordt
      gesubsidieerd;
        - *hoofdaanvrager:* de rechtspersoon die namens een samenwerkingsverband een sectorplan indient en de subsidie
      aanvraagt op grond van deze regeling;
        - *loonkosten:* het brutoloon van de werknemer vermeerderd met een percentage van 32% van dit brutoloon, bij de
      bepaling van de loonkosten per uur wordt een norm gehanteerd van 1.720 uur bij een dienstverband van 40 uur per
      week, of op het maximaal aantal werkbare uren gebaseerd op afspraken in de betreffende CAO;
        - *maatregelen:* alle activiteiten die tot realisatie van de doelen van het sectorplan leiden;
        - *de minister:* de Minister van Sociale Zaken en Werkgelegenheid;
        - *O&O-fonds:* een Opleidings- en Ontwikkelingsfonds, opgericht in een bij de minister aangemelde collectieve
      arbeidsovereenkomst;
        - *omscholing:* een algemene opleiding, die benodigd is om de werknemer, de zelfstandige zonder personeel of de WW-
      gerechtigde in staat te stellen om een ander beroep uit te oefenen en de opleiding daartoe een adequaat middel is,
      met een duur van maximaal één jaar of bij een beroepsbegeleidende leerweg van maximaal twee jaar;
        - *prestatie:* de daadwerkelijk uitgevoerde maatregelen;
        - *project:* het geheel van gelijksoortige maatregelen, dat wordt uitgevoerd door een arbeidsorganisatie en dat
      wordt gesubsidieerd op grond van deze regeling;
        - *samenwerkingsverband:* een samenwerkingsverband dat ten minste bestaat uit één werkgeversorganisatie en één
      werknemersorganisatie;
        - *sector:* een sector die is opgenomen in [bijlage 3][ref6] bij deze regeling;
        - *sectorplan:* een door een hoofdaanvrager namens een samenwerkingsverband ingediend plan met maatregelen voor
      knelpunten die blijkens een arbeidsmarktanalyse in de betreffende sector, branches of arbeidsmarktregio’s aanwezig
      zijn;
        - *subsidiabele activiteiten:* alle maatregelen in het sectorplan die voor cofinanciering in aanmerking komen;
        - *subsidiedossier:* het subsidiedossier bevat de volgende documenten: het sectorplan, de aanvraag, gevoerde
      correspondentie in het kader van de aanvraag, eventueel voorgenomen besluit en zienswijze, de beschikking,
      gevoerde correspondentie na de beschikking, eventuele wijziging van de beschikking, gevoerde correspondentie over
      voorschotten, tussen- en eindrapportages, vaststellingsbeschikkingen en gegevens in het kader van evaluatie;
        - *werknemer:* de natuurlijke persoon, jonger dan de pensioengerechtigde leeftijd, die op grond van een
      arbeidsovereenkomst, dan wel een aanstelling in openbare dienst, arbeid verricht als werknemer;
        - *werkgeversorganisatie:* een vereniging met volledige rechtsbevoegdheid van werkgevers die partij is bij een op
      het moment van aanvraag voor de sector geldende collectieve arbeidsovereenkomst, of een voor de sector geldende
      collectieve arbeidsvoorwaardenregeling voor personen werkzaam in openbare dienst, dan wel bij afwezigheid daarvan
      bij de laatst voor de sector geldende collectieve arbeidsovereenkomst of collectieve arbeidsvoorwaardenregeling,
      dan wel een vereniging met volledige rechtsbevoegdheid van werkgevers die is aangesloten bij een centrale
      werkgeversorganisatie;
        - *WW-gerechtigde:* de persoon die recht heeft op een uitkering op grond van
      [hoofdstuk II van de Werkloosheidswet][ref7];
        - *werknemersorganisatie:* vereniging met volledige rechtsbevoegdheid van werknemers die partij is bij een op
      het moment van aanvraag voor de sector geldende collectieve arbeidsovereenkomst of een voor de sector geldende
      collectieve arbeidsvoorwaardenregeling voor personen werkzaam in openbare dienst, dan wel bij afwezigheid daarvan
      bij de laatst voor de sector geldende collectieve arbeidsovereenkomst of collectieve arbeidsvoorwaardenregeling;
        - *zelfstandige zonder personeel:* een persoon die voor de toepassing van de [Wet inkomstenbelasting 2001][ref8]
      ondernemer is en geen personeel in dienst heeft.


