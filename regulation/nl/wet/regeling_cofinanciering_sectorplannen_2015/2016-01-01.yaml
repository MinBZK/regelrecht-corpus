    text: |-
      Voor subsidie komen in aanmerking maatregelen zoals opgenomen in de [artikelen 3.2 tot en met 3.5][ref1], of een
      samenstelling daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0035840#Artikel3.2
