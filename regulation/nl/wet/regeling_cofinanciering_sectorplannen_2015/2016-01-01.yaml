  - number: 1.2a
    text: |-
      1 De minister kan op verzoek van de hoofdaanvrager eenmalig de looptijd van een sectorplan met maximaal zes maanden
      verlengen, waarbij [artikel 1.2, zesde lid][ref1], onverminderd van toepassing blijft.

      2 Het verzoek, bedoeld in het eerste lid, wordt niet eerder ingediend dan het moment waarop het tussentijds
      voortgangsverslag, bedoeld in [artikel 4.4, eerste lid][ref2], is overlegd en niet later dan het moment waarop 24
      maanden zijn verstreken na de datum van de subsidiebeschikking.


