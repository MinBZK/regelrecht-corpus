  - number: '2.5'
    text: |-
      1 Een aanvraag tot verlening van subsidie wordt in ieder geval geheel of gedeeltelijk geweigerd, indien naar het
      oordeel van de minister:

      a. de subsidieaanvraag niet voldoet aan de daaraan bij en krachtens deze regeling gestelde eisen;

      b. de arbeidsmarktanalyse, bedoeld in [artikel 2.3, vierde lid, onder c][ref1], onvoldoende inzicht geeft in de
      arbeidsmarktknelpunten en oplossingsrichtingen;

      c. de gekozen maatregelen waarvoor cofinanciering wordt aangevraagd niet voldoende aansluiten bij de sectoranalyse;

      d. onvoldoende is aangetoond dat de aanwending van middelen voor de gekozen maatregelen effectief en efficiënt is;

      e. de beoogde maatregelen, prestaties en resultaten onvoldoende objectief meetbaar zijn geformuleerd;

      f. de kosten van de maatregelen waarvoor cofinanciering wordt aangevraagd, niet voldoende zijn onderbouwd;

      g. onvoldoende is aangetoond hoe de maatregelen gefinancierd worden en dat cofinanciering noodzakelijk is voor het
      uitvoeren van de maatregelen waarvoor cofinanciering is aangevraagd;

      h. onvoldoende is aangetoond hoe structurele maatregelen na afloop van de tijdelijke cofinanciering zullen worden
      voortgezet en hoe deze zullen worden gefinancierd;

      i. de omvang van het aangevraagde subsidiebedrag de relatieve omvang en problematiek van het samenwerkingsverband
      op de arbeidsmarkt overstijgt;

      j. de kosten van de maatregelen niet in een redelijke verhouding staan tot de voorgenomen prestaties en de daarvan
      te verwachten resultaten;

      k. onvoldoende zekerheid bestaat over de eigen financiering van de kosten van de maatregelen en overhead;

      l. onvoldoende zekerheid bestaat dat de administratie van de hoofdaanvrager zal voldoen aan de daaraan gestelde
      eisen;

      m. de gekozen maatregelen waarvoor cofinanciering wordt aangevraagd niet voldoen aan de voorwaarden gesteld in
      [hoofdstuk 3][ref2];

      n. het sectorplan niet open staat voor alle arbeidsorganisaties binnen de sector of de arbeidsmarktregio; of

      o. onvoldoende is aangetoond dat de partij uit het samenwerkingsverband die zich alleen garant heeft gesteld voor
      80% van het aangevraagde subsidiebedrag, over voldoende middelen beschikt om garantstelling te waarborgen.

      2 Een aanvraag tot verlening van subsidie wordt in ieder geval geheel geweigerd, indien het totale te verstrekken
      subsidiebedrag lager is dan 125.000 EUR.


      [ref1]: https://wetten.overheid.nl/BWBR0035840#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0035840#Hoofdstuk3
