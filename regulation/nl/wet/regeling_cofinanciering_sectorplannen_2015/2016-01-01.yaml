  - number: '1.4'
    text: |-
      1 De minister stelt 150 miljoen EUR beschikbaar voor de cofinanciering van sectorplannen, welk bedrag wordt
      onderverdeeld in door de minister vast te stellen aanvraagtijdvakken met voor de tijdvakken afzonderlijk vast te
      stellen subsidieplafonds.

      2 De mogelijkheid tot het indienen van aanvragen voor subsidie bestaat slechts gedurende door de minister
      vastgestelde aanvraagtijdvakken. Indien deze mogelijkheid wordt geopend, wordt hiervan vooraf door de minister in
      de Staatscourant mededeling gedaan met vermelding van het subsidieplafond voor dat aanvraagtijdvak.
    url: https://wetten.overheid.nl/BWBR0035840/2016-01-01#Artikel1.4
  - number: '1.5'
    text: |-
      1 Voor het bepalen van het bereiken van het subsidieplafond binnen een aanvraagtijdvak, worden de subsidieaanvragen
      op volgorde van binnenkomst behandeld, waarbij alleen een volledige subsidieaanvraag in behandeling wordt
      genomen. Van een volledige subsidieaanvraag is sprake wanneer wordt voldaan aan de voorwaarden opgenomen in
      [artikel 2.3][ref1].

      2 Wanneer de hoofdaanvrager op grond van [artikel 4:5 van de Algemene wet bestuursrecht][ref2] in de gelegenheid
      is gesteld zijn aanvraag tot cofinanciering aan te vullen, geldt als moment van binnenkomst de datum en tijd van
      ontvangst van de volledige aanvraag tot cofinanciering.


      [ref1]: https://wetten.overheid.nl/BWBR0035840#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel45
