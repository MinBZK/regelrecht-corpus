  - number: '2.4'
    text: |-
      1 De minister kan subsidie verlenen voor de cofinanciering van maatregelen in een sectorplan.

      2 De subsidie wordt verleend aan de hoofdaanvrager.

      3 De beschikking tot verlening van subsidie betreft de voor cofinanciering in aanmerking komende maatregelen, en
      het aantal toepassingen van deze maatregelen, zoals vastgelegd in het bij de subsidieaanvraag gevoegde sectorplan.

      4 In de beschikking wordt de periode opgenomen waarbinnen de maatregelen waarvoor cofinanciering wordt toegekend,
      worden uitgevoerd. Tevens wordt in de beschikking het maximumbedrag bepaald dat aan subsidie tegemoet kan worden
      gezien. Bij de bepaling van dit bedrag wordt uitgegaan van het totaal van de kosten van de maatregelen waarvoor
      cofinanciering wordt aangevraagd, zoals door de hoofdaanvrager geraamd in zijn aanvraag tot cofinanciering,
      met dien verstande dat bepaalde, in de beschikking te vermelden, maatregelen en kostenposten buiten beschouwing
      kunnen worden gelaten dan wel op een lager bedrag kunnen worden bepaald, voor zover de desbetreffende uitgaven
      redelijkerwijs niet noodzakelijk geacht worden voor de uitvoering van het sectorplan, dan wel onredelijk hoog zijn
      of uit anderen hoofde worden vergoed.

      5 In de beschikking worden de prestaties benoemd waarvoor subsidie wordt verleend en waarop de
      verantwoording en de subsidievaststelling zal plaatsvinden, en wordt aan de hand van het tijdpad, bedoeld in
      [artikel 2.3, vierde lid, onder e][ref1], aangegeven in welke periode deze prestaties worden behaald en of hiervoor
      voorschotten worden verleend.

      6 Aan de beschikking tot verlening van subsidie kunnen nadere verplichtingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0035840#Artikel2.3
    url: https://wetten.overheid.nl/BWBR0035840/2016-01-01#Artikel2.4
