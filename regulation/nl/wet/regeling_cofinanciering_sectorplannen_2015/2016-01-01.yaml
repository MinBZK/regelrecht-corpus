  - number: '3.2'
    text: |-
      1 De sectorplannen kunnen maatregelen bevatten die sectorale of intersectorale mobiliteit van werknemers naar een
      ander beroep bij een andere werkgever bevorderen.

      2 Kosten voor maatregelen komen slechts voor cofinanciering in aanmerking voor zover zij betrekking hebben op ten
      minste één van de volgende activiteiten:

      a. begeleiding en bemiddeling richting een nieuwe baan, bij een andere werkgever in een ander beroep;

      b. opzetten, onderhouden en uitbreiden van infrastructuur voor van werk naar werk projecten;

      c. in kaart brengen van de competenties van de werknemer; of

      d. omscholing.
    url: https://wetten.overheid.nl/BWBR0035840/2016-01-01#Artikel3.2
  - number: '3.3'
    text: |-
      1 De sectorplannen kunnen maatregelen bevatten die sectorale of intersectorale mobiliteit van werknemers in
      hetzelfde beroep, bij een andere werkgever, bevorderen.

      2 Kosten voor maatregelen komen slechts voor cofinanciering in aanmerking voor zover zij betrekking hebben op ten
      minste één van de volgende activiteiten:

      a. begeleiding en bemiddeling richting een nieuwe baan, bij een andere werkgever, in hetzelfde beroep;

      b. opzetten, onderhouden en uitbreiden van infrastructuur voor van werk naar werk projecten;

      c. in kaart brengen van de competenties van de werknemer; of

      d. bijscholing.
    url: https://wetten.overheid.nl/BWBR0035840/2016-01-01#Artikel3.3
  - number: '3.4'
    text: |-
      1 De sectorplannen kunnen maatregelen bevatten die sectorale of intersectorale mobiliteit van WW-gerechtigden
      bevorderen, naar hetzelfde of een ander beroep, bij een andere werkgever dan de werkgever waarbij de werkloosheid
      is ontstaan.

      2 Kosten voor maatregelen komen slechts voor cofinanciering in aanmerking voor zover zij betrekking hebben op ten
      minste één van de volgende activiteiten:

      a. begeleiding en bemiddeling richting een baan, in hetzelfde of een ander beroep;

      b. uitbreiden van infrastructuur voor trajecten naar werk;

      c. in kaart brengen van de competenties van de uitkeringsgerechtigde; of

      d. om- of bijscholing.
    url: https://wetten.overheid.nl/BWBR0035840/2016-01-01#Artikel3.4
  - number: '3.5'
    text: |-
      1 De sectorplannen kunnen maatregelen bevatten om zelfstandigen zonder personeel of personen, niet zijnde
      werknemers of WW-gerechtigden of personen die fulltime een opleiding volgen, te begeleiden naar hetzelfde of een
      ander beroep.

      2 Kosten voor maatregelen komen slechts voor cofinanciering in aanmerking voor zover zij betrekking hebben op ten
      minste één van de volgende activiteiten:

      a. begeleiding en bemiddeling richting een baan, in hetzelfde of een ander beroep;

      b. uitbreiden van infrastructuur voor overig naar werk trajecten;

      c. in kaart brengen van de competenties van de persoon; of

      d. om- of bijscholing.
    url: https://wetten.overheid.nl/BWBR0035840/2016-01-01#Artikel3.5
  - number: '3.6'
    text: |-
      1 Maatregelen als bedoeld in de [artikelen 3.2 tot en met 3.5][ref1], die tot doel hebben om werknemers op te
      leiden door middel van algemene opleiding kunnen voor cofinanciering in aanmerking komen. De subsidiabele kosten
      zijn:

      a. de loonkosten van de opleiders en diegene die bij de werkgever waarbij de arbeidsovereenkomst zal worden
      beëindigd, werkzaam zijn en een opleiding volgen;

      b. verplaatsings- en verblijfskosten;

      c. opleidingsbenodigdheden;

      d. begeleiding en advisering van opleidingstrajecten.

      2 Een maatregel komt slechts voor cofinanciering in aanmerking voor zover het subsidiebedrag niet meer dan 2
      miljoen euro per arbeidsorganisatie per opleidingsproject bedraagt.

      3 Indien een deelnemer aan de opleidingen, bedoeld in dit hoofdstuk, recht heeft op een uitkering op grond
      van [hoofdstuk II van de Werkloosheidswet][ref2] informeert de hoofdaanvrager namens de uitvoerders van de
      opleidingen het Uitvoeringsinstituut werknemersverzekeringen eenmaal per zes maanden over de deelnemers die de
      opleidingstrajecten volgen.

      4 De hoofdaanvrager geeft een verklaring van deelname aan de deelnemer indien:

      a. er omscholing als bedoeld in de [artikelen 3.2][ref3] en [3.4][ref4] of bijscholing als bedoeld in artikel 3.4
      wordt gevolgd waarvoor op grond van het sectorplan subsidie is verleend; en

      b. de werkgever direct na afloop van de scholing een baangarantie van ten minste één jaar biedt.

      5 De werkgeversorganisaties en werknemersorganisaties uit het samenwerkverband kunnen gezamenlijk afwijken van
      de duur van de baangarantie als bedoeld in het vierde lid, onderdeel b, en afwijkende regels stellen over de
      baangarantie, waarbij ook kan worden bepaald dat de sector of de arbeidsmarktregio, in plaats van de werkgever, de
      baangarantie verstrekt.

      6 De maximale termijn, bedoeld in [artikel 1.2, zesde lid][ref5], en hetgeen is bepaald in
      [artikel 4.2, eerste lid, onderdeel c][ref6], zijn niet van toepassing indien de maatregelen bestaan uit
      scholing in de vorm van een beroepsbegeleidende leerweg, mits er binnen twaalf maanden na de datum van de
      subsidiebeschikking, bedoeld in [artikel 2.4][ref7], een aanvang wordt gemaakt met de uitvoering. In afwijking van
      [artikel 4.5, eerste lid][ref8], dient de hoofdaanvrager binnen dertien weken na beëindiging van de uitvoering van
      alle in de subsidiebeschikking genoemde maatregelen, doch uiterlijk binnen dertien weken na afloop van een termijn
      van zesendertig maanden na de datum van die subsidiebeschikking een aanvraag tot subsidievaststelling van het
      volledige sectorplan in bij de minister onder gebruikmaking van het daartoe door de minister beschikbaar gestelde
      (elektronisch) formulier.


