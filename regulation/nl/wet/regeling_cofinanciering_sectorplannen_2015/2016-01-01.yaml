  - number: '1.3'
    text: |-
      Op deze regeling is de [Algemene regeling SZW-subsidies][ref1] van toepassing voor zover daarvan in deze regeling
      niet wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0009211
