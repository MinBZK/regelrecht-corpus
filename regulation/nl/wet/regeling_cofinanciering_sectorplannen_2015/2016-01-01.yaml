  - number: '4.6'
    text: |-
      1 Kosten voor overhead en aan overhead gerelateerde exploitatiekosten van de hoofdaanvrager komen voor 50% van een
      forfaitair bedrag als bedoeld in het vierde lid, voor cofinanciering in aanmerking.

      2 Onder kosten voor overhead en aan overhead gerelateerde exploitatiekosten worden verstaan alle niet directe
      kosten waaronder inbegrepen de kosten van administratie en beheer en de kosten van de controleverklaring, bedoeld
      in [artikel 4.4, vierde lid][ref1], en de [Algemene regeling SZW-subsidies][ref2].

      3 De kosten voor overhead worden niet in de begroting bij de aanvraag tot cofinanciering opgenomen doch door de
      minister vastgesteld op een percentage van het in de subsidievaststelling bepaalde bedrag aan subsidiabele kosten
      exclusief de overheadkosten.

      4 Het percentage, bedoeld in het derde lid, bedraagt de som van:

      a. 15% van het in de subsidievaststelling bepaalde bedrag aan subsidiabele kosten exclusief de overheadkosten tot
      1.000.000 EUR;

      b. 7% van het in de subsidievaststelling bepaalde bedrag aan subsidiabele kosten exclusief de overheadkosten tussen
      1.000.000 EUR en 10.000.000 EUR;

      c. 1% van het in de subsidievaststelling bepaalde bedrag aan subsidiabele kosten exclusief de overheadkosten boven
      10.000.000 EUR.


