  - number: '4.1'
    text: |-
      1 De subsidie ten behoeve van maatregelen bedraagt 50% van de subsidiabele kosten, doch ten hoogste het in de
      beschikking tot subsidieverlening vermelde maximumbedrag.

      2 Indien bij het controleren van de einddeclaratie blijkt, dat minder dan 60% van de totale subsidiabele kosten,
      genoemd in de beschikking tot subsidieverlening, is gerealiseerd, wordt het subsidiebedrag op nihil vastgesteld.

      3 De subsidie kan bij onderrealisatie, in afwijking van het tweede lid, naar evenredigheid worden verlaagd als naar
      het oordeel van de minister goede gronden aanwezig zijn om de subsidie niet op nihil vast te stellen.
    url: https://wetten.overheid.nl/BWBR0035840/2016-01-01#Artikel4.1
  - number: '4.2'
    text: |-
      1 Onverminderd [artikel 4:48 van de Algemene wet bestuursrecht][ref1] wordt de beschikking tot subsidieverlening
      geheel ingetrokken indien:

      a. de subsidie niet is besteed aan de in de beschikking tot subsidieverlening toegekende subsidiabele kosten;

      b. de in de beschikking tot subsidieverlening opgegeven verplichtingen niet zijn nageleefd; of

      c. binnen 6 maanden na het verlenen van de subsidiebeschikking, geen aanvang is gemaakt met de uitvoering van de
      maatregelen in het sectorplan.

      2 De beschikking tot subsidieverlening kan in afwijking van het eerste lid gedeeltelijk worden ingetrokken indien
      er geen aanleiding is de subsidie geheel in te trekken.

      3 Indien de beschikking tot subsidieverlening geheel of gedeeltelijk wordt ingetrokken, wordt het voorschot dat
      tot dat moment is uitgekeerd, vermeerderd met de wettelijke rente, geheel of gedeeltelijk van de hoofdaanvrager
      teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel448
    url: https://wetten.overheid.nl/BWBR0035840/2016-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:48
  - number: '4.3'
    text: |-
      1 Indien een aanvraag tot cofinanciering van een sectorplan wordt goedgekeurd, kan een voorschot op het totale
      subsidiebedrag worden verstrekt.

      2 Na goedkeuring van het sectorplan kan een voorschot van 10% van het in de beschikking tot subsidieverlening
      vermelde subsidiebedrag worden verstrekt.

      3 Iedere zes maanden na verlening van het eerste voorschot, kan op basis van het in de subsidiebeschikking
      bepaalde tijdpad een tussentijds voorschot worden verleend, tot een maximum van 80% van het in de beschikking tot
      subsidieverlening vermelde subsidiebedrag.

      4 De hoofdaanvrager doet binnen twee maanden na afloop van de periode van zes maanden waarvoor een voorschot is
      verleend melding aan de minister, als de subsidiabele kosten in die periode 75% of minder bedragen dan de in de
      subsidiebeschikking vermelde subsidiabele kosten voor die periode en de voorschotten per jaar gemiddeld 200.000 EUR
      of meer bedragen.

      5 De hoofdaanvrager doet onverwijld schriftelijk melding aan de minister zodra aannemelijk is dat de activiteiten
      waarvoor de subsidie is verleend niet, niet tijdig of niet geheel zullen worden verricht of dat niet, niet tijdig
      of niet geheel aan de aan de subsidie verbonden verplichtingen zal worden voldaan.

      6 De hoofdaanvrager kan bij de aanvraag van cofinanciering op het door de minister beschikbaar gestelde
      (elektronisch) formulier aangeven een voorschot te willen ontvangen. Indien de hoofdaanvrager heeft aangegeven geen
      voorschot te willen ontvangen, wordt deze niet toegekend.
    url: https://wetten.overheid.nl/BWBR0035840/2016-01-01#Artikel4.3
  - number: '4.4'
    text: |-
      1 Voor zover de uitvoering van het sectorplan een periode beslaat van twaalf maanden of langer, overlegt de
      hoofdaanvrager, onder gebruikmaking van het daartoe door de minister (elektronisch) beschikbaar gestelde formulier,
      uiterlijk acht weken na afloop van die twaalf maanden een tussentijds voortgangsverslag.

      Het tussentijds voortgangsverslag bevat ten minste de gerealiseerde aantallen, de aard en de kosten van de
      maatregelen en de resultaten.

      2 Voor zover de uitvoering van het sectorplan door toepassing van [artikel 1.2a][ref1] of
      [artikel 3.6, zesde lid][ref2], een periode beslaat van meer dan 24 maanden, overlegt de hoofdaanvrager, onder
      gebruikmaking van het daartoe door de minister (elektronisch) beschikbaar gestelde formulier, uiterlijk acht weken
      na afloop van die 24 maanden een tussentijds voortgangsverslag. Het tussentijds voortgangsverslag bevat ten minste
      de gerealiseerde aantallen, de aard en de kosten van de maatregelen en de resultaten.

      3 De hoofdaanvrager verstrekt bij het tussentijds voortgangsverslag, onder gebruikmaking van het daartoe door de
      minister (elektronisch) beschikbaar gestelde formulier, aan de minister het burgerservicenummer van de deelnemers
      per maatregel in het sectorplan waarvoor cofinanciering is verstrekt.

      4 Indien de hoofdaanvrager voorschotten ontvangt als bedoeld in [artikel 4.3][ref3], kan de
      minister in de beschikking tot subsidieverlening de verplichting opleggen dat het tussentijdse
      voortgangsverslag is voorzien van een controleverklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4], volgens een door de minister voor te
      schrijven model.


      [ref1]: https://wetten.overheid.nl/BWBR0035840#Artikel1.2a
      [ref2]: https://wetten.overheid.nl/BWBR0035840#Artikel3.6
      [ref3]: https://wetten.overheid.nl/BWBR0035840#Artikel4.3
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel393
