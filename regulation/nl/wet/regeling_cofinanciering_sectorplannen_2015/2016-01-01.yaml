  - number: '1.2'
    text: |-
      1 De sectorplannen worden gefinancierd uit de eigen middelen van de bij het sectorplan betrokken
      werknemersorganisaties en werkgeversorganisaties, de arbeidsorganisaties, werknemers en zelfstandigen zonder
      personeel waarop het sectorplan betrekking heeft.

      2 Indien één of meer provincies of (centrum)gemeenten deel uitmaken van het samenwerkingsverband, kunnen zij, in
      afwijking van het eerste lid, maximaal 50% van de bijdrage van het samenwerkingsverband, financieren.

      3 Onder eigen middelen van arbeidsorganisaties wordt niet verstaan middelen die voor dezelfde activiteiten als
      subsidie of uit private fondsen zijn verstrekt, met uitzondering van de middelen die uit één of meerdere O&O-fonds
      zijn verstrekt.

      4 Het derde lid is niet van toepassing op in Nederland gevestigde rechtspersonen die een of meer subsidies
      ontvangen als bedoeld in [artikel 4.21, eerste lid, van de Algemene wet bestuursrecht][ref1], die tezamen meer
      bedragen dan 50% van de jaarlijkse inkomsten van de rechtspersoon, met uitzondering van naamloze en besloten
      vennootschappen die een op winst gerichte arbeidsorganisatie drijven.

      5 De minister stelt middelen beschikbaar voor de cofinanciering van maatregelen in sectorplannen teneinde subsidie
      te verlenen in de jaren 2015 en 2016.

      6 Maatregelen in sectorplannen komen voor een maximale termijn van twee aaneengesloten jaren voor cofinanciering
      in aanmerking. De aanvang van deze termijn kan niet eerder liggen dan na publicatie van deze regeling in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel421
