  - number: '3.8'
    text: |-
      1 Niet voor cofinanciering komen in aanmerking:

      a. onredelijk gemaakte kosten ter uitvoering van het sectorplan of een onderdeel daarvan;

      b. kosten van het sectorplan die naar het oordeel van de minister qua prijsniveau niet in een redelijke verhouding
      staan tot de overeengekomen prestaties;

      c. kosten van inkomensvervangende betalingen of uitkeringen aan deelnemers, niet zijnde loonbetalingen; en

      d. kosten van maatregelen die de mededinging ongunstig kunnen beïnvloeden.

      2 Kosten van werkzaamheden ter uitvoering van het sectorplan die door derden zijn verricht, komen niet voor
      cofinanciering in aanmerking indien uit de controleverklaring van de accountant blijkt dat:

      a. er geen transparante aanbestedingsprocedure heeft plaatsgevonden; of

      b. niet ten minste drie offertes zijn aangevraagd, voor zover deze kosten meer bedragen dan 50.000 EUR.

      3 Een aanvraag tot verlening van subsidie wordt door de minister geweigerd, indien de kosten van de maatregel
      waarvoor cofinanciering wordt aangevraagd, reeds uit anderen hoofde van overheidswege worden gefinancierd.

      4 Het derde lid is niet van toepassing op de bijdrage van een (centrum)gemeente of provincie, bedoeld in
      [artikel 1.2, tweede lid][ref1], aan de bijdrage van het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0035840#Artikel1.2
