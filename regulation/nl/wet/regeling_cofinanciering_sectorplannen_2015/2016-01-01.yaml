  - number: '1.6'
    text: |-
      1 Aan de directeur van het Agentschap SZW wordt mandaat verleend tot het nemen van besluiten met betrekking tot de
      uitvoering van deze regeling, waaronder begrepen:

      a. het verlenen van subsidies;

      b. het vaststellen van subsidies, verleend op grond van deze regeling;

      c. het beslissen op bezwaarschriften tegen besluiten als bedoeld in de onderdelen a en b, voor zover het besluit
      waartegen het bezwaar zich richt, niet door hem in mandaat is genomen.

      2 De directeur van het Agentschap SZW kan de bevoegdheid, bedoeld in het eerste lid, onderdelen a en b, al dan niet
      gedeeltelijk mandateren aan onder hem ressorterende functionarissen.
    url: https://wetten.overheid.nl/BWBR0035840/2016-01-01#Artikel1.6
  - number: '2.1'
    text: |-
      1 Een sectorplan wordt opgesteld en uitgevoerd door een samenwerkingsverband.

      2 Het samenwerkingsverband kan, in afwijking van [artikel 1.1][ref1], bestaan uit ten minste één
      werknemersorganisatie en meerdere bij een werkgeversorganisatie aangesloten arbeidsorganisaties.

      3 De samenwerking kan worden georganiseerd binnen of tussen een of meer sectoren, branches of arbeidsmarktregio’s.

      4 De samenwerking wordt vastgelegd in een samenwerkingsovereenkomst waarin tevens een hoofdaanvrager wordt
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0035840#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0035840/2016-01-01#Artikel2.1
