  - number: '3.7'
    text: |-
      Voor cofinanciering komen in aanmerking:

      a. subsidiabele kosten, zijnde kosten die daadwerkelijk zijn gemaakt ter uitvoering van de subsidiabele
      activiteiten, bedoeld in de [artikelen 3.2 tot en met 3.5][ref1], en die rechtstreeks aan de uitvoering van de
      maatregelen van het sectorplan zijn toe te rekenen; en

      b. kosten voor overhead en aan overhead gerelateerde exploitatiekosten als bedoeld in [artikel 4.6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035840#Artikel3.2
      [ref2]: https://wetten.overheid.nl/BWBR0035840#Artikel4.6
