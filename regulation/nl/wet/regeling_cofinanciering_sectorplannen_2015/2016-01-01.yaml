        artikel: '1.1'
        hoofdstuk: '1'
  - number: '2.2'
    text: |-
      1 De hoofdaanvrager dient namens een samenwerkingsverband een sectorplan in en vraagt hiervoor subsidie aan.

      2 De hoofdaanvrager toont aan dat de aanvraag wordt ingediend namens een samenwerkingsverband waarvan de betrokken
      partijen in staat zijn om het sectorplan binnen de gestelde tijd uit te voeren.

      3 De hoofdaanvrager toont aan dat hij gemachtigd is het samenwerkingsverband in en buiten rechte te
      vertegenwoordigen.

      4 Als hoofdaanvrager kan worden aangewezen:

        - een werkgeversorganisatie;
        - een werknemersorganisatie; of
        - een O&O-fonds.

      5 De hoofdaanvrager toont aan te beschikken over een eigen vermogen van ten minste 80% van het aangevraagde
      subsidiebedrag, exclusief overhead als bedoeld in [artikel 4.6, tweede lid][ref1].

      6 Indien de hoofdaanvrager niet beschikt over een eigen vermogen, als bedoeld in het vijfde lid, stelt of stellen
      één of meerdere partijen uit het samenwerkingsverband zich garant voor ten minste dit bedrag.

      7 Indien het aanwijzen van een hoofdaanvrager als bedoeld in het vierde lid niet mogelijk is, kan een sectorplan
      eveneens worden ingediend door een andere rechtspersoon, met uitzondering van een provincie, een (centrum)
      gemeente, een openbaar lichaam, een gemeenschappelijk orgaan of een bedrijfsvoeringsorganisatie als bedoeld in
      [artikel 8 van de Wet gemeenschappelijke regelingen][ref2], die als hoofdaanvrager optreedt, indien die daarbij
      aantoont dat het samenwerkingsverband of één of meer partijen van het samenwerkingsverband zich garant stelt of
      stellen voor ten minste 80% van het aangevraagde subsidiebedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0035840#Artikel4.6
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel8
