  - number: '4.7'
    text: |-
      1 De hoofdaanvrager houdt een inzichtelijke en controleerbare administratie bij met betrekking tot de uitvoering
      van het sectorplan en de in verband daarmee gemaakte kosten en verworven inkomsten. Deze administratie bestaat uit
      een projectadministratie, waaronder begrepen een financiële administratie en een administratie van de deelnemers
      per maatregel inclusief een burgerservicenummer waarin alle noodzakelijke gegevens tijdig, juist en volledig zijn
      vastgelegd en ten behoeve van de vaststelling van de subsidiabiliteit zijn te verifiëren met bewijsstukken. Deze
      administratie is voor controle beschikbaar op één locatie.

      2 De administratie geeft inzicht in de geplande en gerealiseerde maatregelen.

      3 De financiële administratie geeft inzicht in de gemaakte subsidiabele kosten, de inkomsten en de wijze waarop de
      inkomsten en gemaakte kosten aan de maatregelen van het sectorplan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0035840/2016-01-01#Artikel4.7
  - number: '5.1'
    text: |-
      1 De minister draagt in 2016 en 2018 zorg voor de evaluatie van deze regeling.

      2 De hoofdaanvrager verleent aan de minister medewerking aan het opstellen van evaluatierapporten met betrekking
      tot deze regeling, en draagt, voor zover het sectorplan niet in eigen beheer wordt uitgevoerd, er zorg voor dat de
      feitelijke uitvoerder van het sectorplan deze medewerking verleent.

      3 De minister past deze regeling zo nodig aan, indien tijdens de uitvoering van deze regeling blijkt dat hier
      aanleiding toe is.
    url: https://wetten.overheid.nl/BWBR0035840/2016-01-01#Artikel5.1
  - number: '7.1'
    text: 'Deze regeling wordt aangehaald als: Regeling cofinanciering sectorplannen 2015'
    url: https://wetten.overheid.nl/BWBR0035840/2016-01-01#Artikel7.1
  - number: '7.2'
    text: |-
      1 Deze regeling treedt inwerking met ingang van 1 januari 2015 en vervalt met ingang van 1 januari 2020.

      2 In afwijking van het eerste lid blijft deze regeling, zoals die luidde op 31 december 2019, van toepassing op de
      afwikkeling van verleende subsidies op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0035840/2016-01-01#Artikel7.2
