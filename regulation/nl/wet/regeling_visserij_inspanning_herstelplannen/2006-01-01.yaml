  - number: '5'
    text: |-
      1 Het verbod, bedoeld in [artikel 2, eerste lid][ref1], tot het aan boord houden van de typen vistuig, bedoeld
      in onderdeel 4 van bijlage IVa, in de in onderdeel 2 van die bijlage bedoelde geografische gebieden, is niet van
      toepassing in het geval, bedoeld in onderdeel 11 van die bijlage.

      2 De aanvraag tot verkrijging van een speciaal visdocument als bedoeld in
      [artikel 12, derde lid, van de Regeling technische maatregelen 2000][ref2], wordt beschouwd als een melding als
      bedoeld in onderdeel 11 van bijlage IVa.


      [ref1]: https://wetten.overheid.nl/BWBR0016340#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011061#Artikel12
