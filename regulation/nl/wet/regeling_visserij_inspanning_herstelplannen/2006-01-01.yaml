preamble:
  text: >-
    Gelet op artikel 12 van verordening (EG) nr. 2287/2003 van de Raad van de Europese Unie van 19 december 2003 tot
    vaststelling, voor 2004, van de vangstmogelijkheden voor sommige visbestanden en groepen visbestanden welke in
    de wateren van de Gemeenschap en, voor vaartuigen van de Gemeenschap, in andere wateren met vangstbeperkingen van
    toepassing zijn, en tot vaststelling van de bij de visserij in acht te nemen voorschriften (PbEU L 344);


    Gelet op de artikelen 3 en 4 van het Reglement zee- en kustvisserij 1977;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0016340/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. minister: Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. ondernemer: degene te wiens naam het vissersvaartuig in het visserijregister, bedoeld in het
      [Besluit registratie vissersvaartuigen 1998][ref1], staat geregistreerd;

      c. groep: groep als bedoeld in [artikel 16 van de Regeling contingentering zeevis][ref2];

      d. bijlage IVa: bijlage IVa van [verordening (EG) nr. 27/2005](32005R0027) van de Raad van 22 december 2004 tot
      vaststelling, voor 2005, van de vangstmogelijkheden voor sommige visbestanden en groepen visbestanden welke in
      de wateren van de Gemeenschap en, voor vaartuigen van de Gemeenschap, in andere wateren met vangstbeperkingen van
      toepassing zijn, en tot vaststelling van de bij de visserij in acht te nemen voorschriften (PbEU L 12);

      e. kalenderdag: aaneengesloten tijdvak van 24 uur;

      f. tijdvak A: tijdvak van 1 februari van het desbetreffende kalenderjaar tot en met 31 januari van het volgende
      kalenderjaar;

      g. tijdvak B: tijdvak van 1 februari tot en met 30 april van het desbetreffende kalenderjaar;

      h. tijdvak C: tijdvak van 1 mei tot en met 31 juli van het desbetreffende kalenderjaar;

      i. tijdvak D: tijdvak van 1 augustus tot en met 31 oktober van het desbetreffende kalenderjaar;

      j. tijdvak E: tijdvak van 1 november tot en met 31 december van het desbetreffende kalenderjaar;

      k. groepsinspanning: per vistuig als bedoeld in onderdeel 4 van bijlage IVa van de in de desbetreffende groep
      gemaakte som van de uitkomsten van de per vissersvaartuig toegepaste vermenigvuldiging van het aantal kalenderdagen
      waarvoor het vissersvaartuig op grond van de onderdelen 6a, 6b, 6c, 6d, 6f, 7, 10, 12, tweede alinea, en 13 van
      bijlage IVa in aanmerking komt met het motorvermogen van dat vissersvaartuig;

      l. controleur: persoon die in het kader van [Verordening (EEG) nr. 2847/93](31993R2847) van de Raad van de Europese
      Gemeenschappen van 12 oktober 1993 tot invoering van een controleregeling voor het gemeenschappelijk visserijbeleid
      (PbEG L 261) met controle is belast.

      2 Voor de toepassing van deze regeling vindt het aanlanden plaats op het tijdstip waarop het vissersvaartuig direct
      of indirect verbinding met de wal heeft gekregen.

      3 Bij de toepassing van het eerste lid, onderdeel k, handelt de groep overeenkomstig onderdeel 10a tot en met 10d
      van bijlage IVa.

      4 Voor de toepassing van deze regeling worden tot de gebieden, bedoeld in onderdeel 2 van bijlage IVa.c, tevens
      verstaan de in het [Besluit aanwijzing zeegebied en kustwateren 1970][ref3] genoemde wateren.


