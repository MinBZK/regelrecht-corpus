  - number: '2'
    text: >-
      1 Het is in een tijdvak verboden met een vissersvaartuig met een lengte over alles van ten minste 10 meter de
      visserij uit te oefenen in de in onderdeel 2 van bijlage IVa bedoelde geografische gebieden met de typen vistuig,
      bedoeld in onderdeel 4 van die bijlage, en die typen vistuig aan boord te houden.


      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing op een vissersvaartuig dat in tijdvak A, dan wel in
      de tijdvakken B tot en met E, de visserij beoefent met een of twee van de aangemelde typen vistuig, bedoeld in het
      eerste lid, indien:


      a. ten aanzien van het vissersvaartuig een speciaal visdocument als bedoeld in artikel 12, zevende lid, van
      [Verordening (EG) nr. 27/2005](32005R0027) van de Raad van 22 december 2004 tot vaststelling, voor 2005, van
      de vangstmogelijkheden voor sommige visbestanden en groepen visbestanden welke in de wateren van de Gemeenschap
      en, voor vaartuigen van de Gemeenschap, in andere wateren met vangstbeperkingen van toepassing zijn, en tot
      vaststelling van de bij de visserij in acht te nemen voorschriften (PbEU L 12) is afgegeven;


      b. de kapitein van het vissersvaartuig of zijn vertegenwoordiger heeft gemeld welk type of welke typen vistuig hij
      in het tijdvak gaat gebruiken;


      c. het aantal kalenderdagen, waarvoor een vissersvaartuig in het desbetreffende tijdvak op grond van de onderdelen
      6a, 6b, 6c, 6d, 6f, 7, 10, 12, tweede alinea, en 13 van bijlage IVa in aanmerking komt, nog niet is bereikt of de
      ondernemer van het vissersvaartuig deelneemt aan een groep en de voor het vistuig geldende groepsinspanning nog
      niet is bereikt, en


      d. voor zover het betreft het gebruik van twee typen vistuig, wordt voldaan aan onderdeel 7, derde alinea, eerste
      en tweede gedachtestreepje, van bijlage IVa.


      3 Voor de toepassing van het tweede lid, onderdeel c, worden de kalenderdagen van de maanden behorend tot hetzelfde
      tijdvak samengevoegd overeenkomstig onderdeel 6b van bijlage IVa.


      4 Het is vanaf het tijdstip dat door of namens de minister of een controleur wordt geconstateerd dat ten aanzien
      van een vissersvaartuig, bedoeld in het eerste lid, niet is voldaan aan het tweede lid, onderdeel d, verboden met
      dat vissersvaartuig de visserij te beoefenen met meer dan een van de typen vistuig, bedoeld in het eerste lid.


      5 Indien een constatering wordt gedaan als bedoeld in het vierde lid, wordt aan de ondernemer of diens
      vertegenwoordiger terstond een schriftelijke verklaring hieromtrent verstrekt. In deze verklaring wordt tenminste
      de desbetreffende constatering alsmede de datum en het tijdstip daarvan vermeld.


      6 Indien aan een vissersvaartuig kalenderdagen zijn toegewezen op grond van onderdeel 6d van bijlage IVa, wordt ten
      aanzien van dat vaartuig voldaan aan de voorwaarden van dat onderdeel.
    url: https://wetten.overheid.nl/BWBR0016340/2006-01-01#Artikel2
  - number: '3'
    text: |-
      1 Een melding als bedoeld in [artikel 2, tweede lid, onderdeel b][ref1], geschiedt 15 dagen voor het begin van
      het desbetreffende tijdvak aan het bestuur van de groep, of indien de ondernemer niet deelneemt aan een groep,
      schriftelijk aan de Directie Visserij van het Ministerie van Landbouw, Natuur en Voedselkwaliteit, telefax 070–
      3786452. De melding bevat ten minste de volgende gegevens:

      a. naam van de ondernemer;

      b. lettertekens en het nummer van het vissersvaartuig;

      c. het tijdvak en het type vistuig dat in dat tijdvak wordt gebruikt.

      2 Een melding als bedoeld in onderdeel 7, derde alinea, tweede gedachtestreepje, van bijlage IVa wordt
      schriftelijk gedaan aan de meldkamer van de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en
      Voedselkwaliteit, te Kerkrade, telefax 045–5461011. De melding bevat ten minste de gegevens:

      a. naam van de ondernemer;

      b. lettertekens en het nummer van het vissersvaartuig;

      c. de datum en het tijdstip van aanvang van de desbetreffende visreis;

      d. het type vistuig dat op die visreis wordt gebruikt.

      3 Een vissersvaartuig mag in elk tijdvak andere dan met de visserij verband houdende activiteiten ontplooien zonder
      dat de daarmee gemoeide tijd wordt aangemerkt als een kalenderdag, mits wordt voldaan aan onderdeel 9b van bijlage
      IVa. Een melding als bedoeld in dat onderdeel wordt schriftelijk gedaan aan de meldkamer, bedoeld in het tweede
      lid. De melding bevat ten minste de volgende gegevens:

      a. naam van de ondernemer;

      b. lettertekens en het nummer van het vissersvaartuig;

      c. de aard, datum van aanvang en duur van de activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0016340#Artikel2
    url: https://wetten.overheid.nl/BWBR0016340/2006-01-01#Artikel3
