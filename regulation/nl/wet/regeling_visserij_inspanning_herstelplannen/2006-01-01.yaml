        artikel: '2'
  - number: '4'
    text: |-
      1 De minister kan op verzoek van het bestuur van een groep toestaan dat een gedeelte van de groepsinspanning wordt
      benut door tot een andere groep behorende vissersvaartuigen, mits wordt voldaan aan onderdeel 10a tot en met 10d
      van bijlage IVa.

      2 Een verzoek als bedoeld in het eerste lid wordt vóór 20 december van het desbetreffende kalenderjaar ingediend
      bij de minister op een daartoe bestemd formulier.

      3 Indien in een van de tijdvakken B tot en met D met een vissersvaartuig, bedoeld in [artikel 2, eerste lid][ref1],
      de visserij is uitgeoefend dan wel het in dat lid bedoelde type vistuig aan boord is gehouden gedurende
      meer kalenderdagen dan waarvoor het vissersvaartuig op grond van [artikel 2, tweede lid, onderdeel c][ref2],
      in aanmerking komt, wordt het aantal kalenderdagen waarvoor het vissersvaartuig op grond van
      [artikel 2, tweede lid, onderdeel c][ref3], in aanmerking komt voor het daaropvolgende tijdvak, verminderd met het
      aantal kalenderdagen van de overschrijding.

      4 Indien in een van de tijdvakken B tot en met D de voor de tot een groep behorende vissersvaartuigen voor een
      vistuig geldende groepsinspanning wordt overschreden, wordt de voor dat vistuig geldende groepsinspanning van die
      groep in het daaropvolgende tijdvak evenredig met de mate van overschrijding verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0016340#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016340#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0016340#Artikel2
