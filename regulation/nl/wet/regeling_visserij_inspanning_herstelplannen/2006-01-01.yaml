  - number: 5a
    text: >-
      Indien een vissersvaartuig niet heeft kunnen vissen omdat zich een noodsituatie als bedoeld in onderdeel 13 van
      bijlage IVa heeft voorgedaan, wordt het aantal dagen waarop het vissersvaartuig niet heeft kunnen vissen, niet in
      mindering gebracht op aan dat vissersvaartuig toegewezen aantal dagen, indien de kapitein van het vissersvaartuig
      of zijn vertegenwoordiger binnen een maand nadat de noodsituatie zich heeft voorgedaan schriftelijk bij het
      Ministerie van Landbouw, Natuur en Voedselkwaliteit daarvan melding heeft gemaakt en de melding wordt gestaafd
      door bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0016340/2006-01-01#Artikel5a
  - number: '6'
    text: |-
      1 De kapitein van een vissersvaartuig of zijn vertegenwoordiger meldt voor 15 januari 2005 aan het ministerie
      van Landbouw, Natuur en Voedselkwaliteit, schriftelijk welk type of welke typen vistuig hij in de periode van
      1 februari tot en met 31 december 2005, dan wel in de periode van 1 februari tot en met 30 april 2005, gaat
      gebruiken.

      2 Een melding als bedoeld in [artikel 2, tweede lid, onderdeel b][ref1], wordt beschouwd als een aanvraag tot
      verkrijging van een speciaal visdocument als bedoeld in [artikel 2, tweede lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016340#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016340#Artikel2
    url: https://wetten.overheid.nl/BWBR0016340/2006-01-01#Artikel6
    references:
