        artikel: '2'
      - id: ref2
        bwb_id: BWBR0016340
        artikel: '2'
  - number: 6a
    text: >-
      De minister kan in overeenstemming met artikel 54 van [verordening (EG) nr. 27/2005](32005R0027) van de Raad
      van de Europese Unie van 22 december 2004 tot vaststelling, voor 2005, van de vangstmogelijkheden voor sommige
      visbestanden en groepen visbestanden welke in de wateren van de Gemeenschap en, voor vaartuigen van de Gemeenschap,
      in andere wateren met vangstbeperkingen van toepassing zijn, en tot vaststelling van de bij de visserij in acht te
      nemen voorschriften (PbEU L 12) ontheffing verlenen van de bepalingen van deze regeling, voorzover het betreft het
      uitoefenen van de visserij ten behoeve van wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0016340/2006-01-01#Artikel6a
  - number: '7'
    text: Deze regeling treedt in werking met ingang van 1 februari 2004.
