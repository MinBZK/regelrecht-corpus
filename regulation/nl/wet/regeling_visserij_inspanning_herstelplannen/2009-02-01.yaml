  - number: '5'
    text: |-
      1 Een melding als bedoeld in [artikel 2, tweede lid, onderdeel b][ref1], wordt gedaan aan de Directie Visserij
      van het Ministerie van Landbouw, Natuur en Voedselkwaliteit. Indien een ondernemer deelneemt aan een groep of een
      producentenorganisatie wordt een melding als bedoeld in [artikel 2, tweede lid, onderdeel b][ref2], gedaan aan het
      bestuur van de groep dan wel producentenorganisatie.

      2 De melding bevat ten minste de volgende gegevens:

      a. naam van de ondernemer;

      b. lettertekens en het nummer van het vissersvaartuig;

      c. de gereglementeerde typen vistuig die zullen worden gebruikt;

      d. het gereglementeerd gebied waar zal worden gevist.

      3 Een melding als bedoeld in [artikel 2, tweede lid, onderdeel b][ref3], wordt beschouwd als een aanvraag tot
      verkrijging van een speciaal visdocument als bedoeld in [artikel 2, tweede lid, onderdeel a][ref4].

      4 Het is verboden in strijd te handelen met de onderdelen 10.2 en 10.3 van bijlage IIa van de verordening inzake
      vangstmogelijkheden.

      5 De toestemming, bedoeld in onderdeel 10.2 van bijlage IIa van de verordening inzake vangstmogelijkheden,
      wordt verkregen door melding van het voornemen tot het gebruik van meer dan één soort vistuig tijdens de visreis
      uiterlijk 48 uur voor aanvang van de visreis.

      6 De mededeling, bedoeld in onderdeel 10.3 van bijlage IIa van de verordening inzake vangstmogelijkheden, wordt
      gedaan aan de minister uiterlijk 48 uur voor aanvang van de visreis.

      7 Het is voor vaartuigen als bedoeld in onderdeel 13.1 van bijlage IIa van de verordening inzake
      vangstmogelijkheden verboden om in strijd te handelen met de artikelen 19 ter, eerste en tweede lid, 19 quater,
      eerste en tweede lid, en 19 sexies, eerste tot en met derde lid, van Verordening (EEG) nr. 2847/93 van de Raad
      van 12 oktober 1993 tot invoering van een controleregeling voor het gemeenschappelijk visserijbeleid (PbEG L 261)
      met inachtneming van het bepaalde in de tweede tot en met vierde volzin van onderdeel 13.1 van bijlage IIa van de
      verordening inzake vangstmogelijkheden


