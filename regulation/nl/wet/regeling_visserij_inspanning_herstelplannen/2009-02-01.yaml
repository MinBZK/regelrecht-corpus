preamble:
  text: |-
    Gelet op artikel 12 van verordening (EG) nr. 2287/2003 van de Raad van de Europese Unie van 19 december 2003 tot
    vaststelling, voor 2004, van de vangstmogelijkheden voor sommige visbestanden en groepen visbestanden welke in
    de wateren van de Gemeenschap en, voor vaartuigen van de Gemeenschap, in andere wateren met vangstbeperkingen van
    toepassing zijn, en tot vaststelling van de bij de visserij in acht te nemen voorschriften (PbEU L 344);

    Gelet op de artikelen 3 en 4 van het Reglement zee- en kustvisserij 1977;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016340/2009-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            beheersperiode:

              periode genoemd in de aanhef van [bijlage 1][ref1];



            b
            gereglementeerd geografisch gebied:

              de gebieden, bedoeld in artikel 3 van verordening nr. 1342/2008;



            c
            gereglementeerd vistuig:

              de vistuigen behorend tot de categorieën, bedoeld in bijlage I van verordening nr. 1342/2008;



            d
            inspanningsgroep:

              een inspanningsgroep als bedoeld in artikel 2, onderdeel a, van verordening nr. 1342/2008;



            e
            minister:

              Minister van Landbouw, Natuur en Voedselkwaliteit;



            f
            ondernemer:

              degene te wiens naam het vissersvaartuig in het visserijregister, bedoeld in het
      [Besluit registratie vissersvaartuigen 1998][ref2], staat geregistreerd;



            g
            verordening nr. 1342/2008:

              verordening (EG) nr. 1342/2008 van de Raad van 18 december 2008 tot vaststelling van een langetermijnplan
      voor kabeljauwbestanden en de bevissing van deze bestanden, en tot intrekking van Verordening (EG) nr. 423/2004
      (PbEU L 348);



            h
            verordening inzake vangstmogelijkheden:

              verordening van 19 december 2008 van de Raad van de Europese Unie tot vaststelling, voor 2009, van de
      vangstmogelijkheden voor sommige visbestanden en groepen visbestanden welke in de wateren van de Gemeenschap
      en, voor vaartuigen van de Gemeenschap, in andere wateren met vangstbeperkingen van toepassing zijn, en tot
      vaststelling van de bij de visserij in acht te nemen voorschriften;



            i
            visserij-inspanning:

              de inspanning zoals berekend in onderdeel 5 van bijlage IIa van de verordening inzake vangstmogelijkheden.


      [ref1]: https://wetten.overheid.nl/BWBR0016340
      [ref2]: https://wetten.overheid.nl/BWBR0009353
