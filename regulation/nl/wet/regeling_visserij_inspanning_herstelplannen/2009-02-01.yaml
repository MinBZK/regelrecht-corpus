  - number: '3'
    text: |-
      1 De door de gezamenlijke Nederlandse vissers gebruikte hoeveelheden visserij-inspanning worden in mindering
      gebracht op de hoeveelheid visserij-inspanning, bedoeld in bijlage 1, overeenkomstig het bepaalde in de onderdelen
      9.1, 9.2, 10.2, 10.3 en 11 van bijlage IIa van de verordening inzake vangstmogelijkheden.

      2 De minister gebruikt de hoeveelheden visserij-inspanning die ingevolge punt 6 van bijlage IIa van
      de verordening inzake vangstmogelijkheden aan Nederland zijn toegewezen, maar die niet op grond van
      [artikel 2, tweede lid, onderdeel c][ref1], beschikbaar zijn gesteld, ten behoeve van:

      a. het uitwisselen van visserij-inspanning met andere lidstaten, bedoeld in artikel 16, tweede lid, van verordening
      nr. 1342/2008;

      b. het overdragen visserij-inspanning tussen inspanningsgroepen, bedoeld in artikel 17, eerste lid, van verordening
      nr. 1342/2008 en

      c. toewijzing aan ondernemers waarvan is vastgesteld dat met het vissersvaartuig van de ondernemer tijdens de
      beheersperiode de visserij is uitgeoefend met gebruikmaking van vistuig dat selectiever is dan de bestaande
      wettelijke verplichtingen.

      3 Het deel van de visserij-inspanning dat is gereserveerd op grond van het tweede lid, onderdelen b en c,
      wordt, na aftrek van de overgedragen en toegewezen hoeveelheden, uiterlijk 1 juli van de beheersperiode
      beschikbaar gesteld aan vaartuigen ten behoeve waarvan een speciaal visdocument als bedoeld in
      [artikel 2, tweede lid, onderdeel a][ref2], is verleend.

      4 De minister stelt de criteria vast die worden gehanteerd voor het toewijzen van de visserij-inspanning als
      bedoeld in het tweede lid, onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0016340#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016340#Artikel2
