  - number: '6'
    text: |-
      1 Het verbod, bedoeld in [artikel 2, eerste lid][ref1], tot het aan boord houden van de gereglementeerde typen
      vistuig in de gereglementeerde geografische gebieden, is niet van toepassing in het geval, bedoeld in onderdeel
      11.1 van bijlage IIa van de verordening inzake vangstmogelijkheden.

      2 De aanvraag tot verkrijging van een speciaal visdocument als bedoeld in
      [artikel 12, derde lid, van de Regeling technische maatregelen 2000][ref2], wordt beschouwd als een melding als
      bedoeld in onderdeel 11.1 van bijlage IIa van de verordening inzake vangstmogelijkheden.

      3 Een vissersvaartuig mag andere dan met de visserij verband houdende activiteiten ontplooien in de
      gereglementeerde geografische gebieden zonder dat de daarmee gemoeide tijd wordt aangemerkt als een kalenderdag,
      mits wordt voldaan aan onderdeel 11.2 van bijlage IIa van de verordening inzake vangstmogelijkheden. Een melding
      als bedoeld in dat onderdeel wordt schriftelijk gedaan aan de minister. De melding bevat ten minste de volgende
      gegevens:

      a. naam van de ondernemer;

      b. lettertekens en het nummer van het vissersvaartuig en

      c. de aard, datum van aanvang en duur van de activiteiten.

      4 Indien een vissersvaartuig niet heeft kunnen vissen omdat zich een noodsituatie als bedoeld in onderdeel 11.3
      van bijlage IIa van de verordening inzake vangstmogelijkheden heeft voorgedaan, wordt het aantal dagen waarop
      het vissersvaartuig niet heeft kunnen vissen, niet in mindering gebracht op de betreffende hoeveelheid visserij-
      inspanning, bedoeld in [bijlage 1][ref3], indien de kapitein van het vissersvaartuig of zijn vertegenwoordiger
      binnen een maand nadat de noodsituatie zich heeft voorgedaan schriftelijk bij het Ministerie van Landbouw, Natuur
      en Voedselkwaliteit daarvan melding heeft gemaakt en de melding wordt gestaafd door bewijsstukken.


