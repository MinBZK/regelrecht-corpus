  - number: '4'
    text: |-
      1 Het verbod, bedoeld in [artikel 2, eerste lid][ref1], is tijdens de beheersperiode na de bekendmaking, bedoeld
      in [artikel 2, vierde lid][ref2], niet van toepassing op een vissersvaartuig indien de minister ten behoeve van
      dat vaartuig een aanvullende hoeveelheid visserij-inspanning heeft toegekend en de aan dat vaartuig toegekende
      hoeveelheid visserij-inspanning nog niet is opgebruikt.

      2 De minister kent de aanvullende hoeveelheid visserij-inspanning, bedoeld in het eerste lid, onderdeel a, slechts
      toe ten aanzien van een vissersvaartuig, indien:

      a. ten behoeve van dat vaartuig reeds voor die beheersperiode een speciaal visdocument als bedoeld in
      [artikel 2, tweede lid, onderdeel a][ref3], is verleend;

      b. met dat vissersvaartuig gedurende de gehele beheersperiode de visserij wordt uitgeoefend overeenkomstig het
      bepaalde in artikel 13, tweede lid, onderdeel a, b of c, van verordening nr. 1342/2008;

      c. de kapitein van het vissersvaartuig of zijn vertegenwoordiger daartoe voor 15 maart een verzoek op een daartoe
      bestemd formulier heeft ingediend bij de minister en

      d. het vissersvaartuig behoort tot een inspanningsgroep als bedoeld in artikel 13, eerste lid, van verordening
      nr. 1342/2008.

      3 De minister kan bij de toekenning van de visserij-inspanning, bedoeld in het eerste lid, aanvullende eisen
      stellen, waaronder medewerking aan frequentere controles in de zin van artikel 13, derde lid, van verordening
      nr. 1342/2008.

      4 De minister kent de aanvullende hoeveelheden visserij-inspanning, bedoeld in het eerste lid, toe ten aanzien
      van de het gereglementeerde gebied en de gereglementeerde categorie vistuig waarvoor het speciale visdocument was
      toegekend voor die beheersperiode en houdt bij de vaststelling van de hoeveelheden visserij-inspanning rekening met
      het bepaalde in artikel 13, vierde lid, van verordening 1342/2008.

      5 De minister reikt bij de toekenning van een aanvullende hoeveelheid visserij-inspanning voor de beheersperiode
      aan de ondernemer een document voor de desbetreffende visserij-inspanning uit.

      6 De aan een vissersvaartuig toegekende aanvullende hoeveelheid visserij-inspanning is niet overdraagbaar.

      7 De minister kan de toekenning, bedoeld in het eerste lid, weigeren of intrekken indien:

      a. niet wordt voldaan aan de voorwaarden van het tweede lid, onderdeel b, en derde lid of b. hij dit noodzakelijk
      acht ter nakoming van communautaire verplichtingen.


