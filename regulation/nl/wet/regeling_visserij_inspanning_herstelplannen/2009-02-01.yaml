  - number: '2'
    text: |-
      1 Het is verboden met een vissersvaartuig met een lengte over alles van ten minste 10 meter de visserij uit te
      oefenen in de gereglementeerde geografische gebieden met gereglementeerde typen vistuig en die typen vistuig aan
      boord te houden.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing op een vissersvaartuig, indien:

      a. de minister ten aanzien van het vissersvaartuig voor de beheersperiode een speciaal visdocument heeft
      afgegeven als bedoeld in artikel 14, tweede lid, van verordening nr. 1342/2008, ten aanzien van het betreffende
      gereglementeerde geografisch gebied en categorie vistuig;

      b. de kapitein van het vissersvaartuig of zijn vertegenwoordiger heeft gemeld welk type of welke typen
      gereglementeerd vistuig hij in welk gebied gaat gebruiken in de betreffende beheersperiode;

      c. de voor de houders van een speciaal visdocument beschikbare visserij-inspanning per gereglementeerd geografisch
      gebied en vistuigcategorie, vermeld in [bijlage 1][ref1], voor de beheersperiode nog niet is opgebruikt en

      d. het vissersvaartuig behoort tot de vlootsegmenten MFL1 of MFL2 en is geregistreerd in het visserijregister,
      bedoeld in [artikel 4 van het Besluit registratie vissersvaartuigen 1998][ref2].

      3 De minister geeft het speciale visdocument, bedoeld in het tweede lid, onderdeel a, slechts af ten aanzien van
      een vaartuig:

      a. dat in de kalenderjaren 2006 tot en met 2008 heeft gevist in de gereglementeerde geografische gebieden met een
      of meerdere gereglementeerde vistuigen;

      b. ten aanzien waarvan op 1 januari 2009 een onomkeerbare investeringsverplichting is aangegaan met het oog op
      visserij in de gereglementeerde geografische gebieden en met de gereglementeerde typen vistuigen, of

      c. dat dient ter vervanging van een vissersvaartuig of vissersvaartuigen ten aanzien waarvan het recht op een
      speciaal visdocument als bedoeld in het tweede lid, onderdeel a, bestond op grond van het tweede en derde lid,
      onderdeel a of b, en de houder van dat document afstand heeft gedaan van dat recht ten gunste van de aanvrager van
      het speciale visdocument en het motorvermogen van dat vissersvaartuig niet meer bedraagt dan het motorvermogen van
      het vissersvaartuig of de vissersvaartuigen die worden vervangen.

      4 De minister maakt het tijdstip bekend waarop naar zijn oordeel de in het tweede lid, onderdeel c, bedoelde
      hoeveelheden visserij-inspanning zijn opgebruikt.

      5 De minister kan weigeren een speciaal visdocument af te geven of een speciaal visdocument intrekken indien hij
      dit noodzakelijk acht ter nakoming van communautaire verplichtingen.

      6 De minister geeft een speciaal visdocument als bedoeld in het tweede lid, onderdeel a, ten aanzien van de
      gereglementeerde vistuigen BT1 en BT2 slechts af voor een vissersvaartuig waaraan contingenten tong en schol zijn
      toegekend op grond van [artikel 2, eerste lid, onderdeel b, van de Regeling contingentering zeevis][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0016340
