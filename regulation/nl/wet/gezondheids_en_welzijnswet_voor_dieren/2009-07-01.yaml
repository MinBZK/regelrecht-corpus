  - number: 91i
    text: >-
      1 Het tarief van een krachtens artikel 91h, eerste lid, ingevoerde heffing wordt vastgesteld op basis van een
      raming van de ten aanzien van de, bij de desbetreffende heffing betrokken diersoort, kosten, bedoeld in artikel
      91h, eerste lid, over een periode van drie jaar, te rekenen vanaf het tijdstip waarop de heffing wordt ingevoerd.
      Bij de raming wordt rekening gehouden met het totaal van de ten aanzien van die diersoort gemaakte kosten, bedoeld
      in artikel 91h, eerste lid, over de periode van drie jaar die eindigt zes maanden voor het in de vorige volzin
      bedoelde tijdstip.


      2 Telkens na een periode van drie kalenderjaren, te rekenen vanaf 1 januari van het kalenderjaar waarin een heffing
      als bedoeld in artikel 91h, eerste lid, wordt ingevoerd, kan het tarief van de betrokken heffing voor de op die
      periode volgende periode van drie kalenderjaren worden gewijzigd. Een wijziging als bedoeld in de vorige volzin
      geschiedt bij algemene maatregel van bestuur die in werking treedt voor het tijdstip waarop de periode aanvangt
      waarop de wijziging van het tarief betrekking heeft.


      3 Wijziging van het tarief op grond van het tweede lid geschiedt op basis van het saldo van:


      a. een raming van de terzake van de bij de desbetreffende heffing betrokken diersoort te maken kosten, bedoeld
      in artikel 91h, eerste lid, en, voor zover van toepassing, artikel 91h, tweede lid, over een periode van drie
      kalenderjaren, te rekenen vanaf 1 januari van het kalenderjaar met ingang waarvan het tarief uit hoofde van het
      tweede lid kan worden gewijzigd, bij welke raming rekening wordt gehouden met het totaal van de, terzake van die
      diersoort gemaakte kosten, bedoeld in artikel 91h, eerste lid, over een periode van drie jaar die eindigt op 1 juli
      van het kalenderjaar dat voorafgaat aan de periode waarop de raming betrekking heeft;


      b. ten hoogste 50% van de door het Diergezondheidsfonds terzake van de, bij de desbetreffende heffing betrokken
      diersoort, gemaakte kosten, bedoeld in artikel 91h, eerste lid, over de periode vanaf de datum van invoering van
      die heffing tot 1 januari van het kalenderjaar dat voorafgaat aan het kalenderjaar met ingang waarvan het tarief
      uit hoofde van het tweede lid kan worden gewijzigd, voor zover die kosten meer bedragen dan de totale som van die
      heffing, bestemd voor de bestrijding van die kosten, zoals geheven over de tot laatstbedoelde datum verstreken
      kalenderjaren, en, voor zover van toepassing,


      c. ten hoogste 50% van de door het Diergezondheidsfonds terzake van de, bij de desbetreffende heffing betrokken
      diersoort, gemaakte kosten, bedoeld in artikel 91h, tweede lid, over de periode vanaf de in dat artikellid genoemde
      datum tot 1 januari van het kalenderjaar dat voorafgaat aan het kalenderjaar met ingang waarvan het tarief uit
      hoofde van het tweede lid kan worden gewijzigd, voor zover die kosten meer bedragen dan de totale som van die
      heffing, bestemd voor de bestrijding van die kosten, zoals geheven over de tot laatstbedoelde datum verstreken
      kalenderjaren.


      4 In geval van toepassing van artikel 91h, tweede lid, wordt bij de in dat artikellid bedoelde algemene maatregel
      van bestuur het tarief van de desbetreffende heffing verhoogd met ingang van 1 januari van het in artikel 91h,
      tweede lid, bedoelde kalenderjaar. De verhoging wordt gebaseerd op een raming van de kosten, bedoeld in artikel
      95c, onderdeel c, voor zover die kosten betrekking hebben op de bij de desbetreffende heffing betrokken diersoort,
      over de kalenderjaren, te rekenen vanaf de in de vorige volzin bedoelde datum tot de datum met ingang waarvan uit
      hoofde van het tweede lid het tarief van de desbetreffende heffing kan worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel91i
  - number: '92'
    text: |-
      1 Terzake van het verhandelen, vervoeren of slachten van dieren, het produceren, vervoeren of verhandelen van
      dierlijke producten of het bereiden van diervoeder, dan wel terzake van het anders dan op een bedrijf houden
      van dieren, kunnen bij algemene maatregel van bestuur, met ingang van een datum die volgt op de datum van
      inwerkingtreding van de desbetreffende algemene maatregel van bestuur, heffingen worden ingevoerd die worden
      geheven van personen of rechtspersonen, dan wel samenwerkingsverbanden van personen of rechtspersonen, welke
      heffingen dienen ter bestrijding van de kosten:

      a. bedoeld in [artikel 83][ref1] en [88, vijfde lid][ref2], voor zover die kosten noodzakelijk zijn;

      b. van de tegemoetkomingen bedoeld in [artikel 86, eerste lid, aanhef en onderdelen a en b][ref3], en
      [artikel 90][ref4], alsmede de vergoedingen bedoeld in [artikel 91][ref5];

      c. van door Onze Minister getroffen maatregelen en voorzieningen als bedoeld in [hoofdstuk II, afdeling 3][ref6],
      voor zover die kosten noodzakelijk zijn, waartoe tevens gerekend worden de kosten van door Onze Minister getroffen
      maatregelen en voorzieningen die noodzakelijk zijn met het oog op de bescherming van het welzijn van dieren dan wel
      met het oog op onderzoek naar de mate van verspreiding van die ziekten in Nederland, en

      d. die noodzakelijk zijn met het oog op de heffing en invordering van de heffingen.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat een heffing als bedoeld in het eerste lid, met ingang
      van 1 januari van een op de datum van inwerkingtreding van die maatregel volgend kalenderjaar, tevens wordt geheven
      ter bestrijding van de kosten van het Diergezondheidsfonds, voor zover noodzakelijk met het oog op het weren van op
      grond van [artikel 15, eerste lid][ref7], aangewezen besmettelijke ziekten.

      3 Een algemene maatregel van bestuur als bedoeld in het eerste lid kan gevallen bepalen op grond waarvan korting
      op het tarief van de desbetreffende heffing wordt verkregen. Daarbij wordt in ieder geval rekening gehouden met de
      mate waarin de heffingplichtige activiteit een risico oplevert voor de verspreiding van besmettelijke dierziekten.

      4 De toepassing van het derde lid geschiedt zodanig dat in geen geval meer dan 70% korting op het tarief van de
      heffing wordt verkregen.

      5 Een krachtens het eerste lid ingevoerde heffing wordt geheven bij wege van aanslag.


