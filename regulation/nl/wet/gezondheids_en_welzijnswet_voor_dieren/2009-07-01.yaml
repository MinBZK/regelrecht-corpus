    text: |-
      1 Er is een Diergezondheidsfonds, hierna te noemen: het fonds.

      2 Het fonds is een begrotingsfonds als bedoeld in [artikel 9, eerste lid, van de Comptabiliteitswet 2001][ref1].

      3 Onze Minister beheert de begroting van het fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel9
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel95a
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '9'
  - number: 95b
    text: |-
      De ontvangsten van het fonds worden gevormd door:

      a. een jaarlijkse bijdrage vanuit de begroting van het Ministerie van Landbouw, Natuur en Voedselkwaliteit,
      welke bijdrage in omvang ten hoogste overeenkomt met de op deze begroting in het desbetreffende begrotingsjaar
      binnenkomende som van de varkensheffing;

      b. het aantal jaarlijkse bijdragen vanuit de begroting van het Ministerie van Landbouw, Natuur en Voedselkwaliteit
      dat overeenkomt met het aantal krachtens [artikel 91h][ref1] ingevoerde heffingen, welke bijdragen
      onderscheidenlijk ten hoogste overeenkomen met de op de genoemde begroting in het desbetreffende begrotingsjaar
      binnenkomende som van de onderscheiden heffingen;

      c. het aantal jaarlijkse bijdragen vanuit de begroting van het Ministerie van Landbouw, Natuur en Voedselkwaliteit
      dat overeenkomt met het aantal krachtens [artikel 92][ref2] ingevoerde heffingen, welke bijdragen onderscheidenlijk
      ten hoogste overeenkomen met de op de genoemde begroting in het desbetreffende begrotingsjaar binnenkomende som van
      de onderscheiden heffingen;

      d. overige bijdragen vanuit de begroting van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      e. de door de Europese Unie ter beschikking gestelde middelen, verband houdende met het weren en de bestrijding van
      op grond van [artikel 15, eerste lid][ref3], aangewezen besmettelijke dierziekten;

      f. andere ontvangsten.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel91h
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel92
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel95b
    references:
