  - number: 81e
    text: >-
      In deze afdeling en de daarop berustende bepalingen wordt verstaan onder ondernemer: eigenaar of exploitant van een
      door Onze Minister erkend categorie 1-verwerkingsbedrijf of een categorie 2-verwerkingsbedrijf.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel81e
  - number: 81f
    text: |-
      1 Onze Minister stelt met het oog op de doelmatige voorziening in de verwerking van categorie 1-materiaal of
      categorie 2-materiaal voor iedere ondernemer een werkgebied vast waarin deze met uitsluiting van andere ondernemers
      categorie 1-materiaal of categorie 2-materiaal of bepaalde soorten categorie 1-materiaal of categorie 2-materiaal
      verwerkt.

      2 Onze Minister kan:

      a. een in het eerste lid bedoeld werkgebied vaststellen dat zich uitstrekt tot het grondgebied van een
      andere lidstaat van de Europese Unie of een gedeelte daarvan, indien daarover overeenstemming bestaat met de
      desbetreffende lidstaat, en

      b. een in het eerste lid bedoeld werkgebied vaststellen voor een categorie 1-verwerkingsbedrijf of categorie 2-
      verwerkingsbedrijf dat is gevestigd in een andere lidstaat van de Europese Unie en is erkend door de bevoegde
      autoriteit van die lidstaat.

      3 Indien aan een in het tweede lid, onderdeel b, bedoeld categorie 1-verwerkingsbedrijf of categorie 2-
      verwerkingsbedrijf een werkgebied binnen Nederland is toegewezen, zijn de [artikelen 81g][ref1], [81h][ref2] en
      [81i][ref3] van overeenkomstige toepassing.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de toepassing,
      vaststelling of wijziging van werkgebieden.

      5 Bij of krachtens algemene maatregel van bestuur kunnen in afwijking van het eerste lid tijdelijk regels worden
      gesteld met betrekking tot situaties waarin de ondernemer als gevolg van overmacht niet in staat is het categorie
      1-materiaal of categorie 2-materiaal te verwerken. Deze regels zijn van toepassing zolang de situatie dit vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel81g
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel81h
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel81i
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel81f
