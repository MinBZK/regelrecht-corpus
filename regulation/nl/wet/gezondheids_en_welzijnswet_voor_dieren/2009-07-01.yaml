  - number: '34'
    text: >-
      1 Het is verboden dieren met het oog op de produktie van van die dieren afkomstige produkten te houden, tenzij deze
      behoren tot bij algemene maatregel van bestuur aangewezen soorten of categorieën daarvan.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel34
  - number: '35'
    text: >-
      1 Bij algemene maatregel van bestuur worden regelen gesteld omtrent de wijze waarop dieren van bij die maatregel
      aangewezen soorten of categorieën van dieren mogen worden gehouden.


      2 De krachtens het eerste lid gestelde regelen kunnen onder meer betrekking hebben op:


      a. het vastleggen of aangebonden houden van dieren;


      b. het gescheiden houden van dieren van verschillende leeftijd, geslacht of soort;


      c. de ruimte waarover dieren moeten kunnen beschikken.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel35
  - number: '36'
    text: >-
      1 Het is verboden om zonder redelijk doel of met overschrijding van hetgeen ter bereiking van zodanig doel
      toelaatbaar is, bij een dier pijn of letsel te veroorzaken dan wel de gezondheid of het welzijn van een dier te
      benadelen.


      2 Tot de in het eerste lid verboden gedragingen worden in ieder geval gerekend:


      a. een dier arbeid doen verrichten, welke kennelijk zijn krachten te boven gaat of waartoe het uit hoofde van zijn
      toestand ongeschikt is;


      b. een koe met overvolle uier vervoeren of op een markt of openbare verkoping ten verkoop houden;


      c. bij de verlossing van een koe gebruik te maken van dierlijke trekkracht of van een niet door Onze Minister
      daarvoor toegelaten krachttoestel;


      d. een hond als trekkracht gebruiken.


      3 Een ieder is verplicht hulpbehoevende dieren de nodige zorg te verlenen.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel36
  - number: '37'
    text: Het is de houder van een dier verboden aan een dier de nodige verzorging te onthouden.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel37
  - number: '38'
    text: >-
      Bij algemene maatregel van bestuur worden voor bij die maatregel aangewezen categorieën van houders van dieren van
      bij die maatregel aangewezen soorten of categorieën van dieren regelen gesteld omtrent de verzorging, voedering,
      drenking, behandeling en het africhten van dieren.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel38
  - number: '39'
    text: >-
      Het is verboden dieren van bij algemene maatregel van bestuur aangewezen soorten of categorieën van dieren van het
      ouderdier te scheiden voordat die dieren een bij die maatregel vastgestelde leeftijd hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel39
  - number: '40'
    text: >-
      1 Het is verboden een of meer lichamelijke ingrepen bij een dier te verrichten, waarbij een deel of delen van het
      lichaam wordt of worden verwijderd of beschadigd.


      2 Het bepaalde in het eerste lid is niet van toepassing op:


      a. ingrepen betreffende het onvruchtbaar maken van een dier;


      b. ingrepen waarvoor een diergeneeskundige noodzaak bestaat;


      c. bij algemene maatregel van bestuur aangewezen ingrepen;


      d. overige bij of krachtens enig wettelijk voorschrift verplichte dan wel toegestane ingrepen.


      3 Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de wijze waarop en de gevallen waarin de
      lichamelijke ingrepen, bedoeld in het tweede lid, onderdelen *c* en *d*, slechts mogen worden verricht.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel40
  - number: '41'
    text: >-
      1 Het is verboden deel te nemen aan tentoonstellingen, keuringen of wedstrijden met dieren waarbij een bij artikel
      40 verboden ingreep is verricht.


      2 Het is verboden dieren waarbij een bij artikel 40 verboden ingreep is verricht, tot een tentoonstelling, keuring
      of wedstrijd toe te laten.


      3 Het ten verkoop in voorraad hebben, ten verkoop aanbieden, verkopen en kopen van dieren waarbij een bij artikel
      40 verboden ingreep is verricht, is verboden.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel41
  - number: '42'
    text: >-
      Bij algemene maatregel van bestuur worden regelen gesteld omtrent embryotransplantatie bij dieren van bij die
      maatregel aangewezen soorten of categorieën van dieren.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel42
  - number: '44'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regelen gesteld omtrent het doden van dieren van bij die
      maatregel aangewezen soorten of categorieën van dieren.

      2 De krachtens het eerste lid gestelde regelen hebben in ieder geval betrekking op:

      - de wijze waarop, de situaties waarin en de personen door wie dieren mogen worden gedood;
      - de bedwelming van slachtdieren;
      - de bedrijfsuitrusting en installatie in slachterijen.

      3 Het slachten van dieren zonder voorafgaande bedwelming volgens de israëlitische of de islamitische ritus is
      toegestaan.

      4 Het slachten, bedoeld in het derde lid, mag slechts geschieden in door Onze Minister, in overeenstemming met Onze
      Minister van Volksgezondheid, Welzijn en Sport aan te wijzen inrichtingen.

      5 Een aanwijzing als bedoeld in het vierde lid vindt plaats:

      a. indien het betreft het slachten volgens de israëlitische ritus: op verzoek van de Permanente Commissie tot de
      Algemene Zaken van het Nederlands-Israëlitisch Kerkgenootschap;

      b. indien het betreft het slachten volgens de islamitische ritus: op verzoek van één of meer organisaties die
      geacht kunnen worden alle of een bepaalde groep islamieten in Nederland te vertegenwoordigen;

      een en ander voor zover uit het desbetreffende verzoek blijkt dat in het deel van het land dat vanuit de aan te
      wijzen inrichtingen pleegt te worden bediend behoefte bestaat aan vlees, afkomstig van volgens de desbetreffende
      ritus geslachte dieren.

      6 Een aanwijzing als bedoeld in het vierde lid vindt voorts plaats op verzoek van een israëlitische of islamitische
      groepering in een ander land, waarmee wordt ingestemd door de in het vijfde lid, onderdeel *a*, genoemde commissie,
      onderscheidenlijk de in onderdeel *b* bedoelde organisaties indien in het verzoek wordt aangetoond dat bij
      die israëlitische of islamitische groepering behoefte bestaat aan de import van vlees afkomstig van volgens de
      desbetreffende ritus geslachte dieren.

      7 Onze Minister stelt, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport en in overleg met
      de aangewezen inrichting en

      a. voor zover het betreft de behoefte aan vlees, afkomstig van volgens de israëlitische ritus geslachte dieren: in
      overleg met de Permanente Commissie tot de Algemene Zaken van het Nederlands-Israëlitisch Kerkgenootschap, of

      b. voor zover het betreft de behoefte aan vlees, afkomstig van volgens de islamitische ritus geslachte dieren: in
      overleg met de in het vijfde lid, onderdeel *b*, bedoelde organisaties,

      het aantal in een bepaald tijdvak per inrichting ritueel te slachten dieren vast, waarmede in de bedoelde behoefte
      aan vlees kan worden voorzien.

      8 Het slachten zonder voorafgaande bedwelming mag slechts geschieden:

      a. voor zover het betreft het slachten volgens de israëlitische ritus: door personen die daartoe door het
      Opperrabbinaat voor Nederland zijn gemachtigd, en

      b. voor zover het betreft het slachten volgens de islamitische ritus: door personen die daartoe door de in het
      vijfde lid, onderdeel *b*, bedoelde organisaties zijn aangewezen, mits die personen daarvan door een schriftelijk
      bewijs aan de keuringsdierenarts hebben doen blijken.

      Deze personen voegen zich ten aanzien van het aantal door hen ritueel te slachten dieren naar de voor elke
      inrichting aangewezen hoeveelheid; zij volgen ter zake de aanwijzingen van de keuringsdierenarts op, die toeziet,
      dat het vastgestelde aantal niet wordt overschreden.

      9 Bij algemene maatregel van bestuur worden in het belang van de bescherming van het slachtdier regelen gesteld
      omtrent het slachten volgens de israëlitische of de islamitische ritus.

      10 Een voordracht voor een algemene maatregel van bestuur als bedoeld in het negende lid wordt Ons gedaan door Onze
      Minister en Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel44
  - number: '45'
    text: |-
      1 Onverminderd het bepaalde krachtens artikel 35 kunnen bij algemene maatregel van bestuur voor daarbij aan te
      wijzen categorieën van houders van dieren van bij die maatregel aangewezen soorten of categorieën van dieren
      regelen worden gesteld omtrent de huisvesting van dieren.

      2 De krachtens het eerste lid gestelde regelen kunnen onder meer betrekking hebben op:

      - de afmetingen en uitvoeringen van kooien, hokken en stallen alsmede hun vormgeving;
      - de aard van de wanden en van het vloer- en grondoppervlak van kooien, hokken en stallen, in het bijzonder de
      daarvoor te gebruiken materialen;
      - de inrichting van kooien, hokken en stallen, in het bijzonder de daarin aan te brengen voeder- en
      drinkwatervoorzieningen alsook voorzieningen die het voor de dieren mogelijk maken om soorteigen gedrag te
      ontplooien;
      - de verlichting, luchtverversing en verwarming van kooien, hokken en stallen;
      - de aanwezigheid en de aard van afrasteringen;
      - de voorzieningen binnen huisvestingssystemen.

      3 Bij algemene maatregel van bestuur kan het ten verkoop in voorraad hebben, verkopen en afleveren van daarbij aan
      te wijzen huisvestingssystemen, onderdelen daarvan of voorzieningen binnen huisvestingssystemen worden verboden dan
      wel slechts worden toegestaan voor zover die systemen, onderdelen of voorzieningen voldoen aan bij die maatregel
      gestelde eisen.

      4 Indien Onze Minister overweegt een voordracht te doen tot vaststelling, wijziging of intrekking van een algemene
      maatregel van bestuur als bedoeld in het eerste of derde lid kan hij, indien het belang van het welzijn van dieren
      naar zijn oordeel een onmiddellijke voorziening vereist regelen stellen overeenkomstig de in overweging zijnde
      maatregel.

      5 Een regeling als bedoeld in het vierde lid blijft, behoudens eerdere intrekking, van kracht totdat de daar
      bedoelde algemene maatregel van bestuur in werking treedt, doch uiterlijk tot acht maanden na het in werking treden
      van de regeling.

      6 Tenzij bij een maatregel als bedoeld in het eerste of derde lid of een regeling als bedoeld in het vierde lid
      anders wordt bepaald, is het bepaalde bij of krachtens de artikelen 46 tot en met 54 niet van toepassing in het
      geval voor de dieren van de aangewezen soort of categorie van dieren bij die maatregel of regeling, regelen zijn
      gesteld omtrent de huisvesting.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel45
  - number: '55'
    text: >-
      1 Bij of krachtens algemene maatregel van bestuur worden regelen gesteld omtrent het fokken met dieren van bij die
      maatregel aangewezen soorten of categorieën van dieren. Deze regelen kunnen onder meer betrekking hebben op:


      a. de methode van fokken;


      b. het registreren, identificeren en certificeren van dieren;


      c. het voorafgaand aan het fokken door de fokker te verrichten of te doen verrichten onderzoek bij een dier waarmee
      wordt gefokt naar de aanwezigheid van aandoeningen die de gezondheid of het welzijn van het dier of de nakomelingen
      van het dier kunnen aantasten, alsmede de methoden die daarbij worden gebruikt.


      2 Bij algemene maatregel van bestuur kan het worden verboden een dier dat beschikt over één of meer aangewezen
      aandoeningen of uiterlijke kenmerken die de gezondheid of het welzijn van het dier of de nakomelingen van het dier
      kunnen aantasten te fokken of voor de fok te gebruiken.


      3 Bij algemene maatregel van bestuur kan het worden verboden een dier dat beschikt over één of meer aangewezen
      aandoeningen of uiterlijke kenmerken waarvoor krachtens het tweede lid een fokverbod is ingesteld, ten verkoop in
      voorraad te hebben, ten verkoop aan te bieden, te verkopen, te kopen, toe te laten tot een tentoonstelling, keuring
      of wedstrijd dan wel om met een dergelijk dier deel te nemen aan een tentoonstelling, keuring of wedstrijd.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel55
  - number: '56'
    text: >-
      Bij algemene maatregel van bestuur worden regelen gesteld omtrent het bedrijfsmatig verkopen, ten verkoop in
      voorraad hebben, ten verkoop aanbieden, verhuren en afleveren van dieren van bij die maatregel aangewezen soorten
      of categorieën van dieren.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel56
  - number: '57'
    text: >-
      Het is verboden dieren als prijs, beloning of gift uit te loven of uit te reiken bij wedstrijden, verlotingen,
      weddenschappen of andere dergelijke evenementen.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel57
  - number: '58'
    text: |-
      1 In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:

      a. EG-verordening: verordening van de Raad van de Europese Unie of van het Europees Parlement en de Raad van
      de Europese Unie gezamenlijk, die geheel of gedeeltelijk berust op de artikelen 37 of 95 van het Verdrag tot
      oprichting van de Europese Gemeenschap en waarin voorschriften zijn neergelegd inzake de bescherming van dieren
      tijdens het vervoer en daarmee samenhangende activiteiten;

      b. EG-richtlijn: richtlijn van de Raad van de Europese Unie of het Europees Parlement en de Raad van de Europese
      Unie gezamenlijk, die geheel of gedeeltelijk berust op de artikelen 37 of 95 van het Verdrag tot oprichting van de
      Europese Gemeenschap en waarin voorschriften zijn neergelegd inzake de bescherming van dieren tijdens het vervoer
      en daarmee samenhangende activiteiten;

      c. EG-beschikking: beschikking die gebaseerd is op een EG-verordening of een EG-richtlijn.

      2 Voor de toepassing van deze afdeling en de daarop berustende bepalingen gelden de begripsomschrijvingen zoals die
      zijn neergelegd in EG-verordeningen. Daar waar deze begripsbepalingen afwijken van de in [artikel 1][ref1] van deze
      wet opgenomen begripsbepalingen, gelden de begripsbepalingen zoals die zijn neergelegd in de EG-verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel1
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '1'
        hoofdstuk: I
  - number: '59'
    text: >-
      Het is verboden te handelen in strijd met bij ministeriële regeling aan te wijzen voorschriften van EG-
      verordeningen.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel59
  - number: 59a
    text: >-
      1 Bij ministeriële regeling kunnen regels worden gesteld voor een goede uitvoering van EG-verordeningen.


      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter implementatie van EG-
      richtlijnen.


      3 Bij ministeriële regeling kunnen regels worden gesteld ter implementatie van EG-beschikkingen.


      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter implementatie van een
      overeenkomst betreffende de bescherming van dieren tijdens het vervoer en daarmee samenhangende activiteiten tussen
      de Europese Gemeenschap en een derde land of een internationale organisatie.


      5 De regels bedoeld in het eerste tot en met vierde lid kunnen betrekking hebben op:


      a. het aanwijzen van een bevoegde autoriteit;


      b. het aanwijzen van officiële dierenartsen;


      c. het verlenen, schorsen en intrekken van certificaten, erkenningen, vergunningen en getuigschriften van
      vakbekwaamheid;


      d. het erkennen van examens;


      e. het uitvoeren van controles en inspecties die relevant zijn voor de bescherming van dieren tijdens het vervoer
      en daarmee samenhangende activiteiten;


      f. de vervoermiddelen die ten behoeve van het vervoeren van dieren worden gebruikt, alsmede hun uitrusting en
      inrichting;


      g. kooien, kisten, kratten, dozen en dergelijke voorwerpen die ten behoeve van het vervoer van dieren worden
      gebruikt en daartoe kennelijk bestemd zijn;


      h. de beladingsdichtheid van vervoermiddelen als bedoeld in onderdeel f;


      i. het in- en uitladen van dieren, of


      j. de duur en de afstand van vervoer.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel59a
  - number: 59b
    text: |-
      1 Bij ministeriële regeling kunnen in aanvulling op de krachtens [artikel 59a, eerste lid][ref1], gestelde regels,
      nadere voorschriften worden gesteld over de onderwerpen die zijn geregeld in de EG-verordening, voor een goede
      uitvoering waarvan die regels zijn gesteld.

      2 Bij of krachtens algemene maatregel van bestuur kunnen in aanvulling op de krachtens
      [artikel 59a, tweede en vierde lid][ref2], gestelde regels, nadere voorschriften worden gesteld over de onderwerpen
      waarop die regels betrekking hebben.

      3 Bij ministeriële regeling kunnen in aanvulling op de krachtens [artikel 59a, derde lid][ref3], gestelde regels,
      nadere voorschriften worden gesteld over de onderwerpen waarop die regels betrekking hebben.

      4 De krachtens het eerste en tweede lid gestelde regels hebben slechts betrekking op ander vervoer dan vervoer
      dat geschiedt in de uitoefening van of ten behoeve van een beroep, onderneming of bedrijf, voor zover dat bij die
      regels is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel59a
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel59a
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel59a
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel59b
