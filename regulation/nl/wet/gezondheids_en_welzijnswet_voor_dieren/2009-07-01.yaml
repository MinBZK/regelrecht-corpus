  - number: '109'
    text: |-
      1 Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van
      Beroep voor het bedrijfsleven.

      2 In afwijking van het eerste lid staat tegen een op grond van [hoofdstuk VIIa][ref1] genomen besluit voor een
      belanghebbende beroep open overeenkomstig [hoofdstuk 20 van de Wet milieubeheer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005662#HoofdstukVIIa
