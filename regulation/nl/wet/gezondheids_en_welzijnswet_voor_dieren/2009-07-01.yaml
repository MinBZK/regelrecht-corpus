  - number: 81g
    text: >-
      1 De eigenaar of houder van door Onze Minister aan te wijzen categorie 1-materiaal of categorie 2-materiaal geeft
      dit materiaal aan bij, houdt het ter beschikking van en staat het af aan de ondernemer binnen wiens werkgebied het
      materiaal zich bevindt.


      2 De ondernemer haalt het bij hem aangegeven categorie 1-materiaal en categorie 2-materiaal op en verwerkt het.


      3 Het eerste en tweede lid zijn niet van toepassing op dode gezelschapsdieren en categorie 1-materiaal en categorie
      2-materiaal dat als gevolg van contact met of beïnvloeding anderszins door splijtstoffen, ertsen, radioactieve
      stoffen of ioniserende stralen uitzendende toestellen zodanig is bestraald of besmet dat het een gevaar vormt voor
      de volksgezondheid.


      4 Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van de in het eerste en tweede lid
      gestelde verplichtingen.


      5 De eigenaar of houder van categorie 3-materiaal bewaart het materiaal overeenkomstig bij ministeriële regeling
      vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel81g
  - number: 81h
    text: |-
      1 Bij gemeentelijke verordening worden ten aanzien van dode gezelschapsdieren regels gesteld ter zake van:

      a. het aangeven en bewaren door de eigenaar of houder van dode gezelschapsdieren;

      b. het ophalen van dode gezelschapsdieren;

      c. het overdragen van dode gezelschapsdieren aan de ondernemer binnen wiens werkgebied het materiaal zich bevindt.

      2 Indien tussen een gemeente en de in het eerste lid, onderdeel c, bedoelde ondernemer een overeenkomst is gesloten
      omtrent de in het eerste lid, onderdelen b en c, genoemde onderwerpen, behoeft de gemeentelijke verordening geen
      voorschriften over die onderwerpen te bevatten.

      3 De ondernemer verwerkt de aan hem overgedragen dode gezelschapsdieren.

      4 De in het eerste lid bedoelde voorschriften en het derde lid zijn niet van toepassing indien dode
      gezelschapsdieren worden verwerkt of verwijderd op een wijze die ingevolge de krachtens [artikel 81c][ref1]
      gestelde voorschriften is toegestaan, niet zijnde de wijze waarop de ondernemer de dode gezelschapsdieren verwerkt.

      5 Onze Minister kan het eerste, tweede en derde lid van overeenkomstige toepassing verklaren op soorten categorie
      1-materiaal, niet zijnde dode gezelschapsdieren, of categorie 2-materiaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel81c
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel81h
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: 81c
        hoofdstuk: VIIa
        afdeling: '2'
  - number: 81i
    text: >-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de vergoeding
      die een ondernemer voor het ophalen, vervoeren, verwerken of verwijderen van categorie 1-materiaal of categorie 2-
      materiaal in rekening brengt aan een natuurlijk persoon of rechtspersoon die categorie 1-materiaal of categorie 2-
      materiaal aanbiedt.


      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot een door de
      ondernemer te betalen vergoeding voor de huiden van eenhoevige en herkauwende dieren aan de eigenaar of houder die
      categorie 1-materiaal of categorie 2-materiaal aanbiedt.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel81i
