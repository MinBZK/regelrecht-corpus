  - number: 91b
    text: >-
      1 De varkensheffing wordt geheven naar het aantal varkens, uitgedrukt in heffingseenheden, dat gemiddeld in een
      kalenderjaar op het bedrijf wordt gehouden. De omrekening van varkens in heffingseenheden geschiedt overeenkomstig
      de bij deze wet behorende bijlage.


      2 Bij ministeriële regeling worden nadere regels gesteld omtrent de wijze waarop het gemiddelde aantal varkens
      wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel91b
  - number: 91c
    text: >-
      Bij algemene maatregel van bestuur kan worden bepaald dat over de bij die maatregel vast te stellen categorieën
      varkens geheel of ten dele geen varkensheffing verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel91c
  - number: 91d
    text: >-
      1 Het tarief van de varkensheffing bedraagt € 5,22 per heffingseenheid.


      2 Telkens met ingang van 1 januari van het kalenderjaar, volgende op een periode van drie kalenderjaren, te
      rekenen vanaf 1 januari 1998, kan het tarief van de varkensheffing voor de op die periode volgende periode van
      drie kalenderjaren worden gewijzigd. Een wijziging als bedoeld in de vorige volzin geschiedt bij algemene maatregel
      van bestuur die in werking treedt voor het tijdstip waarop de periode aanvangt waarop de wijziging van het tarief
      betrekking heeft.


      3 Wijziging van het tarief op grond van het tweede lid geschiedt op basis van het saldo van:


      a. een raming van de kosten, bedoeld in artikel 91a, eerste lid, en, voor zover van toepassing, artikel 91a, tweede
      lid, over een periode van drie kalenderjaren, te rekenen vanaf 1 januari van het kalenderjaar met ingang waarvan
      het tarief uit hoofde van het tweede lid kan worden gewijzigd, bij welke raming rekening wordt gehouden met het
      totaal van de kosten, bedoeld in artikel 91a, eerste lid, over een periode van drie jaar die eindigt op 1 juli van
      het kalenderjaar dat voorafgaat aan de periode waarop de raming betrekking heeft;


      b. ten hoogste 50% van de door het Diergezondheidsfonds gemaakte kosten, bedoeld in artikel 91a, eerste lid, over
      de periode vanaf de datum van invoering van de varkensheffing tot 1 januari van het kalenderjaar dat voorafgaat
      aan het kalenderjaar met ingang waarvan het tarief uit hoofde van het tweede lid kan worden gewijzigd, voor zover
      die kosten meer bedragen dan de totale som van de varkensheffing, bestemd voor de bestrijding van die kosten, zoals
      geheven over de tot laatstbedoelde datum verstreken kalenderjaren, en, voor zover van toepassing,


      c. ten hoogste 50% van de door het Diergezondheidsfonds gemaakte kosten, bedoeld in artikel 91a, tweede lid, over
      de periode vanaf de in dat artikellid genoemde datum tot 1 januari van het kalenderjaar dat voorafgaat aan het
      kalenderjaar met ingang waarvan het tarief uit hoofde van het tweede lid kan worden gewijzigd, voor zover die
      kosten meer bedragen dan de totale som van de varkensheffing, bestemd voor de bestrijding van die kosten, zoals
      geheven over de tot laatstbedoelde datum verstreken kalenderjaren.


      4 In geval van toepassing van artikel 91a, tweede lid, wordt bij de in dat artikellid bedoelde algemene maatregel
      van bestuur het tarief van de varkensheffing verhoogd met ingang van 1 januari van het in artikel 91a, tweede lid,
      bedoelde kalenderjaar. De tariefsverhoging wordt gebaseerd op een raming van de kosten, bedoeld in artikel 95c,
      onderdeel c, over de kalenderjaren, te rekenen vanaf de in de vorige volzin bedoelde datum tot de datum met ingang
      waarvan uit hoofde van het tweede lid het tarief van de varkensheffing kan worden gewijzigd, voor zover die kosten
      betrekking hebben op de diersoort varken.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel91d
  - number: 91e
    text: |-
      1 Het tarief van de varkensheffing wordt verminderd met:

      a. het aantal procentpunten dat overeenkomt met de uitkomst van de vermenigvuldiging van het aantal tot het bedrijf
      behorende vestigingen waarvan elke opstal of elk perceel grond op 1 januari van het desbetreffende kalenderjaar
      is gelegen buiten een concentratiegebied als bedoeld in [artikel 1, eerste lid, van de Meststoffenwet][ref1] en de
      deling van het cijfer 15 door het totaal aantal vestigingen van het desbetreffende bedrijf;

      b. 40 procentpunten indien in het desbetreffende kalenderjaar ten aanzien van elke tot het bedrijf behorende
      vestiging noch sprake is van aanvoer van varkens, noch sprake is van afvoer van varkens aan enige andere vestiging
      van dat bedrijf of van enig ander bedrijf;

      c. 30 procentpunten indien in het desbetreffende kalenderjaar ten aanzien van één of meer tot het bedrijf behorende
      vestigingen de som van het aantal vestigingen van dat bedrijf of enig ander bedrijf waaraan vanaf de desbetreffende
      vestiging varkens worden geleverd en het aantal vestigingen van dat bedrijf of enig ander bedrijf van waar aan de
      desbetreffende vestiging varkens worden geleverd gelijk is aan 1, met dien verstande dat ten aanzien van geen van
      de tot het bedrijf behorende vestigingen die som groter is dan 1;

      d. 20 procentpunten indien in het desbetreffende kalenderjaar ten aanzien van één of meer tot het bedrijf behorende
      vestigingen de som van het aantal vestigingen van dat bedrijf of enig ander bedrijf waaraan vanaf de desbetreffende
      vestiging varkens worden geleverd en het aantal vestigingen van dat bedrijf of enig ander bedrijf van waar aan de
      desbetreffende vestiging varkens worden geleverd gelijk is aan 2, met dien verstande dat ten aanzien van geen van
      de tot het bedrijf behorende vestigingen die som groter is dan 2;

      e. 10 procentpunten indien in het desbetreffende kalenderjaar ten aanzien van één of meer tot het bedrijf behorende
      vestigingen de som van het aantal vestigingen van dat bedrijf of enig ander bedrijf waaraan vanaf de desbetreffende
      vestiging varkens worden geleverd en het aantal vestigingen van dat bedrijf of enig ander bedrijf waarvandaan aan
      de desbetreffende vestiging varkens worden geleverd gelijk is aan 3, met dien verstande dat ten aanzien van geen
      van de tot het bedrijf behorende vestigingen die som groter is dan 3 en vanaf geen van de tot het bedrijf behorende
      vestigingen aan meer dan 2 vestigingen van dat bedrijf of enig ander bedrijf varkens worden geleverd, en

      f. een bij algemene maatregel van bestuur, op ten minste 5 en ten hoogste 25, vastgesteld aantal procentpunten,
      indien het bedrijf deelneemt aan een samenhangend stelsel van voorwaarden met betrekking tot de gezondheid van
      varkens dat is gericht op de verschillende, bij de productie van varkens en varkensvlees, betrokken ondernemingen
      en dat voldoet aan bij algemene maatregel van bestuur te stellen voorwaarden.

      2 Bij algemene maatregel van bestuur kunnen, met ingang van 1 januari van het kalenderjaar dat volgt op de datum
      van inwerkingtreding van die algemene maatregel van bestuur, het in het eerste lid, onderdeel a, genoemde cijfer en
      de in het eerste lid, onderdelen b tot en met e, genoemde aantallen procentpunten worden vervangen door een ander
      cijfer, onderscheidenlijk andere aantallen.

      3 Bij algemene maatregel van bestuur kunnen, met ingang van 1 januari van het kalenderjaar dat volgt op de datum
      van inwerkingtreding van die algemene maatregel van bestuur, met het oog op de bestrijding of het weren van voor
      varkens besmettelijke ziekten, andere gevallen worden bepaald op basis waarvan het tarief van de varkensheffing
      wordt verminderd.

      4 Bij algemene maatregel van bestuur kan worden bepaald dat het tarief van de varkensheffing wordt verminderd met
      een bij die maatregel, op ten minste 5 en ten hoogste 25, vastgesteld aantal procentpunten, indien het bedrijf op
      een bij die maatregel te bepalen tijdstip voldoet aan bij die maatregel te bepalen voorschriften met betrekking tot
      één of meer onderdelen waarover krachtens hoofdstuk III van deze wet regels zijn gesteld.

      5 De toepassing van het eerste, tweede, derde of vierde lid, geschiedt zodanig dat in geen geval meer dan 70%
      korting op het tarief van de varkensheffing wordt verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel91e
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '1'
  - number: 91f
    text: De varkensheffing wordt geheven bij wege van aanslag.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel91f
  - number: 91g
    text: >-
      Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van de door de in artikel 91a, eerste lid,
      bedoelde heffingplichtigen te voeren administratie met het oog op de vaststelling van het aantal en de categorieën
      varkens waarover de varkensheffing verschuldigd is en de toepassing van het bij of krachtens artikel 91e bepaalde.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel91g
  - number: 91h
    text: |-
      1 Terzake van het houden van dieren, behorende tot enige andere diersoort dan de diersoort varken, kunnen bij
      algemene maatregel van bestuur, met ingang van een datum die volgt op de datum van inwerkingtreding van de
      desbetreffende algemene maatregel van bestuur, heffingen worden ingevoerd die worden geheven van de persoon of
      rechtspersoon die of het samenwerkingsverband van personen of rechtspersonen dat een bedrijf voert, welke heffingen
      dienen ter bestrijding van de kosten:

      a. bedoeld in [artikel 83][ref1] en [88, vijfde lid][ref2], voor zover die kosten noodzakelijk zijn met het oog
      op de bestrijding van voor andere diersoorten dan de diersoort varken op grond van [artikel 15, eerste lid][ref3],
      aangewezen besmettelijke ziekten;

      b. van de tegemoetkomingen bedoeld in [artikel 86, eerste lid, aanhef en onderdelen a en b][ref4], en
      [artikel 90][ref5], alsmede de vergoedingen bedoeld in [artikel 91][ref6], voor zover die tegemoetkomingen,
      onderscheidenlijk vergoedingen, voortvloeien uit de bestrijding van voor andere diersoorten dan de diersoort varken
      op grond van [artikel 15, eerste lid][ref7], aangewezen besmettelijke ziekten;

      c. van door Onze Minister getroffen maatregelen en voorzieningen als bedoeld in [hoofdstuk II, afdeling 3][ref8],
      voor zover die kosten noodzakelijk zijn met het oog op de bestrijding van voor andere diersoorten dan de diersoort
      varken op grond van [artikel 15, eerste lid][ref9], aangewezen besmettelijke ziekten, waartoe tevens gerekend
      worden de kosten van door Onze Minister getroffen maatregelen en voorzieningen die noodzakelijk zijn met het oog
      op de bescherming van het welzijn van dieren dan wel met het oog op onderzoek naar de mate van verspreiding van die
      ziekten in Nederland, en

      d. die noodzakelijk zijn met het oog op de heffing en invordering van de heffingen.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat een heffing als bedoeld in het eerste lid, met ingang
      van 1 januari van een op de datum van inwerkingtreding van die maatregel volgend kalenderjaar, tevens wordt
      geheven ter bestrijding van de kosten van het Diergezondheidsfonds, voor zover noodzakelijk met het oog op het
      weren van voor andere diersoorten dan de diersoort varken op grond van [artikel 15, eerste lid][ref10], aangewezen
      besmettelijke ziekten.

      3 Een krachtens het eerste lid ingevoerde heffing wordt geheven per bedrijf per kalenderjaar naar het aantal dieren
      van de bij de desbetreffende heffing betrokken diersoort dat gemiddeld in een kalenderjaar op het bedrijf wordt
      gehouden, met dien verstande dat, in geval de betrokken heffing wordt ingevoerd gedurende het kalenderjaar, de
      heffing in dat kalenderjaar wordt geheven over het nog niet verstreken deel van dat jaar.

      4 Een algemene maatregel van bestuur als bedoeld in het eerste lid kan gevallen bepalen waarin korting op het
      tarief van de desbetreffende heffing wordt verkregen. Daarbij wordt in ieder geval rekening gehouden met de mate
      waarin het bedrijf of de bedrijfsvoering van de heffingplichtige een risico vormt voor de verspreiding van op
      grond van [artikel 15, eerste lid][ref11], aangewezen en voor de bij de desbetreffende heffing betrokken diersoort
      besmettelijke ziekten. Bij de in de eerste volzin bedoelde maatregel kan op de bij die maatregel aangegeven
      wijze rekening worden gehouden met de mate waarin en het tijdstip waarop voldaan is aan bij die maatregel voor
      de desbetreffende soort of categorie dieren te bepalen voorschriften met betrekking tot één of meer onderwerpen
      waarover krachtens [hoofdstuk III van de wet][ref12] regels zijn gesteld.

      5 De toepassing van het vierde lid geschiedt zodanig dat in geen geval meer dan 70% korting op het tarief wordt
      verkregen.

      6 Een krachtens het eerste lid ingevoerde heffing wordt geheven bij wege van aanslag.


