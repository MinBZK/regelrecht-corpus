  - number: 93a
    text: |-
      1 De heffing, bedoeld in [artikel 91a][ref1], alsmede bij algemene maatregel van bestuur op
      grond van [artikel 91h][ref2] of [artikel 92][ref3] ingevoerde heffingen, worden ingevorderd
      door de door Onze Minister aangewezen functionaris en door de ontvanger, bedoeld in
      [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref4].

      2 Onverminderd het overigens bij of krachtens deze afdeling bepaalde worden de heffingen
      ingevorderd met overeenkomstige toepassing van de [Invorderingswet 1990][ref5] en de
      [Kostenwet invordering rijksbelastingen][ref6], met dien verstande dat van de [Invorderingswet 1990][ref7] buiten
      toepassing blijven [artikel 17, tweede lid, tweede volzin][ref8], alsmede de [artikelen 59][ref9] en [62][ref10].
      Voorts blijven bij de toepassing van artikel 66 van die wet de [artikelen 76][ref11], [80][ref12], tweede, derde
      en vierde lid, [82][ref13], [84][ref14], [86][ref15] en [87 van de Algemene wet inzake rijksbelastingen][ref16]
      buiten toepassing.

      3 Behoudens voor zover de invordering is opgedragen aan de ontvanger, bedoeld in het eerste lid, treedt voor de
      toepassing van de [Invorderingswet 1990][ref17] Onze Minister in de plaats van Onze Minister van Financiën.

      4 Met betrekking tot de invordering geldt dat:

      a. voor de toepassing van [artikel 8, eerste lid, van de Invorderingswet 1990][ref18] uitsluitend bevoegd is de
      door Onze Minister aangewezen functionaris;

      b. de in de [artikelen 10][ref19], eerste lid, [11][ref20], [12][ref21], en [26 van de Invorderingswet 1990][ref22]
      bedoelde bevoegdheden uitsluitend toekomen aan de door Onze Minister aangewezen functionaris, met dien verstande
      dat voor de toepassing van [artikel 26 van die wet][ref23] de bij regeling van Onze Minister van Financiën gestelde
      regels van toepassing zijn;

      c. de overige bij invordering van toepassing zijnde bevoegdheden, met uitzondering van die bedoeld in de
      [artikelen 24][ref24], [25][ref25], en [58 van de Invorderingswet 1990][ref26], uitsluitend toekomen aan de
      ontvanger, bedoeld in het eerste lid;

      d. de bevoegdheid, bedoeld in [artikel 24 van de Invorderingswet 1990][ref27], zowel toekomt aan de door Onze
      Minister aangewezen functionaris als aan de ontvanger, bedoeld in het eerste lid;

      e. de bevoegdheden, bedoeld in de [artikelen 25][ref28] en [58 van de Invorderingswet 1990][ref29], toekomen aan de
      door Onze Minister aangewezen functionaris indien hij met de invordering is belast, en toekomen aan de ontvanger,
      bedoeld in het eerste lid, indien deze laatste met de invordering is belast.

      5 In het kader van het verzet tegen de tenuitvoerlegging van het dwangbevel wordt voor de toepassing van
      [artikel 17 van de Invorderingswet 1990][ref30] voor «de ontvanger die het dwangbevel heeft uitgevaardigd» telkens
      gelezen: de met de tenuitvoerlegging van het dwangbevel belaste ontvanger.

      6 Na de betekening van het dwangbevel dient te worden betaald aan de ontvanger, bedoeld in het eerste lid, die is
      vermeld op het dwangbevel.


