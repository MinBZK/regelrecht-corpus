  - number: '61'
    text: >-
      1 Het is verboden om dierengevechten te organiseren of dieren aan dierengevechten te doen deelnemen.


      2


      3


      4
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel61
  - number: '62'
    text: >-
      1 Onze Minister kan substanties aanwijzen die het kunstmatig beïnvloeden van het prestatievermogen van dieren in
      wedstrijden tot gevolg kunnen hebben.


      2 Het is verboden een dier ingeschreven te hebben voor een wedstrijd of met een dier deel te nemen aan een
      wedstrijd, indien bij een onderzoek blijkt dat in het lichaam van dat dier een hoeveelheid van een of meer van de
      krachtens het eerste lid aangewezen substanties, bestanddelen daarvan of omzettingsprodukten aanwezig is, welke
      groter is dan een door Onze Minister vastgestelde hoogst toelaatbare hoeveelheid. Deze hoeveelheid kan op nul
      worden gesteld.


      3 In de krachtens het tweede lid vastgestelde hoeveelheid is mede begrepen de in voorkomend geval uit anderen
      hoofde in het lichaam van het dier aanwezige hoeveelheid van dezelfde substantie, bestanddeel daarvan of
      omzettingsprodukt.


      4 Onze Minister kan de aard en de wijze van uitvoering van het in het tweede lid bedoelde onderzoek voorschrijven.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel62
  - number: '63'
    text: >-
      1 Het is verboden een of meer van de krachtens artikel 62, eerste lid, aangewezen substanties toe te passen op
      dieren die zijn ingeschreven voor een wedstrijd.


      2 Het in het eerste lid bedoelde verbod is niet van toepassing op dierenartsen die ten genoegen van de ambtenaren
      die door Onze Minister met het toezicht op de naleving van deze afdeling zijn belast, aantonen dat die dieren niet
      aan de wedstrijd zullen deelnemen.


      3 Het is verboden op wedstrijdterreinen of op nader door Onze Minister aangewezen plaatsen een of meer van de
      krachtens artikel 62, eerste lid, aangewezen substanties aanwezig te hebben.


      4 Het derde lid is niet van toepassing op dierenartsen die ten genoegen van de in het tweede lid bedoelde
      ambtenaren aantonen dat de substanties niet zijn of worden gebruikt bij dieren die nog moeten deelnemen aan de
      wedstrijd.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel63
  - number: '64'
    text: >-
      In het belang van een doelmatige handhaving van deze afdeling kan Onze Minister regelen stellen met betrekking
      tot de organisatie van wedstrijden en de inrichting van wedstrijdterreinen. Daarbij kan worden bepaald dat de
      organisatie van nader aan te wijzen wedstrijden slechts is toegestaan aan instellingen die:


      a. in hun statuten hebben bepaald dat overtreding van het bepaalde in deze afdeling aan intern tuchtrecht is
      onderworpen, tenzij de officier van justitie beslist dat een overtreding strafrechtelijk zal worden afgedaan;


      b. met betrekking tot de onder hun verantwoordelijkheid georganiseerde wedstrijden nader aan te wijzen
      werkzaamheden in het kader van het verlenen van bijstand aan het toezicht op de naleving van deze afdeling
      verrichten.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel64
  - number: '65'
    text: >-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent het houden van keuringen, markten,
      verkopingen, tentoonstellingen en andere gelegenheden of inrichtingen waar dieren worden gehouden of aan het
      publiek getoond wegens recreatieve, sportieve of opvoedkundige doeleinden dan wel waar dieren al dan niet tijdelijk
      in bewaring worden genomen.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel65
  - number: '66'
    text: >-
      1 Het is zonder vergunning verboden:


      a. het genetisch materiaal van dieren te wijzigen op een wijze die voorbij gaat aan de natuurlijke barrières van
      geslachtelijke voortplanting en van recombinatie;


      b. biotechnologische technieken bij een dier of een embryo toe te passen.


      2 Op een aanvraag voor een vergunning als bedoeld in het eerste lid beslist Onze Minister, gehoord de Commissie
      biotechnologie bij dieren, bedoeld in artikel 69.


      3 Een vergunning als bedoeld in het eerste lid wordt slechts verleend indien naar het oordeel van Onze Minister:


      a. de handelingen geen onaanvaardbare gevolgen hebben voor de gezondheid of het welzijn van dieren en


      b. tegen de handelingen geen ethische bezwaren bestaan.


      4 In de vergunning wordt bepaald voor welke handelingen zij is bedoeld.


      5 Aan een vergunning kunnen voorschriften worden verbonden. Een vergunning kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel66
  - number: '67'
    text: >-
      1 Bij een aanvraag voor een vergunning als bedoeld in artikel 66 dient in ieder geval te worden overgelegd:


      a. een overzicht van de handelingen welke de aanvrager voornemens is te verrichten dan wel te laten verrichten;


      b. een door of vanwege de aanvrager opgestelde rapportage ter zake van de effecten van de handelingen op dieren,
      waaronder begrepen de gezondheid en het welzijn van dieren.


      2 Onze Minister stelt regelen omtrent het indienen van een aanvraag en omtrent de behandeling daarvan. Daarbij kan
      onder meer worden bepaald:


      a. welke gegevens en bescheiden moeten worden overgelegd alvorens een aanvraag in behandeling kan worden genomen;


      b. dat een aanvraag eerst in behandeling wordt genomen nadat een daarvoor vastgesteld bedrag is voldaan;


      c. welke kosten van het onderzoek, voortvloeiend uit een aanvraag, ten laste van de aanvrager worden gebracht;


      d. in welke gevallen een aanvraag voor een vergunning niet ontvankelijk wordt verklaard.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel67
  - number: '68'
    text: >-
      1 Het bepaalde in artikel 66, eerste lid, is niet van toepassing op bij algemene maatregel van bestuur aangewezen
      handelingen voor zover deze handelingen worden uitgevoerd overeenkomstig bij die maatregel gestelde regelen.


      2 Bij algemene maatregel van bestuur kan worden bepaald dat geen vergunning als bedoeld in artikel 66, eerste
      lid, wordt verleend voor bij die maatregel aangewezen handelingen met betrekking tot dieren van bij die maatregel
      aangewezen soorten of categorieën van dieren indien:


      a. de handelingen onaanvaardbare gevolgen hebben voor de gezondheid of het welzijn van dieren of


      b. tegen die handelingen ethische bezwaren bestaan.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel68
  - number: '69'
    text: >-
      1 Er is een Commissie biotechnologie bij dieren die is belast met de advisering van Onze Minister over de verlening
      van vergunning als bedoeld in artikel 66 en de intrekking daarvan.


      2 Bij algemene maatregel van bestuur worden regelen gesteld omtrent onder meer de samenstelling en de werkwijze van
      de commissie, bedoeld in het eerste lid. Deze regelen hebben mede betrekking op de zittingsduur, de schorsing en
      het ontslag van de leden van de commissie.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel69
  - number: '70'
    text: >-
      Bij algemene maatregel van bestuur worden nadere regelen gesteld omtrent de procedure van voorbereiding van
      beslissingen omtrent de verlening, wijziging of intrekking van vergunningen als bedoeld in artikel 66.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel70
  - number: '71'
    text: >-
      Van een verlening van een vergunning als bedoeld in artikel 66 of de intrekking daarvan wordt mededeling gedaan in
      de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel71
  - number: '72'
    text: >-
      Onze Minister kan in ieder geval een vergunning met onmiddellijke ingang schorsen, wijzigen dan wel intrekken
      indien:


      a. de bij de aanvraag verstrekte gegevens zodanig onjuist of onvolledig blijken te zijn, dat op de aanvraag een
      andere beslissing zou zijn genomen, indien bij de beoordeling daarvan de juiste gegevens bekend waren geweest;


      b. na de verlening van de vergunning is gebleken van feiten en omstandigheden die, waren zij bekend op het moment
      van de verlening van de vergunning, aanleiding zouden zijn geweest om de aanvraag te wijzigen dan wel af te wijzen;


      c. de vergunning in strijd met wettelijke voorschriften is verleend of


      d. in strijd wordt gehandeld met de aan de vergunning verbonden voorschriften of met de beperkingen waaronder de
      vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel72
  - number: '73'
    text: >-
      1 Het is verboden dieren, behorende tot door Onze Minister aangewezen soorten of categorieën van dieren te fokken,
      in Nederland te brengen, te koop aan te bieden of te verkopen.


      2 Het is verboden dieren behorende tot ingevolge het eerste lid aangewezen soorten of categorieën van dieren
      voorhanden te hebben.


      3 Ingevolge het eerste lid worden slechts aangewezen soorten of categorieën, waarvan de dieren een gevaar kunnen
      opleveren voor de veiligheid van mens of dier.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel73
  - number: '74'
    text: |-
      1 De burgemeester van de gemeente waar een dier dat in strijd met het bepaalde in artikel 73 is gefokt of
      voorhanden wordt gehouden, zich bevindt, kan bepalen dat dat dier naar een nader door hem aangewezen plaats moet
      worden vervoerd en aldaar moet worden gedood.

      2 De burgemeester legt een maatregel als bedoeld in het eerste lid, voor zover het betreft het doden van het
      dier, niet ten uitvoer indien binnen zes weken, nadat de desbetreffende beschikking aan de houder van het dier is
      bekendgemaakt, de houder een verzoek als bedoeld in [artikel 8:81 van de Algemene wet bestuursrecht][ref1] heeft
      ingediend en op dat verzoek niet afwijzend is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel881
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:81
  - number: '75'
    text: >-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder stamboek: boek, register, kaartsysteem of andere
      informatiedrager, bijgehouden door een door Onze Minister erkende instelling, waarin vee van een bepaald ras wordt
      ingeschreven of geregistreerd met vermelding van het voorgeslacht.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel75
  - number: '76'
    text: >-
      1 Onverminderd het bepaalde bij artikel 55 worden ter bevordering van de raszuiverheid of ter verbetering van de
      raskenmerken bij of krachtens algemene maatregel van bestuur regelen gesteld omtrent het fokken met dieren van bij
      algemene maatregel van bestuur aangewezen veesoorten.


      2 De in het eerste lid bedoelde regelen kunnen betrekking hebben op:


      a. de voorwaarden voor de erkenning door Onze Minister van instellingen, die stamboeken bijhouden;


      b. de eisen, waaraan dieren moeten voldoen om voor inschrijving in een stamboek in aanmerking te komen;


      c. de certificaten, die worden afgegeven ten bewijze van de inschrijving van dieren in een stamboek;


      d. het keuren van dieren;


      e. de methoden, die worden gebruikt bij onderzoek naar en de beoordeling van de prestaties en de genetische waarde
      van dieren;


      f. de handel in sperma, eicellen en embryo's;


      g. de voorwaarden voor toelating van fokdieren tot de voortplanting.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel76
  - number: '77'
    text: >-
      1 Het anders dan in doorvoer brengen van vee of pluimvee buiten Nederland is verboden.


      2 Het in het eerste lid vermelde verbod geldt niet indien de dieren overeenkomstig door Onze Minister gestelde
      regelen zijn voorzien van een of meer merken en vergezeld gaan van een of meer bewijsstukken aangebracht
      onderscheidenlijk afgegeven op grond van een van Rijkswege ingesteld onderzoek ten bewijze dat voldaan is aan de
      met het oog op deze uitvoer door hem gestelde eisen met betrekking tot:


      a. de identificatie der dieren;


      b. de gezondheidstoestand der dieren;


      c. de voorbehoedende behandeling der dieren;


      d. de bedrijven waarop de dieren hebben verbleven en de gezondheidstoestand der dieren op die bedrijven;


      e. de markten waarop de dieren zijn aangekocht en de plaatsen waarop de dieren zijn verzameld;


      f. de vervoermiddelen alsmede de inlading en het vervoer der dieren;


      g. andere onderwerpen, voor zover de nakoming van internationale overeenkomsten of van volkenrechtelijke
      organisaties zulks met zich brengt.


      3 Ter uitvoering van het bepaalde in het tweede lid kan Onze Minister voorts regelen stellen met betrekking tot:


      a. de plaatsen waar, alsmede de tijdruimten waarbinnen vee en pluimvee ter onderzoek kunnen worden aangeboden;


      b. de wijze waarop de dieren voor het onderzoek bedoeld in onderdeel *c* moeten worden aangeboden;


      c. het onderzoek;


      d. de wijze waarop het in het tweede lid bedoelde bewijsstuk kan worden verkregen;


      e. het toezicht dan wel de douanecontrole.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel77
  - number: '78'
    text: >-
      Bij of krachtens algemene maatregel van bestuur kan het anders dan in doorvoer buiten Nederland brengen van andere
      dan in artikel 77, eerste lid, bedoelde dieren van bij die maatregel aangewezen soorten of categorieën van dieren
      en bij die maatregel aangewezen produkten van dierlijke oorsprong worden verboden, tenzij de zending overeenkomstig
      daartoe gestelde regelen voorzien is van een of meer merken en vergezeld gaat van een of meer bewijsstukken
      aangebracht onderscheidenlijk afgegeven op grond van een van Rijkswege ingesteld onderzoek, ten bewijze dat voldaan
      is aan de met het oog op de uitvoer bij of krachtens die maatregel gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel78
  - number: '79'
    text: >-
      1 In verband met door landen van bestemming gestelde eisen op veterinair gebied kan degene die dieren en produkten
      van dierlijke oorsprong anders dan in doorvoer buiten Nederland wil brengen, verzoeken een onderzoek van Rijkswege
      in te stellen, alsmede merken aan te brengen of bewijsstukken af te geven, ten bewijze dat voldaan is aan door die
      andere landen gestelde eisen.


      2 Onze Minister kan omtrent de uitvoering van de in het eerste lid bedoelde onderzoeken nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel79
  - number: '80'
    text: >-
      Indien er gevaar bestaat voor overbrenging van een in Nederland opgetreden besmettelijke dierziekte kan Onze
      Minister het buiten Nederland brengen van dieren en dierlijke produkten afkomstig uit Nederland of een door hem te
      bepalen gedeelte daarvan verbieden dan wel verbieden indien niet voldaan wordt aan door hem te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel80
  - number: '81'
    text: >-
      1 De eisen en regelen, bedoeld in de artikelen 77 tot en met 80, kunnen onder meer verschillen naar gelang van de
      diersoort of categorie van dieren of de produkten en naar gelang van het land van bestemming.


      2 Indien ter uitvoering van het bepaalde in artikel 77 wordt voorzien in een officiële erkenning van de in het
      tweede lid van artikel 77 bedoelde bedrijven, markten en verzamelplaatsen van vee of pluimvee wordt een zodanige
      erkenning verleend voor iedere markt en verzamelplaats en ieder bedrijf, dat aan de daarvoor door Onze Minister
      gestelde eisen voldoet en wordt de erkenning ingetrokken, indien het bedrijf de markt of de verzamelplaats niet
      langer aan deze eisen blijkt te voldoen, doch niet dan nadat gedurende een redelijke termijn gelegenheid is
      gegeven, de voor het behoud van de erkenning noodzakelijke voorzieningen te treffen.


      3 Onverminderd het bepaalde in het tweede lid kan Onze Minister een officiële erkenning als bedoeld in het tweede
      lid voor bepaalde tijd intrekken indien:


      a. de bedrijfsvoering niet voldoet aan nader door Onze Minister gestelde regelen;


      b. de ondernemer ten behoeve van wiens bedrijf de officiële erkenning is verleend, in strijd handelt met het
      bepaalde bij of krachtens de artikelen 77, 78 of 79.


      4 Het bepaalde in het tweede en derde lid is van overeenkomstige toepassing indien op grond van de artikelen 78 of
      79 wordt voorzien in een officiële erkenning van bedrijven, markten of verzamelplaatsen.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel81
  - number: 81a
    text: |-
      1 In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. EG-verordening: verordening van de Raad van de Europese Unie of van het Europees Parlement en de Raad van
      de Europese Unie gezamenlijk, die geheel of gedeeltelijk berust op de artikelen 37, 95, 152, 153 of 175 van het
      Verdrag tot oprichting van de Europese Gemeenschap en waarin voorschriften zijn neergelegd ter zake van niet voor
      menselijke consumptie bestemde dierlijke bijproducten, of op die verordening gebaseerde EG-verordening van de
      Commissie van de Europese Gemeenschappen;

      b. EG-richtlijn: richtlijn van de Raad van de Europese Unie of van het Europees Parlement en de Raad van de
      Europese Unie gezamenlijk, die geheel of gedeeltelijk berust op de artikelen 37, 95, 152, 153 of 175 van het
      Verdrag tot oprichting van de Europese Gemeenschap en waarin voorschriften zijn neergelegd ter zake van niet voor
      menselijke consumptie bestemde dierlijke bijproducten, of op die richtlijn gebaseerde EG-richtlijn van de Commissie
      van de Europese Gemeenschappen;

      c. EG-beschikking: beschikking die gebaseerd is op een EG-verordening of EG-richtlijn.

      2 Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen gelden de begripsomschrijvingen zoals die
      zijn neergelegd in EG-verordeningen. Daar waar deze begripsbepalingen afwijken van de in [artikel 1][ref1] van deze
      wet opgenomen begripsbepalingen, gelden de begripsbepalingen zoals die zijn neergelegd in EG-verordeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel1
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel81a
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '1'
        hoofdstuk: I
  - number: 81b
    text: >-
      Het is verboden te handelen in strijd met bij ministeriële regeling aan te wijzen voorschriften van EG-
      verordeningen.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel81b
  - number: 81c
    text: >-
      1 Bij ministeriële regeling kunnen regels worden gesteld voor een goede uitvoering van EG-verordeningen.


      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter implementatie van EG-
      richtlijnen.


      3 Bij ministeriële regeling kunnen regels worden gesteld ter implementatie van EG-beschikkingen.


      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter implementatie van overeenkomsten
      betreffende niet voor menselijke consumptie bestemde dierlijke bijproducten tussen de Europese Gemeenschap en een
      of meer derde landen of internationale organisaties.


      5 De regels, bedoeld in het eerste tot en met vierde lid, kunnen betrekking hebben op:


      a. het aanwijzen van een bevoegde autoriteit;


      b. het verlenen, schorsen en intrekken van erkenningen en vergunningen;


      c. het behandelen en gebruiken van dierlijke bijproducten en daarvan afgeleide producten;


      d. het handelen in dierlijke bijproducten en daarvan afgeleide producten;


      e. het uitvoeren van controles en inspecties waar dierlijke bijproducten en daarvan afgeleide producten aanwezig
      zijn of kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel81c
  - number: 81d
    text: |-
      1 Bij ministeriële regeling kunnen in aanvulling op de krachtens [artikel 81c, eerste lid][ref1], gestelde regels,
      nadere voorschriften worden gesteld over de onderwerpen die zijn geregeld in de EG-verordeningen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen in aanvulling op de krachtens
      [artikel 81c, tweede en vierde lid][ref2], gestelde regels, nadere voorschriften worden gesteld over de onderwerpen
      waarop die regels betrekking hebben.

      3 Bij ministeriële regeling kunnen in aanvulling op de krachtens [artikel 81c, derde lid][ref3], gestelde regels,
      nadere voorschriften worden gesteld over de onderwerpen waarop die regels betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel81c
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel81c
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel81c
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel81d
