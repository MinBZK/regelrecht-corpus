  - number: 110a
    text: >-
      Uiterlijk binnen drie maanden na het tijdstip waarop een algemene maatregel van bestuur als bedoeld in artikel 91h,
      eerste lid, dan wel een algemene maatregel van bestuur als bedoeld in artikel 92, eerste lid, in werking treedt,
      wordt een voorstel van wet tot goedkeuring van de betrokken algemene maatregel van bestuur aan de Tweede Kamer der
      Staten-Generaal gezonden. Indien het voorstel wordt ingetrokken of indien een van de Kamers der Staten-Generaal
      tot het niet aannemen van het voorstel besluit, wordt de betrokken maatregel ingetrokken bij algemene maatregel van
      bestuur, met ingang van het tijdstip waarop eerstbedoelde maatregel in werking trad.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel110a
  - number: '111'
    text: >-
      Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van krachtens het Verdrag tot oprichting van
      de Europese Economische Gemeenschap vastgestelde verplichtingen inzake onderwerpen waarop deze wet van toepassing
      is, regelen worden gesteld waarbij kan worden afgeweken van bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel111
  - number: '113'
    text: |-
      Deze wet treedt niet in hetgeen bij of krachtens de [Wet op de dierproeven][ref1] (*Stb.* 1977, 67) is geregeld,
      met dien verstande dat onverminderd van kracht blijft hetgeen is of wordt bepaald bij of krachtens de artikelen 35,
      38, 42, 45 tot en met 54, 55, 66 en 76.


      [ref1]: https://wetten.overheid.nl/BWBR0003081
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0003081
  - number: '114'
    text: |-
      1 [Onverminderd artikel 108a, derde lid][ref1], zijn met het toezicht op de naleving van het bepaalde bij of
      krachtens deze wet de bij besluit van Onze Minister aangewezen ambtenaren belast.

      2 Onze Minister wijst ambtenaren aan die zijn belast met onderzoek naar de aanwezigheid van besmettelijke
      dierziekten.

      3 Met de opsporing van de bij [artikel 121][ref2] strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 Wetboek van Strafvordering][ref3], belast de daartoe aangewezen buitengewone opsporingsambtenaren.
      Deze ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in de [artikelen 179][ref4]
      tot en met [182][ref5] en [184 van het Wetboek van Strafrecht][ref6] voor zover deze feiten betrekking hebben op
      een bevel, vordering of handeling gedaan of ondernomen door henzelf.

      4 Van een besluit als bedoeld in dit artikel wordt mededeling gedaan door plaatsing in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel108a
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel121
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel141
