  - number: '118'
    text: |-
      1 In het in [artikel 5:18, eerste lid, van de Algemene wet bestuursrecht][ref1] bedoelde geval verpakken en
      verzegelen de in [artikel 114][ref2] bedoelde ambtenaren het monster ter plaatse.

      2 In het in [artikel 5:18, tweede lid, van de Algemene wet bestuursrecht][ref3] bedoelde geval laten de in
      [artikel 114][ref4] bedoelde ambtenaren een tweede monster verpakt en verzegeld in het bezit van de belanghebbende.


