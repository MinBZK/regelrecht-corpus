  - number: 91a
    text: |-
      1 Terzake van het houden van varkens wordt van de persoon of rechtspersoon die, of het samenwerkingsverband van
      personen of rechtspersonen dat een bedrijf voert onder de naam varkensheffing een heffing geheven ter bestrijding
      van de kosten:

      a. bedoeld in [artikel 83][ref1] en [88, vijfde lid][ref2], voor zover die kosten noodzakelijk zijn met het oog op
      de bestrijding van voor varkens op grond van [artikel 15, eerste lid][ref3], aangewezen besmettelijke ziekten;

      b. van de tegemoetkomingen bedoeld in [artikel 86, eerste lid, aanhef en onderdelen a en b][ref4], en
      [artikel 90][ref5], alsmede de vergoedingen bedoeld in [artikel 91][ref6], voor zover die tegemoetkomingen,
      respectievelijk vergoedingen, voortvloeien uit de bestrijding van voor varkens op grond van
      [artikel 15, eerste lid][ref7], aangewezen besmettelijke ziekten;

      c. van door Onze Minister getroffen maatregelen en voorzieningen als bedoeld in hoofdstuk II, afdeling
      3, voor zover die kosten noodzakelijk zijn met het oog op de bestrijding van voor varkens op grond van
      [artikel 15, eerste lid][ref8], aangewezen besmettelijke ziekten, waartoe tevens gerekend worden de kosten van door
      Onze Minister getroffen maatregelen en voorzieningen die noodzakelijk zijn met het oog op de bescherming van het
      welzijn van dieren dan wel met het oog op onderzoek naar de mate van verspreiding van die ziekten in Nederland, en

      d. die noodzakelijk zijn met het oog op de heffing en invordering van de varkensheffing.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat de varkensheffing, met ingang van 1 januari van een op
      de datum van inwerkingtreding van die maatregel volgend kalenderjaar, tevens wordt geheven ter bestrijding van de
      kosten van het Diergezondheidsfonds, voor zover noodzakelijk met het oog op het weren van voor varkens op grond van
      [artikel 15, eerste lid][ref9], aangewezen besmettelijke ziekten.

      3 De heffing wordt geheven per bedrijf per kalenderjaar.


