  - number: 92a
    text: >-
      1 Het tarief van een krachtens artikel 92, eerste lid, ingevoerde heffing wordt vastgesteld aan de hand van een
      raming van de kosten, bedoeld in artikel 92, eerste lid, over een periode van drie jaar, te rekenen vanaf het
      tijdstip waarop de heffing wordt ingevoerd, waarbij rekening wordt gehouden met de over die periode geraamde som
      van de varkensheffing en krachtens artikel 91h ingevoerde heffingen.


      2 Telkens na een periode van drie kalenderjaren, te rekenen vanaf 1 januari van het kalenderjaar waarin een heffing
      als bedoeld in artikel 92, eerste lid, wordt ingevoerd, kan het tarief van de betrokken heffing voor de op die
      periode volgende periode van drie kalenderjaren worden gewijzigd. Een wijziging als bedoeld in de vorige volzin
      geschiedt bij algemene maatregel van bestuur die in werking treedt voor het tijdstip waarop de periode aanvangt
      waarop de wijziging van het tarief betrekking heeft.


      3 Wijziging van het tarief op grond van het tweede lid geschiedt op basis van het saldo van:


      a. een raming van de kosten, bedoeld in artikel 92, eerste lid, en, voor zover van toepassing, artikel 92, tweede
      lid, over een periode van drie kalenderjaren, te rekenen vanaf 1 januari van het kalenderjaar met ingang waarvan
      het tarief uit hoofde van het tweede lid kan worden gewijzigd, bij welke raming rekening wordt gehouden met de over
      die periode geraamde som van de varkensheffing en krachtens artikel 91h ingevoerde heffingen;


      b. ten hoogste 50% van het totaal van de door het Diergezondheidsfonds tot 1 januari van het kalenderjaar,
      voorafgaande aan het kalenderjaar met ingang waarvan het tarief uit hoofde van het tweede lid kan worden gewijzigd,
      gemaakte kosten, bedoeld in artikel 92, eerste lid, voor zover die kosten meer bedragen dan de totale som van de
      varkensheffing, bestemd voor de bestrijding van de kosten, bedoeld in artikel 91a, eerste lid, de totale som van
      de krachtens artikel 91h, eerste lid, ingevoerde heffingen, bestemd voor de bestrijding van de in dat artikellid
      bedoelde kosten, alsmede de totale som van krachtens artikel 92, eerste lid, ingevoerde heffingen, bestemd voor
      de bestrijding van de in dat artikellid bedoelde kosten, zoals geheven over de tot laatstbedoelde datum verstreken
      kalenderjaren, en, voor zover van toepassing,


      c. ten hoogste 50% van het totaal van de door het Diergezondheidsfonds tot 1 januari van het kalenderjaar,
      voorafgaande aan het kalenderjaar met ingang waarvan het tarief uit hoofde van het tweede lid kan worden gewijzigd,
      gemaakte kosten, bedoeld in artikel 92, tweede lid, voor zover die kosten meer bedragen dan de totale som van de
      varkensheffing, bestemd voor de bestrijding van de kosten, bedoeld in artikel 91a, tweede lid, de totale som van
      krachtens artikel 91h, eerste lid, ingevoerde heffingen, bestemd voor de bestrijding van de in artikel 91h, tweede
      lid, bedoelde kosten, alsmede de totale som van krachtens artikel 92, eerste lid, ingevoerde heffingen, bestemd
      voor de bestrijding van de in artikel 92, tweede lid bedoelde kosten, zoals geheven over de tot laatstbedoelde
      datum verstreken kalenderjaren.


      4 In geval van toepassing van artikel 92, tweede lid, wordt bij de in dat artikellid bedoelde algemene maatregel
      van bestuur het tarief van de desbetreffende heffing verhoogd met ingang van 1 januari van het in artikel
      92, tweede lid, bedoelde kalenderjaar. De verhoging wordt gebaseerd op een raming van de kosten, bedoeld in
      artikel 95c, onderdeel c, voor zover die kosten betrekking hebben op de kalenderjaren, te rekenen vanaf de in
      de vorige volzin bedoelde datum tot de datum met ingang waarvan uit hoofde van het tweede lid het tarief van
      de desbetreffende heffing kan worden gewijzigd en rekening houdend met de over die periode geraamde som van de
      varkensheffing en krachtens artikel 91h, eerste lid, ingevoerde heffingen.
    url: https://wetten.overheid.nl/BWBR0005662/2009-07-01#Artikel92a
  - number: '93'
    text: |-
      1 De heffing, bedoeld in artikel 91a, alsmede bij algemene maatregel van bestuur op grond van de artikelen 91h en
      92 ingevoerde heffingen worden door Onze Minister geheven.

      2 Onverminderd het overigens bij of krachtens deze afdeling bepaalde worden de in het eerste lid bedoelde heffingen
      geheven met overeenkomstige toepassing van de [Algemene wet inzake rijksbelastingen][ref1], met dien verstande dat
      van die wet buiten toepassing blijven de artikelen 2, vierde lid, 37 tot en met 39, 47a, 53, tweede en derde lid,
      76, 80, tweede, derde en vierde lid, 82, 84, 86 en 87.

      3 Voor de toepassing van de [Algemene wet inzake rijksbelastingen][ref2] treedt Onze Minister in de plaats van Onze
      Minister van Financiën. Voor de in de [Algemene wet inzake rijksbelastingen][ref3] genoemde functionarissen treden
      in de plaats de door Onze Minister aangewezen functionarissen.

      4 Voor de toepassing van [artikel 18, derde lid, van de Algemene wet inzake rijksbelastingen][ref4] wordt met
      een onherroepelijke veroordeling gelijk gesteld het vervallen van het recht op strafvordering op de voet van de
      [artikelen 74][ref5] en [74a van het Wetboek van Strafrecht][ref6].

      5 Voor de toepassing van het bij of krachtens de artikelen 91a tot en met 92a bepaalde wordt
      [artikel 52, tweede lid, van de Algemene wet inzake rijksbelastingen][ref7] als volgt gelezen:

      Administratieplichtigen zijn: de personen, rechtspersonen en samenwerkingsverbanden, bedoeld in artikel 91a,
      respectievelijk de personen, rechtspersonen en samenwerkingsverbanden, bedoeld in de artikelen 91h en 92.

      6 Voor de toepassing van [artikel 66 van de Algemene wet inzake rijksbelastingen][ref8] zijn de bij regeling
      van Onze Minister van Financiën gestelde regels van toepassing. Door Onze Minister worden de afwijkingen daarop
      vastgesteld die voor de juiste toepassing van het bij of krachtens de artikelen 91a tot en met 92a bepaalde
      noodzakelijk zijn.


