  - number: '110'
    text: |-
      1 De algemene maatregelen van bestuur, bedoeld in de [artikelen 1, tweede lid][ref1];
      [15, eerste lid, onderdeel e][ref2]; [33, eerste lid][ref3]; [34, eerste en tweede lid][ref4];
      [35, eerste lid][ref5]; [38][ref6]; [39][ref7]; [40, tweede lid, onderdeel c, en derde lid][ref8];
      [42][ref9]; [43][ref10]; [44, eerste en negende lid][ref11]; [45, eerste en derde lid][ref12];
      [46, eerste lid][ref13]; [50, tweede lid][ref14]; [52, eerste lid][ref15]; [53][ref16]; [54][ref17];
      [55, eerste, tweede en derde lid][ref18]; [56][ref19]; [59a, tweede en vierde lid][ref20];
      [59b, tweede lid][ref21]; [61, tweede en derde lid][ref22]; [65][ref23]; [68][ref24]; [69, tweede lid][ref25];
      [70][ref26]; [76, eerste lid][ref27], [91a, tweede lid][ref28], [91d, tweede lid][ref29],
      [91e, tweede en derde lid][ref30], [91h, tweede lid][ref31], [91i, tweede lid][ref32], [92, tweede lid][ref33],
      [92a, tweede lid][ref34], alsmede [96][ref35] worden aan beide Kamers der Staten-Generaal overgelegd. Binnen 30
      dagen na de overlegging kan door ten minste een vijfde van het grondwettelijk aantal leden van één der Kamers de
      wens te kennen worden gegeven dat de inwerkingtreding bij wet zal worden geregeld. Indien zodanige wens te kennen
      wordt gegeven, dienen Wij zo spoedig mogelijk een desbetreffend wetsvoorstel in.

      2 Indien de algemene maatregel van bestuur tevens in het belang is van de volksgezondheid, wordt de voordracht
      tot vaststelling, wijziging of intrekking van de algemene maatregel van bestuur gedaan door Onze Minister in
      overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport.

      3 Indien het wetsvoorstel wordt ingetrokken of één van beide Kamers der Staten-Generaal tot niet-aanneming daarvan
      besluit, wordt de algemene maatregel van bestuur onverwijld ingetrokken.


