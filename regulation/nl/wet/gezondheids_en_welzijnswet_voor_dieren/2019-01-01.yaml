  - number: '94'
    text: |-
      1 Onze Minister kan een vergoeding van kosten heffen overeenkomstig een door hem vastgesteld tarief ter zake van:

      a. een krachtens [artikel 10][ref1] voorgeschreven onderzoek;

      b. een krachtens [artikel 11][ref2] voorgeschreven nader onderzoek, voorbehoedende behandeling of tijdelijke
      afzondering alsmede het toezicht, bedoeld in [artikel 11, eerste lid, onderdeel a, ten vijfde][ref3];

      c. de controle, bedoeld in [artikel 18, tweede lid][ref4];

      d.

      e.

      f.

      g. een krachtens de [artikelen 77][ref5] of [78][ref6] voorgeschreven onderzoek;

      h. een onderzoek als bedoeld in [artikel 79][ref7];

      i. de identificatie en registratie, bedoeld in [artikel 96][ref8];

      j. de behandeling van een aanvraag om een bij of krachtens deze wet voorgeschreven vergunning, toelating,
      aanwijzing, erkenning of registratie danwel een aanvraag tot wijziging daarvan;

      k. de instandhouding van de bij of krachtens deze wet verleende vergunning, toelating, aanwijzing, erkenning of
      registratie;

      l. andere onderzoeken of verrichtingen met betrekking tot dieren, producten van dierlijke oorsprong en andere
      producten en voorwerpen die dragers van smetstof kunnen zijn, voorzover de onderzoeken of verrichtingen zijn
      voorgeschreven bij besluit krachtens het Verdrag tot oprichting van de Europese Gemeenschap, danwel op verzoek van
      betrokkenen plaatsvinden.

      2 Onze Minister kan regelen stellen met betrekking tot betaling van de vergoeding.


