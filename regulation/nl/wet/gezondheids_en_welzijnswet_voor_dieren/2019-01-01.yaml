  - number: 91l
    text: |-
      1 De tarieven voor de in [artikel 91g, eerste lid][ref1], bedoelde handelingen worden vastgesteld met
      overeenkomstige toepassing van [artikel 91k][ref2], met dien verstande dat deze tarieven worden berekend op
      basis van de uitgaven voor de bestrijding en de wering van besmettelijke dierziekten en de opbrengsten van de
      diergezondheidsheffing van onderscheidenlijk de diersoorten kippen, kalkoenen en eenden.

      2 De tarieven voor de in [artikel 91g, tweede lid][ref3], bedoelde handelingen worden vastgesteld met
      overeenkomstige toepassing van [artikel 91k][ref4], met dien verstande dat deze tarieven voor de onderscheiden
      handelingen worden berekend op basis van de uitgaven voor de bestrijding en de wering van besmettelijke dierziekten
      en de opbrengsten van de heffingen ten behoeve van de diersoort of diercategorie waar de desbetreffende handeling
      betrekking op heeft.


