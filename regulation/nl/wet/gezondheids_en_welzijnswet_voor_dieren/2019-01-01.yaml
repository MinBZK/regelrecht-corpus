  - number: 91m
    text: |-
      1 De tarieven voor de diergezondheidsheffing worden bij algemene maatregel van bestuur vastgesteld.

      2 De in het eerste lid bedoelde tarieven worden per kalenderjaar vastgesteld.

      3 De bekendmaking van de tarieven geschiedt uiterlijk 31 december voorafgaand aan het kalenderjaar waarvoor de
      tarieven worden vastgesteld door publicatie van de in het eerste lid bedoelde maatregel in het Staatsblad.

      4 Indien niet uiterlijk op het in het derde lid bedoelde tijdstip een nieuw tarief voor een diersoort, een
      diercategorie of een handeling is bekendgemaakt, blijft het tarief zoals dat gold op dat tijdstip, van toepassing.

      5 Het tweede en derde lid zijn niet van toepassing bij de invoering van een heffing gedurende een kalenderjaar op
      grond van de [artikelen 91c, tweede lid][ref1], [91d, tweede lid][ref2], of [91g, derde lid][ref3].

      6 Een algemene maatregel van bestuur als bedoeld in het eerste lid wordt niet vastgesteld dan nadat overleg is
      gepleegd met belangenorganisaties van natuurlijke personen of rechtspersonen dan wel samenwerkingsverbanden van
      natuurlijke personen of rechtspersonen waarvan de diergezondheidsheffing wordt geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel91c
