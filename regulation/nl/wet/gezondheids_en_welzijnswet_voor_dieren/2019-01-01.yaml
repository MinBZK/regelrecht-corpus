  - number: 95c
    text: |-
      Uit het fonds kunnen betalingen worden verricht:

      a. ter uitvoering van [artikel 83][ref1] en [88, vijfde lid][ref2],
      [artikel 86, eerste lid, aanhef en onderdelen a en b][ref3], [artikel 90][ref4], en [artikel 91][ref5];

      b. terzake van door Onze Minister getroffen maatregelen en voorzieningen bedoeld in hoofdstuk II, afdeling 3,
      waartoe tevens gerekend worden de met de bestrijding van op grond van [artikel 15, eerste lid][ref6], aangewezen
      besmettelijke dierziekten verband houdende door Onze Minister getroffen maatregelen en voorzieningen met het oog
      op de bescherming van het welzijn van dieren dan wel met het oog op onderzoek naar de mate van verspreiding van
      dierziekten in Nederland;

      c. terzake van door Onze Minister, met het oog op het weren van krachtens [artikel 15, eerste lid][ref7],
      aangewezen besmettelijke dierziekten, andere dierziekten of ziekteverschijnselen, gemaakte kosten;

      d. terzake van door Onze Minister gemaakte kosten met het oog op tegemoetkomingen voor maatregelen ter bestrijding
      van zoönosen of zoönoseverwekkers waartoe de houder op grond van EU-verordeningen of EU-besluiten als bedoeld in
      [artikel 81a][ref8] is gehouden;

      e. terzake van uitgaven ten behoeve van het weren van tegen antimicrobiële diergeneesmiddelen resistente bacteriën
      bij dieren;

      f. terzake van de heffing en invordering van de diergezondheidsheffing, bedoeld in [artikel 91b][ref9], en

      g. terzake van andere uitgaven.


