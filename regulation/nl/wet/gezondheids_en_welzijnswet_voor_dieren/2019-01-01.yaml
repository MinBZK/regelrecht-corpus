  - number: '98'
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat dieren die aan te wijzen schadelijke stoffen hebben opgenomen
      of waarvan wordt vermoed dat zij die stoffen hebben opgenomen, totdat het tegendeel is gebleken, danwel totdat van
      overheidswege is vastgesteld dat het dier weer vrij is van deze stoffen, op het bedrijf waar zij worden gehouden
      worden opgestald of opgehokt danwel slechts met toestemming van Onze Minister het bedrijf mogen verlaten.

      2 Bij ministeriële regeling kan ter voorkoming van de opname van aan te wijzen schadelijke stoffen door dieren
      worden bepaald dat dieren op het bedrijf waar zij worden gehouden worden opgestald of opgehokt danwel slechts met
      toestemming van Onze Minister het bedrijf mogen verlaten.

      3 De in het eerste en tweede lid bedoelde aanwijzing van schadelijke stoffen geschiedt door Onze Minister in
      overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport.

      4 Bij ministeriële regeling kan worden bepaald dat de in het eerste en tweede lid bedoelde dieren op door hem
      voorgeschreven wijze worden gemerkt, gevoederd of gedrenkt en dat de van die dieren afkomstige producten, voorzover
      aanwezig op het bedrijf waar de dieren worden gehouden, slechts met toestemming van Onze Minister het bedrijf mogen
      verlaten.

      5 De toestemming, bedoeld in het eerste, tweede en vierde lid, kan onder beperkingen worden verleend en aan een
      toestemming kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel98
  - number: '99'
    text: |-
      1 Onze Minister kan het brengen in Nederland van dieren, waarin zich schadelijke stoffen bevinden, verbieden dan
      wel verbieden, indien niet voldaan wordt aan door hem te stellen regelen.

      2 Een regeling krachtens het eerste lid wordt vastgesteld in overeenstemming met Onze Minister van Volksgezondheid,
      Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel99
  - number: 99a
    text: |-
      Indien naar het oordeel van Onze Minister een onverwijlde voorziening noodzakelijk is, kan Onze Minister
      bepalen dat de op grond de [artikelen 80][ref1], [97][ref2], [98][ref3] of [99][ref4] gestelde regels
      onmiddellijk na hun bekendmaking in werking treden. In dat geval kan hij zodanige regels, in afwijking van
      [artikel 4 van de Bekendmakingswet][ref5], op andere dan de daar genoemde wijze bekend maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel80
