  - number: '100'
    text: |-
      1 Indien een dierenarts weet of redelijkerwijs kan vermoeden dat een dier verschijnselen vertoont van een
      besmettelijke dierziekte waarop afdeling 3 van hoofdstuk II van toepassing is, danwel van een andere door Onze
      Minister aangewezen dierziekte, of indien een dierenarts weet of redelijkerwijs kan vermoeden dat een dier is
      aangetast door een dergelijke besmettelijke dierziekte of drager van smetstof is, danwel weet dat een dier de
      krachtens [artikel 31b, tweede lid][ref1], door Onze Minister aangewezen ziekteverschijnselen vertoont, geeft hij
      hiervan terstond kennis aan een ambtenaar als bedoeld in [artikel 114, tweede lid][ref2].

      2 Een ieder die in het kader van werkzaamheden die in een onderzoeksinstelling worden verricht, gevallen van
      besmettelijke dierziekten opmerkt waarop afdeling 3 van hoofdstuk II van toepassing is, danwel van een andere door
      Onze Minister aangewezen dierziekte, danwel bij een dier de krachtens [artikel 31b, tweede lid][ref3], door Onze
      Minister aangewezen ziekteverschijnselen opmerkt, geeft hiervan terstond kennis aan een ambtenaar als bedoeld in
      [artikel 114, tweede lid][ref4].

      3 De artikelen 19, tweede lid, en artikel 31b, derde lid, zijn van overeenkomstige toepassing op de wijze van
      kennis geven, bedoeld in het eerste en het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel31b
