  - number: 94b
    text: |-
      Een tarief als bedoeld in de [artikelen 94][ref1] en [94a][ref2] wordt zodanig vastgesteld dat de geraamde baten
      niet uitgaan boven de geraamde kosten die in een rechtstreeks verband staan met de werkzaamheden waarvoor het
      tarief wordt opgelegd, onverminderd de daaromtrent bij besluit krachtens het Verdrag tot oprichting van de Europese
      Gemeenschap vastgestelde verplichtingen.


