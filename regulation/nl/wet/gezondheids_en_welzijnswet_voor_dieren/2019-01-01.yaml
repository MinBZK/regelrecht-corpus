  - number: 110a
    text: |-
      Na het tot stand komen van een krachtens de [artikelen 91c, tweede lid][ref1], [91d, tweede lid][ref2], of
      [91g, derde lid][ref3], vastgestelde algemene maatregel van bestuur wordt zo spoedig mogelijk maar uiterlijk binnen
      acht weken een voorstel van wet tot goedkeuring van de algemene maatregel van bestuur aan de Tweede Kamer der
      Staten-Generaal gezonden. Indien het voorstel wordt ingetrokken of indien een van de kamers van de Staten-Generaal
      tot niet-aannemen van het voorstel besluit, wordt de algemene maatregel van bestuur onverwijld ingetrokken,
      met ingang van het tijdstip waarop de maatregel in werking trad, en worden de gevolgen van die inwerkingtreding
      ongedaan gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel91c
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel91d
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel91g
