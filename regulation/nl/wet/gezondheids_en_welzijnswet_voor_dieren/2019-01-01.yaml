  - number: '111'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van krachtens het Verdrag betreffende de
      werking van de Europese Unie vastgestelde verplichtingen inzake onderwerpen waarop deze wet van toepassing is,
      regelen worden gesteld waarbij kan worden afgeweken van bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel111
  - number: 111a
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op:

      a. een aanvraag tot een vergunning als bedoeld in [artikel 66][ref3];

      b. een aanvraag tot een vaststelling van een werkgebied als bedoeld in [artikel 81f][ref4], en

      c. een aanvraag tot een vrijstelling of ontheffing als bedoeld in [artikel 107, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
