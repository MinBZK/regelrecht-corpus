        afdeling: '3'
  - number: 91i
    text: |-
      1 De diergezondheidsheffing voor het inleggen van broedeieren wordt geheven naar het aantal broedeieren dat in een
      kalenderjaar in een broedmachine wordt ingelegd.

      2 De diergezondheidsheffing voor het produceren van vaccinbroedeieren wordt geheven naar het aantal
      vaccinbroedeieren dat in een kalenderjaar in een broedmachine wordt ingelegd.

      3 Bij ministeriële regeling kunnen regels worden gesteld voor de berekeningswijze van het aantal ingelegde eieren,
      bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel91i
  - number: 91j
    text: |-
      1 Bij algemene maatregel van bestuur wordt bepaald tot welk bedrag de uitgaven van het Diergezondheidsfonds die, in
      een bij die maatregel te bepalen periode van vijf kalenderjaren, zijn gedaan ten behoeve van een bepaalde diersoort
      of combinatie van diersoorten ten hoogste door middel van heffingen worden opgebracht.

      2 De vaststelling voor de eerste maal van een algemene maatregel van bestuur als bedoeld in het eerste lid heeft
      betrekking op de periode 1 januari 2020 tot en met 31 december 2024.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel91j
  - number: 91k
    text: |-
      1 Onverminderd [artikel 91j][ref1] en het derde lid wordt een tarief voor het houden van een diersoort of
      diercategorie vastgesteld op basis van:

      a. een raming van de kosten, bedoeld in [artikel 91b][ref2], voor de desbetreffende diersoort of diercategorie, in
      het kalenderjaar of deel van het kalenderjaar waarvoor het tarief wordt vastgesteld;

      b. de benodigde middelen om in het Diergezondheidsfonds een reserve aan te houden;

      c. uitgaven van het Diergezondheidsfonds, voor zover die uitgaven niet gedekt zijn door de opbrengsten van de
      diergezondheidsheffing, bedoeld in [artikel 95b, onderdeel a][ref3], in het tweede tot en met zesde kalenderjaar
      voorafgaand aan het jaar waarvoor het tarief voor het houden van een diersoort of diercategorie wordt vastgesteld;

      d. het vastgestelde overschot of tekort bij de definitieve vaststelling van door de Europese Unie beschikbaar
      gestelde middelen ten opzichte van de door de Europese Unie voorlopig beschikbaar gestelde middelen voor de
      desbetreffende diersoort of diercategorie;

      e. een schatting van het aantal dieren of andere eenheden dat de grondslag vormt voor de heffing.

      2 Voor de toepassing van het eerste lid, onderdelen c en d:

      a. wordt bij de heffing ten behoeve van de uitgaven, gedaan in een bepaalde periode, het voor die periode bepaalde
      bedrag, bedoeld in [artikel 91j][ref4], toegepast, ook als die heffingen niet in die periode worden geheven;

      b. worden uitsluitend de overschotten en tekorten uit de in het eerste lid, onderdeel c, bedoelde periode, die niet
      bij een eerdere tariefvaststelling waren betrokken, meegerekend.

      3 De omvang van de in het eerste lid, onderdeel b, bedoelde reserve wordt bij algemene maatregel van bestuur
      bepaald en bedraagt voor elke krachtens [artikel 91j][ref5] bepaalde periode ten hoogste 40 procent van het
      krachtens het eerste lid van dat artikel voor de desbetreffende periode en de desbetreffende diersoort of
      combinatie van diersoorten bepaalde bedrag.

      4 De uitgaven bedoeld in het eerste lid, onderdeel c, worden zo spoedig mogelijk en gedurende ten hoogste acht
      kalenderjaren, in de tarieven verwerkt.

      5 Bij de vaststelling van een tarief ten behoeve van de invoering van de diergezondheidsheffing voor een andere
      diersoort als bedoeld in de [artikel 91c, tweede lid][ref6], of [artikel 91d, tweede lid][ref7], dan wel een andere
      handeling als bedoeld in [artikel 91g, derde lid][ref8], en bij de wijziging van een dergelijk tarief, worden bij
      de toepassing van het eerste lid, onderdeel c, slechts de uitgaven in aanmerking genomen die zijn gedaan na de
      datum van de invoering van de desbetreffende heffing.

      6 In afwijking van het eerste lid, onderdeel c, worden alleen uitgaven van het Diergezondheidsfonds,
      die zijn gedaan na 1 januari 2015, en voor zover die niet gedekt zijn door ontvangsten als bedoeld in
      [artikel 95b, onderdeel a][ref9], in aanmerking genomen.


