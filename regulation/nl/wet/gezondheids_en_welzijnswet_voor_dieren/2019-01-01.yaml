  - number: '29'
    text: |-
      1 Iedere houder van een ziek of verdacht dier is verplicht ervoor zorg te dragen, dat dit dier zijn verblijfplaats
      niet verlaat, tenzij met toestemming of krachtens bevel van Onze Minister.

      2 De toestemming kan onder beperkingen worden verleend en daaraan kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel29
  - number: '30'
    text: |-
      1 Onze Minister kan het vervoeren van dieren van een door hem te bepalen soort, van deze diersoort afkomstige
      producten, diervoeder, vervoermiddelen alsmede andere producten en voorwerpen welke dragers van smetstof kunnen
      zijn, uit, naar of binnen Nederland of bepaalde gedeelten van Nederland verbieden dan wel verbieden indien niet
      wordt voldaan aan door hem te stellen regels.

      2 Rondom het op grond van het eerste lid aangewezen gebied kunnen waarschuwingsborden worden geplaatst.

      3 Onze Minister kan voor het krachtens het eerste lid aangewezen gebied het bij [artikel 29][ref1] bepaalde van
      overeenkomstige toepassing verklaren ten aanzien van gezonde dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel29
