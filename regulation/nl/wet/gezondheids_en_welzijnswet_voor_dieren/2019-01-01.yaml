  - number: 91a
    text: |-
      Voor de toepassing van het bij en krachtens deze afdeling bepaalde wordt verstaan onder:

        - *vaccinbroedei:* ei, afkomstig van pluimvee, dat zich in een broedmachine bevindt om te worden afgeleverd aan de
      farmaceutische industrie, dan wel bestemd is om voor dit doel in een broedmachine te worden gelegd.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel91a
  - number: 91b
    text: |-
      Onder de naam diergezondheidsheffing worden heffingen geheven ter bestrijding van de kosten:

      a. bedoeld in de [artikelen 83][ref1] en [88, vijfde lid][ref2], voor zover die kosten noodzakelijk zijn met
      het oog op de bestrijding van op grond van [artikel 15, eerste lid][ref3], aangewezen besmettelijke ziekten
      bij diersoorten die bij of krachtens de [artikelen 91c][ref4] en [91d][ref5] zijn aangewezen, dan wel met het
      oog op het weren van de op grond van artikel 15, eerste lid, aangewezen besmettelijke dierziekten of van andere
      dierziekten;

      b. van de tegemoetkomingen, bedoeld in de [artikelen 86, eerste lid, aanhef en onderdelen a en b][ref6],
      en [90][ref7], alsmede de vergoedingen bedoeld in [artikel 91][ref8], voor zover die tegemoetkomingen
      onderscheidenlijk vergoedingen voortvloeien uit de bestrijding of het weren van op grond van
      [artikel 15, eerste lid][ref9], aangewezen besmettelijke ziekten bij diersoorten die bij of krachtens de
      [artikelen 91c][ref10] en [91d][ref11] zijn aangewezen;

      c. van door Onze Minister getroffen maatregelen en voorzieningen als bedoeld in [hoofdstuk II, afdeling 3][ref12],
      voor zover die kosten noodzakelijk zijn met het oog op de bestrijding van voor op grond van
      [artikel 15, eerste lid][ref13], aangewezen besmettelijke ziekten bij diersoorten die bij of krachtens de
      [artikelen 91c][ref14] en [91d][ref15] zijn aangewezen, waartoe tevens gerekend worden de kosten van door Onze
      Minister getroffen maatregelen en voorzieningen die noodzakelijk zijn met het oog op de bescherming van het welzijn
      van dieren dan wel met het oog op onderzoek naar de mate van verspreiding van die ziekten in Nederland;

      d. van tegemoetkomingen voor maatregelen ter bestrijding van zoönosen of zoönoseverwekkers bij dieren die behoren
      tot de diersoorten die zijn aangewezen bij of krachtens de [artikelen 91c][ref16] en [91d][ref17], tot het nemen
      van welke maatregelen de houder op grond van EU-verordeningen of EU-besluiten als bedoeld in [artikel 81a][ref18]
      is gehouden;

      e. van het weren van ziekten die door de diersoorten die zijn aangewezen bij of krachtens de [artikelen 91c][ref19]
      en [91d][ref20] kunnen worden overgebracht op de mens en die alleen de gezondheid van de mens aantasten, en waarop
      op grond van [artikel 103][ref21] bepalingen van deze wet geheel of gedeeltelijk van overeenkomstige toepassing
      zijn verklaard;

      f. van het weren van tegen antimicrobiële diergeneesmiddelen resistente bacteriën bij diersoorten die bij of
      krachtens de [artikelen 91c][ref22] en [91d][ref23] zijn aangewezen;

      g. die noodzakelijk zijn met het oog op de heffing en invordering van de heffingen.


