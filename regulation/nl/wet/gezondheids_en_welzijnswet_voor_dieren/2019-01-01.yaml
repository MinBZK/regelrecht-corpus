  - number: 122a
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van de artikelen 91a tot en met 93a, alsmede de
      artikelen 95a tot en met 95e, aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten in de
      praktijk van het in die artikelen bepaalde.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel122a
  - number: '123'
    text: |-
      In hetgeen bij of krachtens de [Visserijwet 1963][ref1] (*Stb.* 312) is of wordt voorzien, wordt niet voorzien
      krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002416
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0002416
  - number: '129'
    text: |-
      De volgende wetten worden ingetrokken:

      a. de Paardenwet 1939 (Stb. 620);

      b. de Bijenwet 1947 (Stb. H 13);

      c. de [Vogelziektenwet][ref1] (Stb. 1949, J 585);

      d. de [Runderhorzelwet][ref2] (Stb. 1953, 189);

      e. de [Wet tot wering van besmettelijke ziekten bij knaagdieren][ref3] (Stb. 1953, 416);

      f. de [Nertsen-Ziektenwet][ref4] (Stb. 1960, 102);

      g.

      h. de Wet dierenvervoer (Stb. 1977, 338);

      i. de [Wet houdende vaststelling van minimumeisen voor het houden van legkippen][ref5] (Stb. 1984, 272).


      [ref1]: https://wetten.overheid.nl/BWBR0002056
      [ref2]: https://wetten.overheid.nl/BWBR0002109
      [ref3]: https://wetten.overheid.nl/BWBR0002115
      [ref4]: https://wetten.overheid.nl/BWBR0002338
      [ref5]: https://wetten.overheid.nl/BWBR0003684
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel129
