        artikel: 91b
        hoofdstuk: VIII
        afdeling: '3'
  - number: 91h
    text: |-
      De in [artikel 91g, eerste en tweede lid][ref1], bedoelde heffingen worden geheven van de natuurlijke personen of
      rechtspersonen dan wel samenwerkingsverbanden van natuurlijke personen of rechtspersonen die de krachtens artikel
      91g, eerste of tweede lid, aangewezen handelingen verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel91g
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel91h
