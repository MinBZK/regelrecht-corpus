        artikel: 91n
        hoofdstuk: VIII
        afdeling: '3'
  - number: '93'
    text: |-
      1 De diergezondheidsheffing wordt door Onze Minister per kalenderjaar geheven.

      2 Onze Minister kan een voorlopige diergezondheidsheffing opleggen tot ten hoogste het bedrag waarop de
      diergezondheidsheffing vermoedelijk zal worden vastgesteld.

      3 De voorlopige diergezondheidsheffing wordt verrekend met de diergezondheidsheffing.

      4 De diergezondheidsheffing en de voorlopige diergezondheidsheffing kunnen bij dwangbevel worden ingevorderd.

      5 Onze Minister kan regels stellen, op grond waarvan een natuurlijke persoon of rechtspersoon, dan wel een
      samenwerkingsverband van natuurlijke personen of rechtspersonen

      a. op de daarbij vastgestelde wijze en binnen de daarbij vastgestelde termijn de gegevens en bescheiden verstrekt
      die voor de vaststelling van de diergezondheidsheffing van belang kunnen zijn, en

      b. op verzoek van Onze Minister nadere gegevens en bescheiden verstrekt ten behoeve van de vaststelling van de
      diergezondheidsheffing.

      6 In afwijking van het eerste lid wordt de diergezondheidsheffing, in geval van toepassing van
      [artikel 91f, vierde lid][ref1], geheven over elke periode dat kippen kalkoenen, eenden, of dieren behorend tot
      een andere krachtens [artikel 91c, tweede lid][ref2], aangewezen soort gevogelte, in een stal of ruimte worden
      gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel91f
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel91c
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel93
