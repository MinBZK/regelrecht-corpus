  - number: '3'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden voor bij die maatregel aangewezen categorieën van houders
      van dieren of levende dierlijke producten van bij die maatregel aangewezen soorten of categorieën van dieren dan
      wel van levende dierlijke producten regelen gesteld omtrent:

      a. de inrichting van de bedrijven waarop dieren of levende dierlijke producten worden gehouden;

      b. het toevoegen van dieren aan bedrijven of vestigingen, daaronder begrepen het aantal bedrijven of vestigingen
      waarvan de toe te voegen dieren ten hoogste afkomstig zijn;

      c. de wijze waarop dieren worden gehouden en hun huisvesting;

      d. de hygiënische eisen waaraan moet worden voldaan;

      e. de voedering, drenking, verzorging en behandeling van dieren;

      f. het gebruik van sera, entstoffen, antibiotica en chemotherapeutica;

      g. de bestrijding van insecten en ratten alsmede van andere organismen voor zover zij schadelijk zijn voor de
      gezondheid van dieren;

      h. bedrijfsbegeleiding door een dierenarts;

      i. het vervoer en het verzamelen van dieren of van levende dierlijke producten;

      j. het afvoeren van dieren van bedrijven of vestigingen, daaronder begrepen het aantal bedrijven of vestigingen
      waaraan die dieren ten hoogste worden toegevoegd;

      k. het winnen, bewerken en gebruiken van levende dierlijke producten;

      l. de behandeling en aanbieding voor onderzoek van doodgeboren of gestorven dieren dan wel levende dierlijke
      producten, onvoldragen vruchten en nageboorten;

      m. het houden van aantekeningen omtrent bezoekers en vervoermiddelen.

      2 Bij de in het eerste lid bedoelde maatregel kan het begrip bedrijf en vestiging worden omschreven waarbij
      voor de verschillende soorten of categorieën van dieren dan wel van levende dierlijke producten verschillende
      omschrijvingen kunnen worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel3
  - number: '4'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kan aan de houder van één of meer dieren, behorende tot een
      daarbij te bepalen diersoort, de verplichting worden opgelegd om:

      a. zich als zodanig voor een bij of krachtens de maatregel genoemd tijdstip schriftelijk te melden bij Onze
      Minister onder vermelding van het aantal dieren dat hij van de onderscheiden soorten houdt;

      b. indien de dieren bedrijfsmatig worden gehouden, aantekening te houden van het aantal op zijn bedrijf aanwezige
      dieren van deze soort, van de geboorte op, onderscheidenlijk toevoeging van dieren van deze soort aan zijn bedrijf,
      alsmede van de afvoer van dieren van deze soort van zijn bedrijf, één en ander onder vermelding van de gegevens
      waardoor de dieren kunnen worden geïdentificeerd en onder vermelding van naam en adres van degene van wie de dieren
      afkomstig zijn onderscheidenlijk aan wie de dieren zijn afgeleverd.

      2 De in het eerste lid, onderdeel *b*, bedoelde aantekeningen dienen gedurende ten minste drie maanden te worden
      bewaard.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel4
  - number: '6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter voorkoming van verspreiding van smetstof regelen worden
      gesteld waaraan markten en andere verzamelplaatsen van dieren, slachterijen, inrichtingen waarin producten van
      dierlijke oorsprong worden gewonnen, be- of verwerkt, inrichtingen waarin diervoeder wordt bereid en plaatsen waar
      vervoermiddelen worden ontsmet moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel6
  - number: '7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter voorkoming van verspreiding van smetstof regelen worden
      gesteld ten aanzien van:

      a. de reiniging en ontsmetting van stallen, kooien, vervoermiddelen, de daarbij behorende voorwerpen en andere
      plaatsen en voorwerpen waar of waarin dieren, produkten van dierlijke oorsprong, diervoeder alsmede andere
      produkten of voorwerpen die dragers van smetstof kunnen zijn, hebben verbleven;

      b. het behandelen van de in onderdeel *a* bedoelde produkten waardoor zij geen gevaar meer kunnen opleveren voor de
      verspreiding van smetstof dan wel het vernietigen van deze produkten en de in onderdeel *a* bedoelde voorwerpen.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel7
  - number: '8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter voorkoming van verspreiding van smetstof regelen
      worden gesteld ten aanzien van de aflevering, de opslag, het in voorraad en voorhanden hebben en het vervoeren van
      materialen van dierlijke herkomst.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel8
  - number: '9'
    text: |-
      1 Het is verboden vee of pluimvee en andere dieren van door Onze Minister aangewezen soorten of categorieën van
      dieren te doen verblijven of dit te gedogen op een terrein of plaats waarop zich vuilnis of mest bevindt of waarop
      vuilnis of mest pleegt te worden gestort of opgeslagen en op een daaraan grenzend terrein, indien de dieren zich
      vrijelijk van het ene terrein naar het andere kunnen begeven.

      2 Het is verboden vuilnis of mest te storten of op te slaan op, dan wel te verspreiden over een terrein of plaats
      waarop dieren, als bedoeld in het eerste lid, vrijelijk toegang hebben.

      3 In het eerste en tweede lid wordt onder "mest" niet begrepen mest verkregen in het bedrijf, waar de dieren worden
      gehouden.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel9
  - number: '10'
    text: |-
      1 Onze Minister kan het brengen in Nederland van dieren, produkten van dierlijke oorsprong, alsmede van andere
      produkten en voorwerpen die dragers van smetstof kunnen zijn, verbieden dan wel verbieden, indien niet wordt
      voldaan aan door hem te stellen regelen.

      2 De in het eerste lid bedoelde regelen hebben in elk geval betrekking op:

      a. de eisen waaraan de in het eerste lid bedoelde dieren, produkten of voorwerpen moeten voldoen;

      b. de eisen waaraan de vervoermiddelen en de verpakkingen moeten voldoen;

      c. het aanmelden van het voornemen om dieren, produkten of voorwerpen binnen te brengen;

      d. het in overleg met Onze Minister van Financiën aanwijzen van douanekantoren in de zin van de wettelijke
      bepalingen, bedoeld in [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1], waar de dieren,
      produkten of voorwerpen, die anders dan over de Belgisch-Nederlandse of de Duits-Nederlandse grens worden
      binnengebracht, moeten worden aangebracht;

      e. het aanwijzen van de plaatsen waar dieren, produkten of voorwerpen, die via de Belgisch-Nederlandse of de Duits-
      Nederlandse grens worden binnengebracht, ter onderzoek moeten worden aangeboden;

      f. de verklaringen welke op het douanekantoor, dan wel op een plaats als bedoeld in onderdeel e, moeten worden
      overgelegd en de eisen waaraan deze verklaringen moeten voldoen en

      g. het onderzoek na het binnenbrengen in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel11
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: 1:1
  - number: '11'
    text: |-
      1 Onze Minister kan ten aanzien van in artikel 10, eerste lid, bedoelde, in Nederland gebrachte dieren, produkten
      en voorwerpen onder meer regelen stellen betreffende:

      a. met betrekking tot dieren:

      1°. een nader onderzoek, voorbehoedende behandeling of een tijdelijke afzondering;

      2°. het vervoer naar de plaats van onderzoek, voorbehoedende behandeling of tijdelijke afzondering;

      3°. de bestemming;

      4°. het vervoer naar de plaats van bestemming in Nederland dan wel naar de plaats waar de dieren weer buiten
      Nederland worden gebracht;

      5°. het doden of slachten en het toezicht daarop en de bestemming van de gedode of geslachte dieren;

      b. met betrekking tot produkten en voorwerpen:

      1°. een nader onderzoek;

      2°. de bestemming;

      3°. het vervoer naar de plaats van onderzoek of de plaats van bestemming dan wel naar de plaats waar de zaken weer
      buiten Nederland worden gebracht.

      2 Regelen omtrent de in het eerste lid, onderdeel *a*, sub 5, genoemde onderwerpen, worden vastgesteld in
      overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel11
  - number: '12'
    text: |-
      Onze Minister kan voorts regelen stellen met betrekking tot de reiniging en ontsmetting van vervoermiddelen
      waarin en plaatsen waarop, alsmede met betrekking tot de reiniging, ontsmetting dan wel vernietiging van
      verpakkingsmateriaal waarin de in artikel 10, eerste lid, bedoelde, in Nederland gebrachte dieren, produkten en
      voorwerpen hebben verbleven.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel12
  - number: '13'
    text: |-
      1 Onze Minister kan bepalen, dat dieren die op grond van het bepaalde krachtens artikel 10 niet in Nederland
      hadden mogen worden gebracht zonder vergoeding van Staatswege en voor rekening van de importeur of diens
      gemachtigde binnen een door hem te bepalen termijn hetzij buiten Nederland moeten worden gebracht, hetzij onder
      door hem te stellen regelen naar een door hem aangewezen plaats moeten worden vervoerd en aldaar worden geslacht,
      onderscheidenlijk worden gedood en vernietigd.

      2 Onze Minister kan bepalen, dat produkten en voorwerpen die op grond van het bepaalde krachtens artikel 10 niet
      in Nederland hadden mogen worden gebracht, binnen een door hem te bepalen termijn voor rekening van de importeur
      of diens gemachtigde hetzij buiten Nederland moeten worden gebracht, hetzij onder door hem te stellen regelen naar
      een door hem te bepalen plaats worden gebracht om aldaar voor rekening van de importeur of diens gemachtigde een
      behandeling te ondergaan waardoor zij geen gevaar meer opleveren voor de verspreiding van smetstof, hetzij zonder
      vergoeding van Staatswege en voor rekening van de importeur of diens gemachtigde worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel13
  - number: '14'
    text: |-
      De in deze afdeling bedoelde regelen kunnen onder meer verschillen naar gelang van het land van herkomst en naar
      gelang van de bestemming der dieren, produkten en voorwerpen.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel14
  - number: '15'
    text: |-
      1 Deze afdeling is van toepassing op door Onze Minister aangewezen besmettelijke dierziekten bij:

      a. vee;

      b. pluimvee;

      c. bijen;

      d. nertsen;

      e. andere dieren behorende tot bij algemene maatregel van bestuur aangewezen soorten of categorieën van dieren;

      f. andere dieren van door Onze Minister voor een termijn van ten hoogste acht maanden aangewezen soorten of
      categorieën van dieren.

      2 Een besmettelijke dierziekte kan worden aangewezen, indien:

      a. de ziekte zich snel kan uitbreiden, ernstige schade kan berokkenen aan de betrokken diersoort en niet of niet
      volledig kan worden voorkomen of bestreden met normale bedrijfsmiddelen;

      b. een verdrag of een besluit van een volkenrechtelijke organisatie zulks met zich brengt of

      c. de ziekte naar het oordeel van Onze Minister van Volksgezondheid, Welzijn en Sport een ernstig gevaar voor de
      volksgezondheid oplevert.

      3 In het geval bedoeld in het tweede lid, onderdeel c, vindt de aanwijzing plaats in overeenstemming met Onze
      Minister van Volksgezondheid, Welzijn en Sport.

      4 Bij algemene maatregel van bestuur wordt bepaald wanneer dieren als verdachte dieren moeten worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel15
  - number: '16'
    text: |-
      1 Een aanwijzing als bedoeld in artikel 15, eerste lid, onderdeel *f*, kan alleen plaatsvinden in spoedeisende
      gevallen.

      2 Indien de aanwijzing tevens in het belang is van de volksgezondheid, vindt zij plaats in overeenstemming met Onze
      Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel16
  - number: '17'
    text: |-
      1 Bij ministeriële regeling kunnen hetzij voor geheel Nederland, hetzij voor bepaalde gedeelten daarvan, regels
      worden gesteld ter voorkoming van overbrenging van een besmettelijke dierziekte, waaronder in ieder geval regels
      omtrent:

      a. het voorbehoedend behandelen, merken, opsluiten, aanlijnen van dieren die door een besmettelijke dierziekte
      kunnen worden aangetast of drager van smetstof kunnen zijn;

      b. het behandelen of onschadelijk maken van producten van dierlijke oorsprong, diervoeder, vervoermiddelen alsmede
      van andere producten of voorwerpen die drager van smetstof kunnen zijn;

      c. het betreden van bedrijven of vestigingen waar dieren worden gehouden, waaronder het opleggen van de
      verplichting aan personen, die in het kader van de uitoefening van hun beroep of bedrijf bedrijven of vestigingen
      betreden, tot het houden van aantekeningen omtrent het betreden van desbetreffende bedrijven of vestigingen;

      d. het insemineren of laten bevruchten van dieren die door een besmettelijke dierziekte kunnen worden aangetast.

      2 Onder de in het eerste lid bedoelde regels worden mede verstaan regels met betrekking tot:

      a. het aanvoeren van dieren, producten van dierlijke oorsprong, diervoeder, vervoermiddelen alsmede van andere
      producten of voorwerpen aan bedrijven of vestigingen;

      b. het ontvangen van dieren, producten van dierlijke oorsprong, diervoeder, vervoermiddelen alsmede van andere
      producten of voorwerpen op bedrijven of vestigingen;

      c. het afvoeren van dieren, producten van dierlijke oorsprong, diervoeder, vervoermiddelen, alsmede van andere
      producten of voorwerpen van bedrijven of vestigingen;

      d. de aanwezigheid van dieren, producten van dierlijke oorsprong, diervoeder, vervoermiddelen alsmede andere
      producten of voorwerpen op bedrijven of vestigingen.

      3 Indien een besmettelijke dierziekte is aangewezen in overeenstemming met Onze Minister van Volksgezondheid,
      Welzijn en Sport worden de in het eerste lid bedoelde regels in overeenstemming met die minister gesteld.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel17
  - number: '18'
    text: |-
      1 Onze Minister kan, hetzij voor Nederland, hetzij voor bepaalde gedeelten daarvan:

      a. schorsing van markten waarop dieren van door hem aangewezen soorten of categorieën van dieren worden verhandeld
      en sluiting van diergaarden en daarmede vergelijkbare inrichtingen bevelen, dan wel markten, diergaarden of
      vergelijkbare inrichtingen verbieden indien niet wordt voldaan aan door hem te stellen regelen;

      b. het op een plaats bijeenbrengen van dieren van door hem aangewezen soorten of categorieën van dieren afkomstig
      van verschillende plaatsen verbieden of daaromtrent regelen stellen.

      2 De regelen, bedoeld in het eerste lid, kunnen onder meer betrekking hebben op de aanvoer van dieren naar en
      de afvoer van dieren van bedrijven of vestigingen waar dieren worden gehouden, markten en andere plaatsen waarop
      dieren afkomstig van verschillende plaatsen bijeen worden gebracht alsmede op de controle daarop, daaronder
      begrepen de verzegeling van vervoermiddelen en de afgifte van bewijsstukken.

      3 Indien een bevel of verbod, als bedoeld in het eerste lid, van kracht is, is het verboden dieren ten aanzien
      waarvan het bevel of verbod geldt, op de aldaar genoemde plaatsen aanwezig te hebben onderscheidenlijk aldaar
      aanwezig te hebben in strijd met de regelen bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel18
  - number: '19'
    text: |-
      1 Indien een dier verschijnselen van een besmettelijke dierziekte vertoont of indien redelijkerwijs kan worden
      aangenomen dat een dier in de gelegenheid is geweest om te worden besmet of drager van smetstof is, geeft de houder
      hiervan terstond kennis aan een ambtenaar als bedoeld in [artikel 114, tweede lid][ref1].

      2 Bij ministeriële regeling kunnen regels worden gesteld omtrent de wijze van kennis geven, bedoeld in het eerste
      lid, die voor iedere besmettelijke dierziekte kunnen verschillen.

      3 Indien een besmettelijke dierziekte is aangewezen in overeenstemming met Onze Minister van Volksgezondheid,
      Welzijn en Sport, worden de in het tweede lid bedoelde regels in overeenstemming met die minister gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
        hoofdstuk: X
  - number: '20'
    text: |-
      1 De houder, bedoeld in [artikel 19, eerste lid][ref1], verstrekt naar waarheid alle inlichtingen en verleent
      alle medewerking aan een ambtenaar als bedoeld in [artikel 114, tweede lid][ref2], die deze redelijkerwijs voor de
      vervulling van zijn taak nodig heeft en doet al datgene dat in zijn vermogen ligt om de aard van de besmettelijke
      dierziekte zo spoedig mogelijk te doen vaststellen.

      2 Het eerste lid is van overeenkomstige toepassing op een houder van een dier die door een ambtenaar als bedoeld in
      [114, tweede lid][ref3], op de hoogte is gesteld van het vermoeden dat dat dier door een besmettelijke dierziekte
      is aangetast of drager van smetstof is.


