preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is uit een oogpunt van gezondheid en welzijn van dieren,
    uit ethische overwegingen en uit een oogpunt van bescherming van veiligheid van mens en dier regelen te geven
    ten aanzien van dieren en handelingen met dieren en dat het voorts wenselijk is regelen te geven terzake van de
    uitvoer van dieren en dierlijke produkten alsmede met het oog op de raszuiverheid van produkten van de Nederlandse
    fokkerij;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      Onze Minister: Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

      dier: dier dat wordt gehouden, voor zover niet uitdrukkelijk anders is bepaald en met dien verstande dat
      [artikel 36][ref1] tevens van toepassing is op dieren die niet worden gehouden;

      vee: herkauwende en eenhoevige dieren en varkens;

      pluimvee: dieren zijnde hoenderachtigen, eenden of ganzen;

      besmettelijke dierziekte: elke aantasting van de gezondheid van een dier die gevaar kan opleveren voor de
      gezondheid van andere dieren of van de mens;

      smetstof: elk micro-organisme of virus dat, of elke andere biologische eenheid die, een infectieziekte en elke
      parasiet, die een parasitaire ziekte bij dieren kan veroorzaken;

      schadelijke stoffen: stoffen die de gezondheid van mens of dier kunnen aantasten;

      zieke dieren: dieren die zijn aangetast door een krachtens [artikel 15, eerste lid][ref2], aangewezen dierziekte;

      verdachte dieren: dieren die overeenkomstig [artikel 15, vierde lid][ref3], verdacht worden gevaar op te leveren
      voor verspreiding van een krachtens artikel 15, eerste lid, aangewezen besmettelijke dierziekte;

      produkten van dierlijke oorsprong: van dier afkomstige produkten al dan niet be- of verwerkt;

      houder: eigenaar, houder of hoeder;

      Diergezondheidsfonds: fonds als bedoeld in [artikel 95a][ref4].

      2 Voor de toepassing van het bij of krachtens [artikel 96a][ref5] bepaalde wordt verstaan onder bedrijf: bedrijf
      als bedoeld in [artikel 1, eerste lid, van de Meststoffenwet][ref6].

      3 Bij algemene maatregel van bestuur kan worden bepaald dat het bepaalde bij of krachtens deze wet geheel of
      gedeeltelijk van toepassing is op handelingen met embryo’s voor zover deze zich buiten de baarmoeder van het dier
      bevinden.


