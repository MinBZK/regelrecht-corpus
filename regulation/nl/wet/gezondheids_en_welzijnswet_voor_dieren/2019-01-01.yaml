  - number: 91c
    text: |-
      1 De diergezondheidsheffing wordt geheven ter zake van het houden in de uitoefening van een bedrijf van:

      a. kippen;

      b. kalkoenen;

      c. eenden;

      d. schapen;

      e. geiten;

      f. varkens;

      g. runderen.

      2 Bij algemene maatregel van bestuur kunnen andere diersoorten worden aangewezen dan die, genoemd in het eerste
      lid, waarvoor met ingang van een datum die is gelegen na het tijdstip van inwerkingtreding van die maatregel, de
      diergezondheidsheffing wordt geheven met dien verstande dat, ingeval de betrokken heffing wordt ingevoerd gedurende
      het kalenderjaar, de heffing in dat kalenderjaar wordt geheven over het nog niet verstreken deel van dat jaar.

      3 De diergezondheidsheffing wordt, in afwijking van het eerste en tweede lid, niet geheven voor bij algemene
      maatregel van bestuur aan te wijzen diersoorten indien het aantal dieren dat van die diersoort op het bedrijf wordt
      gehouden niet meer bedraagt dan een in die maatregel voor die diersoort bepaald aantal.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel91c
  - number: 91d
    text: |-
      1 De diergezondheidsheffing wordt geheven ter zake van het houden van schapen en geiten, anders dan in de
      uitoefening van een bedrijf.

      2 Bij algemene maatregel van bestuur kunnen andere diersoorten worden aangewezen dan die, genoemd in het eerste
      lid, die anders dan in de uitoefening van een bedrijf worden gehouden, waarvoor met ingang van een datum die
      is gelegen na het tijdstip van inwerkingtreding van die maatregel, de diergezondheidsheffing wordt geheven met
      dien verstande dat, ingeval de betrokken heffing wordt ingevoerd gedurende het kalenderjaar, de heffing in dat
      kalenderjaar wordt geheven over het nog niet verstreken deel van dat jaar.

      3 De diergezondheidsheffing wordt, in afwijking van het eerste en tweede lid, niet geheven voor bij algemene
      maatregel van bestuur aangewezen diersoorten indien het aantal dieren dat van die diersoort wordt gehouden niet
      meer bedraagt dan een in die maatregel voor die diersoort bepaald aantal.

      4 De diergezondheidsheffing wordt niet geheven ter zake van het houden van dieren die zich bevinden in een
      verzamelcentrum, een slachthuis of een vervoermiddel.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel91d
  - number: 91e
    text: |-
      De diergezondheidsheffing wordt geheven:

      a. voor het houden van dieren in de uitoefening van een bedrijf: van de natuurlijke persoon of rechtspersoon
      die, of het samenwerkingsverband van natuurlijke personen of rechtspersonen dat, een bedrijf voert waar de dieren
      gehouden worden;

      b. voor het houden van dieren anders dan in de uitoefening van een bedrijf: van de natuurlijke persoon of
      rechtspersoon die, of het samenwerkingsverband van natuurlijke personen of rechtspersonen dat de dieren houdt.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel91e
  - number: 91f
    text: |-
      1 De diergezondheidsheffing voor het houden van dieren wordt geheven naar het aantal dieren van een diersoort of
      diercategorie dat in een kalenderjaar wordt gehouden.

      2 Bij ministeriële regeling worden regels gesteld voor de berekeningswijze van het aantal dieren, bedoeld in het
      eerste lid, welke regels per diersoort of diercategorie kunnen verschillen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop het aantal
      in een kalenderjaar gehouden dieren van een bepaalde diersoort of diercategorie wordt bepaald, indien voor die
      diersoort of diercategorie in onvoldoende mate gegevens over het aantal gehouden dieren in een kalenderjaar
      voorhanden zijn om dat aantal op die basis met voldoende zekerheid te kunnen berekenen.

      4 In afwijking van het eerste lid wordt de diergezondheidsheffing voor het houden van kippen, kalkoenen, eenden of
      dieren behorend tot een andere krachtens [artikel 91c, tweede lid][ref1], aangewezen soort gevogelte, geheven naar
      het aantal dieren dat aan het begin van de periode waarin zij worden gehouden in een tot het bedrijf behorende stal
      of ruimte wordt binnengebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel91c
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel91f
