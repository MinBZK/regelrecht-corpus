    text: |-
      1 Gedragingen in strijd met de voorschriften vastgesteld bij of krachtens de [artikelen 36, eerste lid][ref1],
      [37][ref2], [40][ref3], [43][ref4], [61, eerste lid][ref5], en[ 73, tweede lid][ref6], worden gestraft met
      gevangenisstraf van ten hoogste drie jaren of een geldboete van de vierde categorie.

      2 Gedragingen in strijd met de voorschriften vastgesteld bij of krachtens de [artikelen 33][ref7] en [35][ref8],
      voorzover deze gedragingen plaatsvinden anders dan in de uitoefening van een bedrijf waarop voorschriften gesteld
      op grond van [artikel 45][ref9] van toepassing zijn, [36, derde lid][ref10], [41, eerste en tweede lid][ref11],
      [59b, derde lid][ref12], [61, tweede en derde lid][ref13],[ 62][ref14], [63][ref15] en [64][ref16] worden gestraft
      met een hechtenis van ten hoogste zes maanden of een geldboete van de derde categorie.

      3 Indien een strafbaar feit als omschreven in [artikel 62, tweede lid][ref17], of [artikel 63, eerste lid][ref18],
      wordt gepleegd in verband met een paardenren of harddraverij met betrekking tot welke een totalisator als bedoeld
      in [artikel 23, tweede lid, van de Wet op de kansspelen][ref19] (*Stb.* 1964, 483) is georganiseerd, worden de
      ingevolge het tweede lid geldende strafmaxima met een derde verhoogd.

      4 Indien een der misdrijven omschreven in [artikel 36, eerste lid][ref20], en [37][ref21] in de uitoefening van
      beroep of bedrijf zijn gepleegd, kan een geldboete worden opgelegd van de naast hogere categorie.


