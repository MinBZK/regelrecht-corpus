  - number: 95a
    text: |-
      1 Er is een Diergezondheidsfonds, hierna te noemen: het fonds.

      2 Het fonds is een begrotingsfonds als bedoeld in [artikel 2.11 van de Comptabiliteitswet 2016][ref1].

      3 Onze Minister beheert de begroting van het fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2.11
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel95a
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2.11'
  - number: 95b
    text: |-
      De ontvangsten van het fonds worden gevormd door:

      a. de opbrengsten van de diergezondheidsheffing, bedoeld in [artikel 91b][ref1];

      b. bijdragen vanuit de begroting van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      c. de door de Europese Unie ter beschikking gestelde middelen, verband houdende met het weren en de bestrijding van
      op grond van [artikel 15, eerste lid][ref2], aangewezen besmettelijke dierziekten;

      d. andere ontvangsten.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel91b
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel95b
