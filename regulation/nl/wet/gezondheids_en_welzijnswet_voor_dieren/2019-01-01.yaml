  - number: 120b
    text: |-
      1 Onze Minister kan een overtreder een bestuurlijke boete opleggen.

      2 Bij ministeriële regeling worden regels gesteld met betrekking tot de hoogte van de boete die wegens een
      overtreding kan worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel120b
  - number: 120c
    text: |-
      Mandaat tot het opleggen van een bestuurlijke boete van meer dan € 340 wordt niet verleend aan degene die van de
      overtreding een rapport of proces-verbaal heeft opgemaakt.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel120c
  - number: 120g
    text: |-
      1 Indien de ernst van de overtreding of de omstandigheden waaronder zij is begaan daartoe aanleiding geven, wordt
      zij aan het openbaar ministerie voorgelegd.

      2 Indien ter zake van een overtreding aan de overtreder een bestuurlijke boete is opgelegd, dan wel een
      mededeling als bedoeld in [artikel 5.4.2.3, tweede lid, onderdeel a, van de Algemene wet bestuursrecht][ref1],
      is verzonden, heeft dit dezelfde rechtsgevolgen als een kennisgeving van niet verdere vervolging als bedoeld in
      [artikel 246, eerste lid, van het Wetboek van Strafvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel550
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel246
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel120g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:50
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '246'
  - number: 120j
    text: |-
      De bestuurlijke boete bedraagt ten hoogste het bedrag dat is bepaald voor de vijfde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1], per overtreding begaan door een natuurlijke
      persoon, en ten hoogste het bedrag dat is bepaald voor de zesde categorie, bedoeld in artikel 23, vierde lid, van
      het Wetboek van Strafrecht per overtreding, begaan door een rechtspersoon of een vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel120j
