  - number: 91g
    text: |-
      1 De diergezondheidsheffing wordt geheven ter zake van het in de uitoefening van een bedrijf:

      a. inleggen van broedeieren van kippen, kalkoenen of eenden in een broedmachine;

      b. produceren van vaccinbroedeieren van kippen, kalkoenen of eenden.

      2 De diergezondheidsheffing kan worden geheven ter zake van het in de uitoefening van een bedrijf verhandelen,
      vervoeren of slachten van dieren, het produceren, bewerken, vervoeren of verhandelen van dierlijke producten,
      anders dan de handelingen, genoemd in het eerste lid, of het bereiden van diervoeder in een kalenderjaar, welke
      heffingen dienen ter bestrijding van de kosten, bedoeld in [artikel 91b, onderdelen a tot en met g][ref1].

      3 Bij algemene maatregel van bestuur kan een handeling, genoemd in het tweede lid, worden aangewezen waarvoor de
      diergezondheidsheffing wordt geheven met ingang van een datum die is gelegen na het tijdstip van inwerkingtreding
      van de desbetreffende maatregel met dien verstande dat, ingeval de betrokken heffing wordt ingevoerd gedurende het
      kalenderjaar, de heffing in dat kalenderjaar wordt geheven over het nog niet verstreken deel van dat jaar.

      4 Bij de maatregel, bedoeld in het derde lid, wordt voor een aangewezen handeling tevens de heffingsgrondslag
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel91b
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel91g
    references:
      - id: ref1
