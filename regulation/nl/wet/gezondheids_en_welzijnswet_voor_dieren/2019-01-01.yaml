        artikel: '114'
        hoofdstuk: X
  - number: 120a
    text: |-
      1 In dit hoofdstuk wordt verstaan onder:

        - *overtreding:* gedraging die in strijd is met het bepaalde bij of krachtens de
      [artikelen 3, eerste lid, onderdelen b tot en met e, i en j][ref1], [4][ref2], [6][ref3], voor zover deze
      gedragingen in strijd zijn met de voorschriften met betrekking tot markten of andere verzamelplaatsen van dieren,
      slachterijen of het ontsmetten van vervoermiddelen, [7][ref4], [10][ref5], [11, eerste lid, onderdeel a][ref6],
      [12][ref7], [13, eerste lid][ref8], [17][ref9], [18][ref10], [44, eerste, achtste en negende lid][ref11],
      [59][ref12], [59a][ref13], [59b][ref14], [77][ref15], [78][ref16], [80][ref17], [96][ref18],
      [98, eerste, tweede, vierde en vijfde lid][ref19], en [99, eerste lid][ref20];
        - *overtreder:* degene die een overtreding pleegt of mede pleegt.

      2 De bepalingen van dit hoofdstuk zijn niet van toepassing op gedragingen die in strijd zijn met het bepaalde bij
      of krachtens de in het eerste lid, onderdeel a, genoemde artikelen voor zover deze betrekking hebben op producten
      of dieren anders dan vee of pluimvee.

      3 Indien een overtreding is gepleegd door een rechtspersoon, een vennootschap zonder rechtspersoonlijkheid of een
      maatschap, wordt onder overtreder mede verstaan: degene die tot de overtreding opdracht heeft gegeven of daaraan
      feitelijk leiding heeft gegeven.


