        hoofdstuk: VIII
        afdeling: '3'
  - number: 91o
    text: |-
      Indien in de jaren 2015 tot en met 2019 ten laste van het Diergezondheidsfonds uitgaven worden gedaan die
      overeenkomstig [artikel 91k][ref1] worden verwerkt in de tarieven die worden vastgesteld voor de jaren 2020
      en verder, blijven de in [artikel 91n][ref2] genoemde bedragen van toepassing bij de vaststelling van de
      diergezondheidsheffing voor die uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel91k
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel91n
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel91o
    references:
