  - number: 95e
    text: |-
      Onze Minister kan regels stellen met betrekking tot de voorwaarden waaronder betalingen worden verricht, alsmede
      met betrekking tot de informatieverstrekking over de besteding van de verkregen bijdragen.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel95e
  - number: '96'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten behoeve van de algemene gezondheidstoestand of van het
      welzijn van dieren, ter voorkoming van de verspreiding van smetstof of van de aanwezigheid van schadelijke stoffen
      in dieren en produkten van dierlijke oorsprong dan wel ter bescherming van de veiligheid van mens of dier regelen
      worden gesteld omtrent de identificatie en registratie van dieren alsmede van levende dierlijke producten.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel96
  - number: 96a
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in de [artikelen 3][ref1], [35][ref2], [45][ref3]
      en [96][ref4] kan worden bepaald dat op een bedrijf waarnaar een varkensrecht als bedoeld in
      [artikel 1, eerste lid, van de Meststoffenwet][ref5], of een gedeelte daarvan, is overgegaan, of op
      een bedrijf dat tezamen met het daarop rustende varkensrecht is overgedragen aan een andere persoon
      of rechtspersoon, vanaf het tijdstip van registratie van de kennisgeving van overgang overeenkomstig
      [hoofdstuk V, titel 4, van de Meststoffenwet][ref6], onderscheidenlijk het tijdstip van de bedrijfsoverdracht, het
      bij of krachtens de maatregel geregelde overgangsrecht niet van toepassing is ten aanzien van de op dat tijdstip
      gestelde regels, voor zover deze betrekking hebben op varkens.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel45
