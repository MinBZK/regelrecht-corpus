  - number: '130'
    text: |-
      1 Deze wet treedt in werking op een door Ons te bepalen tijdstip dat voor de verschillende artikelen of onderdelen
      van artikelen verschillend kan worden vastgesteld.

      2 Het gestelde in artikel 41 is niet van toepassing ten aanzien van dieren die geboren zijn voor de eerste dag van
      de maand volgend op de datum van inwerkingtreding van dat artikel.

      3 Ten aanzien van zaken betreffende overtredingen van ingevolge artikel 124 vervallen en ingevolge artikel 129
      ingetrokken voorschriften die op het tijdstip van vervallen en intrekking bij de tot dat tijdstip bevoegde rechter
      aanhangig waren blijft deze rechter bevoegd. Ook in hoger beroep dat in de zaken bedoeld in de vorige volzin wordt
      ingesteld, blijft de rechter bevoegd die tot het daar bedoelde tijdstip bevoegd was van dat beroep kennis te nemen.

      4 De in het derde lid bedoelde zaken worden, onverminderd
      [artikel 1, tweede lid, van het Wetboek van Strafrecht][ref1], afgedaan volgens de tot het in het derde lid
      bedoelde tijdstip geldende regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel1
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '1'
  - number: 130a
    text: |-
      1 De verschillende artikelen van deze wet, of onderdelen daarvan, komen te vervallen op een bij koninklijk besluit
      te bepalen tijdstip dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden bepaald.

      2 Op het in het eerste lid bedoelde tijdstip vervallen in de [artikelen 1][ref1] en
      [1a van de Wet op de economische delicten][ref2] de verwijzingen naar de betrokken artikelen of onderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel1a
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel130a
    references:
