  - number: '21'
    text: |-
      1 Onze Minister besluit zo spoedig mogelijk tot het nemen van de door hem nodig geachte maatregelen tot bestrijding
      van een besmettelijke dierziekte.

      2 Onze Minister stelt de burgemeester van de gemeente, waarop de maatregelen betrekking hebben, onmiddellijk
      hiervan in kennis.

      3 Indien de situatie, in verband met het voorkomen van overbrenging van besmetting, dermate spoedeisend is dat Onze
      Minister het besluit tot het nemen van maatregelen niet tevoren op schrift kan stellen, zorgt Onze Minister alsnog
      zo spoedig mogelijk voor de opschriftstelling en de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel21
  - number: '22'
    text: |-
      1 De in artikel 21 bedoelde maatregelen kunnen zijn:

      a. het afzonderen van zieke en verdachte dieren;

      b. opstallen, ophokken of op een plaats houden van zieke en verdachte dieren;

      c. het plaatsen van waarschuwingsborden;

      d. het door het plaatsen van kentekenen besmet of van besmetting verdacht verklaren van gebouwen en terreinen;

      e. het merken van zieke, verdachte en herstelde dieren;

      f. het doden van zieke en verdachte dieren;

      g. het onschadelijk maken van gedode of gestorven, zieke en verdachte dieren, en van produkten en voorwerpen, die
      besmet zijn of ervan worden verdacht gevaar op te leveren voor verspreiding van smetstof;

      h. het reinigen en ontsmetten van gebouwen, terreinen, bewaarplaatsen van mest en voorwerpen;

      i. het vastleggen, opsluiten of afzonderen van dieren;

      j. het behandelen van dieren of producten op een door Onze Minister aangegeven wijze;

      k. het verbieden van het vervoeren van de op grond van artikel 25, eerste lid, aangewezen soorten of categorieën
      van dieren, producten of voorwerpen van of naar gebouwen en terreinen waar geen kenteken als bedoeld onderdeel d,
      is geplaatst;

      l. het verbieden van de toegang aan anderen dan de op grond van artikel 25, tweede lid, aangewezen personen of
      groepen van personen tot gebouwen en terreinen waar geen kenteken als bedoeld in onderdeel d, is geplaatst;

      m. het verbieden van het verlaten van gebouwen en terreinen waar geen kenteken als bedoeld in onderdeel d, is
      geplaatst, tenzij de door Onze Minister voorgeschreven maatregelen van ontsmetting zijn toegepast;

      n. het nemen van andere maatregelen, voorzover een verdrag of een besluit van een volkenrechtelijke organisatie
      zulks met zich brengt.

      2 In afwijking van het bepaalde in het eerste lid kunnen bedoelde maatregelen met betrekking tot bijen bestaan uit:

      a. het ontsmetten van de bijenwoning en de naaste omgeving daarvan;

      b. het verbieden van het verplaatsen van een bijenwoning;

      c. het hechten van een kenteken aan de bijenwoning, waaruit blijkt dat deze niet mag worden verplaatst;

      d. het verbieden van het laten uitvliegen der bijen gedurende een bepaalde tijd;

      e. het plaatsen van geneesmiddelen in de bijenwoning;

      f. het vernietigen of het onschadelijk maken van producten en voorwerpen die besmet zijn of ervan worden verdacht
      gevaar op te leveren voor verspreiding van smetstof;

      g. het doden en vernietigen van zieke of verdachte bijenvolken;

      h. het behandelen van de bijen op een wijze die door wetenschap of praktijk als doeltreffend is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel22
  - number: '23'
    text: |-
      1 Onze Minister stelt het model van de in artikel 22 bedoelde waarschuwingsborden en kentekenen vast en stelt
      nadere regelen vast omtrent de wijze waarop de in dat artikel genoemde maatregelen worden uitgevoerd.

      2 De burgemeester van de betrokken gemeente verleent zijn medewerking bij het plaatsen en weer verwijderen van de
      waarschuwingsborden en kentekenen.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel23
  - number: '24'
    text: |-
      Onze Minister stelt het tijdstip vast waarop de verdenking is ontstaan dat een dier lijdt aan een besmettelijke
      dierziekte alsmede het tijdstip waarop deze verdenking eindigt en stelt daarbij tevens vast welke op het bedrijf
      aanwezige dieren op het tijdstip waarop de verdenking is ontstaan reeds ziek waren en welke dieren op dat tijdstip
      van de ziekte verdacht waren.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel24
  - number: '25'
    text: |-
      1 Het is verboden dieren van bij of krachtens algemene maatregel van bestuur aangewezen soorten of categorieën van
      dieren, danwel bij of krachtens algemene maatregel van bestuur aangewezen produkten of voorwerpen te vervoeren van
      of naar gebouwen en terreinen, waar een kenteken, als bedoeld in artikel 22, eerste lid, is geplaatst.

      2 De toegang tot gebouwen of terreinen, waar een kenteken, als bedoeld in artikel 22, eerste lid, is geplaatst of
      door Onze Minister aangewezen gedeelten daarvan, is aan anderen dan door Onze Minister aan te wijzen personen of
      groepen van personen verboden.
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel25
  - number: '26'
    text: |-
      1 Het is verboden gebouwen of terreinen, waar een kenteken, als bedoeld in [artikel 22, eerste lid][ref1], is
      geplaatst te verlaten, tenzij na toepassing van de door Onze Minister voorgeschreven maatregelen van ontsmetting.

      2 De ambtenaar, bedoeld in [artikel 114, tweede lid][ref2], stelt de middelen tot de in het eerste lid bedoelde
      ontsmetting ter beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel114
