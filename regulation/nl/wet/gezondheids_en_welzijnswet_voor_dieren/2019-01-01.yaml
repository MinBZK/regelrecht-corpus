  - number: 91n
    text: |-
      De tarieven voor de diergezondheidsheffing voor de jaren 2018 en 2019 voor de diersoorten runderen, varkens,
      kippen, kalkoenen, eenden, schapen en geiten worden, zo nodig in afwijking van [artikel 91k][ref1], zodanig
      vastgesteld dat de totale opbrengst van de diergezondheidsheffing en de bijdragen van de sectorpartijen, bedoeld
      in artikel 2 van het Convenant financiering bestrijding besmettelijke dierziekten 2015–2019 (Stcrt. 2015, 13794),
      gerekend over de jaren 2015 tot en met 2019, niet meer bedraagt dan:

      a. voor runderen: € 23.540.000;

      b. voor varkens: € 53.447.000, waarvan ten hoogste € 30.000.000 ten behoeve van de bewaking en bestrijding van
      Afrikaanse varkenspest, en Swine Vesicular Disease;

      c. voor kippen, kalkoenen en eenden: € 47.138.000, waarvan ten hoogste € 2.113.000 ten behoeve van de bewaking en
      bestrijding van Newcastle Disease;

      d. voor schapen en geiten: € 5.074.000.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel91k
    url: https://wetten.overheid.nl/BWBR0005662/2019-01-01#Artikel91n
