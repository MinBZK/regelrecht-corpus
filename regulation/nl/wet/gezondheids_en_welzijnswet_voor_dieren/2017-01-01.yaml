    text: |-
      1 Er is een Diergezondheidsfonds, hierna te noemen: het fonds.

      2 Het fonds is een begrotingsfonds als bedoeld in [artikel 9, eerste lid, van de Comptabiliteitswet 2001][ref1].

      3 Onze Minister beheert de begroting van het fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel9
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel95a
