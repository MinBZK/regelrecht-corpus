  - number: '92'
    text: |-
      1 Terzake van het verhandelen, vervoeren of slachten van dieren, het produceren, vervoeren of verhandelen van
      dierlijke producten of het bereiden van diervoeder, dan wel terzake van het anders dan op een bedrijf houden
      van dieren, kunnen bij algemene maatregel van bestuur, met ingang van een datum die volgt op de datum van
      inwerkingtreding van de desbetreffende algemene maatregel van bestuur, heffingen worden ingevoerd die worden
      geheven van personen of rechtspersonen, dan wel samenwerkingsverbanden van personen of rechtspersonen, welke
      heffingen dienen ter bestrijding van de kosten:

      a. bedoeld in [artikel 83][ref1] en [88, vijfde lid][ref2], voor zover die kosten noodzakelijk zijn;

      b. van de tegemoetkomingen bedoeld in [artikel 86, eerste lid, aanhef en onderdelen a en b][ref3], en
      [artikel 90][ref4], alsmede de vergoedingen bedoeld in [artikel 91][ref5];

      c. van door Onze Minister getroffen maatregelen en voorzieningen als bedoeld in [hoofdstuk II, afdeling 3][ref6],
      voor zover die kosten noodzakelijk zijn, waartoe tevens gerekend worden de kosten van door Onze Minister getroffen
      maatregelen en voorzieningen die noodzakelijk zijn met het oog op de bescherming van het welzijn van dieren dan wel
      met het oog op onderzoek naar de mate van verspreiding van die ziekten in Nederland;

      d. van tegemoetkomingen voor maatregelen ter bestrijding van zoönosen of zoönoseverwekkers, en

      e. die noodzakelijk zijn met het oog op de heffing en invordering van de heffingen.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat een heffing als bedoeld in het eerste lid, met ingang
      van een datum die volgt op de datum van inwerkingtreding van deze maatregel, tevens wordt geheven ter bestrijding
      van de kosten van het Diergezondheidsfonds met het oog op het weren van:

      a. op grond van [artikel 15, eerste lid][ref7], aangewezen besmettelijke dierziekten;

      b. andere dierziekten;

      c. ziekten die door dieren kunnen worden overgebracht op de mens en die alleen de gezondheid van de mens aantasten,
      waarop op grond van [artikel 103][ref8] bepalingen van deze wet geheel of gedeeltelijk van overeenkomstige
      toepassing zijn verklaard, of

      d. tegen antimicrobiële diergeneesmiddelen resistente bacteriën bij dieren.

      3 Een algemene maatregel van bestuur als bedoeld in het eerste lid kan gevallen bepalen op grond waarvan korting
      op het tarief van de desbetreffende heffing wordt verkregen. Daarbij wordt in ieder geval rekening gehouden met de
      mate waarin de heffingplichtige activiteit een risico oplevert voor de verspreiding van besmettelijke dierziekten.

      4 De toepassing van het derde lid geschiedt zodanig dat in geen geval meer dan 70% korting op het tarief van de
      heffing wordt verkregen.

      5 Een krachtens het eerste lid ingevoerde heffing wordt geheven bij wege van aanslag.


