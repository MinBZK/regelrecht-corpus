  - number: 91i
    text: |-
      1 Het tarief van een krachtens [artikel 91h, eerste lid][ref1], ingevoerde heffing wordt vastgesteld op basis van
      een raming van de ten aanzien van de, bij de desbetreffende heffing betrokken diersoort, kosten, bedoeld in artikel
      91h, eerste lid, over een periode van drie jaar, te rekenen vanaf het tijdstip waarop de heffing wordt ingevoerd.
      Bij de raming wordt rekening gehouden met het totaal van de ten aanzien van die diersoort gemaakte kosten, bedoeld
      in artikel 91h, eerste lid, over de periode van drie jaar die eindigt zes maanden voor het in de vorige volzin
      bedoelde tijdstip.

      2 Telkens na een periode van drie kalenderjaren, te rekenen vanaf 1 januari van het kalenderjaar waarin een heffing
      als bedoeld in [artikel 91h, eerste lid][ref2], wordt ingevoerd, kan het tarief van de betrokken heffing voor de op
      die periode volgende periode van drie kalenderjaren worden gewijzigd. Een wijziging als bedoeld in de vorige volzin
      geschiedt bij algemene maatregel van bestuur die in werking treedt voor het tijdstip waarop de periode aanvangt
      waarop de wijziging van het tarief betrekking heeft.

      3 Wijziging van het tarief op grond van het tweede lid geschiedt op basis van het saldo van:

      a. een raming van de terzake van de bij de desbetreffende heffing betrokken diersoort te maken kosten, bedoeld in
      [artikel 91h, eerste lid][ref3], en, voor zover van toepassing, artikel 91h, tweede lid, over een periode van drie
      kalenderjaren, te rekenen vanaf 1 januari van het kalenderjaar met ingang waarvan het tarief uit hoofde van het
      tweede lid kan worden gewijzigd, bij welke raming rekening wordt gehouden met het totaal van de, terzake van die
      diersoort gemaakte kosten, bedoeld in artikel 91h, eerste lid, over een periode van drie jaar die eindigt op 1 juli
      van het kalenderjaar dat voorafgaat aan de periode waarop de raming betrekking heeft;

      b. ten hoogste 50% van de door het Diergezondheidsfonds terzake van de, bij de desbetreffende heffing betrokken
      diersoort, gemaakte kosten, bedoeld in [artikel 91h, eerste lid][ref4], over de periode vanaf de datum van
      invoering van die heffing tot 1 januari van het kalenderjaar dat voorafgaat aan het kalenderjaar met ingang waarvan
      het tarief uit hoofde van het tweede lid kan worden gewijzigd, voor zover die kosten meer bedragen dan de totale
      som van die heffing, bestemd voor de bestrijding van die kosten, zoals geheven over de tot laatstbedoelde datum
      verstreken kalenderjaren, en, voor zover van toepassing,

      c. ten hoogste 50% van de door het Diergezondheidsfonds terzake van de, bij de desbetreffende heffing betrokken
      diersoort, gemaakte kosten, bedoeld in [artikel 91h, tweede lid][ref5], over de periode vanaf de in dat artikellid
      genoemde datum tot 1 januari van het kalenderjaar dat voorafgaat aan het kalenderjaar met ingang waarvan het tarief
      uit hoofde van het tweede lid kan worden gewijzigd, voor zover die kosten meer bedragen dan de totale som van die
      heffing, bestemd voor de bestrijding van die kosten, zoals geheven over de tot laatstbedoelde datum verstreken
      kalenderjaren.

      4 In afwijking van het tweede lid kan het tarief van de heffing tevens worden gewijzigd binnen de
      in dat lid bedoelde periode van drie kalenderjaren, naar aanleiding van de inwerkingtreding van
      [artikel XXIII, onderdeel Ae, van de Wet opheffing bedrijfslichamen][ref6]. Het derde en vijfde lid zijn van
      overeenkomstige toepassing op de raming van het desbetreffende tarief.

      5 In geval van toepassing van [artikel 91h, tweede lid][ref7], wordt bij de in dat artikellid bedoelde algemene
      maatregel van bestuur het tarief van de desbetreffende heffing verhoogd met ingang van een datum die volgt op
      de datum van inwerkingtreding als bedoeld in artikel 91h, tweede lid. De verhoging wordt gebaseerd op een raming
      van de kosten, bedoeld in [artikel 95c, onderdeel c][ref8], voor zover die kosten betrekking hebben op de bij de
      desbetreffende heffing betrokken diersoort, over de kalenderjaren, te rekenen vanaf de in de vorige volzin bedoelde
      datum tot de datum met ingang waarvan uit hoofde van het tweede lid het tarief van de desbetreffende heffing kan
      worden gewijzigd.


