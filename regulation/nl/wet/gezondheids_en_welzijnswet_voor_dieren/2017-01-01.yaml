  - number: 91f
    text: De varkensheffing wordt geheven bij wege van aanslag.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel91f
  - number: 91h
    text: |-
      1 Terzake van het houden van dieren, behorende tot enige andere diersoort dan de diersoort varken, kunnen bij
      algemene maatregel van bestuur, met ingang van een datum die volgt op de datum van inwerkingtreding van de
      desbetreffende algemene maatregel van bestuur, heffingen worden ingevoerd die worden geheven van de persoon of
      rechtspersoon die of het samenwerkingsverband van personen of rechtspersonen dat een bedrijf voert, welke heffingen
      dienen ter bestrijding van de kosten:

      a. bedoeld in [artikel 83][ref1] en [88, vijfde lid][ref2], voor zover die kosten noodzakelijk zijn met het oog
      op de bestrijding van voor andere diersoorten dan de diersoort varken op grond van [artikel 15, eerste lid][ref3],
      aangewezen besmettelijke ziekten;

      b. van de tegemoetkomingen bedoeld in [artikel 86, eerste lid, aanhef en onderdelen a en b][ref4], en
      [artikel 90][ref5], alsmede de vergoedingen bedoeld in [artikel 91][ref6], voor zover die tegemoetkomingen,
      onderscheidenlijk vergoedingen, voortvloeien uit de bestrijding van voor andere diersoorten dan de diersoort varken
      op grond van [artikel 15, eerste lid][ref7], aangewezen besmettelijke ziekten;

      c. van door Onze Minister getroffen maatregelen en voorzieningen als bedoeld in [hoofdstuk II, afdeling 3][ref8],
      voor zover die kosten noodzakelijk zijn met het oog op de bestrijding van voor andere diersoorten dan de diersoort
      varken op grond van [artikel 15, eerste lid][ref9], aangewezen besmettelijke ziekten, waartoe tevens gerekend
      worden de kosten van door Onze Minister getroffen maatregelen en voorzieningen die noodzakelijk zijn met het oog
      op de bescherming van het welzijn van dieren dan wel met het oog op onderzoek naar de mate van verspreiding van die
      ziekten in Nederland;

      d. van tegemoetkomingen voor maatregelen ter bestrijding van zoönosen of zoönoseverwekkers bij andere dieren dan
      varkens waartoe de houder op grond van EU-verordeningen of EU- besluiten als bedoeld in [artikel 81a][ref10] is
      gehouden, en

      e. die noodzakelijk zijn met het oog op de heffing en invordering van de heffingen.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat een heffing als bedoeld in het eerste lid, met ingang
      van een datum die volgt op de datum van inwerkingtreding van deze maatregel, tevens wordt geheven ter bestrijding
      van de kosten van het Diergezondheidsfonds met het oog op het weren van:

      a. voor andere diersoorten dan de diersoort varken op grond van [artikel 15, eerste lid][ref11], aangewezen
      besmettelijke dierziekten;

      b. andere dierziekten bij andere diersoorten dan de diersoort varken;

      c. ziekten die door andere diersoorten dan de diersoort varken kunnen worden overgebracht op de mens en die alleen
      de gezondheid van de mens aantasten, waarop op grond van [artikel 103][ref12] bepalingen van deze wet geheel of
      gedeeltelijk van overeenkomstige toepassing zijn verklaard, of

      d. tegen antimicrobiële diergeneesmiddelen resistente bacteriën bij dieren van andere diersoorten dan de diersoort
      varken.

      3 Een krachtens het eerste lid ingevoerde heffing wordt geheven per bedrijf per kalenderjaar naar het aantal dieren
      van de bij de desbetreffende heffing betrokken diersoort dat gemiddeld in een kalenderjaar op het bedrijf wordt
      gehouden, met dien verstande dat, in geval de betrokken heffing wordt ingevoerd gedurende het kalenderjaar, de
      heffing in dat kalenderjaar wordt geheven over het nog niet verstreken deel van dat jaar.

      4 Een algemene maatregel van bestuur als bedoeld in het eerste lid kan gevallen bepalen waarin korting op het
      tarief van de desbetreffende heffing wordt verkregen. Daarbij wordt in ieder geval rekening gehouden met de mate
      waarin het bedrijf of de bedrijfsvoering van de heffingplichtige een risico vormt voor de verspreiding van op
      grond van [artikel 15, eerste lid][ref13], aangewezen en voor de bij de desbetreffende heffing betrokken diersoort
      besmettelijke ziekten. Bij de in de eerste volzin bedoelde maatregel kan op de bij die maatregel aangegeven
      wijze rekening worden gehouden met de mate waarin en het tijdstip waarop voldaan is aan bij die maatregel voor
      de desbetreffende soort of categorie dieren te bepalen voorschriften met betrekking tot één of meer onderwerpen
      waarover krachtens [hoofdstuk III van de wet][ref14] regels zijn gesteld.

      5 De toepassing van het vierde lid geschiedt zodanig dat in geen geval meer dan 70% korting op het tarief wordt
      verkregen.

      6 Een krachtens het eerste lid ingevoerde heffing wordt geheven bij wege van aanslag.


