        afdeling: '3'
  - number: '31'
    text: |-
      Indien in het belang van het weren, de preventie of de bestrijding van besmettelijke dierziekten naar het oordeel
      van Onze Minister een onverwijlde voorziening noodzakelijk is, kan hij bepalen dat door hem krachtens dit hoofdstuk
      vastgestelde regelingen onmiddellijk na hun bekendmaking in werking treden. In dat geval kan hij zodanige regeling,
      in afwijking van [artikel 4 van de Bekendmakingswet][ref1], op andere dan de daar genoemde wijze bekend maken.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel4
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '4'
  - number: 31a
    text: |-
      1 Onze Minister kan mandaat verlenen:

      a. tot het stellen van het in artikel 30, eerste lid, bedoelde vervoersverbod en de in dat artikellid bedoelde
      regels, voorzover het toepassingsbereik van het vervoersverbod is beperkt tot een gebied met een straal van 10
      kilometer of minder rondom een gebouw of terrein, dat door het plaatsen van een kenteken als bedoeld in artikel 22,
      eerste lid, onderdeel d, besmet of van besmetting verdacht is verklaard;

      b. tot het stellen van de regels, bedoeld in artikel 17 en 18, indien in het belang van bestrijding van
      besmettelijke dierziekten een onverwijlde voorziening noodzakelijk is.

      2 Het in het eerste lid bedoelde mandaat kan tevens de bevoegdheid betreffen tot inwerkingtreding en bekendmaking
      van het vervoersverbod en de regels overeenkomstig artikel 31.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel31a
  - number: 31b
    text: |-
      1 Onze Minister kan besluiten de maatregelen, bedoeld in
      [artikel 22, eerste lid, onderdelen a, b, e, i , j of n][ref1] toe te passen op dieren die niet lijden aan een
      besmettelijke dierziekte, of niet van besmetting met een dergelijke dierziekte worden verdacht, maar die zodanige
      ziekteverschijnselen vertonen dat naar het oordeel van Onze Minister die dieren of de van die dieren afkomstige
      producten een gevaar voor de diergezondheid kunnen opleveren, danwel naar het oordeel van Onze Minister en Onze
      Minister van Volksgezondheid, Welzijn en Sport die dieren of die producten een gevaar voor de volksgezondheid
      kunnen opleveren.

      2 Bij ministeriële regeling kan de verplichting, bedoeld in [artikel 19, eerste lid][ref2], en de verplichting,
      bedoeld in [artikel 20, eerste lid][ref3], van overeenkomstige toepassing worden verklaard ten aanzien van dieren
      die niet lijden aan een besmettelijke dierziekte, of van een besmetting met een dergelijke ziekte niet worden
      verdacht, maar die door Onze Minister aangewezen andere ziekteverschijnselen vertonen.

      3 Bij de regeling, bedoeld in het tweede lid, kunnen regels worden gesteld omtrent de wijze van kennis geven als
      bedoeld in dat lid.


