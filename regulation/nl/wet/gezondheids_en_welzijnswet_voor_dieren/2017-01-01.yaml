  - number: '119'
    text: |-
      1 De in artikel 114 bedoelde ambtenaren die een monster hebben genomen, stellen dit in handen van die instelling
      die voor onderzoek daarvan door Onze Minister is aangewezen.

      2 Het monster wordt zo spoedig mogelijk door de aangewezen instelling onderzocht.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel119
  - number: '120'
    text: |-
      Een ieder ten aanzien van wie een der in [artikel 115][ref1] van deze wet omschreven bevoegdheden wordt uitgeoefend
      met het oog op de opsporing van besmettelijke dierziekten, dan wel een ieder die werkzaam is op het gebied van
      het voorkomen en bestrijden van dierziekten, is verplicht aan de in [artikel 114][ref2] bedoelde ambtenaren alle
      medewerking te verlenen, welke deze voor de opsporing van besmettelijke dierziekten redelijkerwijs behoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel120
