        artikel: '9'
  - number: 95b
    text: |-
      De ontvangsten van het fonds worden gevormd door:

      a. een jaarlijkse bijdrage vanuit de begroting van het Ministerie van Economische Zaken, welke bijdrage in omvang
      ten hoogste overeenkomt met de op deze begroting in het desbetreffende begrotingsjaar binnenkomende som van de
      varkensheffing;

      b. het aantal jaarlijkse bijdragen vanuit de begroting van het Ministerie van Economische Zaken dat overeenkomt
      met het aantal krachtens [artikel 91h][ref1] ingevoerde heffingen, welke bijdragen onderscheidenlijk ten hoogste
      overeenkomen met de op de genoemde begroting in het desbetreffende begrotingsjaar binnenkomende som van de
      onderscheiden heffingen;

      c. het aantal jaarlijkse bijdragen vanuit de begroting van het Ministerie van Economische Zaken dat overeenkomt
      met het aantal krachtens [artikel 92][ref2] ingevoerde heffingen, welke bijdragen onderscheidenlijk ten hoogste
      overeenkomen met de op de genoemde begroting in het desbetreffende begrotingsjaar binnenkomende som van de
      onderscheiden heffingen;

      d. overige bijdragen vanuit de begroting van het Ministerie van Economische Zaken;

      e. de door de Europese Unie ter beschikking gestelde middelen, verband houdende met het weren en de bestrijding van
      op grond van [artikel 15, eerste lid][ref3], aangewezen besmettelijke dierziekten;

      f. andere ontvangsten.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel91h
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel92
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel95b
