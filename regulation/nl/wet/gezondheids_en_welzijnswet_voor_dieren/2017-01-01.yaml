  - number: 92a
    text: |-
      1 Het tarief van een krachtens [artikel 92, eerste lid][ref1], ingevoerde heffing wordt vastgesteld aan de hand van
      een raming van de kosten, bedoeld in artikel 92, eerste lid, over een periode van drie jaar, te rekenen vanaf het
      tijdstip waarop de heffing wordt ingevoerd, waarbij rekening wordt gehouden met de over die periode geraamde som
      van de varkensheffing en krachtens [artikel 91h][ref2] ingevoerde heffingen.

      2 Telkens na een periode van drie kalenderjaren, te rekenen vanaf 1 januari van het kalenderjaar waarin een heffing
      als bedoeld in [artikel 92, eerste lid][ref3], wordt ingevoerd, kan het tarief van de betrokken heffing voor de op
      die periode volgende periode van drie kalenderjaren worden gewijzigd. Een wijziging als bedoeld in de vorige volzin
      geschiedt bij algemene maatregel van bestuur die in werking treedt voor het tijdstip waarop de periode aanvangt
      waarop de wijziging van het tarief betrekking heeft.

      3 Wijziging van het tarief op grond van het tweede lid geschiedt op basis van het saldo van:

      a. een raming van de kosten, bedoeld in [artikel 92, eerste lid][ref4], en, voor zover van toepassing, artikel 92,
      tweede lid, over een periode van drie kalenderjaren, te rekenen vanaf 1 januari van het kalenderjaar met ingang
      waarvan het tarief uit hoofde van het tweede lid kan worden gewijzigd, bij welke raming rekening wordt gehouden met
      de over die periode geraamde som van de varkensheffing en krachtens [artikel 91h][ref5] ingevoerde heffingen;

      b. ten hoogste 50% van het totaal van de door het Diergezondheidsfonds tot 1 januari van het kalenderjaar,
      voorafgaande aan het kalenderjaar met ingang waarvan het tarief uit hoofde van het tweede lid kan worden gewijzigd,
      gemaakte kosten, bedoeld in [artikel 92, eerste lid][ref6], voor zover die kosten meer bedragen dan de totale som
      van de varkensheffing, bestemd voor de bestrijding van de kosten, bedoeld in [artikel 91a, eerste lid][ref7], de
      totale som van de krachtens [artikel 91h, eerste lid][ref8], ingevoerde heffingen, bestemd voor de bestrijding
      van de in dat artikellid bedoelde kosten, alsmede de totale som van krachtens artikel 92, eerste lid, ingevoerde
      heffingen, bestemd voor de bestrijding van de in dat artikellid bedoelde kosten, zoals geheven over de tot
      laatstbedoelde datum verstreken kalenderjaren, en, voor zover van toepassing,

      c. ten hoogste 50% van het totaal van de door het Diergezondheidsfonds tot 1 januari van het kalenderjaar,
      voorafgaande aan het kalenderjaar met ingang waarvan het tarief uit hoofde van het tweede lid kan worden gewijzigd,
      gemaakte kosten, bedoeld in [artikel 92, tweede lid][ref9], voor zover die kosten meer bedragen dan de totale som
      van de varkensheffing, bestemd voor de bestrijding van de kosten, bedoeld in [artikel 91a, tweede lid][ref10], de
      totale som van krachtens [artikel 91h, eerste lid][ref11], ingevoerde heffingen, bestemd voor de bestrijding van de
      in artikel 91h, tweede lid, bedoelde kosten, alsmede de totale som van krachtens [artikel 92, eerste lid][ref12],
      ingevoerde heffingen, bestemd voor de bestrijding van de in artikel 92, tweede lid bedoelde kosten, zoals geheven
      over de tot laatstbedoelde datum verstreken kalenderjaren.

      4 In afwijking van het tweede lid kan het tarief van de heffing tevens worden gewijzigd binnen de
      in dat lid bedoelde periode van drie kalenderjaren, naar aanleiding van de inwerkingtreding van
      [artikel XXIII, onderdeel Ag, van de Wet opheffing bedrijfslichamen][ref13]. Het derde en vijfde lid zijn van
      overeenkomstige toepassing op de raming van het desbetreffende tarief.

      5 In geval van toepassing van [artikel 92, tweede lid][ref14], wordt bij de in dat artikellid bedoelde algemene
      maatregel van bestuur het tarief van de desbetreffende heffing verhoogd met ingang van een datum die volgt op de
      datum van inwerkingtreding als bedoeld in artikel 92, tweede lid. De verhoging wordt gebaseerd op een raming van de
      kosten, bedoeld in [artikel 95c, onderdeel c][ref15], voor zover die kosten betrekking hebben op de kalenderjaren,
      te rekenen vanaf de in de vorige volzin bedoelde datum tot de datum met ingang waarvan uit hoofde van het tweede
      lid het tarief van de desbetreffende heffing kan worden gewijzigd en rekening houdend met de over die periode
      geraamde som van de varkensheffing en krachtens [artikel 91h, eerste lid][ref16], ingevoerde heffingen.


