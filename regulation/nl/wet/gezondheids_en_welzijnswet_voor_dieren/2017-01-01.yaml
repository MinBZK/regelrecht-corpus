  - number: '87'
    text: |-
      Alvorens dieren op grond van artikel 22, eerste lid, onderdeel f, worden gedood of producten en voorwerpen op grond
      van artikel 22, eerste lid, onderdeel g, onschadelijk worden gemaakt, danwel producten en voorwerpen op grond van
      artikel 22, tweede lid, onderdeel f, worden vernietigd of onschadelijk gemaakt of bijenvolken op grond van artikel
      22, tweede lid, onderdeel g, worden vernietigd, wordt de waarde daarvan vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel87
  - number: '88'
    text: |-
      1 Dit artikel is van toepassing op de waardevaststelling van dieren, producten en voorwerpen ten aanzien waarvan
      geen regels zijn gesteld bij of krachtens de artikelen 87a, 87b en 87c.

      2 De in [artikel 87][ref1] bedoelde waardevaststelling geschiedt door een beëdigd deskundige, welke wordt
      aangewezen door Onze Minister.

      3 Indien Onze Minister of de eigenaar of diens gemachtigde geen genoegen neemt met de waardevaststelling verzoekt
      Onze Minister de kantonrechter in het kanton waar de dieren, bedoeld in [artikel 87][ref2], zijn gedood of de
      producten en voorwerpen, bedoeld in dat artikel, onschadelijk zijn gemaakt of bijenvolken als bedoeld in dat
      artikel zijn vernietigd, drie beëdigde deskundigen te benoemen, waaronder de krachtens het tweede lid aangewezen
      deskundige.

      4 Indien over de waardevaststelling geen overeenstemming wordt bereikt, geldt het bedrag dat het gemiddelde is van
      de verschillende waarderingen.

      5 De kosten van de in het tweede en derde lid bedoelde deskundigen worden uit het Diergezondheidsfonds betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel87
