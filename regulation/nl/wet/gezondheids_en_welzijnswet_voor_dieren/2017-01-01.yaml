  - number: 91b
    text: |-
      De varkensheffing wordt geheven naar het aantal varkens, uitgedrukt in heffingseenheden, dat gemiddeld in een
      kalenderjaar op het bedrijf wordt gehouden. De omrekening van varkens in heffingseenheden geschiedt overeenkomstig
      de bij deze wet behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel91b
  - number: 91c
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat over de bij die maatregel vast te stellen categorieën
      varkens geheel of ten dele geen varkensheffing verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel91c
  - number: 91d
    text: |-
      1 Het tarief van de varkensheffing bedraagt € 5,22 per heffingseenheid.

      2 Telkens met ingang van 1 januari van het kalenderjaar, volgende op een periode van drie kalenderjaren, te
      rekenen vanaf 1 januari 1998, kan het tarief van de varkensheffing voor de op die periode volgende periode van
      drie kalenderjaren worden gewijzigd. Een wijziging als bedoeld in de vorige volzin geschiedt bij algemene maatregel
      van bestuur die in werking treedt voor het tijdstip waarop de periode aanvangt waarop de wijziging van het tarief
      betrekking heeft.

      3 Wijziging van het tarief op grond van het tweede lid geschiedt op basis van het saldo van:

      a. een raming van de kosten, bedoeld in [artikel 91a, eerste lid][ref1], en, voor zover van toepassing, artikel
      91a, tweede lid, over een periode van drie kalenderjaren, te rekenen vanaf 1 januari van het kalenderjaar met
      ingang waarvan het tarief uit hoofde van het tweede lid kan worden gewijzigd, bij welke raming rekening wordt
      gehouden met het totaal van de kosten, bedoeld in artikel 91a, eerste lid, over een periode van drie jaar die
      eindigt op 1 juli van het kalenderjaar dat voorafgaat aan de periode waarop de raming betrekking heeft;

      b. ten hoogste 50% van de door het Diergezondheidsfonds gemaakte kosten, bedoeld in
      [artikel 91a, eerste lid][ref2], over de periode vanaf de datum van invoering van de varkensheffing tot 1 januari
      van het kalenderjaar dat voorafgaat aan het kalenderjaar met ingang waarvan het tarief uit hoofde van het tweede
      lid kan worden gewijzigd, voor zover die kosten meer bedragen dan de totale som van de varkensheffing, bestemd voor
      de bestrijding van die kosten, zoals geheven over de tot laatstbedoelde datum verstreken kalenderjaren, en, voor
      zover van toepassing,

      c. ten hoogste 50% van de door het Diergezondheidsfonds gemaakte kosten, bedoeld in
      [artikel 91a, tweede lid][ref3], over de periode vanaf de in dat artikellid genoemde datum tot 1 januari van het
      kalenderjaar dat voorafgaat aan het kalenderjaar met ingang waarvan het tarief uit hoofde van het tweede lid kan
      worden gewijzigd, voor zover die kosten meer bedragen dan de totale som van de varkensheffing, bestemd voor de
      bestrijding van die kosten, zoals geheven over de tot laatstbedoelde datum verstreken kalenderjaren.

      4 In afwijking van het tweede lid kan het tarief van de varkensheffing tevens worden gewijzigd binnen
      de in dat lid bedoelde periode van drie kalenderjaren, naar aanleiding van de inwerkingtreding van
      [artikel XXIII, onderdeel Ac, van de Wet opheffing bedrijfslichamen][ref4]. Het derde en vijfde lid zijn van
      overeenkomstige toepassing op de raming van het desbetreffende tarief.

      5 In geval van toepassing van [artikel 91a, tweede lid][ref5], wordt bij de in dat artikellid bedoelde algemene
      maatregel van bestuur het tarief van de varkensheffing verhoogd met ingang van een datum die volgt op de datum van
      inwerkingtreding als bedoeld in artikel 91a, tweede lid. De tariefsverhoging wordt gebaseerd op een raming van de
      kosten, bedoeld in [artikel 95c, onderdeel c][ref6], over de kalenderjaren, te rekenen vanaf de in de vorige volzin
      bedoelde datum tot de datum met ingang waarvan uit hoofde van het tweede lid het tarief van de varkensheffing kan
      worden gewijzigd, voor zover die kosten betrekking hebben op de diersoort varken.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel91a
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel91a
