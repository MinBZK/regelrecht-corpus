  - number: 122a
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van de artikelen 91a tot en met 93a, alsmede de
      artikelen 95a tot en met 95e, aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten in de
      praktijk van het in die artikelen bepaalde.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel122a
  - number: '123'
    text: |-
      In hetgeen bij of krachtens de [Visserijwet 1963][ref1] (*Stb.* 312) is of wordt voorzien, wordt niet voorzien
      krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002416
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel123
    references:
