        bwb_id: BWBR0003081
  - number: '114'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn de bij besluit van Onze Minister
      aangewezen ambtenaren belast.

      2 Onze Minister wijst ambtenaren aan die zijn belast met onderzoek naar de aanwezigheid van besmettelijke
      dierziekten.

      3 Met de opsporing van de bij [artikel 121][ref1] strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 Wetboek van Strafvordering][ref2], belast de daartoe aangewezen buitengewone opsporingsambtenaren.
      Deze ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in de [artikelen 179][ref3]
      tot en met [182][ref4] en [184 van het Wetboek van Strafrecht][ref5] voor zover deze feiten betrekking hebben op
      een bevel, vordering of handeling gedaan of ondernomen door henzelf.

      4 Van een besluit als bedoeld in dit artikel wordt mededeling gedaan door plaatsing in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel182
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel114
