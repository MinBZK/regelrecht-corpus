  - number: 94a
    text: |-
      1 Onverminderd [artikel 94][ref1] kan Onze Minister bij of krachtens algemene maatregel van bestuur een vergoeding
      van kosten heffen overeenkomstig een door hem vastgesteld tarief ter zake van bij die maatregel benoemde
      onderzoeken of verrichtingen met betrekking tot dieren, producten van dierlijke oorsprong en andere producten en
      voorwerpen die dragers van smetstof kunnen zijn, voorzover de onderzoeken of verrichtingen zijn voorgeschreven
      krachtens deze wet.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de betaling van de vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel94
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel94a
