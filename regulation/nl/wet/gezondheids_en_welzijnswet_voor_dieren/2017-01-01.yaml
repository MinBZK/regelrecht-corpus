  - number: '33'
    text: |-
      1 Het is verboden dieren te houden, tenzij deze behoren tot bij algemene maatregel van bestuur aangewezen soorten
      of categorieën van dieren.

      2 Bij een maatregel als bedoeld in het eerste lid kan worden bepaald dat het houden slechts onder bepaalde
      voorwaarden is toegestaan.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel33
  - number: '38'
    text: |-
      Bij algemene maatregel van bestuur worden voor bij die maatregel aangewezen categorieën van houders van dieren van
      bij die maatregel aangewezen soorten of categorieën van dieren regelen gesteld omtrent de verzorging, voedering,
      drenking, behandeling en het africhten van dieren.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel38
  - number: '43'
    text: Het is verboden om dieren te doden in andere dan bij algemene maatregel van bestuur aangewezen gevallen.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel43
  - number: '45'
    text: |-
      1 Onverminderd het bepaalde krachtens artikel 35 kunnen bij algemene maatregel van bestuur voor daarbij aan te
      wijzen categorieën van houders van dieren van bij die maatregel aangewezen soorten of categorieën van dieren
      regelen worden gesteld omtrent de huisvesting van dieren.

      2 De krachtens het eerste lid gestelde regelen kunnen onder meer betrekking hebben op:

        - de afmetingen en uitvoeringen van kooien, hokken en stallen alsmede hun vormgeving;
        - de aard van de wanden en van het vloer- en grondoppervlak van kooien, hokken en stallen, in het bijzonder de
      daarvoor te gebruiken materialen;
        - de inrichting van kooien, hokken en stallen, in het bijzonder de daarin aan te brengen voeder- en
      drinkwatervoorzieningen alsook voorzieningen die het voor de dieren mogelijk maken om soorteigen gedrag te
      ontplooien;
        - de verlichting, luchtverversing en verwarming van kooien, hokken en stallen;
        - de aanwezigheid en de aard van afrasteringen;
        - de voorzieningen binnen huisvestingssystemen.

      3 Bij algemene maatregel van bestuur kan het ten verkoop in voorraad hebben, verkopen en afleveren van daarbij aan
      te wijzen huisvestingssystemen, onderdelen daarvan of voorzieningen binnen huisvestingssystemen worden verboden dan
      wel slechts worden toegestaan voor zover die systemen, onderdelen of voorzieningen voldoen aan bij die maatregel
      gestelde eisen.

      4 Indien Onze Minister overweegt een voordracht te doen tot vaststelling, wijziging of intrekking van een algemene
      maatregel van bestuur als bedoeld in het eerste of derde lid kan hij, indien het belang van het welzijn van dieren
      naar zijn oordeel een onmiddellijke voorziening vereist regelen stellen overeenkomstig de in overweging zijnde
      maatregel.

      5 Een regeling als bedoeld in het vierde lid blijft, behoudens eerdere intrekking, van kracht totdat de daar
      bedoelde algemene maatregel van bestuur in werking treedt, doch uiterlijk tot acht maanden na het in werking treden
      van de regeling.

      6 Tenzij bij een maatregel als bedoeld in het eerste of derde lid of een regeling als bedoeld in het vierde lid
      anders wordt bepaald, is het bepaalde bij of krachtens de artikelen 46 tot en met 54 niet van toepassing in het
      geval voor de dieren van de aangewezen soort of categorie van dieren bij die maatregel of regeling, regelen zijn
      gesteld omtrent de huisvesting.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel45
  - number: '46'
    text: |-
      1 Het is verboden een seriematig vervaardigd huisvestingssysteem voor dieren van bij algemene maatregel van bestuur
      aangewezen soorten of categorieën van dieren, voorhanden te hebben, ten verkoop in voorraad te hebben, te verkopen,
      af te leveren of te gebruiken.

      2 Het verbod, bedoeld in het eerste lid, geldt niet indien een huisvestingssysteem is toegelaten.

      3 Het verbod, bedoeld in het eerste lid, geldt eveneens niet ten aanzien van huisvestingssystemen die worden
      doorgevoerd of kennelijk bestemd zijn voor uitvoer.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel46
  - number: '47'
    text: |-
      1 Een huisvestingssysteem wordt slechts toegelaten indien op grond van de door de aanvrager overgelegde gegevens
      met redelijke zekerheid mag worden aangenomen dat het systeem geen schadelijke effecten heeft op het welzijn
      van dieren waarvoor het bestemd is, in een mate die niet aanvaardbaar is. Bij het bepalen van de mate van
      aanvaardbaarheid wordt mede rekening gehouden met de uit het betrokken huisvestingssysteem voortvloeiende gevolgen
      voor andere belangen dan het welzijn van dieren.

      2 Over de toelating van een huisvestingssysteem beslist Onze Minister op aanvraag van de fabrikant, de importeur of
      een handelaar, gehoord de Commissie toelating huisvestingssystemen landbouwhuisdieren, bedoeld in artikel 50.

      3 Een aanvraag voor een toelating dient in ieder geval vergezeld te gaan van een door of vanwege de aanvrager
      opgestelde rapportage ter zake van dat huisvestingssysteem over de effecten op het welzijn van dieren waarvoor het
      bestemd is.

      4 Een rapportage als bedoeld in het derde lid dient te zijn opgesteld in de Nederlandse taal en bevat in ieder
      geval:

      a. een specifieke beschrijving van het huisvestingssysteem, waarvan onder meer deel uitmaakt een beschrijving van:

        - de afmetingen en uitvoeringen van kooien, hokken en stallen alsmede hun vormgeving;
        - de aard van de wanden en van het vloer- en grondoppervlak van kooien, hokken en stallen, in het bijzonder de
      daarvoor te gebruiken materialen;
        - de inrichting van kooien, hokken en stallen, in het bijzonder de daarin aan te brengen voeder- en
      drinkwatervoorzieningen alsook voorzieningen die het voor het dier mogelijk maken soorteigen gedrag te ontplooien;
        - de verlichting, luchtverversing en verwarming van kooien, hokken en stallen;
        - de aanwezigheid en de aard van afrasteringen;

      b. een specifieke beschrijving van de gevolgen van het huisvestingssysteem voor het welzijn van dieren waarvoor het
      bestemd is.

      5 Onze Minister stelt regelen omtrent de behandeling van een aanvraag. Daarbij kan onder meer worden bepaald:

      a. dat een aanvraag eerst in behandeling wordt genomen nadat een daarvoor vastgesteld bedrag is voldaan;

      b. welke kosten van het onderzoek, voortvloeiend uit een aanvraag, ten laste van de aanvrager worden gebracht;

      c. welke gegevens naast die als bedoeld in het vierde lid dienen te worden overgelegd;

      d. in welke gevallen een aanvraag voor een toelating niet ontvankelijk wordt verklaard.

      6 Aan een toelating kunnen voorschriften worden verbonden. Zij kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel47
  - number: '48'
    text: |-
      1 Huisvestingssystemen waarvan kan worden aangetoond dat zij vóór de inwerkingtreding van een maatregel als bedoeld
      in artikel 46, eerste lid, voorhanden zijn, ten verkoop in voorraad zijn gehouden, zijn verkocht, zijn afgeleverd
      dan wel in gebruik zijn, zijn toegelaten voor een door Onze Minister vastgestelde termijn. Deze termijn kan
      verschillen naar gelang het huisvestingssysteem en naar gelang de in de eerste volzin genoemde handeling.

      2 Onze Minister stelt regelen omtrent de wijze waarop dient te worden aangetoond dat huisvestingssystemen vóór de
      inwerkingtreding van een maatregel als bedoeld in artikel 46, eerste lid, voorhanden zijn, ten verkoop in voorraad
      zijn gehouden, zijn verkocht, zijn afgeleverd dan wel in gebruik zijn.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel48
  - number: '49'
    text: |-
      1 Onze Minister kan een toelating intrekken, indien ter zake daarvan:

      a. bij de aanvraag zodanig onjuiste gegevens zijn verstrekt dat, indien deze ten tijde van de toelating bekend
      zouden zijn geweest, de aanvraag zou zijn afgewezen;

      b. blijkt dat zich zodanig schadelijke effecten voordoen dat, indien deze ten tijde van de toelating bekend zouden
      zijn geweest, de aanvraag zou zijn afgewezen;

      c. een ander huisvestingssysteem is toegelaten dat uit een oogpunt van welzijn van dieren de voorkeur heeft en
      waarvan overigens het gebruik redelijkerwijs kan worden gevergd.

      2 Onze Minister kan bepalen dat een huisvestingssysteem waarvan de toelating ingevolge het eerste lid is
      ingetrokken, nog gedurende een daarbij vast te stellen termijn voorhanden mag worden gehouden, ten verkoop in
      voorraad mag worden gehouden, mag worden verkocht, mag worden afgeleverd of mag worden gebruikt. Deze termijn kan
      verschillen naar gelang de in de eerste volzin genoemde handeling.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel49
  - number: '50'
    text: |-
      1 Er is een Commissie toelating huisvestingssystemen landbouwhuisdieren die is belast met de advisering van Onze
      Minister over de toelating van huisvestingssystemen en de intrekking daarvan.

      2 Bij algemene maatregel van bestuur worden regelen gesteld omtrent onder meer de samenstelling en de werkwijze van
      de commissie, bedoeld in het eerste lid. Deze regelen hebben mede betrekking op de zittingsduur, de schorsing en
      het ontslag van de leden van de commissie.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel50
  - number: '51'
    text: Van een toelating of intrekking daarvan wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel51
  - number: '52'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld betreffende het voorhanden hebben,
      ten verkoop in voorraad hebben, verkopen, afleveren of gebruiken van huisvestingssystemen die kennelijk in een
      proefstadium verkeren. Daarbij kan worden afgeweken van het bepaalde bij of krachtens deze wet.

      2 Voor zover krachtens het eerste lid wordt bepaald dat proefnemingen slechts na daartoe gedane aanvraag kunnen
      worden toegestaan, kunnen de kosten voortvloeiende uit deze aanvraag ten laste van de aanvrager worden gebracht
      volgens door Onze Minister gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel52
  - number: '53'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld ter uitvoering van het bepaalde in de
      artikelen 46 tot en met 49.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel53
  - number: '54'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het bepaalde bij of krachtens de artikelen 46 tot en
      met 53 geheel of gedeeltelijk van overeenkomstige toepassing is voor bij die maatregel aangewezen seriematig
      vervaardigde onderdelen van dan wel aangewezen seriematig vervaardigde voorzieningen binnen huisvestingssystemen.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel54
  - number: '55'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regelen gesteld omtrent het fokken met dieren van bij die
      maatregel aangewezen soorten of categorieën van dieren. Deze regelen kunnen onder meer betrekking hebben op:

      a. de methode van fokken;

      b. het registreren, identificeren en certificeren van dieren;

      c. het voorafgaand aan het fokken door de fokker te verrichten of te doen verrichten onderzoek bij een dier waarmee
      wordt gefokt naar de aanwezigheid van aandoeningen die de gezondheid of het welzijn van het dier of de nakomelingen
      van het dier kunnen aantasten, alsmede de methoden die daarbij worden gebruikt.

      2 Bij algemene maatregel van bestuur kan het worden verboden een dier dat beschikt over één of meer aangewezen
      aandoeningen of uiterlijke kenmerken die de gezondheid of het welzijn van het dier of de nakomelingen van het dier
      kunnen aantasten te fokken of voor de fok te gebruiken.

      3 Bij algemene maatregel van bestuur kan het worden verboden een dier dat beschikt over één of meer aangewezen
      aandoeningen of uiterlijke kenmerken waarvoor krachtens het tweede lid een fokverbod is ingesteld, ten verkoop in
      voorraad te hebben, ten verkoop aan te bieden, te verkopen, te kopen, toe te laten tot een tentoonstelling, keuring
      of wedstrijd dan wel om met een dergelijk dier deel te nemen aan een tentoonstelling, keuring of wedstrijd.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel55
  - number: '56'
    text: |-
      Bij algemene maatregel van bestuur worden regelen gesteld omtrent het bedrijfsmatig verkopen, ten verkoop in
      voorraad hebben, ten verkoop aanbieden, verhuren en afleveren van dieren van bij die maatregel aangewezen soorten
      of categorieën van dieren.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel56
  - number: '65'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent het houden van keuringen, markten,
      verkopingen, tentoonstellingen en andere gelegenheden of inrichtingen waar dieren worden gehouden of aan het
      publiek getoond wegens recreatieve, sportieve of opvoedkundige doeleinden dan wel waar dieren al dan niet tijdelijk
      in bewaring worden genomen.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel65
  - number: '75'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder stamboek: boek, register, kaartsysteem of andere
      informatiedrager, bijgehouden door een door Onze Minister erkende instelling, waarin vee van een bepaald ras wordt
      ingeschreven of geregistreerd met vermelding van het voorgeslacht.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel75
  - number: '76'
    text: |-
      1 Onverminderd het bepaalde bij artikel 55 worden ter bevordering van de raszuiverheid of ter verbetering van de
      raskenmerken bij of krachtens algemene maatregel van bestuur regelen gesteld omtrent het fokken met dieren van bij
      algemene maatregel van bestuur aangewezen veesoorten.

      2 De in het eerste lid bedoelde regelen kunnen betrekking hebben op:

      a. de voorwaarden voor de erkenning door Onze Minister van instellingen, die stamboeken bijhouden;

      b. de eisen, waaraan dieren moeten voldoen om voor inschrijving in een stamboek in aanmerking te komen;

      c. de certificaten, die worden afgegeven ten bewijze van de inschrijving van dieren in een stamboek;

      d. het keuren van dieren;

      e. de methoden, die worden gebruikt bij onderzoek naar en de beoordeling van de prestaties en de genetische waarde
      van dieren;

      f. de handel in sperma, eicellen en embryo's;

      g. de voorwaarden voor toelating van fokdieren tot de voortplanting.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel76
  - number: '77'
    text: |-
      1 Het anders dan in doorvoer brengen van vee of pluimvee buiten Nederland is verboden.

      2 Het in het eerste lid vermelde verbod geldt niet indien de dieren overeenkomstig door Onze Minister gestelde
      regelen zijn voorzien van een of meer merken en vergezeld gaan van een of meer bewijsstukken aangebracht
      onderscheidenlijk afgegeven op grond van een van Rijkswege ingesteld onderzoek ten bewijze dat voldaan is aan de
      met het oog op deze uitvoer door hem gestelde eisen met betrekking tot:

      a. de identificatie der dieren;

      b. de gezondheidstoestand der dieren;

      c. de voorbehoedende behandeling der dieren;

      d. de bedrijven waarop de dieren hebben verbleven en de gezondheidstoestand der dieren op die bedrijven;

      e. de markten waarop de dieren zijn aangekocht en de plaatsen waarop de dieren zijn verzameld;

      f. de vervoermiddelen alsmede de inlading en het vervoer der dieren;

      g. andere onderwerpen, voor zover de nakoming van internationale overeenkomsten of van volkenrechtelijke
      organisaties zulks met zich brengt.

      3 Ter uitvoering van het bepaalde in het tweede lid kan Onze Minister voorts regelen stellen met betrekking tot:

      a. de plaatsen waar, alsmede de tijdruimten waarbinnen vee en pluimvee ter onderzoek kunnen worden aangeboden;

      b. de wijze waarop de dieren voor het onderzoek bedoeld in onderdeel *c* moeten worden aangeboden;

      c. het onderzoek;

      d. de wijze waarop het in het tweede lid bedoelde bewijsstuk kan worden verkregen;

      e. het toezicht dan wel de douanecontrole.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel77
  - number: '78'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan het anders dan in doorvoer buiten Nederland brengen van andere
      dan in artikel 77, eerste lid, bedoelde dieren van bij die maatregel aangewezen soorten of categorieën van dieren
      en bij die maatregel aangewezen produkten van dierlijke oorsprong worden verboden, tenzij de zending overeenkomstig
      daartoe gestelde regelen voorzien is van een of meer merken en vergezeld gaat van een of meer bewijsstukken
      aangebracht onderscheidenlijk afgegeven op grond van een van Rijkswege ingesteld onderzoek, ten bewijze dat voldaan
      is aan de met het oog op de uitvoer bij of krachtens die maatregel gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel78
  - number: '79'
    text: |-
      1 In verband met door landen van bestemming gestelde eisen op veterinair gebied kan degene die dieren en produkten
      van dierlijke oorsprong anders dan in doorvoer buiten Nederland wil brengen, verzoeken een onderzoek van Rijkswege
      in te stellen, alsmede merken aan te brengen of bewijsstukken af te geven, ten bewijze dat voldaan is aan door die
      andere landen gestelde eisen.

      2 Onze Minister kan omtrent de uitvoering van de in het eerste lid bedoelde onderzoeken nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel79
  - number: '80'
    text: |-
      Indien er gevaar bestaat voor overbrenging van een in Nederland opgetreden besmettelijke dierziekte kan Onze
      Minister het buiten Nederland brengen van dieren en dierlijke produkten afkomstig uit Nederland of een door hem te
      bepalen gedeelte daarvan verbieden dan wel verbieden indien niet voldaan wordt aan door hem te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel80
  - number: '81'
    text: |-
      1 De eisen en regelen, bedoeld in de artikelen 77 tot en met 80, kunnen onder meer verschillen naar gelang van de
      diersoort of categorie van dieren of de produkten en naar gelang van het land van bestemming.

      2 Indien ter uitvoering van het bepaalde in artikel 77 wordt voorzien in een officiële erkenning van de in het
      tweede lid van artikel 77 bedoelde bedrijven, markten en verzamelplaatsen van vee of pluimvee wordt een zodanige
      erkenning verleend voor iedere markt en verzamelplaats en ieder bedrijf, dat aan de daarvoor door Onze Minister
      gestelde eisen voldoet en wordt de erkenning ingetrokken, indien het bedrijf de markt of de verzamelplaats niet
      langer aan deze eisen blijkt te voldoen, doch niet dan nadat gedurende een redelijke termijn gelegenheid is
      gegeven, de voor het behoud van de erkenning noodzakelijke voorzieningen te treffen.

      3 Onverminderd het bepaalde in het tweede lid kan Onze Minister een officiële erkenning als bedoeld in het tweede
      lid voor bepaalde tijd intrekken indien:

      a. de bedrijfsvoering niet voldoet aan nader door Onze Minister gestelde regelen;

      b. de ondernemer ten behoeve van wiens bedrijf de officiële erkenning is verleend, in strijd handelt met het
      bepaalde bij of krachtens de artikelen 77, 78 of 79.

      4 Het bepaalde in het tweede en derde lid is van overeenkomstige toepassing indien op grond van de artikelen 78 of
      79 wordt voorzien in een officiële erkenning van bedrijven, markten of verzamelplaatsen.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel81
  - number: 81a
    text: |-
      1 In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

        - *EU-besluit:* besluit als bedoeld in artikel 288 van het Verdrag betreffende de werking van de Europese Unie;
        - *EU-rechtshandeling:* EU-verordening, EU-richtlijn, of EU-besluit;
        - *EU-richtlijn:* richtlijn als bedoeld in artikel 288 van het Verdrag betreffende de werking van de Europese Unie;
        - *EU-verordening:* verordening als bedoeld in artikel 288 van het Verdrag betreffende de werking van de Europese
      Unie.

      2 Dit hoofdstuk is van toepassing op de uitvoering van EU-rechtshandelingen betreffende de bewaking en bestrijding
      van zoönosen en zoönoseverwekkers die krachtens de artikelen 114, 168, 169 of 192 van het Verdrag betreffende de
      werking van de Europese Unie zijn vastgesteld en krachtens die rechtshandelingen vastgestelde EU-rechtshandelingen.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel81a
  - number: 81b
    text: Het is verboden te handelen in strijd met bij ministeriële regeling aangewezen voorschriften van EU-verordeningen.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel81b
  - number: 81c
    text: |-
      1 Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van EU-verordeningen of EU-besluiten.

      2 Bij of krachtens algemene maatregel van bestuur regels worden gesteld ter implementatie van EU-richtlijnen.

      3 De regels, bedoeld in het eerste en tweede lid, kunnen betrekking hebben op:

      a. de aanwijzing van een bevoegde instantie;

      b. de aanwijzing of erkenning van een laboratorium;

      c. het doen van onderzoek naar, het bewaren van gegevens over, het verzamelen en ter beschikking stellen van
      onderzoeksresultaten met betrekking tot de aanwezigheid van zoönosen en zoönoseverwekkers, antimicrobiële
      resistentie bij zoönoseverwekkers en bij andere verwekkers, wanneer deze een gevaar opleveren voor de
      volksgezondheid.

      4 De regels, bedoeld in het eerste lid, worden vastgesteld in overeenstemming met Onze Minister van
      Volksgezondheid, Welzijn en Sport.

      5 Een voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur als bedoeld
      in het tweede lid wordt Ons gedaan door Onze Minister in overeenstemming met Onze Minister van Volksgezondheid,
      Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel81c
  - number: '83'
    text: |-
      Uit het Diergezondheidsfonds worden betaald:

      a. de kosten van de uitvoering van de in artikel 22, eerste lid, onderdeel *c*, *d* en *h*, genoemde maatregelen,
      met uitzondering van die van het reinigen van gebouwen, terreinen, bewaarplaatsen van mest en voorwerpen alsmede
      van het reinigen en ontsmetten van markten en andere plaatsen waarop dieren afkomstig van verschillende plaatsen
      bijeen worden gebracht;

      b. de kosten van het ter beschikking stellen van de middelen ter ontsmetting, als bedoeld in artikel 26.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel83
  - number: '84'
    text: |-
      Onze Minister kan bepalen, dat de kosten van het in artikel 17, eerste lid, bedoelde behandelen en merken geheel of
      gedeeltelijk worden betaald uit ’s Rijks kas.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel84
  - number: '85'
    text: |-
      1 Deze afdeling is van toepassing op maatregelen als bedoeld in afdeling 3 van hoofdstuk II ter voorkoming en
      bestrijding van ingevolge artikel 15 aangewezen besmettelijke dierziekten bij vee, pluimvee, bijen en nertsen.

      2 Bij een algemene maatregel van bestuur als bedoeld in artikel 15, eerste lid, onderdeel *e*, onderscheidenlijk
      een aanwijzing als bedoeld in artikel 15, eerste lid, onderdeel *f*, kan deze afdeling geheel of gedeeltelijk van
      toepassing worden verklaard.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel85
  - number: '86'
    text: |-
      1 Uit het Diergezondheidsfonds wordt aan de eigenaar een tegemoetkoming in de schade uitgekeerd, indien:

      a. dieren krachtens het bepaalde in [artikel 22, eerste lid, onderdeel f][ref1], worden gedood;

      b. produkten en voorwerpen krachtens het bepaalde in [artikel 22, eerste lid, onderdeel g][ref2], onschadelijk
      worden gemaakt;

      c. maatregelen krachtens het bepaalde in [artikel 22, tweede lid, onderdeel f en g][ref3], zijn toegepast.

      2 De tegemoetkoming in de schade bedraagt:

      a. voor verdachte dieren: de waarde in gezonde toestand,

      b. voor zieke dieren: het bij algemene maatregel van bestuur te bepalen gedeelte van de waarde in gezonde toestand,

      c. voor produkten en voorwerpen: de waarde op het moment van de maatregel,

      met dien verstande dat indien voor de vaststelling van de waarde van bepaalde dieren, producten of voorwerpen bij
      of krachtens de artikelen 87a, 87b en 87c regels zijn gesteld, de waarde van die dieren, producten of voorwerpen
      overeenkomstig die regels wordt vastgesteld.

      3 Aan de toekenning van een tegemoetkoming kunnen door Onze Minister voorwaarden worden verbonden welke betrekking
      kunnen hebben op:

      a. de inrichting van het bedrijf;

      b. de hygiëne op het bedrijf;

      c. de herbevolking van het bedrijf;

      d. de bedrijfsbegeleiding door een dierenarts;

      e. op het bedrijf te nemen preventieve maatregelen;

      en voor zover, de eigenaar niet bedrijfsmatig dieren houdt:

      a. de inrichting van de verblijfsruimten voor dieren;

      b. de hygiëne in de verblijfsruimten voor dieren;

      c. de herbevolking van de verblijfsruimten voor dieren;

      d. de te nemen preventieve maatregelen.

      4 Onze Minister kan de uitbetaling van de tegemoetkoming opschorten totdat aan de ingevolge het derde lid gestelde
      voorwaarden is voldaan, dan wel aan degene aan wie de tegemoetkoming is toegekend, de verplichting opleggen
      zekerheid te stellen voor de juiste nakoming van de krachtens dat lid gestelde voorwaarden.

      5 Onze Minister kan bepalen, dat in afwijking van het bepaalde in het eerste en tweede lid, geen tegemoetkoming
      wordt toegekend, dan wel dat de tegemoetkoming op een geringer bedrag wordt bepaald, voor zover het optreden van de
      besmettelijke ziekte mede aan betrokkene te wijten is.

      6 Een zelfde bevoegdheid heeft Onze Minister indien wordt vastgesteld dat de eigenaar aan zijn krachtens
      [artikel 4][ref4] of krachtens de [artikelen 91a][ref5], [91h][ref6] of [92][ref7] opgelegde verplichtingen niet of
      niet volledig heeft voldaan.

      7 Onze Minister kan het bedrag van de tegemoetkoming geheel of gedeeltelijk terugvorderen, indien aan de aan deze
      tegemoetkoming krachtens het derde lid gestelde voorwaarden niet of niet ten volle is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
