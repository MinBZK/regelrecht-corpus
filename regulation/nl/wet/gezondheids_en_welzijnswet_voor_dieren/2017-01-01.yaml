  - number: '101'
    text: |-
      1 Het is verboden dieren opzettelijk in een zodanige toestand te brengen dat zij als ziek onderscheidenlijk
      verdacht moeten worden aangemerkt.

      2 Het bepaalde in het eerste lid geldt niet indien Onze Minister het in zieke of verdachte toestand brengen in het
      belang van de algemene gezondheidstoestand van de betrokken diersoort uitdrukkelijk heeft goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel101
  - number: 101a
    text: |-
      1 De houder van één of meer dieren die weet of redelijkerwijs kan vermoeden dat door zijn handelen of nalaten,
      een besmetting met danwel de verspreiding van een krachtens artikel 15 aangewezen besmettelijke dierziekte kan
      worden veroorzaakt, is verplicht dergelijk handelen achterwege te laten voorzover zulks in redelijkheid kan worden
      gevergd, danwel alle maatregelen te nemen die in redelijkheid kunnen worden gevergd, teneinde zodanige besmetting
      of verspreiding te voorkomen, danwel indien zodanige besmetting zich voordoet, de omvang en de gevolgen daarvan
      zoveel mogelijk te beperken of ongedaan te maken.

      2 De in het eerste lid bedoelde houder handelt in ieder geval in strijd met dat lid indien deze een of meer
      handelingen verricht waarvan redelijkerwijs kan worden aangenomen dat die achterwege zouden zijn gebleven indien
      geen sprake zou zijn geweest van een uitbraak van een besmettelijke dierziekte, danwel een kennelijke dreiging
      daarvan, en redelijkerwijs kan worden aangenomen dat die handelingen het gevaar van een zodanige verspreiding
      kunnen vergroten.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel101a
  - number: '102'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen ter voorkoming van de verspreiding van smetstof door
      dieren die niet worden gehouden regelen worden gesteld.

      2 De krachtens het eerste lid gestelde regelen kunnen onder meer betrekking hebben op het behandelen en
      voorbehoedend behandelen van die dieren.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel102
  - number: '103'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen ter wering en bestrijding van ziekten die door dieren op de mens
      kunnen worden overgebracht en die alleen de gezondheid van de mens aantasten de bepalingen van deze wet geheel of
      gedeeltelijk van overeenkomstige toepassing worden verklaard.

      2 Een voordracht voor een algemene maatregel van bestuur als bedoeld in het eerste lid wordt Ons gedaan door Onze
      Minister en Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel103
  - number: '104'
    text: |-
      1 Een ieder wie zulks aangaat is verplicht te handelen overeenkomstig dan wel zijn medewerking te verlenen aan de
      uitvoering van een krachtens deze wet gegeven bevel of genomen maatregel.

      2 Het is verboden krachtens deze wet aangebrachte merken te verwijderen, te vernietigen, te beschadigen of
      onleesbaar te maken, tenzij toestemming is verleend door Onze Minister.

      3 Het is verboden, tenzij met toestemming van Onze Minister ten aanzien van krachtens deze wet geplaatste of
      aangebrachte waarschuwingsborden en kentekenen enige handeling te verrichten.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel104
  - number: '105'
    text: |-
      1 Indien krachtens enige bepaling van deze wet regelen zijn vastgesteld ten aanzien van het voorzien zijn van
      dieren en produkten van dierlijke oorsprong van merken of kentekenen kan Onze Minister regelen stellen ten aanzien
      van het vervaardigen, vervoeren, te koop aanbieden, verkopen, voorhanden en in voorraad hebben, afleveren en
      gebruiken van zodanige merken of kentekenen en van stempels en andere werktuigen, waarmede merken en kentekenen
      kunnen worden vervaardigd of aangebracht.

      2 Het bepaalde in het eerste lid is van overeenkomstige toepassing indien krachtens enige bepaling van deze wet
      regelen zijn gesteld ten aanzien van het vergezeld gaan van dieren of produkten van dierlijke oorsprong door
      bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel105
  - number: '106'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij of krachtens deze
      wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel106
  - number: '107'
    text: |-
      1 Onze Minister kan, voor zover het belang van de gezondheid of het welzijn van dieren dan wel, voor zover het
      verband houdt met niet voor menselijke consumptie bestemde dierlijke bijproducten, het belang van de gezondheid van
      mensen zich daartegen niet verzet, van het bij of krachtens deze wet bepaalde vrijstelling of ontheffing verlenen.

      2 Een vrijstelling of ontheffing van het bij of krachtens de [artikelen 97 tot en met 99][ref1] bepaalde alsmede
      van een voorschrift dat tevens in het belang is van de bestrijding van een dierziekte die is aangewezen in
      overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport wordt in overeenstemming met Onze Minister
      van Volksgezondheid, Welzijn en Sport verleend.

      3 Aan een vrijstelling of ontheffing kunnen voorschriften of voorwaarden worden verbonden. Zij kunnen onder
      beperkingen worden verleend. Zij kunnen te allen tijde worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel43
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '43'
        hoofdstuk: III
        afdeling: '3'
  - number: '110'
    text: |-
      1 De algemene maatregelen van bestuur, bedoeld in de [artikelen 1, tweede lid][ref1];
      [15, eerste lid, onderdeel e][ref2]; [33, eerste lid][ref3]; [34, eerste en tweede lid][ref4];
      [35, eerste lid][ref5]; [38][ref6]; [39][ref7]; [40, tweede lid, onderdeel c, en derde lid][ref8];
      [42][ref9]; [43][ref10]; [44, eerste en negende lid][ref11]; [45, eerste en derde lid][ref12];
      [46, eerste lid][ref13]; [50, tweede lid][ref14]; [52, eerste lid][ref15]; [53][ref16]; [54][ref17];
      [55, eerste, tweede en derde lid][ref18]; [56][ref19]; [59a, tweede en vierde lid][ref20];
      [59b, tweede lid][ref21]; [61, tweede en derde lid][ref22]; [65][ref23]; [68][ref24]; [69, tweede lid][ref25];
      [70][ref26]; [76, eerste lid][ref27], [91a, tweede lid][ref28], [91d, tweede lid][ref29],
      [91e, tweede en derde lid][ref30], [91h, tweede lid][ref31], [91i, tweede lid][ref32], [92, tweede lid][ref33],
      [92a, tweede lid][ref34], alsmede [96][ref35] worden aan beide Kamers der Staten-Generaal overgelegd. Binnen 30
      dagen na de overlegging kan door ten minste een vijfde van het grondwettelijk aantal leden van één der Kamers de
      wens te kennen worden gegeven dat de inwerkingtreding bij wet zal worden geregeld. Indien zodanige wens te kennen
      wordt gegeven, dienen Wij zo spoedig mogelijk een desbetreffend wetsvoorstel in.

      2 Indien de algemene maatregel van bestuur tevens in het belang is van de volksgezondheid, wordt de voordracht
      tot vaststelling, wijziging of intrekking van de algemene maatregel van bestuur gedaan door Onze Minister in
      overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport.

      3 Indien het wetsvoorstel wordt ingetrokken of één van beide Kamers der Staten-Generaal tot niet-aanneming daarvan
      besluit, wordt de algemene maatregel van bestuur onverwijld ingetrokken.


