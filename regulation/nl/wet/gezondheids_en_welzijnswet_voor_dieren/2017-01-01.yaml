  - number: '115'
    text: |-
      1 De [artikelen 5:13][ref1] en [5:15][ref2] tot en met [5:20 van de Algemene wet bestuursrecht][ref3] zijn van
      overeenkomstige toepassing ten aanzien van de in artikel 114, tweede en derde lid, bedoelde ambtenaren.

      2 De in artikel 114 bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur, een woning binnen
      te treden zonder toestemming van de bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel513
