  - number: '113'
    text: |-
      Deze wet treedt niet in hetgeen bij of krachtens de [Wet op de dierproeven][ref1] (*Stb.* 1977, 67) is geregeld,
      met dien verstande dat onverminderd van kracht blijft hetgeen is of wordt bepaald bij of krachtens de artikelen 35,
      38, 42, 45 tot en met 54, 55, 66 en 76.


      [ref1]: https://wetten.overheid.nl/BWBR0003081
    url: https://wetten.overheid.nl/BWBR0005662/2017-01-01#Artikel113
