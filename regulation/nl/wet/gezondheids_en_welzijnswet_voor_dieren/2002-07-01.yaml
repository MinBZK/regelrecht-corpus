  - number: 95c.d
    text: |-
      terzake van de heffing en invordering van de varkensheffing en krachtens [artikel 91h][ref1] of [92][ref2]
      ingevoerde heffingen, en


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel91h
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel92
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel95c
