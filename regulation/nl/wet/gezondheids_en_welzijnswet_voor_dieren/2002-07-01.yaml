  - number: 122a
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van de artikelen 91a tot en met 93a, alsmede de
      artikelen 95a tot en met 95e, aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten in de
      praktijk van het in die artikelen bepaalde.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel122a
  - number: '123'
    text: |-
      In hetgeen bij of krachtens de [Visserijwet 1963][ref1] (*Stb.* 312) is of wordt voorzien, wordt niet voorzien
      krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002416
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0002416
  - number: '129'
    text: 'De volgende wetten worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel129
  - number: 129.a
    text: de Paardenwet 1939 (*Stb.* 620);
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel129
  - number: 129.b
    text: de Bijenwet 1947 (*Stb.* H 13);
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel129
  - number: 129.h
    text: de Wet dierenvervoer (*Stb.* 1977, 338);
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel129
  - number: '130.1'
    text: |-
      Deze wet treedt in werking op een door Ons te bepalen tijdstip dat voor de verschillende artikelen of onderdelen
      van artikelen verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel130
  - number: '130.2'
    text: |-
      Het gestelde in artikel 41 is niet van toepassing ten aanzien van dieren die geboren zijn voor de eerste dag van de
      maand volgend op de datum van inwerkingtreding van dat artikel.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel130
  - number: '130.3'
    text: |-
      Ten aanzien van zaken betreffende overtredingen van ingevolge artikel 124 vervallen en ingevolge artikel 129
      ingetrokken voorschriften die op het tijdstip van vervallen en intrekking bij de tot dat tijdstip bevoegde rechter
      aanhangig waren blijft deze rechter bevoegd. Ook in hoger beroep dat in de zaken bedoeld in de vorige volzin wordt
      ingesteld, blijft de rechter bevoegd die tot het daar bedoelde tijdstip bevoegd was van dat beroep kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel130
  - number: '130.4'
    text: |-
      De in het derde lid bedoelde zaken worden, onverminderd
      [artikel 1, tweede lid, van het Wetboek van Strafrecht][ref1], afgedaan volgens de tot het in het derde lid
      bedoelde tijdstip geldende regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel1
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel130
