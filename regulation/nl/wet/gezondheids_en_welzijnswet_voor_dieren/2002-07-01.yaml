  - number: 95c.b
    text: |-
      terzake van door Onze Minister getroffen maatregelen en voorzieningen bedoeld in
      [hoofdstuk II, afdeling 3, ][ref1]waartoe tevens gerekend worden de met de bestrijding van op grond van
      [artikel 15, eerste lid][ref2], aangewezen besmettelijke dierziekten verband houdende door Onze Minister getroffen
      maatregelen en voorzieningen met het oog op de bescherming van het welzijn van dieren dan wel met het oog op
      onderzoek naar de mate van verspreiding van dierziekten in Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel95c
