  - number: 95c.c
    text: |-
      terzake van door Onze Minister, met het oog op het weren van krachtens [artikel 15, eerste lid][ref1], aangewezen
      besmettelijke dierziekten, gemaakte kosten;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel95c
