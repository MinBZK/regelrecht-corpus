        hoofdstuk: V
  - number: '122.2'
    text: |-
      Gedragingen in strijd met de voorschriften vastgesteld bij of krachtens de[artikelen 33][ref1], [35][ref2],
      [36, derde lid][ref3], [41, eerste en tweede lid][ref4], [58, tweede lid][ref5], [61, tweede en derde lid][ref6],
