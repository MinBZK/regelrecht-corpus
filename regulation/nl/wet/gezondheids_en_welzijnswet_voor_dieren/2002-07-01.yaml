  - number: '122.3'
    text: |-
      Indien een strafbaar feit als omschreven in [artikel 62, tweede lid][ref1], of [artikel 63, eerste lid][ref2],
      wordt gepleegd in verband met een paardenren of harddraverij met betrekking tot welke een totalisator als bedoeld
      in [artikel 23, tweede lid, van de Wet op de kansspelen][ref3] (*Stb.* 1964, 483) is georganiseerd, worden de
      ingevolge het tweede lid geldende strafmaxima met een derde verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel63
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel23
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel122
    references:
