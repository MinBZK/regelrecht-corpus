  - number: 95c.e
    text: terzake van andere uitgaven.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel95c
  - number: 95d.1
    text: |-
      Ten gunste van de begroting van het fonds van enig jaar wordt het gerealiseerde batig saldo van het fonds van het
      voorafgaande jaar gebracht.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel95d
  - number: 95d.2
    text: Het fonds sluit het begrotingsjaar niet af met een negatief saldo.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel95d
  - number: 95e
    text: |-
      Onze Minister kan regels stellen met betrekking tot de voorwaarden waaronder betalingen worden verricht, alsmede
      met betrekking tot de informatieverstrekking over de besteding van de verkregen bijdragen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel95e
  - number: '96'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten behoeve van de algemene gezondheidstoestand of van het
      welzijn van dieren, ter voorkoming van de verspreiding van smetstof of van de aanwezigheid van schadelijke stoffen
      in dieren en produkten van dierlijke oorsprong dan wel ter bescherming van de veiligheid van mens of dier regelen
      worden gesteld omtrent de identificatie en registratie van dieren alsmede van levende dierlijke producten.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel96
  - number: 96a
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in de artikelen 3, 35, 45 en 96 kan worden bepaald dat op een
      bedrijf waarnaar een varkensrecht als bedoeld in [artikel 1 van de Wet herstructurering varkenshouderij][ref1],
      of een gedeelte van dat recht, is overgegaan, en op een bedrijf waarvan het varkensrecht is overgegaan in het
      kader van een bedrijfsoverdracht als bedoeld in artikel 20 van die wet, vanaf het tijdstip waarop registratie
      van de kennisgeving van overgang overeenkomstig de artikelen 18 en 19, onderscheidenlijk 20, van die wet heeft
      plaatsgevonden, het bij of krachtens de maatregel geregelde overgangsrecht niet van toepassing is ten aanzien van
      de op het tijdstip van registratie van de kennisgeving van overgang gestelde regels, voor zover deze betrekking
      hebben op varkens.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel1
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel96a
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '1'
  - number: '97.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ter voorkoming van de aanwezigheid van schadelijke stoffen
      in dieren en produkten van dierlijke oorsprong regelen gesteld ten aanzien van de bereiding, de aflevering, de
      opslag, het in voorraad en voorhanden hebben en het vervoeren van diervoerder en voor de voedering van voor dieren
      geschikte of bestemde voedselafvallen en materialen van dierlijke herkomst, alsmede ten aanzien van vervoedering
      van deze produkten. De regelen kunnen eveneens betrekking hebben op de aflevering, de ontvangst, de opslag, het in
      voorraad en voorhanden hebben en het vervoeren van daarbij aangewezen grondstoffen, die kennelijk bestemd zijn voor
      de verwerking in diervoeders.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel97
  - number: '97.2'
    text: |-
      De in het eerste lid bedoelde regelen kunnen inhouden het opleggen van een verplichting tot het voeren van een
      administratie terzake van de in het eerste lid bedoelde handelingen dan wel van de herkomst.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel97
  - number: '97.3'
    text: |-
      Een voordracht voor een algemene maatregel van bestuur als bedoeld in het eerste lid wordt Ons gedaan door Onze
      Minister en Onze Minister van Welzijn, Volksgezondheid en Cultuur.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel97
  - number: '98.1'
    text: |-
      Onze Minister kan bepalen dat dieren die aan te wijzen schadelijke stoffen hebben opgenomen of waarvan wordt
      vermoed dat zij dergelijke stoffen hebben opgenomen, totdat het tegendeel is gebleken, dan wel totdat van
      overheidswege is vastgesteld dat het dier weer vrij is van deze stoffen, het bedrijf waar zij worden gehouden niet
      mogen verlaten dan met toestemming van een door Onze Minister aangewezen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel98
  - number: '98.2'
    text: |-
      De in het eerste lid bedoelde aanwijzing van schadelijke stoffen geschiedt door Onze Minister in overeenstemming
      met Onze Minister van Welzijn, Volksgezondheid en Cultuur.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel98
  - number: '98.3'
    text: |-
      Onze Minister kan bepalen dat de in het eerste lid bedoelde dieren op een door hem voorgeschreven wijze worden
      gemerkt.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel98
  - number: '98.4'
    text: |-
      De toestemming als bedoeld in het eerste lid, kan onder beperkingen worden verleend en aan een toestemming kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel98
  - number: '99.1'
    text: |-
      Onze Minister kan het brengen in Nederland van dieren, waarin zich schadelijke stoffen bevinden, verbieden dan wel
      verbieden, indien niet voldaan wordt aan door hem te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel99
  - number: '99.2'
    text: |-
      Een regeling krachtens het eerste lid wordt vastgesteld in overeenstemming met Onze Minister van Welzijn,
      Volksgezondheid en Cultuur.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel99
  - number: '100'
    text: |-
      De dierenartsen zijn verplicht van alle door hen opgemerkte gevallen van dierziekten waarop
      [afdeling 3 van Hoofdstuk II][ref1] van toepassing is, alsmede van gevallen van andere door Onze Minister
      aangewezen dierziekten onverwijld kennis te geven aan een door Onze Minister aangewezen ambtenaar en aan de
      burgemeester van de gemeente waar het dier zich bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0005662
        hoofdstuk: II
        afdeling: '3'
  - number: '101.1'
    text: |-
      Het is verboden dieren opzettelijk in een zodanige toestand te brengen dat zij als ziek onderscheidenlijk verdacht
      moeten worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel101
  - number: '101.2'
    text: |-
      Het bepaalde in het eerste lid geldt niet indien een door Onze Minister aangewezen ambtenaar het in zieke
      of verdachte toestand brengen in het belang van de algemene gezondheidstoestand van de betrokken diersoort
      uitdrukkelijk heeft goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel101
  - number: '102.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter voorkoming van de verspreiding van smetstof door dieren
      die niet worden gehouden regelen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel102
  - number: '102.2'
    text: |-
      De krachtens het eerste lid gestelde regelen kunnen onder meer betrekking hebben op het behandelen en voorbehoedend
      behandelen van die dieren.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel102
  - number: '104.1'
    text: |-
      Een ieder wie zulks aangaat is verplicht te handelen overeenkomstig dan wel zijn medewerking te verlenen aan de
      uitvoering van een krachtens deze wet gegeven bevel of genomen maatregel.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel104
  - number: '104.2'
    text: |-
      Het is verboden krachtens deze wet aangebrachte merken te verwijderen, te vernietigen, te beschadigen of onleesbaar
      te maken, tenzij toestemming is verleend door een door Onze Minister aangewezen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel104
  - number: '104.3'
    text: |-
      Het is verboden, tenzij met toestemming van een door Onze Minister aangewezen ambtenaar ten aanzien van krachtens
      deze wet geplaatste of aangebrachte waarschuwingsborden en kentekenen enige handeling te verrichten.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel104
  - number: '105.1'
    text: |-
      Indien krachtens enige bepaling van deze wet regelen zijn vastgesteld ten aanzien van het voorzien zijn van dieren
      en produkten van dierlijke oorsprong van merken of kentekenen kan Onze Minister regelen stellen ten aanzien van
      het vervaardigen, vervoeren, te koop aanbieden, verkopen, voorhanden en in voorraad hebben, afleveren en gebruiken
      van zodanige merken of kentekenen en van stempels en andere werktuigen, waarmede merken en kentekenen kunnen worden
      vervaardigd of aangebracht.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel105
  - number: '105.2'
    text: |-
      Het bepaalde in het eerste lid is van overeenkomstige toepassing indien krachtens enige bepaling van deze wet
      regelen zijn gesteld ten aanzien van het vergezeld gaan van dieren of produkten van dierlijke oorsprong door
      bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel105
  - number: '106'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde
      verplichtingen, indien dit ter voorkoming van verspreiding van smetstof noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel106
  - number: '107.1'
    text: |-
      Onze Minister kan, voor zover het belang van de gezondheid of het welzijn van dieren zich daartegen niet verzet,
      van het bij of krachtens deze wet bepaalde vrijstelling of ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel107
  - number: '107.2'
    text: |-
      Een vrijstelling of ontheffing van het bij of krachtens de[artikelen 97 tot en met 99][ref1] bepaalde alsmede
      van een voorschrift dat tevens in het belang is van de bestrijding van een dierziekte die is aangewezen in
      overeenstemming met Onze Minister van Welzijn, Volksgezondheid en Cultuur wordt in overeenstemming met Onze
      Minister van Welzijn, Volksgezondheid en Cultuur verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel43
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '43'
        hoofdstuk: III
        afdeling: '3'
  - number: '107.3'
    text: |-
      Aan een vrijstelling of ontheffing kunnen voorschriften of voorwaarden worden verbonden. Zij kunnen onder
      beperkingen worden verleend. Zij kunnen te allen tijde worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel107
  - number: '108.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur dan wel bij ministeriële regeling, ter uitvoering van deze wet
      gegeven, kan medewerking worden gevorderd van het bestuur van een bedrijfslichaam of een samenwerkingslichaam.
      Hierbij kunnen de, ingevolge het bepaalde bij of krachtens deze wet aan de Minister toekomende bevoegdheden tot
      het nemen van besluiten, waaronder het vaststellen van nadere regels, aan het bestuur van een bedrijfslichaam of
      samenwerkingslichaam worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel108
  - number: '108.2'
    text: |-
      Indien de in het eerste lid bedoelde medewerking bestaat in het stellen van nadere regelen bij verordening, behoeft
      zodanige verordening de goedkeuring van Onze Minister. Krachtens de verordening genomen besluiten behoeven, voor
      zover zulks bij of krachtens de algemene maatregel van bestuur is bepaald, de goedkeuring van de daarbij aangewezen
      autoriteit.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel108
  - number: '109'
    text: |-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel109
  - number: '110.1'
    text: |-
      De algemene maatregelen van bestuur, bedoeld in de[ artikelen 1, tweede lid][ref1];
      [15, eerste lid, onderdeel ][ref2]; [33, eerste lid][ref3]; [34, eerste en tweede lid][ref4];
      [35, eerste lid][ref5]; [38][ref6]; [39][ref7]; [40, tweede lid, onderdeel ][ref8];
      [42][ref9]; [43][ref10]; [44, eerste en negende lid][ref11]; [45, eerste en derde lid][ref12];
      [46, eerste lid][ref13]; [50, tweede lid][ref14]; [52, eerste lid][ref15]; [53][ref16]; [54][ref17];
      [55, eerste, tweede en derde lid][ref18]; [56][ref19]; [58, eerste, tweede en vierde lid][ref20];
      [60, eerste lid][ref21]; [61, tweede en derde lid][ref22]; [65][ref23]; [68][ref24]; [69, tweede lid][ref25];
      [70][ref26]; [76, eerste lid][ref27], [91a, tweede lid][ref28], [91d, tweede lid][ref29],
      [91e, tweede en derde lid][ref30], [91h, tweede lid][ref31], [91i, tweede lid][ref32], [92, tweede lid][ref33],
      [92a, tweede lid][ref34], alsmede [96][ref35] worden aan beide Kamers der Staten-Generaal overgelegd. Binnen 30
      dagen na de overlegging kan door ten minste een vijfde van het grondwettelijk aantal leden van één der Kamers de
      wens te kennen worden gegeven dat de inwerkingtreding bij wet zal worden geregeld. Indien zodanige wens te kennen
      wordt gegeven, dienen Wij zo spoedig mogelijk een desbetreffend wetsvoorstel in.


