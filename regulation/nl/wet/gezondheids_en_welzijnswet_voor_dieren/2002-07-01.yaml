  - number: '110.2'
    text: |-
      Indien de algemene maatregel van bestuur tevens in het belang is van de volksgezondheid, wordt de voordracht
      tot vaststelling, wijziging of intrekking van de algemene maatregel van bestuur gedaan door Onze Minister in
      overeenstemming met Onze Minister van Welzijn, Volksgezondheid en Cultuur.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel110
  - number: '110.3'
    text: |-
      Indien het wetsvoorstel wordt ingetrokken of één van beide Kamers der Staten-Generaal tot niet-aanneming daarvan
      besluit, wordt de algemene maatregel van bestuur onverwijld ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel110
  - number: 110a
    text: |-
      Uiterlijk binnen drie maanden na het tijdstip waarop een algemene maatregel van bestuur als bedoeld in artikel 91h,
      eerste lid, dan wel een algemene maatregel van bestuur als bedoeld in artikel 92, eerste lid, in werking treedt,
      wordt een voorstel van wet tot goedkeuring van de betrokken algemene maatregel van bestuur aan de Tweede Kamer der
      Staten-Generaal gezonden. Indien het voorstel wordt ingetrokken of indien een van de Kamers der Staten-Generaal
      tot het niet aannemen van het voorstel besluit, wordt de betrokken maatregel ingetrokken bij algemene maatregel van
      bestuur, met ingang van het tijdstip waarop eerstbedoelde maatregel in werking trad.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel110a
  - number: '111'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van krachtens het Verdrag tot oprichting van
      de Europese Economische Gemeenschap vastgestelde verplichtingen inzake onderwerpen waarop deze wet van toepassing
      is, regelen worden gesteld waarbij kan worden afgeweken van bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel111
  - number: '113'
    text: |-
      Deze wet treedt niet in hetgeen bij of krachtens de [Wet op de dierproeven][ref1] (*Stb.* 1977, 67) is geregeld,
      met dien verstande dat onverminderd van kracht blijft hetgeen is of wordt bepaald bij of krachtens de artikelen 35,
      38, 42, 45 tot en met 54, 55, 66 en 76.


      [ref1]: https://wetten.overheid.nl/BWBR0003081
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0003081
  - number: '114.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel114
  - number: '114.2'
    text: |-
      Onze Minister wijst ambtenaren aan die zijn belast met onderzoek naar de aanwezigheid van besmettelijke
      dierziekten.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel114
  - number: '114.3'
    text: |-
      Met de opsporing van de bij [artikel 121][ref1] strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 Wetboek van Strafvordering][ref2], belast de daartoe aangewezen buitengewone opsporingsambtenaren.
      Deze ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in de
      [artikelen 179 tot en met 182][ref3] en [184 van het Wetboek van Strafrecht][ref4] voor zover deze feiten
      betrekking hebben op een bevel, vordering of handeling gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '121'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '114.4'
    text: Van een besluit als bedoeld in dit artikel wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel114
  - number: '115.1'
    text: |-
      De [artikelen 5:13][ref1] en [5:15][ref2] tot en met [5:20 van de Algemene wet bestuursrecht][ref3] zijn van
      overeenkomstige toepassing ten aanzien van de in artikel 114, tweede en derde lid, bedoelde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '115.2'
    text: |-
      De in artikel 114 bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur, een woning binnen
      te treden zonder toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel115
  - number: '117.1'
    text: |-
      Onze Minister is terzake van het vervoer van dieren bevoegd tot toepassing van bestuursdwang ter handhaving
      van de bij of krachtens deze wet gestelde verplichtingen indien de toestand van de dieren tijdens het vervoeren
      onmiddellijk ingrijpen noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel117
  - number: '117.2'
    text: 'Tot de bevoegdheid tot toepassing van bestuursdwang krachtens het eerste lid behoren de volgende maatregelen:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel117
  - number: 117.2.a
    text: het verschaffen van voer, drinken, diergeneeskundige verzorging en rust;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel117
  - number: 117.2.b
    text: |-
      het stopzetten van de reis of het terugzenden van de dieren langs de kortste weg naar de plaats van vertrek,
      voorzover daardoor geen onnodig lijden van de dieren wordt veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel117
  - number: 117.2.c
    text: het adequaat onderbrengen van de dieren, of
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel117
  - number: 117.2.d
    text: het doen slachten van de dieren.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel117
  - number: '117.3'
    text: |-
      Ter uitvoering van de bevoegdheid tot toepassing van bestuursdwang kunnen bevelen worden gegeven aan degene die
      vervoert dan wel het feitelijk toezicht op het vervoer heeft.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel117
  - number: '118.1'
    text: |-
      In het in [artikel 5:18, eerste lid, van de Algemene wet bestuursrecht][ref1] bedoelde geval verpakken en
      verzegelen de in [artikel 114][ref2] bedoelde ambtenaren het monster ter plaatse.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '114'
        hoofdstuk: X
  - number: '118.2'
    text: |-
      In het in [artikel 5:18, tweede lid, van de Algemene wet bestuursrecht][ref1] bedoelde geval laten de in
      [artikel 114][ref2] bedoelde ambtenaren een tweede monster verpakt en verzegeld in het bezit van de belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '114'
        hoofdstuk: X
  - number: '119.1'
    text: |-
      De in artikel 114 bedoelde ambtenaren die een monster hebben genomen, stellen dit in handen van die instelling die
      voor onderzoek daarvan door Onze Minister is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel119
  - number: '119.2'
    text: Het monster wordt zo spoedig mogelijk door de aangewezen instelling onderzocht.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel119
  - number: '120'
    text: |-
      Een ieder ten aanzien van wie een der in de artikelen 115 of 117 van deze wet omschreven bevoegdheden wordt
      uitgeoefend met het oog op de opsporing van besmettelijke dierziekten, dan wel een ieder die werkzaam is op het
      gebied van het voorkomen en bestrijden van dierziekten, is verplicht aan de in artikel 114 en in artikel 117
      bedoelde ambtenaren alle medewerking te verlenen, welke deze voor de opsporing van besmettelijke dierziekten
      redelijkerwijs behoeven.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel120
  - number: '121.1'
    text: |-
      Gedragingen in strijd met de voorschriften vastgesteld bij of krachtens de artikelen 36, eerste lid, 37, 40, 43,
      61, eerste lid, en 73, tweede lid, zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel121
  - number: '121.2'
    text: |-
      Gedragingen in strijd met de voorschriften vastgesteld bij of krachtens de artikelen 33, 35, 36, derde lid, 41,
      eerste en tweede lid, 58, tweede lid, 61, tweede en derde lid, 62, 63 en 64 zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel121
  - number: '122.1'
    text: |-
      Gedragingen in strijd met de voorschriften vastgesteld bij of krachtens de[artikelen 36, eerste lid][ref1],
      [37][ref2], [40][ref3], [43][ref4], [61, eerste lid][ref5], en [73, tweede lid][ref6], worden gestraft met
      gevangenisstraf van ten hoogste twee jaren of een geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel37
