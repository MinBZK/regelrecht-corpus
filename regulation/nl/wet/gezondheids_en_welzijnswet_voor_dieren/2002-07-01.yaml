  - number: '1.2'
    text: |-
      Voor de toepassing van het bij of krachtens de[artikelen 91a tot en met 93a][ref1]
      en [96a][ref2] bepaalde wordt verstaan onder bedrijf: bedrijf als bedoeld in
      [artikel 1, onderdeel c, van de Wet herstructurering varkenshouderij][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel96a
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel1
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '92'
        hoofdstuk: VIII
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: 96a
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0009542
        artikel: '1'
  - number: '1.3'
    text: |-
      Voor de toepassing van [artikel 91e][ref1] wordt verstaan onder vestiging: op één plaats gelegen bedrijf of deel
      van een bedrijf, bestaande uit alle aldaar gelegen aangrenzende percelen grond, gebouwen of afgescheiden gedeelten
      daarvan dat, naar de feitelijke omstandigheden beoordeeld, als functionele eenheid voor het houden van varkens in
      gebruik is of daartoe bestemd is.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel91e
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: 91e
        hoofdstuk: VIII
        afdeling: '3'
  - number: '1.4'
    text: |-
      Bij ministeriële regeling worden regels gesteld waaraan percelen grond, gebouwen of afgescheiden gedeelten daarvan
      moeten voldoen om als aangrenzend in de zin van het derde lid te worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel1
  - number: '1.5'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het bepaalde bij of krachtens deze wet geheel of
      gedeeltelijk van toepassing is op handelingen met embryo’s voor zover deze zich buiten de baarmoeder van het dier
      bevinden.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel1
  - number: '2.1'
    text: |-
      Er is een Raad voor dierenaangelegenheden waarin overleg plaatsvindt over vraagstukken betreffende het nationaal en
      internationaal beleid op het gebied van:
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel2
  - number: 2.1.a
    text: de gezondheid van dieren,
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel2
  - number: 2.1.b
    text: het welzijn van dieren en
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel2
  - number: 2.1.c
    text: de biotechnologische toepassingen bij dieren, de ethische aspecten daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel2
  - number: '2.2'
    text: |-
      De Raad bestaat uit een Afdeling gezondheidsvraagstukken, een Afdeling welzijnsvraagstukken en een Afdeling
      biotechnologische vraagstukken, ethische vraagstukken daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel2
  - number: '2.3'
    text: |-
      Onze Minister benoemt in overeenstemming met Onze Minister van Welzijn, Volksgezondheid en Cultuur de leden van
      de Raad.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel2
  - number: '2.4'
    text: |-
      Bij algemene maatregel van bestuur worden regelen gesteld ter zake van de samenstelling en de werkwijze van de
      Raad.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel2
  - number: '3.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor bij die maatregel aangewezen categorieën van houders
      van dieren of levende dierlijke producten van bij die maatregel aangewezen soorten of categorieën van dieren dan
      wel van levende dierlijke producten regelen gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel3
  - number: 3.1.a
    text: de inrichting van de bedrijven waarop dieren of van levende dierlijke producten worden gehouden;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel3
  - number: 3.1.b
    text: |-
      het toevoegen van dieren aan bedrijven of vestigingen, daaronder begrepen het aantal bedrijven of vestigingen
      waarvan de toe te voegen dieren ten hoogste afkomstig zijn;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel3
  - number: 3.1.c
    text: de wijze waarop dieren worden gehouden en hun huisvesting;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel3
  - number: 3.1.d
    text: de hygiënische eisen waaraan moet worden voldaan;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel3
  - number: 3.1.e
    text: de voedering, drenking, verzorging en behandeling van dieren;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel3
  - number: 3.1.f
    text: het gebruik van sera, entstoffen, antibiotica en chemotherapeutica;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel3
  - number: 3.1.g
    text: |-
      de bestrijding van insecten en ratten alsmede van andere organismen voor zover zij schadelijk zijn voor de
      gezondheid van dieren;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel3
  - number: 3.1.h
    text: |-
      bedrijfsbegeleiding door een dierenarts en begeleiding vanwege de stichting genoemd in [artikel 82][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel82
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '82'
        hoofdstuk: VIII
        afdeling: '1'
  - number: 3.1.i
    text: het vervoer en het verzamelen van dieren of van levende dierlijke producten;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel3
  - number: 3.1.j
    text: |-
      het afvoeren van dieren van bedrijven of vestigingen, daaronder begrepen het aantal bedrijven of vestigingen
      waaraan die dieren ten hoogste worden toegevoegd;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel3
  - number: 3.1.k
    text: het winnen, bewerken en gebruiken van levende dierlijke producten;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel3
  - number: 3.1.l
    text: |-
      de behandeling en aanbieding voor onderzoek van doodgeboren of gestorven dieren dan wel levende dierlijke
      producten, onvoldragen vruchten en nageboorten;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel3
  - number: 3.1.m
    text: het houden van aantekeningen omtrent bezoekers en vervoermiddelen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel3
  - number: '3.2'
    text: |-
      Bij de in het eerste lid bedoelde maatregel kan het begrip bedrijf en vestiging worden omschreven waarbij
      voor de verschillende soorten of categorieën van dieren dan wel van levende dierlijke producten verschillende
      omschrijvingen kunnen worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel3
  - number: '4.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan aan de houder van één of meer dieren, behorende tot een daarbij
      te bepalen diersoort, de verplichting worden opgelegd om:
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel4
  - number: 4.1.a
    text: |-
      zich als zodanig voor een bij of krachtens de maatregel genoemd tijdstip schriftelijk te melden bij een door Onze
      Minister aangewezen ambtenaar onder vermelding van het aantal dieren dat hij van de onderscheiden soorten houdt;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel4
  - number: 4.1.b
    text: |-
      indien de dieren bedrijfsmatig worden gehouden, aantekening te houden van het aantal op zijn bedrijf aanwezige
      dieren van deze soort, van de geboorte op, onderscheidenlijk toevoeging van dieren van deze soort aan zijn bedrijf,
      alsmede van de afvoer van dieren van deze soort van zijn bedrijf, één en ander onder vermelding van de gegevens
      waardoor de dieren kunnen worden geïdentificeerd en onder vermelding van naam en adres van degene van wie de dieren
      afkomstig zijn onderscheidenlijk aan wie de dieren zijn afgeleverd.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel4
  - number: '4.2'
    text: |-
      De in het eerste lid, onderdeel *b*, bedoelde aantekeningen dienen gedurende ten minste drie maanden te worden
      bewaard.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel4
  - number: '6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter voorkoming van verspreiding van smetstof regelen worden
      gesteld waaraan markten en andere verzamelplaatsen van dieren, slachterijen, inrichtingen waarin producten van
      dierlijke oorsprong worden gewonnen, be- of verwerkt, inrichtingen waarin diervoeder wordt bereid en plaatsen waar
      vervoermiddelen worden ontsmet moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel6
  - number: '7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter voorkoming van verspreiding van smetstof regelen worden
      gesteld ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel7
  - number: 7.a
    text: |-
      de reiniging en ontsmetting van stallen, kooien, vervoermiddelen, de daarbij behorende voorwerpen en andere
      plaatsen en voorwerpen waar of waarin dieren, produkten van dierlijke oorsprong, diervoeder alsmede andere
      produkten of voorwerpen die dragers van smetstof kunnen zijn, hebben verbleven;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel7
  - number: 7.b
    text: |-
      het behandelen van de in onderdeel *a* bedoelde produkten waardoor zij geen gevaar meer kunnen opleveren voor de
      verspreiding van smetstof dan wel het vernietigen van deze produkten en de in onderdeel *a* bedoelde voorwerpen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel7
  - number: '10.1'
    text: |-
      Onze Minister kan het brengen in Nederland van dieren, produkten van dierlijke oorsprong, alsmede van andere
      produkten en voorwerpen die dragers van smetstof kunnen zijn, verbieden dan wel verbieden, indien niet wordt
      voldaan aan door hem te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel10
  - number: '10.2'
    text: 'De in het eerste lid bedoelde regelen hebben in elk geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel10
  - number: 10.2.a
    text: de eisen waaraan de in het eerste lid bedoelde dieren, produkten of voorwerpen moeten voldoen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel10
  - number: 10.2.b
    text: de eisen waaraan de vervoermiddelen en de verpakkingen moeten voldoen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel10
  - number: 10.2.c
    text: het aanmelden van het voornemen om dieren, produkten of voorwerpen binnen te brengen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel10
  - number: 10.2.d
    text: |-
      het in overleg met Onze Minister van Financiën aanwijzen van douanekantoren in de zin van de wettelijke bepalingen,
      bedoeld in [artikel 2, tweede lid, onderdeel ][ref1], waar de dieren, produkten of voorwerpen, die anders dan over
      de Belgisch-Nederlandse of de Duits-Nederlandse grens worden binnengebracht, moeten worden aangebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel2
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '2'
  - number: 10.2.e
    text: |-
      het aanwijzen van de plaatsen waar dieren, produkten of voorwerpen, die via de Belgisch-Nederlandse of de Duits-
      Nederlandse grens worden binnengebracht, ter onderzoek moeten worden aangeboden;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel10
  - number: 10.2.f
    text: |-
      de verklaringen welke op het douanekantoor, dan wel op een plaats als bedoeld in onderdeel *e*, moeten worden
      overgelegd en de eisen waaraan deze verklaringen moeten voldoen en
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel10
  - number: 10.2.g
    text: het onderzoek na het binnenbrengen in Nederland.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister kan ten aanzien van in [artikel 10, eerste lid][ref1], bedoelde, in Nederland gebrachte dieren,
      produkten en voorwerpen onder meer regelen stellen betreffende:


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel10
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '10'
        hoofdstuk: II
        afdeling: '2'
  - number: 11.1.a
    text: 'met betrekking tot dieren:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel11
  - number: 11.1.a.1°
    text: een nader onderzoek, voorbehoedende behandeling of een tijdelijke afzondering;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel11
  - number: 11.1.a.2°
    text: het vervoer naar de plaats van onderzoek, voorbehoedende behandeling of tijdelijke afzondering;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel11
  - number: 11.1.a.3°
    text: de bestemming;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel11
  - number: 11.1.a.4°
    text: |-
      het vervoer naar de plaats van bestemming in Nederland dan wel naar de plaats waar de dieren weer buiten Nederland
      worden gebracht;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel11
  - number: 11.1.a.5°
    text: het doden of slachten en het toezicht daarop en de bestemming van de gedode of geslachte dieren;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel11
  - number: 11.1.b
    text: 'met betrekking tot produkten en voorwerpen:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel11
  - number: 11.1.b.1°
    text: een nader onderzoek;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel11
  - number: 11.1.b.2°
    text: de bestemming;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel11
  - number: 11.1.b.3°
    text: |-
      het vervoer naar de plaats van onderzoek of de plaats van bestemming dan wel naar de plaats waar de zaken weer
      buiten Nederland worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel11
  - number: '11.2'
    text: |-
      Regelen omtrent de in het eerste lid, onderdeel *a*, sub 5, genoemde onderwerpen, worden vastgesteld in
      overeenstemming met Onze Minister van Welzijn, Volksgezondheid en Cultuur.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel11
  - number: '12'
    text: |-
      Onze Minister kan voorts regelen stellen met betrekking tot de reiniging en ontsmetting van vervoermiddelen
      waarin en plaatsen waarop, alsmede met betrekking tot de reiniging, ontsmetting dan wel vernietiging van
      verpakkingsmateriaal waarin de in artikel 10, eerste lid, bedoelde, in Nederland gebrachte dieren, produkten en
      voorwerpen hebben verbleven.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel12
  - number: '13.1'
    text: |-
      Onze Minister kan bepalen, dat dieren die op grond van het bepaalde krachtens artikel 10 niet in Nederland hadden
      mogen worden gebracht zonder vergoeding van Staatswege en voor rekening van de importeur of diens gemachtigde
      binnen een door hem te bepalen termijn hetzij buiten Nederland moeten worden gebracht, hetzij onder door
      hem te stellen regelen naar een door hem aangewezen plaats moeten worden vervoerd en aldaar worden geslacht,
      onderscheidenlijk worden gedood en vernietigd.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel13
  - number: '13.2'
    text: |-
      Onze Minister kan bepalen, dat produkten en voorwerpen die op grond van het bepaalde krachtens artikel 10 niet in
      Nederland hadden mogen worden gebracht, binnen een door hem te bepalen termijn voor rekening van de importeur of
      diens gemachtigde hetzij buiten Nederland moeten worden gebracht, hetzij onder door hem te stellen regelen naar
      een door hem te bepalen plaats worden gebracht om aldaar voor rekening van de importeur of diens gemachtigde een
      behandeling te ondergaan waardoor zij geen gevaar meer opleveren voor de verspreiding van smetstof, hetzij zonder
      vergoeding van Staatswege en voor rekening van de importeur of diens gemachtigde worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel13
  - number: '14'
    text: |-
      De in deze afdeling bedoelde regelen kunnen onder meer verschillen naar gelang van het land van herkomst en naar
      gelang van de bestemming der dieren, produkten en voorwerpen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel14
  - number: '15.1'
    text: 'Deze afdeling is van toepassing op door Onze Minister aangewezen besmettelijke dierziekten bij:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel15
  - number: 15.1.a
    text: vee;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel15
  - number: 15.1.b
    text: pluimvee;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel15
  - number: 15.1.c
    text: bijen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel15
  - number: 15.1.d
    text: nertsen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel15
  - number: 15.1.e
    text: andere dieren behorende tot bij algemene maatregel van bestuur aangewezen soorten of categorieën van dieren;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel15
  - number: 15.1.f
    text: |-
      andere dieren van door Onze Minister voor een termijn van ten hoogste acht maanden aangewezen soorten of
      categorieën van dieren.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel15
  - number: '15.2'
    text: 'Een besmettelijke dierziekte kan worden aangewezen, indien:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel15
  - number: 15.2.a
    text: |-
      de ziekte zich snel kan uitbreiden, ernstige schade kan berokkenen aan de betrokken diersoort en niet of niet
      volledig kan worden voorkomen of bestreden met normale bedrijfsmiddelen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel15
  - number: 15.2.b
    text: |-
      de nakoming van een internationale overeenkomst of een besluit van een volkenrechtelijke organisatie zulks met zich
      brengt of
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel15
  - number: 15.2.c
    text: |-
      de ziekte naar het oordeel van Onze Minister van Welzijn, Volksgezondheid en Cultuur een ernstig gevaar voor de
      volksgezondheid oplevert.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel15
  - number: '15.3'
    text: |-
      In het geval bedoeld in het tweede lid, onderdeel *c*, vindt de aanwijzing plaats in overeenstemming met Onze
      Minister van Welzijn, Volksgezondheid en Cultuur.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel15
  - number: '15.4'
    text: Bij algemene maatregel van bestuur wordt bepaald wanneer dieren als verdachte dieren moeten worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel15
  - number: '16.1'
    text: |-
      Een aanwijzing als bedoeld in [artikel 15, eerste lid, onderdeel ][ref1], kan alleen plaatsvinden in spoedeisende
      gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: '16.2'
    text: |-
      Indien de aanwijzing tevens in het belang is van de volksgezondheid, vindt zij plaats in overeenstemming met Onze
      Minister van Welzijn, Volksgezondheid en Cultuur.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel16
  - number: '17.1'
    text: |-
      Onze Minister kan hetzij voor geheel Nederland, hetzij voor bepaalde gedeelten daarvan, bevelen dat dieren die
      door een besmettelijke dierziekte kunnen worden aangetast, daartegen op een door hem te bepalen wijze voorbehoedend
      worden behandeld, worden gemerkt, worden opgesloten of aangelijnd, dan wel voor die dieren andere maatregelen
      bevelen ter voorkoming van overbrenging van besmetting.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel17
  - number: '17.2'
    text: |-
      Indien de besmettelijke dierziekte is aangewezen in overeenstemming met Onze Minister van Welzijn, Volksgezondheid
      en Cultuur geeft Onze Minister de in het eerste lid bedoelde bevelen in overeenstemming met Onze Minister van
      Welzijn, Volksgezondheid en Cultuur.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel17
  - number: '18.1'
    text: 'Onze Minister kan, hetzij voor Nederland, hetzij voor bepaalde gedeelten daarvan:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel18
  - number: 18.1.a
    text: |-
      schorsing van markten waarop dieren van door hem aangewezen soorten of categorieën van dieren worden verhandeld
      en sluiting van diergaarden en daarmede vergelijkbare inrichtingen bevelen, dan wel markten, diergaarden of
      vergelijkbare inrichtingen verbieden indien niet wordt voldaan aan door hem te stellen regelen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel18
  - number: 18.1.b
    text: |-
      het op een plaats bijeenbrengen van dieren van door hem aangewezen soorten of categorieën van dieren afkomstig van
      verschillende plaatsen verbieden of daaromtrent regelen stellen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel18
  - number: '18.2'
    text: |-
      De regelen, bedoeld in het eerste lid, kunnen onder meer betrekking hebben op de aanvoer van dieren naar en de
      afvoer van dieren van markten en andere plaatsen waarop dieren afkomstig van verschillende plaatsen bijeen worden
      gebracht alsmede op de controle daarop, daaronder begrepen de verzegeling van vervoermiddelen en de afgifte van
      bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel18
  - number: '18.3'
    text: |-
      Indien een bevel of verbod, als bedoeld in het eerste lid, van kracht is, is het verboden dieren ten aanzien
      waarvan het bevel of verbod geldt, op de aldaar genoemde plaatsen aanwezig te hebben onderscheidenlijk aldaar
      aanwezig te hebben in strijd met de regelen bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel18
  - number: '19.1'
    text: |-
      Indien een dier verschijnselen van een besmettelijke dierziekte vertoont, geeft de houder hiervan terstond kennis
      aan de burgemeester van de gemeente waar het dier zich bevindt.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel19
  - number: '19.2'
    text: |-
      De burgemeester stelt een door Onze Minister aangewezen ambtenaar alsmede, voorzover de dierziekte is aangewezen
      in overeenstemming met Onze Minister van Welzijn, Volksgezondheid en Cultuur, een door Onze Minister van Welzijn,
      Volksgezondheid en Cultuur aangewezen ambtenaar, onmiddellijk op de hoogte indien zich in zijn gemeente een geval
      voordoet, als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel19
  - number: '20'
    text: |-
      Indien de houder van een dier vermoedt dat dat dier door een besmettelijke dierziekte is aangetast, dan wel indien
      de houder van een dier door een dierenarts of een in [artikel 114][ref1] bedoelde ambtenaar van een dergelijk
      vermoeden op de hoogte is gesteld, is hij verplicht aan deze naar waarheid alle inlichtingen te verstrekken en alle
      medewerking te verlenen, welke deze redelijkerwijs voor de vervulling van zijn taak nodig heeft en al datgene te
      doen wat in zijn vermogen ligt om de aard van de ziekte zo spoedig mogelijk te doen vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
        hoofdstuk: X
  - number: '21.1'
    text: |-
      Een door Onze Minister aangewezen ambtenaar deelt de burgemeester, zo nodig na overleg met het hoofd van de voor
      de provincie waar het geval zich heeft voorgedaan, door de stichting genoemd in [artikel 82][ref1] aangewezen of
      ingestelde gezondheidsdienst voor dieren, zo spoedig mogelijk mede welke maatregelen tot bestrijding van de ziekte
      door hem nodig worden geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel82
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '82'
        hoofdstuk: VIII
        afdeling: '1'
  - number: '21.2'
    text: De burgemeester neemt de nodig geachte maatregelen zo spoedig mogelijk.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel21
  - number: '21.3'
    text: |-
      In spoedeisende gevallen neemt de in het eerste lid bedoelde ambtenaar deze maatregelen zelf en stelt hij de
      burgemeester daarvan onmiddellijk in kennis.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel21
  - number: '22.1'
    text: |-
      De in [artikel 21][ref1] bedoelde maatregelen kunnen zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel21
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '21'
        hoofdstuk: II
        afdeling: '3'
  - number: 22.1.a
    text: het afzonderen van zieke en verdachte dieren;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel22
  - number: 22.1.b
    text: het opstallen of ophokken van zieke en verdachte dieren;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel22
  - number: 22.1.c
    text: het plaatsen van waarschuwingsborden;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel22
  - number: 22.1.d
    text: het door het plaatsen van kentekenen besmet of van besmetting verdacht verklaren van gebouwen en terreinen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel22
  - number: 22.1.e
    text: het merken van zieke, verdachte en herstelde dieren;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel22
  - number: 22.1.f
    text: het doden van zieke en verdachte dieren;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel22
  - number: 22.1.g
    text: |-
      het onschadelijk maken van gedode of gestorven, zieke en verdachte dieren, en van produkten en voorwerpen, die
      besmet zijn of ervan worden verdacht gevaar op te leveren voor verspreiding van smetstof;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel22
  - number: 22.1.h
    text: het reinigen en ontsmetten van gebouwen, terreinen, bewaarplaatsen van mest en voorwerpen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel22
  - number: 22.1.i
    text: het vastleggen of opsluiten van dieren;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel22
  - number: 22.1.j
    text: het behandelen van dieren op een door Onze Minister aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel22
  - number: '22.2'
    text: 'In afwijking van het bepaalde in het eerste lid kunnen bedoelde maatregelen met betrekking tot bijen bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel22
  - number: 22.2.a
    text: het ontsmetten van de bijenwoning en de naaste omgeving daarvan;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel22
  - number: 22.2.b
    text: het verbieden van het verplaatsen van een bijenwoning;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel22
  - number: 22.2.c
    text: het hechten van een kenteken aan de bijenwoning, waaruit blijkt dat deze niet mag worden verplaatst;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel22
  - number: 22.2.d
    text: het verbieden van het laten uitvliegen der bijen gedurende een bepaalde tijd;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel22
  - number: 22.2.e
    text: het plaatsen van geneesmiddelen in de bijenwoning;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel22
  - number: 22.2.f
    text: het vernietigen van besmette en van besmetting verdachte raten;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel22
  - number: 22.2.g
    text: |-
      het vernietigen van bijenvolken die besmet zijn of van besmetting verdacht worden, of die onmiddellijk gevaar lopen
      besmet te worden, al dan niet met de daarbij behorende woning;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel22
  - number: 22.2.h
    text: het behandelen van de bijen op een wijze die door wetenschap of praktijk als doeltreffend is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel22
  - number: '23.1'
    text: |-
      Onze Minister stelt het model van de in artikel 22 bedoelde waarschuwingsborden en kentekenen vast en stelt nadere
      regelen vast omtrent de wijze waarop de in dat artikel genoemde maatregelen worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel23
  - number: '23.2'
    text: |-
      De burgemeester van de betrokken gemeente verleent zijn medewerking bij het plaatsen en weer verwijderen van de
      waarschuwingsborden en kentekenen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel23
  - number: '24'
    text: |-
      Een door Onze Minister aangewezen ambtenaar stelt het tijdstip vast waarop de verdenking is ontstaan dat een dier
      lijdt aan een besmettelijke dierziekte alsmede het tijdstip waarop deze verdenking eindigt en stelt daarbij tevens
      vast welke op het bedrijf aanwezige dieren op het tijdstip waarop de verdenking is ontstaan reeds ziek waren en
      welke dieren op dat tijdstip van de ziekte verdacht waren.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel24
  - number: '25.1'
    text: |-
      Het is verboden dieren van bij of krachtens algemene maatregel van bestuur aangewezen soorten of categorieën van
      dieren, danwel bij of krachtens algemene maatregel van bestuur aangewezen produkten of voorwerpen te vervoeren van
      of naar gebouwen en terreinen, waar een kenteken, als bedoeld in [artikel 22, eerste lid][ref1], is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
        hoofdstuk: II
        afdeling: '3'
  - number: '25.2'
    text: |-
      De toegang tot gebouwen of terreinen, waar een kenteken, als bedoeld in [artikel 22, eerste lid][ref1], is
      geplaatst of door Onze Minister aangewezen gedeelten daarvan, is aan anderen dan door Onze Minister aan te wijzen
      personen of groepen van personen verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
        hoofdstuk: II
        afdeling: '3'
  - number: '25.3'
    text: |-
      Indien daardoor naar het oordeel van een door Onze Minister aangewezen ambtenaar geen gevaar voor verspreiding
      van smetstof ontstaat kan de burgemeester, op verzoek van de belanghebbende, ontheffing van het bepaalde in het
      eerste en tweede lid verlenen. Hij verleent de ontheffing onder de door Onze Minister nodig geachte beperkingen en
      verbindt daaraan de door Onze Minister nodig geachte voorschriften.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel25
  - number: '26.1'
    text: |-
      Het is verboden gebouwen of terreinen, waar een kenteken, als bedoeld in [artikel 22, eerste lid][ref1], is
      geplaatst te verlaten, tenzij na toepassing van de door Onze Minister voorgeschreven maatregelen van ontsmetting.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
        hoofdstuk: II
        afdeling: '3'
  - number: '26.2'
    text: De burgemeester stelt de middelen tot de in het eerste lid bedoelde ontsmetting ter beschikking.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel26
  - number: '27'
    text: |-
      De burgemeester kan een bevel uitvaardigen, dat de in zijn gemeente of in een bepaald gedeelte van zijn gemeente
      aanwezige dieren van door hem aangewezen soorten moeten worden vastgelegd of opgesloten.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel27
  - number: '28'
    text: |-
      In de gemeente of het gedeelte van de gemeente ten aanzien waarvan een bevel, als bedoeld in [artikel 27][ref1], is
      uitgevaardigd, mogen dieren van de door de burgemeester aangewezen soort, die niet zijn vastgelegd of opgesloten,
      op zijn last worden gedood.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel27
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '27'
        hoofdstuk: II
        afdeling: '3'
  - number: '29.1'
    text: |-
      Iedere houder van een ziek of verdacht dier is verplicht ervoor zorg te dragen, dat dit dier zijn verblijfplaats
      niet verlaat, tenzij met toestemming of krachtens bevel van een door Onze Minister aangewezen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel29
  - number: '29.2'
    text: De toestemming kan onder beperkingen worden verleend en daaraan kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel29
  - number: '30.1'
    text: |-
      Onze Minister kan het vervoeren van dieren van een door hem te bepalen soort, van deze diersoort afkomstige
      produkten, diervoeder alsmede andere produkten en voorwerpen welke dragers van smetstof kunnen zijn, uit, naar of
      binnen Nederland of bepaalde gedeelten van Nederland verbieden dan wel verbieden indien niet wordt voldaan aan door
      hem te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel30
  - number: '30.2'
    text: |-
      Een door Onze Minister aangewezen ambtenaar is bevoegd het vervoeren van dieren van een door hem te bepalen soort
      te verbieden in een gebied met een straal van 10 km of minder rondom een gebouw of terrein, dat door het plaatsen
      van een kenteken, als bedoeld in [artikel 22, eerste lid][ref1], besmet of van zodanige besmetting verdacht is
      verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
        hoofdstuk: II
        afdeling: '3'
  - number: '30.3'
    text: Rondom het krachtens het eerste of tweede lid aangewezen gebied worden waarschuwingsborden geplaatst.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel30
  - number: '30.4'
    text: |-
      Onze Minister kan voor het krachtens het eerste lid aangewezen gebied het bij [artikel 29][ref1] bepaalde van
      overeenkomstige toepassing verklaren ten aanzien van gezonde dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel29
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '29'
        hoofdstuk: II
        afdeling: '3'
  - number: '31'
    text: |-
      Indien in het belang van de bestrijding van besmettelijke dierziekten naar het oordeel van Onze Minister een
      onverwijlde voorziening noodzakelijk is, kan hij bepalen dat door hem krachtens dit hoofdstuk vastgestelde
      regelingen onmiddellijk na hun bekendmaking in werking treden. In dat geval kan hij zodanige regeling, in afwijking
      van het bepaalde in [artikel 4, eerste lid, van de Bekendmakingswet][ref1] (*Stb.* 1988, 18), op andere dan de daar
      genoemde wijze bekend maken.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel4
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '4'
  - number: '32'
    text: |-
      Bij het stellen van regelen en het voorschrijven van maatregelen krachtens dit hoofdstuk kan worden afgeweken van
      het bepaalde bij of krachtens de [Meststoffenwet][ref1] en de [Flora- en faunawet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0009640
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0009640
  - number: '34.1'
    text: |-
      Het is verboden dieren met het oog op de produktie van van die dieren afkomstige produkten te houden, tenzij deze
      behoren tot bij algemene maatregel van bestuur aangewezen soorten of categorieën daarvan.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel34
  - number: '35.1'
    text: |-
      Bij algemene maatregel van bestuur worden regelen gesteld omtrent de wijze waarop dieren van bij die maatregel
      aangewezen soorten of categorieën van dieren mogen worden gehouden.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel35
  - number: '35.2'
    text: 'De krachtens het eerste lid gestelde regelen kunnen onder meer betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel35
  - number: 35.2.a
    text: het vastleggen of aangebonden houden van dieren;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel35
  - number: 35.2.b
    text: het gescheiden houden van dieren van verschillende leeftijd, geslacht of soort;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel35
  - number: 35.2.c
    text: de ruimte waarover dieren moeten kunnen beschikken.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel35
  - number: '36.1'
    text: |-
      Het is verboden om zonder redelijk doel of met overschrijding van hetgeen ter bereiking van zodanig doel
      toelaatbaar is, bij een dier pijn of letsel te veroorzaken dan wel de gezondheid of het welzijn van een dier te
      benadelen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel36
  - number: '36.2'
    text: 'Tot de in het eerste lid verboden gedragingen worden in ieder geval gerekend:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel36
  - number: 36.2.a
    text: |-
      een dier arbeid doen verrichten, welke kennelijk zijn krachten te boven gaat of waartoe het uit hoofde van zijn
      toestand ongeschikt is;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel36
  - number: 36.2.b
    text: een koe met overvolle uier vervoeren of op een markt of openbare verkoping ten verkoop houden;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel36
  - number: 36.2.c
    text: |-
      bij de verlossing van een koe gebruik te maken van dierlijke trekkracht of van een niet door Onze Minister daarvoor
      toegelaten krachttoestel;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel36
  - number: 36.2.d
    text: een hond als trekkracht gebruiken.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel36
  - number: '36.3'
    text: Een ieder is verplicht hulpbehoevende dieren de nodige zorg te verlenen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel36
  - number: '37'
    text: Het is de houder van een dier verboden aan een dier de nodige verzorging te onthouden.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel37
  - number: '38'
    text: |-
      Bij algemene maatregel van bestuur worden voor bij die maatregel aangewezen categorieën van houders van dieren van
      bij die maatregel aangewezen soorten of categorieën van dieren regelen gesteld omtrent de verzorging, voedering,
      drenking, behandeling en het africhten van dieren.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel38
  - number: '39'
    text: |-
      Het is verboden dieren van bij algemene maatregel van bestuur aangewezen soorten of categorieën van dieren van het
      ouderdier te scheiden voordat die dieren een bij die maatregel vastgestelde leeftijd hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel39
  - number: '40.1'
    text: |-
      Het is verboden een of meer lichamelijke ingrepen bij een dier te verrichten, waarbij een deel of delen van het
      lichaam wordt of worden verwijderd of beschadigd.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel40
  - number: '40.2'
    text: 'Het bepaalde in het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel40
  - number: 40.2.a
    text: ingrepen betreffende het onvruchtbaar maken van een dier;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel40
  - number: 40.2.b
    text: ingrepen waarvoor een diergeneeskundige noodzaak bestaat;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel40
  - number: 40.2.c
    text: bij algemene maatregel van bestuur aangewezen ingrepen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel40
  - number: 40.2.d
    text: overige bij of krachtens enig wettelijk voorschrift verplichte dan wel toegestane ingrepen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel40
  - number: '40.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de wijze waarop en de gevallen waarin de
      lichamelijke ingrepen, bedoeld in het tweede lid, onderdelen *c* en *d*, slechts mogen worden verricht.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel40
  - number: '41.1'
    text: |-
      Het is verboden deel te nemen aan tentoonstellingen, keuringen of wedstrijden met dieren waarbij een bij artikel 40
      verboden ingreep is verricht.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel41
  - number: '41.2'
    text: |-
      Het is verboden dieren waarbij een bij artikel 40 verboden ingreep is verricht, tot een tentoonstelling, keuring of
      wedstrijd toe te laten.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel41
  - number: '41.3'
    text: |-
      Het ten verkoop in voorraad hebben, ten verkoop aanbieden, verkopen en kopen van dieren waarbij een bij artikel 40
      verboden ingreep is verricht, is verboden.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel41
  - number: '42'
    text: |-
      Bij algemene maatregel van bestuur worden regelen gesteld omtrent embryotransplantatie bij dieren van bij die
      maatregel aangewezen soorten of categorieën van dieren.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel42
  - number: '44.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regelen gesteld omtrent het doden van dieren van bij die
      maatregel aangewezen soorten of categorieën van dieren.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel44
  - number: '44.2'
    text: |-
      De krachtens het eerste lid gestelde regelen hebben in ieder geval betrekking op: - de wijze waarop, de situaties
      waarin en de personen door wie dieren mogen worden gedood;
        - de bedwelming van slachtdieren;
        - de bedrijfsuitrusting en installatie in slachterijen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel44
  - number: '44.3'
    text: |-
      Het slachten van dieren zonder voorafgaande bedwelming volgens de israëlitische of de islamitische ritus is
      toegestaan.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel44
  - number: '44.4'
    text: |-
      Het slachten, bedoeld in het derde lid, mag slechts geschieden in door Onze Minister, in overeenstemming met Onze
      Minister van Welzijn, Volksgezondheid en Cultuur aan te wijzen inrichtingen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel44
  - number: '44.5'
    text: 'Een aanwijzing als bedoeld in het vierde lid vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel44
  - number: 44.5.a
    text: |-
      indien het betreft het slachten volgens de israëlitische ritus: op verzoek van de Permanente Commissie tot de
      Algemene Zaken van het Nederlands-Israëlitisch Kerkgenootschap;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel44
  - number: 44.5.b
    text: |-
      indien het betreft het slachten volgens de islamitische ritus: op verzoek van één of meer organisaties die geacht
      kunnen worden alle of een bepaalde groep islamieten in Nederland te vertegenwoordigen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel44
  - number: '44.6'
    text: |-
      Een aanwijzing als bedoeld in het vierde lid vindt voorts plaats op verzoek van een israëlitische of islamitische
      groepering in een ander land, waarmee wordt ingestemd door de in het vijfde lid, onderdeel *a*, genoemde commissie,
      onderscheidenlijk de in onderdeel *b* bedoelde organisaties indien in het verzoek wordt aangetoond dat bij
      die israëlitische of islamitische groepering behoefte bestaat aan de import van vlees afkomstig van volgens de
      desbetreffende ritus geslachte dieren.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel44
  - number: '44.7'
    text: |-
      Onze Minister stelt, in overeenstemming met Onze Minister van Welzijn, Volksgezondheid en Cultuur en in overleg met
      de aangewezen inrichting en
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel44
  - number: 44.7.a
    text: |-
      voor zover het betreft de behoefte aan vlees, afkomstig van volgens de israëlitische ritus geslachte dieren: in
      overleg met de Permanente Commissie tot de Algemene Zaken van het Nederlands-Israëlitisch Kerkgenootschap, of
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel44
  - number: 44.7.b
    text: |-
      voor zover het betreft de behoefte aan vlees, afkomstig van volgens de islamitische ritus geslachte dieren: in
      overleg met de in het vijfde lid, onderdeel *b*, bedoelde organisaties,
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel44
  - number: '44.8'
    text: 'Het slachten zonder voorafgaande bedwelming mag slechts geschieden:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel44
  - number: 44.8.a
    text: |-
      voor zover het betreft het slachten volgens de israëlitische ritus: door personen die daartoe door het
      Opperrabbinaat voor Nederland zijn gemachtigd, en
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel44
  - number: 44.8.b
    text: |-
      voor zover het betreft het slachten volgens de islamitische ritus: door personen die daartoe door de in het vijfde
      lid, onderdeel *b*, bedoelde organisaties zijn aangewezen, mits die personen daarvan door een schriftelijk bewijs
      aan de keuringsdierenarts hebben doen blijken.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel44
  - number: '44.9'
    text: |-
      Bij algemene maatregel van bestuur worden in het belang van de bescherming van het slachtdier regelen gesteld
      omtrent het slachten volgens de israëlitische of de islamitische ritus.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel44
  - number: '44.10'
    text: |-
      Een voordracht voor een algemene maatregel van bestuur als bedoeld in het negende lid wordt Ons gedaan door Onze
      Minister en Onze Minister van Welzijn, Volksgezondheid en Cultuur.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel44
  - number: '45.1'
    text: |-
      Onverminderd het bepaalde krachtens artikel 35 kunnen bij algemene maatregel van bestuur voor daarbij aan te wijzen
      categorieën van houders van dieren van bij die maatregel aangewezen soorten of categorieën van dieren regelen
      worden gesteld omtrent de huisvesting van dieren.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel45
  - number: '45.2'
    text: |-
      De krachtens het eerste lid gestelde regelen kunnen onder meer betrekking hebben op: - de afmetingen en
      uitvoeringen van kooien, hokken en stallen alsmede hun vormgeving;
        - de aard van de wanden en van het vloer- en grondoppervlak van kooien, hokken en stallen, in het bijzonder de
      daarvoor te gebruiken materialen;
        - de inrichting van kooien, hokken en stallen, in het bijzonder de daarin aan te brengen voeder- en
      drinkwatervoorzieningen alsook voorzieningen die het voor de dieren mogelijk maken om soorteigen gedrag te
      ontplooien;
        - de verlichting, luchtverversing en verwarming van kooien, hokken en stallen;
        - de aanwezigheid en de aard van afrasteringen;
        - de voorzieningen binnen huisvestingssystemen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel45
  - number: '45.3'
    text: |-
      Bij algemene maatregel van bestuur kan het ten verkoop in voorraad hebben, verkopen en afleveren van daarbij aan
      te wijzen huisvestingssystemen, onderdelen daarvan of voorzieningen binnen huisvestingssystemen worden verboden dan
      wel slechts worden toegestaan voor zover die systemen, onderdelen of voorzieningen voldoen aan bij die maatregel
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel45
  - number: '45.4'
    text: |-
      Indien Onze Minister overweegt een voordracht te doen tot vaststelling, wijziging of intrekking van een algemene
      maatregel van bestuur als bedoeld in het eerste of derde lid kan hij, indien het belang van het welzijn van dieren
      naar zijn oordeel een onmiddellijke voorziening vereist regelen stellen overeenkomstig de in overweging zijnde
      maatregel.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel45
  - number: '45.5'
    text: |-
      Een regeling als bedoeld in het vierde lid blijft, behoudens eerdere intrekking, van kracht totdat de daar bedoelde
      algemene maatregel van bestuur in werking treedt, doch uiterlijk tot acht maanden na het in werking treden van
      de regeling.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel45
  - number: '45.6'
    text: |-
      Tenzij bij een maatregel als bedoeld in het eerste of derde lid of een regeling als bedoeld in het vierde lid
      anders wordt bepaald, is het bepaalde bij of krachtens de artikelen 46 tot en met 54 niet van toepassing in het
      geval voor de dieren van de aangewezen soort of categorie van dieren bij die maatregel of regeling, regelen zijn
      gesteld omtrent de huisvesting.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel45
  - number: '55.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regelen gesteld omtrent het fokken met dieren van bij die
      maatregel aangewezen soorten of categorieën van dieren. Deze regelen kunnen onder meer betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel55
  - number: 55.1.a
    text: de methode van fokken;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel55
  - number: 55.1.b
    text: het registreren, identificeren en certificeren van dieren;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel55
  - number: 55.1.c
    text: |-
      het voorafgaand aan het fokken door de fokker te verrichten of te doen verrichten onderzoek bij een dier waarmee
      wordt gefokt naar de aanwezigheid van aandoeningen die de gezondheid of het welzijn van het dier of de nakomelingen
      van het dier kunnen aantasten, alsmede de methoden die daarbij worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel55
  - number: '55.2'
    text: |-
      Bij algemene maatregel van bestuur kan het worden verboden een dier dat beschikt over één of meer aangewezen
      aandoeningen of uiterlijke kenmerken die de gezondheid of het welzijn van het dier of de nakomelingen van het dier
      kunnen aantasten te fokken of voor de fok te gebruiken.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel55
  - number: '55.3'
    text: |-
      Bij algemene maatregel van bestuur kan het worden verboden een dier dat beschikt over één of meer aangewezen
      aandoeningen of uiterlijke kenmerken waarvoor krachtens het tweede lid een fokverbod is ingesteld, ten verkoop in
      voorraad te hebben, ten verkoop aan te bieden, te verkopen, te kopen, toe te laten tot een tentoonstelling, keuring
      of wedstrijd dan wel om met een dergelijk dier deel te nemen aan een tentoonstelling, keuring of wedstrijd.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel55
  - number: '57'
    text: |-
      Het is verboden dieren als prijs, beloning of gift uit te loven of uit te reiken bij wedstrijden, verlotingen,
      weddenschappen of andere dergelijke evenementen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel57
  - number: '58.1'
    text: |-
      Het is verboden dieren behorende tot bij algemene maatregel van bestuur aangewezen soorten of categorieën van
      dieren in te laden voor vervoer naar het buitenland dan wel naar het buitenland te vervoeren, zonder dat de dieren:
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel58
  - number: 58.1.a
    text: |-
      vergezeld gaan van een daartoe door een door Onze Minister aangewezen ambtenaar afgegeven certificaat, waarin deze
      verklaart dat hij de dieren geschikt heeft bevonden voor vervoer naar het buitenland, en
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel58
  - number: 58.1.b
    text: |-
      voorzien zijn onderscheidenlijk vergezeld gaan van de in het certificaat vermelde identificatiemerken
      onderscheidenlijk bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel58
  - number: '58.2'
    text: |-
      Het bepaalde in het eerste lid is slechts van toepassing op ander vervoer dan vervoer dat geschiedt in de
      uitoefening van of ten behoeve van een beroep, onderneming of bedrijf, voor zover zulks bij algemene maatregel van
      bestuur is bepaald.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel58
  - number: '58.3'
    text: |-
      Het in het eerste lid gestelde verbod geldt niet voor wat betreft het vervoeren naar het buitenland van dieren die
      niet hier te lande zijn ingeladen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel58
  - number: '58.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regelen worden gesteld ter uitvoering van het in het
      eerste lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel58
  - number: '59.1'
    text: |-
      De door Onze Minister aangewezen ambtenaar geeft het in artikel 58 bedoelde certificaat slechts af nadat hij de
      dieren vóór het inladen heeft onderzocht.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel59
  - number: '59.2'
    text: 'De in het eerste lid bedoelde ambtenaar geeft het certificaat niet af:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel59
  - number: 59.2.a
    text: |-
      indien de dieren niet deugdelijk voorzien zijn, onderscheidenlijk niet vergezeld gaan, van de in artikel 58, eerste
      lid, onderdeel *b*, bedoelde merken of bewijsstukken;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel59
  - number: 59.2.b
    text: indien de dieren binnen 48 uren vóór de aanvang van het vervoer hebben geworpen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel59
  - number: 59.2.c
    text: indien hij het waarschijnlijk acht, dat de dieren tijdens het vervoer zullen werpen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel59
  - number: 59.2.d
    text: |-
      indien hij overigens de dieren niet geschikt acht voor vervoer naar het buitenland, mede in aanmerking genomen
      de aard van de vervoermiddelen, de aard, wijze of duur van het vervoer of de omstandigheden waaronder het vervoer
      plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel59
  - number: 59.2.e
    text: |-
      indien naar zijn oordeel niet voldoende zekerheid bestaat, dat het bij of krachtens deze afdeling bepaalde bij het
      vervoer in acht zal worden genomen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel59
  - number: '59.3'
    text: |-
      Een door Onze Minister aangewezen ambtenaar kan van degene die een certificaat, bedoeld in artikel 58, onder zich
      heeft de teruggave daarvan vorderen, indien zich naar zijn oordeel omstandigheden voordoen of bekend zijn geworden
      van dien aard dat, zo deze ten tijde van de afgifte van het certificaat hadden bestaan of bekend waren geweest, die
      afgifte niet zou hebben plaatsgehad.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel59
  - number: '59.4'
    text: |-
      Degene die vervoert, is verplicht de certificaten en bewijsstukken, bedoeld in artikel 58, tijdens het vervoer in
      het vervoermiddel aanwezig te hebben.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel59
  - number: '60.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regelen gesteld omtrent het vervoer van dieren van bij die
      maatregel aangewezen soorten of categorieën van dieren.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel60
  - number: '60.2'
    text: 'De krachtens het eerste lid gestelde regelen kunnen onder meer betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel60
  - number: 60.2.a
    text: |-
      de vervoermiddelen die ten behoeve van het vervoeren van dieren worden gebruikt of daartoe kennelijk bestemd zijn,
      alsook hun uitrusting en inrichting;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel60
  - number: 60.2.b
    text: |-
      kooien, kisten, kratten, dozen en dergelijke voorwerpen welke ten behoeve van het vervoer van dieren worden
      gebruikt of daartoe kennelijk bestemd zijn;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel60
  - number: 60.2.c
    text: de beladingsdichtheid van vervoermiddelen als bedoeld in onderdeel *a*;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel60
  - number: 60.2.d
    text: het in- en uitladen van dieren;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel60
  - number: 60.2.e
    text: de duur en de afstand van het vervoer.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel60
  - number: '61.1'
    text: Het is verboden om dierengevechten te organiseren of dieren aan dierengevechten te doen deelnemen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel61
  - number: '62.1'
    text: |-
      Onze Minister kan substanties aanwijzen die het kunstmatig beïnvloeden van het prestatievermogen van dieren in
      wedstrijden tot gevolg kunnen hebben.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel62
  - number: '62.2'
    text: |-
      Het is verboden een dier ingeschreven te hebben voor een wedstrijd of met een dier deel te nemen aan een wedstrijd,
      indien bij een onderzoek blijkt dat in het lichaam van dat dier een hoeveelheid van een of meer van de krachtens
      het eerste lid aangewezen substanties, bestanddelen daarvan of omzettingsprodukten aanwezig is, welke groter is dan
      een door Onze Minister vastgestelde hoogst toelaatbare hoeveelheid. Deze hoeveelheid kan op nul worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel62
  - number: '62.3'
    text: |-
      In de krachtens het tweede lid vastgestelde hoeveelheid is mede begrepen de in voorkomend geval uit anderen
      hoofde in het lichaam van het dier aanwezige hoeveelheid van dezelfde substantie, bestanddeel daarvan of
      omzettingsprodukt.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel62
  - number: '62.4'
    text: Onze Minister kan de aard en de wijze van uitvoering van het in het tweede lid bedoelde onderzoek voorschrijven.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel62
  - number: '63.1'
    text: |-
      Het is verboden een of meer van de krachtens artikel 62, eerste lid, aangewezen substanties toe te passen op dieren
      die zijn ingeschreven voor een wedstrijd.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel63
  - number: '63.2'
    text: |-
      Het in het eerste lid bedoelde verbod is niet van toepassing op dierenartsen die ten genoegen van de ambtenaren die
      door Onze Minister met het toezicht op de naleving van deze afdeling zijn belast, aantonen dat die dieren niet aan
      de wedstrijd zullen deelnemen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel63
  - number: '63.3'
    text: |-
      Het is verboden op wedstrijdterreinen of op nader door Onze Minister aangewezen plaatsen een of meer van de
      krachtens artikel 62, eerste lid, aangewezen substanties aanwezig te hebben.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel63
  - number: '63.4'
    text: |-
      Het derde lid is niet van toepassing op dierenartsen die ten genoegen van de in het tweede lid bedoelde ambtenaren
      aantonen dat de substanties niet zijn of worden gebruikt bij dieren die nog moeten deelnemen aan de wedstrijd.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel63
  - number: '64'
    text: |-
      In het belang van een doelmatige handhaving van deze afdeling kan Onze Minister regelen stellen met betrekking
      tot de organisatie van wedstrijden en de inrichting van wedstrijdterreinen. Daarbij kan worden bepaald dat de
      organisatie van nader aan te wijzen wedstrijden slechts is toegestaan aan instellingen die:
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel64
  - number: 64.a
    text: |-
      in hun statuten hebben bepaald dat overtreding van het bepaalde in deze afdeling aan intern tuchtrecht is
      onderworpen, tenzij de officier van justitie beslist dat een overtreding strafrechtelijk zal worden afgedaan;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel64
  - number: 64.b
    text: |-
      met betrekking tot de onder hun verantwoordelijkheid georganiseerde wedstrijden nader aan te wijzen werkzaamheden
      in het kader van het verlenen van bijstand aan het toezicht op de naleving van deze afdeling verrichten.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel64
  - number: '66.1'
    text: 'Het is zonder vergunning verboden:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel66
  - number: 66.1.a
    text: |-
      het genetisch materiaal van dieren te wijzigen op een wijze die voorbij gaat aan de natuurlijke barrières van
      geslachtelijke voortplanting en van recombinatie;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel66
  - number: 66.1.b
    text: biotechnologische technieken bij een dier of een embryo toe te passen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel66
  - number: '66.2'
    text: |-
      Op een aanvraag voor een vergunning als bedoeld in het eerste lid beslist Onze Minister, gehoord de Commissie
      biotechnologie bij dieren, bedoeld in artikel 69.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel66
  - number: '66.3'
    text: 'Een vergunning als bedoeld in het eerste lid wordt slechts verleend indien naar het oordeel van Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel66
  - number: 66.3.a
    text: de handelingen geen onaanvaardbare gevolgen hebben voor de gezondheid of het welzijn van dieren en
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel66
  - number: 66.3.b
    text: tegen de handelingen geen ethische bezwaren bestaan.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel66
  - number: '66.4'
    text: In de vergunning wordt bepaald voor welke handelingen zij is bedoeld.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel66
  - number: '66.5'
    text: Aan een vergunning kunnen voorschriften worden verbonden. Een vergunning kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel66
  - number: '67.1'
    text: 'Bij een aanvraag voor een vergunning als bedoeld in artikel 66 dient in ieder geval te worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel67
  - number: 67.1.a
    text: een overzicht van de handelingen welke de aanvrager voornemens is te verrichten dan wel te laten verrichten;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel67
  - number: 67.1.b
    text: |-
      een door of vanwege de aanvrager opgestelde rapportage ter zake van de effecten van de handelingen op dieren,
      waaronder begrepen de gezondheid en het welzijn van dieren.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel67
  - number: '67.2'
    text: |-
      Onze Minister stelt regelen omtrent het indienen van een aanvraag en omtrent de behandeling daarvan. Daarbij kan
      onder meer worden bepaald:
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel67
  - number: 67.2.a
    text: welke gegevens en bescheiden moeten worden overgelegd alvorens een aanvraag in behandeling kan worden genomen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel67
  - number: 67.2.b
    text: dat een aanvraag eerst in behandeling wordt genomen nadat een daarvoor vastgesteld bedrag is voldaan;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel67
  - number: 67.2.c
    text: welke kosten van het onderzoek, voortvloeiend uit een aanvraag, ten laste van de aanvrager worden gebracht;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel67
  - number: 67.2.d
    text: in welke gevallen een aanvraag voor een vergunning niet ontvankelijk wordt verklaard.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel67
  - number: '68.1'
    text: |-
      Het bepaalde in artikel 66, eerste lid, is niet van toepassing op bij algemene maatregel van bestuur aangewezen
      handelingen voor zover deze handelingen worden uitgevoerd overeenkomstig bij die maatregel gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel68
  - number: '68.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat geen vergunning als bedoeld in artikel 66, eerste lid,
      wordt verleend voor bij die maatregel aangewezen handelingen met betrekking tot dieren van bij die maatregel
      aangewezen soorten of categorieën van dieren indien:
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel68
  - number: 68.2.a
    text: de handelingen onaanvaardbare gevolgen hebben voor de gezondheid of het welzijn van dieren of
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel68
  - number: 68.2.b
    text: tegen die handelingen ethische bezwaren bestaan.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel68
  - number: '69.1'
    text: |-
      Er is een Commissie biotechnologie bij dieren die is belast met de advisering van Onze Minister over de verlening
      van vergunning als bedoeld in artikel 66 en de intrekking daarvan.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel69
  - number: '69.2'
    text: |-
      Bij algemene maatregel van bestuur worden regelen gesteld omtrent onder meer de samenstelling en de werkwijze van
      de commissie, bedoeld in het eerste lid. Deze regelen hebben mede betrekking op de zittingsduur, de schorsing en
      het ontslag van de leden van de commissie.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel69
  - number: '70'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regelen gesteld omtrent de procedure van voorbereiding van
      beslissingen omtrent de verlening, wijziging of intrekking van vergunningen als bedoeld in artikel 66.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel70
  - number: '71'
    text: |-
      Van een verlening van een vergunning als bedoeld in artikel 66 of de intrekking daarvan wordt mededeling gedaan in
      de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel71
  - number: '72'
    text: |-
      Onze Minister kan in ieder geval een vergunning met onmiddellijke ingang schorsen, wijzigen dan wel intrekken
      indien:
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel72
  - number: 72.a
    text: |-
      de bij de aanvraag verstrekte gegevens zodanig onjuist of onvolledig blijken te zijn, dat op de aanvraag een andere
      beslissing zou zijn genomen, indien bij de beoordeling daarvan de juiste gegevens bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel72
  - number: 72.b
    text: |-
      na de verlening van de vergunning is gebleken van feiten en omstandigheden die, waren zij bekend op het moment van
      de verlening van de vergunning, aanleiding zouden zijn geweest om de aanvraag te wijzigen dan wel af te wijzen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel72
  - number: 72.c
    text: de vergunning in strijd met wettelijke voorschriften is verleend of
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel72
  - number: 72.d
    text: |-
      in strijd wordt gehandeld met de aan de vergunning verbonden voorschriften of met de beperkingen waaronder de
      vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel72
  - number: '73.1'
    text: |-
      Het is verboden dieren, behorende tot door Onze Minister aangewezen soorten of categorieën van dieren te fokken, in
      Nederland te brengen, te koop aan te bieden of te verkopen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel73
  - number: '73.2'
    text: |-
      Het is verboden dieren behorende tot ingevolge het eerste lid aangewezen soorten of categorieën van dieren
      voorhanden te hebben.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel73
  - number: '73.3'
    text: |-
      Ingevolge het eerste lid worden slechts aangewezen soorten of categorieën, waarvan de dieren een gevaar kunnen
      opleveren voor de veiligheid van mens of dier.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel73
  - number: '74.1'
    text: |-
      De burgemeester van de gemeente waar een dier dat in strijd met het bepaalde in artikel 73 is gefokt of voorhanden
      wordt gehouden, zich bevindt, kan bepalen dat dat dier naar een nader door hem aangewezen plaats moet worden
      vervoerd en aldaar moet worden gedood.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel74
  - number: '74.2'
    text: |-
      De burgemeester legt een maatregel als bedoeld in het eerste lid, voor zover het betreft het doden van het dier,
      niet ten uitvoer indien binnen zes weken, nadat de desbetreffende beschikking aan de houder van het dier is
      bekendgemaakt, de houder een verzoek als bedoeld in [artikel 8:81 van de Algemene wet bestuursrecht][ref1] heeft
      ingediend en op dat verzoek niet afwijzend is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '75'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder stamboek: boek, register, kaartsysteem of andere
      informatiedrager, bijgehouden door een door Onze Minister erkende instelling, waarin vee van een bepaald ras wordt
      ingeschreven of geregistreerd met vermelding van het voorgeslacht.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel75
  - number: '76.1'
    text: |-
      Onverminderd het bepaalde bij artikel 55 worden ter bevordering van de raszuiverheid of ter verbetering van de
      raskenmerken bij of krachtens algemene maatregel van bestuur regelen gesteld omtrent het fokken met dieren van bij
      algemene maatregel van bestuur aangewezen veesoorten.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel76
  - number: '76.2'
    text: 'De in het eerste lid bedoelde regelen kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel76
  - number: 76.2.a
    text: de voorwaarden voor de erkenning door Onze Minister van instellingen, die stamboeken bijhouden;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel76
  - number: 76.2.b
    text: de eisen, waaraan dieren moeten voldoen om voor inschrijving in een stamboek in aanmerking te komen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel76
  - number: 76.2.c
    text: de certificaten, die worden afgegeven ten bewijze van de inschrijving van dieren in een stamboek;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel76
  - number: 76.2.d
    text: het keuren van dieren;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel76
  - number: 76.2.e
    text: |-
      de methoden, die worden gebruikt bij onderzoek naar en de beoordeling van de prestaties en de genetische waarde
      van dieren;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel76
  - number: 76.2.f
    text: de handel in sperma, eicellen en embryo's;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel76
  - number: 76.2.g
    text: de voorwaarden voor toelating van fokdieren tot de voortplanting.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel76
  - number: '77.1'
    text: Het anders dan in doorvoer brengen van vee of pluimvee buiten Nederland is verboden.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel77
  - number: '77.2'
    text: |-
      Het in het eerste lid vermelde verbod geldt niet indien de dieren overeenkomstig door Onze Minister gestelde
      regelen zijn voorzien van een of meer merken en vergezeld gaan van een of meer bewijsstukken aangebracht
      onderscheidenlijk afgegeven op grond van een van Rijkswege ingesteld onderzoek ten bewijze dat voldaan is aan de
      met het oog op deze uitvoer door hem gestelde eisen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel77
  - number: 77.2.a
    text: de identificatie der dieren;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel77
  - number: 77.2.b
    text: de gezondheidstoestand der dieren;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel77
  - number: 77.2.c
    text: de voorbehoedende behandeling der dieren;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel77
  - number: 77.2.d
    text: de bedrijven waarop de dieren hebben verbleven en de gezondheidstoestand der dieren op die bedrijven;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel77
  - number: 77.2.e
    text: de markten waarop de dieren zijn aangekocht en de plaatsen waarop de dieren zijn verzameld;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel77
  - number: 77.2.f
    text: de vervoermiddelen alsmede de inlading en het vervoer der dieren;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel77
  - number: 77.2.g
    text: |-
      andere onderwerpen, voor zover de nakoming van internationale overeenkomsten of van volkenrechtelijke organisaties
      zulks met zich brengt.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel77
  - number: '77.3'
    text: 'Ter uitvoering van het bepaalde in het tweede lid kan Onze Minister voorts regelen stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel77
  - number: 77.3.a
    text: de plaatsen waar, alsmede de tijdruimten waarbinnen vee en pluimvee ter onderzoek kunnen worden aangeboden;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel77
  - number: 77.3.b
    text: de wijze waarop de dieren voor het onderzoek bedoeld in onderdeel *c* moeten worden aangeboden;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel77
  - number: 77.3.c
    text: het onderzoek;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel77
  - number: 77.3.d
    text: de wijze waarop het in het tweede lid bedoelde bewijsstuk kan worden verkregen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel77
  - number: 77.3.e
    text: het toezicht.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel77
  - number: '78'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan het anders dan in doorvoer buiten Nederland brengen van andere
      dan in artikel 77, eerste lid, bedoelde dieren van bij die maatregel aangewezen soorten of categorieën van dieren
      en bij die maatregel aangewezen produkten van dierlijke oorsprong worden verboden, tenzij de zending overeenkomstig
      daartoe gestelde regelen voorzien is van een of meer merken en vergezeld gaat van een of meer bewijsstukken
      aangebracht onderscheidenlijk afgegeven op grond van een van Rijkswege ingesteld onderzoek, ten bewijze dat voldaan
      is aan de met het oog op de uitvoer bij of krachtens die maatregel gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel78
  - number: '79.1'
    text: |-
      In verband met door landen van bestemming gestelde eisen op veterinair gebied kan degene die dieren en produkten
      van dierlijke oorsprong anders dan in doorvoer buiten Nederland wil brengen, verzoeken een onderzoek van Rijkswege
      in te stellen, alsmede merken aan te brengen of bewijsstukken af te geven, ten bewijze dat voldaan is aan door die
      andere landen gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel79
  - number: '79.2'
    text: Onze Minister kan omtrent de uitvoering van de in het eerste lid bedoelde onderzoeken nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel79
  - number: '80'
    text: |-
      Indien er gevaar bestaat voor overbrenging van een in Nederland opgetreden besmettelijke dierziekte kan Onze
      Minister het buiten Nederland brengen van dieren en dierlijke produkten afkomstig uit Nederland of een door hem te
      bepalen gedeelte daarvan verbieden dan wel verbieden indien niet voldaan wordt aan door hem te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel80
  - number: '81.1'
    text: |-
      De eisen en regelen, bedoeld in de artikelen 77 tot en met 80, kunnen onder meer verschillen naar gelang van de
      diersoort of categorie van dieren of de produkten en naar gelang van het land van bestemming.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel81
  - number: '81.2'
    text: |-
      Indien ter uitvoering van het bepaalde in artikel 77 wordt voorzien in een officiële erkenning van de in het tweede
      lid van artikel 77 bedoelde bedrijven, markten en verzamelplaatsen van vee of pluimvee wordt een zodanige erkenning
      verleend voor iedere markt en verzamelplaats en ieder bedrijf, dat aan de daarvoor door Onze Minister gestelde
      eisen voldoet en wordt de erkenning ingetrokken, indien het bedrijf de markt of de verzamelplaats niet langer aan
      deze eisen blijkt te voldoen, doch niet dan nadat gedurende een redelijke termijn gelegenheid is gegeven, de voor
      het behoud van de erkenning noodzakelijke voorzieningen te treffen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel81
  - number: '81.3'
    text: |-
      Onverminderd het bepaalde in het tweede lid kan Onze Minister een officiële erkenning als bedoeld in het tweede lid
      voor bepaalde tijd intrekken indien:
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel81
  - number: 81.3.a
    text: de bedrijfsvoering niet voldoet aan nader door Onze Minister gestelde regelen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel81
  - number: 81.3.b
    text: |-
      de ondernemer ten behoeve van wiens bedrijf de officiële erkenning is verleend, in strijd handelt met het bepaalde
      bij of krachtens de artikelen 77, 78 of 79.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel81
  - number: '81.4'
    text: |-
      Het bepaalde in het tweede en derde lid is van overeenkomstige toepassing indien op grond van de artikelen 78 of 79
      wordt voorzien in een officiële erkenning van bedrijven, markten of verzamelplaatsen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel81
  - number: '83'
    text: 'Uit ’het Diergezondheidsfonds worden betaald:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel83
  - number: 83.a
    text: |-
      de kosten van de uitvoering van de in [artikel 22, eerste lid, onderdeel ][ref1], genoemde maatregelen, met
      uitzondering van die van het reinigen van stallen en de daarin aanwezige voorwerpen alsmede van het reinigen en
      ontsmetten van markten, andere plaatsen waar dieren van verschillende houders bijeen zijn gebracht, diergaarden en
      daarmee vergelijkbare inrichtingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
        hoofdstuk: II
        afdeling: '3'
  - number: 83.b
    text: |-
      de kosten van het ter beschikking stellen van de middelen ter ontsmetting, als bedoeld in [artikel 26][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel26
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '26'
        hoofdstuk: II
        afdeling: '3'
  - number: '84'
    text: |-
      Onze Minister kan bepalen, dat de kosten van het in artikel 17, eerste lid, bedoelde behandelen en merken geheel of
      gedeeltelijk worden betaald uit ’s Rijks kas.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel84
  - number: '85.1'
    text: |-
      Deze afdeling is van toepassing op maatregelen als bedoeld in afdeling 3 van hoofdstuk II ter voorkoming en
      bestrijding van ingevolge artikel 15 aangewezen besmettelijke dierziekten bij vee, pluimvee, bijen en nertsen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel85
  - number: '85.2'
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in artikel 15, eerste lid, onderdeel *e*, onderscheidenlijk
      een aanwijzing als bedoeld in artikel 15, eerste lid, onderdeel *f*, kan deze afdeling geheel of gedeeltelijk van
      toepassing worden verklaard.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel85
  - number: '86.1'
    text: 'Uit ’het Diergezondheidsfonds wordt aan de eigenaar een tegemoetkoming in de schade uitgekeerd, indien:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel86
  - number: 86.1.a
    text: |-
      dieren krachtens het bepaalde in [artikel 22, eerste lid, onderdeel ][ref1], worden gedood;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
        hoofdstuk: II
        afdeling: '3'
  - number: 86.1.b
    text: |-
      produkten en voorwerpen krachtens het bepaalde in [artikel 22, eerste lid, onderdeel ][ref1], onschadelijk worden
      gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
        hoofdstuk: II
        afdeling: '3'
  - number: 86.1.c
    text: |-
      maatregelen krachtens het bepaalde in [artikel 22, tweede lid, onderdeel ][ref1], zijn toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
        hoofdstuk: II
        afdeling: '3'
  - number: '86.2'
    text: 'De tegemoetkoming in de schade bedraagt:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel86
  - number: 86.2.a
    text: 'voor verdachte dieren: de waarde in gezonde toestand,'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel86
  - number: 86.2.b
    text: 'voor zieke dieren: het bij algemene maatregel van bestuur te bepalen gedeelte van de waarde in gezonde toestand,'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel86
  - number: 86.2.c
    text: 'voor produkten en voorwerpen: de waarde op het moment van de maatregel,'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel86
  - number: '86.3'
    text: |-
      Aan de toekenning van een tegemoetkoming kunnen door Onze Minister voorwaarden worden verbonden welke
      betrekking kunnen hebben op: a. de inrichting van het bedrijf; b. de hygiëne op het bedrijf; c. de herbevolking
      van het bedrijf; d. de bedrijfsbegeleiding door een dierenarts of de begeleiding vanwege de stichting als
      bedoeld in [artikel 82][ref1]; e. op het bedrijf te nemen preventieve maatregelen; en voor zover, de eigenaar
      niet bedrijfsmatig dieren houdt: a. de inrichting van de verblijfsruimten voor dieren; b. de hygiëne in de
      verblijfsruimten voor dieren; c. de herbevolking van de verblijfsruimten voor dieren; d. de te nemen preventieve
      maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel82
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '82'
        hoofdstuk: VIII
        afdeling: '1'
  - number: '86.4'
    text: |-
      Onze Minister kan de uitbetaling van de tegemoetkoming opschorten totdat aan de ingevolge het derde lid gestelde
      voorwaarden is voldaan, dan wel aan degene aan wie de tegemoetkoming is toegekend, de verplichting opleggen
      zekerheid te stellen voor de juiste nakoming van de krachtens dat lid gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel86
  - number: '86.5'
    text: |-
      Onze Minister kan bepalen, dat in afwijking van het bepaalde in het eerste en tweede lid, geen tegemoetkoming
      wordt toegekend, dan wel dat de tegemoetkoming op een geringer bedrag wordt bepaald, voor zover het optreden van de
      besmettelijke ziekte mede aan betrokkene te wijten is.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel86
  - number: '86.6'
    text: |-
      Een zelfde bevoegdheid heeft Onze Minister indien wordt vastgesteld dat de eigenaar aan zijn krachtens
      [artikel 4][ref1] of krachtens [artikel 92][ref2] opgelegde verplichtingen niet of niet volledig heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel92
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '92'
        hoofdstuk: VIII
        afdeling: '3'
  - number: '86.7'
    text: |-
      Onze Minister kan het bedrag van de tegemoetkoming geheel of gedeeltelijk terugvorderen, indien aan de aan deze
      tegemoetkoming krachtens het derde lid gestelde voorwaarden niet of niet ten volle is voldaan.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel86
  - number: '87'
    text: |-
      Alvorens dieren krachtens het bepaalde in [artikel 22, eerste lid, onderdeel ][ref1], worden gedood of produkten en
      voorwerpen krachtens het bepaalde in [artikel 22, eerste lid, onderdeel ][ref2], worden onschadelijk gemaakt, dan
      wel raten of bijenvolken krachtens het bepaalde in [artikel 22, tweede lid, onderdeel ][ref3], worden vernietigd,
      wordt de waarde daarvan vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '22'
        hoofdstuk: II
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005662
        artikel: '22'
        hoofdstuk: II
        afdeling: '3'
  - number: '88.1'
    text: |-
      De in [artikel 87][ref1] bedoelde waardevaststelling geschiedt door een beëdigd deskundige, welke wordt aangewezen
      door een door Onze Minister aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel87
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '87'
        hoofdstuk: VIII
        afdeling: '2'
  - number: '88.2'
    text: |-
      Indien de in het eerste lid bedoelde ambtenaar of de eigenaar of diens gemachtigde geen genoegen neemt met de
      waardevaststelling verzoekt Onze Minister de kantonrechter van de rechtbank van het arrondissement waar de dieren
      als bedoeld in [artikel 87][ref1] zijn gedood of de produkten en voorwerpen als bedoeld in dat artikel onschadelijk
      zijn gemaakt dan wel raten of bijenvolken als bedoeld in dat artikel zijn vernietigd, drie beëdigde deskundigen te
      benoemen, waaronder de krachtens het eerste lid aangewezen deskundige.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel87
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '87'
        hoofdstuk: VIII
        afdeling: '2'
  - number: '88.3'
    text: |-
      Indien over de waardevaststelling geen overeenstemming wordt bereikt, geldt het bedrag dat het gemiddelde is van de
      verschillende waarderingen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel88
  - number: '88.4'
    text: De kosten van de in het eerste en tweede lid bedoelde deskundigen worden uit ’het Diergezondheidsfonds betaald.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel88
  - number: '89'
    text: |-
      Terstond nadat de waarde is vastgesteld deelt Onze Minister aan de eigenaar het bedrag van de waardevaststelling
      mede.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel89
  - number: '90.1'
    text: |-
      Indien door het onschadelijk maken van dieren, produkten of voorwerpen krachtens het bepaalde in [artikel 22][ref1]
      schade wordt toegebracht aan gebouwen, terreinen of voorwerpen, wordt aan de eigenaar of gebruiker van deze
      gebouwen, terreinen of voorwerpen uit ’het Diergezondheidsfonds een tegemoetkoming in de schade uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
        hoofdstuk: II
        afdeling: '3'
  - number: '90.2'
    text: |-
      Bij geschil over het bedrag der tegemoetkoming wordt dit, op verzoek van de meest gerede partij, door de
      kantonrechter bepaald bij beschikking, zonder hoger beroep.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel90
  - number: '91'
    text: |-
      Schade veroorzaakt door de toepassing van maatregelen, als bedoeld in [artikel 17][ref1] of [21][ref2], kan voor
      zover deze niet uit hoofde van de[artikelen 86][ref3] of [90][ref4] voor vergoeding in aanmerking komt, in door
      Onze Minister te bepalen bijzondere gevallen geheel of gedeeltelijk uit ’het Diergezondheidsfonds worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel86
      [ref4]: https://wetten.overheid.nl/BWBR0005662#Artikel90
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '17'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '21'
        hoofdstuk: II
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005662
        artikel: '86'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005662
        artikel: '90'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 91a.1
    text: |-
      Terzake van het houden van varkens wordt van de persoon of rechtspersoon die, of het samenwerkingsverband van
      personen of rechtspersonen dat een bedrijf voert onder de naam varkensheffing een heffing geheven ter bestrijding
      van de kosten:
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91a
  - number: 91a.1.a
    text: |-
      bedoeld in [artikel 83][ref1] en [88, vierde lid][ref2], voor zover die kosten noodzakelijk zijn met het oog op de
      bestrijding van voor varkens op grond van [artikel 15, eerste lid][ref3], aangewezen besmettelijke ziekten;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91a
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '83'
        hoofdstuk: VIII
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '88'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005662
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: 91a.1.b
    text: |-
      van de tegemoetkomingen bedoeld in [artikel 86, eerste lid, aanhef en onderdelen a en b][ref1], en
      [artikel 90, eerste lid][ref2], alsmede de vergoedingen bedoeld in [artikel 91][ref3], voor zover die
      tegemoetkomingen, respectievelijk vergoedingen, voortvloeien uit de bestrijding van voor varkens op grond van
      [artikel 15, eerste lid][ref4], aangewezen besmettelijke ziekten;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel90
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel91
      [ref4]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91a
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '86'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '90'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005662
        artikel: '91'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005662
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: 91a.1.c
    text: |-
      van door Onze Minister getroffen maatregelen en voorzieningen als bedoeld in [hoofdstuk II, afdeling 3][ref1],
      voor zover die kosten noodzakelijk zijn met het oog op de bestrijding van voor varkens op grond van
      [artikel 15, eerste lid][ref2], aangewezen besmettelijke ziekten, waartoe tevens gerekend worden de kosten van door
      Onze Minister getroffen maatregelen en voorzieningen die noodzakelijk zijn met het oog op de bescherming van het
      welzijn van dieren dan wel met het oog op onderzoek naar de mate van verspreiding van die ziekten in Nederland, en


      [ref1]: https://wetten.overheid.nl/BWBR0005662#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91a
    references:
      - id: ref1
        bwb_id: BWBR0005662
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: 91a.1.d
    text: die noodzakelijk zijn met het oog op de heffing en invordering van de varkensheffing.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91a
  - number: 91a.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de varkensheffing, met ingang van 1 januari van een op
      de datum van inwerkingtreding van die maatregel volgend kalenderjaar, tevens wordt geheven ter bestrijding van de
      kosten van het Diergezondheidsfonds, voor zover noodzakelijk met het oog op het weren van voor varkens op grond van
      [artikel 15, eerste lid][ref1], aangewezen besmettelijke ziekten.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91a
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: 91a.3
    text: De heffing wordt geheven per bedrijf per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91a
  - number: 91b.1
    text: |-
      De varkensheffing wordt geheven naar het aantal varkens, uitgedrukt in heffingseenheden, dat gemiddeld in een
      kalenderjaar op het bedrijf wordt gehouden. De omrekening van varkens in heffingseenheden geschiedt overeenkomstig
      de bij deze wet behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91b
  - number: 91b.2
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent de wijze waarop het gemiddelde aantal varkens wordt
      bepaald.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91b
  - number: 91c
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat over de bij die maatregel vast te stellen categorieën
      varkens geheel of ten dele geen varkensheffing verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91c
  - number: 91d.1
    text: Het tarief van de varkensheffing bedraagt € 5,22 per heffingseenheid.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91d
  - number: 91d.2
    text: |-
      Telkens met ingang van 1 januari van het kalenderjaar, volgende op een periode van drie kalenderjaren, te rekenen
      vanaf 1 januari 1998, kan het tarief van de varkensheffing voor de op die periode volgende periode van drie
      kalenderjaren worden gewijzigd. Een wijziging als bedoeld in de vorige volzin geschiedt bij algemene maatregel
      van bestuur die in werking treedt voor het tijdstip waarop de periode aanvangt waarop de wijziging van het tarief
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91d
  - number: 91d.3
    text: 'Wijziging van het tarief op grond van het tweede lid geschiedt op basis van het saldo van:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91d
  - number: 91d.3.a
    text: |-
      een raming van de kosten, bedoeld in artikel 91a, eerste lid, en, voor zover van toepassing, artikel 91a, tweede
      lid, over een periode van drie kalenderjaren, te rekenen vanaf 1 januari van het kalenderjaar met ingang waarvan
      het tarief uit hoofde van het tweede lid kan worden gewijzigd, bij welke raming rekening wordt gehouden met het
      totaal van de kosten, bedoeld in artikel 91a, eerste lid, over een periode van drie jaar die eindigt op 1 juli van
      het kalenderjaar dat voorafgaat aan de periode waarop de raming betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91d
  - number: 91d.3.b
    text: |-
      ten hoogste 50% van de door het Diergezondheidsfonds gemaakte kosten, bedoeld in artikel 91a, eerste lid, over de
      periode vanaf de datum van invoering van de varkensheffing tot 1 januari van het kalenderjaar dat voorafgaat aan
      het kalenderjaar met ingang waarvan het tarief uit hoofde van het tweede lid kan worden gewijzigd, voor zover die
      kosten meer bedragen dan de totale som van de varkensheffing, bestemd voor de bestrijding van die kosten, zoals
      geheven over de tot laatstbedoelde datum verstreken kalenderjaren, en, voor zover van toepassing,
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91d
  - number: 91d.3.c
    text: |-
      ten hoogste 50% van de door het Diergezondheidsfonds gemaakte kosten, bedoeld in artikel 91a, tweede lid, over
      de periode vanaf de in dat artikellid genoemde datum tot 1 januari van het kalenderjaar dat voorafgaat aan het
      kalenderjaar met ingang waarvan het tarief uit hoofde van het tweede lid kan worden gewijzigd, voor zover die
      kosten meer bedragen dan de totale som van de varkensheffing, bestemd voor de bestrijding van die kosten, zoals
      geheven over de tot laatstbedoelde datum verstreken kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91d
  - number: 91d.4
    text: |-
      In geval van toepassing van artikel 91a, tweede lid, wordt bij de in dat artikellid bedoelde algemene maatregel
      van bestuur het tarief van de varkensheffing verhoogd met ingang van 1 januari van het in artikel 91a, tweede lid,
      bedoelde kalenderjaar. De tariefsverhoging wordt gebaseerd op een raming van de kosten, bedoeld in artikel 95c,
      onderdeel c, over de kalenderjaren, te rekenen vanaf de in de vorige volzin bedoelde datum tot de datum met ingang
      waarvan uit hoofde van het tweede lid het tarief van de varkensheffing kan worden gewijzigd, voor zover die kosten
      betrekking hebben op de diersoort varken.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91d
  - number: 91e.1
    text: 'Het tarief van de varkensheffing wordt verminderd met:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91e
  - number: 91e.1.a
    text: |-
      het aantal procentpunten dat overeenkomt met de uitkomst van de vermenigvuldiging van het aantal
      tot het bedrijf behorende vestigingen waarvan elke opstal of elk perceel grond op 1 januari
      van het desbetreffende kalenderjaar is gelegen buiten een concentratiegebied als bedoeld in
      [artikel 1, onderdeel m, van de Wet herstructurering varkenshouderij][ref1] en de deling van het cijfer 15 door het
      totaal aantal vestigingen van het desbetreffende bedrijf;


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel1
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91e
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '1'
  - number: 91e.1.b
    text: |-
      40 procentpunten indien in het desbetreffende kalenderjaar ten aanzien van elke tot het bedrijf behorende vestiging
      noch sprake is van aanvoer van varkens, noch sprake is van afvoer van varkens aan enige andere vestiging van dat
      bedrijf of van enig ander bedrijf;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91e
  - number: 91e.1.c
    text: |-
      30 procentpunten indien in het desbetreffende kalenderjaar ten aanzien van één of meer tot het bedrijf behorende
      vestigingen de som van het aantal vestigingen van dat bedrijf of enig ander bedrijf waaraan vanaf de desbetreffende
      vestiging varkens worden geleverd en het aantal vestigingen van dat bedrijf of enig ander bedrijf van waar aan de
      desbetreffende vestiging varkens worden geleverd gelijk is aan 1, met dien verstande dat ten aanzien van geen van
      de tot het bedrijf behorende vestigingen die som groter is dan 1;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91e
  - number: 91e.1.d
    text: |-
      20 procentpunten indien in het desbetreffende kalenderjaar ten aanzien van één of meer tot het bedrijf behorende
      vestigingen de som van het aantal vestigingen van dat bedrijf of enig ander bedrijf waaraan vanaf de desbetreffende
      vestiging varkens worden geleverd en het aantal vestigingen van dat bedrijf of enig ander bedrijf van waar aan de
      desbetreffende vestiging varkens worden geleverd gelijk is aan 2, met dien verstande dat ten aanzien van geen van
      de tot het bedrijf behorende vestigingen die som groter is dan 2;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91e
  - number: 91e.1.e
    text: |-
      10 procentpunten indien in het desbetreffende kalenderjaar ten aanzien van één of meer tot het bedrijf behorende
      vestigingen de som van het aantal vestigingen van dat bedrijf of enig ander bedrijf waaraan vanaf de desbetreffende
      vestiging varkens worden geleverd en het aantal vestigingen van dat bedrijf of enig ander bedrijf waarvandaan aan
      de desbetreffende vestiging varkens worden geleverd gelijk is aan 3, met dien verstande dat ten aanzien van geen
      van de tot het bedrijf behorende vestigingen die som groter is dan 3 en vanaf geen van de tot het bedrijf behorende
      vestigingen aan meer dan 2 vestigingen van dat bedrijf of enig ander bedrijf varkens worden geleverd, en
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91e
  - number: 91e.1.f
    text: |-
      een bij algemene maatregel van bestuur, op ten minste 5 en ten hoogste 25, vastgesteld aantal procentpunten, indien
      het bedrijf deelneemt aan een samenhangend stelsel van voorwaarden met betrekking tot de gezondheid van varkens
      dat is gericht op de verschillende, bij de productie van varkens en varkensvlees, betrokken ondernemingen en dat
      voldoet aan bij algemene maatregel van bestuur te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91e
  - number: 91e.2
    text: |-
      Bij algemene maatregel van bestuur kunnen, met ingang van 1 januari van het kalenderjaar dat volgt op de datum van
      inwerkingtreding van die algemene maatregel van bestuur, het in het eerste lid, onderdeel a, genoemde cijfer en
      de in het eerste lid, onderdelen b tot en met e, genoemde aantallen procentpunten worden vervangen door een ander
      cijfer, onderscheidenlijk andere aantallen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91e
  - number: 91e.3
    text: |-
      Bij algemene maatregel van bestuur kunnen, met ingang van 1 januari van het kalenderjaar dat volgt op de datum
      van inwerkingtreding van die algemene maatregel van bestuur, met het oog op de bestrijding of het weren van voor
      varkens besmettelijke ziekten, andere gevallen worden bepaald op basis waarvan het tarief van de varkensheffing
      wordt verminderd.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91e
  - number: 91e.4
    text: |-
      De toepassing van het tweede, onderscheidenlijk derde lid, geschiedt zodanig dat in geen geval meer dan 70% korting
      op het tarief van de varkensheffing wordt verkregen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91e
  - number: 91f
    text: De varkensheffing wordt geheven bij wege van aanslag.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91f
  - number: 91g
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van de door de in artikel 91a, eerste lid,
      bedoelde heffingplichtigen te voeren administratie met het oog op de vaststelling van het aantal en de categorieën
      varkens waarover de varkensheffing verschuldigd is en de toepassing van het bij of krachtens artikel 91e bepaalde.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91g
  - number: 91h.1
    text: |-
      Terzake van het houden van dieren, behorende tot enige andere diersoort dan de diersoort varken, kunnen bij
      algemene maatregel van bestuur, met ingang van een datum die volgt op de datum van inwerkingtreding van de
      desbetreffende algemene maatregel van bestuur, heffingen worden ingevoerd die worden geheven van de persoon of
      rechtspersoon die of het samenwerkingsverband van personen of rechtspersonen dat een bedrijf voert, welke heffingen
      dienen ter bestrijding van de kosten:
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91h
  - number: 91h.1.a
    text: |-
      bedoeld in [artikel 83][ref1] en [88, vierde lid][ref2], voor zover die kosten noodzakelijk zijn met het oog op
      de bestrijding van voor andere diersoorten dan de diersoort varken op grond van [artikel 15, eerste lid][ref3],
      aangewezen besmettelijke ziekten;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91h
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '83'
        hoofdstuk: VIII
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '88'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005662
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: 91h.1.b
    text: |-
      van de tegemoetkomingen bedoeld in [artikel 86, eerste lid, aanhef en onderdelen a en b][ref1], en
      [artikel 90, eerste lid][ref2], alsmede de vergoedingen bedoeld in [artikel 91][ref3], voor zover die
      tegemoetkomingen, onderscheidenlijk vergoedingen, voortvloeien uit de bestrijding van voor andere diersoorten dan
      de diersoort varken op grond van [artikel 15, eerste lid][ref4], aangewezen besmettelijke ziekten;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel90
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel91
      [ref4]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91h
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '86'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '90'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005662
        artikel: '91'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005662
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: 91h.1.c
    text: |-
      van door Onze Minister getroffen maatregelen en voorzieningen als bedoeld in [hoofdstuk II, afdeling 3][ref1],
      voor zover die kosten noodzakelijk zijn met het oog op de bestrijding van voor andere diersoorten dan de diersoort
      varken op grond van [artikel 15, eerste lid][ref2], aangewezen besmettelijke ziekten, waartoe tevens gerekend
      worden de kosten van door Onze Minister getroffen maatregelen en voorzieningen die noodzakelijk zijn met het oog
      op de bescherming van het welzijn van dieren dan wel met het oog op onderzoek naar de mate van verspreiding van die
      ziekten in Nederland, en


      [ref1]: https://wetten.overheid.nl/BWBR0005662#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91h
    references:
      - id: ref1
        bwb_id: BWBR0005662
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: 91h.1.d
    text: die noodzakelijk zijn met het oog op de heffing en invordering van de heffingen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91h
  - number: 91h.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat een heffing als bedoeld in het eerste lid, met ingang van
      1 januari van een op de datum van inwerkingtreding van die maatregel volgend kalenderjaar, tevens wordt geheven ter
      bestrijding van de kosten van het Diergezondheidsfonds, voor zover noodzakelijk met het oog op het weren van voor
      andere diersoorten dan de diersoort varken op grond van [artikel 15, eerste lid][ref1], aangewezen besmettelijke
      ziekten.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91h
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: 91h.3
    text: |-
      Een krachtens het eerste lid ingevoerde heffing wordt geheven per bedrijf per kalenderjaar naar het aantal dieren
      van de bij de desbetreffende heffing betrokken diersoort dat gemiddeld in een kalenderjaar op het bedrijf wordt
      gehouden, met dien verstande dat, in geval de betrokken heffing wordt ingevoerd gedurende het kalenderjaar, de
      heffing in dat kalenderjaar wordt geheven over het nog niet verstreken deel van dat jaar.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91h
  - number: 91h.4
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid kan gevallen bepalen waarin korting op het
      tarief van de desbetreffende heffing wordt verkregen. Daarbij wordt in ieder geval rekening gehouden met de mate
      waarin het bedrijf of de bedrijfsvoering van de heffingplichtige een risico vormt voor de verspreiding van op
      grond van [artikel 15, eerste lid][ref1], aangewezen en voor de bij de desbetreffende heffing betrokken diersoort
      besmettelijke ziekten.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91h
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '15'
        hoofdstuk: II
        afdeling: '3'
  - number: 91h.5
    text: |-
      De toepassing van het vierde lid geschiedt zodanig dat in geen geval meer dan 70% korting op het tarief wordt
      verkregen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91h
  - number: 91h.6
    text: Een krachtens het eerste lid ingevoerde heffing wordt geheven bij wege van aanslag.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91h
  - number: 91i.1
    text: |-
      Het tarief van een krachtens artikel 91h, eerste lid, ingevoerde heffing wordt vastgesteld op basis van een raming
      van de ten aanzien van de, bij de desbetreffende heffing betrokken diersoort, kosten, bedoeld in artikel 91h,
      eerste lid, over een periode van drie jaar, te rekenen vanaf het tijdstip waarop de heffing wordt ingevoerd. Bij
      de raming wordt rekening gehouden met het totaal van de ten aanzien van die diersoort gemaakte kosten, bedoeld
      in artikel 91h, eerste lid, over de periode van drie jaar die eindigt zes maanden voor het in de vorige volzin
      bedoelde tijdstip.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91i
  - number: 91i.2
    text: |-
      Telkens na een periode van drie kalenderjaren, te rekenen vanaf 1 januari van het kalenderjaar waarin een heffing
      als bedoeld in artikel 91h, eerste lid, wordt ingevoerd, kan het tarief van de betrokken heffing voor de op die
      periode volgende periode van drie kalenderjaren worden gewijzigd. Een wijziging als bedoeld in de vorige volzin
      geschiedt bij algemene maatregel van bestuur die in werking treedt voor het tijdstip waarop de periode aanvangt
      waarop de wijziging van het tarief betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91i
  - number: 91i.3
    text: 'Wijziging van het tarief op grond van het tweede lid geschiedt op basis van het saldo van:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91i
  - number: 91i.3.a
    text: |-
      een raming van de terzake van de bij de desbetreffende heffing betrokken diersoort te maken kosten, bedoeld
      in artikel 91h, eerste lid, en, voor zover van toepassing, artikel 91h, tweede lid, over een periode van drie
      kalenderjaren, te rekenen vanaf 1 januari van het kalenderjaar met ingang waarvan het tarief uit hoofde van het
      tweede lid kan worden gewijzigd, bij welke raming rekening wordt gehouden met het totaal van de, terzake van die
      diersoort gemaakte kosten, bedoeld in artikel 91h, eerste lid, over een periode van drie jaar die eindigt op 1 juli
      van het kalenderjaar dat voorafgaat aan de periode waarop de raming betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91i
  - number: 91i.3.b
    text: |-
      ten hoogste 50% van de door het Diergezondheidsfonds terzake van de, bij de desbetreffende heffing betrokken
      diersoort, gemaakte kosten, bedoeld in artikel 91h, eerste lid, over de periode vanaf de datum van invoering van
      die heffing tot 1 januari van het kalenderjaar dat voorafgaat aan het kalenderjaar met ingang waarvan het tarief
      uit hoofde van het tweede lid kan worden gewijzigd, voor zover die kosten meer bedragen dan de totale som van die
      heffing, bestemd voor de bestrijding van die kosten, zoals geheven over de tot laatstbedoelde datum verstreken
      kalenderjaren, en, voor zover van toepassing,
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91i
  - number: 91i.3.c
    text: |-
      ten hoogste 50% van de door het Diergezondheidsfonds terzake van de, bij de desbetreffende heffing betrokken
      diersoort, gemaakte kosten, bedoeld in artikel 91h, tweede lid, over de periode vanaf de in dat artikellid genoemde
      datum tot 1 januari van het kalenderjaar dat voorafgaat aan het kalenderjaar met ingang waarvan het tarief uit
      hoofde van het tweede lid kan worden gewijzigd, voor zover die kosten meer bedragen dan de totale som van die
      heffing, bestemd voor de bestrijding van die kosten, zoals geheven over de tot laatstbedoelde datum verstreken
      kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91i
  - number: 91i.4
    text: |-
      In geval van toepassing van artikel 91h, tweede lid, wordt bij de in dat artikellid bedoelde algemene maatregel van
      bestuur het tarief van de desbetreffende heffing verhoogd met ingang van 1 januari van het in artikel 91h, tweede
      lid, bedoelde kalenderjaar. De verhoging wordt gebaseerd op een raming van de kosten, bedoeld in artikel 95c,
      onderdeel c, voor zover die kosten betrekking hebben op de bij de desbetreffende heffing betrokken diersoort, over
      de kalenderjaren, te rekenen vanaf de in de vorige volzin bedoelde datum tot de datum met ingang waarvan uit hoofde
      van het tweede lid het tarief van de desbetreffende heffing kan worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel91i
  - number: '92.1'
    text: |-
      Terzake van het verhandelen, vervoeren of slachten van dieren, het produceren, vervoeren of verhandelen van
      dierlijke producten of het bereiden van diervoeder, dan wel terzake van het anders dan op een bedrijf houden
      van dieren, kunnen bij algemene maatregel van bestuur, met ingang van een datum die volgt op de datum van
      inwerkingtreding van de desbetreffende algemene maatregel van bestuur, heffingen worden ingevoerd die worden
      geheven van personen of rechtspersonen, dan wel samenwerkingsverbanden van personen of rechtspersonen, welke
      heffingen dienen ter bestrijding van de kosten:
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel92
  - number: 92.1.a
    text: bedoeld in artikel 83 en 88, vierde lid, voor zover die kosten noodzakelijk zijn;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel92
  - number: 92.1.b
    text: |-
      van de tegemoetkomingen bedoeld in artikel 86, eerste lid, aanhef en onderdelen a en b, en artikel 90, eerste lid,
      alsmede de vergoedingen bedoeld in artikel 91;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel92
  - number: 92.1.c
    text: |-
      van door Onze Minister getroffen maatregelen en voorzieningen als bedoeld in hoofdstuk II, afdeling 3, voor zover
      die kosten noodzakelijk zijn, waartoe tevens gerekend worden de kosten van door Onze Minister getroffen maatregelen
      en voorzieningen die noodzakelijk zijn met het oog op de bescherming van het welzijn van dieren dan wel met het oog
      op onderzoek naar de mate van verspreiding van die ziekten in Nederland, en
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel92
  - number: 92.1.d
    text: die noodzakelijk zijn met het oog op de heffing en invordering van de heffingen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel92
  - number: '92.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat een heffing als bedoeld in het eerste lid, met ingang
      van 1 januari van een op de datum van inwerkingtreding van die maatregel volgend kalenderjaar, tevens wordt geheven
      ter bestrijding van de kosten van het Diergezondheidsfonds, voor zover noodzakelijk met het oog op het weren van op
      grond van artikel 15, eerste lid, aangewezen besmettelijke ziekten.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel92
  - number: '92.3'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid kan gevallen bepalen op grond waarvan korting op
      het tarief van de desbetreffende heffing wordt verkregen. Daarbij wordt in ieder geval rekening gehouden met de
      mate waarin de heffingplichtige activiteit een risico oplevert voor de verspreiding van besmettelijke dierziekten.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel92
  - number: '92.4'
    text: |-
      De toepassing van het derde lid geschiedt zodanig dat in geen geval meer dan 70% korting op het tarief van de
      heffing wordt verkregen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel92
  - number: '92.5'
    text: Een krachtens het eerste lid ingevoerde heffing wordt geheven bij wege van aanslag.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel92
  - number: 92a.1
    text: |-
      Het tarief van een krachtens artikel 92, eerste lid, ingevoerde heffing wordt vastgesteld aan de hand van een
      raming van de kosten, bedoeld in artikel 92, eerste lid, over een periode van drie jaar, te rekenen vanaf het
      tijdstip waarop de heffing wordt ingevoerd, waarbij rekening wordt gehouden met de over die periode geraamde som
      van de varkensheffing en krachtens artikel 91h ingevoerde heffingen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel92a
  - number: 92a.2
    text: |-
      Telkens na een periode van drie kalenderjaren, te rekenen vanaf 1 januari van het kalenderjaar waarin een heffing
      als bedoeld in artikel 92, eerste lid, wordt ingevoerd, kan het tarief van de betrokken heffing voor de op die
      periode volgende periode van drie kalenderjaren worden gewijzigd. Een wijziging als bedoeld in de vorige volzin
      geschiedt bij algemene maatregel van bestuur die in werking treedt voor het tijdstip waarop de periode aanvangt
      waarop de wijziging van het tarief betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel92a
  - number: 92a.3
    text: 'Wijziging van het tarief op grond van het tweede lid geschiedt op basis van het saldo van:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel92a
  - number: 92a.3.a
    text: |-
      een raming van de kosten, bedoeld in artikel 92, eerste lid, en, voor zover van toepassing, artikel 92, tweede lid,
      over een periode van drie kalenderjaren, te rekenen vanaf 1 januari van het kalenderjaar met ingang waarvan het
      tarief uit hoofde van het tweede lid kan worden gewijzigd, bij welke raming rekening wordt gehouden met de over die
      periode geraamde som van de varkensheffing en krachtens artikel 91h ingevoerde heffingen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel92a
  - number: 92a.3.b
    text: |-
      ten hoogste 50% van het totaal van de door het Diergezondheidsfonds tot 1 januari van het kalenderjaar,
      voorafgaande aan het kalenderjaar met ingang waarvan het tarief uit hoofde van het tweede lid kan worden gewijzigd,
      gemaakte kosten, bedoeld in artikel 92, eerste lid, voor zover die kosten meer bedragen dan de totale som van de
      varkensheffing, bestemd voor de bestrijding van de kosten, bedoeld in artikel 91a, eerste lid, de totale som van
      de krachtens artikel 91h, eerste lid, ingevoerde heffingen, bestemd voor de bestrijding van de in dat artikellid
      bedoelde kosten, alsmede de totale som van krachtens artikel 92, eerste lid, ingevoerde heffingen, bestemd voor
      de bestrijding van de in dat artikellid bedoelde kosten, zoals geheven over de tot laatstbedoelde datum verstreken
      kalenderjaren, en, voor zover van toepassing,
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel92a
  - number: 92a.3.c
    text: |-
      ten hoogste 50% van het totaal van de door het Diergezondheidsfonds tot 1 januari van het kalenderjaar,
      voorafgaande aan het kalenderjaar met ingang waarvan het tarief uit hoofde van het tweede lid kan worden gewijzigd,
      gemaakte kosten, bedoeld in artikel 92, tweede lid, voor zover die kosten meer bedragen dan de totale som van de
      varkensheffing, bestemd voor de bestrijding van de kosten, bedoeld in artikel 91a, tweede lid, de totale som van
      krachtens artikel 91h, eerste lid, ingevoerde heffingen, bestemd voor de bestrijding van de in artikel 91h, tweede
      lid, bedoelde kosten, alsmede de totale som van krachtens artikel 92, eerste lid, ingevoerde heffingen, bestemd
      voor de bestrijding van de in artikel 92, tweede lid bedoelde kosten, zoals geheven over de tot laatstbedoelde
      datum verstreken kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel92a
  - number: 92a.4
    text: |-
      In geval van toepassing van artikel 92, tweede lid, wordt bij de in dat artikellid bedoelde algemene maatregel van
      bestuur het tarief van de desbetreffende heffing verhoogd met ingang van 1 januari van het in artikel 92, tweede
      lid, bedoelde kalenderjaar. De verhoging wordt gebaseerd op een raming van de kosten, bedoeld in artikel 95c,
      onderdeel c, voor zover die kosten betrekking hebben op de kalenderjaren, te rekenen vanaf de in de vorige volzin
      bedoelde datum tot de datum met ingang waarvan uit hoofde van het tweede lid het tarief van de desbetreffende
      heffing kan worden gewijzigd en rekening houdend met de over die periode geraamde som van de varkensheffing en
      krachtens artikel 91h, eerste lid, ingevoerde heffingen.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel92a
  - number: '93.1'
    text: |-
      De heffing, bedoeld in artikel 91a, alsmede bij algemene maatregel van bestuur op grond van de artikelen 91h en 92
      ingevoerde heffingen worden door Onze Minister geheven.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel93
  - number: '93.2'
    text: |-
      Onverminderd het overigens bij of krachtens deze afdeling bepaalde worden de in het eerste lid bedoelde heffingen
      geheven met overeenkomstige toepassing van de [Algemene wet inzake rijksbelastingen][ref1], met dien verstande dat
      van die wet buiten toepassing blijven de artikelen 2, vierde lid, 37 tot en met 39, 47a, 53, tweede en derde lid,
      76, 80, tweede, derde en vierde lid, 82, 84, 86 en 87.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: '93.3'
    text: |-
      Voor de toepassing van de [Algemene wet inzake rijksbelastingen][ref1] en artikel 19 van de Wet administratieve
      rechtspraak belastingzaken treedt Onze Minister in de plaats van Onze Minister van Financiën. Voor de in de
      [Algemene wet inzake rijksbelastingen][ref2] genoemde functionarissen treden in de plaats de door Onze Minister
      aangewezen functionarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0002320
  - number: '93.4'
    text: |-
      Voor de toepassing van [artikel 18, derde lid, van de Algemene wet inzake rijksbelastingen][ref1] wordt met
      een onherroepelijke veroordeling gelijk gesteld het vervallen van het recht op strafvordering op de voet van de
      [artikelen 74][ref2] en [74a van het Wetboek van Strafrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel74a
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '74'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 74a
  - number: '93.5'
    text: |-
      Voor de toepassing van het bij of krachtens de artikelen 91a tot en met 92a bepaalde wordt
      [artikel 52, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1] als volgt gelezen:
      Administratieplichtigen zijn: de personen, rechtspersonen en samenwerkingsverbanden, bedoeld in artikel 91a,
      respectievelijk de personen, rechtspersonen en samenwerkingsverbanden, bedoeld in de artikelen 91h en 92.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
  - number: '93.6'
    text: |-
      Voor de toepassing van [artikel 66 van de Algemene wet inzake rijksbelastingen][ref1] zijn de bij regeling van Onze
      Minister van Financiën gestelde regels van toepassing. Door Onze Minister worden de afwijkingen daarop vastgesteld
      die voor de juiste toepassing van het bij of krachtens de artikelen 91a tot en met 92a bepaalde noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel66
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '66'
  - number: 93a.1
    text: |-
      De heffing, bedoeld in artikel 91a, alsmede bij algemene maatregel van bestuur op grond van artikel 91h of
      artikel 92 ingevoerde heffingen, worden ingevorderd door de door Onze Minister aangewezen functionaris en door de
      ontvanger, bedoeld in [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
  - number: 93a.2
    text: |-
      Onverminderd het overigens bij of krachtens deze afdeling bepaalde worden de heffingen
      ingevorderd met overeenkomstige toepassing van de [Invorderingswet 1990][ref1] en de
      [Kostenwet invordering rijksbelastingen][ref2], met dien verstande dat van de [Invorderingswet 1990][ref3] buiten
      toepassing blijven artikel 17, tweede lid, tweede volzin, alsmede de artikelen 59 en 62. Voorts blijven bij de
      toepassing van artikel 66 van die wet de [artikelen 76][ref4], [80][ref5], tweede, derde en vierde lid, [82][ref6],
      [84][ref7], [86][ref8] en [87 van de Algemene wet inzake rijksbelastingen][ref9] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
      [ref2]: https://wetten.overheid.nl/BWBR0002645
      [ref3]: https://wetten.overheid.nl/BWBR0004770
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel76
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel80
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel82
      [ref7]: https://wetten.overheid.nl/BWBR0002320#Artikel84
      [ref8]: https://wetten.overheid.nl/BWBR0002320#Artikel86
      [ref9]: https://wetten.overheid.nl/BWBR0002320#Artikel87
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0004770
      - id: ref2
        bwb_id: BWBR0002645
      - id: ref3
        bwb_id: BWBR0004770
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '76'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: '80'
      - id: ref6
        bwb_id: BWBR0002320
        artikel: '82'
      - id: ref7
        bwb_id: BWBR0002320
        artikel: '84'
      - id: ref8
        bwb_id: BWBR0002320
        artikel: '86'
      - id: ref9
        bwb_id: BWBR0002320
        artikel: '87'
  - number: 93a.3
    text: |-
      Behoudens voor zover de invordering is opgedragen aan de ontvanger, bedoeld in het eerste lid, treedt voor de
      toepassing van de [Invorderingswet 1990][ref1] Onze Minister in de plaats van Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0004770
  - number: 93a.4
    text: 'Met betrekking tot de invordering geldt dat:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel93a
  - number: 93a.4.a
    text: |-
      voor de toepassing van [artikel 8, eerste lid, van de Invorderingswet 1990][ref1] uitsluitend bevoegd is de door
      Onze Minister aangewezen functionaris;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel8
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '8'
  - number: 93a.4.b
    text: |-
      de in de [artikelen 10][ref1], eerste lid, [11][ref2], [12][ref3], en [26 van de Invorderingswet 1990][ref4]
      bedoelde bevoegdheden uitsluitend toekomen aan de door Onze Minister aangewezen functionaris, met dien verstande
      dat voor de toepassing van artikel 26 van die wet de bij regeling van Onze Minister van Financiën gestelde regels
      van toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel26
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '26'
  - number: 93a.4.c
    text: |-
      de overige bij invordering van toepassing zijnde bevoegdheden, met uitzondering van die bedoeld in de
      [artikelen 24][ref1], [25][ref2], en [58 van de Invorderingswet 1990][ref3], uitsluitend toekomen aan de ontvanger,
      bedoeld in het eerste lid;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel58
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '58'
  - number: 93a.4.d
    text: |-
      de bevoegdheid, bedoeld in [artikel 24 van de Invorderingswet 1990][ref1], zowel toekomt aan de door Onze Minister
      aangewezen functionaris als aan de ontvanger, bedoeld in het eerste lid;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel24
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '24'
  - number: 93a.4.e
    text: |-
      de bevoegdheden, bedoeld in de [artikelen 25][ref1] en [58 van de Invorderingswet 1990][ref2], toekomen aan de
      door Onze Minister aangewezen functionaris indien hij met de invordering is belast, en toekomen aan de ontvanger,
      bedoeld in het eerste lid, indien deze laatste met de invordering is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel58
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '58'
  - number: 93a.5
    text: |-
      In het kader van het verzet tegen de tenuitvoerlegging van het dwangbevel wordt voor de toepassing van
      [artikel 17 van de Invorderingswet 1990][ref1] voor «de ontvanger die het dwangbevel heeft uitgevaardigd» telkens
      gelezen: de met de tenuitvoerlegging van het dwangbevel belaste ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel17
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '17'
  - number: 93a.6
    text: |-
      Betaling van de heffingen geschiedt aan de door Onze Minister aangewezen functionaris. Na de betekening van het
      dwangbevel dient te worden betaald aan de ontvanger, bedoeld in het eerste lid, die is vermeld op het dwangbevel.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel93a
  - number: '94.1'
    text: 'Onze Minister kan een vergoeding van kosten heffen overeenkomstig een door hem vastgesteld tarief ter zake van:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel94
  - number: 94.1.a
    text: |-
      een krachtens [artikel 10][ref1] voorgeschreven onderzoek;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel10
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '10'
        hoofdstuk: II
        afdeling: '2'
  - number: 94.1.b
    text: |-
      een krachtens [artikel 11][ref1] voorgeschreven nader onderzoek, voorbehoedende behandeling of tijdelijke
      afzondering dan wel het toezicht op het slachten of de behandeling;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel11
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '11'
        hoofdstuk: II
        afdeling: '2'
  - number: 94.1.c
    text: |-
      de controle, bedoeld in [artikel 18, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel18
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '18'
        hoofdstuk: II
        afdeling: '3'
  - number: 94.1.d
    text: |-
      een krachtens de [artikelen 77][ref1] en [78][ref2] voorgeschreven onderzoek;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel78
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '77'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '78'
        hoofdstuk: VII
  - number: 94.1.e
    text: |-
      een onderzoek als bedoeld in [artikel 79][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel79
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '79'
        hoofdstuk: VII
  - number: 94.1.g
    text: |-
      een krachtens [artikel 60, tweede lid, onderdeel ][ref1], voorgeschreven onderzoek naar vervoermiddelen;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel60
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '60'
        hoofdstuk: III
        afdeling: '7'
  - number: 94.1.h
    text: |-
      de in [artikel 96][ref1] bedoelde identificatie en registratie;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel96
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '96'
        hoofdstuk: IX
  - number: 94.1.i
    text: andere onderzoekingen of verrichtingen, die op verzoek van betrokkenen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel94
  - number: '94.2'
    text: Onze Minister kan regelen stellen met betrekking tot betaling van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel94
  - number: 95a.1
    text: 'Er is een Diergezondheidsfonds, hierna te noemen: het fonds.'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel95a
  - number: 95a.2
    text: |-
      Het fonds is een begrotingsfonds als bedoeld in [artikel 2, eerste lid, van de Comptabiliteitswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel2
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel95a
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '2'
  - number: 95a.3
    text: Onze Minister beheert de begroting van het fonds.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel95a
  - number: 95b.1
    text: 'De ontvangsten van het fonds worden gevormd door:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel95b
  - number: 95b.1.a
    text: |-
      een jaarlijkse bijdrage vanuit de begroting van het Ministerie van Landbouw, Natuurbeheer en Visserij, welke
      bijdrage in omvang ten hoogste overeenkomt met de op deze begroting in het desbetreffende begrotingsjaar
      binnenkomende som van de varkensheffing;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel95b
  - number: 95b.1.b
    text: |-
      het aantal jaarlijkse bijdragen vanuit de begroting van het Ministerie van Landbouw, Natuurbeheer en Visserij
      dat overeenkomt met het aantal krachtens artikel 91h ingevoerde heffingen, welke bijdragen onderscheidenlijk ten
      hoogste overeenkomen met de op de genoemde begroting in het desbetreffende begrotingsjaar binnenkomende som van de
      onderscheiden heffingen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel95b
  - number: 95b.1.c
    text: |-
      het aantal jaarlijkse bijdragen vanuit de begroting van het Ministerie van Landbouw, Natuurbeheer en Visserij
      dat overeenkomt met het aantal krachtens artikel 92 ingevoerde heffingen, welke bijdragen onderscheidenlijk ten
      hoogste overeenkomen met de op de genoemde begroting in het desbetreffende begrotingsjaar binnenkomende som van de
      onderscheiden heffingen;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel95b
  - number: 95b.1.d
    text: overige bijdragen vanuit de begroting van het Ministerie van Landbouw, Natuurbeheer en Visserij;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel95b
  - number: 95b.1.e
    text: |-
      de door de Europese Unie ter beschikking gestelde middelen, verband houdende met het weren en de bestrijding van op
      grond van artikel 15, eerste lid, aangewezen besmettelijke dierziekten;
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel95b
  - number: 95b.1.f
    text: andere ontvangsten.
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel95b
  - number: 95c
    text: 'Uit het fonds kunnen betalingen worden verricht:'
    url: https://wetten.overheid.nl/BWBR0005662/2002-07-01#Artikel95c
  - number: 95c.a
    text: |-
      ter uitvoering van [artikel 83][ref1] en [88, vierde lid][ref2],
      [artikel 86, eerste lid, aanhef en onderdelen a en b][ref3], [artikel 90, eerste lid][ref4], en [artikel 91][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel83
