articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *minister:* de Minister van Sociale Zaken en Werkgelegenheid;

      b. *adviescommissie:* de adviescommissie Lijst beroepsziekten, bedoeld in [artikel 2, eerste lid][ref1];

      c. *RIVM:* Rijksinstituut voor Volksgezondheid en Milieu, te Bilthoven;

      d. *Lexces:* het samenwerkingsverband, genoemd in de samenwerkingsovereenkomst Landelijk Expertisecentrum
      Stoffengerelateerde beroepsziekten (Lexces) van 27 juni 2022, gepubliceerd in Staatscourant 2022, nr. 29239.


      [ref1]: https://wetten.overheid.nl/BWBR0047526#Artikel2
    url: https://wetten.overheid.nl/BWBR0047526/2022-11-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0047526
        artikel: '2'
  - number: '2'
    text: |-
      1 Er is een Adviescommissie Lijst beroepsziekten.

      2 De adviescommissie heeft tot taak:

      a. de minister te adviseren over aanpassing van de Lijst beroepsziekten veroorzaakt door gevaarlijke stoffen; en

      b. ten behoeve van de minister een afwegingskader causaliteit en bijbehorende protocollen beroepsziekten op te
      stellen en te onderhouden.

      3 De Lijst beroepsziekten wordt als bijlage opgenomen bij de in Kamerstukken II 2021/22, 25 883, nr. 442
      aangekondigde Regeling tegemoetkoming stoffengerelateerde beroepsziekten. Het afwegingskader causaliteit en de
      bijbehorende protocollen beroepsziekten worden door de minister gepubliceerd in de Staatscourant.

      4 De adviescommissie kan bij de taakuitoefening deskundigen raadplegen.
    url: https://wetten.overheid.nl/BWBR0047526/2022-11-30#Artikel2
  - number: '3'
    text: |-
      1 De adviescommissie bestaat uit een voorzitter, een plaatsvervangend voorzitter, maximaal vijf leden en maximaal
      vijf plaatsvervangend leden.

      2 De voorzitter, de leden en de plaatsvervangend leden van de adviescommissie worden door de minister benoemd
      telkens voor een termijn van 3 jaar. Zij kunnen worden herbenoemd.

      3 De leden kiezen uit hun midden een plaatsvervangend voorzitter, die de voorzitter vervangt bij diens afwezigheid.

      4 De adviescommissie beslist bij gewone meerderheid van stemmen. Komt de adviescommissie met meerderheid van
      stemmen tot een advies, dan wordt op verzoek van het desbetreffende lid of plaatsvervangend lid in het advies ook
      het minderheidsstandpunt weergegeven.

      5 De voorzitter en de plaatsvervangend voorzitter brengen op persoonlijke titel hun kennis en ervaring in en treden
      niet op als vertegenwoordiger van een specifieke belangengroep.

      6 Indien in voorkomend geval uit feiten of omstandigheden blijkt dat de voorzitter, de plaatsvervangend voorzitter,
      een van leden of een van de plaatsvervangend leden zelf direct of indirect betrokkenheid heeft bij een vast te
      stellen advies, dan zullen zij zich weerhouden van enige bemoeienis ten aanzien van het vast te stellen advies.

      7 De voorzitter, de plaatsvervangend voorzitter, de leden en de plaatsvervangend leden kunnen door de minister
      worden geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0047526/2022-11-30#Artikel3
  - number: '4'
    text: |-
      1 De adviescommissie stelt haar werkwijze schriftelijk vast en laat deze publiceren op [www.lexces.nl](onbekend).

      2 Het secretariaat van de adviescommissie geschiedt door het Bureau Lexces, onderdeel van het RIVM. De coördinator
      van het Bureau Lexces is secretaris van de adviescommissie.

      3 Het beheer van de bescheiden betreffende de werkzaamheden van de adviescommissie geschiedt op overeenkomstige
      wijze als bij het RIVM. De bescheiden worden na beëindiging van de werkzaamheden van de adviescommissie bewaard in
      het archief van het Ministerie van Sociale Zaken en Werkgelegenheid.

      4 De adviescommissie verstrekt desgevraagd aan de minister de voor de uitoefening van zijn taak benodigde
      inlichtingen.
    url: https://wetten.overheid.nl/BWBR0047526/2022-11-30#Artikel4
  - number: '5'
    text: |-
      1 De voorzitter, de plaatsvervangend voorzitter, de leden en de plaatsvervangend leden van de adviescommissie wordt
      een vergoeding toegekend op de voet van [artikel 2 van het Besluit vergoedingen adviescolleges en commissies][ref1].
      In het benoemingsbesluit worden de vergoedingen vastgelegd.

      2 Het door het RIVM voorgedragen lid en plaatsvervangend lid ontvangen geen vergoeding als bedoeld in het eerste
      lid.


