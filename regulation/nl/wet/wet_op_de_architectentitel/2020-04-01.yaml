        bwb_id: BWBR0004189
        artikel: '28'
        hoofdstuk: VIIa
      - id: ref2
        bwb_id: BWBR0004189
        artikel: '29'
        hoofdstuk: VIIa
  - number: '9.3'
    text: |-
