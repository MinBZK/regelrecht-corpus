$id: wet_op_de_architectentitel
regulatory_layer: WET
publication_date: '2021-08-25'
valid_from: '2020-04-01'
bwb_id: BWBR0004189
url: https://wetten.overheid.nl/BWBR0004189/2020-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bij de wet regelen te stellen omtrent de bescherming
    van de titels architect, stedebouwkundige, tuin- en landschapsarchitect en interieurarchitect, alsmede regelen
    te stellen ter uitvoering van de richtlijn van de Raad van de Europese Gemeenschappen van 10 juni 1985 inzake de
    onderlinge erkenning van de diploma's, certificaten en andere titels op het gebied van de architectuur, tevens
    houdende maatregelen tot vergemakkelijking van de daadwerkelijke uitoefening van het recht van vestiging en vrij
    verrichten van diensten (PbEG 1985, L 223/15);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: beroepservaringperiode: beroepsstage
      als bedoeld in artikel 1 van de richtlijn; beroepsorganisatie: rechtspersoon die ten doel heeft of mede ten
      doel heeft de behartiging van belangen van architecten, stedenbouwkundigen, tuin- en landschapsarchitecten of
      interieurarchitecten; betrokken staat: lidstaat, een andere staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte of Zwitserland; bevoegde autoriteit: bevoegde autoriteit als bedoeld in artikel
      56 van de richtlijn; bureau: het bureau architectenregister als bedoeld in [artikel 2a, eerste lid][ref1];
      derde land: ander land dan een betrokken staat; dienstverrichter: een persoon die op wettige wijze is gevestigd
      in een andere betrokken staat en aldaar op wettige wijze het beroep van architect, stedenbouwkundige, tuin- en
      landschapsarchitect of interieurarchitect uitoefent of, ingeval dat beroep in die staat niet is gereglementeerd,
      dat beroep in die staat tijdens de tien jaar voorafgaand aan de dienstverrichting in Nederland ten minste twee
      jaar voltijds heeft uitgeoefend, en die zich vanuit die staat naar Nederland begeeft om er tijdelijk en incidenteel
      datzelfde beroep uit te oefenen; IMI: elektronisch informatiesysteem, bedoeld in artikel 1 van Verordening (EU)
      nr. 1024/2012 betreffende de administratieve samenwerking via het Informatiesysteem interne markt («de IMI-
      verordening»), voor de uitwisseling van informatie tussen het bureau en bevoegde autoriteiten van andere betrokken
      staten; lidstaat: lidstaat van de Europese Unie; migrerende beroepsbeoefenaar:


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel2a
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: 2a
        hoofdstuk: III
        paragraaf: '1'
  - number: 1.1°
    text: onderdaan van een betrokken staat;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel1
  - number: 1.2°
    text: |-
      onderdaan van een derde land die houder is van een door een betrokken staat afgegeven EG-verblijfsvergunning voor
      langdurig ingezetenen als bedoeld in artikel 8 van richtlijn nr. 2003/109/EG van de Raad van de Europese Unie van
      25 november 2003 betreffende de status van langdurig ingezeten onderdanen van derde landen (PbEU L 016), of
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel1
  - number: 1.3°
    text: |-
      familielid van een onderdaan van een betrokken staat, dat onderdaan is van een derde land en dat uit hoofde van
      richtlijn nr. 2004/38/EG van het Europees Parlement en de Raad van de Europese Unie van 29 april 2004 betreffende
      het recht van vrij verkeer en verblijf op het grondgebied van de lidstaten voor de burgers van de Unie en hun
      familieleden (PbEU L 158 en L 229), gerechtigd is een betrokken staat binnen te komen en er te verblijven;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel1
  - number: '2'
    text: |-
      Er is een architectenregister, waarin op verzoek wordt ingeschreven als architect, als stedenbouwkundige, als tuin-
      en landschapsarchitect of als interieurarchitect degene, die voldoet aan de bij of krachtens deze wet gestelde
      eisen.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel2
  - number: 2a.1
    text: Er is een bureau architectenregister. Het bureau bezit rechtspersoonlijkheid en is gevestigd te Den Haag.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel2a
  - number: 2a.2
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1] is van toepassing op het bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: '3.1'
    text: Het bureau is belast met het beheer van het register.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel3
  - number: '3.2'
    text: |-
      Het bureau treedt bij de uitvoering van deze wet op als bevoegde autoriteit. Het bureau werkt in die hoedanigheid
      nauw samen met de bevoegde autoriteiten van andere betrokken staten en:
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel3
  - number: 3.2.a
    text: |-
      verstrekt aan of vraagt bij die autoriteiten gegevens op inzake tuchtrechtelijke maatregelen, strafrechtelijke
      sancties of andere ernstige feiten voor zover noodzakelijk voor de beoordeling van de rechtmatigheid van de toegang
      tot of de uitoefening van werkzaamheden op het gebied van architectuur, stedenbouw, tuin- en landschapsarchitectuur
      of interieurarchitectuur van of door een persoon die krachtens [artikel 13][ref1] is ingeschreven in het register
      of die op grond van dat artikel een verzoek tot inschrijving in het register heeft gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel13
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '13'
        hoofdstuk: IVb
  - number: 3.2.b
    text: |-
      gaat de juistheid na van de door de bevoegde autoriteit van een andere betrokken staat verstrekte informatie als
      bedoeld in onderdeel a en stelt die autoriteit in kennis van de bevindingen en de eventueel daaraan te verbinden
      gevolgen;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel3
  - number: 3.2.c
    text: |-
      ontvangt de voor de inschrijving in het register en de erkenning van de titel van architect, stedenbouwkundige,
      tuin- en landschapsarchitect of interieurarchitect noodzakelijke documenten of informatie, verstrekt aan een in het
      register ingeschreven persoon op diens verzoek afschriften van de bij de inschrijving ontvangen documenten of een
      verklaring omtrent de periode waarin de ingeschrevene geacht kan worden werkzaam te zijn geweest op zijn vakgebied
      en neemt de in de richtlijn bedoelde besluiten omtrent de erkenning van de titel die bij de opleiding behoort van
      de persoon die heeft verzocht om te worden ingeschreven in het register.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel3
  - number: '3.3'
    text: |-
      Het bureau verstrekt informatie over de voorschriften van de richtlijn met betrekking tot de erkenning van
      beroepskwalificaties voor architect, stedenbouwkundige, tuin- en landschapsarchitect of interieurarchitect, over
      de wettelijke voorschriften met betrekking tot de beroepsuitoefening van architect, stedenbouwkundige, tuin- en
      landschapsarchitect of interieurarchitect en over de inschrijving in een van die hoedanigheden in het register en
      de wettelijke gevolgen daarvan.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel3
  - number: '3.4'
    text: |-
      Het bureau biedt voorts belanghebbenden ondersteuning bij de uitoefening van hun rechten krachtens de
      richtlijn om in Nederland of een andere betrokken staat op het gebied van de architectuur, stedenbouw, tuin- en
      landschapsarchitectuur of interieurarchitectuur zelfstandig of in loondienst beroepswerkzaamheden te verrichten of
      op een van die gebieden tijdelijk en incidenteel overeenkomstig de richtlijn diensten te verrichten.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel3
  - number: '3.5'
    text: Het bureau verstrekt de informatie, bedoeld in het tweede lid, onder a en b, via het IMI.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel3
  - number: '3.6'
    text: |-
      Het bureau informeert het door Onze Minister op grond van
      [artikel 34d van de Algemene wet erkenning EU-beroepskwalificaties][ref1] aangewezen assistentiecentrum periodiek
      over de werkzaamheden die het op grond van het derde en vierde lid heeft verricht en over het resultaat van de door
      hem op grond van het vierde lid geboden ondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel34d
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: 34d
  - number: 3a.1
    text: |-
      Voor de toepassing van [artikel 3, tweede lid, onderdeel a][ref1], wordt, voor zover het de verstrekking
      van strafrechtelijke sancties betreft, een verklaring omtrent het gedrag aangemerkt als informatie omtrent
      strafrechtelijke sancties.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel3
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '3'
        hoofdstuk: III
        paragraaf: '1'
  - number: 3a.2
    text: |-
      In afwijking van [artikel 33 van de Wet justitiële en strafvorderlijke gegevens][ref1] wordt een
      aanvraag tot het afgeven van een verklaring omtrent het gedrag ten aanzien van een persoon als bedoeld in
      [artikel 3, tweede lid, onderdeel a][ref2], ingediend door een bevoegde autoriteit uit een andere betrokken staat.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel3
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0004189
        artikel: '3'
        hoofdstuk: III
        paragraaf: '1'
  - number: 3a.3
    text: |-
      Een aanvraag als bedoeld in het tweede lid wordt, in afwijking van
      [artikel 30, eerste lid, eerste volzin, van de Wet justitiële en strafvorderlijke gegevens][ref1] ingediend bij
      Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel30
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '30'
  - number: 3a.4
    text: |-
      Het bureau kan bij een bevoegde autoriteit uit een andere betrokken staat een verzoek indienen als bedoeld in
      [artikel 3, tweede lid, onderdeel a][ref1], mits het verzoek deugdelijk is gemotiveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel3
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '3'
        hoofdstuk: III
        paragraaf: '1'
  - number: 3b.1
    text: |-
      Voor de toepassing van de [artikelen 32, eerste lid][ref1], [34][ref2], [35][ref3] en
      [36 van de Wet justitiële en strafvorderlijke gegevens][ref4] wordt als aanvrager aangemerkt de persoon die
      krachtens [artikel 13][ref5] is ingeschreven in het register of die op grond van dat artikel een verzoek tot
      inschrijving in het register heeft gedaan ten aanzien van wie de verklaring omtrent het gedrag wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0014194#Artikel36
      [ref5]: https://wetten.overheid.nl/BWBR0004189#Artikel13
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0014194
        artikel: '35'
      - id: ref4
        bwb_id: BWBR0014194
        artikel: '36'
      - id: ref5
        bwb_id: BWBR0004189
        artikel: '13'
        hoofdstuk: IVb
  - number: 3b.2
    text: |-
      Onze Minister van Justitie stelt de persoon, bedoeld in het eerste lid, ten aanzien van wie de verklaring omtrent
      het gedrag wordt gevraagd in kennis van de aanvraag, bedoeld in [artikel 3a, tweede lid][ref1], en vraagt zijn
      instemming met het in behandeling nemen van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel3a
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: 3a
        hoofdstuk: III
        paragraaf: '1'
  - number: 3b.3
    text: |-
      Indien de persoon, bedoeld in het eerste lid, geen instemming verleent, bericht Onze Minister van Justitie dit aan
      de bevoegde autoriteit uit een andere betrokken staat die de verklaring omtrent het gedrag heeft aangevraagd.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel3b
  - number: 3c.1
    text: |-
      Onze Minister van Justitie informeert de persoon, bedoeld in [artikel 3b, eerste lid][ref1], ten aanzien van wie
      de verklaring omtrent het gedrag wordt gevraagd indien hij voornemens is de afgifte van de verklaring omtrent het
      gedrag te weigeren.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel3b
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: 3b
        hoofdstuk: III
        paragraaf: '1'
  - number: 3c.2
    text: |-
      Onze Minister van Justitie verstrekt de verklaring omtrent het gedrag dan wel de weigering tot afgifte daarvan aan
      de persoon, bedoeld in [artikel 3b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel3b
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: 3b
        hoofdstuk: III
        paragraaf: '1'
  - number: 3c.3
    text: |-
      Onze Minister van Justitie stelt de bevoegde autoriteit uit een andere betrokken staat zo spoedig mogelijk op de
      hoogte van de afgifte dan wel weigering van de verklaring omtrent het gedrag. Bij de kennisgeving over de afgifte
      van de verklaring omtrent het gedrag wordt de strekking van de afgegeven verklaring omtrent het gedrag medegedeeld.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel3c
  - number: 3c.4
    text: |-
      Indien de weigering van de verklaring omtrent het gedrag nog niet onherroepelijk is, informeert Onze Minister van
      Justitie de bevoegde autoriteit van een andere betrokken staat daarover.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel3c
  - number: '4.1'
    text: |-
      Het bureau betrekt de beroepsorganisaties en de ongeorganiseerden bij de voorbereiding van de nadere eisen en
      regels, bedoeld in de [artikelen 12a, tweede lid][ref1], [12b, derde lid][ref2], en [12e, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel12b
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel12e
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: 12a
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004189
        artikel: 12b
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004189
        artikel: 12e
        hoofdstuk: IVa
  - number: '4.2'
    text: |-
      Het bureau betrekt voorts bij de voorbereiding van de regels, bedoeld in de
      [artikelen 12b, derde lid][ref1], en [12e, tweede lid][ref2], de onderwijsinstellingen, bedoeld in de
      [artikelen 9, eerste lid, onderdelen a tot en met c][ref3], [10, eerste lid, onderdelen a tot en met c][ref4],
      [11, eerste lid, onderdelen a tot en met c][ref5], en [12, eerste lid, onderdelen a tot en met c][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel12e
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0004189#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0004189#Artikel11
      [ref6]: https://wetten.overheid.nl/BWBR0004189#Artikel12
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: 12b
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004189
        artikel: 12e
        hoofdstuk: IVa
      - id: ref3
        bwb_id: BWBR0004189
        artikel: '9'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004189
        artikel: '10'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0004189
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0004189
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '4.3'
    text: |-
      De regels die het bureau krachtens de [artikelen 12b, derde lid][ref1], en [12e, tweede lid][ref2], vaststelt en
      de nadere eisen die het bureau krachtens [artikel 12a, tweede lid][ref3], vaststelt, behoeven de goedkeuring van
      Onze Minister, en ingeval de regels of nadere eisen betrekking hebben op tuin- en landschapsarchitecten, van Onze
      Minister van Landbouw, Natuur en Voedselkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel12e
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel12a
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: 12b
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004189
        artikel: 12e
        hoofdstuk: IVa
      - id: ref3
        bwb_id: BWBR0004189
        artikel: 12a
        hoofdstuk: IV
        paragraaf: '2'
  - number: '4.4'
    text: |-
      Indien het bureau toepassing geeft aan [artikel 27a, derde lid][ref1], betrekt het de beroepsorganisaties
      en de ongeorganiseerden bij de voorbereiding van de in dat lid bedoelde beleidsregels. Het derde lid is van
      overeenkomstige toepassing op zodanig vastgestelde beleidsregels.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel27a
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: 27a
        hoofdstuk: VI
  - number: '5.1'
    text: |-
      Het bestuur bestaat uit ten hoogste drie leden. Ingeval Onze Minister het aantal bestuursleden op twee of drie
      stelt, benoemt hij één lid tot voorzitter.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel5
  - number: '5.2'
    text: |-
      Een lid van het bestuur wordt voor ten hoogste vier jaar benoemd en kan na het verstrijken van de termijn waarvoor
      hij is benoemd aansluitend daarop één keer voor dezelfde periode worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel5
  - number: '5.3'
    text: |-
      Ingeval Onze Minister het aantal bestuursleden op twee of drie stelt, stelt Onze Minister, behoudens spoedeisende
      gevallen, de beroepsorganisaties in de gelegenheid voor één te vervullen plaats in het bestuur een gezamenlijke
      voordracht te doen van ten minste drie personen. Ingeval een bestuurslid voor herbenoeming in aanmerking komt,
      kan in plaats van een voordracht van ten minste drie personen het voorstel worden gedaan dat bestuurslid te
      herbenoemen.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel5
  - number: '6'
    text: Het bestuur stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel6
  - number: '7.1'
    text: |-
      Het bureau draagt alle kosten die uit de uitvoering van de aan hem bij deze wet opgedragen taken voortvloeien,
      behoudens het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel7
  - number: '7.2'
    text: |-
      De taken, bedoeld in [artikel 3, tweede lid, onderdelen a en b, derde en vierde lid][ref1], en de
      vaststelling van de nadere eisen, bedoeld in [artikel 12a, tweede lid][ref2], en van de regels, bedoeld in de
      [artikelen 12b, derde lid][ref3], [12e, tweede lid][ref4], en [27a, derde lid][ref5], worden bekostigd door Onze
      Minister voor zover die taken, nadere eisen of regels betrekking hebben op architecten, stedenbouwkundigen en
      interieurarchitecten, en door Onze Minister van Landbouw, Natuur en Voedselkwaliteit voor zover die taken, nadere
      eisen of regels betrekking hebben op tuin- en landschapsarchitecten.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel12a
