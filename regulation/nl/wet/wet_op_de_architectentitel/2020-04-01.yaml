    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel10
  - number: '10.2'
    text: |-
      Een persoon kan krachtens [artikel 28][ref1] of [29][ref2] als stedenbouwkundige in het register worden
