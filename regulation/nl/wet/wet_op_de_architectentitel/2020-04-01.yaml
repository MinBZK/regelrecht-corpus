      interieurarchitectuur, dat of die door het daartoe bij of krachtens wet in een andere betrokken staat aangewezen
      bevoegd gezag overeenkomstig artikel 2, tweede lid, van de richtlijn is erkend, mits hij kan worden aangemerkt als
      migrerend beroepsbeoefenaar en in het bezit is van een door dat gezag afgegeven verklaring dat hij ten minste drie
      jaar beroepservaring in die staat heeft op het gebied van interieurarchitectuur, of
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12
  - number: 12.1.f
    text: |-
      een getuigschrift op het gebied van interieurarchitectuur, dat door een daartoe bevoegde instelling in een derde
      land is verstrekt en door het bureau, na een daartoe ingesteld onderzoek, is erkend.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12
  - number: '12.2'
    text: |-
      Een persoon kan krachtens [artikel 28][ref1] of [29][ref2] als interieurarchitect in het register worden
      ingeschreven op grond van een ander getuigschrift dan bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel29
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '28'
        hoofdstuk: VIIa
      - id: ref2
        bwb_id: BWBR0004189
        artikel: '29'
        hoofdstuk: VIIa
  - number: '12.3'
    text: |-
      Onze Minister stelt nadere regels over de inrichting welke degene die op grond van het voldoen aan een der eisen,
      bedoeld in het eerste lid, onderdeel a, b of c, inschrijving in het register wenst te verkrijgen aan zijn opleiding
      moet hebben gegeven.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12
  - number: 12a.1
    text: |-
      Het bureau kan, gehoord een door hem ingestelde commissie van deskundigen, een persoon, die werkzaam is op het
      gebied van architectuur, stedenbouw, tuin- en landschapsarchitectuur of interieurarchitectuur en die zich door
      de kwaliteit van zijn prestaties op het betreffende gebied naar het oordeel van het bureau in het bijzonder heeft
      onderscheiden, een certificaat verlenen op grond waarvan hij zich kan doen inschrijven in het register.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12a
  - number: 12a.2
    text: |-
      Het bureau stelt nadere eisen vast, waaraan een ingeschrevene moet voldoen, die onder een andere
      titel in het register wenst te worden ingeschreven. Het verzoek kan uitsluitend worden gedaan door
      een persoon, die in het register is ingeschreven op grond van een getuigschrift als bedoeld in
      [artikel 9, eerste lid, onderdeel a, b of c][ref1], [10, eerste lid, onderdeel a, b of c][ref2],
      [11, eerste lid, onderdeel a, b of c][ref3], of [12, eerste lid, onderdeel a, b of c][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0004189#Artikel12
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '9'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004189
        artikel: '10'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004189
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004189
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 12a.3
    text: |-
      De nadere eisen, bedoeld in het tweede lid, hebben in ieder geval betrekking op het aantal jaren gedurende welke
      de verzoeker werkzaam is op het vakgebied waarvoor hij zich in het register wenst in te schrijven, op de kwaliteit
      en kwantiteit van de door hem geleverde prestaties op het desbetreffende vakgebied en ingeval hij deel uitmaakt van
      een multidisciplinair team op de meetbaarheid van de aan hem toe te rekenen prestaties of inbreng.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12a
  - number: 12a.4
    text: |-
      Het bureau hoort een door hem ingestelde commissie van deskundigen alvorens te beslissen op een verzoek als bedoeld
      in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12a
  - number: 12b.1
    text: |-
      Ten minste eenmaal per jaar geeft het bureau de gelegenheid tot het afleggen van een examen voor architecten,
      stedenbouwkundigen, tuin- en landschapsarchitecten en interieurarchitecten. Het bureau stelt voor elk van die
      disciplines een aparte examencommissie in.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12b
  - number: 12b.2
    text: |-
      Tot het afleggen van het examen, bedoeld in het eerste lid, wordt na betaling van het examengeld, toegelaten degene
      die ten genoegen van het bureau aantoont gedurende ten minste zeven jaar werkzaam te zijn geweest op het gebied
      waarop hij het examen wenst af te leggen.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12b
  - number: 12b.3
    text: |-
      Het bureau stelt regels vast met betrekking tot het examen, bedoeld in het eerste lid. Die regels hebben in ieder
      geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12b
  - number: 12b.3.a
    text: de eisen voor de toelating tot het afleggen van het examen;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12b
  - number: 12b.3.b
    text: de omvang en de inrichting van het examen;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12b
  - number: 12b.3.c
    text: de eisen voor het verkrijgen van vrijstelling van bepaalde onderdelen van het examen;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12b
  - number: 12b.3.d
    text: de commissie, belast met het afnemen van het examen en met het vaststellen van de uitslag daarvan;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12b
  - number: 12b.3.e
    text: de vergoeding van de leden van de examencommissie.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12b
  - number: 12b.4
    text: |-
      Een persoon die met goed gevolg het examen, bedoeld in het eerste lid, heeft afgelegd, kan op diens verzoek worden
      ingeschreven in het register.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12b
  - number: 12c.1
    text: |-
      Een persoon die in het bezit is van een opleidingstitel op het gebied van architectuur als bedoeld in artikel
      21 van de richtlijn, of van een opleidingstitel als bedoeld in [artikel 10, eerste lid, onderdeel d][ref1],
      [11, eerste lid, onderdeel d][ref2], of [12, eerste lid, onderdeel d][ref3], wordt in het register ingeschreven
      indien hij in de staat, waar hij die opleidingstitel heeft behaald, gerechtigd is beroepsmatig werkzaamheden te
      verrichten op het gebied van architectuur, stedenbouw, tuin- en landschapsarchitectuur of interieurarchitectuur of
      indien hij met goed gevolg de tweejarige beroepservaringperiode, bedoeld in [artikel 12e][ref4], heeft afgesloten
      of een naar het oordeel van het bureau daarmee vergelijkbare beroepservaring heeft opgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0004189#Artikel12e
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '10'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004189
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004189
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004189
        artikel: 12e
        hoofdstuk: IVa
  - number: 12c.2
    text: |-
      Een persoon die in het bezit is van een getuigschrift als bedoeld in [artikel 9, eerste lid, onderdeel j][ref1],
      [10, eerste lid, onderdeel f][ref2], [11, eerste lid, onderdeel f][ref3], of [12, eerste lid, onderdeel f][ref4],
      wordt in het register ingeschreven indien hij in het derde land, waar hij dat getuigschrift heeft behaald,
      gerechtigd is beroepsmatig werkzaamheden te verrichten op het gebied van architectuur, stedenbouw, tuin- en
      landschapsarchitectuur of interieurarchitectuur of indien hij met goed gevolg de tweejarige beroepservaringperiode,
      bedoeld in [artikel 12e][ref5], heeft afgesloten of een naar het oordeel van het bureau daarmee vergelijkbare
      beroepservaring heeft opgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0004189#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0004189#Artikel12e
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '9'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004189
        artikel: '10'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004189
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004189
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0004189
        artikel: 12e
        hoofdstuk: IVa
  - number: 12d.1
    text: |-
      Een persoon die in het bezit is van een getuigschrift van een opleiding als bedoeld in
      [artikel 9, eerste lid, onderdeel a, b of c][ref1], [10, eerste lid, onderdeel a, b of c][ref2],
      [11, eerste lid, onderdeel a, b of c][ref3], of [12, eerste lid, onderdeel a, b of c][ref4], waarvan de inrichting
      voldoet aan de voorschriften, bedoeld in het derde lid van die artikelen, wordt op verzoek in het register
      ingeschreven, indien hij met goed gevolg de tweejarige beroepservaringperiode, bedoeld in [artikel 12e][ref5],
      heeft afgesloten of een naar het oordeel van het bureau daarmee vergelijkbare beroepservaring heeft opgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0004189#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0004189#Artikel12e
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '9'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004189
        artikel: '10'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004189
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004189
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0004189
        artikel: 12e
        hoofdstuk: IVa
  - number: 12d.2
    text: |-
      Het eerste lid is niet van toepassing op een persoon, die in het jaar waarin de regels, bedoeld in
      [artikel 12e][ref1], worden bekend gemaakt of in de twee daaropvolgende jaren het getuigschrift, bedoeld in het
      eerste lid, heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel12e
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: 12e
        hoofdstuk: IVa
  - number: 12d.3
    text: |-
      Het bureau kan besluiten dat het getuigschrift van een opleiding als bedoeld in
      [artikel 9, eerste lid, onderdeel b][ref1], [10, eerste lid, onderdeel b][ref2],
      [11, eerste lid, onderdeel b][ref3], of [12, eerste lid, onderdeel b][ref4], een vrijstelling oplevert van de
      tweejarige beroepservaringperiode, bedoeld in [artikel 12e][ref5], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0004189#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0004189#Artikel12e
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '9'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004189
        artikel: '10'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004189
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004189
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0004189
        artikel: 12e
        hoofdstuk: IVa
  - number: 12d.3.a
    text: |-
      het praktijkgedeelte van die opleiding wat betreft inrichting en inhoud vergelijkbaar is aan hetgeen daaromtrent
      krachtens [artikel 12e, tweede lid][ref1], is bepaald ten aanzien van de tweejarige beroepservaringperiode;


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel12e
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: 12e
        hoofdstuk: IVa
  - number: 12d.3.b
    text: |-
      geborgd is dat de persoon die in het bezit is van het getuigschrift het praktijkgedeelte van die opleiding
      overeenkomstig onderdeel a heeft gevolgd, en
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12d
  - number: 12d.3.c
    text: geborgd is dat het bureau tijdig in kennis wordt gesteld van een voornemen tot wijziging in het praktijkgedeelte.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12d
  - number: 12d.4
    text: |-
      Het bureau erkent de in een andere betrokken staat gevolgde beroepservaringperiode, indien deze in overeenstemming
      is met de regels, bedoeld in [artikel 12e][ref1], en houdt rekening met de in een derde land gevolgde
      beroepservaringperiode. Een erkenning van een beroepservaringperiode als bedoeld in de eerste volzin vervangt niet
      een voor de toegang tot het desbetreffende beroep verplicht af te leggen examen.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel12e
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: 12e
        hoofdstuk: IVa
  - number: 12e.1
    text: |-
      De tweejarige beroepservaringperiode is gericht op het zich in de praktijk bekwamen in de
      uitoefening van het beroep waarvoor met goed gevolg een opleiding is gevolgd als bedoeld in
      [artikel 9, eerste lid, onderdeel a, b of c][ref1], [10, eerste lid, onderdeel a, b of c][ref2],
      [11, eerste lid, onderdeel a, b of c][ref3], of [12, eerste lid, onderdeel a, b of c][ref4], onder begeleiding van
      een persoon die bij de aanvang van de begeleiding blijkens de inschrijving in het register ten minste drie jaar
      beroepsmatig werkzaam is in datzelfde beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0004189#Artikel12
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12e
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '9'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004189
        artikel: '10'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004189
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004189
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 12e.2
    text: |-
      Het bureau stelt regels vast met betrekking tot de tweejarige beroepservaringperiode. Die regels hebben in ieder
      geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12e
  - number: 12e.2.a
    text: de inrichting van die periode;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12e
  - number: 12e.2.b
    text: |-
      het niveau van kennis, inzicht en vaardigheden, waarover een persoon als bedoeld in
      [artikel 12d, eerste lid][ref1], in ieder geval dient te beschikken na het doorlopen van die periode;


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel12d
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12e
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: 12d
        hoofdstuk: IVa
  - number: 12e.2.c
    text: de wijze waarop die periode wordt afgesloten;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12e
  - number: 12e.2.d
    text: |-
      voorwaarden waaronder geheel of gedeeltelijk vrijstelling kan worden verkregen van het gedurende twee jaar
      doorlopen van die periode;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12e
  - number: 12e.2.e
    text: |-
      de inrichting en de erkenning van de beroepservaringperiode die in een andere betrokken staat of een derde land
      wordt gevolgd, en de duur van het deel van die periode dat in het buitenland mag worden gevolgd;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12e
  - number: 12e.2.f
    text: de begeleiding;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12e
  - number: 12e.2.g
    text: een voorziening in geval van een conflict tussen de begeleider en de persoon die hij begeleidt.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel12e
  - number: '13.1'
    text: |-
      Een persoon die in het register wenst te worden ingeschreven, dient daartoe een verzoek in bij het bureau.
      Een verzoek gaat vergezeld van de stukken aan de hand waarvan het bureau de identiteit, de opleiding en de
      beroepservaring van de verzoeker kan vaststellen.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel13
  - number: '13.2'
    text: |-
      Het bureau kan een verzoek als bedoeld in het eerste lid of een aanvraag als bedoeld in het derde lid niet in
      behandeling nemen indien de krachtens [artikel 8, aanhef en onderdeel a of b][ref1], vastgestelde vergoeding niet
      is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel8
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '8'
        hoofdstuk: III
        paragraaf: '3'
  - number: '13.3'
    text: |-
      Het bureau bevestigt binnen een maand de ontvangst van een aanvraag om erkenning van een opleidingstitel
      als bedoeld in [artikel 9, eerste lid, onderdeel h][ref1], [10, eerste lid, onderdeel d][ref2],
      [11, eerste lid, onderdeel d][ref3], of [12, eerste lid, onderdeel d][ref4], of van een getuigschrift als bedoeld
      in artikel 9, eerste lid, onderdeel j, 10, eerste lid, onderdeel f, 11, eerste lid, onderdeel f, of 12, eerste lid,
      onderdeel f. Het wijst er in die bevestiging op dat het besluit omtrent de aangevraagde erkenning gelijktijdig een
      besluit kan inhouden omtrent inschrijving in het register indien de aanvrager alsnog verzoekt om inschrijving in
      het register overeenkomstig het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0004189#Artikel12
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '9'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004189
        artikel: '10'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004189
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004189
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '13.4'
    text: |-
      Indien een persoon blijkens zijn verzoek om inschrijving in het register in het bezit is van een
      opleidingstitel als bedoeld in [artikel 9, eerste lid, onderdeel h][ref1], [10, eerste lid, onderdeel d][ref2],
      [11, eerste lid, onderdeel d][ref3], of [12, eerste lid, onderdeel d][ref4], of van een getuigschrift als bedoeld
      in artikel 9, eerste lid, onderdeel j, 10, eerste lid, onderdeel f, 11, eerste lid, onderdeel f, of 12, eerste lid,
      onderdeel f, die of dat nog niet door het bureau is erkend, merkt het bureau het verzoek om inschrijving tevens
      aan als een aanvraag om erkenning van die opleidingstitel of dat getuigschrift. Het bureau doet daarvan binnen een
      maand na de ontvangst mededeling in de bevestiging van de ontvangst van het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0004189#Artikel12
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '9'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004189
        artikel: '10'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004189
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004189
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '13.5'
    text: |-
      Het bureau neemt in een geval waarin een aanvraag om erkenning of een verzoek om inschrijving in het
      register betrekking heeft op een opleidingstitel als bedoeld in [artikel 9, eerste lid, onderdeel h][ref1],
      [10, eerste lid, onderdeel d][ref2], [11, eerste lid, onderdeel d][ref3], of [12, eerste lid, onderdeel d][ref4],
      binnen drie maanden na ontvangst van alle stukken die het nodig acht voor zijn oordeelsvorming een besluit omtrent
      de erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0004189#Artikel12
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '9'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004189
        artikel: '10'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004189
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004189
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '13.6'
    text: |-
      Indien het bureau toepassing geeft aan [artikel 11 van de Algemene wet erkenning EU-beroepskwalificaties][ref1]
      houdt het het besluit omtrent de erkenning aan overeenkomstig [artikel 19, derde lid, van die wet][ref2]. Het derde
      en vierde lid van dat artikel zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel19
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '19'
  - number: '14.1'
    text: |-
      Het bureau draagt zorg dat na het nemen van een besluit tot inschrijving ten spoedigste inschrijving van de
      verzoeker in het register plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel14
  - number: '14.2'
    text: |-
      In het register worden opgenomen naam, voornamen, geboortedatum, adres en opleiding van de verzoeker, alsmede de
      titel waaronder de inschrijving is verkregen.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel14
  - number: '14.3'
    text: Het bureau verstrekt de aanvrager onmiddellijk na de inschrijving in het register een bewijs van inschrijving.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel14
  - number: '15'
    text: |-
      Het bureau kan bepalen dat de indiener van het verzoek in persoon voor hem zal verschijnen. De oproeping maakt van
      een zodanig besluit melding.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel15
  - number: '16'
    text: |-
      Dadelijk na inschrijving in het register en voorts telkens na verloop van een jaar is de ingeschrevene de krachtens
      [artikel 8, aanhef en onderdeel d][ref1], vastgestelde vergoeding verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel8
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '8'
        hoofdstuk: III
        paragraaf: '3'
  - number: '17.1'
    text: 'Het bureau haalt een inschrijving in het register door:'
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel17
  - number: 17.1.a
    text: indien de inschrijving, gelet op het bij of krachtens deze wet bepaalde, ten onrechte is geschied;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel17
  - number: 17.1.b
    text: |-
      indien de ingeschrevene niet voldoet aan de verplichting tot het betalen van de in [artikel 16, eerste lid][ref1],
      bedoelde bijdrage;


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel16
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '16'
        hoofdstuk: IVb
  - number: 17.1.c
    text: op verzoek van de ingeschrevene;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel17
  - number: 17.1.d
    text: na het overlijden van de ingeschrevene.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel17
  - number: '17.2'
    text: |-
      Een besluit tot doorhaling van de inschrijving op grond van het bepaalde in het eerste lid, onder *a*, wordt niet
      genomen dan nadat overeenkomstige toepassing is gegeven aan [artikel 4:7 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '17.3'
    text: |-
      Een besluit tot doorhaling van de inschrijving op grond van het bepaalde in het eerste lid, onder *b*, wordt niet
      genomen dan nadat vier weken zijn verstreken na de dag, waarop de betrokkene op zijn verzuim en het in het eerste
      lid bedoelde gevolg daarvan is gewezen.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel17
  - number: '17.4'
    text: |-
      Elke doorhaling van een inschrijving op een der gronden, bedoeld in het eerste lid, onderdelen a tot en met c,
      wordt onmiddellijk bekendgemaakt, onder vermelding van hetgeen in [artikel 18][ref1] is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel18
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '18'
        hoofdstuk: IVb
  - number: '17.5'
    text: Het bureau houdt aantekening van de doorhalingen en van de data waarop deze zijn geschied.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel17
  - number: '18.1'
    text: |-
      Degene, van wie de inschrijving op grond van [artikel 17, eerste lid, onderdeel b of c][ref1], is doorgehaald, kan
      het bureau verzoeken de doorhaling ongedaan te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel17
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '17'
        hoofdstuk: IVb
  - number: '18.2'
    text: |-
      Het in het eerste lid bedoelde verzoek wordt niet in behandeling genomen zolang niet de krachtens
      [artikel 8, aanhef en onderdeel a][ref1], vastgestelde vergoeding is betaald, en zolang niet de reeds vóór het
      tijdstip van doorhaling verschuldigde, maar nog niet betaalde vergoedingen als bedoeld in artikel 8, aanhef en
      onderdeel d, zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel8
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '8'
        hoofdstuk: III
        paragraaf: '3'
  - number: '19.1'
    text: |-
      Het bureau maakt binnen vier weken na ontvangst van het verzoek, bedoeld in [artikel 18, eerste lid][ref1], de
      doorhaling ongedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel18
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '18'
        hoofdstuk: IVb
  - number: '19.2'
    text: |-
      [Artikel 14, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel14
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '14'
        hoofdstuk: IVb
  - number: '20'
    text: |-
      Voor de toepassing van het bepaalde in [artikel 16, eerste lid][ref1], geldt het tijdstip waarop een doorhaling
      ongedaan is gemaakt als tijdstip van inschrijving in het register.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel16
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '16'
        hoofdstuk: IVb
  - number: '22.1'
    text: |-
      Het bureau doet aan iedere verzoeker schriftelijk opgave of een persoon in het register staat ingeschreven en onder
      welke titel.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel22
  - number: '22.2'
    text: |-
      Na ontvangst van de opgave, bedoeld in het eerste lid, kan de verzoeker inzage verlangen in de stukken, die aan de
      inschrijving ten grondslag liggen. De inzage geschiedt, na de indiening bij het bureau van een daartoe strekkend
      schriftelijk verzoek, op een door het bureau te bepalen tijdstip ten kantore van het bureau.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel22
  - number: '23.1'
    text: |-
      Gerechtigd tot het voeren van de titel van architect, stedenbouwkundige, tuin- en landschapsarchitect of
      interieurarchitect of een afkorting van die titel, hetzij zonder nadere aanduiding, hetzij in woordsamenstellingen
      waarin de titel of een afkorting daarvan voorkomt, is uitsluitend hij die onder deze titel in het register staat
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel23
  - number: '23.2'
    text: |-
      Het bureau, beroepsorganisaties en rechtspersonen met volledige rechtsbevoegdheid die ten doel hebben of mede ten
      doel hebben de behartiging van belangen van de eindgebruikers van de goederen en diensten der ingeschrevenen in het
      register kunnen in rechte vorderen dat degene die zonder daartoe gerechtigd te zijn een titel voert als bedoeld in
      het eerste lid, wordt veroordeeld zich daarvan te onthouden.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel23
  - number: '23.3'
    text: |-
      Deze rechtsvordering komt mede toe aan iedere gerechtigde, als bedoeld in het eerste lid, voorzover de titel wordt
      gevoerd waaronder de gerechtigde in het register staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel23
  - number: '23.4'
    text: |-
      Van een rechtsvordering als bedoeld in het tweede en derde lid, neemt de kantonrechter kennis, behoudens hoger
      beroep.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel23
  - number: '23.5'
    text: |-
      Het eerste tot en met vierde lid is niet van toepassing met betrekking tot het voeren van een titel als bedoeld in
      het eerste lid, of een afkorting van die titel, hetzij zonder nadere aanduiding, hetzij in een woordsamenstelling
      waarin die titel of een afkorting daarvan voorkomt, indien degene die gebruik maakt van die titel of afkorting geen
      werkzaamheden verricht die overeenkomen met werkzaamheden die in het economisch verkeer worden verricht door een
      architect, stedenbouwkundige, tuin- en landschapsarchitect of interieurarchitect.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel23
  - number: 23a.1
    text: |-
      Een bureau dat werkzaam is op het gebied van architectuur, stedenbouw, tuin- en landschapsarchitectuur
      of interieurarchitectuur is slechts gerechtigd in of bij zijn naam een titel als bedoeld in
      [artikel 23, eerste lid][ref1], of een afkorting van die titel, hetzij zonder nadere aanduiding, hetzij in een
      woordsamenstelling waarin die titel of een afkorting daarvan voorkomt, te voeren, indien de bestuurder van dat
      bureau of ten minste de helft van de bestuurders krachtens deze wet gerechtigd is om de desbetreffende titel te
      voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel23
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '23'
        hoofdstuk: V
  - number: 23a.2
    text: |-
      Een bureau dat aan het eerste lid voldoet, is slechts gerechtigd in of bij zijn naam een titel of afkorting als
      bedoeld in dat lid te combineren met een naam van een natuurlijke persoon indien die persoon krachtens deze wet
      gerechtigd is de desbetreffende titel te voeren.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel23a
  - number: 23a.3
    text: |-
      Tegen een bureau dat handelt in strijd met het eerste of tweede lid kan overeenkomstig
      [artikel 23, tweede of derde lid][ref1], een vordering worden ingesteld als bedoeld in artikel 23, tweede lid. Op
      die vordering is artikel 23, vierde lid, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel23
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '23'
        hoofdstuk: V
  - number: '24.1'
    text: |-
      Onverminderd [artikel 23, eerste lid][ref1], is degene die voldoet aan
      [artikel 9, eerste lid, onderdeel d, e, f, g, h of i][ref2], [10, eerste lid, onderdeel d of e][ref3],
      [11, eerste lid, onderdeel d of e][ref4], of [12, eerste lid, onderdeel d of e][ref5], gerechtigd gebruik te maken
      van de wettige in een andere betrokken staat gevoerde titel of afkorting daarvan in de officiële taal van die staat
      of in één van de officiële talen van die staat.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0004189#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0004189#Artikel12
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '23'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004189
        artikel: '9'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004189
        artikel: '10'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004189
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0004189
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '24.2'
    text: |-
      Het bureau kan bepalen dat bij het voeren van een titel als bedoeld in het eerste lid, tevens de naam en de plaats
      van vestiging van de instelling of de examencommissie die deze titel heeft verleend, moet worden vermeld.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel24
  - number: 27a.1
    text: |-
      Behoudens het tweede lid is een persoon die is ingeschreven in het register gehouden om door middel van bij- en
      nascholing de ontwikkelingen op zijn vakgebied bij te houden in ten minste 16 uur per jaar.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel27a
  - number: 27a.2
    text: 'Een persoon die is ingeschreven in het register is niet gehouden tot bij- en nascholing, indien hij:'
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel27a
  - number: 27a.2.a
    text: is ingeschreven als dienstverrichter, of
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel27a
  - number: 27a.2.b
    text: op diens verzoek in het register wordt aangemerkt als niet beroepsmatig actief.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel27a
  - number: 27a.3
    text: Het bureau kan kwalitatieve beleidsregels vaststellen ter zake van passende bij- en nascholing.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel27a
  - number: 27aa
    text: |-
      Degene die is ingeschreven in het register informeert de persoon die hem een offerte vraagt over zijn relevante
      deskundigheid en vakbekwaamheid, met inbegrip van zijn bij- en nascholingsactiviteiten, de dekking van de door hem
      te verrichten werkzaamheden door een beroepsaansprakelijkheidsverzekering, diens rechten en plichten jegens hem
      als opdrachtgever en de borging daarvan, alsmede over diens rechten en plichten jegens een derde, ingeval die derde
      het werk heeft ontworpen waarop de offerte betrekking heeft of werkzaamheden heeft gestaakt die blijkens de offerte
      dienen te worden hervat.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel27aa
  - number: 27b.1
    text: |-
      Een dienstverrichter die niet in het register is ingeschreven, voert in Nederland uitsluitend de beroepstitel
      die hij voert in de betrokken staat waar hij is gevestigd in de officiële taal van die staat of in één van de
      officiële talen van die staat. Indien die titel in de betrokken staat waar hij is gevestigd niet bestaat treedt de
      dienstverrichter in Nederland op onder vermelding van de titel die bij zijn opleiding hoort in de officiële taal
      van de staat waar hij is gevestigd of in één van de officiële talen van die staat.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel27b
  - number: 27b.2
    text: |-
      Een dienstverrichter heeft het recht gebruik te maken van academische titels die hem zijn verleend in een andere
      betrokken staat, en eventueel van de afkorting daarvan, in de officiële taal van die staat of in één van de
      officiële talen van die staat. [Artikel 24, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel24
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '24'
        hoofdstuk: V
  - number: 27b.3
    text: |-
      Een dienstverrichter kan op verzoek voor de duur van de dienstverrichting onder vermelding van die hoedanigheid
      als architect, stedenbouwkundige, tuin- en landschapsarchitect of interieurarchitect worden ingeschreven in het
      register. De dienstverrichter doet bij zijn aanvraag de volgende stukken aan het bureau toekomen:
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel27b
  - number: 27b.3.a
    text: |-
      een verklaring dat hij op wettige wijze in zijn staat is gevestigd om beroepsmatig werkzaamheden te verrichten op
      het gebied van architectuur, stedenbouw, tuin- en landschapsarchitectuur of interieurarchitectuur en dat hem op het
      moment van afgifte van de verklaring geen verbod tot beroepsuitoefening is opgelegd;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel27b
  - number: 27b.3.b
    text: een bewijs van nationaliteit;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel27b
  - number: 27b.3.c
    text: |-
      ingeval het beroep niet is gereglementeerd in zijn staat een bewijs dat hij het betreffende beroep ten minste een
      jaar heeft uitgeoefend tijdens de tien jaar voorafgaande aan de dienstverrichting.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel27b
  - number: 27b.4
    text: Een ingeschreven dienstverrichter kan zijn inschrijving als dienstverrichter telkens met een jaar verlengen.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel27b
  - number: 27b.5
    text: Het bureau beslist binnen vier weken na ontvangst van een verzoek als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel27b
  - number: 27b.6
    text: |-
      De inschrijving van een dienstverrichter of de verlenging van die inschrijving wordt geëffectueerd zodra het bureau
      de krachtens [artikel 8, aanhef en onderdeel a of d][ref1], vastgestelde vergoeding heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel8
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '8'
        hoofdstuk: III
        paragraaf: '3'
  - number: 27c.1
    text: |-
      Het bureau kan bij of aan een bestuursorgaan gegevens van een dienstverrichter opvragen of verstrekken voor zover
      noodzakelijk voor de afhandeling van een klacht van een afnemer over de dienstverrichter in het kader van zijn
      dienstverrichting.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel27c
  - number: 27c.2
    text: |-
      Het bureau kan bij de bevoegde autoriteit van een andere betrokken staat gegevens van een dienstverrichter opvragen
      voor zover noodzakelijk voor de afhandeling van een klacht van een afnemer over de dienstverrichter in het kader
      van zijn dienstverrichting.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel27c
  - number: 27c.3
    text: |-
      Het bureau verstrekt aan de bevoegde autoriteit van een andere betrokken staat gegevens van een in het register
      ingeschrevene voor zover noodzakelijk voor de afhandeling van een klacht van een afnemer over die ingeschrevene in
      het kader van zijn dienstverrichting.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel27c
  - number: '28.1'
    text: |-
      Onverminderd de doorhaling van een inschrijving in het register krachtens [artikel 17][ref1] blijft degene die in
      het register is ingeschreven door de Stichting bureau architectenregister ingeschreven in het register.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel17
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '17'
        hoofdstuk: IVb
  - number: '28.2'
    text: |-
      Een persoon van wie de inschrijving in het register door de Stichting bureau architectenregister is doorgehaald,
      kan het bureau verzoeken de doorhaling ongedaan te maken. Op dat verzoek en de behandeling daarvan zijn de
      [artikelen 18 tot en met 20][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel18
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '18'
        hoofdstuk: IVb
  - number: '29.1'
    text: |-
      Een persoon kan op verzoek in het register worden ingeschreven als architect, stedenbouwkundige, tuin- en
      landschapsarchitect of interieurarchitect op grond van een ander door hem in Nederland behaald getuigschrift
      dan genoemd in [artikel 9, eerste lid, onderdeel a, b of c][ref1], [10, eerste lid, onderdeel a, b of c][ref2],
      [11, eerste lid, onderdeel a, b of c][ref3], [12, eerste lid, onderdeel a, b of c][ref4], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0004189#Artikel12
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '9'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004189
        artikel: '10'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004189
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004189
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 29.1.a
    text: |-
      hij dat getuigschrift in zijn bezit had op het tijdstip van inwerkingtreding van
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ______________________________________________________________________________________________________, en


      [ref1]: https://wetten.overheid.nl/BWBR0027415#ArtikelI
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0027415
        artikel: I
  - number: 29.1.b
    text: |-
      dat getuigschrift op de dag voorafgaand aan het tijdstip, bedoeld in onderdeel a, recht gaf op inschrijving in
      het register.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel29
  - number: '29.2'
    text: |-
      [Artikel 13, eerste en tweede lid][ref1], is van toepassing op een verzoek als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel13
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '13'
        hoofdstuk: IVb
  - number: '29.3'
    text: |-
      Onverminderd de overige eisen waaraan krachtens deze wet moet worden voldaan om op verzoek als interieurarchitect
      te worden ingeschreven in het register, kan een persoon op zijn verzoek in het register worden ingeschreven op
      grond van een ander getuigschrift dan genoemd in [artikel 12, eerste lid, onderdeel a, b of c][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel12
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 29.3.a
    text: hij daarvoor in Nederland een opleiding volgde op het tijdstip, bedoeld in het eerste lid, onderdeel a, en
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel29
  - number: 29.3.b
    text: |-
      dat getuigschrift op de dag voorafgaand aan het tijdstip, bedoeld in het eerste lid, onderdeel a, recht gaf op
      inschrijving in het register.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel29
  - number: '30'
    text: |-
      Een persoon die op het tijdstip, bedoeld in [artikel 28, eerste lid][ref1], of die daarna krachtens
      [artikel 29, eerste lid][ref2], in het register is ingeschreven als architect, stedenbouwkundige of tuin- en
      landschapsarchitect kan een overeenkomstig verzoek doen als bedoeld in [artikel 12a, tweede lid][ref3], indien hij
      voldoet aan de krachtens dat lid gestelde nadere eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel12a
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '28'
        hoofdstuk: VIIa
      - id: ref2
        bwb_id: BWBR0004189
        artikel: '29'
        hoofdstuk: VIIa
      - id: ref3
        bwb_id: BWBR0004189
        artikel: 12a
        hoofdstuk: IV
        paragraaf: '2'
  - number: '42.1'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, met uitzondering van
      [artikel 23][ref1] dat vijf jaar nadien in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel23
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '23'
        hoofdstuk: V
  - number: '42.2'
    text: Deze wet kan worden aangehaald als Wet op de architectentitel.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel42
