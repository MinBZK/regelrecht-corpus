  - number: '9.1'
    text: |-
      Onverminderd de overige eisen waaraan een persoon krachtens deze wet moet voldoen om op verzoek als architect in
      het register te worden ingeschreven, dient een persoon in het bezit te zijn van:
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel9
  - number: 9.1.a
    text: |-
      het getuigschrift van een masteropleiding op het gebied van architectuur aan een in de [bijlage bij de Wet op het
      hoger onderwijs en wetenschappelijk](onbekend) onderzoek genoemde universiteit;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel9
  - number: 9.1.b
    text: |-
      het getuigschrift van een masteropleiding op het gebied van architectuur aan een in de [bijlage bij de Wet op het
      hoger onderwijs en wetenschappelijk onderzoek](onbekend) genoemde hogeschool;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel9
  - number: 9.1.c
    text: |-
      een getuigschrift van een door Onze Minister aangewezen opleiding op het gebied van architectuur met een
      opleidingsniveau dat vergelijkbaar is met een opleiding als bedoeld in onderdeel a of b;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel9
  - number: 9.1.d
    text: |-
      een opleidingstitel op het gebied van architectuur als bedoeld in artikel 21 van de richtlijn, dan wel dient
      hij met inachtneming van de eisen die zijn gesteld in artikel 47 van de richtlijn, met goed gevolg het examen in
      de architectuur ter afsluiting van een opleiding die voldoet aan de in artikel 46, tweede lid, van de richtlijn
      gestelde eisen, te hebben afgelegd;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel9
  - number: 9.1.e
    text: |-
      een opleidingstitel op het gebied van architectuur als bedoeld in artikel 49, eerste lid, eerste alinea, lid 1 bis
      of het derde lid, van de richtlijn, van een verklaring als bedoeld in artikel 49, eerste lid, tweede alinea, van de
      richtlijn, of van een bevestigende verklaring als bedoeld in artikel 49, tweede lid, van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel9
  - number: 9.1.f
    text: |-
      een opleidingstitel op het gebied van architectuur als bedoeld in artikel 23, derde lid, eerste alinea, vierde
      lid, eerste alinea, of vijfde lid, eerste alinea, van de richtlijn, vergezeld van een verklaring als bedoeld in dat
      derde lid, tweede alinea, dat vierde lid, tweede alinea, of dat vijfde lid, tweede alinea;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel9
  - number: 9.1.g
    text: |-
      een certificaat dat overeenkomstig artikel 48, tweede lid, van de richtlijn door het daartoe bij of krachtens de
      wet in een andere betrokken staat aangewezen bevoegd gezag is afgegeven, inhoudende dat de betrokkene zich door de
      kwaliteit van zijn prestaties op het gebied van architectuur in het bijzonder heeft onderscheiden, zodat hij geacht
      wordt te voldoen aan de voorwaarden die in die staat worden gesteld voor de uitoefening van werkzaamheden van
      architect onder de beroepstitel van architect;
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel9
  - number: 9.1.h
    text: |-
      een opleidingstitel op het gebied van architectuur, die door het bureau,
      na een daartoe ingesteld onderzoek, met overeenkomstige toepassing van de
      [artikelen 5 tot en met 13 van de Algemene wet erkenning EU-beroepskwalificaties][ref1] is erkend, mits hij kan
      worden aangemerkt als migrerend beroepsbeoefenaar en om bijzondere en uitzonderlijke redenen niet voldoet aan de
      minimumopleidingseisen van artikel 46, eerste en tweede lid, van de richtlijn;


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 9.1.i
    text: |-
      een in een derde land behaald of verworven diploma, certificaat of andere titel op het gebied van architectuur, dat
      of die door het daartoe bij of krachtens wet in een andere betrokken staat aangewezen bevoegd gezag overeenkomstig
      artikel 2, tweede lid, van de richtlijn is erkend, mits hij kan worden aangemerkt als migrerend beroepsbeoefenaar
      en in het bezit is van een door dat gezag afgegeven verklaring dat hij ten minste drie jaar beroepservaring in die
      staat heeft op het gebied van architectuur, of
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel9
  - number: 9.1.j
    text: |-
      een getuigschrift op het gebied van architectuur, dat door een daartoe bevoegde instelling in een derde land is
      verstrekt ter afsluiting van een opleiding die naar het oordeel van het bureau voldoet aan de in artikel 46, eerste
      en tweede lid, van de richtlijn gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel9
  - number: '9.2'
    text: |-
      Een persoon kan krachtens [artikel 28][ref1] of [29][ref2] als architect in het register worden ingeschreven op
      grond van een ander getuigschrift dan bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel29
    url: https://wetten.overheid.nl/BWBR0004189/2020-04-01#Artikel9
    references:
