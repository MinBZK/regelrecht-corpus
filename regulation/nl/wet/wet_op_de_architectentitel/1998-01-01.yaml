      1 Inschrijving in het register als stedebouwkundige wordt verleend aan degene die voldoet aan een van de volgende
      eisen:

      a. in het bezit van een getuigschrift van een opleiding bouwkunde op het gebied van de techniek aan een in de
      [bijlage bij de Wet op het hoger onderwijs en wetenschappelijk onderzoek](onbekend) genoemde universiteit;

      b. in het bezit zijn van het op grond van artikel 29 van de Nijverheidsonderwijswet uitgereikte einddiploma
      Stedebouwkundig Hoger Onderricht;

      c. in het bezit zijn van het op grond van [artikel 29 van de Wet op het voortgezet onderwijs][ref1] uitgereikte
      einddiploma Stedebouwkundig Hoger Onderricht;

      d. in het bezit zijn van het op grond van [artikel 29 van de Wet op het voortgezet onderwijs][ref2]
      uitgereikte einddiploma van een Academie van Bouwkunst, het op grond van artikel 34, derde lid, van
      de Wet op het hoger beroepsonderwijs uitgereikte getuigschrift van een opleiding voor beroepen op
      het terrein van architectuur en stedebouw dan wel het getuigschrift van een met goed gevolg afgelegd
      afsluitend examen van een voortgezette opleiding bouwkunst verbonden aan een in de bijlage van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3] genoemde hogeschool;

      e. met goed gevolg hebben afgelegd een overeenkomstig het bepaalde in [hoofdstuk VI][ref4] ingericht en afgenomen
      examen voor stedebouwkundigen of daarvan, wegens ten genoegen van Onze Minister aangetoonde uitzonderlijke
      bekwaamheid, van Onze Minister ontheffing hebben verkregen;

      f. met goed gevolg hebben afgelegd het examen ter afsluiting van een door Onze Minister en na het horen van de
      representatief te achten beroepsorganisaties van stedebouwkundigen, aangewezen opleiding;

      g. in het bezit zijn van een ten aanzien van het beroep van stedebouwkundige afgegeven EG-
      verklaring als bedoeld in de Algemene wet erkenning EG-hoger-onderwijsdiploma's dan wel in de
      [Algemene wet erkenning EG-beroepsopleidingen][ref5];

      h. in het bezit zijn van een der door Onze Minister al dan niet op verzoek van een belanghebbende aangewezen
      diploma's die door instellingen in het buitenland, waaronder niet zijn begrepen instellingen, gevestigd in de
      lid-staten van de Europese Unie of de andere staten die partij zijn bij de Overeenkomst betreffende de Europese
      Economische Ruimte, zijn of worden verstrekt.

      2 Onze Minister kan nadere regels geven over de inrichting welke degene die op grond van het voldoen aan een der
      eisen bedoeld in het eerste lid, onder *a* tot en met *d*, inschrijving in het register wenst te verkrijgen aan
      zijn opleiding moet hebben gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel29
