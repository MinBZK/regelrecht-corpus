        artikel: '16'
        hoofdstuk: IV
  - number: '21'
    text: |-
      1 Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van
      Beroep voor het bedrijfsleven.

      2 [Artikel 8:4, onderdeel ][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel84
    url: https://wetten.overheid.nl/BWBR0004189/1998-01-01#Artikel21
    references:
