  - number: '13'
    text: |-
      1 Degene die van zijn ingevolge het bepaalde in de[ artikelen 9 tot en met 12][ref1] bestaande recht tot
      inschrijving in het register gebruik wenst te maken, dient bij het bureau een verzoek tot inschrijving in op een
      formulier waarvan het model door het bureau wordt vastgesteld. Het verzoek gaat vergezeld door stukken waaruit het
      bureau de opleiding van de verzoeker kan vaststellen. Een verzoek wordt geacht niet te zijn ingediend zolang niet
      een inschrijfgeld is betaald, indien en voorzover ingevolge het bepaalde in [artikel 7][ref2] hiervoor een bedrag
      is vastgesteld.

      2 Het bureau hoort hen die het dienstig acht te horen en neemt binnen dertien weken na ontvangst van het verzoek
      een beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel7
    url: https://wetten.overheid.nl/BWBR0004189/1998-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '9'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004189
        artikel: '7'
        hoofdstuk: III
  - number: '14'
    text: |-
      1 Het bureau draagt zorg dat na het nemen van een besluit tot inschrijving ten spoedigste inschrijving van de
      verzoeker in het register plaatsvindt.

      2 In het register worden opgenomen naam, voornamen, geboortedatum, adres en opleiding van de verzoeker, alsmede de
      titel waaronder de inschrijving is verkregen.

      3 Het bureau verstrekt de aanvrager onmiddellijk na de inschrijving in het register een bewijs van inschrijving.
    url: https://wetten.overheid.nl/BWBR0004189/1998-01-01#Artikel14
  - number: '15'
    text: |-
      1 Een besluit tot weigering van inschrijving in het register wordt niet genomen dan nadat de indiener van het
      verzoek tot inschrijving in de gelegenheid is gesteld aanvullende bewijsstukken ter ondersteuning van het verzoek
      over te leggen.

      2 Het bureau kan bepalen dat de indiener van het verzoek in persoon voor hem zal verschijnen. De oproeping maakt
      van een zodanig besluit melding.
    url: https://wetten.overheid.nl/BWBR0004189/1998-01-01#Artikel15
  - number: '16'
    text: |-
      1 Dadelijk na inschrijving in het register en voorts telkens na verloop van een jaar is de ingeschrevene een
      bijdrage verschuldigd, indien en voorzover ingevolge het bepaalde in [artikel 7][ref1] hiervoor een bedrag is
      vastgesteld.

      2 Na ontvangst van de bijdrage zendt het bureau een bewijs van betaling aan de ingeschrevene.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel7
    url: https://wetten.overheid.nl/BWBR0004189/1998-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '7'
        hoofdstuk: III
  - number: '17'
    text: |-
      1 Het bureau haalt een inschrijving in het register door:

      a. indien de inschrijving, gelet op het bij of krachtens deze wet bepaalde, ten onrechte is geschied;

      b. indien de ingeschrevene niet voldoet aan de verplichting tot het betalen van de in
      [artikel 16, eerste lid][ref1], bedoelde bijdrage;

      c. op verzoek van de ingeschrevene;

      d. na het overlijden van de ingeschrevene.

      2 Een besluit tot doorhaling van de inschrijving op grond van het bepaalde in het eerste lid, onder *a*, wordt niet
      genomen dan nadat overeenkomstige toepassing is gegeven aan het bepaalde in [artikel 15, eerste lid][ref2].

      3 Een besluit tot doorhaling van de inschrijving op grond van het bepaalde in het eerste lid, onder *b*, wordt
      niet genomen dan nadat vier weken zijn is verstreken na de dag, waarop de betrokkene op zijn verzuim en het in het
      eerste lid bedoelde gevolg daarvan is gewezen.

      4 Elke doorhaling van een inschrijving op een der gronden, bedoeld in het eerste lid, onder *a*-*c*, wordt
      onmiddellijk bekendgemaakt, onder vermelding van hetgeen in [artikel 18][ref3] is bepaald.

      5 Het bureau houdt aantekening van de doorhalingen en van de data waarop deze zijn geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel18
    url: https://wetten.overheid.nl/BWBR0004189/1998-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '16'
        hoofdstuk: IV
      - id: ref2
