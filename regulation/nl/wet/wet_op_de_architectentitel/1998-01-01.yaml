      1 Onze Minister benoemt en ontslaat de voorzitter en de leden van het bestuur van het bureau, na overleg met Onze
      andere Ministers.

      2 Het bestuur bestaat in meerderheid uit personen die de beroepen van architect, stedebouwkundige, tuin- en
      landschapsarchitect of interieurarchitect uitoefenen dan wel hebben uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0004189/1998-01-01#Artikel4
