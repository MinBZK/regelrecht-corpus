      1 Inschrijving in het register als architect wordt verleend aan degene die voldoet aan een van de volgende eisen:

      a. in het bezit van een getuigschrift van een opleiding bouwkunde op het gebied van de techniek aan een in de
      bijlage bij de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] genoemde universiteit;

      b. in het bezit zijn van het op grond van artikel 29 van de Nijverheidsonderwijswet uitgereikte eindgetuigschrift
      Hoger Bouwkunst Onderricht;

      c. in het bezit zijn van het op grond van [artikel 29 van de Wet op het voortgezet onderwijs][ref2] uitgereikte
      einddiploma van een Academie van Bouwkunst, het op grond van artikel 34, derde lid, van de Wet op het hoger
      beroepsonderwijs uitgereikte getuigschrift van een opleiding voor beroepen op het terrein van architectuur en
      stedebouw dan wel het getuigschrift van een met een goed gevolg afgelegd afsluitend examen van een voortgezette
      opleiding bouwkunst verbonden aan een in de [bijlage van de Wet op het hoger onderwijs en wetenschappelijk
      onderzoek](onbekend) genoemde hogeschool;

      d. in het bezit zijn van het op grond van artikel 29 van de Nijverheidsonderwijswet uitgereikte getuigschrift
      Voortgezet Bouwkunst Onderricht;

      e. met goed gevolg een door de Architectenraad ingesteld architectenexamen hebben afgelegd vóór de datum waarop
      voor de eerste maal het examen, bedoeld in dit lid onder *g*, kan worden afgelegd;

      f. in het bezit zijn van het diploma van de Stichting Instituut voor Architectuur I.V.A., afgegeven na een op ten
      minste vierjarige basis ingerichte opleiding van deze stichting waarmee uiterlijk op 5 augustus 1988 is begonnen,
      en van een attest, afgegeven door Onze Minister, waaruit blijkt dat de betrokkene een door of vanwege Onze Minister
      ingesteld onderzoek dat een beoordeling behelst van de plannen die de betrokkene tijdens een feitelijke praktijk
      van ten minste zes jaar op het gebied van de architectuur heeft gemaakt en uitgevoerd, met goed gevolg heeft
      doorstaan, dan wel in het bezit zijn van het diploma van genoemde Stichting, dat is behaald ter afsluiting van een
      opleiding waarmee na 5 augustus 1988 is begonnen, mits die opleiding naar het oordeel van Onze Minister voldoet aan
      de eisen van de artikelen 3 en 4 van de EEG-richtlijn;

      g. met goed gevolg hebben afgelegd een overeenkomstig het bepaalde in [hoofdstuk VI][ref3] ingericht en afgenomen
      examen voor architecten of daarvan, wegens ten genoegen van Onze Minister aangetoonde uitzonderlijke bekwaamheid,
      van Onze Minister ontheffing hebben verkregen;

      h. met goed gevolg hebben afgelegd het examen ter afsluiting van een door Onze Minister en na het horen van de
      representatief te achten beroepsorganisaties van architecten, aangewezen opleiding;

      i. in het bezit zijn van een van de in de hoofdstukken II en III van de EEG-richtlijn bedoelde buitenlandse
      diploma's, certificaten en andere titels op het gebied van de architectuur;

      j. in het bezit zijn van een der door Onze Minister al dan niet op verzoek van een belanghebbende aangewezen
      diploma's die door instellingen in het buitenland, waaronder niet zijn begrepen instellingen, gevestigd in de
      lid-staten van de Europese Unie of de andere staten die partij zijn bij de Overeenkomst betreffende de Europese
      Economische Ruimte, zijn of worden verstrekt.

      2 Onze Minister kan nadere regels geven over de inrichting welke degene die op grond van het voldoen aan een der
      eisen, bedoeld in het eerste lid, onder *a* en *c*, inschrijving in het register wenst te verkrijgen aan zijn
      opleiding moet hebben gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0004189#HoofdstukVI
