        artikel: 8:4
  - number: '22'
    text: |-
      1 Tegen betaling van een vergoeding, waarvan het bedrag ingevolge het bepaalde in [artikel 7][ref1] is vastgesteld,
      doet het bureau aan iedere verzoeker schriftelijk opgave of een persoon in het register staat ingeschreven en onder
      welke titel.

      2 Na ontvangst van de opgave, bedoeld in het eerste lid, kan de verzoeker inzage verlangen in de stukken, die aan
      de inschrijving ten grondslag liggen. De inzage geschiedt, na de indiening bij het bureau van een daartoe strekkend
      schriftelijk verzoek, op een door het bureau te bepalen tijdstip ten kantore van het bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel7
    url: https://wetten.overheid.nl/BWBR0004189/1998-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '7'
        hoofdstuk: III
  - number: '23'
    text: |-
      1 Gerechtigd tot het voeren van een titel, als bedoeld in [artikel 2, tweede lid][ref1], of een afkorting van die
      titel, hetzij zonder nadere aanduiding, hetzij in woordsamenstellingen waarin de titel of een afkorting daarvan
      voorkomt, is uitsluitend hij die onder deze titel in het register staat ingeschreven.

      2 Het bureau, rechtspersonen met volledige rechtsbevoegdheid die ten doel hebben of mede ten doel hebben de
      behartiging van belangen der ingeschrevenen in het register en rechtspersonen met volledige rechtsbevoegdheid
      die ten doel hebben of mede ten doel hebben de behartiging van belangen van de eindgebruikers van de goederen en
      diensten der ingeschrevenen in het register kunnen in rechte vorderen dat degene die zonder daartoe gerechtigd te
      zijn een titel voert als bedoeld in het eerste lid, wordt veroordeeld zich daarvan te onthouden.

      3 Deze rechtsvordering komt mede toe aan iedere gerechtigde, als bedoeld in het eerste lid, voorzover de titel
      wordt gevoerd waaronder de gerechtigde in het register staat ingeschreven.

      4 Van een rechtsvordering als bedoeld in het tweede en derde lid, neemt de kantonrechter kennis, behoudens hoger
      beroep.

      5 Het in het eerste tot en met vierde lid bepaalde is niet van toepassing met betrekking tot het voeren van de
      titel jachtarchitect of nautisch architect.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel2
    url: https://wetten.overheid.nl/BWBR0004189/1998-01-01#Artikel23
    references:
      - id: ref1
