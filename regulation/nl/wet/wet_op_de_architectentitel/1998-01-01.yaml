      - id: ref3
        bwb_id: BWBR0004189
        artikel: '16'
        hoofdstuk: IV
  - number: '19'
    text: |-
      1 Het bureau maakt binnen vier weken na ontvangst van het verzoek, bedoeld in [artikel 18, eerste lid][ref1], de
      doorhaling ongedaan.

      2 [Artikel 14, derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel14
    url: https://wetten.overheid.nl/BWBR0004189/1998-01-01#Artikel19
