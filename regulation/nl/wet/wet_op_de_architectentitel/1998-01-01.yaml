    text: |-
      1 Jaarlijks vóór 1 mei wordt door het bureau aan Onze Minister ter goedkeuring
      een jaarverslag en een jaarrekening over het vorige kalenderjaar voorgelegd. De
      [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing. Onze
      Minister kan een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2]
      belasten met het uitvoeren van een controle op de jaarrekening. Aan deze accountant en aan de Algemene Rekenkamer
      wordt inzage gegeven van de boeken en bescheiden en worden alle inlichtingen verstrekt welke zij nodig achten om
      een juist inzicht te verkrijgen in het geldelijk beheer van het bureau.

      2 Onze Minister zendt na goedkeuring afschrift van het verslag en van de jaarrekening aan Onze andere Ministers en
      aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1028
