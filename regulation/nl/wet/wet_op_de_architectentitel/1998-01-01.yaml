        hoofdstuk: IV
  - number: '20'
    text: |-
      Voor de toepassing van het bepaalde in [artikel 16, eerste lid][ref1], geldt het tijdstip waarop een doorhaling
      ongedaan is gemaakt als tijdstip van inschrijving in het register.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel16
    url: https://wetten.overheid.nl/BWBR0004189/1998-01-01#Artikel20
    references:
      - id: ref1
