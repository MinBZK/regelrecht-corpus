        artikel: '2'
        hoofdstuk: II
  - number: '24'
    text: |-
      1 Onverminderd [artikel 23, eerste lid][ref1], is degene die voldoet aan [artikel 9, eerste lid, onder ][ref2],
      [10, eerste lid, onder ][ref3], [11, eerste lid, onder ][ref4], of [12, eerste lid, onder ][ref5], gerechtigd
      gebruik te maken van de wettige, in een andere lid-staat van de Europese Unie of in een andere staat die partij is
      bij de Overeenkomst betreffende de Europese Economische Ruimte gevoerde titel of afkorting daarvan, in de taal van
      die Staat.

      2 Onze Minister die het aangaat kan bepalen dat bij het voeren van een titel als bedoeld in het eerste lid, tevens
      de naam en de plaats van vestiging van de instelling of de examencommissie die deze titel heeft verleend, moet
      worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel23
