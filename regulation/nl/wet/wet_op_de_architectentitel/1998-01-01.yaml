    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, met uitzondering van
      [artikel 23][ref1] dat vijf jaar nadien in werking treedt.

      2 Deze wet kan worden aangehaald als Wet op de architectentitel.


