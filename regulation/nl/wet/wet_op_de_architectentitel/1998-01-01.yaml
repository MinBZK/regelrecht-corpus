        artikel: '18'
        hoofdstuk: IV
  - number: '18'
    text: |-
      1 Degene, van wie de inschrijving op een der in [artikel 17, eerste lid onder ][ref1], bedoelde gronden is
      doorgehaald, kan het bureau verzoeken de doorhaling ongedaan te maken.

      2 Het in het eerste lid bedoelde verzoek wordt geacht niet te zijn ingediend zolang niet opnieuw het inschrijfgeld
      is betaald, bedoeld in [artikel 13, eerste lid][ref2], en zolang niet de reeds vóór het tijdstip van doorhaling
      verschuldigde, maar nog niet betaalde bijdragen, bedoeld in [artikel 16, eerste lid][ref3], zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel16
    url: https://wetten.overheid.nl/BWBR0004189/1998-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004189
        artikel: '17'
