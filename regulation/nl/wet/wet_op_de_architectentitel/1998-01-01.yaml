preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bij de wet regelen te stellen omtrent de bescherming
    van de titels architect, stedebouwkundige, tuin- en landschapsarchitect en interieurarchitect, alsmede regelen
    te stellen ter uitvoering van de richtlijn van de Raad van de Europese Gemeenschappen van 10 juni 1985 inzake de
    onderlinge erkenning van de diploma's, certificaten en andere titels op het gebied van de architectuur, tevens
    houdende maatregelen tot vergemakkelijking van de daadwerkelijke uitoefening van het recht van vestiging en vrij
    verrichten van diensten (PbEG 1985, L 223/15);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004189/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      Onze andere Ministers: Onze Ministers van Welzijn, Volksgezondheid en Cultuur, van Landbouw en Visserij, van
      Justitie en van Economische Zaken;

      EEG-richtlijn: de richtlijn van de Raad van de Europese Gemeenschappen van 10 juni 1985 inzake de onderlinge
      erkenning van de diploma's, certificaten en andere titels op het gebied van de architectuur, tevens houdende
      maatregelen tot vergemakkelijking van de daadwerkelijke uitoefening van het recht van vestiging en vrij verrichten
      van diensten (*PbEG* 1985, L 223/15).
    url: https://wetten.overheid.nl/BWBR0004189/1998-01-01#Artikel1
  - number: '2'
    text: |-
      1 Er is een architectenregister, in deze wet verder aan te duiden als het register.

      2 In het register wordt op verzoek ingeschreven als architect, als stedebouwkundige, als tuin- en
      landschapsarchitect of als interieurarchitect degene, die voldoet aan de bij of krachtens deze wet gestelde eisen.

      3 Onze Minister kan, in overeenstemming met Onze andere Ministers, voorschriften geven omtrent de inrichting van
      het register.
    url: https://wetten.overheid.nl/BWBR0004189/1998-01-01#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister richt een Stichting bureau architectenregister op, in deze wet verder aan te duiden als
      het bureau. Het wijzigen van de statuten van het bureau behoeft de toestemming van Onze Minister. De
      [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing.

      2 Het bureau is belast met het beheer van het register en voorziet in de administratieve bijstand, die de in
      [artikel 33, eerste lid][ref2], bedoelde commissies behoeven, zomede in de bijstand die bij de uitvoering van het
      bepaalde in [hoofdstuk VI][ref3] van het bureau wordt gevraagd.

      3 Het bureau is voorts belast met het op verzoek aan een belanghebbende verstrekken van informatie omtrent de
      bij of krachtens deze wet gegeven voorschriften. Het bureau brengt voor het verstrekken van die informatie een
      vergoeding in rekening, waarvan het bedrag ingevolge het bepaalde in [artikel 7][ref4] is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1028
