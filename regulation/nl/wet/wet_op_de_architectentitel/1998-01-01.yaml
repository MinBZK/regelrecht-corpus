  - number: '27'
    text: |-
      Zij die zich aan een van de in [artikel 25][ref1] bedoelde examens of bepaalde onderdelen daarvan dan wel aan het
      in [artikel 26][ref2] bedoelde examen wensen te onderwerpen, worden hiertoe niet toegelaten dan na betaling van een
      examengeld, waarvan het bedrag ingevolge het bepaalde in [artikel 7][ref3] is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel7
