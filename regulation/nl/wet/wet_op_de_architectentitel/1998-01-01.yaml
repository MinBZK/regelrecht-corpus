  - number: '11'
    text: |-
      1 Inschrijving in het register als tuin- en landschapsarchitect wordt verleend aan degene die voldoet aan een van
      de volgende eisen:

      a. in het bezit zijn van een getuigschrift van een opleiding landschapsarchitectuur
      op het gebied van de landbouw en de natuurlijke omgeving aan een in de bijlage bij de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] genoemde universiteit;

      b. in het bezit zijn van het op grond van [artikel 29 van de Wet op het voortgezet onderwijs][ref2] uitgereikte
      einddiploma van een Academie van Bouwkunst, waaraan een afdeling Landschapsarchitectuur is verbonden, het op grond
      van artikel 34, derde lid, van de Wet op het hoger beroepsonderwijs uitgereikte getuigschrift van een opleiding
      voor beroepen op het terrein van architectuur en stedebouw dan wel het getuigschrift van een voortgezette opleiding
      bouwkunst verbonden aan een in de [bijlage van de Wet op het hoger onderwijs en wetenschappelijk onderzoek]
      (onbekend) genoemde hogeschool;

      c. vóór 1 september 1970 zijn afgestudeerd in de richting tuin- en landschapsarchitectuur aan de
      rijkslandbouwuniversiteit te Wageningen;

      d. vóór 1 januari 1953 zijn erkend door de commissie ter erkenning van tuin- en landschapsarchitecten, ingesteld
      door de Bond van Nederlandse Tuin- en Landschapsarchitecten (BNT);

      e. met goed gevolg vóór 1 februari 1968 een examen voor tuin- en landschapsarchitect hebben afgelegd voor een door
      Onze Minister van Landbouw en Visserij daartoe benoemde examencommissie;

      f. in het bezit zijn van een in 1971 uitgereikt diploma van de Voortgezette Hogere Opleiding Tuin- en
      Landschapsarchitectuur (VHTL) van de Vereniging voor Tuin- en Landschapsarchitectuur;

      g. met goed gevolg hebben afgelegd een overeenkomstig het bepaalde in [hoofdstuk VI][ref3] ingericht en afgenomen
      examen voor tuin- en landschapsarchitect of daarvan, wegens ten genoegen van Onze Minister van Landbouw en Visserij
      aangetoonde uitzonderlijke bekwaamheid, van genoemde minister ontheffing hebben verkregen;

      h. met goed gevolg hebben afgelegd het examen ter afsluiting van een door Onze Minister van Landbouw en Visserij,
      na het horen van de representatief te achten beroepsorganisaties van tuin- en landschapsarchitecten, aangewezen
      opleiding;

      i. in het bezit zijn van een ten aanzien van het beroep van tuin- en landschapsarchitect afgegeven
      EG-verklaring als bedoeld in de Algemene wet erkenning EG-hoger-onderwijsdiploma's dan wel in de
      [Algemene wet erkenning EG-beroepsopleidingen][ref4];

      j. in het bezit zijn van een der door Onze Minister van Landbouw, Natuurbeheer en Visserij al dan niet op
      verzoek van een belanghebbende aangewezen diploma's die door instellingen in het buitenland, waaronder niet zijn
      begrepen instellingen, gevestigd in de lid-staten van de Europese Unie of de andere staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte, zijn of worden verstrekt.

      2 Onze Minister van Landbouw en Visserij kan nadere regels geven over de inrichting welke degene die op grond van
      het voldoen aan een der eisen, bedoeld in het eerste lid, onder *a* en *b*, inschrijving in het register wenst te
      verkrijgen aan zijn opleiding moet hebben gegeven.


