  - number: '26'
    text: |-
      1 Ten minste eenmaal per jaar stelt Onze Minister degene die voldoet aan [artikel 9, eerste lid, onder ][ref1], en
      die is ingeschreven in het register, doch niet volledig voldoet aan artikel 4, tweede lid, van de EEG-richtlijn, in
      de gelegenheid tot het afleggen van een examen als bedoeld in dat artikellid van de richtlijn.

      2 [Artikel 25, tweede, derde en vierde lid][ref2], zijn van toepassing, met dien verstande dat de voordracht wordt
      gedaan door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel25
    url: https://wetten.overheid.nl/BWBR0004189/1998-01-01#Artikel26
