  - number: '25'
    text: |-
      1 Ten minste eenmaal per jaar geeft Onze Minister die ingevolge onderscheidenlijk
      de[ artikelen 9, eerste lid, onder ][ref1], [10, eerste lid, onder ][ref2], [11, eerste lid, onder ][ref3], en
      [12, eerste lid, onder ][ref4], bevoegd is tot het verlenen van ontheffing, de mogelijkheid tot het afleggen van
      het examen, bedoeld in die artikelen.

      2 De omvang en inrichting van de examens worden vastgesteld bij of krachtens algemene maatregel van bestuur.
      Daarbij worden tevens geregeld de eisen voor de toelating tot het afleggen van de examens, alsmede die voor het
      verkrijgen van vrijstelling voor bepaalde onderdelen daarvan.

      3 Een krachtens de algemene maatregel van bestuur, bedoeld in het tweede lid, vastgesteld examenreglement,
      alsmede elke wijziging daarvan, behoeft de goedkeuring van Onze ingevolge het bepaalde in het eerste lid betrokken
      Minister.

      4 De voordracht tot de algemene maatregel van bestuur, bedoeld in het tweede lid, wordt gedaan door Onze ingevolge
      het bepaalde in het eerste lid betrokken Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004189#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004189#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0004189#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0004189#Artikel12
