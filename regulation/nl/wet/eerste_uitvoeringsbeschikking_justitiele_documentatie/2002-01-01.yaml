preamble:
  text: |-
    Gelet op artikel 8 van het Besluit justitiële documentatie;

    Overwegende, dat nadere regelen ter uitvoering van dat besluit nodig zijn;

    Besluit ten deze de navolgende regelen vast te stellen:
  url: https://wetten.overheid.nl/BWBR0002076/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De justitiële documentatiedienst registreert de bij de strafregisters behorende strafbladen, bijbladen en
      mededelingen.
    url: https://wetten.overheid.nl/BWBR0002076/2002-01-01#Artikel1
  - number: '2'
    text: |-
      Deze beschikking verstaat onder:



            a
            „transactie”:

              het vervallen van het recht tot strafvordering, als bedoeld in artikel 74 van het Wetboek van Strafrecht,
      in de artikelen 36 en 37 van de Wet op de economische delicten en in de artikelen 39 en 40 van het Deviezenbesluit
      1945; het vervallen van het recht tot strafoplegging, als bedoeld in artikel 15 van het Besluit berechting
      economische delicten; het voorkomen van de indiening van een klacht, als bedoeld in artikel 15 van het Besluit
      tuchtrechtspraak voedselvoorziening;



            b
            „sepôt”:

              de beslissingen, bedoeld in de artikelen 167, 242 en 488 van het Wetboek van Strafvordering;



            c
            „beslissing tot voorwaardelijk niet vervolgen”;

              de beslissing, bedoeld in artikel 244 van het Wetboek van Strafvordering.
    url: https://wetten.overheid.nl/BWBR0002076/2002-01-01#Artikel2
  - number: '3'
    text: |-
      1 De justitiële documentatiedienst registreert de na 31 December 1945 ingeschreven, dan wel in behandeling genomen
      zaken, welke geleid hebben tot:

      a. onherroepelijke veroordelingen en transacties ter zake van overtreding van artikel 22, sub *b*, der Motor- en
      Rijwielwet;

      b. onherroepelijke veroordelingen ter zake van feiten, waarvoor bevoegd waren de bijzondere politierechters (ook
      voor zover daarvan geen strafblad behoorde te zijn opgemaakt), de tuchtrechters voor de voedselvoorziening en de
      tuchtrechters voor de prijzen, of transacties, indien bij vervolging een dezer rechters bevoegd zou zijn geweest.

      2 De onder *a* en *b* bedoelde veroordelingen en transacties worden niet geregistreerd, voor zover zij buiden op
      betaling van een geldsbedrag van minder dan f 250, al dan niet gepaard gaande met verbeurdverklaring. Meerdere
      boeten of andere bedragen, door één natuurlijke persoon of corporatie verschuldigd ter zake van een zelfde vonnis
      of transactie, worden daartoe bij elkander geteld.
    url: https://wetten.overheid.nl/BWBR0002076/2002-01-01#Artikel3
  - number: '4'
    text: |-
      De justitiële documentatiedienst registreert de processen-verbaal en derzelver afdoening, als omschreven in
      [artikel 5, eerste lid, sub ][ref1], ter zake van overtreding van artikel 26 der Wegenverkeerswet vóór de
      inwerkingtreding van het Besluit justitiële documentatie in behandeling genomen door een officier van justitie, de
      advocaat-fiskaal voor de Zee- en Landmacht, een auditeur-militair of een fiscaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002076#Artikel5
    url: https://wetten.overheid.nl/BWBR0002076/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002076
        artikel: '5'
  - number: '5'
    text: |-
      1 De justitiële documentatiedienst registreert met betrekking tot op of na de inwerkingtreding van het Besluit
      justitiële documentatie door een officier van justitie in behandeling genomen zaken:

      a. iedere natuurlijke persoon of corporatie, die wordt aangemerkt als verdacht van enig feit, waarvan een
      arrondissementsrechtbank in eerste aanleg kennis neemt;

      b. de navolgende wijzen van afdoening van deze zaken:

        - sepôt;
        - gesloten transactie;
        - beslissing tot voorwaardelijk niet vervolgen;
        - overdracht aan een ander vervolgend orgaan;
        - voeging ad informandum bij een andere zaak;
        - onherroepelijke vrijspraak;
        - onherroepelijke ontslag van rechtsvervolging;
        - onherroepelijke veroordeling, ook voor zover daarvan geen strafblad behoort te worden opgemaakt;
        - alsmede de ter-zijde-legging wegens;
        - verjaring;
        - overlijden van de verdachte.

      2 Het voorgaande lid is van overeenkomstige toepassing op natuurlijke personen, die in een proces-verbaal,
      ingezonden bij de advocaat-fiskaal voor de Zee- en Landmacht, bij een auditeur-militair of een fiscaal, worden
      aangemerkt als verdacht van een misdrijf, van een economisch delict of van een belastingdelict.
    url: https://wetten.overheid.nl/BWBR0002076/2002-01-01#Artikel5
  - number: 5a
    text: |-
      De justitiële documentatiedienst registreert de transacties, gesloten door de Nederlandsche bank N.V. te Amsterdam
      en door de Directeurs van 's Rijks belastingen en domeinen te Amsterdam, Arnhem, Breda, Groningen, Maastricht,
      Rotterdam. Utrecht en Zwolle op grond van de bevoegdheid, toegekend bij het Koninklijk besluit van 1 Mei 1951
      (*Nederlandse Staatscourant* dd. 11 Mei 1951.)
    url: https://wetten.overheid.nl/BWBR0002076/2002-01-01#Artikel5a
  - number: '6'
    text: |-
      De justitiële documentatiedienst registreert met betrekking tot zaken tegen geregistreerde verdachten:

        - de verlenging van de proeftijd;
        - de beëindiging van een ter-beschikking-stelling van de Regering, als bedoeld in [artikel 37][ref1];
        - de last tot ten-uitvoer-legging van een voorwaardelijke veroordeling;
        - de verbeurdverklaring van een waarborgsom;
        - de herziening;
        - de oplegging van voorlopige maatregelen, als bedoeld in de [artikelen 28][ref2] en
      [29 der Wet op de economische delicten][ref3], alsmede hun beëindiging, verlenging, wijziging, intrekking of
      opheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37b
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002063#Artikel29
    url: https://wetten.overheid.nl/BWBR0002076/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37b
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0002063
        artikel: '29'
  - number: '7'
    text: |-
      1 De voorschriften nopens het verstrekken van uittreksels en inlichtingen uit de strafregisters blijven onverlet,
      met dien verstande, dat hij, die gerechtigd is verklaard tot het verkrijgen van gegevens, als bedoeld in het tweede
      lid, steeds recht heeft op uittreksels uit de strafregisters.

      2 Gegevens uit de andere registers verstrekt de justitiële documentatiedienst slechts aan Nederlandse rechterlijke
      autoriteiten met inbegrip van de advocaat-fiskaal voor de Zee- en Landmacht, de auditeurs-militair en de fiscaals.
    url: https://wetten.overheid.nl/BWBR0002076/2002-01-01#Artikel7
  - number: 7a
    text: |-
      Aan de Nederlandsche Bank en de Directeurs van 's Rijks belastingen en domeinen te Amsterdam, Arnhem, Breda,
      Groningen, Maastricht, Rotterdam, Utrecht en Zwolle verstrekt de justitiële documentatiedienst inlichtingen
      uit de strafregisters en uit de andere registers. Deze inlichtingen beperken zich tot economische delicten en
      worden slechts verstrekt op een schriftelijke aanvraag, waaruit blijkt, dat de inlichting getrokken wordt ter
      voorbereiding van een beslissing, als bedoeld in voormeld Koninklijk besluit.
    url: https://wetten.overheid.nl/BWBR0002076/2002-01-01#Artikel7a
  - number: '8'
    text: |-
      De registratie geschiedt, evenals het verstrekken van inlichtingen, als bedoeld in [artikel 6][ref1], 2de lid, met
      inachtneming van daartoe strekkende nadere instructies.


      [ref1]: https://wetten.overheid.nl/BWBR0002076#Artikel6
    url: https://wetten.overheid.nl/BWBR0002076/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002076
        artikel: '6'
  - number: '9'
    text: |-
      Deze beschikking treedt in werking tegelijk met het Besluit justitiële documentatie.

      Zij wordt gepubliceerd in de *Nederlandse Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002076/2002-01-01#Artikel9
  - number: '10'
    text: 'Deze beschikking kan worden aangehaald als: Eerste uitvoeringsbeschikking justitiële documentatie.'
    url: https://wetten.overheid.nl/BWBR0002076/2002-01-01#Artikel10
