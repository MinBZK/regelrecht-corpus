$id: wet_politiegegevens
regulatory_layer: WET
publication_date: '2025-05-14'
valid_from: '2022-10-01'
bwb_id: BWBR0022463
url: https://wetten.overheid.nl/BWBR0022463/2022-10-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels vast te stellen voor het verwerken van
    politiegegevens;

    Alzo Wij in overweging genomen hebben, dat ter bescherming van de persoonlijke levenssfeer met betrekking tot die
    verwerking uitvoering dient te worden gegeven aan artikel 10, tweede en derde lid, van de Grondwet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.a
    text: |-
      *politiegegeven:* elk persoonsgegeven dat wordt verwerkt in het kader van de uitvoering van de politietaak, bedoeld
      in de [artikelen 3][ref1] en [4 van de Politiewet 2012][ref2], met uitzondering van: - de uitvoering van wettelijke
      voorschriften anders dan de Wet administratiefrechtelijke handhaving verkeersvoorschriften;
        - de bij of krachtens de [Vreemdelingenwet 2000][ref3] opgedragen taken,
      bedoeld in [artikel 1, eerste lid, onderdeel i, onder 1°][ref4] en
      [artikel 4, eerste lid, onderdeel f, van de Politiewet 2012][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011823
      [ref4]: https://wetten.overheid.nl/BWBR0031788#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0031788#Artikel4
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0011823
      - id: ref4
        bwb_id: BWBR0031788
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0031788
        artikel: '4'
  - number: 1.b
    text: '*persoonsgegeven:* alle informatie over een geïdentificeerde of identificeerbare natuurlijke persoon;'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.c
    text: |-
      *verwerken van politiegegevens:* elke bewerking of elk geheel van bewerkingen met betrekking tot politiegegevens of
      een geheel van politiegegevens, al dan niet uitgevoerd op geautomatiseerde wijze, zoals het verzamelen, vastleggen,
      ordenen, structureren, opslaan, bijwerken of wijzigen, opvragen, raadplegen, gebruiken, verstrekken door middel van
      doorzending, verspreiden of op andere wijze ter beschikking stellen, samenbrengen, met elkaar in verband brengen,
      afschermen of vernietigen van politiegegevens;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.d
    text: '*verstrekken van politiegegevens:* het bekend maken of ter beschikking stellen van politiegegevens;'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.e
    text: |-
      *ter beschikking stellen van politiegegevens:* het verstrekken van politiegegevens aan personen die overeenkomstig
      deze wet zijn geautoriseerd voor het verwerken van politiegegevens;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.f
    text: '*verwerkingsverantwoordelijke:* dit is bij:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.f.1°
    text: |-
      de politie: de korpschef, bedoeld in [artikel 27 van de Politiewet 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel27
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '27'
  - number: 1.f.2°
    text: 'de rijksrecherche: het College van procureurs-generaal;'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.f.3°
    text: 'de Koninklijke marechaussee: Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.f.4°
    text: |-
      een gemeenschappelijke verwerking van politiegegevens met het oog op een gemeenschappelijk doel door twee
      of meer organisaties als bedoeld in dit onderdeel: de verwerkingsverantwoordelijke die door de betrokken
      verwerkingsverantwoordelijken is belast met de feitelijke zorg voor de verwerking en het treffen van de
      maatregelen, bedoeld in de [artikelen 4][ref1] en [4a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel4a
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: 4a
        paragraaf: '1'
  - number: 1.g
    text: '*betrokkene:* degene op wie een politiegegeven betrekking heeft;'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.h
    text: |-
      *Autoriteit persoonsgegevens:* de autoriteit, bedoeld in
      [artikel 6 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel6
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0040940
        artikel: '6'
  - number: 1.i
    text: |-
      *verwerker:* de natuurlijke persoon of rechtspersoon, overheidsinstantie, dienst of enig ander orgaan die of dat
      ten behoeve van de verwerkingsverantwoordelijke politiegegevens verwerkt. Indien een verwerker in strijd met het
      bij of krachtens deze wet bepaalde de doeleinden en middelen van de verwerking bepaalt, wordt die verwerker met
      betrekking tot die verwerking als verwerkingsverantwoordelijke aangemerkt;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.j
    text: '*Onze Ministers:* Onze Ministers van Veiligheid en Justitie en van Defensie gezamenlijk;'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.k
    text: |-
      *ambtenaar van politie:* de ambtenaar, bedoeld in [artikel 2 van de Politiewet 2012][ref1], alsmede de ambtenaar
      van de Koninklijke marechaussee voor zover werkzaam ter uitvoering van de politietaak, bedoeld in onderdeel a,
      en indien [artikel 46][ref2] wordt toegepast, de ambtenaar, werkzaam bij de in dat artikel genoemde dienst en de
      ambtenaar, bedoeld in [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '46'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '142'
  - number: 1.l
    text: |-
      *bevoegde autoriteit:* iedere overheidsinstantie die bevoegd is voor de taken, bedoeld in onderdeel a, of ieder
      ander orgaan dat of iedere andere entiteit die is gemachtigd openbaar gezag en openbare bevoegdheden uit te oefenen
      met het oog op de taken, bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.m
    text: |-
      *gerelateerde gegevens:* de politiegegevens die bij de vergelijking van gegevens, bedoeld in
      de [artikelen 8, tweede lid][ref1], [11, eerste en tweede lid][ref2], [12, vierde lid][ref3] en
      [24, eerste en tweede lid][ref4], overeenkomen en de erbij behorende gegevens alsmede de politiegegevens waarmee
      bij het in combinatie met elkaar verwerken van politiegegevens, bedoeld in de artikelen 8, derde lid, en 11, vierde
      lid, verband blijkt te bestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel24
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '11'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '12'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0022463
        artikel: '24'
        paragraaf: '3'
  - number: 1.n
    text: |-
      *afschermen:* het markeren van opgeslagen politiegegevens met als doel de verwerking ervan in de toekomst te
      beperken;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.o
    text: |-
      *bestand:* elk gestructureerd geheel van politiegegevens dat volgens bepaalde criteria toegankelijk is, ongeacht
      of dit geheel van gegevens gecentraliseerd of gedecentraliseerd is, dan wel verspreid op een functioneel of
      geografisch bepaalde wijze;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.p
    text: |-
      *ontvanger:* de natuurlijke persoon aan wie of de rechtspersoon of overheidsinstantie waaraan politiegegevens
      worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.q
    text: |-
      *inbreuk op de beveiliging:* een inbreuk op de beveiliging met de vernietiging, het verlies, de wijziging,
      de bekendmaking of de ter beschikkingstelling van of de ongeoorloofde toegang tot doorgezonden, opgeslagen of
      anderszins verwerkte politiegegevens tot gevolg;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.r
    text: |-
      *genetische gegevens:* persoonsgegevens met betrekking tot de overgeërfde of verworven genetische kenmerken van een
      natuurlijke persoon die unieke informatie verschaffen over de fysiologie of de gezondheid van die persoon en die
      met name voortkomen uit een analyse van een biologisch monster van die persoon;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.s
    text: |-
      *biometrische gegevens:* persoonsgegevens die het resultaat zijn van een specifieke technische verwerking met
      betrekking tot de fysieke, fysiologische, of gedragskenmerken van een natuurlijke persoon op grond waarvan de
      eenduidige identificatie van die persoon mogelijk is of bevestigd wordt, zoals afbeeldingen van het gezicht of
      dactyloscopische gegevens;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.t
    text: |-
      *gegevens over gezondheid:* persoonsgegevens met betrekking tot de fysieke of mentale gezondheid van een
      natuurlijke persoon, waaronder gegevens over verleende gezondheidsdiensten, waarmee informatie over zijn gezondheid
      wordt gegeven;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.u
    text: |-
      *profilering:* elke vorm van geautomatiseerde verwerking van persoonsgegevens waarbij aan de hand van die gegevens
      bepaalde persoonlijke aspecten van een natuurlijke persoon worden geëvalueerd, met de bedoeling met name aspecten
      betreffende zijn beroepsprestaties, economische situatie, gezondheid, persoonlijke voorkeuren, interesses,
      betrouwbaarheid, gedrag, locatie of verplaatsingen te analyseren of te voorspellen;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.v
    text: '*derde land:* ieder land of gebied dat geen lidstaat is of daarvan geen onderdeel uitmaakt;'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.w
    text: |-
      *internationale organisatie:* een organisatie en de daaronder ressorterende internationaalpubliekrechtelijke
      organen of andere organen die zijn opgericht bij of op grond van een overeenkomst tussen twee of meer landen;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.x
    text: |-
      *richtlijn:* Richtlijn (EU) 2016/680 van het Europees Parlement en de Raad van 27 april 2016 betreffende
      de bescherming van natuurlijke personen in verband met de verwerking van persoonsgegevens door bevoegde
      autoriteiten met het oog op de voorkoming, het onderzoek, de opsporing en de vervolging van strafbare feiten of
      de tenuitvoerlegging van straffen, en betreffende het vrije verkeer van die gegevens en tot intrekking van het
      Kaderbesluit 2008/977/JBZ van de Raad;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: 1.y
    text: '*lidstaat:* lidstaat van de Europese Unie die de richtlijn heeft geïmplementeerd.'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel1
  - number: '2.1'
    text: |-
      Deze wet is van toepassing op de verwerking van politiegegevens door een bevoegde autoriteit die in een bestand
      zijn opgenomen of die bestemd zijn daarin te worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel2
  - number: '2.2'
    text: 'Deze wet is niet van toepassing op de verwerking van politiegegevens:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel2
  - number: 2.2.a
    text: ten behoeve van activiteiten met uitsluitend persoonlijke doeleinden;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel2
  - number: 2.2.b
    text: ten behoeve van de interne bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel2
  - number: '3.1'
    text: |-
      Politiegegevens worden slechts verwerkt voor zover dit noodzakelijk is voor de bij of krachtens deze wet
      geformuleerde doeleinden.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel3
  - number: '3.2'
    text: |-
      Politiegegevens worden slechts verwerkt voor zover dit behoorlijk en rechtmatig is, de gegevens rechtmatig zijn
      verkregen en de gegevens, gelet op de doeleinden waarvoor zij worden verwerkt, toereikend, terzake dienend en niet
      bovenmatig zijn.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel3
  - number: '3.3'
    text: |-
      Politiegegevens die zijn verkregen voor een doel, als bedoeld in [artikel 1, onder a][ref1], kunnen worden verwerkt
      voor een ander doel, bedoeld in artikel 1, onderdeel a, voor zover deze wet of Unierecht uitdrukkelijk daarin
      voorziet en de verwerking voor dat andere doel noodzakelijk is en in verhouding staat tot dat doel.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
        paragraaf: '1'
  - number: '3.4'
    text: |-
      Politiegegevens kunnen voor een ander doel dan die, bedoeld in [artikel 1, onderdeel a][ref1], worden verwerkt door
      personen en instanties die bij of krachtens de wet met het oog op een zwaarwegend algemeen belang of wetgeving van
      de Europese Unie zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
        paragraaf: '1'
  - number: '3.5'
    text: |-
      Bij de verwerking van politiegegevens op grond van de [artikelen 9][ref1], [10][ref2] en [12][ref3] worden de
      herkomst van deze gegevens en de wijze van verkrijging vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel12
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '12'
        paragraaf: '2'
  - number: '4.1'
    text: |-
      De verwerkingsverantwoordelijke treft de nodige maatregelen opdat politiegegevens, gelet op de doeleinden
      waarvoor zij worden verwerkt, juist en nauwkeurig zijn. Hij zorgt voor het onverwijld vernietigen of rectificeren
      van politiegegevens als blijkt dat deze, gelet op de doeleinden waarvoor zij worden verwerkt, onjuist zijn. De
      bevoegde autoriteit controleert, voor zover praktisch uitvoerbaar, de kwaliteit van politiegegevens voordat de
      gegevens worden verstrekt. Voor zover mogelijk wordt bij de doorzending van politiegegevens de noodzakelijke
      informatie toegevoegd aan de hand waarvan de ontvangende bevoegde autoriteit de mate van juistheid, volledigheid en
      betrouwbaarheid van politiegegevens kan beoordelen, alsmede de mate waarin zij actueel zijn.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4
  - number: '4.2'
    text: |-
      De verwerkingsverantwoordelijke treft de nodige maatregelen opdat politiegegevens worden verwijderd of vernietigd
      zodra zij niet langer noodzakelijk zijn voor het doel waarvoor zij zijn verwerkt of dit door enige wettelijke
      bepaling wordt vereist.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4
  - number: '4.3'
    text: |-
      Voor zover mogelijk worden politiegegevens die op feiten zijn gebaseerd onderscheiden van politiegegevens die op
      een persoonlijk oordeel zijn gebaseerd.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4
  - number: '4.4'
    text: |-
      Indien wordt vastgesteld dat onjuiste politiegegevens zijn verstrekt, of dat de politiegegevens op onrechtmatige
      wijze zijn verstrekt, wordt de ontvanger daarvan onverwijld in kennis gesteld. In dat geval dienen de gegevens te
      worden gerectificeerd of vernietigd, of wordt de verwerking beperkt, als bedoeld in [artikel 28, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel28
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '28'
        paragraaf: '4'
  - number: 4a.1
    text: 'De verwerkingsverantwoordelijke en de verwerker treffen passende technische en organisatorische maatregelen om:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4a
  - number: 4a.1.a
    text: |-
      te waarborgen en te kunnen aantonen dat de verwerking van politiegegevens wordt verricht in overeenstemming met
      hetgeen bij of krachtens deze wet is bepaald;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4a
  - number: 4a.1.b
    text: |-
      het gegevensbeschermingsbeleid en de gegevensbeschermingsbeginselen op een doeltreffende manier uit te voeren
      respectievelijk toe te passen;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4a
  - number: 4a.1.c
    text: |-
      bij de bepaling van de verwerkingsmiddelen en de verwerking zelf de nodige waarborgen, zoals pseudonimisering, in
      de verwerking in te bouwen ter naleving van hetgeen bij of krachtens deze wet is bepaald en ter bescherming van de
      rechten van de betrokkenen.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4a
  - number: 4a.2
    text: |-
      De verwerkingsverantwoordelijke en de verwerker treffen passende technische en organisatorische maatregelen om
      een beveiligingsniveau te waarborgen dat op het risico is afgestemd, met name met betrekking tot de verwerking
      van de bijzondere categorieën van politiegegevens, bedoeld in [artikel 5][ref1], en op een zodanige manier dat
      de politiegegevens beschermd zijn tegen ongeoorloofde of onrechtmatige verwerking en tegen opzettelijk verlies,
      vernietiging of beschadiging.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel5
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '5'
        paragraaf: '1'
  - number: 4a.3
    text: |-
      Bij het treffen van de maatregelen, bedoeld in het eerste en tweede lid, houden de verwerkingsverantwoordelijke en
      de verwerker rekening met de aard, de reikwijdte, de context en de doeleinden van de verwerking, alsmede met de qua
      waarschijnlijkheid en ernst uiteenlopende risico’s voor de rechten en vrijheden van natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4a
  - number: 4a.4
    text: |-
      In aanvulling op het derde lid houden de verwerkingsverantwoordelijke en de verwerker ten aanzien van het eerste
      lid, onder c, en het tweede lid, rekening met de stand van de techniek en de uitvoeringskosten.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4a
  - number: 4a.5
    text: De maatregelen, bedoeld in het eerste en tweede lid, worden periodiek geëvalueerd en zo nodig geactualiseerd.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4a
  - number: 4a.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de maatregelen, bedoeld in het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4a
  - number: 4b.1
    text: |-
      De verwerkingsverantwoordelijke treft passende technische en organisatorische maatregelen om te waarborgen dat
      standaard:
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4b
  - number: 4b.1.a
    text: alleen die politiegegevens worden verwerkt die noodzakelijk zijn voor elk specifiek doel van de verwerking; en
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4b
  - number: 4b.1.b
    text: |-
      politiegegevens niet zonder tussenkomst van een natuurlijke persoon voor een onbeperkt aantal natuurlijke personen
      toegankelijk worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4b
  - number: 4b.2
    text: |-
      De in het eerste lid, onder a, bedoelde maatregelen betreffen in ieder geval de hoeveelheid verzamelde
      politiegegevens, de mate waarin zij worden verwerkt, de periode van opslag en de toegankelijkheid van de
      politiegegevens.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4b
  - number: 4c.1
    text: |-
      Wanneer een soort verwerking, in het bijzonder een verwerking waarbij nieuwe technologieën worden gebruikt, gelet
      op de aard, de omvang, de context of doelen ervan, waarschijnlijk een hoog risico voor de rechten en vrijheden van
      personen oplevert, voert de verwerkingsverantwoordelijke voorafgaande aan de verwerking een beoordeling uit van het
      effect van de voorgenomen verwerkingsactiviteiten op de bescherming van persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4c
  - number: 4c.2
    text: 'De beoordeling bevat tenminste:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4c
  - number: 4c.2.a
    text: een algemene beschrijving van de beoogde verwerkingen;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4c
  - number: 4c.2.b
    text: een beoordeling van de risico’s voor de rechten en vrijheden van betrokkenen;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4c
  - number: 4c.2.c
    text: de beoogde maatregelen ter beperking van de risico’s;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4c
  - number: 4c.2.d
    text: |-
      de voorzorgs- en beveiligingsmaatregelen en mechanismen om de politiegegevens te beschermen en aan te tonen dat aan
      het bij of krachtens deze wet bepaalde is voldaan, met inachtneming van de rechten en gerechtvaardigde belangen van
      de betrokkenen en andere betrokken personen.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4c
  - number: 4c.3
    text: |-
      Indien nodig verricht de verwerkingsverantwoordelijke een toetsing om te beoordelen of de verwerking overeenkomstig
      de gegevensbeschermingseffectbeoordeling wordt uitgevoerd, zulks ten minste wanneer sprake is van een verandering
      van het risico dat de verwerkingen inhouden.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel4c
  - number: '5'
    text: |-
      De verwerking van politiegegevens waaruit ras, etnische afkomst, politieke opvattingen, religieuze of
      levensbeschouwelijke overtuiging, of het lidmaatschap van een vakbond blijkt, en de verwerking van genetische
      gegevens, biometrische gegevens met het oog op de unieke identificatie van een natuurlijke persoon, of gegevens
      over gezondheid, seksuele leven en seksuele gerichtheid vindt slechts plaats wanneer dit onvermijdelijk is voor
      het doel van de verwerking, in aanvulling op de verwerking van andere politiegegevens betreffende de persoon en de
      gegevens afdoende zijn beveiligd.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel5
  - number: '6.1'
    text: |-
      De verwerkingsverantwoordelijke onderhoudt een systeem van autorisaties dat voldoet aan de vereisten van
      zorgvuldigheid en evenredigheid.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel6
  - number: '6.2'
    text: |-
      Politiegegevens worden slechts verwerkt door ambtenaren van politie die zijn belast met de taken, bedoeld in
      [artikel 1, onderdeel a][ref1] die daartoe door de verwerkingsverantwoordelijke zijn geautoriseerd en voor zover de
      autorisatie strekt.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
        paragraaf: '1'
  - number: '6.3'
    text: |-
      De verwerkingsverantwoordelijke autoriseert de ambtenaren van politie die onder zijn beheer vallen voor de
      verwerking van politiegegevens ter uitvoering van de onderdelen van de politietaak waarmee zij zijn belast.
      De autorisatie bevat een duidelijke omschrijving van de verwerkingen waartoe de betreffende ambtenaar wordt
      geautoriseerd en de onderdelen van de politietaak ter uitvoering waarvan de verwerkingen worden gedaan.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel6
  - number: '6.4'
    text: |-
      In bijzondere gevallen kan de verwerkingsverantwoordelijke personen die geen ambtenaar van politie zijn en die
      onder zijn beheer vallen, autoriseren voor de verwerking van politiegegevens ter uitvoering van de onderdelen van
      de politietaak waarmee zij zijn belast.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel6
  - number: '6.5'
    text: |-
      In bijzondere gevallen kan de verwerkingsverantwoordelijke de ambtenaar van politie die onder het beheer van een
      andere verwerkingsverantwoordelijke valt, autoriseren voor de verwerking van politiegegevens ter uitvoering van
      in de autorisatie omschreven onderdelen van de politietaak. De verwerking van politiegegevens vindt in dat geval
      plaats onder het beheer van de verwerkingsverantwoordelijke die de autorisatie heeft verleend.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel6
  - number: '6.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de categorieën van personen die
      voor bepaalde gegevensverwerkingen geautoriseerd kunnen worden en de deskundigheidseisen die aan hen kunnen worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel6
  - number: '6.7'
    text: |-
      De verwerkingsverantwoordelijke wijst de functionaris aan, bedoeld in [artikel 9, derde lid][ref1],
      [10, vijfde lid][ref2], [11, eerste, tweede en vierde lid][ref3], [12, vierde en vijfde lid][ref4], en
      [13, derde lid][ref5]. Bij algemene maatregel van bestuur kunnen regels worden gesteld over de ambtenaren van
      politie die kunnen worden aangewezen als functionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0022463#Artikel13
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '11'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0022463
        artikel: '12'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0022463
        artikel: '13'
        paragraaf: '2'
  - number: 6a.1
    text: |-
      De verwerkingsverantwoordelijke heeft toegang tot de politiegegevens die onder zijn beheer worden verwerkt ten
      behoeve van het toezicht op de naleving van het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel6a
  - number: 6a.2
    text: |-
      De verwerkingsverantwoordelijke verleent de ambtenaren van politie die onder zijn beheer vallen en die zijn belast
      met de taken, bedoeld in [artikel 1, onderdeel a][ref1], toegang tot de politiegegevens die onder zijn beheer
      worden verwerkt, voor zover nodig voor de uitvoering van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
        paragraaf: '1'
  - number: 6a.3
    text: |-
      De verwerkingsverantwoordelijke verleent de verwerker, bedoeld in [artikel 6c, eerste lid][ref1], alsmede degenen
      die belast zijn met de controle en het toezicht, bedoeld in de [artikelen 33][ref2], [34][ref3], [35][ref4]
      en [36][ref5], alsmede degenen die in zijn opdracht technische werkzaamheden verrichten, toegang tot de
      politiegegevens die onder zijn beheer worden verwerkt, voor zover zij deze behoeven voor de uitvoering van hun
      taak.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel6c
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0022463#Artikel36
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 6c
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '33'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '34'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0022463
        artikel: '35'
        paragraaf: '5'
      - id: ref5
        bwb_id: BWBR0022463
        artikel: '36'
        paragraaf: '5'
  - number: 6b
    text: |-
      De verwerkingsverantwoordelijke maakt in voorkomend geval en voor zover mogelijk een duidelijk onderscheid tussen
      politiegegevens betreffende verschillende categorieën van betrokkenen, zoals:
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel6b
  - number: 6b.a
    text: |-
      personen ten aanzien van wie gegronde vermoedens bestaan dat zij een strafbaar feit hebben gepleegd of zullen gaan
      plegen;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel6b
  - number: 6b.b
    text: |-
      slachtoffers van een strafbaar feit, of personen ten aanzien van wie op basis van bepaalde feiten wordt vermoed dat
      zij slachtoffer kunnen worden van een strafbaar feit;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel6b
  - number: 6b.c
    text: |-
      derden, zoals getuigen of personen die anderszins informatie kunnen verstrekken over strafbare feiten, of personen
      die contact hebben of banden onderhouden met één van de personen, bedoeld onder a of d;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel6b
  - number: 6b.d
    text: personen die voor een strafbaar feit zijn veroordeeld.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel6b
  - number: 6c.1
    text: |-
      Indien de verwerkingsverantwoordelijke politiegegevens te zijnen behoeve laat verwerken door een verwerker maakt
      hij uitsluitend gebruik van een verwerker die afdoende garandeert dat de passende technische en organisatorische
      maatregelen en procedures zodanig worden geïmplementeerd dat bij de verwerking wordt voldaan aan het bij of
      krachtens deze wet bepaalde en de rechten van de betrokkene worden gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel6c
  - number: 6c.2
    text: |-
      De uitvoering van verwerkingen door een verwerker wordt geregeld in een schriftelijke overeenkomst of andere
      rechtshandeling die de verwerker aan de verwerkingsverantwoordelijke bindt. Bij of krachtens algemene maatregel van
      bestuur worden nadere regels gesteld over de inhoud van de overeenkomst of rechtshandeling.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel6c
  - number: 6c.3
    text: |-
      De verwerker en eenieder die handelt onder het beheer van de verwerkingsverantwoordelijke of van de verwerker
      verwerkt de politiegegevens uitsluitend volgens de instructies van de verwerkingsverantwoordelijke, tenzij hij op
      grond van de nationale wetgeving of Unierecht tot die verwerking verplicht is.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel6c
  - number: 6c.4
    text: |-
      De verwerker neemt geen andere verwerker in dienst dan na voorafgaande schriftelijke toestemming van de
      verwerkingsverantwoordelijke. In het geval van een algemene schriftelijke toestemming informeert de verwerker
      de verwerkingsverantwoordelijke over de toevoeging of vervanging van andere verwerkers, met de mogelijkheid van
      bezwaar door de verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel6c
  - number: 6c.5
    text: |-
      De verwerker stelt de verwerkingsverantwoordelijke zonder onnodige vertraging in kennis van een inbreuk op de
      beveiliging.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel6c
  - number: '7.1'
    text: |-
      De ambtenaar van politie of de persoon aan wie politiegegevens ter beschikking zijn gesteld is verplicht
      tot geheimhouding daarvan behoudens voor zover een bij of krachtens de wet gegeven voorschrift tot
      verstrekking verplicht, de bepalingen van [paragraaf 3][ref1] verstrekking toelaten of de taak, bedoeld in
      [artikel 1, onderdeel a][ref2], in bijzondere gevallen tot verstrekking noodzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Paragraaf3
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022463
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '1'
        paragraaf: '1'
  - number: '7.2'
    text: |-
      De persoon aan wie politiegegevens zijn verstrekt is verplicht tot geheimhouding daarvan behoudens voor zover een
      bij of krachtens de wet gegeven voorschrift tot verstrekking verplicht of zijn taak daartoe noodzaakt.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel7
  - number: '7.3'
    text: |-
      [Artikel 272, tweede lid, van het Wetboek van Strafrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel272
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '272'
  - number: 7a.1
    text: |-
      Een besluit dat uitsluitend op geautomatiseerde verwerking is gebaseerd, met inbegrip van profilering, dat voor de
      betrokkene nadelige rechtsgevolgen heeft of hem in aanmerkelijke mate treft, is verboden, tenzij wordt voorzien in
      voorafgaande menselijke tussenkomst door of namens de verwerkingsverantwoordelijke en in specifieke voorlichting
      aan de betrokkene.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel7a
  - number: 7a.2
    text: |-
      Een besluit, bedoeld in het eerste lid, wordt niet gebaseerd op de categorieën van politiegegevens, bedoeld
      in [artikel 5][ref1], tenzij de Autoriteit persoonsgegevens over de voorgenomen verwerking is geraadpleegd,
      overeenkomstig [artikel 33b, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel33b
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: 33b
        paragraaf: '5'
  - number: 7a.3
    text: |-
      Profilering die leidt tot discriminatie van personen op grond van de in [artikel 5][ref1] bedoelde categorieën van
      politiegegevens is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel5
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '5'
        paragraaf: '1'
  - number: '8.1'
    text: |-
      Politiegegevens kunnen worden verwerkt met het oog op de uitvoering van de dagelijkse politietaak gedurende een
      periode van één jaar na de datum van de eerste verwerking.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel8
  - number: '8.2'
    text: |-
      Voor zover dat noodzakelijk is met het oog op de uitvoering van de dagelijkse politietaak kunnen politiegegevens
      ten aanzien waarvan de in het eerste lid genoemde termijn is verstreken geautomatiseerd worden vergeleken met
      politiegegevens die worden verwerkt op grond van het eerste lid teneinde vast te stellen of verbanden bestaan
      tussen de betreffende gegevens. De gerelateerde gegevens kunnen verder worden verwerkt met het oog op de uitvoering
      van de dagelijkse politietaak.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel8
  - number: '8.3'
    text: |-
      Voor zover dat noodzakelijk is met het oog op de uitvoering van de dagelijkse politietaak kunnen politiegegevens
      ten aanzien waarvan de in het eerste lid genoemde termijn is verstreken in combinatie met elkaar worden verwerkt
      teneinde vast te stellen of verbanden bestaan tussen de betreffende gegevens. Indien zulke verbanden bestaan kunnen
      de gerelateerde gegevens verder worden verwerkt met het oog op de uitvoering van de politietaak.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel8
  - number: '8.4'
    text: |-
      Politiegegevens, die worden verwerkt op grond van het eerste, tweede en derde lid, kunnen ter beschikking worden
      gesteld voor verdere verwerking op grond van de [artikelen 9][ref1], [10][ref2] en [12][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel12
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '12'
        paragraaf: '2'
  - number: '8.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de categorieën van gegevens op
      basis waarvan politiegegevens vergeleken kunnen worden.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel8
  - number: '8.6'
    text: |-
      De politiegegevens, die zijn verwerkt op grond van het eerste, tweede en derde lid, worden vernietigd zodra zij
      niet langer noodzakelijk zijn voor de uitvoering van de dagelijkse politietaak en worden in ieder geval uiterlijk
      vijf jaar na de datum van eerste verwerking verwijderd.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel8
  - number: '9.1'
    text: |-
      Politiegegevens kunnen gericht worden verwerkt ten behoeve van een onderzoek met het oog op de handhaving van de
      rechtsorde in een bepaald geval.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel9
  - number: '9.2'
    text: |-
      Het doel van het onderzoek wordt binnen een week, nadat is begonnen met de verwerking, bedoeld in het eerste lid,
      schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel9
  - number: '9.3'
    text: |-
      Politiegegevens die worden verwerkt overeenkomstig het eerste lid, kunnen, na instemming van een daartoe bevoegde
      functionaris, ter beschikking worden gesteld voor verdere verwerking voor zover dat noodzakelijk is voor een ander
      onderzoek als bedoeld in het eerste lid, de verwerking, bedoeld in de [artikelen 10][ref1] en [12][ref2], of de
      uitvoering van de dagelijkse politietaak, bedoeld in [artikel 8][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel8
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '12'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
  - number: '9.4'
    text: |-
      De politiegegevens die zijn verwerkt op grond van het eerste lid en niet langer noodzakelijk zijn voor het doel van
      het onderzoek, worden verwijderd, of gedurende een periode van maximaal een half jaar verwerkt teneinde te bezien
      of zij aanleiding geven tot een nieuw onderzoek als bedoeld in het eerste lid of een nieuwe verwerking als bedoeld
      in [artikel 10][ref1], en na verloop van deze termijn verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: '10.1'
    text: |-
      Politiegegevens kunnen gericht worden verwerkt met het oog op het verkrijgen van inzicht in de betrokkenheid van
      personen bij:
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
  - number: 10.1.a
    text: 'het beramen of plegen van misdrijven:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
  - number: 10.1.a.1°
    text: |-
      als omschreven in [artikel 67, eerste lid, van het Wetboek van Strafvordering][ref1], die in georganiseerd verband
      worden beraamd of gepleegd en die gezien hun aard of de samenhang met andere misdrijven die in het georganiseerde
      verband worden beraamd of gepleegd, een ernstige inbreuk op de rechtsorde kunnen opleveren, of


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel67
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '67'
  - number: 10.1.a.2°
    text: waarop naar de wettelijke omschrijving een gevangenisstraf van acht jaar of meer is gesteld, of
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
  - number: 10.1.a.3°
    text: |-
      als omschreven in [artikel 67, eerste lid, van het Wetboek van Strafvordering][ref1], die bij algemene maatregel
      van bestuur zijn aangewezen en die gezien hun aard of samenhang met andere door de betrokkene begane misdrijven een
      ernstige inbreuk op de rechtsorde opleveren;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel67
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '67'
  - number: 10.1.b
    text: |-
      handelingen die kunnen wijzen op het beramen of plegen van bij algemene maatregel van bestuur aan te wijzen
      categorieën van misdrijven die door hun omvang of ernst of hun samenhang met andere misdrijven een ernstig gevaar
      voor de rechtsorde opleveren;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
  - number: 10.1.c
    text: |-
      handelingen die, gezien hun aard of frequentie of het georganiseerde verband waarin zij worden gepleegd, een
      ernstige schending van de openbare orde vormen.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
  - number: '10.2'
    text: 'De verwerking van politiegegevens, bedoeld in het eerste lid, onderdeel a, vindt slechts plaats omtrent:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
  - number: 10.2.a
    text: verdachten van de misdrijven, bedoeld in het eerste lid, onderdeel a;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
  - number: 10.2.b
    text: |-
      personen ten aanzien van wie een redelijk vermoeden bestaat dat zij betrokken zijn bij het beramen of plegen van de
      misdrijven, bedoeld in het eerste lid, onderdeel a;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
  - number: 10.2.c
    text: personen die in een bepaalde relatie staan tot degenen, bedoeld in de onderdelen a en b;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
  - number: 10.2.d
    text: |-
      ambtenaren van politie of buitengewoon opsporingsambtenaren als bedoeld in
      [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '10.3'
    text: 'De verwerking van politiegegevens, bedoeld in het eerste lid, onderdeel b, vindt slechts plaats omtrent:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
  - number: 10.3.a
    text: personen, die betrokken zijn bij de handelingen, bedoeld in het eerste lid, onderdeel b;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
  - number: 10.3.b
    text: personen die in een bepaalde relatie staan tot degenen, bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
  - number: 10.3.c
    text: |-
      ambtenaren van politie of buitengewoon opsporingsambtenaren als bedoeld in
      [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '10.4'
    text: 'De verwerking van politiegegevens, bedoeld in het eerste lid, onderdeel c, vindt slechts plaats omtrent:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
  - number: 10.4.a
    text: |-
      personen ten aanzien van wie een redelijk vermoeden bestaat dat zij betrokken zijn bij ernstige schendingen van de
      openbare orde;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
  - number: 10.4.b
    text: personen die in een bepaalde relatie staan tot degenen, bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
  - number: 10.4.c
    text: |-
      ambtenaren van politie of buitengewoon opsporingsambtenaren als bedoeld in
      [artikel 142, eerste lid, van het wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '10.5'
    text: |-
      De politiegegevens, bedoeld in het eerste lid, kunnen, met instemming van een daartoe bevoegde functionaris,
      ter beschikking worden gesteld voor verdere verwerking voor zover dat noodzakelijk is voor een andere verwerking
      als bedoeld in het eerste lid, een onderzoek als bedoeld in [artikel 9][ref1], een verwerking als bedoeld in
      [artikel 12][ref2], of de uitvoering van de dagelijkse politietaak, bedoeld in [artikel 8][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel8
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '12'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
  - number: '10.6'
    text: |-
      De politiegegevens, bedoeld in het eerste lid, worden verwijderd zodra zij niet langer noodzakelijk zijn voor het
      doel van de verwerking. Daartoe worden de gegevens periodiek gecontroleerd. De gegevens worden verwijderd uiterlijk
      vijf jaar na de datum van de laatste verwerking van gegevens die blijk geeft van de noodzaak tot het verwerken van
      de politiegegevens van betrokkene op grond van het doel als omschreven in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel10
  - number: '11.1'
    text: |-
      Voor zover dat noodzakelijk is voor een onderzoek als bedoeld in [artikel 9, eerste lid][ref1], kunnen
      politiegegevens die voor dat onderzoek zijn verwerkt, geautomatiseerd worden vergeleken met andere politiegegevens
      die worden verwerkt op grond van [artikel 8][ref2] of [9][ref3] teneinde vast te stellen of verbanden bestaan
      tussen de betreffende gegevens. De gerelateerde gegevens kunnen, na instemming van een daartoe bevoegde
      functionaris, voor dat onderzoek verder worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel9
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Voor zover dat noodzakelijk is voor een verwerking als bedoeld in [artikel 10, eerste lid][ref1], kunnen
      politiegegevens die voor dat doel zijn verwerkt, geautomatiseerd worden vergeleken met andere politiegegevens die
      worden verwerkt op grond van de [artikelen 8][ref2], [9][ref3] of [10][ref4] teneinde vast te stellen of verbanden
      bestaan tussen de betreffende gegevens. De gerelateerde gegevens kunnen, na instemming van een daartoe bevoegde
      functionaris, voor die verwerking verder worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: '11.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de uitvoering van de
      gegevensvergelijking. Deze regels kunnen betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel11
  - number: 11.3.a
    text: de categorieën van gegevens op basis waarvan politiegegevens vergeleken kunnen worden;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel11
  - number: 11.3.b
    text: |-
      het coderen van politiegegevens door deze te voorzien van een indicatie over betrouwbaarheid en vertrouwelijkheid
      en de mogelijkheid deze verder te verwerken voor een onderzoek als bedoeld in [artikel 9][ref1] of een verwerking
      als bedoeld in [artikel 10][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: 11.3.c
    text: de wijze waarop de verbanden zichtbaar gemaakt worden.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel11
  - number: '11.4'
    text: |-
      Voor zover dat noodzakelijk is voor een onderzoek als bedoeld in [artikel 9, eerste lid][ref1], of een verwerking
      als omschreven in [artikel 10, eerste lid][ref2], kunnen in bijzondere gevallen in opdracht van het bevoegd gezag,
      bedoeld in de [artikelen 11][ref3], [12][ref4] en [14 van de Politiewet 2012][ref5], politiegegevens die worden
      verwerkt op grond van [artikel 8][ref6], [9][ref7] of [10][ref8] in combinatie met elkaar worden verwerkt teneinde
      vast te stellen of verbanden bestaan tussen de gegevens. Indien zulke verbanden bestaan kunnen de gerelateerde
      gegevens, na instemming van een daartoe bevoegde functionaris, voor dat onderzoek of die verwerking verder worden
      verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0031788#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0031788#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref8]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0031788
        artikel: '12'
      - id: ref5
        bwb_id: BWBR0031788
        artikel: '14'
      - id: ref6
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref8
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: '11.5'
    text: |-
      Voor zover dat noodzakelijk is voor een onderzoek als bedoeld in [artikel 9, eerste lid][ref1], of een verwerking
      als omschreven in [artikel 10, eerste lid][ref2], kunnen politiegegevens die worden verwerkt op grond van
      [artikel 8][ref3], [9][ref4] of [10][ref5] geautomatiseerd worden vergeleken met andere dan politiegegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: '12.1'
    text: |-
      Politiegegevens kunnen worden verwerkt met het oog op de controle op en het beheer van een informant alsmede de
      beoordeling en verantwoording van het gebruik van informantgegevens.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel12
  - number: '12.2'
    text: |-
      De politiegegevens, bedoeld in het eerste lid, kunnen gedurende een periode van maximaal vier maanden na
      de datum van de eerste verwerking ter beschikking worden gesteld voor verdere verwerking op grond van de
      [artikelen 8][ref1], [9][ref2] of [10][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: '12.3'
    text: 'De verwerking van politiegegevens, bedoeld in het eerste lid, vindt slechts plaats omtrent:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel12
  - number: 12.3.a
    text: informanten;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel12
  - number: 12.3.b
    text: personen waarover informanten informatie geven of waarmee informanten contacten onderhouden;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel12
  - number: 12.3.c
    text: |-
      ambtenaren van politie of buitengewoon opsporingsambtenaren als bedoeld in
      [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '12.4'
    text: |-
      Voor zover dat noodzakelijk is voor de controle op en het beheer van een informant kunnen politiegegevens die met
      het oog op dat doel worden verwerkt, geautomatiseerd worden vergeleken met politiegegevens die worden verwerkt
      op grond van [artikel 8][ref1], [9][ref2] of [10][ref3] teneinde vast te stellen of verbanden bestaan tussen de
      betreffende gegevens. De gerelateerde gegevens kunnen voor dat doel verder worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: '12.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën van personen worden aangewezen op wie het eerste, vierde en
      zesde lid van overeenkomstige toepassing zijn indien het bekend worden van politiegegevens voor die categorieën
      van personen gevaar oplevert. Daarbij worden de categorieën van personen aangewezen over wie politiegegevens worden
      verwerkt.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel12
  - number: '12.6'
    text: |-
      De politiegegevens die zijn verwerkt op grond van het eerste en vijfde lid, worden vernietigd zodra zij niet langer
      noodzakelijk zijn voor het doel van de verwerking. Daartoe worden de gegevens elk half jaar gecontroleerd. De
      gegevens worden vernietigd uiterlijk tien jaar na de datum van laatste verwerking van gegevens die blijk geeft van
      de noodzaak tot het verwerken van politiegegevens van betrokkene op grond van het doel, bedoeld in het eerste en
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel12
  - number: '12.7'
    text: |-
      Onder informant wordt in dit artikel verstaan: persoon die heimelijk aan een opsporingsambtenaar informatie
      verstrekt omtrent strafbare feiten of ernstige schendingen van de openbare orde, die door anderen zijn of worden
      gepleegd of verricht, welke verstrekking gevaar voor deze persoon of voor derden oplevert.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel12
  - number: '13.1'
    text: |-
      Ten behoeve van de ondersteuning van de taak, bedoeld in [artikel 1, onderdeel a][ref1], kunnen de politiegegevens
      die worden verwerkt overeenkomstig [artikel 8][ref2], [9][ref3] en [10][ref4], verder worden verwerkt voor zover
      zij relevant zijn voor:


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: 13.1.a
    text: |-
      het vaststellen van eerdere verwerkingen ten aanzien van eenzelfde persoon of zaak, onder meer ter bepaling van
      eerdere betrokkenheid bij strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel13
  - number: 13.1.b
    text: het ophelderen van strafbare feiten die nog niet herleid konden worden tot een verdachte;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel13
  - number: 13.1.c
    text: identificatie van personen of zaken;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel13
  - number: 13.1.d
    text: |-
      het onder de aandacht brengen van personen of zaken met het oog op het uitvoeren van een gevraagde handeling danwel
      met het oog op een juiste bejegening van personen;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel13
  - number: 13.1.e
    text: het uitvoeren van taken ten dienste van de justitie.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel13
  - number: '13.2'
    text: |-
      Ten behoeve van de ondersteuning van de taak, bedoeld in [artikel 1, onderdeel a][ref1], kunnen de
      politiegegevens die worden verwerkt overeenkomstig [artikel 8][ref2], [9][ref3] of [10][ref4] door een
      verwerkingsverantwoordelijke centraal verder worden verwerkt voor zover zij relevant zijn voor het verkrijgen van
      landelijk inzicht in specialistische onderwerpen. De verder verwerkte gegevens worden ter beschikking gesteld aan
      door een verwerkingsverantwoordelijke geautoriseerde personen voor zover zij deze behoeven voor de uitvoering van
      de taak, bedoeld in artikel 1, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: '13.3'
    text: |-
      Ten behoeve van de ondersteuning van de taak, bedoeld in [artikel 1, onderdeel a][ref1], worden de politiegegevens
      die overeenkomstig [artikel 8][ref2], [9][ref3] en [10][ref4] worden verwerkt, voor zover zij relevant zijn voor
      geautomatiseerde vergelijking met het oog op de melding van verschillende verwerkingen jegens eenzelfde persoon,
      daarvoor ter beschikking gesteld en verder verwerkt. De gerelateerde gegevens kunnen, na instemming van een daartoe
      bevoegde functionaris, verder worden verwerkt op grond van [artikel 8][ref5], [9][ref6] of [10][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref7]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
