  - number: 35c.1.d
    text: |-
      een advies te verstrekken aan de verwerkingsverantwoordelijke naar aanleiding van een voorafgaande raadpleging,
      bedoeld in [artikel 33b, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel33b
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 33b
        paragraaf: '5'
  - number: 35c.1.e
    text: |-
      de verwerkingsverantwoordelijke te verplichten een inbreuk in verband met persoonsgegevens te melden aan de
      betrokkene.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35c
  - number: 35c.2
    text: |-
      Bij het besluit over het opleggen van een bestuurlijke boete, bedoeld in het vierde lid, en over de hoogte daarvan
      wordt voor elk concreet geval naar behoren rekening gehouden met:
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35c
  - number: 35c.2.a)
    text: |-
      de aard, de ernst en de duur van de inbreuk, rekening houdend met de aard, de omvang of het doel van de verwerking
      in kwestie alsmede het aantal getroffen betrokkenen en de omvang van de door hen geleden schade;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35c
  - number: 35c.2.b)
    text: de opzettelijke of nalatige aard van de inbreuk;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35c
  - number: 35c.2.c)
    text: |-
      de door de verwerkingsverantwoordelijke of de verwerker genomen maatregelen om de door betrokkenen geleden schade
      te beperken;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35c
  - number: 35c.2.d)
    text: |-
      de mate waarin de verwerkingsverantwoordelijke of de verwerker verantwoordelijk is gezien de technische en
      organisatorische maatregelen die hij heeft uitgevoerd overeenkomstig de [artikelen 4a][ref1] en [4b][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel4b
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 4a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: 4b
        paragraaf: '1'
  - number: 35c.2.e)
    text: eerdere relevante inbreuken door de verwerkingsverantwoordelijke of de verwerker;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35c
  - number: 35c.2.f)
    text: |-
      de mate waarin er met de Autoriteit persoonsgegevens is samengewerkt om de inbreuk te verhelpen en de mogelijke
      negatieve gevolgen daarvan te beperken;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35c
  - number: 35c.2.g)
    text: de categorieën van persoonsgegevens waarop de inbreuk betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35c
  - number: 35c.2.h)
    text: |-
      de wijze waarop de Autoriteit persoonsgegevens kennis heeft gekregen van de inbreuk, met name of, en zo ja in
      hoeverre, de verwerkingsverantwoordelijke of de verwerker de inbreuk heeft gemeld;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35c
  - number: 35c.2.i
    text: |-
      de naleving van de in het eerste lid genoemde maatregelen, voor zover die eerder ten aanzien van de
      verwerkingsverantwoordelijke of de verwerker in kwestie met betrekking tot dezelfde aangelegenheid zijn genomen.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35c
  - number: 35c.3
    text: |-
      De werking van de beschikking tot oplegging van de bestuurlijke boete, bedoeld in het eerste lid, onder c, wordt
      opgeschort totdat de bezwaar- of beroepstermijn is verstreken of, indien bezwaar is gemaakt respectievelijk beroep
      is ingesteld, op het bezwaar respectievelijk het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35c
  - number: 35c.4
    text: |-
      De bevoegdheden, bedoeld in het eerste lid, onderdelen d en e, gelden als een besluit in de zin van de
      [Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 35d.1
    text: |-
      De Autoriteit persoonsgegevens verstrekt aan een autoriteit in een andere lidstaat die is belast met het toezicht,
      bedoeld in [artikel 35, eerste lid][ref1], relevante informatie en wederzijdse bijstand om deze richtlijn op een
      consequente manier ten uitvoer te leggen en toe te passen, en neemt maatregelen om doeltreffend met elkaar samen
      te werken.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel35
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '35'
        paragraaf: '5'
  - number: 35d.2
    text: |-
      De Autoriteit persoonsgegevens neemt alle passende maatregelen die nodig zijn om een verzoek om informatie of
      wederzijdse bijstand van een andere autoriteit, bedoeld in het eerste lid, zonder onnodige vertraging en in ieder
      geval binnen één maand na de ontvangst ervan te beantwoorden. De verzoekende autoriteit wordt geïnformeerd over
      de resultaten of, in voorkomend geval, de voortgang van de maatregelen die naar aanleiding van het verzoek zijn
      genomen.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35d
  - number: 35d.3
    text: |-
      Een verzoek om bijstand van de Autoriteit persoonsgegevens bevat alle nodige informatie, waaronder het doel van
      en de redenen voor het verzoek. De uitgewisselde informatie wordt alleen gebruikt voor het doel waarvoor om die
      informatie is verzocht.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35d
  - number: 35d.4
    text: |-
      De Autoriteit persoonsgegevens kan een verzoek om bijstand van een andere autoriteit, bedoeld in het eerste lid,
      gemotiveerd afwijzen indien:
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35d
  - number: 35d.4.a
    text: |-
      zij niet bevoegd is voor het onderwerp van het verzoek of voor de maatregelen die zij wordt verzocht uit te voeren,
      of
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35d
  - number: 35d.4.b
    text: |-
      inwilliging van het verzoek indruist tegen de richtlijn of het Unierecht of het Nederlandse recht dat op de
      Autoriteit persoonsgegevens van toepassing is.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35d
  - number: 35d.5
    text: |-
      Behoudens regels voor vergoeding voor specifieke uitgaven die voortvloeien uit het verstrekken van wederzijdse
      bijstand in uitzonderlijke omstandigheden geschiedt de wederzijdse bijstand, bedoeld in het tweede lid, kosteloos.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35d
  - number: 35d.6
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze van verstrekking van de
      informatie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35d
  - number: '36.1'
    text: |-
      De verwerkingsverantwoordelijke benoemt een functionaris voor gegevensbescherming. Voor verschillende
      bevoegde autoriteiten kan, rekening houdend met hun organisatiestructuur en omvang, één functionaris
      voor gegevensbescherming worden aangewezen. De functionaris voor gegevensbescherming wordt door de
      verwerkingsverantwoordelijke tijdig en naar behoren betrokken bij alle aangelegenheden die verband houden met de
      bescherming van politiegegevens.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36
  - number: '36.2'
    text: |-
      De functionaris voor gegevensbescherming wordt aangewezen op grond van zijn professionele kwaliteiten en, in het
      bijzonder, zijn deskundigheid op het gebied van de wetgeving en de praktijk inzake gegevensbescherming en zijn
      vermogen de taken, bedoeld in het derde lid, te vervullen.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36
  - number: '36.3'
    text: 'De functionaris voor gegevensbescherming is tenminste belast met de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36
  - number: 36.3.a
    text: |-
      het toezien op de naleving van het bepaalde bij of krachtens deze wet en op het beleid van de
      verwerkingsverantwoordelijke met betrekking tot de bescherming van persoonsgegevens, met inbegrip van de toewijzing
      van de autorisaties, bedoeld in [artikel 6][ref1], de bewustmaking en opleiding van de ambtenaren van politie die
      zijn betrokken bij de verwerking van politiegegevens en de audits, bedoeld in [artikel 33][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel33
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '33'
        paragraaf: '5'
  - number: 36.3.b
    text: |-
      het informeren en adviseren van de verwerkingsverantwoordelijke en de ambtenaren van politie die
      politiegegevens verwerken over hun verplichtingen op grond van het bepaalde bij of krachtens deze wet en andere
      gegevensbeschermingsbepalingen op grond van het Unierecht of het Nederlandse recht;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36
  - number: 36.3.c
    text: |-
      het desgevraagd verstrekken van advies over de gegevensbeschermingseffectbeoordeling, bedoeld in
      [artikel 4c][ref1], en het toezien op de uitvoering ervan;


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel4c
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 4c
        paragraaf: '1'
  - number: 36.3.d
    text: het samenwerken met de Autoriteit persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36
  - number: 36.3.e
    text: |-
      het optreden als contactpunt voor de Autoriteit persoonsgegevens inzake aangelegenheden in verband met de
      verwerking van persoonsgegevens en, voor zover dienstig, het plegen van overleg over enige andere aangelegenheid.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36
  - number: '36.4'
    text: De functionaris voor gegevensbescherming stelt jaarlijks een verslag op van zijn bevindingen.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36
  - number: '36.5'
    text: |-
      De verwerkingsverantwoordelijke maakt de contactgegevens van de functionaris voor gegevensbescherming openbaar en
      meldt de functionaris voor gegevensbescherming aan bij de Autoriteit persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36
  - number: '36.6'
    text: |-
      De verwerkingsverantwoordelijke stelt de functionaris voor gegevensbescherming de benodigde middelen ter
      beschikking voor het vervullen van de taken, bedoeld in het derde lid, en voor het in standhouden van zijn
      deskundigheid.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36
  - number: 36a
    text: |-
      Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba met inachtneming van het in
      deze paragraaf bepaalde.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36a
  - number: 36b
    text: |-
      In afwijking van [artikel 1, onder b, f en k][ref1], wordt voor de toepassing van deze wet in de openbare
      lichamen Bonaire, Sint Eustatius en Saba uitsluitend verstaan onder: - *politietaak:* de taken, bedoeld in
      [artikel 5 van de Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba][ref2],
      van het politiekorps voor Bonaire, Sint Eustatius en Saba, de taken, bedoeld in
      __REF002___________________________________________________________________________________________________________
      ____________________________________________________ en de taken, bedoeld in
      [artikel 5, eerste lid, van de Veiligheidswet BES][ref4];
        - *verantwoordelijke:* dit is bij: 1°. het politiekorps, bedoeld in
      __REF004___________________________________________________________________________________________________________
      ____________: 'Onze Minister van Justitie en Veiligheid; 2°. de rijksrecherche: het College van'
      procureurs-generaal; 3°. de Koninklijke marechaussee: Onze Minister van Defensie; 4°. de buitengewone
      agenten van politie: Onze Minister van Justitie en Veiligheid; 5°. de Kustwacht, bedoeld in
      __REF005___________________________________________________________________________________________________________
      ____________________________________________: Onze Minister
      van Defensie; 6°. het recherchesamenwerkingsteam, bedoeld in
      [artikel 57a van de Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba][ref7]:
      Onze Minister van Justitie en Veiligheid.
        - *ambtenaar van politie:* de ambtenaar van politie, belast met de uitvoering van de taken,
      bedoeld onder a, de ambtenaar van de Koninklijke marechaussee voor zover werkzaam ter uitvoering
      van de politietaken, bedoeld in [artikel 5, eerste lid, van de Veiligheidswet BES][ref8],
      de commandant en door hem aangewezen opvarenden van de Kustwacht voor zover werkzaam ter
      uitvoering van de politietaken alsmede de buitengewone agenten van politie, bedoeld in
      [artikel 10 van de Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba][ref9]
      voor zover zij werkzaam zijn ter uitvoering van de politietaken.


