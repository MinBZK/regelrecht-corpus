        artikel: '9'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: '13.4'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over hetgeen met het oog op de in het eerste, tweede en
      derde lid bedoelde verwerkingen tevoren schriftelijk wordt vastgelegd en ter inzage gelegd. In ieder geval worden
      regels gesteld over de schriftelijke vastlegging van:
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel13
  - number: 13.4.a
    text: |-
      het specifieke doel ten behoeve waarvan de gegevens ter ondersteuning van de taak, bedoeld in
      [artikel 1, onderdeel a][ref1], verder worden verwerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
        paragraaf: '1'
  - number: 13.4.b
    text: |-
      de categorieën van personen over wie gegevens ten behoeve van het betreffende doel verder worden verwerkt en de
      soorten van de over hen op te nemen gegevens;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel13
  - number: 13.4.c
    text: de gevallen waarin of de termijnen waarbinnen het verder verwerken van de betreffende gegevens wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel13
  - number: '14.1'
    text: |-
      De op grond van de [artikelen 8, zesde lid][ref1], [9, vierde lid][ref2], en [artikel 10, zesde lid][ref3],
      verwijderde politiegegevens worden gedurende een termijn van vijf jaar bewaard ten behoeve van verwerking met het
      oog op de afhandeling van klachten en de verantwoording van verrichtingen en vervolgens vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: '14.2'
    text: |-
      De [artikelen 16 tot en met 20][ref1] alsmede de [artikelen 23][ref2] en [24][ref3] zijn op de overeenkomstig het
      eerste lid bewaarde politiegegevens niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel24
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '16'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '23'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '24'
        paragraaf: '3'
  - number: '14.3'
    text: |-
      In bijzondere gevallen en voor zover dat noodzakelijk is voor een doel als bedoeld in [artikel 9][ref1] of
      [10][ref2], kunnen politiegegevens die overeenkomstig het eerste lid worden bewaard, in opdracht van het bevoegd
      gezag, bedoeld in de [artikelen 11][ref3], [12][ref4] en [14 van de Politiewet 2012][ref5], ter beschikking worden
      gesteld voor hernieuwde verwerking op grond van [artikel 9][ref6] of [10][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0031788#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0031788#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref7]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0031788
        artikel: '12'
      - id: ref5
        bwb_id: BWBR0031788
        artikel: '14'
      - id: ref6
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: '14.4'
    text: |-
      Van de vernietiging, bedoeld in het eerste lid, wordt afgezien voor zover de waarde van de archiefbescheiden
      als bestanddeel van het cultureel erfgoed of voor historisch onderzoek zich daartegen verzet. De betreffende
      gegevens worden zo spoedig mogelijk overgebracht naar een archiefbewaarplaats. Daarbij worden met toepassing van
      [artikel 15 van de Archiefwet 1995][ref1] beperkingen aan de openbaarheid gesteld. Onze Ministers kunnen over het
      in de eerste en derde volzin bepaalde beleidsregels vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel15
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '15'
  - number: '15.1'
    text: |-
      De verwerkingsverantwoordelijke stelt politiegegevens ter beschikking aan personen die door hemzelf dan wel door
      een andere verwerkingsverantwoordelijke overeenkomstig [artikel 6, tweede lid][ref1], zijn geautoriseerd voor de
      verwerking van politiegegevens, voor zover zij deze behoeven voor de uitvoering van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel6
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '6'
        paragraaf: '1'
  - number: '15.2'
    text: |-
      In bijzondere gevallen kan, indien dit noodzakelijk is voor een goede uitvoering van de taak, bedoeld in
      [artikel 1, onderdeel a][ref1], de terbeschikkingstelling van politiegegevens door de verwerkingsverantwoordelijke
      worden geweigerd dan wel kan de verwerkingsverantwoordelijke beperkende voorwaarden stellen aan de verdere
      verwerking. Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de gronden waarop de
      terbeschikkingstelling kan worden geweigerd en over de beperkende voorwaarden die kunnen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
        paragraaf: '1'
  - number: 15a.1
    text: |-
      Politiegegevens worden of kunnen worden ter beschikking gesteld aan de bevoegde autoriteiten in andere lidstaten
      van de Europese Unie of aan organen en instanties die zijn opgericht krachtens de hoofdstukken 4 en 5 van
      Titel V van het verdrag betreffende de werking van de Europese Unie, die zijn belast met de taken, bedoeld in
      [artikel 1, onderdeel a][ref1], voor zover dat voortvloeit uit een rechtsinstrument op grond van het verdrag
      betreffende de werking van de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
        paragraaf: '1'
  - number: 15a.2
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de ter beschikkingstelling van
      politiegegevens, bedoeld in het eerste lid, alsmede over de verdere verwerking en de daarbij te stellen voorwaarden
      aan het gebruik daarvan door ontvangstgerechtigde autoriteiten of internationale organen en instanties, en over de
      ontvangst van politiegegevens vanuit andere lidstaten van de Europese Unie. Onverminderd specifieke voorzieningen
      in een rechtsinstrument, bedoeld in het eerste lid, mogen de voorwaarden niet afwijken van de voorwaarden voor
      vergelijkbare doorzendingen van politiegegevens binnen het Europese deel van Nederland.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel15a
  - number: '16.1'
    text: 'De verwerkingsverantwoordelijke verstrekt politiegegevens aan:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel16
  - number: 16.1.a
    text: 'leden van het openbaar ministerie voor zover zij deze behoeven:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel16
  - number: 16.1.a.1°
    text: |-
      in verband met hun gezag of zeggenschap over de politie of over andere personen of instanties die met de opsporing
      van strafbare feiten zijn belast, of
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel16
  - number: 16.1.a.2°
    text: voor de uitvoering van andere hun bij of krachtens de wet opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel16
  - number: 16.1.b
    text: 'de burgemeesters voor zover zij deze behoeven:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel16
  - number: 16.1.b.1°
    text: in verband met hun gezag en zeggenschap over de politie, of
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel16
  - number: 16.1.b.2°
    text: in het kader van de handhaving van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel16
  - number: 16.1.c
    text: 'de verwerkingsverantwoordelijke voor zover hij deze behoeft in verband met:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel16
  - number: 16.1.c.1°
    text: |-
      het verrichten van een onderzoek naar aanleiding van klachten, als bedoeld in
      [artikel 70 van de Politiewet 2012][ref1] en [artikel 14 van de Wet op de bijzondere opsporingsdiensten][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0019919#Artikel14
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '70'
      - id: ref2
        bwb_id: BWBR0019919
        artikel: '14'
  - number: 16.1.c.2°
    text: |-
      disciplinaire bestraffing vanwege niet-nakoming van verplichtingen of plichtsverzuim, als
      geregeld bij of krachtens [artikel 47 van de Politiewet 2012][ref1] en de regelgeving die van
      toepassing is op de aanstelling of arbeidsovereenkomst van de opsporingsambtenaar, bedoeld in
      [artikel 141, onderdeel d, van het Wetboek van Strafvordering][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 16.1.c.3°
    text: |-
      schorsing of ontslag van de ambtenaar van de Koninklijke marechaussee voor zover werkzaam ter uitvoering van de
      politietaken, bedoeld in [artikel 4, eerste lid, onderdelen a, b, c, d, e, g en h van de Politiewet 2012][ref1]
      vanwege niet nakoming van verplichtingen of plichtsverzuim als geregeld bij of krachtens
      [artikel 12 van de Wet ambtenaren defensie][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001952#Artikel12
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001952
        artikel: '12'
  - number: 16.1.c.4°
    text: |-
      het verrichten van een onderzoek naar de betrouwbaarheid als bedoeld in [artikel 48q, eerste lid][ref1],
      [48s, tweede lid][ref2], of [48x, eerste en tweede lid, van de Politiewet 2012][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel48q
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel48s
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel48x
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: 48q
      - id: ref2
        bwb_id: BWBR0031788
        artikel: 48s
      - id: ref3
        bwb_id: BWBR0031788
        artikel: 48x
  - number: '16.2'
    text: |-
      Op de verstrekkingen, bedoeld in het eerste lid, onderdeel c, is [artikel 15, tweede lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel15
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '15'
        paragraaf: '2'
  - number: '17'
    text: |-
      Politiegegevens kunnen worden verstrekt voor zover dit voortvloeit uit de
      [Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039896
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0039896
  - number: 17a.1
    text: |-
      Politiegegevens kunnen met inachtneming van het bij of krachtens deze wet bepaalde worden doorgegeven aan een
      verwerkingsverantwoordelijke in een derde land of aan een internationale organisatie, voor zover dit noodzakelijk
      is voor de doeleinden, bedoeld in [artikel 1, onderdeel a][ref1], en indien de Commissie van de Europese Unie heeft
      besloten dat het derde land of de internationale organisatie een toereikend beschermingsniveau voor de voorgenomen
      gegevensverwerking verzekert.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
        paragraaf: '1'
  - number: 17a.2
    text: |-
      Bij ontstentenis van een besluit van de Commissie, bedoeld in het eerste lid, kunnen politiegegevens worden
      verstrekt of doorgegeven indien:
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel17a
  - number: 17a.2.a
    text: in een juridisch bindend instrument passende waarborgen voor de bescherming van persoonsgegevens zijn geboden; of
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel17a
  - number: 17a.2.b
    text: |-
      de verwerkingsverantwoordelijke na beoordeling van alle omstandigheden heeft geconcludeerd dat het derde land of de
      internationale organisatie passende waarborgen biedt voor de bescherming van persoonsgegevens. De verantwoordelijke
      informeert de Autoriteit persoonsgegevens over de categorieën van doorgifte op grond van dit onderdeel.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel17a
  - number: 17a.3
    text: |-
      Bij ontstentenis van een besluit van de Commissie, bedoeld in het eerste lid, of van passende waarborgen, bedoeld
      in het tweede lid, is een doorgifte of een categorie van doorgiften van politiegegevens aan een derde land of
      internationale organisatie slechts toegelaten indien de doorgifte noodzakelijk is:
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel17a
  - number: 17a.3.a
    text: om een vitaal belang van de betrokkene of van een andere persoon te beschermen;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel17a
  - number: 17a.3.b
    text: |-
      is om de gerechtvaardigde belangen van de betrokkene te beschermen, wanneer het recht van de lidstaat van waaruit
      de doorgifte van politiegegevens plaatsvindt aldus bepaalt;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel17a
  - number: 17a.3.c
    text: is om een onmiddellijk en ernstig gevaar voor de openbare veiligheid van een lidstaat of derde land te voorkomen;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel17a
  - number: 17a.3.d
    text: |-
      in afzonderlijke gevallen met het oog op de uitvoering van de taak, bedoeld in [artikel 1, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
        paragraaf: '1'
  - number: 17a.3.e
    text: |-
      in afzonderlijke gevallen met het oog op het instellen, uitoefenen of verdedigen van rechtsvorderingen in verband
      met de uitvoering van de taak, bedoeld in [artikel 1, onderdeel a][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
        paragraaf: '1'
  - number: 17a.4
    text: |-
      In het geval de doorgifte, bedoeld in het eerste, tweede en derde lid en onverminderd een internationale
      overeenkomst tussen lidstaten en derde landen, politiegegevens betreft die van een andere lidstaat afkomstig zijn,
      is onverminderd deze leden toestemming van de bevoegde autoriteit uit die lidstaat vereist voor doorgifte, tenzij
      de doorgifte noodzakelijk is met het oog op het voorkomen van een onmiddellijk en ernstig gevaar voor de openbare
      veiligheid van een lidstaat of een derde land of voor de fundamentele belangen van een lidstaat, en voorafgaande
      toestemming niet tijdig kan worden verkregen. De voor het geven van voorafgaande toestemming verantwoordelijke
      autoriteit wordt onverwijld in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel17a
  - number: 17a.5
    text: |-
      In afwijking van het eerste, tweede en derde lid, en onverminderd een van kracht zijnde bilaterale of multilaterale
      internationale overeenkomst tussen lidstaten en derde landen op het gebied van justitiële samenwerking in
      strafzaken en politiële samenwerking kunnen in afzonderlijke en specifieke gevallen politiegegevens worden
      doorgegeven aan een ontvanger in een derde land, zonder tussenkomst van een bevoegde autoriteit in dat land, indien
      de doorgifte strikt noodzakelijk is voor de uitvoering van de taak, bedoeld in [artikel 1, onderdeel a][ref1], en
      indien aan de volgende voorwaarden is voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
        paragraaf: '1'
  - number: 17a.5.a
    text: |-
      de doorgifte is strikt noodzakelijk voor de uitvoering van een in het Unierecht of het lidstatelijke recht
      omschreven taak van de bevoegde autoriteit die de doorgifte doet, ter verwezenlijking van de doeleinden van artikel
      1, eerste lid, van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel17a
  - number: 17a.5.b
    text: |-
      de bevoegde autoriteit die de doorgifte doet, bepaalt dat er geen grondrechten en fundamentele vrijheden van de
      betrokkene zijn die zwaarder wegen dan het openbaar belang dat de doorgifte in dat specifieke geval noodzakelijk
      maakt;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel17a
  - number: 17a.5.c
    text: |-
      de bevoegde autoriteit die de doorgifte doet, is van mening dat de doorgifte aan een autoriteit die in het
      derde land bevoegd is voor de in artikel 1, eerste lid, van de richtlijn, bedoelde doeleinden, ondoeltreffend of
      ongeschikt is, met name omdat de doorgifte niet tijdig kan worden bewerkstelligd;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel17a
  - number: 17a.5.d
    text: |-
      de autoriteit die in het derde land bevoegd is voor de in artikel 1, eerste lid, van de richtlijn, bedoelde
      doeleinden wordt zonder onnodige vertraging op de hoogte gebracht, tenzij dit ondoeltreffend of ongeschikt is;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel17a
  - number: 17a.5.e
    text: |-
      de bevoegde autoriteit die de doorgifte doet, licht de ontvanger in over het nader bepaalde doel of de nader
      bepaalde doeleinden waarvoor de persoonsgegevens bij uitsluiting door laatstgenoemde mogen worden verwerkt, op
      voorwaarde dat een dergelijke verwerking noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel17a
  - number: 17a.6
    text: |-
      Politiegegevens kunnen door een derde land of internationale organisatie verder worden doorgegeven aan een ander
      derde land of een andere internationale organisatie, indien de bevoegde autoriteit toestemming verleent voor
      die verdere doorgifte, na alle relevante factoren naar behoren in aanmerking te hebben genomen, waaronder de
      ernst van het strafbare feit, het doel waarvoor de gegevens oorspronkelijk waren doorgegeven en het niveau van
      gegevensbescherming in het derde land of de internationale organisatie waaraan de persoonsgegevens verder worden
      doorgegeven.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel17a
  - number: 17a.7
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de doorgifte van politiegegevens, bedoeld in
      het eerste, tweede, derde en zesde lid, alsmede over de verdere verwerking en de daarbij te stellen voorwaarden
      aan het gebruik daarvan door ontvangstgerechtigde autoriteiten of internationale organen, en over de ontvangst van
      politiegegevens vanuit derde landen.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel17a
  - number: '18.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen personen en instanties worden aangewezen aan wie of waaraan,
      met het oog op een zwaarwegend algemeen belang, politiegegevens worden of kunnen worden verstrekt ter uitvoering
      van de bij of krachtens die algemene maatregel van bestuur aan te geven taak.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel18
  - number: '18.2'
    text: |-
      In bijzondere gevallen kan Onze Minister van Veiligheid en Justitie toestemming of opdracht geven tot het
      verstrekken van daarbij door hem te omschrijven politiegegevens voor zover dit noodzakelijk is met het oog op
      een zwaarwegend algemeen belang. Van de desbetreffende beschikking wordt mededeling gedaan aan de Autoriteit
      persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel18
  - number: '19'
    text: |-
      In bijzondere gevallen kan de verwerkingsverantwoordelijke, voor zover dit noodzakelijk is met het oog op een
      zwaarwegend algemeen belang, in overeenstemming met het bevoegd gezag, bedoeld in de [artikelen 11][ref1],
      [12][ref2] en [14 van de Politiewet 2012][ref3], beslissen tot het verstrekken van politiegegevens aan personen of
      instanties voor de volgende doeleinden:


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel14
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '14'
  - number: 19.a
    text: het voorkomen en opsporen van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel19
  - number: 19.b
    text: het handhaven van de openbare orde;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel19
  - number: 19.c
    text: het verlenen van hulp aan hen die deze behoeven;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel19
  - number: 19.d
    text: het uitoefenen van toezicht op het naleven van regelgeving.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel19
  - number: '20.1'
    text: |-
      De verwerkingsverantwoordelijke kan, voor zover dit met het oog op een zwaarwegend algemeen belang
      noodzakelijk is ten behoeve van een samenwerkingsverband van de bevoegde autoriteiten met personen of
      instanties, in overeenstemming met het bevoegd gezag, bedoeld in de [artikelen 11][ref1], [12][ref2] en
      [14 van de Politiewet 2012][ref3], beslissen tot het verstrekken van politiegegevens aan die personen en instanties
      voor de volgende doeleinden:


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel14
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '14'
  - number: 20.1.a
    text: het voorkomen en opsporen van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel20
  - number: 20.1.b
    text: het handhaven van de openbare orde;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel20
  - number: 20.1.c
    text: het verlenen van hulp aan hen die deze behoeven;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel20
  - number: 20.1.d
    text: het uitoefenen van toezicht op het naleven van regelgeving.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel20
  - number: '20.2'
    text: |-
      In de beslissing, bedoeld in het eerste lid, wordt vastgelegd ten behoeve van welk zwaarwegend algemeen belang
      de verstrekking noodzakelijk is, ten behoeve van welk samenwerkingsverband de politiegegevens worden verstrekt,
      alsmede het doel waartoe dit is opgericht, welke gegevens worden verstrekt, de voorwaarden onder welke de gegevens
      worden verstrekt en aan welke personen of instanties de gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel20
  - number: '21'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de categorieën van politiegegevens die
      worden of kunnen worden verstrekt op grond van de [artikelen 18][ref1], [19][ref2] en [20][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel20
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '18'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '19'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '20'
        paragraaf: '3'
  - number: '22.1'
    text: |-
      Politiegegevens kunnen worden verwerkt ten behoeve van beleidsinformatie, wetenschappelijk onderzoek of statistiek
      met het oog op de taak, bedoeld in [artikel 1, onderdeel a][ref1], onder de voorwaarde dat de resultaten daarvan
      geen persoonsgegevens mogen bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
        paragraaf: '1'
  - number: '22.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de verstrekking van politiegegevens ten
      behoeve van het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel22
  - number: '23.1'
    text: |-
      Verstrekking van politiegegevens aan de leden van het openbaar ministerie als bedoeld in
      [artikel 16, eerste lid, onderdeel a][ref1], kan rechtstreeks plaatsvinden voor zover noodzakelijk met het oog op:


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel16
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '16'
        paragraaf: '3'
  - number: 23.1.a
    text: strafvorderlijke beslissingen omtrent opsporing en vervolging en de hulp aan slachtoffers van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel23
  - number: 23.1.b
    text: bij algemene maatregel van bestuur aan te wijzen beslissingen.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel23
  - number: '23.2'
    text: |-
      Verstrekking van politiegegevens als bedoeld in [artikel 18][ref1] vindt alleen rechtstreeks plaats aan bij
      algemene maatregel van bestuur aangewezen personen of instanties met een publiekrechtelijke taak door middel van
      geautomatiseerde vergelijking van persoonsgegevens met bij algemene maatregel van bestuur aan te wijzen categorieën
      van politiegegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel18
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '18'
        paragraaf: '3'
  - number: '23.3'
    text: |-
      Aan de korpschef, bedoeld in [artikel 27 van de Politiewet 2012][ref1] en aan de Minister van Defensie kan
      verstrekking van politiegegevens als bedoeld in [artikel 18][ref2] rechtstreeks plaatsvinden voor zover
      noodzakelijk met het oog op het uitvoeren van hun bij algemene maatregel van bestuur aangewezen wettelijke taken.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel18
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '18'
        paragraaf: '3'
  - number: '23.4'
    text: |-
      De verwerkingsverantwoordelijke treft passende technische en organisatorische maatregelen teneinde te waarborgen
      dat rechtstreekse verstrekking uitsluitend plaatsvindt voor zover noodzakelijk op grond van het bepaalde bij of
      krachtens het eerste, tweede en derde lid. Bij algemene maatregel van bestuur kunnen hierover nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel23
  - number: 23a.1
    text: |-
      Verstrekking van politiegegevens aan de verwerkingsverantwoordelijke als bedoeld in
      [artikel 16, eerste lid, onderdeel c][ref1], kan rechtstreeks plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel16
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '16'
        paragraaf: '3'
  - number: 23a.2
    text: |-
      Verstrekking van politiegegevens aan de verwerkingsverantwoordelijke ten behoeve van de uitvoering van de
      [artikelen 91][ref1] en [94 van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref2] kan rechtstreeks
      plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel94
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '91'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '94'
  - number: 23a.3
    text: |-
      [Artikel 23, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel23
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '23'
        paragraaf: '3'
  - number: '24.1'
    text: |-
      Voor zover dat noodzakelijk is voor de uitvoering van de taak, bedoeld in
      [artikel 8, tweede lid, van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1], kunnen door de Algemene
      Inlichtingen- en Veiligheidsdienst verwerkte gegevens rechtstreeks geautomatiseerd worden vergeleken met bij
      algemene maatregel van bestuur, op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      en Onze Minister van Veiligheid en Justitie gezamenlijk, te bepalen categorieën van politiegegevens teneinde
      vast te stellen of verbanden bestaan tussen de betreffende gegevens. De gerelateerde gegevens kunnen daarvoor
      rechtstreeks worden verstrekt aan ambtenaren werkzaam bij de Algemene Inlichtingen- en Veiligheidsdienst
      waarbij in bepaalde, door een lid van het College van procureurs-generaal en de Directeur-Generaal van
      de Algemene Inlichtingen- en Veiligheidsdienst gezamenlijk vast te stellen gevallen, op een gezamenlijk
      vast te stellen wijze, daarvan kennis wordt gegeven aan het lid van het openbaar ministerie als bedoeld in
      [artikel 66 van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel66
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '66'
  - number: '24.2'
    text: |-
      Voor zover dat noodzakelijk is voor de uitvoering van de taak, bedoeld in
      [artikel 10, tweede lid, van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1], kunnen door de
      Militaire Inlichtingen- en Veiligheidsdienst verwerkte gegevens rechtstreeks geautomatiseerd worden vergeleken met
      bij algemene maatregel van bestuur, op voordracht van Onze Minister van Defensie en Onze Minister van Veiligheid
      en Justitie gezamenlijk, te bepalen categorieën van politiegegevens teneinde vast te stellen of verbanden bestaan
      tussen de betreffende gegevens. De gerelateerde gegevens kunnen daarvoor rechtstreeks worden verstrekt aan
      ambtenaren werkzaam bij de Militaire Inlichtingen- en Veiligheidsdienst waarbij in bepaalde, door een lid van het
      College van procureurs-generaal en het hoofd van de Militaire Inlichtingen- en Veiligheidsdienst gezamenlijk vast
      te stellen gevallen, op een gezamenlijk vast te stellen wijze, daarvan kennis wordt gegeven aan het lid van het
      openbaar ministerie als bedoeld in [artikel 66 van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel66
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '66'
  - number: '24.3'
    text: |-
      [Artikel 23, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel23
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '23'
        paragraaf: '3'
  - number: 24a.1
    text: |-
      De verwerkingsverantwoordelijke verstrekt aan de betrokkene informatie over de verwerking van politiegegevens in
      een beknopte en toegankelijke vorm en in duidelijke en eenvoudige taal. De informatie wordt met passende middelen,
      waaronder elektronische, verstrekt en in het algemeen in dezelfde vorm als de vorm van het verzoek.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24a
  - number: 24a.2
    text: |-
      Indien de betrokkene verzoekt om inzage, op grond van [artikel 25, eerste lid][ref1], of rectificatie, bedoeld
      in [artikel 28, eerste lid][ref2], wordt hij schriftelijk en zonder onnodige vertraging in kennis gesteld van de
      ontvangst van het verzoek, de termijn voor uitsluitsel en de mogelijkheid om naar aanleiding daarvan een klacht in
      te dienen bij de Autoriteit persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel28
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '25'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '28'
        paragraaf: '4'
  - number: 24a.3
    text: |-
      De verstrekking van de informatie, bedoeld in de [artikelen 7a][ref1], [24b][ref2], [25, eerste lid][ref3],
      [28][ref4], [33a, vijfde lid][ref5], geschiedt kosteloos.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel24b
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0022463#Artikel33a
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 7a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: 24b
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '25'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0022463
        artikel: '28'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0022463
        artikel: 33a
        paragraaf: '5'
  - number: 24a.4
    text: |-
      In het geval van een kennelijk ongegrond of buitensporig verzoek, met name vanwege de geringe tussenpozen tussen
      opeenvolgende verzoeken, kan de verwerkingsverantwoordelijke weigeren gevolg te geven aan het verzoek.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24a
  - number: 24a.5
    text: |-
      De verstrekking van informatie, bedoeld in de [artikelen 24b][ref1], [25, eerste lid][ref2], en [28][ref3], vindt
      plaats overeenkomstig de [artikelen 30 tot en met 34 van het Wetboek van Strafvordering][ref4] als de gegevens in
      een processtuk worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel30
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 24b
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '25'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '28'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '30'
  - number: 24b.1
    text: 'De verwerkingsverantwoordelijke verstrekt in elk geval de volgende informatie aan de betrokkene:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24b
  - number: 24b.1.a
    text: |-
      de identiteit en contactgegevens van de verwerkingsverantwoordelijke en, in voorkomend geval, van de functionaris
      voor gegevensbescherming;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24b
  - number: 24b.1.b
    text: de verwerkingsdoelen van de politiegegevens;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24b
  - number: 24b.1.c
    text: |-
      de rechten van de betrokkene, bedoeld in de [artikelen 25, eerste lid][ref1], en [28, eerste en tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel28
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '25'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '28'
        paragraaf: '4'
  - number: 24b.1.d
    text: het recht een klacht in te dienen bij de Autoriteit persoonsgegevens, en de contactgegevens van die autoriteit.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24b
  - number: 24b.2
    text: 'In specifieke gevallen verstrekt de verwerkingsverantwoordelijke de volgende informatie aan de betrokkene:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24b
  - number: 24b.2.a
    text: de rechtsgrondslag van de verwerking;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24b
  - number: 24b.2.b
    text: de bewaartermijn van de politiegegevens;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24b
  - number: 24b.2.c
    text: in voorkomend geval, de categorieën van de ontvangers van de politiegegevens;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24b
  - number: 24b.2.d
    text: |-
      indien noodzakelijk, extra informatie, in het bijzonder wanneer de politiegegevens zonder medeweten van de
      betrokkene worden verzameld;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24b
  - number: 24b.2.e
    text: |-
      het bestaan van geautomatiseerde besluitvorming, met inbegrip van de in [artikel 7a, eerste lid][ref1], bedoelde
      profilering, en nuttige informatie over de onderliggende logica, alsmede het belang en de verwachte gevolgen van
      die verwerking voor de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel7a
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 7a
        paragraaf: '1'
  - number: 24b.3
    text: |-
      De verwerkingsverantwoordelijke kan de verstrekking van informatie, als bedoeld in het tweede lid, uitstellen,
      beperken of achterwege laten voor zover dit een noodzakelijke en evenredige maatregel is in verband met een belang,
      bedoeld in [artikel 27, eerste lid, onderdelen a tot en met e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel27
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '27'
        paragraaf: '4'
  - number: 24b.4
    text: |-
      Het tweede lid is niet van toepassing ten aanzien van de verwerking van gegevens van personen, bedoeld in
      [artikel 6b, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel6b
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 6b
        paragraaf: '1'
  - number: '25.1'
    text: |-
      De betrokkene heeft het recht om op diens schriftelijke verzoek van de verwerkingsverantwoordelijke binnen zes
      weken uitsluitsel te verkrijgen over de verwerking van hem betreffende persoonsgegevens en, wanneer dat het geval
      is, om die persoonsgegevens in te zien en om informatie te verkrijgen over:
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel25
  - number: 25.1.a
    text: de doelen en de rechtsgrond van de verwerking;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel25
  - number: 25.1.b
    text: de betrokken categorieën van politiegegevens;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel25
  - number: 25.1.c
    text: |-
      de vraag of de deze persoon betreffende politiegegevens gedurende een periode van vier jaar voorafgaande aan het
      verzoek zijn verstrekt en over de ontvangers of categorieën van ontvangers aan wie de gegevens zijn verstrekt, met
      name ontvangers in derde landen of internationale organisaties;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel25
  - number: 25.1.d
    text: de voorziene periode van opslag of indien dat niet mogelijk is, de criteria om die termijn te bepalen;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel25
  - number: 25.1.e
    text: |-
      het recht te verzoeken om rectificatie, vernietiging of afscherming van de verwerking van hem betreffende
      politiegegevens;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel25
  - number: 25.1.f
    text: het recht een klacht in te dienen bij de Autoriteit persoonsgegevens, en de contactgegevens van die autoriteit;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel25
  - number: 25.1.g
    text: de herkomst, voor zover beschikbaar, van de verwerking van hem betreffende politiegegevens.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel25
  - number: '25.2'
    text: |-
      De verwerkingsverantwoordelijke kan zijn beslissing voor ten hoogste vier weken verdagen, dan wel voor ten hoogste
      zes weken indien blijkt dat bij verschillende regionale eenheden of bij de landelijke eenheid van de politie
      politiegegevens over de verzoeker worden verwerkt. Van de verdaging wordt schriftelijk mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel25
  - number: '26.1'
    text: |-
      Bij de behandeling van verzoeken als bedoeld in de [artikelen 25][ref1] en [28][ref2] draagt de
      verwerkingsverantwoordelijke zorg voor een deugdelijke vaststelling van de identiteit van de verzoeker. Wanneer de
      verwerkingsverantwoordelijke redenen heeft om te twijfelen aan de identiteit van de persoon die het verzoek doet,
      kan hij de nodige aanvullende informatie vragen ter bevestiging van de identiteit van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel28
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '25'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '28'
        paragraaf: '4'
  - number: '26.2'
    text: |-
      De verzoeken ten aanzien van minderjarigen die de leeftijd van zestien jaren nog niet hebben bereikt, en ten
      aanzien van onder curatele gestelden worden gedaan door hun wettelijk vertegenwoordigers. De betrokken mededeling
      geschiedt eveneens aan de wettelijk vertegenwoordigers.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel26
  - number: '26.3'
    text: |-
      De verzoeken kunnen tevens worden gedaan door een advocaat aan wie de betrokkene een bijzondere machtiging heeft
      verleend met het oog op de uitoefening van zijn rechten krachtens deze wet en die het verzoek uitsluitend doet
      met de bedoeling de belangen van zijn cliënt te behartigen. De betrokken mededeling geschiedt aan de advocaat. De
      verantwoordelijke kan aan de bijzondere machtiging eisen stellen.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel26
  - number: '27.1'
    text: |-
      Een verzoek als bedoeld in de [artikelen 25, eerste lid][ref1], en [28, eerste en tweede lid][ref2], wordt
      afgewezen voor zover dit een noodzakelijke en evenredige maatregel is:


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel28
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '25'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '28'
        paragraaf: '4'
  - number: 27.1.a
    text: ter vermijding van belemmering van de gerechtelijke onderzoeken of procedures;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel27
  - number: 27.1.b
    text: |-
      ter vermijding van nadelige gevolgen voor de voorkoming, de opsporing, het onderzoek en de vervolging van strafbare
      feiten of de tenuitvoerlegging van straffen;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel27
  - number: 27.1.c
    text: ter bescherming van de openbare veiligheid;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel27
  - number: 27.1.d
    text: ter bescherming van de rechten en vrijheden van derden;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel27
  - number: 27.1.e
    text: ter bescherming van de nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel27
  - number: 27.1.f
    text: |-
      ingeval van een kennelijk ongegrond of buitensporig verzoek, als bedoeld in [artikel 24a, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel24a
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 24a
        paragraaf: '4'
  - number: '27.2'
    text: |-
      Een gehele of gedeeltelijke afwijzing van een verzoek als bedoeld in het eerste lid is schriftelijk en bevat de
      redenen voor de afwijzing.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel27
  - number: '27.3'
    text: |-
      Een verzoek als bedoeld in de [artikelen 25, eerste lid][ref1], en [28, eerste lid][ref2], wordt afgewezen als het
      verzoek de gegevens betreft, die worden verwerkt bij of krachtens [artikel 12][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel12
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '25'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '28'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '12'
        paragraaf: '2'
  - number: '28.1'
    text: |-
      De betrokkene heeft het recht op diens schriftelijke verzoek van de verwerkingsverantwoordelijke rectificatie van
      de hem betreffende onjuiste politiegegevens te verkrijgen en, rekening houdend met het doel van de verwerking, het
      recht om onvolledige politiegegevens te laten aanvullen, onder meer door middel van een aanvullende verklaring. Het
      verzoek bevat de aan te brengen wijzigingen.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel28
  - number: '28.2'
    text: |-
      De betrokkene heeft het recht op diens schriftelijke verzoek van de verwerkingsverantwoordelijke zonder onnodige
      vertraging vernietiging van de hem betreffende politiegegevens te verkrijgen indien de gegevens in strijd met een
      wettelijk voorschrift worden verwerkt of om te voldoen aan een wettelijke verplichting. In plaats van vernietiging
      draagt de verwerkingsverantwoordelijke zorg voor afscherming als:
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel28
  - number: 28.2.a
    text: |-
      de juistheid van de gegevens door de betrokkene wordt betwist en de juistheid of onjuistheid niet kan worden
      geverifieerd, in welk geval de verwerkingsverantwoordelijke de betrokkene informeert voordat de afscherming wordt
      opgeheven, of
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel28
  - number: 28.2.b
    text: de gegevens moeten worden bewaard als bewijsmateriaal.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel28
  - number: '28.3'
    text: |-
      De verwerkingsverantwoordelijke stelt de betrokkene binnen vier weken schriftelijk in kennis met betrekking tot de
      opvolging van zijn verzoek.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel28
  - number: '28.4'
    text: |-
      De verwerkingsverantwoordelijke geeft de rectificatie van de onjuiste politiegegevens door aan de bevoegde
      autoriteit van wie de gegevens afkomstig zijn.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel28
  - number: '28.5'
    text: |-
      Indien de verwerkingsverantwoordelijke politiegegevens heeft gerectificeerd, vernietigd of afgeschermd, stelt hij
      de ontvangers daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel28
  - number: '29.1'
    text: |-
      Een beslissing op een verzoek als bedoeld in [artikel 25][ref1] of [28][ref2] geldt als een besluit in de zin van
      de [Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '25'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '28'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0005537
  - number: '29.2'
    text: |-
      De belanghebbende kan zich binnen de termijn bepaald voor het beroep op grond van de
      [Algemene wet bestuursrecht][ref1] tot de Autoriteit persoonsgegevens wenden met het verzoek te bemiddelen
      of te adviseren in zijn geschil met de verwerkingsverantwoordelijke. In dat geval kan in afwijking van
      [artikel 6:7 van de Algemene wet bestuursrecht][ref2] het beroep nog worden ingesteld nadat de belanghebbende van
      de Autoriteit persoonsgegevens bericht heeft ontvangen dat de behandeling van de zaak is beëindigd, doch uiterlijk
      zes weken na dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '29.3'
    text: |-
      In klachtprocedures waarbij de verwerkingsverantwoordelijke of onder zijn verantwoordelijkheid werkzame personen
      ingevolge [artikel 9:31 van de Algemene wet bestuursrecht][ref1] worden verplicht tot het verstrekken van
      inlichtingen of het overleggen van stukken aan de Nationale ombudsman met betrekking tot politiegegevens die zijn
      te herleiden tot een informant als bedoeld in [artikel 12, zevende lid][ref2], kan Onze Minister van Veiligheid en
      Justitie beslissen dat artikel 9:31, vijfde en zesde lid, van die wet buiten toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel12
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '12'
        paragraaf: '2'
  - number: '29.4'
    text: |-
      Indien Onze Minister van Veiligheid en Justitie heeft beslist dat
      [artikel 9:31, vijfde en zesde lid, van de Algemene wet bestuursrecht][ref1] buiten toepassing blijft en
      de verwerkingsverantwoordelijke of onder zijn verantwoordelijkheid werkzame personen worden verplicht tot
      het overleggen van stukken, wordt volstaan met het ter inzage geven van de desbetreffende stukken. Van de
      desbetreffende stukken wordt op generlei wijze een afschrift vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '29.5'
    text: |-
      In procedures inzake beslissingen als bedoeld in het eerste lid waarbij de verwerkingsverantwoordelijke
      of onder zijn verantwoordelijkheid werkzame personen ingevolge [artikel 8:27][ref1], [8:28][ref2] of
      [8:45 van de Algemene wet bestuursrecht][ref3] worden verplicht tot het verstrekken van inlichtingen of
      het overleggen van stukken met betrekking tot politiegegevens die zijn te herleiden tot een informant als
      bedoeld in [artikel 12, zevende lid][ref4], kan Onze Minister van Veiligheid en Justitie beslissen dat
      [artikel 8:29, derde tot en met vijfde lid, van die wet][ref5] buiten toepassing blijft. Indien aan de rechtbank
      stukken dienen te worden overgelegd, wordt alsdan met het ter inzage geven van de desbetreffende stukken
      volstaan. Van de desbetreffende stukken wordt op generlei wijze een afschrift vervaardigd. Indien Onze Minister
      van Veiligheid en Justitie de rechtbank mededeelt dat uitsluitend zij kennis zal mogen nemen van de inlichtingen
      onderscheidenlijk de stukken, kan de rechtbank slechts met toestemming van de andere partijen mede op grondslag van
      die inlichtingen of stukken uitspraak doen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
