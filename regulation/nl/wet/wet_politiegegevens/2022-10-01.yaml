  - number: 36c.3
    text: |-
      De verwerkingsverantwoordelijke treft passende technische en organisatorische maatregelen om politiegegevens
      te beveiligen tegen onbedoelde of onrechtmatige vernietiging, tegen wijziging, ongeoorloofde mededeling of
      toegang, met name indien de verwerking verzending van gegevens via een netwerk of beschikbaarstelling via directe
      geautomatiseerde toegang omvat, en tegen alle andere vormen van onrechtmatige verwerking, waarbij met name rekening
      wordt gehouden met de risico’s van de verwerking en de aard van de te beschermen gegevens. Deze maatregelen
      garanderen, rekening houdend met de stand van de techniek en de kosten van de tenuitvoerlegging, een passend
      beveiligingsniveau, gelet op de risico’s van de verwerking en de aard van de politiegegevens.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36c
  - number: 36c.4
    text: |-
      De [artikelen 14, eerste, tweede, derde en vijfde lid][ref1], [39][ref2] en
      [40 van de Wet bescherming persoonsgegevens BES][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0028067#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0028067#Artikel40
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0028067
        artikel: '39'
      - id: ref3
        bwb_id: BWBR0028067
        artikel: '40'
  - number: 36c.5
    text: |-
      De verwerkingsverantwoordelijke meldt de privacyfunctionaris, bedoeld in [artikel 34, eerste lid][ref1], aan bij de
      Commissie van toezicht bescherming persoonsgegevens BES.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel34
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '34'
        paragraaf: '5'
  - number: 36d.1
    text: |-
      In afwijking van [artikel 16, eerste lid][ref1], verstrekt de verwerkingsverantwoordelijke politiegegevens aan:


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel16
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36d
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '16'
        paragraaf: '3'
  - number: 36d.1.a
    text: |-
      leden van het openbaar ministerie van Bonaire, Sint Eustatius en Saba, voor zover zij deze behoeven in verband met
      hun gezag of zeggenschap over de politie of over andere personen of instanties die met de opsporing van strafbare
      feiten zijn belast, en voor de uitvoering van andere hen bij of krachtens de wet opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36d
  - number: 36d.1.b
    text: de gezaghebber, voor zover hij deze behoeft in verband met het gezag en zeggenschap over de politie;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36d
  - number: 36d.1.c
    text: |-
      Onze Minister van Justitie en Veiligheid, Onze Minister van Defensie en het College van procureurs-generaal voor
      zover zij deze behoeven in verband met:
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36d
  - number: 36d.1.c.1°
    text: |-
      het verrichten van onderzoek naar aanleiding van klachten als bedoeld in
      [artikel 18 van de Veiligheidswet BES][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel18
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36d
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '18'
  - number: 36d.1.c.2°
    text: |-
      disciplinaire straffen vanwege niet nakoming van verplichtingen of plichtsverzuim als
      geregeld bij of krachtens [artikel 21, tweede lid, van de Veiligheidswet BES][ref1],
      __REF001___________________________________________________________________________________________________________
      __________, of
      __REF002___________________________________________________________________________________________________________
      ________________________________, of


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0028079#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0023731#Artikel19
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36d
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0028079
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0023731
        artikel: '19'
  - number: 36d.1.c.3°
    text: |-
      schorsing of ontslag van de ambtenaar van de Koninklijke marechaussee voor zover werkzaam ter uitvoering van
      de politietaken, bedoeld in [artikel 5, eerste lid, van de Veiligheidswet BES][ref1] vanwege niet nakoming van
      verplichtingen of plichtsverzuim als geregeld bij of krachtens [artikel 12 van de Wet ambtenaren defensie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001952#Artikel12
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36d
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0001952
        artikel: '12'
  - number: 36d.2
    text: |-
      [Artikel 16, tweede lid][ref1], is uitsluitend van toepassing op de verstrekking, bedoeld in het eerste lid, onder
      b.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel16
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36d
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '16'
        paragraaf: '3'
  - number: 36e.1
    text: |-
      Politiegegevens kunnen worden verstrekt aan de verwerkingsverantwoordelijken, bedoeld in
      [artikel 1, onder f][ref1], voor zover dat noodzakelijk is voor een goede uitoefening van de politietaak, bedoeld
      in [artikel 36b, eerste lid, onder a][ref2], dan wel de politietaak in het Europese deel van Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel36b
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36e
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: 36b
        paragraaf: 5a
  - number: 36e.2
    text: |-
      Politiegegevens kunnen worden verstrekt aan leden van het openbaar ministerie van het Europese deel van Nederland,
      voor zover zij deze behoeven in verband met hun gezag of zeggenschap over de politie of over andere personen of
      instanties die met de opsporing van strafbare feiten zijn belast, en voor de uitvoering van andere hen bij of
      krachtens de wet opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36e
  - number: 36e.3
    text: |-
      Politiegegevens kunnen worden verstrekt aan opsporingsambtenaren die werkzaam zijn bij een bijzondere
      opsporingsdienst in het Europese deel van Nederland voor zover zij deze behoeven voor de vervulling van hun taak.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36e
  - number: 36e.4
    text: |-
      Politiegegevens kunnen worden verstrekt aan een internationaal orgaan of aan een internationaal strafgerecht voor
      zover dit voortvloeit uit een verdrag.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36e
  - number: 36e.5
    text: |-
      Politiegegevens kunnen worden verstrekt aan autoriteiten in een land binnen het Koninkrijk of aan een ander land
      die zijn belast met de uitvoering van de politietaak, of van onderdelen daarvan, voor zover dit noodzakelijk
      is voor de goede uitvoering van de politietaak in Bonaire, Sint Eustatius en Saba of de politietaak in het
      desbetreffende land.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36e
  - number: 36e.6
    text: |-
      Politiegegevens worden alleen ingevolge het vierde en vijfde lid verstrekt of doorgegeven indien het ontvangende
      land of internationale orgaan een toereikend beschermingsniveau voor de voorgenomen gegevensverwerking garandeert.
      Of het beschermingsniveau toereikend is wordt beoordeeld met inachtneming van alle omstandigheden die op de
      doorgifte van gegevens of een groep van gegevensverstrekkingen van invloed zijn. In het bijzonder wordt rekening
      gehouden met de aard van de gegevens, met het doel en de duur van de voorgenomen verwerking en verwerkingen,
      het land van herkomst en het land of internationale orgaan van eindbestemming van de gegevens, de algemene en
      sectorale rechtsregels die in het derde land of het internationale orgaan gelden, alsmede de beroepscodes en de
      veiligheidsmaatregelen die in het land of voor het orgaan van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36e
  - number: 36e.7
    text: 'In afwijking van het zesde lid kunnen politiegegevens worden verstrekt of doorgegeven indien:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36e
  - number: 36e.7.a
    text: |-
      dit noodzakelijk is ten behoeve van specifieke belangen van de betrokkene of een dringend zwaarwegend algemeen
      belang, of
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36e
  - number: 36e.7.b
    text: |-
      het betreffende land of ontvangende internationale orgaan passende garanties biedt voor een zorgvuldige
      gegevensverwerking in het concrete geval.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36e
  - number: 36e.8
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de verstrekking of doorgifte van
      politiegegevens, bedoeld in het vierde tot en met het zevende lid, alsmede over de verdere verwerking en de daarbij
      te stellen voorwaarden aan het gebruik daarvan door ontvangstgerechtigde autoriteiten of internationale organen en
      over de ontvangst van politiegegevens vanuit het buitenland.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36e
  - number: 36f.1
    text: |-
      In afwijking van [artikel 29][ref1] geldt een beslissing op een verzoek als bedoeld in [artikel 25][ref2] of
      [28][ref3] gericht aan de verwerkingsverantwoordelijke, bedoeld in [artikel 36b, eerste lid, onder b][ref4], als
      een beschikking als bedoeld in [artikel 3 van de Wet administratieve rechtspraak BES][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel36b
      [ref5]: https://wetten.overheid.nl/BWBR0028455#Artikel3
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36f
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '29'
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '25'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '28'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0022463
        artikel: 36b
        paragraaf: 5a
      - id: ref5
        bwb_id: BWBR0028455
        artikel: '3'
  - number: 36f.2
    text: |-
      De [artikelen 38][ref1] en [39 van de Wet bescherming persoonsgegevens BES][ref2] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0028067#Artikel39
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36f
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0028067
        artikel: '39'
  - number: 36f.3
    text: |-
      In procedures inzake beslissingen als bedoeld in het eerste lid waarbij de verwerkingsverantwoordelijke of onder
      zijn verantwoordelijkheid werkzame personen ingevolge [artikel 37 van de Wet administratieve rechtspraak BES][ref1]
      worden verplicht tot het geven van inlichtingen met betrekking tot politiegegevens die zijn te herleiden tot
      een informant als bedoeld in [artikel 12, zevende lid][ref2], kan Onze Minister van Veiligheid en Justitie
      beslissen dat hieraan geen uitvoering wordt gegeven. [Artikel 29, vijfde lid, tweede en derde zin][ref3], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel29
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36f
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '12'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '29'
        paragraaf: 4a
  - number: 36g.1
    text: |-
      De Commissie van toezicht bescherming persoonsgegevens BES, bedoeld in
      [artikel 44 van de Wet bescherming persoonsgegevens BES][ref1], ziet toe op de verwerking van politiegegevens in
      Bonaire, Sint Eustatius en Saba overeenkomstig het bij en krachtens deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel44
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36g
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '44'
  - number: 36g.2
    text: |-
      De [artikelen 50][ref1] en [51 van de Wet bescherming persoonsgegevens BES][ref2] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0028067#Artikel51
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel36g
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0028067
        artikel: '51'
  - number: '46.1'
    text: |-
      Het bij of krachtens de Wet politiegegevens bepaalde met betrekking tot de gegevensverwerking, bedoeld
      in de [artikelen 10, eerste lid onder a][ref1], en [12][ref2], is van overeenkomstige toepassing op de
      verwerking van persoonsgegevens door een ambtenaar, werkzaam bij een bijzondere opsporingsdienst, bedoeld
      in [artikel 2 van de Wet op de bijzondere opsporingsdiensten][ref3]. Op voordracht van Onze Ministers
      en Onze Minister wie het mede aangaat worden bij algemene maatregel van bestuur ook andere onderdelen
      van het bij of krachtens deze wet bepaalde van overeenkomstige toepassing verklaard op de verwerking van
      persoonsgegevens door een ambtenaar, werkzaam bij een bijzondere opsporingsdienst, bedoeld in artikel
      2 van de Wet op de bijzondere opsporingsdiensten, of een buitengewoon opsporingsambtenaar, bedoeld in
      [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0019919#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '12'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019919
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '46.2'
    text: 'Voor zover toepassing is gegeven aan het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel46
  - number: 46.2.a
    text: |-
      stelt de verwerkingsverantwoordelijke politiegegevens voor verdere verwerking ter beschikking
      aan opsporingsambtenaren, als bedoeld in de [artikelen 141, onderdeel d][ref1], en
      [142, eerste lid, van het Wetboek van Strafvordering][ref2], voor zover zij deze behoeven voor de vervulling van
      hun taak;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '142'
  - number: 46.2.b
    text: |-
      stelt de verwerkingsverantwoordelijke van de bijzondere opsporingsdienst of van de buitengewoon
      opsporingsambtenaar, bedoeld in [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref1], de gegevens
      waarop het bepaalde bij of krachtens deze wet van toepassing of van overeenkomstige toepassing is ter beschikking
      aan personen die overeenkomstig [artikel 6, tweede lid][ref2], zijn geautoriseerd voor de verwerking van
      politiegegevens, voor zover zij deze behoeven voor de vervulling van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel6
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '6'
        paragraaf: '1'
  - number: '46.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de ambtenaren die werkzaam zijn bij een
      bijzondere opsporingsdienst, die tot het verwerken van politiegegevens als bedoeld in het eerste lid kunnen worden
      geautoriseerd, alsmede over het beheer en de organisatie van de bijzondere opsporingsdienst waar zij werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel46
  - number: '47'
    text: |-
      Onze Ministers zenden binnen vijf jaar na de inwerkingtreding van deze wet, en vervolgens telkens na vier jaar,
      gehoord de Autoriteit persoonsgegevens, aan de Staten-Generaal een verslag over de doeltreffendheid en effecten van
      deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel47
  - number: '48'
    text: |-
      In wettelijke procedures en rechtsgedingen tegen een beslissing die op grond van de [Wet politieregisters][ref1] is
      genomen op een verzoek om kennisneming, verbetering, aanvulling, verwijdering of afscherming van politiegegevens,
      dan wel op tegen een dergelijke beslissing in te stellen of ingesteld beroep, blijven, zowel in eerste aanleg als
      in verdere instantie, de regels van toepassing, die golden voor de intrekking van [die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004798
      [ref2]: https://wetten.overheid.nl/BWBR0004798
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004798
      - id: ref2
        bwb_id: BWBR0004798
  - number: '49'
    text: |-
      De [Wet politieregisters][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004798
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004798
  - number: '51'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel51
  - number: '52'
    text: 'Deze wet wordt aangehaald als: Wet politiegegevens.'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel52
