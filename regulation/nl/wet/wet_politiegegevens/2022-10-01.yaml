        artikel: '8'
  - number: 31a.1
    text: |-
      Onverminderd bestaande rechtsmiddelen heeft iedere betrokkene het recht een klacht in te dienen bij de Autoriteit
      persoonsgegevens indien de betrokkene van mening is dat de verwerking van hem betreffende persoonsgegevens niet in
      overeenstemming is met het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31a
  - number: 31a.2
    text: |-
      Indien de Autoriteit persoonsgegevens niet bevoegd is op grond van [artikel 35, eerste lid][ref1], zendt zij de
      klacht zonder onnodige vertraging door aan de autoriteit in een andere lidstaat van de Europese Unie die bevoegd is
      tot het uitoefenen van het toezicht, bedoeld in artikel 35, eerste lid. De betrokkene wordt van de doorzending in
      kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel35
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '35'
        paragraaf: '5'
  - number: 31a.3
    text: Op verzoek van de betrokkene verleent de Autoriteit persoonsgegevens verdere bijstand.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31a
  - number: 31a.4
    text: |-
      De Autoriteit persoonsgegevens faciliteert het indienen van klachten door maatregelen te nemen, zoals het
      ter beschikking stellen van een klachtformulier dat ook elektronisch kan worden ingevuld, zonder dat andere
      communicatiemiddelen worden uitgesloten.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31a
  - number: 31a.5
    text: |-
      De Autoriteit persoonsgegevens neemt binnen drie maanden een beslissing op een klacht als bedoeld in het eerste
      lid. Een beslissing op een klacht geldt als een besluit in de zin van de [Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 31a.6
    text: |-
      In het geval van een kennelijk ongegronde of buitensporige klacht, met name vanwege de geringe tussenpozen tussen
      klachten, kan de Autoriteit persoonsgegevens weigeren gevolg te geven aan de klacht.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31a
  - number: 31b
    text: |-
      Een vordering tegen de Autoriteit persoonsgegevens wordt ingesteld bij een gerecht, bedoeld in
      [artikel 2 van de Wet op de rechterlijke organisatie][ref1], in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel2
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31b
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '2'
  - number: 31c.1
    text: |-
      Indien iemand schade lijdt doordat ten opzichte van hem in strijd wordt gehandeld met de bij of krachtens deze
      wet gegeven voorschriften zijn de volgende leden van toepassing, onverminderd de aanspraken op grond van andere
      wettelijke regels.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31c
  - number: 31c.2
    text: |-
      Voor nadeel dat niet in vermogensschade bestaat, heeft de benadeelde recht op een naar billijkheid vast te stellen
      schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31c
  - number: 31c.3
    text: |-
      De verwerkingsverantwoordelijke is aansprakelijk voor de schade of het nadeel, voortvloeiende uit het niet-nakomen
      van de in het eerste lid bedoelde voorschriften. De verwerker is aansprakelijk voor die schade of dat nadeel, voor
      zover ontstaan door zijn werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31c
  - number: 31c.4
    text: |-
      De verwerkingsverantwoordelijke of de verwerker kan geheel of gedeeltelijk worden ontheven van deze
      aansprakelijkheid, indien hij bewijst dat de schade hem niet kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31c
  - number: 31d.1
    text: 'De verwerkingsverantwoordelijke houdt een register bij dat de volgende gegevens bevat:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31d
  - number: 31d.1.a
    text: |-
      de naam en de contactgegevens van de verwerkingsverantwoordelijke, de gezamenlijk verwerkingsverantwoordelijken en
      de functionaris voor gegevensbescherming;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31d
  - number: 31d.1.b
    text: de doelen van de verwerking;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31d
  - number: 31d.1.c
    text: |-
      de categorieën van ontvangers aan wie politiegegevens zijn of zullen worden verstrekt, met inbegrip van ontvangers
      in derde landen of internationale organisaties;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31d
  - number: 31d.1.d
    text: een beschrijving van de categorieën van betrokkenen en van de categorieën van persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31d
  - number: 31d.1.e
    text: in voorkomend geval, het gebruik van profilering;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31d
  - number: 31d.1.f
    text: |-
      in voorkomend geval, de categorieën van doorgiften van politiegegevens aan een derde land of een internationale
      organisatie;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31d
  - number: 31d.1.g
    text: |-
      een aanwijzing van de rechtsgrondslag van de verwerking, met inbegrip van doorgiften, waarvoor de politiegegevens
      bedoeld zijn;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31d
  - number: 31d.1.h
    text: |-
      zo mogelijk, de beoogde termijnen waarbinnen de verschillende categorieën van gegevens worden verwijderd of
      vernietigd;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31d
  - number: 31d.1.i
    text: |-
      zo mogelijk, een algemene beschrijving van de technische en organisatorische maatregelen ter beveiliging, bedoeld
      in [artikel 4a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel4a
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31d
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 4a
        paragraaf: '1'
  - number: 31d.1.j
    text: |-
      de toekenning van de autorisaties, bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel6
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31d
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '6'
        paragraaf: '1'
  - number: 31d.2
    text: 'De verwerker houdt een register bij dat de volgende gegevens bevat:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31d
  - number: 31d.2.a
    text: |-
      de naam en de contactgegevens van de verwerker of verwerkers en van iedere verwerkingsverantwoordelijke ten behoeve
      van wie de verwerker handelt en, in voorkomend geval, van de functionaris voor gegevensbescherming;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31d
  - number: 31d.2.b
    text: de categorieën van verwerkingen die namens iedere verwerkingsverantwoordelijke zijn uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31d
  - number: 31d.2.c
    text: |-
      indien van toepassing, doorgiften van politiegegevens aan een derde land of een internationale organisatie, onder
      vermelding van dat derde land of die internationale organisatie, indien door de verwerkingsverantwoordelijke
      uitdrukkelijk daartoe geïnstrueerd;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31d
  - number: 31d.2.d
    text: |-
      indien mogelijk, een algemene beschrijving van de technische en organisatorische maatregelen, bedoeld in
      [artikel 4a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel4a
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel31d
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 4a
        paragraaf: '1'
  - number: '32.1'
    text: 'De verwerkingsverantwoordelijke draagt zorg voor de schriftelijke vastlegging van:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel32
  - number: 32.1.a
    text: |-
      de doelen van de onderzoeken, bedoeld in [artikel 9, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
  - number: 32.1.b
    text: |-
      de verstrekking of doorgifte van politiegegevens op grond van [paragraaf 3][ref1], met uitzondering van de
      verstrekking, bedoeld in [artikel 17][ref2] en [artikel 24, eerste en tweede lid][ref3], indien dit zich niet
      verdraagt met het belang van de veiligheid van de staat;


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Paragraaf3
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel24
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0022463
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '17'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '24'
        paragraaf: '3'
  - number: 32.1.c
    text: |-
      de feitelijke of juridische redenen die ten grondslag liggen aan een afwijzing, bedoeld in
      [artikel 27, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel27
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '27'
        paragraaf: '4'
  - number: 32.1.d
    text: |-
      een inbreuk op de beveiliging van persoonsgegevens, bedoeld in [artikel 33a][ref1], inclusief de feiten omtrent de
      inbreuk, de gevolgen ervan en de maatregelen die zijn getroffen ter correctie.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel33a
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 33a
        paragraaf: '5'
  - number: '32.2'
    text: |-
      Bij de doorgifte van politiegegevens aan een verwerkingsverantwoordelijke in een derde land of aan een
      internationale organisatie, bedoeld in [artikel 17a, tweede lid, onderdeel b, en derde lid][ref1], omvat de
      schriftelijke vastlegging de datum en tijd van doorgifte, informatie over de ontvangende bevoegde autoriteit, de
      reden van doorgifte en de doorgegeven gegevens zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel17a
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 17a
        paragraaf: '3'
  - number: '32.3'
    text: |-
      De verantwoordelijke draagt zorg voor de schriftelijke melding van een gemeenschappelijke verwerking van
      politiegegevens aan de Autoriteit persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel32
  - number: '32.4'
    text: |-
      De politiegegevens, bedoeld in het eerste lid, worden bewaard tenminste tot de datum waarop de laatste controle,
      bedoeld in [artikel 33][ref1], is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel33
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '33'
        paragraaf: '5'
  - number: '32.5'
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de wijze van vastlegging.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel32
  - number: '33.1'
    text: |-
      De verwerkingsverantwoordelijke doet de uitvoering van de bij of krachtens deze wet gegeven regels controleren door
      middel van het periodiek doen verrichten van privacy audits.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33
  - number: '33.2'
    text: |-
      De verwerkingsverantwoordelijke zendt een afschrift van de controleresultaten van de privacy audits aan de
      Autoriteit persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33
  - number: '33.3'
    text: |-
      Indien uit de controleresultaten blijkt dat niet wordt voldaan aan het bij of krachtens deze wet bepaalde, laat de
      verwerkingsverantwoordelijke binnen een jaar een hercontrole uitvoeren op die onderdelen die niet voldeden aan de
      gestelde voorwaarden. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33
  - number: '33.4'
    text: |-
      Een ieder die betrokken is bij een controle als bedoeld in het eerste of derde lid is verplicht tot geheimhouding
      van de persoonsgegevens waarover hij de beschikking heeft gekregen, behoudens voor zover enig wettelijk voorschrift
      hem tot mededeling verplicht of zijn taak daartoe noodzaakt.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33
  - number: '33.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld betreffende de inhoud en wijze van
      uitvoering van de controles, bedoeld in het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33
  - number: 33a.1
    text: |-
      De verwerkingsverantwoordelijke meldt een inbreuk op de beveiliging onverwijld en uiterlijk binnen 72 uur nadat
      hij ervan heeft kennis genomen aan de Autoriteit persoonsgegevens, tenzij het niet waarschijnlijk is dat de inbreuk
      een risico voor de rechten en vrijheden van personen met zich meebrengt. In het geval de melding na 72 uur wordt
      gedaan, gaat deze vergezeld van een motivering voor de vertraging.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33a
  - number: 33a.2
    text: 'De melding, bedoeld in het eerste lid, bevat ten minste de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33a
  - number: 33a.2.a
    text: |-
      een beschrijving van de aard en omvang van de inbreuk, bedoeld in het eerste lid, waaronder begrepen, waar
      mogelijk, de categorieën van betrokkenen en van gegevensbestanden en, bij benadering, het aantal betrokkenen en
      gegevensbestanden;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33a
  - number: 33a.2.b
    text: |-
      de mededeling van de naam en de contactgegevens van de functionaris voor gegevensbescherming of een ander
      contactpunt waar meer informatie kan worden verkregen;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33a
  - number: 33a.2.c
    text: een beschrijving van de waarschijnlijke gevolgen van de inbreuk, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33a
  - number: 33a.2.d
    text: |-
      een beschrijving van de voorgestelde of uitgevoerde maatregelen om de inbreuk, bedoeld in het eerste lid, te
      beëindigen en, in voorkomend geval, de maatregelen ter beperking van de eventuele nadelige gevolgen ervan.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33a
  - number: 33a.3
    text: |-
      Voor zover het niet mogelijk is de informatie, bedoeld in het tweede lid, gelijktijdig te verstrekken, kan deze
      zonder onnodige vertraging in stappen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33a
  - number: 33a.4
    text: |-
      De verwerkingsverantwoordelijke deelt een inbreuk op de beveiliging van politiegegevens, die zijn doorgezonden
      door of aan een verwerkingsverantwoordelijke van een andere lidstaat, zonder onnodige vertraging mee aan de
      verwerkingsverantwoordelijke van deze lidstaat.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33a
  - number: 33a.5
    text: |-
      De verwerkingsverantwoordelijke deelt een inbreuk op de beveiliging mede aan de betrokkenen als deze inbreuk
      waarschijnlijk een hoog risico voor de rechten en vrijheden van personen met zich meebrengt. De mededeling bevat
      een omschrijving van de aard van de inbreuk op de beveiliging en ten minste de informatie, bedoeld in het tweede
      lid, onderdelen b, c en d.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33a
  - number: 33a.6
    text: 'De mededeling aan de betrokkenen, bedoeld in het vijfde lid, is niet vereist wanneer:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33a
  - number: 33a.6.a
    text: |-
      de verwerkingsverantwoordelijke passende technische en organisatorische beschermingsmaatregelen heeft getroffen
      en deze maatregelen zijn toegepast op de politiegegevens waarop de inbreuk, bedoeld in het eerste lid, betrekking
      heeft;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33a
  - number: 33a.6.b
    text: |-
      de verwerkingsverantwoordelijke maatregelen heeft getroffen om ervoor te zorgen dat het hoge risico, bedoeld in het
      vijfde lid, zich waarschijnlijk niet meer zal voordoen, of
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33a
  - number: 33a.6.c
    text: |-
      de mededeling een onevenredige inspanning zou vergen. In dat geval volgt een openbare mededeling of vergelijkbare
      maatregel waarmee de betrokkenen even doeltreffend worden geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33a
  - number: 33a.7
    text: |-
      De mededeling aan de betrokkene kan worden uitgesteld, beperkt of achterwege gelaten op de gronden, bedoeld in
      [artikel 27, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel27
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '27'
        paragraaf: '4'
  - number: 33b.1
    text: |-
      De Autoriteit persoonsgegevens wordt door de verwerkingsverantwoordelijke of de verwerker geraadpleegd over de
      voorgenomen verwerking van politiegegevens die in een nieuw bestand zullen worden opgenomen, wanneer:
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33b
  - number: 33b.1.a
    text: |-
      de aard van de verwerking, in het bijzonder met gebruikmaking van nieuwe technologieën, mechanismen of procedures,
      een hoog risico voor de rechten en vrijheden van de betrokkene met zich meebrengt;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33b
  - number: 33b.1.b
    text: |-
      uit een gegevensbeschermingseffectbeoordeling, bedoeld in [artikel 4c, eerste lid][ref1], blijkt dat de verwerking
      een hoog risico zou opleveren als de verwerkingsverantwoordelijke geen maatregelen treft om het risico te beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel4c
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 4c
        paragraaf: '1'
  - number: 33b.2
    text: |-
      De Autoriteit persoonsgegevens kan een lijst opstellen van de verwerkingen waarvoor raadpleging, overeenkomstig het
      eerste lid, vereist is.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33b
  - number: 33b.3
    text: |-
      De verwerkingsverantwoordelijke verstrekt de Autoriteit persoonsgegevens de gegevensbeschermingseffectbeoordeling,
      bedoeld in [artikel 4c][ref1], en, desgevraagd, alle andere informatie op grond waarvan de Autoriteit
      persoonsgegevens de conformiteit van de verwerking en met name de risico’s voor de bescherming van persoonsgegevens
      van de betrokkene en de betrokken waarborgen kan beoordelen.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel4c
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 4c
        paragraaf: '1'
  - number: 33b.4
    text: |-
      Wanneer de Autoriteit persoonsgegevens van oordeel is dat de voorgenomen verwerking van politiegegevens, bedoeld
      in het eerste lid, niet voldoet aan het bij of krachtens deze wet bepaalde, geeft zij binnen een termijn van
      ten hoogste zes weken schriftelijk advies aan de verwerkingsverantwoordelijke en, in voorkomend geval, aan de
      verwerker.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33b
  - number: 33b.5
    text: |-
      De termijn, bedoeld in het vierde lid, kan, rekening houdend met de complexiteit van de voorgenomen verwerking,
      worden verlengd met een maand. In dit geval wordt de verwerkingsverantwoordelijke en, in voorkomend geval, de
      verwerker, binnen een maand na de ontvangst van het verzoek in kennis gesteld van de verlenging en de redenen
      daarvoor.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel33b
  - number: '34.1'
    text: |-
      De verwerkingsverantwoordelijke benoemt een of meer privacyfunctionarissen. De privacyfunctionaris dient de
      verwerkingsverantwoordelijke en de personen die voor de verwerkingsverantwoordelijke werkzaam zijn van advies en
      ziet namens de verwerkingsverantwoordelijke toe op de verwerking van politiegegevens overeenkomstig het bij of
      krachtens de wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel34
  - number: '34.2'
    text: |-
      De privacyfunctionaris houdt een overzicht bij van de schriftelijke vastlegging van de gegevens, bedoeld in
      [artikel 32, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel32
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '32'
        paragraaf: '5'
  - number: '34.3'
    text: De privacyfunctionaris stelt jaarlijks een verslag op van zijn bevindingen.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel34
  - number: '35.1'
    text: |-
      De Autoriteit persoonsgegevens, bedoeld in
      [artikel 6, eerste lid, van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1], ziet in het Europese
      deel van Nederland toe op de verwerking van politiegegevens overeenkomstig het bij en krachtens deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel6
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0040940
        artikel: '6'
  - number: '35.2'
    text: |-
      [Artikel 16 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel16
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0040940
        artikel: '16'
  - number: 35a.1
    text: |-
      De Autoriteit persoonsgegevens treedt bij de uitvoering van haar taken en de uitoefening van haar bevoegdheden
      volledig onafhankelijk op.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35a
  - number: 35a.2
    text: |-
      Ieder lid van de Autoriteit persoonsgegevens beschikt over de nodige kwalificaties, ervaring en vaardigheden, met
      name op het gebied van de bescherming van persoonsgegevens, voor het uitvoeren van zijn taken en het uitoefenen van
      zijn bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35a
  - number: 35a.3
    text: |-
      De leden van de Autoriteit persoonsgegevens blijven vrij van al dan niet rechtstreekse externe invloed en vragen
      noch aanvaarden instructies van wie dan ook bij de uitvoering van hun taken en de uitoefening van hun bevoegdheden
      overeenkomstig deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35a
  - number: 35a.4
    text: |-
      De leden van de Autoriteit persoonsgegevens onthouden zich van alle handelingen die onverenigbaar zijn met hun
      taken en verrichten gedurende hun ambtstermijn geen al dan niet bezoldigde beroepswerkzaamheden die onverenigbaar
      zijn met hun taken.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35a
  - number: 35b.1
    text: 'De Autoriteit persoonsgegevens heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35b
  - number: 35b.1.a
    text: |-
      het toezien op de verwerking van persoonsgegevens overeenkomstig het bij of krachtens deze wet bepaalde en het
      handhaven daarvan;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35b
  - number: 35b.1.b
    text: |-
      het geven van advies over voorstellen van wet en ontwerpen van algemene maatregelen van bestuur die geheel of voor
      een belangrijk deel betrekking hebben op de verwerking van persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35b
  - number: 35b.1.c
    text: |-
      het beter bekend maken van het brede publiek met, en verschaffen van meer inzicht in de risico's, de regels, de
      waarborgen en de rechten in verband met de verwerking van persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35b
  - number: 35b.1.d
    text: |-
      het beter bekend maken van de verwerkingsverantwoordelijken en de verwerkers met hun verplichtingen uit hoofde van
      het bij of krachtens deze wet bepaalde;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35b
  - number: 35b.1.e
    text: |-
      het desgevraagd verstrekken van informatie aan iedere betrokkene over de uitoefening van zijn rechten uit hoofde
      van het bij of krachtens deze wet bepaalde en het, in voorkomend geval, daartoe samenwerken met de autoriteiten in
      andere lidstaten, bedoeld in [artikel 35d, eerste lid][ref1], die zijn belast met het toezicht;


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel35d
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 35d
        paragraaf: '5'
  - number: 35b.1.f
    text: |-
      het behandelen van klachten van betrokkenen, of van organen, organisaties of verenigingen die de betrokkene
      vertegenwoordigen, het onderzoeken van de inhoud van de klacht en de klager binnen een redelijke termijn in kennis
      stellen van de voortgang en het resultaat van het onderzoek, met name indien verder onderzoek of coördinatie met
      een andere toezichthoudende autoriteit nodig is;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35b
  - number: 35b.1.g
    text: |-
      het naar aanleiding van een klacht, bedoeld in [artikel 31a, eerste lid][ref1], controleren van de rechtmatigheid
      van de verwerking en de betrokkene binnen een redelijke termijn informeren over het resultaat van de controle of
      van de redenen waarom de controle niet is verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel31a
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 31a
        paragraaf: 4a
  - number: 35b.1.h
    text: |-
      het samenwerken met andere autoriteiten die zijn belast met het toezicht, bedoeld in
      [artikel 35d, eerste lid][ref1], teneinde voor de samenhang in de toepassing en de handhaving van het bij of
      krachtens deze wet bepaalde te zorgen, onder meer door informatie te delen en wederzijdse bijstand aan te bieden;


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel35d
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 35d
        paragraaf: '5'
  - number: 35b.1.i
    text: |-
      het verrichten van onderzoeken naar de naleving van het bij of krachtens deze wet bepaalde, ook op basis van
      informatie die de Autoriteit persoonsgegevens ontvangt van een andere autoriteit die is belast met het toezicht,
      bedoeld in [artikel 35, eerste lid][ref1], of een andere overheidsinstantie;


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel35
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '35'
        paragraaf: '5'
  - number: 35b.1.j
    text: |-
      het volgen van de relevante ontwikkelingen voor zover deze de bescherming van persoonsgegevens beïnvloeden, met
      name de ontwikkeling van de informatie- en communicatietechnologieën;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35b
  - number: 35b.1.k
    text: |-
      het verstrekken van advies naar aanleiding van een voorafgaande raadpleging, bedoeld in
      [artikel 33b, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel33b
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 33b
        paragraaf: '5'
  - number: 35b.1.l
    text: |-
      het leveren van een bijdrage aan de activiteiten van het Comité, opgericht bij Verordening (EU) 2016/679 van het
      Europees Parlement en de Raad van 27 april 2016 betreffende de bescherming van natuurlijke personen in verband
      met de verwerking van persoonsgegevens en betreffende het vrije verkeer van die gegevens en tot intrekking van
      [Richtlijn 95/46/EG](31995L0046).
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35b
  - number: 35b.2
    text: |-
      De Autoriteit persoonsgegevens verricht haar taken kosteloos voor de betrokkene en voor de functionaris voor
      gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35b
  - number: 35c.1
    text: 'De Autoriteit persoonsgegevens is bevoegd:'
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35c
  - number: 35c.1.a
    text: |-
      de verwerkingsverantwoordelijke of de verwerker te waarschuwen dat met de voorgenomen verwerkingen waarschijnlijk
      een inbreuk wordt gemaakt op het bij of krachtens deze wet bepaalde;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35c
  - number: 35c.1.b
    text: een last onder bestuursdwang op te leggen ter handhaving van het bij of krachtens deze wet bepaalde;
    url: https://wetten.overheid.nl/BWBR0022463/2022-10-01#Artikel35c
  - number: 35c.1.c
    text: |-
      een bestuurlijke boete op te leggen indien de verwerkingsverantwoordelijke handelt in strijd met hetgeen is
      bepaald bij of krachtens: - de [artikelen 4a][ref1], [4b][ref2], [4c][ref3], [6c][ref4], [31d][ref5], [32][ref6],
      [33a][ref7], [33b][ref8] en [36][ref9] van ten hoogste het bedrag van de geldboete van de vijfde categorie van
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref10];
        - de [artikelen 5][ref11], [7a][ref12], [24a][ref13], [24b][ref14], [25][ref15] en [28][ref16] van ten hoogste het
      bedrag van de geldboete van de zesde categorie van [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref17];


