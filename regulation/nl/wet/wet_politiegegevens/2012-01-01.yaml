  - number: '17'
    text: |-
      1 Politiegegevens kunnen worden verstrekt voor zover dit voortvloeit uit de
      [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1].

      2 Politiegegevens kunnen worden verstrekt voor zover dit voortvloeit uit wettelijke bepalingen met betrekking tot
      de samenwerking met en bijstand aan een internationaal strafgerecht.

      3 Politiegegevens kunnen worden verstrekt aan autoriteiten in een land binnen het Koninkrijk of in een ander
      land die zijn belast met de uitvoering van de politietaak, of van onderdelen daarvan, voor zover dit noodzakelijk
      is voor de goede uitvoering van de politietaak in het Europese deel van Nederland of de politietaak in het
      desbetreffende land.

      4 Politiegegevens kunnen worden verstrekt aan Interpol en Europol voor zover dit voortvloeit uit internationale
      verdragen of wettelijke bepalingen.

      5 Politiegegevens worden alleen ingevolge het derde of vierde lid verstrekt indien bij de ontvangende instantie
      voldoende waarborgen aanwezig zijn voor een juist gebruik van de verstrekte gegevens en voor de bescherming van de
      persoonlijke levenssfeer.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de verstrekking van
      politiegegevens, bedoeld in het derde en vierde lid, alsmede over de daarbij te stellen voorwaarden aan het gebruik
      daarvan door ontvangstgerechtigde politieautoriteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0013409
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013409
  - number: 17a
    text: |-
      1 Politiegegevens kunnen worden verstrekt aan de verantwoordelijken, bedoeld in
      [artikel 36b, eerste lid, onder b][ref1], voor zover dat noodzakelijk is voor een goede uitoefening van de
      politietaak in het Europese deel van Nederland dan wel de politietaak, bedoeld in 36b, eerste lid, onder a.

      2 Politiegegevens kunnen worden verstrekt aan leden van het openbaar ministerie van Bonaire, Sint Eustatius en
      Saba, voor zover zij deze behoeven in verband met hun gezag of zeggenschap over de politie of over andere personen
      of instanties die met de opsporing van strafbare feiten zijn belast, en voor de uitvoering van andere hen bij of
      krachtens de wet opgedragen taken.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de verstrekking van
      politiegegevens, bedoeld in het eerste lid, alsmede over de daarbij te stellen voorwaarden aan het gebruik daarvan
      door ontvangstgerechtigde politieautoriteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel36b
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 36b
        paragraaf: 5a
  - number: '18'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen personen en instanties worden aangewezen aan wie of
      waaraan, met het oog op een zwaarwegend algemeen belang, politiegegevens worden of kunnen worden verstrekt ter
      uitvoering van de bij of krachtens die algemene maatregel van bestuur aan te geven taak.

      2 In bijzondere gevallen kan Onze Minister van Justitie of Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties toestemming of opdracht geven tot het verstrekken van daarbij door hem te omschrijven
      politiegegevens voor zover dit noodzakelijk is met het oog op een zwaarwegend algemeen belang. Van de
      desbetreffende beschikking wordt mededeling gedaan aan het College bescherming persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel18
  - number: '19'
    text: |-
      In bijzondere gevallen kan de verantwoordelijke, voor zover dit noodzakelijk is met het oog op een zwaarwegend
      algemeen belang, in overeenstemming met het op grond van de [Politiewet 1993][ref1] bevoegde gezag, beslissen tot
      het verstrekken van politiegegevens aan personen of instanties voor de volgende doeleinden:

      a. het voorkomen en opsporen van strafbare feiten;

      b. het handhaven van de openbare orde;

      c. het verlenen van hulp aan hen die deze behoeven;

      d. het uitoefenen van toezicht op het naleven van regelgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006299
  - number: '20'
    text: |-
      1 De verantwoordelijke kan, voor zover dit met het oog op een zwaarwegend algemeen belang noodzakelijk is ten
      behoeve van een samenwerkingsverband van de politie met personen of instanties, in overeenstemming met het op grond
      van de [Politiewet 1993][ref1] bevoegd gezag, beslissen tot het verstrekken van politiegegevens aan die personen en
      instanties voor de volgende doeleinden:

      a. het voorkomen en opsporen van strafbare feiten;

      b. het handhaven van de openbare orde;

      c. het verlenen van hulp aan hen die deze behoeven;

      d. het uitoefenen van toezicht op het naleven van regelgeving.

      2 In de beslissing, bedoeld in het eerste lid, wordt vastgelegd ten behoeve van welk zwaarwegend algemeen belang
      de verstrekking noodzakelijk is, ten behoeve van welk samenwerkingsverband de politiegegevens worden verstrekt,
      alsmede het doel waartoe dit is opgericht, welke gegevens worden verstrekt, de voorwaarden onder welke de gegevens
      worden verstrekt en aan welke personen of instanties de gegevens worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006299
  - number: '21'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de categorieën van politiegegevens die
      worden of kunnen worden verstrekt op grond van de [artikelen 18][ref1], [19][ref2] en [20][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel20
