preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels vast te stellen voor het verwerken van
    politiegegevens;

    Alzo Wij in overweging genomen hebben, dat ter bescherming van de persoonlijke levenssfeer met betrekking tot die
    verwerking uitvoering dient te worden gegeven aan artikel 10, tweede en derde lid, van de Grondwet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. politiegegeven: elk gegeven betreffende een geïdentificeerde of identificeerbare natuurlijke persoon dat in het
      kader van de uitoefening van de politietaak wordt verwerkt;

      b. politietaak: de taken, bedoeld in de [artikelen 2][ref1] en [6, eerste lid, van de Politiewet 1993][ref2];

      c. verwerken van politiegegevens: elke handeling of elk geheel van handelingen met betrekking tot politiegegevens,
      waaronder in ieder geval het verzamelen, vastleggen, ordenen, bewaren, bijwerken, wijzigen, opvragen,
      raadplegen, gebruiken, vergelijken, verstrekken door middel van doorzending, verspreiding of enige andere vorm
      van terbeschikkingstelling, samenbrengen, met elkaar in verband brengen, alsmede het afschermen, uitwissen of
      vernietigen van politiegegevens;

      d. verstrekken van politiegegevens: het bekend maken of ter beschikking stellen van politiegegevens;

      e. ter beschikking stellen van politiegegevens: het verstrekken van politiegegevens aan personen die overeenkomstig
      deze wet zijn geautoriseerd voor het verwerken van politiegegevens;

      f. verantwoordelijke: dit is bij:

      1°. een regionaal politiekorps: de korpsbeheerder, bedoeld in
      [artikel 1, eerste lid, onderdeel c, van de Politiewet 1993][ref3];

      2°. het Korps landelijke politiediensten: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      3°. de rijksrecherche: het College van procureurs-generaal;

      4°. de Koninklijke marechaussee: Onze Minister van Defensie;

      5°. de bijzondere ambtenaren van politie, bedoeld in [artikel 43 van de Politiewet 1993][ref4]: Onze Minister van
      Justitie;

      6°. een gemeenschappelijke verwerking van politiegegevens met het oog op een gemeenschappelijk doel door twee of
      meer organisaties als bedoeld in dit onderdeel dan wel een of meer organisaties als bedoeld in dit onderdeel en de
      bijzondere ambtenaren van politie: de verantwoordelijke die door de betrokken verantwoordelijken is belast met de
      feitelijke zorg voor de verwerking en het treffen van de maatregelen, bedoeld in [artikel 4][ref5];

      g. betrokkene: degene op wie een politiegegeven betrekking heeft;

      h. het College bescherming persoonsgegevens: het College, bedoeld in
      [artikel 51 van de Wet bescherming persoonsgegevens][ref6];

      i. bewerker: degene die ten behoeve van de verantwoordelijke politiegegevens verwerkt, zonder aan zijn rechtstreeks
      gezag te zijn onderworpen;

      j. Onze Ministers: Onze Ministers van Justitie, van Binnenlandse Zaken en Koninkrijksrelaties en van Defensie
      gezamenlijk;

      k. ambtenaar van politie: de ambtenaar, bedoeld in [artikel 3 van de Politiewet 1993][ref7], alsmede de
      ambtenaar van de Koninklijke marechaussee voor zover werkzaam ter uitvoering van de politietaken, bedoeld in
      [artikel 6, eerste lid, van de Politiewet 1993][ref8], en, indien [artikel 46][ref9] wordt toegepast, de ambtenaar,
      werkzaam bij de in dat artikel bedoelde dienst;

      l. gerelateerde gegevens: de politiegegevens die bij de vergelijking van gegevens, bedoeld in de
      [artikelen 8, tweede lid][ref10], [11, eerste en tweede lid][ref11], [12, vierde lid][ref12] en
      [24, eerste lid][ref13], overeenkomen en de erbij behorende gegevens alsmede de politiegegevens waarmee bij
      het in combinatie met elkaar verwerken van politiegegevens, bedoeld in de [artikelen 8, derde lid][ref14] en
      [11, vierde lid][ref15], verband blijkt te bestaan, voor zover verdere verwerking van de gegevens voor het
      betreffende doel noodzakelijk is.


