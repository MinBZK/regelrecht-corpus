  - number: '4'
    text: |-
      1 De verantwoordelijke treft de nodige maatregelen opdat politiegegevens, gelet op de doeleinden waarvoor zij
      worden verwerkt, juist en nauwkeurig zijn. Hij verbetert of vernietigt politiegegevens of vult deze aan indien hem
      blijkt dat deze onjuist of onvolledig zijn.

      2 De verantwoordelijke treft de nodige maatregelen opdat politiegegevens worden verwijderd of vernietigd zodra zij
      niet langer noodzakelijk zijn voor het doel waarvoor ze zijn verwerkt of dit door enige wettelijke bepaling wordt
      vereist.

      3 De verantwoordelijke treft passende technische en organisatorische maatregelen om de politiegegevens te
      beveiligen tegen verlies of enige vorm van onrechtmatige verwerking. Deze maatregelen garanderen, rekening houdend
      met de stand van de techniek en de kosten van de tenuitvoerlegging, een passend beveiligingsniveau, gelet op de
      risico’s die de verwerking en de aard van de politiegegevens met zich meebrengen.

      4 De verantwoordelijke heeft toegang tot de politiegegevens die onder zijn beheer worden verwerkt ten behoeve van
      het toezicht op de naleving van het bij of krachtens deze wet bepaalde.

      5 De verantwoordelijke verleent degenen die belast zijn met de controle en het toezicht, bedoeld in de
      [artikelen 33][ref1], [34][ref2], [35][ref3] en [36][ref4], alsmede degenen die in zijn opdracht technische
      werkzaamheden verrichten toegang tot de politiegegevens die onder zijn beheer worden verwerkt, voor zover zij deze
      behoeven voor de uitvoering van hun taak.

      6 De [artikelen 14, eerste, tweede, derde en vijfde lid][ref5], [49][ref6] en
      [50 van de Wet bescherming persoonsgegevens][ref7] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel33
