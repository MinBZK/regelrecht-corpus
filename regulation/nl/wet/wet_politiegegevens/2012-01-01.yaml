  - number: 36c
    text: |-
      1 Voor de toepassing van:

      a. [artikel 4, zesde lid][ref1], wordt in plaats van «De [artikelen 14, eerste, tweede, derde en vijfde lid][ref2],
      [49][ref3] en [50 van de Wet bescherming persoonsgegevens][ref4]» gelezen: De artikelen 14, eerste, tweede, derde
      en vijfde lid, [39][ref5] en [40 van de Wet bescherming persoonsgegevens BES][ref6];

      b. [artikel 7, derde lid][ref7], wordt in plaats van
      «[Artikel 272, tweede lid, van het Wetboek van Strafrecht][ref8]» gelezen:
      [Artikel 285, tweede lid, van het Wetboek van Strafrecht BES][ref9];

      c. [artikel 10, eerste lid, onder a, sub 1° en 3°][ref10] wordt in plaats van
      «[artikel 67, eerste lid, van het Wetboek van Strafvordering][ref11]» gelezen:
      [artikel 100, eerste lid, van het Wetboek van Strafvordering BES][ref12];

      d. de [artikelen 10, tweede lid, onder d, derde lid, onder c, vierde lid, onder c][ref13], en
      [12, derde lid, onder c][ref14], wordt in plaats van «buitengewoon opsporingsambtenaren als bedoeld in
      [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref15]» gelezen: de buitengewone agenten van politie,
      bedoeld in [artikel 184, eerste lid, van het Wetboek van Strafvordering BES][ref16];

      e. de [artikelen 11, vierde lid][ref17], [14, derde lid][ref18], en [19, aanhef][ref19],
      wordt in plaats van «[Politiewet 1993][ref20] bevoegde gezag» gelezen:
      [Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba][ref21] bevoegde gezag op
      Bonaire, Sint Eustatius of Saba;

      f. [artikel 14, vierde lid][ref22], wordt in plaats van «[artikel 15 van de Archiefwet 1995][ref23]» gelezen:
      [artikel 20 van de Archiefwet BES][ref24];

      g. [artikel 17, derde lid][ref25], wordt in plaats van «het Europese deel van Nederland» gelezen: Bonaire, Sint
      Eustatius en Saba;

      h. de [artikelen 18, tweede lid][ref26], [32, tweede lid][ref27], [33, tweede lid][ref28]
      en [34, vierde lid][ref29], wordt in plaats van «het College bescherming persoonsgegevens»
      gelezen: de Commissie van toezicht bescherming persoonsgegevens BES, bedoeld in
      [artikel 44 van de Wet bescherming persoonsgegevens BES][ref30];

      i. [artikel 20, eerste lid][ref31], wordt in plaats van «[Politiewet 1993][ref32] bevoegd gezag» gelezen:
      [Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba][ref33] bevoegde gezag op
      Bonaire, Sint Eustatius of Saba;

      j. [artikel 23, eerste lid][ref34], wordt in plaats van «openbaar ministerie als bedoeld in
      [artikel 16, eerste lid, onderdeel b][ref35],» gelezen: openbaar ministerie van Bonaire, Sint Eustatius en Saba;

      k. [artikel 24, eerste en tweede lid][ref36], wordt in plaats van «een lid van
      het College van procureurs-generaal» gelezen: de procureur-generaal, bedoeld in
      __REF001___________________________________________________________________________________________________________
      __________;

      l. [artikel 28, tweede lid][ref38], wordt in plaats van
      «[Artikel 37, eerste lid, van de Wet bescherming persoonsgegevens][ref39]» gelezen:
      [Artikel 29, eerste lid, van de Wet bescherming persoonsgegevens BES][ref40].

      2 De [artikelen 1, onder h][ref41], [17a][ref42], [35][ref43], [36][ref44] en [46][ref45] zijn niet van toepassing.


