  - number: '5'
    text: |-
      De verwerking van politiegegevens betreffende iemands godsdienst of levensovertuiging, ras, politieke gezindheid,
      gezondheid, seksuele leven, alsmede persoonsgegevens betreffende het lidmaatschap van een vakvereniging vindt
      slechts plaats in aanvulling op de verwerking van andere politiegegevens en voor zover dit voor het doel van de
      verwerking onvermijdelijk is.
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel5
  - number: '6'
    text: |-
      1 De verantwoordelijke onderhoudt een systeem van autorisaties dat voldoet aan de vereisten van zorgvuldigheid
      en evenredigheid.

      2 Politiegegevens worden slechts verwerkt door ambtenaren van politie die daartoe door de verantwoordelijke zijn
      geautoriseerd en voor zover de autorisatie strekt.

      3 De verantwoordelijke autoriseert de ambtenaren van politie die onder zijn beheer vallen voor de verwerking
      van politiegegevens ter uitvoering van de onderdelen van de politietaak waarmee zij zijn belast. De autorisatie
      bevat een duidelijke omschrijving van de verwerkingen waartoe de betreffende ambtenaar wordt geautoriseerd en de
      onderdelen van de politietaak ter uitvoering waarvan de verwerkingen worden gedaan.

      4 In bijzondere gevallen kan de verantwoordelijke personen die geen ambtenaar van politie zijn en die onder
      zijn beheer vallen, autoriseren voor de verwerking van politiegegevens ter uitvoering van de onderdelen van de
      politietaak waarmee zij zijn belast.

      5 In bijzondere gevallen kan de verantwoordelijke de ambtenaar van politie die onder het beheer van een andere
      verantwoordelijke valt, autoriseren voor de verwerking van politiegegevens ter uitvoering van in de autorisatie
      omschreven onderdelen van de politietaak. De verwerking van politiegegevens vindt in dat geval plaats onder het
      beheer van de verantwoordelijke die de autorisatie heeft verleend.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de categorieën van personen die
      voor bepaalde gegevensverwerkingen geautoriseerd kunnen worden en de deskundigheidseisen die aan hen kunnen worden
      gesteld.

      7 De verantwoordelijke wijst de functionaris aan, bedoeld in [artikel 9, derde lid][ref1], [10, vijfde lid][ref2],
      [11, eerste, tweede en vierde lid][ref3], [12, vierde en vijfde lid][ref4], en [13, derde lid][ref5]. Bij algemene
      maatregel van bestuur kunnen regels worden gesteld over de ambtenaren van politie die kunnen worden aangewezen
      als functionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0022463#Artikel13
