  - number: '24'
    text: |-
      1 Voor zover dat noodzakelijk is voor de uitvoering van de taak, bedoeld in
      [artikel 6, tweede lid, van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1], kunnen door
      de Algemene Inlichtingen- en Veiligheidsdienst verwerkte gegevens rechtstreeks geautomatiseerd worden
      vergeleken met bij algemene maatregel van bestuur, op voordracht van Onze minister van Binnenlandse Zaken
      en Koninkrijksrelaties en Onze minister van Justitie gezamenlijk, te bepalen categorieën van politiegegevens
      teneinde vast te stellen of verbanden bestaan tussen de betreffende gegevens. De gerelateerde gegevens
      kunnen daarvoor rechtstreeks worden verstrekt aan ambtenaren werkzaam bij de Algemene Inlichtingen- en
      Veiligheidsdienst waarbij in bepaalde, door een lid van het College van procureurs-generaal en het hoofd
      van de Algemene Inlichtingen- en Veiligheidsdienst gezamenlijk vast te stellen gevallen, op een gezamenlijk
      vast te stellen wijze, daarvan kennis wordt gegeven aan het lid van het openbaar ministerie als bedoeld in
      [artikel 38 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref2].

      2 Voor zover dat noodzakelijk is voor de uitvoering van de taak, bedoeld in
      [artikel 7, tweede lid, van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref3], kunnen door de
      Militaire Inlichtingen- en Veiligheidsdienst verwerkte gegevens rechtstreeks geautomatiseerd worden vergeleken
      met bij algemene maatregel van bestuur, op voordracht van Onze minister van Defensie en Onze minister van Justitie
      gezamenlijk, te bepalen categorieën van politiegegevens teneinde vast te stellen of verbanden bestaan tussen
      de betreffende gegevens. De gerelateerde gegevens kunnen daarvoor rechtstreeks worden verstrekt aan ambtenaren
      werkzaam bij de Militaire Inlichtingen- en Veiligheidsdienst waarbij in bepaalde, door een lid van het College van
      procureurs-generaal en het hoofd van de Militaire Inlichtingen- en Veiligheidsdienst gezamenlijk vast te stellen
      gevallen, op een gezamenlijk vast te stellen wijze, daarvan kennis wordt gegeven aan het lid van het openbaar
      ministerie als bedoeld in [artikel 38 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref4].

      3 [Artikel 23, derde lid][ref5], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0013409#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0013409#Artikel38
      [ref5]: https://wetten.overheid.nl/BWBR0022463#Artikel23
