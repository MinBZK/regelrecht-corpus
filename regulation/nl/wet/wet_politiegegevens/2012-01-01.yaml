  - number: '10'
    text: |-
      1 Politiegegevens kunnen gericht worden verwerkt met het oog op het verkrijgen van inzicht in de betrokkenheid van
      personen bij:

      a. het beramen of plegen van misdrijven:

      1°. als omschreven in [artikel 67, eerste lid, van het Wetboek van Strafvordering][ref1], die in georganiseerd
      verband worden beraamd of gepleegd en die gezien hun aard of de samenhang met andere misdrijven die in het
      georganiseerde verband worden beraamd of gepleegd, een ernstige inbreuk op de rechtsorde kunnen opleveren, of

      2°. waarop naar de wettelijke omschrijving een gevangenisstraf van acht jaar of meer is gesteld, of

      3°. als omschreven in [artikel 67, eerste lid, van het Wetboek van Strafvordering][ref2], die bij algemene
      maatregel van bestuur zijn aangewezen en die gezien hun aard of samenhang met andere door de betrokkene begane
      misdrijven een ernstige inbreuk op de rechtsorde opleveren;

      b. handelingen die kunnen wijzen op het beramen of plegen van bij algemene maatregel van bestuur aan te wijzen
      categorieën van misdrijven die door hun omvang of ernst of hun samenhang met andere misdrijven een ernstig gevaar
      voor de rechtsorde opleveren;

      c. handelingen die, gezien hun aard of frequentie of het georganiseerde verband waarin zij worden gepleegd, een
      ernstige schending van de openbare orde vormen.

      2 De verwerking van politiegegevens, bedoeld in het eerste lid, onderdeel a, vindt slechts plaats omtrent:

      a. verdachten van de misdrijven, bedoeld in het eerste lid, onderdeel a;

      b. personen ten aanzien van wie een redelijk vermoeden bestaat dat zij betrokken zijn bij het beramen of plegen van
      de misdrijven, bedoeld in het eerste lid, onderdeel a;

      c. personen die in een bepaalde relatie staan tot degenen, bedoeld in de onderdelen a en b;

      d. ambtenaren van politie of buitengewoon opsporingsambtenaren als bedoeld in
      [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref3].

      3 De verwerking van politiegegevens, bedoeld in het eerste lid, onderdeel b, vindt slechts plaats omtrent:

      a. personen, die betrokken zijn bij de handelingen, bedoeld in het eerste lid, onderdeel b;

      b. personen die in een bepaalde relatie staan tot degenen, bedoeld in onderdeel a;

      c. ambtenaren van politie of buitengewoon opsporingsambtenaren als bedoeld in
      [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref4].

      4 De verwerking van politiegegevens, bedoeld in het eerste lid, onderdeel c, vindt slechts plaats omtrent:

      a. personen ten aanzien van wie een redelijk vermoeden bestaat dat zij betrokken zijn bij ernstige schendingen van
      de openbare orde;

      b. personen die in een bepaalde relatie staan tot degenen, bedoeld in onderdeel a;

      c. ambtenaren van politie of buitengewoon opsporingsambtenaren als bedoeld in
      [artikel 142, eerste lid, van het wetboek van Strafvordering][ref5].

      5 De politiegegevens, bedoeld in het eerste lid, kunnen, met instemming van een daartoe bevoegde functionaris,
      ter beschikking worden gesteld voor verdere verwerking voor zover dat noodzakelijk is voor een andere verwerking
      als bedoeld in het eerste lid, een onderzoek als bedoeld in [artikel 9][ref6], een verwerking als bedoeld in
      [artikel 12][ref7], of de uitvoering van de dagelijkse politietaak, bedoeld in [artikel 8][ref8].

      6 De politiegegevens, bedoeld in het eerste lid, worden verwijderd zodra zij niet langer noodzakelijk zijn voor het
      doel van de verwerking. Daartoe worden de gegevens periodiek gecontroleerd. De gegevens worden verwijderd uiterlijk
      vijf jaar na de datum van de laatste verwerking van gegevens die blijk geeft van de noodzaak tot het verwerken van
      de politiegegevens van betrokkene op grond van het doel als omschreven in het eerste lid.


