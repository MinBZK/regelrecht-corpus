  - number: 36d
    text: |-
      1 In afwijking van [artikel 16, eerste lid][ref1], verstrekt de verantwoordelijke politiegegevens aan:

      a. leden van het openbaar ministerie van Bonaire, Sint Eustatius en Saba, voor zover zij deze behoeven in verband
      met hun gezag of zeggenschap over de politie of over andere personen of instanties die met de opsporing van
      strafbare feiten zijn belast, en voor de uitvoering van andere hen bij of krachtens de wet opgedragen taken;

      b. de gezaghebber, voor zover hij deze behoeft in verband met het gezag en zeggenschap over de politie;

      c. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister van Defensie voor zover zij deze
      behoeven in verband met:

      1°. het verrichten van onderzoek naar aanleiding van klachten als bedoeld in
      [artikel 18 van de Veiligheidswet BES][ref2], of

      2°. disciplinaire straffen vanwege niet nakoming van verplichtingen of plichtsverzuim als
      geregeld bij of krachtens [artikel 21, tweede lid, van de Veiligheidswet BES][ref3] of
      __REF001___________________________________________________________________________________________________________
      __________, of

      3°. schorsing of ontslag van de ambtenaar van de Koninklijke marechaussee voor zover werkzaam ter
      uitvoering van de politietaken, bedoeld in [artikel 5, eerste lid, van de Veiligheidswet BES][ref5]
      vanwege niet nakoming van verplichtingen of plichtsverzuim als geregeld bij of krachtens
      [artikel 12 van de Militaire Ambtenarenwet 1931][ref6].

      2 [Artikel 16, tweede lid][ref7], is uitsluitend van toepassing op de verstrekking, bedoeld in het eerste lid,
      onder c.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel16
