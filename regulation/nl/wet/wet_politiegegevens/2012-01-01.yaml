  - number: '12'
    text: |-
      1 Politiegegevens kunnen worden verwerkt met het oog op de controle op en het beheer van een informant alsmede de
      beoordeling en verantwoording van het gebruik van informantgegevens.

      2 De politiegegevens, bedoeld in het eerste lid, kunnen gedurende een periode van maximaal vier maanden na
      de datum van de eerste verwerking ter beschikking worden gesteld voor verdere verwerking op grond van de
      [artikelen 8][ref1], [9][ref2] of [10][ref3].

      3 De verwerking van politiegegevens, bedoeld in het eerste lid, vindt slechts plaats omtrent:

      a. informanten;

      b. personen waarover informanten informatie geven of waarmee informanten contacten onderhouden;

      c. ambtenaren van politie of buitengewoon opsporingsambtenaren als bedoeld in
      [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref4].

      4 Voor zover dat noodzakelijk is voor de controle op en het beheer van een informant kunnen politiegegevens die
      met het oog op dat doel worden verwerkt, geautomatiseerd worden vergeleken met politiegegevens die worden verwerkt
      op grond van [artikel 8][ref5], [9][ref6] of [10][ref7] teneinde vast te stellen of verbanden bestaan tussen de
      betreffende gegevens. De gerelateerde gegevens kunnen voor dat doel verder worden verwerkt.

      5 Bij algemene maatregel van bestuur kunnen categorieën van personen worden aangewezen op wie het eerste, vierde
      en zesde lid van overeenkomstige toepassing zijn indien het bekend worden van politiegegevens voor die categorieën
      van personen gevaar oplevert. Daarbij worden de categorieën van personen aangewezen over wie politiegegevens worden
      verwerkt.

      6 De politiegegevens die zijn verwerkt op grond van het eerste en vijfde lid, worden vernietigd zodra zij niet
      langer noodzakelijk zijn voor het doel van de verwerking. Daartoe worden de gegevens elk half jaar gecontroleerd.
      De gegevens worden vernietigd uiterlijk tien jaar na de datum van laatste verwerking van gegevens die blijk geeft
      van de noodzaak tot het verwerken van politiegegevens van betrokkene op grond van het doel, bedoeld in het eerste
      en vijfde lid.

      7 Onder informant wordt in dit artikel verstaan: persoon die heimelijk aan een opsporingsambtenaar informatie
      verstrekt omtrent strafbare feiten of ernstige schendingen van de openbare orde, die door anderen zijn of worden
      gepleegd of verricht, welke verstrekking gevaar voor deze persoon of voor derden oplevert.


