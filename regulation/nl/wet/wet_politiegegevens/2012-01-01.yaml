  - number: 36e
    text: |-
      1 Politiegegevens kunnen worden verstrekt aan de verantwoordelijken, bedoeld in [artikel 1, onder f][ref1],
      voor zover dat noodzakelijk is voor een goede uitoefening van de politietaak, bedoeld in
      [artikel 36b, eerste lid, onder a][ref2], dan wel de politietaak in het Europese deel van Nederland.

      2 Politiegegevens kunnen worden verstrekt aan leden van het openbaar ministerie van het Europese deel van
      Nederland, voor zover zij deze behoeven in verband met hun gezag of zeggenschap over de politie of over andere
      personen of instanties die met de opsporing van strafbare feiten zijn belast, en voor de uitvoering van andere hen
      bij of krachtens de wet opgedragen taken.

      3 Politiegegevens kunnen worden verstrekt aan opsporingsambtenaren die werkzaam zijn bij een bijzondere
      opsporingsdienst in het Europese deel van Nederland voor zover zij deze behoeven voor de vervulling van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel36b
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel36e
