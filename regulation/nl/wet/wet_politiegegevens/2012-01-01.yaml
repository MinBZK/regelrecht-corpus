    text: |-
      1 De verantwoordelijke stelt politiegegevens ter beschikking aan personen die door hemzelf dan wel door een
      andere verantwoordelijke overeenkomstig [artikel 6, tweede lid][ref1], zijn geautoriseerd voor de verwerking van
      politiegegevens, voor zover zij deze behoeven voor de uitvoering van hun taak.

      2 In bijzondere gevallen kan, indien dit noodzakelijk is voor een goede uitvoering van de politietaak,
      de terbeschikkingstelling van politiegegevens door de verantwoordelijke worden geweigerd dan wel kan de
      verantwoordelijke beperkende voorwaarden stellen aan de verdere verwerking. Bij algemene maatregel van bestuur
      kunnen nadere regels worden gesteld over de gronden waarop de terbeschikkingstelling kan worden geweigerd en over
      de beperkende voorwaarden die kunnen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel6
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel15
    references:
      - id: ref1
