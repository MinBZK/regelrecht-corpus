  - number: '2'
    text: |-
      1 Deze wet is van toepassing op de verwerking van politiegegevens die in een bestand zijn opgenomen of die bestemd
      zijn daarin te worden opgenomen.

      2 Deze wet is niet van toepassing op de verwerking van politiegegevens:

      a. ten behoeve van activiteiten met uitsluitend persoonlijke doeleinden;

      b. ten behoeve van de interne bedrijfsvoering.

      3 Onder bestand wordt in dit artikel verstaan: elk gestructureerd geheel van politiegegevens, ongeacht of dit
      geheel van gegevens gecentraliseerd of verspreid is op een functioneel of geografisch bepaalde wijze, dat volgens
      bepaalde criteria toegankelijk is en betrekking heeft op verschillende personen.
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel2
  - number: '3'
    text: |-
      1 Politiegegevens worden slechts verwerkt voor zover dit noodzakelijk is voor de bij of krachtens deze wet
      geformuleerde doeleinden.

      2 Politiegegevens worden slechts verwerkt voor zover zij rechtmatig zijn verkregen en, gelet op de doeleinden
      waarvoor zij worden verwerkt, toereikend, terzake dienend en niet bovenmatig zijn.

      3 Politiegegevens worden uitsluitend voor een ander doel verwerkt dan waarvoor zij zijn verkregen voor zover deze
      wet daar uitdrukkelijk in voorziet.

      4 Bij de verwerking van politiegegevens op grond van de [artikelen 9][ref1], [10][ref2] en [12][ref3] worden de
      herkomst van de gegevens en de wijze van verkrijging vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel12
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel3
