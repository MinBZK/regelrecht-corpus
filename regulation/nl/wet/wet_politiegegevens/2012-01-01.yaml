  - number: '9'
    text: |-
      1 Politiegegevens kunnen gericht worden verwerkt ten behoeve van een onderzoek met het oog op de handhaving van de
      rechtsorde in een bepaald geval.

      2 Het doel van het onderzoek wordt binnen een week, nadat is begonnen met de verwerking, bedoeld in het eerste lid,
      schriftelijk vastgelegd.

      3 Politiegegevens die worden verwerkt overeenkomstig het eerste lid, kunnen, na instemming van een daartoe bevoegde
      functionaris, ter beschikking worden gesteld voor verdere verwerking voor zover dat noodzakelijk is voor een ander
      onderzoek als bedoeld in het eerste lid, de verwerking, bedoeld in de [artikelen 10][ref1] en [12][ref2], of de
      uitvoering van de dagelijkse politietaak, bedoeld in [artikel 8][ref3].

      4 De politiegegevens die zijn verwerkt op grond van het eerste lid en niet langer noodzakelijk zijn voor het doel
      van het onderzoek, worden verwijderd, of gedurende een periode van maximaal een half jaar verwerkt teneinde te
      bezien of zij aanleiding geven tot een nieuw onderzoek als bedoeld in het eerste lid of een nieuwe verwerking als
      bedoeld in [artikel 10][ref4], en na verloop van deze termijn verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel10
