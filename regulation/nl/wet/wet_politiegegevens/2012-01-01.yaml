  - number: '14'
    text: |-
      1 De op grond van de [artikelen 8, zesde lid][ref1], [9, vierde lid][ref2], en [artikel 10, zesde lid][ref3],
      verwijderde politiegegevens worden gedurende een termijn van vijf jaar bewaard ten behoeve van verwerking met het
      oog op de afhandeling van klachten en de verantwoording van verrichtingen en vervolgens vernietigd.

      2 De [artikelen 16 tot en met 20][ref4] alsmede de [artikelen 23][ref5] en [24][ref6] zijn op de overeenkomstig het
      eerste lid bewaarde politiegegevens niet van toepassing.

      3 In bijzondere gevallen en voor zover dat noodzakelijk is voor een doel als bedoeld in [artikel 9][ref7] of
      [10][ref8], kunnen politiegegevens die overeenkomstig het eerste lid worden bewaard, in opdracht van het op grond
      van de [Politiewet 1993][ref9] bevoegde gezag ter beschikking worden gesteld voor hernieuwde verwerking op grond
      van [artikel 9][ref10] of [10][ref11].

      4 Van de vernietiging, bedoeld in het eerste lid, wordt afgezien voor zover de waarde van de archiefbescheiden
      als bestanddeel van het cultureel erfgoed of voor historisch onderzoek zich daartegen verzet. De betreffende
      gegevens worden zo spoedig mogelijk overgebracht naar een archiefbewaarplaats. Daarbij worden met toepassing van
      [artikel 15 van de Archiefwet 1995][ref12] beperkingen aan de openbaarheid gesteld. Onze Ministers kunnen over het
      in de eerste en derde volzin bepaalde beleidsregels vaststellen.


