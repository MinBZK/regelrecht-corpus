  - number: '47'
    text: |-
      Onze Ministers zenden binnen vijf jaar na de inwerkingtreding van deze wet, en vervolgens telkens na vier jaar,
      gehoord het College bescherming persoonsgegevens, aan de Staten-Generaal een verslag over de doeltreffendheid en
      effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel47
  - number: '48'
    text: |-
      In wettelijke procedures en rechtsgedingen tegen een beslissing die op grond van de [Wet politieregisters][ref1] is
      genomen op een verzoek om kennisneming, verbetering, aanvulling, verwijdering of afscherming van politiegegevens,
      dan wel op tegen een dergelijke beslissing in te stellen of ingesteld beroep, blijven, zowel in eerste aanleg als
      in verdere instantie, de regels van toepassing, die golden voor de intrekking van [die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004798
      [ref2]: https://wetten.overheid.nl/BWBR0004798
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel48
