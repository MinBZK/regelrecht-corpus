    text: |-
      1 Een verantwoordelijke en de verantwoordelijken gezamenlijk kunnen een functionaris gegevensbescherming benoemen,
      onverminderd de bevoegdheden van het College bescherming persoonsgegevens.

      2 Op de functionaris gegevensbescherming, bedoeld in het eerste lid, zijn de [artikelen 63][ref1] en
      [64 van de Wet bescherming persoonsgegevens][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel64
