  - number: 36f
    text: |-
      1 In afwijking van [artikel 29][ref1] geldt een beslissing op een verzoek als bedoeld in [artikel 25][ref2]
      of [28][ref3] gericht aan de verantwoordelijke, bedoeld in [artikel 36b, eerste lid, onder b][ref4], als een
      beschikking als bedoeld in [artikel 3 van de Wet administratieve rechtspraak BES][ref5].

      2 De [artikelen 38][ref6] en [39 van de Wet bescherming persoonsgegevens BES][ref7] zijn van overeenkomstige
      toepassing.

      3 In procedures inzake beslissingen als bedoeld in het eerste lid waarbij de verantwoordelijke of onder zijn
      verantwoordelijkheid werkzame personen ingevolge [artikel 37 van de Wet administratieve rechtspraak BES][ref8]
      worden verplicht tot het geven van inlichtingen met betrekking tot politiegegevens die zijn te herleiden tot een
      informant als bedoeld in [artikel 12, zevende lid][ref9], kan Onze Minister van Justitie beslissen dat hieraan geen
      uitvoering wordt gegeven. [Artikel 29, vijfde lid, tweede en derde zin][ref10], is van overeenkomstige toepassing.


