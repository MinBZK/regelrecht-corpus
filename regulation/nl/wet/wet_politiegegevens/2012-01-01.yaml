        artikel: '6'
        paragraaf: '1'
  - number: '16'
    text: |-
      1 De verantwoordelijke verstrekt politiegegevens aan:

      a. buitengewone opsporingsambtenaren als bedoeld in [artikel 142 van het Wetboek van Strafvordering][ref1], voor
      zover zij deze behoeven voor de opsporing van strafbare feiten bij het onderzoek waarbij zij zijn betrokken;

      b. leden van het openbaar ministerie voor zover zij deze behoeven:

      1°. in verband met hun gezag of zeggenschap over de politie of over andere personen of instanties die met de
      opsporing van strafbare feiten zijn belast, of

      2°. voor de uitvoering van andere hun bij of krachtens de wet opgedragen taken;

      c. de burgemeesters voor zover zij deze behoeven:

      1°. in verband met hun gezag en zeggenschap over de politie, of

      2°. in het kader van de handhaving van de openbare orde.

      d. de korpsbeheerders, Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, Onze Minister van Justitie of
      Onze Minister van Defensie voor zover zij deze behoeven in verband met:

      1°. het verrichten van een onderzoek naar aanleiding van klachten, als bedoeld in
      [artikel 64 van de Politiewet 1993][ref2], of

      2°. disciplinaire bestraffing vanwege niet nakoming van verplichtingen of plichtsverzuim, als geregeld bij of
      krachtens [artikel 50 van de Politiewet 1993][ref3], of

      3°. schorsing of ontslag van de ambtenaar van de Koninklijke marechaussee voor zover werkzaam ter
      uitvoering van de politietaken, bedoeld in [artikel 6, eerste lid, van de Politiewet 1993][ref4]
      vanwege niet nakoming van verplichtingen of plichtsverzuim als geregeld bij of krachtens
      [artikel 12 van de Militaire Ambtenarenwet 1931][ref5].

      2 Op de verstrekkingen, bedoeld in het eerste lid, onderdelen a en d, is [artikel 15, tweede lid][ref6], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel64
