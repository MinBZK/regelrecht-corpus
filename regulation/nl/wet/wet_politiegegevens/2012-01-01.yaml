  - number: '32'
    text: |-
      1 De verantwoordelijke draagt zorg voor de schriftelijke vastlegging van:

      a. de doelen van de onderzoeken, bedoeld in [artikel 9, tweede lid][ref1];

      b. de gegevens die op grond van het bepaalde bij of krachtens [artikel 13, vierde lid][ref2], worden vastgelegd;

      c. de toekenning van de autorisaties, bedoeld in [artikel 6][ref3];

      d. de geautomatiseerde vergelijking of het in combinatie met elkaar verwerken van politiegegevens, bedoeld in de
      [artikelen 8, derde lid][ref4], en [11, eerste, tweede en vierde lid][ref5];

      e. de hernieuwde verwerking van politiegegevens op grond van [artikel 9][ref6] of [10][ref7], bedoeld in
      [artikel 14, derde lid][ref8];

      f. de verstrekking van politiegegevens op grond van [paragraaf 3][ref9] met uitzondering van de verstrekking,
      bedoeld in [artikel 17, eerste lid][ref10], en [artikel 24, eerste en tweede lid][ref11], indien dit zich niet
      verdraagt met het belang van de veiligheid van de staat;

      g. verwerkingen ten aanzien waarvan aanwijzingen bestaan dat zij door onbevoegden of anderszins onrechtmatig zijn
      verricht;

      h. een geautomatiseerde vergelijking van gegevens als bedoeld in [artikel 11, vijfde lid][ref12].

      2 De verantwoordelijke draagt zorg voor de schriftelijke melding van een gemeenschappelijke verwerking van
      politiegegevens aan het College bescherming persoonsgegevens.

      3 De politiegegevens, bedoeld in het eerste lid, worden bewaard tenminste tot de datum waarop de laatste controle,
      bedoeld in [artikel 33][ref13], is verricht of, ten aanzien van onderdeel d, zoveel langer als nodig is voor de
      naleving van de verplichtingen van de verantwoordelijke, bedoeld in [artikel 30, eerste lid][ref14].

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de wijze van vastlegging.


