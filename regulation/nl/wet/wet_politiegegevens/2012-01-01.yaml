  - number: '13'
    text: |-
      1 Ten behoeve van de ondersteuning van de politietaak kunnen de politiegegevens die worden verwerkt overeenkomstig
      [artikel 8][ref1], [9][ref2] en [10][ref3], verder worden verwerkt voor zover zij relevant zijn voor:

      a. het vaststellen van eerdere verwerkingen ten aanzien van eenzelfde persoon of zaak, onder meer ter bepaling van
      eerdere betrokkenheid bij strafbare feiten;

      b. het ophelderen van strafbare feiten die nog niet herleid konden worden tot een verdachte;

      c. identificatie van personen of zaken;

      d. het onder de aandacht brengen van personen of zaken met het oog op het uitvoeren van een gevraagde handeling
      danwel met het oog op een juiste bejegening van personen;

      e. het uitvoeren van taken ten dienste van de justitie.

      De betreffende gegevens worden landelijk raadpleegbaar gesteld voor personen die overeenkomstig
      [artikel 6, tweede lid][ref4], door een verantwoordelijke zijn geautoriseerd dan wel ter beschikking gesteld
      aan door een verantwoordelijke geautoriseerde personen voor zover zij deze behoeven voor de uitvoering van de
      politietaak.

      2 Ten behoeve van de ondersteuning van de politietaak kunnen de politiegegevens die worden verwerkt overeenkomstig
      [artikel 8][ref5], [9][ref6] of [10][ref7] door een verantwoordelijke centraal verder worden verwerkt voor zover
      zij relevant zijn voor het verkrijgen van landelijk inzicht in specialistische onderwerpen. De verder verwerkte
      gegevens worden ter beschikking gesteld aan door een verantwoordelijke geautoriseerde personen voor zover zij deze
      behoeven voor de uitvoering van de politietaak.

      3 Ten behoeve van de ondersteuning van de politietaak worden de politiegegevens die overeenkomstig
      [artikel 8][ref8], [9][ref9] en [10][ref10] worden verwerkt, voor zover zij relevant zijn voor geautomatiseerde
      vergelijking met het oog op de melding van verschillende verwerkingen jegens eenzelfde persoon, daarvoor ter
      beschikking gesteld en verder verwerkt. De gerelateerde gegevens kunnen, na instemming van een daartoe bevoegde
      functionaris, verder worden verwerkt op grond van [artikel 8][ref11], [9][ref12] of [10][ref13].

      4 Bij algemene maatregel van bestuur worden regels gesteld over hetgeen met het oog op de in het eerste, tweede en
      derde lid bedoelde verwerkingen tevoren schriftelijk wordt vastgelegd en ter inzage gelegd. In ieder geval worden
      regels gesteld over de schriftelijke vastlegging van:

      a. het specifieke doel ten behoeve waarvan de gegevens ter ondersteuning van de politietaak verder worden verwerkt;

      b. de categorieën van personen over wie gegevens ten behoeve van het betreffende doel verder worden verwerkt en de
      soorten van de over hen op te nemen gegevens;

      c. de gevallen waarin of de termijnen waarbinnen het verder verwerken van de betreffende gegevens wordt beëindigd.


