        bwb_id: BWBR0022463
        artikel: '32'
        paragraaf: '5'
  - number: '35'
    text: |-
      1 Het College bescherming persoonsgegevens ziet toe op de verwerking van politiegegevens overeenkomstig het bij en
      krachtens deze wet bepaalde.

      2 De [artikelen 51, tweede lid][ref1], [60][ref2], [61][ref3] en [65 van de Wet bescherming persoonsgegevens][ref4]
      zijn van overeenkomstige toepassing.

      3 Indien de verantwoordelijke handelt in strijd met hetgeen is bepaald bij of
      krachtens [artikel 32][ref5], kan het College hem een bestuurlijke boete opleggen. De
      [artikelen 66 tot en met 74 van de Wet bescherming persoonsgegevens][ref6] zijn van overeenkomstige toepassing.

      4 Het College bescherming persoonsgegevens wordt gehoord over de ingevolge deze wet bij of krachtens algemene
      maatregel van bestuur te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel51
