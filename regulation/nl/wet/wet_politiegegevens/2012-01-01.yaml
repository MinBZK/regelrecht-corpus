  - number: '25'
    text: |-
      1 De verantwoordelijke deelt een ieder op diens schriftelijke verzoek binnen zes weken mede of, en zo ja welke,
      deze persoon betreffende politiegegevens zijn vastgelegd. De verantwoordelijke kan zijn beslissing voor ten
      hoogste vier weken verdagen, dan wel voor ten hoogste zes weken indien blijkt dat ook bij andere politiekorpsen
      politiegegevens over de verzoeker worden verwerkt. Van de verdaging wordt schriftelijk mededeling gedaan.

      2 Bij regeling van Onze Ministers kunnen nadere regels worden gesteld over het verzoek en de wijze van
      kennisneming.
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel25
  - number: '26'
    text: |-
      1 Bij de behandeling van verzoeken als bedoeld in [artikel 25][ref1] draagt de verantwoordelijke zorg voor een
      deugdelijke vaststelling van de identiteit van de verzoeker.

      2 De verzoeken ten aanzien van minderjarigen die de leeftijd van zestien jaren nog niet hebben bereikt, en ten
      aanzien van onder curatele gestelden worden gedaan door hun wettelijk vertegenwoordigers. De betrokken mededeling
      geschiedt eveneens aan de wettelijk vertegenwoordigers.

      3 De verzoeken kunnen tevens worden gedaan door een advocaat aan wie de betrokkene een bijzondere machtiging heeft
      verleend met het oog op de uitoefening van zijn rechten krachtens deze wet en die het verzoek uitsluitend doet
      met de bedoeling de belangen van zijn cliënt te behartigen. De betrokken mededeling geschiedt aan de advocaat. De
      verantwoordelijke kan aan de bijzondere machtiging eisen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel25
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '25'
        paragraaf: '4'
  - number: '27'
    text: |-
      1 Een verzoek als bedoeld in [artikel 25, eerste lid][ref1], wordt afgewezen voor zover het onthouden van
      kennisneming noodzakelijk is in het belang van:

      a. de goede uitvoering van de politietaak;

      b. gewichtige belangen van derden;

      c. de veiligheid van de staat.

      2 Een gehele of gedeeltelijke afwijzing vindt schriftelijk plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel25
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '25'
        paragraaf: '4'
  - number: '28'
    text: |-
      1 Degene aan wie overeenkomstig [artikel 25][ref1] kennis is gegeven van hem betreffende politiegegevens, kan
      de verantwoordelijke schriftelijk verzoeken deze te verbeteren, aan te vullen, te verwijderen of af te schermen,
      indien deze feitelijk onjuist, voor het doel van de verwerking onvolledig of niet terzake dienend zijn dan wel in
      strijd met een wettelijk voorschrift worden verwerkt. Het verzoek bevat de aan te brengen wijzigingen.

      2 De verantwoordelijke bericht de verzoeker binnen vier weken na ontvangst van het verzoek schriftelijk of, dan wel
      in hoeverre, hij daaraan voldoet. [Artikel 37, eerste lid, van de Wet bescherming persoonsgegevens][ref2] is van
      overeenkomstige toepassing. Een weigering is met redenen omkleed.

      3 De verantwoordelijke draagt zorg dat een beslissing tot verbetering, aanvulling, verwijdering of afscherming zo
      spoedig mogelijk wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel37
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '25'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '37'
  - number: '29'
    text: |-
      1 Een beslissing op een verzoek als bedoeld in [artikel 25][ref1] of [28][ref2] geldt als een besluit in de zin
      van de [Algemene wet bestuursrecht][ref3]. [Afdeling 7.1 van de Algemene wet bestuursrecht][ref4] is niet van
      toepassing.

      2 De [artikelen 47][ref5] en [48 van de Wet bescherming persoonsgegevens][ref6] zijn van overeenkomstige
      toepassing.

      3 In klachtprocedures waarbij de verantwoordelijke of onder zijn verantwoordelijkheid werkzame personen ingevolge
      [artikel 9:31 van de Algemene wet bestuursrecht][ref7] worden verplicht tot het verstrekken van inlichtingen of
      het overleggen van stukken aan de Nationale ombudsman met betrekking tot politiegegevens die zijn te herleiden
      tot een informant als bedoeld in [artikel 12, zevende lid][ref8], kan Onze Minister van Justitie beslissen dat
      [artikel 9:31, vijfde en zesde lid, van die wet][ref9] buiten toepassing blijft.

      4 Indien Onze Minister van Justitie heeft beslist dat
      [artikel 9:31, vijfde en zesde lid, van de Algemene wet bestuursrecht][ref10] buiten toepassing blijft en de
      verantwoordelijke of onder zijn verantwoordelijkheid werkzame personen worden verplicht tot het overleggen van
      stukken, wordt volstaan met het ter inzage geven van de desbetreffende stukken. Van de desbetreffende stukken wordt
      op generlei wijze een afschrift vervaardigd.

      5 In procedures inzake beslissingen als bedoeld in het eerste lid waarbij de verantwoordelijke of
      onder zijn verantwoordelijkheid werkzame personen ingevolge [artikel 8:27][ref11], [8:28][ref12] of
      [8:45 van de Algemene wet bestuursrecht][ref13] worden verplicht tot het verstrekken van inlichtingen
      of het overleggen van stukken met betrekking tot politiegegevens die zijn te herleiden tot een
      informant als bedoeld in [artikel 12, zevende lid][ref14], kan Onze Minister van Justitie beslissen dat
      [artikel 8:29, derde tot en met vijfde lid, van die wet][ref15] buiten toepassing blijft. Indien aan de rechtbank
      stukken dienen te worden overgelegd, wordt alsdan met het ter inzage geven van de desbetreffende stukken volstaan.
      Van de desbetreffende stukken wordt op generlei wijze een afschrift vervaardigd. Indien Onze Minister van Justitie
      de rechtbank mededeelt dat uitsluitend zij kennis zal mogen nemen van de inlichtingen onderscheidenlijk de stukken,
      kan de rechtbank slechts met toestemming van de andere partijen mede op grondslag van die inlichtingen of stukken
      uitspraak doen.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel25
