  - number: '33'
    text: |-
      1 De verantwoordelijke doet de uitvoering van de bij of krachtens deze wet gegeven regels controleren door middel
      van het periodiek doen verrichten van privacy audits.

      2 De verantwoordelijke zendt een afschrift van de controleresultaten van de privacy audits aan het College
      bescherming persoonsgegevens.

      3 Indien uit de controleresultaten blijkt dat niet wordt voldaan aan het bij of krachtens deze wet bepaalde, laat
      de verantwoordelijke binnen een jaar een hercontrole uitvoeren op die onderdelen die niet voldeden aan de gestelde
      voorwaarden. Het tweede lid is van overeenkomstige toepassing.

      4 Een ieder die betrokken is bij een controle als bedoeld in het eerste of derde lid is verplicht tot geheimhouding
      van de persoonsgegevens waarover hij de beschikking heeft gekregen, behoudens voor zover enig wettelijk voorschrift
      hem tot mededeling verplicht of zijn taak daartoe noodzaakt.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld betreffende de inhoud en wijze van
      uitvoering van de controles, bedoeld in het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel33
  - number: '34'
    text: |-
      1 De verantwoordelijke benoemt een privacyfunctionaris. De privacyfunctionaris ziet namens de verantwoordelijke
      toe op de verwerking van politiegegevens overeenkomstig het bij of krachtens de wet bepaalde en dient de
      verantwoordelijke van advies.

      2 De privacyfunctionaris houdt een overzicht bij van de schriftelijke vastlegging van de gegevens, bedoeld in
      [artikel 32, eerste lid][ref1].

      3 De privacyfunctionaris stelt jaarlijks een verslag op van zijn bevindingen.

      4 De verantwoordelijke meldt de privacyfunctionaris aan bij het College bescherming persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel32
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel34
