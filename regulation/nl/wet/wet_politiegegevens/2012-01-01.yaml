  - number: '11'
    text: |-
      1 Voor zover dat noodzakelijk is voor een onderzoek als bedoeld in [artikel 9, eerste lid][ref1], kunnen
      politiegegevens die voor dat onderzoek zijn verwerkt, geautomatiseerd worden vergeleken met andere politiegegevens
      die worden verwerkt op grond van [artikel 8][ref2] of [9][ref3] teneinde vast te stellen of verbanden bestaan
      tussen de betreffende gegevens. De gerelateerde gegevens kunnen, na instemming van een daartoe bevoegde
      functionaris, voor dat onderzoek verder worden verwerkt.

      2 Voor zover dat noodzakelijk is voor een verwerking als bedoeld in [artikel 10, eerste lid][ref4], kunnen
      politiegegevens die voor dat doel zijn verwerkt, geautomatiseerd worden vergeleken met andere politiegegevens die
      worden verwerkt op grond van de [artikelen 8][ref5], [9][ref6] of [10][ref7] teneinde vast te stellen of verbanden
      bestaan tussen de betreffende gegevens. De gerelateerde gegevens kunnen, na instemming van een daartoe bevoegde
      functionaris, voor die verwerking verder worden verwerkt.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de uitvoering van de
      gegevensvergelijking. Deze regels kunnen betrekking hebben op:

      a. de categorieën van gegevens op basis waarvan politiegegevens vergeleken kunnen worden;

      b. het coderen van politiegegevens door deze te voorzien van een indicatie over betrouwbaarheid en
      vertrouwelijkheid en de mogelijkheid deze verder te verwerken voor een onderzoek als bedoeld in [artikel 9][ref8]
      of een verwerking als bedoeld in [artikel 10][ref9];

      c. de wijze waarop de verbanden zichtbaar gemaakt worden.

      4 Voor zover dat noodzakelijk is voor een onderzoek als bedoeld in [artikel 9, eerste lid][ref10], of een
      verwerking als omschreven in [artikel 10, eerste lid][ref11], kunnen in bijzondere gevallen in opdracht van
      het op grond van de [Politiewet 1993][ref12] bevoegde gezag, politiegegevens die worden verwerkt op grond van
      [artikel 8][ref13], [9][ref14] of [10][ref15] in combinatie met elkaar worden verwerkt teneinde vast te stellen of
      verbanden bestaan tussen de gegevens. Indien zulke verbanden bestaan kunnen de gerelateerde gegevens, na instemming
      van een daartoe bevoegde functionaris, voor dat onderzoek of die verwerking verder worden verwerkt.

      5 Voor zover dat noodzakelijk is voor een onderzoek als bedoeld in [artikel 9, eerste lid][ref16], of een
      verwerking als omschreven in [artikel 10, eerste lid][ref17], kunnen politiegegevens die worden verwerkt op grond
      van [artikel 8][ref18], [9][ref19] of [10][ref20] geautomatiseerd worden vergeleken met andere dan politiegegevens.


