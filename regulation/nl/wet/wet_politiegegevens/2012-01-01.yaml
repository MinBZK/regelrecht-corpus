  - number: '46'
    text: |-
      1 Het bij of krachtens de Wet politiegegevens bepaalde met betrekking tot de gegevensverwerking, bedoeld in
      [artikel 10, eerste lid onder a][ref1], en [artikel 12][ref2], is van overeenkomstige toepassing op de verwerking
      van persoonsgegevens door een bijzondere opsporingsdienst. Op voordracht van Onze Ministers en Onze Minister wie
      het mede aangaat kunnen bij algemene maatregel van bestuur ook andere onderdelen van het bij of krachtens deze wet
      bepaalde van overeenkomstige toepassing worden verklaard op de verwerking van persoonsgegevens door een bijzondere
      opsporingsdienst.

      2 Voor zover toepassing is gegeven aan het eerste lid

      a. stelt de verantwoordelijke politiegegevens voor verdere verwerking ter beschikking aan opsporingsambtenaren die
      werkzaam zijn bij de bijzondere opsporingsdienst, voorzover zij deze behoeven voor de vervulling van hun taak;

      b. stelt de verantwoordelijke van de bijzondere opsporingsdienst de gegevens waarop het bepaalde bij of krachtens
      deze wet van toepassing of van overeenkomstige toepassing is ter beschikking aan personen die overeenkomstig
      [artikel 6, tweede lid][ref3], zijn geautoriseerd voor de verwerking van politiegegevens, voor zover zij deze
      behoeven voor de vervulling van hun taak.

      [Artikel 15, tweede lid][ref4], is van overeenkomstige toepassing.

      3 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de ambtenaren die werkzaam zijn bij
      een bijzondere opsporingsdienst, die tot het verwerken van politiegegevens als bedoeld in het eerste lid kunnen
      worden geautoriseerd, alsmede over het beheer en de organisatie van de bijzondere opsporingsdienst waar zij
      werkzaam zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel15
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel46
