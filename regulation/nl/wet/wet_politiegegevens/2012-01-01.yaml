  - number: '7'
    text: |-
      1 De ambtenaar van politie of de persoon aan wie politiegegevens ter beschikking zijn gesteld is verplicht tot
      geheimhouding daarvan behoudens voor zover een bij of krachtens de wet gegeven voorschrift tot verstrekking
      verplicht, de bepalingen van [paragraaf 3][ref1] verstrekking toelaten of de politietaak in bijzondere gevallen tot
      verstrekking noodzaakt.

      2 De persoon aan wie politiegegevens zijn verstrekt is verplicht tot geheimhouding daarvan behoudens voor zover een
      bij of krachtens de wet gegeven voorschrift tot verstrekking verplicht of zijn taak daartoe noodzaakt.

      3 [Artikel 272, tweede lid, van het Wetboek van Strafrecht][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Paragraaf3
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel272
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022463
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '272'
  - number: '8'
    text: |-
      1 Politiegegevens kunnen worden verwerkt met het oog op de uitvoering van de dagelijkse politietaak gedurende een
      periode van één jaar na de datum van de eerste verwerking.

      2 Voor zover dat noodzakelijk is met het oog op de uitvoering van de dagelijkse politietaak kunnen politiegegevens
      ten aanzien waarvan de in het eerste lid genoemde termijn is verstreken geautomatiseerd worden vergeleken met
      politiegegevens die worden verwerkt op grond van het eerste lid teneinde vast te stellen of verbanden bestaan
      tussen de betreffende gegevens. De gerelateerde gegevens kunnen verder worden verwerkt met het oog op de uitvoering
      van de dagelijkse politietaak.

      3 Voor zover dat noodzakelijk is met het oog op de uitvoering van de dagelijkse politietaak kunnen politiegegevens
      ten aanzien waarvan de in het eerste lid genoemde termijn is verstreken in combinatie met elkaar worden verwerkt
      teneinde vast te stellen of verbanden bestaan tussen de betreffende gegevens. Indien zulke verbanden bestaan kunnen
      de gerelateerde gegevens verder worden verwerkt met het oog op de uitvoering van de politietaak.

      4 Politiegegevens, die worden verwerkt op grond van het eerste, tweede en derde lid, kunnen ter beschikking worden
      gesteld voor verdere verwerking op grond van de [artikelen 9][ref1], [10][ref2] en [12][ref3].

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de categorieën van gegevens op
      basis waarvan politiegegevens vergeleken kunnen worden.

      6 De politiegegevens, die zijn verwerkt op grond van het eerste, tweede en derde lid, worden vernietigd zodra zij
      niet langer noodzakelijk zijn voor de uitvoering van de dagelijkse politietaak en worden in ieder geval uiterlijk
      vijf jaar na de datum van eerste verwerking verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel12
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel8
