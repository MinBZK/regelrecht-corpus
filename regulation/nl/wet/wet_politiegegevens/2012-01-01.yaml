  - number: '30'
    text: |-
      1 Indien de verantwoordelijke politiegegevens heeft verbeterd, aangevuld, verwijderd of afgeschermd, doet hij aan
      de personen of instanties aan wie in het jaar voorafgaand aan het verzoek en in de sinds dat verzoek verstreken
      periode de betrokken politiegegevens zijn verstrekt, zo spoedig mogelijk mededeling van deze verbetering,
      aanvulling, verwijdering of afscherming, tenzij dit onmogelijk blijkt of een onevenredige inspanning vergt.

      2 De verantwoordelijke deelt aan de verzoeker en voor zover van toepassing aan de wettelijk vertegenwoordiger
      desgevraagd mede aan wie hij mededeling heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel30
  - number: '31'
    text: |-
      1 De verantwoordelijke kan voor een mededeling als bedoeld in [artikel 25, eerste lid][ref1], een vergoeding van
      kosten verlangen die niet hoger is dan een bij of krachtens algemene maatregel van bestuur vast te stellen bedrag.
      Daarbij wordt tevens de wijze van betaling bepaald.

      2 De vergoeding wordt teruggegeven indien:

      a. de verantwoordelijke op verzoek van de betrokkene, op aanbeveling van het College bescherming persoonsgegevens
      of op bevel van de rechter tot verbetering, aanvulling, verwijdering of afscherming is overgegaan, of

      b. de mededeling achterwege is gebleven op grond van [artikel 27][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel27
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel31
