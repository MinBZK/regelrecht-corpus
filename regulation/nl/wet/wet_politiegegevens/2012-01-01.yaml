  - number: 36a
    text: |-
      Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba met inachtneming van het in
      deze paragraaf bepaalde.
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel36a
  - number: 36b
    text: |-
      In afwijking van [artikel 1, onder b, f en k][ref1], wordt voor de toepassing van deze wet in de openbare lichamen
      Bonaire, Sint Eustatius en Saba uitsluitend verstaan onder:

      a. politietaak: de taken, bedoeld in
      [artikel 5 van de Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba][ref2],
      van het politiekorps voor Bonaire, Sint Eustatius en Saba en de taken, bedoeld in
      [artikel 5, eerste lid, van de Veiligheidswet BES][ref3];

      b. verantwoordelijke: dit is bij:

      1°. het politiekorps: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      2°. de Koninklijke marechaussee: Onze Minister van Defensie;

      3°. de buitengewone agenten van politie: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, in
      overeenstemming met Onze Minister van Justitie;

      c. ambtenaar van politie: de ambtenaar, belast met de uitvoering van de taken,
      bedoeld onder a, alsmede de buitengewone agenten van politie, bedoeld in
      [artikel 10 van de Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba][ref4]
      voor zover zij werkzaam zijn ter uitvoering van de politietaken.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028079#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0028586#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0028079#Artikel10
