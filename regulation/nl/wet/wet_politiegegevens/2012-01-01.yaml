  - number: '22'
    text: |-
      1 Politiegegevens kunnen worden verstrekt ten behoeve van beleidsinformatie en wetenschappelijk onderzoek en
      statistiek, onder de voorwaarde dat de resultaten daarvan geen persoonsgegevens mogen bevatten.

      2 Bij algemene maatregel van bestuur worden nadere regels gesteld over de verstrekking van politiegegevens, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel22
  - number: '23'
    text: |-
      1 Verstrekking van politiegegevens aan de leden van het openbaar ministerie als bedoeld in
      [artikel 16, eerste lid, onderdeel b][ref1], kan rechtstreeks plaatsvinden voor zover noodzakelijk met het oog op:

      a. strafvorderlijke beslissingen omtrent opsporing en vervolging en de hulp aan slachtoffers van strafbare feiten;

      b. bij algemene maatregel van bestuur aan te wijzen beslissingen.

      2 Verstrekking van politiegegevens als bedoeld in [artikel 18][ref2] vindt alleen rechtstreeks plaats aan bij
      algemene maatregel van bestuur aangewezen personen of instanties met een publiekrechtelijke taak door middel van
      geautomatiseerde vergelijking van persoonsgegevens met bij algemene maatregel van bestuur aan te wijzen categorieën
      van politiegegevens.

      3 De verantwoordelijke treft passende technische en organisatorische maatregelen teneinde te waarborgen dat
      rechtstreekse verstrekking uitsluitend plaatsvindt voor zover noodzakelijk op grond van het bepaalde bij of
      krachtens het eerste en tweede lid. Bij algemene maatregel van bestuur kunnen hierover nadere regels worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel18
    url: https://wetten.overheid.nl/BWBR0022463/2012-01-01#Artikel23
