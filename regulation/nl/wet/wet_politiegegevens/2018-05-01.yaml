    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel1
  - number: 1.j
    text: 'Onze Ministers: Onze Ministers van Veiligheid en Justitie en van Defensie gezamenlijk;'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel1
  - number: 1.k
    text: |-
      ambtenaar van politie: de ambtenaar, bedoeld in [artikel 2 van de Politiewet 2012][ref1], alsmede de
      ambtenaar van de Koninklijke marechaussee voor zover werkzaam ter uitvoering van de politietaken, bedoeld in
      [artikel 4, eerste lid, van de Politiewet 2012][ref2], en, indien [artikel 46][ref3] wordt toegepast, de ambtenaar,
      werkzaam bij de in dat artikel bedoelde dienst;


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel46
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel1
    references:
