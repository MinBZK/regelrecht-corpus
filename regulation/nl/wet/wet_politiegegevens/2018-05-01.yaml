        artikel: '12'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '29'
        paragraaf: '4'
  - number: 36g.1
    text: |-
      De Commissie van toezicht bescherming persoonsgegevens BES, bedoeld in
      [artikel 44 van de Wet bescherming persoonsgegevens BES][ref1], ziet toe op de verwerking van politiegegevens in
      Bonaire, Sint Eustatius en Saba overeenkomstig het bij en krachtens deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel44
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel36g
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '44'
  - number: 36g.2
    text: |-
      De [artikelen 50][ref1] en [51 van de Wet bescherming persoonsgegevens BES][ref2] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0028067#Artikel51
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel36g
