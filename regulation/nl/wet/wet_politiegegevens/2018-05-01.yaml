  - number: 36e.1
    text: |-
      Politiegegevens kunnen worden verstrekt aan de verantwoordelijken, bedoeld in [artikel 1, onder f][ref1],
      voor zover dat noodzakelijk is voor een goede uitoefening van de politietaak, bedoeld in
      [artikel 36b, eerste lid, onder a][ref2], dan wel de politietaak in het Europese deel van Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel36b
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel36e
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: 36b
        paragraaf: 5a
  - number: 36e.2
    text: |-
      Politiegegevens kunnen worden verstrekt aan leden van het openbaar ministerie van het Europese deel van Nederland,
      voor zover zij deze behoeven in verband met hun gezag of zeggenschap over de politie of over andere personen of
      instanties die met de opsporing van strafbare feiten zijn belast, en voor de uitvoering van andere hen bij of
      krachtens de wet opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel36e
  - number: 36e.3
    text: |-
      Politiegegevens kunnen worden verstrekt aan opsporingsambtenaren die werkzaam zijn bij een bijzondere
      opsporingsdienst in het Europese deel van Nederland voor zover zij deze behoeven voor de vervulling van hun taak.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel36e
  - number: 36f.1
    text: |-
      In afwijking van [artikel 29][ref1] geldt een beslissing op een verzoek als bedoeld in [artikel 25][ref2]
      of [28][ref3] gericht aan de verantwoordelijke, bedoeld in [artikel 36b, eerste lid, onder b][ref4], als een
      beschikking als bedoeld in [artikel 3 van de Wet administratieve rechtspraak BES][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel36b
      [ref5]: https://wetten.overheid.nl/BWBR0028455#Artikel3
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel36f
    references:
