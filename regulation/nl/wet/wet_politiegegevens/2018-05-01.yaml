        artikel: '38'
      - id: ref2
        bwb_id: BWBR0028067
        artikel: '39'
  - number: 36f.3
    text: |-
      In procedures inzake beslissingen als bedoeld in het eerste lid waarbij de verantwoordelijke of onder zijn
      verantwoordelijkheid werkzame personen ingevolge [artikel 37 van de Wet administratieve rechtspraak BES][ref1]
      worden verplicht tot het geven van inlichtingen met betrekking tot politiegegevens die zijn te herleiden tot
      een informant als bedoeld in [artikel 12, zevende lid][ref2], kan Onze Minister van Veiligheid en Justitie
      beslissen dat hieraan geen uitvoering wordt gegeven. [Artikel 29, vijfde lid, tweede en derde zin][ref3], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel29
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel36f
    references:
