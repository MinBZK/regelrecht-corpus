preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels vast te stellen voor het verwerken van
    politiegegevens;

    Alzo Wij in overweging genomen hebben, dat ter bescherming van de persoonlijke levenssfeer met betrekking tot die
    verwerking uitvoering dient te worden gegeven aan artikel 10, tweede en derde lid, van de Grondwet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel1
  - number: 1.a
    text: 'politiegegeven: elk persoonsgegeven dat in het kader van de uitoefening van de politietaak wordt verwerkt;'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel1
  - number: 1.b
    text: |-
      politietaak: de taken, bedoeld in de [artikelen 3][ref1] en [4, eerste lid, van de Politiewet 2012][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel4
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '4'
  - number: 1.c
    text: |-
      verwerken van politiegegevens: elke handeling of elk geheel van handelingen met betrekking tot politiegegevens,
      waaronder in ieder geval het verzamelen, vastleggen, ordenen, bewaren, bijwerken, wijzigen, opvragen,
      raadplegen, gebruiken, vergelijken, verstrekken door middel van doorzending, verspreiding of enige andere vorm
      van terbeschikkingstelling, samenbrengen, met elkaar in verband brengen, alsmede het afschermen, uitwissen of
      vernietigen van politiegegevens;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel1
  - number: 1.d
    text: 'verstrekken van politiegegevens: het bekend maken of ter beschikking stellen van politiegegevens;'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel1
  - number: 1.e
    text: |-
      ter beschikking stellen van politiegegevens: het verstrekken van politiegegevens aan personen die overeenkomstig
      deze wet zijn geautoriseerd voor het verwerken van politiegegevens;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel1
  - number: 1.f
    text: 'verantwoordelijke: dit is bij:'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel1
  - number: 1.f.1°
    text: |-
      de politie: de korpschef, bedoeld in [artikel 27 van de Politiewet 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel27
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '27'
  - number: 1.f.2°
    text: 'de rijksrecherche: het College van procureurs-generaal;'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel1
  - number: 1.f.3°
    text: 'de Koninklijke marechaussee: Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel1
  - number: 1.f.4°
    text: |-
      een gemeenschappelijke verwerking van politiegegevens met het oog op een gemeenschappelijk doel door twee of meer
      organisaties als bedoeld in dit onderdeel: de verantwoordelijke die door de betrokken verantwoordelijken is belast
      met de feitelijke zorg voor de verwerking en het treffen van de maatregelen, bedoeld in [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel4
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '4'
        paragraaf: '1'
  - number: 1.g
    text: 'betrokkene: degene op wie een politiegegeven betrekking heeft;'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel1
  - number: 1.h
    text: |-
      het College bescherming persoonsgegevens: het College, bedoeld in
      [artikel 51 van de Wet bescherming persoonsgegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel51
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel1
    references:
