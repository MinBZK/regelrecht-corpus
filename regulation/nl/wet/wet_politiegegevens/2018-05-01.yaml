        artikel: '14'
      - id: ref6
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref8
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: '11.5'
    text: |-
      Voor zover dat noodzakelijk is voor een onderzoek als bedoeld in [artikel 9, eerste lid][ref1], of een verwerking
      als omschreven in [artikel 10, eerste lid][ref2], kunnen politiegegevens die worden verwerkt op grond van
      [artikel 8][ref3], [9][ref4] of [10][ref5] geautomatiseerd worden vergeleken met andere dan politiegegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: '12.1'
    text: |-
      Politiegegevens kunnen worden verwerkt met het oog op de controle op en het beheer van een informant alsmede de
      beoordeling en verantwoording van het gebruik van informantgegevens.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel12
  - number: '12.2'
    text: |-
      De politiegegevens, bedoeld in het eerste lid, kunnen gedurende een periode van maximaal vier maanden na
      de datum van de eerste verwerking ter beschikking worden gesteld voor verdere verwerking op grond van de
      [artikelen 8][ref1], [9][ref2] of [10][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: '12.3'
    text: 'De verwerking van politiegegevens, bedoeld in het eerste lid, vindt slechts plaats omtrent:'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel12
  - number: 12.3.a
    text: informanten;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel12
  - number: 12.3.b
    text: personen waarover informanten informatie geven of waarmee informanten contacten onderhouden;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel12
  - number: 12.3.c
    text: |-
      ambtenaren van politie of buitengewoon opsporingsambtenaren als bedoeld in
      [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '12.4'
    text: |-
      Voor zover dat noodzakelijk is voor de controle op en het beheer van een informant kunnen politiegegevens die met
      het oog op dat doel worden verwerkt, geautomatiseerd worden vergeleken met politiegegevens die worden verwerkt
      op grond van [artikel 8][ref1], [9][ref2] of [10][ref3] teneinde vast te stellen of verbanden bestaan tussen de
      betreffende gegevens. De gerelateerde gegevens kunnen voor dat doel verder worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: '12.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën van personen worden aangewezen op wie het eerste, vierde en
      zesde lid van overeenkomstige toepassing zijn indien het bekend worden van politiegegevens voor die categorieën
      van personen gevaar oplevert. Daarbij worden de categorieën van personen aangewezen over wie politiegegevens worden
      verwerkt.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel12
  - number: '12.6'
    text: |-
      De politiegegevens die zijn verwerkt op grond van het eerste en vijfde lid, worden vernietigd zodra zij niet langer
      noodzakelijk zijn voor het doel van de verwerking. Daartoe worden de gegevens elk half jaar gecontroleerd. De
      gegevens worden vernietigd uiterlijk tien jaar na de datum van laatste verwerking van gegevens die blijk geeft van
      de noodzaak tot het verwerken van politiegegevens van betrokkene op grond van het doel, bedoeld in het eerste en
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel12
  - number: '12.7'
    text: |-
      Onder informant wordt in dit artikel verstaan: persoon die heimelijk aan een opsporingsambtenaar informatie
      verstrekt omtrent strafbare feiten of ernstige schendingen van de openbare orde, die door anderen zijn of worden
      gepleegd of verricht, welke verstrekking gevaar voor deze persoon of voor derden oplevert.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel12
  - number: '13.1'
    text: |-
      Ten behoeve van de ondersteuning van de politietaak kunnen de politiegegevens die worden verwerkt overeenkomstig
      [artikel 8][ref1], [9][ref2] en [10][ref3], verder worden verwerkt voor zover zij relevant zijn voor:


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: 13.1.a
    text: |-
      het vaststellen van eerdere verwerkingen ten aanzien van eenzelfde persoon of zaak, onder meer ter bepaling van
      eerdere betrokkenheid bij strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel13
  - number: 13.1.b
    text: het ophelderen van strafbare feiten die nog niet herleid konden worden tot een verdachte;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel13
  - number: 13.1.c
    text: identificatie van personen of zaken;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel13
  - number: 13.1.d
    text: |-
      het onder de aandacht brengen van personen of zaken met het oog op het uitvoeren van een gevraagde handeling danwel
      met het oog op een juiste bejegening van personen;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel13
  - number: 13.1.e
    text: het uitvoeren van taken ten dienste van de justitie.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel13
  - number: '13.2'
    text: |-
      Ten behoeve van de ondersteuning van de politietaak kunnen de politiegegevens die worden verwerkt overeenkomstig
      [artikel 8][ref1], [9][ref2] of [10][ref3] door een verantwoordelijke centraal verder worden verwerkt voor zover
      zij relevant zijn voor het verkrijgen van landelijk inzicht in specialistische onderwerpen. De verder verwerkte
      gegevens worden ter beschikking gesteld aan door een verantwoordelijke geautoriseerde personen voor zover zij deze
      behoeven voor de uitvoering van de politietaak.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: '13.3'
    text: |-
      Ten behoeve van de ondersteuning van de politietaak worden de politiegegevens die overeenkomstig [artikel 8][ref1],
      [9][ref2] en [10][ref3] worden verwerkt, voor zover zij relevant zijn voor geautomatiseerde vergelijking met
      het oog op de melding van verschillende verwerkingen jegens eenzelfde persoon, daarvoor ter beschikking gesteld
      en verder verwerkt. De gerelateerde gegevens kunnen, na instemming van een daartoe bevoegde functionaris, verder
      worden verwerkt op grond van [artikel 8][ref4], [9][ref5] of [10][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: '13.4'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over hetgeen met het oog op de in het eerste, tweede en
      derde lid bedoelde verwerkingen tevoren schriftelijk wordt vastgelegd en ter inzage gelegd. In ieder geval worden
      regels gesteld over de schriftelijke vastlegging van:
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel13
  - number: 13.4.a
    text: het specifieke doel ten behoeve waarvan de gegevens ter ondersteuning van de politietaak verder worden verwerkt;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel13
  - number: 13.4.b
    text: |-
      de categorieën van personen over wie gegevens ten behoeve van het betreffende doel verder worden verwerkt en de
      soorten van de over hen op te nemen gegevens;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel13
  - number: 13.4.c
    text: de gevallen waarin of de termijnen waarbinnen het verder verwerken van de betreffende gegevens wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel13
  - number: '14.1'
    text: |-
      De op grond van de [artikelen 8, zesde lid][ref1], [9, vierde lid][ref2], en [artikel 10, zesde lid][ref3],
      verwijderde politiegegevens worden gedurende een termijn van vijf jaar bewaard ten behoeve van verwerking met het
      oog op de afhandeling van klachten en de verantwoording van verrichtingen en vervolgens vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: '14.2'
    text: |-
      De [artikelen 16 tot en met 20][ref1] alsmede de [artikelen 23][ref2] en [24][ref3] zijn op de overeenkomstig het
      eerste lid bewaarde politiegegevens niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel24
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '16'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '23'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '24'
        paragraaf: '3'
  - number: '14.3'
    text: |-
      In bijzondere gevallen en voor zover dat noodzakelijk is voor een doel als bedoeld in [artikel 9][ref1] of
      [10][ref2], kunnen politiegegevens die overeenkomstig het eerste lid worden bewaard, in opdracht van het bevoegd
      gezag, bedoeld in de [artikelen 11][ref3], [12][ref4] en [14 van de Politiewet 2012][ref5], ter beschikking worden
      gesteld voor hernieuwde verwerking op grond van [artikel 9][ref6] of [10][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0031788#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0031788#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref7]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0031788
        artikel: '12'
      - id: ref5
        bwb_id: BWBR0031788
        artikel: '14'
      - id: ref6
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
  - number: '14.4'
    text: |-
      Van de vernietiging, bedoeld in het eerste lid, wordt afgezien voor zover de waarde van de archiefbescheiden
      als bestanddeel van het cultureel erfgoed of voor historisch onderzoek zich daartegen verzet. De betreffende
      gegevens worden zo spoedig mogelijk overgebracht naar een archiefbewaarplaats. Daarbij worden met toepassing van
      [artikel 15 van de Archiefwet 1995][ref1] beperkingen aan de openbaarheid gesteld. Onze Ministers kunnen over het
      in de eerste en derde volzin bepaalde beleidsregels vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel15
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '15'
  - number: '15.1'
    text: |-
      De verantwoordelijke stelt politiegegevens ter beschikking aan personen die door hemzelf dan wel door een
      andere verantwoordelijke overeenkomstig [artikel 6, tweede lid][ref1], zijn geautoriseerd voor de verwerking van
      politiegegevens, voor zover zij deze behoeven voor de uitvoering van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel6
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '6'
        paragraaf: '1'
  - number: '15.2'
    text: |-
      In bijzondere gevallen kan, indien dit noodzakelijk is voor een goede uitvoering van de politietaak,
      de terbeschikkingstelling van politiegegevens door de verantwoordelijke worden geweigerd dan wel kan de
      verantwoordelijke beperkende voorwaarden stellen aan de verdere verwerking. Bij algemene maatregel van bestuur
      kunnen nadere regels worden gesteld over de gronden waarop de terbeschikkingstelling kan worden geweigerd en over
      de beperkende voorwaarden die kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel15
  - number: '16.1'
    text: 'De verantwoordelijke verstrekt politiegegevens aan:'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel16
  - number: 16.1.a
    text: |-
      buitengewone opsporingsambtenaren als bedoeld in [artikel 142 van het Wetboek van Strafvordering][ref1], voor zover
      zij deze behoeven voor de opsporing van strafbare feiten bij het onderzoek waarbij zij zijn betrokken;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
  - number: 16.1.b
    text: 'leden van het openbaar ministerie voor zover zij deze behoeven:'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel16
  - number: 16.1.b.1°
    text: |-
      in verband met hun gezag of zeggenschap over de politie of over andere personen of instanties die met de opsporing
      van strafbare feiten zijn belast, of
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel16
  - number: 16.1.b.2°
    text: voor de uitvoering van andere hun bij of krachtens de wet opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel16
  - number: 16.1.c
    text: 'de burgemeesters voor zover zij deze behoeven:'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel16
  - number: 16.1.c.1°
    text: in verband met hun gezag en zeggenschap over de politie, of
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel16
  - number: 16.1.c.2°
    text: in het kader van de handhaving van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel16
  - number: 16.1.d
    text: |-
      de korpschef, het College van procureurs-generaal, Onze Minister van Veiligheid en Justitie of Onze Minister van
      Defensie voor zover zij deze behoeven in verband met:
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel16
  - number: 16.1.d.1°
    text: |-
      het verrichten van een onderzoek naar aanleiding van klachten, als bedoeld in
      [artikel 70 van de Politiewet 2012][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel70
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '70'
  - number: 16.1.d.2°
    text: |-
      disciplinaire bestraffing vanwege niet nakoming van verplichtingen of plichtsverzuim, als geregeld bij of krachtens
      [artikel 47 van de Politiewet 2012][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel47
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '47'
  - number: 16.1.d.3°
    text: |-
      schorsing of ontslag van de ambtenaar van de Koninklijke marechaussee voor zover werkzaam ter
      uitvoering van de politietaken, bedoeld in [artikel 4, eerste lid, van de Politiewet 2012][ref1]
      vanwege niet nakoming van verplichtingen of plichtsverzuim als geregeld bij of krachtens
      [artikel 12 van de Militaire Ambtenarenwet 1931][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001952#Artikel12
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001952
        artikel: '12'
  - number: '16.2'
    text: |-
      Op de verstrekkingen, bedoeld in het eerste lid, onderdelen a en d, is [artikel 15, tweede lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel15
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '15'
        paragraaf: '2'
  - number: '17.1'
    text: |-
      Politiegegevens kunnen worden verstrekt voor zover dit voortvloeit uit de
      [Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039896
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0039896
  - number: '17.2'
    text: |-
      Politiegegevens kunnen worden verstrekt aan een internationaal orgaan of aan een internationaal strafgerecht voor
      zover dit voortvloeit uit een verdrag.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel17
  - number: '17.3'
    text: |-
      Politiegegevens kunnen worden verstrekt aan autoriteiten in een land binnen het Koninkrijk of in een ander land die
      zijn belast met de uitvoering van de politietaak, of van onderdelen daarvan, voor zover dit noodzakelijk is voor
      de goede uitvoering van de politietaak in het Europese deel van Nederland of de politietaak in het desbetreffende
      land.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel17
  - number: '17.4'
    text: |-
      Politiegegevens kunnen worden verstrekt of doorgegeven aan de bevoegde autoriteit van een andere lidstaat van
      de Europese Unie of aan een orgaan van de Europese Unie dat is belast met de ondersteuning en versterking van
      de wetshandhavingsdiensten van de lidstaten bij de voorkoming, bestrijding, onderzoek en vervolging van zware
      criminaliteit en dat bij algemene maatregel van bestuur is aangewezen.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel17
  - number: '17.5'
    text: |-
      Politiegegevens worden alleen ingevolge het tweede of derde lid verstrekt of doorgegeven indien het ontvangende
      land of internationaal orgaan een toereikend beschermingsniveau voor de voorgenomen gegevensverwerking garandeert.
      Of het beschermingsniveau toereikend is wordt beoordeeld met inachtneming van alle omstandigheden die op de
      doorgifte van gegevens of op een groep van gegevensverstrekkingen van invloed zijn. In het bijzonder wordt rekening
      gehouden met de aard van de gegevens, met het doel en de duur van de voorgenomen verwerking en verwerkingen,
      het land van herkomst en het land of internationale orgaan van eindbestemming van de gegevens, de algemene en
      sectorale rechtsregels die in het derde land of het internationale orgaan gelden, alsmede de beroepscodes en de
      veiligheidsmaatregelen die in het land of het orgaan van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel17
  - number: '17.6'
    text: 'In afwijking van het vijfde lid kunnen politiegegevens worden verstrekt of doorgegeven indien:'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel17
  - number: 17.6.a
    text: |-
      dit noodzakelijk is ten behoeve van specifieke belangen van de betrokkene of een dringend zwaarwegend algemeen
      belang; of
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel17
  - number: 17.6.b
    text: |-
      het betreffende land of het ontvangende internationale orgaan passende garanties biedt voor een zorgvuldige
      gegevensverwerking in het concrete geval.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel17
  - number: '17.7'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de verstrekking of doorgifte van
      politiegegevens, bedoeld in het tweede, derde en vierde lid, alsmede over de verdere verwerking en de daarbij te
      stellen voorwaarden aan het gebruik daarvan door ontvangstgerechtigde autoriteiten of internationale organen en
      over de ontvangst van politiegegevens vanuit het buitenland.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel17
  - number: 17a.1
    text: |-
      Politiegegevens kunnen worden verstrekt aan de verantwoordelijken, bedoeld in
      [artikel 36b, eerste lid, onder b][ref1], voor zover dat noodzakelijk is voor een goede uitoefening van de
      politietaak in het Europese deel van Nederland dan wel de politietaak, bedoeld in 36b, eerste lid, onder a.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel36b
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: 36b
        paragraaf: 5a
  - number: 17a.2
    text: |-
      Politiegegevens kunnen worden verstrekt aan leden van het openbaar ministerie van Bonaire, Sint Eustatius en Saba,
      voor zover zij deze behoeven in verband met hun gezag of zeggenschap over de politie of over andere personen of
      instanties die met de opsporing van strafbare feiten zijn belast, en voor de uitvoering van andere hen bij of
      krachtens de wet opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel17a
  - number: 17a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de verstrekking van
      politiegegevens, bedoeld in het eerste lid, alsmede over de daarbij te stellen voorwaarden aan het gebruik daarvan
      door ontvangstgerechtigde politieautoriteiten.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel17a
  - number: '18.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen personen en instanties worden aangewezen aan wie of waaraan,
      met het oog op een zwaarwegend algemeen belang, politiegegevens worden of kunnen worden verstrekt ter uitvoering
      van de bij of krachtens die algemene maatregel van bestuur aan te geven taak.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel18
  - number: '18.2'
    text: |-
      In bijzondere gevallen kan Onze Minister van Veiligheid en Justitie toestemming of opdracht geven tot het
      verstrekken van daarbij door hem te omschrijven politiegegevens voor zover dit noodzakelijk is met het oog op een
      zwaarwegend algemeen belang. Van de desbetreffende beschikking wordt mededeling gedaan aan het College bescherming
      persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel18
  - number: '19'
    text: |-
      In bijzondere gevallen kan de verantwoordelijke, voor zover dit noodzakelijk is met het oog op een zwaarwegend
      algemeen belang, in overeenstemming met het bevoegd gezag, bedoeld in de [artikelen 11][ref1], [12][ref2] en
      [14 van de Politiewet 2012][ref3], beslissen tot het verstrekken van politiegegevens aan personen of instanties
      voor de volgende doeleinden:


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel14
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '14'
  - number: 19.a
    text: het voorkomen en opsporen van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel19
  - number: 19.b
    text: het handhaven van de openbare orde;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel19
  - number: 19.c
    text: het verlenen van hulp aan hen die deze behoeven;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel19
  - number: 19.d
    text: het uitoefenen van toezicht op het naleven van regelgeving.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel19
  - number: '20.1'
    text: |-
      De verantwoordelijke kan, voor zover dit met het oog op een zwaarwegend algemeen belang noodzakelijk is ten behoeve
      van een samenwerkingsverband van de politie met personen of instanties, in overeenstemming met het bevoegd gezag,
      bedoeld in de [artikelen 11][ref1], [12][ref2] en [14 van de Politiewet 2012][ref3], beslissen tot het verstrekken
      van politiegegevens aan die personen en instanties voor de volgende doeleinden:


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel14
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '14'
  - number: 20.1.a
    text: het voorkomen en opsporen van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel20
  - number: 20.1.b
    text: het handhaven van de openbare orde;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel20
  - number: 20.1.c
    text: het verlenen van hulp aan hen die deze behoeven;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel20
  - number: 20.1.d
    text: het uitoefenen van toezicht op het naleven van regelgeving.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel20
  - number: '20.2'
    text: |-
      In de beslissing, bedoeld in het eerste lid, wordt vastgelegd ten behoeve van welk zwaarwegend algemeen belang
      de verstrekking noodzakelijk is, ten behoeve van welk samenwerkingsverband de politiegegevens worden verstrekt,
      alsmede het doel waartoe dit is opgericht, welke gegevens worden verstrekt, de voorwaarden onder welke de gegevens
      worden verstrekt en aan welke personen of instanties de gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel20
  - number: '21'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de categorieën van politiegegevens die
      worden of kunnen worden verstrekt op grond van de [artikelen 18][ref1], [19][ref2] en [20][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel20
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '18'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '19'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '20'
        paragraaf: '3'
  - number: '22.1'
    text: |-
      Politiegegevens kunnen worden verstrekt ten behoeve van beleidsinformatie en wetenschappelijk onderzoek en
      statistiek, onder de voorwaarde dat de resultaten daarvan geen persoonsgegevens mogen bevatten.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel22
  - number: '22.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de verstrekking van politiegegevens, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel22
  - number: '23.1'
    text: |-
      Verstrekking van politiegegevens aan de leden van het openbaar ministerie als bedoeld in
      [artikel 16, eerste lid, onderdeel b][ref1], kan rechtstreeks plaatsvinden voor zover noodzakelijk met het oog op:


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel16
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '16'
        paragraaf: '3'
  - number: 23.1.a
    text: strafvorderlijke beslissingen omtrent opsporing en vervolging en de hulp aan slachtoffers van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel23
  - number: 23.1.b
    text: bij algemene maatregel van bestuur aan te wijzen beslissingen.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel23
  - number: '23.2'
    text: |-
      Verstrekking van politiegegevens als bedoeld in [artikel 18][ref1] vindt alleen rechtstreeks plaats aan bij
      algemene maatregel van bestuur aangewezen personen of instanties met een publiekrechtelijke taak door middel van
      geautomatiseerde vergelijking van persoonsgegevens met bij algemene maatregel van bestuur aan te wijzen categorieën
      van politiegegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel18
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '18'
        paragraaf: '3'
  - number: '23.3'
    text: |-
      De verantwoordelijke treft passende technische en organisatorische maatregelen teneinde te waarborgen dat
      rechtstreekse verstrekking uitsluitend plaatsvindt voor zover noodzakelijk op grond van het bepaalde bij of
      krachtens het eerste en tweede lid. Bij algemene maatregel van bestuur kunnen hierover nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel23
  - number: '24.1'
    text: |-
      Voor zover dat noodzakelijk is voor de uitvoering van de taak, bedoeld in
      [artikel 8, tweede lid, van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1], kunnen door
      de Algemene Inlichtingen- en Veiligheidsdienst verwerkte gegevens rechtstreeks geautomatiseerd worden
      vergeleken met bij algemene maatregel van bestuur, op voordracht van Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties en Onze Minister van Veiligheid en Justitie gezamenlijk, te bepalen categorieën van
      politiegegevens teneinde vast te stellen of verbanden bestaan tussen de betreffende gegevens. De gerelateerde
      gegevens kunnen daarvoor rechtstreeks worden verstrekt aan ambtenaren werkzaam bij de Algemene Inlichtingen-
      en Veiligheidsdienst waarbij in bepaalde, door een lid van het College van procureurs-generaal en het hoofd
      van de Algemene Inlichtingen- en Veiligheidsdienst gezamenlijk vast te stellen gevallen, op een gezamenlijk
      vast te stellen wijze, daarvan kennis wordt gegeven aan het lid van het openbaar ministerie als bedoeld in
      [artikel 66 van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel66
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '66'
  - number: '24.2'
    text: |-
      Voor zover dat noodzakelijk is voor de uitvoering van de taak, bedoeld in
      [artikel 10, tweede lid, van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1], kunnen door de
      Militaire Inlichtingen- en Veiligheidsdienst verwerkte gegevens rechtstreeks geautomatiseerd worden vergeleken met
      bij algemene maatregel van bestuur, op voordracht van Onze Minister van Defensie en Onze Minister van Veiligheid
      en Justitie gezamenlijk, te bepalen categorieën van politiegegevens teneinde vast te stellen of verbanden bestaan
      tussen de betreffende gegevens. De gerelateerde gegevens kunnen daarvoor rechtstreeks worden verstrekt aan
      ambtenaren werkzaam bij de Militaire Inlichtingen- en Veiligheidsdienst waarbij in bepaalde, door een lid van het
      College van procureurs-generaal en het hoofd van de Militaire Inlichtingen- en Veiligheidsdienst gezamenlijk vast
      te stellen gevallen, op een gezamenlijk vast te stellen wijze, daarvan kennis wordt gegeven aan het lid van het
      openbaar ministerie als bedoeld in [artikel 66 van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel66
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '66'
  - number: '24.3'
    text: |-
      [Artikel 23, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel23
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '23'
        paragraaf: '3'
  - number: '25.1'
    text: |-
      De verantwoordelijke deelt een ieder op diens schriftelijke verzoek binnen zes weken mede of, en zo ja welke, deze
      persoon betreffende politiegegevens verwerking ondergaan. Hij verstrekt daarbij tevens desgevraagd inlichtingen
      over de vraag of de deze persoon betreffende politiegegevens gedurende een periode van vier jaar voorafgaande aan
      het verzoek zijn verstrekt en over de ontvangers of categorieën van ontvangers aan wie de gegevens zijn verstrekt.
      De verantwoordelijke kan zijn beslissing voor ten hoogste vier weken verdagen, dan wel voor ten hoogste zes
      weken indien blijkt dat bij verschillende regionale of landelijke eenheden van de politie politiegegevens over de
      verzoeker worden verwerkt. Van de verdaging wordt schriftelijk mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel25
  - number: '25.2'
    text: Bij regeling van Onze Ministers kunnen nadere regels worden gesteld over het verzoek en de wijze van kennisneming.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel25
  - number: '26.1'
    text: |-
      Bij de behandeling van verzoeken als bedoeld in [artikel 25][ref1] draagt de verantwoordelijke zorg voor een
      deugdelijke vaststelling van de identiteit van de verzoeker.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel25
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '25'
        paragraaf: '4'
  - number: '26.2'
    text: |-
      De verzoeken ten aanzien van minderjarigen die de leeftijd van zestien jaren nog niet hebben bereikt, en ten
      aanzien van onder curatele gestelden worden gedaan door hun wettelijk vertegenwoordigers. De betrokken mededeling
      geschiedt eveneens aan de wettelijk vertegenwoordigers.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel26
  - number: '26.3'
    text: |-
      De verzoeken kunnen tevens worden gedaan door een advocaat aan wie de betrokkene een bijzondere machtiging heeft
      verleend met het oog op de uitoefening van zijn rechten krachtens deze wet en die het verzoek uitsluitend doet
      met de bedoeling de belangen van zijn cliënt te behartigen. De betrokken mededeling geschiedt aan de advocaat. De
      verantwoordelijke kan aan de bijzondere machtiging eisen stellen.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel26
  - number: '27.1'
    text: |-
      Een verzoek, als bedoeld in [artikel 25, eerste lid][ref1], wordt afgewezen voor zover het onthouden van
      kennisneming noodzakelijk is in het belang van:


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel25
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '25'
        paragraaf: '4'
  - number: 27.1.a
    text: de goede uitvoering van de politietaak;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel27
  - number: 27.1.b
    text: de bescherming van de rechten van de betrokkene of van de rechten en vrijheden van derden;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel27
  - number: 27.1.c
    text: de veiligheid van de staat.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel27
  - number: '27.2'
    text: Een gehele of gedeeltelijke afwijzing vindt schriftelijk plaats.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel27
  - number: '28.1'
    text: |-
      Een ieder over wiens persoon politiegegevens worden verwerkt kan de verantwoordelijke schriftelijk verzoeken deze
      te verbeteren, aan te vullen, te verwijderen of af te schermen indien deze feitelijk onjuist, voor het doel van
      de verwerking onvolledig of niet ter zake dienend zijn, dan wel in strijd met een wettelijk voorschrift worden
      verwerkt. Het verzoek bevat de aan te brengen wijzigingen.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel28
  - number: '28.2'
    text: |-
      De verantwoordelijke bericht de verzoeker binnen vier weken na ontvangst van het verzoek schriftelijk of, dan wel
      in hoeverre, hij daaraan voldoet. [Artikel 37, eerste lid, van de Wet bescherming persoonsgegevens][ref1] is van
      overeenkomstige toepassing. Een weigering is met redenen omkleed.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel37
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '37'
  - number: '28.3'
    text: |-
      De verantwoordelijke draagt ervoor zorg dat een beslissing tot verbetering, aanvulling, verwijdering of afscherming
      zo spoedig mogelijk wordt uitgevoerd. Hij draagt zorg voor het kenmerken van een gegeven als de juistheid daarvan
      door de betrokkene wordt betwist en niet kan worden vastgesteld of het gegeven al dan niet juist is.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel28
  - number: '29.1'
    text: |-
      Een beslissing op een verzoek als bedoeld in [artikel 25][ref1] of [28][ref2] geldt als een besluit in de zin van
      de [Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '25'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '28'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0005537
  - number: '29.2'
    text: |-
      De [artikelen 47][ref1] en [48 van de Wet bescherming persoonsgegevens][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel48
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '48'
  - number: '29.3'
    text: |-
      In klachtprocedures waarbij de verantwoordelijke of onder zijn verantwoordelijkheid werkzame personen ingevolge
      [artikel 9:31 van de Algemene wet bestuursrecht][ref1] worden verplicht tot het verstrekken van inlichtingen of het
      overleggen van stukken aan de Nationale ombudsman met betrekking tot politiegegevens die zijn te herleiden tot een
      informant als bedoeld in [artikel 12, zevende lid][ref2], kan Onze Minister van Veiligheid en Justitie beslissen
      dat artikel 9:31, vijfde en zesde lid, van die wet buiten toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel12
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '12'
        paragraaf: '2'
  - number: '29.4'
    text: |-
      Indien Onze Minister van Veiligheid en Justitie heeft beslist dat
      [artikel 9:31, vijfde en zesde lid, van de Algemene wet bestuursrecht][ref1] buiten toepassing blijft en de
      verantwoordelijke of onder zijn verantwoordelijkheid werkzame personen worden verplicht tot het overleggen van
      stukken, wordt volstaan met het ter inzage geven van de desbetreffende stukken. Van de desbetreffende stukken wordt
      op generlei wijze een afschrift vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '29.5'
    text: |-
      In procedures inzake beslissingen als bedoeld in het eerste lid waarbij de verantwoordelijke of
      onder zijn verantwoordelijkheid werkzame personen ingevolge [artikel 8:27][ref1], [8:28][ref2] of
      [8:45 van de Algemene wet bestuursrecht][ref3] worden verplicht tot het verstrekken van inlichtingen of
      het overleggen van stukken met betrekking tot politiegegevens die zijn te herleiden tot een informant als
      bedoeld in [artikel 12, zevende lid][ref4], kan Onze Minister van Veiligheid en Justitie beslissen dat
      [artikel 8:29, derde tot en met vijfde lid, van die wet][ref5] buiten toepassing blijft. Indien aan de rechtbank
      stukken dienen te worden overgelegd, wordt alsdan met het ter inzage geven van de desbetreffende stukken
      volstaan. Van de desbetreffende stukken wordt op generlei wijze een afschrift vervaardigd. Indien Onze Minister
      van Veiligheid en Justitie de rechtbank mededeelt dat uitsluitend zij kennis zal mogen nemen van de inlichtingen
      onderscheidenlijk de stukken, kan de rechtbank slechts met toestemming van de andere partijen mede op grondslag van
      die inlichtingen of stukken uitspraak doen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0022463
        artikel: '12'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '30.1'
    text: |-
      Indien de verantwoordelijke politiegegevens heeft verbeterd, aangevuld, verwijderd of afgeschermd, doet hij aan
      de personen of instanties aan wie in het jaar voorafgaand aan het verzoek en in de sinds dat verzoek verstreken
      periode de betrokken politiegegevens zijn verstrekt, zo spoedig mogelijk mededeling van deze verbetering,
      aanvulling, verwijdering of afscherming, tenzij dit onmogelijk blijkt of een onevenredige inspanning vergt.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel30
  - number: '30.2'
    text: |-
      De verantwoordelijke deelt aan de verzoeker en voor zover van toepassing aan de wettelijk vertegenwoordiger
      desgevraagd mede aan wie hij mededeling heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel30
  - number: '31.1'
    text: |-
      De verantwoordelijke kan voor een mededeling als bedoeld in [artikel 25, eerste lid][ref1], een vergoeding van
      kosten verlangen die niet hoger is dan een bij of krachtens algemene maatregel van bestuur vast te stellen bedrag.
      Daarbij wordt tevens de wijze van betaling bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel25
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '25'
        paragraaf: '4'
  - number: '31.2'
    text: 'De vergoeding wordt teruggegeven indien:'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel31
  - number: 31.2.a
    text: |-
      de verantwoordelijke op verzoek van de betrokkene, op aanbeveling van het College bescherming persoonsgegevens of
      op bevel van de rechter tot verbetering, aanvulling, verwijdering of afscherming is overgegaan, of
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel31
  - number: 31.2.b
    text: |-
      de mededeling achterwege is gebleven op grond van [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel27
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '27'
        paragraaf: '4'
  - number: '32.1'
    text: 'De verantwoordelijke draagt zorg voor de schriftelijke vastlegging van:'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel32
  - number: 32.1.a
    text: |-
      de doelen van de onderzoeken, bedoeld in [artikel 9, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
  - number: 32.1.b
    text: |-
      de gegevens die op grond van het bepaalde bij of krachtens [artikel 13, vierde lid][ref1], worden vastgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel13
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '13'
        paragraaf: '2'
  - number: 32.1.c
    text: |-
      de toekenning van de autorisaties, bedoeld in [artikel 6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel6
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '6'
        paragraaf: '1'
  - number: 32.1.d
    text: |-
      de geautomatiseerde vergelijking of het in combinatie met elkaar verwerken van politiegegevens, bedoeld in de
      [artikelen 8, derde lid][ref1], en [11, eerste, tweede en vierde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel11
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '11'
        paragraaf: '2'
  - number: 32.1.e
    text: |-
      de hernieuwde verwerking van politiegegevens op grond van [artikel 9][ref1] of [10][ref2], bedoeld in
      [artikel 14, derde lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel14
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '14'
        paragraaf: '2'
  - number: 32.1.f
    text: |-
      de verstrekking van politiegegevens op grond van [paragraaf 3][ref1] met uitzondering van de verstrekking, bedoeld
      in [artikel 17, eerste lid][ref2], en [artikel 24, eerste en tweede lid][ref3], indien dit zich niet verdraagt met
      het belang van de veiligheid van de staat;


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Paragraaf3
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel24
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0022463
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '17'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '24'
        paragraaf: '3'
  - number: 32.1.g
    text: |-
      verwerkingen ten aanzien waarvan aanwijzingen bestaan dat zij door onbevoegden of anderszins onrechtmatig zijn
      verricht;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel32
  - number: 32.1.h
    text: |-
      een geautomatiseerde vergelijking van gegevens als bedoeld in [artikel 11, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel11
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '11'
        paragraaf: '2'
  - number: '32.2'
    text: |-
      De verantwoordelijke draagt zorg voor de schriftelijke melding van een gemeenschappelijke verwerking van
      politiegegevens aan het College bescherming persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel32
  - number: '32.3'
    text: |-
      De politiegegevens, bedoeld in het eerste lid, worden bewaard tenminste tot de datum waarop de laatste controle,
      bedoeld in [artikel 33][ref1], is verricht of, ten aanzien van onderdeel d, zoveel langer als nodig is voor
      de naleving van de verplichtingen van de verantwoordelijke, bedoeld in de [artikelen 25, eerste lid][ref2], en
      [30, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel30
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '33'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '25'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '30'
        paragraaf: '4'
  - number: '32.4'
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de wijze van vastlegging.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel32
  - number: '33.1'
    text: |-
      De verantwoordelijke doet de uitvoering van de bij of krachtens deze wet gegeven regels controleren door middel van
      het periodiek doen verrichten van privacy audits.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel33
  - number: '33.2'
    text: |-
      De verantwoordelijke zendt een afschrift van de controleresultaten van de privacy audits aan het College
      bescherming persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel33
  - number: '33.3'
    text: |-
      Indien uit de controleresultaten blijkt dat niet wordt voldaan aan het bij of krachtens deze wet bepaalde, laat
      de verantwoordelijke binnen een jaar een hercontrole uitvoeren op die onderdelen die niet voldeden aan de gestelde
      voorwaarden. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel33
  - number: '33.4'
    text: |-
      Een ieder die betrokken is bij een controle als bedoeld in het eerste of derde lid is verplicht tot geheimhouding
      van de persoonsgegevens waarover hij de beschikking heeft gekregen, behoudens voor zover enig wettelijk voorschrift
      hem tot mededeling verplicht of zijn taak daartoe noodzaakt.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel33
  - number: '33.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld betreffende de inhoud en wijze van
      uitvoering van de controles, bedoeld in het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel33
  - number: '34.1'
    text: |-
      De verantwoordelijke benoemt een privacyfunctionaris. De privacyfunctionaris ziet namens de verantwoordelijke
      toe op de verwerking van politiegegevens overeenkomstig het bij of krachtens de wet bepaalde en dient de
      verantwoordelijke van advies.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel34
  - number: '34.2'
    text: |-
      De privacyfunctionaris houdt een overzicht bij van de schriftelijke vastlegging van de gegevens, bedoeld in
      [artikel 32, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel32
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '32'
        paragraaf: '5'
  - number: '34.3'
    text: De privacyfunctionaris stelt jaarlijks een verslag op van zijn bevindingen.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel34
  - number: '34.4'
    text: De verantwoordelijke meldt de privacyfunctionaris aan bij het College bescherming persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel34
  - number: '35.1'
    text: |-
      Het College bescherming persoonsgegevens ziet toe op de verwerking van politiegegevens overeenkomstig het bij en
      krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel35
  - number: '35.2'
    text: |-
      De [artikelen 51, tweede lid][ref1], [60][ref2], [61][ref3] en [65 van de Wet bescherming persoonsgegevens][ref4]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel61
      [ref4]: https://wetten.overheid.nl/BWBR0011468#Artikel65
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '60'
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '61'
      - id: ref4
        bwb_id: BWBR0011468
        artikel: '65'
  - number: '35.3'
    text: |-
      Indien de verantwoordelijke handelt in strijd met hetgeen is bepaald bij of krachtens [artikel 32][ref1],
      kan het College hem een bestuurlijke boete opleggen. De [artikelen 66, eerste lid][ref2], en
      [71 van de Wet bescherming persoonsgegevens][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel71
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '32'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '66'
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '71'
  - number: '35.4'
    text: |-
      Het College bescherming persoonsgegevens wordt gehoord over de voorgenomen verwerking van politiegegevens,
      die in een nieuw bestand zullen worden opgenomen, wanneer deze verwerking de gegevens betreft, bedoeld
      in [artikel 5][ref1], of wanneer de aard van de verwerking, in het bijzonder met gebruikmaking van nieuwe
      technologieën, mechanismen of procedures, specifieke risico’s met zich meebrengt voor de fundamentele rechten van
      de betrokkene, in het bijzonder het recht op bescherming van de persoonlijke levenssfeer.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel5
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '5'
        paragraaf: '1'
  - number: '36.1'
    text: |-
      Een verantwoordelijke en de verantwoordelijken gezamenlijk kunnen een functionaris gegevensbescherming benoemen,
      onverminderd de bevoegdheden van het College bescherming persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel36
  - number: '36.2'
    text: |-
      Op de functionaris gegevensbescherming, bedoeld in het eerste lid, zijn de [artikelen 63][ref1] en
      [64 van de Wet bescherming persoonsgegevens][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel64
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '63'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '64'
  - number: 36a
    text: |-
      Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba met inachtneming van het in
      deze paragraaf bepaalde.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel36a
  - number: 36b
    text: |-
      In afwijking van [artikel 1, onder b, f en k][ref1], wordt voor de toepassing van deze wet in de openbare lichamen
      Bonaire, Sint Eustatius en Saba uitsluitend verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
        paragraaf: '1'
  - number: 36b.a
    text: |-
      politietaak: de taken, bedoeld in
      [artikel 5 van de Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba][ref1],
      van het politiekorps voor Bonaire, Sint Eustatius en Saba en de taken, bedoeld in
      [artikel 5, eerste lid, van de Veiligheidswet BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028586#Artikel5
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0028586
        artikel: '5'
  - number: 36b.b
    text: 'verantwoordelijke: dit is bij:'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel36b
  - number: 36b.b.1°
    text: 'het politiekorps: Onze Minister van Veiligheid en Justitie;'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel36b
  - number: 36b.b.2°
    text: 'de Koninklijke marechaussee: Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel36b
  - number: 36b.b.3°
    text: 'de buitengewone agenten van politie: Onze Minister van Veiligheid en Justitie;'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel36b
  - number: 36b.c
    text: |-
      ambtenaar van politie: de ambtenaar, belast met de uitvoering van de taken,
      bedoeld onder a, alsmede de buitengewone agenten van politie, bedoeld in
      [artikel 10 van de Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba][ref1]
      voor zover zij werkzaam zijn ter uitvoering van de politietaken.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel10
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '10'
  - number: 36c.1
    text: 'Voor de toepassing van:'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel36c
  - number: 36c.1.a
    text: |-
      [artikel 4, zesde lid][ref1], wordt in plaats van «De [artikelen 14, eerste, tweede, derde en vijfde lid][ref2],
      [49][ref3] en [50 van de Wet bescherming persoonsgegevens][ref4]» gelezen: De artikelen 14, eerste, tweede, derde
      en vijfde lid, [39][ref5] en [40 van de Wet bescherming persoonsgegevens BES][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel49
      [ref4]: https://wetten.overheid.nl/BWBR0011468#Artikel50
      [ref5]: https://wetten.overheid.nl/BWBR0028067#Artikel39
      [ref6]: https://wetten.overheid.nl/BWBR0028067#Artikel40
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '49'
      - id: ref4
        bwb_id: BWBR0011468
        artikel: '50'
      - id: ref5
        bwb_id: BWBR0028067
        artikel: '39'
      - id: ref6
        bwb_id: BWBR0028067
        artikel: '40'
