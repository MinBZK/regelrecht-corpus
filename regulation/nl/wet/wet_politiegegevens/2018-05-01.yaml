        artikel: '50'
      - id: ref2
        bwb_id: BWBR0028067
        artikel: '51'
  - number: '46.1'
    text: |-
      Het bij of krachtens de Wet politiegegevens bepaalde met betrekking tot de gegevensverwerking, bedoeld in
      [artikel 10, eerste lid onder a][ref1], en [artikel 12][ref2], is van overeenkomstige toepassing op de verwerking
      van persoonsgegevens door een bijzondere opsporingsdienst. Op voordracht van Onze Ministers en Onze Minister wie
      het mede aangaat kunnen bij algemene maatregel van bestuur ook andere onderdelen van het bij of krachtens deze wet
      bepaalde van overeenkomstige toepassing worden verklaard op de verwerking van persoonsgegevens door een bijzondere
      opsporingsdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel12
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '12'
        paragraaf: '2'
  - number: '46.2'
    text: Voor zover toepassing is gegeven aan het eerste lid
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel46
  - number: 46.2.a
    text: |-
      stelt de verantwoordelijke politiegegevens voor verdere verwerking ter beschikking aan opsporingsambtenaren die
      werkzaam zijn bij de bijzondere opsporingsdienst, voorzover zij deze behoeven voor de vervulling van hun taak;
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel46
  - number: 46.2.b
    text: |-
      stelt de verantwoordelijke van de bijzondere opsporingsdienst de gegevens waarop het bepaalde bij of krachtens
      deze wet van toepassing of van overeenkomstige toepassing is ter beschikking aan personen die overeenkomstig
      [artikel 6, tweede lid][ref1], zijn geautoriseerd voor de verwerking van politiegegevens, voor zover zij deze
      behoeven voor de vervulling van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel6
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '6'
        paragraaf: '1'
  - number: '46.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de ambtenaren die werkzaam zijn bij een
      bijzondere opsporingsdienst, die tot het verwerken van politiegegevens als bedoeld in het eerste lid kunnen worden
      geautoriseerd, alsmede over het beheer en de organisatie van de bijzondere opsporingsdienst waar zij werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel46
  - number: '47'
    text: |-
      Onze Ministers zenden binnen vijf jaar na de inwerkingtreding van deze wet, en vervolgens telkens na vier jaar,
      gehoord het College bescherming persoonsgegevens, aan de Staten-Generaal een verslag over de doeltreffendheid en
      effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel47
  - number: '48'
    text: |-
      In wettelijke procedures en rechtsgedingen tegen een beslissing die op grond van de [Wet politieregisters][ref1] is
      genomen op een verzoek om kennisneming, verbetering, aanvulling, verwijdering of afscherming van politiegegevens,
      dan wel op tegen een dergelijke beslissing in te stellen of ingesteld beroep, blijven, zowel in eerste aanleg als
      in verdere instantie, de regels van toepassing, die golden voor de intrekking van [die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004798
      [ref2]: https://wetten.overheid.nl/BWBR0004798
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004798
      - id: ref2
        bwb_id: BWBR0004798
  - number: '49'
    text: |-
      De [Wet politieregisters][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004798
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004798
  - number: '51'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel51
  - number: '52'
    text: 'Deze wet wordt aangehaald als: Wet politiegegevens.'
    url: https://wetten.overheid.nl/BWBR0022463/2018-05-01#Artikel52
