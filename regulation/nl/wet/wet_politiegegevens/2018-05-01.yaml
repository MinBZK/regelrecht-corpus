        paragraaf: '7'
  - number: 1.l
    text: |-
      gerelateerde gegevens: de politiegegevens die bij de vergelijking van gegevens, bedoeld in de
      [artikelen 8, tweede lid][ref1], [11, eerste en tweede lid][ref2], [12, vierde lid][ref3] en
