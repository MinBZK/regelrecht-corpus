preamble:
  text: |-
    Gelet op de artikelen 33 en 52 van verordening (EG) nr. 1257/1999 van de Raad van de Europese Unie van 17 mei
    1999 betreffende steun voor plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor de Landbouw
    (EOGFL) en tot wijziging en instelling van een aantal verordeningen (PbEG L160);

    Gelet op de beschikking van de Commissie van de Europese Gemeenschappen van 28 september 2000 tot goedkeuring van
    het programmeringsdocument voor plattelandsontwikkeling voor Nederland met betrekking tot de programmeringsperiode
    2000-2006, C (2000) 2751;

    Gelet op de artikelen 2 en 4 van de Kaderwet LNV-subsidies;

    Gelet op artikel 146, vierde lid, van de Landinrichtingswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011719/2004-03-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
             minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



            b
             BBL:

              bureau beheer landbouwgronden als bedoeld in [artikel 28 van de Wet agrarisch grondverkeer][ref1];



            c
             DLG:

              Dienst landelijk gebied van het Ministerie van Landbouw, Natuurbeheer en Visserij;



            d
            aanvrager:

              degene die overeenkomstig [paragraaf 4][ref2] een aanvraag tot subsidieverlening indient;



            e
             landbouw:

              akkerbouw, weidebouw, veehouderij, tuinbouw, daaronder begrepen fruitteelt, het kweken van bomen, bloemen
      en bloembollen, en elke andere tak van bodemcultuur met uitzondering van de bosbouw;



            f
             bedrijf:

              geheel van productie-eenheden in Nederland, bestaande uit grond en een of meer bedrijfsgebouwen, dienende
      ter uitoefening van de landbouw;



            g
            grond:

              grond ter uitoefening van de landbouw;



            h
             bedrijfsgebouw:

              gebouw of complex van gebouwen, behorend bij het bedrijf en dienende voor de uitoefening van het bedrijf
      waaronder niet is begrepen het gedeelte van zodanig gebouw of complex van gebouwen dat bestemd is voor bewoning;



            i
             tuinbouwbedrijf:

              geheel van productie-eenheden in Nederland, bestaande uit grond en een of meer bedrijfsgebouwen dienende
      ter uitoefening van de tuinbouw, daaronder begrepen de fruitteelt;



            j
             toeslaggebied:

              gebied dat als zodanig is aangegeven in een besluit van gedeputeerde staten overeenkomstig
      [artikel 3, eerste lid][ref3], of een besluit van de minister overeenkomstig [artikel 3, tweede lid][ref4];



            k
            reconstructieplan:

              reconstructieplan als bedoeld in [artikel 11 van de Reconstructiewet concentratiegebieden][ref5];



            l
            reconstructiegebied:

              gebied waarvoor een reconstructieplan is vastgesteld dan wel wordt voorbereid;



            m
            landinrichtingsproject:

              project van herinrichting, ruilverkaveling en aanpassingsinrichting, als bedoeld in
      [artikel 13 van de Landinrichtingswet][ref6];



            n
            natuurgebied:

              natuurgebied als bedoeld in [artikel 1, eerste lid, van de Subsidieregeling natuurbeheer 2000][ref7], zoals
      het krachtens die regeling nader door de provincie is begrensd;



            o
             ruilgebied:

              gebied als bedoeld in [artikel 1, eerste lid, van de Subsidieregeling natuurbeheer 2000][ref8];



            p
             randstadgroenstructuurproject:

              project waarvan het werkgebied is weergegeven op kaart 3 van het Structuurschema Groene Ruimte, deel 4,
      planologische kernbeslissing;



            q
             strategisch groenproject:

              project waarvan het werkgebied is aangegeven op kaart 1 van het Structuurschema Groene Ruimte, deel 4,
      planologische kernbeslissing;



            r
            bufferzone:

              zone zoals aangegeven op de PKB-kaart bufferzones van de Vierde nota over de ruimtelijke ordening Extra,
      deel 4, planologische kernbeslissing;



            s
            Midden-Delfland en Oost-Groningen en de Gronings-Drentse Veenkoloniën:

              gebied als bedoeld in [artikel 1 van de Reconstructiewet Midden-Delfland][ref9], respectievelijk gebied als
      bedoeld in [artikel 1 van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref10];



            t
             Rivieren en Natte Natuur:

              gebieden als opgenomen in de samenwerkingsafspraak realisatie van Veiligheid en Natte Natuur 1999-2015 in
      het kader van de Vierde nota waterhuishouding tussen het Ministerie van Landbouw, Natuurbeheer en Visserij en het
      Ministerie van Visserij en Verkeer en Waterstaat van 30 maart 2000;



            u
            robuuste verbindingen:

              robuuste verbindingen als bedoeld in de Nota Natuur voor mensen, mensen voor natuur (Nota natuur, bos en
      landschap in de 21e eeuw), van juli 2000;



            v
            Vinac-gebied:

              uitbreidingslocaties als bedoeld in de Actualisering Vierde Nota over de Ruimtelijke Ordening Extra,
      planologische kernbeslissing.



            u
             ROM-gebied en NU-gebied:

              gebieden zoals aangegeven op de PKB-kaarten Regionale beleidsafspraken van de Vierde nota over de
      ruimtelijke ordening Extra, deel 4, planologische kernbeslissing;



            v
            mestoverschotgebied:

              gebied I en II als bedoeld in de bijlage behorende bij de [Wet verplaatsing mestproductie][ref11];



            w

              [verordening (EG) nr. 1257/1999](31999R1257):

              [verordening (EG) nr. 1257/1999](31999R1257) van de Raad van de Europese Unie van 17 mei 1999 betreffende
      steun voor plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) en tot
      wijziging en instelling van een aantal verordeningen (PbEG L160).


