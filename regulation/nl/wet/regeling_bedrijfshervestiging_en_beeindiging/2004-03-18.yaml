  - number: '10'
    text: |-
      1 De subsidie voor hervestiging van een bedrijf bedraagt, indien op het tijdstip van de aanvraag tot
      subsidieverlening ten minste 50% van de totale bedrijfsoppervlakte, gelegen is in een toeslaggebied, de som van:

      a. € 2.722,68 per hectare voor de over te dragen grond;

      b. maximaal 6% van de grondprijs van de aan BBL over te dragen grond, voorzover de aanvrager daarvoor in verband
      met bedrijfshervestiging overdrachtsbelasting is verschuldigd, en

      c. een bijdrage van 10% van de agrarische waarde van erf, bedrijfsgebouwen en woning tot een maximum van €
      45.378,02.

      2 De subsidie voor hervestiging van een bedrijf bedraagt, indien op het tijdstip van de aanvraag tot
      subsidieverlening minder dan 50% van de totale bedrijfsoppervlakte gelegen is in een toeslaggebied, de som van:

      a. € 2.722,68 per hectare voor de over te dragen grond voorzover deze is gelegen in een toeslaggebied, en

      b. maximaal 6% van de grondprijs van de aan BBL over te dragen grond, voorzover de aanvrager daarvoor in verband
      met bedrijfshervestiging overdrachtsbelasting is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0011719/2004-03-18#Artikel10
  - number: '11'
    text: |-
      De subsidie voor de beëindiging van een bedrijf bedraagt de som van:

      a. € 2.722,68 per hectare voor de aan BBL over te dragen grond voorzover deze is gelegen in een toeslaggebied;

      b. het bedrag dat de aanvrager aan inkomstenbelasting verschuldigd is ter zake van de winst behaald met de staking
      van zijn onderneming als bedoeld in artikel 8, eerste lid, onderdeel d van de Wet op de Inkomstenbelasting 1964 of
      [artikel 3.79 van de Wet Inkomstenbelasting 2001][ref1] tot een maximum van € 1815,12 per hectare voor de aan BBL
      over te dragen grond voorzover deze in een toeslaggebied ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.79
    url: https://wetten.overheid.nl/BWBR0011719/2004-03-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3.79'
  - number: '12'
    text: |-
      1 De aanvraag wordt ingediend door een natuurlijk persoon of rechtspersoon die beschikt over de eigendom of over
      het gebruiksrecht van de bij een bedrijf behorende grond.

      2 Indien de in het eerste lid bedoelde personen niet over de eigendom van de bij het bedrijf behorende gronden
      beschikken, dienen zij gebruiksgerechtigd te zijn ingevolge een goedgekeurde pachtovereenkomst met een looptijd van
      tenminste zes jaar voor de grond en twaalf jaar voor de bedrijfsgebouwen, met uitzondering van de pachtovereenkomst
      bedoeld in [artikel 70f, vijfde lid, van de Pachtwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002269#Artikel70f
    url: https://wetten.overheid.nl/BWBR0011719/2004-03-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002269
        artikel: 70f
  - number: '13'
    text: |-
      1 Een aanvraag wordt gericht aan de minister en ingediend bij de directeur DLG, te Utrecht.

      2 Een aanvraag gaat vergezeld van:

      a. een omschrijving van de voorgenomen activiteit;

      b. een topografische kaart met een schaal van 1:10.000 waarop de ligging en oppervlakte van de door BBL aan te
      kopen gronden waar de subsidie betrekking op heeft, alsmede in geval van hervestiging de plaats van hervestiging,
      zijn aangegeven;

      c. in geval de aanvrager geen eigenaar is, een verklaring van de eigenaar dat deze de grond in eigendom, vrij van
      enig gebruiksrecht, over zal dragen aan BBL;

      d. een document waarmee wordt aangetoond dat hervestiging overeenkomstig [artikel 5, eerste lid onderdeel b][ref1],
      zal plaatsvinden;

      e. voorzover aan de orde, de in [artikel 5, eerste lid onderdeel a][ref2], bedoelde overeenkomst tussen de
      aanvrager en de landinrichtingscommissie of gedeputeerde staten inzake de inbreng en de toedeling van gronden, en

      f. voorzover aan de orde, een verzoek als bedoeld in [artikel 5, tweede lid][ref3], of
      [artikel 7, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011719#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011719#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0011719#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0011719#Artikel7
    url: https://wetten.overheid.nl/BWBR0011719/2004-03-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011719
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011719
        artikel: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0011719
        artikel: '5'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0011719
        artikel: '7'
        paragraaf: '2'
  - number: '14'
    text: |-
      1 De minister geeft een beschikking tot subsidieverlening binnen twaalf weken na ontvangst van de aanvraag.

      2 De beschikking tot subsidieverlening vermeldt in ieder geval:

      a. de ligging en oppervlakte van de gronden, naar kadastrale maat gerekend, waar de subsidie betrekking op heeft;

      b. de berekening op basis waarvan het bedrag van de subsidie zal worden vastgesteld, en

      c. in voorkomend geval de voorschriften zoals genoemd in [artikel 5, tweede lid][ref1], en
      [artikel 7, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011719#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011719#Artikel7
    url: https://wetten.overheid.nl/BWBR0011719/2004-03-18#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011719
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011719
        artikel: '7'
        paragraaf: '2'
  - number: '15'
    text: |-
      1 Binnen twaalf weken nadat hervestiging als bedoeld in [artikel 5][ref1] of beëindiging als bedoeld in
      [artikel 7][ref2] heeft plaatsgevonden, dient de aanvrager een aanvraag tot vaststelling van de subsidie in bij de
      directeur DLG, te Utrecht, gericht aan de minister.

      2 Bij de aanvraag tot subsidievaststelling toont de aanvrager aan dat de beëindiging of de hervestiging van het
      bedrijf heeft plaatsgevonden overeenkomstig de in deze regeling opgenomen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0011719#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011719#Artikel7
    url: https://wetten.overheid.nl/BWBR0011719/2004-03-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011719
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011719
        artikel: '7'
        paragraaf: '2'
  - number: '16'
    text: |-
      De subsidieontvanger is verplicht een overzichtelijke en deugdelijke administratie te voeren ten aanzien van de
      activiteit waar de subsidieverlening betrekking op heeft en deze te bewaren gedurende tenminste drie jaren na
      datum van de subsidievaststelling, conform artikel 4 van [verordening (EG) nr. 4045/1989](31989R4045) van de Raad
      van 21 december 1989 inzake de door de Lidstaten uit te voeren controles op de verrichtingen in het kader van de
      financieringsregeling van de afdeling Garantie van het Europees Oriëntatie- en Garantiefonds voor de Landbouw en
      houdende intrekking van [Richtlijn 77/435/EEG](31977L0435) (PbEG L388).
    url: https://wetten.overheid.nl/BWBR0011719/2004-03-18#Artikel16
  - number: '17'
    text: |-
      De minister kan op verzoek van de subsidieontvanger voorschotten verlenen tot ten hoogste 80% van de verleende
      subsidie.
    url: https://wetten.overheid.nl/BWBR0011719/2004-03-18#Artikel17
  - number: '18'
    text: |-
      1 De verleende subsidie wordt ingetrokken indien de aanvrager door ernstige nalatigheid of opzettelijk een onjuiste
      aanvraag tot subsidieverlening of -vaststelling heeft ingediend of anderszins onjuiste gegevens heeft verstrekt op
      grond van een andere regeling gebaseerd op hoofdstuk IX van [verordening (EG) nr. 1257/1999](31999R1257).

      2 De vastgestelde subsidie wordt ingetrokken indien de aanvrager door ernstige nalatigheid of opzettelijk een
      onjuiste aanvraag tot subsidieverlening of -vaststelling heeft ingediend of anderszins onjuiste informatie
      heeft verstrekt op grond van een andere regeling gebaseerd op hoofdstuk IX van [verordening (EG) nr. 1257/1999]
      (31999R1257).
    url: https://wetten.overheid.nl/BWBR0011719/2004-03-18#Artikel18
  - number: '19'
    text: |-
      Indien de beschikking tot subsidieverlening of -vaststelling is ingetrokken of ten nadele van de subsidieontvanger
      is gewijzigd, betaalt de aanvrager de door hem ontvangen subsidiebedragen en voorschotten terug op eerste vordering
      van de minister vermeerderd met de wettelijke rente over de periode van de datum van uitbetaling van de subsidie
      tot het tijdstip van voldoening.
    url: https://wetten.overheid.nl/BWBR0011719/2004-03-18#Artikel19
  - number: '20'
    text: Met het toezicht op de naleving van deze regeling zijn belast alle daartoe aangewezen medewerkers van DLG.
    url: https://wetten.overheid.nl/BWBR0011719/2004-03-18#Artikel20
  - number: '21'
    text: |-
      1 De Regeling verlening hervestigingstoeslag en de Regeling Afkoop Toedelingsrechten 1985 worden ingetrokken.

      2 De Regeling houdende verlening toeslag ter zake van de overdracht in eigendom of verpachting van landbouwgronden
      wordt ingetrokken.

      3 Op subsidies verstrekt op grond van de in het eerste lid bedoelde regelingen blijven die regelingen van
      toepassing.

      4 In afwijking van het derde lid worden subsidies die vanaf 1 januari 2000 op grond van de in het eerste lid
      bedoelde regelingen zijn aangevraagd of verstrekt en die voor cofinanciering in aanmerking komen op grond van
      [verordening (EG) nr. 1257/99](31999R1257), geacht te zijn aangevraagd onderscheidenlijk verstrekt op grond van
      deze regeling.
    url: https://wetten.overheid.nl/BWBR0011719/2004-03-18#Artikel21
  - number: '23'
    text: |-
      Voorzover nog geen natuurgebieden en ruilgebieden als bedoeld in [artikel 1][ref1], onderdelen k en l
      zijn begrensd, wordt voor de toepassing van deze regeling onder natuurgebieden en ruilgebieden verstaan de
      overeenkomstig de Regeling beheersovereenkomsten en natuurontwikkeling nader door de provincies begrensde
      reservaatsgebieden, natuurontwikkelingsprojecten en aankoopgebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0011719#Artikel1
    url: https://wetten.overheid.nl/BWBR0011719/2004-03-18#Artikel23
    references:
