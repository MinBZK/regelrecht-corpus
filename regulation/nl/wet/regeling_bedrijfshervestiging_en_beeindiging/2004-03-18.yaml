  - number: '9'
    text: |-
      1 Indien de aanvrager opzettelijk een onjuiste aanvraag tot subsidieverlening of -vaststelling heeft ingediend
      of anderszins onjuiste gegevens heeft verstrekt op grond van een andere regeling gebaseerd op hoofdstuk IX van
      [verordening (EG) nr. 1257/1999](31999R1257), of indien in geval van opzet een verleende subsidie wordt ingetrokken
      op grond van [artikel 18, eerste lid][ref1], of een vastgestelde subsidie wordt ingetrokken of gewijzigd op grond
      van [artikel 18, tweede lid][ref2], wordt tevens geen subsidie verleend in het daaropvolgende jaar.

      2 Indien de aanvrager opzettelijk een onjuiste aanvraag tot subsidieverlening op grond van deze regeling heeft
      ingediend of anderszins onjuiste gegevens heeft verstrekt wordt geen subsidie verleend voor het daaropvolgende
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011719#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0011719#Artikel18
