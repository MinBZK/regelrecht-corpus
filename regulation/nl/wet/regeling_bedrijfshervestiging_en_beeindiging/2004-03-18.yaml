  - number: '7'
    text: |-
      1 De subsidie voor de beëindiging van een bedrijf of een gedeelte daarvan, als bedoeld in
      [artikel 2, onderdeel b][ref1], wordt verstrekt indien is voldaan aan elk van de volgende voorwaarden:

      a. overdracht van de bij het bedrijf behorende grond in eigendom, vrij van enig gebruiksrecht, aan BBL op grond van
      een koopovereenkomst tussen BBL en de aanvrager, voorzover deze in een toeslaggebied ligt, en

      b. beëindiging van het gebruik van de grond voor de landbouw binnen dertien maanden na overdracht aan BBL.

      2 In bijzondere gevallen kan de minister, in afwijking van het eerste lid, onderdeel a, op verzoek van de aanvrager
      of eigenaar, toestemming verlenen voor het behoud van eigendom of gebruik van een deel van de grond door de
      aanvrager of eigenaar. Hieraan kunnen voorschriften worden verbonden.

      3 De in het tweede lid bedoelde toestemming wordt uitsluitend verleend indien:

      a. de aanvrager tevens eindbeheerder is, of

      b. het verzoek niet meer dan 10% van het toeslaggebied betreft en de oppervlakte niet groter dan 2 hectare is.


      [ref1]: https://wetten.overheid.nl/BWBR0011719#Artikel2
    url: https://wetten.overheid.nl/BWBR0011719/2004-03-18#Artikel7
