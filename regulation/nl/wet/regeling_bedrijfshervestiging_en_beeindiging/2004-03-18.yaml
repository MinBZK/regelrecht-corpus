  - number: '2'
    text: |-
      De minister kan op aanvraag subsidie verstrekken voor:

      a. de hervestiging van een bedrijf, dat geheel of gedeeltelijk gelegen is in een toeslaggebied ter bevordering van
      de grondverwerving ten behoeve van natuur, recreatie of landschap, al dan niet in combinatie met de verbetering van
      de ruimtelijke structuur van de landbouw;

      b. de beëindiging van een bedrijf, of een gedeelte daarvan, voorzover dat gelegen is in een toeslaggebied, ter
      bevordering van de grondverwerving ten behoeve van natuur, recreatie of landschap al dan niet in combinatie met de
      verbetering van de ruimtelijke structuur van de landbouw.
    url: https://wetten.overheid.nl/BWBR0011719/2004-03-18#Artikel2
  - number: '3'
    text: |-
      1 Gedeputeerde staten bepalen bij afzonderlijk besluit in welke delen van landinrichtingsprojecten,
      reconstructiegebieden, natuurgebieden, ruilgebieden, randstadgroenstructuurprojecten, strategische groenprojecten,
      robuuste verbindingen, VINAC-gebieden Midden-Delfland en Oost-Groningen en de Gronings-Drentse Veenkoloniën
      onderhavige regeling van toepassing is.

      2 De minister bepaalt bij afzonderlijk besluit in welke delen van bufferzones, Rivieren en Natte Natuur onderhavige
      regeling van toepassing is.

      3 In een besluit als bedoeld in het eerste lid, respectievelijk het tweede lid, kunnen gedeputeerde staten,
      respectievelijk de minister, bepalen:

      a. dat alleen voor bepaalde typen bedrijven aanvragen kunnen worden ingediend;

      b. dat alleen subsidie kan worden verleend voor de hervestiging of voor de beëindiging van bedrijven;

      c. dat voor een bepaald maximum aantal hectares aanvragen kunnen worden ingediend.

      4 Een besluit als bedoeld in het eerste lid wordt bekendgemaakt in de Staatscourant en in het provinciaal blad van
      de betreffende provincie dat algemeen verkrijgbaar wordt gesteld.

      5 Een besluit als bedoeld in het tweede lid wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011719/2004-03-18#Artikel3
  - number: '4'
    text: |-
      1 De minister stelt voor ieder kalenderjaar voor op grond van deze regeling te verstrekken subsidies een
      subsidieplafond vast.

      2 De minister kan voor subsidies als bedoeld onder [artikel 2, onderdeel a][ref1], en
      [artikel 2, onderdeel b][ref2], verschillende subsidieplafonds vaststellen.

      3 De vaststelling van het subsidieplafond maakt de minister bekend in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0011719#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011719#Artikel2
    url: https://wetten.overheid.nl/BWBR0011719/2004-03-18#Artikel4
