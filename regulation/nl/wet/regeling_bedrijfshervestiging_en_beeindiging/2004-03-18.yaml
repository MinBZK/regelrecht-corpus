  - number: '6'
    text: |-
      1 De hervestiging van een bedrijf als bedoeld in [artikel 5, eerste lid, onderdeel b][ref1], vindt plaats buiten
      een natuurgebied en buiten een mestoverschotgebied.

      2 In afwijking van het eerste lid kan de hervestiging binnen een mestoverschotgebied plaatsvinden indien het
      de hervestiging van een tuinbouwbedrijf betreft, of indien de hervestiging plaatsvindt op grond die voor 80% of
      meer uit kleigrond bestaat of binnen een landinrichtingsproject, een reconstructiegebied, een ROM-gebied of NU-
      gebied, waar volgens het landinrichtingsplan, het reconstructieplan respectievelijk het geldende plan van aanpak,
      hervestiging is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011719#Artikel5
