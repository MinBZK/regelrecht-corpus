    text: |-
      1 De regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst, en werkt terug tot en met 28 september 2000.

      2 [Artikel 4][ref1] treedt in werking per 1 januari 2001.


