  - number: '5'
    text: |-
      1 De subsidie voor hervestiging van een bedrijf als bedoeld in [artikel 2, onderdeel a][ref1], wordt verstrekt
      indien is voldaan aan elk van de volgende voorwaarden:

      a. overdracht van de bij het bedrijf behorende grond in eigendom, vrij van enig gebruiksrecht,
      aan BBL op grond van een koopovereenkomst tussen BBL en de aanvrager, of inbreng van de bij het
      bedrijf behorende grond in een overeenkomst tussen de aanvrager en de landinrichtingscommissie
      inzake inbreng en toedeling van gronden vooruitlopend op het plan van toedeling als bedoeld in
      [artikel 196 van de Landinrichtingswet, artikel 76 van de Reconstructiewet Midden-Delfland][ref2] of
      [artikel 80 van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref3] of
      inbreng van de bij het bedrijf behorende grond in een overeenkomst tussen de aanvrager en gedeputeerde
      staten inzake inbreng en toedeling van gronden, vooruitlopend op het plan van toedeling bedoeld in
      [artikel 62 van de Reconstructiewet concentratiegebieden][ref4];

      b. hervestiging van een volwaardig bedrijf op een andere plaats door de aanvrager binnen vierentwintig maanden na
      het sluiten van de in onderdeel a bedoelde overeenkomsten, en

      c. voorzover de bedrijfsgebouwen gelegen zijn binnen een landinrichtingsproject of een reconstructiegebied, opname
      van een clausule in de in onderdeel a bedoelde overeenkomsten dat de bedrijfsgebouwen aan het gebruik voor de
      landbouw worden onttrokken.

      2 In bijzondere gevallen kan de minister, in afwijking van het eerste lid, onderdeel a, op verzoek van de aanvrager
      of de eigenaar toestemming verlenen voor het behoud van eigendom of gebruik van een deel van de grond, of, in
      afwijking van het eerste lid, onderdeel c, voor het gebruik van de bedrijfsgebouwen voor de landbouw door de
      aanvrager of de eigenaar. Hieraan kunnen voorschriften worden verbonden.

      3 De in het tweede lid bedoelde toestemming wordt uitsluitend verleend indien:

      a. de aanvrager tevens eindbeheerder is, of

      b. het verzoek niet meer dan 10% van het toeslaggebied betreft en de oppervlakte niet groter dan 2 hectare is.


