  - number: '8'
    text: |-
      1 Geen subsidie wordt verleend:

      a. indien uit anderen hoofde door de minister subsidie is verleend ter zake van de beëindiging of de hervestiging
      van het bedrijf of een gedeelte daarvan;

      b. indien aan de aanvrager voor de betreffende gronden een volledige schadeloosstelling is betaald op grond van de
      [hoofdstukken I][ref1], [IV][ref2] of VII van de onteigeningswet;

      c. indien met betrekking tot de desbetreffende gronden een koopplicht voor BBL als
      bedoeld in [artikel 94, eerste lid, van de Subsidieregeling natuurbeheer 2000][ref3] of
      [artikel 82 van de Subsidieregeling agrarisch natuurbeheer][ref4] van toepassing is;

      d. indien de beëindiging of de hervestiging van het bedrijf heeft plaatsgevonden voordat een aanvraag tot
      subsidieverlening was ingediend;

      e. indien de aanvrager door ernstige nalatigheid of opzettelijk een onjuiste aanvraag tot subsidieverlening of
      -vaststelling heeft ingediend of anderszins onjuiste gegevens heeft verstrekt op grond van een andere regeling
      gebaseerd op hoofdstuk IX van [verordening (EG) nr. 1257/1999](31999R1257), of indien een verleende subsidie wordt
      ingetrokken op grond van [artikel 18, eerste lid][ref5], of een vastgestelde subsidie wordt ingetrokken op grond
      van [artikel 18, tweede lid][ref6].

      2 Voorzover voor de beëindiging of de hervestiging van het bedrijf eveneens subsidie wordt verstrekt door andere
      overheidsorganen wordt op grond van deze regeling slechts een zodanig bedrag aan subsidie verleend dat de som van
      de subsidies niet meer bedraagt dan de op grond van de [artikelen 10][ref7] of [11][ref8] vastgestelde bedragen.


