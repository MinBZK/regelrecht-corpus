---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: marinescheepsongevallenwet
regulatory_layer: WET
publication_date: '2004-12-23'
valid_from: '2002-01-01'
bwb_id: BWBR0001940
url: https://wetten.overheid.nl/BWBR0001940/2002-01-01
preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is bepalingen vast te stellen tot het instellen van een
    openbaar onderzoek omtrent rampen en ongevallen, overkomen aan Nederlandsche oorlogsvaartuigen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Van Staatswege wordt onderzoek gedaan naar de oorzaken van rampen en ongevallen, overkomen aan Nederlandsche
      oorlogsvaartuigen.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel1
  - number: '1.2'
    text: |-
      Het onderzoek bestaat uit een voorloopig onderzoek door of vanwege den betrokken Commandant der Marine in
      Nederland, dan wel den Commandant der Zeemacht in Nederlandsch-Indië, zoo noodig gevolgd door een onderzoek door
      een Marineraad.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel1
  - number: '1.3'
    text: |-
      Het voorloopig onderzoek wordt ingesteld telkens, wanneer een in [het eerste lid van dit artikel][ref1] bedoeld
      vaartuig door een ramp of ongeval is getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0001940#Artikel1
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001940
        artikel: '1'
        hoofdstuk: I
  - number: '1.4'
    text: |-
      Onder ramp of ongeval in den zin dezer wet wordt verstaan een voorval, overkomen aan een in het eerste lid van
      dit artikel bedoeld vaartuig, ten gevolge waarvan schade van beteekenis aan dat vaartuig of deszelfs bemanning,
      of aan beide of aan een ander schip of deszelfs bemanning is veroorzaakt. Bovendien wordt in den zin dezer wet een
      voorval ook als ramp of ongeval opgevat, indien niet zoozeer met het oog op de omvangrijkheid der gevolgen, als wel
      op grond van den aard van het voorval, de waarschijnlijkheid bestaat, dat uit een onderzoek lessen kunnen worden
      geput, dan wel voorschriften kunnen voortvloeien, welke kunnen dienen tot voorkoming van scheepsrampen.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel1
  - number: '1.5'
    text: |-
      Voor de toepassing van deze wet: worden als Nederlandsch oorlogsvaartuig beschouwd alle ten behoeve der Koninklijke
      Marine gebezigde vaartuigen, waarover een militair der zeemacht het bevel voert en welke geheel of gedeeltelijk
      met militairen zijn bemand; wordt onder "schip" mede verstaan een vaartuig, een sleepschip, een dok, en elk ander
      drijvend voorwerp, hetwelk over zee naar zijne bestemming wordt gesleept; wordt onder "kapitein" verstaan elke
      gezagvoerder van een schip of degene die dezen vervangt, en onder "eigenaar" de persoon, die het beheer over het
      schip heeft, hetzij hij eigenaar of boekhouder van de rederij van het schip is, hetzij het schip hem in gebruik is
      gegeven; wordt onder "Commandant der Zeemacht in Nederlandsch-Indië" verstaan de Commandant der Zeemacht en Hoofd
      van het Departement der Marine in Nederlandsch-Indië.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel1
  - number: '2.1'
    text: Er zijn een Nederlandsche en een Nederlandsch-Indische Marineraad.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel2
  - number: '2.2'
    text: |-
      De Nederlandsche Marineraad is gevestigd in een door Ons nader aan te wijzen gemeente. Hij is bevoegd ook in andere
      gemeenten hier te lande te vergaderen.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel2
  - number: '2.3'
    text: |-
      De Nederlandsch-Indische Marineraad is gevestigd te Batavia. Hij is bevoegd, na verkregen machtiging van den
      Gouverneur-Generaal van Nederlandsch-Indië, ook elders daar te lande te vergaderen.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel2
  - number: '3.1'
    text: |-
      De Marineraden bestaan uit een voorzitter en vier leden. De voorzitter van den
      Nederlandschen Marineraad moet aan een universiteit dan wel de Open Universiteit waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, hebben verkregen het doctoraat
      in de rechtsgeleerdheid of het recht om de titel meester te voeren, mits dit doctoraat of dit recht verkregen is op
      grond van het afleggen van een examen in het Nederlandsch burgerlijk- en handelsrecht, Staatsrecht en strafrecht.
      De voorzitter van den Nederlandsch-Indischen Marineraad moet voldoen aan de eischen, gesteld voor de benoembaarheid
      tot lid van een Raad van Justitie in Nederlandsch-Indië. De leden moeten zijn zeeofficier of oud-zeeofficier,
      met dien verstande, dat ten minste twee der leden den rang van vlag- of hoofdofficier moeten bekleeden of bekleed
      hebben en niet meer dan twee van hen oud-zeeofficieren mogen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '3.2'
    text: |-
      Voor beide raden worden tevens benoemd een plaatsvervangend voorzitter en de noodige plaatsvervangende leden, te
      wier aanzien het bepaalde in het eerste lid van overeenkomstige toepassing is.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel3
  - number: '3.3'
    text: |-
      Aan elken Raad worden een secretaris en een plaatsvervangend secretaris verbonden, die moeten zijn zeeofficier of
      oud-zeeofficier.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel3
  - number: '3.4'
    text: Aan elken Raad worden, op diens verzoek, voor elk geval afzonderlijk, de noodige deskundige raadgevers toegevoegd.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel3
  - number: '3.5'
    text: |-
      De voorzitters, de plaatsvervangende voorzitters, de leden en de plaatsvervangende leden worden benoemd voor den
      tijd van ten minste één en ten hoogste vier jaren. Herbenoeming heeft niet plaats, tenzij bijzondere omstandigheden
      in het betrekkelijke besluit te vermelden, daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel3
  - number: '3.6'
    text: |-
      De benoeming van den voorzitter, den plaatsvervangenden voorzitter, de leden en de plaatsvervangende leden van den
      Nederlandschen Marineraad, zoomede de toevoeging aan dit college van deskundige raadgevers, geschieden door Ons;
      ten aanzien van den Nederlandsch-Indischen Marineraad geschiedt dit door den Gouverneur-Generaal van Nederlandsch-
      Indië.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel3
  - number: '4.1'
    text: |-
      De Nederlandsche Marineraad neemt kennis van de rampen en ongevallen, overkomen aan alle oorlogsvaartuigen, ten
      aanzien waarvan die kennisneming ingevolge het tweede lid van dit artikel niet is opgedragen aan den Nederlandsch-
      Indischen Marineraad.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel4
  - number: '4.2'
    text: 'De Nederlandsch-Indische Marineraad neemt kennis van rampen en ongevallen, overkomen aan oorlogsvaartuigen, welke:'
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel4
  - number: 4.2.a
    text: onder het opperbevel van den Gouverneur-Generaal van Nederlandsch-Indië staan;
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel4
  - number: 4.2.b
    text: |-
      hoewel eigenlijk behoorende tot de zeemacht in Nederlandsch-Indië, tijdelijk aan het opperbevel van den Landvoogd
      aldaar onttrokken zijn in verband met een vanuit Nederlandsch-Indië naar het buitenland ondernomen reis;
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel4
  - number: 4.2.c
    text: |-
      vanuit Nederland, Suriname of Curaçao op reis zijn naar Nederlandsch-Indië, met de bedoeling om aldaar onder het
      opperbevel van den Gouverneur-Generaal te worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel4
  - number: '4.3'
    text: |-
      Wij behouden Ons voor om het onderzoek van aan oorlogsvaartuigen overkomen rampen en ongevallen, in afwijking van
      het bepaalde in de eerste twee leden van dit artikel, aan een anderen Marineraad op te dragen.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel4
  - number: '5.1'
    text: 'De werkkring en de bevoegdheden:'
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel5
  - number: 5.1.a
    text: |-
      van de voorzitters, de leden en de secretarissen van de Marineraden en van hunne plaatsvervangers, zoomede die van
      de deskundige raadgevers, aan de Marineraden toegevoegd,
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel5
  - number: 5.1.b
    text: |-
      van de vlootvoogden in verband met hun bemoeienis ten opzichte van rampen en ongevallen, aan oorlogsvaartuigen
      overkomen,
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel5
  - number: '5.2'
    text: |-
      De geldelijke tegemoetkomingen, toe te kennen aan de in het eerste lid van dit artikel onder *a* bedoelde
      personen, worden met betrekking tot den Nederlandschen Marineraad voor zooveel noodig door Ons en met betrekking
      tot den Nederlandsch-Indischen Marineraad voor zooveel noodig door den Gouverneur-Generaal van Nederlandsch-Indië
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel5
  - number: '6.1'
    text: |-
      De voorzitter, de leden, de deskundige raadgevers en de secretaris van de betrokken Marineraad, hun
      plaatsvervangers, alsmede de marine-officieren, bedoeld in [artikel 12, eerste lid][ref1], hebben toegang tot de
      schepen, met inbegrip van de woongedeelten, waaraan een ramp of ongeval, bedoeld in [artikel 1, vierde lid][ref2],
      is overkomen, of welke een zodanige ramp of een zodanig ongeval hebben veroorzaakt en tot de plaatsen, waar
      zodanige schepen zich bevinden, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0001940#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0001940#Artikel1
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001940
        artikel: '12'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0001940
        artikel: '1'
        hoofdstuk: I
  - number: '6.2'
    text: |-
      Deze bevoegdheid geldt eveneens ten aanzien van de schepen, welke op enigerlei wijze, zij het ook slechts
      middellijk, bij de ramp of het ongeval betrokken zijn.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel6
  - number: '7'
    text: |-
      De eigenaars, de commandanten, de kapiteins, de officieren, de stuurlieden, de machinisten
      of scheepswerktuigkundigen en de leden der bemanning van de schepen, bedoeld in
      [artikel 6, eerste en tweede lid][ref1], zijn verplicht aan de in het vorige artikel bedoelde personen desverlangd
      de door hen noodig geachte inlichtingen te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0001940#Artikel6
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001940
        artikel: '6'
        hoofdstuk: III
  - number: '8'
    text: |-
      De betrokken Commandanten der Marine in Nederland, de Commandant der Zeemacht in Nederlandsch-Indië, de in het
      [eerste lid van artikel 12][ref1] bedoelde marineofficieren, de voorzitters, de plaatsvervangende voorzitters, de
      leden, de plaatsvervangende leden, de secretarissen, de plaatsvervangende secretarissen van de Marineraden, zoomede
      de aan die Raden toegevoegde deskundige raadgevers en hunne plaatsvervangers, zijn, uitgezonderd tegenover de, in
      het verband van deze wet, boven hen gestelde autoriteiten, verplicht tot geheimhouding van hetgeen hun in plaatsen,
      waar zij krachtens [artikel 6][ref2] binnentreden, omtrent het daar uitgeoefend wordend bedrijf is bekend geworden,
      voor zoover het niet in strijd is met de bepalingen van deze of een andere wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001940#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0001940#Artikel6
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001940
        artikel: '12'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0001940
        artikel: '6'
        hoofdstuk: III
  - number: '9'
    text: |-
      De voorzitters, de leden, de plaatsvervangende voorzitters en de plaatsvervangende leden van de Marineraden
      onthouden zich van deelneming aan de behandeling van zaken, welke hen of hunne bloed- en aanverwanten tot en met
      den vierden graad persoonlijk aangaan, of waarin zij als gemachtigden zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel9
  - number: '10.1'
    text: |-
      De zittingen van de Marineraden worden in het openbaar gehouden, tenzij in een bepaald geval de Raad, om in
      de uitspraak te vermelden redenen, mocht besluiten de behandeling van een zaak geheel of gedeeltelijk met
      gesloten deuren te doen plaats hebben. Dit laatste geschiedt ook indien, om redenen van defensiebelang of om
      redenen, daarmede verband houdende, den Nederlandschen Marineraad door Onzen Minister van Defensie, dan wel
      den Nederlandsch-Indischen Marineraad door den Gouverneur-Generaal van Nederlandsch-Indië, geheimhouding wordt
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel10
  - number: '10.2'
    text: |-
      De voorzitters, de plaatsvervangende voorzitters, de leden, de plaatsvervangende leden, de raadgevers, de
      plaatsvervangende raadgevers, de secretarissen en de plaatsvervangende secretarissen zijn verplicht het geheim der
      raadkamer te bewaren.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel10
  - number: '10.3'
    text: |-
      Beslissingen van de Marineraden moeten in voltallige vergaderingen worden genomen. In geval van staking van
      stemmen, als gevolg van onthouding, is de stem van den voorzitter beslissend.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel10
  - number: '11'
    text: |-
      De commandanten van oorlogsvaartuigen, aan welk een ramp of ongeval is overkomen, geven daarvan onverwijld,
      door toezending van een door hen ter zake opgemaakt verslag, kennis: aan den betrokken Commandant der Marine
      in Nederland, wanneer de zaak, ingevolge [artikel 4][ref1], ter kennisneming van den Nederlandschen Marineraad
      staat, met dien verstande, dat de commandant van een oorlogsvaartuig, dat onder rechtstreeksch bevel staat van
      Onzen Minister van Defensie, dit verslag doet toekomen aan genoemden Minister, die dit verslag in handen stelt
      van den commandant der Marine, dien hij voor het voorloopig onderzoek aanwijst; aan den Commandant der Zeemacht in
      Nederlandsch-Indië, wanneer de zaak, ingevolge evengenoemd artikel, ter kennisneming van den Nederlandsch-Indischen
      Marineraad staat.


      [ref1]: https://wetten.overheid.nl/BWBR0001940#Artikel4
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001940
        artikel: '4'
        hoofdstuk: III
  - number: '12.1'
    text: |-
      De in [artikel 11][ref1] bedoelde vlootvoogden stellen nopens alle op de in dat artikel aangegeven wijze te hunner
      kennis gekomen rampen of ongevallen een voorloopig onderzoek in of doen dit instellen door een door hen aan te
      wijzen marine-officier. De uitkomsten van dit onderzoek worden zoo spoedig mogelijk, onder overlegging van alle op
      de zaak betrekking hebbende stukken, aan den voorzitter van den betrokken Marineraad medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001940#Artikel11
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001940
        artikel: '11'
        hoofdstuk: IV
  - number: '12.2'
    text: |-
      Meent de met het voorloopig onderzoek belaste vlootvoogd, dat uit een oogpunt van defensiebelang een geheime
      behandeling der zaak noodzakelijk is, dan zendt hij de stukken van het onderzoek, vergezeld van zijne
      beschouwingen, aan Onzen Minister van Defensie, wanneer het een tot de competentie van den Nederlandschen
      Marineraad behoorende zaak betreft, en aan den Gouverneur-Generaal van Nederlandsch-Indië, wanneer het een zaak
      betreft, welke ter kennisneming van den Nederlandsch-Indischen Marineraad staat. Deze bewindslieden beslissen of
      de behandeling van en de uitspraak in de zaak geheim zullen zijn en geven, bij de doorzending der stukken, aan den
      betrokken Raad dienovereenkomstig opdracht.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel12
  - number: '12.3'
    text: |-
      De Marineraden beslissen of met het oog op aard en omvang van ramp of ongeval al dan niet een onderzoek door
      den Raad zal worden ingesteld en geven van deze beslissing kennis, de Nederlandsche Raad aan Onzen Minister van
      Defensie, de Nederlandsch-Indische Raad aan den Gouverneur-Generaal van Nederlandsch-Indië. Acht de Minister of
      de Gouverneur-Generaal, in tegenstelling met de opvatting en beslissing van den Raad, het noodig dat een onderzoek
      wordt ingesteld, dan deelt hij zulks aan het betrokken college mede, hetwelk in dat geval alsnog hiertoe overgaat.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel12
  - number: '12.4'
    text: |-
      Wanneer beslist is, dat door een Marineraad een onderzoek zal worden ingesteld, stelt de voorzitter de plaats, den
      dag en het uur daarvoor vast en roept hij de noodige getuigen en deskundigen voor die zitting van den Raad op.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel12
  - number: '12.5'
    text: |-
      Een Marineraad, een zaak in behandeling genomen hebbend, is bevoegd, zoo noodig den vlootvoogd, die het voorloopig
      onderzoek in die zaak heeft ingesteld of doen instellen, te verzoeken middelerwijl nog nadere gegevens nopens
      bepaalde onderwerpen te verzamelen. Deze is gehouden, aan dat verzoek te voldoen.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel12
  - number: '13.1'
    text: |-
      Op het voorloopig onderzoek, in te stellen door of vanwege de daartoe aangewezen vlootvoogden, zoomede op het
      onderzoek door de Marineraden, zijn van overeenkomstige toepassing de bepalingen omtrent het onderzoek van
      strafzaken, vervat in de Regtspleging bij de Zeemagt, met dien verstande, dat onder eede gehoord wordende getuigen,
      in stede van hunne mededeelingen na het afleggen daarvan met een eed of plechtige verklaring te bevestigen, zullen
      moeten zweren (beloven) dat zij de geheele waarheid en niets dan de waarheid zullen zeggen, alvorens tot het
      afleggen hunner verklaring te worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel13
  - number: '13.2'
    text: |-
      Voor de in het eerste lid bedoelde officieren, voor de voorzitters der Marineraden en voor de Marineraden gelden,
      met betrekking tot het te houden onderzoek, dezelfde bevoegdheden en verplichtingen, als in de Regtspleging bij
      de Zeemagt te dien opzichte zijn vastgelegd, onderscheidenlijk voor de officieren-commissarissen, belast met de
      informatiën, voor de presidenten van de zeekrijgsraden en voor de zeekrijgsraden.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel13
  - number: '13.3'
    text: |-
      Bij het onderzoek, zoowel het voorloopige als het hoofdonderzoek, kunnen zij, die uit hoofde van hun stand, hun
      beroep of hun ambt tot geheimhouding verplicht zijn, zich van het geven van getuigenis of van het beantwoorden
      van bepaalde vragen verschoonen, doch alleen omtrent hetgeen waarvan de wetenschap aan hen als zoodanig is
      toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel13
  - number: '14'
    text: |-
      Aan getuigen en deskundigen, voor zoover hunne dienstverhouding tot de Overheid niet medebrengt, dat zij hunne
      medewerking zonder eenige schadeloosstelling verleenen, wordt, zoo zij dit verlangen, eene schadeloosstelling
      toegekend, door den Nederlandschen Marineraad naar den maatstaf der tarieven van justitiekosten en salarissen in
      burgerlijke zaken en door den Nederlandsch-Indischen Marineraad naar den maatstaf van het tarief van justitiekosten
      en salarissen in burgerlijke zaken voor de Europeesche rechtbanken in Nederlandsch-Indië.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel14
  - number: '15.1'
    text: |-
      De betrokken vlootvoogden, de voorzitters van de Marineraden en deze Raden zelve kunnen overlegging vorderen binnen
      een bepaalden termijn van de door hen noodig geoordeelde voor het onderzoek vereischte officieele en wettelijke
      bescheiden zoowel van de commandanten en kapiteins der schepen bedoeld in [artikel 6, eerste en tweede lid][ref1],
      als van ieder ander, die de stukken onder zijn berusting heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0001940#Artikel6
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001940
        artikel: '6'
        hoofdstuk: III
  - number: '15.2'
    text: |-
      Bij verzuim van overlegging binnen den gestelden termijn wordt daarvan proces-verbaal opgemaakt, hetwelk wordt
      toegezonden, zoo de nalatige militair is, aan de militaire autoriteit onder wier bevelen hij staat en anders
      aan het Openbaar Ministerie bij het gerecht, voor hetwelk de nalatige ter zake van zijne tekortkoming zal moeten
      terechtstaan.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel15
  - number: '15.3'
    text: |-
      Het in het tweede lid bedoelde proces-verbaal levert, behoudens tegenbewijs, een volledig bewijs op van hetgeen
      daarin vermeld staat.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel15
  - number: '16.1'
    text: |-
      De commandanten, de kapiteins, de officieren, de stuurlieden, de machinisten of scheepswerktuigkundigen en de
      radiotelegrafisten van schepen, bedoeld in [artikel 6, eerste en tweede lid][ref1], en voorts ieder, die meent
      over de oorzaken van de ramp of het ongeval licht te kunnen verspreiden, kunnen verzoeken, zoowel dat zij zelven
      gehoord worden, als ook bepaaldelijk door hen aangewezen personen, van wie evenzeer het geven van ter zake dienende
      inlichtingen kan worden verwacht.


      [ref1]: https://wetten.overheid.nl/BWBR0001940#Artikel6
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001940
        artikel: '6'
        hoofdstuk: III
  - number: '16.2'
    text: |-
      Van zoodanige verzoeken wordt, indien daaraan door den leider van het onderzoek geen gehoor wordt gegeven, in het
      proces-verbaal van het onderzoek aanteekening gehouden.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel16
  - number: '16.3'
    text: |-
      De verzoekers mogen tot de verschenen getuigen vragen doen richten, met dien verstande, dat aan den leider van het
      onderzoek de beslissing blijft of een vraag al dan niet zal worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel16
  - number: '16.4'
    text: |-
      Bij dit onderzoek is het niet toegelaten zich door een raadsman te doen bijstaan of zich te doen vertegenwoordigen
      door een gemachtigde.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel16
  - number: '17.1'
    text: |-
      Wanneer de behandeling van een zaak voor een Marineraad is afgeloopen, wordt nopens de ramp of het ongeval door den
      voorzitter van dien Raad in het openbaar uitspraak gedaan, behoudens in het uitzonderingsgeval, bedoeld in het slot
      van [artikel 10, eerste lid][ref1] en in [artikel 12, tweede lid](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0001940#Artikel10
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001940
        artikel: '10'
        hoofdstuk: III
  - number: '17.2'
    text: |-
      Deze uitspraak moet een overzicht bevatten van den gang van het gehouden onderzoek, en de uitkomst daarvan
      vermelden.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel17
  - number: '17.3'
    text: |-
      Op grond van het gehouden onderzoek deelt de Nederlandsche Marineraad aan Onzen Minister van Defensie en de
      Nederlandsch-Indische Marineraad aan den Gouverneur-Generaal van Nederlandsch-Indië mede of er naar 's Raads
      oordeel aanleiding bestaat maatregelen te nemen tegen opvarenden van een oorlogsvaartuig, wier verzuim of schuld
      van invloed is geweest op de ramp of het ongeval, zoo noodig met advies omtrent de te hunnen aanzien te volgen
      gedragslijn.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel17
  - number: '17.4'
    text: |-
      Indien bij den Nederlandschen Marineraad tijdens het onderzoek het vermoeden is gerezen, dat de ramp
      of het ongeval is veroorzaakt door de ongeschiktheid, of door een daad of nalatigheid van den kapitein,
      een stuurman, een machinist of een radiotelegrafist van een schip, dat ingevolge [artikel 2][ref1] of
      [artikel 2bis der Schepenwet][ref2] onder de bepalingen dier wet valt, worden, behoudens in het uitzonderingsgeval,
      bedoeld in het slot van [artikel 10, eerste lid][ref3], en in [artikel 12, tweede lid][ref4], na afloop van
      de behandeling der zaak de stukken van het onderzoek in handen gesteld van den Inspecteur-Generaal voor de
      Scheepvaart te 's-Gravenhage, die handelt als in [Hoofdstuk IV dier wet][ref5] is omschreven. De Nederlandsch-
      Indische Marineraad stelt in een dergelijk geval, wanneer het betrokken schip ingevolge of krachtens artikel 2 der
      Schepenordonnantie 1927 (*Indisch Staatsblad* n°. 33) valt onder de bepalingen dier ordonnantie, de stukken van het
      onderzoek in handen van den Hoofdinspecteur, Hoofd van den Dienst van Scheepvaart, die handelt als is aangegeven
      in artikel 22 der Schepenordonnantie 1927. Is een schip, vallende onder de bepalingen van de [Schepenwet][ref6],
      bij de zaak betrokken, dan zendt de Nederlandsch-Indische Marineraad de stukken aan den Inspecteur-Generaal voor de
      Scheepvaart te 's-Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001876#Artikel2bis
      [ref3]: https://wetten.overheid.nl/BWBR0001940#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0001940#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0001876#HoofdstukIV
      [ref6]: https://wetten.overheid.nl/BWBR0001876
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001876
        artikel: 2bis
      - id: ref3
        bwb_id: BWBR0001940
        artikel: '10'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0001940
        artikel: '12'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0001876
        hoofdstuk: IV
      - id: ref6
        bwb_id: BWBR0001876
  - number: '17.5'
    text: |-
      Een gewaarmerkt afschrift van de uitspraak wordt zoo spoedig mogelijk aangeboden, door den Nederlandschen
      Marineraad aan Onzen Minister van Defensie, door den Nederlandsch-Indischen Marineraad aan den Gouverneur-Generaal
      van Nederlandsch-Indië.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel17
  - number: '17.6'
    text: |-
      De uitspraken van den Nederlandschen Marineraad worden op door Ons te bepalen wijze openbaar gemaakt; ten aanzien
      van de uitspraken van den Nederlandsch-Indischen Marineraad geschiedt dit op de wijze, door den Gouverneur-Generaal
      van Nederlandsch-Indië te bepalen.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel17
  - number: '17.7'
    text: |-
      Indien zich het uitzonderingsgeval, bedoeld in het slot van [artikel 10, eerste lid][ref1], en in
      [artikel 12, tweede lid][ref2], voordoet, wordt door den voorzitter van den Raad een verslag van den gang van het
      gehouden onderzoek en van de uitspraak onder geheim couvert overgelegd, voor zooveel betreft den Nederlandschen
      Raad aan Onzen Minister van Defensie en wat betreft den Nederlandsch-Indischen Raad aan den Gouverneur-Generaal van
      Nederlandsch-Indië. Wanneer deze rapporten geen defensiegeheimen bevatten, wordt daarvan een exemplaar neergelegd
      ter griffie van de Tweede Kamer der Staten-Generaal en, wanneer de zaak betrekking heeft op een oorlogsvaartuig,
      staande onder het opperbevel van den Gouverneur-Generaal van Nederlandsch-Indië, ook op het secretariaat van den
      Volksraad aldaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001940#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001940#Artikel12
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001940
        artikel: '10'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001940
        artikel: '12'
        hoofdstuk: IV
  - number: '18.1'
    text: |-
      De termijn van oproeping van getuigen en van deskundigen voor den Nederlandschen Marineraad is, voor het geval
      zij in het Rijk in Europa woonachtig zijn of verblijf houden, van twee vrije dagen. Is hunne woonplaats elders of
      onbekend, dan stelt de voorzitter dien termijn vast.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel18
  - number: '18.2'
    text: |-
      De termijn van oproeping van getuigen en van deskundigen voor den Nederlandsch-Indischen Marineraad wordt door den
      Gouverneur-Generaal van Nederlandsch-Indië vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel18
  - number: '18.3'
    text: |-
      Voor zoover noodig geschiedt de oproeping en de mededeeling van beslissingen van een Marineraad op last van
      den voorzitter van dien Raad, door beteekening door den deurwaarder van eenig rechterlijk college of ander een
      ambtenaar, aangesteld voor de uitvoering van de politietaak, met achterlating van een afschrift aan den persoon of
      aan zijn woon- of verblijfplaats.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel18
  - number: '18.4'
    text: |-
      Ingeval de beambte, met de beteekening belast, noch den persoon van den opgeroepene of beteekende, noch iemand
      van diens huisgenooten aan diens woon- of verblijfplaats aantreft, zal hij het afschrift terstond ter hand stellen
      aan het hoofd van het plaatselijk bestuur - op Java en Madoera aan den Assistent-Resident - of aan dengene, die
      hem vervangt, die het oorspronkelijke met gezien zal teekenen en het afschrift zoo mogelijk aan den betrokkene zal
      moeten doen toekomen, zonder dat van dit laatste echter zal behoeven te blijken.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel18
  - number: '19.1'
    text: |-
      De Marineraden zijn bij de behandeling van zaken als in deze wet bedoeld, aan geene andere vormen gehouden, dan bij
      deze wet zijn bepaald.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel19
  - number: '19.2'
    text: |-
      De vlootvoogd, die het voorloopig onderzoek heeft ingesteld of doen instellen, is bevoegd de zittingen van den
      betrokken Marineraad, ook die, welke met gesloten deuren worden gehouden, bij te wonen. Hij kan zich echter bij
      alle werkzaamheden, in deze wet bedoeld, door een zeeofficier doen vervangen.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel19
  - number: '20.1'
    text: |-
      De kosten van het onderzoek betreffende een ramp of ongeval, overkomen aan een onder het opperbevel van
      den Gouverneur-Generaal van Nederlandsch-Indië staand oorlogsvaartuig, alsmede de kosten, verbonden aan den
      Nederlandsch-Indischen Marineraad, komen ten laste van de Nederlandsch-Indische geldmiddelen.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel20
  - number: '20.2'
    text: Alle andere uit deze wet voortvloeiende kosten worden gedragen door het Rijk.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel20
  - number: '21'
    text: |-
      Aan belanghebbenden wordt op hun verzoek kosteloos inzage en, op hunne kosten, uittreksel of afschrift van de
      uitspraak van een Marineraad door den secretaris van het college verstrekt, berekend, voor den Nederlandschen
      Marineraad volgens tarief voor uittreksels of afschriften van vonnissen in strafzaken, voor den Nederlandsch-
      Indischen Marineraad volgens tarief van justitiekosten en salarissen in strafzaken, voor griffiers en deurwaarders
      bij de Europeesche rechtbanken.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel21
  - number: '22'
    text: |-
      Indien bij het onderzoek een gegrond vermoeden ontstaat, dat door iemand een strafbaar feit is gepleegd, dan wordt
      de bevoegde ambtenaar van het Openbaar Ministerie, dan wel de betrokken militaire autoriteit daarmede in kennis
      gesteld door den voorzitter van den Marineraad.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel22
  - number: '23'
    text: |-
      Met geldboete van ten hoogste € 270, dan wel indien de geldboete wordt opgelegd door de strafrechter in de
      Nederlandse Antillen of Aruba, een geldboete van ten hoogste ANG 600 onderscheidenlijk AWG 600 wordt gestraft hij,
      die in strijd met het bepaalde bij [artikel 7][ref1] nalaat inlichtingen te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0001940#Artikel7
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001940
        artikel: '7'
        hoofdstuk: III
  - number: '24'
    text: |-
      Met geldboete van ten hoogste € 27, dan wel indien de geldboete wordt opgelegd door de strafrechter in de
      Nederlandse Antillen of Aruba, een geldboete van ten hoogste ANG 60 onderscheidenlijk AWG 60 wordt gestraft hij,
      die, nadat hij ingevolge [artikel 12][ref1] of [artikel 16][ref2] behoorlijk is opgeroepen, niet verschijnt, of
      verschenen zijnde, op de gestelde vragen niet antwoordt.


      [ref1]: https://wetten.overheid.nl/BWBR0001940#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0001940#Artikel16
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001940
        artikel: '12'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0001940
        artikel: '16'
        hoofdstuk: IV
  - number: '25'
    text: |-
      Met geldboete van ten hoogste  € 135, dan wel indien de geldboete wordt opgelegd door de strafrechter in de
      Nederlandse Antillen of Aruba, een geldboete van ten hoogste ANG 300 onderscheidenlijk AWG 300 wordt gestraft de
      commandant, de gezagvoerder of de kapitein, die in strijd met het bepaalde in [artikel 15][ref1] de opgevorderde
      bescheiden niet overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0001940#Artikel15
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001940
        artikel: '15'
        hoofdstuk: IV
  - number: '26'
    text: |-
      Met geldboete van ten hoogste € 2250, dan wel indien de geldboete wordt opgelegd door de strafrechter in de
      Nederlandse Antillen of Aruba, een geldboete van ten hoogste ANG 5000 onderscheidenlijk AWG 5000 wordt gestraft de
      derde, onder wiens berusting de in [artikel 15][ref1] bedoelde bescheiden zich bevinden, en die de ingevolge dat
      artikel opgevorderde bescheiden niet overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0001940#Artikel15
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001940
        artikel: '15'
        hoofdstuk: IV
  - number: '28'
    text: De bij deze wet strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel28
  - number: '29.1'
    text: |-
      De bij deze wet gestelde strafbepalingen zijn toepasselijk op ieder, die zich, hetzij binnen, hetzij buiten het
      Rijk in Europa, schuldig maakt aan eenig bij deze wet strafbaar gesteld feit.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel29
  - number: '29.2'
    text: |-
      Bij de oplegging en uitvoering, krachtens deze wet, van straffen in Nederlandsch-Indië, Suriname en Curaçao, gelden
      de met betrekking tot de gelijknamige straffen daar te lande van kracht zijnde wettelijke bepalingen.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel29
  - number: '30'
    text: |-
      In alle gevallen, waarop deze wet van toepassing is, zijn, behoudens het bepaalde in het
      [vierde lid van artikel 17][ref1], niet van toepassing de voorschriften van [Hoofdstuk IV der Schepenwet][ref2]
      en de bepaling, vervat in [artikel 70 van die wet][ref3], noch het bepaalde bij of krachtens artikel 22 van de
      Nederlandsch-Indische Schepenordonnantie 1927.


      [ref1]: https://wetten.overheid.nl/BWBR0001940#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0001876#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0001876#Artikel70
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001940
        artikel: '17'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0001876
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0001876
        artikel: '70'
  - number: '32'
    text: |-
      Hetgeen verder ter uitvoering van deze wet noodig is, wordt voor zooveel den Nederlandschen Marineraad betreft door
      Ons en voor zooveel het op den Nederlandsch-Indischen Marineraad betrekking heeft, door den Gouverneur-Generaal van
      Nederlandsch-Indië geregeld.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel32
  - number: '33'
    text: Deze wet is ook verbindend voor Nederlandsch-Indië, Suriname en Curaçao.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel33
  - number: '34'
    text: |-
      Deze wet kan worden aangehaald onder den titel "Marinescheepsongevallenwet", met bijvoeging van het jaar en het
      nummer van het *Staatsblad*, waarin de gewijzigde tekst is geplaatst.
    url: https://wetten.overheid.nl/BWBR0001940/2002-01-01#Artikel34
