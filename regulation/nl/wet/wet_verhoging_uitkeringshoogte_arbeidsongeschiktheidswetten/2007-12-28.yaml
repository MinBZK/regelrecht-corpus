preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om arbeidsongeschiktheidswetten en de Wet financiering
    sociale verzekeringen te wijzigen in verband met de verhoging van de uitkering voor volledig arbeidsongeschikten
    naar 75% en in verband met de uitsluiting van de wachttijd in situaties waarin heropening of verhoging van de
    arbeidsongeschiktheidsuitkering voortvloeit uit de verlaging van de leeftijdsgrens voor de toepasselijkheid van het
    aangepaste Schattingsbesluit arbeidsongeschiktheidswetten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023310/2007-12-28#ArtikelAanhef
articles:
  - number: V
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst met dien verstande dat:

      a. de [artikelen I, onderdelen A en B][ref1], [II, onderdeel A][ref2], [III, onderdeel A][ref3],
      [IV, onderdelen A en G][ref4], en [IVa][ref5], terugwerken tot en met 1 juli 2007; en

      b. de [artikelen II, onderdelen B tot en met E][ref6], [III, onderdelen B tot en met E][ref7], en
      [IV, onderdelen B tot en met F][ref8], terugwerken tot en met 22 februari 2007.


