  - number: 169a
    text: |-
      1 De rechtspersoon, bedoeld in [artikel 169][ref1], kan het burgerservicenummer of, bij het ontbreken
      daarvan, het sociaal-fiscaalnummer van het personeelslid dat bij afwezigheid wordt vervangen, en van
      degene die het personeelslid tijdelijk vervangt, uitsluitend in het kader van het doel, bedoeld in
      [artikel 169, eerste lid, onderdeel a][ref2], gebruiken in het verkeer met:

      a. het personeelslid onderscheidenlijk degene die het personeelslid tijdelijk vervangt,

      b. het bevoegd gezag van de school, het regionaal expertisecentrum dan wel de centrale dienst waar de in onderdeel
      a bedoelde personen werkzaam zijn,

      c. Onze minister,

      d. de instantie, bedoeld in [artikel 170, vijfde lid][ref3], of

      e. het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4].

      2 Het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer wordt op een daartoe strekkend
      verzoek van de in het eerste lid bedoelde rechtspersoon aan die rechtspersoon verstrekt door het bevoegd gezag van
      de school, het regionaal expertisecentrum dan wel de centrale dienst waar het personeelslid dat bij afwezigheid
      wordt vervangen, werkzaam is.

      3 Indien dat ten behoeve van het jaarverslag, bedoeld in
      [artikel 18, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref5], noodzakelijk is, worden gegevens
      daarin slechts zodanig openbaar gemaakt dat daaraan geen herkenbare gegevens over een afzonderlijk persoon
      kunnen worden ontleend, tenzij het betreft de controle op de juistheid van de gegevens in het kader van de
      controle op de rechtmatigheid en de doelmatigheid van aan of door de rechtspersoon gedane uitgaven. Daarbij
      kunnen de burgerservicenummers of, voor zover deze ontbreken, sociaal-fiscale nummers worden vergeleken met de
      burgerservicenummers of sociaal-fiscale nummers die door andere daartoe bij of krachtens de wet bevoegde instanties
      zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel169
