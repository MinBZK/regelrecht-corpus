  - number: '143'
    text: |-
      1 Het bevoegd gezag wendt het totaal van de in de [artikelen 124][ref1], [128][ref2] en [131][ref3] bedoelde
      bedragen voor de kosten voor de materiële instandhouding en de personeelskosten uitsluitend aan voor kosten
      voor materiële instandhouding, personeelskosten van de school, personeelskosten in verband met benoeming of
      tewerkstelling zonder benoeming van personeel, bedoeld in [artikel 29, vijfde lid][ref4], dan wel mede voor die
      kosten van een van de andere scholen van dat bevoegd gezag.

      2 Het bevoegd gezag kan de in de [artikelen 124][ref5], [128][ref6], [131][ref7] en [166a][ref8] bedoelde bedragen
      voor de kosten voor de materiële instandhouding en voor de personeelskosten mede aanwenden voor de in het eerste
      lid bedoelde kosten van:

      a. een regionaal expertisecentrum, een centrale dienst of een andere school;

      b. een centrale dienst of een basisschool of een speciale school voor basisonderwijs als bedoeld in
      de [Wet op het primair onderwijs][ref9] of een centrale dienst dan wel een school als bedoeld in de
      [Wet op het voortgezet onderwijs][ref10].

      3 De verstrekte overschrijdingsbedragen worden ten behoeve van het onderwijs aan de scholen van het bevoegd gezag
      aangewend.

      4 De op grond van [artikel 134][ref11] of [artikel 135][ref12] verstrekte vergoeding wordt besteed aan het doel
      waarvoor zij is verstrekt.


