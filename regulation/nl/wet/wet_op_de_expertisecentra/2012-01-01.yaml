  - number: '117'
    text: |-
      1 Voor de bekostiging van personeel wordt per onderwijssoort een bedrag per school, niet zijnde een instelling,
      en een bedrag per leerling toegekend, welke bedragen worden verhoogd met een bedrag dat wordt vermenigvuldigd met
      de gewogen gemiddelde leeftijd van de leraren van de school op 1 oktober van het voorafgaande schooljaar. Voor
      het schooljaar waarin een nieuwe school wordt geopend, wordt vermenigvuldigd met de geraamde landelijk gewogen
      gemiddelde leeftijd op 1 oktober van het voorafgaande schooljaar van de leraren in het speciaal onderwijs en het
      voortgezet speciaal onderwijs.

      2 De bedragen, bedoeld in het eerste lid, kunnen in elk geval verschillend worden vastgesteld voor leerlingen

      a. van de verschillende onderwijssoorten, bedoeld in [artikel 2][ref1];

      b. in het speciaal onderwijs en het voortgezet speciaal onderwijs;

      c. jonger dan 8 jaar; en

      d. 8 jaar en ouder.

      3 Bij algemene maatregel van bestuur wordt bepaald in welke gevallen en onder welke voorwaarden aanvullende
      bekostiging voor personeelskosten kan worden toegekend. In ieder geval wordt aan scholen, niet zijnde instellingen,
      aanvullende bekostiging toegekend voor schoolleiding, bestrijding van onderwijsachterstanden en groei van het
      aantal leerlingen gedurende het schooljaar.

      4 De instellingen ontvangen in aanvulling op de bekostiging, bedoeld in het eerste lid, jaarlijks een bij
      ministeriële regeling vast te stellen bekostiging in verband met de visuele handicap van de leerlingen van de
      instelling en de vervulling van de taken, bedoeld in [artikel 9, onderdelen b en c][ref2]. De bekostigingsbedragen,
      bedoeld in het eerste lid, en de eerste volzin zijn tezamen redelijkerwijs voldoende voor het leiden en beheren van
      de instelling, voor de taken, bedoeld in [artikel 9][ref3], en voor de overige werkzaamheden die verband houden met
      het onderwijs aan de instelling. Het veertiende lid is van overeenkomstige toepassing.

      5 De scholen van de onderwijssoorten in de clusters, bedoeld in [artikel 2, vierde lid, onderdelen b, c en d][ref4],
      ontvangen in aanvulling op de bekostiging, bedoeld in het eerste en derde lid, bekostiging in verband met het
      onderwijs aan leerlingen van wie de toelating is gericht op een verblijf op de school van korter dan een schooljaar
      en bekostiging ten behoeve van leerlingen als bedoeld in [artikel 28c, derde lid][ref5].

      6 Bij algemene maatregel van bestuur worden de grondslagen van de bekostiging, bedoeld in het vijfde lid, voor de
      onderwijssoorten in de clusters, bedoeld in [artikel 2, vierde lid, onderdelen b en c][ref6], per onderwijssoort
      en voor de onderwijssoorten in het cluster, bedoeld in [artikel 2, vierde lid, onderdeel d][ref7], per cluster
      vastgesteld.

      7 Voor scholen, niet zijnde instellingen, waaraan onderwijs wordt gegeven aan leerlingen die zijn opgenomen
      in residentiële instellingen wordt tevens een bekostiging vastgesteld die is gebaseerd op het aantal
      leerlingen aan wie onderwijs wordt verzorgd op basis van een samenwerkingsovereenkomst als bedoeld in
      [artikel 71c, eerste lid][ref8].

      8 Bij algemene maatregel van bestuur worden de grondslagen voor de berekening van de bekostiging ten behoeve van de
      werkzaamheden en de onderwijssoorten, bedoeld in [artikel 8a, derde lid, onderdeel a][ref9], vastgesteld.

      9 Bij algemene maatregel van bestuur wordt voor de werkzaamheden en de onderwijssoorten, bedoeld in
      [artikel 8a, derde lid, onderdeel b][ref10], de bekostiging vastgesteld.

      10 Bij ministeriële regeling worden het bedrag per school en per leerling, bedoeld in het eerste lid, de
      vermenigvuldigingsbedragen van de verhoging, bedoeld in het eerste lid, en de bekostigingsbedragen, bedoeld in het
      derde, vijfde, zevende, achtste en negende lid, vastgesteld.

      11 Het bedrag per leerling, bedoeld in het tiende lid, is de som van:

      a. de uitkomst van een bij algemene maatregel van bestuur vast te stellen hoeveelheid formatie leraren per
      leerling, vermenigvuldigd met een bedrag, en

      b. de uitkomst van een bij algemene maatregel van bestuur vast te stellen hoeveelheid formatie
      onderwijsondersteunend personeel per leerling, vermenigvuldigd met een bedrag.

      12 De verhoging, bedoeld in het tiende lid, is voor wat betreft het bedrag per leerling de uitkomst van de in het
      elfde lid, onder a, bedoelde hoeveelheid formatie leraren per leerling, vermenigvuldigd met een bedrag.

      13 Het bedrag per school, het vermenigvuldigingsbedrag van de verhoging voor wat betreft het bedrag per school, en
      de bekostigingsbedragen, bedoeld in het tiende lid, zijn de uitkomst van een bij de algemene maatregel van bestuur
      vast te stellen hoeveelheid formatie vermenigvuldigd met een bedrag.

      14 Bij de vaststelling van de bedragen, bedoeld in het tiende lid, wordt in ieder geval rekening gehouden met de
      ontwikkeling van de geraamde landelijk gewogen gemiddelde leeftijd en de genormeerde gemiddelde personeelslast
      van het personeel van scholen en worden nadere regels vastgesteld met betrekking tot de wijze waarop de gewogen
      gemiddelde leeftijd en de geraamde gewogen gemiddelde leeftijd worden vastgesteld. Indien aanvullende bekostiging
      wordt toegekend voor een bepaalde categorie personeel kan in afwijking van de eerste volzin rekening worden
      gehouden met de genormeerde gemiddelde personeelslasten van die categorie personeel.

      15 De bekostiging, bedoeld in het eerste en het derde lid, voor wat betreft schoolleiding en groei van het aantal
      leerlingen tijdens het schooljaar, is redelijkerwijs voldoende voor het leiden en beheren van de school, voor
      het geven van onderwijs aan de school en voor de overige werkzaamheden die verband houden met het onderwijs aan
      de school.

      16 De algemene maatregel van bestuur, bedoeld in dit artikel, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsontwerp zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure,
      bedoeld in de vorige 3 volzinnen, kan worden afgeweken.


