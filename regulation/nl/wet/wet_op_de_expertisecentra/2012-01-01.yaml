  - number: '36'
    text: |-
      1 Het bevoegd gezag is verplicht aan studenten die in opleiding zijn voor een functie in het basisonderwijs, het
      speciaal onderwijs of het voortgezet speciaal onderwijs gelegenheid te bieden de als onderdeel van hun opleiding
      vereiste ervaring in de school te verkrijgen.

      2 De verplichting bedoeld in het eerste lid, betreft:

      a. studenten die op een opleidingsinstituut voor onderwijzend personeel zijn ingeschreven;

      b. in een schooljaar gelijktijdig niet meer studenten als bedoeld onder a, dan een derde van het aantal leraren in
      dat jaar.

      3 Een bevoegd gezag kan een student de verdere toegang tot de school ontzeggen, indien deze in strijd handelt
      met de grondslag en doelstellingen van de school. Van een beslissing tot ontzegging van de toegang tot de school
      wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd gezag van het betrokken
      opleidingsinstituut en aan de inspectie.

      4 De directeur regelt in overeenstemming met het opleidingsinstituut en het onderwijzend personeel de werkzaamheden
      in verband met de begeleiding door dit personeel van de studenten in de school.

      5 Onze minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de verplichting verlenen. De ontheffing geldt voor 1 schooljaar.

      6 De scholen waarop studenten als bedoeld in het eerste lid, zijn toegelaten, zijn toegankelijk voor de inspectie
      belast met het toezicht op de opleidingsinstituten voor onderwijzend personeel en voor de directeuren en de door
      deze aan te wijzen leraren van die opleidingsinstituten, een en ander voor zover zulks voor de uitoefening van het
      toezicht op de praktische vorming noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel36
  - number: '37'
    text: |-
      Over aangelegenheden van algemeen belang voor de rechtstoestand van het personeel bedoeld in [artikel 32][ref1],
      wordt volgens bij algemene maatregel van bestuur te stellen regels overleg gevoerd met de daarvoor in aanmerking
      komende personeelsorganisaties en, voor zover zij daarbij belang hebben, organisaties van gemeente- en
      schoolbesturen. De algemene maatregel van bestuur bepaalt tevens de gevallen waarin in dat overleg overeenstemming
      met de personeelsorganisaties dient te worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel32
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel37
