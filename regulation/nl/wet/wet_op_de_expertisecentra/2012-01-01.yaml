  - number: 146a
    text: |-
      1 Indien de kwaliteit van het onderwijs of de kwaliteit van het bestuur ernstig of langdurig tekortschiet, kan Onze
      minister op verzoek van het bevoegd gezag van een school, van een regionaal expertisecentrum of uit eigen beweging
      in overeenstemming met het bevoegd gezag maatregelen treffen.

      2 Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de instelling ter
      beschikking worden gesteld.

      3 Onze minister stelt nadere regels omtrent de toekenning van en verantwoording voor maatregelen, voorzover deze
      het verstrekken van financiële middelen betreffen.

      4 Het eerste tot en met het derde lid is van overeenkomstige toepassing ten aanzien van de kwaliteit van de
      uitoefening van de taken van het regionaal expertisecentrum, met dien verstande dat onder het bevoegd gezag van een
      school, het bevoegd gezag en het bestuur van de instelling wordt verstaan het bestuur van de rechtspersoon, bedoeld
      in [artikel 28b, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28b
