        artikel: '109'
  - number: '168'
    text: |-
      Het bevoegd gezag van een bijzondere school is verplicht de uit de overheidskassen ontvangen gelden overeenkomstig
      de bestemming te gebruiken. Van de inkomsten en uitgaven wordt volgens bij algemene maatregel van bestuur te geven
      voorschriften nauwkeurig boekgehouden.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel168
  - number: '169'
    text: |-
      1 Het bevoegd gezag van een school onderscheidenlijk het regionaal expertisecentrum is aangesloten bij een door
      Onze minister aan te wijzen rechtspersoon met volledige rechtsbevoegdheid die zich ten doel stelt waarborgen te
      bieden voor

      a. de kosten voor vervanging bij afwezigheid van personeel, en

      b. de kosten voortvloeiend uit rechtspositionele verplichtingen ten aanzien van personeel dat gebruik maakt van een
      krachtens [artikel 33, tweede lid][ref1], vastgestelde regeling voor onvrijwillige taakvermindering.

      2 Het bevoegd gezag van een school onderscheidenlijk het regionaal expertisecentrum is voorts verplicht jaarlijks
      een door het bestuur van de in het eerste lid bedoelde rechtspersoon te bepalen bijdrage te voldoen aan die
      rechtspersoon in verband met de kosten voor vervanging.

      3 Van de in het eerste juncto tweede lid bedoelde verplichting kan Onze minister op verzoek van het bevoegd gezag
      onderscheidenlijk het regionaal expertisecentrum ontheffing verlenen op grond van bezwaren van godsdienstige of
      levensbeschouwelijke aard. Onze minister verleent de ontheffing slechts indien het bevoegd gezag onderscheidenlijk
      het regionaal expertisecentrum aantoont dat een afdoende andere voorziening is getroffen met betrekking tot
      de gevolgen van vervanging bij afwezigheid van personeel en de gevolgen die voortvloeien uit rechtspositionele
      verplichtingen ten aanzien van personeel dat gebruik maakt van een krachtens [artikel 33, tweede lid][ref2],
      vastgestelde regeling voor onvrijwillige taakvermindering. Onze Minister besluit binnen zes maanden na ontvangst
      van een verzoek als bedoeld in de eerste volzin. Indien de beschikking niet binnen zes maanden kan worden gegeven,
      stelt Onze minister het bevoegd gezag onderscheidenlijk het regionaal expertisecentrum daarvan in kennis en noemt
      hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.

      4 Het bestuur van de rechtspersoon kan regels vaststellen ter uitvoering van het eerste lid.

      5 Uit 's Rijks kas wordt jaarlijks een door Onze minister te bepalen bedrag betaald aan de rechtspersoon, bedoeld
      in het eerste lid, in verband met de kosten, bedoeld in dat lid onder b.

      6 Op de rechtspersoon, bedoeld in het eerste lid, is de [Kaderwet zelfstandige bestuursorganen][ref3] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0020495
