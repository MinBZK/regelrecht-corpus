  - number: 28b
    text: |-
      1 Het bevoegd gezag is voor elk van zijn scholen aangesloten bij een regionaal expertisecentrum. Een regionaal
      expertisecentrum omvat alle scholen van alle soorten die tot hetzelfde cluster of dezelfde clusters, bedoeld in
      [artikel 2, vierde lid][ref1], behoren en die zijn gelegen in het gebied, bedoeld in het tweede lid, waarin het
      regionaal expertisecentrum werkzaam is. In bijzondere omstandigheden kan Onze minister toestaan dat een regionaal
      expertisecentrum niet alle scholen omvat van alle soorten die tot hetzelfde cluster dan wel dezelfde clusters,
      bedoeld in [artikel 2, vierde lid][ref2], behoren.

      2 Bij algemene maatregel van bestuur worden per cluster als bedoeld in [artikel 2, vierde lid][ref3],
      aaneengesloten gebieden vastgesteld waarvan de grenzen overeenkomen met de grenzen van gemeenten.

      3 Het bevoegd gezag kan per school slechts deelnemen aan 1 regionaal expertisecentrum.

      4 Bevoegde gezagsorganen van scholen waaraan onderwijs wordt gegeven van de soorten die behoren tot hetzelfde
      cluster en die zijn gelegen binnen hetzelfde gebied worden niet uitgesloten van deelname aan het in dat gebied
      werkzame regionaal expertisecentrum.

      5 Het bevoegd gezag dat respectievelijk de bevoegde gezagsorganen die aangesloten willen zijn, geven het regionaal
      expertisecentrum vorm door een rechtspersoon op te richten, waarin uitsluitend wordt deelgenomen door die bevoegde
      gezagsorganen die bij het regionaal expertisecentrum zijn aangesloten.

      6 Het regionaal expertisecentrum heeft in elk geval tot taak:

      a. het instandhouden van een commissie voor de indicatiestelling;

      b. het coördineren van de ondersteuning, bedoeld in [artikel 8a, eerste en tweede lid][ref4], die door
      de scholen waarvoor het regionaal expertisecentrum werkzaam is, wordt verleend aan scholen als bedoeld in
      [laatstgenoemd artikel][ref5] en met inachtneming van de wensen van die scholen;

      c. het ondersteunen van de ouders bij het indienen van een verzoek als bedoeld in [artikel 28c, eerste lid][ref6];

      d. het coördineren van de in het kader van de laatste volzin van het [vierde lid van artikel 28c][ref7]
      noodzakelijke onderzoeksactiviteiten;

      e. het ondersteunen van de ouders van een leerling bij het zoeken naar een school en het ondersteunen van ouders
      van een leerling voor wie een leerlinggebonden budget beschikbaar is bij het zoeken naar een school als bedoeld in
      de [Wet op het primair onderwijs][ref8] of de [Wet op het voortgezet onderwijs][ref9] en

      f. het coördineren van de inzet van de bekostiging ten behoeve van de begeleiding van leerlingen, bedoeld
      in [artikel 8a, derde lid onder a][ref10], na overleg met de samenwerkingsverbanden, bedoeld in de
      [Wet op het primair onderwijs][ref11] en de [Wet op het voortgezet onderwijs][ref12], in het gebied waarin het
      regionaal expertisecentrum werkzaam is.

      7 Bij algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot de samenstelling van de
      commissie voor de indicatiestelling.

      8 De regionale expertisecentra die behoren tot hetzelfde cluster als bedoeld in [artikel 2, vierde lid][ref13],
      stellen gezamenlijk een adviescommissie overeenkomstig [artikel 7:13 van de Algemene wet bestuursrecht][ref14]
      in, die adviseert met betrekking tot een bij de commissie voor de indicatiestelling ingediend
      bezwaarschrift betreffende een beslissing op grond van [artikel 28c, eerste en tweede lid][ref15],
      betreffende een beslissing van die commissie die samenhangt met de toepassing van het
      [derde lid van genoemd artikel][ref16], betreffende een beslissing van die commissie op grond van
      [artikel 70b, eerste en tweede lid, van de Wet op het primair onderwijs][ref17] en betreffende een beslissing van
      die commissie op grond van [artikel 77b, eerste en tweede lid, van de Wet op het voortgezet onderwijs][ref18].

      9 Het regionaal expertisecentrum kan een of meer scholen in stand houden indien het bevoegd gezag dan wel de
      bevoegde gezagsorganen de instandhouding van die school of die scholen overdraagt dan wel overdragen aan het
      regionaal expertisecentrum. Indien als gevolg van toepassing van de eerste volzin het regionaal expertisecentrum
      alle scholen in stand houdt van alle soorten die tot hetzelfde cluster of dezelfde clusters, bedoeld in
      [artikel 2, vierde lid][ref19], behoren, behoudens voor zover toepassing is gegeven aan de derde volzin van het
      eerste lid, en die zijn gelegen in het gebied, bedoeld in het tweede lid, waarin het regionaal expertisecentrum
      werkzaam is, is op het regionaal expertisecentrum tevens bevoegd gezag de eerste volzin van het eerste lid niet
      van toepassing zolang het regionaal expertisecentrum tevens bevoegd gezag zijn taken als regionaal expertisecentrum
      blijft vervullen.

      10 Het bepaalde bij of krachtens de [artikelen 23][ref20], [32][ref21], [33][ref22], [37][ref23], [38][ref24],
      [62][ref25], [63][ref26], [64][ref27] en [65][ref28] is van overeenkomstige toepassing op het regionaal
      expertisecentrum en het personeel daarvan.


