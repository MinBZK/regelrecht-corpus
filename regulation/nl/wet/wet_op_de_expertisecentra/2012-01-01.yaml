  - number: '63'
    text: |-
      1 Het bevoegd gezag is aangesloten bij een commissie van beroep. Het personeel kan bij die commissie beroep
      instellen tegen een beslissing van het bevoegd gezag inhoudende:

      a. een disciplinaire maatregel;

      b. schorsing;

      c. het direct of indirect onthouden van promotie;

      d. het verminderen van de omvang van de betrekking;

      e. ontslag anders dan op eigen verzoek, voordat de pensioengerechtigde leeftijd is bereikt;

      f. de beslissing van het bevoegd gezag ten aanzien van een personeelslid op basis waarvan op termijn vermindering
      van diens betrekkingsomvang kan plaatsvinden;

      g. de beëindiging van een verlengd tijdelijk dienstverband;

      h. de aanwijzing als personeelslid boven de reguliere formatie voortvloeiend uit een algemeen verbindend
      voorschrift welke aanwijzing op termijn kan leiden tot ontslag, vermindering van de betrekkingsomvang of
      beëindiging van een verlengd tijdelijk dienstverband;

      i. de aanwijzing van een andere school of andere scholen waaraan een personeelslid werkzaamheden zal verrichten.

      2 Een beslissing als bedoeld in het vorige lid, aanhef, wordt schriftelijk aan de betrokkene medegedeeld. Daarbij
      wordt tevens vermeld de beroepstermijn en het adres van de commissie waar het beroep kan worden ingesteld.

      3 Het bevoegd gezag onderwerpt zich aan de uitspraak van de commissie.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel63
  - number: '64'
    text: |-
      1 Het beroep bedoeld in [artikel 63][ref1], wordt schriftelijk ingesteld binnen 6 weken, nadat de beslissing aan
      betrokkene is medegedeeld. Bij overschrijding van deze termijn ten gevolge van omstandigheden die de betrokkene
      niet kunnen worden verweten, laat de commissie niet-ontvankelijkverklaring op die grond achterwege.

      2 Tijdens de behandeling door de commissie van beroep loopt geen verjaring met betrekking tot rechtsvorderingen ter
      zake van beslissingen die aan het oordeel van de commissie zijn onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel63
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '63'
        afdeling: '3'
  - number: '65'
    text: |-
      1 Een commissie van beroep strekt haar werkzaamheden uit over ten minste 50 bijzondere scholen. Onze minister kan
      dit aantal lager stellen.

      2 Tot scholen bedoeld in het eerste lid, kunnen ook scholen voor basisonderwijs en scholen voor voortgezet
      onderwijs behoren.

      3 De commissie bestaat uit 5 leden en 5 plaatsvervangende leden, waarvan 2 leden en 2 plaatsvervangende leden
      worden gekozen door het bevoegd gezag en 2 leden en 2 plaatsvervangende leden door het personeel van de aangesloten
      scholen. Deze 4 leden kiezen het vijfde lid, tevens voorzitter, en diens plaatsvervanger.

      4 De leden en plaatsvervangende leden mogen niet behoren tot het bevoegd gezag of het personeel van een aangesloten
      school of tot de inspectie van het onderwijs.

      5 Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de samenstelling en de werkwijze
      van de commissie van beroep.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel65
  - number: '66'
    text: |-
      1 In deze afdeling wordt verstaan onder:

        - *fusie:* een bestuurlijke of institutionele fusie,
        - *institutionele fusie:* een fusie waarbij een school ontstaat door samenvoeging van twee of meer scholen,
        - *bestuurlijke fusie:* een fusie waarbij een of meer rechtspersonen de instandhouding van een school, een
      school als bedoeld in de [Wet op het primair onderwijs][ref1] dan wel de [Wet op het voortgezet onderwijs][ref2]
      overdragen.

      2 Het eerste lid, onderdeel b, is niet van toepassing op het instellen van een openbare rechtspersoon als bedoeld
      in [artikel 50, eerste lid, eerste volzin][ref3] of de instandhouding van een of meer openbare scholen door een
      stichting als bedoeld in [artikel 51, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
