    text: |-
      1 De leerlingen nemen deel aan alle voor hen bestemde onderwijsactiviteiten, met dien verstande dat die
      onderwijsactiviteiten voor de leerlingen onderling kunnen verschillen.

      2 Het bevoegd gezag kan op verzoek van de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam
      is, de leerling, een leerling vrijstellen van bepaalde onderwijsactiviteiten. Een vrijstelling kan slechts worden
      verleend, op door het bevoegd gezag vastgestelde gronden. Het bevoegd gezag bepaalt bij de vrijstelling welke
      onderwijsactiviteiten voor de leerling in de plaats komen van die waarvan vrijstelling is verleend.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel46
  - number: '47'
    text: |-
      Op verzoek van de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, op verzoek van de
      leerling, kan aan leerlingen die voortgezet speciaal onderwijs volgen gelegenheid worden gegeven eindexamen af te
      leggen aan een school voor regulier onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel47
  - number: 47a
    text: |-
      1 Het bevoegd gezag doet onverwijld opgave aan burgemeester en wethouders van de gemeente waar de betrokkene woon-
      of verblijfplaats heeft van de gegevens van degene

      a. op wie de [Leerplichtwet 1969][ref1] niet meer van toepassing is en die de leeftijd van 23 jaren nog niet heeft
      bereikt,

      b. die niet in het bezit is van een diploma voorbereidend wetenschappelijk onderwijs of
      hoger algemeen voortgezet onderwijs als bedoeld in [artikel 7][ref2] onderscheidenlijk
      [artikel 8 van de Wet op het voortgezet onderwijs][ref3] dan wel een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e, van de Wet educatie en beroepsonderwijs][ref4], en

      c. die

      1°. het onderwijs aan de school gedurende een aaneengesloten periode van ten minste vier weken of een door het
      bevoegd gezag te bepalen kortere periode zonder geldige reden niet meer volgt, of

      2°. bij de school wordt in- of uitgeschreven of van de school wordt verwijderd.

      2 Op verzoek van burgemeester en wethouders van de gemeente waar de betrokkene woon- of verblijfplaats heeft, vindt
      de opgave, bedoeld in het eerste lid, plaats aan burgemeester en wethouders van de contactgemeente, bedoeld in
      [artikel 162b, derde lid][ref5].

      3 Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de toepassing van het eerste lid.


