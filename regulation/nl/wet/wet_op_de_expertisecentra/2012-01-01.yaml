    text: |-
      1 Het bevoegd gezag dat op zijn school niet zijnde een instelling, onderwijs verzorgt aan leerlingen van
      een residentiële instelling wordt in aanmerking gebracht voor bekostiging op grond van [artikel 112][ref1]
      en [artikel 117, zevende lid][ref2], indien het bevoegd gezag met die residentiële instelling een
      samenwerkingsovereenkomst heeft gesloten.

      2 Onder een residentiële instelling als bedoeld in het eerste lid, wordt verstaan een instelling voor
      gehandicaptenzorg, jeugdhulpverlening of jeugdgezondheidszorg dan wel een justitiële jeugdinrichting, waarbij
      behandeling of opvang en onderwijs vanuit één plan noodzakelijk is vanwege de aard of de duur van de behandeling
      of opvang.

      3 Het bevoegd gezag doet Onze minister binnen een maand na de totstandkoming van de overeenkomst dan wel
      beëindiging ervan een afschrift toekomen van de overeenkomst dan wel deelt de datum waarop de overeenkomst is
      beëindigd mee.


