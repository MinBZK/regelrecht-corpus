  - number: '149'
    text: |-
      1 De gemeenteraad kan besluiten tot vermindering van het aantal openbare scholen in de gemeente. Het besluit
      wijst tevens de op te heffen scholen aan en het tijdstip met ingang waarvan de opheffing geschiedt. Opheffing van
      een school vindt niet plaats indien instandhouding van die school noodzakelijk is om voldoende te voorzien in de
      behoefte aan openbaar onderwijs.

      2 Een besluit als bedoeld in het eerste lid wordt genomen voor 16 februari voorafgaand aan het schooljaar waarin de
      opheffing geschiedt, dan wel, indien het besluit meer dan een school betreft, voorafgaand aan het schooljaar waarin
      de eerste van deze scholen wordt opgeheven. Het besluit wordt onderworpen aan de goedkeuring van gedeputeerde
      staten, voor zover het scholen betreft als bedoeld in [artikel 78, eerste lid][ref1], en aan de goedkeuring van
      Onze minister, voor zover het scholen betreft als bedoeld in [artikel 86, eerste lid][ref2]. Gedeputeerde staten
      en Onze minister onthouden hun goedkeuring ten aanzien van het besluit voor zover ten gevolge van de opheffing van
      een school, afhankelijk van de schoolsoort, regionaal, provinciaal dan wel landelijk niet meer voldoende zou zijn
      voorzien in de behoefte aan openbaar onderwijs.

      3 Gedeputeerde staten en Onze minister beslissen voor 16 februari volgend op de in het tweede lid genoemde datum.
      Indien gedeputeerde staten, onderscheidenlijk Onze minister, niet voor 16 februari hebben beslist, wordt het
      desbetreffende besluit van de gemeenteraad geacht te zijn goedgekeurd.

      4 De besluiten van de gemeenteraad, van gedeputeerde staten en van Onze minister, genomen op grond van dit artikel,
      worden bekendgemaakt door een openbare kennisgeving binnen 2 weken na de datum waarop het besluit is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel86
