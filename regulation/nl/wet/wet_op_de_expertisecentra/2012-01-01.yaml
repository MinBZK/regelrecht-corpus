  - number: 66a
    text: Fusies worden niet tot stand gebracht dan nadat daarvoor goedkeuring is verleend door Onze minister.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel66a
  - number: 66b
    text: |-
      1 De rechtspersoon dient dan wel de rechtspersonen gezamenlijk dienen een aanvraag in bij Onze minister voor het
      verkrijgen van de goedkeuring, bedoeld in [artikel 66a][ref1]. De aanvraag gaat vergezeld van:

      a. een door de rechtspersoon dan wel rechtspersonen opgestelde fusie-effectrapportage, en

      b. een schriftelijke verklaring van instemming met de fusie door de medezeggenschapsraden dan wel de
      gemeenschappelijke medezeggenschapsraden, dan wel

      c. de bindende uitspraak van de geschillencommissie, bedoeld in
      [artikel 32, derde lid, van de Wet medezeggenschap op scholen][ref2], dan wel de bindende uitspraak van de
      ondernemingskamer, bedoeld in [artikel 36, derde lid, van de Wet medezeggenschap op scholen][ref3].

      2 De fusie-effectrapportage bevat ten minste een weergave van:

      a. de motieven voor de fusie,

      b. de alternatieven voor de fusie,

      c. het tijdsbestek waarbinnen de fusie zal worden gerealiseerd,

      d. de te bereiken doelen,

      e. de effecten van de fusie op de keuzevrijheid, in het bijzonder de effecten van de fusie op de spreiding en
      omvang van de rechtspersonen en scholen in het voedingsgebied, de onderwijskundige en bestuurlijke diversiteit van
      het onderwijsaanbod in het voedingsgebied,

      f. de kosten en baten van de fusie,

      g. de gevolgen van de fusie voor het personeel en leerlingen, waaronder begrepen de gevolgen voor de voorzieningen,

      h. de wijze waarop over de fusie wordt gecommuniceerd,

      i. de wijze waarop de fusie wordt geëvalueerd, en

      j. een advies van burgemeester en wethouders van de betrokken gemeenten over de wenselijkheid van de voorgestelde
      fusie.

      3 Bij ministeriële regeling wordt een modelformulier voor de fusie-effectrapportage vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel66a
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel36
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel66b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 66a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '32'
      - id: ref3
        bwb_id: BWBR0020685
        artikel: '36'
  - number: 66c
    text: |-
      1 Onze minister kan goedkeuring onthouden indien als gevolg van de fusie de daadwerkelijke variatie van het
      onderwijsaanbod, in het bijzonder ten aanzien van de evenwichtige spreiding van de onderwijsvoorzieningen binnen
      het voedingsgebied, op significante wijze wordt belemmerd.

      2 Onze minister verleent slechts goedkeuring aan een bestuurlijke fusie als bedoeld in [artikel 17][ref1], indien
      daardoor de continuïteit van het openbaar of het bijzonder onderwijs gehandhaafd kan blijven en met de bestuurlijke
      fusie wordt voorkomen dat een of meer daarbij betrokken scholen door toepassing van de [artikelen 147][ref2] en
      [148][ref3] wordt opgeheven of niet meer voor bekostiging in aanmerking komt. Het bevoegd gezag van de betreffende
      school toont dat aan op basis van een prognose van de ontwikkeling van het aantal leerlingen waaruit blijkt dat die
      school binnen een termijn van zes jaar dreigt te worden opgeheven of niet meer te worden bekostigd.

      3 Onze minister laat zich ten aanzien van de goedkeuring, bedoeld in het eerste en tweede lid, adviseren door
      een onafhankelijke adviescommissie, tenzij de noodzaak daartoe ontbreekt. Bij ministeriële regeling wordt bepaald
      wanneer er geen sprake is van de noodzaak bedoeld in de eerste volzin.

      4 Onze minister stelt beleidsregels vast omtrent de uitoefening van de bevoegdheid, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel147
