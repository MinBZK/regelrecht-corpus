  - number: '114'
    text: |-
      1 Eenmaal in de vijf jaar voor 1 oktober stelt Onze minister voor elke instelling een totaalbedrag vast voor de
      materiële voorzieningen ten behoeve van de instandhouding voor het jaar volgend op dat van de vaststelling.

      2 In de beschikking, bedoeld in het eerste lid, kan worden aangegeven, welk deel van het totaalbedrag bedoeld in
      dat lid strekt voor:

      a. administratie, beheer en bestuur en

      b. de materiële instandhouding van watergewenning en bewegingstherapie.

      3 In de beschikking, bedoeld in het eerste lid, wordt aangegeven, welk deel van het totaalbedrag bedoeld in dat lid
      strekt voor:

      a. de programma's van eisen, bedoeld in [artikel 112, eerste lid onder a, b en c][ref1], van een schoolgebouw
      waarvan de gemeente eigenaar is, en

      b. een schoolbad waarvan de gemeente eigenaar is.

      4 Het totaalbedrag voor de materiële voorzieningen ten behoeve van de instandhouding voor het tweede tot en met het
      vijfde jaar volgend op het jaar van de vaststelling, bedoeld in het eerste lid, wordt bepaald door het totaalbedrag
      dat gold voor het aan het desbetreffende jaar voorafgaande jaar, aan te passen aan de prijsmutatie van de netto
      materiële consumptie, zoals opgenomen in de Macro Economische Verkenning, die naar verwachting zal optreden tussen
      het prijsniveau in laatstgenoemd jaar en het prijsniveau in het jaar waarvoor het totaalbedrag geldt.

      5 Indien de miljoenennota, bedoeld in [artikel 13 van de Comptabiliteitswet 2001][ref2], niet of slechts
      gedeeltelijk voorziet in prijsbijstelling in de onderscheiden hoofdstukken van de rijksbegroting voor enig jaar,
      als gevolg waarvan in het voorstel van wet houdende vaststelling van de begroting van de uitgaven en ontvangsten
      van hoofdstuk VIII (Ministerie van Onderwijs, Cultuur en Wetenschap) van de rijksbegroting voor dat jaar geen
      of geen volledige prijsbijstelling kan plaatsvinden in de desbetreffende bedragen van de bekostiging, worden de
      totaalbedragen, bedoeld in het eerste en vierde lid, in overeenstemming daarmee en in afwijking van die leden
      aangepast.

      6 Indien de vastgestelde rijksbegroting van de uitgaven en de ontvangsten van hoofdstuk VIII (Ministerie van
      Onderwijs, Cultuur en Wetenschap) voor een begrotingsjaar ten aanzien waarvan het vijfde lid toepassing heeft
      gevonden, afwijkt van het desbetreffende voorstel van wet op het onderdeel van de prijsbijstelling in de in
      het vijfde lid bedoelde bedragen van de bekostiging, wordt het totaalbedrag, voor dat jaar vastgesteld in
      overeenstemming met de vastgestelde rijksbegroting.

      7 Het vierde tot en met het zesde lid zijn van overeenkomstige toepassing op de in het tweede en derde lid bedoelde
      bedragen.

      8 Indien van de overige onderwijssoorten van het speciaal onderwijs of het voortgezet speciaal onderwijs de
      rijksbekostiging voor de materiële voorzieningen ten behoeve van de instandhouding wordt verminderd, worden de in
      het eerste tot en met vierde lid vastgestelde bedragen dienovereenkomstig verminderd.


