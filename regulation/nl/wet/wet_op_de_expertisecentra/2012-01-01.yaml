  - number: '3'
    text: |-
      1 Speciaal onderwijs en voortgezet speciaal onderwijs mag, onverminderd het derde en vierde lid, slechts worden
      gegeven door degene die:

      a. in het bezit is van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref1],

      b. in het bezit is van:

      1°. een getuigschrift, afgegeven krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2],
      waaruit blijkt dat ten aanzien van dat onderwijs of ten aanzien van een of meer bij
      algemene maatregel van bestuur aan te wijzen onderdelen daarvan of vakken als bedoeld in de
      [artikelen 13, eerste, tweede, vijfde en zesde lid][ref3], en [14, eerste tot en met derde en vijfde lid][ref4],
      is voldaan aan de bekwaamheidseisen die zijn vastgesteld krachtens [artikel 32a, eerste lid][ref5], of krachtens
      [artikel 36, eerste lid, van de Wet op het voortgezet onderwijs][ref6], of

      2°. een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EG-beroepskwalificaties][ref7], verleend ten aanzien van het onderwijs dat
      betrokkene zal geven, of

      3°. een geschiktheidsverklaring als bedoeld in [artikel 162e][ref8], en

      c. niet krachtens rechterlijke uitspraak van het geven van onderwijs is uitgesloten.

      2 Het onderwijs in de onderwijsactiviteiten zintuiglijke oefening en lichamelijke oefening in groepen bestemd voor
      leerlingen vanaf 7 jaar in het speciaal onderwijs kan in afwijking van het eerste lid, onderdeel b. 1°, uitsluitend
      worden gegeven door degene die:

      a. beschikt over een in dat onderdeel b. 1° bedoeld getuigschrift waaruit blijkt dat wordt voldaan aan de
      bekwaamheidseisen die zijn vastgesteld krachtens [artikel 32a, eerste lid][ref9], en

      b. in het bezit is van een bij ministeriële regeling aangewezen getuigschrift dat specifiek is gericht op de
      bekwaamheid tot het geven van dat onderwijs, of onderwijs volgt ter verkrijging van een dergelijk getuigschrift,
      in welk laatste geval betrokkene het onderwijs in deze onderwijsactiviteiten mag geven gedurende ten hoogste twee
      aaneengesloten schooljaren, gerekend vanaf het moment waarop betrokkene het onderwijs ter verkrijging van dit
      getuigschrift voor de eerste maal volgt.

      3 Onze minister kan aan personen die in het bezit zijn van een buiten Nederland behaald bewijsstuk waarmee de
      bekwaamheid wordt aangetoond, de bevoegdheid tot het geven van speciaal onderwijs en voortgezet speciaal onderwijs
      verlenen. Hij kan daarbij voorwaarden en beperkingen stellen.

      4 Onze minister kan met betrekking tot een vak waarvoor geen lerarenopleiding bestaat en ook anderszins niet aan de
      hand van enig bewijsstuk kan worden aangetoond dat betrokkene voldoet aan de bekwaamheidseisen, verklaren dat een
      leraar wordt geacht te voldoen aan de bekwaamheidseisen tot het geven van voortgezet speciaal onderwijs in dat vak.

      5 Bij tijdelijke afwezigheid van een leraar kan ten aanzien van degene die hem vervangt, telkens voor ten hoogste
      1 jaar worden afgeweken van de eisen van benoembaarheid, gesteld in het eerste lid onder b. Indien in een vacature
      niet terstond kan worden voorzien door de benoeming van een leraar die aan de genoemde eisen voldoet, is het
      bepaalde in de vorige volzin van overeenkomstige toepassing. Het bevoegd gezag beschikt over geordende gegevens met
      betrekking tot de toepassing van de eerste en tweede volzin.

      6 Onverminderd het vijfde lid kan ten aanzien van studenten die een duale opleiding volgen als bedoeld
      in [artikel 7.7 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref10] leidend tot een
      getuigschrift als bedoeld in het eerste lid, onder b.1°, en aan die opleiding ten minste 180 studiepunten
      hebben behaald, worden afgeweken van de eisen in het eerste lid onder b, met dien verstande dat het
      tijdelijk dienstverband van de student een periode beslaat die overeenkomt met een volledig dienstverband
      van vijf maanden. De vorige volzin is van overeenkomstige toepassing ten aanzien van studenten die ten
      minste 166 doch nog geen 180 studiepunten hebben behaald, indien door de desbetreffende hogeschool wordt
      verklaard dat de student beschikt over met 180 studiepunten vergelijkbare en tevens voor het dienstverband
      relevante kennis, inzicht en vaardigheden. De toepassing van de vorige volzin vervalt ten aanzien van die
      student die niet binnen vier weken na aanvang van het dienstverband over 180 studiepunten beschikt. De in
      [artikel 7.7, vijfde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref11] bedoelde
      overeenkomst vermeldt tevens de leraar onder wiens verantwoordelijkheid de betrokken student werkzaamheden van
      onderwijskundige aard verricht.


