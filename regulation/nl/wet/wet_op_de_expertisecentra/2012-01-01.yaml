  - number: 162i
    text: |-
      Het bekwaamheidsonderzoek strekt ertoe, vast te stellen of de leraar voldoet aan de in artikel 32a, eerste lid,
      bedoelde bekwaamheidseisen voor het onderwijs waarvoor die eisen zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel162i
  - number: 162j
    text: |-
      1 Het instellingsbestuur van een instelling voor hoger onderwijs die opleidt voor het voldoen aan bekwaamheidseisen
      als bedoeld in artikel 32a, eerste lid, en die zich daartoe bij Onze minister heeft gemeld, is na die melding en
      onder overlegging van een plan van aanpak, bevoegd tot:

      a. het verzorgen of doen verzorgen van de in artikel 162f, tweede lid, onder c, bedoelde scholing en begeleiding,
      voor zover deze verband houden met opleidingen die de instelling verzorgt, of

      b. het uitvoeren of onder zijn verantwoordelijkheid doen uitvoeren van bekwaamheidsonderzoek, voor zover de
      instelling opleidt voor het desbetreffende getuigschrift, dan wel

      c. zowel de onder a als de onder b bedoelde activiteiten.

      2 Het instellingsbestuur van een instelling voor hoger onderwijs die op grond van het eerste lid, onder b, bevoegd
      is tot het uitvoeren van het bekwaamheidsonderzoek, stelt de leraar die zich daartoe heeft gemeld en voor wie
      de scholing en begeleiding zijn afgerond overeenkomstig de in artikel 38a bedoelde overeenkomst, tijdig in de
      gelegenheid deel te nemen aan dat onderzoek.

      3 Het instellingsbestuur kan bepalen dat de aanvrager van het bekwaamheidsonderzoek aan dat bestuur een bijdrage
      is verschuldigd voor uitvoering van dat onderzoek. Bij ministeriële regeling kan voor deze bijdrage een maximum
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel162j
  - number: 162k
    text: |-
      1 Het in artikel 162h en het in artikel 162j bedoelde bestuur dragen zorg voor de kwaliteit van de werkzaamheden
      van de instelling.

      2 Onze minister kan een instelling een of meer van de in artikel 162h of artikel 162j, eerste lid, bedoelde
      bevoegdheden ontnemen indien gebleken is dat de kwaliteit van de uitoefening daarvan tekortschiet, dan wel indien
      niet of niet meer wordt voldaan aan het terzake bij en krachtens deze wet bepaalde. Artikel 6.10, vierde lid, van
      de Wet op het hoger onderwijs en wetenschappelijk onderzoek is van overeenkomstige toepassing ten aanzien van de
      ontneming.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel162k
  - number: 162l
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften vastgesteld voor de uitvoering van
      artikel 162f, tweede lid onder b, en vierde lid.

      2 Tevens kunnen bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur voorschriften worden
      vastgesteld voor de uitvoering van deze afdeling, waaronder in elk geval voorschriften met betrekking tot:

      a. waarborging van de kwaliteit van het geschiktheidsonderzoek en van de instellingen die dat onderzoek uitvoeren,

      b. de scholing en begeleiding, en het bekwaamheidsonderzoek, waaronder voorschriften ter waarborging van de
      kwaliteit, alsmede

      c. de procedure voor het aanvragen van het geschiktheidsonderzoek en voor afgifte van de geschiktheidsverklaring.

      3 De algemene maatregel van bestuur, bedoeld in het eerste lid, wordt aan de beide Kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en niet door
      of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde onderwerp bij de
      wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel162l
  - number: 162m
    text: |-
      Het in artikel 162h en artikel 162j bedoelde bestuur verstrekken aan Onze minister alle inlichtingen die deze nodig
      acht ten behoeve van een goede naleving van deze afdeling. Het bestuur zendt de inspectie van het onderwijs telkens
      na zes maanden een overzicht van in die periode afgegeven geschiktheidsverklaringen en bekwaamheidsonderzoeken
      waaraan met goed gevolg is deelgenomen.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel162m
  - number: '163'
    text: |-
      1 Onze minister kan bepalen dat geen of slechts gedeeltelijke bekostiging wordt verstrekt voor uitgaven die het
      gevolg zijn van schuld of nalatigheid van het bevoegd gezag.

      2 Indien de uitgaven bedoeld in het eerste lid, voor bekostiging door het Rijk in aanmerking komen, treedt het Rijk
      op het moment van een uitdrukkelijk besluit tot bekostiging in alle rechten die het bevoegd gezag ter zake tegen
      derden mocht hebben.

      3 Indien de gemeente een collectieve verzekering heeft afgesloten voor de vergoeding van schade, ontstaan aan
      gebouwen, terreinen of roerende zaken van een door de gemeente bekostigde niet door de gemeente in stand gehouden
      school, heeft het bevoegd gezag van de desbetreffende school jegens de gemeente geen aanspraak op vergoeding van
      dergelijke schade, voor zover die collectieve verzekering de schade dekt.

      4 Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een niet door de gemeente in stand gehouden
      school voor vergoeding door de gemeente in aanmerking komt, treedt de gemeente op het moment van een uitdrukkelijk
      besluit tot vergoeding in alle rechten die het bevoegd gezag ter zake van die schade tegen derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel163
  - number: 164a
    text: |-
      1 Het bevoegd gezag kan het persoonsgebonden nummer van een leerling gebruiken in het verkeer met de leerling op
      wie het nummer betrekking heeft, of, indien de leerling minderjarig of handelingsonbekwaam is, met de ouders van
      deze leerling.

      2 Het bevoegd gezag verstrekt het persoonsgebonden nummer van iedere leerling aan Onze minister, tezamen met de
      volgende gegevens van de leerling:

      a. geslacht, geboortedatum en postcode van de woonplaats;

      b. de datum van in- of uitschrijving;

      c. de soort onderwijs;

      d. de schoolsoort;

      e. het leerjaar of de groep;

      f. indien van toepassing de aanduiding dat het betreft een leerling met een niet-Nederlandse culturele achtergrond
      als bedoeld in artikel 1 van het Formatiebesluit WEC;

      g. het registratienummer van de school of, indien sprake is van een nevenvestiging, het registratienummer daarvan;

      h. bekostigingsindicatie;

      i. de onderwijssoort dan wel het cluster, bedoeld in [artikel 2, vierde lid, onder d][ref1], de begindatum
      van de periode waarvoor de leerling toelaatbaar is verklaard door een commissie voor de indicatiestelling als
      bedoeld in [artikel 28c][ref2], het registratienummer van het regionaal expertisecentrum dat de indicatiestelling
      heeft verricht en, indien het een leerling betreft, bedoeld in [artikel 8a, derde lid, onderdeel b][ref3],
      het registratienummer van de school, bedoeld in de [Wet op het primair onderwijs][ref4], de
      [Wet op het voortgezet onderwijs][ref5] of de [Wet educatie en beroepsonderwijs][ref6], waar de leerling is
      ingeschreven na afloop van de periode gedurende welke de leerling door een commissie voor de indicatiestelling
      toelaatbaar is verklaard tot een bepaalde onderwijssoort; en

      j. indien een leerling is toegelaten met toepassing van [artikel 40, derde lid, tweede volzin][ref7], de indicatie
      voor het soort verblijf.

      3 Bij ministeriële regeling kan een nadere specificatie worden gegeven van de gegevens, bedoeld in het tweede
      en achtste lid, en kan worden bepaald welke van de gegevens, bedoeld in het tweede en achtste lid, niet langer
      behoeven te worden verstrekt. Bij ministeriële regeling kunnen voorts regels worden gesteld omtrent de tijdstippen
      en de wijze van verstrekking van de gegevens, bedoeld in het tweede en achtste lid.

      4 Het bevoegd gezag kan het persoonsgebonden nummer van een leerling, al dan niet tezamen met een of meer van
      de gegevens, bedoeld in het tweede en achtste lid, gebruiken in het verkeer met Onze minister ten behoeve van de
      vaststelling van de bekostiging van de school.

      5 Het bevoegd gezag en het hoofd, bedoeld in [artikel 1, onder d, van de Leerplichtwet 1969][ref8],
      gebruiken het persoonsgebonden nummer van een leerling in contacten met een gemeente in het kader van de
      [Leerplichtwet 1969][ref9], tezamen met de gegevens die noodzakelijk zijn voor het toezicht op de naleving van die
      wet door de gemeente.

      6 Het bevoegd gezag gebruikt bij de opgave aan burgemeester en wethouders, bedoeld in artikel 47a, eerste lid, het
      persoonsgebonden nummer van de betrokkene.

      7 Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in het contact met een andere school of
      een school of instelling voor ander onderwijs ten behoeve van de in- en uitschrijving van die leerling.

      8 Indien de gegevens over de nationaliteit van de leerling niet zijn opgenomen in de gemeentelijke
      basisadministratie persoonsgegevens worden deze gegevens door het bevoegd gezag verstrekt aan Onze minister.

      9 Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in het kader van de uitvoering van
      subsidieregelingen van het Europees Sociaal Fonds.

      10 Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een leerling ter uitvoering van
      [artikel 107, tweede en vijfde lid, van de Vreemdelingenwet 2000][ref10].


