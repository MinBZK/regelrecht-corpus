  - number: 28d
    text: |-
      1 Indien een commissie voor de indicatiestelling op grond van [artikel 28c, elfde lid][ref1],
      de bevoegdheid, bedoeld in dat lid, is ontnomen, wordt het verzoek, bedoeld in
      [artikel 28c, eerste en tweede lid][ref2], [artikel 70b van de Wet op het primair onderwijs][ref3] en
      [artikel 77b van de Wet op het voortgezet onderwijs][ref4] ingediend bij en beoordeeld door een door Onze minister
      ingestelde commissie voor de indicatiestelling.

      2 Onder een leerling die in aanmerking komt voor een leerlinggebonden budget en die toelaatbaar is verklaard tot
      een van de onderwijssoorten in een cluster als bedoeld in [artikel 2, vierde lid onder b of c][ref5], dan wel tot
      het cluster, bedoeld in [artikel 2, vierde lid onder d][ref6], wordt tevens verstaan de leerling ten aanzien van
      wie die beoordeling door de ministeriële commissie is gegeven.

      3 [Artikel 28c][ref7] is van overeenkomstige toepassing op de ministeriële commissie voor de indicatiestelling.


