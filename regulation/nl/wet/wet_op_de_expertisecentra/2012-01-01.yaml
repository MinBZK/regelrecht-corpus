      1 Onze minister kan op aanvraag van een bevoegd gezag besluiten dat, met het oog op de ontwikkeling door scholen
      van instrumenten voor planning en beheer, de [artikelen 120, tweede en derde lid][ref1], [124][ref2], [143][ref3]
      en [144][ref4] niet van toepassing zijn op de bekostiging van de scholen van dat bevoegd gezag. Voor een dergelijk
      besluit komen ten hoogste tien bevoegde gezagsorganen in aanmerking. Onze minister kan een tijdstip vaststellen
      voor welke de aanvragen moeten worden ingediend.

      2 Onze minister bepaalt bij zijn besluit welke regelen en voorwaarden voor de bekostiging zullen gelden in plaats
      van het bepaalde bij of krachtens de artikelen, genoemd in het eerste lid, alsmede de wijze van bekostiging. Onze
      minister kan aan het besluit voorschriften verbinden omtrent het afleggen van rekening en verantwoording van het
      financieel beheer, alsmede, zo nodig in afwijking van het bepaalde krachtens [artikel 168, tweede volzin][ref5],
      omtrent de inrichting van de boekhouding.

      3 Onze minister stelt, na overleg met de aanvrager, een ontwerp op van het besluit en zendt dit ontwerp aan de
      aanvrager. Indien de aanvrager zijn aanvraag niet binnen twee weken na verzending van het ontwerp van het besluit
      door Onze minister heeft ingetrokken, besluit Onze minister overeenkomstig het ontwerp.

      4 Voor zover nodig neemt Onze minister, na overleg met de gemeente of gemeenten die het aangaat, een besluit
      omtrent toepassing van de overschrijdingsregeling, bedoeld in de [artikelen 136 tot en met 142][ref6],
      door de gemeente of gemeenten waar een of meer scholen waarop een besluit als bedoeld in het eerste lid
      van toepassing is, gevestigd zijn. Onze minister kan daarbij afwijken van het bepaalde bij of krachtens de
      [artikelen 136 tot en met 142][ref7].

      5 Het besluit, bedoeld in het eerste lid, heeft een geldigheidsduur van ten hoogste vier jaren.

      6 Indien voor het einde van de geldigheidsduur van het besluit een voorstel van wet tot invoering van
      lumpsumbekostiging voor de personeels- en exploitatiekosten van scholen als bedoeld in deze wet bij de Staten-
      Generaal wordt ingediend, kan de minister het besluit, bedoeld in het eerste lid, na overleg met het bevoegd gezag,
      zodanig aanpassen en in afwijking van het vijfde lid verlengen, dat een goede overgang wordt gewaarborgd naar het
      bekostigingssysteem dat geldt op het moment waarop de periode eindigt waarop het besluit betrekking heeft.


