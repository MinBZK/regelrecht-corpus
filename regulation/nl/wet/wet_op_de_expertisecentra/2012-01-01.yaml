        afdeling: '1'
  - number: '41'
    text: |-
      1 Tot een instelling mogen slechts die kinderen worden toegelaten voor wie vaststaat dat overwegend een
      orthopedagogische en orthodidactische benadering aangewezen is en die voor het op die instelling gegeven onderwijs
      in aanmerking komen.

      2 Het bevoegd gezag van een instelling of de bevoegde gezagsorganen van twee of meer instellingen stelt
      onderscheidenlijk stellen een commissie in die tot taak heeft:

      a. te beoordelen of het kind voor het onderwijs op de instelling waarvoor toelating werd verzocht, in aanmerking
      komt,

      b. het doen van aanbevelingen omtrent het begeleiden van de individuele leerling tijdens zijn verblijf op de
      instelling, teneinde een optimale ontwikkeling van de in de leerling aanwezige mogelijkheden te bewerkstelligen, en

      c. als onderdeel van de onder b genoemde taak, aan het eind van elk schooljaar te adviseren omtrent terugplaatsing
      of overplaatsing van de leerling naar het basisonderwijs, een andere vorm van speciaal onderwijs, het voortgezet
      onderwijs of een vorm van voortgezet speciaal onderwijs.

      De commissie kan bij het uitoefenen van haar taak gebruik maken van bestaande onderzoeksgegevens, indien dergelijke
      gegevens aan haar worden verstrekt. De commissie wordt geleid door de directeur van de instelling waarvoor
      toelating werd verzocht. De commissie bestaat naast de directeur van de instelling ten minste uit:

      1°. een academisch gevormd psycholoog of pedagoog die zich heeft gespecialiseerd in de jeugd- en
      kinderpsychologische richting, onderscheidenlijk in de orthopedagogische richting,

      2°. een maatschappelijk deskundige die in het bezit is van het diploma maatschappelijk werker van een sociale
      academie of van een door Onze minister aangewezen diploma en

      3°. een arts die vertrouwd is met het onderzoek van kinderen voor wie het op de instelling gegeven onderwijs is
      bestemd.

      3 In verband met de beoordeling van kinderen met een niet-Nederlandse culturele achtergrond kan de commissie een
      deskundige op het gebied van de taal en cultuur van het land van oorsprong inschakelen.

      4 Geen kind wordt tot een instelling toegelaten dan na onderzoek door een commissie als bedoeld in het tweede lid.
      De inspecteur is bevoegd het onderzoek bij te wonen.

      5 De onderscheiden functionarissen van de commissie brengen hun bevindingen naar aanleiding van hun onderzoek van
      het kind door middel van een onderzoeksrapport ter kennis van de commissie.

      6 Van het in het vierde lid bedoelde onderzoek maakt de commissie een gemeenschappelijk rapport waarin naast het
      eindoordeel, de onderzoeksrapporten bedoeld in het vijfde lid, en de eventuele overige aan de commissie verstrekte
      documenten worden opgenomen, alsmede de bevindingen van de onderscheiden functionarissen naar aanleiding van het
      overleg in de commissie tot uitdrukking worden gebracht.

      7 De directeur bespreekt de conclusies van het rapport met de ouders, dan wel, indien de leerling meerderjarig en
      handelingsbekwaam is, de leerling. De ouders van een minderjarige of handelingsonbekwame leerling, de leerling die
      de leeftijd van 16 jaar heeft bereikt en de inspecteur krijgen desgewenst inzage in het rapport.

      8 Het bevoegd gezag ziet erop toe dat het gemeenschappelijk rapport slechts wordt gebruikt ten behoeve van het
      verblijf van de betrokken leerling op de instelling. Van het bepaalde in de vorige volzin kan voor wat betreft het
      rapport worden afgeweken voor zover door de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam
      is, de leerling schriftelijk toestemming is verleend.

      9 Het gemeenschappelijk rapport wordt in de instelling bewaard tot ten minste 3 jaar na het tijdstip waarop de
      leerling de instelling heeft verlaten. Het bevoegd gezag draagt er zorg voor dat het gemeenschappelijk rapport
      wordt bewaard op een plaats die uitsluitend toegankelijk is voor het bevoegd gezag en de met het onderzoek belaste
      functionarissen.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel41
  - number: 41a
    text: |-
      1 Op voorstel van de commissie voor de begeleiding en in overeenstemming met de ouders stelt het bevoegd
      gezag van een school voor een leerling die toelaatbaar is verklaard tot een bepaalde onderwijssoort in
      een cluster als bedoeld in [artikel 2, vierde lid onder b of c][ref1], of tot het cluster als bedoeld in
      [artikel 2, vierde lid onder d][ref2], en stelt het bevoegd gezag van een instelling voor elke leerling, voor elk
      schooljaar een handelingsplan op. Indien de inschrijving van een leerling plaatsvindt op of na 1 augustus wordt het
      handelingsplan zo spoedig mogelijk doch uiterlijk een maand na die inschrijving opgesteld.

      2 In het handelingsplan dat betrekking heeft op het laatste schooljaar van de periode gedurende welke de
      leerling door een commissie voor de indicatiestelling toelaatbaar is verklaard tot een bepaalde onderwijssoort
      in een cluster als bedoeld in [artikel 2, vierde lid onder b of c][ref3], of het cluster, bedoeld in
      [artikel 2, vierde lid onder d][ref4], wordt aangegeven dat de voortzetting van de toelating afhankelijk is van een
      nieuwe beoordeling door een commissie voor de indicatiestelling.

      3 Het handelingsplan wordt jaarlijks met de ouders geëvalueerd.

      4 Het eerste lid en het derde lid zijn van overeenkomstige toepassing ten aanzien van een leerling die is
      ingeschreven op basis van de bekostiging, bedoeld in [artikel 117, zevende lid][ref5], en een leerling van een
      instelling.


