  - number: '113'
    text: |-
      1 Indien bijzondere ontwikkelingen in het speciaal onderwijs en het voortgezet speciaal onderwijs daartoe
      aanleiding geven, kunnen bij ministeriële regeling voorschriften worden vastgesteld omtrent het verstrekken van
      aanvullende bekostiging voor de materiële instandhouding.

      2 Indien bijzondere bekostiging op grond van [artikel 120][ref1] wordt toegekend, kan Onze minister bepalen
      dat, voor de periode waarvoor die bijzondere bekostiging wordt toegekend, tevens aanvullende bekostiging voor de
      materiële instandhouding wordt toegekend. Bij ministeriële regeling kunnen nadere regels worden gesteld.

      3 Onze minister kan in verband met de in het eerste lid en het tweede lid bedoelde bekostiging een
      bekostigingsplafond instellen. In dat geval worden bij ministeriële regeling regels omtrent de verdeling
      vastgesteld.


