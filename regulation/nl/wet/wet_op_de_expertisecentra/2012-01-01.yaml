  - number: '17'
    text: |-
      1 Het onderwijs kan een stage omvatten. Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven
      omtrent de stage.

      2 De algemene maatregel van bestuur bedoeld in het eerste lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure
      bedoeld in de eerste 3 volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel17
  - number: '18'
    text: |-
      1 Het onderwijs wordt gegeven in het Nederlands. Daar waar naast de Nederlandse taal, de Friese taal of een
      streektaal in levend gebruik is, kan de Friese taal of de streektaal mede als voertaal bij het onderwijs worden
      gebruikt.

      2 Voor de opvang in en de aansluiting bij het Nederlandse onderwijs van leerlingen met een niet-Nederlandse
      culturele achtergrond kan de taal van het land van oorsprong mede als voertaal bij het onderwijs worden gebruikt,
      overeenkomstig een door het bevoegd gezag vastgestelde gedragscode.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel18
  - number: 18a
    text: |-
      1 Bij het geven van onderwijs aan een leerling die is opgenomen in een ziekenhuis of die in verband met ziekte
      thuis verblijft, kan het bevoegd gezag van een school worden ondersteund.

      2 De ondersteuning bedoeld in het eerste lid wordt verzorgd door:

      a. een educatieve voorziening als bedoeld in
      [artikel 1.4, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] indien de leerling
      is opgenomen in een academisch ziekenhuis of

      b. een schoolbegeleidingsdienst, indien de leerling is opgenomen in een ziekenhuis niet zijnde een academisch
      ziekenhuis dan wel indien de leerling in verband met ziekte thuis verblijft.

      3 De ondersteuning bedoeld in het eerste lid kan in overeenstemming tussen de educatieve voorziening dan wel de
      schoolbegeleidingsdienst en de school waarbij de leerling is ingeschreven, mede het geven van onderwijs aan de
      leerling betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.4
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel18a
