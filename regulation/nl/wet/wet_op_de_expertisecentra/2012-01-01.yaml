  - number: 38a
    text: |-
      1 Degene die beschikt over een in artikel 162e bedoelde geschiktheidsverklaring, het bevoegd gezag dat betrokkene
      benoemt of tewerkstelt zonder benoeming, en het bestuur van een instelling die werkzaamheden uitvoert als bedoeld
      in artikel 162j, eerste lid onder a, sluiten een overeenkomst die hun wederzijdse rechten en plichten omvat
      met betrekking tot het uitvoeren van de noodzakelijk geachte scholing en begeleiding, met inachtneming van de
      beoordeling, bedoeld in artikel 162f, tweede lid, onder c. Indien na het sluiten van de overeenkomst blijkt dat
      de scholing of begeleiding niet volgens de overeenkomst kan worden uitgevoerd, treft het bevoegd gezag tijdig een
      toereikende vervangende voorziening.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de uitvoering van
      het eerste lid, waaronder in elk geval voorschriften ter waarborging van de kwaliteit van het daarin bepaalde.

      3 Tevens worden bij algemene maatregel van bestuur bijzondere zonodig van deze wet afwijkende voorschriften gegeven
      voor gevallen waarin men voor dezelfde werkzaamheden wenst te worden benoemd of tewerkgesteld zonder benoeming aan
      scholen die niet uitgaan van hetzelfde bevoegd gezag.

      4 De algemene maatregel van bestuur, bedoeld in het tweede en derde lid, wordt aan de beide Kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken
      en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel38a
  - number: '39'
    text: |-
      1 De leeftijd waarop het kind tot het speciaal onderwijs mag worden toegelaten is 4 jaar. Indien een kind
      toelaatbaar is verklaard tot een van de onderwijssoorten, bedoeld in [artikel 2, tweede lid onder a of b][ref1],
      kan het worden toegelaten als het de leeftijd van 3 jaar heeft bereikt.

      2 Onverminderd [artikel 40, derde lid][ref2], kan de inspecteur in het belang van het kind toestaan dat een kind
      eerder wordt toegelaten dan in het eerste lid is bepaald.

      3 De leeftijd waarop de leerling het speciaal onderwijs en het voortgezet speciaal onderwijs moet verlaten, is
      20 jaar.

      4 Onverminderd [artikel 40, derde lid en achtste lid][ref3], kan de inspecteur voor een leerling in het voortgezet
      speciaal onderwijs ontheffing verlenen van het bepaalde in het derde lid, indien het voortgezet verblijf op
      de school wenselijk is ter voltooiing van zijn opleiding of van een op verhoging van zijn arbeidsgeschiktheid
      gerichte behandeling. Hij kan zich ten behoeve van zijn beslissing een rapport over de leerling, opgesteld door de
      in [artikel 40b][ref4] dan wel [artikel 41, tweede lid][ref5], bedoelde commissie, doen voorleggen. De commissie
      kan daartoe de betrokken leerling aan een onderzoek onderwerpen. De ontheffing wordt telkens voor de tijd van ten
      hoogste 1 jaar verleend.


