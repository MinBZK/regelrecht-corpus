  - number: 76a
    text: |-
      1 Indien een bevoegd gezag van een school, niet zijnde een instelling, wenst over te gaan tot het inrichten van
      een nevenvestiging of tot het toelaten van leerlingen, die door een commissie voor de indicatiestelling toelaatbaar
      zijn verklaard tot een andere onderwijssoort binnen het regionaal expertisecentrum dan de onderwijssoort die
      door de school wordt verzorgd, dient het bevoegd gezag voor 1 februari een daarop betrekking hebbend verzoek tot
      opneming in het in het derde lid bedoelde plan in bij het regionaal expertisecentrum.

      2 Indien binnen een regionaal expertisecentrum de onderwijssoort, bedoeld in
      [artikel 2, tweede lid, onderdeel h, subonderdeel 1][ref1], niet voorkomt, kan in afwijking van het eerste lid,
      het verzoek, bedoeld in het eerste lid, ook betrekking hebben op het toelaten van leerlingen die door een commissie
      voor de indicatiestelling toelaatbaar zijn verklaard tot genoemde onderwijssoort, tot een andere onderwijssoort
      binnen het cluster.

      3 Voor 1 augustus volgend op de in het eerste lid genoemde datum stelt het regionaal expertisecentrum op basis
      van de in het eerste en het tweede lid bedoelde verzoeken een plan vast met betrekking tot de vestiging van
      nevenvestigingen en tot het toelaten van leerlingen tot scholen van een andere onderwijssoort dan waarvoor de
      leerlingen toelaatbaar zijn verklaard.

      4 Het regionaal expertisecentrum neemt een verzoek slechts in het plan op, indien het daarover overeenstemming
      heeft bereikt met de bevoegde gezagsorganen die deelnemen aan het regionaal expertisecentrum, alle aangrenzende
      regionale expertisecentra van hetzelfde cluster en, voor zover het een nevenvestiging betreft, de gemeente waar die
      nevenvestiging zal worden gevestigd.

      5 Binnen 2 weken na de vaststelling van het plan, wordt het plan tezamen met de gegevens waaruit de in het vierde
      lid bedoelde overeenstemming blijkt, ter goedkeuring aan Onze minister gezonden.

      6 Onze minister beslist voor 1 december daaropvolgend. Indien Onze minister de inrichting van een nevenvestiging
      goedkeurt, vangt de bekostiging van die nevenvestiging aan op 1 augustus volgend op de goedkeuring. Voor de
      bekostiging wordt de nevenvestiging aangemerkt als deel van de school die de nevenvestiging in stand houdt. Indien
      Onze minister de toelating goedkeurt van leerlingen die toelaatbaar zijn verklaard tot een andere onderwijssoort,
      is die toelating mogelijk vanaf 1 augustus volgend op de goedkeuring.

      7 Bij algemene maatregel van bestuur wordt voor scholen waarbij, ingevolge een goedkeuring van Onze minister,
      leerlingen zijn ingeschreven die door een commissie voor de indicatiestelling toelaatbaar zijn verklaard tot een
      andere onderwijssoort, de bekostiging met betrekking tot die leerlingen vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel76a
