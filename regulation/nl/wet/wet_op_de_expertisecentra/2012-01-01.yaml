        artikel: '220'
  - number: '128'
    text: |-
      1 Behoudens het tweede lid, verstrekt het Rijk jaarlijks ten behoeve van de scholen, niet zijnde instellingen,
      aan het bevoegd gezag bekostiging ten behoeve van de materiële instandhouding waarop de programma's van eisen,
      bedoeld in [artikel 111, derde lid][ref1], betrekking hebben, waarbij voor het bevoegd gezag geldt dat indien
      toepassing is gegeven aan [artikel 116, tweede lid][ref2], dan wel indien geen overeenkomst als bedoeld in
      [artikel 116, derde of vierde lid][ref3] tot stand is gekomen, dit bevoegd gezag de bekostiging aan de gemeente dan
      wel aan het desbetreffende bevoegd gezag overdraagt voor zover deze de materiële instandhouding verzorgt.

      2 Het Rijk verstrekt jaarlijks aan de provincie Fryslân bekostiging ten behoeve van de materiële instandhouding,
      voor zover het betreft het onderwijs in de Friese taal, bedoeld in [artikel 13, zesde lid][ref4]. De provincie
      Fryslân draagt zorg voor verdeling van de bekostiging over de betrokken scholen naar rato van het aantal leerlingen
      dat gebruik maakt van dat onderwijs.

      3 Grondslag voor de bekostiging van de in het eerste en tweede lid bedoelde kosten zijn de voor het desbetreffende
      jaar vastgestelde bedragen.

      4 Grondslag voor de bekostiging ten behoeve van de uitgaven voor de voorzieningen, bedoeld in [artikel 111][ref5],
      zijn:

      a. de schoolgrootte die normatief wordt bepaald op basis van het op grond van de algemene maatregel van bestuur,
      bedoeld in [artikel 70][ref6], normatief bepaalde aantal te huisvesten groepen leerlingen naar de maatstaf van het
      aantal leerlingen op 1 oktober van het jaar voorafgaande aan het jaar waarover de bekostiging plaatsvindt dat door
      een commissie voor de indicatiestelling toelaatbaar is verklaard tot een van de onderwijssoorten als bedoeld in
      [artikel 2, tweede lid][ref7], die door de school wordt verzorgd,

      b. het aantal leerlingen op 1 oktober van het jaar voorafgaande aan het jaar waarover de bekostiging plaatsvindt
      dat door een commissie voor de indicatiestelling toelaatbaar is verklaard tot een van de onderwijssoorten als
      bedoeld in [artikel 2, tweede lid][ref8], die door de school wordt verzorgd, en

      c. de omvang van de bekostiging, bedoeld in [artikel 117, zesde, zevende, achtste, negende en tiende lid][ref9].

      5 Voor nieuwe scholen zijn gedurende de periode van 1 augustus tot 1 januari volgend op de opening, grondslag voor
      de bekostiging ten behoeve van de uitgaven voor de voorzieningen, bedoeld in [artikel 111][ref10]:

      a. de schoolgrootte die normatief wordt bepaald op basis van het op grond van de algemene maatregel van bestuur,
      bedoeld in [artikel 70][ref11], normatief bepaalde aantal te huisvesten groepen leerlingen naar de maatstaf van
      het aantal leerlingen op 1 oktober in die periode dat door een commissie voor de indicatiestelling toelaatbaar is
      verklaard tot een van de onderwijssoorten als bedoeld in [artikel 2, tweede lid][ref12], die door de school wordt
      verzorgd,

      b. het aantal leerlingen op 1 oktober in die periode dat door een commissie voor de indicatiestelling toelaatbaar
      is verklaard tot een van de onderwijssoorten als bedoeld in [artikel 2, tweede lid][ref13], die door de school
      wordt verzorgd, en

      c. de omvang van de bekostiging, bedoeld in [artikel 117, zesde, zevende, negende en tiende lid][ref14].

      6 Indien op 16 januari van het jaar waarover de bekostiging plaatsvindt, aanspraak bestond op verhoging van de
      bekostiging bij aanzienlijke tussentijdse toename van het aantal leerlingen per die datum, zijn grondslag voor de
      bekostiging ten behoeve van de uitgaven voor de voorzieningen, bedoeld in [artikel 111][ref15]:

      a. de schoolgrootte die normatief wordt bepaald op basis van het op grond van de algemene maatregel van
      bestuur, bedoeld in [artikel 70][ref16], normatief bepaalde aantal te huisvesten groepen leerlingen naar de
      maatstaf van het aantal leerlingen op 16 januari van het jaar waarover de bekostiging plaatsvindt dat door een
      commissie voor de indicatiestelling toelaatbaar is verklaard tot een van de onderwijssoorten als bedoeld in
      [artikel 2, tweede lid][ref17], die door de school wordt verzorgd,

      b. het aantal leerlingen op 16 januari van het jaar waarover de bekostiging plaatsvindt dat door een
      commissie voor de indicatiestelling toelaatbaar is verklaard tot een van de onderwijssoorten als bedoeld in
      [artikel 2, tweede lid][ref18], die door de school wordt verzorgd, en

      c. de omvang van de bekostiging, bedoeld in [artikel 117, zesde, zevende, negende en tiende lid][ref19].

      7 Ingeval een samenvoeging plaatsvindt tussen 1 januari en 1 oktober daaropvolgend, wordt de bekostiging ten
      behoeve van de uitgaven voor de voorzieningen, bedoeld in [artikel 111][ref20], van alle bij de samenvoeging
      betrokken scholen gehandhaafd tot het einde van het jaar waarin de samenvoeging plaatsvond.

      8 Ingeval een samenvoeging plaatsvindt tussen 1 oktober en 1 januari daaropvolgend, wordt de bekostiging ten
      behoeve van de uitgaven voor de voorzieningen, bedoeld in [artikel 111][ref21], van alle bij de samenvoeging
      betrokken scholen gehandhaafd tot het einde van het jaar waarin de samenvoeging plaatsvond, en wordt de bekostiging
      van de uitgaven voor die voorzieningen voor het jaar volgend op de samenvoeging, gebaseerd op de bekostiging van de
      uitgaven voor die voorzieningen van alle bij de samenvoeging betrokken scholen, zoals die golden op 1 oktober van
      het jaar van samenvoeging.

      9 Het Rijk vergoedt jaarlijks aan het bevoegd gezag van de instellingen het totaalbedrag,
      bedoeld in [artikel 114][ref22], voor dat jaar. Voor zover de gemeente eigenaar is van de
      voorziening, verstrekt het bevoegd gezag van de instelling aan de gemeente de bedragen bedoeld in
      [artikel 114, derde lid, of zevende juncto derde lid][ref23], voor dat jaar.


