  - number: '11'
    text: |-
      1 Het onderwijs wordt afgestemd op de ontwikkelingsmogelijkheden van de leerling. Het wordt zodanig ingericht dat
      de leerling een ononderbroken ontwikkelingsproces kan doorlopen. Zo mogelijk brengt het kinderen tot het volgen van
      gewoon onderwijs in basisscholen of scholen voor voortgezet onderwijs.

      2 Het onderwijs richt zich in elk geval op de emotionele en de verstandelijke ontwikkeling, op het ontwikkelen
      van creativiteit, het verwerven van kennis en van sociale, culturele en lichamelijke vaardigheden. Het onderwijs
      wordt bovendien zodanig ingericht dat daarbij op structurele en herkenbare wijze aandacht wordt besteed aan het
      bestrijden van achterstanden in het bijzonder in de beheersing van de Nederlandse taal.

      3 Het onderwijs:

      a. gaat er mede van uit dat leerlingen opgroeien in een pluriforme samenleving,

      b. is mede gericht op het bevorderen van actief burgerschap en sociale integratie, en

      c. is er mede op gericht dat leerlingen kennis hebben van en kennismaken met verschillende achtergronden en
      culturen van leeftijdgenoten.

      4 Het onderwijs wordt zodanig ingericht dat de leerlingen in de leeftijd van 4 tot en met 12 jaar in een tijdvak
      van 8 schooljaren ten minste 7520 uren onderwijs ontvangen, met dien verstande dat de leerlingen in de eerste 4
      schooljaren ten minste 3520 uren onderwijs en in de laatste 4 schooljaren ten minste 3760 uren onderwijs ontvangen.
      Het onderwijs aan leerlingen jonger dan 4 jaar omvat ten minste 880 uren per schooljaar en aan leerlingen ouder
      dan 12 jaar ten minste 1000 uren per schooljaar. Aan de leerlingen in de laatste 6 schooljaren wordt ten hoogste 7
      weken van het schooljaar 4 dagen per week onderwijs gegeven, die evenwichtig zijn verdeeld over het schooljaar, bij
      een schoolweek van in beginsel niet minder dan 5 dagen onderwijs.

      5 De onderwijsactiviteiten worden evenwichtig over de dag verdeeld.

      6 Het onderwijs wordt zodanig ingericht dat leerlingen die in verband met ziekte thuis verblijven dan wel zijn
      opgenomen in een ziekenhuis, op adequate wijze voldoende onderwijs kunnen genieten.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel11
  - number: '12'
    text: |-
      De inspecteur kan op verzoek van het bevoegd gezag ermee instemmen dat wordt afgeweken van
      [artikel 11, vierde lid, eerste twee volzinnen][ref1].


