  - number: '20'
    text: |-
      Het bevoegd gezag rapporteert over de vorderingen van de leerlingen aan hun ouders dan wel aan de leerlingen zelf
      indien zij meerderjarig en handelingsbekwaam zijn.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel20
  - number: '21'
    text: |-
      1 Het schoolplan bevat een beschrijving van het beleid met betrekking tot de kwaliteit van het onderwijs dat binnen
      de school wordt gevoerd, en omvat in elk geval het onderwijskundig beleid, het personeelsbeleid en het beleid met
      betrekking tot de bewaking en verbetering van de kwaliteit van het onderwijs. Het schoolplan omvat mede het beleid
      ten aanzien van de aanvaarding van materiële bijdragen of geldelijke bijdragen, niet zijnde ouderbijdragen of op
      de onderwijswetgeving gebaseerde bijdragen, indien het bevoegd gezag daarbij verplichtingen op zich neemt waarmee
      de leerlingen binnen de schooltijden en tijdens de activiteiten die worden georganiseerd onder verantwoordelijkheid
      van het bevoegd gezag, alsmede tijdens het overblijven, zullen worden geconfronteerd. In het schoolplan wordt
      aangegeven op welke wijze invulling wordt gegeven aan het openbare karakter onderscheidenlijk de identiteit voor
      zover het betreft een samenwerkingsschool. Het schoolplan kan op een of meer scholen voor speciaal onderwijs, voor
      voortgezet speciaal onderwijs, voor speciaal en voortgezet speciaal onderwijs, en instellingen voor speciaal en
      voortgezet speciaal onderwijs en een of meer scholen voor ander onderwijs van hetzelfde bevoegd gezag betrekking
      hebben.

      2 Het onderwijskundig beleid omvat in elk geval de uitwerking van de wettelijke opdrachten voor het onderwijs
      en van de door het bevoegd gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs in een
      onderwijsprogramma. Daarbij worden tevens betrokken de bijzondere voorzieningen die zijn getroffen voor leerlingen
      of groepen leerlingen.

      3 Het personeelsbeleid, voor zover dat in het schoolplan tot uitdrukking wordt gebracht, omvat in elk geval
      maatregelen met betrekking tot het personeel die bijdragen aan de ontwikkeling en de uitvoering van het
      onderwijskundig beleid alsmede het document inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding,
      bedoeld in artikel 30 van de wet.

      4 Het beleid met betrekking tot de bewaking en verbetering van de kwaliteit van het onderwijs omvat in elk geval:

      a. de wijze waarop het bevoegd gezag bewaakt dat die kwaliteit wordt gerealiseerd,

      b. de wijze waarop het bevoegd gezag vaststelt welke maatregelen ter verbetering van de kwaliteit nodig zijn, en

      c. maatregelen en instrumenten om te waarborgen dat het personeel zijn bekwaamheid onderhoudt.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel21
  - number: '22'
    text: |-
      1 De schoolgids bevat voor ouders en leerlingen informatie over de werkwijze van de school en bevat in elk geval
      informatie over:

      a. de doelen van het onderwijs en de resultaten die met het onderwijsleerproces worden bereikt, met dien verstande
      dat bij algemene maatregel van bestuur voorschriften kunnen worden gegeven met betrekking tot de wijze waarop

      1°. de resultaten worden beschreven die met het onderwijsleerproces worden bereikt, en

      2°. de context wordt vermeld waarin de onder 1° bedoelde resultaten dienen te worden geplaatst.

      b. de bijzondere voorzieningen voor leerlingen of groepen leerlingen,

      c. de wijze waarop de verplichte onderwijstijd wordt benut,

      d. de geldelijke bijdrage, bedoeld in [artikel 40, eerste lid][ref1], waarbij een ontwerp van een overeenkomst voor
      een dergelijke bijdrage, die voldoet aan de eisen die in [artikel 40, eerste lid][ref2], zijn geformuleerd, in de
      schoolgids wordt opgenomen,

      e. de rechten en plichten van de ouders, de leerlingen en het bevoegd gezag, waaronder de informatie over de
      klachtenregeling, bedoeld in [artikel 23][ref3], en de gronden voor vrijstelling van het onderwijs, bedoeld in
      [artikel 46, tweede lid][ref4],

      f. de wijze waarop het bevoegd gezag omgaat met de in artikel 21, eerste lid, omschreven bijdragen,

      g. het regionaal expertisecentrum waarbij het bevoegd gezag van de school is aangesloten,

      h. het beleid met betrekking tot de veiligheid, en

      i. het verzuimbeleid;

      i. de wijze waarop invulling wordt gegeven aan het openbare karakter onderscheidenlijk de identiteit voor zover het
      betreft een samenwerkingsschool.

      2 Het bevoegd gezag reikt de schoolgids uit aan de ouders dan wel de meerderjarige en handelingsbekwame leerling
      bij de inschrijving en jaarlijks na de vaststelling van de schoolgids.

      3 De algemene maatregel van bestuur, bedoeld in het eerste lid, onder a, wordt aan de beide kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en
      gedurende die termijn niet door of namens een der kamers de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
