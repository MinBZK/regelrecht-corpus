  - number: '129'
    text: |-
      1 Jaarlijks voor 1 maart kan Onze minister verhoging van de bekostiging worden gevraagd, indien op grond van
      bijzondere omstandigheden van de school, niet zijnde een instelling, in dat jaar, het totale bedrag niet voldoende
      is voor de noodzakelijke uitgaven van de school, niet zijnde een instelling.

      2 Een verzoek als bedoeld in het eerste lid, kan slechts worden gedaan door het bevoegd gezag voor zover het
      betreft de materiële instandhouding waarop de programma's van eisen, bedoeld in [artikel 112, eerste lid][ref1],
      betrekking hebben. In afwijking van de vorige volzin kan ingeval [artikel 116, tweede, derde of vierde lid][ref2],
      is toegepast, het bevoegd gezag dat dan wel de gemeente die de materiële instandhouding geheel of gedeeltelijk
      verzorgt, het verzoek indienen.

      3 Onze minister wijst het verzoek in elk geval af indien:

      a. in het jaar waarvoor de programma's van eisen zijn vastgesteld, het totaal van de noodzakelijke uitgaven voor de
      materiële instandhouding van de school niet ten minste 5% meer zal bedragen dan het totaal van de uit 's Rijks kas
      daarvoor te verstrekken inkomsten,

      b. de bijzondere omstandigheden het gevolg zijn van een bij algemene maatregel van bestuur aan te geven
      omstandigheid of afwijking van de omvang van de componenten van de voorziening ten aanzien waarvan de bijzondere
      omstandigheden zouden bestaan,

      c. de bijzondere omstandigheid het gevolg is van een verschil tussen het prijsniveau in enig jaar en de op grond
      van [artikel 111][ref3] aangepaste bedragen, of

      d. het bevoegd gezag dat of de gemeente die het verzoek heeft ingediend, niet aantoont dat het de bijzondere
      omstandigheden niet op enigerlei wijze had kunnen voorkomen.

      4 Een verzoek als bedoeld in het eerste lid gaat vergezeld van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4], van de juistheid van de gegevens die bij
      het verzoek zijn gevoegd.

      5

      6 Onze minister besluit binnen drie maanden. Indien technisch onderzoek zulks noodzakelijk maakt, kan Onze minister
      deze termijn eenmaal met ten hoogste zes maanden verdagen.

      7 Onze minister kan in verband met de in het eerste lid bedoelde verhoging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.


