    text: |-
      1 Indien de inspecteur van oordeel is dat op een school een leerling is geplaatst die daar ingevolge
      [artikel 40][ref1] dan wel [artikel 41, eerste lid][ref2], niet had mogen worden toegelaten, verzoekt hij het
      bevoegd gezag deze leerling te verwijderen.

      2 Bij weigering van het bevoegd gezag te voldoen aan een verzoek als bedoeld in het eerste lid, roept de inspecteur
      de beslissing van Onze minister in.

      3 Indien de inspecteur van oordeel is dat het in [artikel 41, vierde lid][ref3], bedoelde onderzoek niet voldoet
      aan redelijke eisen, treedt hij in overleg met het bevoegd gezag onder mededeling van de zijns inziens aan te
      brengen wijzigingen. Indien dit overleg niet tot overeenstemming leidt, roept de inspecteur de beslissing van Onze
      minister in.


