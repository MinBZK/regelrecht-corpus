      1 De accountant die door Onze minister is belast met het onderzoek van de controlerapporten, bedoeld in
      [artikel 157, vierde lid][ref1], en met het onderzoek van de juistheid van de bekostigingsgegevens, bedoeld
      in [artikel 158][ref2], heeft met het oog op het verrichten van dat onderzoek toegang tot de plaats waar de
      desbetreffende boeken en bescheiden worden bewaard. Aan de accountant wordt desgevraagd inzage in de boeken en
      bescheiden gegeven en worden alle inlichtingen verstrekt die deze voor de uitvoering van zijn taak nodig oordeelt.

      2 Onze minister kan naast het accountantsonderzoek, bedoeld in het eerste lid, een onderzoek instellen of
      doen instellen naar de rechtmatigheid van het beheer op grond van de beschikbare controlerapporten, bedoeld
      in [artikel 157, vierde lid][ref3], en de bekostigingsgegevens, bedoeld in [artikel 158][ref4], naar eventuele
      wijziging van de criteria, bedoeld in [artikel 28c, achtste lid][ref5], en naar eventuele wijziging van de
      procedure, bedoeld in [artikel 28c][ref6] van deze wet, [artikel 70b van de Wet op het primair onderwijs][ref7]
      en [artikel 77b van de Wet op het voortgezet onderwijs][ref8]. Het bevoegd gezag onderscheidenlijk het regionaal
      expertisecentrum onderscheidenlijk de commissie voor de indicatiestelling verstrekt aan degene die door Onze
      minister met het onderzoek is belast, alle inlichtingen die deze voor de uitvoering van zijn taak nodig oordeelt en
      geeft desgevraagd inzage in de boeken en bescheiden.


