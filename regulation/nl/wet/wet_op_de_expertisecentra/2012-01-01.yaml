    text: |-
      1 Indien de bekostiging van de laatste bijzondere school van een bevoegd gezag wordt beëindigd of het bevoegd
      gezag tot de opheffing van de laatste school beslist, dan wel de laatste openbare school wordt opgeheven, stort het
      bevoegd gezag de niet bestede bekostigingsbedragen terug in de desbetreffende overheidskas.

      2 Het exploitatietekort blijft in de gevallen, bedoeld in het eerste lid, voor rekening van het bevoegd gezag.

      3 Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de wijze waarop het
      exploitatieoverschot, bedoeld in het eerste lid, wordt berekend.
