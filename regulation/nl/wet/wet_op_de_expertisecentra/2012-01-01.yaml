  - number: 28c
    text: |-
      1 De commissie voor de indicatiestelling beoordeelt op verzoek van de ouders van een leerling, die zijn woonplaats
      heeft in het gebied van het regionaal expertisecentrum, of een leerling op basis van de in het achtste lid bedoelde
      criteria:

      a. in aanmerking komt voor een leerlinggebonden budget indien de leerling wordt dan wel is ingeschreven bij een
      school als bedoeld in de [Wet op het primair onderwijs][ref1] of de [Wet op het voortgezet onderwijs][ref2] alsmede

      b. toelaatbaar is tot een van de onderwijssoorten in een cluster als bedoeld in
      [artikel 2, vierde lid onder b of c][ref3], waarvoor de commissie voor de indicatiestelling werkzaam is en zo ja,
      tot welke onderwijssoort, dan wel toelaatbaar is tot het cluster, bedoeld in [artikel 2, vierde lid onder d][ref4],
      waarvoor de commissie voor de indicatiestelling werkzaam is.

      2 Het oordeel van de commissie voor de indicatiestelling, bedoeld in het eerste lid onder a en b, heeft betrekking
      op een bij algemene maatregel van bestuur per onderwijssoort bepaald aantal schooljaren, waarbij kan worden bepaald
      dat van dat aantal wordt afgeweken op grond van leerlingkenmerken. Indien het oordeel in de loop van een schooljaar
      wordt gegeven, wordt de periode tot de eerste dag van het eerstvolgende schooljaar toegevoegd aan de in de eerste
      volzin bedoelde periode. Voor het verstrijken van de periode, bedoeld in de eerste volzin, in voorkomende gevallen
      verlengd overeenkomstig de tweede volzin, beoordeelt de commissie voor de indicatiestelling op verzoek van de
      ouders of de leerling nog voldoet aan de criteria, bedoeld in het achtste lid.

      3 Indien de commissie voor de indicatiestelling op basis van de beschikbare informatie nog niet tot een
      oordeel over de toelaatbaarheid kan komen, kan de commissie het bevoegd gezag van een school verzoeken
      te adviseren over de toelaatbaarheid van een leerling tot een van de onderwijssoorten in een cluster
      als bedoeld in [artikel 2, vierde lid onder b of c][ref5], dan wel tot het cluster als bedoeld in
      [artikel 2, vierde lid onder d][ref6], waarvoor de commissie voor de indicatiestelling werkzaam is. Teneinde
      dit advies mogelijk te maken wordt de leerling gedurende een periode van korter dan een schooljaar toegelaten
      tot een school waarvan het bevoegd gezag zich tot advisering bereid heeft verklaard in voorkomend geval onder
      handhaving van zijn inschrijving bij de school, bedoeld in de [Wet op het primair onderwijs][ref7] dan wel de
      [Wet op het voortgezet onderwijs][ref8]. Voor de afloop van de in de vorige volzin bedoelde periode zendt het
      bevoegd gezag het advies, vergezeld van een verslag van de bevindingen aan de commissie voor de indicatiestelling.
      Indien de commissie voor de indicatiestelling niet binnen de in de tweede volzin genoemde periode, een beslissing
      heeft genomen, wordt de termijn, genoemd in de tweede volzin met 6 weken verlengd.

      4 Het verzoek, bedoeld in het eerste en het tweede lid, wordt bij de commissie voor de indicatiestelling
      ingediend onder overlegging van een volledig ingevuld aanmeldingsformulier dat door die commissie wordt verstrekt.
      Het aanmeldingsformulier bevat in elk geval de adresgegevens van de leerling en zijn ouders, de naam en de
      geboortedatum van de leerling, de onderwijssoort waarvoor indicatie wordt gevraagd, en indien eerder een indicatie
      is verkregen, de onderwijssoort dan wel het cluster, bedoeld in [artikel 2, vierde lid, onder d][ref9], waartoe de
      leerling toelaatbaar was verklaard. Bij algemene maatregel van bestuur wordt bepaald welke gegevens en verklaringen
      bij het aanmeldingsformulier dienen te worden gevoegd en de wijze waarop zij dienen te worden aangeleverd. In
      voorkomend geval informeert de commissie voor de indicatiestelling de ouders welke gegevens en verklaringen
      ontbreken en op welke wijze zij zijn te verkrijgen.

      5 De commissie voor de indicatiestelling zendt een afschrift van het aanmeldingsformulier en een weergave van de
      gegevens en verklaringen, bedoeld in het vierde lid, tezamen met een afschrift van het oordeel aan de inspectie.

      6 Het regionaal expertisecentrum ziet erop toe dat de in het vijfde lid bedoelde gegevens en verklaringen
      slechts worden gebruikt ten behoeve van de beoordeling, bedoeld in het eerste lid, en het toezicht daarop door
      de inspectie.

      7 De gegevens en verklaringen worden bij het regionaal expertisecentrum bewaard tot drie jaar na afloop van de
      periode waarvoor de leerling toelaatbaar is verklaard tot een van de onderwijssoorten binnen het cluster of tot het
      cluster waartoe het regionaal expertisecentrum behoort dan wel tot drie jaar na de beoordeling door de commissie
      voor de indicatiestelling indien de leerling niet toelaatbaar is verklaard tot een van de onderwijssoorten binnen
      het cluster of tot het cluster waartoe het regionaal expertisecentrum behoort. Het regionaal expertisecentrum
      draagt er zorg voor dat de gegevens en verklaringen worden bewaard op een plaats die uitsluitend toegankelijk is
      voor het regionaal expertisecentrum en de met het onderzoek belaste functionarissen.

      8 Bij algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot de door de commissie
      voor de indicatiestelling in acht te nemen criteria voor het in aanmerking komen voor een leerlinggebonden
      budget alsmede het toelaatbaar verklaren tot een onderwijssoort in een cluster als bedoeld in
      [artikel 2, vierde lid onder b of c][ref10], en tot het cluster, bedoeld in [artikel 2, vierde lid onder d][ref11],
      waarbij onderscheid kan worden gemaakt tussen toelaatbaarheid tot het speciaal onderwijs en het voortgezet speciaal
      onderwijs.

      9 Met betrekking tot een leerling die toelaatbaar is verklaard tot het cluster, bedoeld in
      [artikel 2, vierde lid onder d][ref12], geeft de commissie voor de indicatiestelling de ouders tevens een advies
      over de te kiezen school binnen het gebied van het regionaal expertisecentrum.

      10 Een beslissing van de commissie voor de indicatiestelling als bedoeld in het eerste en
      het tweede lid en een beslissing van bedoelde commissie die samenhangt met de toepassing van
      het derde lid, wordt aangemerkt als een beschikking van een bestuursorgaan als bedoeld in
      [artikel 1:1, eerste lid, van de Algemene wet bestuursrecht][ref13]. Deze beschikking is geen besluit als bedoeld
      in [artikel 8:4 onder e, van de Algemene wet bestuursrecht][ref14].

      11 Indien de commissie voor de indicatiestelling zich bij haar beoordeling niet houdt aan de voorschriften, bedoeld
      in het achtste lid, kan Onze minister bepalen dat de commissie voor de indicatiestelling niet langer bevoegd is tot
      het geven van beoordelingen op grond van dit artikel.

      12 Indien redelijkerwijs kan worden verwacht dat de grond voor ontneming van de bevoegdheid, bedoeld in het
      elfde lid, niet langer aanwezig is, kan Onze minister besluiten de bevoegdheid opnieuw aan de commissie voor de
      indicatiestelling toe te kennen.


