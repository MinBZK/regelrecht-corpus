  - number: 28f
    text: |-
      Een krachtens de [artikelen 28b][ref1] en [28c][ref2] vastgestelde algemene maatregel van bestuur wordt aan
      de Tweede Kamer der Staten-Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat 4 weken na de
      overlegging zijn verstreken bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens
      de kamer de wens te kennen wordt gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt
      geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend. De vorige 3
      volzinnen zijn niet van toepassing, voor zover het ontwerp van een algemene maatregel van bestuur voordien aan
      de Tweede Kamer der Staten-Generaal is voorgelegd en door of namens de kamer te kennen is gegeven dat van de
      procedure, bedoeld in de vorige 3 volzinnen, kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel28f
