  - number: 28j
    text: |-
      1 Een rechtspersoon die een openbare school in stand houdt, en een rechtspersoon die een bijzondere school in
      stand houdt, kunnen de instandhouding van hun school overdragen aan een stichting waarvan het statutaire doel in
      ieder geval is het in stand houden van een samenwerkingsschool, onverminderd de [artikelen 28, derde lid][ref1],
      [50, derde lid][ref2], en [51, vijfde lid][ref3]. Een samenwerkingsschool is een school waarin zowel openbaar
      onderwijs als bijzonder onderwijs wordt aangeboden. De [artikelen 52][ref4] en [58][ref5] zijn van overeenkomstige
      toepassing.

      2 Een samenwerkingsschool kan uitsluitend tot stand komen indien daardoor de continuïteit van het openbaar of het
      bijzonder onderwijs gehandhaafd kan blijven en met totstandkoming van een samenwerkingsschool wordt voorkomen dat
      een of meer daarbij betrokken scholen door toepassing van de [artikelen 147][ref6] en [148][ref7] wordt opgeheven
      of niet meer voor bekostiging in aanmerking komt. Het bevoegd gezag van de betreffende school toont dat aan op
      basis van een prognose van de ontwikkeling van het aantal leerlingen waaruit blijkt dat die school binnen een
      termijn van zes jaar dreigt te worden opgeheven of niet meer te worden bekostigd.

      3 Een samenwerkingsschool is toegankelijk voor alle leerlingen zonder onderscheid naar godsdienst of
      levensovertuiging.

      4 Het personeel dat werkzaam is aan de samenwerkingsschool, en niet is tewerkgesteld zonder benoeming, wordt
      benoemd krachtens arbeidsovereenkomst naar burgerlijk recht.

      5 De rechtspersoon die de instandhouding van de bijzondere school heeft overgedragen, of zijn rechtsopvolger, dan
      wel een daartoe aangewezen rechtspersoon houdt toezicht op de identiteit, voor zover het betreft het bijzonder
      onderwijs in de samenwerkingsschool, overeenkomstig hetgeen is bepaald in de statuten van de stichting die de
      samenwerkingsschool in stand houdt.

      6 De statuten voorzien in ieder geval in een regeling omtrent:

      a. het doel van de stichting, waarin in elk geval is opgenomen het geven van openbaar onderwijs en bijzonder
      onderwijs binnen een samenwerkingsschool,

      b. de samenstelling, werkwijze en inrichting van het bestuur van de stichting, met dien verstande dat in de
      statuten wordt voorzien in een evenwichtige zeggenschapsverdeling wat betreft openbaar onderwijs onderscheidenlijk
      bijzonder onderwijs dat wordt gegeven binnen de samenwerkingsschool,

      c. de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat:

      1° het bestuur van de stichting die de samenwerkingsschool in stand houdt, wordt benoemd door de gemeenteraad van
      de gemeente waar de samenwerkingsschool gevestigd is, en de rechtspersoon, bedoeld in het vijfde lid, en

      2° dat het bestuur van de stichting die de samenwerkingsschool in stand houdt, niet bestaat uit personen die deel
      uitmaken van het gemeentebestuur van de gemeente en de rechtspersoon, bedoeld in het vijfde lid,

      d. de wijze waarop door de gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd is, en de
      rechtspersoon, bedoeld in het vijfde lid, toezicht op het bestuur van de samenwerkingsschool wordt uitgeoefend,
      waaronder voor wat betreft het openbaar onderwijs in ieder geval wordt begrepen een jaarlijks door het bestuur
      van de stichting aan de gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd is, uit te brengen
      verslag waarbij in ieder geval aandacht wordt geschonken aan het beleid ten aanzien van het openbaar onderwijs in
      de samenwerkingsschool,

      e. de termijn waarvoor de bestuursleden worden benoemd,

      f. de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en

      g. de bevoegdheid de stichting te ontbinden.

      7 Overdracht, opheffing of fusie van de samenwerkingsschool en wijziging van de statuten van de stichting die de
      samenwerkingsschool in stand houdt, is slechts mogelijk na instemming van de gemeenteraad van de gemeente waar de
      samenwerkingsschool gevestigd is, en de rechtspersoon, bedoeld in het vijfde lid.

      8 De voorschriften van deze wet en van andere wetten die het speciaal onderwijs of voortgezet speciaal onderwijs
      betreffen, alsmede de daarop gebaseerde regelingen, voor zover die voorschriften en regelingen betrekking hebben
      op een bijzondere school, zijn van overeenkomstige toepassing op een samenwerkingsschool als bedoeld in het eerste
      lid, tenzij het tegendeel blijkt. De Algemene wet bestuursrecht is niet van toepassing voor zover het beslissingen
      betreft van de rechtspersoon die de samenwerkingsschool in stand houdt.

      9 In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover het
      openbaar onderwijs betreft, neemt de gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd is, de
      maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het openbaar
      onderwijs betreft. De bedoelde maatregelen kunnen tevens worden getroffen door de rechtspersoon, bedoeld in het
      vijfde lid, voor zover het bijzonder onderwijs betreft. De feitelijke samenwerking wordt beëindigd op 1 augustus
      van het jaar na een daartoe door de gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd is, en de
      rechtspersoon, bedoeld in het vijfde lid, gezamenlijk genomen besluit.

      10 Een geschil tussen een bestuursorgaan van de gemeente en de rechtspersoon, bedoeld in het vijfde lid,
      omtrent het toezicht op de samenwerkingsschool en omtrent de uitlegging van de statuten van de stichting die de
      samenwerkingsschool in stand houdt, wordt voorgelegd aan een geschillencommissie, bestaande uit een of meer door
      de gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd is, en de rechtspersoon in onderling overleg
      aangewezen deskundigen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel51
