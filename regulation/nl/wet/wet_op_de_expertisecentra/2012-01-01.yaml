  - number: '98'
    text: |-
      1 Een voorziening in de huisvesting wordt slechts geweigerd, indien:

      a. de gewenste voorziening geen voorziening is in de zin van [artikel 90][ref1],

      b. de gewenste voorziening niet gerechtvaardigd is op grond van de aard en de omvang van de voorzieningen waarover
      de school reeds beschikt, voor zover deze uit de openbare kas zijn bekostigd, gelet op de normen, bedoeld in
      [artikel 100, eerste lid, onderdeel b][ref2],

      c. de gewenste voorziening niet gerechtvaardigd is op grond van de te verwachten ontwikkeling van
      het aantal leerlingen of onderwijskundige ontwikkelingen, zulks met inachtneming van het bepaalde in
      [artikel 100, eerste lid, onderdelen c en d][ref3],

      d. op andere wijze dan wordt gewenst redelijkerwijs in de behoefte aan huisvesting kan worden voorzien, onder meer
      doordat binnen redelijke afstand van de gewenste plaats van de voorziening gebruik dan wel medegebruik mogelijk is,
      of een reeds voor bekostiging in aanmerking gebracht gebouw of deel daarvan beschikbaar komt,

      e. het bekostigingsplafond, bedoeld in [artikel 91][ref4], niet toereikend is voor de te verstrekken voorzieningen
      voor scholen als bedoeld in het eerste lid, onderdelen a tot en met d, van dat artikel, of

      f. de gewenste voorziening anders dan op grond van de onderdelen b tot en met d niet noodzakelijk is.

      2 Een voorziening in de huisvesting kan tevens worden geweigerd, indien de voorziening als gevolg van het
      verwijtbaar nalaten van noodzakelijk onderhoud in een slechte bouwkundige staat verkeert of indien de voorziening
      nodig is voor herstel van schade die is veroorzaakt door schuld of toedoen van het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel100
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel91
