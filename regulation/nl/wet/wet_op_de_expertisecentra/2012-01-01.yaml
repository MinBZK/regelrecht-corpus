  - number: '139'
    text: |-
      1 In het jaar volgend op de definitieve vaststelling, bedoeld in [artikel 138, zevende lid][ref1], wordt het
      overschrijdingsbedrag vastgesteld waarop het bevoegd gezag van een niet door de gemeente in stand gehouden school,
      die gedurende een of meer jaren van het desbetreffende tijdvak in de gemeente was gevestigd, aanspraak heeft.
      Dit overschrijdingsbedrag wordt vastgesteld door het percentage, bedoeld in [artikel 138, zevende lid][ref2],
      te vermenigvuldigen met het totaal van de ontvangsten van een niet door de gemeente in stand gehouden school
      dat is gebaseerd op de bedragen die krachtens de [artikelen 111][ref3] en [131][ref4], dan wel indien het een
      instelling betreft, krachtens de [artikelen 114][ref5] en [131][ref6] voor het desbetreffende tijdvak zijn
      vastgesteld. Bij het vaststellen van het totaal van de ontvangsten, bedoeld in de tweede volzin, blijven buiten
      beschouwing de ontvangsten op grond van de programma's van eisen voor administratie, beheer en bestuur, bedoeld
      in [artikel 112, eerste lid onder e][ref7], de ontvangsten voor de materiële instandhouding van het onderwijs in
      lichamelijke oefening en van watergewenning en bewegingstherapie dan wel, indien het een instelling betreft, de
      bedragen voor de in [artikel 114, tweede lid][ref8], bedoelde voorzieningen en de ontvangsten.

      2 Indien aan het bevoegd gezag van een niet door de gemeente in stand gehouden school een deel van de bekostiging
      voor personeelskosten is overgedragen door een ander bevoegd gezag, wordt bij het vaststellen van het totaal van de
      ontvangsten, bedoeld in het eerste lid, tweede volzin, dat deel aangemerkt als ontvangsten.

      3 Indien de gemeente voor een niet door de gemeente in stand gehouden school het deel van de materiële
      instandhouding waarop de programma's van eisen, bedoeld in [artikel 112, eerste lid onder a, b en c][ref9], dan
      wel, indien het een instelling betreft, de bedragen, voor de in [artikel 114, derde lid onder a][ref10], bedoelde
      voorzieningen betrekking hebben, geheel of gedeeltelijk verzorgt, wordt een overeenkomstig deel van de ontvangsten
      in mindering gebracht op het totaal van de ontvangsten voor de betrokken school waarover ingevolge het eerste lid
      het overschrijdingsbedrag wordt vastgesteld.

      4 Voor de vaststelling bedoeld in [artikel 138, eerste en zevende lid][ref11], en [artikel 139, eerste lid][ref12],
      worden met betrekking tot een school voor speciaal en voortgezet speciaal onderwijs de bedragen die voor een
      zodanige school zijn uitgegeven dan wel ontvangen, toegerekend aan het speciaal onderwijs, onderscheidenlijk
      het voortgezet speciaal onderwijs, naar rato van het aantal leerlingen dat in het desbetreffende kalenderjaar in
      aanmerking kwam voor het volgen van speciaal onderwijs, onderscheidenlijk voortgezet speciaal onderwijs.

      5 Voor de vaststelling bedoeld in [artikel 138, eerste en zevende lid][ref13], en [artikel 139, eerste lid][ref14],
      worden met betrekking tot een school waaraan een of meer afdelingen zijn verbonden, de bedragen die voor een
      zodanige school, de afdeling of afdelingen daaronder begrepen, zijn uitgegeven dan wel ontvangen, toegerekend
      aan de school, onderscheidenlijk de afdeling of afdelingen, naar rato van het aantal leerlingen dat in het
      desbetreffende kalenderjaar in aanmerking kwam voor het volgen van onderwijs aan de school, onderscheidenlijk de
      desbetreffende afdeling.

      6 Indien een gemeente gedurende een gedeelte van het desbetreffende tijdvak een of meer scholen in stand houdt,
      wordt voor het vaststellen van het overschrijdingsbedrag, bedoeld in het eerste lid, uitgegaan van het totaal van
      de ontvangsten van een niet door de gemeente in stand gehouden school over een overeenkomstig gedeelte van het
      desbetreffende tijdvak.


