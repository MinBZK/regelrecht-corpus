  - number: '2'
    text: |-
      1 Het speciaal onderwijs en het voortgezet speciaal onderwijs is bestemd voor kinderen voor wie vaststaat dat
      overwegend een orthopedagogische en orthodidactische benadering aangewezen is.

      2 Het speciaal onderwijs en het voortgezet speciaal onderwijs wordt verdeeld in onderwijs aan:

      a. dove kinderen;

      b. slechthorende kinderen;

      c. kinderen met ernstige spraakmoeilijkheden die niet tevens behoren tot de onder a of b bedoelde kinderen;

      d. visueel gehandicapte kinderen;

      e.

      f. lichamelijk gehandicapte kinderen;

      g.

      h. langdurig zieke kinderen

      1°. met een lichamelijke handicap

      2°. anders dan met een lichamelijke handicap;

      i.

      j. zeer moeilijk lerende kinderen;

      k. zeer moeilijk opvoedbare kinderen;

      l.

      m. kinderen in scholen verbonden aan pedologische instituten;

      n. meervoudig gehandicapte kinderen;

      3 Onder pedologische instituten worden verstaan instituten die een binding bezitten met een Nederlandse
      universiteit of de wetenschappelijke begeleiding van het onderwijs verzorgen aan scholen voor speciaal onderwijs.

      4 Met betrekking tot de onderwijssoorten, genoemd in het tweede lid, worden de volgende clusters onderscheiden:

      a. cluster 1: onderwijs aan visueel gehandicapte kinderen dan wel meervoudig gehandicapte kinderen met deze
      handicap,

      b. cluster 2: onderwijs aan dove kinderen, slechthorende kinderen en kinderen met ernstige spraakmoeilijkheden dan
      wel meervoudig gehandicapte kinderen met een van deze handicaps,

      c. cluster 3: onderwijs aan langdurig zieke kinderen met een lichamelijke handicap, lichamelijk gehandicapte
      kinderen en zeer moeilijk lerende kinderen dan wel meervoudig gehandicapte kinderen met een van deze handicaps en

      d. cluster 4: onderwijs aan langdurig zieke kinderen anders dan met een lichamelijke handicap, zeer moeilijk
      opvoedbare kinderen en kinderen in scholen verbonden aan pedologische instituten.

      5 Bij algemene maatregel van bestuur wordt voor wat betreft het onderwijs aan meervoudig gehandicapte kinderen voor
      de clusters, bedoeld in het vierde lid onder a, b of c, bepaald welke combinaties van handicaps kunnen voorkomen.

      6 Een krachtens het vijfde lid vastgestelde algemene maatregel van bestuur wordt aan de Tweede Kamer der Staten-
      Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat 4 weken na de overlegging zijn verstreken bij
      koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens de kamer de wens te kennen wordt
      gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een
      daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend. De vorige 3 volzinnen zijn niet van toepassing,
      voor zover het ontwerp van een algemene maatregel van bestuur voordien aan de Tweede Kamer der Staten-Generaal is
      voorgelegd en door of namens de kamer te kennen is gegeven dat van de procedure, bedoeld in de vorige 3 volzinnen,
      kan worden afgeweken.
