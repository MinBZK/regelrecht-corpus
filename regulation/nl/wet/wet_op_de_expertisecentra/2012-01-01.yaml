  - number: '131'
    text: |-
      1 Met inachtneming van de [artikelen 117][ref1] en [118][ref2] verstrekt het Rijk jaarlijks aan het bevoegd gezag
      een bekostigingsbedrag ten behoeve van de personeelskosten.

      2 In geval van het verstrekken van bijzondere bekostiging als bedoeld in [artikel 120][ref3] verstrekt het Rijk aan
      het desbetreffende bevoegd gezag het bedrag van deze bekostiging.

      3 Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot het betalen van
      het in de eerste volzin bedoelde bedrag.

      4 Op het in het eerste en tweede lid bedoelde bedrag worden op een bij ministeriële regeling vast te stellen wijze
      in mindering gebracht de inkomsten die het bevoegd gezag dan wel het regionaal expertisecentrum direct of indirect
      geniet vanwege uitkeringen of toelagen waarop door het personeel aanspraak kan worden gemaakt.


