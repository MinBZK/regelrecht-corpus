      1 Bij algemene maatregel van bestuur worden regels gegeven met betrekking tot de bekostiging van een regionaal
      expertisecentrum, welke regels per cluster als bedoeld in [artikel 2, vierde lid][ref1], verschillend kunnen zijn.

      2 Grondslag voor de bekostiging van een regionaal expertisecentrum is naast een vaste voet,
      het aantal scholen dat deelneemt aan dat regionaal expertisecentrum en het aantal leerlingen
      ten behoeve van wie in de periode van 12 maanden direct voorafgaand aan 1 oktober van het
      voorafgaande schooljaar op grond van [artikel 28c, eerste lid][ref2], dan wel op grond van
      [artikel 70b, eerste lid, van de Wet op het primair onderwijs][ref3] dan wel op grond van
      [artikel 77b, eerste lid, van de Wet op het voortgezet onderwijs][ref4] een bevestigende beoordeling is gegeven,
      verhoogd met een bij algemene maatregel van bestuur vastgesteld percentage, dat afhankelijk is van het cluster,
      bedoeld in [artikel 2, vierde lid][ref5], waartoe het regionaal expertisecentrum behoort.

      3 Op de bekostiging van het regionaal expertisecentrum worden de uitgaven in mindering gebracht die Onze
      minister doet voor een ten behoeve van dat regionaal expertisecentrum ingestelde ministeriële commissie voor de
      indicatiestelling als bedoeld in [artikel 28d][ref6].


