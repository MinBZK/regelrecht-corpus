    text: |-
      1 De openbare en de bijzondere scholen worden door het Rijk bekostigd volgens de bepalingen van deze titel met
      uitzondering van [afdeling 3][ref1]. Geen bekostiging vindt plaats indien groepen van leerlingen van verschillende
      scholen al dan niet van hetzelfde bevoegd gezag gezamenlijk onderwijs ontvangen. De bedragen die de gemeente
      krachtens deze wet in aanvulling op de rijksbekostiging verstrekt, blijven ten laste van de gemeente.

      2 Bij algemene maatregel van bestuur worden nadere voorschriften gegeven ter uitvoering van het eerste lid. Deze
      algemene maatregel van bestuur bevat in elk geval een regeling omtrent de termijnen binnen welke besluiten moeten
      worden genomen.

      3 De algemene maatregel van bestuur bedoeld in het tweede lid, bevat tevens:

      a. een regeling omtrent de betaling van de bedragen van de bekostiging voor de materiële voorzieningen ten behoeve
      van de instandhouding voortvloeiende uit het gebruik door een school van voorzieningen die voor meer dan een school
      of voor andere doeleinden zijn bestemd;

      b. een financiële regeling tussen het Rijk en de bevoegde gezagsorganen die personeel in dienst hebben dat niet
      door het Rijk wordt bekostigd ter zake van een korting op de bekostiging ter compensatie van de kosten van de voor
      dat personeel geldende rechtspositionele voorzieningen, voor zover deze ten laste van 's Rijks kas komen.

      4 De algemene maatregel van bestuur bedoeld in het tweede lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure
      bedoeld in de eerste 3 volzinnen, kan worden afgeweken.

      5 [Artikel 4:32 van de Algemene wet bestuursrecht][ref2] is niet van toepassing op de bekostiging van scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Afdeling3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel432
