  - number: 40b
    text: |-
      1 Het bevoegd gezag van een school, niet zijnde een instelling, of de bevoegde gezagsorganen van twee of
      meer scholen, niet zijnde instellingen, die hetzelfde regionaal expertisecentrum in stand houden, stelt
      onderscheidenlijk stellen een commissie voor de begeleiding in, die zodanig is samengesteld dat zij adequaat kan
      adviseren vanuit zowelonderwijskundig als pedagogisch, psychologisch en medisch oogpunt, rekening houdend met de
      handicap van de leerling.

      2 De commissie voor de begeleiding heeft tot taak een voorstel te doen voor het handelingsplan, bedoeld in
      [artikel 41a][ref1], en de uitvoering van het handelingsplan te evalueren alsmede te adviseren over terugplaatsing
      of overplaatsing van de leerling naar het basisonderwijs of het voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel41a
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel40b
