      1 Aan degene die blijkens een geschiktheidsonderzoek als bedoeld in artikel 162f voldoende geschikt wordt geacht
      voor het beroep van leraar en in staat moet worden geacht binnen twee jaar na benoeming of tewerkstelling zonder
      benoeming tot leraar met goed gevolg deel te nemen aan het in artikel 162i bedoelde bekwaamheidsonderzoek,
      wordt een geschiktheidsverklaring afgegeven door het instellingsbestuur onder verantwoordelijkheid waarvan het
      geschiktheidsonderzoek wordt uitgevoerd of door het bestuur van een op grond van artikel 162h, eerste lid, erkende
      instelling.

      2 Bij ministeriële regeling wordt een model voor de geschiktheidsverklaring vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel162e
  - number: 162f
    text: |-
      1 Het geschiktheidsonderzoek wordt op aanvraag van het bevoegd gezag dat voornemens is betrokkene te benoemen of
      tewerktestellen zonder benoeming, of op aanvraag van betrokkene zelf, uitgevoerd onder verantwoordelijkheid van
      het bestuur van een instelling die op grond van [artikel 162h][ref1] is erkend. Dat instellingsbestuur betrekt bij
      het geschiktheidsonderzoek het bevoegd gezag dat voornemens is betrokkene te benoemen of tewerktestellen zonder
      benoeming, of indien betrokkene de aanvraag zelf indient, een bevoegd gezag dat daartoe in overeenstemming met
      betrokkene is uitgenodigd.

      2 Het geschiktheidsonderzoek omvat:

      a. de beoordeling of de gevolgde opleiding en de maatschappelijke of beroepservaring van betrokkene, in onderlinge
      samenhang bezien, van voldoende belang zijn in verhouding tot de door deze beoogde werkzaamheden aan een school, en
      indien dat het geval is

      b. het onderzoek naar de geschiktheid van betrokkene voor die werkzaamheden, waartoe in ieder geval wordt gerekend
      de beoordeling of betrokkene in de feitelijke klassituatie tot verantwoord lesgeven in staat is, alsmede

      c. de beoordeling, welke scholing en begeleiding voor betrokkene noodzakelijk moeten worden geacht om met goed
      gevolg deel te kunnen nemen aan het bekwaamheidsonderzoek.

      3 Uit de aanvraag voor het geschiktheidsonderzoek blijkt dat betrokkene in het bezit is van:

      a. een getuigschrift van met goed gevolg afgelegd afsluitend examen van een opleiding
      in het wetenschappelijk onderwijs of in het hoger beroepsonderwijs als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], dan wel van een erkenning van
      beroepskwalificaties als bedoeld in [artikel 5 van de Algemene wet erkenning EG-beroepskwalificaties][ref3], of

      b. een buitenlands getuigschrift dat naar het oordeel van het bestuur van de instelling die het
      geschiktheidsonderzoek uitvoert, gelijkwaardig is aan een getuigschrift als bedoeld onder a.

      4 Het in het tweede lid, onder b, bedoelde onderzoek is erop gericht, vast te stellen of betrokkene in voldoende
      mate beschikt over kennis, inzicht en vaardigheden om te kunnen worden belast met het geven van onderwijs dat
      voldoet aan de daaraan gestelde kwaliteitseisen, in aanmerking nemend dat betrokkene in de periode van benoeming
      of tewerkstelling zonder benoeming begeleid en verder geschoold zal worden om met goed gevolg deel te kunnen nemen
      aan het bekwaamheidsonderzoek. De in de eerste volzin bedoelde kennis en vaardigheden en het in die volzin bedoelde
      inzicht zijn afgeleid van de in [artikel 32a, eerste lid][ref4], bedoelde bekwaamheidseisen en omvatten in het
      bijzonder beroepsmatige vaardigheden.

      5 Het geschiktheidsonderzoek is zodanig ingericht dat daarbij in gelijke mate zijn betrokken:

      a. personen die zijn belast of belast zijn geweest met het geven van onderwijs aan een lerarenopleiding, alsmede

      b. leraren in het desbetreffende vak of vakgebied, niet zijnde personeelsleden van het bevoegd gezag dat is
      betrokken bij het geschiktheidsonderzoek.

      6 Ten behoeve van het uitvoeren van het geschiktheidsonderzoek is de aanvrager aan de instelling die het onderzoek
      zal verrichten, een bij ministeriële regeling vast te stellen bijdrage verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel162h
      [ref2]: https://wetten.overheid.nl/BWBR0005682
      [ref3]: https://wetten.overheid.nl/BWBR0023066#Artikel5
