  - number: 42a
    text: |-
      1 Onverminderd bij algemene maatregel van bestuur gegeven voorschriften met betrekking tot de in- en uitschrijving
      van leerlingen, vindt toelating van een leerling als bedoeld in artikel 40 slechts plaats nadat door de ouders of,
      indien de leerling meerderjarig en handelingsbekwaam is, door de leerling de gegevens betreffende de geslachtsnaam,
      de voorletters, de geboortedatum, het geslacht en het persoonsgebonden nummer van de leerling zijn overgelegd.
      Indien door de ouders of, indien de leerling meerderjarig en handelingsbekwaam is, door de leerling aannemelijk
      wordt gemaakt dat geen persoonsgebonden nummer van de leerling kan worden overgelegd, vindt de toelating plaats met
      inachtneming van het derde lid.

      2 De in het eerste lid bedoelde gegevens worden overgelegd door middel van een van overheidswege verstrekt document
      of een door een andere school of een school voor ander onderwijs verstrekt bewijs van uitschrijving, waarin de
      desbetreffende gegevens zijn opgenomen.

      3 Indien door de ouders of, indien de leerling meerderjarig en handelingsbekwaam is, door de leerling aannemelijk
      wordt gemaakt dat geen persoonsgebonden nummer van de leerling kan worden overgelegd, meldt het bevoegd gezag
      binnen twee weken na het besluit tot toelating aan Onze minister de beschikbare gegevens van de leerling, bedoeld
      in het eerste lid, alsmede zijn adres en woonplaats en, indien aanwezig, het leerlingadministratienummer.

      4 Onze minister verstrekt binnen acht weken na ontvangst van de melding, bedoeld in het derde lid, aan het
      bevoegd gezag het burgerservicenummer van de leerling, dan wel, indien is gebleken dat hem niet van overheidswege
      een burgerservicenummer is verstrekt, het onderwijsnummer van de leerling. Het onderwijsnummer is een door Onze
      minister uitgegeven en aan de leerling toegekend persoonsgebonden nummer.

      5 Het bevoegd gezag neemt de in het eerste en vierde lid bedoelde gegevens op in de leerlingenadministratie van
      de school. Bij ministeriële regeling kan worden bepaald welke andere gegevens in de leerlingenadministratie worden
      opgenomen.

      6 Indien aan een leerling een onderwijsnummer is toegekend en het bevoegd gezag daarna de beschikking krijgt over
      zijn burgerservicenummer, neemt het bevoegd gezag dit burgerservicenummer terstond als persoonsgebonden nummer
      op in de leerlingenadministratie van de school in de plaats van het onderwijsnummer. Het bevoegd gezag meldt deze
      wijziging binnen twee weken aan Onze minister onder opgave van het burgerservicenummer en het onderwijsnummer van
      de leerling.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel42a
  - number: '43'
    text: |-
      Over iedere leerling die de school verlaat, stelt de directeur, na overleg met het onderwijzend personeel
      en de commissie voor de begeleiding, bedoeld in [artikel 40b][ref1], dan wel de commissie, bedoeld
      in [artikel 41, tweede lid][ref2], ten behoeve van de ontvangende school of school als bedoeld in de
      [Wet op het primair onderwijs][ref3] dan wel als bedoeld in de [Wet op het voortgezet onderwijs][ref4] een
      onderwijskundig rapport op. De commissie kan daartoe de leerling aan een onderzoek onderwerpen. Afschrift van
      dit rapport wordt verstrekt aan de ouders van een minderjarige of handelingsonbekwame leerling en aan de leerling
      die meerderjarig en handelingsbekwaam is. Desgewenst wordt tevens een afschrift verstrekt aan de leerling die de
      leeftijd van 16 jaar en nog niet die van 18 jaar heeft bereikt. Bij algemene maatregel van bestuur kunnen nadere
      voorschriften omtrent dit rapport worden gegeven.


