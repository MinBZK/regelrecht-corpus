  - number: '120'
    text: |-
      1 Indien bijzondere ontwikkelingen in het speciaal onderwijs en het voortgezet speciaal onderwijs daartoe
      aanleiding geven, kunnen bij ministeriële regeling voorschriften worden vastgesteld omtrent het verstrekken van
      bijzondere bekostiging voor personeelskosten.

      2 In verband met bijzondere omstandigheden kan Onze minister op verzoek van het bevoegd gezag van een school, niet
      zijnde een instelling, onder door hem op te leggen verplichtingen bijzondere bekostiging voor personeelskosten
      verstrekken.

      3 Een aanvraag als bedoeld in het tweede lid wordt ingediend ten hoogste vier maanden voorafgaand aan het
      schooljaar waarin de bijzondere omstandigheden zich zullen voordoen en niet later dan in het schooljaar waarin die
      bijzondere omstandigheden zich hebben voorgedaan. Onze minister besluit binnen vier maanden na ontvangst van een
      in het tweede lid bedoelde aanvraag. Indien de beschikking niet binnen vier maanden kan worden gegeven, stelt Onze
      minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan
      worden gezien.

      4 Onze minister kan in verband met de in het eerste en tweede lid bedoelde bekostiging een bekostigingsplafond
      instellen. In dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel120
  - number: '121'
    text: |-
      1 Aan de school wordt in verband met de kosten van vervanging van personeel wegens voorschriften die zijn gegeven
      bij algemene maatregel van bestuur of bij ministeriële regeling en de kosten van werkloosheidsuitkeringen,
      suppleties inzake arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen
      personeel anders dan op grond van de [Ziektewet][ref1] bekostiging verstrekt.

      2 De in het eerste lid bedoelde bekostiging is verwerkt in de bedragen en in de vermenigvuldigingsbedragen van de
      verhoging, bedoeld in de [artikelen 117, vierde en tiende lid][ref2], en [120][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel117
