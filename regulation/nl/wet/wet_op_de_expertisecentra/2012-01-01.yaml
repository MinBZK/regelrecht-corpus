  - number: '9'
    text: |-
      De taken van een instelling zijn:

      a. het geven van speciaal onderwijs of voortgezet speciaal onderwijs aan kinderen als bedoeld in
      [artikel 2, tweede lid, onderdeel d][ref1], of aan meervoudig gehandicapte kinderen als bedoeld in
      [artikel 8, eerste lid, tweede volzin][ref2];

      b. het begeleiden door een aan een instelling verbonden leraar van een leerling die zonder deze begeleiding zou
      zijn aangewezen op het onderwijs dat de instelling verzorgt, alsmede de ondersteuning van een onderwijsinstelling
      waarop die leerling is geplaatst door een leraar, orthopedagoog, psycholoog of logopedist van de instelling en

      c. het verrichten van algemene ondersteuningsactiviteiten ten behoeve van de bevordering van een optimale
      schoolloopbaan van visueel gehandicapte leerlingen.


