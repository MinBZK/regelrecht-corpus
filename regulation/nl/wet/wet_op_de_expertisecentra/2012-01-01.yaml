  - number: '75'
    text: |-
      1 De [artikelen 77 tot en met 88][ref1] zijn tot een bij de wet te bepalen datum niet van toepassing.

      2 Tot een bij de wet te bepalen datum kan Onze minister op verzoek van het bevoegd gezag, onder door hem te stellen
      voorwaarden, een school voor bekostiging in aanmerking brengen indien:

      a. de school is gelegen in een gebied waarin sprake is van een uitzonderlijke bevolkingstoename,

      b. sprake is van een verandering van de plaats van vestiging van een reeds bekostigde school,

      c. sprake is van omzetting van een bekostigde bijzondere school in een gelijksoortige openbare school of omgekeerd,

      d. sprake is van omzetting van een bekostigde bijzondere school in een gelijksoortige bijzondere school van een
      andere richting,

      e. sprake is van uitbreiding van het onderwijs aan een school met onderwijs van een of meer andere richtingen,

      f. sprake is van voor bekostiging in aanmerking brengen van een samenwerkingsschool met inachtneming van
      [artikel 28j][ref2],

      g. sprake is van stichting van scholen die overeenkomen met de scholen waaruit een opgeheven samenwerkingsschool is
      ontstaan, of

      h. sprake is van uitbreiding van het onderwijs aan een school voor speciaal onderwijs met onderwijs voor voortgezet
      speciaal onderwijs, niet zijnde het onderwijs bedoeld in [artikel 2, tweede lid, onder n][ref3].

      3 Het verzoek, bedoeld in het tweede lid, is met redenen omkleed en gaat vergezeld van de gegevens,
      genoemd in [artikel 81, tweede lid][ref4]. Indien sprake is van een situatie als bedoeld in het tweede
      lid, onder a tot en met e, willigt Onze minister het verzoek slechts in indien de school bij toepassing van
      [artikel 83, eerste en derde lid][ref5], op grond van het eerste lid van [dat artikel][ref6] in een door
      provinciale staten of Onze minister vast te stellen plan van nieuwe scholen zou worden opgenomen. Indien sprake
      is van uitbreiding als bedoeld in het tweede lid, onder h, willigt Onze minister het verzoek slechts in indien de
      school bij toepassing van [artikel 83, eerste, tweede en derde lid][ref7], op grond van het eerste lid dan wel het
      tweede lid van [dat artikel][ref8] in een door provinciale staten of Onze minister vast te stellen plan van nieuwe
      scholen zou worden opgenomen. Indien sprake is van een situatie als bedoeld in het tweede lid, onder f, willigt
      Onze minister het verzoek slechts in indien de school bij toepassing van [artikel 83, eerste en derde lid][ref9],
      op grond van het eerste lid van dat artikel in een door provinciale staten of Onze minister vast te stellen
      plan van nieuwe scholen zou worden opgenomen, met dien verstande dat daarbij de leerlingaantallen als bedoeld
      in [artikel 147][ref10] en [artikel 148][ref11] worden toegepast. Indien sprake is van een situatie als bedoeld
      in het tweede lid, onder g, willigt Onze minister het verzoek slechts in indien de school bij toepassing van
      [artikel 83, eerste, tweede en derde lid][ref12], op grond van het eerste dan wel het tweede lid van dat artikel in
      een door provinciale staten of Onze minister vast te stellen plan van nieuwe scholen zou worden opgenomen.

      4 Een school die is opgenomen in een door Onze minister goedgekeurd of vastgesteld plan van nieuwe scholen voor de
      jaren 1991, 1992, 1993 en 1994 komt voor bekostiging in aanmerking indien de school in dat plan is opgenomen met
      als jaar van aanvang van de bekostiging 1991 en het onderwijs voor 1 januari 1992 een aanvang heeft genomen.


