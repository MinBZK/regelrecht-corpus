  - number: '148'
    text: |-
      1 De gemeenteraad besluit, behoudens het bepaalde in het derde lid, tot opheffing van een openbare school indien
      het aantal leerlingen vastgesteld volgens [artikel 151][ref1], gedurende 2 achtereenvolgende schooljaren in elk van
      die jaren minder heeft bedragen dan het volgende aantal leerlingen:

      a. de school voor speciaal onderwijs: 25 leerlingen;

      b. de school voor voortgezet speciaal onderwijs: 29 leerlingen;

      c. de school of de instelling voor speciaal en voortgezet speciaal onderwijs: 33 leerlingen;

      d. de afdeling: 8 leerlingen.

      De gemeenteraad besluit, behoudens het bepaalde in het derde lid, tot beëindiging van het voortgezet speciaal
      onderwijs van een openbare school voor speciaal en voortgezet speciaal onderwijs, indien het aantal leerlingen
      van het voortgezet speciaal onderwijs van de school vastgesteld volgens [artikel 151][ref2], gedurende 2
      achtereenvolgende schooljaren in elk van die jaren minder heeft bedragen dan 8. Dit besluit wordt genomen voor 16
      oktober van het schooljaar, volgend op de 2 achtereenvolgende schooljaren, bedoeld in de aanhef van dit lid.

      2 Het eerste lid is niet van toepassing op de eerste 5 volledige schooljaren van de bekostiging van de school.

      3 In de gevallen, genoemd in het eerste lid, besluit de gemeenteraad tot instandhouding van de school indien deze
      noodzakelijk is om voldoende te voorzien in de behoefte aan openbaar onderwijs. Dit besluit wordt genomen voor 16
      oktober van het schooljaar volgend op de 2 achtereenvolgende schooljaren, bedoeld in de aanhef van het eerste lid.

      4 De besluiten van de gemeenteraad, bedoeld in het eerste en derde lid, worden onderworpen aan de goedkeuring
      van gedeputeerde staten voor zover het scholen betreft als bedoeld in [artikel 78, eerste lid][ref3], en aan
      de goedkeuring van Onze minister voor zover het scholen betreft als bedoeld in [artikel 86, eerste lid][ref4].
      Gedeputeerde staten en Onze minister onthouden hun goedkeuring ten aanzien van besluiten op grond van het eerste
      lid, indien ten gevolge van de opheffing van de school, afhankelijk van de schoolsoort, regionaal, provinciaal dan
      wel landelijk niet meer voldoende zou zijn voorzien in de behoefte aan openbaar onderwijs. Gedeputeerde staten en
      Onze minister onthouden hun goedkeuring ten aanzien van besluiten op grond van het derde lid, indien instandhouding
      van de school, afhankelijk van de schoolsoort, regionaal, provinciaal dan wel landelijk niet noodzakelijk is om
      voldoende te voorzien in de behoefte aan openbaar onderwijs.

      5 Gedeputeerde staten en Onze minister besluiten voor 16 februari volgend op de datum 16 oktober, genoemd in
      het eerste lid, laatste volzin, en derde lid, laatste volzin. Indien gedeputeerde staten, onderscheidenlijk Onze
      minister niet voor 16 februari hebben besloten, wordt het desbetreffende besluit van de gemeenteraad geacht te zijn
      goedgekeurd. Het onthouden van de goedkeuring van gedeputeerde staten, onderscheidenlijk Onze minister ten aanzien
      van het besluit van de gemeenteraad, bedoeld in het eerste lid, dan wel de goedkeuring van gedeputeerde staten,
      onderscheidenlijk Onze minister ten aanzien van het besluit van de gemeenteraad, bedoeld in het derde lid, geldt
      telkens voor ten hoogste 3 schooljaren.

      6 De besluiten van de gemeenteraad, van gedeputeerde staten en van Onze minister, bedoeld in het eerste en het
      derde tot en met vijfde lid, worden bekendgemaakt door een openbare kennisgeving binnen 2 weken na de datum waarop
      het besluit is genomen.

      7 De opheffing geschiedt met ingang van 1 augustus van het tweede schooljaar volgend op de 2 achtereenvolgende
      schooljaren, bedoeld in de aanhef van het eerste lid, tenzij door gedeputeerde staten of Onze minister bij hun,
      onderscheidenlijk zijn besluit, of bij een in beroep gegeven uitspraak anders is bepaald.

      8 Indien het aantal leerlingen van de betrokken school vastgesteld volgens [artikel 151][ref5] in het schooljaar
      volgend op de 2 achtereenvolgende schooljaren, bedoeld in de aanhef van het eerste lid, gelijk is aan of meer
      bedraagt dan het op grond van het eerste lid voor die school geldende aantal, wordt de school niet opgeheven op
      grond van dit artikel. De procedures die in werking zijn gesteld op grond van het vierde tot en met het zevende
      lid, eindigen van rechtswege en beslissingen, genomen op grond van het vierde tot en met het zevende lid,
      vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel151
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel151
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel78
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel86
      [ref5]: https://wetten.overheid.nl/BWBR0003549#Artikel151
