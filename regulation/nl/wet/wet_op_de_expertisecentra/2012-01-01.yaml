  - number: '115'
    text: |-
      1 Burgemeester en wethouders stellen na overleg met de bevoegde gezagsorganen van de niet door de gemeente in stand
      gehouden scholen het aantal klokuren per week vast dat per groep leerlingen ten hoogste

      a. ter beschikking wordt gesteld in een ruimte voor het onderwijs in lichamelijke oefening, of

      b. voor bekostiging voor de materiële instandhouding van een ruimte voor het onderwijs in lichamelijke oefening in
      aanmerking komt.

      2 Het aantal klokuren, bedoeld in het eerste lid, wordt ten minste vastgesteld op 2,25.

      3 Burgemeester en wethouders stellen de hoogte vast van

      a. de bekostiging, bedoeld in het eerste lid, onder b, en

      b. de bekostiging voor de vaste kosten van de materiële instandhouding van een ruimte voor lichamelijke oefening
      waarvan de eigendom berust bij het bevoegd gezag van een niet door de gemeente in stand gehouden school.

      4 Bij de vaststelling, bedoeld in het derde lid, kan onderscheid worden gemaakt naar gelang de oppervlakte van de
      ruimte, alsmede tussen ruimten voor de exploitatie waarvan op grond van de onderwijswetgeving bekostiging wordt
      verleend en ruimten waarvoor dat niet het geval is.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel115
  - number: '116'
    text: |-
      1 Het bevoegd gezag dat, dan wel de gemeente die eigenaar is van een schoolgebouw, zorgt
      voor het deel van de materiële instandhouding waarop de programma's van eisen, bedoeld in
      [artikel 112, eerste lid onder a, b en c][ref1], betrekking hebben.

      2 Het bevoegd gezag van een bijzondere school dat eigenaar is van een schoolgebouw, kan met burgemeester en
      wethouders overeenkomen dat de gemeente het in het eerste lid bedoelde deel van de materiële instandhouding geheel
      of gedeeltelijk verzorgt.

      3 Het bevoegd gezag, bedoeld in het eerste lid, kan met een bevoegd gezag dat gebruik maakt van de voorziening in
      de huisvesting van het eerstgenoemde bevoegd gezag, overeenkomen dat het laatstgenoemde bevoegd gezag het in het
      eerste lid bedoelde deel van de materiële instandhouding geheel of gedeeltelijk verzorgt.

      4 Ingeval de gemeente eigenaar is van het schoolgebouw, kan het bevoegd gezag van een bijzondere school met de
      gemeente overeenkomen dat het bevoegd gezag het in het eerste lid bedoelde deel van de materiële instandhouding
      geheel of gedeeltelijk verzorgt.

      5 Het bevoegd gezag zorgt voor het deel van de materiële instandhouding waarop de programma's van eisen, bedoeld in
      [artikel 112, eerste lid onder d en e][ref2], betrekking hebben.


