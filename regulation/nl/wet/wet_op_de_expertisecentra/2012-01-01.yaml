      1 In een scholengemeenschap zijn tot één school verenigd scholen van de soort die tot hetzelfde cluster of dezelfde
      clusters, bedoeld in [artikel 2, vierde lid onder b, c en d][ref1], behoren.

      2 De bij of krachtens deze wet gegeven voorschriften die gelden voor de onderwijssoort waartoe een deel van de
      scholengemeenschap behoort, zijn van overeenkomstige toepassing op dat deel van de scholengemeenschap.

      3 De [artikelen 28j, tweede lid][ref2], en [75 tot en met 88][ref3] zijn niet van toepassing indien twee of meer
      scholen worden verenigd tot een scholengemeenschap.

      4 De directeur, onderscheidenlijk de adjunct-directeur of adjunct-directeuren, kan slechts een van de directeuren
      onderscheidenlijk kunnen slechts een of meer van de adjunct-directeuren van de scholen zijn die tot de
      scholengemeenschap worden verenigd, tenzij geen van de betrokkenen de desbetreffende functie wenst te aanvaarden.


