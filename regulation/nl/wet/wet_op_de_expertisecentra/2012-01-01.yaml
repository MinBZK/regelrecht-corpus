  - number: '136'
    text: |-
      1 Indien een gemeente ten behoeve van een of meer door haar in stand gehouden scholen meer uitgaven doet voor
      het personeel en de materiële instandhouding dan door het Rijk worden bekostigd, wordt met inachtneming van
      de [artikelen 136 tot en met 142][ref1] aan het bevoegd gezag van de in die gemeente gevestigde niet door de
      gemeente in stand gehouden scholen om de vijf jaar een overschrijdingsbedrag verstrekt. Voor de toepassing van de
      eerste volzin worden ontvangsten, op grond van [artikel 128, tweede lid, tweede volzin][ref2], gelijk gesteld met
      ontvangsten van het Rijk. Indien een gemeente vanaf een tijdstip binnen een periode van vijf jaar als bedoeld in de
      eerste volzin geen school in stand houdt, wordt het overschrijdingsbedrag in afwijking van die volzin uiterlijk 31
      december van het kalenderjaar dat volgt op dat tijdstip waarop de gemeente niet langer een school in stand houdt,
      verstrekt.

      2 Voor de toepassing van de [artikelen 136 tot en met 142][ref3] worden uitgaven ten behoeve van een
      nevenvestiging aangemerkt als uitgaven ten behoeve van de hoofdvestiging van de school waaraan de nevenvestiging
      is verbonden. Indien ten behoeve van een school of nevenvestiging uitgaven worden gedaan door meer dan één
      gemeente, worden deze uitgaven aangemerkt als uitgaven van de gemeente op wier grondgebied de hoofdvestiging
      is gelegen. In het geval, bedoeld in de vorige volzin, worden de besluiten ingevolge het vierde lid en de
      [artikelen 137 tot en met 142][ref4] genomen door burgemeester en wethouders van laatstbedoelde gemeente en hebben
      deze mede betrekking op de uitgaven van de andere gemeente of gemeenten.

      3 Voor de toepassing van de [artikelen 136 tot en met 142][ref5] wordt een nevenvestiging in een andere gemeente
      dan waarin de hoofdvestiging is gelegen, aangemerkt als een nevenvestiging die is gelegen in de gemeente van de
      hoofdvestiging.

      4 Burgemeester en wethouders kunnen in overeenstemming met het bevoegd gezag van een niet door de gemeente in stand
      gehouden school besluiten dat met betrekking tot een of meer scholen van dat bevoegd gezag uitgaven die de gemeente
      doet ten behoeve van een door haar in stand gehouden school buiten beschouwing worden gelaten bij het vaststellen
      van de bedragen, bedoeld in de [artikelen 137][ref6] en [138][ref7].


