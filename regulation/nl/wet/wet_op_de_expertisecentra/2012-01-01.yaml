  - number: '14'
    text: |-
      1 Voortgezet speciaal onderwijs omvat, waar mogelijk in samenhang, in elk geval:

      a. Nederlandse taal;

      b. geschiedenis, waaronder staatsinrichting;

      c. aardrijkskunde;

      d. maatschappijleer;

      e. wiskunde en rekenen;

      f. muziek;

      g. tekenen;

      h. handvaardigheid;

      i. lichamelijke oefening.

      2 Voortgezet speciaal onderwijs omvat voorts ten minste 2 van de vakken die gegeven worden in het voorbereidend
      beroepsonderwijs, het algemeen voortgezet onderwijs en het voorbereidend wetenschappelijk onderwijs, anders dan de
      vakken bedoeld in het eerste lid.

      3 Op de scholen in de provincie Fryslân kan het voortgezet speciaal onderwijs mede onderwijs in de Friese taal
      omvatten.

      4 Bij algemene maatregel van bestuur kunnen per schoolsoort voorschriften worden gegeven omtrent:

      a. het maximum aantal vakken bedoeld in het tweede lid, waarin onderwijs wordt gegeven;

      b. de combinatie van vakken waarin onderwijs wordt gegeven.

      5 Bij algemene maatregel van bestuur wordt bepaald welke vakken het voortgezet speciaal onderwijs aan zeer moeilijk
      lerende kinderen omvat.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel14
  - number: '15'
    text: |-
      Onze minister bepaalt op voorstel van het bevoegd gezag per school, welke onderdelen genoemd in de
      [artikelen 13, eerste tot en met vijfde lid][ref1], en [14][ref2], het speciaal onderwijs, onderscheidenlijk het
      voortgezet speciaal onderwijs aan meervoudig gehandicapte kinderen omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel13
