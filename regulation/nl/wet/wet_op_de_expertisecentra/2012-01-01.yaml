preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter bevordering van een ononderbroken ontwikkeling van de kinderen
    voor wie vaststaat dat overwegend een orthopedagogische en orthodidactische benadering aangewezen is, gewenst is
    wettelijke voorzieningen voor het speciaal onderwijs en het voortgezet speciaal onderwijs te treffen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      *Onze minister*:

      Onze minister van Onderwijs, Cultuur en Wetenschap;

      *inspectie of inspecteur*:

      de inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref1], voor zover belast met taken op het gebied van het
      speciaal onderwijs en voortgezet speciaal onderwijs;

      *school:*

      een school voor speciaal onderwijs, voor voortgezet speciaal onderwijs of voor speciaal en voortgezet speciaal
      onderwijs als bedoeld in [artikel 2, tweede lid onder a, b, c, f, h, j, k, m of n][ref2], dan wel een instelling
      voor speciaal en voortgezet speciaal onderwijs als bedoeld in [artikel 8, eerste lid tweede volzin][ref3], tenzij
      het tegendeel blijkt;

      *basisschool:*

      een basisschool als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref4];

      *speciale school voor basisonderwijs*:

      een speciale school voor basisonderwijs als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref5];

      *school voor voortgezet onderwijs*:

      een school voor voortgezet onderwijs als bedoeld in [artikel 1 van de Wet op het voortgezet onderwijs][ref6];

      *instelling*:

      instelling als bedoeld in [artikel 8, eerste lid, tweede volzin][ref7];

      *openbare school:*

      a. een door een of meer gemeenten, al dan niet te zamen met een of meer privaatrechtelijke rechtspersonen met
      volledige rechtsbevoegdheid in stand gehouden school;

      b. een door een openbare rechtspersoon als bedoeld in [artikel 50][ref8] in stand gehouden school; dan wel

      c. een door een stichting als bedoeld in [artikel 28][ref9] of [artikel 51][ref10] in stand gehouden school;

      *bijzondere school*:

      door een natuurlijk persoon of een privaatrechtelijke rechtspersoon, niet zijnde een stichting als bedoeld in
      [artikel 51][ref11], in stand gehouden school;

      *openbare rechtspersoon*:

      een rechtspersoon die krachtens publiekrecht is ingesteld als bedoeld in [artikel 50][ref12];

      *bevoegd gezag van volgens deze wet bekostigde scholen* voor wat betreft:

      a. een openbare school:

      1°. het college van burgemeester en wethouders, voor zover de raad niet anders bepaalt, en, indien de raad dit
      besluit, met inachtneming van door hem te stellen regelen;

      2°. het krachtens de desbetreffende gemeenschappelijke regeling bevoegde orgaan;

      3°. de openbare rechtspersoon, bedoeld in [artikel 50][ref13]; dan wel

      4°. de stichting, bedoeld in [artikel 28][ref14] of [artikel 51][ref15];

      b. een bijzondere school: de rechtspersoon bedoeld in [artikel 57][ref16];

      c. een samenwerkingsschool: de stichting, bedoeld in [artikel 28j][ref17];

      *persoonsgebonden nummer:*

      het burgerservicenummer, bedoeld in [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref18],
      dan wel het door Onze minister uitgegeven onderwijsnummer, bedoeld in [artikel 42a, vierde lid][ref19];

      *sociaal-fiscaalnummer:*

      het nummer, bedoeld in [artikel 2, derde lid, onder k, van de Algemene wet inzake rijksbelastingen][ref20];

      *ouders*:

      ouders, voogden of verzorgers;

      *schooljaar*:

      het tijdvak van 1 augustus tot en met 31 juli daaraanvolgend;

      *personeel*:

      a. de benoemde directeur, het personeel benoemd in een functie voor het geven van onderwijs, het
      personeel benoemd in een andere functie dan het geven van onderwijs, het personeel dat is benoemd voor het
      verrichten van werkzaamheden ten behoeve van meer dan een school of meer dan een school als bedoeld in de
      [Wet op het primair onderwijs][ref21], waaronder begrepen de leden van het bestuur van die scholen die zijn benoemd
      door een raad van toezicht als bedoeld in [artikel 28i, derde lid][ref22], voor zover die leden mede zijn benoemd
      op basis van een arbeidsovereenkomst of een akte van aanstelling;

      b. het onder a bedoelde personeel dat zonder benoeming is tewerkgesteld, tenzij het betreft de toepassing
      van de [artikelen 33][ref23], [33a][ref24], [34][ref25], [37][ref26], [38][ref27], [55][ref28],
      [56, eerste en tweede lid][ref29], [62, eerste tot en met vierde lid][ref30], [63 tot en met 65][ref31],
      [69][ref32], [132][ref33] en [133][ref34], voor zover niet anders is bepaald, en de toepassing van daarmee verband
      houdende wettelijke bepalingen;

      *schoolplan*:

      een schoolplan als bedoeld in [artikel 21][ref35]. Onder schoolplan wordt tevens verstaan instellingsplan, tenzij
      het tegendeel blijkt;

      *commissie voor de indicatiestelling*:

      een commissie als bedoeld in [artikel 28c][ref36];

      *schoolbegeleiding:*

      activiteiten ten behoeve van de schoolorganisatie of het onderwijs aan een school die dienen tot begeleiding,
      ontwikkeling, advisering, informatieverstrekking en evaluatie, alsmede activiteiten tot bevordering van een
      optimale schoolloopbaan van leerlingen;

      *basisregister onderwijs:*

      basisregister onderwijs als bedoeld in [artikel 24b van de Wet op het onderwijstoezicht][ref37].


