  - number: '112'
    text: |-
      1 De programma's van eisen, bedoeld in [artikel 111, derde lid onder a][ref1], worden onderverdeeld in programma's
      van eisen omtrent:

      a. onderhoud,

      b. energie- en waterverbruik,

      c. publiekrechtelijke heffingen, met uitzondering van de belastingen ter zake van onroerende zaken,

      d. middelen, en

      e. administratie, beheer en bestuur.

      2 De programma's van eisen, bedoeld in [artikel 111, derde lid onder b][ref2], worden onderverdeeld in programma's
      van eisen omtrent de voorzieningen zoals onderscheiden in het eerste lid onder a, b en c, alsmede d voor zover het
      betreft onderhoud, vervanging en vernieuwing van onderwijsleerpakket en onderhoud meubilair.

      3 Bij de programma's van eisen, bedoeld in het tweede lid, wordt onderscheid gemaakt in vaste en variabele kosten.


