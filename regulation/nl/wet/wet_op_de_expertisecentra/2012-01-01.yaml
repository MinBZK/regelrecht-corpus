  - number: '59'
    text: |-
      Onverminderd de artikelen 13 tot en met 16 kunnen de onderwijsactiviteiten godsdienstonderwijs of
      levensbeschouwelijk vormingsonderwijs omvatten. Van de tijd daaraan te besteden, worden ten hoogste 120 uren per
      schooljaar meegeteld voor het aantal uren onderwijs dat de leerlingen krachtens [artikel 11, vierde lid][ref1],
      ten minste moeten ontvangen. Het geven van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs kan worden
      opgedragen aan een niet aan de school verbonden leraar.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel11
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '11'
        paragraaf: '1'
        afdeling: '1'
  - number: '60'
    text: |-
      1 Indien binnen redelijke afstand van de woning van de leerling geen gelegenheid bestaat tot het volgen van
      openbaar onderwijs, mag de toelating tot de school niet worden geweigerd op grond van godsdienstige gezindheid
      of levensbeschouwing. Het voorgaande is niet van toepassing, indien de school uitsluitend bestemd is voor interne
      leerlingen.

      2 Leerlingen die ingevolge het eerste lid zijn toegelaten, kunnen niet worden verplicht godsdienstonderwijs of
      levensbeschouwelijk vormingsonderwijs te volgen.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel60
  - number: '61'
    text: |-
      1 Indien het bevoegd gezag van een bijzondere school op grond van artikel 36, derde lid, een student de toegang
      weigert, deelt het bevoegd gezag deze beslissing, schriftelijk en met redenen omkleed, mede door toezending of
      uitreiking aan de student, onverminderd het bepaalde in dat artikellid.

      2 Indien het bevoegd gezag van een bijzondere school hetzij weigert een leerling toe te laten, hetzij een leerling
      verwijdert, op grond van [artikel 40, eerste lid en zesde lid][ref1], deelt het deze beslissing, schriftelijk
      en met redenen omkleed, mede door toezending of uitreiking aan de ouders. Daarbij wordt tevens de inhoud van het
      bepaalde in het derde lid, eerste volzin, vermeld. Voordat het bevoegd gezag van een bijzondere school op grond van
      [artikel 40, eerste lid en zesde lid][ref2], beslist tot verwijdering van een leerling, hoort het de ouders van de
      leerling, onverminderd het [zesde lid van dat artikel][ref3].

      3 Binnen 6 weken na de mededeling, bedoeld in het tweede lid, kunnen de ouders bij het bevoegd gezag schriftelijk
      hun bezwaren kenbaar maken tegen de beslissing. Het bevoegd gezag beslist binnen 4 weken na ontvangst van de
      bezwaren. Alvorens te beslissen hoort het bevoegd gezag de ouders.

      4 Het bevoegd gezag beslist niet eerder op de bezwaren dan:

      a. na overleg met de inspecteur en desgewenst met andere deskundigen,

      b. nadat de ouders kennis hebben kunnen nemen van de op de beslissing betrekking hebbende adviezen of rapporten, en

      c. de ouders opnieuw zijn gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel40
