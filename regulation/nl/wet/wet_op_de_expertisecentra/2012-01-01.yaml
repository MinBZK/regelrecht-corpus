      Onze minister kan in bijzondere gevallen op verzoek van het bevoegd gezag toestaan dat wordt
      afgeweken van de voorschriften van of krachtens [artikel 13, eerste tot en met vijfde lid][ref1], en
      [artikel 14, eerste tot en met vierde lid][ref2]. De toestemming wordt verleend voor een bepaald tijdvak; aan de
      toestemming kunnen voorwaarden worden verbonden.


