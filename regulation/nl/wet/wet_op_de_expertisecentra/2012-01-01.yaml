  - number: '94'
    text: |-
      Burgemeester en wethouders stellen gelijktijdig met het programma, bedoeld in [artikel 93][ref1], ten behoeve van
      het onderwijs op het grondgebied van de gemeente voor een door hen te bepalen tijdstip een overzicht vast van die
      voorzieningen die zijn aangevraagd dan wel die nodig zijn, die niet op het programma zijn opgenomen.

      Daarbij wordt aangegeven waarom de desbetreffende voorzieningen niet zijn opgenomen. Het
      overzicht wordt ter inzage gelegd. Het overzicht heeft betrekking op scholen als bedoeld in
      [artikel 91, eerste lid, onderdelen a tot en met d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel91
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel94
