  - number: 8a
    text: |-
      1 Een school, niet zijnde een instelling, heeft, naast het geven van onderwijs, tot taak op verzoek
      van het regionaal expertisecentrum waaraan de school deelneemt onderzoek te verrichten in het kader van
      [artikel 28c, vierde lid, laatste volzin][ref1] en het ondersteunen van een school als bedoeld in de
      [Wet op het primair onderwijs][ref2] en de [Wet op het voortgezet onderwijs][ref3], waarbij een leerling
      is ingeschreven voor wie op basis van de beoordeling door een commissie voor de indicatiestelling een
      leerlinggebonden budget beschikbaar is en die toelaatbaar is verklaard tot een onderwijssoort als bedoeld in
      [artikel 2, tweede lid][ref4], die door de eerstbedoelde school wordt verzorgd of tot een onderwijssoort die
      behoort tot hetzelfde cluster als de onderwijssoort die door de eerstbedoelde school wordt verzorgd dan wel
      toelaatbaar is verklaard tot het cluster als bedoeld in [artikel 2, vierde lid onder d][ref5], waartoe de
      eerstbedoelde school behoort.

      2 Onder het ondersteunen van een school, bedoeld in het eerste lid, wordt in elk geval begrepen het doen van
      aanbevelingen over de begeleiding van de individuele leerling tijdens zijn verblijf op de school die wordt
      ondersteund, teneinde een optimale ontwikkeling van de in de leerling aanwezige mogelijkheden te bewerkstelligen.

      3 Bij algemene maatregel van bestuur worden onderwijssoorten aangewezen waaraan bekostiging kan worden toegekend
      ten behoeve van de begeleiding van

      a. leerlingen, die zijn geplaatst op een basisschool of speciale school voor basisonderwijs of leerlingen die
      zijn geplaatst op een school voor voortgezet onderwijs en die naar het oordeel van het bevoegd gezag zonder die
      begeleiding zouden zijn aangewezen op het speciaal onderwijs of het voortgezet speciaal onderwijs en

      b. leerlingen, die in het direct voorafgaande schooljaar waren toegelaten tot een school, niet zijnde een
      instelling, en die zonder dat voor hen nog een leerlinggebonden budget beschikbaar is, zijn teruggeplaatst naar een
      basisschool of speciale school voor basisonderwijs, een school voor voortgezet onderwijs dan wel een opleiding als
      bedoeld in [artikel 7.2.2., eerste lid onder a en b, van de Wet educatie en beroepsonderwijs][ref6].


