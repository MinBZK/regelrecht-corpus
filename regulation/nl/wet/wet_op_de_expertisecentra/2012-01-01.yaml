      1 [Artikel 132][ref1] is van overeenkomstige toepassing indien de rechtspersoon, bedoeld in de
      [artikelen 28b][ref2] en [69][ref3], personeel benoemt met voorbijgaan van gewezen personeel als bedoeld in
      [artikel 132, eerste en vijfde lid][ref4], van de rechtspersoon of van een bevoegd gezag waarvoor diensten
      worden verricht, dan wel niet handelt overeenkomstig het bepaalde in laatstgenoemde artikelleden. Van het gewezen
      personeel, bedoeld in de eerste volzin, is uitgezonderd het personeel van het bevoegd gezag waarvoor diensten
      worden verricht, waarvan de dienstbetrekking is beëindigd op een tijdstip dat meer dan twee jaar ligt voor de
      aanvang van de dienstverlening.

      2 In geval van toepassing van het eerste lid wordt het in mindering te brengen bedrag in gelijke mate verdeeld over
      de scholen waarvoor diensten worden verricht.

      3 [Artikel 132][ref5] is eveneens van overeenkomstige toepassing

      a. indien een bevoegd gezag waarvoor diensten worden verricht, personeel benoemt met voorbijgaan van gewezen
      personeel van de rechtspersoon, bedoeld in de [artikelen 28b][ref6] en [69][ref7], en

      b. indien een bevoegd gezag waarvoor geen diensten meer worden verricht, in het tijdvak van vijf jaar na
      beëindiging van de dienstverlening personeel benoemt met voorbijgaan van gewezen personeel als bedoeld in onderdeel
      a.


