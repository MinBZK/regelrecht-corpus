  - number: '40'
    text: |-
      1 De beslissing over toelating en verwijdering van leerlingen berust bij het bevoegd gezag, met inachtneming
      van het tweede tot en met het achtste lid en [artikel 40b][ref1], [41][ref2] en [42][ref3], [42a][ref4]. De
      toelating mag niet afhankelijk worden gesteld van een geldelijke bijdrage van de ouders. Overeenkomsten waarbij
      ouders worden verplicht tot het betalen van een geldelijke bijdrage zijn nietig, behoudens voorzover zij na
      de toelating van de leerling tot de school schriftelijk zijn aangegaan en in het desbetreffende schriftelijke
      stuk aan de ouders kenbaar is gemaakt dat het een vrijwillige bijdrage betreft waarvoor de overeenkomst niet
      behoeft te worden aangegaan, doch waarvoor geldt dat na de ondertekening wel een verplichting tot betaling van de
      overeengekomen bijdrage bestaat. Zodanige overeenkomsten zijn evenzeer nietig, indien deze niet hebben voorzien
      in de vermelding dat de ouders de mogelijkheid hebben er voor te kiezen om de overeenkomst slechts voor bepaalde
      voorzieningen aan te gaan en ten behoeve daarvan niet een specificatie voor de te onderscheiden voorzieningen in de
      overeenkomst is opgenomen. Zodanige overeenkomsten zijn voorts nietig indien ten aanzien daarvan geen reductie- en
      kwijtscheldingsregeling geldt en de inhoud van die regeling niet in de overeenkomst is opgenomen. Een overeenkomst
      wordt telkens voor de periode van een schooljaar aangegaan.

      2 Tot de school wordt uitsluitend als leerling toegelaten degene waarvan de ouders aantonen, dan wel, indien hij
      meerderjarig en handelingsbekwaam is, degene die aantoont dat hij:

      a. de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,

      b. vreemdeling is en jonger is dan 18 jaar op de eerste schooldag waarop het speciaal onderwijs, dan wel het
      voortgezet speciaal onderwijs begint, waarvoor voor de eerste maal toelating wordt gewenst,

      c. vreemdeling is, 18 jaar of ouder is op de eerste schooldag waarop het speciaal onderwijs, dan wel het voortgezet
      speciaal onderwijs begint, waarvoor voor de eerste maal toelating wordt gewenst en op die dag rechtmatig verblijf
      houdt in de zin van [artikel 8 van de Vreemdelingenwet 2000][ref5], of

      d. vreemdeling is, niet meer voldoet aan een van de voorwaarden, genoemd onder b of c, en eerder in overeenstemming
      met een van die onderdelen voor speciaal onderwijs, dan wel voortgezet speciaal onderwijs is toegelaten tot een
      school, welk onderwijs nog steeds wordt gevolgd en nog niet is voltooid.

      3 Een leerling wordt niet tot een school toegelaten dan nadat een commissie voor de indicatiestelling heeft
      verklaard dat de leerling toelaatbaar is tot een van de onderwijssoorten die door de school worden verzorgd dan
      wel tot het cluster, bedoeld in [artikel 2, vierde lid onder d][ref6], waartoe de school behoort. De eerste volzin
      is niet van toepassing ten aanzien van leerlingen die worden toegelaten op basis van de bekostiging, bedoeld in
      [artikel 117, vijfde of zevende lid][ref7], met dien verstande dat voor leerlingen die worden toegelaten op basis
      van bekostiging als bedoeld in [artikel 117, zevende lid][ref8], in de administratie van de school een verklaring
      aanwezig moet zijn van de residentiële instelling dat de leerling in die instelling is geplaatst.

      4 Het derde lid, eerste volzin, is niet van toepassing indien met instemming van de ouders het bevoegd gezag van
      een school in overleg met het bevoegd gezag van een basisschool, een speciale school voor basisonderwijs of een
      school voor voortgezet onderwijs waarbij een leerling is ingeschreven, de leerling toelaat gedurende een periode
      van korter dan een schooljaar ter oriëntatie of een orthopedagogische en orthodidactische benadering nodig is. De
      leerling blijft gedurende die periode ingeschreven bij de basisschool, de speciale school voor basisonderwijs of de
      school voor voortgezet onderwijs.

      5 De toelating tot een school wordt niet geweigerd op de grond dat de leerling niet is aangewezen op het
      onderwijs van de school indien een commissie voor de indicatiestelling heeft verklaard dat de leerling toelaatbaar
      is tot een van de onderwijssoorten die door de school worden verzorgd dan wel tot het cluster, bedoeld in
      [artikel 2, vierde lid onder d][ref9], waartoe de school behoort. De toelating van een leerling mag ook niet
      geweigerd worden op denominatieve gronden, tenzij de ouders van de leerling weigeren te verklaren dat zij de
      grondslag van het onderwijs van de school zullen respecteren dan wel onderschrijven.

      6 Voordat wordt besloten tot verwijdering hoort het bevoegd gezag de betrokken leraar of leraren. Definitieve
      verwijdering van een leerling waarop de [Leerplichtwet 1969][ref10] van toepassing is, vindt niet plaats dan
      nadat het bevoegd gezag ervoor heeft zorggedragen dat een basisschool, een speciale school voor basisonderwijs,
      een school voor speciaal onderwijs, een school voor speciaal en voortgezet speciaal onderwijs, een school voor
      voortgezet speciaal onderwijs, een instelling voor speciaal en voortgezet speciaal onderwijs, een school voor
      voortgezet onderwijs dan wel een instelling als bedoeld in [artikel 1, onder c, van de Leerplichtwet 1969][ref11]
      bereid is de leerling toe te laten. Indien aantoonbaar gedurende 8 weken zonder succes is gezocht naar een
      zodanige school of instelling waarnaar kan worden verwezen, kan in afwijking van de vorige volzin tot definitieve
      verwijdering worden overgegaan.

      7 Indien na de toelating tot de school blijkt dat deze op welke grond dan ook niet in overeenstemming met het
      tweede lid heeft plaatsgevonden, wordt de leerling onmiddellijk verwijderd.

      8 Tenzij een commissie voor de indicatiestelling een leerling voor een aansluitende periode toelaatbaar heeft
      verklaard tot een van de onderwijssoorten die door de school worden verzorgd dan wel tot het cluster, bedoeld in
      [artikel 2, vierde lid onder d][ref12], waartoe de school behoort, wordt een leerling na afloop van de periode
      gedurende welke hij toelaatbaar is verklaard tot de desbetreffende onderwijssoort dan wel het desbetreffende
      cluster, met inachtneming van de tweede en derde volzin van het zesde lid, verwijderd.

      9 Indien tegen een besluit van het bevoegd gezag van een openbare school ingevolge het eerste, tweede, derde,
      vierde, vijfde, zesde, zevende of achtste lid, bezwaar is gemaakt, besluit het bevoegd gezag in afwijking van
      [artikel 7:10 van de Algemene wet bestuursrecht][ref13] binnen 4 weken gerekend vanaf de dag na die waarop de
      termijn voor het indienen van het bezwaarschrift is verstreken.

      10 Het bevoegd gezag van een openbare school besluit niet op het bezwaarschrift, tenzij het bezwaarschrift
      is gericht tegen een besluit ingevolge het tweede, zevende of achtste lid dan na overleg met de inspecteur en
      desgewenst met andere deskundigen.

      11 Het derde, het vijfde en het achtste lid zijn niet van toepassing op een leerling van een instelling.


