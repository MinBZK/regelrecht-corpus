  - number: '31'
    text: |-
      1 Het bevoegd gezag stel na overleg met de directeur en indien toepassing is gegeven aan
      [artikel 29, vijfde lid][ref1], met het in dat artikellid bedoelde personeel voor zover dat is belast met
      managementtaken met betrekking tot de scholen en de scholen, bedoeld in de [Wet op het primair onderwijs][ref2],
      een managementstatuut vast. In het managementstatuut is ten minste een regeling opgenomen betreffende de
      bevoegdheden van de directeur en indien toepassing is gegeven aan [artikel 29, vijfde lid][ref3], van de
      bevoegdheden van het in dat artikellid bedoelde personeel voor zover dat is belast met managementtaken met
      betrekking tot de scholen en de scholen, bedoeld in de [Wet op het primair onderwijs][ref4], met betrekking tot de
      toedeling, bestemming en aanwending van de bekostiging.

      2 Het managementstatuut bevat tevens de aanduiding van de andere aan het bevoegd gezag bij wettelijk voorschrift
      toegekende taken en bevoegdheden, waarvan het bevoegd gezag heeft bepaald dat de directeur van de school of
      indien toepassing is gegeven aan [artikel 29, vijfde lid][ref5], het in dat artikellid bedoelde personeel
      voor zover dat is belast met managementtaken met betrekking tot de scholen en de scholen, bedoeld in de
      [Wet op het primair onderwijs][ref6] deze in naam van het bevoegd gezag kan uitoefenen. Het managementstatuut bevat
      voorts instructies ten aanzien van deze taken en bevoegdheden.

      3 In het managementstatuut worden tevens vastgelegd:

      a. de taken en bevoegdheden die het bestuur overdraagt aan de directeur van de school of indien toepassing is
      gegeven aan [artikel 29, vijfde lid][ref7], het in dat artikellid bedoelde personeel voor zover dat is belast met
      managementtaken met betrekking tot de scholen en de scholen, bedoeld in de [Wet op het primair onderwijs][ref8],
      indien toepassing is gegeven aan [artikel 30a, eerste lid][ref9];

      b. de taken en bevoegdheden die de directeur van de school of indien toepassing is gegeven aan
      [artikel 29, vijfde lid][ref10], het in dat artikellid bedoelde personeel voor zover dat is belast met
      managementtaken met betrekking tot de scholen en de scholen, bedoeld in de [Wet op het primair onderwijs][ref11]
      overdraagt aan de adjunct-directeur, indien toepassing is gegeven aan [artikel 30a, tweede lid][ref12]; en

      c. de richtlijnen voor de uitoefening van de overgedragen taken en bevoegdheden.

      4 Het bevoegd gezag draagt er zorg voor dat een exemplaar van het managementstatuut in het gebouw van de school
      ter inzage beschikbaar is op een voor een ieder toegankelijke plaats. Het bevoegd gezag zendt een exemplaar van
      het managementstatuut, alsmede elke wijziging daarvan, zo spoedig mogelijk na de vaststelling ter kennisneming aan
      de inspectie.


