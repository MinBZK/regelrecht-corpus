  - number: '52'
    text: |-
      1 De rechtspersoon die een openbare school in stand houdt, kan de instandhouding van die school overdragen aan
      een andere rechtspersoon die tot instandhouding van een openbare school bevoegd is. De overdracht geschiedt bij
      notariële akte.

      2 Bij deze akte verbindt de overdragende rechtspersoon zich tevens de rechten ten aanzien van gebouwen en
      terreinen alsmede de roerende zaken over te dragen. Deze akte geldt tevens als akte van levering als bedoeld in
      [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref1].

      3 In de akte wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen
      en onder dezelfde voorwaarden als vermeld in de akte van aanstelling, aan de school aanstelt met ingang van de
      datum van overdracht.

      4 Door overdracht met inachtneming van de voorgaande leden, treedt de verkrijgende rechtspersoon in alle uit de wet
      voortvloeiende rechten en verplichtingen die zijn rechtsvoorganger bezit in zijn hoedanigheid van bevoegd gezag,
      onverminderd hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: '53'
    text: |-
      Het bevoegd gezag stelt de leerlingen in de gelegenheid op de school, binnen de schooltijden, godsdienstonderwijs
      of levensbeschouwelijk vormingsonderwijs te ontvangen. Van de tijd daaraan te besteden, worden ten hoogste 120 uren
      per schooljaar meegeteld voor het aantal uren onderwijs dat de leerlingen krachtens [artikel 11, vierde lid][ref1],
      ten minste moeten ontvangen. Voor de leerlingen die dit onderwijs niet volgen, voorziet het bevoegd gezag in andere
      onderwijsactiviteiten op de school.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel11
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '11'
        paragraaf: '1'
        afdeling: '1'
  - number: '54'
    text: |-
      Godsdienstonderwijs wordt gegeven door leraren daartoe aangewezen door kerkelijke gemeenten, plaatselijke kerken,
      of rechtspersonen met volledige rechtsbevoegdheid die zich blijkens hun statuten het geven van godsdienstonderwijs
      ten doel stellen. Levensbeschouwelijk vormingsonderwijs wordt gegeven door leraren daartoe aangewezen door
      volledige rechtsbevoegdheid bezittende organisaties op geestelijke grondslag.

      Het bevoegd gezag ziet erop toe dat dit onderwijs uitsluitend wordt gegeven door een leraar die blijkens een
      daartoe strekkende verklaring van de aanwijzende instantie:

      a. voldoet aan de bekwaamheidseisen die krachtens artikel 32a, eerste lid, voor het geven van dat onderwijs zijn
      vastgesteld, en

      b. zijn bekwaamheid onderhoudt.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel54
  - number: '55'
    text: |-
      In afwijking van [artikel 33, derde lid][ref1], zijn Gedeputeerde Staten van de desbetreffende provincie bevoegd de
      disciplinaire straf of de schorsing op te leggen dan wel het ontslag te verlenen, indien het betreft een directeur,
      een adjunct-directeur, of een ander lid van het onderwijzend personeel van een openbare school en deze tevens lid
      is van de raad van de gemeente die de school in stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel33
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '33'
        paragraaf: '2'
        afdeling: '1'
  - number: '56'
    text: |-
      1 Ieder personeelslid is in het bezit van een door het bevoegd gezag getekende akte van aanstelling. De akte van
      aanstelling bevat in elk geval:

      a. de naam en het adres van het bevoegd gezag;

      b. de naam, de voornamen en de geboortedatum van de betrokkene;

      c. de datum van ingang van de aanstelling;

      d. de functie waarin de betrokkene wordt aangesteld;

      e. de omvang van de betrekking;

      f. de bepaling of de aanstelling in vaste of in tijdelijke dienst geschiedt en in het laatste geval de gronden voor
      de tijdelijkheid en de duur van de aanstelling;

      g. de op de dag van zijn aanstelling van toepassing zijnde schaal en het salarisnummer;

      h. de bepaling dat de betrokkene werkzaam zal zijn in algemene dienst van het bevoegd gezag;

      i. voor de personeelsleden die bij de uitoefening van hun functie kennis nemen van persoonlijke gegevens van
      leerlingen, voorschriften omtrent geheimhouding daarvan, voor zover een geheimhoudingsplicht niet reeds uit anderen
      hoofde is verzekerd.

      2 Het bevoegd gezag draagt zorg dat afschriften van de bewijsstukken waarmee de bekwaamheid wordt aangetoond, de
      geschiktheidsverklaringen, van de verklaringen omtrent het gedrag, alsmede van de akten van aanstelling van het aan
      de school verbonden personeel worden bewaard.

      3 De aanstelling van de adjunct-directeur en de leraren geschiedt, de directeur gehoord.

      4 Het eerste lid, aanhef en onder i, alsmede het tweede en derde lid, zijn van overeenkomstige toepassing op
      personeel dat is tewerkgesteld zonder aanstelling.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel56
  - number: '57'
    text: |-
      Een bijzondere school wordt in stand gehouden door een rechtspersoon met volledige rechtsbevoegdheid die zich
      blijkens de statuten of reglementen het geven van onderwijs ten doel stelt zonder daarbij het maken van winst te
      beogen.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel57
  - number: '58'
    text: |-
      1 De rechtspersoon die de school in stand houdt, kan de instandhouding van de school overdragen aan een andere
      rechtspersoon die voldoet aan [artikel 57][ref1]. De overdracht geschiedt bij notariële akte.

      2 Bij deze akte verbindt de overdragende rechtspersoon zich tevens de rechten ten aanzien van gebouwen en
      terreinen, alsmede de roerende zaken over te dragen. Deze akte geldt tevens als akte van levering bedoeld in
      [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref2].

      3 In de akte wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen
      en onder dezelfde voorwaarden als vermeld in de akte van benoeming, benoemt met ingang van de datum van overdracht.

      4 Door de overdracht met inachtneming van de voorgaande leden, treedt de verkrijgende rechtspersoon in alle uit de
      wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de school, onverminderd
      hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.

      5 Bij een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref3] van een rechtspersoon
      die een school in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande splitsende rechtspersoon de
      school in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van de school overgaat. In het
      laatste geval zijn het tweede tot en met vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel89
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel58
