      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel170
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
      [ref5]: https://wetten.overheid.nl/BWBR0020495#Artikel18
