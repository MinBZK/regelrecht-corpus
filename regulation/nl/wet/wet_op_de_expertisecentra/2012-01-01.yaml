  - number: '79'
    text: |-
      1 Behoudens het bepaalde in het tweede lid worden in elk plan de scholen uit het voorafgaande plan opgenomen die:

      a. nog niet voor bekostiging in aanmerking zijn gebracht;

      b. voor bekostiging in aanmerking zijn gebracht, maar waaraan het onderwijs nog niet is aangevangen.

      2 Uit het voorafgaande plan wordt een school niet opgenomen:

      a. indien de indiener van een verzoek heeft gevraagd de school te laten vervallen;

      b. indien aan een bijzondere school het onderwijs niet is aangevangen in het tweede jaar volgend op het jaar
      waarvoor de school het eerst voor bekostiging in aanmerking is gebracht, tenzij opneming in het plan op grond van
      de bij een nieuw verzoek overgelegde gegevens gerechtvaardigd is;

      c. indien zich naar het oordeel van provinciale staten omstandigheden hebben voorgedaan die bij de vaststelling van
      het plan niet bekend waren en die, waren zij wel bekend geweest, tot een ander besluit zouden hebben geleid.

      3 Indien beroep is ingesteld tegen een besluit krachtens het tweede lid, onderdeel c, en de uitspraak strekt tot
      opneming van een school in het plan, nemen provinciale staten de school op in het eerste na de uitspraak vast te
      stellen plan.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel79
  - number: '80'
    text: |-
      1 De vaststelling van een plan blijft achterwege, indien:

      a. geen verzoeken om opneming in het plan zijn ingekomen of geen der ingekomen verzoeken voor inwilliging in
      aanmerking komt,

      b. provinciale staten besluiten dat vermeerdering van het aantal openbare scholen in de planperiode niet
      noodzakelijk is en

      c. geen scholen uit het voorafgaande plan voor opneming in het plan in aanmerking komen.

      2 Het besluit bedoeld in het eerste lid onder b, behoeft de goedkeuring van Onze minister. Het wordt voor 1
      augustus voorafgaande aan de betrokken planperiode aan Onze minister gezonden. [Artikel 84, derde lid][ref1], is
      van overeenkomstige toepassing.

      3 Indien een besluit van de minister, houdende weigering van de goedkeuring onherroepelijk is geworden, nemen
      provinciale staten de openbare school op in het eerste na een zodanig besluit vast te stellen plan.

      4 Aan de indieners van de niet ingewilligde verzoeken bedoeld in het eerste lid onder a, wordt voor 15 augustus
      voorafgaande aan de betrokken planperiode afschrift gezonden van het desbetreffende besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel84
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '84'
        afdeling: '2'
  - number: '81'
    text: |-
      1 Een verzoek om opneming in het plan wordt voor 1 februari van het jaar van de vaststelling van het plan, bij
      gedeputeerde staten ingediend door de gemeenteraad of door ouders, indien het een openbare school betreft, en door
      het bevoegd gezag, indien het een bijzondere school betreft.

      2 Elk verzoek is met redenen omkleed en gaat vergezeld van:

      a. een prognose van het te verwachten aantal leerlingen,

      b. de beschrijving van het voedingsgebied,

      c. de aanduiding van de plaats waar het onderwijs moet worden gegeven,

      d. de voorgestelde datum van ingang van de bekostiging en

      e. indien het een school voor meervoudig gehandicapte kinderen betreft, een opgave van de handicaps van de
      leerlingen waarvoor de school is bestemd.

      [Artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '82'
    text: |-
      Indien gedeputeerde staten van oordeel zijn dat een andere school dan gevraagd wordt, dan wel een andere plaats van
      vestiging meer in overeenstemming is met een evenwichtig geheel van onderwijsvoorzieningen in de provincie, treden
      zij, alvorens het plan ter vaststelling voor te dragen, in overleg met de aanvrager.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel82
  - number: '83'
    text: |-
      1 In het plan worden in elk geval opgenomen de scholen waarvan redelijkerwijs kan worden aangenomen dat zij, gelet
      op de belangstelling voor de desbetreffende schoolsoort en op het leerlingenverloop, blijkens statistische gegevens
      zullen worden bezocht door ten minste het volgende aantal leerlingen:

      a. de school voor speciaal onderwijs: 60 leerlingen;

      b. de school voor voortgezet speciaal onderwijs: 42 leerlingen;

      c. de school voor speciaal en voortgezet speciaal onderwijs: 81 leerlingen;

      d. de afdeling: 15 leerlingen.

      Tot het totaal aantal leerlingen bedoeld onder c, behoren ten minste 21 leerlingen die in aanmerking komen voor het
      volgen van voortgezet speciaal onderwijs.

      2 In het plan kunnen scholen worden opgenomen waarvan redelijkerwijs kan worden aangenomen dat zij, gelet op de
      belangstelling voor de desbetreffende schoolsoort en op het leerlingenverloop, blijkens statistische gegevens
      zullen worden bezocht door ten minste het volgende aantal leerlingen:

      a. de school voor speciaal onderwijs: 40 leerlingen;

      b. de school voor voortgezet speciaal onderwijs: 32 leerlingen;

      c. de school voor speciaal en voortgezet speciaal onderwijs: 55 leerlingen;

      d. de afdeling: 10 leerlingen.

      Tot het aantal leerlingen bedoeld onder c behoren ten minste 14 leerlingen die in aanmerking komen voor het volgen
      van voortgezet speciaal onderwijs.

      3 Bij de toepassing van het eerste en het tweede lid worden niet in aanmerking genomen:

      a. de leerlingen voor wie binnen redelijke afstand plaatsruimte beschikbaar zal zijn op een gelijksoortige school
      waar het verlangde onderwijs wordt gegeven, tenzij deze school uitsluitend voor interne leerlingen is bestemd;

      b. leerlingen die in een andere provincie woonachtig zijn en bij de vaststelling van een plan in die provincie in
      aanmerking worden genomen.

      4 Tegen een besluit van provinciale staten om een verzoek tot opneming in het plan van een bijzondere of een
      openbare school niet in te willigen, kan iedere belanghebbende administratief beroep instellen bij Onze minister.

      5 Indien een onherroepelijk geworden beslissing in beroep of een uitspraak naar aanleiding van de beslissing in
      beroep, dan wel het naar aanleiding daarvan genomen besluit van Onze minister strekt tot het voor bekostiging
      in aanmerking brengen van de school, nemen provinciale staten de school op in het na de beslissing in beroep, de
      uitspraak of het besluit vast te stellen plan.
    url: https://wetten.overheid.nl/BWBR0003549/2012-01-01#Artikel83
  - number: '84'
    text: |-
      1 Aan het plan wordt toegevoegd een overzicht van de verzoeken die niet zijn ingewilligd en de motivering daarvan.
      Deze stukken worden door gedeputeerde staten binnen 2 weken na de vaststelling van het plan aan alle verzoekers
      gezonden met vermelding van de datum waarop het plan ter goedkeuring aan Onze minister is gezonden. Het plan wordt
      binnen 2 weken na de vaststelling voor een periode van 6 weken ter inzage gelegd op de provinciale griffie.

      2 Binnen 2 weken na de vaststelling wordt het plan ter goedkeuring aan Onze minister gezonden.
      Het gaat vergezeld van de ingewilligde verzoeken en het overzicht bedoeld in het eerste lid.
      [Artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing.

      3 Onze minister besluit met inachtneming van het beroepschrift bedoeld in [artikel 83, vierde lid][ref2], voor
      1 december van het jaar voorafgaande aan de planperiode. Afschrift van het besluit wordt binnen 2 weken aan
      provinciale staten gezonden. Indien Onze minister niet voor 1 december heeft besloten, wordt het plan geacht te
      zijn goedgekeurd.

      4 Onze minister onthoudt zijn goedkeuring indien en voor zover:

      a. provinciale staten ten onrechte vermeerdering van het aantal openbare scholen in de planperiode niet
      noodzakelijk hebben geacht;

      b. opneming van een school in het plan niet noodzakelijk is omdat de opnamecapaciteit van de bestaande
      onderwijsvoorzieningen toereikend is dan wel niet in overeenstemming is met het tot stand brengen van een
      evenwichtig geheel van onderwijsvoorzieningen, tenzij redelijkerwijs kan worden aangenomen dat de school zal worden
      bezocht door het in [artikel 83, eerste lid][ref3], bedoelde aantal leerlingen;

      c. is uitgegaan van kennelijk ondeugdelijke prognoses;

      d. ten aanzien van een op het plan geplaatste school ten onrechte niet is bepaald dat zij voor bekostiging in
      aanmerking komt in het eerste jaar van de planperiode.

      5 Bij onthouding van de goedkeuring op grond van het vierde lid onder a draagt Onze minister provinciale staten op
      alsnog een openbare school in het plan op te nemen.

      6 Bij onthouding van goedkeuring op grond van het vierde lid onder d draagt Onze minister provinciale staten op de
      bekostiging van de school in het eerste jaar van de planperiode in het plan op te nemen.

      7 Indien ten gevolge van een besluit op grond van het vierde lid een school uit het plan moet vervallen, deelt
      Onze minister dit besluit binnen 2 weken mee aan de indiener van het verzoek om opneming van de betrokken school in
      het plan.

      8 Indien in beroep tegen het besluit van Onze Minister, bedoeld in het zevende lid, is bepaald dat de uitspraak van
      de rechter, dan wel het besluit naar aanleiding van die uitspraak, strekt tot opneming van een school in het plan,
      nemen provinciale staten de school op in het eerste na de uitspraak vast te stellen plan.

      9 Zodra het plan onherroepelijk is vastgesteld, dragen gedeputeerde staten zorg voor bekendmaking in de
      Staatscourant en het provinciaal blad.

      10 Zodra de bekostiging van een in het plan opgenomen school een aanvang kan nemen, besluit Onze minister bij
      beschikking, met ingang van welk tijdstip dit kan geschieden.


