  - number: '165'
    text: |-
      1 Indien een bij of krachtens de wet gestelde termijn door het bevoegd gezag wordt overschreden en de gemeente
      daardoor geen bekostiging van het Rijk dan wel lagere bekostiging of met ingang van een latere datum bekostiging
      van het Rijk ontvangt dan het geval zou zijn geweest indien deze termijn wel in acht was genomen, vergoedt het
      bevoegd gezag de door de gemeente geleden schade.

      2 Indien een bij of krachtens de wet gestelde termijn door het college van burgemeester en wethouders wordt
      overschreden en het bevoegd gezag daardoor geen bekostiging van het Rijk dan wel lagere bekostiging of met ingang
      van een latere datum bekostiging van het Rijk ontvangt dan het geval zou zijn geweest indien deze termijn in acht
      was genomen, vergoedt de gemeente de door het bevoegd gezag geleden schade.

      3 Het college van burgemeester en wethouders en het bevoegd gezag kunnen in onderling overleg de in het eerste en
      tweede lid bedoelde verplichting tot schadevergoeding matigen. Indien dit overleg niet tot overeenstemming leidt,
      is [artikel 109 van boek 6 van het Burgerlijk Wetboek][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel109
