  - number: 71a
    text: |-
      1 Het bevoegd gezag dat op zijn school, niet zijnde een instelling, onderwijs
      verzorgt aan leerlingen die zijn opgenomen in inrichtingen als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref1] en gesloten accommodaties
      als bedoeld in [artikel 6.2.2 van de Jeugdwet][ref2], wordt in aanmerking gebracht voor bekostiging op grond
      van [artikel 113][ref3] en [artikel 116, vijfde lid][ref4], indien het bevoegd gezag met die inrichting of
      accommodatie een samenwerkingsovereenkomst heeft gesloten.

      2 Het bevoegd gezag dat op zijn school niet zijnde een instelling, onderwijs verzorgt aan leerlingen
      van een residentiële instelling wordt per vestiging in aanmerking gebracht voor bekostiging op grond van
      [artikel 113][ref5] en [artikel 116, vierde lid][ref6], indien het bevoegd gezag met die residentiële instelling
      een samenwerkingsovereenkomst heeft gesloten. Onder een residentiële instelling als bedoeld in de eerste volzin
      wordt verstaan een instelling voor gehandicaptenzorg, jeugdhulpverlening of jeugdgezondheidszorg niet zijnde een
      inrichting of accommodatie, bedoeld in het eerste lid, waarbij behandeling of opvang en onderwijs vanuit één plan
      noodzakelijk is vanwege de aard of de duur van de behandeling of opvang.

      3 Het bevoegd gezag doet Onze Minister binnen een maand na de totstandkoming van de overeenkomst dan wel de
      beëindiging ervan een afschrift toekomen van de overeenkomst dan wel deelt de datum waarop de overeenkomst is
      beëindigd mee.


