  - number: '100'
    text: |-
      1 De gemeenteraad stelt bij verordening een regeling vast met betrekking tot:

      a. de voorzieningen die ingevolge [artikel 90][ref1] voor bekostiging in aanmerking kunnen worden gebracht,

      b. de oppervlakte en de indeling van schoolgebouwen,

      c. de urgentiecriteria,

      d. de prognosecriteria,

      e. de termijn bedoeld in [artikel 97][ref2],

      f. de procedure met betrekking tot verhuur en het medegebruik van ruimten voor het onderwijs,

      g. de termijn gedurende welke een gebouw of terrein voor een school of nevenvestiging nog ten hoogste kan worden
      gebruikt bij toepassing van [artikel 108][ref3], alsmede de procedure in verband met een eventueel op te maken
      staat van onderhoud, en

      h. de gegevens bedoeld in [artikel 110][ref4],

      i. de wijze waarop het aantal groepen leerlingen, bedoeld in de [artikelen 120][ref5] en [121][ref6] voor scholen
      en instellingen wordt vastgesteld.

      2 De regeling wordt zodanig vastgesteld dat kan worden voldaan aan de redelijke eisen die het onderwijs aan de
      huisvesting van scholen in de gemeente stelt.

      3 De gemeenteraad stelt normen vast aan de hand waarvan de bedragen worden vastgesteld voor de toegekende
      voorzieningen in de huisvesting.

      4 Het college van burgemeester en wethouders betaalt volgens door het college van burgemeester en wethouders te
      stellen regels de bedragen aan de hand van de door de gemeenteraad gestelde normen.

      5 De gemeenteraad stelt de regeling, bedoeld in het eerste lid, dan wel een wijziging daarvan, niet vast dan nadat
      daarover op overeenstemming gericht overleg is gevoerd met door de bevoegde gezagsorganen van de niet door de
      gemeente in stand gehouden scholen in de gemeente aan te wijzen vertegenwoordigers. De gemeenteraad stelt daartoe
      een procedure vast.

      6 Tijdens het in het vijfde lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit te
      brengen over de vaststelling of wijziging van de gemeentelijke verordening in relatie tot de vrijheid van richting
      en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd dan wel uit
      eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies
      wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekend gemaakt tezamen met de verordening
      of de wijziging daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel97
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel108
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel110
      [ref5]: https://wetten.overheid.nl/BWBR0003549#Artikel120
      [ref6]: https://wetten.overheid.nl/BWBR0003549#Artikel121
