  - number: '40'
    text: |-
      1 De beslissing over toelating en verwijdering van leerlingen berust bij het bevoegd gezag. De toelating mag niet
      afhankelijk worden gesteld van een geldelijke bijdrage van de ouders.

      2 Tot de school wordt uitsluitend als leerling toegelaten degene waarvan de ouders aantonen, dan wel, indien hij
      meerderjarig en handelingsbekwaam is, degene die aantoont dat hij:

      a. de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,

      b. vreemdeling is en jonger is dan 18 jaar op de eerste schooldag waarop het speciaal onderwijs, dan wel het
      voortgezet speciaal onderwijs begint, waarvoor voor de eerste maal toelating wordt gewenst,

      c. vreemdeling is, 18 jaar of ouder is op de eerste schooldag waarop het speciaal onderwijs, dan wel het voortgezet
      speciaal onderwijs begint, waarvoor voor de eerste maal toelating wordt gewenst en op die dag rechtmatig verblijf
      houdt in de zin van [artikel 8 van de Vreemdelingenwet 2000][ref1], of

      d. vreemdeling is, niet meer voldoet aan een van de voorwaarden, genoemd onder b of c, en eerder in overeenstemming
      met een van die onderdelen voor speciaal onderwijs, dan wel voortgezet speciaal onderwijs is toegelaten tot een
      school, welk onderwijs nog steeds wordt gevolgd en nog niet is voltooid.

      3 De aanmelding van kinderen voor toelating geschiedt schriftelijk en kan worden gedaan vanaf de
      dag waarop het kind de leeftijd van 3 jaar bereikt. Indien het betreft een kind als bedoeld in
      [artikel 2, tweede lid onder a of b][ref2], kan de aanmelding worden gedaan vanaf de dag waarop het kind de
      leeftijd van 2 jaar bereikt. De ouders doen de aanmelding zo mogelijk ten minste 10 weken voor de datum waarop
      toelating wordt gevraagd en geven bij de aanmelding aan bij welke school of scholen eveneens om toelating is
      verzocht.

      4 Het bevoegd gezag beoordeelt of de aanmelding een kind betreft dat extra ondersteuning behoeft. Hiertoe
      kan het bevoegd gezag de ouders verzoeken gegevens te overleggen betreffende stoornissen of handicaps van het
      kind of beperkingen in de onderwijsparticipatie. Onder extra ondersteuning wordt niet verstaan ondersteuning
      ter bevordering van de beheersing van de Nederlandse taal met het oog op het voorkomen en bestrijden van
      onderwijsachterstanden.

      5 Indien de toelating van een leerling die extra ondersteuning behoeft, wordt geweigerd, vindt de weigering niet
      plaats dan nadat het bevoegd gezag er, na overleg met de ouders en met inachtneming van de ondersteuningsbehoefte
      van de leerling en het ondersteuningsaanbod van de betrokken scholen, voor heeft zorg gedragen dat een andere
      school bereid is de leerling toe te laten. Onder andere school kan ook worden verstaan een basisschool, een
      speciale school voor basisonderwijs, een school voor voortgezet onderwijs of een instelling als bedoeld in
      [artikel 1, onder c, van de Leerplichtwet 1969][ref3].

      6 Het vierde en vijfde lid zijn niet van toepassing:

      a. indien op de school waar de leerling is aangemeld geen plaatsruimte beschikbaar is, of

      b. indien het bevoegd gezag de ouders bij de aanmelding verzoekt te verklaren dat zij de grondslag van het
      onderwijs op de school zullen respecteren dan wel te verklaren dat zij de grondslag van het onderwijs op de school
      zullen onderschrijven, en de ouders dit weigeren te verklaren.

      7 Het bevoegd gezag neemt de beslissing over toelating van een leerling zo spoedig mogelijk doch uiterlijk 6
      weken na ontvangst van de aanmelding. Indien de beslissing, bedoeld in de vorige volzin, niet binnen 6 weken kan
      worden gegeven, deelt het bevoegd gezag dit aan de ouders mede en noemt het daarbij een zo kort mogelijke termijn
      waarbinnen de beslissing wel tegemoet kan worden gezien, welke termijn ten hoogste 4 weken bedraagt.

      8 Indien de aanmelding voor een school voor speciaal onderwijs, een school voor speciaal en voortgezet speciaal
      onderwijs of een instelling voor wat betreft het daaraan verzorgde speciaal onderwijs, een kind betreft
      dat niet is ingeschreven op een andere zodanige school of instelling of op een school als bedoeld in de
      [Wet op het primair onderwijs][ref4], en de beslissing over de toelating is 10 weken na de dag waarop het verzoek
      om toelating is gedaan nog niet genomen, wordt het kind met ingang van de dag volgend op bedoelde 10 weken, doch
      niet eerder dan de datum waarop het kind de leeftijd heeft bereikt om te kunnen worden toegelaten tot de school,
      tijdelijk geplaatst op de school en als leerling ingeschreven. Indien de leerling wordt toegelaten, wordt de
      tijdelijke plaatsing omgezet in een definitieve plaatsing. Indien de toelating van de leerling wordt geweigerd of
      een beslissing wordt genomen de aanmelding niet te behandelen, wordt de tijdelijke plaatsing beëindigd en wordt
      de leerling uitgeschreven met ingang van de dag die volgt op de dag waarop de toelating wordt geweigerd of de
      beslissing wordt genomen de aanmelding niet te behandelen.

      9 Indien de aanmelding voor een school voor voortgezet speciaal onderwijs, een school voor speciaal en voortgezet
      speciaal onderwijs of een instelling voor wat betreft het daaraan verzorgde voortgezet speciaal onderwijs, een
      leerling betreft die niet is ingeschreven op een andere zodanige school of instelling of op een school als bedoeld
      in de [Wet voortgezet onderwijs 2020][ref5], en de beslissing over de toelating is 10 weken na de dag waarop het
      verzoek om toelating is gedaan nog niet genomen, wordt het kind met ingang van de dag volgend op bedoelde 10 weken,
      doch niet eerder dan de datum waarop de leerling voldoet aan de voorwaarden om te kunnen worden toegelaten tot de
      school, tijdelijk geplaatst op de school en als leerling ingeschreven. Indien de leerling wordt toegelaten, wordt
      de tijdelijke plaatsing omgezet in een definitieve plaatsing. Indien de toelating van de leerling wordt geweigerd
      of een beslissing wordt genomen de aanmelding niet te behandelen, wordt de tijdelijke plaatsing beëindigd en wordt
      de leerling uitgeschreven met ingang van de dag die volgt op de dag waarop de toelating wordt geweigerd of de
      beslissing wordt genomen de aanmelding niet te behandelen.

      10 Een leerling wordt niet toegelaten tot een school voor speciaal onderwijs of tot een school voor speciaal en
      voortgezet speciaal onderwijs voor wat betreft het daaraan verzorgde speciaal onderwijs, behorend tot cluster 3 of
      cluster 4, dan nadat de leerling toelaatbaar is verklaard tot het speciaal onderwijs.

      11 De beslissing over toelaatbaarheid, bedoeld in het tiende lid, wordt genomen:

      a. indien de leerling onmiddellijk voorafgaand aan de toelating was ingeschreven op een school als bedoeld in
      de [Wet op het primair onderwijs][ref6] of een school voor speciaal onderwijs of speciaal en voortgezet speciaal
      onderwijs behorend tot cluster 3 en 4: door het samenwerkingsverband waartoe die school behoort;

      b. indien de leerling onmiddellijk voorafgaand aan de toelating niet was ingeschreven op een school als bedoeld in
      de [Wet op het primair onderwijs][ref7] of een school voor speciaal onderwijs of speciaal en voortgezet speciaal
      onderwijs behorend tot cluster 3 en 4 en de leerling was aangemeld bij een school, niet zijnde een instelling, of
      een school als bedoeld in de Wet op het primair onderwijs, die behoort tot een samenwerkingsverband als bedoeld in
      [artikel 18a, tweede lid, van de Wet op het primair onderwijs][ref8]:

      1. door het samenwerkingsverband in het gebied waarvan de leerling woonachtig is, indien de leerling woonachtig is
      in Nederland;

      2. door het samenwerkingsverband waartoe de school, niet zijnde een instelling, waarvoor toelating wordt verzocht
      behoort, indien de leerling buiten Nederland woonachtig is;

      c. indien de leerling onmiddellijk voorafgaand aan de toelating niet was ingeschreven op een school als bedoeld in
      de [Wet op het primair onderwijs][ref9] of een school voor speciaal onderwijs of speciaal en voortgezet speciaal
      onderwijs behorend tot cluster 3 en 4 en de leerling was aangemeld bij een school, niet zijnde een instelling,
      of een school als bedoeld in de Wet op het primair onderwijs, die behoort tot een landelijk samenwerkingsverband
      als bedoeld in [artikel 18a, vijftiende lid, van de Wet op het primair onderwijs][ref10]: door het landelijk
      samenwerkingsverband waartoe de school, niet zijnde een instelling, of de school, bedoeld in de Wet op het primair
      onderwijs, waar de leerling was aangemeld behoort.

      12 Een leerling wordt niet toegelaten tot een school voor voortgezet speciaal onderwijs of tot een school voor
      speciaal en voortgezet speciaal onderwijs voor wat betreft het daaraan verzorgde voortgezet speciaal onderwijs,
      behorend tot cluster 3 of cluster 4, dan nadat de leerling toelaatbaar is verklaard tot het voortgezet speciaal
      onderwijs.

      13 De beslissing over de toelaatbaarheid, bedoeld in het twaalfde lid, wordt genomen

      a. indien de leerling onmiddellijk voorafgaand aan de toelating was ingeschreven op een school als bedoeld in de
      [Wet voortgezet onderwijs 2020][ref11] of een school voor voortgezet speciaal onderwijs of speciaal en voortgezet
      speciaal onderwijs behorend tot cluster 3 en 4: door het samenwerkingsverband waartoe die school behoort;

      b. indien de leerling onmiddellijk voorafgaand aan de toelating niet was ingeschreven op een school als bedoeld in
      de [Wet voortgezet onderwijs 2020][ref12] of een school voor speciaal onderwijs of speciaal en voortgezet speciaal
      onderwijs behorend tot cluster 3 en 4 en de leerling was aangemeld bij een school, niet zijnde een instelling, of
      een school, bedoeld in de Wet op het voortgezet onderwijs, die behoort tot een samenwerkingsverband als bedoeld in
      [artikel 2.47, tweede lid, van de Wet voortgezet onderwijs 2020][ref13]:

      1. door het samenwerkingsverband in het gebied waarvan de leerling woonachtig is, indien de leerling woonachtig is
      in Nederland;

      2. door het samenwerkingsverband waartoe de school, niet zijnde een instelling, waarvoor toelating wordt verzocht
      behoort, indien de leerling buiten Nederland woonachtig is:

      c. indien de leerling onmiddellijk voorafgaand aan de toelating niet was ingeschreven op een school als bedoeld in
      de [Wet voortgezet onderwijs 2020][ref14] of een school voor voortgezet speciaal onderwijs of speciaal en voortgezet
      speciaal onderwijs behorend tot cluster 3 en 4 en de leerling was aangemeld bij een school, niet zijnde een
      instelling, of een school als bedoeld in de [Wet voortgezet onderwijs 2020][ref15], die behoort tot een landelijk
      samenwerkingsverband als bedoeld in [artikel 2.47, achttiende lid, van de Wet voortgezet onderwijs 2020][ref16]:
      door het landelijk samenwerkingsverband waartoe de school, niet zijnde een instelling, of de school, bedoeld in de
      Wet op het voortgezet onderwijs, waar de leerling was aangemeld behoort.

      14 De beslissing over de toelaatbaarheid, bedoeld in het tiende en twaalfde lid, is geen besluit als bedoeld
      in [artikel 8:4, derde lid, onder b, van de Algemene wet bestuursrecht][ref17]. Indien de leerling onmiddellijk
      voorafgaand aan de toelating was ingeschreven op een school voor voortgezet speciaal onderwijs of speciaal
      en voortgezet speciaal onderwijs behorend tot cluster 3 en 4 op grond van een toelaatbaarheidsverklaring
      waarvan de periode, bedoeld in het vijftiende lid, bij de toelating nog niet is verstreken, is geen nieuwe
      toelaatbaarheidsverklaring vereist.

      15 De toelaatbaarheidsverklaring, bedoeld in het tiende onderscheidenlijk twaalfde lid, heeft betrekking op een
      periode van één of meer schooljaren. Indien de toelaatbaarheidsverklaring in de loop van een schooljaar wordt
      gegeven, wordt de periode tot de eerste dag van het eerstvolgende schooljaar toegevoegd aan de in de eerste
      volzin bedoelde periode. In het laatste schooljaar waarop de toelaatbaarheidsverklaring betrekking heeft,
      draagt het bevoegd gezag van de school er zorg voor dat terugplaatsing of overplaatsing van de leerling naar
      het basisonderwijs of voortgezet onderwijs plaatsvindt, tenzij het bevoegd gezag van oordeel is dat voortgezet
      verblijf van de leerling in het speciaal onderwijs dan wel voortgezet speciaal onderwijs noodzakelijk is en het
      samenwerkingsverband, bedoeld in het tiende onderscheidenlijk twaalfde lid, een nieuwe toelaatbaarheidsverklaring
      heeft verstrekt.

      16 Een leerling die is geplaatst in een inrichting, accommodatie of residentiële instelling en die wordt toegelaten
      op basis van de bekostiging, bedoeld in [artikel 116, vierde of vijfde lid][ref18], wordt door die plaatsing
      en voor de duur daarvan aangemerkt als een leerling die toelaatbaar is verklaard tot de school voor speciaal
      onderwijs, voortgezet speciaal onderwijs of tot de school voor speciaal en voortgezet speciaal onderwijs, behorend
      tot cluster 3 of cluster 4, die aan die inrichting of accommodatie is verbonden dan wel waarmee die residentiële
      instelling een samenwerkingsovereenkomst heeft gesloten. In de administratie van de school is over een leerling die
      wordt toegelaten op basis van bekostiging als bedoeld in [artikel 116, vierde lid][ref19], een verklaring aanwezig
      van de residentiële instelling dat de leerling in die instelling is geplaatst. Indien een leerling is toegelaten
      tot een school die is verbonden aan een instelling als bedoeld in [artikel 71a, eerste lid][ref20], maakt die
      school afspraken met het samenwerkingsverband waartoe de leerling behoorde direct voorafgaand aan de toelating tot
      de school, over de terugkeer van de leerling.

      17 De toelating van een leerling mag niet geweigerd worden op denominatieve gronden, tenzij de ouders van de
      leerling weigeren te verklaren dat zij de grondslag van het onderwijs van de school zullen respecteren dan wel
      onderschrijven.

      18 Voordat wordt besloten tot verwijdering hoort het bevoegd gezag de betrokken leraar of leraren en de ouders
      van de leerling. Definitieve verwijdering van een leerling waarop de [Leerplichtwet 1969][ref21] van toepassing
      is, vindt niet plaats dan nadat het bevoegd gezag ervoor heeft zorggedragen dat een basisschool, een speciale
      school voor basisonderwijs, een school voor speciaal onderwijs, een school voor speciaal en voortgezet speciaal
      onderwijs, een school voor voortgezet speciaal onderwijs, een instelling, een school voor voortgezet onderwijs dan
      wel een instelling als bedoeld in [artikel 1, onder c, van de Leerplichtwet 1969][ref22] bereid is de leerling toe
      te laten. Indien het betreft een leerling van een instelling behorend tot cluster 1 of 2 kan, in afwijking van de
      vorige volzin, tot definitieve verwijdering worden overgegaan indien aantoonbaar gedurende 8 weken zonder succes
      is gezocht naar een zodanige school of instelling waarnaar kan worden verwezen. Indien het betreft een leerling
      van een school als bedoeld in [artikel 71a, eerste lid][ref23], wordt in afwijking van de tweede volzin, tot
      definitieve verwijdering overgegaan indien de leerling niet langer is opgenomen in de inrichting of accommodatie,
      bedoeld in genoemde bepaling.

      19 Indien na de toelating tot de school blijkt dat deze op welke grond dan ook niet in overeenstemming met het
      tweede lid heeft plaatsgevonden, wordt de leerling onmiddellijk verwijderd.

      20 Indien tegen een besluit van het bevoegd gezag van een openbare school ingevolge het eerste, tweede, vijfde,
      zevende, achtste, negende, tiende, twaalfde, zeventiende, achttiende of negentiende lid, bezwaar is gemaakt,
      besluit het bevoegd gezag in afwijking van [artikel 7:10 van de Algemene wet bestuursrecht][ref24] binnen 4 weken
      gerekend vanaf de dag na die waarop de termijn voor het indienen van het bezwaarschrift is verstreken.

      21 Het bevoegd gezag van een openbare school besluit niet op het bezwaarschrift, dan na overleg met de inspecteur
      en desgewenst met andere deskundigen, tenzij het bezwaarschrift is gericht tegen een besluit ingevolge het tweede
      of negentiende lid.

      22 Het vierde en vijfde lid zijn niet van toepassing op de toelating van een leerling tot een instelling.


