        artikel: 9.2.8
  - number: 44a
    text: |-
      1 Het bevoegd gezag kan het college van burgemeester en wethouders van de gemeente waar de leerling woon- of
      verblijfplaats heeft, betrekken bij de loopbaanbegeleiding, bedoeld in [artikel 44, eerste lid][ref1], om de
      leerling ondersteuning te bieden op grond van [artikel 7a van de Participatiewet][ref2].

      2 Het bevoegd gezag kan het college van burgemeester en wethouders van de gemeente waar de leerling woon- of
      verblijfplaats heeft, verzoeken de ondersteuning van een leerling na het verlaten van de school voort te zetten op
      grond van [artikel 7a van de Participatiewet][ref3], mits de betrokkene die meerderjarig en handelingsbekwaam is,
      dan wel de ouders, daarmee instemt.

      3 Indien de ondersteuning met toepassing van het tweede lid wordt voortgezet door het college van burgemeester en
      wethouders, verstrekt het bevoegd gezag het overgangsdocument, bedoeld in [artikel 14e][ref4], aan het college van
      burgemeester en wethouders.


