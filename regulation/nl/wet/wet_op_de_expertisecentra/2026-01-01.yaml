  - number: '97'
    text: |-
      1 Het college van burgemeester en wethouders beslist bij beschikking met ingang van welk tijdstip in het jaar
      volgend op het jaar van vaststelling van het programma, bedoeld in [artikel 93][ref1], de bekostiging van een
      voorziening die in het programma is opgenomen, daadwerkelijk een aanvang kan nemen, onverminderd het bepaalde in
      [artikel 99][ref2].

      2 De aanspraak op bekostiging van een voorziening vervalt, indien niet binnen een in de verordening op basis
      van [artikel 100][ref3] te bepalen termijn na de beschikking, bedoeld in het eerste lid, met betrekking tot de
      voorziening een bouwopdracht is gegeven dan wel een koop-, huur- of erfpachtovereenkomst is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel99
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel100
