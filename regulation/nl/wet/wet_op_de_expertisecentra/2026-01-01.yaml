      a. de momenten van de uitslag van een doorstroomtoets als bedoeld in [artikel 48c, derde lid][ref1]; en

      b. de afnamevoorschriften, onregelmatigheden en onvoorziene omstandigheden bij de afname van een doorstroomtoets
