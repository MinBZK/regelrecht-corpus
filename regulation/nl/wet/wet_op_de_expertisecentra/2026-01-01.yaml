      1 De bekostiging voor een school, berekend op grond van [artikel 114][ref1] en [119][ref2], wordt voor de eerste
      drie jaren na de inwerkingtreding van dit artikel per jaar vermeerderd met het bedrag, berekend volgens het tweede
      tot en met het vierde lid, als de uitkomst van die berekening positief is. Ingeval de uitkomst negatief is, wordt
      de bekostiging met het berekende bedrag verminderd.

      2 Het bedrag van de vermeerdering of vermindering, bedoeld in het eerste lid, wordt bepaald aan de hand van de
      formule (A – B) x C x T, waarbij:

      A = D / E x F gedeeld door het aantal leerlingen op 1 februari voorafgaand aan de inwerkingtreding van dit artikel;

      B = de bekostiging voor de school berekend op grond van de [artikelen 114][ref3] en [119][ref4] gedeeld
      door het aantal leerlingen op de teldatum van 1 februari voor het betreffende bekostigingsjaar, bedoeld in
      [artikel 116][ref5];

      C = 75% in het eerste jaar, 50% in het tweede jaar en 25% in het derde jaar na de inwerkingtreding van dit artikel;

      D = de bekostiging voor een school op basis van de telgegevens van 1 oktober van het jaar voorafgaand aan de
      inwerkingtreding van dit artikel op grond van de [artikelen 117][ref6], [124][ref7] en [128][ref8] en de daarop
      gebaseerde lagere regelgeving, zoals deze luidden op de dag direct voorafgaand aan het tijdstip waarop dit artikel
      in werking zijn getreden, en de daarop gebaseerde bedragen;

      E = de bekostiging voor een school op basis van de telgegevens van 1 oktober van het jaar voorafgaand aan de
      inwerkingtreding van dit artikel op grond van de [artikelen 114][ref9] en [119][ref10] en op basis van de bedragen
      zoals die zouden zijn bij een teldatum van 1 oktober van het jaar voorafgaand aan de inwerkingtreding van dit
      artikel en de daarop gebaseerde lagere regelgeving;

      F = de bekostiging op grond van de artikelen 114 en 119 en op basis van de telgegevens op 1 februari voorafgaand
      aan de inwerkingtreding van dit artikel;

      T = het aantal leerlingen op de teldatum van 1 februari voor het betreffende bekostigingsjaar, bedoeld in
      [artikel 116][ref11].

      3 Indien de uitkomst van de berekening, zoals bepaald in het tweede lid, positief is, wordt de vermeerdering
      zodanig vastgesteld dat de uitkomst van de formule [(B x T) + vermeerdering bedoeld in het tweede lid – (A x T)] /
      (A x T), in de eerste drie jaren na inwerkingtreding van dit artikel achtereenvolgens niet minder is dan -1%, -2%
      en -3%, waarbij A, B en T zijn vastgesteld volgens het tweede lid.

      4 Indien de uitkomst van de berekening, zoals bepaald in het tweede lid, negatief is, wordt de vermindering zodanig
      vastgesteld dat de uitkomst van de formule [(B x T) + vermindering bedoeld in het tweede lid – (A x T)] / (A x T),
      in de eerste drie jaren na inwerkingtreding van dit artikel achtereenvolgens niet meer is dan 1%, 2% en 3%, waarbij
      A, B en T zijn vastgesteld volgens het tweede lid.

      5 Indien de som van de bekostiging voor de scholen van het bevoegd gezag, bedoeld in het eerste lid, minus de
      uitkomst van de formule A x T, bedoeld in het tweede lid, in het vierde jaar na de inwerkingtreding van dit artikel
      gedeeld door de uitkomst van de formule A x T in de eerste drie jaren na de inwerkingtreding van dit artikel,
      voor die scholen minder is dan -3% en daardoor aantoonbare financiële problemen ontstaan, kan het bevoegd gezag
      in het vierde jaar na inwerkingtreding van dit artikel aanvullende bekostiging, bedoeld in [artikel 120][ref12],
      aanvragen bij Onze Minister.

      6 Bij de vaststelling van de bekostiging, bedoeld in het tweede, derde en vierde lid, is
      [artikel 114, zesde tot met tiende lid][ref13], van overeenkomstige toepassing.

      7 Dit artikel is niet van toepassing op het bevoegd gezag van een school:

      a. indien de school in het schooljaar dat eindigt in het jaar waarin dit artikel in werking is getreden op grond
      van de destijds geldende regelgeving niet voor bekostiging in aanmerking kwam en;

      b. vanaf het kalenderjaar dat er voor de school gedurende de eerste drie jaren na de inwerkingtreding van dit
      artikel sprake is van een samenvoeging met een andere school als bedoeld in [artikel 115][ref14].


