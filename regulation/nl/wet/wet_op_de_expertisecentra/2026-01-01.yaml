      1 Het in [artikel 154][ref1] en het in [artikel 156][ref2] bedoelde bestuur dragen zorg voor de kwaliteit van de
      werkzaamheden van de instelling.

      2 Onze Minister kan een instelling een of meer van de in [artikel 154][ref3] of [artikel 156][ref4],
      bedoelde bevoegdheden ontnemen indien gebleken is dat de kwaliteit van de uitoefening daarvan tekortschiet,
      dan wel indien niet of niet meer wordt voldaan aan het terzake bij en krachtens deze wet bepaalde.
      [Artikel 6.10, vierde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5] is van
      overeenkomstige toepassing ten aanzien van de ontneming.


