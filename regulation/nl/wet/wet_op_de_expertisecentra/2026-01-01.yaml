  - number: '127'
    text: |-
      1 Indien een gemeente een of meer scholen in stand houdt, stelt het college van burgemeester en wethouders
      onderscheiden per schoolsoort, alsmede al naar gelang het speciaal onderwijs, dan wel voortgezet speciaal onderwijs
      betreft, jaarlijks voorlopig vast:

      a. het totaal van de bedragen, bedoeld in [artikel 113][ref1] die in het voorafgaande kalenderjaar zijn
      uitgegeven;

      b. het totaal van de ontvangsten, bedoeld in de [artikelen 114][ref2], [117][ref3], [118][ref4] en [119][ref5], in
      het voorafgaande kalenderjaar;

      c. het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven voor de instandhouding van een
      rechtspersoon als bedoeld in [artikel 69][ref6];

      d. het totaal van de ontvangsten, op grond van [artikel 70, zesde lid][ref7], en

      e. een staat van voorzieningen die zijn ingesteld voor de door de gemeente in stand gehouden scholen.

      2 Indien de gemeente een deel van de ontvangsten bedoeld, in het eerste lid, onderdeel d, toevoegt aan een
      voorziening, wordt dat deel aangemerkt als een uitgave als bedoeld in dat lid, onderdeel a, onderscheidenlijk als
      een uitgave als bedoeld in dat lid, onderdeel c.

      3 Indien de gemeente voor de kosten, bedoeld in [artikel 113, tweede lid, onderdeel a][ref8], of de kosten voor
      de instandhouding van een rechtspersoon als bedoeld in [artikel 69][ref9], bedragen aan een voorziening onttrekt,
      worden deze aangemerkt als ontvangsten als bedoeld in het eerste lid, onderdeel b.

      4 Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdeel c, worden buiten beschouwing gelaten de
      uitgaven en ontvangsten voor:

      a. administratie, beheer en bestuur, bedoeld in [artikel 113, tweede lid, onderdeel h][ref10];

      b. de exploitatie van een ruimte voor het onderwijs in lichamelijke oefening, van watergewenning of
      bewegingstherapie, en

      c. indien het een instelling betreft, de bedragen, bedoeld in [artikel 118][ref11].

      5 De ontvangsten, bedoeld in het derde lid, onderdeel a, worden genormeerd vastgesteld op 0,65 procent van de
      bekostiging, bedoeld in [artikel 114][ref12].

      6 Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdelen a, b, c, worden buiten
      beschouwing gelaten de uitgaven die worden gedekt door ontvangsten van bedragen die door derden
      zijn betaald, de uitgaven die worden gedekt door ontvangsten op grond van een besluit als bedoeld in
      [artikel 123, vijfde lid, tweede volzin][ref13], en de uitgaven voor de voorzieningen waarvoor het
      bevoegd gezag van een niet door de gemeente in stand gehouden school op grond van de regeling, bedoeld in
      [artikel 124, eerste lid][ref14], een aanvraag bij de gemeente kon indienen en wel gedurende de periode waarvoor
      een dergelijke aanvraag kon worden gedaan.

      7 Bij het vaststellen van de bedragen bedoeld in het eerste lid, onderdeel a, mogen voorzieningen die volgens de
      desbetreffende rijksbekostiging een afschrijvingstermijn van ten minste 20 jaar hebben, over ten hoogste 20 jaar
      worden aangemerkt als jaarlijkse uitgave op grond van rente op basis van een fictieve lening met een looptijd van
      ten hoogste 20 jaar en een lineaire aflossing.

      8 Indien de gemeente een deel van de bekostiging overdraagt aan een ander bevoegd gezag, wordt dat deel aangemerkt
      als een uitgave als bedoeld in het eerste lid, onderdeel a. Indien door een ander bevoegd gezag een deel van de
      bekostiging aan de gemeente wordt overgedragen, wordt dat deel aangemerkt als een ontvangst als bedoeld in het
      eerste lid, onderdeel b.

      9 Om de vijf jaar stelt het college van burgemeester en wethouders het totaal van de vastgestelde uitgaven en
      ontvangsten in de voorafgaande vijf kalenderjaren voorlopig vast, zoals in het eerste tot en met zevende lid is
      aangegeven. Indien de uitgaven hoger zijn dan de ontvangsten, bepaalt het college van burgemeester en wethouders
      tevens het bedrag van de overschrijding. Indien een gemeente vanaf een tijdstip binnen een periode van vijf jaar
      als bedoeld in de eerste volzin geen school in stand houdt, stelt het college van burgemeester en wethouders in
      afwijking van die volzin zo spoedig mogelijk na dat tijdstip voorlopig vast het totaal van de vastgestelde uitgaven
      en ontvangsten in het aan dat tijdstip voorafgaande deel van de periode van vijf jaar, zoals in het eerste tot en
      met zesde lid is aangegeven.

      10 Na sluiting van de rekening van de gemeente stelt het college van burgemeester en wethouders onderscheiden per
      schoolsoort, alsmede al naar gelang het speciaal onderwijs dan wel voortgezet speciaal onderwijs betreft, de in het
      eerste en zevende lid bedoelde bedragen, zo nodig gewijzigd, vast. In het geval, bedoeld in het achtste lid, tweede
      volzin, drukt het college van burgemeester en wethouders vervolgens het bedrag van de overschrijding uit in een
      percentage van het totaal van de ontvangsten, bedoeld in het eerste lid, onderdelen b en d. Het percentage wordt
      afgerond tot twee decimalen. Afronding naar beneden vindt plaats indien de derde decimaal kleiner is dan 5, en naar
      boven indien deze decimaal ten minste 5 bedraagt.


