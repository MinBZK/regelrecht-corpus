  - number: '12'
    text: |-
      1 Het speciaal onderwijs wordt zodanig ingericht dat:

      a. de leerlingen in beginsel binnen een tijdvak van 8 aaneensluitende schooljaren het speciaal onderwijs kunnen
      doorlopen, en

      b. de leerlingen in 8 schooljaren ten minste 7 520 uren onderwijs ontvangen, met dien verstande dat de leerlingen
      in de eerste 4 schooljaren ten minste 3 520 uren onderwijs en in de laatste 4 schooljaren ten minste 3 760 uren
      onderwijs ontvangen. Het onderwijs aan leerlingen jonger dan 4 jaar omvat ten minste 880 uren per schooljaar. Aan
      de leerlingen in de laatste 6 schooljaren wordt ten hoogste 7 weken van het schooljaar 4 dagen per week onderwijs
      gegeven, die evenwichtig zijn verdeeld over het schooljaar, bij een schoolweek van in beginsel niet minder dan 5
      dagen onderwijs.

      2 De inspectie kan op aanvraag van het bevoegd gezag ermee instemmen dat om lichamelijke of psychische redenen voor
      individuele leerlingen wordt afgeweken van het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel12
  - number: '13'
    text: |-
      1 Behoudens het bepaalde in het vijfde lid en in [artikel 15][ref1] omvat het speciaal onderwijs, waar mogelijk
      in samenhang:

      a. zintuiglijke oefening;

      b. lichamelijke oefening;

      c. Nederlandse taal;

      d. rekenen en wiskunde;

      e. enkele kennisgebieden;

      f. expressie-activiteiten;

      g. bevordering van sociale redzaamheid, waaronder gedrag in het verkeer;

      h. bevordering van gezond gedrag;

      i. Engelse taal.

      2 Het onderwijs kan mede huishoudelijke activiteiten omvatten.

      3 Bij de kennisgebieden wordt in elk geval aandacht besteed aan:

      a. aardrijkskunde;

      b. geschiedenis;

      c. de natuur, waaronder biologie;

      d. maatschappelijke verhoudingen, waaronder staatsinrichting;

      e. geestelijke stromingen.

      4 Bij de expressie-activiteiten wordt waar mogelijk aandacht besteed aan de bevordering van het taalgebruik,
      tekenen, muziek, handvaardigheid, spel en beweging.

      5 Speciaal onderwijs aan zeer moeilijk lerende kinderen en meervoudig gehandicapte kinderen voor wie het zeer
      moeilijk lerend zijn een van de handicaps is omvat, waar mogelijk in samenhang;

      a. zintuiglijke oefening;

      b. lichamelijke oefening;

      c. bevordering van de sociale redzaamheid, waaronder gedrag in het verkeer;

      d. bevordering van gezond gedrag;

      e. expressie-activiteiten, waarbij in elk geval aandacht wordt besteed aan de bevordering van het taalgebruik,
      tekenen, muziek, handvaardigheid, spel en beweging;

      f. een of meer kennisgebieden, waarbij in ieder geval aandacht wordt besteed aan de natuur.

      5a Het onderwijs in zintuiglijke en lichamelijke oefening, bedoeld in het eerste lid, aanhef en onderdelen a en
      b, en vijfde lid, onderdelen a en b, wordt gespreid verzorgd over alle schooljaren en beslaat in een schooljaar
      gemiddeld ten minste 1,5 uur per schoolweek.

      6 Op de scholen in de provincie Fryslân kan het speciaal onderwijs mede onderwijs in de Friese taal omvatten.

      7 Ten aanzien van de onderwijsactiviteiten, genoemd in het eerste tot en met vijfde lid, worden
      bij algemene maatregel van bestuur kerndoelen vastgesteld, die voor de onderwijssoorten, bedoeld in
      [artikel 2, tweede lid][ref2], kunnen verschillen. De algemene maatregel van bestuur, bedoeld in de vorige volzin,
      wordt aan de Tweede Kamer der Staten-Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat 4 weken
      na de overlegging zijn verstreken bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of
      namens de kamer de wens te kennen wordt gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet
      wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend. De vorige
      3 volzinnen zijn niet van toepassing, voor zover het ontwerp van een algemene maatregel van bestuur voordien
      aan de Tweede Kamer der Staten-Generaal is voorgelegd en door of namens de kamer te kennen is gegeven dat van de
      procedure, bedoeld in de vorige 3 volzinnen, kan worden afgeweken.

      8 Ten aanzien van de onderwijsactiviteit, bedoeld in het zesde lid, stellen provinciale staten van Fryslân bij
      verordening kerndoelen Friese taal vast, die voor de onderwijssoorten, bedoeld in [artikel 2, tweede lid][ref3],
      kunnen verschillen. De vaststelling geschiedt niet eerder dan nadat gedeputeerde staten overleg hebben gevoerd
      met het Friese speciaal onderwijs. De verordening behoeft de goedkeuring van Onze Minister. Indien Onze Minister
      voornemens is goedkeuring te onthouden, verzoekt hij de Onderwijsraad een advies uit te brengen. Het verzoek bevat
      een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies wordt binnen zes weken uitgebracht
      aan Onze Minister en wordt bekend gemaakt. Onze Minister informeert beide Kamers der Staten-Generaal over zijn
      voornemen om al dan niet goed te keuren. [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref4] is niet van
      overeenkomstige toepassing.

      9 Onze Minister kan goedkeuring als bedoeld in het achtste lid in ieder geval onthouden indien aan de volgende
      voorwaarden, waarvoor gedeputeerde staten gegevens aandragen, niet wordt voldaan:

      a. het bestaan van voldoende draagvlak in het Friese speciaal onderwijs voor de voorgelegde kerndoelen Friese taal;

      b. dat de kerndoelen Friese taal niet meer inspanningen vergen van het Friese speciaal onderwijs dan het aandeel
      van het onderwijs in de Friese taal binnen het totaal aan onderwijsactiviteiten rechtvaardigt.

      10 Onze Minister kan goedkeuring als bedoeld in het achtste lid in ieder geval onthouden indien de kerndoelen
      Friese taal geen aandacht schenken aan:

      a. het zich mondeling uitdrukken in het Fries en het verstaan van de Fries gesproken taal,

      b. het zich schriftelijk uitdrukken in het Fries en het verwerven van informatie uit in het Fries gestelde teksten,

      c. bevordering van het begrip van de Friese taal, en

      d. het ontwikkelen van een positieve houding ten aanzien van het gebruik van het Fries.

      11 Voor de school geldt de eis dat zij tenminste de kerndoelen bij haar onderwijsactiviteiten als aan het eind van
      het speciaal onderwijs te bereiken doelstellingen hanteert. Kerndoelen geven een beschrijving van kwaliteiten van
      leerlingen op het gebied van kennis, inzicht en vaardigheden. Indien voor een leerling de eerste volzin niet kan
      worden toegepast, wordt in het ontwikkelingsperspectief, bedoeld in [artikel 41a][ref5], aangegeven wat daarvan de
      reden is en welke vervangende onderwijsdoelen worden gehanteerd.

      12 Indien een bevoegd gezag van een bijzondere school dringend bedenkingen heeft tegen de krachtens het zevende
      of achtste lid vastgestelde kerndoelen, kan het bevoegd gezag eigen kerndoelen voor de school vaststellen. Deze
      kerndoelen zijn van gelijk niveau als de kerndoelen, bedoeld in het zevende of achtste lid. Het bevoegd gezag zendt
      de vastgestelde kerndoelen aan de inspecteur.

      13 Bij de verzorging van het onderwijs op basis van de kerndoelen voor Nederlandse taal en
      rekenen en wiskunde, neemt het bevoegd gezag, met inachtneming van [artikel 11, eerste lid][ref6],
      de referentieniveaus Nederlandse taal en de referentieniveaus rekenen, bedoeld in
      [artikel 2, tweede lid, aanhef en onderdeel b, van de Wet referentieniveaus Nederlandse taal en rekenen][ref7],
      als uitgangspunt.


