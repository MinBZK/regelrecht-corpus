      1 Fusies worden niet tot stand gebracht dan nadat daarvoor goedkeuring is verleend door Onze Minister.

      2 De goedkeuring, bedoeld in het eerste lid, is niet vereist voor de fusie die noodzakelijk is voor de
      totstandkoming van de samenwerkingsschool, bedoeld in [artikel 28j, eerste lid][ref1].


