      1 Indien de bekostiging van een bijzondere school ingevolge [artikel 135][ref1] wordt beëindigd of het bevoegd
      gezag beslist tot opheffing van de school, eindigt het recht op het gebouw en terrein en worden alle roerende
      zaken, behalve die welke het bevoegd gezag uit eigen middelen heeft aangeschaft, aan de gemeente overgedragen.

      2 [Artikel 108, eerste tot en met vierde lid][ref2], is van overeenkomstige toepassing met dien verstande dat in
      de verklaring ingevolge het eerste lid en het besluit ingevolge het tweede lid als datum waarop het bevoegd gezag
      blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein voor de school te gebruiken, zal
      worden genoemd de datum waarop de bekostiging is geëindigd dan wel zal eindigen.


