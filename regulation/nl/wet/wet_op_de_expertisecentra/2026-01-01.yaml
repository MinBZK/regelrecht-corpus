      1 Het onderwijs in het uitstroomprofiel dagbesteding bereidt leerlingen, van wie redelijkerwijs
      mag worden aangenomen dat het volgen van het onderwijs, bedoeld in [artikel 14a][ref1] en
      [artikel 14c][ref2], niet leidt tot het behalen van een diploma of een getuigschrift als bedoeld in
      [artikel 2.58 van de Wet voortgezet onderwijs 2020][ref3] respectievelijk tot het duurzaam bekleden van een functie
      op de arbeidsmarkt, voor op het zo zelfstandig mogelijk functioneren in vormen van dagbesteding.

      2 Bij algemene maatregel van bestuur worden kerndoelen vastgesteld, waarbij aandacht wordt besteed aan aspecten
      van:

      a. algemene maatschappelijke voorbereiding en persoonlijke vorming,

      b. leergebieden, en

      c. voorbereiding op dagbesteding.

      3 De leergebieden, bedoeld in het tweede lid, zijn:

      a. Nederlandse taal en communicatie,

      b. rekenen en wiskunde,

      c. mens, natuur en techniek,

      d. mens en maatschappij,

      e. culturele oriëntatie en creatieve expressie, en

      f. bewegen en sport.

      4 Op scholen in de provincie Fryslân kan het onderwijs in het uitstroomprofiel dagbesteding mede onderwijs in de
      Friese taal omvatten. Voor dat onderwijs stellen provinciale staten van Fryslân bij verordening kerndoelen Friese
      taal vast. De vaststelling geschiedt niet eerder dan nadat gedeputeerde staten overleg hebben gevoerd met het
      Friese voortgezet speciaal onderwijs. De verordening behoeft de goedkeuring van Onze Minister. Indien Onze Minister
      voornemens is goedkeuring te onthouden, verzoekt hij de Onderwijsraad een advies uit te brengen. Het verzoek bevat
      een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies wordt binnen zes weken uitgebracht
      aan Onze Minister en wordt bekend gemaakt. Onze Minister informeert beide Kamers der Staten-Generaal over zijn
      voornemen om al dan niet goed te keuren. [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref4] is niet van
      overeenkomstige toepassing.

      5 Onze Minister kan goedkeuring als bedoeld in het vierde lid in ieder geval onthouden indien aan de volgende
      voorwaarden, waarvoor gedeputeerde staten gegevens aandragen, niet wordt voldaan:

      a. het bestaan van voldoende draagvlak in het Friese voortgezet speciaal onderwijs voor de voorgelegde kerndoelen
      Friese taal;

      b. dat de kerndoelen Friese taal niet meer inspanningen vergen van het Friese voortgezet speciaal onderwijs
      dan het aandeel van het onderwijs in de Friese taal binnen het onderwijsprogramma, bedoeld in het achtste lid,
      rechtvaardigt.

      6 Onze Minister kan goedkeuring als bedoeld in het vierde lid in ieder geval onthouden indien de kerndoelen Friese
      taal geen aandacht schenken aan:

      a. het zich mondeling uitdrukken in het Fries en het verstaan van de Fries gesproken taal,

      b. het zich schriftelijk uitdrukken in het Fries en het verwerven van informatie uit in het Fries gestelde teksten,

      c. bevordering van het begrip van de Friese taal, en

      d. het ontwikkelen van een positieve houding ten aanzien van het gebruik van het Fries.

      7 De kerndoelen, bedoeld in het tweede en vierde lid, kunnen voor de onderwijssoorten, bedoeld in
      [artikel 2, tweede lid][ref5], verschillen.

      8 Het onderwijs in het uitstroomprofiel dagbesteding wordt zo ingericht dat een samenhangend op de kerndoelen
      gebaseerd onderwijsprogramma wordt aangeboden waarbij het bevoegd gezag de kerndoelen uitwerkt voor de
      verschillende groepen leerlingen.

      9 Het bevoegd gezag kan na overleg met de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam
      is, met de leerling, een leerling ontheffing verlenen voor onderdelen van het onderwijsprogramma, bedoeld in het
      achtste lid. Het bevoegd gezag bepaalt bij de ontheffing welk onderwijs voor de leerling in de plaats komt voor de
      onderdelen waarvoor ontheffing is verleend.

      10 Het bevoegd gezag kan voor leerlingen die daarvoor in aanmerking komen, bij de inrichting van het onderwijs
      afwijken van een of meer programmaonderdelen of van het achtste lid. De laatste volzin van het negende lid is van
      overeenkomstige toepassing. Bij algemene maatregel van bestuur wordt bepaald hoe wordt vastgesteld welke leerlingen
      in aanmerking komen voor deze afwijkingen.


