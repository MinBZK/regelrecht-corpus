  - number: '101'
    text: |-
      1 Het bevoegd gezag van een niet door de gemeente in stand gehouden school geeft opdracht de voorziening in
      de huisvesting waartoe op grond van de [artikelen 93][ref1] en [96][ref2] kan worden overgegaan, tot stand te
      brengen met daartoe door de gemeente beschikbaar te stellen gelden, tenzij het met het college van burgemeester en
      wethouders overeenkomt dat de gemeente deze voorziening tot stand brengt.

      2 Indien de gemeente de voorziening in de huisvesting van een niet door de gemeente in stand gehouden school tot
      stand heeft gebracht, worden gebouw en terrein aan het bevoegd gezag in eigendom overgedragen, tenzij het college
      van burgemeester en wethouders en het bevoegd gezag anders overeenkomen.

      3 Indien de voorziening in de huisvesting, bedoeld in het tweede lid, niet voldoet aan de eisen voor
      eigendomsoverdracht, geeft het college van burgemeester en wethouders deze aan het bevoegd gezag in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel96
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel101
