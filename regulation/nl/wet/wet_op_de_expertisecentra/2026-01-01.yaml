    text: |-
      1 Ten behoeve van het schoolbezoek verstrekt het college van burgemeester en wethouders aan ouders van in de
      gemeente verblijvende leerlingen, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, aan de
      leerling op aanvraag vergoeding van de door het college van burgemeester en wethouders noodzakelijk te achten
      vervoerskosten. De gemeenteraad stelt daartoe een nadere regeling vast, met inachtneming van het bepaalde in de
      volgende leden.

      2 De regeling maakt geen onderscheid tussen openbaar en bijzonder onderwijs.

      3 De regeling eerbiedigt de op godsdienst of levensbeschouwing van de ouders, dan wel, indien de leerling
      meerderjarig en handelingsbekwaam is, van de leerling berustende keuze van een school.

      4 De regeling houdt rekening met de van ouders redelijkerwijs te vergen inzet en voorziet erin dat het vervoer kan
      plaatsvinden op een wijze die voor de leerling passend is, met dien verstande dat voor leerlingen die voortgezet
      speciaal onderwijs volgen geldt dat zij slechts aanspraak op bekostiging van vervoerskosten kunnen maken indien
      zij wegens hun handicap op ander vervoer dan openbaar vervoer zijn aangewezen, dan wel vanwege hun handicap
      niet zelfstandig van openbaar vervoer gebruik kunnen maken. De regeling bepaalt op welke wijze het college van
      burgemeester en wethouders terzake advies van deskundigen inwint.

      5 De regeling bepaalt dat de kosten worden vergoed van vervoer over de afstand tussen de woning van de leerling
      en de dichtstbijzijnde voor de leerling toegankelijke school, met inachtneming van de keuze van de ouders, dan
      wel, indien de leerling meerderjarig en handelingsbekwaam is, van de leerling, en gemeten langs de kortste voor de
      leerling voldoende begaanbare en veilige weg, tenzij vervoer met betrekking tot een verder weg gelegen school voor
      de gemeente minder kosten met zich zou brengen en de ouders onderscheidenlijk de leerling met het vervoer naar die
      school instemmen.

      6 De regeling bepaalt in welke gevallen en onder welke voorwaarden het college van burgemeester en wethouders aan
      in de gemeente wonende ouders van leerlingen die met het oog op het volgen van voor hen passend speciaal onderwijs
      of voortgezet speciaal onderwijs in een internaat of pleeggezin verblijven, op aanvraag vergoeding verstrekt ten
      behoeve van de kosten verbonden aan het weekeinde- en vakantievervoer.

      7 De regeling kan per schoolsoort, als bedoeld in [artikel 2, tweede lid][ref1], en onverminderd het bepaalde in
      het vierde lid voor leerlingen die wegens hun lichamelijke, verstandelijke, zintuiglijke of psychische handicap op
      ander vervoer dan openbaar vervoer zijn aangewezen, bepalen dat geen aanspraak op vergoeding bestaat op grond van
      de afstand tussen de voor de leerling toegankelijke school en de woning van de leerling, gemeten langs de kortste
      voor de leerling voldoende begaanbare en veilige weg.

      8 De regeling kan per schoolsoort, als bedoeld in [artikel 2, tweede lid][ref2], bepalen dat voor een leerling die
      ouder is dan een bepaalde leeftijd, de aanspraak op vergoeding wordt beperkt tot de kosten van openbaar vervoer,
      dan wel, indien zulks in redelijkheid kan worden verlangd, een goedkopere wijze van vervoer. In dat geval dient de
      regeling erin te voorzien, dat uitvoering wordt gegeven aan het bepaalde in het vierde lid voor die leerlingen voor
      wie openbaar vervoer ontbreekt en de in de vorige volzin bedoelde goedkopere wijze van vervoer in redelijkheid niet
      kan worden verlangd en voor die leerlingen die wegens hun lichamelijke, verstandelijke, zintuiglijke of psychische
      handicap op ander vervoer dan openbaar vervoer zijn aangewezen.

      9 De regeling kan bepalen dat de gemeente, in plaats van vergoeding in geld te geven, het vervoer verzorgt of doet
      verzorgen.

      10 De regeling kan bepalen dat het college van burgemeester en wethouders in bijzondere gevallen de bevoegdheid
      heeft ten gunste van de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, ten gunste van de
      leerling van de inhoud van de regeling af te wijken.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
