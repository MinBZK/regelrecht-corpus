  - number: 14d
    text: |-
      1 De directeur reikt een schooldiploma voortgezet speciaal onderwijs uit aan de leerling die het
      onderwijs in het arbeidsmarktgerichte uitstroomprofiel verlaat, voor wie de leerplicht, bedoeld in
      [paragraaf 2 van de Leerplichtwet 1969][ref1], is geëindigd en die naar het oordeel van de directeur in aanmerking
      komt voor het schooldiploma. De directeur baseert zijn oordeel op een reglement dat door het bevoegd gezag wordt
      vastgesteld.

      2 Een portfolio waarin de behaalde resultaten zijn opgenomen, maakt deel uit van het schooldiploma.

      3 Bij ministeriële regeling wordt een model voor het schooldiploma vastgesteld.

      4 De leerling die een deel van het programma heeft voltooid, de school verlaat en niet op grond van het eerste lid
      een schooldiploma ontvangt, ontvangt een verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel14d
    references:
