  - number: 47a
    text: |-
      1 Het bevoegd gezag doet onverwijld opgave aan het college van burgemeester en wethouders van de gemeente waar de
      betrokkene woon- of verblijfplaats heeft van de gegevens van degene

      a. op wie de [Leerplichtwet 1969][ref1] niet meer van toepassing is en die de leeftijd van 23 jaren nog niet heeft
      bereikt,

      b. die niet in het bezit is van een diploma voorbereidend wetenschappelijk onderwijs of
      hoger algemeen voortgezet onderwijs als bedoeld in [artikel 2.4][ref2] onderscheidenlijk
      [artikel 2.5 van de Wet voortgezet onderwijs 2020][ref3] dan wel een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e, van de Wet educatie en beroepsonderwijs][ref4], en

      c. die van de school wordt verwijderd.

      2 Op verzoek van het college van burgemeester en wethouders van de gemeente waar de betrokkene woon-
      of verblijfplaats heeft, vindt de opgave, bedoeld in het eerste lid, plaats aan het college van
      burgemeester en wethouders van de contactgemeente, bedoeld in [artikel 146][ref5] in verbinding met
      [artikel 9.2.4, tweede lid, van de Wet educatie en beroepsonderwijs][ref6].

      3 Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de toepassing van het eerste lid.


