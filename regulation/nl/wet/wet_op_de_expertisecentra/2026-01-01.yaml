  - number: '115'
    text: |-
      1 In geval van samenvoeging van scholen, waarbij een of meer scholen worden opgeheven en sprake is van een minimale
      instroom van leerlingen in de samengevoegde school, wordt de bekostiging, bedoeld in [artikel 114][ref1], van alle
      betrokken scholen gehandhaafd tot het einde van het kalenderjaar waarin de scholen zijn samengevoegd.

      2 Bij algemene maatregel van bestuur worden nadere regels gesteld over de samenvoeging, bedoeld in het eerste lid,
      waaronder in ieder geval de minimale instroom.


