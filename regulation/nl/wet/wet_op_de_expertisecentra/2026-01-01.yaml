  - number: '67'
    text: |-
      1 De gemeenteraad is bevoegd uitsluitend in het belang van een doelmatige spreiding van de leerlingen over de
      openbare scholen, het grondgebied van de gemeente in schoolwijken te verdelen.

      2 Een besluit als bedoeld in het eerste lid, geldt voor ten minste 3 schooljaren, met dien verstande dat
      tussentijdse wijziging mogelijk is in geval van veranderingen in het scholenbestand. Het college van burgemeester
      en wethouders zendt binnen 4 weken nadat het besluit is genomen afschrift daarvan aan gedeputeerde staten.

      3 De toelating tot een openbare school geschiedt in overeenstemming met de vastgestelde schoolwijken, tenzij door
      de ouders van de leerling, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, door de leerling,
      schriftelijk aan het bevoegd gezag te kennen wordt gegeven dat toelating in een andere schoolwijk wordt gewenst.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel67
  - number: '68'
    text: |-
      1 Vertegenwoordigers van het speciaal onderwijs en het basisonderwijs kunnen ten behoeve van de scholen die zij
      vertegenwoordigen een overlegorgaan oprichten met het doel de samenwerking tussen die scholen te bevorderen ten
      aanzien van de toelating van leerlingen en de inrichting van het onderwijs.

      2 Met betrekking tot het voortgezet speciaal onderwijs als bedoeld in [artikel 2][ref1] en het voortgezet onderwijs
      is het eerste lid van overeenkomstige toepassing.

      3 Aan de vertegenwoordiging van de aan het overleg deelnemende scholen zal in ieder geval een vertegenwoordiging
      van de ouders en van de leraren deelnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
