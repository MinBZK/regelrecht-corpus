  - number: 132a
    text: |-
      1 Onze Minister kan het bevoegd gezag een spoedaanwijzing tot het nemen van een of meer voorlopige maatregelen
      geven, indien:

      a. het bevoegd gezag tekortschiet in de naleving van het bepaalde bij of krachtens deze wet;

      b. uit dat tekortschieten of mede uit dat tekortschieten een wezenlijk vermoeden van wanbeheer als bedoeld in
      [artikel 132, tweede lid][ref1], volgt; en

      c. dat is vereist in verband met onverwijlde spoed.

      2 Onze Minister motiveert in de spoedaanwijzing waarom het doel van de spoedaanwijzing niet met een minder zwaar
      middel kan worden bereikt.

      3 De spoedaanwijzing vermeldt de termijn waarbinnen zij moet worden uitgevoerd.

      4 De spoedaanwijzing bepaalt de duur waarvoor zij geldt. Deze geldigheidsduur bedraagt ten hoogste zes maanden.
      Onze Minister kan de geldigheidsduur eenmalig verlengen met ten hoogste zes maanden. Op een verlengingsbesluit is
      het eerste lid van overeenkomstige toepassing.

      5 Voordat Onze Minister een spoedaanwijzing geeft heeft de inspectie een onderzoek als bedoeld in
      [artikel 11][ref2] of [artikel 15 van de Wet op het onderwijstoezicht][ref3] verricht en daarover een
      inspectierapport uitgebracht als bedoeld in [artikel 20, eerste lid, van de Wet op het onderwijstoezicht][ref4],
      waaruit volgt dat sprake is van wanbeheer als bedoeld in het tweede lid.

      6 Onze Minister informeert de beide Kamers der Staten-Generaal onverwijld nadat toepassing is gegeven aan het
      eerste lid.

      7 Dit artikel is van overeenkomstige toepassing op een door Onze Minister te geven spoedaanwijzing aan een
      samenwerkingsverband.


