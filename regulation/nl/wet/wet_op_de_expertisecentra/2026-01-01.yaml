  - number: '172'
    text: |-
      1 Met het oog op verbetering van de kwaliteit, toegankelijkheid of doelmatigheid van het speciaal onderwijs en het
      voortgezet speciaal onderwijs kan bij wijze van experiment bij algemene maatregel van bestuur worden afgeweken van
      [titel I, artikelen 1][ref1] en [2][ref2], [titel II, afdeling 1, afdeling 2, artikelen 50][ref3] en [51][ref4],
      en [titel IV][ref5], [afdelingen 1][ref6], [2][ref7] en [4][ref8] en [afdeling 5, paragraaf 1][ref9],
      [afdeling 6, paragraaf 2][ref10], en [afdeling 7][ref11], [artikelen 133 tot en met 137][ref12] en [140][ref13],
      van de wet.

      2 In geval van toepassing van het eerste lid wordt bij algemene maatregel van bestuur in elk geval bepaald:

      a. het doel van het experiment,

      b. op welke wijze van welke in het eerste lid bedoelde voorschriften wordt afgeweken,

      c. de duur van het experiment, en

      d. op welke wijze en aan de hand van welke criteria de met het experiment beoogde effecten worden geëvalueerd.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van een experiment.

      4 Een experiment duurt ten hoogste zes jaar, tenzij een langere duur gezien de bijzondere aard van het experiment
      noodzakelijk is. Alsdan wordt de duur van het experiment op ten hoogste acht jaar bepaald. Indien een voorstel
      van wet is ingediend bij de Staten-Generaal om het experiment om te zetten in een structurele wettelijke regeling,
      voordat een experiment is afgelopen, kan Onze Minister het experiment verlengen tot het tijdstip waarop het
      wetsvoorstel tot wet is verheven en in werking treedt.

      5 Onze Minister zendt drie maanden voor het einde van de werkingsduur van een algemene maatregel van bestuur als
      bedoeld in het eerste lid aan de Staten-Generaal, een verslag over de doeltreffendheid en de effecten van het
      experiment in de praktijk, evenals een standpunt over de voortzetting van die algemene maatregel van bestuur,
      anders dan een voortzetting als experiment.

      6 In verband met een experiment als bedoeld in het eerste lid, kan bij algemene maatregel van bestuur
      eveneens bij wijze van experiment worden afgeweken van [artikel 1 van de Leerplichtwet 1969][ref14] en van de
      [hoofdstukken 1 tot en met 4 van de Wet NLQF][ref15].

      7 Dit artikel is van overeenkomstige toepassing op de samenwerking van een school met een school of instelling
      als bedoeld in [artikel 1][ref16], met een school als bedoeld in de [Wet op het primair onderwijs][ref17]
      of met een school als bedoeld in de [Wet voortgezet onderwijs 2020][ref18]. Bij samenwerking met een
      school als bedoeld in de Wet op het primair onderwijs of een school als bedoeld in de Wet voortgezet
      onderwijs 2020 kan voor die school respectievelijk worden afgeweken van [hoofdstuk I, titel I][ref19],
      [artikelen 1][ref20] en [2][ref21],[ titel II, afdeling 1][ref22] en [afdeling 2][ref23],
      [artikelen 47][ref24] en [48][ref25], en [titel IV, afdelingen 1][ref26], [2][ref27], [4][ref28] en [5][ref29],
      [afdeling 6, paragraaf 1][ref30], [afdeling 7, paragraaf 2][ref31], en [afdeling 8, paragrafen 1][ref32] en
      [2, van de Wet op het primair onderwijs][ref33], en van de Wet voortgezet onderwijs 2020, met uitzondering
      van [hoofdstuk 3, paragrafen 7][ref34] en [10][ref35], en de [hoofdstukken 4][ref36], [6][ref37] en
      [9 van die wet][ref38]. Bij de algemene maatregel van bestuur, bedoeld in het tweede lid, wordt geregeld welke bij
      of krachtens de wet, de Wet op het primair onderwijs of de Wet voortgezet onderwijs 2020 vastgestelde voorschriften
      van toepassing of van overeenkomstige toepassing zijn op de samenwerking.

      8 De voordracht voor de algemene maatregel van bestuur, bedoeld in het tweede lid, wordt niet eerder gedaan dan
      vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


