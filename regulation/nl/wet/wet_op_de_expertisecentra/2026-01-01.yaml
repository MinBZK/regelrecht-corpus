  - number: '117'
    text: |-
      1 In geval van bijzondere ontwikkelingen in het speciaal onderwijs en het voortgezet speciaal onderwijs, kan Onze
      Minister in aanvulling op de bekostiging, bedoeld in [artikel 114][ref1] bekostiging verstrekken.

      2 Bij ministeriële regeling kunnen regels worden gesteld over het verstrekken van de aanvullende bekostiging,
      bedoeld in het eerste lid.

      3 Onze Minister kan een bekostigingsplafond instellen voor de aanvullende bekostiging, bedoeld in het eerste lid.
      In dat geval worden bij ministeriële regeling regels gesteld over de verdeling.


