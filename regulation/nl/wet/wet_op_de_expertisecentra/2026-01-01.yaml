    text: |-
      Op verzoek van de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, op verzoek van de
      leerling, kan aan leerlingen die voortgezet speciaal onderwijs volgen gelegenheid worden gegeven eindexamen af te
      leggen aan een school voor regulier onderwijs.
