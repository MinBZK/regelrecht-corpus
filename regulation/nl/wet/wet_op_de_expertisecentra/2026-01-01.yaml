    text: |-
      1 De leeftijd waarop het kind tot het speciaal onderwijs mag worden toegelaten is 4 jaar. Indien het betreft een
      kind als bedoeld in [artikel 2, tweede lid onder a of b][ref1], kan het worden toegelaten als het de leeftijd van 3
      jaar heeft bereikt.

      2 Onverminderd [artikel 40, derde lid][ref2], kan de inspecteur in het belang van het kind besluiten toe te staan
      dat een kind eerder wordt toegelaten dan in het eerste lid is bepaald.

      3 Tot het eerste leerjaar van het voortgezet speciaal onderwijs kan als leerling slechts worden toegelaten degene
      die:

      a. afkomstig is van het speciaal onderwijs en bij wie naar het oordeel van de directeur van de school de grondslag
      voor het volgen van aansluitend voortgezet speciaal onderwijs of voortgezet onderwijs in voldoende mate is gelegd,
      of

      b. afkomstig is van het speciaal onderwijs en aan het einde van het schooljaar de leeftijd van 14 jaar heeft
      bereikt, of

      c. afkomstig is van een basisschool, een speciale school voor basisonderwijs of een school voor voortgezet
      onderwijs en bij wie naar het oordeel van de directeur van de desbetreffende school de grondslag voor het volgen
      van aansluitend voortgezet speciaal onderwijs of voortgezet onderwijs in voldoende mate is gelegd.

      4 Leerlingen bij wie naar het oordeel van de directeur van de school de grondslag voor het volgen van aansluitend
      voortgezet speciaal onderwijs of voortgezet onderwijs in voldoende mate is gelegd, verlaten aan het einde van
      het schooljaar het speciaal onderwijs, mits hierover met de ouders overeenstemming bestaat. In elk geval verlaten
      de leerlingen het speciaal onderwijs aan het einde van het schooljaar waarin zij de leeftijd van 14 jaar hebben
      bereikt. De leerlingen verlaten het voortgezet speciaal onderwijs uiterlijk aan het einde van het schooljaar waarin
      de leeftijd van 20 jaar is bereikt.

      5 Onverminderd [artikel 40, derde lid en achtste lid][ref3], kan de inspecteur voor een leerling in het voortgezet
      speciaal onderwijs ontheffing verlenen van het vierde lid, derde volzin, indien het voortgezet verblijf op
      de school wenselijk is ter voltooiing van zijn opleiding of van een op verhoging van zijn arbeidsgeschiktheid
      gerichte behandeling. Hij kan zich ten behoeve van zijn beslissing een rapport over de leerling, opgesteld
      door de in [artikel 40b][ref4] dan wel [artikel 41, tweede lid][ref5], bedoelde commissie, doen voorleggen.
      De commissie kan daartoe de betrokken leerling aan een onderzoek onderwerpen. De ontheffing wordt telkens voor
      de tijd van ten hoogste 1 jaar verleend. De inspecteur beslist binnen zes weken op een verzoek tot ontheffing.
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref6] is van toepassing.


