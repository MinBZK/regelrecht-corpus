  - number: '57'
    text: |-
      Een bijzondere school wordt in stand gehouden door een rechtspersoon met volledige rechtsbevoegdheid die zich
      blijkens de statuten of reglementen het geven van onderwijs ten doel stelt zonder daarbij het maken van winst te
      beogen.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel57
  - number: '58'
    text: |-
      1 De rechtspersoon die de school in stand houdt, kan de instandhouding van de school overdragen aan een andere
      rechtspersoon die voldoet aan [artikel 57][ref1]. De overdracht geschiedt bij notariële akte.

      2 Bij deze akte verbindt de overdragende rechtspersoon zich tevens de rechten ten aanzien van gebouwen en
      terreinen, alsmede de roerende zaken over te dragen. Deze akte geldt tevens als akte van levering bedoeld in
      [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref2].

      3 In de akte wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen
      en onder dezelfde voorwaarden als vermeld in de arbeidsovereenkomst, benoemt met ingang van de datum van
      overdracht.

      4 Door de overdracht met inachtneming van de voorgaande leden, treedt de verkrijgende rechtspersoon in alle uit de
      wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de school, onverminderd
      hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.

      5 Bij een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref3] van een rechtspersoon
      die een school in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande splitsende rechtspersoon de
      school in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van de school overgaat. In het
      laatste geval zijn het tweede tot en met vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel89
