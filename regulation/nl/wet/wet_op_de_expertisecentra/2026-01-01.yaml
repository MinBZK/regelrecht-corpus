  - number: 170a
    text: |-
      1 Instemming van Onze Minister is vereist ten aanzien van de statuten van het participatiefonds.

      2 Onze Minister is bevoegd tot intrekking van de aanwijzing van de in [artikel 169, tweede lid][ref1], bedoelde
      aanwijzing.

      3 Bij algemene maatregel van bestuur worden regels gesteld omtrent:

      a. nadere taakomschrijving van het participatiefonds;

      b. de voorwaarden voor instemming door Onze Minister met de statuten van het participatiefonds en wijziging van
      deze statuten; en

      c. de gevolgen van intrekking van de aanwijzing van het participatiefonds.

      4 Onze Minister kan subsidie verlenen aan het participatiefonds, ten behoeve van de bedrijfsvoering. De subsidie
      bedraagt ten hoogste het bedrag dat door de begrotingswetgever ter beschikking wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel169
