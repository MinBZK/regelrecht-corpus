      1 Het instellingsbestuur van een instelling voor hoger onderwijs die werkzaamheden uitvoert als bedoeld in
      [artikel 156, eerste lid, onder a][ref1], is partij bij de in artikel 38a, eerste lid, bedoelde overeenkomst.

      2 Indien na het sluiten van die overeenkomst blijkt dat de scholing of begeleiding niet volgens de overeenkomst kan
      worden uitgevoerd, treft dat instellingsbestuur tijdig een toereikende vervangende voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel156
