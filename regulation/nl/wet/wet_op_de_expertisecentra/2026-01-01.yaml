    text: |-
      1 De taken van een instelling zijn:

      a. 1°. het geven van speciaal onderwijs of voortgezet speciaal onderwijs aan kinderen als bedoeld in
      [artikel 2, tweede lid, onderdeel d][ref1], of aan meervoudig gehandicapte kinderen als bedoeld in
      [artikel 8, eerste lid, tweede volzin][ref2]; dan wel

      2°. het geven van speciaal onderwijs of voortgezet speciaal onderwijs aan kinderen als bedoeld in
      [artikel 2, tweede lid, de onderdelen a, b en c][ref3], of aan meervoudig gehandicapte kinderen als bedoeld in
      [artikel 8, eerste lid, derde volzin][ref4];

      b. het begeleiden door een aan een instelling verbonden leraar van een leerling die is ingeschreven op een
      school als bedoeld in de [Wet op het primair onderwijs][ref5], de [Wet voortgezet onderwijs 2020][ref6]
      of van een mbo-student of vavo-student die is ingeschreven op een instelling als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref7] die zonder deze begeleiding zou zijn aangewezen op het onderwijs dat de
      instelling verzorgt, alsmede de ondersteuning van een onderwijsinstelling waarop die leerling, vavo-student of mbo-
      student is geplaatst door een leraar, orthopedagoog, psycholoog of logopedist van de instelling;

      c. het verrichten van algemene ondersteuningsactiviteiten ten behoeve van de bevordering van een optimale
      schoolloopbaan van auditief of communicatief gehandicapte leerlingen, vavo-studenten of mbo-studenten dan wel van
      visueel gehandicapte leerlingen, vavo-studenten of mbo-studenten; en

      d. het bieden van mogelijkheden voor loopbaanbegeleiding als bedoeld in [artikel 44][ref8].

      2 Met ingang van een bij ministeriële regeling te bepalen datum heeft een instelling voor auditief en communicatief
      gehandicapte kinderen tevens tot taak een leerling die is ingeschreven op een school als bedoeld in de
      [Wet op het primair onderwijs][ref9] of de [Wet voortgezet onderwijs 2020][ref10] of een instelling als bedoeld in
      de [Wet educatie en beroepsonderwijs][ref11] te ondersteunen door een tolk.


