  - number: 5a
    text: |-
      1 Het bevoegd gezag draagt zorg voor de veiligheid op school, waarbij het bevoegd gezag in ieder geval:

      a. beleid met betrekking tot de veiligheid voert,

      b. de veiligheid van leerlingen op school monitort met een instrument dat een representatief en actueel beeld
      geeft, en

      c. er zorg voor draagt dat bij een persoon ten minste de volgende taken zijn belegd:

      1°. het coördineren van het beleid in het kader van het tegengaan van pesten, en

      2°. het fungeren als aanspreekpunt in het kader van pesten.

      2 Onder veiligheid, bedoeld in het eerste lid, wordt verstaan de sociale, psychische en fysieke veiligheid van
      leerlingen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het instrument, bedoeld in het
      eerste lid, onderdeel b, dat door de school wordt vormgegeven of gekozen, waaronder:

      a. de aandachtsgebieden die het instrument inzichtelijk maakt,

      b. de representativiteit van het instrument, en

      c. de frequentie waarmee het instrument wordt ingezet.

      4 Het bevoegd gezag zendt onverwijld de resultaten van de monitor, bedoeld in het eerste lid, onderdeel b, aan
      de inspectie.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel5a
