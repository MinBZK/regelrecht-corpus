  - number: 31a
    text: |-
      1 Onder het beroep van leraar wordt verstaan het binnen de kaders van het onderwijskundig beleid van de school,
      verantwoordelijkheid dragen voor het vakinhoudelijke, vakdidactische en pedagogische proces in de school.

      2 Leraren komt een zelfstandige verantwoordelijkheid toe als het gaat om het beoordelen van de onderwijsprestaties
      van leerlingen.

      3 Leraren beschikken over voldoende vakinhoudelijke, vakdidactische en pedagogische zeggenschap, waaronder wordt
      verstaan de zeggenschap over:

      a. de inhoud van de lesstof;

      b. de wijze waarop de lesstof wordt aangeboden en de middelen die daarbij worden gebruikt;

      c. de te hanteren pedagogisch-didactische aanpak op de school en de wijze waarop daar uitvoering aan wordt gegeven,
      waaronder de begeleiding van de leerlingen en de contacten met de ouders;

      d. het in samenhang met de onderdelen a, b en c, onderhouden van de bekwaamheid van de leraren als onderdeel van
      het team.

      4 Het bevoegd gezag stelt in overleg met de leraren een professioneel statuut op waarin de afspraken zijn opgenomen
      over de wijze waarop de zeggenschap van leraren als bedoeld in het derde lid wordt georganiseerd.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel31a
  - number: '32'
    text: |-
      1 Directeuren, adjunct-directeuren en leraren worden door het bevoegd gezag benoemd dan wel tewerkgesteld zonder
      benoeming.

      2 Tot directeur of adjunct-directeur kan slechts worden benoemd of tewerkgesteld zonder benoeming degene die:

      a. in het bezit is van:

      1°. een verklaring omtrent het gedrag,

      2°. een getuigschrift, afgegeven krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1],
      of van een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref2], en

      b. voor zover tot de functie werkzaamheden behoren waarvoor op grond van [artikel 32a, tweede lid][ref3],
      bekwaamheidseisen zijn vastgesteld, in het bezit is van:

      1°. een getuigschrift, afgegeven krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4]
      waaruit blijkt dat aan die eisen is voldaan, of

      2°. een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref5], verleend ten aanzien van de in
      [artikel 32a, tweede lid][ref6], bedoelde werkzaamheden die betrokkene zal verrichten, of

      3°. een bewijsstuk dat hij volgens bij algemene maatregel van bestuur te geven regels zijn bekwaamheid heeft
      aangetoond, en

      c. niet krachtens rechterlijke uitspraak is uitgesloten van het verrichten van de werkzaamheden waarop de benoeming
      of de tewerkstelling zonder benoeming is gericht.

      3 De directeur of adjunct-directeur die niet voldoet aan de eisen van het tweede lid, onder b, mag voor zover het
      werkzaamheden betreft waarvoor op grond van [artikel 32a, tweede lid][ref7], bekwaamheidseisen zijn vastgesteld,
      niettemin met die werkzaamheden worden belast, voor een periode van ten hoogste twee jaren.

      4 De directeur of adjunct-directeur die op grond van [artikel 3][ref8] bevoegd is tot het geven van onderwijs of
      die op grond van [artikel 3a][ref9] bevoegd is tot het verrichten van de daar bedoelde onderwijsondersteunende
      werkzaamheden, kan tevens worden belast met het geven van onderwijs respectievelijk met het verrichten van die
      onderwijsondersteunende werkzaamheden.

      5 Om te kunnen worden benoemd of tewerkgesteld zonder benoeming tot leraar dient betrokkene te
      voldoen aan [artikel 3, eerste lid][ref10], of op grond van het derde, vierde, zesde of achtste
      lid van dat artikel bevoegd te zijn tot het geven van onderwijs, of bevoegd te zijn als bedoeld in
      [artikel 2.66, eerste lid, van de Wet voortgezet onderwijs 2020][ref11].

      6 De onderwijsondersteunend functionaris die wordt belast met werkzaamheden waarvoor op grond
      van [artikel 32a, derde lid][ref12], bekwaamheidseisen zijn vastgesteld, dient te voldoen aan
      [artikel 3a, eerste lid][ref13], onverminderd het tweede tot en met vierde lid van dat artikel.

      7 De onderwijsondersteunend functionaris die wordt belast met andere werkzaamheden dan die waarvoor op grond van
      [artikel 32a, derde lid][ref14], bekwaamheidseisen zijn vastgesteld, dient:

      a. in het bezit te zijn van de verklaring, bedoeld in [artikel 3, eerste lid, onder a][ref15], en

      b. te voldoen aan de overige vereisten voor de te vervullen functie.

      8 Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de vereisten, bedoeld in het
      zevende lid, onder b.

      9 De verklaring, bedoeld in het tweede lid, onder a.1°, [artikel 3, eerste lid, onder a][ref16], en
      [artikel 3a, eerste lid, onder a][ref17], die in verband met de benoeming of tewerkstelling zonder benoeming wordt
      overgelegd, mag op het tijdstip van overlegging aan het bevoegd gezag niet ouder zijn dan zes maanden.

      10 Indien betrokkene in het bezit is van een geschiktheidsverklaring als bedoeld in artikel 162e vindt de benoeming
      of tewerkstelling zonder benoeming plaats voor een periode van ten hoogste twee aaneengesloten schooljaren. Het
      bevoegd gezag kan deze benoemingsperiode, al dan niet onder door dat gezag te stellen voorwaarden, verlengen met
      ten hoogste twee jaren indien het bevoegd gezag daarvoor redenen aanwezig acht. Het bevoegd gezag beschikt over
      geordende gegevens met betrekking tot de toepassing van de tweede volzin. Het bevoegd gezag dat betrokkene voor de
      eerste maal na afgifte van de geschiktheidsverklaring benoemt of tewerkstelt zonder benoeming, tekent het feit en
      de datum van benoeming of tewerkstelling zonder benoeming aan op die verklaring.

      11 Directeuren en adjunct-directeuren die zijn benoemd of tewerkgesteld zonder benoeming voordat de
      [Wet op de beroepen in het onderwijs][ref18] in werking is getreden en bij hun benoeming of tewerkstelling zonder
      benoeming niet beschikten over een getuigschrift als bedoeld in het tweede lid, onder a.2°, zijn vanaf het tijdstip
      van inwerkingtreding van die wet benoembaar of tewerkstelbaar zonder benoeming als directeur respectievelijk
      adjunct-directeur indien zij in elk geval voldoen aan de vereisten van het tweede lid, onder a.1° en c. Het derde
      lid is niet van toepassing op deze directeuren en adjunct-directeuren.


