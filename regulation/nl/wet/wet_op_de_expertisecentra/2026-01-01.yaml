    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: '43'
    text: |-
      1 Over een leerling die de school verlaat, stelt de directeur, na overleg met het onderwijzend
      personeel, ten behoeve van de ontvangende school of school als bedoeld in deze wet of als bedoeld in de
      [Wet voortgezet onderwijs 2020][ref1], een onderwijskundig rapport op. Een afschrift van dit rapport wordt aan de
      ouders van de leerling verstrekt. Bij algemene maatregel van bestuur worden regels over dit rapport gegeven.

      2 Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur wordt aan de beide Kamers der Staten-
      Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken
      bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een van de Kamers of door ten
      minste een vijfde van het grondwettelijk aantal leden van een van de Kamers de wens te kennen wordt gegeven dat het
      onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een daartoe strekkend
      voorstel van wet zo spoedig mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van
      de Kamers der Staten-Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0044212
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0044212
  - number: '44'
    text: |-
      1 Loopbaanbegeleiding als bedoeld in dit artikel en de daarop berustende bepalingen omvat advisering en
      ondersteuning bij de overstap naar de arbeidsmarkt.

      2 Het bevoegd gezag biedt loopbaanbegeleiding aan gedurende de inschrijving op de school en tot twee jaar na het
      verlaten van de school.

      3 Het bevoegd gezag doet een aanbod van loopbaanbegeleiding aan de leerling met het arbeidsmarktgerichte
      uitstroomprofiel, met uitzondering van de leerling met een aansluitende inschrijving voor vervolgonderwijs.

      4 Het bevoegd gezag adviseert op verzoek van de leerling, dan wel zijn ouders indien hij niet meerderjarig
      en handelingsbekwaam is, tot twee jaar nadat de leerling de school heeft verlaten over de overstap naar de
      arbeidsmarkt, het volgen van aansluitend vervolgonderwijs of het functioneren in een vorm van dagbesteding.

      5 Het bevoegd gezag stelt beleid vast met betrekking tot de loopbaanbegeleiding. Het bevoegd gezag houdt
      bij het vaststellen van het beleid rekening met de afspraken uit het regionaal programma, bedoeld in
      [artikel 9.2.8, derde lid, onderdeel b, van de Wet educatie en beroepsonderwijs][ref1].

      6 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de inhoud
      van het beleid, bedoeld in het vijfde lid, en de invulling van de loopbaanbegeleiding.

      7 Van de termijn, bedoeld in het tweede lid, kan worden afgeweken indien daar gerechtvaardigde belangen voor zijn.

      8 Indien in het eerste jaar na het verlaten van de school de leerling geen gebruik heeft gemaakt van het aanbod tot
      loopbaanbegeleiding, doet het bevoegd gezag in het tweede jaar opnieuw een aanbod tot loopbaanbegeleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9.2.8
