      1 Het bevoegd gezag draagt mede in verband met de verplichting, bedoeld in [artikel 19][ref1], zorg voor een goed
      bestuurde school met een scheiding tussen de functies van bestuur en het toezicht daarop, en met een rechtmatig
      bestuur en beheer.

      2 De benoeming in de functies van het bestuur en het interne toezicht op het bestuur, bedoeld in het eerste lid,
      geschiedt op basis van vooraf openbaar gemaakte profielen. Bij de benoeming van de leden van de raad van toezicht
      wordt de medezeggenschapsraad van de school, bedoeld in [artikel 3 van de Wet medezeggenschap op scholen][ref2], in
      de gelegenheid gesteld een bindende voordracht te doen voor een lid.


