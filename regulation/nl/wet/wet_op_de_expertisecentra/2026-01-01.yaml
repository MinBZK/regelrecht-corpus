  - number: '3'
    text: |-
      1 Speciaal onderwijs en voortgezet speciaal onderwijs mag, onverminderd het derde en vierde lid, slechts worden
      gegeven door degene die:

      a. in het bezit is van een verklaring omtrent het gedrag,

      b. in het bezit is van:

      1°. een getuigschrift, afgegeven krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1],
      waaruit blijkt dat ten aanzien van dat onderwijs of ten aanzien van een of meer bij
      algemene maatregel van bestuur aan te wijzen onderdelen daarvan of vakken ingevolge de
      [artikelen 13, eerste, tweede, vijfde en zesde lid][ref2], [14a, tweede lid][ref3], [14c][ref4] en [14f][ref5],
      is voldaan aan de bekwaamheidseisen die zijn vastgesteld krachtens [artikel 32a, eerste lid][ref6], of krachtens
      [artikel 7.10, eerste lid, van de Wet voortgezet onderwijs 2020][ref7], of

      2°. een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref8], verleend ten aanzien van het onderwijs dat
      betrokkene zal geven, of

      3°. een geschiktheidsverklaring als bedoeld in [artikel 151][ref9], en

      c. niet krachtens rechterlijke uitspraak van het geven van onderwijs is uitgesloten.

      2 Het onderwijs in de onderwijsactiviteit zintuiglijke en lichamelijke oefening in groepen bestemd voor leerlingen
      vanaf 7 jaar in het speciaal onderwijs kan in afwijking van het eerste lid, onderdeel b, onder 1, uitsluitend
      worden gegeven door degene die beschikt over een in dat onderdeel b, onder 1, bedoeld getuigschrift waaruit blijkt
      dat wordt voldaan aan de bekwaamheidseisen die zijn vastgesteld krachtens [artikel 32a, eerste lid][ref10], en:

      a. in het bezit is van een bij ministeriële regeling aangewezen getuigschrift dat specifiek is gericht op de
      bekwaamheid tot het geven van dat onderwijs, of

      b. onderwijs volgt ter verkrijging van een dergelijk getuigschrift, in welk geval betrokkene het onderwijs in deze
      onderwijsactiviteit mag geven gedurende ten hoogste twee aaneengesloten schooljaren, gerekend vanaf het moment
      waarop betrokkene het onderwijs ter verkrijging van dit getuigschrift voor de eerste maal volgt.

      2a Het onderwijs in de onderwijsactiviteiten zintuigelijke oefening en lichamelijke oefening in groepen
      bestemd voor leerlingen in het voortgezet speciaal onderwijs wordt, in afwijking van het eerste lid,
      onderdeel b, onder 1, uitsluitend gegeven door degene die in het bezit is van een getuigschrift,
      afgegeven krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref11], waaruit blijkt
      dat ten aanzien van dat onderwijs is voldaan aan de bekwaamheidseisen die zijn vastgesteld krachtens
      [artikel 7.10, eerste lid, van de Wet voortgezet onderwijs 2020][ref12].

      3 Onze Minister kan aan personen die in het bezit zijn van een buiten de Europese Economische Ruimte of Zwitserland
      behaald bewijsstuk waarmee de bekwaamheid wordt aangetoond, de bevoegdheid tot het geven van speciaal onderwijs en
      voortgezet speciaal onderwijs verlenen. Hij kan daarbij voorwaarden en beperkingen stellen.

      4 Onze Minister kan met betrekking tot een vak waarvoor geen lerarenopleiding bestaat en ook anderszins niet aan de
      hand van enig bewijsstuk kan worden aangetoond dat betrokkene voldoet aan de bekwaamheidseisen, verklaren dat een
      leraar wordt geacht te voldoen aan de bekwaamheidseisen tot het geven van voortgezet speciaal onderwijs in dat vak.

      5 Bij tijdelijke afwezigheid van een leraar kan ten aanzien van degene die hem vervangt voor ten hoogste twaalf
      maanden worden afgeweken van de eisen, gesteld in het eerste lid, onderdeel b, met dien verstande dat de periode
      van twaalf maanden is verstreken vanaf de dag dat perioden van vervanging als bedoeld in dit lid elkaar met
      tussenpozen van niet meer dan drie maanden hebben opgevolgd en een periode van twaalf maanden, deze tussenpozen
      inbegrepen, is overschreden. Indien in een vacature niet terstond kan worden voorzien door de benoeming of
      tewerkstelling zonder benoeming van een leraar die aan de genoemde eisen voldoet, is het bepaalde in de vorige
      volzin van overeenkomstige toepassing. Deze termijn van een jaar kan met ten hoogste twee jaren worden verlengd
      indien het bevoegd gezag en de betrokkene schriftelijk verklaren dat betrokkene verplicht is zich in te spannen
      binnen twee jaren alsnog te voldoen aan de eisen gesteld in het eerste lid, onderdeel b. Het bevoegd gezag kan
      onder de voorwaarden, genoemd in de vorige volzin, een verlenging van nog eens twee jaren geven indien het dat
      noodzakelijk oordeelt vanwege de kwaliteit en de voortgang van het onderwijs op de school. Het bevoegd gezag
      beschikt over geordende gegevens met betrekking tot de toepassing van dit lid.

      6 Onverminderd het vijfde lid kan ten aanzien van ho-studenten die een duale opleiding volgen als bedoeld in
      [artikel 7.7 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref13] leidend tot een getuigschrift
      als bedoeld in het eerste lid, onder b.1°, en aan die opleiding ten minste 180 studiepunten hebben behaald, worden
      afgeweken van de eisen in het eerste lid onder b, met dien verstande dat het tijdelijk dienstverband van de ho-
      student een periode beslaat die overeenkomt met een volledig dienstverband van vijf maanden. De vorige volzin
      is van overeenkomstige toepassing ten aanzien van ho-studenten die ten minste 166 doch nog geen 180 studiepunten
      hebben behaald, indien door de desbetreffende hogeschool wordt verklaard dat de ho-student beschikt over met
      180 studiepunten vergelijkbare en tevens voor het dienstverband relevante kennis, inzicht en vaardigheden. De
      toepassing van de vorige volzin vervalt ten aanzien van die ho-student die niet binnen vier weken na aanvang van
      het dienstverband over 180 studiepunten beschikt. De in artikel 7.7, vijfde lid, van de Wet op het hoger onderwijs
      en wetenschappelijk onderzoek bedoelde overeenkomst vermeldt tevens de leraar onder wiens verantwoordelijkheid de
      betrokken ho-student werkzaamheden van onderwijskundige aard verricht.

      7 Dit artikel is niet van toepassing op het geven van onderwijs als bedoeld in
      [artikel 14a, eerste lid, onderdeel b][ref14].

      8 Op het geven van onderwijs in een entreeopleiding die wordt verzorgd op basis van
      [artikel 14a, tweede lid][ref15], is het eerste lid, onderdeel b, sub 1° en sub 3°, niet van toepassing. In plaats
      daarvan is [artikel 7.11, eerste lid, onderdeel a, en vijfde lid, van de Wet voortgezet onderwijs 2020][ref16]
      daarop van overeenkomstige toepassing. Op het geven van onderwijs als bedoeld in de eerste volzin
      zijn eveneens de voorschriften gegeven bij of krachtens de [artikelen 7.11, vijfde lid][ref17],
      [7.18][ref18], [7.20, eerste lid][ref19], [7.26 tot en met 7.33][ref20] en
      [7.45 tot en met 7.64, van de Wet voortgezet onderwijs 2020][ref21] van overeenkomstige toepassing.

      9 Op de inzet van een leraar voor speciaal onderwijs en voortgezet speciaal onderwijs is [artikel 31a][ref22] van
      toepassing.


