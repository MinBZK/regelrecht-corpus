  - number: '61'
    text: |-
      1 Indien het bevoegd gezag van een bijzondere school op grond van [artikel 36, derde lid][ref1], een ho-student de
      toegang weigert, deelt het bevoegd gezag deze beslissing, schriftelijk en met redenen omkleed, mede door toezending
      of uitreiking aan de ho-student, onverminderd het bepaalde in dat artikellid.

      2 Indien het bevoegd gezag van een bijzondere school hetzij weigert een leerling toe te laten, hetzij een leerling
      verwijdert, op grond van [artikel 40, eerste lid en zesde lid][ref2], deelt het deze beslissing, schriftelijk
      en met redenen omkleed, mede door toezending of uitreiking aan de ouders. Daarbij wordt tevens de inhoud van het
      bepaalde in het derde lid, eerste volzin, vermeld. Voordat het bevoegd gezag van een bijzondere school op grond van
      [artikel 40, eerste lid en zesde lid][ref3], beslist tot verwijdering van een leerling, hoort het de ouders van de
      leerling, onverminderd het [zesde lid van dat artikel][ref4].

      3 Binnen 6 weken na de mededeling, bedoeld in het tweede lid, kunnen de ouders bij het bevoegd gezag schriftelijk
      hun bezwaren kenbaar maken tegen de beslissing. Het bevoegd gezag beslist binnen 4 weken na ontvangst van de
      bezwaren. Alvorens te beslissen hoort het bevoegd gezag de ouders.

      4 Het bevoegd gezag beslist niet eerder op de bezwaren dan:

      a. na overleg met de inspecteur en desgewenst met andere deskundigen,

      b. nadat de ouders kennis hebben kunnen nemen van de op de beslissing betrekking hebbende adviezen of rapporten, en

      c. de ouders opnieuw zijn gehoord.

      5 Het bevoegd gezag van een bijzondere school kan beslissen een aanmelding voor toelating niet te behandelen,
      indien de verstrekte gegevens en bescheiden onvoldoende zijn voor de beoordeling van de aanmelding of voor
      de voorbereiding van de toelatingsbeslissing, mits de ouders dan wel, indien de leerling meerderjarig en
      handelingsbekwaam is, de leerling, de gelegenheid hebben gehad de aanmelding binnen een door het bevoegd gezag
      gestelde termijn aan te vullen. Een beslissing om de aanmelding niet te behandelen wordt aan de ouders dan wel de
      leerling bekendgemaakt binnen vier weken nadat de aanmelding is aangevuld of nadat de daarvoor gestelde termijn
      ongebruikt is verstreken. De termijn voor het nemen van de toelatingsbeslissing wordt opgeschort met ingang van de
      dag waarop het bevoegd gezag krachtens de eerste volzin de ouders dan wel de leerling uitnodigt de aanmelding aan
      te vullen, tot de dag waarop de aanmelding is aangevuld of de daarvoor gestelde termijn ongebruikt is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel40
