  - number: '70'
    text: |-
      1 Het Rijk bekostigt openbare en bijzondere scholen met in achtneming van deze titel, met uitzondering van
      [afdeling 3][ref1].

      2 Geen bekostiging vindt plaats indien leerlingen van verschillende scholen al dan niet van hetzelfde bevoegd
      gezag gezamenlijk onderwijs ontvangen, tenzij het betreft de uitvoering van een deel van het schoolplan op grond
      van [artikel 24][ref2].

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld ter uitvoering van het eerste lid.
      Deze algemene maatregel van bestuur bevat in ieder geval de termijnen waarbinnen besluiten moeten worden genomen.

      4 Een krachtens het derde lid vastgestelde algemene maatregel van bestuur wordt aan de Tweede Kamer der Staten-
      Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken
      wordt vastgesteld, tenzij binnen die termijn door of namens de Kamer de wens te kennen wordt gegeven dat het
      onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een daartoe strekkend
      voorstel van wet zo spoedig mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van
      de Kamers der Staten-Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur
      ingetrokken.

      5 [Artikel 4:32 van de Algemene wet bestuursrecht][ref3] is niet van toepassing op de bekostiging van scholen.

      6 Het Rijk verstrekt jaarlijks aan de provincie Fryslân bekostiging voor het onderwijs in de Friese taal, bedoeld
      in [artikel 13, zesde lid][ref4]. De provincie Fryslân draagt zorg voor verdeling van de bekostiging over de
      betrokken scholen naar rato van het aantal leerlingen dat gebruik maakt van dat onderwijs.


