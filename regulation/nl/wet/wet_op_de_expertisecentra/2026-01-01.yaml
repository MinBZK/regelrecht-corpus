  - number: '11'
    text: |-
      1 Het onderwijs wordt afgestemd op de ontwikkelingsmogelijkheden van de leerling. Zo nodig treedt het bevoegd gezag
      daarbij in overleg met:

      a. het college van burgemeester en wethouders van de gemeente waar de leerling zijn woonplaats heeft als bedoeld in
      [artikel 1.1. van de Jeugdwet][ref1],

      b. een instantie die jeugdgezondheidszorg uitvoert als bedoeld in [artikel 5 van de Wet publieke gezondheid][ref2].

      c. een instantie die maatschappelijke ondersteuning biedt als bedoeld in
      [artikel 1, eerste lid, onder g, 2°, van de Wet maatschappelijke ondersteuning][ref3],

      d. een zorgaanbieder als bedoeld in
      [artikel 1, eerste lid, onder j, van de Algemene Wet Bijzondere Ziektekosten][ref4] of

      e. een zorgaanbieder die geneeskundige geestelijke gezondheidszorg levert welke behoort tot de prestaties
      omschreven bij of krachtens de[ Zorgverzekeringswet][ref5].

      Het onderwijs wordt zodanig ingericht dat de leerling een ononderbroken ontwikkelingsproces kan doorlopen. Zo
      mogelijk brengt het kinderen tot het volgen van gewoon onderwijs in basisscholen of scholen voor voortgezet
      onderwijs.

      2

      3 Het onderwijs richt zich in elk geval op de emotionele en de verstandelijke ontwikkeling, op het ontwikkelen
      van creativiteit, het verwerven van kennis en van sociale, culturele en lichamelijke vaardigheden. Het onderwijs
      wordt bovendien zodanig ingericht dat daarbij op structurele en herkenbare wijze aandacht wordt besteed aan het
      bestrijden van achterstanden in het bijzonder in de beheersing van de Nederlandse taal.

      4 Het onderwijs bevordert actief burgerschap en sociale cohesie op doelgerichte en samenhangende wijze, waarbij het
      onderwijs zich in ieder geval herkenbaar richt op:

      a. het bijbrengen van respect voor en kennis van de basiswaarden van de democratische rechtsstaat, zoals verankerd
      in de [Grondwet][ref6], en de universeel geldende fundamentele rechten en vrijheden van de mens, en het handelen
      naar deze basiswaarden op school;

      b. het ontwikkelen van de sociale en maatschappelijke competenties die de leerling in staat stellen deel uit te
      maken van en bij te dragen aan de pluriforme, democratische Nederlandse samenleving; en

      c. het bijbrengen van kennis over en respect voor verschillen in godsdienst, levensovertuiging, politieke
      gezindheid, afkomst, geslacht, handicap of seksuele gerichtheid alsmede de waarde dat gelijke gevallen gelijk
      behandeld worden.

      4a Het bevoegd gezag draagt zorg voor een schoolcultuur die in overeenstemming is met de waarden, bedoeld in het
      vierde lid, onderdeel a, creëert een omgeving waarin leerlingen worden gestimuleerd actief te oefenen met de omgang
      met en het handelen naar deze waarden en draagt voorts zorg voor een omgeving waarin leerlingen en personeel zich
      veilig en geaccepteerd weten, ongeacht de in het vierde lid, onder c, genoemde verschillen.

      5 De onderwijsactiviteiten worden evenwichtig over de dag verdeeld.

      6 Het onderwijs wordt zodanig ingericht dat leerlingen die in verband met ziekte thuis verblijven dan wel zijn
      opgenomen in een ziekenhuis, op adequate wijze voldoende onderwijs kunnen genieten.


