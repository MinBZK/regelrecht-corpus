  - number: '170'
    text: |-
      1 Het participatiefonds kan het burgerservicenummer van het personeelslid of het gewezen personeelslid van het
      bevoegd gezag uitsluitend in het kader van de toepassing van [artikel 169][ref1] gebruiken in het verkeer met:

      a. het personeelslid of het gewezen personeelslid;

      b. het bevoegd gezag waar de in onderdeel a bedoelde persoon werkzaam is of was;

      c. de instanties, bedoeld in [artikel 169, derde lid, onderdeel b][ref2]; en

      d. het Uitvoeringsinstituut werknemersverzekeringen.

      2 Het burgerservicenummer wordt op een daartoe strekkend verzoek aan het participatiefonds verstrekt door het
      bevoegd gezag waar het personeelslid werkzaam is of was.

      3 Indien dat ten behoeve van het jaarverslag, bedoeld in
      [artikel 18, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref3], noodzakelijk is, worden gegevens
      daarin slechts zodanig openbaar gemaakt dat daaraan geen herkenbare gegevens over een afzonderlijk persoon
      kunnen worden ontleend, tenzij het betreft de controle op de juistheid van de gegevens in het kader van de
      controle op de rechtmatigheid en de doelmatigheid van door de rechtspersoon gedane uitgaven. Daarbij kunnen de
      burgerservicenummers worden vergeleken met de burgerservicenummers die door andere daartoe bij of krachtens de wet
      bevoegde instanties zijn verstrekt.


