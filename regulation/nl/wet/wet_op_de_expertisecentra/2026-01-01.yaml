  - number: '77'
    text: |-
      De bekostiging van een school kan slechts een aanvang nemen, indien zij voorkomt op een plan van nieuwe scholen,
      vastgesteld volgens de bepalingen van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel77
  - number: '78'
    text: |-
      1 Provinciale staten stellen op voordracht van gedeputeerde staten, al dan niet in samenwerking met provinciale
      staten van een of meer andere provincies, jaarlijks voor 1 augustus een plan van nieuwe scholen in de provincie
      van vestiging vast voor de scholen voor slechthorende kinderen, voor lichamelijk gehandicapte kinderen, scholen
      voor langdurig zieke kinderen, scholen voor zeer moeilijk lerende kinderen, scholen voor zeer moeilijk opvoedbare
      kinderen en scholen voor meervoudig gehandicapte kinderen, die in de 4 kalenderjaren volgende op het jaar van
      vaststelling voor bekostiging uit de openbare kassen in aanmerking dienen te worden gebracht. Het plan heeft ten
      doel te komen tot een evenwichtig geheel van onderwijsvoorzieningen in de betrokken provincie. Het plan behoeft de
      goedkeuring van Onze Minister.

      2 Bij de vaststelling van het plan wordt uitgegaan van de verzoeken bedoeld in [artikel 81][ref1]. Tevens
      bezien provinciale staten bij de vaststelling van het plan of voldoende is voorzien in de behoefte aan openbaar
      onderwijs. Provinciale staten betrekken bij de vaststelling van het plan de opnamecapaciteit van de bestaande
      onderwijsvoorzieningen.

      3 Het plan vermeldt van elke school of het betreft:

      a. een school voor speciaal onderwijs;

      b. een school voor voortgezet speciaal onderwijs;

      c. een school voor speciaal en voortgezet speciaal onderwijs;

      d. een afdeling.

      Het plan vermeldt tevens de schoolsoort, de plaats van vestiging en de te verwachten omvang, alsmede welke scholen
      in het eerste jaar van de planperiode voor bekostiging in aanmerking komen en de reden waarom de overige scholen
      daarvoor niet in aanmerking komen.

      4 Bij de goedkeuring van Onze Minister van het plan treden voor de toepassing van
      [artikel 4:8 van de Algemene wet bestuursrecht][ref2] gedeputeerde staten in de plaats van het bevoegd gezag van de
      bijzondere scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel48
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel78
