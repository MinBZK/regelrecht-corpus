  - number: 41a
    text: |-
      1 Voor een leerling voor wie speciaal onderwijs dan wel voortgezet speciaal onderwijs wordt verzorgd, stelt het
      betreffende bevoegd gezag een ontwikkelingsperspectief vast na advies van de commissie voor de begeleiding dan wel
      de commissie van onderzoek en nadat op overeenstemming gericht overleg is gevoerd met de ouders dan wel, indien de
      leerling meerderjarig en handelingsbekwaam is, met de leerling.

      2 In afwijking van het eerste lid, wordt het deel van het ontwikkelingsperspectief betreffende de individuele
      begeleiding van de leerling vastgesteld na advies van de commissie voor begeleiding dan wel de commissie van
      onderzoek en nadat hierover overeenstemming bereikt is tussen het bevoegd gezag en de ouders dan wel, indien de
      leerling meerderjarig en handelingsbekwaam is, met de leerling.

      3 Het ontwikkelingsperspectief wordt zo spoedig mogelijk, doch uiterlijk binnen zes weken na de inschrijving van de
      leerling vastgesteld. Indien het betreft een inschrijving op grond van [artikel 40, achtste of negende lid][ref1],
      wordt het ontwikkelingsperspectief uiterlijk binnen zes weken na de definitieve plaatsing van de leerling
      vastgesteld.

      4 Het bevoegd gezag evalueert het ontwikkelingsperspectief ten minste één keer per schooljaar met de ouders en de
      leerling, of, indien de leerling meerderjarig en handelingsbekwaam is, met de leerling.

      5 Na advies van de commissie voor de begeleiding dan wel de commissie van onderzoek en nadat op overeenstemming
      gericht overleg is gevoerd met de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, met de
      leerling, kan het bevoegd gezag het ontwikkelingsperspectief bijstellen.

      6 In afwijking van het vijfde lid kan het bevoegd gezag het deel van het ontwikkelingsperspectief betreffende
      de individuele begeleiding van de leerling bijstellen na advies van de commissie voor de begeleiding dan wel de
      commissie van onderzoek en nadat overeenstemming bereikt is met de ouders, dan wel, indien de leerling meerderjarig
      en handelingsbekwaam is, met de leerling.

      7 Indien de leerling niet meerderjarig en handelingsbekwaam is, stelt het bevoegd gezag het
      ontwikkelingsperspectief vast of stelt het bij nadat het bevoegd gezag de leerling in de gelegenheid heeft gesteld
      op een door de leerling te bepalen wijze vrijelijk zijn mening hierover naar voren te brengen. Het bevoegd gezag
      biedt de leerling daartoe de ondersteuning die hij nodig heeft.

      8 Het bevoegd gezag beschrijft in het ontwikkelingsperspectief de inbreng van de leerling en hoe deze van invloed
      is geweest op de vast- of bijstelling van het ontwikkelingsperspectief.

      9 Het bevoegd gezag licht aan de leerling toe op welke wijze diens mening van invloed is geweest op de vast- of
      bijstelling van het ontwikkelingsperspectief.

      10 Bij algemene maatregel van bestuur worden voorschriften over de inhoud van het ontwikkelingsperspectief
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
