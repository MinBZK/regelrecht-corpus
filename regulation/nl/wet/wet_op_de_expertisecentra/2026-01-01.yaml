  - number: '124'
    text: |-
      1 Indien een gemeente zelf een of meer openbare scholen in stand houdt en zij uitgaven wil doen voor het onderwijs
      welke niet door het Rijk worden bekostigd, kan de gemeenteraad daarvoor bij verordening een regeling vaststellen.

      2 [Artikel 123, tweede tot en met zesde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel123
