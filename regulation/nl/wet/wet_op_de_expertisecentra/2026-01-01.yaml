        artikel: '1.4'
  - number: '19'
    text: |-
      Het bevoegd gezag draagt zorg voor de kwaliteit van het onderwijs op de school. Onder zorg dragen voor de kwaliteit
      van het onderwijs wordt in elk geval verstaan het naleven van de bij of krachtens deze wet gegeven voorschriften en
      het uitvoeren van het stelsel van kwaliteitszorg, bedoeld in [artikel 21, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel21
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '21'
        paragraaf: '1'
        afdeling: '1'
  - number: 19a
    text: |-
      De kwaliteit van het onderwijs is zeer zwak indien de school tekortschiet in de naleving van twee of meer
      bij of krachtens deze wet gegeven voorschriften en de school dientengevolge tekortschiet in het zorg dragen
      voor de veiligheid op school, bedoeld in [artikel 5a][ref1], of het zodanig inrichten van het onderwijs dat
      leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen dan wel het afstemmen van het onderwijs op de
      ontwikkelingsmogelijkheden van de leerlingen, bedoeld in [artikel 11, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel11
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel19a
