  - number: '88'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de uitvoering van deze
      afdeling.

      2 De algemene maatregel van bestuur bedoeld in het eerste lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure
      bedoeld in de eerste 3 volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel88
  - number: '89'
    text: |-
      1 De gemeenteraad en het college van burgemeester en wethouders dragen ten behoeve van de door de gemeente in stand
      gehouden scholen en ten behoeve van de niet door de gemeente in stand gehouden scholen zorg voor de voorzieningen
      in de huisvesting op het grondgebied van de gemeente overeenkomstig het bepaalde in deze afdeling. De gemeenteraad
      en het college van burgemeester en wethouders behandelen daarbij de door de gemeente in stand gehouden scholen en
      de niet door de gemeente in stand gehouden scholen op gelijke voet.

      2 Voor de toepassing van deze afdeling worden onder een niet door de gemeente in stand gehouden school mede
      begrepen een op het grondgebied van de gemeente gelegen nevenvestiging als bedoeld in [artikel 76a][ref1] en
      [artikel 76b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel76a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel76b
