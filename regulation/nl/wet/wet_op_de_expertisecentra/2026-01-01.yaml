  - number: '108'
    text: |-
      1 Het college van burgemeester en wethouders en het bevoegd gezag van een niet door de gemeente in stand gehouden
      school dat eigenaar is van het gebouw en terrein, kunnen in een gezamenlijke akte verklaren dat het bevoegd gezag
      blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor eigendomsoverdracht
      vatbaar gedeelte daarvan, voor de school te gebruiken.

      2 Gedeputeerde staten kunnen in geval van een geschil omtrent de toepassing van het eerste lid desgevraagd
      besluiten dat het bevoegd gezag blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of
      een voor eigendomsoverdracht vatbaar gedeelte daarvan, voor de school te gebruiken. De aanvraag om het besluit
      wordt gedaan door het college van burgemeester en wethouders of door het bevoegd gezag van de school. Alvorens op
      de aanvraag te besluiten, horen gedeputeerde staten de wederpartij.

      3 Het bevoegd gezag van een niet door de gemeente in stand gehouden school dat voornemens is gebouwen of terreinen,
      of een gedeelte daarvan, blijvend niet meer voor de school te gebruiken, doet hiervan onverwijld mededeling aan het
      college van burgemeester en wethouders.

      4 Zodra de in het eerste lid bedoelde akte door beide partijen is getekend, of het in het tweede lid bedoelde
      besluit van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van
      de rechter, inhoudende een besluit als bedoeld in het tweede lid eerste volzin, in de plaats treedt van het
      vernietigde besluit, wordt de akte, het onherroepelijk geworden besluit onderscheidenlijk de uitspraak, tenzij deze
      een gebouw betreft als bedoeld in artikel E 24 van de Overgangswet ISOVSO, ingeschreven in de openbare registers,
      bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1]. Door de inschrijving verkrijgt de
      gemeente de eigendom.

      5 Het college van burgemeester en wethouders en het bevoegd gezag van een niet door de gemeente in stand gehouden
      school dat eigenaar is van het schoolgebouw, kunnen in een gezamenlijke akte verklaren dat een gedeelte van het
      gebouw dat niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs nodig zal zijn.

      6 Gedeputeerde staten kunnen in geval van een geschil omtrent de toepassing van het vijfde lid desgevraagd
      besluiten dat een gedeelte van het gebouw dat niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor het
      onderwijs nodig zal zijn. De aanvraag om het besluit wordt gedaan door het college van burgemeester en wethouders
      of door het bevoegd gezag van de school. Alvorens op de aanvraag te besluiten, horen gedeputeerde staten de
      wederpartij.

      7 Zodra de in het vijfde lid bedoelde akte door beide partijen is getekend, of het in het zesde lid bedoelde
      besluit van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van
      de rechter, inhoudende een beslissing als bedoeld in het zesde lid eerste volzin, in de plaats treedt van
      het vernietigde besluit, kan het bevoegd gezag van een niet door de gemeente in stand gehouden school het
      desbetreffende gedeelte van het gebouw met toestemming van het college van burgemeester en wethouders verhuren.

      8 De toestemming, bedoeld in het zevende lid, wordt verleend voor een tijdvak van ten hoogste 3 jaren. Op verzoek
      van het bevoegd gezag kan dit tijdvak telkens worden verlengd met een termijn van ten hoogste 3 jaren.

      9 Op de verhuur, bedoeld in het zevende lid, is [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref2] niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
