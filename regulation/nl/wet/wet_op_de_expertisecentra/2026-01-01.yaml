  - number: 188a
    text: |-
      1 Vanaf het tijdstip van inwerkingtreding van artikel II, onderdelen B en D van de Wet van 11 oktober 2021
      tot wijziging van de Wet op het primair onderwijs en de Wet op de expertisecentra in verband met beëindiging
      van de verplichte aansluiting bij een rechtspersoon in verband met kosten van vervanging en in verband met
      wijziging van de wijze waarop de werkloosheidsuitkeringen worden verevend (beëindiging vervangingsfonds en
      hervorming participatiefonds) kan het bevoegd gezag van een school of het bestuur van een centrale dienst of
      een samenwerkingsverband bij het participatiefonds een aanvraag indienen tot het vergoeden van de kosten van
      vervangingen in de periode tot en met de dag voor genoemd tijdstip.

      2 Op de afwikkeling van aanvragen, ingediend voor de datum van inwerkingtreding van de wet, bedoeld in het eerste
      lid, alsmede op geschillen daarover in bezwaar, beroep of hoger beroep, zijn de regelingen van toepassing zoals die
      luidden op de dag voor het tijdstip, bedoeld in het eerste lid, met inbegrip van de regels, bedoeld in artikel 167,
      vierde lid, en artikel 168 zoals luidend op de dag voor genoemd tijdstip.

      3 Het participatiefonds besluit op de aanvragen met inachtneming van de regelingen, bedoeld in het tweede lid
      van dit artikel. Het participatiefonds verantwoordt in zijn jaarrekening afzonderlijk de taken en werkzaamheden,
      bedoeld in dit artikel.

      4 De rechtspersoon, bedoeld in artikel 167, eerste lid, van deze wet, zoals luidend op de dag voor het tijdstip,
      bedoeld in het eerste lid, brengt overeenkomstig de artikelen 18, 34, 35 en 37 van de Kaderwet zelfstandige
      bestuursorganen aan Onze Minister over het kalenderjaar dat direct vooraf gaat aan genoemd tijdstip verslag uit
      over zijn werkzaamheden.

      5 Artikel 173, derde lid, onderdeel c, van deze wet, en de daarop berustende bepalingen, zoals luidend op de dag
      voor het tijdstip, bedoeld in het eerste lid, zijn van toepassing op de bestemming van de resterende middelen die
      op grond van artikel 167, tweede lid, zoals luidend op de dag voor genoemd tijdstip, aan de rechtspersoon, bedoeld
      in artikel 167, eerste lid, zoals luidend op de dag voor genoemd tijdstip, zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel188a
  - number: 188b
    text: |-
      1 Verzoeken tot vergoeding als bedoeld in de [artikelen 132, tweede lid][ref1], en
      [170, vierde en vijfde lid][ref2], zoals deze artikelen luidden op de dag voor inwerkingtreding van artikel II,
      onderdelen C, E, F, G, I en J van de Wet van 11 oktober 2021 tot wijziging van de Wet op het primair onderwijs en
      de Wet op de expertisecentra in verband met de beëindiging van de verplichte aansluiting bij een rechtspersoon in
      verband met de kosten van vervanging en in verband met wijziging van de wijze waarop de werkloosheidsuitkeringen
      worden verevend (beëindiging vervangingsfonds en hervorming participatiefonds) kunnen tot zes maanden na
      inwerkingtreding van voornoemde wet worden ingediend bij het participatiefonds.

      2 Op de afwikkeling van de aanvragen, alsmede op geschillen daarover in bezwaar en beroep of hoger beroep, zijn de
      [artikelen 132, tweede lid][ref3], en [170, vierde en vijfde lid][ref4], en de daarop gebaseerde regelingen, zoals
      deze luidden op 31 maart 2022, van toepassing, met dien verstande dat vanaf de inwerkingtreding van de Wet van
      11 oktober 2021 tot wijziging van de Wet op het primair onderwijs en de Wet op de expertisecentra in verband met
      de beëindiging van de verplichte aansluiting bij een rechtspersoon in verband met de kosten van vervanging en in
      verband met wijziging van de wijze waarop de werkloosheidsuitkeringen worden verevend (beëindiging vervangingsfonds
      en hervorming participatiefonds) (Stb. 2021, 538) de financiële afwikkeling bij het participatiefonds ligt.


