        paragraaf: '5'
        afdeling: '1'
  - number: '21'
    text: |-
      1 Het schoolplan bevat een beschrijving van het beleid met betrekking tot de kwaliteit van het onderwijs dat
      binnen de school wordt gevoerd, en omvat in elk geval het onderwijskundig beleid, het personeelsbeleid en het
      stelsel van kwaliteitszorg. Het schoolplan omvat mede het beleid ten aanzien van de aanvaarding van materiële
      bijdragen of geldelijke bijdragen, niet zijnde ouderbijdragen of op de onderwijswetgeving gebaseerde bijdragen,
      indien het bevoegd gezag daarbij verplichtingen op zich neemt waarmee de leerlingen binnen de schooltijden
      en tijdens de activiteiten die worden georganiseerd onder verantwoordelijkheid van het bevoegd gezag, alsmede
      tijdens het overblijven, zullen worden geconfronteerd. In het schoolplan wordt aangegeven op welke wijze de
      identiteitscommissie, bedoeld in [artikel 28j][ref1], invulling geeft aan het openbare karakter onderscheidenlijk
      de identiteit voor zover het betreft een samenwerkingsschool.

      2 De beschrijving van het onderwijskundig beleid omvat in elk geval:

      a. de uitwerking van de wettelijke voorschriften betreffende de uitgangspunten, de doelstelling en de inhoud van
      het onderwijs,

      b. de door het bevoegd gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs in een
      onderwijsprogramma,

      c. het pedagogisch-didactisch klimaat en het schoolklimaat,

      d. het zorg dragen voor de veiligheid op school, bedoeld in [artikel 5a][ref2].

      Bij de beschrijving van het onderwijskundig beleid wordt tevens het ondersteuningsaanbod van de school betrokken.

      3 De beschrijving van het personeelsbeleid omvat in elk geval:

      a. het voldoen aan de eisen van bevoegdheid en de wijze waarop de bekwaamheid wordt onderhouden,

      b. de maatregelen met betrekking tot het personeel die bijdragen aan de ontwikkeling en de uitvoering van het
      onderwijskundig beleid,

      c. het pedagogisch-didactisch handelen van het onderwijspersoneel,

      d. cijfers over de mate van evenredige vertegenwoordiging van vrouwen in leidinggevende posities, en

      e. de wijze waarop rekening wordt gehouden met de inbreng van leerlingen op dat beleid.

      4 De beschrijving van het stelsel van kwaliteitszorg omvat in elk geval het zorg dragen voor:

      a. het bewaken dat de leerling een ononderbroken ontwikkelingsproces kan doorlopen en dat het onderwijs wordt
      afgestemd op de ontwikkelingsmogelijkheden van de leerlingen, bedoeld in [artikel 11, eerste lid][ref3], mede met
      behulp van het leerling- en onderwijsvolgsysteem, bedoeld in [artikel 48c, eerste lid][ref4], en

      b. het vaststellen welke maatregelen ter verbetering nodig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28j
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel48c
