        bwb_id: BWBR0003549
        artikel: '84'
        afdeling: '2'
  - number: '81'
    text: |-
      1 Een aanvraag tot opneming in het plan wordt voor 1 februari van het jaar van de vaststelling van het
      plan, bij gedeputeerde staten ingediend door de gemeenteraad, door een openbare rechtspersoon als bedoeld in
      [artikel 50][ref1], door een stichting als bedoeld in [artikel 28][ref2] of [51][ref3], of door ouders, indien het
      een openbare school betreft, en door het bevoegd gezag, indien het een bijzondere school betreft.

      2 Elke aanvraag is met redenen omkleed en gaat vergezeld van:

      a. een prognose van het te verwachten aantal leerlingen,

      b. de beschrijving van het voedingsgebied,

      c. de aanduiding van de plaats waar het onderwijs moet worden gegeven,

      d. de voorgestelde datum van ingang van de bekostiging en

      e. indien het een school voor meervoudig gehandicapte kinderen betreft, een opgave van de handicaps van de
      leerlingen waarvoor de school is bestemd.

      [Artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref4] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel51
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel81
