  - number: 119a
    text: |-
      In afwijking van [artikel 113][ref1] kan het bevoegd gezag van de school met het bevoegd gezag van de
      instelling voor beroepsonderwijs waarmee het een samenwerkingsovereenkomst heeft gesloten als bedoeld in
      [artikel 2.107b, tweede lid, van de Wet voortgezet onderwijs 2020][ref2] overeenkomen om vanwege een doorlopende
      leerroute vmbo-mbo als bedoeld in [artikel 2.107a, tweede lid, van die wet][ref3] of de geïntegreerde route vmbo-
      basisberoepsopleiding, bedoeld in [artikel 2.107l, tweede lid, van die wet][ref4] een deel van de bekostiging over
      te dragen aan dat andere bevoegd gezag.


