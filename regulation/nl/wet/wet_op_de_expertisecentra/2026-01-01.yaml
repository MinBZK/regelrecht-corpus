  - number: '95'
    text: |-
      Het college van burgemeester en wethouders stelt geen programma als bedoeld in [artikel 93][ref1] en geen overzicht
      als bedoeld in [artikel 94][ref2] vast, indien geen voorziening in de huisvesting nodig is noch een aanvraag is
      ingediend voor scholen als bedoeld in [artikel 91, eerste lid, onderdelen a tot en met d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93
