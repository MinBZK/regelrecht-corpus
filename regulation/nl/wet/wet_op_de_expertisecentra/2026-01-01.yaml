  - number: '160'
    text: |-
      1 Onze Minister kan bepalen dat geen of slechts gedeeltelijke bekostiging wordt verstrekt voor uitgaven die het
      gevolg zijn van schuld of nalatigheid van het bevoegd gezag.

      2 Indien de uitgaven bedoeld in het eerste lid, voor bekostiging door het Rijk in aanmerking komen, treedt het Rijk
      op het moment van een uitdrukkelijk besluit tot bekostiging in alle rechten die het bevoegd gezag ter zake tegen
      derden mocht hebben.

      3 Indien de gemeente een collectieve verzekering heeft afgesloten voor de vergoeding van schade, ontstaan aan
      gebouwen, terreinen of roerende zaken van een door de gemeente bekostigde niet door de gemeente in stand gehouden
      school, heeft het bevoegd gezag van de desbetreffende school jegens de gemeente geen aanspraak op vergoeding van
      dergelijke schade, voor zover die collectieve verzekering de schade dekt.

      4 Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een niet door de gemeente in stand gehouden
      school voor vergoeding door de gemeente in aanmerking komt, treedt de gemeente op het moment van een uitdrukkelijk
      besluit tot vergoeding in alle rechten die het bevoegd gezag ter zake van die schade tegen derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel160
  - number: '161'
    text: |-
      1 Het bevoegd gezag kan het persoonsgebonden nummer van een leerling gebruiken in het verkeer met de leerling op
      wie het nummer betrekking heeft, of, indien de leerling minderjarig of handelingsonbekwaam is, met de ouders van
      deze leerling.

      2

      2a

      2b

      3

      4 Het bevoegd gezag kan het persoonsgebonden nummer van een leerling, al dan niet tezamen met een of
      meer van de gegevens, bedoeld in [artikel 12, eerste lid, van de Wet register onderwijsdeelnemers][ref1],
      gebruiken in het verkeer met Onze Minister ten behoeve van de vaststelling van de bekostiging van
      de school. De vorige volzin is van overeenkomstige toepassing op het persoonsgebonden nummer van
      een leerling als bedoeld in [artikel 8a, eerste lid][ref2], die is ingeschreven bij een school als
      bedoeld in de [Wet op het primair onderwijs][ref3], de [Wet voortgezet onderwijs 2020][ref4] of de
      [Wet educatie en beroepsonderwijs][ref5].

      5 Het bevoegd gezag en het hoofd, bedoeld in [artikel 1, onder d, van de Leerplichtwet 1969][ref6],
      gebruiken het persoonsgebonden nummer van een leerling in contacten met een gemeente in het kader van de
      [Leerplichtwet 1969][ref7], tezamen met de gegevens die noodzakelijk zijn voor het toezicht op de naleving van die
      wet door de gemeente.

      6 Het bevoegd gezag gebruikt bij de opgave aan het college van burgemeester en wethouders, bedoeld in
      [artikel 42b, eerste lid][ref8], en [artikel 47a, eerste lid][ref9], het persoonsgebonden nummer van de
      betrokkene.

      7 Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in het contact met een andere school of
      een school of instelling voor ander onderwijs ten behoeve van de in- en uitschrijving van die leerling, bij het
      overleggen van het onderwijskundig rapport, bedoeld in [artikel 43][ref10] en ten behoeve van het onderwijs in een
      doorlopende leerroute vmbo-mbo als bedoeld in [artikel 2.107a van de Wet voortgezet onderwijs 2020][ref11] of de
      geïntegreerde route vmbo-basisberoepsopleiding, bedoeld in [artikel 2.107l van die wet][ref12].

      8

      9 Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in het kader van de uitvoering van
      subsidieregelingen van het Europees Sociaal Fonds.

      10 Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een leerling ter uitvoering van
      [artikel 107, vijfde lid, van de Vreemdelingenwet 2000][ref13], anders dan ter nakoming van verplichtingen als
      referent in de zin van [artikel 1 van die wet][ref14].

      11 Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in contacten met een school
      als bedoeld in de [Wet op het primair onderwijs][ref15], de [Wet voortgezet onderwijs 2020][ref16] of de
      [Wet educatie en beroepsonderwijs][ref17] in het kader van de ondersteuning van de school op grond van
      [artikel 8a, eerste lid][ref18].

      12 Het bevoegd gezag kan het persoonsgebonden nummer van een leerling eenmalig gebruiken ten behoeve van het
      genereren van een pseudoniem voor deze leerling met het oog op het bieden van voorzieningen in het kader van het
      onderwijs en de begeleiding van leerlingen. Het bevoegd gezag draagt er zorg voor dat het pseudoniem wordt bewaard
      in de systemen waarin de leerlingen zijn geregistreerd.

      13 Het bevoegd gezag kan het pseudoniem, bedoeld in het twaalfde lid, gebruiken voor het genereren van een ander
      pseudoniem voor een leerling in het kader van de toegang tot en het gebruik van digitale leermiddelen of het
      digitaal afnemen van toetsen en examens, waarbij het bevoegd gezag er zorg voor draagt dat dit andere pseudoniem
      wordt bewaard in de systemen waarin de leerlingen zijn geregistreerd. Dit andere pseudoniem wordt uitsluitend
      verstrekt aan een leverancier die een digitaal product of een digitale dienst aanbiedt bestaande uit leerstof of
      toetsen en de daarmee samenhangende digitale diensten.

      14 Bij algemene maatregel van bestuur kunnen andere gevallen worden aangewezen dan het geval, bedoeld in het
      dertiende lid, waarvoor het bevoegd gezag op basis van het pseudoniem, bedoeld in het twaalfde lid, een ander
      pseudoniem kan genereren.

      Daarbij worden in ieder geval de categorieën van ontvangers van dit andere pseudoniem aangewezen.

      15 Bij ministeriële regeling worden regels gesteld over de voorwaarden waaronder de pseudoniemen, bedoeld in het
      twaalfde tot en met het veertiende lid, kunnen worden gegenereerd en gebruikt. Deze voorwaarden betreffen in ieder
      geval de duur en de beveiliging, waaronder de gescheiden opslag van de pseudoniemen.


