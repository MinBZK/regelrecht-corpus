  - number: 14c
    text: |-
      1 Het onderwijs in het arbeidsmarktgerichte uitstroomprofiel bereidt leerlingen voor op functies
      op de arbeidsmarkt op een niveau dat ligt onder het niveau van de entreeopleiding, bedoeld in
      [artikel 7.2.2., eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs][ref1].

      2 Bij algemene maatregel van bestuur worden kerndoelen vastgesteld, waarbij aandacht wordt besteed aan aspecten
      van:

      a. algemene maatschappelijke voorbereiding en persoonlijke vorming,

      b. leergebieden, en

      c. voorbereiding op arbeid.

      3 De leergebieden, bedoeld in het tweede lid, onder b, zijn:

      a. Nederlandse taal en communicatie,

      b. Engelse taal,

      c. rekenen en wiskunde,

      d. mens, natuur en techniek,

      e. mens en maatschappij,

      f. culturele oriëntatie en creatieve expressie, en

      g. bewegen en sport.

      4 De voorbereiding op arbeid, bedoeld in het tweede lid, onder c, bestaat uit:

      a. oriëntatie op werkvelden en beroepen;

      b. ontwikkelen van loopbaanvaardigheden;

      c. ontwikkelen van arbeidsmarktvaardigheden;

      d. ontwikkelen van beroepsvaardigheden.

      5 Op scholen in de provincie Fryslân kan het onderwijs in het arbeidsmarktgerichte uitstroomprofiel mede onderwijs
      in de Friese taal omvatten. Voor dat onderwijs stellen provinciale staten van Fryslân bij verordening kerndoelen
      Friese taal vast. De vaststelling geschiedt niet eerder dan nadat gedeputeerde staten overleg hebben gevoerd met
      het Friese voortgezet speciaal onderwijs. De verordening behoeft de goedkeuring van Onze Minister. Indien Onze
      Minister voornemens is goedkeuring te onthouden, verzoekt hij de Onderwijsraad een advies uit te brengen. Het
      verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies wordt binnen zes weken
      uitgebracht aan Onze Minister en wordt bekend gemaakt. Onze Minister informeert beide Kamers der Staten-Generaal
      over zijn voornemen om al dan niet goed te keuren. [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] is
      niet van overeenkomstige toepassing.

      6 Onze Minister kan goedkeuring als bedoeld in het vijfde lid in ieder geval onthouden indien aan de volgende
      voorwaarden, waarvoor gedeputeerde staten gegevens aandragen, niet wordt voldaan:

      a. het bestaan van voldoende draagvlak in het Friese voortgezet speciaal onderwijs voor de voorgelegde kerndoelen
      Friese taal;

      b. dat de kerndoelen Friese taal niet meer inspanningen vergen van het Friese voortgezet speciaal onderwijs
      dan het aandeel van het onderwijs in de Friese taal binnen het onderwijsprogramma, bedoeld in het negende lid,
      rechtvaardigt.

      7 Onze Minister kan goedkeuring als bedoeld in het vijfde lid in ieder geval onthouden indien de kerndoelen Friese
      taal geen aandacht schenken aan:

      a. het zich mondeling uitdrukken in het Fries en het verstaan van de Fries gesproken taal,

      b. het zich schriftelijk uitdrukken in het Fries en het verwerven van informatie uit in het Fries gestelde teksten,

      c. bevordering van het begrip van de Friese taal, en

      d. het ontwikkelen van een positieve houding ten aanzien van het gebruik van het Fries.

      8 De kerndoelen, bedoeld in het tweede en vijfde lid, kunnen voor de onderwijssoorten, bedoeld in
      [artikel 2, tweede lid][ref3], verschillen.

      9 Het onderwijs in het arbeidsmarktgerichte uitstroomprofiel wordt zo ingericht dat een samenhangend op de
      kerndoelen gebaseerd onderwijsprogramma wordt aangeboden waarbij het bevoegd gezag de kerndoelen uitwerkt voor de
      verschillende groepen leerlingen.

      10 Het bevoegd gezag kan na overleg met de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam
      is, met de leerling, een leerling ontheffing verlenen voor onderdelen van het onderwijsprogramma, bedoeld in het
      negende lid. Het bevoegd gezag bepaalt bij de ontheffing welk onderwijs voor de leerling in de plaats komt voor de
      onderdelen waarvoor ontheffing is verleend.

      11 Het bevoegd gezag kan voor leerlingen die daarvoor in aanmerking komen, bij de inrichting van het onderwijs
      afwijken van een of meer programmaonderdelen of van het negende lid. De laatste volzin van het tiende lid is van
      overeenkomstige toepassing. Bij algemene maatregel van bestuur wordt bepaald hoe wordt vastgesteld welke leerlingen
      in aanmerking komen voor deze afwijkingen.

      12 Het onderwijs in het arbeidsmarktgerichte uitstroomprofiel is er op gericht dat leerlingen
      zo veel mogelijk het referentieniveau Nederlandse taal en het referentieniveau rekenen
      bereiken die voor het arbeidsmarktgerichte uitstroomprofiel zijn vastgesteld op grond van
      [artikel 2, tweede lid, aanhef en onderdeel f, van de Wet referentieniveaus Nederlandse taal en rekenen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0027679#Artikel2
