  - number: '41'
    text: |-
      1 Tot een instelling mogen slechts die kinderen worden toegelaten voor wie vaststaat dat overwegend een
      orthopedagogische en orthodidactische benadering aangewezen is en die gezien hun handicap voor het op die
      instelling gegeven onderwijs in aanmerking komen.

      2 Het bevoegd gezag van een instelling of de bevoegde gezagsorganen van twee of meer instellingen stelt
      onderscheidenlijk stellen een commissie in die tot taak heeft:

      a. te beoordelen of een kind gezien zijn handicap voor het onderwijs op de instelling in aanmerking komt, dan wel
      in aanmerking komt voor begeleiding door de instelling indien het kind is of wordt ingeschreven op een school als
      bedoeld in de [Wet op het primair onderwijs][ref1] of de [Wet voortgezet onderwijs 2020][ref2], met dien verstande
      dat het oordeel van de commissie betrekking heeft op een door haar te bepalen periode,

      b. voor afloop van de periode, bedoeld in onderdeel a, te beoordelen of het kind nog in aanmerking komt voor
      het onderwijs op de instelling dan wel de begeleiding en indien het kind daarvoor in aanmerking komt voor welke
      periode,

      c. te adviseren over het vaststellen en bijstellen van het ontwikkelingsperspectief, bedoeld in
      [artikel 41a, eerste, tweede en vijfde lid][ref3], dan wel te adviseren over de inhoud van de begeleiding,

      d. als onderdeel van de onder b genoemde taak, aan het eind van elk schooljaar te adviseren omtrent terugplaatsing
      of overplaatsing van de leerling naar het basisonderwijs, een andere vorm van speciaal onderwijs, het voortgezet
      onderwijs of een vorm van voortgezet speciaal onderwijs, en

      e. het ten minste één keer per jaar evalueren van het ontwikkelingsperspectief dan wel de begeleiding en hiervan
      verslag te doen aan het bevoegd gezag.

      De commissie kan bij het uitoefenen van haar taak gebruik maken van bestaande onderzoeksgegevens, indien dergelijke
      gegevens aan haar worden verstrekt. De commissie wordt geleid door een vertegenwoordiger van de instelling waarvoor
      toelating wordt verzocht of waarvan begeleiding wordt gevraagd. De commissie bestaat naast de vertegenwoordiger van
      de instelling ten minste uit:

      1°. een academisch gevormd psycholoog of pedagoog die zich heeft gespecialiseerd in de jeugd- en
      kinderpsychologische richting, onderscheidenlijk in de orthopedagogische richting,

      2°. een maatschappelijk deskundige die in het bezit is van het diploma maatschappelijk werker van een sociale
      academie of van een door Onze Minister aangewezen diploma en

      3°. een arts die vertrouwd is met het onderzoek van kinderen voor wie het op de instelling gegeven onderwijs is
      bestemd.

      3 In verband met de beoordeling van kinderen met een niet-Nederlandse culturele achtergrond kan de commissie een
      deskundige op het gebied van de taal en cultuur van het land van oorsprong inschakelen.

      4 Geen kind wordt tot een instelling toegelaten of begeleid door een instelling dan na onderzoek door een commissie
      als bedoeld in het tweede lid. De inspecteur is bevoegd het onderzoek bij te wonen.

      5 De onderscheiden functionarissen van de commissie brengen hun bevindingen naar aanleiding van hun onderzoek van
      het kind door middel van een onderzoeksrapport ter kennis van de commissie.

      6 Van het in het vierde lid bedoelde onderzoek maakt de commissie een gemeenschappelijk rapport waarin naast het
      eindoordeel, de onderzoeksrapporten bedoeld in het vijfde lid, en de eventuele overige aan de commissie verstrekte
      documenten worden opgenomen, alsmede de bevindingen van de onderscheiden functionarissen naar aanleiding van het
      overleg in de commissie tot uitdrukking worden gebracht.

      7 De vertegenwoordiger van de instelling, bedoeld in het tweede lid, bespreekt de conclusies van het rapport
      met de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, de leerling. De ouders van
      een minderjarige of handelingsonbekwame leerling, de leerling die de leeftijd van 16 jaar heeft bereikt en de
      inspecteur krijgen desgewenst inzage in het rapport.

      8 Het bevoegd gezag ziet erop toe dat het gemeenschappelijk rapport slechts wordt gebruikt ten behoeve van het
      verblijf van de betrokken leerling op de instelling dan wel de begeleiding van de betrokken leerling door de
      instelling. Van het bepaalde in de vorige volzin kan voor wat betreft het rapport worden afgeweken voor zover door
      de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, de leerling schriftelijk toestemming
      is verleend.

      9 Het gemeenschappelijk rapport wordt in de instelling bewaard tot ten minste 3 jaar na het tijdstip waarop de
      leerling de instelling heeft verlaten dan wel de begeleiding van de leerling door de instelling is beëindigd. Het
      bevoegd gezag draagt er zorg voor dat het gemeenschappelijk rapport wordt bewaard op een plaats die uitsluitend
      toegankelijk is voor het bevoegd gezag en de met het onderzoek belaste functionarissen.


