  - number: 40a
    text: |-
      1 Het bevoegd gezag kan met opgave van redenen een leerling voor een periode van ten hoogste één week schorsen.

      2 De beslissing tot schorsing wordt schriftelijk aan de ouders dan wel, indien de leerling meerderjarig en
      handelingsbekwaam is, aan de leerling bekendgemaakt.

      3 Het bevoegd gezag stelt de inspectie van een schorsing voor een periode langer dan één dag schriftelijk en met
      opgave van redenen onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel40a
  - number: 40b
    text: |-
      1 Het bevoegd gezag van een school, niet zijnde een instelling, of de bevoegde gezagsorganen van twee of meer
      scholen, niet zijnde instellingen, stelt onderscheidenlijk stellen een commissie voor de begeleiding in, die
      zodanig is samengesteld dat zij adequaat kan adviseren vanuit zowel onderwijskundig als pedagogisch, psychologisch
      en medisch oogpunt, rekening houdend met de handicap van de leerling.

      2 De commissie voor de begeleiding heeft tot taak:

      a. te adviseren over het vaststellen en bijstellen van het ontwikkelingsperspectief, bedoeld in
      [artikel 41a, eerste, tweede en vijfde lid][ref1],

      b. het ten minste één keer per jaar evalueren van het ontwikkelingsperspectief en hiervan verslag te doen aan het
      bevoegd gezag,

      c. te adviseren over terugplaatsing of overplaatsing van de leerling naar het basisonderwijs of het voortgezet
      onderwijs, en

      d. het samenwerkingsverband, bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref2] en
      [artikel 1.1 van de Wet voortgezet onderwijs 2020][ref3], te adviseren over de begeleiding van leerlingen op
      scholen als bedoeld in die wetten.


