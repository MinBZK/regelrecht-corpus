  - number: '107'
    text: |-
      Voorzieningen aan gebouwen of terreinen in verband met verhuur krachtens de [artikelen 106][ref1] of [108][ref2]
      door het bevoegd gezag van een niet door de gemeente in stand gehouden school, komen niet ten laste van de
      gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel108
