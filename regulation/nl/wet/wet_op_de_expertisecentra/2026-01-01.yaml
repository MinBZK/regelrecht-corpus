  - number: '123'
    text: |-
      1 Indien in een gemeente uitsluitend een of meer andere rechtspersonen dan de gemeente openbare scholen in stand
      houden waar een bepaalde soort speciaal onderwijs of een bepaalde soort voortgezet speciaal onderwijs wordt
      gegeven dan wel dergelijke scholen ontbreken en de gemeente uitgaven wil doen voor dat onderwijs welke niet
      door het Rijk worden bekostigd, stelt de gemeenteraad bij verordening een regeling daarvoor vast en zijn de
      [artikelen 125 tot en met 129][ref1] voor dat onderwijs niet van toepassing.

      2 De regeling, bedoeld in het eerste lid, maakt geen onderscheid tussen openbaar en bijzonder onderwijs en voorziet
      in een behandeling van scholen naar dezelfde maatstaf.

      3 De regeling, bedoeld in het eerste lid, bevat in ieder geval de voorzieningen die door het bevoegd gezag
      van een in de gemeente gelegen, niet door de gemeente in stand gehouden school kunnen worden aangevraagd en de
      aanvraagprocedure.

      4 De gemeenteraad kan besluiten dat het college van burgemeester en wethouders de regeling, bedoeld in het eerste
      lid, tijdelijk kunnen aanvullen met nieuwe voorzieningen. De aanvulling wordt binnen een week aan de bevoegde
      gezagsorganen van de niet door de gemeente in stand gehouden scholen gezonden. Binnen 12 weken na de totstandkoming
      van de aanvulling wordt deze voorgelegd aan de gemeenteraad en besluit de gemeenteraad over de bekrachtiging ervan.
      Indien de gemeenteraad niet binnen 12 weken heeft besloten, wordt de aanvulling gelijkgesteld met een aanvulling
      die is bekrachtigd. Een afwijzing van de aanvulling door de gemeenteraad heeft geen gevolgen voor aanvragen waarop
      reeds is besloten of die reeds zijn ingediend en die voorzieningen betreffen waarop de aanvulling betrekking heeft.

      5 Voor de toepassing van dit artikel wordt een nevenvestiging aangemerkt als een nevenvestiging die is gelegen
      in de gemeente van de hoofdvestiging. De gemeenteraad kan in de verordening, bedoeld in het eerste lid, aan het
      college van burgemeester en wethouders de bevoegdheid verlenen om, met inachtneming van de in die verordening
      gestelde regels, te besluiten dat in de gemeente gelegen nevenvestigingen van scholen waarvan de hoofdvestiging is
      gelegen in een andere gemeente in afwijking van de eerste volzin in aanmerking komen voor een of meer van de in de
      regeling genoemde voorzieningen.

      6 Het college van burgemeester en wethouders maakt jaarlijks in een van overheidswege uitgegeven blad of een dag-,
      nieuws- of huis-aan-huisblad, dan wel op een andere geschikte wijze, een overzicht bekend van voorzieningen die
      zijn toegekend op grond van de regeling, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel125
