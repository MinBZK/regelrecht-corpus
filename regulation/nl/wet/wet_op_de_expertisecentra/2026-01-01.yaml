  - number: 76a
    text: |-
      1 Indien een bevoegd gezag van een school, niet zijnde een instelling, wenst over te gaan tot het inrichten van
      een nevenvestiging en het daarover overeenstemming heeft bereikt met het samenwerkingsverband en de gemeente waar
      die nevenvestiging zal worden gevestigd, dient het bevoegd gezag voor 1 februari een daarop betrekking hebbende
      aanvraag met de gegevens waaruit de bedoelde overeenstemming blijkt, in bij Onze Minister.

      2 Onze Minister beslist voor 1 april daaropvolgend. Indien Onze Minister de inrichting van een nevenvestiging
      goedkeurt, vangt de bekostiging van die nevenvestiging aan op 1 augustus volgend op de goedkeuring. Voor de
      bekostiging wordt de nevenvestiging aangemerkt als deel van de school die de nevenvestiging in stand houdt.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel76a
  - number: 76b
    text: |-
      1 Indien een bevoegd gezag van een instelling wenst over te gaan tot het inrichten van een nevenvestiging en het
      daarover overeenstemming heeft bereikt met de andere instellingen en de gemeente waar die nevenvestiging zal worden
      gevestigd, dient het bevoegd gezag voor 1 februari een daarop betrekking hebbende aanvraag met de gegevens waaruit
      de bedoelde overeenstemming blijkt, in bij Onze Minister.

      2 Onze Minister beslist voor 1 april daaropvolgend. Indien Onze Minister de inrichting van een nevenvestiging
      goedkeurt, vangt de bekostiging van die nevenvestiging aan op 1 augustus volgend op de goedkeuring. Voor de
      bekostiging wordt de nevenvestiging aangemerkt als deel van de instelling die de nevenvestiging in stand houdt.

      3 De nevenvestigingen van instellingen, genoemd in [artikel X van de Wet van 31 mei 1995][ref1] (Stb. 1995, 319),
      zoals dat artikel luidde op 1 januari 2012, worden beschouwd als nevenvestiging in de zin van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0007421#ArtikelX
