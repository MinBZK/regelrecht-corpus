    text: |-
      Het in [artikel 154][ref1] en [artikel 156][ref2] bedoelde bestuur verstrekken aan Onze Minister alle
      inlichtingen die deze nodig acht ten behoeve van een goede naleving van deze afdeling. Op verzoek van de
      inspectie van het onderwijs zendt het bestuur een overzicht van afgegeven geschiktheidsverklaringen en
      bekwaamheidsonderzoeken waaraan met goed gevolg is deelgenomen.


