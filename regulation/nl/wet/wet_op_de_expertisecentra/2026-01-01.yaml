    text: |-
      1 Het bevoegd gezag van een of meer scholen voor speciaal onderwijs of speciaal en voortgezet speciaal onderwijs
      behorend tot cluster 3 en 4, bedoeld in [artikel 2, vierde lid][ref1], is voor elke vestiging van die school
      of scholen voor zover daaraan speciaal onderwijs wordt verzorgd, aangesloten bij een samenwerkingsverband
      als bedoeld in [artikel 18a, tweede lid, van de Wet op het primair onderwijs][ref2] of bij een landelijk
      samenwerkingsverband als bedoeld in artikel 18a, vijftiende lid, van die wet. Artikel 18a, vierde lid, en
      [artikel 163c, derde lid, van die wet][ref3] zijn van overeenkomstige toepassing.

      2 Het bevoegd gezag van een of meer scholen voor voortgezet speciaal onderwijs of speciaal en voortgezet speciaal
      onderwijs behorend tot cluster 3 en 4, bedoeld in [artikel 2, vierde lid][ref4], is voor elke vestiging van
      die school of scholen voor zover daaraan voortgezet speciaal onderwijs wordt verzorgd, aangesloten bij een
      samenwerkingsverband als bedoeld in [artikel 2.47, tweede lid, van de Wet voortgezet onderwijs 2020][ref5] of bij
      een landelijk samenwerkingsverband als bedoeld in artikel 2.47, achttiende lid, van die wet. Artikel 2.47, vijfde
      lid, en [artikel 2.49, derde lid, van die wet][ref6] zijn van overeenkomstige toepassing.

      3 Onverminderd het eerste en tweede lid, kan het bevoegd gezag deelnemen aan een samenwerkingsverband
      op grond van [artikel 18a, vijfde lid, van de Wet op het primair onderwijs][ref7] of
      [artikel 2.47, zesde lid, van de Wet voortgezet onderwijs 2020][ref8].


