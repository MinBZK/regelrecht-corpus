    text: |-
      Onze Minister kan in bijzondere gevallen op aanvraag van het bevoegd gezag besluiten toe te staan dat wordt
      afgeweken van [artikel 13, eerste tot en met vijfde lid][ref1]. De toestemming wordt verleend voor een bepaald
      tijdvak; aan de toestemming kunnen voorwaarden worden verbonden.


