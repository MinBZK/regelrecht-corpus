  - number: '120'
    text: |-
      De Overgangswet ISOVSO zoals die luidde op 31 juli 1998 blijft van toepassing op aanspraken die op die datum op
      grond van artikel E 16, E 17 of E 18 van die wet bestaan, met dien verstande dat in artikel E 18 van die wet onder
      «een school voor speciaal onderwijs» tevens wordt begrepen: een speciale school voor basisonderwijs als bedoeld in
      de [Wet op het primair onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: '121'
    text: |-
      1 Het college van burgemeester en wethouders stelt na overleg met de bevoegde gezagen van de niet door de gemeente
      in stand gehouden scholen het aantal uren per week vast dat per groep leerlingen ten hoogste

      a. ter beschikking wordt gesteld in een ruimte voor het onderwijs in lichamelijke oefening, of

      b. voor bekostiging voor de exploitatie van een ruimte voor het onderwijs in lichamelijke oefening in aanmerking
      komt.

      2 Het aantal uren, bedoeld in het eerste lid, wordt vastgesteld op ten minste 2,25 uur.

      3 Het college van burgemeester en wethouders stelt de hoogte vast van

      a. de bekostiging, bedoeld in het eerste lid, onderdeel b, en

      b. de bekostiging voor de vaste kosten van de exploitatie van een ruimte voor lichamelijke oefening waarvan de
      eigendom berust bij het bevoegd gezag van een niet door de gemeente in stand gehouden school.

      4 De hoogte van de bekostiging, bedoeld in het derde lid, kan verschillend worden vastgesteld, afhankelijk van de
      oppervlakte van de ruimte en of de ruime mede wordt bekostigd door het Rijk.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel121
  - number: '122'
    text: |-
      1 De gemeente verstrekt jaarlijks aan het bevoegd gezag van een niet door de gemeente in stand gehouden school dat
      eigenaar is van een ruimte voor het onderwijs in lichamelijke oefening op het grondgebied van de gemeente

      a. een bedrag dat wordt bepaald ingevolge het derde lid en [artikel 121][ref1], en

      b. voor zover het gebruik van die ruimte ontoereikend is een overeenkomstig het tweede lid vastgesteld bedrag.

      2 Voor zover geen ruimte ter beschikking is gesteld als bedoeld in [artikel 121, eerste lid onder a][ref2],
      verstrekt de gemeente jaarlijks aan het bevoegd gezag van een niet door de gemeente in stand gehouden school dat
      geen eigenaar is van een ruimte voor het onderwijs in lichamelijke oefening een bedrag dat wordt bepaald ingevolge
      het derde lid en artikel 121, eerste lid onderdeel b, en derde lid, onderdeel a.

      3 Het aantal groepen leerlingen voor basisscholen wordt berekend overeenkomstig
      [artikel 100, eerste lid, onderdeel i][ref3].


