      1 De directeur van de instelling, bedoeld in het tweede lid van artikel 89, die op 31 juli 1995 als directeur in
      dienst was van het bevoegd gezag van de tot instelling omgezette school als bedoeld in dat lid, behoudt ten minste
      recht op salariëring volgens het functieniveau dat op 31 juli 1995 voor hem gold dan wel op de maximumschaal die
      daarvoor reeds 2 jaar formatief voor hem aanwezig was. Indien voor de functie van directeur van die instelling een
      hogere maximumschaal gold dan die welke op 31 juli 1995 voor de directeur gold dan wel formatief beschikbaar was,
      wordt hij vanaf die datum bezoldigd volgens het carrièrepatroon dat bij die hogere maximumschaal behoort en heeft
      hij bij de vaststelling van het salaris aanspraak op een bevorderingsperiodiek. Hij behoudt een blijvende aanspraak
      op de hogere maximumschaal, bedoeld in de vorige volzin, indien deze gedurende 3 achtereenvolgende schooljaren aan
      die instelling voor hem beschikbaar is geweest.

      2

      Indien een personeelslid van een instelling als bedoeld in het tweede lid van artikel 89, die op 31 juli 1995
      als directeur in dienst was van het bevoegd gezag van de tot instelling omgezette school als bedoeld in dat lid,
      is benoemd in een functie waarvan het niveau en het carrièrepatroon zo veel mogelijk overeenkomt met het niveau
      en het carrièrepatroon dat is gegarandeerd in de oorspronkelijke functie, met dien verstande dat het niveau en
      het carrièrepatroon van de nieuwe functie ten minste gelijk zijn aan die van een normfunctie leraar, behoudt hij
      ten minste aanspraak op salariëring volgens het functieniveau dat voor hem gold op 31 juli 1995, in zijn functie
      als directeur van een school waaruit de instelling is ontstaan, of, indien hij 2 jaar of langer directeur is
      geweest van die school, de maximumschaal die op die dag reeds 2 jaar formatief voor hem aanwezig was indien deze
      maximumschaal hoger is dan het functieniveau dat voor hem gold op die dag.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel181
  - number: '182'
    text: |-
      1 Ten aanzien van de bijdrage die een gemeente in de ontslaguitkeringskosten dient te verstrekken bij of krachtens
      artikel 102 van de Wet op de onderwijsverzorging zoals die voorschriften luidden op 31 december 1997, blijven die
      voorschriften van kracht gedurende de periode waarover ontslaguitkeringen worden uitgekeerd.

      2 Een schoolbegeleidingsdienst dient aan Onze Minister op diens verzoek de kosten van werkloosheidsuitkeringen of
      herplaatsingswachtgelden te voldoen:

      a. voor zover het betreft uitkeringen die zijn ontstaan voor 1 januari 1998: indien die kosten bij of krachtens
      de artikelen 90 en 102 van de Wet op de onderwijsverzorging zoals die voorschriften luidden op 31 december 1997,
      zouden worden ingehouden op de rijksvergoeding aan die schoolbegeleidingsdienst, en

      b. voor zover het betreft uitkeringen die zijn ontstaan na 31 december 1997: indien de rechtspersoon, bedoeld
      in artikel 110b van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs, zoals
      die bepaling luidde ten tijde van deze uitkeringen, op een daartoe strekkend verzoek van het bestuur van de
      schoolbegeleidingsdienst, voorafgaand aan het ontslag niet heeft ingestemd met het ten laste van die rechtspersoon
      brengen van de kosten van werkloosheidsuitkeringen of herplaatsingswachtgelden.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel182
  - number: '184'
    text: |-
      1 Per school waar voortgezet speciaal onderwijs wordt verzorgd informeert het bevoegd
      gezag uiterlijk op 1 januari voorafgaande aan het tijdstip van inwerkingtreding van
      [artikel I, onderdeel E van de wet van 11 oktober 2012][ref1] (Stb. 545), de ouders schriftelijk welk
      uitstroomprofiel als bedoeld in [artikel 14][ref2] zoals luidend door artikel I, onderdeel E, van die wet en indien
      aan de orde, welk onderwijs als bedoeld in [artikel 14a, eerste lid][ref3], zoals luidend door artikel I, onderdeel
      F, van die wet en welke schoolsoort als bedoeld in de Wet op het voortgezet onderwijs met ingang van genoemd
      tijdstip wordt verzorgd.

      2 Voor de leerlingen die voortgezet speciaal onderwijs volgen vóór het tijdstip van inwerkingtreding voor
      het voortgezet speciaal onderwijs van [artikel I, onderdeel R, van de wet van 11 oktober 2012][ref4]
      (Stb. 545) stelt het bevoegd gezag vóór dat tijdstip een ontwikkelingsperspectief vast overeenkomstig
      [artikel 41a, eerste lid][ref5], zoals luidend door artikel I, onderdeel R, van die wet. De eerste volzin is niet
      van toepassing op leerlingen die naar verwachting vóór 1 oktober volgend op het tijdstip, bedoeld in de eerste
      volzin, de school verlaten.

      3 Voor de leerlingen die speciaal onderwijs volgen vóór het tijdstip van inwerkingtreding voor het speciaal
      onderwijs van [artikel I, onderdeel R, van de wet van 11 oktober 2012][ref6] (Stb. 545) stelt het bevoegd gezag
      vóór dat tijdstip een ontwikkelingsperspectief vast overeenkomstig [artikel 41a, eerste lid][ref7], zoals luidend
      door artikel I, onderdeel R, van die wet.

      4 [Artikel 44][ref8], zoals luidend door [artikel I, onderdeel T, van de wet][ref9] van 11 oktober 2012 (Stb.
      545) is niet van toepassing ten aanzien van leerlingen die vóór het tijdstip van inwerkingtreding van dat
      artikelonderdeel de school hebben verlaten.

      5 Leerlingen die speciaal onderwijs volgen die vóór het tijdstip van inwerkingtreding van
      [artikel I, onderdeel N, eerste lid, van de wet van 11 oktober 2012][ref10] (Stb. 545) de leeftijd van veertien
      jaar hebben bereikt, verlaten vóór dat tijdstip van inwerkingtreding het speciaal onderwijs.

      6 [Artikel 39, vijfde lid, de laatste twee volzinnen][ref11], zoals luidend door
      [artikel I, onderdeel N, tweede lid, van de wet van 11 oktober 2012][ref12] (Stb. 545) zijn niet van toepassing
      ten aanzien van verzoeken om ontheffing die voor inwerkingtreding van dat artikelonderdeel zijn gedaan.

      7 Tot aan het tijdstip van inwerkingtreding van de wijziging van
      [artikel I, onderdeel E, van de wet van 11 oktober 2012][ref13] (Stb. 545) gelden voor het voortgezet speciaal
      onderwijs [artikel 11, vierde lid][ref14], [40b][ref15], [41][ref16], [41a][ref17], [43][ref18], [53][ref19] en
      [59][ref20], zoals die artikelen luidden vóór het tijdstip van inwerkingtreding van artikel I, onderdelen B, P, Q,
      R, S, V en W, tweede lid, van die wet.

      8 Het zevende lid is niet van toepassing ten aanzien van wijzigingen van in het zevende lid genoemde artikelen
      aangebracht door een andere wet dan de [wet van 11 oktober 2012][ref21] (Stb. 545).


