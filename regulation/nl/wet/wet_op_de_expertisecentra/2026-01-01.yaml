  - number: 32d
    text: |-
      1 Degene die op 31 juli 2017 voor het geven van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs
      aan een school is benoemd of tewerkgesteld zonder benoeming, alsmede degene die eerder al voor het geven van dat
      onderwijs benoemd is geweest of tewerkgesteld zonder benoeming, voldoet aan de bekwaamheidseisen voor het geven van
      dat onderwijs.

      2 Degene die binnen een periode van vijf jaren gerekend vanaf 1 augustus 2017 voor de eerste keer wordt benoemd of
      tewerkgesteld zonder benoeming voor het geven van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs aan
      een school, dient binnen een periode van vijf jaren gerekend vanaf het tijdstip van die eerste benoeming of die
      eerste tewerkstelling zonder benoeming, te voldoen aan de bekwaamheidseisen voor het geven van dat onderwijs om
      belast te kunnen blijven worden met de desbetreffende werkzaamheden. Bij algemene maatregel van bestuur kan deze
      periode worden verlengd met een daarbij te bepalen periode indien dat noodzakelijk is voor een goede invoering van
      die bekwaamheidseisen.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op degene die:

      a. onderwijsondersteunende werkzaamheden ten behoeve van godsdienstonderwijs of levensbeschouwelijk
      vormingsonderwijs aan een school verricht, vanaf het moment dat voor die werkzaamheden bekwaamheidseisen zijn
      vastgesteld; of

      b. is aangewezen, eerder was aangewezen onderscheidenlijk voor de eerste keer wordt aangewezen voor het geven van
      godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs op openbare scholen.

      4 Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel32d
  - number: 32e
    text: |-
      [Artikel 21, derde lid][ref1], vindt, wat het onderhouden van de bekwaamheid betreft, voor een bepaalde
      personeelscategorie voor het eerst toepassing met ingang van het tijdstip waarop de bekwaamheidseisen voor die
      categorie in werking treden.


