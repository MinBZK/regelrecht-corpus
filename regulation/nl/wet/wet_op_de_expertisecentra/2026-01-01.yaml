  - number: '26'
    text: |-
      1 Indien een leerling gedurende een deel van de week onderwijs ontvangt op een andere school, een basisschool,
      een speciale school voor basisonderwijs, een school voor voortgezet onderwijs of een instelling voor educatie
      en beroepsonderwijs, telt de tijd gedurende welke de leerling dit onderwijs ontvangt, mee voor het aantal uren
      onderwijs dat de leerling ten minste moet ontvangen.

      2 Bij ministeriële regeling kunnen ten aanzien van het speciaal onderwijs voorschriften worden vastgesteld omtrent
      vakanties. Daarbij kunnen begin en eind van vakanties worden vastgesteld die niet voor alle scholen gelijk behoeven
      te zijn. Bij die ministeriële regeling kan tevens worden bepaald dat zij op bepaalde scholen niet van toepassing
      is.

      3 Ten aanzien van de uitstroomprofielen, bedoeld in de [artikelen 14c][ref1] en [14f][ref2], zijn de voorschriften
      gegeven bij of krachtens [artikel 2.39 van de Wet voortgezet onderwijs 2020][ref3] van overeenkomstige toepassing.
      Bij algemene maatregel van bestuur onderscheidenlijk bij ministeriële regeling kunnen regels worden vastgesteld
      in afwijking van de regels die bij algemene maatregel van bestuur respectievelijk bij ministeriële regeling zijn
      vastgesteld op grond van die bepaling van de [Wet voortgezet onderwijs 2020][ref4].


