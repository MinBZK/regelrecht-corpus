        afdeling: '1'
  - number: '20'
    text: |-
      Het bevoegd gezag rapporteert met inachtneming van het leerlingvolgsysteem, bedoeld in
      [artikel 48c, eerste lid][ref1], over de vorderingen van de leerlingen aan hun ouders dan wel aan de leerlingen
      zelf indien zij meerderjarig en handelingsbekwaam zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel48c
