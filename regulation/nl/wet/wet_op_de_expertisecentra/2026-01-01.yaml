  - number: 22a
    text: |-
      1 Het bevoegd gezag stelt ten minste eenmaal in de vier jaar het schoolplan vast en stelt dit zo spoedig mogelijk
      na de vaststelling beschikbaar voor de inspectie.

      2 Het bevoegd gezag stelt jaarlijks de schoolgids vast ten behoeve van het eerstvolgende schooljaar en stelt deze
      zo spoedig mogelijk na de vaststelling beschikbaar voor de ouders en de inspectie.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel22a
  - number: 22b
    text: |-
      Voorafgaand aan de vaststelling van de schoolgids stelt het bevoegd gezag leerlingen in de gelegenheid op
      een door hen te bepalen wijze vrijelijk hun mening naar voren te brengen over het ondersteuningsaanbod van
      de school en, indien het betreft een cluster 3- of cluster 4-school, de basisondersteuningsvoorzieningen,
      bedoeld in de [Wet op het primair onderwijs][ref1] en de [Wet voortgezet onderwijs 2020][ref2]. Het bevoegd
      gezag biedt leerlingen daartoe de ondersteuning die zij nodig hebben. Het bevoegd gezag beschrijft in de
      schoolgids op algemene wijze de inbreng van de leerlingen en de mate van invloed op de vaststelling van de
      basisondersteuningsvoorzieningen, bedoeld in de Wet op het primair onderwijs en de Wet voortgezet onderwijs 2020,
      en het ondersteuningsaanbod van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0044212
