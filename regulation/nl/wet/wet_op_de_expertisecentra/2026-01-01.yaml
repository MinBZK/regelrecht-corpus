  - number: '33'
    text: Het bevoegd gezag draagt er zorg voor dat de rechtspositie van het personeel wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel33
  - number: 33a
    text: Het bevoegd gezag benoemt, schorst en ontslaat het personeel.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel33a
  - number: '34'
    text: |-
      1 Het bevoegd gezag benoemt de directeur en de adjunct-directeur, de leraren en het onderwijsondersteunend
      personeel in algemene dienst van het bevoegd gezag.

      2 Onder benoeming in algemene dienst van het bevoegd gezag wordt in dit artikel verstaan een benoeming ten behoeve
      van het verrichten van werkzaamheden aan door het bevoegd gezag in stand gehouden scholen. Indien het betreft
      een bevoegd gezag dat twee of meer scholen in stand houdt en aan deze scholen niet aan eenzelfde categorie van
      kinderen, genoemd in [artikel 2, tweede lid][ref1], onderwijs wordt gegeven, geschiedt voor zover het een leraar
      betreft, de in het eerste lid bedoelde benoeming, in afwijking van het bepaalde in de eerste volzin, uitsluitend
      ten behoeve van het uitoefenen van een gelijksoortige functie aan een gelijksoortige school.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 34a
    text: |-
      1 Het bevoegd gezag draagt er zorg voor dat afschriften van bewijsstukken waarmee de bekwaamheid wordt aangetoond,
      van geschiktheidsverklaringen, van verklaringen omtrent het gedrag en van arbeidsovereenkomsten van het aan de
      school verbonden personeel worden bewaard.

      2 Het eerste lid is van overeenkomstige toepassing op personeel dat is tewerkgesteld zonder benoeming.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel34a
  - number: 34b
    text: |-
      1 Het bevoegd gezag bewaart een afschrift van de verklaring omtrent het gedrag van een persoon die:

      a. werkzaam is als of voor een particuliere onderwijsaanbieder; en

      b. werkzaamheden verricht die een bijdrage leveren aan het onderwijsleerproces en die plaatsvinden:

      1°. in het schoolgebouw tijdens of aansluitend op de onderwijstijd; of

      2°. onder verantwoordelijkheid van het bevoegd gezag.

      2 Het bevoegd gezag bewaart het afschrift, bedoeld in het eerste lid, gedurende het schooljaar waarin de
      werkzaamheden worden verricht.

      3 Het bevoegd gezag controleert ieder schooljaar voorafgaand aan de eerste keer dat de persoon, bedoeld in het
      eerste lid, werkzaamheden verricht of de verklaring omtrent het gedrag waarvan een afschrift wordt verstrekt niet
      ouder is dan zes maanden.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel34b
  - number: '36'
    text: |-
      1 Het bevoegd gezag is verplicht aan ho-studenten die in opleiding zijn voor een functie in het basisonderwijs, het
      speciaal onderwijs of het voortgezet speciaal onderwijs gelegenheid te bieden de als onderdeel van hun opleiding
      vereiste ervaring in de school te verkrijgen.

      2 De verplichting bedoeld in het eerste lid, betreft:

      a. ho-studenten die op een opleidingsinstituut voor onderwijzend personeel zijn ingeschreven;

      b. in een schooljaar gelijktijdig niet meer ho-studenten als bedoeld onder a, dan een derde van het aantal leraren
      in dat jaar.

      3 Een bevoegd gezag kan een ho-student de verdere toegang tot de school ontzeggen, indien deze in strijd handelt
      met de grondslag en doelstellingen van de school. Van een beslissing tot ontzegging van de toegang tot de school
      wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd gezag van het betrokken
      opleidingsinstituut.

      4 De directeur regelt in overeenstemming met het opleidingsinstituut en het onderwijzend personeel de werkzaamheden
      in verband met de begeleiding door dit personeel van de ho-studenten in de school.

      5 Onze Minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de verplichting verlenen. De ontheffing geldt voor 1 schooljaar.

      6 De scholen waarop ho-studenten als bedoeld in het eerste lid, zijn toegelaten, zijn toegankelijk voor de
      inspectie belast met het toezicht op de opleidingsinstituten voor onderwijzend personeel en voor de directeuren en
      de door deze aan te wijzen leraren van die opleidingsinstituten, een en ander voor zover zulks voor de uitoefening
      van het toezicht op de praktische vorming noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel36
  - number: '38'
    text: |-
      Over de door het bevoegd gezag ingevolge [artikel 33][ref1] te treffen regelingen, alsmede over andere
      aangelegenheden van algemeen belang voor de rechtstoestand van het personeel, wordt door of namens het bevoegd
      gezag overleg gevoerd met de daarvoor in aanmerking komende verenigingen van werknemers, op een met deze
      schriftelijk overeengekomen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel33
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '33'
        paragraaf: '2'
        afdeling: '1'
  - number: 38a
    text: |-
      1 Degene die beschikt over een in [artikel 151][ref1] bedoelde geschiktheidsverklaring, het bevoegd gezag dat
      betrokkene benoemt of tewerkstelt zonder benoeming, en het bestuur van een instelling die werkzaamheden uitvoert
      als bedoeld in [artikel 156, eerste lid onder a][ref2], sluiten een overeenkomst die hun wederzijdse rechten
      en plichten omvat met betrekking tot het uitvoeren van de noodzakelijk geachte scholing en begeleiding, met
      inachtneming van de beoordeling, bedoeld in [artikel 152, tweede lid, onder c][ref3]. Indien na het sluiten van
      de overeenkomst blijkt dat de scholing of begeleiding niet volgens de overeenkomst kan worden uitgevoerd, treft het
      bevoegd gezag tijdig een toereikende vervangende voorziening.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de uitvoering van
      het eerste lid, waaronder in elk geval voorschriften ter waarborging van de kwaliteit van het daarin bepaalde.

      3 Voor zover betrokkene de werkzaamheden ten aanzien waarvan hem een geschiktheidsverklaring is verstrekt, verricht
      bij twee of meer bevoegde gezagsorganen, dragen deze bevoegde gezagsorganen er zorg voor dat de overeenkomsten,
      bedoeld in het eerste lid, waarbij zij ten aanzien van betrokkene partij zijn, op elkaar worden afgestemd. Zonodig
      wordt een al gesloten overeenkomst daartoe gewijzigd.

      4 De algemene maatregel van bestuur, bedoeld in het tweede en derde lid, wordt aan de beide Kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken
      en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel151
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel156
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel152
