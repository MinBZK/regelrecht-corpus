  - number: '22'
    text: |-
      1 De schoolgids bevat voor ouders en leerlingen informatie over de werkwijze van de school en bevat in elk geval
      informatie over:

      a. de doelen van het onderwijs en de resultaten die met het onderwijsleerproces worden bereikt, met dien verstande
      dat bij algemene maatregel van bestuur voorschriften kunnen worden gegeven met betrekking tot de wijze waarop

      1°. de resultaten worden beschreven die met het onderwijsleerproces worden bereikt, en

      2°. de context wordt vermeld waarin de onder 1° bedoelde resultaten dienen te worden geplaatst.

      b. het ondersteuningsaanbod van de school en indien het betreft een cluster 3- of cluster 4-
      school: de basisondersteuningsvoorzieningen, bedoeld in de [Wet op het primair onderwijs][ref1] en de
      [Wet voortgezet onderwijs 2020][ref2],

      c. 1°. de wijze waarop, indien speciaal onderwijs wordt verzorgd, de verplichte onderwijstijd voor dat onderwijs
      wordt benut,

      2°. indien voortgezet speciaal onderwijs wordt verzorgd, met betrekking tot dat onderwijs, het totaal aantal
      uren en het soort activiteiten dat als onderwijstijd als bedoeld in [artikel 25, eerste lid][ref3], dan wel
      [artikel 2.38, eerste tot en met vijfde lid, van de Wet voortgezet onderwijs 2020][ref4] wordt geprogrammeerd,
      de vakanties en andere dagen waarop geen onderwijs wordt verzorgd, alsmede wat het beleid is ten aanzien van
      lesuitval,

      3°. indien het uitstroomprofiel vervolgonderwijs wordt verzorgd, de invulling van de maatschappelijke stage,
      bedoeld in [artikel 2.32 van de Wet voortgezet onderwijs 2020][ref5],

      d. de geldelijke bijdrage, bedoeld in [artikel 40, eerste lid][ref6], waarbij wordt vermeld dat deze vrijwillig
      is en dat het niet voldoen van die bijdrage niet leidt tot het uitsluiten van leerlingen van deelname aan
      activiteiten,

      e. de rechten en plichten van de ouders, de leerlingen en het bevoegd gezag, waaronder de informatie over de
      klachtenregeling, bedoeld in [artikel 23][ref7], en de gronden voor vrijstelling van het onderwijs, bedoeld in
      [artikel 46, tweede lid][ref8],

      f. de wijze waarop het bevoegd gezag omgaat met de in[ artikel 21, eerste lid][ref9], omschreven bijdragen,

      g. het samenwerkingsverband en in voorkomend geval de samenwerkingsverbanden als bedoeld in
      [artikel 1 van de Wet op het primair onderwijs][ref10] of [artikel 1.1 van de Wet voortgezet onderwijs 2020][ref11]
      waarbij het bevoegd gezag van de school is aangesloten,

      h. het beleid met betrekking tot de veiligheid,

      i. het verzuimbeleid,

      j. de wijze waarop de identiteitscommissie, bedoeld in [artikel 28j][ref12], invulling geeft aan het openbare
      karakter onderscheidenlijk de identiteit voor zover het betreft een samenwerkingsschool,

      k. de persoon, bij wie de taken, bedoeld in [artikel 5a, eerste lid, onderdeel c][ref13], zijn belegd,

      l. de in het kader van het stelsel van kwaliteitszorg, bedoeld in [artikel 21, vierde lid][ref14], gedane
      bevindingen en de maatregelen die naar aanleiding daarvan zijn getroffen,

      m. de wijze van totstandkoming van het schooladvies en het definitieve schooladvies, bedoeld in
      [artikel 48e, eerste en derde lid][ref15],

      n. de wijze waarop het bevoegd gezag ouders en leerlingen actief informeert over de totstandkoming van het
      schooladvies en het definitieve schooladvies, bedoeld in [artikel 48e, eerste en derde lid][ref16], en

      o. het beleid met betrekking tot loopbaanbegeleiding, bedoeld in [artikel 44, vijfde lid][ref17].

      2 Indien voortgezet speciaal onderwijs wordt verzorgd, vermeldt de schoolgids onverminderd het eerste lid
      welk uitstroomprofiel of welke uitstroomprofielen als bedoeld in [artikel 14, eerste lid][ref18], worden
      verzorgd, en, indien het uitstroomprofiel vervolgonderwijs wordt verzorgd, welk onderwijs als bedoeld in
      [artikel 14a, eerste lid][ref19], en welke schoolsoort als bedoeld in de [Wet voortgezet onderwijs 2020][ref20].

      3 Indien voortgezet speciaal onderwijs als bedoeld in [artikel 14a, eerste lid, onderdeel b][ref21], wordt verzorgd
      bevat de schoolgids onverminderd de vorige leden met betrekking tot dat onderwijs:

      a. in ieder geval met betrekking tot het schooljaar voorafgaande aan het schooljaar
      waarin de schoolgids wordt vastgesteld en onderscheiden naar schoolsoort als bedoeld in
      [artikel 2.1, eerste lid, onderdelen a tot en met d, van de Wet voortgezet onderwijs 2020][ref22], voor elk
      leerjaar:

      1°. het aantal leerlingen dat doorstroomt naar een hoger leerjaar, naar voortgezet onderwijs
      als bedoeld in de [Wet voortgezet onderwijs 2020][ref23], naar een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, van de Wet educatie en beroepsonderwijs][ref24] of naar hoger onderwijs als bedoeld in
      de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref25],

      2°. het aantal leerlingen dat de school zonder diploma verlaat en het aantal leerlingen dat voor het eindexamen
      slaagt,

      b. informatie over de inrichting van het onderwijsprogramma voor de eerste twee leerjaren waarbij wordt aangegeven
      of sprake is van vakoverstijgende programmaonderdelen en de inzet van het personeel daarbij.

      4 Indien voortgezet speciaal onderwijs als bedoeld in [artikel 14a, eerste lid, onderdeel a][ref26], wordt verzorgd
      is het vorige lid van overeenkomstige toepassing.

      5 Indien voortgezet speciaal onderwijs als bedoeld in [artikel 14, eerste lid, onderdeel b][ref27], wordt verzorgd
      bevat de schoolgids onverminderd de vorige leden, met betrekking tot het schooljaar voorafgaande aan het schooljaar
      waarin de schoolgids wordt vastgesteld, voor elk leerjaar:

      a. het aantal leerlingen dat de school verlaat en voor wie het onderwijs in het arbeidsmarktgerichte
      uitstroomprofiel het laatst gevolgde onderwijs is,

      b. het aantal leerlingen, bedoeld in onderdeel a, dat doorstroomt naar voortgezet onderwijs
      als bedoeld in de [Wet voortgezet onderwijs 2020][ref28] en naar een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, van de Wet educatie en beroepsonderwijs][ref29], en

      c. het aantal leerlingen, bedoeld in onderdeel a, dat op 1 augustus van het schooljaar waarin de schoolgids wordt
      vastgesteld, een functie op de arbeidsmarkt bekleedt.

      6 De algemene maatregel van bestuur, bedoeld in het eerste lid, onder a, wordt aan de beide kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en
      gedurende die termijn niet door of namens een der kamers de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.


