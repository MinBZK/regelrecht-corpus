    text: |-
      1 De bekostiging van een bijzondere school wordt beëindigd, indien het aantal leerlingen vastgesteld volgens
      [artikel 140][ref1], gedurende 2 achtereenvolgende schooljaren in elk van die jaren minder heeft bedragen dan het
      volgende aantal leerlingen:

      a. de school voor speciaal onderwijs: 25 leerlingen;

      b. de school voor voortgezet speciaal onderwijs: 29 leerlingen;

      c. de school of de instelling voor speciaal en voortgezet speciaal onderwijs: 33 leerlingen;

      d. de afdeling: 8 leerlingen.

      De bekostiging van het voortgezet speciaal onderwijs van een bijzondere school voor speciaal en voortgezet speciaal
      onderwijs wordt beëindigd, indien het aantal leerlingen van het voortgezet speciaal onderwijs van de school
      vastgesteld volgens [artikel 140][ref2], gedurende 2 achtereenvolgende schooljaren in elk van die jaren minder
      heeft bedragen dan 8.

      2 Het eerste lid is niet van toepassing op de eerste 5 volledige schooljaren van de bekostiging van de school.

      3 Onze Minister kan op aanvraag van het bevoegd gezag, het college van burgemeester en wethouders van de betrokken
      gemeente gehoord, besluiten dat, in afwijking van het eerste lid, de bekostiging wordt voortgezet indien aan de
      school behoefte bestaat. Tevens hoort Onze Minister gedeputeerde staten van de betrokken provincie voor zover het
      scholen betreft bedoeld in [artikel 78, eerste lid][ref3]. De aanvraag wordt ingediend voor 16 oktober van het
      schooljaar volgend op de 2 achtereenvolgende schooljaren, bedoeld in de aanhef van het eerste lid.

      4 Het besluit van Onze Minister op de aanvraag, bedoeld in het derde lid, wordt genomen voor 16 februari volgend
      op de datum 16 oktober genoemd in het derde lid. Indien Onze Minister niet voor 16 februari heeft besloten, wordt
      de aanvraag geacht te zijn ingewilligd. Een besluit van Onze Minister dat de bekostiging wordt voortgezet, geldt
      telkens voor ten hoogste 3 schooljaren.

      5 De beëindiging van de bekostiging geschiedt met ingang van 1 augustus van het tweede schooljaar volgend op
      de 2 achtereenvolgende schooljaren, bedoeld in de aanhef van het eerste lid, tenzij door Onze Minister bij zijn
      afwijzing van de aanvraag, bedoeld in het derde lid, of bij een in beroep gegeven uitspraak anders is bepaald.

      6 Van zijn besluit en van de uitspraak in beroep wordt door Onze Minister mededeling gedaan door toezending van een
      afschrift aan gedeputeerde staten en aan het college van burgemeester en wethouders.

      7 Indien het aantal leerlingen van de betrokken school vastgesteld volgens [artikel 140][ref4] in het schooljaar
      volgend op de twee achtereenvolgende schooljaren, bedoeld in de aanhef van het eerste lid, gelijk is aan of meer
      bedraagt dan het op grond van het eerste lid voor die school geldende aantal, wordt de bekostiging niet beëindigd
      op grond van dit artikel. De procedures die in werking zijn gesteld op grond van het derde tot en met het zesde
      lid, eindigen van rechtswege en besluiten, genomen op grond van het derde tot en met het zesde lid, vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel140
