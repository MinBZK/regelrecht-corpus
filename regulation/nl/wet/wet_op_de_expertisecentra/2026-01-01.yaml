  - number: '46'
    text: |-
      1 De leerlingen nemen deel aan alle voor hen bestemde onderwijsactiviteiten, met dien verstande dat die
      onderwijsactiviteiten voor de leerlingen onderling kunnen verschillen.

      2 Het bevoegd gezag kan op aanvraag van de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam
      is, de leerling, een leerling vrijstellen van bepaalde onderwijsactiviteiten in het speciaal onderwijs met
      uitzondering van een doorstroomtoets als bedoeld in [artikel 48c, derde lid][ref1]. Een vrijstelling kan slechts
      worden verleend, op door het bevoegd gezag vastgestelde gronden. Het bevoegd gezag bepaalt bij de vrijstelling
      welke onderwijsactiviteiten voor de leerling in de plaats komen van die waarvan vrijstelling is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel48c
