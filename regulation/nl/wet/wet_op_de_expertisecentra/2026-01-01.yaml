  - number: '119'
    text: |-
      1 In aanvulling op de bekostiging, bedoeld in [artikel 114][ref1], ontvangt de school, niet zijnde een
      instelling, per leerling een bedrag dat afhankelijk is van de in de toelaatbaarheidsverklaring, bedoeld in
      [artikel 40, tiende of twaalfde lid][ref2], opgenomen ondersteuningsbehoefte van de leerling.

      2 In aanvulling op de bekostiging, bedoeld in [artikel 114][ref3], ontvangen de instellingen jaarlijks
      bekostiging voor de ondersteuning van de leerlingen van de instellingen, met een visuele handicap, bedoeld
      in artikel 8, eerste lid, tweede volzin, respectievelijk leerlingen met een auditieve en communicatieve
      handicap, bedoeld in [artikel 8, eerste lid, derde volzin][ref4], en de vervulling van de taken, bedoeld in
      [artikel 9, onderdelen b en c][ref5].

      3 Voor scholen, niet zijnde instellingen, waaraan onderwijs wordt gegeven aan leerlingen die zijn opgenomen
      in residentiële instellingen wordt bekostiging vastgesteld die is gebaseerd op het aantal leerlingen
      aan wie op de teldatum onderwijs wordt gegeven op basis van een samenwerkingsovereenkomst als bedoeld in
      [artikel 71a, tweede lid][ref6]. Voor elke leerling, bedoeld in de eerste volzin, ontvangt de school het voor die
      onderwijssoort vastgestelde bedrag.

      4 Bij ministeriële regeling worden de bedragen, bedoeld in het eerste, tweede en derde lid, vastgesteld.


