  - number: '128'
    text: |-
      1 In het jaar volgend op de definitieve vaststelling, bedoeld in [artikel 127, tiende lid][ref1], wordt het
      overschrijdingsbedrag vastgesteld waarop het bevoegd gezag van een niet door de gemeente in stand gehouden school,
      die gedurende een of meer jaren van het desbetreffende tijdvak in de gemeente was gevestigd, aanspraak heeft.

      2 Het overschrijdingsbedrag, bedoeld in het eerste lid, wordt vastgesteld door het percentage, bedoeld in
      [artikel 127, tiende lid][ref2], te vermenigvuldigen met het totaal van de ontvangsten van een niet door de
      gemeente in stand gehouden school dat is gebaseerd op de bedragen die krachtens de [artikelen 113][ref3] en
      [114][ref4], dan wel indien het een instelling betreft, krachtens de artikelen 113, 114 en [119][ref5] voor het
      desbetreffende tijdvak zijn vastgesteld.

      3 Bij het vaststellen van het totaal van de ontvangsten, bedoeld in het tweede lid, blijven buiten beschouwing de
      uitgaven en ontvangsten voor:

      a. de administratie, het beheer en het bestuur, bedoeld in [artikel 113, tweede lid, onderdeel h][ref6];

      b. de exploitatie van ruimten voor onderwijs in lichamelijke oefening en van watergewenning en bewegingstherapie en

      c. indien het een instelling betreft, de ondersteuning, bedoeld in [artikel 119, tweede lid][ref7].

      4 Indien aan het bevoegd gezag van een niet door de gemeente in stand gehouden school een deel van de bekostiging
      is overgedragen door een ander bevoegd gezag, wordt bij het vaststellen van het totaal van de ontvangsten, bedoeld
      in het tweede lid, dat deel aangemerkt als ontvangsten.

      5 Indien de gemeente voor een niet door de gemeente in stand gehouden school het deel van de kosten bedoeld in
      [artikel 113, derde lid, onderdelen e, f en k][ref8], dan wel, indien het een instelling betreft, de bedragen,
      voor de in artikel 121, derde lid, onderdeel a, bedoelde voorzieningen betrekking hebben, geheel of gedeeltelijk
      verzorgt, wordt een overeenkomstig deel van de ontvangsten in mindering gebracht op het totaal van de ontvangsten
      voor de betrokken school waarover ingevolge het eerste lid het overschrijdingsbedrag wordt vastgesteld.

      6 Voor de vaststelling bedoeld in het eerste lid en [artikel 127, eerste en tiende lid][ref9], worden voor een
      school voor speciaal en voortgezet speciaal onderwijs de bedragen die voor een zodanige school zijn uitgegeven
      dan wel ontvangen, toegerekend aan het speciaal onderwijs, onderscheidenlijk het voortgezet speciaal onderwijs,
      naar rato van het aantal leerlingen dat in het desbetreffende kalenderjaar in aanmerking kwam voor het volgen van
      speciaal onderwijs, onderscheidenlijk voortgezet speciaal onderwijs.

      7 Voor de vaststelling bedoeld in eerste lid en [artikel 127, eerste en tiende lid][ref10], worden voor een school
      waaraan een of meer afdelingen zijn verbonden, de bedragen die voor een zodanige school, de afdeling of afdelingen
      daaronder begrepen, zijn uitgegeven dan wel ontvangen, toegerekend aan de school, onderscheidenlijk de afdeling of
      afdelingen, naar rato van het aantal leerlingen dat in het desbetreffende kalenderjaar in aanmerking kwam voor het
      volgen van onderwijs aan de school, onderscheidenlijk de desbetreffende afdeling.

      8 Indien een gemeente gedurende een gedeelte van het desbetreffende tijdvak een of meer scholen in stand houdt,
      wordt voor het vaststellen van het overschrijdingsbedrag, bedoeld in het eerste lid, uitgegaan van het totaal van
      de ontvangsten van een niet door de gemeente in stand gehouden school over een overeenkomstig gedeelte van het
      desbetreffende tijdvak.

      9 Grondslag voor de berekening van het aantal leerlingen, bedoeld in het zesde en zevende lid, is het aantal
      leerlingen op 1 oktober voorafgaande aan het desbetreffende kalenderjaar. Voor het kalenderjaar waarin een nieuw
      opgerichte school wordt geopend, wordt als grondslag genomen het aantal leerlingen op 1 oktober van dat jaar.


