  - number: '14'
    text: |-
      1 Het voortgezet speciaal onderwijs wordt onderscheiden in:

      a. het uitstroomprofiel vervolgonderwijs;

      b. het arbeidsmarktgerichte uitstroomprofiel;

      c. het uitstroomprofiel dagbesteding.

      2 Op een school wordt voortgezet speciaal onderwijs verzorgd in ten minste één van de uitstroomprofielen.
    url: https://wetten.overheid.nl/BWBR0003549/2026-01-01#Artikel14
  - number: 14a
    text: |-
      1 Het onderwijs in het uitstroomprofiel vervolgonderwijs omvat op een school:

      a. het onderwijs in één of meer van de schoolsoorten, bedoeld in
      [artikel 2.1, eerste lid, onderdelen a tot en met d, van de Wet voortgezet onderwijs 2020][ref1];

      b. het onderwijs volgens de voorschriften die voortvloeien uit het toepassing geven aan
      [artikel 2.79 van de Wet voortgezet onderwijs 2020][ref2].

      2 Op het onderwijs, bedoeld in het eerste lid, onderdeel a, zijn de voorschriften, gegeven bij of
      krachtens de [artikelen 2.12 tot en met 2.27][ref3], [2.32][ref4], [2.37 tot en met 2.39][ref5],
      [2.88 tot en met 2.91][ref6] en [2.102 tot en met 2.107l van de Wet voortgezet onderwijs 2020][ref7] van
      overeenkomstige toepassing. Bij dat onderwijs worden de eindexamenprogramma’s vastgesteld op grond van
      [artikel 2.54 van de Wet voortgezet onderwijs 2020][ref8] in acht genomen, met dien verstande dat:

      a. bij algemene maatregel van bestuur onderscheidenlijk bij ministeriële regeling regels kunnen worden vastgesteld
      in afwijking van de regels die bij algemene maatregel van bestuur respectievelijk bij ministeriële regeling zijn
      vastgesteld op grond van genoemde bepalingen van de [Wet voortgezet onderwijs 2020][ref9], met dien verstande dat
      bij algemene maatregel van bestuur tevens kerndoelen kunnen worden vastgesteld in aanvulling op de kerndoelen die
      zijn vastgesteld op grond van [artikel 2.13 van de Wet voortgezet onderwijs 2020][ref10], waarbij tevens kan worden
      bepaald dat het onderwijs na de eerste twee leerjaren wordt verzorgd mede op basis van de kerndoelen die zijn
      vastgesteld op grond van dit onderdeel;

      b. voor zover het betreft het voorbereidend beroepsonderwijs, het onderwijs wordt gegeven in de
      basisberoepsgerichte leerweg, de kaderberoepsgerichte leerweg dan wel in beide leerwegen;

      c. voor zover het betreft het middelbaar algemeen voortgezet onderwijs, de school een of meer profielen als bedoeld
      in [artikel 2.25, tweede lid, van de Wet voortgezet onderwijs 2020][ref11] verzorgt;

      d. voor zover het betreft het hoger algemeen voortgezet onderwijs en het voorbereidend
      wetenschappelijk onderwijs, de school een of meer profielen als bedoeld in
      [artikel 2.20, vierde lid, van de Wet voortgezet onderwijs 2020][ref12] verzorgt;

      e. provinciale staten van Fryslân bij verordening kerndoelen Friese taal en cultuur kunnen
      vaststellen in afwijking van de kerndoelen Friese taal en cultuur die zijn vastgesteld op grond van
      [artikel 11e van de Wet op het voortgezet onderwijs][ref13], zoals dat luidde op 31 juli 2014, met dien verstande
      dat op die verordening [artikel 2.16 van de Wet voortgezet onderwijs 2020][ref14] van overeenkomstige toepassing
      is; en

      f. de inspectie op verzoek van het bevoegd gezag ermee kan instemmen dat om lichamelijke
      of psychische redenen voor individuele leerlingen wordt afgeweken van de urennorm,
      bedoeld in de [artikelen 2.38, eerste tot en met vierde lid][ref15], [2.107h][ref16] en
      [2.107i, van de Wet voortgezet onderwijs 2020][ref17].


