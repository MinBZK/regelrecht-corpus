      Onze Minister bepaalt op voorstel van het bevoegd gezag per school, welke onderdelen genoemd in de
      [artikelen 13, eerste tot en met vijfde lid][ref1], het speciaal onderwijs aan meervoudig gehandicapte kinderen
      omvat.


