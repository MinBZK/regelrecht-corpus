  - number: '116'
    text: |-
      1 Bij het bepalen van de hoogte van de bekostiging, bedoeld in [artikel 114, eerste lid][ref1], gaat Onze
      Minister uit van het aantal leerlingen op 1 februari van het voorafgaande jaar, dat door een samenwerkingsverband
      toelaatbaar is verklaard tot het speciaal onderwijs of voorgezet speciaal onderwijs.

      2 Voor een school die voor het eerst word bekostigd, gaat Onze Minister bij het bepalen van de bekostiging, bedoeld
      in [artikel 114, eerste lid][ref2]:

      a. voor de resterende maanden van het kalenderjaar waarin de school wordt geopend, uit van het aantal leerlingen op
      1 oktober volgende op de opening en

      b. voor het daaropvolgende kalenderjaar uit van het aantal leerlingen van de school op 1 februari volgende op de
      opening.

      3 In geval van samenvoeging van scholen, bedoeld in [artikel 115, eerste lid][ref3], gaat Onze Minister bij
      het bepalen van de hoogte van de bekostiging, bedoeld in [artikel 114, eerste lid][ref4], uit van het aantal
      leerlingen van alle bij de samenvoeging betrokken scholen, voor elke school vastgesteld volgens het eerste lid.

      4 Bij het bepalen van de hoogte van de bekostiging voor scholen, niet zijnde instellingen, waaraan onderwijs
      wordt gegeven aan leerlingen die zijn opgenomen in residentiële instellingen, gaat Onze Minister uit van het
      aantal leerlingen waaraan op 1 februari van het voorafgaande jaar onderwijs wordt gegeven op basis van een
      samenwerkingsovereenkomst als bedoeld in [artikel 71a, tweede lid][ref5].

      5 Voor scholen, niet zijnde instellingen, waar onderwijs wordt gegeven aan leerlingen die zijn opgenomen in de
      inrichtingen, bedoeld in [artikel 1, onderdelen b, van de Beginselenwet justitiële jeugdinrichtingen][ref6] en
      de gesloten accommodaties, bedoeld in [artikel 6.2.2 van de Jeugdwet][ref7], wordt in ieder geval de bekostiging
      vastgesteld op basis van het aantal leerlingen op 1 februari uit het voorgaande jaar in die inrichtingen en
      accommodaties.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld ter uitvoering van het eerste lid
      tot en met het vijfde lid.


