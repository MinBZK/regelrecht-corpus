  - number: '8'
    text: |-
      1 Het onderwijs bedoeld in [artikel 2, tweede lid, aanhef en onderdelen f tot en met n][ref1], wordt gegeven in
      scholen voor speciaal onderwijs, scholen voor voortgezet speciaal onderwijs en scholen voor speciaal en voortgezet
      speciaal onderwijs, verdeeld als aangegeven in die onderdelen. Het onderwijs bedoeld in artikel 2, tweede lid,
      aanhef en onderdeel d, en het onderwijs aan meervoudig gehandicapte kinderen die naast een handicap als bedoeld
      in artikel 2, tweede lid, onderdeel d, een handicap hebben als bedoeld in artikel 2, tweede lid, onderdeel a tot
      en met c, f en h tot en met m, wordt gegeven in instellingen voor speciaal en voortgezet speciaal onderwijs aan
      visueel gehandicapte kinderen. Het onderwijs, bedoeld in artikel 2, tweede lid, aanhef en onderdelen a, b en c, en
      het onderwijs aan meervoudig gehandicapte leerlingen die naast een handicap als bedoeld in artikel 2, tweede lid,
      aanhef en onderdelen a, b en c, een handicap hebben als bedoeld in artikel 2, tweede lid, onderdeel f en h tot en
      met m, wordt gegeven in instellingen voor speciaal en voortgezet speciaal onderwijs aan auditief of communicatief
      gehandicapte kinderen. In verband met de spreiding van de instellingen kan het onderwijs door de instelling worden
      aangeboden op een of meer andere locaties dan die van de hoofdvestiging.

      2 Bij algemene maatregel van bestuur wordt bepaald aan welke soorten van scholen afdelingen kunnen worden verbonden
      en voor welke kinderen deze zijn bestemd.

      3 De algemene maatregel van bestuur bedoeld in het tweede lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure
      bedoeld in de eerste 3 volzinnen, kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
