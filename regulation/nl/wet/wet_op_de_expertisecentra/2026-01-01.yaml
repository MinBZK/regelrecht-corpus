  - number: '114'
    text: |-
      1 Onze Minister stelt jaarlijks de bekostiging voor een school vast.

      2 De bekostiging voor een school bestaat uit een bedrag per school en een bedrag per leerling.

      3 Het bedrag per school kan in ieder geval verschillend worden vastgesteld voor scholen van verschillende grootte
      en voor scholen en leerlingen in het speciaal onderwijs en het voortgezet speciaal onderwijs.

      4 Onze Minister kan extra bekostiging toekennen. Bij of krachtens algemene maatregel van bestuur worden regels
      gesteld over de gevallen waarin, de voorwaarden waaronder en het bedrag dat aan extra bekostiging kan worden
      toegekend. In ieder geval wordt extra bekostiging toegekend aan scholen, niet zijnde instellingen, voor de
      bestrijding van onderwijsachterstanden.

      5 Onze Minister stelt de hoogte van de bedragen, bedoeld in het tweede en vierde lid, alsmede de bekostiging,
      bedoeld in [artikel 119][ref1], zodanig vast dat zij voldoet aan de redelijke behoeften van een in normale
      omstandigheden verkerende school.

      6 Bij ministeriële regeling worden jaarlijks de bedragen, bedoeld in het tweede en vierde lid, vastgesteld, worden
      nadere regels gesteld over de wijze waarop de hoogte van de bekostiging wordt berekend en worden regels gesteld
      over de termijnen van de betaling daarvan.

      7 De bedragen, bedoeld in het tweede en vierde lid, gelden voor het kalenderjaar volgend op het tijdstip van de
      vaststelling.

      8 Bij de vaststelling of tussentijdse aanpassing van de bedragen, bedoeld in het eerste en vijfde lid, worden de
      loonontwikkelingen verwerkt, tenzij de toestand van 's Rijks financiën zich daartegen verzet.

      9 Voor de kosten, bedoeld in [artikel 113, tweede lid, onderdelen e, f, g, h, j en k][ref2], wordt jaarlijks
      voor 1 oktober eenmalig de prijsontwikkeling verwerkt in de bedragen, bedoeld in het eerste en vijfde lid. De
      prijsontwikkeling geldt voor het jaar volgend op het jaar waarin de vaststelling plaatsvindt.

      10 Bij ministeriële regeling worden nadere regels gesteld over de berekening van de prijsontwikkeling, bedoeld in
      het negende lid. In ieder geval worden de bedragen aangepast op basis van de ramingen van het Centraal planbureau
      overeenkomstig de prijsmutatie van de netto materiële overheidsconsumptie.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel119
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel113
