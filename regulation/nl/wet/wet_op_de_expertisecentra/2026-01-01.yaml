    text: |-
      1 De gemeenteraad kan besluiten tot vermindering van het aantal door de gemeente in stand gehouden openbare
      scholen in de gemeente. Het besluit wijst tevens de op te heffen scholen aan en het tijdstip met ingang waarvan de
      opheffing geschiedt. Opheffing van een school vindt niet plaats indien instandhouding van die school noodzakelijk
      is om voldoende te voorzien in de behoefte aan openbaar onderwijs.

      2 De openbare rechtspersoon, bedoeld in [artikel 50][ref1], en de stichting, bedoeld in [artikel 28][ref2] of
      [51][ref3], kunnen besluiten tot opheffing van een door die openbare rechtspersoon of stichting in stand gehouden
      openbare school.

      3 Een besluit als bedoeld in het eerste of tweede lid wordt genomen voor 16 oktober voorafgaand aan het schooljaar
      waarin de opheffing geschiedt, dan wel, indien het besluit meer dan een school betreft, voorafgaand aan het
      schooljaar waarin de eerste van deze scholen wordt opgeheven. Het besluit wordt onderworpen aan de goedkeuring
      van gedeputeerde staten, voor zover het scholen betreft als bedoeld in [artikel 78, eerste lid][ref4], en aan
      de goedkeuring van Onze Minister, voor zover het scholen betreft als bedoeld in [artikel 86, eerste lid][ref5].
      Gedeputeerde staten en Onze Minister onthouden hun goedkeuring ten aanzien van het besluit voor zover ten gevolge
      van de opheffing van een school, afhankelijk van de schoolsoort, regionaal, provinciaal dan wel landelijk niet meer
      voldoende zou zijn voorzien in de behoefte aan openbaar onderwijs.

      4 Gedeputeerde staten en Onze Minister beslissen voor 16 februari volgend op de in het derde lid genoemde datum.
      Indien gedeputeerde staten, onderscheidenlijk Onze Minister, niet voor 16 februari hebben beslist, wordt het
      desbetreffende besluit geacht te zijn goedgekeurd.

      5 De besluiten van de gemeenteraad, van het bevoegd gezag, van gedeputeerde staten en van Onze Minister, genomen
      op grond van dit artikel, worden bekendgemaakt door een openbare kennisgeving binnen 2 weken na de datum waarop het
      besluit is genomen.


