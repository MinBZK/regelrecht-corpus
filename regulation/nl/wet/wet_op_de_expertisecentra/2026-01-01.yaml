  - number: '118'
    text: |-
      1 In geval van bijzondere omstandigheden, kan Onze Minister voor een school, niet zijnde een instelling, in
      aanvulling op de bekostiging, bedoeld in de [artikelen 114][ref1] en [117][ref2] bekostiging verstrekken.

      2 De aanvullende bekostiging vindt plaats:

      a. op aanvraag van het bevoegd gezag;

      b. indien nodig, onder het opleggen van verplichtingen aan het bevoegd gezag, en

      c. voor een bepaalde periode.

      3 De aanvraag wordt niet eerder ingediend dan 16 weken voorafgaand aan het kalenderjaar waarin de bijzondere
      omstandigheden zich zullen voordoen en niet later dan in het kalenderjaar waarin die omstandigheden zich hebben
      voorgedaan.

      4 Onze Minister beslist binnen 16 weken na ontvangst van de aanvraag. Onze Minister kan deze termijn eenmaal met
      ten hoogste 28 weken verlengen.

      5 Onze Minister kan een bekostigingsplafond instellen voor de aanvullende bekostiging, bedoeld in het eerste lid.
      In dat geval worden bij ministeriële regeling regels gesteld over de verdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel117
