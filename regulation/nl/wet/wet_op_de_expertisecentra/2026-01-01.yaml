  - number: 48d
    text: |-
      1 Het bevoegd gezag neemt, indien een leerling verhinderd is de doorstroomtoets als bedoeld in
      [artikel 48c, derde lid][ref1], af te leggen, binnen drie weken na het reguliere moment van afname de
      doorstroomtoets alsnog af, tenzij dit voor de leerling om medische redenen onmogelijk is.

      2 Het bevoegd gezag kan, mede op basis van de gegevens van de toetsen, bedoeld in [artikel 48c, eerste lid][ref2],
      bepalen dat door een leerling geen doorstroomtoets wordt afgelegd, indien de leerling:

      a. zeer moeilijk lerend is;

      b. meervoudig gehandicapt is en voor wie het zeer moeilijk lerend zijn een van de handicaps is; of

      c. vier jaar of korter in Nederland is en om die reden de Nederlandse taal onvoldoende beheerst.

      3 Indien het bevoegd gezag toepassing wil geven aan het tweede lid, overlegt het daarover met de ouders voor het
      reguliere moment van afname, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel48c
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel48c
