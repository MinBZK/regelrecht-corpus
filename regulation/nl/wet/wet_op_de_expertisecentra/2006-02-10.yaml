      studierichting die voorbereidt op het beroep van leraar basisonderwijs, met dien verstande dat dit
      getuigschrift voor wat betreft het onderwijs in zintuiglijke oefening en lichamelijke oefening, bedoeld in
      [artikel 13, eerste lid onder a en b, en vijfde lid onder a en b][ref1], een bevoegdheid verleent voor het geven
