  - number: 28c.1
    text: |-
      De commissie voor de indicatiestelling beoordeelt op verzoek van de ouders van een leerling, die zijn woonplaats
      heeft in het gebied van het regionaal expertisecentrum, of een leerling op basis van de in het achtste lid bedoelde
      criteria:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28c
  - number: 28c.1.a
    text: |-
      in aanmerking komt voor een leerlinggebonden budget indien de leerling wordt ingeschreven bij een school als
      bedoeld in de [Wet op het primair onderwijs][ref1] of de [Wet op het voortgezet onderwijs][ref2] alsmede


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0002399
  - number: 28c.1.b
    text: |-
      toelaatbaar is tot een van de onderwijssoorten in een cluster als bedoeld in
      [artikel 2, vierde lid onder b of c][ref1], waarvoor de commissie voor de indicatiestelling werkzaam is en zo ja,
      tot welke onderwijssoort, dan wel toelaatbaar is tot het cluster, bedoeld in [artikel 2, vierde lid onder d][ref2],
      waarvoor de commissie voor de indicatiestelling werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 28c.2
    text: |-
      Het oordeel van de commissie voor de indicatiestelling, bedoeld in het eerste lid onder a en b, heeft betrekking op
      een bij algemene maatregel van bestuur per onderwijssoort bepaald aantal schooljaren. Indien het oordeel in de loop
      van een schooljaar wordt gegeven, wordt de periode tot de eerste dag van het eerstvolgende schooljaar toegevoegd
      aan de in de eerste volzin bedoelde periode. Voor het verstrijken van de periode, bedoeld in de eerste volzin, in
      voorkomende gevallen verlengd overeenkomstig de tweede volzin, beoordeelt de commissie voor de indicatiestelling op
      verzoek van de ouders of de leerling nog voldoet aan de criteria, bedoeld in het achtste lid.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28c
  - number: 28c.3
    text: |-
      Indien de commissie voor de indicatiestelling op basis van de beschikbare informatie nog niet tot een
      oordeel over de toelaatbaarheid kan komen, kan de commissie het bevoegd gezag van een school verzoeken
      te adviseren over de toelaatbaarheid van een leerling tot een van de onderwijssoorten in een cluster
      als bedoeld in [artikel 2, vierde lid onder b of c][ref1], dan wel tot het cluster als bedoeld in
      [artikel 2, vierde lid onder d][ref2], waarvoor de commissie voor de indicatiestelling werkzaam is. Teneinde
      dit advies mogelijk te maken wordt de leerling gedurende een periode van korter dan een schooljaar toegelaten
      tot een school waarvan het bevoegd gezag zich tot advisering bereid heeft verklaard in voorkomend geval onder
      handhaving van zijn inschrijving bij de school, bedoeld in de [Wet op het primair onderwijs][ref3] dan wel de
      [Wet op het voortgezet onderwijs][ref4]. Voor de afloop van de in de vorige volzin bedoelde periode zendt het
      bevoegd gezag het advies, vergezeld van een verslag van de bevindingen aan de commissie voor de indicatiestelling.
      Indien de commissie voor de indicatiestelling niet binnen de in de tweede volzin genoemde periode, een beslissing
      heeft genomen, wordt de termijn, genoemd in de tweede volzin met 6 weken verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003420
      [ref4]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0003420
      - id: ref4
        bwb_id: BWBR0002399
  - number: 28c.4
    text: |-
      Het verzoek, bedoeld in het eerste en het tweede lid, wordt bij de commissie voor de indicatiestelling ingediend
      onder overlegging van een volledig ingevuld aanmeldingsformulier waarvan het model bij ministeriële regeling
      wordt vastgesteld. Bij die ministeriële regeling wordt tevens bepaald welke gegevens en verklaringen bij het
      aanmeldingsformulier dienen te worden gevoegd en de wijze waarop zij dienen te worden aangeleverd. In voorkomend
      geval informeert de commissie voor de indicatiestelling de ouders welke gegevens en verklaringen ontbreken en op
      welke wijze zij zijn te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28c
  - number: 28c.5
    text: |-
      De commissie voor de indicatiestelling zendt een afschrift van het aanmeldingsformulier en de gegevens en
      verklaringen, bedoeld in het vierde lid, tezamen met een afschrift van het oordeel aan de landelijke commissie
      toezicht indicatiestelling, bedoeld in [artikel 28e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28e
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28e
        paragraaf: '1'
        afdeling: '1'
  - number: 28c.6
    text: |-
      Het regionaal expertisecentrum ziet erop toe dat de in het vijfde lid bedoelde gegevens en verklaringen slechts
      worden gebruikt ten behoeve van de beoordeling, bedoeld in het eerste lid, en het toezicht daarop door de
      landelijke commissie toezicht indicatiestelling.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28c
  - number: 28c.7
    text: |-
      De gegevens en verklaringen worden bij het regionaal expertisecentrum bewaard tot drie jaar na afloop van de
      periode waarvoor de leerling toelaatbaar is verklaard tot een van de onderwijssoorten binnen het cluster of tot het
      cluster waartoe het regionaal expertisecentrum behoort dan wel tot drie jaar na de beoordeling door de commissie
      voor de indicatiestelling indien de leerling niet toelaatbaar is verklaard tot een van de onderwijssoorten binnen
      het cluster of tot het cluster waartoe het regionaal expertisecentrum behoort. Het regionaal expertisecentrum
      draagt er zorg voor dat de gegevens en verklaringen worden bewaard op een plaats die uitsluitend toegankelijk is
      voor het regionaal expertisecentrum en de met het onderzoek belaste functionarissen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28c
  - number: 28c.8
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot de door de commissie
      voor de indicatiestelling in acht te nemen criteria voor het in aanmerking komen voor een leerlinggebonden
      budget alsmede het toelaatbaar verklaren tot een onderwijssoort in een cluster als bedoeld in
      [artikel 2, vierde lid onder b of c][ref1], en tot het cluster, bedoeld in [artikel 2, vierde lid onder d][ref2],
      waarbij onderscheid kan worden gemaakt tussen toelaatbaarheid tot het speciaal onderwijs en het voortgezet speciaal
      onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 28c.9
    text: |-
      Met betrekking tot een leerling die toelaatbaar is verklaard tot het cluster, bedoeld in
      [artikel 2, vierde lid onder d][ref1], geeft de commissie voor de indicatiestelling de ouders tevens een advies
      over de te kiezen school binnen het gebied van het regionaal expertisecentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 28c.10
    text: |-
      Een beslissing van de commissie voor de indicatiestelling als bedoeld in het eerste en het
      tweede lid en een beslissing van bedoelde commissie die samenhangt met de toepassing van
      het derde lid, wordt aangemerkt als een beschikking van een bestuursorgaan als bedoeld in
      [artikel 1:1, eerste lid, van de Algemene wet bestuursrecht][ref1]. Deze beschikking is geen besluit als bedoeld in
      [artikel 8:4 onder e, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 28c.11
    text: |-
      Indien de commissie voor de indicatiestelling zich bij haar beoordeling niet houdt aan de voorschriften, bedoeld
      in het achtste lid, en de aanwijzingen van de landelijke commissie toezicht indicatiestelling, bedoeld in
      [artikel 28e, tweede lid][ref1], kan Onze minister bepalen dat de commissie voor de indicatiestelling niet langer
      bevoegd is tot het geven van beoordelingen op grond van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28e
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28e
        paragraaf: '1'
        afdeling: '1'
  - number: 28c.12
    text: |-
      Indien redelijkerwijs kan worden verwacht dat de grond voor ontneming van de bevoegdheid, bedoeld in het elfde
      lid, niet langer aanwezig is, kan Onze minister besluiten de bevoegdheid opnieuw aan de commissie voor de
      indicatiestelling toe te kennen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28c
  - number: 28d.1
    text: |-
      Indien een commissie voor de indicatiestelling op grond van artikel 28c, elfde lid, de bevoegdheid, bedoeld in dat
      lid, is ontnomen, wordt het verzoek, bedoeld in artikel 28c, eerste en tweede lid, ingediend bij en beoordeeld door
      een door Onze minister ingestelde commissie voor de indicatiestelling.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28d
  - number: 28d.2
    text: |-
      Onder een leerling die in aanmerking komt voor een leerlinggebonden budget en die toelaatbaar is verklaard tot een
      van de onderwijssoorten in een cluster als bedoeld in artikel 2, vierde lid onder b of c, dan wel tot het cluster,
      bedoeld in artikel 2, vierde lid onder d, wordt tevens verstaan de leerling ten aanzien van wie die beoordeling
      door de ministeriële commissie is gegeven.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28d
  - number: 28d.3
    text: Artikel 28c is van overeenkomstige toepassing op de ministeriële commissie voor de indicatiestelling.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28d
  - number: 28e.1
    text: |-
      Er is een landelijke commissie toezicht indicatiestelling, die bestaat uit een voorzitter en vier leden. De
      voorzitter en de leden van de commissie worden door Onze minister benoemd en ontslagen. Onze minister kan onder
      bij algemene maatregel van bestuur te stellen regels besluiten tot schorsing van de voorzitter of van de leden van
      de commissie.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28e
  - number: 28e.2
    text: |-
      De landelijke commissie toezicht indicatiestelling is bevoegd een commissie voor de indicatiestelling aanwijzingen
      te geven omtrent het gebruik van de bevoegdheid, bedoeld in artikel 28c, eerste, tweede en derde lid, in
      het licht van de criteria, bedoeld in artikel 28c, achtste lid. Van een dergelijke aanwijzing stelt zij Onze
      minister terstond op de hoogte. Aanwijzingen als bedoeld in de eerste volzin kunnen geen betrekking hebben op de
      besluitvorming betreffende een individueel kind.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28e
  - number: 28e.3
    text: |-
      De landelijke commissie toezicht indicatiestelling adviseert op basis van de haar op grond van artikel 28c, vijfde
      lid, en artikel 40a toegezonden informatie, Onze minister over eventuele wijziging van de criteria, bedoeld in
      artikel 28c, achtste lid, en zij geeft daarnaast Onze minister alle adviezen die zij dienstig acht alsmede alle
      adviezen waarom Onze minister heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28e
  - number: 28e.4
    text: 'Bij algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28e
  - number: 28e.4.a
    text: de samenstelling, de benoemingstermijnen en de werkwijze van de landelijke commissie toezicht indicatiestelling,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28e
  - number: 28e.4.b
    text: de vergoeding voor haar werkzaamheden,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28e
  - number: 28e.4.c
    text: de verslaglegging over haar werkzaamheden en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28e
  - number: 28e.4.d
    text: de rekening en verantwoording van het geldelijk beheer.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28e
  - number: 28e.5
    text: |-
      Desgevraagd informeert de landelijke commissie toezicht indicatiestelling Onze minister en de door hem aangewezen
      ambtenaren over al hetgeen de commissie betreft en geeft zij de door Onze minister aangewezen ambtenaren de boeken
      en bescheiden ter inzage.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28e
  - number: 28e.6
    text: |-
      De voorzitter en de leden vervullen geen nevenbetrekking of nevenwerkzaamheden die schadelijk zijn voor de
      vervulling van de functie van voorzitter of lid van de landelijke commissie toezicht indicatiestelling en zij
      verrichten hun werkzaamheden zonder last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28e
  - number: 28e.7
    text: |-
      Onze minister benoemt een secretaris ten behoeve van de landelijke commissie toezicht indicatiestelling die
      tevens directeur is van het bureau ter ondersteuning van de werkzaamheden van de landelijke commissie toezicht
      indicatiestelling. Onze minister stelt financiële middelen beschikbaar ten behoeve van het bureau. De leden
      van het bureau zijn voor hun werkzaamheden voor de landelijke commissie toezicht indicatiestelling uitsluitend
      verantwoording schuldig aan de landelijke commissie toezicht indicatiestelling.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28e
  - number: 28e.8
    text: |-
      Onze minister zendt binnen vijf jaar na inwerkingtreding van dit artikel en vervolgens telkens na vier jaar aan
      de Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van het functioneren van de landelijke
      commissie toezicht indicatiestelling.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28e
  - number: 28f
    text: |-
      Een krachtens de artikelen 28b, 28c en 28e vastgestelde algemene maatregel van bestuur wordt aan de Tweede Kamer
      der Staten-Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat 4 weken na de overlegging zijn
      verstreken bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens de kamer de wens te
      kennen wordt gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval
      wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend. De vorige 3 volzinnen zijn niet van
      toepassing, voor zover het ontwerp van een algemene maatregel van bestuur voordien aan de Tweede Kamer der Staten-
      Generaal is voorgelegd en door of namens de kamer te kennen is gegeven dat van de procedure, bedoeld in de vorige 3
      volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28f
  - number: '29.1'
    text: |-
      Aan elke school is een directeur verbonden, bij wie onder verantwoordelijkheid van het bevoegd gezag de
      onderwijskundige, organisatorische en huishoudelijke leiding berust. De functie van directeur kan minder dan een
      volledige formatieplaats omvatten. De directeur van een school kan tevens met de leiding worden belast van een
      andere school waar de functie van directeur vacant is. De directeur van een school kan tevens directeur zijn van
      een andere school of van een school als bedoeld in de [Wet op het primair onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: '29.2'
    text: Aan een school zijn een of meer leraren verbonden.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel29
  - number: '29.3'
    text: |-
      Een of meer leraren kunnen tevens tot adjunct-directeur worden benoemd dan wel tewerkgesteld zonder benoeming.
      Indien geen adjunct-directeur wordt benoemd dan wel tewerkgesteld zonder benoeming, wijst het bevoegd gezag een
      leraar aan als plaatsvervanger van de directeur.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel29
  - number: '29.4'
    text: |-
      Voor zover het betreft de functie van directeur en adjunct-directeur, wordt in geval van samenvoeging van scholen
      de overblijvende school gelijkgesteld met een nieuwe school. De directeur, onderscheidenlijk de adjunct-directeur
      of adjunct-directeuren, kan slechts een van de directeuren onderscheidenlijk kunnen slechts een of meer van de
      adjunct-directeuren van de samen te voegen scholen zijn, tenzij geen van de betrokkenen de desbetreffende functie
      wenst te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel29
  - number: '29.5'
    text: |-
      Het bevoegd gezag kan tevens personeel, dat werkzaamheden verricht ten behoeve van meer dan een school of meer dan
      een school als bedoeld in de [Wet op het primair onderwijs][ref1], benoemen of te werk stellen zonder benoeming.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: '29.6'
    text: Aan een school kan onderwijsondersteunend personeel zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel29
  - number: '29.7'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke rechtspositionele gevolgen zijn verbonden aan functies die
      zowel onderwijsgevende als onderwijsondersteunende taken omvatten.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel29
  - number: '29.8'
    text: |-
      Het bevoegd gezag stelt jaarlijks het beleid vast met betrekking tot de formatie van de verschillende categorieën
      personeel van de school. Indien toepassing is gegeven aan het vijfde lid, stelt het bevoegd gezag tevens jaarlijks
      het beleid vast met betrekking tot de formatie van dat personeel. Zoveel mogelijk tegelijk met de vaststelling
      van het in de eerste en tweede volzin bedoelde beleid met betrekking tot de formatie, bepaalt het bevoegd gezag
      functies en taken van het personeel van de school, met inachtneming van de daaromtrent bij algemene maatregel van
      bestuur te geven nadere voorschriften, en in voorkomend geval functies en taken van het in het vijfde lid bedoelde
      personeel.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel29
  - number: '30.1'
    text: |-
      Het bevoegd gezag stelt ten behoeve van de directie van elk van zijn scholen, indien daaraan van een
      ondervertegenwoordiging van vrouwen in de directie sprake is, eenmaal in de 4 jaar een document inzake evenredige
      vertegenwoordiging van vrouwen in de schoolleiding vast.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel30
  - number: '30.2'
    text: |-
      Het document bevat streefcijfers, met inbegrip van een bepaald tijdvak waarbinnen deze streefcijfers worden
      gerealiseerd, aan de hand waarvan door het bevoegd gezag een beleid inzake evenredige vertegenwoordiging van
      vrouwen in de schoolleiding wordt gevoerd, opdat in de directie van elke school van het bevoegd gezag vrouwen
      en mannen naar evenredigheid werkzaam zullen zijn. Voor de evenredige vertegenwoordiging wordt uitgegaan van de
      verhouding mannen en vrouwen voor wat betreft het onderwijzend personeel dat werkzaam is in het door de school
      verzorgde onderwijs, zoals die blijkt uit de daarover jaarlijks door Onze minister gepubliceerde cijfers. Het
      document vermeldt tevens de maatregelen die het bevoegd gezag heeft genomen en zal nemen teneinde de in de eerste
      volzin bedoelde streefcijfers te realiseren en geeft een overzicht van de beoogde en bereikte resultaten van het
      beleid inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding gedurende de periode waarvoor het
      document geldt, onderscheidenlijk de periode waarvoor het vorige document gold.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel30
  - number: '30.3'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een exemplaar van het document in het gebouw van de school ter inzage
      wordt gelegd op een voor het personeel, de ouders en de leerlingen toegankelijke plaats, alsmede dat een exemplaar
      wordt bewaard bij de administratie van de school.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel30
  - number: '31.1'
    text: |-
      Het bevoegd gezag stel na overleg met de directeur en indien toepassing is gegeven aan
      [artikel 29, vijfde lid][ref1], met het in dat artikellid bedoelde personeel voor zover dat is belast met
      managementtaken met betrekking tot de scholen en de scholen, bedoeld in de [Wet op het primair onderwijs][ref2],
      een managementstatuut vast. In het managementstatuut is ten minste een regeling opgenomen betreffende de
      bevoegdheden van de directeur en indien toepassing is gegeven aan [artikel 29, vijfde lid][ref3], van de
      bevoegdheden van het in dat artikellid bedoelde personeel voor zover dat is belast met managementtaken met
      betrekking tot de scholen en de scholen, bedoeld in de [Wet op het primair onderwijs][ref4], met betrekking tot de
      toedeling, bestemming en aanwending van de bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003420
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '29'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '29'
        paragraaf: '2'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0003420
  - number: '31.2'
    text: |-
      Het managementstatuut bevat tevens de aanduiding van de andere aan het bevoegd gezag bij wettelijk voorschrift
      toegekende taken en bevoegdheden, waarvan het bevoegd gezag heeft bepaald dat de directeur van de school of
      indien toepassing is gegeven aan [artikel 29, vijfde lid][ref1], het in dat artikellid bedoelde personeel
      voor zover dat is belast met managementtaken met betrekking tot de scholen en de scholen, bedoeld in de
      [Wet op het primair onderwijs][ref2] deze in naam van het bevoegd gezag kan uitoefenen. Het managementstatuut bevat
      voorts instructies ten aanzien van deze taken en bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '29'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
  - number: '31.3'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een exemplaar van het managementstatuut in het gebouw van de school ter
      inzage beschikbaar is op een voor een ieder toegankelijke plaats. Het bevoegd gezag zendt een exemplaar van het
      managementstatuut, alsmede elke wijziging daarvan, zo spoedig mogelijk na de vaststelling ter kennisneming aan
      de inspectie.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel31
  - number: '32.1'
    text: |-
      Directeuren, adjunct-directeuren en leraren worden door het bevoegd gezag benoemd dan wel tewerkgesteld zonder
      benoeming.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel32
  - number: '32.2'
    text: |-
      Om tot directeur, adjunct-directeur, leraar of in een andere functie voor het geven van onderwijs, behalve
      godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs, te kunnen worden benoemd of tewerkgesteld zonder
      benoeming, dient de betrokkene te voldoen aan [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel3
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '3'
  - number: '32.3'
    text: |-
      Om te kunnen worden benoemd of tewerkgesteld zonder benoeming uitsluitend voor het geven van
      godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs dient de betrokkene te voldoen aan
      [artikel 3, eerste lid, onder a en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel3
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '3'
  - number: '32.4'
    text: |-
      Om te kunnen worden benoemd of tewerkgesteld zonder benoeming in een andere functie dan het geven van
      onderwijs en om te worden benoemd of tewerkgesteld zonder benoeming in een functie bestaande uit het
      verrichten van werkzaamheden ten behoeve van meer dan een school of meer dan een school als bedoeld in de
      [Wet op het primair onderwijs][ref1], niet zijnde het geven van onderwijs, dient de betrokkene:


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: 32.4.a
    text: |-
      in het bezit te zijn van de verklaring, bedoeld in [artikel 3, eerste lid, onder a][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel3
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '3'
  - number: 32.4.b
    text: te voldoen aan de overige vereisten voor de te vervullen functie.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel32
  - number: '32.5'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de vereisten, bedoeld in het vierde
      lid, onder b.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel32
  - number: '32.6'
    text: |-
      De verklaring, bedoeld in [artikel 3, eerste lid, onder a][ref1], die in verband met de benoeming of de
      tewerkstelling zonder benoeming wordt overgelegd mag op het tijdstip van overlegging niet ouder zijn dan een bij
      algemene maatregel van bestuur te bepalen periode.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel3
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '3'
  - number: '33.1'
    text: |-
      Met inachtneming van bij of krachtens algemene maatregel van bestuur vastgestelde voorschriften als bedoeld in
      het tweede lid regelt het bevoegd gezag van een openbare school de rechtspositie van het personeel en draagt het
      bevoegd gezag van een bijzondere school zorg voor de regeling van de rechtspositie van het personeel.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel33
  - number: '33.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor het personeel, bedoeld in [artikel 32][ref1],
      voorschriften vastgesteld betreffende:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel32
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '32'
        paragraaf: '2'
        afdeling: '1'
  - number: 33.2.a
    text: |-
      salarissen en toelagen, door het bevoegd gezag toe te kennen bij uitoefening van een volledige weektaak of een deel
      daarvan, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel33
  - number: 33.2.b
    text: |-
      vakantie, verlof, aanspraken op salaris in geval van militaire dienst, ziekte of ongeval, ontslaguitkeringen,
      alsmede omtrent andere rechten en verplichtingen, dan wel de voorwaarden waaronder het bevoegd gezag een of meer
      onderdelen van in dit onderdeel bedoelde rechten en verplichtingen zelf regelt of voor de regeling daarvan zorg
      draagt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel33
  - number: '33.3'
    text: |-
      Onder regeling van de rechtspositie als bedoeld in het eerste lid wordt voor de openbare scholen niet begrepen het
      vaststellen van bepalingen omtrent:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel33
  - number: 33.3.a
    text: aanstelling,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel33
  - number: 33.3.b
    text: schorsing,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel33
  - number: 33.3.c
    text: disciplinaire maatregelen, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel33
  - number: 33.3.d
    text: ontslag.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel33
  - number: 33a
    text: |-
      Het bevoegd gezag benoemt, schorst en ontslaat het personeel. Van een benoeming in vaste dienst en in tijdelijke
      dienst voor langer dan een half jaar, alsmede van een ontslag uit een zodanige betrekking, doet het bevoegd gezag
      terstond mededeling aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel33a
  - number: '34.1'
    text: |-
      Het bevoegd gezag benoemt de directeur en de adjunct-directeur, de leraren en het onderwijsondersteunend personeel
      in algemene dienst van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel34
  - number: '34.2'
    text: |-
      Onder benoeming in algemene dienst van het bevoegd gezag wordt in dit artikel en in de [artikelen 56][ref1] en
      [62][ref2] verstaan een benoeming ten behoeve van het verrichten van werkzaamheden aan door het bevoegd gezag
      in stand gehouden scholen. Indien het betreft een bevoegd gezag dat twee of meer scholen in stand houdt en aan
      deze scholen niet aan eenzelfde categorie van kinderen, genoemd in [artikel 2, tweede lid][ref3], onderwijs wordt
      gegeven, geschiedt voor zover het een leraar betreft, de in het eerste lid bedoelde benoeming, in afwijking van
      het bepaalde in de eerste volzin, uitsluitend ten behoeve van het uitoefenen van een gelijksoortige functie aan een
      gelijksoortige school.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '56'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '62'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '36.1'
    text: |-
      Het bevoegd gezag is verplicht aan studenten die in opleiding zijn voor een functie in het basisonderwijs, het
      speciaal onderwijs of het voortgezet speciaal onderwijs gelegenheid te bieden de als onderdeel van hun opleiding
      vereiste ervaring in de school te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel36
  - number: '36.2'
    text: 'De verplichting bedoeld in het eerste lid, betreft:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel36
  - number: 36.2.a
    text: studenten die op een opleidingsinstituut voor onderwijzend personeel zijn ingeschreven;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel36
  - number: 36.2.b
    text: |-
      in een schooljaar gelijktijdig niet meer studenten als bedoeld onder a, dan een derde van het aantal leraren in
      dat jaar.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel36
  - number: '36.3'
    text: |-
      Een bevoegd gezag kan een student de verdere toegang tot de school ontzeggen, indien deze in strijd handelt met
      de grondslag en doelstellingen van de school. Van een beslissing tot ontzegging van de toegang tot de school
      wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd gezag van het betrokken
      opleidingsinstituut en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel36
  - number: '36.4'
    text: |-
      De directeur regelt in overeenstemming met het opleidingsinstituut en het onderwijzend personeel de werkzaamheden
      in verband met de begeleiding door dit personeel van de studenten in de school.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel36
  - number: '36.5'
    text: |-
      Onze minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de verplichting verlenen. De ontheffing geldt voor 1 schooljaar.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel36
  - number: '36.6'
    text: |-
      De scholen waarop studenten als bedoeld in het eerste lid, zijn toegelaten, zijn toegankelijk voor de inspectie
      belast met het toezicht op de opleidingsinstituten voor onderwijzend personeel en voor de directeuren en de door
      deze aan te wijzen leraren van die opleidingsinstituten, een en ander voor zover zulks voor de uitoefening van het
      toezicht op de praktische vorming noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel36
  - number: '37'
    text: |-
      Over aangelegenheden van algemeen belang voor de rechtstoestand van het personeel bedoeld in [artikel 32][ref1],
      wordt volgens bij algemene maatregel van bestuur te stellen regels overleg gevoerd met de daarvoor in aanmerking
      komende personeelsorganisaties en, voor zover zij daarbij belang hebben, organisaties van gemeente- en
      schoolbesturen. De algemene maatregel van bestuur bepaalt tevens de gevallen waarin in dat overleg overeenstemming
      met de personeelsorganisaties dient te worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel32
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '32'
        paragraaf: '2'
        afdeling: '1'
  - number: '38'
    text: |-
      Over de door het bevoegd gezag ingevolge [artikel 33][ref1] te treffen regelingen, alsmede over andere
      aangelegenheden van algemeen belang voor de bijzondere rechtstoestand van het personeel van de desbetreffende
      school, wordt door of namens het bevoegd gezag overleg gevoerd met de daarvoor in aanmerking komende
      vakorganisaties van overheids- en onderwijspersoneel, op een met deze schriftelijk overeengekomen wijze. In geval
      van een geschil over de deelneming aan het overleg, bedoeld in de eerste volzin, alsmede in geval van een geschil
      over de aard, de inhoud en de organisatie van het overleg leggen de betrokken partijen het geschil voor aan een
      geschillencommissie. Deze geschillencommissie bestaat uit drie personen, die door de partijen gezamenlijk worden
      aangewezen. De uitspraak van de geschillencommissie heeft bindende kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel33
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '33'
        paragraaf: '2'
        afdeling: '1'
  - number: '39.1'
    text: |-
      De leeftijd waarop het kind tot het speciaal onderwijs mag worden toegelaten is 4 jaar. Indien een kind toelaatbaar
      is verklaard tot een van de onderwijssoorten, bedoeld in [artikel 2, tweede lid onder a of b][ref1], kan het worden
      toegelaten als het de leeftijd van 3 jaar heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '39.2'
    text: |-
      Onverminderd [artikel 40, derde lid][ref1], kan de inspecteur in het belang van het kind toestaan dat een kind
      eerder wordt toegelaten dan in het eerste lid is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
        paragraaf: '3'
        afdeling: '1'
  - number: '39.3'
    text: |-
      De leeftijd waarop de leerling het speciaal onderwijs en het voortgezet speciaal onderwijs moet verlaten, is 20
      jaar.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel39
  - number: '39.4'
    text: |-
      Onverminderd [artikel 40, derde lid en zevende lid][ref1], kan de inspecteur voor een leerling in het voortgezet
      speciaal onderwijs ontheffing verlenen van het bepaalde in het derde lid, indien het voortgezet verblijf op
      de school wenselijk is ter voltooiing van zijn opleiding of van een op verhoging van zijn arbeidsgeschiktheid
      gerichte behandeling. Hij kan zich ten behoeve van zijn beslissing een rapport over de leerling, opgesteld door de
      in [artikel 40b][ref2] dan wel [artikel 41, tweede lid][ref3], bedoelde commissie, doen voorleggen. De commissie
      kan daartoe de betrokken leerling aan een onderzoek onderwerpen. De ontheffing wordt telkens voor de tijd van ten
      hoogste 1 jaar verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel40b
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel41
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 40b
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '41'
        paragraaf: '3'
        afdeling: '1'
  - number: '40.1'
    text: |-
      De beslissing over toelating en verwijdering van leerlingen berust bij het bevoegd gezag, met inachtneming van het
      tweede, derde, vierde, vijfde, zesde en zevende lid en [artikel 40b][ref1], [41][ref2] en [42][ref3], [42a][ref4].
      De toelating mag niet afhankelijk worden gesteld van een geldelijke bijdrage van de ouders. Overeenkomsten
      waarbij ouders worden verplicht tot het betalen van een geldelijke bijdrage zijn nietig, behoudens voorzover zij
      na de toelating van de leerling tot de school schriftelijk zijn aangegaan en in het desbetreffende schriftelijke
      stuk aan de ouders kenbaar is gemaakt dat het een vrijwillige bijdrage betreft waarvoor de overeenkomst niet
      behoeft te worden aangegaan, doch waarvoor geldt dat na de ondertekening wel een verplichting tot betaling van de
      overeengekomen bijdrage bestaat. Zodanige overeenkomsten zijn evenzeer nietig, indien deze niet hebben voorzien
      in de vermelding dat de ouders de mogelijkheid hebben er voor te kiezen om de overeenkomst slechts voor bepaalde
      voorzieningen aan te gaan en ten behoeve daarvan niet een specificatie voor de te onderscheiden voorzieningen in de
      overeenkomst is opgenomen. Zodanige overeenkomsten zijn voorts nietig indien ten aanzien daarvan geen reductie- en
      kwijtscheldingsregeling geldt en de inhoud van die regeling niet in de overeenkomst is opgenomen. Een overeenkomst
      wordt telkens voor de periode van een schooljaar aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40b
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel42a
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 40b
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '41'
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '42'
        paragraaf: '3'
