  - number: '139.6'
    text: |-
      Indien een gemeente gedurende een gedeelte van het desbetreffende tijdvak een of meer scholen in stand houdt,
      wordt voor het vaststellen van het overschrijdingsbedrag, bedoeld in het eerste lid, uitgegaan van het totaal van
      de ontvangsten van een niet door de gemeente in stand gehouden school over een overeenkomstig gedeelte van het
      desbetreffende tijdvak.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel139
  - number: '141'
    text: |-
      Aan het bevoegd gezag van de niet door de gemeente in stand gehouden scholen wordt een afschrift gezonden
      van de besluiten van de gemeenteraad tot vaststelling van de mate waarin meer dan wel minder uitgaven
      zullen worden gedaan, bedoeld in [artikel 137, eerste lid][ref1], tot verlening van het voorschot,
      bedoeld in [artikel 137, tweede of derde lid][ref2], en tot voorlopige en definitieve vaststelling van het
      overschrijdingsbedrag, bedoeld in [artikel 138, zesde en zevende lid][ref3]. Daarbij is opgenomen een staat van
      voorzieningen als bedoeld in [artikel 138, eerste lid onder j][ref4], waarin per kalenderjaar wordt aangegeven het
      verloop van de toevoegingen en de onttrekkingen aan de voorzieningen. De toezending geschiedt binnen 2 weken na
      de dag waarop de gemeenteraad een besluit als bedoeld in de eerste volzin heeft genomen. Het bevoegd gezag van een
      niet door de gemeente in stand gehouden school kan tegen een besluit als bedoeld in de eerste volzin administratief
      beroep instellen bij gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel137
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel138
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel138
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel141
