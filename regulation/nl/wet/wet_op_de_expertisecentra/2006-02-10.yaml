      - id: ref4
        bwb_id: BWBR0003549
        artikel: 42a
        paragraaf: '3'
        afdeling: '1'
  - number: '40.2'
    text: |-
      Tot de school wordt uitsluitend als leerling toegelaten degene waarvan de ouders aantonen, dan wel, indien hij
      meerderjarig en handelingsbekwaam is, degene die aantoont dat hij:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel40
  - number: 40.2.a
    text: de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel40
  - number: 40.2.b
    text: |-
      vreemdeling is en jonger is dan 18 jaar op de eerste schooldag waarop het speciaal onderwijs, dan wel het
      voortgezet speciaal onderwijs begint, waarvoor voor de eerste maal toelating wordt gewenst,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel40
  - number: 40.2.c
    text: |-
      vreemdeling is, 18 jaar of ouder is op de eerste schooldag waarop het speciaal onderwijs, dan wel het voortgezet
      speciaal onderwijs begint, waarvoor voor de eerste maal toelating wordt gewenst en op die dag rechtmatig verblijf
      houdt in de zin van [artikel 8 van de Vreemdelingenwet 2000][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 40.2.d
    text: |-
      vreemdeling is, niet meer voldoet aan een van de voorwaarden, genoemd onder b of c, en eerder in overeenstemming
      met een van die onderdelen voor speciaal onderwijs, dan wel voortgezet speciaal onderwijs is toegelaten tot een
      school, welk onderwijs nog steeds wordt gevolgd en nog niet is voltooid.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel40
  - number: '40.3'
    text: |-
      Een leerling wordt niet tot een school toegelaten dan nadat een commissie voor de indicatiestelling heeft verklaard
      dat de leerling toelaatbaar is tot een van de onderwijssoorten die door de school worden verzorgd dan wel tot
      het cluster, bedoeld in [artikel 2, vierde lid onder d][ref1], waartoe de school behoort. De eerste volzin is
      niet van toepassing ten aanzien van leerlingen die worden toegelaten op basis van de bekostiging, bedoeld in
      [artikel 117, zesde of achtste lid][ref2], met dien verstande dat voor leerlingen die worden toegelaten op basis
      van bekostiging als bedoeld in [artikel 117, achtste lid][ref3], in de administratie van de school een verklaring
      aanwezig moet zijn van de residentiële instelling dat de leerling in die instelling is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel117
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
  - number: '40.4'
    text: |-
      De toelating tot een school wordt niet geweigerd op de grond dat de leerling niet is aangewezen op het onderwijs
      van de school indien een commissie voor de indicatiestelling heeft verklaard dat de leerling toelaatbaar
      is tot een van de onderwijssoorten die door de school worden verzorgd dan wel tot het cluster, bedoeld in
      [artikel 2, vierde lid onder d][ref1], waartoe de school behoort. De toelating van een leerling mag ook niet
      geweigerd worden op denominatieve gronden, tenzij de ouders van de leerling weigeren te verklaren dat zij de
      grondslag van het onderwijs van de school zullen respecteren dan wel onderschrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '40.5'
    text: |-
      Voordat wordt besloten tot verwijdering hoort het bevoegd gezag de betrokken leraar of leraren. Definitieve
      verwijdering van een leerling waarop de [Leerplichtwet 1969][ref1] van toepassing is, vindt niet plaats dan
      nadat het bevoegd gezag ervoor heeft zorggedragen dat een basisschool, een speciale school voor basisonderwijs,
      een school voor speciaal onderwijs, een school voor speciaal en voortgezet speciaal onderwijs, een school voor
      voortgezet speciaal onderwijs, een instelling voor speciaal en voortgezet speciaal onderwijs, een school voor
      voortgezet onderwijs dan wel een instelling als bedoeld in [artikel 1, onder c, van de Leerplichtwet 1969][ref2]
      bereid is de leerling toe te laten. Indien aantoonbaar gedurende 8 weken zonder succes is gezocht naar een
      zodanige school of instelling waarnaar kan worden verwezen, kan in afwijking van de vorige volzin tot definitieve
      verwijdering worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002628
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '1'
  - number: '40.6'
    text: |-
      Indien na de toelating tot de school blijkt dat deze op welke grond dan ook niet in overeenstemming met het tweede
      lid heeft plaatsgevonden, wordt de leerling onmiddellijk verwijderd.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel40
  - number: '40.7'
    text: |-
      Tenzij een commissie voor de indicatiestelling een leerling voor een aansluitende periode toelaatbaar heeft
      verklaard tot een van de onderwijssoorten die door de school worden verzorgd dan wel tot het cluster, bedoeld
      in [artikel 2, vierde lid onder d][ref1], waartoe de school behoort, wordt een leerling na afloop van de periode
      gedurende welke hij toelaatbaar is verklaard tot de desbetreffende onderwijssoort dan wel het desbetreffende
      cluster, met inachtneming van de tweede en derde volzin van het vijfde lid, verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '40.8'
    text: |-
      Indien tegen een besluit van het bevoegd gezag van een openbare school ingevolge het eerste, tweede,
      derde, vierde, vijfde, zesde of zevende lid, bezwaar is gemaakt, besluit het bevoegd gezag in afwijking van
      [artikel 7:10 van de Algemene wet bestuursrecht][ref1] binnen 4 weken na ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '40.9'
    text: |-
      Het bevoegd gezag van een openbare school besluit niet op het bezwaarschrift, tenzij het bezwaarschrift is gericht
      tegen een besluit ingevolge het tweede, zesde of zevende lid dan na overleg met de inspecteur en desgewenst met
      andere deskundigen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel40
  - number: '40.10'
    text: Het derde, het vierde en het zevende lid zijn niet van toepassing op een leerling van een instelling.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel40
  - number: 40a.1
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gegeven over de rapportage die het bevoegd gezag zendt aan
      de landelijke commissie toezicht indicatiestelling met betrekking tot de reden van toelating van leerlingen die
      zijn toegelaten op basis van bekostiging als bedoeld in [artikel 117, zesde en achtste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
  - number: 40a.2
    text: |-
      Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur wordt aan de Tweede Kamer der Staten-
      Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat 4 weken na de overlegging zijn verstreken bij
      koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens de kamer de wens te kennen wordt
      gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een
      daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend. De vorige 3 volzinnen zijn niet van toepassing,
      voor zover het ontwerp van een algemene maatregel van bestuur voordien aan de Tweede Kamer der Staten-Generaal is
      voorgelegd en door of namens de kamer te kennen is gegeven dat van de procedure, bedoeld in de vorige 3 volzinnen,
      kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel40a
  - number: 40b.1
    text: |-
      Het bevoegd gezag van een school, niet zijnde een instelling, of de bevoegde gezagsorganen van twee of
      meer scholen, niet zijnde instellingen, die hetzelfde regionaal expertisecentrum in stand houden, stelt
      onderscheidenlijk stellen een commissie voor de begeleiding in, die zodanig is samengesteld dat zij adequaat kan
      adviseren vanuit zowelonderwijskundig als pedagogisch, psychologisch en medisch oogpunt, rekening houdend met de
      handicap van de leerling.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel40b
  - number: 40b.2
    text: |-
      De commissie voor de begeleiding heeft tot taak een voorstel te doen voor het handelingsplan, bedoeld in
      [artikel 41a][ref1], en de uitvoering van het handelingsplan te evalueren alsmede te adviseren over terugplaatsing
      of overplaatsing van de leerling naar het basisonderwijs of het voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel41a
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 41a
        paragraaf: '3'
        afdeling: '1'
  - number: '41.1'
    text: |-
      Tot een instelling mogen slechts die kinderen worden toegelaten voor wie vaststaat dat overwegend een
      orthopedagogische en orthodidactische benadering aangewezen is en die voor het op die instelling gegeven onderwijs
      in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel41
  - number: '41.2'
    text: |-
      Het bevoegd gezag van een instelling of de bevoegde gezagsorganen van twee of meer instellingen stelt
      onderscheidenlijk stellen een commissie in die tot taak heeft: a. te beoordelen of het kind voor het onderwijs
      op de instelling waarvoor toelating werd verzocht, in aanmerking komt, b. het doen van aanbevelingen omtrent
      het begeleiden van de individuele leerling tijdens zijn verblijf op de instelling, teneinde een optimale
      ontwikkeling van de in de leerling aanwezige mogelijkheden te bewerkstelligen, en c. als onderdeel van de onder
      b genoemde taak, aan het eind van elk schooljaar te adviseren omtrent terugplaatsing of overplaatsing van de
      leerling naar het basisonderwijs, een andere vorm van speciaal onderwijs, het voortgezet onderwijs of een vorm
      van voortgezet speciaal onderwijs. De commissie kan bij het uitoefenen van haar taak gebruik maken van bestaande
      onderzoeksgegevens, indien dergelijke gegevens aan haar worden verstrekt. De commissie wordt geleid door de
      directeur van de instelling waarvoor toelating werd verzocht. De commissie bestaat naast de directeur van de
      instelling ten minste uit: 1°. een academisch gevormd psycholoog of pedagoog die zich heeft gespecialiseerd
      in de jeugd- en kinderpsychologische richting, onderscheidenlijk in de orthopedagogische richting, 2°. een
      maatschappelijk deskundige die in het bezit is van het diploma maatschappelijk werker van een sociale academie of
      van een door Onze minister aangewezen diploma en 3°. een arts die vertrouwd is met het onderzoek van kinderen voor
      wie het op de instelling gegeven onderwijs is bestemd.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel41
  - number: '41.3'
    text: |-
      In verband met de beoordeling van kinderen met een niet-Nederlandse culturele achtergrond kan de commissie een
      deskundige op het gebied van de taal en cultuur van het land van oorsprong inschakelen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel41
  - number: '41.4'
    text: |-
      Geen kind wordt tot een instelling toegelaten dan na onderzoek door een commissie als bedoeld in het tweede lid. De
      inspecteur is bevoegd het onderzoek bij te wonen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel41
  - number: '41.5'
    text: |-
      De onderscheiden functionarissen van de commissie brengen hun bevindingen naar aanleiding van hun onderzoek van het
      kind door middel van een onderzoeksrapport ter kennis van de commissie.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel41
  - number: '41.6'
    text: |-
      Van het in het vierde lid bedoelde onderzoek maakt de commissie een gemeenschappelijk rapport waarin naast het
      eindoordeel, de onderzoeksrapporten bedoeld in het vijfde lid, en de eventuele overige aan de commissie verstrekte
      documenten worden opgenomen, alsmede de bevindingen van de onderscheiden functionarissen naar aanleiding van het
      overleg in de commissie tot uitdrukking worden gebracht.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel41
  - number: '41.7'
    text: |-
      De directeur bespreekt de conclusies van het rapport met de ouders, dan wel, indien de leerling meerderjarig en
      handelingsbekwaam is, de leerling. De ouders van een minderjarige of handelingsonbekwame leerling, de leerling die
      de leeftijd van 16 jaar heeft bereikt en de inspecteur krijgen desgewenst inzage in het rapport.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel41
  - number: '41.8'
    text: |-
      Het bevoegd gezag ziet erop toe dat het gemeenschappelijk rapport slechts wordt gebruikt ten behoeve van het
      verblijf van de betrokken leerling op de instelling. Van het bepaalde in de vorige volzin kan voor wat betreft het
      rapport worden afgeweken voor zover door de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam
      is, de leerling schriftelijk toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel41
  - number: '41.9'
    text: |-
      Het gemeenschappelijk rapport wordt in de instelling bewaard tot ten minste 3 jaar na het tijdstip waarop de
      leerling de instelling heeft verlaten. Het bevoegd gezag draagt er zorg voor dat het gemeenschappelijk rapport
      wordt bewaard op een plaats die uitsluitend toegankelijk is voor het bevoegd gezag en de met het onderzoek belaste
      functionarissen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel41
  - number: 41a.1
    text: |-
      Op voorstel van de commissie voor de begeleiding en in overeenstemming met de ouders stelt het bevoegd
      gezag van een school voor een leerling die toelaatbaar is verklaard tot een bepaalde onderwijssoort in
      een cluster als bedoeld in [artikel 2, vierde lid onder b of c][ref1], of tot het cluster als bedoeld in
      [artikel 2, vierde lid onder d][ref2], en stelt het bevoegd gezag van een instelling voor elke leerling, voor elk
      schooljaar een handelingsplan op. Indien de inschrijving van een leerling plaatsvindt op of na 1 augustus wordt het
      handelingsplan zo spoedig mogelijk doch uiterlijk een maand na die inschrijving opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 41a.2
    text: |-
      In het handelingsplan dat betrekking heeft op het laatste schooljaar van de periode gedurende welke de
      leerling door een commissie voor de indicatiestelling toelaatbaar is verklaard tot een bepaalde onderwijssoort
      in een cluster als bedoeld in [artikel 2, vierde lid onder b of c][ref1], of het cluster, bedoeld in
      [artikel 2, vierde lid onder d][ref2], wordt aangegeven dat de voortzetting van de toelating afhankelijk is van een
      nieuwe beoordeling door een commissie voor de indicatiestelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 41a.3
    text: Het handelingsplan wordt jaarlijks met de ouders geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel41a
  - number: 41a.4
    text: |-
      Het eerste lid en het derde lid zijn van overeenkomstige toepassing ten aanzien van een leerling die is
      ingeschreven op basis van de bekostiging, bedoeld in [artikel 117, achtste lid][ref1], en een leerling van een
      instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
  - number: '42.1'
    text: |-
      Indien de inspecteur van oordeel is dat op een school een leerling is geplaatst die daar ingevolge
      [artikel 40][ref1] dan wel [artikel 41, eerste lid][ref2], niet had mogen worden toegelaten, verzoekt hij het
      bevoegd gezag deze leerling te verwijderen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel41
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '41'
        paragraaf: '3'
        afdeling: '1'
  - number: '42.2'
    text: |-
      Bij weigering van het bevoegd gezag te voldoen aan een verzoek als bedoeld in het eerste lid, roept de inspecteur
      de beslissing van Onze minister in.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel42
  - number: '42.3'
    text: |-
      Indien de inspecteur van oordeel is dat het in [artikel 41, vierde lid][ref1], bedoelde onderzoek niet voldoet aan
      redelijke eisen, treedt hij in overleg met het bevoegd gezag onder mededeling van de zijns inziens aan te brengen
      wijzigingen. Indien dit overleg niet tot overeenstemming leidt, roept de inspecteur de beslissing van Onze minister
      in.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel41
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '41'
        paragraaf: '3'
        afdeling: '1'
  - number: 42a.1
    text: |-
      Onverminderd bij algemene maatregel van bestuur gegeven voorschriften met betrekking tot de in- en uitschrijving
      van leerlingen, vindt toelating van een leerling als bedoeld in artikel 40 slechts plaats nadat door de ouders of,
      indien de leerling meerderjarig en handelingsbekwaam is, door de leerling de gegevens betreffende de geslachtsnaam,
      de voorletters, de geboortedatum, het geslacht en het persoonsgebonden nummer van de leerling zijn overgelegd.
      Indien door de ouders of, indien de leerling meerderjarig en handelingsbekwaam is, door de leerling aannemelijk
      wordt gemaakt dat geen persoonsgebonden nummer van de leerling kan worden overgelegd, vindt de toelating plaats met
      inachtneming van het derde lid.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel42a
  - number: 42a.2
    text: |-
      De in het eerste lid bedoelde gegevens worden overgelegd door middel van een van overheidswege verstrekt document
      of een door een andere school of een school voor ander onderwijs verstrekt bewijs van uitschrijving, waarin de
      desbetreffende gegevens zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel42a
  - number: 42a.3
    text: |-
      Indien door de ouders of, indien de leerling meerderjarig en handelingsbekwaam is, door de leerling aannemelijk
      wordt gemaakt dat geen persoonsgebonden nummer van de leerling kan worden overgelegd, meldt het bevoegd gezag
      binnen twee weken na het besluit tot toelating aan de Informatie Beheer Groep de beschikbare gegevens van de
      leerling, bedoeld in het eerste lid, alsmede zijn adres en woonplaats.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel42a
  - number: 42a.4
    text: |-
      De Informatie Beheer Groep verstrekt binnen acht weken na ontvangst van de melding, bedoeld in het derde lid,
      aan het bevoegd gezag het sociaal-fiscaalnummer van de leerling, dan wel, indien is gebleken dat hem niet van
      overheidswege een sociaal-fiscaalnummer is verstrekt, het onderwijsnummer van de leerling. Het onderwijsnummer is
      een door de Informatie Beheer Groep uitgegeven en aan de leerling toegekend persoonsgebonden nummer.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel42a
  - number: 42a.5
    text: |-
      Het bevoegd gezag neemt de in het eerste lid bedoelde gegevens op in de leerlingenadministratie van de school. Bij
      ministeriële regeling kan worden bepaald welke andere gegevens in de leerlingenadministratie worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel42a
  - number: 42a.6
    text: |-
      Indien aan een leerling een onderwijsnummer is toegekend en het bevoegd gezag daarna de beschikking krijgt over
      zijn sociaal-fiscaalnummer, neemt het bevoegd gezag dit sociaal-fiscaalnummer terstond als persoonsgebonden nummer
      op in de leerlingenadministratie van de school in de plaats van het onderwijsnummer. Het bevoegd gezag meldt
      deze wijziging binnen twee weken aan de Informatie Beheer Groep onder opgave van het sociaal-fiscaalnummer en het
      onderwijsnummer van de leerling.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel42a
  - number: '43'
    text: |-
      Over iedere leerling die de school verlaat, stelt de directeur, na overleg met het onderwijzend personeel
      en de commissie voor de begeleiding, bedoeld in [artikel 40b][ref1], dan wel de commissie, bedoeld
      in [artikel 41, tweede lid][ref2], ten behoeve van de ontvangende school of school als bedoeld in de
      [Wet op het primair onderwijs][ref3] dan wel als bedoeld in de [Wet op het voortgezet onderwijs][ref4] een
      onderwijskundig rapport op. De commissie kan daartoe de leerling aan een onderzoek onderwerpen. Afschrift van
      dit rapport wordt verstrekt aan de ouders van een minderjarige of handelingsonbekwame leerling en aan de leerling
      die meerderjarig en handelingsbekwaam is. Desgewenst wordt tevens een afschrift verstrekt aan de leerling die de
      leeftijd van 16 jaar en nog niet die van 18 jaar heeft bereikt. Bij algemene maatregel van bestuur kunnen nadere
      voorschriften omtrent dit rapport worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40b
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0003420
      [ref4]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 40b
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '41'
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003420
      - id: ref4
        bwb_id: BWBR0002399
  - number: '46.1'
    text: |-
      De leerlingen nemen deel aan alle voor hen bestemde onderwijsactiviteiten, met dien verstande dat die
      onderwijsactiviteiten voor de leerlingen onderling kunnen verschillen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel46
  - number: '46.2'
    text: |-
      Het bevoegd gezag kan op verzoek van de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam
      is, de leerling, een leerling vrijstellen van bepaalde onderwijsactiviteiten. Een vrijstelling kan slechts worden
      verleend, op door het bevoegd gezag vastgestelde gronden. Het bevoegd gezag bepaalt bij de vrijstelling welke
      onderwijsactiviteiten voor de leerling in de plaats komen van die waarvan vrijstelling is verleend.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel46
  - number: '47'
    text: |-
      Op verzoek van de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, op verzoek van de
      leerling, kan aan leerlingen die voortgezet speciaal onderwijs volgen gelegenheid worden gegeven eindexamen af te
      leggen aan een school voor regulier onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel47
  - number: 47a.1
    text: |-
      Het bevoegd gezag doet onverwijld opgave aan burgemeester en wethouders van de gemeente waar de betrokkene woon- of
      verblijfplaats heeft van de gegevens van degene
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel47a
  - number: 47a.1.a
    text: |-
      op wie de [Leerplichtwet 1969][ref1] niet meer van toepassing is en die de leeftijd van 23 jaren nog niet heeft
      bereikt,


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 47a.1.b
    text: |-
      die niet in het bezit is van een diploma voorbereidend wetenschappelijk onderwijs of
      hoger algemeen voortgezet onderwijs als bedoeld in [artikel 7][ref1] onderscheidenlijk
      [artikel 8 van de Wet op het voortgezet onderwijs][ref2] dan wel een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e, van de Wet educatie en beroepsonderwijs][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 47a.1.c
    text: die
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel47a
  - number: 47a.1.c.1°
    text: |-
      het onderwijs aan de school gedurende een aaneengesloten periode van ten minste een maand of een door het bevoegd
      gezag te bepalen kortere periode zonder geldige reden niet meer volgt, of
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel47a
  - number: 47a.1.c.2°
    text: bij de school wordt in- of uitgeschreven of van de school wordt verwijderd.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel47a
  - number: 47a.2
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel47a
  - number: '48'
    text: |-
      Het bevoegd gezag stelt de ouders van de leerlingen in de gelegenheid ondersteunende werkzaamheden ten behoeve
      van de school en het onderwijs te verrichten. De ouders zijn daarbij gehouden de aanwijzingen op te volgen van de
      directeur en het overige onderwijzend personeel, die verantwoordelijk blijven voor de gang van zaken.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel48
  - number: '49.1'
    text: |-
      Het openbaar onderwijs draagt bij aan de ontwikkeling van de leerlingen met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse samenleving en met onderkenning
      van de betekenis van de verscheidenheid van die waarden.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel49
  - number: '49.2'
    text: Openbare scholen zijn toegankelijk voor alle kinderen zonder onderscheid van godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel49
  - number: '49.3'
    text: Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel49
  - number: '50.1'
    text: |-
      Een gemeenteraad kan bij verordening een openbare rechtspersoon instellen die tot doel heeft een of meer
      openbare scholen in de gemeente in stand te houden, al dan niet te zamen met openbare scholen als bedoeld in de
      [Wet op het primair onderwijs][ref1] of openbare scholen als bedoeld in de [Wet op het voortgezet onderwijs][ref2].
      Een openbare rechtspersoon kan ook worden ingesteld door meer dan een gemeente ten behoeve van het in stand houden
      van openbare scholen in die gemeenten door het vaststellen van een voor wat betreft de onderwerpen, bedoeld in
      het vierde lid, gelijkluidende verordening, in welk geval de openbare rechtspersoon niet eerder tot stand komt dan
      nadat alle daartoe strekkende verordeningen in werking zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0002399
  - number: '50.2'
    text: De gemeenteraad of gemeenteraden maken het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel50
  - number: '50.3'
    text: |-
      De openbare rechtspersoon oefent met uitzondering van de besluitvorming over de opheffing van een openbare school
      alle taken en bevoegdheden uit van het bevoegd gezag. Hij bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel50
  - number: '50.4'
    text: 'De verordening, bedoeld in het eerste lid, voorziet in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel50
  - number: 50.4.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de openbare rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel50
  - number: 50.4.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de gemeenteraad of gemeenteraden en dat ten minste een derde gedeelte, doch
      geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn
      ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel50
  - number: 50.4.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel50
  - number: 50.4.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de desbetreffende gemeenteraad of gemeenteraden en de
      vaststelling van de jaarrekening na instemming van de desbetreffende gemeenteraad of gemeenteraden,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel50
  - number: 50.4.e
    text: de wijze waarop de gemeenteraad of gemeenteraden toezicht op het bestuur uitoefenen,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel50
  - number: 50.4.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel50
  - number: 50.4.g
    text: |-
      de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode ten
      minste 5 jaren bedraagt,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel50
  - number: '50.5'
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad of gemeenteraden verslag uit over de werkzaamheden, waarbij in
      ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel50
  - number: '50.6'
    text: |-
      De vergaderingen van het bestuur van de openbare rechtspersoon zijn openbaar, tenzij het bestuur anders beslist, op
      gronden, vermeld in de verordening.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel50
  - number: '50.7'
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      gemeenteraad of gemeenteraden de maatregelen die zij nodig achten om de continuïteit van het onderwijsproces te
      waarborgen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel50
  - number: '50.8'
    text: |-
      De gemeenteraad of gemeenteraden zijn in geval van ernstige taakverwaarlozing door het bestuur of functioneren
      in strijd met de wet bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de openbare rechtspersoon
      te ontbinden.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel50
  - number: '51.1'
    text: |-
      Een gemeenteraad kan besluiten dat een of meer openbare scholen in de gemeente in stand worden gehouden door een
      stichting die zich ten doel stelt het in stand houden van een of meer openbare scholen, al dan niet te zamen met
      openbare scholen als bedoeld in de [Wet op het primair onderwijs][ref1] of openbare scholen als bedoeld in de
      [Wet op het voortgezet onderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0002399
  - number: '51.2'
    text: De gemeenteraad maakt het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel51
  - number: '51.3'
    text: |-
      Een stichting die een openbare school in stand houdt, wordt opgericht door een of meer gemeenten, al dan niet te
      zamen met een of meer privaatrechtelijke rechtspersonen met volledige rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel51
  - number: '51.4'
    text: |-
      Het statutaire doel van de stichting is uitsluitend het geven van openbaar onderwijs overeenkomstig
      [artikel 49][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel49
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '49'
        afdeling: '2'
  - number: '51.5'
    text: |-
      De stichting oefent met uitzondering van de besluitvorming over de opheffing van een openbare school alle taken en
      bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel51
  - number: '51.6'
    text: 'Onverminderd het vierde lid voorzien de statuten in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel51
  - number: 51.6.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel51
  - number: 51.6.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de gemeenteraad of gemeenteraden en dat ten minste een derde gedeelte, doch
      geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn
      ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel51
  - number: 51.6.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel51
  - number: 51.6.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de desbetreffende gemeenteraad of gemeenteraden en de
      vaststelling van de jaarrekening na instemming van de desbetreffende gemeenteraad of gemeenteraden,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel51
  - number: 51.6.e
    text: de wijze waarop de gemeenteraad of gemeenteraden toezicht op het bestuur uitoefenen,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel51
  - number: 51.6.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel51
  - number: 51.6.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel51
  - number: 51.6.h
    text: de bevoegdheid de stichting te ontbinden,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel51
  - number: '51.7'
    text: |-
      De statuten van de stichting kunnen slechts worden gewijzigd na instemming van de desbetreffende gemeenteraad of
      gemeenteraden.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel51
  - number: '51.8'
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad of gemeenteraden verslag uit over de werkzaamheden, waarbij in
      ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel51
  - number: '51.9'
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel51
  - number: '51.10'
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      gemeenteraad of gemeenteraden de maatregelen die zij nodig achten om de continuïteit van het onderwijsproces te
      waarborgen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel51
  - number: '51.11'
    text: |-
      De gemeenteraad of gemeenteraden zijn in geval van ernstige taakverwaarlozing door het bestuur of functioneren in
      strijd met de wet bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de stichting te ontbinden.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel51
  - number: '52.1'
    text: |-
      De rechtspersoon die een openbare school in stand houdt, kan de instandhouding van die school overdragen aan
      een andere rechtspersoon die tot instandhouding van een openbare school bevoegd is. De overdracht geschiedt bij
      notariële akte.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel52
  - number: '52.2'
    text: |-
      Bij deze akte verbindt de overdragende rechtspersoon zich tevens de rechten ten aanzien van gebouwen en
      terreinen alsmede de roerende zaken over te dragen. Deze akte geldt tevens als akte van levering als bedoeld in
      [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: '52.3'
    text: |-
      In de akte wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en
      onder dezelfde voorwaarden als vermeld in de akte van aanstelling, aan de school aanstelt met ingang van de datum
      van overdracht.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel52
  - number: '52.4'
    text: |-
      Door overdracht met inachtneming van de voorgaande leden, treedt de verkrijgende rechtspersoon in alle uit de wet
      voortvloeiende rechten en verplichtingen die zijn rechtsvoorganger bezit in zijn hoedanigheid van bevoegd gezag,
      onverminderd hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel52
  - number: '53'
    text: |-
      Het bevoegd gezag stelt de leerlingen in de gelegenheid op de school, binnen de schooltijden, godsdienstonderwijs
      of levensbeschouwelijk vormingsonderwijs te ontvangen. Van de tijd daaraan te besteden, worden ten hoogste 120 uren
      per schooljaar meegeteld voor het aantal uren onderwijs dat de leerlingen krachtens [artikel 11, vierde lid][ref1],
      ten minste moeten ontvangen. Voor de leerlingen die dit onderwijs niet volgen, voorziet het bevoegd gezag in andere
      onderwijsactiviteiten op de school.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel11
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '11'
        paragraaf: '1'
        afdeling: '1'
  - number: '54'
    text: |-
      Godsdienstonderwijs wordt gegeven door leraren daartoe aangewezen door kerkelijke gemeenten, plaatselijke kerken,
      of rechtspersonen met volledige rechtsbevoegdheid die zich blijkens hun statuten het geven van godsdienstonderwijs
      ten doel stellen. Levensbeschouwelijk vormingsonderwijs wordt gegeven door leraren daartoe aangewezen door
      volledige rechtsbevoegdheid bezittende organisaties op geestelijke grondslag.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel54
  - number: '55.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor het personeel bedoeld in [artikel 32][ref1],
      voorschriften vastgesteld omtrent aanstelling, schorsing, ontslag en disciplinaire maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel32
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '32'
        paragraaf: '2'
        afdeling: '1'
  - number: '55.2'
    text: |-
      In afwijking van het bepaalde bij of krachtens het eerste lid zijn gedeputeerde staten van de desbetreffende
      provincie bevoegd de disciplinaire maatregelen of de schorsing op te leggen dan wel het ontslag te verlenen, indien
      het betreft een directeur, een adjunct-directeur of een leraar van een openbare school en deze tevens lid is van de
      raad van de gemeente die de school in stand houdt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel55
  - number: '56.1'
    text: |-
      Ieder personeelslid is in het bezit van een door het bevoegd gezag getekende akte van aanstelling. De akte van
      aanstelling bevat in elk geval:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel56
  - number: 56.1.a
    text: de naam en het adres van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel56
  - number: 56.1.b
    text: de naam, de voornamen en de geboortedatum van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel56
  - number: 56.1.c
    text: de datum van ingang van de aanstelling;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel56
  - number: 56.1.d
    text: de functie waarin de betrokkene wordt aangesteld;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel56
  - number: 56.1.e
    text: de omvang van de betrekking;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel56
  - number: 56.1.f
    text: |-
      de bepaling of de aanstelling in vaste of in tijdelijke dienst geschiedt en in het laatste geval de gronden voor de
      tijdelijkheid en de duur van de aanstelling;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel56
  - number: 56.1.g
    text: de op de dag van zijn aanstelling van toepassing zijnde schaal en het salarisnummer;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel56
  - number: 56.1.h
    text: de bepaling dat de betrokkene werkzaam zal zijn in algemene dienst van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel56
  - number: 56.1.i
    text: |-
      voor de personeelsleden die bij de uitoefening van hun functie kennis nemen van persoonlijke gegevens van
      leerlingen, voorschriften omtrent geheimhouding daarvan, voor zover een geheimhoudingsplicht niet reeds uit anderen
      hoofde is verzekerd.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel56
  - number: '56.2'
    text: |-
      Het bevoegd gezag draagt zorg dat afschriften van de akten van bekwaamheid, van de verklaringen omtrent het gedrag,
      alsmede van de akten van aanstelling van het aan de school verbonden personeel worden bewaard.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel56
  - number: '56.3'
    text: De aanstelling van de adjunct-directeur en de leraren geschiedt, de directeur gehoord.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel56
  - number: '56.4'
    text: |-
      Het eerste lid, aanhef en onder i, alsmede het tweede en derde lid, zijn van overeenkomstige toepassing op
      personeel dat is tewerkgesteld zonder aanstelling.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel56
  - number: '57'
    text: |-
      Een bijzondere school wordt in stand gehouden door een rechtspersoon met volledige rechtsbevoegdheid die zich
      blijkens de statuten of reglementen het geven van onderwijs ten doel stelt zonder daarbij het maken van winst te
      beogen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel57
  - number: '58.1'
    text: |-
      De rechtspersoon die de school in stand houdt, kan de instandhouding van de school overdragen aan een andere
      rechtspersoon die voldoet aan [artikel 57][ref1]. De overdracht geschiedt bij notariële akte.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel57
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '57'
        afdeling: '3'
  - number: '58.2'
    text: |-
      Bij deze akte verbindt de overdragende rechtspersoon zich tevens de rechten ten aanzien van gebouwen en
      terreinen, alsmede de roerende zaken over te dragen. Deze akte geldt tevens als akte van levering bedoeld in
      [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: '58.3'
    text: |-
      In de akte wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en
      onder dezelfde voorwaarden als vermeld in de akte van benoeming, benoemt met ingang van de datum van overdracht.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel58
  - number: '58.4'
    text: |-
      Door de overdracht met inachtneming van de voorgaande leden, treedt de verkrijgende rechtspersoon in alle uit de
      wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de school, onverminderd
      hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel58
  - number: '58.5'
    text: |-
      Bij een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref1] van een rechtspersoon
      die een school in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande splitsende rechtspersoon de
      school in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van de school overgaat. In het
      laatste geval zijn het tweede tot en met vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
  - number: '59'
    text: |-
      Onverminderd de artikelen 13 tot en met 16 kunnen de onderwijsactiviteiten godsdienstonderwijs of
      levensbeschouwelijk vormingsonderwijs omvatten. Van de tijd daaraan te besteden, worden ten hoogste 120 uren per
      schooljaar meegeteld voor het aantal uren onderwijs dat de leerlingen krachtens [artikel 11, vierde lid][ref1],
      ten minste moeten ontvangen. Het geven van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs kan worden
      opgedragen aan een niet aan de school verbonden leraar.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel11
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '11'
        paragraaf: '1'
        afdeling: '1'
  - number: '60.1'
    text: |-
      Indien binnen redelijke afstand van de woning van de leerling geen gelegenheid bestaat tot het volgen van
      openbaar onderwijs, mag de toelating tot de school niet worden geweigerd op grond van godsdienstige gezindheid
      of levensbeschouwing. Het voorgaande is niet van toepassing, indien de school uitsluitend bestemd is voor interne
      leerlingen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel60
  - number: '60.2'
    text: |-
      Leerlingen die ingevolge het eerste lid zijn toegelaten, kunnen niet worden verplicht godsdienstonderwijs of
      levensbeschouwelijk vormingsonderwijs te volgen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel60
  - number: '61.1'
    text: |-
      Indien het bevoegd gezag van een bijzondere school op grond van artikel 36, derde lid, een student de toegang
      weigert, deelt het bevoegd gezag deze beslissing, schriftelijk en met redenen omkleed, mede door toezending of
      uitreiking aan de student, onverminderd het bepaalde in dat artikellid.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel61
  - number: '61.2'
    text: |-
      Indien het bevoegd gezag van een bijzondere school hetzij weigert een leerling toe te laten, hetzij een leerling
      verwijdert, op grond van [artikel 40, eerste en vijfde lid][ref1], deelt het deze beslissing, schriftelijk en
      met redenen omkleed, mede door toezending of uitreiking aan de ouders. Daarbij wordt tevens de inhoud van het
      bepaalde in het derde lid, eerste volzin, vermeld. Voordat het bevoegd gezag van een bijzondere school op grond
      van [artikel 40, eerste en vijfde lid][ref2], beslist tot verwijdering van een leerling, hoort het de ouders van de
      leerling, onverminderd het [vijfde lid van dat artikel][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel40
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '40'
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '40'
        paragraaf: '3'
        afdeling: '1'
  - number: '61.3'
    text: |-
      Binnen 6 weken na de mededeling, bedoeld in het tweede lid, kunnen de ouders bij het bevoegd gezag schriftelijk hun
      bezwaren kenbaar maken tegen de beslissing. Het bevoegd gezag beslist binnen 4 weken na ontvangst van de bezwaren.
      Alvorens te beslissen hoort het bevoegd gezag de ouders.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel61
  - number: '61.4'
    text: 'Het bevoegd gezag beslist niet eerder op de bezwaren dan:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel61
  - number: 61.4.a
    text: na overleg met de inspecteur en desgewenst met andere deskundigen,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel61
  - number: 61.4.b
    text: nadat de ouders kennis hebben kunnen nemen van de op de beslissing betrekking hebbende adviezen of rapporten, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel61
  - number: 61.4.c
    text: de ouders opnieuw zijn gehoord.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel61
  - number: '62.1'
    text: |-
      De akte van benoeming bevat ten minste bepalingen van gelijke inhoud als zijn vastgesteld bij of krachtens de
      algemene maatregel van bestuur, bedoeld in [artikel 33, tweede lid, onder a en b][ref1], voor zover deze geen
      rechtstreekse aanspraak op het Rijk geven.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel33
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '33'
        paragraaf: '2'
        afdeling: '1'
  - number: '62.2'
    text: |-
      Ieder personeelslid is in het bezit van een door het bevoegd gezag en hemzelf getekende akte van benoeming. De akte
      van benoeming bevat in elk geval:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel62
  - number: 62.2.a
    text: de naam en het adres van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel62
  - number: 62.2.b
    text: de naam, de voornamen en de geboortedatum van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel62
  - number: 62.2.c
    text: de datum van ingang van de benoeming;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel62
  - number: 62.2.d
    text: de functie waarin de betrokkene wordt benoemd;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel62
  - number: 62.2.e
    text: de omvang van de betrekking;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel62
  - number: 62.2.f
    text: |-
      de bepaling of de benoeming in vaste of in tijdelijke dienst geschiedt en in het laatste geval de gronden voor de
      tijdelijkheid en de duur van de benoeming;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel62
  - number: 62.2.g
    text: de op de dag van zijn benoeming van toepassing zijnde schaal en het salarisnummer;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel62
  - number: 62.2.h
    text: de bepaling dat de betrokkene werkzaam zal zijn in algemene dienst van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel62
  - number: 62.2.i
    text: |-
      voor personeelsleden die bij de uitoefening van hun functie kennis nemen van persoonlijke gegevens van leerlingen,
      voorschriften omtrent geheimhouding daarvan, voor zover een geheimhoudingsplicht niet uit anderen hoofde is
      verzekerd.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel62
  - number: '62.3'
    text: De akte van benoeming bevat bepalingen inzake gronden voor schorsing, ontslag en disciplinaire maatregelen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel62
  - number: '62.4'
    text: |-
      Het bevoegd gezag draagt zorg dat afschriften van de akten van bekwaamheid, van de verklaringen omtrent het gedrag,
      alsmede van de akten van benoeming van het aan de school verbonden personeel worden bewaard.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel62
  - number: '62.5'
    text: |-
      Het eerste lid, aanhef en onder i, en het vierde lid, zijn van overeenkomstige toepassing op personeel dat is
      tewerkgesteld zonder benoeming.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel62
  - number: '63.1'
    text: |-
      Het bevoegd gezag is aangesloten bij een commissie van beroep. Het personeel kan bij die commissie beroep instellen
      tegen een beslissing van het bevoegd gezag inhoudende:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel63
  - number: 63.1.a
    text: een disciplinaire maatregel;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel63
  - number: 63.1.b
    text: schorsing;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel63
  - number: 63.1.c
    text: het direct of indirect onthouden van promotie;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel63
  - number: 63.1.d
    text: het verminderen van de omvang van de betrekking;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel63
  - number: 63.1.e
    text: ontslag anders dan op eigen verzoek, voordat de pensioengerechtigde leeftijd is bereikt;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel63
  - number: 63.1.f
    text: |-
      de beslissing van het bevoegd gezag ten aanzien van een personeelslid op basis waarvan op termijn vermindering van
      diens betrekkingsomvang kan plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel63
  - number: 63.1.g
    text: de beëindiging van een verlengd tijdelijk dienstverband;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel63
  - number: 63.1.h
    text: |-
      de aanwijzing als personeelslid boven de reguliere formatie voortvloeiend uit een algemeen verbindend voorschrift
      welke aanwijzing op termijn kan leiden tot ontslag, vermindering van de betrekkingsomvang of beëindiging van een
      verlengd tijdelijk dienstverband;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel63
  - number: 63.1.i
    text: de aanwijzing van een andere school of andere scholen waaraan een personeelslid werkzaamheden zal verrichten.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel63
  - number: '63.2'
    text: |-
      Een beslissing als bedoeld in het vorige lid, aanhef, wordt schriftelijk aan de betrokkene medegedeeld. Daarbij
      wordt tevens vermeld de beroepstermijn en het adres van de commissie waar het beroep kan worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel63
  - number: '63.3'
    text: Het bevoegd gezag onderwerpt zich aan de uitspraak van de commissie.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel63
  - number: '64.1'
    text: |-
      Het beroep bedoeld in [artikel 63][ref1], wordt schriftelijk ingesteld binnen 6 weken, nadat de beslissing aan
      betrokkene is medegedeeld. Bij overschrijding van deze termijn ten gevolge van omstandigheden die de betrokkene
      niet kunnen worden verweten, laat de commissie niet-ontvankelijkverklaring op die grond achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel63
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '63'
        afdeling: '3'
  - number: '64.2'
    text: |-
      Tijdens de behandeling door de commissie van beroep loopt geen verjaring met betrekking tot rechtsvorderingen ter
      zake van beslissingen die aan het oordeel van de commissie zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel64
  - number: '65.1'
    text: |-
      Een commissie van beroep strekt haar werkzaamheden uit over ten minste 50 bijzondere scholen. Onze minister kan dit
      aantal lager stellen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel65
  - number: '65.2'
    text: |-
      Tot scholen bedoeld in het eerste lid, kunnen ook scholen voor basisonderwijs en scholen voor voortgezet onderwijs
      behoren.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel65
  - number: '65.3'
    text: |-
      De commissie bestaat uit 5 leden en 5 plaatsvervangende leden, waarvan 2 leden en 2 plaatsvervangende leden worden
      gekozen door het bevoegd gezag en 2 leden en 2 plaatsvervangende leden door het personeel van de aangesloten
      scholen. Deze 4 leden kiezen het vijfde lid, tevens voorzitter, en diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel65
  - number: '65.4'
    text: |-
      De leden en plaatsvervangende leden mogen niet behoren tot het bevoegd gezag of het personeel van een aangesloten
      school of tot de inspectie van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel65
  - number: '65.5'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de samenstelling en de werkwijze van
      de commissie van beroep.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel65
  - number: '67.1'
    text: |-
      De gemeenteraad is bevoegd uitsluitend in het belang van een doelmatige spreiding van de leerlingen over de
      openbare scholen, het grondgebied van de gemeente in schoolwijken te verdelen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel67
  - number: '67.2'
    text: |-
      Een besluit als bedoeld in het eerste lid, geldt voor ten minste 3 schooljaren, met dien verstande dat tussentijdse
      wijziging mogelijk is in geval van veranderingen in het scholenbestand. Burgemeester en wethouders zenden binnen 4
      weken nadat het besluit is genomen afschrift daarvan aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel67
  - number: '67.3'
    text: |-
      De toelating tot een openbare school geschiedt in overeenstemming met de vastgestelde schoolwijken, tenzij door
      de ouders van de leerling, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, door de leerling,
      schriftelijk aan het bevoegd gezag te kennen wordt gegeven dat toelating in een andere schoolwijk wordt gewenst.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel67
  - number: '68.1'
    text: |-
      Vertegenwoordigers van het speciaal onderwijs en het basisonderwijs kunnen ten behoeve van de scholen die zij
      vertegenwoordigen een overlegorgaan oprichten met het doel de samenwerking tussen die scholen te bevorderen ten
      aanzien van de toelating van leerlingen en de inrichting van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel68
  - number: '68.2'
    text: |-
      Met betrekking tot het voortgezet speciaal onderwijs als bedoeld in [artikel 2][ref1] en het voortgezet onderwijs
      is het eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '68.3'
    text: |-
      Aan de vertegenwoordiging van de aan het overleg deelnemende scholen zal in ieder geval een vertegenwoordiging van
      de ouders en van de leraren deelnemen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel68
  - number: '69.1'
    text: Op het personeel van een rechtspersoon met volledige rechtsbevoegdheid die
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel69
  - number: 69.1.a
    text: |-
      uitsluitend wordt bestuurd door een bevoegd gezag al dan niet met een of meer andere bevoegde gezagsorganen als
      bedoeld in deze wet, de [Wet op het primair onderwijs][ref1] of de [Wet op het voortgezet onderwijs][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0002399
  - number: 69.1.b
    text: |-
      zich blijkens de statuten dan wel de gemeenschappelijke regeling, bedoeld in de
      [Wet gemeenschappelijke regelingen][ref1], uitsluitend ten doel stelt om ten behoeve van scholen en andere
      onderwijsinstellingen die uit 's Rijks kas worden bekostigd, werkzaamheden te verrichten ter verzekering van
      de goede gang van het onderwijs met uitzondering van het leiden van de school, het geven van onderwijs en het
      verrichten van werkzaamheden op het terrein van de schoolbegeleiding als bedoeld in [artikel 165][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003740
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel165
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003740
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '165'
        afdeling: '11'
  - number: 69.1.c
    text: niet het maken van winst beoogt,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel69
  - number: 69.1.d
    text: |-
      wordt gefinancierd met behulp van bijdragen van de bevoegde gezagsorganen waarvoor diensten worden verricht,
      waaronder begrepen de bekostiging voor zorgvoorzieningen, bedoeld in [artikel 120, vierde lid][ref1], of
      [artikel 132 van de Wet op het primair onderwijs][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel132
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '132'
  - number: 69.1.e
    text: Onze minister heeft medegedeeld als rechtspersoon in de zin van dit artikel werkzaam te willen zijn,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel69
  - number: '69.2'
    text: Onder bevoegd gezag en bevoegde gezagsorganen in het eerste lid onderdeel a wordt mede verstaan de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel69
  - number: '69.3'
    text: |-
      Het bestuur van de rechtspersoon is aangesloten bij een commissie van beroep als bedoeld in [artikel 63][ref1]. De
      leden en plaatsvervangende leden van een commissie van beroep mogen niet behoren tot het bestuur of het personeel
      van de rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel63
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '63'
        afdeling: '3'
  - number: '69.4'
    text: |-
      De in het eerste lid onder a bedoelde bevoegde gezagsorganen delen Onze minister mede dat zij het bestuur vormen
      van een rechtspersoon in de zin van dit artikel. Voorts verschaffen zij Onze minister en de door hem aangewezen
      personen desgevraagd alle inlichtingen omtrent de rechtspersoon en zijn activiteiten. De in het eerste lid
      onder a bedoelde bevoegde gezagsorganen kunnen Onze minister mededelen dat zij erin toestemmen dat de gevraagde
      inlichtingen rechtstreeks door het bestuur van de rechtspersoon zelf aan Onze minister en de door hem aangewezen
      personen worden verschaft.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel69
  - number: '69.5'
    text: |-
      De gemeente en het bevoegd gezag dat deel uitmaakt van het bestuur van de rechtspersoon, zijn verplicht op de
      naleving van de in de voorgaande leden genoemde voorschriften toe te zien.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel69
  - number: '69.6'
    text: |-
      De [artikelen 37][ref1], [38][ref2], [63][ref3] en [64][ref4] zijn van overeenkomstige toepassing ten aanzien van
      het personeel van de rechtspersoon met dien verstande dat een geschillencommissie haar werkzaamheden uitstrekt over
      ten minste vijf rechtspersonen als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel63
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel64
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '37'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '38'
        paragraaf: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '63'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: '64'
        afdeling: '3'
  - number: '70.1'
    text: |-
      De openbare en de bijzondere scholen worden door het Rijk bekostigd volgens de bepalingen van deze titel met
      uitzondering van [afdeling 3][ref1]. Geen bekostiging vindt plaats indien groepen van leerlingen van verschillende
      scholen al dan niet van hetzelfde bevoegd gezag gezamenlijk onderwijs ontvangen. De bedragen die de gemeente
      krachtens deze wet in aanvulling op de rijksbekostiging verstrekt, blijven ten laste van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Afdeling3
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0003549
        afdeling: '3'
  - number: '70.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven ter uitvoering van het eerste lid. Deze
      algemene maatregel van bestuur bevat in elk geval een regeling omtrent de termijnen binnen welke besluiten moeten
      worden genomen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel70
  - number: '70.3'
    text: 'De algemene maatregel van bestuur bedoeld in het tweede lid, bevat tevens:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel70
  - number: 70.3.a
    text: |-
      een regeling omtrent de betaling van de bedragen van de bekostiging voor de materiële voorzieningen ten behoeve van
      de instandhouding voortvloeiende uit het gebruik door een school van voorzieningen die voor meer dan een school of
      voor andere doeleinden zijn bestemd;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel70
  - number: 70.3.b
    text: |-
      een financiële regeling tussen het Rijk en de bevoegde gezagsorganen die personeel in dienst hebben dat niet door
      het Rijk wordt bekostigd ter zake van een korting op de bekostiging ter compensatie van de kosten van de voor dat
      personeel geldende rechtspositionele voorzieningen, voor zover deze ten laste van 's Rijks kas komen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel70
  - number: '70.4'
    text: |-
      De algemene maatregel van bestuur bedoeld in het tweede lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure
      bedoeld in de eerste 3 volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel70
  - number: '70.5'
    text: |-
      [Artikel 4:32 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de bekostiging van scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '71'
    text: |-
      Onze minister kan onder nader te stellen voorwaarden aanvullende middelen ter beschikking stellen die niet strekken
      tot bekostiging van het onderwijs, bedoeld in deze wet, en de schoolbegeleiding ten behoeve daarvan, maar die
      direct of indirect dienstig zijn voor de uitvoering van het onderwijs of voor verhoging van de mogelijkheid tot
      deelname aan het onderwijs. Voor zover toepassing van de eerste volzin het verstrekken van subsidie betreft, zijn
      de [artikelen 4 tot en met 19 van de Wet overige OCenW-subsidies][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '4'
  - number: 71a.1
    text: |-
      Bij algemene maatregel van bestuur worden regels gegeven met betrekking tot de bekostiging van een regionaal
      expertisecentrum, welke regels per cluster als bedoeld in [artikel 2, vierde lid][ref1], verschillend kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 71a.2
    text: |-
      Grondslag voor de bekostiging van een regionaal expertisecentrum is naast een vaste voet, het aantal scholen
      dat deelneemt aan dat regionaal expertisecentrum en het aantal leerlingen aan wie in de periode van 12 maanden
      direct voorafgaand aan 1 oktober van het voorafgaande schooljaar op grond van [artikel 28c, eerste lid][ref1],
      een bevestigende beoordeling is gegeven, verhoogd met een bij algemene maatregel van bestuur vastgesteld
      percentage, dat afhankelijk is van het cluster, bedoeld in [artikel 2, vierde lid][ref2], waartoe het regionaal
      expertisecentrum behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28c
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 71a.3
    text: |-
      Op de bekostiging van het regionaal expertisecentrum worden de uitgaven in mindering gebracht die Onze
      minister doet voor een ten behoeve van dat regionaal expertisecentrum ingestelde ministeriële commissie voor de
      indicatiestelling als bedoeld in [artikel 28d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28d
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28d
        paragraaf: '1'
        afdeling: '1'
  - number: 71b.1
    text: |-
      In een scholengemeenschap zijn tot één school verenigd scholen van de soort die tot hetzelfde cluster of dezelfde
      clusters, bedoeld in [artikel 2, vierde lid onder b, c en d][ref1], behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 71b.2
    text: |-
      De bij of krachtens deze wet gegeven voorschriften die gelden voor de onderwijssoort waartoe een deel van de
      scholengemeenschap behoort, zijn van overeenkomstige toepassing op dat deel van de scholengemeenschap.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel71b
  - number: 71b.3
    text: |-
      De [artikelen 75 tot en met 88][ref1] zijn niet van toepassing indien twee of meer scholen worden verenigd tot
      een scholengemeenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel75
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '75'
        afdeling: '2'
  - number: 71b.4
    text: |-
      De directeur, onderscheidenlijk de adjunct-directeur of adjunct-directeuren, kan slechts een van de directeuren
      onderscheidenlijk kunnen slechts een of meer van de adjunct-directeuren van de scholen zijn die tot de
      scholengemeenschap worden verenigd, tenzij geen van de betrokkenen de desbetreffende functie wenst te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel71b
  - number: 71c.1
    text: |-
      Het bevoegd gezag van een school, niet zijnde een instelling, die jaarlijks leerlingen ontvangt uit een
      residentiële instelling en die in aanmerking wenst te komen voor de bekostiging op grond van [artikel 112][ref1] en
      voor de bekostiging, bedoeld in [artikel 117, achtste lid][ref2], dient een verzoek daartoe in bij Onze minister.
      Onder een residentiële instelling wordt verstaan een instelling voor gehandicaptenzorg, jeugdhulpverlening of
      jeugdgezondheidszorg dan wel een justitiële jeugdinrichting, waarbij behandeling of opvang en onderwijs vanuit één
      plan noodzakelijk is vanwege de aard of de duur van de behandeling of opvang.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel71c
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '112'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
  - number: 71c.2
    text: |-
      Een verzoek als bedoeld in het eerste lid gaat vergezeld van een opgave van het aantal plaatsen ten behoeve
      waarvan vergoeding en formatie wordt gewenst, het aantal leerlingen uit de residentiële instelling dat in de
      voorafgaande periode van 5 schooljaren per schooljaar op de school is ingeschreven, de duur van de inschrijving,
      het totale aantal plaatsen waarover de residentiële instelling beschikt, de naam en het adres van de residentiële
      instelling, de aard van de opvang die door de residentiële instelling wordt geboden en een afschrift van de
      samenwerkingsafspraken die tussen de school en de residentiële instelling zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel71c
  - number: 71c.3
    text: |-
      Indien het verzoek, bedoeld in het eerste lid, is gedaan voor 1 februari, beslist Onze minister voor 1 augustus
      daaropvolgend welk aantal plaatsen in aanmerking wordt genomen voor de toekenning van de bekostiging, bedoeld in
      [artikel 117, achtste lid][ref1]. Een plaats als bedoeld in de eerste volzin wordt voor de vergoeding, bedoeld in
      [artikel 112][ref2], gelijkgesteld aan een leerling. Bij de toekenning, bedoeld in de eerste en de tweede volzin,
      bepaalt Onze minister tevens het aantal schooljaren waarvoor de toekenning geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel112
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel71c
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '112'
        afdeling: '4'
  - number: '72'
    text: 'Een belanghebbende kan beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State tegen:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel72
  - number: 72.a
    text: |-
      een besluit of een van rechtswege verleende goedkeuring als bedoeld in de [afdelingen 2][ref1] en
      [8 van deze titel][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Afdeling8
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0003549
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
        afdeling: '8'
  - number: 72.b
    text: |-
      een besluit als bedoeld in [artikel 120, tweede lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel120
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '120'
        afdeling: '5'
  - number: 72.c
    text: |-
      een besluit als bedoeld in [artikel 129][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel129
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '129'
        paragraaf: '2'
        afdeling: '7'
  - number: '73.1'
    text: |-
      Voor de toepassing van deze titel zijn de voorschriften die betrekking hebben op bijzondere scholen, van
      overeenkomstige toepassing op openbare scholen die in stand worden gehouden door een stichting als bedoeld in
      [artikel 51][ref1] of een openbare rechtspersoon als bedoeld in [artikel 50][ref2], tenzij het tegendeel blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel50
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '51'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '50'
        afdeling: '2'
  - number: '73.2'
    text: |-
      Indien een openbare school in stand wordt gehouden door een stichting of een openbare rechtspersoon, wordt deze
      aangemerkt als een door de gemeente in stand gehouden openbare school voor de toepassing van [afdeling 2][ref1]
      en [afdeling 8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Afdeling8
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0003549
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
        afdeling: '8'
  - number: 73a.1
    text: |-
      Onze minister kan op aanvraag van een bevoegd gezag besluiten dat, met het oog op de ontwikkeling door scholen van
      instrumenten voor planning en beheer, de [artikelen 120, tweede en derde lid][ref1], [124][ref2], [143][ref3] en
      [144][ref4] niet van toepassing zijn op de bekostiging van de scholen van dat bevoegd gezag. Voor een dergelijk
      besluit komen ten hoogste tien bevoegde gezagsorganen in aanmerking. Onze minister kan een tijdstip vaststellen
      voor welke de aanvragen moeten worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel124
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel143
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel144
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel73a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '120'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '124'
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '143'
        paragraaf: '6'
