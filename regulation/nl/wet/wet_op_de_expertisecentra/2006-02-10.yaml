        afdeling: '4'
  - number: '139.4'
    text: |-
      Voor de vaststelling bedoeld in [artikel 138, eerste en zevende lid][ref1], en [artikel 139, eerste lid][ref2],
      worden met betrekking tot een school voor speciaal en voortgezet speciaal onderwijs de bedragen die voor een
      zodanige school zijn uitgegeven dan wel ontvangen, toegerekend aan het speciaal onderwijs, onderscheidenlijk
      het voortgezet speciaal onderwijs, naar rato van het aantal leerlingen dat in het desbetreffende kalenderjaar in
      aanmerking kwam voor het volgen van speciaal onderwijs, onderscheidenlijk voortgezet speciaal onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel169
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel139
    references:
