        afdeling: '7'
  - number: 73a.2
    text: |-
      Onze minister bepaalt bij zijn besluit welke regelen en voorwaarden voor de bekostiging zullen gelden in plaats
      van het bepaalde bij of krachtens de artikelen, genoemd in het eerste lid, alsmede de wijze van bekostiging. Onze
      minister kan aan het besluit voorschriften verbinden omtrent het afleggen van rekening en verantwoording van het
      financieel beheer, alsmede, zo nodig in afwijking van het bepaalde krachtens [artikel 168, tweede volzin][ref1],
      omtrent de inrichting van de boekhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel168
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel73a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '168'
        afdeling: '11'
  - number: 73a.3
    text: |-
      Onze minister stelt, na overleg met de aanvrager, een ontwerp op van het besluit en zendt dit ontwerp aan de
      aanvrager. Indien de aanvrager zijn aanvraag niet binnen twee weken na verzending van het ontwerp van het besluit
      door Onze minister heeft ingetrokken, besluit Onze minister overeenkomstig het ontwerp.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel73a
  - number: 73a.4
    text: |-
      Voor zover nodig neemt Onze minister, na overleg met de gemeente of gemeenten die het aangaat, een besluit omtrent
      toepassing van de overschrijdingsregeling, bedoeld in de [artikelen 136 tot en met 142][ref1], door de gemeente of
      gemeenten waar een of meer scholen waarop een besluit als bedoeld in het eerste lid van toepassing is, gevestigd
      zijn. Onze minister kan daarbij afwijken van het bepaalde bij of krachtens de [artikelen 136 tot en met 142][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel136
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel136
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel73a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '136'
        paragraaf: '5'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '136'
        paragraaf: '5'
        afdeling: '7'
  - number: 73a.5
    text: Het besluit, bedoeld in het eerste lid, heeft een geldigheidsduur van ten hoogste vier jaren.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel73a
  - number: 73a.6
    text: |-
      Indien voor het einde van de geldigheidsduur van het besluit een voorstel van wet tot invoering van
      lumpsumbekostiging voor de personeels- en exploitatiekosten van scholen als bedoeld in deze wet bij de Staten-
      Generaal wordt ingediend, kan de minister het besluit, bedoeld in het eerste lid, na overleg met het bevoegd gezag,
      zodanig aanpassen en in afwijking van het vijfde lid verlengen, dat een goede overgang wordt gewaarborgd naar het
      bekostigingssysteem dat geldt op het moment waarop de periode eindigt waarop het besluit betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel73a
  - number: '74'
    text: |-
      In deze titel wordt onder «school» verstaan een school of afdeling als bedoeld in [artikel 8][ref1], tenzij het
      tegendeel blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel8
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '8'
        paragraaf: '1'
        afdeling: '1'
  - number: '75.1'
    text: |-
      De [artikelen 77 tot en met 88][ref1] zijn tot een bij de wet te bepalen datum niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel77
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '77'
        afdeling: '2'
  - number: '75.2'
    text: |-
      Tot een bij de wet te bepalen datum kan Onze minister op verzoek van het bevoegd gezag, onder door hem te stellen
      voorwaarden, een school voor bekostiging in aanmerking brengen indien de school is gelegen in een gebied waarin
      sprake is van een uitzonderlijke bevolkingstoename, indien sprake is van een verandering van de plaats van
      vestiging van een reeds bekostigde school, indien sprake is van omzetting van een bekostigde bijzondere school
      in een gelijksoortige openbare school of omgekeerd, indien sprake is van omzetting van een bekostigde bijzondere
      school in een gelijksoortige bijzondere school van een andere richting, dan wel indien sprake is van uitbreiding
      van het onderwijs aan een school met onderwijs van een of meer andere richtingen. Het verzoek is met redenen
      omkleed en gaat vergezeld van de gegevens, genoemd in [artikel 81, tweede lid][ref1]. Onze minister willigt het
      verzoek slechts in indien de school bij toepassing van [artikel 83, eerste en derde lid][ref2], op grond van het
      eerste lid van dat artikel in een door provinciale staten of Onze minister vast te stellen plan van nieuwe scholen
      zou worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel83
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '81'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '83'
        afdeling: '2'
  - number: '75.3'
    text: |-
      Een school die is opgenomen in een door Onze minister goedgekeurd of vastgesteld plan van nieuwe scholen voor de
      jaren 1991, 1992, 1993 en 1994 komt voor bekostiging in aanmerking indien de school in dat plan is opgenomen met
      als jaar van aanvang van de bekostiging 1991 en het onderwijs voor 1 januari 1992 een aanvang heeft genomen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel75
  - number: '76'
    text: |-
      Indien beroep is ingesteld in verband met de plannen van nieuwe scholen voor de jaren 1986 tot en met
      1994 en op grond van de [artikelen 79, derde lid][ref1], [80, derde lid][ref2], [83, vijfde lid][ref3],
      [84, achtste lid][ref4], en [86, vierde lid][ref5], de uitspraak zou hebben geleid tot opneming van een school in
      het eerstvolgende plan, brengt Onze Minister deze school voor bekostiging in aanmerking in het eerste jaar van de
      planperiode waarop dat plan betrekking zou hebben gehad. Zodra de bekostiging van een school een aanvang kan nemen,
      beslist Onze Minister bij beschikking met ingang van welk tijdstip dit kan geschieden. De bekostiging kan na een
      beschikking van Onze minister als bedoeld in de vorige volzin, slechts aanvangen per 1 augustus van een schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel83
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel84
      [ref5]: https://wetten.overheid.nl/BWBR0003549#Artikel86
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '79'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '80'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '83'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: '84'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0003549
        artikel: '86'
        afdeling: '2'
  - number: 76a.1
    text: |-
      Indien een bevoegd gezag van een school, niet zijnde een instelling, wenst over te gaan tot het inrichten van een
      nevenvestiging of tot het toelaten van leerlingen, die door een commissie voor de indicatiestelling toelaatbaar
      zijn verklaard tot een andere onderwijssoort binnen het regionaal expertisecentrum dan de onderwijssoort die
      door de school wordt verzorgd, dient het bevoegd gezag voor 1 februari een daarop betrekking hebbend verzoek tot
      opneming in het in het tweede lid bedoelde plan in bij het regionaal expertisecentrum.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel76a
  - number: 76a.2
    text: |-
      Voor 1 augustus daaropvolgend stelt het regionaal expertisecentrum op basis van de in het eerste lid bedoelde
      verzoeken een plan vast met betrekking tot de vestiging van nevenvestigingen en met betrekking tot het toelaten van
      leerlingen tot scholen van een andere onderwijssoort binnen het cluster, bedoeld in [artikel 2, vierde lid][ref1],
      dan waarvoor de leerlingen door een commissie voor de indicatiestelling toelaatbaar zijn verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 76a.3
    text: |-
      Het regionaal expertisecentrum neemt een verzoek slechts in het plan op, indien het daarover overeenstemming
      heeft bereikt met de bevoegde gezagsorganen die deelnemen aan het regionaal expertisecentrum, alle aangrenzende
      regionale expertisecentra van hetzelfde cluster en, voor zover het een nevenvestiging betreft, de gemeente waar die
      nevenvestiging zal worden gevestigd.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel76a
  - number: 76a.4
    text: |-
      Binnen 2 weken na de vaststelling van het plan, wordt het plan tezamen met de gegevens waaruit de in het derde lid
      bedoelde overeenstemming blijkt, ter goedkeuring aan Onze minister gezonden.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel76a
  - number: 76a.5
    text: |-
      Onze minister beslist voor 1 december daaropvolgend. Indien Onze minister de inrichting van een nevenvestiging
      goedkeurt, vangt de bekostiging van die nevenvestiging aan op 1 augustus volgend op de goedkeuring. Voor de
      bekostiging wordt de nevenvestiging aangemerkt als deel van de school die de nevenvestiging in stand houdt. Indien
      Onze minister de toelating goedkeurt van leerlingen die toelaatbaar zijn verklaard tot een andere onderwijssoort
      binnen het cluster, is die toelating mogelijk vanaf 1 augustus volgend op de goedkeuring.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel76a
  - number: 76a.6
    text: |-
      Bij algemene maatregel van bestuur wordt voor scholen waarbij, ingevolge een goedkeuring van Onze minister,
      leerlingen zijn ingeschreven die door een commissie voor de indicatiestelling toelaatbaar zijn verklaard tot een
      andere onderwijssoort binnen het cluster, bedoeld in [artikel 2, vierde lid][ref1], dan de onderwijssoort die door
      de school wordt verzorgd, de bekostiging met betrekking tot die leerlingen vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 76b.1
    text: |-
      Indien een bevoegd gezag van een instelling wenst over te gaan tot het inrichten van een nevenvestiging en het
      daarover overeenstemming heeft bereikt met de andere instellingen en de gemeente waar die nevenvestiging zal worden
      gevestigd, dient het bevoegd gezag voor 1 februari een daarop betrekking hebbend verzoek met de gegevens waaruit de
      bedoelde overeenstemming blijkt, in bij Onze minister.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel76b
  - number: 76b.2
    text: |-
      Onze minister beslist voor 1 december daaropvolgend. Indien Onze minister de inrichting van een nevenvestiging
      goedkeurt, vangt de bekostiging van die nevenvestiging aan op 1 augustus volgend op de goedkeuring. Voor de
      bekostiging wordt de nevenvestiging aangemerkt als deel van de instelling die de nevenvestiging in stand houdt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel76b
  - number: '77'
    text: |-
      De bekostiging van een school kan slechts een aanvang nemen, indien zij voorkomt op een plan van nieuwe scholen,
      vastgesteld volgens de bepalingen van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel77
  - number: '78.1'
    text: |-
      Provinciale staten stellen op voordracht van gedeputeerde staten, al dan niet in samenwerking met provinciale
      staten van een of meer andere provincies, jaarlijks voor 1 augustus een plan van nieuwe scholen in de provincie
      van vestiging vast voor de scholen voor slechthorende kinderen, voor lichamelijk gehandicapte kinderen, scholen
      voor langdurig zieke kinderen, scholen voor zeer moeilijk lerende kinderen, scholen voor zeer moeilijk opvoedbare
      kinderen en scholen voor meervoudig gehandicapte kinderen, die in de 4 kalenderjaren volgende op het jaar van
      vaststelling voor bekostiging uit de openbare kassen in aanmerking dienen te worden gebracht. Het plan heeft ten
      doel te komen tot een evenwichtig geheel van onderwijsvoorzieningen in de betrokken provincie. Het plan behoeft de
      goedkeuring van Onze minister.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel78
  - number: '78.2'
    text: |-
      Bij de vaststelling van het plan wordt uitgegaan van de verzoeken bedoeld in [artikel 81][ref1]. Tevens bezien
      provinciale staten bij de vaststelling van het plan of voldoende is voorzien in de behoefte aan openbaar
      onderwijs. Provinciale staten betrekken bij de vaststelling van het plan de opnamecapaciteit van de bestaande
      onderwijsvoorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel81
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '81'
        afdeling: '2'
  - number: '78.3'
    text: 'Het plan vermeldt van elke school of het betreft:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel78
  - number: 78.3.a
    text: een school voor speciaal onderwijs;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel78
  - number: 78.3.b
    text: een school voor voortgezet speciaal onderwijs;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel78
  - number: 78.3.c
    text: een school voor speciaal en voortgezet speciaal onderwijs;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel78
  - number: 78.3.d
    text: een afdeling.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel78
  - number: '78.4'
    text: |-
      Bij de goedkeuring van Onze minister van het plan treden voor de toepassing van
      [artikel 4:8 van de Algemene wet bestuursrecht][ref1] gedeputeerde staten in de plaats van het bevoegd gezag van de
      bijzondere scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '79.1'
    text: 'Behoudens het bepaalde in het tweede lid worden in elk plan de scholen uit het voorafgaande plan opgenomen die:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel79
  - number: 79.1.a
    text: nog niet voor bekostiging in aanmerking zijn gebracht;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel79
  - number: 79.1.b
    text: voor bekostiging in aanmerking zijn gebracht, maar waaraan het onderwijs nog niet is aangevangen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel79
  - number: '79.2'
    text: 'Uit het voorafgaande plan wordt een school niet opgenomen:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel79
  - number: 79.2.a
    text: indien de indiener van een verzoek heeft gevraagd de school te laten vervallen;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel79
  - number: 79.2.b
    text: |-
      indien aan een bijzondere school het onderwijs niet is aangevangen in het tweede jaar volgend op het jaar waarvoor
      de school het eerst voor bekostiging in aanmerking is gebracht, tenzij opneming in het plan op grond van de bij een
      nieuw verzoek overgelegde gegevens gerechtvaardigd is;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel79
  - number: 79.2.c
    text: |-
      indien zich naar het oordeel van provinciale staten omstandigheden hebben voorgedaan die bij de vaststelling van
      het plan niet bekend waren en die, waren zij wel bekend geweest, tot een ander besluit zouden hebben geleid.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel79
  - number: '79.3'
    text: |-
      Indien beroep is ingesteld tegen een besluit krachtens het tweede lid, onderdeel c, en de uitspraak strekt tot
      opneming van een school in het plan, nemen provinciale staten de school op in het eerste na de uitspraak vast te
      stellen plan.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel79
  - number: '80.1'
    text: 'De vaststelling van een plan blijft achterwege, indien:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel80
  - number: 80.1.a
    text: |-
      geen verzoeken om opneming in het plan zijn ingekomen of geen der ingekomen verzoeken voor inwilliging in
      aanmerking komt,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel80
  - number: 80.1.b
    text: |-
      provinciale staten besluiten dat vermeerdering van het aantal openbare scholen in de planperiode niet noodzakelijk
      is en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel80
  - number: 80.1.c
    text: geen scholen uit het voorafgaande plan voor opneming in het plan in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel80
  - number: '80.2'
    text: |-
      Het besluit bedoeld in het eerste lid onder b, behoeft de goedkeuring van Onze minister. Het wordt voor 1 augustus
      voorafgaande aan de betrokken planperiode aan Onze minister gezonden. [Artikel 84, derde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel84
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '84'
        afdeling: '2'
  - number: '80.3'
    text: |-
      Indien een besluit van de minister, houdende weigering van de goedkeuring onherroepelijk is geworden, nemen
      provinciale staten de openbare school op in het eerste na een zodanig besluit vast te stellen plan.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel80
  - number: '80.4'
    text: |-
      Aan de indieners van de niet ingewilligde verzoeken bedoeld in het eerste lid onder a, wordt voor 15 augustus
      voorafgaande aan de betrokken planperiode afschrift gezonden van het desbetreffende besluit.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel80
  - number: '81.1'
    text: |-
      Een verzoek om opneming in het plan wordt voor 1 februari van het jaar van de vaststelling van het plan, bij
      gedeputeerde staten ingediend door de gemeenteraad of door ouders, indien het een openbare school betreft, en door
      het bevoegd gezag, indien het een bijzondere school betreft.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel81
  - number: '81.2'
    text: 'Elk verzoek is met redenen omkleed en gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel81
  - number: 81.2.a
    text: een prognose van het te verwachten aantal leerlingen,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel81
  - number: 81.2.b
    text: de beschrijving van het voedingsgebied,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel81
  - number: 81.2.c
    text: de aanduiding van de plaats waar het onderwijs moet worden gegeven,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel81
  - number: 81.2.d
    text: de voorgestelde datum van ingang van de bekostiging en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel81
  - number: 81.2.e
    text: |-
      indien het een school voor meervoudig gehandicapte kinderen betreft, een opgave van de handicaps van de leerlingen
      waarvoor de school is bestemd.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel81
  - number: '82'
    text: |-
      Indien gedeputeerde staten van oordeel zijn dat een andere school dan gevraagd wordt, dan wel een andere plaats van
      vestiging meer in overeenstemming is met een evenwichtig geheel van onderwijsvoorzieningen in de provincie, treden
      zij, alvorens het plan ter vaststelling voor te dragen, in overleg met de aanvrager.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel82
  - number: '83.1'
    text: |-
      In het plan worden in elk geval opgenomen de scholen waarvan redelijkerwijs kan worden aangenomen dat zij, gelet
      op de belangstelling voor de desbetreffende schoolsoort en op het leerlingenverloop, blijkens statistische gegevens
      zullen worden bezocht door ten minste het volgende aantal leerlingen:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel83
  - number: 83.1.a
    text: 'de school voor speciaal onderwijs: 60 leerlingen;'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel83
  - number: 83.1.b
    text: 'de school voor voortgezet speciaal onderwijs: 42 leerlingen;'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel83
  - number: 83.1.c
    text: 'de school voor speciaal en voortgezet speciaal onderwijs: 81 leerlingen;'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel83
  - number: 83.1.d
    text: 'de afdeling: 15 leerlingen.'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel83
  - number: '83.2'
    text: |-
      In het plan kunnen scholen worden opgenomen waarvan redelijkerwijs kan worden aangenomen dat zij, gelet op de
      belangstelling voor de desbetreffende schoolsoort en op het leerlingenverloop, blijkens statistische gegevens
      zullen worden bezocht door ten minste het volgende aantal leerlingen:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel83
  - number: 83.2.a
    text: 'de school voor speciaal onderwijs: 40 leerlingen;'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel83
  - number: 83.2.b
    text: 'de school voor voortgezet speciaal onderwijs: 32 leerlingen;'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel83
  - number: 83.2.c
    text: 'de school voor speciaal en voortgezet speciaal onderwijs: 55 leerlingen;'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel83
  - number: 83.2.d
    text: 'de afdeling: 10 leerlingen.'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel83
  - number: '83.3'
    text: 'Bij de toepassing van het eerste en het tweede lid worden niet in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel83
  - number: 83.3.a
    text: |-
      de leerlingen voor wie binnen redelijke afstand plaatsruimte beschikbaar zal zijn op een gelijksoortige school waar
      het verlangde onderwijs wordt gegeven, tenzij deze school uitsluitend voor interne leerlingen is bestemd;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel83
  - number: 83.3.b
    text: |-
      leerlingen die in een andere provincie woonachtig zijn en bij de vaststelling van een plan in die provincie in
      aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel83
  - number: '83.4'
    text: |-
      Tegen een besluit van provinciale staten om een verzoek tot opneming in het plan van een bijzondere of een openbare
      school niet in te willigen, kan iedere belanghebbende administratief beroep instellen bij Onze minister.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel83
  - number: '83.5'
    text: |-
      Indien een onherroepelijk geworden beslissing in beroep of een uitspraak naar aanleiding van de beslissing in
      beroep, dan wel het naar aanleiding daarvan genomen besluit van Onze minister strekt tot het voor bekostiging
      in aanmerking brengen van de school, nemen provinciale staten de school op in het na de beslissing in beroep, de
      uitspraak of het besluit vast te stellen plan.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel83
  - number: '84.1'
    text: |-
      Aan het plan wordt toegevoegd een overzicht van de verzoeken die niet zijn ingewilligd en de motivering daarvan.
      Deze stukken worden door gedeputeerde staten binnen 2 weken na de vaststelling van het plan aan alle verzoekers
      gezonden met vermelding van de datum waarop het plan ter goedkeuring aan Onze minister is gezonden. Het plan wordt
      binnen 2 weken na de vaststelling voor een periode van 6 weken ter inzage gelegd op de provinciale griffie.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel84
  - number: '84.2'
    text: |-
      Binnen 2 weken na de vaststelling wordt het plan ter goedkeuring aan Onze minister gezonden.
      Het gaat vergezeld van de ingewilligde verzoeken en het overzicht bedoeld in het eerste lid.
      [Artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '84.3'
    text: |-
      Onze minister besluit met inachtneming van het beroepschrift bedoeld in [artikel 83, vierde lid][ref1], voor
      1 december van het jaar voorafgaande aan de planperiode. Afschrift van het besluit wordt binnen 2 weken aan
      provinciale staten gezonden. Indien Onze minister niet voor 1 december heeft besloten, wordt het plan geacht te
      zijn goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel83
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '83'
        afdeling: '2'
  - number: '84.4'
    text: 'Onze minister onthoudt zijn goedkeuring indien en voor zover:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel84
  - number: 84.4.a
    text: |-
      provinciale staten ten onrechte vermeerdering van het aantal openbare scholen in de planperiode niet noodzakelijk
      hebben geacht;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel84
  - number: 84.4.b
    text: |-
      opneming van een school in het plan niet noodzakelijk is omdat de opnamecapaciteit van de bestaande
      onderwijsvoorzieningen toereikend is dan wel niet in overeenstemming is met het tot stand brengen van een
      evenwichtig geheel van onderwijsvoorzieningen, tenzij redelijkerwijs kan worden aangenomen dat de school zal worden
      bezocht door het in [artikel 83, eerste lid][ref1], bedoelde aantal leerlingen;


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel83
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '83'
        afdeling: '2'
  - number: 84.4.c
    text: is uitgegaan van kennelijk ondeugdelijke prognoses;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel84
  - number: 84.4.d
    text: |-
      ten aanzien van een op het plan geplaatste school ten onrechte niet is bepaald dat zij voor bekostiging in
      aanmerking komt in het eerste jaar van de planperiode.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel84
  - number: '84.5'
    text: |-
      Bij onthouding van de goedkeuring op grond van het vierde lid onder a draagt Onze minister provinciale staten op
      alsnog een openbare school in het plan op te nemen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel84
  - number: '84.6'
    text: |-
      Bij onthouding van goedkeuring op grond van het vierde lid onder d draagt Onze minister provinciale staten op de
      bekostiging van de school in het eerste jaar van de planperiode in het plan op te nemen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel84
  - number: '84.7'
    text: |-
      Indien ten gevolge van een besluit op grond van het vierde lid een school uit het plan moet vervallen, deelt Onze
      minister dit besluit binnen 2 weken mee aan de indiener van het verzoek om opneming van de betrokken school in
      het plan.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel84
  - number: '84.8'
    text: |-
      Indien in beroep tegen het besluit van Onze Minister, bedoeld in het zevende lid, is bepaald dat de uitspraak van
      de rechter, dan wel het besluit naar aanleiding van die uitspraak, strekt tot opneming van een school in het plan,
      nemen provinciale staten de school op in het eerste na de uitspraak vast te stellen plan.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel84
  - number: '84.9'
    text: |-
      Zodra het plan onherroepelijk is vastgesteld, dragen gedeputeerde staten zorg voor bekendmaking in de Staatscourant
      en het provinciaal blad.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel84
  - number: '84.10'
    text: |-
      Zodra de bekostiging van een in het plan opgenomen school een aanvang kan nemen, besluit Onze minister bij
      beschikking, met ingang van welk tijdstip dit kan geschieden.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel84
  - number: '85'
    text: |-
      Indien een plan onherroepelijk is vastgesteld, is de gemeente verplicht tot stichting van de daarop geplaatste
      scholen voor openbaar onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel85
  - number: '86.1'
    text: |-
      Onze minister stelt jaarlijks voor 1 oktober een plan van nieuwe scholen vast voor de scholen voor dove kinderen,
      scholen voor kinderen met ernstige spraakmoeilijkheden, scholen verbonden aan pedologische instituten en
      instellingen, die in de 4 kalenderjaren volgende op het jaar van de vaststelling, voor bekostiging uit de openbare
      kassen in aanmerking zullen worden gebracht. Het plan heeft ten doel te komen tot een evenwichtig geheel van
      onderwijsvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel86
  - number: '86.2'
    text: |-
      Bij de vaststelling van het plan wordt uitgegaan van de verzoeken bedoeld in [artikel 81][ref1]. Tevens beziet
      Onze minister bij de vaststelling van het plan of voldoende is voorzien in de behoefte aan openbaar onderwijs.
      Onze minister betrekt bij de vaststelling van het plan de opnamecapaciteit van de bestaande onderwijsvoorzieningen.
      Indien verzoeken niet zijn ingewilligd, maakt Onze minister dit besluit binnen 2 weken bekend aan de indieners van
      het verzoek om opneming van de betrokken school in het plan.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel81
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '81'
        afdeling: '2'
  - number: '86.3'
    text: |-
      Voor de toepassing van dit artikel is het bepaalde in de [artikelen 78, derde lid][ref1], [79][ref2],
      [80, eerste en vierde lid][ref3], [81][ref4], [82][ref5] en [85][ref6], alsmede, behoudens voor instellingen, het
      bepaalde [artikel 83, eerste en tweede lid][ref7], en [artikel 83, derde lid onder a][ref8], van overeenkomstige
      toepassing, met dien verstande dat voor «provinciale staten» of «gedeputeerde staten» telkens wordt gelezen:
      Onze minister. In het plan worden in elk geval opgenomen de instellingen waarvan redelijkerwijs kan worden
      aangenomen dat zij, gelet op de belangstelling voor de desbetreffende schoolsoort en op het leerlingenverloop,
      blijkens statistische gegevens zullen worden bezocht door ten minste 300 leerlingen, dan wel dat zij blijkens
      statistische gegevens zullen worden bezocht door ten minste 200 leerlingen en begeleiding als bedoeld in
      [artikel 9, onder b][ref9], zullen verstrekken aan ten minste 100 leerlingen. In het plan kunnen instellingen
      worden opgenomen waarvan redelijkerwijs kan worden aangenomen dat zij, gelet op de belangstelling voor de
      desbetreffende schoolsoort en op het leerlingenverloop, blijkens statistische gegevens zullen worden bezocht door
      ten minste 200 leerlingen. Bij de toepassing van de vorige twee volzinnen worden voor de bepaling van het aantal
      leerlingen dat een instelling zal bezoeken niet in aanmerking genomen de leerlingen voor wie binnen redelijke
      afstand plaatsruimte beschikbaar zal zijn op een andere instelling, tenzij deze uitsluitend voor interne leerlingen
      is bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel79
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel80
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel81
      [ref5]: https://wetten.overheid.nl/BWBR0003549#Artikel82
      [ref6]: https://wetten.overheid.nl/BWBR0003549#Artikel85
      [ref7]: https://wetten.overheid.nl/BWBR0003549#Artikel83
      [ref8]: https://wetten.overheid.nl/BWBR0003549#Artikel83
      [ref9]: https://wetten.overheid.nl/BWBR0003549#Artikel9
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel86
    references:
