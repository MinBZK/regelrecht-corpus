  - number: '88.1'
    text: Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de uitvoering van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel88
  - number: '88.2'
    text: |-
      De algemene maatregel van bestuur bedoeld in het eerste lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure
      bedoeld in de eerste 3 volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel88
  - number: '89.1'
    text: |-
      De gemeenteraad draagt ten behoeve van de door de gemeente in stand gehouden scholen en ten behoeve van de niet
      door de gemeente in stand gehouden scholen zorg voor de voorzieningen in de huisvesting op het grondgebied van de
      gemeente overeenkomstig het bepaalde in deze afdeling. Hij behandelt daarbij de door de gemeente in stand gehouden
      scholen en de niet door de gemeente in stand gehouden scholen op gelijke voet.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel89
  - number: '89.2'
    text: |-
      Voor de toepassing van deze afdeling worden onder een niet door de gemeente in stand gehouden school mede
      begrepen een op het grondgebied van de gemeente gelegen nevenvestiging als bedoeld in [artikel 76a][ref1] en
      [artikel 76b][ref2] en een op het grondgebied van de gemeente gelegen nevenvestiging van een instelling, genoemd
      in [artikel X van de Wet van 31 mei 1995][ref3] (Stb. 319), waarvan de hoofdvestiging op het grondgebied van een
      andere gemeente is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel76a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel76b
      [ref3]: https://wetten.overheid.nl/BWBR0007421#ArtikelX
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 76a
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 76b
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0007421
        artikel: X
  - number: '90.1'
    text: 'Voor de toepassing van deze afdeling worden onder voorzieningen in de huisvesting begrepen:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel90
  - number: 90.1.a
    text: 'voor blijvend onderscheidenlijk voor tijdelijk gebruik bestemde voorzieningen, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel90
  - number: 90.1.a.1°
    text: |-
      nieuwbouw, een bestaand gebouw of een gedeelte daarvan, verplaatsing van een bestaand gebouw of van een gedeelte
      daarvan, terreinen, alsmede eerste aanschaf van onderwijsleerpakketten en meubilair,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel90
  - number: 90.1.a.2°
    text: uitbreiding van de onder 1° bedoelde voorzieningen, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel90
  - number: 90.1.a.3°
    text: |-
      medegebruik van een ruimte die geschikt is voor het onderwijs, dan wel een bad voor watergewenning of
      bewegingstherapie;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel90
  - number: 90.1.b
    text: 'voorzieningen, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel90
  - number: 90.1.b.1°
    text: |-
      aanpassingen met uitzondering van het aanbrengen van een invalidentoilet en het toegankelijk maken van het gebouw
      voor gehandicapten, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel90
  - number: 90.1.b.2°
    text: |-
      vervanging binnenkozijnen en binnendeuren inclusief hang- en sluitwerk, algehele vervanging radiatoren, convectoren
      en leidingen voor de centrale verwarming alsmede onderhoud aan de buitenzijde van het gebouw met uitzondering van
      het buitenschilderwerk;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel90
  - number: 90.1.c
    text: |-
      herstel van constructiefouten aan het gebouw, alsmede herstel en vervanging in verband met schade aan gebouw,
      onderwijsleerpakketten en meubilair in geval van bijzondere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel90
  - number: '90.2'
    text: |-
      Bij algemene maatregel van bestuur worden bruto vloeroppervlakten per gelijktijdig aanwezige leerling
      voorgeschreven die voorzieningen in de huisvesting ten minste dienen te bevatten. Deze oppervlakten kunnen per
      schoolsoort verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel90
  - number: '91.1'
    text: |-
      De gemeenteraad stelt jaarlijks ten behoeve van het eerstvolgende jaar voor een door hem te bepalen tijdstip een
      bekostigingsplafond vast voor de bekostiging van de voorzieningen in de huisvesting voor:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel91
  - number: 91.1.a
    text: scholen,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel91
  - number: 91.1.b
    text: basisscholen,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel91
  - number: 91.1.c
    text: speciale scholen voor basisonderwijs, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel91
  - number: 91.1.d
    text: |-
      scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs en
      voor voorbereidend beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel91
  - number: '91.2'
    text: |-
      Het bekostigingsplafond wordt zodanig vastgesteld dat redelijkerwijs kan worden voorzien in de huisvesting van de
      in het eerste lid bedoelde scholen op het grondgebied van de gemeente.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel91
  - number: '92.1'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school dat een voorziening in de huisvesting
      wenst, dient een aanvraag voor opneming van die voorziening op het programma, bedoeld in [artikel 93][ref1], in bij
      burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '93'
        afdeling: '3'
  - number: '92.2'
    text: |-
      De gemeenteraad kan ten aanzien van voorzieningen als bedoeld in [artikel 90][ref1] bekostiging verstrekken ter
      zake van de kosten van bouwvoorbereiding.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel90
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '90'
        afdeling: '3'
  - number: '92.3'
    text: |-
      De gemeenteraad stelt vast, voor welk tijdstip de aanvraag wordt ingediend en aan welke voorwaarden deze dient
      te voldoen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel92
  - number: '92.4'
    text: Het derde lid is van overeenkomstige toepassing op de door de gemeente in stand gehouden scholen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel92
  - number: '93.1'
    text: |-
      De gemeenteraad stelt, na overleg met de bevoegde gezagsorganen van de niet door de gemeente in stand gehouden
      scholen in de gemeente, jaarlijks ten behoeve van het onderwijs op het grondgebied van de gemeente voor een door
      hem te bepalen tijdstip een programma als bedoeld in het tweede lid vast. Het programma heeft betrekking op scholen
      als bedoeld in [artikel 91, eerste lid, onderdelen a tot en met d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel91
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '91'
        afdeling: '3'
  - number: '93.2'
    text: |-
      Het programma omvat de voorzieningen in de huisvesting, bedoeld in [artikel 90][ref1], die in het jaar na de
      vaststelling van het programma voor bekostiging in aanmerking zullen worden gebracht voor niet door de gemeente in
      stand gehouden scholen en voorzieningen die nodig zijn voor door de gemeente in stand gehouden scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel90
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '90'
        afdeling: '3'
  - number: '93.3'
    text: 'De gemeenteraad neemt uitsluitend voorzieningen in de huisvesting in het programma op, voor zover:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel93
  - number: 93.3.a
    text: |-
      met de voorzieningen in het kalenderjaar volgend op het jaar van vaststelling van het programma redelijkerwijs een
      aanvang kan worden gemaakt dan wel de voorzieningen in het desbetreffende kalenderjaar kunnen worden gerealiseerd,
      en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel93
  - number: 93.3.b
    text: |-
      niet een van de weigeringsgronden, genoemd in [artikel 98][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel98
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '98'
        afdeling: '3'
  - number: '93.4'
    text: |-
      Indien het bekostigingsplafond, bedoeld in [artikel 91][ref1], niet toereikend is, worden die voorzieningen in het
      programma opgenomen die uit dat bekostigingsplafond kunnen worden bekostigd, waarbij de volgorde wordt bepaald met
      inachtneming van de criteria, bedoeld in [artikel 100, eerste lid, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel100
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '91'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '100'
        afdeling: '3'
  - number: '93.5'
    text: |-
      De beschikking van de gemeenteraad kan een gedeelte van de gewenste voorziening dan wel een andere voorziening dan
      gewenst omvatten.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel93
  - number: '93.6'
    text: |-
      De gemeenteraad kan aan de opneming in het programma voorwaarden verbinden betreffende ingebruikneming of
      buitengebruikstelling van gebouwen of lokalen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel93
  - number: '93.7'
    text: |-
      De gemeenteraad neemt bij de vaststelling van het programma de criteria, bedoeld in
      [artikel 100, eerste lid, onderdeel c][ref1], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel100
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '100'
        afdeling: '3'
  - number: '93.8'
    text: |-
      Binnen vier weken na de vaststelling van het programma treden burgemeester en wethouders met het bevoegd gezag
      in overleg over de wijze van uitvoering. Indien dit overleg niet tot overeenstemming leidt, delen burgemeester en
      wethouders het bevoegd gezag mede dat zij niet kunnen instemmen met de door het bevoegd gezag gewenste wijze van
      uitvoering.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel93
  - number: '93.9'
    text: |-
      Tijdens het in het eerste lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit te
      brengen over de vaststelling van het programma huisvestingsvoorzieningen in relatie tot de vrijheid van richting
      en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd dan wel uit
      eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies
      wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekend gemaakt tezamen met het programma.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel93
  - number: '94'
    text: |-
      De gemeenteraad stelt gelijktijdig met het programma, bedoeld in [artikel 93][ref1], ten behoeve van het onderwijs
      op het grondgebied van de gemeente voor een door hem te bepalen tijdstip een overzicht vast van die voorzieningen
      die zijn aangevraagd dan wel die nodig zijn, die niet op het programma zijn opgenomen. Daarbij wordt aangegeven
      waarom de desbetreffende voorzieningen niet zijn opgenomen. Het overzicht wordt ter inzage gelegd. Het overzicht
      heeft betrekking op scholen als bedoeld in [artikel 91, eerste lid, onderdelen a tot en met d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel91
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '93'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '91'
        afdeling: '3'
  - number: '95'
    text: |-
      De gemeenteraad stelt geen programma als bedoeld in [artikel 93][ref1] en geen overzicht als bedoeld in
      [artikel 94][ref2] vast, indien geen voorziening in de huisvesting nodig is noch een aanvraag is ingediend voor
      scholen als bedoeld in [artikel 91, eerste lid, onderdelen a tot en met d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel94
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel91
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '93'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '94'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '91'
        afdeling: '3'
  - number: '96.1'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school dat een voorziening in de huisvesting
      wenst die niet in het programma, bedoeld in [artikel 93][ref1], is opgenomen, maar die gelet op de voortgang van
      het onderwijs geen uitstel kan lijden, dient een aanvraag om bekostiging van die voorziening in bij burgemeester
      en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '93'
        afdeling: '3'
  - number: '96.2'
    text: |-
      De beschikking kan een gedeelte van de gewenste voorziening dan wel een andere voorziening dan gewenst omvatten. De
      gemeenteraad wijst de aanvraag af, indien:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel96
  - number: 96.2.a
    text: het besluit over de voorziening kan worden genomen bij de vaststelling van het eerstvolgende programma, of
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel96
  - number: 96.2.b
    text: |-
      een van de weigeringsgronden, genoemd in
      [artikel 98, eerste lid, onderdelen a tot en met d en f, en tweede lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel98
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '98'
        afdeling: '3'
  - number: '97.1'
    text: |-
      De gemeenteraad beslist bij beschikking met ingang van welk tijdstip in het jaar volgend op het jaar van
      vaststelling van het programma, bedoeld in [artikel 93][ref1], de bekostiging van een voorziening die in het
      programma is opgenomen, daadwerkelijk een aanvang kan nemen, onverminderd het bepaalde in [artikel 99][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel99
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '93'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '99'
        afdeling: '3'
  - number: '97.2'
    text: |-
      De aanspraak op bekostiging van een voorziening vervalt, indien niet binnen een door de gemeente in de verordening
      op basis van [artikel 100][ref1] te bepalen termijn na de beschikking, bedoeld in het eerste lid, met betrekking
      tot de voorziening een bouwopdracht is gegeven dan wel een koop-, huur- of erfpachtovereenkomst is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel100
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '100'
        afdeling: '3'
  - number: '98.1'
    text: 'Een voorziening in de huisvesting wordt slechts geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel98
  - number: 98.1.a
    text: |-
      de gewenste voorziening geen voorziening is in de zin van [artikel 90][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel90
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '90'
        afdeling: '3'
  - number: 98.1.b
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de aard en de omvang van de voorzieningen waarover
      de school reeds beschikt, voor zover deze uit de openbare kas zijn bekostigd, gelet op de normen, bedoeld in
      [artikel 100, eerste lid, onderdeel b][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel100
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '100'
        afdeling: '3'
  - number: 98.1.c
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de te verwachten ontwikkeling van het
      aantal leerlingen of onderwijskundige ontwikkelingen, zulks met inachtneming van het bepaalde in
      [artikel 100, eerste lid, onderdelen c en d][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel100
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '100'
        afdeling: '3'
  - number: 98.1.d
    text: |-
      op andere wijze dan wordt gewenst redelijkerwijs in de behoefte aan huisvesting kan worden voorzien, onder meer
      doordat binnen redelijke afstand van de gewenste plaats van de voorziening gebruik dan wel medegebruik mogelijk is,
      of een reeds voor bekostiging in aanmerking gebracht gebouw of deel daarvan beschikbaar komt,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel98
  - number: 98.1.e
    text: |-
      het bekostigingsplafond, bedoeld in [artikel 91][ref1], niet toereikend is voor de te verstrekken voorzieningen
      voor scholen als bedoeld in het eerste lid, onderdelen a tot en met d, van dat artikel, of


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel91
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '91'
        afdeling: '3'
  - number: 98.1.f
    text: de gewenste voorziening anders dan op grond van de onderdelen b tot en met d niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel98
  - number: '98.2'
    text: |-
      Een voorziening in de huisvesting kan tevens worden geweigerd, indien de voorziening als gevolg van het verwijtbaar
      nalaten van noodzakelijk onderhoud in een slechte bouwkundige staat verkeert of indien de voorziening nodig is voor
      herstel van schade die is veroorzaakt door schuld of toedoen van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel98
  - number: '99'
    text: |-
      Voorzieningen die in het programma, bedoeld in [artikel 93][ref1], zijn opgenomen, komen voor bekostiging in
      aanmerking, mits op het tijdstip dat daarvoor op grond van [artikel 97, eerste lid][ref2], is vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel97
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '93'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '97'
        afdeling: '3'
  - number: 99.a
    text: is voldaan aan de bij of krachtens de wet gestelde voorschriften, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel99
  - number: 99.b
    text: |-
      de feiten en omstandigheden waarin de school verkeert, ten opzichte van de feiten en omstandigheden ten tijde van
      de vaststelling van het programma niet ingrijpend zijn gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel99
  - number: '100.1'
    text: 'De gemeenteraad stelt bij verordening een regeling vast met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel100
  - number: 100.1.a
    text: |-
      de voorzieningen die ingevolge [artikel 90][ref1] voor bekostiging in aanmerking kunnen worden gebracht,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel90
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '90'
        afdeling: '3'
  - number: 100.1.b
    text: de oppervlakte en de indeling van schoolgebouwen,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel100
  - number: 100.1.c
    text: de urgentiecriteria,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel100
  - number: 100.1.d
    text: de prognosecriteria,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel100
  - number: 100.1.e
    text: |-
      de termijn bedoeld in [artikel 97][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel97
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '97'
        afdeling: '3'
  - number: 100.1.f
    text: de procedure met betrekking tot verhuur en het medegebruik van ruimten voor het onderwijs,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel100
  - number: 100.1.g
    text: |-
      de termijn gedurende welke een gebouw of terrein voor een school of nevenvestiging nog ten hoogste kan worden
      gebruikt bij toepassing van [artikel 108][ref1], alsmede de procedure in verband met een eventueel op te maken
      staat van onderhoud, en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel108
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '108'
        afdeling: '3'
  - number: 100.1.h
    text: |-
      de gegevens bedoeld in [artikel 110][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel110
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '110'
        afdeling: '3'
  - number: '100.2'
    text: |-
      De regeling wordt zodanig vastgesteld dat kan worden voldaan aan de redelijke eisen die het onderwijs aan de
      huisvesting van scholen in de gemeente stelt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel100
  - number: '100.3'
    text: |-
      De gemeenteraad stelt normen vast aan de hand waarvan de bedragen worden vastgesteld voor de toegekende
      voorzieningen in de huisvesting.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel100
  - number: '100.4'
    text: |-
      Burgemeester en wethouders betalen volgens door hen te stellen regels de bedragen aan de hand van de door de
      gemeenteraad gestelde normen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel100
  - number: '100.5'
    text: |-
      De gemeenteraad stelt de regeling, bedoeld in het eerste lid, dan wel een wijziging daarvan, niet vast dan nadat
      daarover op overeenstemming gericht overleg is gevoerd met door de bevoegde gezagsorganen van de niet door de
      gemeente in stand gehouden scholen in de gemeente aan te wijzen vertegenwoordigers. De gemeenteraad stelt daartoe
      een procedure vast.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel100
  - number: '100.6'
    text: |-
      Tijdens het in het vijfde lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit te
      brengen over de vaststelling of wijziging van de gemeentelijke verordening in relatie tot de vrijheid van richting
      en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd dan wel uit
      eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies
      wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekend gemaakt tezamen met de verordening
      of de wijziging daarvan.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel100
  - number: '101.1'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school geeft opdracht de voorziening in de
      huisvesting waartoe op grond van de [artikelen 93][ref1] en [96][ref2] kan worden overgegaan, tot stand te brengen
      met daartoe door de gemeente beschikbaar te stellen gelden, tenzij het met burgemeester en wethouders overeenkomt
      dat de gemeente deze voorziening tot stand brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel96
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '93'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '96'
        afdeling: '3'
  - number: '101.2'
    text: |-
      Indien de gemeente de voorziening in de huisvesting van een niet door de gemeente in stand gehouden school tot
      stand heeft gebracht, worden gebouw en terrein aan het bevoegd gezag in eigendom overgedragen, tenzij burgemeester
      en wethouders en het bevoegd gezag anders overeenkomen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel101
  - number: '101.3'
    text: |-
      Indien de voorziening in de huisvesting, bedoeld in het tweede lid, niet voldoet aan de eisen voor
      eigendomsoverdracht, geven burgemeester en wethouders deze aan het bevoegd gezag in gebruik.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel101
  - number: '102'
    text: |-
      Tenzij het bevoegd gezag van een niet door de gemeente in stand gehouden school dat aanspraak heeft op bekostiging
      van een voorziening in de huisvesting, met burgemeester en wethouders overeenkomt dat de gemeente deze voorziening
      tot stand brengt, behoeven de bouwplannen en de desbetreffende begrotingen de instemming van burgemeester en
      wethouders.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel102
  - number: '103'
    text: |-
      De gemeente brengt een voorziening in de huisvesting van een niet door de gemeente in stand gehouden school
      slechts tot stand, indien tussen burgemeester en wethouders en het bevoegd gezag overeenstemming bestaat over de
      bouwplannen en de wijze van uitvoering.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel103
  - number: '104.1'
    text: |-
      Het bevoegd gezag is verplicht het gebouw en terrein, alsmede de roerende zaken waarvoor bekostiging wordt genoten,
      behoorlijk te gebruiken en te onderhouden.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel104
  - number: '104.2'
    text: |-
      Vervreemding door het bevoegd gezag van een niet door de gemeente in stand gehouden school anders dan op grond
      van [artikel 52][ref1] of [artikel 58][ref2], van gebouwen, terreinen en roerende zaken waarvoor bekostiging wordt
      genoten, of bezwaren met een zakelijk recht door het bevoegd gezag van een niet door de gemeente in stand gehouden
      school van zodanige gebouwen en terreinen, is zonder toestemming van burgemeester en wethouders nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel58
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '52'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '58'
        afdeling: '3'
  - number: '104.3'
    text: |-
      Het tweede lid is niet van toepassing ten aanzien van het recht van opstal ten behoeve van een door de gemeente te
      plaatsen tijdelijke voorziening in de huisvesting op grond die eigendom is van het bevoegd gezag van de betrokken
      school.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel104
  - number: '105.1'
    text: |-
      Burgemeester en wethouders zijn bevoegd een gedeelte van een gebouw of terrein dat tijdelijk of gedurende een
      gedeelte van de dag niet nodig zal zijn voor de daar gevestigde school, gedurende die tijd als huisvesting
      voor een andere school, voor ander uit de openbare kas bekostigd onderwijs niet zijnde speciaal onderwijs en
      voortgezet speciaal onderwijs, of voor educatie als bedoeld in de [Wet educatie en beroepsonderwijs][ref1] dan
      wel voor andere culturele, maatschappelijke of recreatieve doeleinden te bestemmen. Het voorgenomen gebruik
      dient zich te verdragen met het onderwijs aan de in het gebouw gevestigde school. Tevens zijn burgemeester
      en wethouders bevoegd ten behoeve van het onderwijs in lichamelijke oefening of expressie-activiteiten, dan
      wel ten behoeve van watergewenning of bewegingstherapie een gebouw of terrein dan wel een gedeelte daarvan
      dat tijdelijk gedurende gedeelten van de dag of in het geheel niet nodig zal zijn voor de daar gevestigde
      school, gedurende die tijd als huisvesting voor een andere school, voor ander uit de openbare kas bekostigd
      onderwijs niet zijnde speciaal onderwijs en voortgezet speciaal onderwijs, of voor educatie als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref2] dan wel voor andere culturele, maatschappelijke of recreatieve doeleinden
      te bestemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0007625
  - number: '105.2'
    text: |-
      Indien het gebouw of terrein in gebruik is voor een niet door de gemeente in stand gehouden school, plegen
      burgemeester en wethouders vooraf overleg met het bevoegd gezag en, voor zover van toepassing, ook met het bevoegd
      gezag van die school of nevenvestiging waarvoor de huisvesting is bestemd.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel105
  - number: '106.1'
    text: |-
      Voor zover [artikel 105][ref1] geen toepassing vindt, kan het bevoegd gezag een gedeelte van een gebouw
      of terrein in gebruik geven ten behoeve van uit de openbare kas bekostigd onderwijs dan wel voor andere
      culturele, maatschappelijke of recreatieve doeleinden. Voor zover niet nodig voor uit de openbare kas
      bekostigd onderwijs, kan het bevoegd gezag een gedeelte van het gebouw of terrein verhuren aan een derde,
      voor zover het gehuurde niet bestemd zal zijn als woon- of bedrijfsruimte in de zin van de [vijfde][ref2] en
      [zesde afdeling van titel 4 van Boek 7 van het Burgerlijk Wetboek][ref3]. Indien het een niet door de gemeente in
      stand gehouden school betreft, is voor verhuur toestemming van burgemeester en wethouders vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Afdeling5
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Afdeling6
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '105'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0005290
        afdeling: '6'
  - number: '106.2'
    text: 'De ingebruikgeving of verhuur ingevolge het eerste lid eindigt:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel106
  - number: 106.2.a
    text: |-
      indien burgemeester en wethouders gebruik maken van hun bevoegdheid op grond van [artikel 105][ref1] zonder dat
      enige schadeplicht ontstaat, of


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel105
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '105'
        afdeling: '3'
  - number: 106.2.b
    text: indien het in gebruik gegeven dan wel verhuurde deel nodig is voor gebruik door de eigen school.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel106
  - number: '106.3'
    text: |-
      Ingebruikgeving of verhuur ingevolge het eerste lid geschiedt niet indien het voorgenomen gebruik zich niet
      verdraagt met het onderwijs aan de in het gebouw gevestigde school.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel106
  - number: '106.4'
    text: |-
      Op de ingebruikgeving en verhuur ingevolge het eerste lid is
      [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 230a
  - number: '106.5'
    text: |-
      Het zonder toestemming van burgemeester en wethouders verhuren van een gebouw of terrein door het bevoegd gezag
      van een niet door de gemeente in stand gehouden school alsmede elk met dit artikel strijdig beding opgenomen in een
      huurovereenkomst met betrekking tot schoolgebouwen, is nietig.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel106
  - number: '107'
    text: |-
      Voorzieningen aan gebouwen of terreinen in verband met verhuur krachtens de [artikelen 106][ref1] of [108][ref2]
      door het bevoegd gezag van een niet door de gemeente in stand gehouden school, komen niet ten laste van de
      gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel108
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '106'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '108'
        afdeling: '3'
  - number: '108.1'
    text: |-
      Burgemeester en wethouders en het bevoegd gezag van een niet door de gemeente in stand gehouden school dat eigenaar
      is van het gebouw en terrein, kunnen in een gezamenlijke akte verklaren dat het bevoegd gezag blijvend heeft
      opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor eigendomsoverdracht vatbaar gedeelte
      daarvan, voor de school te gebruiken.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel108
  - number: '108.2'
    text: |-
      Gedeputeerde staten kunnen in geval van een geschil omtrent de toepassing van het eerste lid desgevraagd besluiten
      dat het bevoegd gezag blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor
      eigendomsoverdracht vatbaar gedeelte daarvan, voor de school te gebruiken. De aanvraag om het besluit wordt gedaan
      door burgemeester en wethouders of door het bevoegd gezag van de school. Alvorens op de aanvraag te besluiten,
      horen gedeputeerde staten de wederpartij.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel108
  - number: '108.3'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school dat voornemens is gebouwen of terreinen,
      of een gedeelte daarvan, blijvend niet meer voor de school te gebruiken, doet hiervan onverwijld mededeling aan
      burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel108
  - number: '108.4'
    text: |-
      Zodra de in het eerste lid bedoelde akte door beide partijen is getekend, of het in het tweede lid bedoelde besluit
      van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van de rechter,
      inhoudende een besluit als bedoeld in het tweede lid eerste volzin, in de plaats treedt van het vernietigde
      besluit, wordt de akte, het onherroepelijk geworden besluit onderscheidenlijk de uitspraak, tenzij deze een gebouw
      betreft als bedoeld in artikel E 24 van de Overgangswet ISOVSO, ingeschreven in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1]. Door de inschrijving verkrijgt de gemeente
      de eigendom.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '108.5'
    text: |-
      Burgemeester en wethouders en het bevoegd gezag van een niet door de gemeente in stand gehouden school dat eigenaar
      is van het schoolgebouw, kunnen in een gezamenlijke akte verklaren dat een gedeelte van het gebouw dat niet vatbaar
      is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs nodig zal zijn.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel108
  - number: '108.6'
    text: |-
      Gedeputeerde staten kunnen in geval van een geschil omtrent de toepassing van het vijfde lid desgevraagd besluiten
      dat een gedeelte van het gebouw dat niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs
      nodig zal zijn. De aanvraag om het besluit wordt gedaan door burgemeester en wethouders of door het bevoegd gezag
      van de school. Alvorens op de aanvraag te besluiten, horen gedeputeerde staten de wederpartij.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel108
  - number: '108.7'
    text: |-
      Zodra de in het vijfde lid bedoelde akte door beide partijen is getekend, of het in het zesde lid bedoelde besluit
      van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van de rechter,
      inhoudende een beslissing als bedoeld in het zesde lid eerste volzin, in de plaats treedt van het vernietigde
      besluit, kan het bevoegd gezag van een niet door de gemeente in stand gehouden school het desbetreffende gedeelte
      van het gebouw met toestemming van burgemeester en wethouders verhuren.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel108
  - number: '108.8'
    text: |-
      De toestemming, bedoeld in het zevende lid, wordt verleend voor een tijdvak van ten hoogste 3 jaren. Op verzoek van
      het bevoegd gezag kan dit tijdvak telkens worden verlengd met een termijn van ten hoogste 3 jaren.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel108
  - number: '108.9'
    text: |-
      Op de verhuur, bedoeld in het zevende lid, is [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 230a
  - number: '109'
    text: |-
      In afwijking van deze afdeling kan de gemeenteraad besluiten dat jaarlijks een bedrag voor huisvestingskosten
      wordt betaald aan het bevoegd gezag van een niet door de gemeente in stand gehouden school voor zover die op het
      grondgebied van die gemeente in stand wordt gehouden. De gemeenteraad neemt het besluit in overeenstemming met het
      bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel109
  - number: '110'
    text: |-
      Het bevoegd gezag van een niet door de desbetreffende gemeente in stand gehouden school is gehouden aan de gemeente
      alle inlichtingen te verschaffen die de gemeente voor een adequate uitvoering van de bepalingen in deze afdeling
      noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel110
  - number: '111.1'
    text: |-
      Bij ministeriële regeling worden voor de scholen, niet zijnde instellingen, eenmaal in de vijf jaar voor 1 oktober
      programma's van eisen vastgesteld die de grondslag vormen voor de bekostiging van de voorzieningen, bedoeld in
      het derde lid. De programma's van eisen gelden voor de vijf jaar volgend op het jaar waarin de vaststelling dient
      plaats te vinden. De programma's van eisen kunnen per schoolsoort, verdeeld als aangegeven in artikel 2, tweede
      lid, worden vastgesteld, al naar gelang het scholen voor speciaal onderwijs, scholen voor voortgezet speciaal
      onderwijs, scholen voor speciaal en voortgezet speciaal onderwijs, dan wel afdelingen betreft. Elk programma van
      eisen omvat:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel111
  - number: 111.1.a
    text: een omschrijving van de in aanmerking genomen componenten waaruit de voorzieningen zijn opgebouwd,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel111
  - number: 111.1.b
    text: de daarvoor noodzakelijk geachte bedragen en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel111
  - number: 111.1.c
    text: de wijze waarop de voor elke voorziening vast te stellen vergoeding wordt berekend.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel111
  - number: '111.2'
    text: |-
      De programma's van eisen voldoen aan de redelijke behoeften van een in normale omstandigheden verkerende school,
      onverminderd het vierde tot en met negende lid, en houden rekening met de bruto vloeroppervlakten die op grond van
      de algemene maatregel van bestuur, bedoeld in [artikel 90, tweede lid][ref1], worden voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel90
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '90'
        afdeling: '3'
  - number: '111.3'
    text: |-
      Programma's van eisen worden vastgesteld voor de materiële voorzieningen ten behoeve van de instandhouding van
      onderscheidenlijk:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel111
  - number: 111.3.a
    text: de scholen, daaronder niet begrepen de ruimten voor het onderwijs in lichamelijke oefening, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel111
  - number: 111.3.b
    text: de ruimten voor watergewenning of bewegingstherapie.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel111
  - number: '111.4'
    text: |-
      Bij ministeriële regeling worden jaarlijks voor 1 oktober de overeenkomstig het zesde lid, aangepaste bedragen
      vastgesteld. De aldus vastgestelde bedragen zijn de definitieve bedragen, geldend voor het jaar volgend op het jaar
      waarin de vaststelling dient plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel111
  - number: '111.5'
    text: |-
      Onze minister kan bij de vaststelling van de ministeriële regeling, bedoeld in het vierde lid, wijzigingen in de
      programma's van eisen aanbrengen indien de toestand van 's Rijks schatkist of onderwijskundige ontwikkelingen dat
      noodzakelijk maken. Aan de eerste volzin kan slechts toepassing worden gegeven indien de ministeriële regeling,
      bedoeld in het vierde lid, voor de in dat lid bedoelde datum wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel111
  - number: '111.6'
    text: |-
      De aanpassing, bedoeld in het vierde lid, vindt plaats door de bedragen op basis van de werkelijke
      prijsontwikkeling voor het tweede jaar voorafgaand aan het jaar waarvoor de bedragen worden vastgesteld, aan te
      passen overeenkomstig de prijsmutatie van de netto materiële consumptie, zoals opgenomen in de Macro Economische
      Verkenning, die naar verwachting zal optreden tussen het prijsniveau in het eerstbedoelde jaar en het prijsniveau
      in het daaropvolgende jaar, alsmede aan te passen overeenkomstig de prijsmutatie van de netto materiële consumptie,
      zoals opgenomen in de Macro Economische Verkenning, die naar verwachting zal optreden tussen het prijsniveau in
      het jaar voorafgaand aan het jaar waarvoor de bedragen worden vastgesteld en het jaar waarvoor de bedragen worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel111
  - number: '111.7'
    text: |-
      De ministeriële regelingen, bedoeld in het eerste en vierde lid, worden binnen 4 weken na de vaststelling, bedoeld
      in het eerste en vierde lid, gezamenlijk bekendgemaakt in de Staatscourant, onder gelijktijdige overlegging aan
      de Tweede Kamer der Staten-Generaal. De ministeriële regelingen treden niet in werking dan nadat 4 weken zijn
      verstreken na het overleggen aan de Tweede Kamer en gedurende die termijn niet door of namens de Kamer de wens tot
      overleg over de ministeriële regelingen te kennen wordt gegeven dan wel met de Tweede Kamer overleg is gevoerd.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel111
  - number: '111.8'
    text: |-
      Naar aanleiding van het overleg met de Tweede Kamer kunnen wijzigingen in de programma's van eisen en de
      wijzigingen daarvan, bedoeld in het vijfde lid, worden aangebracht. De wijzigingen worden bekendgemaakt in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel111
  - number: '112.1'
    text: |-
      De programma's van eisen, bedoeld in [artikel 111, derde lid onder a][ref1], worden onderverdeeld in programma's
      van eisen omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel111
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '111'
        afdeling: '4'
  - number: 112.1.a
    text: onderhoud,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel112
  - number: 112.1.b
    text: energie- en waterverbruik,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel112
  - number: 112.1.c
    text: publiekrechtelijke heffingen, met uitzondering van de belastingen ter zake van onroerende zaken,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel112
  - number: 112.1.d
    text: middelen, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel112
  - number: 112.1.e
    text: administratie, beheer en bestuur.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel112
  - number: '112.2'
    text: |-
      De programma's van eisen, bedoeld in [artikel 111, derde lid onder b][ref1], worden onderverdeeld in programma's
      van eisen omtrent de voorzieningen zoals onderscheiden in het eerste lid onder a, b en c, alsmede d voor zover het
      betreft onderhoud, vervanging en vernieuwing van onderwijsleerpakket en onderhoud meubilair.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel111
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '111'
        afdeling: '4'
  - number: '112.3'
    text: Bij de programma's van eisen, bedoeld in het tweede lid, wordt onderscheid gemaakt in vaste en variabele kosten.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel112
  - number: '113.1'
    text: |-
      Indien bijzondere ontwikkelingen in het speciaal onderwijs en het voortgezet speciaal onderwijs daartoe aanleiding
      geven, kunnen bij ministeriële regeling voorschriften worden vastgesteld omtrent het verstrekken van aanvullende
      bekostiging voor de materiële instandhouding.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel113
  - number: '113.2'
    text: |-
      Indien bijzondere bekostiging op grond van [artikel 120][ref1] wordt toegekend, kan Onze minister bepalen dat, voor
      de periode waarvoor die bijzondere bekostiging wordt toegekend, tevens aanvullende bekostiging voor de materiële
      instandhouding wordt toegekend. Bij ministeriële regeling kunnen nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel120
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '120'
        afdeling: '5'
  - number: '113.3'
    text: |-
      Onze minister kan in verband met de in het eerste lid en het tweede lid bedoelde bekostiging een
      bekostigingsplafond instellen. In dat geval worden bij ministeriële regeling regels omtrent de verdeling
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel113
  - number: '114.1'
    text: |-
      Eenmaal in de vijf jaar voor 1 oktober stelt Onze minister voor elke instelling een totaalbedrag vast voor de
      materiële voorzieningen ten behoeve van de instandhouding voor het jaar volgend op dat van de vaststelling.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel114
  - number: '114.2'
    text: |-
      In de beschikking, bedoeld in het eerste lid, kan worden aangegeven, welk deel van het totaalbedrag bedoeld in dat
      lid strekt voor:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel114
  - number: 114.2.a
    text: administratie, beheer en bestuur en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel114
  - number: 114.2.b
    text: de materiële instandhouding van watergewenning en bewegingstherapie.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel114
  - number: '114.3'
    text: |-
      In de beschikking, bedoeld in het eerste lid, wordt aangegeven, welk deel van het totaalbedrag bedoeld in dat lid
      strekt voor:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel114
  - number: 114.3.a
    text: |-
      de programma's van eisen, bedoeld in [artikel 112, eerste lid onder a, b en c][ref1], van een schoolgebouw waarvan
      de gemeente eigenaar is, en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel112
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '112'
        afdeling: '4'
  - number: 114.3.b
    text: een schoolbad waarvan de gemeente eigenaar is.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel114
  - number: '114.4'
    text: |-
      Het totaalbedrag voor de materiële voorzieningen ten behoeve van de instandhouding voor het tweede tot en met het
      vijfde jaar volgend op het jaar van de vaststelling, bedoeld in het eerste lid, wordt bepaald door het totaalbedrag
      dat gold voor het aan het desbetreffende jaar voorafgaande jaar, aan te passen aan de prijsmutatie van de netto
      materiële consumptie, zoals opgenomen in de Macro Economische Verkenning, die naar verwachting zal optreden tussen
      het prijsniveau in laatstgenoemd jaar en het prijsniveau in het jaar waarvoor het totaalbedrag geldt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel114
  - number: '114.5'
    text: |-
      Indien de miljoenennota, bedoeld in [artikel 13 van de Comptabiliteitswet 2001][ref1], niet of slechts gedeeltelijk
      voorziet in prijsbijstelling in de onderscheiden hoofdstukken van de rijksbegroting voor enig jaar, als gevolg
      waarvan in het voorstel van wet houdende vaststelling van de begroting van de uitgaven en ontvangsten van hoofdstuk
      VIII (Ministerie van Onderwijs, Cultuur en Wetenschap) van de rijksbegroting voor dat jaar geen of geen volledige
      prijsbijstelling kan plaatsvinden in de desbetreffende bedragen van de bekostiging, worden de totaalbedragen,
      bedoeld in het eerste en vierde lid, in overeenstemming daarmee en in afwijking van die leden aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel13
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '13'
  - number: '114.6'
    text: |-
      Indien de vastgestelde rijksbegroting van de uitgaven en de ontvangsten van hoofdstuk VIII (Ministerie van
      Onderwijs, Cultuur en Wetenschap) voor een begrotingsjaar ten aanzien waarvan het vijfde lid toepassing heeft
      gevonden, afwijkt van het desbetreffende voorstel van wet op het onderdeel van de prijsbijstelling in de in
      het vijfde lid bedoelde bedragen van de bekostiging, wordt het totaalbedrag, voor dat jaar vastgesteld in
      overeenstemming met de vastgestelde rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel114
  - number: '114.7'
    text: |-
      Het vierde tot en met het zesde lid zijn van overeenkomstige toepassing op de in het tweede en derde lid bedoelde
      bedragen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel114
  - number: '114.8'
    text: |-
      Indien van de overige onderwijssoorten van het speciaal onderwijs of het voortgezet speciaal onderwijs de
      rijksbekostiging voor de materiële voorzieningen ten behoeve van de instandhouding wordt verminderd, worden de in
      het eerste tot en met vierde lid vastgestelde bedragen dienovereenkomstig verminderd.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel114
  - number: '115.1'
    text: |-
      De gemeenteraad stelt na overleg met de bevoegde gezagsorganen van de niet door de gemeente in stand gehouden
      scholen het aantal klokuren per week vast dat per groep leerlingen ten hoogste
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel115
  - number: 115.1.a
    text: ter beschikking wordt gesteld in een ruimte voor het onderwijs in lichamelijke oefening, of
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel115
  - number: 115.1.b
    text: |-
      voor bekostiging voor de materiële instandhouding van een ruimte voor het onderwijs in lichamelijke oefening in
      aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel115
  - number: '115.2'
    text: Het aantal klokuren, bedoeld in het eerste lid, wordt ten minste vastgesteld op 2,25.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel115
  - number: '115.3'
    text: De gemeenteraad stelt de hoogte vast van
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel115
  - number: 115.3.a
    text: de bekostiging, bedoeld in het eerste lid, onder b, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel115
  - number: 115.3.b
    text: |-
      de bekostiging voor de vaste kosten van de materiële instandhouding van een ruimte voor lichamelijke oefening
      waarvan de eigendom berust bij het bevoegd gezag van een niet door de gemeente in stand gehouden school.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel115
  - number: '115.4'
    text: |-
      Bij de vaststelling, bedoeld in het derde lid, kan onderscheid worden gemaakt naar gelang de oppervlakte van de
      ruimte, alsmede tussen ruimten voor de exploitatie waarvan op grond van de onderwijswetgeving bekostiging wordt
      verleend en ruimten waarvoor dat niet het geval is.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel115
  - number: '116.1'
    text: |-
      Het bevoegd gezag dat, dan wel de gemeente die eigenaar is van een schoolgebouw, zorgt
      voor het deel van de materiële instandhouding waarop de programma's van eisen, bedoeld in
      [artikel 112, eerste lid onder a, b en c][ref1], betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel112
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '112'
        afdeling: '4'
  - number: '116.2'
    text: |-
      Het bevoegd gezag van een bijzondere school dat eigenaar is van een schoolgebouw, kan met burgemeester en
      wethouders overeenkomen dat de gemeente het in het eerste lid bedoelde deel van de materiële instandhouding geheel
      of gedeeltelijk verzorgt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel116
  - number: '116.3'
    text: |-
      Het bevoegd gezag, bedoeld in het eerste lid, kan met een bevoegd gezag dat gebruik maakt van de voorziening in
      de huisvesting van het eerstgenoemde bevoegd gezag, overeenkomen dat het laatstgenoemde bevoegd gezag het in het
      eerste lid bedoelde deel van de materiële instandhouding geheel of gedeeltelijk verzorgt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel116
  - number: '116.4'
    text: |-
      Ingeval de gemeente eigenaar is van het schoolgebouw, kan het bevoegd gezag van een bijzondere school met de
      gemeente overeenkomen dat het bevoegd gezag het in het eerste lid bedoelde deel van de materiële instandhouding
      geheel of gedeeltelijk verzorgt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel116
  - number: '116.5'
    text: |-
      Het bevoegd gezag zorgt voor het deel van de materiële instandhouding waarop de programma's van eisen, bedoeld in
      [artikel 112, eerste lid onder d en e][ref1], betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel112
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '112'
        afdeling: '4'
  - number: '117.1'
    text: |-
      Voor de bekostiging van personeel wordt per onderwijssoort een bedrag per school, niet zijnde een instelling,
      en een bedrag per leerling toegekend, welk laatstbedoeld bedrag wordt verhoogd met een bedrag dat wordt
      vermenigvuldigd met de gewogen gemiddelde leeftijd van de leraren van de school op 1 oktober van het voorafgaande
      schooljaar. Voor het schooljaar waarin een nieuwe school wordt geopend, wordt vermenigvuldigd met de geraamde
      landelijk gewogen gemiddelde leeftijd op 1 oktober van het voorafgaande schooljaar van de leraren in het speciaal
      onderwijs en het voortgezet speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
  - number: '117.2'
    text: De bedragen, bedoeld in het eerste lid, kunnen in elk geval verschillend worden vastgesteld voor leerlingen
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
  - number: 117.2.a
    text: |-
      van de verschillende onderwijssoorten, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 117.2.b
    text: in het speciaal onderwijs en het voortgezet speciaal onderwijs;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
  - number: 117.2.c
    text: jonger dan 8 jaar; en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
  - number: 117.2.d
    text: 8 jaar en ouder.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
  - number: '117.3'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald in welke gevallen en onder welke voorwaarden aanvullende
      bekostiging voor personeelskosten kan worden toegekend. In ieder geval wordt aan scholen, niet zijnde instellingen,
      aanvullende bekostiging toegekend voor schoolleiding, bestrijding van onderwijsachterstanden en groei van het
      aantal leerlingen gedurende het schooljaar.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
  - number: '117.4'
    text: |-
      De instellingen ontvangen in aanvulling op de bekostiging, bedoeld in het eerste lid, jaarlijks een bij
      ministeriële regeling vast te stellen bekostiging in verband met de visuele handicap van de leerlingen van de
      instelling en de vervulling van de taken, bedoeld in [artikel 9, onderdelen b en c][ref1]. De bekostigingsbedragen,
      bedoeld in het eerste lid, en de eerste volzin zijn tezamen redelijkerwijs voldoende voor het leiden en beheren van
      de instelling, voor de taken, bedoeld in [artikel 9][ref2], en voor de overige werkzaamheden die verband houden met
      het onderwijs aan de instelling. Het veertiende lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel9
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '9'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '9'
        paragraaf: '1'
        afdeling: '1'
  - number: '117.5'
    text: |-
      De scholen van de onderwijssoorten in de clusters, bedoeld in [artikel 2, vierde lid, onderdelen b, c en d][ref1],
      ontvangen in aanvulling op de bekostiging, bedoeld in het eerste en derde lid, bekostiging in verband met het
      onderwijs aan leerlingen van wie de toelating is gericht op een verblijf op de school van korter dan een schooljaar
      en bekostiging ten behoeve van leerlingen als bedoeld in [artikel 28c, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 28c
        paragraaf: '1'
        afdeling: '1'
  - number: '117.6'
    text: |-
      Bij algemene maatregel van bestuur worden de grondslagen van de bekostiging, bedoeld in het vijfde lid, voor de
      onderwijssoorten in de clusters, bedoeld in [artikel 2, vierde lid, onderdelen b en c][ref1], per onderwijssoort
      en voor de onderwijssoorten in het cluster, bedoeld in [artikel 2, vierde lid, onderdeel d][ref2], per cluster
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '117.7'
    text: |-
      Voor scholen, niet zijnde instellingen, waaraan onderwijs wordt gegeven aan leerlingen die zijn opgenomen in
      residentiële instellingen wordt tevens een bekostiging vastgesteld die is gebaseerd op het aantal leerlingen uit de
      residentiële instelling, bedoeld in [artikel 71c, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel71c
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 71c
        afdeling: '1'
  - number: '117.8'
    text: |-
      Bij algemene maatregel van bestuur worden de grondslagen voor de berekening van de bekostiging ten behoeve van de
      werkzaamheden en de onderwijssoorten, bedoeld in [artikel 8a, derde lid, onderdeel a][ref1], vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel8a
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 8a
        paragraaf: '1'
        afdeling: '1'
  - number: '117.9'
    text: |-
      Bij algemene maatregel van bestuur wordt voor de werkzaamheden en de onderwijssoorten, bedoeld in
      [artikel 8a, derde lid, onderdeel b][ref1], de bekostiging vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel8a
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 8a
        paragraaf: '1'
        afdeling: '1'
  - number: '117.10'
    text: |-
      Bij ministeriële regeling worden het bedrag per leerling, bedoeld in het eerste lid, het vermenigvuldigingsbedrag
      van de verhoging, bedoeld in het eerste lid, en de bekostigingsbedragen, bedoeld in het derde, vijfde, zevende,
      achtste en negende lid, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
  - number: '117.11'
    text: 'Het bedrag per leerling, bedoeld in het tiende lid, is de som van:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
  - number: 117.11.a
    text: |-
      de uitkomst van een bij algemene maatregel van bestuur vast te stellen hoeveelheid formatie leraren per leerling,
      vermenigvuldigd met een bedrag, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
  - number: 117.11.b
    text: |-
      de uitkomst van een bij algemene maatregel van bestuur vast te stellen hoeveelheid formatie onderwijsondersteunend
      personeel per leerling, vermenigvuldigd met een bedrag.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
  - number: '117.12'
    text: |-
      De verhoging, bedoeld in het tiende lid, is de uitkomst van de in het elfde lid, onder a, bedoelde hoeveelheid
      formatie leraren per leerling, vermenigvuldigd met een bedrag.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
  - number: '117.13'
    text: |-
      De bekostigingsbedragen, bedoeld in het tiende lid, zijn de uitkomst van een bij de algemene maatregel van bestuur
      vast te stellen hoeveelheid formatie vermenigvuldigd met een bedrag.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
  - number: '117.14'
    text: |-
      Bij de vaststelling van de bedragen, bedoeld in het tiende lid, wordt in ieder geval rekening gehouden met de
      ontwikkeling van de geraamde landelijk gewogen gemiddelde leeftijd en de genormeerde gemiddelde personeelslast
      van het personeel van scholen en worden nadere regels vastgesteld met betrekking tot de wijze waarop de gewogen
      gemiddelde leeftijd en de geraamde gewogen gemiddelde leeftijd worden vastgesteld. Indien aanvullende bekostiging
      wordt toegekend voor een bepaalde categorie personeel kan in afwijking van de eerste volzin rekening worden
      gehouden met de genormeerde gemiddelde personeelslasten van die categorie personeel.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
  - number: '117.15'
    text: |-
      De bekostiging, bedoeld in het eerste en het derde lid, voor wat betreft schoolleiding en groei van het aantal
      leerlingen tijdens het schooljaar, is redelijkerwijs voldoende voor het leiden en beheren van de school, voor
      het geven van onderwijs aan de school en voor de overige werkzaamheden die verband houden met het onderwijs aan
      de school.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
  - number: '117.16'
    text: |-
      De algemene maatregel van bestuur, bedoeld in dit artikel, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsontwerp zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure,
      bedoeld in de vorige 3 volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel117
  - number: '118.1'
    text: |-
      Grondslag voor de berekening van het aantal leerlingen, bedoeld in [artikel 117][ref1], is het aantal leerlingen
      op 1 oktober van het voorafgaande schooljaar, dat door een commissie voor de indicatiestelling toelaatbaar is
      verklaard tot een van de onderwijssoorten als bedoeld in [artikel 2, tweede lid][ref2], die door de school wordt
      verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '118.2'
    text: |-
      Voor het schooljaar waarin een nieuwe school wordt geopend en voor het daaropvolgende schooljaar wordt
      als grondslag genomen het aantal leerlingen op 1 oktober, volgende op de opening, dat door een commissie
      voor de indicatiestelling toelaatbaar is verklaard tot een van de onderwijssoorten als bedoeld in
      [artikel 2, tweede lid][ref1], die door de school wordt verzorgd. Indien een nieuwe school ontstaat als gevolg
      van beëindiging van het speciaal onderwijs of het voortgezet speciaal onderwijs van een school voor speciaal en
      voortgezet speciaal onderwijs, is de eerste volzin van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '118.3'
    text: |-
      Voor scholen waaraan onderwijs wordt verzorgd van een van de soorten behorend tot het cluster, bedoeld in
      [artikel 2, vierde lid onder d][ref1], geldt voor de toepassing van het eerste en het tweede lid, het aantal
      leerlingen dat door de commissie voor de indicatiestelling toelaatbaar is verklaard tot dat cluster en dat op die
      school is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '118.4'
    text: |-
      Voor de toepassing van [artikel 117][ref1] geldt in geval van samenvoeging van scholen, het aantal leerlingen van
      alle bij de samenvoeging betrokken scholen vastgesteld volgens het eerste lid, en de gewogen gemiddelde leeftijd
      van de leraren van alle bij de samenvoeging betrokken scholen op 1 oktober van het voorafgaande schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
  - number: '120.1'
    text: |-
      Indien bijzondere ontwikkelingen in het speciaal onderwijs en het voortgezet speciaal onderwijs daartoe aanleiding
      geven, kunnen bij ministeriële regeling voorschriften worden vastgesteld omtrent het verstrekken van bijzondere
      bekostiging voor personeelskosten.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel120
  - number: '120.2'
    text: |-
      In verband met bijzondere omstandigheden kan Onze minister op verzoek van het bevoegd gezag van een school, niet
      zijnde een instelling, onder door hem op te leggen verplichtingen bijzondere bekostiging voor personeelskosten
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel120
  - number: '120.3'
    text: |-
      Een aanvraag als bedoeld in het tweede lid wordt ingediend ten hoogste vier maanden voorafgaand aan het schooljaar
      waarin de bijzondere omstandigheden zich zullen voordoen en niet later dan in het schooljaar waarin die bijzondere
      omstandigheden zich hebben voorgedaan. Onze minister besluit binnen vier maanden na ontvangst van een in het tweede
      lid bedoelde aanvraag. Indien de beschikking niet binnen vier maanden kan worden gegeven, stelt Onze minister de
      aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden
      gezien.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel120
  - number: '120.4'
    text: |-
      Onze minister kan in verband met de in het eerste en tweede lid bedoelde bekostiging een bekostigingsplafond
      instellen. In dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel120
  - number: '121.1'
    text: |-
      Aan de school wordt in verband met de kosten van vervanging van personeel wegens voorschriften die zijn gegeven bij
      algemene maatregel van bestuur of bij ministeriële regeling en de kosten van werkloosheidsuitkeringen, suppleties
      inzake arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel
      anders dan op grond van de [Ziektewet][ref1] bekostiging verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '121.2'
    text: |-
      De in het eerste lid bedoelde bekostiging is verwerkt in de bedragen en in de vermenigvuldigingsbedragen van de
      verhoging, bedoeld in de [artikelen 117, vierde en tiende lid][ref1], en [120][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel120
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '120'
        afdeling: '5'
  - number: '124.1'
    text: |-
      Bij ministeriële regeling wordt de grondslag vastgesteld voor de omvang van de bekostiging voor personeels-
      en arbeidsmarktbeleid. De omvang van de bekostiging is in ieder geval afhankelijk of mede afhankelijk van de
      onderwijssoort, het aantal leerlingen op de teldatum, bedoeld in [artikel 118][ref1], en de samenstelling van
      het leerlingenbestand. Bij het vaststellen van de bekostiging wordt in ieder geval rekening gehouden met de
      ontwikkeling van de genormeerde gemiddelde personeelslasten van leraren.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel118
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '118'
        afdeling: '5'
  - number: '124.2'
    text: |-
      Met inachtneming van het eerste lid verstrekt het Rijk jaarlijks aan het bevoegd gezag van de openbare en
      bijzondere scholen bekostiging ten behoeve van personeels- en arbeidsmarktbeleid.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel124
  - number: '127'
    text: |-
      De gemeente bekostigt aan het bevoegd gezag van een niet door de gemeente in stand gehouden school dat is
      onderworpen aan een of meer der in [artikel 220 van de Gemeentewet][ref1] (Stb. 1992, 96) bedoelde belastingen ter
      zake van onroerende zaken het bedrag dat is uitgegeven voor de belastingen met betrekking tot de in de gemeente
      gelegen gebouwen en terreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
  - number: '128.1'
    text: |-
      Behoudens het tweede lid, verstrekt het Rijk jaarlijks ten behoeve van de scholen, niet zijnde instellingen,
      aan het bevoegd gezag bekostiging ten behoeve van de materiële instandhouding waarop de programma's van eisen,
      bedoeld in [artikel 111, derde lid][ref1], betrekking hebben, waarbij voor het bevoegd gezag geldt dat indien
      toepassing is gegeven aan [artikel 116, tweede lid][ref2], dan wel indien geen overeenkomst als bedoeld in
      [artikel 116, derde of vierde lid][ref3] tot stand is gekomen, dit bevoegd gezag de bekostiging aan de gemeente dan
      wel aan het desbetreffende bevoegd gezag overdraagt voor zover deze de materiële instandhouding verzorgt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel111
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel116
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel116
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel128
    references:
