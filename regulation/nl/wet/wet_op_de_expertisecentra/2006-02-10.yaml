    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel171
  - number: 171.1.g
    text: |-
      het getuigschrift hoger beroepsonderwijs van met goed gevolg afgelegd examen in de ten minste tweejarige deeltijdse
      studierichting leraar voortgezet onderwijs van de eerste graad in pedagogiek.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel171
  - number: '171.2'
    text: |-
      Zij die op 31 juli 1985 op grond van artikel 131, vijfde lid, van de Kleuteronderwijswet bevoegd zijn om als
      leidster, onderscheidenlijk hoofdleidster bij het kleuteronderwijs werkzaam te zijn, zijn met ingang van 1
      augustus 1985 bevoegd tot het geven van speciaal onderwijs en voortgezet speciaal onderwijs. Zij die voor 1
      augustus 1985 belast zijn geweest met het onderwijs in het vak zingen, bedoeld in artikel 2, eerste lid onder h,
      van de Lager-onderwijswet 1920 (Stb. 1974, 565), zijn bevoegd tot het geven van speciaal onderwijs en voortgezet
      speciaal onderwijs in de expressie-activiteit, onderscheidenlijk het vak muziek. Zij die op 31 juli 2004 in het
      bezit zijn van het bewijs van bekwaamheid, bedoeld in het eerste lid, onder a, blijven bevoegd tot het geven
      van onderwijs in zintuiglijke oefening en lichamelijke oefening aan alle groepen leerlingen in het speciaal
      onderwijs. Zij die op 31 juli 2001 een studie volgen die leidt tot het getuigschrift hoger beroepsonderwijs
      van met goed gevolg afgelegd afsluitend examen in de studierichting die voorbereidt op het beroep van leraar
      basisonderwijs, waarvan het onderwijsprogramma voor lichamelijke opvoeding zoals dat werd uitgevoerd voor
      1 september 2000 deel uitmaakt, ontlenen aan dit getuigschrift een bevoegdheid ten aanzien van het geven
      van onderwijs in zintuiglijke oefening en lichamelijke oefening aan alle groepen leerlingen in het speciaal
      onderwijs indien zij bedoeld getuigschrift behalen voor 1 september 2005. Zij die tijdelijk zijn benoemd tot
      leraar op grond van [artikel 2 van de Interimwet zij-instroom leraren primair en voortgezet onderwijs][ref1]
      en die daarna het getuigschrift, bedoeld in [artikel 6, derde lid, van die wet ][ref2]behalen, ontlenen
      aan dit getuigschrift een bevoegdheid tot het geven van onderwijs in zintuiglijke oefening en lichamelijke
      oefening aan alle groepen leerlingen in het speciaal onderwijs indien noodzakelijk geachte scholing, bedoeld
      in [artikel 5 van die wet][ref3], voor die vakken werd gevolgd volgens het onderwijsprogramma voor lichamelijke
      opvoeding zoals dat werd uitgevoerd voor 1 september 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0011469#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011469#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011469#Artikel5
