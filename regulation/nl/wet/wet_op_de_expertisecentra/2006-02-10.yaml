  - number: '142'
    text: |-
      Grondslag voor de berekening van het aantal leerlingen, bedoeld in [artikel 139, vierde en vijfde lid][ref1], is
      het aantal leerlingen op 1 oktober voorafgaande aan het desbetreffende kalenderjaar. Voor het kalenderjaar waarin
      een nieuw opgerichte school wordt geopend, wordt als grondslag genomen het aantal leerlingen op de laatste dag van
      de tweede maand volgende op die der opening.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel139
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '139'
        paragraaf: '5'
        afdeling: '7'
  - number: '143.1'
    text: |-
      Het bevoegd gezag kan het totaal van de in de [artikelen 124][ref1], [128][ref2] en [131][ref3] bedoelde bedragen
      voor de kosten voor de materiële instandhouding en de personeelskosten aanwenden voor kosten voor materiële
      instandhouding, personeelskosten van de school, personeelskosten in verband met benoeming of tewerkstelling zonder
      benoeming van personeel, bedoeld in [artikel 29, vijfde lid][ref4], dan wel mede voor die kosten van een van de
      andere scholen van dat bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel128
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel131
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel29
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel143
    references:
      - id: ref1
