      voorbereidt op het beroep van leraar basisonderwijs, met dien verstande dat dit getuigschrift geen bevoegdheid
      geeft voor wat betreft het onderwijs in lichamelijke oefening, bedoeld in [artikel 14, eerste lid, onder i][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '14'
        paragraaf: '1'
        afdeling: '1'
  - number: 171.3.b
    text: |-
      de akte van bekwaamheid als hoofdleidster bij het kleuteronderwijs en een bij algemene maatregel van bestuur aan te
      wijzen aanvullend bewijs;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel171
  - number: 171.3.c
    text: de akte van bekwaamheid als hoofdonderwijzer;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel171
  - number: 171.3.d
    text: de akte van bekwaamheid als volledig bevoegd onderwijzer;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel171
  - number: 171.3.e
    text: |-
      de middelbare akte pedagogiek B, uitgereikt door de Vereniging tot bevordering van de Studie der Pedagogiek of de
      stichting Raad van Toezicht, Bijstand en Advies voor de Studie der Pedagogiek;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel171
  - number: 171.3.f
    text: |-
      het getuigschrift hoger beroepsonderwijs van met goed gevolg afgelegd examen in de ten minste tweejarige deeltijdse
      studierichting leraar voortgezet onderwijs van de eerste graad in pedagogiek;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel171
  - number: 171.3.g
    text: |-
      de akte van bekwaamheid, uitgereikt door de instituten voor de opleiding van leraren, die uit de openbare kas
      bekostigd zijn krachtens de [Experimentenwet onderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002718
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0002718
  - number: 171.3.h
    text: |-
      het getuigschrift hoger beroepsonderwijs van met goed gevolg afgelegd examen in de ten minste vierjarige
      studierichting opleiding tot leraar voortgezet onderwijs van de tweede graad.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel171
  - number: '171.4'
    text: |-
      Naast de in het eerste lid genoemde bewijzen van bekwaamheid tot het geven van speciaal
      onderwijs verlenen de bewijzen van bekwaamheid die zijn opgenomen in de krachtens
      [artikel 186, vijfde lid, van de Wet op het primair onderwijs][ref1] vastgestelde voorschriften, bevoegdheid
      tot het geven van speciaal onderwijs in de in die voorschriften genoemde onderwijsactiviteiten, met dien
      verstande dat de bewijzen van bekwaamheid die bevoegdheid verlenen voor het geven van onderwijs in de
      onderwijsactiviteit zintuiglijke en lichamelijke oefening bevoegdheid verlenen voor het geven van speciaal
      onderwijs in de onderwijsactiviteiten zintuiglijke oefening en lichamelijke oefening. De in de krachtens de
      [artikelen 108 tot en met 114 van de Overgangswet WVO][ref2] vastgestelde voorschriften opgenomen bewijzen
      van bekwaamheid voor het vak huishoudkunde verlenen bevoegdheid tot het geven van onderwijs in huishoudelijke
      activiteiten, als bedoeld in [artikel 13, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel186
      [ref2]: https://wetten.overheid.nl/BWBR0002595#Artikel108
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel13
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '186'
      - id: ref2
        bwb_id: BWBR0002595
        artikel: '108'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '13'
        paragraaf: '1'
        afdeling: '1'
  - number: '171.5'
    text: |-
      De akten genoemd in het eerste lid onder a, b, d en e, en in het derde lid onder c en d, moeten zijn verkregen aan
      een van rijkswege bekostigd of aangewezen opleidingsinstituut, dan wel na het afleggen van een staatsexamen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel171
  - number: '171.6'
    text: |-
      De bewijzen van bekwaamheid die zijn opgenomen in de krachtens de
      [artikelen 108 tot en met 114 van de Overgangswet WVO][ref1] en de [artikelen 34, tweede en derde lid][ref2],
      en [35, derde en vierde lid, van de Wet op het voortgezet onderwijs][ref3] vastgestelde voorschriften, verlenen
      bevoegdheid tot het geven van voortgezet speciaal onderwijs in de in die voorschriften genoemde vakken, met dien
      verstande dat


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel35
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '108'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '35'
  - number: 171.6.a
    text: |-
      de bewijzen van bekwaamheid die bevoegdheid verlenen voor het geven van onderwijs in het vak Nederlands bevoegdheid
      verlenen voor het geven van voortgezet speciaal onderwijs in het vak Nederlandse taal,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel171
  - number: 171.6.b
    text: |-
      de bewijzen van bekwaamheid die bevoegdheid verlenen voor het geven van onderwijs in het vak wiskunde bevoegdheid
      verlenen voor het geven van voortgezet speciaal onderwijs in het vak wiskunde en rekenen,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel171
  - number: 171.6.c
    text: |-
      de bewijzen van bekwaamheid die bevoegdheid verlenen voor het geven van onderwijs in de met de verschillende
      onderdelen van het vak kennisgebieden overeenkomende vakken bevoegdheid verlenen voor het geven van voortgezet
      speciaal onderwijs in de desbetreffende onderdelen en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel171
  - number: 171.6.d
    text: |-
      de bewijzen van bekwaamheid die bevoegdheid verlenen voor het geven van onderwijs in het vak wiskunde bevoegdheid
      verlenen voor het geven van voortgezet speciaal onderwijs in het vak rekenen en wiskunde.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel171
  - number: '171.7'
    text: |-
      Voor elk van de bewijzen van bekwaamheid bedoeld in het eerste tot en met het vierde lid, kan bij algemene
      maatregel van bestuur worden bepaald in hoeverre een aanvullend bewijs van bekwaamheid gericht op het geven van
      speciaal onderwijs of voortgezet speciaal onderwijs, is vereist.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel171
  - number: '171.8'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke bewijzen van bekwaamheid dan wel welke studies voor
      een bewijs van bekwaamheid in combinatie met een bepaald bewijs van bekwaamheid, bedoeld in dit artikel, een
      bevoegdheid verlenen onderscheidenlijk een tijdelijke bevoegdheid verlenen voor het geven van de bij of krachtens
      de [artikelen 13][ref1] en [14][ref2] vastgestelde onderdelen van het speciaal onderwijs onderscheidenlijk het
      voortgezet speciaal onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel14
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '13'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '14'
        paragraaf: '1'
        afdeling: '1'
  - number: '172.1'
    text: |-
      Onze minister is ten aanzien van de rechtspersoon, bedoeld in [artikel 169][ref1], bevoegd tot:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel169
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '169'
        afdeling: '11'
  - number: 172.1.a
    text: instemming met de statuten van de rechtspersoon, alsmede van wijziging van de statuten;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel172
  - number: 172.1.b
    text: |-
      instemming met de bijdrage, bedoeld in [artikel 169, tweede lid][ref1], voor zover die betrekking heeft op de
      kosten van vervanging van personeel wegens voorschriften die zijn gegeven bij algemene maatregel van bestuur of bij
      ministeriële regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel169
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '169'
        afdeling: '11'
  - number: 172.1.c
    text: |-
      het geven van algemene aanwijzingen aan de rechtspersoon in verband met de minimaal door de rechtspersoon te geven
      waarborgen, bedoeld in [artikel 169, eerste lid][ref1], zulks in verband met de goede voortgang van het onderwijs;


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel169
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '169'
        afdeling: '11'
  - number: 172.1.d
    text: |-
      het geven van algemene aanwijzingen aan de rechtspersoon met het oog op de afstemming van activiteiten van de
      rechtspersoon op het algemene beleid inzake preventie van ziekteverzuim en arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel172
  - number: 172.1.e
    text: |-
      het geven van algemene aanwijzingen aan de rechtspersoon om de nakoming te verzekeren van verplichtingen die bij
      deze wet aan de rechtspersoon zijn opgedragen;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel172
  - number: 172.1.f
    text: |-
      het geven van algemene aanwijzingen aan de rechtspersoon om de door Onze minister gewenste inlichtingen te
      verkrijgen;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel172
  - number: 172.1.g
    text: |-
      het geven van algemene aanwijzingen aan de rechtspersoon in gevallen dat het algemeen belang dit in belangrijke
      mate vereist;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel172
  - number: 172.1.h
    text: intrekking van de aanwijzing van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel172
  - number: '172.2'
    text: |-
      De rechtspersoon brengt jaarlijks voor 1 april aan Onze minister over het afgelopen jaar verslag uit over zijn
      werkzaamheden, voortvloeiend uit [artikel 169][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel169
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '169'
        afdeling: '11'
  - number: '172.3'
    text: |-
      Onze minister zendt het verslag, bedoeld in het tweede lid, vergezeld van zijn advies daarover, voor 1 mei volgend
      op de datum, bedoeld in het tweede lid, aan de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel172
  - number: '172.4'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de uitoefening van de in het eerste
      lid bedoelde bevoegdheden en omtrent de gevolgen van intrekking van de aanwijzing van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel172
  - number: '172.5'
    text: |-
      Krachtens bij algemene maatregel van bestuur vast te stellen voorschriften kan Onze minister subsidie verlenen aan
      de rechtspersoon ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel172
  - number: 172.5.a
    text: |-
      bedragen die, gedurende een vooraf vastgestelde periode en tot een vooraf vastgestelde maximale
      hoogte, strekken ter vervanging van de bekostiging in verband met de kosten van vervanging, bedoeld in
      [artikel 121, eerste lid][ref1], en de bijdrage, bedoeld in [artikel 169, tweede lid][ref2], voor zover die
      betrekking heeft op de kosten van vervanging van personeel wegens voorschriften gegeven bij algemene maatregel van
      bestuur of bij ministeriële regeling,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel169
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '121'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '169'
        afdeling: '11'
  - number: 172.5.b
    text: een bijdrage aan de kosten van de bedrijfsvoering van de rechtspersoon, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel172
  - number: 172.5.c
    text: een bijdrage ten behoeve van de uitoefening van landelijke taken in het kader van de bedrijfsgezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel172
  - number: '172.6'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het vijfde lid, kan ten behoeve van een in dat lid bedoelde
      subsidie een subsidieplafond worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel172
  - number: '172.7'
    text: |-
      De rechtspersoon kan ten behoeve van de uitoefening van landelijke taken in het kader van de
      bedrijfsgezondheidszorg subsidie aan derden verstrekken.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel172
  - number: '172.8'
    text: |-
      Het toezicht op de rechtspersoon is opgedragen aan Onze minister. Met het toezicht zijn belast de bij besluit
      van Onze minister aangewezen ambtenaren. Een besluit als bedoeld in de tweede volzin wordt bekendgemaakt in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel172
  - number: '172.9'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het vierde en vijfde lid, wordt aan de Tweede Kamer der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken
      en gedurende die termijn niet door of namens de Kamer de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel172
  - number: '173.1'
    text: |-
      [Artikel 172][ref1] is van overeenkomstige toepassing ten aanzien van de rechtspersoon, bedoeld in
      [artikel 170][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel172
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel170
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '172'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '170'
        afdeling: '11'
  - number: '173.2'
    text: |-
      Onze Minister zendt binnen vijf jaar na de aanwijzing van de rechtspersoon, bedoeld in [artikel 170][ref1], en
      vervolgens telkens na vijf jaar, aan de Tweede Kamer der Staten-Generaal een verslag over de doeltreffendheid en de
      effecten van de werkzaamheden van die rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel170
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '170'
        afdeling: '11'
  - number: '174'
    text: 'Deze wet wordt aangehaald als: Wet op de expertisecentra.'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel174
