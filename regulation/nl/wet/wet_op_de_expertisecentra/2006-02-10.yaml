        artikel: '114'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '114'
        afdeling: '4'
  - number: '129.1'
    text: |-
      Jaarlijks voor 1 maart kan Onze minister verhoging van de bekostiging worden gevraagd, indien op grond van
      bijzondere omstandigheden van de school, niet zijnde een instelling, in dat jaar, het totale bedrag niet voldoende
      is voor de noodzakelijke uitgaven van de school, niet zijnde een instelling.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel129
  - number: '129.2'
    text: |-
      Een verzoek als bedoeld in het eerste lid, kan slechts worden gedaan door het bevoegd gezag voor zover het
      betreft de materiële instandhouding waarop de programma's van eisen, bedoeld in [artikel 112, eerste lid][ref1],
      betrekking hebben. In afwijking van de vorige volzin kan ingeval [artikel 116, tweede, derde of vierde lid][ref2],
      is toegepast, het bevoegd gezag dat dan wel de gemeente die de materiële instandhouding geheel of gedeeltelijk
      verzorgt, het verzoek indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel116
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '112'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '116'
        afdeling: '4'
  - number: '129.3'
    text: 'Onze minister wijst het verzoek in elk geval af indien:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel129
  - number: 129.3.a
    text: |-
      in het jaar waarvoor de programma's van eisen zijn vastgesteld, het totaal van de noodzakelijke uitgaven voor de
      materiële instandhouding van de school niet ten minste 5% meer zal bedragen dan het totaal van de uit 's Rijks kas
      daarvoor te verstrekken inkomsten,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel129
  - number: 129.3.b
    text: |-
      de bijzondere omstandigheden het gevolg zijn van een bij algemene maatregel van bestuur aan te geven omstandigheid
      of afwijking van de omvang van de componenten van de voorziening ten aanzien waarvan de bijzondere omstandigheden
      zouden bestaan,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel129
  - number: 129.3.c
    text: |-
      de bijzondere omstandigheid het gevolg is van een verschil tussen het prijsniveau in enig jaar en de op grond van
      [artikel 111][ref1] aangepaste bedragen, of


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel111
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '111'
        afdeling: '4'
  - number: 129.3.d
    text: |-
      het bevoegd gezag dat of de gemeente die het verzoek heeft ingediend, niet aantoont dat het de bijzondere
      omstandigheden niet op enigerlei wijze had kunnen voorkomen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel129
  - number: '129.4'
    text: |-
      Een verzoek als bedoeld in het eerste lid gaat vergezeld van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], van de juistheid van de gegevens die bij
      het verzoek zijn gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '129.6'
    text: |-
      Onze minister besluit binnen drie maanden. Indien technisch onderzoek zulks noodzakelijk maakt, kan Onze minister
      deze termijn eenmaal met ten hoogste zes maanden verdagen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel129
  - number: '129.7'
    text: |-
      Onze minister kan in verband met de in het eerste lid bedoelde verhoging een bekostigingsplafond instellen. In dat
      geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel129
  - number: '130.1'
    text: |-
      De gemeente verstrekt jaarlijks aan het bevoegd gezag van een niet door de gemeente in stand gehouden school dat
      eigenaar is van een ruimte voor het onderwijs in lichamelijke oefening op het grondgebied van de gemeente
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel130
  - number: 130.1.a
    text: |-
      een bekostigingsbedrag dat wordt bepaald ingevolge [artikel 115 en het derde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel115
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '115'
        afdeling: '4'
  - number: 130.1.b
    text: |-
      voor zover het gebruik van die ruimte ontoereikend is een overeenkomstig het tweede lid vast te stellen
      bekostigingsbedrag.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel130
  - number: '130.2'
    text: |-
      Voor zover geen ruimte ter beschikking is gesteld als bedoeld in [artikel 115, eerste lid onder a][ref1], verstrekt
      de gemeente jaarlijks aan het bevoegd gezag van een niet door de gemeente in stand gehouden school dat geen
      eigenaar is van een ruimte voor het onderwijs in lichamelijke oefening een bekostigingsbedrag dat wordt bepaald
      ingevolge [artikel 115, eerste lid onder b, en derde lid onder a, en het derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel115
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '115'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '115'
        afdeling: '4'
  - number: '130.3'
    text: |-
      Het aantal groepen leerlingen wordt voor scholen, niet zijnde instellingen, berekend overeenkomstig
      [artikel 128, vierde lid onder a, vijfde lid onder a, en zesde lid onder a][ref1], en de ter uitvoering daarvan
      vastgestelde algemene maatregel van bestuur, met dien verstande dat groepen waarvoor van rijkswege bekostiging
      wordt verstrekt voor de kosten van de materiële instandhouding van een speellokaal niet in aanmerking worden
      genomen. Het aantal groepen leerlingen wordt voor instellingen berekend op een bij algemene maatregel van bestuur
      te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel128
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '128'
        paragraaf: '2'
        afdeling: '7'
  - number: '131.1'
    text: |-
      Met inachtneming van de [artikelen 117][ref1] en [118][ref2] verstrekt het Rijk jaarlijks aan het bevoegd gezag een
      bekostigingsbedrag ten behoeve van de personeelskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel118
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '118'
        afdeling: '5'
  - number: '131.2'
    text: |-
      In geval van het verstrekken van bijzondere bekostiging als bedoeld in [artikel 120][ref1] verstrekt het Rijk aan
      het desbetreffende bevoegd gezag het bedrag van deze bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel120
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '120'
        afdeling: '5'
  - number: '131.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot het betalen van het
      in de eerste volzin bedoelde bedrag.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel131
  - number: '131.4'
    text: |-
      Op het in het eerste en tweede lid bedoelde bedrag worden op een bij ministeriële regeling vast te stellen wijze
      in mindering gebracht de inkomsten die het bevoegd gezag dan wel het regionaal expertisecentrum direct of indirect
      geniet vanwege uitkeringen of toelagen waarop door het personeel aanspraak kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel131
  - number: '132.1'
    text: |-
      Op de bekostiging, bedoeld in [artikel 131][ref1], worden in mindering gebracht de salarissen, toelagen,
      uitkeringen of andere bijdragen waarop aanspraak wordt gemaakt door personeel dat is benoemd met voorbijgaan van
      personeel dat een gelijksoortige functie uitoefent of heeft uitgeoefend aan een gelijksoortige school van het
      bevoegd gezag, voor zover laatstbedoeld personeel


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel131
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '131'
        paragraaf: '3'
        afdeling: '7'
  - number: 132.1.a
    text: |-
      gebruik maakt van een krachtens [artikel 33, tweede lid][ref1], vastgestelde regeling voor onvrijwillige
      taakvermindering, of


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel33
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '33'
        paragraaf: '2'
        afdeling: '1'
  - number: 132.1.b
    text: |-
      voor zover zich geen geval voordoet als bedoeld onder a, in het genot is van wachtgeld of van een andere
      ontslaguitkering en direct aan die ontslaguitkering voorafgaand langer dan een jaar onafgebroken in dienst is
      geweest van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel132
  - number: '132.2'
    text: |-
      Op de bekostiging, bedoeld in [artikel 131][ref1], worden eveneens in mindering gebracht de salarissen, toelagen,
      uitkeringen of andere bijdragen waarop aanspraak wordt gemaakt door personeel dat langer dan 1 jaar anders
      dan wegens vervanging, dan wel een benoeming met toepassing van [artikel 3, zesde lid, tweede volzin][ref2],
      onafgebroken, met een onderbreking van een week of minder, dan wel met een of meer onderbrekingen gedurende een
      schoolvakantie, in een gelijksoortige functie in tijdelijke dienst verbonden is geweest aan een school van het
      bevoegd gezag. De termijn van 1 jaar kan ingeval van een of meer ziekteperioden van langer dan 4 weken met deze
      ziekteperioden worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel3
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '131'
        paragraaf: '3'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '3'
  - number: '132.3'
    text: |-
      Op de bekostiging worden eveneens in mindering gebracht de kosten van werkloosheidsuitkeringen, suppleties inzake
      arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan
      op grond van de [Ziektewet][ref1]. De eerste volzin is niet van toepassing, indien de rechtspersoon, bedoeld in
      [artikel 170][ref2], op een daartoe strekkend verzoek van het bevoegd gezag, voorafgaand aan het ontslag heeft
      ingestemd met het ten laste van die rechtspersoon brengen van de kosten van uitkeringen of suppleties als bedoeld
      in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel170
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '170'
        afdeling: '11'
  - number: '132.4'
    text: |-
      Het eerste lid is eveneens van toepassing, indien de benoeming heeft plaatsgevonden in aansluiting op een benoeming
      in tijdelijke dienst in dezelfde functie.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel132
  - number: '132.5'
    text: |-
      Met gewezen personeel dat in het genot is van wachtgeld of van een andere ontslaguitkering als bedoeld in het
      eerste lid onder b, wordt gelijk gesteld personeel aan wie op grond van het leerlingenverloop op of na 1 februari
      ontslag is of zal worden aangezegd, op grond van welk ontslag recht op wachtgeld of een andere ontslaguitkering zou
      kunnen ontstaan. In afwijking van de eerste volzin kan voor een periode tot uiterlijk de datum van ingang van het
      recht op wachtgeld of op een andere ontslaguitkering in een vacature worden voorzien zonder dat de vermindering,
      bedoeld in het eerste lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel132
  - number: '132.6'
    text: |-
      Bij ministeriële regeling wordt bepaald in welke gevallen geen vermindering als bedoeld in het eerste en tweede
      lid plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel132
  - number: '132.7'
    text: |-
      Onze minister kan in andere gevallen dan voorzien in de ministeriële regeling bedoeld in het zesde lid, wegens
      gewichtige redenen op verzoek van het bevoegd gezag besluiten dat de vermindering van de bekostiging, bedoeld in
      het eerste lid, niet zal plaatsvinden. Onze minister besluit binnen 4 maanden na ontvangst van het verzoek. Indien
      het besluit niet binnen 4 maanden kan worden genomen, stelt Onze minister de verzoeker daarvan in kennis en noemt
      hij daarbij een redelijke termijn waarop het besluit wel tegemoet kan worden gezien. Uitsluitend op grond van door
      het bevoegd gezag aangevoerde bijzondere omstandigheden kan Onze minister bepalen dat het besluit, bedoeld in de
      eerste volzin, betrekking heeft of mede betrekking heeft op een periode voorafgaand aan de datum waarop het bevoegd
      gezag het in de eerste volzin bedoelde verzoek heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel132
  - number: '132.8'
    text: Onze minister kan projecten aanwijzen waarvoor het tweede lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel132
  - number: '133.1'
    text: |-
      [Artikel 132][ref1] is van overeenkomstige toepassing indien de rechtspersoon, bedoeld in de
      [artikelen 28b][ref2] en [69][ref3], personeel benoemt met voorbijgaan van gewezen personeel als bedoeld in
      [artikel 132, eerste en vijfde lid][ref4], van de rechtspersoon of van een bevoegd gezag waarvoor diensten
      worden verricht, dan wel niet handelt overeenkomstig het bepaalde in laatstgenoemde artikelleden. Van het gewezen
      personeel, bedoeld in de eerste volzin, is uitgezonderd het personeel van het bevoegd gezag waarvoor diensten
      worden verricht, waarvan de dienstbetrekking is beëindigd op een tijdstip dat meer dan twee jaar ligt voor de
      aanvang van de dienstverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel28b
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel69
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel132
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '132'
        paragraaf: '3'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 28b
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '69'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: '132'
        paragraaf: '3'
        afdeling: '7'
  - number: '133.2'
    text: |-
      In geval van toepassing van het eerste lid wordt het in mindering te brengen bedrag in gelijke mate verdeeld over
      de scholen waarvoor diensten worden verricht.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel133
  - number: '133.3'
    text: |-
      [Artikel 132][ref1] is eveneens van overeenkomstige toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel132
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '132'
        paragraaf: '3'
        afdeling: '7'
  - number: 133.3.a
    text: |-
      indien een bevoegd gezag waarvoor diensten worden verricht, personeel benoemt met voorbijgaan van gewezen personeel
      van de rechtspersoon, bedoeld in de [artikelen 28b][ref1] en [69][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel69
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28b
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '69'
  - number: 133.3.b
    text: |-
      indien een bevoegd gezag waarvoor geen diensten meer worden verricht, in het tijdvak van vijf jaar na beëindiging
      van de dienstverlening personeel benoemt met voorbijgaan van gewezen personeel als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel133
  - number: '134.1'
    text: |-
      Indien in een gemeente uitsluitend een of meer andere rechtspersonen dan de gemeente openbare scholen in stand
      houden waar een bepaalde soort speciaal onderwijs of een bepaalde soort voortgezet speciaal onderwijs wordt gegeven
      dan wel dergelijke scholen ontbreken en de gemeente uitgaven wil doen voor dat onderwijs welke niet door het Rijk
      worden bekostigd, stelt de gemeenteraad onverminderd [artikel 153, eerste lid][ref1], bij verordening een regeling
      daarvoor vast en zijn de [artikelen 136 tot en met 142][ref2] voor dat onderwijs niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel153
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel136
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '153'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '136'
        paragraaf: '5'
        afdeling: '7'
  - number: '134.2'
    text: |-
      De regeling, bedoeld in het eerste lid, maakt geen onderscheid tussen openbaar en bijzonder onderwijs en voorziet
      in een behandeling van scholen naar dezelfde maatstaf.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel134
  - number: '134.3'
    text: |-
      De regeling, bedoeld in het eerste lid, bevat in elk geval de voorzieningen die door het bevoegd gezag van een in
      de gemeente gelegen, niet door de gemeente in stand gehouden school kunnen worden aangevraagd en de procedure voor
      het doen van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel134
  - number: '134.4'
    text: |-
      De gemeenteraad kan besluiten dat burgemeester en wethouders de regeling, bedoeld in het eerste lid, tijdelijk
      kunnen aanvullen met nieuwe voorzieningen. De aanvulling wordt binnen 1 week aan de bevoegde gezagsorganen van de
      niet door de gemeente in stand gehouden scholen gezonden. Binnen 12 weken na de totstandkoming van de aanvulling
      wordt deze voorgelegd aan de gemeenteraad en besluit de gemeenteraad over de bekrachtiging ervan. Indien de
      gemeenteraad niet binnen 12 weken heeft besloten, wordt de aanvulling gelijkgesteld met een aanvulling die is
      bekrachtigd. Een afwijzing van de aanvulling door de gemeenteraad heeft geen gevolgen voor aanvragen waarop reeds
      is besloten of die reeds zijn ingediend en die voorzieningen betreffen waarop de aanvulling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel134
  - number: '134.5'
    text: |-
      [Artikel 8:2 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de regeling, bedoeld in het eerste
      lid, dan wel een wijziging daarvan. In afwijking van [artikel 8:1 van de Algemene wet bestuursrecht][ref2] kan
      tegen een aanvulling als bedoeld in het vierde lid geen beroep worden ingesteld zolang de gemeenteraad deze nog
      niet heeft bekrachtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '134.6'
    text: |-
      Voor de toepassing van dit artikel wordt een nevenvestiging aangemerkt als een nevenvestiging die is gelegen in
      de gemeente van de hoofdvestiging. De gemeenteraad kan besluiten dat in de gemeente gelegen nevenvestigingen van
      scholen waarvan de hoofdvestiging is gelegen in een andere gemeente in afwijking van de eerste volzin in aanmerking
      komen voor een of meer van de in de regeling genoemde voorzieningen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel134
  - number: '134.7'
    text: |-
      Burgemeester en wethouders maken jaarlijks in een van overheidswege uitgegeven blad of een dag-, nieuws- of huis-
      aan-huisblad, dan wel op een andere geschikte wijze, een overzicht bekend van de op grond van de regeling, bedoeld
      in het eerste lid, toegekende voorzieningen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel134
  - number: 134a.1
    text: |-
      Indien de gemeenteraad ten aanzien van een of meer door de gemeente in stand gehouden openbare scholen besluit dat
      deze met ingang van een datum die is gelegen in de periode die aanvangt met een bij koninklijk besluit te bepalen
      datum en eindigt met ingang van het zevende kalenderjaar daaropvolgend, in stand zullen worden gehouden door een
      of meer andere rechtspersonen dan de gemeente, kan de regeling, bedoeld in [artikel 134, eerste lid][ref1], dan
      wel de regeling, bedoeld in [artikel 135, eerste lid][ref2], bij effectuering van dat besluit ten aanzien van
      die scholen en in afwijking van [artikel 134, tweede lid][ref3], dan wel een regeling op grond van dit artikel
      bij effectuering van dat besluit ten aanzien van die scholen, erin voorzien dat door een gemeente aan een of meer
      andere rechtspersonen dan de gemeente die die scholen in stand houden, een vergoeding voor administratie, beheer en
      bestuur wordt toegekend als aangegeven in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel135
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel134
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel134a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '134'
        paragraaf: '4'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '135'
        paragraaf: '4'
        afdeling: '7'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '134'
        paragraaf: '4'
        afdeling: '7'
  - number: 134a.2
    text: |-
      De vergoeding, die op grond van het eerste lid kan worden toegekend, bedraagt gedurende het eerste en het
      tweede kalenderjaar volgend op het tijdstip waarop de scholen, bedoeld in het eerste lid, niet langer door de
      gemeente in stand worden gehouden, maximaal 4 maal het bedrag voor administratie, beheer en bestuur, op grond van
      [artikel 112, eerste lid, onderdeel e][ref1], en gedurende het derde, vierde en vijfde kalenderjaar maximaal 3 maal
      dat bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel112
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel134a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '112'
        afdeling: '4'
  - number: 134a.3
    text: |-
      Indien de gemeenteraad besluit scholen niet langer in stand te houden vanaf een andere datum dan 1 januari dan
      geldt als het eerste kalenderjaar, bedoeld in het tweede lid, het deel van het kalenderjaar dat volgt op de
      datum waarop de gemeente die scholen niet langer in stand houdt en bedraagt de vergoeding die voor dat eerste
      kalenderjaar maximaal kan worden toegekend voor administratie, beheer en bestuur een evenredig deel van de
      vergoeding die op grond van het tweede lid maximaal kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel134a
  - number: 134a.4
    text: |-
      Voor de toepassing van het tweede lid wordt per school uitgegaan van het leerlingenaantal, bedoeld in
      [artikel 128][ref1], zoals dat gold voor de berekening van het bedrag voor administratie, beheer en bestuur voor
      het kalenderjaar direct voorafgaand aan het tijdstip waarop door de gemeente de desbetreffende school niet langer
      in stand wordt gehouden en het prijspeil in dat kalenderjaar. De korting wegens rente-ontvangsten uit gevormde
      reserves van de programma's van eisen, bedoeld in [artikel 112, eerste lid, onderdelen a en d][ref2], blijft
      daarbij buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel112
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel134a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '128'
        paragraaf: '2'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '112'
        afdeling: '4'
  - number: 134a.5
    text: |-
      De op grond van het eerste lid toe te kennen vergoeding kan in een kalenderjaar niet hoger zijn dan de in het
      daaraan voorafgaande kalenderjaar op grond van dit artikel toegekende vergoeding. De eerste volzin is niet
      van toepassing ten aanzien van de vergoeding voor het tweede kalenderjaar indien de vergoeding voor het eerste
      kalenderjaar is bepaald op grond van het derde lid. Bij de toepassing van de eerste volzin blijft het teruggestorte
      bedrag, bedoeld in het zevende lid, buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel134a
  - number: 134a.6
    text: |-
      Het bevoegd gezag dat een school als bedoeld in het eerste lid in stand houdt die voor die tijd door de gemeente
      in stand werd gehouden, legt aan die gemeente en aan de andere rechtspersonen die een of meer niet door de gemeente
      in stand gehouden scholen in die gemeente in stand houden, jaarlijks een verklaring van een accountant als bedoeld
      in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] over met betrekking tot de uitgaven en
      ontvangsten voor administratie, beheer en bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel134a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 134a.7
    text: |-
      Voor zover voor een school als bedoeld in het eerste lid, de vergoeding, bedoeld in het eerste lid, vermeerderd
      met het bedrag op grond van [artikel 112, eerste lid, onderdeel e][ref1], in een kalenderjaar niet volledig is
      aangewend voor uitgaven voor administratie, beheer en bestuur, wordt het verschil door het bevoegd gezag, bedoeld
      in het zesde lid, teruggestort in de gemeentekas.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel112
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel134a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '112'
        afdeling: '4'
  - number: '135.1'
    text: |-
      Indien een gemeente zelf een of meer openbare scholen in stand houdt en zij uitgaven wil doen voor het onderwijs
      welke niet door het Rijk worden bekostigd, kan de gemeenteraad onverminderd [artikel 153, eerste lid][ref1],
      daarvoor bij verordening een regeling vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel153
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '153'
        afdeling: '9'
  - number: '135.2'
    text: |-
      [Artikel 134, tweede tot en met zevende lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel134
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '134'
        paragraaf: '4'
        afdeling: '7'
  - number: '136.1'
    text: |-
      Indien een gemeente ten behoeve van een of meer door haar in stand gehouden scholen meer uitgaven doet voor
      het personeel en de materiële instandhouding dan door het Rijk worden bekostigd, wordt met inachtneming van
      de [artikelen 136 tot en met 142][ref1] aan het bevoegd gezag van de in die gemeente gevestigde niet door de
      gemeente in stand gehouden scholen om de vijf jaar een overschrijdingsbedrag verstrekt. Voor de toepassing van de
      eerste volzin worden ontvangsten, op grond van [artikel 128, tweede lid, tweede volzin][ref2], gelijk gesteld met
      ontvangsten van het Rijk. Indien een gemeente vanaf een tijdstip binnen een periode van vijf jaar als bedoeld in de
      eerste volzin geen school in stand houdt, wordt het overschrijdingsbedrag in afwijking van die volzin uiterlijk 31
      december van het kalenderjaar dat volgt op dat tijdstip waarop de gemeente niet langer een school in stand houdt,
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel136
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel128
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '136'
        paragraaf: '5'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '128'
        paragraaf: '2'
        afdeling: '7'
  - number: '136.2'
    text: |-
      Voor de toepassing van de [artikelen 136 tot en met 142][ref1] worden uitgaven ten behoeve van een nevenvestiging
      aangemerkt als uitgaven ten behoeve van de hoofdvestiging van de school waaraan de nevenvestiging is
      verbonden. Indien ten behoeve van een school of nevenvestiging uitgaven worden gedaan door meer dan één
      gemeente, worden deze uitgaven aangemerkt als uitgaven van de gemeente op wier grondgebied de hoofdvestiging
      is gelegen. In het geval, bedoeld in de vorige volzin, worden de besluiten ingevolge het vierde lid en de
      [artikelen 137 tot en met 142][ref2] genomen door laatstbedoelde gemeente en hebben deze mede betrekking op de
      uitgaven van de andere gemeente of gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel136
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel137
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '136'
        paragraaf: '5'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '137'
        paragraaf: '5'
        afdeling: '7'
  - number: '136.3'
    text: |-
      Voor de toepassing van de [artikelen 136 tot en met 142][ref1] wordt een nevenvestiging in een andere gemeente
      dan waarin de hoofdvestiging is gelegen, aangemerkt als een nevenvestiging die is gelegen in de gemeente van de
      hoofdvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel136
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '136'
        paragraaf: '5'
        afdeling: '7'
  - number: '136.4'
    text: |-
      De gemeenteraad kan in overeenstemming met het bevoegd gezag van een niet door de gemeente in stand gehouden
      school besluiten dat met betrekking tot een of meer scholen van dat bevoegd gezag uitgaven die de gemeente doet
      ten behoeve van een door haar in stand gehouden school buiten beschouwing worden gelaten bij het vaststellen van de
      bedragen, bedoeld in de [artikelen 137][ref1] en [138][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel138
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '137'
        paragraaf: '5'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '138'
        paragraaf: '5'
        afdeling: '7'
  - number: '137.1'
    text: |-
      De gemeenteraad stelt jaarlijks vast in welke mate zij ten behoeve van de door de gemeente in stand gehouden
      scholen meer dan wel minder uitgaven zal doen voor het personeel en de materiële instandhouding dan door het
      Rijk worden bekostigd. Deze vaststelling geschiedt voor het komende begrotingsjaar en het resterende deel van het
      vijfjarig tijdvak, bedoeld in [artikel 136, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel136
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '136'
        paragraaf: '5'
        afdeling: '7'
  - number: '137.2'
    text: |-
      Indien voor het komende begrotingsjaar meer uitgaven zullen worden gedaan voor het personeel en de materiële
      instandhouding dan door het Rijk worden bekostigd, verlenen burgemeester en wethouders in dat begrotingsjaar
      aan het bevoegd gezag van de niet door de gemeente in stand gehouden scholen in de gemeente een voorschot op het
      te verwachten overschrijdingsbedrag, bedoeld in [artikel 136, eerste lid][ref1]. Indien uit het besluit van de
      gemeenteraad, bedoeld in het eerste lid, blijkt dat de hiervoor bedoelde meer-uitgaven in de resterende jaren van
      het vijfjarig tijdvak geheel of ten dele worden gecompenseerd door minder uitgaven, wordt hiermee rekening gehouden
      bij de bepaling van de hoogte van het voorschot.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel136
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '136'
        paragraaf: '5'
        afdeling: '7'
  - number: '137.3'
    text: |-
      Indien uit de jaarlijkse voorlopige vaststelling van de bedragen, bedoeld in [artikel 138, eerste lid][ref1],
      blijkt dat, in afwijking van hetgeen is vastgesteld bij het besluit van de gemeenteraad, bedoeld in het eerste lid,
      meer uitgaven zijn gedaan voor personeel en materiële instandhouding dan door het Rijk worden bekostigd, verlenen
      burgemeester en wethouders alsnog een voorschot aan het bevoegd gezag van de niet door de gemeente in stand
      gehouden scholen in de gemeente. Bij de bepaling van de hoogte van het voorschot is de tweede volzin van het tweede
      lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel138
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '138'
        paragraaf: '5'
        afdeling: '7'
  - number: '138.1'
    text: |-
      Indien een gemeente een of meer scholen in stand houdt, stelt de gemeenteraad onderscheiden per schoolsoort,
      alsmede al naar gelang het speciaal onderwijs, dan wel voortgezet speciaal onderwijs betreft, jaarlijks voorlopig
      vast:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
  - number: 138.1.a
    text: het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van personeelskosten,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
  - number: 138.1.b
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van personeels- en
      arbeidsmarktbeleid als bedoeld in [artikel 124][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel124
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '124'
        afdeling: '6'
  - number: 138.1.c
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de materiële
      instandhouding,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
  - number: 138.1.d
    text: |-
      het totaal van de ontvangsten, bedoeld in [artikel 131][ref1], in het voorafgaande kalenderjaar,.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel131
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '131'
        paragraaf: '3'
        afdeling: '7'
  - number: 138.1.e
    text: |-
      het totaal van de ontvangsten dat is gebaseerd op de bedragen die krachtens [artikel 124, tweede lid][ref1], ten
      behoeve van personeels- en arbeidsmarktbeleid voor het kalenderjaar zijn vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel124
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '124'
        afdeling: '6'
  - number: 138.1.f
    text: |-
      het totaal van de ontvangsten dat is gebaseerd op de bedragen die krachtens [artikel 111][ref1] voor de
      voorzieningen voor de materiële instandhouding voor dat kalenderjaar zijn vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel111
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '111'
        afdeling: '4'
  - number: 138.1.g
    text: |-
      het totaal van de aanvullende ontvangsten waaronder worden verstaan de bedragen die krachtens [artikel 129][ref1]
      voor de voorzieningen ten behoeve van de materiële instandhouding voor dat kalenderjaar zijn vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel129
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '129'
        paragraaf: '2'
        afdeling: '7'
  - number: 138.1.h
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de instandhouding
      van een rechtspersoon als bedoeld in [artikel 69][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel69
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '69'
  - number: 138.1.i
    text: |-
      het totaal van de ontvangsten, op grond van [artikel 128, tweede lid, tweede volzin][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel128
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '128'
        paragraaf: '2'
        afdeling: '7'
  - number: 138.1.j
    text: een staat van voorzieningen die zijn ingesteld ten behoeve van de door de gemeente in stand gehouden scholen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
  - number: '138.2'
    text: |-
      Indien de gemeente een deel van de ontvangsten bedoeld in het eerste lid onder d, of een deel van de ontvangsten,
      bedoeld in dat lid onder e, f, g en i, toevoegt aan een voorziening, wordt dat deel aangemerkt als een uitgave als
      bedoeld in dat lid onder a, onderscheidenlijk als een uitgave als bedoeld in dat lid onder b, c en h. Indien de
      gemeente ten behoeve van de personeelskosten, de nascholingskosten, de kosten voor materiële instandhouding of de
      kosten voor de instandhouding van een rechtspersoon als bedoeld in [artikel 69][ref1], bedragen aan een voorziening
      onttrekt, worden deze aangemerkt als ontvangsten als bedoeld in het eerste lid onder d, e of f.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel69
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '69'
  - number: '138.3'
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid onder c, f, g en h, worden buiten beschouwing
      gelaten de uitgaven en ontvangsten voor:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
  - number: 138.3.a
    text: |-
      administratie, beheer en bestuur, bedoeld in [artikel 112, eerste lid onder e][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel112
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '112'
        afdeling: '4'
  - number: 138.3.b
    text: |-
      de materiële instandhouding van het onderwijs in lichamelijke oefening, en van watergewenning of bewegingstherapie,
      en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
  - number: 138.3.c
    text: |-
      de materiële instandhouding in verband met de toepassing van [artikel 153, eerste lid][ref1], dan wel, indien het
      een instelling betreft, de bedragen, bedoeld in [artikel 114, tweede lid][ref2], en de daarmee verbandhoudende
      uitgaven, alsmede de uitgaven en ontvangsten voor de materiële instandhouding in verband met de toepassing van
      [artikel 153, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel153
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel114
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel153
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '153'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '114'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '153'
        afdeling: '9'
  - number: '138.4'
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid onder a, worden buiten beschouwing gelaten de
      uitgaven ten behoeve van personeel dat door de gemeente met toepassing van [artikel 153, eerste lid][ref1],
      aan een openbare school wordt verbonden. Bij het vaststellen van de bedragen, bedoeld in het eerste lid onder
      a, b, c en h, worden voorts buiten beschouwing gelaten de uitgaven die worden gedekt door ontvangsten van
      bedragen die door derden zijn betaald, de uitgaven die worden gedekt door ontvangsten op grond van een besluit
      als bedoeld in [artikel 134, zesde lid, tweede volzin][ref2], en de uitgaven voor de voorzieningen waarvoor
      het bevoegd gezag van een niet door de gemeente in stand gehouden school op grond van de regeling, bedoeld in
      [artikel 135, eerste lid][ref3], een aanvraag bij de gemeente kon indienen en wel gedurende de periode waarvoor een
      dergelijke aanvraag kon worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel153
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel134
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel135
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
