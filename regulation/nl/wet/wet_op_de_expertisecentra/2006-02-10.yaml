  - number: 143.2.a
    text: een regionaal expertisecentrum, een centrale dienst of een andere school;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel143
  - number: 143.2.b
    text: |-
      een centrale dienst of een basisschool of een speciale school voor basisonderwijs als bedoeld in
      de [Wet op het primair onderwijs][ref1] of een centrale dienst dan wel een school als bedoeld in de
      [Wet op het voortgezet onderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel143
