        artikel: '116'
        afdeling: '4'
  - number: '128.2'
    text: |-
      Het Rijk verstrekt jaarlijks aan de provincie Fryslân bekostiging ten behoeve van de materiële instandhouding, voor
      zover het betreft het onderwijs in de Friese taal, bedoeld in [artikel 13, zesde lid][ref1]. De provincie Fryslân
      draagt zorg voor verdeling van de bekostiging over de betrokken scholen naar rato van het aantal leerlingen dat
      gebruik maakt van dat onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel13
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel128
    references:
