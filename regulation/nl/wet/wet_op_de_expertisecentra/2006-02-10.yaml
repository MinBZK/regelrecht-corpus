preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter bevordering van een ononderbroken ontwikkeling van de kinderen
    voor wie vaststaat dat overwegend een orthopedagogische en orthodidactische benadering aangewezen is, gewenst is
    wettelijke voorzieningen voor het speciaal onderwijs en het voortgezet speciaal onderwijs te treffen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder: *Onze minister*: Onze minister van Onderwijs, Cultuur en Wetenschap; *inspectie
      of inspecteur*: de inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref1], voor zover belast met taken
      op het gebied van het speciaal onderwijs en voortgezet speciaal onderwijs; *school:* een school voor speciaal
      onderwijs, voor voortgezet speciaal onderwijs of voor speciaal en voortgezet speciaal onderwijs als bedoeld
      in [artikel 2, tweede lid onder a, b, c, f, h, j, k, m of n][ref2], dan wel een instelling voor speciaal en
      voortgezet speciaal onderwijs als bedoeld in [artikel 8, eerste lid tweede volzin][ref3], tenzij het tegendeel
      blijkt; *basisschool:* een basisschool als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref4];
      *speciale school voor basisonderwijs*: een speciale school voor basisonderwijs als bedoeld in
      [artikel 1 van de Wet op het primair onderwijs][ref5]; *school voor voortgezet onderwijs*: een school
      voor voortgezet onderwijs als bedoeld in [artikel 1 van de Wet op het voortgezet onderwijs][ref6];
      *instelling*: instelling als bedoeld in [artikel 8, eerste lid, tweede volzin][ref7]; *openbare school:* a.
      een door een of meer gemeenten, al dan niet te zamen met een of meer privaatrechtelijke rechtspersonen met
      volledige rechtsbevoegdheid in stand gehouden school; b. een door een openbare rechtspersoon als bedoeld in
      [artikel 50][ref8] in stand gehouden school; dan wel c. een door een stichting als bedoeld in [artikel 28][ref9]
      of [artikel 51][ref10] in stand gehouden school; *bijzondere school*: door een natuurlijk persoon of een
      privaatrechtelijke rechtspersoon, niet zijnde een stichting als bedoeld in [artikel 51][ref11], in stand gehouden
      school; *openbare rechtspersoon*: een rechtspersoon die krachtens publiekrecht is ingesteld als bedoeld in
      [artikel 50][ref12]; *bevoegd gezag van volgens deze wet bekostigde scholen* voor wat betreft: a. een openbare
      school: 1°. het college van burgemeester en wethouders, voor zover de raad niet anders bepaalt, en, indien
      de raad dit besluit, met inachtneming van door hem te stellen regelen; 2°. het krachtens de desbetreffende
      gemeenschappelijke regeling bevoegde orgaan; 3°. de openbare rechtspersoon, bedoeld in [artikel 50][ref13];
      dan wel 4°. de stichting, bedoeld in [artikel 28][ref14] of [artikel 51][ref15]; b. een bijzondere school: de
      rechtspersoon bedoeld in [artikel 57][ref16]; *Informatie Beheer Groep:* de Informatie Beheer Groep, genoemd in
      de [Wet verzelfstandiging Informatiseringsbank][ref17]; *persoonsgebonden nummer:* het sociaal-fiscaalnummer,
      bedoeld in [artikel 2, derde lid, onder j, van de Algemene wet inzake rijksbelastingen][ref18], dan wel het door de
      Informatie Beheer Groep uitgegeven onderwijsnummer, bedoeld in [artikel 42a, vierde lid][ref19]; *ouders*: ouders,
      voogden of verzorgers; *schooljaar*: het tijdvak van 1 augustus tot en met 31 juli daaraanvolgend; *personeel*: a.
      de benoemde directeur, het personeel benoemd in een functie voor het geven van onderwijs, het personeel benoemd in
      een andere functie dan het geven van onderwijs, het personeel dat is benoemd voor het verrichten van werkzaamheden
      ten behoeve van meer dan een school of meer dan een school als bedoeld in de [Wet op het primair onderwijs][ref20];
      b. het onder a bedoelde personeel dat zonder benoeming is tewerkgesteld, tenzij het betreft de toepassing
      van de [artikelen 33][ref21], [33a][ref22], [34][ref23], [37][ref24], [38][ref25], [55][ref26],
      [56, eerste en tweede lid][ref27], [62, eerste tot en met vierde lid][ref28], [63 tot en met 65][ref29],
      [69][ref30], [132][ref31] en [133][ref32], voor zover niet anders is bepaald, en de toepassing van daarmee verband
      houdende wettelijke bepalingen; *schoolplan*: een schoolplan als bedoeld in [artikel 21][ref33]. Onder schoolplan
      wordt tevens verstaan instellingsplan, tenzij het tegendeel blijkt; *commissie voor de indicatiestelling*: een
      commissie als bedoeld in [artikel 28c][ref34].


