  - number: 138.4a
    text: |-
      Bij het vaststellen van de bedragen bedoeld in het eerste lid, onder c, mogen voorzieningen die volgens de
      desbetreffende rijksbekostiging een afschrijvingstermijn van ten minste 20 jaar hebben, over ten hoogste 20 jaar
      worden aangemerkt als jaarlijkse uitgave op grond van rente op basis van een fictieve lening met een looptijd van
      ten hoogste 20 jaar en een lineaire aflossing.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
  - number: '138.5'
    text: |-
      Indien de gemeente een deel van de bekostiging voor personeelskosten en kosten voor materiële instandhouding
      overdraagt aan een ander bevoegd gezag, wordt dat deel aangemerkt als een uitgave als bedoeld in het eerste lid,
      onderdeel a, of onderdeel c. Indien door een ander bevoegd gezag een deel van de bekostiging voor personeelskosten
      en kosten voor materiële instandhouding aan de gemeente wordt overgedragen, wordt dat deel aangemerkt als een
      ontvangst als bedoeld in het eerste lid, onderdeel d, of onderdeel f.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
  - number: '138.6'
    text: |-
      Om de vijf jaar stelt de gemeenteraad voorlopig vast het totaal van de vastgestelde uitgaven en ontvangsten in de
      voorafgaande vijf kalenderjaren, zoals in het eerste tot en met vijfde lid is aangegeven. Indien de uitgaven hoger
      zijn dan de ontvangsten, bepaalt de gemeenteraad tevens het bedrag van de overschrijding. Indien een gemeente vanaf
      een tijdstip binnen een periode van vijf jaar als bedoeld in de eerste volzin geen school in stand houdt, stelt
      de gemeenteraad in afwijking van die volzin zo spoedig mogelijk na dat tijdstip voorlopig vast het totaal van de
      vastgestelde uitgaven en ontvangsten in het aan dat tijdstip voorafgaande deel van de periode van vijf jaar, zoals
      in het eerste tot en met vijfde lid is aangegeven.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
  - number: '138.7'
    text: |-
      Na sluiting van de rekening van de gemeente stelt de gemeenteraad onderscheiden per schoolsoort, alsmede al naar
      gelang het speciaal onderwijs dan wel voortgezet speciaal onderwijs betreft, de in het eerste en zesde lid bedoelde
      bedragen, zo nodig gewijzigd, vast. In het geval, bedoeld in het zesde lid, tweede volzin, drukt de gemeenteraad
      vervolgens het bedrag van de overschrijding uit in een percentage van het totaal van de ontvangsten, bedoeld in
      het eerste lid onder d tot en met g en i. Het percentage wordt afgerond tot twee decimalen. Afronding naar beneden
      vindt plaats indien de derde decimaal kleiner is dan 5, en naar boven indien deze decimaal ten minste 5 bedraagt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel138
  - number: '139.1'
    text: |-
      In het jaar volgend op de definitieve vaststelling, bedoeld in [artikel 138, zevende lid][ref1], wordt het
      overschrijdingsbedrag vastgesteld waarop het bevoegd gezag van een niet door de gemeente in stand gehouden school,
      die gedurende een of meer jaren van het desbetreffende tijdvak in de gemeente was gevestigd, aanspraak heeft.
      Dit overschrijdingsbedrag wordt vastgesteld door het percentage, bedoeld in [artikel 138, zevende lid][ref2],
      te vermenigvuldigen met het totaal van de ontvangsten van een niet door de gemeente in stand gehouden school
      dat is gebaseerd op de bedragen die krachtens de [artikelen 111][ref3] en [131][ref4], dan wel indien het
      een instelling betreft, krachtens de [artikelen 114][ref5] en [131][ref6] voor het desbetreffende tijdvak
      zijn vastgesteld. Bij het vaststellen van het totaal van de ontvangsten, bedoeld in de tweede volzin, blijven
      buiten beschouwing de ontvangsten op grond van de programma's van eisen voor administratie, beheer en bestuur,
      bedoeld in [artikel 112, eerste lid onder e][ref7], de ontvangsten voor de materiële instandhouding van het
      onderwijs in lichamelijke oefening en van watergewenning en bewegingstherapie, en in verband met de toepassing
      van [artikel 153, eerste lid][ref8] dan wel, indien het een instelling betreft, de bedragen voor de in
      [artikel 114, tweede lid][ref9], bedoelde voorzieningen en de ontvangsten en in verband met de toepassing van
      [artikel 153, eerste lid][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel138
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel111
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel131
      [ref5]: https://wetten.overheid.nl/BWBR0003549#Artikel114
      [ref6]: https://wetten.overheid.nl/BWBR0003549#Artikel131
      [ref7]: https://wetten.overheid.nl/BWBR0003549#Artikel112
      [ref8]: https://wetten.overheid.nl/BWBR0003549#Artikel153
      [ref9]: https://wetten.overheid.nl/BWBR0003549#Artikel114
      [ref10]: https://wetten.overheid.nl/BWBR0003549#Artikel153
