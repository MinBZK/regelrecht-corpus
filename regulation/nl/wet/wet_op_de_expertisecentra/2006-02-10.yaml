  - number: '2.1'
    text: |-
      Het speciaal onderwijs en het voortgezet speciaal onderwijs is bestemd voor kinderen voor wie vaststaat dat
      overwegend een orthopedagogische en orthodidactische benadering aangewezen is.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: '2.2'
    text: 'Het speciaal onderwijs en het voortgezet speciaal onderwijs wordt verdeeld in onderwijs aan:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: 2.2.a
    text: dove kinderen;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: 2.2.b
    text: slechthorende kinderen;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: 2.2.c
    text: kinderen met ernstige spraakmoeilijkheden die niet tevens behoren tot de onder a of b bedoelde kinderen;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: 2.2.d
    text: visueel gehandicapte kinderen;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: 2.2.f
    text: lichamelijk gehandicapte kinderen;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: 2.2.h
    text: langdurig zieke kinderen
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: 2.2.h.1°
    text: met een lichamelijke handicap
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: 2.2.h.2°
    text: anders dan met een lichamelijke handicap;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: 2.2.j
    text: zeer moeilijk lerende kinderen;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: 2.2.k
    text: zeer moeilijk opvoedbare kinderen;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: 2.2.m
    text: kinderen in scholen verbonden aan pedologische instituten;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: 2.2.n
    text: meervoudig gehandicapte kinderen;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: '2.3'
    text: |-
      Onder pedologische instituten worden verstaan instituten die een binding bezitten met een Nederlandse universiteit
      of de wetenschappelijke begeleiding van het onderwijs verzorgen aan scholen voor speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: '2.4'
    text: 'Met betrekking tot de onderwijssoorten, genoemd in het tweede lid, worden de volgende clusters onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: 2.4.a
    text: 'cluster 1: onderwijs aan visueel gehandicapte kinderen dan wel meervoudig gehandicapte kinderen met deze handicap,'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: 2.4.b
    text: |-
      cluster 2: onderwijs aan dove kinderen, slechthorende kinderen en kinderen met ernstige spraakmoeilijkheden dan wel
      meervoudig gehandicapte kinderen met een van deze handicaps,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: 2.4.c
    text: |-
      cluster 3: onderwijs aan langdurig zieke kinderen met een lichamelijke handicap, lichamelijk gehandicapte kinderen
      en zeer moeilijk lerende kinderen dan wel meervoudig gehandicapte kinderen met een van deze handicaps en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: 2.4.d
    text: |-
      cluster 4: onderwijs aan langdurig zieke kinderen anders dan met een lichamelijke handicap, zeer moeilijk
      opvoedbare kinderen en kinderen in scholen verbonden aan pedologische instituten.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: '2.5'
    text: |-
      Bij algemene maatregel van bestuur wordt voor wat betreft het onderwijs aan meervoudig gehandicapte kinderen voor
      de clusters, bedoeld in het vierde lid onder a, b of c, bepaald welke combinaties van handicaps kunnen voorkomen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: '2.6'
    text: |-
      Een krachtens het vijfde lid vastgestelde algemene maatregel van bestuur wordt aan de Tweede Kamer der Staten-
      Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat 4 weken na de overlegging zijn verstreken bij
      koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens de kamer de wens te kennen wordt
      gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een
      daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend. De vorige 3 volzinnen zijn niet van toepassing,
      voor zover het ontwerp van een algemene maatregel van bestuur voordien aan de Tweede Kamer der Staten-Generaal is
      voorgelegd en door of namens de kamer te kennen is gegeven dat van de procedure, bedoeld in de vorige 3 volzinnen,
      kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel2
  - number: '3.1'
    text: 'Speciaal onderwijs en voortgezet speciaal onderwijs mag slechts worden gegeven door degene die:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel3
  - number: 3.1.a
    text: |-
      in het bezit is van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 3.1.b
    text: |-
      in het bezit is van een bewijs van bekwaamheid bedoeld in [artikel 171][ref1], of van een daarmee krachtens
      het derde lid gelijk gesteld bewijs van bekwaamheid, dan wel van Onze minister krachtens het vierde lid
      de bevoegdheid heeft verkregen, of van een ten aanzien van het door hem te geven onderwijs afgegeven EG-
      verklaring als bedoeld in de [Algemene wet erkenning EG-hoger-onderwijsdiploma's][ref2] dan wel in de
      [Algemene wet erkenning EG-beroepsopleidingen][ref3], dan wel in het bezit is van een verklaring als bedoeld in het
      vijfde lid, en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel171
      [ref2]: https://wetten.overheid.nl/BWBR0006317
      [ref3]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '171'
      - id: ref2
        bwb_id: BWBR0006317
      - id: ref3
        bwb_id: BWBR0006781
  - number: 3.1.c
    text: niet krachtens rechterlijke uitspraak van het geven van onderwijs is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel3
  - number: '3.2'
    text: |-
      Het eerste lid onder a en b is niet van toepassing voor het geven van godsdienstonderwijs of levensbeschouwelijk
      vormingsonderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel3
  - number: '3.3'
    text: |-
      Bij ministeriële regeling kan een buiten Nederland verworven bewijs worden gelijkgesteld met een bewijs van
      bekwaamheid genoemd in [artikel 171][ref1]. Daarbij kunnen voorwaarden en beperkingen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel171
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '171'
  - number: '3.4'
    text: |-
      Onze minister kan aan personen die in het bezit zijn van een buiten Nederland behaald bewijs van bekwaamheid,
      de bevoegdheid tot het geven van speciaal onderwijs en voortgezet speciaal onderwijs verlenen. Hij kan daarbij
      voorwaarden en beperkingen stellen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel3
  - number: '3.5'
    text: |-
      Onze minister kan met betrekking tot een vak waarvoor geen bewijs van bekwaamheid is aangewezen, verklaren dat
      een leraar wordt geacht in het bezit te zijn van een bewijs van bekwaamheid tot het geven van voortgezet speciaal
      onderwijs in dat vak en van een bewijs van voldoende pedagogische en didactische voorbereiding.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel3
  - number: '3.6'
    text: |-
      Bij tijdelijke afwezigheid van een leraar kan ten aanzien van degene die hem vervangt, telkens voor ten hoogste 1
      jaar worden afgeweken van de eisen van benoembaarheid, gesteld in het eerste lid onder b. Indien in een vacature
      niet terstond kan worden voorzien door de benoeming van een leraar die aan de genoemde eisen voldoet, is het
      bepaalde in de vorige volzin van overeenkomstige toepassing. Indien toepassing is gegeven aan de eerste of de
      tweede volzin, doet het bevoegd gezag daarvan binnen 4 weken schriftelijk mededeling aan de inspecteur onder
      vermelding van de redenen die tot de toepassing hebben genoodzaakt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel3
  - number: '3.7'
    text: |-
      Onverminderd het zesde lid kan ten aanzien van studenten die een duale opleiding volgen als bedoeld in
      [artikel 7.7 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] leidend tot een getuigschrift
      dat bij of krachtens [artikel 171][ref2] is aangewezen als bewijs van bekwaamheid, en aan die opleiding ten
      minste 180 studiepunten hebben behaald, worden afgeweken van de eisen in het eerste lid onder b, met dien
      verstande dat het tijdelijk dienstverband van de student een periode beslaat die overeenkomt met een volledig
      dienstverband van vijf maanden. De vorige volzin is van overeenkomstige toepassing ten aanzien van studenten
      die ten minste 166 doch nog geen 180 studiepunten hebben behaald, indien door de desbetreffende hogeschool
      wordt verklaard dat de student beschikt over met 180 studiepunten vergelijkbare en tevens voor het dienstverband
      relevante kennis, inzicht en vaardigheden. De toepassing van de vorige volzin vervalt ten aanzien van die
      student die niet binnen vier weken na aanvang van het dienstverband over 180 studiepunten beschikt. De in
      [artikel 7.7, vijfde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3] bedoelde
      overeenkomst vermeldt tevens de leraar onder wiens verantwoordelijkheid de betrokken student werkzaamheden van
      onderwijskundige aard verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel171
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '171'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '4.1'
    text: |-
      Ten behoeve van het schoolbezoek verstrekken burgemeester en wethouders aan ouders van in de gemeente verblijvende
      leerlingen, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, aan de leerling op aanvraag
      bekostiging van de door burgemeester en wethouders noodzakelijk te achten vervoerskosten. De gemeenteraad stelt
      daartoe een nadere regeling vast, met inachtneming van het bepaalde in de volgende leden.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel4
  - number: '4.2'
    text: De regeling maakt geen onderscheid tussen openbaar en bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel4
  - number: '4.3'
    text: |-
      De regeling eerbiedigt de op godsdienst of levensbeschouwing van de ouders, dan wel, indien de leerling
      meerderjarig en handelingsbekwaam is, van de leerling berustende keuze van een school.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel4
  - number: '4.4'
    text: |-
      De regeling voorziet erin dat het vervoer kan plaatsvinden op een wijze die voor de leerling passend is. De
      regeling bepaalt op welke wijze burgemeester en wethouders terzake advies van deskundigen inwinnen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel4
  - number: '4.5'
    text: |-
      De regeling bepaalt dat de kosten worden vergoed van vervoer over de afstand tussen de woning van de leerling en
      de dichtstbijzijnde voor de leerling toegankelijke school, met inachtneming van de keuze van de ouders, dan wel,
      indien de leerling meerderjarig en handelingsbekwaam is, van de leerling, en gemeten langs de kortste voor de
      leerling voldoende begaanbare en veilige weg, tenzij vervoer met betrekking tot een verder weg gelegen school voor
      de gemeente minder kosten met zich zou brengen en de ouders onderscheidenlijk de leerling met het vervoer naar die
      school instemmen. Indien de ouders dan wel, indien de leerling meerderjarig en handelingsbekwaam is, de leerling,
      kiezen respectievelijk kiest voor de school die op grond van artikel 28c, negende lid, door de commissie voor de
      indicatiestelling is geadviseerd, wordt voor de toepassing van dit artikel de geadviseerde school aangemerkt als
      dichtstbijzijnde voor de leerling toegankelijke school. De tweede volzin is van toepassing zolang de leerling zijn
      woonplaats heeft in het gebied van het regionaal expertisecentrum waaraan de commissie voor de indicatiestelling,
      die het advies, bedoeld in die volzin, heeft gegeven, is verbonden.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel4
  - number: '4.6'
    text: |-
      De regeling bepaalt in welke gevallen en onder welke voorwaarden burgemeester en wethouders aan in de gemeente
      wonende ouders van leerlingen die met het oog op het volgen van voor hen passend speciaal onderwijs of voortgezet
      speciaal onderwijs in een internaat of pleeggezin verblijven, op aanvraag bekostiging verstrekken ten behoeve van
      de kosten verbonden aan het weekeinde- en vakantievervoer.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel4
  - number: '4.7'
    text: |-
      De regeling kan per schoolsoort, als bedoeld in artikel 2, tweede lid, en onverminderd het bepaalde in het vierde
      lid voor leerlingen die wegens hun lichamelijke, verstandelijke of zintuiglijke handicap op ander vervoer dan
      openbaar vervoer zijn aangewezen, bepalen dat geen aanspraak op bekostiging bestaat op grond van de afstand tussen
      de voor de leerling toegankelijke school en de woning van de leerling, gemeten langs de kortste voor de leerling
      voldoende begaanbare en veilige weg.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel4
  - number: '4.8'
    text: |-
      De regeling kan per schoolsoort, als bedoeld in artikel 2, tweede lid, bepalen dat voor een leerling die ouder is
      dan een bepaalde leeftijd, de aanspraak op bekostiging wordt beperkt tot de kosten van openbaar vervoer, dan wel,
      indien zulks in redelijkheid kan worden verlangd, een goedkopere wijze van vervoer. In dat geval dient de regeling
      erin te voorzien, dat uitvoering wordt gegeven aan het bepaalde in het vierde lid voor die leerlingen voor wie
      openbaar vervoer ontbreekt en de in de vorige volzin bedoelde goedkopere wijze van vervoer in redelijkheid niet
      kan worden verlangd en voor die leerlingen die wegens hun lichamelijke, verstandelijke of zintuiglijke handicap op
      ander vervoer dan openbaar vervoer zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel4
  - number: '4.9'
    text: |-
      De regeling kan bepalen dat de gemeente, in plaats van bekostiging in geld te geven, het vervoer verzorgt of doet
      verzorgen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel4
  - number: '4.10'
    text: |-
      De regeling kan bepalen dat burgemeester en wethouders in bijzondere gevallen de bevoegdheid hebben ten gunste
      van de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, ten gunste van de leerling van de
      inhoud van de regeling af te wijken.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel4
  - number: 4a.1
    text: |-
      Indien het bevoegd gezag op enigerlei wijze bekend is geworden dat een ten behoeve van zijn school
      met taken belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de zeden
      als bedoeld in [Titel XIV van het Wetboek van Strafrecht][ref1] jegens een minderjarige leerling van
      de school, treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in
      [artikel 6 van de Wet op het onderwijstoezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel6
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '6'
  - number: 4a.2
    text: |-
      Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van
      een redelijk vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf
      als bedoeld in het eerste lid jegens een minderjarige leerling van de school, doet het bevoegd
      gezag onverwijld aangifte bij een opsporingsambtenaar als bedoeld in [artikel 127][ref1] juncto
      [artikel 141 van het Wetboek van Strafvordering][ref2], en stelt het bevoegd gezag de vertrouwensinspecteur daarvan
      onverwijld in kennis. Voordat het bevoegd gezag overgaat tot het doen van aangifte, stelt het de ouders van de
      betrokken leerling, onderscheidenlijk de betreffende ten behoeve van de school met taken belaste persoon, hiervan
      op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '127'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 4a.3
    text: |-
      Indien een personeelslid op enigerlei wijze bekend is geworden dat een ten behoeve van de school met taken belast
      persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een
      minderjarige leerling van de school, stelt het personeelslid het bevoegd gezag daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel4a
  - number: '5'
    text: |-
      Het toezicht op de regionale expertisecentra is opgedragen aan de inspectie. De [artikelen 3][ref1] en
      [9 van de Wet op het onderwijstoezicht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel9
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '9'
  - number: '6'
    text: |-
      Ten laste van een andere openbare kas dan van Rijk en gemeente worden geen scholen in stand gehouden, noch uitgaven
      voor een school gedaan. Gemeenten doen geen uitgaven voor een niet door de gemeente in stand gehouden school dan
      krachtens de wet.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel6
  - number: '7.1'
    text: |-
      Deze wet is niet van toepassing op scholen die uitsluitend bestemd zijn voor kinderen die niet de Nederlandse
      nationaliteit hebben.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel7
  - number: '7.2'
    text: Bij twijfel of op een school het eerste lid van toepassing is, besluit de Kroon, de Raad van State gehoord.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel7
  - number: '8.1'
    text: |-
      Het onderwijs bedoeld in [artikel 2, tweede lid, aanhef en onderdelen a tot en met c en f tot en met n][ref1],
      wordt gegeven in scholen voor speciaal onderwijs, scholen voor voortgezet speciaal onderwijs en scholen voor
      speciaal en voortgezet speciaal onderwijs, verdeeld als aangegeven in die onderdelen. Het onderwijs bedoeld in
      [artikel 2, tweede lid, aanhef en onderdeel d][ref2], en het onderwijs aan meervoudig gehandicapte kinderen die
      naast een handicap als bedoeld in [artikel 2, tweede lid, onderdeel d][ref3], een handicap hebben als bedoeld in
      [artikel 2, tweede lid, onderdeel a tot en met c, f en h tot en met m][ref4], wordt gegeven in instellingen voor
      speciaal en voortgezet speciaal onderwijs aan visueel gehandicapte kinderen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '8.2'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald aan welke soorten van scholen afdelingen kunnen worden verbonden
      en voor welke kinderen deze zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel8
  - number: '8.3'
    text: |-
      De algemene maatregel van bestuur bedoeld in het tweede lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure
      bedoeld in de eerste 3 volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel8
  - number: 8a.1
    text: |-
      Een school, niet zijnde een instelling, heeft, naast het geven van onderwijs, tot taak op verzoek van
      het regionaal expertisecentrum waaraan de school deelneemt onderzoek te verrichten in het kader van
      [artikel 28c, vierde lid, laatste volzin][ref1] en het ondersteunen van een school als bedoeld in de
      [Wet op het primair onderwijs][ref2] en de [Wet op het voortgezet onderwijs][ref3], waarbij een leerling
      is ingeschreven voor wie op basis van de beoordeling door een commissie voor de indicatiestelling een
      leerlinggebonden budget beschikbaar is en die toelaatbaar is verklaard tot een onderwijssoort als bedoeld in
      [artikel 2, tweede lid][ref4], die door de eerstbedoelde school wordt verzorgd dan wel toelaatbaar is verklaard tot
      het cluster als bedoeld in [artikel 2, vierde lid onder d][ref5], waartoe de eerstbedoelde school behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
      [ref2]: https://wetten.overheid.nl/BWBR0003420
      [ref3]: https://wetten.overheid.nl/BWBR0002399
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28c
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
      - id: ref3
        bwb_id: BWBR0002399
      - id: ref4
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 8a.2
    text: |-
      Onder het ondersteunen van een school, bedoeld in het eerste lid, wordt in elk geval begrepen het doen van
      aanbevelingen over de begeleiding van de individuele leerling tijdens zijn verblijf op de school die wordt
      ondersteund, teneinde een optimale ontwikkeling van de in de leerling aanwezige mogelijkheden te bewerkstelligen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel8a
  - number: 8a.3
    text: |-
      Bij algemene maatregel van bestuur worden onderwijssoorten aangewezen waaraan bekostiging kan worden toegekend ten
      behoeve van de begeleiding van
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel8a
  - number: 8a.3.a
    text: |-
      leerlingen, die zijn geplaatst op een basisschool of leerlingen die zijn geplaatst op een school voor voortgezet
      onderwijs en die naar het oordeel van het bevoegd gezag zonder die begeleiding zouden zijn aangewezen op het
      speciaal onderwijs of het voortgezet speciaal onderwijs en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel8a
  - number: 8a.3.b
    text: |-
      leerlingen, die in het direct voorafgaande schooljaar waren toegelaten tot een school, niet zijnde
      een instelling, en die zonder dat voor hen nog een leerlinggebonden budget beschikbaar is, zijn
      teruggeplaatst naar een basisschool als bedoeld in de [Wet op het primair onderwijs][ref1], een
      school als bedoeld in de [Wet op het voortgezet onderwijs][ref2] dan wel een opleiding als bedoeld in
      [artikel 7.2.2., eerste lid onder a en b, van de Wet educatie en beroepsonderwijs][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0002399
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0002399
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '9'
    text: 'De taken van een instelling zijn:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel9
  - number: 9.a
    text: |-
      het geven van speciaal onderwijs of voortgezet speciaal onderwijs aan kinderen als bedoeld in
      [artikel 2, tweede lid, onderdeel d][ref1], of aan meervoudig gehandicapte kinderen als bedoeld in
      [artikel 8, eerste lid, tweede volzin][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel8
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '8'
        paragraaf: '1'
        afdeling: '1'
  - number: 9.b
    text: |-
      het begeleiden door een aan een instelling verbonden leraar van een leerling die zonder deze begeleiding zou zijn
      aangewezen op het onderwijs dat de instelling verzorgt, alsmede de ondersteuning van een onderwijsinstelling waarop
      die leerling is geplaatst door een leraar, orthopedagoog, psycholoog of logopedist van de instelling en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel9
  - number: 9.c
    text: |-
      het verrichten van algemene ondersteuningsactiviteiten ten behoeve van de bevordering van een optimale
      schoolloopbaan van visueel gehandicapte leerlingen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel9
  - number: '11.1'
    text: |-
      Het onderwijs wordt afgestemd op de ontwikkelingsmogelijkheden van de leerling. Het wordt zodanig ingericht dat de
      leerling een ononderbroken ontwikkelingsproces kan doorlopen. Zo mogelijk brengt het kinderen tot het volgen van
      gewoon onderwijs in basisscholen of scholen voor voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel11
  - number: '11.2'
    text: |-
      Het onderwijs richt zich in elk geval op de emotionele en de verstandelijke ontwikkeling, op het ontwikkelen
      van creativiteit, het verwerven van kennis en van sociale, culturele en lichamelijke vaardigheden. Het onderwijs
      wordt bovendien zodanig ingericht dat daarbij op structurele en herkenbare wijze aandacht wordt besteed aan het
      bestrijden van achterstanden in het bijzonder in de beheersing van de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel11
  - number: '11.3'
    text: 'Het onderwijs:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel11
  - number: 11.3.a
    text: gaat er mede van uit dat leerlingen opgroeien in een pluriforme samenleving,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel11
  - number: 11.3.b
    text: is mede gericht op het bevorderen van actief burgerschap en sociale integratie, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel11
  - number: 11.3.c
    text: |-
      is er mede op gericht dat leerlingen kennis hebben van en kennismaken met verschillende achtergronden en culturen
      van leeftijdgenoten.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel11
  - number: '11.4'
    text: |-
      Het onderwijs wordt zodanig ingericht dat de leerlingen die jonger zijn dan 7 jaar, per schooljaar ten minste 880
      uren en de overige leerlingen per schooljaar ten minste 1000 uren onderwijs ontvangen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel11
  - number: '11.5'
    text: |-
      De leerlingen ontvangen per dag ten hoogste 5,5 uren onderwijs, waarbij een evenwichtige verdeling van de
      activiteiten in acht wordt genomen, tenzij afwijking van dit maximale aantal van belang is in verband met
      activiteiten in het kader van het voorkomen en bestrijden van onderwijsachterstanden.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel11
  - number: '11.6'
    text: |-
      Het onderwijs wordt zodanig ingericht dat leerlingen die in verband met ziekte thuis verblijven dan wel zijn
      opgenomen in een ziekenhuis, op adequate wijze voldoende onderwijs kunnen genieten.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel11
  - number: '12'
    text: |-
      De inspecteur kan op verzoek van het bevoegd gezag ermee instemmen dat wordt afgeweken van
      [artikel 11, vierde en, voor zover het betreft het aantal uren onderwijs, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel11
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '11'
        paragraaf: '1'
        afdeling: '1'
  - number: '13.1'
    text: |-
      Behoudens het bepaalde in het vijfde lid en in [artikel 15][ref1] omvat het speciaal onderwijs, waar mogelijk in
      samenhang:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel15
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '15'
        paragraaf: '1'
        afdeling: '1'
  - number: 13.1.a
    text: zintuiglijke oefening;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: 13.1.b
    text: lichamelijke oefening;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: 13.1.c
    text: Nederlandse taal;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: 13.1.d
    text: rekenen en wiskunde;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: 13.1.e
    text: enkele kennisgebieden;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: 13.1.f
    text: expressie-activiteiten;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: 13.1.g
    text: bevordering van sociale redzaamheid, waaronder gedrag in het verkeer;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: 13.1.h
    text: bevordering van gezond gedrag.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: '13.2'
    text: Het onderwijs kan mede Engelse taal en huishoudelijke activiteiten omvatten.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: '13.3'
    text: 'Bij de kennisgebieden wordt in elk geval aandacht besteed aan:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: 13.3.a
    text: aardrijkskunde;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: 13.3.b
    text: geschiedenis;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: 13.3.c
    text: de natuur, waaronder biologie;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: 13.3.d
    text: maatschappelijke verhoudingen, waaronder staatsinrichting;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: 13.3.e
    text: geestelijke stromingen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: '13.4'
    text: |-
      Bij de expressie-activiteiten wordt waar mogelijk aandacht besteed aan de bevordering van het taalgebruik, tekenen,
      muziek, handvaardigheid, spel en beweging.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: '13.5'
    text: Speciaal onderwijs aan zeer moeilijk lerende kinderen omvat, waar mogelijk in samenhang;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: 13.5.a
    text: zintuiglijke oefening;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: 13.5.b
    text: lichamelijke oefening;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: 13.5.c
    text: bevordering van de sociale redzaamheid, waaronder gedrag in het verkeer;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: 13.5.d
    text: bevordering van gezond gedrag;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: 13.5.e
    text: |-
      expressie-activiteiten, waarbij in elk geval aandacht wordt besteed aan de bevordering van het taalgebruik,
      tekenen, muziek, handvaardigheid, spel en beweging;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: 13.5.f
    text: een of meer kennisgebieden, waarbij in ieder geval aandacht wordt besteed aan de natuur.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: '13.6'
    text: Op de scholen in de provincie Fryslân kan het speciaal onderwijs mede onderwijs in de Friese taal omvatten.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel13
  - number: '14.1'
    text: 'Voortgezet speciaal onderwijs omvat, waar mogelijk in samenhang, in elk geval:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel14
  - number: 14.1.a
    text: Nederlandse taal;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel14
  - number: 14.1.b
    text: geschiedenis, waaronder staatsinrichting;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel14
  - number: 14.1.c
    text: aardrijkskunde;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel14
  - number: 14.1.d
    text: maatschappijleer;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel14
  - number: 14.1.e
    text: wiskunde en rekenen;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel14
  - number: 14.1.f
    text: muziek;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel14
  - number: 14.1.g
    text: tekenen;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel14
  - number: 14.1.h
    text: handvaardigheid;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel14
  - number: 14.1.i
    text: lichamelijke oefening.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel14
  - number: '14.2'
    text: |-
      Voortgezet speciaal onderwijs omvat voorts ten minste 2 van de vakken die gegeven worden in het voorbereidend
      beroepsonderwijs, het algemeen voortgezet onderwijs en het voorbereidend wetenschappelijk onderwijs, anders dan de
      vakken bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel14
  - number: '14.3'
    text: |-
      Op de scholen in de provincie Fryslân kan het voortgezet speciaal onderwijs mede onderwijs in de Friese taal
      omvatten.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel14
  - number: '14.4'
    text: 'Bij algemene maatregel van bestuur kunnen per schoolsoort voorschriften worden gegeven omtrent:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel14
  - number: 14.4.a
    text: het maximum aantal vakken bedoeld in het tweede lid, waarin onderwijs wordt gegeven;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel14
  - number: 14.4.b
    text: de combinatie van vakken waarin onderwijs wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel14
  - number: '14.5'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke vakken het voortgezet speciaal onderwijs aan zeer moeilijk
      lerende kinderen omvat.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel14
  - number: '15'
    text: |-
      Onze minister bepaalt op voorstel van het bevoegd gezag per school, welke onderdelen genoemd in de
      [artikelen 13, eerste tot en met vierde lid][ref1], en [14][ref2], het speciaal onderwijs, onderscheidenlijk het
      voortgezet speciaal onderwijs aan meervoudig gehandicapte kinderen omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel14
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '13'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '14'
        paragraaf: '1'
        afdeling: '1'
  - number: '16'
    text: |-
      Onze minister kan in bijzondere gevallen op verzoek van het bevoegd gezag toestaan dat wordt
      afgeweken van de voorschriften van of krachtens [artikel 13, eerste tot en met vijfde lid][ref1], en
      [artikel 14, eerste tot en met vierde lid][ref2]. De toestemming wordt verleend voor een bepaald tijdvak; aan de
      toestemming kunnen voorwaarden worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel14
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '13'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '14'
        paragraaf: '1'
        afdeling: '1'
  - number: '17.1'
    text: |-
      Het onderwijs kan een stage omvatten. Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven
      omtrent de stage.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel17
  - number: '17.2'
    text: |-
      De algemene maatregel van bestuur bedoeld in het eerste lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure
      bedoeld in de eerste 3 volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel17
  - number: '18.1'
    text: |-
      Het onderwijs wordt gegeven in het Nederlands. Daar waar naast de Nederlandse taal, de Friese taal of een
      streektaal in levend gebruik is, kan de Friese taal of de streektaal mede als voertaal bij het onderwijs worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel18
  - number: '18.2'
    text: |-
      Voor de opvang in en de aansluiting bij het Nederlandse onderwijs van leerlingen met een niet-Nederlandse
      culturele achtergrond kan de taal van het land van oorsprong mede als voertaal bij het onderwijs worden gebruikt,
      overeenkomstig een door het bevoegd gezag vastgestelde gedragscode.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel18
  - number: 18a.1
    text: |-
      Bij het geven van onderwijs aan een leerling die is opgenomen in een ziekenhuis of die in verband met ziekte thuis
      verblijft, kan het bevoegd gezag van een school worden ondersteund.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel18a
  - number: 18a.2
    text: 'De ondersteuning bedoeld in het eerste lid wordt verzorgd door:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel18a
  - number: 18a.2.a
    text: |-
      een educatieve voorziening als bedoeld in
      [artikel 1.4, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] indien de leerling
      is opgenomen in een academisch ziekenhuis of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 18a.2.b
    text: |-
      een schoolbegeleidingsdienst als bedoeld in [artikel 165][ref1], indien de leerling is opgenomen in een ziekenhuis
      niet zijnde een academisch ziekenhuis dan wel indien de leerling in verband met ziekte thuis verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel165
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '165'
        afdeling: '11'
  - number: 18a.3
    text: |-
      De ondersteuning bedoeld in het eerste lid kan in overeenstemming tussen de educatieve voorziening dan wel de
      schoolbegeleidingsdienst en de school waarbij de leerling is ingeschreven, mede het geven van onderwijs aan de
      leerling betreffen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel18a
  - number: '19'
    text: |-
      Het bevoegd gezag draagt zorg voor de kwaliteit van het onderwijs op de school. Onder zorg dragen voor de
      kwaliteit van het onderwijs wordt in elk geval verstaan: het uitvoeren van het in het schoolplan, bedoeld in
      [artikel 21][ref1], beschreven beleid op een zodanige wijze dat de wettelijke opdrachten voor het onderwijs en de
      door het bevoegd gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs, worden gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel21
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '21'
        paragraaf: '1'
        afdeling: '1'
  - number: '20'
    text: |-
      Het bevoegd gezag rapporteert over de vorderingen van de leerlingen aan hun ouders dan wel aan de leerlingen zelf
      indien zij meerderjarig en handelingsbekwaam zijn.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel20
  - number: '21.1'
    text: |-
      Het schoolplan bevat een beschrijving van het beleid met betrekking tot de kwaliteit van het onderwijs dat binnen
      de school wordt gevoerd, en omvat in elk geval het onderwijskundig beleid, het personeelsbeleid en het beleid met
      betrekking tot de bewaking en verbetering van de kwaliteit van het onderwijs. Het schoolplan omvat mede het beleid
      ten aanzien van de aanvaarding van materiële bijdragen of geldelijke bijdragen, niet zijnde ouderbijdragen of op
      de onderwijswetgeving gebaseerde bijdragen, indien het bevoegd gezag daarbij verplichtingen op zich neemt waarmee
      de leerlingen binnen de schooltijden en tijdens de activiteiten die worden georganiseerd onder verantwoordelijkheid
      van het bevoegd gezag, alsmede tijdens het overblijven, zullen worden geconfronteerd. Het schoolplan kan op een
      of meer scholen voor speciaal onderwijs, voor voortgezet speciaal onderwijs, voor speciaal en voortgezet speciaal
      onderwijs, en instellingen voor speciaal en voortgezet speciaal onderwijs en een of meer scholen voor ander
      onderwijs van hetzelfde bevoegd gezag betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel21
  - number: '21.2'
    text: |-
      Het onderwijskundig beleid omvat in elk geval de uitwerking van de wettelijke opdrachten voor het onderwijs
      en van de door het bevoegd gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs in een
      onderwijsprogramma. Daarbij worden tevens betrokken de bijzondere voorzieningen die zijn getroffen voor leerlingen
      of groepen leerlingen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel21
  - number: '21.3'
    text: |-
      Het personeelsbeleid, voor zover dat in het schoolplan tot uitdrukking wordt gebracht, omvat in elk geval
      maatregelen met betrekking tot het personeel die bijdragen aan de ontwikkeling en de uitvoering van het
      onderwijskundig beleid alsmede het document inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding,
      bedoeld in artikel 30 van de wet.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel21
  - number: '21.4'
    text: |-
      Het beleid met betrekking tot de bewaking en verbetering van de kwaliteit van het onderwijs omvat in elk geval
      op welke wijze het bevoegd gezag bewaakt dat die kwaliteit wordt gerealiseerd en vaststelt welke maatregelen ter
      verbetering van de kwaliteit nodig zijn.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel21
  - number: '22.1'
    text: |-
      De schoolgids bevat voor ouders en leerlingen informatie over de werkwijze van de school en bevat in elk geval
      informatie over:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel22
  - number: 22.1.a
    text: |-
      de doelen van het onderwijs en de resultaten die met het onderwijsleerproces worden bereikt, met dien verstande dat
      bij algemene maatregel van bestuur voorschriften kunnen worden gegeven met betrekking tot de wijze waarop
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel22
  - number: 22.1.a.1°
    text: de resultaten worden beschreven die met het onderwijsleerproces worden bereikt, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel22
  - number: 22.1.a.2°
    text: de context wordt vermeld waarin de onder 1° bedoelde resultaten dienen te worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel22
  - number: 22.1.b
    text: de bijzondere voorzieningen voor leerlingen of groepen leerlingen,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel22
  - number: 22.1.c
    text: de wijze waarop de verplichte onderwijstijd wordt benut,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel22
  - number: 22.1.d
    text: |-
      de geldelijke bijdrage, bedoeld in [artikel 40, eerste lid][ref1], waarbij een ontwerp van een overeenkomst voor
      een dergelijke bijdrage, die voldoet aan de eisen die in [artikel 40, eerste lid][ref2], zijn geformuleerd, in de
      schoolgids wordt opgenomen,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel40
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '40'
        paragraaf: '3'
        afdeling: '1'
  - number: 22.1.e
    text: |-
      de rechten en plichten van de ouders, de leerlingen en het bevoegd gezag, waaronder de informatie over de
      klachtenregeling, bedoeld in [artikel 23][ref1], en de gronden voor vrijstelling van het onderwijs, bedoeld in
      [artikel 46, tweede lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel46
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '23'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '46'
        paragraaf: '3'
        afdeling: '1'
  - number: 22.1.f
    text: de wijze waarop het bevoegd gezag omgaat met de in artikel 21, eerste lid, omschreven bijdragen, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel22
  - number: 22.1.g
    text: het regionaal expertisecentrum waarbij het bevoegd gezag van de school is aangesloten.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel22
  - number: '22.2'
    text: |-
      Het bevoegd gezag reikt de schoolgids uit aan de ouders dan wel de meerderjarige en handelingsbekwame leerling bij
      de inschrijving en jaarlijks na de vaststelling van de schoolgids.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel22
  - number: '22.3'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, onder a, wordt aan de beide kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en
      gedurende die termijn niet door of namens een der kamers de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel22
  - number: '23.1'
    text: |-
      Ouders en personeelsleden kunnen bij de klachtencommissie, bedoeld in het tweede lid, onderdeel a, een klacht
      indienen over gedragingen en beslissingen van het bevoegd gezag of het personeel, waaronder discriminatie, dan
      wel het nalaten van gedragingen en het niet nemen van beslissingen door het bevoegd gezag of het personeel. Een
      zodanige klacht kan eveneens worden ingediend door:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel23
  - number: 23.1.a
    text: |-
      leerlingen van scholen voor speciaal onderwijs of voor speciaal en voortgezet speciaal onderwijs, die de leeftijd
      van 13 jaren hebben bereikt,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel23
  - number: 23.1.b
    text: leerlingen van scholen voor voortgezet speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel23
  - number: '23.2'
    text: 'Het bevoegd gezag treft een regeling voor de behandeling van klachten. Deze regeling vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel23
  - number: 23.2.a
    text: de instelling van een klachtencommissie, die klachten behandelt,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel23
  - number: 23.2.b
    text: de wijze waarop de klachtencommissie haar werkzaamheden verricht,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel23
  - number: 23.2.c
    text: de termijn waarbinnen de klager een klacht kan indienen en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel23
  - number: 23.2.d
    text: |-
      de termijn waarbinnen mededeling plaatsvindt van het oordeel, bedoeld in het zesde lid, en hoe bij noodzakelijke
      afwijking van deze termijn wordt gehandeld.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel23
  - number: '23.3'
    text: |-
      Deze regeling strekt ter vervanging van klachtenregelingen op grond van andere voorschriften dan dit artikel en
      strekt niet ter vervanging van een andere voorziening die op grond van een wettelijke regeling, niet zijnde een
      klachtenregeling, voor de klager openstaat of heeft opengestaan.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel23
  - number: '23.4'
    text: Deze regeling
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel23
  - number: 23.4.a
    text: |-
      voorziet erin dat de klachten worden behandeld door een klachtencommissie die bestaat uit ten minste drie leden,
      waaronder een voorzitter die geen deel uitmaakt van het bevoegd gezag en niet werkzaam is voor of bij het bevoegd
      gezag en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel23
  - number: 23.4.b
    text: |-
      waarborgt dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel23
  - number: '23.5'
    text: 'De klager en degene over wie is geklaagd krijgen de gelegenheid:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel23
  - number: 23.5.a
    text: hun zienswijze mondeling of schriftelijk toe te lichten en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel23
  - number: 23.5.b
    text: zich bij de behandeling van de klacht te laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel23
  - number: '23.6'
    text: |-
      De klachtencommissie vormt zich een oordeel over de gegrondheid van de klacht en deelt dit oordeel, al dan niet
      vergezeld van aanbevelingen, schriftelijk mede aan de klager, degene over wie is geklaagd en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel23
  - number: '23.7'
    text: |-
      Het bevoegd gezag deelt de klager en de klachtencommissie, bedoeld in het tweede lid, onderdeel a, binnen 4 weken
      na ontvangst van het in het zesde lid bedoelde oordeel van de klachtencommissie schriftelijk mede of hij het
      oordeel over de gegrondheid van de klacht deelt en of hij naar aanleiding van dat oordeel maatregelen zal nemen en
      zo ja welke. Bij afwijking van de in de eerste volzin bedoelde termijn, doet het bevoegd gezag daarvan met redenen
      omkleed mededeling aan de klager en de klachtencommissie onder vermelding van de termijn waarbinnen het bevoegd
      gezag zijn standpunt bekend zal maken.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel23
  - number: '23.8'
    text: |-
      Degene die betrokken is bij de uitvoering van dit artikel en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijze moet vermoeden, is verplicht tot geheimhouding daarvan,
      behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak tot
      mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel23
  - number: '23.9'
    text: |-
      Gegevens die betrekking hebben op een klacht worden bewaard op een plaats die uitsluitend toegankelijk is voor de
      leden van de klachtencommissie en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel23
  - number: '24.1'
    text: |-
      Een deel van een schoolplan kan voorzover het betrekking heeft op voortgezet speciaal onderwijs, worden uitgevoerd
      door een school voor voorbereidend beroepsonderwijs, door andere vormen van regulier voortgezet onderwijs of door
      een instelling voor educatie en beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel24
  - number: '24.2'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent de uitvoering van het eerste lid alsmede
      omtrent de aard en de eisen aan de voorzieningen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel24
  - number: '26.1'
    text: |-
      Indien een leerling gedurende een deel van de week onderwijs ontvangt op een basisschool, een speciale school voor
      basisonderwijs of een school voor voortgezet onderwijs, telt de tijd gedurende welke de leerling dit onderwijs
      ontvangt, mee voor het aantal uren onderwijs dat de leerling ten minste moet ontvangen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel26
  - number: '26.2'
    text: |-
      Bij ministeriële regeling kunnen begin en eind van de zomervakantie worden vastgesteld die niet voor alle scholen
      gelijk behoeven te zijn. Bij die ministeriële regeling kan tevens worden bepaald dat zij op bepaalde scholen niet
      van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel26
  - number: '27.1'
    text: Het bevoegd gezag stelt ten minste eenmaal in de 4 jaar het schoolplan vast.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel27
  - number: '27.2'
    text: Het bevoegd gezag stelt jaarlijks de schoolgids vast ten behoeve van het eerstvolgende schooljaar.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel27
  - number: '27.3'
    text: |-
      Het bevoegd gezag zendt het schoolplan dan wel de wijzigingen daarvan en de schoolgids onmiddellijk na de
      vaststelling aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel27
  - number: '28.1'
    text: |-
      De instandhouding van een of meer openbare en een of meer bijzondere scholen kan worden opgedragen of overgedragen
      aan een stichting die met dit doel wordt onderscheidenlijk is opgericht.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28
  - number: '28.2'
    text: |-
      Het statutaire doel van de stichting is in elk geval het geven van openbaar onderwijs en onderwijs van een of meer
      richtingen in afzonderlijke scholen voor openbaar onderscheidenlijk bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28
  - number: '28.3'
    text: |-
      De stichting oefent met uitzondering van de besluitvorming over de opheffing van een openbare school alle taken en
      bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28
  - number: '28.4'
    text: |-
      Het personeel dat werkzaam is aan de openbare school en niet zonder benoeming is tewerkgesteld, wordt benoemd
      krachtens een arbeidsovereenkomst naar burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28
  - number: '28.5'
    text: 'De statuten voorzien in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28
  - number: 28.5.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28
  - number: 28.5.b
    text: de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28
  - number: 28.5.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28
  - number: 28.5.d
    text: |-
      de vaststelling van de begroting en jaarrekening na overleg met de gemeenteraad van de gemeente waarin de openbare
      school is gelegen,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28
  - number: 28.5.e
    text: |-
      de wijze waarop de gemeenteraad van de gemeente waarin de openbare school is gelegen, toezicht op het bestuur van
      de openbare school uitoefent,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28
  - number: 28.5.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28
  - number: 28.5.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28
  - number: 28.5.h
    text: de bevoegdheid de stichting te ontbinden,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28
  - number: '28.6'
    text: |-
      De statuten van de stichting kunnen slechts worden gewijzigd na goedkeuring van de gemeenteraad van de gemeente
      waarin de openbare school is gelegen. Goedkeuring kan slechts worden onthouden indien overheersende invloed van de
      overheid in het bestuur niet is verzekerd voor zover het openbaar onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28
  - number: '28.7'
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad van de gemeente waarin de openbare school is gelegen, verslag uit
      over de werkzaamheden, waarbij in ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar
      onderwijs. Het verslag wordt bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28
  - number: '28.8'
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28
  - number: '28.9'
    text: |-
      In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover het
      openbaar onderwijs betreft, neemt de gemeenteraad van de gemeente waarin de openbare school is gelegen, de
      maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het openbaar
      onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28
  - number: 28a
    text: |-
      De [artikelen 28b][ref1], [28c][ref2], [28d][ref3] en [28e][ref4] zijn niet van toepassing op instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel28d
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel28e
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28b
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 28c
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 28d
        paragraaf: '1'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: 28e
        paragraaf: '1'
        afdeling: '1'
  - number: 28b.1
    text: |-
      Het bevoegd gezag is voor elk van zijn scholen aangesloten bij een regionaal expertisecentrum. Een regionaal
      expertisecentrum omvat alle scholen van alle soorten die tot hetzelfde cluster of dezelfde clusters, bedoeld in
      [artikel 2, vierde lid][ref1], behoren en die zijn gelegen in het gebied, bedoeld in het tweede lid, waarin het
      regionaal expertisecentrum werkzaam is. In bijzondere omstandigheden kan Onze minister toestaan dat een regionaal
      expertisecentrum niet alle scholen omvat van alle soorten die tot hetzelfde cluster dan wel dezelfde clusters,
      bedoeld in [artikel 2, vierde lid][ref2], behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 28b.2
    text: |-
      Bij algemene maatregel van bestuur worden per cluster als bedoeld in [artikel 2, vierde lid][ref1], aaneengesloten
      gebieden vastgesteld waarvan de grenzen overeenkomen met de grenzen van gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 28b.3
    text: Het bevoegd gezag kan per school slechts deelnemen aan 1 regionaal expertisecentrum.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28b
  - number: 28b.4
    text: |-
      Bevoegde gezagsorganen van scholen waaraan onderwijs wordt gegeven van de soorten die behoren tot hetzelfde cluster
      en die zijn gelegen binnen hetzelfde gebied worden niet uitgesloten van deelname aan het in dat gebied werkzame
      regionaal expertisecentrum.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28b
  - number: 28b.5
    text: |-
      Het bevoegd gezag dat respectievelijk de bevoegde gezagsorganen die aangesloten willen zijn, geven het regionaal
      expertisecentrum vorm door een rechtspersoon op te richten, waarin uitsluitend wordt deelgenomen door die bevoegde
      gezagsorganen die bij het regionaal expertisecentrum zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28b
  - number: 28b.6
    text: 'Het regionaal expertisecentrum heeft in elk geval tot taak:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28b
  - number: 28b.6.a
    text: het instandhouden van een commissie voor de indicatiestelling;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28b
  - number: 28b.6.b
    text: |-
      het coördineren van de ondersteuning, bedoeld in [artikel 8a, eerste en tweede lid][ref1], die door de
      scholen waarvoor het regionaal expertisecentrum werkzaam is, wordt verleend aan scholen als bedoeld in
      [laatstgenoemd artikel][ref2] en met inachtneming van de wensen van die scholen;


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel8a
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 8a
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 8a
        paragraaf: '1'
        afdeling: '1'
  - number: 28b.6.c
    text: |-
      het ondersteunen van de ouders bij het indienen van een verzoek als bedoeld in [artikel 28c, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28c
        paragraaf: '1'
        afdeling: '1'
  - number: 28b.6.d
    text: |-
      het coördineren van de in het kader van de laatste volzin van het [vierde lid van artikel 28c][ref1] noodzakelijke
      onderzoeksactiviteiten;


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28c
        paragraaf: '1'
        afdeling: '1'
  - number: 28b.6.e
    text: |-
      het ondersteunen van de ouders van een leerling bij het zoeken naar een school en het ondersteunen van ouders van
      een leerling voor wie een leerlinggebonden budget beschikbaar is bij het zoeken naar een school als bedoeld in de
      [Wet op het primair onderwijs][ref1] of de [Wet op het voortgezet onderwijs][ref2] en


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0002399
  - number: 28b.6.f
    text: |-
      het coördineren van de inzet van de bekostiging ten behoeve van de begeleiding van leerlingen, bedoeld
      in [artikel 8a, derde lid onder a][ref1], na overleg met de samenwerkingsverbanden, bedoeld in de
      [Wet op het primair onderwijs][ref2] en de [Wet op het voortgezet onderwijs][ref3], in het gebied waarin het
      regionaal expertisecentrum werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0003420
      [ref3]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 8a
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
      - id: ref3
        bwb_id: BWBR0002399
  - number: 28b.7
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot de samenstelling van de
      commissie voor de indicatiestelling.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28b
  - number: 28b.8
    text: |-
      De regionale expertisecentra die behoren tot hetzelfde cluster als bedoeld in [artikel 2, vierde lid][ref1],
      stellen gezamenlijk een adviescommissie overeenkomstig [artikel 7:13 van de Algemene wet bestuursrecht][ref2]
      in, die adviseert met betrekking tot een bij de commissie voor de indicatiestelling ingediend bezwaarschrift
      betreffende een beslissing op grond van [artikel 28c, eerste en tweede lid][ref3], en betreffende een beslissing
      van die commissie die samenhangt met de toepassing van het [derde lid van genoemd artikel][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 28c
        paragraaf: '1'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: 28c
        paragraaf: '1'
        afdeling: '1'
  - number: 28b.9
    text: |-
      Het regionaal expertisecentrum kan een of meer scholen in stand houden indien het bevoegd gezag dan wel de
      bevoegde gezagsorganen de instandhouding van die school of die scholen overdraagt dan wel overdragen aan het
      regionaal expertisecentrum. Indien als gevolg van toepassing van de eerste volzin het regionaal expertisecentrum
      alle scholen in stand houdt van alle soorten die tot hetzelfde cluster of dezelfde clusters, bedoeld in
      [artikel 2, vierde lid][ref1], behoren, behoudens voor zover toepassing is gegeven aan de derde volzin van het
      eerste lid, en die zijn gelegen in het gebied, bedoeld in het tweede lid, waarin het regionaal expertisecentrum
      werkzaam is, is op het regionaal expertisecentrum tevens bevoegd gezag de eerste volzin van het eerste lid niet
      van toepassing zolang het regionaal expertisecentrum tevens bevoegd gezag zijn taken als regionaal expertisecentrum
      blijft vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 28b.10
    text: |-
      Het bepaalde bij of krachtens de [artikelen 23][ref1], [32][ref2], [33][ref3], [37][ref4], [38][ref5], [62][ref6],
      [63][ref7], [64][ref8] en [65][ref9] is van overeenkomstige toepassing op het regionaal expertisecentrum en het
      personeel daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel37
      [ref5]: https://wetten.overheid.nl/BWBR0003549#Artikel38
