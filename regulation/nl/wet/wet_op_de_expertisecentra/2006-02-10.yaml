        artikel: '138'
        paragraaf: '5'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '169'
        afdeling: '11'
  - number: '139.5'
    text: |-
      Voor de vaststelling bedoeld in [artikel 138, eerste en zevende lid][ref1], en [artikel 139, eerste lid][ref2],
      worden met betrekking tot een school waaraan een of meer afdelingen zijn verbonden, de bedragen die voor een
      zodanige school, de afdeling of afdelingen daaronder begrepen, zijn uitgegeven dan wel ontvangen, toegerekend
      aan de school, onderscheidenlijk de afdeling of afdelingen, naar rato van het aantal leerlingen dat in het
      desbetreffende kalenderjaar in aanmerking kwam voor het volgen van onderwijs aan de school, onderscheidenlijk de
      desbetreffende afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel139
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel139
