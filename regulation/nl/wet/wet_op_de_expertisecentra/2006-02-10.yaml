        bwb_id: BWBR0002399
  - number: '143.3'
    text: |-
      De verstrekte overschrijdingsbedragen worden ten behoeve van het onderwijs aan de scholen van het bevoegd gezag
      aangewend.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel143
  - number: '143.4'
    text: |-
      De op grond van [artikel 134][ref1] of [artikel 135][ref2] verstrekte vergoeding wordt besteed aan het doel
      waarvoor zij is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel135
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '134'
        paragraaf: '4'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '135'
        paragraaf: '4'
        afdeling: '7'
  - number: '144.1'
    text: |-
      Op de bekostiging of onderdelen daarvan kunnen voorschotten worden verleend volgens regels, te stellen bij of
      krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel144
  - number: '144.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden tevens voorschriften gegeven voor de verrekening van de
      betaalde voorschotten met het bedrag van de vastgestelde bekostiging of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel144
  - number: '146.1'
    text: |-
      Indien het bevoegd gezag van een school in strijd handelt met het bepaalde bij of krachtens deze wet, kan Onze
      minister bepalen dat de bekostiging, voorschotten daaronder begrepen, geheel of gedeeltelijk wordt ingehouden dan
      wel opgeschort.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel146
  - number: '146.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien het bevoegd gezag of het personeel van een school in
      strijd handelt met [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '146.3'
    text: |-
      Onze minister kent de bekostiging wederom toe, indien blijkt dat de reden voor de toepassing van het eerste of
      tweede lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel146
  - number: 146a.1
    text: |-
      Indien de kwaliteit van het onderwijs ernstig of langdurig tekortschiet, kan Onze minister op verzoek van het
      bevoegd gezag van een school of uit eigen beweging in overeenstemming met het bevoegd gezag maatregelen treffen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel146a
  - number: 146a.2
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de instelling ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel146a
  - number: 146a.3
    text: |-
      Onze minister stelt nadere regels omtrent de toekenning van en verantwoording voor maatregelen, voorzover deze het
      verstrekken van financiële middelen betreffen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel146a
  - number: '147.1'
    text: |-
      De bekostiging van een bijzondere school wordt beëindigd, indien het aantal leerlingen vastgesteld volgens
      [artikel 151][ref1], gedurende 2 achtereenvolgende schooljaren in elk van die jaren minder heeft bedragen dan het
      volgende aantal leerlingen:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel151
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '151'
        afdeling: '8'
  - number: 147.1.a
    text: 'de school voor speciaal onderwijs: 25 leerlingen;'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel147
  - number: 147.1.b
    text: 'de school voor voortgezet speciaal onderwijs: 29 leerlingen;'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel147
  - number: 147.1.c
    text: 'de school of de instelling voor speciaal en voortgezet speciaal onderwijs: 33 leerlingen;'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel147
  - number: 147.1.d
    text: 'de afdeling: 8 leerlingen.'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel147
  - number: '147.2'
    text: Het eerste lid is niet van toepassing op de eerste 5 volledige schooljaren van de bekostiging van de school.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel147
  - number: '147.3'
    text: |-
      Onze minister kan op verzoek van het bevoegd gezag, burgemeester en wethouders van de betrokken gemeente gehoord,
      besluiten dat, in afwijking van het eerste lid, de bekostiging wordt voortgezet indien aan de school behoefte
      bestaat. Tevens hoort Onze minister gedeputeerde staten van de betrokken provincie voor zover het scholen betreft
      bedoeld in [artikel 78, eerste lid][ref1]. Het verzoek wordt ingediend voor 16 oktober van het schooljaar volgend
      op de 2 achtereenvolgende schooljaren, bedoeld in de aanhef van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel78
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '78'
        afdeling: '2'
  - number: '147.4'
    text: |-
      Het besluit van Onze minister op het verzoek, bedoeld in het derde lid, wordt genomen voor 16 februari volgend
      op de datum 16 oktober genoemd in het derde lid. Indien Onze minister niet voor 16 februari heeft besloten, wordt
      het verzoek geacht te zijn ingewilligd. Een besluit van Onze minister dat de bekostiging wordt voortgezet, geldt
      telkens voor ten hoogste 3 schooljaren.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel147
  - number: '147.5'
    text: |-
      De beëindiging van de bekostiging geschiedt met ingang van 1 augustus van het tweede schooljaar volgend op de
      2 achtereenvolgende schooljaren, bedoeld in de aanhef van het eerste lid, tenzij door Onze minister bij zijn
      afwijzing van het verzoek, bedoeld in het derde lid, of bij een in beroep gegeven uitspraak anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel147
  - number: '147.6'
    text: |-
      Van zijn besluit en van de uitspraak in beroep wordt door Onze Minister mededeling gedaan door toezending van een
      afschrift aan gedeputeerde staten en aan burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel147
  - number: '147.7'
    text: |-
      Indien het aantal leerlingen van de betrokken school vastgesteld volgens [artikel 151][ref1] in het schooljaar
      volgend op de twee achtereenvolgende schooljaren, bedoeld in de aanhef van het eerste lid, gelijk is aan of meer
      bedraagt dan het op grond van het eerste lid voor die school geldende aantal, wordt de bekostiging niet beëindigd
      op grond van dit artikel. De procedures die in werking zijn gesteld op grond van het derde tot en met het zesde
      lid, eindigen van rechtswege en besluiten, genomen op grond van het derde tot en met het zesde lid, vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel151
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '151'
        afdeling: '8'
  - number: '148.1'
    text: |-
      De gemeenteraad besluit, behoudens het bepaalde in het derde lid, tot opheffing van een openbare school indien het
      aantal leerlingen vastgesteld volgens [artikel 151][ref1], gedurende 2 achtereenvolgende schooljaren in elk van die
      jaren minder heeft bedragen dan het volgende aantal leerlingen:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel151
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '151'
        afdeling: '8'
  - number: 148.1.a
    text: 'de school voor speciaal onderwijs: 25 leerlingen;'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel148
  - number: 148.1.b
    text: 'de school voor voortgezet speciaal onderwijs: 29 leerlingen;'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel148
  - number: 148.1.c
    text: 'de school of de instelling voor speciaal en voortgezet speciaal onderwijs: 33 leerlingen;'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel148
  - number: 148.1.d
    text: 'de afdeling: 8 leerlingen.'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel148
  - number: '148.2'
    text: Het eerste lid is niet van toepassing op de eerste 5 volledige schooljaren van de bekostiging van de school.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel148
  - number: '148.3'
    text: |-
      In de gevallen, genoemd in het eerste lid, besluit de gemeenteraad tot instandhouding van de school indien deze
      noodzakelijk is om voldoende te voorzien in de behoefte aan openbaar onderwijs. Dit besluit wordt genomen voor 16
      oktober van het schooljaar volgend op de 2 achtereenvolgende schooljaren, bedoeld in de aanhef van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel148
  - number: '148.4'
    text: |-
      De besluiten van de gemeenteraad, bedoeld in het eerste en derde lid, worden onderworpen aan de goedkeuring
      van gedeputeerde staten voor zover het scholen betreft als bedoeld in [artikel 78, eerste lid][ref1], en aan
      de goedkeuring van Onze minister voor zover het scholen betreft als bedoeld in [artikel 86, eerste lid][ref2].
      Gedeputeerde staten en Onze minister onthouden hun goedkeuring ten aanzien van besluiten op grond van het eerste
      lid, indien ten gevolge van de opheffing van de school, afhankelijk van de schoolsoort, regionaal, provinciaal dan
      wel landelijk niet meer voldoende zou zijn voorzien in de behoefte aan openbaar onderwijs. Gedeputeerde staten en
      Onze minister onthouden hun goedkeuring ten aanzien van besluiten op grond van het derde lid, indien instandhouding
      van de school, afhankelijk van de schoolsoort, regionaal, provinciaal dan wel landelijk niet noodzakelijk is om
      voldoende te voorzien in de behoefte aan openbaar onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel86
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '78'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '86'
        afdeling: '2'
  - number: '148.5'
    text: |-
      Gedeputeerde staten en Onze minister besluiten voor 16 februari volgend op de datum 16 oktober, genoemd in het
      eerste lid, laatste volzin, en derde lid, laatste volzin. Indien gedeputeerde staten, onderscheidenlijk Onze
      minister niet voor 16 februari hebben besloten, wordt het desbetreffende besluit van de gemeenteraad geacht te zijn
      goedgekeurd. Het onthouden van de goedkeuring van gedeputeerde staten, onderscheidenlijk Onze minister ten aanzien
      van het besluit van de gemeenteraad, bedoeld in het eerste lid, dan wel de goedkeuring van gedeputeerde staten,
      onderscheidenlijk Onze minister ten aanzien van het besluit van de gemeenteraad, bedoeld in het derde lid, geldt
      telkens voor ten hoogste 3 schooljaren.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel148
  - number: '148.6'
    text: |-
      De besluiten van de gemeenteraad, van gedeputeerde staten en van Onze minister, bedoeld in het eerste en het derde
      tot en met vijfde lid, worden bekendgemaakt door een openbare kennisgeving binnen 2 weken na de datum waarop het
      besluit is genomen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel148
  - number: '148.7'
    text: |-
      De opheffing geschiedt met ingang van 1 augustus van het tweede schooljaar volgend op de 2 achtereenvolgende
      schooljaren, bedoeld in de aanhef van het eerste lid, tenzij door gedeputeerde staten of Onze minister bij hun,
      onderscheidenlijk zijn besluit, of bij een in beroep gegeven uitspraak anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel148
  - number: '148.8'
    text: |-
      Indien het aantal leerlingen van de betrokken school vastgesteld volgens [artikel 151][ref1] in het schooljaar
      volgend op de 2 achtereenvolgende schooljaren, bedoeld in de aanhef van het eerste lid, gelijk is aan of meer
      bedraagt dan het op grond van het eerste lid voor die school geldende aantal, wordt de school niet opgeheven op
      grond van dit artikel. De procedures die in werking zijn gesteld op grond van het vierde tot en met het zevende
      lid, eindigen van rechtswege en beslissingen, genomen op grond van het vierde tot en met het zevende lid,
      vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel151
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '151'
        afdeling: '8'
  - number: '149.1'
    text: |-
      De gemeenteraad kan besluiten tot vermindering van het aantal openbare scholen in de gemeente. Het besluit wijst
      tevens de op te heffen scholen aan en het tijdstip met ingang waarvan de opheffing geschiedt. Opheffing van een
      school vindt niet plaats indien instandhouding van die school noodzakelijk is om voldoende te voorzien in de
      behoefte aan openbaar onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel149
  - number: '149.2'
    text: |-
      Een besluit als bedoeld in het eerste lid wordt genomen voor 16 februari voorafgaand aan het schooljaar waarin de
      opheffing geschiedt, dan wel, indien het besluit meer dan een school betreft, voorafgaand aan het schooljaar waarin
      de eerste van deze scholen wordt opgeheven. Het besluit wordt onderworpen aan de goedkeuring van gedeputeerde
      staten, voor zover het scholen betreft als bedoeld in [artikel 78, eerste lid][ref1], en aan de goedkeuring van
      Onze minister, voor zover het scholen betreft als bedoeld in [artikel 86, eerste lid][ref2]. Gedeputeerde staten
      en Onze minister onthouden hun goedkeuring ten aanzien van het besluit voor zover ten gevolge van de opheffing van
      een school, afhankelijk van de schoolsoort, regionaal, provinciaal dan wel landelijk niet meer voldoende zou zijn
      voorzien in de behoefte aan openbaar onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel86
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '78'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '86'
        afdeling: '2'
  - number: '149.3'
    text: |-
      Gedeputeerde staten en Onze minister beslissen voor 16 februari volgend op de in het tweede lid genoemde datum.
      Indien gedeputeerde staten, onderscheidenlijk Onze minister, niet voor 16 februari hebben beslist, wordt het
      desbetreffende besluit van de gemeenteraad geacht te zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel149
  - number: '149.4'
    text: |-
      De besluiten van de gemeenteraad, van gedeputeerde staten en van Onze minister, genomen op grond van dit artikel,
      worden bekendgemaakt door een openbare kennisgeving binnen 2 weken na de datum waarop het besluit is genomen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel149
  - number: '150.1'
    text: |-
      Indien de bekostiging van een bijzondere school ingevolge [artikel 147][ref1] wordt beëindigd of het bevoegd gezag
      beslist tot opheffing van de school, eindigt het recht op het gebouw en terrein en worden alle roerende zaken,
      behalve die welke het bevoegd gezag uit eigen middelen heeft aangeschaft, aan de gemeente overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel147
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '147'
        afdeling: '8'
  - number: '150.2'
    text: |-
      [Artikel 108, eerste tot en met vierde lid][ref1], is van overeenkomstige toepassing met dien verstande dat in
      de verklaring ingevolge het eerste lid en het besluit ingevolge het tweede lid als datum waarop het bevoegd gezag
      blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein voor de school te gebruiken, zal
      worden genoemd de datum waarop de bekostiging is geëindigd dan wel zal eindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel108
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '108'
        afdeling: '3'
  - number: 150a.1
    text: |-
      Indien de bekostiging van de laatste bijzondere school van een bevoegd gezag wordt beëindigd of het bevoegd gezag
      tot de opheffing van de laatste school beslist, dan wel de laatste openbare school wordt opgeheven, stort het
      bevoegd gezag de niet bestede bekostigingsbedragen terug in de desbetreffende overheidskas.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel150a
  - number: 150a.2
    text: Het exploitatietekort blijft in de gevallen, bedoeld in het eerste lid, voor rekening van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel150a
  - number: 150a.3
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de wijze waarop het
      exploitatieoverschot, bedoeld in het eerste lid, wordt berekend.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel150a
  - number: '151'
    text: |-
      Grondslag voor de berekening van het aantal leerlingen, bedoeld in de [artikelen 147][ref1] en [148][ref2], is het
      aantal leerlingen op 1 oktober.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel147
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel148
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '147'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '148'
        afdeling: '8'
  - number: '152.1'
    text: |-
      Bij algemene maatregel van bestuur wordt voor een periode van telkens 4 schooljaren een landelijk beleidskader
      vastgesteld. De algemene maatregel van bestuur, bedoeld in de eerste volzin, wordt aan de beide kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en
      gedurende die termijn niet door of namens een van beide kamers de wens wordt te kennen gegeven dat het in die
      maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig
      mogelijk ingediend. Het bepaalde in de vorige drie volzinnen is niet van toepassing, voor zover het ontwerp van de
      algemene maatregel van bestuur voordien aan beide kamers der Staten-Generaal is overgelegd en door of namens een
      der kamers te kennen is gegeven dat van de procedure, bedoeld in de tweede tot en met vierde volzin, kan worden
      afgeweken.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel152
  - number: '152.2'
    text: |-
      Het landelijk beleidskader vermeldt de landelijke doelstellingen van het beleid inzake
      onderwijsachterstandenbestrijding en verstrekt informatie over de voornemens van de rijksoverheid met betrekking
      tot de landelijke evaluatie van het beleid inzake onderwijsachterstandenbestrijding.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel152
  - number: '153.1'
    text: |-
      De gemeenteraad stelt voor een periode van telkens 4 schooljaren een plan vast, onderwijsachterstandenplan genaamd,
      ter bestrijding van onderwijsachterstanden. Indien het totaal van de voor de bestrijding van onderwijsachterstanden
      bestemde middelen, bedoeld in het vierde lid, onderdelen a en c, jaarlijks minder is dan € 113 500 kan de
      gemeenteraad afzien van de vaststelling van het plan. In dat geval besluit de gemeenteraad op andere wijze omtrent
      de verdeling van de middelen, bedoeld in het vierde lid, onderdelen a en b, waarbij de gemeenteraad het landelijk
      beleidskader in acht neemt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: '153.2'
    text: |-
      Onder onderwijsachterstanden worden verstaan die negatieve effecten op de leer- en ontwikkelingsmogelijkheden van
      leerlingen, die het gevolg zijn van sociale, economische en culturele omstandigheden.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: '153.3'
    text: 'Het onderwijsachterstandenplan vermeldt in elk geval:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: 153.3.a
    text: |-
      de wijze waarop de doelstellingen, genoemd in het landelijk beleidskader, bedoeld in [artikel 152][ref1], in
      kwalitatieve en kwantitatieve zin worden uitgewerkt,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel152
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '152'
        afdeling: '9'
  - number: 153.3.b
    text: |-
      de wijze waarop de voor de bestrijding van onderwijsachterstanden bestemde middelen, anders dan de in onderdeel c
      genoemde middelen, worden ingezet, alsmede de scholen en instellingen die de daaruit voortvloeiende activiteiten
      zullen verrichten,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: 153.3.c
    text: |-
      de wijze waarop de scholen de bekostiging, die is toegekend voor het bestrijden van onderwijsachterstanden met dien
      verstande dat de scholen de zeggenschap hebben over de wijze waarop dit wordt geoperationaliseerd,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: 153.3.d
    text: |-
      de wijze waarop de scholen verantwoording afleggen over de inzet van de in onderdeel c bedoelde middelen in
      overeenstemming met het plan, en de wijze waarop de scholen en instellingen rekening en verantwoording afleggen
      inzake de besteding van de middelen, bedoeld in het vierde lid, onderdelen a en b,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: 153.3.e
    text: de procedure met betrekking tot de wijziging van het plan, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: 153.3.f
    text: de wijze waarop de gemeenteraad het gemeentelijk onderwijsachterstandenbeleid evalueert.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: '153.4'
    text: |-
      Het onderwijsachterstandenplan vermeldt tevens de omvang van de voor de bestrijding van onderwijsachterstanden
      bestemde middelen, waarbij onderscheid wordt gemaakt tussen:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: 153.4.a
    text: |-
      de middelen die de gemeente als specifieke uitkering, bedoeld in [artikel 154][ref1], uit 's Rijks kas ontvangt
      voor de bestrijding van onderwijsachterstanden,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel154
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '154'
        afdeling: '9'
  - number: 153.4.b
    text: |-
      de middelen, anders dan bedoeld in onderdeel a, die de gemeenteraad bestemt voor de bestrijding van
      onderwijsachterstanden, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: 153.4.c
    text: de middelen, bedoeld in het derde lid, onderdeel c, die de scholen ontvangen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: '153.5'
    text: 'Het onderwijsachterstandenplan heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: 153.5.a
    text: basisscholen en speciale scholen voor basisonderwijs,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: 153.5.b
    text: scholen als bedoeld in deze wet,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: 153.5.c
    text: |-
      scholen als bedoeld in de [Wet op het voortgezet onderwijs][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 153.5.d
    text: andere instellingen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: '153.6'
    text: |-
      Vaststelling en wijziging van het onderwijsachterstandenplan of het nemen van een besluit omtrent de verdeling
      van middelen indien wordt afgezien van vaststelling van het plan, geschiedt niet dan na op overeenstemming
      gericht overleg met de bevoegde gezagsorganen van alle scholen in de gemeente. De gemeenteraad stelt daartoe bij
      verordening een procedure vast, met dien verstande dat in de verordening in ieder geval wordt bepaald:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: 153.6.a
    text: |-
      vanaf wanneer en tot welk moment het gemeentebestuur de Onderwijsraad kan verzoeken een advies als bedoeld in het
      tiende lid, uit te brengen,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: 153.6.b
    text: |-
      dat de termijn voor het uitbrengen van het advies wordt opgeschort met ingang van de dag waarop de Onderwijsraad
      het gemeentebestuur uitnodigt het verzoek voor het uitbrengen van het advies aan te vullen met de gegevens die de
      Onderwijsraad nodig heeft voor een goede vervulling van diens taak, tot de dag waarop het verzoek is aangevuld, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: 153.6.c
    text: dat het gemeentebestuur gedurende de termijn voor het uitbrengen van het advies geen besluit neemt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: '153.7'
    text: |-
      Binnen een jaar na de vaststelling van het landelijk beleidskader, bedoeld in [artikel 152][ref1], stelt de
      gemeenteraad het onderwijsachterstandenplan vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel152
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '152'
        afdeling: '9'
  - number: '153.8'
    text: Het onderwijsachterstandenplan kan tussentijds worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: '153.9'
    text: |-
      Indien de vaststelling en wijziging van het onderwijsachterstandenplan of een besluit omtrent de verdeling van
      middelen indien wordt afgezien van vaststelling van het plan, leiden tot kosten van werkloosheidsuitkeringen, komen
      deze kosten ten laste van het Rijk indien het ontstaan van deze kosten in redelijkheid is toe te rekenen aan het
      Rijk.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: '153.10'
    text: |-
      Tijdens het in het zesde lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit
      te brengen over de vaststelling of wijziging van het onderwijsachterstandenplan in relatie tot de vrijheid van
      richting en de vrijheid van inrichting. Het verzoek wordt gedaan indien het bevoegd gezag hierom heeft gevraagd
      dan wel uit eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht.
      Het advies wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekendgemaakt tezamen met
      het plan. Dit lid is van overeenkomstige toepassing op een besluit omtrent de verdeling van middelen indien wordt
      afgezien van vaststelling van het plan.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: '153.11'
    text: |-
      Het gemeentebestuur kan een subsidieplafond vaststellen en bepalen hoe het beschikbare bedrag met inachtneming
      daarvan wordt verdeeld.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel153
  - number: '154.1'
    text: |-
      Bij algemene maatregel van bestuur worden de criteria vastgesteld op grond waarvan een gemeente voor telkens
      een periode van 4 jaar in aanmerking komt voor een specifieke uitkering ter tegemoetkoming in de kosten voor het
      bestrijden van onderwijsachterstanden, alsmede de criteria voor de hoogte daarvan. De uitkering wordt per jaar
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel154
  - number: '154.2'
    text: |-
      De gemeente verstrekt de middelen, bedoeld in [artikel 153, vierde lid, onderdelen a en b][ref1], aan de
      rechtspersonen die daarvoor in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel153
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '153'
        afdeling: '9'
  - number: '154.3'
    text: |-
      Onze minister kan voor bij ministeriële regeling aan te wijzen gevallen of groepen van gevallen tegemoetkomen
      aan onbillijkheden van overwegende aard, welke zich bij de toepassing van het eerste lid van dit artikel mochten
      voordoen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel154
  - number: '155'
    text: |-
      Onze minister kan de uitkering geheel of gedeeltelijk terugvorderen indien uit de jaarrekening, bedoeld in
      [artikel 197 van de Gemeentewet][ref1], het jaarverslag, bedoeld in [artikel 197 van de Gemeentewet][ref2],
      de accountantsverklaring, bedoeld in [artikel 213, derde lid, van de Gemeentewet][ref3], het
      verslag van bevindingen, bedoeld in [artikel 213, vierde lid, van de Gemeentewet][ref4], dan wel
      uit een afzonderlijke verantwoording, voorzien van een verklaring van een accountant, als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref5], niet blijkt dat de uitkering is besteed in
      overeen-stemming met de bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '197'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '197'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '213'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '213'
      - id: ref5
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '156.1'
    text: |-
      Het toezicht op het gemeentelijk onderwijsachterstandenbeleid in de gemeente is opgedragen aan het gemeentebestuur.
      Het toezicht op het gemeentebestuur in verband met de evaluatie van de landelijke doelstellingen van het
      beleid inzake onderwijsachterstandenbestrijding wordt uitgeoefend door bij besluit van Onze minister aangewezen
      personen. Het toezicht op de bevoegde gezagsorganen van de scholen en andere instellingen die betrokken zijn of
      betrokken worden bij de uitvoering van het plan of een besluit omtrent de verdeling van middelen indien wordt
      afgezien van de vaststelling van het plan, wordt in verband met de opstelling van het plan of het in deze volzin
      bedoelde besluit en voor de evaluatie uitgeoefend door bij besluit van de gemeenteraad aangewezen personen. De
      [artikelen 5:12 tot en met 5:17][ref1] en [5:20 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '156.2'
    text: |-
      Indien het bevoegd gezag van een school naar het oordeel van de gemeenteraad de middelen, bedoeld in
      [artikel 153, vierde lid, onderdelen a en b][ref1], niet besteedt overeenkomstig het onderwijsachterstandenplan,
      kan de gemeenteraad de middelen geheel of gedeeltelijk inhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel153
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '153'
        afdeling: '9'
  - number: '156.3'
    text: |-
      Indien het bevoegd gezag van een school naar het oordeel van de gemeenteraad de middelen, bedoeld in
      [artikel 153, vierde lid, onderdeel c][ref1], niet besteedt overeenkomstig het onderwijsachterstandenplan, maakt de
      gemeenteraad hiervan melding aan Onze minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel153
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '153'
        afdeling: '9'
  - number: '156.4'
    text: |-
      Indien het gemeentebestuur naar het oordeel van Onze minister de voorschriften in deze afdeling niet nakomt, kan
      Onze minister de uitkering, bedoeld in [artikel 154][ref1], geheel of gedeeltelijk inhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel154
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '154'
        afdeling: '9'
  - number: '156.5'
    text: |-
      Indien Onze Minister toepassing geeft aan het vierde lid in verband met een besluit van het gemeentebestuur dat
      leidt tot kosten van werkloosheidsuitkeringen en de rechtspersoon, bedoeld in [artikel 170, eerste lid][ref1],
      een verzoek als bedoeld in [artikel 132, derde lid][ref2], met betrekking tot een niet door de gemeente in stand
      gehouden school als gevolg van dat besluit van het gemeentebestuur heeft ingewilligd, vergoedt Onze Minister aan
      deze rechtspersoon de als gevolg van die inwilliging gemaakte kosten van werkloosheidsuitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel170
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel132
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '170'
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '132'
        paragraaf: '3'
        afdeling: '7'
  - number: '157.1'
    text: |-
      Het bevoegd gezag onderscheidenlijk het regionaal expertisecentrum stelt jaarlijks een jaarverslag over het
      voorafgaande kalenderjaar vast. Op deze jaarverslaggeving is [Boek 2, titel 9, van het Burgerlijk Wetboek][ref1],
      met uitzondering van de afdelingen 1, 11 en 12, van overeenkomstige toepassing voor zover bij of krachtens algemene
      maatregel van bestuur niet anders is bepaald. Het jaarverslag bestaat tenminste uit de volgende onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 157.1.a
    text: |-
      een bestuursverslag als bedoeld in [artikel 391 van Boek 2 van het Burgerlijk Wetboek][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel391
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '391'
  - number: 157.1.b
    text: |-
      een jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1], met daarbij ingevolge
      het derde lid vast te stellen bijlagen,


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
  - number: 157.1.c
    text: |-
      overige gegevens als bedoeld in [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel392
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '392'
  - number: '157.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald welke onderdelen het jaarverslag tevens dient te bevatten,
      dan wel welke onderdelen komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel157
  - number: '157.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een nadere invulling worden gegeven aan de onderdelen, bedoeld
      in het eerste en tweede lid, en kunnen nadere voorschriften worden gegeven over:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel157
  - number: 157.3.a
    text: de indeling en de wijze van ordening van de gegevens per onderdeel van het jaarverslag,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel157
  - number: 157.3.b
    text: de wijze en het tijdstip waarop de desbetreffende onderdelen beschikbaar gesteld moeten worden,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel157
  - number: 157.3.c
    text: de elektronische verzending van het cijfermatige deel uit de jaarrekening, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel157
  - number: 157.3.d
    text: de grondslagen voor de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel157
  - number: '157.4'
    text: |-
      De beschikbaarstelling van de gegevens, bedoeld in het derde lid, onder b, gaat vergezeld van een verklaring
      omtrent de getrouwheid en rechtmatigheid, afgegeven door een door het bevoegd gezag aangewezen accountant
      als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. Bij de aanwijzing
      van de accountant bedingt het bevoegd gezag dat de controle overeenkomstig een door Onze minister vast te
      stellen controleprotocol plaatsvindt en dat aan Onze minister op diens verzoek inzicht wordt geboden in de
      controlerapporten van de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '158.1'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het ten behoeve van Onze minister beschikt over geordende gegevens die
      van belang zijn voor de berekening van de hoogte van de bekostiging, alsmede over een verklaring over de juistheid
      van de bekostigingsgegevens, afgegeven door een door het bevoegd gezag aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '158.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de definiëring,
      de wijze van ordening en de beschikbaarstelling van de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel158
  - number: '158.3'
    text: |-
      Het bevoegd gezag bewaart de gegevens, bedoeld in het eerste lid, en de desbetreffende boeken en bescheiden
      gedurende een periode van zeven jaren.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel158
  - number: '159.1'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het beschikt over geordende gegevens ten behoeve van het door Onze
      minister te voeren beleid met betrekking tot het onderwijs, bedoeld in deze wet, en verleent desgevraagd
      medewerking aan door of namens Onze minister uit te voeren onderzoek dat geheel of mede op deze gegevens is
      gebaseerd.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel159
  - number: '159.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de definiëring,
      de wijze van ordening en de beschikbaarstelling van de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel159
  - number: '160'
    text: |-
      De voorschriften, bedoeld in [artikel 157, derde lid][ref1], [artikel 158, tweede lid][ref2], en
      [artikel 159, tweede lid][ref3], hebben geen betrekking op het persoonsgebonden nummer van een leerling of op de
      andere gegevens, bedoeld in [artikel 164a, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel158
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel159
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel164a
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '157'
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '158'
        afdeling: '10'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '159'
        afdeling: '10'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: 164a
        afdeling: '11'
  - number: '161.1'
    text: |-
      De accountant die door Onze minister is belast met het onderzoek van de controlerapporten, bedoeld in
      [artikel 157, vierde lid][ref1], en met het onderzoek van de juistheid van de bekostigingsgegevens, bedoeld
      in [artikel 158][ref2], heeft met het oog op het verrichten van dat onderzoek toegang tot de plaats waar de
      desbetreffende boeken en bescheiden worden bewaard. Aan de accountant wordt desgevraagd inzage in de boeken en
      bescheiden gegeven en worden alle inlichtingen verstrekt die deze voor de uitvoering van zijn taak nodig oordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel158
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '157'
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '158'
        afdeling: '10'
  - number: '161.2'
    text: |-
      Onze minister kan naast het accountantsonderzoek, bedoeld in het eerste lid, een onderzoek instellen of doen
      instellen naar de rechtmatigheid van het beheer op grond van de beschikbare controlerapporten, bedoeld in
      [artikel 157, vierde lid][ref1], en de bekostigingsgegevens, bedoeld in [artikel 158][ref2]. Het bevoegd gezag
      onderscheidenlijk het regionaal expertisecentrum verstrekt aan degene die door Onze minister met het onderzoek is
      belast, alle inlichtingen die deze voor de uitvoering van zijn taak nodig oordeelt en geeft desgevraagd inzage in
      de boeken en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel158
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '157'
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '158'
        afdeling: '10'
  - number: 162a.1
    text: |-
      Onder een voortijdige schoolverlater in de zin van deze afdeling wordt verstaan degene op wie
      [artikel 47a, eerste lid onder a en b][ref1], van toepassing is en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel47a
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel162a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 47a
        paragraaf: '3'
        afdeling: '1'
  - number: 162a.1.a
    text: |-
      die het onderwijs aan de school waaraan hij is ingeschreven gedurende een aaneengesloten periode van ten minste een
      maand of een door het bevoegd gezag te bepalen kortere periode zonder geldige reden niet meer volgt, of
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel162a
  - number: 162a.1.b
    text: |-
      die niet meer aan een school is ingeschreven en evenmin is ingeschreven aan een school als
      bedoeld in de [Wet op het voortgezet onderwijs][ref1] dan wel aan een instelling als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel162a
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0007625
  - number: 162a.2
    text: |-
      Voor zover nodig in afwijking van het eerste lid wordt onder een voortijdig schoolverlater niet
      verstaan degene die in het bezit is van een getuigschrift van het praktijkonderwijs als bedoeld in
      [artikel 10f van de Wet op het voortgezet onderwijs][ref1] dan wel een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid onderdeel a, van de Wet educatie en beroepsonderwijs][ref2] en werkzaam is op grond van
      een aanstelling of arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel162a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10f
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 162b.1
    text: |-
      Burgemeester en wethouders dragen zorg voor registratie van de gegevens die het bevoegd gezag ingevolge
      [artikel 47a][ref1] heeft gemeld. Burgemeester en wethouders dragen bovendien zorg voor een systeem van
      doorverwijzing naar onderwijs of arbeidsmarkt van de in [artikel 162a][ref2] bedoelde voortijdige schoolverlaters
      en voor het onderhoud van dit systeem. Het systeem heeft mede betrekking op de gegevens waarover de gemeente
      beschikt in het kader van de uitvoering van de [Leerplichtwet 1969][ref3]. Voor de uitvoering van de eerste en
      tweede volzin kunnen bij ministeriële regeling nadere voorschriften worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel47a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel162a
      [ref3]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel162b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 47a
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 162a
        afdeling: 10A
      - id: ref3
        bwb_id: BWBR0002628
  - number: 162b.2
    text: |-
      Voor de vervulling van hun in het eerste lid bedoelde taken werken de colleges van burgemeester en wethouders
      samen binnen bij of krachtens algemene maatregel van bestuur vastgestelde regio's. Zij maken tevens afspraken
      met scholen, scholen en instellingen als bedoeld in de [Wet op het voortgezet onderwijs][ref1], instellingen als
      bedoeld in de [Wet educatie en beroepsonderwijs][ref2] en organisaties die zijn betrokken bij het voorkomen en
      bestrijden van voortijdig schoolverlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel162b
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0007625
  - number: 162b.3
    text: |-
      De gemeentebesturen in een regio wijzen uit hun midden een contactgemeente aan. Deze aanwijzing wordt onverwijld
      gemeld aan Onze minister. Burgemeester en wethouders van de contactgemeente vervullen coördinerende taken met het
      oog op het voorkomen en bestrijden van voortijdig schoolverlaten. In dat verband:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel162b
  - number: 162b.3.a
    text: |-
      maken zij afspraken met de in het tweede lid bedoelde scholen, instellingen en organisaties over de inzet en
      verantwoordelijkheid bij het voorkomen en bestrijden van voortijdig schoolverlaten;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel162b
  - number: 162b.3.b
    text: dragen zij zorg voor de totstandkoming van een regionaal netwerk van die scholen, instellingen en organisaties;
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel162b
  - number: 162b.3.c
    text: organiseren en coördineren zij de in het eerste lid bedoelde melding, registratie en doorverwijzing.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel162b
  - number: 162b.4
    text: |-
      Indien gemeentebesturen in een regio een andere contactgemeente aanwijzen, dragen burgemeester en wethouders van de
      vorige contactgemeente alle bescheiden die betrekking hebben op de uitvoering van dit artikel over aan burgemeester
      en wethouders van de opvolgende contactgemeente. De wijziging van de aanwijzing wordt onverwijld gemeld aan Onze
      minister.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel162b
  - number: 162b.5
    text: |-
      Ter tegemoetkoming in de kosten van uitvoering van het eerste tot en met derde lid kent Onze minister binnen
      het raam van de door de begrotingswetgever beschikbaar gestelde middelen jaarlijks uiterlijk in september ten
      behoeve van de activiteiten van de gemeentebesturen in de regio aan de contactgemeente een specifieke uitkering
      toe. Deze uitkering heeft betrekking op het daarop volgende kalenderjaar. De contactgemeente draagt er zorg voor
      dat de gemeentebesturen in de regio gebruik kunnen maken van de instrumenten die met behulp van deze uitkering
      zijn verwezenlijkt. Bij of krachtens algemene maatregel van bestuur worden regels gegeven voor de berekening en
      betaling van de uitkering. De berekening geschiedt in elk geval aan de hand van het aantal volwassen inwoners van
      de gemeenten in de regio op 1 januari van het jaar voorafgaande aan het jaar van de uitkering, waarbij rekening
      wordt gehouden met het opleidingsniveau en met de etnische achtergrond van die inwoners. Bij de berekening van een
      deel van de uitkering kunnen de volwassen inwoners van gemeenten die op grond van een andere regeling reeds een
      vergoeding voor de bestrijding van voortijdig schoolverlaten ontvangen, buiten beschouwing worden gelaten. Onze
      minister hanteert het aantal volwassen inwoners van de gemeenten in de regio dat blijkt uit de gegevens die het
      Centraal Bureau voor de Statistiek op verzoek van Onze minister daarover verstrekt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel162b
  - number: 162b.6
    text: |-
      Het bevoegd gezag geeft aan de door de gemeenteraad aangewezen personen alle gevraagde bescheiden ter inzage
      en verstrekt de gevraagde inlichtingen die van belang zijn voor het voorkomen en bestrijden van voortijdig
      schoolverlaten.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel162b
  - number: 162b.7
    text: |-
      De gemeentebesturen in een regio stellen streefcijfers vast voor de in die regio te behalen resultaten.
      Burgemeester en wethouders van de contactgemeente stellen mede namens de andere gemeenten in de regio jaarlijks
      een effectrapportage vast waarin zowel de streefcijfers als de bereikte resultaten zijn aangegeven en waarin
      afwijkingen worden toegelicht.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel162b
  - number: 162b.8
    text: |-
      Indien burgemeester en wethouders van de contactgemeente het bepaalde bij of krachtens het eerste tot en met
      zevende lid niet nakomen, kan Onze minister de uitkering geheel of gedeeltelijk inhouden of opschorten. Onze
      minister gaat niet over tot gehele of gedeeltelijke inhouding dan na overleg met burgemeester en wethouders van
      de contactgemeente. Onze minister kan de uitkering wederom toekennen indien de reden voor inhouding of opschorting
      is vervallen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel162b
  - number: 162b.9
    text: |-
      Onze minister kan de in het vijfde lid bedoelde uitkering geheel of gedeeltelijk terugvorderen indien
      uit de rekening van de gemeente, bedoeld in [artikel 197 van de Gemeentewet][ref1], het gemeentelijk
      verslag omtrent het financieel beheer, bedoeld in [artikel 197 van de Gemeentewet][ref2], het
      verslag van de accountant, bedoeld in [artikel 213, tweede lid, van de Gemeentewet][ref3], dan wel
      uit een afzonderlijke verantwoording, voorzien van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4], niet blijkt dat de uitkering is besteed in
      overeenstemming met de bepalingen van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel162b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '197'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '197'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '213'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 162c.1
    text: |-
      Burgemeester en wethouders van de contactgemeente zenden de in [artikel 162b, zevende lid][ref1], bedoelde
      effectrapportage aan Onze minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel162b
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel162c
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 162b
        afdeling: 10A
  - number: 162c.2
    text: |-
      Burgemeester en wethouders zijn gehouden aan de door Onze minister aangewezen personen alle gevraagde bescheiden
      ter inzage te geven en de gevraagde inlichtingen te verstrekken die van belang zijn voor het door Onze minister te
      voeren beleid met betrekking tot het voortijdig schoolverlaten door niet-leerplichtigen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel162c
  - number: 162c.3
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent het tijdstip van indiening en de
      inrichting van de effectrapportage en inzake de wijze van beschikbaarstelling van de gegevens, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel162c
  - number: '163.1'
    text: |-
      Onze minister kan bepalen dat geen of slechts gedeeltelijke bekostiging wordt verstrekt voor uitgaven die het
      gevolg zijn van schuld of nalatigheid van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel163
  - number: '163.2'
    text: |-
      Indien de uitgaven bedoeld in het eerste lid, voor bekostiging door het Rijk in aanmerking komen, treedt het Rijk
      op het moment van een uitdrukkelijk besluit tot bekostiging in alle rechten die het bevoegd gezag ter zake tegen
      derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel163
  - number: '163.3'
    text: |-
      Indien de gemeente een collectieve verzekering heeft afgesloten voor de vergoeding van schade, ontstaan aan
      gebouwen, terreinen of roerende zaken van een door de gemeente bekostigde niet door de gemeente in stand gehouden
      school, heeft het bevoegd gezag van de desbetreffende school jegens de gemeente geen aanspraak op vergoeding van
      dergelijke schade, voor zover die collectieve verzekering de schade dekt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel163
  - number: '163.4'
    text: |-
      Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een niet door de gemeente in stand gehouden
      school voor vergoeding door de gemeente in aanmerking komt, treedt de gemeente op het moment van een uitdrukkelijk
      besluit tot vergoeding in alle rechten die het bevoegd gezag ter zake van die schade tegen derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel163
  - number: 164a.9
    text: |-
      Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een leerling ter uitvoering van
      [artikel 107, tweede en vijfde lid, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel164a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: '165.1'
    text: |-
      Het gemeentebestuur draagt al of niet in samenwerking met een of meer andere gemeentebesturen zorg voor de
      instandhouding van een schoolbegeleidingsdienst.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel165
  - number: '165.2'
    text: |-
      De schoolbegeleidingsdienst gaat uit van een gemeente of een andere rechtspersoon die krachtens de doelstelling en
      gezien de activiteiten niet het maken van winst beoogt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel165
  - number: '165.3'
    text: |-
      De schoolbegeleidingsdienst heeft tot taak het ten behoeve van elke school en uitgaande van de in elk
      van de scholen aanwezige behoeften op verzoek van het bevoegd gezag van die scholen verrichten van
      begeleidingsactiviteiten, ontwikkelingsactiviteiten, advisering, informatieverstrekking en evaluatie, alsmede van
      activiteiten die dienen tot bevordering van een optimale schoolloopbaan van leerlingen. Onder activiteiten die
      dienen tot bevordering van een optimale schoolloopbaan van leerlingen wordt mede verstaan het ondersteunen bij het
      onderwijs aan leerlingen van scholen voor speciaal onderwijs, voortgezet speciaal onderwijs, speciaal en voortgezet
      speciaal onderwijs als bedoeld in [artikel 2, tweede lid onder a, b, c, f, h, j, k, m of n][ref1], instellingen
      voor speciaal en voortgezet speciaal onderwijs als bedoeld in [artikel 8, eerste lid tweede volzin][ref2],
      basisscholen, speciale scholen voor basisonderwijs, scholen voor voortgezet onderwijs en instellingen voor
      beroepsonderwijs die zijn opgenomen in een ziekenhuis niet zijnde een academisch ziekenhuis of die in verband met
      ziekte thuis verblijven.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel8
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '8'
        paragraaf: '1'
        afdeling: '1'
  - number: '165.4'
    text: |-
      Het ondersteunen, bedoeld in het derde lid, kan in overeenstemming tussen de schoolbegeleidingsdienst en de school
      waarbij de leerling is ingeschreven, mede het geven van onderwijs aan de leerling betreffen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel165
  - number: '165.5'
    text: |-
      De schoolbegeleidingsdienst beschikt in ieder geval over deskundigen op de volgende terreinen: onderwijskunde,
      pedagogiek, orthopedagogiek, psychologie, organisatiekunde en informatie- en communicatietechnologie.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel165
  - number: '165.6'
    text: 'De gemeenteraad stelt jaarlijks vast:'
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel165
  - number: 165.6.a
    text: de omvang van de voor schoolbegeleiding bestemde middelen,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel165
  - number: 165.6.b
    text: |-
      welk deel van de voor schoolbegeleiding bestemde middelen wordt besteed aan door de schoolbegeleidingsdienst te
      verrichten activiteiten die aansluiten bij doelstellingen van lokaal onderwijsbeleid, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel165
  - number: 165.6.c
    text: |-
      de criteria waaraan de scholen moeten voldoen om voor door de schoolbegeleidingsdienst te verrichten activiteiten
      als bedoeld in onderdeel b in aanmerking te komen,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel165
  - number: '165.7'
    text: |-
      De gemeenteraad stelt voor het op overeenstemming gericht overleg bij verordening een procedure vast, met dien
      verstande dat in de verordening in ieder geval wordt bepaald:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel165
  - number: 165.7.a
    text: |-
      vanaf wanneer en tot welk moment het gemeentebestuur de Onderwijsraad kan verzoeken een advies als bedoeld in het
      achtste lid, uit te brengen,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel165
  - number: 165.7.b
    text: |-
      dat de termijn voor het uitbrengen van het advies wordt opgeschort met ingang van de dag waarop de Onderwijsraad
      het gemeentebestuur uitnodigt het verzoek voor het uitbrengen van het advies aan te vullen met de gegevens die de
      Onderwijsraad nodig heeft voor een goede vervulling van diens taak, tot de dag waarop het verzoek is aangevuld, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel165
  - number: 165.7.c
    text: dat het gemeentebestuur gedurende de termijn voor het uitbrengen van het advies geen besluit neemt.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel165
  - number: '165.8'
    text: |-
      Tijdens het in het zesde lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit te
      brengen over de vaststelling van het bepaalde in het zesde lid, onderdelen b en c, in relatie tot de vrijheid van
      richting en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd
      dan wel uit eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht.
      Het advies wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekend gemaakt tezamen met het
      besluit, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel165
  - number: '165.9'
    text: |-
      De rechtspersoon, bedoeld in het tweede lid, en het personeel van de schoolbegeleidingsdienst zijn gehouden aan de
      inspectie alle gevraagde inlichtingen te geven omtrent de verrichting van de in het derde, het vierde en het zesde
      lid, onder b, bedoelde activiteiten ten behoeve van de scholen.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel165
  - number: '166.1'
    text: |-
      Scholen kunnen schoolbegeleiding door een landelijke dienst naar richting ontvangen, indien zij op 31 december 1997
      met een dergelijke dienst een schoolbegeleidingsovereenkomst hadden als bedoeld in de bij of krachtens hoofdstuk
      II, titel II, van de Wet op de onderwijsverzorging gegeven voorschriften zoals die op die datum van kracht waren.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel166
  - number: '166.2'
    text: |-
      Onder scholen als bedoeld in het eerste lid, worden mede verstaan scholen die voor het eerst na 31 december 1997
      voor bekostiging in aanmerking komen en die in stand worden gehouden door:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel166
  - number: 166.2.a
    text: |-
      een bestuur dat een of meer andere scholen in stand houdt ten aanzien waarvan op die dag reeds een
      schoolbegeleidingsovereenkomst bestond met een landelijke dienst naar richting, of
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel166
  - number: 166.2.b
    text: |-
      een in verband met die aan te vangen bekostiging nieuw in het leven geroepen bestuur, indien ten aanzien van die
      scholen het bestuur dat deze scholen in stand houdt, een samenwerkingsovereenkomst heeft gesloten met het bevoegd
      gezag van een andere school die reeds schoolbegeleiding als bedoeld in het eerste lid, dit lid, onderdeel a, en
      [artikel B3 van de Wet van 15 mei 1997](onbekend) (Stb. 252) ontvangt en in de samenwerkingsovereenkomst in elk
      geval is opgenomen dat:
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel166
  - number: 166.2.b.1°
    text: de overeenkomst wordt aangegaan voor een termijn van tenminste 10 jaren, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel166
  - number: 166.2.b.2°
    text: |-
      voor elk bevoegd gezag de verplichting is opgenomen om geen personeel te benoemen met voorbijgaan van personeel
      van een der scholen waarvan het bevoegd gezag aan de overeenkomst deelneemt, en dat in het genot is van wachtgeld
      of een andere ontslaguitkering en direct aan die ontslaguitkering voorafgaand langer dan een jaar onafgebroken in
      dienst is geweest van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel166
  - number: '166.3'
    text: |-
      Het gemeentebestuur verstrekt ten behoeve van de schoolbegeleiding door de landelijke diensten naar richting,
      bedoeld in het eerste en tweede lid, aan deze diensten subsidie, met dien verstande dat deze wordt vastgesteld op
      ten minste een evenredig deel van de middelen, bedoeld in [artikel 165][ref1], voor zover het betreft middelen,
      bedoeld in het zesde lid, onderdeel a, verminderd met de middelen, bedoeld in het zesde lid, onderdeel b, van dat
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel165
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '165'
        afdeling: '11'
  - number: '167.1'
    text: |-
      Indien een bij of krachtens de wet gestelde termijn door het bevoegd gezag wordt overschreden en de gemeente
      daardoor geen bekostiging van het Rijk dan wel lagere bekostiging of met ingang van een latere datum bekostiging
      van het Rijk voor de materiële instandhouding ontvangt dan het geval zou zijn geweest indien deze termijn wel in
      acht was genomen, vergoedt het bevoegd gezag de door de gemeente geleden schade.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel167
  - number: '167.2'
    text: |-
      Indien een bij of krachtens de wet gestelde termijn door burgemeester en wethouders wordt overschreden en het
      bevoegd gezag daardoor geen bekostiging van het Rijk dan wel lagere bekostiging of met ingang van een latere datum
      bekostiging van het Rijk voor de materiële instandhouding ontvangt dan het geval zou zijn geweest indien deze
      termijn in acht was genomen, vergoedt de gemeente de door het bevoegd gezag geleden schade.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel167
  - number: '167.3'
    text: |-
      Burgemeester en wethouders en het bevoegd gezag kunnen in onderling overleg de in het eerste en tweede lid
      bedoelde verplichting tot schadevergoeding matigen. Indien dit overleg niet tot overeenstemming leidt, is
      [artikel 109 van boek 6 van het Burgerlijk Wetboek][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel109
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '109'
  - number: '168'
    text: |-
      Het bevoegd gezag van een bijzondere school is verplicht de uit de overheidskassen ontvangen gelden overeenkomstig
      de bestemming te gebruiken. Van de inkomsten en uitgaven wordt volgens bij algemene maatregel van bestuur te geven
      voorschriften nauwkeurig boekgehouden.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel168
  - number: '169.1'
    text: |-
      Het bevoegd gezag van een school onderscheidenlijk het regionaal expertisecentrum is aangesloten bij een door Onze
      minister aan te wijzen rechtspersoon met volledige rechtsbevoegdheid die zich ten doel stelt waarborgen te bieden
      voor
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel169
  - number: 169.1.a
    text: de kosten voor vervanging bij afwezigheid van personeel, en
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel169
  - number: 169.1.b
    text: |-
      de kosten voortvloeiend uit rechtspositionele verplichtingen ten aanzien van personeel dat gebruik maakt van een
      krachtens [artikel 33, tweede lid][ref1], vastgestelde regeling voor onvrijwillige taakvermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel33
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '33'
        paragraaf: '2'
        afdeling: '1'
  - number: '169.2'
    text: |-
      Het bevoegd gezag van een school onderscheidenlijk het regionaal expertisecentrum is voorts verplicht jaarlijks een
      door de in het eerste lid bedoelde rechtspersoon te bepalen bijdrage te voldoen aan die rechtspersoon in verband
      met de kosten voor vervanging.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel169
  - number: '169.3'
    text: |-
      Van de in het eerste juncto tweede lid bedoelde verplichting kan Onze minister op verzoek van het bevoegd gezag
      onderscheidenlijk het regionaal expertisecentrum ontheffing verlenen op grond van bezwaren van godsdienstige of
      levensbeschouwelijke aard. Onze minister verleent de ontheffing slechts indien het bevoegd gezag onderscheidenlijk
      het regionaal expertisecentrum aantoont dat een afdoende andere voorziening is getroffen met betrekking tot
      de gevolgen van vervanging bij afwezigheid van personeel en de gevolgen die voortvloeien uit rechtspositionele
      verplichtingen ten aanzien van personeel dat gebruik maakt van een krachtens [artikel 33, tweede lid][ref1],
      vastgestelde regeling voor onvrijwillige taakvermindering. Onze Minister besluit binnen zes maanden na ontvangst
      van een verzoek als bedoeld in de eerste volzin. Indien de beschikking niet binnen zes maanden kan worden gegeven,
      stelt Onze minister het bevoegd gezag onderscheidenlijk het regionaal expertisecentrum daarvan in kennis en noemt
      hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel33
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '33'
        paragraaf: '2'
        afdeling: '1'
  - number: '169.4'
    text: De rechtspersoon kan regels vaststellen ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel169
  - number: '169.5'
    text: |-
      Uit 's Rijks kas wordt jaarlijks een door Onze minister te bepalen bedrag betaald aan de rechtspersoon, bedoeld in
      het eerste lid, in verband met de kosten, bedoeld in dat lid onder b.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel169
  - number: 169a.1
    text: |-
      De rechtspersoon, bedoeld in [artikel 169][ref1], kan het sociaal-fiscaal nummer van het personeelslid dat bij
      afwezigheid wordt vervangen, en van degene die het personeelslid tijdelijk vervangt, uitsluitend in het kader van
      het doel, bedoeld in [artikel 169, eerste lid, onderdeel a][ref2], gebruiken in het verkeer met:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel169
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel169
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel169a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '169'
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '169'
        afdeling: '11'
  - number: 169a.1.a
    text: het personeelslid onderscheidenlijk degene die het personeelslid tijdelijk vervangt,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel169a
  - number: 169a.1.b
    text: |-
      het bevoegd gezag van de school, het regionaal expertisecentrum dan wel de centrale dienst waar de in onderdeel a
      bedoelde personen werkzaam zijn,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel169a
  - number: 169a.1.c
    text: Onze minister,
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel169a
  - number: 169a.1.d
    text: |-
      de instantie, bedoeld in [artikel 170, vijfde lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel170
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel169a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '170'
        afdeling: '11'
  - number: 169a.1.e
    text: |-
      het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel169a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 169a.2
    text: |-
      Het sociaal-fiscaal nummer wordt op een daartoe strekkend verzoek van de in het eerste lid bedoelde rechtspersoon
      aan die rechtspersoon verstrekt door het bevoegd gezag van de school, het regionaal expertisecentrum dan wel de
      centrale dienst waar het personeelslid dat bij afwezigheid wordt vervangen, werkzaam is.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel169a
  - number: 169a.3
    text: |-
      Indien dat ten behoeve van het verslag, bedoeld in [artikel 172, tweede lid][ref1], noodzakelijk is, worden
      gegevens daarin slechts zodanig openbaar gemaakt dat daaraan geen herkenbare gegevens over een afzonderlijk persoon
      kunnen worden ontleend, tenzij het betreft de controle op de juistheid van de gegevens in het kader van de controle
      op de rechtmatigheid en de doelmatigheid van aan of door de rechtspersoon gedane uitgaven. Daarbij kunnen de
      sociaal-fiscale nummers worden vergeleken met de sociaal-fiscale nummers die door andere daartoe bij of krachtens
      de wet bevoegde instanties zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel172
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel169a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '172'
  - number: '170.1'
    text: |-
      Het bevoegd gezag van een school onderscheidenlijk het regionaal expertisecentrum is aangesloten bij een door Onze
      Minister aan te wijzen rechtspersoon met volledige rechtsbevoegdheid die zich ten doel stelt waarborgen te bieden
      voor de kosten van werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede uitkeringen wegens
      ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1] ten behoeve van
      gewezen personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '170.2'
    text: |-
      Het bevoegd gezag onderscheidenlijk het regionaal expertisecentrum voldoet aan de rechtspersoon jaarlijks een door
      die rechtspersoon vast te stellen bijdrage in verband met de kosten van werkloosheidsuitkeringen, suppleties inzake
      arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan
      op grond van de [Ziektewet.][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '170.3'
    text: |-
      Van de in het eerste en tweede lid bedoelde verplichting kan Onze Minister op verzoek van het bevoegd gezag
      onderscheidenlijk het regionaal expertisecentrum ontheffing verlenen op grond van bezwaren van godsdienstige of
      levensbeschouwelijke aard. Onze Minister verleent de ontheffing slechts, indien het bevoegd gezag onderscheidenlijk
      het regionaal expertisecentrum aantoont dat een afdoende andere voorziening is getroffen met betrekking tot de
      kosten van werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en
      arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1]. Onze Minister besluit
      binnen zes maanden na ontvangst van een verzoek. Indien de beschikking niet binnen zes maanden kan worden gegeven,
      stelt Onze Minister de verzoeker daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel
      tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '170.4'
    text: |-
      De rechtspersoon stelt regels vast voor de behandeling, beoordeling en beantwoording van een verzoek van het
      bevoegd gezag onderscheidenlijk het regionaal expertisecentrum als bedoeld in [artikel 132, derde lid][ref1].
      Indien het bevoegd gezag onderscheidenlijk het regionaal expertisecentrum zich beroept op overwegingen van
      godsdienstige of levensbeschouwelijke aard, betrekt de rechtspersoon die overwegingen bij de beoordeling van een in
      de eerste volzin bedoeld verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel132
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '132'
        paragraaf: '3'
        afdeling: '7'
  - number: '170.5'
    text: |-
      Indien de rechtspersoon het in het vierde lid bedoelde verzoek heeft ingewilligd, vergoedt hij aan de instantie
      die de werkloosheidsuitkeringen, de suppleties inzake arbeidsongeschiktheid alsmede de uitkeringen wegens ziekte
      en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1] verstrekt of heeft
      verstrekt, de kosten van die uitkeringen of suppleties.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '170.6'
    text: |-
      Tegen een besluit van de rechtspersoon kan het bevoegd gezag beroep instellen bij de Afdeling bestuursrechtspraak
      van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0003549/2006-02-10#Artikel170
