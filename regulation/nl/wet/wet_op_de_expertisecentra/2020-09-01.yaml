        afdeling: '1'
  - number: '3.8'
    text: |-
      Op het geven van onderwijs in een entreeopleiding die wordt verzorgd op basis van [artikel 14a, tweede lid][ref1],
      is het eerste lid, onderdeel b, sub 1° en sub 3°, niet van toepassing. In plaats daarvan is
      [artikel 33, eerste lid, onderdeel b, sub 1° en sub 3°, van de Wet op het voortgezet onderwijs][ref2] daarop
      van overeenkomstige toepassing. Op het geven van onderwijs als bedoeld in de eerste volzin zijn eveneens de
      voorschriften gegeven bij of krachtens [artikel 33, veertiende lid][ref3], [artikel 33b][ref4], [artikel 38][ref5]
      en de [artikelen 41a tot en met 41u][ref6] en [118j tot en met 118s, van de Wet op het voortgezet onderwijs][ref7]
      van overeenkomstige toepassing.


