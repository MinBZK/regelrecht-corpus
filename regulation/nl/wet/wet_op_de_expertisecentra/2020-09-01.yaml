      tijdvak; aan de toestemming kunnen voorwaarden worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel13
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '13'
        paragraaf: '1'
        afdeling: '1'
  - number: '17.1'
    text: |-
      Het voortgezet speciaal onderwijs, bedoeld in [artikel 14, eerste lid, onderdeel b][ref1], omvat voor leerlingen
      vanaf 14 jaar een of meer stages op ten hoogste vier dagen per week. Het voortgezet speciaal onderwijs, bedoeld
      in artikel 14, eerste lid, onderdelen a en c, kan voor leerlingen vanaf 14 jaar een of meer stages omvatten op
      ten hoogste vier dagen per week. Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent
      de stage.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '14'
        paragraaf: '1'
        afdeling: '1'
  - number: '17.2'
    text: |-
      De algemene maatregel van bestuur bedoeld in het eerste lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure
      bedoeld in de eerste 3 volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel17
  - number: '18.1'
    text: |-
      Het onderwijs wordt gegeven in het Nederlands. Daar waar naast de Nederlandse taal, de Friese taal of een
      streektaal in levend gebruik is, kan de Friese taal of de streektaal mede als voertaal bij het onderwijs worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18
  - number: '18.2'
    text: |-
      Voor de opvang in en de aansluiting bij het Nederlandse onderwijs van leerlingen met een niet-Nederlandse
      culturele achtergrond kan de taal van het land van oorsprong mede als voertaal bij het onderwijs worden gebruikt,
      overeenkomstig een door het bevoegd gezag vastgestelde gedragscode.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18
  - number: '18.3'
    text: |-
      In afwijking van het eerste lid kan een deel van het onderwijs worden gegeven in de Engelse, Duitse of Franse taal
      tot ten hoogste een bij algemene maatregel van bestuur vast te stellen percentage per schooljaar.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18
  - number: 18a.1
    text: |-
      Bij het geven van onderwijs aan een leerling die is opgenomen in een ziekenhuis of die in verband met ziekte thuis
      verblijft, kan het bevoegd gezag van een school worden ondersteund.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18a
  - number: 18a.2
    text: 'De ondersteuning bedoeld in het eerste lid wordt verzorgd door:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18a
  - number: 18a.2.a
    text: |-
      een educatieve voorziening als bedoeld in
      [artikel 1.4, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] indien de leerling
      is opgenomen in een academisch ziekenhuis of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 18a.2.b
    text: |-
      een schoolbegeleidingsdienst, indien de leerling is opgenomen in een ziekenhuis niet zijnde een academisch
      ziekenhuis dan wel indien de leerling in verband met ziekte thuis verblijft.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18a
  - number: 18a.3
    text: |-
      De ondersteuning bedoeld in het eerste lid kan in overeenstemming tussen de educatieve voorziening dan wel de
      schoolbegeleidingsdienst en de school waarbij de leerling is ingeschreven, mede het geven van onderwijs aan de
      leerling betreffen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18a
  - number: 18b.1
    text: |-
      In het laatste schooljaar in het speciaal onderwijs legt de leerling in een volledige week tussen 15 april en
      15 mei een centrale eindtoets af. De centrale eindtoets kan op verschillende niveaus worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18b
  - number: 18b.2
    text: |-
      De centrale eindtoets meet kennis en vaardigheden van de leerling op het terrein van Nederlandse taal en rekenen
      en wiskunde, met inachtneming van de referentieniveaus Nederlandse taal en de referentieniveaus rekenen, bedoeld
      in [artikel 2, tweede lid, aanhef en onderdeel b, van de Wet referentieniveaus Nederlandse taal en rekenen][ref1].
      Het bevoegd gezag kan bij een leerling tevens de toets voor de kennisgebieden, genoemd in
      [artikel 13, derde lid, onderdelen a, b en c][ref2], afnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0027679#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel13
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0027679
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '13'
        paragraaf: '1'
        afdeling: '1'
  - number: 18b.3
    text: |-
      Indien een leerling is verhinderd de centrale eindtoets af te leggen, wordt de toets op een later moment alsnog
      afgenomen, tenzij dit voor de leerling om medische redenen onmogelijk is.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18b
  - number: 18b.4
    text: |-
      Het bevoegd gezag kan mede op basis van de toetsgegevens in het leerling- en onderwijsvolgsysteem, bedoeld in
      [artikel 11, zevende lid][ref1], gemotiveerd bepalen dat geen centrale eindtoets wordt afgelegd door:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel11
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '11'
        paragraaf: '1'
        afdeling: '1'
  - number: 18b.4.a
    text: zeer moeilijk lerende leerlingen,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18b
  - number: 18b.4.b
    text: meervoudig gehandicapte leerlingen voor wie het zeer moeilijk lerend zijn een van de handicaps is, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18b
  - number: 18b.4.c
    text: leerlingen die vier jaar of korter in Nederland zijn en om die reden de Nederlandse taal onvoldoende beheersen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18b
  - number: 18b.5
    text: |-
      Het bevoegd gezag bepaalt mede op basis van het leerling- en onderwijsvolgsysteem, bedoeld in
      [artikel 11, zevende lid][ref1], op welk niveau de leerling de centrale eindtoets aflegt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel11
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '11'
        paragraaf: '1'
        afdeling: '1'
  - number: 18b.6
    text: |-
      Voor de aanvang van de afname van de centrale eindtoets informeert het bevoegd gezag de ouders over het niveau van
      de toets die de leerling gaat afleggen dan wel indien het bevoegd gezag op grond van het vierde lid, onderdelen a
      of b, bepaalt dat de leerling geen toets aflegt, de grond voor die toepassing.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18b
  - number: 18b.7
    text: |-
      Indien het bevoegd gezag voornemens is te bepalen dat de leerling op grond van het vierde lid, onderdeel c, geen
      toets aflegt, overlegt het bevoegd gezag hierover met de ouders.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18b
  - number: 18b.8
    text: |-
      Onze Minister kan het gebruik van andere eindtoetsen dan de centrale eindtoets, bedoeld in het eerste lid,
      toelaten. Dit artikel is van overeenkomstige toepassing op de andere eindtoetsen met dien verstande dat bij
      algemene maatregel van bestuur voorschriften worden gesteld ten aanzien van de toelating van andere eindtoetsen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18b
  - number: 18b.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften omtrent de centrale eindtoets worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18b
  - number: 18c
    text: |-
      De voordracht voor een krachtens [artikel 11, achtste lid][ref1], en [artikel 18b, achtste en negende lid][ref2],
      vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide
      kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel18b
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '11'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 18b
        paragraaf: '1'
        afdeling: '1'
  - number: '19'
    text: |-
      Het bevoegd gezag draagt zorg voor de kwaliteit van het onderwijs op de school. Onder zorg dragen voor de kwaliteit
      van het onderwijs wordt in elk geval verstaan het naleven van de bij of krachtens deze wet gegeven voorschriften en
      het uitvoeren van het stelsel van kwaliteitszorg, bedoeld in [artikel 21, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel21
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '21'
        paragraaf: '1'
        afdeling: '1'
  - number: 19a
    text: |-
      De kwaliteit van het onderwijs is zeer zwak indien de school tekortschiet in de naleving van twee of meer
      bij of krachtens deze wet gegeven voorschriften en de school dientengevolge tekortschiet in het zorg dragen
      voor de veiligheid op school, bedoeld in [artikel 5a][ref1], of het zodanig inrichten van het onderwijs dat
      leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen dan wel het afstemmen van het onderwijs op de
      ontwikkelingsmogelijkheden van de leerlingen, bedoeld in [artikel 11, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel11
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 5a
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '11'
        paragraaf: '1'
        afdeling: '1'
  - number: '20'
    text: |-
      Het bevoegd gezag rapporteert met inachtneming van het leerlingvolgsysteem, bedoeld in
      [artikel 11, zevende lid][ref1], over de vorderingen van de leerlingen aan hun ouders dan wel aan de leerlingen
      zelf indien zij meerderjarig en handelingsbekwaam zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel11
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '11'
        paragraaf: '1'
        afdeling: '1'
  - number: '21.1'
    text: |-
      Het schoolplan bevat een beschrijving van het beleid met betrekking tot de kwaliteit van het onderwijs dat
      binnen de school wordt gevoerd, en omvat in elk geval het onderwijskundig beleid, het personeelsbeleid en het
      stelsel van kwaliteitszorg. Het schoolplan omvat mede het beleid ten aanzien van de aanvaarding van materiële
      bijdragen of geldelijke bijdragen, niet zijnde ouderbijdragen of op de onderwijswetgeving gebaseerde bijdragen,
      indien het bevoegd gezag daarbij verplichtingen op zich neemt waarmee de leerlingen binnen de schooltijden
      en tijdens de activiteiten die worden georganiseerd onder verantwoordelijkheid van het bevoegd gezag, alsmede
      tijdens het overblijven, zullen worden geconfronteerd. In het schoolplan wordt aangegeven op welke wijze de
      identiteitscommissie, bedoeld in [artikel 28j][ref1], invulling geeft aan het openbare karakter onderscheidenlijk
      de identiteit voor zover het betreft een samenwerkingsschool.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28j
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28j
        paragraaf: '1'
        afdeling: '1'
  - number: '21.2'
    text: 'De beschrijving van het onderwijskundig beleid omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel21
  - number: 21.2.a
    text: |-
      de uitwerking van de wettelijke voorschriften betreffende de uitgangspunten, de doelstelling en de inhoud van het
      onderwijs,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel21
  - number: 21.2.b
    text: |-
      de door het bevoegd gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs in een
      onderwijsprogramma,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel21
  - number: 21.2.c
    text: het pedagogisch-didactisch klimaat en het schoolklimaat,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel21
  - number: 21.2.d
    text: |-
      het zorg dragen voor de veiligheid op school, bedoeld in [artikel 5a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel5a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 5a
  - number: '21.3'
    text: 'De beschrijving van het personeelsbeleid omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel21
  - number: 21.3.a
    text: het voldoen aan de eisen van bevoegdheid en de wijze waarop de bekwaamheid wordt onderhouden,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel21
  - number: 21.3.b
    text: |-
      de maatregelen met betrekking tot het personeel die bijdragen aan de ontwikkeling en de uitvoering van het
      onderwijskundig beleid,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel21
  - number: 21.3.c
    text: het pedagogisch-didactisch handelen van het onderwijspersoneel,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel21
  - number: 21.3.d
    text: |-
      het document inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding, bedoeld in [artikel 30][ref1],
      en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel30
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '30'
        paragraaf: '2'
        afdeling: '1'
  - number: 21.3.e
    text: de wijze waarop rekening wordt gehouden met de inbreng van leerlingen op dat beleid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel21
  - number: '21.4'
    text: 'De beschrijving van het stelsel van kwaliteitszorg omvat in elk geval het zorg dragen voor:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel21
  - number: 21.4.a
    text: |-
      het bewaken dat de leerling een ononderbroken ontwikkelingsproces kan doorlopen en dat het onderwijs wordt
      afgestemd op de ontwikkelingsmogelijkheden van de leerlingen, bedoeld in [artikel 11, eerste lid][ref1], mede met
      behulp van het leerling- en onderwijsvolgsysteem, bedoeld in artikel 11, zevende lid, en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel11
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '11'
        paragraaf: '1'
        afdeling: '1'
  - number: 21.4.b
    text: het vaststellen welke maatregelen ter verbetering nodig zijn.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel21
  - number: '22.1'
    text: |-
      De schoolgids bevat voor ouders en leerlingen informatie over de werkwijze van de school en bevat in elk geval
      informatie over:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
  - number: 22.1.a
    text: |-
      de doelen van het onderwijs en de resultaten die met het onderwijsleerproces worden bereikt, met dien verstande dat
      bij algemene maatregel van bestuur voorschriften kunnen worden gegeven met betrekking tot de wijze waarop
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
  - number: 22.1.a.1°
    text: de resultaten worden beschreven die met het onderwijsleerproces worden bereikt, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
  - number: 22.1.a.2°
    text: de context wordt vermeld waarin de onder 1° bedoelde resultaten dienen te worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
  - number: 22.1.b
    text: de bijzondere voorzieningen voor leerlingen of groepen leerlingen,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
  - number: 22.1.c.1°
    text: |-
      de wijze waarop, indien speciaal onderwijs wordt verzorgd, de verplichte onderwijstijd voor dat onderwijs wordt
      benut,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
  - number: 22.1.c.2°
    text: |-
      indien voortgezet speciaal onderwijs wordt verzorgd, met betrekking tot dat onderwijs, het totaal aantal
      uren en het soort activiteiten dat als onderwijstijd als bedoeld in [artikel 25, eerste lid][ref1], dan wel
      [artikel 6g, eerste tot en met vijfde lid, van de Wet op het voortgezet onderwijs][ref2] wordt geprogrammeerd,
      de vakanties en andere dagen waarop geen onderwijs wordt verzorgd, alsmede wat het beleid is ten aanzien van
      lesuitval,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel6g
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '25'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 6g
  - number: 22.1.c.3°
    text: |-
      indien het uitstroomprofiel vervolgonderwijs wordt verzorgd, de invulling van de maatschappelijke stage, bedoeld in
      [artikel 6f van de Wet op het voortgezet onderwijs][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6f
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6f
  - number: 22.1.d
    text: |-
      de geldelijke bijdrage, bedoeld in [artikel 40, eerste lid][ref1], waarbij wordt vermeld dat deze vrijwillig is,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
        paragraaf: '3'
        afdeling: '1'
  - number: 22.1.e
    text: |-
      de rechten en plichten van de ouders, de leerlingen en het bevoegd gezag, waaronder de informatie over de
      klachtenregeling, bedoeld in [artikel 23][ref1], en de gronden voor vrijstelling van het onderwijs, bedoeld in
      [artikel 46, tweede lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel46
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '23'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '46'
        paragraaf: '3'
        afdeling: '1'
  - number: 22.1.f
    text: |-
      de wijze waarop het bevoegd gezag omgaat met de in[ artikel 21, eerste lid][ref1], omschreven bijdragen,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel21
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '21'
        paragraaf: '1'
        afdeling: '1'
  - number: 22.1.g
    text: |-
      het samenwerkingsverband en in voorkomend geval de samenwerkingsverbanden als bedoeld in
      [artikel 1 van de Wet op het primair onderwijs][ref1] of [artikel 1 van de Wet op het voortgezet onderwijs][ref2]
      waarbij het bevoegd gezag van de school is aangesloten,


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel1
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '1'
  - number: 22.1.h
    text: het beleid met betrekking tot de veiligheid,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
  - number: 22.1.i
    text: het verzuimbeleid,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
  - number: 22.1.j
    text: |-
      de wijze waarop de identiteitscommissie, bedoeld in [artikel 28j][ref1], invulling geeft aan het openbare karakter
      onderscheidenlijk de identiteit voor zover het betreft een samenwerkingsschool,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28j
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28j
        paragraaf: '1'
        afdeling: '1'
  - number: 22.1.k
    text: |-
      de persoon, bij wie de taken, bedoeld in [artikel 5a, eerste lid, onderdeel c][ref1], zijn belegd, en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel5a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 5a
  - number: 22.1.l
    text: |-
      de in het kader van het stelsel van kwaliteitszorg, bedoeld in [artikel 21, vierde lid][ref1], gedane bevindingen
      en de maatregelen die naar aanleiding daarvan zijn getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel21
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '21'
        paragraaf: '1'
        afdeling: '1'
  - number: '22.2'
    text: |-
      Indien voortgezet speciaal onderwijs wordt verzorgd, vermeldt de schoolgids onverminderd het eerste lid
      welk uitstroomprofiel of welke uitstroomprofielen als bedoeld in [artikel 14, eerste lid][ref1], worden
      verzorgd, en, indien het uitstroomprofiel vervolgonderwijs wordt verzorgd, welk onderwijs als bedoeld in
      [artikel 14a, eerste lid][ref2], en welke schoolsoort als bedoeld in de [Wet op het voortgezet onderwijs][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel14a
      [ref3]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '14'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 14a
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002399
  - number: '22.3'
    text: |-
      Indien voortgezet speciaal onderwijs als bedoeld in [artikel 14a, eerste lid, onderdeel b][ref1], wordt verzorgd
      bevat de schoolgids onverminderd de vorige leden met betrekking tot dat onderwijs:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 14a
        paragraaf: '1'
        afdeling: '1'
  - number: 22.3.a
    text: |-
      in ieder geval met betrekking tot het schooljaar voorafgaande aan het schooljaar
      waarin de schoolgids wordt vastgesteld en onderscheiden naar schoolsoort als bedoeld in
      [artikel 5, onderdelen a, b en c, van de Wet op het voortgezet onderwijs][ref1], voor elk leerjaar:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel5
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '5'
  - number: 22.3.a.1°
    text: |-
      het aantal leerlingen dat doorstroomt naar een hoger leerjaar, naar voortgezet onderwijs
      als bedoeld in de [Wet op het voortgezet onderwijs][ref1], naar een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, van de Wet educatie en beroepsonderwijs][ref2] of naar hoger onderwijs als bedoeld in
      de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005682
  - number: 22.3.a.2°
    text: het aantal leerlingen dat de school zonder diploma verlaat en het aantal leerlingen dat voor het eindexamen slaagt,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
  - number: 22.3.b
    text: |-
      informatie over de inrichting van het onderwijsprogramma voor de eerste twee leerjaren waarbij wordt aangegeven of
      sprake is van vakoverstijgende programmaonderdelen en de inzet van het personeel daarbij.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
  - number: '22.4'
    text: |-
      Indien voortgezet speciaal onderwijs als bedoeld in [artikel 14a, eerste lid, onderdeel a][ref1], wordt verzorgd is
      het vorige lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 14a
        paragraaf: '1'
        afdeling: '1'
  - number: '22.5'
    text: |-
      Indien voortgezet speciaal onderwijs als bedoeld in [artikel 14, eerste lid, onderdeel b][ref1], wordt verzorgd
      bevat de schoolgids onverminderd de vorige leden, met betrekking tot het schooljaar voorafgaande aan het schooljaar
      waarin de schoolgids wordt vastgesteld, voor elk leerjaar:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '14'
        paragraaf: '1'
        afdeling: '1'
  - number: 22.5.a
    text: |-
      het aantal leerlingen dat de school verlaat en voor wie het onderwijs in het arbeidsmarktgerichte uitstroomprofiel
      het laatst gevolgde onderwijs is,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
  - number: 22.5.b
    text: |-
      het aantal leerlingen, bedoeld in onderdeel a, dat doorstroomt naar voortgezet onderwijs als
      bedoeld in de [Wet op het voortgezet onderwijs][ref1] en naar een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, van de Wet educatie en beroepsonderwijs][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 22.5.c
    text: |-
      het aantal leerlingen, bedoeld in onderdeel a, dat op 1 augustus van het schooljaar waarin de schoolgids wordt
      vastgesteld, een functie op de arbeidsmarkt bekleedt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
  - number: '22.6'
    text: |-
      Het bevoegd gezag reikt de schoolgids uit aan de ouders dan wel de meerderjarige en handelingsbekwame leerling bij
      de inschrijving en jaarlijks na de vaststelling van de schoolgids.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
  - number: '22.7'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, onder a, wordt aan de beide kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en
      gedurende die termijn niet door of namens een der kamers de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel22
  - number: '23.1'
    text: |-
      Ouders en personeelsleden kunnen bij de klachtencommissie, bedoeld in het tweede lid, onderdeel a, een klacht
      indienen over gedragingen en beslissingen van het bevoegd gezag of het personeel, waaronder discriminatie, dan
      wel het nalaten van gedragingen en het niet nemen van beslissingen door het bevoegd gezag of het personeel. Een
      zodanige klacht kan eveneens worden ingediend door:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel23
  - number: 23.1.a
    text: |-
      leerlingen van scholen voor speciaal onderwijs of voor speciaal en voortgezet speciaal onderwijs, die de leeftijd
      van 13 jaren hebben bereikt,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel23
  - number: 23.1.b
    text: leerlingen van scholen voor voortgezet speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel23
  - number: '23.2'
    text: 'Het bevoegd gezag treft een regeling voor de behandeling van klachten. Deze regeling vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel23
  - number: 23.2.a
    text: de instelling van een klachtencommissie, die klachten behandelt,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel23
  - number: 23.2.b
    text: de wijze waarop de klachtencommissie haar werkzaamheden verricht,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel23
  - number: 23.2.c
    text: de termijn waarbinnen de klager een klacht kan indienen en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel23
  - number: 23.2.d
    text: |-
      de termijn waarbinnen mededeling plaatsvindt van het oordeel, bedoeld in het zesde lid, en hoe bij noodzakelijke
      afwijking van deze termijn wordt gehandeld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel23
  - number: '23.3'
    text: |-
      Deze regeling strekt ter vervanging van klachtenregelingen op grond van andere voorschriften dan dit artikel en
      strekt niet ter vervanging van een andere voorziening die op grond van een wettelijke regeling, niet zijnde een
      klachtenregeling, voor de klager openstaat of heeft opengestaan.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel23
  - number: '23.4'
    text: Deze regeling
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel23
  - number: 23.4.a
    text: |-
      voorziet erin dat de klachten worden behandeld door een klachtencommissie die bestaat uit ten minste drie leden,
      waaronder een voorzitter die geen deel uitmaakt van het bevoegd gezag en niet werkzaam is voor of bij het bevoegd
      gezag en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel23
  - number: 23.4.b
    text: |-
      waarborgt dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel23
  - number: '23.5'
    text: 'De klager en degene over wie is geklaagd krijgen de gelegenheid:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel23
  - number: 23.5.a
    text: hun zienswijze mondeling of schriftelijk toe te lichten en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel23
  - number: 23.5.b
    text: zich bij de behandeling van de klacht te laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel23
  - number: '23.6'
    text: |-
      De klachtencommissie vormt zich een oordeel over de gegrondheid van de klacht en deelt dit oordeel, al dan niet
      vergezeld van aanbevelingen, schriftelijk mede aan de klager, degene over wie is geklaagd en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel23
  - number: '23.7'
    text: |-
      Het bevoegd gezag deelt de klager en de klachtencommissie, bedoeld in het tweede lid, onderdeel a, binnen 4 weken
      na ontvangst van het in het zesde lid bedoelde oordeel van de klachtencommissie schriftelijk mede of hij het
      oordeel over de gegrondheid van de klacht deelt en of hij naar aanleiding van dat oordeel maatregelen zal nemen en
      zo ja welke. Bij afwijking van de in de eerste volzin bedoelde termijn, doet het bevoegd gezag daarvan met redenen
      omkleed mededeling aan de klager en de klachtencommissie onder vermelding van de termijn waarbinnen het bevoegd
      gezag zijn standpunt bekend zal maken.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel23
  - number: '23.8'
    text: |-
      Degene die betrokken is bij de uitvoering van dit artikel en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijze moet vermoeden, is verplicht tot geheimhouding daarvan,
      behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak tot
      mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel23
  - number: '23.9'
    text: |-
      Gegevens die betrekking hebben op een klacht worden bewaard op een plaats die uitsluitend toegankelijk is voor de
      leden van de klachtencommissie en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel23
  - number: '24.1'
    text: |-
      Een deel van een schoolplan kan voor zover het betrekking heeft op speciaal onderwijs en
      voortgezet speciaal onderwijs als bedoeld in [artikel 14, eerste lid, onderdelen b en c][ref1], en
      [artikel 14a, eerste lid, onderdeel a][ref2], worden uitgevoerd door een andere school, een basisschool, een
      speciale school voor basisonderwijs, een school voor voortgezet onderwijs of een instelling voor educatie en
      beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel14a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '14'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 14a
        paragraaf: '1'
        afdeling: '1'
  - number: '24.2'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent de uitvoering van het eerste lid alsmede
      omtrent de aard en de eisen aan de voorzieningen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel24
  - number: '25.1'
    text: |-
      Een in schooltijd verzorgd samenhangend onderwijsprogramma als bedoeld in de [artikelen 14c, negende lid][ref1], en
      [14f, achtste lid][ref2], omvat voor iedere leerling in elk leerjaar ten minste 1 000 uren.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14c
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel14f
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 14c
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 14f
        paragraaf: '1'
        afdeling: '1'
  - number: '25.2'
    text: Het bevoegd gezag beschikt over geordende gegevens met betrekking tot de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel25
  - number: '25.5'
    text: |-
      De inspectie kan op verzoek van het bevoegd gezag ermee instemmen dat om lichamelijke of psychische redenen voor
      individuele leerlingen wordt afgeweken van de urennorm, bedoeld het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel25
  - number: '26.1'
    text: |-
      Indien een leerling gedurende een deel van de week onderwijs ontvangt op een andere school, een basisschool,
      een speciale school voor basisonderwijs, een school voor voortgezet onderwijs of een instelling voor educatie
      en beroepsonderwijs, telt de tijd gedurende welke de leerling dit onderwijs ontvangt, mee voor het aantal uren
      onderwijs dat de leerling ten minste moet ontvangen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel26
  - number: '26.2'
    text: |-
      Bij ministeriële regeling kunnen ten aanzien van het speciaal onderwijs voorschriften worden vastgesteld omtrent
      vakanties. Daarbij kunnen begin en eind van vakanties worden vastgesteld die niet voor alle scholen gelijk behoeven
      te zijn. Bij die ministeriële regeling kan tevens worden bepaald dat zij op bepaalde scholen niet van toepassing
      is.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel26
  - number: '26.3'
    text: |-
      Ten aanzien van de uitstroomprofielen, bedoeld in de [artikelen 14c][ref1] en [14f][ref2], zijn de voorschriften
      gegeven bij of krachtens [artikel 6g1 van de Wet op het voortgezet onderwijs][ref3] van overeenkomstige toepassing.
      Bij algemene maatregel van bestuur onderscheidenlijk bij ministeriële regeling kunnen regels worden vastgesteld
      in afwijking van de regels die bij algemene maatregel van bestuur respectievelijk bij ministeriële regeling zijn
      vastgesteld op grond van die bepaling van de [Wet op het voortgezet onderwijs][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14c
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel14f
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel6g1
      [ref4]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 14c
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 14f
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 6g1
      - id: ref4
        bwb_id: BWBR0002399
  - number: '27.1'
    text: Het bevoegd gezag stelt ten minste eenmaal in de 4 jaar het schoolplan vast.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel27
  - number: '27.2'
    text: Het bevoegd gezag stelt jaarlijks de schoolgids vast ten behoeve van het eerstvolgende schooljaar.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel27
  - number: '27.3'
    text: |-
      Het bevoegd gezag zendt het schoolplan dan wel de wijzigingen daarvan en de schoolgids onmiddellijk na de
      vaststelling aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel27
  - number: '28.1'
    text: |-
      De instandhouding van een of meer openbare en een of meer bijzondere scholen kan worden opgedragen of overgedragen
      aan een stichting die met dit doel wordt onderscheidenlijk is opgericht. De besluitvorming van de zijde van de
      gemeente vindt plaats door de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28
  - number: '28.2'
    text: |-
      Het statutaire doel van de stichting is in elk geval het geven van openbaar onderwijs en onderwijs van een of meer
      richtingen in afzonderlijke scholen voor openbaar onderscheidenlijk bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28
  - number: '28.3'
    text: De stichting oefent alle taken en bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28
  - number: '28.4'
    text: 'De statuten voorzien in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28
  - number: 28.4.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28
  - number: 28.4.b
    text: de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28
  - number: 28.4.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28
  - number: 28.4.d
    text: |-
      de vaststelling van de begroting en jaarrekening na overleg met de gemeenteraad van de gemeente waarin de school
      waar openbaar onderwijs wordt gegeven, gevestigd is,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28
  - number: 28.4.e
    text: |-
      de wijze waarop de gemeenteraad van de gemeente waarin de school waar openbaar onderwijs wordt gegeven, gevestigd
      is, toezicht op het bestuur van die school uitoefent,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28
  - number: 28.4.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28
  - number: 28.4.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28
  - number: 28.4.h
    text: de bevoegdheid de stichting te ontbinden,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28
  - number: '28.5'
    text: |-
      De statuten van de stichting kunnen slechts worden gewijzigd na instemming van de gemeenteraad van de gemeente
      waarin de school waar openbaar onderwijs wordt gegeven, gevestigd is. Instemming kan slechts worden onthouden
      indien overheersende invloed van de overheid in het bestuur niet is verzekerd voor zover het openbaar onderwijs
      betreft.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28
  - number: '28.6'
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad van de gemeente waarin de school waar openbaar onderwijs wordt
      gegeven, gevestigd is, verslag uit over de werkzaamheden, waarbij in ieder geval aandacht wordt geschonken aan de
      wezenskenmerken van het openbaar onderwijs. Het verslag wordt bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28
  - number: '28.7'
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28
  - number: '28.8'
    text: |-
      In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover het
      openbaar onderwijs betreft, neemt de gemeenteraad van de gemeente waarin de openbare school is gelegen, de
      maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het openbaar
      onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28
  - number: '28.9'
    text: |-
      Indien de laatste afzonderlijke openbare school en de laatste afzonderlijke bijzondere school die door de stichting
      in stand worden gehouden, zijn gefuseerd tot een samenwerkingsschool als bedoeld in [artikel 28j][ref1] kan de
      instandhouding van die samenwerkingsschool opgedragen blijven aan de stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28j
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28j
        paragraaf: '1'
        afdeling: '1'
  - number: 28a.1
    text: |-
      Het bevoegd gezag van een of meer scholen voor speciaal onderwijs of speciaal en voortgezet speciaal onderwijs
      behorend tot cluster 3 en 4, bedoeld in [artikel 2, vierde lid][ref1], is voor elke vestiging van die school
      of scholen voor zover daaraan speciaal onderwijs wordt verzorgd, aangesloten bij een samenwerkingsverband
      als bedoeld in [artikel 18a, tweede lid, van de Wet op het primair onderwijs][ref2] of bij een landelijk
      samenwerkingsverband als bedoeld in artikel 18a, vijftiende lid, van die wet. Artikel 18a, vierde lid, en
      [artikel 163c, derde lid, van die wet][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel163c
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 18a
      - id: ref3
        bwb_id: BWBR0003420
        artikel: 163c
  - number: 28a.2
    text: |-
      Het bevoegd gezag van een of meer scholen voor voortgezet speciaal onderwijs of speciaal en voortgezet speciaal
      onderwijs behorend tot cluster 3 en 4, bedoeld in [artikel 2, vierde lid][ref1], is voor elke vestiging van
      die school of scholen voor zover daaraan voortgezet speciaal onderwijs wordt verzorgd, aangesloten bij een
      samenwerkingsverband als bedoeld in [artikel 17a, tweede lid, van de Wet op het voortgezet onderwijs][ref2] of bij
      een landelijk samenwerkingsverband als bedoeld in artikel 17a, zestiende lid, van die wet. Artikel 17a, vierde lid,
      en [artikel 103h, derde lid, van die wet][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel103h
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 17a
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 103h
  - number: 28a.3
    text: |-
      Onverminderd het eerste en tweede lid, kan het bevoegd gezag deelnemen aan een samenwerkingsverband
      op grond van [artikel 18a, vijfde lid, van de Wet op het primair onderwijs][ref1] of
      [artikel 17a, vijfde lid, van de Wet op het voortgezet onderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 18a
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 17a
  - number: 28g.1
    text: |-
      Het bevoegd gezag draagt mede in verband met de verplichting, bedoeld in [artikel 19][ref1], zorg voor een goed
      bestuurde school met een scheiding tussen de functies van bestuur en het toezicht daarop, en met een rechtmatig
      bestuur en beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel19
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28g
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '19'
        paragraaf: '1'
        afdeling: '1'
  - number: 28g.2
    text: |-
      De benoeming in de functies van het bestuur en het interne toezicht op het bestuur, bedoeld in het eerste lid,
      geschiedt op basis van vooraf openbaar gemaakte profielen. Bij de benoeming van de leden van de raad van toezicht
      wordt de medezeggenschapsraad van de school, bedoeld in [artikel 3 van de Wet medezeggenschap op scholen][ref1], in
      de gelegenheid gesteld een bindende voordracht te doen voor een lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28g
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '3'
  - number: 28h.1
    text: |-
      Het bevoegd gezag draagt er zorg voor dat de functies van bestuur en intern toezicht op het bestuur in functionele
      of organieke zin zijn gescheiden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28h
  - number: 28h.2
    text: |-
      Een intern toezichthouder of een lid van het interne toezichthoudend orgaan functioneert onafhankelijk van het
      bestuur.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28h
  - number: 28i.1
    text: |-
      De interne toezichthouder of het interne toezichthoudend orgaan houdt toezicht op de uitvoering van de taken en de
      uitoefening van de bevoegdheden door het bestuur en staat het bestuur met raad terzijde. De toezichthouder of het
      toezichthoudend orgaan is ten minste belast met:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28i
  - number: 28i.1.a
    text: |-
      het goedkeuren van de begroting en het bestuursverslag en, indien van toepassing, het strategisch meerjarenplan van
      de school;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28i
  - number: 28i.1.b
    text: |-
      het toezien op de naleving door het bestuur van wettelijke verplichtingen, de code voor goed bestuur, bedoeld in
      [artikel 157, eerste lid, onderdeel a][ref1], en de afwijkingen van die code;


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel157
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28i
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '157'
        afdeling: '10'
  - number: 28i.1.c
    text: |-
      het toezien op de rechtmatige verwerving en de doelmatige en rechtmatige bestemming en aanwending van de middelen
      van de school verkregen op grond van deze wet;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28i
  - number: 28i.1.d
    text: |-
      het aanwijzen van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] die verslag uitbrengt aan de toezichthouder
      of het toezichthoudend orgaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28i
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 28i.1.e
    text: |-
      het jaarlijks afleggen van verantwoording over de uitvoering van de taken en de uitoefening van de bevoegdheden,
      bedoeld onder a tot en met d, in het bestuursverslag.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28i
  - number: 28i.2
    text: |-
      De taken en bevoegdheden van de interne toezichthouder of het interne toezichthoudend orgaan zijn zodanig dat hij
      een deugdelijk en onafhankelijk intern toezicht kan uitoefenen. Indien sprake is van meer dan een toezichthouder of
      van een toezichthoudend orgaan is de eerste volzin van overeenkomstige toepassing met betrekking tot de combinatie
      van de toezichthouders of de samenstelling van het toezichthoudend orgaan.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28i
  - number: 28i.3
    text: |-
      De interne toezichthouder of het interne toezichthoudend orgaan pleegt ten minste tweemaal per jaar overleg met
      de medezeggenschapsraad.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28i
  - number: 28i.4
    text: |-
      Indien het intern toezicht wordt uitgeoefend door een raad van toezicht, zijn het eerste lid en het tweede
      lid van overeenkomstige toepassing ten aanzien van een raad van toezicht. Een raad van toezicht is tevens
      belast met het benoemen, schorsen en ontslaan van de leden van het bestuur, alsmede de toepassing van de
      [artikelen 29, vijfde lid][ref1], [33 tot en met 34a][ref2], [38][ref3] en de daarmee verband houdende wettelijke
      bepalingen op leden van het bestuur die mede tot het personeel behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel38
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28i
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '29'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '33'
        paragraaf: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '38'
        paragraaf: '2'
        afdeling: '1'
  - number: 28j.1
    text: |-
      Een samenwerkingsschool is een school waarin zowel openbaar onderwijs als bijzonder onderwijs wordt aangeboden.
      Een samenwerkingsschool kan uitsluitend tot stand komen door samenvoeging van één of meer openbare scholen
      met één of meer bijzondere scholen en wordt in stand gehouden door een stichting, een stichting als bedoeld in
      [artikel 28][ref1] of een stichting als bedoeld in [artikel 51][ref2] waarvan het statutaire doel in ieder geval
      is het in stand houden van een samenwerkingsschool. De [artikelen 52][ref3] en [58][ref4] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel52
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel58
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28j
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '28'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '51'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '52'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: '58'
        afdeling: '3'
  - number: 28j.2
    text: 'Een samenwerkingsschool kan uitsluitend tot stand komen indien:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28j
  - number: 28j.2.a
    text: |-
      met die totstandkoming van de samenwerkingsschool de continuïteit van het openbaar of bijzonder onderwijs
      gehandhaafd kan blijven; en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28j
  - number: 28j.2.b
    text: de betrokken scholen ten minste zes schooljaren zijn bekostigd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28j
  - number: 28j.3
    text: |-
      Van een situatie als bedoeld in het tweede lid, onderdeel a, is sprake indien één van de betrokken scholen op
      1 oktober van het eerste of tweede schooljaar voorafgaand aan de fusiedatum werd bezocht door ten hoogste het
      aantal leerlingen, bedoeld in [artikel 83, tweede lid][ref1]. De uitkomst van de berekening wordt afgerond, waarbij
      de decimalen worden verwaarloosd indien het eerste cijfer achter de komma kleiner is dan 5 en waarbij de decimalen
      worden verwaarloosd en het getal verhoogd met 1 indien het eerste cijfer achter de komma gelijk is aan of groter is
      dan 5.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel83
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28j
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '83'
        afdeling: '2'
  - number: 28j.4
    text: Samenwerkingsscholen zijn toegankelijk voor alle kinderen zonder onderscheid van godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28j
  - number: 28j.5
    text: Aan een samenwerkingsschool is een identiteitscommissie verbonden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28j
  - number: 28j.6
    text: |-
      De identiteitscommissie adviseert gevraagd en ongevraagd het bevoegd gezag en de directeur over alle
      aangelegenheden die betrekking hebben op de wijze waarop invulling wordt gegeven aan het openbare karakter en de
      identiteit van de samenwerkingsschool. De identiteitscommissie kan tevens voorstellen doen over de aangelegenheden,
      bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28j
  - number: 28j.7
    text: |-
      De statuten van de stichting die de samenwerkingsschool in stand houdt, voorzien in een regeling over de
      identiteitscommissie waarin in ieder geval de samenstelling, benoeming, herbenoeming, ontslag, duur van de
      benoeming, werkwijze, inrichting en bevoegdheden van de identiteitscommissie zijn vastgelegd alsmede een
      voorziening voor het beslechten van geschillen tussen het bevoegd gezag en de identiteitscommissie. Bij de
      samenstelling van de identiteitscommissie is sprake van een evenwichtige verdeling tussen openbaar en bijzonder
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28j
  - number: 28j.8
    text: |-
      Wijziging van de statuten van de stichting die de samenwerkingsschool in stand houdt voor zover die betrekking
      hebben op de regeling over de identiteitscommissie, is slechts mogelijk indien het bevoegd gezag en de
      identiteitscommissie daartoe gezamenlijk besluiten. Indien het een stichting betreft anders dan een stichting
      als bedoeld in [artikel 28][ref1] en anders dan bedoeld in [artikel 51][ref2], kan een wijziging als bedoeld
      in de eerste volzin uitsluitend tot stand komen met instemming van de gemeenteraad van de gemeente waarin
      de samenwerkingsschool gevestigd is. Instemming kan slechts worden onthouden indien overheersende invloed
      van de overheid in de identiteitscommissie niet is verzekerd voor zover het openbaar onderwijs binnen de
      samenwerkingsschool betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel51
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28j
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '28'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '51'
        afdeling: '2'
  - number: 28j.9
    text: |-
      De stichting anders dan een stichting als bedoeld in [artikel 28][ref1] en anders dan bedoeld in [artikel 51][ref2]
      brengt jaarlijks aan de gemeenteraad van de gemeente waarin de samenwerkingsschool gevestigd is, verslag uit
      over de werkzaamheden waarbij in ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar
      onderwijs. Het verslag wordt bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel51
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28j
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '28'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '51'
        afdeling: '2'
  - number: 28j.10
    text: |-
      De voorschriften van deze wet en van andere wetten die het speciaal of voortgezet speciaal onderwijs betreffen,
      alsmede de daarop gebaseerde regelingen, voor zover die voorschriften en regelingen betrekking hebben op een
      bijzondere school, zijn van overeenkomstige toepassing op een samenwerkingsschool als bedoeld in het eerste lid,
      tenzij het tegendeel blijkt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28j
  - number: 28j.11
    text: |-
      In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover
      het openbaar onderwijs betreft, neemt de gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd
      is, de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het
      openbaar onderwijs betreft. De feitelijke samenwerking wordt beëindigd op 1 augustus van het jaar na een daartoe
      door de gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd is, en het bevoegd gezag van de
      samenwerkingsschool gezamenlijk genomen besluit.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28j
  - number: 28j.12
    text: |-
      Overdracht, opheffing of fusie van de samenwerkingsschool is slechts mogelijk na instemming van de gemeenteraad van
      de gemeente waar de samenwerkingsschool gevestigd is.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel28j
  - number: '29.1'
    text: |-
      Aan elke school is een directeur verbonden, bij wie onder verantwoordelijkheid van het bevoegd gezag de
      onderwijskundige, organisatorische en huishoudelijke leiding berust. De directeur van een school kan tevens
      directeur zijn van een andere school of van een school als bedoeld in de [Wet op het primair onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: '29.2'
    text: Aan een school zijn een of meer leraren verbonden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel29
  - number: '29.3'
    text: Een of meer leraren kunnen tevens tot adjunct-directeur worden benoemd dan wel tewerkgesteld zonder benoeming.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel29
  - number: '29.4'
    text: |-
      Voor zover het betreft de functie van directeur en adjunct-directeur, wordt in geval van samenvoeging van scholen
      de overblijvende school gelijkgesteld met een nieuwe school. De directeur, onderscheidenlijk de adjunct-directeur
      of adjunct-directeuren, kan slechts een van de directeuren onderscheidenlijk kunnen slechts een of meer van de
      adjunct-directeuren van de samen te voegen scholen zijn, tenzij geen van de betrokkenen de desbetreffende functie
      wenst te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel29
  - number: '29.5'
    text: |-
      Het bevoegd gezag kan tevens personeel, dat werkzaamheden verricht ten behoeve van meer dan een school of meer dan
      een school als bedoeld in de [Wet op het primair onderwijs][ref1], benoemen of te werk stellen zonder benoeming
      waaronder begrepen leden van het bestuur van die scholen voor zover het intern toezicht wordt uitgeoefend door een
      raad van toezicht als bedoeld in [artikel 28i, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel28i
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 28i
        paragraaf: '1'
        afdeling: '1'
  - number: '29.6'
    text: Aan een school kan onderwijsondersteunend personeel zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel29
  - number: '29.7'
    text: |-
      Het bevoegd gezag stelt jaarlijks het beleid vast met betrekking tot de formatie van de verschillende categorieën
      personeel van de school.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel29
  - number: '30.1'
    text: |-
      Het bevoegd gezag stelt ten behoeve van de directie van elk van zijn scholen, indien daaraan van een
      ondervertegenwoordiging van vrouwen in de directie sprake is, eenmaal in de 4 jaar een document inzake evenredige
      vertegenwoordiging van vrouwen in de schoolleiding vast.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel30
  - number: '30.2'
    text: |-
      Het document bevat streefcijfers, met inbegrip van een bepaald tijdvak waarbinnen deze streefcijfers worden
      gerealiseerd, aan de hand waarvan door het bevoegd gezag een beleid inzake evenredige vertegenwoordiging van
      vrouwen in de schoolleiding wordt gevoerd, opdat in de directie van elke school van het bevoegd gezag vrouwen
      en mannen naar evenredigheid werkzaam zullen zijn. Voor de evenredige vertegenwoordiging wordt uitgegaan van de
      verhouding mannen en vrouwen voor wat betreft het onderwijzend personeel dat werkzaam is in het door de school
      verzorgde onderwijs, zoals die blijkt uit de daarover jaarlijks door Onze Minister gepubliceerde cijfers. Het
      document vermeldt tevens de maatregelen die het bevoegd gezag heeft genomen en zal nemen teneinde de in de eerste
      volzin bedoelde streefcijfers te realiseren en geeft een overzicht van de beoogde en bereikte resultaten van het
      beleid inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding gedurende de periode waarvoor het
      document geldt, onderscheidenlijk de periode waarvoor het vorige document gold.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel30
  - number: '30.3'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een exemplaar van het document in het gebouw van de school ter inzage
      wordt gelegd op een voor het personeel, de ouders en de leerlingen toegankelijke plaats, alsmede dat een exemplaar
      wordt bewaard bij de administratie van de school.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel30
  - number: 30a.1
    text: |-
      Het bestuur kan hem bij wettelijk voorschrift opgedragen taken en bevoegdheden overdragen aan de directeur van
      de school of indien toepassing is gegeven aan [artikel 29, vijfde lid][ref1], het in dat artikellid bedoelde
      personeel voor zover dat is belast met managementtaken met betrekking tot de scholen en de scholen, bedoeld in de
      [Wet op het primair onderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '29'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
  - number: 30a.2
    text: |-
      De directeur van de school of indien toepassing is gegeven aan [artikel 29, vijfde lid][ref1], het in dat
      artikellid bedoelde personeel voor zover dat is belast met managementtaken met betrekking tot de scholen en de
      scholen, bedoeld in de [Wet op het primair onderwijs][ref2] kan hem bij wettelijk voorschrift opgedragen of door
      het bevoegd gezag overgedragen taken en bevoegdheden overdragen aan de adjunct-directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '29'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
  - number: '31.1'
    text: |-
      Het bevoegd gezag stel na overleg met de directeur en indien toepassing is gegeven aan
      [artikel 29, vijfde lid][ref1], met het in dat artikellid bedoelde personeel voor zover dat is belast met
      managementtaken met betrekking tot de scholen en de scholen, bedoeld in de [Wet op het primair onderwijs][ref2],
      een managementstatuut vast. In het managementstatuut is ten minste een regeling opgenomen betreffende de
      bevoegdheden van de directeur en indien toepassing is gegeven aan [artikel 29, vijfde lid][ref3], van de
      bevoegdheden van het in dat artikellid bedoelde personeel voor zover dat is belast met managementtaken met
      betrekking tot de scholen en de scholen, bedoeld in de [Wet op het primair onderwijs][ref4], met betrekking tot de
      toedeling, bestemming en aanwending van de bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003420
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '29'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '29'
        paragraaf: '2'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0003420
  - number: '31.2'
    text: |-
      Het managementstatuut bevat tevens de aanduiding van de andere aan het bevoegd gezag bij wettelijk voorschrift
      toegekende taken en bevoegdheden, waarvan het bevoegd gezag heeft bepaald dat de directeur van de school of
      indien toepassing is gegeven aan [artikel 29, vijfde lid][ref1], het in dat artikellid bedoelde personeel
      voor zover dat is belast met managementtaken met betrekking tot de scholen en de scholen, bedoeld in de
      [Wet op het primair onderwijs][ref2] deze in naam van het bevoegd gezag kan uitoefenen. Het managementstatuut bevat
      voorts instructies ten aanzien van deze taken en bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '29'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
  - number: '31.3'
    text: 'In het managementstatuut worden tevens vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel31
  - number: 31.3.a
    text: |-
      de taken en bevoegdheden die het bestuur overdraagt aan de directeur van de school of indien toepassing is
      gegeven aan [artikel 29, vijfde lid][ref1], het in dat artikellid bedoelde personeel voor zover dat is belast met
      managementtaken met betrekking tot de scholen en de scholen, bedoeld in de [Wet op het primair onderwijs][ref2],
      indien toepassing is gegeven aan [artikel 30a, eerste lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003420
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel30a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '29'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 30a
        paragraaf: '2'
        afdeling: '1'
  - number: 31.3.b
    text: |-
      de taken en bevoegdheden die de directeur van de school of indien toepassing is gegeven aan
      [artikel 29, vijfde lid][ref1], het in dat artikellid bedoelde personeel voor zover dat is belast met
      managementtaken met betrekking tot de scholen en de scholen, bedoeld in de [Wet op het primair onderwijs][ref2]
      overdraagt aan de adjunct-directeur, indien toepassing is gegeven aan [artikel 30a, tweede lid][ref3]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003420
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel30a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '29'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003420
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 30a
        paragraaf: '2'
        afdeling: '1'
  - number: 31.3.c
    text: de richtlijnen voor de uitoefening van de overgedragen taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel31
  - number: '31.4'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een exemplaar van het managementstatuut in het gebouw van de school ter
      inzage beschikbaar is op een voor een ieder toegankelijke plaats. Het bevoegd gezag zendt een exemplaar van het
      managementstatuut, alsmede elke wijziging daarvan, zo spoedig mogelijk na de vaststelling ter kennisneming aan
      de inspectie.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel31
  - number: 31a.1
    text: |-
      Onder het beroep van leraar wordt verstaan het binnen de kaders van het onderwijskundig beleid van de school,
      verantwoordelijkheid dragen voor het vakinhoudelijke, vakdidactische en pedagogische proces in de school.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel31a
  - number: 31a.2
    text: |-
      Leraren komt een zelfstandige verantwoordelijkheid toe als het gaat om het beoordelen van de onderwijsprestaties
      van leerlingen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel31a
  - number: 31a.3
    text: |-
      Leraren beschikken over voldoende vakinhoudelijke, vakdidactische en pedagogische zeggenschap, waaronder wordt
      verstaan de zeggenschap over:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel31a
  - number: 31a.3.a
    text: de inhoud van de lesstof;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel31a
  - number: 31a.3.b
    text: de wijze waarop de lesstof wordt aangeboden en de middelen die daarbij worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel31a
  - number: 31a.3.c
    text: |-
      de te hanteren pedagogisch-didactische aanpak op de school en de wijze waarop daar uitvoering aan wordt gegeven,
      waaronder de begeleiding van de leerlingen en de contacten met de ouders;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel31a
  - number: 31a.3.d
    text: |-
      het in samenhang met de onderdelen a, b en c, onderhouden van de bekwaamheid van de leraren als onderdeel van het
      team.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel31a
  - number: 31a.4
    text: |-
      Het bevoegd gezag stelt in overleg met de leraren een professioneel statuut op waarin de afspraken zijn opgenomen
      over de wijze waarop de zeggenschap van leraren als bedoeld in het derde lid wordt georganiseerd. Bij het opstellen
      van het professioneel statuut wordt de professionele standaard van de beroepsgroep in acht genomen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel31a
  - number: '32.1'
    text: |-
      Directeuren, adjunct-directeuren en leraren worden door het bevoegd gezag benoemd dan wel tewerkgesteld zonder
      benoeming.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
  - number: '32.2'
    text: 'Tot directeur of adjunct-directeur kan slechts worden benoemd of tewerkgesteld zonder benoeming degene die:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
  - number: 32.2.a
    text: 'in het bezit is van:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
  - number: 32.2.a.1°
    text: |-
      een verklaring omtrent het gedrag, afgegeven volgens de [Wet justitiële en strafvorderlijke gegevens][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 32.2.a.2°
    text: |-
      een getuigschrift, afgegeven krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1],
      of van een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 32.2.b
    text: |-
      voor zover tot de functie werkzaamheden behoren waarvoor op grond van [artikel 32a, tweede lid][ref1],
      bekwaamheidseisen zijn vastgesteld, in het bezit is van:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 32a
        paragraaf: '2'
        afdeling: '1'
  - number: 32.2.b.1°
    text: |-
      een getuigschrift, afgegeven krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] waaruit
      blijkt dat aan die eisen is voldaan, of


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 32.2.b.2°
    text: |-
      een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref1], verleend ten aanzien van de in
      [artikel 32a, tweede lid][ref2], bedoelde werkzaamheden die betrokkene zal verrichten, of


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 32a
        paragraaf: '2'
        afdeling: '1'
  - number: 32.2.b.3°
    text: |-
      een bewijsstuk dat hij volgens bij algemene maatregel van bestuur te geven regels zijn bekwaamheid heeft
      aangetoond, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
  - number: 32.2.c
    text: |-
      niet krachtens rechterlijke uitspraak is uitgesloten van het verrichten van de werkzaamheden waarop de benoeming of
      de tewerkstelling zonder benoeming is gericht.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
  - number: '32.3'
    text: |-
      De directeur of adjunct-directeur die niet voldoet aan de eisen van het tweede lid, onder b, mag voor zover het
      werkzaamheden betreft waarvoor op grond van [artikel 32a, tweede lid][ref1], bekwaamheidseisen zijn vastgesteld,
      niettemin met die werkzaamheden worden belast, voor een periode van ten hoogste twee jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 32a
        paragraaf: '2'
        afdeling: '1'
  - number: '32.4'
    text: |-
      De directeur of adjunct-directeur die op grond van [artikel 3][ref1] bevoegd is tot het geven van onderwijs of
      die op grond van [artikel 3a][ref2] bevoegd is tot het verrichten van de daar bedoelde onderwijsondersteunende
      werkzaamheden, kan tevens worden belast met het geven van onderwijs respectievelijk met het verrichten van die
      onderwijsondersteunende werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel3a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 3a
  - number: '32.5'
    text: |-
      Om te kunnen worden benoemd of tewerkgesteld zonder benoeming tot leraar dient betrokkene te
      voldoen aan [artikel 3, eerste lid][ref1], of op grond van het derde, vierde, zesde of achtste
      lid van dat artikel bevoegd te zijn tot het geven van onderwijs, of bevoegd te zijn als bedoeld in
      [artikel 56, eerste lid, van de Wet op het voortgezet onderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel56
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '56'
  - number: '32.6'
    text: |-
      De onderwijsondersteunend functionaris die wordt belast met werkzaamheden waarvoor op grond
      van [artikel 32a, derde lid][ref1], bekwaamheidseisen zijn vastgesteld, dient te voldoen aan
      [artikel 3a, eerste lid][ref2], onverminderd het tweede tot en met vierde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel32a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel3a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 32a
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 3a
  - number: '32.7'
    text: |-
      De onderwijsondersteunend functionaris die wordt belast met andere werkzaamheden dan die waarvoor op grond van
      [artikel 32a, derde lid][ref1], bekwaamheidseisen zijn vastgesteld, dient:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 32a
        paragraaf: '2'
        afdeling: '1'
  - number: 32.7.a
    text: |-
      in het bezit te zijn van de verklaring, bedoeld in [artikel 3, eerste lid, onder a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel3
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '3'
  - number: 32.7.b
    text: te voldoen aan de overige vereisten voor de te vervullen functie.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
  - number: '32.8'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de vereisten, bedoeld in het zevende
      lid, onder b.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
  - number: '32.9'
    text: |-
      De verklaring, bedoeld in het tweede lid, onder a.1°, [artikel 3, eerste lid, onder a][ref1], en
      [artikel 3a, eerste lid, onder a][ref2], die in verband met de benoeming of tewerkstelling zonder benoeming wordt
      overgelegd, mag op het tijdstip van overlegging aan het bevoegd gezag niet ouder zijn dan zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel3a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 3a
  - number: '32.10'
    text: |-
      Indien betrokkene in het bezit is van een geschiktheidsverklaring als bedoeld in [artikel 162e][ref1] vindt
      de benoeming of tewerkstelling zonder benoeming plaats voor een periode van ten hoogste twee aaneengesloten
      schooljaren. Het bevoegd gezag kan deze benoemingsperiode, al dan niet onder door dat gezag te stellen voorwaarden,
      verlengen met ten hoogste twee jaren indien het bevoegd gezag daarvoor redenen aanwezig acht. Het bevoegd gezag
      beschikt over geordende gegevens met betrekking tot de toepassing van de tweede volzin. Het bevoegd gezag dat
      betrokkene voor de eerste maal na afgifte van de geschiktheidsverklaring benoemt of tewerkstelt zonder benoeming,
      tekent het feit en de datum van benoeming of tewerkstelling zonder benoeming aan op die verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel162e
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 162e
        afdeling: 10B
  - number: '32.11'
    text: |-
      Directeuren en adjunct-directeuren die zijn benoemd of tewerkgesteld zonder benoeming voordat de
      [Wet op de beroepen in het onderwijs][ref1] in werking is getreden en bij hun benoeming of tewerkstelling zonder
      benoeming niet beschikten over een getuigschrift als bedoeld in het tweede lid, onder a.2°, zijn vanaf het tijdstip
      van inwerkingtreding van die wet benoembaar of tewerkstelbaar zonder benoeming als directeur respectievelijk
      adjunct-directeur indien zij in elk geval voldoen aan de vereisten van het tweede lid, onder a.1° en c. Het derde
      lid is niet van toepassing op deze directeuren en adjunct-directeuren.


      [ref1]: https://wetten.overheid.nl/BWBR0016944
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0016944
  - number: 32a.1
    text: Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor leraren.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32a
  - number: 32a.2
    text: |-
      Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor werkzaamheden van leidinggevende
      aard die nauw verband houden met het pedagogisch-didactische klimaat op de school of die onderwijskundige leiding
      omvatten, en kunnen ook voor andere werkzaamheden van leidinggevende aard bekwaamheidseisen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32a
  - number: 32a.3
    text: |-
      Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor bij die maatregel aan te wijzen
      onderwijsondersteunende werkzaamheden die rechtstreeks verband houden met het onderwijsleerproces.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32a
  - number: 32a.4
    text: |-
      De in het eerste lid bedoelde bekwaamheidseisen zijn gericht op het handelen in het onderwijsleerproces, het
      algemeen professioneel handelen en het werken binnen een onderwijsorganisatie. Zij omvatten in elk geval eisen ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32a
  - number: 32a.4.a
    text: pedagogisch-didactische kennis, inzicht en vaardigheden, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32a
  - number: 32a.4.b
    text: vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32a
  - number: 32a.5
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste, tweede en derde lid, wordt aan de beide Kamers der
      Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn
      verstreken en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32a
  - number: 32a.6
    text: |-
      Onze Minister stelt een beroepsorganisatie die hij vanuit het oogpunt van beroepskwaliteit representatief acht
      voor onderwijspersoneel als bedoeld in deze wet, in de gelegenheid hem een voorstel te doen voor de in het eerste,
      tweede of derde lid voorgeschreven bekwaamheidseisen en kan een representatief geachte beroepsorganisatie in de
      gelegenheid stellen hem een voorstel te doen voor bekwaamheidseisen die op grond van het tweede lid kunnen worden
      vastgesteld. Onze Minister stelt deze organisatie vervolgens in elk geval eenmaal in de zes jaar in de gelegenheid,
      hem een voorstel te doen over ongewijzigde handhaving of wijziging van de bekwaamheidseisen voor zover vastgesteld.
      Uit een voorstel als bedoeld in de eerste of tweede volzin blijkt tevens, in hoeverre dat voorstel mede steun
      geniet van een vertegenwoordiging van bevoegde gezagsorganen en ouders van de leerlingen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32a
  - number: 32b
    text: |-
      Het bevoegd gezag beschikt ten aanzien van elk personeelslid dat een functie of werkzaamheden verricht waarvoor
      bekwaamheidseisen zijn vastgesteld, over geordende gegevens met betrekking tot de bekwaamheid en het onderhouden
      van de bekwaamheid. Ten behoeve van de onderlinge vergelijkbaarheid en herkenbaarheid van de gegevens kunnen bij
      ministeriële regeling voorschriften worden vastgesteld over de inrichting en wijze van ordening van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32b
  - number: 32c
    text: |-
      Totdat de bekwaamheidseisen voor werkzaamheden van leidinggevende aard, bedoeld in [artikel 32a, tweede lid][ref1],
      in werking treden, blijven ten aanzien van de benoeming of tewerkstelling als directeur of adjunct-directeur de bij
      of krachtens deze wet vastgestelde voorschriften, zoals luidend op 31 juli 2006, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 32a
        paragraaf: '2'
        afdeling: '1'
  - number: 32d.1
    text: |-
      Degene die op 31 juli 2017 voor het geven van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs aan een
      school is benoemd of tewerkgesteld zonder benoeming, alsmede degene die eerder al voor het geven van dat onderwijs
      benoemd is geweest of tewerkgesteld zonder benoeming, voldoet aan de bekwaamheidseisen voor het geven van dat
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32d
  - number: 32d.2
    text: |-
      Degene die binnen een periode van vijf jaren gerekend vanaf 1 augustus 2017 voor de eerste keer wordt benoemd of
      tewerkgesteld zonder benoeming voor het geven van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs aan
      een school, dient binnen een periode van vijf jaren gerekend vanaf het tijdstip van die eerste benoeming of die
      eerste tewerkstelling zonder benoeming, te voldoen aan de bekwaamheidseisen voor het geven van dat onderwijs om
      belast te kunnen blijven worden met de desbetreffende werkzaamheden. Bij algemene maatregel van bestuur kan deze
      periode worden verlengd met een daarbij te bepalen periode indien dat noodzakelijk is voor een goede invoering van
      die bekwaamheidseisen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32d
  - number: 32d.3
    text: 'Het eerste en tweede lid zijn van overeenkomstige toepassing op degene die:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32d
  - number: 32d.3.a
    text: |-
      onderwijsondersteunende werkzaamheden ten behoeve van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs
      aan een school verricht, vanaf het moment dat voor die werkzaamheden bekwaamheidseisen zijn vastgesteld; of
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32d
  - number: 32d.3.b
    text: |-
      is aangewezen, eerder was aangewezen onderscheidenlijk voor de eerste keer wordt aangewezen voor het geven van
      godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs op openbare scholen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32d
  - number: 32d.4
    text: Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32d
  - number: 32e
    text: |-
      [Artikel 21, derde lid][ref1], vindt, wat het onderhouden van de bekwaamheid betreft, voor een bepaalde
      personeelscategorie voor het eerst toepassing met ingang van het tijdstip waarop de bekwaamheidseisen voor die
      categorie in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel21
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel32e
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '21'
        paragraaf: '1'
        afdeling: '1'
  - number: '33'
    text: Het bevoegd gezag draagt er zorg voor dat de rechtspositie van het personeel wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel33
  - number: 33a
    text: Het bevoegd gezag benoemt, schorst en ontslaat het personeel.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel33a
  - number: '34.1'
    text: |-
      Het bevoegd gezag benoemt de directeur en de adjunct-directeur, de leraren en het onderwijsondersteunend personeel
      in algemene dienst van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel34
  - number: '34.2'
    text: |-
      Onder benoeming in algemene dienst van het bevoegd gezag wordt in dit artikel verstaan een benoeming ten behoeve
      van het verrichten van werkzaamheden aan door het bevoegd gezag in stand gehouden scholen. Indien het betreft
      een bevoegd gezag dat twee of meer scholen in stand houdt en aan deze scholen niet aan eenzelfde categorie van
      kinderen, genoemd in [artikel 2, tweede lid][ref1], onderwijs wordt gegeven, geschiedt voor zover het een leraar
      betreft, de in het eerste lid bedoelde benoeming, in afwijking van het bepaalde in de eerste volzin, uitsluitend
      ten behoeve van het uitoefenen van een gelijksoortige functie aan een gelijksoortige school.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 34a.1
    text: |-
      Het bevoegd gezag draagt er zorg voor dat afschriften van bewijsstukken waarmee de bekwaamheid wordt aangetoond,
      van geschiktheidsverklaringen, van verklaringen omtrent het gedrag en van arbeidsovereenkomsten van het aan de
      school verbonden personeel worden bewaard.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel34a
  - number: 34a.2
    text: Het eerste lid is van overeenkomstige toepassing op personeel dat is tewerkgesteld zonder benoeming.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel34a
  - number: '36.1'
    text: |-
      Het bevoegd gezag is verplicht aan ho-studenten die in opleiding zijn voor een functie in het basisonderwijs, het
      speciaal onderwijs of het voortgezet speciaal onderwijs gelegenheid te bieden de als onderdeel van hun opleiding
      vereiste ervaring in de school te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel36
  - number: '36.2'
    text: 'De verplichting bedoeld in het eerste lid, betreft:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel36
  - number: 36.2.a
    text: ho-studenten die op een opleidingsinstituut voor onderwijzend personeel zijn ingeschreven;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel36
  - number: 36.2.b
    text: |-
      in een schooljaar gelijktijdig niet meer ho-studenten als bedoeld onder a, dan een derde van het aantal leraren in
      dat jaar.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel36
  - number: '36.3'
    text: |-
      Een bevoegd gezag kan een ho-student de verdere toegang tot de school ontzeggen, indien deze in strijd handelt
      met de grondslag en doelstellingen van de school. Van een beslissing tot ontzegging van de toegang tot de school
      wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd gezag van het betrokken
      opleidingsinstituut en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel36
  - number: '36.4'
    text: |-
      De directeur regelt in overeenstemming met het opleidingsinstituut en het onderwijzend personeel de werkzaamheden
      in verband met de begeleiding door dit personeel van de ho-studenten in de school.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel36
  - number: '36.5'
    text: |-
      Onze Minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de verplichting verlenen. De ontheffing geldt voor 1 schooljaar.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel36
  - number: '36.6'
    text: |-
      De scholen waarop ho-studenten als bedoeld in het eerste lid, zijn toegelaten, zijn toegankelijk voor de inspectie
      belast met het toezicht op de opleidingsinstituten voor onderwijzend personeel en voor de directeuren en de door
      deze aan te wijzen leraren van die opleidingsinstituten, een en ander voor zover zulks voor de uitoefening van het
      toezicht op de praktische vorming noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel36
  - number: '38'
    text: |-
      Over de door het bevoegd gezag ingevolge [artikel 33][ref1] te treffen regelingen, alsmede over andere
      aangelegenheden van algemeen belang voor de rechtstoestand van het personeel, wordt door of namens het bevoegd
      gezag overleg gevoerd met de daarvoor in aanmerking komende verenigingen van werknemers, op een met deze
      schriftelijk overeengekomen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel33
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '33'
        paragraaf: '2'
        afdeling: '1'
  - number: 38a.1
    text: |-
      Degene die beschikt over een in artikel 162e bedoelde geschiktheidsverklaring, het bevoegd gezag dat betrokkene
      benoemt of tewerkstelt zonder benoeming, en het bestuur van een instelling die werkzaamheden uitvoert als bedoeld
      in artikel 162j, eerste lid onder a, sluiten een overeenkomst die hun wederzijdse rechten en plichten omvat
      met betrekking tot het uitvoeren van de noodzakelijk geachte scholing en begeleiding, met inachtneming van de
      beoordeling, bedoeld in artikel 162f, tweede lid, onder c. Indien na het sluiten van de overeenkomst blijkt dat
      de scholing of begeleiding niet volgens de overeenkomst kan worden uitgevoerd, treft het bevoegd gezag tijdig een
      toereikende vervangende voorziening.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38a
  - number: 38a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de uitvoering van
      het eerste lid, waaronder in elk geval voorschriften ter waarborging van de kwaliteit van het daarin bepaalde.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38a
  - number: 38a.3
    text: |-
      Voor zover betrokkene de werkzaamheden ten aanzien waarvan hem een geschiktheidsverklaring is verstrekt, verricht
      bij twee of meer bevoegde gezagsorganen, dragen deze bevoegde gezagsorganen er zorg voor dat de overeenkomsten,
      bedoeld in het eerste lid, waarbij zij ten aanzien van betrokkene partij zijn, op elkaar worden afgestemd. Zonodig
      wordt een al gesloten overeenkomst daartoe gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38a
  - number: 38a.4
    text: |-
      De algemene maatregel van bestuur, bedoeld in het tweede en derde lid, wordt aan de beide Kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken
      en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38a
  - number: 38b.1
    text: |-
      Er is een lerarenregister. In het lerarenregister zijn van leraren voor wie de grond van benoeming of tewerkstelling
      zonder benoeming is gelegen in [artikel 32][ref1] en die bevoegd zijn tot het geven van onderwijs op grond van
      __REF001___________________________________________________________________________________________________________
      _____, persoonsidentificerende gegevens en gegevens betreffende de school of instelling, de benoeming of
      tewerkstelling zonder benoeming, en de herregistratie opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel3
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '32'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '3'
  - number: 38b.2
    text: 'Het lerarenregister heeft tot doel:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38b
  - number: 38b.2.a
    text: |-
      het vastleggen van het onderwijs waarvoor een leraar is benoemd of tewerkgesteld zonder benoeming
      op grond van [artikel 32][ref1] en die bevoegd zijn tot het geven van onderwijs op grond van
      __REF001___________________________________________________________________________________________________________
      _____;


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel3
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '32'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '3'
  - number: 38b.2.b
    text: het vastleggen op welke wijze een leraar voldoet aan de bekwaamheidseisen; en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38b
  - number: 38b.2.c
    text: het vastleggen of een leraar voldoet aan de herregistratiecriteria.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38b
  - number: 38b.3
    text: 'In aanvulling op het tweede lid heeft het lerarenregister tot doel gegevens te verstrekken:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38b
  - number: 38b.3.a
    text: aan Onze Minister ten behoeve van de beleidsvorming; en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38b
  - number: 38b.3.b
    text: |-
      aan de inspectie voor zover de verwerking van die gegevens noodzakelijk is voor de goede vervulling van haar
      publieke taak.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38b
  - number: 38b.4
    text: Onze Minister draagt zorg voor het beheer van het lerarenregister.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38b
  - number: 38d
    text: |-
      Onze Minister is voor de verwerking van persoonsgegevens in het kader van het lerarenregister de
      verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38d
  - number: 38f
    text: |-
      Onze Minister stelt bij ministeriële regeling regels over de autorisatie van degenen die onder zijn gezag vallen
      voor verwerking van persoonsgegevens in het kader van het lerarenregister.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38f
  - number: 38g.1
    text: 'Het lerarenregister bevat voor elke daarin opgenomen leraar:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38g
  - number: 38g.1.a
    text: het burgerservicenummer;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38g
  - number: 38g.1.b
    text: de geslachtsnaam, de voornamen, het geslacht, het adres, de postcode, en de geboortedatum van de leraar;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38g
  - number: 38g.1.c
    text: |-
      gegevens betreffende de benoeming of tewerkstelling zonder benoeming, waaronder in ieder geval de ingangsdatum
      ervan;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38g
  - number: 38g.1.d
    text: |-
      gegevens betreffende de school waaraan hij benoemd is of tewerkgesteld zonder benoeming, waaronder in ieder geval
      het registratienummer van de school dan wel scholengemeenschap;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38g
  - number: 38g.1.e
    text: het onderwijs waarvoor de leraar kan opgaan voor herregistratie;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38g
  - number: 38g.1.f
    text: voor welk onderwijs als bedoeld in onderdeel e de leraar opgaat voor herregistratie;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38g
  - number: 38g.1.g
    text: gegevens betreffende de activiteiten voor herregistratie; en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38g
  - number: 38g.1.h
    text: |-
      gegevens betreffende de herregistratie waaronder, indien van toepassing, de aantekening, bedoeld in
      [artikel 38l, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel38l
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38g
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 38l
        paragraaf: 2a
        afdeling: '1'
  - number: 38g.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen de gegevens, bedoeld in het eerste lid, onderdelen c tot en
      met h, nader worden gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38g
  - number: 38h.1
    text: |-
      Het bevoegd gezag verstrekt aan Onze Minister de basisgegevens van leraren die zijn benoemd of tewerkgesteld
      zonder benoeming op grond van [artikel 32][ref1] en die bevoegd zijn tot het geven van onderwijs op grond van
      __REF001___________________________________________________________________________________________________________
      _____, en draagt zorg voor het correct bijhouden van die gegevens ten behoeve van het lerarenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel3
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38h
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '32'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '3'
  - number: 38h.2
    text: |-
      De leraar verstrekt aan Onze Minister de gegevens, genoemd in
      [artikel 38g, eerste lid, onderdelen e tot en met g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel38g
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38h
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 38g
        paragraaf: 2a
        afdeling: '1'
  - number: 38h.3
    text: |-
      Indien een leraar niet is benoemd of tewerkgesteld zonder benoeming, kan hij ten behoeve van opname in
      het lerarenregister de gegevens, genoemd in [artikel 38g, eerste lid, onderdelen e tot en met g][ref1],
      verstrekken aan Onze Minister mits hij tevens de gegevens, bedoeld in artikel 38g,
      eerste lid, onderdelen a en b, verstrekt en middels een bewijsstuk als bedoeld in
      [artikel 32][ref2] en die bevoegd zijn tot het geven van onderwijs op grond van
      __REF002___________________________________________________________________________________________________________
      _____, aantoont dat hij aan de bekwaamheidseisen voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel38g
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel3
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38h
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 38g
        paragraaf: 2a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '32'
        paragraaf: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '3'
  - number: 38h.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de tijdstippen en wijze van
      levering, de correctie van de gegevens en over het aantonen van de bekwaamheidseisen, als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38h
  - number: 38i.1
    text: |-
      De gegevens, bedoeld in [artikel 38g, eerste lid, onder b][ref1], zijn gekoppeld aan het burgerservicenummer van de
      desbetreffende leraar en worden door Onze Minister verkregen uit de basisregistratie personen indien de leraar als
      ingezetene is ingeschreven in de basisregistratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel38g
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38i
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 38g
        paragraaf: 2a
        afdeling: '1'
  - number: 38i.2
    text: |-
      Indien de leraar niet als ingezetene is ingeschreven in de basisregistratie personen, worden de desbetreffende
      gegevens verkregen uit de levering op grond van [artikel 38h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel38h
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38i
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 38h
        paragraaf: 2a
        afdeling: '1'
  - number: 38j
    text: |-
      Nadat een leraar de gegevens, bedoeld in [artikel 38h, tweede en derde lid][ref1], heeft verstrekt, neemt Onze
      Minister het burgerservicenummer en de andere gegevens die zijn geleverd op grond van artikel 38h en verkregen op
      grond van [artikel 38i][ref2] of [38r, tweede lid][ref3], op in het lerarenregister, met dien verstande dat hij de
      basisgegevens slechts opneemt voor zover deze niet kunnen worden verkregen uit de basisadministratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel38h
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel38i
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel38r
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38j
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 38h
        paragraaf: 2a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 38i
        paragraaf: 2a
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 38r
        paragraaf: 2b
        afdeling: '1'
  - number: 38k.1
    text: |-
      Indien een of meer van de basisgegevens van een leraar in het lerarenregister afwijken van de betreffende
      basisgegevens behorende bij de benoeming of tewerkstelling zonder benoeming van deze leraar, kan de betrokkene
      Onze Minister elektronisch verzoeken deze gegevens te verbeteren. Onze Minister verzoekt het bevoegd gezag om hem
      overeenkomstig [artikel 38h, eerste lid][ref1], de juiste gegevens te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel38h
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38k
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 38h
        paragraaf: 2a
        afdeling: '1'
  - number: 38k.2
    text: |-
      Indien het bevoegd gezag na het verzoek van Onze Minister constateert dat de basisgegevens van de leraar in het
      lerarenregister overeenkomen met de betreffende basisgegevens behorende bij de benoeming of tewerkstelling zonder
      benoeming van deze leraar, deelt hij dit elektronisch mee aan Onze Minister en deelt Onze Minister dit elektronisch
      mee aan de betrokkene.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38k
  - number: 38k.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op de gegevens die op grond van [artikel 38i][ref1] zijn
      overgenomen uit de basisregistratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel38i
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38k
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 38i
        paragraaf: 2a
        afdeling: '1'
  - number: 38k.4
    text: |-
      Een beslissing op een verzoek als bedoeld in het eerste lid, eerste volzin, geldt als een besluit in de zin van de
      [Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38k
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 38n.1
    text: |-
      Gegevens van een leraar als bedoeld in [artikel 38g][ref1] worden verwijderd uit het lerarenregister:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel38g
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38n
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 38g
        paragraaf: 2a
        afdeling: '1'
  - number: 38n.1.a
    text: indien betrokkene Onze Minister hier om verzoekt;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38n
  - number: 38n.1.b
    text: indien betrokkene de pensioengerechtigde leeftijd bereikt;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38n
  - number: 38n.1.c
    text: indien betrokkene is overleden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38n
  - number: 38n.2
    text: |-
      In de gevallen, bedoeld in het eerste lid, onder b en c, worden alle in het lerarenregister geregistreerde gegevens
      van betrokkene verwijderd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38n
  - number: 38n.3
    text: |-
      Indien een of meer gegevens van een leraar op grond van het eerste lid worden verwijderd uit het lerarenregister,
      blijven deze gegevens tot vijf jaar na verwijdering bewaard.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38n
  - number: 38n.4
    text: |-
      Indien op grond van [artikel 38h][ref1] gegevens worden verstrekt voor heropname van een leraar in
      het lerarenregister, worden door Onze Minister van deze leraar de bewaarde gegevens als bedoeld in
      [artikel 38g, eerste lid, onderdelen e tot en met h][ref2], opgenomen in het lerarenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel38h
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel38g
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38n
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 38h
        paragraaf: 2a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 38g
        paragraaf: 2a
        afdeling: '1'
  - number: 38n.5
    text: |-
      Op verzoek van een leraar aan Onze Minister is het eerste lid, aanhef en onder b, op deze leraar niet van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38n
  - number: 38n.6
    text: |-
      Met pensioengerechtigde leeftijd wordt in dit artikel bedoeld de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a van de Algemene Ouderdomswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38n
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 38o.2
    text: |-
      Op verzoek van het bevoegd gezag van de school waaraan de leraar is benoemd of tewerkgesteld zonder benoeming
      worden in aanvulling op de gegevens, bedoeld in het eerste lid, de volgende gegevens van een leraar verstrekt:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38o
  - number: 38o.2.a
    text: het geslacht, het adres, de postcode en de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38o
  - number: 38o.2.b
    text: gegevens betreffende de benoeming of tewerkstelling zonder benoeming;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38o
  - number: 38o.2.c
    text: gegevens betreffende de school waaraan hij is benoemd of tewerkgesteld zonder benoeming;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38o
  - number: 38o.2.d
    text: |-
      indien het bevoegd gezag daarvoor toestemming heeft van de leraar: gegevens betreffende de activiteiten voor
      herregistratie; en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38o
  - number: 38o.2.e
    text: overige gegevens betreffende de herregistratie.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38o
  - number: 38o.3
    text: 'Bij of krachtens algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38o
  - number: 38o.3.a
    text: wordt de wijze waarop de gegevens van een leraar worden verstrekt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38o
  - number: 38o.3.c
    text: kunnen de gegevens, bedoeld in het eerste lid en tweede lid, nader worden gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38o
  - number: 38o.5
    text: |-
      De betrokkene heeft toegang tot de gegevens die worden bewaard op grond van [artikel 38n, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel38n
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38o
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 38n
        paragraaf: 2a
        afdeling: '1'
  - number: 38o.6
    text: 'Uit het lerarenregister worden aan Onze Minister gegevens verstrekt ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38o
  - number: 38o.6.b
    text: de beleidsvorming.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38o
  - number: 38o.7
    text: |-
      Uit het lerarenregister worden aan de inspectie gegevens verstrekt voor zover de verwerking van die gegevens
      noodzakelijk is voor de goede vervulling van haar publieke taak.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38o
  - number: 38o.8
    text: |-
      Bij de verstrekking, bedoeld in het zesde en zevende lid, kunnen persoonsgegevens worden verwerkt, indien
      dat noodzakelijk is voor de in het zesde of zevende lid genoemde doelen, onverminderd de verplichting voor de
      verwerkingsverantwoordelijke om passende technische en organisatorische maatregelen te treffen als bedoeld in
      artikel 25 van de Algemene verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38o
  - number: 38p.1
    text: |-
      Er is een registervoorportaal. In het registervoorportaal zijn van leraren die zijn benoemd of tewerkgesteld zonder
      benoeming en niet voldoen aan de bekwaamheidseisen van het onderwijs dat zij verzorgen persoonsidentificerende
      gegevens en gegevens betreffende de school en de benoeming of tewerkstelling opgenomen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38p
  - number: 38p.2
    text: |-
      Het registervoorportaal heeft tot doel het inzichtelijk maken welke leraren die zijn benoemd of tewerkgesteld
      zonder benoeming niet voldoen aan de bekwaamheidseisen van het onderwijs dat zij verzorgen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38p
  - number: 38p.3
    text: 'In aanvulling op het tweede lid heeft het registervoorportaal tot doel gegevens te verstrekken:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38p
  - number: 38p.3.a
    text: aan Onze Minister ten behoeve van de beleidsvorming; en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38p
  - number: 38p.3.b
    text: |-
      aan de inspectie voor zover de verwerking van die gegevens noodzakelijk is voor de goede vervulling van haar
      publieke taak.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38p
  - number: 38p.4
    text: Onze Minister draagt zorg voor het beheer van het registervoorportaal.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38p
  - number: 38q.1
    text: |-
      Het registervoorportaal bevat voor elke daarin opgenomen leraar de basisgegevens die op grond van
      [artikel 38r][ref1] worden geleverd, waaronder in ieder geval het gegeven betreffende het onderwijs waarvoor hij is
      benoemd of tewerkgesteld zonder benoeming.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel38r
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38q
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 38r
        paragraaf: 2b
        afdeling: '1'
  - number: 38q.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen de gegevens, bedoeld in het eerste lid, nader worden
      gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38q
  - number: 38r.1
    text: |-
      Het bevoegd gezag verstrekt aan Onze Minister de basisgegevens van leraren die zijn benoemd of
      tewerkgesteld zonder benoeming of onderwijs verzorgen op grond van de [artikelen 32][ref1] en
      [3, eerste lid, onderdeel b, onder 3, tweede lid, aanhef en onderdeel b, vijfde lid of zesde lid][ref2], en draagt
      zorg voor het correct bijhouden van die gegevens ten behoeve van het registervoorportaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel3
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38r
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '32'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '3'
  - number: 38r.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het tijdstip en de wijze van
      levering en over de correctie van de gegevens.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38r
  - number: 38s.1
    text: 'De leraar blijft voor het onderwijs waarvoor hij in het registervoorportaal is opgenomen vermeld:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38s
  - number: 38s.1.a
    text: totdat hij voldoet aan de bekwaamheidseisen van dat onderwijs; of
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38s
  - number: 38s.1.b
    text: maximaal voor de duur van de periode, genoemd in het artikel op grond waarvan deze leraar dit onderwijs geeft.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38s
  - number: 38s.2
    text: |-
      Het bevoegd gezag stelt een leraar die in het registervoorportaal is opgenomen in staat te voldoen aan de vereisten
      om voor het desbetreffende onderwijs in het lerarenregister te kunnen worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38s
  - number: 38s.3
    text: |-
      Vanaf het moment dat een leraar voor het onderwijs waarvoor hij in het registervoorportaal is opgenomen, voldoet
      aan de criteria om in het lerarenregister te worden vermeld, worden de gegevens van deze leraar verstrekt voor
      opname in het lerarenregister.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38s
  - number: 38s.4
    text: |-
      Indien een leraar die opgenomen is in het registervoorportaal niet langer voldoet aan de vereisten die op grond van
      de in [artikel 38r, eerste lid][ref1], genoemde bepalingen zijn gesteld aan de leraar, worden de gegevens van deze
      leraar verwijderd uit het registervoorportaal en gedurende vijf jaar bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel38r
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38s
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 38r
        paragraaf: 2b
        afdeling: '1'
  - number: 38t.2
    text: |-
      Op verzoek van het bevoegd gezag van de school waaraan de leraar is benoemd of tewerkgesteld zonder benoeming
      worden in aanvulling op de gegevens, bedoeld in het eerste lid, de volgende gegevens van een leraar verstrekt:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38t
  - number: 38t.2.a
    text: het geslacht, het adres, de postcode en de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38t
  - number: 38t.2.b
    text: overige gegevens betreffende de benoeming of tewerkstelling zonder benoeming; en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38t
  - number: 38t.2.c
    text: gegevens betreffende de school waaraan hij is benoemd of tewerkgesteld zonder benoeming.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38t
  - number: 38t.3
    text: 'Bij of krachtens algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38t
  - number: 38t.3.a
    text: wordt de wijze waarop de gegevens van een leraar worden verstrekt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38t
  - number: 38t.3.c
    text: kunnen de gegevens, bedoeld in het eerste lid en tweede lid, nader worden gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38t
  - number: 38t.4
    text: |-
      De leraar heeft toegang tot de gegevens die worden bewaard op grond van [artikel 38s, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel38s
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38t
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 38s
        paragraaf: 2b
        afdeling: '1'
  - number: 38t.5
    text: Uit het registervoorportaal worden aan Onze Minister gegevens verstrekt ten behoeve van de beleidsvorming.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38t
  - number: 38t.6
    text: |-
      Uit het registervoorportaal worden aan de inspectie gegevens verstrekt voor zover de verwerking van die gegevens
      noodzakelijk is voor de goede vervulling van haar publieke taak.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38t
  - number: 38t.7
    text: |-
      Bij de verstrekking, bedoeld in het vijfde en zesde lid, kunnen persoonsgegevens worden verwerkt, indien
      dat noodzakelijk is voor de in het vijfde of zesde lid genoemde doelen, onverminderd de verplichting voor de
      verwerkingsverantwoordelijke om passende technische en organisatorische maatregelen te treffen als bedoeld in
      artikel 25 van de Algemene verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38t
  - number: 38v
    text: |-
      De [artikelen 38b, vierde lid][ref1], [38d][ref2], [38f][ref3] en [38i tot en met 38k][ref4], zijn van
      overeenkomstige toepassing op het registervoorportaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel38b
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel38d
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel38f
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel38i
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel38v
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 38b
        paragraaf: 2a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 38d
        paragraaf: 2a
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 38f
        paragraaf: 2a
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: 38i
        paragraaf: 2a
        afdeling: '1'
  - number: '39.1'
    text: |-
      De leeftijd waarop het kind tot het speciaal onderwijs mag worden toegelaten is 4 jaar. Indien het betreft een kind
      als bedoeld in [artikel 2, tweede lid onder a of b][ref1], kan het worden toegelaten als het de leeftijd van 3 jaar
      heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '39.2'
    text: |-
      Onverminderd [artikel 40, derde lid][ref1], kan de inspecteur in het belang van het kind besluiten toe te staan dat
      een kind eerder wordt toegelaten dan in het eerste lid is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
        paragraaf: '3'
        afdeling: '1'
  - number: '39.3'
    text: |-
      Tot het eerste leerjaar van het voortgezet speciaal onderwijs kan als leerling slechts worden toegelaten degene
      die:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel39
  - number: 39.3.a
    text: |-
      afkomstig is van het speciaal onderwijs en bij wie naar het oordeel van de directeur van de school de grondslag
      voor het volgen van aansluitend voortgezet speciaal onderwijs of voortgezet onderwijs in voldoende mate is gelegd,
      of
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel39
  - number: 39.3.b
    text: |-
      afkomstig is van het speciaal onderwijs en aan het einde van het schooljaar de leeftijd van 14 jaar heeft bereikt,
      of
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel39
  - number: 39.3.c
    text: |-
      afkomstig is van een basisschool, een speciale school voor basisonderwijs of een school voor voortgezet onderwijs
      en bij wie naar het oordeel van de directeur van de desbetreffende school de grondslag voor het volgen van
      aansluitend voortgezet speciaal onderwijs of voortgezet onderwijs in voldoende mate is gelegd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel39
  - number: '39.4'
    text: |-
      Leerlingen bij wie naar het oordeel van de directeur van de school de grondslag voor het volgen van aansluitend
      voortgezet speciaal onderwijs of voortgezet onderwijs in voldoende mate is gelegd, verlaten aan het einde van
      het schooljaar het speciaal onderwijs, mits hierover met de ouders overeenstemming bestaat. In elk geval verlaten
      de leerlingen het speciaal onderwijs aan het einde van het schooljaar waarin zij de leeftijd van 14 jaar hebben
      bereikt. De leerlingen verlaten het voortgezet speciaal onderwijs uiterlijk aan het einde van het schooljaar waarin
      de leeftijd van 20 jaar is bereikt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel39
  - number: '39.5'
    text: |-
      Onverminderd [artikel 40, derde lid en achtste lid][ref1], kan de inspecteur voor een leerling in het voortgezet
      speciaal onderwijs ontheffing verlenen van het vierde lid, derde volzin, indien het voortgezet verblijf op
      de school wenselijk is ter voltooiing van zijn opleiding of van een op verhoging van zijn arbeidsgeschiktheid
      gerichte behandeling. Hij kan zich ten behoeve van zijn beslissing een rapport over de leerling, opgesteld
      door de in [artikel 40b][ref2] dan wel [artikel 41, tweede lid][ref3], bedoelde commissie, doen voorleggen.
      De commissie kan daartoe de betrokken leerling aan een onderzoek onderwerpen. De ontheffing wordt telkens voor
      de tijd van ten hoogste 1 jaar verleend. De inspecteur beslist binnen zes weken op een verzoek tot ontheffing.
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref4] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel40b
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 40b
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '41'
        paragraaf: '3'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '40.1'
    text: |-
      De beslissing over toelating en verwijdering van leerlingen berust bij het bevoegd gezag. De toelating mag niet
      afhankelijk worden gesteld van een geldelijke bijdrage van de ouders.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: '40.2'
    text: |-
      Tot de school wordt uitsluitend als leerling toegelaten degene waarvan de ouders aantonen, dan wel, indien hij
      meerderjarig en handelingsbekwaam is, degene die aantoont dat hij:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: 40.2.a
    text: de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: 40.2.b
    text: |-
      vreemdeling is en jonger is dan 18 jaar op de eerste schooldag waarop het speciaal onderwijs, dan wel het
      voortgezet speciaal onderwijs begint, waarvoor voor de eerste maal toelating wordt gewenst,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: 40.2.c
    text: |-
      vreemdeling is, 18 jaar of ouder is op de eerste schooldag waarop het speciaal onderwijs, dan wel het voortgezet
      speciaal onderwijs begint, waarvoor voor de eerste maal toelating wordt gewenst en op die dag rechtmatig verblijf
      houdt in de zin van [artikel 8 van de Vreemdelingenwet 2000][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 40.2.d
    text: |-
      vreemdeling is, niet meer voldoet aan een van de voorwaarden, genoemd onder b of c, en eerder in overeenstemming
      met een van die onderdelen voor speciaal onderwijs, dan wel voortgezet speciaal onderwijs is toegelaten tot een
      school, welk onderwijs nog steeds wordt gevolgd en nog niet is voltooid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: '40.3'
    text: |-
      De aanmelding van kinderen voor toelating geschiedt schriftelijk en kan worden gedaan vanaf de
      dag waarop het kind de leeftijd van 3 jaar bereikt. Indien het betreft een kind als bedoeld in
      [artikel 2, tweede lid onder a of b][ref1], kan de aanmelding worden gedaan vanaf de dag waarop het kind de
      leeftijd van 2 jaar bereikt. De ouders doen de aanmelding zo mogelijk ten minste 10 weken voor de datum waarop
      toelating wordt gevraagd en geven bij de aanmelding aan bij welke school of scholen eveneens om toelating is
      verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '40.4'
    text: |-
      Het bevoegd gezag beoordeelt of de aanmelding een kind betreft dat extra ondersteuning behoeft. Hiertoe kan
      het bevoegd gezag de ouders verzoeken gegevens te overleggen betreffende stoornissen of handicaps van het
      kind of beperkingen in de onderwijsparticipatie. Onder extra ondersteuning wordt niet verstaan ondersteuning
      ter bevordering van de beheersing van de Nederlandse taal met het oog op het voorkomen en bestrijden van
      onderwijsachterstanden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: '40.5'
    text: |-
      Indien de toelating van een leerling die extra ondersteuning behoeft, wordt geweigerd, vindt de weigering niet
      plaats dan nadat het bevoegd gezag er, na overleg met de ouders en met inachtneming van de ondersteuningsbehoefte
      van de leerling en de schoolondersteuningsprofielen van de betrokken scholen, voor heeft zorg gedragen dat een
      andere school bereid is de leerling toe te laten. Onder andere school kan ook worden verstaan een basisschool,
      een speciale school voor basisonderwijs, een school voor voortgezet onderwijs of een instelling als bedoeld in
      [artikel 1, onder c, van de Leerplichtwet 1969][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
  - number: '40.6'
    text: 'Het vierde en vijfde lid zijn niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: 40.6.a
    text: indien op de school waar de leerling is aangemeld geen plaatsruimte beschikbaar is, of
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: 40.6.b
    text: |-
      indien het bevoegd gezag de ouders bij de aanmelding verzoekt te verklaren dat zij de grondslag van het onderwijs
      op de school zullen respecteren dan wel te verklaren dat zij de grondslag van het onderwijs op de school zullen
      onderschrijven, en de ouders dit weigeren te verklaren.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: '40.7'
    text: |-
      Het bevoegd gezag neemt de beslissing over toelating van een leerling zo spoedig mogelijk doch uiterlijk 6
      weken na ontvangst van de aanmelding. Indien de beslissing, bedoeld in de vorige volzin, niet binnen 6 weken kan
      worden gegeven, deelt het bevoegd gezag dit aan de ouders mede en noemt het daarbij een zo kort mogelijke termijn
      waarbinnen de beslissing wel tegemoet kan worden gezien, welke termijn ten hoogste 4 weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: '40.8'
    text: |-
      Indien de aanmelding voor een school voor speciaal onderwijs, een school voor speciaal en voortgezet speciaal
      onderwijs of een instelling voor wat betreft het daaraan verzorgde speciaal onderwijs, een kind betreft
      dat niet is ingeschreven op een andere zodanige school of instelling of op een school als bedoeld in de
      [Wet op het primair onderwijs][ref1], en de beslissing over de toelating is 10 weken na de dag waarop het verzoek
      om toelating is gedaan nog niet genomen, wordt het kind met ingang van de dag volgend op bedoelde 10 weken, doch
      niet eerder dan de datum waarop het kind de leeftijd heeft bereikt om te kunnen worden toegelaten tot de school,
      tijdelijk geplaatst op de school en als leerling ingeschreven. Indien de leerling wordt toegelaten, wordt de
      tijdelijke plaatsing omgezet in een definitieve plaatsing. Indien de toelating van de leerling wordt geweigerd of
      een beslissing wordt genomen de aanmelding niet te behandelen, wordt de tijdelijke plaatsing beëindigd en wordt
      de leerling uitgeschreven met ingang van de dag die volgt op de dag waarop de toelating wordt geweigerd of de
      beslissing wordt genomen de aanmelding niet te behandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: '40.9'
    text: |-
      Indien de aanmelding voor een school voor voortgezet speciaal onderwijs, een school voor speciaal en voortgezet
      speciaal onderwijs of een instelling voor wat betreft het daaraan verzorgde voortgezet speciaal onderwijs, een
      leerling betreft die niet is ingeschreven op een andere zodanige school of instelling of op een school als bedoeld
      in de [Wet op het voortgezet onderwijs][ref1], en de beslissing over de toelating is 10 weken na de dag waarop het
      verzoek om toelating is gedaan nog niet genomen, wordt het kind met ingang van de dag volgend op bedoelde 10 weken,
      doch niet eerder dan de datum waarop de leerling voldoet aan de voorwaarden om te kunnen worden toegelaten tot de
      school, tijdelijk geplaatst op de school en als leerling ingeschreven. Indien de leerling wordt toegelaten, wordt
      de tijdelijke plaatsing omgezet in een definitieve plaatsing. Indien de toelating van de leerling wordt geweigerd
      of een beslissing wordt genomen de aanmelding niet te behandelen, wordt de tijdelijke plaatsing beëindigd en wordt
      de leerling uitgeschreven met ingang van de dag die volgt op de dag waarop de toelating wordt geweigerd of de
      beslissing wordt genomen de aanmelding niet te behandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: '40.10'
    text: |-
      Een leerling wordt niet toegelaten tot een school voor speciaal onderwijs of tot een school voor speciaal en
      voortgezet speciaal onderwijs voor wat betreft het daaraan verzorgde speciaal onderwijs, behorend tot cluster 3 of
      cluster 4, dan nadat de leerling toelaatbaar is verklaard tot het speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: '40.11'
    text: 'De beslissing over toelaatbaarheid, bedoeld in het tiende lid, wordt genomen:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: 40.11.a
    text: |-
      indien de leerling onmiddellijk voorafgaand aan de toelating was ingeschreven op een school als bedoeld in de
      [Wet op het primair onderwijs][ref1] of een school voor speciaal onderwijs of speciaal en voortgezet speciaal
      onderwijs behorend tot cluster 3 en 4: door het samenwerkingsverband waartoe die school behoort;


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: 40.11.b
    text: |-
      indien de leerling onmiddellijk voorafgaand aan de toelating niet was ingeschreven op een school als bedoeld in
      de [Wet op het primair onderwijs][ref1] of een school voor speciaal onderwijs of speciaal en voortgezet speciaal
      onderwijs behorend tot cluster 3 en 4 en de leerling was aangemeld bij een school, niet zijnde een instelling, of
      een school als bedoeld in de Wet op het primair onderwijs, die behoort tot een samenwerkingsverband als bedoeld in
      [artikel 18a, tweede lid, van de Wet op het primair onderwijs][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 18a
  - number: 40.11.b.1
    text: |-
      door het samenwerkingsverband in het gebied waarvan de leerling woonachtig is, indien de leerling woonachtig is
      in Nederland;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: 40.11.b.2
    text: |-
      door het samenwerkingsverband waartoe de school, niet zijnde een instelling, waarvoor toelating wordt verzocht
      behoort, indien de leerling buiten Nederland woonachtig is;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: 40.11.c
    text: |-
      indien de leerling onmiddellijk voorafgaand aan de toelating niet was ingeschreven op een school als bedoeld in
      de [Wet op het primair onderwijs][ref1] of een school voor speciaal onderwijs of speciaal en voortgezet speciaal
      onderwijs behorend tot cluster 3 en 4 en de leerling was aangemeld bij een school, niet zijnde een instelling,
      of een school als bedoeld in de Wet op het primair onderwijs, die behoort tot een landelijk samenwerkingsverband
      als bedoeld in [artikel 18a, vijftiende lid, van de Wet op het primair onderwijs][ref2]: door het landelijk
      samenwerkingsverband waartoe de school, niet zijnde een instelling, of de school, bedoeld in de Wet op het primair
      onderwijs, waar de leerling was aangemeld behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 18a
  - number: '40.12'
    text: |-
      Een leerling wordt niet toegelaten tot een school voor voortgezet speciaal onderwijs of tot een school voor
      speciaal en voortgezet speciaal onderwijs voor wat betreft het daaraan verzorgde voortgezet speciaal onderwijs,
      behorend tot cluster 3 of cluster 4, dan nadat de leerling toelaatbaar is verklaard tot het voortgezet speciaal
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: '40.13'
    text: De beslissing over de toelaatbaarheid, bedoeld in het twaalfde lid, wordt genomen
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: 40.13.a
    text: |-
      indien de leerling onmiddellijk voorafgaand aan de toelating was ingeschreven op een school als bedoeld in de
      [Wet op het voortgezet onderwijs][ref1] of een school voor voortgezet speciaal onderwijs of speciaal en voortgezet
      speciaal onderwijs behorend tot cluster 3 en 4: door het samenwerkingsverband waartoe die school behoort;


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 40.13.b
    text: |-
      indien de leerling onmiddellijk voorafgaand aan de toelating niet was ingeschreven op een school als bedoeld in de
      [Wet op het voortgezet onderwijs][ref1] of een school voor speciaal onderwijs of speciaal en voortgezet speciaal
      onderwijs behorend tot cluster 3 en 4 en de leerling was aangemeld bij een school, niet zijnde een instelling, of
      een school, bedoeld in de Wet op het voortgezet onderwijs, die behoort tot een samenwerkingsverband als bedoeld in
      [artikel 17a, tweede lid, van de Wet op het voortgezet onderwijs][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 17a
  - number: 40.13.b.1
    text: |-
      door het samenwerkingsverband in het gebied waarvan de leerling woonachtig is, indien de leerling woonachtig is
      in Nederland;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: 40.13.b.2
    text: |-
      door het samenwerkingsverband waartoe de school, niet zijnde een instelling, waarvoor toelating wordt verzocht
      behoort, indien de leerling buiten Nederland woonachtig is:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: 40.13.c
    text: |-
      indien de leerling onmiddellijk voorafgaand aan de toelating niet was ingeschreven op een school als bedoeld
      in de [Wet op het voortgezet onderwijs][ref1] of een school voor voortgezet speciaal onderwijs of speciaal en
      voortgezet speciaal onderwijs behorend tot cluster 3 en 4 en de leerling was aangemeld bij een school, niet zijnde
      een instelling, of een school als bedoeld in de Wet op het voortgezet onderwijs, die behoort tot een landelijk
      samenwerkingsverband als bedoeld in [artikel 17a, zestiende lid, van de Wet op het voortgezet onderwijs][ref2]:
      door het landelijk samenwerkingsverband waartoe de school, niet zijnde een instelling, of de school, bedoeld in de
      Wet op het voortgezet onderwijs, waar de leerling was aangemeld behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 17a
  - number: '40.14'
    text: |-
      De beslissing over de toelaatbaarheid, bedoeld in het tiende en twaalfde lid, is geen besluit als bedoeld in
      [artikel 8:4, derde lid, onder b, van de Algemene wet bestuursrecht][ref1]. Indien de leerling onmiddellijk
      voorafgaand aan de toelating was ingeschreven op een school voor voortgezet speciaal onderwijs of speciaal
      en voortgezet speciaal onderwijs behorend tot cluster 3 en 4 op grond van een toelaatbaarheidsverklaring
      waarvan de periode, bedoeld in het vijftiende lid, bij de toelating nog niet is verstreken, is geen nieuwe
      toelaatbaarheidsverklaring vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '40.15'
    text: |-
      De toelaatbaarheidsverklaring, bedoeld in het tiende onderscheidenlijk twaalfde lid, heeft betrekking op een
      periode van één of meer schooljaren. Indien de toelaatbaarheidsverklaring in de loop van een schooljaar wordt
      gegeven, wordt de periode tot de eerste dag van het eerstvolgende schooljaar toegevoegd aan de in de eerste
      volzin bedoelde periode. In het laatste schooljaar waarop de toelaatbaarheidsverklaring betrekking heeft,
      draagt het bevoegd gezag van de school er zorg voor dat terugplaatsing of overplaatsing van de leerling naar
      het basisonderwijs of voortgezet onderwijs plaatsvindt, tenzij het bevoegd gezag van oordeel is dat voortgezet
      verblijf van de leerling in het speciaal onderwijs dan wel voortgezet speciaal onderwijs noodzakelijk is en het
      samenwerkingsverband, bedoeld in het tiende onderscheidenlijk twaalfde lid, een nieuwe toelaatbaarheidsverklaring
      heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: '40.16'
    text: |-
      Een leerling die is geplaatst in een inrichting, accommodatie of residentiële instelling en die wordt toegelaten
      op basis van de bekostiging, bedoeld in [artikel 117, zesde of zevende lid][ref1], wordt door die plaatsing en voor
      de duur daarvan aangemerkt als een leerling die toelaatbaar is verklaard tot de school voor speciaal onderwijs,
      voortgezet speciaal onderwijs of tot de school voor speciaal en voortgezet speciaal onderwijs, behorend tot cluster
      3 of cluster 4, die aan die inrichting of accommodatie is verbonden dan wel waarmee die residentiële instelling
      een samenwerkingsovereenkomst heeft gesloten. In de administratie van de school is over een leerling die wordt
      toegelaten op basis van bekostiging als bedoeld in [artikel 117, zevende lid][ref2], een verklaring aanwezig van
      de residentiële instelling dat de leerling in die instelling is geplaatst. Indien een leerling is toegelaten tot
      een school die is verbonden aan een instelling als bedoeld in [artikel 71c, eerste lid][ref3], maakt die school
      afspraken met het samenwerkingsverband waartoe de leerling behoorde direct voorafgaand aan de toelating tot de
      school, over de terugkeer van de leerling.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel117
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel71c
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 71c
        afdeling: '1'
  - number: '40.17'
    text: |-
      De toelating van een leerling mag niet geweigerd worden op denominatieve gronden, tenzij de ouders van de
      leerling weigeren te verklaren dat zij de grondslag van het onderwijs van de school zullen respecteren dan wel
      onderschrijven.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: '40.18'
    text: |-
      Voordat wordt besloten tot verwijdering hoort het bevoegd gezag de betrokken leraar of leraren en de ouders van de
      leerling. Definitieve verwijdering van een leerling waarop de [Leerplichtwet 1969][ref1] van toepassing is, vindt
      niet plaats dan nadat het bevoegd gezag ervoor heeft zorggedragen dat een basisschool, een speciale school voor
      basisonderwijs, een school voor speciaal onderwijs, een school voor speciaal en voortgezet speciaal onderwijs,
      een school voor voortgezet speciaal onderwijs, een instelling, een school voor voortgezet onderwijs dan wel een
      instelling als bedoeld in [artikel 1, onder c, van de Leerplichtwet 1969][ref2] bereid is de leerling toe te
      laten. Indien het betreft een leerling van een instelling behorend tot cluster 1 of 2 kan, in afwijking van de
      vorige volzin, tot definitieve verwijdering worden overgegaan indien aantoonbaar gedurende 8 weken zonder succes
      is gezocht naar een zodanige school of instelling waarnaar kan worden verwezen. Indien het betreft een leerling van
      een school als bedoeld in [artikel 71c, eerste lid][ref3], wordt in afwijking van de tweede volzin, tot definitieve
      verwijdering overgegaan indien de leerling niet langer is opgenomen in de inrichting of accommodatie, bedoeld in
      genoemde bepaling.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel71c
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002628
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 71c
        afdeling: '1'
  - number: '40.19'
    text: |-
      Indien na de toelating tot de school blijkt dat deze op welke grond dan ook niet in overeenstemming met het tweede
      lid heeft plaatsgevonden, wordt de leerling onmiddellijk verwijderd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: '40.20'
    text: |-
      Indien tegen een besluit van het bevoegd gezag van een openbare school ingevolge het eerste, tweede, vijfde,
      zevende, achtste, negende, tiende, twaalfde, zeventiende, achttiende of negentiende lid, bezwaar is gemaakt,
      besluit het bevoegd gezag in afwijking van [artikel 7:10 van de Algemene wet bestuursrecht][ref1] binnen 4 weken
      gerekend vanaf de dag na die waarop de termijn voor het indienen van het bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '40.21'
    text: |-
      Het bevoegd gezag van een openbare school besluit niet op het bezwaarschrift, dan na overleg met de inspecteur en
      desgewenst met andere deskundigen, tenzij het bezwaarschrift is gericht tegen een besluit ingevolge het tweede of
      negentiende lid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: '40.22'
    text: Het vierde en vijfde lid zijn niet van toepassing op de toelating van een leerling tot een instelling.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40
  - number: 40a.1
    text: Het bevoegd gezag kan met opgave van redenen een leerling voor een periode van ten hoogste één week schorsen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40a
  - number: 40a.2
    text: |-
      De beslissing tot schorsing wordt schriftelijk aan de ouders dan wel, indien de leerling meerderjarig en
      handelingsbekwaam is, aan de leerling bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40a
  - number: 40a.3
    text: |-
      Het bevoegd gezag stelt de inspectie van een schorsing voor een periode langer dan één dag schriftelijk en met
      opgave van redenen in kennis.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40a
  - number: 40b.1
    text: |-
      Het bevoegd gezag van een school, niet zijnde een instelling, of de bevoegde gezagsorganen van twee of meer
      scholen, niet zijnde instellingen, stelt onderscheidenlijk stellen een commissie voor de begeleiding in, die
      zodanig is samengesteld dat zij adequaat kan adviseren vanuit zowel onderwijskundig als pedagogisch, psychologisch
      en medisch oogpunt, rekening houdend met de handicap van de leerling.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40b
  - number: 40b.2
    text: 'De commissie voor de begeleiding heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40b
  - number: 40b.2.a
    text: |-
      te adviseren over het vaststellen en bijstellen van het ontwikkelingsperspectief, bedoeld in
      [artikel 41a, eerste, tweede en vijfde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel41a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 41a
        paragraaf: '3'
        afdeling: '1'
  - number: 40b.2.b
    text: |-
      het ten minste één keer per jaar evalueren van het ontwikkelingsperspectief en hiervan verslag te doen aan het
      bevoegd gezag,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40b
  - number: 40b.2.c
    text: |-
      te adviseren over terugplaatsing of overplaatsing van de leerling naar het basisonderwijs of het voortgezet
      onderwijs, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40b
  - number: 40b.2.d
    text: |-
      het samenwerkingsverband, bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref1] en
      [artikel 1 van de Wet op het voortgezet onderwijs][ref2], te adviseren over de begeleiding van leerlingen op
      scholen als bedoeld in die wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel1
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '1'
  - number: '41.1'
    text: |-
      Tot een instelling mogen slechts die kinderen worden toegelaten voor wie vaststaat dat overwegend een
      orthopedagogische en orthodidactische benadering aangewezen is en die gezien hun handicap voor het op die
      instelling gegeven onderwijs in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel41
  - number: '41.2'
    text: |-
      Het bevoegd gezag van een instelling of de bevoegde gezagsorganen van twee of meer instellingen stelt
      onderscheidenlijk stellen een commissie in die tot taak heeft: a. te beoordelen of een kind gezien
      zijn handicap voor het onderwijs op de instelling in aanmerking komt, dan wel in aanmerking komt voor
      begeleiding door de instelling indien het kind is of wordt ingeschreven op een school als bedoeld in de
      [Wet op het primair onderwijs][ref1] of de [Wet op het voortgezet onderwijs][ref2], met dien verstande
      dat het oordeel van de commissie betrekking heeft op een door haar te bepalen periode, b. voor afloop van
      de periode, bedoeld in onderdeel a, te beoordelen of het kind nog in aanmerking komt voor het onderwijs
      op de instelling dan wel de begeleiding en indien het kind daarvoor in aanmerking komt voor welke
      periode, c. te adviseren over het vaststellen en bijstellen van het ontwikkelingsperspectief, bedoeld in
      [artikel 41a, eerste, tweede en vijfde lid][ref3], dan wel te adviseren over de inhoud van de begeleiding, d.
      als onderdeel van de onder b genoemde taak, aan het eind van elk schooljaar te adviseren omtrent terugplaatsing
      of overplaatsing van de leerling naar het basisonderwijs, een andere vorm van speciaal onderwijs, het voortgezet
      onderwijs of een vorm van voortgezet speciaal onderwijs, en e. het ten minste één keer per jaar evalueren van het
      ontwikkelingsperspectief dan wel de begeleiding en hiervan verslag te doen aan het bevoegd gezag. De commissie
      kan bij het uitoefenen van haar taak gebruik maken van bestaande onderzoeksgegevens, indien dergelijke gegevens
      aan haar worden verstrekt. De commissie wordt geleid door een vertegenwoordiger van de instelling waarvoor
      toelating wordt verzocht of waarvan begeleiding wordt gevraagd. De commissie bestaat naast de vertegenwoordiger
      van de instelling ten minste uit: 1°. een academisch gevormd psycholoog of pedagoog die zich heeft gespecialiseerd
      in de jeugd- en kinderpsychologische richting, onderscheidenlijk in de orthopedagogische richting, 2°. een
      maatschappelijk deskundige die in het bezit is van het diploma maatschappelijk werker van een sociale academie of
      van een door Onze Minister aangewezen diploma en 3°. een arts die vertrouwd is met het onderzoek van kinderen voor
      wie het op de instelling gegeven onderwijs is bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0002399
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel41a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0002399
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 41a
        paragraaf: '3'
        afdeling: '1'
  - number: '41.3'
    text: |-
      In verband met de beoordeling van kinderen met een niet-Nederlandse culturele achtergrond kan de commissie een
      deskundige op het gebied van de taal en cultuur van het land van oorsprong inschakelen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel41
  - number: '41.4'
    text: |-
      Geen kind wordt tot een instelling toegelaten of begeleid door een instelling dan na onderzoek door een commissie
      als bedoeld in het tweede lid. De inspecteur is bevoegd het onderzoek bij te wonen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel41
  - number: '41.5'
    text: |-
      De onderscheiden functionarissen van de commissie brengen hun bevindingen naar aanleiding van hun onderzoek van het
      kind door middel van een onderzoeksrapport ter kennis van de commissie.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel41
  - number: '41.6'
    text: |-
      Van het in het vierde lid bedoelde onderzoek maakt de commissie een gemeenschappelijk rapport waarin naast het
      eindoordeel, de onderzoeksrapporten bedoeld in het vijfde lid, en de eventuele overige aan de commissie verstrekte
      documenten worden opgenomen, alsmede de bevindingen van de onderscheiden functionarissen naar aanleiding van het
      overleg in de commissie tot uitdrukking worden gebracht.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel41
  - number: '41.7'
    text: |-
      De vertegenwoordiger van de instelling, bedoeld in het tweede lid, bespreekt de conclusies van het rapport
      met de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, de leerling. De ouders van
      een minderjarige of handelingsonbekwame leerling, de leerling die de leeftijd van 16 jaar heeft bereikt en de
      inspecteur krijgen desgewenst inzage in het rapport.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel41
  - number: '41.8'
    text: |-
      Het bevoegd gezag ziet erop toe dat het gemeenschappelijk rapport slechts wordt gebruikt ten behoeve van het
      verblijf van de betrokken leerling op de instelling dan wel de begeleiding van de betrokken leerling door de
      instelling. Van het bepaalde in de vorige volzin kan voor wat betreft het rapport worden afgeweken voor zover door
      de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, de leerling schriftelijk toestemming
      is verleend.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel41
  - number: '41.9'
    text: |-
      Het gemeenschappelijk rapport wordt in de instelling bewaard tot ten minste 3 jaar na het tijdstip waarop de
      leerling de instelling heeft verlaten dan wel de begeleiding van de leerling door de instelling is beëindigd. Het
      bevoegd gezag draagt er zorg voor dat het gemeenschappelijk rapport wordt bewaard op een plaats die uitsluitend
      toegankelijk is voor het bevoegd gezag en de met het onderzoek belaste functionarissen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel41
  - number: 41a.1
    text: |-
      Voor een leerling voor wie speciaal onderwijs dan wel voortgezet speciaal onderwijs wordt verzorgd, stelt het
      betreffende bevoegd gezag een ontwikkelingsperspectief vast na advies van de commissie voor de begeleiding dan wel
      de commissie van onderzoek en nadat op overeenstemming gericht overleg is gevoerd met de ouders dan wel, indien de
      leerling meerderjarig en handelingsbekwaam is, met de leerling.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel41a
  - number: 41a.2
    text: |-
      In afwijking van het eerste lid, wordt het deel van het ontwikkelingsperspectief betreffende de individuele
      begeleiding van de leerling vastgesteld na advies van de commissie voor begeleiding dan wel de commissie van
      onderzoek en nadat hierover overeenstemming bereikt is tussen het bevoegd gezag en de ouders dan wel, indien de
      leerling meerderjarig en handelingsbekwaam is, met de leerling.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel41a
  - number: 41a.3
    text: |-
      Het ontwikkelingsperspectief wordt zo spoedig mogelijk, doch uiterlijk binnen zes weken na de inschrijving van de
      leerling vastgesteld. Indien het betreft een inschrijving op grond van [artikel 40, achtste of negende lid][ref1],
      wordt het ontwikkelingsperspectief uiterlijk binnen zes weken na de definitieve plaatsing van de leerling
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
        paragraaf: '3'
        afdeling: '1'
  - number: 41a.4
    text: |-
      Het ontwikkelingsperspectief wordt ten minste één keer per schooljaar met de ouders, dan wel, indien de leerling
      meerderjarig en handelingsbekwaam is, met de leerling, geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel41a
  - number: 41a.5
    text: |-
      Na advies van de commissie voor de begeleiding dan wel de commissie van onderzoek en nadat op overeenstemming
      gericht overleg is gevoerd met de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, met de
      leerling, kan het bevoegd gezag het ontwikkelingsperspectief bijstellen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel41a
  - number: 41a.6
    text: |-
      In afwijking van het vijfde lid kan het bevoegd gezag het deel van het ontwikkelingsperspectief betreffende de
      individuele begeleiding van de leerling bijstellen na advies van de commissie voor de begeleiding dan wel de
      commissie van onderzoek en nadat overeenstemming bereikt is met de ouders, dan wel, indien de leerling meerderjarig
      en handelingsbekwaam is, met de leerling.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel41a
  - number: 41a.7
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften over de inhoud van het ontwikkelingsperspectief
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel41a
  - number: '42.1'
    text: |-
      Indien de inspecteur van oordeel is dat op een school een leerling is geplaatst die daar ingevolge
      [artikel 40][ref1] dan wel [artikel 41, eerste lid][ref2], niet had mogen worden toegelaten, verzoekt hij het
      bevoegd gezag deze leerling te verwijderen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel41
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '41'
        paragraaf: '3'
        afdeling: '1'
  - number: '42.2'
    text: |-
      Bij weigering van het bevoegd gezag te voldoen aan een verzoek als bedoeld in het eerste lid, roept de inspecteur
      het besluit van Onze Minister in.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel42
  - number: '42.3'
    text: |-
      Indien de inspecteur van oordeel is dat het in [artikel 41, vierde lid][ref1], bedoelde onderzoek niet voldoet aan
      redelijke eisen, treedt hij in overleg met het bevoegd gezag onder mededeling van de zijns inziens aan te brengen
      wijzigingen. Indien dit overleg niet tot overeenstemming leidt, roept de inspecteur het besluit van Onze Minister
      in.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel41
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '41'
        paragraaf: '3'
        afdeling: '1'
  - number: 42a.1
    text: |-
      Onverminderd bij algemene maatregel van bestuur gegeven voorschriften met betrekking tot de in- en uitschrijving
      van leerlingen, vindt toelating van een leerling als bedoeld in artikel 40 slechts plaats nadat door de ouders of,
      indien de leerling meerderjarig en handelingsbekwaam is, door de leerling de gegevens betreffende de geslachtsnaam,
      de voorletters, de geboortedatum, het geslacht en het persoonsgebonden nummer van de leerling zijn overgelegd.
      Indien door de ouders of, indien de leerling meerderjarig en handelingsbekwaam is, door de leerling aannemelijk
      wordt gemaakt dat geen persoonsgebonden nummer van de leerling kan worden overgelegd, vindt de toelating plaats met
      inachtneming van het derde lid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel42a
  - number: 42a.2
    text: |-
      De in het eerste lid bedoelde gegevens worden overgelegd door middel van een van overheidswege verstrekt document
      of een door een andere school of een school voor ander onderwijs verstrekt bewijs van uitschrijving, waarin de
      desbetreffende gegevens zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel42a
  - number: 42a.3
    text: |-
      Indien door de ouders of, indien de leerling meerderjarig en handelingsbekwaam is, door de leerling aannemelijk
      wordt gemaakt dat geen persoonsgebonden nummer van de leerling kan worden overgelegd, meldt het bevoegd gezag
      binnen twee weken na het besluit tot toelating aan Onze Minister de beschikbare gegevens van de leerling, bedoeld
      in het eerste lid, alsmede zijn adres en woonplaats en, indien aanwezig, het leerlingadministratienummer.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel42a
  - number: 42a.4
    text: |-
      Onze Minister verstrekt binnen acht weken na ontvangst van de melding, bedoeld in het derde lid, aan het bevoegd
      gezag het burgerservicenummer van de leerling, dan wel, indien is gebleken dat hem niet van overheidswege een
      burgerservicenummer is verstrekt, het onderwijsnummer van de leerling. Het onderwijsnummer is een door Onze
      Minister uitgegeven en aan de leerling toegekend persoonsgebonden nummer.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel42a
  - number: 42a.5
    text: |-
      Het bevoegd gezag neemt de in het eerste en vierde lid bedoelde gegevens op in de leerlingenadministratie van de
      school. Bij ministeriële regeling kan worden bepaald welke andere gegevens in de leerlingenadministratie worden
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel42a
  - number: 42a.6
    text: |-
      Indien aan een leerling een onderwijsnummer is toegekend en het bevoegd gezag daarna de beschikking krijgt over
      zijn burgerservicenummer, neemt het bevoegd gezag dit burgerservicenummer terstond als persoonsgebonden nummer
      op in de leerlingenadministratie van de school in de plaats van het onderwijsnummer. Het bevoegd gezag meldt deze
      wijziging binnen twee weken aan Onze Minister onder opgave van het burgerservicenummer en het onderwijsnummer van
      de leerling.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel42a
  - number: 42b.1
    text: |-
      Het bevoegd gezag geeft jaarlijks de leerlingen op die aan die school voor speciaal onderwijs ingeschreven
      staan op het uitstroomprofiel vervolgonderwijs of het arbeidsmarktgerichte uitstroomprofiel en naar
      verwachting het aankomend schooljaar hun opleiding zullen vervolgen aan een beroepsopleiding in de zin van de
      [Wet educatie en beroepsonderwijs][ref1]. De opgave wordt gedaan aan het college van burgemeester en wethouders van
      de woon- of verblijfplaats van de deze leerlingen. Deze informatie wordt uitsluitend gebruikt om schooluitval bij
      de overgang naar het beroepsonderwijs te voorkomen


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 42b.2
    text: |-
      Bij ministeriële regeling worden ter uitvoering van het eerste lid regels vastgesteld. Deze betreffen in ieder
      geval een specificatie van de bij de opgave te leveren gegevens, het tijdstip en de wijze waarop deze gegevens
      worden geleverd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel42b
  - number: '43.1'
    text: |-
      Over iedere leerling die de school verlaat, stelt de directeur, na overleg met het onderwijzend
      personeel en de commissie voor de begeleiding, bedoeld in [artikel 40b][ref1], dan wel de commissie,
      bedoeld in [artikel 41, tweede lid][ref2], ten behoeve van de ontvangende school of school als
      bedoeld in de [Wet op het primair onderwijs][ref3], de [Wet op het voortgezet onderwijs][ref4] of de
      [Wet educatie en beroepsonderwijs][ref5] een onderwijskundig rapport op. De commissie kan daartoe de leerling aan
      een onderzoek onderwerpen. Onderdeel van het onderwijskundig rapport is het meest recente ontwikkelingsperspectief.
      Afschrift van dit rapport wordt verstrekt aan de ouders van een minderjarige of handelingsonbekwame leerling en
      aan de leerling die meerderjarig en handelingsbekwaam is. Desgewenst wordt tevens een afschrift verstrekt aan de
      leerling die de leeftijd van 16 jaar en nog niet die van 18 jaar heeft bereikt. Bij algemene maatregel van bestuur
      worden nadere voorschriften omtrent dit rapport gegeven. De centrale eindtoets of andere eindtoets dient als tweede
      objectieve gegeven om onderadvisering vanuit het primair onderwijs te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40b
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0003420
      [ref4]: https://wetten.overheid.nl/BWBR0002399
      [ref5]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 40b
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '41'
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003420
      - id: ref4
        bwb_id: BWBR0002399
      - id: ref5
        bwb_id: BWBR0007625
  - number: '43.2'
    text: |-
      Ten behoeve van iedere leerling in het laatste schooljaar van het speciaal onderwijs stelt het bevoegd gezag
      voor 1 maart een schooladvies vast omtrent het volgen van aansluitend voortgezet speciaal onderwijs of voortgezet
      onderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref1]. Het schooladvies maakt onderdeel uit van het
      onderwijskundig rapport. Indien de leerling blijkens de uitslag van de centrale eindtoets of andere eindtoets,
      bedoeld in [artikel 18b][ref2], beschikt over meer kennis en vaardigheden dan die waarop het schooladvies berust,
      heroverweegt het bevoegd gezag het schooladvies. Indien hierbij wordt afgeweken van de uitslag van de centrale
      eindtoets of andere eindtoets, wordt dit gemotiveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel18b
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 18b
        paragraaf: '1'
        afdeling: '1'
  - number: '43.3'
    text: |-
      De in het eerste lid bedoelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel43
  - number: '44'
    text: |-
      Het bevoegd gezag van de school waar de leerling voortgezet speciaal onderwijs heeft gevolgd, adviseert tot
      twee jaar nadat de leerling die school heeft verlaten, de ouders, dan wel, indien de leerling meerderjarig en
      handelingsbekwaam is, de leerling, op hun onderscheidenlijk op diens verzoek over het volgen van aansluitend
      vervolgonderwijs, het uitoefenen van een functie op de arbeidsmarkt of het functioneren in een vorm van
      dagbesteding.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel44
  - number: '45.1'
    text: |-
      Er is tot een bij koninklijk besluit te bepalen tijdstip een landelijke commissie voor geschillen waarbij
      elke school, school als bedoeld in de [Wet op het primair onderwijs][ref1] en school als bedoeld in de
      [Wet op het voortgezet onderwijs][ref2] is aangesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0002399
  - number: '45.2'
    text: |-
      De commissie neemt kennis van geschillen tussen ouders en bevoegd gezag van een school of instelling die ontstaan
      bij de toepassing van:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel45
  - number: 45.2.a
    text: |-
      de [artikelen 40, vierde, vijfde, zesde en achttiende lid][ref1],[ 41, tweede lid, onderdeel a][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel41
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '41'
        paragraaf: '3'
        afdeling: '1'
  - number: 45.2.b
    text: |-
      [artikel 41a, eerste, tweede en vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel41a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 41a
        paragraaf: '3'
        afdeling: '1'
  - number: '45.3'
    text: |-
      De commissie brengt op verzoek van de ouders binnen 10 weken een oordeel uit aan het bevoegd gezag, rekening
      houdend met het schoolondersteuningsprofiel en het ondersteuningsplan.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel45
  - number: '45.4'
    text: |-
      Indien een geschil aanhangig is gemaakt bij de commissie en de ouders bezwaar hebben gemaakt tegen de beslissing
      over de toelating of de verwijdering, neemt het bevoegd gezag de beslissing op bezwaar niet dan nadat de commissie
      heeft geoordeeld. De termijn voor het nemen van de beslissing op bezwaar wordt opgeschort met ingang van de
      dag waarop het geschil aanhangig is gemaakt bij de commissie tot de dag waarop de commissie het oordeel heeft
      uitgebracht.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel45
  - number: '45.5'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot de commissie, waaronder in elk
      geval het aantal leden, de wijze van benoeming en ontslag en de deskundigheid van de leden van de commissie.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel45
  - number: '46.1'
    text: |-
      De leerlingen nemen deel aan alle voor hen bestemde onderwijsactiviteiten, met dien verstande dat die
      onderwijsactiviteiten voor de leerlingen onderling kunnen verschillen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel46
  - number: '46.2'
    text: |-
      Het bevoegd gezag kan op aanvraag van de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam is,
      de leerling, een leerling vrijstellen van bepaalde onderwijsactiviteiten in het speciaal onderwijs met uitzondering
      van de centrale eindtoets of de andere eindtoetsen, bedoeld in [artikel 18b][ref1]. Een vrijstelling kan slechts
      worden verleend, op door het bevoegd gezag vastgestelde gronden. Het bevoegd gezag bepaalt bij de vrijstelling
      welke onderwijsactiviteiten voor de leerling in de plaats komen van die waarvan vrijstelling is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel18b
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 18b
        paragraaf: '1'
        afdeling: '1'
  - number: '47'
    text: |-
      Op verzoek van de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, op verzoek van de
      leerling, kan aan leerlingen die voortgezet speciaal onderwijs volgen gelegenheid worden gegeven eindexamen af te
      leggen aan een school voor regulier onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel47
  - number: 47a.1
    text: |-
      Het bevoegd gezag doet onverwijld opgave aan burgemeester en wethouders van de gemeente waar de betrokkene woon- of
      verblijfplaats heeft van de gegevens van degene
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel47a
  - number: 47a.1.a
    text: |-
      op wie de [Leerplichtwet 1969][ref1] niet meer van toepassing is en die de leeftijd van 23 jaren nog niet heeft
      bereikt,


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 47a.1.b
    text: |-
      die niet in het bezit is van een diploma voorbereidend wetenschappelijk onderwijs of
      hoger algemeen voortgezet onderwijs als bedoeld in [artikel 7][ref1] onderscheidenlijk
      [artikel 8 van de Wet op het voortgezet onderwijs][ref2] dan wel een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e, van de Wet educatie en beroepsonderwijs][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 47a.1.c
    text: die van de school wordt verwijderd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel47a
  - number: 47a.2
    text: |-
      Op verzoek van burgemeester en wethouders van de gemeente waar de betrokkene woon- of verblijfplaats heeft, vindt
      de opgave, bedoeld in het eerste lid, plaats aan burgemeester en wethouders van de contactgemeente, bedoeld in
      [artikel 162b, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel162b
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 162b
        afdeling: 10A
  - number: 47a.3
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel47a
  - number: 47b.1
    text: |-
      Indien degene die voldoet aan [artikel 47a, eerste lid, onderdelen a en b][ref1], het onderwijs aan de school
      gedurende een aaneengesloten periode van ten minste een maand of een door het bevoegd gezag te bepalen kortere
      periode zonder geldige reden niet meer volgt, ontstaat voor het bevoegd gezag de leveringsverplichting, bedoeld in
      [artikel 12, derde lid, van de Wet register onderwijsdeelnemers][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel47a
      [ref2]: https://wetten.overheid.nl/BWBR0042012#Artikel12
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel47b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 47a
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0042012
        artikel: '12'
  - number: 47b.2
    text: 'Onder afwezigheid met een geldige reden als bedoeld in het eerste lid wordt verstaan afwezigheid wegens:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel47b
  - number: 47b.2.a
    text: |-
      ziekte van de betrokkene, welke ziekte uitsluitend kan worden aangetoond door middel van een gedagtekende
      verklaring van een arts,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel47b
  - number: 47b.2.b
    text: |-
      zwangerschap of bevalling van de betrokkene welke uitsluitend kan worden aangetoond door middel van een
      schriftelijke verklaring van een arts of verloskundige, gedurende een periode van 16 weken die, indien de
      betrokkene dat wenst, 6 weken voor de dag na de vermoedelijke datum van bevalling ingaat of gedurende een periode
      van 20 weken die, indien de betrokkene dat wenst,10 weken voor de dag na de vermoedelijke datum van bevalling
      ingaat indien het een zwangerschap van meer dan één kind betreft, of
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel47b
  - number: 47b.2.c
    text: bijzondere familieomstandigheden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel47b
  - number: 47b.3
    text: |-
      Het bevoegd gezag kan bepalen dat de periode, bedoeld in het tweede lid, onderdeel b, wordt verlengd als dit naar
      zijn oordeel passend is.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel47b
  - number: '48'
    text: |-
      Het bevoegd gezag stelt de ouders van de leerlingen in de gelegenheid ondersteunende werkzaamheden ten behoeve
      van de school en het onderwijs te verrichten. De ouders zijn daarbij gehouden de aanwijzingen op te volgen van de
      directeur en het overige onderwijzend personeel, die verantwoordelijk blijven voor de gang van zaken.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel48
  - number: 48a.1
    text: |-
      Indien de inspectie op basis van een onderzoek als bedoeld in [artikel 11][ref1] of
      [artikel 15 van de Wet op het onderwijstoezicht][ref2], in het inspectierapport, bedoeld in
      [artikel 20 van genoemde wet][ref3], tot het oordeel is gekomen dat sprake is van zeer zwak onderwijs, bedoeld in
      [artikel 19a][ref4], informeert het bevoegd gezag de ouders van de leerlingen van de school hierover door middel
      van in ieder geval de toezending van de door de inspectie opgestelde samenvatting van het inspectierapport, welke
      samenvatting gelijktijdig met het inspectierapport ter beschikking is gesteld van het bevoegd gezag. De toezending,
      bedoeld in de eerste volzin, geschiedt binnen vier weken na de vaststelling van het inspectierapport.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel19a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '20'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: 19a
        paragraaf: '1'
        afdeling: '1'
  - number: 48a.2
    text: |-
      Indien het bevoegd gezag niet of niet tijdig voldoet aan de verplichting, bedoeld in het eerste lid, zendt Onze
      Minister de samenvatting van het inspectierapport, bedoeld in het eerste lid, in de vijfde week na vaststelling van
      het inspectie rapport aan de ouders van de leerlingen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel48a
  - number: 48a.3
    text: |-
      Indien de inspectie op basis van een onderzoek als bedoeld in [artikel 11][ref1] of
      [artikel 15 van de Wet op het onderwijstoezicht][ref2] in het inspectierapport, bedoeld in
      [artikel 20 van genoemde wet][ref3], tot het oordeel is gekomen dat sprake is van een zeer zwakke school, betrekt
      het bevoegd gezag de ouders van de leerlingen van de school en de meerderjarige leerlingen bij de door het bevoegd
      gezag voorgenomen maatregelen ten behoeve van kwaliteitsverbetering.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '20'
  - number: '49.1'
    text: |-
      Het openbaar onderwijs draagt bij aan de ontwikkeling van de leerlingen met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse samenleving en met onderkenning
      van de betekenis van de verscheidenheid van die waarden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel49
  - number: '49.2'
    text: Openbare scholen zijn toegankelijk voor alle kinderen zonder onderscheid van godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel49
  - number: '49.3'
    text: Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel49
  - number: '50.1'
    text: |-
      Een gemeenteraad kan bij verordening een openbare rechtspersoon instellen die tot doel heeft een of meer
      openbare scholen in de gemeente in stand te houden, al dan niet te zamen met openbare scholen als bedoeld in de
      [Wet op het primair onderwijs][ref1] of openbare scholen als bedoeld in de [Wet op het voortgezet onderwijs][ref2].
      Een openbare rechtspersoon kan ook worden ingesteld door meer dan een gemeente ten behoeve van het in stand houden
      van openbare scholen in die gemeenten door het vaststellen van een voor wat betreft de onderwerpen, bedoeld in
      het vierde lid, gelijkluidende verordening, in welk geval de openbare rechtspersoon niet eerder tot stand komt dan
      nadat alle daartoe strekkende verordeningen in werking zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0002399
  - number: '50.2'
    text: De gemeenteraad of gemeenteraden maken het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
  - number: '50.3'
    text: |-
      De openbare rechtspersoon oefent alle taken en bevoegdheden uit van het bevoegd gezag. Hij bezit
      rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
  - number: '50.4'
    text: 'De verordening, bedoeld in het eerste lid, voorziet in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
  - number: 50.4.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de openbare rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
  - number: 50.4.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de gemeenteraad of gemeenteraden en dat ten minste een derde gedeelte, doch
      geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn
      ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
  - number: 50.4.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
  - number: 50.4.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de desbetreffende gemeenteraad of gemeenteraden en de
      vaststelling van de jaarrekening na instemming van de desbetreffende gemeenteraad of gemeenteraden,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
  - number: 50.4.e
    text: de wijze waarop de gemeenteraad of gemeenteraden toezicht op het bestuur uitoefenen,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
  - number: 50.4.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
  - number: 50.4.g
    text: |-
      de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode ten
      minste 5 jaren bedraagt,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
  - number: '50.5'
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad of gemeenteraden verslag uit over de werkzaamheden, waarbij in
      ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
  - number: '50.6'
    text: |-
      De vergaderingen van het bestuur van de openbare rechtspersoon zijn openbaar, tenzij het bestuur anders beslist, op
      gronden, vermeld in de verordening.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
  - number: '50.7'
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      gemeenteraad of gemeenteraden de maatregelen die zij nodig achten om de continuïteit van het onderwijsproces te
      waarborgen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
  - number: '50.8'
    text: |-
      De gemeenteraad of gemeenteraden zijn in geval van ernstige taakverwaarlozing door het bestuur of functioneren
      in strijd met de wet bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de openbare rechtspersoon
      te ontbinden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
  - number: '50.9'
    text: |-
      Indien de school een raad van toezicht heeft, is het vierde lid niet van toepassing en voorziet de verordening,
      bedoeld in het eerste lid, onverminderd [artikel 28i][ref1], in ieder geval in een regeling omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28i
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28i
        paragraaf: '1'
        afdeling: '1'
  - number: 50.9.a
    text: de samenstelling, werkwijze en inrichting van de raad van toezicht van de openbare rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
  - number: 50.9.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de leden van de raad van toezicht, met dien
      verstande dat de leden van de raad van toezicht worden benoemd door de gemeenteraad of gemeenteraden en dat ten
      minste een derde gedeelte, doch geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders
      van de leerlingen die zijn ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
  - number: 50.9.c
    text: de termijn waarvoor de leden van de raad van toezicht worden benoemd,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
  - number: 50.9.d
    text: de vaststelling van de begroting en de jaarrekening, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
  - number: 50.9.e
    text: |-
      de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode ten
      minste 5 jaren bedraagt, met dien verstande dat in de regeling een overheersende invloed van de overheid in de raad
      van toezicht is verzekerd. Het vijfde, zesde en achtste lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel50
  - number: '51.1'
    text: |-
      Een gemeenteraad kan besluiten dat een of meer openbare scholen in de gemeente in stand worden gehouden door een
      stichting die zich ten doel stelt het in stand houden van een of meer openbare scholen, al dan niet te zamen met
      openbare scholen als bedoeld in de [Wet op het primair onderwijs][ref1] of openbare scholen als bedoeld in de
      [Wet op het voortgezet onderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0002399
  - number: '51.2'
    text: De gemeenteraad maakt het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: '51.3'
    text: |-
      Een stichting die een openbare school in stand houdt, wordt opgericht door een of meer gemeenten, al dan niet te
      zamen met een of meer privaatrechtelijke rechtspersonen met volledige rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: '51.4'
    text: |-
      Onverminderd [artikel 28j, eerste lid][ref1], is het statutaire doel van de stichting uitsluitend het geven van
      openbaar onderwijs overeenkomstig [artikel 49][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28j
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel49
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28j
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '49'
        afdeling: '2'
  - number: '51.5'
    text: De stichting oefent alle taken en bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: '51.6'
    text: 'Onverminderd het vierde lid voorzien de statuten in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: 51.6.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: 51.6.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de gemeenteraad of gemeenteraden en dat ten minste een derde gedeelte, doch
      geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn
      ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: 51.6.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: 51.6.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de desbetreffende gemeenteraad of gemeenteraden en de
      vaststelling van de jaarrekening na instemming van de desbetreffende gemeenteraad of gemeenteraden,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: 51.6.e
    text: de wijze waarop de gemeenteraad of gemeenteraden toezicht op het bestuur uitoefenen,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: 51.6.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: 51.6.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: 51.6.h
    text: de bevoegdheid de stichting te ontbinden,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: '51.7'
    text: |-
      De statuten van de stichting kunnen slechts worden gewijzigd na instemming van de desbetreffende gemeenteraad of
      gemeenteraden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: '51.8'
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad of gemeenteraden verslag uit over de werkzaamheden, waarbij in
      ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: '51.9'
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: '51.10'
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      gemeenteraad of gemeenteraden de maatregelen die zij nodig achten om de continuïteit van het onderwijsproces te
      waarborgen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: '51.11'
    text: |-
      De gemeenteraad of gemeenteraden zijn in geval van ernstige taakverwaarlozing door het bestuur of functioneren in
      strijd met de wet bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de stichting te ontbinden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: '51.12'
    text: |-
      Indien de school een raad van toezicht heeft, is het zesde lid niet van toepassing en voorzien de statuten,
      onverminderd [artikel 28i][ref1], in ieder geval in een regeling omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28i
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28i
        paragraaf: '1'
        afdeling: '1'
  - number: 51.12.a
    text: de samenstelling, werkwijze en inrichting van de raad van toezicht van de stichting,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: 51.12.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de leden van de raad van toezicht, met dien
      verstande dat de leden van de raad van toezicht worden benoemd door de gemeenteraad of gemeenteraden en dat ten
      minste een derde gedeelte, doch geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders
      van de leerlingen die zijn ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: 51.12.c
    text: de termijn waarvoor de leden van de raad van toezicht worden benoemd,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: 51.12.d
    text: de vaststelling van de begroting en de jaarrekening, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: 51.12.e
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: 51.12.h
    text: |-
      de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van
      de overheid in de raad van toezicht is verzekerd. Het achtste, negende en elfde lid zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel51
  - number: '52.1'
    text: |-
      De rechtspersoon die een openbare school in stand houdt, kan de instandhouding van die school overdragen aan
      een andere rechtspersoon die tot instandhouding van een openbare school bevoegd is. De overdracht geschiedt bij
      notariële akte.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel52
  - number: '52.2'
    text: |-
      Bij deze akte verbindt de overdragende rechtspersoon zich tevens de rechten ten aanzien van gebouwen en
      terreinen alsmede de roerende zaken over te dragen. Deze akte geldt tevens als akte van levering als bedoeld in
      [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: '52.3'
    text: |-
      In de akte wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en
      onder dezelfde voorwaarden als vermeld in de arbeidsovereenkomst, benoemt met ingang van de datum van overdracht.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel52
  - number: '52.4'
    text: |-
      Door overdracht met inachtneming van de voorgaande leden, treedt de verkrijgende rechtspersoon in alle uit de wet
      voortvloeiende rechten en verplichtingen die zijn rechtsvoorganger bezit in zijn hoedanigheid van bevoegd gezag,
      onverminderd hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel52
  - number: '53.1'
    text: |-
      Het bevoegd gezag stelt de leerlingen in de gelegenheid op de school, binnen de schooltijden, godsdienstonderwijs
      of levensbeschouwelijk vormingsonderwijs te ontvangen. Van de tijd daaraan te besteden, worden ten hoogste 40 uren
      per schooljaar meegeteld voor het aantal uren onderwijs dat de leerlingen krachtens [artikel 12, eerste lid][ref1],
      ten minste moeten ontvangen. Voor de leerlingen die dit onderwijs niet volgen, voorziet het bevoegd gezag in andere
      onderwijsactiviteiten op de school.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel12
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '12'
        paragraaf: '1'
        afdeling: '1'
  - number: '53.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op samenwerkingsscholen als bedoeld in [artikel 28j][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28j
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28j
        paragraaf: '1'
        afdeling: '1'
  - number: '54'
    text: |-
      Godsdienstonderwijs wordt gegeven door leraren daartoe aangewezen door kerkelijke gemeenten, plaatselijke kerken,
      of rechtspersonen met volledige rechtsbevoegdheid die zich blijkens hun statuten het geven van godsdienstonderwijs
      ten doel stellen. Levensbeschouwelijk vormingsonderwijs wordt gegeven door leraren daartoe aangewezen door
      volledige rechtsbevoegdheid bezittende organisaties op geestelijke grondslag. Het bevoegd gezag ziet erop toe
      dat dit onderwijs uitsluitend wordt gegeven door een leraar die blijkens een daartoe strekkende verklaring van de
      aanwijzende instantie:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel54
  - number: 54.a
    text: |-
      voldoet aan de bekwaamheidseisen die krachtens artikel 32a, eerste lid, voor het geven van dat onderwijs zijn
      vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel54
  - number: 54.b
    text: zijn bekwaamheid onderhoudt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel54
  - number: '55'
    text: |-
      In afwijking van [artikel 33a][ref1], zijn Gedeputeerde Staten van de desbetreffende provincie bevoegd de
      disciplinaire straf of de schorsing op te leggen dan wel het ontslag te verlenen, indien het betreft een directeur,
      een adjunct-directeur, of een ander lid van het onderwijzend personeel van een openbare school en deze tevens lid
      is van de raad van de gemeente die de school in stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel33a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 33a
        paragraaf: '2'
        afdeling: '1'
  - number: '57'
    text: |-
      Een bijzondere school wordt in stand gehouden door een rechtspersoon met volledige rechtsbevoegdheid die zich
      blijkens de statuten of reglementen het geven van onderwijs ten doel stelt zonder daarbij het maken van winst te
      beogen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel57
  - number: '58.1'
    text: |-
      De rechtspersoon die de school in stand houdt, kan de instandhouding van de school overdragen aan een andere
      rechtspersoon die voldoet aan [artikel 57][ref1]. De overdracht geschiedt bij notariële akte.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel57
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '57'
        afdeling: '3'
  - number: '58.2'
    text: |-
      Bij deze akte verbindt de overdragende rechtspersoon zich tevens de rechten ten aanzien van gebouwen en
      terreinen, alsmede de roerende zaken over te dragen. Deze akte geldt tevens als akte van levering bedoeld in
      [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: '58.3'
    text: |-
      In de akte wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en
      onder dezelfde voorwaarden als vermeld in de arbeidsovereenkomst, benoemt met ingang van de datum van overdracht.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel58
  - number: '58.4'
    text: |-
      Door de overdracht met inachtneming van de voorgaande leden, treedt de verkrijgende rechtspersoon in alle uit de
      wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de school, onverminderd
      hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel58
  - number: '58.5'
    text: |-
      Bij een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref1] van een rechtspersoon
      die een school in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande splitsende rechtspersoon de
      school in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van de school overgaat. In het
      laatste geval zijn het tweede tot en met vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
  - number: '59'
    text: |-
      Onverminderd de [artikelen 13][ref1], [14a][ref2], [14c][ref3], [14f][ref4], [15][ref5] en [16][ref6] kunnen de
      onderwijsactiviteiten godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs omvatten. Van de tijd daaraan
      te besteden, worden ten hoogste 120 uren per schooljaar meegeteld voor het aantal uren onderwijs dat de leerlingen
      krachtens [artikel 12, eerste lid][ref7], ten minste moeten ontvangen. Het geven van godsdienstonderwijs of
      levensbeschouwelijk vormingsonderwijs kan worden opgedragen aan een niet aan de school verbonden leraar.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel14a
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel14c
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel14f
      [ref5]: https://wetten.overheid.nl/BWBR0003549#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0003549#Artikel16
      [ref7]: https://wetten.overheid.nl/BWBR0003549#Artikel12
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '13'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 14a
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 14c
        paragraaf: '1'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: 14f
        paragraaf: '1'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0003549
        artikel: '15'
        paragraaf: '1'
        afdeling: '1'
      - id: ref6
        bwb_id: BWBR0003549
        artikel: '16'
        paragraaf: '1'
        afdeling: '1'
      - id: ref7
        bwb_id: BWBR0003549
        artikel: '12'
        paragraaf: '1'
        afdeling: '1'
  - number: '60.1'
    text: |-
      Indien binnen redelijke afstand van de woning van de leerling geen gelegenheid bestaat tot het volgen van
      openbaar onderwijs, mag de toelating tot de school niet worden geweigerd op grond van godsdienstige gezindheid
      of levensbeschouwing. Het voorgaande is niet van toepassing, indien de school uitsluitend bestemd is voor interne
      leerlingen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel60
  - number: '60.2'
    text: |-
      Leerlingen die ingevolge het eerste lid zijn toegelaten, kunnen niet worden verplicht godsdienstonderwijs of
      levensbeschouwelijk vormingsonderwijs te volgen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel60
  - number: '61.1'
    text: |-
      Indien het bevoegd gezag van een bijzondere school op grond van [artikel 36, derde lid][ref1], een ho-student de
      toegang weigert, deelt het bevoegd gezag deze beslissing, schriftelijk en met redenen omkleed, mede door toezending
      of uitreiking aan de ho-student, onverminderd het bepaalde in dat artikellid.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel36
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '36'
        paragraaf: '2'
        afdeling: '1'
  - number: '61.2'
    text: |-
      Indien het bevoegd gezag van een bijzondere school hetzij weigert een leerling toe te laten, hetzij een leerling
      verwijdert, op grond van [artikel 40, eerste lid en zesde lid][ref1], deelt het deze beslissing, schriftelijk
      en met redenen omkleed, mede door toezending of uitreiking aan de ouders. Daarbij wordt tevens de inhoud van het
      bepaalde in het derde lid, eerste volzin, vermeld. Voordat het bevoegd gezag van een bijzondere school op grond van
      [artikel 40, eerste lid en zesde lid][ref2], beslist tot verwijdering van een leerling, hoort het de ouders van de
      leerling, onverminderd het [zesde lid van dat artikel][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel40
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '40'
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '40'
        paragraaf: '3'
        afdeling: '1'
  - number: '61.3'
    text: |-
      Binnen 6 weken na de mededeling, bedoeld in het tweede lid, kunnen de ouders bij het bevoegd gezag schriftelijk hun
      bezwaren kenbaar maken tegen de beslissing. Het bevoegd gezag beslist binnen 4 weken na ontvangst van de bezwaren.
      Alvorens te beslissen hoort het bevoegd gezag de ouders.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel61
  - number: '61.4'
    text: 'Het bevoegd gezag beslist niet eerder op de bezwaren dan:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel61
  - number: 61.4.a
    text: na overleg met de inspecteur en desgewenst met andere deskundigen,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel61
  - number: 61.4.b
    text: nadat de ouders kennis hebben kunnen nemen van de op de beslissing betrekking hebbende adviezen of rapporten, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel61
  - number: 61.4.c
    text: de ouders opnieuw zijn gehoord.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel61
  - number: '61.5'
    text: |-
      Het bevoegd gezag van een bijzondere school kan beslissen een aanmelding voor toelating niet te behandelen,
      indien de verstrekte gegevens en bescheiden onvoldoende zijn voor de beoordeling van de aanmelding of voor
      de voorbereiding van de toelatingsbeslissing, mits de ouders dan wel, indien de leerling meerderjarig en
      handelingsbekwaam is, de leerling, de gelegenheid hebben gehad de aanmelding binnen een door het bevoegd gezag
      gestelde termijn aan te vullen. Een beslissing om de aanmelding niet te behandelen wordt aan de ouders dan wel de
      leerling bekendgemaakt binnen vier weken nadat de aanmelding is aangevuld of nadat de daarvoor gestelde termijn
      ongebruikt is verstreken. De termijn voor het nemen van de toelatingsbeslissing wordt opgeschort met ingang van de
      dag waarop het bevoegd gezag krachtens de eerste volzin de ouders dan wel de leerling uitnodigt de aanmelding aan
      te vullen, tot de dag waarop de aanmelding is aangevuld of de daarvoor gestelde termijn ongebruikt is verstreken.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel61
  - number: '66.1'
    text: |-
      In deze afdeling wordt verstaan onder: - *fusie:* een bestuurlijke of institutionele fusie,
        - *institutionele fusie:* een fusie waarbij een school ontstaat door samenvoeging van twee of meer scholen,
        - *bestuurlijke fusie:* een fusie waarbij een of meer rechtspersonen de instandhouding van een school, een
      school als bedoeld in de [Wet op het primair onderwijs][ref1] dan wel de [Wet op het voortgezet onderwijs][ref2]
      overdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0002399
  - number: '66.2'
    text: |-
      Het eerste lid, onderdeel c, is niet van toepassing op het instellen van een openbare rechtspersoon als bedoeld
      in [artikel 50, eerste lid, eerste volzin][ref1] of de instandhouding van een of meer openbare scholen door een
      stichting als bedoeld in [artikel 51, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel51
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '50'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '51'
        afdeling: '2'
  - number: 66a.1
    text: Fusies worden niet tot stand gebracht dan nadat daarvoor goedkeuring is verleend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66a
  - number: 66a.2
    text: |-
      De goedkeuring, bedoeld in het eerste lid, is niet vereist voor de bestuurlijke en institutionele fusie die
      noodzakelijk zijn voor de totstandkoming van de samenwerkingsschool, bedoeld in [artikel 28j, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28j
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28j
        paragraaf: '1'
        afdeling: '1'
  - number: 66b.1
    text: |-
      De rechtspersoon dient dan wel de rechtspersonen gezamenlijk dienen een aanvraag in bij Onze Minister voor het
      verkrijgen van de goedkeuring, bedoeld in [artikel 66a, eerste lid][ref1]. De aanvraag gaat vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel66a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 66a
        afdeling: '1'
  - number: 66b.1.a
    text: een door de rechtspersoon dan wel rechtspersonen opgestelde fusie-effectrapportage, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66b
  - number: 66b.1.b
    text: |-
      een schriftelijke verklaring van instemming met de fusie door de medezeggenschapsraden dan wel de
      gemeenschappelijke medezeggenschapsraden, dan wel
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66b
  - number: 66b.1.c
    text: |-
      de bindende uitspraak van de geschillencommissie, bedoeld in
      [artikel 32, derde lid, van de Wet medezeggenschap op scholen][ref1], dan wel de bindende uitspraak van de
      ondernemingskamer, bedoeld in [artikel 36, derde lid, van de Wet medezeggenschap op scholen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel36
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66b
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '36'
  - number: 66b.2
    text: 'De fusie-effectrapportage bevat ten minste een weergave van:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66b
  - number: 66b.2.a
    text: de motieven voor de fusie,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66b
  - number: 66b.2.b
    text: de alternatieven voor de fusie,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66b
  - number: 66b.2.c
    text: het tijdsbestek waarbinnen de fusie zal worden gerealiseerd,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66b
  - number: 66b.2.d
    text: de te bereiken doelen,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66b
  - number: 66b.2.e
    text: |-
      de effecten van de fusie op de keuzevrijheid, in het bijzonder de effecten van de fusie op de spreiding en omvang
      van de rechtspersonen en scholen in het voedingsgebied, de onderwijskundige en bestuurlijke diversiteit van het
      onderwijsaanbod in het voedingsgebied,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66b
  - number: 66b.2.f
    text: de kosten en baten van de fusie,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66b
  - number: 66b.2.g
    text: de gevolgen van de fusie voor het personeel en leerlingen, waaronder begrepen de gevolgen voor de voorzieningen,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66b
  - number: 66b.2.h
    text: de wijze waarop over de fusie wordt gecommuniceerd,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66b
  - number: 66b.2.i
    text: de wijze waarop de fusie wordt geëvalueerd, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66b
  - number: 66b.2.j
    text: |-
      een advies van burgemeester en wethouders van de betrokken gemeenten over de wenselijkheid van de voorgestelde
      fusie.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66b
  - number: 66b.3
    text: Bij ministeriële regeling wordt een modelformulier voor de fusie-effectrapportage vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66b
  - number: 66c.1
    text: |-
      Onze Minister kan goedkeuring onthouden indien als gevolg van de fusie de daadwerkelijke variatie van het
      onderwijsaanbod, in het bijzonder ten aanzien van de evenwichtige spreiding van de onderwijsvoorzieningen binnen
      het voedingsgebied, op significante wijze wordt belemmerd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66c
  - number: 66c.2
    text: |-
      Onze Minister laat zich ten aanzien van de goedkeuring, bedoeld in het eerste lid, adviseren door een
      onafhankelijke adviescommissie, tenzij de noodzaak daartoe ontbreekt. Bij ministeriële regeling wordt bepaald
      wanneer er geen sprake is van de noodzaak bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66c
  - number: 66c.3
    text: Onze Minister stelt beleidsregels vast omtrent de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66c
  - number: 66d.1
    text: |-
      Onze Minister besluit binnen 13 weken op een aanvraag als bedoeld in [artikel 66b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel66b
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66d
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 66b
        afdeling: '1'
  - number: 66d.2
    text: |-
      De termijn, bedoeld in het eerste lid, kan ten hoogste met 13 weken worden verlengd. Van deze verlenging wordt,
      binnen de 13 weken bedoeld in het eerste lid, mededeling gedaan aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66d
  - number: 66d.3
    text: |-
      Op het besluit bedoeld in het eerste lid is [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel66d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '67.1'
    text: |-
      De gemeenteraad is bevoegd uitsluitend in het belang van een doelmatige spreiding van de leerlingen over de
      openbare scholen, het grondgebied van de gemeente in schoolwijken te verdelen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel67
  - number: '67.2'
    text: |-
      Een besluit als bedoeld in het eerste lid, geldt voor ten minste 3 schooljaren, met dien verstande dat tussentijdse
      wijziging mogelijk is in geval van veranderingen in het scholenbestand. Burgemeester en wethouders zenden binnen 4
      weken nadat het besluit is genomen afschrift daarvan aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel67
  - number: '67.3'
    text: |-
      De toelating tot een openbare school geschiedt in overeenstemming met de vastgestelde schoolwijken, tenzij door
      de ouders van de leerling, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, door de leerling,
      schriftelijk aan het bevoegd gezag te kennen wordt gegeven dat toelating in een andere schoolwijk wordt gewenst.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel67
  - number: '68.1'
    text: |-
      Vertegenwoordigers van het speciaal onderwijs en het basisonderwijs kunnen ten behoeve van de scholen die zij
      vertegenwoordigen een overlegorgaan oprichten met het doel de samenwerking tussen die scholen te bevorderen ten
      aanzien van de toelating van leerlingen en de inrichting van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel68
  - number: '68.2'
    text: |-
      Met betrekking tot het voortgezet speciaal onderwijs als bedoeld in [artikel 2][ref1] en het voortgezet onderwijs
      is het eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '68.3'
    text: |-
      Aan de vertegenwoordiging van de aan het overleg deelnemende scholen zal in ieder geval een vertegenwoordiging van
      de ouders en van de leraren deelnemen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel68
  - number: '69.1'
    text: Op het personeel van een rechtspersoon met volledige rechtsbevoegdheid die
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel69
  - number: 69.1.a
    text: |-
      uitsluitend wordt bestuurd door een bevoegd gezag al dan niet met een of meer andere bevoegde gezagsorganen als
      bedoeld in deze wet, de [Wet op het primair onderwijs][ref1] of de [Wet op het voortgezet onderwijs][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0002399
  - number: 69.1.b
    text: |-
      zich blijkens de statuten dan wel de gemeenschappelijke regeling, bedoeld in de
      [Wet gemeenschappelijke regelingen][ref1], uitsluitend ten doel stelt om ten behoeve van scholen en andere
      onderwijsinstellingen die uit 's Rijks kas worden bekostigd, werkzaamheden te verrichten ter verzekering van
      de goede gang van het onderwijs met uitzondering van het leiden van de school, het geven van onderwijs en het
      verrichten van werkzaamheden op het terrein van de schoolbegeleiding,


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: 69.1.c
    text: niet het maken van winst beoogt,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel69
  - number: 69.1.d
    text: wordt gefinancierd met behulp van bijdragen van de bevoegde gezagsorganen waarvoor diensten worden verricht, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel69
  - number: 69.1.e
    text: Onze Minister heeft medegedeeld als rechtspersoon in de zin van dit artikel werkzaam te willen zijn,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel69
  - number: '69.2'
    text: |-
      Onder bevoegd gezag en bevoegde gezagsorganen in het eerste lid onderdeel a wordt mede verstaan burgemeester en
      wethouders.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel69
  - number: '69.4'
    text: |-
      De in het eerste lid onder a bedoelde bevoegde gezagsorganen delen Onze Minister mede dat zij het bestuur vormen
      van een rechtspersoon in de zin van dit artikel. Voorts verschaffen zij Onze Minister en de door hem aangewezen
      personen desgevraagd alle inlichtingen omtrent de rechtspersoon en zijn activiteiten. De in het eerste lid
      onder a bedoelde bevoegde gezagsorganen kunnen Onze Minister mededelen dat zij erin toestemmen dat de gevraagde
      inlichtingen rechtstreeks door het bestuur van de rechtspersoon zelf aan Onze Minister en de door hem aangewezen
      personen worden verschaft.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel69
  - number: '69.5'
    text: |-
      Burgemeester en wethouders en het bevoegd gezag dat deel uitmaakt van het bestuur van de rechtspersoon, zijn
      verplicht op de naleving van de in de voorgaande leden genoemde voorschriften toe te zien.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel69
  - number: '69.6'
    text: |-
      [Artikel 38][ref1] is van overeenkomstige toepassing ten aanzien van het personeel van de rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel38
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '38'
        paragraaf: '2'
        afdeling: '1'
  - number: '70.1'
    text: |-
      De openbare en de bijzondere scholen worden door het Rijk bekostigd volgens de bepalingen van deze titel met
      uitzondering van [afdeling 3][ref1]. Geen bekostiging vindt plaats indien groepen van leerlingen van verschillende
      scholen al dan niet van hetzelfde bevoegd gezag gezamenlijk onderwijs ontvangen, tenzij het betreft de uitvoering
      van een deel van het schoolplan op grond van [artikel 24][ref2]. De bedragen die de gemeente krachtens deze wet in
      aanvulling op de rijksbekostiging verstrekt, blijven ten laste van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Afdeling3
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel24
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0003549
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '24'
        paragraaf: '1'
        afdeling: '1'
  - number: '70.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven ter uitvoering van het eerste lid. Deze
      algemene maatregel van bestuur bevat in elk geval een regeling omtrent de termijnen binnen welke besluiten moeten
      worden genomen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel70
  - number: '70.3'
    text: 'De algemene maatregel van bestuur bedoeld in het tweede lid, bevat tevens:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel70
  - number: 70.3.a
    text: |-
      een regeling omtrent de betaling van de bedragen van de bekostiging voor de materiële voorzieningen ten behoeve van
      de instandhouding voortvloeiende uit het gebruik door een school van voorzieningen die voor meer dan een school of
      voor andere doeleinden zijn bestemd;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel70
  - number: 70.3.b
    text: |-
      een financiële regeling tussen het Rijk en de bevoegde gezagsorganen die personeel in dienst hebben dat niet door
      het Rijk wordt bekostigd ter zake van een korting op de bekostiging ter compensatie van de kosten van de voor dat
      personeel geldende rechtspositionele voorzieningen, voor zover deze ten laste van 's Rijks kas komen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel70
  - number: '70.4'
    text: |-
      De algemene maatregel van bestuur bedoeld in het tweede lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure
      bedoeld in de eerste 3 volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel70
  - number: '70.5'
    text: |-
      [Artikel 4:32 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de bekostiging van scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '71'
    text: |-
      Onze Minister kan onder nader te stellen voorwaarden aanvullende middelen ter beschikking stellen die niet strekken
      tot bekostiging van het onderwijs, bedoeld in deze wet, en de schoolbegeleiding ten behoeve daarvan, maar die
      direct of indirect dienstig zijn voor de uitvoering van het onderwijs of voor verhoging van de mogelijkheid tot
      deelname aan het onderwijs. Bij de toepassing van dit artikel zijn de [artikelen 4][ref1], [5][ref2], [9][ref3]
      en [10 van de Wet overige OCW-subsidies][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009458#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0009458#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0009458#Artikel10
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0009458
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0009458
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0009458
        artikel: '10'
  - number: 71c.1
    text: |-
      Het bevoegd gezag dat op zijn school, niet zijnde een instelling, onderwijs
      verzorgt aan leerlingen die zijn opgenomen in inrichtingen als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref1] en gesloten accommodaties als
      bedoeld in [artikel 6.2.2 van de Jeugdwet][ref2], wordt in aanmerking gebracht voor bekostiging op grond van
      [artikel 112][ref3] en [artikel 117, zesde lid][ref4], indien het bevoegd gezag met die inrichting of accommodatie
      een samenwerkingsovereenkomst heeft gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel112
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel71c
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '112'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
  - number: 71c.2
    text: |-
      Het bevoegd gezag dat op zijn school niet zijnde een instelling, onderwijs verzorgt aan leerlingen van
      een residentiële instelling wordt per vestiging in aanmerking gebracht voor bekostiging op grond van
      [artikel 112][ref1] en [artikel 117, zevende lid][ref2], indien het bevoegd gezag met die residentiële instelling
      een samenwerkingsovereenkomst heeft gesloten. Onder een residentiële instelling als bedoeld in de eerste volzin
      wordt verstaan een instelling voor gehandicaptenzorg, jeugdhulpverlening of jeugdgezondheidszorg niet zijnde een
      inrichting of accommodatie, bedoeld in het eerste lid, waarbij behandeling of opvang en onderwijs vanuit één plan
      noodzakelijk is vanwege de aard of de duur van de behandeling of opvang.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel71c
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '112'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
  - number: 71c.3
    text: |-
      Het bevoegd gezag doet Onze Minister binnen een maand na de totstandkoming van de overeenkomst dan wel de
      beëindiging ervan een afschrift toekomen van de overeenkomst dan wel deelt de datum waarop de overeenkomst is
      beëindigd mee.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel71c
  - number: 71d
    text: |-
      Voor de toepassing van de wet en de ter uitvoering daarvan vastgestelde voorschriften wordt onder het aantal
      leerlingen van een instelling, bedoeld in het [tweede lid van artikel 89][ref1], verstaan het aantal leerlingen
      van de hoofdvestiging en de nevenvestiging of nevenvestigingen van de instelling tezamen, tenzij in bedoelde
      voorschriften anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel89
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel71d
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '89'
        afdeling: '3'
  - number: '73.1'
    text: |-
      Voor de toepassing van deze titel zijn de voorschriften die betrekking hebben op bijzondere scholen, van
      overeenkomstige toepassing op openbare scholen die in stand worden gehouden door een stichting als bedoeld in
      [artikel 51][ref1] of een openbare rechtspersoon als bedoeld in [artikel 50][ref2], tenzij het tegendeel blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel50
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '51'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '50'
        afdeling: '2'
  - number: '73.2'
    text: |-
      Indien een openbare school in stand wordt gehouden door een stichting of een openbare rechtspersoon, wordt deze
      aangemerkt als een door de gemeente in stand gehouden openbare school voor de toepassing van [afdeling 2][ref1]
      en [afdeling 8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Afdeling8
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0003549
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
        afdeling: '8'
  - number: '74'
    text: |-
      In deze titel wordt onder «school» verstaan een school of afdeling als bedoeld in [artikel 8][ref1], tenzij het
      tegendeel blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel8
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '8'
        paragraaf: '1'
        afdeling: '1'
  - number: '75.1'
    text: |-
      De [artikelen 77 tot en met 88][ref1] zijn tot een bij de wet te bepalen datum niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel77
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '77'
        afdeling: '2'
  - number: '75.2'
    text: |-
      Tot een bij de wet te bepalen datum kan Onze Minister op aanvraag van het bevoegd gezag, onder door hem te stellen
      voorwaarden, een school voor bekostiging in aanmerking brengen indien:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel75
  - number: 75.2.a
    text: de school is gelegen in een gebied waarin sprake is van een uitzonderlijke bevolkingstoename,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel75
  - number: 75.2.b
    text: sprake is van een verandering van de plaats van vestiging van een reeds bekostigde school,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel75
  - number: 75.2.c
    text: sprake is van omzetting van een bekostigde bijzondere school in een gelijksoortige openbare school of omgekeerd,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel75
  - number: 75.2.d
    text: |-
      sprake is van omzetting van een bekostigde bijzondere school in een gelijksoortige bijzondere school van een andere
      richting,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel75
  - number: 75.2.e
    text: sprake is van uitbreiding van het onderwijs aan een school met onderwijs van een of meer andere richtingen,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel75
  - number: 75.2.f
    text: |-
      sprake is van voor bekostiging in aanmerking brengen van een samenwerkingsschool met inachtneming van
      [artikel 28j][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28j
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28j
        paragraaf: '1'
        afdeling: '1'
  - number: 75.2.g
    text: |-
      sprake is van stichting van scholen die overeenkomen met de scholen waaruit een opgeheven samenwerkingsschool is
      ontstaan, of
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel75
  - number: 75.2.h
    text: |-
      sprake is van uitbreiding van het onderwijs aan een school voor speciaal onderwijs met onderwijs voor voortgezet
      speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel75
  - number: '75.3'
    text: |-
      De aanvraag, is met redenen omkleed en gaat vergezeld van de gegevens, genoemd in [artikel 81, tweede lid][ref1].
      Indien sprake is van een situatie als bedoeld in het tweede lid, onder a tot en met e, willigt Onze Minister de
      aanvraag slechts in indien de school bij toepassing van [artikel 83, eerste en derde lid][ref2], op grond van
      het eerste lid van dat artikel in een door provinciale staten of Onze Minister vast te stellen plan van nieuwe
      scholen zou worden opgenomen. Indien sprake is van uitbreiding als bedoeld in het tweede lid, onder h, willigt
      Onze Minister de aanvraag slechts in indien de school bij toepassing van artikel 83, eerste, tweede en derde lid,
      op grond van het eerste lid dan wel het tweede lid van dat artikel in een door provinciale staten of Onze Minister
      vast te stellen plan van nieuwe scholen zou worden opgenomen. Indien sprake is van een situatie als bedoeld in het
      tweede lid, onder f, willigt Onze Minister de aanvraag slechts in indien de school bij toepassing van artikel 83,
      eerste en derde lid, op grond van het eerste lid van dat artikel in een door provinciale staten of Onze Minister
      vast te stellen plan van nieuwe scholen zou worden opgenomen, met dien verstande dat daarbij de leerlingaantallen
      als bedoeld in [artikel 147][ref3] en [artikel 148][ref4] worden toegepast. Indien sprake is van een situatie als
      bedoeld in het tweede lid, onder g, willigt Onze Minister de aanvraag slechts in indien de school bij toepassing
      van artikel 83, eerste, tweede en derde lid, op grond van het eerste dan wel het tweede lid van dat artikel in een
      door provinciale staten of Onze Minister vast te stellen plan van nieuwe scholen zou worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel83
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel147
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel148
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '81'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '83'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '147'
        afdeling: '8'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: '148'
        afdeling: '8'
  - number: '75.4'
    text: |-
      Een school die is opgenomen in een door Onze Minister goedgekeurd of vastgesteld plan van nieuwe scholen voor de
      jaren 1991, 1992, 1993 en 1994 komt voor bekostiging in aanmerking indien de school in dat plan is opgenomen met
      als jaar van aanvang van de bekostiging 1991 en het onderwijs voor 1 januari 1992 een aanvang heeft genomen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel75
  - number: '76'
    text: |-
      Indien beroep is ingesteld in verband met de plannen van nieuwe scholen voor de jaren 1986 tot en met
      1994 en op grond van de [artikelen 79, derde lid][ref1], [80, derde lid][ref2], [83, vijfde lid][ref3],
      [84, achtste lid][ref4], en [86, vierde lid][ref5], de uitspraak zou hebben geleid tot opneming van een school in
      het eerstvolgende plan, brengt Onze Minister deze school voor bekostiging in aanmerking in het eerste jaar van de
      planperiode waarop dat plan betrekking zou hebben gehad. Zodra de bekostiging van een school een aanvang kan nemen,
      beslist Onze Minister bij beschikking met ingang van welk tijdstip dit kan geschieden. De bekostiging kan na een
      beschikking van Onze Minister als bedoeld in de vorige volzin, slechts aanvangen per 1 augustus van een schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel83
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel84
      [ref5]: https://wetten.overheid.nl/BWBR0003549#Artikel86
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel76
