  - number: 178d.3
    text: |-
      De programma’s huisvestingsvoorzieningen die op grond van [artikel 93 van deze][ref1] wet zijn vastgesteld voor de
      jaren voorafgaand aan de inwerkingtreding van artikel II van de Wet van 7 mei 2014 houdende wijziging van de Wet op
      het primair onderwijs, de Wet op de expertisecentra en de Wet primair onderwijs BES in verband met de overheveling
      van taak en budget voor aanpassingen in onderwijshuisvesting van gemeente naar school (Stb. 175) worden volledig
      uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93
