  - number: 138.1.i
    text: |-
      het totaal van de ontvangsten, op grond van [artikel 128, tweede lid, tweede volzin][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel128
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '128'
