        artikel: '86'
        afdeling: '2'
  - number: '88.1'
    text: Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de uitvoering van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel88
  - number: '88.2'
    text: |-
      De algemene maatregel van bestuur bedoeld in het eerste lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure
      bedoeld in de eerste 3 volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel88
  - number: '89.1'
    text: |-
      De gemeenteraad draagt onderscheidenlijk burgemeester en wethouders dragen ten behoeve van de door de gemeente
      in stand gehouden scholen en ten behoeve van de niet door de gemeente in stand gehouden scholen zorg voor de
      voorzieningen in de huisvesting op het grondgebied van de gemeente overeenkomstig het bepaalde in deze afdeling.
      Hij behandelt onderscheidenlijk zij behandelen daarbij de door de gemeente in stand gehouden scholen en de niet
      door de gemeente in stand gehouden scholen op gelijke voet.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel89
  - number: '89.2'
    text: |-
      Voor de toepassing van deze afdeling worden onder een niet door de gemeente in stand gehouden school mede
      begrepen een op het grondgebied van de gemeente gelegen nevenvestiging als bedoeld in [artikel 76a][ref1] en
      [artikel 76b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel76a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel76b
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 76a
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 76b
        afdeling: '2'
  - number: '90.1'
    text: 'Voor de toepassing van deze afdeling worden onder voorzieningen in de huisvesting begrepen:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel90
  - number: 90.1.a
    text: 'voor blijvend onderscheidenlijk voor tijdelijk gebruik bestemde voorzieningen, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel90
  - number: 90.1.a.1°
    text: |-
      nieuwbouw, een bestaand gebouw of een gedeelte daarvan, verplaatsing van een bestaand gebouw of van een gedeelte
      daarvan, terreinen, alsmede eerste aanschaf van onderwijsleerpakketten en meubilair,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel90
  - number: 90.1.a.2°
    text: uitbreiding van de onder 1° bedoelde voorzieningen, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel90
  - number: 90.1.a.3°
    text: |-
      medegebruik van een ruimte die geschikt is voor het onderwijs, dan wel een bad voor watergewenning of
      bewegingstherapie;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel90
  - number: 90.1.b
    text: |-
      herstel van constructiefouten aan het gebouw, alsmede herstel en vervanging in verband met schade aan gebouw,
      onderwijsleerpakketten en meubilair in geval van bijzondere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel90
  - number: '90.2'
    text: |-
      Bij algemene maatregel van bestuur worden bruto vloeroppervlakten per gelijktijdig aanwezige leerling
      voorgeschreven die voorzieningen in de huisvesting ten minste dienen te bevatten. Deze oppervlakten kunnen per
      schoolsoort verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel90
  - number: '91.1'
    text: |-
      Burgemeester en wethouders stellen jaarlijks ten behoeve van het eerstvolgende jaar voor een door hen te bepalen
      tijdstip een bekostigingsplafond vast voor de bekostiging van de voorzieningen in de huisvesting voor:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel91
  - number: 91.1.a
    text: scholen,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel91
  - number: 91.1.b
    text: basisscholen,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel91
  - number: 91.1.c
    text: speciale scholen voor basisonderwijs, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel91
  - number: 91.1.d
    text: |-
      scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs, voor
      voorbereidend beroepsonderwijs en voor praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel91
  - number: '91.2'
    text: |-
      Het bekostigingsplafond wordt zodanig vastgesteld dat redelijkerwijs kan worden voorzien in de huisvesting van de
      in het eerste lid bedoelde scholen op het grondgebied van de gemeente.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel91
  - number: '92.1'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school dat een voorziening in de huisvesting
      wenst, dient een aanvraag voor opneming van die voorziening op het programma, bedoeld in [artikel 93][ref1], in bij
      burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '93'
        afdeling: '3'
  - number: '92.2'
    text: |-
      Burgemeester en wethouders kunnen ten aanzien van voorzieningen als bedoeld in [artikel 90][ref1] bekostiging
      verstrekken ter zake van de kosten van bouwvoorbereiding.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel90
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '90'
        afdeling: '3'
  - number: '92.3'
    text: |-
      Burgemeester en wethouders stellen vast, voor welk tijdstip de aanvraag wordt ingediend en aan welke voorwaarden
      deze dient te voldoen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel92
  - number: '92.4'
    text: Het derde lid is van overeenkomstige toepassing op de door de gemeente in stand gehouden scholen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel92
  - number: '93.1'
    text: |-
      Burgemeester en wethouders stellen, na overleg met de bevoegde gezagsorganen van de niet door de gemeente in stand
      gehouden scholen in de gemeente, jaarlijks ten behoeve van het onderwijs op het grondgebied van de gemeente voor
      een door hen te bepalen tijdstip een programma als bedoeld in het tweede lid vast. Het programma heeft betrekking
      op scholen als bedoeld in [artikel 91, eerste lid, onderdelen a tot en met d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel91
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '91'
        afdeling: '3'
  - number: '93.2'
    text: |-
      Het programma omvat de voorzieningen in de huisvesting, bedoeld in [artikel 90][ref1], die in het jaar na de
      vaststelling van het programma voor bekostiging in aanmerking zullen worden gebracht voor niet door de gemeente in
      stand gehouden scholen en voorzieningen die nodig zijn voor door de gemeente in stand gehouden scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel90
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '90'
        afdeling: '3'
  - number: '93.3'
    text: 'Burgemeester en wethouders nemen uitsluitend voorzieningen in de huisvesting in het programma op, voor zover:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel93
  - number: 93.3.a
    text: |-
      met de voorzieningen in het kalenderjaar volgend op het jaar van vaststelling van het programma redelijkerwijs een
      aanvang kan worden gemaakt dan wel de voorzieningen in het desbetreffende kalenderjaar kunnen worden gerealiseerd,
      en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel93
  - number: 93.3.b
    text: |-
      niet een van de weigeringsgronden, genoemd in [artikel 98][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel98
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '98'
        afdeling: '3'
  - number: '93.4'
    text: |-
      Indien het bekostigingsplafond, bedoeld in [artikel 91][ref1], niet toereikend is, worden die voorzieningen in het
      programma opgenomen die uit dat bekostigingsplafond kunnen worden bekostigd, waarbij de volgorde wordt bepaald met
      inachtneming van de criteria, bedoeld in [artikel 100, eerste lid, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel100
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '91'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '100'
        afdeling: '3'
  - number: '93.5'
    text: |-
      De beschikking van burgemeester en wethouders kan een gedeelte van de gewenste voorziening dan wel een andere
      voorziening dan gewenst omvatten.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel93
  - number: '93.6'
    text: |-
      Burgemeester en wethouders kunnen aan de opneming in het programma voorwaarden verbinden betreffende
      ingebruikneming of buitengebruikstelling van gebouwen of lokalen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel93
  - number: '93.7'
    text: |-
      Burgemeester en wethouders nemen bij de vaststelling van het programma de criteria, bedoeld in
      [artikel 100, eerste lid, onderdeel c][ref1], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel100
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '100'
        afdeling: '3'
  - number: '93.8'
    text: |-
      Binnen vier weken na de vaststelling van het programma treden burgemeester en wethouders met het bevoegd gezag
      in overleg over de wijze van uitvoering. Indien dit overleg niet tot overeenstemming leidt, delen burgemeester en
      wethouders het bevoegd gezag mede dat zij niet kunnen instemmen met de door het bevoegd gezag gewenste wijze van
      uitvoering.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel93
  - number: '93.9'
    text: |-
      Tijdens het in het eerste lid bedoelde overleg kunnen burgemeester en wethouders de Onderwijsraad verzoeken een
      advies uit te brengen over de vaststelling van het programma huisvestingsvoorzieningen in relatie tot de vrijheid
      van richting en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd
      dan wel uit eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht.
      Het advies wordt binnen vier weken uitgebracht aan burgemeester en wethouders. Het advies wordt bekend gemaakt
      tezamen met het programma.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel93
  - number: '94'
    text: |-
      Burgemeester en wethouders stellen gelijktijdig met het programma, bedoeld in [artikel 93][ref1], ten behoeve van
      het onderwijs op het grondgebied van de gemeente voor een door hen te bepalen tijdstip een overzicht vast van die
      voorzieningen die zijn aangevraagd dan wel die nodig zijn, die niet op het programma zijn opgenomen. Daarbij wordt
      aangegeven waarom de desbetreffende voorzieningen niet zijn opgenomen. Het overzicht wordt ter inzage gelegd. Het
      overzicht heeft betrekking op scholen als bedoeld in [artikel 91, eerste lid, onderdelen a tot en met d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel91
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '93'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '91'
        afdeling: '3'
  - number: '95'
    text: |-
      Burgemeester en wethouders stellen geen programma als bedoeld in [artikel 93][ref1] en geen overzicht als bedoeld
      in [artikel 94][ref2] vast, indien geen voorziening in de huisvesting nodig is noch een aanvraag is ingediend voor
      scholen als bedoeld in [artikel 91, eerste lid, onderdelen a tot en met d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel94
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel91
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '93'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '94'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '91'
        afdeling: '3'
  - number: '96.1'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school dat een voorziening in de huisvesting
      wenst die niet in het programma, bedoeld in [artikel 93][ref1], is opgenomen, maar die gelet op de voortgang van
      het onderwijs geen uitstel kan lijden, dient een aanvraag om bekostiging van die voorziening in bij burgemeester
      en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '93'
        afdeling: '3'
  - number: '96.2'
    text: |-
      De beschikking kan een gedeelte van de gewenste voorziening dan wel een andere voorziening dan gewenst omvatten.
      Burgemeester en wethouders wijzen de aanvraag af, indien:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel96
  - number: 96.2.a
    text: het besluit over de voorziening kan worden genomen bij de vaststelling van het eerstvolgende programma, of
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel96
  - number: 96.2.b
    text: |-
      een van de weigeringsgronden, genoemd in
      [artikel 98, eerste lid, onderdelen a tot en met d en f, en tweede lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel98
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '98'
        afdeling: '3'
  - number: '97.1'
    text: |-
      Burgemeester en wethouders beslissen bij beschikking met ingang van welk tijdstip in het jaar volgend op het jaar
      van vaststelling van het programma, bedoeld in [artikel 93][ref1], de bekostiging van een voorziening die in het
      programma is opgenomen, daadwerkelijk een aanvang kan nemen, onverminderd het bepaalde in [artikel 99][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel99
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '93'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '99'
        afdeling: '3'
  - number: '97.2'
    text: |-
      De aanspraak op bekostiging van een voorziening vervalt, indien niet binnen een in de verordening op basis
      van [artikel 100][ref1] te bepalen termijn na de beschikking, bedoeld in het eerste lid, met betrekking tot de
      voorziening een bouwopdracht is gegeven dan wel een koop-, huur- of erfpachtovereenkomst is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel100
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '100'
        afdeling: '3'
  - number: '98.1'
    text: 'Een voorziening in de huisvesting wordt slechts geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel98
  - number: 98.1.a
    text: |-
      de gewenste voorziening geen voorziening is in de zin van [artikel 90][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel90
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '90'
        afdeling: '3'
  - number: 98.1.b
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de aard en de omvang van de voorzieningen waarover
      de school reeds beschikt, voor zover deze uit de openbare kas zijn bekostigd, gelet op de normen, bedoeld in
      [artikel 100, eerste lid, onderdeel b][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel100
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '100'
        afdeling: '3'
  - number: 98.1.c
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de te verwachten ontwikkeling van het
      aantal leerlingen of onderwijskundige ontwikkelingen, zulks met inachtneming van het bepaalde in
      [artikel 100, eerste lid, onderdelen c en d][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel100
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '100'
        afdeling: '3'
  - number: 98.1.d
    text: |-
      op andere wijze dan wordt gewenst redelijkerwijs in de behoefte aan huisvesting kan worden voorzien, onder meer
      doordat binnen redelijke afstand van de gewenste plaats van de voorziening gebruik dan wel medegebruik mogelijk is,
      of een reeds voor bekostiging in aanmerking gebracht gebouw of deel daarvan beschikbaar komt,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel98
  - number: 98.1.e
    text: |-
      het bekostigingsplafond, bedoeld in [artikel 91][ref1], niet toereikend is voor de te verstrekken voorzieningen
      voor scholen als bedoeld in het eerste lid, onderdelen a tot en met d, van dat artikel, of


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel91
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '91'
        afdeling: '3'
  - number: 98.1.f
    text: de gewenste voorziening anders dan op grond van de onderdelen b tot en met d niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel98
  - number: '98.2'
    text: |-
      Een voorziening in de huisvesting kan tevens worden geweigerd, indien de voorziening als gevolg van het verwijtbaar
      nalaten van noodzakelijk onderhoud in een slechte bouwkundige staat verkeert of indien de voorziening nodig is voor
      herstel van schade die is veroorzaakt door schuld of toedoen van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel98
  - number: '99'
    text: |-
      Voorzieningen die in het programma, bedoeld in [artikel 93][ref1], zijn opgenomen, komen voor bekostiging in
      aanmerking, mits op het tijdstip dat daarvoor op grond van [artikel 97, eerste lid][ref2], is vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel97
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '93'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '97'
        afdeling: '3'
  - number: 99.a
    text: is voldaan aan de bij of krachtens de wet gestelde voorschriften, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel99
  - number: 99.b
    text: |-
      de feiten en omstandigheden waarin de school verkeert, ten opzichte van de feiten en omstandigheden ten tijde van
      de vaststelling van het programma niet ingrijpend zijn gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel99
  - number: '100.1'
    text: 'De gemeenteraad stelt bij verordening een regeling vast met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel100
  - number: 100.1.a
    text: |-
      de voorzieningen die ingevolge [artikel 90][ref1] voor bekostiging in aanmerking kunnen worden gebracht,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel90
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '90'
        afdeling: '3'
  - number: 100.1.b
    text: de oppervlakte en de indeling van schoolgebouwen,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel100
  - number: 100.1.c
    text: de urgentiecriteria,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel100
  - number: 100.1.d
    text: de prognosecriteria,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel100
  - number: 100.1.e
    text: |-
      de termijn bedoeld in [artikel 97][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel97
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '97'
        afdeling: '3'
  - number: 100.1.f
    text: de procedure met betrekking tot verhuur en het medegebruik van ruimten voor het onderwijs,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel100
  - number: 100.1.g
    text: |-
      de termijn gedurende welke een gebouw of terrein voor een school of nevenvestiging nog ten hoogste kan worden
      gebruikt bij toepassing van [artikel 108][ref1], alsmede de procedure in verband met een eventueel op te maken
      staat van onderhoud, en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel108
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '108'
        afdeling: '3'
  - number: 100.1.h
    text: |-
      de gegevens bedoeld in [artikel 110][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel110
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '110'
        afdeling: '3'
  - number: '100.2'
    text: |-
      De regeling wordt zodanig vastgesteld dat kan worden voldaan aan de redelijke eisen die het onderwijs aan de
      huisvesting van scholen in de gemeente stelt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel100
  - number: '100.3'
    text: |-
      De gemeenteraad stelt normen vast aan de hand waarvan de bedragen worden vastgesteld voor de toegekende
      voorzieningen in de huisvesting.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel100
  - number: '100.4'
    text: |-
      Burgemeester en wethouders betalen volgens door hen te stellen regels de bedragen aan de hand van de door de
      gemeenteraad gestelde normen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel100
  - number: '100.5'
    text: |-
      De gemeenteraad stelt de regeling, bedoeld in het eerste lid, dan wel een wijziging daarvan, niet vast dan nadat
      daarover op overeenstemming gericht overleg is gevoerd met door de bevoegde gezagsorganen van de niet door de
      gemeente in stand gehouden scholen in de gemeente aan te wijzen vertegenwoordigers. De gemeenteraad stelt daartoe
      een procedure vast.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel100
  - number: '100.6'
    text: |-
      Tijdens het in het vijfde lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit te
      brengen over de vaststelling of wijziging van de gemeentelijke verordening in relatie tot de vrijheid van richting
      en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd dan wel uit
      eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies
      wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekend gemaakt tezamen met de verordening
      of de wijziging daarvan.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel100
  - number: '101.1'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school geeft opdracht de voorziening in de
      huisvesting waartoe op grond van de [artikelen 93][ref1] en [96][ref2] kan worden overgegaan, tot stand te brengen
      met daartoe door de gemeente beschikbaar te stellen gelden, tenzij het met burgemeester en wethouders overeenkomt
      dat de gemeente deze voorziening tot stand brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel96
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '93'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '96'
        afdeling: '3'
  - number: '101.2'
    text: |-
      Indien de gemeente de voorziening in de huisvesting van een niet door de gemeente in stand gehouden school tot
      stand heeft gebracht, worden gebouw en terrein aan het bevoegd gezag in eigendom overgedragen, tenzij burgemeester
      en wethouders en het bevoegd gezag anders overeenkomen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel101
  - number: '101.3'
    text: |-
      Indien de voorziening in de huisvesting, bedoeld in het tweede lid, niet voldoet aan de eisen voor
      eigendomsoverdracht, geven burgemeester en wethouders deze aan het bevoegd gezag in gebruik.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel101
  - number: '102'
    text: |-
      Tenzij het bevoegd gezag van een niet door de gemeente in stand gehouden school dat aanspraak heeft op bekostiging
      van een voorziening in de huisvesting, met burgemeester en wethouders overeenkomt dat de gemeente deze voorziening
      tot stand brengt, behoeven de bouwplannen en de desbetreffende begrotingen de instemming van burgemeester en
      wethouders.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel102
  - number: '103'
    text: |-
      De gemeente brengt een voorziening in de huisvesting van een niet door de gemeente in stand gehouden school
      slechts tot stand, indien tussen burgemeester en wethouders en het bevoegd gezag overeenstemming bestaat over de
      bouwplannen en de wijze van uitvoering.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel103
  - number: '104.1'
    text: |-
      Het bevoegd gezag is verplicht het gebouw en terrein, alsmede de roerende zaken waarvoor bekostiging wordt genoten,
      behoorlijk te gebruiken en te onderhouden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel104
  - number: '104.2'
    text: |-
      Vervreemding door het bevoegd gezag van een niet door de gemeente in stand gehouden school anders dan op grond
      van [artikel 52][ref1] of [artikel 58][ref2], van gebouwen, terreinen en roerende zaken waarvoor bekostiging wordt
      genoten, of bezwaren met een zakelijk recht door het bevoegd gezag van een niet door de gemeente in stand gehouden
      school van zodanige gebouwen en terreinen, is zonder toestemming van burgemeester en wethouders nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel58
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '52'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '58'
        afdeling: '3'
  - number: '104.3'
    text: |-
      Het tweede lid is niet van toepassing ten aanzien van het recht van opstal ten behoeve van een door de gemeente te
      plaatsen tijdelijke voorziening in de huisvesting op grond die eigendom is van het bevoegd gezag van de betrokken
      school.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel104
  - number: '105.1'
    text: |-
      Burgemeester en wethouders zijn bevoegd een gedeelte van een gebouw of terrein dat tijdelijk of gedurende een
      gedeelte van de dag niet nodig zal zijn voor de daar gevestigde school, gedurende die tijd als huisvesting
      voor een andere school, voor ander uit de openbare kas bekostigd onderwijs niet zijnde speciaal onderwijs en
      voortgezet speciaal onderwijs, of voor educatie als bedoeld in de [Wet educatie en beroepsonderwijs][ref1] dan
      wel voor andere culturele, maatschappelijke of recreatieve doeleinden te bestemmen. Het voorgenomen gebruik
      dient zich te verdragen met het onderwijs aan de in het gebouw gevestigde school. Tevens zijn burgemeester
      en wethouders bevoegd ten behoeve van het onderwijs in lichamelijke oefening of expressie-activiteiten, dan
      wel ten behoeve van watergewenning of bewegingstherapie een gebouw of terrein dan wel een gedeelte daarvan
      dat tijdelijk gedurende gedeelten van de dag of in het geheel niet nodig zal zijn voor de daar gevestigde
      school, gedurende die tijd als huisvesting voor een andere school, voor ander uit de openbare kas bekostigd
      onderwijs niet zijnde speciaal onderwijs en voortgezet speciaal onderwijs, of voor educatie als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref2] dan wel voor andere culturele, maatschappelijke of recreatieve doeleinden
      te bestemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0007625
  - number: '105.2'
    text: |-
      Indien het gebouw of terrein in gebruik is voor een niet door de gemeente in stand gehouden school, plegen
      burgemeester en wethouders vooraf overleg met het bevoegd gezag en, voor zover van toepassing, ook met het bevoegd
      gezag van die school of nevenvestiging waarvoor de huisvesting is bestemd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel105
  - number: '106.1'
    text: |-
      Voor zover [artikel 105][ref1] geen toepassing vindt, kan het bevoegd gezag een gedeelte van een gebouw
      of terrein in gebruik geven ten behoeve van uit de openbare kas bekostigd onderwijs dan wel voor andere
      culturele, maatschappelijke of recreatieve doeleinden. Voor zover niet nodig voor uit de openbare kas
      bekostigd onderwijs, kan het bevoegd gezag een gedeelte van het gebouw of terrein verhuren aan een derde,
      voor zover het gehuurde niet bestemd zal zijn als woon- of bedrijfsruimte in de zin van de [vijfde][ref2] en
      [zesde afdeling van titel 4 van Boek 7 van het Burgerlijk Wetboek][ref3]. Indien het een niet door de gemeente in
      stand gehouden school betreft, is voor verhuur toestemming van burgemeester en wethouders vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Afdeling5
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Afdeling6
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '105'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0005290
        afdeling: '6'
  - number: '106.2'
    text: 'De ingebruikgeving of verhuur ingevolge het eerste lid eindigt:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel106
  - number: 106.2.a
    text: |-
      indien burgemeester en wethouders gebruik maken van hun bevoegdheid op grond van [artikel 105][ref1] zonder dat
      enige schadeplicht ontstaat, of


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel105
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '105'
        afdeling: '3'
  - number: 106.2.b
    text: indien het in gebruik gegeven dan wel verhuurde deel nodig is voor gebruik door de eigen school.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel106
  - number: '106.3'
    text: |-
      Ingebruikgeving of verhuur ingevolge het eerste lid geschiedt niet indien het voorgenomen gebruik zich niet
      verdraagt met het onderwijs aan de in het gebouw gevestigde school.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel106
  - number: '106.4'
    text: |-
      Op de ingebruikgeving en verhuur ingevolge het eerste lid is
      [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 230a
  - number: '106.5'
    text: |-
      Het zonder toestemming van burgemeester en wethouders verhuren van een gebouw of terrein door het bevoegd gezag
      van een niet door de gemeente in stand gehouden school alsmede elk met dit artikel strijdig beding opgenomen in een
      huurovereenkomst met betrekking tot schoolgebouwen, is nietig.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel106
  - number: '107'
    text: |-
      Voorzieningen aan gebouwen of terreinen in verband met verhuur krachtens de [artikelen 106][ref1] of [108][ref2]
      door het bevoegd gezag van een niet door de gemeente in stand gehouden school, komen niet ten laste van de
      gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel108
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '106'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '108'
        afdeling: '3'
  - number: '108.1'
    text: |-
      Burgemeester en wethouders en het bevoegd gezag van een niet door de gemeente in stand gehouden school dat eigenaar
      is van het gebouw en terrein, kunnen in een gezamenlijke akte verklaren dat het bevoegd gezag blijvend heeft
      opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor eigendomsoverdracht vatbaar gedeelte
      daarvan, voor de school te gebruiken.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel108
  - number: '108.2'
    text: |-
      Gedeputeerde staten kunnen in geval van een geschil omtrent de toepassing van het eerste lid desgevraagd besluiten
      dat het bevoegd gezag blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor
      eigendomsoverdracht vatbaar gedeelte daarvan, voor de school te gebruiken. De aanvraag om het besluit wordt gedaan
      door burgemeester en wethouders of door het bevoegd gezag van de school. Alvorens op de aanvraag te besluiten,
      horen gedeputeerde staten de wederpartij.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel108
  - number: '108.3'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school dat voornemens is gebouwen of terreinen,
      of een gedeelte daarvan, blijvend niet meer voor de school te gebruiken, doet hiervan onverwijld mededeling aan
      burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel108
  - number: '108.4'
    text: |-
      Zodra de in het eerste lid bedoelde akte door beide partijen is getekend, of het in het tweede lid bedoelde besluit
      van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van de rechter,
      inhoudende een besluit als bedoeld in het tweede lid eerste volzin, in de plaats treedt van het vernietigde
      besluit, wordt de akte, het onherroepelijk geworden besluit onderscheidenlijk de uitspraak, tenzij deze een gebouw
      betreft als bedoeld in artikel E 24 van de Overgangswet ISOVSO, ingeschreven in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1]. Door de inschrijving verkrijgt de gemeente
      de eigendom.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '108.5'
    text: |-
      Burgemeester en wethouders en het bevoegd gezag van een niet door de gemeente in stand gehouden school dat eigenaar
      is van het schoolgebouw, kunnen in een gezamenlijke akte verklaren dat een gedeelte van het gebouw dat niet vatbaar
      is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs nodig zal zijn.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel108
  - number: '108.6'
    text: |-
      Gedeputeerde staten kunnen in geval van een geschil omtrent de toepassing van het vijfde lid desgevraagd besluiten
      dat een gedeelte van het gebouw dat niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs
      nodig zal zijn. De aanvraag om het besluit wordt gedaan door burgemeester en wethouders of door het bevoegd gezag
      van de school. Alvorens op de aanvraag te besluiten, horen gedeputeerde staten de wederpartij.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel108
  - number: '108.7'
    text: |-
      Zodra de in het vijfde lid bedoelde akte door beide partijen is getekend, of het in het zesde lid bedoelde besluit
      van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van de rechter,
      inhoudende een beslissing als bedoeld in het zesde lid eerste volzin, in de plaats treedt van het vernietigde
      besluit, kan het bevoegd gezag van een niet door de gemeente in stand gehouden school het desbetreffende gedeelte
      van het gebouw met toestemming van burgemeester en wethouders verhuren.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel108
  - number: '108.8'
    text: |-
      De toestemming, bedoeld in het zevende lid, wordt verleend voor een tijdvak van ten hoogste 3 jaren. Op verzoek van
      het bevoegd gezag kan dit tijdvak telkens worden verlengd met een termijn van ten hoogste 3 jaren.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel108
  - number: '108.9'
    text: |-
      Op de verhuur, bedoeld in het zevende lid, is [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 230a
  - number: '109'
    text: |-
      In afwijking van deze afdeling kan de gemeenteraad besluiten dat jaarlijks een bedrag voor huisvestingskosten
      wordt betaald aan het bevoegd gezag van een niet door de gemeente in stand gehouden school voor zover die op het
      grondgebied van die gemeente in stand wordt gehouden. De gemeenteraad neemt het besluit in overeenstemming met het
      bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel109
  - number: '110'
    text: |-
      Het bevoegd gezag van een niet door de desbetreffende gemeente in stand gehouden school is gehouden aan de
      gemeenteraad onderscheidenlijk burgemeester en wethouders alle inlichtingen te verschaffen die de gemeenteraad
      onderscheidenlijk burgemeester en wethouders voor een adequate uitvoering van de bepalingen in deze afdeling
      noodzakelijk achten.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel110
  - number: '111.1'
    text: |-
      Bij ministeriële regeling worden voor de scholen eenmaal in de vijf jaar voor 1 oktober programma's van eisen
      vastgesteld die de grondslag vormen voor de bekostiging van de voorzieningen, bedoeld in het derde lid. De
      programma's van eisen gelden voor de vijf jaar volgend op het jaar waarin de vaststelling dient plaats te
      vinden. De programma's van eisen kunnen per schoolsoort, verdeeld als aangegeven in artikel 2, tweede lid, worden
      vastgesteld, al naar gelang het scholen voor speciaal onderwijs, scholen voor voortgezet speciaal onderwijs,
      scholen voor speciaal en voortgezet speciaal onderwijs, dan wel afdelingen betreft. Elk programma van eisen omvat:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel111
  - number: 111.1.a
    text: een omschrijving van de in aanmerking genomen componenten waaruit de voorzieningen zijn opgebouwd,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel111
  - number: 111.1.b
    text: de daarvoor noodzakelijk geachte bedragen en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel111
  - number: 111.1.c
    text: de wijze waarop de voor elke voorziening vast te stellen vergoeding wordt berekend.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel111
  - number: '111.2'
    text: |-
      De programma's van eisen voldoen aan de redelijke behoeften van een in normale omstandigheden verkerende school,
      onverminderd het vierde tot en met negende lid, en houden rekening met de bruto vloeroppervlakten die op grond van
      de algemene maatregel van bestuur, bedoeld in [artikel 90, tweede lid][ref1], worden voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel90
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '90'
        afdeling: '3'
  - number: '111.3'
    text: |-
      Programma's van eisen worden vastgesteld voor de materiële voorzieningen ten behoeve van de instandhouding van
      onderscheidenlijk:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel111
  - number: 111.3.a
    text: de scholen, daaronder niet begrepen de ruimten voor het onderwijs in lichamelijke oefening, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel111
  - number: 111.3.b
    text: de ruimten voor watergewenning of bewegingstherapie.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel111
  - number: '111.4'
    text: |-
      Bij ministeriële regeling worden jaarlijks voor 1 oktober de overeenkomstig het zesde lid, aangepaste bedragen
      vastgesteld. De aldus vastgestelde bedragen zijn de definitieve bedragen, geldend voor het jaar volgend op het jaar
      waarin de vaststelling dient plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel111
  - number: '111.5'
    text: |-
      Onze Minister kan bij de vaststelling van de ministeriële regeling, bedoeld in het vierde lid, wijzigingen in de
      programma's van eisen aanbrengen indien de toestand van 's Rijks schatkist of onderwijskundige ontwikkelingen dat
      noodzakelijk maken. Aan de eerste volzin kan slechts toepassing worden gegeven indien de ministeriële regeling,
      bedoeld in het vierde lid, voor de in dat lid bedoelde datum wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel111
  - number: '111.6'
    text: |-
      De aanpassing, bedoeld in het vierde lid, vindt plaats door de bedragen op basis van de werkelijke
      prijsontwikkeling voor het tweede jaar voorafgaand aan het jaar waarvoor de bedragen worden vastgesteld, aan te
      passen overeenkomstig de prijsmutatie van de netto materiële consumptie, zoals opgenomen in de Macro Economische
      Verkenning, die naar verwachting zal optreden tussen het prijsniveau in het eerstbedoelde jaar en het prijsniveau
      in het daaropvolgende jaar, alsmede aan te passen overeenkomstig de prijsmutatie van de netto materiële consumptie,
      zoals opgenomen in de Macro Economische Verkenning, die naar verwachting zal optreden tussen het prijsniveau in
      het jaar voorafgaand aan het jaar waarvoor de bedragen worden vastgesteld en het jaar waarvoor de bedragen worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel111
  - number: '111.7'
    text: |-
      De ministeriële regelingen, bedoeld in het eerste en vierde lid, worden binnen 4 weken na de vaststelling, bedoeld
      in het eerste en vierde lid, gezamenlijk bekendgemaakt in de Staatscourant, onder gelijktijdige overlegging aan
      de Tweede Kamer der Staten-Generaal. De ministeriële regelingen treden niet in werking dan nadat 4 weken zijn
      verstreken na het overleggen aan de Tweede Kamer en gedurende die termijn niet door of namens de Kamer de wens tot
      overleg over de ministeriële regelingen te kennen wordt gegeven dan wel met de Tweede Kamer overleg is gevoerd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel111
  - number: '111.8'
    text: |-
      Naar aanleiding van het overleg met de Tweede Kamer kunnen wijzigingen in de programma's van eisen en de
      wijzigingen daarvan, bedoeld in het vijfde lid, worden aangebracht. De wijzigingen worden bekendgemaakt in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel111
  - number: '112.1'
    text: |-
      De programma's van eisen, bedoeld in [artikel 111, derde lid onder a][ref1], worden onderverdeeld in programma's
      van eisen omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel111
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '111'
        afdeling: '4'
  - number: 112.1.a
    text: onderhoud van en aanpassingen aan het gebouw en het terrein,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel112
  - number: 112.1.b
    text: energie- en waterverbruik,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel112
  - number: 112.1.c
    text: publiekrechtelijke heffingen, met uitzondering van de belastingen ter zake van onroerende zaken,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel112
  - number: 112.1.d
    text: middelen, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel112
  - number: 112.1.e
    text: administratie, beheer en bestuur.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel112
  - number: '112.2'
    text: |-
      De programma's van eisen, bedoeld in [artikel 111, derde lid onder b][ref1], worden onderverdeeld in programma's
      van eisen omtrent de voorzieningen zoals onderscheiden in het eerste lid onder a, b en c, alsmede d voor zover het
      betreft onderhoud, vervanging en vernieuwing van onderwijsleerpakket en onderhoud meubilair.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel111
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '111'
        afdeling: '4'
  - number: '112.3'
    text: Bij de programma's van eisen, bedoeld in het tweede lid, wordt onderscheid gemaakt in vaste en variabele kosten.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel112
  - number: '113.1'
    text: |-
      Indien bijzondere ontwikkelingen in het speciaal onderwijs en het voortgezet speciaal onderwijs daartoe aanleiding
      geven, kunnen bij ministeriële regeling voorschriften worden vastgesteld omtrent het verstrekken van aanvullende
      bekostiging voor de materiële instandhouding.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel113
  - number: '113.2'
    text: |-
      Indien bijzondere bekostiging op grond van [artikel 120][ref1] wordt toegekend, kan Onze Minister bepalen dat, voor
      de periode waarvoor die bijzondere bekostiging wordt toegekend, tevens aanvullende bekostiging voor de materiële
      instandhouding wordt toegekend. Bij ministeriële regeling kunnen nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel120
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '120'
        afdeling: '5'
  - number: '113.3'
    text: |-
      Onze Minister kan in verband met de in het eerste lid en het tweede lid bedoelde bekostiging een
      bekostigingsplafond instellen. In dat geval worden bij ministeriële regeling regels omtrent de verdeling
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel113
  - number: '114'
    text: |-
      De instellingen ontvangen in aanvulling op de bekostiging, bedoeld in [artikel 111][ref1], jaarlijks een bij
      ministeriële regeling vast te stellen bekostiging in verband met de visuele handicap van de leerlingen van de
      instellingen, bedoeld in [artikel 8, eerste lid, tweede volzin][ref2], respectievelijk in verband met de auditieve
      en communicatieve handicap, bedoeld in artikel 8, eerste lid, derde volzin, en de vervulling van de taken, bedoeld
      in [artikel 9, onderdelen b en c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel111
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel9
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '111'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '8'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '9'
        paragraaf: '1'
        afdeling: '1'
  - number: '115.1'
    text: |-
      Burgemeester en wethouders stellen na overleg met de bevoegde gezagsorganen van de niet door de gemeente in stand
      gehouden scholen het aantal klokuren per week vast dat per groep leerlingen ten hoogste
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel115
  - number: 115.1.a
    text: ter beschikking wordt gesteld in een ruimte voor het onderwijs in lichamelijke oefening, of
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel115
  - number: 115.1.b
    text: |-
      voor bekostiging voor de materiële instandhouding van een ruimte voor het onderwijs in lichamelijke oefening in
      aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel115
  - number: '115.2'
    text: Het aantal klokuren, bedoeld in het eerste lid, wordt ten minste vastgesteld op 2,25.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel115
  - number: '115.3'
    text: Burgemeester en wethouders stellen de hoogte vast van
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel115
  - number: 115.3.a
    text: de bekostiging, bedoeld in het eerste lid, onder b, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel115
  - number: 115.3.b
    text: |-
      de bekostiging voor de vaste kosten van de materiële instandhouding van een ruimte voor lichamelijke oefening
      waarvan de eigendom berust bij het bevoegd gezag van een niet door de gemeente in stand gehouden school.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel115
  - number: '115.4'
    text: |-
      Bij de vaststelling, bedoeld in het derde lid, kan onderscheid worden gemaakt naar gelang de oppervlakte van de
      ruimte, alsmede tussen ruimten voor de exploitatie waarvan op grond van de onderwijswetgeving bekostiging wordt
      verleend en ruimten waarvoor dat niet het geval is.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel115
  - number: '116.1'
    text: |-
      Het bevoegd gezag dat, dan wel de gemeente die eigenaar is van een schoolgebouw, zorgt
      voor het deel van de materiële instandhouding waarop de programma's van eisen, bedoeld in
      [artikel 112, eerste lid onder a, b en c][ref1], betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel112
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '112'
        afdeling: '4'
  - number: '116.2'
    text: |-
      Het bevoegd gezag van een bijzondere school dat eigenaar is van een schoolgebouw, kan met burgemeester en
      wethouders overeenkomen dat de gemeente het in het eerste lid bedoelde deel van de materiële instandhouding geheel
      of gedeeltelijk verzorgt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel116
  - number: '116.3'
    text: |-
      Het bevoegd gezag, bedoeld in het eerste lid, kan met een bevoegd gezag dat gebruik maakt van de voorziening in
      de huisvesting van het eerstgenoemde bevoegd gezag, overeenkomen dat het laatstgenoemde bevoegd gezag het in het
      eerste lid bedoelde deel van de materiële instandhouding geheel of gedeeltelijk verzorgt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel116
  - number: '116.4'
    text: |-
      Ingeval de gemeente eigenaar is van het schoolgebouw, kan het bevoegd gezag van een bijzondere school met de
      gemeente overeenkomen dat het bevoegd gezag het in het eerste lid bedoelde deel van de materiële instandhouding
      geheel of gedeeltelijk verzorgt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel116
  - number: '116.5'
    text: |-
      Het bevoegd gezag zorgt voor het deel van de materiële instandhouding waarop de programma's van eisen, bedoeld in
      [artikel 112, eerste lid onder d en e][ref1], betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel112
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '112'
        afdeling: '4'
  - number: 116a.1
    text: |-
      Indien het totaal van de bedragen, bedoeld in
      [artikel 118, tiende lid, eerste volzin, en elfde lid, van de Wet op het primair onderwijs][ref1] de bekostiging
      voor materiële instandhouding van het samenwerkingsverband, bedoeld in artikel 118, achtste lid, van de Wet op het
      primair onderwijs overschrijdt, wordt het bedrag waarmee die bekostiging wordt overschreden door Onze Minister in
      mindering gebracht op de materiële bekostiging van alle scholen voor speciaal onderwijs en speciaal en voortgezet
      speciaal onderwijs behorend tot cluster 3 en 4 voor zover het betreft het daaraan verzorgde speciaal onderwijs,
      en scholen als bedoeld in de [Wet op het primair onderwijs][ref2], waarvan één of meer vestigingen zijn gelegen in
      het gebied van het samenwerkingsverband. Het bedrag dat in mindering wordt gebracht, wordt per school voor speciaal
      onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4 dan wel school als bedoeld
      in de Wet op het primair onderwijs, bepaald op basis van het leerlingenaantal van de desbetreffende vestiging of
      vestigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel116a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '118'
      - id: ref2
        bwb_id: BWBR0003420
  - number: 116a.2
    text: |-
      Indien het totaal van de bedragen, bedoeld in
      [artikel 89a, derde lid, eerste volzin, en vierde lid, van de Wet op het voortgezet onderwijs][ref1] de bekostiging
      voor de materiële instandhouding van het samenwerkingsverband, bedoeld in artikel 89a, eerste lid, van de Wet
      op het voortgezet onderwijs overschrijdt, wordt het bedrag waarmee die bekostiging wordt overschreden door Onze
      Minister in mindering gebracht op de materiële bekostiging van alle scholen voor voortgezet speciaal onderwijs en
      speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4 voor zover het betreft het daaraan verzorgde
      voortgezet speciaal onderwijs, en scholen als bedoeld in de [Wet op het voortgezet onderwijs][ref2], waarvan één
      of meer vestigingen zijn gelegen in het gebied van het samenwerkingsverband. Het bedrag dat in mindering wordt
      gebracht, wordt per school voor voortgezet speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend
      tot cluster 3 en 4 dan wel school als bedoeld in de Wet op het voortgezet onderwijs, bepaald op basis van het
      leerlingenaantal van de desbetreffende vestiging of vestigingen in het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel89a
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel116a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 89a
      - id: ref2
        bwb_id: BWBR0002399
  - number: 116a.3
    text: |-
      Indien het totaal van de bedragen, bedoeld in
      [artikel 89a1, vijfde en zesde lid, van de Wet op het voortgezet onderwijs][ref1], de bekostiging voor de materiële
      instandhouding van het samenwerkingsverband, bedoeld in artikel 89a1, eerste lid, van de Wet op het voortgezet
      onderwijs overschrijdt, wordt het bedrag waarmee die bekostiging wordt overschreden door Onze Minister in mindering
      gebracht op de materiële bekostiging van alle scholen voor voortgezet speciaal onderwijs en speciaal en voortgezet
      speciaal onderwijs behorend tot cluster 3 en 4 voor zover het betreft het daaraan verzorgde voortgezet speciaal
      onderwijs, en scholen als bedoeld in de [Wet op het voortgezet onderwijs][ref2], waarvan één of meer vestigingen
      zijn gelegen in het gebied van het samenwerkingsverband. Het bedrag dat in mindering wordt gebracht, wordt per
      school voor voortgezet speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en
      4 dan wel school als bedoeld in de Wet op het voortgezet onderwijs, bepaald op basis van het leerlingenaantal op
      1 oktober van de desbetreffende vestiging of vestigingen in het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel89a1
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel116a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 89a1
      - id: ref2
        bwb_id: BWBR0002399
  - number: '117.1'
    text: |-
      Voor de bekostiging van personeel wordt een bedrag per school en een bedrag per leerling toegekend, welke bedragen
      worden verhoogd met een bedrag dat wordt vermenigvuldigd met de gewogen gemiddelde leeftijd van de leraren van de
      school op 1 oktober van het voorafgaande schooljaar.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel117
  - number: '117.2'
    text: |-
      De bedragen, bedoeld in het eerste en derde lid, kunnen in elk geval verschillend worden vastgesteld voor
      leerlingen
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel117
  - number: 117.2.a
    text: in het speciaal onderwijs en het voortgezet speciaal onderwijs;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel117
  - number: 117.2.b
    text: jonger dan 8 jaar; en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel117
  - number: 117.2.c
    text: 8 jaar en ouder.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel117
  - number: '117.3'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald in welke gevallen en onder welke voorwaarden aanvullende
      bekostiging voor personeelskosten kan worden toegekend. In ieder geval wordt aan scholen, niet zijnde instellingen,
      aanvullende bekostiging toegekend voor schoolleiding en bestrijding van onderwijsachterstanden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel117
  - number: '117.4'
    text: |-
      Naast de bekostiging, bedoeld in het eerste lid, ontvangt de school, niet zijnde een instelling,
      per leerling een bedrag dat afhankelijk is van de in de toelaatbaarheidsverklaring, bedoeld in
      [artikel 40, tiende of twaalfde lid][ref1], opgenomen ondersteuningsbehoefte van de leerling en overeenkomt met
      één van de normbedragen die bij ministeriële regeling zijn vastgesteld en waarvan de berekeningswijze bij algemene
      maatregel van bestuur is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
        paragraaf: '3'
        afdeling: '1'
  - number: '117.5'
    text: |-
      De instellingen ontvangen in aanvulling op de bekostiging, bedoeld in het eerste lid, jaarlijks een bij
      ministeriële regeling vast te stellen bekostiging in verband met de visuele handicap van de leerlingen van de
      instellingen, bedoeld in [artikel 8, eerste lid, tweede volzin][ref1], respectievelijk in verband met de auditieve
      en communicatieve handicap, bedoeld in artikel 8, eerste lid, derde volzin, en de vervulling van de taken, bedoeld
      in [artikel 9, onderdelen b en c][ref2]. De bekostigingsbedragen, bedoeld in het eerste lid, en de eerste volzin
      zijn tezamen redelijkerwijs voldoende voor het leiden en beheren van de instelling, voor de taken, bedoeld in
      artikel 9, en voor de overige werkzaamheden die verband houden met het onderwijs aan de instelling. Het twaalfde
      lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel9
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '8'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '9'
        paragraaf: '1'
        afdeling: '1'
  - number: '117.6'
    text: |-
      Voor scholen, niet zijnde instellingen, waaraan onderwijs wordt gegeven aan leerlingen die zijn opgenomen in
      inrichtingen als bedoeld in [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref1] en
      gesloten accommodaties als bedoeld in [artikel 6.2.2 van de Jeugdwet][ref2], wordt tevens bekostiging vastgesteld
      die is gebaseerd op het aantal plaatsen in die inrichtingen en accommodaties.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
  - number: '117.7'
    text: |-
      Voor scholen, niet zijnde instellingen, waaraan onderwijs wordt gegeven aan leerlingen die zijn opgenomen
      in residentiële instellingen wordt bekostiging vastgesteld die is gebaseerd op het aantal leerlingen
      aan wie op de teldatum onderwijs wordt gegeven op basis van een samenwerkingsovereenkomst als bedoeld in
      [artikel 71c, tweede lid][ref1]. Voor elke leerling, bedoeld in de eerste volzin, ontvangt de school het voor die
      onderwijssoort vastgestelde normbedrag dat bij ministeriële regeling is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel71c
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 71c
        afdeling: '1'
  - number: '117.8'
    text: |-
      Bij ministeriële regeling worden het bedrag per school en per leerling, bedoeld in het eerste lid, de
      vermenigvuldigingsbedragen van de verhoging, bedoeld in het eerste lid, en de bekostigingsbedragen, bedoeld in het
      zesde en zevende lid, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel117
  - number: '117.9'
    text: |-
      Het bedrag per leerling, bedoeld in het achtste lid, is het product van een bij algemene maatregel van bestuur vast
      te stellen hoeveelheid formatie leraren per leerling vermenigvuldigd met een bedrag.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel117
  - number: '117.10'
    text: |-
      De verhoging, bedoeld in het achtste lid, is voor wat betreft het bedrag per leerling de uitkomst van de in het
      negende lid, onder a, bedoelde hoeveelheid formatie leraren per leerling, vermenigvuldigd met een bedrag.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel117
  - number: '117.11'
    text: |-
      Het bedrag per school, het vermenigvuldigingsbedrag van de verhoging voor wat betreft het bedrag per school, en de
      bekostigingsbedragen, bedoeld in het achtste lid, zijn de uitkomst van een bij de algemene maatregel van bestuur
      vast te stellen hoeveelheid formatie vermenigvuldigd met een bedrag.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel117
  - number: '117.12'
    text: |-
      Bij de vaststelling van de bedragen, bedoeld in het achtste lid, wordt in ieder geval rekening gehouden met de
      ontwikkeling van de geraamde landelijk gewogen gemiddelde leeftijd en de genormeerde gemiddelde personeelslast
      van het personeel van scholen en worden nadere regels vastgesteld met betrekking tot de wijze waarop de gewogen
      gemiddelde leeftijd en de geraamde gewogen gemiddelde leeftijd worden vastgesteld. Indien aanvullende bekostiging
      wordt toegekend voor een bepaalde categorie personeel kan in afwijking van de eerste volzin rekening worden
      gehouden met de genormeerde gemiddelde personeelslasten van die categorie personeel.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel117
  - number: '117.13'
    text: |-
      De bekostiging, bedoeld in het eerste, derde en vierde lid, voor wat betreft schoolleiding, is redelijkerwijs
      voldoende voor het leiden en beheren van de school, voor het geven van onderwijs aan de school en voor de overige
      werkzaamheden die verband houden met het onderwijs aan de school.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel117
  - number: '117.14'
    text: |-
      De algemene maatregel van bestuur, bedoeld in dit artikel, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsontwerp zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure,
      bedoeld in de vorige 3 volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel117
  - number: '118.1'
    text: |-
      Grondslag voor de berekening van het aantal leerlingen, bedoeld in [artikel 117][ref1], is het aantal leerlingen
      op 1 oktober van het voorafgaande schooljaar, dat door een samenwerkingsverband toelaatbaar is verklaard tot het
      speciaal dan wel voortgezet speciaal onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
  - number: '118.2'
    text: |-
      Voor het schooljaar waarin een nieuwe school wordt geopend en voor het daaropvolgende schooljaar wordt als
      grondslag genomen het aantal leerlingen op 1 oktober, volgende op de opening, dat door een samenwerkingsverband
      toelaatbaar is verklaard tot het speciaal dan wel voortgezet speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel118
  - number: '118.3'
    text: |-
      Indien een nieuwe school ontstaat als gevolg van beëindiging van het speciaal onderwijs of het voortgezet speciaal
      onderwijs van een school voor speciaal en voortgezet speciaal onderwijs, is voor de berekening van het aantal
      leerlingen, bedoeld in [artikel 117, eerste lid][ref1], het eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
  - number: '118.4'
    text: |-
      Voor de toepassing van [artikel 117][ref1] geldt in geval van samenvoeging van scholen, het aantal leerlingen van
      alle bij de samenvoeging betrokken scholen vastgesteld volgens het eerste lid, en de gewogen gemiddelde leeftijd
      van de leraren van alle bij de samenvoeging betrokken scholen op 1 oktober van het voorafgaande schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
  - number: 118a
    text: |-
      De Overgangswet ISOVSO zoals die luidde op 31 juli 1998 blijft van toepassing op aanspraken die op die datum op
      grond van artikel E 16, E 17 of E 18 van die wet bestaan, met dien verstande dat in artikel E 18 van die wet onder
      «een school voor speciaal onderwijs» tevens wordt begrepen: een speciale school voor basisonderwijs als bedoeld in
      de [Wet op het primair onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel118a
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: '119.1'
    text: |-
      Indien het totaal van de bedragen, bedoeld in
      [artikel 132, vierde lid, eerste volzin, en vijfde lid, van de Wet op het primair onderwijs][ref1] de
      personeelsbekostiging van het samenwerkingsverband, bedoeld in artikel 132, tweede lid, van de Wet op het primair
      onderwijs, overschrijdt, wordt het bedrag waarmee die bekostiging wordt overschreden door Onze Minister in
      mindering gebracht op de personele bekostiging van alle scholen voor speciaal onderwijs en speciaal en voortgezet
      speciaal onderwijs behorend tot cluster 3 en 4, voor zover het betreft het daaraan verzorgde speciaal onderwijs,
      en scholen als bedoeld in de [Wet op het primair onderwijs][ref2], waarvan één of meer vestigingen zijn gelegen in
      het gebied van het samenwerkingsverband. Het bedrag dat in mindering wordt gebracht, wordt per school voor speciaal
      onderwijs en speciaal of voortgezet speciaal onderwijs behorend tot cluster 3 en 4 dan wel school als bedoeld
      in de Wet op het primair onderwijs, bepaald op basis van het leerlingenaantal van de desbetreffende vestiging of
      vestigingen in het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '132'
      - id: ref2
        bwb_id: BWBR0003420
  - number: '119.2'
    text: |-
      Indien het totaal van de bedragen, bedoeld in
      [artikel 85b, derde lid, eerste volzin, en vierde lid, van de Wet op het voortgezet onderwijs][ref1] de
      personeelsbekostiging van het samenwerkingsverband, bedoeld in artikel 85b, eerste lid, van de Wet op het
      voortgezet onderwijs overschrijdt, wordt het bedrag waarmee die bekostiging wordt overschreden door Onze Minister
      in mindering gebracht op de personele bekostiging van alle scholen voor voortgezet speciaal onderwijs en speciaal
      en voortgezet speciaal onderwijs behorend tot cluster 3 en 4 voor zover het betreft het daaraan verzorgde
      voortgezet speciaal onderwijs, en scholen als bedoeld in de [Wet op het voortgezet onderwijs][ref2] waarvan één
      of meer vestigingen zijn gelegen in het gebied van het samenwerkingsverband. Het bedrag dat in mindering wordt
      gebracht, wordt per school voor voortgezet speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend
      tot cluster 3 en 4 dan wel school als bedoeld in de Wet op het voortgezet onderwijs, bepaald op basis van het
      leerlingenaantal van de desbetreffende vestiging of vestigingen in het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel85b
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 85b
      - id: ref2
        bwb_id: BWBR0002399
  - number: '119.3'
    text: |-
      Indien het totaal van de bedragen, bedoeld in
      [artikel 85b1, zesde en zevende lid, van de Wet op het voortgezet onderwijs][ref1] de personeelsbekostiging,
      bedoeld in artikel 85b1, eerste lid, van het samenwerkingsverband overschrijdt, wordt het bedrag waarmee die
      bekostiging wordt overschreden door Onze Minister in mindering gebracht op de personele bekostiging van alle
      scholen voor voortgezet speciaal onderwijs en speciaal en voortgezet speciaal onderwijs behorend tot cluster
      3 en 4 voor zover het betreft het daaraan verzorgde voortgezet speciaal onderwijs, en scholen als bedoeld in
      de [Wet op het voortgezet onderwijs][ref2] waarvan één of meer vestigingen zijn gelegen in het gebied van het
      samenwerkingsverband. Het bedrag dat in mindering wordt gebracht, wordt per school voor voortgezet speciaal
      onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4 dan wel school als bedoeld in
      de Wet op het voortgezet onderwijs, bepaald op basis van het leerlingenaantal op 1 oktober voorafgaand aan het
      jaar waarover de bekostiging plaatsvindt, van de desbetreffende vestiging of vestigingen in het gebied van het
      samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel85b1
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 85b1
      - id: ref2
        bwb_id: BWBR0002399
  - number: '120.1'
    text: |-
      Indien bijzondere ontwikkelingen in het speciaal onderwijs en het voortgezet speciaal onderwijs daartoe aanleiding
      geven, kunnen bij ministeriële regeling voorschriften worden vastgesteld omtrent het verstrekken van bijzondere
      bekostiging voor personeelskosten.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel120
  - number: '120.2'
    text: |-
      In verband met bijzondere omstandigheden kan Onze Minister op aanvraag van het bevoegd gezag van een school, niet
      zijnde een instelling, onder door hem op te leggen verplichtingen bijzondere bekostiging voor personeelskosten
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel120
  - number: '120.3'
    text: |-
      Een aanvraag als bedoeld in het tweede lid wordt ingediend ten hoogste vier maanden voorafgaand aan het schooljaar
      waarin de bijzondere omstandigheden zich zullen voordoen en niet later dan in het schooljaar waarin die bijzondere
      omstandigheden zich hebben voorgedaan. Onze Minister besluit binnen vier maanden na ontvangst van een in het tweede
      lid bedoelde aanvraag.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel120
  - number: '120.4'
    text: |-
      Onze Minister kan in verband met de in het eerste en tweede lid bedoelde bekostiging een bekostigingsplafond
      instellen. In dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel120
  - number: '121.1'
    text: |-
      Aan de school wordt in verband met de kosten van vervanging van personeel wegens voorschriften die zijn gegeven bij
      algemene maatregel van bestuur of bij ministeriële regeling en de kosten van werkloosheidsuitkeringen, suppleties
      inzake arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel
      anders dan op grond van de [Ziektewet][ref1] bekostiging verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '121.2'
    text: |-
      De in het eerste lid bedoelde bekostiging is verwerkt in de bedragen en in de vermenigvuldigingsbedragen van de
      verhoging, bedoeld in de [artikelen 117, vierde en tiende lid][ref1], en [120][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel120
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '120'
        afdeling: '5'
  - number: '124.1'
    text: |-
      Bij ministeriële regeling wordt de grondslag vastgesteld voor de omvang van de bekostiging voor personeels-
      en arbeidsmarktbeleid. De omvang van de bekostiging is in ieder geval afhankelijk of mede afhankelijk van de
      onderwijssoort, het aantal leerlingen op de teldatum, bedoeld in [artikel 118][ref1], en de samenstelling van
      het leerlingenbestand. Bij het vaststellen van de bekostiging wordt in ieder geval rekening gehouden met de
      ontwikkeling van de genormeerde gemiddelde personeelslasten van leraren.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel118
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '118'
        afdeling: '5'
  - number: '124.2'
    text: |-
      Met inachtneming van het eerste lid verstrekt het Rijk jaarlijks aan het bevoegd gezag van de openbare en
      bijzondere scholen bekostiging ten behoeve van personeels- en arbeidsmarktbeleid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel124
  - number: '127'
    text: |-
      De gemeente bekostigt aan het bevoegd gezag van een niet door de gemeente in stand gehouden school dat is
      onderworpen aan een of meer der in [artikel 220 van de Gemeentewet][ref1] (Stb. 1992, 96) bedoelde belastingen ter
      zake van onroerende zaken het bedrag dat is uitgegeven voor de belastingen met betrekking tot de in de gemeente
      gelegen gebouwen en terreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
  - number: '128.1'
    text: |-
      Behoudens het tweede lid, verstrekt het Rijk jaarlijks ten behoeve van de scholen, niet zijnde instellingen,
      aan het bevoegd gezag bekostiging ten behoeve van de materiële instandhouding waarop de programma's van eisen,
      bedoeld in [artikel 111, derde lid][ref1], betrekking hebben, waarbij voor het bevoegd gezag geldt dat indien
      toepassing is gegeven aan [artikel 116, tweede lid][ref2], dan wel indien geen overeenkomst als bedoeld in
      [artikel 116, derde of vierde lid][ref3] tot stand is gekomen, dit bevoegd gezag de bekostiging aan de gemeente dan
      wel aan het desbetreffende bevoegd gezag overdraagt voor zover deze de materiële instandhouding verzorgt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel111
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel116
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel116
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '111'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '116'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '116'
        afdeling: '4'
  - number: '128.2'
    text: |-
      Het Rijk verstrekt jaarlijks aan de provincie Fryslân bekostiging ten behoeve van de materiële instandhouding, voor
      zover het betreft het onderwijs in de Friese taal, bedoeld in [artikel 13, zesde lid][ref1]. De provincie Fryslân
      draagt zorg voor verdeling van de bekostiging over de betrokken scholen naar rato van het aantal leerlingen dat
      gebruik maakt van dat onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel13
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '13'
        paragraaf: '1'
        afdeling: '1'
  - number: '128.3'
    text: |-
      Grondslag voor de bekostiging van de in het eerste en tweede lid bedoelde kosten zijn de voor het desbetreffende
      jaar vastgestelde bedragen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel128
  - number: '128.4'
    text: |-
      Grondslag voor de bekostiging ten behoeve van de uitgaven voor de voorzieningen, bedoeld in [artikel 111][ref1],
      zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel111
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '111'
        afdeling: '4'
  - number: 128.4.a
    text: |-
      het aantal leerlingen op 1 oktober van het jaar voorafgaande aan het jaar waarover de bekostiging plaatsvindt dat
      door een samenwerkingsverband toelaatbaar is verklaard tot het speciaal dan wel voortgezet speciaal onderwijs, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel128
  - number: 128.4.b
    text: |-
      de omvang van de bekostiging, bedoeld in [artikel 117, achtste en tiende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
  - number: '128.5'
    text: |-
      Voor nieuwe scholen zijn gedurende de periode van 1 augustus tot 1 januari volgend op de opening, grondslag voor de
      bekostiging ten behoeve van de uitgaven voor de voorzieningen, bedoeld in [artikel 111][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel111
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '111'
        afdeling: '4'
  - number: 128.5.a
    text: |-
      het aantal leerlingen op 1 oktober in die periode dat door een samenwerkingsverband toelaatbaar is verklaard tot
      het speciaal dan wel voortgezet speciaal onderwijs, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel128
  - number: 128.5.b
    text: |-
      de omvang van de bekostiging, bedoeld in [artikel 117, tiende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
  - number: '128.6'
    text: |-
      Naast de bekostiging, bedoeld in het eerste lid, ontvangt de school, niet zijnde een instelling,
      per leerling een bedrag dat afhankelijk is van de in de toelaatbaarheidsverklaring, bedoeld in
      [artikel 40, tiende of twaalfde lid][ref1], opgenomen ondersteuningsbehoefte van de leerling en overeenkomt met één
      van de normbedragen die bij ministeriële regeling zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
        paragraaf: '3'
        afdeling: '1'
  - number: '128.7'
    text: |-
      Ingeval een samenvoeging plaatsvindt tussen 1 januari en 1 oktober daaropvolgend, wordt de bekostiging ten behoeve
      van de uitgaven voor de voorzieningen, bedoeld in [artikel 111][ref1], van alle bij de samenvoeging betrokken
      scholen gehandhaafd tot het einde van het jaar waarin de samenvoeging plaatsvond.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel111
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '111'
        afdeling: '4'
  - number: '128.8'
    text: |-
      Ingeval een samenvoeging plaatsvindt tussen 1 oktober en 1 januari daaropvolgend, wordt de bekostiging ten behoeve
      van de uitgaven voor de voorzieningen, bedoeld in [artikel 111][ref1], van alle bij de samenvoeging betrokken
      scholen gehandhaafd tot het einde van het jaar waarin de samenvoeging plaatsvond, en wordt de bekostiging van
      de uitgaven voor die voorzieningen voor het jaar volgend op de samenvoeging, gebaseerd op de bekostiging van de
      uitgaven voor die voorzieningen van alle bij de samenvoeging betrokken scholen, zoals die golden op 1 oktober van
      het jaar van samenvoeging.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel111
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '111'
        afdeling: '4'
  - number: '128.9'
    text: |-
      Het Rijk vergoedt jaarlijks aan het bevoegd gezag van de instellingen het totaalbedrag,
      bedoeld in [artikel 114][ref1], voor dat jaar. Voor zover de gemeente eigenaar is van de
      voorziening, verstrekt het bevoegd gezag van de instelling aan de gemeente de bedragen bedoeld in
      [artikel 114, derde lid, of zevende juncto derde lid][ref2], voor dat jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel114
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '114'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '114'
        afdeling: '4'
  - number: '129.1'
    text: |-
      Jaarlijks voor 1 maart kan Onze Minister verhoging van de bekostiging worden gevraagd, indien op grond van
      bijzondere omstandigheden van de school, niet zijnde een instelling, in dat jaar, het totale bedrag niet voldoende
      is voor de noodzakelijke uitgaven van de school, niet zijnde een instelling.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel129
  - number: '129.2'
    text: |-
      Een aanvraag als bedoeld in het eerste lid, kan slechts worden gedaan door het bevoegd gezag voor zover het
      betreft de materiële instandhouding waarop de programma's van eisen, bedoeld in [artikel 112, eerste lid][ref1],
      betrekking hebben. In afwijking van de vorige volzin kan ingeval [artikel 116, tweede, derde of vierde lid][ref2],
      is toegepast, het bevoegd gezag dat dan wel de gemeente die de materiële instandhouding geheel of gedeeltelijk
      verzorgt, de aanvraag indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel116
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '112'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '116'
        afdeling: '4'
  - number: '129.3'
    text: 'Onze Minister wijst de aanvraag in elk geval af indien:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel129
  - number: 129.3.a
    text: |-
      in het jaar waarvoor de programma's van eisen zijn vastgesteld, het totaal van de noodzakelijke uitgaven voor de
      materiële instandhouding van de school niet ten minste 5% meer zal bedragen dan het totaal van de uit 's Rijks kas
      daarvoor te verstrekken inkomsten,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel129
  - number: 129.3.b
    text: |-
      de bijzondere omstandigheden het gevolg zijn van een bij algemene maatregel van bestuur aan te geven omstandigheid
      of afwijking van de omvang van de componenten van de voorziening ten aanzien waarvan de bijzondere omstandigheden
      zouden bestaan,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel129
  - number: 129.3.c
    text: |-
      de bijzondere omstandigheid het gevolg is van een verschil tussen het prijsniveau in enig jaar en de op grond van
      [artikel 111][ref1] aangepaste bedragen, of


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel111
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '111'
        afdeling: '4'
  - number: 129.3.d
    text: |-
      het bevoegd gezag dat of de gemeente die de aanvraag heeft ingediend, niet aantoont dat het de bijzondere
      omstandigheden niet op enigerlei wijze had kunnen voorkomen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel129
  - number: '129.4'
    text: |-
      Een aanvraag als bedoeld in het eerste lid gaat vergezeld van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], van de juistheid van de gegevens die bij de
      aanvraag zijn gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '129.6'
    text: |-
      Onze Minister besluit binnen drie maanden. Indien technisch onderzoek zulks noodzakelijk maakt, kan Onze Minister
      deze termijn eenmaal met ten hoogste zes maanden verdagen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel129
  - number: '129.7'
    text: |-
      Onze Minister kan in verband met de in het eerste lid bedoelde verhoging een bekostigingsplafond instellen. In dat
      geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel129
  - number: '130.1'
    text: |-
      De gemeente verstrekt jaarlijks aan het bevoegd gezag van een niet door de gemeente in stand gehouden school dat
      eigenaar is van een ruimte voor het onderwijs in lichamelijke oefening op het grondgebied van de gemeente
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel130
  - number: 130.1.a
    text: |-
      een bekostigingsbedrag dat wordt bepaald ingevolge [artikel 115 en het derde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel115
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '115'
        afdeling: '4'
  - number: 130.1.b
    text: |-
      voor zover het gebruik van die ruimte ontoereikend is een overeenkomstig het tweede lid vast te stellen
      bekostigingsbedrag.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel130
  - number: '130.2'
    text: |-
      Voor zover geen ruimte ter beschikking is gesteld als bedoeld in [artikel 115, eerste lid onder a][ref1], verstrekt
      de gemeente jaarlijks aan het bevoegd gezag van een niet door de gemeente in stand gehouden school dat geen
      eigenaar is van een ruimte voor het onderwijs in lichamelijke oefening een bekostigingsbedrag dat wordt bepaald
      ingevolge [artikel 115, eerste lid onder b, en derde lid onder a, en het derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel115
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '115'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '115'
        afdeling: '4'
  - number: '130.3'
    text: |-
      Het aantal groepen leerlingen wordt voor scholen en instellingen berekend op een bij algemene maatregel van bestuur
      te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel130
  - number: '131.1'
    text: |-
      Met inachtneming van de [artikelen 117][ref1] en [118][ref2] verstrekt het Rijk jaarlijks aan het bevoegd gezag een
      bekostigingsbedrag ten behoeve van de personeelskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel118
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '117'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '118'
        afdeling: '5'
  - number: '131.2'
    text: |-
      In geval van het verstrekken van bijzondere bekostiging als bedoeld in [artikel 120][ref1] verstrekt het Rijk aan
      het desbetreffende bevoegd gezag het bedrag van deze bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel120
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '120'
        afdeling: '5'
  - number: '131.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot het betalen van het
      in de eerste volzin bedoelde bedrag.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel131
  - number: '131.4'
    text: |-
      Op het in het eerste en tweede lid bedoelde bedrag worden op een bij ministeriële regeling vast te stellen wijze
      in mindering gebracht de inkomsten die het bevoegd gezag direct of indirect geniet vanwege uitkeringen of toelagen
      waarop door het personeel aanspraak kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel131
  - number: '132.1'
    text: |-
      Op de bekostiging, bedoeld in [artikel 131][ref1], worden in mindering gebracht de salarissen, toelagen,
      uitkeringen of andere bijdragen waarop aanspraak wordt gemaakt door personeel dat is benoemd met voorbijgaan van
      personeel dat een gelijksoortige functie uitoefent of heeft uitgeoefend aan een school van het bevoegd gezag,
      voor zover laatstbedoeld personeel in het genot is van een bovenwettelijke werkloosheidsuitkering of een andere
      ontslaguitkering en direct aan die uitkering voorafgaand langer dan een jaar onafgebroken in dienst is geweest
      van het bevoegd gezag. Voor de toepassing van de eerste volzin wordt, indien het betreft openbaar onderwijs, onder
      «school van het bevoegd gezag» verstaan elke binnen de desbetreffende gemeente gelegen school, met uitzondering van
      de binnen die gemeente gelegen nevenvestigingen waarvan de hoofdvestiging in een andere gemeente is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel131
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '131'
        paragraaf: '3'
        afdeling: '7'
  - number: '132.2'
    text: |-
      Op de bekostiging worden eveneens in mindering gebracht de kosten van werkloosheidsuitkeringen, suppleties inzake
      arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan
      op grond van de [Ziektewet][ref1]. De eerste volzin is niet van toepassing, indien de rechtspersoon, bedoeld in
      [artikel 170][ref2], op een daartoe strekkend verzoek van het bevoegd gezag, voorafgaand aan het ontslag heeft
      ingestemd met het ten laste van die rechtspersoon brengen van de kosten van uitkeringen of suppleties als bedoeld
      in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel170
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '170'
        afdeling: '11'
  - number: '132.3'
    text: |-
      Het eerste lid is eveneens van toepassing, indien de benoeming heeft plaatsgevonden in aansluiting op een benoeming
      in tijdelijke dienst in dezelfde functie.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel132
  - number: '132.4'
    text: |-
      Met gewezen personeel dat in het genot is van wachtgeld of van een andere ontslaguitkering als bedoeld in het
      eerste lid wordt gelijk gesteld personeel aan wie op grond van het leerlingenverloop op of na 1 februari ontslag
      is of zal worden aangezegd, op grond van welk ontslag recht op wachtgeld of een andere ontslaguitkering zou kunnen
      ontstaan. In afwijking van de eerste volzin kan voor een periode tot uiterlijk de datum van ingang van het recht op
      wachtgeld of op een andere ontslaguitkering in een vacature worden voorzien zonder dat de vermindering, bedoeld in
      het eerste lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel132
  - number: '132.5'
    text: |-
      Bij ministeriële regeling wordt bepaald in welke gevallen geen vermindering als bedoeld in het eerste lid
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel132
  - number: '132.6'
    text: |-
      Onze Minister kan in andere gevallen dan voorzien in de ministeriële regeling bedoeld in het vijfde lid, wegens
      gewichtige redenen op aanvraag van het bevoegd gezag besluiten dat de vermindering van de bekostiging, bedoeld
      in het eerste lid, niet zal plaatsvinden. Onze Minister besluit binnen 4 maanden na ontvangst van de aanvraag.
      Uitsluitend op grond van door het bevoegd gezag aangevoerde bijzondere omstandigheden kan Onze Minister bepalen dat
      het besluit, bedoeld in de eerste volzin, betrekking heeft of mede betrekking heeft op een periode voorafgaand aan
      de datum waarop het bevoegd gezag de aanvraag heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel132
  - number: '133.1'
    text: |-
      [Artikel 132][ref1] is van overeenkomstige toepassing indien de rechtspersoon, bedoeld in de [artikelen 28b][ref2]
      en [69][ref3], personeel benoemt met voorbijgaan van gewezen personeel als bedoeld in artikel 132, eerste en
      vierde lid, van de rechtspersoon of van een bevoegd gezag waarvoor diensten worden verricht, dan wel niet handelt
      overeenkomstig het bepaalde in laatstgenoemde artikelleden. Van het gewezen personeel, bedoeld in de eerste volzin,
      is uitgezonderd het personeel van het bevoegd gezag waarvoor diensten worden verricht, waarvan de dienstbetrekking
      is beëindigd op een tijdstip dat meer dan twee jaar ligt voor de aanvang van de dienstverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel28b
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel69
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '132'
        paragraaf: '3'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 28b
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '69'
        afdeling: '2'
  - number: '133.2'
    text: |-
      In geval van toepassing van het eerste lid wordt het in mindering te brengen bedrag in gelijke mate verdeeld over
      de scholen waarvoor diensten worden verricht.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel133
  - number: '133.3'
    text: |-
      [Artikel 132][ref1] is eveneens van overeenkomstige toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel132
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '132'
        paragraaf: '3'
        afdeling: '7'
  - number: 133.3.a
    text: |-
      indien een bevoegd gezag waarvoor diensten worden verricht, personeel benoemt met voorbijgaan van gewezen personeel
      van de rechtspersoon, bedoeld in de [artikelen 28b][ref1] en [69][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel69
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28b
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '69'
        afdeling: '2'
  - number: 133.3.b
    text: |-
      indien een bevoegd gezag waarvoor geen diensten meer worden verricht, in het tijdvak van vijf jaar na beëindiging
      van de dienstverlening personeel benoemt met voorbijgaan van gewezen personeel als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel133
  - number: '134.1'
    text: |-
      Indien in een gemeente uitsluitend een of meer andere rechtspersonen dan de gemeente openbare scholen in stand
      houden waar een bepaalde soort speciaal onderwijs of een bepaalde soort voortgezet speciaal onderwijs wordt
      gegeven dan wel dergelijke scholen ontbreken en de gemeente uitgaven wil doen voor dat onderwijs welke niet
      door het Rijk worden bekostigd, stelt de gemeenteraad bij verordening een regeling daarvoor vast en zijn de
      [artikelen 136 tot en met 142][ref1] voor dat onderwijs niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel136
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '136'
        paragraaf: '5'
        afdeling: '7'
  - number: '134.2'
    text: |-
      De regeling, bedoeld in het eerste lid, maakt geen onderscheid tussen openbaar en bijzonder onderwijs en voorziet
      in een behandeling van scholen naar dezelfde maatstaf.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel134
  - number: '134.3'
    text: |-
      De regeling, bedoeld in het eerste lid, bevat in elk geval de voorzieningen die door het bevoegd gezag van een in
      de gemeente gelegen, niet door de gemeente in stand gehouden school kunnen worden aangevraagd en de procedure voor
      het doen van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel134
  - number: '134.4'
    text: |-
      De gemeenteraad kan besluiten dat burgemeester en wethouders de regeling, bedoeld in het eerste lid, tijdelijk
      kunnen aanvullen met nieuwe voorzieningen. De aanvulling wordt binnen 1 week aan de bevoegde gezagsorganen van de
      niet door de gemeente in stand gehouden scholen gezonden. Binnen 12 weken na de totstandkoming van de aanvulling
      wordt deze voorgelegd aan de gemeenteraad en besluit de gemeenteraad over de bekrachtiging ervan. Indien de
      gemeenteraad niet binnen 12 weken heeft besloten, wordt de aanvulling gelijkgesteld met een aanvulling die is
      bekrachtigd. Een afwijzing van de aanvulling door de gemeenteraad heeft geen gevolgen voor aanvragen waarop reeds
      is besloten of die reeds zijn ingediend en die voorzieningen betreffen waarop de aanvulling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel134
  - number: '134.6'
    text: |-
      Voor de toepassing van dit artikel wordt een nevenvestiging aangemerkt als een nevenvestiging die is gelegen in de
      gemeente van de hoofdvestiging. De gemeenteraad kan in de verordening, bedoeld in het eerste lid, aan burgemeester
      en wethouders de bevoegdheid verlenen om, met inachtneming van de in die verordening gestelde regels, te besluiten
      dat in de gemeente gelegen nevenvestigingen van scholen waarvan de hoofdvestiging is gelegen in een andere gemeente
      in afwijking van de eerste volzin in aanmerking komen voor een ofmeer van de in de regeling genoemde voorzieningen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel134
  - number: '134.7'
    text: |-
      Burgemeester en wethouders maken jaarlijks in een van overheidswege uitgegeven blad of een dag-, nieuws- of huis-
      aan-huisblad, dan wel op een andere geschikte wijze, een overzicht bekend van de op grond van de regeling, bedoeld
      in het eerste lid, toegekende voorzieningen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel134
  - number: '135.1'
    text: |-
      Indien een gemeente zelf een of meer openbare scholen in stand houdt en zij uitgaven wil doen voor het onderwijs
      welke niet door het Rijk worden bekostigd, kan de gemeenteraad daarvoor bij verordening een regeling vaststellen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel135
  - number: '135.2'
    text: |-
      [Artikel 134, tweede tot en met zevende lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel134
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '134'
        paragraaf: '4'
        afdeling: '7'
  - number: '136.1'
    text: |-
      Indien een gemeente ten behoeve van een of meer door haar in stand gehouden scholen meer uitgaven doet voor
      het personeel en de materiële instandhouding dan door het Rijk worden bekostigd, wordt met inachtneming van
      de [artikelen 136 tot en met 142][ref1] aan het bevoegd gezag van de in die gemeente gevestigde niet door de
      gemeente in stand gehouden scholen om de vijf jaar een overschrijdingsbedrag verstrekt. Voor de toepassing van de
      eerste volzin worden ontvangsten, op grond van [artikel 128, tweede lid, tweede volzin][ref2], gelijk gesteld met
      ontvangsten van het Rijk. Indien een gemeente vanaf een tijdstip binnen een periode van vijf jaar als bedoeld in de
      eerste volzin geen school in stand houdt, wordt het overschrijdingsbedrag in afwijking van die volzin uiterlijk 31
      december van het kalenderjaar dat volgt op dat tijdstip waarop de gemeente niet langer een school in stand houdt,
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel136
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel128
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '136'
        paragraaf: '5'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '128'
        paragraaf: '2'
        afdeling: '7'
  - number: '136.2'
    text: |-
      Voor de toepassing van de [artikelen 136 tot en met 142][ref1] worden uitgaven ten behoeve van een nevenvestiging
      aangemerkt als uitgaven ten behoeve van de hoofdvestiging van de school waaraan de nevenvestiging is
      verbonden. Indien ten behoeve van een school of nevenvestiging uitgaven worden gedaan door meer dan één
      gemeente, worden deze uitgaven aangemerkt als uitgaven van de gemeente op wier grondgebied de hoofdvestiging
      is gelegen. In het geval, bedoeld in de vorige volzin, worden de besluiten ingevolge het vierde lid en de
      [artikelen 137 tot en met 142][ref2] genomen door burgemeester en wethouders van laatstbedoelde gemeente en hebben
      deze mede betrekking op de uitgaven van de andere gemeente of gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel136
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel137
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '136'
        paragraaf: '5'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '137'
        paragraaf: '5'
        afdeling: '7'
  - number: '136.3'
    text: |-
      Voor de toepassing van de [artikelen 136 tot en met 142][ref1] wordt een nevenvestiging in een andere gemeente
      dan waarin de hoofdvestiging is gelegen, aangemerkt als een nevenvestiging die is gelegen in de gemeente van de
      hoofdvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel136
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '136'
        paragraaf: '5'
        afdeling: '7'
  - number: '136.4'
    text: |-
      Burgemeester en wethouders kunnen in overeenstemming met het bevoegd gezag van een niet door de gemeente in stand
      gehouden school besluiten dat met betrekking tot een of meer scholen van dat bevoegd gezag uitgaven die de gemeente
      doet ten behoeve van een door haar in stand gehouden school buiten beschouwing worden gelaten bij het vaststellen
      van de bedragen, bedoeld in de [artikelen 137][ref1] en [138][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel138
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '137'
        paragraaf: '5'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '138'
        paragraaf: '5'
        afdeling: '7'
  - number: '137.1'
    text: |-
      Burgemeester en wethouders stellen jaarlijks vast in welke mate zij ten behoeve van de door de gemeente in stand
      gehouden scholen meer dan wel minder uitgaven zullen doen voor het personeel en de materiële instandhouding dan
      door het Rijk worden bekostigd. Deze vaststelling geschiedt voor het komende begrotingsjaar en het resterende deel
      van het vijfjarig tijdvak, bedoeld in [artikel 136, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel136
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '136'
        paragraaf: '5'
        afdeling: '7'
  - number: '137.2'
    text: |-
      Indien voor het komende begrotingsjaar meer uitgaven zullen worden gedaan voor het personeel en de materiële
      instandhouding dan door het Rijk worden bekostigd, verlenen burgemeester en wethouders in dat begrotingsjaar
      aan het bevoegd gezag van de niet door de gemeente in stand gehouden scholen in de gemeente een voorschot op
      het te verwachten overschrijdingsbedrag, bedoeld in [artikel 136, eerste lid][ref1]. Indien uit het besluit
      van burgemeester en wethouders, bedoeld in het eerste lid, blijkt dat de hiervoor bedoelde meer-uitgaven in de
      resterende jaren van het vijfjarig tijdvak geheel of ten dele worden gecompenseerd door minder uitgaven, wordt
      hiermee rekening gehouden bij de bepaling van de hoogte van het voorschot.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel136
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '136'
        paragraaf: '5'
        afdeling: '7'
  - number: '137.3'
    text: |-
      Indien uit de jaarlijkse voorlopige vaststelling van de bedragen, bedoeld in [artikel 138, eerste lid][ref1],
      blijkt dat, in afwijking van hetgeen is vastgesteld bij het besluit van burgemeester en wethouders, bedoeld in
      het eerste lid, meer uitgaven zijn gedaan voor personeel en materiële instandhouding dan door het Rijk worden
      bekostigd, verlenen burgemeester en wethouders alsnog een voorschot aan het bevoegd gezag van de niet door de
      gemeente in stand gehouden scholen in de gemeente. Bij de bepaling van de hoogte van het voorschot is de tweede
      volzin van het tweede lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel138
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '138'
        paragraaf: '5'
        afdeling: '7'
  - number: '138.1'
    text: |-
      Indien een gemeente een of meer scholen in stand houdt, stellen burgemeester en wethouders onderscheiden per
      schoolsoort, alsmede al naar gelang het speciaal onderwijs, dan wel voortgezet speciaal onderwijs betreft,
      jaarlijks voorlopig vast:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel138
  - number: 138.1.a
    text: het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van personeelskosten,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel138
  - number: 138.1.b
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van personeels- en
      arbeidsmarktbeleid als bedoeld in [artikel 124][ref1] en ten behoeve van schoolbegeleiding,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel124
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '124'
        afdeling: '6'
  - number: 138.1.c
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de materiële
      instandhouding,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel138
  - number: 138.1.d
    text: |-
      het totaal van de ontvangsten, bedoeld in [artikel 131][ref1], in het voorafgaande kalenderjaar,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel131
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '131'
        paragraaf: '3'
        afdeling: '7'
  - number: 138.1.e
    text: |-
      het totaal van de ontvangsten dat is gebaseerd op de bedragen die krachtens [artikel 124, tweede lid][ref1], ten
      behoeve van personeels- en arbeidsmarktbeleid en die ten behoeve van schoolbegeleiding voor het kalenderjaar zijn
      vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel124
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '124'
        afdeling: '6'
  - number: 138.1.f
    text: |-
      het totaal van de ontvangsten dat is gebaseerd op de bedragen die krachtens [artikel 111][ref1] voor de
      voorzieningen voor de materiële instandhouding voor dat kalenderjaar zijn vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel111
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel138
    references:
      - id: ref1
