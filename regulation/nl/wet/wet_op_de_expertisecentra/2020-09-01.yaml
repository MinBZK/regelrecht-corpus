  - number: 138.1.h
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de instandhouding
      van een rechtspersoon als bedoeld in [artikel 69][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel69
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '69'
