  - number: '171.2'
    text: 'In geval van toepassing van het eerste lid wordt bij algemene maatregel van bestuur in elk geval bepaald:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel171
  - number: 171.2.a
    text: het doel van het experiment,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel171
  - number: 171.2.b
    text: op welke wijze van welke in het eerste lid bedoelde voorschriften wordt afgeweken,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel171
  - number: 171.2.c
    text: de duur van het experiment, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel171
  - number: 171.2.d
    text: op welke wijze en aan de hand van welke criteria de met het experiment beoogde effecten worden geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel171
  - number: '171.3'
    text: Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van een experiment.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel171
  - number: '171.4'
    text: |-
      Een experiment duurt ten hoogste zes jaar, tenzij een langere duur gezien de bijzondere aard van het experiment
      noodzakelijk is. Alsdan wordt de duur van het experiment op ten hoogste acht jaar bepaald. Indien een voorstel
      van wet is ingediend bij de Staten-Generaal om het experiment om te zetten in een structurele wettelijke regeling,
      voordat een experiment is afgelopen, kan Onze Minister het experiment verlengen tot het tijdstip waarop het
      wetsvoorstel tot wet is verheven en in werking treedt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel171
  - number: '171.5'
    text: |-
      Onze Minister zendt drie maanden voor het einde van de werkingsduur van een algemene maatregel van bestuur als
      bedoeld in het eerste lid aan de Staten-Generaal, een verslag over de doeltreffendheid en de effecten van het
      experiment in de praktijk, evenals een standpunt over de voortzetting van die algemene maatregel van bestuur,
      anders dan een voortzetting als experiment.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel171
  - number: '171.6'
    text: |-
      In verband met een experiment als bedoeld in het eerste lid, kan bij algemene maatregel van bestuur eveneens bij
      wijze van experiment worden afgeweken van [artikel 1 van de Leerplichtwet 1969][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
  - number: '171.7'
    text: |-
      Dit artikel is van overeenkomstige toepassing op een samenwerkingsverband van een school
      met een school of instelling als bedoeld in [artikel 1][ref1], een school als bedoeld in de
      [Wet op het primair onderwijs][ref2], of een school als bedoeld in de [Wet op het voortgezet onderwijs][ref3].
      Bij samenwerking met een school of instelling kan voor die school of instelling respectievelijk worden
      afgeweken van [hoofdstuk I, titel I, artikelen 1][ref4] en [2][ref5], [titel II, afdeling 1][ref6] en
      [titel IV, afdeling 4 tot en met 7][ref7] en [afdeling 8, paragrafen 2][ref8], [3][ref9], [6][ref10]
      en [7, van de Wet op het primair onderwijs][ref11], en [titel II, afdeling I, hoofdstuk I][ref12] en
      [titel III, afdeling II van de Wet op het voortgezet onderwijs][ref13]. Bij de algemene maatregel van bestuur,
      bedoeld in het tweede lid, wordt geregeld welke bij of krachtens de wet, de Wet op het primair onderwijs, of de
      Wet op het voortgezet onderwijs vastgestelde voorschriften van toepassing of van overeenkomstige toepassing zijn op
      de samenwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003420
      [ref3]: https://wetten.overheid.nl/BWBR0002399
