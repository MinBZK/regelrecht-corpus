  - number: '142'
    text: |-
      Grondslag voor de berekening van het aantal leerlingen, bedoeld in [artikel 139, vierde en vijfde lid][ref1], is
      het aantal leerlingen op 1 oktober voorafgaande aan het desbetreffende kalenderjaar. Voor het kalenderjaar waarin
      een nieuw opgerichte school wordt geopend, wordt als grondslag genomen het aantal leerlingen op de laatste dag van
      de tweede maand volgende op die der opening.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel139
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel142
    references:
