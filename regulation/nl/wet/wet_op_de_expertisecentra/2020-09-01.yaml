        artikel: '139'
        paragraaf: '5'
        afdeling: '7'
  - number: '143.1'
    text: |-
      Het bevoegd gezag wendt het totaal van de in de [artikelen 124][ref1], [128][ref2] en [131][ref3] bedoelde bedragen
      voor de kosten voor de materiële instandhouding en de personeelskosten uitsluitend aan voor kosten voor materiële
      instandhouding, personeelskosten van de school, personeelskosten in verband met benoeming of tewerkstelling zonder
      benoeming van personeel, bedoeld in [artikel 29, vijfde lid][ref4], dan wel mede voor die kosten van een van de
      andere scholen van dat bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel128
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel131
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel29
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel143
