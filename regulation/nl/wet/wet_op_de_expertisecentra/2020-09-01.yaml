        artikel: I
  - number: 178a.6
    text: |-
      [Artikel 39, vijfde lid, de laatste twee volzinnen][ref1], zoals luidend door
      [artikel I, onderdeel N, tweede lid, van de wet van 11 oktober 2012][ref2] (Stb. 545) zijn niet van toepassing ten
      aanzien van verzoeken om ontheffing die voor inwerkingtreding van dat artikelonderdeel zijn gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0032212#ArtikelI
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel178a
