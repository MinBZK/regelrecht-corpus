        afdeling: '4'
  - number: '139.2'
    text: |-
      Indien aan het bevoegd gezag van een niet door de gemeente in stand gehouden school een deel van de bekostiging
      voor personeelskosten is overgedragen door een ander bevoegd gezag, wordt bij het vaststellen van het totaal van de
      ontvangsten, bedoeld in het eerste lid, tweede volzin, dat deel aangemerkt als ontvangsten.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel139
  - number: '139.3'
    text: |-
      Indien de gemeente voor een niet door de gemeente in stand gehouden school het deel van de materiële instandhouding
      waarop de programma's van eisen, bedoeld in [artikel 112, eerste lid onder a, b en c][ref1], dan wel, indien het
      een instelling betreft, de bedragen, voor de in [artikel 114, derde lid onder a][ref2], bedoelde voorzieningen
      betrekking hebben, geheel of gedeeltelijk verzorgt, wordt een overeenkomstig deel van de ontvangsten in mindering
      gebracht op het totaal van de ontvangsten voor de betrokken school waarover ingevolge het eerste lid het
      overschrijdingsbedrag wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel114
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '112'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '114'
        afdeling: '4'
  - number: '139.4'
    text: |-
      Voor de vaststelling bedoeld in [artikel 138, eerste en zevende lid][ref1], en [artikel 139, eerste lid][ref2],
      worden met betrekking tot een school voor speciaal en voortgezet speciaal onderwijs de bedragen die voor een
      zodanige school zijn uitgegeven dan wel ontvangen, toegerekend aan het speciaal onderwijs, onderscheidenlijk
      het voortgezet speciaal onderwijs, naar rato van het aantal leerlingen dat in het desbetreffende kalenderjaar in
      aanmerking kwam voor het volgen van speciaal onderwijs, onderscheidenlijk voortgezet speciaal onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel169
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '138'
        paragraaf: '5'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '169'
        afdeling: '11'
  - number: '139.5'
    text: |-
      Voor de vaststelling bedoeld in [artikel 138, eerste en zevende lid][ref1], en [artikel 139, eerste lid][ref2],
      worden met betrekking tot een school waaraan een of meer afdelingen zijn verbonden, de bedragen die voor een
      zodanige school, de afdeling of afdelingen daaronder begrepen, zijn uitgegeven dan wel ontvangen, toegerekend
      aan de school, onderscheidenlijk de afdeling of afdelingen, naar rato van het aantal leerlingen dat in het
      desbetreffende kalenderjaar in aanmerking kwam voor het volgen van onderwijs aan de school, onderscheidenlijk de
      desbetreffende afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel139
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel139
