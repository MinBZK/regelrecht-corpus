  - number: 178a.7
    text: |-
      Tot aan het tijdstip van inwerkingtreding van de wijziging van
      [artikel I, onderdeel E, van de wet van 11 oktober 2012][ref1] (Stb. 545) gelden voor het voortgezet speciaal
      onderwijs [artikel 11, vierde lid][ref2], [40b][ref3], [41][ref4], [41a][ref5], [43][ref6], [53][ref7] en
      [59][ref8], zoals die artikelen luidden vóór het tijdstip van inwerkingtreding van artikel I, onderdelen B, P, Q,
      R, S, V en W, tweede lid, van die wet.


