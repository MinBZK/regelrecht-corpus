      - id: ref6
        bwb_id: BWBR0003549
        artikel: '85'
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0003549
        artikel: '83'
        afdeling: '2'
      - id: ref8
        bwb_id: BWBR0003549
        artikel: '83'
