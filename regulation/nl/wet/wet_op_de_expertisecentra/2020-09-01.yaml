  - number: '3.2'
    text: |-
      Het onderwijs in de onderwijsactiviteit zintuiglijke en lichamelijke oefening in groepen bestemd voor leerlingen
      vanaf 7 jaar in het speciaal onderwijs kan in afwijking van het eerste lid, onderdeel b, onder 1, uitsluitend
      worden gegeven door degene die beschikt over een in dat onderdeel b, onder 1, bedoeld getuigschrift waaruit blijkt
      dat wordt voldaan aan de bekwaamheidseisen die zijn vastgesteld krachtens [artikel 32a, eerste lid][ref1], en:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel3
    references:
