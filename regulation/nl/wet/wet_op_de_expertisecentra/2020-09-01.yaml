  - number: 170b.1
    text: |-
      Onze Minister verstrekt bekostiging voor het geven van het onderwijs, bedoeld in
      [artikel 53, eerste en tweede volzin][ref1], aan een rechtspersoon met volledige rechtsbevoegdheid die zich
      blijkens zijn statuten ten doel stelt het geven van onderwijs als bedoeld in artikel 53, eerste lid, eerste en
      tweede volzin, voor zover dit wordt gegeven door leraren als bedoeld in [artikel 54][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel54
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel170b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '53'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '54'
        afdeling: '2'
  - number: 170b.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels gegeven of voorwaarden worden gesteld voor de
      bekostiging van godsdienstonderwijs of levensbeschouwelijk onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel170b
  - number: 170b.3
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel170b
  - number: '171.1'
    text: |-
      Met het oog op verbetering van de kwaliteit, toegankelijkheid of doelmatigheid van het speciaal onderwijs en het
      voortgezet speciaal onderwijs kan bij wijze van experiment bij algemene maatregel van bestuur worden afgeweken van
      [titel I, artikelen 1][ref1] en [2][ref2], [titel II, afdeling 1, afdeling 2, artikelen 50][ref3] en [51][ref4],
      en [titel IV, afdelingen 1][ref5], [2][ref6], [4 tot en met 6][ref7], [afdeling 7, paragrafen 2][ref8],
      [3][ref9], [6][ref10] en [7][ref11], en [afdeling 8, artikelen 146 tot en met 149][ref12] en [151][ref13], van
      de wet.


