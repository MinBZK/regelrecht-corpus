  - number: '143.3'
    text: |-
      De verstrekte overschrijdingsbedragen worden ten behoeve van het onderwijs aan de scholen van het bevoegd gezag
      aangewend.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel143
  - number: '143.4'
    text: |-
      De op grond van [artikel 134][ref1] of [artikel 135][ref2] verstrekte vergoeding wordt besteed aan het doel
      waarvoor zij is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel135
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel143
