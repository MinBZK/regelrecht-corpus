        bwb_id: BWBR0003549
        artikel: '170'
        afdeling: '11'
  - number: 170a.1.a
    text: het gewezen personeelslid,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel170a
  - number: 170a.1.b
    text: het bevoegd gezag van de school dan wel de centrale dienst waar de in onderdeel a bedoelde persoon werkzaam was,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel170a
  - number: 170a.1.c
    text: Onze Minister, of
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel170a
  - number: 170a.1.d
    text: |-
      de instantie, bedoeld in [artikel 170, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel170
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel170a
