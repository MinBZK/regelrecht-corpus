  - number: 14c.5
    text: |-
      Op scholen in de provincie Fryslân kan het onderwijs in het arbeidsmarktgerichte uitstroomprofiel mede onderwijs
      in de Friese taal omvatten. Voor dat onderwijs stellen provinciale staten van Fryslân bij verordening kerndoelen
      Friese taal vast. De vaststelling geschiedt niet eerder dan nadat gedeputeerde staten overleg hebben gevoerd met
      het Friese voortgezet speciaal onderwijs. De verordening behoeft de goedkeuring van Onze Minister. Indien Onze
      Minister voornemens is goedkeuring te onthouden, verzoekt hij de Onderwijsraad een advies uit te brengen. Het
      verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies wordt binnen zes weken
      uitgebracht aan Onze Minister en wordt bekend gemaakt. Onze Minister informeert beide Kamers der Staten-Generaal
      over zijn voornemen om al dan niet goed te keuren. [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is
      niet van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 14c.6
    text: |-
      Onze Minister kan goedkeuring als bedoeld in het vijfde lid in ieder geval onthouden indien aan de volgende
      voorwaarden, waarvoor gedeputeerde staten gegevens aandragen, niet wordt voldaan:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14c
  - number: 14c.6.a
    text: |-
      het bestaan van voldoende draagvlak in het Friese voortgezet speciaal onderwijs voor de voorgelegde kerndoelen
      Friese taal;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14c
  - number: 14c.6.b
    text: |-
      dat de kerndoelen Friese taal niet meer inspanningen vergen van het Friese voortgezet speciaal onderwijs dan
      het aandeel van het onderwijs in de Friese taal binnen het onderwijsprogramma, bedoeld in het negende lid,
      rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14c
  - number: 14c.7
    text: |-
      Onze Minister kan goedkeuring als bedoeld in het vijfde lid in ieder geval onthouden indien de kerndoelen Friese
      taal geen aandacht schenken aan:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14c
  - number: 14c.7.a
    text: het zich mondeling uitdrukken in het Fries en het verstaan van de Fries gesproken taal,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14c
  - number: 14c.7.b
    text: het zich schriftelijk uitdrukken in het Fries en het verwerven van informatie uit in het Fries gestelde teksten,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14c
  - number: 14c.7.c
    text: bevordering van het begrip van de Friese taal, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14c
  - number: 14c.7.d
    text: het ontwikkelen van een positieve houding ten aanzien van het gebruik van het Fries.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14c
  - number: 14c.8
    text: |-
      De kerndoelen, bedoeld in het tweede en vijfde lid, kunnen voor de onderwijssoorten, bedoeld in
      [artikel 2, tweede lid][ref1], verschillen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 14c.9
    text: |-
      Het onderwijs in het arbeidsmarktgerichte uitstroomprofiel wordt zo ingericht dat een samenhangend op de
      kerndoelen gebaseerd onderwijsprogramma wordt aangeboden waarbij het bevoegd gezag de kerndoelen uitwerkt voor de
      verschillende groepen leerlingen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14c
  - number: 14c.10
    text: |-
      Het bevoegd gezag kan na overleg met de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam
      is, met de leerling, een leerling ontheffing verlenen voor onderdelen van het onderwijsprogramma, bedoeld in het
      negende lid. Het bevoegd gezag bepaalt bij de ontheffing welk onderwijs voor de leerling in de plaats komt voor de
      onderdelen waarvoor ontheffing is verleend.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14c
  - number: 14c.11
    text: |-
      Het bevoegd gezag kan voor leerlingen die daarvoor in aanmerking komen, bij de inrichting van het onderwijs
      afwijken van een of meer programmaonderdelen of van het negende lid. De laatste volzin van het tiende lid is van
      overeenkomstige toepassing. Bij algemene maatregel van bestuur wordt bepaald hoe wordt vastgesteld welke leerlingen
      in aanmerking komen voor deze afwijkingen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14c
  - number: 14c.12
    text: |-
      Het onderwijs in het arbeidsmarktgerichte uitstroomprofiel is er op gericht dat leerlingen
      zo veel mogelijk het referentieniveau Nederlandse taal en het referentieniveau rekenen
      bereiken die voor het arbeidsmarktgerichte uitstroomprofiel zijn vastgesteld op grond van
      [artikel 2, tweede lid, aanhef en onderdeel f, van de Wet referentieniveaus Nederlandse taal en rekenen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027679#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0027679
        artikel: '2'
  - number: 14d
    text: |-
      Leerlingen die het onderwijs in het arbeidsmarktgerichte uitstroomprofiel verlaten en voor wie de leerplicht,
      bedoeld in [paragraaf 2 van de Leerplichtwet 1969][ref1], is geëindigd ontvangen een getuigschrift. Onze Minister
      stelt het model van het getuigschrift vast.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14d
    references:
      - id: ref1
        bwb_id: BWBR0002628
        paragraaf: '2'
  - number: 14e
    text: |-
      Voor iedere leerling die de school verlaat en voor wie het onderwijs in het arbeidsmarktgerichte uitstroomprofiel
      het laatst gevolgde onderwijs is, stelt het bevoegd gezag, na overleg met de directeur, het onderwijzend
      personeel en de commissie voor de begeleiding, bedoeld in [artikel 40b][ref1], dan wel de commissie, bedoeld
      in [artikel 41, tweede lid][ref2], ten behoeve van het uitoefenen van een functie op de arbeidsmarkt een
      overgangsdocument op. De commissie kan daartoe de leerling aan een onderzoek onderwerpen. Het overgangsdocument
      wordt verstrekt aan de ouders van een minderjarige of handelingsonbekwame leerling en aan de leerling die
      meerderjarig en handelingsbekwaam is. Desgewenst wordt een afschrift verstrekt aan de leerling die de leeftijd van
      16 jaar en nog niet die van 18 jaar heeft bereikt. Bij algemene maatregel van bestuur kunnen nadere voorschriften
      omtrent het overgangsdocument worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40b
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel41
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14e
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 40b
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '41'
        paragraaf: '3'
        afdeling: '1'
  - number: 14f.1
    text: |-
      Het onderwijs in het uitstroomprofiel dagbesteding bereidt leerlingen, van wie redelijkerwijs mag worden aangenomen
      dat het volgen van het onderwijs, bedoeld in [artikel 14a][ref1] en [artikel 14c][ref2], niet leidt tot het behalen
      van een diploma of een getuigschrift als bedoeld in [artikel 29 van de Wet op het voortgezet onderwijs][ref3]
      respectievelijk tot het duurzaam bekleden van een functie op de arbeidsmarkt, voor op het zo zelfstandig mogelijk
      functioneren in vormen van dagbesteding.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel14c
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel29
