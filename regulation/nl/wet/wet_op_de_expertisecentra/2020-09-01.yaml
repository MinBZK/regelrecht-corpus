        afdeling: '7'
  - number: 138.1.j
    text: een staat van voorzieningen die zijn ingesteld ten behoeve van de door de gemeente in stand gehouden scholen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel138
  - number: '138.2'
    text: |-
      Indien de gemeente een deel van de ontvangsten bedoeld in het eerste lid onder d, of een deel van de ontvangsten,
      bedoeld in dat lid onder e, f, g en i, toevoegt aan een voorziening, wordt dat deel aangemerkt als een uitgave als
      bedoeld in dat lid onder a, onderscheidenlijk als een uitgave als bedoeld in dat lid onder b, c en h. Indien de
      gemeente ten behoeve van de personeelskosten, de nascholingskosten, de kosten voor materiële instandhouding of de
      kosten voor de instandhouding van een rechtspersoon als bedoeld in [artikel 69][ref1], bedragen aan een voorziening
      onttrekt, worden deze aangemerkt als ontvangsten als bedoeld in het eerste lid onder d, e of f.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel69
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '69'
        afdeling: '2'
  - number: '138.3'
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid onder c, f, g en h, worden buiten beschouwing
      gelaten de uitgaven en ontvangsten voor:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel138
  - number: 138.3.a
    text: |-
      administratie, beheer en bestuur, bedoeld in [artikel 112, eerste lid onder e][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel112
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '112'
        afdeling: '4'
  - number: 138.3.b
    text: |-
      de materiële instandhouding van het onderwijs in lichamelijke oefening, en van watergewenning of bewegingstherapie,
      en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel138
  - number: 138.3.c
    text: |-
      indien het een instelling betreft, de bedragen, bedoeld in [artikel 114, tweede lid][ref1], en de daarmee verband
      houdende uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel114
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '114'
        afdeling: '4'
  - number: '138.4'
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid onder a, b, c en h, worden buiten
      beschouwing gelaten de uitgaven die worden gedekt door ontvangsten van bedragen die door derden
      zijn betaald, de uitgaven die worden gedekt door ontvangsten op grond van een besluit als bedoeld in
      [artikel 134, zesde lid, tweede volzin][ref1], en de uitgaven voor de voorzieningen waarvoor het bevoegd
      gezag van een niet door de gemeente in stand gehouden school op grond van de regeling, bedoeld in
      [artikel 135, eerste lid][ref2], een aanvraag bij de gemeente kon indienen en wel gedurende de periode waarvoor een
      dergelijke aanvraag kon worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel135
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '134'
        paragraaf: '4'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '135'
        paragraaf: '4'
        afdeling: '7'
  - number: 138.4a
    text: |-
      Bij het vaststellen van de bedragen bedoeld in het eerste lid, onder c, mogen voorzieningen die volgens de
      desbetreffende rijksbekostiging een afschrijvingstermijn van ten minste 20 jaar hebben, over ten hoogste 20 jaar
      worden aangemerkt als jaarlijkse uitgave op grond van rente op basis van een fictieve lening met een looptijd van
      ten hoogste 20 jaar en een lineaire aflossing.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel138
  - number: '138.5'
    text: |-
      Indien de gemeente een deel van de bekostiging voor personeelskosten en kosten voor materiële instandhouding
      overdraagt aan een ander bevoegd gezag, wordt dat deel aangemerkt als een uitgave als bedoeld in het eerste lid,
      onderdeel a, of onderdeel c. Indien door een ander bevoegd gezag een deel van de bekostiging voor personeelskosten
      en kosten voor materiële instandhouding aan de gemeente wordt overgedragen, wordt dat deel aangemerkt als een
      ontvangst als bedoeld in het eerste lid, onderdeel d, of onderdeel f.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel138
  - number: '138.6'
    text: |-
      Om de vijf jaar stellen burgemeester en wethouders voorlopig vast het totaal van de vastgestelde uitgaven en
      ontvangsten in de voorafgaande vijf kalenderjaren, zoals in het eerste tot en met vijfde lid is aangegeven.
      Indien de uitgaven hoger zijn dan de ontvangsten, bepalen burgemeester en wethouders tevens het bedrag van de
      overschrijding. Indien een gemeente vanaf een tijdstip binnen een periode van vijf jaar als bedoeld in de eerste
      volzin geen school in stand houdt, stellen burgemeester en wethouders in afwijking van die volzin zo spoedig
      mogelijk na dat tijdstip voorlopig vast het totaal van de vastgestelde uitgaven en ontvangsten in het aan dat
      tijdstip voorafgaande deel van de periode van vijf jaar, zoals in het eerste tot en met vijfde lid is aangegeven.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel138
  - number: '138.7'
    text: |-
      Na sluiting van de rekening van de gemeente stellen burgemeester en wethouders onderscheiden per schoolsoort,
      alsmede al naar gelang het speciaal onderwijs dan wel voortgezet speciaal onderwijs betreft, de in het eerste
      en zesde lid bedoelde bedragen, zo nodig gewijzigd, vast. In het geval, bedoeld in het zesde lid, tweede volzin,
      drukken burgemeester en wethouders vervolgens het bedrag van de overschrijding uit in een percentage van het totaal
      van de ontvangsten, bedoeld in het eerste lid onder d tot en met g en i. Het percentage wordt afgerond tot twee
      decimalen. Afronding naar beneden vindt plaats indien de derde decimaal kleiner is dan 5, en naar boven indien deze
      decimaal ten minste 5 bedraagt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel138
  - number: '139.1'
    text: |-
      In het jaar volgend op de definitieve vaststelling, bedoeld in [artikel 138, zevende lid][ref1], wordt het
      overschrijdingsbedrag vastgesteld waarop het bevoegd gezag van een niet door de gemeente in stand gehouden
      school, die gedurende een of meer jaren van het desbetreffende tijdvak in de gemeente was gevestigd, aanspraak
      heeft. Dit overschrijdingsbedrag wordt vastgesteld door het percentage, bedoeld in artikel 138, zevende lid,
      te vermenigvuldigen met het totaal van de ontvangsten van een niet door de gemeente in stand gehouden school
      dat is gebaseerd op de bedragen die krachtens de [artikelen 111][ref2] en [131][ref3], dan wel indien het
      een instelling betreft, krachtens de artikelen 111, [ 114][ref4] en 131 voor het desbetreffende tijdvak zijn
      vastgesteld. Bij het vaststellen van het totaal van de ontvangsten, bedoeld in de tweede volzin, blijven buiten
      beschouwing de ontvangsten op grond van de programma's van eisen voor administratie, beheer en bestuur, bedoeld
      in [artikel 112, eerste lid onder e][ref5], de ontvangsten voor de materiële instandhouding van het onderwijs in
      lichamelijke oefening en van watergewenning en bewegingstherapie dan wel, indien het een instelling betreft, de
      bedragen voor de in artikel 114, tweede lid, bedoelde voorzieningen en de ontvangsten.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel111
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel131
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel114
      [ref5]: https://wetten.overheid.nl/BWBR0003549#Artikel112
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '138'
        paragraaf: '5'
        afdeling: '7'
      - id: ref2
