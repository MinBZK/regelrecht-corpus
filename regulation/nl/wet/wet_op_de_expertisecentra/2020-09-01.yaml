  - number: 170a.2
    text: |-
      Het burgerservicenummer wordt op een daartoe strekkend verzoek van de in het eerste lid bedoelde rechtspersoon
      aan die rechtspersoon verstrekt door het bevoegd gezag van de school dan wel de centrale dienst waar het gewezen
      personeelslid werkzaam was.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel170a
  - number: 170a.3
    text: |-
      Indien dat ten behoeve van het jaarverslag, bedoeld in
      [artikel 18, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], noodzakelijk is, worden gegevens
      daarin slechts zodanig openbaar gemaakt dat daaraan geen herkenbare gegevens over een afzonderlijk persoon
      kunnen worden ontleend, tenzij het betreft de controle op de juistheid van de gegevens in het kader van de
      controle op de rechtmatigheid en de doelmatigheid van door de rechtspersoon gedane uitgaven. Daarbij kunnen de
      burgerservicenummers worden vergeleken met de burgerservicenummers die door andere daartoe bij of krachtens de wet
      bevoegde instanties zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel170a
