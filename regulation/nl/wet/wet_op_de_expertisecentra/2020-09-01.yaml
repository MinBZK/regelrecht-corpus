  - number: 178c
    text: |-
      Op geschillen die in bezwaar, beroep of hoger beroep aanhangig zijn of binnen de bezwaar- dan wel beroepstermijn
      dan wel verschoonbaar daarbuiten aanhangig worden gemaakt tegen besluiten van de gemeente inzake bouwkundige
      aanpassingen die zijn genomen voor de inwerkingtreding van artikel II van de Wet van 7 mei 2014 houdende wijziging
      van de Wet op het primair onderwijs, de Wet op de expertisecentra en de Wet primair onderwijs BES in verband met
      de overheveling van taak en budget voor aanpassingen in onderwijshuisvesting van gemeente naar school (Stb.175) op
      grond van bepalingen bij of krachtens [titel IV, afdeling 3, van deze wet][ref1] zoals luidend op de dag voor de
      inwerkingtreding van artikel II van die wet, blijven de op die datum geldende regelingen van toepassing. De eerste
      volzin is hangende het bezwaar, beroep of hoger beroep van overeenkomstige toepassing op de bevoegdheid tot het
      intrekken en vervangen van besluiten die tot de aldaar bedoelde geschillen hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Afdeling3
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel178c
    references:
      - id: ref1
        bwb_id: BWBR0003549
        afdeling: '3'
  - number: 178d.1
    text: |-
      Aanvragen als bedoeld in [artikel 92 van deze wet][ref1], voor zover betreft voorzieningen als bedoeld in
      [artikel 90, eerste lid, onderdeel b, van deze wet][ref2] zoals luidend op de dag voor de inwerkingtreding
      van artikel II, van de Wet van 7 mei 2014 houdende wijziging van de Wet op het primair onderwijs, de Wet op de
      expertisecentra en de Wet primair onderwijs BES in verband met de overheveling van taak en budget voor aanpassingen
      in onderwijshuisvesting van gemeente naar school (Stb. 175), die worden ingediend na de inwerkingtreding van
      artikel II van die wet, blijven buiten behandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel90
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel178d
