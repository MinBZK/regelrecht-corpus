        artikel: '29'
  - number: 14a.2.a
    text: |-
      bij algemene maatregel van bestuur onderscheidenlijk bij ministeriële regeling regels kunnen worden vastgesteld
      in afwijking van de regels die bij algemene maatregel van bestuur respectievelijk bij ministeriële regeling zijn
      vastgesteld op grond van genoemde bepalingen van de [Wet op het voortgezet onderwijs][ref1], met dien verstande dat
      bij algemene maatregel van bestuur tevens kerndoelen kunnen worden vastgesteld in aanvulling op de kerndoelen die
      zijn vastgesteld op grond van [artikel 11b van de Wet op het voortgezet onderwijs][ref2], waarbij tevens kan worden
      bepaald dat het onderwijs na de eerste twee leerjaren wordt verzorgd mede op basis van de kerndoelen die zijn
      vastgesteld op grond van dit onderdeel;


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel11b
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 11b
  - number: 14a.2.b
    text: |-
      voor zover het betreft het voorbereidend beroepsonderwijs, het onderwijs wordt gegeven in de basisberoepsgerichte
      leerweg, de kaderberoepsgerichte leerweg dan wel in beide leerwegen;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14a
  - number: 14a.2.c
    text: |-
      voor zover het betreft het middelbaar algemeen voortgezet onderwijs, de school een of meer profielen als bedoeld in
      [artikel 10, derde lid, van de Wet op het voortgezet onderwijs][ref1] verzorgt;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
  - number: 14a.2.d
    text: |-
      voor zover het betreft het hoger algemeen voortgezet onderwijs en het voorbereidend wetenschappelijk onderwijs, de
      school een of meer profielen als bedoeld in [artikel 12, derde lid, van de Wet op het voortgezet onderwijs][ref1]
      verzorgt;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel12
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '12'
  - number: 14a.2.e
    text: |-
      provinciale staten van Fryslân bij verordening kerndoelen Friese taal en cultuur kunnen
      vaststellen in afwijking van de kerndoelen Friese taal en cultuur die zijn vastgesteld op grond van
      [artikel 11e van de Wet op het voortgezet onderwijs][ref1], met dien verstande dat op die verordening artikel 11e
      van de Wet op het voortgezet onderwijs van overeenkomstige toepassing is; en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11e
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11e
  - number: 14a.2.f
    text: |-
      de inspectie op verzoek van het bevoegd gezag ermee kan instemmen dat om lichamelijke
      of psychische redenen voor individuele leerlingen wordt afgeweken van de urennorm,
      bedoeld in de [artikelen 6g, eerste tot en met vierde lid][ref1], [10b17][ref2] en
      [10b18 van de Wet op het voortgezet onderwijs][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6g
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b17
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10b18
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6g
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b17
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10b18
  - number: 14b.1
    text: |-
      Het bevoegd gezag kan leerlingen voor wie, in het kader van het onderwijs, bedoeld in
      [artikel 14a, eerste lid, onderdeel a][ref1], een deel van het schoolplan op grond van [artikel 24][ref2] wordt
      uitgevoerd aan een regionaal opleidingencentrum als bedoeld in de [Wet educatie en beroepsonderwijs][ref3],
      in verbinding met een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onder a, van die wet][ref4], in de gelegenheid stellen deel te nemen aan een examen van
      een opleiding voortgezet algemeen volwassenenonderwijs van het betreffende regionaal opleidingencentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0007625
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 14a
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '24'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0007625
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 14b.2
    text: |-
      Toepassing van het eerste lid berust op een overeenkomst, gesloten tussen het bevoegd gezag van de school en het
      bevoegd gezag van een een regionaal opleidingencentrum als bedoeld in de [Wet educatie en beroepsonderwijs][ref1].
      De overeenkomst omvat in elk geval welke begeleiding door de school aan de leerlingen wordt verzorgd ten behoeve
      van de deelname aan de examens.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 14b.3
    text: |-
      Bij algemene maatregel van bestuur wordt nader geregeld voor welke leerlingen en onder welke voorwaarden het eerste
      lid toepassing kan vinden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14b
  - number: 14c.1
    text: |-
      Het onderwijs in het arbeidsmarktgerichte uitstroomprofiel bereidt leerlingen voor op functies
      op de arbeidsmarkt op een niveau dat ligt onder het niveau van de entreeopleiding, bedoeld in
      [artikel 7.2.2., eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
