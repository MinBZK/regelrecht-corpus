  - number: 143a
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het door het bevoegd gezag uitzetten van gelden, het
      aangaan van geldleningen en het aangaan van verbintenissen voor financiële producten.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel143a
  - number: '144'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven voor de verlening van voorschotten op
      de bekostiging en voor de verrekening van de betaalde voorschotten met het bedrag van de vastgestelde bekostiging
      of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel144
  - number: '145'
    text: |-
      Onze Minister is bevoegd tot verrekening van vorderingen krachtens deze wet van of op het bevoegd gezag van een
      school met vorderingen van of op Onze Minister krachtens een andere wet.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel145
  - number: 145a.1
    text: |-
      Indien sprake is van wanbeheer van een of meer bestuurders of toezichthouders kan Onze Minister de rechtspersoon
      die de school in stand houdt een aanwijzing geven. Een aanwijzing omvat een of meer maatregelen en is evenredig aan
      het doel waarvoor zij wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel145a
  - number: 145a.2
    text: 'Onder wanbeheer wordt uitsluitend verstaan:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel145a
  - number: 145a.2.a
    text: financieel wanbeleid,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel145a
  - number: 145a.2.b
    text: |-
      ernstige nalatigheid om, in ieder geval in strijd met [artikel 19][ref1], maatregelen te treffen die noodzakelijk
      zijn voor het waarborgen van de kwaliteit en goede voortgang van het onderwijs aan de school en om te voorkomen dat
      de kwaliteit van het stelsel van speciaal en voortgezet speciaal onderwijs in gevaar komt;


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel19
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel145a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '19'
        paragraaf: '1'
        afdeling: '1'
  - number: 145a.2.c
    text: |-
      ongerechtvaardigde verrijking, al dan niet beoogd, van de rechtspersoon die de school in stand houdt, zichzelf dan
      wel een derde;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel145a
  - number: 145a.2.d
    text: |-
      onrechtmatig handelen, waaronder wordt verstaan het in de hoedanigheid van bestuurder of toezichthouder handelen in
      strijd met wettelijke bepalingen waarmee financieel voordeel wordt behaald ten gunste van de rechtspersoon die de
      school in stand houdt, zichzelf of een derde, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel145a
  - number: 145a.2.e
    text: |-
      het in ernstige mate verwaarlozen van de zorg voor wat door redelijkheid en billijkheid wordt gevorderd in de
      omgang met betrokkenen in de schoolorganisatie, waaronder wordt verstaan intimidatie of bedreiging van personeel,
      leerlingen of ouders door een bestuurder of toezichthouder.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel145a
  - number: 145a.3
    text: |-
      In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten sprake is van wanbeheer alsmede de in
      verband daarmee te nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel145a
  - number: 145a.4
    text: Een aanwijzing bevat de termijn waarbinnen het bevoegd gezag aan de aanwijzing moet voldoen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel145a
  - number: 145a.5
    text: 'Alvorens Onze Minister een aanwijzing als bedoeld in het eerste lid geeft:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel145a
  - number: 145a.5.a
    text: |-
      heeft de inspectie een onderzoek als bedoeld in [artikel 11][ref1] of
      [artikel 15 van de Wet op het onderwijstoezicht][ref2] verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel15
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel145a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '15'
  - number: 145a.5.b
    text: |-
      heeft de inspectie daarover een inspectierapport als bedoeld in
      [artikel 20, eerste lid, van de Wet op het onderwijstoezicht][ref1] uitgebracht; en


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel145a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
  - number: 145a.5.c
    text: |-
      stelt Onze Minister de rechtspersoon vervolgens vier weken in de gelegenheid zijn zienswijze met betrekking tot de
      aanwijzing naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel145a
  - number: '146.1'
    text: |-
      Indien het bevoegd gezag van een school in strijd handelt met het bepaalde bij of krachtens deze wet, waaronder
      tevens wordt verstaan het niet opvolgen van een aanwijzing als bedoeld in [artikel 145a][ref1], kan Onze Minister
      bepalen dat de bekostiging, voorschotten daaronder begrepen, geheel of gedeeltelijk wordt ingehouden dan wel
      opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel145a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 145a
        afdeling: '8'
  - number: '146.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien het bevoegd gezag of het personeel van een school in
      strijd handelt met [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '146.3'
    text: |-
      Onze Minister kent de bekostiging wederom toe, indien blijkt dat de reden voor de toepassing van het eerste of
      tweede lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel146
  - number: 146a.1
    text: |-
      Indien het bevoegd gezag tekortschiet in haar zorg voor de kwaliteit van het onderwijs, bedoeld in
      [artikel 19][ref1], kan Onze Minister op verzoek van het bevoegd gezag van een school of uit eigen beweging in
      overeenstemming met het bevoegd gezag maatregelen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel19
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel146a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '19'
        paragraaf: '1'
        afdeling: '1'
  - number: 146a.2
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de instelling ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel146a
  - number: 146a.3
    text: |-
      Onze Minister stelt nadere regels omtrent de toekenning van en verantwoording voor maatregelen, voorzover deze het
      verstrekken van financiële middelen betreffen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel146a
  - number: '147.1'
    text: |-
      De bekostiging van een bijzondere school wordt beëindigd, indien het aantal leerlingen vastgesteld volgens
      [artikel 151][ref1], gedurende 2 achtereenvolgende schooljaren in elk van die jaren minder heeft bedragen dan het
      volgende aantal leerlingen:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel151
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '151'
        afdeling: '8'
  - number: 147.1.a
    text: 'de school voor speciaal onderwijs: 25 leerlingen;'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel147
  - number: 147.1.b
    text: 'de school voor voortgezet speciaal onderwijs: 29 leerlingen;'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel147
  - number: 147.1.c
    text: 'de school of de instelling voor speciaal en voortgezet speciaal onderwijs: 33 leerlingen;'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel147
  - number: 147.1.d
    text: 'de afdeling: 8 leerlingen.'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel147
  - number: '147.2'
    text: Het eerste lid is niet van toepassing op de eerste 5 volledige schooljaren van de bekostiging van de school.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel147
  - number: '147.3'
    text: |-
      Onze Minister kan op aanvraag van het bevoegd gezag, burgemeester en wethouders van de betrokken gemeente gehoord,
      besluiten dat, in afwijking van het eerste lid, de bekostiging wordt voortgezet indien aan de school behoefte
      bestaat. Tevens hoort Onze Minister gedeputeerde staten van de betrokken provincie voor zover het scholen betreft
      bedoeld in [artikel 78, eerste lid][ref1]. De aanvraag wordt ingediend voor 16 oktober van het schooljaar volgend
      op de 2 achtereenvolgende schooljaren, bedoeld in de aanhef van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel78
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '78'
        afdeling: '2'
  - number: '147.4'
    text: |-
      Het besluit van Onze Minister op de aanvraag, bedoeld in het derde lid, wordt genomen voor 16 februari volgend
      op de datum 16 oktober genoemd in het derde lid. Indien Onze Minister niet voor 16 februari heeft besloten, wordt
      de aanvraag geacht te zijn ingewilligd. Een besluit van Onze Minister dat de bekostiging wordt voortgezet, geldt
      telkens voor ten hoogste 3 schooljaren.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel147
  - number: '147.5'
    text: |-
      De beëindiging van de bekostiging geschiedt met ingang van 1 augustus van het tweede schooljaar volgend op de
      2 achtereenvolgende schooljaren, bedoeld in de aanhef van het eerste lid, tenzij door Onze Minister bij zijn
      afwijzing van de aanvraag, bedoeld in het derde lid, of bij een in beroep gegeven uitspraak anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel147
  - number: '147.6'
    text: |-
      Van zijn besluit en van de uitspraak in beroep wordt door Onze Minister mededeling gedaan door toezending van een
      afschrift aan gedeputeerde staten en aan burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel147
  - number: '147.7'
    text: |-
      Indien het aantal leerlingen van de betrokken school vastgesteld volgens [artikel 151][ref1] in het schooljaar
      volgend op de twee achtereenvolgende schooljaren, bedoeld in de aanhef van het eerste lid, gelijk is aan of meer
      bedraagt dan het op grond van het eerste lid voor die school geldende aantal, wordt de bekostiging niet beëindigd
      op grond van dit artikel. De procedures die in werking zijn gesteld op grond van het derde tot en met het zesde
      lid, eindigen van rechtswege en besluiten, genomen op grond van het derde tot en met het zesde lid, vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel151
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '151'
        afdeling: '8'
  - number: '148.1'
    text: |-
      De gemeenteraad besluit, behoudens het bepaalde in het derde lid, tot opheffing van een openbare school indien het
      aantal leerlingen vastgesteld volgens [artikel 151][ref1], gedurende 2 achtereenvolgende schooljaren in elk van die
      jaren minder heeft bedragen dan het volgende aantal leerlingen:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel151
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '151'
        afdeling: '8'
  - number: 148.1.a
    text: 'de school voor speciaal onderwijs: 25 leerlingen;'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel148
  - number: 148.1.b
    text: 'de school voor voortgezet speciaal onderwijs: 29 leerlingen;'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel148
  - number: 148.1.c
    text: 'de school of de instelling voor speciaal en voortgezet speciaal onderwijs: 33 leerlingen;'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel148
  - number: 148.1.d
    text: 'de afdeling: 8 leerlingen.'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel148
  - number: '148.2'
    text: Het eerste lid is niet van toepassing op de eerste 5 volledige schooljaren van de bekostiging van de school.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel148
  - number: '148.3'
    text: |-
      In de gevallen, genoemd in het eerste lid, besluit de gemeenteraad tot instandhouding van de school indien deze
      noodzakelijk is om voldoende te voorzien in de behoefte aan openbaar onderwijs. Dit besluit wordt genomen voor 16
      oktober van het schooljaar volgend op de 2 achtereenvolgende schooljaren, bedoeld in de aanhef van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel148
  - number: '148.4'
    text: |-
      De besluiten van de gemeenteraad, bedoeld in het eerste en derde lid, worden onderworpen aan de goedkeuring
      van gedeputeerde staten voor zover het scholen betreft als bedoeld in [artikel 78, eerste lid][ref1], en aan
      de goedkeuring van Onze Minister voor zover het scholen betreft als bedoeld in [artikel 86, eerste lid][ref2].
      Gedeputeerde staten en Onze Minister onthouden hun goedkeuring ten aanzien van besluiten op grond van het eerste
      lid, indien ten gevolge van de opheffing van de school, afhankelijk van de schoolsoort, regionaal, provinciaal dan
      wel landelijk niet meer voldoende zou zijn voorzien in de behoefte aan openbaar onderwijs. Gedeputeerde staten en
      Onze Minister onthouden hun goedkeuring ten aanzien van besluiten op grond van het derde lid, indien instandhouding
      van de school, afhankelijk van de schoolsoort, regionaal, provinciaal dan wel landelijk niet noodzakelijk is om
      voldoende te voorzien in de behoefte aan openbaar onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel86
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '78'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '86'
        afdeling: '2'
  - number: '148.5'
    text: |-
      Gedeputeerde staten en Onze Minister besluiten voor 16 februari volgend op de datum 16 oktober, genoemd in het
      eerste lid, laatste volzin, en derde lid, laatste volzin. Indien gedeputeerde staten, onderscheidenlijk Onze
      Minister niet voor 16 februari hebben besloten, wordt het desbetreffende besluit van de gemeenteraad geacht te zijn
      goedgekeurd. Het onthouden van de goedkeuring van gedeputeerde staten, onderscheidenlijk Onze Minister ten aanzien
      van het besluit van de gemeenteraad, bedoeld in het eerste lid, dan wel de goedkeuring van gedeputeerde staten,
      onderscheidenlijk Onze Minister ten aanzien van het besluit van de gemeenteraad, bedoeld in het derde lid, geldt
      telkens voor ten hoogste 3 schooljaren.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel148
  - number: '148.6'
    text: |-
      De besluiten van de gemeenteraad, van gedeputeerde staten en van Onze Minister, bedoeld in het eerste en het derde
      tot en met vijfde lid, worden bekendgemaakt door een openbare kennisgeving binnen 2 weken na de datum waarop het
      besluit is genomen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel148
  - number: '148.7'
    text: |-
      De opheffing geschiedt met ingang van 1 augustus van het tweede schooljaar volgend op de 2 achtereenvolgende
      schooljaren, bedoeld in de aanhef van het eerste lid, tenzij door gedeputeerde staten of Onze Minister bij hun,
      onderscheidenlijk zijn besluit, of bij een in beroep gegeven uitspraak anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel148
  - number: '148.8'
    text: |-
      Indien het aantal leerlingen van de betrokken school vastgesteld volgens [artikel 151][ref1] in het schooljaar
      volgend op de 2 achtereenvolgende schooljaren, bedoeld in de aanhef van het eerste lid, gelijk is aan of meer
      bedraagt dan het op grond van het eerste lid voor die school geldende aantal, wordt de school niet opgeheven op
      grond van dit artikel. De procedures die in werking zijn gesteld op grond van het vierde tot en met het zevende
      lid, eindigen van rechtswege en beslissingen, genomen op grond van het vierde tot en met het zevende lid,
      vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel151
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '151'
        afdeling: '8'
  - number: '149.1'
    text: |-
      De gemeenteraad kan besluiten tot vermindering van het aantal openbare scholen in de gemeente. Het besluit wijst
      tevens de op te heffen scholen aan en het tijdstip met ingang waarvan de opheffing geschiedt. Opheffing van een
      school vindt niet plaats indien instandhouding van die school noodzakelijk is om voldoende te voorzien in de
      behoefte aan openbaar onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel149
  - number: '149.2'
    text: |-
      De openbare rechtspersoon, bedoeld in [artikel 50][ref1], en de stichting, bedoeld in [artikel 28][ref2] of
      [51][ref3], kunnen besluiten tot opheffing van een door die openbare rechtspersoon of stichting in stand gehouden
      openbare school.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel51
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '50'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '28'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '51'
        afdeling: '2'
  - number: '149.3'
    text: |-
      Een besluit als bedoeld in het eerste of tweede lid wordt genomen voor 16 oktober voorafgaand aan het schooljaar
      waarin de opheffing geschiedt, dan wel, indien het besluit meer dan een school betreft, voorafgaand aan het
      schooljaar waarin de eerste van deze scholen wordt opgeheven. Het besluit wordt onderworpen aan de goedkeuring
      van gedeputeerde staten, voor zover het scholen betreft als bedoeld in [artikel 78, eerste lid][ref1], en aan
      de goedkeuring van Onze Minister, voor zover het scholen betreft als bedoeld in [artikel 86, eerste lid][ref2].
      Gedeputeerde staten en Onze Minister onthouden hun goedkeuring ten aanzien van het besluit voor zover ten gevolge
      van de opheffing van een school, afhankelijk van de schoolsoort, regionaal, provinciaal dan wel landelijk niet meer
      voldoende zou zijn voorzien in de behoefte aan openbaar onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel86
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '78'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '86'
        afdeling: '2'
  - number: '149.4'
    text: |-
      Gedeputeerde staten en Onze Minister beslissen voor 16 februari volgend op de in het derde lid genoemde datum.
      Indien gedeputeerde staten, onderscheidenlijk Onze Minister, niet voor 16 februari hebben beslist, wordt het
      desbetreffende besluit geacht te zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel149
  - number: '149.5'
    text: |-
      De besluiten van de gemeenteraad, van het bevoegd gezag, van gedeputeerde staten en van Onze Minister, genomen op
      grond van dit artikel, worden bekendgemaakt door een openbare kennisgeving binnen 2 weken na de datum waarop het
      besluit is genomen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel149
  - number: '150.1'
    text: |-
      Indien de bekostiging van een bijzondere school ingevolge [artikel 147][ref1] wordt beëindigd of het bevoegd gezag
      beslist tot opheffing van de school, eindigt het recht op het gebouw en terrein en worden alle roerende zaken,
      behalve die welke het bevoegd gezag uit eigen middelen heeft aangeschaft, aan de gemeente overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel147
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '147'
        afdeling: '8'
  - number: '150.2'
    text: |-
      [Artikel 108, eerste tot en met vierde lid][ref1], is van overeenkomstige toepassing met dien verstande dat in
      de verklaring ingevolge het eerste lid en het besluit ingevolge het tweede lid als datum waarop het bevoegd gezag
      blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein voor de school te gebruiken, zal
      worden genoemd de datum waarop de bekostiging is geëindigd dan wel zal eindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel108
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '108'
        afdeling: '3'
  - number: 150a.1
    text: |-
      Indien de bekostiging van de laatste bijzondere school van een bevoegd gezag wordt beëindigd of het bevoegd gezag
      tot de opheffing van de laatste school beslist, dan wel de laatste openbare school wordt opgeheven, stort het
      bevoegd gezag de niet bestede bekostigingsbedragen terug in de desbetreffende overheidskas.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel150a
  - number: 150a.2
    text: Het exploitatietekort blijft in de gevallen, bedoeld in het eerste lid, voor rekening van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel150a
  - number: 150a.3
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de wijze waarop het
      exploitatieoverschot, bedoeld in het eerste lid, wordt berekend.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel150a
  - number: '151'
    text: |-
      Grondslag voor de berekening van het aantal leerlingen, bedoeld in de [artikelen 147][ref1] en [148][ref2], is het
      aantal leerlingen op 1 oktober.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel147
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel148
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '147'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '148'
        afdeling: '8'
  - number: '157.1'
    text: |-
      Het bevoegd gezag stelt jaarlijks een jaarverslag over het voorafgaande kalenderjaar vast. Op deze
      jaarverslaggeving is [Boek 2, titel 9, van het Burgerlijk Wetboek][ref1], met uitzondering van de afdelingen 1,
      11 en 12, van overeenkomstige toepassing voor zover bij of krachtens algemene maatregel van bestuur niet anders is
      bepaald. Het jaarverslag bestaat tenminste uit de volgende onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 157.1.a
    text: |-
      een bestuursverslag als bedoeld in [artikel 391 Boek 2 van het Burgerlijk Wetboek][ref1] waarin de door het bevoegd
      gezag gehanteerde code voor goed bestuur wordt vermeld alsmede ten minste verantwoording wordt afgelegd over de
      afwijkingen van die code voor goed bestuur,


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel391
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '391'
  - number: 157.1.b
    text: |-
      een jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1], met daarbij ingevolge
      het derde lid vast te stellen bijlagen,


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
  - number: 157.1.c
    text: |-
      overige gegevens als bedoeld in [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel392
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '392'
  - number: '157.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald welke onderdelen het jaarverslag tevens dient te bevatten,
      dan wel welke onderdelen komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel157
  - number: '157.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een nadere invulling worden gegeven aan de onderdelen, bedoeld
      in het eerste en tweede lid, en kunnen nadere voorschriften worden gegeven over:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel157
  - number: 157.3.a
    text: de indeling en de wijze van ordening van de gegevens per onderdeel van het jaarverslag,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel157
  - number: 157.3.b
    text: de wijze en het tijdstip waarop de desbetreffende onderdelen beschikbaar gesteld moeten worden,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel157
  - number: 157.3.c
    text: de elektronische verzending van het cijfermatige deel uit de jaarrekening, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel157
  - number: 157.3.d
    text: de grondslagen voor de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel157
  - number: '157.4'
    text: |-
      De beschikbaarstelling van de gegevens, bedoeld in het derde lid, onder b, gaat vergezeld van een verklaring
      omtrent de getrouwheid en rechtmatigheid, afgegeven door een door de toezichthouder of het toezichthoudend orgaan
      aangewezen accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. Bij de
      aanwijzing van de accountant bedingt de toezichthouder of het toezichthoudend orgaan dat de controle overeenkomstig
      een door Onze Minister vast te stellen accountantsprotocol plaatsvindt en dat aan Onze Minister op diens verzoek
      inzicht wordt geboden in de controlerapporten van de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '157.5'
    text: |-
      De code voor goed bestuur, bedoeld in het eerste lid, onderdeel a, bevat ten minste bepalingen over de wijze waarop
      invulling wordt gegeven aan
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel157
  - number: 157.5.a
    text: |-
      een beleid dat de eigen deskundigheid en verantwoordelijkheid van het personeel voor de kwaliteit van het onderwijs
      tot haar recht komt,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel157
  - number: 157.5.b
    text: een integere bedrijfsvoering, waaronder voorzieningen om verstrengeling van belangen tegen te gaan, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel157
  - number: 157.5.c
    text: afstemming met en verantwoording aan de ouders en andere belanghebbenden binnen en buiten de school.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel157
  - number: '157.6'
    text: Bij algemene maatregel van bestuur kan een branchecode voor goed bestuur worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel157
  - number: '158.1'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het ten behoeve van Onze Minister beschikt over geordende gegevens die
      van belang zijn voor de berekening van de hoogte van de bekostiging, alsmede over een verklaring over de juistheid
      van de bekostigingsgegevens, afgegeven door een door de toezichthouder of het toezichthoudend orgaan aangewezen
      accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '158.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de definiëring,
      de wijze van ordening en de beschikbaarstelling van de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel158
  - number: '158.3'
    text: |-
      Het bevoegd gezag bewaart de gegevens, bedoeld in het eerste lid, en de desbetreffende boeken en bescheiden
      gedurende een periode van zeven jaren.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel158
  - number: '159.1'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het beschikt over geordende gegevens ten behoeve van het door Onze
      Minister te voeren beleid met betrekking tot het onderwijs, bedoeld in deze wet, en verleent desgevraagd
      medewerking aan door of namens Onze Minister uit te voeren onderzoek dat geheel of mede op deze gegevens is
      gebaseerd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel159
  - number: '159.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de definiëring,
      de wijze van ordening en de beschikbaarstelling van de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel159
  - number: '160'
    text: |-
      De voorschriften, bedoeld in [artikel 157, derde lid][ref1], [artikel 158, tweede lid][ref2], en
      [artikel 159, tweede lid][ref3], hebben geen betrekking op het persoonsgebonden nummer van een leerling of op
      andere gegevens waarmee een leerling wordt geïdentificeerd of identificeerbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel158
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel159
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '157'
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '158'
        afdeling: '10'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '159'
        afdeling: '10'
  - number: 162a.1
    text: |-
      Onder een voortijdige schoolverlater in de zin van deze afdeling wordt verstaan degene op wie
      [artikel 47a, eerste lid onder a en b][ref1], van toepassing is en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel47a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 47a
        paragraaf: '3'
        afdeling: '1'
  - number: 162a.1.a
    text: |-
      die het onderwijs aan de school waaraan hij is ingeschreven gedurende een aaneengesloten periode van ten minste
      vier weken of een door het bevoegd gezag te bepalen kortere periode zonder geldige reden, waaronder in ieder geval
      de redenen, bedoeld in [artikel 47b, tweede lid][ref1], worden verstaan, niet meer volgt, of


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel47b
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 47b
        paragraaf: '3'
        afdeling: '1'
  - number: 162a.1.b
    text: |-
      die niet meer aan een school is ingeschreven en evenmin is ingeschreven aan een school als
      bedoeld in de [Wet op het voortgezet onderwijs][ref1] dan wel aan een instelling als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162a
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0007625
  - number: 162a.2
    text: |-
      Voor zover nodig in afwijking van het eerste lid wordt onder een voortijdig schoolverlater niet
      verstaan degene die in het bezit is van een getuigschrift van het arbeidsmarktgerichte uitstroomprofiel
      als bedoeld in [artikel 14d][ref1], een getuigschrift van het uitstroomprofiel dagbesteding
      als bedoeld in [artikel 14g][ref2], een getuigschrift van het praktijkonderwijs als bedoeld in
      [artikel 10f van de Wet op het voortgezet onderwijs][ref3] dan wel een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid onderdeel a, van de Wet educatie en beroepsonderwijs][ref4] en werkzaam is op grond van
      een arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14d
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel14g
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 14d
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 14g
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10f
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 162b.1
    text: |-
      Burgemeester en wethouders dragen zorg voor registratie van de gegevens die het bevoegd gezag ingevolge
      [artikel 47a][ref1] heeft gemeld of waarover zij op grond van [artikel 47b][ref2] of op grond van
      [artikel 21, eerste lid, van de Wet register onderwijsdeelnemers][ref3] beschikken. Burgemeester en
      wethouders dragen bovendien zorg voor een systeem van doorverwijzing naar onderwijs of arbeidsmarkt van de in
      [artikel 162a][ref4] bedoelde voortijdige schoolverlaters en voor het onderhoud van dit systeem. Het systeem
      heeft mede betrekking op de gegevens waarover de gemeente beschikt in het kader van de uitvoering van de
      [Leerplichtwet 1969][ref5]. Burgemeester en wethouders volgen de deelname aan onderwijs en arbeidsmarkt van de
      personen, bedoeld in [artikel 162a, tweede lid][ref6], die de leeftijd van 23 jaren nog niet hebben bereikt. Voor
      de uitvoering van de eerste, tweede en vierde volzin kunnen bij ministeriële regeling nadere voorschriften worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel47a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel47b
      [ref3]: https://wetten.overheid.nl/BWBR0042012#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel162a
      [ref5]: https://wetten.overheid.nl/BWBR0002628
      [ref6]: https://wetten.overheid.nl/BWBR0003549#Artikel162a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 47a
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 47b
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0042012
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: 162a
        afdeling: 10A
      - id: ref5
        bwb_id: BWBR0002628
      - id: ref6
        bwb_id: BWBR0003549
        artikel: 162a
        afdeling: 10A
  - number: 162b.2
    text: |-
      Voor de vervulling van hun in het eerste lid bedoelde taken werken de colleges van burgemeester en wethouders
      samen binnen bij of krachtens algemene maatregel van bestuur vastgestelde regio's. Zij maken tevens afspraken
      met scholen, scholen en instellingen als bedoeld in de [Wet op het voortgezet onderwijs][ref1], instellingen als
      bedoeld in de [Wet educatie en beroepsonderwijs][ref2] en organisaties die zijn betrokken bij het voorkomen en
      bestrijden van voortijdig schoolverlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162b
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0007625
  - number: 162b.3
    text: |-
      De colleges van burgemeester en wethouders in een regio wijzen uit hun midden een contactgemeente aan. Deze
      aanwijzing wordt onverwijld gemeld aan Onze Minister. Burgemeester en wethouders van de contactgemeente vervullen
      coördinerende taken met het oog op het voorkomen en bestrijden van voortijdig schoolverlaten. In dat verband:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162b
  - number: 162b.3.a
    text: |-
      maken zij afspraken met de in het tweede lid bedoelde scholen, instellingen en organisaties over de inzet en
      verantwoordelijkheid bij het voorkomen en bestrijden van voortijdig schoolverlaten;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162b
  - number: 162b.3.b
    text: dragen zij zorg voor de totstandkoming van een regionaal netwerk van die scholen, instellingen en organisaties;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162b
  - number: 162b.3.c
    text: organiseren en coördineren zij de in het eerste lid bedoelde melding, registratie en doorverwijzing.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162b
  - number: 162b.4
    text: |-
      Indien colleges van burgemeester en wethouders in een regio een andere contactgemeente aanwijzen, dragen
      burgemeester en wethouders van de vorige contactgemeente alle bescheiden die betrekking hebben op de uitvoering van
      dit artikel over aan burgemeester en wethouders van de opvolgende contactgemeente. De wijziging van de aanwijzing
      wordt onverwijld gemeld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162b
  - number: 162b.5
    text: |-
      Ter tegemoetkoming in de kosten van uitvoering van het eerste tot en met derde lid kent Onze Minister onverminderd
      [artikel 162c1, vierde lid][ref1], binnen het raam van de door de begrotingswetgever beschikbaar gestelde middelen
      jaarlijks uiterlijk in september ten behoeve van de activiteiten van de colleges van burgemeester en wethouders
      in de regio aan de contactgemeente een specifieke uitkering toe. Deze uitkering heeft betrekking op het daarop
      volgende kalenderjaar. De contactgemeente draagt er zorg voor dat de colleges van burgemeester en wethouders in
      de regio gebruik kunnen maken van de instrumenten die met behulp van deze uitkering zijn verwezenlijkt. Bij of
      krachtens algemene maatregel van bestuur worden regels gegeven voor de berekening en betaling van de uitkering.
      De berekening geschiedt in elk geval aan de hand van het aantal volwassen inwoners van de gemeenten in de regio
      op 1 januari van het jaar voorafgaande aan het jaar van de uitkering, waarbij rekening wordt gehouden met het
      opleidingsniveau en met de etnische achtergrond van die inwoners. Bij de berekening van een deel van de uitkering
      kunnen de volwassen inwoners van gemeenten die op grond van een andere regeling reeds een vergoeding voor de
      bestrijding van voortijdig schoolverlaten ontvangen, buiten beschouwing worden gelaten. Onze Minister hanteert het
      aantal volwassen inwoners van de gemeenten in de regio dat blijkt uit de gegevens die het Centraal Bureau voor de
      Statistiek op verzoek van Onze Minister daarover verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel162c1
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 162c1
        afdeling: 10A
  - number: 162b.6
    text: |-
      Het bevoegd gezag geeft aan de door burgemeester en wethouders aangewezen personen alle gevraagde bescheiden ter
      inzage en verstrekt de gevraagde inlichtingen die van belang zijn voor het voorkomen en bestrijden van voortijdig
      schoolverlaten.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162b
  - number: 162b.7
    text: |-
      De gemeenteraden in een regio stellen streefcijfers vast voor de in die regio te behalen resultaten.
      Burgemeester en wethouders van de contactgemeente stellen mede namens de andere gemeenten in de regio jaarlijks
      een effectrapportage vast waarin zowel de streefcijfers als de bereikte resultaten zijn aangegeven en waarin
      afwijkingen worden toegelicht.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162b
  - number: 162b.8
    text: |-
      Indien burgemeester en wethouders van de contactgemeente het bepaalde bij of krachtens het eerste tot en met
      zevende lid niet nakomen, kan Onze Minister de uitkering geheel of gedeeltelijk inhouden of opschorten. Onze
      Minister gaat niet over tot gehele of gedeeltelijke inhouding dan na overleg met burgemeester en wethouders van
      de contactgemeente. Onze Minister kan de uitkering wederom toekennen indien de reden voor inhouding of opschorting
      is vervallen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162b
  - number: 162b.9
    text: |-
      Onze Minister kan de in het vijfde lid bedoelde uitkering geheel of gedeeltelijk terugvorderen indien uit de
      informatie, bedoeld in [artikel 17a van de Financiële-verhoudingswet][ref1], niet blijkt dat de uitkering is
      besteed in overeenstemming met dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162b
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: 162c.1
    text: |-
      Burgemeester en wethouders van de contactgemeente zenden de in [artikel 162b, zevende lid][ref1], bedoelde
      effectrapportage aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel162b
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162c
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 162b
        afdeling: 10A
  - number: 162c.2
    text: |-
      Burgemeester en wethouders zijn gehouden aan de door Onze Minister aangewezen personen alle gevraagde bescheiden
      ter inzage te geven en de gevraagde inlichtingen te verstrekken die van belang zijn voor het door Onze Minister te
      voeren beleid met betrekking tot het voortijdig schoolverlaten door niet-leerplichtigen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162c
  - number: 162c.3
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent het tijdstip van indiening en de
      inrichting van de effectrapportage en inzake de wijze van beschikbaarstelling van de gegevens, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162c
  - number: 162c1.1
    text: |-
      Burgemeester en wethouders in een regio als bedoeld in [artikel 162b, tweede lid][ref1], en de in dat lid bedoelde
      scholen, instellingen en organisaties stellen telkens voor een periode van vier jaren een regionaal programma
      op met maatregelen ter voorkoming en bestrijding van voortijdig schoolverlaten van jongeren tussen twaalf en
      drieëntwintig jaar. Het programma heeft mede betrekking op leer- en kwalificatieplichtigen en het volgen door
      burgemeester en wethouders van de deelname aan onderwijs en arbeidsmarkt van de personen, bedoeld in artikel 162b,
      eerste lid, vierde volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel162b
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162c1
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 162b
        afdeling: 10A
  - number: 162c1.2
    text: |-
      Burgemeester en wethouders in een regio als bedoeld in [artikel 162b, tweede lid][ref1], en de in dat lid bedoelde
      scholen, instellingen en organisaties voeren regionaal bestuurlijk overleg over de totstandkoming van het regionaal
      programma en de uitvoering en financiering van de daarin opgenomen maatregelen. Bij het overleg worden tevens de
      domeinen arbeid en zorg betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel162b
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162c1
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 162b
        afdeling: 10A
  - number: 162c1.3
    text: |-
      Burgemeester en wethouders van de contactgemeente coördineren het regionaal bestuurlijk overleg, de totstandkoming
      van het regionaal programma en de uitvoering en financiering van de daarin opgenomen regionale maatregelen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162c1
  - number: 162c1.4
    text: |-
      De specifieke uitkering, bedoeld in [artikel 162b, vijfde lid][ref1], is mede bestemd voor de uitvoering van het
      regionaal programma.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel162b
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162c1
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 162b
        afdeling: 10A
  - number: 162c1.5
    text: |-
      Burgemeester en wethouders van de contactgemeente geven in de effectrapportage, bedoeld in
      [artikel 162b, zevende lid][ref1], aan hoe de domeinen arbeid en zorg bij het regionale bestuurlijk overleg zijn
      betrokken en welke resultaten hiermee zijn bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel162b
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162c1
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 162b
        afdeling: 10A
  - number: 162d
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162d
  - number: 162d.a
    text: |-
      instelling voor hoger onderwijs: een instelling voor hoger onderwijs als bedoeld in artikel 1.1, onder g, van de
      Wet op het hoger onderwijs en wetenschappelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162d
  - number: 162d.b
    text: |-
      instellingsbestuur: het instellingsbestuur, bedoeld in artikel 1.1, onderdeel j, van de Wet op het hoger onderwijs
      en wetenschappelijk onderzoek, met dien verstande dat voor zover het openbare instellingen betreft, de artikelen
      9.2, tweede lid, 10.9, tweede lid, en 11.1, tweede lid, van die wet van overeenkomstige toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162d
  - number: 162e.1
    text: |-
      Aan degene die blijkens een geschiktheidsonderzoek als bedoeld in artikel 162f voldoende geschikt wordt geacht
      voor het beroep van leraar en in staat moet worden geacht binnen twee jaar na benoeming of tewerkstelling zonder
      benoeming tot leraar met goed gevolg deel te nemen aan het in artikel 162i bedoelde bekwaamheidsonderzoek,
      wordt een geschiktheidsverklaring afgegeven door het instellingsbestuur onder verantwoordelijkheid waarvan het
      geschiktheidsonderzoek wordt uitgevoerd of door het bestuur van een op grond van artikel 162h, eerste lid, erkende
      instelling.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162e
  - number: 162e.2
    text: Bij ministeriële regeling wordt een model voor de geschiktheidsverklaring vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162e
  - number: 162e.3
    text: |-
      Op 31 juli 2006 nog geldige geschiktheidsverklaringen, afgegeven op grond van de Interimwet zij-instroom leraren
      primair en voortgezet onderwijs, gelden vanaf 1 augustus 2006 als te zijn afgegeven op grond van het eerste lid,
      indien deze verklaringen vanaf dat tijdstip geldig zouden zijn geweest.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162e
  - number: 162f.1
    text: |-
      Het geschiktheidsonderzoek wordt op aanvraag van het bevoegd gezag dat voornemens is betrokkene te benoemen of
      tewerktestellen zonder benoeming, of op aanvraag van betrokkene zelf, uitgevoerd onder verantwoordelijkheid van
      het bestuur van een instelling die op grond van [artikel 162h][ref1] is erkend. Dat instellingsbestuur betrekt bij
      het geschiktheidsonderzoek het bevoegd gezag dat voornemens is betrokkene te benoemen of tewerktestellen zonder
      benoeming, of indien betrokkene de aanvraag zelf indient, een bevoegd gezag dat daartoe in overeenstemming met
      betrokkene is uitgenodigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel162h
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162f
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 162h
        afdeling: 10B
  - number: 162f.2
    text: 'Het geschiktheidsonderzoek omvat:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162f
  - number: 162f.2.a
    text: |-
      de beoordeling of de gevolgde opleiding en de maatschappelijke of beroepservaring van betrokkene, in onderlinge
      samenhang bezien, van voldoende belang zijn in verhouding tot de door deze beoogde werkzaamheden aan een school, en
      indien dat het geval is
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162f
  - number: 162f.2.b
    text: |-
      het onderzoek naar de geschiktheid van betrokkene voor die werkzaamheden, waartoe in ieder geval wordt gerekend de
      beoordeling of betrokkene in de feitelijke klassituatie tot verantwoord lesgeven in staat is, alsmede
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162f
  - number: 162f.2.c
    text: |-
      de beoordeling, welke scholing en begeleiding voor betrokkene noodzakelijk moeten worden geacht om met goed gevolg
      deel te kunnen nemen aan het bekwaamheidsonderzoek.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162f
  - number: 162f.3
    text: 'Uit de aanvraag voor het geschiktheidsonderzoek blijkt dat betrokkene in het bezit is van:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162f
  - number: 162f.3.a
    text: |-
      een getuigschrift van met goed gevolg afgelegd afsluitend examen van een opleiding
      in het wetenschappelijk onderwijs of in het hoger beroepsonderwijs als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], dan wel van een erkenning van
      beroepskwalificaties als bedoeld in [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162f
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 162f.3.b
    text: |-
      een diploma van een middenkaderopleiding of van een specialistenopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder d respectievelijk e, van de Wet educatie en beroepsonderwijs][ref1], of
      van een vakopleiding als bedoeld in artikel 7.2.2, eerste lid, onder c, van die wet, aangewezen op grond van
      [artikel 7.24, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], voorzover
      betrokkene voornemens is onderwijs te geven in bij algemene maatregel van bestuur aangewezen beroepsgerichte
      vakken van het onderwijs, bedoeld in artikel 14a, eerste lid, onderdeel a, dan wel van een erkenning van
      beroepskwalificaties als bedoeld in [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref3] voor
      overeenkomstig onderwijs, of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162f
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 162f.3.c
    text: |-
      een buitenlands getuigschrift dat naar het oordeel van het bestuur van de instelling die het geschiktheidsonderzoek
      uitvoert, gelijkwaardig is aan een getuigschrift of diploma als bedoeld onder a respectievelijk b.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162f
  - number: 162f.4
    text: |-
      Het in het tweede lid, onder b, bedoelde onderzoek is erop gericht, vast te stellen of betrokkene in voldoende
      mate beschikt over kennis, inzicht en vaardigheden om te kunnen worden belast met het geven van onderwijs dat
      voldoet aan de daaraan gestelde kwaliteitseisen, in aanmerking nemend dat betrokkene in de periode van benoeming
      of tewerkstelling zonder benoeming begeleid en verder geschoold zal worden om met goed gevolg deel te kunnen nemen
      aan het bekwaamheidsonderzoek. De in de eerste volzin bedoelde kennis en vaardigheden en het in die volzin bedoelde
      inzicht zijn afgeleid van de in [artikel 32a, eerste lid][ref1], bedoelde bekwaamheidseisen en omvatten in het
      bijzonder beroepsmatige vaardigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162f
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 32a
        paragraaf: '2'
        afdeling: '1'
  - number: 162f.5
    text: 'Het geschiktheidsonderzoek is zodanig ingericht dat daarbij in gelijke mate zijn betrokken:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162f
  - number: 162f.5.a
    text: personen die zijn belast of belast zijn geweest met het geven van onderwijs aan een lerarenopleiding, alsmede
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162f
  - number: 162f.5.b
    text: |-
      leraren in het desbetreffende vak of vakgebied, niet zijnde personeelsleden van het bevoegd gezag dat is betrokken
      bij het geschiktheidsonderzoek.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162f
  - number: 162f.6
    text: |-
      Ten behoeve van het uitvoeren van het geschiktheidsonderzoek is de aanvrager aan de instelling die het onderzoek
      zal verrichten, een bij ministeriële regeling vast te stellen bijdrage verschuldigd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162f
  - number: 162f.7
    text: |-
      De algemene maatregel van bestuur, bedoeld in het derde lid, onderdeel b, wordt aan beide Kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken
      en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162f
  - number: 162g.1
    text: |-
      Het instellingsbestuur van een instelling voor hoger onderwijs die werkzaamheden uitvoert als bedoeld in artikel
      162j, eerste lid, onder a, is partij bij de in artikel 38a, eerste lid, bedoelde overeenkomst.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162g
  - number: 162g.2
    text: |-
      Indien na het sluiten van die overeenkomst blijkt dat de scholing of begeleiding niet volgens de overeenkomst kan
      worden uitgevoerd, treft dat instellingsbestuur tijdig een toereikende vervangende voorziening.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162g
  - number: 162h.1
    text: |-
      Onze Minister kan op aanvraag van het bestuur een instelling, niet zijnde een instelling als bedoeld in
      [artikel 8, eerste lid, tweede en derde volzin][ref1], erkennen als bevoegd tot het uitvoeren of onder zijn
      verantwoordelijkheid doen uitvoeren van het geschiktheidsonderzoek. Erkenning vindt plaats indien het bestuur in
      zijn aanvraag ten genoegen van Onze Minister aantoont dat de instelling het geschiktheidsonderzoek onafhankelijk,
      deskundig en betrouwbaar zal uitvoeren. Bij algemene maatregel van bestuur kunnen regels worden vastgesteld met
      betrekking tot de toepassing van de tweede volzin, waaronder regels over de behandeling en beoordeling van de
      aanvraag. Een erkende instelling heeft tevens de bevoegdheid tot het verstrekken van geschiktheidsverklaringen op
      grond van het geschiktheidsonderzoek en tot het doen van voorstellen over de noodzakelijke scholing en begeleiding,
      met inachtneming van [artikel 162f, tweede lid, onder c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel162f
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162h
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '8'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 162f
        afdeling: 10B
  - number: 162h.2
    text: |-
      Ten behoeve van de behandeling van aanvragen om erkenning kan Onze Minister een bij ministeriële regeling te
      bepalen bijdrage verlangen van het bestuur van de instelling.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162h
  - number: 162h.3
    text: |-
      Onze Minister kan de erkenning intrekken indien de instelling, bedoeld in het eerste lid, naar het oordeel van Onze
      Minister het geschiktheidsonderzoek niet langer onafhankelijk, deskundig of betrouwbaar uitvoert.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162h
  - number: 162h.4
    text: |-
      Instellingen voor hoger onderwijs die op 31 juli 2006 op grond van de
      [Interimwet zij-instroom leraren primair en voortgezet onderwijs][ref1] bevoegd waren tot het verrichten van een
      geschiktheidsonderzoek worden aangemerkt als instellingen met een erkenning als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011469
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162h
    references:
      - id: ref1
        bwb_id: BWBR0011469
  - number: 162i
    text: |-
      Het bekwaamheidsonderzoek strekt ertoe, vast te stellen of de leraar voldoet aan de in artikel 32a, eerste lid,
      bedoelde bekwaamheidseisen voor het onderwijs waarvoor die eisen zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162i
  - number: 162j.1
    text: |-
      Het instellingsbestuur van een instelling voor hoger onderwijs die opleidt voor het voldoen aan bekwaamheidseisen
      als bedoeld in [artikel 32a, eerste lid][ref1], en die zich daartoe bij Onze Minister heeft gemeld, is na die
      melding en onder overlegging van een plan van aanpak, bevoegd tot:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162j
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 32a
        paragraaf: '2'
        afdeling: '1'
  - number: 162j.1.a
    text: |-
      het verzorgen of doen verzorgen van de in artikel 162f, tweede lid, onder c, bedoelde scholing en begeleiding, voor
      zover deze verband houden met opleidingen die de instelling verzorgt, of
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162j
  - number: 162j.1.b
    text: |-
      het uitvoeren of onder zijn verantwoordelijkheid doen uitvoeren van bekwaamheidsonderzoek, voor zover de instelling
      opleidt voor het desbetreffende getuigschrift, dan wel
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162j
  - number: 162j.1.c
    text: zowel de onder a als de onder b bedoelde activiteiten.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162j
  - number: 162j.2
    text: |-
      Het instellingsbestuur van een instelling voor hoger onderwijs die op grond van het eerste lid, onder b, bevoegd
      is tot het uitvoeren van het bekwaamheidsonderzoek, stelt de leraar die zich daartoe heeft gemeld en voor wie
      de scholing en begeleiding zijn afgerond overeenkomstig de in artikel 38a bedoelde overeenkomst, tijdig in de
      gelegenheid deel te nemen aan dat onderzoek.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162j
  - number: 162j.3
    text: |-
      Het instellingsbestuur kan bepalen dat de aanvrager van het bekwaamheidsonderzoek aan dat bestuur een bijdrage is
      verschuldigd voor uitvoering van dat onderzoek. Bij ministeriële regeling kan voor deze bijdrage een maximum worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162j
  - number: 162j.4
    text: |-
      Een melding, gedaan voor 1 augustus 2006 onder overlegging van een plan van aanpak als bedoeld in
      [artikel 7, eerste lid, van de Interimwet zij-instroom leraren primair en voortgezet onderwijs][ref1], zoals dat
      artikel luidde op 31 juli 2006, geldt als te zijn gedaan op grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011469#Artikel7
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162j
    references:
      - id: ref1
        bwb_id: BWBR0011469
        artikel: '7'
  - number: 162k.1
    text: |-
      Het in artikel 162h en het in artikel 162j bedoelde bestuur dragen zorg voor de kwaliteit van de werkzaamheden van
      de instelling.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162k
  - number: 162k.2
    text: |-
      Onze Minister kan een instelling een of meer van de in artikel 162h of artikel 162j, eerste lid, bedoelde
      bevoegdheden ontnemen indien gebleken is dat de kwaliteit van de uitoefening daarvan tekortschiet, dan wel indien
      niet of niet meer wordt voldaan aan het terzake bij en krachtens deze wet bepaalde. Artikel 6.10, vierde lid, van
      de Wet op het hoger onderwijs en wetenschappelijk onderzoek is van overeenkomstige toepassing ten aanzien van de
      ontneming.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162k
  - number: 162l.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften vastgesteld voor de uitvoering van
      artikel 162f, tweede lid onder b, en vierde lid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162l
  - number: 162l.2
    text: |-
      Tevens kunnen bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur voorschriften worden
      vastgesteld voor de uitvoering van deze afdeling, waaronder in elk geval voorschriften met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162l
  - number: 162l.2.a
    text: waarborging van de kwaliteit van het geschiktheidsonderzoek en van de instellingen die dat onderzoek uitvoeren,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162l
  - number: 162l.2.b
    text: |-
      de scholing en begeleiding, en het bekwaamheidsonderzoek, waaronder voorschriften ter waarborging van de kwaliteit,
      alsmede
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162l
  - number: 162l.2.c
    text: de procedure voor het aanvragen van het geschiktheidsonderzoek en voor afgifte van de geschiktheidsverklaring.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162l
  - number: 162l.3
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, wordt aan de beide Kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en niet door
      of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde onderwerp bij de
      wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162l
  - number: 162m
    text: |-
      Het in [artikel 162h][ref1] en [artikel 162j][ref2] bedoelde bestuur verstrekken aan Onze Minister
      alle inlichtingen die deze nodig acht ten behoeve van een goede naleving van deze afdeling. Het bestuur
      zendt de inspectie van het onderwijs telkens na zes maanden een overzicht van in die periode afgegeven
      geschiktheidsverklaringen en bekwaamheidsonderzoeken waaraan met goed gevolg is deelgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel162h
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel162j
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel162m
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 162h
        afdeling: 10B
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 162j
        afdeling: 10B
  - number: '163.1'
    text: |-
      Onze Minister kan bepalen dat geen of slechts gedeeltelijke bekostiging wordt verstrekt voor uitgaven die het
      gevolg zijn van schuld of nalatigheid van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel163
  - number: '163.2'
    text: |-
      Indien de uitgaven bedoeld in het eerste lid, voor bekostiging door het Rijk in aanmerking komen, treedt het Rijk
      op het moment van een uitdrukkelijk besluit tot bekostiging in alle rechten die het bevoegd gezag ter zake tegen
      derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel163
  - number: '163.3'
    text: |-
      Indien de gemeente een collectieve verzekering heeft afgesloten voor de vergoeding van schade, ontstaan aan
      gebouwen, terreinen of roerende zaken van een door de gemeente bekostigde niet door de gemeente in stand gehouden
      school, heeft het bevoegd gezag van de desbetreffende school jegens de gemeente geen aanspraak op vergoeding van
      dergelijke schade, voor zover die collectieve verzekering de schade dekt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel163
  - number: '163.4'
    text: |-
      Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een niet door de gemeente in stand gehouden
      school voor vergoeding door de gemeente in aanmerking komt, treedt de gemeente op het moment van een uitdrukkelijk
      besluit tot vergoeding in alle rechten die het bevoegd gezag ter zake van die schade tegen derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel163
  - number: 164a.1
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een leerling gebruiken in het verkeer met de leerling op wie
      het nummer betrekking heeft, of, indien de leerling minderjarig of handelingsonbekwaam is, met de ouders van deze
      leerling.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel164a
  - number: 164a.4
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een leerling, al dan niet tezamen met een of meer
      van de gegevens, bedoeld in [artikel 12, eerste lid, van de Wet register onderwijsdeelnemers][ref1],
      gebruiken in het verkeer met Onze Minister ten behoeve van de vaststelling van de bekostiging van
      de school. De vorige volzin is van overeenkomstige toepassing op het persoonsgebonden nummer van
      een leerling als bedoeld in [artikel 8a, eerste lid][ref2], die is ingeschreven bij een school als
      bedoeld in de [Wet op het primair onderwijs][ref3], de [Wet op het voortgezet onderwijs][ref4] of de
      [Wet educatie en beroepsonderwijs][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel8a
      [ref3]: https://wetten.overheid.nl/BWBR0003420
      [ref4]: https://wetten.overheid.nl/BWBR0002399
      [ref5]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel164a
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 8a
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003420
      - id: ref4
        bwb_id: BWBR0002399
      - id: ref5
        bwb_id: BWBR0007625
  - number: 164a.5
    text: |-
      Het bevoegd gezag en het hoofd, bedoeld in [artikel 1, onder d, van de Leerplichtwet 1969][ref1],
      gebruiken het persoonsgebonden nummer van een leerling in contacten met een gemeente in het kader van de
      [Leerplichtwet 1969][ref2], tezamen met de gegevens die noodzakelijk zijn voor het toezicht op de naleving van die
      wet door de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel164a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002628
  - number: 164a.6
    text: |-
      Het bevoegd gezag gebruikt bij de opgave aan burgemeester en wethouders, bedoeld in
      [artikel 42b, eerste lid][ref1], en [artikel 47a, eerste lid][ref2], het persoonsgebonden nummer van de
      betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel42b
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel47a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel164a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 42b
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 47a
        paragraaf: '3'
        afdeling: '1'
  - number: 164a.7
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in het contact met een andere school of
      een school of instelling voor ander onderwijs ten behoeve van de in- en uitschrijving van die leerling, bij het
      overleggen van het onderwijskundig rapport, bedoeld in [artikel 43][ref1] en ten behoeve van het onderwijs in een
      doorlopende leerroute vmbo-mbo als bedoeld in [artikel 10b10 van de Wet op het voortgezet onderwijs][ref2] of de
      geïntegreerde route vmbo-basisberoepsopleiding, bedoeld in [artikel 10b21 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b10
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10b21
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel164a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '43'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b10
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10b21
  - number: 164a.9
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in het kader van de uitvoering van
      subsidieregelingen van het Europees Sociaal Fonds.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel164a
  - number: 164a.10
    text: |-
      Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een leerling ter uitvoering van
      [artikel 107, vijfde lid, van de Vreemdelingenwet 2000][ref1], anders dan ter nakoming van verplichtingen als
      referent in de zin van [artikel 1 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel164a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '1'
  - number: 164a.11
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in contacten met een school als
      bedoeld in de [Wet op het primair onderwijs][ref1], de [Wet op het voortgezet onderwijs][ref2] of de
      [Wet educatie en beroepsonderwijs][ref3] in het kader van de ondersteuning van de school op grond van
      [artikel 8a, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0002399
      [ref3]: https://wetten.overheid.nl/BWBR0007625
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel8a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel164a
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0002399
      - id: ref3
        bwb_id: BWBR0007625
      - id: ref4
        bwb_id: BWBR0003549
        artikel: 8a
        paragraaf: '1'
        afdeling: '1'
  - number: 164a.12
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een leerling eenmalig gebruiken ten behoeve van het genereren
      van een pseudoniem voor deze leerling met het oog op het bieden van voorzieningen in het kader van het onderwijs
      en de begeleiding van leerlingen. Het bevoegd gezag draagt er zorg voor dat het pseudoniem wordt bewaard in de
      systemen waarin de leerlingen zijn geregistreerd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel164a
  - number: 164a.13
    text: |-
      Het bevoegd gezag kan het pseudoniem, bedoeld in het twaalfde lid, gebruiken voor het genereren van een ander
      pseudoniem voor een leerling in het kader van de toegang tot en het gebruik van digitale leermiddelen of het
      digitaal afnemen van toetsen en examens, waarbij het bevoegd gezag er zorg voor draagt dat dit andere pseudoniem
      wordt bewaard in de systemen waarin de leerlingen zijn geregistreerd. Dit andere pseudoniem wordt uitsluitend
      verstrekt aan een leverancier die een digitaal product of een digitale dienst aanbiedt bestaande uit leerstof of
      toetsen en de daarmee samenhangende digitale diensten.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel164a
  - number: 164a.14
    text: |-
      Bij algemene maatregel van bestuur kunnen andere gevallen worden aangewezen dan het geval, bedoeld in het dertiende
      lid, waarvoor het bevoegd gezag op basis van het pseudoniem, bedoeld in het twaalfde lid, een ander pseudoniem kan
      genereren. Daarbij worden in ieder geval de categorieën van ontvangers van dit andere pseudoniem aangewezen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel164a
  - number: 164a.15
    text: |-
      Bij ministeriële regeling worden regels gesteld over de voorwaarden waaronder de pseudoniemen, bedoeld in het
      twaalfde tot en met het veertiende lid, kunnen worden gegenereerd en gebruikt. Deze voorwaarden betreffen in ieder
      geval de duur en de beveiliging, waaronder de gescheiden opslag van de pseudoniemen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel164a
  - number: 164e
    text: |-
      Onverminderd het overigens bij of krachtens de wet bepaalde omtrent het gebruik van het burgerservicenummer door de
      gemeente, gebruikt de gemeente het persoonsgebonden nummer van een leerling of een voortijdige schoolverlater als
      bedoeld in [artikel 162a][ref1] uitsluitend ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel162a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel164e
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 162a
        afdeling: 10A
  - number: 164e.a
    text: |-
      een registratie van leerplichtige jongeren in het belang van het toezicht op de naleving van de
      [Leerplichtwet 1969][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel164e
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 164e.b
    text: |-
      de registratie van gegevens van voortijdige schoolverlaters, bedoeld in
      [artikel 162b, eerste lid, eerste volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel162b
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel164e
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 162b
        afdeling: 10A
  - number: 164e.c
    text: |-
      het systeem van doorverwijzing van voortijdige schoolverlaters naar onderwijs of arbeidsmarkt, bedoeld in
      [artikel 162b, eerste lid, tweede en derde volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel162b
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel164e
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 162b
        afdeling: 10A
  - number: 164e.d
    text: |-
      verwerking van de gegevens, bedoeld in [artikel 21, eerste lid, van de Wet register onderwijsdeelnemers][ref1]
      en in [artikel 47b, vierde lid][ref2], bij de registraties, bedoeld in de onderdelen a en b, en het systeem van
      doorverwijzing, bedoeld in onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel47b
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel164e
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 47b
        paragraaf: '3'
        afdeling: '1'
  - number: '165'
    text: Schoolbegeleiding vindt plaats op verzoek van het bevoegd gezag van een school.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel165
  - number: '166.1'
    text: |-
      Het Rijk verstrekt aan schoolbegeleidingsdiensten bekostiging voor activiteiten die worden verricht met betrekking
      tot de ondersteuning bij het onderwijs aan zieke leerlingen als bedoeld in [artikel 18a][ref1]. Bij ministeriële
      regeling kunnen nadere regels worden gesteld voor de uitvoering van de activiteiten, bedoeld in de vorige volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel18a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 18a
        paragraaf: '1'
        afdeling: '1'
  - number: '166.2'
    text: |-
      Schoolbegeleidingsdiensten als bedoeld in het eerste lid, zijn de schoolbegeleidingsdiensten die
      voor de ondersteuning bij het onderwijs aan zieke leerlingen als bedoeld in [artikel 18a][ref1]
      in de periode 1 augustus 1999 tot 1 augustus 2004 subsidie ontvingen van een gemeente op grond van
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ________________________________________________________________________________________________________________,
      zoals dat artikel luidde op de dag direct voorafgaand aan het tijdstip waarop die wet is vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0010086#ArtikelIX
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 18a
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0010086
        artikel: IX
  - number: 166a.1
    text: |-
      Het Rijk verstrekt jaarlijks aan het bevoegd gezag van een school, bekostiging die kan worden besteed ten behoeve
      van schoolbegeleiding.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel166a
  - number: 166a.2
    text: |-
      De bekostiging, bedoeld in het eerste lid, wordt voor elk schooljaar berekend door het aantal leerlingen op
      de teldatum 1 oktober van het voorafgaande schooljaar te vermenigvuldigen met een bedrag dat jaarlijks bij
      ministeriële regeling wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel166a
  - number: '167.1'
    text: |-
      Indien een bij of krachtens de wet gestelde termijn door het bevoegd gezag wordt overschreden en de gemeente
      daardoor geen bekostiging van het Rijk dan wel lagere bekostiging of met ingang van een latere datum bekostiging
      van het Rijk voor de materiële instandhouding ontvangt dan het geval zou zijn geweest indien deze termijn wel in
      acht was genomen, vergoedt het bevoegd gezag de door de gemeente geleden schade.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel167
  - number: '167.2'
    text: |-
      Indien een bij of krachtens de wet gestelde termijn door burgemeester en wethouders wordt overschreden en het
      bevoegd gezag daardoor geen bekostiging van het Rijk dan wel lagere bekostiging of met ingang van een latere datum
      bekostiging van het Rijk voor de materiële instandhouding ontvangt dan het geval zou zijn geweest indien deze
      termijn in acht was genomen, vergoedt de gemeente de door het bevoegd gezag geleden schade.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel167
  - number: '167.3'
    text: |-
      Burgemeester en wethouders en het bevoegd gezag kunnen in onderling overleg de in het eerste en tweede lid
      bedoelde verplichting tot schadevergoeding matigen. Indien dit overleg niet tot overeenstemming leidt, is
      [artikel 109 van boek 6 van het Burgerlijk Wetboek][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel109
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '109'
  - number: '168'
    text: |-
      Het bevoegd gezag van een bijzondere school is verplicht de uit de overheidskassen ontvangen gelden overeenkomstig
      de bestemming te gebruiken. Van de inkomsten en uitgaven wordt volgens bij algemene maatregel van bestuur te geven
      voorschriften nauwkeurig boekgehouden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel168
  - number: '169.1'
    text: |-
      Het bevoegd gezag van een school is aangesloten bij een door Onze Minister aan te wijzen rechtspersoon met
      volledige rechtsbevoegdheid die zich ten doel stelt waarborgen te bieden voor de kosten voor vervanging bij
      afwezigheid van personeel.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel169
  - number: '169.2'
    text: |-
      Het bevoegd gezag van een school is voorts verplicht jaarlijks een door het bestuur van de in het eerste lid
      bedoelde rechtspersoon te bepalen bijdrage te voldoen aan die rechtspersoon in verband met de kosten voor
      vervanging.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel169
  - number: '169.3'
    text: |-
      Van de in het eerste juncto tweede lid bedoelde verplichting kan Onze Minister op aanvraag van het bevoegd gezag
      ontheffing verlenen op grond van bezwaren van godsdienstige of levensbeschouwelijke aard. Onze Minister verleent
      de ontheffing slechts indien het bevoegd gezag aantoont dat een afdoende andere voorziening is getroffen met
      betrekking tot de gevolgen van vervanging bij afwezigheid van personeel. Onze Minister besluit binnen zes maanden
      na ontvangst van een aanvraag als bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel169
  - number: '169.4'
    text: Het bestuur van de rechtspersoon kan regels vaststellen ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel169
  - number: '169.5'
    text: |-
      Uit 's Rijks kas wordt jaarlijks een door Onze Minister te bepalen bedrag betaald aan de rechtspersoon, bedoeld in
      het eerste lid, in verband met de kosten, bedoeld in dat lid onder b.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel169
  - number: '169.6'
    text: |-
      Op de rechtspersoon, bedoeld in het eerste lid, is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: 169a.1
    text: |-
      De rechtspersoon, bedoeld in [artikel 169][ref1], kan het burgerservicenummer van het personeelslid dat bij
      afwezigheid wordt vervangen, en van degene die het personeelslid tijdelijk vervangt, uitsluitend in het kader van
      het doel, bedoeld in artikel 169, eerste lid, onderdeel a, gebruiken in het verkeer met:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel169
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel169a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '169'
        afdeling: '11'
  - number: 169a.1.a
    text: het personeelslid onderscheidenlijk degene die het personeelslid tijdelijk vervangt,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel169a
  - number: 169a.1.b
    text: het bevoegd gezag van de school dan wel de centrale dienst waar de in onderdeel a bedoelde personen werkzaam zijn,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel169a
  - number: 169a.1.c
    text: Onze Minister,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel169a
  - number: 169a.1.d
    text: |-
      de instantie, bedoeld in [artikel 170, vijfde lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel170
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel169a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '170'
        afdeling: '11'
  - number: 169a.1.e
    text: |-
      het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel169a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 169a.2
    text: |-
      Het burgerservicenummer wordt op een daartoe strekkend verzoek van de in het eerste lid bedoelde rechtspersoon aan
      die rechtspersoon verstrekt door het bevoegd gezag van de school dan wel de centrale dienst waar het personeelslid
      dat bij afwezigheid wordt vervangen, werkzaam is.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel169a
  - number: 169a.3
    text: |-
      Indien dat ten behoeve van het jaarverslag, bedoeld in
      [artikel 18, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], noodzakelijk is, worden gegevens
      daarin slechts zodanig openbaar gemaakt dat daaraan geen herkenbare gegevens over een afzonderlijk persoon kunnen
      worden ontleend, tenzij het betreft de controle op de juistheid van de gegevens in het kader van de controle
      op de rechtmatigheid en de doelmatigheid van aan of door de rechtspersoon gedane uitgaven. Daarbij kunnen de
      burgerservicenummers worden vergeleken met de burgerservicenummers die door andere daartoe bij of krachtens de wet
      bevoegde instanties zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel169a
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: '170.1'
    text: |-
      Het bevoegd gezag van een school is aangesloten bij een door Onze Minister aan te wijzen rechtspersoon
      met volledige rechtsbevoegdheid die zich ten doel stelt waarborgen te bieden voor de kosten van
      werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en
      arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1] ten behoeve van gewezen
      personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '170.2'
    text: |-
      Het bevoegd gezag voldoet aan de rechtspersoon jaarlijks een door het bestuur van die rechtspersoon vast te
      stellen bijdrage in verband met de kosten van werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid
      alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de
      [Ziektewet.][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '170.3'
    text: |-
      Van de in het eerste en tweede lid bedoelde verplichting kan Onze Minister op aanvraag van het bevoegd gezag
      ontheffing verlenen op grond van bezwaren van godsdienstige of levensbeschouwelijke aard. Onze Minister verleent
      de ontheffing slechts, indien het bevoegd gezag aantoont dat een afdoende andere voorziening is getroffen met
      betrekking tot de kosten van werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede uitkeringen
      wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1]. Onze
      Minister besluit binnen zes maanden na ontvangst van een aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '170.4'
    text: |-
      Het bestuur van de rechtspersoon stelt regels vast voor de behandeling, beoordeling en beantwoording van een
      aanvraag van het bevoegd gezag als bedoeld in [artikel 132, tweede lid][ref1]. Indien het bevoegd gezag zich
      beroept op overwegingen van godsdienstige of levensbeschouwelijke aard, betrekt het bestuur van de rechtspersoon
      die overwegingen bij de beoordeling van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel132
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '132'
        paragraaf: '3'
        afdeling: '7'
  - number: '170.5'
    text: |-
      Indien het bestuur van de rechtspersoon de aanvraag heeft ingewilligd, vergoedt hij aan de instantie die de
      werkloosheidsuitkeringen, de suppleties inzake arbeidsongeschiktheid alsmede de uitkeringen wegens ziekte en
      arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1] verstrekt of heeft
      verstrekt, de kosten van die uitkeringen of suppleties.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '170.6'
    text: Tegen een besluit van de rechtspersoon kan beroep worden ingesteld door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel170
  - number: '170.7'
    text: |-
      Op de rechtspersoon, bedoeld in het eerste lid, is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: 170a.1
    text: |-
      De rechtspersoon, bedoeld in [artikel 170][ref1], kan het burgerservicenummer van het gewezen personeelslid,
      uitsluitend in het kader van het doel, bedoeld in artikel 170, eerste lid, gebruiken in het verkeer met:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel170
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel170a
    references:
