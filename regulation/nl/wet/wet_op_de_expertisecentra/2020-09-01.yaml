        artikel: 32a
        paragraaf: '2'
        afdeling: '1'
  - number: 3.2.a
    text: |-
      in het bezit is van een bij ministeriële regeling aangewezen getuigschrift dat specifiek is gericht op de
      bekwaamheid tot het geven van dat onderwijs, of
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel3
  - number: 3.2.b
    text: |-
      onderwijs volgt ter verkrijging van een dergelijk getuigschrift, in welk geval betrokkene het onderwijs in deze
      onderwijsactiviteit mag geven gedurende ten hoogste twee aaneengesloten schooljaren, gerekend vanaf het moment
      waarop betrokkene het onderwijs ter verkrijging van dit getuigschrift voor de eerste maal volgt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel3
  - number: 3.2a
    text: |-
      Het onderwijs in de onderwijsactiviteiten zintuigelijke oefening en lichamelijke oefening in groepen
      bestemd voor leerlingen in het voortgezet speciaal onderwijs wordt, in afwijking van het eerste lid,
      onderdeel b, onder 1, uitsluitend gegeven door degene die in het bezit is van een getuigschrift,
      afgegeven krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], waaruit blijkt
      dat ten aanzien van dat onderwijs is voldaan aan de bekwaamheidseisen die zijn vastgesteld krachtens
      [artikel 36, eerste lid, van de Wet op het voortgezet onderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '36'
  - number: '3.3'
    text: |-
      Onze Minister kan aan personen die in het bezit zijn van een buiten de Europese Economische Ruimte of Zwitserland
      behaald bewijsstuk waarmee de bekwaamheid wordt aangetoond, de bevoegdheid tot het geven van speciaal onderwijs en
      voortgezet speciaal onderwijs verlenen. Hij kan daarbij voorwaarden en beperkingen stellen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel3
  - number: '3.4'
    text: |-
      Onze Minister kan met betrekking tot een vak waarvoor geen lerarenopleiding bestaat en ook anderszins niet aan de
      hand van enig bewijsstuk kan worden aangetoond dat betrokkene voldoet aan de bekwaamheidseisen, verklaren dat een
      leraar wordt geacht te voldoen aan de bekwaamheidseisen tot het geven van voortgezet speciaal onderwijs in dat vak.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel3
  - number: '3.5'
    text: |-
      Bij tijdelijke afwezigheid van een leraar kan ten aanzien van degene die hem vervangt voor ten hoogste twaalf
      maanden worden afgeweken van de eisen, gesteld in het eerste lid, onderdeel b, met dien verstande dat de periode
      van twaalf maanden is verstreken vanaf de dag dat perioden van vervanging als bedoeld in dit lid elkaar met
      tussenpozen van niet meer dan drie maanden hebben opgevolgd en een periode van twaalf maanden, deze tussenpozen
      inbegrepen, is overschreden. Indien in een vacature niet terstond kan worden voorzien door de benoeming of
      tewerkstelling zonder benoeming van een leraar die aan de genoemde eisen voldoet, is het bepaalde in de vorige
      volzin van overeenkomstige toepassing. Deze termijn van een jaar kan met ten hoogste twee jaren worden verlengd
      indien het bevoegd gezag en de betrokkene schriftelijk verklaren dat betrokkene verplicht is zich in te spannen
      binnen twee jaren alsnog te voldoen aan de eisen gesteld in het eerste lid, onderdeel b. Het bevoegd gezag kan
      onder de voorwaarden, genoemd in de vorige volzin, een verlenging van nog eens twee jaren geven indien het dat
      noodzakelijk oordeelt vanwege de kwaliteit en de voortgang van het onderwijs op de school. Het bevoegd gezag
      beschikt over geordende gegevens met betrekking tot de toepassing van dit lid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel3
  - number: '3.6'
    text: |-
      Onverminderd het vijfde lid kan ten aanzien van ho-studenten die een duale opleiding volgen als bedoeld in
      [artikel 7.7 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] leidend tot een getuigschrift
      als bedoeld in het eerste lid, onder b.1°, en aan die opleiding ten minste 180 studiepunten hebben behaald, worden
      afgeweken van de eisen in het eerste lid onder b, met dien verstande dat het tijdelijk dienstverband van de ho-
      student een periode beslaat die overeenkomt met een volledig dienstverband van vijf maanden. De vorige volzin
      is van overeenkomstige toepassing ten aanzien van ho-studenten die ten minste 166 doch nog geen 180 studiepunten
      hebben behaald, indien door de desbetreffende hogeschool wordt verklaard dat de ho-student beschikt over met
      180 studiepunten vergelijkbare en tevens voor het dienstverband relevante kennis, inzicht en vaardigheden. De
      toepassing van de vorige volzin vervalt ten aanzien van die ho-student die niet binnen vier weken na aanvang van
      het dienstverband over 180 studiepunten beschikt. De in artikel 7.7, vijfde lid, van de Wet op het hoger onderwijs
      en wetenschappelijk onderzoek bedoelde overeenkomst vermeldt tevens de leraar onder wiens verantwoordelijkheid de
      betrokken ho-student werkzaamheden van onderwijskundige aard verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '3.7'
    text: |-
      Dit artikel is niet van toepassing op het geven van onderwijs als bedoeld in
      [artikel 14a, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14a
