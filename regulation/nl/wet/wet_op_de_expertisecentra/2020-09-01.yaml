        artikel: '135'
        paragraaf: '4'
        afdeling: '7'
  - number: '143.5'
    text: |-
      Het bevoegd gezag kan met het bevoegd gezag van een school of instelling die op grond van [artikel 24][ref1] een
      deel van het schoolplan uitvoert, overeenkomen om vanwege die uitvoering een deel van de bekostiging over te dragen
      aan dat andere bevoegd gezag. De eerste volzin is van overeenkomstige toepassing indien op grond van artikel 24 een
      deel van het schoolplan wordt uitgevoerd door een andere school of instelling van het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel24
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '24'
        paragraaf: '1'
        afdeling: '1'
  - number: 143a_bis
    text: |-
      In afwijking van [artikel 143][ref1] kan het bevoegd gezag van de school met het bevoegd gezag van de
      instelling voor beroepsonderwijs waarmee het een samenwerkingsovereenkomst heeft gesloten als bedoeld in
      [artikel 10b11, tweede lid, van de Wet op het voortgezet onderwijs][ref2] overeenkomen om vanwege een doorlopende
      leerroute vmbo-mbo als bedoeld in [artikel 10b10, tweede lid, van die wet][ref3] of de geïntegreerde route vmbo-
      basisberoepsopleiding, bedoeld in [artikel 10b21, tweede lid, van die wet][ref4] een deel van de bekostiging over
      te dragen aan dat andere bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b11
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10b10
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10b21
