  - number: 143.2.b
    text: |-
      een centrale dienst, een samenwerkingsverband of een school als bedoeld in de [Wet op het primair onderwijs][ref1]
      of een centrale dienst, een samenwerkingsverband of een school als bedoeld in de
      [Wet op het voortgezet onderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
