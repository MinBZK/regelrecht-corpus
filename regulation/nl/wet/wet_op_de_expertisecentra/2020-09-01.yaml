  - number: '143.2'
    text: |-
      Het bevoegd gezag kan de in de [artikelen 124][ref1], [128][ref2], [131][ref3] en [166a][ref4] bedoelde bedragen
      voor de kosten voor de materiële instandhouding en voor de personeelskosten mede aanwenden voor de in het eerste
      lid bedoelde kosten van:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel128
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel131
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel166a
