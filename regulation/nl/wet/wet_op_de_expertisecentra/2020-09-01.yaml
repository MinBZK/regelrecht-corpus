      - id: ref9
        bwb_id: BWBR0003549
        artikel: '9'
        paragraaf: '1'
        afdeling: '1'
  - number: '86.4'
    text: |-
      Indien in beroep tegen het besluit van Onze Minister, bedoeld in het derde lid, is bepaald dat de uitspraak van
      de rechter, dan wel het besluit naar aanleiding van die uitspraak, strekt tot opneming van een school in het plan,
      nemen provinciale staten de school op in het eerste na de uitspraak vast te stellen plan.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel86
  - number: '86.5'
    text: Het plan wordt binnen 4 weken na de vaststelling bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel86
  - number: '86.6'
    text: |-
      Zodra de bekostiging van een in het plan opgenomen school een aanvang kan nemen, beslist Onze Minister bij
      beschikking, met ingang van welk tijdstip dit kan geschieden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel86
  - number: '87.1'
    text: |-
      Scholen die gedurende 3 achtereenvolgende jaren in het plan zijn opgenomen en niet voor bekostiging in aanmerking
      zijn gebracht, worden in het daaropvolgende jaar voor bekostiging in aanmerking gebracht.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel87
  - number: '87.2'
    text: |-
      Ten aanzien van een school die ingevolge [artikel 79, derde lid][ref1], of [artikel 84, achtste lid][ref2],
      in het daar bedoelde plan wordt opgenomen, vangt de termijn genoemd in het eerste lid, aan met ingang
      van het eerste jaar van het plan waarin de school was opgenomen. Ten aanzien van een school die ingevolge
      [artikel 83, vierde lid][ref3], of [artikel 86, vierde lid][ref4], in het daar bedoelde plan wordt opgenomen, vangt
      de termijn genoemd in het eerste lid, aan met ingang van het eerste jaar van het plan waarvoor de aanvraag werd
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel83
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel86
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '79'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003549
