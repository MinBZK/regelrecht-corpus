        afdeling: '1'
  - number: '4.1'
    text: |-
      Ten behoeve van het schoolbezoek verstrekken burgemeester en wethouders aan ouders van in de gemeente verblijvende
      leerlingen, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, aan de leerling op aanvraag
      vergoeding van de door burgemeester en wethouders noodzakelijk te achten vervoerskosten. De gemeenteraad stelt
      daartoe een nadere regeling vast, met inachtneming van het bepaalde in de volgende leden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel4
  - number: '4.2'
    text: De regeling maakt geen onderscheid tussen openbaar en bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel4
  - number: '4.3'
    text: |-
      De regeling eerbiedigt de op godsdienst of levensbeschouwing van de ouders, dan wel, indien de leerling
      meerderjarig en handelingsbekwaam is, van de leerling berustende keuze van een school.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel4
  - number: '4.4'
    text: |-
      De regeling houdt rekening met de van ouders redelijkerwijs te vergen inzet en voorziet erin dat het vervoer kan
      plaatsvinden op een wijze die voor de leerling passend is, met dien verstande dat voor leerlingen die voortgezet
      speciaal onderwijs volgen geldt dat zij slechts aanspraak op bekostiging van vervoerskosten kunnen maken indien
      zij wegens hun handicap op ander vervoer dan openbaar vervoer zijn aangewezen, dan wel vanwege hun handicap
      niet zelfstandig van openbaar vervoer gebruik kunnen maken. De regeling bepaalt op welke wijze burgemeester en
      wethouders terzake advies van deskundigen inwinnen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel4
  - number: '4.5'
    text: |-
      De regeling bepaalt dat de kosten worden vergoed van vervoer over de afstand tussen de woning van de leerling en
      de dichtstbijzijnde voor de leerling toegankelijke school, met inachtneming van de keuze van de ouders, dan wel,
      indien de leerling meerderjarig en handelingsbekwaam is, van de leerling, en gemeten langs de kortste voor de
      leerling voldoende begaanbare en veilige weg, tenzij vervoer met betrekking tot een verder weg gelegen school voor
      de gemeente minder kosten met zich zou brengen en de ouders onderscheidenlijk de leerling met het vervoer naar die
      school instemmen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel4
  - number: '4.6'
    text: |-
      De regeling bepaalt in welke gevallen en onder welke voorwaarden burgemeester en wethouders aan in de gemeente
      wonende ouders van leerlingen die met het oog op het volgen van voor hen passend speciaal onderwijs of voortgezet
      speciaal onderwijs in een internaat of pleeggezin verblijven, op aanvraag vergoeding verstrekken ten behoeve van de
      kosten verbonden aan het weekeinde- en vakantievervoer.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel4
  - number: '4.7'
    text: |-
      De regeling kan per schoolsoort, als bedoeld in artikel 2, tweede lid, en onverminderd het bepaalde in het vierde
      lid voor leerlingen die wegens hun lichamelijke, verstandelijke, zintuiglijke of psychische handicap op ander
      vervoer dan openbaar vervoer zijn aangewezen, bepalen dat geen aanspraak op vergoeding bestaat op grond van de
      afstand tussen de voor de leerling toegankelijke school en de woning van de leerling, gemeten langs de kortste voor
      de leerling voldoende begaanbare en veilige weg.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel4
  - number: '4.8'
    text: |-
      De regeling kan per schoolsoort, als bedoeld in artikel 2, tweede lid, bepalen dat voor een leerling die ouder is
      dan een bepaalde leeftijd, de aanspraak op vergoeding wordt beperkt tot de kosten van openbaar vervoer, dan wel,
      indien zulks in redelijkheid kan worden verlangd, een goedkopere wijze van vervoer. In dat geval dient de regeling
      erin te voorzien, dat uitvoering wordt gegeven aan het bepaalde in het vierde lid voor die leerlingen voor wie
      openbaar vervoer ontbreekt en de in de vorige volzin bedoelde goedkopere wijze van vervoer in redelijkheid niet
      kan worden verlangd en voor die leerlingen die wegens hun lichamelijke, verstandelijke, zintuiglijke of psychische
      handicap op ander vervoer dan openbaar vervoer zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel4
  - number: '4.9'
    text: |-
      De regeling kan bepalen dat de gemeente, in plaats van vergoeding in geld te geven, het vervoer verzorgt of doet
      verzorgen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel4
  - number: '4.10'
    text: |-
      De regeling kan bepalen dat burgemeester en wethouders in bijzondere gevallen de bevoegdheid hebben ten gunste
      van de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, ten gunste van de leerling van de
      inhoud van de regeling af te wijken.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel4
  - number: 4a.1
    text: |-
      Indien het bevoegd gezag op enigerlei wijze bekend is geworden dat een ten behoeve van zijn school
      met taken belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de zeden
      als bedoeld in [Titel XIV van het Wetboek van Strafrecht][ref1] jegens een minderjarige leerling van
      de school, treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in
      [artikel 6 van de Wet op het onderwijstoezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel6
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '6'
  - number: 4a.2
    text: |-
      Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van
      een redelijk vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf
      als bedoeld in het eerste lid jegens een minderjarige leerling van de school, doet het bevoegd
      gezag onverwijld aangifte bij een opsporingsambtenaar als bedoeld in [artikel 127][ref1] juncto
      [artikel 141 van het Wetboek van Strafvordering][ref2], en stelt het bevoegd gezag de vertrouwensinspecteur daarvan
      onverwijld in kennis. Voordat het bevoegd gezag overgaat tot het doen van aangifte, stelt het de ouders van de
      betrokken leerling, onderscheidenlijk de betreffende ten behoeve van de school met taken belaste persoon, hiervan
      op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '127'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 4a.3
    text: |-
      Indien een personeelslid op enigerlei wijze bekend is geworden dat een ten behoeve van de school met taken belast
      persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een
      minderjarige leerling van de school, stelt het personeelslid het bevoegd gezag daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel4a
  - number: '5.1'
    text: |-
      Het bevoegd gezag stelt voor het personeel een meldcode vast waarin stapsgewijs wordt aangegeven hoe met signalen
      van huiselijk geweld of kindermishandeling wordt omgegaan en die er redelijkerwijs aan bijdraagt dat zo snel en
      adequaat mogelijk hulp kan worden geboden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel5
  - number: '5.2'
    text: |-
      Onder huiselijk geweld wordt verstaan: huiselijk geweld als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '1'
  - number: '5.3'
    text: |-
      Onder kindermishandeling wordt verstaan: kindermishandeling als bedoeld in [artikel 1.1 van de Jeugdwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: '5.4'
    text: Het bevoegd gezag bevordert de kennis en het gebruik van de meldcode.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel5
  - number: '5.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel5
  - number: 5a.1
    text: 'Het bevoegd gezag draagt zorg voor de veiligheid op school, waarbij het bevoegd gezag in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel5a
  - number: 5a.1.a
    text: beleid met betrekking tot de veiligheid voert,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel5a
  - number: 5a.1.b
    text: |-
      de veiligheid van leerlingen op school monitort met een instrument dat een representatief en actueel beeld geeft,
      en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel5a
  - number: 5a.1.c
    text: 'er zorg voor draagt dat bij een persoon ten minste de volgende taken zijn belegd:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel5a
  - number: 5a.1.c.1°
    text: het coördineren van het beleid in het kader van het tegengaan van pesten, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel5a
  - number: 5a.1.c.2°
    text: het fungeren als aanspreekpunt in het kader van pesten.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel5a
  - number: 5a.2
    text: |-
      Onder veiligheid, bedoeld in het eerste lid, wordt verstaan de sociale, psychische en fysieke veiligheid van
      leerlingen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel5a
  - number: 5a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het instrument, bedoeld in het
      eerste lid, onderdeel b, dat door de school wordt vormgegeven of gekozen, waaronder:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel5a
  - number: 5a.3.a
    text: de aandachtsgebieden die het instrument inzichtelijk maakt,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel5a
  - number: 5a.3.b
    text: de representativiteit van het instrument, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel5a
  - number: 5a.3.c
    text: de frequentie waarmee het instrument wordt ingezet.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel5a
  - number: '6'
    text: |-
      Ten laste van een andere openbare kas dan van Rijk en gemeente worden geen scholen in stand gehouden, noch uitgaven
      voor een school gedaan. Gemeenten doen geen uitgaven voor een niet door de gemeente in stand gehouden school dan
      krachtens de wet.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel6
  - number: '7.1'
    text: |-
      Deze wet is niet van toepassing op scholen die uitsluitend bestemd zijn voor kinderen die niet de Nederlandse
      nationaliteit hebben.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel7
  - number: '7.2'
    text: Bij twijfel of op een school het eerste lid van toepassing is, besluit de Kroon, de Raad van State gehoord.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel7
  - number: '8.1'
    text: |-
      Het onderwijs bedoeld in [artikel 2, tweede lid, aanhef en onderdelen f tot en met n][ref1], wordt gegeven in
      scholen voor speciaal onderwijs, scholen voor voortgezet speciaal onderwijs en scholen voor speciaal en voortgezet
      speciaal onderwijs, verdeeld als aangegeven in die onderdelen. Het onderwijs bedoeld in artikel 2, tweede lid,
      aanhef en onderdeel d, en het onderwijs aan meervoudig gehandicapte kinderen die naast een handicap als bedoeld
      in artikel 2, tweede lid, onderdeel d, een handicap hebben als bedoeld in artikel 2, tweede lid, onderdeel a
      tot en met c, f en h tot en met m, wordt gegeven in instellingen voor speciaal en voortgezet speciaal onderwijs
      aan visueel gehandicapte kinderen. Het onderwijs, bedoeld in artikel 2, aanhef en onderdelen a, b en c, en het
      onderwijs aan meervoudig gehandicapte leerlingen die naast een handicap als bedoeld in artikel 2, aanhef en
      onderdelen a, b en c, een handicap hebben als bedoeld in artikel 2, tweede lid, onderdeel f en h tot en met
      m, wordt gegeven in instellingen voor speciaal en voortgezet speciaal onderwijs aan auditief of communicatief
      gehandicapte kinderen. In verband met de spreiding van de instellingen kan het onderwijs door de instelling worden
      aangeboden op een of meer andere locaties dan die van de hoofdvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '8.2'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald aan welke soorten van scholen afdelingen kunnen worden verbonden
      en voor welke kinderen deze zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel8
  - number: '8.3'
    text: |-
      De algemene maatregel van bestuur bedoeld in het tweede lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure
      bedoeld in de eerste 3 volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel8
  - number: '9.1'
    text: 'De taken van een instelling zijn:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel9
  - number: 9.1.a.1°
    text: |-
      het geven van speciaal onderwijs of voortgezet speciaal onderwijs aan kinderen als bedoeld in
      [artikel 2, tweede lid, onderdeel d][ref1], of aan meervoudig gehandicapte kinderen als bedoeld in
      [artikel 8, eerste lid, tweede volzin][ref2]; dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel8
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '8'
        paragraaf: '1'
        afdeling: '1'
  - number: 9.1.a.2°
    text: |-
      het geven van speciaal onderwijs of voortgezet speciaal onderwijs aan kinderen als bedoeld in
      [artikel 2, tweede lid, de onderdelen a, b en c][ref1], of aan meervoudig gehandicapte kinderen als bedoeld in
      [artikel 8, eerste lid, derde volzin][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel8
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '8'
        paragraaf: '1'
        afdeling: '1'
  - number: 9.1.b
    text: |-
      het begeleiden door een aan een instelling verbonden leraar van een leerling die is ingeschreven op een
      school als bedoeld in de [Wet op het primair onderwijs][ref1], de [Wet op het voortgezet onderwijs][ref2]
      of van een mbo-student of vavo-student die is ingeschreven op een instelling als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref3] die zonder deze begeleiding zou zijn aangewezen op het onderwijs dat de
      instelling verzorgt, alsmede de ondersteuning van een onderwijsinstelling waarop die leerling, vavo-student of mbo-
      student is geplaatst door een leraar, orthopedagoog, psycholoog of logopedist van de instelling en


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0002399
      [ref3]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0002399
      - id: ref3
        bwb_id: BWBR0007625
  - number: 9.1.c
    text: |-
      het verrichten van algemene ondersteuningsactiviteiten ten behoeve van de bevordering van een optimale
      schoolloopbaan van auditief of communicatief gehandicapte leerlingen, vavo-studenten of mbo-studenten dan wel van
      visueel gehandicapte leerlingen, vavo-studenten of mbo-studenten.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel9
  - number: '9.2'
    text: |-
      Met ingang van een bij ministeriële regeling te bepalen datum heeft een instelling voor auditief en communicatief
      gehandicapte kinderen tevens tot taak een leerling die is ingeschreven op een school als bedoeld in de
      [Wet op het primair onderwijs][ref1] of de [Wet op het voortgezet onderwijs][ref2] of een instelling als bedoeld in
      de [Wet educatie en beroepsonderwijs][ref3] te ondersteunen door een tolk.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0002399
      [ref3]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0002399
      - id: ref3
        bwb_id: BWBR0007625
  - number: '11.1'
    text: |-
      Het onderwijs wordt afgestemd op de ontwikkelingsmogelijkheden van de leerling. Zo nodig treedt het bevoegd gezag
      daarbij in overleg met:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel11
  - number: 11.1.a
    text: |-
      het college van burgemeester en wethouders van de gemeente waar de leerling zijn woonplaats heeft als bedoeld in
      [artikel 1.1. van de Jeugdwet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 11.1.b
    text: |-
      een instantie die jeugdgezondheidszorg uitvoert als bedoeld in [artikel 5 van de Wet publieke gezondheid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel5
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '5'
  - number: 11.1.c
    text: |-
      een instantie die maatschappelijke ondersteuning biedt als bedoeld in
      [artikel 1, eerste lid, onder g, 2°, van de Wet maatschappelijke ondersteuning][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel1
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '1'
  - number: 11.1.d
    text: |-
      een zorgaanbieder als bedoeld in [artikel 1, eerste lid, onder j, van de Algemene Wet Bijzondere Ziektekosten][ref1]
      of


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel1
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '1'
  - number: 11.1.e
    text: |-
      een zorgaanbieder die geneeskundige geestelijke gezondheidszorg levert welke behoort tot de prestaties omschreven
      bij of krachtens de[ Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: '11.2'
    text: Het bevoegd gezag stelt ten minste eenmaal in de 4 jaar een schoolondersteuningsprofiel vast.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel11
  - number: '11.3'
    text: |-
      Het onderwijs richt zich in elk geval op de emotionele en de verstandelijke ontwikkeling, op het ontwikkelen
      van creativiteit, het verwerven van kennis en van sociale, culturele en lichamelijke vaardigheden. Het onderwijs
      wordt bovendien zodanig ingericht dat daarbij op structurele en herkenbare wijze aandacht wordt besteed aan het
      bestrijden van achterstanden in het bijzonder in de beheersing van de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel11
  - number: '11.4'
    text: 'Het onderwijs:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel11
  - number: 11.4.a
    text: gaat er mede van uit dat leerlingen opgroeien in een pluriforme samenleving,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel11
  - number: 11.4.b
    text: is mede gericht op het bevorderen van actief burgerschap en sociale integratie, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel11
  - number: 11.4.c
    text: |-
      is er mede op gericht dat leerlingen kennis hebben van en kennismaken met verschillende achtergronden en culturen
      van leeftijdgenoten.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel11
  - number: '11.5'
    text: De onderwijsactiviteiten worden evenwichtig over de dag verdeeld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel11
  - number: '11.6'
    text: |-
      Het onderwijs wordt zodanig ingericht dat leerlingen die in verband met ziekte thuis verblijven dan wel zijn
      opgenomen in een ziekenhuis, op adequate wijze voldoende onderwijs kunnen genieten.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel11
  - number: '11.7'
    text: |-
      De scholen gebruiken een leerling- en onderwijsvolgsysteem waaruit de vorderingen in de kennis en vaardigheden
      blijken op het niveau van de leerling, de groep en de school. Het leerling- en onderwijsvolgsysteem bevat toetsen
      die kennis en vaardigheden van de leerling meten ten minste op het terrein van de Nederlandse taal en rekenen en
      wiskunde, met inachtneming van de referentieniveaus Nederlandse taal en de referentieniveaus rekenen, bedoeld in
      [artikel 2, tweede lid, aanhef en onderdeel a, van de Wet referentieniveaus Nederlandse taal en rekenen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027679#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0027679
        artikel: '2'
  - number: '11.8'
    text: |-
      De toetsen, bedoeld in het zevende lid, voldoen aan het kwaliteitsoordeel van een door Onze Minister aangewezen
      onafhankelijke commissie betreffende inhoudelijke validiteit, betrouwbaarheid en deugdelijke normering. Bij of
      krachtens algemene maatregel van bestuur kunnen voorschriften omtrent het leerling- en onderwijsvolgsysteem en de
      daaraan verbonden toetsen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel11
  - number: '12.1'
    text: 'Het speciaal onderwijs wordt zodanig ingericht dat:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel12
  - number: 12.1.a
    text: |-
      de leerlingen in beginsel binnen een tijdvak van 8 aaneensluitende schooljaren het speciaal onderwijs kunnen
      doorlopen, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel12
  - number: 12.1.b
    text: |-
      de leerlingen in 8 schooljaren ten minste 7 520 uren onderwijs ontvangen, met dien verstande dat de leerlingen
      in de eerste 4 schooljaren ten minste 3 520 uren onderwijs en in de laatste 4 schooljaren ten minste 3 760 uren
      onderwijs ontvangen. Het onderwijs aan leerlingen jonger dan 4 jaar omvat ten minste 880 uren per schooljaar. Aan
      de leerlingen in de laatste 6 schooljaren wordt ten hoogste 7 weken van het schooljaar 4 dagen per week onderwijs
      gegeven, die evenwichtig zijn verdeeld over het schooljaar, bij een schoolweek van in beginsel niet minder dan 5
      dagen onderwijs.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel12
  - number: '12.2'
    text: |-
      De inspectie kan op aanvraag van het bevoegd gezag ermee instemmen dat om lichamelijke of psychische redenen voor
      individuele leerlingen wordt afgeweken van het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel12
  - number: '13.1'
    text: |-
      Behoudens het bepaalde in het vijfde lid en in [artikel 15][ref1] omvat het speciaal onderwijs, waar mogelijk in
      samenhang:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel15
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '15'
        paragraaf: '1'
        afdeling: '1'
  - number: 13.1.a
    text: zintuiglijke oefening;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.1.b
    text: lichamelijke oefening;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.1.c
    text: Nederlandse taal;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.1.d
    text: rekenen en wiskunde;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.1.e
    text: enkele kennisgebieden;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.1.f
    text: expressie-activiteiten;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.1.g
    text: bevordering van sociale redzaamheid, waaronder gedrag in het verkeer;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.1.h
    text: bevordering van gezond gedrag;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.1.i
    text: Engelse taal.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: '13.2'
    text: Het onderwijs kan mede huishoudelijke activiteiten omvatten.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: '13.3'
    text: 'Bij de kennisgebieden wordt in elk geval aandacht besteed aan:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.3.a
    text: aardrijkskunde;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.3.b
    text: geschiedenis;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.3.c
    text: de natuur, waaronder biologie;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.3.d
    text: maatschappelijke verhoudingen, waaronder staatsinrichting;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.3.e
    text: geestelijke stromingen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: '13.4'
    text: |-
      Bij de expressie-activiteiten wordt waar mogelijk aandacht besteed aan de bevordering van het taalgebruik, tekenen,
      muziek, handvaardigheid, spel en beweging.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: '13.5'
    text: |-
      Speciaal onderwijs aan zeer moeilijk lerende kinderen en meervoudig gehandicapte kinderen voor wie het zeer
      moeilijk lerend zijn een van de handicaps is omvat, waar mogelijk in samenhang;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.5.a
    text: zintuiglijke oefening;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.5.b
    text: lichamelijke oefening;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.5.c
    text: bevordering van de sociale redzaamheid, waaronder gedrag in het verkeer;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.5.d
    text: bevordering van gezond gedrag;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.5.e
    text: |-
      expressie-activiteiten, waarbij in elk geval aandacht wordt besteed aan de bevordering van het taalgebruik,
      tekenen, muziek, handvaardigheid, spel en beweging;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.5.f
    text: een of meer kennisgebieden, waarbij in ieder geval aandacht wordt besteed aan de natuur.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: '13.6'
    text: Op de scholen in de provincie Fryslân kan het speciaal onderwijs mede onderwijs in de Friese taal omvatten.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: '13.7'
    text: |-
      Ten aanzien van de onderwijsactiviteiten, genoemd in het eerste tot en met vijfde lid, worden bij
      algemene maatregel van bestuur kerndoelen vastgesteld, die voor de onderwijssoorten, bedoeld in
      [artikel 2, tweede lid][ref1], kunnen verschillen. De algemene maatregel van bestuur, bedoeld in de vorige volzin,
      wordt aan de Tweede Kamer der Staten-Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat 4 weken
      na de overlegging zijn verstreken bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of
      namens de kamer de wens te kennen wordt gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet
      wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend. De vorige
      3 volzinnen zijn niet van toepassing, voor zover het ontwerp van een algemene maatregel van bestuur voordien
      aan de Tweede Kamer der Staten-Generaal is voorgelegd en door of namens de kamer te kennen is gegeven dat van de
      procedure, bedoeld in de vorige 3 volzinnen, kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '13.8'
    text: |-
      Ten aanzien van de onderwijsactiviteit, bedoeld in het zesde lid, stellen provinciale staten van Fryslân bij
      verordening kerndoelen Friese taal vast, die voor de onderwijssoorten, bedoeld in [artikel 2, tweede lid][ref1],
      kunnen verschillen. De vaststelling geschiedt niet eerder dan nadat gedeputeerde staten overleg hebben gevoerd
      met het Friese speciaal onderwijs. De verordening behoeft de goedkeuring van Onze Minister. Indien Onze Minister
      voornemens is goedkeuring te onthouden, verzoekt hij de Onderwijsraad een advies uit te brengen. Het verzoek bevat
      een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies wordt binnen zes weken uitgebracht
      aan Onze Minister en wordt bekend gemaakt. Onze Minister informeert beide Kamers der Staten-Generaal over zijn
      voornemen om al dan niet goed te keuren. [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] is niet van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '13.9'
    text: |-
      Onze Minister kan goedkeuring als bedoeld in het achtste lid in ieder geval onthouden indien aan de volgende
      voorwaarden, waarvoor gedeputeerde staten gegevens aandragen, niet wordt voldaan:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.9.a
    text: het bestaan van voldoende draagvlak in het Friese speciaal onderwijs voor de voorgelegde kerndoelen Friese taal;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.9.b
    text: |-
      dat de kerndoelen Friese taal niet meer inspanningen vergen van het Friese speciaal onderwijs dan het aandeel van
      het onderwijs in de Friese taal binnen het totaal aan onderwijsactiviteiten rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: '13.10'
    text: |-
      Onze Minister kan goedkeuring als bedoeld in het achtste lid in ieder geval onthouden indien de kerndoelen Friese
      taal geen aandacht schenken aan:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.10.a
    text: het zich mondeling uitdrukken in het Fries en het verstaan van de Fries gesproken taal,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.10.b
    text: het zich schriftelijk uitdrukken in het Fries en het verwerven van informatie uit in het Fries gestelde teksten,
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.10.c
    text: bevordering van het begrip van de Friese taal, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: 13.10.d
    text: het ontwikkelen van een positieve houding ten aanzien van het gebruik van het Fries.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: '13.11'
    text: |-
      Voor de school geldt de eis dat zij tenminste de kerndoelen bij haar onderwijsactiviteiten als aan het eind van
      het speciaal onderwijs te bereiken doelstellingen hanteert. Kerndoelen geven een beschrijving van kwaliteiten van
      leerlingen op het gebied van kennis, inzicht en vaardigheden. Indien voor een leerling de eerste volzin niet kan
      worden toegepast, wordt in het ontwikkelingsperspectief, bedoeld in [artikel 41a][ref1], aangegeven wat daarvan de
      reden is en welke vervangende onderwijsdoelen worden gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel41a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 41a
        paragraaf: '3'
        afdeling: '1'
  - number: '13.12'
    text: |-
      Indien een bevoegd gezag van een bijzondere school dringend bedenkingen heeft tegen de krachtens het zevende
      of achtste lid vastgestelde kerndoelen, kan het bevoegd gezag eigen kerndoelen voor de school vaststellen. Deze
      kerndoelen zijn van gelijk niveau als de kerndoelen, bedoeld in het zevende of achtste lid. Het bevoegd gezag zendt
      de vastgestelde kerndoelen aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
  - number: '13.13'
    text: |-
      Bij de verzorging van het onderwijs op basis van de kerndoelen voor Nederlandse taal en rekenen
      en wiskunde, neemt het bevoegd gezag, met inachtneming van [artikel 11, eerste lid][ref1],
      de referentieniveaus Nederlandse taal en de referentieniveaus rekenen, bedoeld in
      [artikel 2, tweede lid, aanhef en onderdeel b, van de Wet referentieniveaus Nederlandse taal en rekenen][ref2],
      als uitgangspunt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0027679#Artikel2
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '11'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0027679
        artikel: '2'
  - number: '14.1'
    text: 'Het voortgezet speciaal onderwijs wordt onderscheiden in:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14
  - number: 14.1.a
    text: het uitstroomprofiel vervolgonderwijs;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14
  - number: 14.1.b
    text: het arbeidsmarktgerichte uitstroomprofiel;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14
  - number: 14.1.c
    text: het uitstroomprofiel dagbesteding.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14
  - number: '14.2'
    text: Op een school wordt voortgezet speciaal onderwijs verzorgd in ten minste één van de uitstroomprofielen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14
  - number: 14a.1
    text: 'Het onderwijs in het uitstroomprofiel vervolgonderwijs omvat op een school:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14a
  - number: 14a.1.a
    text: |-
      het onderwijs in één of meer van de schoolsoorten, bedoeld in
      [artikel 5, onderdelen a tot en met c, van de Wet op het voortgezet onderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel5
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '5'
  - number: 14a.1.b
    text: |-
      het onderwijs volgens de voorschriften die voortvloeien uit het toepassing geven aan
      [artikel 59a van de Wet op het voortgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel59a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 59a
  - number: 14a.2
    text: |-
      Op het onderwijs, bedoeld in het eerste lid, onderdeel a, zijn de voorschriften, gegeven bij of krachtens
      de [artikelen 6f][ref1], [6g][ref2], [6g1][ref3], [10][ref4], [10b][ref5], [10b1 tot en met 10b8][ref6],
      [10b9, eerste en tweede lid][ref7], [10b10 tot en met 10b21][ref8], [10d][ref9], [11a tot en met 11f][ref10],
      [12 tot en met 15][ref11], [22][ref12] en [24 van de Wet op het voortgezet onderwijs][ref13] van
      overeenkomstige toepassing en bij dat onderwijs worden de eindexamenprogramma’s vastgesteld op grond van
      [artikel 29, vierde lid, van de Wet op het voortgezet onderwijs][ref14] in acht genomen, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel6g
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel6g1
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref6]: https://wetten.overheid.nl/BWBR0002399#Artikel10b1
      [ref7]: https://wetten.overheid.nl/BWBR0002399#Artikel10b9
      [ref8]: https://wetten.overheid.nl/BWBR0002399#Artikel11
      [ref9]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref10]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
      [ref11]: https://wetten.overheid.nl/BWBR0002399#Artikel12
      [ref12]: https://wetten.overheid.nl/BWBR0002399#Artikel22
      [ref13]: https://wetten.overheid.nl/BWBR0002399#Artikel24
      [ref14]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel14a
