  - number: 178e.2
    text: |-
      Een verzoek om voor bekostiging in aanmerking te worden gebracht als samenwerkingsschool
      wordt uiterlijk twee volledige schooljaren na inwerkingtreding van de
      __REF000___________________________________________________________________________________________________________
      ________________________________________________________________________________________ ingediend bij Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0039948
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel178e
    references:
      - id: ref1
        bwb_id: BWBR0039948
  - number: 178e.3
    text: |-
      Onze Minister willigt het verzoek in indien ten tijde van de samenvoeging werd voldaan aan
      [artikel 28j, eerste tot en met derde lid][ref1], zoals dat artikel luidt na de inwerkingtreding van
      [artikel II, onderdeel D, van de in het tweede lid genoemde wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28j
      [ref2]: https://wetten.overheid.nl/BWBR0039948#ArtikelII
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel178e
    references:
