  - number: '171.8'
    text: |-
      De voordracht voor de algemene maatregel van bestuur, bedoeld in het tweede lid, wordt niet eerder gedaan dan vier
      weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel171
  - number: '172.1'
    text: |-
      Instemming van Onze Minister is vereist ten aanzien van de statuten van de rechtspersoon, bedoeld in
      [artikel 169][ref1], alsmede ten aanzien van wijziging van die statuten.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel169
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '169'
        afdeling: '11'
  - number: '172.2'
    text: |-
      Onze Minister is bevoegd tot intrekking van de aanwijzing van de rechtspersoon, bedoeld in [artikel 169][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel169
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '169'
        afdeling: '11'
  - number: '172.3'
    text: 'Bij algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel172
  - number: 172.3.a
    text: nadere taakomschrijving van de rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel172
  - number: 172.3.b
    text: |-
      de voorwaarden voor instemming door Onze Minister met de statuten van de rechtspersoon en wijziging van deze
      statuten; en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel172
  - number: 172.3.c
    text: de gevolgen van intrekking van de aanwijzing van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel172
  - number: '172.4'
    text: |-
      Krachtens bij algemene maatregel van bestuur vast te stellen voorschriften kan Onze Minister subsidie verlenen aan
      de rechtspersoon ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel172
  - number: 172.4.a
    text: |-
      bedragen die, gedurende een vooraf vastgestelde periode en tot een vooraf vastgestelde maximale
      hoogte, strekken ter vervanging van de bekostiging in verband met de kosten van vervanging, bedoeld in
      [artikel 121, eerste lid][ref1], en de bijdrage, bedoeld in [artikel 169, tweede lid][ref2], voor zover die
      betrekking heeft op de kosten van vervanging van personeel wegens voorschriften gegeven bij algemene maatregel van
      bestuur of bij ministeriële regeling,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel169
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '121'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '169'
        afdeling: '11'
  - number: 172.4.b
    text: een bijdrage aan de kosten van de bedrijfsvoering van de rechtspersoon, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel172
  - number: 172.4.c
    text: een bijdrage ten behoeve van de uitoefening van landelijke taken in het kader van de bedrijfsgezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel172
  - number: '172.5'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het vierde lid, kan ten behoeve van een in dat lid bedoelde
      subsidie een subsidieplafond worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel172
  - number: '172.6'
    text: |-
      Het bestuur van de rechtspersoon kan ten behoeve van de uitoefening van landelijke taken in het kader van de
      bedrijfsgezondheidszorg subsidie aan derden verstrekken.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel172
  - number: '172.7'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het derde en vierde lid, wordt aan de Tweede Kamer der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken
      en gedurende die termijn niet door of namens de Kamer de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel172
  - number: '173.1'
    text: |-
      [Artikel 172][ref1] is van overeenkomstige toepassing ten aanzien van de rechtspersoon, bedoeld in
      [artikel 170][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel172
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel170
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '172'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '170'
        afdeling: '11'
  - number: '173.2'
    text: |-
      Onze Minister zendt binnen vijf jaar na de aanwijzing van de rechtspersoon, bedoeld in [artikel 170][ref1], en
      vervolgens telkens na vijf jaar, aan de Tweede Kamer der Staten-Generaal een verslag over de doeltreffendheid en de
      effecten van de werkzaamheden van die rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel170
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '170'
        afdeling: '11'
  - number: 173c
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van artikel II van de Wet van 4 juni 2015 tot wijziging
      van enige onderwijswetten in verband met het invoeren van de verplichting voor scholen om zorg te dragen voor de
      veiligheid op school (Stb. 238) aan de Staten-Generaal een verslag over de doeltreffendheid en effecten van de
      [artikelen 5a][ref1] en [22, eerste lid, onderdeel k][ref2], in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel22
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel173c
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 5a
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '22'
        paragraaf: '1'
        afdeling: '1'
  - number: 173d
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van de Wet van 29 november 2017 tot wijziging
      van diverse onderwijswetten in verband met het pseudonimiseren van het persoonsgebonden nummer van een
      onderwijsdeelnemer ten behoeve van het bieden van voorzieningen in het kader van het onderwijs en de begeleiding
      van onderwijsdeelnemers (Stb. 508) aan de Staten-Generaal een verslag over de doeltreffendheid en effecten van
      [artikel 164a, twaalfde tot en met vijftiende lid][ref1], in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel164a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel173d
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 164a
        afdeling: '11'
  - number: '174.1'
    text: |-
      Aan degene die de bevoegdheid tot het geven van onderwijs krachtens artikel 4 van de Wet op het basisonderwijs
      (Stb. 1984, 2) voor 17 april 1982 heeft verloren en deze bevoegdheid niet voordien onvoorwaardelijk is
      teruggegeven, is deze bevoegdheid alsnog teruggegeven op 17 april 1987.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel174
  - number: '174.2'
    text: |-
      Aan degene die de bevoegdheid, bedoeld in het eerste lid, vijf jaar of minder voor 17 april 1987 krachtens
      de in het eerste lid bedoelde bepalingen heeft verloren en deze bevoegdheid niet voordien onvoorwaardelijk is
      teruggegeven, is deze bevoegdheid vijf jaar na het verlies daarvan alsnog teruggegeven.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel174
  - number: '174.3'
    text: |-
      Onze Minister kan in bijzondere gevallen de bevoegdheid, bedoeld in het eerste lid, die krachtens de in het eerste
      lid bedoelde bepalingen is verloren en voor 17 april 1987 niet is teruggegeven, al dan niet onder voorwaarden, op
      schriftelijk verzoek van de betrokkene alsnog teruggeven. Deze voorwaarden vervallen vijf jaar na het verlies van
      de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel174
  - number: '175.1'
    text: |-
      De vergoeding voor een schoolterrein die voor 1 juni 1992 is aangevangen en plaatsvindt met toepassing van
      [artikel 95, derde lid, van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref1]
      of artikel E 23 van de Overgangswet ISOVSO, zoals die voorschriften luidden op 31 mei 1991, wordt met ingang van
      1 juni 1992 gewijzigd in een vergoeding ter grootte van twee-derde deel van de rente op basis van een fictieve
      lening voor de noodzakelijk geachte kosten, met een lineaire aflossing en, gerekend vanaf het tijdstip waarop voor
      het eerst een vergoeding voor het schoolterrein werd verleend, een looptijd van 40 jaar. Bij de toepassing van de
      eerste volzin wordt gerekend met het rentepercentage dat zou gelden voor een lening met een lineaire aflossing en
      een looptijd van 20 jaar, uitgaande van een herziening van het rentepercentage per 1 januari volgend op een periode
      van 20 kalenderjaren waarin vergoeding werd verleend. Onze Minister is bevoegd om in verband met de rentestand
      tot bijstelling van een ingevolge de tweede volzin geldend rentepercentage over te gaan. Indien Onze Minister
      tot bijstelling van het rentepercentage is overgegaan, wordt in afwijking van de tweede volzin uitgegaan van een
      herziening van het rentepercentage per 1 januari volgend op een periode van 20 kalenderjaren sinds die bijstelling,
      het kalenderjaar waarin die bijstelling plaatsvond daarbij inbegrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel95
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '95'
        afdeling: '3'
  - number: '175.2'
    text: |-
      De vergoeding voor de niet op het schoolterrein betrekking hebbende kosten van stichting en eerste inrichting
      van een voorziening in de huisvesting bestemd voor blijvend gebruik die plaatsvindt met toepassing van
      [artikel 95, eerste lid, van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref1],
      zoals dat voorschrift luidde op 31 december 1991, wordt met ingang van 1 januari 1992 vastgesteld op een vergoeding
      ter grootte van de rente en aflossing op basis van een fictieve lening voor de noodzakelijk geachte kosten met
      een lineaire aflossing en een looptijd van 60 jaar. Indien de vergoeding voor 1 januari 1992 is aangevangen, wordt
      deze met ingang van 1 januari 1992 vastgesteld op een vergoeding ter grootte van de rente en aflossing op basis van
      een fictieve lening voor de op die datum nog niet vergoede noodzakelijk geachte kosten met een lineaire aflossing
      en, gerekend vanaf 1 januari 1992, een looptijd van 60 jaar verminderd met het aantal jaren waarover reeds een
      vergoeding is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel95
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '95'
        afdeling: '3'
  - number: '175.3'
    text: |-
      De vergoeding voor de niet op het schoolterrein betrekking hebbende kosten van stichting en eerste inrichting
      van een voorziening in de huisvesting bestemd voor blijvend gebruik die plaatsvindt met toepassing van artikel
      E 23 van de Overgangswet ISOVSO, zoals dat voorschrift luidde op 31 december 1991, wordt met ingang van 1 januari
      1992 vastgesteld op een vergoeding ter grootte van de rente en aflossing op basis van een fictieve lening voor
      de noodzakelijk geachte kosten met een lineaire aflossing en een looptijd van 60 jaar. Indien de vergoeding voor
      1 januari 1992 is aangevangen, wordt deze met ingang van 1 januari 1992 vastgesteld op een vergoeding ter grootte
      van de rente en aflossing op basis van een fictieve lening met een lineaire aflossing voor de op die datum nog niet
      vergoede noodzakelijk geachte kosten, welke lening 20 jaar meer bestrijkt dan de periode waarover vanaf 1 januari
      1992 nog vergoeding diende te worden verleend.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel175
  - number: '175.4'
    text: |-
      Bij de toepassing van het tweede en het derde lid wordt gerekend met het rentepercentage dat zou gelden voor een
      lening met een lineaire aflossing en een looptijd van 20 jaar, uitgaande van een herziening van het rentepercentage
      telkens per 1 januari volgend op een periode van 20 kalenderjaren waarin vergoeding werd verleend. Onze Minister is
      bevoegd om in verband met de rentestand tot bijstelling van een ingevolge de eerste volzin geldend rentepercentage
      over te gaan. Indien Onze Minister tot bijstelling van het rentepercentage is overgegaan, wordt in afwijking van de
      eerste volzin uitgegaan van een herziening van het rentepercentage telkens per 1 januari volgend op een periode van
      20 kalenderjaren sinds die bijstelling, het kalenderjaar waarin die bijstelling plaatsvond daarbij inbegrepen.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel175
  - number: '176.1'
    text: |-
      De directeur van de instelling, bedoeld in het tweede lid van artikel 89, die op 31 juli 1995 als directeur in
      dienst was van het bevoegd gezag van de tot instelling omgezette school als bedoeld in dat lid, behoudt ten minste
      recht op salariëring volgens het functieniveau dat op 31 juli 1995 voor hem gold dan wel op de maximumschaal die
      daarvoor reeds 2 jaar formatief voor hem aanwezig was. Indien voor de functie van directeur van die instelling een
      hogere maximumschaal gold dan die welke op 31 juli 1995 voor de directeur gold dan wel formatief beschikbaar was,
      wordt hij vanaf die datum bezoldigd volgens het carrièrepatroon dat bij die hogere maximumschaal behoort en heeft
      hij bij de vaststelling van het salaris aanspraak op een bevorderingsperiodiek. Hij behoudt een blijvende aanspraak
      op de hogere maximumschaal, bedoeld in de vorige volzin, indien deze gedurende 3 achtereenvolgende schooljaren aan
      die instelling voor hem beschikbaar is geweest.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel176
  - number: '177.1'
    text: |-
      Ten aanzien van de bijdrage die een gemeente in de ontslaguitkeringskosten dient te verstrekken bij of krachtens
      artikel 102 van de Wet op de onderwijsverzorging zoals die voorschriften luidden op 31 december 1997, blijven die
      voorschriften van kracht gedurende de periode waarover ontslaguitkeringen worden uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel177
  - number: '177.2'
    text: |-
      Een schoolbegeleidingsdienst dient aan Onze Minister op diens verzoek de kosten van werkloosheidsuitkeringen of
      herplaatsingswachtgelden te voldoen:
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel177
  - number: 177.2.a
    text: |-
      voor zover het betreft uitkeringen die zijn ontstaan voor 1 januari 1998: indien die kosten bij of krachtens de
      artikelen 90 en 102 van de Wet op de onderwijsverzorging zoals die voorschriften luidden op 31 december 1997,
      zouden worden ingehouden op de rijksvergoeding aan die schoolbegeleidingsdienst, en
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel177
  - number: 177.2.b
    text: |-
      voor zover het betreft uitkeringen die zijn ontstaan na 31 december 1997: indien de rechtspersoon, bedoeld
      in artikel 110b van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs, zoals
      die bepaling luidde ten tijde van deze uitkeringen, op een daartoe strekkend verzoek van het bestuur van de
      schoolbegeleidingsdienst, voorafgaand aan het ontslag niet heeft ingestemd met het ten laste van die rechtspersoon
      brengen van de kosten van werkloosheidsuitkeringen of herplaatsingswachtgelden.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel177
  - number: '178.1'
    text: |-
      Met betrekking tot de op 31 december 1997 door het Rijk nog niet vastgestelde of uitgekeerde bedragen, blijven van
      toepassing de bij of krachtens de Wet op de onderwijsverzorging gegeven voorschriften die betrekking hebben op de
      schoolbegeleidingsdiensten, bedoeld in Hoofdstuk II, Titel II, van die wet.
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel178
  - number: '178.2'
    text: |-
      Met betrekking tot de op 31 december 2001 door het Rijk nog niet vastgestelde of uitgekeerde bedragen, blijven
      van toepassing de bij of krachtens [artikel V, Titel A, van de wet van 15 mei 1997][ref1], Stb. 252 gegeven
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0008685#ArtikelV
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel178
    references:
      - id: ref1
        bwb_id: BWBR0008685
        artikel: V
  - number: 178a.1
    text: |-
      Per school waar voortgezet speciaal onderwijs wordt verzorgd informeert het bevoegd
      gezag uiterlijk op 1 januari voorafgaande aan het tijdstip van inwerkingtreding van
      [artikel I, onderdeel E van de wet van 11 oktober 2012][ref1] (Stb. 545), de ouders schriftelijk welk
      uitstroomprofiel als bedoeld in [artikel 14][ref2] zoals luidend door artikel I, onderdeel E, van die wet en indien
      aan de orde, welk onderwijs als bedoeld in [artikel 14a, eerste lid][ref3], zoals luidend door artikel I, onderdeel
      F, van die wet en welke schoolsoort als bedoeld in de Wet op het voortgezet onderwijs met ingang van genoemd
      tijdstip wordt verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0032212#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel14a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel178a
    references:
      - id: ref1
        bwb_id: BWBR0032212
        artikel: I
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '14'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 14a
        paragraaf: '1'
        afdeling: '1'
  - number: 178a.2
    text: |-
      Voor de leerlingen die voortgezet speciaal onderwijs volgen vóór het tijdstip van inwerkingtreding voor
      het voortgezet speciaal onderwijs van [artikel I, onderdeel R, van de wet van 11 oktober 2012][ref1]
      (Stb. 545) stelt het bevoegd gezag vóór dat tijdstip een ontwikkelingsperspectief vast overeenkomstig
      [artikel 41a, eerste lid][ref2], zoals luidend door artikel I, onderdeel R, van die wet. De eerste volzin is niet
      van toepassing op leerlingen die naar verwachting vóór 1 oktober volgend op het tijdstip, bedoeld in de eerste
      volzin, de school verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0032212#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel41a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel178a
    references:
      - id: ref1
        bwb_id: BWBR0032212
        artikel: I
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 41a
        paragraaf: '3'
        afdeling: '1'
  - number: 178a.3
    text: |-
      Voor de leerlingen die speciaal onderwijs volgen vóór het tijdstip van inwerkingtreding voor het speciaal onderwijs
      van [artikel I, onderdeel R, van de wet van 11 oktober 2012][ref1] (Stb. 545) stelt het bevoegd gezag vóór dat
      tijdstip een ontwikkelingsperspectief vast overeenkomstig [artikel 41a, eerste lid][ref2], zoals luidend door
      artikel I, onderdeel R, van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0032212#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel41a
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel178a
    references:
      - id: ref1
        bwb_id: BWBR0032212
        artikel: I
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 41a
        paragraaf: '3'
        afdeling: '1'
  - number: 178a.4
    text: |-
      [Artikel 44][ref1], zoals luidend door [artikel I, onderdeel T, van de wet][ref2] van 11 oktober 2012 (Stb. 545) is
      niet van toepassing ten aanzien van leerlingen die vóór het tijdstip van inwerkingtreding van dat artikelonderdeel
      de school hebben verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0032212#ArtikelI
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel178a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '44'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0032212
        artikel: I
  - number: 178a.5
    text: |-
      Leerlingen die speciaal onderwijs volgen die vóór het tijdstip van inwerkingtreding van
      [artikel I, onderdeel N, eerste lid, van de wet van 11 oktober 2012][ref1] (Stb. 545) de leeftijd van veertien
      jaar hebben bereikt, verlaten vóór dat tijdstip van inwerkingtreding het speciaal onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0032212#ArtikelI
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel178a
