  - number: 178d.2
    text: |-
      Het programma huisvestingsvoorzieningen dat op grond van [artikel 93 van deze wet][ref1] is vastgesteld voor
      het jaar waarin artikel II van de Wet van 7 mei 2014 houdende wijziging van de Wet op het primair onderwijs, de
      Wet op de expertisecentra en de Wet primair onderwijs BES in verband met de overheveling van taak en budget voor
      aanpassingen in onderwijshuisvesting van gemeente naar school (Stb. 175) in werking treedt, vervalt voor zover het
      betreft voorzieningen als bedoeld in [artikel 90, eerste lid, onderdeel b, van deze wet][ref2], zoals luidend op de
      dag voor de inwerkingtreding van artikel II van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel90
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel178d
