  - number: 178e.1
    text: |-
      Een school voor bijzonder onderwijs die op of na 1 juni 2006 is samengevoegd met een school voor openbaar
      onderwijs dan wel een school voor openbaar onderwijs die op of na 1 juni 2006 is samengevoegd met een school
      voor bijzonder onderwijs kan voor bekostiging in aanmerking worden gebracht als samenwerkingsschool als bedoeld
      in [artikel 28j][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28j
    url: https://wetten.overheid.nl/BWBR0003549/2020-09-01#Artikel178e
