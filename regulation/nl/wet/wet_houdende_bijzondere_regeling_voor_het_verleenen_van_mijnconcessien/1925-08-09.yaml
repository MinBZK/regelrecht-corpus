preamble:
  text: >-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.


    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:


    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is eene bijzondere regeling te maken voor het verleenen
    van concessiën tot ontginning van delfstoffen in terreinen, waarin de Rijksopsporingsdienst van Delfstoffen de
    aanwezigheid van mineralen heeft aangetoond;


    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001924/1925-08-09#ArtikelAanhef
articles:
  - number: ''
    text: >-
      Voor de terreinen, omschreven in artikel I, onder A en B, van de wet van 20 Juni 1924 (*Staatsblad* n°. 307), zal
      door Ons geen concessie krachtens de wet van 21 April 1810 (*Bulletin des Lois* n°. 285) worden verleend dan na
      voorafgaande goedkeuring van de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0001924/1925-08-09#ArtikelEenig_artikel
