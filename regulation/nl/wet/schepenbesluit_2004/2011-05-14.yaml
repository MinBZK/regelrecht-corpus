---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: schepenbesluit_2004
regulatory_layer: WET
publication_date: '2016-12-16'
valid_from: '2011-05-14'
bwb_id: BWBR0016880
url: https://wetten.overheid.nl/BWBR0016880/2011-05-14
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 11 maart 2004, nr. HDJZ/SCH/2004–541,
    Hoofddirectie Juridische Zaken;

    Gelet op het op 5 april 1966 te Londen tot stand gekomen Verdrag betreffende de uitwatering van schepen (Trb. 1966,
    275) en het op 1 november 1974 te Londen tot stand gekomen Verdrag voor de beveiliging van mensenlevens op zee
    (Trb. 1976, 157), de artikelen 3, 3a, 4, 6, 7 en 9 van de Schepenwet en artikel 38, tweede lid, van het Statuut
    voor het Koninkrijk der Nederlanden;

    De Raad van State van het Koninkrijk gehoord (advies van 17 mei 2004, nr. W09.04 0116/V/K);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 16 juni 2004, nr. HDJZ/SCH/2004–1392,
    Hoofddirectie Juridische Zaken;

    De bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.a
    text: |-
      de begrippen «schip», «passagiersschip», «vissersvaartuig», «kapitein» en «eigenaar»: hetgeen daaronder in de
      [Schepenwet][ref1] wordt verstaan;


      [ref1]: https://wetten.overheid.nl/BWBR0001876
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001876
  - number: 1.1.b
    text: 'vrachtschip: een schip, niet zijnde een passagiersschip;'
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.c
    text: 'zeilschip: een schip dat is ontworpen en gebouwd om hoofdzakelijk door middel van zeilen te worden voortbewogen;'
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.d
    text: |-
      GT: de maateenheid bruto-tonnage waarin de totale inhoud van een schip, vastgesteld overeenkomstig het op 23 juni
      1969 te Londen totstandgekomen Verdrag betreffende de meting van schepen (Trb. 1970, 122), wordt uitgedrukt;
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.e
    text: 'lengte: de overeenkomstig het verdrag, genoemd in onderdeel d, vastgestelde lengte van een schip;'
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.f
    text: |-
      internationale reis: een reis tussen twee verschillende landen, waarbij een gebied voor welks buitenlandse
      betrekkingen een buiten dat gebied zetelende regering verantwoordelijk is of waarvan de Verenigde Naties het
      besturend lichaam zijn, mede als een afzonderlijk land wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.g
    text: 'nationale reis: een reis, niet zijnde een internationale reis;'
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.h
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.i
    text: |-
      Uitwateringsverdrag: het op 5 april 1966 te Londen totstandgekomen Verdrag betreffende de uitwatering van schepen
      (Trb. 1966, 275) en de bij dat verdrag behorende bindende protocollen, aanhangsels en bijlagen;
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.j
    text: |-
      Aanvaringsverdrag: het op 20 oktober 1972 te Londen totstandgekomen Verdrag inzake Internationale Voorschriften ter
      voorkoming van aanvaringen op zee (Trb. 1974, 51);
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.k
    text: |-
      SOLAS-verdrag: het op 1 november 1974 te Londen totstandgekomen Verdrag voor de beveiliging van mensenlevens op zee
      (Trb. 1976, 157) en de bij dat verdrag behorende bindende protocollen, aanhangsels en bijlagen;
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.l
    text: 'IMO: de Internationale Maritieme Organisatie van de Verenigde Naties;'
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.m
    text: 'Maritieme Veiligheidscommissie: de gelijknamige commissie van de IMO;'
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.n
    text: |-
      BCH-Code: de bij resolutie MSC.9(53) van de Maritieme Veiligheidscommissie aangenomen Code voor de bouw en
      uitrusting van schepen die gevaarlijke chemicaliën in bulk vervoeren (Bulk Chemical Code);
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.o
    text: |-
      GC-Code: de bij resolutie A.328(IX) van de Algemene vergadering van de IMO aangenomen Code voor de bouw en
      uitrusting van schepen die vloeibaar gemaakte gassen in bulk vervoeren (Gas Carrier Code);
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.p
    text: |-
      Graancode: de bij resolutie MSC.23(59) van de Maritieme Veiligheidscommissie aangenomen Internationale Code voor
      het veilig vervoer van graan in bulk (International Grain Code);
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.q
    text: |-
      HSC-Code 1994: de bij resolutie MSC.36(63) van de Maritieme Veiligheidsheidscommissie aangenomen Internationale
      Code voor de veiligheid van hogesnelheidsschepen (High-Speed Craft Code, 1994);
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.r
    text: |-
      HSC-Code 2000: de bij resolutie MSC.97(73) van de Maritieme Veiligheidsheidscommissie aangenomen Internationale
      Code voor de veiligheid van hogesnelheidsschepen (High-Speed Craft Code, 2000);
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.s
    text: |-
      IBC-Code: de bij resolutie MSC.4(48) van de Maritieme Veiligheidscommissie aangenomen Internationale Code voor de
      bouw en uitrusting van schepen die gevaarlijke chemicaliën in bulk vervoeren (International Bulk Chemical Code);
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.t
    text: |-
      IGC-Code: de bij resolutie MSC.5(48) van de Maritieme Veiligheidscommissie aangenomen Internationale Code voor de
      bouw en uitrusting van schepen die vloeibaar gemaakte gassen in bulk vervoeren (International Gas Carrier Code);
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.u
    text: |-
      INF-Code: de bij resolutie MSC.88(71) van de Maritieme Veiligheidscommissie aangenomen Internationale Code voor
      het veilig vervoer in verpakte vorm van bestraalde splijtstoffen, plutonium en hoog-radioactief afval aan boord van
      schepen (Irradiated Nuclear Fuel Code);
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.v
    text: |-
      ISM-Code: de bij resolutie A.741(18) van de Algemene Vergadering van de IMO aangenomen Internationale Management
      Code voor scheepsveiligheid en ter voorkoming van verontreiniging (International Safety Management Code);
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: 1.1.w
    text: |-
      ISPS-Code: de bij resolutie 2 van de Conferentie van verdragsluitende regeringen die partij zijn bij het SOLAS-
      verdrag op 12 december 2002 aangenomen Internationale Code voor de beveiliging van schepen en havenfaciliteiten
      (International Ship and Port Facility Security Code).
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van de op grond van dit besluit toepasselijke verdragen en Codes wordt, tenzij bij of krachtens
      dit besluit anders is bepaald, verstaan onder Administratie: het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: '1.3'
    text: |-
      Voor de toepassing van het besluit wordt met een internationale reis gelijkgesteld een trans-Atlantische reis
      tussen landen van het Koninkrijk of delen daarvan.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel1
  - number: '2.1'
    text: |-
      Als bouwdatum van een schip wordt aangemerkt de dag waarop de kiel van het schip is gelegd, danwel de dag waarop
      met inachtneming van hetgeen dienaangaande in de op grond van dit besluit toepasselijke verdragen of Codes is
      bepaald, een met de kiellegging vergelijkbaar constructiestadium is bereikt.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel2
  - number: '2.2'
    text: |-
      In afwijking van het eerste lid wordt als bouwdatum van een schip dat een verbouwing tot een ander op grond van
      dit besluit onderscheiden scheepstype heeft ondergaan, aangemerkt de dag waarop met de verbouwing van het schip een
      aanvang is gemaakt.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel2
  - number: '2.3'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de bij nieuwbouw of
      verbouwing van schepen als bouwdatum aan te merken datum. Deze regels kunnen mede betrekking hebben op de bij
      overschrijding van een bij die regeling te bepalen termijn voor de afbouw van een schip of de voltooiing van een
      bepaalde constructiefase als bouwdatum van een schip aan te merken datum.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel2
  - number: '3'
    text: |-
      Dit besluit is niet van toepassing op vissersvaartuigen, voorzover die schepen niet worden gebruikt voor andere
      doeleinden dan het vangen van vis of andere levende rijkdommen van de zee.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel3
  - number: '4'
    text: |-
      Voor schepen met een lengte van 24 meter of meer waarmee internationale reizen worden ondernomen, is een
      internationaal certificaat van uitwatering als bedoeld in artikel 16 van het Uitwateringsverdrag benodigd.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel4
  - number: '5.1'
    text: |-
      Voor schepen waarmee internationale reizen worden ondernomen, zijn de volgende in voorschrift I/12 van het SOLAS-
      verdrag genoemde internationale veiligheidscertificaten benodigd:
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel5
  - number: 5.1.a
    text: 'voor passagiersschepen: het veiligheidscertificaat voor passagiersschepen;'
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel5
  - number: 5.1.b
    text: 'voor vrachtschepen van 500 GT of meer: het veiligheidscertificaat voor vrachtschepen;'
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel5
  - number: 5.1.c
    text: 'voor vrachtschepen van 300 GT of meer, doch minder dan 500 GT: het radioveiligheidscertificaat voor vrachtschepen.'
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel5
  - number: '5.2'
    text: |-
      Het eerste lid is niet van toepassing op zeilschepen van minder dan 500 GT, gebruikt voor het vervoer van ten
      hoogste 36 passagiers, en schepen die niet van middelen tot werktuiglijke voortstuwing zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel5
  - number: '5.3'
    text: |-
      Voor schepen waarop voorschrift II-2/19 van het SOLAS-verdrag van toepassing is, is tevens het in dat voorschrift
      bedoelde conformiteitsdocument voor het vervoer van gevaarlijke stoffen benodigd.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel5
  - number: '6.1'
    text: |-
      Voor een schip waarvoor geen internationaal veiligheidscertificaat als bedoeld in
      [artikel 5, eerste lid, onderdeel a of b][ref1], benodigd is, is een bij regeling van Onze Minister vast te stellen
      nationaal veiligheidscertificaat benodigd.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel5
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '6.2'
    text: Het eerste lid is niet van toepassing op vrachtschepen met een lengte van minder dan 12 meter.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel6
  - number: '6.3'
    text: |-
      In afwijking van het tweede lid kan voor de openbare lichamen Bonaire, Sint Eustatius en Saba bij ministeriële
      regeling worden bepaald dat een nationaal veiligheidscertificaat benodigd is voor daarbij aangewezen categorieën
      vrachtschepen met een lengte van minder dan 12 meter.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel6
  - number: '7.1'
    text: |-
      Voor een hogesnelheidsschip als bedoeld in voorschrift X/1 van het SOLAS-verdrag ten aanzien waarvan op grond van
      [artikel 16, eerste lid][ref1], is gekozen voor toepassing van de HSC-Code 1994 of de HSC-Code 2000, is het bij
      de desbetreffende Code behorende veiligheidscertificaat voor hogesnelheidsschepen benodigd, alsmede de in die Code
      voorgeschreven exploitatievergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel16
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      Het in het eerste lid bedoelde veiligheidscertificaat en de in dat lid bedoelde vergunning treden in de plaats van
      het ingevolge [artikel 5][ref1] of [6][ref2] benodigde veiligheidscertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel6
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '8.1'
    text: |-
      Voor schepen waarmee internationale reizen worden ondernomen, zijn in aanvulling op de overigens bij of krachtens
      dit besluit vereiste certificaten tevens de volgende bijzondere certificaten benodigd:
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel8
  - number: 8.1.a
    text: |-
      voor schepen die gestort graan als bedoeld in voorschrift VI/8 van het SOLAS-verdrag vervoeren: het document van
      machtiging, behorende bij de Graancode;
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel8
  - number: 8.1.b
    text: |-
      voor chemicaliëntankschepen als bedoeld in voorschrift VII/8 van het SOLAS-verdrag, gebouwd op of na 1 juli 1986:
      het internationaal certificaat van geschiktheid voor het vervoer van gevaarlijke chemicaliën in bulk, behorende bij
      de IBC-Code;
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel8
  - number: 8.1.c
    text: |-
      voor chemicaliëntankschepen als bedoeld in de BCH-Code, gebouwd voor 1 juli 1986: het certificaat van geschiktheid
      voor het vervoer van gevaarlijke chemicaliën in bulk, behorende bij de BCH-Code;
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel8
  - number: 8.1.d
    text: |-
      voor gastankschepen als bedoeld in voorschrift VII/11 van het SOLAS-verdrag, gebouwd op of na 1 juli 1986: het
      internationaal certificaat van geschiktheid voor het vervoer van vloeibaar gemaakte gassen in bulk, behorende bij
      de IGC-Code;
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel8
  - number: 8.1.e
    text: |-
      voor gastankschepen als bedoeld in de GC-Code, gebouwd voor 1 juli 1986: het certificaat van geschiktheid voor het
      vervoer van vloeibaar gemaakte gassen in bulk, behorende bij de GC-Code;
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel8
  - number: 8.1.f
    text: |-
      voor schepen, gebruikt voor het vervoer in verpakte vorm van bestraalde splijtstoffen, plutonium of hoog-
      radioactief afval als bedoeld in voorschrift VII/14 van het SOLAS-verdrag: het conformiteitsdocument, behorende bij
      de INF-Code.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel8
  - number: '8.2'
    text: Het eerste lid is van overeenkomstige toepassing op schepen waarmee nationale reizen worden ondernomen.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel8
  - number: '9.1'
    text: |-
      Voor een schip waarvoor een veiligheidscertificaat voor passagiersschepen, een veiligheidscertificaat
      voor vrachtschepen of, indien het een schip betreft waarmee internationale reizen worden ondernomen, een
      veiligheidscertificaat voor hogesnelheidsschepen benodigd is, zijn tevens de volgende certificaten benodigd:
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel9
  - number: 9.1.a
    text: het veiligheidsmanagementcertificaat, behorende bij de ISM-Code;
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel9
  - number: 9.1.b
    text: het internationaal scheepsbeveiligingscertificaat, behorende bij de ISPS-Code.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel9
  - number: '9.2'
    text: |-
      Voor de exploitatie van een schip als bedoeld in het eerste lid is een op het desbetreffende type schip betrekking
      hebbend conformiteitsdocument, behorend bij de ISM-Code, benodigd. Van dit document is aan boord van het schip een
      afschrift aanwezig.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel9
  - number: '10'
    text: |-
      De in de [artikelen 4 tot en met 8][ref1] bedoelde certificaten gaan vergezeld van de bij die certificaten
      behorende uitrustingsrapporten en aanhangsels, alsmede van de in de desbetreffende verdragen of Codes
      voorgeschreven stabiliteitsgegevens of andere gegevens met betrekking tot schip of lading.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel4
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '11.1'
    text: |-
      Een internationaal certificaat van uitwatering dat is afgegeven met inachtneming van een op grond van
      [artikel 5 van de Schepenwet][ref1] verleende vrijstelling of ontheffing, gaat vergezeld van een internationaal
      certificaat van vrijstelling betreffende de uitwatering als bedoeld in artikel 16 van het Uitwateringsverdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel5
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '5'
  - number: '11.2'
    text: |-
      Certificaten als bedoeld in [artikel 5][ref1] die zijn afgegeven met inachtneming van een op grond van
      [artikel 5 van de Schepenwet][ref2] verleende vrijstelling of ontheffing, gaan vergezeld van een certificaat van
      vrijstelling als bedoeld in voorschrift I/12 van het SOLAS-verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001876#Artikel5
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001876
        artikel: '5'
  - number: '12.1'
    text: |-
      Bij regeling van Onze Minister kan worden bepaald dat voor schepen met bijzondere eigenschappen of bestemd voor
      bijzondere doeleinden of vaargebieden, een bijzonder certificaat benodigd is. In de regeling kan worden bepaald dat
      dit certificaat in de plaats treedt van het nationaal veiligheidscertificaat.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel12
  - number: '12.2'
    text: |-
      Bij regeling van Onze Minister kunnen aanvullende regels worden gesteld met betrekking tot de voor het vervoer van
      lading of de bedrijfsvoering over schepen benodigde certificaten.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel12
  - number: '13'
    text: |-
      Een schip waarvoor een internationaal certificaat van uitwatering benodigd is, wordt ter verkrijging van
      dat certificaat en tijdens de geldigheidsduur daarvan onderworpen aan de in artikel 14, eerste lid, van het
      Uitwateringsverdrag voorgeschreven onderzoeken.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel13
  - number: '14.1'
    text: |-
      Een schip waarvoor een veiligheidscertificaat voor passagiersschepen benodigd is, wordt ter verkrijging van dat
      certificaat en tijdens de geldigheidsduur daarvan onderworpen aan de in voorschrift I/7 van het SOLAS-verdrag
      voorgeschreven onderzoeken.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel14
  - number: '14.2'
    text: |-
      Een schip waarvoor een veiligheidscertificaat voor vrachtschepen benodigd is, wordt ter verkrijging van dat
      certificaat en tijdens de geldigheidsduur daarvan onderworpen aan de in de voorschriften I/8 tot en met I/10 van
      het SOLAS-verdrag voorgeschreven onderzoeken.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel14
  - number: '14.3'
    text: |-
      Een schip waarvoor een radioveiligheidscertificaat voor vrachtschepen benodigd is, wordt ter verkrijging van dat
      certificaat en tijdens de geldigheidsduur daarvan onderworpen aan de in voorschrift I/9 van het SOLAS-verdrag
      voorgeschreven onderzoeken.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel14
  - number: '14.4'
    text: |-
      Bulkcarriers en olietankschepen als bedoeld in voorschrift IX/1, onderscheidenlijk voorschrift II-1/2, van
      het SOLAS-verdrag worden bij de onderzoeken, bedoeld in het tweede lid, tevens onderworpen aan het uitgebreid
      inspectieprogramma, bedoeld in voorschrift XI-1/2 van dat verdrag.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel14
  - number: '15.1'
    text: |-
      De voorschriften I/8 tot en met I/10 van het SOLAS-verdrag zijn, met uitzondering van de bepalingen betreffende
      jaarlijkse onderzoeken, van overeenkomstige toepassing op schepen waarvoor een nationaal veiligheidscertificaat
      benodigd is, met uitzondering van vrachtschepen met een lengte van minder dan 24 meter.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel15
  - number: '15.2'
    text: |-
      De onderzoeken waaraan een vrachtschip in verband met het nationaal veiligheidscertificaat wordt onderworpen,
      hebben, indien voor het schip tevens een radioveiligheidscertificaat benodigd is, geen betrekking op de eisen
      betreffende de radio-uitrusting van het schip.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel15
  - number: '15.3'
    text: |-
      Schepen als bedoeld in het eerste lid waarmee nationale reizen worden ondernomen, worden tevens onderworpen aan
      onderzoeken betreffende hun uitwatering. Artikel 14, eerste lid, van het Uitwateringsverdrag is van overeenkomstige
      toepassing, met uitzondering van de bepalingen betreffende jaarlijkse onderzoeken.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel15
  - number: '15.4'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de onderzoeken waaraan vrachtschepen met
      een lengte van minder dan 24 meter in verband met het nationaal veiligheidscertificaat worden onderworpen.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel15
  - number: '16.1'
    text: |-
      De eigenaar van een hogesnelheidsschip als bedoeld in voorschrift X/1 van het SOLAS-verdrag kan er voor kiezen om
      dat schip te laten onderzoeken en certificeren met inachtneming van:
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel16
  - number: 16.1.a
    text: 'voor een schip, gebouwd voor 1 juli 2002: de HSC-Code 1994;'
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel16
  - number: 16.1.b
    text: 'voor een schip, gebouwd op of na 1 juli 2002: de HSC-Code 2000.'
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel16
  - number: '16.2'
    text: |-
      Indien ten aanzien van een hogesnelheidsschip is gekozen voor toepassing van de HSC-Code 1994 of de HSC-Code
      2000, treden de in de desbetreffende Code voorgeschreven onderzoeken in de plaats van de in [artikel 14][ref1]
      of [15][ref2] bedoelde onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel15
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '17'
    text: |-
      Een schip waarvoor een certificaat behorende bij een in [artikel 8][ref1] genoemde Code benodigd is, wordt ter
      verkrijging van dat certificaat en tijdens de geldigheidsduur daarvan onderworpen aan de in de desbetreffende Code
      voorgeschreven onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel8
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '18.1'
    text: |-
      Een schip waarvoor een veiligheidsmanagementcertificaat benodigd is, wordt ter verkrijging van dat certificaat en
      tijdens de geldigheidsduur daarvan onderworpen aan de in de ISM-Code voorgeschreven onderzoeken.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel18
  - number: '18.2'
    text: |-
      De bedrijfsorganisatie van de eigenaar van een schip als bedoeld in het eerste lid, wordt ter verkrijging van het
      conformiteitsdocument, bedoeld in [artikel 9, tweede lid][ref1], en tijdens de geldigheidsduur van datdocument
      onderworpen aan de in de ISM-Code voorgeschreven onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel9
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '19'
    text: |-
      Een schip waarvoor een internationaal scheepsbeveiligingscertificaat benodigd is, wordt ter verkrijging van dat
      certificaat en tijdens de geldigheidsduur daarvan onderworpen aan de in de ISPS-Code voorgeschreven onderzoeken.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel19
  - number: '20.1'
    text: |-
      De in de [artikelen 13 tot en met 17][ref1] en [19][ref2] bedoelde onderzoeken vinden plaats op de in de
      desbetreffende verdragen en Codes voorgeschreven tijdstippen, met dien verstande dat het hernieuwde onderzoek
      waaraan een schip in verband met de vernieuwing van een certificaat wordt onderworpen, steeds plaatsvindt in de
      laatste drie maanden van de geldigheidsduur van het desbetreffende certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel19
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '20.2'
    text: |-
      De in [artikel 18][ref1] bedoelde onderzoeken vinden plaats op de in de ISM-Code voorgeschreven tijdstippen, met
      dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel18
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 20.2.a
    text: |-
      het eerste onderzoek waaraan een schip in verband met de eerste afgifte van een veiligheidsmanagementcertificaat
      wordt onderworpen, plaatsvindt nadat het door de ISM-Code voorgeschreven veiligheidsmanagementsysteem gedurende ten
      minste drie maanden aan boord van dat schip is toegepast;
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel20
  - number: 20.2.b
    text: |-
      het eerste onderzoek waaraan een bedrijfsorganisatie in verband met de eerste afgifte van het
      conformiteitsdocument, bedoeld in [artikel 9, tweede lid][ref1], wordt onderworpen, plaatsvindt nadat het door de
      ISM-Code voorgeschreven veiligheidsmanagementsysteem gedurende ten minste drie maanden in die organisatie, alsmede
      aan boord van ten minste één schip van het type waarop het systeem betrekking heeft, is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel9
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '21'
    text: |-
      Van de onderzoeken waaraan een schip ingevolge de [artikelen 13 tot en met 19][ref1] tijdens de geldigheidsduur
      van een certificaat wordt onderworpen, wordt door degene die het onderzoek heeft verricht, aantekening geplaatst op
      het certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel13
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '22.1'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de onderzoeken waaraan schepen in verband
      met een krachtens [artikel 12][ref1] vereist certificaat worden onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel12
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '22.2'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de onderzoeken waaraan
      schepen waarvoor een certificaat als bedoeld in de [artikelen 4 tot en met 9][ref1] benodigd is, worden
      onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel4
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '23.1'
    text: |-
      Onze Minister wijst de natuurlijke personen en rechtspersonen aan die zijn belast met door hem aan te geven, in het
      kader van de in de [artikelen 13 tot en met 19][ref1] en [22][ref2] bedoelde onderzoeken te verrichten taken.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel22
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '23.2'
    text: |-
      Een ingevolge het eerste lid aangewezen natuurlijke persoon of rechtspersoon is, indien bij een onderzoek gebreken
      aan het schip of zijn uitrusting worden geconstateerd, bevoegd om herstel van deze gebreken te vorderen.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel23
  - number: '23.3'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de wijze waarop de ingevolge het
      eerste lid aangewezen natuurlijke personen en rechtspersonen hun taken uitoefenen.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel23
  - number: '24.1'
    text: |-
      Nadat een bij of krachtens dit besluit voorgeschreven onderzoek is voltooid, wordt de toestand van het
      schip en zijn uitrusting gehandhaafd in overeenstemming met de bij of krachtens dit besluit gestelde regels.
      In deze toestand wordt geen verandering aangebracht zonder voorafgaande toestemming van het Hoofd van de
      Scheepvaartinspectie of van de ingevolge [artikel 23, eerste lid][ref1], aangewezen natuurlijke persoon of
      rechtspersoon die het onderzoek heeft uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel23
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '24.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de ter voldoening aan de ISPS-Code of ter uitvoering van het in
      die Code voorgeschreven scheepsbeveiligingsplan getroffen beveiligingsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel24
  - number: '25.1'
    text: |-
      De aanvraag van een bij of krachtens dit besluit vereist certificaat geschiedt schriftelijk bij het Hoofd van de
      Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel25
  - number: '25.2'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de bij de aanvraag van een certificaat te
      verstrekken gegevens en te overleggen bescheiden.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel25
  - number: '26.1'
    text: |-
      Een veiligheidscertificaat voor passagiersschepen, een veiligheidscertificaat voor vrachtschepen of, indien het een
      schip betreft waarmee internationale reizen worden ondernomen, een veiligheidscertificaat voor hogesnelheidsschepen
      wordt slechts afgegeven, indien voor het desbetreffende schip een veiligheidsmanagementcertificaat is afgegeven.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel26
  - number: '26.2'
    text: |-
      Een veiligheidsmanagementcertificaat wordt slechts afgegeven, indien de eigenaar van het schip voor dat type schip
      beschikt over een conformiteitsdocument als bedoeld in [artikel 9, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel9
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '27.1'
    text: |-
      Voor een schip dat door zijn eigenaar voor het eerst in gebruik wordt genomen, kan voorafgaande aan het in
      [artikel 20, tweede lid, onderdeel a][ref1], bedoelde onderzoek een voorlopig veiligheidsmanagementcertificaat met
      een geldigheidsduur van ten hoogste zes maanden worden afgegeven, indien aan de in de ISM-Code gestelde voorwaarden
      voor de afgifte van een voorlopig certificaat is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel20
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '27.2'
    text: |-
      Ten behoeve van een nieuw gevestigde eigenaar of een eigenaar die een nieuw scheepstype in gebruik neemt,
      kan voorafgaande aan het in [artikel 20, tweede lid, onderdeel b][ref1], bedoelde onderzoek een voorlopig
      conformiteitsdocument met een geldigheidsduur van ten hoogste twaalf maanden worden afgegeven, indien aan de in de
      ISM-Code gestelde voorwaarden voor de afgifte van een voorlopig conformiteitsdocument is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel20
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '28.1'
    text: |-
      Voor een schip dat door zijn eigenaar voor het eerst of opnieuw in gebruik wordt genomen, kan een voorlopig
      internationaal scheepsbeveiligingscertificaat met een geldigheidsduur van ten hoogste zes maanden worden afgegeven,
      indien aan de in de ISPS-Code gestelde voorwaarden voor de afgifte van een voorlopig certificaat is voldaan.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel28
  - number: '28.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op schepen die voor het eerst of opnieuw onder de vlag van het
      Koninkrijk in gebruik worden genomen.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel28
  - number: '29.1'
    text: |-
      Het veiligheidscertificaat voor passagiersschepen en, indien afgegeven voor een passagiersschip, het
      veiligheidscertificaat voor hogesnelheidsschepen hebben een geldigheidsduur van een jaar. De overige in
      de [artikelen 4 tot en met 9][ref1] genoemde certificaten hebben, evenals veiligheidscertificaten voor
      hogesnelheidsschepen die zijn afgegeven voor vrachtschepen, een geldigheidsduur van vijf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel4
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '29.2'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan certificaten afgeven met een kortere geldigheidsduur dan in het eerste
      lid bepaald, indien nog niet alle onderzoeken naar zijn genoegen zijn voltooid, of indien hij nog niet over alle
      door hem gevraagde gegevens over het schip beschikt.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel29
  - number: '29.3'
    text: |-
      De geldigheidsduur van een certificaat van vrijstelling als bedoeld in [artikel 11, eerste of tweede lid][ref1], is
      niet langer dan de geldigheidsduur van het certificaat waarbij het behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel11
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '30'
    text: |-
      Na voltooiing van een hernieuwd onderzoek in verband met de vernieuwing van een certificaat is het nieuwe
      certificaat, in afwijking van [artikel 29, eerste lid][ref1], geldig vanaf de datum van voltooiing van het
      desbetreffende onderzoek tot:


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel29
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 30.a
    text: |-
      indien het een veiligheidscertificaat voor passagiersschepen of een veiligheidscertificaat voor
      hogesnelheidsschepen, afgegeven voor een passagiersschip, betreft: een datum niet later dan twaalf maanden na de
      vervaldatum van het bestaande certificaat;
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel30
  - number: 30.b
    text: |-
      voor de overige in de [artikelen 4 tot en met 9][ref1] genoemde certificaten: een datum niet later dan vijf jaren
      na de vervaldatum van het bestaande certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel4
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '31.1'
    text: |-
      Indien een schip zich op het tijdstip waarop een certificaat zijn geldigheid verliest, niet in een haven bevindt
      waar een hernieuwd onderzoek kan plaatsvinden, kan het Hoofd van de Scheepvaartinspectie de geldigheidsduur van het
      certificaat met ten hoogste drie maanden verlengen ten einde het schip in staat te stellen zijn reis naar de haven
      waar het zal worden onderzocht, te voltooien. Het schip verlaat die haven vervolgens niet zonder nieuw certificaat.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel31
  - number: '31.2'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan de geldigheidsduur van een certificaat dat is afgegeven ten behoeve van
      een schip dat korte reizen maakt, met ten hoogste een maand verlengen.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel31
  - number: '31.3'
    text: |-
      In een geval als bedoeld in het eerste of tweede lid wordt na de voltooiing van het hernieuwde onderzoek de
      geldigheidsduur van het nieuwe certificaat bepaald aan de hand van de oorspronkelijke vervaldatum van het bestaande
      certificaat.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel31
  - number: '31.4'
    text: |-
      Indien na de voltooiing van een hernieuwd onderzoek het nieuwe certificaat niet voor de vervaldatum van het
      bestaande certificaat kan worden afgegeven of aan het schip kan worden verstrekt, kan degene die het onderzoek
      heeft uitgevoerd daarvan een aantekening plaatsen op het bestaande certificaat. In dat geval wordt het bestaande
      certificaat nog als geldig aangemerkt voor een tijdvak van ten hoogste vijf maanden na zijn vervaldatum.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel31
  - number: '32'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de geldigheidsduur van de krachtens
      [artikel 12][ref1] vereiste certificaten en kunnen nadere regels worden gesteld met betrekking tot de
      geldigheidsduur van de in de [artikelen 4 tot en met 9][ref2] en [11][ref3] bedoelde certificaten.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0016880#Artikel11
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0016880
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '33'
    text: |-
      In Aruba, Curaçao en Sint Maarten wordt de weigering van een certificaat schriftelijk en gemotiveerd gegeven en
      bekendgemaakt door toezending of uitreiking aan de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel33
  - number: '34.1'
    text: |-
      Indien een schip door zijn eigenaar wordt onttrokken aan zijn algemene bestemming als passagiersschip of
      vrachtschip, vervallen de voor dat schip afgegeven certificaten.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel34
  - number: '34.2'
    text: |-
      Indien een schip door zijn eigenaar wordt onttrokken aan een bijzondere bestemming die het had ten tijde van
      de afgifte van de voor dat schip benodigde certificaten, doch zijn algemene bestemming als passagiersschip of
      vrachtschip behoudt, vervallen de in verband met die bijzondere bestemming afgegeven certificaten.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel34
  - number: '35'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan de geldigheid van een certificaat dat ingevolge
      [artikel 7, eerste lid, onderdeel b, van de Schepenwet][ref1] is vervallen, herstellen, indien naar zijn mening bij
      een inspectie voldoende is gebleken dat het schip voldoet aan de desbetreffende eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel7
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '7'
  - number: '36'
    text: |-
      Onze Minister wijst de instanties aan waarvan de regels kunnen gelden als eisen als bedoeld in
      [artikel 3a, eerste lid, van de Schepenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel3a
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: 3a
  - number: '37.1'
    text: |-
      Voordat een schip in verband met de eerste afgifte van een bij of krachtens dit besluit voorgeschreven certificaat
      aan een eerste onderzoek wordt onderworpen, kiest de eigenaar of de bouwer van dat schip voor de regels van een
      ingevolge [artikel 36][ref1] aangewezen instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel36
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '37.2'
    text: |-
      Een schip wordt ontworpen, gebouwd en onderhouden volgens de scheepsbouwkundige, werktuigkundige en
      elektrotechnische regels van de in het eerste lid bedoelde instantie, voorzover die regels niet in strijd zijn met
      de bij of krachtens dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel37
  - number: '37.3'
    text: |-
      Een schip is uitgerust met de middelen die voor dat schip zijn voorgeschreven volgens de uitrustingsregels van de
      in het eerste lid bedoelde instantie, voorzover die regels niet in strijd zijn met de bij of krachtens dit besluit
      gestelde regels.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel37
  - number: '38.1'
    text: |-
      Passagiersschepen van 100 GT of meer en vrachtschepen van 300 GT of meer zijn voorzien van een uniek
      scheepsidentificatienummer dat voldoet aan voorschrift XI-1/3 van het SOLAS-verdrag.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel38
  - number: '38.2'
    text: |-
      Het eerste lid is niet van toepassing op schepen die niet zijn voorzien van middelen tot werktuiglijke
      voortstuwing, en schepen waarmee uitsluitend nationale reizen worden ondernomen.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel38
  - number: '38.3'
    text: |-
      Aan boord van een schip waarvoor een veiligheidscertificaat voor passagiersschepen, een veiligheidscertificaat
      voor vrachtschepen of, indien het een schip betreft waarmee internationale reizen worden ondernomen, een
      veiligheidscertificaat voor hogesnelheidsschepen benodigd is, is een overzichtsdocument met onder meer de
      eigendoms- en registratiegegevens van het schip (*Continuous Synopsis Record*) aanwezig, dat voldoet aan
      voorschrift XI-1/5 van het SOLAS-verdrag.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel38
  - number: '39'
    text: |-
      Een schip waarvoor een internationaal certificaat van uitwatering benodigd is, voldoet aan de op dat schip van
      toepassing zijnde eisen van het Uitwateringsverdrag.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel39
  - number: '40.1'
    text: |-
      Een schip waarvoor een veiligheidscertificaat voor passagiersschepen of een veiligheidscertificaat voor
      vrachtschepen benodigd is, voldoet aan de op dat schip van toepassing zijnde eisen van de hoofdstukken II-1, II-2,
      III, IV, V en XII van het SOLAS-verdrag.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel40
  - number: '40.2'
    text: |-
      Een schip waarvoor een radioveiligheidscertificaat voor vrachtschepen benodigd is, voldoet aan de op dat schip
      van toepassing zijnde eisen van de hoofdstukken IV en, met betrekking tot de radio-uitrusting aan boord van
      groepsreddingmiddelen, III van het SOLAS-verdrag.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel40
  - number: '40.3'
    text: |-
      De eisen van hoofdstuk V van het SOLAS-verdrag zijn, voorzover door Onze Minister met inachtneming van voorschrift
      V/1 van het verdrag niet anders is bepaald, eveneens van toepassing op schepen waarvoor geen veiligheidscertificaat
      als bedoeld in het eerste lid benodigd is.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel40
  - number: '41.1'
    text: |-
      De eisen van de hoofdstukken II-1, II-2, III, IV en XII van het SOLAS-verdrag zijn van overeenkomstige toepassing
      op schepen waarvoor een nationaal veiligheidscertificaat benodigd is, met uitzondering van vrachtschepen met een
      lengte van minder dan 24 meter.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel41
  - number: '41.2'
    text: |-
      Voor de toepassing van de hoofdstukken II-1, II-2 en, met uitzondering van de eisen betreffende de radio-uitrusting
      aan boord van groepsreddingmiddelen, III wordt een vrachtschip van minder dan 500 GT gelijkgesteld met een
      vrachtschip van 500 GT. Voor de toepassing van de hoofdstukken IV en, met betrekking tot de radio-uitrusting aan
      boord van groepsreddingmiddelen, III wordt een vrachtschip van minder dan 300 GT gelijkgesteld met een vrachtschip
      van 300 GT.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel41
  - number: '41.3'
    text: |-
      Op een schip met een lengte van 24 meter of meer waarvoor een nationaal veiligheidscertificaat benodigd
      is, zijn, indien het een schip betreft waarmee nationale reizen worden ondernomen, tevens de eisen van het
      Uitwateringsverdrag van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel41
  - number: '41.4'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de eisen die in verband met het nationaal
      veiligheidscertificaat aan vrachtschepen met een lengte van minder dan 24 meter worden gesteld.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel41
  - number: '41.5'
    text: |-
      Een schip voldoet ter verkrijging van het nationaal veiligheidscertificaat tevens aan de op dat schip van
      toepassing zijnde eisen van hoofdstuk V van het SOLAS-verdrag.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel41
  - number: '42.1'
    text: |-
      Een hogesnelheidsschip ten aanzien waarvan op grond van [artikel 16, eerste lid][ref1], is gekozen voor toepassing
      van de HSC-Code 1994 of de HSC-Code 2000, voldoet aan de eisen van de desbetreffende Code.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel16
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '42.2'
    text: |-
      Een hogesnelheidsschip voldoet, met inachtneming van hetgeen dienaangaande in voorschrift X/3 van het SOLAS-verdrag
      is bepaald, ter verkrijging van het veiligheidscertificaat voor hogesnelheidsschepen tevens aan de op dat schip van
      toepassing zijnde eisen van hoofdstuk V van het SOLAS-verdrag.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel42
  - number: '43'
    text: |-
      Een schip waarvoor een certificaat behorende bij een in [artikel 8][ref1] genoemde Code benodigd is, voldoet in
      aanvulling op de overigens bij of krachtens dit besluit gestelde eisen tevens aan de eisen van de desbetreffende
      Code.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel8
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '44'
    text: |-
      Een schip waarvoor een internationaal scheepsbeveiligingscertificaat benodigd is, voldoet aan voorschrift XI-2/6
      van het SOLAS-verdrag.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel44
  - number: '45.1'
    text: |-
      Elk schip is voorzien van de in de op dat schip toepasselijke voorschriften van het Aanvaringsverdrag
      voorgeschreven lichten, dagmerken en geluidseinen.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel45
  - number: '45.2'
    text: |-
      Schepen waarvoor een veiligheidscertificaat als bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref1],
      [6][ref2] of [7, eerste lid][ref3], benodigd is, voldoen ter verkrijging van dat certificaat tevens aan de in het
      eerste lid bedoelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0016880#Artikel7
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0016880
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '46.1'
    text: |-
      Bij regeling van Onze Minister worden de eisen vastgesteld waaraan schepen in verband met een krachtens
      [artikel 12][ref1] vereist certificaat moeten voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel12
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '46.2'
    text: |-
      Bij regeling van Onze Minister kunnen aanvullende eisen worden vastgesteld voor schepen waarvoor een certificaat
      als bedoeld in de [artikelen 4 tot en met 9][ref1] benodigd is, alsmede nadere regels met betrekking tot de in de
      [artikelen 38 tot en met 45][ref2] bedoelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel38
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '47'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan, met inachtneming van hetgeen dienaangaande in het desbetreffende
      verdrag of de desbetreffende Code is bepaald, afwijking toestaan van de in de [artikelen 39 tot en met 45][ref1]
      bedoelde eisen, indien aan boord van het schip een voorziening wordt getroffen die naar zijn oordeel ten minste
      gelijkwaardig is aan de in het voorschrift waarvan wordt afgeweken, geëiste voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel39
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '48.1'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de toelating en keuring van aan
      boord van schepen te plaatsen uitrusting of in schepen toe te passen onderdelen en materialen.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel48
  - number: '48.2'
    text: |-
      Onze Minister kan natuurlijke personen of rechtspersonen aanwijzen die zijn belast met door hem aan te geven,
      in het kader van het eerste lid te verrichten onderzoeken. Voorts kan hij natuurlijke personen of rechtspersonen
      aanwijzen die zijn belast met onderzoeken of ijking van aan boord van schepen aanwezige uitrusting.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel48
  - number: '48.3'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de wijze waarop de ingevolge het
      tweede lid aangewezen natuurlijke personen en rechtspersonen hun taken uitoefenen.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel48
  - number: '49.1'
    text: |-
      De eigenaar van een schip waarvoor een veiligheidsmanagementcertificaat benodigd is, draagt er in verband met het
      voor de exploitatie van dat schip benodigde conformiteitsdocument, behorend bij de ISM-Code, zorg voor dat in zijn
      bedrijfsorganisatie een veiligheidsmanagementsysteem wordt ontwikkeld en toegepast, dat voldoet aan de eisen van de
      ISM-Code.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel49
  - number: '49.2'
    text: |-
      Aan boord van een schip waarvoor een veiligheidsmanagementcertificaat benodigd is, wordt het voor dat schip
      ontwikkelde veiligheidsmanagementsysteem toegepast.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel49
  - number: '50.1'
    text: |-
      De eigenaar van een schip waarvoor een internationaal scheepsbeveiligingscertificaat benodigd is, draagt er zorg
      voor dat met betrekking tot dat schip een scheepsbeveiligingsplan wordt ontwikkeld en toegepast, dat voldoet aan de
      eisen van de ISPS-Code.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel50
  - number: '50.2'
    text: |-
      Voorts draagt de eigenaar er, met inachtneming van hetgeen dienaangaande in de ISPS-Code is bepaald, zorg voor dat
      in zijn bedrijfsorganisatie en aan boord van elk schip waarvoor een internationaal beveiligingscertificaat benodigd
      is, een beveiligingsfunctionaris is aangesteld, die is belast met de in de ISPS-Code voorgeschreven taken.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel50
  - number: '50.3'
    text: |-
      [Artikel 47][ref1] is van overeenkomstige toepassing op de ter voldoening aan de ISPS-Code aan boord van schepen te
      treffen beveiligingsmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel47
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '51'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de bedrijfsvoering over schepen
      waarvoor een op de bedrijfsvoering betrekking hebbend certificaat als bedoeld in [artikel 12, tweede lid][ref1],
      benodigd is, alsmede nadere regels met betrekking tot de bedrijfsvoering over schepen als bedoeld in de
      [artikelen 49][ref2] en [50][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0016880#Artikel50
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0016880
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '52'
    text: |-
      Bij het vervoer van lading, niet zijnde gevaarlijke stoffen als bedoeld in hoofdstuk VII van het SOLAS-verdrag,
      worden de algemene voorschriften van hoofdstuk VI, deel A, van dat verdrag in acht genomen.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel52
  - number: '53.1'
    text: |-
      Het vervoer van gestorte ladingen, niet zijnde gevaarlijke stoffen als bedoeld in hoofdstuk VII van het SOLAS-
      verdrag, geschiedt met inachtneming van de in hoofdstuk VI, deel B, van dat verdrag gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel53
  - number: '53.2'
    text: |-
      In afwijking van het eerste lid geschiedt het vervoer van gestort graan als omschreven in voorschrift VI/8 van het
      SOLAS-verdrag met inachtneming van de in hoofdstuk VI, deel C, van dat verdrag gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel53
  - number: '53.3'
    text: |-
      Indien het vervoer geschiedt met een bulkschip als bedoeld in voorschrift IX/1 van het SOLAS-verdrag, worden tevens
      de voorschriften van hoofdstuk XII van dat verdrag in acht genomen.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel53
  - number: '54'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot het vervoer van lading, niet
      zijnde gevaarlijke stoffen, alsmede nadere regels met betrekking tot de in de [artikelen 52][ref1] en [53][ref2]
      bedoelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel53
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '55.1'
    text: |-
      Het vervoer van gevaarlijke stoffen in verpakte vorm als bedoeld in voorschrift VII/1 van het SOLAS-verdrag is
      uitsluitend toegestaan met inachtneming van de in hoofdstuk VII, deel A, van dat verdrag gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel55
  - number: '55.2'
    text: |-
      Het vervoer in verpakte vorm van bestraalde splijtstoffen, plutonium of hoog-radioactief afval als bedoeld
      in voorschrift VII/14 van het SOLAS-verdrag, is bovendien uitsluitend toegestaan met een schip waarvoor het
      conformiteitsdocument, behorende bij de INF-Code, is afgegeven en met inachtneming van die in die Code opgenomen
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel55
  - number: '56.1'
    text: |-
      Het vervoer van gevaarlijke stoffen in vaste vorm in bulk als bedoeld in voorschrift VII/7 van het SOLAS-
      verdrag, is uitsluitend toegestaan met inachtneming van de in hoofdstuk VII, deel A-1, van dat verdrag gegeven
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel56
  - number: '56.2'
    text: |-
      [Artikel 53, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel53
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '57.1'
    text: |-
      Het vervoer in bulk van chemicaliën als bedoeld in de IBC-Code met een schip, gebouwd op of na 1 juli 1986, is
      uitsluitend toegestaan, indien voor dat schip een internationaal certificaat van geschiktheid voor het vervoer van
      gevaarlijke chemicaliën in bulk, behorende bij de IBC-Code, is afgegeven en met inachtneming van de in die Code
      opgenomen voorschriften.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel57
  - number: '57.2'
    text: |-
      Het vervoer in bulk van chemicaliën als bedoeld in de BCH-Code met een schip, gebouwd voor 1 juli 1986, is
      uitsluitend toegestaan, indien voor dat schip een certificaat van geschiktheid voor het vervoer van gevaarlijke
      chemicaliën in bulk, behorende bij de BCH-Code, is afgegeven en met inachtneming van de in die Code opgenomen
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel57
  - number: '57.3'
    text: |-
      Het vervoer in bulk van vloeibaar gemaakte gassen als bedoeld in de IGC-Code met een schip, gebouwd op of na 1 juli
      1986, is uitsluitend toegestaan, indien voor dat schip een internationaal certificaat van geschiktheid voor het
      vervoer van vloeibaar gemaakte gassen in bulk, behorende bij de IGC-Code, is afgegeven en met inachtneming van de
      in die Code opgenomen voorschriften.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel57
  - number: '57.4'
    text: |-
      Het vervoer in bulk van vloeibaar gemaakte gassen als bedoeld in de GC-Code met een schip, gebouwd voor 1 juli
      1986, is uitsluitend toegestaan, indien voor dat schip een certificaat van geschiktheid voor het vervoer van
      vloeibaar gemaakte gassen in bulk, behorende bij de GC-Code, is afgegeven en met inachtneming van de in die Code
      opgenomen voorschriften.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel57
  - number: '58'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot het vervoer van gevaarlijke
      stoffen, alsmede nadere regels met betrekking tot de in de [artikelen 55 tot en met 57][ref1] bedoelde
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel55
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '59.1'
    text: |-
      Onze Minister kan natuurlijke personen of rechtspersonen aanwijzen die zijn belast met in het kader van de bij
      of krachtens de [artikelen 52 tot en met 58][ref1] gestelde regels te verrichten onderzoeken van schepen en hun
      lading.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel52
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '59.2'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de wijze waarop de ingevolge het
      eerste lid aangewezen natuurlijke personen en rechtspersonen hun taken uitoefenen.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel59
  - number: '60.1'
    text: |-
      De kapitein van een schip waarvoor een internationaal certificaat van uitwatering benodigd is, draagt er met
      inachtneming van hetgeen dienaangaande in het Uitwateringsverdrag is bepaald, zorg voor dat het schip voorafgaande
      aan en gedurende een reis geen geringer vrijboord heeft dan voor dat schip op die reis is toegestaan.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel60
  - number: '60.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op schepen met een lengte van 24 meter of meer, waarvoor een
      nationaal veiligheidscertificaat benodigd is en waarmee nationale reizen worden ondernomen.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel60
  - number: '61.1'
    text: |-
      De kapitein van elk schip waarmee een reis wordt ondernomen, draagt er zorg voor dat voorafgaande aan de reis
      en gedurende de reis de in hoofdstuk V van het SOLAS-verdrag opgenomen voorschriften en verplichtingen worden
      nageleefd.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel61
  - number: '61.2'
    text: |-
      Indien voor het schip een veiligheidscertificaat voor passagiersschepen of een veiligheidscertificaat voor
      vrachtschepen benodigd is, draagt de kapitein er tevens zorg voor dat aan boord van het schip de in de hoofdstukken
      II-1 tot en met IV van het SOLAS-verdrag opgenomen voorschriften en verplichtingen worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel61
  - number: '61.3'
    text: |-
      Indien voor het schip een radioveiligheidscertificaat voor vrachtschepen benodigd is, draagt de kapitein er
      tevens zorg voor dat aan boord van het schip de in hoofdstuk IV van het SOLAS-verdrag opgenomen voorschriften en
      verplichtingen worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel61
  - number: '61.4'
    text: |-
      Het tweede lid is van overeenkomstige toepassing op schepen waarvoor een nationaal veiligheidscertificaat benodigd
      is, met uitzondering van vrachtschepen met een lengte van minder dan 24 meter.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel61
  - number: '62'
    text: |-
      De kapitein van een schip waarvoor een veiligheidscertificaat, behorende bij de HSC-Code 1994 of de HSC-Code 2000,
      benodigd is, draagt er, onverminderd [artikel 61, eerste lid][ref1], zorg voor dat aan boord van het schip de in de
      desbetreffende Code opgenomen voorschriften en verplichtingen worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel61
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '61'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '63.1'
    text: |-
      De kapitein van een schip waarvoor een veiligheidsmanagementcertificaat benodigd is, draagt er zorg voor dat aan
      boord van het schip het in de ISM-Code voorgeschreven veiligheidsmanagementsysteem wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel63
  - number: '63.2'
    text: |-
      De kapitein van een schip waarvoor een internationaal scheepsbeveiligingscertificaat benodigd is, draagt er zorg
      voor dat aan boord van het schip het in de ISPS-Code voorgeschreven scheepsbeveiligingsplan wordt toegepast en dat
      de uit hoofdstuk XI-2 van het SOLAS-verdrag voortvloeiende voorschriften en verplichtingen worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel63
  - number: '63.3'
    text: 'De vaststelling van het beveiligingsniveau, bedoeld in voorschrift XI-2/3.1 van het SOLAS-verdrag, geschiedt door:'
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel63
  - number: 63.3.a
    text: |-
      voor in Nederland geregistreerde schepen: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, in
      overeenstemming met Onze Ministers van Algemene Zaken en van Justitie;
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel63
  - number: 63.3.b
    text: |-
      voor in Aruba, Curaçao onderscheidenlijk Sint Maarten geregistreerde schepen: de minster van Aruba, Curaçao
      onderscheidenlijk Sint Maarten belast met het beleidsterrein scheepvaart.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel63
  - number: '64'
    text: |-
      De kapitein draagt er zorg voor dat de aan boord aanwezige dagboeken worden bijgehouden met inachtneming van
      hetgeen dienaangaande in de op grond van dit besluit toepasselijke verdragen en Codes is bepaald.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel64
  - number: '65'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de aan boord van een schip of
      de bij het ondernemen van een reis door de kapitein in acht te nemen voorschriften en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel65
  - number: '66.1'
    text: |-
      De kapitein van een zich op zee bevindend schip is, wanneer hem een melding of signaal bereikt dat een of meer
      personen op zee in nood verkeren, verplicht om deze personen te hulp te komen.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel66
  - number: '66.2'
    text: |-
      De kapitein is voorts verplicht gevolg te geven aan de vordering van de kapitein van een in nood verkerend schip om
      diens schip te hulp te komen.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel66
  - number: '66.3'
    text: |-
      Op de in het eerste en tweede lid bedoelde verplichtingen zijn de bepalingen van voorschrift V/33 van het SOLAS-
      verdrag van toepassing.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel66
  - number: '67.1'
    text: |-
      Indien een schip schade heeft opgelopen of zich een voorval heeft voorgedaan waardoor het vermoeden rijst dat
      schade of een gebrek is ontstaan waardoor de veiligheid van het schip kan zijn beïnvloed, licht de kapitein zo
      spoedig mogelijk het Hoofd van de Scheepvaartinspectie in. Indien de schade of het voorval betrekking heeft op
      de romp of de machine- en elektrische installaties, licht de kapitein tevens de in [artikel 37][ref1] bedoelde
      instantie in. Voorts licht hij, indien het schip zich in een haven buiten het Koninkrijk bevindt, de ter plaatse
      bevoegde autoriteiten in.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel37
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '67.2'
    text: |-
      Indien het schip zich in een haven bevindt, mag de reis niet worden voortgezet, voordat de kapitein van het
      Hoofd van de Scheepvaartinspectie of van de in het eerste lid bedoelde instantie een verklaring heeft ontvangen,
      inhoudende dat eventuele herstellingen naar behoren zijn geschied of dat de reis zonder bezwaar voor de veiligheid
      kan worden voortgezet, voorzover de ter plaatse bevoegde autoriteiten zich niet tegen voortzetting van de reis
      verzetten.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel67
  - number: '68.1'
    text: |-
      De kapitein is verplicht de hem vanwege Onze Minister van Defensie ter hand te stellen bescheiden te aanvaarden,
      van die bescheiden kennis te nemen en de daarbij gegeven aanwijzingen op te volgen. De kapitein bewaart de
      bescheiden op een doelmatige plaats.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel68
  - number: '68.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op door middel van elektronische gegevensdragers of langs
      elektronische weg beschikbaar gestelde bescheiden.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel68
  - number: '69.1'
    text: |-
      Voorzover de bij of krachtens dit besluit gestelde regels bij aanvang van een reis op een schip niet van toepassing
      zijn, zullen zij, indien de kapitein ten gevolge van slecht weer of een ander geval van overmacht genoodzaakt is
      van de voorgenomen reis af te wijken, niet op dat schip van toepassing worden.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel69
  - number: '69.2'
    text: |-
      Voorzover het aantal opvarenden of passagiers aan boord van een schip bepalend is voor de toepasselijkheid van
      bij of krachtens dit besluit gestelde regels, wordt bij de berekening van dit aantal geen rekening gehouden met
      personen die zich ten gevolge van overmacht of ten gevolge van een wettelijke verplichting van de kapitein om
      schipbreukelingen of andere personen over te voeren, aan boord bevinden.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel69
  - number: 69a
    text: |-
      Gedragingen in strijd met het bepaalde in de [artikelen 61][ref1], [64][ref2], [66][ref3], [67][ref4] en [68][ref5]
      alsmede gedragingen in strijd met het bepaalde krachtens [artikel 65][ref6] zijn strafbare feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0016880#Artikel66
      [ref4]: https://wetten.overheid.nl/BWBR0016880#Artikel67
      [ref5]: https://wetten.overheid.nl/BWBR0016880#Artikel68
      [ref6]: https://wetten.overheid.nl/BWBR0016880#Artikel65
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '61'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '64'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0016880
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0016880
        artikel: '67'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0016880
        artikel: '68'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0016880
        artikel: '65'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '70.1'
    text: |-
      Onze Minister draagt zorg voor de bekendmaking van de op grond van dit besluit toepasselijke Codes, voor zover
      bekendmaking daarvan niet geschiedt in het Tractatenblad.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel70
  - number: '70.2'
    text: |-
      Van de wijze van bekendmaking wordt mededeling gedaan in de Staatscourant, de Landscourant van Aruba, de Curaçaose
      Courant en de Landscourant van Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel70
  - number: '71.1'
    text: |-
      Een wijziging van de op grond van dit besluit toepasselijke verdragen en Codes gaat, tenzij bij besluit van Onze
      Minister anders is bepaald, voor de toepassing van dit besluit gelden met ingang van de dag waarop die wijziging
      internationaal in werking treedt.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel71
  - number: '71.2'
    text: |-
      Voorzover een wijziging als bedoeld in het eerste lid slechts geldt ten aanzien van schepen gebouwd op of na een
      bepaalde datum, blijft, tenzij bij besluit van Onze Minister anders is bepaald, op schepen gebouwd voor die datum,
      het verdrag of de Code zoals dat, onderscheidenlijk die, voor de desbetreffende wijziging luidde, van toepassing,
      met inachtneming van hetgeen bij die wijziging, in het gewijzigde verdrag of in de gewijzigde Code is bepaald
      omtrent de bij herstellingen, verbouwingen en andere veranderingen in de toestand of uitrusting van een schip toe
      te passen voorschriften.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel71
  - number: '71.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de reeds voor de inwerkingtreding van dit besluit
      in werking getreden wijzigingen van de in het eerste lid bedoelde verdragen en Codes.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel71
  - number: '71.4'
    text: |-
      Een besluit van Onze Minister als bedoeld in het eerste of tweede lid wordt bekendgemaakt in de Staatscourant, de
      Landscourant van Aruba, de Curaçaose Courant en de Landscourant van Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel71
  - number: '72.1'
    text: |-
      [Artikel 4][ref1] is niet van toepassing op schepen, gebouwd voor 21 juli 1968, met een bruto-inhoud van minder dan
      150 bruto-registerton, vastgesteld overeenkomstig het op 10 juni 1947 te Oslo totstandgekomen Verdrag nopens een
      eenvormig stelsel voor de meting van zeeschepen (Stb. 1949, J 370; Trb. 1955, 52).


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel4
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '72.2'
    text: |-
      Voor schepen, gebouwd voor 18 juli 1982, waarvan de bruto-inhoud is vastgesteld overeenkomstig het in het eerste
      lid genoemde verdrag, wordt voor de toepassing van dit besluit de eenheid bruto-registerton gelijkgesteld met de
      eenheid GT.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel72
  - number: '72.3'
    text: |-
      Voor schepen als bedoeld in [artikel 6, eerste lid][ref1], waarvoor op grond van het [Schepenbesluit 1965][ref2]
      een certificaat van deugdelijkheid is afgegeven, gaat de in [artikel 6][ref3] bedoelde verplichting
      eerst gelden op het moment waarop het voor een schip afgegeven certificaat van deugdelijkheid ingevolge
      [artikel 7, eerste lid, van de Schepenwet][ref4] vervalt. Tot dat moment blijven op het schip de bij of krachtens
      het [Schepenbesluit 1965][ref5] gestelde regels betreffende onderzoeken en eisen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002501
      [ref3]: https://wetten.overheid.nl/BWBR0016880#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0001876#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002501
      - id: ref3
        bwb_id: BWBR0016880
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0001876
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0002501
  - number: '72.4'
    text: |-
      Op schepen, gebouwd voor de inwerkingtreding van dit besluit, zijn de op grond van dit besluit uit het SOLAS-
      verdrag voortvloeiende eisen, voorzover het schip daaraan niet reeds voldoet, slechts van toepassing, voorzover dat
      praktisch uitvoerbaar en redelijk is. De bij wijzigingen van het SOLAS-verdrag gebruikelijke overgangsbepalingen
      betreffende de toepassing van nieuwe of gewijzigde voorschriften op bestaande schepen zijn daarbij zoveel mogelijk
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel72
  - number: '73'
    text: |-
      Het [Schepenbesluit 1965][ref1] wordt ingetrokken op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan en voor verschillende categorieën van schepen verschillend kan worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0016880/2011-05-14#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '74.1'
    text: |-
      Dit besluit treedt ten aanzien van de in de [artikelen 9, eerste lid, aanhef en onderdeel b][ref1], [19][ref2],
      [38][ref3], [44][ref4], [50][ref5] en [63, tweede lid][ref6], bedoelde verplichtingen en de daarmee samenhangende
      bepalingen in werking met ingang van 1 juli 2004 of, indien de datum van uitgifte van het Staatsblad waarin het
      wordt geplaatst na 30 juni 2004 ligt, met ingang van de dag na uitgifte van dat Staatsblad.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0016880#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0016880#Artikel44
