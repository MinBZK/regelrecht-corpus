  - number: III
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0029818/2012-07-01#ArtikelIII
  - number: IV
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.

      2 Deze wet vervalt vijf jaar na het tijdstip van inwerkingtreding en de door deze wet in de [Mededingingswet][ref1]
      gewijzigde bepalingen komen alsdan te luiden zoals zij luidden voor het tijdstip van de inwerkingtreding van deze
      wet en met inachtneming van wijzigingen die na dat tijdstip in werking zijn getreden, tenzij voorafgaand aan het
      hiervoor bedoelde tijdstip van het vervallen van deze wet bij algemene maatregel van bestuur over de geldingsduur
      anders is bepaald.

      3 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0029818/2012-07-01#ArtikelIV
