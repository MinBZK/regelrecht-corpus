preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen omtrent economische
    activiteiten van publiekrechtelijke rechtspersonen en van overheidsbedrijven teneinde zoveel mogelijk gelijke
    concurrentieverhoudingen te scheppen tussen enerzijds deze organisaties en ondernemingen en anderzijds andere
    aanbieders van goederen of diensten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0029818/2012-07-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 Gedurende twee jaar vanaf het tijdstip van inwerkingtreding van deze wet is [artikel 25i][ref1] niet van
      toepassing op economische activiteiten die ook voor dat tijdstip werden verricht.

      2 Gedurende twee jaar na het tijdstip van inwerkingtreding van deze wet is [artikel 25j][ref2] niet van toepassing
      op bepalingen in overeenkomsten die zijn gesloten voor het genoemde tijdstip en die in strijd zijn met dat artikel.

      3 Gedurende twee jaar na het tijdstip van inwerkingtreding van deze wet is [artikel 25k][ref3] niet van toepassing
      op bepalingen in overeenkomsten die zijn gesloten voor het genoemde tijdstip en die in strijd zijn met dat artikel.

      4 Gedurende een jaar na het tijdstip van inwerkingtreding van deze wet is [artikel 25l][ref4] niet van toepassing
      op economische activiteiten die ook voor dat tijdstip werden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25i
