    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een onderzoeksorganisatie in een samenwerkingsverband voor het
      uitvoeren van een wind op zee jip.

      2 Een samenwerkingsverband bestaat uit ten minste drie ondernemingen en ten minste één onderzoeksorganisatie.

      3 De penvoerder van het samenwerkingsverband is een onderzoeksorganisatie in het samenwerkingsverband.

      4 De penvoerder geeft in de aanvraag aan binnen welke van de in [bijlage 3.7.1][ref1] genoemde innovatiethema’s de
      aanvraag valt.


