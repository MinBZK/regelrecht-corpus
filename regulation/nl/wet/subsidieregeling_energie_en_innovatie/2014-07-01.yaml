  - number: 2.4.21.7
    text: |-
      1 De minister kent aan een project een hoger aantal punten toe naarmate:

      a. het project meer bijdraagt aan de kwantitatieve reductie van de kostprijs van windenergie op zee in 2020;

      b. het project meer bijdraagt aan omzet en werkgelegenheid van de Nederlandse windenergie op zee sector in 2020;

      c. de kwaliteit van het project beter is, blijkend uit de samenstelling van het samenwerkingsverband, deelname van
      cruciale partijen uit de waardeketen of het MKB, het publicatieplan en de plannen voor intellectueel eigendom, de
      technische of wetenschappelijke onderzoeksmethode, het projectplan en de projectorganisatie;

      d. de projectopzet kosteneffectiever is en het aandeel van de financiering door ondernemingen in de totale
      projectfinanciering groter is.

      2 De minister kent per onderdeel van het eerste lid ten minste één en ten hoogste vijf punten toe.

      3 De minister kent per project 0,5 extra punten toe indien het valt in de programmalijnen 1
      (Ondersteuningsconstructies) of 5 (Beheer en onderhoud) en één extra punt indien het valt in programmalijn 4
      (Transport, installatie en logistiek).

      4 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.21.7
  - number: 2.4.22.1
    text: |-
      In deze subparagraaf wordt verstaan onder EnerGO CCO-project: project bestaande uit fundamenteel onderzoek,
      industrieel onderzoek, experimentele ontwikkeling, een demonstratieproject, of een combinatie van deze vormen,
      dat past binnen de in [bijlage 2.4.22][ref1] (Programmalijnen EnerGO: compacte conversie en opslag) opgenomen
      programmalijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0026952
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.22.1
    references:
      - id: ref1
        bwb_id: BWBR0026952
  - number: 2.4.22.2
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een deelnemer in een samenwerkingsverband voor het uitvoeren
      van een EnerGO CCO-project.

      2 Een samenwerkingsverband voor een EnerGO CCO-project bestaat uit ten minste één onderneming en ten minste één
      onderzoeksorganisatie.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.22.2
  - number: 2.4.22.3
    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie voor een EnerGO CCO-project ten
      hoogste:

      a. 100% van de subsidiabele kosten voor zover deze betrekking hebben op fundamenteel onderzoek;

      b. 60% van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek;

      c. 40% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling;

      d. 100% van de subsidiabele kosten voor zover deze betrekking hebben op niet-economische activiteiten van
      onderzoeksorganisaties;

      e. voor een demonstratieproject:

        - 30% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat energiebesparende
      maatregelen betreft;
        - 45% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat maatregelen betreft die
      het gebruik van hernieuwbare energiebronnen bevorderen en waarbij de subsidiabele kosten worden berekend in
      overeenstemming met artikel 41, zesde lid, onderdeel a of b, van de algemene groepsvrijstellingsverordening;
        - 30% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat maatregelen betreft die
      het gebruik van hernieuwbare energiebronnen bevorderen en waarbij de subsidiabele kosten worden berekend in
      overeenstemming met artikel 41, zesde lid, onderdeel c, van de algemene groepsvrijstellingsverordening.

      2 De in het eerste lid, onderdelen b, c en e, genoemde percentages worden met 10 procentpunten verhoogd, indien de
      aanvrager een MKB-onderneming is en de subsidiabele kosten worden gemaakt en betaald door de MKB-onderneming.

      3 De subsidiabele kosten van een demonstratieproject worden berekend in overeenstemming met
      de artikelen 38 en 41 van de algemene groepsvrijstellingsverordening en met inachtneming van
      [artikel 14a, tweede lid, van het Kaderbesluit EZ-subsidies][ref2].

      4 De onderzoeksorganisatie of onderzoeksorganisaties draagt respectievelijk dragen bij fundamenteel onderzoek,
      industrieel onderzoek en experimentele ontwikkeling gezamenlijk minstens 10% van de subsidiabele projectkosten en
      heeft respectievelijk hebben het recht de resultaten van het project te publiceren voor zover deze afkomstig zijn
      van het door die organisatie respectievelijk organisaties uitgevoerde onderzoek.

      5 De subsidie bedraagt maximaal € 3.100.000 per EnerGO CCO-project.


      [ref1]: https://wetten.overheid.nl/BWBR0026689
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel14a
