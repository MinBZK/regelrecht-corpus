    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. na toepassing van [artikel 2.4.2.7, eerste lid][ref1], minder dan 12 punten zijn toegekend;

      b. niet ten minste 40% van de subsidiabele projectkosten worden gefinancierd door ondernemingen;

      c. eerder op grond van deze paragraaf een subsidie is verstrekt voor een soortgelijk project;

      d. de aanvrager niet aannemelijk heeft gemaakt dat het BBE KEW-project leidt tot duurzame energie
      productie in 2023 en leidt tot een besparing op de uitgaven aan subsidies in het kader van het
      [Besluit stimulering duurzame energieproductie][ref2], die groter is dan de aangevraagde subsidie onder deze
