        bwb_id: BWBR0024796
        artikel: '23'
  - number: 2.4.22.6
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. na toepassing van [artikel 2.4.22.7, eerste lid][ref1], op de onderdelen a tot en met d, minder dan drie punten
      per criterium zijn toegekend;

      b. niet ten minste 40% van de subsidiabele projectkosten wordt gefinancierd door ondernemingen;

      c. eerder op grond van deze regeling een subsidie is verstrekt voor een soortgelijk project;

      d. na toepassing van [artikel 2.4.22.7, eerste lid][ref2], een project lager is gerangschikt dan een soortgelijk
      project.


      [ref1]: https://wetten.overheid.nl/BWBR0026952#Artikel2.4.22.7
