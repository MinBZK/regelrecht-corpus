    text: |-
      1 De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate:

      a. het project technologisch innovatiever is ten opzichte van de huidige praktijk in Nederland;

      b. het project meer bijdraagt aan de verduurzaming van de energiehuishouding in absolute en relatieve CO reductie
      of PJ per jaar op projectniveau;

      c. het project meer herhalingspotentieel bezit, gebaseerd op kostprijsontwikkeling en marktverwachting;

      d. het samenwerkingsverband van een betere kwaliteit is, de slaagkans van het project groter is en de
      kennisoverdracht een structureler onderdeel is van de demonstratie.

      2 Voor de rangschikking weegt het criterium, genoemd in het eerste lid, onderdeel a, eenmaal, en het gewogen
      gemiddelde van de criteria, genoemd in het eerste lid, onderdeel b tot en met d, twee maal.
