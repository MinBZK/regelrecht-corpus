  - number: 2.4.18.6
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. na toepassing van [artikel 2.4.18.7, eerste lid][ref1], minder dan drie punten per criterium, zijn toegekend;

      b. eerder op grond van deze regeling een subsidie is verstrekt voor een soortgelijk project;

      c. het project lager is gerangschikt dan een soortgelijk project;

      d. bij een DEI-project dat bestaat uit een combinatie van industrieel onderzoek, experimentele ontwikkeling en een
      demonstratieproject, niet ten minste 70% van de subsidiabele kosten is toe te rekenen aan het demonstratieproject.


      [ref1]: https://wetten.overheid.nl/BWBR0026952#Artikel2.4.18.7
