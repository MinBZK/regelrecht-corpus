  - number: 3.4.4
    text: |-
      1 De subsidie bedraagt maximaal € 7.225.000 per aardwarmteproject.

      2 De subsidie bedraagt maximaal € 12.750.000 per diep aardwarmteproject.

      3 Het subsidiebedrag wordt zodanig verminderd, dat de som van de volgende bedragen niet meer dan 95 procent van de
      gerealiseerde subsidiabele kosten bedraagt:

        - het subsidiebedrag,
        - het bedrag aan overige voor het betreffende project aan de subsidie-ontvanger verleende dan wel vastgestelde
      subsidies, en
        - het bedrag waarop de subsidie-ontvanger voor het desbetreffende project op grond van een verzekering of
      garantstelling aanspraak kan doen.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.4.4
  - number: 3.4.5
    text: |-
      1 De [artikelen 10 tot en met 14a van het Kaderbesluit EZ-subsidies][ref1] zijn niet van toepassing.

      2 Bij een doublet komen de volgende kosten voor subsidie in aanmerking:

      a. kosten boring productie- en injectieput;

      b. premie die door de subsidie-ontvanger krachtens [artikel 3.4.10][ref2] wordt betaald;

      c. kosten op- en afbouwen boorinstallatie;

      d. kosten boormanagement en -toezicht;

      e. kosten locatie boorgereed maken;

      f. cuttings/spoeling afvoeren;

      g. kosten puttest en rapportage;

      h. kosten voor de acquisitie van data ten behoeve van de geologische evaluatie van het boorgat;

      i. additionele kosten voor de realisatie van alternatief gebruik voor ten hoogste 15 jaar;

      j. additionele kosten voor de verbeterwerkzaamheden voor ten hoogste 15 jaar;

      k. kosten onvoorzien.

      3 Bij een half-doublet komen de volgende kosten voor de subsidie in aanmerking:

      a. kosten boring eerste put;

      b. premie die door de subsidie-ontvanger krachtens [artikel 3.4.10][ref3] wordt betaald;

      c. kosten opbouwen boorinstallatie;

      d. kosten boormanangement en -toezicht tot en met de realisatie van de eerste boring met inbegrip van de puttest
      van de eerste boring;

      e. kosten locatie bouwgereed maken;

      f. cuttings/spoeling afvoeren voor eerste boring;

      g. kosten puttest eerste boring en rapportage;

      h. kosten voor de acquisitie van data ten behoeve van de geologische evaluatie van het boorgat van de eerste put;

      i. de additionele kosten voor de realisatie van alternatief gebruik voor de eerste put;

      j. de additionele kosten voor de verbeterwerkzaamheden voor de eerste put;

      k. onvoorziene kosten tot en met de realisatie van de eerste boring met inbegrip van de puttest van de eerste
      boring.

      4 Indien subsidie wordt verstrekt voor een doublet komt voor subsidie in aanmerking een vast bedrag van € 500.000
      voor het plaatsen van een pompinstallatie of het dichten van de put of putten.

      5 Indien subsidie wordt verstrekt voor een half-doublet komt voor subsidie in aanmerking een vast bedrag van
      € 250.000 voor het plaatsen van een pompinstallatie voor de gegarandeerde put of het dichten van deze put.

      6 Bij de toepassing van [artikel 6, eerste lid, van het Kaderbesluit EZ-subsidies][ref4] blijven buiten
      beschouwing:

      a. de subsidies op grond van:

      1°. hoofdstuk 2 van [bijlage 2 Marktintroductie energie-innovaties van de Regeling LNV-subsidies][ref5],

      2°. de [Unieke kansen regeling][ref6],

      3°. de Subsidieregeling internationaal innoveren,

      4°. [hoofdstuk 3 van de Tijdelijke energieregeling markt en innovatie][ref7],

      5°. het [Besluit stimulering duurzame energieproductie][ref8]; en

      b. bijdragen van de Europese Commissie op grond van:

      1°. het Zevende Kaderprogramma voor activiteiten op het gebied van onderzoek, technologische ontwikkeling en
      demonstratie,

      2°. het Kaderprogramma voor concurrentievermogen en innovatie,

      3°. het meerjarenprogramma voor acties op energiegebied: ‘Intelligente energie- Europa’,

      4°. het financieringsinstrument voor het Milieu: ‘Life’,

      5°. Richtlijn 2003/87/EG van het Europees Parlement en de Raad van de Europese Unie van 13 oktober 2003 tot
      vaststelling van een regeling voor de handel in broeikasemmissierechten binnen de Gemeenschap en tot wijziging van
      Richtlijn 96/61/EG van de Raad (Pb EG 2003/L275),

      6°. Verordening (EG) nr. 1234/2007 van de Raad van 22 oktober 2007 houdende een gemeenschappelijke ordening van de
      landbouwmarkten en specifieke bepalingen voor een aantal landbouwproducten (Integrale-GMO-verordening),

      7°. Het Europees Fonds voor Regionale Ontwikkeling,

      8°. INTERREG, en

      9°. de Europese Structuur- en Cohesiefondsen.

      7 Bijdragen van gemeenten en provincies worden aangemerkt als publieke cofinanciering, en blijven bij de toepassing
      van [artikel 6, eerste lid, van het Kaderbesluit EZ-subsidies][ref9] buiten beschouwing.


