  - number: 2.4.5.2
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een deelnemer in een samenwerkingsverband voor het uitvoeren
      van een GG-project.

      2 Een samenwerkingsverband bestaat ten minste uit twee ondernemingen.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.5.2
  - number: 2.4.5.3
    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie voor een GG-project ten hoogste:

      a. 50% van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek;

      b. 25% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling;

      c. voor een demonstratieproject:

        - 40% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat energiebesparende
      maatregelen betreft en waarbij de exploitatiebaten en exploitatiekosten verrekend worden;
        - 20% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat energiebesparende
      maatregelen betreft en waarbij de exploitatiebaten en exploitatiekosten niet verrekend worden;
        - 40% van de subsidiabele kosten voor zover deze betrekking hebben op een project dat maatregelen betreft die het
      gebruik van hernieuwbare energiebronnen bevorderen.

      2 De subsidiabele kosten van een demonstratieproject worden berekend in overeenstemming
      met artikel 21 en 23 van de algemene groepsvrijstellingsverordening en met inachtneming van
      [artikel 14a, tweede lid, van het Kaderbesluit EZ-subsidies][ref2].

      3 De in het eerste lid bedoelde percentages worden met 10 procentpunten verhoogd, voor zover de aanvrager een MKB-
      ondernemer is en de subsidiabele kosten worden gemaakt en betaald door de MKB-ondernemer.

      4 Onverminderd het derde lid, wordt het in het eerste lid, onderdeel b, bedoelde percentage voor ondernemingen met
      5 procentpunten verhoogd indien:

      a. geen van de ondernemingen meer dan 70% van de subsidiabele kosten voor haar rekening moet nemen en tenminste één
      deelnemer in het samenwerkingsverband een MKB-ondernemer is of ten minste één deelnemer in het samenwerkingsverband
      in een andere lidstaat van de Europese Unie dan Nederland is gevestigd en niet behoort tot een groep van een in
      Nederland gevestigde deelnemer, of

      b. het project samenwerking met een onderzoeksorganisatie betreft, de onderzoeksorganisatie minstens 10% van de
      subsidiabele projectkosten draagt en de onderzoeksorganisatie het recht heeft de resultaten van het project te
      publiceren voor zover deze afkomstig zijn van het door die organisatie uitgevoerde onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0026689
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel14a
