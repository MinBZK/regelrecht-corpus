  - number: 2.2.9
    text: |-
      De minister beslist afwijzend op een aanvraag indien van het project onvoldoende positieve gevolgen voor de
      Nederlandse economie te verwachten zijn.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.2.9
  - number: 2.2.10
    text: |-
      1 De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate het project meer bijdraagt
      aan de criteria omtrent:

      a. technologische innovatie

      b. duurzaamheid

      c. technologische samenwerking

      d. economisch perspectief

      2 Als criteria voor technologische innovatie, duurzaamheid, technologische samenwerking en economisch perspectief
      worden respectievelijk vastgesteld:

      a. de mate waarin wordt bijgedragen aan technologische vernieuwing of aan wezenlijk nieuwe toepassingen van een
      bestaande technologie;

      b. de mate waarin wordt bijgedragen aan verduurzaming van de energiehuishouding in Nederland;

      c. de mate van doelmatigheid en doeltreffendheid van het samenwerkingsverband en de betrokkenheid van
      kennisinstellingen, en

      d. de mate waarin de projectresultaten meer economische waarde creëren in Nederland, wordt aangesloten aan
      de doelstellingen van de deelnemende ondernemingen en de toepassingsmogelijkheden van de projectresultaten
      uitgebreider zijn.

      3 Voor de rangschikking wegen alle in het eerste en tweede lid genoemde criteria gelijk.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.2.10
  - number: 2.2.11
    text: |-
      1 De subsidie-ontvanger draagt zorg voor de openbaarmaking en verspreiding van de resultaten van het project.

      2 De verplichting, bedoeld in het eerste lid, geldt tot vijf jaar na de datum van de beschikking tot
      subsidievaststelling.
