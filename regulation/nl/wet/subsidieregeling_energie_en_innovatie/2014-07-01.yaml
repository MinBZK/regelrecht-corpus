        artikel: '6'
  - number: 2.4.1.1
    text: |-
      In deze subparagraaf wordt verstaan onder:

        - *BBE Innovatieproject:* een project bestaande uit industrieel onderzoek of experimentele ontwikkeling of een
      combinatie van deze vormen, dat past binnen de in [bijlage 2.4.3][ref1] (Programmalijnen BBE Innovatieprojecten)
      opgenomen programmalijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0026952
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.1.1
    references:
      - id: ref1
        bwb_id: BWBR0026952
  - number: 2.4.1.2
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een deelnemer in een samenwerkingsverband voor het uitvoeren
      van een BBE Innovatieproject.

      2 Een samenwerkingsverband bestaat ten minste uit twee ondernemingen.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.1.2
  - number: 2.4.1.3
    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie voor een BBE Innovatieproject ten
      hoogste:

      a. 50% van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek;

      b. 25% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling.

      2 De in het eerste lid genoemde percentages worden met 10 procentpunten verhoogd, voor zover de aanvrager een MKB-
      ondernemer is en de subsidiabele kosten worden gemaakt en betaald door de MKB-ondernemer.

      3 Onverminderd het tweede lid, wordt het in het eerste lid, onderdeel b, bedoelde percentage voor ondernemingen met
      5 procentpunten verhoogd indien:

      a. geen van de ondernemingen meer dan 70% van de subsidiabele kosten voor rekening moet nemen en tenminste één
      deelnemer in het samenwerkingsverband een MKB-ondernemer is of ten minste één deelnemer in het samenwerkingsverband
      in een andere lidstaat van de Europese Unie dan Nederland is gevestigd en niet behoort tot een groep van een in
      Nederland gevestigde deelnemer, of

      b. het project samenwerking met een onderzoeksorganisatie betreft, de onderzoeksorganisatie minstens 10% van de
      subsidiabele projectkosten draagt en de onderzoeksorganisatie het recht heeft de resultaten van het project te
      publiceren voor zover deze afkomstig zijn van het door die organisatie uitgevoerde onderzoek.

      4 De subsidie bedraagt maximaal € 500.000 per BBE Innovatieproject.


      [ref1]: https://wetten.overheid.nl/BWBR0026689
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.1.3
    references:
      - id: ref1
        bwb_id: BWBR0026689
  - number: 2.4.1.4
    text: De minister verdeelt het subsidieplafond op volgorde van de rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.1.4
  - number: 2.4.1.5
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel c, van het Kaderbesluit EZ-subsidies][ref1], is vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.1.5
    references:
