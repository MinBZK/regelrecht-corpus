  - number: 3.6.9
    text: |-
      1 De subsidieontvanger voltooit de voorbereidingsstudie binnen zes maanden na datum van de beschikking tot
      subsidieverlening.

      2 De subsidieontvanger start het demonstratieproject vergassing binnen zes maanden na de datum van de beschikking
      tot subsidieverlening en voltooit het uiterlijk binnen 4 jaar na de start van het project.

      3 De subsidieontvanger voert het demonstratieproject vergassing in Nederland uit.

      4 De subsidieontvanger verleent medewerking aan evaluatie van de effecten van het door hem uitgevoerde
      demonstratieproject vergassing, voor zover deze medewerking redelijkerwijs van hem verlangd kan worden.

      5 De verplichting, bedoeld in het vierde lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.

      6 Op een subsidie voor een demonstratieproject vergassing is [artikel 41 van het Kaderbesluit EZ-subsidies][ref1]
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel41
