    text: |-
      1 De subsidie voor een binnen de Europese Unie gevestigde subsidie-ontvanger, niet zijnde een primaire
      landbouwproducent, valt onder de Tijdelijke communautaire kaderregeling inzake staatssteun ter stimulering van de
      toegang tot financiering in de huidige financiële en economische crisis van 17 december 2008. Het bedrag van de
      subsidie wordt verlaagd voor zover dit nodig is op basis van deze kaderregeling.

