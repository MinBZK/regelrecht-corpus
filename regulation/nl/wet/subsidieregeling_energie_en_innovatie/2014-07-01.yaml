  - number: 3.7.1
    text: |-
      In deze paragraaf wordt verstaan onder wind op zee-project: project bestaande uit fundamenteel onderzoek,
      industrieel onderzoek, experimentele ontwikkeling, een demonstratieproject of een combinatie van deze vormen, dat
      past binnen [bijlage 3.7.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026952
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.7.1
    references:
      - id: ref1
        bwb_id: BWBR0026952
  - number: 3.7.2
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een deelnemer in een samenwerkingsverband voor het uitvoeren
      van een wind op zee project.

      2 Een samenwerkingsverband voert een project uit voor gezamenlijke rekening en risico.

      3 Een samenwerkingsverband bestaat ten minste uit een onderneming en een kennisinstelling.

      4 De subsidieontvanger voert het wind op zee project hoofdzakelijk in Nederland uit, behoudens voorafgaande
      schriftelijke ontheffing van de minister voor gedeeltelijke uitvoering buiten Nederland.

      5 Binnen een ‘wind op zee-project’ kan ten hoogste 20% van de subsidiabele kosten besteed worden aan met het
      project samenhangend fundamenteel onderzoek.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.7.2
  - number: 3.7.3
    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie voor een demonstratieproject wind op
      zee 40 procent van de subsidiabele kosten, voor zover die kosten betrekking hebben op activiteiten, niet zijnde
      fundamenteel onderzoek, industrieel onderzoek of experimentele ontwikkeling.

      2 De subsidie bedraagt voor een wind op zee project:

      a. in afwijking van de [Regeling steunintensiteit][ref2] ten hoogste 100 procent van de subsidiabele kosten voor
      zover deze betrekking hebben op fundamenteel onderzoek;

      b. 50 procent van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek;

      c. 25 procent van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling.

      3 Indien de subsidiabele kosten betrekking hebben op een combinatie van fundamenteel onderzoek, industrieel
      onderzoek en experimentele ontwikkeling, bedraagt de subsidie het gewogen gemiddelde van de in het tweede lid
      genoemde percentages van de desbetreffende subsidiabele kosten.

      4 De in het eerste en tweede lid genoemde percentages worden, met uitzondering van het percentage genoemd in
      het tweede lid, onder a, met 10 procentpunten verhoogd, voor zover de aanvrager een MKB-ondernemer is en de
      subsidiabele kosten worden gemaakt en betaald door de MKB-ondernemer.

      5 De subsidiabele kosten van een demonstratieproject worden berekend in overeenstemming
      met artikel 23 van de algemene groepsvrijstellingsverordening en met inachtneming van
      [artikel 14a, tweede lid, van het Kaderbesluit EZ-subsidies][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026689
      [ref2]: https://wetten.overheid.nl/BWBR0026689
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel14a
