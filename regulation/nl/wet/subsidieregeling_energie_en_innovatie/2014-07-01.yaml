  - number: 3.11.2
    text: |-
      De minister verstrekt op aanvraag subsidie aan een natuurlijk persoon, niet zijnde een ondernemer, voor de koop
      van zonnepanelen met een vermogen groter dan 0,6 kWp die in Nederland op een onroerende zaak of een woonboot worden
      geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.11.2
  - number: 3.11.3
    text: |-
      1 De subsidie voor de koop van zonnepanelen met een vermogen tot en met 3,5 kWp bedraagt 15% van de subsidiabele
      kosten, maar niet meer dan € 650.

      2 De subsidie voor de koop van zonnepanelen met een vermogen groter dan 3,5 kWp bedraagt 15% van de subsidiabele
      kosten gedeeld door het vermogen van de zonnepanelen in kWp vermenigvuldigd met 3,5, maar niet meer dan € 650.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.11.3
  - number: 3.11.4
    text: |-
      In afwijking van de [artikelen 10, eerste en tweede lid][ref1], en
      [11 tot en met 14a van het Kaderbesluit EZ-subsidies][ref2] komen:

      a. de rechtstreeks aan de koop van niet eerder gebruikte zonnepanelen inclusief niet eerder gebruikte toebehoren
      toe te rekenen betaalde of te betalen kosten van derden in aanmerking voor subsidie;

      b. vóór indiening van de aanvraag door de subsidieontvanger gemaakte kosten in aanmerking voor subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel11
