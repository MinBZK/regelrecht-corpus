  - number: 2.4.22.5
    text: |-
      De termijn, bedoeld in [artikel 23, eerste lid, onderdeel c, van het Kaderbesluit EZ-subsidies][ref1], is vier
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.22.5
    references:
