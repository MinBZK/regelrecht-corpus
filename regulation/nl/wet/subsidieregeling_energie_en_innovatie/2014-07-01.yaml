    text: |-
      In deze subparagraaf wordt verstaan onder systeemintegratieproject: project bestaande uit fundamenteel onderzoek,
      industrieel onderzoek, experimentele ontwikkeling, een demonstratieproject of een combinatie van deze vormen, dat
      past binnen de in [bijlage 2.4.20][ref1] (Programmalijnen Systeemintegratie) opgenomen programmalijnen.


