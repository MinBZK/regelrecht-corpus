  - number: 2.4.13.3
    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie voor een EnerGO-project ten hoogste:

      a. 100% van de subsidiabele kosten voor zover deze betrekking hebben op fundamenteel onderzoek;

      b. 60% van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek;

      c. 40% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling.

      d. voor een demonstratieproject:

        - 40% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat energiebesparende
      maatregelen betreft en waarbij de exploitatiebaten en exploitatiekosten verrekend worden;
        - 20% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat energiebesparende
      maatregelen betreft en waarbij de exploitatiebaten en exploitatiekosten niet verrekend worden;
        - 40% van de subsidiabele kosten voor zover deze betrekking hebben op een project dat maatregelen betreft die het
      gebruik van hernieuwbare energiebronnen bevorderen.

      2 De subsidiabele kosten van een demonstratieproject worden berekend in overeenstemming
      met artikel 21 en 23 van de algemene groepsvrijstellingsverordening en met inachtneming van
      [artikel 14a, tweede lid, van het Kaderbesluit EZ-subsidies][ref2].

      3 De onderzoeksorganisatie of onderzoeksorganisaties draagt respectievelijk dragen bij fundamenteel onderzoek,
      industrieel onderzoek en experimentele ontwikkeling gezamenlijk minstens 10% van de subsidiabele projectkosten en
      heeft respectievelijk hebben het recht de resultaten van het project te publiceren voor zover deze afkomstig zijn
      van het door die organisatie respectievelijk organisaties uitgevoerde onderzoek.

      4 De subsidie bedraagt maximaal € 1.000.000 per EnerGO-project.


      [ref1]: https://wetten.overheid.nl/BWBR0026690
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel14a
