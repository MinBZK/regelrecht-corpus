    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. per criterium, bedoeld in [artikel 3.7.10][ref1] niet minimaal 2,5 van de maximaal 5 punten zijn verkregen;

      b. in totaal voor de gezamenlijke criteria, bedoeld in [artikel 3.7.10][ref2] niet 12 punten of meer verkregen
      zijn;

      c. eerder op grond van deze paragraaf een subsidie is verstrekt voor een soortgelijk project;

      d. de aanvrager niet aannemelijk heeft gemaakt dat het wind op zee-project leidt tot duurzame energieproductie
      in 2023 en leidt tot een besparing op de uitgaven aan subsidies in het kader van het Besluit stimulering duurzame
      energieproductie, die groter is dan de aangevraagde subsidie onder deze paragraaf.


