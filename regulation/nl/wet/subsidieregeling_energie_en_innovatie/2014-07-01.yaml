  - number: 3.5.2
    text: |-
      1 De Minister van LNV verstrekt op aanvraag een subsidie aan:

      a. een ondernemer voor een demonstratieproject bioraffinage dat past in een of meerdere bioraffinage thema's
      waarin:

      1°. nieuwe kennis of technologie wordt ontwikkeld en/of toegepast, of

      2°. nieuwe combinaties van bestaande kennis en technologieën worden toegepast;

      b. een ondernemer voor een pilotproject bioraffinage dat past in een of meerdere bioraffinage thema's waarin:

      1°. nieuwe kennis of technologie wordt ontwikkeld en/of toegepast, of

      2°. nieuwe combinaties van bestaande kennis en technologieën worden toegepast;

      c. een deelnemer in een samenwerkingsverband die een in sub a of b genoemd project bioraffinage uitvoert.

      2 Bioraffinage thema's als bedoeld in het eerste lid zijn:

      a. bioraffinage van Nederlandse gewassen;

      b. bioraffinage van geïmporteerde biomassa rond Nederlandse havens;

      c. bioraffinage van afval- en reststromen;

      d. bioraffinage van aquatische biomassa.

      3 Geen subsidie wordt verstrekt aan:

      a. projecten die betrekking hebben op de productie van biomassa en teelt van aquatische biomassa;

      b. projecten die uitsluitend betrekking hebben op de productie van biobrandstoffen of energie;

      c. projecten die betrekking hebben op ontwikkeling en demonstratie van zogenaamde eerste generatie
      biobrandstoftechnologie.

      4 De productie van biobrandstoffen kan slechts onderdeel uitmaken van een demonstratieproject bioraffinage of een
      pilotproject bioraffinage, indien:

      a. het project betrekking heeft op de geïntegreerde co-productie van biobrandstoffen met andere vermarktbare
      producten, zoals voedsel, veevoer, chemicaliën en energie;

      b. het biobrandstoffendeel betrekking heeft op de productie van geavanceerde biobrandstoffen.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.5.2
  - number: 3.5.3
    text: |-
      1 Een samenwerkingsverband dat een demonstratieproject bioraffinage uitvoert, bestaat alleen uit ondernemers.

      2 Een samenwerkingsverband dat een pilotproject bioraffinage uitvoert, bestaat uit ten minste een ondernemer.

      3 De penvoerder in een samenwerkingsverband dat een pilotproject bioraffinage uitvoert is een ondernemer.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.5.3
  - number: 3.5.4
    text: |-
      1 De subsidie voor een pilotproject bioraffinage bedraagt niet meer dan € 1.000.000. Indien verscheidene
      aanvragen worden gedaan die betrekking hebben op hetzelfde project en die tezamen een subsidiebedrag van meer dan
      € 1.000.000 betreffen, of indien het totale subsidiebedrag voor de deelnemers van een samenwerkingsverband meer
      bedraagt dan € 1.000.000, wordt het meerdere naar rato in mindering gebracht op de aan de betrokken aanvragers te
      verstrekken subsidie.

      2 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie voor een demonstratieproject
      bioraffinage 35 procent van de subsidiabele kosten gemaakt door de ondernemer, maar niet meer dan € 4.000.000.
      Indien verscheidene aanvragen worden gedaan die betrekking hebben op hetzelfde project en die tezamen een
      subsidiebedrag van meer dan € 4.000.000 betreffen, of indien het totale subsidiebedrag voor de deelnemers van een
      samenwerkingsverband meer bedraagt dan € 4.000.000, wordt het meerdere naar rato in mindering gebracht op de aan de
      betrokken aanvragers te verstrekken subsidie.

      3 Het in het tweede lid genoemde percentage wordt met 10 procentpunten verhoogd voor iedere aanvrager die een
      middelgrote onderneming in stand houdt voor zover de subsidiabele kosten worden gemaakt en betaald door die
      ondernemer.

      4 Het in het tweede lid genoemde percentage wordt met 20 procentpunten verhoogd voor iedere aanvrager die een
      kleine onderneming in stand houdt voor zover de subsidiabele kosten worden gemaakt en betaald door die ondernemer.

      5 Voor de berekening van de in het tweede lid genoemde subsidiabele kosten is
      [artikel 14a van het Kaderbesluit EZ-subsidies][ref2] van toepassing met dien verstande dat in de
      [onderdelen c en d van het eerste lid van artikel 1.4][ref3] de woorden ‘duurzame energiehuishouding’ worden
      gelezen als: toename van het niveau van milieubescherming.

      6 Op een subsidie voor een demonstratieproject bioraffinage is
      [artikel 10, derde lid, van het Kaderbesluit EZ-subsidies][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0026689
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel14a
      [ref3]: https://wetten.overheid.nl/BWBR0026952#Artikel1.4
      [ref4]: https://wetten.overheid.nl/BWBR0024796#Artikel10
