        bwb_id: BWBR0024796
        artikel: '23'
  - number: 2.4.1.6
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. na toepassing van [artikel 2.4.1.7, eerste lid][ref1], minder dan 12 punten zijn toegekend;

      b. niet ten minste 40% van de subsidiabele projectkosten wordt gefinancierd door ondernemingen;

      c. eerder op grond van deze paragraaf een subsidie is verstrekt voor een soortgelijk project.


      [ref1]: https://wetten.overheid.nl/BWBR0026952#Artikel2.4.1.7
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.1.6
    references:
      - id: ref1
        bwb_id: BWBR0026952
        artikel: 2.4.1.7
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.4.1.7
    text: |-
      1 De minister kent aan een project een hoger aantal punten toe naarmate:

      a. het project meer bijdraagt aan verduurzaming van de Nederlandse energiehuishouding en maatschappelijk relevanter
      is, binnen de context van het innovatiecontract van de topsector energie (Kamerstukken II 2011/12, 32 637, nr. 32);

      b. de mogelijke bijdrage van het project aan de Nederlandse economie groter is;

      c. het project vernieuwender is ten opzichte van de internationale stand van onderzoek of techniek en de
      Nederlandse kennispositie meer versterkt;

      d. de kwaliteit van het project beter is, blijkend uit de uitwerking van aanpak en methodiek, de omgang met
      risico’s, de uitvoerbaarheid en de deelnemende partijen.

      2 De minister kent per onderdeel van het eerste lid ten minste één en ten hoogste vijf punten toe.

      3 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.

      4 Geen subsidie wordt verleend voor een project dat lager is gerangschikt dan een soortgelijk project.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.1.7
  - number: 2.4.2.1
    text: |-
      In deze subparagraaf wordt verstaan onder:

        - *BBE KEW-project:* een project bestaande uit industrieel onderzoek of experimentele ontwikkeling of zijnde
      een demonstratieproject of een combinatie van deze vormen, dat past binnen de in [bijlage 2.4.4][ref1] (BBE KEW
      projecten) opgenomen programmalijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0026952
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0026952
  - number: 2.4.2.2
    text: |-
      a. De minister verstrekt op aanvraag een subsidie aan een deelnemer in een samenwerkingsverband voor het uitvoeren
      van een BBE KEW-project.

      b. Een samenwerkingsverband bestaat ten minste uit twee ondernemingen.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.2.2
  - number: 2.4.2.3
    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie voor een BBE-KEW-project ten hoogste:

      a. 50% van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek;

      b. 25% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling;

      c. voor een demonstratieproject:

        - 40% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat energiebesparende
      maatregelen betreft en waarbij de exploitatiebaten en exploitatiekosten verrekend worden;
        - 20% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat energiebesparende
      maatregelen betreft en waarbij de exploitatiebaten en exploitatiekosten niet verrekend worden;
        - 40% van de subsidiabele kosten voor zover deze betrekking hebben op een project dat maatregelen betreft die het
      gebruik van hernieuwbare energiebronnen bevorderen.

      2 De subsidiabele kosten van een demonstratieproject worden berekend in overeenstemming
      met artikel 21 en 23 van de algemene groepsvrijstellingsverordening en met inachtneming van
      [artikel 14a, tweede lid, van het Kaderbesluit EZ-subsidies][ref2].

      3 De in het eerste lid genoemde percentages worden met 10 procentpunten verhoogd, voor zover de aanvrager een MKB-
      ondernemer is en de subsidiabele kosten worden gemaakt en betaald door de MKB-ondernemer.

      4 Onverminderd het derde lid, wordt het in het eerste lid, onderdeel b, bedoelde percentage voor ondernemingen met
      5 procentpunten verhoogd indien:

      a. geen van de ondernemingen meer dan 70% van de subsidiabele kosten voor haar rekening moet nemen en tenminste één
      deelnemer in het samenwerkingsverband een MKB-ondernemer is of ten minste één deelnemer in het samenwerkingsverband
      in een andere lidstaat van de Europese Unie dan Nederland is gevestigd en niet behoort tot een groep van een in
      Nederland gevestigde deelnemer, of

      b. het project samenwerking met een onderzoeksorganisatie betreft, de onderzoeksorganisatie minstens 10% van de
      subsidiabele projectkosten draagt en de onderzoeksorganisatie het recht heeft de resultaten van het project te
      publiceren voor zover deze afkomstig zijn van het door die organisatie uitgevoerde onderzoek.

      5 De subsidie bedraagt maximaal € 1.000.000 per BBE-KEW-project.


      [ref1]: https://wetten.overheid.nl/BWBR0026689
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel14a
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.2.3
    references:
