  - number: 3.9.1
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *demonstratieproject vergistingketen:* een demonstratieproject waarbij een techniek uit de vergistingketen wordt
      gedemonstreerd en doorontwikkeld tot continue bedrijfsvoering of waarin innovatieve organisatie of samenwerking in
      de vergistingketen wordt gedemonstreerd en dat leidt tot een substantiële kostenreductie in en verbetering van de
      rentabiliteit van de vergistingketen, of het wegnemen van technische belemmeringen voor invoeding van hernieuwbaar
      gas in een gasnet en voor levering aan een vulstation;
        - *gas:* gas als bedoeld in [artikel 1, eerste lid, onderdeel b, van de Gaswet][ref1];
        - *hernieuwbaar gas:* gas opgewekt in een productie-installatie door de vergisting van biomassa onder anaerobe
      omstandigheden, waarvan methaan en kooldioxide de hoofdbestanddelen zijn;
        - *output:* de hoofdproducten hernieuwbaar gas en de bijproducten digestaat, kooldioxide en warmte;
        - *pilotproject vergistingketen:* het verwerven, combineren, vormgeven of gebruiken van bestaande of niet bestaande
      kennis en vaardigheden binnen de vergistingketen ten behoeve van het ontwikkelen en bouwen van een prototype en het
      experimenteren hiermee en dat leidt tot een substantiële kostenreductie in en verbetering van de rentabiliteit van
      de vergistingketen, of het wegnemen van technische belemmeringen voor invoeding van hernieuwbaar gas in een gasnet
      en voor levering aan een vulstation;
        - *sociale innovatie:* innovatief samenwerken of organiseren binnen een pilotproject vergistingketen of een
      demonstratieproject vergistingketen;
        - *vergistingketen:* de keten van inzameling van vergistbare biomassa, voorbehandeling, vergisting, gasreiniging,
      opwaardering van hernieuwbaar gas en verwaarding van de output inclusief invoeding van hernieuwbaar gas in het
      aardgasnet of levering aan vulstations.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.9.1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '1'
  - number: 3.9.2
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een deelnemer in een samenwerkingsverband of een ondernemer
      die een pilotproject vergistingketen of een demonstratieproject vergistingketen uitvoert.

      2 Indien deelnemers in een samenwerkingsverband een aanvraag indienen is een ondernemer de penvoerder.

      3 Subsidie kan ook worden verstrekt aan een niet in Nederland gevestigde deelnemer in een samenwerkingsverband
      waarvan de penvoerder in Nederland is gevestigd.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.9.2
  - number: 3.9.3
    text: |-
      De subsidie voor een pilotproject vergistingketen bedraagt niet meer dan € 750.000. Indien verscheidene aanvragen
      worden gedaan die betrekking hebben op hetzelfde project en die tezamen een subsidiebedrag van meer dan € 750.000
      betreffen, of indien het totale subsidiebedrag voor de deelnemers van een samenwerkingsverband meer bedraagt dan
      € 750.000, wordt het meerdere naar rato in mindering gebracht op de aan de betrokken aanvragers te verstrekken
      subsidie.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.9.3
  - number: 3.9.4
    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie voor een demonstratieproject
      vergistingketen 40 procent van de subsidiabele kosten, maar niet meer dan € 1.000.000. Indien verscheidene
      aanvragen worden gedaan die betrekking hebben op hetzelfde project en die tezamen een subsidiebedrag van meer dan
      € 1.000.000 betreffen, of indien het totale subsidiebedrag voor de deelnemers van een samenwerkingsverband meer
      bedraagt dan € 1.000.000, wordt het meerdere naar rato in mindering gebracht op de aan de betrokken aanvragers te
      verstrekken subsidie.

      2 Het in het eerste lid genoemde percentage wordt met 10 procentpunten verhoogd voor iedere aanvrager die een
      middelgrote onderneming in stand houdt en met 20 procentpunten voor iedere aanvrager die een kleine onderneming in
      stand houdt, voor zover de subsidiabele kosten worden gemaakt en betaald door die ondernemer.

      3 Voor de berekening van de subsidiabele kosten van een demonstratieproject vergistingketen is
      [artikel 14a van het Kaderbesluit EZ-subsidies][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0026689
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel14a
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.9.4
