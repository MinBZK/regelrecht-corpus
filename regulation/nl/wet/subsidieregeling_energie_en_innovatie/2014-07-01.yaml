  - number: 2.4.2.7
    text: |-
      1 De minister kent aan een project aan de hand van de volgende criteria een hoger aantal punten toe naarmate:

      a. het project meer bijdraagt aan verduurzaming van de Nederlandse energiehuishouding en maatschappelijk relevanter
      is, binnen de context van het innovatiecontract van de topsector energie;

      b. de mogelijke bijdrage van het project aan de Nederlandse economie groter is;

      c. het project vernieuwender is ten opzichte van de internationale stand van onderzoek of techniek en de
      Nederlandse kennispositie meer versterkt;

      d. de kwaliteit van het project beter is, blijkend uit de uitwerking van aanpak en methodiek, de omgang met
      risico’s, de uitvoerbaarheid en de deelnemende partijen.

      2 De minister kent per onderdeel van het eerste lid ten minste één en ten hoogste vijf punten toe.

      3 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.

      4 Geen subsidie wordt verleend voor een project dat lager is gerangschikt dan een soortgelijk project.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.2.7
  - number: 2.4.3.1
    text: |-
      In deze subparagraaf wordt verstaan onder:

        - *STEM-project:* een project bestaande uit fundamenteel onderzoek, industrieel onderzoek of een combinatie van
      deze vormen, dat past binnen de in [bijlage 2.4.5][ref1] (Programmalijnen STEM) opgenomen programmalijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0026952
