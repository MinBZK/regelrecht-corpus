  - number: 3.11.1
    text: |-
      1 In deze paragraaf wordt verstaan onder:

      − aansluiting: een aansluiting als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Elektriciteitswet 1998][ref1];

      − elektriciteitsnet: een net als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref2];

      − productie-installatie: een samenstel van voorzieningen waarmee hernieuwbare elektriciteit wordt geproduceerd,
      waarbij onder een samenstel van voorzieningen wordt verstaan alle aanwezige middelen die onderling met elkaar zijn
      verbonden voor de productie van hernieuwbare elektriciteit;

      − zonnepanelen: een productie-installatie voor de productie van hernieuwbare elektriciteit uit zonlicht met behulp
      van fotovoltaïsche zonnepanelen.

      2 Onder koop wordt in deze paragraaf mede verstaan huurkoop.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel1
