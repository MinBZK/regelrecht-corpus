        bwb_id: BWBR0026952
  - number: 3.4.2
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan degene die in Nederland uitvoert:

      a. een aardwarmteproject;

      b. een diep aardwarmteproject.

      2 De minister verdeelt het beschikbare bedrag in de volgorde van binnenkomst van de aanvragen.

      3 De subsidie wordt verstrekt onder de opschortende voorwaarde dat door het geologische risico op het beoogde
      stratigrafische niveau op de beoogde locatie en bij de in de beschikking tot subsidieverlening vermelde niet-
      geologische parameters, het gerealiseerd vermogen lager is dan het verwacht vermogen.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.4.2
  - number: 3.4.3
    text: |-
      1 De termijn, bedoeld in [artikel 23, onderdeel c, van het Kaderbesluit EZ-subsidies][ref1] is twee jaar.

      2 De minister beslist afwijzend op een aanvraag indien:

      a. uit het geologisch onderzoek blijkt dat de geschatte kans op het realiseren van het verwachte vermogen kleiner
      is dan 90 procent;

      b. op het moment van indiening van de aanvraag om subsidie geen vergunning als bedoeld in
      [artikel 6 van de Mijnbouwwet][ref2] is afgegeven voor het betreffende gebied;

      c. in het projectplan niet aannemelijk is gemaakt dat het aardwarmteproject of diep aardwarmteproject binnen twee
      jaar na voltooiing van de boringen zal leiden tot de start van toepassing van aardwarmte in Nederland;

      d. het verwacht vermogen lager is dan 2 MW.

      3 Bij de beoordeling van de aanvragen wint de minister advies in van TNO.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel6
