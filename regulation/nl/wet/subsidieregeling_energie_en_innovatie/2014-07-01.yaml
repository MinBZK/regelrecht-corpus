  - number: 3a.1
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *CO-emissiefactor:* 0,76 tCO/MWh;
        - *efficiëntiebenchmark voor elektriciteitsverbruik:* het op Prodcom 8-niveau gedefinieerde productspecifieke
      elektriciteitsverbruik, uitgedrukt in MWh/ton output, dat wordt bereikt met de meest elektriciteitsefficiënte
      productiemethoden voor het beschouwde product. Voor producten in de in aanmerking komende bedrijfstakken en
      deeltakken, bedoeld in [bijlage 3A.1][ref1], waarvoor de uitwisselbaarheid van brandstof en elektriciteit werd
      vastgesteld in Besluit 2011/278/EU van de Commissie van 27 april 2011 tot vaststelling van een voor de hele
      Unie geldende overgangsregeling voor de geharmoniseerde kosteloze toewijzing van emissierechten overeenkomstig
      artikel 10 bis van Richtlijn 2003/87/EG van het Europees Parlement en de Raad (PbEU 2011, L 130), worden de
      efficiëntiebenchmarks voor elektriciteitsverbruik binnen dezelfde systeemgrenzen vastgesteld, uitsluitend rekening
      houdend met het aandeel elektriciteit. De overeenkomstige elektriciteitsverbruikbenchmarks voor producten die
      vallen onder de in aanmerking komende bedrijfstakken en deeltakken, bedoeld in bijlage 3A.1, zijn opgenomen in
      [bijlage 3A.2][ref2];
        - *EUA-termijnkoers:* het gewone gemiddelde, in euro, van de dagelijkse 1-jaarstermijnkoersen van EUA's
      (slotverkoopkoersen) voor levering in december van het jaar waarvoor de subsidie wordt verleend, zoals waargenomen
      op een Europese EUA koolstofbeurs van 1 januari tot en met 31 december in het kalenderjaar voorafgaand aan het jaar
      waarin de subsidie wordt aangevraagd;
        - *fallback-efficiëntiebenchmark voor elektriciteitsverbruik:* 80 procent van het referentie-
      elektriciteitsverbruik. De fallback-benchmark wordt toegepast voor alle producten en processen die vallen
      onder in aanmerking komende bedrijfstakken of deeltakken, maar niet door de in [bijlage 3A.2][ref3] opgenomen
      efficiëntiebenchmarks voor elektriciteitsverbruik worden gedekt;
        - *indirecte emissiekosten ETS:* door elektriciteitsbedrijven doorberekende CO-kosten in de elektriciteitsprijzen
      als gevolg van deelname aan het Europese emissiehandelssysteem als bedoeld in Richtlijn 2003/87/EG van
      het Europees Parlement en de Raad van 13 oktober 2003 tot vaststelling van een regeling voor de handel in
      broeikasgasemissierechten binnen de Gemeenschap en tot wijziging van Richtlijn 96/61/EG van de Raad (PbEU 2003,
      L 275);
        - *inrichting:* een inrichting als bedoeld in [artikel 1.1, van de Wet milieubeheer][ref4];
        - *referentie-elektriciteitsverbruik:* het gemiddelde elektriciteitsverbruik, voor de vervaardiging van producten
      in bedrijfstakken of deeltakken, bedoeld in [bijlage 3A.1][ref5], in MWh, van de inrichting, voor de vervaardiging
      van producten waarvoor geen efficiëntiebenchmark voor elektriciteitsverbruik is vastgesteld gedurende de
      referentieperiode 2005-2011 in het geval van inrichtingen die van 2005 tot en met 2011 elk jaar in bedrijf waren.
      Een bepaald kalenderjaar kan worden uitgesloten uit die 7-jarige referentieperiode. Indien de inrichting van 2005
      tot en met 2011 ten minste één jaar niet in bedrijf was, wordt het referentie-elektriciteitsverbruik gelijkgesteld
      aan het jaarlijkse elektriciteitsverbruik tot er gegevens beschikbaar zijn over vier bedrijfsjaren; vanaf dan
      is het referentie-elektriciteitsverbruik gelijk aan het gemiddelde over de voorafgaande drie jaren waarvoor
      bedrijfsgegevens beschikbaar zijn;
        - *referentie-output:* de gemiddelde productie, in ton per jaar van het product waarvoor een efficiëntiebenchmark
      voor elektriciteitsverbruik is vastgesteld, in de inrichting gedurende de referentieperiode 2005–2011 in het geval
      het product in 2005 tot en met 2011 elk jaar geproduceerd is in die inrichting. Een bepaald kalenderjaar kan worden
      uitgesloten uit die 7-jarige referentieperiode. Indien de inrichting van 2005 tot en met 2011 ten minste één jaar
      dit product niet produceerde, wordt de referentie-output gelijkgesteld aan de jaarlijkse productie tot er gegevens
      beschikbaar zijn over vier bedrijfsjaren; vanaf dan is de referentie-output gelijk aan het gemiddelde over de drie
      voorafgaande jaren van die periode.


      [ref1]: https://wetten.overheid.nl/BWBR0026952
      [ref2]: https://wetten.overheid.nl/BWBR0026952
      [ref3]: https://wetten.overheid.nl/BWBR0026952
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel1.1
      [ref5]: https://wetten.overheid.nl/BWBR0026952
