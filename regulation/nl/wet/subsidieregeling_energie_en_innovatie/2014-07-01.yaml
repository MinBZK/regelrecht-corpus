      van een pilotproject energiebesparing industrie.

      2 Een samenwerkingsverband bestaat uit ten minste twee ondernemingen.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.16.2
  - number: 2.4.16.3
    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie voor een pilotproject energiebesparing
      industrie ten hoogste:

      a. 25% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling;

      b. voor demonstratieactiviteiten:

      − 40% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat energiebesparende
      maatregelen betreft en waarbij de exploitatiebaten en exploitatiekosten verrekend worden;

      − 20% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat energiebesparende
      maatregelen betreft en waarbij de exploitatiebaten en exploitatiekosten niet verrekend worden.

      2 De subsidiabele kosten van demonstratieactiviteiten worden berekend in overeenstemming
      met artikel 21 van de algemene groepsvrijstellingsverordening en met inachtneming van
      [artikel 14a, tweede lid, van het Kaderbesluit EZ-subsidies][ref2].

      3 De in het eerste lid genoemde percentages worden met 20 procentpunten verhoogd indien de aanvrager een kleine
      onderneming is en de subsidiabele kosten worden gemaakt en betaald door de kleine ondernemer.

      4 De in het eerste lid genoemde percentages worden met 10 procentpunten verhoogd indien de aanvrager een
      middelgrote onderneming is en de subsidiabele kosten worden gemaakt en betaald door de middelgrote ondernemer.

      5 Onverminderd het derde en vierde lid, wordt het in het eerste lid, onderdeel a, bedoelde percentage voor
      ondernemingen met 10 procentpunten verhoogd indien:

      a. geen van de ondernemingen meer dan 70% van de subsidiabele kosten voor rekening moet nemen en ten minste één
      deelnemer in het samenwerkingsverband een MKB-ondernemer is of ten minste één deelnemer in het samenwerkingsverband
      in een andere lidstaat van de Europese Unie dan Nederland is gevestigd en niet behoort tot een groep van een in
      Nederland gevestigde deelnemer, of

      b. het project samenwerking met een onderzoeksorganisatie betreft, de onderzoeksorganisatie minstens 10% van de
      subsidiabele projectkosten draagt en de onderzoeksorganisatie het recht heeft de resultaten van het project te
      publiceren voor zover deze afkomstig zijn van het door die organisatie uitgevoerde onderzoek.

      4 De subsidie bedraagt maximaal € 800.000 per pilotproject energiebesparing industrie.


