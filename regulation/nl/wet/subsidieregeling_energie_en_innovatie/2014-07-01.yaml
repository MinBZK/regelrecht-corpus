  - number: 2.4.19.2
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een deelnemer in een samenwerkingsverband voor het uitvoeren
      van een systeemintegratieproject.

      2 Eensamenwerkingsverband dat een systeemintegratieproject uitvoert, bevat ten minste één onderneming.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.19.2
  - number: 2.4.19.3
    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie voor een systeemintegratieproject
      ten hoogste:

      a. 75% van de subsidiabele kosten voor zover deze betrekking hebben op fundamenteel onderzoek;

      b. 50% van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek;

      c. 25% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling;

      d. voor een demonstratieproject:

        - 30% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat energiebesparende
      maatregelen betreft;
        - 45% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat maatregelen betreft die
      het gebruik van hernieuwbare energiebronnen bevorderen en waarbij de subsidiabele kosten worden berekend in
      overeenstemming met artikel 41, zesde lid, onderdeel a of b, van de algemene groepsvrijstellingsverordening;
        - 30% van de subsidiabele kosten, voor zover deze betrekking hebben op een project dat maatregelen betreft die
      het gebruik van hernieuwbare energiebronnen bevorderen en waarbij de subsidiabele kosten worden berekend in
      overeenstemming met artikel 41, zesde lid, onderdeel c, van de algemene groepsvrijstellingsverordening.

      2 De subsidiabele kosten van een demonstratieproject worden berekend in overeenstemming met
      de artikelen 38 en 41 van de algemene groepsvrijstellingsverordening en met inachtneming van
      [artikel 14a, tweede lid, van het Kaderbesluit EZ-subsidies][ref2].

      3 De in het eerste lid, onderdelen b, c en d, genoemde percentages worden met 20 procentpunten verhoogd, indien de
      aanvrager een kleine onderneming is en de subsidiabele kosten worden gemaakt en betaald door de kleine onderneming.

      4 De in het eerste lid, onderdelen b, c en d, genoemde percentages worden met 10 procentpunten verhoogd indien de
      aanvrager een middelgrote onderneming is en de subsidiabele kosten worden gemaakt en betaald door de middelgrote
      ondernemer.

      5 Onverminderd het derde en vierde lid, wordt het in het eerste lid, onderdeel c, bedoelde percentage voor MKB-
      ondernemingen met 10 procentpunten verhoogd indien:

      a. sprake is van samenwerking tussen twee onderling onafhankelijke ondernemingen en geen van de ondernemingen meer
      dan 70% van de subsidiabele kosten voor zijn rekening moet nemen, of

      b. het project samenwerking met een onderzoeksorganisatie betreft, de onderzoeksorganisatie minstens 10% van de
      subsidiabele projectkosten draagt en de onderzoeksorganisatie het recht heeft de resultaten van het project te
      publiceren voor zover deze afkomstig zijn van het door die organisatie uitgevoerde onderzoek.

      6 De subsidie bedraagt maximaal € 500.000 per systeemintegratieproject.


      [ref1]: https://wetten.overheid.nl/BWBR0026689
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel14a
