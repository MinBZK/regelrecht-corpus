    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. na toepassing van [artikel 2.4.21.7, eerste lid][ref1], minder dan 2,5 punten per criterium zijn toegekend;

      b. na toepassing van [artikel 2.4.21.7, eerste lid][ref2], minder dan 12 punten zijn toegekend;

      c. niet ten minste 50% van de financiering van de subsidiabele projectkosten bestaat uit een financiële bijdrage
      door ondernemingen;

      d. eerder op grond van deze regeling een subsidie is verstrekt voor een soortgelijk project;

      e. na toepassing van [artikel 2.4.21.7, eerste lid][ref3], een project lager is gerangschikt dan een soortgelijk
      project;

      f. de aanvrager niet aannemelijk heeft gemaakt dat het wind op zee jip leidt tot duurzame
      energieproductie in 2023 en tot een besparing op de uitgaven aan subsidies in het kader van het
      [Besluit stimulering duurzame energieproductie][ref4], die groter is dan de aangevraagde subsidie onder deze
      paragraaf.


