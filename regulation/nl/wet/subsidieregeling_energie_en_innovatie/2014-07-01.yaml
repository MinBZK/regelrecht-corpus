  - number: 2.1.5
    text: |-
      Bij de toepassing van [artikel 6, eerste lid, van het Kaderbesluit EZ-subsidies][ref1] worden buiten
      beschouwing gelaten subsidies op grond van het [Besluit stimulering duurzame energieproductie][ref2] en
      het [Besluit subsidies regionale investeringsprojecten 2000][ref3], en bijdragen van de Commissie van de
      Europese Gemeenschappen op grond van het Zevende Kaderprogramma voor activiteiten op het gebied van onderzoek,
      technologische ontwikkeling en demonstratie.


