      woning die:

      a. voor 1 september 2009 een warmtepomp bezit,

      b. technische maatregelen met betrekking tot de warmtepomp of de elektriciteitsinstallatie van de woning heeft
      getroffen die een verlaging van de capaciteit van de elektriciteitsaansluiting mogelijk maakt en die noodzakelijk
      zijn in verband met het gebruik van de warmtepomp, en

      c. een verzoek om verlaging van de capaciteit van de elektriciteitsaansluiting heeft ingediend bij de regionale
      netbeheerder.
