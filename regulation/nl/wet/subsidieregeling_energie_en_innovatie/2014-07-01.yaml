      In deze subparagraaf wordt verstaan onder smart-grids-project: project bestaande uit fundamenteel onderzoek,
      industrieel onderzoek, experimentele ontwikkeling, een demonstratieproject, of een combinatie daarvan, dat past
      binnen de in [bijlage 2.4.23][ref1] (Programmalijnen Smart Grids) opgenomen programmalijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0026952
