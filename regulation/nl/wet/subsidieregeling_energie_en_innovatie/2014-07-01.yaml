        artikel: '37'
  - number: 3a.11
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier, opgenomen in [bijlage 3A.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026952
