  - number: 3.4.7
    text: |-
      1 Indien subsidie is verstrekt voor het boren van een half-doublet geldt dat:

      a. indien het gerealiseerde vermogen van de eerste put gelijk aan of meer dan 75% van het verwacht vermogen is, de
      subsidie op nihil wordt vastgesteld indien de subsidie-ontvanger niet overgaat tot het boren van het doublet en het
      plaatsen van een pompinstallatie;

      b. indien de subsidie-ontvanger na het boren van de eerste put overgaat tot het boren van het doublet en het
      plaatsen van een pompinstallatie, [artikel 3.4.9][ref1] van toepassing is op de eerste put;

      c. indien het gerealiseerde vermogen van de eerste put minder dan 75% van het verwacht vermogen is,
      [artikel 3.4.8][ref2] van toepassing is wanneer de subsidieontvanger niet overgaat tot het boren van het doublet en
      het plaatsen van een pompinstallatie.

      2 [Artikel 3.4.6, tweede lid][ref3], is van overeenkomstige toepassing op een aardwarmteproject en een diep
      aardwarmteproject waarbij de subsidie is verstrekt voor het boren van een half-doublet.


