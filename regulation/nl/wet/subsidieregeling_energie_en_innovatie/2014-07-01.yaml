      3 De subsidie-ontvanger verleent medewerking aan evaluatie van de effecten van het door hem uitgevoerde
      haalbaarheidsonderzoek warmtereductie, voor zover deze medewerking redelijkerwijs van hem verlangd kan worden.

      4 De verplichtingen, bedoeld in het tweede en derde lid, gelden gedurende vijf jaren na de datum van de beschikking
      tot subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.8.7
