    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie voor een wind op zee jip ten hoogste:

      a. 50% van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek;

      b. 25% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling.

      2 De subsidie bedraagt per wind op zee jip ten hoogste:

      a. € 1.000.000 indien het valt in innovatiethema 1 (Ondersteuningsconstructies) of innovatiethema 5 (Beheer en
      onderhoud);

      b. € 500.000 indien het valt in innovatiethema 2 (Optimalisatie van de windcentrale) of innovatiethema 3 (Intern
      elektrisch netwerk en aansluiting op het hoogspanningsnet);

      c. € 1.500.000 indien het valt in innovatiethema 4 (Transport, Installatie en Logistiek).


