  - number: 3.4.13
    text: |-
      1 De subsidie-ontvanger verstrekt binnen vier weken na de boring van een put en het uitvoeren van de puttest, de
      resultaten van deze puttest aan de Minister.

      2 De subsidie-ontvanger verstrekt binnen vier weken na verbeterwerkzaamheden en het uitvoeren van de puttest, de
      resultaten van deze puttest aan de Minister.

      3 Het geologisch onderzoek en de puttest worden uitgevoerd door een ISO 9001 gecertificeerde instelling.

      4 De subsidie-ontvanger maakt de resultaten van het geologische onderzoek binnen acht weken na de start, bedoeld in
      [artikel 3.4.11, eerste lid][ref1], openbaar.

      5 De subsidie-ontvanger maakt binnen vier weken na datum van de beschikking tot subsidievaststelling de
      resultaten openbaar van de puttest of puttesten en overige onderzoeksresultaten die door de subsidie-ontvanger als
      subsidiabele kosten als bedoeld in [artikel 3.4.5][ref2] worden aangemerkt.


