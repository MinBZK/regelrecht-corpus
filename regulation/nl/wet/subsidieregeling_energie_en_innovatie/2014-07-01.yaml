  - number: 3.2.7
    text: |-
      1 Indien de aanvraag betrekking heeft op activiteiten die betrekking hebben op vloeibare biomassa of
      biobrandstoffen beslist de minister afwijzend op een aanvraag indien onvoldoende vertrouwen bestaat dat de
      vloeibare biomassa of biobrandstoffen voldoen, of na uitvoering van de activiteiten zullen voldoen, aan de
      duurzaamheidscriteria genoemd in artikel 17 van [Richtlijn 2009/28/EG](32009L0028) van het Europees Parlement en de
      Raad ter bevordering van het gebruik van energie uit hernieuwbare bronnen en houdende wijziging en intrekking van
      [Richtlijnen 2001/77/EG](32001L0077) en [2003/30/EG](32003L0030).

      2 De minister beslist afwijzend op een aanvraag indien het project gericht is op:

      a. de aanpassing aan van toepassing zijnde, of vastgestelde maar nog niet van toepassing zijnde, communautaire
      normen,

      b. de aanpassing aan nationale normen die gelijk zijn aan of minder zware eisen stellen dan communautaire normen of

      c. de aanpassing aan nationale normen bij afwezigheid van communautaire normen, indien de aanpassing heeft
      plaatsgevonden na de op de in de nationale norm vastgestelde uiterste datum.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.2.7
  - number: 3.2.8
    text: |-
      1 De minister rangschikt de aanvragen waarop niet afwijzend is beslist, zodanig dat een project hoger gerangschikt
      wordt naarmate het meer bijdraagt aan de doelstellingen bedoeld in [artikel 3.2.2][ref1]. Bij de rangschikking
      worden de volgende criteria gehanteerd:

      a. de mate waarin het project bijdraagt aan de doelstellingen bedoeld in [artikel 3.2.2][ref2], in relatie tot de
      totale subsidiabele kosten van het project;

      b. de mate waarin het project bijdraagt aan verduurzaming van ketens voor biomassa in de zin van
      [artikel 3.2.2, tweede lid][ref3], in relatie tot de resultaten van de beoordeling van de betreffende biomassaketen
      aan de hand van het Toetsingskader voor duurzame biomassa;

      c. de mate waarin het project in de praktijk navolging kan vinden en kan worden opgeschaald, waarbij ook de
      navolging en opschaling leiden tot toepassing van duurzame biomassa in Nederland.

      2 Voor de rangschikking wegen de in het eerste lid genoemde criteria even zwaar.


