  - number: 3.4.1
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *aardwarmte:* aardwarmte in de zin van [artikel 1, onderdeel b, van de Mijnbouwwet][ref1];
        - *aardwarmteproject:* het mogelijk maken van de winning en toepassing van aardwarmte met een diepte van de top van
      de aquifer van ten minste 500 meter tot ten hoogste 3500 meter, door het boren van een doublet of een half doublet
      zonder putstimulatie en het plaatsen van een pompinstallatie;
        - *alternatiefwerkzaamheden:* activiteiten om het alternatief gebruik van een put met een lager dan verwacht
      gerealiseerd vermogen in MW mogelijk te maken;
        - *alternatief gebruik:* het gebruiken van een aardwarmteput voor andere doeleinden dan het overeenkomstig de
      aanvraag winnen en toepassen van aardwarmte;
        - *diep aardwarmteproject:* het mogelijk maken van de winning en toepassing van aardwarmte vanaf ten minste 3500
      meter diepte van de top van de aquifer door het boren van een doublet of een half doublet zonder putstimulatie en
      het plaatsen van een pompinstallatie;
        - *doublet:* een productieput en een injectieput;
        - *geologisch onderzoek:* geologisch onderzoek, inclusief het rapport opgesteld overeenkomstig het model in bijlage
      D bij [bijlage 3.4.1][ref2];
        - *geologisch risico:* het risico op een te laag gerealiseerd vermogen voor zover dit te wijten is aan specifieke
      aquifer parameters bestaande uit: a. de bruto aquiferdikte, b. de netto-bruto verhouding van de aquifer, c. de
      aquifer permeabiliteit, d. de diepte van de top van de aquifer, e. de saliniteit van het formatiewater, of f. de
      geothermische gradient;
        - *gerealiseerde subsidiabele kosten:* de rechtstreeks aan het aardwarmteproject toe te rekenen, door de subsidie-
      ontvanger gemaakte en betaalde subsidiabele kosten;
        - *gerealiseerd vermogen:* het uit de puttest gebleken werkelijke vermogen in MW, met een correctie op skin = 0;
        - *half-doublet:* de eerste put van een doublet;
        - *maximale subsidiebedrag:* het in de beschikking tot subsidieverlening vermelde maximale subsidiebedrag,
      bestaande uit 85  procent van de verwachte subsidiabele kosten met een maximum van € 7.225.000 voor een
      aardwarmteproject en € 12.750.000 voor een diep aardwarmteproject;
        - *niet-geologische parameters:* de niet-geologische parameters, genoemd in de tabel in hoofdstuk 1, paragraaf 1.1,
      van het geologisch onderzoek;
        - *puttest:* test van het vermogen van de put of putten, uitgevoerd en geïnterpreteerd overeenkomstig bijlage B
      bij [bijlage 3.4.2][ref3];
        - *putstimulatie:* het uitvoeren van technieken die leiden tot een verlaagde weerstand voor het toestromen van
      vloeistof van het reservoir naar de put of vice versa, zodat de productiviteit of injectiviteit van de put wordt
      verhoogd;
        - *restwaarde:* de opbrengst van het project bij de economisch meest rendabele alternatieve toepassing gedurende
      15 jaar;
        - *verbeterwerkzaamheden:* werkzaamheden aan de productieput, injectieput of pompinstallatie om het gerealiseerde
      vermogen van het doublet in MW te verhogen;
        - *verwachte subsidiabele kosten:* de in de beschikking tot subsidieverlening vermelde subsidiabele kosten;
        - *verwacht vermogen:* het in de beschikking tot subsidieverlening vermelde verwacht vermogen in MW.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0026952
      [ref3]: https://wetten.overheid.nl/BWBR0026952
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.4.1
    references:
      - id: ref1
