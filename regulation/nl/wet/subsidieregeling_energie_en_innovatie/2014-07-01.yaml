  - number: 3.11.5
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.11.5
  - number: 3.11.6
    text: |-
      1 De minister beslist afwijzend op een aanvraag om subsidie indien:

      a. er door de aanvrager geen overeenkomst voor de koop van fotovoltaïsche zonnepanelen waarop de aanvraag
      betrekking heeft is gesloten;

      b. de aanvrager op grond van een bepaling in de overeenkomst voor de koop van fotovoltaïsche zonnepanelen waarop de
      aanvraag betrekking heeft, de overeenkomst kan ontbinden op andere gronden dan dat er geen subsidie wordt verstrekt
      op grond van deze paragraaf;

      c. de aanvrager vóór 2 juli 2012 ter zake van de koop van de zonnepanelen waarop de aanvraag betrekking heeft,
      verplichtingen is aangegaan;

      d. er voor het adres waarop de zonnepanelen worden geïnstalleerd reeds subsidie is verstrekt op grond van deze
      paragraaf;

      e. er voor de koop of het installeren van de zonnepanelen waarop de aanvraag betrekking heeft een subsidie van meer
      dan € 0,- is verstrekt door een bestuursorgaan;

      f. op het moment van indienen van de aanvraag geen toestemming van de eigenaar van de onroerende zaak waarop de
      zonnepanelen worden geïnstalleerd is verkregen;

      g. de zonnepanelen worden aangesloten op een elektriciteitsnet via een aansluiting met een doorlaatwaarde van meer
      dan 3*80 A;

      h. in de aanvraag wordt verzocht om uitbetaling van de subsidie op een rekening die niet van de aanvrager is.

      2 De afwijzingsgronden, genoemd in [artikel 23 van het Kaderbesluit EZ-subsidies][ref1], zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.11.6
