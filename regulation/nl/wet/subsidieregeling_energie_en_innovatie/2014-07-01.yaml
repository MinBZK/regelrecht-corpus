  - number: 3.2.1
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *keten voor biomassa:* de productie, de verwerking en de import van in het buitenland geproduceerde biomassa die
      leidt tot de toepassing van biomassa voor energie-, transport- of chemiedoeleinden in Nederland;
        - *primaire landbouwproducent:* onderneming van de landbouwproductiesector in de zin van artikel 2, eerste
      lid, van [verordening (EG) nr. 1535/2007](32007R1535) van de Commissie van de Europese Gemeenschappen van 20
      december 2007 betreffende de toepassing van de artikelen 87 en 88 van het EG-Verdrag op de-minimissteun in de
      landbouwproductiesector;
        - *Toetsingskader voor duurzame biomassa:* het toetsingskader opgesteld door de projectgroep Duurzame productie
      van biomassa.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.2.1
  - number: 3.2.2
    text: |-
      1 De minister verstrekt op aanvraag een subsidie voor activiteiten die op innovatieve wijze bijdragen aan het
      verduurzamen van ketens voor biomassa.

      2 Onder het verduurzamen van ketens voor biomassa bedoeld in het eerste lid wordt verstaan:

      a. het verduurzamen van de biomassaketen aan de hand van het Toetsingskader voor duurzame biomassa;

      b. de certificering van duurzame biomassaketens; of

      c. het tegengaan van ongewenste indirecte effecten van biomassaproductie.

      3 Subsidie kan ook worden verstrekt aan een niet in Nederland gevestigde deelnemer in een samenwerkingsverband
      waarvan de penvoerder in Nederland is gevestigd.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.2.2
  - number: 3.2.3
    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie:

      a. 50 procent van de subsidiabele kosten indien de subsidie-ontvanger een ondernemer is;

      b. 75 procent van de subsidiabele kosten indien de subsidie-ontvanger geen ondernemer is.

      2 De subsidie bedraagt maximaal:

      a. € 500.000 per ondernemer, niet zijnde een binnen de Europese Unie gevestigde primaire landbouwproducent;

      b. € 7.500 per binnen de Europese Unie gevestigde primaire landbouwproducent.

      3 In aanvulling op het tweede lid wordt, indien verscheidene aanvragen worden gedaan die betrekking hebben op
      hetzelfde project en die tezamen een subsidiebedrag van meer dan € 1.000.000 betreffen, of indien het totale
      subsidiebedrag voor de deelnemers van het samenwerkingsverband meer bedraagt dan € 1.000.000 het meerdere naar rato
      in mindering gebracht op de aan de betrokken aanvragers te verstrekken subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0026689
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0026689
  - number: 3.2.4
    text: |-
      1 Voor subsidie komen in aanmerking de kosten die noodzakelijk zijn voor de verduurzaming van ketens voor biomassa.

      2 In afwijking van [artikel 11, eerste lid, van het Kaderbesluit EZ-subsidies][ref1] kiest een buiten Nederland
      gevestigde aanvrager voor de berekening van de subsidiabele kosten uit:

      a. de integrale kostensystematiek, opgenomen in [artikel 12 van het Kaderbesluit EZ-subsidies][ref2] of

      b. de loonkosten plus vaste-opslag-systematiek, opgenomen in [artikel 13 van het Kaderbesluit EZ-subsidies][ref3].


