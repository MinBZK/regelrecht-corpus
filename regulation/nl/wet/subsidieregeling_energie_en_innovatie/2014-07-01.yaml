  - number: 3.6.1
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *demonstratieproject vergassing:* een project waarin vergassingstechniek wordt gedemonstreerd en doorontwikkeld
      tot een continue bedrijfsvoering, waarvan de schaalgrootte minimaal 10 MW en maximaal 50 MW (input thermisch)
      bedraagt, waarvoor zuivere biomassa, biomassa mengstromen of afvalfracties als brandstof dienen en waarvan het
      synthesegas wordt gebruikt voor warmtekracht/koppeling, toepassing in de industrie, opwerking tot vervangend
      aardgas of andere hoogwaardige energiedragers alsmede de verspreiding van de verkregen kennis en de vermarkting van
      de ontwikkelde technologie;
        - *vergassing:* een thermisch proces dat plaatsvindt bij temperaturen boven 800 °C, waarbij de brandstof met een
      hoog rendement wordt omgezet in een synthesegas dat flexibel inzetbaar is;
        - *voorbereidingsstudie:* een studie ter voorbereiding van een aanvraag voor een demonstratieproject vergassing
      waarbij de aanvrager onderzoekt of en aantoont dat de door hem ontwikkelde technologie voldoet aan de eisen die
      zijn gesteld aan een demonstratieproject vergassing.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.6.1
  - number: 3.6.2
    text: |-
      1 De minister verstrekt op aanvraag een subsidie voor een voorbereidingsstudie.

      2 De minister verstrekt op aanvraag een subsidie voor een demonstratieproject vergassing.

      3 In aanvulling op [artikel 3, eerste lid, van het Kaderbesluit EZ-subsidies][ref1] zijn het eerste en tweede lid
      ook van toepassing op niet in Nederland gevestigde deelnemers in een samenwerkingsverband waarvan de penvoerder in
      Nederland is gevestigd.

      4 Geen subsidie wordt verstrekt aan natuurlijke personen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel3
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.6.2
