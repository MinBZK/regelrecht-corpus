  - number: 2.4.18.7
    text: |-
      1 De minister kent aan een project een hoger aantal punten toe naarmate:

      a. de mogelijke bijdrage van het project aan de Nederlandse economie groter is;

      b. het project meer bijdraagt aan verduurzaming van de energiehuishouding en maatschappelijk relevanter is, binnen
      de context van de overgang naar een duurzame energievoorziening;

      c. het project vernieuwender is ten opzichte van de internationale stand van onderzoek of techniek en de
      Nederlandse kennispositie meer versterkt;

      d. de kwaliteit van het project beter is, blijkend uit de uitwerking van aanpak en methodiek, de omgang met
      risico’s, de uitvoerbaarheid en de deelnemende partijen.

      2 De minister kent per onderdeel van het eerste lid ten minste één en ten hoogste vijf punten toe.

      3 Voor de rangschikking wordt het aantal punten gegeven voor het eerste lid, onderdeel a, vermenigvuldigd met 50,
      het eerste lid, onderdeel b, vermenigvuldigd met 15, het eerste lid, onderdeel c, vermenigvuldigd met 15 en het
      eerste lid, onderdeel d, vermenigvuldigd met 20 en vervolgens opgeteld.

      4 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.18.7
