      a. na toepassing van [artikel 2.4.3.7, eerste lid][ref1], minder dan 5 punten per criterium zijn toegekend;

      b. niet ten minste 20% van de subsidiabele projectkosten worden gefinancierd door ondernemingen of een organisatie
