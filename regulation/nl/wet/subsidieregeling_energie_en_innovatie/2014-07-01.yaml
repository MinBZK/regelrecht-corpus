    text: |-
      1 De subsidie-ontvanger geeft binnen zes maanden na de datum van de beschikking tot subsidieverlening opdracht tot
      uitvoering van de duurzame warmtemaatregel.

      2 Indien de subsidie-ontvanger een eigenaar-bewoner is, voltooit deze de duurzame warmtemaatregel uiterlijk twaalf
      maanden na de datum van de beschikking tot subsidieverlening.

      3 Indien de subsidie-ontvanger een eigenaar-verhuurder is, voltooit deze de duurzame warmtemaatregel uiterlijk
      achttien maanden na de datum van de beschikking tot subsidieverlening.

      4 De verplichtingen, genoemd in de [artikelen 36 tot en met 41 van het Kaderbesluit EZ-subsidies][ref1], zijn niet
      van toepassing.


