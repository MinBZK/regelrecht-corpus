  - number: 2.4.3.2
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een deelnemer in een samenwerkingsverband voor het uitvoeren
      van een STEM-project.

      2 Een samenwerkingsverband bestaat ten minste uit drie deelnemers, waarvan ten minste één kennisinstelling en ten
      minste één onderneming of een organisatie zonder winstoogmerk die ondernemingen als achterban heeft.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.3.2
  - number: 2.4.3.3
    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie voor een STEM-project ten hoogste:

      a. 30% van de subsidiabele kosten voor zover deze betrekking hebben op ondernemingen of een organisatie zonder
      winstoogmerk die ondernemingen als achterban heeft;

      b. 50% van de subsidiabele kosten voor zover deze betrekking hebben op economische activiteiten van
      kennisinstellingen;

      c. 80% van de subsidiabele kosten voor zover deze betrekking hebben op niet-economische activiteiten van
      kennisinstellingen;

      2 Het in het eerste lid, onderdeel a, genoemde percentage wordt met 20 procentpunten verhoogd indien het STEM-
      project betrekking heeft op hoofdlijn 1 uit [bijlage 2.4.5][ref2]: Energie gerelateerde sociale innovatie
      vraagstukken voor meerdere sectoren in Nederland (TSE-TKI doorsnijdende vraagstukken).

      3 De subsidie bedraagt maximaal € 400.000 per STEM-project.


      [ref1]: https://wetten.overheid.nl/BWBR0026689
      [ref2]: https://wetten.overheid.nl/BWBR0026952
