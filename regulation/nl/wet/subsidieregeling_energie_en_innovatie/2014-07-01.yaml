      van het EOS-demonstratieproject.

      2 De subsidieontvanger voltooit het project binnen drie jaar na aanvang van het EOS-demonstratieproject.

      3 De subsidie-ontvanger draagt zorg voor de openbaarmaking en verspreiding van de resultaten van het project.

      4 De verplichting, bedoeld in het derde lid, geldt tot vijf jaar na de datum van de beschikking tot
      subsidievaststelling.

      5 De [artikelen 38, eerste lid, onderdeel b tot en met d][ref1], en [41 van het Kaderbesluit EZ-subsidies][ref2]
      zijn niet van toepassing.


