  - number: 3.1.5
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.1.5
  - number: 3.1.6
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien:

      a. hij het onaannemelijk acht dat de aanvrager binnen zes maanden na de datum van de beschikking tot
      subsidieverlening opdracht zal geven tot uitvoering van de duurzame warmtemaatregel;

      b. de aanvrager vóór 1 september 2008 ter zake van de duurzame warmtemaatregel waarop de aanvraag betrekking heeft,
      verplichtingen is aangegaan;

      c. het project gericht is op de aanpassing aan van toepassing zijnde, of vastgestelde maar nog niet van toepassing
      zijnde, communautaire normen,

      d. het project gericht is op de aanpassing aan nationale normen die gelijk zijn aan of minder zware eisen stellen
      dan communautaire normen, of

      e. het project gericht is op de aanpassing aan nationale normen bij afwezigheid van communautaire normen, indien de
      aanpassing heeft plaatsgevonden na de op de in de nationale norm vastgestelde uiterste datum.

      2 De afwijzingsgrond, genoemd in [artikel 23, onderdeel d, van het Kaderbesluit EZ-subsidies][ref1], is niet van
      toepassing.


