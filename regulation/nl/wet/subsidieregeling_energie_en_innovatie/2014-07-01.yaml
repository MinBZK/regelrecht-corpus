        artikel: '38'
  - number: 2.4.5
    text: |-
      1 Indien het totale subsidiebedrag voor de deelnemers van een samenwerkingsverband meer bedraagt dan het in de
      relevante subparagraaf van deze paragraaf genoemde maximum subsidiebedrag per project, wordt het meerdere naar rato
      in mindering gebracht op de aan de betrokken aanvragers te verstrekken subsidie.

      2 Een samenwerkingsverband voert een project uit voor gezamenlijke rekening en risico.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.5
  - number: 2.4.6
    text: |-
      Bijdragen van gemeenten, provincies, waterschappen en openbare lichamen als bedoeld in
      [artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen][ref1], worden aangemerkt als publieke
      cofinanciering, en blijven bij de toepassing van [artikel 6, eerste lid, van het Kaderbesluit EZ-subsidies][ref2]
      buiten beschouwing voor zover het de berekening betreft van het maximum bedrag dat krachtens deze paragraaf per
      project kan worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel6
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.6
