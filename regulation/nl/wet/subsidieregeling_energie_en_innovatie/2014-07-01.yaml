  - number: 3.1.2
    text: |-
      De minister verstrekt op aanvraag een subsidie voor een duurzame warmtemaatregel aan:

      a. een eigenaar-bewoner van een bestaande woning, of

      b. een eigenaar-verhuurder van een bestaande woning,

      die een duurzame warmtemaatregel uitvoert.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3.1.2
  - number: 3.1.3
    text: |-
      1 De hoogte van de subsidie voor zonneboilers en warmtepompen, niet zijnde lucht/waterwarmtepompen wordt berekend
      door het aantal GJ of kW te bepalen volgens de methode, opgenomen in [bijlage 3.1.2][ref1], en dit getal te
      vermenigvuldigen met het bedrag, opgenomen in [bijlage 3.1.3][ref2].

      2 De hoogte van de subsidie voor zonneboilers die naast een bijdrage aan warm tapwater ook een bijdrage leveren aan
      de ruimteverwarming, wordt gebaseerd op de bijdrage aan warm tapwater.

      3 De subsidie bedraagt voor:

      a. een lucht/waterwarmtepomp € 2000 per stuk;

      b. een installatie voor micro-warmtekrachtkoppeling € 4000 per stuk.

      4 Bij subsidie aan een ondernemer waar een Europees steunkader op van toepassing is, bedraagt de subsidie niet meer
      dan is toegestaan op basis van dat steunkader.


      [ref1]: https://wetten.overheid.nl/BWBR0026952
      [ref2]: https://wetten.overheid.nl/BWBR0026952
