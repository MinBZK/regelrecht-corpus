  - number: 2.4.13.7
    text: |-
      1 De minister kent aan een project aan de hand van de volgende criteria een hoger aantal punten toe naarmate:

      a. het project meer bijdraagt aan verduurzaming van de Nederlandse energiehuishouding en maatschappelijk relevanter
      is, binnen de context van het innovatiecontract van de topsector energie;

      b. de mogelijke bijdrage van het project aan de Nederlandse economie groter is.

      c. het project vernieuwender is ten opzichte van de internationale stand van onderzoek of techniek en de
      Nederlandse kennispositie meer versterkt;

      d. de kwaliteit van het project beter is, blijkend uit de uitwerking van aanpak en methodiek, de omgang met
      risico’s, de uitvoerbaarheid de deelnemende partijen en de mate waarin de beschikbare middelen effectiever en
      efficiënter worden ingezet.

      2 De minister kent per onderdeel van het eerste lid ten minste één en ten hoogste 5 punten toe.

      3 Voor de rangschikking wordt het aantal punten gegeven voor het eerste lid, onderdeel a, vermenigvuldigd met 20,
      het eerste lid, onderdeel b, vermenigvuldigd met 20, het eerste lid, onderdeel c, vermenigvuldigd met 30 en het
      eerste lid, onderdeel d, vermenigvuldigd met 30 en vervolgens opgeteld.

      4 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.

      5 Geen subsidie wordt verleend voor een project dat lager is gerangschikt dan een soortgelijk project.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.13.7
  - number: 2.4.15.1
    text: |-
      In deze subparagraaf wordt verstaan onder early adopter-project: project bestaande uit experimentele ontwikkeling,
      gericht op het in een realistische industriële omgeving valideren van een nieuwe energiebesparende technologie,
      passend binnen de in [bijlage 2.4.16][ref1] (Programmalijnen Energiebesparing industrie: early adopter-projecten)
      opgenomen programmalijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0026952
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.15.1
    references:
      - id: ref1
        bwb_id: BWBR0026952
  - number: 2.4.15.2
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een deelnemer in een samenwerkingsverband voor het uitvoeren
      van een early adopter-project.

      2 Een samenwerkingsverband bestaat uit ten minste drie ondernemingen.

      3 Ten minste twee van de deelnemers zijn potentiële eindgebruikers van de technologie.

      4 De penvoerder van het samenwerkingsverband is een MKB-deelnemer in het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.15.2
  - number: 2.4.15.3
    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie voor een early adopter-project ten
      hoogste 25% van de subsidiabele kosten.

      2 Het in het eerste lid genoemde percentage wordt met 20 procentpunten verhoogd indien de aanvrager een kleine
      onderneming is en de subsidiabele kosten worden gemaakt en betaald door de kleine ondernemer.

      3 Het in het eerste lid genoemde percentage wordt met 10 procentpunten verhoogd indien de aanvrager een middelgrote
      onderneming is en de subsidiabele kosten worden gemaakt en betaald door de middelgrote ondernemer.

      4 Onverminderd het tweede en derde lid, wordt het in het eerste lid bedoelde percentage voor ondernemingen met 10
      procentpunten verhoogd indien geen van de ondernemingen meer dan 70% van de subsidiabele kosten voor rekening moet
      nemen en ten minste één deelnemer in het samenwerkingsverband een MKB-ondernemer is of ten minste één deelnemer in
      het samenwerkingsverband in een andere lidstaat van de Europese Unie dan Nederland is gevestigd en niet behoort tot
      een groep van een in Nederland gevestigde deelnemer.

      5 De subsidie bedraagt maximaal € 75.000 per early adopter-project.


      [ref1]: https://wetten.overheid.nl/BWBR0026689
