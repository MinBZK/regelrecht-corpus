  - number: 3.7.10
    text: |-
      1 De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate:

      a. het project meer bijdraagt aan de kwantitatieve reductie van de kostprijs van windenergie op zee in 2020;

      b. het project meer bijdraagt aan omzet en werkgelegenheid van de Nederlandse windenergie op zee sector in 2020;

      c. de kwaliteit van het project beter is, blijkend uit de samenstelling van het consortium, deelname van cruciale
      partijen uit de waardeketen of van het MKB, het publicatieplan en de plannen voor het intellectuele eigendom, de
      technische of wetenschappelijke onderzoeksmethode, het projectplan en de projectorganisatie;

      d. de projectopzet kosteneffectiever is en voor het project minder subsidie wordt aangevraagd in verhouding tot wat
      maximaal voor het project op grond van deze paragraaf mogelijk is.

      2 Voor de rangschikking tellen de criteria even zwaar.

      3 Geen subsidie wordt verleend voor een project dat lager is gerangschikt dan een soortgelijk project.
