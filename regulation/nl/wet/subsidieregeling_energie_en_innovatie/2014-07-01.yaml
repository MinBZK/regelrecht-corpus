  - number: 2.3.11
    text: |-
      Het formulier voor het indienen van een aanvraag voor:

      a. een subsidie is opgenomen in [bijlage 2.1.2][ref1],

      b. een subsidievaststelling is opgenomen in [bijlage 2.1.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0026952
      [ref2]: https://wetten.overheid.nl/BWBR0026952
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.3.11
    references:
      - id: ref1
        bwb_id: BWBR0026952
      - id: ref2
        bwb_id: BWBR0026952
  - number: 2.4.1
    text: |-
      Bij de toepassing van [artikel 6, eerste lid, van het Kaderbesluit EZ-subsidies][ref1] worden buiten beschouwing
      gelaten:

      a. subsidies op grond van het [Besluit stimulering duurzame energieproductie][ref2];

      b. bijdragen van de Europese Commissie op grond van Besluit nr. 1982/2006/EG van het Europees Parlement en de
      Raad van 18 december 2006 betreffende het zevende kaderprogramma voor activiteiten op het gebied van onderzoek,
      technologische ontwikkeling en demonstratie (PbEU 2006, L 412) en Verordening (EU) nr. 1291/2013 van het Europees
      Parlement en de Raad van 11 december 2013 tot vaststelling van Horizon 2020 – het kaderprogramma voor onderzoek en
      innovatie (2014 -2020) en tot intrekking van Besluit nr. 1982/2006/EG (PbEU 2013, L 347).


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0022735
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.1
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0022735
  - number: 2.4.2
    text: |-
      1 Met de uitvoering van de op grond van deze paragraaf gesubsidieerde activiteiten wordt gestart binnen zes maanden
      na de verlening.

      2 Op verzoek van de minister verleent de subsidieontvanger medewerking aan het verspreiden van de resultaten en
      medewerking aan een evaluatie van de effecten van de op grond van deze paragraaf gesubsidieerde activiteiten.

      3 De subsidie-ontvanger maakt de niet bedrijfsgevoelige kennis en informatie die met het project wordt opgedaan na
      afloop van het project openbaar in een, naar het oordeel van de minister, kwalitatief voldoende verslag.

      4 Iedere publicatie door of met medewerking van de deelnemers in het project of diens medewerkers wordt voorzien
      van de vermelding dat het project wordt uitgevoerd met Topsector Energie-subsidie van het Ministerie van
      Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.2
  - number: 2.4.3
    text: |-
      1 Voor het indienen van een aanvraag voor verlening van subsidie op grond van deze paragraaf wordt gebruik gemaakt
      van het formulier dat is opgenomen in [bijlage 2.4.1][ref1] (Formulier aanvraag Topsector energieproject).

      2 Voor het indienen van een aanvraag voor vaststelling van een op grond van deze paragraaf verleende subsidie
      wordt gebruik gemaakt van het formulier dat is opgenomen in [bijlage 2.4.2][ref2] (Formulier vaststelling subsidie
      Topsector energieproject).


      [ref1]: https://wetten.overheid.nl/BWBR0026952
      [ref2]: https://wetten.overheid.nl/BWBR0026952
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.3
    references:
      - id: ref1
        bwb_id: BWBR0026952
      - id: ref2
        bwb_id: BWBR0026952
  - number: 2.4.4
    text: |-
      Voor zover de subsidiabele projectkosten betrekking hebben op een demonstratieproject
      als bedoeld in deze paragraaf, zijn de [artikelen 10, derde lid][ref1], en
      [38, eerste lid, onderdelen b tot en met d, van het Kaderbesluit EZ-subsidies][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel38
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.4.4
    references:
