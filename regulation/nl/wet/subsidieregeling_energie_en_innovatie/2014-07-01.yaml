  - number: 2.3.1
    text: |-
      In deze paragraaf wordt verstaan onder een EOS-demonstratieproject: een demonstratieproject, geheel of nagenoeg
      geheel bestemd voor het vergroten van inzicht in de geschiktheid voor toepassing in de praktijk van duurzame
      energiehuishouding, dat bestaat uit:

      a. energiebesparende maatregelen,

      b. maatregelen waarbij CO-emissies worden afgevangen en permanent in de ondergrond opgeslagen of

      c. maatregelen die het gebruik van hernieuwbare energiebronnen bevorderen.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.3.1
  - number: 2.3.2
    text: |-
      1 De minister verstrekt op aanvraag een subsidie voor een EOS-demonstratieproject dat past in een of meerdere
      energiethema’s en waarin:

      a. nieuwe technieken worden toegepast; of

      b. nieuwe combinaties van bestaande technieken worden toegepast.

      2 Energiethema’s als bedoeld in het eerste lid zijn:

      a. groene grondstoffen;

      b. nieuw gas;

      c. duurzame elektriciteitsvoorziening;

      d. ketenefficiency;

      e. gebouwde omgeving;

      f. duurzame mobiliteit;

      g. carbon capture and storage;

      h. kas als energiebron.

      3 Tot een EOS-demonstratieproject worden niet gerekend activiteiten met betrekking tot kernfusie en met betrekking
      tot nucleair onderzoek.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.3.2
  - number: 2.3.3
    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie 40 procent van de subsidiabele kosten.

      2 Het in het eerste lid genoemde percentage wordt met 10 procentpunten verhoogd indien de aanvrager MKB-ondernemer
      is voor zover de subsidiabele kosten worden gemaakt en betaald door die ondernemer.

      3 Indien de subsidieontvanger een ondernemer in de landbouwsector is, is de verhoging, bedoeld in het tweede
      lid, niet van toepassing voor zover de subsidiabele kosten betrekking hebben op investeringen waardoor de
      productiecapaciteit zal toenemen.

      4 Het te verlenen subsidiebedrag, tot stand gekomen met toepassing van het eerste en tweede lid, is niet meer dan
      de maximaal toegestane investeringssteun, berekend op de voet van de Communautaire richtsnoeren inzake staatsteun
      voor milieubescherming (PbEU 2008, C82).

      5 De subsidie voor een EOS demonstratieproject bedraagt niet meer dan € 800.000. Indien verscheidene aanvragen
      worden gedaan die betrekking hebben op hetzelfde project en die tezamen een subsidiebedrag van meer dan
      € 800.000 betreffen, of indien het totale subsidiebedrag voor de deelnemers van een samenwerkingsverband meer
      bedraagt dan € 800.000, wordt het meerdere naar rato in mindering gebracht op de aan de betrokken aanvragers te
      verstrekken subsidie.


