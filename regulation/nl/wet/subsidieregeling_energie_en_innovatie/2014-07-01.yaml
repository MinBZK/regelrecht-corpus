  - number: 3a.8
    text: De minister verdeelt het subsidieplafond evenredig over de ingediende aanvragen.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3a.8
  - number: 3a.9
    text: |-
      1 De afwijzingsgronden, genoemd in
      [artikel 23, onderdeel a, b, c, d, e, f, g, h en j, van het Kaderbesluit EZ-subsidies][ref1] zijn niet van
      toepassing.

      2 De minister beslist afwijzend op een aanvraag om subsidie indien de subsidieaanvrager op 1 maart van het jaar
      waarin de subsidie wordt aangevraagd niet is toegetreden tot een convenant waarin de subsidieaanvrager in het
      kader van met de minister, de Minister van Financiën en de Minister van Infrastructuur en Milieu gemaakte afspraken
      verplichtingen op zich heeft genomen ter verbetering van de energie-efficiëntie.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3a.9
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3a.10
    text: |-
      Op een subsidie voor de indirecte emissiekosten ETS zijn de
      [artikelen 37 tot en met 42 van het Kaderbesluit EZ-subsidies][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel37
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel3a.10
