  - number: 2.1.6
    text: |-
      1 De minister verdeelt het subsidieplafond voor lange termijnprojecten op volgorde van rangschikking van de
      aanvragen.

      2 De minister verdeelt het subsidieplafond voor een nieuw energieonderzoeksproject bestaande uit fundamenteel
      onderzoek, industrieel onderzoek of een combinatie van beide op volgorde van rangschikking van de aanvragen.

      3 De minister verdeelt het subsidieplafond voor een nieuw energieonderzoeksproject bestaande uit
      haalbaarheidsstudies op volgorde van ontvangst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0026952/2014-07-01#Artikel2.1.6
  - number: 2.1.7
    text: |-
      1 Er is een Adviescommissie lange termijn energieonderzoek en nieuw energieonderzoek, die tot
      taak heeft de minister op zijn verzoek te adviseren omtrent de afwijzingsgronden, bedoeld in
      [artikel 23, onderdeel e, g en h van het Kaderbesluit EZ-subsidies][ref1] en [artikel 2.1.10, eerste lid][ref2], en
      de rangschikkingscriteria, bedoeld in de [artikelen 2.1.9][ref3] en 2.1.10.

      2 De commissie bestaat uit ten minste vijf en ten hoogste 35 leden.

      3 De voorzitter en de andere leden worden benoemd voor een termijn van ten hoogste vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
