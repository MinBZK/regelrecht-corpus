  - number: 3.4.1
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *aardwarmte:* aardwarmte in de zin van [artikel 1, onderdeel b, van de Mijnbouwwet][ref1];
        - *aardwarmteproject:* het mogelijk maken van de winning en toepassing van aardwarmte van ten minste 500 meter
      diepte door het boren van een productieput en een injectieput en het plaatsen van een pompinstallatie;
        - *geologisch onderzoek:* geologisch onderzoek, inclusief het rapport opgesteld overeenkomstig het model in bijlage
      D bij [bijlage 3.4.1][ref2];
        - *gerealiseerde subsidiabele kosten:* de rechtstreeks aan het aardwarmteproject toe te rekenen, door de subsidie-
      ontvanger gemaakte en betaalde subsidiabele kosten;
        - *gerealiseerd vermogen:* het uit de puttest gebleken werkelijke vermogen in MW, met een correctie op skin = 0;
        - *maximale subsidiebedrag:* het in de beschikking tot subsidieverlening vermelde maximale subsidiebedrag,
      bestaande uit 85 procent van de verwachte subsidiabele kosten met een maximum van € 7.225.000;
        - *niet-geologische parameters:* de niet-geologische parameters, genoemd in de tabel in hoofdstuk 1, paragraaf 1.1,
      van het geologisch onderzoek;
        - *puttest:* test van het vermogen van de putten, uitgevoerd en geïnterpreteerd overeenkomstig bijlage B bij
      bijlage 3.4.2;
        - *restwaarde:* de opbrengst van het project bij de economisch meest rendabele alternatieve toepassing gedurende
      twaalf jaar;
        - *verwachte subsidiabele kosten:* de in de beschikking tot subsidieverlening vermelde subsidiabele kosten;
        - *verwacht vermogen:* het in de beschikking tot subsidieverlening vermelde verwacht vermogen in MW.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0026952
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0026952
  - number: 3.4.2
    text: |-
      1 De minister, in overeenstemming met de Minister van Landbouw, Natuur en Voedselkwaliteit, verstrekt op aanvraag
      een subsidie aan degene die in Nederland een aardwarmteproject uitvoert.

      2 De subsidie wordt verstrekt onder de opschortende voorwaarde dat op het beoogde stratigrafische niveau op
      de beoogde locatie en bij de in de beschikking tot subsidieverlening vermelde niet-geologische parameters, het
      gerealiseerd vermogen lager is dan het verwacht vermogen.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.4.2
  - number: 3.4.3
    text: |-
      1 De subsidie bedraagt maximaal € 7.225.000 per project. Indien verscheidene aanvragen worden gedaan die betrekking
      hebben op hetzelfde project en die tezamen een subsidiebedrag van meer dan € 7.225.000 betreffen, of indien het
      totale subsidiebedrag voor de deelnemers van een samenwerkingsverband meer bedraagt dan € 7.225.000, wordt het
      meerdere naar rato in mindering gebracht op de aan de betrokken aanvragers te verstrekken subsidie.

      2 Indien de bij de aanvraag om subsidie opgegeven subsidiabele kosten per MW vermogen lager zijn dan € 1.200.000
      wordt het vermogen in de beschikking tot subsidieverlening zodanig verlaagd dat de verwachte subsidiabele kosten
      per MW verwacht vermogen € 1.200.000 bedragen.

      3 Het subsidiebedrag wordt zodanig verminderd, dat de som van de volgende bedragen niet meer dan 95 procent van de
      gerealiseerde subsidiabele kosten bedraagt:

        - het subsidiebedrag,
        - het bedrag aan overige voor het betreffende project aan de subsidie-ontvanger verleende dan wel vastgestelde
      subsidies, en
        - het bedrag waarop de subsidie-ontvanger voor het betreffende project op grond van een private verzekering
      aanspraak kan doen.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.4.3
  - number: 3.4.4
    text: |-
      1 Indien het gerealiseerde vermogen van de eerste boring gelijk aan of meer dan 75% van het verwacht vermogen is,
      vervalt de subsidie indien de subsidie-ontvanger het aardwarmteproject staakt na de eerste boring.

      2 Indien het gerealiseerd vermogen van de eerste boring meer dan een derde van het verwacht vermogen is en de
      subsidie-ontvanger het aardwarmteproject voltooit, is [artikel 3.4.6][ref1] van toepassing of, bij een verwacht
      vermogen groter dan 7 5/60 MW en verwachte subsidiabele kosten van meer dan € 8.500.000, [artikel 3.4.7][ref2].

      3 Indien het gerealiseerd vermogen van de eerste boring meer dan een derde, maar minder dan 75% van het verwacht
      vermogen is en de subsidie-ontvanger het aardwarmteproject na de eerste boring staakt, is [artikel 3.4.5][ref3]
      van toepassing.

      4 Indien het gerealiseerd vermogen van de eerste boring een derde of minder van het verwacht vermogen is, of lager
      dan 0,75 MW, is [artikel 3.4.5][ref4] van toepassing.

      5 De subsidie-ontvanger staakt het aardwarmteproject op eigen aangifte dan wel door niet binnen een jaar na
      voltooiing van de eerste boring de tweede boring te voltooien.


      [ref1]: https://wetten.overheid.nl/BWBR0026952#Artikel3.4.6
      [ref2]: https://wetten.overheid.nl/BWBR0026952#Artikel3.4.7
      [ref3]: https://wetten.overheid.nl/BWBR0026952#Artikel3.4.5
      [ref4]: https://wetten.overheid.nl/BWBR0026952#Artikel3.4.5
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.4.4
