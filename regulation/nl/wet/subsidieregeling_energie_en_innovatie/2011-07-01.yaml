  - number: 3.8.13
    text: |-
      1 De minister beslist afwijzend op een aanvraag om subsidie indien niet aannemelijk is gemaakt dat de industriële
      onderneming die de restwarmte levert, geen rendabele mogelijkheden heeft om diezelfde restwarmte binnen de interne
      processen te benutten.

      2 De minister beslist afwijzend op een aanvraag om subsidie indien:

      a. de industriële onderneming die de restwarmte levert aan de subsidieaanvrager een glastuinbouwbedrijf is;

      b. indien op het bestaande warmtenet waarop hernieuwbare warmte wordt ingevoed uitsluitend glastuinbouwbedrijven
      als afnemers zijn aangesloten.

      3 Geen subsidie wordt verstrekt indien de aanvragersubsidie op grond van
      [artikel 2 van het Besluit stimulering duurzame energieproductie][ref1] heeft aangevraagd of is verleend
      voor een productie-installatie waarmee elektriciteit wordt geproduceerd door verwerking van biomassa en voor
      het invoeden van warmte uit diezelfde installatie op een warmtenet subsidie op grond van deze paragraaf wordt
      aangevraagd of is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel2
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.8.13
    references:
