    text: |-
      1 Een aanvraag wordt niet ingediend dan nadat daarover door de Adviescommissie energiedemonstratieprojecten en
      energietransitie-experimenten aan de aanvrager advies is uitgebracht op basis van een vooraanmelding ontvangen
      vanaf het moment van inwerkingtreding van deze paragraaf tot en met 28 april 2010; vooraanmeldingen moeten zijn
      ontvangen op de genoemde einddatum om 17.00 uur.

      2 De Adviescommissie baseert zich op de afwijzingsgronden, bedoeld in [artikel 3.9.9, eerste lid][ref1], en in
      [artikel 23, onderdelen b tot en met i, van het Kaderbesluit EZ-subsidies][ref2], en de rangschikkingscriteria,
      bedoeld in [artikel 3.9.10][ref3].


