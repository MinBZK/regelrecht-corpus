  - number: 3.6.8
    text: |-
      1 De Adviescommissie demonstratieprojecten vergassing adviseert de minister over de afwijzingsgronden bedoeld in
      [artikel 23, onderdelen e, f en h, van het Kaderbesluit EZ-subsidies][ref1] en de rangschikking, bedoeld in het
      derde lid.

      2 De minister beslist afwijzend op een aanvraag om subsidie als bedoeld in [artikel 3.6.2, tweede lid][ref2],
      indien hij van oordeel is dat het project onvoldoende bijdraagt aan de doelstellingen van de regeling.

      3 De minister rangschikt de aanvragen voor een subsidie als bedoeld in [artikel 3.6.2, tweede lid][ref3], waarop
      niet afwijzend is beslist, hoger naarmate:

      a. het project technologisch en niet-technologisch innovatiever is ten opzichte van de huidige praktijk in
      Nederland;

      b. het project meer bijdraagt aan de verduurzaming van de energiehuishouding in CO reductie of PJ per jaar op
      projectniveau;

      c. het project meer herhalingspotentieel bezit, gebaseerd op kostprijsontwikkeling en marktverwachting;

      d. het samenwerkingsverband van een betere kwaliteit is, de slaagkans van het project groter is en de
      kennisoverdracht een meer structureel onderdeel is van de demonstratie;

      e. een beter plan voorligt voor de opstartfase van de vergasser teneinde de vergassingstechnologie door te
      ontwikkelen tot een continue bedrijfsvoering van ten minste 5000 uur/jaar;

      f. een beter marketingplan voorligt om de vergassingstechnologie uit te rollen in Nederland.

      4 Voor de rangschikking wegen de criteria genoemd in het derde lid even zwaar.


