      2 De subsidieontvanger voltooit het demonstratieproject bioraffinage binnen drie jaar na aanvang van het
      demonstratieproject bioraffinage.

      3 De subsidieontvanger voltooit het pilotproject bioraffinage binnen drie jaar na aanvang van het pilotproject
      bioraffinage.
