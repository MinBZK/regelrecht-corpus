  - number: 3.10.1
    text: |-
      In deze paragraaf wordt verstaan onder:

      − *proeftuinproject intelligente netten:* een demonstratieproject, geheel of nagenoeg geheel bestemd voor het
      vergroten van inzicht in de geschiktheid van toepassing in de praktijk van een innovatief product, proces of
      dienst, of een innovatieve samenwerking, dat een technisch, economisch of maatschappelijk risico inhoudt, dat
      bijdraagt aan doorbraken ten behoeve van de verduurzaming van de Nederlandse energiehuishouding en dat past binnen
      [bijlage 3.10.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026952
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.10.1
    references:
      - id: ref1
        bwb_id: BWBR0026952
  - number: 3.10.2
    text: |-
      De minister verstrekt op aanvraag subsidie aan een deelnemer in een samenwerkingsverband, waarvan een ondernemer
      penvoerder is, die een proeftuinproject intelligente netten uitvoert.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.10.2
  - number: 3.10.3
    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie voor een proeftuinproject intelligente
      netten 40 procent van de subsidiabele kosten, voor zover die kosten betrekking hebben op activiteiten, niet zijnde
      fundamenteel onderzoek, industrieel onderzoek of experimentele ontwikkeling.

      2 Voor andere activiteiten bedraagt de subsidie voor een proeftuinproject intelligente netten:

      a. 50% van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek;

      b. 25% van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling.

      3 Indien de subsidiabele kosten betrekking hebben op een combinatie van industrieel onderzoek en experimentele
      ontwikkeling, bedraagt de subsidie het gewogen gemiddelde van de in het tweede lid genoemde percentages van de
      desbetreffende subsidiabele kosten.

      4 De in het eerste en tweede lid genoemde percentages worden met 10 procentpunten verhoogd, indien de aanvrager een
      MKB-ondernemer is voor zover de subsidiabele kosten worden gemaakt en betaald door de ondernemer.

      5 Indien de subsidieontvanger een ondernemer in de landbouwsector is, is de verhoging, bedoeld in het vierde
      lid, niet van toepassing voor zover de subsidiabele kosten betrekking hebben op investeringen waardoor de
      productiecapaciteit zal toenemen.

      6 Het maximum subsidiebedrag voor een proeftuinproject intelligente netten bedraagt € 4.000.000. Indien
      verscheidene aanvragen worden gedaan die betrekking hebben op hetzelfde project en die tezamen een
      subsidiebedrag van meer dan € 4.000.000 betreffen, of indien het totale subsidiebedrag voor de deelnemers van een
      samenwerkingsverband meer bedraagt dan € 4.000.000, wordt het meerdere naar rato in mindering gebracht op de aan de
      betrokken aanvragers te verstrekken subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0026689
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.10.3
