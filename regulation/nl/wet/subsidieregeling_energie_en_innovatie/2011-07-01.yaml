    text: |-
      1 De subsidie, bedoeld in [artikel 3.6.2, eerste lid][ref1], bedraagt 50 procent van de subsidiabele kosten, maar
      niet meer dan € 25.000 per project. Indien verscheidene aanvragen worden gedaan die betrekking hebben op hetzelfde
      project en die tezamen een subsidiebedrag van meer dan € 25.000 betreffen, of indien het totale subsidiebedrag voor
      de deelnemers van een samenwerkingsverband meer bedraagt dan € 25.000, wordt het meerdere naar rato in mindering
      gebracht op de aan de betrokken aanvragers te verstrekken subsidie.

      2 De subsidie, bedoeld in [artikel 3.6.2, tweede lid][ref2], bedraagt 40 procent van de subsidiabele kosten,
      maar niet meer dan € 4.000.000 per project. Indien verscheidene aanvragen worden gedaan die betrekking hebben
      op hetzelfde project en die tezamen een subsidiebedrag van meer dan € 4.000.000 betreffen, of indien het totale
      subsidiebedrag voor de deelnemers van een samenwerkingsverband meer bedraagt dan € 4.000.000, wordt het meerdere
      naar rato in mindering gebracht op de aan de betrokken aanvragers te verstrekken subsidie.

      3 Het in het tweede lid genoemde percentage wordt met 10 procentpunten verhoogd voor iedere aanvrager die een
      kleine of middelgrote onderneming in stand houdt, voor zover de subsidiabele kosten worden gemaakt en betaald door
      die ondernemer.

      4 Voor de berekening van de subsidiabele kosten van een demonstratieproject vergassing is
      [artikel 14a van het Kaderbesluit EZ-subsidies][ref3] van toepassing.


