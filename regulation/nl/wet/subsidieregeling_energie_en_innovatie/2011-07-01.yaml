  - number: 3.1.5
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.1.5
  - number: 3.1.6
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien:

      a. hij het onaannemelijk acht dat de aanvrager binnen zes maanden na de datum van de beschikking tot
      subsidieverlening opdracht zal geven tot uitvoering van de duurzame warmtemaatregel;

      b. de aanvrager vóór 1 september 2008 ter zake van de duurzame warmtemaatregel waarop de aanvraag betrekking heeft,
      verplichtingen is aangegaan;

      c. het project gericht is op de aanpassing aan van toepassing zijnde, of vastgestelde maar nog niet van toepassing
      zijnde, communautaire normen,

      d. het project gericht is op de aanpassing aan nationale normen die gelijk zijn aan of minder zware eisen stellen
      dan communautaire normen, of

      e. het project gericht is op de aanpassing aan nationale normen bij afwezigheid van communautaire normen, indien de
      aanpassing heeft plaatsgevonden na de op de in de nationale norm vastgestelde uiterste datum.

      2 De afwijzingsgrond, genoemd in [artikel 23, onderdeel d, van het Kaderbesluit EZ-subsidies][ref1], is niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.1.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.1.7
    text: |-
      1 De subsidie-ontvanger geeft binnen zes maanden na de datum van de beschikking tot subsidieverlening opdracht tot
      uitvoering van de duurzame warmtemaatregel.

      2 Indien de subsidie-ontvanger een eigenaar-bewoner is, voltooit deze de duurzame warmtemaatregel uiterlijk twaalf
      maanden na de datum van de beschikking tot subsidieverlening.

      3 Indien de subsidie-ontvanger een eigenaar-verhuurder is, voltooit deze de duurzame warmtemaatregel uiterlijk
      achttien maanden na de datum van de beschikking tot subsidieverlening.

      4 De verplichtingen, genoemd in de [artikelen 36 tot en met 41 van het Kaderbesluit EZ-subsidies][ref1], zijn niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel36
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.1.7
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '36'
  - number: 3.1.8
    text: |-
      In afwijking van [artikel 45 tot en met 47 van het Kaderbesluit EZ-subsidies][ref1] wordt geen voorschot verstrekt
      bij een aanvraag om subsidie met een totaalbedrag van minder dan € 50.000.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel45
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.1.8
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '45'
  - number: 3.1.9
    text: |-
      Het formulier voor het indienen van een aanvraag om een subsidie en om een subsidievaststelling is opgenomen in
      [bijlage 3.1.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026952
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.1.9
    references:
      - id: ref1
        bwb_id: BWBR0026952
  - number: 3.2.1
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *keten voor biomassa:* de productie, de verwerking en de import van in het buitenland geproduceerde biomassa die
      leidt tot de toepassing van biomassa voor energie-, transport- of chemiedoeleinden in Nederland;
        - *primaire landbouwproducent:* onderneming van de landbouwproductiesector in de zin van artikel 2, eerste
      lid, van [verordening (EG) nr. 1535/2007](32007R1535) van de Commissie van de Europese Gemeenschappen van 20
      december 2007 betreffende de toepassing van de artikelen 87 en 88 van het EG-Verdrag op de-minimissteun in de
      landbouwproductiesector;
        - *Toetsingskader voor duurzame biomassa:* het toetsingskader opgesteld door de projectgroep Duurzame productie
      van biomassa.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.2.1
  - number: 3.2.2
    text: |-
      1 De minister verstrekt op aanvraag een subsidie voor activiteiten die op innovatieve wijze bijdragen aan het
      verduurzamen van ketens voor biomassa.

      2 Onder het verduurzamen van ketens voor biomassa bedoeld in het eerste lid wordt verstaan:

      a. het verduurzamen van de biomassaketen aan de hand van het Toetsingskader voor duurzame biomassa;

      b. de certificering van duurzame biomassaketens; of

      c. het tegengaan van ongewenste indirecte effecten van biomassaproductie.

      3 Subsidie kan ook worden verstrekt aan een niet in Nederland gevestigde deelnemer in een samenwerkingsverband
      waarvan de penvoerder in Nederland is gevestigd.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.2.2
  - number: 3.2.3
    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie:

      a. 50 procent van de subsidiabele kosten indien de subsidie-ontvanger een ondernemer is;

      b. 75 procent van de subsidiabele kosten indien de subsidie-ontvanger geen ondernemer is.

      2 De subsidie bedraagt maximaal:

      a. € 500.000 per ondernemer, niet zijnde een binnen de Europese Unie gevestigde primaire landbouwproducent;

      b. € 7.500 per binnen de Europese Unie gevestigde primaire landbouwproducent.

      3 In aanvulling op het tweede lid wordt, indien verscheidene aanvragen worden gedaan die betrekking hebben op
      hetzelfde project en die tezamen een subsidiebedrag van meer dan € 1.000.000 betreffen, of indien het totale
      subsidiebedrag voor de deelnemers van het samenwerkingsverband meer bedraagt dan € 1.000.000 het meerdere naar rato
      in mindering gebracht op de aan de betrokken aanvragers te verstrekken subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0026689
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0026689
  - number: 3.2.4
    text: |-
      1 Voor subsidie komen in aanmerking de kosten die noodzakelijk zijn voor de verduurzaming van ketens voor biomassa.

      2 In afwijking van [artikel 11, eerste lid, van het Kaderbesluit EZ-subsidies][ref1] kiest een buiten Nederland
      gevestigde aanvrager voor de berekening van de subsidiabele kosten uit:

      a. de integrale kostensystematiek, opgenomen in [artikel 12 van het Kaderbesluit EZ-subsidies][ref2] of

      b. de loonkosten plus vaste-opslag-systematiek, opgenomen in [artikel 13 van het Kaderbesluit EZ-subsidies][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel13
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.2.4
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0024796
        artikel: '13'
  - number: 3.2.5
    text: |-
      1 De subsidie voor een binnen de Europese Unie gevestigde subsidie-ontvanger, niet zijnde een primaire
      landbouwproducent, valt onder de Tijdelijke communautaire kaderregeling inzake staatssteun ter stimulering van de
      toegang tot financiering in de huidige financiële en economische crisis van 17 december 2008. Het bedrag van de
      subsidie wordt verlaagd voor zover dit nodig is op basis van deze kaderregeling.

      2 De subsidie voor een binnen de Europese Unie gevestigde primaire landbouwproducent valt onder [verordening (EG)
      nr. 1535/2007](32007R1535) van de Commissie van de Europese Gemeenschappen van 20 december 2007 betreffende de
      toepassing van de artikelen 87 en 88 van het EG-Verdrag op de-minimissteun in de landbouwproductiesector. Het
      bedrag van de subsidie wordt verlaagd voor zover dit nodig is op basis van deze verordening.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.2.5
  - number: 3.2.6
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.2.6
  - number: 3.2.7
    text: |-
      1 Indien de aanvraag betrekking heeft op activiteiten die betrekking hebben op vloeibare biomassa of
      biobrandstoffen beslist de minister afwijzend op een aanvraag indien onvoldoende vertrouwen bestaat dat de
      vloeibare biomassa of biobrandstoffen voldoen, of na uitvoering van de activiteiten zullen voldoen, aan de
      duurzaamheidscriteria genoemd in artikel 17 van [Richtlijn 2009/28/EG](32009L0028) van het Europees Parlement en de
      Raad ter bevordering van het gebruik van energie uit hernieuwbare bronnen en houdende wijziging en intrekking van
      [Richtlijnen 2001/77/EG](32001L0077) en [2003/30/EG](32003L0030).

      2 De minister beslist afwijzend op een aanvraag indien het project gericht is op:

      a. de aanpassing aan van toepassing zijnde, of vastgestelde maar nog niet van toepassing zijnde, communautaire
      normen,

      b. de aanpassing aan nationale normen die gelijk zijn aan of minder zware eisen stellen dan communautaire normen of

      c. de aanpassing aan nationale normen bij afwezigheid van communautaire normen, indien de aanpassing heeft
      plaatsgevonden na de op de in de nationale norm vastgestelde uiterste datum.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.2.7
  - number: 3.2.8
    text: |-
      1 De minister rangschikt de aanvragen waarop niet afwijzend is beslist, zodanig dat een project hoger gerangschikt
      wordt naarmate het meer bijdraagt aan de doelstellingen bedoeld in [artikel 3.2.2][ref1]. Bij de rangschikking
      worden de volgende criteria gehanteerd:

      a. de mate waarin het project bijdraagt aan de doelstellingen bedoeld in [artikel 3.2.2][ref2], in relatie tot de
      totale subsidiabele kosten van het project;

      b. de mate waarin het project bijdraagt aan verduurzaming van ketens voor biomassa in de zin van
      [artikel 3.2.2, tweede lid][ref3], in relatie tot de resultaten van de beoordeling van de betreffende biomassaketen
      aan de hand van het Toetsingskader voor duurzame biomassa;

      c. de mate waarin het project in de praktijk navolging kan vinden en kan worden opgeschaald, waarbij ook de
      navolging en opschaling leiden tot toepassing van duurzame biomassa in Nederland.

      2 Voor de rangschikking wegen de in het eerste lid genoemde criteria even zwaar.


      [ref1]: https://wetten.overheid.nl/BWBR0026952#Artikel3.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0026952#Artikel3.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0026952#Artikel3.2.2
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.2.8
