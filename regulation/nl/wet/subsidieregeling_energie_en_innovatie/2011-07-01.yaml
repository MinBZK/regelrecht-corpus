  - number: 3.5.10
    text: |-
      1 De Minister van LNV beslist afwijzend op een aanvraag voor zover hij van oordeel is dat anders zou worden
      gehandeld in strijd met de algemene groepsvrijstellingsverordening.

      2 De Minister van LNV rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate:

      a. het demonstratieproject bioraffinage of het pilotproject bioraffinage meer bijdraagt aan de ontwikkeling en
      demonstratie van bioraffinagefaciliteiten, die leiden tot meerdere vermarktbare producten;

      b. het demonstratieproject bioraffinage of het pilotproject bioraffinage meer bijdraagt aan een verduurzaming van
      de grondstofvoorziening voor de industrie (bijv. chemische) en de energiesector;

      c. het demonstratieproject bioraffinage of het pilotproject bioraffinage meer herhalings- en opschalingspotentieel
      bezit, gebaseerd op kostprijsontwikkeling en marktverwachting;

      d. het demonstratieproject bioraffinage of het pilotproject bioraffinage technologisch innovatiever is ten opzichte
      van de huidige nationale en internationale praktijk.

      3 Voor de rangschikking weegt het in het tweede lid, onderdeel a, genoemde criterium mee voor 35/100, het in het
      tweede lid, onderdeel b, genoemde criterium voor 30/100, het in het tweede lid, onderdeel c, genoemde criterium
      voor 20/100 en het in het tweede lid, onderdeel d, genoemde criterium voor 15/100. Er geldt een drempel van 60 van
      de 100 punten.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.5.10
  - number: 3.5.11
    text: |-
      Op een subsidie voor een demonstratieproject bioraffinage zijn niet van toepassing de
      [artikelen 38, eerste lid, onderdelen b tot en met d][ref1], en [41 van het Kaderbesluit EZ-subsidies][ref2].


