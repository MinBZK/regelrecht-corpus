  - number: 2.3.11
    text: |-
      Het formulier voor het indienen van een aanvraag voor:

      a. een subsidie is opgenomen in [bijlage 2.1.2][ref1],

      b. een subsidievaststelling is opgenomen in [bijlage 2.1.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0026952
      [ref2]: https://wetten.overheid.nl/BWBR0026952
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel2.3.11
    references:
      - id: ref1
        bwb_id: BWBR0026952
      - id: ref2
        bwb_id: BWBR0026952
  - number: 3.1.1
    text: |-
      1 In deze paragraaf wordt verstaan onder:

        - *bestaande woning:* een ruimte met een woonfunctie, die is opgeleverd en in gebruik genomen voor 1 januari 2008;
        - *duurzame warmtemaatregel:* het aanschaffen, installeren en in gebruik nemen van een of meer nieuwe dan wel niet
      eerder gebruikte in [bijlage 3.1.1][ref1] bij deze regeling genoemde technische voorzieningen in een bestaande
      woning;
        - *installatie voor micro-warmtekrachtkoppeling:* een installatie voor micro-warmtekrachtkoppeling als bedoeld in
      [bijlage 3.1.1, onderdeel 4][ref2];
        - *lucht/waterwarmtepomp:* een lucht/waterwarmtepomp als bedoeld in [bijlage 3.1.1, onderdeel 3][ref3];
        - *warmtepomp, niet zijnde een lucht/waterwarmtepomp:* een warmtepomp, niet zijnde een lucht/waterwarmtepomp als
      bedoeld in [bijlage 3.1.1, onderdeel 2][ref4];
        - *zonneboiler:* een zonneboiler als bedoeld in [bijlage 3.1.1, onderdeel 1][ref5].

      2 Met de voorzieningen genoemd in [bijlage 3.1.1][ref6] worden gelijkgesteld de desbetreffende voorzieningen die
      rechtmatig zijn vervaardigd of in de handel zijn gebracht in een andere lidstaat van de Europese Unie dan wel
      rechtmatig zijn vervaardigd of in de handel zijn gebracht in een staat, niet zijnde een lidstaat van de Europese
      Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, en die voldoen
      aan eisen die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met de nationale
      eisen wordt nagestreefd.


      [ref1]: https://wetten.overheid.nl/BWBR0026952
      [ref2]: https://wetten.overheid.nl/BWBR0026952
      [ref3]: https://wetten.overheid.nl/BWBR0026952
      [ref4]: https://wetten.overheid.nl/BWBR0026952
      [ref5]: https://wetten.overheid.nl/BWBR0026952
      [ref6]: https://wetten.overheid.nl/BWBR0026952
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0026952
      - id: ref2
        bwb_id: BWBR0026952
      - id: ref3
