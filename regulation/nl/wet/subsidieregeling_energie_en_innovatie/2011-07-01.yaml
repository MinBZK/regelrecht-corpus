  - number: 3.9.9
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien:

      a. het pilotproject vergistingketen of het demonstratieproject vergistingketen betrekking heeft op het telen of
      kweken van biomassa;

      b. het pilotproject vergistingketen of het demonstratieproject vergistingketen betrekking heeft op
      omzettingstechnologie van hernieuwbaar gas naar elektriciteit en warmte.

      2 De termijn, bedoeld in [artikel 23, onderdeel c, van het Kaderbesluit EZ-subsidies][ref1] is:

      a. voor een pilotproject vergistingketen drie jaar;

      b. voor een demonstratieproject vergistingketen drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.9.9
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.9.10
    text: |-
      1 De minister rangschikt de aanvragen waarop niet afwijzend is beslist, zodanig dat een pilotproject
      vergistingketen onderscheidenlijk een demonstratieproject vergistingketen hoger gerangschikt wordt naarmate het
      meer bijdraagt aan de criteria omtrent:

      a. economisch perspectief;

      b. duurzaamheid;

      c. technologische of sociale innovatie;

      d. samenwerking en kennisoverdracht.

      2 Als criteria voor economisch perspectief, duurzaamheid, technologische of sociale innovatie en samenwerking en
      kennisoverdracht als bedoeld in het eerste lid, worden vastgesteld:

      a. economisch perspectief: de mate waarin het project bijdraagt aan kostprijsdaling en rentabiliteitsverbetering
      van de vergistingketen of technische belemmeringen wegneemt voor invoeding van hernieuwbaar gas in een gasnet
      of levering aan vulstations en economische meerwaarde creëert in Nederland, gebaseerd op het opschalings- en
      herhaalpotentieel, gelet op kostprijsontwikkeling, vooruitzichten voor opbrengsten en marktverwachting;

      b. duurzaamheid: de mate waarin het project bijdraagt aan de verbetering van de broeikasgasbalans in CO-
      equivalenten en de verduurzaming van de energiehuishouding in absolute en relatieve CO-reductie of PJ per jaar op
      projectniveau en in absolute CO-reductie of PJ voor Nederland, gebaseerd op het opschalings- en herhaalpotentieel,
      gelet op kostprijsontwikkeling, vooruitzichten voor opbrengsten en marktverwachting;

      c. technische of sociale innovatie: de mate waarin het pilotproject vergistingketen technisch of sociaal
      innovatiever is ten opzichte van de huidige nationale en internationale praktijk of het demonstratieproject
      vergistingketen technisch of sociaal innovatiever is ten opzichte van de huidige nationale praktijk;

      d. samenwerking en kennisoverdracht: de mate van doelmatigheid en doeltreffendheid van een eventueel
      samenwerkingsverband en de expertise van de partijen die het project uitvoeren en de mate waarin kennisoverdracht
      een meer structureel onderdeel is van het project.

      3 Voor de rangschikking weegt het criterium, genoemd in onderdeel a van het eerste lid, mee voor 35/100, het
      criterium, genoemd in onderdeel b van het eerste lid, voor 25/100, het criterium, genoemd in onderdeel c van het
      eerste lid, voor 25/100, en het criterium, genoemd in onderdeel d van het eerste lid, voor 15/100.

      4 Geen subsidie wordt verleend indien een pilotproject vergistingketen of een demonstratieproject vergistingketen
      minder dan 70 van de 100 punten worden toegekend.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.9.10
  - number: 3.9.11
    text: |-
      1 De subsidieontvanger voltooit het pilotproject vergistingketen uiterlijk drie jaar na de datum van de beschikking
      tot subsidieverlening.

      2 De subsidieontvanger voltooit het demonstratieproject vergistingketen uiterlijk drie jaar na de datum van de
      beschikking tot subsidieverlening.

      3 De subsidieontvanger voert het pilotproject vergistingketen of het demonstratieproject vergistingketen
      hoofdzakelijk in Nederland uit, behoudens voorafgaande schriftelijke ontheffing van de minister voor gedeeltelijke
      uitvoering buiten Nederland.

      4 De subsidieontvanger verleent medewerking aan evaluatie van de effecten van het door hem uitgevoerde
      pilotproject vergistingketen of demonstratieproject vergistingketen, voor zover deze medewerking redelijkerwijs
      van hem kan worden verlengd. Deze verplichting geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.9.11
  - number: 3.9.12
    text: |-
      1 Het formulier voor het indienen van een aanvraag voor:

      a. een subsidie is opgenomen in [bijlage 3.9.1][ref1];

      b. een subsidievaststelling is opgenomen in [bijlage 2.1.3][ref2].

      2 Het formulier voor het indienen van een vooraanmelding is opgenomen in [bijlage 3.9.3][ref3].


