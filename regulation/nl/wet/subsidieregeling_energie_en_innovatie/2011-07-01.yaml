  - number: 3.7.6
    text: |-
      1 De termijn, bedoeld in [artikel 23, onderdeel c, van het Kaderbesluit EZ-subsidies][ref1], is vier jaar.

      2 De minister rangschikt de aanvragen waarop niet afwijzend is beslist, zodanig dat een project hoger gerangschikt
      wordt naarmate het meer bijdraagt aan de criteria omtrent:

      a. technologische innovatie;

      b. duurzaamheid;

      c. technologische samenwerking;

      d. economisch perspectief.

      3 Als criteria voor technologische innovatie, duurzaamheid, technologische samenwerking en economisch perspectief
      als bedoeld in het tweede lid worden respectievelijk vastgesteld:

      a. de mate waarin wordt bijgedragen aan technologische vernieuwing of aan wezenlijk nieuwe toepassingen
      van bestaande technologieën, met name gericht op offshore windturbine ontwikkelingen en daarbij behorende
      ondersteuningsconstructies;

      b. de mate waarin wordt bijgedragen aan verduurzaming van de energiehuishouding, met name in Nederland, in vermeden
      PJ’s of vermeden CO-emissies in 2020 en in 2025;

      c. de mate van doelmatigheid en doeltreffendheid van een eventueel samenwerkingsverband en de expertise van de
      partijen die het project uitvoeren, waaronder mede verstaan de leveranciers;

      d. de mate waarin de projectresultaten bijdragen aan de kostprijsdaling van windenergie op zee en economische
      meerwaarde creëren in Nederland.

      4 Voor de rangschikking wegen de criteria genoemd in het tweede lid even zwaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.7.6
