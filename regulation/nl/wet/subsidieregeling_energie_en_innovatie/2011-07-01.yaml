articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *demonstratieproject:* een op bescherming van het milieu gericht samenhangend geheel van activiteiten die een
      technisch en economisch risico inhouden, waarbij die activiteiten bestaan uit het door de aanvrager treffen van
      energiebesparende maatregelen of maatregelen die het gebruik van hernieuwbare energiebronnen bevorderen met behulp
      van: 1°. voor Nederland nieuwe apparaten, systemen of technieken, of 2°. een voor Nederland nieuwe toepassing van
      apparaten, systemen of technieken;
        - *duurzame energiehuishouding:* energiehuishouding die economisch efficiënt is, het milieu minder zwaar belast of
      voorziet in beschikbaarheid van energie in voldoende mate en van voldoende kwaliteit;
        - *experimentele ontwikkeling:* experimentele ontwikkeling als bedoeld in paragraaf 2.2, onder g, van de
      Communautaire kaderregeling inzake staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2006/C 323/01 (PbEU
      C 323);
        - *fundamenteel onderzoek:* fundamenteel onderzoek als bedoeld in paragraaf 2.2, onder e, van de Communautaire
      kaderregeling inzake staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2006/C 323/01 (PbEU C 323);
        - *haalbaarheidsstudie:* een samenstel van activiteiten dat leidt tot een schriftelijk rapport met een inschatting
      van de technische en economische mogelijkheden van fundamenteel, industrieel onderzoek of experimentele
      ontwikkeling, of een combinatie van fundamenteel en industrieel onderzoek en experimentele ontwikkeling;
        - *industrieel onderzoek:* industrieel onderzoek als bedoeld in paragraaf 2.2, onderdeel f, van de Communautaire
      kaderregeling inzake staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2006/C 323/01 (PbEU C 323);
        - *kennisinstelling:* 1° een onder a, b, c, f, g of h van de [bijlage van de Wet op het hoger onderwijs en
      wetenschappelijk onderzoek](onbekend) genoemde instelling voor hoger onderwijs, 2° een andere dan onder 1° bedoelde
      geheel of gedeeltelijk door de rijksoverheid gefinancierde onderzoeksorganisatie die activiteiten verricht met
      als doel de algemene wetenschappelijke en technische kennis uit te breiden, 3° een geheel of gedeeltelijk door
      een andere staat gefinancierde openbare instelling voor hoger onderwijs gelijkwaardig aan een instelling als
      bedoeld onder 1°, of 4° een geheel of gedeeltelijk door een andere staat gefinancierde onderzoeksinstelling die
      activiteiten verricht met als doel de algemene wetenschappelijke en technische kennis uit te breiden;
        - *de minister:* de Minister van Economische Zaken;
        - *ondernemer in de landbouwsector:* een ondernemer die activiteiten verricht op het gebied van de productie,
      verwerking en afzet van landbouwproducten als bedoeld in bijlage 1 bij het Verdrag tot oprichting van de Europese
      Gemeenschap, met uitzondering van ondernemers in de visserij- en aquacultuursector en in de bosbouwsector;
        - *referentiekosten:* kosten voor een investering ten behoeve van een in Nederland gangbaar systeem, apparaat of
      techniek die in technisch opzicht vergelijkbaar is met een in Nederland uit te voeren project maar waarmee niet
      hetzelfde niveau van milieubescherming kan worden bereikt als met het uit te voeren project, terwijl, in geval van
      een uit te voeren project voor hernieuwbare energie, de capaciteit voor de opwekking van energie van dat project
      ten minste overeenkomt met die van de eerstbedoelde investering.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel1.1
  - number: '1.2'
    text: |-
      1 Het rapport van feitelijke bevindingen, bedoeld in
      [artikel 12, derde lid, van het Kaderbesluit EZ-subsidies][ref1], wordt opgesteld overeenkomstig het protocol dat
      is opgenomen in [bijlage 1.1][ref2].

      2 Als rapport als bedoeld in [artikel 12, vierde lid, van het Kaderbesluit EZ-subsidies][ref3], wordt aangewezen
      een afschrift van het rapport van feitelijke bevindingen van een externe accountant inzake de actueel gebruikte
      methode voor berekening van de personeelskosten en indirecte kosten dat is opgesteld in

      het kader van [verordening (EG) nr. 1906/2006](32006R1906) van het Europees Parlement en de Raad van de Europese
      Unie van 18 december 2006 tot vaststelling van de regels voor de deelname van ondernemingen, onderzoekscentra en
      universiteiten aan acties op grond van het zevende kaderprogramma, en voor verspreiding van onderzoeksresultaten
      (2007-2013) (PbEU L 391) en, indien de subsidie-ontvanger daarover beschikt, een afschrift van de goedkeuring door
      de Europese Commissie van dat rapport.


