  - number: 3.4.5
    text: |-
      1 De hoogte van de subsidie wordt berekend overeenkomstig de formule:

      subsidiebedrag = 0,85 * (a – b)

      In deze formule betekent:

      a: de gerealiseerde subsidiabele kosten,

      b: de restwaarde.

      De eventuele kosten voor een tweede boring komen niet voor subsidie in aanmerking. Indien de put wordt afgedicht is
      de restwaarde nul. Indien de restwaarde negatief is wordt de restwaarde op nul gesteld.

      2 De subsidie bedraagt ten hoogste 70 procent van het maximale subsidiebedrag.

      3 Indien de formule in het eerste lid een negatieve uitkomst oplevert wordt de subsidie op nul gesteld.

      4 De betaalde premie minus 5,95 procent van de tot en met de eerste boring gerealiseerde subsidiabele kosten wordt
      gerestitueerd.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.4.5
  - number: 3.4.6
    text: |-
      1 De hoogte van de subsidie wordt berekend overeenkomstig de formule:

      subsidiebedrag = 0,85 * a – ((b / c) * d)

      In deze formule betekent:

      a: de gerealiseerde subsidiabele kosten, tot een maximum van de verwachte subsidiabele kosten, en in ieder geval
      niet meer dan € 8.500.000,

      b: het gerealiseerd vermogen in MW,

      c: het verwacht vermogen,

      d: het maximale subsidiebedrag.

      2 De subsidie bedraagt ten hoogste het maximale subsidiebedrag.

      3 Indien de formule in het eerste lid een negatieve uitkomst oplevert wordt de subsidie op nul gesteld.

      4 Indien het gerealiseerd vermogen na de tweede boring lager is dan 0,75 MW wordt de hoogte van de subsidie
      berekend overeenkomstig de formule:

      subsidiebedrag = 0,85 * (a – b)

      In deze formule betekent:

      a. de gerealiseerde subsidiabele kosten,

      b. de restwaarde.

      Indien de putten worden afgedicht is de restwaarde nul. Indien de restwaarde negatief is wordt de restwaarde op
      nul gesteld.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.4.6
  - number: 3.4.7
    text: |-
      1 De hoogte van de subsidie wordt berekend overeenkomstig de formule:

      subsidiebedrag = ((a/b) * c) – ((d/e) * a)

      In deze formule betekent:

      a: het maximale subsidiebedrag,

      b: de verwachte subsidiabele kosten,

      c: de gerealiseerde subsidiabele kosten, tot een maximum van de verwachte subsidiabele kosten,

      d: het gerealiseerde vermogen in MW,

      e: het verwachte vermogen zoals vermeld in de beschikking.

      2 De subsidie bedraagt ten hoogste het maximale subsidiebedrag.

      3 Indien de formule in het eerste lid een negatieve uitkomst oplevert wordt de subsidie op nul gesteld.

      4 Indien het gerealiseerde vermogen na de tweede boring lager is dan 0,75 MW wordt de hoogte van de subsidie
      berekend overeenkomstig de formule:

      subsidiebedrag = (a/b) * (c – d).

      In deze formule betekent:

      a: het maximale subsidiebedrag zoals vermeld in de beschikking,

      b: de verwachte subsidiabele kosten,

      c: de gemaakte subsidiabele kosten,

      d: de restwaarde.

      Indien de putten worden afgedicht is de restwaarde nul. Indien de restwaarde negatief is wordt de restwaarde op
      nul gesteld.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.4.7
  - number: 3.4.8
    text: |-
      1 De [artikelen10 tot en met 14a van het Kaderbesluit EZ-subsidies][ref1] zijn niet van toepassing.

      2 Voor subsidie komen in aanmerking de ondergrondse investeringskosten, bestaande uit:

        - kosten boring productie- en injectieput;
        - kosten op- en afbouwen boorinstallatie;
        - kosten boormanagement en -toezicht;
        - kosten locatie boorgereed maken;
        - cuttings/spoeling afvoeren;
        - kosten puttest en rapportage;
        - kosten onvoorzien.

      3 Voor subsidie komt in aanmerking een vast bedrag van € 500.000 voor het plaatsen van een pompinstallatie of het
      dichten van de put of putten.

      4 Indien het verwacht vermogen 7 5/60 MW of kleiner is bedraagt het totaal van de in het tweede en derde lid
      genoemde subsidiabele kosten maximaal € 8.500.000.

      5 Voor zover kosten uit andere hoofde zijn of worden gesubsidieerd of gefinancierd van overheidswege komen zij niet
      in aanmerking voor subsidie.

      6 Bij de toepassing van [artikel 6, eerste lid, van het Kaderbesluit EZ-subsidies][ref2] blijven buiten
      beschouwing:

      a. de subsidies op grond van:

        - hoofdstuk 2 van [bijlage 2 Marktintroductie energie-innovaties van de Regeling LNV-subsidies][ref3],
        - de Unieke kansen regeling,
        - de Subsidieregeling internationaal innoveren, en
        - hoofdstuk 3 van de Tijdelijke energieregeling markt en innovatie; en

      b. bijdragen van de Commissie van de Europese Gemeenschappen op grond van:

        - het Zevende Kaderprogramma voor activiteiten op het gebied van onderzoek, technologische ontwikkeling en
      demonstratie,
        - het Kaderprogramma voor concurrentievermogen en innovatie,
        - het meerjarenprogramma voor acties op energiegebied: ‘Intelligente energie-Europa’,
        - het financieringsinstrument voor het Milieu: ‘LIFE+’,
        - [Richtlijn 2003/87/EG](32003L0087) van het Europees Parlement en de Raad van de Europese Unie van 13 oktober
      2003 tot vaststelling van een regeling voor de handel in broeikasgasemissierechten binnen de Gemeenschap en tot
      wijziging van [Richtlijn 96/61/EG](31996L0061) van de Raad (Pb EG 2003/L275),
        - [Verordening (EG) nr. 1234/2007](32007R1234) van de Raad van 22 oktober 2007 houdende een gemeenschappelijke
      ordening van de landbouwmarkten en specifieke bepalingen voor een aantal landbouwproducten (Integrale-GMO-
      verordening),
        - het Europees Fonds voor Regionale Ontwikkeling,
        - INTERREG, en
        - de Europese Structuur- en Cohesiefondsen.

      7 Bijdragen van gemeenten en provincies worden aangemerkt als publieke cofinanciering, en blijven bij de toepassing
      van [artikel 6, eerste lid, van het Kaderbesluit EZ-subsidies][ref4] buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0021281
      [ref4]: https://wetten.overheid.nl/BWBR0024796#Artikel6
