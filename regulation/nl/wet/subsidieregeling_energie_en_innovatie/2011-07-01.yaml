  - number: 3.8.2
    text: |-
      De minister verstrekt op aanvraag een subsidie aan een ondernemer die een industriële onderneming in stand houdt
      of een deelnemer in een haalbaarheidsonderzoek-samenwerkingsverband, die een haalbaarheidsonderzoek warmtereductie
      uitvoert.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.8.2
  - number: 3.8.3
    text: |-
      1 De subsidie bedraagt 50 procent van de subsidiabele kosten.

      2 De subsidie bedraagt maximaal € 100.000 per haalbaarheidsonderzoek warmtereductie. Indien sprake is van een
      haalbaarheidsonderzoek-samenwerkingsverband wordt, indien het totale subsidiebedrag meer bedraagt dan € 100.000,
      het meerdere naar rato in mindering gebracht op de aan de betrokken aanvragers te verstrekken subsidie.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.8.3
  - number: 3.8.4
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
