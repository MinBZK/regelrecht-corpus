  - number: 3.4.11
    text: |-
      1 De subsidie-ontvanger betaalt voorafgaand aan de start van het aardwarmteproject een premie van 7 procent van het
      maximale subsidiebedrag.

      2 Bij een verwacht vermogen groter dan 7 5/60 MW en verwachte subsidiabele kosten van meer dan € 8.500.000 bedraagt
      de premie, bedoeld in het eerste lid, € 505.750.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.4.11
  - number: 3.4.12
    text: |-
      1 De subsidie-ontvanger verstrekt de resultaten van de puttest binnen vier weken na de boring van een put.

      2 Het geologisch onderzoek en de puttest worden uitgevoerd door een ISO 9001 gecertificeerde instelling.

      3 De subsidie-ontvanger maakt de resultaten van het geologisch onderzoek en de puttest binnen vier weken na
      voltooiing van het aardwarmteproject openbaar.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.4.12
  - number: 3.4.13
    text: |-
      1 De subsidie-ontvanger start binnen zes maandenna de datum van de beschikking tot subsidieverlening de uitvoering
      van het aardwarmteproject en meldt de datum van aanvang binnen twee dagen na aanvang aan de minister. De minister
      kan op voorafgaand verzoek van de subsidie-ontvanger uitstel verlenen.

      2 Het boorgereed maken van de locatie wordt aangemerkt als start van het aardwarmteproject.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.4.13
  - number: 3.4.14
    text: |-
      1 De subsidie-ontvanger voltooit de aardwarmteboringen uiterlijk twaalf maanden na de datum van aanvang van het
      aardwarmteproject, bedoeld in [artikel 3.4.13, eerste lid][ref1].

      2 De aardwarmteboringen zijn voltooid op het moment dat de productieput en de injectieput zijn geboord en de
      puttesten zijn uitgevoerd.

      3 Indien de subsidie-ontvanger het aardwarmteproject staakt na de eerste boring wordt de aardwarmteboring geacht te
      zijn voltooid op het moment dat de puttest na de eerste boring is uitgevoerd.

      4 De minister kan voor het vertragen, essentieel wijzigen of het stopzetten van activiteiten op voorafgaand verzoek
      van de subsidie-ontvanger ontheffing verlenen van de verplichting, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026952#Artikel3.4.13
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.4.14
