  - number: 3.3.1
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *elektrisch aangedreven warmtepomp, niet zijnde een elektrisch aangedreven lucht/waterwarmtepomp:* een warmtepomp
      met een elektrisch vermogen groter dan zes kW die bestemd is als hoofd- of basisverwarming van een woning en die
      niet primair gericht is op actieve koeling of verwarming van tapwater, waarbij warmte wordt onttrokken aan de
      bodem, het grondwater of het oppervlaktewater;
        - *elektrisch aangedreven lucht/waterwarmtepomp:* een warmtepomp met een elektrisch vermogen groter dan zes kW
      die bestemd is als hoofd- of basisverwarming van een woning is en niet primair gericht is op actieve koeling of
      verwarming van tapwater, waarbij de warmtepomp warmte onttrekt aan de buitenlucht of aan de ventilatielucht van de
      woning en warmte afgeeft met behulp van een warmte-afgiftesysteem met water als distributiemedium;
        - *warmtepomp:* 1°. een elektrisch aangedreven warmtepomp, niet zijnde een elektrisch aangedreven lucht/
      waterwarmtepomp of 2°. een elektrisch aangedreven lucht/waterwarmtepomp.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.3.1
  - number: 3.3.2
    text: |-
      De minister verstrekt op aanvraag een subsidie voor het treffen van technische maatregelen aan een eigenaar van een
      woning die:

      a. voor 1 september 2009 een warmtepomp bezit,

      b. technische maatregelen met betrekking tot de warmtepomp of de elektriciteitsinstallatie van de woning heeft
      getroffen die een verlaging van de capaciteit van de elektriciteitsaansluiting mogelijk maakt en die noodzakelijk
      zijn in verband met het gebruik van de warmtepomp, en

      c. een verzoek om verlaging van de capaciteit van de elektriciteitsaansluiting heeft ingediend bij de regionale
      netbeheerder.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.3.2
  - number: 3.3.3
    text: |-
      Voor subsidie komen in aanmerking de rechtstreeks aan de technische maatregelen, bedoeld in
      [artikel 3.3.2, onderdeel b][ref1], toe te rekenen gemaakte en betaalde kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0026952#Artikel3.3.2
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0026952
        artikel: 3.3.2
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.4
    text: |-
      De subsidie voor het treffen van technische maatregelen als bedoeld in [artikel 3.3.2, onderdeel b][ref1],
      bedraagt:

      a. € 100 indien de subsidiabele kosten € 100 of minder bedragen dan wel indien de aanvrager hiervoor heeft gekozen;

      b. € 200 indien de subsidiabele kosten € 101 tot en met € 300 bedragen;

      c. € 400 indien de subsidiabele kosten meer dan € 300 bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0026952#Artikel3.3.2
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.3.4
    references:
      - id: ref1
        bwb_id: BWBR0026952
        artikel: 3.3.2
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.5
    text: |-
      1 Bij de toepassing van [artikel 6, eerste lid, van het Kaderbesluit EZ-subsidies][ref1] worden buiten
      beschouwing gelaten subsidies op grond van het [Besluit stimulering duurzame energieproductie][ref2] en
      het [Besluit subsidies regionale investeringsprojecten 2000][ref3], en bijdragen van de Commissie van de
      Europese Gemeenschappen op grond van het Zevende Kaderprogramma voor activiteiten op het gebied van onderzoek,
      technologische ontwikkeling en demonstratie.

      2 De [artikelen 10, tweede, derde, vijfde en zesde lid][ref4], en
      [11 tot en met 14 van het Kaderbesluit EZ-subsidies][ref5] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel6
