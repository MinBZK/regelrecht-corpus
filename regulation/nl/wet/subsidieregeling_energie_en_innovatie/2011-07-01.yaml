  - number: 3.8.1
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *datahotel:* een gebouw waarin één of meerdere computerruimtes zijn gehuisvest, met de primaire functie het
      ondersteunen van dataverwerking, dataopslag en datatransport;
        - *glastuinbouwbedrijf:* een bedrijf dat als hoofdactiviteit gewassen teelt onder een permanente opstand van glas
      of kunststof;
        - *haalbaarheidsonderzoek warmtereductie:* een milieustudie waardoor inzicht wordt verschaft in de technische,
      economische en organisatorische haalbaarheid van het zo nuttig mogelijk gebruiken van warmte van een industriële
      onderneming op een bestaande productielocatie, welke studie voldoet aan de vereisten van [bijlage 3.8.1][ref1];
        - *haalbaarheidsonderzoek-samenwerkingsverband:* een samenwerkingsverband waarvan minstens één industriële
      onderneming, zijnde potentiële leverancier van restwarmte, deel uitmaakt;
        - *hernieuwbare warmte:* warmte of koude geproduceerd uit de volgende hernieuwbare, niet-fossiele energiebronnen:
      zonne-energie, geothermische energie, biomassa als bedoeld in de NTA 8003:2008, met uitzondering van biomassa als
      bedoeld in de nummers 500, 550 tot en met 559, 587, 592, stortgas, rioolwaterzuiveringsgas en biogas;
        - *industriële onderneming:* een productief-technisch bedrijf waarbij warmte een belangrijke rol speelt in het
      productieproces, niet zijnde een bedrijf met elektriciteitsopwekking als belangrijkste economische activiteit;
        - *investeringsproject industriële warmtebenutting:* investeringsproject waarbij het nuttig gebruik van restwarmte
      of het nuttiger gebruik van warmte van een andere industriële onderneming of van een datahotel, wordt gerealiseerd
      in het productieproces van de subsidieaanvrager of waarbij hernieuwbare warmte afkomstig van de subsdieaanvrager
      wordt ingevoed in een bestaand warmtenet;
        - *milieustudie:* een studie als bedoeld in artikel 24 van de algemene groepsvrijstellingsverordening;
        - *NTA 8003:* 2008: de Nederlandse Technische Afspraak 8003, Classificatie van biomassa voor energietoepassing,
      uitgegeven door het Nederlands Normalisatie-instituut, zoals deze luidde op 31 december 2008;
        - *nuttig gebruik van warmte:* efficiënt en optimaal gebruik van warmte binnen een industriële onderneming,
      hergebruik van restwarmte of het invoeden van restwarmte in een warmtenet;
        - *restwarmte:* warmte of koude die in de huidige situatie beschikbaar is, maar niet nuttig gebruikt wordt bij
      het productieproces;
        - *warmte/koude:* een vorm van energieoverdracht waarbij de drijvende kracht wordt gevormd door een
      temperatuurverschil;
        - *warmtenet:* een geheel van tot elkaar behorende, met elkaar verbonden leidingen, bijbehorende installaties en
      overige hulpmiddelen dienstbaar aan het transport van warmte, behoudens voor zover deze leidingen, installaties
      en hulpmiddelen zijn gelegen in een gebouw van een producent of van een afnemer en strekken tot toe- of afvoer van
      warmte ten behoeve van dat gebouw.


      [ref1]: https://wetten.overheid.nl/BWBR0026952
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.8.1
    references:
      - id: ref1
