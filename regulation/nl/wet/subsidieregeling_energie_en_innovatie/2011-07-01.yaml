  - number: '1.5'
    text: Deze regeling valt onder de algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel1.5
  - number: '1.6'
    text: |-
      Indien door de minister op grond van deze regeling een subsidie wordt verleend van minder dan € 25.000, wordt de
      subsidie ambtshalve vastgesteld.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel1.6
  - number: 2.1.1
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *lange termijnproject:* een nieuw, planmatig geheel van activiteiten, bestaande uit fundamenteel of industrieel
      onderzoek, of een combinatie van beide, naar een duurzame energiehuishouding, waarvan de onderzoeksresultaten naar
      verwachting niet eerder dan na tien jaar na het tijdstip van subsidieverlening in de markt worden of kunnen worden
      toegepast;
        - *nieuw energieonderzoeksproject:* een nieuw, planmatig geheel van activiteiten, bestaande uit een
      haalbaarheidsstudie, fundamenteel of industrieel onderzoek, of een combinatie van fundamenteel en industrieel
      onderzoek, met betrekking tot een innovatief, niet-conventioneel idee voor energietechniek, dat een duurzame
      energiehuishouding stimuleert, dat kan leiden tot een nieuw onderzoeksgebied of een nieuwe richting binnen een
      bestaand onderzoeksgebied en dat een hoge technologische risicograad heeft.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel2.1.1
  - number: 2.1.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan:

      a. een ondernemer of een kennisinstelling die een lange termijnproject uitvoert dat past in een speerpunt;

      b. een deelnemer in een samenwerkingsverband zonder Energieonderzoek Centrum Nederland die een lange termijnproject
      uitvoert dat past in een speerpunt;

      c. een deelnemer in een samenwerkingsverband met Energieonderzoek Centrum Nederland die een lange termijnproject
      uitvoert dat past in een speerpunt;

      d. degene die een nieuw energieonderzoeksproject uitvoert;

      e. een deelnemer in een samenwerkingsverband die een nieuw energieonderzoeksproject uitvoert.

      2 Onder speerpunten als bedoeld in het eerste lid worden verstaan de speerpunten opgenomen in
      [bijlage 2.1.1][ref1].

      3 Tot een lange termijnproject worden niet gerekend:

      a. activiteiten met betrekking tot sociaaleconomisch onderzoek voor zover de subsidie voor de kosten van deze
      activiteiten 45 procent of meer van de subsidie is;

      b. activiteiten met betrekking tot kernfusie en met betrekking tot nucleair onderzoek.

      4 Tot een nieuw energieonderzoeksproject worden niet gerekend activiteiten met betrekking tot kernfusie en met
      betrekking tot nucleair onderzoek.

      5 De minister verstrekt geen subsidie aan het Energieonderzoek Centrum Nederland voor de uitvoering van een nieuw
      energieonderzoeksproject.


      [ref1]: https://wetten.overheid.nl/BWBR0026952
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0026952
  - number: 2.1.3
    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie voor een lange termijnproject en een
      nieuw energieonderzoeksproject:

      a. 100 procent van de subsidiabele kosten voor zover deze betrekking hebben op fundamenteel onderzoek;

      b. 50 procent van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek.

      2 Indien de subsidiabele kosten betrekking hebben op zowel fundamenteel als industrieel onderzoek, bedraagt de
      subsidie het gewogen gemiddelde van de in het eerste lid genoemde percentages van de desbetreffende subsidiabele
      kosten.

      3 Het in het eerste lid, onderdeel b, genoemde percentage wordt met 10 procentpunten verhoogd, indien de aanvrager
      een MKB-ondernemer is voor zover de subsidiabele kosten worden gemaakt en betaald door de ondernemer. Indien
      subsidie wordt verstrekt aan deelnemers in een samenwerkingsverband is de eerste volzin van overeenkomstige
      toepassing voor zover de subsidiabele kosten worden gemaakt en betaald door een deelnemer die een onderneming is
      als bedoeld in de eerste volzin.

      4 Onverminderd het derde lid wordt het in het percentage, genoemd in het eerste lid, onderdeel b, met 10
      procentpunten verhoogd, indien subsidie wordt verstrekt aan deelnemers in een samenwerkingsverband, indien:

      a. zich onder deze deelnemers ten minste één kennisinstelling en ten minste één ondernemer bevinden, of

      b. ten minste één deelnemer in het samenwerkingsverband in een andere lidstaat van de Europese Unie dan Nederland
      is gevestigd en niet behoort tot een groep van een in Nederland gevestigde deelnemer en deze deelnemer een
      wezenlijke bijdrage levert aan het project.

      5 De subsidie voor een lange termijnproject bedraagt niet meer dan € 1.200.000. Indien verscheidene aanvragen
      worden gedaan die betrekking hebben op hetzelfde project en die tezamen een subsidiebedrag van meer dan
      € 1.200.000 betreffen, of indien het totale subsidiebedrag voor de deelnemers van een samenwerkingsverband meer
      bedraagt dan € 1.200.000, wordt het meerdere naar rato in mindering gebracht op de aan de betrokken aanvragers te
      verstrekken subsidie.

      6 De subsidie voor een nieuw energieonderzoeksproject inzake fundamenteel onderzoek, industrieel onderzoek of een
      combinatie van beide bedraagt niet meer dan € 100.000. Indien verscheidene aanvragen worden gedaan die betrekking
      hebben op hetzelfde project en die tezamen een subsidiebedrag van meer dan € 100.000 betreffen, of indien het
      totale subsidiebedrag voor de deelnemers van een samenwerkingsverband meer bedraagt dan € 100.000, wordt het
      meerdere naar rato in mindering gebracht op de aan de betrokken aanvragers te verstrekken subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0026689
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0026689
  - number: 2.1.4
    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie voor een nieuw
      energieonderzoeksproject:

      a. 100 procent van de subsidiabele kosten voor zover deze betrekking hebben op een haalbaarheidsstudie voorafgaand
      aan fundamenteel onderzoek;

      b. 65 procent van de subsidiabele kosten voor zover deze betrekking hebben op een haalbaarheidsstudie voorafgaand
      aan industrieel onderzoek.

      2 Het percentage, genoemd in het eerste lid, onderdeel b, wordt met 10 procentpunten verhoogd indien de aanvrager
      een MKB-ondernemer is voor zover de subsidiabele kosten worden gemaakt en betaald door de ondernemer.

      3 De subsidie voor een nieuw onderzoeksproject inzake een haalbaarheidsstudie bedraagt niet meer dan € 45.000.
      Indien verscheidene aanvragen worden gedaan die betrekking hebben op hetzelfde project en die tezamen een
      subsidiebedrag van meer dan € 45.000 betreffen, of indien het totale subsidiebedrag voor de deelnemers van een
      samenwerkingsverband meer bedraagt dan € 45.000, wordt het meerdere naar rato in mindering gebracht op de aan de
      betrokken aanvragers te verstrekken subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0026689
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel2.1.4
    references:
