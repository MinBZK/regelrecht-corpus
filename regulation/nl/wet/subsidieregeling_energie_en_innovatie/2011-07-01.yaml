  - number: 2.2.1
    text: |-
      In deze paragraaf wordt verstaan onder een korte termijnproject: een voor Nederland nieuw, planmatig geheel van
      activiteiten, hetzij bestaande uit industrieel onderzoek of experimentele ontwikkeling, of een combinatie van
      beide, hetzij bestaande uit een haalbaarheidsstudie.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel2.2.1
  - number: 2.2.2
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan:

      a. een deelnemer in een samenwerkingsverband die een korte termijnproject uitvoert dat past in een speerpunt, of

      b. een ondernemer die een korte termijnproject, niet zijnde een haalbaarheidsstudie, uitvoert dat past in een
      speerpunt:

      1°. in samenhang met activiteiten die worden uitgevoerd door een of meer andere natuurlijke personen of
      rechtspersonen die niet in Nederland gevestigd zijn en die niet met hem in een groep, commanditaire vennootschap,
      vennootschap onder firma of maatschap zijn verbonden, of

      2°. waarvan een deel van de activiteiten wordt uitbesteed aan andere natuurlijke personen of rechtspersonen, die
      niet met hem in een groep, commanditaire vennootschap, vennootschap onder firma of maatschap zijn verbonden.

      2 Onder speerpunten als bedoeld in het eerste lid worden verstaan de speerpunten opgenomen in
      [bijlage 2.1.1][ref1].

      3 Subsidie kan ook worden verstrekt aan een provincie, gemeente of openbaar lichaam als bedoeld in de
      [Wet gemeenschappelijke regelingen][ref2], indien het een kennisinstelling betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0026952
      [ref2]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0026952
      - id: ref2
        bwb_id: BWBR0003740
  - number: 2.2.3
    text: |-
      1 De penvoerder voor een haalbaarheidsstudie is een MKB-ondernemer.

      2 De penvoerder voor een korte termijnproject bestaande uit industrieel onderzoek of experimentele ontwikkeling is
      een ondernemer.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel2.2.3
  - number: 2.2.4
    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie:

      a. 25 procent van de subsidiabele kosten, indien deze betrekking hebben op experimentele ontwikkeling.

      b. 50 procent van de subsidiabele kosten, indien deze betrekking hebben op industrieel onderzoek.

      2 Indien de subsidiabele kosten betrekking hebben op zowel experimentele ontwikkeling als industrieel onderzoek,
      bedraagt de subsidie het gewogen gemiddelde van de in het eerste en tweede lid genoemde percentages van de
      desbetreffende projectkosten.

      3 De subsidie bedraagt 50 procent van de subsidiabele kosten indien deze betrekking hebben op een
      haalbaarheidsstudie. Indien de haalbaarheidstudie door een ondernemer die geen MKB-ondernemer is en ter
      voorbereiding van activiteiten op het gebied van experimentele ontwikkeling wordt uitgevoerd, bedraagt de subsidie
      40 procent van de subsidiabele kosten.

      4 De in het eerste en tweede lid genoemde percentages worden verhoogd met 10 procentpunten, indien subsidie
      verstrekt wordt aan deelnemers in een samenwerkingsverband voor zover de projectkosten worden gemaakt en betaald
      door een deelnemer die een MKB-ondernemer is.

      5 Onverminderd het vierde lid worden de in het eerste en tweede lid genoemde percentages verhoogd met 10
      procentpunten, indien subsidie verstrekt wordt aan deelnemers in een samenwerkingsverband, indien:

      a. ten minste één deelnemer een kennisinstelling is, of

      b. ten minste één deelnemer in het samenwerkingsverband in een andere lidstaat van de Europese Unie dan Nederland
      is gevestigd en niet behoort tot een groep van een in Nederland gevestigde deelnemer.

      6 De subsidie voor een korte termijnproject inzake experimentele ontwikkeling of industrieel onderzoek bedraagt
      niet meer dan € 1.000.000. Indien verscheidene aanvragen worden gedaan die betrekking hebben op hetzelfde
      project en die tezamen een subsidiebedrag van meer dan € 1.000.000 betreffen, of indien het totale subsidiebedrag
      voor de deelnemers van een samenwerkingsverband meer bedraagt dan € 1.000.000, wordt het meerdere naar rato in
      mindering gebracht op de aan de betrokken aanvragers te verstrekken subsidie.

      7 De subsidie voor een korte termijnproject inzake een haalbaarheidsstudie bedraagt niet meer dan € 50.000.
      Indien verscheidene aanvragen worden gedaan die betrekking hebben op hetzelfde project en die tezamen een
      subsidiebedrag van meer dan € 50.000 betreffen, of indien het totale subsidiebedrag voor de deelnemers van een
      samenwerkingsverband meer bedraagt dan € 50.000, wordt het meerdere naar rato in mindering gebracht op de aan de
      betrokken aanvragers te verstrekken subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0026689
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0026689
