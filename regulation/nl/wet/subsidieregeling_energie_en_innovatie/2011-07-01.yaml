        paragraaf: '3.2'
  - number: 3.2.9
    text: |-
      1 De subsidie-ontvanger voltooit de activiteiten uiterlijk op 30 juni 2013.

      2 Op verzoek van de minister verstrekt de subsidie-ontvanger de verkregen gegevens over de duurzaamheid van
      biomassaproductie, certificering en indirecte effecten.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.2.9
  - number: 3.2.10
    text: |-
      1 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier, opgenomen in [bijlage 3.2.1][ref1].

      2 Een aanvraag om subsidievaststelling wordt ingediend met gebruikmaking van het formulier opgenomen in
      [bijlage 2.1.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0026952
      [ref2]: https://wetten.overheid.nl/BWBR0026952
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.2.10
