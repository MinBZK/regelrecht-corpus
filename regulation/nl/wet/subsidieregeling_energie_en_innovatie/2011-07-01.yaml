  - number: 2.1.8
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel c, van het Kaderbesluit EZ-subsidies][ref1] is:

      a. voor een lange termijnproject vier jaar;

      b. voor een nieuw energieonderzoeksproject bestaande uit fundamenteel onderzoek, industrieel onderzoek of een
      combinatie van beide twee jaar;

      c. voor een nieuw energieonderzoeksproject bestaande uit een haalbaarheidsstudie een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel2.1.8
    references:
