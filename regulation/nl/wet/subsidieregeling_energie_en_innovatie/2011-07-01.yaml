    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel c, van het Kaderbesluit EZ-subsidies][ref1], is voor een
      proeftuinproject intelligente netten drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.10.8
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.10.9
    text: |-
      De minister beslist afwijzend op een aanvraag:

      a. voor zover de te verwachte resultaten onvoldoende bijdrage leveren aan de verduurzaming van de Nederlandse
      energiehuishouding, mede gelet op het herhalingspotentieel;

      b. voor zover het project onvoldoende innovatief is; de internationale stand van de techniek is de referentie;

      c. indien er onvoldoende vertrouwen is in de doelmatigheid en doeltreffendheid van het project;

      d. indien er onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten zijn;

      e. indien de subsidie minder bedraagt dan € 125.000;

      f. indien reeds eerder op grond van deze paragraaf een subsidie is verstrekt voor een soortgelijk project.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.10.9
  - number: 3.10.10
    text: |-
      1 De minister rangschikt aanvragen waarop niet afwijzend is beslist, hoger naarmate het project meer bijdraagt aan
      de criteria omtrent:

      a. innovatie,

      b. duurzaamheid,

      c. projectorganisatie,

      d. economisch perspectief.

      2 Als criteria voor innovatie, duurzaamheid, projectorganisatie en economisch perspectief worden respectievelijk
      vastgesteld:

      a. de mate waarin wordt bijgedragen aan technologische vernieuwing of aan wezenlijk nieuwe toepassingen van
      bestaande technologie, of de mate van vernieuwing in de organisatie van de keten;

      b. de mate waarin wordt bijgedragen aan verduurzaming van de Nederlandse energiehuishouding, mede gelet op het in
      Nederland optredende herhalingspotententieel;

      c. de mate van doelmatigheid en doeltreffendheid van de bij het project betrokken partijen en de mate van kwaliteit
      van de projectorganisatie;

      d. de mate waarin de projectresultaten meer economische waarde creëren voor Nederland, mede gelet op de
      toepassingsmogelijkheden van de projectresultaten.

      3 Geen subsidie wordt verleend voor een proeftuinproject intelligente netten dat lager is gerangschikt dan een
      soortgelijk project.

      4 Voor de rangschikking wegen de criteria genoemd in het eerste lid even zwaar.

      5 Bij de rangschikking van projecten wordt mede rekening gehouden met een evenwichtige spreiding van de te
      subsidiëren projecten over de in [bijlage 3.10.1][ref1] genoemde leereffecten.


      [ref1]: https://wetten.overheid.nl/BWBR0026952
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.10.10
    references:
      - id: ref1
        bwb_id: BWBR0026952
  - number: 3.10.11
    text: |-
      1 De subsidie-ontvanger start binnen zes maanden na de datum van de beschikking tot subsidieverlening de uitvoering
      van het proeftuinproject intelligente netten.

      2 De subsidie-ontvanger draagt zorg voor de openbaarmaking en verspreiding van de resultaten van het project.

      3 De verplichting, bedoeld in het tweede lid, geldt tot vijf jaar na de datum van de beschikking tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.10.11
  - number: 3.10.12
    text: |-
      Het formulier voor het indienen van een aanvraag voor:

      a. een subsidie is opgenomen in [bijlage 3.10.2][ref1];

      b. een subsidievaststelling is opgenomen in [bijlage 3.10.3][ref2].


