        bwb_id: BWBR0024796
        artikel: '23'
  - number: 2.1.9
    text: |-
      1 De minister rangschikt aanvragen om een subsidie voor een lange termijnproject waarop niet afwijzend is beslist,
      hoger naarmate het project meer bijdraagt aan de criteria omtrent een duurzame energiehuishouding of de versterking
      van de kennispositie van Nederland omtrent duurzame energiehuishouding.

      2 Criteria omtrent een duurzame energiehuishouding als bedoeld in het eerste lid zijn:

      a. de mate waarin wordt bijgedragen aan de doelstellingen van het desbetreffende speerpunt;

      b. de mate waarin het project een bijdrage levert aan een technologische doorbraak of innovatie ten opzichte van de
      huidige internationale stand van de techniek;

      c. de mate waarin in het projectplan uitwerking is gegeven aan een strategische visie op het implementatietraject
      van de te verkrijgen onderzoeksresultaten en aan verwachtingen over toekomstige voortzetting van de ingezette
      onderzoekslijn;

      d. de slaagkans van het project.

      3 Criteria omtrent de versterking van de kennispositie van Nederland als bedoeld in het eerste lid zijn:

      a. de mate waarin wordt bijgedragen aan de versterking van kennis, kunde of onderzoeksfaciliteiten in Nederland;

      b. de doelmatigheid waarmee de door het project te verkrijgen kennis, kunde of onderzoeksfaciliteiten zal worden
      verspreid en benut op voet van non-discriminatie en tegen marktvoorwaarden.

      4 Voor de rangschikking weegt het gemiddelde van de in het tweede lid genoemde criteria mee voor 2/3 en het
      gemiddelde van de in het derde lid genoemde criteria voor 1/3.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel2.1.9
  - number: 2.1.10
    text: |-
      1 De minister rangschikt aanvragen om een subsidie voor een nieuw energieonderzoeksproject waarop niet afwijzend is
      beslist, hoger naarmate het project meer bijdraagt aan de criteria omtrent een duurzame energiehuishouding.

      2 Criteria omtrent een duurzame energiehuishouding als bedoeld in het eerste lid zijn:

      a. de mate waarin het betreffende onderzoek niet-conventioneel en nieuw is;

      b. de mate waarin het betreffende onderzoek van belang is voor de verduurzaming van de energiehuishouding;

      c. de mate waarin het project uiteindelijk kan leiden tot een nieuw energieonderzoeksgebied of een nieuwe richting
      binnen een bestaand energieonderzoeksgebied;

      d. de kwaliteit van het project.

      3 Voor de rangschikking weegt:

        - het in het tweede lid, onderdeel a, genoemde criterium mee voor 2/5,
        - het in het tweede lid, onderdeel b, genoemde criterium voor 1/5,
        - het in het tweede lid, onderdeel c, genoemde criterium voor 1/5, en
        - het in het tweede lid, onderdeel d, genoemde criterium voor 1/5.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel2.1.10
  - number: 2.1.11
    text: |-
      1 De subsidie-ontvanger draagt zorg voor de openbaarmaking en verspreiding van de resultaten van het project.

      2 De verplichtingen, bedoeld in het eerste lid, gelden gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel2.1.11
