    text: |-
      In deze paragraaf wordt verstaan onder wind-op-zeeproject: project voor industrieel onderzoek, experimentele
      ontwikkeling of demonstratie op het gebied van ondersteuningsconstructies of op het gebied elektriciteitsopwekking
      op zee door middel van windturbines met een vermogen van ten minste 4 MW, of een combinatie van beide.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.7.1
  - number: 3.7.2
    text: |-
      De minister verstrekt op aanvraag een subsidie aan degene die in Nederland een wind-op-zeeproject uitvoert dat:

        - geschikt is voor gebruik in windparken op zee, en
        - bijdraagt aan kostenreductie van windenergie op zee.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.7.2
  - number: 3.7.3
    text: |-
      1 De subsidie bedraagt maximaal € 4.500.000 per aanvraag.

      2 De subsidie voor demonstratie van nieuwe technieken bedraagt 50 procent van de subsidiabele kosten. Het
      percentage wordt verhoogd met 10 procentpunten voor iedere aanvrager die een middelgrote onderneming in stand houdt
      en met 20 procentpunten voor iedere aanvrager die een kleine onderneming in stand houdt voor zover de subsidiabele
      kosten worden gemaakt en betaald door die ondernemer.

      3 Voor de berekening van de subsidiabele kosten met betrekking tot demonstratie van nieuwe
      technieken is [artikel 14a van het Kaderbesluit EZ-subsidies][ref1] van toepassing. In afwijking
      van [artikel 1.4, derde lid][ref2], maken de aan derden verschuldigde kosten, bedoeld in
      [artikel 14a, tweede lid, onderdeel h, van het Kaderbesluit EZ-subsidies][ref3] ten hoogste 70 procent uit van de
      som van de per kostensoort berekende investeringskosten van het project verminderd met de referentiekosten.

      4 Bij de toepassing van [artikel 6, eerste lid, van het Kaderbesluit EZ-subsidies][ref4] worden buiten
      beschouwing gelaten subsidies op grond van het [Besluit stimulering duurzame energieproductie][ref5] en
      het [Besluit subsidies regionale investeringsprojecten 2000][ref6], en bijdragen van de Commissie van de
      Europese Gemeenschappen op grond van het Zevende Kaderprogramma voor activiteiten op het gebied van onderzoek,
      technologische ontwikkeling en demonstratie.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0026952#Artikel1.4
