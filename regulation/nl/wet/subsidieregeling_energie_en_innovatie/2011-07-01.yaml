      De minister verstrekt op aanvraag subsidie aan een ondernemer die een industriële onderneming in stand houdt voor
      een investeringsproject industriële warmtebenutting.
    url: https://wetten.overheid.nl/BWBR0026952/2011-07-01#Artikel3.8.8
