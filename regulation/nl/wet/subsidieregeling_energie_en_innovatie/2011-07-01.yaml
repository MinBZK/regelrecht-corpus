  - number: 3.4.16
    text: |-
      1 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier, opgenomen in [bijlage 3.4.1][ref1].

      2 Een aanvraag om subsidievaststelling wordt ingediend met gebruikmaking van het formulier, opgenomen in bijlage
      3.4.2.

      3 Geen accountantsverklaring wordt bijgevoegd indien:

      a. bij de aanvraag om een subsidievaststelling geen aanspraak op de subsidie wordt gemaakt; of

      b. het subsidiebedrag waarop bij de aanvraag om een subsidievaststelling aanspraak wordt gemaakt minder dan
      € 125.000 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0026952
