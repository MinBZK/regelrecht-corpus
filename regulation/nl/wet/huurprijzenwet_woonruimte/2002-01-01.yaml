  - number: '32'
    text: |-
      1 De op het tijdstip van inwerkingtreding van deze wet bij een huuradviescommissie als bedoeld in
      [artikel 10, eerste lid, van de Huurwet][ref1] aanhangige

      a. verzoeken als bedoeld in [artikel 11 van de Huurwet][ref2];

      b. aan de rechter uit te brengen rapporten als bedoeld in de [artikelen 13][ref3], [20][ref4] en
      [23a van de Huurwet][ref5];

      c. aan de kantonrechter uit te brengen adviezen als bedoeld in [artikel 28e, tweede lid, van de Huurwet][ref6];

      worden met toepassing van het vóór het tijdstip van inwerkingtreding van deze wet geldende recht behandeld door
      de huurcommissie.

      2 Over door Onze Minister voor het tijdstip van inwerkingtreding van deze wet aan een
      huuradviescommissie, als bedoeld in [artikel 10, eerste lid, van de Huurwet][ref7], of na dat
      tijdstip aan een huurcommissie voor het uitbrengen van advies toegezonden verzoeken, als bedoeld in de
      [artikelen 3, tweede en derde lid, van de Huurwet][ref8] of 3 en 4 van de Wet jaarlijkse huurverhogingen, of over
      voorstellen tot vaststelling of nadere vaststelling van huurprijzen als bedoeld in [artikel 68a van de Woningwet]
      (onbekend), brengt de huurcommissie die in de plaats is getreden van de desbetreffende huuradviescommissie, geen
      advies uit aan Onze Minister, doch doet daarover met toepassing van het voor het tijdstip van inwerkingtreding
      van deze wet geldende recht een uitspraak waarvan de bij het verzoek betrokken partijen afschrift ontvangen. De
      [artikelen 25, zesde en zevende lid][ref9], [27][ref10] en [28][ref11] zijn van toepassing met dien verstande dat
      de kantonrechter beslist met toepassing van het voor het tijdstip van inwerkingtreding van deze wet geldende recht.

      3 De op het tijdstip van inwerkingtreding van deze wet bij een huuradviescommissie als bedoeld in
      [artikel 10, eerste lid, van de Huurwet][ref12] aanhangige verzoeken om een verklaring als bedoeld in
      [artikel 12, tweede lid, van de Huurwet][ref13] te verstrekken, behandelt de huurcommissie, die in de plaats is
      getreden van de desbetreffende huuradviescommissie, zodanig dat zij de gevraagde verklaring niet verstrekt doch,
      met toepassing van het voor dat tijdstip geldende recht, een uitspraak doet over de redelijkheid van de door de
      verhuurder aangeboden nieuwe huurovereenkomst, van welke uitspraak de bij het verzoek betrokken partijen afschrift
      ontvangen. De [artikelen 25, zesde en zevende lid][ref14], [27][ref15] en [28][ref16] zijn van toepassing met dien
      verstande dat de kantonrechter beslist met toepassing van het voor het tijdstip van inwerkingtreding van deze wet
      geldende recht.

      4 Een verklaring door een huuradviescommissie ingevolge [artikel 12, tweede lid, van de Huurwet][ref17]
      voor het tijdstip van inwerkingtreding van deze wet verstrekt, heeft, voorzover zij niet voor
      dat tijdstip is gevolgd door de instelling van een vordering tot ontruiming als bedoeld in
      [artikel 18, tweede lid, onder c, van de Huurwet][ref18], de kracht van een uitspraak als bedoeld in
      [artikel 25][ref19]. De in [artikel 25, zevende lid][ref20], bedoelde termijn vangt in dit geval aan op het
      tijdstip waarop de huurcommissie op verzoek van de verhuurder aan de huurder bij aangetekend schrijven afschrift
      van de verklaring heeft gezonden. De huurcommissie wijst daarbij op de in [artikel 27, eerste lid][ref21],
      bedoelde mogelijkheid om de kantonrechter te verzoeken de huurprijs vast te stellen alsook op de vorm en de termijn
      die daarbij in acht moet worden genomen. De [artikelen 27][ref22] en [28][ref23] zijn van toepassing, met dien
      verstande, dat de kantonrechter beslist met toepassing van het voor het tijdstip van inwerkingtreding van deze wet
      geldende recht.

      5 De door de rechter na het tijdstip van inwerkingtreding van deze wet aan een huurcommissie gevraagde adviezen
      worden, voorzover deze betrekking hebben op in [artikel 34][ref24] bedoelde verzoeken, eveneens met toepassing van
      het voor het tijdstip van inwerkingtreding van deze wet geldende recht behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002066#Artikel10
