  - number: '18'
    text: |-
      1 Indien de verhuurder niet binnen zes weken na een schriftelijke aanzegging van de huurder, waarbij deze gebruik
      kan maken van een door Onze Minister vastgesteld model, de daarin gestelde gebreken aan of tekortkomingen ten
      aanzien van de woonruimte heeft opgeheven, kan de huurder binnen twaalf maanden na het verstrijken van die termijn
      de huurcommissie verzoeken uitspraak te doen over de redelijkheid van de huurprijs, gelet op de ernst waarin de
      gebreken of tekortkomingen het woongenot schaden.

      2 De huurcommissie doet binnen vier maanden na ontvangst van het verzoek met redenen omkleed schriftelijk uitspraak
      omtrent de redelijkheid van de huurprijs, gelet op geconstateerde gebreken aan of tekortkomingen ten aanzien van de
      woonruimte, als aangegeven in de bij of krachtens algemene maatregel van bestuur als bedoeld in [artikel 15][ref1]
      gegeven regelen, zulks naar de toestand op het tijdstip waarop de huurder zijn verzoek bij de huurcommissie heeft
      ingediend.

      3 Indien de huurcommissie van oordeel is dat de overeengekomen huurprijs, gelet op de gebreken aan of
      tekortkomingen ten aanzien van de woonruimte, niet in rekening dient te worden gebracht, geeft zij deze gebreken of
      tekortkomingen in haar uitspraak aan en vermeldt zij daarbij een in verhouding tot die gebreken of tekortkomingen
      lagere huurprijs als de in rekening te brengen huurprijs. Daarbij vormt de huurcommissie slechts een eigen oordeel
      over de gebreken aan of tekortkomingen ten aanzien van de woonruimte voorzover deze aan de verhuurder door middel
      van de in het eerste lid bedoelde schriftelijke aanzegging door de huurder zijn gemeld, alsmede over de gebreken
      of tekortkomingen die van zodanige aard of samenhang zijn dat zij ook zonder aanzegging door de huurder aan de
      verhuurder bekend moesten zijn.

      4 De huurcommissie vermeldt in voorkomend geval in haar uitspraak de datum van ingang van de in rekening te brengen
      lagere huurprijs, zijnde de eerste van de maand, volgende op die waarin het verzoekschrift van de huurder door de
      huurcommissie is ontvangen.

      5 De huurcommissie vermeldt in haar uitspraak de in rekening te brengen huurprijs die zij redelijk acht met
      inachtneming van de bij of krachtens algemene maatregel van bestuur, bedoeld in [artikel 15][ref2], gegeven
      regelen.

      6 De huurcommissie bepaalt in haar uitspraak dat, nadat de in de uitspraak genoemde gebreken of tekortkomingen
      zijn opgeheven, de verlaging van de in rekening te brengen huurprijs niet meer van toepassing is met ingang van de
      eerste dag van de maand, volgende op die waarin de opheffing heeft plaatsgevonden.

      7 Indien ondanks door de huurcommissie geconstateerde gebreken aan of tekortkomingen ten aanzien van de woonruimte
      de huurprijs door de huurcommissie redelijk wordt geacht, omdat de overeengekomen huurprijs gelijk is aan of lager
      is dan de in verhouding tot die gebreken of tekortkomingen ingevolge dit artikel ten laagste in een uitspraak te
      vermelden in rekening te brengen huurprijs, geeft de huurcommissie die gebreken of tekortkomingen in haar uitspraak
      aan, vermeldt de geldende huurprijs als de in rekening te brengen huurprijs en behandelt het verzoek voor het
      overige met overeenkomstige toepassing van het derde lid.

      8 Indien tussen huurder en verhuurder geen overeenstemming bestaat over het al dan niet opgeheven zijn van de
      gebreken of tekortkomingen, doet de huurcommissie daarover op verzoek van de verhuurder binnen vier maanden na
      ontvangst van het verzoek een uitspraak.

      9 [Artikel 17][ref3], derde en zesde tot en met achtste lid, is van overeenkomstige toepassing op de in dit artikel
      bedoelde uitspraken van de huurcommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003221#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0003221#Artikel17
