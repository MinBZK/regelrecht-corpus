preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regelen te stellen met betrekking tot de prijzen
    bij huur en verhuur van woonruimte;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. woonruimte: een gebouwde onroerende zaak die een zelfstandige woning vormt, of een tot bewoning bestemd
      gedeelte van een gebouwde onroerende zaak, dan wel een woonwagen of een standplaats, een en ander met de onroerende
      aanhorigheden;

      b. woonwagen: voor bewoning bestemd gebouw dat is geplaatst op een standplaats en dat in zijn geheel of in delen
      kan worden verplaatst, met uitzondering van wagens die een eigen aandrijving hebben en wagens waarvoor voor het
      voortbewegen ervan over een weg geen ontheffing ingevolge de [Wegenverkeerswet 1994][ref1] van bij of krachtens die
      wet gegeven voorschriften met betrekking tot verkeersregels en verkeerstekens is vereist;

      c. standplaats: een kavel, bestemd voor het plaatsen van een woonwagen, waarop voorzieningen aanwezig zijn die op
      het leidingnet van de openbare nutsbedrijven, andere instellingen of van gemeenten kunnen worden aangesloten.

      d. prijs: het geheel van de verplichtingen, welke de huurder tegenover de verhuurder bij of terzake van huur en
      verhuur van woonruimte op zich neemt;

      e. huurprijs: de prijs welke bij huur en verhuur is verschuldigd voor het enkele gebruik van woonruimte;

      f. huurcommissie: de commissie bedoeld in [artikel 2 van de Wet op de huurcommissies][ref2];

      g. Onze Minister: Onze Minister belast met de zorg voor de volkshuisvesting.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
      [ref2]: https://wetten.overheid.nl/BWBR0003222#Artikel2
