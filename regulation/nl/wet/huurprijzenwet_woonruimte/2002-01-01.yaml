  - number: '19'
    text: |-
      1 Een voorstel tot wijziging van de huurprijs moet ten minste twee maanden vóór de voorgestelde datum van ingang
      van de wijziging schriftelijk worden gedaan en dient te vermelden:

      a. de geldende huurprijs;

      b. het percentage of het bedrag van de wijziging van de huurprijs;

      c. de voorgestelde huurprijs;

      d. de voorgestelde datum van ingang van de voorgestelde huurprijs;

      e. de wijze waarop en het tijdvak waarbinnen de huurder, indien hij bezwaren heeft tegen het voorstel, daarvan kan
      doen blijken alsmede de gevolgen welke deze wet verbindt aan het niet doen blijken van bezwaren;

      f. de wijze waarop de voorgestelde huurprijs is berekend indien het een voorstel tot verhoging van de huurprijs
      betreft waarin als voorgestelde datum van ingang van de voorgestelde huurprijs een datum is vermeld die gelegen
      is in het tijdvak van 1 juli tot en met 30 juni van het daaropvolgende jaar en waarin een verhoging van de
      huurprijs wordt voorgesteld met meer dan het in januari voorafgaand aan die datum van 1 juli in de Staatscourant
      bekendgemaakte percentage waarmee de consumentenprijzen (alle huishoudens) ten opzichte van het aan die
      bekendmaking voorafgaande jaar zijn verhoogd.

      2 Voor het doen van een voorstel tot verhoging van de huurprijs met het in het eerste lid, onder f, bedoelde
      percentage of minder stelt Onze Minister voorzover het woonruimte betreft, welke een zelfstandige woning vormt, een
      model vast waarvan de verhuurder gebruik kan maken.

      3 Voor het doen van een voorstel tot verhoging van de huurprijs met meer dan het in het eerste lid, onder f,
      bedoelde percentage, alsmede voor het doen van een voorstel tot verlaging van de huurprijs dient voorzover het
      woonruimte betreft, welke een zelfstandige woning vormt, gebruik te worden gemaakt van een door Onze Minister vast
      te stellen formulier.

      4 Indien een overeenkomst tot wijziging van de huurprijs tot stand komt naar aanleiding van een voorstel daartoe,
      dat niet voldoet aan het in het eerste lid in de aanhef en onder e, of aan het in het derde lid bepaalde, blijft
      de voordien geldende huurprijs verschuldigd, tenzij blijkt dat degene tot wie het voorstel was gericht door het
      verzuim niet is benadeeld.
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel19
  - number: '20'
    text: |-
      1 Indien de huurder binnen zes weken na het tijdstip waarop de verhoging van de huurprijs blijkens het voorstel
      had moeten ingaan schriftelijk verklaart met een voorstel van de verhuurder tot verhoging van de huurprijs niet
      in te stemmen, kan de verhuurder tot uiterlijk twaalf weken na het tijdstip waarop de verhoging blijkens het
      voorstel had moeten ingaan, de huurcommissie, in welker ressort de woonruimte is gelegen, onder overlegging van een
      afschrift van zijn voorstel en van de verklaring van de huurder, schriftelijk verzoeken uitspraak te doen over de
      redelijkheid van het voorstel.

      2 Indien de huurder niet binnen zes weken na het tijdstip waarop de verhoging van de huurprijs blijkens het
      voorstel had moeten ingaan, aan de verhuurder schriftelijk antwoordt, kan de verhuurder tot uiterlijk twaalf weken
      na het tijdstip waarop de verhoging blijkens het voorstel had moeten ingaan, onder overlegging van een afschrift
      van zijn voorstel aan de huurder, de huurcommissie schriftelijk verzoeken de huurder nogmaals van zijn voorstel
      kennis te geven.

      3 De huurcommissie voldoet zo spoedig mogelijk aan het verzoek, bedoeld in het vorige lid. Zij zendt een afschrift
      van de kennisgeving aan de verhuurder.

      4 Indien de huurder na de kennisgeving bedoeld in het vorige lid met het voorstel tot verhoging van de
      huurprijs niet instemt, kan hij binnen zes weken na verzending van de kennisgeving, bedoeld in het derde lid,
      de huurcommissie schriftelijk met opgave van redenen verzoeken uitspraak te doen over de redelijkheid van het
      voorstel.

      5 Onze Minister bepaalt aan welke voorwaarden de in het eerste lid bedoelde verklaring van de huurder dat hij
      met het voorstel van de verhuurder niet instemt, moet voldoen en welke gegevens daarbij moeten worden verstrekt
      of overgelegd.
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel20
  - number: '21'
    text: |-
      1 De huurder wordt geacht de voorgestelde verhoging van de huurprijs met ingang van de in het voorstel genoemde
      datum van ingang met de verhuurder te zijn overeengekomen indien hij niet binnen zes weken na verzending van de
      in [artikel 20, derde lid][ref1], bedoelde kennisgeving van de huurcommissie het in het vierde lid van dat artikel
      bedoelde verzoek tot de huurcommissie heeft gericht.

      2 Indien de huurder het in [artikel 20, vierde lid][ref2], bedoelde verzoek doet, stelt de huurcommissie de
      verhuurder daarvan onverwijld in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003221#Artikel20
