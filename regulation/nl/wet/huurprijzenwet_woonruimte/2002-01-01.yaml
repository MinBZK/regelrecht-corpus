  - number: '16'
    text: |-
      Onze Minister kan in bijzondere gevallen, op een door hem verzocht of uit eigen beweging uitgebracht advies van de
      huurcommissie, de overeengekomen huurprijs van woonruimte, wijzigen, indien deze aanzienlijk afwijkt van die welke,
      in verhouding tot de kwaliteit van de woonruimte, redelijk is.
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel16
  - number: '17'
    text: |-
      1 De huurder van woonruimte kan tot uiterlijk zes maanden na het tijdstip waarop een door hem met betrekking
      tot die woonruimte voor de eerste maal aangegane overeenkomst van huur en verhuur is ingegaan, de huurcommissie,
      in welker ressort de woonruimte is gelegen, schriftelijk verzoeken uitspraak te doen over de redelijkheid
      van de overeengekomen huurprijs. Als een dergelijk verzoek wordt mede aangemerkt een verzoek ingevolge
      [artikel 3a van de Wet op de huurcommissies][ref1], indien dat verzoek is gedaan binnen de in de eerste volzin
      bedoelde termijn en indien en zodra de voorzitter van de huurcommissie op dat verzoek een verklaring heeft
      afgegeven waaruit blijkt dat de overeengekomen huurprijs hoger is dan de bij de desbetreffende woonruimte behorende
      maximale huurprijsgrens.

      2 De huurcommissie doet binnen vier maanden na ontvangst van het verzoek met redenen omkleed schriftelijk uitspraak
      omtrent de redelijkheid van de overeengekomen huurprijs. Indien zij de overeengekomen huurprijs in verhouding tot
      de kwaliteit van de woonruimte niet redelijk acht, vermeldt zij in haar uitspraak de huurprijs die zij redelijk
      acht.

      3 De huurcommissie kan de in het vorige lid bedoelde termijn met ten hoogste twee maanden verlengen. Zij stelt
      partijen van de duur van de verlenging in kennis.

      4 De huurcommissie beoordeelt de redelijkheid van de overeengekomen huurprijs en, voorzover van toepassing,
      de redelijkheid van de in rekening te brengen huurprijs naar de toestand op het tijdstip van de ingangsdatum
      van de overeenkomst en met inachtneming van de bij of krachtens algemene maatregel van bestuur bedoeld in
      [artikel 15][ref2], gegeven regelen.

      5 Indien de huurcommissie van oordeel is dat de overeengekomen huurprijs of de door haar vermelde redelijke
      huurprijs, gelet op gebreken aan of tekortkomingen ten aanzien van de woonruimte, als aangegeven in de bij of
      krachtens algemene maatregel van bestuur als bedoeld in [artikel 15][ref3] gegeven regelen, niet in rekening dient
      te worden gebracht, geeft zij deze gebreken of tekortkomingen in haar uitspraak aan en vermeldt zij daarbij een
      in verhouding tot die gebreken of tekortkomingen lagere huurprijs als de huurprijs. De huurcommissie kan daarbij
      bepalen dat, nadat de genoemde gebreken of tekortkomingen, blijkens een door haar op verzoek van de verhuurder
      gedane uitspraak, zijn opgeheven, de overeengekomen huurprijs of de door haar vermelde redelijke huurprijs in
      rekening mag worden gebracht met ingang van de eerste van de maand volgende op die waarin de verhuurder de in de
      uitspraak aangegeven gebreken of tekortkomingen heeft opgeheven.

      6 De huurcommissie wijst in haar uitspraak partijen op de in [artikel 27, eerste lid][ref4] bedoelde mogelijkheid
      de kantonrechter te verzoeken de huurprijs vast te stellen, alsook op de vorm en de termijn die daarbij in acht
      moeten worden genomen.

      7 De huurcommissie zendt bij aangetekend schrijven een afschrift van haar uitspraak aan partijen.

      8 Indien geen der partijen binnen twee maanden na verzending van het in het zevende lid bedoelde afschrift tot de
      kantonrechter een met redenen omkleed schriftelijk verzoek richt om de huurprijs vast te stellen, worden partijen
      geacht ten aanzien van de huurprijs te zijn overeengekomen als door de huurcommissie in haar uitspraak is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0003221#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0003221#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0003221#Artikel27
