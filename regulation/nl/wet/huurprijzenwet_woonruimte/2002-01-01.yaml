  - number: '11'
    text: |-
      1 De huurprijs van een woning, die ingevolge [artikel 29 van de Woningwet][ref1] onbewoonbaar wordt verklaard is de
      huurprijs geldend op het tijdstip waarop de onbewoonbaarverklaring onherroepelijk is geworden, doch niet meer dan €
      9,08 per maand.

      2 De krachtens het eerste lid geldende huurprijs is verschuldigd van de eerste dag af volgende op het einde van de
      betalingstermijn, waarin de onbewoonbaarverklaring onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel29
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '29'
  - number: 11a
    text: |-
      1 Indien een overeenkomst van huur en verhuur meer omvat dan het enkele gebruik van woonruimte en partijen bij die
      overeenkomst slechts de hoogte van de prijs en niet die van de huurprijs zijn overeengekomen, kan de huurder de
      huurcommissie, in welker ressort de woonruimte is gelegen, schriftelijk en met redenen omkleed verzoeken uitspraak
      te doen over de vraag of partijen slechts de hoogte van de prijs en niet die van de huurprijs zijn overeengekomen.
      Indien het verzoek niet met redenen is omkleed, stelt de huurcommissie de verzoeker in de gelegenheid het verzuim
      binnen een door haar te bepalen termijn te herstellen.

      2 De huurcommissie doet binnen vier maanden na ontvangst van het verzoek met redenen omkleed schriftelijk
      uitspraak. Indien de huurcommissie van oordeel is dat partijen bij een in het eerste lid bedoelde overeenkomst niet
      slechts de hoogte van de prijs maar die van de huurprijs zijn overeengekomen, spreekt zij uit dat partijen geen
      prijs maar een huurprijs zijn overeengekomen. Indien de huurcommissie van oordeel is dat partijen slechts de hoogte
      van de prijs zijn overeengekomen, spreekt zij als huurprijs uit 55% van de ingevolge deze wet geldende maximale
      huurprijsgrens, behorende bij de kwaliteit van de woonruimte, en spreekt zij als voorschotbedrag terzake van de
      vergoedingen voor het meerdere uit een bedrag van 25 procent van die huurprijs. De huurcommissie wijst in haar
      uitspraak partijen op de in [artikel 14, tweede lid][ref1], bedoelde mogelijkheid de kantonrechter te verzoeken te
      verklaren of partijen slechts de hoogte van de prijs en niet die van de huurprijs zijn overeengekomen, alsook op de
      vorm en de termijn die daarbij in acht moeten worden genomen. De huurcommissie zendt bij aangetekend schrijven een
      afschrift van haar uitspraak aan partijen.

      3 De huurcommissie kan de in de eerste volzin van het tweede lid bedoelde termijn met ten hoogste twee maanden
      verlengen. Zij stelt partijen van de duur van de verlenging in kennis.

      4 Bij de beoordeling van de kwaliteit van de woonruimte neemt de huurcommissie de bij of krachtens algemene
      maatregel van bestuur, bedoeld in [artikel 15][ref2], gegeven regelen in acht.

      5 In een geval als bedoeld in het tweede lid, derde volzin, treden de door de huurcommissie uitgesproken huurprijs
      en het door de huurcommissie uitgesproken voorschotbedrag in de plaats van de overeengekomen prijs met ingang
      van de eerste van de maand, volgende op die waarin het verzoekschrift van de huurder door de huurcommissie is
      ontvangen.

      6 Indien geen der partijen binnen twee maanden na verzending van het in de eerste volzin van het tweede lid
      bedoelde afschrift tot de kantonrechter van de rechtbank van het arrondissement waarin de woonruimte is gelegen,
      een met redenen omkleed schriftelijk verzoek richt om te verklaren of partijen bij een overeenkomst als bedoeld in
      het eerste lid, slechts de hoogte van de prijs en niet die van de huurprijs zijn overeengekomen, worden partijen
      geacht te zijn overeengekomen als door de huurcommissie in haar uitspraak is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003221#Artikel15
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel11a
