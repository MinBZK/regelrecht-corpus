  - number: '3'
    text: |-
      Terzake van huur en verhuur van woonruimte gelden de huurprijzen bij of krachtens deze wet bepaald. Voorzover bij
      of krachtens deze wet geen huurprijzen zijn bepaald, gelden de huurprijzen welke partijen zijn overeengekomen of
      zullen overeenkomen.
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel3
  - number: '4'
    text: |-
      1 De huurprijs van woonruimte kan op verzoek van een der partijen worden gewijzigd met toepassing van het in
      [hoofdstuk III, afdeling 3, van deze wet][ref1] bepaalde:

      a. gedurende het eerste tijdvak van twaalf maanden na de datum van ingang van de overeenkomst van huur en verhuur
      van woonruimte, ten hoogste eenmaal, en

      b. telkens tegen het einde van elkaar opvolgende tijdvakken van twaalf maanden na, hetzij het ingaan van de onder a
      bedoelde wijziging, hetzij, indien een zodanige wijziging niet plaatsvond, de datum van ingang van de overeenkomst.

      2 Een verhoging van de huurprijs krachtens het eerste lid is niet mogelijk, zolang er tussen huurder en verhuurder
      geen overeenstemming is dat de, bij toepassing van [artikel 17, vijfde lid][ref2], of van [artikel 18][ref3],
      geconstateerde gebreken of tekortkomingen ten aanzien van de woonruimte zijn opgeheven.

      3 In afwijking van het in het eerste lid bepaalde kan de huurprijs worden gewijzigd tegen het einde van een tijdvak
      dat evenzoveel korter dan twaalf maanden is, als het daaraan voorafgaande tijdvak langer dan twaalf maanden is
      geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0003221#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0003221#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0003221#Artikel18
