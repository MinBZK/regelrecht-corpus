        bwb_id: BWBR0003221
        artikel: '10'
        hoofdstuk: II
        afdeling: '2'
  - number: '6'
    text: |-
      1 Elk in verband met het tot stand komen van huur en verhuur van woonruimte gemaakt beding, niet de huurprijs
      betreffende, waarbij ten behoeve van een der partijen enig niet redelijk voordeel wordt overeengekomen, is nietig.

      2 Elk in verband met het tot stand komen van huur en verhuur van woonruimte gemaakt beding, waarbij door of
      tegenover een derde enig niet redelijk voordeel wordt overeengekomen, is nietig.

      3 De huurcommissie brengt op verzoek van de huurder of de verhuurder of van beiden met redenen omkleed schriftelijk
      advies uit over de vraag of met een beding als in het eerste of tweede lid bedoeld enig niet redelijk voordeel
      is overeengekomen. Indien zij het overeengekomen voordeel niet redelijk acht, vermeldt zij in haar advies hetgeen
      zij met betrekking tot het onderwerp van het beding redelijk acht. De verzoeker en diens wederpartij ontvangen een
      afschrift van het advies.
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel6
  - number: '10'
    text: |-
      1 De huurprijs van woonruimte, waarin of waaraan gedurende de huurtijd door of vanwege de verhuurder:

      a. ingrepen als bedoeld in [artikel 5, derde lid, van de Wet voorzieningen gehandicapten][ref1] zijn verricht, in
      de kosten waarvan door de gemeente een financiële tegemoetkoming is verleend,

      b. bouwkundige of woontechnische ingrepen zijn verricht, in de kosten waarvan ingevolge enige wettelijke regeling
      een financiële tegemoetkoming is verleend en die uitsluitend geen woonvoorziening of onderdeel daarvan zijn in
      de zin van [artikel 1, eerste lid, onder c, van de Wet voorzieningen gehandicapten][ref2], omdat de kosten het in
      laatstgenoemd onderdeel genoemde bedrag te boven gaan, of

      c. voorzieningen zijn aangebracht, waardoor het woongerief geacht kan worden te zijn gestegen, die niet zijn
      ingrepen als bedoeld onder a of b, is de huurprijs, vermeerderd met een door de huurder en de verhuurder, voordat
      de ingrepen of de voorzieningen tot stand zijn gekomen, overeen te komen bedrag, dat in redelijke verhouding
      staat tot de door de verhuurder bestede kosten van de ingrepen onderscheidenlijk de voorzieningen, met dien
      verstande, dat de nieuwe huurprijs niet hoger mag zijn dan die, welke bij toepassing van de regelen, bedoeld in
      [artikel 15, eerste lid][ref3], als redelijk is aan te merken.

      2 De huurcommissie brengt desverzocht aan de huurder of aan de verhuurder of aan beiden een met redenen omkleed
      schriftelijk advies uit over de vraag welke de betalingsverplichting van de huurder is met betrekking tot de in het
      eerste lid bedoelde huurprijs. De wederpartij van de verzoeker ontvangt afschrift van het advies.


      [ref1]: https://wetten.overheid.nl/BWBR0006169#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006169#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003221#Artikel15
