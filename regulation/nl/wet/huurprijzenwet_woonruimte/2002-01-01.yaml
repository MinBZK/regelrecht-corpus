  - number: '13'
    text: |-
      1 Indien huurder en verhuurder geen overeenstemming hebben kunnen bereiken over de vraag, welke de
      betalingsverplichting van de huurder is met betrekking tot de in [artikel 12, eerste lid][ref1], bedoelde kosten,
      doet de huurcommissie op verzoek van de huurder of de verhuurder met redenen omkleed schriftelijk uitspraak over de
      hierbedoelde betalingsverplichting. De verzoeker en diens wederpartij ontvangen een afschrift van deze uitspraak.

      2 Het in het eerste lid bedoelde verzoek heeft betrekking op niet meer dan één tijdvak van ten hoogste twaalf
      maanden voor elke kostensoort waarop het verzoek betrekking heeft. Het verzoek kan worden gedaan tot uiterlijk twee
      jaar nadat de in [artikel 12, vierde lid][ref2], genoemde termijn ten aanzien van het verstrekken van het overzicht
      is verstreken.

      3 Indien geen der partijen binnen twee maanden na verzending van het in het eerste lid bedoelde afschrift tot de
      kantonrechter een met redenen omkleed schriftelijk verzoek richt om de betalingsverplichting met betrekking tot
      de kosten, bedoeld in [artikel 12, eerste lid][ref3], vast te stellen, worden partijen geacht ten aanzien van deze
      kosten te zijn overeengekomen als door de huurcommissie in haar uitspraak is vermeld.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven voor de beoordeling door de
      huurcommissie van de betalingsverplichting, bedoeld in het eerste lid.


