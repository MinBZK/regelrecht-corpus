  - number: '31'
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet krachtens de [artikelen 12][ref1], [14][ref2], [15][ref3] en
      [16 van het Besluit bijzondere huurprijzen 1954][ref4] (Stb. 1953, 581) verschuldigde tijdelijke verhogingen van de
      huurprijs blijven verschuldigd tot het einde van de in die artikelen genoemde termijn.


