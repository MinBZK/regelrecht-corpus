  - number: '26'
    text: |-
      1 Een ingevolge [artikel 25, zevende lid][ref1], gewijzigde huurprijs mag in rekening worden gebracht met ingang
      van de in het voorstel tot wijziging van de huurprijs vermelde datum of, indien de huurcommissie in haar uitspraak
      over dat voorstel een latere datum heeft vermeld, met ingang van die latere datum.

      2 Een ingevolge [artikel 25a, zevende lid][ref2], gewijzigde huurprijs mag in rekening worden gebracht met ingang
      van de in het voorstel tot wijziging van de huurprijs vermelde datum of, indien de voorzitter in zijn uitspraak
      over dat voorstel een andere datum heeft bepaald, met ingang van die andere datum.


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0003221#Artikel25a
