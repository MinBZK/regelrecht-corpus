  - number: '14'
    text: |-
      1 De huurder en de verhuurder kunnen zich ieder schriftelijk wenden tot de kantonrechter van de rechtbank van
      het arrondissement waarin de woonruimte is gelegen, met het verzoek te verklaren, welke de betalingsverplichting
      van de huurder is met betrekking tot de in [artikel 10, eerste lid][ref1], bedoelde huurprijs of de in
      [artikel 12, eerste lid][ref2], bedoelde kosten.

      2 Voorts kunnen de huurder en de verhuurder zich ieder schriftelijk wenden tot de kantonrechter van de rechtbank
      van het arrondissement waarin de woonruimte is gelegen, met het verzoek te verklaren of partijen bij een
      overeenkomst als bedoeld in [artikel 11a, eerste lid][ref3], slechts de hoogte van de prijs en niet die van de
      huurprijs zijn overeengekomen. Indien de kantonrechter van oordeel is dat partijen slechts de hoogte van de prijs
      en niet die van de huurprijs zijn overeengekomen, stelt hij de huurprijs vast op 55% van de ingevolge deze wet
      geldende maximale huurprijsgrens, behorende bij de kwaliteit van de woonruimte, en stelt hij het voorschotbedrag
      terzake van de vergoedingen voor het meerdere vast op een bedrag van 25 procent van die huurprijs. In een geval
      als bedoeld in de vorige volzin treden de door de kantonrechter vastgestelde huurprijs en het door de kantonrechter
      vastgestelde voorschotbedrag in de plaats van de overeengekomen prijs met ingang van de eerste van de maand,
      volgende op die waarin het verzoekschrift, bedoeld in artikel 11a, eerste lid, van de huurder door de huurcommissie
      is ontvangen. Indien de kantonrechter van oordeel is dat partijen niet slechts de hoogte van de prijs maar die van
      de huurprijs zijn overeengekomen, verklaart hij dat partijen geen prijs maar een huurprijs zijn overeengekomen.

      3 Een afschrift van een advies, als bedoeld in [artikel 10, tweede lid][ref4], of van een uitspraak, als bedoeld in
      [artikel 11a, tweede lid][ref5], dan wel [artikel 13, eerste lid][ref6], wordt bij het verzoek gevoegd.

      4 [Artikel 28, tweede en derde lid][ref7], is van toepassing.


