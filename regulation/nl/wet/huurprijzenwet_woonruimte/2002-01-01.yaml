  - number: 25a
    text: |-
      1 In afwijking van [artikel 25, eerste tot en met vijfde lid][ref1], kan de voorzitter van de huurcommissie
      onmiddellijk nadat het verzoek bedoeld in de [artikelen 20, eerste of vierde lid][ref2], of [23][ref3] is ontvangen
      met redenen omkleed schriftelijk uitspraak doen, indien het verzoek kennelijk niet-ontvankelijk is dan wel de
      met betrekking tot het aan het verzoek ten grondslag liggende voorstel tot wijziging van de huurprijs bestaande
      bezwaren kennelijk ongegrond zijn of dat voorstel kennelijk niet redelijk is. De voorzitter van de huurcommissie
      kan voorts onmiddellijk met redenen omkleed schriftelijk uitspraak doen, indien het verzoek, het daaraan ten
      grondslag liggende voorstel tot wijziging van de huurprijs en de desbetreffende woonruimte, naar zijn oordeel,
      nauwe samenhang vertonen met een ander verzoek, het aan dat verzoek ten grondslag liggende voorstel tot wijziging
      van de huurprijs en de desbetreffende andere woonruimte, omtrent welk verzoek door de huurcommissie reeds een
      uitspraak is gedaan als bedoeld in [artikel 25, eerste lid][ref4], welke uitspraak tevens onherroepelijk is
      geworden ingevolge [artikel 25, zevende lid][ref5]. De toepassing van de eerste en tweede volzin geschiedt met
      inachtneming van de gevolgen die in [artikel 26a][ref6] worden verbonden aan het niet betalen van het voorschot op
      de in dat artikel bedoelde vergoeding.

      2 De in het eerste lid, eerste volzin, bedoelde uitspraak van de voorzitter van de huurcommissie houdt in dat het
      ongewijzigd blijven van de huurprijs redelijk is of dat de wijziging van de huurprijs als in het voorstel vermeld
      redelijk is, alsmede in laatstbedoeld geval de datum van ingang die in dat voorstel is vermeld. De in het eerste
      lid, tweede volzin, bedoelde uitspraak van de voorzitter van de huurcommissie houdt in dat het ongewijzigd blijven
      van de huurprijs redelijk is of dat de wijziging van de huurprijs als in het voorstel vermeld redelijk is, of
      vermeldt de wijziging van de huurprijs die de voorzitter redelijk acht, alsmede in beide laatstbedoelde gevallen
      de datum van ingang van die wijziging, een en ander overeenkomstig de in het eerste lid, tweede volzin, bedoelde
      uitspraak van de huurcommissie. [Artikel 25, zesde lid][ref7], is van overeenkomstige toepassing.

      3 Tegen de uitspraak van de voorzitter van de huurcommissie, bedoeld in het eerste lid, kunnen huurder of
      verhuurder binnen veertien dagen na verzending van het afschrift van die uitspraak schriftelijk en gemotiveerd
      verzet doen bij de huurcommissie. De indiener van het verzetschrift kan daarbij vragen dat hij over zijn verzet
      wordt gehoord.

      4 Alvorens een uitspraak te doen op het verzet, bedoeld in het derde lid, kan de huurcommissie hem die het verzet
      deed in de gelegenheid stellen te worden gehoord. Is de huurcommissie van oordeel dat het verzet ongegrond is,
      dan gaat zij niet tot ongegrondverklaring over dan na de indiener van het verzetschrift die daarom vroeg in de
      gelegenheid te hebben gesteld te worden gehoord.

      5 Is de huurcommissie van oordeel dat het verzet, bedoeld in het derde lid gegrond is, dan vervalt de uitspraak
      van de voorzitter van de huurcommissie, bedoeld in het eerste lid en wordt het aan de in het eerste lid bedoelde
      uitspraak ten grondslag liggende verzoek overeenkomstig [artikel 25][ref8] door de huurcommissie in behandeling
      genomen.

      6 Op de uitspraak op het verzet, bedoeld in het vierde lid, is [artikel 25, zesde lid][ref9], van overeenkomstige
      toepassing.

      7 Indien de huurder of verhuurder niet binnen veertien dagen na verzending van het afschrift van de uitspraak van
      de voorzitter van de huurcommissie, bedoeld in het eerste lid, verzet hebben gedaan als bedoeld in het derde lid,
      worden huurder en verhuurder geacht een wijziging van de huurprijs of een ongewijzigd blijven daarvan te zijn
      overeengekomen als door de voorzitter van de huurcommissie in zijn uitspraak is vermeld. Het in de vorige volzin
      bepaalde is van overeenkomstige toepassing, indien de huurcommissie het verzet niet ontvankelijk dan wel ongegrond
      heeft verklaard en de huurder of verhuurder niet binnen twee maanden na verzending van het afschrift van de daartoe
      strekkende uitspraak van de huurcommissie, de kantonrechter van de rechtbank van het arrondissement waarin de
      woonruimte is gelegen schriftelijk en met redenen omkleed heeft verzocht de huurprijs daarvan vast te stellen. Op
      het hier bedoelde verzoek aan de kantonrechter zijn de [artikelen 27][ref10] en [28][ref11] van overeenkomstige
      toepassing.


