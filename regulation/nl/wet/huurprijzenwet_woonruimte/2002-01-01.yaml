  - number: 25c
    text: |-
      [Artikel 25a][ref1] is van overeenkomstige toepassing in alle andere gevallen waarin ingevolge deze wet een
      uitspraak van de huurcommissie wordt verzocht, indien het verzoek kennelijk niet-ontvankelijk dan wel kennelijk
      niet redelijk is, of de aan het verzoek ten grondslag liggende bezwaren kennelijk ongegrond zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel25a
