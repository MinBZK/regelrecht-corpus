  - number: '12'
    text: |-
      1 Indien een overeenkomst van huur en verhuur meer omvat dan het enkele gebruik van woonruimte, is de prijs die
      voor het enkele gebruik daarvan, vermeerderd met ten hoogste de vergoedingen welke voor dit meerdere ingevolge
      wettelijke voorschriften mogen worden berekend of, voorzover deze voorschriften ontbreken of een lager bedrag dan
      met die voorschriften in overeenstemming zou zijn billijk is, de vergoedingen welke hiervoor als redelijk zijn aan
      te merken.

      2 De verhuurder verstrekt de huurder elk jaar een naar de soort uitgesplitst overzicht van de in rekening gebrachte
      kosten als bedoeld in het eerste lid, met vermelding van de wijze van berekening daarvan. Het heeft betrekking
      op een tijdvak van ten hoogste twaalf maanden verstreken sedert het einde van het tijdvak, waarover het laatste
      overzicht werd verstrekt.

      3 Bij beëindiging van een overeenkomst van huur en verhuur als in het eerste lid bedoeld, verstrekt de verhuurder
      de huurder een overzicht als in het tweede lid bedoeld, over het tijdvak dat op het tijdstip van die beëindiging is
      verstreken sedert het einde van het tijdvak waarover laatstelijk een overzicht is verstrekt.

      4 Het in het tweede en derde lid bedoelde overzicht wordt verstrekt vóór het einde van het kalenderjaar, volgend op
      het kalenderjaar waarin het tijdvak waarop het overzicht betrekking heeft, is geëindigd, dan wel zou zijn geëindigd
      indien de overeenkomst van huur en verhuur niet binnen dat tijdvak zou zijn beëindigd.

      5 Een tussen huurder en verhuurder geldend voorschotbedrag dat de huurder krachtens overeenkomst of ingevolge
      vaststelling door de kantonrechter op grond van [artikel 14, tweede lid][ref1] aan de verhuurder is verschuldigd
      terzake van de in het eerste lid bedoelde vergoedingen, mag, behoudens een na het ingaan van de huur aangegane
      overeenkomst, slechts worden verhoogd:

      a. met ingang van de dag, volgende op het einde van de betalingstermijn waarin een overeengekomen uitbreiding heeft
      plaatsgevonden van hetgeen de overeenkomst van huur en verhuur meer omvat dan het enkele gebruik van de woonruimte
      dan wel met ingang van de betalingstermijn, met ingang waarvan een zodanige uitbreiding heeft plaatsgevonden;

      b. met ingang van de dag, volgende op de betalingstermijn, waarin het laatste overzicht, bedoeld in het tweede
      lid, aan de huurder is verstrekt, zulks met dien verstande dat elk overzicht slechts eenmaal tot een verhoging
      mag leiden.

      6 De verhuurder biedt de huurder desverzocht de gelegenheid, na verstrekking van een overzicht, als bedoeld in
      het tweede of derde lid, tot inzage van de aan het overzicht ten grondslag liggende boeken en andere zakelijke
      bescheiden of van afschriften daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel14
