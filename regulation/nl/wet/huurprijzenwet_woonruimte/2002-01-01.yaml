  - number: '23'
    text: |-
      Indien de verhuurder met een voorstel van de huurder tot verlaging van de huurprijs niet instemt, kan de huurder
      tot uiterlijk twaalf weken na het tijdstip waarop de verlaging blijkens het voorstel had moeten ingaan, de
      huurcommissie, in welker ressort de woonruimte is gelegen, schriftelijk verzoeken uitspraak te doen over de
      redelijkheid van het voorstel.
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel23
  - number: '25'
    text: |-
      1 De huurcommissie doet binnen vier maanden na ontvangst van het verzoek, bedoeld in
      [de artikelen 20, eerste of vierde lid][ref1], of [23][ref2], met redenen omkleed schriftelijk uitspraak omtrent
      de redelijkheid van het voorstel tot wijziging van de huurprijs. Zij vermeldt de wijziging van de huurprijs die zij
      redelijk acht of spreekt uit, dat het ongewijzigd blijven van de huurprijs redelijk is. De huurcommissie vermeldt
      in haar uitspraak de datum van ingang die in het voorstel tot wijziging van de huurprijs is vermeld of een latere
      datum indien de wet zulks vergt.

      2 De huurcommissie beoordeelt de redelijkheid van het voorstel naar de toestand op het tijdstip waartegen
      de wijziging van de huurprijs is voorgesteld, en vermeldt in haar uitspraak de wijziging van de huurprijs
      die zij redelijk acht met inachtneming van de bij of krachtens algemene maatregel van bestuur bedoeld in
      [artikel 15][ref3], gegeven regelen. Daarbij vormt de huurcommissie slechts een eigen oordeel over de kwaliteit van
      de woonruimte, indien die kwaliteit al dan niet op onderdelen voorwerp van geschil is tussen partijen.

      3 De huurcommissie kan de in het eerste lid bedoelde termijn met ten hoogste twee maanden verlengen. Zij stelt
      partijen van de duur van de verlenging in kennis.

      4 Indien de huurcommissie op grond van het tweede lid van oordeel is dat een voorstel tot verhoging van de
      huurprijs als bedoeld in [artikel 19, eerste lid, onder f][ref4], redelijk is en voorts constateert dat het
      formulier, bedoeld in [artikel 19, derde lid][ref5], niet volledig is ingevuld, brengt de huurcommissie het
      voorgestelde percentage van de verhoging van de huurprijs terug tot het in genoemd artikelonderdeel bedoelde
      percentage.

      5 De huurcommissie wijst in haar uitspraak partijen op de in [artikel 27, eerste lid][ref6], bedoelde mogelijkheid
      om de kantonrechter te verzoeken de huurprijs vast te stellen, alsook op de vorm en de termijn die daarbij in acht
      moeten worden genomen.

      6 De huurcommissie zendt bij aangetekend schrijven een afschrift van haar uitspraak aan partijen.

      7 Indien geen der partijen binnen twee maanden na verzending van het in het zesde lid bedoelde afschrift tot de
      kantonrechter een met redenen omkleed schriftelijk verzoek richt om de huurprijs vast te stellen, worden partijen
      geacht een wijziging van de huurprijs of een ongewijzigd blijven daarvan te zijn overeengekomen als door de
      huurcommissie in haar uitspraak is vermeld.


