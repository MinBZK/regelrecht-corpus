  - number: 10a
    text: |-
      1 In afwijking van [artikel 10, eerste lid][ref1], kan indien de in dat lid bedoelde ingrepen of voorzieningen,
      al dan niet met toepassing van bestuursdwang, zijn getroffen ter uitvoering van een aanschrijving als bedoeld in
      [artikel 15][ref2], [15a][ref3] of [16 van de Woningwet][ref4], de in [artikel 10, eerste lid][ref5], bedoelde
      verhoging van de huurprijs ook na de totstandkoming van bedoelde ingrepen of voorzieningen door de huurder en de
      verhuurder worden overeengekomen.

      2 Indien partijen binnen drie maanden na de totstandkoming van de ingrepen of voorzieningen geen overeenstemming
      hebben kunnen bereiken over het bedrag van de verhoging, kan de verhuurder tot uiterlijk zes maanden na die
      totstandkoming de huurcommissie, in welker ressort de woonruimte is gelegen, schriftelijk verzoeken uitspraak te
      doen over het bedrag van de verhoging na bedoelde totstandkoming.

      3 De huurcommissie doet binnen vier maanden na ontvangst van het verzoek met redenen omkleed schriftelijk uitspraak
      omtrent het bedrag van de verhoging met inachtneming van de bij of krachtens de algemene maatregel van bestuur,
      bedoeld in [artikel 15][ref6], gegeven regelen.

      4 De huurcommissie kan de in het derde lid bedoelde termijn met ten hoogste twee maanden verlengen. Zij stelt
      partijen van de duur van de verlenging in kennis.

      5 De [artikelen 25, vierde tot en met zevende lid][ref7], [27][ref8] en [28, eerste tot en met derde lid][ref9],
      zijn van overeenkomstige toepassing.

      6 Ingevolge [artikel 16 van de Woningwet][ref10] gelijktijdig verzonden aanschrijvingen als bedoeld in de
      [artikelen 14, eerste lid][ref11], [15][ref12] en [15a van die wet][ref13], worden voor de toepassing van dit
      artikel gelijkgesteld met een aanschrijving als bedoeld in [artikel 15 van de Woningwet][ref14].


