  - number: '29'
    text: |-
      De rechtsvordering terzake van hetgeen wegens huur en verhuur van woonruimte onverschuldigd mocht zijn betaald vóór
      het tijdstip van inwerkingtreding van deze wet wordt behandeld met toepassing van het vóór dat tijdstip geldende
      recht.
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel29
  - number: '30'
    text: |-
      1 De op het tijdstip van inwerkingtreding van deze wet geldende huurprijzen kunnen voor de eerste maal ingevolge
      het in [artikel 4][ref1] bepaalde worden gewijzigd nadat twaalf maanden zijn verlopen sedert het tijdstip waarop
      deze huurprijzen voor de eerste maal verschuldigd zijn geworden. Het [tweede lid van artikel 4][ref2] is van
      toepassing.

      2 In afwijking van het in het vorige lid en het in [artikel 4][ref3] bepaalde blijven vóór 21 oktober 1976 tot
      stand gekomen overeenkomsten van huur en verhuur van woonruimte met een looptijd voor wat de huurprijs betreft van
      meer dan twaalf maanden, voorzover het de huurprijs betreft, van kracht tot de datum waarop deze overeenkomsten
      zullen eindigen, doch tot uiterlijk drie jaar na het tijdstip van inwerkingtreding van deze wet.

      3 Het in de voorgaande leden bepaalde is van overeenkomstige toepassing op door de rechter vastgestelde
      huurprijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003221#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003221#Artikel4
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel30
