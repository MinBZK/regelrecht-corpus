  - number: 25b
    text: |-
      1 De bevoegdheid, bedoeld in [artikel 25a, eerste lid][ref1], komt de voorzitter mede toe ten aanzien van een
      verzoek, waarvan hij vaststelt, dat de bezwaren die bestaan tegen het voorstel tot wijziging van de huurprijs dat
      aan het verzoek ten grondslag ligt, gelijkluidend dan wel nagenoeg gelijkluidend zijn aan de bezwaren, die ten
      aanzien van dezelfde woonruimte bij de behandeling van een verzoek als bedoeld in [artikel 17, eerste lid][ref2],
      dan wel een verzoek als bedoeld in [artikel 20, eerste of vierde lid][ref3], of [23][ref4] aan de huurcommissie
      zijn kenbaar gemaakt in de laatste drie jaren voorafgaande aan de datum van indiening van het verzoek en op die
      bezwaren onherroepelijk afwijzend is beslist. De toepassing van de eerste volzin geschiedt met inachtneming van de
      gevolgen die in [artikel 26a][ref5] worden verbonden aan het niet betalen van het voorschot op de in dat artikel
      bedoelde vergoeding.

      2 [Artikel 25a, tweede tot en met zevende lid][ref6], is van overeenkomstige toepassing.


