  - number: '15'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regelen gegeven voor de beoordeling door de huurcommissie
      van de kwaliteit van woonruimte en van de redelijkheid van wijzigingen van de huurprijs alsmede van de redelijkheid
      van huurprijzen als bedoeld in de [artikelen 17][ref1] en [18][ref2].

      2 Daarbij worden ter vermijding van een te grote stijging van de huurprijs regelen gegeven inzake de
      hoogste toelaatbare stijging van de huurprijs ingevolge een uitspraak van de huurcommissie als bedoeld in
      [artikel 25, tweede lid][ref3].

      3 Bij de beoordeling door de huurcommissie van de kwaliteit van woonruimte worden voorzieningen welke de huurder
      onverplicht voor eigen rekening heeft aangebracht en waardoor het woongerief geacht kan worden te zijn gestegen,
      buiten beschouwing gelaten, tenzij verrekening der gemaakte kosten naar billijkheid heeft plaatsgevonden.

      4 De algemene maatregel van bestuur als bedoeld in dit artikel en de krachtens deze maatregel gegeven voorschriften
      treden niet eerder in werking dan twee maanden na de dagtekening van het Staatsblad waarin Ons besluit is
      geplaatst. Van de plaatsing wordt onverwijld aan de Staten-Generaal mededeling gedaan.


