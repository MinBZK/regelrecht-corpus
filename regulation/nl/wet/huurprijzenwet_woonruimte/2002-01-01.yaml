  - number: '27'
    text: |-
      1 De huurder en de verhuurder kunnen ieder gedurende twee maanden na verzending van een uitspraak van de
      huurcommissie als bedoeld in [artikel 25, eerste lid][ref1], de kantonrechter van de rechtbank van het
      arrondissement waarin de woonruimte is gelegen schriftelijk en met redenen omkleed verzoeken de huurprijs daarvan
      vast te stellen. Gelijke bevoegdheid bestaat gedurende twee maanden na een uitspraak van de huurcommissie als
      bedoeld in [artikel 17, tweede of vijfde lid][ref2], of [artikel 18, tweede en achtste lid][ref3]. Indien het
      verzoek niet met redenen is omkleed stelt de kantonrechter de verzoeker in de gelegenheid het verzuim binnen een
      door hem te bepalen termijn te herstellen.

      2 Een afschrift van de uitspraak van de huurcommissie, bedoeld in het eerste lid, wordt bij het verzoek gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel25
