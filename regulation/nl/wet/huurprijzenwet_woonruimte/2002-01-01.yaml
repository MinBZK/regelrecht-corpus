  - number: 26a
    text: |-
      1 Voor het door de huurcommissie ingevolge de [artikelen 6, derde lid][ref1], en [10, tweede lid][ref2],
      uitbrengen van een advies en voor het door de huurcommissie ingevolge de [artikelen 10a, derde lid][ref3],
      [11a, tweede lid][ref4], [13, eerste lid][ref5], [17, tweede en vijfde lid][ref6],
      [18, tweede en achtste lid][ref7], [20, eerste en vierde lid][ref8], en [23][ref9] doen van een uitspraak is door
      de huurder en de verhuurder bij wijze van voorschot een vergoeding aan de Staat verschuldigd, waarvan het bedrag en
      de wijze van betaling bij algemene maatregel van bestuur worden vastgesteld.

      2 Bij het uitbrengen van het advies, onderscheidenlijk het doen van de uitspraak, geeft de huurcommissie
      gemotiveerd aan welke van beide partijen, zijnde de naar het oordeel van de huurcommissie geheel of voor het
      grootste deel, gelet op de strekking van het verzoekschrift, in het ongelijk gestelde partij, een vergoeding aan
      de Staat verschuldigd is. Indien de huurcommissie van oordeel is dat beide partijen in ongeveer gelijke mate in het
      ongelijk worden gesteld, kan zij gemotiveerd uitspreken dat beide partijen de helft van de vergoeding aan de Staat
      verschuldigd zijn. In gevallen waarin de voorzitter van de huurcommissie bevoegd is tot het doen van een uitspraak,
      komen de in de eerste en tweede volzin bedoelde bevoegdheden toe aan de voorzitter.

      3 Het bedrag en de wijze van betaling van de in het tweede lid bedoelde vergoeding worden bij algemene maatregel
      van bestuur vastgesteld.

      4 Na het uitbrengen van het advies onderscheidenlijk het doen van een uitspraak wordt de bij wijze van voorschot
      betaalde vergoeding terugbetaald, voorzover geen vergoeding verschuldigd is als bedoeld in het tweede lid.

      5 De huurcommissie roept huurder en verhuurder bij schriftelijk bericht op, onder kennisgeving van de ontvangst van
      het verzoek, alsmede onder kennisgeving van de inhoud van het verzoek aan de partij die niet de verzoeker is, tot
      betaling van de in het eerste lid bedoelde vergoeding, voorzover deze op dat tijdstip nog niet is voldaan, binnen
      vier weken na de datum van verzending van dit bericht.

      6 Ingeval geen van beide partijen binnen de in het vijfde lid genoemde termijn de vergoeding heeft voldaan, wordt
      het verzoek niet-ontvankelijk verklaard. Ingeval alleen de niet-verzoekende partij binnen die termijn de vergoeding
      heeft voldaan, wordt het verzoek niet-ontvankelijk verklaard en wordt de bij wijze van voorschot door de niet-
      verzoekende partij betaalde vergoeding terugbetaald. Ingeval alleen de verzoekende partij binnen die termijn de
      vergoeding heeft voldaan, luidt het advies of de uitspraak zo veel mogelijk in overeenstemming met de strekking van
      het verzoek, tenzij:

      a. het verzoek kennelijk niet-ontvankelijk is,

      b. de aan het verzoek ten grondslag liggende bezwaren kennelijk ongegrond zijn, of

      c. het verzoek kennelijk niet redelijk is.

      7 Indien het verzoek vóór de uitspraak wordt ingetrokken, ontvangt de partij die niet de verzoeker was de bij wijze
      van voorschot betaalde vergoeding terug.

      8 De voorzitter van de huurcommissie is bevoegd op verzoek vrijstelling te verlenen van de aan de Staat
      verschuldigde vergoeding, bedoeld in het eerste en tweede lid. Bij regeling van Onze Minister wordt bepaald
      in welke gevallen van deze bevoegdheid gebruik kan worden gemaakt. Zolang niet is beslist op een aanvraag om
      vrijstelling van de in het eerste lid bedoelde vergoeding, wordt de in het vijfde lid genoemde termijn opgeschort.

      9 Bij regeling van Onze Minister wordt bepaald aan welke voorwaarden een verzoek als bedoeld in de
      [artikelen 6, derde lid][ref10], [10, tweede lid][ref11], [10a, tweede lid][ref12], [11a, eerste lid][ref13],
      [13, eerste lid][ref14], [17, eerste en vijfde lid][ref15], [18, eerste en achtste lid][ref16],
      [20, eerste en vierde lid][ref17], en [23][ref18] dient te voldoen en welke gegevens daarbij worden verstrekt of
      overgelegd.


