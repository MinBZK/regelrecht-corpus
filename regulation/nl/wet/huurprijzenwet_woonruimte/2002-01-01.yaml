  - number: '5'
    text: |-
      Bepalingen in overeenkomsten van huur en verhuur van woonruimte welke tot gevolg hebben, dat de huurprijs van
      woonruimte in enig tijdvak van twaalf maanden meer dan éénmaal wordt verhoogd, zijn, tenzij sprake is van het
      geval, bedoeld in [artikel 10][ref1], nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel10
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel5
    references:
