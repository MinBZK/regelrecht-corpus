  - number: '39'
    text: |-
      Onze Minister doet jaarlijks vóór 31 december aan de Tweede Kamer der Staten-Generaal een nota toekomen inzake het
      in het navolgende jaar door de Regering te voeren beleid ten aanzien van de huurprijzen van woonruimte.
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel39
  - number: '41'
    text: |-
      1 De Wet jaarlijkse huurverhogingen, de Wet huurprijsontwikkeling woonruimte (Stb. 1975, 61) en de Wet huurprijzen
      verbeterde woningen (Stb. 1978, 144) worden ingetrokken.

      2
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel41
  - number: '44'
    text: |-
      Deze wet kan worden aangehaald als «Huurprijzenwet woonruimte». Zij treedt in werking op een door ons te bepalen
      tijdstip.
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel44
