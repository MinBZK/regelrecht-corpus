  - number: '2'
    text: |-
      1 Deze wet is niet van toepassing op overeenkomsten van huur en verhuur van woonruimte die een gebruik betreffen,
      dat naar zijn aard slechts van korte duur is.

      2 Deze wet is voorts niet van toepassing op overeenkomsten van huur en verhuur van woonruimte die een zelfstandige
      woning vormt, indien partijen bij de aanvang van de bewoning een huurprijs zijn overeengekomen die, indien
      nodig herleid tot een bedrag per jaar, hoger is dan het op dat tijdstip in artikel 16, eerste volzin, van de Wet
      individuele huursubsidie genoemde bedrag, dan wel bij de aanvang van de bewoning een huurprijs zijn overeengekomen
      die hoger is dan het op dat tijdstip in [artikel 13, eerste lid, onder a, van de Huursubsidiewet][ref1]
      genoemde bedrag. In afwijking van de eerste volzin zijn op de in de eerste volzin bedoelde overeenkomsten
      de [artikelen 5][ref2], [6, eerste en tweede lid][ref3], [12][ref4] en [14, eerste lid][ref5], voorzover het
      betrekking heeft op de in [artikel 12, eerste lid][ref6], bedoelde kosten, en vierde lid, van toepassing.

      3 In afwijking van het tweede lid is deze wet op de in dat lid bedoelde overeenkomsten van toepassing, voorzover
      het betreft de in [artikel 17][ref7] bedoelde beoordeling door de huurcommissie van de redelijkheid van de bij
      de aanvang van de bewoning overeengekomen huurprijs en de daarop volgende mogelijkheid tot vaststelling van
      de huurprijs door de kantonrechter. Daarbij wordt, indien de hierbedoelde beoordeling dan wel vaststelling zou
      leiden tot een huurprijs boven de in het tweede lid bedoelde grens, de door partijen overeengekomen huurprijs als
      huurprijs aangenomen, en is, bij een onherroepelijke uitkomst niet boven die grens, het tweede lid niet langer
      van toepassing.


