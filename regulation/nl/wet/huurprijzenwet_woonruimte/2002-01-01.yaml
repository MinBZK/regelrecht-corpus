  - number: '33'
    text: |-
      Op de op het tijdstip van inwerkingtreding van deze wet bij Onze Minister aanhangige verzoeken als bedoeld in de
      [artikelen 3, tweede en derde lid, van de Huurwet][ref1] of 3 en 4 van de Wet jaarlijkse huurverhogingen wordt
      beslist met toepassing van het vóór het tijdstip van inwerkingtreding van deze wet geldende recht.


      [ref1]: https://wetten.overheid.nl/BWBR0002066#Artikel3
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002066
        artikel: '3'
  - number: '34'
    text: |-
      Op de op het tijdstip van inwerkingtreding van deze wet bij de rechter aanhangige verzoeken tot vaststelling van
      de betalingsverplichting als bedoeld in [artikel 15, eerste lid, van de Huurwet][ref1], waaromtrent op dat tijdstip
      nog niet onherroepelijk is beslist, blijft het voordien geldende recht van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002066#Artikel15
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002066
        artikel: '15'
  - number: '36'
    text: |-
      De huurprijs van een vóór het tijdstip van inwerkingtreding van deze wet ingevolge
      [artikel 33 van de Woningwet][ref1] onbewoonbaar verklaarde woning of van woonruimte welke ingevolge het in
      [artikel 5, tweede lid, van de Huurwet][ref2] bepaalde, voor wat de huurprijs betreft, daarmede is gelijkgesteld,
      is de huurprijs geldend op het tijdstip van inwerkingtreding van deze wet, doch niet meer dan € 9,08 per maand.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002066#Artikel5
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0002066
        artikel: '5'
  - number: '37'
    text: De toepasselijkheid van de bepalingen van deze wet kan niet bij overeenkomst worden uitgesloten of beperkt.
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel37
  - number: '38'
    text: |-
      1 Na verloop van één jaar, te rekenen van de dag, waarop voor de eerste maal bij onherroepelijke beslissing de
      betalingsverplichting van de huurder is vastgesteld, doch niet later dan drie jaar, te rekenen van de dag waarop
      het genot van de woonruimte is geëindigd, vervalt de rechtsvordering terzake van hetgeen onverschuldigd mocht zijn
      betaald.

      2 De rechter kan de in het eerste lid bedoelde vordering tot een verminderd bedrag toewijzen, indien de billijkheid
      zulks vergt.
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel38
  - number: 38a
    text: |-
      In elke na het verstrijken van de termijn, bedoeld in [artikel 13, tweede lid][ref1], ingestelde rechtsvordering
      terzake van de vergoedingen, bedoeld in [artikel 12, eerste lid][ref2], wordt een uitspraak van de huurcommissie
      dan wel beschikking van de kantonrechter omtrent de betalingsverplichting van de huurder met betrekking tot deze
      vergoedingen overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003221#Artikel12
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0003221
        artikel: '13'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003221
        artikel: '12'
        hoofdstuk: II
        afdeling: '3'
  - number: 38b
    text: |-
      In elke rechtsvordering terzake van hetgeen onverschuldigd mocht zijn betaald in verband met een
      overeenkomst als bedoeld in [artikel 11a, eerste lid][ref1], waarbij partijen slechts de hoogte van de
      prijs en niet die van de huurprijs zijn overeengekomen, wordt een uitspraak van de huurcommissie, als
      bedoeld in [artikel 11a, tweede lid][ref2], dan wel beschikking van de kantonrechter, als bedoeld in
      [artikel 14, tweede lid][ref3], overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0003221#Artikel11a
      [ref3]: https://wetten.overheid.nl/BWBR0003221#Artikel14
    url: https://wetten.overheid.nl/BWBR0003221/2002-01-01#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0003221
        artikel: 11a
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003221
