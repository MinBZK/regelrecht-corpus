  - number: '28'
    text: |-
      1 De kantonrechter beschikt op het verzoek met inachtneming van het bepaalde bij of krachtens de
      [artikelen 4][ref1], [5][ref2] en [15][ref3].

      2 De beschikking wordt in het openbaar uitgesproken. De griffier zendt een afschrift van de beschikking aan de
      huurcommissie.

      3 Tegen deze beschikking staat hoger beroep noch beroep in cassatie open, met uitzondering van cassatie in het
      belang van de wet.

      4 Hetgeen in [artikel 26][ref4] met betrekking tot de gewijzigde huurprijs is bepaald, is van overeenkomstige
      toepassing op de door de kantonrechter vastgestelde huurprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel4
