preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om regels te stellen over het verwerken van gegevens
    ter bevordering van de veiligheid en de integriteit van elektronische informatiesystemen die van vitaal belang zijn
    voor de Nederlandse samenleving en over het melden van ernstige inbreuken op die informatiesystemen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0039866/2018-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop gebaseerde bepalingen wordt verstaan onder:

        - *aanbieder:* overheidsorganisatie of privaatrechtelijke rechtspersoon die een product of dienst exploiteert,
      beheert of beschikbaar stelt;
        - *vitale aanbieder:* aanbieder van een product of dienst waarvan de beschikbaarheid en betrouwbaarheid van vitaal
      belang zijn voor de Nederlandse samenleving;
        - *informatiesysteem:* geheel of gedeeltelijk met elektronische middelen bestuurd systeem waarvan een product of
      dienst afhankelijk is;
        - *Onze Minister:* Onze Minister van Veiligheid en Justitie;
        - *persoonsgegevens, verwerking van persoonsgegevens,* onderscheidenlijk *verantwoordelijke:* hetgeen daaronder
      wordt verstaan in [artikel 1 van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0039866/2018-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: '2'
    text: |-
      1 Onze Minister heeft, ter voorkoming of beperking van het uitvallen van de beschikbaarheid of het verlies van
      integriteit van informatiesystemen van vitale aanbieders, en van andere aanbieders die onderdeel zijn van de
      rijksoverheid, en ter verdere versterking van de digitale weerbaarheid van de Nederlandse samenleving, de volgende
      taken:

      a. het bijstaan van deze aanbieders bij het treffen van maatregelen om de beschikbaarheid en betrouwbaarheid van
      hun producten of diensten te waarborgen of te herstellen;

      b. het informeren en adviseren van deze aanbieders en anderen in en buiten Nederland over dreigingen en incidenten
      met betrekking tot de in de aanhef bedoelde informatiesystemen;

      c. het verrichten van analyses en technisch onderzoek ten behoeve van de onder a en b genoemde taken, naar
      aanleiding van de onder b bedoelde dreigingen en incidenten of aanwijzingen daarvoor, niet zijnde onderzoek naar
      personen of organisaties die voor die dreigingen of incidenten verantwoordelijk zijn of die daar anderszins aan
      bijdragen of hebben bijgedragen.

      2 Voorts heeft Onze Minister, ter voorkoming van nadelige maatschappelijke gevolgen, tot taak: het verstrekken van
      ingevolge het eerste lid, onderdeel c, verkregen gegevens over dreigingen en incidenten met betrekking tot andere
      informatiesystemen dan bedoeld in de aanhef van het eerste lid aan:

      a. organisaties die objectief kenbaar tot taak hebben om andere organisaties of het publiek daarover te informeren;

      b. computercrisisteams, aangewezen bij regeling van Onze Minister of behorend tot een bij die regeling aangewezen
      categorie;

      c. aanbieders van internettoegangs- en internetcommunicatiediensten ten behoeve van het informeren van gebruikers
      van die diensten.
    url: https://wetten.overheid.nl/BWBR0039866/2018-05-01#Artikel2
  - number: '3'
    text: |-
      Ten behoeve van de in [artikel 2][ref1] genoemde doeleinden en taken worden gegevens verwerkt, waaronder
      persoonsgegevens. Onze Minister is verantwoordelijke voor deze verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0039866#Artikel2
    url: https://wetten.overheid.nl/BWBR0039866/2018-05-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0039866
        artikel: '2'
        paragraaf: '1'
  - number: '4'
    text: |-
      1 Onze Minister kan een rechtspersoon of een orgaan daarvan verzoeken om gegevens te verstrekken die noodzakelijk
      zijn voor de vervulling van de in [artikel 2, eerste lid][ref1], genoemde taken.

      2 [Artikel 9, eerste lid, van de Wet bescherming persoonsgegevens][ref2] is niet van toepassing op het verstrekken
      van persoonsgegevens aan Onze Minister ingevolge een verzoek als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0039866#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel9
    url: https://wetten.overheid.nl/BWBR0039866/2018-05-01#Artikel4
    references:
