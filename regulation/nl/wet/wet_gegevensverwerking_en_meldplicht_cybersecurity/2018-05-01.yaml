        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '9'
  - number: '5'
    text: |-
      De [artikelen 6 tot en met 8][ref1] zijn slechts van toepassing op vitale aanbieders die zijn aangewezen bij
      algemene maatregel van bestuur of behoren tot een daarbij omschreven categorie, voor wat betreft de producten of
      diensten die bij die maatregel zijn aangewezen of behoren tot een daarbij omschreven categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0039866#Artikel6
    url: https://wetten.overheid.nl/BWBR0039866/2018-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0039866
        artikel: '6'
        paragraaf: '2'
  - number: '6'
    text: |-
      1 De vitale aanbieder geeft Onze Minister onverwijld kennis van een inbreuk op de veiligheid of een verlies van
      integriteit van zijn informatiesysteem waardoor de beschikbaarheid of betrouwbaarheid van een product of dienst in
      belangrijke mate wordt of kan worden onderbroken.

      2 De kennisgeving omvat in ieder geval:

      a. de aard en omvang van de inbreuk of het verlies;

      b. het vermoedelijke tijdstip van de aanvang van de inbreuk of het verlies;

      c. de mogelijke gevolgen van de inbreuk of het verlies;

      d. een prognose van de hersteltijd;

      e. zo mogelijk, de door de vitale aanbieder genomen of te nemen maatregelen om de gevolgen van de inbreuk of het
      verlies te beperken of herhaling hiervan te voorkomen;

      f. de contactgegevens van de functionaris die verantwoordelijk is voor het doen van de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0039866/2018-05-01#Artikel6
  - number: '7'
    text: |-
      Desgevraagd verstrekt de vitale aanbieder die een kennisgeving als bedoeld in [artikel 6][ref1] heeft gedaan, Onze
      Minister onverwijld alle overige gegevens die noodzakelijk zijn om:

      a. de vitale aanbieder bij te staan bij het treffen van maatregelen om de beschikbaarheid en betrouwbaarheid van
      het product of de dienst te waarborgen of te herstellen;

      b. de risico’s in te schatten voor de informatiesystemen, bedoeld in [artikel 2, eerste lid][ref2], aanhef.


      [ref1]: https://wetten.overheid.nl/BWBR0039866#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0039866#Artikel2
    url: https://wetten.overheid.nl/BWBR0039866/2018-05-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0039866
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0039866
        artikel: '2'
        paragraaf: '1'
  - number: '8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de [artikelen 6][ref1] en
      [7][ref2], waaronder regels over:

      a. de gegevens die ter uitvoering van [artikel 6][ref3] worden verstrekt;

      b. de wijze waarop een kennisgeving als bedoeld in [artikel 6][ref4] wordt gedaan en waarop gegevens als bedoeld in
      [artikel 7][ref5] worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0039866#Artikel6
