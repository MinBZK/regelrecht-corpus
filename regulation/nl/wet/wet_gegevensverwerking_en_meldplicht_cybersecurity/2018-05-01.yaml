  - number: '9'
    text: |-
      1 Ter uitvoering van de in [artikel 2][ref1] genoemde taken verstrekt Onze Minister geen vertrouwelijke gegevens
      met betrekking tot een aanbieder indien:

      a. de geheimhouding van die gegevens onvoldoende is gewaarborgd, of

      b. onvoldoende is gewaarborgd dat zij uitsluitend worden gebruikt voor het doel waarvoor zij worden verstrekt.

      2 Ter uitvoering van de in [artikel 2][ref2] genoemde taken kan Onze Minister vertrouwelijke gegevens die herleid
      kunnen worden tot een aanbieder, zonder diens instemming uitsluitend verstrekken voor zover dat dienstig is voor
      het bevorderen van maatregelen ter voorkoming of beperking van een verstoring van het maatschappelijk verkeer.
      Ingevolge de eerste volzin worden uitsluitend gegevens verstrekt aan:

      a. computercrisisteams, aangewezen bij regeling van Onze Minister of behorend tot een bij die regeling aangewezen
      categorie;

      b. de inlichtingen- en veiligheidsdiensten, bedoeld in de
      [Wet op de inlichtingen- en veiligheidsdiensten 2017][ref3].

      3 Indien een vitale aanbieder, of een andere aanbieder die onderdeel is van de rijksoverheid, onvoldoende gevolg
      geeft aan een door Onze Minister gegeven advies, kan Onze Minister in het advies opgenomen gegevens als bedoeld in
      het tweede lid verstrekken aan Onze betrokken Minister.

      4 Voor zover dat noodzakelijk is om ernstige maatschappelijke gevolgen te voorkomen of te beperken:

      a. verstrekt Onze Minister onverwijld gegevens als bedoeld in het tweede lid aan Onze betrokken Minister;

      b. kan Onze Minister, na raadpleging van de betrokken aanbieder, gegevens als bedoeld in het tweede lid verstrekken
      aan andere organisaties of over die gegevens mededelingen doen aan het publiek.

      5 Het eerste lid geldt niet voor de in het vierde lid, onder b, bedoelde mededelingen aan het publiek.

      6 De [Wet openbaarheid van bestuur][ref4] is niet van toepassing op gegevens als bedoeld in het tweede lid, behalve
      voor zover die gegevens milieu-informatie inhouden als bedoeld in [artikel 19.1a van de Wet milieubeheer][ref5].


