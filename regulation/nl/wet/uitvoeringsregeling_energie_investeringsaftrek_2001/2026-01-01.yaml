        bwb_id: BWBR0011353
        artikel: '3.42'
      - id: ref2
        bwb_id: BWBR0012054
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0012054
        artikel: '4'
  - number: '6'
    text: |-
      1 De minister kan de in [artikel 5][ref1] bedoelde verklaring intrekken op verzoek van de belastingplichtige,
      dan wel wijzigen of intrekken indien de te harer verkrijging verstrekte gegevens of bescheiden zodanig onjuist
      of onvolledig zijn geweest dat op het verzoek een andere beslissing zou zijn genomen indien bij de beoordeling
      daarvan de juiste of volledige gegevens bekend zouden zijn geweest. Onjuistheid of onvolledigheid van gegevens
      of bescheiden die de minister bekend was of redelijkerwijs bekend had kunnen zijn, kan geen grond opleveren voor
      wijziging of intrekking van een verklaring.

      2 De bevoegdheid tot het intrekken of wijzigen van een verklaring ingevolge het eerste lid vervalt door verloop van
      vijf jaren na de dagtekening van de verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0012054#Artikel5
    url: https://wetten.overheid.nl/BWBR0012054/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012054
        artikel: '5'
  - number: '7'
    text: |-
      Indien in de bijlage sprake is van meetvoorschriften of tests, of van verklaringen of certificaten, worden
      bedrijfsmiddelen die getoetst zijn met gelijkwaardige meetvoorschriften of tests, respectievelijk voorzien
      zijn van gelijkwaardige verklaringen of certificaten, gelijkgesteld met de aangewezen bedrijfsmiddelen. Deze
      meetvoorschriften, tests, verklaringen of certificaten moeten zijn opgesteld, respectievelijk verstrekt worden door
      daartoe geaccrediteerde instellingen of instituten.
    url: https://wetten.overheid.nl/BWBR0012054/2026-01-01#Artikel7
  - number: '8'
    text: Deze regeling treedt in werking met ingang van 1 januari 2001.
