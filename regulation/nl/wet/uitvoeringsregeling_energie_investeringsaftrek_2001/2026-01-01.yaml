  text: |-
    Handelende in overeenstemming met de Minister van Economische Zaken en na overleg met de Minister van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op artikel 3.42, tweede, vijfde en zevende lid, van de Wet inkomstenbelasting 2001,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012054/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *minister:* de Minister van Klimaat en Groene Groei;
        - *wet:* [Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012054/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: '2'
    text: |-
      Als energie-investeringen als bedoeld in [artikel 3.42, tweede lid, van de wet][ref1] worden aangewezen de
      investeringen in bedrijfsmiddelen of in onderdelen daarvan, opgenomen in de bijlage bij deze regeling, mits het
      bedrijfsmiddel of het onderdeel in overeenstemming is met de bestemming voor zover aangegeven in de bijlage, niet
      eerder is gebruikt en bestaat uit de in die bijlage genoemde bestanddelen en de locatie waarop het bedrijfsmiddel
      in gebruik wordt genomen bekend is, en:

      a. voor zover sprake is van een investering in een of meerdere voorzieningen als bedoeld in artikel 1, met
      uitzondering van onderdeel D, subonderdeel 1.1.E., van die bijlage, voor zover voor die investering ten tijde
      van de aanmelding, bedoeld in [artikel 3.42, zesde lid, van de wet][ref2], geen subsidie op grond van het
      [Besluit stimulering duurzame energieproductie en klimaattransitie][ref3] is verleend op een aanvraag die na
      31 december 2013 is ingediend;

      b. voor zover sprake is van een investering in een of meerdere voorzieningen als bedoeld in artikel 1,
      onderdeel D, onder 1.1.E., van die bijlage, voor zover aan de belastingplichtige voor deze investering ten
      tijde van de aanmelding, bedoeld in [artikel 3.42, zesde lid, van de wet][ref4], subsidie op grond van het
      [Besluit stimulering duurzame energieproductie en klimaattransitie][ref5] is verleend op een aanvraag die tussen
      1 januari 2016 en 31 december 2020 is ingediend;

      c. voor zover sprake is van een investering in een of meerdere voorzieningen als bedoeld
      in artikel 1 van die bijlage, voor zover voor deze investering ten tijde van de aanmelding,
      bedoeld in [artikel 3.42, zesde lid, van de wet][ref6], geen subsidie op grond van
      [titel 4.5 van de Regeling nationale EZ-, LVVN- en KGG-subsidies][ref7] is verleend;

      d. voor zover sprake is van een investering in een of meerdere voorzieningen als bedoeld
      in artikel 1 van die bijlage, voor zover voor deze investering ten tijde van de aanmelding,
      bedoeld in [artikel 3.42, zesde lid, van de wet][ref8], geen subsidie op grond van de
      [Subsidieregeling opschaling volledig hernieuwbare waterstofproductie via elektrolyse][ref9] of op grond van de
      [Subsidieregeling grootschalige productie volledig hernieuwbare waterstof via elektrolyse][ref10] is verleend;

      e. voor zover sprake is van een investering in een of meerdere voorzieningen als bedoeld in
      artikel 1 van die bijlage, voor zover voor deze investering ten tijde van de aanmelding, bedoeld
      in [artikel 3.42, zesde lid, van de wet][ref11], geen subsidie op grond van [titel 5.2][ref12] en
      [5.3 van de Regeling Europese EZ, LVVN- en KGG-subsidies 2021][ref13] is verleend.


