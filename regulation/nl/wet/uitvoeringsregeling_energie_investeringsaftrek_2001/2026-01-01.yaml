        artikel: '3.52'
  - number: '4'
    text: |-
      1 De aanmelding van de aangegane verplichtingen en de gemaakte voortbrengingskosten vindt uitsluitend plaats langs
      de daartoe door de minister geopende elektronische weg.

      2 De aanmelding wordt gedaan voor aangegane verplichtingen en gemaakte voortbrengingskosten die per melding samen
      ten minste € 2.500 bedragen.
    url: https://wetten.overheid.nl/BWBR0012054/2026-01-01#Artikel4
  - number: '5'
    text: |-
      1 De verklaring van de minister, bedoeld in [artikel 3.42, eerste lid, van de wet][ref1] vermeldt in welke
      aangewezen bedrijfsmiddelen of onderdelen is geïnvesteerd alsmede het bedrag van de uitgaven ter zake.

      2 Het verzoek om een verklaring als bedoeld in het eerste lid wordt gedaan bij de aanmelding bedoeld in de
      [artikelen 3][ref2] en [4][ref3].

      3 De belastingplichtige legt ten behoeve van het verstrekken van een verklaring als bedoeld in het eerste lid,
      indien de minister daarom verzoekt, een berekening van de energiebesparing over.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.42
      [ref2]: https://wetten.overheid.nl/BWBR0012054#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0012054#Artikel4
    url: https://wetten.overheid.nl/BWBR0012054/2026-01-01#Artikel5
    references:
