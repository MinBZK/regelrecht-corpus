  - number: '3'
    text: |-
      1 De aanmelding bedoeld in [artikel 3.42, zesde lid, van de wet][ref1] van de aangegane verplichtingen of de
      gemaakte voortbrengingskosten ter zake van een investering als bedoeld in [artikel 2][ref2] moet binnen een termijn
      van drie maanden plaats vinden. Deze termijn vangt aan:

      a. met betrekking tot verplichtingen: bij het aangaan van de verplichtingen;

      b. met betrekking tot voortbrengingskosten: bij de aanvang van het kalenderkwartaal volgend op dat waarin
      de kosten zijn gemaakt of, indien het bedrijfsmiddel of onderdeel ter zake waarvan de kosten zijn gemaakt in
      het kalenderkwartaal in gebruik is genomen, bij de ingebruikneming van het bedrijfsmiddel respectievelijk het
      onderdeel.

      2 Indien [artikel 3.52, eerste lid, onderdeel b, van de wet][ref3] van toepassing vindt, vangt met betrekking tot
      voortbrengingskosten de termijn aan bij de inwerkingtreding van de ministeriële regeling indien dat leidt tot een
      aanmelding op een eerder tijdstip dan op grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.42
      [ref2]: https://wetten.overheid.nl/BWBR0012054#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3.52
