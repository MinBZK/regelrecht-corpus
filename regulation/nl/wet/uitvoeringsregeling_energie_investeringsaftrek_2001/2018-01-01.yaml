  - number: '2'
    text: |-
      1 Als energie-investeringen als bedoeld in [artikel 3.42, tweede lid, van de wet][ref1] worden aangewezen: de
      investeringen in bedrijfsmiddelen of in onderdelen daarvan, opgenomen in bijlage I van deze regeling, mits:

      a. het bedrijfsmiddel of het onderdeel in overeenstemming is met de bestemming voor zover aangegeven in die
      bijlage, niet eerder is gebruikt en bestaat uit de in die bijlage genoemde bestanddelen en de locatie waarop het
      bedrijfsmiddel in gebruik wordt genomen bekend is; en

      b. – voor zover sprake is van een investering in een of meerdere voorzieningen als bedoeld in
      [bijlage 1][ref2] van deze regeling in artikel 1, onderdeel A, onder 1.2.K, in artikel 1, onderdeel
      B, onder 1.2.M, of in artikel 1, onderdeel D, onder 5.1.B – door het bevoegde gezag voor het
      bedrijfsmiddel of onderdeel daarvan een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel e, van de Wet algemene bepalingen omgevingsrecht][ref3] is afgegeven ten tijde
      van de aanmelding, bedoeld in [artikel 3.42, zesde lid, van de wet][ref4];

      c. – voor zover sprake is van een investering in een of meerdere voorzieningen als bedoeld in artikel 1, onderdeel
      D, met uitzondering van artikel 1, onderdeel D, onder 1.1.G, van [bijlage 1][ref5] van deze regeling – voor deze
      investering ten tijde van de aanmelding geen SDE-beschikking 2014 of later is afgegeven;

      d. – voor zover sprake is van een investering in een of meerdere voorzieningen als bedoeld in artikel 1 van
      [bijlage 1][ref6] van deze regeling – voor deze investering ten tijde van de aanmelding geen ISDE-beschikking is
      afgegeven;

      e. – voor zover sprake is van een investering in een of meerdere voorzieningen als bedoeld in artikel 1, onderdeel
      D, onder 1.1.G, van [bijlage 1][ref7] van deze regeling – de belastingplichtige daarvoor ten tijde van de
      aanmelding, bedoeld in [artikel 3.42, zesde lid, van de wet][ref8], houder is van een SDE-beschikking 2016 of
      later.

      2 Voor de toepassing van het eerste lid, onderdeel c, wordt onder een SDE-
      beschikking 2014 of later verstaan: een beschikking waarbij een subsidie als bedoeld in
      [artikel 2 van het Besluit stimulering duurzame energieproductie][ref9], is verleend op aanvragen voor de SDE-
      subsidie ingediend na 31 december 2013.

      3 Voor de toepassing van het eerste lid, onderdeel d, wordt onder een ISDE-beschikking verstaan: een beschikking
      als bedoeld in [titel 4.5 van de Regeling nationale EZ-subsidies][ref10].

      4 Voor de toepassing van het eerste lid, onderdeel e, wordt onder een SDE-
      beschikking 2016 of later verstaan: een beschikking waarbij een subsidie als bedoeld in
      [artikel 2 van het Besluit stimulering duurzame energieproductie][ref11] is verleend op aanvragen voor de SDE-
      subsidie ingediend na 31 december 2015.


