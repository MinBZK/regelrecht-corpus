  - number: '6'
    text: |-
      1 De Minister van Economische Zaken kan de in [artikel 5][ref1] bedoelde verklaring intrekken op verzoek van de
      belastingplichtige, dan wel wijzigen of intrekken indien de te harer verkrijging verstrekte gegevens of bescheiden
      zodanig onjuist of onvolledig zijn geweest dat op het verzoek een andere beslissing zou zijn genomen indien bij de
      beoordeling daarvan de juiste of volledige gegevens bekend zouden zijn geweest. Onjuistheid of onvolledigheid van
      gegevens of bescheiden die de Minister van Economische Zaken bekend was of redelijkerwijs bekend had kunnen zijn,
      kan geen grond opleveren voor wijziging of intrekking van een verklaring.

      2 De bevoegdheid tot het intrekken of wijzigen van een verklaring ingevolge het eerste lid vervalt door verloop van
      vijf jaren na de dagtekening van de verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0012054#Artikel5
    url: https://wetten.overheid.nl/BWBR0012054/2018-01-01#Artikel6
