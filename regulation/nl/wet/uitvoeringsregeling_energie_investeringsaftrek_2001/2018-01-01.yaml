  - number: '1'
    text: |-
      Deze regeling verstaat onder wet: [Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012054/2018-01-01#Artikel1
