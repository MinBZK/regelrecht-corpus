        artikel: '5'
  - number: '7'
    text: |-
      Indien in [bijlage I][ref1] sprake is van meetvoorschriften of tests, of van verklaringen of certificaten,
      worden bedrijfsmiddelen die getoetst zijn met gelijkwaardige meetvoorschriften of tests, respectievelijk voorzien
      zijn van gelijkwaardige verklaringen of certificaten, gelijkgesteld met de aangewezen bedrijfsmiddelen. Deze
      meetvoorschriften, tests, verklaringen of certificaten moeten zijn opgesteld, respectievelijk verstrekt worden door
      daartoe geaccrediteerde instellingen of instituten.


