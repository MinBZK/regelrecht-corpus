---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_voorzieningen_sleepvliegen
regulatory_layer: WET
publication_date: '2013-09-19'
valid_from: '2013-10-01'
bwb_id: BWBR0012875
url: https://wetten.overheid.nl/BWBR0012875/2013-10-01
preamble:
  text: |-
    Gelet op artikel 45 van het Besluit luchtwaardigheid;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
            sleep:

              door een luchtvaartuig door middel van een sleepkabel voortgetrokken sleepnet of -doek, doel voor richt- en
      schietoefeningen, of zweef- of zeilvliegtuig;



            b
            sleepvliegtuig:

              vliegtuig, ingericht voor het doen opstijgen en in de lucht voortslepen van een sleep;



            c
            sleepkabel:

              geheel van onderdelen dat de verbinding vormt tussen de sleephaak van het sleepvliegtuig en de sleephaak,
      de vanglijn of de voorste ring van de sleep;



            d
            breukstuk:

              onderdeel van de sleepkabel, dat bij een van te voren vastgestelde belasting bezwijkt, waardoor de
      verbinding tussen het sleepvliegtuig en de sleep wordt onderbroken;



            e
            dreg:

              onderdeel van de sleepkabel, dat gebruikt wordt voor het oppikken van het sleepnet;



            f
            vanglijn

              onderdeel van het sleepnet, dat gebruikt wordt voor het oppikken hiervan;



            g
            minister:

              Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel1
  - number: '2.1'
    text: |-
      Tijdens vluchten, waarbij een sleep wordt gesleept, mogen geen kunstvluchten worden uitgevoerd en mogen geen andere
      personen of goederen worden vervoerd, dan voor het uitvoeren van de vlucht noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel2
  - number: '2.2'
    text: |-
      In afwijking van hetgeen in het vorige lid en in het vlieghandboek van het sleepvliegtuig is bepaald, mag tijdens
      vluchten waarbij een éénpersoons zweefvliegtuig wordt gesleept, een persoon die houder is van een vliegbewijs
      worden vervoerd, aan wie onderricht in het sleepvliegen wordt gegeven, mits de gezagvoerder van het sleepvliegtuig
      als examinator voor de bevoegdverklaring 'sleepvliegen' in een vliegbewijs is benoemd. Indien het slepen geschiedt
      met een sleepvliegtuig waarmede tweepersoons zweefvliegtuigen bij een beperkte startmassa mogen worden gesleept,
      is de beperking van maximaal toegelaten startmassa bij het slepen van éénpersoons zweefvliegtuigen niet van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel2
  - number: '3.1'
    text: Het sleepnet moet van een door de minister toegelaten type zijn.
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel3
  - number: '3.2'
    text: |-
      De constructie en de sterkte van sleepnetten en doelen voor schietoefeningen moeten zodanig zijn, dat
      beschadigingen, die bij normaal gebruik kunnen ontstaan, niet kunnen leiden tot het optreden van gevaarlijke
      toestanden tijdens het slepen.
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel3
  - number: '3.3'
    text: |-
      De sleep mag noch zodanig geconcentreerde massa's bevatten, noch bij vrije val een zodanige valsnelheid bereiken,
      dat bij losraken van de sleep dan wel een gedeelte daarvan ernstig gevaar kan ontstaan voor de personen op de
      grond. Geconcentreerde massa's moeten zodanig zijn bevestigd, dat afzonderlijk losraken onmogelijk kan worden
      geacht. Een valsnelheid van ten hoogste 5 m/sec wordt toelaatbaar geacht.
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel3
  - number: '3.4'
    text: |-
      Het sleepnet of het doel voor schietoefeningen mag tijdens het slepen niet zodanig kunnen bewegen dat dit de
      besturing of de constructie van het sleepvliegtuig of de sleep ontoelaatbaar aantast.
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel3
  - number: '4.1'
    text: 'De sleepkabel voor het slepen van een zweefvliegtuig moet omvatten:'
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel4
  - number: 4.1.a
    text: |-
      een kabel, vervaardigd van nylon of van materiaal met overeenkomstige eigenschappen en van een zodanige lengte, dat
      aan de krachtens [artikel 5 van het Besluit Luchtwaardigheid][ref1] gestelde eisen ten aanzien van bestuurbaarheid
      en stabiliteit van het sleepvliegtuig wordt voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel5
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012651
        artikel: '5'
  - number: 4.1.b
    text: |-
      een breukstuk als bedoeld in [artikel 5][ref1], aangebracht zo dicht mogelijk bij de sleephaak van het
      zweefvliegtuig en van een nominale sterkte als vermeld in het vlieghandboek van het zweefvliegtuig, welke de
      maximaal toegelaten waarde als vermeld in de sleepbijlage van het vlieghandboek van het sleepvliegtuig niet mag
      overschrijden;


      [ref1]: https://wetten.overheid.nl/BWBR0012875#Artikel5
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012875
        artikel: '5'
  - number: 4.1.c
    text: |-
      gladde ringen, passend om de sleephaken van het zweefvliegtuig en het sleepvliegtuig. Deze ringen mogen het
      ontkoppelen niet belemmeren.
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel4
  - number: '4.2'
    text: 'De sleepkabel voor het slepen van een sleepnet of een doel voor schietoefeningen moet bevatten:'
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel4
  - number: 4.2.a
    text: |-
      een kabel van zodanige lengte, dat aan de krachtens [artikel 5 van het Besluit Luchtwaardigheid][ref1] gestelde
      eisen ten aanzien van bestuurbaarheid en stabiliteit van het sleepvliegtuig kan worden voldaan. Indien de kabel
      wordt gebruikt voor het tijdens de vlucht oppikken van een sleep op de grond, mag de kabel echter niet zo lang zijn
      dat dit een bezwaar vormt voor het veilig uitvoeren van de oppikmanoeuvre;


      [ref1]: https://wetten.overheid.nl/BWBR0012651#Artikel5
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012651
        artikel: '5'
  - number: 4.2.b
    text: |-
      een breukstuk, als bedoeld in [artikel 5][ref1], van de voorgeschreven nominale sterkte. De afstand tussen
      breukstuk en sleephaak van het vliegtuig mag ten hoogste 2 meter bedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0012875#Artikel5
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012875
        artikel: '5'
  - number: 4.2.c
    text: een gladde ring, passend om de sleephaak van het sleepvliegtuig. Deze mag het ontkoppelen niet belemmeren.
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel4
  - number: '4.3'
    text: |-
      Indien een sleepkabel een dreg bevat voor het tijdens de vlucht oppikken van een sleepnet van de grond moet de
      dreg:
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel4
  - number: 4.3.a
    text: van een door de minister toegelaten type zijn;
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel4
  - number: 4.3.b
    text: |-
      veilig uit het sleepvliegtuig kunnen worden geworpen zonder delen van het vliegtuig te raken en zonder dat de kabel
      om delen van het vliegtuig slaat;
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel4
  - number: 4.3.c
    text: |-
      van zo danige vorm zijn, dat de vanghaken bij slepen over de grond niet in de grond blijven steken en van zodanige
      afwerking zijn, dat de vanglijn niet ontoelaatbaar wordt beschadigd;
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel4
  - number: 4.3.d
    text: van zodanig aard zijn, dat bij het ontkoppelen van de sleep de dreg niet van de sleep kan losraken.
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel4
  - number: '4.4'
    text: |-
      Alle onderdelen van de sleepkabel, met uitzondering van het breukstuk, moeten een trekkracht kunnen opnemen, welke
      tenminste 1,5 maal de nominale sterkte van het breukstuk bedraagt en zonder blijvende vervorming een trekkracht
      kunnen opnemen, welke tenminste 1,15 maal de nominale sterkte van het breukstuk bedraagt.
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel4
  - number: '4.5'
    text: Alle verbindingselementen moeten zodanig zijn geconstrueerd, dat zij tijdens het slepen niet kunnen losraken.
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel4
  - number: '5.1'
    text: |-
      Het breukstuk en de houder waarin het moet zijn opgenomen, moeten deugdelijk en van een door de minister toegelaten
      type zijn. De deugdelijkheid van de breukstukken kan worden aangetoond door 5 exemplaren van de betrokken
      productieserie als volgt te beproeven:
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel5
  - number: 5.1.a
    text: |-
      het breukstuk mag niet een meetbare, blijvende vormverandering hebben ondergaan, nadat het breukstuk gedurende 5
      minuten is belast met een trekkracht van 0,85 maal de nominale sterkte;
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel5
  - number: 5.1.b
    text: |-
      de breuksterkte van het breukstuk mag niet groter zijn dan 1,07 maal en niet kleiner dan 0,93 maal de nominale
      sterkte.
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel5
  - number: '5.2'
    text: |-
      Het breukstuk, waarvan de nominale sterkte in de sleepbijlage van het vlieghandboek is vermeld, moet met een of
      meer kleuren en een ingeslagen merk duidelijk zijn gemerkt.
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel5
  - number: '6'
    text: |-
      De gezagvoerder van een buitenlands geregistreerd sleepvliegtuig is verplicht een verklaring van de minister mee te
      voeren waaruit blijkt dat het slepen met bedoeld vliegtuig is toegestaan. Aan deze toestemming kunnen voorwaarden
      worden verbonden.
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel6
  - number: '7'
    text: Deze regeling treedt in werking met ingang van 15 oktober 2001.
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel7
  - number: '8'
    text: 'Deze regeling wordt aangehaald als: Regeling voorzieningen sleepvliegen.'
    url: https://wetten.overheid.nl/BWBR0012875/2013-10-01#Artikel8
