preamble:
  text: |-
    Gelet op de artikelen 11 en 12 van Reglement voor de Binnenvisserij 1985 en de artikelen 11 en 12 van het Reglement
    minimummaten en gesloten tijden 1985;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006591/1994-04-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Van het bepaalde in artikel 6, eerste lid, aanhef en onderdeel a, van het Reglement voor de Binnenvisserij 1985 en
      van het bepaalde in [artikel 2, aanhef en onderdeel a, van het Reglement minimummaten en gesloten tijden 1985][ref1],
      voor zover het betreft de vissoorten baars en snoekbaars wordt jaarlijks vrijstelling verleend vanaf de laatste
      zaterdag in mei tot en met 31 mei.


      [ref1]: https://wetten.overheid.nl/BWBR0003805#Artikel2
    url: https://wetten.overheid.nl/BWBR0006591/1994-04-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003805
        artikel: '2'
  - number: '2'
    text: |-
      Het in [artikel 1][ref1] bepaalde is niet van toepassing op het vissen in het IJsselmeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006591#Artikel1
    url: https://wetten.overheid.nl/BWBR0006591/1994-04-15#Artikel2
