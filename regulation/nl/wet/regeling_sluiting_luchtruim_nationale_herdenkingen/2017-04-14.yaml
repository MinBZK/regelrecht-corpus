  - number: '3'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst en werkt terug tot het moment van bekendstelling via de Notice to Airmen (NOTAM).
    url: https://wetten.overheid.nl/BWBR0036955/2017-04-14#Artikel3
  - number: '4'
    text: 'Deze regeling wordt aangehaald als: Regeling sluiting luchtruim nationale herdenkingen.'
    url: https://wetten.overheid.nl/BWBR0036955/2017-04-14#Artikel4
  - number: '5'
    text: |-
