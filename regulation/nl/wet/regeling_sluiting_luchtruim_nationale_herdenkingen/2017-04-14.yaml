preamble:
  text: |-
    Gelet op artikel 5.10, eerste lid onder a, van de Wet luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0036955/2017-04-14#ArtikelAanhef
articles:
  - number: 1b
    text: |-
      1 Voor de toepassing van dit artikel wordt verstaan onder NOTAM: Notice to Airmen, een bericht aan luchtvarenden
      gedistribueerd via een communicatienetwerk voor luchtverkeersdiensten met inlichtingen over de instelling, toestand
      of verandering van enige luchtvaartfaciliteit, -dienstverlening, -procedure of -gevaar, waarvan het noodzakelijk is
      dat personen die betrokken zijn bij de vluchtvoorbereiding en -uitvoering daarvan tijdig kennis nemen.

      2 Ter bescherming van militaire luchtvaartuigen die deelnemen aan ceremoniële langsvluchten, wordt het uitoefenen
      van het burgerluchtverkeer jaarlijks verboden, in de gebieden:

      a. met de laterale grenzen van 50°51’47” NB 005°45’09” OL, 50°49’13” NB 005°58’27” OL, 50°45’30” NB 005°56’39”
      OL en 50°48’04” NB 005°43’22” OL, en verticaal begrensd van grondniveau tot een hoogte van 3.000 voet AMSL, ten
      behoeve van de Margraten Memorial Day op de militaire begraafplaats in Margraten, op de laatste zondag van de maand
      mei;

      b. met een straal van 5 NM rondom het coördinaat 52°07’44.91” NB 005°16’45.78” OL, van grondniveau tot een hoogte
      van FL 90, ten behoeve van de Nationale Dodenherdenking op de voormalige vliegbasis Soesterberg, op 4 mei;

      c. met een straal van 3 NM rondom het coördinaat 51°10’19” NB 005°59’34” OL, van grondniveau tot 3.000 voet AMSL,
      ten behoeve van de herdenkingsplechtigheid bij het Nationaal Indië-monument 1945-1962 in Roermond, op de eerste
      zaterdag van september.

      3 Het verbod, genoemd in het tweede lid, geldt slechts, indien dat per NOTAM bekend is gemaakt en gedurende de
      periode die in de NOTAM is genoemd.

      4 Een ceremoniële langsvlucht als bedoeld in het tweede lid wordt uitgevoerd overeenkomstig de
      zichtvliegvoorschriften, bedoeld in deel 5 van de bijlage bij uitvoeringsverordening (EU) nr. 923/2012 van de
      Commissie van 26 september 2012 tot vaststelling van gemeenschappelijke luchtverkeersregels en operationele
      bepalingen betreffende luchtvaartnavigatiediensten en -procedures en tot wijziging van Uitvoeringsverordening (EU)
      nr. 1035/2011 en Verordeningen (EG) nr. 1265/2007, (EG) nr. 1794/2006, (EG) nr. 730/2006, (EG) nr. 1033/2006 en
      (EU) nr. 255/2010 (PbEU 2012, L 281).

      5 Onverminderd het vierde lid geldt voor een ceremoniële langsvlucht als bedoeld in het tweede lid, onderdelen a en
      b, een minimumvlieghoogte van 150 meter boven de grond of het water (500 voet AGL).
    url: https://wetten.overheid.nl/BWBR0036955/2017-04-14#Artikel1b
  - number: '2'
    text: |-
      De verboden, genoemd in de [artikelen 1][ref1], [1a][ref2] en [1b][ref3], gelden niet voor spoedeisende
      helikoptervluchten uitgevoerd door of in opdracht van de Politie Luchtvaartdienst van het Korps Landelijke
      Politiediensten, trauma- of SAR-diensten.


