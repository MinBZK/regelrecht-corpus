        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 9.1.1.f
    text: |-
      het toezicht op de naleving van [artikel 2.15][ref1] bij een wedstrijd, ten laste van de organiserende instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 9.1.1.g
    text: |-
      onderzoeken, controles of verrichtingen met betrekking tot dieren, diervoeders, diergeneesmiddelen, producten of
      voorwerpen, bedrijven of locaties ter voorkoming en bestrijding van dierziekten, zoönosen en ziekteverschijnselen,
      en ter wering van ziekteverwekkers, voor zover de onderzoeken of verrichtingen zijn voorgeschreven bij een EU-
      rechtshandeling dan wel op verzoek van betrokkenen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel9.1
  - number: 9.1.1.h
    text: |-
      controles die nodig zijn om de omvang van een overtreding van het bepaalde bij of krachtens deze wet vast te
      stellen, om na te gaan of corrigerende maatregelen zijn genomen, dan wel om een overtreding op te sporen of
      te bewijzen, voor zover de heffing ter vergoeding van kosten van deze controles is voorgeschreven bij een EU-
      rechtshandeling, en
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel9.1
  - number: 9.1.1.i
    text: |-
      de beoordeling van gidsen als bedoeld [artikel 8.44][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '6'
  - number: 9.1.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een heffing ter vergoeding van kosten worden opgelegd
      overeenkomstig een vastgesteld tarief ter zake van bij die maatregel benoemde onderzoeken of verrichtingen voor
      zover de onderzoeken of verrichtingen zijn voorgeschreven bij of krachtens deze wet of bij EU-verordening.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel9.1
  - number: 9.1.3
    text: |-
      Een tarief als bedoeld in het eerste of tweede lid wordt zodanig vastgesteld dat de geraamde baten niet uitgaan
      boven de geraamde kosten die in een rechtstreeks verband staan met de werkzaamheden waarvoor het tarief wordt
      opgelegd, onverminderd de daaromtrent bij een EU-rechtshandeling vastgestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel9.1
  - number: 9.1.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de betaling van de heffing, en kan worden
      geregeld dat een handeling als bedoeld in het eerste lid, aanhef, slechts dan wordt uitgevoerd nadat betaling van
      de heffing heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel9.1
  - number: 10.1.1
    text: |-
      Onze Minister kan, in voorkomend geval met inachtneming van EU-rechtshandelingen en voor zover het belang van de
      gezondheid van de mens, dieren of planten, het belang van het welzijn van dieren of het belang van het milieu zich
      daartegen niet verzetten, van het bepaalde bij of krachtens deze wet vrijstelling of ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.1
  - number: 10.1.2
    text: |-
      Ingeval de vrijstelling of ontheffing betrekking heeft op een bepaling die geheel of mede strekt tot bescherming
      van de volksgezondheid, wordt zij in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport
      verleend.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.1
  - number: 10.1.3
    text: |-
      Aan een vrijstelling en een ontheffing kunnen voorschriften of voorwaarden worden verbonden. Zij kunnen onder
      beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.1
  - number: 10.1.4
    text: |-
      Indien Onze Minister voornemens is een vrijstelling te verlenen van het bepaalde in [artikel 2.23][ref1], wordt
      het ontwerp van de vrijstelling in de Staatscourant bekend gemaakt en aan een ieder de gelegenheid geboden om
      binnen vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister
      te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp van de vrijstelling aan beide kamers der Staten-
      Generaal overgelegd en medegedeeld aan direct belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 10.1.5
    text: |-
      Een vrijstelling als bedoeld in het eerste lid kan, onverminderd de bevoegdheid van Onze Minister, bij algemene
      maatregel van bestuur worden verleend.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.1
  - number: 10.2.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot onderzoeken, controles,
      toezicht op de naleving en handhaving, waaronder:
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.2
  - number: 10.2.1.a
    text: de wijze waarop het onderzoek plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.2
  - number: 10.2.1.b
    text: het aanwijzen van ambtenaren of personen die het onderzoek verrichten, en
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.2
  - number: 10.2.1.c
    text: de inrichtingen waar onderzoekswerkzaamheden plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.2
  - number: 10.2.2
    text: |-
      Bij algemene maatregel van bestuur kunnen voor de toepassing van [hoofdstuk 3][ref1] de
      [artikelen 8 tot en met 13a van de Landbouwkwaliteitswet][ref2] of onderdelen daarvan van overeenkomstige
      toepassing worden verklaard. De toepassing van [artikel 13 van de Landbouwkwaliteitswet][ref3] is onverminderd
      [artikel 18, tweede lid, van de Landbouwkwaliteitswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0002755#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002755#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0002755#Artikel18
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0030250
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0002755
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002755
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0002755
        artikel: '18'
  - number: 10.4.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur dan wel bij ministeriële regeling kan medewerking
      worden gevorderd van het bestuur van een productschap of een bedrijfschap als bedoeld in
      [artikel 66 van de Wet op de bedrijfsorganisatie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel66
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '66'
  - number: 10.4.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur als bedoeld in het eerste lid kunnen de ingevolge het bepaalde bij
      of krachtens deze wet aan Onze Minister toekomende bevoegdheden tot het nemen van besluiten en tot het vaststellen
      van regels of nadere regels, alsmede aan Onze Minister opgedragen taken worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.4
  - number: 10.4.3
    text: |-
      Indien de in het eerste lid bedoelde medewerking bestaat uit het stellen van regelen of nadere regelen bij
      verordening, behoeft zodanige verordening de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.4
  - number: 10.4.4
    text: |-
      Krachtens een verordening als bedoeld in het derde lid vastgestelde nadere voorschriften en genomen besluiten
      behoeven, voor zover zulks bij de algemene maatregel van bestuur of regelen, bedoeld in het eerste lid, is bepaald,
      de goedkeuring van de daarbij aangewezen autoriteit.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.4
  - number: 10.4.5
    text: |-
      Verordeningen, bedoeld in het derde lid, kunnen onder meer inhouden toekenning aan een daarbij aan te wijzen orgaan
      van de bevoegdheid vrijstelling, en op aanvraag, ontheffing van die verordeningen of krachtens deze vast te stellen
      voorschriften of beperkingen te verlenen.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.4
  - number: 10.5.1
    text: |-
      Indien in het belang van de gezondheid van mens of dier of het welzijn van het dier naar het oordeel van Onze
      Minister een onverwijlde voorziening noodzakelijk is, kan hij in de onderwerpen die op grond van deze wet bij
      algemene maatregel van bestuur worden bepaald, bij regeling voorzien.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.5
  - number: 10.5.2
    text: |-
      De regeling vervalt een jaar nadat zij in werking is getreden, of, indien binnen die termijn een algemene maatregel
      van bestuur ter vervanging van die regeling in werking is getreden, op het moment waarop de maatregel in werking
      treedt. De termijn kan door Onze Minister eenmaal met ten hoogste een jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.5
  - number: 10.8.1
    text: |-
      Er is een Raad voor dierenaangelegenheden waarin overleg plaatsvindt over vraagstukken betreffende het nationaal en
      internationaal beleid op het gebied van de gezondheid van dieren en het welzijn van dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.8
  - number: 10.8.2
    text: |-
      Onze Minister benoemt in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport de leden van de
      Raad.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.8
  - number: 10.8.3
    text: Bij algemene maatregel van bestuur worden regels gesteld over de samenstelling en de werkwijze van de Raad.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.8
  - number: '10.9'
    text: |-
      Een voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur als
      bedoeld in de [artikelen 2.18, eerste en tweede lid][ref1], [2.20, eerste en tweede lid][ref2], en
      [2.22, eerste en tweede lid][ref3], wordt Ons gedaan door Onze Minister in overeenstemming met Onze Minister van
      Volksgezondheid, Welzijn en Sport en na overleg met Onze Minister van Sociale Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.9
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '10.10'
    text: |-
      De voordracht voor een krachtens de [artikelen 2.1, derde en vijfde lid][ref1],
      [2.2, tweede, derde, zevende en tiende lid][ref2], [2.3, tweede en vierde lid][ref3],
      [2.4, tweede lid][ref4], [2.5, tweede lid][ref5], [2.6, tweede en derde lid][ref6], [2.7, tweede lid][ref7],
      [2.8, tweede lid, onderdeel b, en vierde lid][ref8], [2.10, eerste, derde en vierde lid][ref9],
      [2.15, tweede lid][ref10], en [2.16, eerste lid][ref11], en [2.24][ref12] vast te stellen algemene maatregel van
      bestuur voor zover het betreft een voordracht voor een maatregel mede met of met het oog op de bescherming van het
      welzijn van dieren, wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal
      is overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0030250#Artikel2
