  - number: '10.11'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel10.11
  - number: 11.1.1
    text: |-
      Besluiten, niet inhoudende een algemeen verbindend voorschrift, genomen bij of krachtens de
      [Gezondheids- en welzijnswet voor dieren][ref1], de [Kaderwet diervoeders][ref2], de [Diergeneesmiddelenwet][ref3],
      de [Wet op de dierenbescherming][ref4], de [Wet op de uitoefening van de diergeneeskunde 1990][ref5] of, voor zover
      zij betrekking hebben op onderwerpen waarop deze wet van toepassing is, krachtens de [Landbouwkwaliteitswet][ref6]
      of de [Landbouwwet][ref7], die gelden op het tijdstip van inwerkingtreding van deze wet, worden geacht te zijn
      genomen op grond van deze wet, onder dezelfde voorschriften, beperkingen en voorwaarden. Bij of krachtens algemene
      maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot voorschriften, beperkingen en
      voorwaarden voor zover de uitvoering van bindende onderdelen van EU-rechtshandelingen dit vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005662
      [ref2]: https://wetten.overheid.nl/BWBR0015764
      [ref3]: https://wetten.overheid.nl/BWBR0003818
      [ref4]: https://wetten.overheid.nl/BWBR0002351
      [ref5]: https://wetten.overheid.nl/BWBR0004730
      [ref6]: https://wetten.overheid.nl/BWBR0002755
      [ref7]: https://wetten.overheid.nl/BWBR0002252
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0005662
      - id: ref2
        bwb_id: BWBR0015764
      - id: ref3
        bwb_id: BWBR0003818
      - id: ref4
        bwb_id: BWBR0002351
      - id: ref5
        bwb_id: BWBR0004730
      - id: ref6
        bwb_id: BWBR0002755
      - id: ref7
        bwb_id: BWBR0002252
  - number: 11.1.2
    text: |-
      Meldingen, gedaan ter voldoening aan verplichtingen bij of krachtens de
      [Gezondheids- en welzijnswet voor dieren][ref1], de [Kaderwet diervoeders][ref2], de [Diergeneesmiddelenwet][ref3],
      de [Wet op de dierenbescherming][ref4], de [Wet op de uitoefening van de diergeneeskunde 1990][ref5] of, voor zover
      zij betrekking hebben op onderwerpen waarop deze wet van toepassing is, krachtens de [Landbouwkwaliteitswet][ref6]
      of de [Landbouwwet][ref7], worden geacht te zijn gedaan op grond van deze wet. Bij of krachtens algemene maatregel
      van bestuur kunnen nadere regels worden gesteld met betrekking tot voorschriften, beperkingen en voorwaarden
      voorzover de uitvoering van bindende onderdelen van EU-rechtshandelingen dit vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005662
      [ref2]: https://wetten.overheid.nl/BWBR0015764
      [ref3]: https://wetten.overheid.nl/BWBR0003818
      [ref4]: https://wetten.overheid.nl/BWBR0002351
      [ref5]: https://wetten.overheid.nl/BWBR0004730
      [ref6]: https://wetten.overheid.nl/BWBR0002755
      [ref7]: https://wetten.overheid.nl/BWBR0002252
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0005662
      - id: ref2
        bwb_id: BWBR0015764
      - id: ref3
        bwb_id: BWBR0003818
      - id: ref4
        bwb_id: BWBR0002351
      - id: ref5
        bwb_id: BWBR0004730
      - id: ref6
        bwb_id: BWBR0002755
      - id: ref7
        bwb_id: BWBR0002252
  - number: 11.1.3
    text: |-
      Ten aanzien van besluiten als bedoeld in het eerste lid doet Onze Minister per soort, onderverdeeld naar de
      bepaling of bepalingen waarop de besluiten berustten, mededeling in de Staatscourant van de bepaling of bepalingen
      waarop zij vanaf het moment van inwerkingtreding van de wet worden geacht te berusten.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel11.1
  - number: 11.1.4
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet aanhangige aanvragen, verzoeken tot het nemen van een besluit
      als bedoeld in het eerste lid, zijn aanhangig in de staat, waarin zij zich op dat moment bevinden en worden vanaf
      het tijdstip van inwerkingtreding van deze wet overeenkomstig het bepaalde bij en krachtens deze wet behandeld.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel11.1
  - number: 11.1.5
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet aanhangige bezwaarschriften die betrekking hebben op het
      nemen van een besluit als bedoeld in het eerste lid, zijn aanhangig in de staat, waarin zij zich op dat moment
      bevinden en worden overeenkomstig de desbetreffende bepalingen van de wetten, bedoeld in het eerste lid, behandeld
      en beslist.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel11.1
  - number: 11.1.6
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet bij het College van Beroep voor het bedrijfsleven aanhangige
      zaken die betrekking hebben op het nemen van een besluit als bedoeld in het eerste lid, worden overeenkomstig de
      desbetreffende bepalingen van de wetten, bedoeld in het eerste lid, behandeld en beslist.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel11.1
  - number: '12.1'
    text: 'De volgende wetten worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel12.1
  - number: 12.1.a
    text: |-
      [Kaderwet diervoeders][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0015764
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel12.1
    references:
      - id: ref1
        bwb_id: BWBR0015764
  - number: 12.1.b
    text: |-
      [Diergeneesmiddelenwet][ref1].

      [ref1]: https://wetten.overheid.nl/BWBR0003818
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel12.1
    references:
      - id: ref1
        bwb_id: BWBR0003818
  - number: '12.2'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel12.2
  - number: '12.3'
    text: 'Deze wet wordt aangehaald als: Wet dieren.'
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel12.3
