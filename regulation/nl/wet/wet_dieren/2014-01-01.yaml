        artikel: '179'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '184'
  - number: 8.14.3
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel8.14
  - number: 8.44.1
    text: |-
      Onze Minister moedigt het opstellen en het toepassen aan van gidsen voor goede praktijken die aanbevelingen
      bevatten voor de naleving van het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel8.44
  - number: 8.44.2
    text: Nationale gidsen voor goede praktijken kunnen aan Onze Minister ter beoordeling worden voorgelegd.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel8.44
  - number: 8.44.3
    text: |-
      Op aanvragen om een beoordeling als bedoeld in het tweede lid, zijn [artikelen 7.6][ref1], [7.7][ref2] en
      [7.8][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel8.44
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: '8.46'
    text: |-
      Ingeval bij of krachtens deze wet wordt verwezen naar door de Voedsel- en Landbouworganisatie en de
      Wereldgezondheidsorganisatie tot stand gebrachte voedselstandaarden, codes voor goede praktijken of richtsnoeren,
      kan overtreding daarvan ook worden bestraft met een geldboete indien deze voedselstandaarden, codes voor goede
      praktijken of richtsnoeren in de Engelse taal zijn gesteld en bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel8.46
  - number: 9.1.1
    text: |-
      Onze Minister kan een heffing opleggen ter vergoeding van kosten overeenkomstig een door hem vastgesteld tarief ter
      zake van de volgende handelingen:
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel9.1
  - number: 9.1.1.a
    text: |-
      de behandeling van een aanvraag tot een bij of krachtens deze wet voorgeschreven vergunning, erkenning,
      toestemming, toelating, registratie, bewijs van vakbekwaamheid, goedkeuring of certificering dan wel van een
      aanvraag tot verlenging of wijziging daarvan;
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel9.1
  - number: 9.1.1.b
    text: |-
      de instandhouding van de bij of krachtens deze wet verleende vergunning, erkenning, toestemming, toelating,
      registratie, bewijs van vakbekwaamheid, goedkeuring of certificering;
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel9.1
  - number: 9.1.1.c
    text: |-
      de behandeling van een aanvraag tot ontheffing van het bij of krachtens deze wet bepaalde, dan wel van een aanvraag
      tot verlenging of wijziging van de ontheffing;
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel9.1
  - number: 9.1.1.d
    text: de identificatie en registratie van dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel9.1
  - number: 9.1.1.e
    text: |-
      keuringen als bedoeld in [artikel 2.10, derde lid, onderdeel p][ref1],
      [artikel 2.20, tweede lid, onderdeel k][ref2], en [artikel 3.2, tweede lid, onderdeel d][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel3
    url: https://wetten.overheid.nl/BWBR0030250/2014-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030250
