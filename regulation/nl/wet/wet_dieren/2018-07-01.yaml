  - number: '8.41'
    text: |-
      1 Het veterinair beroepscollege kan zich de stukken met betrekking tot een zaak die in behandeling is bij het
      veterinair tuchtcollege, doen overleggen en het tuchtcollege een termijn stellen, binnen welke de beslissing wordt
      genomen.

      2 Indien het veterinair tuchtcollege niet voldoet aan het bepaalde krachtens het eerste lid, kan het veterinair
      beroepscollege de behandeling van de zaak aan zich trekken en in hoogste ressort beslissen.

      3 De [artikelen 8.30][ref1], [8.31][ref2], [8.32][ref3], [8.34][ref4] en [8.40][ref5] zijn van overeenkomstige
      toepassing ingeval het tweede lid wordt toegepast.


