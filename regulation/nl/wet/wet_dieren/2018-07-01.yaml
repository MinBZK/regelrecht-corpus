        hoofdstuk: '7'
  - number: '7.9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling wordt voor de uitvoering van bindende
      onderdelen van EU-rechtshandelingen geregeld in welke gevallen mededeling wordt gedaan in de Staatscourant. Voorts
      kunnen bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling regels worden gesteld voor
      mededelingen in de Staatscourant van:

      a. een besluit tot verlening van een besluit als bedoeld in [artikel 7.1][ref1] alsmede tot wijziging of verlenging
      daarvan, dan wel van een melding;

      b. een besluit tot schorsing of intrekking van een besluit als bedoeld in [artikel 7.1][ref2];

      c. de gevallen waarin een besluit als bedoeld in [artikel 7.1][ref3] van rechtswege vervalt en met ingang van welke
      datum, en

      d. aantekeningen in een register als bedoeld in [artikel 7.2][ref4], alsmede de doorhaling daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7.1
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel7.1
