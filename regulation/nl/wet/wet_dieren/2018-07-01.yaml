  - number: '2.8'
    text: |-
      1 Het is verboden:

      a. lichamelijke ingrepen te verrichten;

      b. diergeneesmiddelen waarvoor geen vergunning als bedoeld in [artikel 2.19, eerste lid][ref1], is verstrekt, bij
      dieren toe te passen, of

      c. diergeneesmiddelen toe te passen in strijd met voorschriften en beperkingen als bedoeld in
      [artikel 2.19, derde lid, onderdeel a][ref2], die zijn verbonden aan de vergunning die ten behoeve van dat
      diergeneesmiddel is verstrekt.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing ten aanzien van:

      a. lichamelijke ingrepen waarvoor een diergeneeskundige noodzaak bestaat;

      b. bij of krachtens algemene maatregel van bestuur aangewezen lichamelijke ingrepen;

      c. overige bij of krachtens enig wettelijk voorschrift verplichte dan wel toegestane lichamelijke ingrepen, en

      d. het toepassen van diergeneesmiddelen als bedoeld in het eerste lid, onderdelen b en c, in bij of krachtens
      algemene maatregel van bestuur aangewezen gevallen.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen over het verrichten van diergeneeskundige handelingen.

      4 Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het derde lid, regels
      worden gesteld die betrekking hebben op onder meer:

      a. de verplichting om daarbij aangewezen diergeneeskundige handelingen te verrichten;

      b. de wijze waarop en de voorwaarden waaronder diergeneeskundige handelingen worden verricht;

      c. de aanwijzing van dieren waarbij of met betrekking tot welke de daarbij aangewezen diergeneeskundige handelingen
      mogen worden verricht;

      d. de inrichting en het gebruik van de ruimten waarin diergeneeskundige handelingen worden verricht;

      e. de hoedanigheid, het voorhanden of in voorraad hebben, het aanbieden, het afleveren, het verkopen, het kopen,
      het in de handel brengen, het in en buiten Nederland brengen en het gebruik van hulpmiddelen, waaronder apparatuur,
      die bij het verrichten van diergeneeskundige handelingen worden gebruikt, en

      f. het bijhouden, overleggen, controleren, bewaren en melden van gegevens over verrichte diergeneeskundige
      handelingen;

      g. de bedrijfsbegeleiding door een dierenarts.

      5 Voor de toepassing van het eerste lid en vierde lid en de daarop berustende bepalingen wordt met het toepassen
      van een diergeneesmiddel bij een dier gelijkgesteld het toepassen van een diergeneesmiddel bij materiaal van
      dierlijke herkomst, uitgezonderd cel- of weefselcultures.

      6 Het bij en krachtens het eerste tot en met het vijfde lid bepaalde is tevens van toepassing ten aanzien van
      andere dan gehouden dieren.

      7 Het bij en krachtens het eerste tot en met zesde lid bepaalde is tevens van toepassing ten aanzien van
      diervoeders met medicinale werking.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2.19
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2.19
