  - number: '10.1'
    text: |-
      1 Onze Minister kan, in voorkomend geval met inachtneming van EU-rechtshandelingen en voor zover het belang van de
      gezondheid van de mens, dieren of planten, het belang van het welzijn van dieren of het belang van het milieu zich
      daartegen niet verzetten, van het bepaalde bij of krachtens deze wet vrijstelling of ontheffing verlenen.

      2 Ingeval de vrijstelling of ontheffing betrekking heeft op een bepaling die geheel of mede strekt tot bescherming
      van de volksgezondheid, wordt zij in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport
      verleend.

      3 In afwijking van [artikel 7.1][ref1] zijn de [artikelen 7.3][ref2],
      [7.4, eerste lid, tweede lid, onderdeel a, en derde lid][ref3], [7.5, vierde lid][ref4],
      [7.6, eerste en tweede lid, onderdeel a][ref5], [7.8, eerste lid][ref6], en [7.9][ref7] niet van toepassing ten
      aanzien van het verlenen van een vrijstelling of ontheffing als bedoeld in het eerste lid.

      4 Indien Onze Minister voornemens is een vrijstelling te verlenen van het bepaalde in [artikel 2.23][ref8], wordt
      het ontwerp van de vrijstelling in de Staatscourant bekend gemaakt en aan een ieder de gelegenheid geboden om
      binnen vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister
      te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp van de vrijstelling aan beide kamers der Staten-
      Generaal overgelegd en medegedeeld aan direct belanghebbenden.

      5 Een vrijstelling als bedoeld in het eerste lid kan, onverminderd de bevoegdheid van Onze Minister, bij algemene
      maatregel van bestuur worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7.1
