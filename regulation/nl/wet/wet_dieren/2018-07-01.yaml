  - number: '3.4'
    text: |-
      1 In een werkgebied dat ingevolge [artikel 3.3, eerste lid][ref1], is vastgesteld, geeft de houder van ingevolge
      artikel 3.3, eerste lid, aangewezen dierlijke bijproducten dit materiaal aan bij, houdt het ter beschikking van, en
      staat het af aan, de ondernemer binnen wiens werkgebied het materiaal zich bevindt.

      2 De ondernemer voor wie een werkgebied is vastgesteld, haalt de bij hem aangegeven dierlijke bijproducten op en
      verwerkt of verwijdert deze.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van de in het eerste en tweede lid
      gestelde verplichtingen.

      4 Indien kadavers van gezelschapsdieren zijn aangewezen ingevolge [artikel 3.3, eerste lid][ref2], zijn het eerste
      tot en met het derde lid niet van toepassing op deze producten.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel3.3
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel3.3
