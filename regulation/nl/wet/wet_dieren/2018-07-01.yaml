  - number: '4.4'
    text: |-
      1 Aan personen die zijn opgenomen in een register als bedoeld in [artikel 4.3, eerste lid][ref1], is het recht
      voorbehouden om:

      a. in het openbaar aan te kondigen dat zij de diergeneeskundige handelingen waarop de registratie betrekking heeft
      beroepsmatig verrichten,

      b. een titel, aanduiding of vermelding te bezigen die bij het publiek redelijkerwijs de indruk kan wekken dat zij
      de diergeneeskundige handelingen waarop de registratie betrekking heeft beroepsmatig verrichten, en

      c. een titel als bedoeld in [artikel 4.5, tweede lid, onderdeel c][ref2], te bezigen of een aanduiding of
      vermelding te bezigen die bij het publiek redelijkerwijs de indruk kan wekken dat zij een dergelijke titel
      verkregen hebben.

      2 Bij ministeriële regeling kan worden bepaald dat het eerste lid niet van toepassing is op daarbij aangewezen
      personen, onder de daarbij gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4.3
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel4.5
