  - number: '3.6'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de
      vergoeding die een ondernemer voor het ophalen, het vervoeren, het verwerken of het verwijderen van ingevolge
      [artikel 3.3, eerste lid][ref1], aangewezen dierlijke bijproducten in rekening brengt aan degene die deze producten
      aanbiedt.

      2 De regels, bedoeld in het eerste lid, kunnen betrekking hebben op onder meer:

      a. de wijze waarop de vergoeding door de ondernemer wordt bepaald, en

      b. de maximum hoogte van de vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel3.3
