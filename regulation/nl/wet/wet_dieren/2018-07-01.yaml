  - number: '6.1'
    text: |-
      Dit hoofdstuk is van toepassing op:

      a. de uitvoering van EU-rechtshandelingen die krachtens de artikelen 43, 114, 207, 168, 169 of 192 van het Verdrag
      betreffende de werking van de Europese Unie zijn vastgesteld en

      b. de uitvoering van EU-rechtshandelingen die krachtens de onder a bedoelde rechtshandelingen zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel6.1
  - number: '6.2'
    text: |-
      1 Het is verboden in strijd te handelen met bij of krachtens algemene maatregel van bestuur of bij ministeriële
      regeling aangewezen voorschriften van EU-verordeningen betreffende onderwerpen waarop deze wet van toepassing is.

      2
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel6.2
  - number: '6.3'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van onderdelen van
      EU-rechtshandelingen waarin een EU-rechtshandeling een tot de overheid behorend orgaan of een door de overheid
      aangesteld persoon de opdracht geeft of de keuze laat.

      2 Tenzij bij wettelijk voorschrift anders is bepaald is Onze Minister bevoegd de besluiten te nemen waartoe een
      voorschrift van een EU-verordening als bedoeld in [artikel 6.2][ref1] een tot de overheid behorend orgaan of een
      door de overheid aangesteld persoon de opdracht geeft of de keuze laat.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel6.2
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel6.3
    references:
