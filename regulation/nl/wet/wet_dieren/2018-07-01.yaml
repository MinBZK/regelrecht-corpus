  - number: '2.17'
    text: |-
      1 Het is verboden in strijd met een bij of krachtens algemene maatregel van bestuur voor de uitvoering van een
      EU-richtlijn vastgesteld voorschrift, een handeling te verrichten die ertoe strekt diervoeders te bereiden, te
      bewerken, te verwerken, te verpakken, te etiketteren, in de handel te brengen, in of buiten Nederland te brengen,
      te vervoeren of aan te bieden, aan te prijzen, af te leveren, te ontvangen, voorhanden of in voorraad te hebben:

      a. die niet zuiver, deugdelijk, of van gebruikelijke handelskwaliteit zijn;

      b. die een gevaar opleveren voor de gezondheid van mens of dier of voor het milieu, indien niet correct gebruikt,
      of

      c. die de dierlijke productie ongunstig kunnen beïnvloeden.

      2 Het eerste lid is van overeenkomstige toepassing op andere stoffen of producten die bestemd zijn voor het
      voederen van dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel2.17
  - number: '2.18'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen met betrekking tot diervoeders en andere stoffen of producten die bedoeld zijn voor het
      voederen van dieren.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het eerste lid, regels
      worden gesteld die betrekking hebben op onder meer:

      a. een verbod op het bereiden, het bewerken, het verwerken, het verpakken, het etiketteren, het voorhanden of
      in voorraad hebben, het vervoeren, het afleveren of het in de handel brengen van bepaalde diervoeders, alsmede
      handelingen als bedoeld in [artikel 2.17][ref1], de bij deze handelingen te hanteren procedures en normen,
      waaronder de daarbij te verstrekken informatie;

      b. de hoedanigheid van diervoeders, waaronder de aanwezigheid van diergeneesmiddelen, substanties of andere stoffen
      die in diervoerders voorkomen;

      c. het bereiden, het bewerken en het verwerken van diervoeders;

      d. het verpakken en het etiketteren van diervoeders;

      e. het ontvangen, het voorhanden of in voorraad hebben, het in de handel brengen, het in of buiten Nederland
      brengen, het vervoeren, het afleveren, het aanbieden en het aanprijzen van diervoeders;

      f. ruimten waarin diervoeders worden bereid, bewerkt, verwerkt, verpakt, geëtiketteerd dan wel voorhanden of in
      voorraad worden gehouden, waaronder de inrichting en het gebruik van die ruimten;

      g. de hulpmiddelen, waaronder apparatuur, die bij het bereiden, het bewerken, het verwerken, het verpakken, het
      etiketteren, het bewaren en het vervoeren van diervoeders worden gebruikt;

      h. de kwalificaties van personen die zijn betrokken bij het bereiden, het bewerken, het verwerken, het verpakken of
      het vervoeren van, onderscheidenlijk de handel in diervoeders, waaronder hun opleiding;

      i. controles door bereiders, bewerkers, verwerkers, verpakkers, vervoerders of houders van, onderscheidenlijk
      handelaren in diervoeders, waaronder de wijze van controles en monsterneming, de vastlegging van controleresultaten
      alsmede het bewaren en overleggen van controleresultaten en monsters;

      j. het bijhouden, overleggen, controleren, bewaren en melden van gegevens over de voorraad, de bereiding, de
      bewerking, de verwerking, de ontvangst, de herkomst, de aflevering, de vernietiging, de bestemming, het verbruik en
      de vervoedering van diervoeders;

      k. hygiëne, het voorkomen van de verspreiding van dierziekten, zoönosen en ziekteverschijnselen, en het weren van
      ziekteverwekkers, en

      l. het zich ontdoen van resten en lege verpakkingen van diervoeders.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2.17
