      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het houden van keuringen,
      tentoonstellingen en andere gelegenheden of inrichtingen waar dieren worden gehouden en aan het publiek worden
      getoond wegens recreatieve, sportieve of opvoedkundige doeleinden.

      2 De regels, bedoeld in het eerste lid, kunnen onder meer betrekking hebben op:

      a. een verbod op het met bepaalde dieren deelnemen aan een tentoonstelling;

      b. een verbod op het toelaten van bepaalde dieren tot een tentoonstelling, een gelegenheid of een inrichting;

      c. hygiëne, het voorkomen van de verspreiding van dierziekten, zoönosen en ziekteverschijnselen, en het weren van
      ziekteverwekkers;

      d. de bevordering van de instandhouding van diersoorten, en

      e. informatie en educatie met betrekking tot de tentoongestelde diersoorten.

      3 Het is verboden deel te nemen aan tentoonstellingen of keuringen met dieren waarbij een bij [artikel 2.8][ref1]
      verboden lichamelijke ingreep is verricht.

      4 Het is verboden dieren waarbij een bij [artikel 2.8][ref2] verboden lichamelijke ingreep is verricht, tot een
      tentoonstelling of keuring toe te laten.


