    text: |-
      1 De [artikelen 8.25][ref1], [8.26][ref2], [8.27][ref3], [8.28][ref4], [8.29][ref5] en [8.34][ref6] zijn van
      overeenkomstige toepassing.

      2 De voorzitter kan bepalen dat het veterinaire beroepscollege bij een gezamenlijke behandeling van klachten als
      bedoeld in [artikel 8.28, eerste lid][ref7], zitting houdt in een van [artikel 8.37, eerste lid][ref8], afwijkende
      samenstelling, onder de volgende voorwaarden:

      a. het aantal leden dat zitting houdt bedraagt vijf of zeven;

      b. de samenstelling bestaat voor de meerderheid uit rechtsgeleerden, en

      c. voor elk van de beroepsgroepen tot welke degenen over wie is geklaagd behoren, neemt tenminste een lid deel dat
      tot diezelfde groep behoort.

      3 [Artikel 8.37, tweede lid][ref9], is van overeenkomstige toepassing op het tweede lid.


