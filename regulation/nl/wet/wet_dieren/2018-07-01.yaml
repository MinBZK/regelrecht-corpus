  - number: '8.40'
    text: |-
      1 De beslissing in beroep houdt de overweging in waarop zij steunt en wordt op schrift gesteld.

      2 De secretaris van het veterinair beroepscollege zendt van de beslissing onverwijld bij aangetekende brief
      afschrift:

      a. aan de persoon over wie geklaagd is;

      b. aan de klager;

      c. aan de ambtenaar, bedoeld in [artikel 8.15, tweede lid, onderdeel b][ref1], en

      d. aan het veterinair tuchtcollege.

      3 De secretaris van het veterinair beroepscollege verstrekt desgevraagd aan de gerechten en het openbaar ministerie
      inlichtingen omtrent beslissingen van het veterinair beroepscollege.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8.15
