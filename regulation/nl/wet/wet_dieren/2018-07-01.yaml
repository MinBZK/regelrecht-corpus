  - number: '8.45'
    text: |-
      1 Bij toepassing van [artikel 10.4][ref1] kan bij of krachtens algemene maatregel van bestuur dan wel bij
      ministeriële regeling worden bepaald dat tuchtrechtelijke maatregelen worden gesteld op overtreding van de bij die
      maatregel of regeling genoemde nadere regelen die door het bestuur van het betrokken productschap of bedrijfschap
      krachtens artikel 10.4, tweede lid, bij verordening als bedoeld in 10.4, derde lid, zijn of worden gesteld, voor
      zover handelen in strijd met deze nadere regelen als overtreding strafbaar is gesteld.

      2 De [artikelen 1, onderdeel b][ref2], [2][ref3], [3 tot en met 6][ref4], [15 tot en met 44, eerste lid][ref5],
      en [46 van de Wet tuchtrechtspraak bedrijfsorganisatie 2004][ref6] zijn van overeenkomstige toepassing, met dien
      verstande dat de instemming, bedoeld in artikel 46 van die wet wordt verkregen van Onze Minister.

      3 Onverminderd [artikel 8.1, eerste lid][ref7], kan bij of krachtens algemene maatregel van bestuur, dan wel
      bij ministeriële regeling, worden bepaald dat met het toezicht op de naleving van de nadere regels waarvoor
      tuchtrechtelijke maatregelen zijn of worden opgelegd, de bij besluit van het betrokken bedrijfslichaam of
      samenwerkingslichaam aangewezen personen zijn belast. Dit besluit behoeft de goedkeuring van Onze Minister. Onze
      Minister kan het betrokken bedrijfslichaam of samenwerkingslichaam een aanwijzing geven omtrent het aanwijzen van
      toezichthouders en de wijze waarop toezicht wordt uitgeoefend.


