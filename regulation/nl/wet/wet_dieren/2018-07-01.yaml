  - number: '5.14'
    text: |-
      De kosten van de maatregelen getroffen krachtens deze paragraaf komen ten laste van de houder van het dier, het
      product, het diervoeder, het diergeneesmiddel of de samenstelling van een diervoeder en een diergeneesmiddel, dan
      wel de exploitant van het bedrijf, de inrichting dan wel de locatie.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel5.14
  - number: '5.15'
    text: |-
      1 Eenieder die diervoeders, diergeneesmiddelen, of samenstellingen daarvan of dierlijke producten bereidt,
      bewerkt, verwerkt, voorhanden of in voorraad heeft, opslaat, verpakt, in de handel brengt, verhandelt, vervoert,
      in of buiten Nederland brengt, vervoedert of onderzoekt, stelt onverwijld Onze Minister op de hoogte indien hij
      constateert of vermoedt dat deze producten niet voldoen aan het bepaalde bij of krachtens deze wet of de gezondheid
      van mens of dier of het milieu in gevaar kunnen brengen, alsmede van de maatregelen die hij heeft getroffen ter
      voorkoming van risico’s voor de gezondheid van mens of dier of voor het milieu.

      2 Het eerste lid is van overeenkomstige toepassing op grondstoffen voor de bereiding van de in het eerste lid
      bedoelde diervoeders, diergeneesmiddelen, of samenstellingen daarvan en dierlijke producten.

      3 De verplichting, bedoeld in het eerste lid, is van overeenkomstige toepassing op dierenartsen en andere
      personen als bedoeld in [artikel 4.3, eerste lid][ref1] en op degene aan wie een vergunning als bedoeld in
      [artikel 2.19, eerste lid][ref2], is verleend.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het verstrekken van de in het eerste lid
      bedoelde inlichtingen en over de maatregelen die ter voorkoming van risico’s voor de gezondheid van mens of dier of
      voor het milieu zijn ondernomen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4.3
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2.19
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel5.15
