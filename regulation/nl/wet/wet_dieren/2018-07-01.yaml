  - number: '10.11'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel10.11
  - number: '11.1'
    text: |-
      1 Besluiten, niet inhoudende een algemeen verbindend voorschrift, genomen bij of krachtens de
      [Gezondheids- en welzijnswet voor dieren][ref1], de [Kaderwet diervoeders][ref2], de [Diergeneesmiddelenwet][ref3],
      de [Wet op de dierenbescherming][ref4], de [Wet op de uitoefening van de diergeneeskunde 1990][ref5] of, voor zover
      zij betrekking hebben op onderwerpen waarop deze wet van toepassing is, krachtens de [Landbouwkwaliteitswet][ref6]
      of de [Landbouwwet][ref7], die gelden op het tijdstip van inwerkingtreding van deze wet, worden geacht te zijn
      genomen op grond van deze wet, onder dezelfde voorschriften, beperkingen en voorwaarden. Bij of krachtens algemene
      maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot voorschriften, beperkingen en
      voorwaarden voor zover de uitvoering van bindende onderdelen van EU-rechtshandelingen dit vereist.

      2 Meldingen, gedaan ter voldoening aan verplichtingen bij of krachtens de
      [Gezondheids- en welzijnswet voor dieren][ref8], de [Kaderwet diervoeders][ref9], de [Diergeneesmiddelenwet][ref10],
      de [Wet op de dierenbescherming][ref11], de [Wet op de uitoefening van de diergeneeskunde 1990][ref12]
      of, voor zover zij betrekking hebben op onderwerpen waarop deze wet van toepassing is, krachtens de
      [Landbouwkwaliteitswet][ref13] of de [Landbouwwet][ref14], worden geacht te zijn gedaan op grond van deze wet. Bij
      of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot voorschriften,
      beperkingen en voorwaarden voorzover de uitvoering van bindende onderdelen van EU-rechtshandelingen dit vereist.

      3 Ten aanzien van besluiten als bedoeld in het eerste lid doet Onze Minister per soort, onderverdeeld naar de
      bepaling of bepalingen waarop de besluiten berustten, mededeling in de Staatscourant van de bepaling of bepalingen
      waarop zij vanaf het moment van inwerkingtreding van de wet worden geacht te berusten.

      4 De op het tijdstip van inwerkingtreding van deze wet aanhangige aanvragen, verzoeken tot het nemen van een
      besluit als bedoeld in het eerste lid, zijn aanhangig in de staat, waarin zij zich op dat moment bevinden en
      worden vanaf het tijdstip van inwerkingtreding van deze wet overeenkomstig het bepaalde bij en krachtens deze wet
      behandeld.

      5 De op het tijdstip van inwerkingtreding van deze wet aanhangige bezwaarschriften die betrekking hebben op het
      nemen van een besluit als bedoeld in het eerste lid, zijn aanhangig in de staat, waarin zij zich op dat moment
      bevinden en worden overeenkomstig de desbetreffende bepalingen van de wetten, bedoeld in het eerste lid, behandeld
      en beslist.

      6 De op het tijdstip van inwerkingtreding van deze wet bij het College van Beroep voor het bedrijfsleven aanhangige
      zaken die betrekking hebben op het nemen van een besluit als bedoeld in het eerste lid, worden overeenkomstig de
      desbetreffende bepalingen van de wetten, bedoeld in het eerste lid, behandeld en beslist.

      7 Dierenartsen die op het tijdstip van inwerkingtreding van deze wet zijn
      ingeschreven in het register van praktizerende dierenartsen, bedoeld in
      [artikel 10, eerste lid, van de Wet op de uitoefening van de diergeneeskunde 1990][ref15], worden geacht te zijn
      ingeschreven in het register, bedoeld in [artikel 4.3, eerste lid][ref16].

      8 [Artikel 5.13][ref17] is van overeenkomstige toepassing op dieren die in strijd met
      [artikel 73 van de Gezondheids- en welzijnswet voor dieren][ref18], zoals dat luidde bij inwerkingtreding van deze
      wet, zijn gefokt.


