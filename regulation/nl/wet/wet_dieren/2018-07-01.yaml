  - number: '2.21'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur wordt geregeld dat daarbij aangewezen diergeneesmiddelen of
      diervoeders met medicinale werking uitsluitend worden afgeleverd aan, onderscheidenlijk in voorraad of voorhanden
      worden gehouden door daarbij aangewezen personen, onder de daarbij gestelde voorwaarden.

      2 Een aanwijzing als bedoeld in het eerste lid vindt uitsluitend plaats ingeval een EU-rechtshandeling daartoe
      verplicht, of ingeval de diergeneesmiddelen of diervoeders met medicinale werking zonder tussenkomst van een
      dierenarts een gevaar voor de gezondheid van mens of dier of voor het milieu kunnen opleveren.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel2.21
  - number: '2.22'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen met betrekking tot ziekteverwekkers.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het eerste lid, regels
      worden gesteld die betrekking hebben op onder meer:

      a. het bereiden, het bewerken, het verwerken en het vermengen van ziekteverwekkers;

      b. het voorhanden of in voorraad hebben, het vervoeren van ziekteverwekkers en het in de handel brengen van
      ziekteverwekkers door personen die immunologische diergeneesmiddelen of biologische diagnostica bereiden;

      c. het weren, het voorkomen van verspreiding en het vernietigen van ziekteverwekkers;

      d. het voeren van een administratie en het verstrekken van gegevens omtrent ziekteverwekkers, en

      e. een verbod op het vervoeren van bepaalde ziekteverwekkers.

      3 Bij ministeriële regeling kunnen ziekteverwekkers worden aangewezen waarvan het voorhanden of in voorraad houden
      uitsluitend is toegestaan aan:

      a. instellingen van wetenschap of onderzoek die bij ministeriële regeling zijn aangewezen in overeenstemming met
      Onze Minister wie het mede aangaat, voor zover de ziekteverwekkers zijn bestemd voor gebruik voor wetenschappelijke
      doeleinden, of

      b. bereiders van sera, entstoffen of biologische diagnostica, voor zover de ziekteverwekkers zijn bestemd voor de
      bereiding van, of de controle op die producten.

      4 Het derde lid is niet van toepassing ten aanzien van ziekteverwekkers, bestemd voor de bereiding van of de
      controle op therapeutische of diagnostische middelen die zijn bestemd voor toepassing bij onderzoek of behandeling
      van de mens.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel2.22
  - number: '2.23'
    text: |-
      1 Het is verboden om uitsluitend voor sportprestaties of vermaak het genetisch materiaal van dieren te wijzigen op
      een wijze die voorbij gaat aan de natuurlijke barrières van geslachtelijke voortplanting en van recombinatie.

      2 Het is zonder vergunning verboden:

      a. het genetisch materiaal van dieren te wijzigen op een wijze die voorbij gaat aan de natuurlijke barrières van
      geslachtelijke voortplanting en van recombinatie;

      b. biotechnologische technieken bij een dier of een dierlijk embryo toe te passen.

      3 Het tweede lid is niet van toepassing op handelingen als bedoeld in het tweede lid voor zover die handelingen
      worden verricht ten behoeve van biomedisch onderzoek.

      4 Onze Minister verleent een vergunning slechts indien naar zijn oordeel:

      a. de handelingen geen onaanvaardbare gevolgen hebben voor de gezondheid of het welzijn van dieren; en

      b. tegen de handelingen geen ethische bezwaren bestaan.

      5 In afwijking van [artikel 7.7, eerste lid][ref1], vraagt Onze Minister telkenmale omtrent een verzoek tot
      verlening van een vergunning als bedoeld in het tweede lid advies aan een door hem met betrekking tot dat verzoek
      in te stellen commissie van onafhankelijke deskundigen.

      6 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref2] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref3] niet van toepassing op een aanvraag tot een vergunning
      als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7.7
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
