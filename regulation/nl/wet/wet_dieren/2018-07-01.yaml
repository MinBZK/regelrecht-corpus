        artikel: '6.2'
        hoofdstuk: '6'
  - number: '6.4'
    text: |-
      1 In afwijking van het bepaalde in de [hoofdstukken 2][ref1] en [3][ref2] kan Onze Minister regels stellen voor
      de uitvoering van een bindend onderdeel van een EU-verordening of een EU-besluit, voor zover de EU-verordening
      of het EU-besluit onderwerpen betreft, bedoeld in de [artikelen 2.2, tiende lid][ref3], [2.3, vierde lid][ref4],
      [2.4, tweede of derde lid][ref5], [2.5, tweede lid][ref6], [2.6, tweede of derde lid][ref7],
      [2.7, tweede lid][ref8], [2.8, vierde lid][ref9], [2.10, derde lid][ref10], [2.15, tweede of vierde lid][ref11],
      [2.16, tweede lid][ref12], [2.18, tweede lid][ref13], [2.19, tweede, vierde en vijfde lid][ref14],
      [2.20, tweede lid][ref15], [2.21, eerste lid][ref16], [2.22, tweede lid][ref17], [2.23][ref18],
      [2.25, derde lid][ref19], [3.1, tweede lid][ref20], [3.2, tweede lid][ref21], [4.1, derde en vijfde lid][ref22],
      [4.5, tweede lid][ref23], [5.4, tweede lid][ref24], [5.6, vierde en vijfde lid][ref25],
      [7.2, eerste tot en met derde lid][ref26], [7.3, derde lid][ref27], [7.4, eerste lid][ref28],
      [7.6, eerste lid][ref29], [7.8][ref30], [10.1][ref31] en [10.2][ref32].

      2 [Artikel 7.3, tweede lid][ref33], is van overeenkomstige toepassing ten aanzien van een ministeriële regeling als
      bedoeld in het eerste lid.


