  - number: '8.36'
    text: |-
      1 Het veterinair beroepscollege is gevestigd in Den Haag.

      2 Het veterinair beroepscollege is belast met:

      a. de behandeling in beroep van zaken over handelen in strijd met [artikel 4.2][ref1], en

      b. het waken tegen nodeloze vertraging van het onderzoek door het veterinair tuchtcollege.

      3 Het veterinair beroepscollege bestaat uit de volgende leden:

      a. drie rechtsgeleerden waarvan één voorzitter is;

      b. twee praktiserende dierenartsen, en

      c. een door Onze Ministers te bepalen aantal andere personen als bedoeld in [artikel 4.1, eerste lid][ref2], dat op
      grond van dat artikellid zijn toegelaten tot het beroepsmatig verrichten van diergeneeskundige handelingen en als
      zodanig werkzaam zijn.

      4 Het lidmaatschap van het veterinair beroepscollege is niet verenigbaar met het lidmaatschap van het veterinair
      tuchtcollege.

      5 De [artikelen 8.16, vierde en vijfde lid][ref3], [8.17][ref4], [8.18][ref5], [8.19][ref6],
      [8.20, eerste lid][ref7], [8.21][ref8] en [8.22][ref9] zijn van overeenkomstige toepassing.


