  - number: '10.5'
    text: |-
      1 Indien in het belang van de gezondheid van mens of dier of het welzijn van het dier naar het oordeel van Onze
      Minister een onverwijlde voorziening noodzakelijk is, kan hij in de onderwerpen die op grond van deze wet bij
      algemene maatregel van bestuur worden bepaald, bij regeling voorzien.

      2 De regeling vervalt een jaar nadat zij in werking is getreden, of, indien binnen die termijn een algemene
      maatregel van bestuur ter vervanging van die regeling in werking is getreden, op het moment waarop de maatregel in
      werking treedt. De termijn kan door Onze Minister eenmaal met ten hoogste een jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel10.5
  - number: '10.6'
    text: |-
      1 Deze wet treedt niet in hetgeen bij of krachtens de [Wet op de dierproeven][ref1] is bepaald, met dien verstande
      dat onverminderd van kracht blijft hetgeen is bepaald bij of krachtens de [artikelen 2.2][ref2], [2.6][ref3] en
      [2.23][ref4].

      2 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt het verrichten van dierproeven in de
      zin van de [Wet op de dierproeven][ref5], voor zover laatstgenoemde wet op deze handelingen van toepassing is, niet
      aangemerkt als het verrichten van diergeneeskundige handelingen.


