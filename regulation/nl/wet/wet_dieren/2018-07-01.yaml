  - number: '2.3'
    text: |-
      1 Het is verboden dieren te gebruiken met het oog op de productie van dierlijke producten.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing op dieren behorende tot bij of krachtens algemene
      maatregel van bestuur aangewezen diersoorten of diercategorieën.

      3 Bij of krachtens algemene maatregel van bestuur worden in het belang van de bescherming van het welzijn en de
      gezondheid van dieren regels gesteld voor de uitvoering van bindende onderdelen van EU-rechtshandelingen over de
      doeleinden of activiteiten waarvoor dieren, diersoorten of diercategorieën kunnen worden gebruikt.

      4 Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het derde lid, regels
      worden gesteld die betrekking hebben op onder meer:

      a. een verbod op het gebruik van bepaalde dieren, diersoorten of diercategorieën voor bepaalde doelen of
      activiteiten, en

      b. het toestaan van het gebruik van bepaalde dieren, diersoorten of diercategorieën voor bepaalde doelen
      of activiteiten onder bij of krachtens de in het derde lid bedoelde algemene maatregel van bestuur gestelde
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel2.3
  - number: '2.5'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen over het vervoer van dieren behorende tot bij die maatregel aangewezen diersoorten of
      diercategorieën.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het eerste lid, regels
      worden gesteld voor bij deze maatregel aangewezen diersoorten of diercategorieën die betrekking hebben op onder
      meer:

      a. een verbod op het vervoeren van bepaalde dieren;

      b. de bij de te vervoeren dieren te verrichten onderzoeken;

      c. het bijeenbrengen, aanvoeren en afvoeren van dieren;

      d. de bewijsstukken die de dieren tijdens het vervoer vergezellen;

      e. de wijze van vervoer;

      f. de duur en de afstand van het vervoer, met inbegrip van rustpauzes;

      g. het in-, bij-, uit- en overladen van dieren;

      h. de beladingsdichtheid van vervoermiddelen;

      i. het verzegelen of merken van vervoermiddelen;

      j. voorwerpen die ten behoeve van het vervoer van dieren worden gebruikt;

      k. de verzorging, voedering en drenking van dieren tijdens het vervoer;

      l. de over het vervoer bij te houden gegevens;

      m. de reiniging en ontsmetting van vervoermiddelen, en de plaatsen of inrichtingen waar dit plaatsvindt;

      n. hygiëne, het voorkomen van de verspreiding van dierziekten, zoönosen en ziekteverschijnselen, en het weren van
      ziekteverwekkers, en

      o. de vakbekwaamheid van degene die de dieren vervoert of die bij het vervoer betrokken is.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel2.5
  - number: '2.6'
    text: |-
      1

      2 Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het eerste lid, regels
      worden gesteld voor bij deze maatregel aangewezen diersoorten of diercategorieën die betrekking hebben op onder
      meer:

      a. een verbod op het fokken of het voor de fok gebruiken van:

      1°. dieren die beschikken over een bepaalde aandoening die, of een uiterlijk kenmerk dat, de gezondheid of het
      welzijn van het dier of de nakomelingen van het dier kan aantasten;

      2°. dieren die een gevaar kunnen opleveren voor de veiligheid van mens of dier, en

      3°. andere bij of krachtens algemene maatregel van bestuur aangewezen dieren, diersoorten of diercategorieën;

      b. de methode van fokken, waaronder een verbod op bepaalde methoden van fokken;

      c. het voorafgaand aan het fokken door de fokker te verrichten of te doen verrichten onderzoek bij dieren
      waarmee wordt gefokt naar de aanwezigheid van aandoeningen die de gezondheid of het welzijn van de dieren of de
      nakomelingen van die dieren kunnen aantasten;

      d. hygiëne, het voorkomen van de verspreiding van dierziekten, zoönosen en ziekteverschijnselen, en het weren van
      ziekteverwekkers;

      e. het aantal nesten dat dieren gedurende een bepaalde periode krijgen, en

      f. de bij te houden en over te leggen gegevens.

      3
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel2.6
  - number: '2.7'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen over het verkopen, het ten verkoop in voorraad hebben, het ten verkoop aanbieden, het
      kopen, het verhuren, het afleveren, het in de handel brengen en het in of buiten Nederland brengen van dieren
      behorende tot bij die maatregel aangewezen diersoorten of diercategorieën.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het eerste lid, regels
      worden gesteld die betrekking hebben op onder meer:

      a. een verbod op het verkopen, het voor de verkoop in voorraad hebben, het voor de verkoop aanbieden, het kopen,
      het verhuren, het afleveren, het in de handel brengen of het in of buiten Nederland brengen van:

      1°. dieren waarbij in strijd met het bepaalde bij of krachtens [artikel 2.25][ref1] substanties zijn toegepast, en

      2°. andere aangewezen dieren, diersoorten of diercategorieën;

      b. de afkomst van de dieren;

      c. de documenten die de dieren vergezellen of die worden overgelegd;

      d. de gezondheidstoestand van de dieren;

      e. de bij de dieren te verrichten onderzoeken;

      f. degene die de dieren in de handel brengt, verkoopt, voor de verkoop in voorraad heeft, voor de verkoop aanbiedt,
      koopt, verhuurt of aflevert;

      g. de bij te houden en over te leggen gegevens;

      h. de bedrijfsruimten;

      i. de hoedanigheid van de dieren;

      j. de herkomst en bestemming van de dieren;

      k. hygiëne, het voorkomen van de verspreiding van dierziekten, zoönosen en ziekteverschijnselen en het weren van
      ziekteverwekkers;

      l. de vakbekwaamheid van degene die de dieren in de handel brengt, verkoopt, voor de verkoop in voorraad heeft,
      voor de verkoop aanbiedt, koopt, verhuurt of aflevert, en

      m. een verbod op het verkopen van bij of krachtens die maatregel aangewezen diersoorten of diercategorieën aan een
      persoon van wie niet is vastgesteld dat deze een in die maatregel genoemde leeftijd heeft bereikt.

      3 Het is verboden dieren waarbij een bij [artikel 2.8][ref2] verboden lichamelijke ingreep is verricht voor de
      verkoop in voorraad te hebben, voor de verkoop aan te bieden, te verkopen en te kopen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2.25
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2.8
