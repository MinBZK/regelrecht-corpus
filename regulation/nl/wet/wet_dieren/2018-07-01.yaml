  - number: '8.39'
    text: |-
      1 Het veterinair beroepscollege kan in beroep de volgende beslissingen nemen:

      a. degene die beroep heeft ingesteld niet-ontvankelijk verklaren;

      b. het beroep verwerpen, of

      c. het beroep gegrond verklaren.

      2 Indien het veterinair beroepscollege het beroep gegrond verklaart dan wel bij de behandeling van het beroep
      op andere dan de in het beroepschrift aangevoerde gronden tot het oordeel komt, dat de in eerste aanleg gegeven
      beslissing niet kan worden gehandhaafd, vernietigt het deze beslissing en doet de zaak zelf af.

      3 De [artikelen 8.30][ref1], [8.31][ref2] en [8.32][ref3] zijn van overeenkomstige toepassing ingeval het
      veterinair beroepscollege op grond van het tweede lid de zaak zelf afdoet.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8.30
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8.31
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel8.32
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.39
