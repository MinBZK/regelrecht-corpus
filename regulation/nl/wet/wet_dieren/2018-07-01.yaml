        artikel: '246'
  - number: '8.11'
    text: |-
      1 Gedragingen in strijd met de voorschriften vastgesteld bij of krachtens de [artikelen 1.4][ref1],
      [2.1, eerste lid][ref2], [2.2, zesde lid, eerste volzin, en achtste lid][ref3],
      [2.8, eerste lid, onderdeel a][ref4], derde en vierde lid voor wat betreft de onderwerpen, bedoeld in het vierde
      lid, onderdelen a, b en c, [2.9, eerste lid][ref5], [2.10, eerste lid][ref6], en [2.14, eerste lid][ref7],
      of een of meer van de voornoemde bepalingen in samenhang met [artikel 6.2, eerste lid][ref8],
      [artikel 6.4, eerste lid][ref9], of [artikel 7.5, derde lid][ref10], zijn misdrijven.

      2 Gedragingen in strijd met de voorschriften vastgesteld bij of krachtens de [artikelen 2.1, zesde lid][ref11],
      [2.2, eerste lid, negende en tiende lid][ref12] voor wat betreft de onderwerpen, bedoeld in het tiende
      lid, onderdelen b, c en d, en onderdeel r, voor zover dat onderdeel betrekking heeft op regels als bedoeld
      in de onderdelen b, c en d, [2.3, derde en vierde lid][ref13], [2.4, eerste, tweede en derde lid][ref14],
      [2.8, derde en vierde lid][ref15] voor wat betreft de onderwerpen, bedoeld in het vierde lid,
      onderdelen d en e, [2.9, tweede, vierde en vijfde lid][ref16], [2.14, tweede lid][ref17],
      [2.15, eerste, tweede, derde, vijfde en zesde lid][ref18], en [4.4, eerste lid][ref19], of een of meer van de
      voornoemde bepalingen in samenhang met [artikel 6.2, eerste lid][ref20], [artikel 6.4, eerste lid][ref21], of
      [artikel 7.5, derde lid][ref22], zijn overtredingen.


