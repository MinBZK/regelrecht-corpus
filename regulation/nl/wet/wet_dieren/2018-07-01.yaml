  - number: '2.20'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen met betrekking tot diergeneesmiddelen of diervoeders met medicinale werking.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het eerste lid, regels
      worden gesteld die betrekking hebben op onder meer:

      a. het bereiden, het bewerken, het verwerken, het verpakken, het etiketteren, het in de handel brengen, het in
      of buiten Nederland brengen, het vervoeren, het aanbieden, het aanprijzen, het afleveren, het ontvangen, het
      voorhanden of in voorraad hebben van:

      1°. diergeneesmiddelen, of

      2°. substanties die bij de bereiding van diergeneesmiddelen worden gebruikt;

      b. een verbod op het bereiden, het bewerken, het verwerken, het verpakken, het etiketteren, het afleveren, het
      ontvangen, het voorhanden of in voorraad hebben, het in de handel brengen, het in of buiten Nederland brengen,
      het vervoeren, het afleveren, het aanbieden of het aanprijzen van diergeneesmiddelen of substanties als bedoeld
      in onderdeel a, onder 2°, alsmede handelingen als bedoeld in [artikel 2.19, eerste lid][ref1], en de bij die
      handelingen te hanteren procedures en normen, waaronder de te verstrekken informatie;

      c. het uit de handel nemen en het vernietigen van diergeneesmiddelen;

      d. het zich ontdoen van resten en lege verpakkingen van diergeneesmiddelen;

      e. ruimten waarin diergeneesmiddelen worden bereid, bewerkt, verwerkt, verpakt, geëtiketteerd, bewaard dan wel
      voorhanden of in voorraad gehouden, waaronder de inrichting en het gebruik van die ruimten;

      f. de hulpmiddelen, waaronder apparatuur, die bij het bereiden, het bewerken, het verwerken, het verpakken, het
      etiketteren, het bewaren en het vervoeren van diergeneesmiddelen worden gebruikt;

      g. de kwalificaties van personen die zijn betrokken bij het bereiden, het bewerken, het verwerken, het verpakken of
      het vervoeren van, onderscheidenlijk de handel in diergeneesmiddelen, waaronder hun opleiding, alsmede de zo nodig
      tegen deze personen te nemen maatregelen;

      h. controles door bereiders, bewerkers, verwerkers, verpakkers, vervoerders of houders van, onderscheidenlijk
      handelaren in diergeneesmiddelen, waaronder de wijze van controles en monsterneming, de vastlegging van
      controleresultaten alsmede het bewaren en overleggen van controleresultaten en monsters;

      i. het aantekening houden en melden van bijwerkingen van een diergeneesmiddel alsmede de inrichting van een
      diergeneesmiddelenbewakingssysteem;

      j. het bijhouden, overleggen, controleren, bewaren en melden van gegevens over de voorraad, de bereiding, de
      bewerking, de verwerking, de ontvangst, de herkomst, de aflevering, de vernietiging, de bestemming en het verbruik
      van diergeneesmiddelen;

      k. de keuring van partijen diergeneesmiddelen, en

      l. hygiëne, het voorkomen van de verspreiding van dierziekten, zoönosen en ziekteverschijnselen, en het weren van
      ziekteverwekkers.

      3 Het eerste en het tweede lid zijn van overeenkomstige toepassing op bij ministeriële regeling aangewezen
      substanties die geen diergeneesmiddel zijn maar wel als zodanig kunnen worden gebruikt, of diervoeders met
      medicinale werking.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2.19
