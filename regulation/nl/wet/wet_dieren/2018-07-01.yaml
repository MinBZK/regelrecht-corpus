  - number: '8.12'
    text: |-
      1 Gedragingen in strijd met de voorschriften vastgesteld bij of krachtens de [artikelen 2.1 eerste lid][ref1],
      [2.2, zesde lid, eerste volzin, en achtste lid][ref2], [2.10, eerste lid][ref3] en [2.14, eerste lid][ref4],
      of een of meer van de voornoemde bepalingen in samenhang met [artikel 6.2, eerste lid][ref5],
      [artikel 6.4, eerste lid][ref6], of [artikel 7.5, derde lid][ref7], worden gestraft met gevangenisstraf van ten
      hoogste drie jaren of een geldboete van de vierde categorie.

      2 Gedragingen in strijd met de voorschriften vastgesteld bij of krachtens de
      [artikelen 2.8, eerste lid, onderdeel a][ref8], en derde en vierde lid voor wat betreft de onderwerpen,
      bedoeld in het vierde lid, onderdelen a, b en c, of een of meer van de voornoemde bepalingen in samenhang met
      [artikel 6.2, eerste lid][ref9], [artikel 6.4, eerste lid][ref10], of [artikel 7.5, derde lid][ref11], voor
      zover deze gedragingen plaatsvinden anders dan in de uitoefening van een bedrijf waar dieren van krachtens
      [artikel 2.3, tweede lid][ref12], aangewezen soorten of categorieën, worden gehouden, worden gestraft met
      gevangenisstraf van ten hoogste drie jaren of een geldboete van de vierde categorie.

      3 Gedragingen in strijd met de voorschriften vastgesteld bij of krachtens de [artikelen 1.4][ref13],
      [2.1, zesde lid][ref14], [2.3, derde en vierde lid][ref15], [2.8, derde en vierde lid][ref16] voor wat betreft
      de onderwerpen bedoeld in het vierde lid, onderdelen d en e, [2.9, eerste, tweede, vierde en vijfde lid][ref17],
      [2.14, tweede lid][ref18], [2.15, eerste, tweede, derde, vijfde en zesde lid][ref19], en [4.4, eerste lid][ref20],
      of een of meer van de voornoemde bepalingen in samenhang met [artikel 6.2, eerste lid][ref21],
      [artikel 6.4, eerste lid][ref22], of [artikel 7.5, derde lid][ref23], worden gestraft met een hechtenis van ten
      hoogste zes maanden of een geldboete van de derde categorie.

      4 Gedragingen in strijd met de voorschriften vastgesteld bij of krachtens [artikel 2.2, eerste lid][ref24],
      negende en tiende lid voor wat betreft de onderwerpen, bedoeld in het tiende lid, onderdelen b, c en d,
      en [2.4, eerste, tweede en derde lid][ref25], of een of meer van de voornoemde bepalingen in samenhang met
      [artikel 6.2, eerste lid][ref26], [artikel 6.4, eerste lid][ref27], of [artikel 7.5, derde lid][ref28], voor
      zover deze gedragingen plaatsvinden anders dan in de uitoefening van een bedrijf waar dieren van krachtens
      [artikel 2.3, tweede lid][ref29], aangewezen soorten of categorieën, worden gehouden, worden gestraft met een
      hechtenis van ten hoogste zes maanden of een geldboete van de derde categorie.

      5 Indien gedragingen in strijd met de voorschriften vastgesteld bij of krachtens [artikel 2.15, derde lid][ref30],
      worden gepleegd in verband met een paardenren of harddraverij met betrekking tot welke een totalisator als bedoeld
      in [artikel 23, tweede lid, van de Wet op de kansspelen][ref31] is georganiseerd, wordt de in het derde lid
      voorziene hechtenis met een derde verhoogd.

      6 Indien gedragingen in strijd met de voorschriften vastgesteld bij of krachtens de [artikelen 1.4][ref32],
      [2.1, eerste lid][ref33], [2.2, achtste lid][ref34], [2.8, eerste lid, onderdeel a][ref35], en derde en vierde lid
      voor wat betreft de onderwerpen, bedoeld in het vierde lid, onderdelen a, b en c, in de uitoefening van beroep of
      bedrijf zijn gepleegd, kan een geldboete worden opgelegd van de naast hogere categorie.


