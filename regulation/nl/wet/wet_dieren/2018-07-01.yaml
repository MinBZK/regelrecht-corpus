  - number: '8.20'
    text: |-
      1 De voorzitter van het veterinair tuchtcollege is bevoegd ambtshalve aan de leden en hun plaatsvervangers, die
      de waardigheid van hun ambt, hun ambtsbezigheden of ambtsplichten verwaarlozen of die zich schuldig maken aan
      overtreding van [artikel 8.21][ref1], de nodige waarschuwing te doen, na hen in de gelegenheid te hebben gesteld om
      te worden gehoord.

      2 De voorzitter van het veterinair beroepscollege, bedoeld in [artikel 8.36][ref2], heeft gelijke bevoegdheid ten
      aanzien van de voorzitter van het veterinair tuchtcollege en diens plaatsvervangers.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8.21
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8.36
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.20
