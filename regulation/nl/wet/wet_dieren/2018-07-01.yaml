  - number: '8.24'
    text: |-
      1 Het veterinair tuchtcollege houdt zitting in een samenstelling bestaande uit vijf leden, te weten de voorzitter,
      alsmede:

      a. vier dierenartsen, indien de klacht gericht is tegen een dierenarts, en

      b. twee dierenartsen en twee leden van dezelfde beroepsgroep als de beklaagde, indien de klacht is gericht tegen
      een andere persoon als bedoeld in [artikel 4.1, eerste lid][ref1], die op grond van dat artikellid is toegelaten.

      2 De voorzitter kan bepalen dat het veterinair tuchtcollege bij een gezamenlijke behandeling van klachten als
      bedoeld in [artikel 8.28, eerste lid][ref2], zitting houdt in een van het eerste lid afwijkende samenstelling,
      onder de volgende voorwaarden:

      a. het aantal leden dat zitting houdt bedraagt maximaal vijf, en

      b. voor elk van de beroepsgroepen tot welke degenen over wie is geklaagd behoren, neemt ten minste een lid deel dat
      tot diezelfde groep behoort.

      3 Bij algemene maatregel van bestuur kan in afwijking van het eerste lid, aanhef en onderdeel b, of het tweede lid,
      worden bepaald dat bij ontstentenis van benoemde leden van dezelfde beroepsgroep als de beklaagde, dierenartsen
      zitting nemen in plaats van die leden.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8.28
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.24
