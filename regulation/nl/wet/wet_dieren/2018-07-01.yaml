  - number: '3.5'
    text: |-
      1 Indien kadavers van gezelschapsdieren zijn aangewezen ingevolge [artikel 3.3, eerste lid][ref1], worden bij
      gemeentelijke verordening ten aanzien van deze producten regels gesteld ter zake van:

      a. het aangeven en het bewaren door de houder van kadavers van gezelschapsdieren;

      b. het ophalen van kadavers van gezelschapsdieren, en

      c. het overdragen van kadavers van gezelschapsdieren aan de ondernemer binnen wiens werkgebied het materiaal zich
      bevindt.

      2 Indien tussen een gemeente en de in het eerste lid, onderdeel c, bedoelde ondernemer een overeenkomst is gesloten
      omtrent de in het eerste lid, onderdelen b en c, genoemde onderwerpen, behoeft de gemeentelijke verordening geen
      voorschriften over die onderwerpen te bevatten.

      3 De ondernemer, bedoeld in het eerste lid, onderdeel c, verwerkt of verwijdert de aan hem overgedragen kadavers
      van gezelschapsdieren.

      4 De in het eerste lid bedoelde voorschriften en het derde lid zijn niet van toepassing indien kadavers van
      gezelschapsdieren worden verwijderd door een ander dan de ondernemer, bedoeld in het eerste lid, onderdeel c,
      voor zover dit geschiedt op een wijze die ingevolge de krachtens [artikel 3.1][ref2] gestelde voorschriften is
      toegestaan.

      5 Bij ministeriële regeling kunnen het eerste, tweede en derde lid, van overeenkomstige toepassing worden verklaard
      op andere bij die regeling aangewezen dierlijke bijproducten.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel3.3
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel3.1
