        bwb_id: BWBR0001854
        artikel: '195'
  - number: '8.14'
    text: |-
      1 Met de opsporing van de bij [artikel 8.11][ref1] strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref2], belast de bij besluit van Onze Minister van Veiligheid en
      Justitie aangewezen ambtenaren.

      2 De ambtenaren, bedoeld in het eerste lid, zijn tevens belast met de opsporing van de feiten, strafbaar gesteld
      in de [artikelen 179 tot en met 182][ref3] en [184 van het Wetboek van Strafrecht][ref4], voor zover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.

      3 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8.11
