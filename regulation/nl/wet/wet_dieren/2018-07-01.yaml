  - number: '8.4'
    text: |-
      1 Eenieder wie zulks aangaat handelt overeenkomstig dan wel verleent zijn medewerking aan de uitvoering van een
      krachtens deze wet gegeven bevel, genomen maatregel of verrichte handeling, en verleent alle medewerking die
      redelijkerwijs nodig is voor het onderzoek naar dierziekten, zoönosen, ziekteverschijnselen of ziekteverwekkers.

      2 Eenieder die dieren, dierlijke producten, diergeneesmiddelen of diervoeders onder zich heeft of heeft gehad met
      betrekking waartoe krachtens deze wet een maatregel is getroffen, verstrekt op het eerste verzoek van een ambtenaar
      als bedoeld in [artikel 8.1, eerste lid][ref1], of [artikel 5.9, eerste lid][ref2], naar waarheid alle inlichtingen
      omtrent herkomst en verhandeling van deze dieren of producten.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8.1
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel5.9
