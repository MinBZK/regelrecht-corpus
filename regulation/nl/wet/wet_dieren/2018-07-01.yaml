  - number: '10.8'
    text: |-
      1 Er is een Raad voor dierenaangelegenheden waarin overleg plaatsvindt over vraagstukken betreffende het nationaal
      en internationaal beleid op het gebied van de gezondheid van dieren en het welzijn van dieren.

      2 Onze Minister benoemt in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport de leden van
      de Raad.

      3 Bij algemene maatregel van bestuur worden regels gesteld over de samenstelling en de werkwijze van de Raad.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel10.8
  - number: '10.9'
    text: |-
      Een voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur als
      bedoeld in de [artikelen 2.18, eerste en tweede lid][ref1], [2.20, eerste en tweede lid][ref2], en
      [2.22, eerste en tweede lid][ref3], wordt Ons gedaan door Onze Minister in overeenstemming met Onze Minister van
      Volksgezondheid, Welzijn en Sport en na overleg met Onze Minister van Sociale Zaken en Werkgelegenheid.


