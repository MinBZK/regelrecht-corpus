  - number: '6.5'
    text: |-
      1 Een wijziging van een EU-rechtshandeling waarnaar in regels, gesteld krachtens deze wet, wordt verwezen, gaat
      voor de toepassing van die regels gelden met ingang van de dag waarop aan die wijziging uitvoering moet zijn
      gegeven dan wel bij gebreke daarvan, de dag waarop die wijziging is vastgesteld.

      2 Onze Minister kan besluiten dat een wijziging als bedoeld in het eerste lid in afwijking van dat lid op een
      eerder tijdstip gaat gelden. Dit besluit wordt in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel6.5
  - number: '7.1'
    text: |-
      Dit hoofdstuk is van toepassing op besluiten die krachtens deze wet worden genomen. Bij de regels gesteld krachtens
      deze wet kan worden bepaald dat voor een handeling waarop die regels betrekking hebben een melding of een besluit
      tot verlening van een vergunning, erkenning, toestemming, toelating, registratie, bewijs van vakbekwaamheid,
      goedkeuring, vrijstelling, ontheffing, algemeen verbindend verklaring of certificering is vereist, kan worden
      verleend of kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel7.1
  - number: '7.2'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur wordt voor de uitvoering van bindende onderdelen van EU-
      rechtshandelingen geregeld dat in een register aantekening wordt gehouden van een melding of een besluit als
      bedoeld in [artikel 7.1.][ref1] Bij ministeriële regeling kunnen nadere regels worden gesteld over het register, de
      aantekening alsmede de wijziging daarvan.

      2 Bij of krachtens algemene maatregel van bestuur kan worden geregeld dat in een register aantekening wordt
      gehouden van een melding of een besluit als bedoeld in [artikel 7.1.][ref2] Bij ministeriële regeling kunnen regels
      over registers worden gesteld die betrekking hebben op:

      a. de mate van toegankelijkheid van de registers, waaronder de wijze waarop kennis kan worden genomen van de in de
      registers opgenomen gegevens;

      b. het doel dat het register dient;

      c. de behoorlijke en zorgvuldige verwerking van de gegevens in de registers;

      d. de inrichting van de registers;

      e. de gegevens die in de registers worden opgenomen;

      f. de wijze waarop gegevens in de registers worden opgenomen;

      g. de termijn waarbinnen gegevens en wijzigingen daarvan worden verwerkt in het register;

      h. de gevallen waarin een aantekening in de registers wordt gewijzigd of doorgehaald;

      i. de persoon of instantie die de registers beheert en bijhoudt;

      j. de minimale of maximale duur van het bewaren van gegevens in het register;

      k. de vergoeding van kosten voor het opnemen en verwerken van gegevens in de registers.

      3 Bij of krachtens algemene maatregel van bestuur kan worden geregeld dat een handeling waarvoor een melding
      als bedoeld in [artikel 7.1][ref3] vereist is, eerst kan worden verricht nadat de melding is aangetekend in een
      register als bedoeld in het eerste lid of tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7.1
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel7.1
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel7.1
