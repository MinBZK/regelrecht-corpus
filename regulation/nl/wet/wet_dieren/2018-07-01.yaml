  - number: '8.32'
    text: |-
      Een maatregel als bedoeld in [artikel 8.31, eerste lid][ref1], wordt niet opgelegd indien dit door het veterinair
      tuchtcollege raadzaam wordt geacht in verband met de geringe ernst van het feit, de persoon van de dader of de
      omstandigheden waaronder het feit is begaan, dan wel omstandigheden die zich nadien hebben voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8.31
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.32
