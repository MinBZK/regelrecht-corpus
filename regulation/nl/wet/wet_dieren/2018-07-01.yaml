  - number: '4.2'
    text: |-
      1 Personen, die zijn toegelaten tot het beroepsmatig verrichten van diergeneeskundige handelingen, schieten niet
      door enig handelen of nalaten tekort in de zorg die zij in hun hoedanigheid:

      a. behoren te betrachten ten opzichte van een dier met betrekking tot welke hun hulp is ingeroepen, en

      b. verlenen of in geval van nood behoren te verlenen ten opzichte van een dier.

      2 Personen die zijn toegelaten tot het beroepsmatig verrichten van diergeneeskundige handelingen, schieten niet
      zodanig tekort in hetgeen van hen in hun hoedanigheid mag worden verwacht dat daardoor ernstige schade kan ontstaan
      voor de gezondheidszorg voor dieren.

      3 Het in het eerste en tweede lid bepaalde is tevens van toepassing ten aanzien van andere dan gehouden dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel4.2
  - number: '4.3'
    text: |-
      1 Onze Minister houdt een openbaar register bij van personen die een opleiding op het gebied van de diergeneeskunde
      als bedoeld in [artikel 1.1][ref1] met goed gevolg hebben voltooid en andere personen die worden toegelaten tot het
      beroepsmatig verrichten van diergeneeskundige handelingen.

      2 Een persoon wordt niet in het register ingeschreven of zijn inschrijving wordt doorgehaald indien krachtens een
      onherroepelijk geworden rechterlijke of tuchtrechtelijke uitspraak zijn bevoegdheid tot het beroepsmatig verrichten
      van diergeneeskundige handelingen is ingetrokken.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de registratie in het
      register, bedoeld in het eerste lid, waaronder regels als bedoeld in [artikel 7.2, tweede en derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel7.2
