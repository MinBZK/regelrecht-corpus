  - number: '8.13'
    text: |-
      [Artikel 195 van het Wetboek van Strafrecht][ref1] is van overeenkomstige toepassing op een persoon:

      a. die, hoewel hij bij onherroepelijk geworden uitspraak geheel of gedeeltelijk is geschorst in het beroepsmatig
      verrichten van diergeneeskundige handelingen, tijdens die schorsing de handelingen waarop die schorsing betrekking
      heeft, uitoefent, of

      b. die, hoewel hem bij onherroepelijk geworden uitspraak de hem bij of krachtens deze wet verleende bevoegdheid
      tot het beroepsmatig verrichten van diergeneeskundige handelingen geheel of gedeeltelijk is ontzegd, de handelingen
      waarop die ontzegging betrekking heeft, uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel195
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.13
    references:
