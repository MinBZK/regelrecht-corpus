  - number: '4.1'
    text: |-
      1 Tot het beroepsmatig verrichten van diergeneeskundige handelingen zijn toegelaten dierenartsen en andere personen
      die zijn ingeschreven in het register, bedoeld in [artikel 4.3, eerste lid][ref1].

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het beroepsmatig verrichten van
      diergeneeskundige handelingen en de toelating daartoe, in overeenstemming met EU-rechtshandelingen die betrekking
      hebben op beroepskwalificaties en diensten.

      3 Bij of krachtens algemene maatregel van bestuur kunnen voor de onderwerpen, bedoeld in het tweede lid, regels
      worden gesteld die betrekking hebben op onder meer:

      a. de kwalificaties van degene die is of wordt toegelaten, waaronder de opleiding en bij- of nascholing;

      b. de gevallen waarin en de wijze waarop de handelingen, waarop de toelating betrekking heeft, worden verricht,
      waarbij kan worden bepaald dat die handelingen uitsluitend plaatsvinden onder leiding, op aanwijzing of onder
      controle van een dierenarts;

      c. de verhouding van de persoon die wordt toegelaten, tot de dierenarts;

      d. de gevallen waarin een toelating op aanvraag plaatsvindt, alsmede de wijze waarop de aanvraag en de toelating
      plaatsvindt;

      e. de geldigheidsduur van de toelating, en

      f. de gevallen waarin de toelating kan worden ingetrokken.

      4 Een toelating als bedoeld in het tweede lid kan onder voorwaarden en beperkingen worden verleend.

      5 Bij of krachtens algemene maatregel van bestuur kunnen de andere personen, bedoeld in het eerste lid, voor de
      toepassing van deze wet en de daarop berustende bepalingen worden gelijkgesteld met dierenartsen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4.3
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel4.1
