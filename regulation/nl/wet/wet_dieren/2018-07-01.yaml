        artikel: '5'
  - number: '8.17'
    text: |-
      1 De voorzitter en de overige leden van het veterinair tuchtcollege, alsmede voor elk van hen een of meer
      plaatsvervangers, worden voor de tijd van zes jaren door Onze Ministers benoemd. Zij zijn bij hun aftreden
      herbenoembaar. Op eigen verzoek kunnen zij door Onze Ministers worden ontslagen. De benoemingstermijn van
      degene die wordt benoemd ter vervulling van een tussentijdse vacature, eindigt bij het verstrijken van de
      benoemingstermijn van degene in wiens plaats hij is getreden.

      2 Voor de plaatsvervangers, bedoeld in het eerste lid, gelden dezelfde vereisten van benoembaarheid als voor de
      leden die zij vervangen.

      3 Onze Ministers verlenen aan de leden en hun plaatsvervangers ontslag met ingang van de maand, volgend op
      die waarin de betrokkenen de leeftijd van zeventig jaren hebben bereikt. Zij verlenen aan de leden en hun
      plaatsvervangers eveneens ontslag bij verlies van een vereiste voor hun benoembaarheid.

      4 De secretaris en de plaatsvervangend secretaris worden door Onze Ministers benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.17
  - number: '8.18'
    text: |-
      1 Tussen de leden, de plaatsvervangende leden, de secretaris en de plaatsvervangend secretaris van het veterinair
      tuchtcollege mag niet bestaan de verhouding van echtgenoten, geregistreerde partners, bloed- en aanverwanten
      tot de derde graad ingesloten, een vennootschap of ander duurzaam samenwerkingsverband tot het uitoefenen van de
      diergeneeskunde of de verhouding van werkgever tot werknemer.

      2 Indien het huwelijk of het geregistreerd partnerschap eerst mocht worden aangegaan na de benoeming, zal de
      jongstbenoemde der echtgenoten of geregistreerde partners zijn ambt niet kunnen behouden.

      3 Indien de aanverwantschap eerst mocht zijn ontstaan na de benoeming, zal degene, die haar veroorzaakte, zijn ambt
      niet kunnen behouden, behoudens door Onze Ministers te verlenen vergunning.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.18
  - number: '8.19'
    text: |-
      De [artikelen 46c, tweede lid][ref1], [46d, tweede lid][ref2], [46f][ref3],
      [46i met uitzondering van het eerste lid, onderdeel c][ref4], [46j][ref5],
      [46l, eerste lid, onderdeel a, en derde lid][ref6], [46m][ref7], [46o][ref8] en
      [46p van de Wet rechtspositie rechterlijke ambtenaren][ref9] voor de leden van de rechterlijke macht zijn van
      overeenkomstige toepassing ten aanzien van de leden van het college en hun plaatsvervangers.


