  - number: '8.28'
    text: |-
      1 De voorzitter van het veterinair tuchtcollege kan ten aanzien van twee of meer met elkaar samenhangende klachten
      bepalen dat deze ter terechtzitting gezamenlijk worden behandeld.

      2 Een gezamenlijke behandeling van klachten als bedoeld in het eerste lid vindt niet plaats ingeval de klachten
      zijn gericht tegen drie of meer andere personen als bedoeld in [artikel 4.1, eerste lid][ref1], die op grond van
      dat artikellid zijn toegelaten, voor zover drie of meer van die personen tot verschillende beroepsgroepen behoren.

      3 De voorzitter van het veterinair tuchtcollege kan bepalen de behandeling van gevoegde zaken te splitsen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4.1
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.28
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4.1'
        hoofdstuk: '4'
  - number: '8.29'
    text: |-
      1 Leden van het veterinair tuchtcollege en hun plaatsvervangers kunnen zich verschonen en kunnen worden
      gewraakt, indien ten aanzien van hen feiten of omstandigheden bestaan waardoor in het algemeen de rechterlijke
      onpartijdigheid schade zou kunnen lijden.

      2 Over wraking of verschoning wordt zo spoedig mogelijk beslist door hen die deel uitmaken van het veterinair
      tuchtcollege, met uitzondering van degene die wordt gewraakt of die zich wil verschonen. Bij staking van stemmen
      wordt de wraking onderscheidenlijk de verschoning toegewezen.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.29
  - number: '8.30'
    text: |-
      1 Het veterinair tuchtcollege kan naar aanleiding van het voorlopig onderzoek, bedoeld in
      [artikel 8.23, eerste lid][ref1], beslissen om, zonder nader onderzoek:

      a. de klager niet-ontvankelijk te verklaren, indien [artikel 8.15, tweede lid, onderdeel a][ref2], niet op hem van
      toepassing is, of

      b. de klacht af te wijzen, indien deze kennelijk ongegrond is omdat de feiten waarop de klacht berust geen
      betrekking hebben op het handelen in strijd met [artikel 4.2][ref3].

      2 Het veterinair tuchtcollege neemt in andere gevallen dan die, bedoeld in het eerste lid, een van de volgende
      beslissingen:

      a. het ongegrond verklaren van de klacht, of

      b. het geheel of gedeeltelijk gegrond verklaren van de klacht, al dan niet onder oplegging van een maatregel als
      bedoeld in [artikel 8.31, eerste lid][ref4], aan degene op wie de klacht betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8.23
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8.15
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel4.2
      [ref4]: https://wetten.overheid.nl/BWBR0030250#Artikel8.31
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.30
    references:
