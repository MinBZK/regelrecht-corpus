  - number: '4.5'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over specialismen binnen het
      beroepsmatig verrichten van diergeneeskundige handelingen alsmede over de vermelding van de titel, behorende bij
      die specialismen, in het register, bedoeld in [artikel 4.3, eerste lid][ref1].

      2 De regels, bedoeld in het eerste lid, kunnen betrekking hebben op onder meer:

      a. de opleiding tot de specialismen;

      b. de aanwijzing van en de eisen aan organisaties of instellingen die zijn belast met de regeling van of de
      opleiding tot de specialismen;

      c. de verkrijging en de intrekking van een titel, verbonden aan de specialismen, en

      d. de voorwaarden waaronder personen die beschikken over een titel, verbonden aan een specialisme, het recht is
      voorbehouden om:

      1°. in het openbaar aan te kondigen dat zij de diergeneeskundige handelingen waarop de specialisatie betrekking
      heeft beroepsmatig verrichten,

      2°. een titel, aanduiding of vermelding te bezigen die bij het publiek redelijkerwijs de indruk kan vestigen dat
      zij de diergeneeskundige handelingen waarop het specialisme betrekking heeft beroepsmatig verrichten, en

      3°. een titel als bedoeld in [artikel 4.4, eerste lid, onderdeel c][ref2], te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4.3
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel4.4
