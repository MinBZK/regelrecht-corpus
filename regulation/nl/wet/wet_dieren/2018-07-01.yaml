  - number: '8.33'
    text: |-
      1 De beslissing van het veterinair tuchtcollege over een ingediende klacht houdt de overweging in waarop zij steunt
      en wordt op schrift gesteld.

      2 Van de beslissing, bedoeld in het eerste lid, wordt door de secretaris van het veterinair tuchtcollege onverwijld
      een afschrift gezonden:

      a. aan de persoon over wie geklaagd is;

      b. aan de klager, en

      c. aan de ambtenaar, bedoeld in [artikel 8.15, tweede lid, onderdeel b][ref1].

      3 De secretaris van het veterinair tuchtcollege verstrekt desgevraagd aan de gerechten en het openbaar ministerie
      inlichtingen omtrent onherroepelijke beslissingen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8.15
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.33
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8.15'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: '8.34'
    text: |-
      Beslissingen van het veterinair tuchtcollege, genomen met een ander aantal personen of in een andere samenstelling,
      dan bij of krachtens deze wet is voorgeschreven, zijn nietig.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.34
  - number: '8.35'
    text: |-
      1 Bij het veterinair beroepscollege kan beroep worden ingesteld tegen een beslissing van het veterinair
      tuchtcollege op een ingediende klacht, binnen twee maanden na de dag van verzending van de aangetekende brief,
      bedoeld in [artikel 8.33, tweede lid][ref1].

      2 Beroep als bedoeld in het eerste lid, kan worden ingesteld door:

      a. de persoon over wie geklaagd is, indien de klacht geheel of gedeeltelijk gegrond is verklaard;

      b. de klager, voor zover hij niet-ontvankelijk is verklaard, zijn klacht is afgewezen, of zijn klacht geheel of
      gedeeltelijk ongegrond is verklaard, of

      c. de ambtenaar, bedoeld in [artikel 8.15, tweede lid, onderdeel b][ref2].

      3 Het beroep wordt ingesteld bij een met redenen omkleed beroepschrift, tezamen met een gewaarmerkt afschrift van
      de beslissing waartegen het beroep gericht is. Het beroep schorst de beslissing.

      4 Het veterinair beroepscollege kan het veterinair tuchtcollege uitnodigen inlichtingen te verstrekken.

      5 Indien alleen de persoon over wie geklaagd is, beroep heeft ingesteld, kan het veterinair beroepscollege slechts
      met eenparigheid van stemmen een beslissing geven die een wijziging ten nadele van de persoon over wie geklaagd is,
      brengt in hetgeen door het veterinair tuchtcollege was beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8.33
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8.15
