  - number: '8.25'
    text: |-
      1 De behandeling van een zaak door het veterinair tuchtcollege geschiedt in een openbare zitting, tenzij het
      veterinair tuchtcollege om gewichtige redenen beveelt dat de behandeling van de zaak geheel of gedeeltelijk met
      gesloten deuren zal plaatsvinden. Het bevel daartoe houdt de overwegingen in waarop het steunt.

      2 De beslissing in een door het veterinair tuchtcollege behandelde zaak wordt in het openbaar uitgesproken.

      3 Tijd en plaats van een openbare zitting of van een openbare uitspraak worden ten minste veertien dagen en ten
      hoogste een maand tevoren in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.25
  - number: '8.26'
    text: |-
      1 Behoudens in de gevallen, bedoeld in [artikel 8.30, eerste lid][ref1], neemt het veterinair tuchtcollege geen
      beslissing aangaande een ingediende klacht dan na verhoor, althans behoorlijke oproeping van de persoon over wie
      geklaagd is en van de klager.

      2 De persoon over wie geklaagd is kan, tenzij het veterinair tuchtcollege beveelt dat hij in persoon zal
      verschijnen, zich tijdens de zitting doen vertegenwoordigen door een daartoe gemachtigde. Hij kan zich door een
      raadsman doen bijstaan.

      3 Het veterinair tuchtcollege kan weigeren bepaalde personen die geen advocaat zijn, als gemachtigde of als
      raadsman toe te laten. Bij zodanige weigering houdt het veterinair tuchtcollege de zaak tot een volgende zitting
      aan.

      4 De persoon over wie geklaagd is en zijn raadsman worden in de gelegenheid gesteld ten minste veertien dagen
      voorafgaand aan de aanvang van het onderzoek tijdens de zitting, van de processtukken kennis te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8.30
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.26
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8.30'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: '8.27'
    text: |-
      1 Het veterinair tuchtcollege kan getuigen en deskundigen oproepen en horen op verzoek van de persoon over wie
      geklaagd is, op verzoek van de klager of ambtshalve. De oproeping geschiedt bij aangetekende brief. Het is degene
      die als getuige of deskundige is opgeroepen verboden geen gevolg te geven aan de oproeping.

      2 Indien een getuige of een deskundige niet verschijnt op de oproeping, doet de officier van justitie bij het
      arrondissementsparket Den Haag op verzoek van het veterinair tuchtcollege hem dagvaarden. Het is een getuige of
      deskundige verboden niet te verschijnen na dagvaarding.

      3 Indien een getuige of een deskundige niet verschijnt op de dagvaarding, bedoeld in het tweede lid, doet de
      officier van justitie bij de rechtbank te Den Haag op verzoek van het veterinair tuchtcollege hem nogmaals
      dagvaarden met, voor zover verzocht door het veterinair tuchtcollege, bevel tot medebrenging.

      4 [Artikel 556 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.

      5 Ten aanzien van getuigen en deskundigen zijn de
      [artikelen 217 tot en met 219 van het Wetboek van Strafvordering][ref2] van overeenkomstige toepassing.

      6 De getuigen en deskundigen ontvangen indien zij dit verkiezen op vertoon van hun oproeping of dagvaarding een
      vergoeding overeenkomstig het bepaalde bij of krachtens de [Wet tarieven in strafzaken][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel556
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel217
      [ref3]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.27
