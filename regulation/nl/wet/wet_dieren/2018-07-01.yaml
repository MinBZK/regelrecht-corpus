  - number: '8.21'
    text: |-
      1 Leden van het veterinair tuchtcollege en hun plaatsvervangers laten zich op geen enkele wijze uit over enige
      aangelegenheid, welke door hen behandeld wordt of waarvan zij weten of vermoeden dat deze door hen behandeld zal
      worden, in enig bijzonder onderhoud of gesprek met partijen of hun raadslieden of gemachtigden, noch nemen daarover
      enige bijzondere inlichting of schriftelijk stuk aan.

      2 Het is leden van het veterinair tuchtcollege en hun plaatsvervangers verboden hetgeen zij als zodanig te weten
      zijn gekomen verder bekend te maken dan voor de uitoefening van hun functie gevorderd wordt. De verplichting tot
      geheimhouding geldt niet tegenover ambtenaren van politie of justitie, voor zover mededeling aan hen op grond van
      een wettelijk voorschrift is vereist.

      3 De leden van het veterinair tuchtcollege en hun plaatsvervangers bewaren het geheim omtrent de gevoelens die in
      de raadkamer over aanhangige zaken zijn geuit.

      4 Het tweede en derde lid zijn van overeenkomstige toepassing op de secretaris van het veterinair tuchtcollege en
      zijn plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.21
  - number: '8.22'
    text: |-
      1 De voorzitter en de leden van het veterinair tuchtcollege en hun plaatsvervangers ontvangen vacatiegeld, alsmede
      een vergoeding van reis- en verblijfkosten en van verdere onkosten.

      2 Bij ministeriële regeling worden regels gesteld ten aanzien van de vergoedingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.22
  - number: '8.23'
    text: |-
      1 Zodra een klacht is ingediend, stelt de voorzitter van het veterinair tuchtcollege een voorlopig onderzoek in. De
      ambtenaar, bedoeld in [artikel 8.15, tweede lid, onderdeel b][ref1], verleent daarbij desgevraagd medewerking.

      2 Het intrekken van een klacht of de staking van de werkzaamheden door de persoon over wie geklaagd is, heeft geen
      invloed op de behandeling van de klacht indien:

      a. het algemeen belang dit vordert naar het oordeel van de ambtenaar, bedoeld in
      [artikel 8.15, tweede lid, onderdeel b][ref2], of

      b. wanneer de persoon over wie geklaagd is, verklaart de voortzetting van de behandeling te verlangen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8.15
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8.15
