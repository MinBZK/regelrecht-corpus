        paragraaf: '5'
  - number: '8.31'
    text: |-
      1 De maatregelen, bedoeld in [artikel 8.30, tweede lid][ref1], onderdeel b, zijn:

      a. een waarschuwing;

      b. een berisping;

      c. een geldboete van de derde categorie als bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2];

      d. een geldboete van de vierde categorie als bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref3], indien de waarde van de goederen, met betrekking
      tot welke een overtreding is begaan, of de waarde van het wederrechtelijk genoten voordeel dat geheel of
      gedeeltelijk door middel van de overtreding is verkregen, hoger is dan het vierde gedeelte van het maximumbedrag
      van de geldboete dat op grond van onderdeel c, kan worden opgelegd;

      e. een gehele of gedeeltelijke schorsing voor ten hoogste een jaar, van de bij of krachtens deze wet verleende
      bevoegdheid tot het beroepsmatig verrichten van diergeneeskundige handelingen, en

      f. een gehele of gedeeltelijke ontzegging van de bij of krachtens deze wet verleende bevoegdheid tot het
      beroepsmatig verrichten van diergeneeskundige handelingen.

      2 De maatregelen, bedoeld in het eerste lid, onderdelen c en d, kunnen gelijktijdig worden opgelegd met een van de
      maatregelen, bedoeld in het eerste lid, onderdelen e of f.

      3 Een beslissing waarbij de maatregel, bedoeld in het eerste lid, onderdeel f, is opgelegd, wordt bekendgemaakt in
      de Staatscourant en aan in de beslissing aangewezen tijdschriften of nieuwsbladen ter bekendmaking aangeboden, al
      dan niet met weglating van de namen of de woonplaatsen van de daarin genoemde personen, alsmede van andere gegevens
      welke aanwijzingen omtrent die personen bevatten.

      4 Bij oplegging van de maatregelen, bedoeld in het eerste lid, onderdelen a tot en met e, kan worden bevolen dat de
      beslissing overeenkomstig het derde lid wordt bekendgemaakt.

      5 Maatregelen, bedoeld in het eerste lid, onderdelen c, d of e, kunnen voorwaardelijk worden opgelegd.

      6 Bij toepassing van het vijfde lid worden de maatregelen geheel of gedeeltelijk niet ten uitvoer gelegd onder
      de voorwaarde dat de betrokkene zich binnen een daartoe vastgestelde proeftijd van ten hoogste drie jaren, niet
      schuldig maakt aan handelingen in strijd met [artikel 4.2][ref4], dan wel in strijd met een bijzondere voorwaarde
      die aan de voorwaardelijke oplegging van de maatregel is verbonden.

      7 Een bijzondere voorwaarde als bedoeld in het zesde lid kan zijn dat de betrokkene de door zijn gedraging
      veroorzaakte schade, voor zover die niet meer bedraagt dan € 5 000,-, geheel of gedeeltelijk binnen een daarbij te
      stellen termijn, korter dan de proeftijd, vergoedt.

      8 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de tenuitvoerlegging van de maatregelen,
      bedoeld in het eerste lid, en de uitvoering van de bevelen, bedoeld in het vierde lid.

      9 De geldboete, bedoeld in het eerste lid, onderdelen c en d, komt ten bate van de Staat. Degene aan wie een
      boete is opgelegd, wordt door een door Onze Minister aan te wijzen ambtenaar bij gedagtekende brief uitgenodigd de
      verschuldigde geldboete te betalen.

      10 Indien de schuldenaar in gebreke blijft, kan de invordering van de verschuldigde geldboete bij dwangbevel
      geschieden door de ambtenaar, bedoeld in het negende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8.30
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0030250#Artikel4.2
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.31
