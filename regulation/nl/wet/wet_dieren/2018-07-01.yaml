  - number: '8.37'
    text: |-
      1 Het veterinair beroepscollege houdt zitting in een samenstelling bestaande uit vijf leden, te weten de drie
      rechtsgeleerden waaronder de voorzitter, alsmede:

      a. twee dierenartsen indien de klacht gericht is tegen een dierenarts, en

      b. een dierenarts en een lid van dezelfde beroepsgroep als de beklaagde, indien de klacht is gericht tegen een
      andere persoon als bedoeld in [artikel 4.1, eerste lid][ref1], die op grond van dat artikellid is toegelaten.

      2 Bij algemene maatregel van bestuur kan in afwijking van het eerste lid, aanhef en onderdeel b, worden bepaald
      dat bij ontstentenis van benoemde leden van dezelfde beroepsgroep als de beklaagde, dierenartsen zitting nemen in
      plaats van die leden.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4.1
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.37
