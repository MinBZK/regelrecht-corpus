  - number: '7.4'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen inzake de geldingsduur van besluiten als bedoeld in [artikel 7.1][ref1].

      2 In andere gevallen dan bedoeld in het eerste lid is een besluit als bedoeld in [artikel 7.1][ref2] voor
      onbepaalde tijd geldig, tenzij:

      a. bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling een andere geldigheidsduur is
      vastgesteld, of

      b. het besluit zelf in een andere geldigheidsduur voorziet.

      3 Ingeval een besluit als bedoeld in [artikel 7.1][ref3] niet voor onbepaalde tijd geldig is, zijn
      [artikel 7.3][ref4] en het eerste en tweede lid op de verlenging daarvan van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7.1
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel7.1
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel7.1
      [ref4]: https://wetten.overheid.nl/BWBR0030250#Artikel7.3
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel7.4
