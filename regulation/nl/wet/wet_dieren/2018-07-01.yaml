  - number: '2.9'
    text: |-
      1 Het beroepsmatig verrichten van diergeneeskundige handelingen is verboden voor een ieder die daartoe niet bij of
      krachtens [artikel 4.1][ref1] is toegelaten.

      2 Het anders dan beroepsmatig verrichten van lichamelijke ingrepen is verboden voor anderen dan de personen,
      bedoeld in het eerste lid.

      3 De verboden, bedoeld in het eerste en tweede lid, zijn niet van toepassing op bij of krachtens algemene maatregel
      van bestuur aangewezen diergeneeskundige handelingen. De aanwijzing van diergeneeskundige handelingen kan worden
      beperkt tot het in een bepaalde hoedanigheid verrichten van de aangewezen handeling.

      4 Bij of krachtens algemene maatregel van bestuur kunnen andere diergeneeskundige handelingen dan lichamelijke
      ingrepen worden aangewezen waarvan het anders dan beroepsmatig verrichten bij dieren, verboden is.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de kwalificaties
      van andere personen dan die bij of krachtens [artikel 4.1][ref2] zijn toegelaten, die diergeneeskundige handelingen
      verrichten, waaronder de opleiding en bij- of nascholing.

      6 Het bij en krachtens het eerste tot en met het vijfde lid bepaalde is tevens van toepassing op het verrichten van
      diergeneeskundige handelingen bij andere dan gehouden dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel4.1
