  - number: '8.15'
    text: |-
      1 Bij het veterinair tuchtcollege kan een schriftelijke klacht worden ingediend tegen een dierenarts of een andere
      persoon die is toegelaten tot het beroepsmatig verrichten van diergeneeskundige handelingen, wegens het in strijd
      handelen met [artikel 4.2][ref1].

      2 Een klacht als bedoeld in het eerste lid, kan worden ingediend door:

      a. degene die als gevolg van het handelen, bedoeld in het eerste lid, rechtstreeks in zijn belang is getroffen, of

      b. een ambtenaar, aangewezen door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4.2
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.15
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4.2'
        hoofdstuk: '4'
  - number: '8.16'
    text: |-
      1 Het veterinair tuchtcollege is gevestigd in Den Haag.

      2 Het veterinair tuchtcollege is belast met de behandeling in eerste aanleg van zaken over het handelen in strijd
      met [artikel 4.2][ref1].

      3 Het veterinair tuchtcollege bestaat uit de volgende leden:

      a. een rechtsgeleerde die voorzitter is;

      b. vier praktiserende dierenartsen, en

      c. een door Onze Ministers te bepalen aantal andere personen als bedoeld in [artikel 4.1, eerste lid][ref2], dat op
      grond van dat artikellid zijn toegelaten tot het beroepsmatig verrichten van diergeneeskundige handelingen en als
      zodanig werkzaam zijn.

      4 Het veterinair tuchtcollege heeft een secretaris en zo nodig een plaatsvervangend secretaris, die rechtsgeleerden
      zijn.

      5 De rechtsgeleerde leden van het veterinair tuchtcollege, de secretaris en diens plaatsvervanger, voldoen aan
      [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4.2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel4.1
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel5
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.16
    references:
