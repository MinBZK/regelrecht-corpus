  - number: '2.25'
    text: |-
      1 Het is verboden om op enigerlei wijze handelingen te verrichten in strijd met bij of krachtens algemene maatregel
      van bestuur voor de uitvoering van bindende onderdelen van EU-rechtshandelingen gestelde regels over het bij dieren
      of op cel- of weefselcultures bij dieren toepassen van diergeneesmiddelen, diervoeders, substanties of andere
      stoffen, of producten.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing in bij ministeriële regeling, in voorkomend geval
      met inachtneming van EU-rechtshandelingen, aangewezen gevallen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen voor bij deze maatregel aan te wijzen diersoorten of
      diercategorieën regels worden gesteld over het bij dieren of op cel- of weefselcultures bij dieren toepassen
      van diergeneesmiddelen, diervoeders, bij of krachtens die maatregel aangewezen substanties of andere stoffen, of
      producten, welke regels betrekking kunnen hebben op onder meer:

      a. de aard van de substantie;

      b. het doel waarvoor de substantie wordt toegepast;

      c. de wijze waarop de substantie wordt toegepast;

      d. de diersoort of diercategorie waartoe de dieren, dan wel cel- of weefselcultures van dieren behoren waarbij de
      substantie uitsluitend mag worden toegepast;

      e. het moment van toepassing, en

      f. de waarborgen die worden getroffen in het belang van de dieren of de volksgezondheid.

      4 Voor zover een aanwijzing van een substantie als bedoeld in het derde lid geschiedt krachtens algemene maatregel
      van bestuur en indien die aanwijzing geheel of mede in het belang is van de volksgezondheid, geschiedt deze in
      overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel2.25
  - number: '3.1'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen over dierlijke producten.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het eerste lid, regels
      worden gesteld die betrekking hebben op onder meer:

      a. het produceren, het bewerken, het verwerken, het in voorraad of voorhanden hebben, het vervoeren, het opslaan,
      het verzamelen, het hanteren, het gebruik, het verwijderen, het in de handel brengen en het in of buiten Nederland
      brengen van dierlijke producten;

      b. een verbod op het produceren, het bewerken, het verwerken, het in voorraad of voorhanden hebben, het vervoeren,
      het gebruik, het in de handel brengen en het in of buiten Nederland brengen van bepaalde producten;

      c. de registratie van degene die de producten produceert, bewerkt, verwerkt, in voorraad of voorhanden heeft,
      verpakt, vervoert, in de handel brengt of in of buiten Nederland brengt;

      d. het winnen, het bewerken, het mengen, het opslaan, het verhandelen en het gebruiken van sperma, eicellen en
      embryo’s, de inrichtingen waar dit plaatsvindt, en de bedrijfsvoering aldaar;

      e. de documenten die de producten vergezellen en die worden overgelegd;

      f. de herkomst van de in Nederland te brengen producten;

      g. de identificatie en registratie van de producten;

      h. het bijhouden van een administratie;

      i. de inrichting van de ruimte waar de producten worden geproduceerd, bewerkt, verwerkt, verpakt, opgeslagen of in
      voorraad gehouden;

      j. de inslag en de uitslag;

      k. de afkomst, de bestemming, de hoedanigheid, de kwaliteit, de samenstelling, de etikettering, de benaming en de
      verpakking van producten, en de informatie die met betrekking tot de producten wordt overgelegd;

      l. het vervoer van de producten en de vervoermiddelen;

      m. de behandeling van producten ter bestrijding van ziekteverwekkers dan wel voorkoming van aanwezigheid ervan, en

      n. hygiëne, het voorkomen van de verspreiding van dierziekten, zoönosen en ziekteverschijnselen, en het weren van
      ziekteverwekkers.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op andere dan dierlijke producten, voor zover zij
      een gevaar voor verspreiding van een ziekteverwekker kunnen opleveren.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden in het belang van de volksgezondheid regels gesteld voor
      de uitvoering van bindende onderdelen van EU-rechtshandelingen over de productie van vlees na het doden van dieren.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het eerste lid, regels
      worden gesteld die betrekking hebben op onder meer:

      a. de onderwerpen, genoemd in [artikel 3.1, tweede lid][ref1];

      b. de onderzoeken bij dode dieren;

      c. de personen die dieren onderzoeken, of die daarbij betrokken zijn;

      d. de keuring van dode dieren;

      e. de personen die dode dieren keuren, of die daarbij betrokken zijn;

      f. de voorwaarden waaronder vlees geschikt is voor menselijke consumptie;

      g. het uitsnijden en bewerken van vlees;

      h. de personen die vlees uitsnijden of bewerken, of die daarbij betrokken zijn;

      i. de opslag en het vervoer van vlees;

      j. het afleveren van vlees en het in de handel brengen van vlees met het oog op verdere bewerking of verwerking;

      k. de hoedanigheid van vlees, en

      l. het merken van vlees.

      3 Het eerste en tweede lid zijn niet van toepassing op gehakt vlees, separatorvlees, vleesbereidingen en
      vleesproducten als bedoeld in krachtens de [Warenwet][ref2] gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0001969
