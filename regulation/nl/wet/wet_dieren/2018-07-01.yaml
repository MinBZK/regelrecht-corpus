    text: |-
      1 In bijzondere gevallen kan bij koninklijk besluit worden bepaald, het veterinaire tuchtcollege gehoord, dat
      degene ten aanzien van wie de bij of krachtens deze wet verleende bevoegdheid tot het beroepsmatig verrichten van
      diergeneeskundige handelingen geheel of gedeeltelijk is ontzegd, op zijn verzoek in die bevoegdheid wordt hersteld.

      2 Herstel kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.42
  - number: '8.43'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      rechtsgang ten behoeve van de waarborging van een deugdelijke berechting.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.43
  - number: '8.44'
    text: |-
      1 Onze Minister moedigt het opstellen en het toepassen aan van gidsen voor goede praktijken die aanbevelingen
      bevatten voor de naleving van het bij of krachtens deze wet bepaalde.

      2 Nationale gidsen voor goede praktijken kunnen aan Onze Minister ter beoordeling worden voorgelegd.

      3 Op verzoeken om een beoordeling als bedoeld in het tweede lid, zijn de [artikelen 7.6][ref1], [7.7][ref2] en
      [7.8][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7.6
