  - number: '2.10'
    text: |-
      1 Het is verboden om dieren behorend tot bij algemene maatregel van bestuur aangewezen diersoorten of
      diercategorieën te doden, behoudens in gevallen waarin een dier wordt gedood voor de bedrijfsmatige productie van
      dierlijke producten of in bij of krachtens algemene maatregel van bestuur aangewezen gevallen.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen over het doden, het bedwelmen, het fixeren, het onderbrengen en het verplaatsen van
      dieren.

      3 Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het tweede lid, regels
      worden gesteld voor bij deze maatregel aan te wijzen diersoorten of diercategorieën die betrekking hebben op onder
      meer:

      a. een verbod op het doden van bepaalde dieren;

      b. de wijze waarop dieren worden gedood;

      c. situaties waarin het is toegestaan dieren te doden;

      d. voorwaarden waaronder het is toegestaan dieren te doden;

      e. de personen die dieren doden, of die daarbij betrokken zijn;

      f. de plaats waar dieren worden gedood;

      g. het vervoeren, het aanvoeren en het afvoeren van dieren naar de plaats waar wordt gedood;

      h. het verplaatsen van dieren in de ruimten waar dieren worden gedood;

      i. het onderbrengen van dieren in de ruimten waar dieren worden gedood;

      j. het fixeren van dieren;

      k. het bedwelmen van dieren;

      l. de inrichting, uitvoering en vormgeving van ruimten waar dieren worden gedood, waaronder de aanwezige
      voorzieningen;

      m. de gegevens over de te doden dieren die voorafgaand aan het doden worden overgelegd;

      n. de gezondheidsstatus van de te doden dieren;

      o. de onderzoeken aan en met betrekking tot de dieren;

      p. de keuring van dieren;

      q. de personen die dieren keuren, of die daarbij betrokken zijn;

      r. hygiëne, het voorkomen van de verspreiding van dierziekten, zoönosen en ziekteverschijnselen, en het weren van
      ziekteverwekkers, en

      s. de instrumenten, installaties en verdere voorzieningen voor het fixeren, bedwelmen of doden van dieren.

      4 Het is toegestaan om dieren zonder voorafgaande bedwelming te doden volgens de israëlitische of de islamitische
      ritus. Bij algemene maatregel van bestuur worden in het belang van de bescherming van de dieren nadere regels
      gesteld over het doden volgens de israëlitische of de islamitische ritus.

      5 De regels, bedoeld in het vierde lid, kunnen betrekking hebben op onder meer:

      a. de wijze waarop dieren worden gedood;

      b. de personen die het doden van dieren uitvoeren;

      c. de inrichting, uitvoering en vormgeving van ruimten waar dieren worden gedood, waaronder de aanwezige
      voorzieningen, en

      d. de aanwezigheid van een op grond van [artikel 8.1][ref1] aangewezen ambtenaar, tevens zijnde een dierenarts, en
      de door die ambtenaar te geven aanwijzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8.1
