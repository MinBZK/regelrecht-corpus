  - number: '8.1'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren en andere personen.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.1
  - number: '8.2'
    text: |-
      In aanvulling op [artikel 5:15, eerste lid, van de Algemene wet bestuursrecht][ref1] zijn de in de
      [artikelen 8.1, eerste lid][ref2], en [8.14, eerste lid][ref3], bedoelde ambtenaren en personen bevoegd, met
      medeneming van de benodigde apparatuur, een woning binnen te treden zonder toestemming van de bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel515
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8.1
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel8.14
