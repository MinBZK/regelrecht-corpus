  - number: '7.3'
    text: |-
      1 Een besluit als bedoeld in [artikel 7.1][ref1] wordt door Onze Minister verleend of gewijzigd indien is voldaan
      aan de eisen, gesteld bij de regels, bedoeld in artikel 7.1.

      2 Ingeval een besluit als bedoeld in [artikel 7.1][ref2] geheel of mede wordt vereist in het belang van de
      volksgezondheid, kan bij of krachtens algemene maatregel van bestuur dan wel bij ministeriële regeling worden
      geregeld dat deze wordt verleend of gewijzigd in overeenstemming dan wel na overleg met Onze Minister van
      Volksgezondheid, Welzijn en Sport.

      3 Bij of krachtens algemene maatregel van bestuur dan wel bij ministeriële regeling wordt bepaald dat
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref3] van toepassing is op een aanvraag tot verlening
      of wijziging van een besluit als bedoeld in [artikel 7.1][ref4], tenzij EU-rechtshandelingen, het belang van de
      gezondheid van de mens, dieren of planten, het belang van het welzijn van dieren, of het belang van het milieu zich
      daartegen verzetten.

      4 Het derde lid is niet van toepassing op besluiten met betrekking tot vergunningen waarop, met toepassing van
      [artikel 28 van de Dienstenwet][ref5], [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref6] van toepassing
      is.

      5 Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kan met
      betrekking tot de in het vierde lid bedoelde besluiten toepassing worden gegeven aan
      [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref7].


