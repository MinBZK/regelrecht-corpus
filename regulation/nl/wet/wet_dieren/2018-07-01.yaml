  - number: '5.1'
    text: |-
      1 De maatregelen, bedoeld in dit hoofdstuk, kunnen voor één of meer afzonderlijke gevallen, dan wel ten algemene
      worden voorgeschreven.

      2 De maatregelen, bedoeld in dit hoofdstuk, kunnen voor geheel Nederland of voor bepaalde gedeelten daarvan worden
      voorgeschreven.

      3 Aan de maatregelen, bedoeld in dit hoofdstuk, kunnen voorschriften of beperkingen worden verbonden. Het is
      verboden te handelen in strijd met voorschriften als bedoeld in de eerste volzin.

      4 Bij ministeriële regeling worden regels gesteld voor de uitvoering van bindende onderdelen van EU-
      rechtshandelingen die betrekking hebben op krachtens dit hoofdstuk getroffen maatregelen. In andere gevallen kunnen
      bij ministeriële regeling regels worden gesteld over de uitvoering van die maatregelen.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel5.1
  - number: '5.2'
    text: |-
      1 Ingeval in het belang van de gezondheid van mens of dier naar het oordeel van Onze Minister een onverwijlde
      voorziening noodzakelijk is, kan hij bepalen dat door hem krachtens dit hoofdstuk vastgestelde regelingen
      onmiddellijk na hun bekendmaking in werking treden.

      2 Een regeling als bedoeld in het eerste lid kan, in afwijking van
      [artikel 4, eerste lid, van de Bekendmakingswet][ref1], door Onze Minister op andere dan de daar genoemde wijze
      bekend worden gemaakt.

      3 Onze Minister kan mandaat verlenen voor het stellen van regels krachtens dit hoofdstuk ten aanzien van gevallen
      waarin in het belang van de gezondheid van mens of dier een onverwijlde voorziening noodzakelijk is.

      4 Het mandaat, bedoeld in het derde lid, kan tevens betrekking hebben op de bevoegdheden, bedoeld in het eerste en
      het tweede lid.

      5 Een krachtens dit hoofdstuk te treffen besluit hoeft niet eerst op schrift te worden gesteld ingeval in het
      belang van preventie of bestrijding van besmettelijke dierziekten, zoönosen of ziekteverschijnselen of het weren
      van ziekteverwekkers een onverwijlde tenuitvoerlegging van een maatregel noodzakelijk is. In dat geval zorgt Onze
      Minister alsnog zo spoedig mogelijk voor de opschriftstelling en bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel4
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '4'
  - number: '5.10'
    text: |-
      1 Onze Minister kan maatregelen treffen met betrekking tot:

      a. dieren en dierlijke producten ten aanzien waarvan niet is voldaan aan het bepaalde bij of krachtens deze wet, of
      waarvan dit wordt vermoed;

      b. dieren en dierlijke producten die drager zijn van een ziekteverwekker die een ernstig gevaar voor mens of dier
      of voor het milieu kan opleveren, of waarvan dit wordt vermoed, en

      c. dieren, al dan niet gehouden, die via voedering, drenking, inademing of een andere vorm van blootstelling een
      schadelijke stof hebben opgenomen, of waarvan wordt vermoed dat zij deze hebben opgenomen, of die het gevaar lopen
      de stof op te nemen, alsook met betrekking tot de van die dieren afkomstige dierlijke producten.

      2 De maatregelen, bedoeld in het eerste lid, met betrekking tot dieren zijn:

      a. een verplichting tot het afzonderen, het opstallen, het ophokken, het op een aangewezen plaats houden, het
      vastleggen of het opsluiten;

      b. een verplichting tot het voederen, het drenken, het verzorgen of het behandelen;

      c. een verplichting tot het merken, het identificeren en registreren;

      d. een verbod op het van een bedrijf afvoeren, het in de handel brengen, of op het in of buiten Nederland brengen;

      e. een verplichting tot het terugzenden, voor zover het dier afkomstig is uit een ander land of tot het vrijlaten
      van gevangen dieren, voor zover die dieren afkomstig zijn uit het wild;

      f. een verbod op het doden, het voorhanden hebben, het in voorraad hebben, het jagen, het vissen of het vangen,
      alsmede op het gebruik van bepaalde methoden of materialen waarmee dat jagen, vissen of vangen kan geschieden, en

      g. een verplichting tot het laten doden en vernietigen, voor zover:

      1°. dit nodig is ter voorkoming van een ernstig gevaar voor mens of dier, of

      2°. een EU-rechtshandeling daartoe verplicht.

      3 De maatregelen, bedoeld in het eerste lid, met betrekking tot dierlijke producten zijn:

      a. een verplichting tot het afzonderen of het op een aangewezen plaats houden;

      b. een verplichting tot het terugzenden, voor zover het product afkomstig is uit een ander land;

      c. een verplichting tot het vernietigen;

      d. een verbod op het van een bedrijf afvoeren of het in de handel brengen;

      e. een verbod op het in of het buiten Nederland brengen;

      f. een verplichting tot het terugroepen of het uit de handel nemen;

      g. een verplichting tot het gebruik voor andere doeleinden dan waarvoor het bestemd was;

      h. een verplichting tot het behandelen, en

      i. een verplichting tot het identificeren en registreren.

      4 Het eerste en het derde lid zijn van overeenkomstige toepassing op andere dan dierlijke producten, voor zover het
      product een gevaar voor verspreiding van een ziekteverwekker kan opleveren.

      5 Maatregelen, die krachtens het eerste lid, onderdeel c, worden getroffen met betrekking tot dieren die wegens
      de opname, de vermoedelijke opname of het gevaar van opname van schadelijke stoffen een ernstig gevaar voor de
      volksgezondheid kunnen opleveren, worden getroffen in overeenstemming met de Minister van Volksgezondheid, Welzijn
      en Sport.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel5.10
  - number: '5.11'
    text: |-
      1 Onze Minister kan maatregelen treffen met betrekking tot:

      a. diervoeders, diergeneesmiddelen en samenstellingen daarvan ten aanzien waarvan niet is voldaan aan het bepaalde
      bij of krachtens deze wet of ten aanzien waarvan dit wordt vermoed, en

      b. diervoeders, diergeneesmiddelen en samenstellingen daarvan die de gezondheid van mens of dier of het milieu in
      gevaar kunnen brengen.

      2 De maatregelen, bedoeld in het eerste lid, kunnen inhouden:

      a. een verbod op het vervoeren, het bewerken of het verwerken en het in de handel brengen;

      b. een verplichting tot tijdelijke opslag;

      c. een verplichting tot het terugroepen of het uit de handel nemen;

      d. een verplichting tot het vernietigen;

      e. een verbod op het in of buiten Nederland brengen;

      f. een verplichting tot het terugzenden, voor zover het product afkomstig is uit een ander land;

      g. een verplichting om houders, dan wel vermoedelijke houders onverwijld en op doeltreffende wijze op de hoogte
      te stellen;

      h. een verplichting tot het identificeren en registreren van de diervoeders, diergeneesmiddelen en samenstellingen
      daarvan;

      i. een verplichting tot het ontsmetten, dan wel het toepassen van een andere passende behandeling;

      j. een verplichting tot het ophalen van in de handel gebrachte diervoeders, diergeneesmiddelen en samenstellingen
      daarvan en het opslaan op een bij de maatregel aangewezen plaats;

      k. een verplichting om de diervoeders, diergeneesmiddelen en samenstellingen daarvan voor andere doeleinden te
      gebruiken, en

      l. een verbod op het voederen aan, het toepassen bij of het brengen in de nabijheid van dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel5.11
  - number: '5.12'
    text: |-
      1 Onze Minister kan maatregelen treffen met betrekking tot bedrijven, inrichtingen of locaties die de gezondheid
      van mens of dier in gevaar kunnen brengen en:

      a. ten aanzien waarvan niet is voldaan aan het bepaalde bij of krachtens een EU-verordening, EU-besluit of deze wet
      of ten aanzien waarvan dit wordt vermoed;

      b. waar dieren of producten aanwezig zijn of zijn geweest ten aanzien waarvan niet is voldaan aan het bepaalde bij
      of krachtens een EU-verordening, EU-besluit of deze wet of ten aanzien waarvan dit wordt vermoed.

      2 De maatregelen, bedoeld in het eerste lid, kunnen inhouden:

      a. gehele of gedeeltelijke sluiting van de bedrijven, inrichtingen of locaties gedurende een door Onze Minister te
      bepalen periode;

      b. schorsing of intrekking van een vergunning, erkenning, toestemming, toelating, registratie, bewijs van
      vakbekwaamheid, goedkeuring of certificering die bij of krachtens een EU-verordening, EU-besluit of deze wet aan de
      bedrijven, inrichtingen of locaties is verleend, en

      c. een verplichting tot vaststelling van hygiëneprocedures of tot ander handelen of nalaten dat noodzakelijk is om
      de veiligheid van dieren en producten op het bedrijf, de inrichting of de locatie te waarborgen, dan wel om de bij
      of krachtens een EU-verordening, EU-besluit of deze wet gestelde regels inzake dierenwelzijn, volksgezondheid of
      diergezondheid op het bedrijf, de inrichting of de locatie na te komen.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel5.12
  - number: '5.13'
    text: |-
      1 De burgemeester van de gemeente waar zich een dier bevindt dat in strijd met het bepaalde krachtens
      [artikel 2.6, tweede lid, onderdeel a, onder 2°][ref1], is gefokt, of dat in strijd met het bepaalde bij en
      krachtens [artikel 2.2, zesde lid, eerste volzin][ref2], wordt gehouden, kan besluiten dat dit dier:

      a. naar een door hem aangewezen plaats wordt vervoerd, en

      b. aldaar wordt gedood.

      2 De burgemeester voert de handeling, bedoeld in het eerste lid, onderdeel b, niet uit indien de houder binnen
      zes weken nadat het besluit, bedoeld in het eerste lid, aan hem is bekendgemaakt, een verzoek als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref3] heeft ingediend en op dat verzoek niet afwijzend is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2.6
