  - number: '2.19'
    text: |-
      1 Het is verboden een handeling te verrichten die ertoe strekt een diergeneesmiddel te bereiden, te bewerken, te
      verwerken, te verpakken, te etiketteren, in de handel te brengen, in of buiten Nederland te brengen, te vervoeren,
      aan te bieden, aan te prijzen, af te leveren, te ontvangen, voorhanden of in voorraad te hebben, voor zover deze
      handeling niet is toegestaan krachtens een vergunning die is verstrekt ingevolge een bij of krachtens algemene
      maatregel van bestuur ter uitvoering van een bindend onderdeel van een EU-rechtshandeling vastgesteld voorschrift
      of een bij ministeriële regeling aangewezen voorschrift van een EU-verordening inzake het in de handel brengen,
      vervaardiging, invoer, of het bezit van, handel in of verstrekken van een diergeneesmiddel.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing op bij of krachtens algemene maatregel van
      bestuur, in voorkomend geval met inachtneming van EU-rechtshandelingen, aangewezen diergeneesmiddelen, of in bij of
      krachtens die maatregel aangewezen gevallen.

      3 De vergunning, bedoeld in het eerste lid, wordt op aanvraag verstrekt indien:

      a. op grond van onderzoek met redelijke zekerheid mag worden aangenomen dat het diergeneesmiddel bij het toepassen
      overeenkomstig de aan de te verstrekken vergunning krachtens [artikel 7.5, eerste lid][ref1], te verbinden
      voorschriften en beperkingen:

      1°. de gestelde werking bezit, en

      2°. geen gevaar oplevert voor de gezondheid van mensen, dieren en planten en voor het milieu;

      b. het diergeneesmiddel de opgegeven eigenschappen en kwalitatieve en kwantitatieve samenstelling bezit en de voor
      het controleren daarvan opgegeven methodieken adequaat zijn;

      c. het diergeneesmiddel voldoet aan bij ministeriële regeling gestelde regels met betrekking tot de substanties
      waaruit het is samengesteld;

      d. het diergeneesmiddel, voor zover het een immunologisch diergeneesmiddel of biologisch diagnosticum betreft, niet
      bereid is uit, of met behulp van bij EU-verordening, EU-besluit of bij ministeriële regeling aangewezen substanties
      waarvan gevaar is te duchten voor de gezondheid van dieren of voor verstoring van de dierziektebestrijding;

      e. bij EU-verordening of bij of krachtens algemene maatregel van bestuur vastgestelde procedures in acht zijn
      genomen;

      f. bij ministeriële regeling aangewezen door de Europese Commissie vastgestelde beginselen en richtsnoeren in acht
      zijn genomen, en

      g. geen ingevolge een EU-verordening of bij of krachtens algemene maatregel van bestuur vastgestelde
      weigeringsgrond aanwezig is.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de beoordelingsmethoden bij de
      toepassing van de voorwaarden, bedoeld in het derde lid, onderdeel a tot en met d, alsmede regels inzake de methode
      waarmee de op grond van het derde lid, onderdeel a, aanhef, vast te stellen voorschriften worden bepaald, voor
      zover deze voorschriften bij of krachtens algemene maatregel van bestuur zijn toegestaan.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld inzake de onderzoeksmethoden die worden
      toegepast bij een onderzoek als bedoeld in [artikel 7.6, tweede lid, onderdeel b][ref2].

      6 Het derde lid, onderdeel a, onder 1°, is niet van toepassing op een aanvraag voor een homeopathisch
      diergeneesmiddel in bij of krachtens algemene maatregel van bestuur aangewezen gevallen.

      7 Een vergunning als bedoeld in het eerste lid wordt verstrekt, en een regeling als bedoeld in het derde lid,
      onderdeel c, en vierde lid, wordt vastgesteld in overeenstemming met Onze Minister van Volksgezondheid, Welzijn
      en Sport.

      8 Voorschriften en beperkingen die zijn verbonden aan een vergunning als bedoeld in het eerste lid die is verstrekt
      voor het in de handel brengen van een diergeneesmiddel, gelden voor een ieder die een handeling als bedoeld in het
      eerste lid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7.5
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel7.6
