  - number: '7.5'
    text: |-
      1 Aan een besluit als bedoeld in [artikel 7.1][ref1] kunnen voorschriften en beperkingen worden verbonden.

      2 De voorschriften en beperkingen, bedoeld in het eerste lid, kunnen op aanvraag of ambtshalve gewijzigd, aangevuld
      of ingetrokken worden.

      3 Het is verboden te handelen in strijd met voorschriften en beperkingen als bedoeld in het eerste lid.

      4 Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen regels worden gesteld over
      voorschriften en beperkingen als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7.1
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7.1'
        hoofdstuk: '7'
  - number: '7.6'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen regels worden gesteld over:

      a. het indienen van een aanvraag tot een besluit als bedoeld in [artikel 7.1][ref1] dan wel tot verlenging of
      wijziging daarvan, of van een aanvraag tot aanwijzing, als bedoeld in [artikel 2.2, eerste lid][ref2], dan wel tot
      wijziging daarvan;

      b. de behandeling van een aanvraag als bedoeld in onderdeel a;

      c. de wijze waarop een melding plaatsvindt, en

      d. de toepasselijkheid van de bepalingen van de [hoofdstukken 6][ref3], [7][ref4] en
      [8 van de Algemene wet bestuursrecht][ref5] op een besluit.

      2 De regels, bedoeld in het eerste lid, kunnen worden gesteld voor de uitvoering van EU-rechtshandelingen en kunnen
      voorts onder meer betrekking hebben op:

      a. welke gegevens, bescheiden of monsters worden overgelegd alvorens een aanvraag in behandeling wordt genomen;

      b. een daarbij aangewezen onderzoek dat noodzakelijk is alvorens een besluit als bedoeld in [artikel 7.1][ref6]
      wordt verleend, verlengd of gewijzigd of alvorens een diersoort wordt aangewezen op grond van de
      [artikelen 2.2, eerste lid][ref7];

      c. de termijn waarbinnen, na wijziging van omstandigheden, een aanvraag tot wijziging van een besluit als bedoeld
      in [artikel 7.1][ref8] wordt aangevraagd, dan wel een nieuwe melding plaatsvindt;

      d. de termijn voor het geven van een beslissing op een aanvraag, of

      e. wie een aanvraag of een melding kan doen.

      3 Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen regels worden gesteld over
      het verwijzen door aanvragers van een aanwijzing als bedoeld in [artikel 2.2, eerste lid][ref9], een besluit als
      bedoeld in [artikel 7.1][ref10], dan wel door personen die een melding doen, naar gegevens die eerder door hen of
      een ander bij een aanvraag om een aanwijzing als bedoeld in artikel 2.2, eerste lid, een besluit als bedoeld in
      artikel 7.1, dan wel een melding zijn verstrekt.


