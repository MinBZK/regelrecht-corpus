  - number: '1.2'
    text: |-
      1 Het bij en krachtens deze wet gestelde over dieren is van toepassing op gehouden dieren, voor zover niet anders
      is bepaald.

      2 Het bij en krachtens deze wet gestelde over dierlijke producten is tevens van toepassing ten aanzien van
      dierlijke producten van andere dan gehouden dieren en is, voor zover het product tevens een levensmiddel is, van
      toepassing op:

      a. het keuren, uitsnijden, verpakken, merken, opslaan en vervoeren van vlees;

      b. het weren, bestrijden en voorkomen van verspreiding van ziekteverwekkers die schadelijk zijn voor dieren, en

      c. het bevorderen van de kwaliteit van dierlijke producten.

      3 Het bij en krachtens deze wet gestelde over diergeneesmiddelen en diervoeders is met betrekking tot toepassing,
      onderscheidenlijk gebruik bij dieren tevens van toepassing ten aanzien van andere dan gehouden dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel1.2
  - number: '1.3'
    text: |-
      1 De intrinsieke waarde van het dier wordt erkend.

      2 Onder erkenning van de intrinsieke waarde als bedoeld in het eerste lid wordt verstaan erkenning van de eigen
      waarde van dieren, zijnde wezens met gevoel. Bij het stellen van regels bij of krachtens deze wet, en het nemen van
      op die regels gebaseerde besluiten, wordt ten volle rekening gehouden met de gevolgen die deze regels of besluiten
      hebben voor deze intrinsieke waarde van het dier, onverminderd andere gerechtvaardigde belangen. Daarbij wordt
      er in elk geval in voorzien dat de inbreuk op de integriteit of het welzijn van dieren, verder dan redelijkerwijs
      noodzakelijk, wordt voorkomen en dat de zorg die de dieren redelijkerwijs behoeven is verzekerd.

      3 Voor de toepassing van het tweede lid wordt tot de zorg die dieren redelijkerwijs behoeven in elk geval gerekend
      dat dieren zijn gevrijwaard van:

      a. dorst, honger en onjuiste voeding;

      b. fysiek en fysiologisch ongerief;

      c. pijn, verwonding en ziektes;

      d. angst en chronische stress;

      e. beperking van hun natuurlijk gedrag;

      voor zover zulks redelijkerwijs kan worden verlangd.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel1.3
  - number: '2.1'
    text: |-
      1 Het is verboden om zonder redelijk doel of met overschrijding van hetgeen ter bereiking van zodanig doel
      toelaatbaar is, bij een dier pijn of letsel te veroorzaken dan wel de gezondheid of het welzijn van het dier te
      benadelen.

      2 Tot de in het eerste lid verboden gedragingen worden in ieder geval gerekend:

      a. een dier arbeid doen verrichten die kennelijk zijn krachten te boven gaat of waartoe het uit hoofde van zijn
      toestand ongeschikt is;

      b. een koe met overvolle uier vervoeren of op een markt of openbare verkoping ten verkoop houden;

      c. bij de verlossing van een koe gebruikmaken van dierlijke trekkracht of van een niet daarvoor toegelaten
      krachttoestel, en

      d. een hond als trekkracht gebruiken met uitzondering van de sledehondensport, voor zover toegelaten.

      3 Bij algemene maatregel van bestuur kunnen voorts gedragingen worden aangewezen die in ieder geval worden gerekend
      tot de verboden gedragingen, bedoeld in het eerste lid.

      4 Bij ministeriële regeling kunnen regels worden gesteld voor een toelating als bedoeld in het tweede lid,
      onderdeel c en d, of voor de bij algemene maatregel van bestuur, bedoeld in het derde lid, aangewezen gedragingen.

      5 Van de krachtens het derde lid aangewezen gedragingen kan, al dan niet in daarbij aangewezen gevallen, deel
      uitmaken het gebruik van voorwerpen die bij dieren pijn of letsel kunnen veroorzaken, dan wel de gezondheid of het
      welzijn kunnen benadelen.

      6 Een ieder verleent een hulpbehoevend dier de nodige zorg.

      7 Het bij en krachtens het eerste tot en met het zesde lid bepaalde is tevens van toepassing ten aanzien van andere
      dan gehouden dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel2.1
  - number: '2.2'
    text: |-
      1 Het is verboden dieren te houden die niet behoren tot door Onze Minister aangewezen diersoorten of
      diercategorieën.

      2 Bij algemene maatregel van bestuur worden de criteria vastgesteld op grond waarvan Onze Minister diersoorten of
      diercategorieën, bedoeld in het eerste lid, aanwijst.

      3 Bij algemene maatregel van bestuur kan worden geregeld dat het verbod, bedoeld in het eerste lid, slechts van
      toepassing is op één of meer dierklassen.

      4 De [hoofdstukken 6][ref1], [7][ref2] en [8 van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige
      toepassing op de aanwijzing, bedoeld in het eerste lid.

      5 Het is verboden dieren te houden waarbij in strijd met het bepaalde bij of krachtens [artikel 2.25][ref4]
      substanties zijn toegepast.

      6 Het is verboden bij ministeriële regeling aangewezen dieren te houden. Een dier als bedoeld in de eerste volzin
      wordt aangewezen indien het een gevaar kan opleveren voor mens of dier.

      7 Het is verboden dieren behorende tot bij algemene maatregel van bestuur aangewezen diersoorten of diercategorieën
      van het ouderdier te scheiden voordat die dieren een bij die maatregel vastgestelde leeftijd hebben bereikt.

      8 Het is houders van dieren verboden aan deze dieren de nodige verzorging te onthouden.

      9 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende EU-
      rechtshandelingen over het houden van dieren behorende tot bij die maatregel aangewezen diersoorten of
      diercategorieën.

      10 Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het negende lid, voor
      dieren of voor dieren behorende tot bepaalde diersoorten of diercategorieën, regels worden gesteld die betrekking
      hebben op onder meer:

      a. een verbod op de aanwezigheid op of in de nabijheid van een bedrijf van bepaalde:

      1°. diervoeders;

      2°. diergeneesmiddelen, of

      3°. andere substanties of materialen voor zover die een risico kunnen opleveren voor de diergezondheid, het welzijn
      van dieren, de volksgezondheid, het milieu of de kwaliteit van een dierlijk product;

      b. de ruimte of het terrein waar dieren worden gehouden, waaronder:

      1°. de afmeting, uitvoering en vormgeving;

      2°. de wanden, de vloer en de grond;

      3°. de voorzieningen, waaronder de voeder- en drinkwatervoorziening;

      4°. de verlichting, luchtverversing en verwarming;

      5°. het onderbrengen of afzonderen van zieke dieren, dieren die mogelijk met een besmettelijke ziekteverwekker zijn
      besmet, of dieren met een bepaalde gezondheidstoestand;

      6°. de afrasteringen en beschutting, en

      7°. de ligging ten opzichte van onroerende zaken en ruimten waar zich mensen kunnen bevinden;

      c. de wijze waarop dieren worden gehouden, waaronder:

      1°. het vastleggen of aangebonden houden van dieren;

      2°. het gescheiden houden van dieren, al naar gelang de leeftijd, het geslacht of de soort;

      3°. het groeperen van dieren;

      4°. het aantal dieren dat in één ruimte wordt gehouden, en

      5°. de ruimte waarover dieren kunnen beschikken;

      d. de verzorging, de behandeling, het africhten, de voedering en de drenking van dieren;

      e. het gebruik en de bewaring van bepaalde diervoeders, alsmede een verbod daarop;

      f. de bestrijding van organismen die schadelijk zijn voor de gezondheid of het welzijn van dieren;

      g. de reiniging en ontsmetting van ruimten en aanwezige gereedschappen en andere instrumenten of uitrustingen
      waarmee dieren in aanraking kunnen komen;

      h.

      i.

      j. de bedrijfsbegeleiding door een dierenarts;

      k. de bij de houder, de personen die bij hem in dienst zijn en de personen die voor hem diensten verrichten
      aanwezige kennis over het houden van dieren;

      l. het bijhouden, overleggen, controleren, bewaren en melden van gegevens, onder meer over:

      1°. dieren, waaronder de gezondheidstoestand, geboorte- en sterftegevallen;

      2°. bezoekers van bedrijven, en vervoermiddelen;

      3°. de herkomst, bestemming of verplaatsing van dieren, en

      4°. de herkomst, ontvangst, bereiding, bewerking, verwerking en verdere behandeling, opslag en bewaring van
      diervoeders en diergeneesmiddelen, alsmede het gebruik van diervoeders, onderscheidenlijk het toepassen van
      diergeneesmiddelen;

      m. de te verrichten onderzoeken bij dieren of in ruimten of op terreinen en gebieden waar dieren kunnen worden
      gehouden, naar de aanwezigheid van besmettelijke dierziekten, zoönosen, ziekteverschijnselen, ziekteverwekkers of
      organismen die drager van een ziekteverwekker kunnen zijn, of naar de werking van vaccins;

      n. hygiëne, het voorkomen van de verspreiding van dierziekten, zoönosen en ziekteverschijnselen, en het weren van
      ziekteverwekkers;

      o.

      p. de gevallen waarin een dierenarts of een ander persoon die is toegelaten tot het beroepsmatig verrichten van een
      diergeneeskundige handeling, wordt geconsulteerd;

      q. de voorwaarden waaronder, met betrekking tot de wijze waarop dieren worden gehouden op het bedrijf een bij of
      krachtens de maatregel aangewezen exclusieve aanduiding mag worden gebruikt, en

      r. een verbod op het houden van bepaalde diersoorten of diercategorieën, indien niet is voldaan aan ten aanzien van
      dat dier gestelde regels als bedoeld in onderdeel b, c, d, e, f, k, l en p.

      11 Het bepaalde krachtens het tiende lid, onderdeel e, is tevens van toepassing ten aanzien van andere dan gehouden
      dieren.


