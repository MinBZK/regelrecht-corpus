  - number: '8.7'
    text: Onze Minister kan een overtreder een bestuurlijke boete opleggen.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.7
  - number: '8.8'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de hoogte van de bestuurlijke boete
      die voor een overtreding of voor categorieën van overtredingen kan worden opgelegd.

      2 De op grond van het eerste lid te bepalen bestuurlijke boete bedraagt ten hoogste het bedrag dat is bepaald voor
      de vijfde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1], per overtreding
      begaan door een natuurlijke persoon, en ten hoogste het bedrag dat is bepaald voor de zesde categorie, bedoeld
      in artikel 23, vierde lid, van het Wetboek van Strafrecht per overtreding, begaan door een rechtspersoon of een
      vennootschap, of, indien dat meer is, 10 procent van de jaaromzet in het boekjaar voorafgaande aan het boekjaar
      waarin de boete wordt opgelegd.

      3 De berekening van de omzet, bedoeld in het tweede lid, geschiedt op voet van het bepaalde in
      [artikel 377, zesde lid, van boek 2 van het Burgerlijk Wetboek][ref2] voor de netto-omzet.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel377
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '377'
  - number: '8.10'
    text: |-
      1 Indien de ernst van de overtreding of de omstandigheden waaronder zij is begaan daartoe aanleiding geven, wordt
      zij aan het openbaar ministerie voorgelegd.

      2 Indien ter zake van een overtreding aan de overtreder een bestuurlijke boete is opgelegd, dan wel een
      mededeling als bedoeld in [artikel 5:50, tweede lid, onderdeel a, van de Algemene wet bestuursrecht][ref1] is
      verzonden, heeft dit dezelfde rechtsgevolgen als een kennisgeving van niet verdere vervolging als bedoeld in
      [artikel 246, eerste lid, van het Wetboek van Strafvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel550
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel246
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.10
    references:
      - id: ref1
