  - number: '8.46'
    text: |-
      Ingeval bij of krachtens deze wet wordt verwezen naar door de Voedsel- en Landbouworganisatie en de
      Wereldgezondheidsorganisatie tot stand gebrachte voedselstandaarden, codes voor goede praktijken of richtsnoeren,
      kan overtreding daarvan ook worden bestraft met een geldboete indien deze voedselstandaarden, codes voor goede
      praktijken of richtsnoeren in de Engelse taal zijn gesteld en bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.46
  - number: '9.1'
    text: |-
      1 Onze Minister kan een heffing opleggen ter vergoeding van kosten overeenkomstig een door hem vastgesteld tarief
      ter zake van de volgende handelingen:

      a. de behandeling van een aanvraag tot een bij of krachtens deze wet voorgeschreven vergunning,
      erkenning, aanwijzing, toestemming, toelating, registratie, bewijs van vakbekwaamheid, goedkeuring of certificering
      dan wel van een aanvraag tot verlenging of wijziging daarvan;

      b. de instandhouding van de bij of krachtens deze wet verleende vergunning, erkenning, aanwijzing, toestemming,
      toelating, registratie, bewijs van vakbekwaamheid, goedkeuring of certificering;

      c. de behandeling van een aanvraag tot ontheffing van het bij of krachtens deze wet bepaalde, dan wel van een
      aanvraag tot verlenging of wijziging van de ontheffing;

      d. de identificatie en registratie van dieren;

      e. keuringen als bedoeld in [artikel 2.10, derde lid, onderdeel p][ref1],
      [artikel 2.20, tweede lid, onderdeel k][ref2], en [artikel 3.2, tweede lid, onderdeel d][ref3];

      f. het toezicht op de naleving van [artikel 2.15][ref4] bij een wedstrijd, ten laste van de organiserende
      instelling;

      g. onderzoeken, controles of verrichtingen met betrekking tot dieren, diervoeders, diergeneesmiddelen, producten of
      voorwerpen, bedrijven of locaties ter voorkoming en bestrijding van dierziekten, zoönosen en ziekteverschijnselen,
      en ter wering van ziekteverwekkers, voor zover de onderzoeken of verrichtingen zijn voorgeschreven bij een EU-
      rechtshandeling dan wel op verzoek van betrokkenen plaatsvinden;

      h. controles die nodig zijn om de omvang van een overtreding van het bepaalde bij of krachtens deze wet vast
      te stellen, om na te gaan of corrigerende maatregelen zijn genomen, dan wel om een overtreding op te sporen of
      te bewijzen, voor zover de heffing ter vergoeding van kosten van deze controles is voorgeschreven bij een EU-
      rechtshandeling, en

      i. de beoordeling van gidsen als bedoeld [artikel 8.44][ref5];

      j. het bijhouden van gegevens in een register als bedoeld in [artikel 7.2, tweede lid][ref6].

      2 Bij of krachtens algemene maatregel van bestuur kan een heffing ter vergoeding van kosten worden opgelegd
      overeenkomstig een vastgesteld tarief ter zake van bij die maatregel benoemde onderzoeken of verrichtingen voor
      zover de onderzoeken of verrichtingen zijn voorgeschreven bij of krachtens deze wet of bij EU-verordening.

      3 Een tarief als bedoeld in het eerste of tweede lid wordt zodanig vastgesteld dat de geraamde baten niet uitgaan
      boven de geraamde kosten die in een rechtstreeks verband staan met de werkzaamheden waarvoor het tarief wordt
      opgelegd, onverminderd de daaromtrent bij een EU-rechtshandeling vastgestelde voorschriften.

      4 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de betaling van de heffing, en kan
      worden geregeld dat een handeling als bedoeld in het eerste lid, aanhef, slechts dan wordt uitgevoerd nadat
      betaling van de heffing heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2.10
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2.20
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel3.2
      [ref4]: https://wetten.overheid.nl/BWBR0030250#Artikel2.15
