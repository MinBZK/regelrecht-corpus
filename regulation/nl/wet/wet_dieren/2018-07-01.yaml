  - number: '2.15'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de uitvoering van bindende
      onderdelen van EU-rechtshandelingen over wedstrijden met dieren.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het eerste lid, regels
      worden gesteld die betrekking hebben op onder meer:

      a. een verbod op het organiseren en het houden van wedstrijden met een bepaald doel, en het daaraan doen deelnemen
      van dieren;

      b. een verbod voor bepaalde personen op het organiseren van wedstrijden;

      c. de leeftijd, de gezondheidstoestand en afkomst van de dieren die aan wedstrijden deelnemen;

      d. de frequentie waarmee dieren aan wedstrijden deelnemen;

      e. een verbod op het inschrijven voor, het toelaten tot en het deelnemen aan wedstrijden van bepaalde dieren;

      f. de aanwezigheid van een dierenarts bij wedstrijden;

      g. de baan- en hindernisbouw bij wedstrijden;

      h. de organisatie van wedstrijden en de inrichting van wedstrijdterreinen, en

      i. hygiëne, het voorkomen van de verspreiding van dierziekten, zoönosen en ziekteverschijnselen, en het weren van
      ziekteverwekkers.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het gebruik van substanties bij
      dieren die het prestatievermogen van dieren in wedstrijden kunnen beïnvloeden.

      4 De regels, bedoeld in het derde lid, kunnen betrekking hebben op onder meer:

      a. een verbod op het gebruik van bepaalde substanties en het vaststellen van het maximum toegestane gehalte aan
      bepaalde substanties;

      b. de toepassing van substanties bij dieren;

      c. de uitsluiting van dieren van deelname aan wedstrijden ingeval in de dieren een substantie, een bestanddeel
      daarvan of een omzettingsproduct, aanwezig is, of dat wordt vermoed;

      d. de wijze waarop de aanwezigheid van een substantie in dieren, een bestanddeel daarvan of een omzettingsproduct,
      wordt aangetoond, en

      e. een verbod op het voorhanden, in voorraad of aanwezig hebben van substanties.

      5 Het is verboden deel te nemen aan wedstrijden met dieren waarbij een bij [artikel 2.8][ref1] verboden
      lichamelijke ingreep is verricht.

      6 Het is verboden dieren waarbij een bij [artikel 2.8][ref2] verboden lichamelijke ingreep is verricht, tot een
      wedstrijd toe te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2.8
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2.8
