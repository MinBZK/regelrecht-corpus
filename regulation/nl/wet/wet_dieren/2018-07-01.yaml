  - number: '3.3'
    text: |-
      1 Bij ministeriële regeling kunnen met het oog op de doelmatige voorziening in de verwerking van bij die regeling
      aangewezen dierlijke bijproducten werkgebieden worden vastgesteld waarin een ondernemer met uitsluiting van andere
      ondernemers deze producten verwerkt of door verbranding verwijdert.

      2 Bij ministeriële regeling kan:

      a. een in het eerste lid bedoeld werkgebied worden vastgesteld dat zich uitstrekt tot het grondgebied van een
      andere lidstaat van de Europese Unie of een gedeelte daarvan, indien daarover overeenstemming bestaat met de
      desbetreffende lidstaat, en

      b. een in het eerste lid bedoeld werkgebied worden vastgesteld voor een ondernemer die is gevestigd in een andere
      lidstaat van de Europese Unie.

      3 Indien aan een in het tweede lid, onderdeel b, bedoelde ondernemer een werkgebied binnen Nederland is toegewezen,
      zijn de [artikelen 3.4][ref1], [3.5][ref2] en [3.6][ref3] van overeenkomstige toepassing.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de toepassing,
      vaststelling of wijziging van werkgebieden.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot situaties waarin
      wordt afgeweken van het eerste lid, ingeval de ondernemer als gevolg van overmacht niet in staat is om de ingevolge
      het eerste lid aangewezen dierlijke bijproducten te verwerken, waarbij Onze Minister een of meer andere verwerkers
      tijdelijk kan toestaan of aanwijzen om deze dierlijke bijproducten te verwerken of te verwijderen. Deze regels zijn
      van toepassing zolang de situatie dit vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel3.4
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel3.5
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel3.6
