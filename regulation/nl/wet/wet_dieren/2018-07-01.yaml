    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bepaalde bij of
      krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel8.5
  - number: '8.6'
    text: |-
      1 In deze paragraaf wordt verstaan onder:

      a. *overtreding:* gedraging die in strijd is met het bepaalde bij of krachtens:

      1°. de [artikelen 2.2, negende en tiende lid][ref1], [2.3, derde en vierde lid][ref2],
      [2.4, eerste, tweede en derde lid][ref3], [2.5, eerste en tweede lid][ref4],
      [2.6, eerste, tweede en derde lid][ref5], [2.7, eerste tot en met derde lid][ref6],
      [2.8, eerste lid, onderdelen b en c, en vierde lid, onderdeel f][ref7], [2.10, tweede, derde en vierde lid][ref8],
      [2.17][ref9], [2.18][ref10], [2.19, eerste lid][ref11], [2.20][ref12], [2.21, eerste en derde lid][ref13],
      [2.22, eerste, tweede en derde lid][ref14], [3.1][ref15], [3.2, eerste en tweede lid][ref16], [3.4][ref17],
      [3.5, eerste en derde lid][ref18], [5.1, derde lid, tweede volzin][ref19], [5.4, eerste lid][ref20],
      [5.5, eerste lid][ref21], [5.6, eerste en vijfde lid][ref22], [5.10][ref23], [5.11][ref24], [5.12][ref25]
      of [10.2, eerste lid][ref26];

      2°. een van de bepalingen, bedoeld in onderdeel a, in samenhang met de [artikelen 6.2, eerste lid][ref27],
      [6.4, eerste lid][ref28], [7.1][ref29], [7.2, eerste of derde lid][ref30], [7.5, derde lid][ref31],
      of [10.5, eerste lid][ref32];

      b. *overtreder:* degene die de overtreding pleegt of mede pleegt.

      2 Indien een overtreding is gepleegd door een rechtspersoon, wordt onder overtreder mede verstaan: degene die tot
      de overtreding opdracht heeft gegeven of daaraan feitelijk leiding heeft gegeven.


