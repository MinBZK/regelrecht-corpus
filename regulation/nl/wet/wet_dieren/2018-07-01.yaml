  - number: '7.7'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kan worden bepaald dat Onze Minister
      over een besluit als bedoeld in [artikel 7.1][ref1], of de wijziging, de verlenging, de schorsing of de intrekking
      daarvan, wordt geadviseerd door een commissie.

      2 Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen regels worden gesteld over:

      a. de samenstelling en de werkwijze van een commissie als bedoeld in het eerste lid, en

      b. de benoeming, de zittingsduur, schorsing en ontslag van leden van de commissie en hun beloning.

      3 De leden van een commissie houden al hetgeen hun in hun hoedanigheid is bekend geworden geheim voor zover zij
      niet in hun hoedanigheid tot mededeling daarvan bevoegd of verplicht zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7.1
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7.1'
        hoofdstuk: '7'
  - number: '7.8'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de gevallen waarin een besluit als
      bedoeld in [artikel 7.1][ref1] kan worden verlengd, geschorst of ingetrokken.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin een
      besluit als bedoeld in [artikel 7.1][ref2] van rechtswege vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7.1
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel7.1
    url: https://wetten.overheid.nl/BWBR0030250/2018-07-01#Artikel7.8
