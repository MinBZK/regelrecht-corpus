  - number: '8.3'
    text: |-
      In het in [artikel 5:18, eerste lid, van de Algemene wet bestuursrecht][ref1] bedoelde geval verpakken en
      verzegelen de in de [artikelen 8.1, eerste lid][ref2], en [8.14][ref3] bedoelde ambtenaren en personen de monsters
      ter plaatse.


