  - number: 10.10.2
    text: |-
      Een ministeriële regeling als bedoeld in [artikel 2.18a, eerste lid][ref1], of [3.7][ref2], wordt niet eerder
      vastgesteld dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd, tenzij binnen
      deze termijn door of namens een van de Kamers of ten minste een vijfde van het grondwettelijk aantal leden van een
      van de Kamers nadere inlichtingen worden gevraagd. De ministeriële regeling kan niet eerder worden vastgesteld dan
      nadat de Kamer die de nadere inlichtingen heeft gevraagd, heeft vastgesteld dat deze genoegzaam zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel3
