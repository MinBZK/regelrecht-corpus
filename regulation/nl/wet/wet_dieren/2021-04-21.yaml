  - number: 1.1.2
    text: |-
      Onder handel wordt mede verstaan: het bezit met het oog op verkoop, met inbegrip van het aanbieden, enige vorm van
      al dan niet gratis overdracht aan derden, alsmede de verkoop en andere vormen van overdracht zelf.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel1.1
  - number: 1.2.1
    text: |-
      Het bij en krachtens deze wet gestelde over dieren is van toepassing op gehouden dieren, voor zover niet anders
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel1.2
  - number: 1.2.2
    text: |-
      Het bij en krachtens deze wet gestelde over dierlijke producten is tevens van toepassing ten aanzien van dierlijke
      producten van andere dan gehouden dieren en is, voor zover het product tevens een levensmiddel is, van toepassing
      op:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel1.2
  - number: 1.2.2.a
    text: het keuren, uitsnijden, verpakken, merken, opslaan en vervoeren van vlees;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel1.2
  - number: 1.2.2.b
    text: het weren, bestrijden en voorkomen van verspreiding van ziekteverwekkers die schadelijk zijn voor dieren, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel1.2
  - number: 1.2.2.c
    text: het bevorderen van de kwaliteit van dierlijke producten.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel1.2
  - number: 1.2.3
    text: |-
      Het bij en krachtens deze wet gestelde over diergeneesmiddelen en diervoeders is met betrekking tot toepassing,
      onderscheidenlijk gebruik bij dieren tevens van toepassing ten aanzien van andere dan gehouden dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel1.2
  - number: 1.3.1
    text: De intrinsieke waarde van het dier wordt erkend.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel1.3
  - number: 1.3.2
    text: |-
      Onder erkenning van de intrinsieke waarde als bedoeld in het eerste lid wordt verstaan erkenning van de eigen
      waarde van dieren, zijnde wezens met gevoel. Bij het stellen van regels bij of krachtens deze wet, en het nemen van
      op die regels gebaseerde besluiten, wordt ten volle rekening gehouden met de gevolgen die deze regels of besluiten
      hebben voor deze intrinsieke waarde van het dier, onverminderd andere gerechtvaardigde belangen. Daarbij wordt
      er in elk geval in voorzien dat de inbreuk op de integriteit of het welzijn van dieren, verder dan redelijkerwijs
      noodzakelijk, wordt voorkomen en dat de zorg die de dieren redelijkerwijs behoeven is verzekerd.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel1.3
  - number: 1.3.3
    text: |-
      Voor de toepassing van het tweede lid wordt tot de zorg die dieren redelijkerwijs behoeven in elk geval gerekend
      dat dieren zijn gevrijwaard van:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel1.3
  - number: 1.3.3.a
    text: dorst, honger en onjuiste voeding;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel1.3
  - number: 1.3.3.b
    text: fysiek en fysiologisch ongerief;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel1.3
  - number: 1.3.3.c
    text: pijn, verwonding en ziektes;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel1.3
  - number: 1.3.3.d
    text: angst en chronische stress;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel1.3
  - number: 1.3.3.e
    text: beperking van hun natuurlijk gedrag;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel1.3
  - number: 2.1.1
    text: |-
      Het is verboden om zonder redelijk doel of met overschrijding van hetgeen ter bereiking van zodanig doel
      toelaatbaar is, bij een dier pijn of letsel te veroorzaken dan wel de gezondheid of het welzijn van het dier te
      benadelen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.1
  - number: 2.1.2
    text: 'Tot de in het eerste lid verboden gedragingen worden in ieder geval gerekend:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.1
  - number: 2.1.2.a
    text: |-
      een dier arbeid doen verrichten die kennelijk zijn krachten te boven gaat of waartoe het uit hoofde van zijn
      toestand ongeschikt is;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.1
  - number: 2.1.2.b
    text: een koe met overvolle uier vervoeren of op een markt of openbare verkoping ten verkoop houden;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.1
  - number: 2.1.2.c
    text: |-
      bij de verlossing van een koe gebruikmaken van dierlijke trekkracht of van een niet daarvoor toegelaten
      krachttoestel, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.1
  - number: 2.1.2.d
    text: een hond als trekkracht gebruiken met uitzondering van de sledehondensport, voor zover toegelaten.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.1
  - number: 2.1.3
    text: |-
      Bij algemene maatregel van bestuur kunnen voorts gedragingen worden aangewezen die in ieder geval worden gerekend
      tot de verboden gedragingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.1
  - number: 2.1.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor een toelating als bedoeld in het tweede lid, onderdeel
      c en d, of voor de bij algemene maatregel van bestuur, bedoeld in het derde lid, aangewezen gedragingen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.1
  - number: 2.1.5
    text: |-
      Van de krachtens het derde lid aangewezen gedragingen kan, al dan niet in daarbij aangewezen gevallen, deel
      uitmaken het gebruik van voorwerpen die bij dieren pijn of letsel kunnen veroorzaken, dan wel de gezondheid of het
      welzijn kunnen benadelen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.1
  - number: 2.1.6
    text: Een ieder verleent een hulpbehoevend dier de nodige zorg.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.1
  - number: 2.1.7
    text: |-
      Het bij en krachtens het eerste tot en met het zesde lid bepaalde is tevens van toepassing ten aanzien van andere
      dan gehouden dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.1
  - number: 2.2.1
    text: Het is verboden dieren te houden die niet behoren tot door Onze Minister aangewezen diersoorten of diercategorieën.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.2
    text: |-
      Bij algemene maatregel van bestuur worden de criteria vastgesteld op grond waarvan Onze Minister diersoorten of
      diercategorieën, bedoeld in het eerste lid, aanwijst.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.3
    text: |-
      Bij algemene maatregel van bestuur kan worden geregeld dat het verbod, bedoeld in het eerste lid, slechts van
      toepassing is op één of meer dierklassen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.4
    text: |-
      De [hoofdstukken 6][ref1], [7][ref2] en [8 van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige
      toepassing op de aanwijzing, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: 2.2.5
    text: |-
      Het is verboden dieren te houden waarbij in strijd met het bepaalde bij of krachtens [artikel 2.25][ref1]
      substanties zijn toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 2.2.6
    text: |-
      Het is verboden bij ministeriële regeling aangewezen dieren te houden. Een dier als bedoeld in de eerste volzin
      wordt aangewezen indien het een gevaar kan opleveren voor mens of dier.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.7
    text: |-
      Het is verboden dieren behorende tot bij algemene maatregel van bestuur aangewezen diersoorten of diercategorieën
      van het ouderdier te scheiden voordat die dieren een bij die maatregel vastgestelde leeftijd hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.8
    text: Het is houders van dieren verboden aan deze dieren de nodige verzorging te onthouden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen over het houden van dieren behorende tot bij die maatregel aangewezen diersoorten of
      diercategorieën.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het negende lid, voor dieren
      of voor dieren behorende tot bepaalde diersoorten of diercategorieën, regels worden gesteld die betrekking hebben
      op onder meer:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.a
    text: 'een verbod op de aanwezigheid op of in de nabijheid van een bedrijf van bepaalde:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.a.1°
    text: diervoeders;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.a.2°
    text: diergeneesmiddelen, of
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.a.3°
    text: |-
      andere substanties of materialen voor zover die een risico kunnen opleveren voor de diergezondheid, het welzijn van
      dieren, de volksgezondheid, het milieu of de kwaliteit van een dierlijk product;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.b
    text: 'de ruimte of het terrein waar dieren worden gehouden, waaronder:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.b.1°
    text: de afmeting, uitvoering en vormgeving;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.b.2°
    text: de wanden, de vloer en de grond;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.b.3°
    text: de voorzieningen, waaronder de voeder- en drinkwatervoorziening;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.b.4°
    text: de verlichting, luchtverversing en verwarming;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.b.5°
    text: |-
      het onderbrengen of afzonderen van zieke dieren, dieren die mogelijk met een besmettelijke ziekteverwekker zijn
      besmet, of dieren met een bepaalde gezondheidstoestand;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.b.6°
    text: de afrasteringen en beschutting, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.b.7°
    text: de ligging ten opzichte van onroerende zaken en ruimten waar zich mensen kunnen bevinden;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.c
    text: 'de wijze waarop dieren worden gehouden, waaronder:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.c.1°
    text: het vastleggen of aangebonden houden van dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.c.2°
    text: het gescheiden houden van dieren, al naar gelang de leeftijd, het geslacht of de soort;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.c.3°
    text: het groeperen van dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.c.4°
    text: het aantal dieren dat in één ruimte wordt gehouden, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.c.5°
    text: de ruimte waarover dieren kunnen beschikken;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.d
    text: de verzorging, de behandeling, het africhten, de voedering en de drenking van dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.e
    text: het gebruik en de bewaring van bepaalde diervoeders, alsmede een verbod daarop;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.f
    text: de bestrijding van organismen die schadelijk zijn voor de gezondheid of het welzijn van dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.g
    text: |-
      de reiniging en ontsmetting van ruimten en aanwezige gereedschappen en andere instrumenten of uitrustingen waarmee
      dieren in aanraking kunnen komen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.h
    text: het opslaan van kadavers buiten de nabijheid van dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.i
    text: het bijeenbrengen, het aanvoeren en het afvoeren van dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.j
    text: de bedrijfsbegeleiding door een dierenarts;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.k
    text: |-
      de bij de houder, de personen die bij hem in dienst zijn en de personen die voor hem diensten verrichten aanwezige
      kennis over het houden van dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.l
    text: 'het bijhouden, overleggen, controleren, bewaren en melden van gegevens, onder meer over:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.l.1°
    text: dieren, waaronder de gezondheidstoestand, geboorte- en sterftegevallen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.l.2°
    text: bezoekers van bedrijven, en vervoermiddelen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.l.3°
    text: de herkomst, bestemming of verplaatsing van dieren, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.l.4°
    text: |-
      de herkomst, ontvangst, bereiding, bewerking, verwerking en verdere behandeling, opslag en bewaring van diervoeders
      en diergeneesmiddelen, alsmede het gebruik van diervoeders, onderscheidenlijk het toepassen van diergeneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.m
    text: |-
      de te verrichten onderzoeken bij dieren of in ruimten of op terreinen en gebieden waar dieren kunnen worden
      gehouden, naar de aanwezigheid van besmettelijke dierziekten, zoönosen, ziekteverschijnselen, ziekteverwekkers of
      organismen die drager van een ziekteverwekker kunnen zijn, of naar de werking van vaccins;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.n
    text: |-
      hygiëne, het voorkomen van de verspreiding van dierziekten, zoönosen en ziekteverschijnselen, en het weren van
      ziekteverwekkers;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.o
    text: |-
      de behandeling en aanbieding voor onderzoek van doodgeboren of gestorven dieren, levende dierlijke producten,
      onvoldragen vruchten of nageboorten;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.p
    text: |-
      de gevallen waarin een dierenarts of een ander persoon die is toegelaten tot het beroepsmatig verrichten van een
      diergeneeskundige handeling, wordt geconsulteerd;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.q
    text: |-
      de voorwaarden waaronder, met betrekking tot de wijze waarop dieren worden gehouden op het bedrijf een bij of
      krachtens de maatregel aangewezen exclusieve aanduiding mag worden gebruikt, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.10.r
    text: |-
      een verbod op het houden van bepaalde diersoorten of diercategorieën, indien niet is voldaan aan ten aanzien van
      dat dier gestelde regels als bedoeld in onderdeel b, c, d, e, f, k, l en p.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.2.11
    text: |-
      Het bepaalde krachtens het tiende lid, onderdeel e, is tevens van toepassing ten aanzien van andere dan gehouden
      dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.2
  - number: 2.3.1
    text: Het is verboden dieren te gebruiken met het oog op de productie van dierlijke producten.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.3
  - number: 2.3.2
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing op dieren behorende tot bij of krachtens algemene
      maatregel van bestuur aangewezen diersoorten of diercategorieën.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.3
  - number: 2.3.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden in het belang van de bescherming van het welzijn en de
      gezondheid van dieren regels gesteld voor de uitvoering van bindende onderdelen van EU-rechtshandelingen over de
      doeleinden of activiteiten waarvoor dieren, diersoorten of diercategorieën kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.3
  - number: 2.3.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het derde lid, regels worden
      gesteld die betrekking hebben op onder meer:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.3
  - number: 2.3.4.a
    text: |-
      een verbod op het gebruik van bepaalde dieren, diersoorten of diercategorieën voor bepaalde doelen of activiteiten,
      en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.3
  - number: 2.3.4.b
    text: |-
      het toestaan van het gebruik van bepaalde dieren, diersoorten of diercategorieën voor bepaalde doelen of
      activiteiten onder bij of krachtens de in het derde lid bedoelde algemene maatregel van bestuur gestelde
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.3
  - number: 2.4.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen over de identificatie van dieren behorende tot bij die maatregel aangewezen diersoorten
      of diercategorieën.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.4
  - number: 2.4.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het eerste lid, regels worden
      gesteld voor bij deze maatregel aangewezen diersoorten of diercategorieën die betrekking hebben op onder meer:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.4
  - number: 2.4.2.a
    text: de verplichting tot identificatie;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.4
  - number: 2.4.2.b
    text: de hoedanigheid van de identificatiemiddelen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.4
  - number: 2.4.2.c
    text: de gegevens die in of op de identificatiemiddelen worden vermeld of vastgelegd;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.4
  - number: 2.4.2.d
    text: de wijze en het moment van aanbrengen van identificatiemiddelen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.4
  - number: 2.4.2.e
    text: de verwijdering en vervanging van identificatiemiddelen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.4
  - number: 2.4.2.f
    text: |-
      de productie, het vervoeren, het te koop aanbieden, het verkopen, het voorhanden of in voorraad hebben, het
      afleveren en het in de handel brengen van identificatiemiddelen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.4
  - number: 2.4.2.g
    text: het document waarin gegevens met betrekking tot de identificatie van dieren worden vastgelegd, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.4
  - number: 2.4.2.h
    text: |-
      een verbod op het houden van een bepaald dier, bepaalde diersoorten of diercategorieën, indien niet is voldaan aan
      ten aanzien van dat dier of die dieren gestelde regels als bedoeld in de onderdelen a tot en met g.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.4
  - number: 2.4.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen tevens regels worden gesteld met betrekking tot dieren
      en het bedrijf waar de dieren worden of zijn gehouden, ingeval ten aanzien van één of meer van de op het bedrijf
      aanwezige dieren niet kan worden voldaan aan de krachtens dit artikel gestelde regels.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.4
  - number: 2.5.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen over het vervoer van dieren behorende tot bij die maatregel aangewezen diersoorten of
      diercategorieën.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.5
  - number: 2.5.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het eerste lid, regels worden
      gesteld voor bij deze maatregel aangewezen diersoorten of diercategorieën die betrekking hebben op onder meer:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.5
  - number: 2.5.2.a
    text: een verbod op het vervoeren van bepaalde dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.5
  - number: 2.5.2.b
    text: de bij de te vervoeren dieren te verrichten onderzoeken;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.5
  - number: 2.5.2.c
    text: het bijeenbrengen, aanvoeren en afvoeren van dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.5
  - number: 2.5.2.d
    text: de bewijsstukken die de dieren tijdens het vervoer vergezellen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.5
  - number: 2.5.2.e
    text: de wijze van vervoer;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.5
  - number: 2.5.2.f
    text: de duur en de afstand van het vervoer, met inbegrip van rustpauzes;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.5
  - number: 2.5.2.g
    text: het in-, bij-, uit- en overladen van dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.5
  - number: 2.5.2.h
    text: de beladingsdichtheid van vervoermiddelen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.5
  - number: 2.5.2.i
    text: het verzegelen of merken van vervoermiddelen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.5
  - number: 2.5.2.j
    text: voorwerpen die ten behoeve van het vervoer van dieren worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.5
  - number: 2.5.2.k
    text: de verzorging, voedering en drenking van dieren tijdens het vervoer;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.5
  - number: 2.5.2.l
    text: de over het vervoer bij te houden gegevens;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.5
  - number: 2.5.2.m
    text: de reiniging en ontsmetting van vervoermiddelen, en de plaatsen of inrichtingen waar dit plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.5
  - number: 2.5.2.n
    text: |-
      hygiëne, het voorkomen van de verspreiding van dierziekten, zoönosen en ziekteverschijnselen, en het weren van
      ziekteverwekkers, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.5
  - number: 2.5.2.o
    text: de vakbekwaamheid van degene die de dieren vervoert of die bij het vervoer betrokken is.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.5
  - number: 2.6.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen over het fokken van en het voor de fok gebruiken van dieren behorende tot bij die
      maatregel aangewezen diersoorten of diercategorieën.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.6
  - number: 2.6.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het eerste lid, regels worden
      gesteld voor bij deze maatregel aangewezen diersoorten of diercategorieën die betrekking hebben op onder meer:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.6
  - number: 2.6.2.a
    text: 'een verbod op het fokken of het voor de fok gebruiken van:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.6
  - number: 2.6.2.a.1°
    text: |-
      dieren die beschikken over een bepaalde aandoening die, of een uiterlijk kenmerk dat, de gezondheid of het welzijn
      van het dier of de nakomelingen van het dier kan aantasten;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.6
  - number: 2.6.2.a.2°
    text: dieren die een gevaar kunnen opleveren voor de veiligheid van mens of dier, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.6
  - number: 2.6.2.a.3°
    text: andere bij of krachtens algemene maatregel van bestuur aangewezen dieren, diersoorten of diercategorieën;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.6
  - number: 2.6.2.b
    text: de methode van fokken, waaronder een verbod op bepaalde methoden van fokken;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.6
  - number: 2.6.2.c
    text: |-
      het voorafgaand aan het fokken door de fokker te verrichten of te doen verrichten onderzoek bij dieren waarmee
      wordt gefokt naar de aanwezigheid van aandoeningen die de gezondheid of het welzijn van de dieren of de
      nakomelingen van die dieren kunnen aantasten;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.6
  - number: 2.6.2.d
    text: |-
      hygiëne, het voorkomen van de verspreiding van dierziekten, zoönosen en ziekteverschijnselen, en het weren van
      ziekteverwekkers;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.6
  - number: 2.6.2.e
    text: het aantal nesten dat dieren gedurende een bepaalde periode krijgen, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.6
  - number: 2.6.2.f
    text: de bij te houden en over te leggen gegevens.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.6
  - number: 2.6.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het eerste lid, in het belang
      van de bevordering van de raszuiverheid of de verbetering van raskenmerken tevens regels worden gesteld voor bij
      deze maatregel aangewezen diersoorten of diercategorieën die betrekking hebben op onder meer:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.6
  - number: 2.6.3.a
    text: de organisaties die stamboeken of registers bijhouden;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.6
  - number: 2.6.3.b
    text: de eisen aan dieren, hun sperma, eicellen en embryo’s, onder meer voor inschrijving in een stamboek;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.6
  - number: 2.6.3.c
    text: het keuren van dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.6
  - number: 2.6.3.d
    text: de methoden voor het onderzoek naar en beoordeling van de prestaties en de genetische waarde van dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.6
  - number: 2.6.3.e
    text: het bewijs van inschrijving in een stamboek van dieren, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.6
  - number: 2.6.3.f
    text: de voorwaarden voor toelating van fokdieren tot de voortplanting.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.6
  - number: 2.7.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen over het verkopen, het ten verkoop in voorraad hebben, het ten verkoop aanbieden, het
      kopen, het verhuren, het afleveren, het in de handel brengen en het in of buiten Nederland brengen van dieren
      behorende tot bij die maatregel aangewezen diersoorten of diercategorieën.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.7
  - number: 2.7.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het eerste lid, regels worden
      gesteld die betrekking hebben op onder meer:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.7
  - number: 2.7.2.a
    text: |-
      een verbod op het verkopen, het voor de verkoop in voorraad hebben, het voor de verkoop aanbieden, het kopen, het
      verhuren, het afleveren, het in de handel brengen of het in of buiten Nederland brengen van:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.7
  - number: 2.7.2.a.1°
    text: |-
      dieren waarbij in strijd met het bepaalde bij of krachtens [artikel 2.25][ref1] substanties zijn toegepast, en


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 2.7.2.a.2°
    text: andere aangewezen dieren, diersoorten of diercategorieën;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.7
  - number: 2.7.2.b
    text: de afkomst van de dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.7
  - number: 2.7.2.c
    text: de documenten die de dieren vergezellen of die worden overgelegd;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.7
  - number: 2.7.2.d
    text: de gezondheidstoestand van de dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.7
  - number: 2.7.2.e
    text: de bij de dieren te verrichten onderzoeken;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.7
  - number: 2.7.2.f
    text: |-
      degene die de dieren in de handel brengt, verkoopt, voor de verkoop in voorraad heeft, voor de verkoop aanbiedt,
      koopt, verhuurt of aflevert;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.7
  - number: 2.7.2.g
    text: de bij te houden en over te leggen gegevens;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.7
  - number: 2.7.2.h
    text: de bedrijfsruimten;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.7
  - number: 2.7.2.i
    text: de hoedanigheid van de dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.7
  - number: 2.7.2.j
    text: de herkomst en bestemming van de dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.7
  - number: 2.7.2.k
    text: |-
      hygiëne, het voorkomen van de verspreiding van dierziekten, zoönosen en ziekteverschijnselen en het weren van
      ziekteverwekkers;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.7
  - number: 2.7.2.l
    text: |-
      de vakbekwaamheid van degene die de dieren in de handel brengt, verkoopt, voor de verkoop in voorraad heeft, voor
      de verkoop aanbiedt, koopt, verhuurt of aflevert, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.7
  - number: 2.7.2.m
    text: |-
      een verbod op het verkopen van bij of krachtens die maatregel aangewezen diersoorten of diercategorieën aan een
      persoon van wie niet is vastgesteld dat deze een in die maatregel genoemde leeftijd heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.7
  - number: 2.7.3
    text: |-
      Het is verboden dieren waarbij een bij [artikel 2.8][ref1] verboden lichamelijke ingreep is verricht voor de
      verkoop in voorraad te hebben, voor de verkoop aan te bieden, te verkopen en te kopen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.8.1
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
  - number: 2.8.1.a
    text: lichamelijke ingrepen te verrichten;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
  - number: 2.8.1.b
    text: |-
      diergeneesmiddelen waarvoor geen vergunning als bedoeld in [artikel 2.19, eerste lid][ref1], is verstrekt, bij
      dieren toe te passen, of


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.8.1.c
    text: |-
      diergeneesmiddelen toe te passen in strijd met voorschriften en beperkingen als bedoeld in
      [artikel 2.19, derde lid, onderdeel a][ref1], die zijn verbonden aan de vergunning die ten behoeve van dat
      diergeneesmiddel is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.8.2
    text: 'Het verbod, bedoeld in het eerste lid, is niet van toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
  - number: 2.8.2.a
    text: lichamelijke ingrepen waarvoor een diergeneeskundige noodzaak bestaat;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
  - number: 2.8.2.b
    text: bij of krachtens algemene maatregel van bestuur aangewezen lichamelijke ingrepen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
  - number: 2.8.2.c
    text: overige bij of krachtens enig wettelijk voorschrift verplichte dan wel toegestane lichamelijke ingrepen, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
  - number: 2.8.2.d
    text: |-
      het toepassen van diergeneesmiddelen als bedoeld in het eerste lid, onderdelen b en c, in bij of krachtens algemene
      maatregel van bestuur aangewezen gevallen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
  - number: 2.8.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen over het verrichten van diergeneeskundige handelingen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
  - number: 2.8.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het derde lid, regels worden
      gesteld die betrekking hebben op onder meer:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
  - number: 2.8.4.a
    text: de verplichting om daarbij aangewezen diergeneeskundige handelingen te verrichten;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
  - number: 2.8.4.b
    text: de wijze waarop en de voorwaarden waaronder diergeneeskundige handelingen worden verricht;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
  - number: 2.8.4.c
    text: |-
      de aanwijzing van dieren waarbij of met betrekking tot welke de daarbij aangewezen diergeneeskundige handelingen
      mogen worden verricht;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
  - number: 2.8.4.d
    text: de inrichting en het gebruik van de ruimten waarin diergeneeskundige handelingen worden verricht;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
  - number: 2.8.4.e
    text: |-
      de hoedanigheid, het voorhanden of in voorraad hebben, het aanbieden, het afleveren, het verkopen, het kopen, het
      in de handel brengen, het in en buiten Nederland brengen en het gebruik van hulpmiddelen, waaronder apparatuur, die
      bij het verrichten van diergeneeskundige handelingen worden gebruikt, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
  - number: 2.8.4.f
    text: |-
      het bijhouden, overleggen, controleren, bewaren en melden van gegevens over verrichte diergeneeskundige
      handelingen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
  - number: 2.8.4.g
    text: de bedrijfsbegeleiding door een dierenarts.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
  - number: 2.8.5
    text: |-
      Voor de toepassing van het eerste lid en vierde lid en de daarop berustende bepalingen wordt met het toepassen van
      een diergeneesmiddel bij een dier gelijkgesteld het toepassen van een diergeneesmiddel bij materiaal van dierlijke
      herkomst, uitgezonderd cel- of weefselcultures.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
  - number: 2.8.6
    text: |-
      Het bij en krachtens het eerste tot en met het vijfde lid bepaalde is tevens van toepassing ten aanzien van andere
      dan gehouden dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
  - number: 2.8.7
    text: |-
      Het bij en krachtens het eerste tot en met zesde lid bepaalde is tevens van toepassing ten aanzien van diervoeders
      met medicinale werking.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.8
  - number: 2.9.1
    text: |-
      Het beroepsmatig verrichten van diergeneeskundige handelingen is verboden voor een ieder die daartoe niet bij of
      krachtens [artikel 4.1][ref1] is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
        hoofdstuk: '4'
  - number: 2.9.2
    text: |-
      Het anders dan beroepsmatig verrichten van lichamelijke ingrepen is verboden voor anderen dan de personen, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.9
  - number: 2.9.3
    text: |-
      De verboden, bedoeld in het eerste en tweede lid, zijn niet van toepassing op bij of krachtens algemene maatregel
      van bestuur aangewezen diergeneeskundige handelingen. De aanwijzing van diergeneeskundige handelingen kan worden
      beperkt tot het in een bepaalde hoedanigheid verrichten van de aangewezen handeling.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.9
  - number: 2.9.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen andere diergeneeskundige handelingen dan lichamelijke
      ingrepen worden aangewezen waarvan het anders dan beroepsmatig verrichten bij dieren, verboden is.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.9
  - number: 2.9.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de kwalificaties
      van andere personen dan die bij of krachtens [artikel 4.1][ref1] zijn toegelaten, die diergeneeskundige handelingen
      verrichten, waaronder de opleiding en bij- of nascholing.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
        hoofdstuk: '4'
  - number: 2.9.6
    text: |-
      Het bij en krachtens het eerste tot en met het vijfde lid bepaalde is tevens van toepassing op het verrichten van
      diergeneeskundige handelingen bij andere dan gehouden dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.9
  - number: 2.10.1
    text: |-
      Het is verboden om dieren behorend tot bij algemene maatregel van bestuur aangewezen diersoorten of diercategorieën
      te doden, behoudens in gevallen waarin een dier wordt gedood voor de bedrijfsmatige productie van dierlijke
      producten of in bij of krachtens algemene maatregel van bestuur aangewezen gevallen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen over het doden, het bedwelmen, het fixeren, het onderbrengen en het verplaatsen van
      dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het tweede lid, regels worden
      gesteld voor bij deze maatregel aan te wijzen diersoorten of diercategorieën die betrekking hebben op onder meer:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.3.a
    text: een verbod op het doden van bepaalde dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.3.b
    text: de wijze waarop dieren worden gedood;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.3.c
    text: situaties waarin het is toegestaan dieren te doden;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.3.d
    text: voorwaarden waaronder het is toegestaan dieren te doden;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.3.e
    text: de personen die dieren doden, of die daarbij betrokken zijn;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.3.f
    text: de plaats waar dieren worden gedood;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.3.g
    text: het vervoeren, het aanvoeren en het afvoeren van dieren naar de plaats waar wordt gedood;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.3.h
    text: het verplaatsen van dieren in de ruimten waar dieren worden gedood;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.3.i
    text: het onderbrengen van dieren in de ruimten waar dieren worden gedood;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.3.j
    text: het fixeren van dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.3.k
    text: het bedwelmen van dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.3.l
    text: |-
      de inrichting, uitvoering en vormgeving van ruimten waar dieren worden gedood, waaronder de aanwezige
      voorzieningen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.3.m
    text: de gegevens over de te doden dieren die voorafgaand aan het doden worden overgelegd;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.3.n
    text: de gezondheidsstatus van de te doden dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.3.o
    text: de onderzoeken aan en met betrekking tot de dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.3.p
    text: de keuring van dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.3.q
    text: de personen die dieren keuren, of die daarbij betrokken zijn;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.3.r
    text: |-
      hygiëne, het voorkomen van de verspreiding van dierziekten, zoönosen en ziekteverschijnselen, en het weren van
      ziekteverwekkers, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.3.s
    text: de instrumenten, installaties en verdere voorzieningen voor het fixeren, bedwelmen of doden van dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.4
    text: |-
      Het is toegestaan om dieren zonder voorafgaande bedwelming te doden volgens de israëlitische of de islamitische
      ritus. Bij algemene maatregel van bestuur worden in het belang van de bescherming van de dieren nadere regels
      gesteld over het doden volgens de israëlitische of de islamitische ritus.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.5
    text: 'De regels, bedoeld in het vierde lid, kunnen betrekking hebben op onder meer:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.5.a
    text: de wijze waarop dieren worden gedood;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.5.b
    text: de personen die het doden van dieren uitvoeren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.5.c
    text: |-
      de inrichting, uitvoering en vormgeving van ruimten waar dieren worden gedood, waaronder de aanwezige
      voorzieningen, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
  - number: 2.10.5.d
    text: |-
      de aanwezigheid van een op grond van [artikel 8.1][ref1] aangewezen ambtenaar, tevens zijnde een dierenarts, en de
      door die ambtenaar te geven aanwijzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: 2.11.1
    text: |-
      Het is verboden dieren opzettelijk in een zodanige toestand te brengen dat deze ziek worden of kunnen worden besmet
      met een dierziekte of een zoönose.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.11
  - number: 2.11.2
    text: |-
      De houder van dieren die weet of redelijkerwijs kan vermoeden dat dieren door zijn handelen of nalaten ziek worden,
      of dat daardoor een besmetting met dan wel de verspreiding van een dierziekte of een zoönose als bedoeld in het
      eerste lid, kan worden veroorzaakt:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.11
  - number: 2.11.2.a
    text: laat dergelijk handelen of nalaten achterwege voor zover zulks in redelijkheid kan worden gevergd;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.11
  - number: 2.11.2.b
    text: |-
      neemt alle maatregelen die in redelijkheid kunnen worden gevergd, teneinde zodanige besmetting of verspreiding te
      voorkomen, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.11
  - number: 2.11.2.c
    text: |-
      ingeval een zodanige besmetting zich voordoet, beperkt de omvang en de gevolgen daarvan zoveel mogelijk of maakt
      die zoveel mogelijk ongedaan.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.11
  - number: 2.11.3
    text: |-
      De houder, bedoeld in het tweede lid, handelt in elk geval in strijd met dat lid indien hij een handeling verricht
      waarvan redelijkerwijs kan worden aangenomen dat die achterwege zou zijn gebleven, indien geen sprake zou zijn
      geweest van een uitbraak van een besmettelijke dierziekte of zoönose, dan wel een kennelijke dreiging daarvan, en
      redelijkerwijs kan worden aangenomen dat die handeling het gevaar van een zodanige verspreiding kan vergroten.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.11
  - number: 2.12.1
    text: |-
      Ingeval een dierenarts weet of redelijkerwijs kan vermoeden dat een dier is besmet met een dierziekte of een
      zoönose als bedoeld in [artikel 5.3, tweede lid][ref1], dan wel met een andere bij ministeriële regeling aangewezen
      dierziekte of zoönose, of drager is van een ziekteverwekker, geeft hij hiervan terstond kennis aan een ambtenaar
      als bedoeld in [artikel 8.1, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: 2.12.2
    text: |-
      Ingeval een dierenarts weet of redelijkerwijs kan vermoeden dat een dier een ziekteverschijnsel als bedoeld in
      [artikel 5.3, derde lid][ref1], dan wel een ander bij ministeriële regeling aangewezen ziekteverschijnsel vertoont,
      geeft hij hiervan terstond kennis aan een ambtenaar als bedoeld in [artikel 8.1, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: 2.12.3
    text: |-
      Ingeval een dier een ziekteverschijnsel als bedoeld in [artikel 5.3, derde lid][ref1], dan wel een ander bij
      ministeriële regeling aangewezen ziekteverschijnsel vertoont, of ingeval de houder weet of redelijkerwijs kan
      vermoeden dat een dier is besmet met een dierziekte of een zoönose als bedoeld in artikel 5.3, tweede lid, dan wel
      een andere bij ministeriële regeling aangewezen dierziekte of zoönose, of drager is van een ziekteverwekker, geeft
      de houder van dit dier hiervan terstond kennis aan een ambtenaar als bedoeld in [artikel 8.1, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: 2.12.4
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op een ieder die in het kader van werkzaamheden in
      een onderzoeksinstelling, die gevallen van dierziekten, zoönosen of ziekteverschijnselen als bedoeld in het eerste,
      onderscheidenlijk tweede lid, opmerkt.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.12
  - number: 2.12.5
    text: |-
      Bij ministeriële regeling kan worden bepaald in welke gevallen en onder welke voorwaarden een kennisgeving als
      bedoeld in het eerste, tweede en derde lid achterwege kan blijven.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.12
  - number: '2.13'
    text: |-
      Het is verboden dieren als prijs, beloning of gift uit te loven of uit te reiken naar aanleiding van wedstrijden,
      verlotingen, weddenschappen of andere dergelijke evenementen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.13
  - number: 2.14.1
    text: Het is verboden dierengevechten te organiseren of dieren aan dierengevechten te doen deelnemen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.14
  - number: 2.14.2
    text: Het is verboden bij dierengevechten aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.14
  - number: 2.15.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de uitvoering van bindende
      onderdelen van EU-rechtshandelingen over wedstrijden met dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.15
  - number: 2.15.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het eerste lid, regels worden
      gesteld die betrekking hebben op onder meer:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.15
  - number: 2.15.2.a
    text: |-
      een verbod op het organiseren en het houden van wedstrijden met een bepaald doel, en het daaraan doen deelnemen
      van dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.15
  - number: 2.15.2.b
    text: een verbod voor bepaalde personen op het organiseren van wedstrijden;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.15
  - number: 2.15.2.c
    text: de leeftijd, de gezondheidstoestand en afkomst van de dieren die aan wedstrijden deelnemen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.15
  - number: 2.15.2.d
    text: de frequentie waarmee dieren aan wedstrijden deelnemen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.15
  - number: 2.15.2.e
    text: een verbod op het inschrijven voor, het toelaten tot en het deelnemen aan wedstrijden van bepaalde dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.15
  - number: 2.15.2.f
    text: de aanwezigheid van een dierenarts bij wedstrijden;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.15
  - number: 2.15.2.g
    text: de baan- en hindernisbouw bij wedstrijden;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.15
  - number: 2.15.2.h
    text: de organisatie van wedstrijden en de inrichting van wedstrijdterreinen, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.15
  - number: 2.15.2.i
    text: |-
      hygiëne, het voorkomen van de verspreiding van dierziekten, zoönosen en ziekteverschijnselen, en het weren van
      ziekteverwekkers.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.15
  - number: 2.15.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het gebruik van substanties bij
      dieren die het prestatievermogen van dieren in wedstrijden kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.15
  - number: 2.15.4
    text: 'De regels, bedoeld in het derde lid, kunnen betrekking hebben op onder meer:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.15
  - number: 2.15.4.a
    text: |-
      een verbod op het gebruik van bepaalde substanties en het vaststellen van het maximum toegestane gehalte aan
      bepaalde substanties;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.15
  - number: 2.15.4.b
    text: de toepassing van substanties bij dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.15
  - number: 2.15.4.c
    text: |-
      de uitsluiting van dieren van deelname aan wedstrijden ingeval in de dieren een substantie, een bestanddeel daarvan
      of een omzettingsproduct, aanwezig is, of dat wordt vermoed;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.15
  - number: 2.15.4.d
    text: |-
      de wijze waarop de aanwezigheid van een substantie in dieren, een bestanddeel daarvan of een omzettingsproduct,
      wordt aangetoond, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.15
  - number: 2.15.4.e
    text: een verbod op het voorhanden, in voorraad of aanwezig hebben van substanties.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.15
  - number: 2.15.5
    text: |-
      Het is verboden deel te nemen aan wedstrijden met dieren waarbij een bij [artikel 2.8][ref1] verboden lichamelijke
      ingreep is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.15.6
    text: |-
      Het is verboden dieren waarbij een bij [artikel 2.8][ref1] verboden lichamelijke ingreep is verricht, tot een
      wedstrijd toe te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.16.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het houden van keuringen,
      tentoonstellingen en andere gelegenheden of inrichtingen waar dieren worden gehouden en aan het publiek worden
      getoond wegens recreatieve, sportieve of opvoedkundige doeleinden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.16
  - number: 2.16.2
    text: 'De regels, bedoeld in het eerste lid, kunnen onder meer betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.16
  - number: 2.16.2.a
    text: een verbod op het met bepaalde dieren deelnemen aan een tentoonstelling;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.16
  - number: 2.16.2.b
    text: een verbod op het toelaten van bepaalde dieren tot een tentoonstelling, een gelegenheid of een inrichting;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.16
  - number: 2.16.2.c
    text: |-
      hygiëne, het voorkomen van de verspreiding van dierziekten, zoönosen en ziekteverschijnselen, en het weren van
      ziekteverwekkers;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.16
  - number: 2.16.2.d
    text: de bevordering van de instandhouding van diersoorten, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.16
  - number: 2.16.2.e
    text: informatie en educatie met betrekking tot de tentoongestelde diersoorten.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.16
  - number: 2.16.3
    text: |-
      Het is verboden deel te nemen aan tentoonstellingen of keuringen met dieren waarbij een bij [artikel 2.8][ref1]
      verboden lichamelijke ingreep is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.16.4
    text: |-
      Het is verboden dieren waarbij een bij [artikel 2.8][ref1] verboden lichamelijke ingreep is verricht, tot een
      tentoonstelling of keuring toe te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.17.1
    text: |-
      Het is verboden in strijd met een bij of krachtens algemene maatregel van bestuur voor de uitvoering van een EU-
      richtlijn vastgesteld voorschrift, een handeling te verrichten die ertoe strekt diervoeders te bereiden, te
      bewerken, te verwerken, te verpakken, te etiketteren, in de handel te brengen, in of buiten Nederland te brengen,
      te vervoeren of aan te bieden, aan te prijzen, af te leveren, te ontvangen, voorhanden of in voorraad te hebben:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.17
  - number: 2.17.1.a
    text: die niet zuiver, deugdelijk, of van gebruikelijke handelskwaliteit zijn;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.17
  - number: 2.17.1.b
    text: die een gevaar opleveren voor de gezondheid van mens of dier of voor het milieu, indien niet correct gebruikt, of
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.17
  - number: 2.17.1.c
    text: die de dierlijke productie ongunstig kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.17
  - number: 2.17.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op andere stoffen of producten die bestemd zijn voor het voederen
      van dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.17
  - number: 2.18.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen met betrekking tot diervoeders en andere stoffen of producten die bedoeld zijn voor het
      voederen van dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.18
  - number: 2.18.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het eerste lid, regels worden
      gesteld die betrekking hebben op onder meer:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.18
  - number: 2.18.2.a
    text: |-
      een verbod op het bereiden, het bewerken, het verwerken, het verpakken, het etiketteren, het voorhanden of in
      voorraad hebben, het vervoeren, het afleveren of het in de handel brengen van bepaalde diervoeders, alsmede
      handelingen als bedoeld in [artikel 2.17][ref1], de bij deze handelingen te hanteren procedures en normen,
      waaronder de daarbij te verstrekken informatie;


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.18.2.b
    text: |-
      de hoedanigheid van diervoeders, waaronder de aanwezigheid van diergeneesmiddelen, substanties of andere stoffen
      die in diervoerders voorkomen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.18
  - number: 2.18.2.c
    text: het bereiden, het bewerken en het verwerken van diervoeders;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.18
  - number: 2.18.2.d
    text: het verpakken en het etiketteren van diervoeders;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.18
  - number: 2.18.2.e
    text: |-
      het ontvangen, het voorhanden of in voorraad hebben, het in de handel brengen, het in of buiten Nederland brengen,
      het vervoeren, het afleveren, het aanbieden en het aanprijzen van diervoeders;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.18
  - number: 2.18.2.f
    text: |-
      ruimten waarin diervoeders worden bereid, bewerkt, verwerkt, verpakt, geëtiketteerd dan wel voorhanden of in
      voorraad worden gehouden, waaronder de inrichting en het gebruik van die ruimten;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.18
  - number: 2.18.2.g
    text: |-
      de hulpmiddelen, waaronder apparatuur, die bij het bereiden, het bewerken, het verwerken, het verpakken, het
      etiketteren, het bewaren en het vervoeren van diervoeders worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.18
  - number: 2.18.2.h
    text: |-
      de kwalificaties van personen die zijn betrokken bij het bereiden, het bewerken, het verwerken, het verpakken of
      het vervoeren van, onderscheidenlijk de handel in diervoeders, waaronder hun opleiding;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.18
  - number: 2.18.2.i
    text: |-
      controles door bereiders, bewerkers, verwerkers, verpakkers, vervoerders of houders van, onderscheidenlijk
      handelaren in diervoeders, waaronder de wijze van controles en monsterneming, de vastlegging van controleresultaten
      alsmede het bewaren en overleggen van controleresultaten en monsters;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.18
  - number: 2.18.2.j
    text: |-
      het bijhouden, overleggen, controleren, bewaren en melden van gegevens over de voorraad, de bereiding, de
      bewerking, de verwerking, de ontvangst, de herkomst, de aflevering, de vernietiging, de bestemming, het verbruik en
      de vervoedering van diervoeders;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.18
  - number: 2.18.2.k
    text: |-
      hygiëne, het voorkomen van de verspreiding van dierziekten, zoönosen en ziekteverschijnselen, en het weren van
      ziekteverwekkers, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.18
  - number: 2.18.2.l
    text: het zich ontdoen van resten en lege verpakkingen van diervoeders.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.18
  - number: 2.18a.1
    text: |-
      Bij ministeriële regeling kunnen in het belang van de bescherming van het milieu regels worden gesteld over de
      samenstelling van diervoeders of andere stoffen die zijn bedoeld voor het voederen van dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.18a
  - number: 2.18a.2
    text: 'De regels, bedoeld in het eerste lid, kunnen betrekking hebben op onder meer:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.18a
  - number: 2.18a.2.a
    text: |-
      een verbod op het bereiden, bewerken, verwerken, verpakken, etiketteren, in de handel brengen, in Nederland
      brengen, vervoeren, aanbieden, aanprijzen, afleveren, ontvangen, voorhanden of in voorraad hebben, of het
      vervoederen aan, het toepassen bij of het brengen in de nabijheid van dieren, van diervoeders of stoffen waarvan de
      hoeveelheid van een bestanddeel een bij die regeling bepaald maximum overschrijdt;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.18a
  - number: 2.18a.2.b
    text: |-
      een verplichting om de hoeveelheid van een bestanddeel in de totale hoeveelheid diervoeders die een dier gebruikt,
      te beperken, al dan niet tot een bij die regeling bepaald maximum.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.18a
  - number: 2.18a.3
    text: |-
      Er kunnen slechts regels worden vastgesteld als bedoeld in het eerste lid indien vastgesteld is dat dit geen
      significant negatieve gevolgen heeft voor diergezondheid, dierenwelzijn, volksgezondheid en afzetbelangen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.18a
  - number: 2.19.1
    text: |-
      Het is verboden een handeling te verrichten die ertoe strekt een diergeneesmiddel te bereiden, te bewerken, te
      verwerken, te verpakken, te etiketteren, in de handel te brengen, in of buiten Nederland te brengen, te vervoeren,
      aan te bieden, aan te prijzen, af te leveren, te ontvangen, voorhanden of in voorraad te hebben, voor zover deze
      handeling niet is toegestaan krachtens een vergunning die is verstrekt ingevolge een bij of krachtens algemene
      maatregel van bestuur ter uitvoering van een bindend onderdeel van een EU-rechtshandeling vastgesteld voorschrift
      of een bij ministeriële regeling aangewezen voorschrift van een EU-verordening inzake het in de handel brengen,
      vervaardiging, invoer, of het bezit van, handel in of verstrekken van een diergeneesmiddel.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.19
  - number: 2.19.2
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing op bij of krachtens algemene maatregel van bestuur,
      in voorkomend geval met inachtneming van EU-rechtshandelingen, aangewezen diergeneesmiddelen, of in bij of
      krachtens die maatregel aangewezen gevallen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.19
  - number: 2.19.3
    text: 'De vergunning, bedoeld in het eerste lid, wordt op aanvraag verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.19
  - number: 2.19.3.a
    text: |-
      op grond van onderzoek met redelijke zekerheid mag worden aangenomen dat het diergeneesmiddel bij het toepassen
      overeenkomstig de aan de te verstrekken vergunning krachtens [artikel 7.5, eerste lid][ref1], te verbinden
      voorschriften en beperkingen en beperkingen:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 2.19.3.a.1°
    text: de gestelde werking bezit, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.19
  - number: 2.19.3.a.2°
    text: geen gevaar oplevert voor de gezondheid van mensen, dieren en planten en voor het milieu;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.19
  - number: 2.19.3.b
    text: |-
      het diergeneesmiddel de opgegeven eigenschappen en kwalitatieve en kwantitatieve samenstelling bezit en de voor het
      controleren daarvan opgegeven methodieken adequaat zijn;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.19
  - number: 2.19.3.c
    text: |-
      het diergeneesmiddel voldoet aan bij ministeriële regeling gestelde regels met betrekking tot de substanties
      waaruit het is samengesteld;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.19
  - number: 2.19.3.d
    text: |-
      het diergeneesmiddel, voor zover het een immunologisch diergeneesmiddel of biologisch diagnosticum betreft, niet
      bereid is uit, of met behulp van bij EU-verordening, EU-besluit of bij ministeriële regeling aangewezen substanties
      waarvan gevaar is te duchten voor de gezondheid van dieren of voor verstoring van de dierziektebestrijding;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.19
  - number: 2.19.3.e
    text: bij EU-verordening of bij of krachtens algemene maatregel van bestuur vastgestelde procedures in acht zijn genomen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.19
  - number: 2.19.3.f
    text: |-
      bij ministeriële regeling aangewezen door de Europese Commissie vastgestelde beginselen en richtsnoeren in acht
      zijn genomen, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.19
  - number: 2.19.3.g
    text: |-
      geen ingevolge een EU-verordening of bij of krachtens algemene maatregel van bestuur vastgestelde weigeringsgrond
      aanwezig is.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.19
  - number: 2.19.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de beoordelingsmethoden bij de
      toepassing van de voorwaarden, bedoeld in het derde lid, onderdeel a tot en met d, alsmede regels inzake de methode
      waarmee de op grond van het derde lid, onderdeel a, aanhef, vast te stellen voorschriften worden bepaald, voor
      zover deze voorschriften bij of krachtens algemene maatregel van bestuur zijn toegestaan.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.19
  - number: 2.19.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld inzake de onderzoeksmethoden die worden
      toegepast bij een onderzoek als bedoeld in [artikel 7.6, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 2.19.6
    text: |-
      Het derde lid, onderdeel a, onder 1°, is niet van toepassing op een aanvraag voor een homeopathisch
      diergeneesmiddel in bij of krachtens algemene maatregel van bestuur aangewezen gevallen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.19
  - number: 2.19.7
    text: |-
      Een vergunning als bedoeld in het eerste lid wordt verstrekt, en een regeling als bedoeld in het derde lid,
      onderdeel c, en vierde lid, wordt vastgesteld in overeenstemming met Onze Minister van Volksgezondheid, Welzijn
      en Sport.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.19
  - number: 2.19.8
    text: |-
      Voorschriften en beperkingen die zijn verbonden aan een vergunning als bedoeld in het eerste lid die is verstrekt
      voor het in de handel brengen van een diergeneesmiddel, gelden voor een ieder die een handeling als bedoeld in het
      eerste lid verricht.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.19
  - number: 2.20.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen met betrekking tot diergeneesmiddelen of diervoeders met medicinale werking.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.20
  - number: 2.20.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het eerste lid, regels worden
      gesteld die betrekking hebben op onder meer:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.20
  - number: 2.20.2.a
    text: |-
      het bereiden, het bewerken, het verwerken, het verpakken, het etiketteren, het in de handel brengen, het in
      of buiten Nederland brengen, het vervoeren, het aanbieden, het aanprijzen, het afleveren, het ontvangen, het
      voorhanden of in voorraad hebben van:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.20
  - number: 2.20.2.a.1°
    text: diergeneesmiddelen, of
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.20
  - number: 2.20.2.a.2°
    text: substanties die bij de bereiding van diergeneesmiddelen worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.20
  - number: 2.20.2.b
    text: |-
      een verbod op het bereiden, het bewerken, het verwerken, het verpakken, het etiketteren, het afleveren, het
      ontvangen, het voorhanden of in voorraad hebben, het in de handel brengen, het in of buiten Nederland brengen,
      het vervoeren, het afleveren, het aanbieden of het aanprijzen van diergeneesmiddelen of substanties als bedoeld
      in onderdeel a, onder 2°, alsmede handelingen als bedoeld in [artikel 2.19, eerste lid][ref1], en de bij die
      handelingen te hanteren procedures en normen, waaronder de te verstrekken informatie;


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.20.2.c
    text: het uit de handel nemen en het vernietigen van diergeneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.20
  - number: 2.20.2.d
    text: het zich ontdoen van resten en lege verpakkingen van diergeneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.20
  - number: 2.20.2.e
    text: |-
      ruimten waarin diergeneesmiddelen worden bereid, bewerkt, verwerkt, verpakt, geëtiketteerd, bewaard dan wel
      voorhanden of in voorraad gehouden, waaronder de inrichting en het gebruik van die ruimten;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.20
  - number: 2.20.2.f
    text: |-
      de hulpmiddelen, waaronder apparatuur, die bij het bereiden, het bewerken, het verwerken, het verpakken, het
      etiketteren, het bewaren en het vervoeren van diergeneesmiddelen worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.20
  - number: 2.20.2.g
    text: |-
      de kwalificaties van personen die zijn betrokken bij het bereiden, het bewerken, het verwerken, het verpakken of
      het vervoeren van, onderscheidenlijk de handel in diergeneesmiddelen, waaronder hun opleiding, alsmede de zo nodig
      tegen deze personen te nemen maatregelen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.20
  - number: 2.20.2.h
    text: |-
      controles door bereiders, bewerkers, verwerkers, verpakkers, vervoerders of houders van, onderscheidenlijk
      handelaren in diergeneesmiddelen, waaronder de wijze van controles en monsterneming, de vastlegging van
      controleresultaten alsmede het bewaren en overleggen van controleresultaten en monsters;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.20
  - number: 2.20.2.i
    text: |-
      het aantekening houden en melden van bijwerkingen van een diergeneesmiddel alsmede de inrichting van een
      diergeneesmiddelenbewakingssysteem;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.20
  - number: 2.20.2.j
    text: |-
      het bijhouden, overleggen, controleren, bewaren en melden van gegevens over de voorraad, de bereiding, de
      bewerking, de verwerking, de ontvangst, de herkomst, de aflevering, de vernietiging, de bestemming en het verbruik
      van diergeneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.20
  - number: 2.20.2.k
    text: de keuring van partijen diergeneesmiddelen, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.20
  - number: 2.20.2.l
    text: |-
      hygiëne, het voorkomen van de verspreiding van dierziekten, zoönosen en ziekteverschijnselen, en het weren van
      ziekteverwekkers.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.20
  - number: 2.20.3
    text: |-
      Het eerste en het tweede lid zijn van overeenkomstige toepassing op bij ministeriële regeling aangewezen
      substanties die geen diergeneesmiddel zijn maar wel als zodanig kunnen worden gebruikt, of diervoeders met
      medicinale werking.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.20
  - number: 2.21.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt geregeld dat daarbij aangewezen diergeneesmiddelen of
      diervoeders met medicinale werking uitsluitend worden afgeleverd aan, onderscheidenlijk in voorraad of voorhanden
      worden gehouden door daarbij aangewezen personen, onder de daarbij gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.21
  - number: 2.21.2
    text: |-
      Een aanwijzing als bedoeld in het eerste lid vindt uitsluitend plaats ingeval een EU-rechtshandeling daartoe
      verplicht, of ingeval de diergeneesmiddelen of diervoeders met medicinale werking zonder tussenkomst van een
      dierenarts een gevaar voor de gezondheid van mens of dier of voor het milieu kunnen opleveren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.21
  - number: 2.22.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen met betrekking tot ziekteverwekkers.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.22
  - number: 2.22.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het eerste lid, regels worden
      gesteld die betrekking hebben op onder meer:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.22
  - number: 2.22.2.a
    text: het bereiden, het bewerken, het verwerken en het vermengen van ziekteverwekkers;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.22
  - number: 2.22.2.b
    text: |-
      het voorhanden of in voorraad hebben, het vervoeren van ziekteverwekkers en het in de handel brengen van
      ziekteverwekkers door personen die immunologische diergeneesmiddelen of biologische diagnostica bereiden;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.22
  - number: 2.22.2.c
    text: het weren, het voorkomen van verspreiding en het vernietigen van ziekteverwekkers;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.22
  - number: 2.22.2.d
    text: het voeren van een administratie en het verstrekken van gegevens omtrent ziekteverwekkers, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.22
  - number: 2.22.2.e
    text: een verbod op het vervoeren van bepaalde ziekteverwekkers.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.22
  - number: 2.22.3
    text: |-
      Bij ministeriële regeling kunnen ziekteverwekkers worden aangewezen waarvan het voorhanden of in voorraad houden
      uitsluitend is toegestaan aan:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.22
  - number: 2.22.3.a
    text: |-
      instellingen van wetenschap of onderzoek die bij ministeriële regeling zijn aangewezen in overeenstemming met Onze
      Minister wie het mede aangaat, voor zover de ziekteverwekkers zijn bestemd voor gebruik voor wetenschappelijke
      doeleinden, of
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.22
  - number: 2.22.3.b
    text: |-
      bereiders van sera, entstoffen of biologische diagnostica, voor zover de ziekteverwekkers zijn bestemd voor de
      bereiding van, of de controle op die producten.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.22
  - number: 2.22.4
    text: |-
      Het derde lid is niet van toepassing ten aanzien van ziekteverwekkers, bestemd voor de bereiding van of de controle
      op therapeutische of diagnostische middelen die zijn bestemd voor toepassing bij onderzoek of behandeling van de
      mens.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.22
  - number: 2.23.1
    text: |-
      Het is verboden om uitsluitend voor sportprestaties of vermaak het genetisch materiaal van dieren te wijzigen op
      een wijze die voorbij gaat aan de natuurlijke barrières van geslachtelijke voortplanting en van recombinatie.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.23
  - number: 2.23.2
    text: 'Het is zonder vergunning verboden:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.23
  - number: 2.23.2.a
    text: |-
      het genetisch materiaal van dieren te wijzigen op een wijze die voorbij gaat aan de natuurlijke barrières van
      geslachtelijke voortplanting en van recombinatie;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.23
  - number: 2.23.2.b
    text: biotechnologische technieken bij een dier of een dierlijk embryo toe te passen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.23
  - number: 2.23.3
    text: |-
      Het tweede lid is niet van toepassing op handelingen als bedoeld in het tweede lid voor zover die handelingen
      worden verricht ten behoeve van biomedisch onderzoek.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.23
  - number: 2.23.4
    text: 'Onze Minister verleent een vergunning slechts indien naar zijn oordeel:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.23
  - number: 2.23.4.a
    text: de handelingen geen onaanvaardbare gevolgen hebben voor de gezondheid of het welzijn van dieren; en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.23
  - number: 2.23.4.b
    text: tegen de handelingen geen ethische bezwaren bestaan.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.23
  - number: 2.23.5
    text: |-
      In afwijking van [artikel 7.7, eerste lid][ref1], vraagt Onze Minister telkenmale omtrent een verzoek tot verlening
      van een vergunning als bedoeld in het tweede lid advies aan een door hem met betrekking tot dat verzoek in te
      stellen commissie van onafhankelijke deskundigen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 2.23.6
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een aanvraag tot een vergunning
      als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '2.24'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen handelingen worden aangewezen ten aanzien waarvan in ieder
      geval niet is voldaan aan de voorwaarden, bedoeld in [artikel 2.23, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.25.1
    text: |-
      Het is verboden om op enigerlei wijze handelingen te verrichten in strijd met bij of krachtens algemene maatregel
      van bestuur voor de uitvoering van bindende onderdelen van EU-rechtshandelingen gestelde regels over het bij dieren
      of op cel- of weefselcultures bij dieren toepassen van diergeneesmiddelen, diervoeders, substanties of andere
      stoffen, of producten.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.25
  - number: 2.25.2
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing in bij ministeriële regeling, in voorkomend geval met
      inachtneming van EU-rechtshandelingen, aangewezen gevallen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.25
  - number: 2.25.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor bij deze maatregel aan te wijzen diersoorten of
      diercategorieën regels worden gesteld over het bij dieren of op cel- of weefselcultures bij dieren toepassen
      van diergeneesmiddelen, diervoeders, bij of krachtens die maatregel aangewezen substanties of andere stoffen, of
      producten, welke regels betrekking kunnen hebben op onder meer:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.25
  - number: 2.25.3.a
    text: de aard van de substantie;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.25
  - number: 2.25.3.b
    text: het doel waarvoor de substantie wordt toegepast;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.25
  - number: 2.25.3.c
    text: de wijze waarop de substantie wordt toegepast;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.25
  - number: 2.25.3.d
    text: |-
      de diersoort of diercategorie waartoe de dieren, dan wel cel- of weefselcultures van dieren behoren waarbij de
      substantie uitsluitend mag worden toegepast;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.25
  - number: 2.25.3.e
    text: het moment van toepassing, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.25
  - number: 2.25.3.f
    text: de waarborgen die worden getroffen in het belang van de dieren of de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.25
  - number: 2.25.4
    text: |-
      Voor zover een aanwijzing van een substantie als bedoeld in het derde lid geschiedt krachtens algemene maatregel
      van bestuur en indien die aanwijzing geheel of mede in het belang is van de volksgezondheid, geschiedt deze in
      overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel2.25
  - number: 3.1.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen over dierlijke producten.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.1
  - number: 3.1.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het eerste lid, regels worden
      gesteld die betrekking hebben op onder meer:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.1
  - number: 3.1.2.a
    text: |-
      het produceren, het bewerken, het verwerken, het in voorraad of voorhanden hebben, het vervoeren, het opslaan,
      het verzamelen, het hanteren, het gebruik, het verwijderen, het in de handel brengen en het in of buiten Nederland
      brengen van dierlijke producten;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.1
  - number: 3.1.2.b
    text: |-
      een verbod op het produceren, het bewerken, het verwerken, het in voorraad of voorhanden hebben, het vervoeren, het
      gebruik, het in de handel brengen en het in of buiten Nederland brengen van bepaalde producten;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.1
  - number: 3.1.2.c
    text: |-
      de registratie van degene die de producten produceert, bewerkt, verwerkt, in voorraad of voorhanden heeft, verpakt,
      vervoert, in de handel brengt of in of buiten Nederland brengt;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.1
  - number: 3.1.2.d
    text: |-
      het winnen, het bewerken, het mengen, het opslaan, het verhandelen en het gebruiken van sperma, eicellen en
      embryo’s, de inrichtingen waar dit plaatsvindt, en de bedrijfsvoering aldaar;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.1
  - number: 3.1.2.e
    text: de documenten die de producten vergezellen en die worden overgelegd;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.1
  - number: 3.1.2.f
    text: de herkomst van de in Nederland te brengen producten;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.1
  - number: 3.1.2.g
    text: de identificatie en registratie van de producten;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.1
  - number: 3.1.2.h
    text: het bijhouden van een administratie;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.1
  - number: 3.1.2.i
    text: |-
      de inrichting van de ruimte waar de producten worden geproduceerd, bewerkt, verwerkt, verpakt, opgeslagen of in
      voorraad gehouden;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.1
  - number: 3.1.2.j
    text: de inslag en de uitslag;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.1
  - number: 3.1.2.k
    text: |-
      de afkomst, de bestemming, de hoedanigheid, de kwaliteit, de samenstelling, de etikettering, de benaming en de
      verpakking van producten, en de informatie die met betrekking tot de producten wordt overgelegd;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.1
  - number: 3.1.2.l
    text: het vervoer van de producten en de vervoermiddelen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.1
  - number: 3.1.2.m
    text: de behandeling van producten ter bestrijding van ziekteverwekkers dan wel voorkoming van aanwezigheid ervan, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.1
  - number: 3.1.2.n
    text: |-
      hygiëne, het voorkomen van de verspreiding van dierziekten, zoönosen en ziekteverschijnselen, en het weren van
      ziekteverwekkers.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.1
  - number: 3.1.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op andere dan dierlijke producten, voor zover zij een
      gevaar voor verspreiding van een ziekteverwekker kunnen opleveren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.1
  - number: 3.2.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden in het belang van de volksgezondheid regels gesteld voor de
      uitvoering van bindende onderdelen van EU-rechtshandelingen over de productie van vlees na het doden van dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.2
  - number: 3.2.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor het onderwerp, bedoeld in het eerste lid, regels worden
      gesteld die betrekking hebben op onder meer:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.2
  - number: 3.2.2.a
    text: |-
      de onderwerpen, genoemd in [artikel 3.1, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel3
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.2.2.b
    text: de onderzoeken bij dode dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.2
  - number: 3.2.2.c
    text: de personen die dieren onderzoeken, of die daarbij betrokken zijn;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.2
  - number: 3.2.2.d
    text: de keuring van dode dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.2
  - number: 3.2.2.e
    text: de personen die dode dieren keuren, of die daarbij betrokken zijn;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.2
  - number: 3.2.2.f
    text: de voorwaarden waaronder vlees geschikt is voor menselijke consumptie;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.2
  - number: 3.2.2.g
    text: het uitsnijden en bewerken van vlees;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.2
  - number: 3.2.2.h
    text: de personen die vlees uitsnijden of bewerken, of die daarbij betrokken zijn;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.2
  - number: 3.2.2.i
    text: de opslag en het vervoer van vlees;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.2
  - number: 3.2.2.j
    text: het afleveren van vlees en het in de handel brengen van vlees met het oog op verdere bewerking of verwerking;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.2
  - number: 3.2.2.k
    text: de hoedanigheid van vlees, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.2
  - number: 3.2.2.l
    text: het merken van vlees.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.2
  - number: 3.2.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op gehakt vlees, separatorvlees, vleesbereidingen en
      vleesproducten als bedoeld in krachtens de [Warenwet][ref1] gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: 3.3.1
    text: |-
      Bij ministeriële regeling kunnen met het oog op de doelmatige voorziening in de verwerking van bij die regeling
      aangewezen dierlijke bijproducten werkgebieden worden vastgesteld waarin een ondernemer met uitsluiting van andere
      ondernemers deze producten verwerkt of door verbranding verwijdert.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.3
  - number: 3.3.2
    text: 'Bij ministeriële regeling kan:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.3
  - number: 3.3.2.a
    text: |-
      een in het eerste lid bedoeld werkgebied worden vastgesteld dat zich uitstrekt tot het grondgebied van een
      andere lidstaat van de Europese Unie of een gedeelte daarvan, indien daarover overeenstemming bestaat met de
      desbetreffende lidstaat, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.3
  - number: 3.3.2.b
    text: |-
      een in het eerste lid bedoeld werkgebied worden vastgesteld voor een ondernemer die is gevestigd in een andere
      lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.3
  - number: 3.3.3
    text: |-
      Indien aan een in het tweede lid, onderdeel b, bedoelde ondernemer een werkgebied binnen Nederland is toegewezen,
      zijn de [artikelen 3.4][ref1], [3.5][ref2] en [3.6][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel3
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.3.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de toepassing,
      vaststelling of wijziging van werkgebieden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.3
  - number: 3.3.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot situaties waarin
      wordt afgeweken van het eerste lid, ingeval de ondernemer als gevolg van overmacht niet in staat is om de ingevolge
      het eerste lid aangewezen dierlijke bijproducten te verwerken, waarbij Onze Minister een of meer andere verwerkers
      tijdelijk kan toestaan of aanwijzen om deze dierlijke bijproducten te verwerken of te verwijderen. Deze regels zijn
      van toepassing zolang de situatie dit vereist.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.3
  - number: 3.4.1
    text: |-
      In een werkgebied dat ingevolge [artikel 3.3, eerste lid][ref1], is vastgesteld, geeft de houder van ingevolge
      artikel 3.3, eerste lid, aangewezen dierlijke bijproducten dit materiaal aan bij, houdt het ter beschikking van, en
      staat het af aan, de ondernemer binnen wiens werkgebied het materiaal zich bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel3
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.4.2
    text: |-
      De ondernemer voor wie een werkgebied is vastgesteld, haalt de bij hem aangegeven dierlijke bijproducten op en
      verwerkt of verwijdert deze.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.4
  - number: 3.4.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van de in het eerste en tweede lid
      gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.4
  - number: 3.4.4
    text: |-
      Indien kadavers van gezelschapsdieren zijn aangewezen ingevolge [artikel 3.3, eerste lid][ref1], zijn het eerste
      tot en met het derde lid niet van toepassing op deze producten.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel3
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.5.1
    text: |-
      Indien kadavers van gezelschapsdieren zijn aangewezen ingevolge [artikel 3.3, eerste lid][ref1], worden bij
      gemeentelijke verordening ten aanzien van deze producten regels gesteld ter zake van:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel3
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.5.1.a
    text: het aangeven en het bewaren door de houder van kadavers van gezelschapsdieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.5
  - number: 3.5.1.b
    text: het ophalen van kadavers van gezelschapsdieren, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.5
  - number: 3.5.1.c
    text: |-
      het overdragen van kadavers van gezelschapsdieren aan de ondernemer binnen wiens werkgebied het materiaal zich
      bevindt.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.5
  - number: 3.5.2
    text: |-
      Indien tussen een gemeente en de in het eerste lid, onderdeel c, bedoelde ondernemer een overeenkomst is gesloten
      omtrent de in het eerste lid, onderdelen b en c, genoemde onderwerpen, behoeft de gemeentelijke verordening geen
      voorschriften over die onderwerpen te bevatten.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.5
  - number: 3.5.3
    text: |-
      De ondernemer, bedoeld in het eerste lid, onderdeel c, verwerkt of verwijdert de aan hem overgedragen kadavers
      van gezelschapsdieren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.5
  - number: 3.5.4
    text: |-
      De in het eerste lid bedoelde voorschriften en het derde lid zijn niet van toepassing indien kadavers van
      gezelschapsdieren worden verwijderd door een ander dan de ondernemer, bedoeld in het eerste lid, onderdeel c,
      voor zover dit geschiedt op een wijze die ingevolge de krachtens [artikel 3.1][ref1] gestelde voorschriften is
      toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel3
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.5.5
    text: |-
      Bij ministeriële regeling kunnen het eerste, tweede en derde lid, van overeenkomstige toepassing worden verklaard
      op andere bij die regeling aangewezen dierlijke bijproducten.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.5
  - number: 3.6.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de
      vergoeding die een ondernemer voor het ophalen, het vervoeren, het verwerken of het verwijderen van ingevolge
      [artikel 3.3, eerste lid][ref1], aangewezen dierlijke bijproducten in rekening brengt aan degene die deze producten
      aanbiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel3
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.6.2
    text: 'De regels, bedoeld in het eerste lid, kunnen betrekking hebben op onder meer:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.6
  - number: 3.6.2.a
    text: de wijze waarop de vergoeding door de ondernemer wordt bepaald, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.6
  - number: 3.6.2.b
    text: de maximum hoogte van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.6
  - number: 3.7.1
    text: |-
      Bij ministeriële regeling kunnen in het belang van de bescherming van het milieu regels worden gesteld over het
      maximumgehalte aan bepaalde stoffen in dierlijke producten, voor zover dat gehalte wordt beïnvloed door de aard of
      de samenstelling van diervoeders of andere stoffen die zijn bedoeld voor het voederen van dieren, of door andere
      stoffen die door dieren worden gegeten.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.7
  - number: 3.7.2
    text: |-
      Er kunnen slechts regels worden vastgesteld als bedoeld in eerste lid indien vastgesteld is dat dit geen
      significant negatieve gevolgen heeft voor diergezondheid, dierenwelzijn, volksgezondheid en afzetbelangen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel3.7
  - number: 4.1.1
    text: |-
      Tot het beroepsmatig verrichten van diergeneeskundige handelingen zijn toegelaten dierenartsen en andere personen
      die zijn ingeschreven in het register, bedoeld in [artikel 4.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.1.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het beroepsmatig verrichten van
      diergeneeskundige handelingen en de toelating daartoe, in overeenstemming met EU-rechtshandelingen die betrekking
      hebben op beroepskwalificaties en diensten.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.1
  - number: 4.1.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor de onderwerpen, bedoeld in het tweede lid, regels
      worden gesteld die betrekking hebben op onder meer:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.1
  - number: 4.1.3.a
    text: de kwalificaties van degene die is of wordt toegelaten, waaronder de opleiding en bij- of nascholing;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.1
  - number: 4.1.3.b
    text: |-
      de gevallen waarin en de wijze waarop de handelingen, waarop de toelating betrekking heeft, worden verricht,
      waarbij kan worden bepaald dat die handelingen uitsluitend plaatsvinden onder leiding, op aanwijzing of onder
      controle van een dierenarts;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.1
  - number: 4.1.3.c
    text: de verhouding van de persoon die wordt toegelaten, tot de dierenarts;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.1
  - number: 4.1.3.d
    text: |-
      de gevallen waarin een toelating op aanvraag plaatsvindt, alsmede de wijze waarop de aanvraag en de toelating
      plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.1
  - number: 4.1.3.e
    text: de geldigheidsduur van de toelating, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.1
  - number: 4.1.3.f
    text: de gevallen waarin de toelating kan worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.1
  - number: 4.1.4
    text: Een toelating als bedoeld in het tweede lid kan onder voorwaarden en beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.1
  - number: 4.1.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen de andere personen, bedoeld in het eerste lid, voor de
      toepassing van deze wet en de daarop berustende bepalingen worden gelijkgesteld met dierenartsen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.1
  - number: 4.2.1
    text: |-
      Personen, die zijn toegelaten tot het beroepsmatig verrichten van diergeneeskundige handelingen, schieten niet door
      enig handelen of nalaten tekort in de zorg die zij in hun hoedanigheid:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.2
  - number: 4.2.1.a
    text: behoren te betrachten ten opzichte van een dier met betrekking tot welke hun hulp is ingeroepen, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.2
  - number: 4.2.1.b
    text: verlenen of in geval van nood behoren te verlenen ten opzichte van een dier.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.2
  - number: 4.2.2
    text: |-
      Personen die zijn toegelaten tot het beroepsmatig verrichten van diergeneeskundige handelingen, schieten niet
      zodanig tekort in hetgeen van hen in hun hoedanigheid mag worden verwacht dat daardoor ernstige schade kan ontstaan
      voor de gezondheidszorg voor dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.2
  - number: 4.2.3
    text: Het in het eerste en tweede lid bepaalde is tevens van toepassing ten aanzien van andere dan gehouden dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.2
  - number: 4.3.1
    text: |-
      Onze Minister houdt een openbaar register bij van personen die een opleiding op het gebied van de diergeneeskunde
      als bedoeld in [artikel 1.1][ref1] met goed gevolg hebben voltooid en andere personen die worden toegelaten tot het
      beroepsmatig verrichten van diergeneeskundige handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel1
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 4.3.2
    text: |-
      Een persoon wordt niet in het register ingeschreven of zijn inschrijving wordt doorgehaald indien krachtens een
      onherroepelijk geworden rechterlijke of tuchtrechtelijke uitspraak zijn bevoegdheid tot het beroepsmatig verrichten
      van diergeneeskundige handelingen is ingetrokken.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.3
  - number: 4.3.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de registratie in het
      register, bedoeld in het eerste lid, waaronder regels als bedoeld in [artikel 7.2, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 4.4.1
    text: |-
      Aan personen die zijn opgenomen in een register als bedoeld in [artikel 4.3, eerste lid][ref1], is het recht
      voorbehouden om:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.4.1.a
    text: |-
      in het openbaar aan te kondigen dat zij de diergeneeskundige handelingen waarop de registratie betrekking heeft
      beroepsmatig verrichten,
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.4
  - number: 4.4.1.b
    text: |-
      een titel, aanduiding of vermelding te bezigen die bij het publiek redelijkerwijs de indruk kan wekken dat zij de
      diergeneeskundige handelingen waarop de registratie betrekking heeft beroepsmatig verrichten, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.4
  - number: 4.4.1.c
    text: |-
      een titel als bedoeld in [artikel 4.5, tweede lid, onderdeel c][ref1], te bezigen of een aanduiding of vermelding
      te bezigen die bij het publiek redelijkerwijs de indruk kan wekken dat zij een dergelijke titel verkregen hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.4.2
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het eerste lid niet van toepassing is op daarbij aangewezen
      personen, onder de daarbij gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.4
  - number: 4.5.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over specialismen binnen het
      beroepsmatig verrichten van diergeneeskundige handelingen alsmede over de vermelding van de titel, behorende bij
      die specialismen, in het register, bedoeld in [artikel 4.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.5.2
    text: 'De regels, bedoeld in het eerste lid, kunnen betrekking hebben op onder meer:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.5
  - number: 4.5.2.a
    text: de opleiding tot de specialismen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.5
  - number: 4.5.2.b
    text: |-
      de aanwijzing van en de eisen aan organisaties of instellingen die zijn belast met de regeling van of de opleiding
      tot de specialismen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.5
  - number: 4.5.2.c
    text: de verkrijging en de intrekking van een titel, verbonden aan de specialismen, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.5
  - number: 4.5.2.d
    text: |-
      de voorwaarden waaronder personen die beschikken over een titel, verbonden aan een specialisme, het recht is
      voorbehouden om:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.5
  - number: 4.5.2.d.1°
    text: |-
      in het openbaar aan te kondigen dat zij de diergeneeskundige handelingen waarop de specialisatie betrekking heeft
      beroepsmatig verrichten,
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.5
  - number: 4.5.2.d.2°
    text: |-
      een titel, aanduiding of vermelding te bezigen die bij het publiek redelijkerwijs de indruk kan vestigen dat zij de
      diergeneeskundige handelingen waarop het specialisme betrekking heeft beroepsmatig verrichten, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.5
  - number: 4.5.2.d.3°
    text: |-
      een titel als bedoeld in [artikel 4.4, eerste lid, onderdeel c][ref1], te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
        hoofdstuk: '4'
  - number: 5.1.1
    text: |-
      De maatregelen, bedoeld in dit hoofdstuk, kunnen voor één of meer afzonderlijke gevallen, dan wel ten algemene
      worden voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.1
  - number: 5.1.2
    text: |-
      De maatregelen, bedoeld in dit hoofdstuk, kunnen voor geheel Nederland of voor bepaalde gedeelten daarvan worden
      voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.1
  - number: 5.1.3
    text: |-
      Aan de maatregelen, bedoeld in dit hoofdstuk, kunnen voorschriften of beperkingen worden verbonden. Het is verboden
      te handelen in strijd met voorschriften als bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.1
  - number: 5.1.4
    text: |-
      Bij ministeriële regeling worden regels gesteld voor de uitvoering van bindende onderdelen van EU-rechtshandelingen
      die betrekking hebben op krachtens dit hoofdstuk getroffen maatregelen. In andere gevallen kunnen bij ministeriële
      regeling regels worden gesteld over de uitvoering van die maatregelen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.1
  - number: 5.2.1
    text: |-
      Ingeval in het belang van de gezondheid van mens of dier naar het oordeel van Onze Minister een onverwijlde
      voorziening noodzakelijk is, kan hij bepalen dat door hem krachtens dit hoofdstuk vastgestelde regelingen
      onmiddellijk na hun bekendmaking in werking treden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.2
  - number: 5.2.2
    text: |-
      Een regeling als bedoeld in het eerste lid kan, in afwijking van
      [artikel 4, eerste lid, van de Bekendmakingswet][ref1], door Onze Minister op andere dan de daar genoemde wijze
      bekend worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel4
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '4'
  - number: 5.2.3
    text: |-
      Onze Minister kan mandaat verlenen voor het stellen van regels krachtens dit hoofdstuk ten aanzien van gevallen
      waarin in het belang van de gezondheid van mens of dier een onverwijlde voorziening noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.2
  - number: 5.2.4
    text: |-
      Het mandaat, bedoeld in het derde lid, kan tevens betrekking hebben op de bevoegdheden, bedoeld in het eerste en
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.2
  - number: 5.2.5
    text: |-
      Een krachtens dit hoofdstuk te treffen besluit hoeft niet eerst op schrift te worden gesteld ingeval in het belang
      van preventie of bestrijding van besmettelijke dierziekten, zoönosen of ziekteverschijnselen of het weren van
      ziekteverwekkers een onverwijlde tenuitvoerlegging van een maatregel noodzakelijk is. In dat geval zorgt Onze
      Minister alsnog zo spoedig mogelijk voor de opschriftstelling en bekendmaking.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.2
  - number: 5.3.1
    text: |-
      Onze Minister kan krachtens deze paragraaf maatregelen treffen en andere handelingen verrichten ter voorkoming of
      bestrijding van de door hem aangewezen dierziekten, zoönosen en ziekteverschijnselen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.3
  - number: 5.3.2
    text: 'Dierziekten en zoönosen kunnen worden aangewezen indien:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.3
  - number: 5.3.2.a
    text: zij besmettelijk zijn en verspreiding ervan niet kan worden voorkomen met normale bedrijfsmiddelen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.3
  - number: 5.3.2.b
    text: zij naar het oordeel van Onze Minister een gevaar voor de diergezondheid kunnen opleveren, of
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.3
  - number: 5.3.2.c
    text: |-
      zij naar het oordeel van Onze Minister van Volksgezondheid, Welzijn en Sport een ernstig gevaar voor de
      volksgezondheid kunnen opleveren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.3
  - number: 5.3.3
    text: 'Ziekteverschijnselen kunnen worden aangewezen indien de dieren die deze verschijnselen vertonen of hun producten:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.3
  - number: 5.3.3.a
    text: naar het oordeel van Onze Minister een gevaar voor de diergezondheid kunnen opleveren, of
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.3
  - number: 5.3.3.b
    text: |-
      naar het oordeel van Onze Minister van Volksgezondheid, Welzijn en Sport een ernstig gevaar voor de volksgezondheid
      kunnen opleveren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.3
  - number: 5.3.4
    text: |-
      Een aanwijzing als bedoeld in het tweede lid, onderdeel c, of in het derde lid, onderdeel b, vindt plaats in
      overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.3
  - number: 5.3.5
    text: |-
      Maatregelen, die krachtens deze paragraaf worden getroffen ter voorkoming of bestrijding van een dierziekte,
      zoönose of ziekteverschijnsel, die of dat overeenkomstig het vierde lid is aangewezen in overeenstemming met Onze
      Minister van Volksgezondheid, Welzijn en Sport, worden getroffen in overeenstemming met die minister.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.3
  - number: 5.4.1
    text: |-
      Onze Minister kan maatregelen treffen en andere handelingen verrichten met betrekking tot dieren, al dan niet
      gehouden, die:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.1.a
    text: |-
      besmet zijn of van besmetting zijn verdacht, of vatbaar zijn voor besmetting met een dierziekte of zoönose, of die
      een ziekteverschijnsel vertonen of kunnen vertonen, of
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.1.b
    text: een gevaar kunnen opleveren voor verspreiding van een dierziekte, zoönose of ziekteverschijnsel.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt per dierziekte, zoönose en ziekteverschijnsel als bedoeld
      in [artikel 5.3][ref1] geregeld in welke gevallen er bij een dier sprake is van besmetting, van verdenking van
      besmetting of van een ziekteverschijnsel.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel5
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.4.3
    text: 'De maatregelen, bedoeld in het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.3.a
    text: |-
      een verplichting tot het afzonderen, het opstallen, het ophokken, het afschermen, het op een aangewezen plaats
      houden, het vastleggen of het opsluiten;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.3.b
    text: een verplichting tot het behandelen of het vaccineren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.3.c
    text: een verbod op het vervoeren, het verplaatsen of het in de handel brengen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.3.d
    text: een verbod op het bijeenbrengen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.3.e
    text: een verbod op het in of buiten Nederland brengen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.3.f
    text: |-
      een verbod op het winnen van sperma, eicellen en embryo’s, het insemineren of het laten bevruchten van dieren en
      het transplanteren van embryo’s en eicellen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.3.g
    text: een verplichting tot het merken;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.3.h
    text: een verbod of een verplichting tot het doden van dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.3.i
    text: een verplichting tot het onschadelijk laten maken van gestorven of gedode dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.3.j
    text: |-
      een verplichting tot het laten doen van onderzoek of een verplichting tot het dulden van onderzoek naar de
      aanwezigheid van ziekteverwekkers of ziekteverschijnselen of naar besmetting met een dierziekte of zoönose, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.3.k
    text: een verplichting tot het bijhouden van gegevens.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.4
    text: 'De andere handelingen, bedoeld in het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.4.a
    text: |-
      het afzonderen, het opstallen, het ophokken, het afschermen, het op een aangewezen plaats houden, het vastleggen of
      het opsluiten;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.4.b
    text: het behandelen of het vaccineren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.4.c
    text: het merken;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.4.d
    text: het doden;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.4.e
    text: het onschadelijk maken van gestorven of gedode dieren, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.4.f
    text: |-
      het doen van onderzoek naar de aanwezigheid van ziekteverwekkers of ziekteverschijnselen of naar besmetting met een
      dierziekte of zoönose.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.4.5
    text: |-
      Ten aanzien van een bedrijf waar dieren aanwezig zijn die van besmetting verdacht zijn verklaard, stelt Onze
      Minister het tijdstip vast waarop de verdenking is ontstaan en waarop zij is geëindigd, en welke, dan wel hoeveel
      van de op het bedrijf aanwezige dieren op het eerstgenoemde tijdstip besmet en van besmetting verdacht waren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.4
  - number: 5.5.1
    text: |-
      Onze Minister kan maatregelen treffen en andere handelingen verrichten met betrekking tot producten of voorwerpen,
      voor zover deze drager van een ziekteverwekker kunnen zijn, of een gevaar voor verspreiding van een ziekteverwekker
      kunnen opleveren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.5.2
    text: 'De maatregelen, bedoeld in het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.5.2.a
    text: een verplichting tot het merken;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.5.2.b
    text: een verplichting tot het afzonderen, het op een plaats houden of het opslaan;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.5.2.c
    text: een verplichting tot het behandelen of het onschadelijk maken;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.5.2.d
    text: een verplichting tot het vernietigen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.5.2.e
    text: een verplichting tot het verwerken;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.5.2.f
    text: een verbod of een verplichting tot het verplaatsen of vervoeren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.5.2.g
    text: een verbod op het in of buiten Nederland brengen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.5.2.h
    text: een verbod op in het in contact brengen met of het in de nabijheid brengen van dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.5.2.i
    text: een verplichting tot het reinigen en ontsmetten, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.5.2.j
    text: |-
      een verplichting tot het laten doen van onderzoek of een verplichting tot het dulden van onderzoek naar de
      aanwezigheid van ziekteverwekkers of ziekteverschijnselen of naar besmetting met een dierziekte of zoönose.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.5.3
    text: 'De andere handelingen, bedoeld in het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.5.3.a
    text: het merken;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.5.3.b
    text: het afzonderen, het op een plaats houden of het opslaan;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.5.3.c
    text: het behandelen of het onschadelijk maken;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.5.3.d
    text: het vernietigen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.5.3.e
    text: het verwerken;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.5.3.f
    text: het verplaatsen of het vervoeren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.5.3.g
    text: het reinigen en ontsmetten, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.5.3.h
    text: |-
      het doen van onderzoek naar de aanwezigheid van ziekteverwekkers of ziekteverschijnselen of naar besmetting met een
      dierziekte of zoönose.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.5
  - number: 5.6.1
    text: |-
      Onze Minister kan maatregelen treffen en andere handelingen verrichten met betrekking tot gebouwen, ruimten,
      terreinen, gebieden en andere onroerende zaken waar een ziekteverwekker aanwezig is of ten aanzien waarvan sprake
      is van een verdenking van aanwezigheid van een ziekteverwekker.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.6
  - number: 5.6.2
    text: 'De maatregelen, bedoeld in het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.6
  - number: 5.6.2.a
    text: een verplichting tot het reinigen en ontsmetten;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.6
  - number: 5.6.2.b
    text: een verbod op toegang, betreden of verlaten;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.6
  - number: 5.6.2.c
    text: |-
      een verbod op het vervoer, het verplaatsen en het bijeenbrengen van dieren, producten of voorwerpen naar,
      onderscheidenlijk vanuit en in ruimten, gebouwen, terreinen, gebieden of andere onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.6
  - number: 5.6.2.d
    text: |-
      een verbod op het verrichten van bepaalde handelingen en activiteiten in, op of nabij ruimten, gebouwen, terreinen,
      gebieden of andere onroerende zaken, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.6
  - number: 5.6.2.e
    text: |-
      een verplichting tot het plaatsen van materialen ter voorkoming of bestrijding van besmettelijke dierziekten of
      zoönosen of ter wering van ziekteverwekkers.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.6
  - number: 5.6.3
    text: 'De andere handelingen, bedoeld in het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.6
  - number: 5.6.3.a
    text: het plaatsen van waarschuwingsborden en borden ter vooraankondiging;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.6
  - number: 5.6.3.b
    text: het aanbrengen van kentekenen bij gebouwen, ruimten, terreinen, gebieden en andere onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.6
  - number: 5.6.3.c
    text: |-
      het plaatsen van materialen ter voorkoming of bestrijding van besmettelijke dierziekten of zoönosen of ter wering
      van ziekteverwekkers, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.6
  - number: 5.6.3.d
    text: het reinigen en ontsmetten.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.6
  - number: 5.6.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de modellen van waarschuwingsborden en
      kentekenen als bedoeld in het derde lid, onderdelen a en b.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.6
  - number: 5.6.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over onder meer het vervoeren van dieren,
      producten of voorwerpen van en naar gebouwen, ruimten, terreinen, gebieden en andere onroerende zaken waar een
      kenteken als bedoeld in het derde lid, onderdeel b, is geplaatst, en over de toegang van personen tot dergelijke
      gebouwen, ruimten, terreinen, gebieden en andere onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.6
  - number: '5.7'
    text: |-
      De op grond van deze paragraaf getroffen maatregelen kunnen zo nodig afwijken van het overige bij en krachtens deze
      wet bepaalde, de [Meststoffenwet][ref1] en [hoofdstuk 3 van de Wet natuurbescherming][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0037552
        hoofdstuk: '3'
  - number: 5.8.1
    text: |-
      Onze Minister stelt de burgemeester van de gemeente waar krachtens deze paragraaf een maatregel is getroffen,
      hiervan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.8
  - number: 5.8.2
    text: |-
      De burgemeester van de betrokken gemeente verleent zijn medewerking bij het plaatsen en het weer verwijderen van
      waarschuwingsborden en kentekenen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.8
  - number: 5.9.1
    text: |-
      Met het verrichten van onderzoek naar de aanwezigheid van ziekteverwekkers, dierziekten, zoönosen en
      ziekteverschijnselen zijn belast de bij besluit van Onze Minister aangewezen ambtenaren en personen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.9
  - number: 5.9.2
    text: |-
      [Artikel 8.2][ref1] en de [artikelen 5:13 tot en met 5:20 van de Algemene wet bestuursrecht][ref2] zijn van
      overeenkomstige toepassing op de in het eerste lid bedoelde ambtenaren en personen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 5.10.1
    text: 'Onze Minister kan maatregelen treffen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.1.a
    text: |-
      dieren en dierlijke producten ten aanzien waarvan niet is voldaan aan het bepaalde bij of krachtens deze wet, of
      waarvan dit wordt vermoed;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.1.b
    text: |-
      dieren en dierlijke producten die drager zijn van een ziekteverwekker die een ernstig gevaar voor mens of dier of
      voor het milieu kan opleveren, of waarvan dit wordt vermoed, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.1.c
    text: |-
      dieren, al dan niet gehouden, die via voedering, drenking, inademing of een andere vorm van blootstelling een
      schadelijke stof hebben opgenomen, of waarvan wordt vermoed dat zij deze hebben opgenomen, of die het gevaar lopen
      de stof op te nemen, alsook met betrekking tot de van die dieren afkomstige dierlijke producten.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.2
    text: 'De maatregelen, bedoeld in het eerste lid, met betrekking tot dieren zijn:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.2.a
    text: |-
      een verplichting tot het afzonderen, het opstallen, het ophokken, het op een aangewezen plaats houden, het
      vastleggen of het opsluiten;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.2.b
    text: een verplichting tot het voederen, het drenken, het verzorgen of het behandelen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.2.c
    text: een verplichting tot het merken, het identificeren en registreren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.2.d
    text: een verbod op het van een bedrijf afvoeren, het in de handel brengen, of op het in of buiten Nederland brengen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.2.e
    text: |-
      een verplichting tot het terugzenden, voor zover het dier afkomstig is uit een ander land of tot het vrijlaten van
      gevangen dieren, voor zover die dieren afkomstig zijn uit het wild;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.2.f
    text: |-
      een verbod op het doden, het voorhanden hebben, het in voorraad hebben, het jagen, het vissen of het vangen,
      alsmede op het gebruik van bepaalde methoden of materialen waarmee dat jagen, vissen of vangen kan geschieden, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.2.g
    text: 'een verplichting tot het laten doden en vernietigen, voor zover:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.2.g.1°
    text: dit nodig is ter voorkoming van een ernstig gevaar voor mens of dier, of
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.2.g.2°
    text: een EU-rechtshandeling daartoe verplicht.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.3
    text: 'De maatregelen, bedoeld in het eerste lid, met betrekking tot dierlijke producten zijn:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.3.a
    text: een verplichting tot het afzonderen of het op een aangewezen plaats houden;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.3.b
    text: een verplichting tot het terugzenden, voor zover het product afkomstig is uit een ander land;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.3.c
    text: een verplichting tot het vernietigen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.3.d
    text: een verbod op het van een bedrijf afvoeren of het in de handel brengen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.3.e
    text: een verbod op het in of het buiten Nederland brengen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.3.f
    text: een verplichting tot het terugroepen of het uit de handel nemen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.3.g
    text: een verplichting tot het gebruik voor andere doeleinden dan waarvoor het bestemd was;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.3.h
    text: een verplichting tot het behandelen, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.3.i
    text: een verplichting tot het identificeren en registreren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.4
    text: |-
      Het eerste en het derde lid zijn van overeenkomstige toepassing op andere dan dierlijke producten, voor zover het
      product een gevaar voor verspreiding van een ziekteverwekker kan opleveren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.10.5
    text: |-
      Maatregelen, die krachtens het eerste lid, onderdeel c, worden getroffen met betrekking tot dieren die wegens
      de opname, de vermoedelijke opname of het gevaar van opname van schadelijke stoffen een ernstig gevaar voor de
      volksgezondheid kunnen opleveren, worden getroffen in overeenstemming met de Minister van Volksgezondheid, Welzijn
      en Sport.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.10
  - number: 5.11.1
    text: 'Onze Minister kan maatregelen treffen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.11
  - number: 5.11.1.a
    text: |-
      diervoeders, diergeneesmiddelen en samenstellingen daarvan ten aanzien waarvan niet is voldaan aan het bepaalde bij
      of krachtens deze wet of ten aanzien waarvan dit wordt vermoed, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.11
  - number: 5.11.1.b
    text: |-
      diervoeders, diergeneesmiddelen en samenstellingen daarvan die de gezondheid van mens of dier of het milieu in
      gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.11
  - number: 5.11.2
    text: 'De maatregelen, bedoeld in het eerste lid, kunnen inhouden:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.11
  - number: 5.11.2.a
    text: een verbod op het vervoeren, het bewerken of het verwerken en het in de handel brengen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.11
  - number: 5.11.2.b
    text: een verplichting tot tijdelijke opslag;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.11
  - number: 5.11.2.c
    text: een verplichting tot het terugroepen of het uit de handel nemen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.11
  - number: 5.11.2.d
    text: een verplichting tot het vernietigen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.11
  - number: 5.11.2.e
    text: een verbod op het in of buiten Nederland brengen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.11
  - number: 5.11.2.f
    text: een verplichting tot het terugzenden, voor zover het product afkomstig is uit een ander land;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.11
  - number: 5.11.2.g
    text: |-
      een verplichting om houders, dan wel vermoedelijke houders onverwijld en op doeltreffende wijze op de hoogte te
      stellen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.11
  - number: 5.11.2.h
    text: |-
      een verplichting tot het identificeren en registreren van de diervoeders, diergeneesmiddelen en samenstellingen
      daarvan;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.11
  - number: 5.11.2.i
    text: een verplichting tot het ontsmetten, dan wel het toepassen van een andere passende behandeling;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.11
  - number: 5.11.2.j
    text: |-
      een verplichting tot het ophalen van in de handel gebrachte diervoeders, diergeneesmiddelen en samenstellingen
      daarvan en het opslaan op een bij de maatregel aangewezen plaats;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.11
  - number: 5.11.2.k
    text: |-
      een verplichting om de diervoeders, diergeneesmiddelen en samenstellingen daarvan voor andere doeleinden te
      gebruiken, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.11
  - number: 5.11.2.l
    text: een verbod op het voederen aan, het toepassen bij of het brengen in de nabijheid van dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.11
  - number: 5.12.1
    text: |-
      Onze Minister kan maatregelen treffen met betrekking tot bedrijven, inrichtingen of locaties die de gezondheid van
      mens of dier in gevaar kunnen brengen en:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.12
  - number: 5.12.1.a
    text: |-
      ten aanzien waarvan niet is voldaan aan het bepaalde bij of krachtens een EU-verordening, EU-besluit of deze wet of
      ten aanzien waarvan dit wordt vermoed;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.12
  - number: 5.12.1.b
    text: |-
      waar dieren of producten aanwezig zijn of zijn geweest ten aanzien waarvan niet is voldaan aan het bepaalde bij of
      krachtens een EU-verordening, EU-besluit of deze wet of ten aanzien waarvan dit wordt vermoed.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.12
  - number: 5.12.2
    text: 'De maatregelen, bedoeld in het eerste lid, kunnen inhouden:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.12
  - number: 5.12.2.a
    text: |-
      gehele of gedeeltelijke sluiting van de bedrijven, inrichtingen of locaties gedurende een door Onze Minister te
      bepalen periode;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.12
  - number: 5.12.2.b
    text: |-
      schorsing of intrekking van een vergunning, erkenning, toestemming, toelating, registratie, bewijs van
      vakbekwaamheid, goedkeuring of certificering die bij of krachtens een EU-verordening, EU-besluit of deze wet aan de
      bedrijven, inrichtingen of locaties is verleend, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.12
  - number: 5.12.2.c
    text: |-
      een verplichting tot vaststelling van hygiëneprocedures of tot ander handelen of nalaten dat noodzakelijk is om
      de veiligheid van dieren en producten op het bedrijf, de inrichting of de locatie te waarborgen, dan wel om de bij
      of krachtens een EU-verordening, EU-besluit of deze wet gestelde regels inzake dierenwelzijn, volksgezondheid of
      diergezondheid op het bedrijf, de inrichting of de locatie na te komen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.12
  - number: 5.13.1
    text: |-
      De burgemeester van de gemeente waar zich een dier bevindt dat in strijd met het bepaalde krachtens
      [artikel 2.6, tweede lid, onderdeel a, onder 2°][ref1], is gefokt, of dat in strijd met het bepaalde bij en
      krachtens [artikel 2.2, zesde lid, eerste volzin][ref2], wordt gehouden, kan besluiten dat dit dier:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 5.13.1.a
    text: naar een door hem aangewezen plaats wordt vervoerd, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.13
  - number: 5.13.1.b
    text: aldaar wordt gedood.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.13
  - number: 5.13.2
    text: |-
      De burgemeester voert de handeling, bedoeld in het eerste lid, onderdeel b, niet uit indien de houder binnen
      zes weken nadat het besluit, bedoeld in het eerste lid, aan hem is bekendgemaakt, een verzoek als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1] heeft ingediend en op dat verzoek niet afwijzend is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '5.14'
    text: |-
      De kosten van de maatregelen getroffen krachtens deze paragraaf komen ten laste van de houder van het dier, het
      product, het diervoeder, het diergeneesmiddel of de samenstelling van een diervoeder en een diergeneesmiddel, dan
      wel de exploitant van het bedrijf, de inrichting dan wel de locatie.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.14
  - number: 5.15.1
    text: |-
      Eenieder die diervoeders, diergeneesmiddelen, of samenstellingen daarvan of dierlijke producten bereidt, bewerkt,
      verwerkt, voorhanden of in voorraad heeft, opslaat, verpakt, in de handel brengt, verhandelt, vervoert, in
      of buiten Nederland brengt, vervoedert of onderzoekt, stelt onverwijld Onze Minister op de hoogte indien hij
      constateert of vermoedt dat deze producten niet voldoen aan het bepaalde bij of krachtens deze wet of de gezondheid
      van mens of dier of het milieu in gevaar kunnen brengen, alsmede van de maatregelen die hij heeft getroffen ter
      voorkoming van risico’s voor de gezondheid van mens of dier of voor het milieu.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.15
  - number: 5.15.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op grondstoffen voor de bereiding van de in het eerste lid
      bedoelde diervoeders, diergeneesmiddelen, of samenstellingen daarvan en dierlijke producten.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.15
  - number: 5.15.3
    text: |-
      De verplichting, bedoeld in het eerste lid, is van overeenkomstige toepassing op dierenartsen en andere
      personen als bedoeld in [artikel 4.3, eerste lid][ref1] en op degene aan wie een vergunning als bedoeld in
      [artikel 2.19, eerste lid][ref2], is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 5.15.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het verstrekken van de in het eerste lid
      bedoelde inlichtingen en over de maatregelen die ter voorkoming van risico’s voor de gezondheid van mens of dier of
      voor het milieu zijn ondernomen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel5.15
  - number: '6.1'
    text: 'Dit hoofdstuk is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel6.1
  - number: 6.1.a
    text: |-
      de uitvoering van EU-rechtshandelingen die krachtens de artikelen 43, 114, 207, 168, 169 of 192 van het Verdrag
      betreffende de werking van de Europese Unie zijn vastgesteld en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel6.1
  - number: 6.1.b
    text: de uitvoering van EU-rechtshandelingen die krachtens de onder a bedoelde rechtshandelingen zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel6.1
  - number: 6.2.1
    text: |-
      Het is verboden in strijd te handelen met bij of krachtens algemene maatregel van bestuur of bij ministeriële
      regeling aangewezen voorschriften van EU-verordeningen betreffende onderwerpen waarop deze wet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel6.2
  - number: 6.2.2
    text: |-
      De aanwijzing bij ministeriële regeling, bedoeld in het eerste lid, geschiedt in overeenstemming met Onze Minister
      van Volksgezondheid, Welzijn en Sport voor zover de voorschriften geheel of mede strekken tot bescherming van de
      volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel6.2
  - number: 6.3.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van onderdelen van EU-
      rechtshandelingen waarin een EU-rechtshandeling een tot de overheid behorend orgaan of een persoon in dienst van de
      overheid, de opdracht geeft of de keuze laat.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel6.3
  - number: 6.3.2
    text: |-
      Tenzij bij wettelijk voorschrift anders is bepaald is Onze Minister bevoegd de besluiten te nemen waartoe een
      voorschrift van een EU-verordening als bedoeld in [artikel 6.2][ref1] een tot de overheid behorend orgaan of een
      persoon in dienst van de overheid, de opdracht geeft of de keuze laat.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel6
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.1
    text: |-
      In afwijking van het bepaalde in de [hoofdstukken 2][ref1] en [3][ref2] kunnen bij ministeriële regeling regels
      worden gesteld voor de uitvoering van een bindend onderdeel van een EU-verordening of een EU-besluit, voor
      zover de EU-verordening of het EU-besluit onderwerpen betreft, bedoeld in de [artikelen 2.2, tiende lid][ref3],
      [2.3, vierde lid][ref4], [2.4, tweede of derde lid][ref5], [2.5, tweede lid][ref6],
      [2.6, tweede of derde lid][ref7], [2.7, tweede lid][ref8], [2.8, vierde lid][ref9], [2.10, derde lid][ref10],
      [2.15, tweede of vierde lid][ref11], [2.16, tweede lid][ref12], [2.18, tweede lid][ref13],
      [2.19, tweede, vierde en vijfde lid][ref14], [2.20, tweede lid][ref15], [2.21, eerste lid][ref16],
      [2.22, tweede lid][ref17], [2.23][ref18], [2.25, derde lid][ref19], [3.1, tweede lid][ref20],
      [3.2, tweede lid][ref21], [4.1, derde en vijfde lid][ref22], [4.5, tweede lid][ref23], [5.4, tweede lid][ref24],
      [5.6, vierde en vijfde lid][ref25], [7.2, eerste tot en met derde lid][ref26], [7.3, derde lid][ref27],
      [7.4, eerste lid][ref28], [7.6, eerste lid][ref29], [7.8][ref30], [10.1][ref31] en [10.2][ref32].


