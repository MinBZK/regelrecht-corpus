  - number: '10.11'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel10.11
  - number: 11.1.1
    text: |-
      Besluiten, niet inhoudende een algemeen verbindend voorschrift, genomen bij of krachtens de
      [Gezondheids- en welzijnswet voor dieren][ref1], de [Kaderwet diervoeders][ref2], de [Diergeneesmiddelenwet][ref3],
      de [Wet op de dierenbescherming][ref4], de [Wet op de uitoefening van de diergeneeskunde 1990][ref5] of, voor zover
      zij betrekking hebben op onderwerpen waarop deze wet van toepassing is, krachtens de [Landbouwkwaliteitswet][ref6]
      of de [Landbouwwet][ref7], die gelden op het tijdstip van inwerkingtreding van deze wet, worden geacht te zijn
      genomen op grond van deze wet, onder dezelfde voorschriften, beperkingen en voorwaarden. Bij of krachtens algemene
      maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot voorschriften, beperkingen en
      voorwaarden voor zover de uitvoering van bindende onderdelen van EU-rechtshandelingen dit vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005662
      [ref2]: https://wetten.overheid.nl/BWBR0015764
      [ref3]: https://wetten.overheid.nl/BWBR0003818
      [ref4]: https://wetten.overheid.nl/BWBR0002351
      [ref5]: https://wetten.overheid.nl/BWBR0004730
      [ref6]: https://wetten.overheid.nl/BWBR0002755
      [ref7]: https://wetten.overheid.nl/BWBR0002252
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel11.1
    references:
