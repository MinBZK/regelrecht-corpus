    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.6
  - number: 8.6.2
    text: |-
      Indien een overtreding is gepleegd door een rechtspersoon, wordt onder overtreder mede verstaan: degene die tot de
      overtreding opdracht heeft gegeven of daaraan feitelijk leiding heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.6
  - number: '8.7'
    text: Onze Minister kan een overtreder een bestuurlijke boete opleggen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.7
  - number: 8.8.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de hoogte van de bestuurlijke boete die
      voor een overtreding of voor categorieën van overtredingen kan worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.8
  - number: 8.8.2
    text: |-
      De op grond van het eerste lid te bepalen bestuurlijke boete bedraagt ten hoogste het bedrag dat is bepaald voor de
      vijfde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1], per overtreding begaan
      door een natuurlijke persoon, en ten hoogste het bedrag dat is bepaald voor de zesde categorie, bedoeld in artikel
      23, vierde lid, van het Wetboek van Strafrecht per overtreding, begaan door een rechtspersoon of een vennootschap,
      of, indien dat meer is, 10 procent van de jaaromzet in het boekjaar voorafgaande aan het boekjaar waarin de boete
      wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 8.8.3
    text: |-
      De berekening van de omzet, bedoeld in het tweede lid, geschiedt op voet van het bepaalde in
      [artikel 377, zesde lid, van boek 2 van het Burgerlijk Wetboek][ref1] voor de netto-omzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel377
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '377'
  - number: 8.10.1
    text: |-
      Indien de ernst van de overtreding of de omstandigheden waaronder zij is begaan daartoe aanleiding geven, wordt zij
      aan het openbaar ministerie voorgelegd.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.10
  - number: 8.10.2
    text: |-
      Indien ter zake van een overtreding aan de overtreder een bestuurlijke boete is opgelegd, dan wel een
      mededeling als bedoeld in [artikel 5:50, tweede lid, onderdeel a, van de Algemene wet bestuursrecht][ref1] is
      verzonden, heeft dit dezelfde rechtsgevolgen als een kennisgeving van niet verdere vervolging als bedoeld in
      [artikel 246, eerste lid, van het Wetboek van Strafvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel246
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.10
