        paragraaf: '5'
  - number: 8.38.2
    text: |-
      De voorzitter kan bepalen dat het veterinaire beroepscollege bij een gezamenlijke behandeling van klachten als
      bedoeld in [artikel 8.28, eerste lid][ref1], zitting houdt in een van [artikel 8.37, eerste lid][ref2], afwijkende
      samenstelling, onder de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.38
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: 8.38.2.a
    text: het aantal leden dat zitting houdt bedraagt vijf of zeven;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.38
  - number: 8.38.2.b
    text: de samenstelling bestaat voor de meerderheid uit rechtsgeleerden, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.38
  - number: 8.38.2.c
    text: |-
      voor elk van de beroepsgroepen tot welke degenen over wie is geklaagd behoren, neemt tenminste een lid deel dat tot
      diezelfde groep behoort.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.38
  - number: 8.38.3
    text: |-
      [Artikel 8.37, tweede lid][ref1], is van overeenkomstige toepassing op het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.38
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: 8.39.1
    text: 'Het veterinair beroepscollege kan in beroep de volgende beslissingen nemen:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.39
  - number: 8.39.1.a
    text: degene die beroep heeft ingesteld niet-ontvankelijk verklaren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.39
  - number: 8.39.1.b
    text: het beroep verwerpen, of
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.39
  - number: 8.39.1.c
    text: het beroep gegrond verklaren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.39
  - number: 8.39.2
    text: |-
      Indien het veterinair beroepscollege het beroep gegrond verklaart dan wel bij de behandeling van het beroep op
      andere dan de in het beroepschrift aangevoerde gronden tot het oordeel komt, dat de in eerste aanleg gegeven
      beslissing niet kan worden gehandhaafd, vernietigt het deze beslissing en doet de zaak zelf af.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.39
  - number: 8.39.3
    text: |-
      De [artikelen 8.30][ref1], [8.31][ref2] en [8.32][ref3] zijn van overeenkomstige toepassing ingeval het veterinair
      beroepscollege op grond van het tweede lid de zaak zelf afdoet.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.39
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: 8.40.1
    text: De beslissing in beroep houdt de overweging in waarop zij steunt en wordt op schrift gesteld.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.40
  - number: 8.40.2
    text: |-
      De secretaris van het veterinair beroepscollege zendt van de beslissing onverwijld bij aangetekende brief
      afschrift:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.40
  - number: 8.40.2.a
    text: aan de persoon over wie geklaagd is;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.40
  - number: 8.40.2.b
    text: aan de klager;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.40
  - number: 8.40.2.c
    text: |-
      aan de ambtenaar, bedoeld in [artikel 8.15, tweede lid, onderdeel b][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.40
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: 8.40.2.d
    text: aan het veterinair tuchtcollege.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.40
  - number: 8.40.3
    text: |-
      De secretaris van het veterinair beroepscollege verstrekt desgevraagd aan de gerechten en het openbaar ministerie
      inlichtingen omtrent beslissingen van het veterinair beroepscollege.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.40
  - number: 8.41.1
    text: |-
      Het veterinair beroepscollege kan zich de stukken met betrekking tot een zaak die in behandeling is bij het
      veterinair tuchtcollege, doen overleggen en het tuchtcollege een termijn stellen, binnen welke de beslissing wordt
      genomen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.41
  - number: 8.41.2
    text: |-
      Indien het veterinair tuchtcollege niet voldoet aan het bepaalde krachtens het eerste lid, kan het veterinair
      beroepscollege de behandeling van de zaak aan zich trekken en in hoogste ressort beslissen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.41
  - number: 8.41.3
    text: |-
      De [artikelen 8.30][ref1], [8.31][ref2], [8.32][ref3], [8.34][ref4] en [8.40][ref5] zijn van overeenkomstige
      toepassing ingeval het tweede lid wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.41
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
      - id: ref5
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: 8.42.1
    text: |-
      In bijzondere gevallen kan bij koninklijk besluit worden bepaald, het veterinaire tuchtcollege gehoord, dat
      degene ten aanzien van wie de bij of krachtens deze wet verleende bevoegdheid tot het beroepsmatig verrichten van
      diergeneeskundige handelingen geheel of gedeeltelijk is ontzegd, op zijn verzoek in die bevoegdheid wordt hersteld.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.42
  - number: 8.42.2
    text: Herstel kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.42
  - number: '8.43'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      rechtsgang ten behoeve van de waarborging van een deugdelijke berechting.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.43
  - number: 8.44.1
    text: |-
      Onze Minister moedigt het opstellen en het toepassen aan van gidsen voor goede praktijken die aanbevelingen
      bevatten voor de naleving van het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.44
  - number: 8.44.2
    text: Nationale gidsen voor goede praktijken kunnen aan Onze Minister ter beoordeling worden voorgelegd.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.44
  - number: 8.44.3
    text: |-
      Op verzoeken om een beoordeling als bedoeld in het tweede lid, zijn de [artikelen 7.6][ref1], [7.7][ref2] en
      [7.8][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.44
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 8.45.1
    text: |-
      Bij toepassing van [artikel 10.4][ref1] kan bij of krachtens algemene maatregel van bestuur dan wel bij
      ministeriële regeling worden bepaald dat tuchtrechtelijke maatregelen worden gesteld op overtreding van de bij die
      maatregel of regeling genoemde nadere regelen die door het bestuur van het betrokken productschap of bedrijfschap
      krachtens artikel 10.4, tweede lid, bij verordening als bedoeld in 10.4, derde lid, zijn of worden gesteld, voor
      zover handelen in strijd met deze nadere regelen als overtreding strafbaar is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel10
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.45
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '10'
        hoofdstuk: '10'
  - number: 8.45.2
    text: |-
      De [artikelen 1, onderdeel b][ref1], [2][ref2], [3 tot en met 6][ref3], [15 tot en met 44, eerste lid][ref4],
      en [46 van de Wet tuchtrechtspraak bedrijfsorganisatie 2004][ref5] zijn van overeenkomstige toepassing, met dien
      verstande dat de instemming, bedoeld in artikel 46 van die wet wordt verkregen van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0016341#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0016341#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0016341#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0016341#Artikel46
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.45
    references:
      - id: ref1
        bwb_id: BWBR0016341
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0016341
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0016341
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0016341
        artikel: '15'
      - id: ref5
        bwb_id: BWBR0016341
        artikel: '46'
  - number: 8.45.3
    text: |-
      Onverminderd [artikel 8.1, eerste lid][ref1], kan bij of krachtens algemene maatregel van bestuur, dan wel
      bij ministeriële regeling, worden bepaald dat met het toezicht op de naleving van de nadere regels waarvoor
      tuchtrechtelijke maatregelen zijn of worden opgelegd, de bij besluit van het betrokken bedrijfslichaam of
      samenwerkingslichaam aangewezen personen zijn belast. Dit besluit behoeft de goedkeuring van Onze Minister. Onze
      Minister kan het betrokken bedrijfslichaam of samenwerkingslichaam een aanwijzing geven omtrent het aanwijzen van
      toezichthouders en de wijze waarop toezicht wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.45
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '8.46'
    text: |-
      Ingeval bij of krachtens deze wet wordt verwezen naar door de Voedsel- en Landbouworganisatie en de
      Wereldgezondheidsorganisatie tot stand gebrachte voedselstandaarden, codes voor goede praktijken of richtsnoeren,
      kan overtreding daarvan ook worden bestraft met een geldboete indien deze voedselstandaarden, codes voor goede
      praktijken of richtsnoeren in de Engelse taal zijn gesteld en bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.46
  - number: 9.1.1
    text: |-
      Onze Minister kan een heffing opleggen ter vergoeding van kosten overeenkomstig een door hem vastgesteld tarief ter
      zake van de volgende handelingen:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.1
  - number: 9.1.1.a
    text: |-
      de behandeling van een aanvraag tot een bij of krachtens deze wet voorgeschreven vergunning, erkenning, aanwijzing,
      toestemming, toelating, registratie, bewijs van vakbekwaamheid, goedkeuring of certificering dan wel van een
      aanvraag tot verlenging of wijziging daarvan;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.1
  - number: 9.1.1.b
    text: |-
      de instandhouding van de bij of krachtens deze wet verleende vergunning, erkenning, aanwijzing, toestemming,
      toelating, registratie, bewijs van vakbekwaamheid, goedkeuring of certificering;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.1
  - number: 9.1.1.c
    text: |-
      de behandeling van een aanvraag tot ontheffing van het bij of krachtens deze wet bepaalde, dan wel van een aanvraag
      tot verlenging of wijziging van de ontheffing;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.1
  - number: 9.1.1.d
    text: de identificatie en registratie van dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.1
  - number: 9.1.1.e
    text: |-
      keuringen als bedoeld in [artikel 2.10, derde lid, onderdeel p][ref1],
      [artikel 2.20, tweede lid, onderdeel k][ref2], en [artikel 3.2, tweede lid, onderdeel d][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel3
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 9.1.1.f
    text: |-
      het toezicht op de naleving van [artikel 2.15][ref1] bij een wedstrijd, ten laste van de organiserende instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 9.1.1.g
    text: |-
      onderzoeken, controles of verrichtingen met betrekking tot dieren, diervoeders, diergeneesmiddelen, producten of
      voorwerpen, bedrijven of locaties ter voorkoming en bestrijding van dierziekten, zoönosen en ziekteverschijnselen,
      en ter wering van ziekteverwekkers, voor zover de onderzoeken of verrichtingen zijn voorgeschreven bij een EU-
      rechtshandeling dan wel op verzoek van betrokkenen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.1
  - number: 9.1.1.h
    text: |-
      controles die nodig zijn om de omvang van een overtreding van het bepaalde bij of krachtens deze wet vast te
      stellen, om na te gaan of corrigerende maatregelen zijn genomen, dan wel om een overtreding op te sporen of
      te bewijzen, voor zover de heffing ter vergoeding van kosten van deze controles is voorgeschreven bij een EU-
      rechtshandeling, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.1
  - number: 9.1.1.i
    text: |-
      de beoordeling van gidsen als bedoeld [artikel 8.44][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '6'
  - number: 9.1.1.j
    text: |-
      het bijhouden van gegevens in een register als bedoeld in [artikel 7.2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 9.1.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een heffing ter vergoeding van kosten worden opgelegd
      overeenkomstig een vastgesteld tarief ter zake van bij die maatregel benoemde onderzoeken of verrichtingen voor
      zover de onderzoeken of verrichtingen zijn voorgeschreven bij of krachtens deze wet of bij EU-verordening.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.1
  - number: 9.1.3
    text: |-
      Een tarief als bedoeld in het eerste of tweede lid wordt zodanig vastgesteld dat de geraamde baten niet uitgaan
      boven de geraamde kosten die in een rechtstreeks verband staan met de werkzaamheden waarvoor het tarief wordt
      opgelegd, onverminderd de daaromtrent bij een EU-rechtshandeling vastgestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.1
  - number: 9.1.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de betaling van de heffing, en kan worden
      geregeld dat een handeling als bedoeld in het eerste lid, aanhef, slechts dan wordt uitgevoerd nadat betaling van
      de heffing heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.1
  - number: 9.2.1
    text: Er is een Diergezondheidsfonds.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.2
  - number: 9.2.2
    text: |-
      Het Diergezondheidsfonds is een begrotingsfonds als bedoeld in
      [artikel 2.11, eerste lid, van de Comptabiliteitswet 2016][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
  - number: 9.2.3
    text: |-
      Het Diergezondheidsfonds heeft ten doel het betalen van kosten en uitgaven in verband met de bestrijding, bewaking
      en preventie van en onderzoek naar dierziekten, zoönosen, ziekteverschijnselen en resistentie in brede zin.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.2
  - number: 9.2.4
    text: Onze Minister beheert de begroting van het Diergezondheidsfonds.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.2
  - number: 9.3.1
    text: 'De ontvangsten van het Diergezondheidsfonds worden gevormd door:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.3
  - number: 9.3.1.a
    text: |-
      de opbrengsten van de diergezondheidsheffing, bedoeld in [artikel 9.14][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 9.3.1.b
    text: bijdragen vanuit de begroting van het Ministerie van Economische Zaken;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.3
  - number: 9.3.1.c
    text: |-
      de door de Europese Unie ter beschikking gestelde middelen, verband houdende met het weren en de bestrijding van op
      grond van [artikel 5.3, eerste lid][ref1], voor dieren aangewezen besmettelijke dierziekten;


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel5
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 9.3.1.d
    text: andere ontvangsten.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.3
  - number: 9.3.2
    text: Het Diergezondheidsfonds sluit het begrotingsjaar niet af met een negatief saldo.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.3
  - number: 9.3.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de voorwaarden waaronder betalingen worden verricht en
      over de informatieverstrekking over de besteding van de verkregen bijdragen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.3
  - number: 9.4.1
    text: 'Uit het Diergezondheidsfonds worden betaald:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.4
  - number: 9.4.1.a
    text: |-
      de kosten van de uitvoering van de maatregelen bedoeld in [artikel 5.6, derde lid, onderdelen a tot en met d][ref1]
      met uitzondering van de kosten van het reinigen van gebouwen, terreinen, bewaarplaatsen van mest en voorwerpen
      alsmede van het reinigen en ontsmetten van markten en andere plaatsen waarop dieren afkomstig van verschillende
      plaatsen bijeen worden gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel5
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 9.4.1.b
    text: de kosten van het ter beschikking stellen van middelen voor reiniging en ontsmetting, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.4
  - number: 9.4.1.c
    text: |-
      betalingen ter uitvoering van de [artikelen 9.6, eerste lid][ref1], [9.9, vierde lid][ref2] en [9.10][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.4.2
    text: 'Uit het Diergezondheidsfonds kunnen betalingen worden verricht:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.4
  - number: 9.4.2.a
    text: |-
      ter uitvoering van [artikel 9.11][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.4.2.b
    text: |-
      ter uitvoering van [artikel 9.12][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.4.2.c
    text: |-
      ter zake van door Onze Minister getroffen maatregelen bedoeld in [hoofdstuk 5, paragraaf 2][ref1], waaronder
      tevens begrepen worden de met het voorkomen en de bestrijding van op grond van [artikel 5.3][ref2] aangewezen
      dierziekten, zoönosen en ziekteverschijnselen verband houdende maatregelen getroffen met het oog op de bescherming
      van het welzijn van dieren dan wel met het oog op onderzoek naar de mate van verspreiding van dierziekten, zoönosen
      en ziekteverschijnselen in Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel5
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 9.4.2.d
    text: |-
      ter zake van door Onze Minister, met het oog op het weren van op grond van [artikel 5.3][ref1] aangewezen
      dierziekten, zoönosen of ziekteverschijnselen gemaakte kosten;


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel5
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 9.4.2.e
    text: |-
      ter zake van uitgaven ten behoeve van het weren van tegen antimicrobiële diergeneesmiddelen resistente bacteriën
      bij dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.4
  - number: 9.4.2.f
    text: |-
      ter zake van de heffing en invordering van de krachtens de [artikelen 9.14][ref1], [9.15][ref2], [9.16][ref3] en
      [9.19][ref4] ingevoerde heffingen, en


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 9.4.2.g
    text: ter zake van andere uitgaven.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.4
  - number: 9.4.4
    text: |-
      Onze Minister kan besluiten dat de kosten van het behandelen en merken van dieren, dierlijke of plantaardige
      producten geheel of gedeeltelijk worden betaald uit ’s Rijks kas.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.4
  - number: '9.5'
    text: |-
      Deze paragraaf is van toepassing op maatregelen, getroffen krachtens [hoofdstuk 5, paragraaf 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0030250
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 9.6.1
    text: |-
      Uit het Diergezondheidsfonds wordt door Onze Minister aan de houder een tegemoetkoming in de schade uitgekeerd,
      indien:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.6
  - number: 9.6.1.a
    text: dieren worden gedood, of
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.6
  - number: 9.6.1.b
    text: producten of voorwerpen onschadelijk worden gemaakt of worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.6
  - number: 9.6.2
    text: Aan de toekenning van een tegemoetkoming kunnen door Onze Minister voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.6
  - number: 9.6.3
    text: 'De voorwaarden, bedoeld in het tweede lid, kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.6
  - number: 9.6.3.a
    text: de inrichting van het bedrijf;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.6
  - number: 9.6.3.b
    text: de hygiëne op het bedrijf;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.6
  - number: 9.6.3.c
    text: de herbevolking van het bedrijf;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.6
  - number: 9.6.3.d
    text: de bedrijfsbegeleiding door een dierenarts, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.6
  - number: 9.6.3.e
    text: op het bedrijf te nemen preventieve maatregelen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.6
  - number: 9.6.4
    text: |-
      Ingeval de houder niet bedrijfsmatig dieren houdt, kunnen de voorwaarden, bedoeld in het tweede lid, betrekking
      hebben op:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.6
  - number: 9.6.4.a
    text: de inrichting van de verblijfsruimten voor dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.6
  - number: 9.6.4.b
    text: de hygiëne in de verblijfsruimten voor dieren;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.6
  - number: 9.6.4.c
    text: de herbevolking van de verblijfsruimten voor dieren, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.6
  - number: 9.6.4.d
    text: de te nemen preventieve maatregelen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.6
  - number: 9.7.1
    text: |-
      Onze Minister kan besluiten dat, in afwijking van het bepaalde in [artikel 9.6][ref1], geen tegemoetkoming als
      bedoeld in artikel 9.6 wordt toegekend, dan wel dat de tegemoetkoming op een lager bedrag wordt bepaald, voor
      zover:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.7.1.a
    text: het optreden van de dierziekte, de zoönose of het ziekteverschijnsel mede aan de betrokkene te wijten is;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.7
  - number: 9.7.1.b
    text: |-
      de houder aan de bij of krachtens [artikel 2.2][ref1] gestelde regels of de krachtens
      [artikel 92 van de Gezondheids- en welzijnswet voor dieren][ref2] opgelegde verplichtingen niet of niet volledig
      heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel92
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '92'
  - number: 9.7.2
    text: |-
      Onze Minister kan de uitbetaling van de tegemoetkoming opschorten totdat aan de op grond van
      [artikel 9.6, tweede lid][ref1], gestelde voorwaarden is voldaan, dan wel aan degene aan wie de tegemoetkoming is
      toegekend, de verplichting opleggen zekerheid te stellen voor de juiste nakoming van de op grond van dat artikel
      gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.7.3
    text: |-
      Onze Minister kan het bedrag van de tegemoetkoming geheel of gedeeltelijk terugvorderen, indien aan de op grond van
      [artikel 9.6, tweede lid][ref1], gestelde voorwaarden geheel of gedeeltelijk niet is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.8.1
    text: 'De tegemoetkoming in de schade bedraagt:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.8
  - number: 9.8.1.a
    text: 'voor verdachte dieren: de waarde in gezonde toestand;'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.8
  - number: 9.8.1.b
    text: |-
      voor zieke of dode dieren: het bij algemene maatregel van bestuur te bepalen gedeelte van de waarde in gezonde
      toestand;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.8
  - number: 9.8.1.c
    text: 'voor producten: de marktwaarde, en'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.8
  - number: 9.8.1.d
    text: 'voor voorwerpen: de vervangingswaarde.'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.8
  - number: 9.8.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan voor bepaalde dieren, diersoorten of diercategorieën aan de
      tegemoetkoming in de schade een maximum worden gesteld.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.8
  - number: 9.8.3
    text: |-
      Voordat dieren worden gedood of producten of voorwerpen onschadelijk worden gemaakt of vernietigd, wordt de waarde
      daarvan vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.8
  - number: 9.8.4
    text: Van het derde lid kan in uitzonderlijke gevallen om redenen van spoedeisendheid worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.8
  - number: 9.8.5
    text: |-
      Onze Minister stelt, op basis van een advies over de waarde opgesteld door een door hem aangewezen deskundige, de
      tegemoetkoming in de schade vast.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.8
  - number: 9.8.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de uitvoering van de waardevaststelling,
      bedoeld in het derde lid. Deze regels hebben betrekking op:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.8
  - number: 9.8.6.a
    text: het tijdstip dat als ijkmoment geldt voor de waardevaststelling;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.8
  - number: 9.8.6.b
    text: de kwalificatie van de dieren, producten of voorwerpen waarvan de waarde moet worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.8
  - number: 9.8.6.c
    text: de wijze van waardevaststelling, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.8
  - number: 9.8.6.d
    text: de herwaardering van de waardevaststelling door een of meer deskundigen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.8
  - number: 9.8.7
    text: |-
      Onze Minister stelt een formulier vast waarop de onderbouwing van het advies over de waarde wordt vastgelegd. Het
      formulier bevat in elk geval de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.8
  - number: 9.8.7.a
    text: de aanduiding van hetgeen waarvan de waarde wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.8
  - number: 9.8.7.b
    text: de voor de waardevaststelling relevante gegevens, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.8
  - number: 9.8.7.c
    text: de waarde en de motivering ervan.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.8
  - number: 9.8.8
    text: |-
      Zo spoedig mogelijk nadat de waarde is vastgesteld deelt Onze Minister aan de houder het bedrag van de
      tegemoetkoming in de schade mede.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.8
  - number: 9.9.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de vakbekwaamheid van deskundigen als
      bedoeld in [artikel 9.8, vijfde lid, en zesde lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.9.2
    text: |-
      De regels, bedoeld in het eerste lid, hebben in elk geval betrekking op de algemene kennis op het gebied van
      waardevaststellingen alsmede praktijkvaardigheden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.9
  - number: 9.9.3
    text: |-
      Bij ministeriële regeling worden regels gesteld over de vergoeding van de deskundige, bedoeld in
      [artikel 9.8, vijfde lid, en zesde lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.9.4
    text: De vergoeding, bedoeld in het derde lid, wordt betaald uit het Diergezondheidsfonds.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.9
  - number: '9.10'
    text: |-
      Indien door het vernietigen of onschadelijk maken van dieren, producten of voorwerpen schade wordt toegebracht aan
      gebouwen, terreinen of voorwerpen, wordt door Onze Minister aan de houder of gebruiker van deze gebouwen, terreinen
      of voorwerpen uit het Diergezondheidsfonds een tegemoetkoming in de schade uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.10
  - number: '9.11'
    text: |-
      Een tegemoetkoming in de schade veroorzaakt door de toepassing van maatregelen, als bedoeld in
      [hoofdstuk 5, paragraaf 2][ref1], kan, voor zover voor deze schade niet op grond van de [artikelen 9.6][ref2] of
      [9.10][ref3] een tegemoetkoming kan worden gegeven, in door Onze Minister te bepalen bijzondere gevallen geheel of
      gedeeltelijk uit het Diergezondheidsfonds worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.11
    references:
      - id: ref1
        bwb_id: BWBR0030250
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.12.1
    text: |-
      Voor de periode tussen het moment waarop aan de houder is medegedeeld dat een maatregel als bedoeld in
      [hoofdstuk 5, paragraaf 2][ref1], wordt toegepast en het moment van toepassen van deze maatregel, kan door onze
      Minister een vergoeding worden betaald aan de houder voor de kosten die hij maakt bij de verzorging van de dieren
      waarop de maatregel wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.12
    references:
      - id: ref1
        bwb_id: BWBR0030250
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 9.12.2
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.12
  - number: 9.12.2.a
    text: de hoogte van de vergoeding;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.12
  - number: 9.12.2.b
    text: de voorwaarden om in aanmerking te komen voor een vergoeding, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.12
  - number: 9.12.2.c
    text: de periode waarop een vergoeding betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.12
  - number: 9.12.3
    text: De vergoeding, bedoeld in het eerste lid, kan worden betaald uit het Diergezondheidsfonds.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.12
  - number: '9.13'
    text: |-
      Voor de toepassing van het bij en krachtens deze paragraaf bepaalde wordt verstaan onder: - *vaccinbroedei:*
      ei, afkomstig van pluimvee, dat zich in een broedmachine bevindt om te worden afgeleverd aan de farmaceutische
      industrie, dan wel bestemd is om voor dit doel in een broedmachine te worden gelegd.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.13
  - number: '9.14'
    text: |-
      Onder de naam diergezondheidsheffing worden heffingen geheven voor de uitgaven van het Diergezondheidsfonds,
      bedoeld in [artikel 9.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.14
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.15.1
    text: 'De diergezondheidsheffing wordt geheven ter zake van het houden in de uitoefening van een bedrijf van:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.15
  - number: 9.15.1.a
    text: kippen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.15
  - number: 9.15.1.b
    text: kalkoenen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.15
  - number: 9.15.1.c
    text: eenden;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.15
  - number: 9.15.1.d
    text: schapen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.15
  - number: 9.15.1.e
    text: geiten;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.15
  - number: 9.15.1.f
    text: varkens;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.15
  - number: 9.15.1.g
    text: runderen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.15
  - number: 9.15.2
    text: |-
      Bij algemene maatregel van bestuur kunnen andere diersoorten worden aangewezen dan die, genoemd in het eerste
      lid, waarvoor met ingang van een datum die is gelegen na het tijdstip van inwerkingtreding van die maatregel, de
      diergezondheidsheffing wordt geheven met dien verstande dat, ingeval de betrokken heffing wordt ingevoerd gedurende
      het kalenderjaar, de heffing in dat kalenderjaar wordt geheven over het nog niet verstreken deel van dat jaar.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.15
  - number: 9.15.3
    text: |-
      De diergezondheidsheffing wordt, in afwijking van het eerste en tweede lid, niet geheven voor bij algemene
      maatregel van bestuur aan te wijzen diersoorten indien het aantal dieren dat van die diersoort op het bedrijf wordt
      gehouden niet meer bedraagt dan een in die maatregel voor die diersoort bepaald aantal.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.15
  - number: 9.16.1
    text: |-
      De diergezondheidsheffing wordt geheven ter zake van het houden van schapen en geiten, anders dan in de uitoefening
      van een bedrijf.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.16
  - number: 9.16.2
    text: |-
      Bij algemene maatregel van bestuur kunnen andere diersoorten worden aangewezen dan die, genoemd in het eerste lid,
      die anders dan in de uitoefening van een bedrijf worden gehouden, waarvoor met ingang van een datum die is gelegen
      na het tijdstip van inwerkingtreding van die maatregel, de diergezondheidsheffing wordt geheven met dien verstande
      dat, ingeval de betrokken heffing wordt ingevoerd gedurende het kalenderjaar, de heffing in dat kalenderjaar wordt
      geheven over het nog niet verstreken deel van dat jaar.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.16
  - number: 9.16.3
    text: |-
      De diergezondheidsheffing wordt, in afwijking van het eerste en tweede lid, niet geheven voor bij algemene
      maatregel van bestuur aangewezen diersoorten indien het aantal dieren dat van die diersoort wordt gehouden niet
      meer bedraagt dan een in die maatregel voor die diersoort bepaald aantal.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.16
  - number: 9.16.4
    text: |-
      De diergezondheidsheffing wordt niet geheven ter zake van het houden van dieren die zich bevinden in een
      verzamelcentrum, een slachthuis of een vervoermiddel.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.16
  - number: '9.17'
    text: 'De diergezondheidsheffing wordt geheven:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.17
  - number: 9.17.a
    text: |-
      voor het houden van dieren in de uitoefening van een bedrijf: van de natuurlijke persoon of rechtspersoon die, of
      het samenwerkingsverband van natuurlijke personen of rechtspersonen dat, een bedrijf voert waar de dieren gehouden
      worden;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.17
  - number: 9.17.b
    text: |-
      voor het houden van dieren anders dan in de uitoefening van een bedrijf: van de natuurlijke persoon of
      rechtspersoon die, of het samenwerkingsverband van natuurlijke personen of rechtspersonen dat de dieren houdt.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.17
  - number: 9.18.1
    text: |-
      De diergezondheidsheffing voor het houden van dieren wordt geheven naar het aantal dieren van een diersoort of
      diercategorie dat in een kalenderjaar wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.18
  - number: 9.18.2
    text: |-
      Bij ministeriële regeling worden regels gesteld voor de berekeningswijze van het aantal dieren, bedoeld in het
      eerste lid, welke regels per diersoort of diercategorie kunnen verschillen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.18
  - number: 9.18.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop het aantal in een
      kalenderjaar gehouden dieren van een bepaalde diersoort of diercategorie wordt bepaald, indien voor die diersoort
      of diercategorie in onvoldoende mate gegevens over het aantal gehouden dieren in een kalenderjaar voorhanden zijn
      om dat aantal op die basis met voldoende zekerheid te kunnen berekenen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.18
  - number: 9.18.4
    text: |-
      In afwijking van het eerste lid wordt de diergezondheidsheffing voor het houden van kippen, kalkoenen, eenden of
      dieren behorend tot een andere krachtens [artikel 9.15, tweede lid][ref1], aangewezen soort gevogelte geheven naar
      het aantal dieren dat aan het begin van de periode waarin zij worden gehouden in een tot het bedrijf behorende stal
      of ruimte wordt binnengebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.18
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 9.19.1
    text: 'De diergezondheidsheffing wordt geheven ter zake van het in de uitoefening van een bedrijf:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.19
  - number: 9.19.1.a
    text: inleggen van broedeieren van kippen, kalkoenen of eenden in een broedmachine;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.19
  - number: 9.19.1.b
    text: produceren van vaccinbroedeieren van kippen, kalkoenen of eenden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.19
  - number: 9.19.2
    text: |-
      De diergezondheidsheffing kan worden geheven ter zake van het in de uitoefening van een bedrijf verhandelen,
      vervoeren of slachten van dieren, het produceren, bewerken, vervoeren of verhandelen van dierlijke producten,
      anders dan de handelingen, genoemd in het eerste lid, of het bereiden van diervoeder in een kalenderjaar, welke
      heffingen dienen ter bestrijding van de kosten, bedoeld in [artikel 9.14, onderdelen a tot en met g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.19
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 9.19.3
    text: |-
      Bij algemene maatregel van bestuur kan een handeling, genoemd in het tweede lid, worden aangewezen waarvoor de
      diergezondheidsheffing wordt geheven met ingang van een datum die is gelegen na het tijdstip van inwerkingtreding
      van de desbetreffende maatregel met dien verstande dat, ingeval de betrokken heffing wordt ingevoerd gedurende het
      kalenderjaar, de heffing in dat kalenderjaar wordt geheven over het nog niet verstreken deel van dat jaar.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.19
  - number: 9.19.4
    text: |-
      Bij de maatregel, bedoeld in het derde lid, wordt voor een aangewezen handeling tevens de heffingsgrondslag
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.19
  - number: '9.20'
    text: |-
      De in [artikel 9.19, eerste en tweede lid][ref1], bedoelde heffingen worden geheven van de natuurlijke personen of
      rechtspersonen dan wel samenwerkingsverbanden van natuurlijke personen of rechtspersonen die de krachtens artikel
      9.19, eerste of tweede lid, aangewezen handelingen verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.20
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 9.21.1
    text: |-
      De diergezondheidsheffing voor het inleggen van broedeieren wordt geheven naar het aantal broedeieren dat in een
      kalenderjaar in een broedmachine wordt ingelegd.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.21
  - number: 9.21.2
    text: |-
      De diergezondheidsheffing voor het produceren van vaccinbroedeieren wordt geheven naar het aantal vaccinbroedeieren
      dat in een kalenderjaar in een broedmachine wordt ingelegd.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.21
  - number: 9.21.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor de berekeningswijze van het aantal ingelegde eieren,
      bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.21
  - number: 9.22.1
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald tot welk bedrag de uitgaven van het Diergezondheidsfonds die, in
      een bij die maatregel te bepalen periode van vijf kalenderjaren, zijn gedaan ten behoeve van een bepaalde diersoort
      of combinatie van diersoorten ten hoogste door middel van heffingen worden opgebracht.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.22
  - number: 9.22.2
    text: |-
      De vaststelling voor de eerste maal van een algemene maatregel van bestuur als bedoeld in het eerste lid heeft
      betrekking op de periode 1 januari 2020 tot en met 31 december 2024.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.22
  - number: 9.23.1
    text: |-
      Onverminderd [artikel 9.22][ref1] en het derde lid wordt een tarief voor het houden van een diersoort of
      diercategorie vastgesteld op basis van:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.23
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 9.23.1.a
    text: |-
      een raming van de uitgaven, bedoeld in [artikel 9.14][ref1] voor de desbetreffende diersoort of diercategorie, in
      het kalenderjaar of deel van het kalenderjaar waarvoor het tarief wordt vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.23
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 9.23.1.b
    text: de benodigde middelen om in het Diergezondheidsfonds een reserve aan te houden;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.23
  - number: 9.23.1.c
    text: |-
      uitgaven van het Diergezondheidsfonds, voor zover die uitgaven niet gedekt zijn door de opbrengsten van de
      diergezondheidsheffing, bedoeld in [artikel 9.3, eerste lid, onderdeel a][ref1], in het tweede tot en met zesde
      kalenderjaar voorafgaand aan het jaar waarvoor het tarief voor het houden van een diersoort of diercategorie wordt
      vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.23
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.23.1.d
    text: |-
      het vastgestelde overschot of tekort bij de definitieve vaststelling van door de Europese Unie beschikbaar gestelde
      middelen ten opzichte van de door de Europese Unie voorlopig beschikbaar gestelde middelen voor de desbetreffende
      diersoort of diercategorie;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.23
  - number: 9.23.1.e
    text: een schatting van het aantal dieren of andere eenheden dat de grondslag vormt voor de heffing.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.23
  - number: 9.23.2
    text: 'Voor de toepassing van het eerste lid, onderdelen c en d:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.23
  - number: 9.23.2.a
    text: |-
      wordt bij de heffing ten behoeve van de uitgaven, gedaan in een bepaalde periode, het voor die periode bepaalde
      bedrag, bedoeld in [artikel 9.22][ref1], toegepast, ook als die heffingen niet in die periode worden geheven;


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.23
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 9.23.2.b
    text: |-
      worden uitsluitend de overschotten en tekorten uit de in het eerste lid, onderdeel c, bedoelde periode, die niet
      bij een eerdere tariefvaststelling waren betrokken, meegerekend.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.23
  - number: 9.23.3
    text: |-
      De omvang van de in het eerste lid, onderdeel b, bedoelde reserve wordt bij algemene maatregel van bestuur bepaald
      en bedraagt voor elke krachtens [artikel 9.22][ref1] bepaalde periode ten hoogste 40 procent van het krachtens
      het eerste lid van dat artikel voor de desbetreffende periode en de desbetreffende diersoort of combinatie van
      diersoorten bepaalde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.23
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 9.23.4
    text: |-
      De uitgaven bedoeld in het eerste lid, onderdeel c, worden zo spoedig mogelijk en gedurende ten hoogste acht
      kalenderjaren in de tarieven verwerkt.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.23
  - number: 9.23.5
    text: |-
      Bij de vaststelling van een tarief ten behoeve van de invoering van de diergezondheidsheffing voor een andere
      diersoort als bedoeld in de [artikel 9.15, tweede lid][ref1], en [artikel 9.16, tweede lid][ref2], dan wel een
      andere handeling of een ander dierlijk product als bedoeld in [artikel 9.19, derde lid][ref3], en bij de wijziging
      van een dergelijk tarief, worden bij de toepassing van het eerste lid, onderdeel c, slechts de uitgaven in
      aanmerking genomen die zijn gedaan na de datum van de invoering van de desbetreffende heffing.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.23
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 9.23.6
    text: |-
      In afwijking van het eerste lid, onderdeel c, worden alleen uitgaven van het Diergezondheidsfonds,
      die zijn gedaan na 1 januari 2015, en voor zover die niet gedekt zijn door ontvangsten als bedoeld in
      [artikel 9.3, eerste lid, onderdeel a][ref1], in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.23
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.24.1
    text: |-
      De tarieven voor de in [artikel 9.19, eerste lid][ref1], bedoelde handelingen worden vastgesteld met toepassing
      van [artikel 9.23][ref2], met dien verstande dat deze tarieven worden berekend op basis van de uitgaven voor en de
      opbrengsten van de diergezondheidsheffing voor onderscheidenlijk de diersoorten kippen, kalkoenen en eenden.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.24
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 9.24.2
    text: |-
      De tarieven voor de in [artikel 9.19, tweede lid][ref1], bedoelde handelingen worden vastgesteld met
      overeenkomstige toepassing van [artikel 9.23][ref2], met dien verstande dat deze tarieven voor de onderscheiden
      handelingen worden berekend op basis van de uitgaven voor de bestrijding en de wering van besmettelijke
      dierziekten en de opbrengsten van de diergezondheidsheffing ten behoeve van de diersoort of diercategorie waar de
      desbetreffende handeling betrekking op heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.24
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 9.25.1
    text: De tarieven voor de diergezondheidsheffing worden bij algemene maatregel van bestuur vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.25
  - number: 9.25.2
    text: De in het eerste lid bedoelde tarieven worden per kalenderjaar vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.25
  - number: 9.25.3
    text: |-
      De bekendmaking van de tarieven geschiedt uiterlijk 31 december voorafgaand aan het kalenderjaar waarvoor de
      tarieven worden vastgesteld door publicatie van de in het eerste lid bedoelde maatregel in het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.25
  - number: 9.25.4
    text: |-
      Indien niet uiterlijk op het in het derde lid bedoelde tijdstip een nieuw tarief voor een diersoort, een
      diercategorie, een product of een handeling is bekendgemaakt, blijft het tarief zoals dat gold op dat tijdstip,
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.25
  - number: 9.25.5
    text: |-
      Het tweede en derde lid zijn niet van toepassing bij de invoering van een heffing gedurende een kalenderjaar op
      grond van de [artikelen 9.15, tweede lid][ref1], [9.16, tweede lid][ref2], of [9.19, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.25
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 9.25.6
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid wordt niet vastgesteld dan nadat overleg is
      gepleegd met belangenorganisaties van natuurlijke personen of rechtspersonen dan wel samenwerkingsverbanden van
      natuurlijke personen of rechtspersonen waarvan de diergezondheidsheffing wordt geheven.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.25
  - number: 9.26.1
    text: De diergezondheidsheffing wordt door Onze Minister per kalenderjaar geheven.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.26
  - number: 9.26.2
    text: |-
      Onze Minister kan een voorlopige diergezondheidsheffing opleggen tot ten hoogste het bedrag waarop de
      diergezondheidsheffing vermoedelijk zal worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.26
  - number: 9.26.3
    text: De voorlopige diergezondheidsheffing wordt verrekend met de diergezondheidsheffing.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.26
  - number: 9.26.4
    text: De diergezondheidsheffing en de voorlopige diergezondheidsheffing kunnen bij dwangbevel worden ingevorderd.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.26
  - number: 9.26.5
    text: |-
      Onze Minister kan regels stellen, op grond waarvan een natuurlijke persoon of rechtspersoon, dan wel een
      samenwerkingsverband van natuurlijke personen of rechtspersonen
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.26
  - number: 9.26.5.a
    text: |-
      op de daarbij vastgestelde wijze en binnen de daarbij vastgestelde termijn de gegevens en bescheiden verstrekt die
      voor de vaststelling van de diergezondheidsheffing van belang kunnen zijn, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.26
  - number: 9.26.5.b
    text: |-
      op verzoek van Onze Minister nadere gegevens en bescheiden verstrekt ten behoeve van de vaststelling van de
      diergezondheidsheffing.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.26
  - number: 9.26.6
    text: |-
      In afwijking van het eerste lid wordt de diergezondheidsheffing, in geval van toepassing van
      [artikel 9.18, vierde lid][ref1], geheven over elke periode dat kippen, kalkoenen, eenden of dieren behorend tot
      een andere krachtens [artikel 9.15, tweede lid][ref2], aangewezen soort gevogelte in een stal of ruimte worden
      gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.26
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: '9.27'
    text: |-
      Na het tot stand komen van een krachtens de [artikelen 9.15, tweede lid][ref1], [9.16, tweede lid][ref2], of
      [9.19, derde lid][ref3], vastgestelde algemene maatregel van bestuur wordt zo spoedig mogelijk maar uiterlijk
      binnen acht weken een voorstel van wet tot goedkeuring van de algemene maatregel van bestuur aan de Tweede
      Kamer der Staten-Generaal gezonden. Indien het voorstel wordt ingetrokken of indien een van de kamers van de
      Staten-Generaal tot niet-aannemen van het voorstel besluit, wordt de algemene maatregel van bestuur onverwijld
      ingetrokken, met ingang van het tijdstip waarop de maatregel in werking trad en worden de gevolgen van die
      inwerkingtreding ongedaan gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.27
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: '9.28'
    text: |-
      De tarieven voor de diergezondheidsheffing voor de jaren 2018 en 2019 voor de diersoorten runderen, varkens,
      kippen, kalkoenen, eenden, schapen en geiten worden, zo nodig in afwijking van [artikel 9.23][ref1], zodanig
      vastgesteld dat de totale opbrengst van de diergezondheidsheffing en de bijdragen van de sectorpartijen, bedoeld
      in artikel 2 van het Convenant financiering bestrijding besmettelijke dierziekten 2015–2019 (Stcrt. 2015, 13794),
      gerekend over de jaren 2015 tot en met 2019, niet meer bedraagt dan:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.28
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 9.28.a
    text: 'voor runderen: € 23.540.000;'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.28
  - number: 9.28.b
    text: |-
      voor varkens: € 53.447.000, waarvan ten hoogste € 30.000.000 ten behoeve van de bewaking en bestrijding van
      Afrikaanse varkenspest, en Swine Vesicular Disease;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.28
  - number: 9.28.c
    text: |-
      voor kippen, kalkoenen en eenden: € 47.138.000, waarvan ten hoogste € 2.113.000 ten behoeve van de bewaking en
      bestrijding van Newcastle Disease;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.28
  - number: 9.28.d
    text: 'voor schapen en geiten: € 5.074.000.'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.28
  - number: '9.29'
    text: |-
      Indien in de jaren 2015 tot en met 2019 ten laste van het Diergezondheidsfonds uitgaven worden gedaan die
      overeenkomstig [artikel 9.23][ref1] worden verwerkt in de tarieven die worden vastgesteld voor de jaren 2020
      en verder, blijven de in [artikel 9.28][ref2] genoemde bedragen van toepassing bij de vaststelling van de
      diergezondheidsheffing voor die uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel9
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel9.29
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: 10.1.1
    text: |-
      Onze Minister kan, in voorkomend geval met inachtneming van EU-rechtshandelingen en voor zover het belang van de
      gezondheid van de mens, dieren of planten, het belang van het welzijn van dieren of het belang van het milieu zich
      daartegen niet verzetten, van het bepaalde bij of krachtens deze wet vrijstelling of ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel10.1
  - number: 10.1.2
    text: |-
      Ingeval de vrijstelling of ontheffing betrekking heeft op een bepaling die geheel of mede strekt tot bescherming
      van de volksgezondheid, wordt zij in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport
      verleend.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel10.1
  - number: 10.1.3
    text: |-
      In afwijking van [artikel 7.1][ref1] zijn de [artikelen 7.3][ref2],
      [7.4, eerste lid, tweede lid, onderdeel a, en derde lid][ref3], [7.5, vierde lid][ref4],
      [7.6, eerste en tweede lid, onderdeel a][ref5], [7.8, eerste lid][ref6], en [7.9][ref7] niet van toepassing ten
      aanzien van het verlenen van een vrijstelling of ontheffing als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0030250#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0030250#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0030250#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
      - id: ref5
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
      - id: ref6
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
      - id: ref7
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 10.1.4
    text: |-
      Indien Onze Minister voornemens is een vrijstelling te verlenen van het bepaalde in [artikel 2.23][ref1], wordt
      het ontwerp van de vrijstelling in de Staatscourant bekend gemaakt en aan een ieder de gelegenheid geboden om
      binnen vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister
      te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp van de vrijstelling aan beide kamers der Staten-
      Generaal overgelegd en medegedeeld aan direct belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 10.1.5
    text: |-
      Een vrijstelling als bedoeld in het eerste lid kan, onverminderd de bevoegdheid van Onze Minister, bij algemene
      maatregel van bestuur worden verleend.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel10.1
  - number: 10.2.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot onderzoeken, controles,
      toezicht op de naleving en handhaving, waaronder:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel10.2
  - number: 10.2.1.a
    text: de wijze waarop het onderzoek plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel10.2
  - number: 10.2.1.b
    text: het aanwijzen van ambtenaren of personen die het onderzoek verrichten, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel10.2
  - number: 10.2.1.c
    text: de inrichtingen waar onderzoekswerkzaamheden plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel10.2
  - number: 10.2.2
    text: |-
      Bij algemene maatregel van bestuur kunnen voor de toepassing van [hoofdstuk 2, paragraaf 2][ref1], en
      [hoofdstuk 3][ref2] de [artikelen 8 tot en met 14 van de Landbouwkwaliteitswet][ref3] of onderdelen daarvan van
      overeenkomstige toepassing worden verklaard. De toepassing van [artikel 13 van de Landbouwkwaliteitswet][ref4] is
      onverminderd [artikel 18, tweede lid, van de Landbouwkwaliteitswet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0002755#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002755#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0002755#Artikel18
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0030250
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030250
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0002755
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002755
        artikel: '13'
      - id: ref5
        bwb_id: BWBR0002755
        artikel: '18'
  - number: 10.5.1
    text: |-
      Indien in het belang van de gezondheid van mens of dier of het welzijn van het dier naar het oordeel van Onze
      Minister een onverwijlde voorziening noodzakelijk is, kan hij in de onderwerpen die op grond van deze wet bij
      algemene maatregel van bestuur worden bepaald, bij regeling voorzien.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel10.5
  - number: 10.5.2
    text: |-
      De regeling vervalt een jaar nadat zij in werking is getreden, of, indien binnen die termijn een algemene maatregel
      van bestuur ter vervanging van die regeling in werking is getreden, op het moment waarop de maatregel in werking
      treedt. De termijn kan door Onze Minister eenmaal met ten hoogste een jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel10.5
  - number: 10.6.1
    text: |-
      Deze wet treedt niet in hetgeen bij of krachtens de [Wet op de dierproeven][ref1] is bepaald, met dien verstande
      dat onverminderd van kracht blijft hetgeen is bepaald bij of krachtens de [artikelen 2.2][ref2], [2.6][ref3] en
      [2.23][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003081
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0003081
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 10.6.2
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt het verrichten van dierproeven in de zin
      van de [Wet op de dierproeven][ref1], voor zover laatstgenoemde wet op deze handelingen van toepassing is, niet
      aangemerkt als het verrichten van diergeneeskundige handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003081
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0003081
  - number: '10.7'
    text: |-
      In hetgeen is voorzien bij of krachtens de [Visserijwet 1963][ref1], wordt niet voorzien krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002416
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0002416
  - number: 10.8.1
    text: |-
      Er is een Raad voor dierenaangelegenheden waarin overleg plaatsvindt over vraagstukken betreffende het nationaal en
      internationaal beleid op het gebied van de gezondheid van dieren en het welzijn van dieren.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel10.8
  - number: 10.8.2
    text: |-
      Onze Minister benoemt in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport de leden van de
      Raad.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel10.8
  - number: 10.8.3
    text: Bij algemene maatregel van bestuur worden regels gesteld over de samenstelling en de werkwijze van de Raad.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel10.8
  - number: '10.9'
    text: |-
      Een voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur als
      bedoeld in de [artikelen 2.18, eerste en tweede lid][ref1], [2.20, eerste en tweede lid][ref2], en
      [2.22, eerste en tweede lid][ref3], wordt Ons gedaan door Onze Minister in overeenstemming met Onze Minister van
      Volksgezondheid, Welzijn en Sport en na overleg met Onze Minister van Sociale Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel10.9
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
