      die, hoewel hij bij onherroepelijk geworden uitspraak geheel of gedeeltelijk is geschorst in het beroepsmatig
      verrichten van diergeneeskundige handelingen, tijdens die schorsing de handelingen waarop die schorsing betrekking
      heeft, uitoefent, of
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.13
  - number: 8.13.b
    text: |-
      die, hoewel hem bij onherroepelijk geworden uitspraak de hem bij of krachtens deze wet verleende bevoegdheid tot
      het beroepsmatig verrichten van diergeneeskundige handelingen geheel of gedeeltelijk is ontzegd, de handelingen
      waarop die ontzegging betrekking heeft, uitoefent.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.13
  - number: 8.14.1
    text: |-
      Met de opsporing van de bij [artikel 8.11][ref1] strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref2], belast de bij besluit van Onze Minister van Veiligheid en
      Justitie aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.14
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 8.14.2
    text: |-
      De ambtenaren, bedoeld in het eerste lid, zijn tevens belast met de opsporing van de feiten, strafbaar gesteld
      in de [artikelen 179 tot en met 182][ref1] en [184 van het Wetboek van Strafrecht][ref2], voor zover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.14
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '184'
  - number: 8.14.3
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.14
  - number: 8.15.1
    text: |-
      Bij het veterinair tuchtcollege kan een schriftelijke klacht worden ingediend tegen een dierenarts of een andere
      persoon die is toegelaten tot het beroepsmatig verrichten van diergeneeskundige handelingen, wegens het in strijd
      handelen met [artikel 4.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.15
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
        hoofdstuk: '4'
  - number: 8.15.2
    text: 'Een klacht als bedoeld in het eerste lid, kan worden ingediend door:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.15
  - number: 8.15.2.a
    text: degene die als gevolg van het handelen, bedoeld in het eerste lid, rechtstreeks in zijn belang is getroffen, of
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.15
  - number: 8.15.2.b
    text: een ambtenaar, aangewezen door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.15
  - number: 8.16.1
    text: Het veterinair tuchtcollege is gevestigd in Den Haag.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.16
  - number: 8.16.2
    text: |-
      Het veterinair tuchtcollege is belast met de behandeling in eerste aanleg van zaken over het handelen in strijd
      met [artikel 4.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.16
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
        hoofdstuk: '4'
  - number: 8.16.3
    text: 'Het veterinair tuchtcollege bestaat uit de volgende leden:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.16
  - number: 8.16.3.a
    text: een rechtsgeleerde die voorzitter is;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.16
  - number: 8.16.3.b
    text: vier praktiserende dierenartsen, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.16
  - number: 8.16.3.c
    text: |-
      een door Onze Ministers te bepalen aantal andere personen als bedoeld in [artikel 4.1, eerste lid][ref1], dat op
      grond van dat artikellid zijn toegelaten tot het beroepsmatig verrichten van diergeneeskundige handelingen en als
      zodanig werkzaam zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.16
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
        hoofdstuk: '4'
  - number: 8.16.4
    text: |-
      Het veterinair tuchtcollege heeft een secretaris en zo nodig een plaatsvervangend secretaris, die rechtsgeleerden
      zijn.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.16
  - number: 8.16.5
    text: |-
      De rechtsgeleerde leden van het veterinair tuchtcollege, de secretaris en diens plaatsvervanger, voldoen aan
      [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.16
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '5'
  - number: 8.17.1
    text: |-
      De voorzitter en de overige leden van het veterinair tuchtcollege, alsmede voor elk van hen een of meer
      plaatsvervangers, worden voor de tijd van zes jaren door Onze Ministers benoemd. Zij zijn bij hun aftreden
      herbenoembaar. Op eigen verzoek kunnen zij door Onze Ministers worden ontslagen. De benoemingstermijn van
      degene die wordt benoemd ter vervulling van een tussentijdse vacature, eindigt bij het verstrijken van de
      benoemingstermijn van degene in wiens plaats hij is getreden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.17
  - number: 8.17.2
    text: |-
      Voor de plaatsvervangers, bedoeld in het eerste lid, gelden dezelfde vereisten van benoembaarheid als voor de leden
      die zij vervangen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.17
  - number: 8.17.3
    text: |-
      Onze Ministers verlenen aan de leden en hun plaatsvervangers ontslag met ingang van de maand, volgend op die waarin
      de betrokkenen de leeftijd van zeventig jaren hebben bereikt. Zij verlenen aan de leden en hun plaatsvervangers
      eveneens ontslag bij verlies van een vereiste voor hun benoembaarheid.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.17
  - number: 8.17.4
    text: De secretaris en de plaatsvervangend secretaris worden door Onze Ministers benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.17
  - number: 8.18.1
    text: |-
      Tussen de leden, de plaatsvervangende leden, de secretaris en de plaatsvervangend secretaris van het veterinair
      tuchtcollege mag niet bestaan de verhouding van echtgenoten, geregistreerde partners, bloed- en aanverwanten
      tot de derde graad ingesloten, een vennootschap of ander duurzaam samenwerkingsverband tot het uitoefenen van de
      diergeneeskunde of de verhouding van werkgever tot werknemer.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.18
  - number: 8.18.2
    text: |-
      Indien het huwelijk of het geregistreerd partnerschap eerst mocht worden aangegaan na de benoeming, zal de
      jongstbenoemde der echtgenoten of geregistreerde partners zijn ambt niet kunnen behouden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.18
  - number: 8.18.3
    text: |-
      Indien de aanverwantschap eerst mocht zijn ontstaan na de benoeming, zal degene, die haar veroorzaakte, zijn ambt
      niet kunnen behouden, behoudens door Onze Ministers te verlenen vergunning.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.18
  - number: '8.19'
    text: |-
      De [artikelen 46c, onderdelen b en c][ref1], [46ca, eerste lid, onderdeel d][ref2],
      [46d, tweede lid][ref3], [46f][ref4], [46i met uitzondering van het eerste lid, onderdeel c][ref5],
      [46j][ref6], [46l, eerste lid, onderdeel a, en derde lid][ref7], [46m][ref8], [46o][ref9] en
      [46p van de Wet rechtspositie rechterlijke ambtenaren][ref10] voor de leden van de rechterlijke macht zijn van
      overeenkomstige toepassing ten aanzien van de leden van het college en hun plaatsvervangers.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46ca
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
      [ref9]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
      [ref10]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.19
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46ca
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46d
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46f
      - id: ref5
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref6
        bwb_id: BWBR0008365
        artikel: 46j
      - id: ref7
        bwb_id: BWBR0008365
        artikel: 46l
      - id: ref8
        bwb_id: BWBR0008365
        artikel: 46m
      - id: ref9
        bwb_id: BWBR0008365
        artikel: 46o
      - id: ref10
        bwb_id: BWBR0008365
        artikel: 46p
  - number: 8.20.1
    text: |-
      De voorzitter van het veterinair tuchtcollege is bevoegd ambtshalve aan de leden en hun plaatsvervangers, die
      de waardigheid van hun ambt, hun ambtsbezigheden of ambtsplichten verwaarlozen of die zich schuldig maken aan
      overtreding van [artikel 8.21][ref1], de nodige waarschuwing te doen, na hen in de gelegenheid te hebben gesteld om
      te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.20
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: 8.20.2
    text: |-
      De voorzitter van het veterinair beroepscollege, bedoeld in [artikel 8.36][ref1], heeft gelijke bevoegdheid ten
      aanzien van de voorzitter van het veterinair tuchtcollege en diens plaatsvervangers.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.20
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: 8.21.1
    text: |-
      Leden van het veterinair tuchtcollege en hun plaatsvervangers laten zich op geen enkele wijze uit over enige
      aangelegenheid, welke door hen behandeld wordt of waarvan zij weten of vermoeden dat deze door hen behandeld zal
      worden, in enig bijzonder onderhoud of gesprek met partijen of hun raadslieden of gemachtigden, noch nemen daarover
      enige bijzondere inlichting of schriftelijk stuk aan.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.21
  - number: 8.21.2
    text: |-
      Het is leden van het veterinair tuchtcollege en hun plaatsvervangers verboden hetgeen zij als zodanig te weten
      zijn gekomen verder bekend te maken dan voor de uitoefening van hun functie gevorderd wordt. De verplichting tot
      geheimhouding geldt niet tegenover ambtenaren van politie of justitie, voor zover mededeling aan hen op grond van
      een wettelijk voorschrift is vereist.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.21
  - number: 8.21.3
    text: |-
      De leden van het veterinair tuchtcollege en hun plaatsvervangers bewaren het geheim omtrent de gevoelens die in de
      raadkamer over aanhangige zaken zijn geuit.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.21
  - number: 8.21.4
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing op de secretaris van het veterinair tuchtcollege en
      zijn plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.21
  - number: 8.22.1
    text: |-
      De voorzitter en de leden van het veterinair tuchtcollege en hun plaatsvervangers ontvangen vacatiegeld, alsmede
      een vergoeding van reis- en verblijfkosten en van verdere onkosten.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.22
  - number: 8.22.2
    text: Bij ministeriële regeling worden regels gesteld ten aanzien van de vergoedingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.22
  - number: 8.23.1
    text: |-
      Zodra een klacht is ingediend, stelt de voorzitter van het veterinair tuchtcollege een voorlopig onderzoek in. De
      ambtenaar, bedoeld in [artikel 8.15, tweede lid, onderdeel b][ref1], verleent daarbij desgevraagd medewerking.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.23
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: 8.23.2
    text: |-
      Het intrekken van een klacht of de staking van de werkzaamheden door de persoon over wie geklaagd is, heeft geen
      invloed op de behandeling van de klacht indien:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.23
  - number: 8.23.2.a
    text: |-
      het algemeen belang dit vordert naar het oordeel van de ambtenaar, bedoeld in
      [artikel 8.15, tweede lid, onderdeel b][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.23
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: 8.23.2.b
    text: wanneer de persoon over wie geklaagd is, verklaart de voortzetting van de behandeling te verlangen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.23
  - number: 8.24.1
    text: |-
      Het veterinair tuchtcollege houdt zitting in een samenstelling bestaande uit vijf leden, te weten de voorzitter,
      alsmede:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.24
  - number: 8.24.1.a
    text: vier dierenartsen, indien de klacht gericht is tegen een dierenarts, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.24
  - number: 8.24.1.b
    text: |-
      twee dierenartsen en twee leden van dezelfde beroepsgroep als de beklaagde, indien de klacht is gericht tegen een
      andere persoon als bedoeld in [artikel 4.1, eerste lid][ref1], die op grond van dat artikellid is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.24
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
        hoofdstuk: '4'
  - number: 8.24.2
    text: |-
      De voorzitter kan bepalen dat het veterinair tuchtcollege bij een gezamenlijke behandeling van klachten als bedoeld
      in [artikel 8.28, eerste lid][ref1], zitting houdt in een van het eerste lid afwijkende samenstelling, onder de
      volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.24
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: 8.24.2.a
    text: het aantal leden dat zitting houdt bedraagt maximaal vijf, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.24
  - number: 8.24.2.b
    text: |-
      voor elk van de beroepsgroepen tot welke degenen over wie is geklaagd behoren, neemt ten minste een lid deel dat
      tot diezelfde groep behoort.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.24
  - number: 8.24.3
    text: |-
      Bij algemene maatregel van bestuur kan in afwijking van het eerste lid, aanhef en onderdeel b, of het tweede lid,
      worden bepaald dat bij ontstentenis van benoemde leden van dezelfde beroepsgroep als de beklaagde, dierenartsen
      zitting nemen in plaats van die leden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.24
  - number: 8.25.1
    text: |-
      De behandeling van een zaak door het veterinair tuchtcollege geschiedt in een openbare zitting, tenzij het
      veterinair tuchtcollege om gewichtige redenen beveelt dat de behandeling van de zaak geheel of gedeeltelijk met
      gesloten deuren zal plaatsvinden. Het bevel daartoe houdt de overwegingen in waarop het steunt.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.25
  - number: 8.25.2
    text: De beslissing in een door het veterinair tuchtcollege behandelde zaak wordt in het openbaar uitgesproken.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.25
  - number: 8.25.3
    text: |-
      Tijd en plaats van een openbare zitting of van een openbare uitspraak worden ten minste veertien dagen en ten
      hoogste een maand tevoren in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.25
  - number: 8.26.1
    text: |-
      Behoudens in de gevallen, bedoeld in [artikel 8.30, eerste lid][ref1], neemt het veterinair tuchtcollege geen
      beslissing aangaande een ingediende klacht dan na verhoor, althans behoorlijke oproeping van de persoon over wie
      geklaagd is en van de klager.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.26
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: 8.26.2
    text: |-
      De persoon over wie geklaagd is kan, tenzij het veterinair tuchtcollege beveelt dat hij in persoon zal verschijnen,
      zich tijdens de zitting doen vertegenwoordigen door een daartoe gemachtigde. Hij kan zich door een raadsman doen
      bijstaan.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.26
  - number: 8.26.3
    text: |-
      Het veterinair tuchtcollege kan weigeren bepaalde personen die geen advocaat zijn, als gemachtigde of als raadsman
      toe te laten. Bij zodanige weigering houdt het veterinair tuchtcollege de zaak tot een volgende zitting aan.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.26
  - number: 8.26.4
    text: |-
      De persoon over wie geklaagd is en zijn raadsman worden in de gelegenheid gesteld ten minste veertien dagen
      voorafgaand aan de aanvang van het onderzoek tijdens de zitting, van de processtukken kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.26
  - number: 8.27.1
    text: |-
      Het veterinair tuchtcollege kan getuigen en deskundigen oproepen en horen op verzoek van de persoon over wie
      geklaagd is, op verzoek van de klager of ambtshalve. De oproeping geschiedt bij aangetekende brief. Het is degene
      die als getuige of deskundige is opgeroepen verboden geen gevolg te geven aan de oproeping.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.27
  - number: 8.27.2
    text: |-
      Indien een getuige of een deskundige niet verschijnt op de oproeping, doet de officier van justitie bij het
      arrondissementsparket Den Haag op verzoek van het veterinair tuchtcollege hem dagvaarden. Het is een getuige of
      deskundige verboden niet te verschijnen na dagvaarding.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.27
  - number: 8.27.3
    text: |-
      Indien een getuige of een deskundige niet verschijnt op de dagvaarding, bedoeld in het tweede lid, doet de officier
      van justitie bij de rechtbank te Den Haag op verzoek van het veterinair tuchtcollege hem nogmaals dagvaarden met,
      voor zover verzocht door het veterinair tuchtcollege, bevel tot medebrenging.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.27
  - number: 8.27.4
    text: |-
      [Artikel 6:1:5 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.27
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: 8.27.5
    text: |-
      Ten aanzien van getuigen en deskundigen zijn de
      [artikelen 217 tot en met 219 van het Wetboek van Strafvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.27
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
  - number: 8.27.6
    text: |-
      De getuigen en deskundigen ontvangen indien zij dit verkiezen op vertoon van hun oproeping of dagvaarding een
      vergoeding overeenkomstig het bepaalde bij of krachtens de [Wet tarieven in strafzaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.27
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: 8.28.1
    text: |-
      De voorzitter van het veterinair tuchtcollege kan ten aanzien van twee of meer met elkaar samenhangende klachten
      bepalen dat deze ter terechtzitting gezamenlijk worden behandeld.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.28
  - number: 8.28.2
    text: |-
      Een gezamenlijke behandeling van klachten als bedoeld in het eerste lid vindt niet plaats ingeval de klachten zijn
      gericht tegen drie of meer andere personen als bedoeld in [artikel 4.1, eerste lid][ref1], die op grond van dat
      artikellid zijn toegelaten, voor zover drie of meer van die personen tot verschillende beroepsgroepen behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.28
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
        hoofdstuk: '4'
  - number: 8.28.3
    text: De voorzitter van het veterinair tuchtcollege kan bepalen de behandeling van gevoegde zaken te splitsen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.28
  - number: 8.29.1
    text: |-
      Leden van het veterinair tuchtcollege en hun plaatsvervangers kunnen zich verschonen en kunnen worden
      gewraakt, indien ten aanzien van hen feiten of omstandigheden bestaan waardoor in het algemeen de rechterlijke
      onpartijdigheid schade zou kunnen lijden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.29
  - number: 8.29.2
    text: |-
      Over wraking of verschoning wordt zo spoedig mogelijk beslist door hen die deel uitmaken van het veterinair
      tuchtcollege, met uitzondering van degene die wordt gewraakt of die zich wil verschonen. Bij staking van stemmen
      wordt de wraking onderscheidenlijk de verschoning toegewezen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.29
  - number: 8.30.1
    text: |-
      Het veterinair tuchtcollege kan naar aanleiding van het voorlopig onderzoek, bedoeld in
      [artikel 8.23, eerste lid][ref1], beslissen om, zonder nader onderzoek:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.30
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: 8.30.1.a
    text: |-
      de klager niet-ontvankelijk te verklaren, indien [artikel 8.15, tweede lid, onderdeel a][ref1], niet op hem van
      toepassing is, of


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.30
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: 8.30.1.b
    text: |-
      de klacht af te wijzen, indien deze kennelijk ongegrond is omdat de feiten waarop de klacht berust geen betrekking
      hebben op het handelen in strijd met [artikel 4.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.30
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
        hoofdstuk: '4'
  - number: 8.30.2
    text: |-
      Het veterinair tuchtcollege neemt in andere gevallen dan die, bedoeld in het eerste lid, een van de volgende
      beslissingen:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.30
  - number: 8.30.2.a
    text: het ongegrond verklaren van de klacht, of
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.30
  - number: 8.30.2.b
    text: |-
      het geheel of gedeeltelijk gegrond verklaren van de klacht, al dan niet onder oplegging van een maatregel als
      bedoeld in [artikel 8.31, eerste lid][ref1], aan degene op wie de klacht betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.30
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: 8.31.1
    text: |-
      De maatregelen, bedoeld in [artikel 8.30, tweede lid][ref1], onderdeel b, zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.31
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: 8.31.1.a
    text: een waarschuwing;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.31
  - number: 8.31.1.b
    text: een berisping;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.31
  - number: 8.31.1.c
    text: |-
      een geldboete van de derde categorie als bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.31
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 8.31.1.d
    text: |-
      een geldboete van de vierde categorie als bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1],
      indien de waarde van de goederen, met betrekking tot welke een overtreding is begaan, of de waarde van het
      wederrechtelijk genoten voordeel dat geheel of gedeeltelijk door middel van de overtreding is verkregen, hoger is
      dan het vierde gedeelte van het maximumbedrag van de geldboete dat op grond van onderdeel c, kan worden opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.31
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 8.31.1.e
    text: |-
      een gehele of gedeeltelijke schorsing voor ten hoogste een jaar, van de bij of krachtens deze wet verleende
      bevoegdheid tot het beroepsmatig verrichten van diergeneeskundige handelingen, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.31
  - number: 8.31.1.f
    text: |-
      een gehele of gedeeltelijke ontzegging van de bij of krachtens deze wet verleende bevoegdheid tot het beroepsmatig
      verrichten van diergeneeskundige handelingen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.31
  - number: 8.31.2
    text: |-
      De maatregelen, bedoeld in het eerste lid, onderdelen c en d, kunnen gelijktijdig worden opgelegd met een van de
      maatregelen, bedoeld in het eerste lid, onderdelen e of f.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.31
  - number: 8.31.3
    text: |-
      Een beslissing waarbij de maatregel, bedoeld in het eerste lid, onderdeel f, is opgelegd, wordt bekendgemaakt in
      de Staatscourant en aan in de beslissing aangewezen tijdschriften of nieuwsbladen ter bekendmaking aangeboden, al
      dan niet met weglating van de namen of de woonplaatsen van de daarin genoemde personen, alsmede van andere gegevens
      welke aanwijzingen omtrent die personen bevatten.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.31
  - number: 8.31.4
    text: |-
      Bij oplegging van de maatregelen, bedoeld in het eerste lid, onderdelen a tot en met e, kan worden bevolen dat de
      beslissing overeenkomstig het derde lid wordt bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.31
  - number: 8.31.5
    text: Maatregelen, bedoeld in het eerste lid, onderdelen c, d of e, kunnen voorwaardelijk worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.31
  - number: 8.31.6
    text: |-
      Bij toepassing van het vijfde lid worden de maatregelen geheel of gedeeltelijk niet ten uitvoer gelegd onder
      de voorwaarde dat de betrokkene zich binnen een daartoe vastgestelde proeftijd van ten hoogste drie jaren, niet
      schuldig maakt aan handelingen in strijd met [artikel 4.2][ref1], dan wel in strijd met een bijzondere voorwaarde
      die aan de voorwaardelijke oplegging van de maatregel is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.31
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
        hoofdstuk: '4'
  - number: 8.31.7
    text: |-
      Een bijzondere voorwaarde als bedoeld in het zesde lid kan zijn dat de betrokkene de door zijn gedraging
      veroorzaakte schade, voor zover die niet meer bedraagt dan € 5 000,-, geheel of gedeeltelijk binnen een daarbij te
      stellen termijn, korter dan de proeftijd, vergoedt.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.31
  - number: 8.31.8
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de tenuitvoerlegging van de maatregelen,
      bedoeld in het eerste lid, en de uitvoering van de bevelen, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.31
  - number: 8.31.9
    text: |-
      De geldboete, bedoeld in het eerste lid, onderdelen c en d, komt ten bate van de Staat. Degene aan wie een boete
      is opgelegd, wordt door een door Onze Minister aan te wijzen ambtenaar bij gedagtekende brief uitgenodigd de
      verschuldigde geldboete te betalen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.31
  - number: 8.31.10
    text: |-
      Indien de schuldenaar in gebreke blijft, kan de invordering van de verschuldigde geldboete bij dwangbevel
      geschieden door de ambtenaar, bedoeld in het negende lid.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.31
  - number: '8.32'
    text: |-
      Een maatregel als bedoeld in [artikel 8.31, eerste lid][ref1], wordt niet opgelegd indien dit door het veterinair
      tuchtcollege raadzaam wordt geacht in verband met de geringe ernst van het feit, de persoon van de dader of de
      omstandigheden waaronder het feit is begaan, dan wel omstandigheden die zich nadien hebben voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.32
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: 8.33.1
    text: |-
      De beslissing van het veterinair tuchtcollege over een ingediende klacht houdt de overweging in waarop zij steunt
      en wordt op schrift gesteld.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.33
  - number: 8.33.2
    text: |-
      Van de beslissing, bedoeld in het eerste lid, wordt door de secretaris van het veterinair tuchtcollege onverwijld
      een afschrift gezonden:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.33
  - number: 8.33.2.a
    text: aan de persoon over wie geklaagd is;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.33
  - number: 8.33.2.b
    text: aan de klager, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.33
  - number: 8.33.2.c
    text: |-
      aan de ambtenaar, bedoeld in [artikel 8.15, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.33
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: 8.33.3
    text: |-
      De secretaris van het veterinair tuchtcollege verstrekt desgevraagd aan de gerechten en het openbaar ministerie
      inlichtingen omtrent onherroepelijke beslissingen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.33
  - number: '8.34'
    text: |-
      Beslissingen van het veterinair tuchtcollege, genomen met een ander aantal personen of in een andere samenstelling,
      dan bij of krachtens deze wet is voorgeschreven, zijn nietig.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.34
  - number: 8.35.1
    text: |-
      Bij het veterinair beroepscollege kan beroep worden ingesteld tegen een beslissing van het veterinair tuchtcollege
      op een ingediende klacht, binnen twee maanden na de dag van verzending van de aangetekende brief, bedoeld in
      [artikel 8.33, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.35
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: 8.35.2
    text: 'Beroep als bedoeld in het eerste lid, kan worden ingesteld door:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.35
  - number: 8.35.2.a
    text: de persoon over wie geklaagd is, indien de klacht geheel of gedeeltelijk gegrond is verklaard;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.35
  - number: 8.35.2.b
    text: |-
      de klager, voor zover hij niet-ontvankelijk is verklaard, zijn klacht is afgewezen, of zijn klacht geheel of
      gedeeltelijk ongegrond is verklaard, of
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.35
  - number: 8.35.2.c
    text: |-
      de ambtenaar, bedoeld in [artikel 8.15, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.35
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: 8.35.3
    text: |-
      Het beroep wordt ingesteld bij een met redenen omkleed beroepschrift, tezamen met een gewaarmerkt afschrift van de
      beslissing waartegen het beroep gericht is. Het beroep schorst de beslissing.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.35
  - number: 8.35.4
    text: Het veterinair beroepscollege kan het veterinair tuchtcollege uitnodigen inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.35
  - number: 8.35.5
    text: |-
      Indien alleen de persoon over wie geklaagd is, beroep heeft ingesteld, kan het veterinair beroepscollege slechts
      met eenparigheid van stemmen een beslissing geven die een wijziging ten nadele van de persoon over wie geklaagd is,
      brengt in hetgeen door het veterinair tuchtcollege was beslist.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.35
  - number: 8.36.1
    text: Het veterinair beroepscollege is gevestigd in Den Haag.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.36
  - number: 8.36.2
    text: 'Het veterinair beroepscollege is belast met:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.36
  - number: 8.36.2.a
    text: |-
      de behandeling in beroep van zaken over handelen in strijd met [artikel 4.2][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.36
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
        hoofdstuk: '4'
  - number: 8.36.2.b
    text: het waken tegen nodeloze vertraging van het onderzoek door het veterinair tuchtcollege.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.36
  - number: 8.36.3
    text: 'Het veterinair beroepscollege bestaat uit de volgende leden:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.36
  - number: 8.36.3.a
    text: drie rechtsgeleerden waarvan één voorzitter is;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.36
  - number: 8.36.3.b
    text: twee praktiserende dierenartsen, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.36
  - number: 8.36.3.c
    text: |-
      een door Onze Ministers te bepalen aantal andere personen als bedoeld in [artikel 4.1, eerste lid][ref1], dat op
      grond van dat artikellid zijn toegelaten tot het beroepsmatig verrichten van diergeneeskundige handelingen en als
      zodanig werkzaam zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.36
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
        hoofdstuk: '4'
  - number: 8.36.4
    text: |-
      Het lidmaatschap van het veterinair beroepscollege is niet verenigbaar met het lidmaatschap van het veterinair
      tuchtcollege.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.36
  - number: 8.36.5
    text: |-
      De [artikelen 8.16, vierde en vijfde lid][ref1], [8.17][ref2], [8.18][ref3], [8.19][ref4],
      [8.20, eerste lid][ref5], [8.21][ref6] en [8.22][ref7] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.36
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
      - id: ref5
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
      - id: ref6
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
      - id: ref7
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: 8.37.1
    text: |-
      Het veterinair beroepscollege houdt zitting in een samenstelling bestaande uit vijf leden, te weten de drie
      rechtsgeleerden waaronder de voorzitter, alsmede:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.37
  - number: 8.37.1.a
    text: twee dierenartsen indien de klacht gericht is tegen een dierenarts, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.37
  - number: 8.37.1.b
    text: |-
      een dierenarts en een lid van dezelfde beroepsgroep als de beklaagde, indien de klacht is gericht tegen een andere
      persoon als bedoeld in [artikel 4.1, eerste lid][ref1], die op grond van dat artikellid is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.37
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
        hoofdstuk: '4'
  - number: 8.37.2
    text: |-
      Bij algemene maatregel van bestuur kan in afwijking van het eerste lid, aanhef en onderdeel b, worden bepaald
      dat bij ontstentenis van benoemde leden van dezelfde beroepsgroep als de beklaagde, dierenartsen zitting nemen in
      plaats van die leden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.37
  - number: 8.38.1
    text: |-
      De [artikelen 8.25][ref1], [8.26][ref2], [8.27][ref3], [8.28][ref4], [8.29][ref5] en [8.34][ref6] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.38
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
