        artikel: '4'
        hoofdstuk: '4'
  - number: 11.1.8
    text: |-
      [Artikel 5.13][ref1] is van overeenkomstige toepassing op dieren die in strijd met
      [artikel 73 van de Gezondheids- en welzijnswet voor dieren][ref2], zoals dat luidde bij inwerkingtreding van deze
      wet, zijn gefokt.


