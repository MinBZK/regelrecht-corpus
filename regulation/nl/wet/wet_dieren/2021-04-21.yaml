  - number: 6.4.2
    text: |-
      [Artikel 7.3, tweede lid][ref1], is van overeenkomstige toepassing ten aanzien van een ministeriële regeling als
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 6.5.1
    text: |-
      Een wijziging van een EU-rechtshandeling waarnaar in regels, gesteld krachtens deze wet, wordt verwezen, gaat voor
      de toepassing van die regels gelden met ingang van de dag waarop aan die wijziging uitvoering moet zijn gegeven dan
      wel bij gebreke daarvan, de dag waarop die wijziging is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel6.5
  - number: 6.5.2
    text: |-
      Onze Minister kan besluiten dat een wijziging als bedoeld in het eerste lid in afwijking van dat lid op een eerder
      tijdstip gaat gelden. Dit besluit wordt in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel6.5
  - number: '7.1'
    text: |-
      Dit hoofdstuk is van toepassing op besluiten die krachtens deze wet worden genomen. Bij de regels gesteld krachtens
      deze wet kan worden bepaald dat voor een handeling waarop die regels betrekking hebben een melding of een besluit
      tot verlening van een vergunning, erkenning, toestemming, toelating, registratie, bewijs van vakbekwaamheid,
      goedkeuring, vrijstelling, ontheffing, algemeen verbindend verklaring of certificering is vereist, kan worden
      verleend of kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.1
  - number: 7.2.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt voor de uitvoering van bindende onderdelen van EU-
      rechtshandelingen geregeld dat in een register aantekening wordt gehouden van een melding of een besluit als
      bedoeld in [artikel 7.1.][ref1] Bij ministeriële regeling kunnen nadere regels worden gesteld over het register, de
      aantekening alsmede de wijziging daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden geregeld dat in een register aantekening wordt gehouden
      van een melding of een besluit als bedoeld in [artikel 7.1.][ref1] Bij ministeriële regeling kunnen regels over
      registers worden gesteld die betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2.2.a
    text: |-
      de mate van toegankelijkheid van de registers, waaronder de wijze waarop kennis kan worden genomen van de in de
      registers opgenomen gegevens;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.2
  - number: 7.2.2.b
    text: het doel dat het register dient;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.2
  - number: 7.2.2.c
    text: de behoorlijke en zorgvuldige verwerking van de gegevens in de registers;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.2
  - number: 7.2.2.d
    text: de inrichting van de registers;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.2
  - number: 7.2.2.e
    text: de gegevens die in de registers worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.2
  - number: 7.2.2.f
    text: de wijze waarop gegevens in de registers worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.2
  - number: 7.2.2.g
    text: de termijn waarbinnen gegevens en wijzigingen daarvan worden verwerkt in het register;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.2
  - number: 7.2.2.h
    text: de gevallen waarin een aantekening in de registers wordt gewijzigd of doorgehaald;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.2
  - number: 7.2.2.i
    text: de persoon of instantie die de registers beheert en bijhoudt;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.2
  - number: 7.2.2.j
    text: de minimale of maximale duur van het bewaren van gegevens in het register;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.2
  - number: 7.2.2.k
    text: de vergoeding van kosten voor het opnemen en verwerken van gegevens in de registers.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.2
  - number: 7.2.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden geregeld dat een handeling waarvoor een melding als
      bedoeld in [artikel 7.1][ref1] vereist is, eerst kan worden verricht nadat de melding is aangetekend in een
      register als bedoeld in het eerste lid of tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.1
    text: |-
      Een besluit als bedoeld in [artikel 7.1][ref1] wordt door Onze Minister verleend of gewijzigd indien is voldaan aan
      de eisen, gesteld bij de regels, bedoeld in artikel 7.1.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.2
    text: |-
      Ingeval een besluit als bedoeld in [artikel 7.1][ref1] geheel of mede wordt vereist in het belang van de
      volksgezondheid, kan bij of krachtens algemene maatregel van bestuur dan wel bij ministeriële regeling worden
      geregeld dat deze wordt verleend of gewijzigd in overeenstemming dan wel na overleg met Onze Minister van
      Volksgezondheid, Welzijn en Sport.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur dan wel bij ministeriële regeling wordt bepaald dat
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref1] van toepassing is op een aanvraag tot verlening
      of wijziging van een besluit als bedoeld in [artikel 7.1][ref2], tenzij EU-rechtshandelingen, het belang van de
      gezondheid van de mens, dieren of planten, het belang van het welzijn van dieren, of het belang van het milieu zich
      daartegen verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.4
    text: |-
      Het derde lid is niet van toepassing op besluiten met betrekking tot vergunningen waarop, met toepassing van
      [artikel 28 van de Dienstenwet][ref1], [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] van toepassing
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 7.3.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kan met
      betrekking tot de in het vierde lid bedoelde besluiten toepassing worden gegeven aan
      [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
  - number: 7.4.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de uitvoering van bindende onderdelen
      van EU-rechtshandelingen inzake de geldingsduur van besluiten als bedoeld in [artikel 7.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.4.2
    text: |-
      In andere gevallen dan bedoeld in het eerste lid is een besluit als bedoeld in [artikel 7.1][ref1] voor onbepaalde
      tijd geldig, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.4.2.a
    text: |-
      bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling een andere geldigheidsduur is
      vastgesteld, of
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.4
  - number: 7.4.2.b
    text: het besluit zelf in een andere geldigheidsduur voorziet.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.4
  - number: 7.4.3
    text: |-
      Ingeval een besluit als bedoeld in [artikel 7.1][ref1] niet voor onbepaalde tijd geldig is, zijn
      [artikel 7.3][ref2] en het eerste en tweede lid op de verlenging daarvan van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.5.1
    text: |-
      Aan een besluit als bedoeld in [artikel 7.1][ref1] kunnen voorschriften en beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.5.2
    text: |-
      De voorschriften en beperkingen, bedoeld in het eerste lid, kunnen op aanvraag of ambtshalve gewijzigd, aangevuld
      of ingetrokken worden.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.5
  - number: 7.5.3
    text: Het is verboden te handelen in strijd met voorschriften en beperkingen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.5
  - number: 7.5.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen regels worden gesteld over
      voorschriften en beperkingen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.5
  - number: 7.6.1
    text: 'Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.6
  - number: 7.6.1.a
    text: |-
      het indienen van een aanvraag tot een besluit als bedoeld in [artikel 7.1][ref1] dan wel tot verlenging of
      wijziging daarvan, of van een aanvraag tot aanwijzing, als bedoeld in [artikel 2.2, eerste lid][ref2], dan wel tot
      wijziging daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 7.6.1.b
    text: de behandeling van een aanvraag als bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.6
  - number: 7.6.1.c
    text: de wijze waarop een melding plaatsvindt, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.6
  - number: 7.6.1.d
    text: |-
      de toepasselijkheid van de bepalingen van de [hoofdstukken 6][ref1], [7][ref2] en
      [8 van de Algemene wet bestuursrecht][ref3] op een besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: 7.6.2
    text: |-
      De regels, bedoeld in het eerste lid, kunnen worden gesteld voor de uitvoering van EU-rechtshandelingen en kunnen
      voorts onder meer betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.6
  - number: 7.6.2.a
    text: welke gegevens, bescheiden of monsters worden overgelegd alvorens een aanvraag in behandeling wordt genomen;
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.6
  - number: 7.6.2.b
    text: |-
      een daarbij aangewezen onderzoek dat noodzakelijk is alvorens een besluit als bedoeld in [artikel 7.1][ref1]
      wordt verleend, verlengd of gewijzigd of alvorens een diersoort wordt aangewezen op grond van de
      [artikelen 2.2, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 7.6.2.c
    text: |-
      de termijn waarbinnen, na wijziging van omstandigheden, een aanvraag tot wijziging van een besluit als bedoeld in
      [artikel 7.1][ref1] wordt aangevraagd, dan wel een nieuwe melding plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.6.2.d
    text: de termijn voor het geven van een beslissing op een aanvraag, of
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.6
  - number: 7.6.2.e
    text: wie een aanvraag of een melding kan doen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.6
  - number: 7.6.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen regels worden gesteld over
      het verwijzen door aanvragers van een aanwijzing als bedoeld in [artikel 2.2, eerste lid][ref1], een besluit als
      bedoeld in [artikel 7.1][ref2], dan wel door personen die een melding doen, naar gegevens die eerder door hen of
      een ander bij een aanvraag om een aanwijzing als bedoeld in artikel 2.2, eerste lid, een besluit als bedoeld in
      artikel 7.1, dan wel een melding zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.7.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kan worden bepaald dat Onze Minister
      over een besluit als bedoeld in [artikel 7.1][ref1], of de wijziging, de verlenging, de schorsing of de intrekking
      daarvan, wordt geadviseerd door een commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.7.2
    text: 'Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.7
  - number: 7.7.2.a
    text: de samenstelling en de werkwijze van een commissie als bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.7
  - number: 7.7.2.b
    text: de benoeming, de zittingsduur, schorsing en ontslag van leden van de commissie en hun beloning.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.7
  - number: 7.7.3
    text: |-
      De leden van een commissie houden al hetgeen hun in hun hoedanigheid is bekend geworden geheim voor zover zij niet
      in hun hoedanigheid tot mededeling daarvan bevoegd of verplicht zijn.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.7
  - number: 7.8.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de gevallen waarin een besluit als
      bedoeld in [artikel 7.1][ref1] kan worden verlengd, geschorst of ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.8.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin een besluit
      als bedoeld in [artikel 7.1][ref1] van rechtswege vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: '7.9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling wordt voor de uitvoering van bindende
      onderdelen van EU-rechtshandelingen geregeld in welke gevallen mededeling wordt gedaan in de Staatscourant. Voorts
      kunnen bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling regels worden gesteld voor
      mededelingen in de Staatscourant van:
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.9
  - number: 7.9.a
    text: |-
      een besluit tot verlening van een besluit als bedoeld in [artikel 7.1][ref1] alsmede tot wijziging of verlenging
      daarvan, dan wel van een melding;


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.9.b
    text: |-
      een besluit tot schorsing of intrekking van een besluit als bedoeld in [artikel 7.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.9.c
    text: |-
      de gevallen waarin een besluit als bedoeld in [artikel 7.1][ref1] van rechtswege vervalt en met ingang van welke
      datum, en


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.9.d
    text: |-
      aantekeningen in een register als bedoeld in [artikel 7.2][ref1], alsmede de doorhaling daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
        hoofdstuk: '7'
  - number: 8.1.1
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren en andere personen.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.1
  - number: 8.1.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.1
  - number: '8.2'
    text: |-
      In aanvulling op [artikel 5:15, eerste lid, van de Algemene wet bestuursrecht][ref1] zijn de in de
      [artikelen 8.1, eerste lid][ref2], en [8.14, eerste lid][ref3], bedoelde ambtenaren en personen bevoegd, met
      medeneming van de benodigde apparatuur, een woning binnen te treden zonder toestemming van de bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '4'
  - number: '8.3'
    text: |-
      In het in [artikel 5:18, eerste lid, van de Algemene wet bestuursrecht][ref1] bedoelde geval verpakken en
      verzegelen de in de [artikelen 8.1, eerste lid][ref2], en [8.14][ref3] bedoelde ambtenaren en personen de monsters
      ter plaatse.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '4'
  - number: 8.4.1
    text: |-
      Eenieder wie zulks aangaat handelt overeenkomstig dan wel verleent zijn medewerking aan de uitvoering van een
      krachtens deze wet gegeven bevel, genomen maatregel of verrichte handeling, en verleent alle medewerking die
      redelijkerwijs nodig is voor het onderzoek naar dierziekten, zoönosen, ziekteverschijnselen of ziekteverwekkers.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.4
  - number: 8.4.2
    text: |-
      Eenieder die dieren, dierlijke producten, diergeneesmiddelen of diervoeders onder zich heeft of heeft gehad met
      betrekking waartoe krachtens deze wet een maatregel is getroffen, verstrekt op het eerste verzoek van een ambtenaar
      als bedoeld in [artikel 8.1, eerste lid][ref1], of [artikel 5.9, eerste lid][ref2], naar waarheid alle inlichtingen
      omtrent herkomst en verhandeling van deze dieren of producten.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel5
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '8.5'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bepaalde bij of
      krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0030250/2021-04-21#Artikel8.5
  - number: 8.6.1
    text: 'In deze paragraaf wordt verstaan onder:'
