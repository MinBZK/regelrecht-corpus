  - number: '2'
    text: Onder de inspecteur-generaal ressorteert de plaatsvervangend inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel2
  - number: '3'
    text: |-
      1 Onder de inspecteur-generaal ressorteert de algemeen directeur.

      2 Onder de algemeen directeur ressorteren:

      a. de afdeling Communicatie;

      b. het bureau Bedrijfsvoering;

      c. de directie Toezicht algemeen;

      d. de directie Toezicht gemeenten;

      e. de directie Toezicht zelfstandige bestuursorganen.

      3 De algemeen directeur is tevens directeur van de directie Toezicht zelfstandige bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel3
  - number: '4'
    text: |-
      1 De plaatsvervangend inspecteur-generaal vervangt de inspecteur-generaal bij diens afwezigheid of verhindering en
      treedt alsdan in de verantwoordelijkheden en bevoegdheden van de inspecteur-generaal.

      2 De plaatsvervangend inspecteur-generaal is belast met de uitvoering van door de inspecteur-generaal opgedragen
      projectmatige werkzaamheden, betrekking hebbende op cultuur en werkwijze en op de bedrijfsmiddelen, waaronder
      begrepen wordt: personeel, informatie, organisatie, financiën, aanschaf en huisvesting.

      3 De plaatsvervangend inspecteur-generaal voert regelmatig overleg en verzorgt de afstemming met het ministerie
      inzake de ontwikkeling van de in het tweede lid genoemde bedrijfsmiddelen.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel4
  - number: '5'
    text: |-
      De algemeen directeur is verantwoordelijk voor:

      a. het door tussenkomst van de inspecteur-generaal adviseren van de bewindspersonen ten aanzien van het werkterrein
      van de Inspectie en het hen attenderen op politiek of maatschappelijk gevoelige aspecten;

      b. het coördineren van het toezicht op de uitvoering van de sociale verzekeringen en voorzieningen, en op de
      werking van het stelsel daarvan, en van andere taken, bedoeld in [artikel 39, tweede lid, van de wet][ref1];

      c. het zorgdragen voor een betrouwbare, effectieve en efficiënte bedrijfsvoering, met uitzondering van de
      vaststelling van de formatie, voor periodieke evaluatie daarvan en voor planning en bewaking van de productie van
      de Inspectie;

      d. de personeelsaangelegenheden van de onder hem ressorterende functionarissen, met inbegrip van de uitvoering van
      het arbeidsomstandigheden- en ziekteverzuimbeleid, voor zover dit niet is voorbehouden aan de secretaris-generaal
      dan wel de inspecteur-generaal;

      e. de personeelsaangelegenheden van functionarissen die niet meer onder hem ressorteren en ten aanzien van wie geen
      andere functionaris binnen het ministerie (meer) kan worden aangewezen, maar die op 31 december 2002 of later onder
      de inspecteur-generaal ressorteerden;

      f. de werkgeversverplichtingen die voortvloeien uit wet- en regelgeving op het gebied van arbeidsomstandigheden ten
      aanzien van de inspectie, voor zover het niet gaat om centraal georganiseerde werkgeversverplichtingen als bedoeld
      in [artikel 6, vijfde lid, onder b, van het Organisatie-, mandaat- en volmachtbesluit SZW 2004][ref2];

      g. het op orde hebben van de administratieve organisatie en informatiebeveiliging;

      h. het voorbereiden en uitvoeren van jaarplannen en meerjarenplannen voor de Inspectie binnen de door de
      inspecteur-generaal vastgestelde uitgangspunten;

      i. het vaststellen van de jaarplannen van de directies;

      j. het vaststellen van de jaarplannen van het Bureau Bedrijfsvoering en de afdeling Communicatie na overleg met de
      inspecteur-generaal;

      k. het vaststellen van het opleidingsplan IWI na overleg met de inspecteur-generaal;

      l. het afleggen van verantwoording en het rapporteren aan de inspecteur-generaal over de uitvoering van het
      jaarplan en het meerjarenplan van de Inspectie en de jaarplannen van de directies;

      m. de behandeling van klachten als bedoeld in [artikel 9:1 van de Algemene wet bestuursrecht][ref3] voor zover deze
      betrekking hebben op gedragingen van de onder hem ressorterende functionarissen;

      n. het inzake de Inspectie optreden als bestuurder in de zin van
      [artikel 1 van de Wet op de ondernemingsraden][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0016199#Artikel6
