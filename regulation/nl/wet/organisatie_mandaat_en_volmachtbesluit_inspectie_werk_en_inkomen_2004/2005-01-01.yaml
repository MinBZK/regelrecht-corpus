  - number: '7'
    text: |-
      Het hoofd van het Bureau Bedrijfsvoering is verantwoordelijk voor de volgende algemene taken:

      a. het leiding geven aan het bureau;

      b. het leveren van een bijdrage aan het opstellen en uitvoeren van het jaarplan en meerjarenplan van de Inspectie;

      c. het voorbereiden van het jaarplan voor het bureau binnen de door de inspecteur-generaal vastgestelde
      uitgangspunten;

      d. het uitvoeren van het door de algemeen directeur vastgestelde jaarplan voor het bureau;

      e. het afleggen van verantwoording en het rapporteren over de uitvoering van het jaarplan van het bureau aan de
      algemeen directeur;

      f. het doen van voorstellen met betrekking tot het aantrekken en ontslaan van personeel.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel7
  - number: '8'
    text: |-
      1 Elk van de hoofden van een afdeling is verantwoordelijk voor de volgende algemene taken:

      a. het leiding geven aan de eigen afdeling;

      b. het leveren van een bijdrage aan het opstellen en uitvoeren van het jaarplan en meerjarenplan van de Inspectie
      en van het directieplan;

      c. het voorbereiden van jaarplannen voor de eigen afdeling binnen de door de inspecteur-generaal vastgestelde
      uitgangspunten;

      d. het uitvoeren van het door de directeur vastgestelde jaarplan voor de eigen afdeling;

      e. het afleggen van verantwoording en het rapporteren over de uitvoering van het jaarplan van de eigen afdeling aan
      de directeur;

      f. het doen van voorstellen met betrekking tot het aantrekken en ontslaan van personeel.

      2 In afwijking van het eerste lid geldt voor het hoofd van de afdeling Communicatie dat het jaarplan van de
      afdeling wordt vastgesteld door de algemeen directeur en verantwoording wordt afgelegd aan de algemeen directeur.

      3 In afwijking van het eerste lid geldt voor het hoofd van de afdeling Facilitymanagement dat hij geen jaarplan
      voor de eigen afdeling opstelt, maar bijdragen levert voor het jaarplan van het Bureau Bedrijfsvoering, en
      verantwoording aflegt aan het hoofd van het Bureau Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel8
  - number: '9'
    text: |-
      De afdeling Communicatie is verantwoordelijk voor:

      a. het ontwikkelen en verzorgen van de in- en externe communicatie, met inbegrip van persvoorlichting;

      b. de afstemming van de in- en externe communicatie met de directie Communicatie van het ministerie.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel9
  - number: '10'
    text: |-
      1 Het Bureau Bedrijfsvoering is verantwoordelijk voor:

      a. de planning- en controlcyclus op gebied van middelenbeheer, met name op financieel en HRM-gebied;

      b. de advisering over en ondersteuning bij de uitvoering van het middelenbeheer;

      c. het voeren van de controlfunctie;

      d. de ontwikkeling, verzorging en uitvoering van financieel beleid, HRM-beleid en facilitymanagementbeleid;

      e. het beheer van administratieve systemen;

      f. de verzorging van administraties;

      g. de verzorging van de administratieve en financiële afhandeling van de uitvoering van de
      personeelsaangelegenheden van de Inspectie, voor zover deze niet is opgedragen aan anderen zoals de directie
      Personeel, Organisatie en Informatie, de directie Financieel-Economische Zaken, de directie Gemeenschappelijke
      Ondersteuning Bedrijfsvoering van het ministerie en de Stichting Pensioenfonds ABP;

      h. de verzorging van het ambtelijk secretariaat van de ondernemingsraad.

      2 Onder het hoofd van het Bureau Bedrijfsvoering ressorteren:

      a. de afdeling Facilitymanagement;

      b. de afdeling Documentaire Informatievoorziening;

      c. de afdeling Personeel en Financiën.

      3 Het hoofd van het Bureau Bedrijfsvoering geeft rechtstreeks leiding aan de afdeling Documentaire
      Informatievoorziening en de afdeling Personeel en Financiën.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel10
  - number: '11'
    text: |-
      De afdeling Facilitymanagement is verantwoordelijk voor:

      a. de advisering over en ontwikkeling van beleid en plannen met betrekking tot algemene facilitaire voorzieningen;

      b. de verzorging van de huisvesting van de inspectie en overige facilitaire voorzieningen en het daaraan verbonden
      budget- en overig beheer.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel11
  - number: '12'
    text: |-
      De afdeling Documentaire Informatievoorziening is verantwoordelijk voor:

      a. het adviseren van het management ten aanzien van vraagstukken op het gebied van documentaire
      informatievoorziening en bij de ontwikkeling, uitbouw en implementatie van eigentijdse toepassingen op het
      vakgebied;

      b. het bevorderen van de toegankelijkheid, vindbaarheid en benaderbaarheid van kwalitatieve informatie in fysieke
      en digitale vorm door middel van eigentijdse toepassingen ten behoeve van het verwerven, opslaan, ontsluiten en ter
      beschikking stellen van kwalitatieve informatie;

      c. het verlenen van gebruiksondersteuning.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel12
  - number: '13'
    text: |-
      De afdeling Personeelszaken en Financiën is verantwoordelijk voor:

      a. de advisering over en ontwikkeling van beleid en plannen over besteding van middelen ten aanzien van personeel
      en financiën van de Inspectie;

      b. de levering van managementinformatie over de besteding van middelen, bedoeld in onderdeel a;

      c. het verzorgen van de planning- en controlfunctie en de daarbij behorende administraties en producten;

      d. uitvoerende werkzaamheden op het gebied van personeels- en salarisadministratie.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel13
  - number: '14'
    text: |-
      1 De directie Toezicht algemeen is verantwoordelijk voor:

      a. de ondersteuning van strategie en beleidsontwikkeling van de Inspectie;

      b. de ondersteuning van programmering, planning en control, en verantwoording inzake de werkzaamheden van de
      inspectie;

      c. het initiëren van activiteiten ter coördinatie op domeinoverstijgende onderwerpen en het bewaken van die
      activiteiten;

      d. het binnen de gekozen aansturingslijnen opzetten en uitvoeren van gedragswetenschappelijk onderzoek voor zowel
      domeinbepaalde als domeinoverstijgende onderwerpen;

      e. het coördineren en uitvoeren van toezichtbaarheidstoetsen;

      f. het geven van juridische en wetstechnische ondersteuning aan de ontwikkeling en uitvoering van de
      toezichtsfunctie door de afdelingen van de eigen directie en van de andere directies van de inspectie;

      g. de inbreng van juridische expertise en onderzoeksexpertise voor zowel domeinbepaald als domeinoverstijgend
      toezicht;

      h. het informatiebeleid;

      i. de informatisering van toezichtprocessen en ondersteunende processen;

      j. het vergaren en gestructureerd beschikbaar stellen van reguliere, kwantitatieve gegevensstromen
      (toezichtinformatie) ten behoeve van de toezichtprocessen;

      k. de advisering op het terrein van de deskundigheidsbevordering;

      l. de advisering op het terrein van het kwaliteitsmanagement;

      m. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het ministerie.

      2 Onder de directeur Toezicht algemeen ressorteren:

      a. de afdeling Onderzoek;

      b. de afdeling Juridische Zaken;

      c. de afdeling Strategie en Beleid;

      d. de afdeling Informatiebeheer & Informatisering.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel14
  - number: '15'
    text: |-
      De afdeling Onderzoek is verantwoordelijk voor:

      a. het ontwikkelen en uitvoeren van gedragswetenschappelijk onderzoek naar de uitvoering door de uitvoerende
      instanties;

      b. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      c. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het ministerie.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel15
  - number: '16'
    text: |-
      De afdeling Juridische Zaken is verantwoordelijk voor:

      a. de juridische ondersteuning bij de ontwikkeling en uitvoering van het toezicht;

      b. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      c. de coördinatie en uitvoering van de toezichtbaarheidstoetsen, bedoeld in [artikel 41 van de wet][ref1];

      d. het beheren en onderhouden van een wettendocumentatiesysteem en de verzorging van interne kennisoverdracht;

      e. het fungeren als coördinatie- en aanspreekpunt voor de inspectie inzake juridische aangelegenheden;

      f. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel41
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '41'
  - number: '17'
    text: |-
      De afdeling Strategie en Beleid is verantwoordelijk voor:

      a. de strategie- en beleidsontwikkeling op het terrein van de inspectie;

      b. de totstandkoming van de programmering en planning- en controlcyclus van de toezichtactiviteiten van de
      Inspectie;

      c. de deskundigheidsbevordering, waaronder het opstellen van een opleidingsplan in afstemming met de afdeling
      Personeel en Financiën;

      d. het kwaliteitsmanagement;

      e. het relatiebeheer van de Inspectie.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel17
  - number: '18'
    text: |-
      De Afdeling Informatiebeheer & Informatisering is verantwoordelijk voor:

      a. de systeemontwikkeling;

      b. de helpdesk;

      c. de data-acquisitie en het gegevensbeheer;

      d. beleidsontwikkeling met betrekking tot informatievoorziening en informatisering en het opstellen van
      informatiseringsplannen.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel18
  - number: '19'
    text: |-
      1 De directie Toezicht gemeenten is verantwoordelijk voor:

      a. het houden van toezicht op de rechtmatigheid van de uitvoering door gemeenten van de [WWB][ref1], de
      [IAOW][ref2] en de [IAOZ][ref3], en op de doeltreffendheid van die wetten;

      b. het houden van toezicht op de rechtmatigheid en doeltreffendheid van de uitvoering door gemeenten van overige
      wet- en regelgeving waarbij de Inspectie als toezichthouder is aangewezen;

      c. het rapporteren over de resultaten en kwaliteit van de uitvoering;

      d. het opstellen van een oordeel over mogelijke risico’s voor de kwaliteit van de uitvoering;

      e. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming door het ministerie;

      f. het relatiebeheer met de uitvoerende instanties binnen het gemeentelijk domein.

      2 Onder de directeur Toezicht gemeenten ressorteren:

      a. de afdeling Beleid, Informatie en Analyse;

      b. de afdeling Noord;

      c. de afdeling Zuid.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
  - number: '20'
    text: |-
      De afdeling Beleid, Informatie en Analyse is verantwoordelijk voor:

      a. het operationaliseren van het toezichtbeleid voor het gemeentelijk domein, waaronder het opstellen van
      toetsingskaders;

      b. het monitoren van uitvoeringsinformatie en de opbouw van een actueel inhoudelijk informatiebeeld over gemeenten,
      ten behoeve van onder andere risico- en trendanalyses;

      c. kaderstelling, waaronder de noodzakelijkheidvraag en probleemstelling, voor complementair aspectonderzoek;

      d. het bijdragen aan rapportages over onderzoeken inzake het gemeentelijk domein;

      e. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      f. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het ministerie.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel20
  - number: '21'
    text: |-
      1 De afdelingen Noord en Zuid zijn gezamenlijk verantwoordelijk voor:

      a. het rapporteren over een landelijk beeld van de rechtmatigheid van het werkdeel en het inkomensdeel [WWB][ref1],
      en per gemeente, dan wel een samenwerkingsverband van gemeenten, over de rechtmatigheid van het werkdeel
      [WWB][ref2];

      b. het rapporteren in gevallen van ernstige tekortkomingen als bedoeld in [artikel 76, derde lid, van de WWB][ref3];

      c. het rapporteren in gevallen dat een gemeente op grond van [artikel 74, eerste lid, van de WWB][ref4] een
      aanvullende uitkering heeft aangevraagd;

      d. het rapporteren per gemeente, dan wel samenwerkingsverband van gemeenten, over de rechtmatigheid en
      doeltreffendheid van de uitvoering door gemeenten van overige wet- en regelgeving, bedoeld in artikel 3.4.1,
      onderdeel b;

      e. het ontwikkelen en feitelijk uitvoeren van aanvullende aspectonderzoeken als bedoeld in artikel 3.4.2, onderdeel
      c, en het rapporteren daarover;

      f. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      g. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het ministerie.

      2 De afdelingen Noord en Zuid richten hun werkzaamheden in beginsel op hun werkgebied en verlenen elkaar, indien
      nodig, onderlinge bijstand.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0015703
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel76
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel74
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0015703
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '76'
      - id: ref4
        bwb_id: BWBR0015703
        artikel: '74'
  - number: '22'
    text: |-
      De directie Toezicht zelfstandige bestuursorganen is verantwoordelijk voor:

      a. het houden van toezicht op de uitvoering van de wettelijke taken door de CWI , de SVB, het UWV en de RWI;

      b. het houden van toezicht op de SER, de PVK, het Ctb en cki’s, voor zover dit toezicht is opgedragen aan de
      Minister;

      c. het rapporteren over de resultaten en de kwaliteit van de uitvoering, genoemd in onderdeel a, en over de
      uitkomsten van het toezicht, bedoeld in onderdeel b;

      d. het opstellen van een oordeel over mogelijke risico’s voor de kwaliteit van de uitvoering(sorganisaties),
      genoemd in onderdeel a, en bij de uitkomsten van het toezicht, bedoeld in onderdeel b;

      e. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming door het ministerie;

      f. het relatiebeheer met de instanties, genoemd in de onderdelen a en b.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel22
  - number: '23'
    text: |-
      De afdeling Toezicht CWI is verantwoordelijk voor:

      a. het houden van toezicht op de uitvoering van de wettelijke taken door de CWI;

      b. het rapporteren over de resultaten en kwaliteit van de uitvoering van de wettelijke taken door de CWI;

      c. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      d. de coördinatie en afstemming binnen de Inspectie aangaande het toezicht op de samenwerking, bedoeld in
      [artikel 37, onderdeel c, van de wet][ref1], van de CWI, het UWV en de SVB met elkaar en met burgemeesters en
      wethouders van de gemeenten;

      e. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel37
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '37'
  - number: '24'
    text: |-
      Het hoofd van de afdeling Toezicht IB/BKWI is verantwoordelijk voor:

      a. het houden van toezicht op de uitvoering van de wettelijke taken door het IB en het BKWI;

      b. het rapporteren over de resultaten en kwaliteit van de uitvoering van de wettelijke taken door het IB en het
      BKWI;

      c. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      d. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het ministerie.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel24
  - number: '25'
    text: |-
      De afdeling Toezicht overige bestuursorganen is verantwoordelijk voor:

      a. het houden van toezicht op de uitvoering van de wettelijke taken door de RWI;

      b. het houden van toezicht op de SER, de PVK, het Ctb en cki’s, voor zover dit toezicht is opgedragen aan de
      Minister;

      c. het rapporteren over de resultaten en kwaliteit van de uitvoering van de wettelijke taken door de RWI, de SER,
      de PVK, het Ctb en cki’s;

      d. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      e. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het ministerie.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel25
  - number: '26'
    text: |-
      De afdeling toezicht SVB is verantwoordelijk voor:

      a. het houden van toezicht op de uitvoering van de wettelijke taken door de SVB;

      b. het rapporteren over de resultaten en kwaliteit van de uitvoering van de wettelijke taken door de SVB;

      c. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      d. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het ministerie.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel26
  - number: '27'
    text: |-
      De afdeling Toezicht UWV is verantwoordelijk voor:

      a. het houden van toezicht op de uitvoering van de wettelijke taken door het UWV;

      b. het rapporteren over de resultaten en kwaliteit van de uitvoering van de wettelijke taken door het UWV;

      c. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      d. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het ministerie.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel27
  - number: '28'
    text: |-
      1 De algemeen directeur is bevoegd om besluiten te nemen, overeenkomsten aan te gaan en handelingen te verrichten,
      die noch een besluit, noch een privaatrechtelijke rechtshandeling zijn, voor zover zij verband houden met het
      werkterrein van de Inspectie, tenzij deze zijn voorbehouden aan een bewindspersoon, de secretaris-generaal, de
      plaatsvervangend secretaris-generaal of de inspecteur-generaal.

      2 Aan de algemeen directeur wordt mandaat en machtiging verleend met betrekking tot het nemen van besluiten over en
      het vaststellen en ondertekenen van stukken die betrekking hebben op:

      a. de in [artikel 5, onderdelen d en e][ref1], genoemde personeelsaangelegenheden;

      b. de behandeling van klachten als bedoeld in [artikel 9:1 van de Algemene wet bestuursrecht][ref2] voor zover deze
      betrekking hebben op gedragingen van de onder hem ressorterende functionarissen.

      3 De in het eerste lid genoemde bevoegdheid om overeenkomsten aan te gaan is beperkt tot overeenkomsten met een
      waarde van € 20.000,– per overeenkomst, met dien verstande dat de volgende overeenkomsten mogen worden aangegaan
      tot een waarde van € 500.000,– per overeenkomst:

      a. overeenkomsten die voortvloeien uit het door de inspecteur-generaal vastgestelde jaarplan;

      b. overeenkomsten voor het opleiden van de medewerkers van de Inspectie, voor zover deze voortvloeien uit een door
      de algemeen directeur vastgesteld opleidingsplan;

      c. overeenkomsten voor het inhuren van personeel voor de uitvoering van werkzaamheden die onder de directe
      verantwoordelijkheid van het management van de inspectie worden verricht;

      d. arbeidsovereenkomsten naar burgerlijk recht;

      e. overeenkomsten met betrekking tot onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0016800#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel91
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0016800
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 9:1
  - number: '29'
    text: |-
      1 Elk van de directeuren is bevoegd om namens een bewindspersoon dan wel de inspecteur-generaal besluiten te
      nemen, overeenkomsten aan te gaan en handelingen te verrichten die noch een besluit, noch een privaatrechtelijke
      rechtshandeling zijn, voor zover zij verband houden met het werkterrein van zijn directie, tenzij deze zijn
      voorbehouden aan een bewindspersoon, de secretaris-generaal, de plaatsvervangend secretaris-generaal, of de
      inspecteur-generaal.

      2 Aan elk van de directeuren wordt mandaat en machtiging verleend met betrekking tot het nemen van besluiten over
      en het vaststellen en ondertekenen van stukken die betrekking hebben op:

      a. de specifieke taken van de directie, met uitzondering van stukken waarvan, gelet op het belang daarvan,
      redelijkerwijze kan worden vermoed dat deze door de algemeen directeur moeten worden afgedaan;

      b. de in [artikel 5, onderdeel d][ref1], genoemde personeelsaangelegenheden;

      c. de behandeling van klachten als bedoeld in [artikel 9:1 van de Algemene wet bestuursrecht][ref2] voor zover deze
      betrekking hebben op gedragingen van de onder elk van hen ressorterende functionarissen.

      3 De in het eerste lid genoemde bevoegdheid om overeenkomsten aan te gaan is beperkt tot overeenkomsten met een
      waarde van € 20.000,– per overeenkomst, met dien verstande dat de volgende overeenkomsten mogen worden aangegaan
      tot een waarde van € 500.000,– per overeenkomst:

      a. overeenkomsten die voortvloeien uit het door de algemeen directeur vastgestelde directieplan;

      b. overeenkomsten voor het opleiden van de medewerkers van de directie, voor zover deze voortvloeien uit een door
      de algemeen directeur vastgesteld opleidingsplan;

      c. overeenkomsten voor het inhuren van personeel voor de uitvoering van werkzaamheden die onder de directe
      verantwoordelijkheid van het management van de inspectie worden verricht;

      d. arbeidsovereenkomsten naar burgerlijk recht;

      e. overeenkomsten met betrekking tot onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0016800#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel91
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0016800
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 9:1
  - number: '30'
    text: |-
      Aan de afdelingshoofden en het hoofd van het bureau Bedrijfsvoering wordt mandaat en machtiging verleend tot het
      nemen van besluiten over en het ondertekenen van stukken die betrekking hebben op:

      a. de specifieke taken van de afdeling respectievelijk het bureau, met uitzondering van de stukken waarvan, gelet
      op het belang daarvan, redelijkerwijze kan worden vermoed dat deze door de directeur respectievelijk de algemeen
      directeur moeten worden afgedaan;

      b. de personeelsaangelegenheden van de afdeling respectievelijk het bureau, voorzover het betreft:

      1°. het opmaken van een beoordeling van medewerkers;

      2°. het houden van management-medewerkergesprekken;

      3°. werktijdafspraken met of verlof van medewerkers;

      4°. kleine beloningen, niet zijnde gratificaties, onder gelijktijdige mededeling daarvan aan de directeur
      respectievelijk de algemeen directeur.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel30
  - number: '31'
    text: |-
      Aan het hoofd van de afdeling Communicatie wordt volmacht verleend tot het aangaan van overeenkomsten met een
      waarde van maximaal van € 10.000,– per overeenkomst en voor zover deze betrekking hebben op:

      a. de productie en distributie van voorlichtingsmateriaal, gericht op de communicatie van toezichtsbevindingen;

      b. systeemontwikkeling, licenties en functioneel beheer en onderhoud van applicaties van voorlichtingssystemen.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel31
  - number: '32'
    text: |-
      Aan het hoofd van het Bureau Bedrijfsvoering wordt volmacht verleend tot het aangaan van overeenkomsten met een
      waarde van maximaal € 50.000,– per overeenkomst en voor zover deze betrekking hebben op:

      a. de levering van goederen en diensten ten behoeve van de Inspectie;

      b. de tewerkstelling van uitzendkrachten ten behoeve van de Inspectie, binnen de formatie van de Inspectie;

      c. de verzorging van huisvesting van de inspectie en het daaraan verbonden beheer.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel32
  - number: '33'
    text: |-
      Aan het hoofd van de afdeling Facilitymanagement wordt volmacht verleend tot het aangaan van overeenkomsten voor
      verzorging van huisvesting van de inspectie en het daaraan verbonden beheer tot een maximum van € 25.000,– per
      overeenkomst.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel33
  - number: '34'
    text: |-
      1 De afdoening van alle stukken waarvan de inspecteur-generaal aangeeft dat hij deze zelf wenst af te doen,
      geschiedt door de inspecteur-generaal.

      2 Rapporten die worden toegezonden aan de minister, worden vastgesteld door de inspecteur-generaal.

      3 Brieven, gericht aan een bewindspersoon, worden vastgesteld en ondertekend door de inspecteur-generaal.

      4 De vertegenwoordigingsbevoegde is gehouden in de ondertekening van stukken die op basis van mandaat, volmacht of
      machtiging worden ondertekend, zijn vertegenwoordigingsbevoegdheid tot uitdrukking te brengen door opneming van de
      volgende formule:

      De inspecteur-generaal van de Inspectie Werk en Inkomen,

      namens deze:

      functie betrokken vertegenwoordigingsbevoegde,

      handtekening van de betrokken vertegenwoordigingsbevoegde,

      naam van de betrokken vertegenwoordigingsbevoegde.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel34
  - number: '35'
    text: |-
      Bij afwezigheid of verhindering van zowel de inspecteur-generaal als de plaatsvervangend inspecteur-generaal neemt,
      voor de duur van die afwezigheid of verhindering, de algemeen directeur, als waarnemend inspecteur-generaal, de
      taken en bevoegdheden van de inspecteur-generaal waar.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel35
  - number: '36'
    text: |-
      1 Bij afwezigheid of verhindering van de algemeen directeur in de periode van 1 januari tot en met 30 juni neemt
      voor de duur van die afwezigheid of verhindering de directeur Toezicht gemeenten, als plaatsvervangend algemeen
      directeur, de taken en bevoegdheden van de algemeen directeur waar.

      2 Bij afwezigheid of verhindering van de algemeen directeur in de periode van 1 juli tot en met 31 december neemt
      voor de duur van die afwezigheid of verhindering de directeur Toezicht algemeen, als plaatsvervangend algemeen
      directeur, de taken en bevoegdheden van de algemeen directeur waar.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel36
  - number: '37'
    text: |-
      Plaatsvervangers worden, na schriftelijke instemming van de inspecteur-generaal, benoemd door de directeur, het
      afdelingshoofd of het bureauhoofd in wiens plaats zij treden.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel37
  - number: '38'
    text: |-
      Besluiten tot aanwijzing van plaatsvervangers worden door de algemeen directeur toegezonden aan de
      directeur Wetgeving, Bestuurlijke en Juridische Aangelegenheden als beheerder van het mandaat-, volmacht- en
      machtigingenregister SZW.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel38
  - number: '39'
    text: |-
      1 Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst, en werkt terug tot en met 1 maart 2004.

      2 Deze regeling wordt aangehaald als: Organisatie-, mandaat- en volmachtbesluit Inspectie Werk en Inkomen 2004.
    url: https://wetten.overheid.nl/BWBR0016800/2005-01-01#Artikel39
