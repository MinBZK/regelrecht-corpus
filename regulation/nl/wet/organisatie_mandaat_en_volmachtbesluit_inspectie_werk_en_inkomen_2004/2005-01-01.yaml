articles:
  - number: '1'
    text: |-
      In deze regeling en de daarop berustende bepalingen wordt verstaan onder:

      a. *de Inspectie*: de Inspectie Werk en inkomen;

      b. *algemeen directeur*: de algemeen directeur van de Inspectie;

      c. *directie*: een als zodanig aangeduid organisatieonderdeel van de Inspectie Werk en Inkomen, dat ressorteert
      onder de algemeen directeur;

      d. *directeur*: een functionaris die leiding geeft aan een directie;

      e. *de wet*: de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      f. *CWI*: de Centrale organisatie werk en inkomen, genoemd in [hoofdstuk 4 van de wet][ref2];

      g. *BKWI*: het Bureau Keteninformatisering Werk en Inkomen, een afzonderlijk en herkenbaar organisatieonderdeel van
      CWI als bedoeld in [artikel 6.3, tweede lid, van de Regeling SUWI][ref3];

      h. *IB*: het Inlichtingenbureau, genoemd in [artikel 63 van de wet][ref4];

      i. *RWI*: de Raad voor werk en inkomen, genoemd in [hoofdstuk 3 van de wet][ref5];

      j. *SVB*: de Sociale verzekeringsbank, genoemd in [hoofdstuk 6 van de wet][ref6];

      k. *UWV*: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in [hoofdstuk 5 van de wet][ref7];

      l. *cki’s*: door de minister op grond van de [Arbeidsomstandighedenwet 1998][ref8], de [Warenwet][ref9], de
      [Kernenergiewet][ref10] of de [Stoomwet][ref11] aangewezen certificatie- en keuringsinstellingen die zijn belast
      met het verstrekken van certificaten c.q. het verrichten van keuringen in het belang van veiligheid en gezondheid
      in de arbeid;

      m. *Ctb*: het College voor de toelating van bestrijdingsmiddelen, genoemd in
      [artikel 1a van de Bestrijdingsmiddelenwet 1962][ref12];

      n. *PVK*: de Pensioen- & Verzekeringskamer, genoemd in
      [artikel 2, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref13];

      o. *SER*: de Sociaal-Economische Raad, genoemd in [artikel 1 van de Wet op de bedrijfsorganisatie][ref14];

      p. *WWB*: de [Wet werk en bijstand][ref15];

      q. *werkdeel WWB*: de uitkering, bedoeld in [artikel 69, eerste lid, onderdeel a, van de WWB][ref16];

      r. *inkomensdeel WWB*: de uitkering, bedoeld in [artikel 69, eerste lid, onderdeel b, van de WWB][ref17];

      s. *IAOW*: de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref18];

      t. *IAOZ*: de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref19].


