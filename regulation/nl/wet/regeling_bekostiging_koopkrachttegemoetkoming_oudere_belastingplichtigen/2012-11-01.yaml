  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Financiën;

    Gelet op artikel 13, vierde lid, van de Wet mogelijkheid koopkrachttegemoetkoming oudere belastingplichtigen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0030013/2012-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Onder KOB wordt verstaan: het bedrag van de tegemoetkoming als bedoeld in
      [artikel 3 van de van de Wet mogelijkheid koopkrachttegemoetkoming oudere belastingplichtigen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029984#Artikel3
    url: https://wetten.overheid.nl/BWBR0030013/2012-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029984
        artikel: '3'
  - number: '2'
    text: |-
      Voor 1 oktober van elk jaar verstrekt de SVB aan de Minister in het jaarplan met begroting een opgave van
      het totaalbedrag aan de voor het komende jaar geraamde baten en lasten met betrekking tot de toekenning van
      koopkrachttegemoetkomingen, uitgesplitst naar lasten KOB per maand en uitvoeringskosten per jaar.
    url: https://wetten.overheid.nl/BWBR0030013/2012-11-01#Artikel2
  - number: '3'
    text: |-
      1 De Minister stort op de rekening-courant, bedoeld in [artikel 5.16, onderdeel a, van de Regeling Wfsv][ref1], een
      periodiek voorschot op het bedrag, bedoeld in [artikel 2][ref2], van:

      a. geraamde lasten KOB met als valutadatum de tweeëntwintigste dag van elke maand, en

      b. 1/12de deel van de geraamde uitvoeringskosten met als valutadatum de vijftiende dag van elke maand.

      2 De Minister kan, na overleg met de SVB, van de in het eerste lid, onderdelen a en b, bedoelde bedragen afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5.16
      [ref2]: https://wetten.overheid.nl/BWBR0030013#Artikel2
    url: https://wetten.overheid.nl/BWBR0030013/2012-11-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '5.16'
      - id: ref2
        bwb_id: BWBR0030013
        artikel: '2'
  - number: '4'
    text: |-
      1 In de jaarrekening, bedoeld in [artikel 49 van de Wet SUWI][ref1], worden de baten en lasten, alsmede de
      ontvangen voorschotten, bedoeld in [artikel 3, eerste lid][ref2], uitgesplitst naar lasten KOB en uitvoeringskosten
      van de toekenning van koopkrachttegemoetkomingen opgenomen.

      2 Na goedkeuring van het besluit tot vaststelling van de jaarrekening, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref3], rekent de Minister de baten
      en lasten, alsmede de ontvangen voorschotten, met betrekking tot het desbetreffende kalenderjaar af, met als
      valutadatum 1 juni van het hierop volgende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0030013#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel34
    url: https://wetten.overheid.nl/BWBR0030013/2012-11-01#Artikel4
    references:
