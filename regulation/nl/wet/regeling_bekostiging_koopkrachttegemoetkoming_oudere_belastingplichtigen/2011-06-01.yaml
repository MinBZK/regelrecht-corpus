preamble:
  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Financiën;

    Gelet op artikel 13, vierde lid, van de Wet mogelijkheid koopkrachttegemoetkoming oudere belastingplichtigen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0030013/2011-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Onder KOB wordt verstaan: het bedrag van de tegemoetkoming als bedoeld in
      [artikel 3 van de van de Wet mogelijkheid koopkrachttegemoetkoming oudere belastingplichtigen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029984#Artikel3
    url: https://wetten.overheid.nl/BWBR0030013/2011-06-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029984
        artikel: '3'
  - number: '2'
    text: |-
      Uiterlijk op 1 oktober van elk jaar verstrekt de SVB aan de Minister een opgave van het bedrag aan geraamde KOB in
      het komende jaar, met een uitsplitsing naar maand.
    url: https://wetten.overheid.nl/BWBR0030013/2011-06-01#Artikel2
  - number: '3'
    text: |-
      Met als valutadag de tweeëntwintigste dag van elke maand stort de Minister een periodiek voorschot op het bedrag,
      bedoeld in [artikel 2][ref1], op een rekening-courant van de SVB bij de Minister van Financiën. De Minister kan, na
      overleg met de SVB, van dit bedrag afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0030013#Artikel2
    url: https://wetten.overheid.nl/BWBR0030013/2011-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0030013
        artikel: '2'
  - number: '4'
    text: |-
      In het jaarplan met begroting, bedoeld in
      [artikel 46, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], verstrekt de SVB elk
      jaar aan de Minister een opgave van het totaalbedrag aan geraamde uitvoeringskosten met betrekking tot de KOB in
      het komende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel46
    url: https://wetten.overheid.nl/BWBR0030013/2011-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '46'
  - number: '5'
    text: |-
      Met als valutadag de eerste dag van elke maand stort de Minister ééntwaalfde van het bedrag, bedoeld in
      [artikel 4][ref1], op een rekening-courant van de SVB bij de Minister van Financiën. De Minister kan, na overleg
      met de SVB, van dit bedrag afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0030013#Artikel4
    url: https://wetten.overheid.nl/BWBR0030013/2011-06-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0030013
        artikel: '4'
  - number: '6'
    text: |-
      1 Uiterlijk op 1 juli dient de SVB de afrekening van KOB en de uitvoeringskosten met betrekking tot de KOB over het
      afgelopen kalenderjaar bij de Minister in.

      2 In de afrekening van de KOB en de uitvoeringskosten met betrekking tot de KOB wordt, op basis van de
      jaarrekening, bedoeld in [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], de
      kasstroom inzichtelijk gemaakt en wordt deze afzonderlijk vermeld voor de uitgaven en ontvangsten met betrekking
      tot de KOB.

      3 Op grond van de afrekening van de KOB en de uitvoeringskosten met betrekking tot de KOB vindt voor 15 augustus
      een betaling plaats ten gunste of ten laste van de SVB.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
    url: https://wetten.overheid.nl/BWBR0030013/2011-06-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
  - number: '7'
    text: |-
      De Minister stelt jaarlijks voor 31 oktober de omvang van de middelen tot dekking van de uitgaven KOB ten laste van
      de SVB over het afgelopen kalenderjaar vast.
    url: https://wetten.overheid.nl/BWBR0030013/2011-06-01#Artikel7
  - number: '8'
    text: |-
      Voor het jaar 2011:

      a. wordt de raming, bedoeld in [artikel 2][ref1], uiterlijk op 15 juni 2011 verstrekt, en

      b. wordt de raming, bedoeld in [artikel 4][ref2], afzonderlijk van het jaarplan met begroting, bedoeld in
      [artikel 46, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], uiterlijk op 15 juni
      2011 verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030013#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030013#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel46
    url: https://wetten.overheid.nl/BWBR0030013/2011-06-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0030013
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0030013
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '46'
  - number: '9'
    text: |-
      Deze regeling treedt in werking met ingang van 1 juni 2011, waarbij [artikel 8][ref1] vervalt met ingang van
      1 januari 2012.


      [ref1]: https://wetten.overheid.nl/BWBR0030013#Artikel8
    url: https://wetten.overheid.nl/BWBR0030013/2011-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0030013
        artikel: '8'
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Regeling bekostiging koopkrachttegemoetkoming oudere belastingplichtigen.'
    url: https://wetten.overheid.nl/BWBR0030013/2011-06-01#Artikel10
