---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_aanwijzing_nationaal_park_zuid_kennemerland
regulatory_layer: WET
publication_date: '2007-08-15'
valid_from: '1999-03-13'
bwb_id: BWBR0007654
url: https://wetten.overheid.nl/BWBR0007654/1999-03-13
preamble:
  text: |-
    Gezien het advies van de Voorlopige Commissie Nationale Parken van 3 mei 1995;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

             minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



             overlegorgaan:

              overlegorgaan als bedoeld in [artikel 3][ref1];



             nationaal park:

              gebied zoals omschreven in het Structuurschema Groene Ruimte (Kamerstukken II 1992-1993, 22 880 nr. 5,
      p. 99).


      [ref1]: https://wetten.overheid.nl/BWBR0007654#Artikel3
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007654
        artikel: '3'
  - number: '2'
    text: |-
      Als nationaal park wordt aangewezen het gebied Zuid-Kennemerland, zoals aangegeven op de kaart die als bijlage
      behoort bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel2
  - number: '3'
    text: Er is een overlegorgaan nationaal park Zuid-Kennemerland.
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel3
  - number: '4'
    text: |-
      Het overlegorgaan heeft tot taak zorg te dragen voor de inrichting en het beheer van het nationaal park Zuid-
      Kennemerland. Daartoe behoort onder meer:
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel4
  - number: 4.a
    text: het opstellen en actualiseren van het beheers- en inrichtingsplan;
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel4
  - number: 4.b
    text: |-
      het streven naar onderlinge afstemming van alle voor de inrichting en het beheer van belang zijnde plannen en
      activiteiten;
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel4
  - number: 4.c
    text: |-
      het doen van voorstellen aan de minister voor de besteding van de voor het nationaal park Zuid-Kennemerland
      beschikbare middelen in het kader van een jaarlijks voor te stellen activiteitenprogramma met bijbehorende
      begroting;
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel4
  - number: 4.d
    text: |-
      besteding van gelden op basis van het door de minister goed te keuren bestedingsprogramma, het opstellen van
      projectplannen, controle op de besteding van gelden en coördinatie van de uitvoering van projecten binnen het kader
      van het beheers- en inrichtingsplan;
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel4
  - number: 4.e
    text: |-
      het opstellen van een meerjarenprogramma voorlichting en educatie, ter bevordering en coördinatie van voorlichting
      en educatie met betrekking tot het nationaal park Zuid-Kennemerland.
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel4
  - number: '5'
    text: |-
      Het overlegorgaan voert zijn taak uit overeenkomstig het beheers- en inrichtingsplan voor het nationaal park Zuid-
      Kennemerland van april 1994, zoals goedgekeurd bij brief van 25 juli 1995, kenmerk N. 955772.
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel5
  - number: '6'
    text: 'In het overlegorgaan hebben zitting:'
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel6
  - number: 6.a
    text: één door de minister te benoemen lid, tevens voorzitter;
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel6
  - number: 6.b
    text: 'zeven door de minister te benoemen leden, als vertegenwoordiger en op voordracht van onderscheidenlijk:'
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel6
  - number: 6.b.1º
    text: de provincie Noord-Holland;
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel6
  - number: 6.b.2º
    text: de gemeente Bloemendaal;
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel6
  - number: 6.b.3º
    text: de gemeente Velsen;
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel6
  - number: 6.b.4º
    text: het gewest Zuid-Kennemerland;
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel6
  - number: 6.b.5º
    text: NV Waterleidingbedrijf Zuid-Kennemerland;
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel6
  - number: 6.b.6º
    text: de Stichting Het Nationale Park de Kennemerduinen;
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel6
  - number: 6.b.7º
    text: de Vereniging Natuurmonumenten;
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel6
  - number: 6.b.8º
    text: de gemeente Zandvoort;
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel6
  - number: 6.b.9º
    text: het Staatsbosbeheer;
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel6
  - number: 6.c
    text: |-
      één lid als vertegenwoordiger van de kleine particuliere eigenaren, door de minister te benoemen op voordracht van
      het overlegorgaan;
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel6
  - number: 6.d
    text: de Directeur van de Directie Noordwest van het Ministerie van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel6
  - number: '7.1'
    text: |-
      Het secretariaat van het overlegorgaan berust bij een door de minister, op voordracht van de provincie Noord-
      Holland, te benoemen ambtenaar van die provincie.
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel7
  - number: '7.2'
    text: |-
      Het overlegorgaan regelt de openbaarheid en de plaats van zijn vergadering, alsmede de overige aspecten van zijn
      inrichting en werkwijze.
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel7
  - number: '7.3'
    text: Het overlegorgaan brengt jaarlijks van zijn werkzaamheden verslag uit aan de minister.
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel7
  - number: '8'
    text: |-
      Indien in het overlegorgaan belangrijke verschillen van inzicht blijken te bestaan, doet de voorzitter van het
      over- legorgaan daarvan mededeling aan de minister, die daarop de naar zijn oordeel nodige stappen onderneemt.
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel8
  - number: '9'
    text: De Regeling aanwijzing nationaal park in oprichting Zuid-Kennemerland wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel9
  - number: '10'
    text: Deze regeling treedt in werking met ingang van 21 november 1995.
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel10
  - number: '11'
    text: 'Deze regeling kan worden aangehaald als: Regeling aanwijzing nationaal park Zuid-Kennemerland.'
    url: https://wetten.overheid.nl/BWBR0007654/1999-03-13#Artikel11
