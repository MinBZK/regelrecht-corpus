  - number: '9'
    text: 'Deze regeling wordt aangehaald als: Regeling samenloop arbeidsongeschiktheidsuitkering met inkomen.'
    url: https://wetten.overheid.nl/BWBR0006468/2012-01-01#Artikel9
  - number: '10'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 augustus 1993.

      Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006468/2012-01-01#Artikel10
