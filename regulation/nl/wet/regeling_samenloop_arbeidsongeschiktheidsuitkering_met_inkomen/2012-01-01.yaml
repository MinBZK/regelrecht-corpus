preamble:
  text: |-
    Gelezen de adviezen van de Sociale Verzekeringsraad van 4 juni 1992, nr. 922639, van 18 maart 1993, nr. 931476 en
    van 21 oktober 1993, nr. 935086;

    Gelet op artikel 33, vijfde en zesde lid, van de Algemene Arbeidsongeschiktheidswet en artikel 44, vijfde en zesde
    lid, van de Wet op de arbeidsongeschiktheidsverzekering;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006468/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            WAO:

              [Wet op de arbeidsongeschiktheidsverzekering][ref1];



            b
            Waz:

              [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2];



            c
            Wet Wajong:

              [ Wet werk en arbeidsondersteuning jonggehandicapten][ref3];



            d
            ZW:

              [Ziektewet][ref4];



            e
            WW:

              [Werkloosheidswet][ref5];



            f
            verlof:

              een tussen de werkgever en de werknemer voor een gedeelte of het geheel van de arbeidstijd overeengekomen
      periode, waarin de werknemer geen arbeid jegens de werkgever verricht;



            g
            pensioen of prepensioen:

              een uit een dienstbetrekking voortvloeiende periodieke uitkering bij wijze van oudedagsvoorziening, dan wel
      een uitkering die voorafgaat aan die uitkering of het bereiken van de leeftijd van 65 jaar.


