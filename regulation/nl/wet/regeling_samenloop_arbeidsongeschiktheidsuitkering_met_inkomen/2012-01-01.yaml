    text: |-
      1 Indien de uitkering, bedoeld in [artikel 2][ref1], door toedoen van de betrokkene of in
      verband met het doormaken van een wachtperiode niet wordt uitbetaald, wordt voor de toepassing
      van [artikel 44, eerste lid, van de WAO][ref2], [artikel 58, eerste lid, van de Waz][ref3] en
      [artikel 3:48, eerste lid, van de Wet Wajong][ref4] gehandeld alsof die uitkering wel is uitbetaald.

      2 Indien degene op wie [artikel 44 van de WAO][ref5], [artikel 58 van de Waz][ref6] of
      [artikel 3:48 van de Wet Wajong][ref7] van toepassing is recht heeft op een uitkering als bedoeld in
      [artikel 2, eerste lid, onderdeel a, d of h][ref8], wordt voor de toepassing van genoemde artikelen 44, 58 en 3:48
      gehandeld alsof hij een uitkering krachtens de [ZW][ref9], onderscheidenlijk de [WW][ref10], onderscheidenlijk
      [hoofdstuk 3, afdeling 2, van de Wet arbeid en zorg][ref11], ontvangt, gelijk aan het inkomen, waarmee laatstelijk
      vóór de aanvang van de ongeschiktheid tot werken, onderscheidenlijk de werkloosheid, onderscheidenlijk het ontstaan
      van het recht op uitkering op grond van hoofdstuk 3, afdeling 2, van de Wet arbeid en zorg bij de toepassing van
      laatstgenoemde artikelen rekening is gehouden.

      3 Het aan de persoon, bedoeld in het eerste, tweede, vijfde of zesde lid, uit te betalen
      bedrag aan arbeidsongeschiktheidsuitkering wordt niet verder beperkt dan tot het volle
      bedrag van de arbeidsongeschiktheidsuitkering, verminderd met het bedrag van de in
      [artikel 2, eerste lid, onderdeel a, d of h][ref12], bedoelde uitkering dan wel het op grond van
      [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref13] ontvangen loon.

      4 Indien degene op wie [artikel 44 van de WAO][ref14], [artikel 58 van de WAZ][ref15] of
      [artikel 3:48 van de Wet Wajong][ref16] van toepassing is, met verlof is dan wel pensioen of prepensioen ontvangt
      wordt voor de toepassing van genoemde artikelen 44, 58 en 3:48 gehandeld alsof hij tijdens dat verlof dan wel
      tijdens het ontvangen van dat pensioen of prepensioen een inkomen heeft dat gelijk is aan het inkomen waarmee
      laatstelijk vóór de aanvang van het verlof dan wel het ontvangen van pensioen of prepensioen bij de toepassing van
      die artikelen rekening is gehouden.

      5 Indien geen recht op doorbetaling van loon of bezoldiging bestaat door toepassing van
      [artikel 629, derde of negende lid, van Boek 7 van het Burgerlijk Wetboek][ref17] of een algemeen verbindend
      voorschrift als bedoeld in [artikel 76b, eerste tot en met derde lid, van de ZW][ref18], wordt voor de
      toepassing van [artikel 44, eerste lid, van de WAO][ref19], [artikel 58, eerste lid, van de Waz][ref20] en
      [artikel 3:48, eerste lid, van de Wet Wajong][ref21] het loon of bezoldiging in aanmerking genomen als ware er wel
      recht op doorbetaling.

      6 Indien geen recht bestaat op doorbetaling van loon of bezoldiging die naar aard en strekking overeenkomt met
      loon als bedoeld in [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref22] of bezoldiging als bedoeld in
      [artikel 76a van de ZW][ref23], op gronden die naar aard en strekking overeenkomen met artikel 629, derde of
      negende lid, van Boek 7 van het Burgerlijk Wetboek of [artikel 76b, eerste tot en met derde lid, van de ZW][ref24],
      wordt voor de toepassing van [artikel 44, eerste lid, van de WAO][ref25],
      [artikel 58, eerste lid, van de Waz][ref26] en [artikel 3:48, eerste lid, van de Wet Wajong][ref27] het loon of
      bezoldiging in aanmerking genomen als ware er wel recht op doorbetaling.

      7 Voor de toepassing van [artikel 2, tweede lid, het tweede, vierde, vijfde of zesde lid][ref28], wordt bij een per
      aangiftetijdvak wisselend inkomen in afwijking van het tweede, vierde, vijfde of zesde lid als inkomen aangemerkt
      het gemiddelde van het inkomen in de drie aangiftetijdvakken voor het aangiftetijdvak waarin recht ontstond op
      loondoorbetaling, bedoeld in artikel 2, tweede lid, het vijfde of zesde lid, recht ontstond op uitkering, bedoeld
      in het tweede lid dan wel, waarin het pensioen, prepensioen of verlof, bedoeld in het vierde lid, aanving.


