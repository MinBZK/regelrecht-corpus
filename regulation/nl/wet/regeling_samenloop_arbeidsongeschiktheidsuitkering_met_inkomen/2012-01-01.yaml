  - number: '8'
    text: |-
      1 Deze regeling, zoals die luidde op de dag voor inwerkingtreding van de regeling van de Staatssecretaris van
      Sociale Zaken en Werkgelegenheid van 12 december 2011, nr IVV/I/2011/22179, blijft van toepassing op de persoon
      op wie [artikel 44 van de WAO][ref1], [artikel 58 van de WAZ][ref2] of [artikel 3:48 van de Wet Wajong][ref3] van
      toepassing was op die dag tot het moment dat dat artikel niet meer van toepassing is.

      2 Ten aanzien van de persoon, bedoeld in het eerste lid, wordt tot het tijdstip, bedoeld in het eerste lid voor
      ‘inkomsten uit arbeid’ gelezen: inkomen.


