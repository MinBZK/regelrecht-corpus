  - number: '4'
    text: |-
      1 Ten aanzien van de persoon:

      a. op wie [artikel 44, eerste lid, van de WAO][ref1], [artikel 58, eerste lid, van de Waz][ref2] of
      [artikel 3:48, eerste lid, van de Wet Wajong][ref3] van toepassing is;

      b. voor wie loondispensatie is verkregen als bedoeld in
      [artikel 7, tweede lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref4]
      zoals dat artikellid luidde op de dag voordat het op grond van
      [artikel 2.10 van de Wet invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref5] is vervallen of
      als bedoeld in [artikel 3:63 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref6]; en

      c. die noodzakelijke persoonlijke ondersteuning geniet:

      1º. als bedoeld in [artikel 31, tweede lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref7]
      zoals dat artikellid luidde op de dag voordat het op grond van
      [artikel 2.10 van de Wet invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref8] is vervallen of
      als bedoeld in [artikel 35 van de Wet werk en inkomen naar arbeidsvermogen][ref9]; dan wel

      2º. die voldoet aan dezelfde voorwaarden op grond waarvan persoonlijke ondersteuning genoten zou kunnen
      worden als bedoeld in [artikel 31, tweede lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref10]
      zoals dat artikellid luidde op de dag voordat het op grond van
      [artikel 2.10 van de Wet invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref11] is vervallen
      of als bedoeld in [artikel 35 van de Wet werk en inkomen naar arbeidsvermogen][ref12], maar hiervoor niet in
      aanmerking komt, aangezien deze persoon reeds op grond van een andere regeling deze ondersteuning geniet,

      is het tweede lid van toepassing.

      2 Indien de som van het per dag tot uitbetaling komende bedrag aan arbeidsongeschiktheidsuitkering van de in het
      eerste lid bedoelde persoon en het door die persoon per dag genoten bedrag aan inkomen, minder bedraagt dan het bij
      de verrichte arbeid behorende rechtens geldende loon, wordt de arbeidsongeschiktheidsuitkering verhoogd totdat deze
      som gelijk is aan dat rechtens geldende loon, doch ten hoogste tot 120% van het minimumloon.

      3 Het tweede lid is eveneens van toepassing ten aanzien van de persoon die:

      a. geen begeleiding meer op zijn werkplek heeft als bedoeld in
      [artikel 7, eerste lid, onderdeel b, van de Wet sociale werkvoorziening][ref13], maar die wel voldoet aan de
      voorwaarden van het eerste lid, onderdeel a en b, zolang hij werkzaam blijft in de dienstbetrekking waarvoor die
      begeleiding was verkregen; of

      b. geen noodzakelijke persoonlijke ondersteuning meer geniet als bedoeld in het eerste lid, onderdeel c, maar
      die wel voldoet aan de voorwaarden van het eerste lid, onderdeel a en b, zolang hij werkzaam blijft in de
      dienstbetrekking waarvoor die persoonlijke ondersteuning was verkregen.

      4 Onder het in het tweede lid bedoelde minimumloon wordt verstaan het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref14], of, indien
      het een persoon jonger dan 23 jaar betreft, het voor zijn leeftijd geldende minimumloon per maand, bedoeld in
      [artikel 7, derde lid][ref15], en artikel 8, derde lid, van genoemde wet, gedeeld door 21,75. Indien werkgever en
      werknemer een arbeidsduur zijn overeengekomen die korter is dan de normale arbeidsduur dienen het in het tweede lid
      bedoelde rechtens geldende loon en het minimumloon naar evenredigheid te worden verminderd.

      5 Aan de in het eerste lid bedoelde persoon wordt geen hoger bedrag aan arbeidsonge-schiktheidsuitkering
      uitbetaald dan het bedrag aan arbeidsongeschiktheidsuitkering dat tot uitbetaling zou zijn gekomen als
      [artikel 44 van de WAO][ref16], [artikel 58 van de Waz][ref17] of [artikel 3:48 van de Wet Wajong][ref18] op die
      persoon niet van toepassing zouden zijn geweest.


