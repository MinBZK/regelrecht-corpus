    text: |-
      Indien [artikel 4, eerste of derde lid][ref1], van toepassing is, is [artikel 44, eerste lid, van de WAO][ref2],
      [artikel 58, eerste lid, van de WAZ][ref3] of [artikel 3:48, eerste lid, van de Wet Wajong][ref4] voor onbeperkte
      duur van toepassing.


