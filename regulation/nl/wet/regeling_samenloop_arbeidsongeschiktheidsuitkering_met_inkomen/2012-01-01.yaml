  - number: '6'
    text: |-
      [Artikel 3, vierde lid][ref1], is niet van toepassing op uitkeringen die zijn verleend voor de datum van
      inwerkingtreding van de Regeling van de Minister van Sociale Zaken en Werkgelegenheid van 6 april 2009, nr. IVV/
      I/09/5652 tot wijziging van de Regeling samenloop arbeidsongeschiktheidsuitkering met inkomsten uit arbeid in
      verband met de bepaling van inkomsten uit arbeid tijdens een verlofperiode (Stcrt. 2009, 81) als degene die
      recht heeft op een arbeidsongeschiktheidsuitkering met verlof is dan wel pensioen of prepensioen ontvangt, met
      dien verstande dat in geval van verlof artikel 3, vierde lid, buiten toepassing blijft tot het einde van die
      verlofperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0006468#Artikel3
    url: https://wetten.overheid.nl/BWBR0006468/2012-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006468
        artikel: '3'
  - number: '7'
    text: |-
      [Artikel 3, vierde lid][ref1], is niet van toepassing op de werknemer die een arbeidsovereenkomst als bedoeld in de
      [hoofdstukken 2][ref2] of [3 van de Wet sociale werkvoorziening][ref3] is aangegaan en die:

      a. in de periode van 1 mei 2009 tot 1 juli 2012 prepensioen is gaan ontvangen of

      b. in de periode van 1 mei 2009 tot 1 juli 2012 de normpensioenleeftijd, bedoeld in artikel 1.1, onderdeel B, van
      het Pensioenreglement SW (in werking getreden op 1 januari 2006 en laatstelijk gewijzigd op 7 maart 2008) bereikt
      en op of na 1 juli 2012 prepensioen gaat ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006468#Artikel3
