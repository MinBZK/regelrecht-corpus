    text: |-
      1 Onder inkomen als bedoeld in [artikel 44, eerste lid, van de WAO][ref1],
      [artikel 58, eerste lid, van de Waz][ref2] en [artikel 3:48, eerste lid, van de Wet Wajong][ref3], worden mede
      verstaan de volgende uitkeringen, indien deze ter zake van die arbeid worden verleend:

      a. een uitkering krachtens de [ZW][ref4], waaronder begrepen een uitkering op grond van
      [artikel 46 van die wet][ref5];

      b. een uitkering bij ziekte krachtens een regeling, welke geldt voor personen, die op grond van
      [artikel 6, eerste lid, onderdeel a of b, van de ZW][ref6] niet ingevolge die wet verzekerd zijn;

      c. een uitkering bij ziekte krachtens de sociale wetgeving van een ander land;

      d. een uitkering krachtens de [WW][ref7];

      e. een uitkering bij werkloosheid krachtens een regeling, welke geldt voor personen, die op grond van
      [artikel 6, onderdeel a of b, van de WW][ref8], niet ingevolge die wet verzekerd zijn;

      f. een uitkering bij werkloosheid krachtens de sociale wetgeving van een ander land;

      g. een uitkering als bedoeld in de [artikelen 6][ref9], [51][ref10] en
      [131 van de Algemene pensioenwet politieke ambtsdragers][ref11];

      h. een uitkering op grond van [hoofdstuk 3][ref12], [afdeling 2, van de Wet arbeid en zorg][ref13];

      i. een uitkering bij zwangerschap, bevalling, adoptie of pleegzorg krachtens de sociale wetgeving van een ander
      land.

      2 Ingeval recht ontstaat op doorbetaling van loon als bedoeld in
      [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref14] of van bezoldiging als bedoeld in
      [artikel 76a van de Ziektewet][ref15], wordt tevens onder inkomen verstaan het inkomen dat werd genoten in het
      aangiftetijdvak voor het aangiftetijdvak waarin recht ontstond op die doorbetaling van loon of bezoldiging.


