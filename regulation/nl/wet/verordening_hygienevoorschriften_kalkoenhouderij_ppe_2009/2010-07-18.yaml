  - number: '2'
    text: |-
      1 De ondernemer neemt de volgende hygiënemaatregelen:

      a. binnen de bedrijfsgebouwen worden geen andere dieren dan kalkoenen gehouden

      b. indien, sier- of nutsgevogelte wordt gehouden op het perceel waarop het kalkoenbedrijf of de
      kalkoenkuikenbroederij wordt uitgeoefend, worden deze dieren achter een afscheiding of in een volière gehouden,
      waardoor deze dieren niet in het bedrijfsgebouw kunnen komen en de verzorging van deze dieren strikt gescheiden
      wordt gehouden van de kalkoenen en de broedeieren;

      c. het bedrijfsgebouw is zodanig ingericht dat vogels het bedrijfsgebouw niet binnen kunnen komen;

      d. bezoekers wordt alleen toegang tot het bedrijfsgebouw verschaft, indien dit voor de bedrijfsvoering strikt
      noodzakelijk is en indien bezoekers handelen overeenkomstig de voorwaarden van de persoonlijke en bedrijfshygiëne;

      e. alle op het bedrijf aanwezige personen nemen de persoonlijke en bedrijfshygiëne volledig in acht;

      f. alle personen trekken vóór het betreden van het schone deel van het bedrijfsgebouw visueel schone
      bedrijfskleding en staleigen schoeisel aan;

      g. op elk bedrijf is in ten minste één bedrijfsgebouw een visueel schone, functionerende handenwasgelegenheid
      aanwezig, waarin zich ten minste een wasbak met afvoer, water, zeep en een handdoek bevindt;

      h. op elk opfokbedrijf, fokbedrijf, vermeerderingsbedrijf en kalkoenkuikenbroederij is een functionerende douche
      aanwezig;

      i. personen mogen de stal of de kalkoenkuikenbroederij slechts betreden nadat zij de handen hebben gewassen en, in
      het geval van een opfokbedrijf, fokbedrijf, vermeerderingsbedrijf of kalkoenkuikenbroederij, hebben gedoucht;

      j. een ongediertebestrijdingsplan wordt opgesteld en uitgevoerd, tenzij wordt gewerkt met een professioneel
      ongediertebestrijdingsbedrijf dat ten minste één maal per twee maanden op het bedrijf langskomt om ongedierte te
      bestrijden;

      k. de resultaten van acties met betrekking tot wering, signalering en bestrijding van ongedierte worden vastgelegd
      in het ongediertebestrijdingsplan en de acties worden, afhankelijk van de resultaten, geïntensiveerd;

      l. overeenkomstig door het bestuur bij besluit vast te stellen voorschriften de kwaliteit van het drinkwater
      te waarborgen en de resultaten van de door een HOSOWO-instantie uitgevoerde analyse van het drinkwateronderzoek
      gedurende twee jaren te bewaren;

      m. een kalkoenkuikenbroederij is zodanig ingericht dat geen kruisbesmetting met Salmonella kan ontstaan;

      n. het perceel waarop het kalkoenbedrijf wordt uitgeoefend is zodanig ingericht dat de perceelgrenzen herkenbaar
      zijn en dat voor bezoekers duidelijk is waar zij zich moeten melden;

      o. het bedrijfsgebouw en de inventaris alsmede het perceel waarop het kalkoenbedrijf of de kalkoenkuikenbroederij
      wordt uitgeoefend zijn bezemschoon, in het bijzonder de directe omgeving van de stal, zodanig dat geen ongedierte
      wordt aangetrokken;

      p. het bedrijfsgebouw is zodanig ingericht dat ongehinderde toegang door derden tot de stallen of de
      kalkoenkuikenbroederij niet mogelijk is;

      q. in elke stal is een voorruimte aanwezig die volledig is afgescheiden van de ruimte waarin de kalkoenen gehouden
      worden;

      r. bij elke stal of kalkoenkuikenbroederij is een fysieke scheiding aangebracht tussen het schone deel en het vuile
      deel waarbinnen van schoeisel wordt gewisseld;

      s. in het schone deel van de stal of de kalkoenkuikenbroederij is voldoende visueel schoon schoeisel aanwezig;

      t. indien op een kalkoenbedrijf meerdere leeftijdsgroepen kalkoenen aanwezig zijn, is per leeftijdsgroep in de
      fysieke scheiding bij de stal visueel schone bedrijfskleding aanwezig en wordt er op toegezien dat personen het
      schone deel van de stal slechts betreden indien zij visueel schone bedrijfskleding hebben aangetrokken die hoort
      bij de betreffende leeftijdsgroep;

      u. de loop- of rijroutes van en naar het bedrijfsgebouw zijn zodanig verhard dat deze gereinigd kunnen worden;

      v. op het perceel is een functionerende afwatering ten opzichte van de stallen aanwezig;

      w. de voedersilo is aan de buitenkant visueel schoon, is geplaatst op een verharde ondergrond en wordt van buiten
      de stallen gevuld; indien meerdere voedersilo’s op het bedrijf aanwezig zijn, is iedere voedersilo voorzien van een
      uniek nummer;

      x. bij het lossen van het voeder wordt gebruik gemaakt van een bedrijfseigen of eenmalig te gebruiken
      stofopvangmiddel;

      y. voeder, bodem- en neststrooisel en verpakkingsmateriaal worden zodanig opgeslagen dat deze schoon, droog en
      schimmelvrij blijven;

      z. voeder dat na het leegmaken van een stal nog aanwezig is in het voedersysteem wordt buiten de silo afgevoerd,
      zodanig dat het niet meer in contact kan komen met kalkoenen.

      2 Het bestuur kan bij besluit nadere regels vaststellen ten aanzien van het in het eerste lid bepaalde.

      3 Het bestuur stelt bij besluit de erkenningsvoorwaarden en werkwijzen voor HOSOWO-instanties vast.
    url: https://wetten.overheid.nl/BWBR0028052/2010-07-18#Artikel2
  - number: '3'
    text: |-
      1 De ondernemer die een kalkoenbedrijf uitoefent verwijdert onverwijld nadat hij de kalkoenen uit de stal heeft
      afgevoerd de mest en het strooisel die in deze stal aanwezig zijn, en reinigt en ontsmet vervolgens de stal.

      2 De ondernemer die een vleeskalkoenbedrijf uitoefent laat nadat hij de stal heeft gereinigd en ontsmet als bedoeld
      in het eerste lid, één maal per kalenderjaar voorafgaand aan het plaatsen van een nieuw koppel een hygiënogram
      uitvoeren door een HOSOWO-instantie in de stallen waar eendagskuikens worden geplaatst.

      3 De ondernemer die een fokbedrijf, opfokbedrijf of vermeerderingsbedrijf uitoefent laat nadat hij de stal heeft
      gereinigd en ontsmet, als bedoeld in het eerste lid, één maal per kalenderjaar voorafgaand aan het plaatsen van een
      nieuw koppel een hygiënogram uitvoeren door een HOSOWO-instantie.

      4 De ondernemer die een kalkoenkuikenbroederij uitoefent reinigt en ontsmet onverwijld na iedere aflevering van de
      eendagskuikens, de gebruikte lokalen.

      5 De ondernemer die een kalkoenkuikenbroederij uitoefent laat zes keer per kalenderjaar een hygiëneonderzoek
      uitvoeren door GD.

      6 De ondernemer die een kalkoenkuikenbroederij uitoefent kan een deel van het in het vijfde lid bedoelde
      hygiëneonderzoek zelf uitvoeren.

      7 Het bestuur stelt bij besluit nadere regels vast ten aanzien van het in het tweede en derde lid bedoelde
      hygiënogram en het in het vierde en vijfde lid bedoelde hygiëneonderzoek. De ondernemer bewaart de uitslag van het
      hygiënogram en het hygiëneonderzoek gedurende ten minste twee jaren.
    url: https://wetten.overheid.nl/BWBR0028052/2010-07-18#Artikel3
  - number: '4'
    text: |-
      1 De ondernemer draagt er zorg voor dat een onderzoek van koppels kalkoenen en broedeieren op de aanwezigheid van
      Salmonella plaatsvindt door middel van monstername, detectie en serotypering van de genomen monsters.

      2 De ondernemer die een vleeskalkoenbedrijf uitoefent draagt er zorg voor dat onderzoek op de aanwezigheid van
      Campylobacter door middel van monstername en detectie van de genomen monsters plaatsvindt, voordat het betreffende
      koppel van het vleeskalkoenbedrijf wordt afgevoerd naar de slachterij.

      3 a. De ondernemer die een vleeskalkoenbedrijf uitoefent voert de in het eerste lid bedoelde monstername uit bij
      een koppel vleeskalkoenen maximaal 21 dagen voordat dit koppel vleeskalkoenen van het vleeskalkoenbedrijf wordt
      afgevoerd naar de slachterij;

      b. De voorzitter laat bij tien procent van de vleeskalkoenbedrijven één maal per kalenderjaar een monstername
      uitvoeren;

      c. De in b. genoemde monstername kan in de plaats treden van de in a. genoemde monstername.

      4 a. De ondernemer die een fokbedrijf of vermeerderingsbedrijf uitoefent, voert de in het eerste lid bedoelde
      monstername om de drie weken uit, vanaf de leeftijd van 30 weken van het koppel, op het fokbedrijf of
      vermeerderingsbedrijf;

      b. De ondernemer die een opfokbedrijf uitoefent, voert de in het eerste lid bedoelde monstername uit 1) bij de
      aankomst van de eendagskuikens op het bedrijf en 2) vier weken na plaatsing van het koppel en 3) twee weken voor
      overplaatsing van het koppel naar het fokbedrijf of vermeerderingsbedrijf;

      c. De voorzitter laat bij tien procent van de fokbedrijven of vermeerderingsbedrijven één maal per kalenderjaar een
      monstername uitvoeren;

      d. De in c. genoemde monstername kan in de plaats treden van de in a. genoemde monstername.

      5 De detectie van Salmonella van de in het eerste, derde en vierde lid bedoelde monsters en de detectie van
      Campylobacter van de in het tweede lid bedoelde monsters, wordt uitgevoerd door een erkend laboratorium.

      6 Wanneer met het in het eerste lid bedoelde onderzoek de aanwezigheid van Salmonella is gedetecteerd, laat de
      ondernemer het monster serotyperen door een erkend laboratorium.

      7 Wanneer een erkend laboratorium het serotype van Salmonella heeft bepaald, meldt de ondernemer die een
      fokbedrijf, opfokbedrijf, vermeerderingsbedrijf of kalkoenkuikenbroederij uitoefent dit uiterlijk binnen
      één werkdag nadat de uitslag van de serotyopering bekend is aan GD en kan de voorzitter door GD een
      verificatieonderzoek laten uitvoeren van het bemonsterde koppel dan wel van het koppel waarvan de bemonsterde
      broedeieren afkomstig zijn.

      8 De ondernemer bewaart de resultaten van de in het eerste, tweede en vijfde lid bedoelde detectie, de
      resultaten van de in het zesde lid bedoelde serotypering en de resultaten van het in het zevende lid bedoelde
      verificatieonderzoek gedurende ten minste twee jaren.

      9 Het bestuur stelt bij besluit nadere regels vast ten aanzien van de wijze waarop en de frequentie waarmee de
      monstername plaatsvindt.

      10 Het bestuur stelt bij besluit nadere regels vast ten aanzien van de erkenningsvoorwaarden en werkwijzen van
      laboratoria.
    url: https://wetten.overheid.nl/BWBR0028052/2010-07-18#Artikel4
  - number: '5'
    text: |-
      1 De ondernemer meldt tijdig de resultaten van de detectie als bedoeld in
      [artikel 4, eerste, tweede en vijfde lid][ref1], de resultaten van de serotypering als bedoeld in artikel 4,
      zesde lid en de resultaten van het verificatieonderzoek als bedoeld in artikel 4, zevende lid, schriftelijk aan de
      leverancier en de afnemer van het koppel kalkoenen of van de broedeieren.

      2 De ondernemer meldt tijdig de resultaten van de detectie als bedoeld in
      [artikel 4, eerste, tweede en vijfde lid][ref2], de resultaten van de serotypering als bedoeld in artikel 4, zesde
      lid, en de resultaten van het verificatieonderzoek als bedoeld in artikel 4, zevende lid, aan het productschap.

      3 Het bestuur stelt bij besluit nadere regels vast omtrent de aard en de tijdigheid van de melding door de
      ondernemer van de resultaten van de detectie als bedoeld in [artikel 4, eerste, tweede, en vijfde lid][ref3], de
      resultaten van de serotypering als bedoeld in artikel 4, zesde lid en de resultaten van het verificatieonderzoek
      als bedoeld in artikel 4, zevende lid.


