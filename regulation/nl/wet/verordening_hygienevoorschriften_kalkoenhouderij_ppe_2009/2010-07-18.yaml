  - number: '8'
    text: |-
      1 Indien de voorzitter op grond van [artikel 6, tweede lid][ref1], een besmetting met de serotypen Salmonella
      enteritidis of Salmonella typhimurium vaststelt bij een koppel fokkalkoenen of vermeerderingskalkoenen, gelast de
      voorzitter de ondernemer die een kalkoenkuikenbroederij uitoefent:

      a. alle broedeieren die door het besmette koppel kalkoenen zijn geproduceerd en die reeds in de
      kalkoenkuikenbroederij zijn ingelegd, te laten behandelen als categorie 2-materiaal in de zin van Verordening (EG)
      nr.1774/2002; of

      b. alle broedeieren die door het besmette koppel kalkoenen zijn geproduceerd en die nog niet in de
      kalkoenkuikenbroederij zijn ingelegd een zodanige behandeling te laten ondergaan dat de uitschakeling van
      Salmonella gewaarborgd is; of

      c. alle broedeieren die door het besmette koppel kalkoenen zijn geproduceerd te laten vernietigen.

      2 De ondernemer is gehouden de in het eerste lid genoemde last onverwijld op te volgen.

      3 Het bestuur stelt bij besluit nadere regels vast ten aanzien van de maatregelen als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0028052#Artikel6
    url: https://wetten.overheid.nl/BWBR0028052/2010-07-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028052
        artikel: '6'
        paragraaf: '6'
  - number: '9'
    text: |-
      1 De voorzitter kan namens het bestuur, binnen het kader van door het bestuur bij besluit vastgestelde richtlijnen,
      op aanvraag, ontheffing verlenen van het bepaalde bij of krachtens deze verordening, en aan zodanige ontheffing
      voorschriften en beperkingen verbinden.

      2 Het bestuur kan bij besluit vrijstelling van het bij of krachtens deze verordening bepaalde verlenen aan
      ondernemers dan wel aan een groep van te onderscheiden categorieën ondernemers en aan een zodanige vrijstelling
      voorschriften en beperkingen verbinden.

      3 Een verleende ontheffing kan te allen tijde door de voorzitter worden ingetrokken en een verleende vrijstelling
      kan te allen tijde door het bestuur worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028052/2010-07-18#Artikel9
  - number: '10'
    text: |-
      1 De ondernemer die een kalkoenbedrijf uitoefent laat zich ten minste één maal per kalenderjaar op eigen kosten
      controleren op de naleving van het bepaalde bij of krachtens deze verordening door een erkende controleinstantie.

      2 De ondernemer die een kalkoenkuikenbroederij uitoefent laat zich iedere zes maanden op eigen kosten controleren
      op de naleving van het bepaalde bij of krachtens deze verordening door een erkende controle-instantie.

      3 De in het eerste en tweede lid bedoelde controle-instantie kan op aanvraag worden erkend door de voorzitter
      indien zij voldoet aan door het bestuur bij besluit vastgestelde erkenningsvoorwaarden welke strekken tot waarborg
      van de onafhankelijkheid en expertise van de controle-instantie.

      4 De erkenning kan onder voorwaarden worden verleend en kan worden ingetrokken indien niet meer aan de voorwaarden
      wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0028052/2010-07-18#Artikel10
  - number: '11'
    text: |-
      1 Met uitzondering van het bij of krachtens [artikel 6, eerste, vierde, vijfde en zevende lid][ref1],
      [artikel 7, eerste en tweede lid][ref2] en [artikel 8, tweede lid][ref3], bepaalde, wordt het toezicht op de
      naleving van het bij of krachtens de verordening bepaalde namens het productschap uitgeoefend door toezichthouders
      die hiervoor door het bestuur bij besluit zijn aangewezen.

      2 De ondernemer is verplicht:

      a. aan de door het bestuur aangewezen toezichthouders al die gegevens te verstrekken of te doen verstrekken, die
      nodig zijn voor de vervulling van hun taak;

      b. aan de door het bestuur aangewezen toezichthouders inzage te geven of te doen geven van die boeken en
      bescheiden, die nodig zijn voor de vervulling van hun taak;

      c. aan de door het bestuur aangewezen toezichthouders te allen tijde toegang te geven of te doen geven tot de
      bedrijfsruimten en tot die plaatsen of vervoermiddelen, waar of waarin voorraden, tot het bedrijf van de ondernemer
      behorende, zijn opgeslagen of worden vervoerd;

      d. te gedogen dat de door het bestuur aangewezen toezichthouders monsters nemen uit de voorraden, waaronder
      begrepen verpakkingsmateriaal, van het bedrijf van de ondernemer, ongeacht de plaats waar of waarin zich die
      voorraden bevinden en alsdan de van hem gevorderde medewerking verlenen overeenkomstig de aanwijzingen en het
      toezicht van die toezichthouders;

      e. voor het overige alle medewerking te verlenen ter vervulling van de aan de toezichthouders opgedragen taak.

      3 De in het eerste lid bedoelde toezichthouders zijn bevoegd om berechtingsrapporten op te maken ten behoeve
      van tuchtrechtelijke afhandeling van overtredingen van het bij of krachtens deze verordening bepaalde,
      met uitzondering van het bij of krachtens [artikel 6, eerste, vierde, vijfde en zevende lid][ref4],
      [artikel 7, eerste en tweede lid][ref5] en [artikel 8, tweede lid][ref6], bepaalde.


