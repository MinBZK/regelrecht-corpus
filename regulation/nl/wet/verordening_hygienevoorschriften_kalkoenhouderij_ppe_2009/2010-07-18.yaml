  - number: '6'
    text: |-
      1 De ondernemer die een fokbedrijf, opfokbedrijf of vermeerderingsbedrijf uitoefent, handelt in overeenstemming met
      het in artikel 2 van Verordening (EG) nr. 1177/2006 neergelegde verbod op het gebruik van antimicrobiële stoffen.

      2 De voorzitter stelt op grond van het onderzoek als bedoeld in [artikel 4, eerste lid][ref1], dan wel het
      verificatieonderzoek als bedoeld in artikel 4, zevende lid, een besmetting met de serotypen Salmonella enteritidis
      of Salmonella typhimurium vast bij een koppel dat zich op een fokbedrijf, opfokbedrijf of vermeerderingsbedrijf
      bevindt.

      3 In geval de voorzitter de in het tweede lid bedoelde besmetting met de serotypen Salmonella enteritidis of
      Salmonella typhimurium vaststelt bij een koppel, gelast de voorzitter de ondernemer het besmette koppel te laten
      ruimen en de broedeieren van dit koppel te laten verwerken of vernietigen.

      4 De ondernemer is gehouden de in het derde lid genoemde aan hem verstrekte last onverwijld op te volgen.

      5 Indien op grond van het verificatieonderzoek als bedoeld in [artikel 4, zevende lid][ref2], een besmetting
      met Salmonella bij een koppel is bevestigd, reinigt en ontsmet de ondernemer die een fokbedrijf, opfokbedrijf of
      vermeerderingsbedrijf uitoefent onverwijld de stal na het laten ruimen van het koppel dan wel na het afvoeren van
      het koppel uit de stal.

      6 Na het reinigen en ontsmetten, als bedoeld in het vijfde lid, laat de ondernemer die een fokbedrijf, opfokbedrijf
      of vermeerderingsbedrijf uitoefent de stal door een HOSOWO-instantie onderzoeken op de aanwezigheid van Salmonella.

      7 Indien met het onderzoek als bedoeld in het zesde lid, Salmonella in de stal is aangetoond, herhaalt de
      ondernemer die een fokbedrijf, opfokbedrijf of vermeerderingsbedrijf uitoefent de reiniging en ontsmetting van de
      stal totdat geen Salmonella meer in de stal wordt aangetoond.

      8 Na de herhaalde reiniging en ontsmetting als bedoeld in het zevende lid laat de ondernemer die een fokbedrijf,
      opfokbedrijf of vermeerderingsbedrijf de stal door een erkende HOSOWO-instantie onderzoeken op de aanwezigheid van
      Salmonella totdat geen Salmonella meer in de stal wordt aangetoond.

      9 Slechts indien op grond van in het zesde of achtste lid bedoelde onderzoek geen Salmonella in de stal meer wordt
      aangetoond, mag de ondernemer die een fokbedrijf, opfokbedrijf of vermeerderingsbedrijf uitoefent, een nieuw koppel
      in de stal plaatsen.

      10 Het bestuur kan bij besluit nadere regels vaststellen ten aanzien van de onderzoeken, het ruimen, het reinigen
      en ontsmetten en het verwerken of vernietigen van de broedeieren, als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0028052#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028052#Artikel4
    url: https://wetten.overheid.nl/BWBR0028052/2010-07-18#Artikel6
