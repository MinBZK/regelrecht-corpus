preamble:
  text: |-
    Gelet op de artikelen 3 en 3a van het Besluit bescherming tegen bepaalde zoönosen en bestrijding besmettelijke
    dierziekten en de artikelen 95 en 96 van de Regeling preventie, bestrijding en monitoring van besmettelijke
    dierziekten en zoönosen en TSE’s;

    Gelet op de artikelen 93, eerste lid, 95, 102 en 104 van de Wet op de bedrijfsorganisatie, en de artikelen 6 en 7
    van het Instellingsbesluit Productschap Pluimvee en Eieren;

    Gezien Richtlijn 2003/99/EG van het Europees Parlement en de Raad van 17 november 2003 inzake de bewaking van
    zoönoses en zoönoseverwekkers en houdende wijziging van Beschikking 90/424/EEG van de Raad en intrekking van
    Richtlijn 92/117/EEG van de Raad (PbEU L 325), Verordening (EG) nr. 2160/2003 van het Europees Parlement en de
    Raad van 17 november 2003 inzake de bestrijding van Salmonella en andere specifieke door voedsel overgedragen
    zoönoseverwekkers (PbEU L 325), Verordening (EG) Nr. 1003/2005 van de Commissie van 30 juni 2005 ter uitvoering
    van Verordening (EG) nr. 2160/2003 van het Europees Parlement en de Raad wat betreft een communautaire doelstelling
    voor het verminderen van de prevalentie van bepaalde serotypen salmonella bij vermeerderingskoppels van Gallus
    gallus en tot wijziging van Verordening (EG) nr. 2160/2003, Verordening (EG) nr. 1177/2006 van de Commissie van 1
    augustus 2006 ter uitvoering van Verordening (EG) nr. 2160/2003 van het Europees Parlement en de Raad wat betreft
    voorschriften voor het gebruik van specifieke bestrijdingsmethoden in het kader van de nationale programma’s voor
    de bestrijding van salmonella bij pluimvee, Verordening (EG) Nr. 584/2008 van de Commissie van 20 juni 2008 ter
    uitvoering van Verordening (EG) nr. 2160/2003 van het Europees Parlement en de Raad wat betreft een communautaire
    doelstelling voor het verminderen van de prevalentie van Salmonella Enteritidis en Salmonella Typhimurium bij
    kalkoenen, Verordening (EG) Nr. 213/2009 van de Commissie van 18 maart 2009 tot wijziging van Verordening (EG) nr.
    2160/2003 van het Europees Parlement en de Raad en Verordening (EG) nr. 1003/2005 wat betreft de bestrijding en de
    uitvoering van tests op de aanwezigheid van salmonella bij vermeerderingskoppels van Gallus gallus en kalkoenen en:

    Gezien de Wet tuchtrechtspraak bedrijfsorganisatie 2004;

