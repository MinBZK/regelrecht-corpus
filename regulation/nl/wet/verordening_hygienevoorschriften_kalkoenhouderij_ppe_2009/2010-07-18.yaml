  - number: '7'
    text: |-
      1 De ondernemer die een vleeskalkoenbedrijf uitoefent handelt in overeenstemming met het in artikel 2 van
      Verordening (EG) nr. 1177/2006 neergelegde verbod op het gebruik van antimicrobiële stoffen.

      2 Indien op grond van het onderzoek als bedoeld in [artikel 4, eerste lid][ref1], een besmetting met Salmonella
      bij een koppel vleeskalkoenen is aangetoond, reinigt en ontsmet de ondernemer die een vleeskalkoenbedrijf uitoefent
      onverwijld de stal na het afvoeren van het koppel uit deze stal.

      3 Na het reinigen en ontsmetten als bedoeld in het tweede lid laat de ondernemer die een vleeskalkoenbedrijf
      uitoefent de stal op de aanwezigheid van Salmonella onderzoeken door een HOSOWO-instantie.

      4 Indien met het onderzoek als bedoeld in het derde lid Salmonella in de stal is aangetoond mag de ondernemer die
      een vleeskalkoenbedrijf uitoefent een nieuw koppel vleeskalkoenen in de stal plaatsen en laat hij de stal, na het
      afvoeren van dit koppel, ontsmetten door een professioneel ontsmettingsbedrijf.

      5 Het bestuur stelt bij besluit nadere regels vast ten aanzien van het afvoeren van het koppel uit de stal, het
      reinigen en ontsmetten en het onderzoek, als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0028052#Artikel4
    url: https://wetten.overheid.nl/BWBR0028052/2010-07-18#Artikel7
