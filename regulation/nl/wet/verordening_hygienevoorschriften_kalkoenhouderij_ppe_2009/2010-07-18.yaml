articles:
  - number: '1'
    text: |-
      In deze verordening en de daarop berustende besluiten wordt verstaan onder:









                  1.


                  productschap


                  : Productschap Pluimvee en Eieren;




                  2.


                  bestuur


                  : het bestuur van het productschap;




                  3.


                  voorzitter


                  : de voorzitter van het productschap;




                  4.


                  kalkoenen


                  : pluimvee van de soort *meleagris gallopavo*, dat wordt opgefokt of gehouden voor de productie van
      broedeieren of vlees;




                  5.


                  vermeerderingskalkoenen


                  : kalkoenen van 72 uur en ouder bestemd voor de productie van broedeieren die bestemd zijn voor de
      productie van vleeskalkoenen;




                  6.


                  fokkalkoenen


                  : kalkoenen van 72 uur en ouder, bestemd voor de productie van broedeieren die zijn bestemd voor de
      productie van fokkalkoenen of vermeerderingskalkoenen;




                  7.


                  vleeskalkoenen


                  : kalkoenen van 72 uur en ouder, die worden gehouden voor de productie van vlees;




                  8.


                  broedeieren


                  : eieren afkomstig van kalkoenen, bestemd om te worden bebroed;




                  9.


                  eendagskuikens


                  : kalkoenen die nog geen 72 uur oud zijn;




                  10.


                  koppel


                  : alle kalkoenen met dezelfde gezondheidsstatus die in dezelfde stal of binnen dezelfde uitloopruimte
      worden geplaatst of gehouden en die een epidemiologische eenheid vormen;




                  11.


                  kalkoenbedrijf


                  : inrichting die wordt gebruikt voor het opfokken, fokken of houden van fokkalkoenen of vleeskalkoenen;




                  12.


                  fokbedrijf


                  : kalkoenbedrijf dat zich toelegt op de productie van broedeieren, bestemd voor de productie van
      fokkalkoenen of vermeerderingskalkoenen;




                  13.


                  vermeerderingsbedrijf


                  : kalkoenbedrijf dat zich toelegt op de productie van broedeieren, bestemd voor de productie van
      vleeskalkoenen;




                  14.


                  opfokbedrijf


                  : kalkoenbedrijf dat zich toelegt op het opfokken van fokkalkoenen of vermeerderingskalkoenen tot het
      voortplantingsstadium;




                  15.


                  vleeskalkoenbedrijf


                  : kalkoenbedrijf dat zich toelegt op het houden van vleeskalkoenen;




                  16.


                  kalkoenkuikenbroederij


                  : inrichting die wordt gebruikt voor het inleggen en uitbroeden van broedeieren onderscheidenlijk
      inrichting waarin één of meerdere vorengenoemde handelingen worden verricht;




                  17.


                  ondernemer


                  : een natuurlijk persoon of rechtspersoon die een kalkoenbedrijf of een kalkoenkuikenbroederij
      uitoefent;




                  18.


                  bedrijfsgebouw


                  : het gebouw waarin kalkoenen worden gehouden of broedeieren zijn ingelegd en de tot het gebouw
      behorende voorruimte, stallen en lokalen;




                  19.


                  ronde


                  : de periode van het plaatsen van een koppel tot het moment van:






                  a. overplaatsing van een koppel;






                  b. aflevering aan de slachterij; of






                  c. ruiming van een koppel;




                  20.


                  erkend laboratorium


                  : een laboratorium dat op basis van het
      [Besluit erkenningsvoorwaarden en werkwijzen laboratoria (PPE) 2009][ref1] door de voorzitter is erkend;




                  21.


                  hygiënogram


                  : een onderzoek naar de hygiënestatus van een stal nadat deze is gereinigd en ontsmet;




                  22.


                  hygiëneonderzoek


                  : een onderzoek naar de hygiënestatus van een kalkoenkuikenbroederij nadat deze is gereinigd en
      ontsmet;




                  23.


                  erkende HOSOWO-instantie


                  : een instantie die op basis van het
      [Besluit erkenningsvoorwaarden en werkwijzen HOSOWO-instanties (PPE) 2007][ref2] door de voorzitter is erkend;




                  24.


                  Salmonella


                  : alle typen Salmonella;




                  25.


                  Campylobacter


                  : alle typen Campylobacter;




                  26.


                  detectie


                  : het wel of niet aantonen van de aanwezigheid van Salmonella of Campylobacter in een monster door een
      erkend laboratorium;




                  27.


                  serotypering


                  : het bepalen van het serotype van Salmonella positieve monsters door een erkend laboratorium;




                  28.


                  verificatieonderzoek


                  : een onderzoek dat in opdracht van de voorzitter op een kalkoenbedrijf bij een koppel of broedeieren
      wordt uitgevoerd, met als doel de bevestiging dat in dit koppel of deze broedeieren de aanwezigheid van Salmonella
      is vastgesteld;




                  29.


                  GD


                  : Gezondheidsdienst voor Dieren B.V. te Deventer;




                  30.


                  ruimen


                  : het op last van de voorzitter verwijderen van kalkoenen van het kalkoenbedrijf;




                  31.


                  professioneel ontsmettingsbedrijf


                  : een ontsmettingsbedrijf dat een erkenning in het kader van de IKB PSB regeling heeft dan wel aan de
      voorzitter aantoont dat het gelijkwaardig is aan een in het kader van de IKB PSB regeling erkend bedrijf;




                  32.


                  overplaatsen


                  : het verplaatsen van een koppel naar een andere stal, ongeacht de leeftijd van het koppel;




                  33.


                  Verordening (EG) nr. 1177/2006


                  : Verordening (EG) nr. 1177/2006 van de Commissie van 1 augustus 2006 ter uitvoering van Verordening
      (EG) nr. 2160/2003 van het Europees Parlement en de Raad wat betreft voorschriften voor het gebruik van specifieke
      bestrijdingsmethoden in het kader van de nationale programma’s voor de bestrijding van salmonella bij pluimvee;




                  34.


                  Verordening (EG) nr. 1774/2002


                  : Verordening (EG) nr. 1774/2002 van het Europees parlement en de Raad van 3 oktober 2002 tot
      vaststelling van gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde dierlijke bijproducten;




                  35.


                  verwerken


                  : het zodanig behandelen van broedeieren van een met Salmonella besmet koppel dat de uitschakeling van
      Salmonella gewaarborgd is overeenkomstig de communautaire wetgeving inzake levensmiddelenhygiëne.


      [ref1]: https://wetten.overheid.nl/BWBR0027283
      [ref2]: https://wetten.overheid.nl/BWBR0023545
