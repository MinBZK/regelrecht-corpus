  - number: 41c
    text: |-
      1 De Autoriteit Consument en Markt stelt de tarieven, die kunnen verschillen voor de verschillende netbeheerders en
      voor onderscheiden tariefdragers, jaarlijks vast.

      2 De Autoriteit Consument en Markt kan de tarieven die zullen gelden in het jaar t corrigeren, indien de tarieven
      die golden in dat jaar of de jaren voorafgaand aan het jaar t:

      a. bij rechterlijke uitspraak of met toepassing van de [artikel 6:19][ref1] of
      [7:11 van de Algemene wet bestuursrecht][ref2] zijn gewijzigd;

      b. zijn vastgesteld met inachtneming van onjuiste of onvolledige gegevens en de Autoriteit Consument en
      Markt, indien zij de beschikking had over juiste of volledige gegevens, tarieven zou hebben vastgesteld die in
      aanmerkelijke mate zouden afwijken van de vastgestelde tarieven;

      c. zijn vastgesteld met gebruikmaking van geschatte gegevens en de feitelijke gegevens daarvan afwijken;

      d. zijn vastgesteld met gebruikmaking van gegevens omtrent kosten voor bepaalde diensten, terwijl netbeheerders die
      diensten in het jaar t of een gedeelte van jaar t niet hebben geleverd of voor die diensten geen of minder kosten
      hebben gemaakt;

      e. zijn vastgesteld op basis van de geschatte kosten als bedoeld in het zevende lid en de gerealiseerde efficiënte
      kosten die daarvan afwijken.

      3 Indien een voorstel niet binnen de termijn, bedoeld in [artikel 41b, eerste lid][ref3], aan de Autoriteit
      Consument en Markt is gezonden, stelt deze de tarieven voor de desbetreffende netbeheerder uit eigen beweging vast
      met inachtneming van artikel 41b.

      4 Indien de totale inkomsten aan het begin van de periode, bedoeld in [artikel 41, eerste lid][ref4],
      niet in overeenstemming zijn met het efficiënte kostenniveau inclusief een rendement dat in het economisch
      verkeer gebruikelijk is, kan de Autoriteit Consument en Markt bij de toepassing van de formule, genoemd in
      [artikel 41b, eerste lid, onderdeel d][ref5], in plaats van TIt-1, de totale inkomsten vaststellen op het
      efficiënte kostenniveau inclusief een rendement dat in het economisch verkeer gebruikelijk is.

      5 Indien een besluit op grond van [artikel 41, eerste lid][ref6], of [41a eerste lid][ref7], bij onherroepelijke
      rechterlijke uitspraak is vernietigd of bij een onherroepelijk besluit op bezwaar is herroepen, herberekent
      de Autoriteit Consument en Markt de tarieven, bedoeld in het eerste lid, met toepassing van de met
      inachtneming van die uitspraak of dat besluit op bezwaar gecorrigeerde methode onderscheidenlijk gecorrigeerde
      doelmatigheidskorting, kwaliteitsterm of rekenvolume, en verdisconteert zij de uitkomsten van deze herberekening
      in de eerstvolgende op grond van het eerste lid vast te stellen tarieven. Daarbij worden deze herberekening en de
      wijze waarop de uitkomsten daarvan in de tarieven zijn verdisconteerd separaat weergegeven.

      6 De Autoriteit Consument en Markt kan de tarieven die zullen gelden in het jaar t corrigeren met de
      gederfde inkomsten die voor netbeheerders zijn ontstaan door toepassing van een volumecorrectie op grond van
      [artikelen 29, zevende tot en met tiende lid][ref8], in 2014.

      7 De Autoriteit Consument en Markt betrekt bij het vaststellen van de tarieven:

      a. de geschatte vermogenskosten die de netbeheerder van het landelijk hoogspanningsnet in het jaar waarop het
      tarievenvoorstel betrekking heeft zal maken met betrekking tot nog niet in gebruik genomen investeringen, waarop de
      projectprocedure, bedoeld in [afdeling 5.2 van de Omgevingswet][ref9] van toepassing is;

      b. de geschatte kosten die de netbeheerder van het landelijk hoogspanningsnet heeft voor investeringen die in het
      jaar waarop het tarievenvoorstel betrekking heeft, in gebruik worden of zijn genomen, waarop de projectprocedure,
      bedoeld in [afdeling 5.2 van de Omgevingswet][ref10] van toepassing is.

      8 Indien de netbeheerder van het net op zee op grond van [artikel 42a, derde lid][ref11], een bedrag in rekening
      brengt bij de netbeheerder van het landelijk hoogspanningsnet wordt dat bedrag zonder toepassing van de formule,
      bedoeld in [artikel 41b, eerste lid, onderdeel d][ref12], toegevoegd aan de totale inkomsten uit de tarieven.


