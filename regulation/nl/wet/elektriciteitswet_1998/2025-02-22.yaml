  - number: 42d
    text: |-
      1 De netbeheerder van het net op zee zendt jaarlijks voor 1 oktober aan de Autoriteit Consument
      en Markt een voorstel voor de toegestane inkomsten voor de uitvoering van de taken genoemd in
      [artikel 16, zestiende lid][ref1], met inachtneming van:

      a. de formule

      waarbij

      TI = de totale inkomsten in het jaar t;

      TI = de totale inkomsten in het jaar voorafgaande aan het jaar t;

      cpi = de relatieve wijziging van de consumentenprijsindex (alle huishoudens), berekend uit het quotiënt van deze
      prijsindex, gepubliceerd in de vierde maand voorafgaande aan het jaar t, en van deze prijsindex, gepubliceerd in de
      zestiende maand voorafgaande aan het jaar t, zoals deze maandelijks wordt vastgesteld door het Centraal Bureau voor
      de Statistiek;

      x = de korting ter bevordering van de doelmatige bedrijfsvoering;

      b. de gemaakte kosten voor investeringen, bedoeld in [artikel 20d, derde lid][ref2], voor zover de kosten
      doelmatig zijn;

      c. een schadevergoeding als bedoeld in [artikel 16f][ref3];

      d. de geschatte vermogenskosten die de netbeheerder van het net op zee in het jaar waarop het voorstel betrekking
      heeft zal maken met betrekking tot nog niet in gebruik genomen investeringen, waarop de projectprocedure, bedoeld
      in [afdeling 5.2 van de Omgevingswet][ref4] van toepassing is;

      e. de geschatte kosten die de netbeheerder van het net op zee heeft voor investeringen die in het jaar waarop
      het voorstel betrekking heeft, in gebruik worden of zijn genomen, waarop de projectprocedure, bedoeld in
      [afdeling 5.2 van de Omgevingswet][ref5] van toepassing is.

      2 Indien sprake is van grove nalatigheid van de netbeheerder van het net op zee, wordt in afwijking van het eerste
      lid, onderdeel c, het totaal aan schadevergoedingen tot een bedrag van ten hoogste € 10 miljoen per jaar niet in de
      toegestane inkomsten verdisconteerd. Het totaal aan schadevergoedingen die het bedrag van € 10 miljoen in één jaar
      overstijgt wordt in dit geval betrokken bij het vaststellen van de inkomsten.

      3 De Autoriteit Consument en Markt stelt een beleidsregel vast betreffende de beoordeling van doelmatigheid,
      bedoeld in het eerste lid, onderdeel b.


