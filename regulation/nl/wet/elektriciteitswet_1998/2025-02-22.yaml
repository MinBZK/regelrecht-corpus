  - number: 16a
    text: |-
      1 Degene, niet zijnde een netbeheerder, die bij een afnemer de meting van van het net afgenomen en verbruikte
      of opgewekte en op het net ingevoede elektriciteit verricht, deelt de daarmee verkregen meetgegevens mee aan de
      desbetreffende afnemer en aan de netbeheerder op wiens net de afnemer is aangesloten.

      2 De netbeheerder deelt de meetgegevens, bedoeld in het eerste lid en in
      [artikel 16, eerste lid, onderdeel i][ref1], mee aan Onze Minister, alsmede aan de desbetreffende afnemer voor
      zover die nog niet de beschikking heeft over die informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16a
