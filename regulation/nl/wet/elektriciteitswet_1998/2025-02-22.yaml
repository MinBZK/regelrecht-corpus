  - number: '43'
    text: |-
      1 Een netbeheerder is verplicht een afzonderlijke boekhouding te voeren voor de uitvoering van de bij of krachtens
      deze wet aan hem toegekende taken, met uitzondering van de taken, bedoeld in [artikel 17a][ref1] en [16a][ref2].
      Indien de netbeheerder werkzaamheden verricht als bedoeld in [artikel 7a][ref3] of 17a, voert hij daarvoor
      eveneens, al dan niet op geconsolideerde basis, een afzonderlijke boekhouding.

      2 De afzonderlijke boekhouding bevat:

      a. een balans en een winst- en verliesrekening,

      b. een specificatie van de toerekening van de activa en de passiva en de lasten en baten aan de taken, bedoeld in
      de eerste volzin van het eerste lid, waarbij in het bijzonder voor ieder spanningsniveau of een bandbreedte daarvan
      de bijbehorende kosten, opbrengsten en hoeveelheden,

      c. een specificatie van de inkomsten verkregen uit de eigendom van het net, en

      d. een toelichting op de gebruikte regels voor de afschrijving.

      3 De netbeheerder geeft in de boekhouding aan welke methoden en criteria bij het opstellen daarvan zijn gehanteerd.

      4 Het toerekenen van kosten aan activiteiten als bedoeld in het eerste lid geschiedt in overeenstemming met het
      daadwerkelijk gebruik van financiële of andere middelen voor die activiteiten.

      5 Wijzigingen in de in het tweede lid bedoelde regels voor de afschrijving worden met redenen omkleed in de
      boekhouding vermeld.

      6 In de toelichting op de jaarrekening wordt elk verwant bedrijf waarmee een netbeheerder een overeenkomst heeft
      gesloten waarvan de opbrengst of de kosten een bedrag van € 4 500 000 te boven gaat, vermeld. Daarbij wordt tevens
      per bedrijf het aantal van die overeenkomsten gemeld.

      7 Indien een netbeheerder niet reeds uit hoofde van een wettelijke verplichting zijn jaarrekening of een daarmee
      overeenkomend financieel overzicht openbaar maakt, legt hij die jaarrekening of dat overzicht voor een ieder ter
      inzage op het kantoor van zijn hoofdvestiging.

      8 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de inrichting van de boekhouding
      voor de in het eerste lid bedoelde activiteiten.

      9 Een netbeheerder publiceert jaarlijks:

      a. voor 1 oktober op geschikte wijze een verslag van de afzonderlijke boekhouding, bedoeld in het tweede lid over
      het daaraan voorafgaande kalenderjaar;

      b. een verklaring waaruit blijkt dat de financiële verhouding tussen de netbeheerder en een met hem verbonden
      groepsmaatschappij voldoet aan het bepaalde bij of krachtens [artikel 17b, eerste lid][ref4];

      c. de gegevens waaruit blijkt dat de netbeheerder voldoet aan de regels omtrent een goed financieel beheer, bedoeld
      in [artikel 18a, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16a
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel17b
      [ref5]: https://wetten.overheid.nl/BWBR0009755#Artikel18a
