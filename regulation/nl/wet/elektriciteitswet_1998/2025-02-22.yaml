    text: |-
      Bij de toepassing van [artikel 30, tweede lid][ref1], zoals dat luidde voor 1 juli 2011 geldt dat het tarief,
      bedoeld in artikel 30, eerste lid, uitsluitend in rekening wordt gebracht of kon worden gebracht indien op dezelfde
      aansluiting sprake was van verbruik van elektriciteit en een aansluiting op een net dat wordt beheerd door een
      netbeheerder.


