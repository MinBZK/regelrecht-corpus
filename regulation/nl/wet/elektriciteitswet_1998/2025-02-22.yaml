        hoofdstuk: '6'
        paragraaf: '1'
  - number: 10Aa.4
    text: |-
      De op basis van [artikel 36][ref1] of [37][ref2] vastgestelde voorwaarden zijn van toepassing voor zover dit in
      de voorwaarden is aangegeven. Met betrekking tot deze voorwaarden is [artikelen 32][ref3] van overeenkomstige
      toepassing, met dien verstande dat in plaats van «netbeheerder van het landelijk hoogspanningsnet» wordt gelezen
      «interconnector-beheerder», en maakt de interconnector-beheerder in dat geval deel uit van de gezamenlijke
      netbeheerders als bedoeld in de [artikelen 33][ref4] en [34][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel33
      [ref5]: https://wetten.overheid.nl/BWBR0009755#Artikel34
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10Aa
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0009755
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref5
        bwb_id: BWBR0009755
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 10Aa.5
    text: |-
      Indien de netbeheerder van het landelijk hoogspanningsnet is aangewezen als interconnector-beheerder zijn,
      in afwijking van het tweede tot en met het vierde lid, de bij of krachtens de Elektriciteitswet 1998 voor
      de netbeheerder van het landelijk hoogspanningsnet geldende bepalingen van overeenkomstige toepassing, met
      dien verstande dat het landelijk hoogspanningsnet en het desbetreffende landsgrensoverschrijdende net voor de
      vaststelling van de tarieven als één net kunnen worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10Aa
  - number: 10Aa.6
    text: |-
      Indien een persoon uit een derde land zeggenschap heeft over een eigenaar van een landsgrensoverschrijdend
      net of een interconnector-beheerder, besluit de Autoriteit Consument en Markt in het besluit, bedoeld in
      [artikel 10, derde lid][ref1], op verzoek en volgens de procedure van artikel 11 van de richtlijn of is voldaan aan
      de eisen van artikel 11, derde lid, van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10Aa
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 10Aa.7
    text: |-
      Bij algemene maatregel van bestuur worden ter implementatie van artikel 9 van de richtlijn nadere regels gesteld
      voor interconnector-beheerders.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10Aa
  - number: 10Aa.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de werking en
      exploitatie van een landsgrensoverschrijdend net dat de grens met een derde land overschrijdt en de beheerder
      van dat net, voor zover deze regels nodig zijn voor het functioneren en de exploitatie van dat net of voor het
      functioneren van die beheerder.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10Aa
  - number: 10a.1
    text: |-
      De netbeheerder, met uitzondering van de netbeheerder van het landelijk hoogspanningsnet, beschikt over de
      economische eigendom van het door hem beheerde net.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10a
  - number: 10a.2
    text: |-
      Bij gelegenheid van een aanwijzing als bedoeld in [artikel 10, negende lid][ref1], vindt voor zover nodig
      overdracht van de economische eigendom aan de aangewezen netbeheerder plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 10a.3
    text: |-
      De overdracht geschiedt tegen verrichting van een tegenprestatie waarvan de waarde ten hoogste de opbrengst
      vertegenwoordigt van de exploitatie van het net, zoals deze op basis van algemene bedrijfseconomische
      uitgangspunten kan worden afgeleid van de door de Autoriteit Consument en Markt in de daaraan voorafgaande periode
      van vijf jaar vastgestelde tarieven met betrekking tot het netbeheer. Deze tegenprestatie kan zowel bestaan uit een
      periodieke uitkering als uit een contant bedrag ineens.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10a
  - number: 10a.4
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet of een tot de groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waarvan de netbeheerder van het landelijk
      hoogspanningsnet deel uitmaakt behorende vennootschap beschikt over de eigendom van het landelijk hoogspanningsnet.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 10b.1
    text: |-
      Een netbeheerder maakt geen deel uit van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waartoe ook een rechtspersoon of vennootschap behoort die
      in Nederland elektriciteit produceert of levert of daarin handelt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 10b.2
    text: |-
      Rechtspersonen en vennootschappen die deel uitmaken van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waartoe ook een rechtspersoon of vennootschap behoort die
      in Nederland elektriciteit produceert of levert of daarin handelt, houden geen aandelen in een netbeheerder of in
      een rechtspersoon die deel uitmaakt van een groep waartoe ook een netbeheerder behoort en nemen niet deel in een
      vennootschap die deel uitmaakt van een groep waartoe ook een netbeheerder behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 10b.3
    text: |-
      Een netbeheerder en met de netbeheerder verbonden groepsmaatschappijen als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 10b.3.a
    text: |-
      houden geen aandelen in een rechtspersoon die in Nederland elektriciteit produceert of levert of daarin handelt
      of in een rechtspersoon die deel uitmaakt van een groep waartoe ook een rechtspersoon behoort die in Nederland
      elektriciteit produceert of levert of daarin handelt;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10b
  - number: 10b.3.b
    text: |-
      nemen niet deel in een vennootschap die in Nederland elektriciteit produceert of levert of daarin handelt of in een
      vennootschap die deel uitmaakt van een groep waartoe ook een rechtspersoon of vennootschap behoort die in Nederland
      elektriciteit produceert of levert of daarin handelt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10b
  - number: 10b.4
    text: 'In aanvulling op het eerste tot en met het derde lid:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10b
  - number: 10b.4.a
    text: |-
      maakt de netbeheerder van het landelijk hoogspanningsnet geen deel uit van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waartoe ook een rechtspersoon of vennootschap behoort die
      gas produceert of levert of daarin handelt;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 10b.4.b
    text: |-
      maakt de netbeheerder van het landelijk hoogspanningsnet geen deel uit van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waartoe een rechtspersoon of vennootschap behoort die
      activiteiten als bedoeld in het eerste lid of onderdeel a verricht buiten Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 10b.4.c
    text: |-
      oefent de netbeheerder van het landelijk hoogspanningsnet geen directe of indirecte zeggenschap uit over een
      producent, een leverancier, een producent van gas of een leverancier van gas.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10b
  - number: 10b.5
    text: Bij algemene maatregel van bestuur worden ter implementatie van artikel 9 van de richtlijn nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10b
  - number: '11.1'
    text: Een producent, leverancier of handelaar wordt niet aangewezen als netbeheerder.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel11
  - number: '11.2'
    text: |-
      De statuten van de netbeheerder, niet zijnde de netbeheerder van het landelijk hoogspanningsnet, bevatten in ieder
      geval:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel11
  - number: 11.2.a
    text: de instelling van een raad van commissarissen;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel11
  - number: 11.2.b
    text: |-
      de bepaling dat de leden van het bestuur en de meerderheid van de leden van de raad van commissarissen direct noch
      indirect binding hebben met een producent, een leverancier of een handelaar;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel11
  - number: 11.2.c
    text: |-
      in afwijking van [artikel 129, derde lid][ref1], of
      [artikel 239, derde lid, van Boek 2 van het Burgerlijk Wetboek][ref2], de bepaling dat aan de goedkeuring van de
      raad van commissarissen ten minste zijn onderworpen de besluiten van het bestuur van de rechtspersoon, bedoeld in
      [artikel 164, eerste lid][ref3], of [artikel 274, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel239
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel164
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel274
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '129'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '239'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '164'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '274'
  - number: 11.2.d
    text: de bepaling dat de aandeelhouders het kader vaststellen voor het bezoldigingsbeleid van de bestuurders;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel11
  - number: 11.2.e
    text: |-
      de bepaling dat het reserveren en uitkeren van de jaarlijkse winst geschiedt met de instemming van de
      aandeelhouders en met inachtneming van de uitvoering van de aan de netbeheerder bij wet opgedragen taken en
      verplichtingen om zijn netten in werking te hebben, te vernieuwen, te onderhouden en uit te breiden.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel11
  - number: '11.3'
    text: |-
      Indien een netbeheerder, niet zijnde de netbeheerder van het landelijk hoogspanningsnet, een afhankelijke
      maatschappij is in de zin van [artikel 152][ref1] of [artikel 262 van Boek 2 van het Burgerlijk Wetboek][ref2],
      behoeven de statuten van die netbeheerder, in afwijking van het tweede lid, onderdeel a, niet te voorzien in de
      instelling van een raad van commissarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel152
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel262
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '152'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '262'
  - number: '11.4'
    text: 'In het in het derde lid bedoelde geval:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel11
  - number: 11.4.a
    text: |-
      voldoet een rechtspersoon waarvan de netbeheerder een afhankelijke maatschappij is aan de in het tweede lid, aanhef
      en onderdelen a en b, genoemde eisen;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel11
  - number: 11.4.b
    text: |-
      beschikt de raad van commissarissen van de rechtspersoon, bedoeld in onderdeel a, waarvan de netbeheerder een
      afhankelijke maatschappij is over de bevoegdheden, bedoeld in het tweede lid, onderdeel c, ten aanzien van het
      bestuur van de netbeheerder.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel11
  - number: 11a.1
    text: |-
      De [artikelen 155a][ref1], [158 tot en met 161a][ref2] en [164][ref3] dan wel [265a][ref4],
      [268 tot en met 271a][ref5] en [274 van Boek 2 van het Burgerlijk Wetboek][ref6] zijn van toepassing op de
      vennootschap die is aangewezen voor het beheer van het landelijk hoogspanningsnet en haar statuten worden
      dienovereenkomstig ingericht.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel155a
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel158
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel164
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel265a
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel268
      [ref6]: https://wetten.overheid.nl/BWBR0003045#Artikel274
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 155a
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '158'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '164'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: 265a
      - id: ref5
        bwb_id: BWBR0003045
        artikel: '268'
      - id: ref6
        bwb_id: BWBR0003045
        artikel: '274'
  - number: 11a.2
    text: |-
      De leden van het bestuur en de meerderheid van de leden van de raad van commissarissen van de vennootschap die
      is aangewezen voor het beheer van het landelijk hoogspanningsnet hebben direct noch indirect binding met een
      rechtspersoon die de productie, aankoop of levering van gas of elektriciteit verricht of met een aandeelhouder van
      die rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel11a
  - number: 11a.3
    text: |-
      Indien de vennootschap die is aangewezen voor het beheer van het landelijk hoogspanningsnet een afhankelijke
      maatschappij is in de zin van [artikel 152][ref1] of [artikel 262 van Boek 2 van het Burgerlijk Wetboek][ref2] is
      het eerste lid niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel152
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel262
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '152'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '262'
  - number: 11a.4
    text: 'In het in het derde lid bedoelde geval:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel11a
  - number: 11a.4.a
    text: |-
      voldoet een rechtspersoon waarvan de netbeheerder van het landelijk hoogspanningsnet een afhankelijke maatschappij
      is aan de in het eerste tot en met derde lid genoemde eisen;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel11a
  - number: 11a.4.b
    text: |-
      beschikt de raad van commissarissen van de rechtspersoon, bedoeld in onderdeel a, waarvan de netbeheerder van het
      landelijk hoogspanningsnet een afhankelijke maatschappij is over de bevoegdheden tot goedkeuring van de besluiten
      van het bestuur van de netbeheerder van het landelijk hoogspanningsnet, bedoeld in [artikel 164, eerste lid][ref1],
      of [artikel 274, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel164
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel274
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '164'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '274'
  - number: 11b.1
    text: |-
      Een netbeheerder die deel uitmaakt van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] stelt een reglement vast, waarin regels worden gesteld
      die beogen discriminatie bij de uitoefening van zijn taken en bevoegdheden op grond van deze wet te voorkomen.
      Het reglement bevat in ieder geval regels ten aanzien van het gedrag van werknemers die ertoe strekken dat
      discriminatie als bedoeld in de vorige volzin wordt voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 11b.2
    text: |-
      De netbeheerder draagt er zorg voor dat elke werknemer is gebonden aan het reglement en ziet er op toe dat het
      reglement nauwgezet wordt nageleefd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel11b
  - number: 11b.3
    text: |-
      De netbeheerder stelt jaarlijks een verslag op over de wijze waarop uitvoering is gegeven aan het reglement, en
      welke maatregelen in dat kader zijn genomen. Hij zendt het verslag naar de Autoriteit Consument en Markt en draagt
      zorg voor publicatie ervan op een geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel11b
  - number: '12.1'
    text: |-
      De netbeheerder, niet zijnde de netbeheerder van het landelijk hoogspanningsnet, meldt aan Onze Minister onverwijld
      na zijn aanwijzing zijn naam en adres en de naam en het adres van zijn aandeelhouders en zendt aan Onze Minister
      een beschrijving van het net dat door hem zal worden beheerd. Ten minste eenmaal per jaar meldt hij aan Onze
      Minister iedere wijziging van de namen of adressen en zendt hij hem een beschrijving van de wijziging van het net
      dat door hem wordt beheerd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel12
  - number: '12.2'
    text: |-
      De aanwijzing behoeft de instemming van Onze Minister. Onze Minister onthoudt zijn instemming of kan
      voorschriften verbinden aan de instemming, indien niet is voldaan aan de [artikelen 10a][ref1], [10b][ref2],
      [11][ref3] of [11b][ref4] of indien de aangewezen netbeheerder in onvoldoende mate in staat zal zijn aan
      een verplichting als bedoeld in de [artikelen 17b][ref5], [18a][ref6] of [78][ref7] te voldoen, een taak
      als bedoeld in [artikel 16, eerste lid][ref8] of [17a][ref9] uit te voeren , een verbod als bedoeld in
      [artikel 17][ref10] of 17b na te leven dan wel, indien de netbeheerder deel uitmaakt van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref11], de met hem verbonden groepsmaatschappij niet voldoet
      aan het bepaalde bij of krachtens [artikel 17c][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel11
