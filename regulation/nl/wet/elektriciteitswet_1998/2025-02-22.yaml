  - number: '2'
    text: |-
      1 Onze Minister stelt ten minste eenmaal in de vier jaar een energierapport vast dat richting geeft aan van
      rijkswege in de eerstvolgende vier jaar te nemen beslissingen voor zover daarbij het belang van het betrouwbaar,
      duurzaam, doelmatig en milieuhygiënisch verantwoord functioneren van de elektriciteitsvoorziening in beschouwing
      moet of kan worden genomen. Bij de voorbereiding van een energierapport betrekt Onze Minister de naar zijn oordeel
      bij de te behandelen onderwerpen meest belanghebbende bestuursorganen, instellingen en organisaties.

      2 Voor zover het energierapport onderdelen betreft die tot de verantwoordelijkheid behoren van Onze Minister van
      Infrastructuur en Milieu, wordt het rapport vastgesteld na overleg met voornoemde minister.

      3 Het energierapport bevat ten minste:

      a. een analyse van de ontwikkelingen op de nationale en internationale energiemarkt en de effecten daarvan op een
      betrouwbaar, duurzaam, doelmatig en milieuhygiënisch verantwoord functionerende energiehuishouding;

      b. een analyse van veranderingen in het gebruik van energiebronnen voor het opwekken van elektriciteit en van de
      wijze waarop en de mate waarin zich een duurzame energiehuishouding ontwikkelt;

      c. een analyse van de ontwikkeling van de marktwerking in de energievoorziening;

      d. een overzicht van de beoogde resultaten inzake de bevordering van een betrouwbaar, duurzaam, doelmatig en
      milieuhygiënisch verantwoord functionerende energiehuishouding en van de wijzen waarop die resultaten in de
      desbetreffende periode van vier jaar zullen worden nagestreefd;

      e. een analyse van overige aspecten die van belang kunnen zijn in het kader van het energiebeleid in het algemeen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel2
  - number: '3'
    text: |-
      Zodra het energierapport is vastgesteld, zendt Onze Minister dit aan beide Kamers der Staten-Generaal en geeft hij
      kennis van het energierapport in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel3
  - number: '4'
    text: |-
      1 Het energierapport geldt met ingang van een bij besluit van Onze Minister vast te stellen tijdstip.

      2 Het besluit wordt niet eerder genomen dan acht weken nadat het energierapport op grond van
      [artikel 3, eerste lid][ref1], is overgelegd aan de beide kamers der Staten-Generaal.

      3 Indien door of namens een der kamers der Staten-Generaal binnen acht weken nadat het energierapport is
      overgelegd, te kennen wordt gegeven dat zij over het energierapport in het openbaar wil beraadslagen, wordt
      het besluit niet eerder genomen dan zes maanden na de overlegging van het energierapport, dan wel, indien de
      beraadslagingen op een eerder tijdstip zijn beëindigd, na die beraadslagingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4
