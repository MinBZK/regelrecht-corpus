  - number: 20a
    text: |-
      1 Voor het volgende werk met een nationaal belang stelt Onze Minister in ieder geval een projectbesluit als bedoeld
      in [afdeling 5.2 van de Omgevingswet][ref1] vast: een uitbreiding van het landelijk hoogspanningsnet voor zover
      het betreft:

      a. de van dat net deel uitmakende netten bestemd voor het transport van elektriciteit op een spanningsniveau van
      220 kV of hoger en die als zodanig worden bedreven met inbegrip van de aansluitingen op die netten,

      b. de van dat net deel uitmakende landsgrensoverschrijdende netten op een spanningsniveau van 500 V of hoger met
      inbegrip van de aansluitingen op die netten, of

      c. de aanleg of uitbreiding van een landsgrensoverschrijdend net met inbegrip van de aansluitingen op zo’n net,
      en het een project betreft voor elektriciteit dat is opgenomen op de Unielijst van projecten van gemeenschappelijk
      belang, bedoeld in artikel 3, vierde lid, Verordening (EU) nr. 347/2013 van het Europees Parlement en de Raad
      van 17 april 2013 betreffende richtsnoeren voor de trans-Europese energie-infrastructuur en tot intrekking van
      Beschikking nr. 1364/2006/EG en tot wijziging van de Verordeningen (EG) nr. 713/2009, (EG) nr. 714/2009 en (EG) nr.
      715/2009 (PbEU 2013, L 115).

      2 Onze Minister stelt in ieder geval een projectbesluit als bedoeld in [afdeling 5.2 van de Omgevingswet][ref2]
      vast voor de aanleg of uitbreiding van het net op zee, met dien verstande dat Onze Minister geen projectbesluit
      vaststelt voor het gebied gelegen aan de zeezijde van gemeentegrenzen of provinciale grenzen.

      3 [Artikel 16.7 van de Omgevingswet][ref3] is van toepassing op de coördinatie van besluiten ter uitvoering van
      projectbesluiten als bedoeld in het eerste en tweede lid.

      4 In afwijking van het eerste lid kan Onze Minister besluiten geen projectbesluit vast te stellen als naar zijn
      oordeel besluitvorming door een bestuursorgaan van een gemeente of van een provincie het project kan versnellen
      of daaraan anderszins aanmerkelijke voordelen zijn verbonden, en het college van burgemeester en wethouders van de
      betreffende gemeente respectievelijk gedeputeerde staten van de betreffende provincie daarmee instemmen.

      5 Onze Minister geeft tegelijk met of zo snel mogelijk na de bekendmaking van een besluit als bedoeld in het vierde
      lid kennis van dat besluit op de in [artikel 12 van de Bekendmakingswet][ref4] bepaalde wijze en doet mededeling
      van dat besluit door toezending daarvan aan de initiatiefnemer.

      6 Het vijfde lid is van overeenkomstige toepassing als een besluit als bedoeld in het vierde lid wordt ingetrokken.

      7 Voor projecten als bedoeld in het eerste lid, onder c, stelt Onze Minister, in overeenstemming met Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties, een handleiding vast als bedoeld in artikel 9, eerste lid, van de
      verordening, bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
