        paragraaf: '2'
  - number: 4a
    text: |-
      1 Onze Minister verzamelt, analyseert en bewerkt systematisch inlichtingen en gegevens met betrekking tot de
      leverings- en voorzieningszekerheid, in het bijzonder met betrekking tot:

      a. het evenwicht van vraag en aanbod op de nationale markt,

      b. het niveau van de verwachte toekomstige vraag,

      c. de geplande of in aanbouw zijnde extra productie- en netwerkcapaciteit,

      d. de kwaliteit en de staat van onderhoud van de netten, en

      e. de maatregelen in geval van piekbelasting of het in gebreke blijven van een of meerdere leveranciers.

      2 Onze Minister publiceert jaarlijks uiterlijk op 31 juli op geschikte wijze een verslag van zijn bevindingen die
      het verzamelen, analyseren en bewerken van de inlichtingen en gegevens over de onderwerpen, genoemd in het eerste
      lid, heeft opgeleverd, alsmede van de getroffen of voorgenomen maatregelen met betrekking tot die onderwerpen. Hij
      zendt het verslag onverwijld naar de Europese Commissie en doet mededeling van het verslag in de Staatscourant.

      3 Ter uitvoering van de taak, bedoeld in het eerste lid, kunnen bij ministeriële regeling nadere regels worden
      gesteld omtrent:

      a. de gegevens en inlichtingen waarvan Onze Minister kan verlangen dat zij hem worden verstrekt,

      b. degenen van wie Onze Minister, onverminderd [artikel 78][ref1], kan verlangen dat zij hem gegevens en
      inlichtingen verstrekken, en

      c. de termijn waarbinnen, de wijze waarop en de vorm waarin de gegevens en inlichtingen aan Onze Minister worden
      verstrekt.

      4 Het verslag bedoeld in het tweede lid wordt in nauwe samenwerking met de netbeheerder van het landelijk
      hoogspanningsnet opgesteld die voorzover van toepassing daarover overleg pleegt met de relevante netbeheerders van
      aangrenzende landen. In het verslag wordt ingegaan op de algehele toereikendheid van het stroomvoorzieningsysteem
      en de geraamde vraag naar elektriciteit waarbij in elk geval aandacht wordt besteed aan:

      a. de operationele netwerkveiligheid,

      b. het geraamde evenwicht tussen aanbod en vraag in de komende vijf jaar,

      c. de vooruitzichten inzake de elektriciteitsvoorziening voor de periode tussen vijf en vijftien jaar na de datum
      van verslaglegging, en

      d. de voornemens van de netbeheerder van het landelijk hoogspanningsnet en voor zover bekend van andere
      partijen voor de komende vijf of meer kalenderjaren op het gebied van investeringen ter voorziening in
      landgrensoverschrijdende netten.

      5 Bij het onderdeel van het verslag waarin aandacht wordt besteed aan de investeringsvoornemens in
      landgrensoverschrijdende netten als bedoeld in het vierde lid, onderdeel d, wordt met betrekking tot die voornemens
      rekening gehouden met:

      a. de beginselen van congestiebeheer, zoals vermeld in [verordening 2019/943](32843R2019),

      b. de bestaande en geplande transportlijnen,

      c. verwachte patronen op het gebied van productie, levering, grensoverschrijdende handel en verbruik waarbij ruimte
      is voor vraagbeheersmaatregelen, en

      d. regionale, nationale en Europese doelstellingen voor duurzame ontwikkeling met inbegrip van de projecten die
      zijn opgenomen in bijlage I bij Beschikking nr. 1364/2006/EG.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel78
