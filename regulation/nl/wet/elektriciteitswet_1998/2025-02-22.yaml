  - number: 15a
    text: |-
      1 Het net op zee omvat de netten die bestemd zijn voor het transport van elektriciteit en die één of meer
      windparken op zee verbinden met het landelijk hoogspanningsnet met uitzondering van leidingen en daarmee
      verbonden hulpmiddelen ten behoeve van het transport van elektriciteit die één of meer windparken op zee
      verbinden met het landelijk hoogspanningsnet en waarvoor voor 1 januari 2016 een omgevingsvergunning voor
      een beperkingengebiedactiviteit met betrekking tot een weg respectievelijk een waterstaatswerk als bedoeld in
      [artikel 5.1, tweede lid, aanhef en onder f, onder 1° respectievelijk onder 2°, van de Omgevingswet][ref1] is
      verleend.

      2 Hetgeen in [hoofdstuk 3, paragraaf 1][ref2], en in de [artikelen 19b][ref3], [19c][ref4], [21][ref5], [93a][ref6]
      en [94][ref7] geldt onderscheidenlijk niet geldt voor de netbeheerder van het landelijk hoogspanningsnet, geldt
      eveneens onderscheidenlijk geldt eveneens niet voor de netbeheerder van het net op zee.


