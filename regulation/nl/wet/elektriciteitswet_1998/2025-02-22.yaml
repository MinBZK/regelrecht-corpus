      1 Leveranciers zijn verplicht om aan afnemers als bedoeld in [artikel 95a, eerste lid][ref1], naast eventuele
      andere vrije contractvormen, levering volgens een modelcontract aan te bieden.

      2 De Autoriteit Consument en Markt stelt het modelcontract vast, na consultatie van organisaties van leveranciers,
