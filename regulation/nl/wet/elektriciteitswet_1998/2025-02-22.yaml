      [ref6]: https://wetten.overheid.nl/BWBR0009755#Artikel17b
      [ref7]: https://wetten.overheid.nl/BWBR0009755#Artikel18a
      [ref8]: https://wetten.overheid.nl/BWBR0009755#Artikel78
