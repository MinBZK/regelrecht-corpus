        paragraaf: '2'
  - number: 16e
    text: |-
      1 Onze Minister stelt een kader vast inzake de ontwikkeling van windenergie op zee. In het ontwikkelkader wordt in
      ieder geval opgenomen:

      a. de locatie van één of meerdere windparken;

      b. het verwachte tijdstip van ingebruikname van ieder windpark;

      c. de verwachte levensduur van windparken;

      d. het maximale vermogen van ieder windpark;

      e. de minimale transportcapaciteit ten behoeve van ieder windpark;

      f. de wijze van elektrische ontsluiting van ieder windpark;

      g. de beoogde opleveringsdatum van onderdelen van het net op zee;

      h. toekomstige ontwikkelingen inzake windenergie op zee waarmee bij de elektrische ontsluiting rekening wordt
      gehouden.

      2 Onze Minister kan het ontwikkelkader wijzigen of aanvullen.

      3 De netbeheerder van het net op zee werkt het ontwikkelkader uit in het investeringsplan, bedoeld in
      [artikel 21][ref1] en voert zijn taken uit in overeenstemming met het ontwikkelkader.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel21
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16e
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 16f
    text: |-
      1 Een producent heeft recht op vergoeding van schade door de netbeheerder van het net op zee, indien:

      a. deze netbeheerder het voor de ontsluiting van het windpark noodzakelijk deel van het net op zee geheel of
      gedeeltelijk later oplevert dan in het ontwikkelkader, bedoeld in [artikel 16e, eerste lid][ref1], is opgenomen en
      de producent hierdoor geheel of gedeeltelijk geen elektriciteit kan laten transporteren, of

      b. de hoeveelheid elektriciteit die in een kalenderjaar niet kan worden getransporteerd over het net op zee groter
      is dan de hoeveelheid elektriciteit die niet kan worden getransporteerd wegens gemiddeld voor het net op zee
      redelijkerwijs noodzakelijk onderhoud en de producent hierdoor geheel of gedeeltelijk geen elektriciteit kan laten
      transporteren.

      2 De vergoeding van de schade bestaat uit gevolgschade en de schade ten gevolge van gederfde of uitgestelde
      inkomsten.

      3 Een producent draagt er zorg voor dat de schade zo veel mogelijk beperkt blijft.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over het recht op schadevergoeding,
      bedoeld in het eerste lid, en de bestanddelen van de vergoeding, bedoeld in het tweede lid.

      5 De voordracht voor een krachtens het vierde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16e
