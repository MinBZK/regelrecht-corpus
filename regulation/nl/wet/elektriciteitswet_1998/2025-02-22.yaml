preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, mede ter uitvoering van richtlijn nr. 96/92/EG van het
    Europees Parlement en de Raad van de Europese Unie van 19 december 1996 betreffende gemeenschappelijke regels voor
    de interne markt voor elektriciteit (PbEG 1997, L 27), de mogelijkheden voor opwekking, levering en in- en uitvoer
    van elektriciteit en voor het gebruik van leidinggebonden elektriciteitswerken te verruimen, en daarvoor met
    inachtneming van het belang van het betrouwbaar, duurzaam, doelmatig en milieuhygiënisch verantwoord functioneren
    van de elektriciteitsvoorziening een nieuwe regeling tot stand te brengen met betrekking tot de productie, het
    transport en de levering van elektriciteit;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Economische Zaken en Klimaat;

      b. aansluiting: één of meer verbindingen tussen een net en een onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref1], waaronder begrepen één of
      meer verbindingen tussen een net dat wordt beheerd door een netbeheerder en een net dat beheerd wordt door een
      ander dan die netbeheerder en tussen het net op zee en een windpark op zee;

      c. afnemer: een ieder, met uitzondering van de netbeheerder van het net op zee, die beschikt over een aansluiting
      op een net;

      d. verordening 2019/943: [verordening 2019/943](32843R2019) van het Europees Parlement en de Raad van 5 juni 2019
      betreffende de interne markt voor elektriciteit (Pb EU 2019, L 158);

      e. Autoriteit Consument en Markt: de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref2];

      f. leverancier: een organisatorische eenheid die zich bezighoudt met het leveren van elektriciteit;

      g. producent: een organisatorische eenheid die zich bezighoudt met het opwekken van elektriciteit;

      h. handelaar: een organisatorische eenheid die zich bezighoudt met het sluiten van overeenkomsten betreffende de
      koop en verkoop van elektriciteit;

      i. net: één of meer verbindingen voor het transport van elektriciteit en de daarmee verbonden transformator-,
      schakel-, verdeel- en onderstations en andere hulpmiddelen, behoudens voor zover deze verbindingen en hulpmiddelen
      onderdeel uitmaken van een directe lijn of liggen binnen de installatie van een producent of van een afnemer;

      j. landelijk hoogspanningsnet: het net, bedoeld in [artikel 10, eerste lid][ref3];

      k. netbeheerder: een vennootschap die op grond van [artikel 10][ref4], [13][ref5], [14][ref6] of [15a][ref7] is
      aangewezen voor het beheer van een of meer netten;

      l. vergunninghouder: een houder van een vergunning als bedoeld in [artikel 95a][ref8];

      m. richtlijn: richtlijn nr. 2009/72/EG van het Europees Parlement en de Raad van 13 juli 2009 betreffende
      gemeenschappelijke regels voor de interne markt voor elektriciteit en tot intrekking van Richtlijn 2003/54/EG (Pb
      EU 2009, L 211);

      n. notificatierichtlijn: richtlijn (EU) nr. 2015/1535 van het Europees Parlement en de Raad van 9 september 2015
      betreffende een informatieprocedure op het gebied van technische voorschriften en regels betreffende de diensten
      van de informatiemaatschappij (codificatie) (PbEU 2015, L 241);

      o. programma-verantwoordelijkheid: de verantwoordelijkheid van afnemers, niet zijnde afnemers als bedoeld in
      [artikel 95a, eerste lid][ref9], de netbeheerder van het net op zee en vergunninghouders om programma's met
      betrekking tot de productie, het transport en het verbruik van elektriciteit op te stellen of te doen opstellen
      ten behoeve van de netbeheerders en zich met inachtneming van de voorwaarden, bedoeld in [artikel 31][ref10], te
      gedragen overeenkomstig die programma's;

      p. systeemdiensten: de diensten die de netbeheerder van het landelijk hoogspanningsnet uitvoert om het
      transport van elektriciteit over alle netten op een veilige en doelmatige wijze te waarborgen, om grootschalige
      onderbrekingen van het transport van elektriciteit op te lossen, en om de energiebalans op alle netten te handhaven
      of te herstellen;

      q.

      r. verwant bedrijf: een verbonden onderneming in de zin van artikel 41 van de zevende [richtlijn nr. 83/349/EEG]
      (31983L0349) van de Raad van 13 juni 1983 op de grondslag van artikel 44, tweede lid, onderdeel g, van het Verdrag
      betreffende de geconsolideerde jaarrekening, of een geassocieerde onderneming in de zin van artikel 33, eerste lid,
      daarvan of een onderneming die aan dezelfde aandeelhouders toebehoort;

      s. biomassa: de biologisch afbreekbare fractie van producten, afvalstoffen en residuen van biologische oorsprong
      uit de landbouw – met inbegrip van plantaardige en dierlijke stoffen –, de bosbouw en aanverwante bedrijfstakken,
      met inbegrip van de visserij en de aquacultuur alsmede de biologisch afbreekbare fractie van industrieel en
      huishoudelijk afval;

      t. hernieuwbare energiebronnen: wind, zonne-energie, omgevingslucht-, oppervlaktewater- en aardwarmte, energie uit
      de oceanen, waterkracht, biomassa, stortgas, rioolwaterzuiveringsgas en biogas;

      u. duurzame elektriciteit: elektriciteit, opgewekt in productie-installaties die uitsluitend gebruikmaken van
      hernieuwbare energiebronnen, alsmede elektriciteit die is opgewekt met hernieuwbare energiebronnen in hybride
      productie-installaties die ook met conventionele energiebronnen werken, met inbegrip van elektriciteit die is
      opgewekt met hernieuwbare energiebronnen en die wordt gebruikt voor accumulatiesystemen, en met uitzondering van
      elektriciteit die afkomstig is van accumulatiesystemen;

      v. klimaatneutrale elektriciteit: elektriciteit, opgewekt in een productie-installatie waarin waterstof of
      elektriciteit wordt geproduceerd uit fossiele energiedragers, waarbij de koolstof of kooldioxide die vrijkomt bij
      het omzettingsproces, nuttig wordt toegepast of blijvend in de ondergrond wordt opgeslagen, en waarvoor een bij
      ministeriële regeling omschreven verklaring is verkregen;

      w. warmtekrachtkoppeling: de gecombineerde opwekking van warmte en elektriciteit of mechanische energie
      door verstoking van een brandstof, waarvan de warmte nuttig gebruikt wordt, anders dan voor de productie van
      elektriciteit;

      x. garantie van oorsprong voor duurzame elektriciteit: gegevens op een rekening die betrekking hebben op duurzame
      elektriciteit en waarmee wordt aangetoond dat een producent met zijn installatie een hoeveelheid duurzame
      elektriciteit heeft opgewekt;

      y. rekening: staat waarop een tegoed van garanties van oorsprong of certificaten van oorsprong kan worden geboekt
      in het elektronische systeem voor het uitgeven en innemen van garanties van oorsprong of certificaten van oorsprong
      en waarmee wordt bijgehouden voor welke hoeveelheid elektriciteit garanties van oorsprong of certificaten van
      oorsprong zijn verstrekt en aan wie de garanties van oorsprong of certificaten van oorsprong op enig moment
      toekomen;

      z. garantiebeheerinstantie: de op grond van [artikel 73, tweede lid][ref11], aangewezen instantie;

      aa. economische eigendom: het krachtens een rechtsverhouding gerechtigd zijn tot alle rechten en bevoegdheden
      ten aanzien van een goed, met uitzondering van het recht op levering, en het gehouden zijn om alle verplichtingen
      ten aanzien van dat goed voor zijn rekening te nemen en daarmee het volledige risico van waardeverandering of
      tenietgaan van het goed te dragen, zonder dat het goed geleverd is;

      ab. installatie voor hoogrenderende warmtekrachtkoppeling: installatie voor de opwekking van elektriciteit door
      middel van warmtekrachtkoppeling in de zin van artikel 2, punt 34, van [richtlijn 2012/27](32012L0027)/EU van het
      Europees Parlement en de Raad van 25 oktober 2012 betreffende energie-efficiëntie, tot wijziging van [Richtlijnen
      2009/125/EG](32009L0125) en [2010/30](32010L0030)/EU en houdende intrekking van de Richtlijnen [2004/8/EG]
      (32004L0008) en [2006/32/EG](32006L0032) (PbEU 2012, L 315);

      ac. garantie van oorsprong voor elektriciteit opgewekt in een installatie voor hoogrenderende
      warmtekrachtkoppeling: gegevens op een rekening die betrekking hebben op elektriciteit opgewekt door middel
      van hoogrenderende warmtekrachtkoppeling, waarmee wordt aangetoond dat een producent met zijn installatie een
      hoeveelheid elektriciteit door middel van hoogrenderende warmtekrachtkoppeling heeft opgewekt en op een net heeft
      ingevoed;

      ad. leveringszekerheid: het vermogen van een net om elektriciteit te leveren aan afnemers;

      ae. operationele netwerkveiligheid: het vermogen van het landelijk hoogspanningsnet om in voorzienbare
      omstandigheden operationeel te blijven;

      af. meetinrichting: het gehele samenstel van apparatuur dat ten minste tot doel heeft de uitgewisselde
      elektriciteit te meten;

      ag. meetbedrijf: een organisatorische eenheid die zich bezighoudt met het collecteren, valideren en vaststellen van
      meetgegevens betreffende elektriciteit;

      ah. productie-installatie: een installatie, bestaande uit één of meer productie-eenheden, voor de opwekking van
      elektriciteit.

      ai.

      aj.

      ak.

      al. verordening 2019/942: [verordening 2019/942](32842R2019) van het Europees Parlement en de Raad van 5 juni 2019
      tot oprichting van een Agentschap van de Europese Unie voor de samenwerking tussen energieregulators (Pb EU 2019,
      L 158);

      am. Acer: agentschap als bedoeld in artikel 1, eerste lid, van [verordening 2019/942](32842R2019);

      an. producent van gas: een producent als bedoeld in [artikel 1, onderdeel ag, van de Gaswet][ref12];

      ao. leverancier van gas: een leverancier als bedoeld in [artikel 1, onderdeel ah, van de Gaswet][ref13];

      ap. handelaar in gas: een handelaar als bedoeld in [artikel 1, onderdeel ai, van de Gaswet][ref14];

      aq. gesloten distributiesysteem: een net waarvoor op grond van [artikel 15][ref15] ontheffing is verleend;

      ar. directe lijn: een of meer verbindingen voor het transport van elektriciteit, behoudens voor zover die gelegen
      is binnen een installatie, die:

      1°. niet verbonden is met een net of met een andere verbinding voor het transport van elektriciteit en die een
      geïsoleerde productie-installatie van een producent rechtstreeks verbindt met een geïsoleerde verbruiker van
      elektriciteit, niet zijnde de producent of

      2°. ten hoogste via de installatie van één aangeslotene op de verbinding is verbonden met een net of met een andere
      verbinding voor het transport van elektriciteit en die een productie-installatie van een producent, met tussenkomst
      van een leverancier, rechtstreeks verbindt met één of meer verbruikers van elektriciteit, niet zijnde de producent
      of in hoofdzaak huishoudelijke verbruikers, teneinde te voorzien in de elektriciteitsbehoefte van deze verbruikers;

      as. landsgrensoverschrijdend net: een net dat de grens tussen ten minste twee landen overschrijdt en dat de netten
      van die landen onderling koppelt;

      at. interconnector-beheerder: een beheerder van een landsgrensoverschrijdend net dat geen deel uitmaakt van het
      landelijk hoogspanningsnet;

      au. verordening 1227/2011: verordening (EU) nr. 1227/2011 van het Europees Parlement en de Raad van 25 oktober 2011
      betreffende de integriteit en transparantie van de groothandelsmarkt voor energie (PbEU 2011, L 326), alsmede de
      door de Europese Commissie vastgestelde gedelegeerde en uitvoeringshandelingen op grond van verordening 1227/2011;

      av. marktdeelnemer: een marktdeelnemer als bedoeld in artikel 2, zevende lid, van verordening 1227/2011;

      aw. Autoriteit Financiële Markten: de Autoriteit Financiële Markten, genoemd in
      [artikel 1:1 van de Wet op het financieel toezicht][ref16];

      ax. bindende gedragslijn: een zelfstandige last die niet wegens een overtreding wordt opgelegd;

      ay. zelfstandige last: de enkele last tot het verrichten van bepaalde handelingen, bedoeld in
      [artikel 5:2, tweede lid, van de Algemene wet bestuursrecht][ref17], ter bevordering van de naleving van wettelijke
      voorschriften;

      az. windpark: een installatie voor de productie van elektriciteit met behulp van windenergie in hoofdzaak bestaande
      uit één of meer windmolens;

      ba. net op zee: het net, bedoeld in [artikel 15a, eerste lid][ref18];

      bb. certificaat van oorsprong: gegevens op een rekening waarmee wordt aangetoond uit welke energiebron, niet zijnde
      een hernieuwbare energiebron, een hoeveelheid elektriciteit is opgewekt;

      bc. verordening 2019/941: [verordening 2019/941](32841R2019) van het Europees Parlement en de Raad van 5 juni 2019
      betreffende risicoparaatheid in de elektriciteitssector en tot intrekking van [Richtlijn 2005/89/EG](32005L0089)
      (Pb EU 2019, L 158).

      2 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt als afnemer, niet zijnde een afnemer als
      bedoeld in [artikel 95a, eerste lid][ref19], beschouwd een organisatorische eenheid die zich in hoofdzaak bezig
      houdt met het openbaar vervoer per metro, tram of trolley, met mijnbouwkundige activiteiten, met het beheer
      en de exploitatie van telecommunicatie- en kabelnetwerken, met het beheer van de openbare verlichting of van
      verkeersregelinstallaties, dan wel met riolering, bemaling, waterzuivering of transport en distributie van water,
      mits:

      a. deze eenheid daarbij uitsluitend ingevolge de technische aard van de bedrijfsuitoefening beschikt over
      verscheidene aansluitingen,

      b. het totale aan de eenheid voor die bedrijfsuitoefening beschikbaar gestelde vermogen meer bedraagt dan 2 MVA en

      c. de bedrijfsuitoefening door deze eenheid op fysiek geïntegreerde basis geschiedt.

      3 Een onderneming die zich in hoofdzaak bezighoudt met het vervoer van personen of goederen per trein wordt
      in afwijking van het eerste lid, onderdeel c, aangemerkt als afnemer, niet zijnde een afnemer als bedoeld in
      [artikel 95a, eerste lid][ref20], ook indien zij geen aansluiting heeft op een net.

      4 Voor de toepassing van het bij of krachtens deze wet bepaalde worden meerdere onroerende zaken als bedoeld in
      [artikel 16, onderdeel c, van de Wet waardering onroerende zaken][ref21] die zich bevinden in een bouwwerk met:

      a. een woonfunctie bestemd voor bewoners die zijn ingeschreven aan een instelling als bedoeld in
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref22] of aan een universiteit of hogeschool als bedoeld
      in [artikel 1.2, onderdelen a en b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref23] of die
      zich voorbereiden op een promotie als bedoeld in [artikel 7.18 van laatstgenoemde wet][ref24],

      b. een woonoppervlak van maximaal 50 vierkante meter per wooneenheid en

      c. gemeenschappelijke ruimtes die een meeromvattende functie hebben dan de reguliere functie van
      gemeenschappelijke ruimten in een appartementencomplex, beschouwd als één onroerende zaak als bedoeld in
      [artikel 16 van de Wet waardering onroerende zaken][ref25] indien de eigenaar hierom verzoekt bij de netbeheerder.
      Een verzoek kan slechts worden ingetrokken ingeval van ingrijpende renovatie van het bouwwerk.

      5 Deze wet en de daarop berustende bepalingen zijn mede van toepassing op het net op zee dat is gelegen binnen de
      Nederlandse exclusieve economische zone, landsgrensoverschrijdende netten die zijn gelegen binnen de Nederlandse
      exclusieve economische zone en op installaties voor de opwekking van elektriciteit die zijn gevestigd binnen de
      Nederlandse exclusieve economische zone, alsmede de daarmee opgewekte elektriciteit.

      6 Productie-installaties voor de opwekking van elektriciteit met behulp van windenergie of zonne-energie op
      het land die behoren tot eenzelfde onderneming of instelling en die onderling technische, organisatorische of
      functionele bindingen hebben en in elkaars onmiddelijke nabijheid zijn gelegen, worden geacht te beschikken over
      één aansluiting. De netbeheerder en de producent kunnen meerdere aansluitingen overeenkomen indien dit tot lagere
      kosten voor de netbeheerder leidt.

      7 Voor de toepassing van het bij of krachtens deze wet bepaalde worden één of meer windparken of zonneweides op
      land, of een combinatie daarvan die zich in elkaars onmiddellijke nabijheid bevinden, samen met het bijbehorende
      stelsel van verbindingen, beschouwd als één productie-installatie en één onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref26], indien:

      a. ten behoeve van die windparken, zonneweides of een combinatie daarvan gezamenlijk een aanvraag is gedaan bij een
      netbeheerder om aangesloten te worden op dezelfde aansluiting; en

      b. de gevraagde aansluitcapaciteit meer bedraagt dan 2 MVA.


