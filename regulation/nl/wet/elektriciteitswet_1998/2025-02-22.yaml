  - number: '86'
    text: |-
      1 Een producent of een leverancier voert een afzonderlijke boekhouding voor de productie van elektriciteit met
      behulp van zijn installaties onderscheidenlijk de levering van elektriciteit aan afnemers. Indien de producent
      of leverancier andere activiteiten verricht dan die welke verband houden met de productie of de levering van
      elektriciteit, voert hij daarvoor eveneens, al dan niet op geconsolideerde basis, een afzonderlijke boekhouding.

      2 [Artikel 43, tweede tot en met zevende lid][ref1], is van overeenkomstige toepassing op de boekhouding en de
      jaarrekening van de producent of leverancier.

      3 Het eerste en tweede lid zijn niet van toepassing op leveranciers die anders dan bedrijfsmatig elektriciteit
      leveren.

      4 Een leverancier houdt de boekhouding, bedoeld in het eerste lid, gedurende vijf jaar ter beschikking van de
      Autoriteit Consument en Markt en de Europese Commissie.

      5 De Autoriteit Consument en Markt kan informatie uit de boekhouding van de leverancier ter beschikking te stellen
      aan marktpartijen indien is voldaan aan artikel 40, derde lid, van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel43
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 86a
    text: |-
      1 Op overeenkomsten tot transport of levering van elektriciteit is Nederlands recht van toepassing.

      2 De Nederlandse rechter is bij uitsluiting bevoegd kennis te nemen van geschillen over overeenkomsten tot
      transport of levering van elektriciteit.

      3 Een beding dat in strijd met het eerste of tweede lid in een overeenkomst tot het transport of de levering van
      elektriciteit is opgenomen, is nietig.

      4 Het eerste tot en met derde lid is niet van toepassing op een overeenkomst voor levering van elektriciteit die
      een leverancier of handelaar sluit met een persoon die beschikt over een aansluiting op een net met een totale
      maximale doorlaatwaarde van meer dan 3*80 A en een beschikbaar vermogen van ten minste 2 MVA per aansluiting.

      5 De toepasselijkheid van dit artikel wordt beperkt door dwingende bepalingen van internationaal recht.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86a
  - number: 86b
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent het vaststellen of sprake is van een productie-
      installatie voor klimaatneutrale elektriciteit en of de inrichting om te meten geschikt is voor de meting van
      de klimaatneutrale elektriciteit die met een dergelijke productie-installatie wordt opgewekt en op het net wordt
      ingevoed.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86b
  - number: 86c
    text: |-
      1 Onze Minister beslist op een verzoek om een ontheffing als bedoeld in artikel 63 van [verordening 2019/943]
      (32843R2019). De Autoriteit Consument en Markt of, in voorkomend geval, Acer brengt advies aan Onze Minister uit
      over door hem te nemen besluiten als bedoeld in de eerste volzin.

      2 Op een landsgrensoverschrijdend net dat bij de ingebruikname daarvan over een ontheffing als bedoeld in het
      eerste lid beschikt, is [artikel 93][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel93
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '93'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: 86ca
    text: |-
      Indien ingevolge artikel 6, tiende lid, van [verordening 2019/942](32842R2019) Acer bevoegd is een besluit te nemen
      over grensoverschrijdende infrastructuur, is de Autoriteit Consument en Markt hiertoe niet bevoegd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86ca
  - number: 86d
    text: |-
      Indien dat noodzakelijk is in het belang van een voldoende transparante en liquide markt voor vraag en aanbod
      van elektriciteit, transportcapaciteit of productiecapaciteit of in het belang van de daarmee verband houdende
      leveringszekerheid, zullen bij of krachtens algemene maatregel van bestuur regels worden gesteld over:

      a. de wijze waarop of de voorwaarden waaronder producenten, handelaren, leveranciers of netbeheerders
      elektriciteit, transportcapaciteit of productiecapaciteit waarover zij beschikken, aanbieden;

      b. de informatie die producenten, handelaren, leveranciers of netbeheerders verstrekken met betrekking tot de vraag
      en aanbod van elektriciteit, transportcapaciteit of productiecapaciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86d
  - number: 86e
    text: |-
      1 Onze Minister wijst een of meer rechtspersonen aan die tot taak hebben een beurs tot stand te brengen en in stand
      te houden. Onze Minister kan regels stellen in verband met de procedure voor aanwijzing van een beurs. Aan een
      aanwijzing kunnen voorschriften en beperkingen worden verbonden.

      2 Een rechtspersoon, bedoeld in het eerste lid, stelt een beursreglement op. Het beursreglement behoeft de
      goedkeuring van Onze Minister. Van het besluit tot goedkeuring wordt mededeling gedaan in de Staatscourant.

      3 De netbeheerder van het landelijk hoogspanningsnet is verplicht aan de rechtspersoon, bedoeld in het eerste lid,
      en aan de door deze rechtspersoon ingeschakelde derden, voor zover het betreft de afhandeling van de op de beurs
      op tot stand gekomen overeenkomsten, de gevraagde medewerking te verlenen, voor zover deze medewerking noodzakelijk
      is voor een goede uitvoering van de aan deze rechtspersoon opgelegde taak. Onze Minister kan nadere regels stellen
      over de door de netbeheerder van het landelijk hoogspanningsnet te verlenen medewerking.

      4 De rechtspersoon, bedoeld in het eerste lid, die bij de uitvoering van zijn taak de beschikking krijgt
      over gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, is verplicht tot
      geheimhouding van die gegevens, behoudens voor zover de artikelen van deze wet hem tot mededeling verplichten of
      uit zijn taak de noodzaak tot mededeling voortvloeit.

      5 Producenten, leveranciers, handelaren, afnemers en aandeelhouders onthouden zich van elke bemoeiing met de
      uitvoering van de taak die is opgedragen aan de rechtspersoon, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86e
  - number: 86f
    text: |-
      1 Iedere wijziging met betrekking tot zeggenschap als bedoeld in [artikel 26 van de Mededingingswet][ref1] in
      een productie-installatie met een nominaal elektrisch vermogen van meer dan 250 MW of een onderneming die een
      productie-installatie met een nominaal elektrisch vermogen van meer dan 250 MW beheert, wordt door één van de bij
      deze wijziging betrokken partijen gemeld aan Onze Minister.

      2 Onze Minister kan op grond van overwegingen van openbare veiligheid, voorzieningszekerheid
      of leveringszekerheid de wijziging, bedoeld in het eerste lid, verbieden of voorschriften hieraan verbinden.

      3 Rechtshandelingen verricht in strijd met het eerste lid zijn door een rechterlijke uitspraak vernietigbaar.

      4 Bij ministeriële regeling worden regels gesteld met betrekking tot de melding, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel26
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86f
    references:
      - id: ref1
