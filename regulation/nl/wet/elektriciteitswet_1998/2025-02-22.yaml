  - number: '36'
    text: |-
      1 De Autoriteit Consument en Markt stelt de tariefstructuren en voorwaarden vast met inachtneming van:

      a. het voorstel van de gezamenlijke netbeheerders als bedoeld in [artikel 27][ref1], [31][ref2] of [32][ref3] en de
      resultaten van het overleg, bedoeld in [artikel 33, eerste lid][ref4],

      b. het belang van het betrouwbaar, duurzaam, doelmatig en milieuhygiënisch verantwoord functioneren van de
      elektriciteitsvoorziening,

      c. het belang van de bevordering van de ontwikkeling van het handelsverkeer op de elektriciteitsmarkt,

      d. het belang van de bevordering van het doelmatig handelen van afnemers

      e. het belang van een goede kwaliteit van de dienstverlening van netbeheerders,

      f. het belang van een objectieve, transparante en niet discriminatoire handhaving van de energiebalans op een wijze
      die de kosten weerspiegelt,

      g. de in [artikel 26b][ref5] bedoelde regels,

      h. hetgeen is gesteld bij of krachtens [verordening 2019/943](32843R2019) en de richtlijn en

      i. artikel 15 van [richtlijn 2012/27](32012L0027)/EU van het Europees Parlement en de Raad van 25 oktober 2012
      betreffende energie-efficiëntie, tot wijziging van [Richtlijnen 2009/125/EG](32009L0125) en [2010/30](32010L0030)/
      EU en houdende intrekking van de Richtlijnen [2004/8/EG](32004L0008) en [2006/32/EG](32006L0032) (PbEU 2012,
      L 315).

      2 De Autoriteit Consument en Markt stelt de voorwaarden niet vast dan nadat zij zich met inachtneming van artikel
      5 van de richtlijn ervan vergewist heeft dat de voorwaarden de interoperabiliteit van de netten garanderen en
      objectief, evenredig en niet-discriminatoir zijn, alsmede voor zover dat op grond van de notificatierichtlijn
      noodzakelijk is, aan de Europese Commissie in ontwerp zijn meegedeeld en de van toepassing zijnde termijnen,
      bedoeld in artikel 6 van de notificatierichtlijn, zijn verstreken.

      3 Indien een voorstel als bedoeld in [artikel 27][ref6], [31][ref7] of [32][ref8] naar het oordeel van de
      Autoriteit Consument en Markt in strijd is met het belang, bedoeld in het eerste lid, onderdeel b, c, d, e of f,
      met de regels, bedoeld in het eerste lid, onderdelen g en h, of of met de eisen, bedoeld in het tweede lid, draagt
      de Autoriteit Consument en Markt de gezamenlijke netbeheerders op het voorstel onverwijld zodanig te wijzigen
      dat deze strijd wordt opgeheven. [Artikel 4:15 van de Algemene wet bestuursrecht][ref9] is van overeenkomstige
      toepassing.

      4 Indien de gezamenlijke netbeheerders niet binnen vier weken het voorstel wijzigen overeenkomstig de opdracht
      van de Autoriteit Consument en Markt, bedoeld in het derde lid, stelt de Autoriteit Consument en Markt de
      tariefstructuren of de voorwaarden vast onder het aanbrengen van zodanige wijzigingen dat deze in overeenstemming
      zijn met de belangen, bedoeld in het eerste lid, onderdelen b tot en met f, met de regels, bedoeld in het eerste
      lid, onderdelen g en h, en met de eisen, bedoeld in het tweede lid.


