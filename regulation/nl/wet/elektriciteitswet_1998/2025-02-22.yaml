  - number: '26'
    text: |-
      1 De Autoriteit Consument en Markt kan op aanvraag besluiten dat capaciteit op het landsgrensoverschrijdend
      net voor het transport van elektriciteit tot een door haar te bepalen omvang en voor een door haar te bepalen
      tijdsduur bij voorrang wordt bestemd voor door haar aan te geven verzoekers om capaciteit voor het transport van
      elektriciteit, indien die capaciteit uitsluitend is bestemd om op een transparante en niet-discriminatoire wijze,
      die bijdraagt aan een goede marktwerking op de elektriciteitsmarkt, te worden toegewezen.

      2 Bij het nemen van het besluit, bedoeld in het eerste lid, kan de Autoriteit Consument en Markt voor het transport
      van elektriciteit voorwaarden goedkeuren en tarieven vaststellen die afwijken van het bepaalde bij of krachtens de
      [paragrafen 5][ref1] en [6][ref2] van dit hoofdstuk.

      3 Het besluit, bedoeld in het eerste lid, mag niet het gevolg hebben dat de hoeveelheid capaciteit die de
      netbeheerder van het landelijk hoogspanningsnet reserveert om noodzakelijk transport van elektriciteit in het
      kader van onderlinge hulp en bijstand ten behoeve van de instandhouding van de integriteit van de netten te kunnen
      uitvoeren, wordt beperkt.

      4 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
