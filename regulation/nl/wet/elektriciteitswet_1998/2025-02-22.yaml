        artikel: 24b
  - number: 17c
    text: |-
      1 Een groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waar een netbeheerder deel
      van uitmaakt, voert in hoofdzaak de taken uit die bij of krachtens deze wet zijn toegekend aan een netbeheerder of,
      indien van toepassing, de taken die bij of krachtens de Gaswet zijn toegekend aan een netbeheerder als bedoeld in
      [artikel 1, eerste lid, onderdeel e, van de Gaswet][ref2].

      2 Een met een netbeheerder verbonden groepsmaatschappij als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref3] beperkt zich in Nederland tot:

      a. handelingen of activiteiten die gerelateerd zijn aan het beheer van netten of gastransportnetten als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Gaswet][ref4], en betrekking hebben op:

      1°. aanleg en beheer van een landsgrensoverschrijdende net,

      2°. aanleg en beheer van een landsgrensoverschrijdend gastransportnet als bedoeld in
      [artikel 1, eerste lid, onderdeel z, van de Gaswet][ref5],

      3°. aanleg en beheer van kabels en leidingen en daarmee verbonden hulpmiddelen,

      4°. aanleg en beheer van infrastructuur voor het op- of ontladen van elektrische voertuigen,

      5°. aanleg, onderhoud en het ter beschikking stellen van installaties,

      6°. meetdiensten en meetinrichtingen,

      7°. certificering van hernieuwbare energie,

      8°. energiebeurzen en

      9°. schakelen van installaties, niet zijnde productie-installaties;

      b. aanleg en beheer van antenne-opstelpunten ten behoeve van ethercommunicatie;

      c. handelingen of activiteiten die bij of krachtens de [Drinkwaterwet][ref6] zijn toegestaan aan de eigenaar van
      een drinkwaterbedrijf;

      d. handelingen of activiteiten met betrekking tot infrastructuur voor koolstofdioxide;

      e. aanleg en beheer van andere infrastructuur dan bedoeld in onderdelen a tot en met d met inbegrip van transport
      via die infrastructuur, voor zover de met de groepsmaatschappij verbonden netbeheerder blijft voldoen aan
      [artikel 10b][ref7]. Onder andere infrastructuur wordt in ieder geval verstaan: leidingen of installaties voor
      waterstof, biogas, warmte en koude.

      3 Bij algemene maatregel van bestuur kunnen andere dan de in het tweede lid, onderdeel a, genoemde handelingen
      of activiteiten worden aangewezen die de groepsmaatschappij, bedoeld in het tweede lid, voor een in deze algemene
      maatregel van bestuur vastgestelde duur kan verrichten.

      4 Indien handelingen of activiteiten worden aangewezen op grond van het derde lid, worden bij algemene maatregel
      van bestuur regels gesteld over de voortzetting of beëindiging van die handelingen of activiteiten.

      5 De voordracht voor een krachtens het derde en vierde lid vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


