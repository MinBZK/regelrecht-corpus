  - number: '16'
    text: |-
      1 De netbeheerder heeft in het kader van het beheer van de netten in het voor hem krachtens [artikel 36][ref1] of
      [37][ref2] vastgestelde gebied tot taak:

      a. de door hem beheerde netten in werking te hebben en te onderhouden;

      b. de veiligheid en betrouwbaarheid van de netten en van het transport van elektriciteit over de netten op de meest
      doelmatige wijze te waarborgen;

      c. de netten aan te leggen, te herstellen, te vernieuwen of uit te breiden, waarbij in overweging worden
      genomen maatregelen op het gebied van duurzame elektriciteit, energiebesparing en vraagsturing of decentrale
      elektriciteitsproductie waardoor de noodzaak van vervanging of vergroting van de productiecapaciteit ondervangen
      kan worden;

      d. voldoende reservecapaciteit voor het transport van elektriciteit aan te houden;

      e. op de grondslag van [artikel 23][ref3] derden te voorzien van een aansluiting op de netten;

      f. op de grondslag van [artikel 24][ref4] ten behoeve van derden transport van elektriciteit uit te voeren;

      g. het bevorderen van de veiligheid bij het gebruik van toestellen en installaties die elektriciteit verbruiken;

      h. op verzoek van een producent vast te stellen of diens productie-installatie geschikt is voor de opwekking van
      elektriciteit uit hernieuwbare energiebronnen of uit andere energiebronnen dan wel of sprake is van een installatie
      voor hoogrenderende warmtekrachtkoppeling, alsmede of de inrichting om te meten geschikt is voor de meting van de
      elektriciteit die met de productie-installatie wordt opgewekt en op een net of een installatie ingevoed;

      i. de hoeveelheid elektriciteit te meten die afkomstig is van een productie-installatie voor duurzame elektriciteit
      of klimaatneutrale elektriciteit of van een installatie voor hoogrenderende warmtekrachtkoppeling;

      j. koppelingen met andere netten te realiseren en reparaties aan zijn net uit te voeren;

      k. onverminderd [artikel 79][ref5], op een geschikte wijze gegevens te publiceren over koppelingen tussen de
      netten, gebruik van de netten en de toewijzing van transportcapaciteit;

      l. afnemers alle gegevens te verstrekken die zij voor een efficiënte toegang tot het net inclusief het gebruik
      ervan nodig hebben;

      m. voorzieningen te treffen in geval van een faillissement van een leverancier van elektriciteit aan afnemers als
      bedoeld in [artikel 95a, eerste lid][ref6];

      n. ervoor zorg te dragen dat een afnemer als bedoeld in [artikel 95a, eerste lid][ref7], voor elke aansluiting
      beschikt over een geïnstalleerde meetinrichting, tenzij die afnemer blijkens de voorwaarden, bedoeld in
      [artikel 31, eerste lid, onderdelen a of b][ref8], beschikt over een onbemeten aansluiting;

      o. zorg te dragen voor het beheer en onderhoud van de bij een afnemer als bedoeld in
      [artikel 95a, eerste lid][ref9], geïnstalleerde meetinrichting;

      p. de taken te vervullen die voortvloeien uit het bepaalde bij of krachtens [verordening 2019/943](32843R2019);

      q. zijn netten te beschermen tegen mogelijke invloeden van buitenaf.

      2 In aanvulling op de taken, bedoeld in het eerste lid, heeft de netbeheerder van het landelijk hoogspanningsnet
      tevens tot taak:

      a. technische voorzieningen te treffen en systeemdiensten uit te voeren, waaronder het aanhouden van voldoende
      productiereservecapaciteit, die nodig zijn om het transport van elektriciteit over alle netten op een veilige en
      doelmatige wijze te waarborgen;

      b. mede ten behoeve van de andere netbeheerders de technische voorzieningen en systeemdiensten, bedoeld onder a,
      te benutten;

      c. op de grondslag van [paragraaf 7 van dit hoofdstuk][ref10] ten behoeve van derden transport van elektriciteit
      uit te voeren met behulp van het landelijk hoogspanningsnet, voor de uitvoer van die elektriciteit vanuit Nederland
      naar een afnemer of leverancier in het buitenland, dan wel voor de invoer van die elektriciteit vanuit het
      buitenland naar een afnemer of leverancier in Nederland;

      d. een passend niveau van voorzieningen te treffen en te handhaven, waaronder het aanhouden van voldoende
      productiereservecapaciteit, in verband met de leveringszekerheid op de korte en de lange termijn;

      e.

      f. indien Onze Minister hem dit opdraagt, werkzaamheden te verrichten ter uitvoering van de taak, bedoeld in
      [artikel 4a][ref11] of van [verordening 2019/941](32841R2019);

      g. andere netbeheerders de gegevens te verschaffen die nodig zijn om een betrouwbare en efficiënte werking, alsmede
      de samenhangende ontwikkeling en interoperabiliteit, van de netten te waarborgen. In geval van grensoverschrijdende
      koppeling met andere lidstaten van de Europese Unie dan wel met niet lidstaten wisselt de netbeheerder van het
      landelijk hoogspanningsnet met de betreffende netbeheerders in die landen, in overeenstemming met de operationele
      minimumvereisten als bedoeld in [artikel 31, elfde lid][ref12], tijdig en op doeltreffende wijze gegevens uit over
      het functioneren van de landgrensoverschrijdende netten;

      h. samen te werken met buitenlandse instellingen die op grond van nationale wettelijke regels zijn belast met het
      beheer van een transmissiesysteem als bedoeld in artikel 2, onderdeel 4, van de richtlijn in geografische gebieden
      als bedoeld in artikel 34, derde lid, van [verordening 2019/943](32843R2019) teneinde een concurrerende interne
      markt voor elektriciteit tot stand te brengen;

      i. te beschikken over één of meer geïntegreerde systemen in geografische gebieden als bedoeld in artikel 34,
      derde lid, van [verordening 2019/943](32843R2019) waaraan twee of meer lidstaten meewerken voor de toewijzing van
      capaciteit en voor de controle op de beveiliging van het net;

      j. het innen van congestielasten en betalingen in het kader van het vergoedingsmechanisme overeenkomstig artikel 49
      van [verordening 2019/943](32843R2019);

      k. onverminderd [artikel 79, eerste lid][ref13], het openbaar maken van informatie die nodig is voor doeltreffende
      mededinging en een efficiënte werking van de markt;

      l.

      m. samen te werken met Acer;

      n. het koppelen van het net op zee met het landelijk hoogspanningsnet.

      3 Producenten, leveranciers en handelaren onthouden zich van iedere bemoeiing met de uitvoering van de taken die op
      grond van het eerste of tweede lid aan een netbeheerder zijn opgedragen.

      4 Een net met een spanningsniveau van 110 kV of hoger, met uitzondering van het net op zee, is zodanig ontworpen en
      in werking dat het transport van elektriciteit ook verzekerd is indien zich een uitvalsituatie voordoet, tenzij:

      a. voor een bepaalde uitvalsituatie vrijstelling is verleend bij algemene maatregel van bestuur;

      b. voor een bepaald onderdeel van het net op aanvraag van de desbetreffende netbeheerder ontheffing is verleend
      door de Autoriteit Consument en Markt. Aan de ontheffing kunnen voorschriften en beperkingen worden verbonden.

      5 Bij algemene maatregel van bestuur worden regels gesteld over de verlening, wijziging en intrekking van een
      ontheffing als bedoeld in het vierde lid, onderdeel b.

      6 Indien een netbeheerder energie inkoopt ter uitvoering van zijn wettelijke taken, doet hij dit op basis van een
      transparante, niet-discriminatoire en marktconforme procedure.

      7 Van een besluit als bedoeld in het tweede lid, onderdeel f, wordt mededeling gedaan door plaatsing in de
      Staatscourant.

      8 Bij algemene maatregel van bestuur worden regels gesteld ter uitvoering van de taak, bedoeld in het eerste lid,
      onderdeel m. Deze regels hebben mede betrekking op de wijze waarop enerzijds de netbeheerder van het landelijk
      hoogspanningsnet en anderzijds de producenten, leveranciers, handelaren en afnemers zich jegens elkaar gedragen in
      verband met de uitvoering van de taak, bedoeld in het tweede lid, onderdeel d.

      9 De Autoriteit Consument en Markt brengt advies uit over het ontwerp van de algemene maatregel van bestuur,
      bedoeld in het achtste lid. De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel
      van bestuur wordt niet gedaan dan nadat het ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de
      gelegenheid is geboden om binnen vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen
      ter kennis van Onze Minister te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der
      Staten-Generaal overgelegd.

      10 Tot de voorzieningen die de netbeheerder van het landelijk hoogspanningsnet ter uitvoering van zijn taak bedoeld
      in het tweede lid, onderdeel d, treft, behoren het voor transport van elektriciteit handhaven van reservecapaciteit
      die groot genoeg is om de operationele netwerkveiligheid te waarborgen en het samenwerken met netbeheerders waarmee
      hij een landgrensoverschrijdend net heeft.

      11 Een beslissing tot het aanleggen van een landsgrensoverschrijdend net door de netbeheerder van het landelijke
      hoogspanningsnet dan wel door een ander als bedoeld in het zesde lid wordt niet genomen dan in nauwe samenwerking
      met de netbeheerders in andere landen waarmee een landgrensoverschrijdend net tot stand wordt gebracht en andere
      relevante netbeheerders.

      12 Indien de netbeheerder van het landelijk hoogspanningsnet het noodzakelijke acht voorzieningen te treffen als
      bedoeld in [artikel 16, tweede lid, onderdeel d][ref14], ter uitvoering van zijn taak de leveringszekerheid voor
      de lange termijn te waarborgen, verstrekt hij de Autoriteit Consument en Markt een overzicht van de te nemen
      maatregelen en de gevolgen van die maatregelen voor afnemers en het functioneren van de markt. De Autoriteit
      Consument en Markt zendt het overzicht vergezeld van haar advies aan Onze Minister. De maatregelen behoeven de
      goedkeuring van Onze Minister.

      13 Onze Minister verleent zijn goedkeuring niet eerder dan vier weken nadat het overzicht en het advies, bedoeld in
      het dertiende lid, aan beide kamers der Staten-Generaal is overgelegd.

      14 Indien de netbeheerder van het landelijk hoogspanningsnet deelneemt aan een gemeenschappelijke onderneming
      waaraan ook een verticaal geïntegreerde buitenlandse instelling die op grond van nationale wettelijke regels is
      belast met het beheer van een transmissiesysteem als bedoeld in artikel 2, onderdeel 4, van de richtlijn deelneemt,
      draagt de netbeheerder van het landelijk hoogspanningsnet er zorg voor dat de gemeenschappelijke onderneming een
      nalevingsprogramma ontwerpt, door Acer laat goedkeuren en implementeert met maatregelen die moeten worden genomen
      om discriminerend en concurrentieverstorend gedrag uit te sluiten.

      15 Voordat de netbeheerder van het landelijk hoogspanningsnet congestiebeheersprocedures hanteert voor
      landsgrensoverschrijdende netten, legt hij deze procedures ter goedkeuring voor aan de Autoriteit Consument en
      Markt.

      16 Het eerste lid, onderdelen a tot en met l en q zijn van overeenkomstige toepassing op de netbeheerder van het
      net op zee.


