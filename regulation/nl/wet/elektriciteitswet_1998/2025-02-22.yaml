  - number: 41b.1.c
    text: |-
      het bepaalde bij of krachtens [artikel 41a][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel41a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41b
    references:
      - id: ref1
