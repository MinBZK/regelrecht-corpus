  - number: 93a
    text: De aandelen van de netbeheerder van het landelijk hoogspanningsnet berusten direct of indirect bij de staat.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel93a
  - number: '94'
    text: |-
      1 In afwijking van [artikel 93a][ref1] kunnen aandelen in de netbeheerder van het landelijk hoogspanningsnet direct
      of indirect berusten bij een buitenlandse instelling die op grond van nationale wettelijke regels is belast met het
      beheer van een transmissiesysteem als bedoeld in artikel 2, onderdeel 4, van de richtlijn, of bij de middellijk of
      onmiddellijk aandeelhouder van die buitenlandse instelling, voor zover:

      a. ten minste 75 procent van de aandelen in de netbeheerder en de overwegende zeggenschap over de netbeheerder
      direct of indirect bij de staat blijft,

      b. de samenwerking tussen de netbeheerder en een buitenlandse instelling wordt bevorderd,

      c. er sprake is van een aandelenruil die de betrouwbaarheid, betaalbaarheid of duurzaamheid van het net ten goede
      komt en

      d. de aandelen in de netbeheerder of de groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref2] waar die netbeheerder deel van uitmaakt, komen te
      berusten bij een instelling die de beheerder is van een net dat een directe verbinding heeft met het landelijke
      hoogspanningsnet in Nederland of dat door middel van een landsgrensoverschrijdend net met het landelijke
      hoogspanningsnet is verbonden.

      2 Het voornemen de aandelen in de netbeheerder direct of indirect te laten berusten bij een buitenlandse instelling
      of bij de middellijk of onmiddellijk aandeelhouder van die buitenlandse instelling behoeft instemming van beide
      kamers der Staten-Generaal.

      3 Onze Minister van Financiën treedt niet eerder in onderhandeling dan dertig dagen nadat hij schriftelijk
      mededeling heeft gedaan aan de Staten-Generaal van het voornemen, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel93a
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
