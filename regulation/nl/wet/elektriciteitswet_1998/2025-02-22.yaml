  - number: '68'
    text: |-
      1 Producenten en leveranciers hebben tot taak, mede gelet op het belang van de bescherming van het milieu, bedoeld
      in artikel 3, tweede lid, van de richtlijn, te bevorderen dat elektriciteit door henzelf en door afnemers op een
      doelmatige en milieuhygiënisch verantwoorde wijze wordt geproduceerd of gebruikt.

      2 Iedere producent of leverancier die per jaar gemiddeld 10 GWh of meer levert meldt eenmaal in elke twee jaar vóór
      1 maart aan Onze Minister op welke wijze hij in de twee jaar voorafgaande aan het jaar, waarin de melding wordt
      verricht, uitvoering heeft gegeven aan zijn taak, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel68
  - number: '73'
    text: |-
      1 Onze Minister is belast met het uitgeven en innemen via een elektronisch systeem van:

      a. garanties van oorsprong voor duurzame elektriciteit;

      b. garanties van oorsprong voor elektriciteit opgewekt in een installatie voor hoogrenderende
      warmtekrachtkoppeling;

      c. certificaten van oorsprong.

      2 Onze Minister opent op aanvraag van een in Nederland gevestigde producent, leverancier, handelaar of
      afnemer een rekening. Bij deze aanvraag overlegt de producent het resultaat van de vaststelling, bedoeld in
      [artikel 16, eerste lid, onderdeel h][ref1].

      3 Onze Minister boekt op aanvraag garanties van oorsprong als bedoeld in het eerste lid of certificaten van
      oorsprong op een daarbij aangegeven rekening, indien een in Nederland gevestigde producent bij deze aanvraag
      de gegevens omtrent de door de netbeheerder of door een andere tot meten bevoegde instantie gemeten opgewekte
      hoeveelheid elektriciteit overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '74'
    text: |-
      Onze Minister kan de taken, bedoeld in [artikel 73][ref1], mandateren aan een niet-ondergeschikte die onafhankelijk
      is van producenten, leveranciers en handelaren.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel73
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '73'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '75'
    text: |-
      1 Een garantie van oorsprong voor duurzame elektriciteit toont bij uitsluiting aan dat de daarop aangegeven
      hoeveelheid elektriciteit is opgewekt uit hernieuwbare bronnen.

      2 Een garantie van oorsprong voor elektriciteit opgewekt in een installatie voor hoogrenderende
      warmtekrachtkoppeling toont bij uitsluiting aan dat de daarop aangegeven hoeveelheid elektriciteit is opgewekt in
      een installatie voor hoogrenderende warmtekrachtkoppeling.

      3 Een certificaat van oorsprong toont bij uitsluiting aan dat de daarop aangegeven hoeveelheid elektriciteit is
      opgewekt uit een andere energiebron dan hernieuwbare energiebronnen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel75
  - number: '76'
    text: |-
      1 Garanties van oorsprong voor duurzame elektriciteit of garanties van oorsprong voor elektriciteit opgewekt in een
      installatie voor hoogrenderende warmtekrachtkoppeling uitgegeven door een onafhankelijke instantie in een andere
      lidstaat van de Europese Unie, die naar aard en strekking overeenkomen met in Nederland uitgegeven garanties van
      oorsprong voor duurzame elektriciteit of garanties van oorsprong voor elektriciteit opgewekt in een installatie
      voor hoogrenderende warmtekrachtkoppeling worden daarmee gelijkgesteld.

      2 Garanties van oorsprong voor duurzame elektriciteit of garanties van oorsprong voor elektriciteit opgewekt in
      een installatie voor hoogrenderende warmtekrachtkoppeling uitgegeven door een onafhankelijke instantie in een derde
      land, die naar aard en strekking overeenkomen met in Nederland uitgegeven garanties van oorsprong, worden niet
      erkend, behalve indien de Europese Unie daarvoor een overeenkomst heeft afgesloten met het derde land en de energie
      rechtstreeks uit dat land wordt ingevoerd of uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel76
  - number: '77'
    text: |-
      1 Onze Minister stelt bij ministeriële regeling de tarieven vast voor kosten die gepaard gaan met handelingen met
      betrekking tot garanties van oorsprong, bedoeld in [artikel 73, eerste lid][ref1], of certificaten van oorsprong.

      2 Onze Minister stelt bij ministeriële regeling regels met betrekking tot:

      a. de informatie die door producenten, leveranciers, handelaars, afnemers of netbeheerders verstrekt wordt aan
      Onze Minister;

      b. het uitgeven en de geldigheidsduur van garanties van oorsprong, bedoeld in [artikel 73, eerste lid][ref2], of
      certificaten van oorsprong;

      c. het vermelden van gegevens op garanties van oorsprong, bedoeld in [artikel 73, eerste lid][ref3], of
      certificaten van oorsprong;

      d. de voorwaarden waaronder en de wijze waarop producenten, leveranciers, handelaars of afnemers gebruik kunnen
      maken van de door hen verkregen garanties van oorsprong, bedoeld in [artikel 73, eerste lid][ref4], of certificaten
      van oorsprong, of deze kunnen verhandelen;

      e. de vaststelling, bedoeld in [artikel 16, eerste lid, onderdeel h][ref5];

      f. het meten, bedoeld in [artikel 16, eerste lid, onderdeel i][ref6], en [artikel 16a, eerste lid][ref7].

      3 De regels, bedoeld in het tweede lid, kunnen verschillen voor de verschillende soorten garanties van oorsprong,
      bedoeld in [artikel 73, eerste lid][ref8], of certificaten van oorsprong.


