  - number: 42e
    text: |-
      1 De Autoriteit Consument en Markt stelt de toegestane inkomsten, met in achtneming van
      [artikel 42d, eerste en tweede lid][ref1], van de netbeheerder van het net op zee, jaarlijks vast.

      2 De Autoriteit Consument en Markt kan de toegestane inkomsten die zullen gelden in het jaar t corrigeren, indien
      vastgestelde inkomsten in dat jaar of de jaren voorafgaand aan het jaar t:

      a. bij rechterlijke uitspraak of met toepassing van [artikel 6:19][ref2] of
      [7:11 van de Algemene wet bestuursrecht][ref3] zijn gewijzigd;

      b. zijn vastgesteld met inachtneming van onjuiste of onvolledige gegevens en de Autoriteit Consument en Markt,
      indien zij de beschikking had over juiste of volledige gegevens, inkomsten zou hebben vastgesteld die in
      aanmerkelijke mate zouden afwijken van de vastgestelde inkomsten;

      c. zijn vastgesteld met gebruikmaking van geschatte gegevens en de feitelijke gegevens daarvan afwijken;

      d. zijn vastgesteld met gebruikmaking van gegevens omtrent kosten voor bepaalde diensten, terwijl de netbeheerder
      van het net op zee die diensten in het jaar t of een gedeelte van jaar t niet heeft geleverd of voor die diensten
      geen of minder kosten heeft gemaakt;

      e. zijn vastgesteld op basis van de geschatte kosten als bedoeld in
      [artikel 42d, eerste lid, onderdelen d en e][ref4], en de gerealiseerde efficiënte kosten die daarvan afwijken.

      3 Indien een voorstel niet binnen de termijn, bedoeld in [artikel 42d, eerste lid][ref5], aan de Autoriteit
      Consument en Markt is gezonden, stelt deze de toegestane inkomsten voor de netbeheerder van het net op zee uit
      eigen beweging vast met inachtneming van artikel 42d, eerste en tweede lid.

      4 Indien de totale inkomsten aan het begin van de periode, bedoeld in [artikel 42b, tweede lid][ref6],
      niet in overeenstemming zijn met het efficiënte kostenniveau inclusief een rendement dat in het economisch
      verkeer gebruikelijk is, kan de Autoriteit Consument en Markt bij de toepassing van de formule, genoemd in
      [artikel 42d, eerste lid, onderdeel a][ref7], in plaats van TIt-1, de totale inkomsten vaststellen op het
      efficiënte kostenniveau inclusief een rendement dat in het economisch verkeer gebruikelijk is.

      5 Indien een besluit op grond van [artikel 42b, eerste lid][ref8], of [artikel 42c, eerste lid][ref9], bij
      onherroepelijke rechterlijke uitspraak is vernietigd of bij een onherroepelijk besluit op bezwaar is herroepen,
      herberekent de Autoriteit Consument en Markt de inkomsten, bedoeld in het eerste lid, met toepassing van de met
      inachtneming van die uitspraak of dat besluit op bezwaar gecorrigeerde methode onderscheidenlijk gecorrigeerde
      doelmatigheidskorting en verdisconteert zij de uitkomsten van deze herberekening in de eerstvolgende op grond
      van het eerste lid vast te stellen inkomsten. Daarbij worden deze herberekening en de wijze waarop de uitkomsten
      daarvan in de inkomsten zijn verdisconteerd separaat weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel42d
