  - number: 42b
    text: |-
      1 De Autoriteit Consument en Markt stelt na overleg met de gezamenlijke netbeheerders en representatieve
      organisaties van partijen op de elektriciteitsmarkt, ten aanzien van de taken van de netbeheerder van het net
      op zee, genoemd in [artikel 16, zestiende lid][ref1], met inachtneming van het belang dat door middel van
      marktwerking ten behoeve van afnemers de doelmatigheid van de bedrijfsvoering en de meest doelmatige kwaliteit van
      het transport worden bevorderd en rekening houdend met het belang van voorzieningszekerheid, duurzaamheid en een
      redelijk rendement op investeringen, voor de netbeheerder van het net op zee, de methode vast tot vaststelling van
      de korting ter bevordering van de doelmatige bedrijfsvoering en de toegestane inkomsten.

      2 Het besluit tot vaststelling van de methode geldt voor een periode van ten minste drie en ten hoogste vijf jaar.

      3 De korting ter bevordering van de doelmatige bedrijfsvoering heeft onder meer ten doel te bereiken dat de
      netbeheerder van het net op zee in ieder geval geen rendement kan behalen dat hoger is dan in het economische
      verkeer gebruikelijk.

      4 Bij de beoordeling van de doelmatigheid van de kosten ten behoeve van de korting ter bevordering van de
      doelmatige bedrijfsvoering van de beheerder van het net op zee:

      a. worden niet-beïnvloedbare kosten door de Autoriteit Consument en Markt zo veel mogelijk buiten beschouwing
      gelaten;

      b. laat de Autoriteit Consument en Markt de kosten die betrekking hebben op landspecifieke kenmerken, waaronder de
      kwaliteit van het net, buiten beschouwing.

      5 Bij de vaststelling van de korting ter bevordering van de doelmatige bedrijfsvoering:

      a. worden de niet-beïnvloedbare kosten door de Autoriteit Consument en Markt buiten beschouwing gelaten;

      b. houdt de Autoriteit Consument en Markt in ieder geval rekening met de financierbaarheid van de netbeheerder van
      het net op zee.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
