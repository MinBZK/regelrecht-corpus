  - number: '13.3'
    text: |-
      Indien de netbeheerder niet voldoet aan een opdracht als bedoeld in het tweede lid, indien hij vaststelt dat
      opdrachten, bedoeld in [artikel 13a, eerste lid][ref1], niet worden uitgevoerd of indien naar het oordeel
      van Onze Minister door de bedrijfsvoering van deze netbeheerder de continuïteit of de betrouwbaarheid van de
      elektriciteitsvoorziening voor afnemers in gevaar komt en onverwijld ingrijpen noodzakelijk is, kan Onze Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel13a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 13a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 13.3.a
    text: |-
      de aanwijzing van de desbetreffende netbeheerder vervallen verklaren en uiterlijk op de dag waarop die aanwijzing
      vervalt een andere naamloze of besloten vennootschap als netbeheerder aanwijzen, of
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel13
  - number: 13.3.b
    text: |-
      [artikel 13a][ref1] toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel13a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 13a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '13.4'
    text: |-
      In een beschikking als bedoeld in het derde lid, onderdeel a, bepaalt Onze Minister de termijn waarop die
      aanwijzing vervalt en kan hij degene die de netbeheerder, bedoeld in de aanhef van het derde lid, heeft aangewezen
      in de gelegenheid stellen binnen een door Onze Minister te bepalen termijn een andere netbeheerder aan hem ter
      aanwijzing voor te dragen. Onze Minister kan deze termijn eenmaal verlengen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel13
  - number: '13.5'
    text: |-
      Onze Minister kan voor de periode totdat een beschikking als bedoeld in het derde lid, onderdeel a, in werking
      treedt, [artikel 13a][ref1] toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel13a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 13a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '13.6'
    text: |-
      Uiterlijk op de dag waarop een beschikking tot aanwijzing van Onze Minister in werking treedt, draagt de
      netbeheerder of, indien van toepassing, degene aan wie een net toebehoort, de economische eigendom van het net over
      aan de aangewezen nieuwe netbeheerder. Degene die de netbeheerder, bedoeld in de aanhef van het derde lid, heeft
      aangewezen, verleent daaraan voor zover nodig zijn medewerking.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel13
  - number: '13.7'
    text: |-
      De overdracht van de economische eigendom, bedoeld in het zesde lid, geschiedt tegen verrichting van een
      tegenprestatie waarvan de waarde uiterlijk op de in dat lid bedoelde dag is vastgesteld en die ten hoogste de
      opbrengst vertegenwoordigt van de exploitatie van het net, zoals deze op basis van algemene bedrijfseconomische
      uitgangspunten kan worden afgeleid van de door de Autoriteit Consument en Markt in de daaraan voorafgaande periode
      van vijf jaar vastgestelde tarieven met betrekking tot het netbeheer. Deze tegenprestatie kan zowel bestaan uit een
      periodieke uitkering als uit een contant bedrag ineens.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel13
  - number: '13.8'
    text: |-
      Indien de tegenprestatie, bedoeld in het zevende lid, niet kan worden afgeleid uit de vastgestelde tarieven, kan de
      tegenprestatie worden vastgesteld volgens bij algemene maatregel van bestuur vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel13
  - number: '13.9'
    text: |-
      Aan de vaststelling van de tegenprestatie, bedoeld in het zevende en achtste lid, verlenen degene die de
      economische eigendom van het net overdraagt en degene die deze eigendom overneemt, voor zover nodig hun
      medewerking.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel13
  - number: '13.10'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bepaalde in dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel13
  - number: 13a.1
    text: |-
      Onze Minister kan de netbeheerder aanzeggen dat hij vanaf een bepaald tijdstip de opdrachten dient op te volgen
      die aan hem worden verstrekt door een door Onze Minister aangewezen persoon. Bij de aanzegging geeft Onze Minister
      aan ter bescherming van welk belang de aanzegging geschiedt. Bij de aanzegging kunnen voorschriften en beperkingen
      worden gesteld aan de te geven opdrachten. De aangewezen persoon verstrekt uitsluitend opdrachten ter bescherming
      van het belang, bedoeld in de tweede volzin.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel13a
  - number: 13a.2
    text: De netbeheerder verschaft de door Onze Minister aangewezen persoon desgevraagd alle medewerking.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel13a
  - number: 13a.3
    text: Onze Minister kan te allen tijde de door hem aangewezen persoon vervangen door een andere persoon.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel13a
  - number: 13a.4
    text: |-
      De door Onze Minister aangewezen persoon oefent zijn bevoegdheid uit gedurende een door Onze Minister in de
      aanzegging bepaalde termijn. Deze termijn bedraagt ten hoogste zes maanden indien het betreft een aanzegging als
      bedoeld in [artikel 13, derde lid, onderdeel b][ref1]. Deze termijn kan eenmaal met ten hoogste zes maanden worden
      verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel13
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 13a.5
    text: |-
      Voor schade ten gevolge van handelingen die zijn verricht in strijd met een opdracht als bedoeld in het eerste lid,
      zijn bestuurders persoonlijk aansprakelijk tegenover de netbeheerder.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel13a
  - number: '14.1'
    text: |-
      Degenen, bedoeld in [artikel 10, tweede of negende lid][ref1], kunnen met inachtneming van een redelijke termijn
      de aanwijzing als netbeheerder vervangen door een aanwijzing van een andere naamloze of besloten vennootschap als
      netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '14.2'
    text: |-
      In geval van fusie, splitsing, ontbinding of faillissement van de vennootschap die als netbeheerder
      is aangewezen, vervalt de aanwijzing als netbeheerder van rechtswege en wijzen degenen, bedoeld in
      [artikel 10, tweede of negende lid][ref1], volgens de procedure van artikel 10 een naamloze of besloten
      vennootschap als netbeheerder aan. Deze vennootschap kan dezelfde zijn als de vennootschap die daarvoor als
      netbeheerder was aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '14.3'
    text: |-
      Degenen, bedoeld in [artikel 10, tweede of negende lid][ref1], wijzen voor afloop van de periode, bedoeld in
      artikel 10, tweede of tiende lid, een naamloze of besloten vennootschap als netbeheerder aan voor de daarop
      aansluitende periode. Deze vennootschap kan dezelfde zijn als de vennootschap die daarvoor als netbeheerder was
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '14.4'
    text: |-
      De [artikelen 10 tot en met 13][ref1] zijn van overeenkomstige toepassing op de aanwijzing als netbeheerder,
      bedoeld in het eerste, tweede of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '15.1'
    text: |-
      De Autoriteit Consument en Markt kan op diens aanvraag ontheffing verlenen aan een eigenaar van een net, niet
      zijnde het landelijk hoogspanningsnet, van het gebod van [artikel 10, negende lid][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 15.1.a
    text: |-
      het bedrijfs- of productieproces van de gebruikers van het net om specifieke technische of veiligheidsredenen
      geïntegreerd is of het net primair elektriciteit distribueert voor de eigenaar van dat net of de daarmee verwante
      ondernemingen,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
  - number: 15.1.b
    text: |-
      de aanvrager geen netbeheerder is en niet in een groepsmaatschappij als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] met een netbeheerder verbonden is,


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 15.1.c
    text: |-
      het net binnen een geografisch afgebakende industriële locatie, commerciële locatie of locatie met gedeelde
      diensten ligt en dat net technisch, organisatorisch of functioneel verbonden is,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
  - number: 15.1.d
    text: op het net minder dan 500 afnemers zijn aangesloten,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
  - number: 15.1.e
    text: |-
      het net geen huishoudelijke eindafnemers van elektriciteit voorziet, tenzij er sprake is van incidenteel gebruik
      door een klein aantal huishoudelijke eindafnemers dat werkzaam is bij of vergelijkbare betrekkingen heeft met de
      eigenaar van het net en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
  - number: 15.1.f
    text: de veiligheid en betrouwbaarheid van het net voldoende is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
  - number: '15.2'
    text: |-
      De Autoriteit Consument en Markt neemt het besluit zo spoedig mogelijk, doch uiterlijk zes maanden na ontvangst van
      de aanvraag. Deze termijn kan eenmaal met ten hoogste zes maanden worden verlengd. De Autoriteit Consument en Markt
      kan aan een ontheffing voorschriften en beperkingen verbinden.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
  - number: '15.3'
    text: 'De Autoriteit Consument en Markt kan een ontheffing intrekken indien degene aan wie de ontheffing is verleend:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
  - number: 15.3.a
    text: niet langer voldoet aan de voorwaarden, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
  - number: 15.3.b
    text: |-
      in strijd handelt met de voorschriften en beperkingen als bedoeld in het tweede lid en het bepaalde bij of
      krachtens het vijfde tot en met het zevende lid;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
  - number: 15.3.c
    text: |-
      bij de aanvraag om een ontheffing onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van juiste of
      volledige gegevens tot een andere beschikking op de aanvraag zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
  - number: '15.4'
    text: |-
      Indien een ontheffing is verleend, zijn uitsluitend het vijfde en zesde lid van toepassing op de eigenaar van een
      gesloten distributiesysteem.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
  - number: '15.5'
    text: De eigenaar van een gesloten distributiesysteem beheert het gesloten distributiesysteem.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
  - number: '15.6'
    text: |-
