        paragraaf: '4'
  - number: 15.6.c
    text: |-
      in artikel [78][ref1] in plaats van «netbeheerder» wordt gelezen «eigenaar van een gesloten distributiesysteem».


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel78
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '78'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '15.7'
    text: |-
      De Autoriteit Consument en Markt kan op aanvraag van degene die voornemens is een gesloten distributiesysteem
      aan te leggen en die beschikt over de daarvoor benodigde vergunningen, ontheffingen en toestemmingen,
      ontheffing verlenen van het gebod van [artikel 10, negende lid][ref1]. Het eerste tot en met zesde lid zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '15.8'
    text: |-
      De Autoriteit Consument en Markt keurt op verzoek van een aangeslotene op een gesloten distributiesysteem de van
      kracht zijnde methode voor de berekening van de tarieven goed.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
  - number: '15.9'
    text: |-
      Indien een verzoek als bedoeld in het achtste lid is ontvangen, overlegt de eigenaar van een gesloten
      distributiesysteem binnen drie maanden na de datum waarop de Autoriteit Consument en Markt de eigenaar van een
      gesloten distributiesysteem over het verzoek heeft geïnformeerd, aan de Autoriteit Consument en Markt informatie
      over het aan het verzoek voorafgaande kalenderjaar die relevant is voor de beoordeling van het verzoek, met daarbij
      een toerekening van de kosten en opbrengsten aan activiteiten die verband houden met de aanleg en het beheer van
      het gesloten distributiesysteem in overeenstemming met het daadwerkelijk gebruik van financiële of andere middelen
      voor die activiteiten.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
  - number: '15.10'
    text: |-
      Een besluit als bedoeld in het achtste lid wordt genomen binnen zes maanden nadat de informatie, bedoeld in het
      negende lid door de Autoriteit Consument en Markt is ontvangen. Deze termijn kan eenmaal met ten hoogste zes
      maanden worden verlengd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
  - number: 15a.1
    text: |-
      Het net op zee omvat de netten die bestemd zijn voor het transport van elektriciteit en die één of meer
      windparken op zee verbinden met het landelijk hoogspanningsnet met uitzondering van leidingen en daarmee
      verbonden hulpmiddelen ten behoeve van het transport van elektriciteit die één of meer windparken op zee
      verbinden met het landelijk hoogspanningsnet en waarvoor voor 1 januari 2016 een omgevingsvergunning voor
      een beperkingengebiedactiviteit met betrekking tot een weg respectievelijk een waterstaatswerk als bedoeld in
      [artikel 5.1, tweede lid, aanhef en onder f, onder 1° respectievelijk onder 2°, van de Omgevingswet][ref1] is
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '5'
  - number: 15a.2
    text: |-
      Hetgeen in [hoofdstuk 3, paragraaf 1][ref1], en in de [artikelen 19b][ref2], [19c][ref3], [21][ref4], [93a][ref5]
      en [94][ref6] geldt onderscheidenlijk niet geldt voor de netbeheerder van het landelijk hoogspanningsnet, geldt
      eveneens onderscheidenlijk geldt eveneens niet voor de netbeheerder van het net op zee.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel19b
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel19c
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0009755#Artikel93a
      [ref6]: https://wetten.overheid.nl/BWBR0009755#Artikel94
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 19b
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
