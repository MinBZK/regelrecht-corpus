  - number: 10b
    text: |-
      1 Een netbeheerder maakt geen deel uit van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waartoe ook een rechtspersoon of vennootschap behoort die
      in Nederland elektriciteit produceert of levert of daarin handelt.

      2 Rechtspersonen en vennootschappen die deel uitmaken van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref2] waartoe ook een rechtspersoon of vennootschap behoort die
      in Nederland elektriciteit produceert of levert of daarin handelt, houden geen aandelen in een netbeheerder of in
      een rechtspersoon die deel uitmaakt van een groep waartoe ook een netbeheerder behoort en nemen niet deel in een
      vennootschap die deel uitmaakt van een groep waartoe ook een netbeheerder behoort.

      3 Een netbeheerder en met de netbeheerder verbonden groepsmaatschappijen als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref3]:

      a. houden geen aandelen in een rechtspersoon die in Nederland elektriciteit produceert of levert of daarin handelt
      of in een rechtspersoon die deel uitmaakt van een groep waartoe ook een rechtspersoon behoort die in Nederland
      elektriciteit produceert of levert of daarin handelt;

      b. nemen niet deel in een vennootschap die in Nederland elektriciteit produceert of levert of daarin handelt of
      in een vennootschap die deel uitmaakt van een groep waartoe ook een rechtspersoon of vennootschap behoort die in
      Nederland elektriciteit produceert of levert of daarin handelt.

      4 In aanvulling op het eerste tot en met het derde lid:

      a. maakt de netbeheerder van het landelijk hoogspanningsnet geen deel uit van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref4] waartoe ook een rechtspersoon of vennootschap behoort die
      gas produceert of levert of daarin handelt;

      b. maakt de netbeheerder van het landelijk hoogspanningsnet geen deel uit van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref5] waartoe een rechtspersoon of vennootschap behoort die
      activiteiten als bedoeld in het eerste lid of onderdeel a verricht buiten Nederland;

      c. oefent de netbeheerder van het landelijk hoogspanningsnet geen directe of indirecte zeggenschap uit over een
      producent, een leverancier, een producent van gas of een leverancier van gas.

      5 Bij algemene maatregel van bestuur worden ter implementatie van artikel 9 van de richtlijn nadere regels gesteld.


