  - number: '79'
    text: |-
      1 Een netbeheerder die bij de uitvoering van zijn taak de beschikking krijgt over gegevens waarvan hij het
      vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, draagt er zorg voor dat die gegevens niet ter
      beschikking komen of kunnen komen van derden, tenzij enig wettelijk voorschrift anders bepaalt.

      2 Indien een netbeheerder gegevens over zijn bedrijfsvoering die commercieel voordeel kunnen opleveren ter
      beschikking stelt aan anderen, doet hij dit op niet-discriminatoire wijze.

      3 Een netbeheerder maakt alle informatie openbaar die bijdraagt aan een doeltreffende mededinging en een efficiënte
      werking van de markt, voor zover deze redelijkerwijs te genereren is uit de informatie waarover hij beschikt op
      basis van de uitvoering van de op grond van deze wet aan hem toegekende taken.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel79
  - number: '81'
    text: |-
      De voordracht voor een krachtens [artikel 29][ref1], [84][ref2] of [85][ref3] vast te stellen algemene maatregel
      van bestuur en voor een wijziging van een krachtens [artikel 20][ref4] vast te stellen algemene maatregel
      van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel84
