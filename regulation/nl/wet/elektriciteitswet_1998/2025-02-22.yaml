        paragraaf: 1a
  - number: 31c
    text: |-
      1 Voor afnemers als bedoeld in [artikel 95a, eerste lid][ref1], die duurzame elektriciteit invoeden op het net,
      berekent de leverancier het verbruik ten behoeve van de facturering en inning van de leveringskosten door de aan
      het net onttrokken elektriciteit te verminderen met de op het net ingevoede elektriciteit, waarbij de vermindering
      maximaal de hoeveelheid aan het net onttrokken elektriciteit bedraagt.

      2 Voor afnemers als bedoeld in [artikel 95a, eerste lid][ref2], die niet-duurzame elektriciteit invoeden op het
      net, berekent de leverancier het verbruik ten behoeve van de facturering en inning van de leveringskosten door de
      aan het net onttrokken elektriciteit te verminderen met de op het net ingevoede elektriciteit, met een maximum van
      5000 kWh aan op het net ingevoede elektriciteit, voor zover het saldo van de aan het net onttrokken minus de op het
      net ingevoede elektriciteit niet minder dan nul bedraagt.

      3 Indien de door de afnemer, bedoeld in het eerste en tweede lid, op het net ingevoede hoeveelheid elektriciteit
      groter is dan de hoeveelheid die ingevolge die leden in mindering wordt gebracht op de aan het net onttrokken
      elektriciteit, betaalt de leverancier aan de betreffende afnemer voor het meerdere een redelijke vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
