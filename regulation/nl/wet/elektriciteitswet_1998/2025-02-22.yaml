        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 36.1.b
    text: |-
      het belang van het betrouwbaar, duurzaam, doelmatig en milieuhygiënisch verantwoord functioneren van de
      elektriciteitsvoorziening,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel36
  - number: 36.1.c
    text: het belang van de bevordering van de ontwikkeling van het handelsverkeer op de elektriciteitsmarkt,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel36
  - number: 36.1.d
    text: het belang van de bevordering van het doelmatig handelen van afnemers
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel36
  - number: 36.1.e
    text: het belang van een goede kwaliteit van de dienstverlening van netbeheerders,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel36
  - number: 36.1.f
    text: |-
      het belang van een objectieve, transparante en niet discriminatoire handhaving van de energiebalans op een wijze
      die de kosten weerspiegelt,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel36
  - number: 36.1.g
    text: |-
      de in [artikel 26b][ref1] bedoelde regels,


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel26b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 26b
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 36.1.h
    text: hetgeen is gesteld bij of krachtens [verordening 2019/943](32843R2019) en de richtlijn en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel36
  - number: 36.1.i
    text: |-
      artikel 15 van [richtlijn 2012/27](32012L0027)/EU van het Europees Parlement en de Raad van 25 oktober 2012
      betreffende energie-efficiëntie, tot wijziging van [Richtlijnen 2009/125/EG](32009L0125) en [2010/30](32010L0030)/
      EU en houdende intrekking van de Richtlijnen [2004/8/EG](32004L0008) en [2006/32/EG](32006L0032) (PbEU 2012,
      L 315).
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel36
  - number: '36.2'
    text: |-
      De Autoriteit Consument en Markt stelt de voorwaarden niet vast dan nadat zij zich met inachtneming van artikel
      5 van de richtlijn ervan vergewist heeft dat de voorwaarden de interoperabiliteit van de netten garanderen en
      objectief, evenredig en niet-discriminatoir zijn, alsmede voor zover dat op grond van de notificatierichtlijn
      noodzakelijk is, aan de Europese Commissie in ontwerp zijn meegedeeld en de van toepassing zijnde termijnen,
      bedoeld in artikel 6 van de notificatierichtlijn, zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel36
  - number: '36.3'
    text: |-
      Indien een voorstel als bedoeld in [artikel 27][ref1], [31][ref2] of [32][ref3] naar het oordeel van de Autoriteit
      Consument en Markt in strijd is met het belang, bedoeld in het eerste lid, onderdeel b, c, d, e of f, met de
      regels, bedoeld in het eerste lid, onderdelen g en h, of of met de eisen, bedoeld in het tweede lid, draagt de
      Autoriteit Consument en Markt de gezamenlijke netbeheerders op het voorstel onverwijld zodanig te wijzigen dat deze
      strijd wordt opgeheven. [Artikel 4:15 van de Algemene wet bestuursrecht][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '36.4'
    text: |-
      Indien de gezamenlijke netbeheerders niet binnen vier weken het voorstel wijzigen overeenkomstig de opdracht van de
      Autoriteit Consument en Markt, bedoeld in het derde lid, stelt de Autoriteit Consument en Markt de tariefstructuren
      of de voorwaarden vast onder het aanbrengen van zodanige wijzigingen dat deze in overeenstemming zijn met
      de belangen, bedoeld in het eerste lid, onderdelen b tot en met f, met de regels, bedoeld in het eerste lid,
      onderdelen g en h, en met de eisen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel36
  - number: '37.1'
    text: |-
      Nadat de termijn, bedoeld in [artikel 34][ref1], is verstreken, stelt de Autoriteit Consument en Markt
      de tariefstructuren of de voorwaarden vast met inachtneming van de voorstellen van netbeheerders en van
      [artikel 36, eerste en tweede lid][ref2]. Indien een voorstel als bedoeld in artikel 34 niet binnen de daarbij
      aangegeven termijn aan de Autoriteit Consument en Markt is gezonden, stelt deze de tariefstructuren of de
      voorwaarden uit eigen beweging vast met inachtneming van artikel 36, eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel36
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '37.2'
    text: |-
      Indien de gezamenlijke netbeheerders niet binnen de termijn, bedoeld in [artikel 34, derde lid][ref1], hun
      zienswijze op een ontwerp van een besluit als bedoeld in dat artikellid aan de Autoriteit Consument en Markt
      kenbaar maken, stelt deze het besluit tot wijziging van de tariefstructuren of de voorwaarden uit eigen beweging
      vast met inachtneming van [artikel 36, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel36
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 37a.1
    text: |-
      De Autoriteit Consument en Markt kan op aanvraag bij beschikking een ontheffing verlenen van de tariefstructuren
      en de voorwaarden. Bij haar beslissing neemt de Autoriteit Consument en Markt de belangen als bedoeld in
      [artikel 36, eerste lid, onderdelen b tot en met f][ref1] en de regels, bedoeld in artikel 36, eerste lid,
      onderdelen g en h, in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 37a.2
    text: |-
      De Autoriteit Consument en Markt stelt beleidsregels op met betrekking tot de procedure voor aanvraag van een
      ontheffing.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel37a
  - number: 37a.3
    text: |-
      De Autoriteit Consument en Markt kan voorschriften en beperkingen verbinden aan de ontheffing. De Autoriteit
      Consument en Markt kan de voorschriften en de opgelegde beperkingen wijzigen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel37a
  - number: 37a.4
    text: |-
      De Autoriteit Consument en Markt trekt de ontheffing in op daartoe strekkend schriftelijk verzoek van de houder van
      de ontheffing.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel37a
  - number: 37a.5
    text: 'De Autoriteit Consument en Markt kan een ontheffing intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel37a
  - number: 37a.5.a
    text: de houder van de ontheffing de aan de ontheffing verbonden voorschriften of opgelegde beperkingen niet nakomt;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel37a
  - number: 37a.5.b
    text: |-
      de houder van de ontheffing bij de aanvraag onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van
      juiste en volledige gegevens tot een andere beschikking op de aanvraag zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel37a
  - number: 37a.5.c
    text: |-
      de Autoriteit Consument en Markt, gelet op de belangen bedoeld in
      [artikel 36, eerste lid, onderdelen b tot en met f][ref1] en de regels, bedoeld in artikel 36, eerste lid,
      onderdelen g en h, van oordeel is dat intrekking van de ontheffing noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 37a.6
    text: Van een op grond van dit artikel genomen beschikking wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel37a
  - number: '38.1'
    text: |-
      De tariefstructuren en de voorwaarden treden in werking op een door de Autoriteit Consument en Markt te bepalen
      datum en gelden voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel38
  - number: '38.2'
    text: |-
      Van de besluiten betreffende de vaststelling van de tariefstructuren en de voorwaarden alsmede de wijziging daarvan
      wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel38
  - number: '38.3'
    text: |-
      Iedere netbeheerder legt een exemplaar van de tariefstructuren en de voorwaarden voor een ieder ter inzage in al
      zijn vestigingen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel38
  - number: '38.4'
    text: |-
      Na de vaststelling van de voorwaarden gelden deze als minimumeisen voor de technische veiligheid en voor het
      technisch ontwerp en de exploitatie van de installaties en netten, bedoeld in artikel 5 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel38
  - number: '39'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de uitvoering van onderdelen van
      verordeningen en besluiten als bedoeld in artikel 288 van het Verdrag betreffende de werking van de Europese Unie,
      vastgesteld krachtens de richtlijn en de verordeningen, bedoeld in [artikel 5, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel5
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '5'
        hoofdstuk: '2'
  - number: '40'
    text: |-
      De tarieven voor de diensten ter uitvoering van de taken, genoemd in [artikelen 16][ref1] en [22a][ref2], worden
      vastgesteld overeenkomstig de [artikelen 41 tot en met 41d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel22a
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel41
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 22a
        hoofdstuk: '3'
        paragraaf: 3a
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 40a
    text: |-
      De tarieven voor de meting van elektriciteit bij afnemers als bedoeld in [artikel 95a, eerste lid][ref1], als
      bedoeld in [artikel 30a][ref2], worden vastgesteld door de Autoriteit Consument en Markt na overleg met de
      gezamenlijke netbeheerders en met representatieve organisaties van partijen op de elektriciteitsmarkt. Bij
      ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot procedure tot vaststelling van de
      tarieven voor de meting van elektriciteit bij afnemers als bedoeld in artikel 95a, eerste lid en de wijze van
      berekening van deze tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel30a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 30a
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 40b
    text: |-
      De tarieven voor experimenten, bedoeld in [artikel 30b][ref1], en voor tijdelijke taken, bedoeld in
      [artikel 30c][ref2], worden vastgesteld overeenkomstig [artikel 41e][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel30b
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel30c
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel41e
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 30b
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 30c
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 41e
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '41.1'
    text: |-
      De Autoriteit Consument en Markt stelt na overleg met de gezamenlijke netbeheerders en representatieve organisaties
      van partijen op de elektriciteitsmarkt:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41
  - number: 41.1.a
    text: |-
      ten aanzien van de taken, genoemd in [artikel 16][ref1], met inachtneming van het belang dat door middel van
      marktwerking ten behoeve van afnemers de doelmatigheid van de bedrijfsvoering en de meest doelmatige kwaliteit
      van het transport worden bevorderd en rekening houdend met het belang van voorzieningszekerheid, duurzaamheid
      en een redelijk rendement op investeringen, voor netbeheerders, met uitzondering van de netbeheerder van het
      landelijk hoogspanningsnet, de methode vast tot vaststelling van de korting ter bevordering van de doelmatige
      bedrijfsvoering, van de kwaliteitsterm en van het rekenvolume van elke tariefdrager waarvoor een tarief wordt
      vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 41.1.b
    text: |-
      voor elke taak, genoemd in [artikel 16, tweede lid][ref1], met inachtneming van het belang dat de doelmatigheid
      van de bedrijfsvoering en de meest doelmatige kwaliteit van uitvoering van deze taken worden bevorderd, en rekening
      houdend met het belang van voorzieningszekerheid, duurzaamheid en een redelijk rendement op investeringen, de
      methode van regulering vast voor de netbeheerder van het landelijk hoogspanningsnet.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '41.2'
    text: |-
      Ten aanzien van de taken, genoemd in [artikel 16, eerste lid, is het eerste lid, onderdeel a][ref1], van
      overeenkomstige toepassing voor vaststelling van de methode tot vaststelling van de korting ter bevordering van de
      doelmatige bedrijfsvoering en van het rekenvolume van elke tariefdrager waarvoor een tarief wordt vastgesteld voor
      de netbeheerder van het landelijk hoogspanningsnet.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '41.3'
    text: |-
      De korting ter bevordering van de doelmatige bedrijfsvoering heeft onder meer ten doel te bereiken dat de
      netbeheerder in ieder geval geen rendement kan behalen dat hoger is dan in het economische verkeer gebruikelijk en
      dat de gelijkwaardigheid in de doelmatigheid van de netbeheerders wordt bevorderd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41
  - number: '41.4'
    text: |-
      De kwaliteitsterm geeft de aanpassing van de tarieven in verband met de geleverde kwaliteit aan en heeft ten doel
      netbeheerders te stimuleren om de kwaliteit van hun transportdienst te optimaliseren.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41
  - number: '41.5'
    text: |-
      De rekenvolumina die een netbeheerder gebruikt bij het voorstel, bedoeld in [artikel 41b][ref1], zijn gebaseerd
      op daadwerkelijk gefactureerde volumina in eerdere jaren, of worden door de Autoriteit Consument en Markt geschat
      indien deze betrekking hebben op nieuwe tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel41b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 41b
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '41.6'
    text: |-
      Bij de vaststelling van het efficiëntieniveau ten behoeve van de vaststelling van de korting ter bevordering van
      de doelmatige bedrijfsvoering van de netbeheerder van het landelijk hoogspanningsnet laat de Autoriteit Consument
      en Markt de kosten die betrekking hebben op landspecifieke kenmerken, waaronder de kwaliteit van het net, buiten
      beschouwing.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41
  - number: 41a.1
    text: |-
      Ten behoeve van het voorstel, bedoeld in [artikel 41b][ref1], stelt de Autoriteit Consument en Markt
      voor iedere netbeheerder afzonderlijk voor dezelfde periode als waarvoor het besluit geldt op grond van
      [artikel 41, eerste lid][ref2], vast:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel41b
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel41
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 41b
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 41a.1.a
    text: de korting ter bevordering van de doelmatige bedrijfsvoering,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41a
  - number: 41a.1.b
    text: de kwaliteitsterm, en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41a
  - number: 41a.1.c
    text: het rekenvolume van elke tariefdrager waarvoor een tarief wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41a
  - number: 41a.2
    text: |-
      De Autoriteit Consument en Markt kan het in het eerste lid, onderdeel c, bedoelde rekenvolume gedurende de in de
      aanhef van dat lid bedoelde periode wijzigen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41a
  - number: 41a.3
    text: |-
      Indien het besluit op grond van [artikel 41, eerste lid][ref1], bij een onherroepelijke rechterlijke uitspraak is
      vernietigd of bij een onherroepelijk besluit op bezwaar is herroepen, herziet de Autoriteit Consument en Markt de
      in het eerste lid vermelde besluiten met toepassing van de met inachtneming van die uitspraak of dat besluit op
      bezwaar gecorrigeerde methode.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel41
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41a
