  - number: 95c
    text: |-
      1 Bepalingen die zijn opgenomen in overeenkomsten inzake levering van elektriciteit aan afnemers die beschikken
      over een aansluiting op het net met een totale maximale doorlaatwaarde van ten hoogste 3*80A en die tot doel hebben
      de opwekking van duurzame elektriciteit te verbieden zijn onverbindend.

      2 Een houder van een vergunning is verplicht een aanbod van een afnemer als bedoeld in het eerste lid tot
      teruglevering van door hem geproduceerde duurzame elektriciteit te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95c
  - number: 95ca
    text: |-
      1 Een leverancier schakelt een meetbedrijf in voor het collecteren, valideren en vaststellen van de meetgegevens
      die betrekking hebben op afnemers als bedoeld in [artikel 95a, eerste lid][ref1].

      2 In afwijking van het eerste lid worden de meetgegevens die betrekking hebben op:

      a. een rechtspersoon of een natuurlijke persoon die handelt in de uitoefening van een beroep of bedrijf, en

      b. behalve één of meer aansluitingen met een doorlaatwaarde kleiner dan of gelijk aan 3 * 80 A ten minste één
      aansluiting heeft met een doorlaatwaarde groter dan 3 * 80 A, gecollecteerd, gevalideerd en vastgesteld door het
      meetbedrijf dat die rechtspersoon of natuurlijke persoon daartoe inschakelt.

      3 Indien een leverancier voor de levering van elektriciteit aan afnemers als bedoeld in
      [artikel 95a, eerste lid][ref2], factureert op basis van meetgegevens, maakt hij gebruik van meetgegevens die het
      meetbedrijf heeft gecollecteerd, gevalideerd en vastgesteld.

      4 Een meetbedrijf verstrekt slechts meetgegevens aan anderen dan de betrokken afnemer als bedoeld in
      [artikel 95a, eerste lid][ref3], of de betrokken leverancier indien die ander de desbetreffende meetgegevens op
      basis van artikel 6 van de Algemene verordening gegevensbescherming mag verwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
