  - number: 41d
    text: |-
      1 In afwijking van [artikel 41a][ref1] wordt voor de netbeheerder van het landelijk hoogspanningsnet ten aanzien
      van de taken, bedoeld in [artikel 16, eerste lid][ref2] geen kwaliteitsterm vastgesteld.

      2 De Autoriteit Consument en Markt stelt voor de netbeheerder van het landelijk hoogspanningsnet jaarlijks het
      verschil vast tussen de totale inkomsten uit de tarieven, bedoeld in [artikel 41b, eerste lid, onderdeel d][ref3],
      en de gerealiseerde totale inkomsten uit de tarieven. Bij de eerstvolgende vaststelling van de tarieven verwerkt de
      Autoriteit Consument en Markt het verschil in de tarieven.


