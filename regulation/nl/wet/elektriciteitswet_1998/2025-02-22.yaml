      Het is een ander dan een netbeheerder verboden de op grond van deze wet aan een netbeheerder toegekende taken,
      anders dan tijdelijke taken als bedoeld in [artikel 17a][ref1], uit te voeren, met uitzondering van:

      a. de werkzaamheden die een netbeheerder aan een ander uitbesteedt;

      b. de aanleg, de wijziging, het onderhoud of de verwijdering van een aansluiting met een aansluitwaarde groter dan
      10 MVA op een net, niet zijnde een net op zee;

      c. de aanleg, de wijziging, het onderhoud of de verwijdering van een aansluiting van een organisatorische eenheid
      als bedoeld in [artikel 1, tweede lid][ref2];

      d. de aanleg van kabels en leidingen en daarmee verbonden hulpmiddelen.


