        artikel: 17a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 41b.1.l
    text: |-
      de gemaakte kosten voor de uitvoering van [artikel 22a][ref1], voor zover deze kosten doelmatig zijn en deze kosten
      niet op grond van het bepaalde bij of krachtens artikel 22a, zevende lid, worden betaald door de verzoeker, bedoeld
      in artikel 22a, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel22a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 22a
        hoofdstuk: '3'
        paragraaf: 3a
  - number: 41b.2
    text: |-
      De geschatte kosten die een netbeheerder voor de uitvoering van de taken genoemd in
      [artikel 16, eerste en tweede lid][ref1], bij een andere netbeheerder in rekening zal brengen, worden zonder
      toepassing van de formule, bedoeld in het eerste lid, onder d, toegevoegd aan de totale inkomsten uit de tarieven
      van deze andere netbeheerder. Het verschil tussen de geschatte en gerealiseerde kosten wordt betrokken bij de
      vaststelling van de totale inkomsten uit de tarieven van de andere netbeheerder in een volgend jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 41b.3
    text: |-
      De geschatte kosten die de netbeheerder van het landelijk hoogspanningsnet voor de uitvoering van de taken, genoemd
      in [artikel 16, tweede lid][ref1], maakt, worden zonder toepassing van de formule, bedoeld in het eerste lid,
      onderdeel d, en met toepassing van het besluit, bedoeld in [artikel 41, eerste lid, onderdeel b][ref2], toegevoegd
      aan de totale inkomsten uit de tarieven van de netbeheerder van het landelijk hoogspanningsnet.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel41
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 41b.4
    text: |-
      De Autoriteit Consument en Markt stelt een beleidsregel vast betreffende de beoordeling van doelmatigheid, bedoeld
      in het eerste lid, onder e en g.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41b
  - number: 41b.5
    text: |-
      De Autoriteit Consument en Markt kan een beleidsregel vaststellen betreffende de beoordeling van doelmatigheid,
      bedoeld in het eerste lid, onderdelen j en k.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41b
  - number: 41c.1
    text: |-
      De Autoriteit Consument en Markt stelt de tarieven, die kunnen verschillen voor de verschillende netbeheerders en
      voor onderscheiden tariefdragers, jaarlijks vast.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41c
  - number: 41c.2
    text: |-
      De Autoriteit Consument en Markt kan de tarieven die zullen gelden in het jaar t corrigeren, indien de tarieven die
      golden in dat jaar of de jaren voorafgaand aan het jaar t:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41c
  - number: 41c.2.a
    text: |-
      bij rechterlijke uitspraak of met toepassing van de [artikel 6:19][ref1] of
      [7:11 van de Algemene wet bestuursrecht][ref2] zijn gewijzigd;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 41c.2.b
    text: |-
      zijn vastgesteld met inachtneming van onjuiste of onvolledige gegevens en de Autoriteit Consument en Markt, indien
      zij de beschikking had over juiste of volledige gegevens, tarieven zou hebben vastgesteld die in aanmerkelijke mate
      zouden afwijken van de vastgestelde tarieven;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41c
  - number: 41c.2.c
    text: zijn vastgesteld met gebruikmaking van geschatte gegevens en de feitelijke gegevens daarvan afwijken;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41c
  - number: 41c.2.d
    text: |-
      zijn vastgesteld met gebruikmaking van gegevens omtrent kosten voor bepaalde diensten, terwijl netbeheerders die
      diensten in het jaar t of een gedeelte van jaar t niet hebben geleverd of voor die diensten geen of minder kosten
      hebben gemaakt;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41c
  - number: 41c.2.e
    text: |-
      zijn vastgesteld op basis van de geschatte kosten als bedoeld in het zevende lid en de gerealiseerde efficiënte
      kosten die daarvan afwijken.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41c
  - number: 41c.3
    text: |-
      Indien een voorstel niet binnen de termijn, bedoeld in [artikel 41b, eerste lid][ref1], aan de Autoriteit Consument
      en Markt is gezonden, stelt deze de tarieven voor de desbetreffende netbeheerder uit eigen beweging vast met
      inachtneming van artikel 41b.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel41b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 41b
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 41c.4
    text: |-
      Indien de totale inkomsten aan het begin van de periode, bedoeld in [artikel 41, eerste lid][ref1], niet
      in overeenstemming zijn met het efficiënte kostenniveau inclusief een rendement dat in het economisch
      verkeer gebruikelijk is, kan de Autoriteit Consument en Markt bij de toepassing van de formule, genoemd in
      [artikel 41b, eerste lid, onderdeel d][ref2], in plaats van TIt-1, de totale inkomsten vaststellen op het
      efficiënte kostenniveau inclusief een rendement dat in het economisch verkeer gebruikelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel41b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 41b
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 41c.5
    text: |-
      Indien een besluit op grond van [artikel 41, eerste lid][ref1], of [41a eerste lid][ref2], bij onherroepelijke
      rechterlijke uitspraak is vernietigd of bij een onherroepelijk besluit op bezwaar is herroepen, herberekent
      de Autoriteit Consument en Markt de tarieven, bedoeld in het eerste lid, met toepassing van de met
      inachtneming van die uitspraak of dat besluit op bezwaar gecorrigeerde methode onderscheidenlijk gecorrigeerde
      doelmatigheidskorting, kwaliteitsterm of rekenvolume, en verdisconteert zij de uitkomsten van deze herberekening
      in de eerstvolgende op grond van het eerste lid vast te stellen tarieven. Daarbij worden deze herberekening en de
      wijze waarop de uitkomsten daarvan in de tarieven zijn verdisconteerd separaat weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel41a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 41a
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 41c.6
    text: |-
      De Autoriteit Consument en Markt kan de tarieven die zullen gelden in het jaar t corrigeren met de gederfde
      inkomsten die voor netbeheerders zijn ontstaan door toepassing van een volumecorrectie op grond van
      [artikelen 29, zevende tot en met tiende lid][ref1], in 2014.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel29
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 41c.7
    text: 'De Autoriteit Consument en Markt betrekt bij het vaststellen van de tarieven:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41c
  - number: 41c.7.a
    text: |-
      de geschatte vermogenskosten die de netbeheerder van het landelijk hoogspanningsnet in het jaar waarop het
      tarievenvoorstel betrekking heeft zal maken met betrekking tot nog niet in gebruik genomen investeringen, waarop de
      projectprocedure, bedoeld in [afdeling 5.2 van de Omgevingswet][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 41c.7.b
    text: |-
      de geschatte kosten die de netbeheerder van het landelijk hoogspanningsnet heeft voor investeringen die in het
      jaar waarop het tarievenvoorstel betrekking heeft, in gebruik worden of zijn genomen, waarop de projectprocedure,
      bedoeld in [afdeling 5.2 van de Omgevingswet][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 41c.8
    text: |-
      Indien de netbeheerder van het net op zee op grond van [artikel 42a, derde lid][ref1], een bedrag in rekening
      brengt bij de netbeheerder van het landelijk hoogspanningsnet wordt dat bedrag zonder toepassing van de formule,
      bedoeld in [artikel 41b, eerste lid, onderdeel d][ref2], toegevoegd aan de totale inkomsten uit de tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel42a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel41b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 42a
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 41b
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 41d.1
    text: |-
      In afwijking van [artikel 41a][ref1] wordt voor de netbeheerder van het landelijk hoogspanningsnet ten aanzien van
      de taken, bedoeld in [artikel 16, eerste lid][ref2] geen kwaliteitsterm vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel41a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41d
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 41a
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 41d.2
    text: |-
      De Autoriteit Consument en Markt stelt voor de netbeheerder van het landelijk hoogspanningsnet jaarlijks het
      verschil vast tussen de totale inkomsten uit de tarieven, bedoeld in [artikel 41b, eerste lid, onderdeel d][ref1],
      en de gerealiseerde totale inkomsten uit de tarieven. Bij de eerstvolgende vaststelling van de tarieven verwerkt de
      Autoriteit Consument en Markt het verschil in de tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel41b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41d
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 41b
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 41e.1
    text: |-
      Indien een netbeheerder een experiment uitvoert en op grond van [artikel 30b][ref1] een tarief in rekening brengt
      bij de deelnemers van het experiment, doet de netbeheerder voor 1 oktober aan de Autoriteit Consument en Markt
      op basis van de geschatte kosten, voor zover de kosten doelmatig zijn en niet toegerekend kunnen worden aan de
      uitvoering van de taken genoemd in [artikel 16][ref2], een voorstel voor de tarieven voor dit experiment.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel30b
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41e
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 30b
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 41e.2
    text: |-
      Indien een netbeheerder een tijdelijke taak uitvoert en op grond van [artikel 30c][ref1] een tarief in rekening
      brengt bij de afnemers ten behoeve waarvan de netbeheerder de tijdelijke taak uitvoert, doet de netbeheerder voor
      1 oktober aan de Autoriteit Consument en Markt op basis van de geschatte kosten, voor zover de kosten doelmatig
      zijn en niet toegerekend kunnen worden aan de uitvoering van de taken genoemd in [artikel 16][ref2], een voorstel
      voor de tarieven voor deze tijdelijke taak.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41e
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 30c
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 41e.3
    text: |-
      De Autoriteit Consument en Markt stelt de tarieven, bedoeld in het eerste en tweede lid, jaarlijks vast. De
      tarieven voor:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41e
  - number: 41e.3.a
    text: experimenten kunnen per experiment en voor de verschillende afnemers die deelnemen aan het experiment verschillen;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41e
  - number: 41e.3.b
    text: |-
      tijdelijke taken kunnen per tijdelijke taak verschillen voor de verschillende afnemers ten behoeve waarvan een
      netbeheerder de tijdelijke taak uitvoert.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41e
  - number: 41e.4
    text: |-
      Indien een voorstel niet tijdig aan de Autoriteit Consument en Markt is gezonden, stelt deze de tarieven voor de
      desbetreffende netbeheerder uit eigen beweging vast.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41e
  - number: 41e.5
    text: |-
      De Autoriteit Consument en Markt toetst bij het vaststellen van de tarieven, bedoeld in het eerste en tweede lid,
      of de tarieven objectief, transparant en niet-discriminatoir zijn en of deze gebaseerd zijn op werkelijke kosten.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41e
  - number: 41e.6
    text: |-
      [Artikel 41c, tweede lid, onderdelen a tot en met d][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel41c
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41e
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 41c
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '42.1'
    text: |-
      De tarieven treden in werking op een door de Autoriteit Consument en Markt te bepalen datum en gelden tot 1 januari
      van het jaar, volgend op de datum van inwerkingtreding van het besluit tot vaststelling van de tarieven.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42
  - number: '42.2'
    text: |-
      Indien op 1 januari de tarieven voor het volgende jaar nog niet zijn vastgesteld, gelden de tarieven tot de datum
      van inwerkingtreding van het besluit tot vaststelling van de tarieven voor het volgende jaar.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42
  - number: '42.3'
    text: |-
      Iedere netbeheerder legt een exemplaar van de voor hem geldende tarieven voor een ieder ter inzage in al zijn
      vestigingen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42
  - number: 42a.1
    text: |-
      De netbeheerder van het net op zee brengt geen tarief waarvoor het transport van elektriciteit wordt uitgevoerd,
      bedoeld in [artikel 29][ref1], en geen tarieven voor de diensten ter uitvoering van de taken, bedoeld in
      [artikel 40][ref2], in rekening bij zijn afnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel40
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 42a.2
    text: |-
      De jaarlijkse toegestane inkomsten van de netbeheerder van het net op zee voor de uitvoering van de taken genoemd
      in [artikel 16, zestiende lid][ref1], worden overeenkomstig de [artikelen 42b tot en met 42e][ref2] vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel42b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 42b
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 42a.3
    text: |-
      Indien de subsidie in een jaar het bedrag, genoemd in [artikel 77g, tweede lid][ref1], niet of niet geheel dekt,
      brengt de netbeheerder van het net op zee het deel dat niet door de subsidie wordt gedekt, in rekening bij de
      netbeheerder van het landelijk hoogspanningsnet.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77g
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 77g
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 42b.1
    text: |-
      De Autoriteit Consument en Markt stelt na overleg met de gezamenlijke netbeheerders en representatieve organisaties
      van partijen op de elektriciteitsmarkt, ten aanzien van de taken van de netbeheerder van het net op zee, genoemd
      in [artikel 16, zestiende lid][ref1], met inachtneming van het belang dat door middel van marktwerking ten behoeve
      van afnemers de doelmatigheid van de bedrijfsvoering en de meest doelmatige kwaliteit van het transport worden
      bevorderd en rekening houdend met het belang van voorzieningszekerheid, duurzaamheid en een redelijk rendement
      op investeringen, voor de netbeheerder van het net op zee, de methode vast tot vaststelling van de korting ter
      bevordering van de doelmatige bedrijfsvoering en de toegestane inkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 42b.2
    text: Het besluit tot vaststelling van de methode geldt voor een periode van ten minste drie en ten hoogste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42b
  - number: 42b.3
    text: |-
      De korting ter bevordering van de doelmatige bedrijfsvoering heeft onder meer ten doel te bereiken dat de
      netbeheerder van het net op zee in ieder geval geen rendement kan behalen dat hoger is dan in het economische
      verkeer gebruikelijk.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42b
  - number: 42b.4
    text: |-
      Bij de beoordeling van de doelmatigheid van de kosten ten behoeve van de korting ter bevordering van de doelmatige
      bedrijfsvoering van de beheerder van het net op zee:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42b
  - number: 42b.4.a
    text: worden niet-beïnvloedbare kosten door de Autoriteit Consument en Markt zo veel mogelijk buiten beschouwing gelaten;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42b
  - number: 42b.4.b
    text: |-
      laat de Autoriteit Consument en Markt de kosten die betrekking hebben op landspecifieke kenmerken, waaronder de
      kwaliteit van het net, buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42b
  - number: 42b.5
    text: 'Bij de vaststelling van de korting ter bevordering van de doelmatige bedrijfsvoering:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42b
  - number: 42b.5.a
    text: worden de niet-beïnvloedbare kosten door de Autoriteit Consument en Markt buiten beschouwing gelaten;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42b
  - number: 42b.5.b
    text: |-
      houdt de Autoriteit Consument en Markt in ieder geval rekening met de financierbaarheid van de netbeheerder van het
      net op zee.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42b
  - number: 42c.1
    text: |-
      Ten behoeve van het voorstel voor de toegestane inkomsten, bedoeld in [artikel 42d, eerste lid][ref1], stelt
      de Autoriteit Consument en Markt voor de netbeheerder van het net op zee voor dezelfde periode als waarvoor
      het besluit, bedoeld in [artikel 42b, eerste lid][ref2], geldt, de korting ter bevordering van de doelmatige
      bedrijfsvoering vast.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel42d
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel42b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 42d
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 42b
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 42c.2
    text: |-
      Indien het besluit op grond van [artikel 42b, eerste lid][ref1], bij een onherroepelijke rechterlijke uitspraak
      is vernietigd of bij een onherroepelijk besluit op bezwaar is herroepen, herziet de Autoriteit Consument en Markt
      het in het tweede lid vermelde besluit met toepassing van de met inachtneming van die uitspraak of dat besluit op
      bezwaar gecorrigeerde methode.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel42b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 42b
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 42d.1
    text: |-
      De netbeheerder van het net op zee zendt jaarlijks voor 1 oktober aan de Autoriteit Consument en Markt een voorstel
      voor de toegestane inkomsten voor de uitvoering van de taken genoemd in [artikel 16, zestiende lid][ref1], met
      inachtneming van:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42d
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 42d.1.a
    text: |-
      de formule waarbij TI = de totale inkomsten in het jaar t; TI = de totale inkomsten in het jaar voorafgaande
      aan het jaar t; cpi = de relatieve wijziging van de consumentenprijsindex (alle huishoudens), berekend uit het
      quotiënt van deze prijsindex, gepubliceerd in de vierde maand voorafgaande aan het jaar t, en van deze prijsindex,
      gepubliceerd in de zestiende maand voorafgaande aan het jaar t, zoals deze maandelijks wordt vastgesteld door het
      Centraal Bureau voor de Statistiek; x = de korting ter bevordering van de doelmatige bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42d
  - number: 42d.1.b
    text: |-
      de gemaakte kosten voor investeringen, bedoeld in [artikel 20d, derde lid][ref1], voor zover de kosten doelmatig
      zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel20d
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42d
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 20d
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 42d.1.c
    text: |-
      een schadevergoeding als bedoeld in [artikel 16f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16f
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42d
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 16f
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 42d.1.d
    text: |-
      de geschatte vermogenskosten die de netbeheerder van het net op zee in het jaar waarop het voorstel betrekking
      heeft zal maken met betrekking tot nog niet in gebruik genomen investeringen, waarop de projectprocedure, bedoeld
      in [afdeling 5.2 van de Omgevingswet][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42d
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 42d.1.e
    text: |-
      de geschatte kosten die de netbeheerder van het net op zee heeft voor investeringen die in het jaar waarop
      het voorstel betrekking heeft, in gebruik worden of zijn genomen, waarop de projectprocedure, bedoeld in
      [afdeling 5.2 van de Omgevingswet][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42d
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 42d.2
    text: |-
      Indien sprake is van grove nalatigheid van de netbeheerder van het net op zee, wordt in afwijking van het eerste
      lid, onderdeel c, het totaal aan schadevergoedingen tot een bedrag van ten hoogste € 10 miljoen per jaar niet in de
      toegestane inkomsten verdisconteerd. Het totaal aan schadevergoedingen die het bedrag van € 10 miljoen in één jaar
      overstijgt wordt in dit geval betrokken bij het vaststellen van de inkomsten.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42d
  - number: 42d.3
    text: |-
      De Autoriteit Consument en Markt stelt een beleidsregel vast betreffende de beoordeling van doelmatigheid, bedoeld
      in het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42d
  - number: 42e.1
    text: |-
      De Autoriteit Consument en Markt stelt de toegestane inkomsten, met in achtneming van
      [artikel 42d, eerste en tweede lid][ref1], van de netbeheerder van het net op zee, jaarlijks vast.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel42d
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42e
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 42d
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 42e.2
    text: |-
      De Autoriteit Consument en Markt kan de toegestane inkomsten die zullen gelden in het jaar t corrigeren, indien
      vastgestelde inkomsten in dat jaar of de jaren voorafgaand aan het jaar t:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42e
  - number: 42e.2.a
    text: |-
      bij rechterlijke uitspraak of met toepassing van [artikel 6:19][ref1] of
      [7:11 van de Algemene wet bestuursrecht][ref2] zijn gewijzigd;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 42e.2.b
    text: |-
      zijn vastgesteld met inachtneming van onjuiste of onvolledige gegevens en de Autoriteit Consument en Markt, indien
      zij de beschikking had over juiste of volledige gegevens, inkomsten zou hebben vastgesteld die in aanmerkelijke
      mate zouden afwijken van de vastgestelde inkomsten;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42e
  - number: 42e.2.c
    text: zijn vastgesteld met gebruikmaking van geschatte gegevens en de feitelijke gegevens daarvan afwijken;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42e
  - number: 42e.2.d
    text: |-
      zijn vastgesteld met gebruikmaking van gegevens omtrent kosten voor bepaalde diensten, terwijl de netbeheerder van
      het net op zee die diensten in het jaar t of een gedeelte van jaar t niet heeft geleverd of voor die diensten geen
      of minder kosten heeft gemaakt;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42e
  - number: 42e.2.e
    text: |-
      zijn vastgesteld op basis van de geschatte kosten als bedoeld in
      [artikel 42d, eerste lid, onderdelen d en e][ref1], en de gerealiseerde efficiënte kosten die daarvan afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel42d
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42e
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 42d
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 42e.3
    text: |-
      Indien een voorstel niet binnen de termijn, bedoeld in [artikel 42d, eerste lid][ref1], aan de Autoriteit
      Consument en Markt is gezonden, stelt deze de toegestane inkomsten voor de netbeheerder van het net op zee uit
      eigen beweging vast met inachtneming van artikel 42d, eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel42d
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42e
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 42d
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 42e.4
    text: |-
      Indien de totale inkomsten aan het begin van de periode, bedoeld in [artikel 42b, tweede lid][ref1],
      niet in overeenstemming zijn met het efficiënte kostenniveau inclusief een rendement dat in het economisch
      verkeer gebruikelijk is, kan de Autoriteit Consument en Markt bij de toepassing van de formule, genoemd in
      [artikel 42d, eerste lid, onderdeel a][ref2], in plaats van TIt-1, de totale inkomsten vaststellen op het
      efficiënte kostenniveau inclusief een rendement dat in het economisch verkeer gebruikelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel42b
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel42d
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42e
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 42b
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 42d
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 42e.5
    text: |-
      Indien een besluit op grond van [artikel 42b, eerste lid][ref1], of [artikel 42c, eerste lid][ref2], bij
      onherroepelijke rechterlijke uitspraak is vernietigd of bij een onherroepelijk besluit op bezwaar is herroepen,
      herberekent de Autoriteit Consument en Markt de inkomsten, bedoeld in het eerste lid, met toepassing van de met
      inachtneming van die uitspraak of dat besluit op bezwaar gecorrigeerde methode onderscheidenlijk gecorrigeerde
      doelmatigheidskorting en verdisconteert zij de uitkomsten van deze herberekening in de eerstvolgende op grond
      van het eerste lid vast te stellen inkomsten. Daarbij worden deze herberekening en de wijze waarop de uitkomsten
      daarvan in de inkomsten zijn verdisconteerd separaat weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel42b
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel42c
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel42e
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 42b
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 42c
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '43.1'
    text: |-
      Een netbeheerder is verplicht een afzonderlijke boekhouding te voeren voor de uitvoering van de bij of krachtens
      deze wet aan hem toegekende taken, met uitzondering van de taken, bedoeld in [artikel 17a][ref1] en [16a][ref2].
      Indien de netbeheerder werkzaamheden verricht als bedoeld in [artikel 7a][ref3] of 17a, voert hij daarvoor
      eveneens, al dan niet op geconsolideerde basis, een afzonderlijke boekhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16a
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel7a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 17a
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 16a
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 7a
        hoofdstuk: '2'
  - number: '43.2'
    text: 'De afzonderlijke boekhouding bevat:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel43
  - number: 43.2.a
    text: een balans en een winst- en verliesrekening,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel43
  - number: 43.2.b
    text: |-
      een specificatie van de toerekening van de activa en de passiva en de lasten en baten aan de taken, bedoeld in de
      eerste volzin van het eerste lid, waarbij in het bijzonder voor ieder spanningsniveau of een bandbreedte daarvan de
      bijbehorende kosten, opbrengsten en hoeveelheden,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel43
  - number: 43.2.c
    text: een specificatie van de inkomsten verkregen uit de eigendom van het net, en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel43
  - number: 43.2.d
    text: een toelichting op de gebruikte regels voor de afschrijving.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel43
  - number: '43.3'
    text: De netbeheerder geeft in de boekhouding aan welke methoden en criteria bij het opstellen daarvan zijn gehanteerd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel43
  - number: '43.4'
    text: |-
      Het toerekenen van kosten aan activiteiten als bedoeld in het eerste lid geschiedt in overeenstemming met het
      daadwerkelijk gebruik van financiële of andere middelen voor die activiteiten.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel43
  - number: '43.5'
    text: |-
      Wijzigingen in de in het tweede lid bedoelde regels voor de afschrijving worden met redenen omkleed in de
      boekhouding vermeld.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel43
  - number: '43.6'
    text: |-
      In de toelichting op de jaarrekening wordt elk verwant bedrijf waarmee een netbeheerder een overeenkomst heeft
      gesloten waarvan de opbrengst of de kosten een bedrag van € 4 500 000 te boven gaat, vermeld. Daarbij wordt tevens
      per bedrijf het aantal van die overeenkomsten gemeld.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel43
  - number: '43.7'
    text: |-
      Indien een netbeheerder niet reeds uit hoofde van een wettelijke verplichting zijn jaarrekening of een daarmee
      overeenkomend financieel overzicht openbaar maakt, legt hij die jaarrekening of dat overzicht voor een ieder ter
      inzage op het kantoor van zijn hoofdvestiging.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel43
  - number: '43.8'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de inrichting van de boekhouding
      voor de in het eerste lid bedoelde activiteiten.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel43
  - number: '43.9'
    text: 'Een netbeheerder publiceert jaarlijks:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel43
  - number: 43.9.a
    text: |-
      voor 1 oktober op geschikte wijze een verslag van de afzonderlijke boekhouding, bedoeld in het tweede lid over het
      daaraan voorafgaande kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel43
  - number: 43.9.b
    text: |-
      een verklaring waaruit blijkt dat de financiële verhouding tussen de netbeheerder en een met hem verbonden
      groepsmaatschappij voldoet aan het bepaalde bij of krachtens [artikel 17b, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel17b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 17b
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 43.9.c
    text: |-
      de gegevens waaruit blijkt dat de netbeheerder voldoet aan de regels omtrent een goed financieel beheer, bedoeld in
      [artikel 18a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel18a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 18a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '51.1'
    text: |-
      Een partij die een geschil heeft met een netbeheerder over de wijze waarop deze zijn taken en bevoegdheden op
      grond van deze wet uitoefent, dan wel aan zijn verplichtingen op grond van deze wet voldoet, kan een klacht bij de
      Autoriteit Consument en Markt indienen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel51
  - number: '51.2'
    text: |-
      De Autoriteit Consument en Markt beslist op een klacht binnen twee maanden na ontvangst van de klacht. Indien
      de klacht betrekking heeft op de tarieven voor de aansluiting op het net van een grote productie-eenheid, kan de
      Autoriteit Consument en Markt een langere termijn stellen. De Autoriteit Consument en Markt kan de in de eerste
      volzin genoemde termijn met twee maanden verlengen als zij aanvullende gegevens nodig heeft. Indien de klager
      daarmee instemt, is verdere verlenging mogelijk.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel51
  - number: '51.3'
    text: |-
      De geschilbeslechtingswerkzaamheden worden niet verricht door personen die betrokken zijn bij werkzaamheden op
      grond van [hoofdstuk 3, paragrafen 4 tot en met 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0009755
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '51.4'
    text: De beslissing van de Autoriteit Consument en Markt is bindend.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel51
  - number: '51.5'
    text: |-
      Het indienen van een klacht als bedoeld in het eerste lid laat onverlet elke mogelijkheid voor de desbetreffende
      partij een hem ter beschikking staand rechtsmiddel aan te wenden.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel51
  - number: '52'
    text: |-
      In het geval van een landsgrensoverschrijdend geschil is de Autoriteit Consument en Markt onbevoegd te beslissen
      op een klacht als bedoeld in [artikel 51][ref1], als de netbeheerder waartegen de klacht is gericht onder de
      rechtsmacht van een andere lidstaat van de Europese Unie valt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel51
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '51'
        hoofdstuk: '3'
        paragraaf: '8'
  - number: '53'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot een of meer voorwaarden, bedoeld in
      [artikel 54, eerste lid][ref1], waaronder in ieder geval regels over de verantwoording in de toelichting op de
      jaarrekening over het voldoen aan de voorwaarden die krachtens dit hoofdstuk zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel54
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '54'
        hoofdstuk: '4'
  - number: '54.1'
    text: |-
      Met inachtneming van de krachtens [artikel 53][ref1] vastgestelde regels zendt een representatief deel van de
      ondernemingen die zich bezighouden met het transporteren, leveren of meten van elektriciteit aan de Autoriteit
      Consument en Markt een voorstel voor de door hen jegens elkaar en afnemers in het kader van administratieve
      processen te hanteren voorwaarden met betrekking tot de wijze waarop de met die administratieve processen
      samenhangende gegevens worden vastgelegd, uitgewisseld of gebruikt of met betrekking tot de wijze waarop en de
      termijn waarbinnen die gegevens worden bewaard, waaronder in ieder geval voorwaarden die bepalen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel53
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '53'
        hoofdstuk: '4'
  - number: 54.1.a
    text: bij een wisseling van leverancier, de beoogde leverancier, en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel54
  - number: 54.1.b
    text: bij een verhuizing, de leverancier van de afnemer
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel54
  - number: '54.2'
    text: |-
      Ondernemingen die een voorstel doen, voeren overleg over dit voorstel met representatieve organisaties van partijen
      op de elektriciteitsmarkt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel54
  - number: '54.3'
    text: |-
      In het voorstel dat aan de Autoriteit Consument en Markt wordt gezonden, geven de ondernemingen aan welke
      gevolgtrekkingen zij hebben verbonden aan de zienswijzen die de organisaties, bedoeld in het tweede lid, naar voren
      hebben gebracht.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel54
  - number: '55'
    text: 'De Autoriteit Consument en Markt stelt de voorwaarden vast met inachtneming van:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel55
  - number: 55.a
    text: |-
      het voorstel als bedoeld in [artikel 54, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel54
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '54'
        hoofdstuk: '4'
  - number: 55.b
    text: |-
      de resultaten van het overleg, bedoeld in [artikel 54, tweede lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel54
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '54'
        hoofdstuk: '4'
  - number: 55.c
    text: |-
      de regels, bedoeld in [artikel 53][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel53
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '53'
        hoofdstuk: '4'
  - number: 55.d
    text: |-
      [artikel 36, eerste lid, onderdelen b tot en met f, en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '56.1'
    text: |-
      Na ontvangst van een voorstel als bedoeld in [artikel 54, eerste lid][ref1], kan de Autoriteit
      Consument en Markt de ondernemingen die het voorstel hebben ingediend, opdragen binnen vier weken
      en met inachtneming van haar bevindingen, waaronder haar bevindingen omtrent de belangen, bedoeld in
      [artikel 36, eerste lid, onderdelen b tot en met f][ref2], de regels, bedoeld in [artikel 53][ref3], of het
      bepaalde in artikel 36, tweede lid, het voorstel te wijzigen. Indien de Autoriteit Consument en Markt van deze
      bevoegdheid gebruik maakt is [artikel 4:15 van de Algemene wet bestuursrecht][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '54'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '53'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '56.2'
    text: |-
      Indien de ondernemingen, bedoeld in het eerste lid, niet binnen vier weken het voorstel wijzigen overeenkomstig
      de opdracht van de Autoriteit Consument en Markt, stelt de Autoriteit Consument en Markt de voorwaarden vast
      onder het aanbrengen van zodanige wijzigingen dat deze in overeenstemming zijn met de belangen, bedoeld in
      [artikel 36, eerste lid][ref1], onderdelen b tot en met f, met artikel 36, tweede lid, of met de regels, bedoeld
      in [artikel 53][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel53
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '53'
        hoofdstuk: '4'
  - number: '57.1'
    text: |-
      De Autoriteit Consument en Markt kan uit eigen beweging een ontwerp van een besluit maken tot wijziging van de
      voorwaarden, bedoeld in [artikel 54, eerste lid][ref1], of kan een representatief deel van de in artikel 54, eerste
      lid, bedoelde ondernemingen opdragen een daartoe strekkend voorstel voor te bereiden en aan haar toe te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel54
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '54'
        hoofdstuk: '4'
  - number: '57.2'
    text: |-
      Ondernemingen als bedoeld in [artikel 54, eerste lid][ref1], en de representatieve organisaties, bedoeld in artikel
      54, tweede lid, kunnen hun zienswijze op een dergelijk ontwerp van een besluit aan de Autoriteit Consument en Markt
      kenbaar maken binnen twaalf weken na het tijdstip waarop het ontwerp van het besluit is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel54
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '54'
        hoofdstuk: '4'
  - number: '57.3'
    text: |-
      Indien de in het tweede lid bedoelde ondernemingen en representatieve organisaties niet binnen de
      in het tweede lid genoemde termijn hun zienswijze op het ontwerp van het besluit kenbaar maken,
      stelt de Autoriteit Consument en Markt het besluit vast met inachtneming van de belangen, bedoeld in
      [artikel 36, eerste lid, onderdelen b tot en met f][ref1], met artikel 36, tweede lid, en met de regels, bedoeld
      in [artikel 53][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel53
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '53'
        hoofdstuk: '4'
  - number: '57.4'
    text: |-
      Indien de ondernemingen, bedoeld in het eerste lid, niet binnen twaalf weken na toezending van de
      in het eerste lid bedoelde opdracht, een voorstel aan de Autoriteit Consument en Markt zenden, stelt
      de Autoriteit Consument en Markt de voorwaarden vast met inachtneming van de belangen, bedoeld in
      [artikel 36, eerste lid, onderdelen b tot en met f][ref1], met artikel 36, tweede lid, en met de regels, bedoeld
      in [artikel 53][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel53
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '53'
        hoofdstuk: '4'
  - number: '58'
    text: |-
      Ten aanzien van de overeenkomstig dit hoofdstuk door de Autoriteit Consument en Markt vastgestelde voorwaarden zijn
      de [artikelen 37a][ref1] en [38, eerste tot en met derde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel37a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel38
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 37a
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '59.1'
    text: |-
      De door de Autoriteit Consument en Markt op basis van [artikel 31, eerste lid][ref1], op 6 maart 2007 vastgestelde
      informatiecode (Stcrt. 2007, 49) wordt op het tijdstip van inwerkingtreding van dit hoofdstuk aangemerkt als
      voorwaarden die overeenkomstig dit hoofdstuk zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '59.2'
    text: |-
      Uiterlijk 12 weken na inwerkingtreding van dit hoofdstuk ontvangt de Autoriteit Consument en Markt een voorstel als
      bedoeld in [artikel 54, eerste lid][ref1], dat tot doel heeft de in het eerste lid bedoelde informatiecode uit te
      breiden tot voorwaarden voor alle soorten ondernemingen, genoemd in artikel 54, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel54
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '54'
        hoofdstuk: '4'
  - number: '68.1'
    text: |-
      Producenten en leveranciers hebben tot taak, mede gelet op het belang van de bescherming van het milieu, bedoeld
      in artikel 3, tweede lid, van de richtlijn, te bevorderen dat elektriciteit door henzelf en door afnemers op een
      doelmatige en milieuhygiënisch verantwoorde wijze wordt geproduceerd of gebruikt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel68
  - number: '68.2'
    text: |-
      Iedere producent of leverancier die per jaar gemiddeld 10 GWh of meer levert meldt eenmaal in elke twee jaar vóór
      1 maart aan Onze Minister op welke wijze hij in de twee jaar voorafgaande aan het jaar, waarin de melding wordt
      verricht, uitvoering heeft gegeven aan zijn taak, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel68
  - number: '73.1'
    text: 'Onze Minister is belast met het uitgeven en innemen via een elektronisch systeem van:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel73
  - number: 73.1.a
    text: garanties van oorsprong voor duurzame elektriciteit;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel73
  - number: 73.1.b
    text: garanties van oorsprong voor elektriciteit opgewekt in een installatie voor hoogrenderende warmtekrachtkoppeling;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel73
  - number: 73.1.c
    text: certificaten van oorsprong.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel73
  - number: '73.2'
    text: |-
      Onze Minister opent op aanvraag van een in Nederland gevestigde producent, leverancier, handelaar of
      afnemer een rekening. Bij deze aanvraag overlegt de producent het resultaat van de vaststelling, bedoeld in
      [artikel 16, eerste lid, onderdeel h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '73.3'
    text: |-
      Onze Minister boekt op aanvraag garanties van oorsprong als bedoeld in het eerste lid of certificaten van oorsprong
      op een daarbij aangegeven rekening, indien een in Nederland gevestigde producent bij deze aanvraag de gegevens
      omtrent de door de netbeheerder of door een andere tot meten bevoegde instantie gemeten opgewekte hoeveelheid
      elektriciteit overlegt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel73
  - number: '74'
    text: |-
      Onze Minister kan de taken, bedoeld in [artikel 73][ref1], mandateren aan een niet-ondergeschikte die onafhankelijk
      is van producenten, leveranciers en handelaren.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel73
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '73'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '75.1'
    text: |-
      Een garantie van oorsprong voor duurzame elektriciteit toont bij uitsluiting aan dat de daarop aangegeven
      hoeveelheid elektriciteit is opgewekt uit hernieuwbare bronnen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel75
  - number: '75.2'
    text: |-
      Een garantie van oorsprong voor elektriciteit opgewekt in een installatie voor hoogrenderende warmtekrachtkoppeling
      toont bij uitsluiting aan dat de daarop aangegeven hoeveelheid elektriciteit is opgewekt in een installatie voor
      hoogrenderende warmtekrachtkoppeling.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel75
  - number: '75.3'
    text: |-
      Een certificaat van oorsprong toont bij uitsluiting aan dat de daarop aangegeven hoeveelheid elektriciteit is
      opgewekt uit een andere energiebron dan hernieuwbare energiebronnen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel75
  - number: '76.1'
    text: |-
      Garanties van oorsprong voor duurzame elektriciteit of garanties van oorsprong voor elektriciteit opgewekt in een
      installatie voor hoogrenderende warmtekrachtkoppeling uitgegeven door een onafhankelijke instantie in een andere
      lidstaat van de Europese Unie, die naar aard en strekking overeenkomen met in Nederland uitgegeven garanties van
      oorsprong voor duurzame elektriciteit of garanties van oorsprong voor elektriciteit opgewekt in een installatie
      voor hoogrenderende warmtekrachtkoppeling worden daarmee gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel76
  - number: '76.2'
    text: |-
      Garanties van oorsprong voor duurzame elektriciteit of garanties van oorsprong voor elektriciteit opgewekt in een
      installatie voor hoogrenderende warmtekrachtkoppeling uitgegeven door een onafhankelijke instantie in een derde
      land, die naar aard en strekking overeenkomen met in Nederland uitgegeven garanties van oorsprong, worden niet
      erkend, behalve indien de Europese Unie daarvoor een overeenkomst heeft afgesloten met het derde land en de energie
      rechtstreeks uit dat land wordt ingevoerd of uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel76
  - number: '77.1'
    text: |-
      Onze Minister stelt bij ministeriële regeling de tarieven vast voor kosten die gepaard gaan met handelingen met
      betrekking tot garanties van oorsprong, bedoeld in [artikel 73, eerste lid][ref1], of certificaten van oorsprong.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel73
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '73'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '77.2'
    text: 'Onze Minister stelt bij ministeriële regeling regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel77
  - number: 77.2.a
    text: |-
      de informatie die door producenten, leveranciers, handelaars, afnemers of netbeheerders verstrekt wordt aan Onze
      Minister;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel77
  - number: 77.2.b
    text: |-
      het uitgeven en de geldigheidsduur van garanties van oorsprong, bedoeld in [artikel 73, eerste lid][ref1], of
      certificaten van oorsprong;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel73
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '73'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 77.2.c
    text: |-
      het vermelden van gegevens op garanties van oorsprong, bedoeld in [artikel 73, eerste lid][ref1], of certificaten
      van oorsprong;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel73
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel77
    references:
