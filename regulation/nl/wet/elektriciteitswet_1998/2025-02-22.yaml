  - number: '17'
    text: |-
      1 Een netbeheerder verricht geen andere werkzaamheden dan die nodig zijn voor een goede uitvoering van de bij of
      krachtens de wet aan hem toegekende taken.

      2 In afwijking van het eerste lid mag een netbeheerder in opdracht van een andere netbeheerder de aan die
      netbeheerder toegekende taken uitvoeren.

      3 Een netbeheerder besteedt geen werkzaamheden bij een afnemer uit aan een onderneming waar een leverancier
      onderdeel van uitmaakt.

      4 Ingeval van uitbesteding van werkzaamheden behoudt de netbeheerder de verantwoordelijkheid voor de uitvoering van
      deze werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17
  - number: 17a
    text: |-
      1 Bij algemene maatregel van bestuur kunnen één of meer andere taken dan de op grond van deze wet toegekende taken
      voor de duur van ten hoogste vijf jaren per taak worden toegekend aan een netbeheerder voor zover:

      a. deze taken verband houden met de op grond van deze wet toegekende taken,

      b. deze taken van belang zijn voor het toekomstig beheer van het net en

      c. marktpartijen niet of in beperkte mate in de uitvoering van de taken voorzien.

      2 Bij algemene maatregel van bestuur worden regels gesteld over de voortzetting of beëindiging van een
      overeenkomstig het eerste lid toegekende taak.

      3 De voordracht voor een krachtens het eerste en tweede lid vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17a
  - number: 17b
    text: |-
      1 Een netbeheerder bevoordeelt niet een met hem verbonden groepsmaatschappij als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] boven een andere onderneming waarmee die
      groepsmaatschappij in concurrentie treedt en kent aan die groepsmaatschappij geen voordelen toe die verder gaan dan
      in het normale handelsverkeer gebruikelijk is.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld over handelingen die voordelen genereren die
      verder gaan dan in het normale handelsverkeer gebruikelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17b
    references:
