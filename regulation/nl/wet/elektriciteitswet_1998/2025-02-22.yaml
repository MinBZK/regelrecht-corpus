  - number: 42a
    text: |-
      1 De netbeheerder van het net op zee brengt geen tarief waarvoor het transport van elektriciteit wordt uitgevoerd,
      bedoeld in [artikel 29][ref1], en geen tarieven voor de diensten ter uitvoering van de taken, bedoeld in
      [artikel 40][ref2], in rekening bij zijn afnemers.

      2 De jaarlijkse toegestane inkomsten van de netbeheerder van het net op zee voor de uitvoering van de taken genoemd
      in [artikel 16, zestiende lid][ref3], worden overeenkomstig de [artikelen 42b tot en met 42e][ref4] vastgesteld.

      3 Indien de subsidie in een jaar het bedrag, genoemd in [artikel 77g, tweede lid][ref5], niet of niet geheel
      dekt, brengt de netbeheerder van het net op zee het deel dat niet door de subsidie wordt gedekt, in rekening bij de
      netbeheerder van het landelijk hoogspanningsnet.


