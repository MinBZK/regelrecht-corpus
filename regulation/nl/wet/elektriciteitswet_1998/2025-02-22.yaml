      de tarieven die deze netbeheerder ten hoogste zal berekenen voor de uitvoering van de taken genoemd in
      [artikel 16, eerste lid][ref1], en de taken, bedoeld in [artikelen 7a][ref2], [17a][ref3] en [22a][ref4], en voor
      zover het betreft de netbeheerder van het landelijk hoogspanningsnet, de taken, genoemd in artikel 16, tweede lid,
      met inachtneming van:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel17a
