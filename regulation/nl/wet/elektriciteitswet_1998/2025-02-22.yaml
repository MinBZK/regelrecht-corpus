      1 Een netbeheerder hanteert voorwaarden die redelijk, objectief en niet discriminerend zijn.

      2 Voorwaarden als bedoeld in de [artikelen 236][ref1] en [237 van boek 6 van het Burgerlijk Wetboek][ref2] worden
      vermoed niet redelijk te zijn.

      3 Een voorwaarde is redelijk, wanneer dit blijkt uit de aard, inhoud of wijze van totstandkoming van de betrokken
      voorwaarde.

      4 Het tweede en derde lid zijn niet van toepassing op een afnemer, bedoeld in [artikel 95a, eerste lid][ref3].

      5 De [artikelen 236][ref4] en [237 van boek 6 van het Burgerlijk Wetboek][ref5] zijn mede van toepassing op
      voorwaarden in overeenkomsten met afnemers als bedoeld in [artikel 95a, eerste lid][ref6], die rechtspersoon zijn
      of handelen in de uitoefening van een beroep of bedrijf.


