        paragraaf: '5'
  - number: 41b.1.k
    text: |-
      de geschatte kosten voor de uitvoering van [artikel 17a][ref1], voor zover deze kosten doelmatig zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel17a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41b
    references:
