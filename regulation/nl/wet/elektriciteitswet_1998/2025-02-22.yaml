    text: |-
      1 Een netbeheerder stelt periodiek een investeringsplan op waarin alle noodzakelijke uitbreidingsinvesteringen en
      vervangingsinvesteringen worden beschreven en onderbouwd.

      2 In een investeringsplan worden ten minste de investeringen opgenomen die noodzakelijk zijn
      voor de ontsluiting van windparken, die zijn opgenomen in een structuurvisie als bedoeld in
      [artikel 2.3 van de Wet ruimtelijke ordening][ref1].

      3 Een netbeheerder legt een ontwerpinvesteringsplan achtereenvolgens voor:

      a. aan een ieder ter consultatie en verwerkt de gegeven reacties op de ingediende zienswijzen in het plan,

      b. aan de Autoriteit Consument en Markt en, voor zover het een ontwerpinvesteringsplan voor het landelijk
      hoogspanningsnet betreft, aan Onze Minister.

      4 De Autoriteit Consument en Markt toetst of een netbeheerder in redelijkheid tot het ontwerpinvesteringsplan heeft
      kunnen komen.

      5 Onze Minister toetst of de netbeheerder van het landelijk hoogspanningsnet zich in voldoende mate rekenschap
      heeft gegeven van ontwikkelingen in de energiemarkt en van het actieplan dat Onze minister ingevolge artikel 15 van
      [verordening 2019/943](32843R2019) heeft vastgesteld.

      6 Een netbeheerder stelt het investeringsplan vast en verantwoordt daarbij hoe de resultaten van consultatie en
      toetsing zijn verwerkt.

      7 Een netbeheerder voert de in het investeringsplan opgenomen investeringen uit.

      8 Het derde tot en met zevende lid zijn van overeenkomstige toepassing bij een significante wijziging.

      9 De in het investeringsplan opgenomen investeringen worden noodzakelijk geacht voor de uitvoering van de op grond
      van deze wet aan een netbeheerder toegekende taken.

      10 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. de termijn waarvoor het investeringsplan geldt,

      b. de nadere inhoud en het aggregatieniveau van een investeringsplan,

      c. de procedure waarlangs een investeringsplan tot stand komt,

      d. de wijze waarop de noodzaak van investeringen wordt aangetoond,

      e. het tijdstip en de frequentie waarmee een investeringsplan dan wel onderdelen daarvan, wordt opgesteld of
      aangepast,

      f. de wijze waarop en bij wie een ontwerpinvesteringsplan wordt geconsulteerd,

      g. de wijze waarop bekendheid wordt gegeven aan een investeringsplan.

      11 De regels, bedoeld in het tiende lid, kunnen verschillen voor verschillende soorten netten, verschillende delen
      van netten met een verschillend spanningsniveau en verschillende netbeheerders.

      12 Onze Minister kan een bindende gedragslijn opleggen in het kader van de verplichting om rekenschap te geven van
      ontwikkelingen in de energiemarkt, bedoeld in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2.3
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
