    text: |-
      het totaal van de gemaakte kosten voor een verwerving van een bestaand net waarvoor nog niet eerder een
      netbeheerder was aangewezen door of met instemming van Onze Minister en voor de investeringen tot aanpassing van
      dat verworven net waardoor aan de bij of krachtens deze wet daaraan gestelde eisen wordt voldaan, voor zover deze
      kosten doelmatig zijn;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41b
  - number: 41b.1.h
    text: |-
      de geschatte vermogenskosten die de netbeheerder van het landelijk hoogspanningsnet in het jaar waarop het
      tarievenvoorstel betrekking heeft zal maken met betrekking tot nog niet in gebruik genomen investeringen, waarop de
      projectprocedure, bedoeld in [afdeling 5.2 van de Omgevingswet][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41b
    references:
      - id: ref1
