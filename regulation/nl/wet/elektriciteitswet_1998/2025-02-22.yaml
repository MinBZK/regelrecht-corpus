  - number: 22a
    text: |-
      1 Een netbeheerder verplaatst op verzoek van een college van burgemeester en wethouders of van gedeputeerde staten
      bovengrondse delen van netten die bestemd zijn voor transport van elektriciteit op een spanningsniveau van 50 kV of
      hoger of vervangt deze door ondergrondse delen voor zover:

      a. dat deel

      1°. ten minste 1.000 meter lang is, tenzij het een net betreft met een spanningsniveau van 50 kV of

      2°. ten minste 500 meter lang is, voor zover het een deel betreft dat direct is verbonden met een transformator-,
      schakel-, verdeel- of onderstation, voor zover het een te vervangen deel betreft en

      b. deze delen door Onze Minister zijn aangewezen.

      2 Krachtens het eerste lid, onderdeel b, worden slechts delen aangewezen waarvoor vervanging of verplaatsing
      kostenefficiënt is. Bij de aanwijzing kan worden bepaald dat een deel wordt aangewezen voor verplaatsing of voor
      vervanging.

      3 De aanwijzing, bedoeld in het eerste lid, onderdeel b, wordt bekend gemaakt in de Staatscourant.

      4 Een netbeheerder onderzoekt op verzoek van een college van burgemeester en wethouders of van gedeputeerde staten
      de technische haalbaarheid, de ruimtelijke aspecten en de investeringskosten van het verplaatsen of vervangen van
      een deel van het net dat op grond van het eerste lid is aangewezen.

      5 Onze Minister kan op aanvraag van een netbeheerder ontheffing verlenen van de verplichting op grond van het
      eerste lid, aanhef, voor een in die ontheffing aangewezen deel van het net indien het vervangen of verplaatsen van
      dat deel technisch of ruimtelijk niet haalbaar is of strijdig is met het belang van leveringszekerheid.

      6 Onze Minister kan op verzoek van een college van burgemeester en wethouders of gedeputeerde staten bovengrondse
      delen van netten die bestemd zijn voor transport van elektriciteit op een spanningsniveau van 50kV of hoger
      aanwijzen voor verplaatsing of vervanging voor zover die niet overeenkomstig het eerste lid zijn aangewezen.
      Een netbeheerder onderzoekt op verzoek van een college van burgemeester of gedeputeerde staten, na instemming
      van Onze Minister, de technische haalbaarheid, de ruimtelijke aspecten, het belang van leveringszekerheid en de
      investeringskosten van het verplaatsen of vervangen van het betreffende deel van het net. Bij het verzoek, bedoeld
      in de eerste volzin, wordt het onderzoek overgelegd. Het eerste lid, aanhef, tweede en de derde lid zijn van
      overeenkomstige toepassing op een aanwijzing.

      7 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. het deel van de kosten die een netbeheerder maakt voor de uitvoering van een verzoek als bedoeld in het eerste,
      vierde en zesde lid dat wordt betaald door de verzoeker en de bestanddelen waaruit die kosten bestaan;

      b. de volgorde waarin het verplaatsen of vervangen plaatsvindt;

      c. de procedure voor de het aanvragen van een ontheffing als bedoeld in het vijfde lid;

      d. de termijn waarbinnen een college van burgemeester en wethouders of gedeputeerde staten een verzoek bij Onze
      Minister kan indienen.

      8 De voordracht voor een krachtens het zevende lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel22a
  - number: '23'
    text: |-
      1 De netbeheerder is verplicht degene die daarom verzoekt te voorzien van een aansluiting op het door hem beheerde
      net tegen een tarief en tegen andere voorwaarden die in overeenstemming zijn met de [paragrafen 5][ref1] en
      [6 van dit hoofdstuk][ref2]. De netbeheerder verstrekt degene die om een aansluiting op het net verzoekt een
      gedetailleerde en volledige opgave van de uit te voeren werkzaamheden en de te berekenen kosten van de handelingen,
      onderscheiden in [artikel 28, eerste lid][ref3].

      2 In afwijking van het eerste lid voorziet de netbeheerder degene die daarom verzoekt, van een aansluiting op het
      door hem beheerde net die niet past bij de productiecapaciteit van de productie-installatie, indien;

      a. die aansluiting volgens de netbeheerder geschikter is met het oog op de belasting van zijn net;

      b. die aansluiting geen negatieve gevolgen heeft voor bestaande aansluitingen op zijn net;

      c. de mogelijke aansluitcapaciteit in overeenstemming met de aanvrager is; en

      d. de kosten niet hoger zijn dan de kosten van een aansluiting die past bij de productiecapaciteit van de
      productie-installatie.

      3 De netbeheerder onthoudt zich van iedere vorm van discriminatie tussen degenen jegens wie de verplichting,
      bedoeld in het eerste lid, geldt.

      4 Een aansluiting wordt door de netbeheerder gerealiseerd binnen een redelijke termijn.


