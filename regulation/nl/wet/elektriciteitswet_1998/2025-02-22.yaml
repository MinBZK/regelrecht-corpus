  - number: 37a
    text: |-
      1 De Autoriteit Consument en Markt kan op aanvraag bij beschikking een ontheffing verlenen van de tariefstructuren
      en de voorwaarden. Bij haar beslissing neemt de Autoriteit Consument en Markt de belangen als bedoeld in
      [artikel 36, eerste lid, onderdelen b tot en met f][ref1] en de regels, bedoeld in artikel 36, eerste lid,
      onderdelen g en h, in acht.

      2 De Autoriteit Consument en Markt stelt beleidsregels op met betrekking tot de procedure voor aanvraag van een
      ontheffing.

      3 De Autoriteit Consument en Markt kan voorschriften en beperkingen verbinden aan de ontheffing. De Autoriteit
      Consument en Markt kan de voorschriften en de opgelegde beperkingen wijzigen.

      4 De Autoriteit Consument en Markt trekt de ontheffing in op daartoe strekkend schriftelijk verzoek van de houder
      van de ontheffing.

      5 De Autoriteit Consument en Markt kan een ontheffing intrekken, indien:

      a. de houder van de ontheffing de aan de ontheffing verbonden voorschriften of opgelegde beperkingen niet nakomt;

      b. de houder van de ontheffing bij de aanvraag onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking
      van juiste en volledige gegevens tot een andere beschikking op de aanvraag zou hebben geleid;

      c. de Autoriteit Consument en Markt, gelet op de belangen bedoeld in
      [artikel 36, eerste lid, onderdelen b tot en met f][ref2] en de regels, bedoeld in artikel 36, eerste lid,
      onderdelen g en h, van oordeel is dat intrekking van de ontheffing noodzakelijk is.

      6 Van een op grond van dit artikel genomen beschikking wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel36
