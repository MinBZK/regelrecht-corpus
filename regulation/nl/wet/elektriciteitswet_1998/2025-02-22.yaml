  - number: '11'
    text: |-
      1 Een producent, leverancier of handelaar wordt niet aangewezen als netbeheerder.

      2 De statuten van de netbeheerder, niet zijnde de netbeheerder van het landelijk hoogspanningsnet, bevatten in
      ieder geval:

      a. de instelling van een raad van commissarissen;

      b. de bepaling dat de leden van het bestuur en de meerderheid van de leden van de raad van commissarissen direct
      noch indirect binding hebben met een producent, een leverancier of een handelaar;

      c. in afwijking van [artikel 129, derde lid][ref1], of
      [artikel 239, derde lid, van Boek 2 van het Burgerlijk Wetboek][ref2], de bepaling dat aan de goedkeuring van de
      raad van commissarissen ten minste zijn onderworpen de besluiten van het bestuur van de rechtspersoon, bedoeld in
      [artikel 164, eerste lid][ref3], of [artikel 274, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4];

      d. de bepaling dat de aandeelhouders het kader vaststellen voor het bezoldigingsbeleid van de bestuurders;

      e. de bepaling dat het reserveren en uitkeren van de jaarlijkse winst geschiedt met de instemming van de
      aandeelhouders en met inachtneming van de uitvoering van de aan de netbeheerder bij wet opgedragen taken en
      verplichtingen om zijn netten in werking te hebben, te vernieuwen, te onderhouden en uit te breiden.

      3 Indien een netbeheerder, niet zijnde de netbeheerder van het landelijk hoogspanningsnet, een afhankelijke
      maatschappij is in de zin van [artikel 152][ref5] of [artikel 262 van Boek 2 van het Burgerlijk Wetboek][ref6],
      behoeven de statuten van die netbeheerder, in afwijking van het tweede lid, onderdeel a, niet te voorzien in de
      instelling van een raad van commissarissen.

      4 In het in het derde lid bedoelde geval:

      a. voldoet een rechtspersoon waarvan de netbeheerder een afhankelijke maatschappij is aan de in het tweede lid,
      aanhef en onderdelen a en b, genoemde eisen;

      b. beschikt de raad van commissarissen van de rechtspersoon, bedoeld in onderdeel a, waarvan de netbeheerder een
      afhankelijke maatschappij is over de bevoegdheden, bedoeld in het tweede lid, onderdeel c, ten aanzien van het
      bestuur van de netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel239
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel164
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel274
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel152
      [ref6]: https://wetten.overheid.nl/BWBR0003045#Artikel262
