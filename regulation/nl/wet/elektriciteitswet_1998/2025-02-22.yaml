  - number: 10Aa
    text: |-
      1 [Artikel 10, tweede tot en met achtste lid][ref1], is van overeenkomstige toepassing voor de aanwijzing van
      een interconnector-beheerder, met dien verstande dat in afwijking van artikel 10, tweede lid, de interconnector-
      beheerder geen naamloze of besloten vennootschap behoeft te zijn.

      2 [Artikel 14, eerste tot en met derde lid][ref2], is van overeenkomstige toepassing, met dien verstande dat in
      afwijking van artikel 14, eerste lid, de interconnector-beheerder geen naamloze of besloten vennootschap behoeft
      te zijn.

      3 Voor een interconnector-beheerder zijn uitsluitend de
      [artikelen 16, eerste lid, onderdeel a, b, j, k en l, tweede lid, onderdeel g, k en m en vijftiende lid][ref3],
      [24][ref4], [26a, eerste lid][ref5], [31a][ref6], [51][ref7], [52][ref8] en [79][ref9] van overeenkomstige
      toepassing.

      4 De op basis van [artikel 36][ref10] of [37][ref11] vastgestelde voorwaarden zijn van toepassing voor zover dit
      in de voorwaarden is aangegeven. Met betrekking tot deze voorwaarden is [artikelen 32][ref12] van overeenkomstige
      toepassing, met dien verstande dat in plaats van «netbeheerder van het landelijk hoogspanningsnet» wordt gelezen
      «interconnector-beheerder», en maakt de interconnector-beheerder in dat geval deel uit van de gezamenlijke
      netbeheerders als bedoeld in de [artikelen 33][ref13] en [34][ref14].

      5 Indien de netbeheerder van het landelijk hoogspanningsnet is aangewezen als interconnector-beheerder zijn,
      in afwijking van het tweede tot en met het vierde lid, de bij of krachtens de Elektriciteitswet 1998 voor
      de netbeheerder van het landelijk hoogspanningsnet geldende bepalingen van overeenkomstige toepassing, met
      dien verstande dat het landelijk hoogspanningsnet en het desbetreffende landsgrensoverschrijdende net voor de
      vaststelling van de tarieven als één net kunnen worden beschouwd.

      6 Indien een persoon uit een derde land zeggenschap heeft over een eigenaar van een landsgrensoverschrijdend
      net of een interconnector-beheerder, besluit de Autoriteit Consument en Markt in het besluit, bedoeld in
      [artikel 10, derde lid][ref15], op verzoek en volgens de procedure van artikel 11 van de richtlijn of is voldaan
      aan de eisen van artikel 11, derde lid, van de richtlijn.

      7 Bij algemene maatregel van bestuur worden ter implementatie van artikel 9 van de richtlijn nadere regels gesteld
      voor interconnector-beheerders.

      8 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de werking en
      exploitatie van een landsgrensoverschrijdend net dat de grens met een derde land overschrijdt en de beheerder
      van dat net, voor zover deze regels nodig zijn voor het functioneren en de exploitatie van dat net of voor het
      functioneren van die beheerder.


