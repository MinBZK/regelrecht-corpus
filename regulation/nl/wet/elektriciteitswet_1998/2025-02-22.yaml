    text: |-
      1 Indien naar het oordeel van Onze Minister om de leverings- en voorzieningszekerheid te waarborgen onvoldoende
      productie-installaties worden gebouwd, kan hij een procedure starten overeenkomstig artikel 8 van de richtlijn.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de in artikel 8 van de
      richtlijn bedoelde procedure.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9a
  - number: 9b
    text: |-
      1 Werken met een nationaal belang waarvoor Onze Minister in ieder geval een projectbesluit als bedoeld in
      [afdeling 5.2 van de Omgevingswet][ref1] vaststelt, zijn de volgende projecten:

      a. de aanleg en uitbreiding van een productie-installatie, met inbegrip van de aansluiting van die installatie
      op een net, met een capaciteit van ten minste 100 MW, indien het betreft een installatie voor de opwekking van
      duurzame elektriciteit met behulp van windenergie op land;

      b. de aanleg en uitbreiding van een productie-installatie, met inbegrip van de aansluiting van die installatie op
      een net, met een capaciteit van ten minste 50 MW, indien het betreft een installatie voor de opwekking van duurzame
      elektriciteit anders dan met behulp van windenergie;

      c. de aanleg en uitbreiding van een productie-installatie, met inbegrip van de aansluiting van die installatie op
      een net, met een capaciteit van ten minste 500 MW, indien het betreft een installatie voor de opwekking van andere
      dan duurzame elektriciteit;

      d. de uitbreiding van een productie-installatie voor de opwekking van andere dan duurzame elektriciteit, met
      inbegrip van de aansluiting van die installatie op een net, indien door die uitbreiding de capaciteit van die
      productie-installatie wordt vergroot tot ten minste 500 MW.

      2 [Artikel 16.7 van de Omgevingswet][ref2] is van toepassing op de coördinatie van besluiten ter uitvoering van
      projectbesluiten als bedoeld in het eerste lid.

      3 In afwijking van het eerste lid kan Onze Minister besluiten geen projectbesluit vast te stellen als naar zijn
      oordeel besluitvorming door een bestuursorgaan van een gemeente of van een provincie het project kan versnellen
      of daaraan anderszins aanmerkelijke voordelen zijn verbonden, en het college van burgemeester en wethouders van de
      betreffende gemeente respectievelijk gedeputeerde staten van de betreffende provincie daarmee instemmen.

      4 Onze Minister geeft tegelijk met of zo snel mogelijk na de bekendmaking van een besluit als bedoeld in het derde
      lid kennis van dat besluit op de in [artikel 12 van de Bekendmakingswet][ref3] bepaalde wijze en doet mededeling
      van dat besluit door toezending daarvan aan de initiatiefnemer.

      5 Het vierde lid is van overeenkomstige toepassing als een besluit als bedoeld in het derde lid wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
