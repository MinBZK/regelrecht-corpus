  - number: 26b
    text: |-
      1 Bij ministeriële regeling worden regels gesteld met betrekking tot de tariefstructuren en voorwaarden als bedoeld
      in de [artikelen 27][ref1] en [31][ref2].

      2 De Autoriteit Consument en Markt brengt advies uit over het ontwerp van de in het eerste lid bedoelde regels.

      3 Een krachtens het eerste lid vast te stellen ministeriële regeling treedt niet eerder in werking dan vier weken
      nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd. Het ontwerp wordt vergezeld door het over de
      ministeriële regeling uitgebrachte advies van de Autoriteit Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel31
