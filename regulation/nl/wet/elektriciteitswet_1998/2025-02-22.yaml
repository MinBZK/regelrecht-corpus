  - number: '77.3'
    text: |-
      De regels, bedoeld in het tweede lid, kunnen verschillen voor de verschillende soorten garanties van oorsprong,
      bedoeld in [artikel 73, eerste lid][ref1], of certificaten van oorsprong.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel73
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '73'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 77a
    text: |-
      Een leverancier boekt als bewijs van levering van elektriciteit aan een in Nederland gevestigde eindafnemer, binnen
      één maand na de levering de hoeveelheid garanties van oorsprong of certificaten van oorsprong die correspondeert
      met de hoeveelheid elektriciteit die is geleverd aan een in Nederland gevestigde eindafnemer van zijn Nederlandse
      rekening af.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel77a
  - number: 77g.1
    text: |-
      Onze Minister kan een subsidie verstrekken aan de netbeheerder van het net op zee voor de aanleg, het beheer en het
      onderhoud van het net op zee.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel77g
  - number: 77g.2
    text: |-
      De subsidie dient geheel of gedeeltelijk ter dekking van een bedrag dat bestaat uit de vastgestelde toegestane
      inkomsten, bedoeld in [artikel 42e, eerste lid][ref1], met inachtneming van de correcties genoemd in artikel 42e,
      tweede en vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel42e
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel77g
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 42e
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 77g.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het verstrekken van de
      subsidie.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel77g
  - number: 77g.4
    text: |-
      De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel77g
  - number: 77h
    text: |-
      De Autoriteit Consument en Markt kan ingeval van overtreding van het bepaalde bij of krachtens deze wet, met
      uitzondering van [artikel 5a][ref1], [13][ref2], [22, tweede lid][ref3], [26aa][ref4], [26ad, vijfde lid][ref5],
      en [26ae, tiende lid][ref6], dan wel van overtreding van het bepaalde bij of krachtens [verordening 2019/943]
      (32843R2019), [verordening 2019/942](32842R2019) en verordening 1227/2011 de overtreder een last onder dwangsom
      opleggen.


