        artikel: '73'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 77.2.d
    text: |-
      de voorwaarden waaronder en de wijze waarop producenten, leveranciers, handelaars of afnemers gebruik kunnen maken
      van de door hen verkregen garanties van oorsprong, bedoeld in [artikel 73, eerste lid][ref1], of certificaten van
      oorsprong, of deze kunnen verhandelen;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel73
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel77
    references:
