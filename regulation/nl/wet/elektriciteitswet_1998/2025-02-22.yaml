  - number: '12.3'
    text: |-
      Indien Onze Minister voorschriften verbindt aan zijn instemming, strekken deze er slechts toe de geconstateerde
      tekortkomingen, bedoeld in het tweede lid, weg te nemen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel12
  - number: '13.1'
    text: |-
      Indien het aanwijzen van een netbeheerder als bedoeld in [artikel 10, negende lid][ref1], niet is geschied binnen
      vier weken na de aanleg van een net dan wel onverwijld na het intrekken of vervallen van een eerdere aanwijzing,
      of indien er sprake is van een net waarvoor ten onrechte geen netbeheerder is aangewezen of instemming van Onze
      Minister met een aanwijzing ontbreekt, kan Onze Minister door aanwijzing van een naamloze of besloten vennootschap
      een netbeheerder van dat net aanwijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '13.2'
    text: |-
      Indien Onze Minister vaststelt dat niet meer voldaan wordt aan de [artikelen 10a][ref1], [10b][ref2],
      [11][ref3], [11a][ref4] of [11b][ref5] of dat een netbeheerder in onvoldoende mate in staat is of zal zijn
      om aan een verplichting als bedoeld in de [artikelen 17b][ref6], [18a][ref7] of [78][ref8] te voldoen, om
      een taak als bedoeld in [artikel 16, eerste of tweede lid][ref9], of [17a][ref10] uit te voeren , indien
      [artikel 17][ref11] of 17b niet wordt nageleefd of indien de netbeheerder deel uitmaakt van een groep als bedoeld
      in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref12], de met hem verbonden groepsmaatschappij niet voldoet
      aan het bepaalde bij of krachtens [artikel 17c][ref13], kan Onze Minister de desbetreffende netbeheerder opdragen
      door hem noodzakelijk geachte voorzieningen te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel11a
