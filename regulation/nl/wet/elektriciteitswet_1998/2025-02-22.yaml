        afdeling: '5.2'
  - number: 41b.1.j
    text: |-
      de geschatte kosten voor de uitvoering van [artikel 7a][ref1], voor zover deze kosten doelmatig zijn en niet op
      grond van [artikel 30b][ref2] in rekening zijn gebracht via een tarief;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel30b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel41b
