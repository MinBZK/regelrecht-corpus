  - number: 41b
    text: |-
      1 Iedere netbeheerder zendt jaarlijks voor 1 oktober aan de Autoriteit Consument en Markt een voorstel
      voor de tarieven die deze netbeheerder ten hoogste zal berekenen voor de uitvoering van de taken genoemd in
      [artikel 16, eerste lid][ref1], en de taken, bedoeld in [artikelen 7a][ref2], [17a][ref3] en [22a][ref4], en voor
      zover het betreft de netbeheerder van het landelijk hoogspanningsnet, de taken, genoemd in artikel 16, tweede lid,
      met inachtneming van:

      a. het uitgangspunt dat de kosten worden toegerekend aan de tariefdragers betreffende de diensten die deze kosten
      veroorzaken,

      b. de tariefstructuren vastgesteld op grond van [artikel 36][ref5] of [37][ref6],

      c. het bepaalde bij of krachtens [artikel 41a][ref7],

      d. de formule

      waarbij

      TI = de totale inkomsten uit de tarieven in het jaar t, te weten de som van de vermenigvuldiging van elk tarief
      in jaar t en het op basis van [artikel 41a, eerste lid, onderdeel c][ref8], vastgestelde rekenvolume van elke
      tariefdrager waarvoor een tarief wordt vastgesteld;

      TI = de totale inkomsten uit de tarieven in het jaar voorafgaande aan het jaar t, te weten de som van de
      vermenigvuldiging van elk tarief in jaar t-1 en het op basis van [artikel 41a, eerste lid, onderdeel c][ref9],
      vastgestelde rekenvolume van elke tariefdrager waarvoor een tarief wordt vastgesteld;

      cpi = de relatieve wijziging van de consumentenprijsindex (alle huishoudens), berekend uit het quotiënt van deze
      prijsindex, gepubliceerd in de vierde maand voorafgaande aan het jaar t, en van deze prijsindex, gepubliceerd in de
      zestiende maand voorafgaande aan het jaar t, zoals deze maandelijks wordt vastgesteld door het Centraal Bureau voor
      de Statistiek;

      x = de korting ter bevordering van de doelmatige bedrijfsvoering;

      q = de kwaliteitsterm, die de aanpassing van de tarieven in verband met de geleverde kwaliteit aangeeft;

      e. de gemaakte kosten voor investeringen, bedoeld in [artikel 20d][ref10], voor zover de kosten doelmatig zijn;

      f.

      g. het totaal van de gemaakte kosten voor een verwerving van een bestaand net waarvoor nog niet eerder een
      netbeheerder was aangewezen door of met instemming van Onze Minister en voor de investeringen tot aanpassing van
      dat verworven net waardoor aan de bij of krachtens deze wet daaraan gestelde eisen wordt voldaan, voor zover deze
      kosten doelmatig zijn;

      h. de geschatte vermogenskosten die de netbeheerder van het landelijk hoogspanningsnet in het jaar waarop het
      tarievenvoorstel betrekking heeft zal maken met betrekking tot nog niet in gebruik genomen investeringen, waarop de
      projectprocedure, bedoeld in [afdeling 5.2 van de Omgevingswet][ref11] van toepassing is;

      i. de geschatte kosten die de netbeheerder van het landelijk hoogspanningsnet heeft voor investeringen die in het
      jaar waarop het tarievenvoorstel betrekking heeft, in gebruik worden of zijn genomen, waarop de projectprocedure,
      bedoeld in [afdeling 5.2 van de Omgevingswet][ref12] van toepassing is;

      j. de geschatte kosten voor de uitvoering van [artikel 7a][ref13], voor zover deze kosten doelmatig zijn en niet op
      grond van [artikel 30b][ref14] in rekening zijn gebracht via een tarief;

      k. de geschatte kosten voor de uitvoering van [artikel 17a][ref15], voor zover deze kosten doelmatig zijn;

      l. de gemaakte kosten voor de uitvoering van [artikel 22a][ref16], voor zover deze kosten doelmatig zijn en deze
      kosten niet op grond van het bepaalde bij of krachtens artikel 22a, zevende lid, worden betaald door de verzoeker,
      bedoeld in artikel 22a, eerste lid.

      2 De geschatte kosten die een netbeheerder voor de uitvoering van de taken genoemd in
      [artikel 16, eerste en tweede lid][ref17], bij een andere netbeheerder in rekening zal brengen, worden zonder
      toepassing van de formule, bedoeld in het eerste lid, onder d, toegevoegd aan de totale inkomsten uit de tarieven
      van deze andere netbeheerder. Het verschil tussen de geschatte en gerealiseerde kosten wordt betrokken bij de
      vaststelling van de totale inkomsten uit de tarieven van de andere netbeheerder in een volgend jaar.

      3 De geschatte kosten die de netbeheerder van het landelijk hoogspanningsnet voor de uitvoering van de taken,
      genoemd in [artikel 16, tweede lid][ref18], maakt, worden zonder toepassing van de formule, bedoeld in het eerste
      lid, onderdeel d, en met toepassing van het besluit, bedoeld in [artikel 41, eerste lid, onderdeel b][ref19],
      toegevoegd aan de totale inkomsten uit de tarieven van de netbeheerder van het landelijk hoogspanningsnet.

      4 De Autoriteit Consument en Markt stelt een beleidsregel vast betreffende de beoordeling van doelmatigheid,
      bedoeld in het eerste lid, onder e en g.

      5 De Autoriteit Consument en Markt kan een beleidsregel vaststellen betreffende de beoordeling van doelmatigheid,
      bedoeld in het eerste lid, onderdelen j en k.


