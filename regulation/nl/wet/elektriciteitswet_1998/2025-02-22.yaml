  - number: 9h
    text: |-
      1 Een producent die elektriciteit levert met een directe lijn aan verbruikers van elektriciteit meldt zo spoedig
      mogelijk na ingebruikname van een directe lijn aan de Autoriteit Consument en Markt:

      a. zijn naam en adres;

      b. een globale beschrijving van de directe lijn;

      c. een aanduiding van de locatie waar de directe lijn zich bevindt.

      2 De producent meldt een significante wijziging ten opzichte van een eerdere melding zo spoedig mogelijk na
      doorvoering van de betreffende wijziging aan de Autoriteit Consument en Markt. Onder een significante wijziging
      wordt in ieder geval verstaan een wijziging van het aantal aangeslotenen op de directe lijn, een wijziging van de
      eigenaar van de directe lijn of een wijziging in de eventuele verbinding met een net.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9h
  - number: '10'
    text: |-
      1 Het landelijk hoogspanningsnet omvat de netten die bestemd zijn voor transport van elektriciteit op een
      spanningsniveau van 110 kV of hoger en die als zodanig worden bedreven, met uitzondering van het net op zee, en
      landsgrensoverschrijdende netten met wisselstroom.

      2 Onze Minister wijst op verzoek een naamloze of een besloten vennootschap voor tien jaar als netbeheerder van het
      landelijk hoogspanningsnet aan. Bij het verzoek wordt een besluit van de Autoriteit Consument en Markt overgelegd
      waaruit blijkt dat is voldaan aan het bepaalde bij of krachtens [artikel 10a, vierde lid][ref1], en [10b][ref2].

      3 De Autoriteit Consument en Markt besluit op verzoek van degene die wenst te worden aangewezen als netbeheerder
      van het landelijk hoogspanningsnet of naar aanleiding van een situatie, bedoeld in het achtste lid, of is voldaan
      aan het bepaalde bij of krachtens [artikel 10a, vierde lid][ref3], en [10b][ref4].

      4 De Autoriteit Consument en Markt neemt de beschikking, bedoeld in het derde lid, overeenkomstig de procedure van
      artikel 10, vijfde en zesde lid, van de richtlijn en artikel 51 van [verordening 2019/943](32843R2019).

      5 De Europese Commissie kan van een producent, een leverancier of de netbeheerder van het landelijk
      hoogspanningsnet de gegevens en inlichtingen verlangen die zij nodig heeft voor de uitvoering van artikel 10 van
      de richtlijn.

      6 Degene aan wie een verzoek is gedaan om gegevens en inlichtingen te verstrekken als bedoeld in het vijfde lid,
      is verplicht binnen de door de Europese Commissie gestelde redelijke termijn alle medewerking te verlenen die deze
      redelijkerwijs kan vorderen bij de uitoefening van haar bevoegdheden.

      7 De netbeheerder van het landelijk hoogspanningsnet meldt de Autoriteit Consument en Markt omstandigheden die
      aanleiding kunnen geven tot herziening van de beschikking, bedoeld in het derde lid.

      8 De Autoriteit Consument en Markt kan de beschikking, bedoeld in het derde lid, wijzigen of intrekken:

      a. naar aanleiding van een melding als bedoeld in het zevende lid;

      b. naar aanleiding van gewijzigde omstandigheden;

      c. op verzoek van de Europese Commissie.

      9 Degene aan wie een ander net toebehoort dan het landelijk hoogspanningsnet of een landsgrensoverschrijdend net,
      wijst voor het beheer van dat net een of meer naamloze of besloten vennootschappen als netbeheerder aan.

      10 Een aanwijzing als bedoeld in het negende lid geldt voor een periode van tien jaar, te rekenen vanaf de dag
      waarop Onze Minister heeft ingestemd met de aanwijzing op grond van [artikel 12, tweede lid][ref5].

      11 Degene aan wie een net toebehoort, handelt als beheerder van dat net, indien daarvoor geen beheerder is
      aangewezen krachtens deze wet. De bij of krachtens deze wet aan een netbeheerder opgelegde verplichtingen zijn van
      overeenkomstige toepassing.


