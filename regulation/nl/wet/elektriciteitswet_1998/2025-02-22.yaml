        hoofdstuk: '8'
        paragraaf: '1'
  - number: '16.1'
    text: |-
      De netbeheerder heeft in het kader van het beheer van de netten in het voor hem krachtens [artikel 36][ref1] of
      [37][ref2] vastgestelde gebied tot taak:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel37
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 16.1.a
    text: de door hem beheerde netten in werking te hebben en te onderhouden;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16.1.b
    text: |-
      de veiligheid en betrouwbaarheid van de netten en van het transport van elektriciteit over de netten op de meest
      doelmatige wijze te waarborgen;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16.1.c
    text: |-
      de netten aan te leggen, te herstellen, te vernieuwen of uit te breiden, waarbij in overweging worden
      genomen maatregelen op het gebied van duurzame elektriciteit, energiebesparing en vraagsturing of decentrale
      elektriciteitsproductie waardoor de noodzaak van vervanging of vergroting van de productiecapaciteit ondervangen
      kan worden;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16.1.d
    text: voldoende reservecapaciteit voor het transport van elektriciteit aan te houden;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16.1.e
    text: |-
      op de grondslag van [artikel 23][ref1] derden te voorzien van een aansluiting op de netten;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel23
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 16.1.f
    text: |-
      op de grondslag van [artikel 24][ref1] ten behoeve van derden transport van elektriciteit uit te voeren;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel24
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 16.1.g
    text: het bevorderen van de veiligheid bij het gebruik van toestellen en installaties die elektriciteit verbruiken;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16.1.h
    text: |-
      op verzoek van een producent vast te stellen of diens productie-installatie geschikt is voor de opwekking van
      elektriciteit uit hernieuwbare energiebronnen of uit andere energiebronnen dan wel of sprake is van een installatie
      voor hoogrenderende warmtekrachtkoppeling, alsmede of de inrichting om te meten geschikt is voor de meting van de
      elektriciteit die met de productie-installatie wordt opgewekt en op een net of een installatie ingevoed;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16.1.i
    text: |-
      de hoeveelheid elektriciteit te meten die afkomstig is van een productie-installatie voor duurzame elektriciteit of
      klimaatneutrale elektriciteit of van een installatie voor hoogrenderende warmtekrachtkoppeling;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16.1.j
    text: koppelingen met andere netten te realiseren en reparaties aan zijn net uit te voeren;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16.1.k
    text: |-
      onverminderd [artikel 79][ref1], op een geschikte wijze gegevens te publiceren over koppelingen tussen de netten,
      gebruik van de netten en de toewijzing van transportcapaciteit;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel79
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '79'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 16.1.l
    text: |-
      afnemers alle gegevens te verstrekken die zij voor een efficiënte toegang tot het net inclusief het gebruik ervan
      nodig hebben;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16.1.m
    text: |-
      voorzieningen te treffen in geval van een faillissement van een leverancier van elektriciteit aan afnemers als
      bedoeld in [artikel 95a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 16.1.n
    text: |-
      ervoor zorg te dragen dat een afnemer als bedoeld in [artikel 95a, eerste lid][ref1], voor elke aansluiting
      beschikt over een geïnstalleerde meetinrichting, tenzij die afnemer blijkens de voorwaarden, bedoeld in
      [artikel 31, eerste lid, onderdelen a of b][ref2], beschikt over een onbemeten aansluiting;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 16.1.o
    text: |-
      zorg te dragen voor het beheer en onderhoud van de bij een afnemer als bedoeld in [artikel 95a, eerste lid][ref1],
      geïnstalleerde meetinrichting;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 16.1.p
    text: de taken te vervullen die voortvloeien uit het bepaalde bij of krachtens [verordening 2019/943](32843R2019);
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16.1.q
    text: zijn netten te beschermen tegen mogelijke invloeden van buitenaf.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: '16.2'
    text: |-
      In aanvulling op de taken, bedoeld in het eerste lid, heeft de netbeheerder van het landelijk hoogspanningsnet
      tevens tot taak:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16.2.a
    text: |-
      technische voorzieningen te treffen en systeemdiensten uit te voeren, waaronder het aanhouden van voldoende
      productiereservecapaciteit, die nodig zijn om het transport van elektriciteit over alle netten op een veilige en
      doelmatige wijze te waarborgen;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16.2.b
    text: |-
      mede ten behoeve van de andere netbeheerders de technische voorzieningen en systeemdiensten, bedoeld onder a, te
      benutten;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16.2.c
    text: |-
      op de grondslag van [paragraaf 7 van dit hoofdstuk][ref1] ten behoeve van derden transport van elektriciteit uit te
      voeren met behulp van het landelijk hoogspanningsnet, voor de uitvoer van die elektriciteit vanuit Nederland naar
      een afnemer of leverancier in het buitenland, dan wel voor de invoer van die elektriciteit vanuit het buitenland
      naar een afnemer of leverancier in Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        hoofdstuk: '3'
        paragraaf: '7'
  - number: 16.2.d
    text: |-
      een passend niveau van voorzieningen te treffen en te handhaven, waaronder het aanhouden van voldoende
      productiereservecapaciteit, in verband met de leveringszekerheid op de korte en de lange termijn;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16.2.f
    text: |-
      indien Onze Minister hem dit opdraagt, werkzaamheden te verrichten ter uitvoering van de taak, bedoeld in
      [artikel 4a][ref1] of van [verordening 2019/941](32841R2019);


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel4a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 4a
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 16.2.g
    text: |-
      andere netbeheerders de gegevens te verschaffen die nodig zijn om een betrouwbare en efficiënte werking, alsmede
      de samenhangende ontwikkeling en interoperabiliteit, van de netten te waarborgen. In geval van grensoverschrijdende
      koppeling met andere lidstaten van de Europese Unie dan wel met niet lidstaten wisselt de netbeheerder van het
      landelijk hoogspanningsnet met de betreffende netbeheerders in die landen, in overeenstemming met de operationele
      minimumvereisten als bedoeld in [artikel 31, elfde lid][ref1], tijdig en op doeltreffende wijze gegevens uit over
      het functioneren van de landgrensoverschrijdende netten;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 16.2.h
    text: |-
      samen te werken met buitenlandse instellingen die op grond van nationale wettelijke regels zijn belast met het
      beheer van een transmissiesysteem als bedoeld in artikel 2, onderdeel 4, van de richtlijn in geografische gebieden
      als bedoeld in artikel 34, derde lid, van [verordening 2019/943](32843R2019) teneinde een concurrerende interne
      markt voor elektriciteit tot stand te brengen;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16.2.i
    text: |-
      te beschikken over één of meer geïntegreerde systemen in geografische gebieden als bedoeld in artikel 34, derde
      lid, van [verordening 2019/943](32843R2019) waaraan twee of meer lidstaten meewerken voor de toewijzing van
      capaciteit en voor de controle op de beveiliging van het net;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16.2.j
    text: |-
      het innen van congestielasten en betalingen in het kader van het vergoedingsmechanisme overeenkomstig artikel 49
      van [verordening 2019/943](32843R2019);
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16.2.k
    text: |-
      onverminderd [artikel 79, eerste lid][ref1], het openbaar maken van informatie die nodig is voor doeltreffende
      mededinging en een efficiënte werking van de markt;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel79
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '79'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 16.2.m
    text: samen te werken met Acer;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16.2.n
    text: het koppelen van het net op zee met het landelijk hoogspanningsnet.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: '16.3'
    text: |-
      Producenten, leveranciers en handelaren onthouden zich van iedere bemoeiing met de uitvoering van de taken die op
      grond van het eerste of tweede lid aan een netbeheerder zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: '16.4'
    text: |-
      Een net met een spanningsniveau van 110 kV of hoger, met uitzondering van het net op zee, is zodanig ontworpen en
      in werking dat het transport van elektriciteit ook verzekerd is indien zich een uitvalsituatie voordoet, tenzij:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16.4.a
    text: voor een bepaalde uitvalsituatie vrijstelling is verleend bij algemene maatregel van bestuur;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16.4.b
    text: |-
      voor een bepaald onderdeel van het net op aanvraag van de desbetreffende netbeheerder ontheffing is verleend door
      de Autoriteit Consument en Markt. Aan de ontheffing kunnen voorschriften en beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: '16.5'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de verlening, wijziging en intrekking van een
      ontheffing als bedoeld in het vierde lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: '16.6'
    text: |-
      Indien een netbeheerder energie inkoopt ter uitvoering van zijn wettelijke taken, doet hij dit op basis van een
      transparante, niet-discriminatoire en marktconforme procedure.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: '16.7'
    text: |-
      Van een besluit als bedoeld in het tweede lid, onderdeel f, wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: '16.8'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld ter uitvoering van de taak, bedoeld in het eerste lid,
      onderdeel m. Deze regels hebben mede betrekking op de wijze waarop enerzijds de netbeheerder van het landelijk
      hoogspanningsnet en anderzijds de producenten, leveranciers, handelaren en afnemers zich jegens elkaar gedragen in
      verband met de uitvoering van de taak, bedoeld in het tweede lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: '16.9'
    text: |-
      De Autoriteit Consument en Markt brengt advies uit over het ontwerp van de algemene maatregel van bestuur, bedoeld
      in het achtste lid. De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel van bestuur
      wordt niet gedaan dan nadat het ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is
      geboden om binnen vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van
      Onze Minister te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-
      Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: '16.10'
    text: |-
      Tot de voorzieningen die de netbeheerder van het landelijk hoogspanningsnet ter uitvoering van zijn taak bedoeld
      in het tweede lid, onderdeel d, treft, behoren het voor transport van elektriciteit handhaven van reservecapaciteit
      die groot genoeg is om de operationele netwerkveiligheid te waarborgen en het samenwerken met netbeheerders waarmee
      hij een landgrensoverschrijdend net heeft.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: '16.11'
    text: |-
      Een beslissing tot het aanleggen van een landsgrensoverschrijdend net door de netbeheerder van het landelijke
      hoogspanningsnet dan wel door een ander als bedoeld in het zesde lid wordt niet genomen dan in nauwe samenwerking
      met de netbeheerders in andere landen waarmee een landgrensoverschrijdend net tot stand wordt gebracht en andere
      relevante netbeheerders.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: '16.12'
    text: |-
      Indien de netbeheerder van het landelijk hoogspanningsnet het noodzakelijke acht voorzieningen te treffen als
      bedoeld in [artikel 16, tweede lid, onderdeel d][ref1], ter uitvoering van zijn taak de leveringszekerheid voor
      de lange termijn te waarborgen, verstrekt hij de Autoriteit Consument en Markt een overzicht van de te nemen
      maatregelen en de gevolgen van die maatregelen voor afnemers en het functioneren van de markt. De Autoriteit
      Consument en Markt zendt het overzicht vergezeld van haar advies aan Onze Minister. De maatregelen behoeven de
      goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '16.13'
    text: |-
      Onze Minister verleent zijn goedkeuring niet eerder dan vier weken nadat het overzicht en het advies, bedoeld in
      het dertiende lid, aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: '16.14'
    text: |-
      Indien de netbeheerder van het landelijk hoogspanningsnet deelneemt aan een gemeenschappelijke onderneming waaraan
      ook een verticaal geïntegreerde buitenlandse instelling die op grond van nationale wettelijke regels is belast
      met het beheer van een transmissiesysteem als bedoeld in artikel 2, onderdeel 4, van de richtlijn deelneemt,
      draagt de netbeheerder van het landelijk hoogspanningsnet er zorg voor dat de gemeenschappelijke onderneming een
      nalevingsprogramma ontwerpt, door Acer laat goedkeuren en implementeert met maatregelen die moeten worden genomen
      om discriminerend en concurrentieverstorend gedrag uit te sluiten.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: '16.15'
    text: |-
      Voordat de netbeheerder van het landelijk hoogspanningsnet congestiebeheersprocedures hanteert voor
      landsgrensoverschrijdende netten, legt hij deze procedures ter goedkeuring voor aan de Autoriteit Consument en
      Markt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: '16.16'
    text: |-
      Het eerste lid, onderdelen a tot en met l en q zijn van overeenkomstige toepassing op de netbeheerder van het net
      op zee.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16
  - number: 16a.1
    text: |-
      Degene, niet zijnde een netbeheerder, die bij een afnemer de meting van van het net afgenomen en verbruikte of
      opgewekte en op het net ingevoede elektriciteit verricht, deelt de daarmee verkregen meetgegevens mee aan de
      desbetreffende afnemer en aan de netbeheerder op wiens net de afnemer is aangesloten.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16a
  - number: 16a.2
    text: |-
      De netbeheerder deelt de meetgegevens, bedoeld in het eerste lid en in [artikel 16, eerste lid, onderdeel i][ref1],
      mee aan Onze Minister, alsmede aan de desbetreffende afnemer voor zover die nog niet de beschikking heeft over
      die informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 16c.1
    text: |-
      In afwijking van [artikel 16, eerste lid, onderdeel e][ref1], kan een afnemer die een aansluiting op het net
      wenst met een aansluitwaarde groter dan 10 MVA met uitzondering van een aansluiting op het net op zee een openbare
      aanbesteding van de aansluitingswerkzaamheden uitschrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 16c.2
    text: |-
      Met een afnemer, bedoeld in het eerste lid, wordt gelijkgesteld een organisatorische eenheid, die zich in
      hoofdzaak bezig houdt met openbaar vervoer per trein, tram, of trolley, met mijnbouwkundige activiteiten, met
      het beheer en de exploitatie van telecommunicatie- en kabelnetwerken, met het beheer van openbare verlichting of
      van verkeersregelinstallaties, dan wel met riolering, bemaling, waterzuivering of transport en distributie van
      water waarbij deze eenheid ingevolge de technische aard van de bedrijfsuitoefening beschikt over verscheidene
      aansluitingen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16c
  - number: 16c.3
    text: |-
      Het bedrijf dat de werkzaamheden, bedoeld in het eerste lid, uitvoert, beschikt ten minste over voldoende kennis,
      deskundigheid en ervaring om een aansluiting op het net te kunnen realiseren.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16c
  - number: 16c.4
    text: |-
      De afnemer die het verzoek, bedoeld in het eerste lid, doet, verzoekt de netbeheerder die het net beheert om
      instemming met het realiseren van een aansluiting als bedoeld in het eerste lid. De netbeheerder onthoudt zijn
      instemming slechts, indien met het verlenen van de gevraagde instemming de betrouwbaarheid van het door hem
      beheerde net niet langer kan worden gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16c
  - number: 16c.5
    text: |-
      Dit artikel is van overeenkomstige toepassing op het wijzigen, onderhouden en verwijderen van een aansluiting als
      bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16c
  - number: 16d.1
    text: Een netbeheerder stelt iedere vijf jaar een calamiteitenplan vast en zendt dit ter goedkeuring aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16d
  - number: 16d.2
    text: Bij ministeriële regeling worden nadere eisen gesteld aan het calamiteitenplan.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16d
  - number: 16d.3
    text: |-
      Onze Minister beoordeelt of het calamiteitenplan voldoet aan de eisen, bedoeld in het tweede lid, en kan de
      netbeheerder verzoeken het calamiteitenplan aan te passen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16d
  - number: 16da
    text: |-
      Onze Minister kan een netbeheerder een aanwijzing geven in het kader van de bescherming van de netten tegen een
      mogelijke invloed van buitenaf, bedoeld in [artikel 16, eerste lid, onderdeel q][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16da
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 16e.1
    text: |-
      Onze Minister stelt een kader vast inzake de ontwikkeling van windenergie op zee. In het ontwikkelkader wordt in
      ieder geval opgenomen:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16e
  - number: 16e.1.a
    text: de locatie van één of meerdere windparken;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16e
  - number: 16e.1.b
    text: het verwachte tijdstip van ingebruikname van ieder windpark;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16e
  - number: 16e.1.c
    text: de verwachte levensduur van windparken;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16e
  - number: 16e.1.d
    text: het maximale vermogen van ieder windpark;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16e
  - number: 16e.1.e
    text: de minimale transportcapaciteit ten behoeve van ieder windpark;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16e
  - number: 16e.1.f
    text: de wijze van elektrische ontsluiting van ieder windpark;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16e
  - number: 16e.1.g
    text: de beoogde opleveringsdatum van onderdelen van het net op zee;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16e
  - number: 16e.1.h
    text: |-
      toekomstige ontwikkelingen inzake windenergie op zee waarmee bij de elektrische ontsluiting rekening wordt
      gehouden.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16e
  - number: 16e.2
    text: Onze Minister kan het ontwikkelkader wijzigen of aanvullen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16e
  - number: 16e.3
    text: |-
      De netbeheerder van het net op zee werkt het ontwikkelkader uit in het investeringsplan, bedoeld in
      [artikel 21][ref1] en voert zijn taken uit in overeenstemming met het ontwikkelkader.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel21
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16e
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 16f.1
    text: 'Een producent heeft recht op vergoeding van schade door de netbeheerder van het net op zee, indien:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16f
  - number: 16f.1.a
    text: |-
      deze netbeheerder het voor de ontsluiting van het windpark noodzakelijk deel van het net op zee geheel of
      gedeeltelijk later oplevert dan in het ontwikkelkader, bedoeld in [artikel 16e, eerste lid][ref1], is opgenomen en
      de producent hierdoor geheel of gedeeltelijk geen elektriciteit kan laten transporteren, of


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16e
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16f
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 16e
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 16f.1.b
    text: |-
      de hoeveelheid elektriciteit die in een kalenderjaar niet kan worden getransporteerd over het net op zee groter
      is dan de hoeveelheid elektriciteit die niet kan worden getransporteerd wegens gemiddeld voor het net op zee
      redelijkerwijs noodzakelijk onderhoud en de producent hierdoor geheel of gedeeltelijk geen elektriciteit kan laten
      transporteren.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16f
  - number: 16f.2
    text: |-
      De vergoeding van de schade bestaat uit gevolgschade en de schade ten gevolge van gederfde of uitgestelde
      inkomsten.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16f
  - number: 16f.3
    text: Een producent draagt er zorg voor dat de schade zo veel mogelijk beperkt blijft.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16f
  - number: 16f.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over het recht op schadevergoeding,
      bedoeld in het eerste lid, en de bestanddelen van de vergoeding, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16f
  - number: 16f.5
    text: |-
      De voordracht voor een krachtens het vierde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel16f
  - number: '17.1'
    text: |-
      Een netbeheerder verricht geen andere werkzaamheden dan die nodig zijn voor een goede uitvoering van de bij of
      krachtens de wet aan hem toegekende taken.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17
  - number: '17.2'
    text: |-
      In afwijking van het eerste lid mag een netbeheerder in opdracht van een andere netbeheerder de aan die
      netbeheerder toegekende taken uitvoeren.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17
  - number: '17.3'
    text: |-
      Een netbeheerder besteedt geen werkzaamheden bij een afnemer uit aan een onderneming waar een leverancier onderdeel
      van uitmaakt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17
  - number: '17.4'
    text: |-
      Ingeval van uitbesteding van werkzaamheden behoudt de netbeheerder de verantwoordelijkheid voor de uitvoering van
      deze werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17
  - number: 17a.1
    text: |-
      Bij algemene maatregel van bestuur kunnen één of meer andere taken dan de op grond van deze wet toegekende taken
      voor de duur van ten hoogste vijf jaren per taak worden toegekend aan een netbeheerder voor zover:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17a
  - number: 17a.1.a
    text: deze taken verband houden met de op grond van deze wet toegekende taken,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17a
  - number: 17a.1.b
    text: deze taken van belang zijn voor het toekomstig beheer van het net en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17a
  - number: 17a.1.c
    text: marktpartijen niet of in beperkte mate in de uitvoering van de taken voorzien.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17a
  - number: 17a.2
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de voortzetting of beëindiging van een overeenkomstig
      het eerste lid toegekende taak.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17a
  - number: 17a.3
    text: |-
      De voordracht voor een krachtens het eerste en tweede lid vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17a
  - number: 17b.1
    text: |-
      Een netbeheerder bevoordeelt niet een met hem verbonden groepsmaatschappij als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] boven een andere onderneming waarmee die
      groepsmaatschappij in concurrentie treedt en kent aan die groepsmaatschappij geen voordelen toe die verder gaan dan
      in het normale handelsverkeer gebruikelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 17b.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over handelingen die voordelen genereren die verder
      gaan dan in het normale handelsverkeer gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17b
  - number: 17c.1
    text: |-
      Een groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waar een netbeheerder deel van
      uitmaakt, voert in hoofdzaak de taken uit die bij of krachtens deze wet zijn toegekend aan een netbeheerder of,
      indien van toepassing, de taken die bij of krachtens de Gaswet zijn toegekend aan een netbeheerder als bedoeld in
      [artikel 1, eerste lid, onderdeel e, van de Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '1'
  - number: 17c.2
    text: |-
      Een met een netbeheerder verbonden groepsmaatschappij als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] beperkt zich in Nederland tot:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 17c.2.a
    text: |-
      handelingen of activiteiten die gerelateerd zijn aan het beheer van netten of gastransportnetten als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Gaswet][ref1], en betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '1'
  - number: 17c.2.a.1°
    text: aanleg en beheer van een landsgrensoverschrijdende net,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17c
  - number: 17c.2.a.2°
    text: |-
      aanleg en beheer van een landsgrensoverschrijdend gastransportnet als bedoeld in
      [artikel 1, eerste lid, onderdeel z, van de Gaswet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '1'
  - number: 17c.2.a.3°
    text: aanleg en beheer van kabels en leidingen en daarmee verbonden hulpmiddelen,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17c
  - number: 17c.2.a.4°
    text: aanleg en beheer van infrastructuur voor het op- of ontladen van elektrische voertuigen,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17c
  - number: 17c.2.a.5°
    text: aanleg, onderhoud en het ter beschikking stellen van installaties,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17c
  - number: 17c.2.a.6°
    text: meetdiensten en meetinrichtingen,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17c
  - number: 17c.2.a.7°
    text: certificering van hernieuwbare energie,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17c
  - number: 17c.2.a.8°
    text: energiebeurzen en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17c
  - number: 17c.2.a.9°
    text: schakelen van installaties, niet zijnde productie-installaties;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17c
  - number: 17c.2.b
    text: aanleg en beheer van antenne-opstelpunten ten behoeve van ethercommunicatie;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17c
  - number: 17c.2.c
    text: |-
      handelingen of activiteiten die bij of krachtens de [Drinkwaterwet][ref1] zijn toegestaan aan de eigenaar van een
      drinkwaterbedrijf;


      [ref1]: https://wetten.overheid.nl/BWBR0026338
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0026338
  - number: 17c.2.d
    text: handelingen of activiteiten met betrekking tot infrastructuur voor koolstofdioxide;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17c
  - number: 17c.2.e
    text: |-
      aanleg en beheer van andere infrastructuur dan bedoeld in onderdelen a tot en met d met inbegrip van transport
      via die infrastructuur, voor zover de met de groepsmaatschappij verbonden netbeheerder blijft voldoen aan
      [artikel 10b][ref1]. Onder andere infrastructuur wordt in ieder geval verstaan: leidingen of installaties voor
      waterstof, biogas, warmte en koude.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 10b
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 17c.3
    text: |-
      Bij algemene maatregel van bestuur kunnen andere dan de in het tweede lid, onderdeel a, genoemde handelingen of
      activiteiten worden aangewezen die de groepsmaatschappij, bedoeld in het tweede lid, voor een in deze algemene
      maatregel van bestuur vastgestelde duur kan verrichten.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17c
  - number: 17c.4
    text: |-
      Indien handelingen of activiteiten worden aangewezen op grond van het derde lid, worden bij algemene maatregel van
      bestuur regels gesteld over de voortzetting of beëindiging van die handelingen of activiteiten.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17c
  - number: 17c.5
    text: |-
      De voordracht voor een krachtens het derde en vierde lid vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel17c
  - number: '18'
    text: |-
      Het is een ander dan een netbeheerder verboden de op grond van deze wet aan een netbeheerder toegekende taken,
      anders dan tijdelijke taken als bedoeld in [artikel 17a][ref1], uit te voeren, met uitzondering van:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel17a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 17a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 18.a
    text: de werkzaamheden die een netbeheerder aan een ander uitbesteedt;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel18
  - number: 18.b
    text: |-
      de aanleg, de wijziging, het onderhoud of de verwijdering van een aansluiting met een aansluitwaarde groter dan 10
      MVA op een net, niet zijnde een net op zee;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel18
  - number: 18.c
    text: |-
      de aanleg, de wijziging, het onderhoud of de verwijdering van een aansluiting van een organisatorische eenheid als
      bedoeld in [artikel 1, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 18.d
    text: de aanleg van kabels en leidingen en daarmee verbonden hulpmiddelen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel18
  - number: 18a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent een goed financieel beheer van
      de netbeheerder.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel18a
  - number: 18a.2
    text: De in het eerste lid bedoelde regels houden in ieder geval in dat
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel18a
  - number: 18a.2.a
    text: |-
      de netbeheerder voldoet aan bij of krachtens die maatregel gestelde eisen aan zijn kredietwaardigheid waaronder de
      verhouding tussen vreemd vermogen en totaal vermogen, of dat
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel18a
  - number: 18a.2.b
    text: |-
      de netbeheerder beschikt over een verklaring van een onafhankelijke deskundige ten aanzien van zijn
      kredietwaardigheid.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel18a
  - number: 18a.3
    text: In de in het eerste lid bedoelde maatregel kunnen tevens
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel18a
  - number: 18a.3.a
    text: regels worden gesteld omtrent de wijze van berekening van vermogensonderdelen;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel18a
  - number: 18a.3.b
    text: |-
      eisen worden gesteld met betrekking tot de in het tweede lid, onderdeel b, bedoelde verklaring en de daar bedoelde
      deskundige.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel18a
  - number: 18a.4
    text: 'Indien de netbeheerder niet voldoet aan de regels, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel18a
  - number: 18a.4.a
    text: stelt de netbeheerder de Autoriteit Consument en Markt hiervan onverwijld schriftelijk op de hoogte,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel18a
  - number: 18a.4.b
    text: |-
      stelt de netbeheerder binnen vier weken na de melding een herstelplan op waarin wordt beschreven op welke wijze hij
      het financieel beheer gaat verbeteren en zendt hij dit plan aan de Autoriteit Consument en Markt, en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel18a
  - number: 18a.4.c
    text: keert de netbeheerder geen dividend uit aan zijn aandeelhouders.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel18a
  - number: 18a.5
    text: |-
      De Autoriteit Consument en Markt kan de netbeheerder aanwijzingen geven met betrekking tot de verbetering van het
      financieel beheer.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel18a
  - number: '19.1'
    text: 'Een netbeheerder:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19
  - number: 19.1.a
    text: |-
      hanteert een doeltreffend kwaliteitsborgingssysteem voor de uitvoering van de op grond van deze wet aan hem
      toegekende taken en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19
  - number: 19.1.b
    text: beschikt over een document waarin is aangegeven op welke wijze hij uitvoering geeft aan onderdeel a.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19
  - number: '19.2'
    text: |-
      Onder een doeltreffend kwaliteitsborgingssysteem wordt verstaan het geheel van samenhangende plannen, processen en
      procedures dat een netbeheerder in staat stelt de kwaliteit van zijn net en de uitvoering van de op grond van deze
      wet aan hem toegekende taken te registreren, te monitoren en waar nodig bij te sturen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19
  - number: '19.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld, die kunnen verschillen voor
      verschillende netten, verschillende delen van netten met een verschillend spanningsniveau en verschillende
      netbeheerders, over:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19
  - number: 19.3.a
    text: het kwaliteitsborgingsysteem;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19
  - number: 19.3.b
    text: de onderwerpen die in het document, bedoeld in het eerste lid, onderdeel b, ten minste moeten zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19
  - number: 19.3.c
    text: |-
      het verstrekken van gegevens en inlichtingen over het kwaliteitsborgingssysteem of het verstrekken van het document
      bedoeld in het eerste lid, onderdeel b, aan de Autoriteit Consument en Markt of aan Onze Minister;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19
  - number: 19.3.d
    text: |-
      het bewaren en openbaar maken van gegevens over het kwaliteitsborgingssysteem of van het document bedoeld in het
      eerste lid;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19
  - number: 19.3.e
    text: evaluatie van het kwaliteitsborgingssysteem.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19
  - number: 19b.1
    text: |-
      De netbeheerder, met uitzondering van de netbeheerder van het landelijk hoogspanningsnet, verstrekt binnen zes
      maanden na afloop van ieder kalenderjaar aan de Autoriteit Consument en Markt:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19b
  - number: 19b.1.a
    text: |-
      een overzicht van de door hem gesloten overeenkomsten met betrekking tot het verrichten van diensten ten behoeve
      van het netbeheer, vergezeld van afschriften van die overeenkomsten voorzover de Autoriteit Consument en Markt
      daarover niet reeds beschikt,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19b
  - number: 19b.1.b
    text: |-
      een overzicht van het aantal personen dat bij de netbeheerder werkzaam is ter uitvoering van de in
      [artikel 16][ref1] en [16a][ref2] genoemde taken,


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 16a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 19b.1.c
    text: een overzicht van in het afgelopen jaar gerealiseerde investeringen in het net,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19b
  - number: 19b.1.d
    text: |-
      een overzicht van de financiële middelen waarover hij beschikt ten behoeve van de uitvoering van zijn wettelijke
      taken, waaruit blijkt welke financiële middelen voor de afzonderlijke taken beschikbaar zijn, en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19b
  - number: 19b.1.e
    text: een verklaring van een onafhankelijke deskundige omtrent het in onderdeel d bedoelde overzicht.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19b
  - number: 19b.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de overzichten, bedoeld in het eerste
      lid, onderdelen a tot en met d, en de verklaring, bedoeld in het eerste lid, onderdeel e.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19b
  - number: 19b.3
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet verstrekt binnen zes maanden na afloop van ieder kalenderjaar
      aan de Autoriteit Consument en Markt een overzicht van de financiële middelen waarover hij beschikt ten behoeve
      van de uitvoering van zijn wettelijke taken, waaruit blijkt welke financiële middelen voor de afzonderlijke taken
      beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19b
  - number: 19c
    text: |-
      De netbeheerder, met uitzondering van de netbeheerder van het landelijk hoogspanningsnet, draagt er zorg voor dat
      de afnemers die op zijn net zijn aangesloten een overzicht ontvangen waarop de eenmalige kosten in verband met die
      aansluiting overzichtelijk en begrijpelijk zijn gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19c
  - number: 19d.1
    text: |-
      Een netbeheerder voorziet in een transparante, eenvoudige en goedkope procedure voor de behandeling van klachten
      van afnemers als bedoeld in [artikel 95a, eerste lid][ref1], over het netbeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 19d.2
    text: 'De in het eerste lid bedoelde procedure voorziet er voorts in dat:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19d
  - number: 19d.2.a
    text: |-
      de behandeling van de klacht geschiedt door een persoon die niet bij de gedraging waarop de klacht betrekking
      heeft, betrokken is geweest,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19d
  - number: 19d.2.b
    text: |-
      de klager schriftelijk en gemotiveerd in kennis wordt gesteld van de bevindingen naar aanleiding van de klacht en
      van de conclusies die daaraan worden verbonden, en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19d
  - number: 19d.2.c
    text: de klacht zo spoedig mogelijk doch uiterlijk binnen acht weken wordt afgehandeld.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19d
  - number: 19e.1
    text: |-
      Een netbeheerder draagt er, al dan niet samen met een of meer andere netbeheerders, zorg voor dat onderbrekingen
      in het transport van elektriciteit en afwijkingen van de eisen aan de kwaliteit van het transport van elektriciteit
      door afnemers op een eenvoudige wijze gemeld kunnen worden en maakt aan afnemers bekend op welke wijze deze
      meldingen kunnen geschieden.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19e
  - number: 19e.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de registratie van de meldingen en de
      openbaarmaking van de registratie.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19e
  - number: '20.1'
    text: |-
      Een net dat door een netbeheerder is of wordt aangelegd, hersteld, vernieuwd of uitgebreid in het voor hem op grond
      van [artikel 36][ref1] of [37][ref2] vastgestelde gebied, wordt aangemerkt als openbaar werk van algemeen nut.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel37
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '20.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot daarbij aan te wijzen gebieden regels worden gesteld
      over de wijze waarop, gelet op het belang van een betrouwbaar, duurzaam, doelmatig en milieuhygiënisch verantwoord
      functionerende energiehuishouding, een afweging wordt gemaakt met betrekking tot de aanleg van een net en de aanleg
      van een gastransportnet of een warmtenet.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel20
  - number: '20.3'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat een net slechts wordt aangelegd als resultaat van een
      openbare procedure waarin gegadigden op een te plaatsen opdracht kunnen inschrijven met een aanbieding voor de
      aanleg van een net, een gastransportnet of een warmtenet.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel20
  - number: 20a.1
    text: |-
      Voor het volgende werk met een nationaal belang stelt Onze Minister in ieder geval een projectbesluit als bedoeld
      in [afdeling 5.2 van de Omgevingswet][ref1] vast: een uitbreiding van het landelijk hoogspanningsnet voor zover
      het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 20a.1.a
    text: |-
      de van dat net deel uitmakende netten bestemd voor het transport van elektriciteit op een spanningsniveau van
      220 kV of hoger en die als zodanig worden bedreven met inbegrip van de aansluitingen op die netten,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel20a
  - number: 20a.1.b
    text: |-
      de van dat net deel uitmakende landsgrensoverschrijdende netten op een spanningsniveau van 500 V of hoger met
      inbegrip van de aansluitingen op die netten, of
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel20a
  - number: 20a.1.c
    text: |-
      de aanleg of uitbreiding van een landsgrensoverschrijdend net met inbegrip van de aansluitingen op zo’n net, en het
      een project betreft voor elektriciteit dat is opgenomen op de Unielijst van projecten van gemeenschappelijk belang,
      bedoeld in artikel 3, vierde lid, Verordening (EU) nr. 347/2013 van het Europees Parlement en de Raad van 17 april
      2013 betreffende richtsnoeren voor de trans-Europese energie-infrastructuur en tot intrekking van Beschikking
      nr. 1364/2006/EG en tot wijziging van de Verordeningen (EG) nr. 713/2009, (EG) nr. 714/2009 en (EG) nr. 715/2009
      (PbEU 2013, L 115).
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel20a
  - number: 20a.2
    text: |-
      Onze Minister stelt in ieder geval een projectbesluit als bedoeld in [afdeling 5.2 van de Omgevingswet][ref1]
      vast voor de aanleg of uitbreiding van het net op zee, met dien verstande dat Onze Minister geen projectbesluit
      vaststelt voor het gebied gelegen aan de zeezijde van gemeentegrenzen of provinciale grenzen.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 20a.3
    text: |-
      [Artikel 16.7 van de Omgevingswet][ref1] is van toepassing op de coördinatie van besluiten ter uitvoering van
      projectbesluiten als bedoeld in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '16'
  - number: 20a.4
    text: |-
      In afwijking van het eerste lid kan Onze Minister besluiten geen projectbesluit vast te stellen als naar zijn
      oordeel besluitvorming door een bestuursorgaan van een gemeente of van een provincie het project kan versnellen
      of daaraan anderszins aanmerkelijke voordelen zijn verbonden, en het college van burgemeester en wethouders van de
      betreffende gemeente respectievelijk gedeputeerde staten van de betreffende provincie daarmee instemmen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel20a
  - number: 20a.5
    text: |-
      Onze Minister geeft tegelijk met of zo snel mogelijk na de bekendmaking van een besluit als bedoeld in het vierde
      lid kennis van dat besluit op de in [artikel 12 van de Bekendmakingswet][ref1] bepaalde wijze en doet mededeling
      van dat besluit door toezending daarvan aan de initiatiefnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel12
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '12'
  - number: 20a.6
    text: Het vijfde lid is van overeenkomstige toepassing als een besluit als bedoeld in het vierde lid wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel20a
  - number: 20a.7
    text: |-
      Voor projecten als bedoeld in het eerste lid, onder c, stelt Onze Minister, in overeenstemming met Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties, een handleiding vast als bedoeld in artikel 9, eerste lid, van de
      verordening, bedoeld in dat lid.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel20a
  - number: 20d.1
    text: |-
      De Autoriteit Consument en Markt verrekent de kosten van een investering waarvoor een projectbesluit als bedoeld in
      [afdeling 5.2 van de Omgevingswet][ref1] is genomen, in de tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel20d
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 20d.2
    text: |-
      De Autoriteit Consument en Markt verrekent de kosten van investeringen voor de ontsluiting van windparken, die zijn
      opgenomen in een programma als bedoeld in [afdeling 3.2 van de Omgevingswet][ref1], in de tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling3.2
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel20d
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '3.2'
  - number: 20d.3
    text: |-
      De Autoriteit Consument en Markt verrekent de kosten van investeringen ter uitvoering van het ontwikkelkader,
      bedoeld in [artikel 16e, eerste lid][ref1], in de toegestane inkomsten van de netbeheerder van het net op zee.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16e
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel20d
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 16e
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 20f
    text: |-
      De raad van bestuur van de mededingingsautoriteit stelt een beleidsregel vast betreffende de beoordeling van
      doelmatigheid, bedoeld in de [artikelen 20d][ref1] en [20e, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel20d
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel20e
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel20f
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 20d
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 20e
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '21.1'
    text: |-
      Een netbeheerder stelt periodiek een investeringsplan op waarin alle noodzakelijke uitbreidingsinvesteringen en
      vervangingsinvesteringen worden beschreven en onderbouwd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
  - number: '21.2'
    text: |-
      In een investeringsplan worden ten minste de investeringen opgenomen die noodzakelijk zijn
      voor de ontsluiting van windparken, die zijn opgenomen in een structuurvisie als bedoeld in
      [artikel 2.3 van de Wet ruimtelijke ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '2'
  - number: '21.3'
    text: 'Een netbeheerder legt een ontwerpinvesteringsplan achtereenvolgens voor:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
  - number: 21.3.a
    text: aan een ieder ter consultatie en verwerkt de gegeven reacties op de ingediende zienswijzen in het plan,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
  - number: 21.3.b
    text: |-
      aan de Autoriteit Consument en Markt en, voor zover het een ontwerpinvesteringsplan voor het landelijk
      hoogspanningsnet betreft, aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
  - number: '21.4'
    text: |-
      De Autoriteit Consument en Markt toetst of een netbeheerder in redelijkheid tot het ontwerpinvesteringsplan heeft
      kunnen komen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
  - number: '21.5'
    text: |-
      Onze Minister toetst of de netbeheerder van het landelijk hoogspanningsnet zich in voldoende mate rekenschap heeft
      gegeven van ontwikkelingen in de energiemarkt en van het actieplan dat Onze minister ingevolge artikel 15 van
      [verordening 2019/943](32843R2019) heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
  - number: '21.6'
    text: |-
      Een netbeheerder stelt het investeringsplan vast en verantwoordt daarbij hoe de resultaten van consultatie en
      toetsing zijn verwerkt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
  - number: '21.7'
    text: Een netbeheerder voert de in het investeringsplan opgenomen investeringen uit.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
  - number: '21.8'
    text: Het derde tot en met zevende lid zijn van overeenkomstige toepassing bij een significante wijziging.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
  - number: '21.9'
    text: |-
      De in het investeringsplan opgenomen investeringen worden noodzakelijk geacht voor de uitvoering van de op grond
      van deze wet aan een netbeheerder toegekende taken.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
  - number: '21.10'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
  - number: 21.10.a
    text: de termijn waarvoor het investeringsplan geldt,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
  - number: 21.10.b
    text: de nadere inhoud en het aggregatieniveau van een investeringsplan,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
  - number: 21.10.c
    text: de procedure waarlangs een investeringsplan tot stand komt,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
  - number: 21.10.d
    text: de wijze waarop de noodzaak van investeringen wordt aangetoond,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
  - number: 21.10.e
    text: |-
      het tijdstip en de frequentie waarmee een investeringsplan dan wel onderdelen daarvan, wordt opgesteld of
      aangepast,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
  - number: 21.10.f
    text: de wijze waarop en bij wie een ontwerpinvesteringsplan wordt geconsulteerd,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
  - number: 21.10.g
    text: de wijze waarop bekendheid wordt gegeven aan een investeringsplan.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
  - number: '21.11'
    text: |-
      De regels, bedoeld in het tiende lid, kunnen verschillen voor verschillende soorten netten, verschillende delen van
      netten met een verschillend spanningsniveau en verschillende netbeheerders.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
  - number: '21.12'
    text: |-
      Onze Minister kan een bindende gedragslijn opleggen in het kader van de verplichting om rekenschap te geven van
      ontwikkelingen in de energiemarkt, bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel21
  - number: '22.1'
    text: |-
      Indien naar het oordeel van de Autoriteit Consument en Markt uit het document, bedoeld in [artikel 19][ref1],
      de overzichten, bedoeld in [artikel 19b][ref2], of uit het investeringsplan, bedoeld in [artikel 21][ref3],
      of anderszins, blijkt dat een netbeheerder in onvoldoende mate of op een ondoelmatige wijze kan of zal kunnen
      voorzien in het door hem te bereiken niveau van de kwaliteit van zijn transportdienst of in de totale behoefte aan
      capaciteit voor het transport van elektriciteit over de door hem beheerde netten, meldt zij zulks na overleg met de
      netbeheerder van het landelijk hoogspanningsnet en de netbeheerder van het desbetreffende net aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel19b
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel21
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 19b
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '22.2'
    text: |-
      Nadat hij een melding heeft ontvangen, kan Onze Minister aan de desbetreffende netbeheerder opdragen voorzieningen
      te treffen teneinde zeker te stellen dat het transport van elektriciteit in voldoende mate of op een doelmatige
      wijze plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel22
  - number: '22.3'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de opdracht, bedoeld in
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel22
  - number: 22a.1
    text: |-
      Een netbeheerder verplaatst op verzoek van een college van burgemeester en wethouders of van gedeputeerde staten
      bovengrondse delen van netten die bestemd zijn voor transport van elektriciteit op een spanningsniveau van 50 kV of
      hoger of vervangt deze door ondergrondse delen voor zover:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel22a
  - number: 22a.1.a
    text: dat deel
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel22a
  - number: 22a.1.a.1°
    text: ten minste 1.000 meter lang is, tenzij het een net betreft met een spanningsniveau van 50 kV of
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel22a
  - number: 22a.1.a.2°
    text: |-
      ten minste 500 meter lang is, voor zover het een deel betreft dat direct is verbonden met een transformator-,
      schakel-, verdeel- of onderstation, voor zover het een te vervangen deel betreft en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel22a
  - number: 22a.1.b
    text: deze delen door Onze Minister zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel22a
  - number: 22a.2
    text: |-
      Krachtens het eerste lid, onderdeel b, worden slechts delen aangewezen waarvoor vervanging of verplaatsing
      kostenefficiënt is. Bij de aanwijzing kan worden bepaald dat een deel wordt aangewezen voor verplaatsing of voor
      vervanging.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel22a
  - number: 22a.3
    text: De aanwijzing, bedoeld in het eerste lid, onderdeel b, wordt bekend gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel22a
  - number: 22a.4
    text: |-
      Een netbeheerder onderzoekt op verzoek van een college van burgemeester en wethouders of van gedeputeerde staten de
      technische haalbaarheid, de ruimtelijke aspecten en de investeringskosten van het verplaatsen of vervangen van een
      deel van het net dat op grond van het eerste lid is aangewezen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel22a
  - number: 22a.5
    text: |-
      Onze Minister kan op aanvraag van een netbeheerder ontheffing verlenen van de verplichting op grond van het eerste
      lid, aanhef, voor een in die ontheffing aangewezen deel van het net indien het vervangen of verplaatsen van dat
      deel technisch of ruimtelijk niet haalbaar is of strijdig is met het belang van leveringszekerheid.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel22a
  - number: 22a.6
    text: |-
      Onze Minister kan op verzoek van een college van burgemeester en wethouders of gedeputeerde staten bovengrondse
      delen van netten die bestemd zijn voor transport van elektriciteit op een spanningsniveau van 50kV of hoger
      aanwijzen voor verplaatsing of vervanging voor zover die niet overeenkomstig het eerste lid zijn aangewezen.
      Een netbeheerder onderzoekt op verzoek van een college van burgemeester of gedeputeerde staten, na instemming
      van Onze Minister, de technische haalbaarheid, de ruimtelijke aspecten, het belang van leveringszekerheid en de
      investeringskosten van het verplaatsen of vervangen van het betreffende deel van het net. Bij het verzoek, bedoeld
      in de eerste volzin, wordt het onderzoek overgelegd. Het eerste lid, aanhef, tweede en de derde lid zijn van
      overeenkomstige toepassing op een aanwijzing.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel22a
  - number: 22a.7
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel22a
  - number: 22a.7.a
    text: |-
      het deel van de kosten die een netbeheerder maakt voor de uitvoering van een verzoek als bedoeld in het eerste,
      vierde en zesde lid dat wordt betaald door de verzoeker en de bestanddelen waaruit die kosten bestaan;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel22a
  - number: 22a.7.b
    text: de volgorde waarin het verplaatsen of vervangen plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel22a
  - number: 22a.7.c
    text: de procedure voor de het aanvragen van een ontheffing als bedoeld in het vijfde lid;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel22a
  - number: 22a.7.d
    text: |-
      de termijn waarbinnen een college van burgemeester en wethouders of gedeputeerde staten een verzoek bij Onze
      Minister kan indienen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel22a
  - number: 22a.8
    text: |-
      De voordracht voor een krachtens het zevende lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel22a
  - number: '23.1'
    text: |-
      De netbeheerder is verplicht degene die daarom verzoekt te voorzien van een aansluiting op het door hem beheerde
      net tegen een tarief en tegen andere voorwaarden die in overeenstemming zijn met de [paragrafen 5][ref1] en
      [6 van dit hoofdstuk][ref2]. De netbeheerder verstrekt degene die om een aansluiting op het net verzoekt een
      gedetailleerde en volledige opgave van de uit te voeren werkzaamheden en de te berekenen kosten van de handelingen,
      onderscheiden in [artikel 28, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel28
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009755
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '23.2'
    text: |-
      In afwijking van het eerste lid voorziet de netbeheerder degene die daarom verzoekt, van een aansluiting op het
      door hem beheerde net die niet past bij de productiecapaciteit van de productie-installatie, indien;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel23
  - number: 23.2.a
    text: die aansluiting volgens de netbeheerder geschikter is met het oog op de belasting van zijn net;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel23
  - number: 23.2.b
    text: die aansluiting geen negatieve gevolgen heeft voor bestaande aansluitingen op zijn net;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel23
  - number: 23.2.c
    text: de mogelijke aansluitcapaciteit in overeenstemming met de aanvrager is; en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel23
  - number: 23.2.d
    text: |-
      de kosten niet hoger zijn dan de kosten van een aansluiting die past bij de productiecapaciteit van de productie-
      installatie.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel23
  - number: '23.3'
    text: |-
      De netbeheerder onthoudt zich van iedere vorm van discriminatie tussen degenen jegens wie de verplichting, bedoeld
      in het eerste lid, geldt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel23
  - number: '23.4'
    text: Een aansluiting wordt door de netbeheerder gerealiseerd binnen een redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel23
  - number: '24.1'
    text: |-
      De netbeheerder is verplicht aan degene die daarom verzoekt een aanbod te doen om met gebruikmaking van het door
      hem beheerde net ten behoeve van de verzoeker transport van elektriciteit uit te voeren tegen een tarief en tegen
      andere voorwaarden die in overeenstemming zijn met de [paragrafen 5][ref1] en [6 van dit hoofdstuk][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009755
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '24.2'
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt niet voor zover de netbeheerder voor het gevraagde transport
      redelijkerwijs geen capaciteit ter beschikking heeft. Een weigering transport uit te voeren als bedoeld in de
      vorige volzin is met redenen omkleed. De netbeheerder verschaft degene aan wie transport is geweigerd desgevraagd
      en ten hoogste tegen kostprijs de relevante gegevens over de maatregelen die nodig zijn om het net te versterken.
      Indien ten aanzien van duurzame elektriciteit een weigering transport uit te voeren als bedoeld in de eerste volzin
      plaatsvindt, meldt de netbeheerder dit aan de Autoriteit Consument en Markt, waarbij de netbeheerder aangeeft welke
      maatregelen worden genomen om toekomstige weigeringen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel24
  - number: '24.3'
    text: |-
      De netbeheerder onthoudt zich van iedere vorm van discriminatie tussen degenen jegens wie de verplichting, bedoeld
      in het eerste lid, geldt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel24
  - number: 24Aa.1
    text: |-
      In afwijking van [artikel 23][ref1] is de netbeheerder van het net op zee verplicht op verzoek van een houder
      van een vergunning als bedoeld in [artikel 16, eerste lid, van de Wet windenergie op zee][ref2], overeenkomstig
      het ontwikkelkader windenergie op zee, bedoeld in [artikel 16e, eerste lid][ref3], te voorzien in een
      aansluiting op het door hem beheerde net tegen een tarief en andere voorwaarden die in overeenstemming zijn met
      [paragraaf 5][ref4] van dit hoofdstuk. De netbeheerder onthoudt zich hierbij van iedere vorm van discriminatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0036752#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel16e
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel24Aa
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0036752
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 16e
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009755
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 24Aa.2
    text: |-
      In afwijking van [artikel 24][ref1] is de netbeheerder van het net op zee verplicht de houder van de vergunning
      een aanbod te doen om met gebruikmaking van het door hem beheerde net ten behoeve van de houder van de vergunning
      transport van elektriciteit uit te voeren tegen voorwaarden die in overeenstemming zijn met [paragraaf 5][ref2]
      van dit hoofdstuk. De netbeheerder onthoudt zich hierbij van iedere vorm van discriminatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel24Aa
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0009755
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 24a.1
    text: |-
      Indien een afnemer van leverancier wisselt, wordt die wisseling uitgevoerd overeenkomstig bij ministeriële regeling
      te stellen regels, welke regels kunnen verschillen voor verschillende netbeheerders en beheerders van netten als
      bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel15
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 24a.2
    text: |-
      In de ministeriële regeling, bedoeld in het eerste lid, worden in ieder geval regels gesteld over de termijn
      waarbinnen de wisseling moet zijn uitgevoerd en over de bij een verzoek om wisseling te verstrekken gegevens.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel24a
  - number: '25.1'
    text: |-
      Indien de netbeheerder van het landelijk hoogspanningsnet maatregelen neemt als bedoeld in artikel 42 van
      de richtlijn en artikel 16 van [verordening 2019/943](32843R2019) maakt hij daarbij geen onderscheid tussen
      landgrensoverschrijdende en niet-landgrensoverschrijdende contracten.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel25
  - number: '25.2'
    text: |-
      De maatregelen worden genomen op basis van door de netbeheerder van het landelijk hoogspanningsnet vooraf
      gedefinieerde criteria met betrekking tot het beheer van onbalans die in nauw overleg met de relevante
      netbeheerders in andere landen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel25
  - number: '25.3'
    text: |-
      De maatregelen worden in nauw overleg met de relevante netbeheerders in andere landen genomen met in achtneming van
      de terzake geldende bilaterale overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel25
  - number: '26.1'
    text: |-
      De Autoriteit Consument en Markt kan op aanvraag besluiten dat capaciteit op het landsgrensoverschrijdend net voor
      het transport van elektriciteit tot een door haar te bepalen omvang en voor een door haar te bepalen tijdsduur bij
      voorrang wordt bestemd voor door haar aan te geven verzoekers om capaciteit voor het transport van elektriciteit,
      indien die capaciteit uitsluitend is bestemd om op een transparante en niet-discriminatoire wijze, die bijdraagt
      aan een goede marktwerking op de elektriciteitsmarkt, te worden toegewezen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26
  - number: '26.2'
    text: |-
      Bij het nemen van het besluit, bedoeld in het eerste lid, kan de Autoriteit Consument en Markt voor het transport
      van elektriciteit voorwaarden goedkeuren en tarieven vaststellen die afwijken van het bepaalde bij of krachtens de
      [paragrafen 5][ref1] en [6][ref2] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009755
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '26.3'
    text: |-
      Het besluit, bedoeld in het eerste lid, mag niet het gevolg hebben dat de hoeveelheid capaciteit die de
      netbeheerder van het landelijk hoogspanningsnet reserveert om noodzakelijk transport van elektriciteit in het
      kader van onderlinge hulp en bijstand ten behoeve van de instandhouding van de integriteit van de netten te kunnen
      uitvoeren, wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26
  - number: '26.4'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26
  - number: 26a.1
    text: Een netbeheerder hanteert voorwaarden die redelijk, objectief en niet discriminerend zijn.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26a
  - number: 26a.2
    text: |-
      Voorwaarden als bedoeld in de [artikelen 236][ref1] en [237 van boek 6 van het Burgerlijk Wetboek][ref2] worden
      vermoed niet redelijk te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel236
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel237
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '236'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '237'
  - number: 26a.3
    text: |-
      Een voorwaarde is redelijk, wanneer dit blijkt uit de aard, inhoud of wijze van totstandkoming van de betrokken
      voorwaarde.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26a
  - number: 26a.4
    text: |-
      Het tweede en derde lid zijn niet van toepassing op een afnemer, bedoeld in [artikel 95a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 26a.5
    text: |-
      De [artikelen 236][ref1] en [237 van boek 6 van het Burgerlijk Wetboek][ref2] zijn mede van toepassing op
      voorwaarden in overeenkomsten met afnemers als bedoeld in [artikel 95a, eerste lid][ref3], die rechtspersoon zijn
      of handelen in de uitoefening van een beroep of bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel236
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel237
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '236'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '237'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 26aa
    text: |-
      Een afnemer als bedoeld in [artikel 95a, eerste lid][ref1], verleent de nodige medewerking aan de uitvoering van de
      taken, genoemd in [artikel 16, eerste lid, onderdelen n en o][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26aa
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 26ab.1
    text: |-
      Een netbeheerder verzamelt uitsluitend meetgegevens betreffende afnemers als bedoeld in
      [artikel 95a, eerste lid][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ab
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 26ab.1.a
    text: 'dit noodzakelijk is voor de taken van de leverancier met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ab
  - number: 26ab.1.a.1°
    text: |-
      het verstrekken van informatie inzake het verbruik van elektriciteit op grond van [artikel 95lb][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95lb
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ab
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95lb
        hoofdstuk: '8'
        paragraaf: 1ba
  - number: 26ab.1.a.2°
    text: facturering,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ab
  - number: 26ab.1.a.3°
    text: verhuizingen,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ab
  - number: 26ab.1.a.4°
    text: wisselingen van leverancier,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ab
  - number: 26ab.1.b
    text: |-
      dit noodzakelijk is voor de taken van de netbeheerder, genoemd in [artikel 16, eerste lid][ref1] of


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ab
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 26ab.1.c
    text: deze gegevens op basis van het tweede tot en met vijfde lid verstrekt worden.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ab
  - number: 26ab.2
    text: |-
      Een netbeheerder verleent een leverancier toegang tot meetgegevens betreffende afnemers als bedoeld in
      [artikel 95a, eerste lid][ref1], voor zover het gaat om meetgegevens betreffende afnemers van die leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ab
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 26ab.3
    text: |-
      In afwijking van het tweede lid verleent een netbeheerder een leverancier uitsluitend toegang tot meetgegevens die
      betrekking hebben op een kleiner tijdsbestek dan een dag, voor zover die leverancier de desbetreffende meetgegevens
      op basis van artikel 6, eerste lid, onderdeel a, van de Algemene verordening gegevensbescherming mag verwerken.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ab
  - number: 26ab.4
    text: |-
      Een netbeheerder verleent een derde uitsluitend toegang tot meetgegevens betreffende afnemers als bedoeld in
      [artikel 95a, eerste lid][ref1], voorzover die derde de desbetreffende meetgegevens op basis van artikel 6, eerste
      lid, onderdeel a, van de Algemene verordening gegevensbescherming mag verwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ab
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 26ab.5
    text: |-
      Meetgegevens per kwartier en per dag worden door de netbeheerder dagelijks om niet beschikbaar gesteld. Overige
      meetgegevens worden door de netbeheerder tegen een vergoeding van de daaraan verbonden kosten beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ab
  - number: 26ac.1
    text: |-
      Een netbeheerder brengt op verzoek van een leverancier wijzigingen aan in de besturings- en toepassingsprogramma’s
      van meetinrichtingen die ter beschikking zijn gesteld aan afnemers als bedoeld in [artikel 95a, eerste lid][ref1],
      van de betreffende leverancier, tenzij een meetinrichting door inwilliging van het verzoek niet langer zou voldoen
      aan de voor die meetinrichting geldende eisen of op andere wijze afbreuk gedaan zou worden aan de integriteit van
      de meetinrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ac
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 26ac.2
    text: |-
      Een netbeheerder leest meetgegevens van een afnemer als bedoeld in [artikel 95a, eerste lid][ref1], die beschikt
      over een geïnstalleerde meetinrichting die ten minste voldoet aan de krachtens [artikel 95la, eerste lid][ref2],
      gestelde eisen, niet op afstand uit indien de afnemer hierom verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95la
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ac
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95la
        hoofdstuk: '8'
        paragraaf: 1ba
  - number: 26ae.1
    text: |-
      Een netbeheerder heeft in het kader van het beheer van de netten in het voor hem krachtens [artikel 36][ref1]
      of [37][ref2] vastgestelde gebied tot taak ervoor zorg te dragen dat in een bij algemene maatregel van bestuur
      te bepalen periode, een bij algemene maatregel van bestuur te bepalen percentage afnemers als bedoeld in
      [artikel 95a, eerste lid][ref3], de beschikking krijgt over een geïnstalleerde meetinrichting die ten minste
      voldoet aan de krachtens [artikel 95la, eerste lid][ref4], gestelde eisen, tenzij die afnemer blijkens de
      voorwaarden, bedoeld in [artikel 31, eerste lid, onderdelen a of b][ref5], beschikt over een onbemeten aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel95la
      [ref5]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ae
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
      - id: ref4
        bwb_id: BWBR0009755
        artikel: 95la
        hoofdstuk: '8'
        paragraaf: 1ba
      - id: ref5
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 26ae.2
    text: |-
      In aanvulling op het eerste lid heeft een netbeheerder tot taak ervoor zorg te dragen dat een afnemer als bedoeld
      in [artikel 95a, eerste lid][ref1], binnen een redelijke termijn een meetinrichting ter beschikking wordt gesteld
      die ten minste voldoet aan de krachtens [artikel 95la][ref2] gestelde eisen, wanneer:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95la
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ae
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95la
        hoofdstuk: '8'
        paragraaf: 1ba
  - number: 26ae.2.a
    text: |-
      een bestaande meetinrichting wordt vervangen, tenzij dit technisch onmogelijk is of niet efficiënt is in verhouding
      tot de geraamde potentiële energiebesparingen op lange termijn;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ae
  - number: 26ae.2.b
    text: een nieuwe aansluiting wordt gemaakt in een nieuw gebouw;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ae
  - number: 26ae.2.c
    text: een gebouw ingrijpend wordt gerenoveerd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ae
  - number: 26ae.3
    text: |-
      Bij algemene maatregel van bestuur kunnen in aanvulling op het tweede lid andere situaties worden
      bepaald waarin een netbeheerder tot taak heeft ervoor zorg te dragen dat een afnemer als bedoeld in
      [artikel 95a, eerste lid][ref1], binnen een redelijke termijn een meetinrichting ter beschikking wordt gesteld die
      ten minste voldoet aan de krachtens artikel 95la, eerste lid, gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ae
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 26ae.4
    text: |-
      Een netbeheerder draagt er zorg voor dat een afnemer als bedoeld in [artikel 95a, eerste lid][ref1], op een
      eerder tijdstip dan het door de netbeheerder op grond van het eerste lid voorziene tijdstip, voor een of meer
      aansluitingen op verzoek van een natuurlijke persoon of rechtspersoon die daarbij belang heeft, binnen een
      redelijke termijn een meetinrichting ter beschikking wordt gesteld die ten minste voldoet aan de krachtens
      [artikel 95la][ref2], eerste lid, gestelde eisen, tenzij dit ertoe leidt dat de planning die de netbeheerder
      hanteert om te voldoen aan de in het eerste lid bedoelde verplichting, niet wordt gehaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95la
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ae
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95la
        hoofdstuk: '8'
        paragraaf: 1ba
  - number: 26ae.5
    text: |-
      Indien een meetinrichting door de netbeheerder ter beschikking is gesteld ingevolge het derde of vierde lid en
      de ter beschikking gestelde meetinrichting is geïnstalleerd, is de desbetreffende afnemer aan de desbetreffende
      netbeheerder een vergoeding verschuldigd in verband met de meerkosten.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ae
  - number: 26ae.6
    text: |-
      Bij ministeriële regeling wordt de hoogte van de vergoeding vastgesteld die voor verschillende situaties
      verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ae
  - number: 26ae.7
    text: |-
      Gedurende de in het eerste lid bedoelde periode kan een ander dan een netbeheerder op verzoek van een afnemer
      als bedoeld in [artikel 95a, eerste lid][ref1], er na voorafgaande melding aan de betreffende netbeheerder voor
      zorgdragen dat die afnemer voor een of meer aansluitingen beschikt over een geïnstalleerde meetinrichting die ten
      minste voldoet aan de krachtens [artikel 95la, eerste lid][ref2], gestelde eisen die gelden op het tijdstip van
      terbeschikkingstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95la
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ae
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95la
        hoofdstuk: '8'
        paragraaf: 1ba
  - number: 26ae.8
    text: |-
      Indien een ander dan een netbeheerder er zorg voor draagt dat een afnemer als bedoeld in
      [artikel 95a, eerste lid][ref1], beschikt over een meetinrichting die ten minste voldoet aan de krachtens
      [artikel 95la][ref2] gestelde eisen, betaalt de betreffende netbeheerder aan die ander een vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95la
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ae
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95la
        hoofdstuk: '8'
        paragraaf: 1ba
  - number: 26ae.9
    text: |-
      Bij ministeriële regeling wordt de hoogte van de vergoeding als bedoeld in het achtste lid vastgesteld, die voor
      verschillende situaties verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ae
  - number: 26ae.10
    text: |-
      Het is anderen dan de netbeheerder niet toegestaan bij afnemers als bedoeld in [artikel 95a, eerste lid][ref1],
      geïnstalleerde, op afstand uitleesbare meetinrichtingen te vervangen die geïnstalleerd zijn tussen 31 december 2005
      en het tijdstip waarop de in het eerste lid bedoelde periode aanvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ae
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 26ae.11
    text: |-
      Indien een meetinrichting als bedoeld in [artikel 95la, eerste lid][ref1], door de netbeheerder ter beschikking
      wordt gesteld, kan een afnemer als bedoeld in [artikel 95a, eerste lid][ref2], deze meetinrichting weigeren. In dat
      geval wordt door de netbeheerder een niet op afstand uitleesbare meetinrichting ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95la
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ae
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95la
        hoofdstuk: '8'
        paragraaf: 1ba
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 26ae.12
    text: |-
      In aanvulling op [artikel 30a][ref1] kan het tarief voor de meting van elektriciteit mede betrekking hebben op de
      mate waarin een netbeheerder voortgang boekt bij de uitvoering van de verplichting, bedoeld in het eerste lid, en
      alsdan verschillen per netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel30a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ae
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 30a
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 26ae.13
    text: |-
      Een netbeheerder zendt jaarlijks vóór 1 juni een rapportage aan Onze Minister en de Autoriteit Consument en Markt
      waarin hij aangeeft welke voortgang is geboekt met de uitvoering van de taak, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ae
  - number: 26ae.14
    text: |-
      Degene die een meetinrichting als bedoeld in [artikel 95la, eerste lid][ref1], ter beschikking stelt, informeert
      een afnemer als bedoeld in [artikel 95a, eerste lid][ref2], bij de installatie op niet-discriminatoire wijze over
      de mogelijkheden van de meetinrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95la
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ae
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95la
        hoofdstuk: '8'
        paragraaf: 1ba
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 26af
    text: |-
      Een op afstand uitleesbare meetinrichting, die aan een afnemer als bedoeld in [artikel 95a, eerste lid][ref1],
      ter beschikking is gesteld tussen 31 december 2005 en 1 januari 2012, wordt voor 15 jaren, te rekenen vanaf de
      datum van terbeschikkingstelling aan die afnemer, aangemerkt als een meetinrichting die voldoet aan de krachtens
      [artikel 95la, eerste lid][ref2], gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95la
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26af
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95la
        hoofdstuk: '8'
        paragraaf: 1ba
  - number: 26ah
    text: |-
      De [artikelen 26ab][ref1] en [26ac, eerste lid][ref2], zijn niet van toepassing met betrekking tot afnemers die
      niet beschikken over een op afstand uitleesbare meetinrichting of die beschikken over een op afstand uitleesbare
      meetinrichting die niet op afstand wordt uitgelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel26ab
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel26ac
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26ah
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 26ab
        hoofdstuk: '3'
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 26ac
        hoofdstuk: '3'
        paragraaf: 4a
  - number: 26b.1
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de tariefstructuren en voorwaarden als bedoeld
      in de [artikelen 27][ref1] en [31][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 26b.2
    text: De Autoriteit Consument en Markt brengt advies uit over het ontwerp van de in het eerste lid bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26b
  - number: 26b.3
    text: |-
      Een krachtens het eerste lid vast te stellen ministeriële regeling treedt niet eerder in werking dan vier weken
      nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd. Het ontwerp wordt vergezeld door het over de
      ministeriële regeling uitgebrachte advies van de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel26b
  - number: '27.1'
    text: |-
      Met inachtneming van de in [artikel 26b][ref1] bedoelde regels en hetgeen is gesteld bij of krachtens [verordening
      2019/943](32843R2019) zenden de gezamenlijke netbeheerders aan de Autoriteit Consument en Markt een voorstel met
      betrekking tot de door hen jegens afnemers te hanteren tariefstructuren dat de elementen en wijze van berekening
      beschrijft van het tarief waarvoor afnemers zullen worden aangesloten op een net, van het tarief waarvoor transport
      van elektriciteit, met inbegrip van de invoer, uitvoer en doorvoer van elektriciteit, ten behoeve van afnemers zal
      worden uitgevoerd, en de systeemdiensten worden verricht alsmede de energiebalans wordt gehandhaafd en het tarief
      voor meting van elektriciteit bij afnemers als bedoeld in [artikel 95a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel26b
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 26b
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: '27.2'
    text: 'In de tariefstructuren wordt in ieder geval opgenomen dat:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel27
  - number: 27.2.a
    text: |-
      een afnemer recht heeft op een aansluiting op het door hem gewenste spanningsniveau, tenzij dit om technische
      redenen redelijkerwijs niet van de netbeheerder kan worden verlangd;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel27
  - number: 27.2.b
    text: |-
      een afnemer recht heeft op een vergoeding van de netbeheerder, indien op zijn aansluiting een aansluiting ten
      behoeve van een derde wordt gemaakt;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel27
  - number: 27.2.c
    text: |-
      een afnemer die beschikt over een aansluiting met meerdere verbindingen aangesloten op één of meer spanningsniveaus
      die vallen binnen dezelfde tariefcategorie voor de berekening van het transportafhankelijk transporttarief wordt
      geacht te beschikken over één aansluiting;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel27
  - number: 27.2.d
    text: |-
      iedere afnemer recht heeft te worden aangesloten op het dichtstbijzijnde punt in het net met een bij zijn
      aansluiting behorend spanningsniveau, met dien verstande dat een afnemer die een aansluiting op het net wenst met
      een aansluitwaarde groter dan 10 MVA, wordt aangesloten op het dichtstbijzijnde punt in het net waar voldoende
      netcapaciteit beschikbaar is;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel27
  - number: 27.2.e
    text: |-
      aanpassingen in het net die verband houden met het maken van een aansluiting komen voor rekening van de
      netbeheerder die het betreffende net beheert;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel27
  - number: 27.2.f
    text: |-
      een afnemer, niet zijnde een afnemer die een aansluiting op het net wenst met een aansluitwaarde groter dan 10 MVA,
      recht heeft op een standaardaansluiting, waarbij de aansluitcapaciteit van deze aansluiting is gerelateerd aan de
      standaard gebruikte nominale aansluitspanning;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel27
  - number: 27.2.g
    text: het aansluittarief wordt gebaseerd op de grootte van de aansluitcapaciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel27
  - number: '27.3'
    text: |-
      De tarieven die de netbeheerder van het landelijk hoogspanningsnet in rekening brengt voor de handhaving van de
      energiebalans zijn objectief, transparant, niet-discriminatoir en weerspiegelen de kosten.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel27
  - number: '28.1'
    text: 'Het tarief waarvoor afnemers zullen worden aangesloten op een net heeft uitsluitend betrekking op:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel28
  - number: 28.1.a
    text: |-
      het verbreken van het net van de desbetreffende netbeheerder om een fysieke verbinding van de installatie van een
      afnemer met dat net tot stand te brengen,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel28
  - number: 28.1.b
    text: |-
      het installeren van voorzieningen om het net van de desbetreffende netbeheerder te beveiligen en beveiligd te
      houden en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel28
  - number: 28.1.c
    text: |-
      het tot stand brengen en in stand houden van een verbinding tussen de plaats waar het net verbroken is en de
      voorzieningen om het net te beveiligen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel28
  - number: '28.2'
    text: |-
      Het tarief, bedoeld in het eerste lid, wordt in rekening gebracht bij iedere afnemer die door een netbeheerder
      wordt aangesloten op een net dat wordt beheerd door een netbeheerder.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel28
  - number: '28.3'
    text: |-
      De tarieven voor de aansluiting van de afnemers die producent zijn, zijn objectief, transparant en niet-
      discriminatoir, waarbij rekening wordt gehouden met de kosten en baten van de onderscheiden technieken met
      betrekking tot duurzame energiebronnen, decentrale productie en warmtekrachtkoppeling.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel28
  - number: '29.1'
    text: |-
      Het tarief waarvoor transport van elektriciteit zal worden uitgevoerd heeft betrekking op de ontvangst en het
      invoeden van elektriciteit door afnemers, ongeacht de plaats van ontvangst of invoeding van de elektriciteit en
      ongeacht de plaats van de aansluiting waar de elektriciteit op het Nederlandse net is ontvangen of ingevoed en
      op systeemdiensten.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel29
  - number: '29.2'
    text: |-
      Het tarief, bedoeld in het eerste lid, wordt in rekening gebracht bij iedere afnemer die elektriciteit ontvangt op
      een aansluiting op een net dat wordt beheerd door een netbeheerder. Het tarief kan verschillen voor verschillende
      afnemers, afhankelijk van het spanningsniveau van het net waarop de afnemer is aangesloten. Bij algemene
      maatregel van bestuur kan worden bepaald dat het tarief tevens in rekening wordt gebracht bij iedere afnemer
      die elektriciteit invoedt op een net dat wordt beheerd door een netbeheerder. In dat geval kan het tarief tevens
      verschillen voor het ontvangen of het invoeden van elektriciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel29
  - number: '29.3'
    text: |-
      Het transporttarief wordt berekend per aansluiting. Voor de toepassing van het transporttarief wordt een streng van
      lichtmasten geacht te beschikken over één aansluiting.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel29
  - number: '29.4'
    text: |-
      In aanvulling op het bepaalde bij of krachtens het eerste, tweede en derde lid, kunnen bij algemene maatregel
      van bestuur regels worden gesteld met betrekking tot het tarief waarvoor transport van elektriciteit zal worden
      uitgevoerd ten behoeve van bij die maatregel aan te geven afnemers dan wel voor daarbij te omschrijven transport
      van elektriciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel29
  - number: '29.5'
    text: |-
      Het tarief, bedoeld in het eerste lid, dient mede ter dekking van de kosten die zijn verbonden aan verplichtingen
      die voor het tijdstip van intrekking van de Elektriciteitswet 1989 door de aangewezen vennootschap zijn aangegaan
      met betrekking tot de aanleg van een verbinding voor het transport van elektriciteit tussen Nederland en Noorwegen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel29
  - number: '29.6'
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel29
  - number: 30a
    text: |-
      Het tarief voor de meting van elektriciteit bij afnemers als bedoeld in [artikel 95a, eerste lid][ref1], heeft
      betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 30a.a
    text: het beheer van de meetinrichtingen;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel30a
  - number: 30a.b
    text: |-
      het verschaffen van toegang tot meetgegevens als bedoeld in [artikel 26ab, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel26ab
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 26ab
        hoofdstuk: '3'
        paragraaf: 4a
  - number: 30b.1
    text: |-
      Bij het verlenen van een ontheffing als bedoeld in [artikel 7a][ref1] kan worden bepaald dat een tarief, waarvoor
      een experiment zal worden uitgevoerd, in rekening wordt gebracht bij de afnemers die deelnemen aan het experiment
      waarvoor de ontheffing is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel7a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 7a
        hoofdstuk: '2'
  - number: 30b.2
    text: |-
      Het tarief, bedoeld in het eerste lid, kan verschillen voor de verschillende afnemers die deelnemen aan het
      experiment waarvoor de ontheffing is verleend.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel30b
  - number: 30c.1
    text: |-
      Bij het toekennen van een tijdelijke taak als bedoeld in [artikel 17a][ref1] kan worden bepaald dat een tarief,
      waarvoor die tijdelijke taak zal worden uitgevoerd, in rekening wordt gebracht bij de afnemers ten behoeve waarvan
      een netbeheerder de tijdelijke taak uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel17a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 17a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 30c.2
    text: |-
      Het tarief, bedoeld in het eerste lid, kan verschillen voor de verschillende afnemers ten behoeve waarvan een
      netbeheerder de tijdelijke taak uitvoert.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel30c
  - number: '31.1'
    text: |-
      Met inachtneming van de in [artikel 26b][ref1] bedoelde regels en hetgeen is gesteld bij of krachtens [verordening
      2019/943](32843R2019) zenden de gezamenlijke netbeheerders aan de Autoriteit Consument en Markt een voorstel voor
      de door hen jegens afnemers te hanteren voorwaarden met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel26b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 26b
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 31.1.a
    text: |-
      de wijze waarop netbeheerders en afnemers alsmede netbeheerders zich jegens elkaar gedragen ten aanzien van het
      in werking hebben van de netten, het voorzien van een aansluiting op het net en het uitvoeren van transport van
      elektriciteit over het net,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: 31.1.b
    text: |-
      de wijze waarop netbeheerders en afnemers alsmede netbeheerders zich jegens elkaar gedragen ten aanzien van het
      meten van gegevens betreffende het transport van elektriciteit;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: 31.1.c
    text: |-
      de wijze waarop de netbeheerder van het landelijk hoogspanningsnet enerzijds en afnemers en de overige
      netbeheerders anderzijds zich jegens elkaar gedragen ten aanzien van de systeemdiensten,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: 31.1.d
    text: de gebiedsindeling van de netbeheerders met uitzondering van de netbeheerder van het net op zee,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: 31.1.e
    text: |-
      de regeling van de samenwerking tussen de netbeheerders ten aanzien van de uitvoering van de taken, bedoeld in de
      onderdelen a, b en c, alsmede ten behoeve van het waarborgen van het netbeheer van alle netten en het transport van
      elektriciteit in buitengewone omstandigheden,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: 31.1.f
    text: |-
      de kwaliteitscriteria waaraan netbeheerders moeten voldoen met betrekking tot hun dienstverlening, welke in ieder
      geval betrekking hebben op te hanteren technische specificaties, het verhelpen van storingen in het transport van
      elektriciteit, de betalingsvoorwaarden, de klantenservice en het voorzien in compensatie bij ernstige storingen,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: 31.1.g
    text: |-
      de wijze waarop de netbeheerder van het landelijk hoogspanningsnet uitvoering geeft aan zijn taak de
      leveringszekerheid te waarborgen en de wijze waarop productiereservecapaciteit wordt aangehouden en ingezet,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: 31.1.h
    text: |-
      de wijze waarop de netbeheerder afnemers die producent zijn objectief, transparant en niet-discriminatoir op
      het net aansluit, rekening houdend met de kosten en baten van de onderscheiden technieken met betrekking tot
      hernieuwbare energiebronnen, decentrale productie en warmtekrachtkoppeling,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: 31.1.i
    text: |-
      de wijze waarop de netbeheerder van het landelijk hoogspanningsnet jegens de andere netbeheerders en de afnemers de
      energiebalans handhaaft,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: 31.1.j
    text: het realiseren van koppelingen tussen en het verrichten van reparaties aan de netten,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: 31.1.k
    text: |-
      de wijze waarop de netbeheerder van het landelijk hoogspanningsnet enerzijds en afnemers en de overige
      netbeheerders anderzijds zich jegens elkaar gedragen ten aanzien van het verstrekken van informatie die
      noodzakelijk is voor een goede uitvoering van hetgeen is gesteld bij of krachtens [verordening 2019/943]
      (32843R2019).
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: '31.2'
    text: |-
      In de voorwaarden, bedoeld in het eerste lid, onderdeel c, worden in ieder geval voorwaarden opgenomen met
      betrekking tot de programma-verantwoordelijkheid, waarbij wordt bepaald dat de programma-verantwoordelijkheid kan
      worden overgedragen aan een ander, met uitzondering van een netbeheerder.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: '31.3'
    text: |-
      In de voorwaarden, bedoeld in het eerste lid, onderdeel a, worden in ieder geval voorwaarden gesteld omtrent de
      eisen waaraan een bedrijf, dat de werkzaamheden bedoeld in [artikel 16c, eerste of vijfde lid][ref1], uitvoert,
      moet voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16c
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 16c
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '31.4'
    text: |-
      In de voorwaarden, bedoeld in het eerste lid, onderdeel a, kunnen voorwaarden worden gesteld omtrent het bepalen
      van de omvang van de capaciteit voor het transport van elektriciteit over het landsgrensoverschrijdend net en voor
      het toewijzen van de beschikbare capaciteit op dat net, waaronder tevens begrepen wordt het veilen van capaciteit
      dan wel het volgens een andere marktconforme methode toewijzen van capaciteit, en het toewijzen van capaciteit
      die een afnemer niet gebruikt. De voorwaarden kunnen de nodige voorzieningen bevatten gericht op het voorkomen van
      belemmeringen voor goede marktwerking.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: '31.5'
    text: |-
      De omvang van de capaciteit die toegewezen kan worden door middel van een veiling of een andere marktconforme
      methode is ten hoogste de totale omvang van de capaciteit voor het transport van elektriciteit over het
      landsgrensoverschrijdend net na aftrek van:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: 31.5.a
    text: |-
      de hoeveelheid capaciteit die de netbeheerder van het landelijk hoogspanningsnet reserveert om noodzakelijk
      transport van elektriciteit in het kader van onderlinge hulp en bijstand ten behoeve van de instandhouding van de
      integriteit van de netten te kunnen uitvoeren,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: 31.5.b
    text: |-
      de hoeveelheid capaciteit die de Autoriteit Consument en Markt op grond van [artikel 26][ref1] heeft bestemd voor
      bepaalde verzoekers om capaciteit voor het transport van elektriciteit, en


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel26
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 31.5.c
    text: |-
      de hoeveelheid capaciteit waarvoor Onze Minister ontheffing heeft verleend op grond van [artikel 86c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel86c
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 86c
        hoofdstuk: '6'
        paragraaf: '9'
  - number: '31.6'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet benut de opbrengst van het veilen of op een andere marktconforme
      methode toewijzen van capaciteit overeenkomstig de regeling, bedoeld in het vierde lid, voor het opheffen van
      beperkingen in de transportcapaciteit op het landsgrensoverschrijdende net dan wel voor andere, door de Autoriteit
      Consument en Markt te bepalen doelen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: '31.7'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet voert een afzonderlijke boekhouding met betrekking tot de
      opbrengst van het veilen of op een andere marktconforme methode toewijzen van capaciteit. [Artikel 43][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel43
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '31.8'
    text: |-
      De voorwaarden, bedoeld in het eerste lid, onderdeel g, kunnen mede betrekking hebben op de wijze waarop de
      netbeheerder van het landelijk hoogspanningsnet enerzijds en afnemers, leveranciers en de overige netbeheerders
      anderzijds zich jegens elkaar gedragen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: '31.9'
    text: |-
      Onze Minister kan, in aanvulling op de voorwaarden, bedoeld in het eerste lid, onderdeel b, en voorzover dit
      onderwerp geen regeling vindt in het bepaalde bij of krachtens [artikel 72m][ref1], nadere regels stellen over:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel72m
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 72m
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 31.9.a
    text: |-
      de vaststelling, bedoeld in [artikel 16, eerste lid, onderdeel h][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 31.9.b
    text: |-
      het meten, bedoeld in [artikel 16, eerste lid, onderdeel i][ref1], en [artikel 16a, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 16a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 31.9.c
    text: |-
      het verstrekken van meetgegevens aan anderen dan genoemd in [artikel 16a, tweede lid][ref1], met dien verstande dat
      meetgegevens slechts kunnen worden verstrekt aan leveranciers en handelaren met schriftelijke toestemming van de
      afnemer aan wie de meetgegevens toebehoren;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 16a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 31.9.d
    text: |-
      het uitgeven van certificaten voor klimaatneutrale elektriciteit en elektriciteit opgewekt door middel van
      warmtekrachtkoppeling en het beheer van een certificatenrekening onderscheidenlijk het uitgeven van garanties van
      oorsprong voor duurzame elektriciteit en garanties van oorsprong voor elektriciteit opgewekt in een installatie
      voor hoogrenderende warmtekrachtkoppeling en het beheer van een rekening;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: 31.9.e
    text: de kosten voor de uitvoering van de onderdelen a tot en met d.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: '31.10'
    text: |-
      De voorwaarden, bedoeld in het eerste lid, onderdeel f, bepalen dat een vordering tot betaling van een schuld van
      een afnemer ter zake van geleverde diensten als bedoeld in [artikel 27, eerste lid][ref1], wordt gedaan binnen twee
      jaren nadat de vordering opeisbaar is geworden en dat bij gebreke daarvan de vordering vervalt. De eerste volzin
      is niet van toepassing indien het uitblijven van bedoelde vordering, een onjuiste vordering daaronder begrepen, het
      rechtstreekse gevolg is van een daartoe gerichte opzettelijke gedraging van de afnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '31.11'
    text: |-
      Tot de voorwaarden bedoeld in het eerste lid, onderdeel g, behoren in elk geval door de netbeheerder van
      het landelijk hoogspanningsnet vast te stellen minimale voorschriften en verplichtingen inzake operationele
      netwerkveiligheid waarvan deel uitmaakt de vaststelling van het niveau van voorzienbare omstandigheden waarin de
      operationele netwerkveiligheid gehandhaafd moet blijven.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: '31.12'
    text: |-
      In de voorwaarden, bedoeld in het eerste lid, onderdelen a, f en g, kan worden vastgelegd op
      welke wijze netbeheerders uitvoering geven aan de regels over de storingsreserve, bedoeld in
      [artikel 16, vierde en vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '31.13'
    text: |-
      Het vijfde tot en met zevende lid vervallen op een bij koninklijk besluit te bepalen tijdstip, welk tijdstip kan
      verschillen voor de verschillende leden.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: '31.14'
    text: |-
      In de voorwaarden, bedoeld in het eerste lid, onderdeel a, worden regels gesteld omtrent de technische eisen
      waaraan een aansluiting van een gesloten distributiesysteem moet voldoen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31
  - number: 31b
    text: |-
      Bij ministeriële regeling worden, voor zover noodzakelijk ter uitvoering van de richtlijn, regels gesteld die de
      netbeheerder in acht moet nemen jegens afnemers als bedoeld in [artikel 95a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 31c.1
    text: |-
      Voor afnemers als bedoeld in [artikel 95a, eerste lid][ref1], die duurzame elektriciteit invoeden op het net,
      berekent de leverancier het verbruik ten behoeve van de facturering en inning van de leveringskosten door de aan
      het net onttrokken elektriciteit te verminderen met de op het net ingevoede elektriciteit, waarbij de vermindering
      maximaal de hoeveelheid aan het net onttrokken elektriciteit bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 31c.2
    text: |-
      Voor afnemers als bedoeld in [artikel 95a, eerste lid][ref1], die niet-duurzame elektriciteit invoeden op het net,
      berekent de leverancier het verbruik ten behoeve van de facturering en inning van de leveringskosten door de aan
      het net onttrokken elektriciteit te verminderen met de op het net ingevoede elektriciteit, met een maximum van 5000
      kWh aan op het net ingevoede elektriciteit, voor zover het saldo van de aan het net onttrokken minus de op het net
      ingevoede elektriciteit niet minder dan nul bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 31c.3
    text: |-
      Indien de door de afnemer, bedoeld in het eerste en tweede lid, op het net ingevoede hoeveelheid elektriciteit
      groter is dan de hoeveelheid die ingevolge die leden in mindering wordt gebracht op de aan het net onttrokken
      elektriciteit, betaalt de leverancier aan de betreffende afnemer voor het meerdere een redelijke vergoeding.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel31c
  - number: '32.1'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet, de netbeheerder van het net op zee of ten minste een derde van
      het aantal overige netbeheerders kan de gezamenlijke netbeheerders verzoeken een voorstel te doen tot wijziging
      van de tariefstructuren of de voorwaarden, bedoeld in de [artikelen 27][ref1] en [31][ref2], onder opgave van de
      redenen die naar zijn oordeel een dergelijke wijziging noodzakelijk maken.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '32.2'
    text: |-
      Indien naar haar oordeel wijziging van de tariefstructuren of de voorwaarden, bedoeld in de [artikelen 27][ref1]
      en [31][ref2], noodzakelijk is, zendt de Autoriteit Consument en Markt een ontwerp van een besluit tot wijziging
      van de tariefstructuren of de voorwaarden aan de gezamenlijke netbeheerders en de representatieve organisaties van
      partijen op de elektriciteitsmarkt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '32.3'
    text: |-
      In een voorstel of een ontwerp van een besluit tot wijziging van de tariefstructuren of de voorwaarden worden die
      onderdelen, bedoeld in [artikel 27][ref1] of [31][ref2], opgenomen waarvan wijziging wordt verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '33.1'
    text: |-
      De gezamenlijke netbeheerders voeren overleg met representatieve organisaties van partijen op de
      elektriciteitsmarkt over de voorstellen met betrekking tot de tariefstructuren en de voorwaarden, bedoeld in de
      [artikelen 27][ref1], [31][ref2] en [32, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel32
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '33.2'
    text: |-
      In de voorstellen die aan de Autoriteit Consument en Markt worden gezonden, geven de gezamenlijke netbeheerders aan
      welke gevolgtrekkingen zij hebben verbonden aan de zienswijzen die de organisaties, bedoeld in het eerste lid, naar
      voren hebben gebracht.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel33
  - number: '33.3'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet voert overleg met de netbeheerders in andere landen waarmee
      een landgrensoverschrijdend net tot stand is gebracht over de voorschriften en verplichtingen inzake operationele
      netwerkveiligheid als bedoeld in [artikel 31, elfde lid][ref1], voordat hij die voorschriften en verplichtingen
      vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '34.1'
    text: |-
      De gezamenlijke netbeheerders zenden een voorstel met betrekking tot de wijziging van de tariefstructuren of de
      voorwaarden aan de Autoriteit Consument en Markt binnen twaalf weken na het tijdstip waarop een verzoek als bedoeld
      in [artikel 32, eerste lid][ref1], wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel32
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '34.2'
    text: |-
      De gezamenlijke netbeheerders en representatieve organisaties van partijen op de elektriciteitsmarkt kunnen hun
      zienswijze op een ontwerp van een besluit tot wijziging van de tariefstructuren of de voorwaarden aan de Autoriteit
      Consument en Markt kenbaar maken binnen twaalf weken na het tijdstip waarop het ontwerp van het besluit op grond
      van [artikel 32, tweede lid][ref1], aan hen is gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel32
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '36.1'
    text: 'De Autoriteit Consument en Markt stelt de tariefstructuren en voorwaarden vast met inachtneming van:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel36
  - number: 36.1.a
    text: |-
      het voorstel van de gezamenlijke netbeheerders als bedoeld in [artikel 27][ref1], [31][ref2] of [32][ref3] en de
      resultaten van het overleg, bedoeld in [artikel 33, eerste lid][ref4],


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel33
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel36
