  - number: '5'
    text: |-
      1 De Autoriteit Consument en Markt is belast met de aan haar opgedragen taken ter uitvoering van het bepaalde bij
      of krachtens deze wet, [verordening 2019/943](32843R2019), [verordening 2019/942](32842R2019)[verordening 2019/941]
      (32841R2019) en [verordening 1227/2011](32011R1227), alsmede met het toezicht op de naleving van het bepaalde
      bij of krachtens deze wet, [verordening 2019/943](32843R2019), [verordening 2019/942](32842R2019) en verordening
      1227/2011.

      2 De Autoriteit Consument en Markt is de regulerende instantie, bedoeld in artikel 35, eerste lid, van de
      richtlijn, artikel 2, onder 12, van [verordening 2019/941](32841R2019) en en artikel 2, onder 2, van [verordening
      2019/943](32843R2019).

      3 De Autoriteit Consument en Markt houdt bij de uitoefening van de haar op grond van deze wet toegekende taken en
      bevoegdheden rekening met artikel 36 van de richtlijn.

      4 De Autoriteit Consument en Markt werkt, onder meer teneinde de nationale markten op één of meer geografische
      gebieden als bedoeld in artikel 34, derde lid, van [verordening 2019/943](32843R2019) te integreren en samenwerking
      tussen de netbeheerder van het landelijk hoogspanningnet en buitenlandse instellingen die op grond van nationale
      wettelijke regels zijn belast met het beheer van een transmissiesysteem als bedoeld in artikel 2, onderdeel 4, van
      de richtlijn in deze gebieden aan te moedigen, samen met:

      a. instellingen in andere lidstaten van de Europese Unie die op grond van nationale wettelijke regels zijn belast
      met de toepassing van de regels op het gebied van elektriciteit;

      b. Acer.

      5 De Autoriteit Consument en Markt draagt bij aan de compatibiliteit van gegevensuitwisselingsprocessen voor
      de belangrijkste marktprocessen in één of meer geografische gebieden als bedoeld in artikel 34, derde lid, van
      [verordening 2019/943](32843R2019).

      6 De Autoriteit Consument en Markt beslist over de goedkeuring van de door de netbeheerder van het landelijk
      hoogspanningsnet gehanteerde congestiebeheersprocedures voor landsgrensoverschrijdende netten.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel5
  - number: 5a
    text: |-
      De Autoriteit Consument en Markt kan een bindende gedragslijn opleggen in verband met de naleving van het bepaalde
      bij of krachtens deze wet, [verordening 2019/943](32843R2019), [verordening 2019/942](32842R2019) en verordening
      1227/2011.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel5a
  - number: 5b
    text: |-
      De Autoriteit Consument en Markt volgt nauwlettend in welke mate de elektriciteitsmarkt aan de doelstellingen,
      bedoeld in artikel 36 van de richtlijn, voldoet. Tevens volgt zij:

      a. de samenhang tussen de voorgenomen investeringen, bedoeld in [artikel 21][ref1], van de netbeheerder van het
      landelijk hoogspanningnet en van de netbeheerder van het net op zee en de netontwikkelingsplannen als bedoeld in
      artikel 30, eerste lid, onderdeel b, van [verordening 2019/943](32843R2019);

      b. het niveau van transparantie, met inbegrip van de groothandelsprijzen;

      c. het niveau en de doeltreffendheid van openstelling van de markt en de mededinging op groot- en
      kleinverbruikersniveau;

      d. het bestaan van praktijken gericht op het aangaan van overeenkomsten die afnemers, niet zijnde afnemers als
      bedoeld in [artikel 95a, eerste lid][ref2], kunnen weerhouden van of hen beperkingen kunnen opleggen met betrekking
      tot een keuze voor het gelijktijdig sluiten van overeenkomsten met meer dan een leverancier;

      e. de investeringen in productiecapaciteit met het oog op de continuïteit van de voorziening;

      f. de technische samenwerking tussen de netbeheerder van het landelijk hoogspanningsnet en buitenlandse
      instellingen die op grond van nationale wettelijke regels zijn belast met het beheer van een transmissiesysteem als
      bedoeld in artikel 2, onderdeel 4, van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
