      1 De Autoriteit Consument en Markt verrekent de kosten van een investering waarvoor een projectbesluit als bedoeld
      in [afdeling 5.2 van de Omgevingswet][ref1] is genomen, in de tarieven.

      2 De Autoriteit Consument en Markt verrekent de kosten van investeringen voor de ontsluiting van windparken, die
      zijn opgenomen in een programma als bedoeld in [afdeling 3.2 van de Omgevingswet][ref2], in de tarieven.

      3 De Autoriteit Consument en Markt verrekent de kosten van investeringen ter uitvoering van het ontwikkelkader,
      bedoeld in [artikel 16e, eerste lid][ref3], in de toegestane inkomsten van de netbeheerder van het net op zee.


