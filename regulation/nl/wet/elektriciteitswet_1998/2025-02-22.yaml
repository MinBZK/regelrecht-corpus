    text: |-
      1 Van de [artikelen 95b][ref1] en [95m, eerste, tweede en vijfde tot en met negende lid][ref2], kan worden
      afgeweken indien er sprake is van een overeenkomst tot levering van elektriciteit aan een groep afnemers, waarbij:

      a. de meerderheid van deze afnemers rechtspersoon is of handelt in de uitoefening van een beroep of bedrijf;

      b. alle afnemers in de overeenkomst vertegenwoordigd worden, en

      c. deze vertegenwoordiger er zorg voor draagt dat hij ten aanzien van alle aansluitingen met een doorlaatwaarde van
      ten hoogste 3 * 80 A over toestemming tot vertegenwoordiging in het kader van de overeenkomst beschikt.


