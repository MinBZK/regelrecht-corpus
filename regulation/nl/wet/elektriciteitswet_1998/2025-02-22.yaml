  - number: 15.6.a
    text: |-
      [artikel 23, eerste lid][ref1], uitsluitend geldt voor zover er na aansluiting sprake is van een afnemer binnen het
      geografisch gebied waarbinnen het gesloten distributiesysteem ligt en deze aansluiting past bij het karakter van
      het gesloten distributiesysteem,


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel23
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 15.6.b
    text: |-
      niet aan de verplichtingen, bedoeld in de in [artikelen 23, eerste lid][ref1], en [24, eerste lid][ref2], genoemde
      paragrafen behoeft te worden voldaan en


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel24
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel15
