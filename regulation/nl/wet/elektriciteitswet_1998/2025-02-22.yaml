      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel77
