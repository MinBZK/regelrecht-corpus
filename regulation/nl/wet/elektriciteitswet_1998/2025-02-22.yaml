  - number: 77i.2
    text: |-
      De bestuurlijke boete die ingevolge het eerste lid, onderdelen a en b, ten hoogste kan worden opgelegd wordt
      verhoogd met 100%, indien binnen een tijdvak van vijf jaar voorafgaand aan de dagtekening van het van de
      overtreding opgemaakte rapport, bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref1], een
      aan die overtreder voor een eerdere overtreding van eenzelfde of een soortgelijk wettelijk voorschrift opgelegde
      bestuurlijke boete onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel77i
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '78.1'
    text: |-
      Onze Minister kan verlangen dat een producent, een leverancier, een handelaar, een netbeheerder, een
      elektriciteits- of gasbeurs of een afnemer hem inzage geeft in gegevens en bescheiden, onderscheidenlijk gegevens
      en inlichtingen verstrekt die hij nodig heeft voor de uitvoering van de hem in deze wet, [verordening 2019/941]
      (32841R2019) en [verordening 2019/943](32843R2019) opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel78
  - number: '78.2'
    text: |-
      Degene aan wie een verzoek is gedaan inzage te geven in gegevens en bescheiden, onderscheidenlijk gegevens en
      inlichtingen te verstrekken, is verplicht binnen de door Onze Minister gestelde redelijke termijn alle medewerking
      te verlenen die deze redelijkerwijze kan vorderen bij de uitoefening van zijn bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel78
  - number: '78.3'
    text: |-
      Onze Minister gebruikt bescheiden, gegevens of inlichtingen over een producent, een leverancier, een handelaar,
      een netbeheerder, een elektriciteits- of gasbeurs of een afnemer, welke hij heeft verkregen in verband met enige
      werkzaamheid ten behoeve van de uitvoering van een van zijn taken op grond van deze wet, [verordening 2019/941]
      (32841R2019) of [verordening 2019/943](32843R2019), uitsluitend voor de toepassing van deze wet, [verordening
      2019/941](32841R2019) of [verordening 2019/943](32843R2019).
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel78
  - number: '78.4'
    text: |-
      Indien Onze Minister op grond van [artikel 16, tweede lid, onderdeel f][ref1], de netbeheerder van het landelijk
      hoogspanningsnet opdraagt werkzaamheden te verrichten ter uitvoering van [artikel 4a][ref2] of [verordening
      2019/941](32841R2019), zijn het eerste tot en met het derde lid van overeenkomstige toepassing op die netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel4a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 4a
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '79.1'
    text: |-
      Een netbeheerder die bij de uitvoering van zijn taak de beschikking krijgt over gegevens waarvan hij het
      vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, draagt er zorg voor dat die gegevens niet ter
      beschikking komen of kunnen komen van derden, tenzij enig wettelijk voorschrift anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel79
  - number: '79.2'
    text: |-
      Indien een netbeheerder gegevens over zijn bedrijfsvoering die commercieel voordeel kunnen opleveren ter
      beschikking stelt aan anderen, doet hij dit op niet-discriminatoire wijze.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel79
  - number: '79.3'
    text: |-
      Een netbeheerder maakt alle informatie openbaar die bijdraagt aan een doeltreffende mededinging en een efficiënte
      werking van de markt, voor zover deze redelijkerwijs te genereren is uit de informatie waarover hij beschikt op
      basis van de uitvoering van de op grond van deze wet aan hem toegekende taken.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel79
  - number: '81'
    text: |-
      De voordracht voor een krachtens [artikel 29][ref1], [84][ref2] of [85][ref3] vast te stellen algemene maatregel
      van bestuur en voor een wijziging van een krachtens [artikel 20][ref4] vast te stellen algemene maatregel
      van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel85
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel20
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '84'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '85'
        hoofdstuk: '6'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0009755
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '82'
    text: |-
      Een representatieve organisatie van partijen op de elektriciteitsmarkt wordt geacht belanghebbende te zijn bij een
      besluit, niet zijnde een beschikking, genomen op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel82
  - number: '83'
    text: |-
      Provinciale staten en de gemeenteraad zijn niet bevoegd het opwekken, het transporteren en het leveren van
      elektriciteit in het belang van de energievoorziening aan regels te binden.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel83
  - number: '84'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter uitvoering van een besluit op grond van het Verdrag betreffende de
      werking van de Europese Unie regels worden gesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel84
  - number: 84.a
    text: |-
      de tarieven en voorwaarden die interconnector-beheerders berekenen onderscheidenlijk in acht nemen bij het
      uitvoeren van transport van elektriciteit met behulp van een landsgrensoverschrijdend net;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel84
  - number: 84.b
    text: |-
      de voorwaarden die door een netbeheerder of een leverancier in het belang van de veiligheid en de doelmatigheid
      worden gesteld voor het leveren van elektriciteit of voor het aansluiten van toestellen of installaties die
      elektriciteit verbruiken.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel84
  - number: '85.1'
    text: |-
      Overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen regels is een door Onze Minister vast te
      stellen vergoeding verschuldigd voor het verlenen van instemming als bedoeld in [artikel 12, tweede lid][ref1], van
      een aanwijzing als bedoeld in [artikel 13][ref2], van een ontheffing als bedoeld in [artikel 86c][ref3], dan wel
      van een vergunning als bedoeld in [artikel 95d][ref4], welke vergoeding verschuldigd is voor ten hoogste de kosten
      van de bemoeiingen met betrekking tot de instemming, de aanwijzing, de ontheffing dan wel de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel86c
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel95d
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 86c
        hoofdstuk: '6'
        paragraaf: '9'
      - id: ref4
        bwb_id: BWBR0009755
        artikel: 95d
        hoofdstuk: '8'
        paragraaf: 1a
  - number: '85.2'
    text: |-
      Onze Minister kan het verschuldigde bedrag invorderen bij dwangbevel. Ten aanzien van de in het eerste lid
      bedoelde vergoedingen is, voor zover al niet van toepassing, [titel 4.4][ref1], met uitzondering van de
      [artikelen 4:85][ref2] en [4:95, van de Algemene wet bestuursrecht][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '86.1'
    text: |-
      Een producent of een leverancier voert een afzonderlijke boekhouding voor de productie van elektriciteit met
      behulp van zijn installaties onderscheidenlijk de levering van elektriciteit aan afnemers. Indien de producent
      of leverancier andere activiteiten verricht dan die welke verband houden met de productie of de levering van
      elektriciteit, voert hij daarvoor eveneens, al dan niet op geconsolideerde basis, een afzonderlijke boekhouding.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86
  - number: '86.2'
    text: |-
      [Artikel 43, tweede tot en met zevende lid][ref1], is van overeenkomstige toepassing op de boekhouding en de
      jaarrekening van de producent of leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel43
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '86.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op leveranciers die anders dan bedrijfsmatig elektriciteit
      leveren.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86
  - number: '86.4'
    text: |-
      Een leverancier houdt de boekhouding, bedoeld in het eerste lid, gedurende vijf jaar ter beschikking van de
      Autoriteit Consument en Markt en de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86
  - number: '86.5'
    text: |-
      De Autoriteit Consument en Markt kan informatie uit de boekhouding van de leverancier ter beschikking te stellen
      aan marktpartijen indien is voldaan aan artikel 40, derde lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86
  - number: 86a.1
    text: Op overeenkomsten tot transport of levering van elektriciteit is Nederlands recht van toepassing.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86a
  - number: 86a.2
    text: |-
      De Nederlandse rechter is bij uitsluiting bevoegd kennis te nemen van geschillen over overeenkomsten tot transport
      of levering van elektriciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86a
  - number: 86a.3
    text: |-
      Een beding dat in strijd met het eerste of tweede lid in een overeenkomst tot het transport of de levering van
      elektriciteit is opgenomen, is nietig.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86a
  - number: 86a.4
    text: |-
      Het eerste tot en met derde lid is niet van toepassing op een overeenkomst voor levering van elektriciteit die een
      leverancier of handelaar sluit met een persoon die beschikt over een aansluiting op een net met een totale maximale
      doorlaatwaarde van meer dan 3*80 A en een beschikbaar vermogen van ten minste 2 MVA per aansluiting.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86a
  - number: 86a.5
    text: De toepasselijkheid van dit artikel wordt beperkt door dwingende bepalingen van internationaal recht.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86a
  - number: 86b
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent het vaststellen of sprake is van een productie-
      installatie voor klimaatneutrale elektriciteit en of de inrichting om te meten geschikt is voor de meting van
      de klimaatneutrale elektriciteit die met een dergelijke productie-installatie wordt opgewekt en op het net wordt
      ingevoed.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86b
  - number: 86c.1
    text: |-
      Onze Minister beslist op een verzoek om een ontheffing als bedoeld in artikel 63 van [verordening 2019/943]
      (32843R2019). De Autoriteit Consument en Markt of, in voorkomend geval, Acer brengt advies aan Onze Minister uit
      over door hem te nemen besluiten als bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86c
  - number: 86c.2
    text: |-
      Op een landsgrensoverschrijdend net dat bij de ingebruikname daarvan over een ontheffing als bedoeld in het eerste
      lid beschikt, is [artikel 93][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel93
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '93'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: 86ca
    text: |-
      Indien ingevolge artikel 6, tiende lid, van [verordening 2019/942](32842R2019) Acer bevoegd is een besluit te nemen
      over grensoverschrijdende infrastructuur, is de Autoriteit Consument en Markt hiertoe niet bevoegd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86ca
  - number: 86d
    text: |-
      Indien dat noodzakelijk is in het belang van een voldoende transparante en liquide markt voor vraag en aanbod
      van elektriciteit, transportcapaciteit of productiecapaciteit of in het belang van de daarmee verband houdende
      leveringszekerheid, zullen bij of krachtens algemene maatregel van bestuur regels worden gesteld over:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86d
  - number: 86d.a
    text: |-
      de wijze waarop of de voorwaarden waaronder producenten, handelaren, leveranciers of netbeheerders elektriciteit,
      transportcapaciteit of productiecapaciteit waarover zij beschikken, aanbieden;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86d
  - number: 86d.b
    text: |-
      de informatie die producenten, handelaren, leveranciers of netbeheerders verstrekken met betrekking tot de vraag en
      aanbod van elektriciteit, transportcapaciteit of productiecapaciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86d
  - number: 86e.1
    text: |-
      Onze Minister wijst een of meer rechtspersonen aan die tot taak hebben een beurs tot stand te brengen en in stand
      te houden. Onze Minister kan regels stellen in verband met de procedure voor aanwijzing van een beurs. Aan een
      aanwijzing kunnen voorschriften en beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86e
  - number: 86e.2
    text: |-
      Een rechtspersoon, bedoeld in het eerste lid, stelt een beursreglement op. Het beursreglement behoeft de
      goedkeuring van Onze Minister. Van het besluit tot goedkeuring wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86e
  - number: 86e.3
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet is verplicht aan de rechtspersoon, bedoeld in het eerste lid,
      en aan de door deze rechtspersoon ingeschakelde derden, voor zover het betreft de afhandeling van de op de beurs
      op tot stand gekomen overeenkomsten, de gevraagde medewerking te verlenen, voor zover deze medewerking noodzakelijk
      is voor een goede uitvoering van de aan deze rechtspersoon opgelegde taak. Onze Minister kan nadere regels stellen
      over de door de netbeheerder van het landelijk hoogspanningsnet te verlenen medewerking.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86e
  - number: 86e.4
    text: |-
      De rechtspersoon, bedoeld in het eerste lid, die bij de uitvoering van zijn taak de beschikking krijgt over
      gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, is verplicht tot
      geheimhouding van die gegevens, behoudens voor zover de artikelen van deze wet hem tot mededeling verplichten of
      uit zijn taak de noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86e
  - number: 86e.5
    text: |-
      Producenten, leveranciers, handelaren, afnemers en aandeelhouders onthouden zich van elke bemoeiing met de
      uitvoering van de taak die is opgedragen aan de rechtspersoon, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86e
  - number: 86f.1
    text: |-
      Iedere wijziging met betrekking tot zeggenschap als bedoeld in [artikel 26 van de Mededingingswet][ref1] in
      een productie-installatie met een nominaal elektrisch vermogen van meer dan 250 MW of een onderneming die een
      productie-installatie met een nominaal elektrisch vermogen van meer dan 250 MW beheert, wordt door één van de bij
      deze wijziging betrokken partijen gemeld aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel26
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86f
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '26'
  - number: 86f.2
    text: |-
      Onze Minister kan op grond van overwegingen van openbare veiligheid, voorzieningszekerheid of leveringszekerheid de
      wijziging, bedoeld in het eerste lid, verbieden of voorschriften hieraan verbinden.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86f
  - number: 86f.3
    text: Rechtshandelingen verricht in strijd met het eerste lid zijn door een rechterlijke uitspraak vernietigbaar.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86f
  - number: 86f.4
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot de melding, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86f
  - number: 86g.1
    text: Iedere producent en verbruiker van elektriciteit heeft daadwerkelijke keuzevrijheid van leverancier.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86g
  - number: 86g.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op eenieder die voornemens is elektriciteit te produceren of te
      gebruiken en die verzoekt om een aansluiting op een net
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86g
  - number: 86h.1
    text: |-
      De Autoriteit Consument en Markt verwerkt een registratie als bedoeld in artikel 9, eerste lid, van verordening
      1227/2011 zo spoedig mogelijk.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86h
  - number: 86h.2
    text: Bij ministeriële regeling kunnen regels worden gesteld over de registratie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86h
  - number: 86i.1
    text: Het is verboden te handelen in strijd met de artikelen 3, 4 en 5 van verordening 1227/2011.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86i
  - number: 86i.2
    text: Overtreding van het eerste lid is een misdrijf.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel86i
  - number: '91'
    text: |-
      Bij de toepassing van [artikel 30, tweede lid][ref1], zoals dat luidde voor 1 juli 2011 geldt dat het tarief,
      bedoeld in artikel 30, eerste lid, uitsluitend in rekening wordt gebracht of kon worden gebracht indien op dezelfde
      aansluiting sprake was van verbruik van elektriciteit en een aansluiting op een net dat wordt beheerd door een
      netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel30
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '93.1'
    text: |-
      Indien zich in de periode tussen 1 juli 1996 en de datum van de aanwijzing van de netbeheerder, bedoeld in
      [artikel 10][ref1], een wijziging heeft voorgedaan met betrekking tot de eigendom van het desbetreffende net
      of van de aandelen in een rechtspersoon aan wie het desbetreffende net toebehoort, is voor de aanwijzing van de
      netbeheerder vereist dat Onze Minister geen bedenkingen heeft tegen die wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '93.2'
    text: |-
      De eigendom van een net of rechten op een net berusten direct of indirect bij de staat, provincies, gemeenten of
      andere openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel93
  - number: '93.3'
    text: |-
      De aandelen van een netbeheerder berusten direct of indirect bij de staat, provincies, gemeenten of andere openbare
      lichamen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel93
  - number: '93.4'
    text: |-
      Onder indirect berusten als bedoeld in het tweede en derde lid wordt verstaan dat de eigendom van een net of
      rechten op een net, dan wel aandelen in een netbeheerder, berusten bij een of meer rechtspersonen waarvan alle
      aandelen worden gehouden door de staat, provincies, gemeenten of andere openbare lichamen of bij een rechtspersoon
      die een volledige dochtermaatschappij is van een of meer rechtspersonen waarvan alle aandelen worden gehouden door
      de staat, provincies, gemeenten of andere openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel93
  - number: 93a
    text: De aandelen van de netbeheerder van het landelijk hoogspanningsnet berusten direct of indirect bij de staat.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel93a
  - number: '94.1'
    text: |-
      In afwijking van [artikel 93a][ref1] kunnen aandelen in de netbeheerder van het landelijk hoogspanningsnet direct
      of indirect berusten bij een buitenlandse instelling die op grond van nationale wettelijke regels is belast met het
      beheer van een transmissiesysteem als bedoeld in artikel 2, onderdeel 4, van de richtlijn, of bij de middellijk of
      onmiddellijk aandeelhouder van die buitenlandse instelling, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel93a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 93a
        hoofdstuk: '8'
        paragraaf: '1'
  - number: 94.1.a
    text: |-
      ten minste 75 procent van de aandelen in de netbeheerder en de overwegende zeggenschap over de netbeheerder direct
      of indirect bij de staat blijft,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel94
  - number: 94.1.b
    text: de samenwerking tussen de netbeheerder en een buitenlandse instelling wordt bevorderd,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel94
  - number: 94.1.c
    text: |-
      er sprake is van een aandelenruil die de betrouwbaarheid, betaalbaarheid of duurzaamheid van het net ten goede
      komt en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel94
  - number: 94.1.d
    text: |-
      de aandelen in de netbeheerder of de groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1]
      waar die netbeheerder deel van uitmaakt, komen te berusten bij een instelling die de beheerder is van een net
      dat een directe verbinding heeft met het landelijke hoogspanningsnet in Nederland of dat door middel van een
      landsgrensoverschrijdend net met het landelijke hoogspanningsnet is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: '94.2'
    text: |-
      Het voornemen de aandelen in de netbeheerder direct of indirect te laten berusten bij een buitenlandse instelling
      of bij de middellijk of onmiddellijk aandeelhouder van die buitenlandse instelling behoeft instemming van beide
      kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel94
  - number: '94.3'
    text: |-
      Onze Minister van Financiën treedt niet eerder in onderhandeling dan dertig dagen nadat hij schriftelijk mededeling
      heeft gedaan aan de Staten-Generaal van het voornemen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel94
  - number: 95a.1
    text: |-
      Het is verboden zonder vergunning elektriciteit te leveren aan afnemers die beschikken over een aansluiting op een
      net met een totale maximale doorlaatwaarde van ten hoogste 3*80 A.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95a
  - number: 95a.2
    text: 'Het verbod geldt niet ten aanzien van het leveren van elektriciteit:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95a
  - number: 95a.2.a
    text: |-
      indien de elektriciteit is opgewekt met een installatie die voor rekening en risico van de afnemer, alleen of, voor
      een evenredig deel, tezamen met andere afnemers, in werking wordt gehouden en de afnemer de geleverde elektriciteit
      verbruikt;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95a
  - number: 95a.2.b
    text: |-
      door een buiten Nederland gevestigde leverancier van elektriciteit aan ten hoogste 500 afnemers, bedoeld in het
      eerste lid, die wonen in gebieden aan de Nederlandse landsgrens;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95a
  - number: 95a.2.c
    text: |-
      indien de afnemer aan dezelfde rechtspersoon toebehoort als de producent die de elektriciteit heeft opgewekt dan
      wel een dochtermaatschappij daarvan in de zin van [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref1] en de
      afnemer de geleverde elektriciteit verbruikt, of


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24a
  - number: 95a.2.d
    text: |-
      indien de elektriciteit anders dan bedrijfsmatig wordt geleverd overeenkomstig bij ministeriële regeling te stellen
      regels;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95a
  - number: 95a.2.e
    text: |-
      indien de elektriciteit wordt geleverd in het kader van een overeenkomst als bedoeld in [artikel 95n][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95n
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95n
        hoofdstuk: '8'
        paragraaf: 1c
  - number: 95b.1
    text: |-
      Een houder van een vergunning heeft de plicht op een betrouwbare wijze en tegen redelijke tarieven en voorwaarden
      zorg te dragen voor de levering van elektriciteit aan iedere in [artikel 95a, eerste lid][ref1], bedoelde afnemer
      die daarom verzoekt. De voorwaarden zijn in ieder geval niet redelijk als zij niet in overeenstemming zijn met het
      bepaalde bij of krachtens [artikel 95m][ref2]. [Artikel 26a, vijfde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95m
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel26a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95m
        hoofdstuk: '8'
        paragraaf: 1c
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 26a
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 95b.2
    text: |-
      Een houder van een vergunning verschaft de Autoriteit Consument en Markt ieder jaar en vier weken voor de wijziging
      van de tarieven een opgave van de tarieven die hij berekent en de voorwaarden die hij gebruikt bij de levering van
      elektriciteit aan de in [artikel 95a, eerste lid][ref1], bedoelde afnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95b.3
    text: |-
      Indien de Autoriteit Consument en Markt van oordeel is dat de tarieven die houders van een vergunning berekenen
      onredelijk zijn, omdat daarin de effecten van een doelmatige bedrijfsvoering, die mede inhoudt de inkoop van
      elektriciteit en van energiebronnen bestemd voor opwekking daarvan, in onvoldoende mate leiden tot kostenverlaging,
      kan zij een tarief vaststellen dat leveranciers ten hoogste mogen berekenen voor de levering van elektriciteit aan
      afnemers als bedoeld in [artikel 95a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95b.4
    text: |-
      Na de vaststelling van het maximumtarief, bedoeld in het derde lid, worden de tarieven voor de levering van
      elektriciteit aan afnemers als bedoeld in [artikel 95a, eerste lid][ref1] die hoger zijn dan dat maximumtarief, van
      rechtswege gesteld op dat maximumtarief.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95b.5
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de bepaling of de
      tarieven, bedoeld in het tweede lid, onredelijk zijn en tot vaststelling van het maximumtarief, bedoeld in het
      derde lid. De voordracht voor een krachtens dit lid vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95b
  - number: 95b.6
    text: |-
      Het tweede tot en met het zesde lid vervallen op een bij koninklijk besluit te bepalen tijdstip. De voordracht voor
      een krachtens dit lid vast te stellen koninklijk besluit wordt niet eerder gedaan dan vier weken nadat het ontwerp
      aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95b
  - number: 95b.7
    text: |-
      Een netbeheerder en een vergunninghouder voeren een beleid, gericht op het voorkomen van het afsluiten van een
      afnemer als bedoeld in [artikel 95a, eerste lid][ref1], in het bijzonder in de periode van 1 oktober tot 1 april
      van enig jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95b.8
    text: |-
      Bij ministeriële regeling worden regels gesteld over het beëindigen van de levering van elektriciteit aan een
      afnemer als bedoeld in [artikel 95a, eerste lid][ref1], alsmede over preventieve maatregelen om de afsluiting van
      dergelijke afnemers zoveel mogelijk te voorkomen. Deze regels houden in ieder geval in dat een afnemer niet wordt
      afgesloten in de periode van 1 oktober tot 1 april van enig jaar, behoudens in gevallen die in de regeling zijn
      aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95b.9
    text: |-
      De in het achtste lid bedoelde preventieve maatregelen kunnen tevens inhouden dat in daarbij omschreven gevallen
      met in die regeling aangeduide instanties overleg wordt gepleegd alsmede dat in die gevallen aan de desbetreffende
      instantie in die regeling omschreven gegevens omtrent de afnemer worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95b
  - number: 95b.10
    text: |-
      De ministeriële regeling, bedoeld in het achtste lid, wordt niet eerder vastgesteld dan nadat de gezamenlijke
      netbeheerders en de vergunninghouders alsmede de consumentenorganisaties in de gelegenheid zijn gesteld hun
      zienswijze te geven over de inhoud van de regeling.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95b
  - number: 95b.11
    text: |-
      Bij ministeriële regeling worden regels gesteld over het beperken van de levering van elektriciteit. Deze regels
      bepalen in elk geval wanneer en onder welke voorwaarden de levering van elektriciteit kan worden beperkt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95b
  - number: 95b.12
    text: |-
      De Autoriteit Consument en Markt publiceert jaarlijks, op basis van de informatie verkregen op grond van het tweede
      lid, aanbevelingen over de conformiteit van de leveringsprijzen met artikel 3 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95b
  - number: 95c.1
    text: |-
      Bepalingen die zijn opgenomen in overeenkomsten inzake levering van elektriciteit aan afnemers die beschikken over
      een aansluiting op het net met een totale maximale doorlaatwaarde van ten hoogste 3*80A en die tot doel hebben de
      opwekking van duurzame elektriciteit te verbieden zijn onverbindend.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95c
  - number: 95c.2
    text: |-
      Een houder van een vergunning is verplicht een aanbod van een afnemer als bedoeld in het eerste lid tot
      teruglevering van door hem geproduceerde duurzame elektriciteit te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95c
  - number: 95ca.1
    text: |-
      Een leverancier schakelt een meetbedrijf in voor het collecteren, valideren en vaststellen van de meetgegevens die
      betrekking hebben op afnemers als bedoeld in [artikel 95a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95ca
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95ca.2
    text: 'In afwijking van het eerste lid worden de meetgegevens die betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95ca
  - number: 95ca.2.a
    text: een rechtspersoon of een natuurlijke persoon die handelt in de uitoefening van een beroep of bedrijf, en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95ca
  - number: 95ca.2.b
    text: |-
      behalve één of meer aansluitingen met een doorlaatwaarde kleiner dan of gelijk aan 3 * 80 A ten minste één
      aansluiting heeft met een doorlaatwaarde groter dan 3 * 80 A, gecollecteerd, gevalideerd en vastgesteld door het
      meetbedrijf dat die rechtspersoon of natuurlijke persoon daartoe inschakelt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95ca
  - number: 95ca.3
    text: |-
      Indien een leverancier voor de levering van elektriciteit aan afnemers als bedoeld in
      [artikel 95a, eerste lid][ref1], factureert op basis van meetgegevens, maakt hij gebruik van meetgegevens die het
      meetbedrijf heeft gecollecteerd, gevalideerd en vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95ca
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95ca.4
    text: |-
      Een meetbedrijf verstrekt slechts meetgegevens aan anderen dan de betrokken afnemer als bedoeld in
      [artikel 95a, eerste lid][ref1], of de betrokken leverancier indien die ander de desbetreffende meetgegevens op
      basis van artikel 6 van de Algemene verordening gegevensbescherming mag verwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95ca
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95cb.1
    text: |-
      Een leverancier heeft ten aanzien van een afnemer als bedoeld in [artikel 95a, eerste lid][ref1], tot taak de
      door deze afnemer verschuldigde bedragen voor de uitvoering van de bij of krachtens deze wet aan de netbeheerder
      opgedragen taken te factureren en innen. De leverancier brengt hiervoor geen kosten in rekening aan de
      netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95cb
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95cb.2
    text: Het eerste lid is niet van toepassing op bedragen die zijn gebaseerd op tarieven met een eenmalig karakter.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95cb
  - number: 95cb.3
    text: |-
      De betaling door een afnemer als bedoeld in [artikel 95a, eerste lid][ref1], aan een leverancier van de
      overeenkomstig het eerste en tweede lid gefactureerde bedragen geldt als bevrijdende betaling.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95cb
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95cb.4
    text: |-
      Rechtsvorderingen tot betaling van de door de leverancier overeenkomstig het eerste en tweede lid gefactureerde
      bedragen alsmede van de overeenkomstig [artikel 16b, tweede lid][ref1], gefactureerde tarieven, verjaren door
      verloop van twee jaren. Indien de leverancier een vordering tot betaling van een schuld van een afnemer ter zake
      van de uitvoering van taken als bedoeld in het eerste lid, niet heeft gedaan binnen twee jaren nadat de vordering
      opeisbaar is geworden, vervalt het recht om betaling te vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95cb
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 16b
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 95cb.5
    text: |-
      Een leverancier draagt per periode de overeenkomstig het eerste lid gefactureerde of te factureren bedragen af aan
      de desbetreffende netbeheerder.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95cb
  - number: 95cb.6
    text: |-
      Bij ministeriële regeling worden regels gesteld over de omvang en het moment van de afdracht, bedoeld in het vijfde
      lid, ten behoeve van een gelijkmatige afdracht aan de netbeheerders.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95cb
  - number: 95d.1
    text: 'Onze Minister verleent op aanvraag een vergunning indien de aanvrager genoegzaam aantoont dat hij:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95d
  - number: 95d.1.a
    text: |-
      beschikt over de benodigde organisatorische, financiële en technische kwaliteiten voor een goede uitvoering van
      zijn taak;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95d
  - number: 95d.1.b
    text: redelijkerwijs in staat kan worden geacht de verplichtingen als opgenomen in dit hoofdstuk na te komen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95d
  - number: 95d.2
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de inhoud van en de procedure
      voor aanvraag van een vergunning en de criteria, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95d
  - number: 95e.1
    text: Onze Minister kan voorschriften en beperkingen verbinden aan een vergunning.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95e
  - number: 95e.2
    text: Onze Minister kan de aan een vergunning verbonden voorschriften of beperkingen wijzigen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95e
  - number: 95e.3
    text: |-
      Een vergunning kan slechts worden overgedragen aan een andere houder van een vergunning met toestemming van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95e
  - number: 95e.4
    text: |-
      [Artikel 95c][ref1] is van overeenkomstige toepassing ten aanzien van het verlenen van toestemming als bedoeld in
      het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95c
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95e
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95c
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95f.1
    text: 'Onze Minister kan een vergunning intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95f
  - number: 95f.1.a
    text: de houder van de vergunning dit verzoekt;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95f
  - number: 95f.1.b
    text: |-
      de houder van de vergunning in onvoldoende mate voldoet aan de verplichting, bedoeld in [artikel 95b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95f
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95b
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95f.1.c
    text: de houder van de vergunning de in de vergunning opgenomen voorschriften of opgelegde beperkingen niet nakomt;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95f
  - number: 95f.1.d
    text: |-
      de houder van de vergunning bij de aanvraag onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van
      juiste en volledige gegevens tot een andere beschikking op de aanvraag zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95f
  - number: 95f.1.e
    text: |-
      de houder van de vergunning naar het oordeel van Onze Minister om andere redenen niet langer in staat moet worden
      geacht de vergunde activiteit of in de vergunning opgenomen voorschriften na te komen;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95f
  - number: 95f.1.f
    text: |-
      de houder van de vergunning de voorschriften bij of krachtens de [artikelen 95k][ref1] en [95l][ref2] niet nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95k
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95l
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95f
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95k
        hoofdstuk: '8'
        paragraaf: 1b
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95l
        hoofdstuk: '8'
        paragraaf: 1b
  - number: 95f.2
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de tijdelijke
      voorzieningen en de procedure bij intrekking van een vergunning.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95f
  - number: 95j
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95j
  - number: 95j.a
    text: 'opwekkingsgegevens:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95j
  - number: 95j.a.1º
    text: |-
      het aandeel van elke energiebron in de totale brandstofmix die de leverancier in het voorafgaande jaar heeft
      gebruikt, en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95j
  - number: 95j.a.2°
    text: |-
      de milieugevolgen, in termen van uitstoot van koolstofdioxide en van radioactief afval, als gevolg van
      elektriciteitsproductie met verschillende energiebronnen veroorzaakt door de totale brandstofmix die de leverancier
      in het voorafgaande jaar heeft gebruikt;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95j
  - number: 95j.a.3°
    text: |-
      verwijzingen naar beschikbare referentiebronnen, waar voor een ieder toegankelijke informatie beschikbaar is
      over de milieugevolgen, in termen van uitstoot van koolstofdioxide en van radioactief afval, als gevolg van
      elektriciteitsproductie met verschillende energiebronnen veroorzaakt door de totale brandstofmix die de leverancier
      in het voorafgaande jaar heeft gebruikt;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95j
  - number: 95j.b
    text: 'eindafnemers: afnemers aan wie uitsluitend voor eigen verbruik elektriciteit wordt geleverd.'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95j
  - number: 95k.1
    text: |-
      De leverancier meldt op begrijpelijke wijze en op dusdanige wijze dat de gegevens van verschillende leveranciers
      kunnen worden vergeleken:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95k
  - number: 95k.1.a
    text: |-
      uiterlijk in de periode vanaf 1 mei van elk kalenderjaar tot 1 mei van het daaropvolgende jaar de
      opwekkingsgegevens van de door hem in het kalenderjaar voorafgaand aan die periode aan zijn eindafnemers geleverde
      elektriciteit op of bij de rekening en in het promotiemateriaal of
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95k
  - number: 95k.1.b
    text: |-
      op of bij de rekening, de opwekkingsgegevens van de door hem in de periode waarop die rekening betrekking heeft aan
      zijn eindafnemers geleverde elektriciteit en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95k
  - number: 95k.1.c
    text: |-
      elk kalenderjaar de opwekkingsgegevens van de door hem in het voorgaande kalenderjaar aan zijn eindafnemers
      geleverde elektriciteit op zijn website voor eindafnemers.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95k
  - number: 95k.2
    text: |-
      Een producent of een handelaar meldt uiterlijk twee maanden na 1 januari van elk kalenderjaar, aan de leverancier
      de opwekkingsgegevens van de in het voorgaande kalenderjaar door hem geproduceerde of verhandelde elektriciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95k
  - number: 95k.3
    text: |-
      De betrouwbaarheid van de opwekkingsgegevens van de elektriciteit waarvoor garanties van oorsprong, bedoeld in
      [artikel 73, eerste lid][ref1], of certificaten van oorsprong worden verstrekt, wordt door middel van die garanties
      van oorsprong of certificaten van oorsprong gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel73
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95k
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '73'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 95k.4
    text: |-
      Indien de producent, handelaar of leverancier onderdeel uitmaakt van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1], worden tevens de opwekkingsgegevens van de groep
      als geheel vermeld op of bij de rekening aan de eindafnemer, alsmede op aan de eindafnemer geadresseerd
      promotiemateriaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95k
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 95k.5
    text: 'Onze Minister kan nadere regels stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95k
  - number: 95k.5.a
    text: |-
      de opwekkingsgegevens die de leverancier vermeldt op of bij de rekening aan de eindafnemer, en de wijze waarop deze
      gegevens worden weergegeven;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95k
  - number: 95k.5.b
    text: de wijze waarop de opwekkingsgegevens door de producent, handelaar en leverancier onderling worden doorgegeven;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95k
  - number: 95k.5.c
    text: |-
      de wijze waarop de opwekkingsgegevens van geïmporteerde en in Nederland verhandelde of geleverde elektriciteit
      worden vermeld;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95k
  - number: 95k.5.d
    text: de wijze waarop de betrouwbaarheid van de opwekkingsgegevens ten minste wordt gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95k
  - number: 95k.5.e
    text: |-
      de uiterste datum en de wijze waarop de leverancier de opwekkingsgegevens van de door hem in het voorgaande
      kalenderjaar aan zijn eindafnemers geleverde elektriciteit vermeldt op zijn website voor eindafnemers.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95k
  - number: 95k.6
    text: Van de verplichtingen in dit artikel kan uitsluitend gemotiveerd worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95k
  - number: 95k.7
    text: |-
      In aanvulling op het eerste lid meldt de leverancier op of bij de rekening en in het promotiemateriaal informatie
      betreffende de rechten van eindafnemers aangaande geschillenbeslechting.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95k
  - number: 95l.1
    text: |-
      In dit artikel wordt onder milieugevolgen ten minste verstaan: de uitstoot van koolstofdioxide en radioactief
      afval.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95l
  - number: 95l.2
    text: |-
      De leverancier geeft ten minste eenmaal per kalenderjaar aan zijn eindafnemers een keuze van energiebronnen die
      hij zal gebruiken, onder vermelding van de milieugevolgen die te verwachten zijn van elektriciteitsproductie met
      die energiebronnen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95l
  - number: 95l.3
    text: Eindafnemers maken een keuze uit het aanbod van de leverancier en maken deze keuze bekend aan de leverancier.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95l
  - number: 95l.4
    text: |-
      Indien een eindafnemer binnen de door de leverancier gestelde termijn geen keuze maakt, levert de leverancier de
      door hem gekozen elektriciteit aan de eindafnemer.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95l
  - number: 95l.5
    text: |-
      Een producent of een handelaar geeft aan een leverancier een keuze van energiebronnen waaruit hij elektriciteit
      kan krijgen, onder vermelding van de milieugevolgen die te verwachten zijn van elektriciteitsproductie met die
      energiebronnen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95l
  - number: 95l.6
    text: |-
      Een producent of handelaar meldt aan de leverancier het aandeel van elke energiebron waaruit de leverancier
      elektriciteit heeft gekregen en de milieugevolgen van de elektriciteitsproductie met die energiebronnen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95l
  - number: 95l.7
    text: |-
      De leverancier meldt op of bij de rekening aan de eindafnemer het aandeel van elke energiebron die de leverancier
      heeft gebruikt voor levering aan die afnemer en de milieugevolgen van de elektriciteitsproductie met die
      energiebronnen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95l
  - number: 95l.8
    text: 'Onze Minister kan nadere regels stellen met betrekking tot de wijze waarop:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95l
  - number: 95l.8.a
    text: |-
      de betrouwbaarheid van de informatie van een producent of handelaar aan de leverancier ten minste wordt
      gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95l
  - number: 95l.8.b
    text: de betrouwbaarheid van de informatie van de leverancier aan de eindafnemer ten minste wordt gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95l
  - number: 95l.9
    text: |-
      Dit artikel treedt in werking met ingang van 1 januari 2007, dan wel op een eerder, bij koninklijk besluit te
      bepalen datum.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95l
  - number: 95la.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de eisen waaraan een meetinrichting, die
      moet voldoen aan dit artikel, ten minste voldoet, welke eisen kunnen verschillen per categorie afnemers.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95la
  - number: 95la.2
    text: |-
      De in het eerste lid bedoelde algemene maatregel van bestuur stelt ten minste eisen betreffende de
      functionaliteiten van de meetinrichting.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95la
  - number: 95la.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels wordt gesteld over meetinrichtingen, waaronder
      in elk geval regels over de installatie van meetinrichtingen en regels over de administratie in verband met het
      vervangen, installeren of verwijderen van meetinrichtingen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95la
  - number: 95la.4
    text: |-
      De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel van bestuur wordt niet gedaan
      dan nadat het ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen
      vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister van
      Economische Zaken te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-
      Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95la
  - number: 95lb
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95lb
  - number: 95lb.a
    text: de inrichting van energiekostenramingen en facturen inzake het verbruik van elektriciteit,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95lb
  - number: 95lb.b
    text: de frequentie van facturen inzake het verbruik van elektriciteit,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95lb
  - number: 95lb.c
    text: het verstrekken van gegevens over het verbruik van elektriciteit,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95lb
  - number: 95lb.d
    text: |-
      degenen die de informatie, bedoeld in de onderdelen a, b en c, verstrekken, welke regels kunnen verschillen per
      categorie van ontvangers van de informatie, bedoeld in de onderdelen a, b en c,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95lb
  - number: 95lb.e
    text: |-
      het op verzoek van een afnemer toesturen van facturen, factureringsinformatie en energiekostenramingen, eventueel
      langs elektronische weg,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95lb
  - number: 95lb.f
    text: de kosten van toegang tot meetgegevens en van facturatie en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95lb
  - number: 95lb.g
    text: degenen die om de informatie, bedoeld in onderdeel e, kunnen verzoeken.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95lb
  - number: 95lc
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de informatie die netbeheerders,
      leveranciers of handelaren verstrekken in contracten, rekeningen of ontvangstbewijzen, welke regels per categorie
      afnemers kunnen verschillen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95lc
  - number: 95ld
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95ld
  - number: 95m.1
    text: |-
      De voorwaarden, verbonden aan een leverings- of transportovereenkomst met een afnemer als bedoeld in
      [artikel 95a, eerste lid][ref1], zijn transparant, eerlijk en vooraf bekend. De voorwaarden worden in ieder geval
      voor het sluiten van de overeenkomst verstrekt en zijn gesteld in duidelijke en begrijpelijke taal.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95m
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95m.2
    text: |-
      Leveranciers zorgen ervoor dat afnemers als bedoeld in [artikel 95a, eerste lid][ref1], te allen tijde transparante
      informatie kunnen verkrijgen over de geldende tarieven en voorwaarden voor levering en transport van elektriciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95m
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95m.3
    text: |-
      Het is verboden voor de houder van een vergunning om op zodanige wijze afnemers als bedoeld in
      [artikel 95a, eerste lid][ref1], te benaderen dat onduidelijkheid bestaat over het feit dat een contract is
      afgesloten, de duur van het contract, de voorwaarden voor verlenging en beëindiging van het contract, het bestaan
      van een recht op opzegging en de voorwaarden van opzegging.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95m
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95m.4
    text: Een contract, gesloten in strijd met het bepaalde bij of krachtens dit artikel is vernietigbaar.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95m
  - number: 95m.5
    text: |-
      Een leverancier biedt een afnemer als bedoeld in [artikel 95a, eerste lid][ref1], ten minste een overeenkomst voor
      de levering van elektriciteit voor een onbepaalde duur aan.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95m
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95m.6
    text: |-
      Indien de afnemer als bedoeld in [artikel 95a, eerste lid][ref1], geen uitdrukkelijke keuze maakt voor een
      overeenkomst voor bepaalde duur, wordt hij geacht gekozen te hebben voor een overeenkomst voor onbepaalde duur.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95m
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95m.7
    text: |-
      Een afnemer als bedoeld in [artikel 95a, eerste lid][ref1], kan elke overeenkomst tot levering van elektriciteit
      beëindigen met inachtneming van een termijn van dertig dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95m
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95m.8
    text: |-
      Indien sprake is van een overeenkomst voor bepaalde duur, kan de leverancier in deze overeenkomst opnemen dat bij
      tussentijdse beëindiging van de overeenkomst de afnemer een redelijke vergoeding is verschuldigd. Indien sprake is
      van een overeenkomst voor onbepaalde duur, kan een dergelijke vergoeding niet in de overeenkomst worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95m
  - number: 95m.9
    text: |-
      Bij ministeriële regeling worden ter implementatie van de richtlijn nadere regels gesteld over bescherming van
      afnemers als bedoeld in [artikel 95a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95m
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95m.10
    text: |-
      Leveranciers voorzien afnemers van een door de Europese Commissie vastgesteld overzicht met praktische informatie
      inzake de rechten van afnemers en stellen dit overzicht algemeen beschikbaar.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95m
  - number: 95n.1
    text: |-
      Van de [artikelen 95b][ref1] en [95m, eerste, tweede en vijfde tot en met negende lid][ref2], kan worden afgeweken
      indien er sprake is van een overeenkomst tot levering van elektriciteit aan een groep afnemers, waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95b
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95m
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95n
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95b
        hoofdstuk: '8'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95m
        hoofdstuk: '8'
        paragraaf: 1c
  - number: 95n.1.a
    text: de meerderheid van deze afnemers rechtspersoon is of handelt in de uitoefening van een beroep of bedrijf;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95n
  - number: 95n.1.b
    text: alle afnemers in de overeenkomst vertegenwoordigd worden, en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95n
  - number: 95n.1.c
    text: |-
      deze vertegenwoordiger er zorg voor draagt dat hij ten aanzien van alle aansluitingen met een doorlaatwaarde van
      ten hoogste 3 * 80 A over toestemming tot vertegenwoordiging in het kader van de overeenkomst beschikt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95n
  - number: 95na.1
    text: |-
      Leveranciers zijn verplicht om aan afnemers als bedoeld in [artikel 95a, eerste lid][ref1], naast eventuele andere
      vrije contractvormen, levering volgens een modelcontract aan te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95na
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95na.2
    text: |-
      De Autoriteit Consument en Markt stelt het modelcontract vast, na consultatie van organisaties van leveranciers,
      netbeheerders en afnemers.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95na
  - number: 95o.1
    text: |-
      De leverancier voorziet in een transparante, eenvoudige en goedkope procedure voor de behandeling van klachten van
      afnemers als bedoeld in [artikel 95a, eerste lid][ref1], over de levering.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95o
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95o.2
    text: 'De in het eerste lid bedoelde procedure voorziet er voorts in dat:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95o
  - number: 95o.2.a
    text: |-
      de behandeling van de klacht geschiedt door een persoon die niet bij de gedraging waarop de klacht betrekking
      heeft, betrokken is geweest,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95o
  - number: 95o.2.b
    text: |-
      de klager schriftelijk en gemotiveerd in kennis wordt gesteld van de bevindingen naar aanleiding van de klacht en
      van de conclusies die daaraan worden verbonden en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95o
  - number: 95o.2.c
    text: de klacht zo spoedig mogelijk doch uiterlijk binnen acht weken wordt afgehandeld.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95o
  - number: 95o.3
    text: |-
      Indien een leverancier van een afnemer als bedoeld in [artikel 95a, eerste lid][ref1], een klacht of vraag ontvangt
      over het netbeheer, zendt de leverancier deze onverwijld door naar de netbeheerder op wie de klacht of vraag
      betrekking heeft, onder gelijktijdige mededeling daarvan aan de klager of de vrager.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel95o
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: '96'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de laadinfrastructuur voor
      elektrisch vervoer ter uitvoering van bindende onderdelen van EU-rechtshandelingen op het gebied van elektrisch
      vervoer.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel96
  - number: '103.2'
    text: De Elektriciteitswet 1989 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel103
  - number: '104.1'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel104
  - number: '104.2'
    text: |-
      [Artikel 89][ref1] treedt in werking op een bij koninklijk besluit te bepalen tijdstip en werkt terug tot en met 1
      januari 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel89
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '89'
        hoofdstuk: '7'
  - number: '104.3'
    text: |-
      Paragraaf 8.1a treedt in werking met ingang van de datum waarop [hoofdstuk 4][ref1] vervalt, dan wel op een eerder,
      bij koninklijk besluit te bepalen datum.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0009755
        hoofdstuk: '4'
  - number: 104a
    text: |-
      Deze wet vervalt op een bij koninklijk besluit te bepalen tijdstip, dat voor de artikelen of onderdelen daarvan
      verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel104a
  - number: '105'
    text: |-
      Deze wet wordt aangehaald als: Elektriciteitswet met vermelding van het jaartal van het Staatsblad waarin zij zal
      worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel105
