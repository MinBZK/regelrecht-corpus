  - number: 41a
    text: |-
      1 Ten behoeve van het voorstel, bedoeld in [artikel 41b][ref1], stelt de Autoriteit Consument en Markt
      voor iedere netbeheerder afzonderlijk voor dezelfde periode als waarvoor het besluit geldt op grond van
      [artikel 41, eerste lid][ref2], vast:

      a. de korting ter bevordering van de doelmatige bedrijfsvoering,

      b. de kwaliteitsterm, en

      c. het rekenvolume van elke tariefdrager waarvoor een tarief wordt vastgesteld.

      2 De Autoriteit Consument en Markt kan het in het eerste lid, onderdeel c, bedoelde rekenvolume gedurende de in de
      aanhef van dat lid bedoelde periode wijzigen.

      3 Indien het besluit op grond van [artikel 41, eerste lid][ref3], bij een onherroepelijke rechterlijke uitspraak
      is vernietigd of bij een onherroepelijk besluit op bezwaar is herroepen, herziet de Autoriteit Consument en Markt
      de in het eerste lid vermelde besluiten met toepassing van de met inachtneming van die uitspraak of dat besluit op
      bezwaar gecorrigeerde methode.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel41b
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel41
