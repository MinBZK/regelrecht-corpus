      één of meer windmolens;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel1
  - number: 1.1.ba
    text: |-
      net op zee: het net, bedoeld in [artikel 15a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel15a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 15a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 1.1.bb
    text: |-
      certificaat van oorsprong: gegevens op een rekening waarmee wordt aangetoond uit welke energiebron, niet zijnde een
      hernieuwbare energiebron, een hoeveelheid elektriciteit is opgewekt;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel1
  - number: 1.1.bc
    text: |-
      verordening 2019/941: [verordening 2019/941](32841R2019) van het Europees Parlement en de Raad van 5 juni 2019
      betreffende risicoparaatheid in de elektriciteitssector en tot intrekking van [Richtlijn 2005/89/EG](32005L0089)
      (Pb EU 2019, L 158).
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt als afnemer, niet zijnde een afnemer als
      bedoeld in [artikel 95a, eerste lid][ref1], beschouwd een organisatorische eenheid die zich in hoofdzaak bezig
      houdt met het openbaar vervoer per metro, tram of trolley, met mijnbouwkundige activiteiten, met het beheer
      en de exploitatie van telecommunicatie- en kabelnetwerken, met het beheer van de openbare verlichting of van
      verkeersregelinstallaties, dan wel met riolering, bemaling, waterzuivering of transport en distributie van water,
      mits:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 1.2.a
    text: |-
      deze eenheid daarbij uitsluitend ingevolge de technische aard van de bedrijfsuitoefening beschikt over verscheidene
      aansluitingen,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel1
  - number: 1.2.b
    text: het totale aan de eenheid voor die bedrijfsuitoefening beschikbaar gestelde vermogen meer bedraagt dan 2 MVA en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel1
  - number: 1.2.c
    text: de bedrijfsuitoefening door deze eenheid op fysiek geïntegreerde basis geschiedt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel1
  - number: '1.3'
    text: |-
      Een onderneming die zich in hoofdzaak bezighoudt met het vervoer van personen of goederen per trein wordt
      in afwijking van het eerste lid, onderdeel c, aangemerkt als afnemer, niet zijnde een afnemer als bedoeld in
      [artikel 95a, eerste lid][ref1], ook indien zij geen aansluiting heeft op een net.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: '1.4'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde worden meerdere onroerende zaken als bedoeld in
      [artikel 16, onderdeel c, van de Wet waardering onroerende zaken][ref1] die zich bevinden in een bouwwerk met:


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 1.4.a
    text: |-
      een woonfunctie bestemd voor bewoners die zijn ingeschreven aan een instelling als bedoeld in
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref1] of aan een universiteit of hogeschool als bedoeld in
      [artikel 1.2, onderdelen a en b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] of die zich
      voorbereiden op een promotie als bedoeld in [artikel 7.18 van laatstgenoemde wet][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 1.4.b
    text: een woonoppervlak van maximaal 50 vierkante meter per wooneenheid en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel1
  - number: 1.4.c
    text: |-
      gemeenschappelijke ruimtes die een meeromvattende functie hebben dan de reguliere functie van
      gemeenschappelijke ruimten in een appartementencomplex, beschouwd als één onroerende zaak als bedoeld in
      [artikel 16 van de Wet waardering onroerende zaken][ref1] indien de eigenaar hierom verzoekt bij de netbeheerder.
      Een verzoek kan slechts worden ingetrokken ingeval van ingrijpende renovatie van het bouwwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: '1.5'
    text: |-
      Deze wet en de daarop berustende bepalingen zijn mede van toepassing op het net op zee dat is gelegen binnen de
      Nederlandse exclusieve economische zone, landsgrensoverschrijdende netten die zijn gelegen binnen de Nederlandse
      exclusieve economische zone en op installaties voor de opwekking van elektriciteit die zijn gevestigd binnen de
      Nederlandse exclusieve economische zone, alsmede de daarmee opgewekte elektriciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel1
  - number: '1.6'
    text: |-
      Productie-installaties voor de opwekking van elektriciteit met behulp van windenergie of zonne-energie op
      het land die behoren tot eenzelfde onderneming of instelling en die onderling technische, organisatorische of
      functionele bindingen hebben en in elkaars onmiddelijke nabijheid zijn gelegen, worden geacht te beschikken over
      één aansluiting. De netbeheerder en de producent kunnen meerdere aansluitingen overeenkomen indien dit tot lagere
      kosten voor de netbeheerder leidt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel1
  - number: '1.7'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde worden één of meer windparken of zonneweides op
      land, of een combinatie daarvan die zich in elkaars onmiddellijke nabijheid bevinden, samen met het bijbehorende
      stelsel van verbindingen, beschouwd als één productie-installatie en één onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 1.7.a
    text: |-
      ten behoeve van die windparken, zonneweides of een combinatie daarvan gezamenlijk een aanvraag is gedaan bij een
      netbeheerder om aangesloten te worden op dezelfde aansluiting; en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel1
  - number: 1.7.b
    text: de gevraagde aansluitcapaciteit meer bedraagt dan 2 MVA.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister stelt ten minste eenmaal in de vier jaar een energierapport vast dat richting geeft aan van rijkswege
      in de eerstvolgende vier jaar te nemen beslissingen voor zover daarbij het belang van het betrouwbaar, duurzaam,
      doelmatig en milieuhygiënisch verantwoord functioneren van de elektriciteitsvoorziening in beschouwing moet of kan
      worden genomen. Bij de voorbereiding van een energierapport betrekt Onze Minister de naar zijn oordeel bij de te
      behandelen onderwerpen meest belanghebbende bestuursorganen, instellingen en organisaties.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel2
  - number: '2.2'
    text: |-
      Voor zover het energierapport onderdelen betreft die tot de verantwoordelijkheid behoren van Onze Minister van
      Infrastructuur en Milieu, wordt het rapport vastgesteld na overleg met voornoemde minister.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel2
  - number: '2.3'
    text: 'Het energierapport bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel2
  - number: 2.3.a
    text: |-
      een analyse van de ontwikkelingen op de nationale en internationale energiemarkt en de effecten daarvan op een
      betrouwbaar, duurzaam, doelmatig en milieuhygiënisch verantwoord functionerende energiehuishouding;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel2
  - number: 2.3.b
    text: |-
      een analyse van veranderingen in het gebruik van energiebronnen voor het opwekken van elektriciteit en van de wijze
      waarop en de mate waarin zich een duurzame energiehuishouding ontwikkelt;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel2
  - number: 2.3.c
    text: een analyse van de ontwikkeling van de marktwerking in de energievoorziening;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel2
  - number: 2.3.d
    text: |-
      een overzicht van de beoogde resultaten inzake de bevordering van een betrouwbaar, duurzaam, doelmatig en
      milieuhygiënisch verantwoord functionerende energiehuishouding en van de wijzen waarop die resultaten in de
      desbetreffende periode van vier jaar zullen worden nagestreefd;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel2
  - number: 2.3.e
    text: een analyse van overige aspecten die van belang kunnen zijn in het kader van het energiebeleid in het algemeen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel2
  - number: '3'
    text: |-
      Zodra het energierapport is vastgesteld, zendt Onze Minister dit aan beide Kamers der Staten-Generaal en geeft hij
      kennis van het energierapport in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel3
  - number: '4.1'
    text: Het energierapport geldt met ingang van een bij besluit van Onze Minister vast te stellen tijdstip.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4
  - number: '4.2'
    text: |-
      Het besluit wordt niet eerder genomen dan acht weken nadat het energierapport op grond van
      [artikel 3, eerste lid][ref1], is overgelegd aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '4.3'
    text: |-
      Indien door of namens een der kamers der Staten-Generaal binnen acht weken nadat het energierapport is overgelegd,
      te kennen wordt gegeven dat zij over het energierapport in het openbaar wil beraadslagen, wordt het besluit niet
      eerder genomen dan zes maanden na de overlegging van het energierapport, dan wel, indien de beraadslagingen op een
      eerder tijdstip zijn beëindigd, na die beraadslagingen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4
  - number: 4a.1
    text: |-
      Onze Minister verzamelt, analyseert en bewerkt systematisch inlichtingen en gegevens met betrekking tot de
      leverings- en voorzieningszekerheid, in het bijzonder met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
  - number: 4a.1.a
    text: het evenwicht van vraag en aanbod op de nationale markt,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
  - number: 4a.1.b
    text: het niveau van de verwachte toekomstige vraag,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
  - number: 4a.1.c
    text: de geplande of in aanbouw zijnde extra productie- en netwerkcapaciteit,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
  - number: 4a.1.d
    text: de kwaliteit en de staat van onderhoud van de netten, en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
  - number: 4a.1.e
    text: de maatregelen in geval van piekbelasting of het in gebreke blijven van een of meerdere leveranciers.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
  - number: 4a.2
    text: |-
      Onze Minister publiceert jaarlijks uiterlijk op 31 juli op geschikte wijze een verslag van zijn bevindingen die het
      verzamelen, analyseren en bewerken van de inlichtingen en gegevens over de onderwerpen, genoemd in het eerste lid,
      heeft opgeleverd, alsmede van de getroffen of voorgenomen maatregelen met betrekking tot die onderwerpen. Hij zendt
      het verslag onverwijld naar de Europese Commissie en doet mededeling van het verslag in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
  - number: 4a.3
    text: |-
      Ter uitvoering van de taak, bedoeld in het eerste lid, kunnen bij ministeriële regeling nadere regels worden
      gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
  - number: 4a.3.a
    text: de gegevens en inlichtingen waarvan Onze Minister kan verlangen dat zij hem worden verstrekt,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
  - number: 4a.3.b
    text: |-
      degenen van wie Onze Minister, onverminderd [artikel 78][ref1], kan verlangen dat zij hem gegevens en inlichtingen
      verstrekken, en


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel78
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '78'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 4a.3.c
    text: |-
      de termijn waarbinnen, de wijze waarop en de vorm waarin de gegevens en inlichtingen aan Onze Minister worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
  - number: 4a.4
    text: |-
      Het verslag bedoeld in het tweede lid wordt in nauwe samenwerking met de netbeheerder van het landelijk
      hoogspanningsnet opgesteld die voorzover van toepassing daarover overleg pleegt met de relevante netbeheerders van
      aangrenzende landen. In het verslag wordt ingegaan op de algehele toereikendheid van het stroomvoorzieningsysteem
      en de geraamde vraag naar elektriciteit waarbij in elk geval aandacht wordt besteed aan:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
  - number: 4a.4.a
    text: de operationele netwerkveiligheid,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
  - number: 4a.4.b
    text: het geraamde evenwicht tussen aanbod en vraag in de komende vijf jaar,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
  - number: 4a.4.c
    text: |-
      de vooruitzichten inzake de elektriciteitsvoorziening voor de periode tussen vijf en vijftien jaar na de datum van
      verslaglegging, en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
  - number: 4a.4.d
    text: |-
      de voornemens van de netbeheerder van het landelijk hoogspanningsnet en voor zover bekend van andere partijen voor
      de komende vijf of meer kalenderjaren op het gebied van investeringen ter voorziening in landgrensoverschrijdende
      netten.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
  - number: 4a.5
    text: |-
      Bij het onderdeel van het verslag waarin aandacht wordt besteed aan de investeringsvoornemens in
      landgrensoverschrijdende netten als bedoeld in het vierde lid, onderdeel d, wordt met betrekking tot die voornemens
      rekening gehouden met:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
  - number: 4a.5.a
    text: de beginselen van congestiebeheer, zoals vermeld in [verordening 2019/943](32843R2019),
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
  - number: 4a.5.b
    text: de bestaande en geplande transportlijnen,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
  - number: 4a.5.c
    text: |-
      verwachte patronen op het gebied van productie, levering, grensoverschrijdende handel en verbruik waarbij ruimte is
      voor vraagbeheersmaatregelen, en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
  - number: 4a.5.d
    text: |-
      regionale, nationale en Europese doelstellingen voor duurzame ontwikkeling met inbegrip van de projecten die zijn
      opgenomen in bijlage I bij Beschikking nr. 1364/2006/EG.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4a
  - number: 4b
    text: Onze Minister is de bevoegde instantie, bedoeld in artikel 3 van [verordening 2019/941](32841R2019).
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel4b
  - number: '5.1'
    text: |-
      De Autoriteit Consument en Markt is belast met de aan haar opgedragen taken ter uitvoering van het bepaalde bij of
      krachtens deze wet, [verordening 2019/943](32843R2019), [verordening 2019/942](32842R2019)[verordening 2019/941]
      (32841R2019) en [verordening 1227/2011](32011R1227), alsmede met het toezicht op de naleving van het bepaalde
      bij of krachtens deze wet, [verordening 2019/943](32843R2019), [verordening 2019/942](32842R2019) en verordening
      1227/2011.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel5
  - number: '5.2'
    text: |-
      De Autoriteit Consument en Markt is de regulerende instantie, bedoeld in artikel 35, eerste lid, van de richtlijn,
      artikel 2, onder 12, van [verordening 2019/941](32841R2019) en en artikel 2, onder 2, van [verordening 2019/943]
      (32843R2019).
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel5
  - number: '5.3'
    text: |-
      De Autoriteit Consument en Markt houdt bij de uitoefening van de haar op grond van deze wet toegekende taken en
      bevoegdheden rekening met artikel 36 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel5
  - number: '5.4'
    text: |-
      De Autoriteit Consument en Markt werkt, onder meer teneinde de nationale markten op één of meer geografische
      gebieden als bedoeld in artikel 34, derde lid, van [verordening 2019/943](32843R2019) te integreren en samenwerking
      tussen de netbeheerder van het landelijk hoogspanningnet en buitenlandse instellingen die op grond van nationale
      wettelijke regels zijn belast met het beheer van een transmissiesysteem als bedoeld in artikel 2, onderdeel 4, van
      de richtlijn in deze gebieden aan te moedigen, samen met:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel5
  - number: 5.4.a
    text: |-
      instellingen in andere lidstaten van de Europese Unie die op grond van nationale wettelijke regels zijn belast met
      de toepassing van de regels op het gebied van elektriciteit;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel5
  - number: 5.4.b
    text: Acer.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel5
  - number: '5.5'
    text: |-
      De Autoriteit Consument en Markt draagt bij aan de compatibiliteit van gegevensuitwisselingsprocessen voor de
      belangrijkste marktprocessen in één of meer geografische gebieden als bedoeld in artikel 34, derde lid, van
      [verordening 2019/943](32843R2019).
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel5
  - number: '5.6'
    text: |-
      De Autoriteit Consument en Markt beslist over de goedkeuring van de door de netbeheerder van het landelijk
      hoogspanningsnet gehanteerde congestiebeheersprocedures voor landsgrensoverschrijdende netten.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel5
  - number: 5a
    text: |-
      De Autoriteit Consument en Markt kan een bindende gedragslijn opleggen in verband met de naleving van het bepaalde
      bij of krachtens deze wet, [verordening 2019/943](32843R2019), [verordening 2019/942](32842R2019) en verordening
      1227/2011.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel5a
  - number: 5b
    text: |-
      De Autoriteit Consument en Markt volgt nauwlettend in welke mate de elektriciteitsmarkt aan de doelstellingen,
      bedoeld in artikel 36 van de richtlijn, voldoet. Tevens volgt zij:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel5b
  - number: 5b.a
    text: |-
      de samenhang tussen de voorgenomen investeringen, bedoeld in [artikel 21][ref1], van de netbeheerder van het
      landelijk hoogspanningnet en van de netbeheerder van het net op zee en de netontwikkelingsplannen als bedoeld in
      artikel 30, eerste lid, onderdeel b, van [verordening 2019/943](32843R2019);


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel21
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 5b.b
    text: het niveau van transparantie, met inbegrip van de groothandelsprijzen;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel5b
  - number: 5b.c
    text: |-
      het niveau en de doeltreffendheid van openstelling van de markt en de mededinging op groot- en
      kleinverbruikersniveau;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel5b
  - number: 5b.d
    text: |-
      het bestaan van praktijken gericht op het aangaan van overeenkomsten die afnemers, niet zijnde afnemers als bedoeld
      in [artikel 95a, eerste lid][ref1], kunnen weerhouden van of hen beperkingen kunnen opleggen met betrekking tot een
      keuze voor het gelijktijdig sluiten van overeenkomsten met meer dan een leverancier;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 5b.e
    text: de investeringen in productiecapaciteit met het oog op de continuïteit van de voorziening;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel5b
  - number: 5b.f
    text: |-
      de technische samenwerking tussen de netbeheerder van het landelijk hoogspanningsnet en buitenlandse instellingen
      die op grond van nationale wettelijke regels zijn belast met het beheer van een transmissiesysteem als bedoeld in
      artikel 2, onderdeel 4, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel5b
  - number: 5c.1
    text: |-
      Onverminderd de verplichting tot het opstellen van een jaarverslag, bedoeld in
      [artikel 18, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], brengt de Autoriteit Consument
      en Markt jaarlijks verslag uit over de uitvoering van haar taken, bedoeld in [artikel 5, eerste lid][ref2]. Het
      verslag bevat een overzicht van de behaalde resultaten en genomen maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel5
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '5'
        hoofdstuk: '2'
  - number: 5c.2
    text: De Autoriteit Consument en Markt zendt het verslag toe aan Onze Minister, Acer en de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel5c
  - number: '7.1'
    text: |-
      In afwijking van [artikel 7, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1] en onverminderd
      artikel 7, derde lid, van die wet is de Autoriteit Consument en Markt bevoegd gegevens of inlichtingen te
      verstrekken aan Acer, voor zover die gegevens of inlichtingen van betekenis kunnen zijn voor de uitoefening van de
      taak van Acer.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel7
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '7'
  - number: '7.2'
    text: |-
      [Artikel 7, vierde lid, van de Instellingswet Autoriteit Consument en Markt][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel7
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '7'
  - number: 7a.1
    text: |-
      Bij algemene maatregel van bestuur kan, met inachtneming van bindende besluiten van de Raad van de Europese Unie,
      van het Europees Parlement en de Raad gezamenlijk of van de Europese Commissie, bij wege van experiment worden
      afgeweken van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel7a
  - number: 7a.2
    text: |-
      Er kan uitsluitend toepassing worden gegeven aan het eerste lid indien het experiment bijdraagt aan ontwikkelingen
      op het gebied van de productie, het transport en de levering van decentraal opgewekte duurzame elektriciteit, of
      elektriciteit opgewekt in een installatie voor warmtekrachtkoppeling en past binnen verantwoorde financiële kaders
      van het Rijk.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel7a
  - number: 7a.3
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, worden regels gesteld over experimenten als
      bedoeld in het eerste lid, waarbij in elk geval wordt bepaald:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel7a
  - number: 7a.3.a
    text: welke afwijking of afwijkingen van deze wet zijn toegestaan,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel7a
  - number: 7a.3.b
    text: |-
      voor welke categorieën afnemers de afwijkingen gelden en de omvang van de groep afnemers waarvoor een afwijking
      geldt,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel7a
  - number: 7a.3.c
    text: de ten hoogste toegestane tijdsduur van die afwijking of afwijkingen,
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel7a
  - number: 7a.3.d
    text: het aantal situaties waarin een afwijking is toegestaan en
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel7a
  - number: 7a.3.e
    text: |-
      de wijze waarop wordt vastgesteld of een afwijking aan haar doel beantwoordt, en of de tijdsduur daarvan aanpassing
      behoeft.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel7a
  - number: 7a.4
    text: |-
      Onze Minister zendt uiterlijk drie maanden na de beëindiging van een experiment een verslag over de
      doeltreffendheid en de effecten ervan, alsmede een standpunt inzake de voortzetting ervan anders dan als
      experiment, aan de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel7a
  - number: 7a.5
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel7a
  - number: 9a.1
    text: |-
      Indien naar het oordeel van Onze Minister om de leverings- en voorzieningszekerheid te waarborgen onvoldoende
      productie-installaties worden gebouwd, kan hij een procedure starten overeenkomstig artikel 8 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9a
  - number: 9a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de in artikel 8 van de
      richtlijn bedoelde procedure.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9a
  - number: 9b.1
    text: |-
      Werken met een nationaal belang waarvoor Onze Minister in ieder geval een projectbesluit als bedoeld in
      [afdeling 5.2 van de Omgevingswet][ref1] vaststelt, zijn de volgende projecten:


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 9b.1.a
    text: |-
      de aanleg en uitbreiding van een productie-installatie, met inbegrip van de aansluiting van die installatie op een
      net, met een capaciteit van ten minste 100 MW, indien het betreft een installatie voor de opwekking van duurzame
      elektriciteit met behulp van windenergie op land;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9b
  - number: 9b.1.b
    text: |-
      de aanleg en uitbreiding van een productie-installatie, met inbegrip van de aansluiting van die installatie op een
      net, met een capaciteit van ten minste 50 MW, indien het betreft een installatie voor de opwekking van duurzame
      elektriciteit anders dan met behulp van windenergie;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9b
  - number: 9b.1.c
    text: |-
      de aanleg en uitbreiding van een productie-installatie, met inbegrip van de aansluiting van die installatie op een
      net, met een capaciteit van ten minste 500 MW, indien het betreft een installatie voor de opwekking van andere dan
      duurzame elektriciteit;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9b
  - number: 9b.1.d
    text: |-
      de uitbreiding van een productie-installatie voor de opwekking van andere dan duurzame elektriciteit, met inbegrip
      van de aansluiting van die installatie op een net, indien door die uitbreiding de capaciteit van die productie-
      installatie wordt vergroot tot ten minste 500 MW.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9b
  - number: 9b.2
    text: |-
      [Artikel 16.7 van de Omgevingswet][ref1] is van toepassing op de coördinatie van besluiten ter uitvoering van
      projectbesluiten als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '16'
  - number: 9b.3
    text: |-
      In afwijking van het eerste lid kan Onze Minister besluiten geen projectbesluit vast te stellen als naar zijn
      oordeel besluitvorming door een bestuursorgaan van een gemeente of van een provincie het project kan versnellen
      of daaraan anderszins aanmerkelijke voordelen zijn verbonden, en het college van burgemeester en wethouders van de
      betreffende gemeente respectievelijk gedeputeerde staten van de betreffende provincie daarmee instemmen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9b
  - number: 9b.4
    text: |-
      Onze Minister geeft tegelijk met of zo snel mogelijk na de bekendmaking van een besluit als bedoeld in het derde
      lid kennis van dat besluit op de in [artikel 12 van de Bekendmakingswet][ref1] bepaalde wijze en doet mededeling
      van dat besluit door toezending daarvan aan de initiatiefnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel12
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '12'
  - number: 9b.5
    text: Het vierde lid is van overeenkomstige toepassing als een besluit als bedoeld in het derde lid wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9b
  - number: 9c.1
    text: |-
      Voor het volgende werk van provinciaal belang stellen gedeputeerde staten in ieder geval een projectbesluit als
      bedoeld in [afdeling 5.2 van de Omgevingswet][ref1] vast: de aanleg of uitbreiding van een productie-installatie
      voor opwekking van duurzame elektriciteit met behulp van windenergie met een capaciteit van ten minste 5 MW maar
      minder dan 100 MW, met inbegrip van de aansluiting van die installatie op een net.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 9c.2
    text: Bij algemene maatregel van bestuur kan per provincie een minimumrealisatienorm worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9c
  - number: 9c.3
    text: |-
      In afwijking van het eerste lid kunnen gedeputeerde staten bepalen dat de projectprocedure, bedoeld in
      [afdeling 5.2 van de Omgevingswet][ref1], niet van toepassing is, indien is voldaan aan de minimumrealisatienorm,
      bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 9c.4
    text: |-
      In afwijking van het eerste lid kunnen gedeputeerde staten besluiten geen projectbesluit vast te stellen als
      naar hun oordeel besluitvorming door een bestuursorgaan van een gemeente het project kan versnellen of daaraan
      anderszins aanmerkelijke voordelen zijn verbonden, en het college van burgemeester en wethouders van de betreffende
      gemeente daarmee instemmen.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9c
  - number: 9c.5
    text: |-
      Gedeputeerde staten geven tegelijk met of zo snel mogelijk na de bekendmaking van een besluit als bedoeld in
      het vierde lid kennis van dat besluit op de in [artikel 12 van de Bekendmakingswet][ref1] bepaalde wijze en doen
      mededeling van dat besluit door toezending daarvan aan de initiatiefnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel12
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '12'
  - number: 9c.6
    text: Het vijfde lid is van overeenkomstige toepassing als een besluit als bedoeld in het vierde lid wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9c
  - number: 9h.1
    text: |-
      Een producent die elektriciteit levert met een directe lijn aan verbruikers van elektriciteit meldt zo spoedig
      mogelijk na ingebruikname van een directe lijn aan de Autoriteit Consument en Markt:
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9h
  - number: 9h.1.a
    text: zijn naam en adres;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9h
  - number: 9h.1.b
    text: een globale beschrijving van de directe lijn;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9h
  - number: 9h.1.c
    text: een aanduiding van de locatie waar de directe lijn zich bevindt.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9h
  - number: 9h.2
    text: |-
      De producent meldt een significante wijziging ten opzichte van een eerdere melding zo spoedig mogelijk na
      doorvoering van de betreffende wijziging aan de Autoriteit Consument en Markt. Onder een significante wijziging
      wordt in ieder geval verstaan een wijziging van het aantal aangeslotenen op de directe lijn, een wijziging van de
      eigenaar van de directe lijn of een wijziging in de eventuele verbinding met een net.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel9h
  - number: '10.1'
    text: |-
      Het landelijk hoogspanningsnet omvat de netten die bestemd zijn voor transport van elektriciteit op een
      spanningsniveau van 110 kV of hoger en die als zodanig worden bedreven, met uitzondering van het net op zee, en
      landsgrensoverschrijdende netten met wisselstroom.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10
  - number: '10.2'
    text: |-
      Onze Minister wijst op verzoek een naamloze of een besloten vennootschap voor tien jaar als netbeheerder van het
      landelijk hoogspanningsnet aan. Bij het verzoek wordt een besluit van de Autoriteit Consument en Markt overgelegd
      waaruit blijkt dat is voldaan aan het bepaalde bij of krachtens [artikel 10a, vierde lid][ref1], en [10b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel10b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 10a
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 10b
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '10.3'
    text: |-
      De Autoriteit Consument en Markt besluit op verzoek van degene die wenst te worden aangewezen als netbeheerder van
      het landelijk hoogspanningsnet of naar aanleiding van een situatie, bedoeld in het achtste lid, of is voldaan aan
      het bepaalde bij of krachtens [artikel 10a, vierde lid][ref1], en [10b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel10b
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 10a
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 10b
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '10.4'
    text: |-
      De Autoriteit Consument en Markt neemt de beschikking, bedoeld in het derde lid, overeenkomstig de procedure van
      artikel 10, vijfde en zesde lid, van de richtlijn en artikel 51 van [verordening 2019/943](32843R2019).
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10
  - number: '10.5'
    text: |-
      De Europese Commissie kan van een producent, een leverancier of de netbeheerder van het landelijk hoogspanningsnet
      de gegevens en inlichtingen verlangen die zij nodig heeft voor de uitvoering van artikel 10 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10
  - number: '10.6'
    text: |-
      Degene aan wie een verzoek is gedaan om gegevens en inlichtingen te verstrekken als bedoeld in het vijfde lid, is
      verplicht binnen de door de Europese Commissie gestelde redelijke termijn alle medewerking te verlenen die deze
      redelijkerwijs kan vorderen bij de uitoefening van haar bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10
  - number: '10.7'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet meldt de Autoriteit Consument en Markt omstandigheden die
      aanleiding kunnen geven tot herziening van de beschikking, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10
  - number: '10.8'
    text: 'De Autoriteit Consument en Markt kan de beschikking, bedoeld in het derde lid, wijzigen of intrekken:'
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10
  - number: 10.8.a
    text: naar aanleiding van een melding als bedoeld in het zevende lid;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10
  - number: 10.8.b
    text: naar aanleiding van gewijzigde omstandigheden;
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10
  - number: 10.8.c
    text: op verzoek van de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10
  - number: '10.9'
    text: |-
      Degene aan wie een ander net toebehoort dan het landelijk hoogspanningsnet of een landsgrensoverschrijdend net,
      wijst voor het beheer van dat net een of meer naamloze of besloten vennootschappen als netbeheerder aan.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10
  - number: '10.10'
    text: |-
      Een aanwijzing als bedoeld in het negende lid geldt voor een periode van tien jaar, te rekenen vanaf de dag waarop
      Onze Minister heeft ingestemd met de aanwijzing op grond van [artikel 12, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel12
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '10.11'
    text: |-
      Degene aan wie een net toebehoort, handelt als beheerder van dat net, indien daarvoor geen beheerder is
      aangewezen krachtens deze wet. De bij of krachtens deze wet aan een netbeheerder opgelegde verplichtingen zijn van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10
  - number: 10Aa.1
    text: |-
      [Artikel 10, tweede tot en met achtste lid][ref1], is van overeenkomstige toepassing voor de aanwijzing van een
      interconnector-beheerder, met dien verstande dat in afwijking van artikel 10, tweede lid, de interconnector-
      beheerder geen naamloze of besloten vennootschap behoeft te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10Aa
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 10Aa.2
    text: |-
      [Artikel 14, eerste tot en met derde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat in
      afwijking van artikel 14, eerste lid, de interconnector-beheerder geen naamloze of besloten vennootschap behoeft
      te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel14
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10Aa
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 10Aa.3
    text: |-
      Voor een interconnector-beheerder zijn uitsluitend de
      [artikelen 16, eerste lid, onderdeel a, b, j, k en l, tweede lid, onderdeel g, k en m en vijftiende lid][ref1],
      [24][ref2], [26a, eerste lid][ref3], [31a][ref4], [51][ref5], [52][ref6] en [79][ref7] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel26a
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel31a
      [ref5]: https://wetten.overheid.nl/BWBR0009755#Artikel51
      [ref6]: https://wetten.overheid.nl/BWBR0009755#Artikel52
      [ref7]: https://wetten.overheid.nl/BWBR0009755#Artikel79
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel10Aa
    references:
