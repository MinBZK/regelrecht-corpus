  - number: '12'
    text: |-
      1 De netbeheerder, niet zijnde de netbeheerder van het landelijk hoogspanningsnet, meldt aan Onze Minister
      onverwijld na zijn aanwijzing zijn naam en adres en de naam en het adres van zijn aandeelhouders en zendt aan Onze
      Minister een beschrijving van het net dat door hem zal worden beheerd. Ten minste eenmaal per jaar meldt hij aan
      Onze Minister iedere wijziging van de namen of adressen en zendt hij hem een beschrijving van de wijziging van het
      net dat door hem wordt beheerd.

      2 De aanwijzing behoeft de instemming van Onze Minister. Onze Minister onthoudt zijn instemming of kan
      voorschriften verbinden aan de instemming, indien niet is voldaan aan de [artikelen 10a][ref1], [10b][ref2],
      [11][ref3] of [11b][ref4] of indien de aangewezen netbeheerder in onvoldoende mate in staat zal zijn aan
      een verplichting als bedoeld in de [artikelen 17b][ref5], [18a][ref6] of [78][ref7] te voldoen, een taak
      als bedoeld in [artikel 16, eerste lid][ref8] of [17a][ref9] uit te voeren , een verbod als bedoeld in
      [artikel 17][ref10] of 17b na te leven dan wel, indien de netbeheerder deel uitmaakt van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref11], de met hem verbonden groepsmaatschappij niet voldoet
      aan het bepaalde bij of krachtens [artikel 17c][ref12].

      3 Indien Onze Minister voorschriften verbindt aan zijn instemming, strekken deze er slechts toe de geconstateerde
      tekortkomingen, bedoeld in het tweede lid, weg te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel10b
