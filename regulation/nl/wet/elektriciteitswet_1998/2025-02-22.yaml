  - number: '82'
    text: |-
      Een representatieve organisatie van partijen op de elektriciteitsmarkt wordt geacht belanghebbende te zijn bij een
      besluit, niet zijnde een beschikking, genomen op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel82
  - number: '83'
    text: |-
      Provinciale staten en de gemeenteraad zijn niet bevoegd het opwekken, het transporteren en het leveren van
      elektriciteit in het belang van de energievoorziening aan regels te binden.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel83
  - number: '84'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter uitvoering van een besluit op grond van het Verdrag betreffende de
      werking van de Europese Unie regels worden gesteld met betrekking tot:

      a. de tarieven en voorwaarden die interconnector-beheerders berekenen onderscheidenlijk in acht nemen bij het
      uitvoeren van transport van elektriciteit met behulp van een landsgrensoverschrijdend net;

      b. de voorwaarden die door een netbeheerder of een leverancier in het belang van de veiligheid en de doelmatigheid
      worden gesteld voor het leveren van elektriciteit of voor het aansluiten van toestellen of installaties die
      elektriciteit verbruiken.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel84
  - number: '85'
    text: |-
      1 Overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen regels is een door Onze Minister vast
      te stellen vergoeding verschuldigd voor het verlenen van instemming als bedoeld in [artikel 12, tweede lid][ref1],
      van een aanwijzing als bedoeld in [artikel 13][ref2], van een ontheffing als bedoeld in [artikel 86c][ref3], dan
      wel van een vergunning als bedoeld in [artikel 95d][ref4], welke vergoeding verschuldigd is voor ten hoogste de
      kosten van de bemoeiingen met betrekking tot de instemming, de aanwijzing, de ontheffing dan wel de vergunning.

      2 Onze Minister kan het verschuldigde bedrag invorderen bij dwangbevel. Ten aanzien van de in het eerste
      lid bedoelde vergoedingen is, voor zover al niet van toepassing, [titel 4.4][ref5], met uitzondering van de
      [artikelen 4:85][ref6] en [4:95, van de Algemene wet bestuursrecht][ref7] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel12
