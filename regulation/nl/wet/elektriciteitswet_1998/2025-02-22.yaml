  - number: 95f
    text: |-
      1 Onze Minister kan een vergunning intrekken, indien:

      a. de houder van de vergunning dit verzoekt;

      b. de houder van de vergunning in onvoldoende mate voldoet aan de verplichting, bedoeld in [artikel 95b][ref1];

      c. de houder van de vergunning de in de vergunning opgenomen voorschriften of opgelegde beperkingen niet nakomt;

      d. de houder van de vergunning bij de aanvraag onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking
      van juiste en volledige gegevens tot een andere beschikking op de aanvraag zou hebben geleid;

      e. de houder van de vergunning naar het oordeel van Onze Minister om andere redenen niet langer in staat moet
      worden geacht de vergunde activiteit of in de vergunning opgenomen voorschriften na te komen;

      f. de houder van de vergunning de voorschriften bij of krachtens de [artikelen 95k][ref2] en [95l][ref3] niet
      nakomt.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de tijdelijke
      voorzieningen en de procedure bij intrekking van een vergunning.


