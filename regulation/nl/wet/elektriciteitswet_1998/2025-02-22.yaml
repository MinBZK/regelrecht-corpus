  - number: 18a
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent een goed financieel beheer
      van de netbeheerder.

      2 De in het eerste lid bedoelde regels houden in ieder geval in dat

      a. de netbeheerder voldoet aan bij of krachtens die maatregel gestelde eisen aan zijn kredietwaardigheid waaronder
      de verhouding tussen vreemd vermogen en totaal vermogen, of dat

      b. de netbeheerder beschikt over een verklaring van een onafhankelijke deskundige ten aanzien van zijn
      kredietwaardigheid.

      3 In de in het eerste lid bedoelde maatregel kunnen tevens

      a. regels worden gesteld omtrent de wijze van berekening van vermogensonderdelen;

      b. eisen worden gesteld met betrekking tot de in het tweede lid, onderdeel b, bedoelde verklaring en de daar
      bedoelde deskundige.

      4 Indien de netbeheerder niet voldoet aan de regels, bedoeld in het eerste lid:

      a. stelt de netbeheerder de Autoriteit Consument en Markt hiervan onverwijld schriftelijk op de hoogte,

      b. stelt de netbeheerder binnen vier weken na de melding een herstelplan op waarin wordt beschreven op welke wijze
      hij het financieel beheer gaat verbeteren en zendt hij dit plan aan de Autoriteit Consument en Markt, en

      c. keert de netbeheerder geen dividend uit aan zijn aandeelhouders.

      5 De Autoriteit Consument en Markt kan de netbeheerder aanwijzingen geven met betrekking tot de verbetering van het
      financieel beheer.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel18a
  - number: '19'
    text: |-
      1 Een netbeheerder:

      a. hanteert een doeltreffend kwaliteitsborgingssysteem voor de uitvoering van de op grond van deze wet aan hem
      toegekende taken en

      b. beschikt over een document waarin is aangegeven op welke wijze hij uitvoering geeft aan onderdeel a.

      2 Onder een doeltreffend kwaliteitsborgingssysteem wordt verstaan het geheel van samenhangende plannen, processen
      en procedures dat een netbeheerder in staat stelt de kwaliteit van zijn net en de uitvoering van de op grond van
      deze wet aan hem toegekende taken te registreren, te monitoren en waar nodig bij te sturen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld, die kunnen verschillen voor
      verschillende netten, verschillende delen van netten met een verschillend spanningsniveau en verschillende
      netbeheerders, over:

      a. het kwaliteitsborgingsysteem;

      b. de onderwerpen die in het document, bedoeld in het eerste lid, onderdeel b, ten minste moeten zijn opgenomen;

      c. het verstrekken van gegevens en inlichtingen over het kwaliteitsborgingssysteem of het verstrekken van het
      document bedoeld in het eerste lid, onderdeel b, aan de Autoriteit Consument en Markt of aan Onze Minister;

      d. het bewaren en openbaar maken van gegevens over het kwaliteitsborgingssysteem of van het document bedoeld in het
      eerste lid;

      e. evaluatie van het kwaliteitsborgingssysteem.
    url: https://wetten.overheid.nl/BWBR0009755/2025-02-22#Artikel19
  - number: 19b
    text: |-
      1 De netbeheerder, met uitzondering van de netbeheerder van het landelijk hoogspanningsnet, verstrekt binnen zes
      maanden na afloop van ieder kalenderjaar aan de Autoriteit Consument en Markt:

      a. een overzicht van de door hem gesloten overeenkomsten met betrekking tot het verrichten van diensten ten behoeve
      van het netbeheer, vergezeld van afschriften van die overeenkomsten voorzover de Autoriteit Consument en Markt
      daarover niet reeds beschikt,

      b. een overzicht van het aantal personen dat bij de netbeheerder werkzaam is ter uitvoering van de in
      [artikel 16][ref1] en [16a][ref2] genoemde taken,

      c. een overzicht van in het afgelopen jaar gerealiseerde investeringen in het net,

      d. een overzicht van de financiële middelen waarover hij beschikt ten behoeve van de uitvoering van zijn wettelijke
      taken, waaruit blijkt welke financiële middelen voor de afzonderlijke taken beschikbaar zijn, en

      e. een verklaring van een onafhankelijke deskundige omtrent het in onderdeel d bedoelde overzicht.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de overzichten, bedoeld in het eerste
      lid, onderdelen a tot en met d, en de verklaring, bedoeld in het eerste lid, onderdeel e.

      3 De netbeheerder van het landelijk hoogspanningsnet verstrekt binnen zes maanden na afloop van ieder kalenderjaar
      aan de Autoriteit Consument en Markt een overzicht van de financiële middelen waarover hij beschikt ten behoeve
      van de uitvoering van zijn wettelijke taken, waaruit blijkt welke financiële middelen voor de afzonderlijke taken
      beschikbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16a
