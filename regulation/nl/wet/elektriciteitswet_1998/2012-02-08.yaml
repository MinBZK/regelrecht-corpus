  - number: 37a
    text: |-
      1 De raad van bestuur van de mededingingsautoriteit kan op aanvraag bij beschikking een ontheffing verlenen van
      de tariefstructuren en de voorwaarden. Bij zijn beslissing neemt de raad van bestuur van de mededingingsautoriteit
      de belangen als bedoeld in [artikel 36, eerste lid, onderdelen b tot en met f][ref1] en de regels, bedoeld in
      [artikel 36, eerste lid, onderdeel g][ref2], in acht.

      2 De raad van bestuur van de mededingingsautoriteit stelt beleidsregels op met betrekking tot de procedure voor
      aanvraag van een ontheffing. De beleidsregels worden bekendgemaakt in de Staatscourant.

      3 De raad van bestuur van de mededingingsautoriteit kan voorschriften en beperkingen verbinden aan de ontheffing.
      De raad van bestuur van de mededingingsautoriteit kan de voorschriften en de opgelegde beperkingen wijzigen.

      4 De raad van bestuur van de mededingingsautoriteit trekt de ontheffing in op daartoe strekkend schriftelijk
      verzoek van de houder van de ontheffing.

      5 De raad van bestuur van de mededingingsautoriteit kan een ontheffing intrekken, indien:

      a. de houder van de ontheffing de aan de ontheffing verbonden voorschriften of opgelegde beperkingen niet nakomt;

      b. de houder van de ontheffing bij de aanvraag onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking
      van juiste en volledige gegevens tot een andere beschikking op de aanvraag zou hebben geleid;

      c. de raad van bestuur van de mededingingsautoriteit, gelet op de belangen bedoeld
      in [artikel 36, eerste lid, onderdelen b tot en met f][ref3] en de regels, bedoeld in
      [artikel 36, eerste lid, onderdeel g][ref4], van oordeel is dat intrekking van de ontheffing noodzakelijk is.

      6 Een op grond van dit artikel genomen beschikking wordt bekendgemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel36
