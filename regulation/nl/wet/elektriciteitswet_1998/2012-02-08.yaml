        paragraaf: '2'
  - number: '79'
    text: |-
      1 Een netbeheerder die bij de uitvoering van zijn taak de beschikking krijgt over gegevens waarvan hij het
      vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, is verplicht tot geheimhouding van die gegevens,
      behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht, of uit zijn taak de noodzaak tot
      mededeling voortvloeit.

      2 Indien een netbeheerder gegevens over zijn bedrijfsvoering die commercieel voordeel kunnen opleveren ter
      beschikking stelt aan anderen, doet hij dit op niet-discriminatoire wijze.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel79
  - number: '80'
    text: |-
      1 Onze Minister zendt zo spoedig mogelijk na een juli 2006, en vervolgens telkens na vier jaar, aan de Staten-
      Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld over de inhoud van het verslag. Het verslag bevat
      in ieder geval een evaluatie van de doeltreffendheid en de effecten van de wet met betrekking tot:

      a. de voorzienings- en leveringszekerheid van elektriciteit;

      b. de marktordening en de marktwerking;

      c. mede gelet op de [Mededingingswet][ref1], het toezicht en de naleving.

      3 De Nederlandse Mededingingsautoriteit is belast met de uitvoering van de evaluatie.


      [ref1]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0008691
  - number: '81'
    text: |-
      De voordracht voor een krachtens [artikel 29][ref1], [30][ref2], [84][ref3] of [85][ref4] vast te stellen algemene
      maatregel van bestuur en voor een wijziging van een krachtens [artikel 20][ref5] vast te stellen algemene maatregel
      van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd.


