  - number: '36'
    text: |-
      1 De raad van bestuur van de mededingingsautoriteit stelt de tariefstructuren en voorwaarden vast met inachtneming
      van:

      a. het voorstel van de gezamenlijke netbeheerders als bedoeld in [artikel 27][ref1], [31][ref2] of [32][ref3] en de
      resultaten van het overleg, bedoeld in [artikel 33, eerste lid][ref4],

      b. het belang van het betrouwbaar, duurzaam, doelmatig en milieuhygiënisch verantwoord functioneren van de
      elektriciteitsvoorziening,

      c. het belang van de bevordering van de ontwikkeling van het handelsverkeer op de elektriciteitsmarkt,

      d. het belang van de bevordering van het doelmatig handelen van afnemers en

      e. het belang van een goede kwaliteit van de dienstverlening van netbeheerders, en

      f. het belang van een objectieve, transparante en niet discriminatoire handhaving van de energiebalans op een wijze
      die de kosten weerspiegelt, en

      g. de in [artikel 26b][ref5] bedoelde regels.

      2 De raad van bestuur van de mededingingsautoriteit stelt de voorwaarden niet vast dan nadat hij zich met
      inachtneming van artikel 5 van de richtlijn ervan vergewist heeft dat de voorwaarden de interoperabiliteit van
      de netten garanderen en objectief, evenredig en niet-discriminatoir zijn, alsmede voor zover dat op grond van de
      notificatierichtlijn noodzakelijk is, aan de Commissie van de Europese Gemeenschappen in ontwerp zijn meegedeeld en
      de van toepassing zijnde termijnen, bedoeld in artikel 9 van de notificatierichtlijn, zijn verstreken.

      3 Indien een voorstel als bedoeld in [artikel 27][ref6], [31][ref7] of [32][ref8] naar het oordeel van de raad
      van bestuur van de mededingingsautoriteit in strijd is met het belang, bedoeld in het eerste lid, onderdeel b, c,
      d, e of f, met de regels, bedoeld in het eerste lid, onderdeel g of of met de eisen, bedoeld in het tweede lid,
      draagt de raad van bestuur van de mededingingsautoriteit de gezamenlijke netbeheerders op het voorstel onverwijld
      zodanig te wijzigen dat deze strijd wordt opgeheven. [Artikel 4:15 van de Algemene wet bestuursrecht][ref9] is van
      overeenkomstige toepassing.

      4 Indien de gezamenlijke netbeheerders niet binnen vier weken het voorstel wijzigen overeenkomstig de opdracht
      van de raad van bestuur van de mededingingsautoriteit, bedoeld in het derde lid, stelt de raad van bestuur van de
      mededingingsautoriteit de tariefstructuren of de voorwaarden vast onder het aanbrengen van zodanige wijzigingen dat
      deze in overeenstemming zijn met de belangen, bedoeld in het eerste lid, onderdelen b tot en met f, met de regels,
      bedoeld in het eerste lid, onderdeel g of, en met de eisen, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
