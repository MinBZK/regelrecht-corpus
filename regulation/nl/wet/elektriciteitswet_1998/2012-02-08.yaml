        artikel: '51'
        hoofdstuk: '3'
        paragraaf: '8'
  - number: '53'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot een of meer voorwaarden, bedoeld in
      [artikel 54, eerste lid][ref1], waaronder in ieder geval regels over de verantwoording in de toelichting op de
      jaarrekening over het voldoen aan de voorwaarden die krachtens dit hoofdstuk zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel54
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '54'
        hoofdstuk: '4'
  - number: '54'
    text: |-
      1 Met inachtneming van de krachtens [artikel 53][ref1] vastgestelde regels zendt een representatief deel van
      de ondernemingen die zich bezighouden met het transporteren, leveren of meten van elektriciteit aan de raad van
      bestuur van de mededingingsautoriteit een voorstel voor de door hen jegens elkaar en afnemers in het kader van
      administratieve processen te hanteren voorwaarden met betrekking tot de wijze waarop de met die administratieve
      processen samenhangende gegevens worden vastgelegd, uitgewisseld of gebruikt of met betrekking tot de wijze waarop
      en de termijn waarbinnen die gegevens worden bewaard, waaronder in ieder geval voorwaarden die bepalen dat:

      a. bij een wisseling van leverancier, de beoogde leverancier, en

      b. bij een verhuizing, de leverancier van de afnemer

      verantwoordelijk is voor het verzamelen van de meetgegevens van de afnemer.

      2 Ondernemingen die een voorstel doen, voeren overleg over dit voorstel met representatieve organisaties van
      partijen op de elektriciteitsmarkt.

      3 In het voorstel dat aan de raad van bestuur van de mededingingsautoriteit wordt gezonden, geven de ondernemingen
      aan welke gevolgtrekkingen zij hebben verbonden aan de zienswijzen die de organisaties, bedoeld in het tweede lid,
      naar voren hebben gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel53
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '53'
        hoofdstuk: '4'
  - number: '55'
    text: |-
      De raad van bestuur van de mededingingsautoriteit stelt de voorwaarden vast met inachtneming van:

      a. het voorstel als bedoeld in [artikel 54, eerste lid][ref1],

      b. de resultaten van het overleg, bedoeld in [artikel 54, tweede lid][ref2],

      c. de regels, bedoeld in [artikel 53][ref3], en

      d. [artikel 36, eerste lid, onderdelen b tot en met f, en tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel36
