      1 Tegen een op grond van deze wet genomen besluit, met uitzondering van een besluit op grond van de
      [artikelen 77h][ref1] en [77i][ref2], kan een belanghebbende beroep instellen bij het College van beroep voor het
      bedrijfsleven.

      2 Indien beroep wordt ingesteld tegen een besluit op grond van de [artikelen 77h][ref3] en [77i][ref4] is, in
      afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref5], de rechtbank te Rotterdam bevoegd.

      3 Voor zover een door de raad van bestuur van de mededingingsautoriteit genomen besluit, genomen op grond
      van de [artikelen 36][ref6], [37][ref7], [41][ref8], [41c][ref9], [55][ref10], [56, tweede lid][ref11], en
      [57, derde en vierde lid][ref12] aangemerkt wordt als algemeen verbindend voorschrift, kan een belanghebbende
      beroep instellen bij het College van beroep voor het bedrijfsleven.

      4 Een representatieve organisatie van partijen op de elektriciteitsmarkt wordt geacht belanghebbende te zijn bij
      besluiten genomen op grond van deze wet.


