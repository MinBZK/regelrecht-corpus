  - number: 95c
    text: |-
      1 Bepalingen die zijn opgenomen in overeenkomsten inzake levering van elektriciteit aan afnemers die beschikken
      over een aansluiting op het net met een totale maximale doorlaatwaarde van ten hoogste 3*80A en die tot doel hebben
      de opwekking van duurzame elektriciteit te verbieden zijn onverbindend.

      2 Een houder van een vergunning is verplicht een aanbod van een afnemer als bedoeld in het eerste lid tot
      teruglevering van door hem geproduceerde duurzame elektriciteit te aanvaarden.

      3 Een houder van een vergunning betaalt de afnemer bedoeld in het eerste lid een redelijke vergoeding voor door hem
      aan het net geleverde duurzame elektriciteit.

      4 Bij algemene maatregel van het bestuur kunnen nadere regels worden gesteld omtrent de door een houder van een
      vergunning te betalen redelijke vergoeding bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel95c
  - number: 95d
    text: |-
      1 Onze Minister verleent op aanvraag een vergunning indien de aanvrager genoegzaam aantoont dat hij:

      a. beschikt over de benodigde organisatorische, financiële en technische kwaliteiten voor een goede uitvoering van
      zijn taak;

      b. redelijkerwijs in staat kan worden geacht de verplichtingen als opgenomen in dit hoofdstuk na te komen.

      2 Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de inhoud van en de procedure
      voor aanvraag van een vergunning en de criteria, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel95d
  - number: 95e
    text: |-
      1 Onze Minister kan voorschriften en beperkingen verbinden aan een vergunning.

      2 Onze Minister kan de aan een vergunning verbonden voorschriften of beperkingen wijzigen.

      3 Een vergunning kan slechts worden overgedragen aan een andere houder van een vergunning met toestemming van Onze
      Minister.

      4 [Artikel 95c][ref1] is van overeenkomstige toepassing ten aanzien van het verlenen van toestemming als bedoeld in
      het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95c
