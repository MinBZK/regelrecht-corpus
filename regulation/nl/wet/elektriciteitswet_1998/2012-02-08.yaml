      - id: ref2
        bwb_id: BWBR0009755
        artikel: '73'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '77'
    text: |-
      1 De garantiebeheerinstantie opent op aanvraag van een in Nederland gevestigde producent, leverancier, handelaar of
      afnemer een rekening.

      2 Bij de in het eerste lid bedoelde aanvraag overlegt de producent, leverancier, handelaar of afnemer het resultaat
      van de vaststelling, bedoeld in [artikel 16, eerste lid, onderdeel h][ref1].

      3 De garantiebeheerinstantie boekt op aanvraag garanties van oorsprong voor duurzame elektriciteit op een daarbij
      aangegeven rekening, indien een in Nederland gevestigde producent bij deze aanvraag de gegevens omtrent de door de
      netbeheerder of door een andere tot meten bevoegde instantie gemeten hoeveelheid duurzame elektriciteit overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 77a
    text: |-
      De garantiebeheerinstantie deelt iedere maand aan Onze Minister mee voor welke hoeveelheid duurzame elektriciteit
      overeenkomstig de bij of krachtens deze paragraaf gestelde bepalingen garanties van oorsprong voor duurzame
      elektriciteit zijn uitgegeven, alsmede op welke wijze de duurzame elektriciteit waarop die garanties van oorsprong
      voor duurzame elektriciteit betrekking hebben, is opgewekt.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel77a
  - number: 77b
    text: |-
      Waar in deze wet en de daarop berustende bepalingen wordt verwezen naar garanties van oorsprong voor duurzame
      elektriciteit, worden garanties van oorsprong voor duurzame elektriciteit uitgegeven door onafhankelijke instanties
      in een andere lidstaat van de Europese Unie, die naar aard en strekking overeenkomen met eerstbedoelde garanties
      van oorsprong voor duurzame elektriciteit, daarmee gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel77b
  - number: 77c
    text: |-
      Onze Minister stelt bij ministeriële regeling regels met betrekking tot:

      a. de informatie die door de garantiebeheerinstantie op grond van de [artikelen 75, eerste lid][ref1], en
      [77a][ref2] verstrekt wordt aan Onze Minister en die door producenten, leveranciers, handelaars, afnemers of
      netbeheerders verstrekt wordt aan de garantiebeheerinstantie;

      b. het uitgeven en de geldigheidsduur van garanties van oorsprong voor duurzame elektriciteit, het vermelden
      van gegevens op garanties van oorsprong voor duurzame elektriciteit en het in rekening brengen van de kosten die
      gepaard gaan met handelingen met betrekking tot garanties van oorsprong voor duurzame elektriciteit;

      c. de voorwaarden waaronder en de wijze waarop producenten, leveranciers, handelaars of afnemers gebruik kunnen
      maken van de door hen verkregen garanties van oorsprong voor duurzame elektriciteit of deze kunnen verhandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel77a
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel77c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '75'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 77a
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 77ca
    text: |-
      1 Ter stimulering van de productie van elektriciteit opgewekt in een installatie voor hoogrenderende
      warmtekrachtkoppeling bestaat een elektronisch systeem voor het uitgeven en innemen van garanties van oorsprong
      voor elektriciteit opgewekt in een installatie voor hoogrenderende warmtekrachtkoppeling.

      2 De [artikelen 73, tweede lid][ref1], [75][ref2] en [76][ref3] zijn van overeenkomstige toepassing.


