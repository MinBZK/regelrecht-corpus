  - number: '27'
    text: |-
      1 Met inachtneming van de in [artikel 26b][ref1] bedoelde regels zenden de gezamenlijke netbeheerders aan de raad
      van bestuur van de mededingingsautoriteit een voorstel met betrekking tot de door hen jegens afnemers te hanteren
      tariefstructuren dat de elementen en wijze van berekening beschrijft van het tarief waarvoor afnemers zullen worden
      aangesloten op een net, van het tarief waarvoor transport van elektriciteit, met inbegrip van de invoer, uitvoer en
      doorvoer van elektriciteit, ten behoeve van afnemers zal worden uitgevoerd, het tarief waarvoor de systeemdiensten
      worden verricht en de energiebalans wordt gehandhaafd en het tarief voor meting van elektriciteit bij afnemers als
      bedoeld in [artikel 95a, eerste lid][ref2].

      2 In de tariefstructuren wordt in ieder geval opgenomen dat:

      a. een afnemer recht heeft op een aansluiting op het door hem gewenste spanningsniveau, tenzij dit om technische
      redenen redelijkerwijs niet van de netbeheerder kan worden verlangd;

      b. een afnemer recht heeft op een vergoeding van de netbeheerder, indien op zijn aansluiting een aansluiting ten
      behoeve van een derde wordt gemaakt;

      c. een afnemer die beschikt over een aansluiting met meerdere verbindingen aangesloten op één of meer
      spanningsniveaus die vallen binnen dezelfde tariefcategorie voor de berekening van het transportafhankelijk
      transporttarief wordt geacht te beschikken over één aansluiting;

      d. iedere afnemer recht heeft te worden aangesloten op het dichtstbijzijnde punt in het net met een bij zijn
      aansluiting behorend spanningsniveau, met dien verstande dat een afnemer die een aansluiting op het net wenst met
      een aansluitwaarde groter dan 10 MVA, wordt aangesloten op het dichtstbijzijnde punt in het net waar voldoende
      netcapaciteit beschikbaar is;

      e. aanpassingen in het net die verband houden met het maken van een aansluiting komen voor rekening van de
      netbeheerder die het betreffende net beheert;

      f. een afnemer, niet zijnde een afnemer die een aansluiting op het net wenst met een aansluitwaarde groter dan 10
      MVA, recht heeft op een standaardaansluiting, waarbij de aansluitcapaciteit van deze aansluiting is gerelateerd aan
      de standaard gebruikte nominale aansluitspanning;

      g. het aansluittarief wordt gebaseerd op de grootte van de aansluitcapaciteit.

      3 De tarieven die de netbeheerder van het landelijk hoogspanningsnet in rekening brengt voor de handhaving van de
      energiebalans zijn objectief, transparant, niet-discriminatoir en weerspiegelen de kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel26b
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
