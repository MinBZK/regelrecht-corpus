  - number: 11a
    text: |-
      1 De [artikelen 155a][ref1], [158 tot en met 161a][ref2] en [164][ref3] dan wel [265a][ref4],
      [268 tot en met 271a][ref5] en [274 van Boek 2 van het Burgerlijk Wetboek][ref6] zijn van toepassing op de
      vennootschap die is aangewezen voor het beheer van het landelijk hoogspanningsnet en haar statuten worden
      dienovereenkomstig ingericht.

      2 Het is aan de vennootschap die is aangewezen voor het beheer van het landelijk hoogspanningsnet niet toegestaan
      haar statuten te wijzigen dan nadat aan de wijziging door Onze Minister goedkeuring is verleend. Onze Minister
      weigert goedkeuring indien de statuten na de wijziging niet in overeenstemming zijn met dit artikel.

      3 De leden van het bestuur en de meerderheid van de leden van de raad van commissarissen van de vennootschap
      die is aangewezen voor het beheer van het landelijk hoogspanningsnet hebben direct noch indirect binding met een
      rechtspersoon die de productie, aankoop of levering van gas of elektriciteit verricht of met een aandeelhouder van
      die rechtspersoon.

      4 Een lid van de raad van commissarissen van de vennootschap die is aangewezen voor het beheer van het landelijk
      hoogspanningsnet wordt niet benoemd dan nadat Onze Minister heeft ingestemd met het voornemen tot benoeming.

      5 Indien de vennootschap die is aangewezen voor het beheer van het landelijk hoogspanningsnet een afhankelijke
      maatschappij is in de zin van [artikel 152][ref7] of [artikel 262 van Boek 2 van het Burgerlijk Wetboek][ref8] is
      het eerste lid niet van toepassing.

      6 In het in het vijfde lid bedoelde geval:

      a. voldoet een rechtspersoon waarvan de netbeheerder van het landelijk hoogspanningsnet een afhankelijke
      maatschappij is aan de in het eerste tot en met vierde lid genoemde eisen;

      b. beschikt de raad van commissarissen van de rechtspersoon, bedoeld in onderdeel a, waarvan de netbeheerder
      van het landelijk hoogspanningsnet een afhankelijke maatschappij is over de bevoegdheden tot goedkeuring
      van de besluiten van het bestuur van de netbeheerder van het landelijk hoogspanningsnet, bedoeld in
      [artikel 164, eerste lid][ref9], of [artikel 274, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref10].


