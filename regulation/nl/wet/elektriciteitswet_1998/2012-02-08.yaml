  - number: 95b
    text: |-
      1 Een houder van een vergunning heeft de plicht op een betrouwbare wijze en tegen redelijke tarieven en voorwaarden
      zorg te dragen voor de levering van elektriciteit aan iedere in [artikel 95a, eerste lid][ref1], bedoelde afnemer
      die daarom verzoekt. De voorwaarden zijn in ieder geval niet redelijk als zij niet in overeenstemming zijn met het
      bepaalde bij of krachtens [artikel 95m][ref2]. [Artikel 26a, vijfde lid][ref3], is van overeenkomstige toepassing.

      2 Een houder van een vergunning verschaft de raad van bestuur van de mededingingsautoriteit ieder jaar en vier
      weken voor de wijziging van de tarieven een opgave van de tarieven die hij berekent en de voorwaarden die hij
      gebruikt bij de levering van elektriciteit aan de in [artikel 95a, eerste lid][ref4], bedoelde afnemers.

      3 Indien de raad van bestuur van de mededingingsautoriteit van oordeel is dat de tarieven die houders van een
      vergunning berekenen onredelijk zijn, omdat daarin de effecten van een doelmatige bedrijfsvoering, die mede inhoudt
      de inkoop van elektriciteit en van energiebronnen bestemd voor opwekking daarvan, in onvoldoende mate leiden tot
      kostenverlaging, kan hij een tarief vaststellen dat leveranciers ten hoogste mogen berekenen voor de levering van
      elektriciteit aan afnemers als bedoeld in [artikel 95a, eerste lid][ref5].

      4 Na de vaststelling van het maximumtarief, bedoeld in het derde lid, worden de tarieven voor de levering van
      elektriciteit aan afnemers als bedoeld in [artikel 95a, eerste lid][ref6] die hoger zijn dan dat maximumtarief, van
      rechtswege gesteld op dat maximumtarief.

      5 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de bepaling of de
      tarieven, bedoeld in het tweede lid, onredelijk zijn en tot vaststelling van het maximumtarief, bedoeld in het
      derde lid. De voordracht voor een krachtens dit lid vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      6 Het tweede tot en met het zesde lid vervallen op een bij koninklijk besluit te bepalen tijdstip. De voordracht
      voor een krachtens dit lid vast te stellen koninklijk besluit wordt niet eerder gedaan dan vier weken nadat het
      ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      7 Een netbeheerder en een vergunninghouder voeren een beleid, gericht op het voorkomen van het afsluiten van een
      afnemer als bedoeld in [artikel 95a, eerste lid][ref7], in het bijzonder in de periode van 1 oktober tot 1 april
      van enig jaar.

      8 Bij ministeriële regeling worden regels gesteld over het beëindigen van de levering van elektriciteit aan een
      afnemer als bedoeld in [artikel 95a, eerste lid][ref8], alsmede over preventieve maatregelen om de afsluiting van
      dergelijke afnemers zoveel mogelijk te voorkomen. Deze regels houden in ieder geval in dat een afnemer niet wordt
      afgesloten in de periode van 1 oktober tot 1 april van enig jaar, behoudens in gevallen die in de regeling zijn
      aangegeven.

      9 De in het achtste lid bedoelde preventieve maatregelen kunnen tevens inhouden dat in daarbij omschreven gevallen
      met in die regeling aangeduide instanties overleg wordt gepleegd alsmede dat in die gevallen aan de desbetreffende
      instantie in die regeling omschreven gegevens omtrent de afnemer worden verstrekt.

      10 De ministeriële regeling, bedoeld in het achtste lid, wordt niet eerder vastgesteld dan nadat de gezamenlijke
      netbeheerders en de vergunninghouders alsmede de consumentenorganisaties in de gelegenheid zijn gesteld hun
      zienswijze te geven over de inhoud van de regeling.

      11 Bij ministeriële regeling worden regels gesteld over het beperken van de levering van elektriciteit. Deze regels
      bepalen in elk geval wanneer en onder welke voorwaarden de levering van elektriciteit kan worden beperkt.


