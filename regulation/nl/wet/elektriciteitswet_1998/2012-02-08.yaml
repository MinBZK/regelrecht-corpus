  - number: 31c
    text: |-
      Voor afnemers als bedoeld in [artikel 95a, eerste lid][ref1], die elektriciteit invoeden op het net, berekent
      de leverancier de meterstand ten behoeve van de facturering en inning van de leveringskosten door de aan het net
      onttrokken elektriciteit te verminderen met de op het net ingevoede elektriciteit, met een maximum van 5000 kWh aan
      op het net ingevoede elektriciteit. Indien de hoeveelheid op het net ingevoede elektriciteit groter is dan 5000 kWh
      biedt de leverancier voor het meerdere een redelijke vergoeding op basis van [artikel 95c, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
