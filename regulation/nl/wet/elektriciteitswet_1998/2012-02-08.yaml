  - number: '31'
    text: |-
      1 Met inachtneming van de in [artikel 26b][ref1] bedoelde regels zenden de gezamenlijke netbeheerders aan de raad
      van bestuur van de mededingingsautoriteit een voorstel voor de door hen jegens afnemers te hanteren voorwaarden met
      betrekking tot:

      a. de wijze waarop netbeheerders en afnemers alsmede netbeheerders zich jegens elkaar gedragen ten aanzien van het
      in werking hebben van de netten, het voorzien van een aansluiting op het net en het uitvoeren van transport van
      elektriciteit over het net,

      b. de wijze waarop netbeheerders en afnemers alsmede netbeheerders zich jegens elkaar gedragen ten aanzien van het
      meten van gegevens betreffende het transport van elektriciteit en de uitwisseling van meetgegevens,

      c. de wijze waarop de netbeheerder van het landelijk hoogspanningsnet enerzijds en afnemers en de overige
      netbeheerders anderzijds zich jegens elkaar gedragen ten aanzien van de systeemdiensten,

      d. de gebiedsindeling van de netbeheerders,

      e. de regeling van de samenwerking tussen de netbeheerders ten aanzien van de uitvoering van de taken, bedoeld in
      de onderdelen a, b en c, alsmede ten behoeve van het waarborgen van het netbeheer van alle netten en het transport
      van elektriciteit in buitengewone omstandigheden,

      f. de kwaliteitscriteria waaraan netbeheerders moeten voldoen met betrekking tot hun dienstverlening, welke
      in ieder geval betrekking hebben op te hanteren technische specificaties, het verhelpen van storingen in het
      transport van elektriciteit, de betalingsvoorwaarden, de klantenservice en het voorzien in compensatie bij ernstige
      storingen,

      g. de wijze waarop de netbeheerder van het landelijk hoogspanningsnet uitvoering geeft aan zijn taak de
      leveringszekerheid te waarborgen en de wijze waarop productiereservecapaciteit wordt aangehouden en ingezet,

      h. de wijze waarop de netbeheerder afnemers die producent zijn objectief, transparant en niet-discriminatoir
      op het net aansluit, rekening houdend met de kosten en baten van de onderscheiden technieken met betrekking tot
      hernieuwbare energiebronnen, decentrale productie en warmtekrachtkoppeling,

      i. de wijze waarop de netbeheerder van het landelijk hoogspanningsnet jegens de andere netbeheerders en de afnemers
      de energiebalans handhaaft,

      j. het realiseren van koppelingen tussen en het verrichten van reparaties aan de netten,

      k. de wijze waarop de netbeheerder van het landelijk hoogspanningsnet enerzijds en afnemers en de overige
      netbeheerders anderzijds zich jegens elkaar gedragen ten aanzien van het verstrekken van informatie die
      noodzakelijk is voor een goede uitvoering van de Verordening en de daarop gebaseerde richtsnoeren.

      2 In de voorwaarden, bedoeld in het eerste lid, onderdeel c, worden in ieder geval voorwaarden opgenomen met
      betrekking tot de programma-verantwoordelijkheid, waarbij wordt bepaald dat de programma-verantwoordelijkheid kan
      worden overgedragen aan een ander, met uitzondering van een netbeheerder.

      3 In de voorwaarden, bedoeld in het eerste lid, onderdeel a, worden in ieder geval voorwaarden gesteld omtrent de
      eisen waaraan een bedrijf, dat de werkzaamheden bedoeld in [artikel 16c, eerste of vijfde lid][ref2], uitvoert,
      moet voldoen.

      4 In de voorwaarden, bedoeld in het eerste lid, onderdeel a, worden in ieder geval voorwaarden gesteld voor het
      bepalen van de omvang van de capaciteit voor het transport van elektriciteit over het landsgrensoverschrijdend
      net en voor het toewijzen van de beschikbare capaciteit op dat net, waaronder tevens begrepen wordt het veilen
      van capaciteit dan wel het volgens een andere marktconforme methode toewijzen van capaciteit, en het toewijzen van
      capaciteit die een afnemer niet gebruikt. De voorwaarden bevatten de nodige voorzieningen gericht op het voorkomen
      van belemmeringen voor goede marktwerking.

      5 De omvang van de capaciteit die toegewezen kan worden door middel van een veiling of een andere marktconforme
      methode is ten hoogste de totale omvang van de capaciteit voor het transport van elektriciteit over het
      landsgrensoverschrijdend net na aftrek van:

      a. de hoeveelheid capaciteit die de netbeheerder van het landelijk hoogspanningsnet reserveert om noodzakelijk
      transport van elektriciteit in het kader van onderlinge hulp en bijstand ten behoeve van de instandhouding van de
      integriteit van de netten te kunnen uitvoeren,

      b. de hoeveelheid capaciteit die de raad van bestuur van de mededingingsautoriteit op grond van [artikel 26][ref3]
      heeft bestemd voor bepaalde verzoekers om capaciteit voor het transport van elektriciteit, en

      c. de hoeveelheid capaciteit waarvoor Onze Minister ontheffing heeft verleend op grond van [artikel 86c][ref4].

      6 De netbeheerder van het landelijk hoogspanningsnet benut de opbrengst van het veilen of op een andere
      marktconforme methode toewijzen van capaciteit overeenkomstig de regeling, bedoeld in het vierde lid, voor het
      opheffen van beperkingen in de transportcapaciteit op het landsgrensoverschrijdende net dan wel voor andere, door
      de raad van bestuur van de mededingingsautoriteit te bepalen doelen.

      7 De netbeheerder van het landelijk hoogspanningsnet voert een afzonderlijke boekhouding met betrekking tot de
      opbrengst van het veilen of op een andere marktconforme methode toewijzen van capaciteit. [Artikel 43][ref5] is van
      overeenkomstige toepassing.

      8 De voorwaarden, bedoeld in het eerste lid, onderdeel g, kunnen mede betrekking hebben op de wijze waarop de
      netbeheerder van het landelijk hoogspanningsnet enerzijds en afnemers, leveranciers en de overige netbeheerders
      anderzijds zich jegens elkaar gedragen.

      9 Onze Minister kan, in aanvulling op de voorwaarden, bedoeld in het eerste lid, onderdeel b, en voorzover dit
      onderwerp geen regeling vindt in het bepaalde bij of krachtens [artikel 72m][ref6], nadere regels stellen over:

      a. de vaststelling, bedoeld in [artikel 16, eerste lid, onderdeel h][ref7];

      b. het meten, bedoeld in [artikel 16, eerste lid, onderdeel i][ref8], en [artikel 16a, tweede lid][ref9];

      c. het verstrekken van meetgegevens aan anderen dan genoemd in [artikel 16a, derde lid][ref10], met dien verstande
      dat meetgegevens slechts kunnen worden verstrekt aan leveranciers en handelaren met schriftelijke toestemming van
      de afnemer aan wie de meetgegevens toebehoren;

      d. het uitgeven van certificaten voor klimaatneutrale elektriciteit en elektriciteit opgewekt door middel van
      warmtekrachtkoppeling en het beheer van een certificatenrekening onderscheidenlijk het uitgeven van garanties van
      oorsprong voor duurzame elektriciteit en garanties van oorsprong voor elektriciteit opgewekt in een installatie
      voor hoogrenderende warmtekrachtkoppeling en het beheer van een rekening;

      e. de kosten voor de uitvoering van de onderdelen a tot en met d.

      10 De voorwaarden, bedoeld in het eerste lid, onderdeel f, bepalen dat een vordering tot betaling van een schuld
      van een afnemer ter zake van geleverde diensten als bedoeld in [artikel 27, eerste lid][ref11], wordt gedaan
      binnen twee jaren nadat de vordering opeisbaar is geworden en dat bij gebreke daarvan de vordering vervalt. De
      eerste volzin is niet van toepassing indien het uitblijven van bedoelde vordering, een onjuiste vordering daaronder
      begrepen, het rechtstreekse gevolg is van een daartoe gerichte opzettelijke gedraging van de afnemer.

      11 Tot de voorwaarden bedoeld in het eerste lid, onderdeel g, behoren in elk geval door de netbeheerder van
      het landelijk hoogspanningsnet vast te stellen minimale voorschriften en verplichtingen inzake operationele
      netwerkveiligheid waarvan deel uitmaakt de vaststelling van het niveau van voorzienbare omstandigheden waarin de
      operationele netwerkveiligheid gehandhaafd moet blijven.

      12 In de voorwaarden, bedoeld in het eerste lid, onderdelen a, f en g, wordt vastgelegd dat netten met een
      spanningsniveau van 110 kV of hoger zodanig zijn ontworpen en in werking zijn dat het transport van elektriciteit,
      ook indien zich een enkelvoudige storing voordoet, verzekerd is. Het transport van elektriciteit moet ook verzekerd
      zijn, als zich een enkelvoudige storing voordoet ten tijde van onderhoud.

      13 In afwijking van het twaalfde lid, tweede volzin, wordt voor netten met een spanningsniveau van 110 tot 220 kV
      in de voorwaarden, bedoeld in het eerste lid, onderdelen a, f en g, vastgelegd in welke gevallen deze bepaling niet
      toegepast hoeft te worden. Daarbij dient een onderbreking van het transport van elektriciteit altijd beperkt te
      blijven tot ten hoogste zes uren en 100 MW.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel26b
