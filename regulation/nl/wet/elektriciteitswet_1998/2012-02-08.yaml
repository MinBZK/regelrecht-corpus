  - number: 41e
    text: |-
      1 De tarieven voor diensten ter uitvoering van de taken, genoemd in [artikel 16, tweede lid][ref1], worden
      vastgesteld overeenkomstig dit artikel.

      2 Voor elke taak van de netbeheerder van het landelijk hoogspanningsnet, genoemd in [artikel 16, tweede lid][ref2],
      stelt de raad van bestuur van de mededingingsautoriteit de methode van regulering vast, voor een periode van
      ten minste drie en ten hoogste vijf jaar, na overleg met de gezamenlijke netbeheerders en met representatieve
      organisaties van partijen op de elektriciteitsmarkt en met inachtneming van het belang dat de doelmatigheid van de
      bedrijfsvoering en de meest doelmatige kwaliteit van uitvoering van deze taken worden bevorderd.

      3 De netbeheerder van het landelijk hoogspanningsnet zendt jaarlijks voor 1 oktober aan de raad van
      bestuur van de mededingingsautoriteit een voorstel voor de tarieven voor uitvoering van de taken, genoemd
      in [artikel 16, tweede lid][ref3], met inachtneming van de tariefstructuren vastgesteld op grond van
      [artikel 36][ref4] of [37][ref5].

      4 De raad van bestuur van de mededingingsautoriteit stelt de tarieven vast overeenkomstig
      [artikel 41c, eerste en tweede lid][ref6].

      5 Indien een voorstel niet binnen de termijn, bedoeld in het derde lid, aan de raad van bestuur van de
      mededingingsautoriteit is gezonden, stelt deze de tarieven uit eigen beweging vast met inachtneming van dit
      artikel.

      6 Indien een besluit op grond van het tweede lid bij onherroepelijke rechterlijke uitspraak is vernietigd of bij
      onherroepelijk besluit op bezwaar is herroepen, herberekent de raad van bestuur van de mededingingsautoriteit
      de tarieven, bedoeld in het vierde lid, met toepassing van de met inachtneming van die uitspraak of dat besluit
      op bezwaar gecorrigeerde methode en verdisconteert hij de uitkomsten van deze herberekening in de eerstvolgende
      op grond van het vierde lid vast te stellen tarieven. Daarbij worden deze herberekening en de wijze waarop de
      uitkomsten daarvan in de tarieven verdisconteerd zijn separaat weergegeven.


