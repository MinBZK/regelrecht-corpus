    text: |-
      1 Een beschikking tot oplegging van een last onder dwangsom of een bestuurlijke boete wordt, nadat zij bekend is
      gemaakt, ter inzage gelegd bij de raad van bestuur van de mededingingsautoriteit.

      2 Van de beschikking wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel77o
  - number: 77q
    text: Verzet schorst de tenuitvoerlegging van een dwangbevel dat strekt tot invordering van de bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel77q
  - number: '78'
    text: |-
      1 Onze Minister kan verlangen dat een producent, een leverancier, een handelaar, een netbeheerder, een
      elektriciteits- of gasbeurs of een afnemer hem inzage geeft in gegevens en bescheiden, onderscheidenlijk gegevens
      en inlichtingen verstrekt die hij nodig heeft voor de uitvoering van de hem in deze wet opgedragen taken.

      2 Degene aan wie een verzoek is gedaan inzage te geven in gegevens en bescheiden, onderscheidenlijk gegevens en
      inlichtingen te verstrekken, is verplicht binnen de door Onze Minister gestelde redelijke termijn alle medewerking
      te verlenen die deze redelijkerwijze kan vorderen bij de uitoefening van zijn bevoegdheden.

      3 Onze Minister gebruikt bescheiden, gegevens of inlichtingen over een producent, een leverancier, een handelaar,
      een netbeheerder, een elektriciteits- of gasbeurs of een afnemer, welke hij heeft verkregen in verband met enige
      werkzaamheid ten behoeve van de uitvoering van een van zijn taken op grond van deze wet, uitsluitend voor de
      toepassing van deze wet.

      4 Indien Onze Minister op grond van [artikel 16, tweede lid, onderdeel f][ref1], de netbeheerder van het landelijk
      hoogspanningsnet opdraagt werkzaamheden te verrichten ter uitvoering van de taak, bedoeld in [artikel 4a][ref2],
      zijn het eerste tot en met het derde lid van overeenkomstige toepassing op die netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel4a
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel78
