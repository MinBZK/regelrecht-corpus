  - number: 95o
    text: |-
      1 De leverancier voorziet in een transparante, eenvoudige en goedkope procedure voor de behandeling van klachten
      van afnemers als bedoeld in [artikel 95a, eerste lid][ref1], over de levering.

      2 De in het eerste lid bedoelde procedure voorziet er voorts in dat:

      a. de behandeling van de klacht geschiedt door een persoon die niet bij de gedraging waarop de klacht betrekking
      heeft, betrokken is geweest,

      b. de klager schriftelijk en gemotiveerd in kennis wordt gesteld van de bevindingen naar aanleiding van de klacht
      en van de conclusies die daaraan worden verbonden en

      c. de klacht zo spoedig mogelijk doch uiterlijk binnen acht weken wordt afgehandeld.

      3. Indien een leverancier van een afnemer als bedoeld in [artikel 95a, eerste lid][ref2], een klacht of vraag
      ontvangt over het netbeheer, zendt de leverancier deze onverwijld door naar de netbeheerder op wie de klacht of
      vraag betrekking heeft, onder gelijktijdige mededeling daarvan aan de klager of de vrager.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
