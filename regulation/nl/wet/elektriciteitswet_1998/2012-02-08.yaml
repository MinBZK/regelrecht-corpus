      De raad van bestuur van de mededingingsautoriteit verrekent de kosten van een investering waarvoor op grond
      van [artikel 3.28 van de Wet ruimtelijke ordening][ref1] een inpassingsplan is vastgesteld of projectbesluit is
      genomen, in de tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.28
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel20d
