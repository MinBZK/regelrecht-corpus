  - number: 16Aa
    text: |-
      1 Een netbeheerder verricht de werkzaamheden ter uitvoering van de taken, bedoeld in
      [artikel 16, eerste en tweede lid][ref1], in eigen beheer of tezamen met een of meer andere netbeheerders.

      2 In afwijking van het eerste lid kunnen de navolgende werkzaamheden worden uitbesteed:

      a. feitelijke werkzaamheden in verband met de aanleg, het onderhoud en de reparatie van het net;

      b. inspecties van netten met het oog op de veiligheid;

      c. speur- en ontwikkelingswerk ten behoeve van de aanleg, het onderhoud en de reparatie van het net;

      d. de werkzaamheden ter uitvoering van
      [artikel 16, eerste lid, onderdelen n, o en p, en het tweede lid, onderdeel e][ref2].

      3 Ingeval van uitbesteding van werkzaamheden als bedoeld in het tweede lid:

      a. behoudt de netbeheerder de verantwoordelijkheid voor de volledige en juiste uitvoering van de desbetreffende
      taken,

      b. draagt de netbeheerder er zorg voor dat de regels die krachtens [artikel 11b, eerste lid][ref3], zijn gesteld
      met betrekking tot het voorkomen van discriminatie bij de uitoefening van zijn taken en bevoegdheden, van
      overeenkomstige toepassing zijn bij het verrichten van de uitbestede werkzaamheden en

      c. draagt de netbeheerder er zorg voor dat in de overeenkomst tot uitbesteding de wijze waarop de kosten voor de
      desbetreffende werkzaamheden worden berekend, wordt vastgelegd.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het derde lid, onderdelen a, b
      en c.


