  - number: 5b
    text: |-
      1 De raad van bestuur van de mededingingsautoriteit stelt een handhavingsplan op. Het plan beschrijft de
      procedure en de wijze waarop de raad van bestuur van de mededingingsautoriteit zijn in deze wet toegekende
      handhavingsbevoegdheden toepast.

      2 Het handhavingsplan behoeft goedkeuring van Onze Minister.

      3 Het besluit tot goedkeuring wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel5b
  - number: '7'
    text: |-
      1 De raad van bestuur van de mededingingsautoriteit kan van een producent, een leverancier, een handelaar, een
      netbeheerder, een elektriciteits- of gasbeurs of een afnemer de gegevens en inlichtingen verlangen die hij nodig
      heeft voor uitvoering van de hem in deze wet opgedragen taken.

      2 Degene aan wie een verzoek is gedaan om gegevens en inlichtingen te verstrekken, is verplicht binnen de door de
      raad van bestuur van de mededingingsautoriteit gestelde redelijke termijn alle medewerking te verlenen die deze
      redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden.

      3 Gegevens of inlichtingen omtrent een producent, een leverancier, een handelaar, een netbeheerder,
      een elektriciteits- of gasbeurs of een afnemer, welke in verband met enige werkzaamheid ten behoeve
      van de uitvoering van deze wet zijn verkregen, mogen uitsluitend voor de toepassing van deze wet,
      de [Mededingingswet][ref1] en de [Gaswet][ref2] en voor de toepassing van [artikelen 4.4][ref3] en
      [4.5 van de Wet handhaving consumentenbescherming][ref4] worden gebruikt.

      4 In afwijking van het derde lid is de raad van bestuur van de mededingingsautoriteit bevoegd gegevens en
      inlichtingen, verkregen ingevolge het eerste lid, te verstrekken aan:

      a. een buitenlandse instelling, die op grond van nationale wettelijke regels is belast met de toepassing van de
      regels op het gebied van elektriciteit, voor zover die gegevens en inlichtingen van betekenis zijn of kunnen zijn
      voor de uitoefening van de taak van die instelling;

      b. een bestuursorgaan dat op grond van deze wet of van een andere wettelijke regeling dan deze wet is belast met
      taken die de toepassing of mede de toepassing van bepalingen op het gebied van elektriciteit betreffen, voor zover
      die gegevens en inlichtingen van betekenis kunnen zijn voor de uitoefening van de taak van dat bestuursorgaan.

      5 Op basis van het vierde lid kunnen uitsluitend gegevens en inlichtingen worden verstrekt indien:

      a. de geheimhouding van de gegevens en inlichtingen in voldoende mate is gewaarborgd, en

      b. voldoende is gewaarborgd dat de gegevens en inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0008691
      [ref2]: https://wetten.overheid.nl/BWBR0011440
      [ref3]: https://wetten.overheid.nl/BWBR0020586#Artikel4.4
      [ref4]: https://wetten.overheid.nl/BWBR0020586#Artikel4.5
