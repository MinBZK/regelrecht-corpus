  - number: '38'
    text: |-
      1 De tariefstructuren en de voorwaarden treden in werking op een door de raad van bestuur van de
      mededingingsautoriteit te bepalen datum en gelden voor onbepaalde tijd.

      2 Van de besluiten betreffende de vaststelling van de tariefstructuren en de voorwaarden alsmede de wijziging
      daarvan wordt mededeling gedaan door plaatsing in de Staatscourant.

      3 Iedere netbeheerder legt een exemplaar van de tariefstructuren en de voorwaarden voor een ieder ter inzage in al
      zijn vestigingen.

      4 Na de vaststelling van de voorwaarden gelden deze als minimumeisen voor de technische veiligheid en voor het
      technisch ontwerp en de exploitatie van de installaties en netten, bedoeld in artikel 5 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel38
  - number: '39'
    text: |-
      1 Netbeheerders zenden de raad van bestuur van de mededingingsautoriteit voor 1 maart van elk jaar een rapportage
      omtrent de naleving door hen van de kwaliteitscriteria, bedoeld in [artikel 31, eerste lid, onderdeel f][ref1].

      2 De raad van bestuur van de mededingingsautoriteit vermeldt de bevindingen die hij ontleent aan rapportages als
      bedoeld in het eerste lid in het verslag, bedoeld in [artikel 9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel31
