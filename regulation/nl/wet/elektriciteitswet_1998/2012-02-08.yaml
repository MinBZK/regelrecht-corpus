  - number: 95l
    text: |-
      1 In dit artikel wordt onder milieugevolgen ten minste verstaan: de uitstoot van koolstofdioxide en radioactief
      afval.

      2 De leverancier geeft ten minste eenmaal per kalenderjaar aan zijn eindafnemers een keuze van energiebronnen die
      hij zal gebruiken, onder vermelding van de milieugevolgen die te verwachten zijn van elektriciteitsproductie met
      die energiebronnen.

      3 Eindafnemers maken een keuze uit het aanbod van de leverancier en maken deze keuze bekend aan de leverancier.

      4 Indien een eindafnemer binnen de door de leverancier gestelde termijn geen keuze maakt, levert de leverancier de
      door hem gekozen elektriciteit aan de eindafnemer.

      5 Een producent of een handelaar geeft aan een leverancier een keuze van energiebronnen waaruit hij elektriciteit
      kan krijgen, onder vermelding van de milieugevolgen die te verwachten zijn van elektriciteitsproductie met die
      energiebronnen.

      6 Een producent of handelaar meldt aan de leverancier het aandeel van elke energiebron waaruit de leverancier
      elektriciteit heeft gekregen en de milieugevolgen van de elektriciteitsproductie met die energiebronnen.

      7 De leverancier meldt op of bij de rekening aan de eindafnemer het aandeel van elke energiebron die de leverancier
      heeft gebruikt voor levering aan die afnemer en de milieugevolgen van de elektriciteitsproductie met die
      energiebronnen.

      8 Onze Minister kan nadere regels stellen met betrekking tot de wijze waarop:

      a. de betrouwbaarheid van de informatie van een producent of handelaar aan de leverancier ten minste wordt
      gewaarborgd;

      b. de betrouwbaarheid van de informatie van de leverancier aan de eindafnemer ten minste wordt gewaarborgd.

      9 Dit artikel treedt in werking met ingang van 1 januari 2007, dan wel op een eerder, bij koninklijk besluit te
      bepalen datum.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel95l
  - number: 95la
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de eisen waaraan een meetinrichting,
      die moet voldoen aan dit artikel, ten minste voldoet, welke eisen kunnen verschillen per categorie afnemers.

      2 De in het eerste lid bedoelde algemene maatregel van bestuur stelt ten minste eisen betreffende de
      functionaliteiten van de meetinrichting.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels wordt gesteld over meetinrichtingen,
      waaronder in elk geval regels over de installatie van meetinrichtingen en regels over de administratie in verband
      met het vervangen, installeren of verwijderen van meetinrichtingen.

      4 De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel van bestuur wordt niet gedaan
      dan nadat het ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen
      vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister van
      Economische Zaken te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-
      Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel95la
  - number: 95lb
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. de inrichting van facturen inzake het verbruik van elektriciteit,

      b. de frequentie van facturen inzake het verbruik van elektriciteit,

      c. het verstrekken van gegevens over het verbruik van elektriciteit en

      d. degenen die de informatie, bedoeld in de onderdelen a, b en c, verstrekken, welke regels kunnen verschillen per
      categorie van ontvangers van de informatie, bedoeld in de onderdelen a, b en c.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel95lb
  - number: 95lc
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de informatie die netbeheerders,
      leveranciers of handelaren verstrekken in contracten, rekeningen of ontvangstbewijzen, welke regels per categorie
      afnemers kunnen verschillen.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel95lc
  - number: 95ld
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel95ld
  - number: 95m
    text: |-
      1 De voorwaarden, verbonden aan een leverings- of transportovereenkomst met een afnemer als bedoeld in
      [artikel 95a, eerste lid][ref1], zijn transparant, eerlijk en vooraf bekend. De voorwaarden worden in ieder geval
      voor het sluiten van de overeenkomst verstrekt en zijn gesteld in duidelijke en begrijpelijke taal.

      2 Leveranciers en netbeheerders zorgen ervoor dat afnemers als bedoeld in [artikel 95a, eerste lid][ref2], te allen
      tijde transparante informatie kunnen verkrijgen over de geldende tarieven en voorwaarden voor levering en transport
      van elektriciteit.

      3 Het is verboden voor de houder van een vergunning om op zodanige wijze afnemers als bedoeld in
      [artikel 95a, eerste lid][ref3], te benaderen dat onduidelijkheid bestaat over het feit dat een contract is
      afgesloten, de duur van het contract, de voorwaarden voor verlenging en beëindiging van het contract, het bestaan
      van een recht op opzegging en de voorwaarden van opzegging.

      4 Een contract, gesloten in strijd met het bepaalde bij of krachtens dit artikel is vernietigbaar.

      5 Een leverancier biedt een afnemer als bedoeld in [artikel 95a, eerste lid][ref4], ten minste een overeenkomst
      voor de levering van elektriciteit voor een onbepaalde duur aan.

      6 Indien de afnemer als bedoeld in [artikel 95a, eerste lid][ref5], geen uitdrukkelijke keuze maakt voor een
      overeenkomst voor bepaalde duur, wordt hij geacht gekozen te hebben voor een overeenkomst voor onbepaalde duur.

      7 Een afnemer als bedoeld in [artikel 95a, eerste lid][ref6], kan elke overeenkomst tot levering van elektriciteit
      beëindigen met inachtneming van een termijn van dertig dagen.

      8 Indien sprake is van een overeenkomst voor bepaalde duur, kan de leverancier in deze overeenkomst opnemen dat bij
      tussentijdse beëindiging van de overeenkomst de afnemer een redelijke vergoeding is verschuldigd. Indien sprake is
      van een overeenkomst voor onbepaalde duur, kan een dergelijke vergoeding niet in de overeenkomst worden opgenomen.

      9 Bij ministeriële regeling worden ter implementatie van de richtlijn nadere regels gesteld over bescherming van
      afnemers als bedoeld in [artikel 95a, eerste lid][ref7].


