  - number: '68'
    text: |-
      1 Producenten en leveranciers hebben tot taak, mede gelet op het belang van de bescherming van het milieu, bedoeld
      in artikel 3, tweede lid, van de richtlijn, te bevorderen dat elektriciteit door henzelf en door afnemers op een
      doelmatige en milieuhygiënisch verantwoorde wijze wordt geproduceerd of gebruikt.

      2 Iedere producent of leverancier die per jaar gemiddeld 10 GWh of meer levert meldt eenmaal in elke twee jaar vóór
      1 maart aan Onze Minister op welke wijze hij in de twee jaar voorafgaande aan het jaar, waarin de melding wordt
      verricht, uitvoering heeft gegeven aan zijn taak, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel68
  - number: '73'
    text: |-
      1 Ter stimulering van de productie van duurzame elektriciteit bestaat een elektronisch systeem voor het uitgeven en
      innemen van garanties van oorsprong voor duurzame elektriciteit.

      2 Onze Minister wijst steeds voor een periode van tien jaar een instantie aan die onafhankelijk is van producenten,
      leveranciers en handelaren en die op aanvraag van een producent een garantie van oorsprong uitgeeft.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel73
  - number: '74'
    text: |-
      Een garantie van oorsprong voor duurzame elektriciteit toont bij uitsluiting aan dat de daarop aangegeven
      hoeveelheid elektriciteit op duurzame wijze is opgewekt.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel74
  - number: '75'
    text: |-
      1 De garantiebeheerinstantie verstrekt desgevraagd kosteloos aan Onze Minister de voor de uitoefening van zijn taak
      benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden voor zover dat voor
      de vervulling van zijn taak redelijkerwijs noodzakelijk is.

      2 De garantiebeheerinstantie zendt Onze Minister jaarlijks een verslag betreffende de door de instantie krachtens
      de aanwijzing, bedoeld in artikel 73, tweede lid, uitgevoerde taken en de werkwijze in het afgelopen jaar.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel75
  - number: '76'
    text: |-
      1 De garantiebeheerinstantie doet onverwijld mededeling aan Onze Minister:

      a. van omstandigheden die een wijziging inhouden van de voorwaarden op grond waarvan deze instantie is aangewezen;

      b. indien de instantie voornemens is een of meer van de taken die zij krachtens de aanwijzing, bedoeld in
      [artikel 73, tweede lid][ref1], uitvoert, te beëindigen.

      2 Onze Minister kan een aanwijzing als bedoeld in [artikel 73, tweede lid][ref2], opschorten of intrekken
      indien, naar zijn oordeel, de garantiebeheerinstantie niet of niet volledig voldoet aan de bij of krachtens
      deze wet gestelde voorschriften. Gedurende de periode van een opschorting treft Onze Minister de noodzakelijke
      voorzieningen.

      3 Onze Minister kan de in het vorige lid bedoelde opschorting opheffen indien de garantiebeheerinstantie weer
      voldoet aan de in het vorige lid bedoelde voorschriften. In dat geval vervallen de in het vorige lid bedoelde
      voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel73
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '73'
        hoofdstuk: '5'
