  - number: 9e
    text: |-
      1 Provinciale staten zijn bevoegd voor de aanleg of uitbreiding van een productie-installatie voor opwekking
      van duurzame elektriciteit met behulp van windenergie met een capaciteit van ten minste 5 maar niet meer dan
      100 MW, met inbegrip van de aansluiting van die installatie op een net, gronden aan te wijzen en daarvoor een
      inpassingsplan als bedoeld in [artikel 3.26, eerste lid, van de Wet ruimtelijke ordening][ref1] vast te stellen. De
      gemeenteraad is voor de duur van tien jaren na de vaststelling van het inpassingsplan niet bevoegd voor die gronden
      een bestemmingsplan vast te stellen.

      2 Provinciale staten geven in ieder geval toepassing aan de bevoegdheid op grond van het eerste lid indien een
      producent een voornemen tot de aanleg of uitbreiding van een productie-installatie als bedoeld in het eerste lid
      schriftelijk bij hen heeft gemeld en de betrokken gemeente een aanvraag van die producent tot vaststelling dan wel
      wijziging van een bestemmingplan ten behoeve van de realisatie van dat voornemen heeft afgewezen. Voor het doen van
      de melding en de daarbij te verstrekken gegevens kunnen provinciale staten een formulier vaststellen.

      3 [Artikel 3.26, tweede en derde lid, van de Wet ruimtelijke ordening][ref2] is van overeenkomstige toepassing.
      Artikel 3.26, vijfde lid, van de Wet ruimtelijke ordening is niet van toepassing.

      4 Indien provinciale staten toepassing geven aan de in het eerste lid bedoelde bevoegdheid,
      oefenen gedeputeerde staten de bevoegdheden en voeren de verplichtingen, bedoeld in
      [artikel 3.6, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref3] uit en
      beslissen op een aanvraag om een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, b, c of g, van die wet][ref4]. Gedeputeerde staten zenden terstond een afschrift
      aan burgemeester en wethouders van beschikkingen die zijn gegeven met toepassing van de bevoegdheden, bedoeld in de
      eerste volzin.

      5 Het tweede lid is niet van toepassing indien is voldaan aan de krachtens het zesde lid voor die provincie
      gestelde minimum realisatienorm.

      6 Bij algemene maatregel van bestuur op voordracht van Onze Minister wordt per provincie een minimum realisatienorm
      vastgesteld. De voordracht voor de algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het
      ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.26
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3.26
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel3.6
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
