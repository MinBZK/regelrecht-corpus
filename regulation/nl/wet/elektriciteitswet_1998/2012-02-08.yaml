  - number: 26ab
    text: |-
      1 Een netbeheerder verzamelt uitsluitend meetgegevens betreffende afnemers als bedoeld in
      [artikel 95a, eerste lid][ref1], indien:

      a. dit noodzakelijk is voor de taken van de leverancier met betrekking tot:

      1°. het verstrekken van informatie inzake het verbruik van elektriciteit op grond van [artikel 95lb][ref2],

      2°. facturering,

      3°. verhuizingen,

      4°. wisselingen van leverancier,

      b. dit noodzakelijk is voor de taken van de netbeheerder, genoemd in [artikel 16, eerste lid][ref3] of

      c. deze gegevens op basis van het tweede tot en met vijfde lid verstrekt worden.

      2 Een netbeheerder verleent een leverancier toegang tot meetgegevens betreffende afnemers als bedoeld in
      [artikel 95a, eerste lid][ref4], voor zover het gaat om meetgegevens betreffende afnemers van die leverancier.

      3 In afwijking van het tweede lid verleent een netbeheerder een leverancier uitsluitend toegang tot meetgegevens
      die betrekking hebben op een kleiner tijdsbestek dan een dag, voor zover die leverancier de desbetreffende
      meetgegevens op basis van [artikel 8, onderdeel a, van de Wet bescherming persoonsgegevens][ref5] mag verwerken.

      4 Een netbeheerder verleent een derde uitsluitend toegang tot meetgegevens betreffende afnemers als
      bedoeld in [artikel 95a, eerste lid][ref6], voorzover die derde de desbetreffende meetgegevens op basis van
      [artikel 8, onderdeel a, van de Wet bescherming persoonsgegevens][ref7] mag verwerken.

      5 Meetgegevens per kwartier en per dag worden door de netbeheerder dagelijks om niet beschikbaar gesteld. Overige
      meetgegevens worden door de netbeheerder tegen een vergoeding van de daaraan verbonden kosten beschikbaar gesteld.


