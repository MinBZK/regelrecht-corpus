  - number: '59'
    text: |-
      1 De door de raad van bestuur van de mededingingsautoriteit op basis van [artikel 31, eerste lid][ref1], op 6 maart
      2007 vastgestelde informatiecode (Stcrt. 2007, 49) wordt op het tijdstip van inwerkingtreding van dit hoofdstuk
      aangemerkt als voorwaarden die overeenkomstig dit hoofdstuk zijn vastgesteld.

      2 Uiterlijk 12 weken na inwerkingtreding van dit hoofdstuk ontvangt de raad van bestuur van de
      mededingingsautoriteit een voorstel als bedoeld in [artikel 54, eerste lid][ref2], dat tot doel heeft de in het
      eerste lid bedoelde informatiecode uit te breiden tot voorwaarden voor alle soorten ondernemingen, genoemd in
      artikel 54, eerste lid.


