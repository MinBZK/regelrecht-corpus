  - number: 41b
    text: |-
      1 Iedere netbeheerder zendt jaarlijks voor 1 oktober aan de raad van bestuur van de mededingingsautoriteit een
      voorstel voor de tarieven die deze netbeheerder ten hoogste zal berekenen voor de uitvoering van de taken genoemd
      in [artikel 16, eerste lid][ref1], met uitzondering van onderdeel p, met inachtneming van:

      a. het uitgangspunt dat de kosten worden toegerekend aan de tariefdragers betreffende de diensten die deze kosten
      veroorzaken,

      b. de tariefstructuren vastgesteld op grond van [artikel 36][ref2] of [37][ref3],

      c. het bepaalde bij of krachtens [artikel 41a][ref4],

      d. de formule

      waarbij

      TI = de totale inkomsten uit de tarieven in het jaar t, te weten de som van de vermenigvuldiging van elk tarief
      in jaar t en het op basis van [artikel 41a, eerste lid, onderdeel c][ref5], vastgestelde rekenvolume van elke
      tariefdrager waarvoor een tarief wordt vastgesteld;

      TI = de totale inkomsten uit de tarieven in het jaar voorafgaande aan het jaar t, te weten de som van de
      vermenigvuldiging van elk tarief in jaar t-1 en het op basis van [artikel 41a, eerste lid, onderdeel c][ref6],
      vastgestelde rekenvolume van elke tariefdrager waarvoor een tarief wordt vastgesteld;

      cpi = de relatieve wijziging van de consumentenprijsindex (alle huishoudens), berekend uit het quotiënt van deze
      prijsindex, gepubliceerd in de vierde maand voorafgaande aan het jaar t, en van deze prijsindex, gepubliceerd in de
      zestiende maand voorafgaande aan het jaar t, zoals deze maandelijks wordt vastgesteld door het Centraal Bureau voor
      de Statistiek;

      x = de korting ter bevordering van de doelmatige bedrijfsvoering;

      q = de kwaliteitsterm, die de aanpassing van de tarieven in verband met de geleverde kwaliteit aangeeft;

      e. de gemaakte kosten voor investeringen, bedoeld in [artikel 20d][ref7] of [20e, tweede of derde lid][ref8], voor
      zover de kosten doelmatig zijn en

      f.

      2 De geschatte kosten die een netbeheerder voor de uitvoering van de taken genoemd in
      [artikel 16, eerste lid][ref9], bij een andere netbeheerder in rekening zal brengen, worden zonder toepassing van
      de formule, bedoeld in het eerste lid, onder d, toegevoegd aan de totale inkomsten uit de tarieven van deze andere
      netbeheerder. Het verschil tussen de geschatte en gerealiseerde kosten wordt betrokken bij de vaststelling van de
      totale inkomsten uit de tarieven van de andere netbeheerder in een volgend jaar.

      3 De raad van bestuur van de mededingingsautoriteit stelt een beleidsregel vast betreffende de beoordeling van
      doelmatigheid, bedoeld in het eerste lid, onder e.


