  - number: 19a
    text: |-
      1 Een netbeheerder houdt een registratie bij van kwaliteitsindicatoren betreffende het transport van elektriciteit.

      2 De netbeheerder zendt de raad van bestuur van de mededingingsautoriteit voor 1 maart van elk jaar een afschrift
      van de registratie van het voorafgaande jaar tezamen met een rapportage waarin de wijzigingen ten opzichte van het
      daaraan voorafgaande jaar en de afwijkingen ten opzichte van het kwaliteitsniveau dat de netbeheerder nastreeft,
      bedoeld in [artikel 21, tweede lid, onder a][ref1], zijn toegelicht. De netbeheerder maakt eveneens voor het
      tijdstip, bedoeld in de eerste volzin, de rapportage op een geschikte wijze openbaar.

      3 De netbeheerder bewaart de registratie ten minste tien jaar.

      4 De raad van bestuur van de mededingingsautoriteit kan onderzoek doen naar de deugdelijkheid van de registratie,
      in het bijzonder doch niet uitsluitend door in het net van de desbetreffende netbeheerder metingen te verrichten of
      te doen verrichten. De netbeheerder gedoogt dat de metingen in zijn net worden verricht.

      5 Bij ministeriële regeling worden regels gesteld over:

      a. de inhoud van de registratie en de wijze van registreren;

      b. de kwaliteitsindicatoren die in de registratie zijn opgenomen;

      c. de rapportage.

      6 De in het vijfde lid bedoelde ministeriële regeling kan, ten behoeve van het toezicht op de naleving van dit
      artikel, mede inhouden dat een door een geaccrediteerde instelling aan een netbeheerder verstrekt certificaat
      van conformiteit aan het bepaalde bij of krachtens dit artikel, het vermoeden oplevert dat de netbeheerder
      overeenkomstig het bepaalde bij of krachtens dit artikel uitvoering geeft aan de verplichting tot registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel21
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel19a
