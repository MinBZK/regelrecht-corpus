  - number: '10'
    text: |-
      1 Het landelijk hoogspanningsnet omvat de netten die bestemd zijn voor transport van elektriciteit op een
      spanningsniveau van 110 kV of hoger en die als zodanig worden bedreven, alsmede het landsgrensoverschrijdende net
      op een spanningsniveau van 500 V of hoger.

      2 De rechtspersoon die een recht van gebruik heeft van meer dan de helft van de totale circuitlengte van het
      landelijk hoogspanningsnet, voor zover dat een spanningsniveau van 220 kV of hoger betreft, wijst, na overleg met
      de andere rechtspersonen die een recht van gebruik hebben van dat net, voor het beheer van dat net een naamloze of
      besloten vennootschap als netbeheerder aan.

      3 Degene aan wie een ander net toebehoort dan het landelijk hoogspanningsnet, wijst voor het beheer van dat net een
      of meer naamloze of besloten vennootschappen als netbeheerder aan.

      4 Een aanwijzing als bedoeld in het tweede of derde lid geldt voor een periode van tien jaar, te rekenen vanaf de
      dag waarop Onze Minister heeft ingestemd met de aanwijzing op grond van [artikel 12, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel12
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel10
    references:
      - id: ref1
