  - number: 9f
    text: |-
      1 Gedeputeerde staten coördineren de voorbereiding en bekendmaking van de besluiten, aangewezen op grond van
      [artikel 9d, eerste lid][ref1], ten behoeve van de aanleg of uitbreiding van een productie-installatie als bedoeld
      in [artikel 9e, eerste lid][ref2].

      2 Gedeputeerde staten nemen de in het eerste lid bedoelde besluiten met uitsluiting van het in eerste aanleg
      bevoegde bestuursorgaan, tenzij dit een bestuursorgaan van het Rijk is.

      3 Gedeputeerde staten geven ten aanzien van de ontwerpen van de besluiten, bedoeld in het eerste lid, gezamenlijk
      toepassing aan [artikel 3:11, eerste lid, van de Algemene wet bestuursrecht][ref3] en voegen de kennisgevingen,
      bedoeld in [artikel 3:12 van die wet][ref4], samen in een kennisgeving die door hen wordt gedaan.

      4 Voor zover de aanleg of de uitbreiding, bedoeld in het eerste lid, onevenredig wordt belemmerd door bepalingen
      die – al dan niet krachtens de wet – bij of krachtens een regeling van een gemeente of waterschap zijn vastgesteld,
      kunnen die bepalingen bij het nemen of uitvoeren van de besluiten, bedoeld in het eerste lid, om dringende redenen
      buiten toepassing worden gelaten.

      5 [Artikel 3.33, tweede en vierde tot en met zesde lid, van de Wet ruimtelijke ordening][ref5] is van
      overeenkomstige toepassing.

      6 Gedeputeerde staten kunnen bepalen dat het eerste lid niet van toepassing is op een productie-installatie als
      bedoeld in [artikel 9e, eerste lid][ref6], indien:

      a. in aanmerking genomen de omvang, aard en ligging van de desbetreffende productie-installatie, redelijkerwijze
      niet valt te verwachten dat toepassing van het eerste lid de besluitvorming in betekenende mate zal versnellen of
      dat daaraan anderszins aanmerkelijke voordelen zijn verbonden, of

      b. is voldaan aan de krachtens [artikel 9e, zesde lid][ref7], voor die provincie gestelde minimum realisatienorm.


