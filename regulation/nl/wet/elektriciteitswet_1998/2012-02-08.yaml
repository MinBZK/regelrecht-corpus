  - number: 41d
    text: |-
      1 In afwijking van [artikel 41a][ref1] wordt voor de netbeheerder van het landelijk hoogspanningsnet geen
      kwaliteitsterm vastgesteld.

      2 De raad van bestuur van de mededingingsautoriteit stelt voor de netbeheerder van het landelijk
      hoogspanningsnet jaarlijks het verschil vast tussen de totale inkomsten uit de tarieven, bedoeld in
      [artikel 41b, eerste lid, onderdeel d][ref2], en de gerealiseerde totale inkomsten uit de tarieven. Bij de
      eerstvolgende vaststelling van de tarieven verwerkt de raad van bestuur van de mededingingsautoriteit het verschil
      in de tarieven.


