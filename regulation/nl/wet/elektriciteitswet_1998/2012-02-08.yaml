  - number: '15'
    text: |-
      1 Het gebod, bedoeld in [artikel 10, derde lid][ref1], geldt niet voor zover het een net betreft met een
      spanningsniveau van ten hoogste 0,4 kV en een verbruik van ten hoogste 0,1 GWh per jaar, en een ander dan een
      leverancier of een netbeheerder een recht van gebruik heeft van dat net.

      2 Onze Minister kan op diens aanvraag aan degene aan wie een ander net dan het landelijk hoogspanningsnet
      toebehoort een ontheffing verlenen van het gebod, bedoeld in [artikel 10, derde lid][ref2], voor zover het een net
      betreft waarop een beperkt aantal andere natuurlijke personen of rechtspersonen zijn aangesloten en:

      a. het net bestemd is om de aanvrager te voorzien van elektriciteit dan wel om het centrale bedrijfsproces van de
      aanvrager te ondersteunen, of

      b. het net bestemd is om een aantal samenwerkende natuurlijke personen of rechtspersonen te voorzien van
      elektriciteit en de samenwerking van deze personen een betrouwbaar, duurzaam, doelmatig en milieuhygiënisch
      verantwoord functionerende energiehuishouding in hun vestigingen ten doel heeft, of

      c. ten aanzien van het net kwaliteitseisen van toepassing zijn die in betekenende mate afwijken van de voorwaarden
      die de raad van bestuur van de mededingingsautoriteit op grond van [artikel 36][ref3] of [37][ref4] heeft
      vastgesteld, en

      d. de aanvrager geen netbeheerder is en niet in een groepsmaatschappij met een netbeheerder verbonden is.

      3 Indien een ontheffing als bedoeld in het tweede lid is verleend, sluit de ontheffinghouder een overeenkomst met
      de netbeheerder van het net waarop zijn net is aangesloten om te waarborgen dat de uitvoering van de taken van die
      netbeheerder niet wordt belemmerd.

      4 Aan een ontheffing kunnen voorschriften worden verbonden met betrekking tot de aansluiting op het net, de
      toegang tot het net, het uitvoeren van de taken als bedoeld in [artikel 16, eerste lid][ref5], of [16a][ref6] en
      met betrekking tot de tarieven en voorwaarden die daarbij gehanteerd moeten worden. Tevens int de ontheffinghouder
      het tarief voor systeemdiensten, bedoeld in [artikel 30, eerste lid][ref7], bij de afnemers die op zijn net zijn
      aangesloten en draagt de te innen tarieven af aan de netbeheerder van het landelijk hoogspanningsnet.

      5 Onze Minister kan een ontheffing intrekken indien degene aan wie de ontheffing is verleend:

      a. niet langer voldoet aan de voorwaarden, bedoeld in het tweede lid,

      b. in strijd handelt met het derde lid of de voorschriften, bedoeld in het vierde lid, of

      c. bij de aanvraag om een ontheffing onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van juiste
      of volledige gegevens tot een andere beschikking op de aanvraag zou hebben geleid.

      6 In afwijking van het tweede lid, onderdeel d, kan aan een aanvrager die in een groepsmaatschappij met een
      netbeheerder is verbonden een ontheffing worden verleend, indien van hem in redelijkheid niet kan worden verwacht
      dat hij een netbeheerder aanwijst voor het net waarop de aanvraag betrekking heeft. Een netbeheerder onthoudt zich
      van bemoeienis met het beheer van het net waarop de ontheffing betrekking heeft.


