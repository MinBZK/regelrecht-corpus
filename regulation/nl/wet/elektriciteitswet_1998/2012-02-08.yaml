  - number: 17a
    text: |-
      1 Het is de netbeheerder van het landelijk hoogspanningsnet of een rechtspersoon waarin de netbeheerder een
      deelneming heeft als bedoeld in [artikel 24c, van Boek 2 van het Burgerlijk Wetboek][ref1], niet toegestaan
      goederen of diensten waarmee zij in concurrentie treden te leveren, tenzij het betreft het verrichten van
      werkzaamheden ten behoeve van:

      a. de uitvoering van de taken, bedoeld in [artikel 16, eerste of tweede lid][ref2], of [16a][ref3] voor zichzelf,
      voor andere netbeheerders of voor anderen die een recht van gebruik op een net hebben,

      b. de aanleg, het beheer of het onderhoud van leidingen buiten gebouwen voor het transport van gas of

      c. het ter beschikking stellen en houden van netten ten behoeve van het gebruik van daarmee verbonden zaken door
      derden;

      d. het uitvoeren van werkzaamheden, bedoeld in [artikel 16c, eerste en vijfde lid][ref4].

      2 Indien de netbeheerder van het landelijk hoogspanningsnet onderdeel uitmaakt van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref5], is het deze groep niet toegestaan om handelingen
      of activiteiten te verrichten die strijdig kunnen zijn met het belang van het beheer van het landelijk
      hoogspanningsnet.

      3 De statuten van de rechtspersonen die met de netbeheerder van het landelijk hoogspanningsnet in een groep zijn
      verbonden, behoeven de goedkeuring van Onze Minister voor zover het betreft de daarin opgenomen doelstellingen van
      die rechtspersonen.

      4 De netbeheerder van het landelijk hoogspanningsnet verstrekt binnen zes maanden na afloop van ieder kalenderjaar
      aan de raad van bestuur van de mededingingsautoriteit een overzicht van de financiële middelen waarover hij
      beschikt ten behoeve van de uitvoering van zijn wettelijke taken, waaruit blijkt welke financiële middelen voor de
      afzonderlijke taken beschikbaar zijn.


