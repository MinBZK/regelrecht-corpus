  - number: 77h
    text: |-
      1 De raad van bestuur van de mededingingsautoriteit kan ingeval van overtreding van het bepaalde bij of krachtens
      deze wet, met uitzondering van [artikel 13][ref1], [22, tweede lid][ref2], [26aa][ref3], [26ad, vijfde lid][ref4],
      en [26ae, tiende lid][ref5], dan wel van overtreding van het bepaalde bij de Verordening de overtreder een last
      onder dwangsom opleggen.

      2 Indien daarvoor naar zijn oordeel aanleiding bestaat, gelet op het voorschrift waarop de overtreding
      betrekking heeft, geeft de raad van bestuur van de mededingingsautoriteit een bindende aanwijzing als bedoeld in
      [artikel 5, zesde lid][ref6], alvorens een last onder dwangsom op te leggen.

      3 Aan een last onder dwangsom kunnen voorschriften worden verbonden inzake het verstrekken van gegevens aan de raad
      van bestuur van de mededingingsautoriteit.

      4 De bevoegdheid tot het opleggen van een last onder dwangsom vervalt vijf jaren nadat de overtreding heeft
      plaatsgevonden.

      5 Indien de raad van bestuur van de mededingingsautoriteit vaststelt dat een overtreding als bedoeld in het eerste
      lid is begaan, doet hij daarvan een rapport opmaken.

      6 [Afdeling 5.4.2 van de Algemene wet bestuursrecht][ref7] is van overeenkomstige toepassing.


