        artikel: 24b
  - number: '12'
    text: |-
      1 De netbeheerder meldt aan Onze Minister onverwijld na zijn aanwijzing zijn naam en adres en de naam en het adres
      van zijn aandeelhouders en zendt aan Onze Minister een beschrijving van het net dat door hem zal worden beheerd.
      Ten minste eenmaal per jaar meldt hij aan Onze Minister iedere wijziging van de namen of adressen en zendt hij hem
      een beschrijving van de wijziging van het net dat door hem wordt beheerd.

      2 De aanwijzing behoeft de instemming van Onze Minister. Onze Minister onthoudt zijn instemming of kan
      voorschriften verbinden aan de instemming, indien niet is voldaan aan de [artikelen 10a][ref1], [10b][ref2],
      [11][ref3], [11a][ref4] of [11b][ref5] of indien de aangewezen netbeheerder in onvoldoende mate in staat zal zijn
      aan een verplichting als bedoeld in de [artikelen 7][ref6], [16Aa][ref7], [18a][ref8] of [78][ref9] te voldoen, een
      taak als bedoeld in [artikel 16, eerste of tweede lid][ref10], of [16a][ref11], uit te voeren dan wel een verbod
      als bedoeld in [artikelen 17][ref12], [17a][ref13] of [18][ref14] na te leven.

      3 Indien Onze Minister voorschriften verbindt aan zijn instemming, strekken deze er slechts toe de geconstateerde
      tekortkomingen, bedoeld in het tweede lid, weg te nemen.


