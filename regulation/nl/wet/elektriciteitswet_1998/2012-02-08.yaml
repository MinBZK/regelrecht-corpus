  - number: 95j
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. opwekkingsgegevens:

      1º. het aandeel van elke energiebron in de totale brandstofmix die de leverancier in het voorafgaande jaar heeft
      gebruikt, en

      2°. de milieugevolgen, in termen van uitstoot van koolstofdioxide en van radioactief afval, als gevolg van
      elektriciteitsproductie met verschillende energiebronnen veroorzaakt door de totale brandstofmix die de leverancier
      in het voorafgaande jaar heeft gebruikt;

      3°. verwijzingen naar beschikbare referentiebronnen, waar voor een ieder toegankelijke informatie beschikbaar
      is over de milieugevolgen, in termen van uitstoot van koolstofdioxide en van radioactief afval, als gevolg van
      elektriciteitsproductie met verschillende energiebronnen veroorzaakt door de totale brandstofmix die de leverancier
      in het voorafgaande jaar heeft gebruikt;

      b. eindafnemers: afnemers aan wie uitsluitend voor eigen verbruik elektriciteit wordt geleverd.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel95j
  - number: 95k
    text: |-
      1 De leverancier meldt:

      a. uiterlijk in de periode vanaf 1 mei van elk kalenderjaar tot 1 mei van het daaropvolgende jaar de
      opwekkingsgegevens van de door hem in het kalenderjaar voorafgaand aan die periode aan zijn eindafnemers geleverde
      elektriciteit op of bij de rekening en in het promotiemateriaal of

      b. op of bij de rekening, de opwekkingsgegevens van de door hem in de periode waarop die rekening betrekking heeft
      aan zijn eindafnemers geleverde elektriciteit en

      c. elk kalenderjaar de opwekkingsgegevens van de door hem in het voorgaande kalenderjaar aan zijn eindafnemers
      geleverde elektriciteit op zijn website voor eindafnemers.

      2 Een producent of een handelaar meldt uiterlijk twee maanden na 1 januari van elk kalenderjaar, aan de leverancier
      de opwekkingsgegevens van de in het voorgaande kalenderjaar door hem geproduceerde of verhandelde elektriciteit.

      3 De betrouwbaarheid van de opwekkingsgegevens van de elektriciteit waarvoor certificaten, garanties van oorsprong
      voor duurzame elektriciteit of garanties van oorsprong voor elektriciteit opgewekt in een installatie voor
      hoogrenderende warmtekrachtkoppeling worden verstrekt, wordt door middel van die certificaten, garanties van
      oorsprong voor duurzame elektriciteit of garanties van oorsprong voor elektriciteit opgewekt in een installatie
      voor hoogrenderende warmtekrachtkoppeling gewaarborgd.

      4 Indien de producent, handelaar of leverancier onderdeel uitmaakt van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1], worden tevens de opwekkingsgegevens van de groep
      als geheel vermeld op of bij de rekening aan de eindafnemer, alsmede op aan de eindafnemer geadresseerd
      promotiemateriaal.

      5 Onze Minister kan nadere regels stellen met betrekking tot:

      a. de opwekkingsgegevens die de leverancier vermeldt op of bij de rekening aan de eindafnemer, en de wijze waarop
      deze gegevens worden weergegeven;

      b. de wijze waarop de opwekkingsgegevens door de producent, handelaar en leverancier onderling worden doorgegeven;

      c. de wijze waarop de opwekkingsgegevens van geïmporteerde en in Nederland verhandelde of geleverde elektriciteit
      worden vermeld;

      d. de wijze waarop de betrouwbaarheid van de opwekkingsgegevens ten minste wordt gewaarborgd;

      e. de uiterste datum en de wijze waarop de leverancier de opwekkingsgegevens van de door hem in het voorgaande
      kalenderjaar aan zijn eindafnemers geleverde elektriciteit vermeldt op zijn website voor eindafnemers.

      6 Van de verplichtingen in dit artikel kan uitsluitend gemotiveerd worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
