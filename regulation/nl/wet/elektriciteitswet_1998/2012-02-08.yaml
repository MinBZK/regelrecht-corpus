  - number: 9a
    text: |-
      1 Indien naar het oordeel van Onze Minister om de leverings- en voorzieningszekerheid te waarborgen onvoldoende
      productie-installaties worden gebouwd, kan hij een procedure starten overeenkomstig artikel 7 van de richtlijn.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de in artikel 7 van de
      richtlijn bedoelde procedure.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel9a
  - number: 9b
    text: |-
      1 De procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel c, van de Wet ruimtelijke ordening][ref1],
      is van toepassing op de aanleg en uitbreiding van:

      a. een productie-installatie, met inbegrip van de aansluiting van die installatie op een net, met een capaciteit
      van ten minste 100 MW, indien het betreft een installatie voor de opwekking van duurzame elektriciteit met behulp
      van windenergie;

      b. een productie-installatie, met inbegrip van de aansluiting van die installatie op een net, met een capaciteit
      van ten minste 50 MW, indien het betreft een installatie voor de opwekking van duurzame elektriciteit anders dan
      met behulp van windenergie;

      c. een productie-installatie, met inbegrip van de aansluiting van die installatie op een net, met een capaciteit
      van ten minste 500 MW, indien het betreft een installatie voor de opwekking van andere dan duurzame elektriciteit.

      2 De procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel c, van de Wet ruimtelijke ordening][ref2]
      is eveneens van toepassing op de uitbreiding van een productie-installatie voor de opwekking van andere dan
      duurzame elektriciteit, met inbegrip van de aansluiting van die installatie op een net, indien door die uitbreiding
      de capaciteit van die productie-installatie wordt vergroot tot ten minste 500 MW.

      3 De producent meldt een voornemen tot aanleg of uitbreiding van een productie-installatie als bedoeld in het
      eerste of tweede lid, zo spoedig mogelijk schriftelijk aan Onze Minister. Bij ministeriële regeling kan voor het
      doen van de melding en de daarbij te verstrekken gegevens een formulier worden vastgesteld.

      4 Indien, in aanmerking genomen de omvang, aard en ligging van een installatie als bedoeld in het eerste of tweede
      lid, alsmede het aantal voor de aanleg of uitbreiding van die installatie benodigde besluiten, redelijkerwijs
      niet valt te verwachten dat toepassing van de procedure, bedoeld in het eerste of tweede lid, de besluitvorming
      in betekenende mate zal versnellen of daaraan anderszins aanmerkelijke voordelen zijn verbonden, kan Onze Minister
      bepalen dat:

      a. geen van de procedures, bedoeld in [artikel 3.35, eerste lid][ref3],

      b. uitsluitend de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel a][ref4],

      c. uitsluitend de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel b][ref5], of

      d. de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel a][ref6], gevolgd door de procedure,
      bedoeld in artikel 3.35, eerste lid, aanhef en onderdeel b, van de Wet ruimtelijke ordening, van toepassing
      zijn of is op de aanleg of de uitbreiding van die installatie. Onze Minister hoort de producent en de betrokken
      bestuursorganen over een voornemen toepassing te geven aan de bevoegdheid, bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.35
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3.35
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3.35
