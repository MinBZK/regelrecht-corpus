  - number: 20a
    text: |-
      1 De procedure bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel c, van de Wet ruimtelijke ordening][ref1],
      is van toepassing op een uitbreiding van het landelijke hoogspanningsnet, voor zover het betreft de van dat net
      deel uitmakende netten bestemd voor het transport van elektriciteit op een spanningsniveau van 220 kV of hoger
      en die als zodanig worden bedreven, en de van dat net deel uitmakende landsgrensoverschrijdende netten op een
      spanningsniveau van 500 V of hoger, met inbegrip van de aansluitingen op die netten.

      2 De beheerder van het net, bedoeld in het eerste lid, meldt een voornemen tot een uitbreiding van een net waarop
      het eerste lid van toepassing is zo spoedig mogelijk schriftelijk aan Onze Minister. Bij ministeriële regeling kan
      voor het doen van de melding en de daarbij te verstrekken gegevens een formulier worden vastgesteld.

      3 Indien, in aanmerking genomen de omvang, aard en ligging van een net als bedoeld in het eerste lid, alsmede het
      aantal voor de aanleg of uitbreiding van dat net benodigde besluiten, redelijkerwijs niet valt te verwachten dat
      toepassing van de procedure, bedoeld in het eerste lid, de besluitvorming in betekenende mate zal versnellen of
      daaraan anderszins aanmerkelijke voordelen zijn verbonden, kan Onze Minister bepalen dat:

      a. geen van de procedures, bedoeld in [artikel 3.35, eerste lid][ref2],

      b. uitsluitend de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel a][ref3],

      c. uitsluitend de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel b][ref4], of

      d. de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel a][ref5], gevolgd door de procedure,
      bedoeld in artikel 3.35, eerste lid, aanhef en onderdeel b, van de Wet ruimtelijke ordening, van toepassing zijn of
      is op de uitbreiding van dat net. Onze Minister hoort de beheerder van het net en de betrokken bestuursorganen over
      een voornemen toepassing te geven aan de bevoegdheid, bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.35
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3.35
