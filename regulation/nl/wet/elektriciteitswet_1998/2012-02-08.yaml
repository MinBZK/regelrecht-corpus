  - number: '23'
    text: |-
      1 De netbeheerder is verplicht degene die daarom verzoekt te voorzien van een aansluiting op het door hem beheerde
      net tegen een tarief en tegen andere voorwaarden die in overeenstemming zijn met de [paragrafen 5][ref1] en
      [6 van dit hoofdstuk][ref2]. De netbeheerder verstrekt degene die om een aansluiting op het net verzoekt een
      gedetailleerde en volledige opgave van de uit te voeren werkzaamheden en de te berekenen kosten van de handelingen,
      onderscheiden in [artikel 28, eerste lid][ref3].

      2 De netbeheerder onthoudt zich van iedere vorm van discriminatie tussen degenen jegens wie de verplichting,
      bedoeld in het eerste lid, geldt.

      3 Een aansluiting wordt door de netbeheerder gerealiseerd binnen een redelijke termijn. Deze redelijk termijn is in
      ieder geval verstreken wanneer de gevraagde aansluiting niet is gerealiseerd binnen 18 weken nadat het verzoek om
      een aansluiting bij de netbeheerder in ingediend, indien het verzoek betreft:

      a. een aansluiting tot 10 MVA;

      b. een aansluiting voor een productie-installatie voor de opwekking van duurzame elektriciteit of een installatie
      voor hoogrenderende warmtekrachtkoppeling, tenzij de netbeheerder niet in redelijkheid kan worden verweten dat hij
      de aansluiting niet binnen de genoemde termijn heeft gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel28
