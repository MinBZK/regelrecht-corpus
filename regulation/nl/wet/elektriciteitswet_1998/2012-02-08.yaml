  - number: 16a
    text: |-
      1 Het is anderen dan de desbetreffende netbeheerder verboden een taak uit te voeren als bedoeld in
      [artikel 16, eerste of tweede lid][ref1], behoudens voor zover het betreft het meten van elektriciteit, bedoeld in
      [artikel 16, eerste lid, onderdeel i][ref2].

      2 Degene, niet zijnde een netbeheerder, die bij een afnemer de meting van van het net afgenomen en verbruikte
      of opgewekte en op het net ingevoede elektriciteit verricht, deelt de daarmee verkregen meetgegevens mee aan de
      desbetreffende afnemer en aan de netbeheerder op wiens net de afnemer is aangesloten.

      3 De netbeheerder deelt het resultaat van de vaststelling, bedoeld in [artikel 16, eerste lid, onderdeel h][ref3],
      en de meetgegevens, bedoeld in het tweede lid en in [artikel 16, eerste lid, onderdeel i][ref4], mee aan de
      netbeheerder van het landelijk hoogspanningsnet alsmede aan de desbetreffende producent voor zover die nog niet de
      beschikking heeft over die informatie.


