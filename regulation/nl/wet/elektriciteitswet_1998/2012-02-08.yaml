  - number: '28'
    text: |-
      1 Het tarief waarvoor afnemers zullen worden aangesloten op een net heeft uitsluitend betrekking op:

      a. het verbreken van het net van de desbetreffende netbeheerder om een fysieke verbinding van de installatie van
      een afnemer met dat net tot stand te brengen,

      b. het installeren van voorzieningen om het net van de desbetreffende netbeheerder te beveiligen en beveiligd te
      houden en

      c. het tot stand brengen en in stand houden van een verbinding tussen de plaats waar het net verbroken is en de
      voorzieningen om het net te beveiligen.

      2 Het tarief, bedoeld in het eerste lid, wordt in rekening gebracht bij iedere afnemer die door een netbeheerder
      wordt aangesloten op een net dat wordt beheerd door een netbeheerder.

      3 De tarieven voor de aansluiting van de afnemers die producent zijn, zijn objectief, transparant en niet-
      discriminatoir, waarbij rekening wordt gehouden met de kosten en baten van de onderscheiden technieken met
      betrekking tot duurzame energiebronnen, decentrale productie en warmtekrachtkoppeling.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel28
  - number: '29'
    text: |-
      1 Het tarief waarvoor transport van elektriciteit zal worden uitgevoerd ten behoeve van afnemers, heeft betrekking
      op de ontvangst van elektriciteit door een afnemer, ongeacht de plaats van opwekking van de elektriciteit en van de
      aansluiting waar de elektriciteit op het Nederlandse net is gebracht, of op het invoeden van elektriciteit door een
      afnemer, ongeacht de plaats van ontvangst van de elektriciteit.

      2 Het tarief, bedoeld in het eerste lid, wordt in rekening gebracht bij iedere afnemer die een aansluiting
      heeft op een net dat wordt beheerd door een netbeheerder. De tarieven voor de ontvangst van elektriciteit kunnen
      verschillen voor verschillende afnemers, afhankelijk van het spanningsniveau van het net waarop de elektriciteit
      wordt ontvangen, en de tarieven voor het invoeden van elektriciteit kunnen verschillen voor verschillende afnemers,
      afhankelijk van het spanningsniveau van het net waarop de elektriciteit wordt ingevoed.

      3 Onze Minister stelt de tariefdrager vast voor het transportafhankelijke element van het tarief, bedoeld in het
      eerste lid. Het transportonafhankelijke element van het tarief, bedoeld in het eerste lid, wordt uitgedrukt in
      een bedrag in euro. Het transporttarief wordt berekend per aansluiting. Voor de toepassing van het transporttarief
      wordt een streng van lichtmasten geacht te beschikken over één aansluiting.

      4 In aanvulling op het bepaalde bij of krachtens het eerste, tweede en derde lid, kunnen bij algemene maatregel
      van bestuur regels worden gesteld met betrekking tot het tarief waarvoor transport van elektriciteit zal worden
      uitgevoerd ten behoeve van bij die maatregel aan te geven afnemers dan wel voor daarbij te omschrijven transport
      van elektriciteit.

      5 Het tarief, bedoeld in het eerste lid, dient mede ter dekking van de kosten die zijn verbonden aan verplichtingen
      die voor het tijdstip van intrekking van de Elektriciteitswet 1989 door de aangewezen vennootschap zijn aangegaan
      met betrekking tot de aanleg van een verbinding voor het transport van elektriciteit tussen Nederland en Noorwegen.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel29
  - number: '30'
    text: |-
      1 Het tarief voor het verrichten van de systeemdiensten heeft betrekking op:

      a. het reservevermogen en regelvermogen,

      b. de black-start-voorzieningen en

      c. de overige systeemdiensten.

      2 Het tarief, bedoeld in het eerste lid, wordt in rekening gebracht bij iedere afnemer die elektriciteit verbruikt
      en een aansluiting heeft op het landelijk hoogspanningsnet of een net dat direct of indirect in verbinding staat
      met dat net.

      3 Het tarief, bedoeld in het eerste lid, wordt uitgedrukt in een bedrag per verbruikte hoeveelheid elektriciteit
      in kWh.

      4 Bij algemene maatregel van bestuur kan worden bepaald dat het tarief, bedoeld in het eerste lid, in rekening
      wordt gebracht bij de afnemer, bedoeld in het tweede lid, en bij iedere afnemer die een hoeveelheid elektriciteit
      opwekt en op het net invoedt, dan wel verbruikt op de eigen installatie. In dat geval wordt het tarief uitgedrukt
      in een bedrag per opgewekte dan wel verbruikte hoeveelheid elektriciteit in kWh.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel30
  - number: 30a
    text: |-
      Het tarief voor de meting van elektriciteit bij afnemers als bedoeld in [artikel 95a, eerste lid][ref1], heeft
      betrekking op:

      a. het beheer van de meetinrichtingen;

      b. het verschaffen van toegang tot meetgegevens als bedoeld in [artikel 26ab, tweede en derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel26ab
