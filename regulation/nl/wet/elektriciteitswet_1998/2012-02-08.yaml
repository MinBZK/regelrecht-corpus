  - number: '14'
    text: |-
      1 Degenen, bedoeld in [artikel 10, tweede of derde lid][ref1], kunnen met inachtneming van een redelijke termijn
      de aanwijzing als netbeheerder vervangen door een aanwijzing van een andere naamloze of besloten vennootschap als
      netbeheerder.

      2 In geval van fusie, splitsing, ontbinding of faillissement van de vennootschap die als netbeheerder
      is aangewezen, vervalt de aanwijzing als netbeheerder van rechtswege en wijzen degenen, bedoeld in
      [artikel 10, tweede en derde lid][ref2], onverwijld een naamloze of besloten vennootschap als netbeheerder aan.
      Deze vennootschap kan dezelfde zijn als de vennootschap die daarvoor als netbeheerder was aangewezen.

      3 Degenen, bedoeld in [artikel 10, tweede en derde lid][ref3], wijzen voor afloop van de periode, bedoeld
      in [artikel 10, vierde lid][ref4], een naamloze of besloten vennootschap als netbeheerder aan voor de daarop
      aansluitende periode. Deze vennootschap kan dezelfde zijn als de vennootschap die daarvoor als netbeheerder was
      aangewezen.

      4 De [artikelen 10 tot en met 13][ref5] zijn van overeenkomstige toepassing op de aanwijzing als netbeheerder,
      bedoeld in het eerste, tweede of derde lid.


