  - number: '33'
    text: |-
      1 De gezamenlijke netbeheerders voeren overleg met representatieve organisaties van partijen op de
      elektriciteitsmarkt over de voorstellen met betrekking tot de tariefstructuren en de voorwaarden, bedoeld in de
      [artikelen 27][ref1], [31][ref2] en [32, eerste lid][ref3].

      2 In de voorstellen die aan de raad van bestuur van de mededingingsautoriteit worden gezonden, geven de
      gezamenlijke netbeheerders aan welke gevolgtrekkingen zij hebben verbonden aan de zienswijzen die de organisaties,
      bedoeld in het eerste lid, naar voren hebben gebracht.

      3 De netbeheerder van het landelijk hoogspanningsnet voert overleg met de netbeheerders in andere landen waarmee
      een landgrensoverschrijdend net tot stand is gebracht over de voorschriften en verplichtingen inzake operationele
      netwerkveiligheid als bedoeld in [artikel 31, elfde lid][ref4], voordat hij die voorschriften en verplichtingen
      vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
