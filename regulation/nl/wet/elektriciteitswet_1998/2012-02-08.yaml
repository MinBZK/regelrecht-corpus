      [12, eerste en tweede lid][ref5], [16, eerste lid, onderdelen g, k en l, en tweede lid, onderdeel g][ref6],
      [16Aa, derde en vierde lid][ref7], [16a][ref8], [17, vierde lid][ref9], [17a, derde en vierde lid][ref10],
      [18, derde lid][ref11], [19b][ref12], [19c][ref13], [19d][ref14], [19e][ref15],
      [21, negende lid, tweede volzin][ref16], [24, tweede lid][ref17], [24a][ref18], [26ae, twaalfde lid][ref19],
      [38, derde lid][ref20], [39][ref21], [42, derde lid][ref22], [68, tweede lid][ref23], 71, [ 78, tweede lid][ref24],
      [95b, tweede en achtste lid][ref25], [95e][ref26], [95k][ref27], [95l][ref28] en [95o][ref29] alsmede
      [artikel 5:20 van de Algemene wet bestuursrecht][ref30], de overtreder per overtreding een bestuurlijke boete
      opleggen van ten hoogste € 450 000 of, indien dat meer is, 1% van de omzet van de overtreder in het boekjaar
      voorafgaande aan de beschikking, en

      b. de [artikelen 5, zesde lid][ref31], [10, tweede en derde lid][ref32],
      [10a, eerste en tweede lid][ref33], [10b, tweede en derde lid][ref34],
      [11, eerste lid][ref35], [11a, derde lid][ref36], [11b, eerste en tweede lid][ref37],
