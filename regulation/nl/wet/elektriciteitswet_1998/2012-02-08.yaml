  - number: 77cb
    text: |-
      1 De garantiebeheerinstantie opent op aanvraag van een in Nederland gevestigde producent van elektriciteit opgewekt
      in een installatie voor hoogrenderende warmtekrachtkoppeling een rekening.

      2 Bij de aanvraag, bedoeld in het eerste lid, overleg de producent het resultaat van de vaststelling, bedoeld in
      [artikel 16, eerste lid, onderdeel h][ref1].

      3 De garantiebeheerinstantie boekt op aanvraag garanties van oorsprong voor elektriciteit opgewekt in een
      installatie voor hoogrenderende warmtekrachtkoppeling op een daarbij aangegeven rekening, indien een in
      Nederland gevestigde producent bij deze aanvraag de gegevens omtrent de door de netbeheerder of door een andere
      tot meten bevoegde instantie gemeten hoeveelheid elektriciteit opgewekt in een installatie voor hoogrenderende
      warmtekrachtkoppeling overlegt. Onze Minister kan bij ministeriële regeling andere gegevens vaststellen die de
      producent bij deze aanvraag verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel77cb
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 77cc
    text: |-
      De garantiebeheerinstantie deelt ieder kalenderjaar aan Onze Minister mee voor welke hoeveelheid elektriciteit
      opgewekt in een installatie voor hoogrenderende warmtekrachtkoppeling overeenkomstig de bij of krachtens de
      [artikelen 77ca tot en met 77ce][ref1] gestelde bepalingen garanties van oorsprong zijn uitgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77ca
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel77cc
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 77ca
        hoofdstuk: '5'
        paragraaf: 3a
  - number: 77cd
    text: |-
      Waar in deze wet en de daarop berustende bepalingen wordt verwezen naar garanties van oorsprong voor elektriciteit
      opgewekt in een installatie voor hoogrenderende warmtekrachtkoppeling, worden garanties van oorsprong voor
      elektriciteit opgewekt in een installatie voor hoogrenderende warmtekrachtkoppeling uitgegeven door onafhankelijke
      instanties in een andere lidstaat van de Europese Unie, die naar aard en strekking overeenkomen met eerstbedoelde
      garanties van oorsprong, daarmee gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel77cd
  - number: 77ce
    text: |-
      Onze Minister kan bij ministeriële regeling regels stellen met betrekking tot:

      a. de informatie die door de garantiebeheerinstantie op grond van de [artikelen 77ca, tweede lid][ref1], juncto
      de [artikelen 75, eerste lid][ref2], en [77a][ref3] verstrekt wordt aan Onze Minister en die door producenten van
      elektriciteit opgewekt in een installatie voor hoogrenderende warmtekrachtkoppeling of netbeheerders verstrekt
      wordt aan de garantiebeheerinstantie;

      b. het uitgeven en de geldigheidsduur van garanties van oorsprong voor elektriciteit opgewekt in een installatie
      voor hoogrenderende warmtekrachtkoppeling, het vermelden van gegevens op de garanties van oorsprong en het in
      rekening brengen van de kosten die gepaard gaan met handelingen met betrekking tot de garanties van oorsprong;

      c. het openen van een rekening, het boeken van garanties van oorsprong voor elektriciteit opgewekt in een
      installatie voor hoogrenderende warmtekrachtkoppeling op die rekening en de gegevens die een producent daarbij
      overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77ca
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel77a
