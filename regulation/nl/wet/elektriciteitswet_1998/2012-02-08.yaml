  - number: '21'
    text: |-
      1 Een netbeheerder beschikt over een doeltreffend systeem voor de beheersing van de kwaliteit van zijn
      transportdienst en over voldoende capaciteit voor het transport van elektriciteit om te voorzien in de totale
      behoefte.

      2 De netbeheerder dient om het jaar bij de raad van bestuur van de mededingingsautoriteit een door hem vastgesteld
      document in waarin hij:

      a. aangeeft welk kwaliteitsniveau hij nastreeft,

      b. aannemelijk maakt dat hij beschikt over een doeltreffend kwaliteitsbeheersingssysteem voor zijn transportdienst,

      c. aannemelijk maakt dat hij over voldoende capaciteit beschikt om te voorzien in de totale behoefte aan het
      transport van elektriciteit,

      d. aangeeft welke capaciteitsknelpunten in de door hem beheerde netten bestaan en welke maatregelen hij zal nemen
      om deze op te heffen,

      e. aangeeft welke investeringen hij zal doen om de capaciteitsknelpunten op te heffen;

      f. aangeeft welke investeringen hij zal doen voor de vervanging en uitbreiding van de door hem beheerde netten,

      g. aangeeft binnen welke termijnen hij voornoemde investeringen zal doen,

      h. aangeeft welke investeringen ter uitbreiding van het net naar zijn oordeel noodzakelijk zijn om te voorzien in
      de totale behoefte aan het transport van elektriciteit, en

      i. aannemelijk maakt dat hij de totale behoefte aan het transport van elektriciteit heeft afgestemd met de
      netbeheerders van de aan zijn net grenzende netten.

      3 Bij ministeriële regeling worden regels, die kunnen verschillen per spanningsniveau, gesteld over:

      a. de eisen aan het kwaliteitsbeheersingssysteem;

      b. de te verschaffen informatie over het nagestreefde kwaliteitsniveau en over het kwaliteitsbeheersingssysteem;

      c. de wijze van ramen van de totale behoefte aan capaciteit voor het transport van elektriciteit;

      d. de te verschaffen gegevens over de totale behoefte aan capaciteit voor het transport van elektriciteit en over
      de wijze waarop de netbeheerder voornemens is te voorzien in de totale behoefte aan capaciteit voor het transport
      van elektriciteit;

      e. investeringen met betrekking tot een net;

      f. de periode waarop het document of onderdelen daarvan betrekking hebben.

      4 De netbeheerder maakt het document op een geschikte wijze openbaar.

      5 Bij ministeriële regeling kan worden bepaald dat een door een geaccrediteerde instelling aan een netbeheerder
      verstrekt certificaat van conformiteit aan het bepaalde bij of krachtens dit artikel, ten behoeve van het toezicht
      op de naleving van dit artikel, het vermoeden oplevert dat de netbeheerder een kwaliteitsbeheersingssyteem heeft en
      daaraan uitvoering geeft overeenkomstig het bepaalde bij of krachtens dit artikel.

      6 De netbeheerder van het landelijk hoogspanningsnet geeft in het document bedoeld in het tweede lid in elk geval
      aan welke prestaties op het gebied van leveringskwaliteit en operationele netwerkveiligheid hij nastreeft.

      7 De doelstellingen bedoeld in het zesde lid zijn objectief, transparant en niet-discriminatoir.

      8 De raad van bestuur van de mededingingsautoriteit verleent goedkeuring aan het document bedoeld in het tweede lid
      voor zover het betreft de prestaties die de netbeheerder van het landelijk hoogspanningsnet nastreeft ten aanzien
      van de leveringskwaliteit en de operationele netwerkveiligheid indien naar het oordeel van de raad van bestuur van
      de mededingingsautoriteit blijkt dat deze netbeheerder in voldoende mate en op een doelmatige wijze kan voorzien in
      de door hem gestelde doelen.

      9 De netbeheerder handelt naar zijn voornemens, opgenomen in het document, bedoeld in het tweede lid, en meldt de
      raad van bestuur van de mededingingsautoriteit indien hij hiervan heeft afgeweken.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel21
  - number: '22'
    text: |-
      1 Indien naar het oordeel van de raad van bestuur van de mededingingsautoriteit uit de overzichten, bedoeld in
      [artikel 19b][ref1] of uit het document, bedoeld in [artikel 21][ref2], of anderszins, blijkt dat een netbeheerder
      in onvoldoende mate of op een ondoelmatige wijze kan of zal kunnen voorzien in het door hem te bereiken niveau van
      de kwaliteit van zijn transportdienst of in de totale behoefte aan capaciteit voor het transport van elektriciteit
      over de door hem beheerde netten, meldt hij zulks na overleg met de netbeheerder van het landelijk hoogspanningsnet
      en de netbeheerder van het desbetreffende net aan Onze Minister.

      2 Nadat hij een melding heeft ontvangen, kan Onze Minister aan de desbetreffende netbeheerder opdragen
      voorzieningen te treffen teneinde zeker te stellen dat het transport van elektriciteit in voldoende mate of op een
      doelmatige wijze plaatsvindt.

      3 Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de opdracht, bedoeld
      in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel19b
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel21
