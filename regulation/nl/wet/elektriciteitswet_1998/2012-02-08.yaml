  - number: '49'
    text: |-
      De afnemer of leverancier wiens transactie als bedoeld in artikel 21, tweede lid, onderdeel b, van de richtlijn, is
      geweigerd, kan aan Onze Minister verzoeken zijn bevoegdheid, bedoeld in dat artikelonderdeel van de richtlijn, uit
      te oefenen.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel49
  - number: '50'
    text: |-
      1 Indien blijkt dat degene die een verzoek heeft gedaan als bedoeld in [artikel 45, eerste of tweede lid][ref1],
      daarbij onjuiste of onvolledige gegevens heeft verstrekt aan de netbeheerder van het landelijk hoogspanningsnet
      en deze op grond van [artikel 46][ref2] geen aanbod tot het uitvoeren van het desbetreffende transport zou
      hebben gedaan als juiste en volledige gegevens zouden zijn verstrekt, staakt de netbeheerder van het landelijk
      hoogspanningsnet het ten behoeve van die verzoeker uitgevoerde transport van elektriciteit en vernietigt hij de
      overeenkomst met betrekking tot dat transport.

      2 Indien de netbeheerder van het landelijk hoogspanningsnet een overeenkomst heeft vernietigd op grond van het
      eerste lid, is degene die het verzoek om het desbetreffende transport heeft gedaan, verplicht bij een nieuw verzoek
      als bedoeld in [artikel 45, eerste of tweede lid][ref3], schriftelijke verklaringen te voegen van de afnemer of
      leverancier, inhoudend dat de te transporteren elektriciteit voor hem bestemd is, en van de producent, inhoudend
      dat de te transporteren elektriciteit door hem zal worden opgewekt.

      3 Het tweede lid is van overeenkomstige toepassing indien de netbeheerder van het landelijk hoogspanningsnet
      bekend wordt met de onjuistheid of de onvolledigheid van de gegevens nadat hij zijn verbintenis uit de overeenkomst
      voor het transport van elektriciteit is nagekomen en hij dat heeft gemeld aan degene die het verzoek om het
      desbetreffende transport van elektriciteit heeft gedaan, dan wel indien Onze Minister een ontheffing als bedoeld in
      [artikel 48][ref4] heeft ingetrokken.

      4 Indien het tweede lid van toepassing is, doet de netbeheerder van het landelijk hoogspanningsnet geen aanbod
      om elektriciteit te transporteren als bedoeld in [artikel 45, eerste of tweede lid][ref5], dan nadat hij de
      schriftelijke verklaringen heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel45
