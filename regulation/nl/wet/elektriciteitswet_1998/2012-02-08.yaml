  - number: 95a
    text: |-
      1 Het is verboden zonder vergunning elektriciteit te leveren aan afnemers die beschikken over een aansluiting op
      een net met een totale maximale doorlaatwaarde van ten hoogste 3*80 A.

      2 Het verbod geldt niet ten aanzien van het leveren van elektriciteit:

      a. indien de elektriciteit is opgewekt met een installatie die voor rekening en risico van de afnemer, alleen
      of, voor een evenredig deel, tezamen met andere afnemers, in werking wordt gehouden en de afnemer de geleverde
      elektriciteit verbruikt;

      b. door een buiten Nederland gevestigde leverancier van elektriciteit aan ten hoogste 500 afnemers, bedoeld in het
      eerste lid, die wonen in gebieden aan de Nederlandse landsgrens;

      c. indien de afnemer aan dezelfde rechtspersoon toebehoort als de producent die de elektriciteit heeft opgewekt dan
      wel een dochtermaatschappij daarvan in de zin van [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref1] en de
      afnemer de geleverde elektriciteit verbruikt, of

      d. indien de elektriciteit anders dan bedrijfsmatig wordt geleverd overeenkomstig bij ministeriële regeling te
      stellen regels;

      e. indien de elektriciteit wordt geleverd in het kader van een overeenkomst als bedoeld in [artikel 95n][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95n
