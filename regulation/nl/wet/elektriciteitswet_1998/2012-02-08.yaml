  - number: '13'
    text: |-
      1 Indien het aanwijzen van een netbeheerder als bedoeld in [artikel 10, tweede of derde lid][ref1], niet is
      geschied binnen vier weken na de aanleg van een net dan wel onverwijld na het intrekken of vervallen van een
      eerdere aanwijzing, wijst Onze Minister een naamloze of besloten vennootschap aan als netbeheerder van dat net.

      2 Indien Onze Minister vaststelt dat niet meer voldaan wordt aan de [artikelen 10a][ref2], [10b][ref3],
      [11][ref4], [11a][ref5] of [11b][ref6] of dat een netbeheerder in onvoldoende mate in staat is of zal zijn om
      aan een verplichting als bedoeld in de [artikelen 7][ref7], [16Aa][ref8], [18a][ref9] of [78][ref10] te voldoen,
      om een taak als bedoeld in [artikel 16][ref11] of [16a][ref12] uit te voeren of indien hij [artikel 17][ref13],
      [17a][ref14] of [18][ref15] niet naleeft, kan hij de desbetreffende netbeheerder opdragen door hem noodzakelijk
      geachte voorzieningen te treffen.

      3 Indien de netbeheerder niet voldoet aan een opdracht als bedoeld in het tweede lid, indien hij vaststelt
      dat opdrachten, bedoeld in [artikel 13a, eerste lid][ref16], niet worden uitgevoerd of indien naar het oordeel
      van Onze Minister door de bedrijfsvoering van deze netbeheerder de continuïteit of de betrouwbaarheid van de
      elektriciteitsvoorziening voor afnemers in gevaar komt en onverwijld ingrijpen noodzakelijk is, kan Onze Minister:

      a. de aanwijzing van de desbetreffende netbeheerder vervallen verklaren en uiterlijk op de dag waarop die
      aanwijzing vervalt een andere naamloze of besloten vennootschap als netbeheerder aanwijzen, of

      b. [artikel 13a][ref17] toepassen.

      4 In een beschikking als bedoeld in het derde lid, onderdeel a, bepaalt Onze Minister de termijn waarop die
      aanwijzing vervalt en kan hij degene die de netbeheerder, bedoeld in de aanhef van het derde lid, heeft aangewezen
      in de gelegenheid stellen binnen een door Onze Minister te bepalen termijn een andere netbeheerder aan hem ter
      aanwijzing voor te dragen. Onze Minister kan deze termijn eenmaal verlengen.

      5 Onze Minister kan voor de periode totdat een beschikking als bedoeld in het derde lid, onderdeel a, in werking
      treedt, [artikel 13a][ref18] toepassen.

      6 Uiterlijk op de dag waarop een beschikking als bedoeld in het derde lid, onderdeel a, in werking treedt, draagt
      de netbeheerder, niet zijnde de netbeheerder van het landelijk hoogspanningsnet, de economische eigendom van het
      net over aan de door Onze Minister aangewezen nieuwe netbeheerder. Degene die de netbeheerder, bedoeld in de aanhef
      van het derde lid, heeft aangewezen, verleent daaraan voor zover nodig zijn medewerking.

      7 De overdracht van de economische eigendom, bedoeld in het zesde lid, geschiedt tegen verrichting van een
      tegenprestatie waarvan de waarde uiterlijk op de in dat lid bedoelde dag is vastgesteld en die ten hoogste de
      opbrengst vertegenwoordigt van de exploitatie van het net, zoals deze op basis van algemene bedrijfseconomische
      uitgangspunten kan worden afgeleid van de door de raad van bestuur van de mededingingsautoriteit in de daaraan
      voorafgaande periode van vijf jaar vastgestelde tarieven met betrekking tot het netbeheer. Deze tegenprestatie kan
      zowel bestaan uit een periodieke uitkering als uit een contant bedrag ineens.

      8 Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bepaalde in dit
      artikel.


