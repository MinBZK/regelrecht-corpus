      __________________________, [16Aa, eerste en tweede lid][ref39], [17, eerste en tweede lid][ref40],
      [17a, eerste en tweede lid][ref41], [18, eerste lid][ref42], [18a][ref43], [19a][ref44],
      [20, derde lid][ref45], [21][ref46], [23][ref47], [24, eerste en derde lid][ref48],
      [26ab][ref49], [26ac][ref50], [26ad, eerste tot en met vierde lid][ref51],
      [26ae, eerste tot en met vierde lid, zesde, zevende en negende lid][ref52], [31, eerste lid][ref53],
      [31a, eerste en tweede lid][ref54], [31b][ref55], [36][ref56], [37][ref57], [43][ref58], [44][ref59],
      [45][ref60], [46][ref61], [47][ref62], [55][ref63], [56, tweede lid][ref64], [57, derde en vierde lid][ref65],
      [68, eerste lid][ref66], [79][ref67], [84][ref68], [86][ref69], [86d][ref70], [86e][ref71],
      [93b][ref72], [95a, eerste lid][ref73], [95b, eerste en vijfde lid][ref74], [95ca][ref75],
      [95cb, eerste, tweede, vijfde en zesde lid][ref76], [95f, tweede lid][ref77] en [95m][ref78] de overtreder per
      overtreding een bestuurlijke boete opleggen van ten hoogste 10% van de omzet van de overtreder in het boekjaar
      voorafgaande aan de beschikking.

      2 Indien op grond van [artikel 5:1, derde lid, van de Algemene wet bestuursrecht][ref79] toepassing is gegeven
      aan [artikel 51, tweede lid, onder 2°, van het Wetboek van Strafrecht][ref80], bedraagt voor de daar bedoelde
      overtreder de bestuurlijke boete ten hoogste € 450 000.

      3 De berekening van de netto-omzet, bedoeld in het eerste lid, geschiedt op de voet van
      [artikel 377, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref81].


