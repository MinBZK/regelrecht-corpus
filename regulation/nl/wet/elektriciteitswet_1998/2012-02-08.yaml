  - number: '47'
    text: |-
      De afnemer of leverancier die verzoekt om elektriciteit te transporteren als bedoeld in
      [artikel 45, eerste of tweede lid][ref1], verstrekt de netbeheerder de inlichtingen die deze nodig heeft om
      te beoordelen of en zo ja, in welke mate, de in Nederland gevestigde afnemer of leverancier op grond van het
      recht van het andere land zou worden beschouwd als een in aanmerking komende afnemer. In ieder geval geeft hij
      aan in welk land de desbetreffende elektriciteit is opgewekt en, voor zover het betreft de afnemer, bedoeld in
      [artikel 45, eerste lid][ref2], de hoeveelheid elektriciteit die hij jaarlijks verbruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel45
