  - number: '46'
    text: |-
      Indien de afnemer of de leverancier, bedoeld in [artikel 45, eerste en tweede lid][ref1], ten aanzien waarvan niet
      bij de in [artikel 45, vierde lid][ref2], bedoelde ministeriële regeling is bepaald dat [het eerste lid][ref3] van
      dat artikel van toepassing is, in het andere land niet zou worden beschouwd als een in aanmerking komende afnemer
      als bedoeld in artikel 21, eerste lid, van de richtlijn, is het de netbeheerder van het landelijk hoogspanningsnet
      verboden een aanbod te doen om elektriciteit te transporteren vanuit dat land naar de desbetreffende afnemer of
      leverancier. Dit verbod geldt niet in de gevallen, bedoeld in [artikel 45, derde lid][ref4].


