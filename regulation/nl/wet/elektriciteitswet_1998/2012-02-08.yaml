  - number: '32'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet of ten minste een derde van het aantal overige netbeheerders
      kan de gezamenlijke netbeheerders verzoeken een voorstel te doen tot wijziging van de tariefstructuren of de
      voorwaarden, bedoeld in de [artikelen 27][ref1] en [31][ref2], onder opgave van de redenen die naar zijn oordeel
      een dergelijke wijziging noodzakelijk maken.

      2 Indien naar zijn oordeel wijziging van de tariefstructuren of de voorwaarden, bedoeld in de [artikelen 27][ref3]
      en [31][ref4], noodzakelijk is, zendt de raad van bestuur van de mededingingsautoriteit een ontwerp van een besluit
      tot wijziging van de tariefstructuren of de voorwaarden aan de gezamenlijke netbeheerders en de representatieve
      organisaties van partijen op de elektriciteitsmarkt.

      3 In een voorstel of een ontwerp van een besluit tot wijziging van de tariefstructuren of de voorwaarden worden die
      onderdelen, bedoeld in [artikel 27][ref5] of [31][ref6], opgenomen waarvan wijziging wordt verzocht.


