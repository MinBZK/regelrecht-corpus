  - number: '44'
    text: |-
      1 Eenmaal in elke drie maanden, alsmede op een verzoek daartoe, meldt de netbeheerder van het landelijk
      hoogspanningsnet aan Onze Minister alle in die periode tot hem gerichte verzoeken om elektriciteit te transporteren
      vanuit een land naar Nederland dan wel vanuit Nederland naar een ander land.

      2 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de melding, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel44
  - number: '45'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet is verplicht aan een afnemer die daarom verzoekt, dan wel
      aan een leverancier die ten behoeve van een afnemer daarom verzoekt, een aanbod te doen om elektriciteit te
      transporteren vanuit een ander land naar deze afnemer die de desbetreffende elektriciteit zelf zal verbruiken,
      indien:

      a. deze afnemer jaarlijks meer elektriciteit verbruikt dan een bij ministeriële regeling aangegeven hoeveelheid en

      b. deze afnemer, gesteld dat hij gevestigd zou zijn in dat andere land, op grond van het recht van dat land zou
      worden beschouwd als een in aanmerking komende afnemer als bedoeld in artikel 21, eerste lid, van de richtlijn.

      2 De netbeheerder van het landelijk hoogspanningsnet is verplicht aan een leverancier die daarom verzoekt, een
      aanbod te doen om elektriciteit te transporteren vanuit een ander land naar deze leverancier, als deze leverancier,
      gesteld dat hij gevestigd zou zijn in het andere land, op grond van het recht van dat land zou worden beschouwd als
      een in aanmerking komende afnemer als bedoeld in artikel 21, eerste lid, van de richtlijn.

      3 De netbeheerder van het landelijk hoogspanningsnet is verplicht aan degene die daarom verzoekt, een aanbod te
      doen om elektriciteit te transporteren, indien op grond van [artikel 48][ref1] een ontheffing is verleend voor
      het gevraagde transport van elektriciteit of de Commissie van de Europese Gemeenschappen op grond van artikel 21,
      tweede lid, onderdeel b, van de richtlijn aan de netbeheerder de verplichting oplegt om het gevraagde transport van
      elektriciteit uit te voeren.

      4 Bij ministeriële regeling kunnen afnemers, leveranciers, overeenkomsten of landen worden aangewezen ten aanzien
      waarvan het eerste of het tweede lid van toepassing is.

      5 Indien het andere land geen lid-staat is van de Europese Unie, wordt onder een in aanmerking komende afnemer
      verstaan een afnemer of leverancier die op grond van het recht van dat land in staat is om elektriciteit uit een
      ander land af te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel48
    url: https://wetten.overheid.nl/BWBR0009755/2012-02-08#Artikel45
