  - number: '5'
    text: |-
      1 De raad van bestuur van de mededingingsautoriteit is belast met taken ter uitvoering van deze wet en de
      Verordening, alsmede met het toezicht op de naleving van deze wet en de Verordening.

      2 De raad van bestuur van de mededingingsautoriteit houdt bij de uitoefening van de hem op grond van deze
      wet en de [Gaswet][ref1] toegekende taken en bevoegdheden rekening met het belang van de bevordering van
      een elektriciteitsmarkt en een gasmarkt die niet-discriminatoir en transparant zijn en die gekenmerkt worden
      door daadwerkelijke mededinging en een doeltreffende marktwerking. Hij volgt nauwlettend in welke mate de
      elektriciteitsmarkt en de gasmarkt aan de in de vorige volzin genoemde belangen voldoen en doet hiervan verslag aan
      Onze Minister.

      3 De werkzaamheden in verband met de uitvoering van [artikel 51][ref2] worden verricht door personen die niet
      betrokken zijn bij werkzaamheden op grond van [hoofdstuk 3, paragrafen 4 tot en met 6][ref3].

      4 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet en de Verordening zijn belast de bij
      besluit van de raad van bestuur van de mededingingsautoriteit aangewezen ambtenaren.

      5 Van een besluit als bedoeld in het vierde lid wordt mededeling gedaan door plaatsing in de Staatscourant.

      6 De raad van bestuur van de mededingingsautoriteit kan bindende aanwijzingen geven in verband met de naleving
      van het bepaalde bij of krachtens deze wet en de Verordening. Van de beschikking wordt mededeling gedaan in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0011440
