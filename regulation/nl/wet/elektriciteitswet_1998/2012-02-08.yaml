  - number: 26ad
    text: |-
      1 Een netbeheerder heeft in het kader van het beheer van de netten in het voor hem krachtens [artikel 36][ref1]
      of [37][ref2] vastgestelde gebied tot taak ervoor zorg te dragen dat een afnemer als bedoeld in
      [artikel 95a, eerste lid][ref3], binnen een redelijke termijn een meetinrichting ter beschikking wordt gesteld die
      ten minste voldoet aan de krachtens [artikel 95la, eerste lid][ref4], gestelde eisen, wanneer:

      a. de afnemer hierom vraagt, tenzij het ter beschikking stellen technisch onmogelijk is, financieel niet redelijk
      is of dit niet in verhouding staat tot de potentiële energiebesparingen;

      b. een bestaande meetinrichting wordt vervangen, tenzij het ter beschikking stellen technisch onmogelijk is of niet
      kostenefficiënt is in verhouding tot de geraamde potentiële energiebesparingen op lange termijn;

      c. een nieuwe aansluiting wordt gemaakt in een nieuw gebouw;

      d. een gebouw ingrijpend wordt gerenoveerd.

      2 Bij algemene maatregel van bestuur kunnen in aanvulling op het eerste lid andere situaties worden
      bepaald waarin een netbeheerder tot taak heeft ervoor zorg te dragen dat een afnemer als bedoeld in
      [artikel 95a, eerste lid][ref5], binnen een redelijke termijn een meetinrichting ter beschikking wordt gesteld die
      ten minste voldoet aan de krachtens [artikel 95la, eerste lid][ref6], gestelde eisen.

      3 In aanvulling op het eerste en tweede lid kan een netbeheerder in het voor hem krachtens [artikel 36][ref7]
      of [37][ref8] vastgestelde gebied ervoor zorg dragen dat een afnemer een meetinrichting ter beschikking wordt
      gesteld die ten minste voldoet aan de krachtens [artikel 95la, eerste lid][ref9], gestelde eisen.

      4 Indien een meetinrichting door de netbeheerder ter beschikking is gesteld ingevolge het eerste lid, onderdeel
      a, of het tweede lid en deze meetinrichting is geïnstalleerd, is de desbetreffende afnemer aan de desbetreffende
      netbeheerder een vergoeding verschuldigd in verband met de meerkosten.

      5 Bij ministeriële regeling wordt de hoogte van de vergoeding vastgesteld die voor verschillende situaties
      verschillend kan worden vastgesteld.

      6 Een ander dan een netbeheerder kan op verzoek van een afnemer als bedoeld in [artikel 95a, eerste lid][ref10],
      er na voorafgaande melding aan de betreffende netbeheerder voor zorgdragen dat die afnemer voor een of
      meer aansluitingen beschikt over een geïnstalleerde meetinrichting die ten minste voldoet aan de krachtens
      [artikel 95la, eerste lid][ref11], gestelde eisen die gelden op het tijdstip van terbeschikkingstelling.

      7 Indien een ander dan een netbeheerder er zorg voor draagt dat een afnemer als bedoeld in
      [artikel 95a, eerste lid][ref12], beschikt over een meetinrichting die ten minste voldoet aan de krachtens
      [artikel 95la][ref13] gestelde eisen, betaalt de betreffende netbeheerder aan die ander een vergoeding.

      8

      9 Het is anderen dan de netbeheerder niet toegestaan bij afnemers als bedoeld in [artikel 95a, eerste lid][ref14],
      geïnstalleerde, op afstand uitleesbare meetinrichtingen te vervangen die zijn geïnstalleerd na 31 december 2005.

      10 Indien een meetinrichting als bedoeld in [artikel 95la, eerste lid][ref15], door de netbeheerder ter beschikking
      wordt gesteld, kan een afnemer als bedoeld in [artikel 95a, eerste lid][ref16], deze meetinrichting weigeren. In
      dat geval wordt door de netbeheerder een niet op afstand uitleesbare meetinrichting ter beschikking gesteld.


