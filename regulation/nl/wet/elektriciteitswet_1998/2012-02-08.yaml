  - number: 31a
    text: |-
      1 Het is een afnemer, leverancier of handelaar verboden al dan niet middellijk of onder voorwaarden de beschikking
      te hebben over een hoeveelheid transportcapaciteit op het landsgrensoverschrijdende net die groter is dan 400 MW.

      2 Onze Minister kan op verzoek voor gebruikers van delen van het landsgrensoverschrijdend net waarvoor een
      ontheffing als bedoeld in [artikel 86c][ref1] is verleend, een afwijkende verdeling van transportcapaciteit
      vaststellen. Onze Minister kan aan de verdeling, bedoeld in de eerste volzin, voorschriften verbinden.

      3 Onder de beschikking hebben over transportcapaciteit als bedoeld in het eerste lid wordt verstaan het
      beschikken over transportcapaciteit door de afnemer, leverancier of handelaar zelf, dan wel tezamen met
      anderen, die werkzaam zijn voor de afnemer, leverancier of handelaar, die in een groep in de zin van
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref2] verbonden zijn met de afnemer, leverancier of handelaar,
      die in de zin van [artikel 24c van Boek 2 van het Burgerlijk Wetboek][ref3] een deelneming hebben in de afnemer,
      leverancier of handelaar, of die anderszins met de afnemer, leverancier of handelaar verbonden zijn.

      4 Onze Minister kan op voorstel van de raad van bestuur van de mededingingsautoriteit de hoeveelheid van 400 MW,
      bedoeld in het eerste lid, wijzigen, indien de ontwikkeling van de elektriciteitsmarkt daartoe aanleiding geeft.

      5 De [hoofdstukken 6][ref4], [7][ref5],
      [8, met uitzondering van paragraaf 2, 9, 11 en 12 van de Mededingingswet][ref6] zijn van overeenkomstige
      toepassing in geval van overtreding van dit artikel.


