  - number: '56'
    text: |-
      1 Na ontvangst van een voorstel als bedoeld in [artikel 54, eerste lid][ref1], kan de raad van bestuur
      van de mededingingsautoriteit de ondernemingen die het voorstel hebben ingediend, opdragen binnen vier
      weken en met inachtneming van zijn bevindingen, waaronder zijn bevindingen omtrent de belangen, bedoeld
      in [artikel 36, eerste lid, onderdelen b tot en met f][ref2], de regels, bedoeld in [artikel 53][ref3],
      of het bepaalde in artikel 36, tweede lid, het voorstel te wijzigen. Indien de raad van bestuur van de
      mededingingsautoriteit van deze bevoegdheid gebruik maakt is [artikel 4:15 van de Algemene wet bestuursrecht][ref4]
      van overeenkomstige toepassing.

      2 Indien de ondernemingen, bedoeld in het eerste lid, niet binnen vier weken het voorstel wijzigen
      overeenkomstig de opdracht van de raad van bestuur van de mededingingsautoriteit, stelt de raad van bestuur
      van de mededingingsautoriteit de voorwaarden vast onder het aanbrengen van zodanige wijzigingen dat deze in
      overeenstemming zijn met de belangen, bedoeld in [artikel 36, eerste lid][ref5], onderdelen b tot en met f, met
      artikel 36, tweede lid, of met de regels, bedoeld in [artikel 53][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel54
