  - number: '43.2'
    text: 'De afzonderlijke boekhouding bevat:'
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel43
  - number: 43.2.a
    text: een balans en een winst- en verliesrekening,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel43
  - number: 43.2.b
    text: |-
      een specificatie van de toerekening van de activa en de passiva en de lasten en baten aan activiteiten als bedoeld
      in het eerste lid, waarbij in het bijzonder voor iedere transporttrap de kosten, opbrengsten en hoeveelheden van
      tenminste de functies, bedoeld in de [artikelen 27 tot en met 30a][ref1], worden aangegeven,


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 43.2.c
    text: een specificatie van de inkomsten verkregen uit de eigendom van het net, en
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel43
  - number: 43.2.d
    text: een toelichting op de gebruikte regels voor de afschrijving.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel43
  - number: '43.3'
    text: De netbeheerder geeft in de boekhouding aan welke methoden en criteria bij het opstellen daarvan zijn gehanteerd.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel43
  - number: '43.4'
    text: |-
      Het toerekenen van kosten aan activiteiten als bedoeld in het eerste lid geschiedt in overeenstemming met het
      daadwerkelijk gebruik van financiële of andere middelen voor die activiteiten.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel43
  - number: '43.5'
    text: |-
      Wijzigingen in de in het tweede lid bedoelde regels voor de afschrijving worden met redenen omkleed in de
      boekhouding vermeld.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel43
  - number: '43.6'
    text: |-
      In de toelichting op de jaarrekening wordt elk verwant bedrijf waarmee een netbeheerder een overeenkomst heeft
      gesloten waarvan de opbrengst of de kosten een bedrag van € 4 500 000 te boven gaat, vermeld. Daarbij wordt tevens
      per bedrijf het aantal van die overeenkomsten gemeld.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel43
  - number: '43.7'
    text: |-
      Indien een netbeheerder niet reeds uit hoofde van een wettelijke verplichting zijn jaarrekening of een daarmee
      overeenkomend financieel overzicht openbaar maakt, legt hij die jaarrekening of dat overzicht voor een ieder ter
      inzage op het kantoor van zijn hoofdvestiging.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel43
  - number: '43.8'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de inrichting van de boekhouding
      voor de in het eerste lid bedoelde activiteiten.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel43
  - number: '44.1'
    text: |-
      Eenmaal in elke drie maanden, alsmede op een verzoek daartoe, meldt de netbeheerder van het landelijk
      hoogspanningsnet aan Onze Minister alle in die periode tot hem gerichte verzoeken om elektriciteit te transporteren
      vanuit een land naar Nederland dan wel vanuit Nederland naar een ander land.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel44
  - number: '44.2'
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de melding, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel44
  - number: '45.1'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet is verplicht aan een afnemer die daarom verzoekt, dan wel
      aan een leverancier die ten behoeve van een afnemer daarom verzoekt, een aanbod te doen om elektriciteit te
      transporteren vanuit een ander land naar deze afnemer die de desbetreffende elektriciteit zelf zal verbruiken,
      indien:
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel45
  - number: 45.1.a
    text: deze afnemer jaarlijks meer elektriciteit verbruikt dan een bij ministeriële regeling aangegeven hoeveelheid en
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel45
  - number: 45.1.b
    text: |-
      deze afnemer, gesteld dat hij gevestigd zou zijn in dat andere land, op grond van het recht van dat land zou worden
      beschouwd als een in aanmerking komende afnemer als bedoeld in artikel 21, eerste lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel45
  - number: '45.2'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet is verplicht aan een leverancier die daarom verzoekt, een
      aanbod te doen om elektriciteit te transporteren vanuit een ander land naar deze leverancier, als deze leverancier,
      gesteld dat hij gevestigd zou zijn in het andere land, op grond van het recht van dat land zou worden beschouwd als
      een in aanmerking komende afnemer als bedoeld in artikel 21, eerste lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel45
  - number: '45.3'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet is verplicht aan degene die daarom verzoekt, een aanbod te
      doen om elektriciteit te transporteren, indien op grond van [artikel 48][ref1] een ontheffing is verleend voor
      het gevraagde transport van elektriciteit of de Commissie van de Europese Gemeenschappen op grond van artikel 21,
      tweede lid, onderdeel b, van de richtlijn aan de netbeheerder de verplichting oplegt om het gevraagde transport van
      elektriciteit uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel48
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '7'
  - number: '45.4'
    text: |-
      Bij ministeriële regeling worden afnemers, leveranciers, overeenkomsten of landen aangewezen ten aanzien waarvan
      het eerste lid of het tweede lid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel45
  - number: '45.5'
    text: |-
      Indien het andere land geen lid-staat is van de Europese Unie, wordt onder een in aanmerking komende afnemer
      verstaan een afnemer of leverancier die op grond van het recht van dat land in staat is om elektriciteit uit een
      ander land af te nemen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel45
  - number: '46'
    text: |-
      Indien de afnemer of de leverancier, bedoeld in [artikel 45, eerste en tweede lid][ref1], ten aanzien waarvan niet
      bij de in [artikel 45, vierde lid][ref2], bedoelde ministeriële regeling is bepaald dat [het eerste lid][ref3] van
      dat artikel van toepassing is, in het andere land niet zou worden beschouwd als een in aanmerking komende afnemer
      als bedoeld in artikel 21, eerste lid, van de richtlijn, is het de netbeheerder van het landelijk hoogspanningsnet
      verboden een aanbod te doen om elektriciteit te transporteren vanuit dat land naar de desbetreffende afnemer of
      leverancier. Dit verbod geldt niet in de gevallen, bedoeld in [artikel 45, derde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel45
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '7'
      - id: ref4
        bwb_id: BWBR0009755
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '7'
  - number: '47'
    text: |-
      De afnemer of leverancier die verzoekt om elektriciteit te transporteren als bedoeld in
      [artikel 45, eerste of tweede lid][ref1], verstrekt de netbeheerder de inlichtingen die deze nodig heeft om
      te beoordelen of en zo ja, in welke mate, de in Nederland gevestigde afnemer of leverancier op grond van het
      recht van het andere land zou worden beschouwd als een in aanmerking komende afnemer. In ieder geval geeft hij
      aan in welk land de desbetreffende elektriciteit is opgewekt en, voor zover het betreft de afnemer, bedoeld in
      [artikel 45, eerste lid][ref2], de hoeveelheid elektriciteit die hij jaarlijks verbruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel45
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '7'
  - number: '49'
    text: |-
      De afnemer of leverancier wiens transactie als bedoeld in artikel 21, tweede lid, onderdeel b, van de richtlijn, is
      geweigerd, kan aan Onze Minister verzoeken zijn bevoegdheid, bedoeld in dat artikelonderdeel van de richtlijn, uit
      te oefenen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel49
  - number: '50.1'
    text: |-
      Indien blijkt dat degene die een verzoek heeft gedaan als bedoeld in [artikel 45, eerste of tweede lid][ref1],
      daarbij onjuiste of onvolledige gegevens heeft verstrekt aan de netbeheerder van het landelijk hoogspanningsnet
      en deze op grond van [artikel 46][ref2] geen aanbod tot het uitvoeren van het desbetreffende transport zou
      hebben gedaan als juiste en volledige gegevens zouden zijn verstrekt, staakt de netbeheerder van het landelijk
      hoogspanningsnet het ten behoeve van die verzoeker uitgevoerde transport van elektriciteit en vernietigt hij de
      overeenkomst met betrekking tot dat transport.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel46
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '7'
  - number: '50.2'
    text: |-
      Indien de netbeheerder van het landelijk hoogspanningsnet een overeenkomst heeft vernietigd op grond van het
      eerste lid, is degene die het verzoek om het desbetreffende transport heeft gedaan, verplicht bij een nieuw verzoek
      als bedoeld in [artikel 45, eerste of tweede lid][ref1], schriftelijke verklaringen te voegen van de afnemer of
      leverancier, inhoudend dat de te transporteren elektriciteit voor hem bestemd is, en van de producent, inhoudend
      dat de te transporteren elektriciteit door hem zal worden opgewekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel45
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '7'
  - number: '50.3'
    text: |-
      Het tweede lid is van overeenkomstige toepassing indien de netbeheerder van het landelijk hoogspanningsnet bekend
      wordt met de onjuistheid of de onvolledigheid van de gegevens nadat hij zijn verbintenis uit de overeenkomst
      voor het transport van elektriciteit is nagekomen en hij dat heeft gemeld aan degene die het verzoek om het
      desbetreffende transport van elektriciteit heeft gedaan, dan wel indien Onze Minister een ontheffing als bedoeld in
      [artikel 48][ref1] heeft ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel48
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '7'
  - number: '50.4'
    text: |-
      Indien het tweede lid van toepassing is, doet de netbeheerder van het landelijk hoogspanningsnet geen aanbod
      om elektriciteit te transporteren als bedoeld in [artikel 45, eerste of tweede lid][ref1], dan nadat hij de
      schriftelijke verklaringen heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel45
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '7'
  - number: '51.1'
    text: |-
      Een partij die een geschil heeft met een netbeheerder over de wijze waarop deze zijn taken en bevoegdheden op grond
      van deze wet uitoefent, dan wel aan zijn verplichtingen op grond van deze wet voldoet, kan een klacht bij de raad
      van bestuur van de mededingingsautoriteit indienen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel51
  - number: '51.2'
    text: |-
      De raad van bestuur van de mededingingsautoriteit beslist op een klacht binnen twee maanden na ontvangst van de
      klacht. Indien de klacht betrekking heeft op de tarieven voor de aansluiting op het net van een grote productie-
      eenheid, kan de raad van bestuur van de mededingingsautoriteit een langere termijn stellen. De raad van bestuur
      van de mededingingsautoriteit kan de in de eerste volzin genoemde termijn met twee maanden verlengen als hij
      aanvullende gegevens nodig heeft. Indien de klager daarmee instemt, is verdere verlenging mogelijk.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel51
  - number: '51.3'
    text: De beslissing van de raad van bestuur van de mededingingsautoriteit is bindend.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel51
  - number: '51.4'
    text: |-
      Het indienen van een klacht als bedoeld in het eerste lid laat onverlet elke mogelijkheid voor de desbetreffende
      partij een hem ter beschikking staand rechtsmiddel aan te wenden.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel51
  - number: '52'
    text: |-
      In het geval van een landsgrensoverschrijdend geschil is de raad van bestuur van de mededingingsautoriteit
      onbevoegd te beslissen op een klacht als bedoeld in [artikel 51][ref1], als de netbeheerder waartegen de klacht is
      gericht onder de rechtsmacht van een andere lidstaat van de Europese Unie valt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel51
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '51'
        hoofdstuk: '3'
        paragraaf: '8'
  - number: '68.1'
    text: |-
      Producenten en leveranciers hebben tot taak, mede gelet op het belang van de bescherming van het milieu, bedoeld
      in artikel 3, tweede lid, van de richtlijn, te bevorderen dat elektriciteit door henzelf en door afnemers op een
      doelmatige en milieuhygiënisch verantwoorde wijze wordt geproduceerd of gebruikt.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel68
  - number: '68.2'
    text: |-
      Iedere producent of leverancier die per jaar gemiddeld 10 GWh of meer levert meldt eenmaal in elke twee jaar vóór
      1 maart aan Onze Minister op welke wijze hij in de twee jaar voorafgaande aan het jaar, waarin de melding wordt
      verricht, uitvoering heeft gegeven aan zijn taak, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel68
  - number: '73.1'
    text: |-
      Ter stimulering van de productie van duurzame elektriciteit bestaat een elektronisch systeem voor het uitgeven en
      innemen van garanties van oorsprong voor duurzame elektriciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel73
  - number: '73.2'
    text: |-
      Onze Minister wijst steeds voor een periode van tien jaar een instantie aan die onafhankelijk is van producenten,
      leveranciers en handelaren en die op aanvraag van een producent een garantie van oorsprong uitgeeft.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel73
  - number: '74'
    text: |-
      Een garantie van oorsprong voor duurzame elektriciteit toont bij uitsluiting aan dat de daarop aangegeven
      hoeveelheid elektriciteit op duurzame wijze is opgewekt.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel74
  - number: '75.1'
    text: |-
      De garantiebeheerinstantie verstrekt desgevraagd kosteloos aan Onze Minister de voor de uitoefening van zijn taak
      benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden voor zover dat voor
      de vervulling van zijn taak redelijkerwijs noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel75
  - number: '75.2'
    text: |-
      De garantiebeheerinstantie zendt Onze Minister jaarlijks een verslag betreffende de door de instantie krachtens de
      aanwijzing, bedoeld in artikel 73, tweede lid, uitgevoerde taken en de werkwijze in het afgelopen jaar.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel75
  - number: '76.1'
    text: 'De garantiebeheerinstantie doet onverwijld mededeling aan Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel76
  - number: 76.1.a
    text: van omstandigheden die een wijziging inhouden van de voorwaarden op grond waarvan deze instantie is aangewezen;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel76
  - number: 76.1.b
    text: |-
      indien de instantie voornemens is een of meer van de taken die zij krachtens de aanwijzing, bedoeld in
      [artikel 73, tweede lid][ref1], uitvoert, te beëindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel73
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '73'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '76.2'
    text: |-
      Onze Minister kan een aanwijzing als bedoeld in [artikel 73, tweede lid][ref1], opschorten of intrekken
      indien, naar zijn oordeel, de garantiebeheerinstantie niet of niet volledig voldoet aan de bij of krachtens
      deze wet gestelde voorschriften. Gedurende de periode van een opschorting treft Onze Minister de noodzakelijke
      voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel73
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '73'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '76.3'
    text: |-
      Onze Minister kan de in het vorige lid bedoelde opschorting opheffen indien de garantiebeheerinstantie weer
      voldoet aan de in het vorige lid bedoelde voorschriften. In dat geval vervallen de in het vorige lid bedoelde
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel76
  - number: '77.1'
    text: |-
      De garantiebeheerinstantie opent op aanvraag van een in Nederland gevestigde producent, leverancier, handelaar of
      afnemer een rekening.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77
  - number: '77.2'
    text: |-
      Bij de in het eerste lid bedoelde aanvraag overlegt de producent, leverancier, handelaar of afnemer het resultaat
      van de vaststelling, bedoeld in [artikel 16, eerste lid, onderdeel h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '77.3'
    text: |-
      De garantiebeheerinstantie boekt op aanvraag garanties van oorsprong voor duurzame elektriciteit op een daarbij
      aangegeven rekening, indien een in Nederland gevestigde producent bij deze aanvraag de gegevens omtrent de door de
      netbeheerder of door een andere tot meten bevoegde instantie gemeten hoeveelheid duurzame elektriciteit overlegt.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77
  - number: 77a
    text: |-
      De garantiebeheerinstantie deelt iedere maand aan Onze Minister mee voor welke hoeveelheid duurzame elektriciteit
      overeenkomstig de bij of krachtens deze paragraaf gestelde bepalingen garanties van oorsprong voor duurzame
      elektriciteit zijn uitgegeven, alsmede op welke wijze de duurzame elektriciteit waarop die garanties van oorsprong
      voor duurzame elektriciteit betrekking hebben, is opgewekt.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77a
  - number: 77b
    text: |-
      Waar in deze wet en de daarop berustende bepalingen wordt verwezen naar garanties van oorsprong voor duurzame
      elektriciteit, worden garanties van oorsprong voor duurzame elektriciteit uitgegeven door onafhankelijke instanties
      in een andere lidstaat van de Europese Unie, die naar aard en strekking overeenkomen met eerstbedoelde garanties
      van oorsprong voor duurzame elektriciteit, daarmee gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77b
  - number: 77c
    text: 'Onze Minister stelt bij ministeriële regeling regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77c
  - number: 77c.a
    text: |-
      de informatie die door de garantiebeheerinstantie op grond van de [artikelen 75, eerste lid][ref1], en [77a][ref2]
      verstrekt wordt aan Onze Minister en die door producenten, leveranciers, handelaars, afnemers of netbeheerders
      verstrekt wordt aan de garantiebeheerinstantie;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel77a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '75'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 77a
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 77c.b
    text: |-
      het uitgeven en de geldigheidsduur van garanties van oorsprong voor duurzame elektriciteit, het vermelden van
      gegevens op garanties van oorsprong voor duurzame elektriciteit en het in rekening brengen van de kosten die
      gepaard gaan met handelingen met betrekking tot garanties van oorsprong voor duurzame elektriciteit;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77c
  - number: 77c.c
    text: |-
      de voorwaarden waaronder en de wijze waarop producenten, leveranciers, handelaars of afnemers gebruik kunnen maken
      van de door hen verkregen garanties van oorsprong voor duurzame elektriciteit of deze kunnen verhandelen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77c
  - number: 77ca.1
    text: |-
      Ter stimulering van de productie van elektriciteit opgewekt in een installatie voor hoogrenderende
      warmtekrachtkoppeling bestaat een elektronisch systeem voor het uitgeven en innemen van garanties van oorsprong
      voor elektriciteit opgewekt in een installatie voor hoogrenderende warmtekrachtkoppeling.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77ca
  - number: 77ca.2
    text: |-
      De [artikelen 73, tweede lid][ref1], [75][ref2] en [76][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel76
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77ca
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '73'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '75'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 77cb.1
    text: |-
      De garantiebeheerinstantie opent op aanvraag van een in Nederland gevestigde producent van elektriciteit opgewekt
      in een installatie voor hoogrenderende warmtekrachtkoppeling een rekening.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77cb
  - number: 77cb.2
    text: |-
      Bij de aanvraag, bedoeld in het eerste lid, overleg de producent het resultaat van de vaststelling, bedoeld in
      [artikel 16, eerste lid, onderdeel h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77cb
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 77cb.3
    text: |-
      De garantiebeheerinstantie boekt op aanvraag garanties van oorsprong voor elektriciteit opgewekt in een installatie
      voor hoogrenderende warmtekrachtkoppeling op een daarbij aangegeven rekening, indien een in Nederland gevestigde
      producent bij deze aanvraag de gegevens omtrent de door de netbeheerder of door een andere tot meten bevoegde
      instantie gemeten hoeveelheid elektriciteit opgewekt in een installatie voor hoogrenderende warmtekrachtkoppeling
      overlegt. Onze Minister kan bij ministeriële regeling andere gegevens vaststellen die de producent bij deze
      aanvraag verstrekt.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77cb
  - number: 77cc
    text: |-
      De garantiebeheerinstantie deelt ieder kalenderjaar aan Onze Minister mee voor welke hoeveelheid elektriciteit
      opgewekt in een installatie voor hoogrenderende warmtekrachtkoppeling overeenkomstig de bij of krachtens de
      [artikelen 77ca tot en met 77ce][ref1] gestelde bepalingen garanties van oorsprong zijn uitgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77ca
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77cc
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 77ca
        hoofdstuk: '5'
        paragraaf: 3a
  - number: 77cd
    text: |-
      Waar in deze wet en de daarop berustende bepalingen wordt verwezen naar garanties van oorsprong voor elektriciteit
      opgewekt in een installatie voor hoogrenderende warmtekrachtkoppeling, worden garanties van oorsprong voor
      elektriciteit opgewekt in een installatie voor hoogrenderende warmtekrachtkoppeling uitgegeven door onafhankelijke
      instanties in een andere lidstaat van de Europese Unie, die naar aard en strekking overeenkomen met eerstbedoelde
      garanties van oorsprong, daarmee gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77cd
  - number: 77ce
    text: 'Onze Minister kan bij ministeriële regeling regels stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77ce
  - number: 77ce.a
    text: |-
      de informatie die door de garantiebeheerinstantie op grond van de [artikelen 77ca, tweede lid][ref1], juncto de
      [artikelen 75, eerste lid][ref2], en [77a][ref3] verstrekt wordt aan Onze Minister en die door producenten van
      elektriciteit opgewekt in een installatie voor hoogrenderende warmtekrachtkoppeling of netbeheerders verstrekt
      wordt aan de garantiebeheerinstantie;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77ca
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel77a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77ce
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 77ca
        hoofdstuk: '5'
        paragraaf: 3a
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '75'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 77a
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 77ce.b
    text: |-
      het uitgeven en de geldigheidsduur van garanties van oorsprong voor elektriciteit opgewekt in een installatie voor
      hoogrenderende warmtekrachtkoppeling, het vermelden van gegevens op de garanties van oorsprong en het in rekening
      brengen van de kosten die gepaard gaan met handelingen met betrekking tot de garanties van oorsprong;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77ce
  - number: 77ce.c
    text: |-
      het openen van een rekening, het boeken van garanties van oorsprong voor elektriciteit opgewekt in een installatie
      voor hoogrenderende warmtekrachtkoppeling op die rekening en de gegevens die een producent daarbij overlegt.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77ce
  - number: 77h.1
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan ingeval van overtreding van het bepaalde bij of krachtens
      deze wet, met uitzondering van [artikel 13][ref1], [22, tweede lid][ref2], en [hoofdstuk 8, § 1a][ref3], dan wel
      van overtreding van het bepaalde bij de Verordening de overtreder een last onder dwangsom opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77h
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0009755
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 77h.2
    text: |-
      Indien daarvoor naar zijn oordeel aanleiding bestaat, gelet op het voorschrift waarop de overtreding betrekking
      heeft, geeft de raad van bestuur van de mededingingsautoriteit een bindende aanwijzing als bedoeld in
      [artikel 5, zesde lid][ref1], alvorens een last onder dwangsom op te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel5
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77h
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '5'
        hoofdstuk: '2'
  - number: 77h.3
    text: |-
      Aan een last onder dwangsom kunnen voorschriften worden verbonden inzake het verstrekken van gegevens aan de raad
      van bestuur van de mededingingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77h
  - number: 77h.4
    text: |-
      De bevoegdheid tot het opleggen van een last onder dwangsom vervalt vijf jaren nadat de overtreding heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77h
  - number: 77h.5
    text: |-
      Indien de raad van bestuur van de mededingingsautoriteit vaststelt dat een overtreding als bedoeld in het eerste
      lid is begaan, doet hij daarvan een rapport opmaken.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77h
  - number: 77h.6
    text: |-
      [Afdeling 5.4.2 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.4.2
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel77h
    references:
