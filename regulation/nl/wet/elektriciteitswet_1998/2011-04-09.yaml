  - number: '12.3'
    text: |-
      Indien Onze Minister voorschriften verbindt aan zijn instemming, strekken deze er slechts toe de geconstateerde
      tekortkomingen, bedoeld in het tweede lid, weg te nemen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel12
  - number: '13.1'
    text: |-
      Indien het aanwijzen van een netbeheerder als bedoeld in [artikel 10, tweede of derde lid][ref1], niet is geschied
      binnen vier weken na de aanleg van een net dan wel onverwijld na het intrekken of vervallen van een eerdere
      aanwijzing, wijst Onze Minister een naamloze of besloten vennootschap aan als netbeheerder van dat net.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '13.2'
    text: |-
      Indien Onze Minister vaststelt dat niet meer voldaan wordt aan de [artikelen 10a][ref1], [10b][ref2], [11][ref3],
      [11a][ref4] of [11b][ref5] of dat een netbeheerder in onvoldoende mate in staat is of zal zijn om aan een
      verplichting als bedoeld in de [artikelen 7][ref6], [16Aa][ref7], [18a][ref8] of [78][ref9] te voldoen, om een taak
      als bedoeld in [artikel 16][ref10] of [16a][ref11] uit te voeren of indien hij [artikel 17][ref12], [17a][ref13]
      of [18][ref14] niet naleeft, kan hij de desbetreffende netbeheerder opdragen door hem noodzakelijk geachte
      voorzieningen te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel11a
      [ref5]: https://wetten.overheid.nl/BWBR0009755#Artikel11b
