  - number: '13.3'
    text: |-
      Indien de netbeheerder niet voldoet aan een opdracht als bedoeld in het tweede lid, indien hij vaststelt dat
      opdrachten, bedoeld in [artikel 13a, eerste lid][ref1], niet worden uitgevoerd of indien naar het oordeel
      van Onze Minister door de bedrijfsvoering van deze netbeheerder de continuïteit of de betrouwbaarheid van de
      elektriciteitsvoorziening voor afnemers in gevaar komt en onverwijld ingrijpen noodzakelijk is, kan Onze Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel13a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 13a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 13.3.a
    text: |-
      de aanwijzing van de desbetreffende netbeheerder vervallen verklaren en uiterlijk op de dag waarop die aanwijzing
      vervalt een andere naamloze of besloten vennootschap als netbeheerder aanwijzen, of
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel13
  - number: 13.3.b
    text: |-
      [artikel 13a][ref1] toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel13a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 13a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '13.4'
    text: |-
      In een beschikking als bedoeld in het derde lid, onderdeel a, bepaalt Onze Minister de termijn waarop die
      aanwijzing vervalt en kan hij degene die de netbeheerder, bedoeld in de aanhef van het derde lid, heeft aangewezen
      in de gelegenheid stellen binnen een door Onze Minister te bepalen termijn een andere netbeheerder aan hem ter
      aanwijzing voor te dragen. Onze Minister kan deze termijn eenmaal verlengen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel13
  - number: '13.5'
    text: |-
      Onze Minister kan voor de periode totdat een beschikking als bedoeld in het derde lid, onderdeel a, in werking
      treedt, [artikel 13a][ref1] toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel13a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 13a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '13.6'
    text: |-
      Uiterlijk op de dag waarop een beschikking als bedoeld in het derde lid, onderdeel a, in werking treedt, draagt de
      netbeheerder, niet zijnde de netbeheerder van het landelijk hoogspanningsnet, de economische eigendom van het net
      over aan de door Onze Minister aangewezen nieuwe netbeheerder. Degene die de netbeheerder, bedoeld in de aanhef van
      het derde lid, heeft aangewezen, verleent daaraan voor zover nodig zijn medewerking.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel13
  - number: '13.7'
    text: |-
      De overdracht van de economische eigendom, bedoeld in het zesde lid, geschiedt tegen verrichting van een
      tegenprestatie waarvan de waarde uiterlijk op de in dat lid bedoelde dag is vastgesteld en die ten hoogste de
      opbrengst vertegenwoordigt van de exploitatie van het net, zoals deze op basis van algemene bedrijfseconomische
      uitgangspunten kan worden afgeleid van de door de raad van bestuur van de mededingingsautoriteit in de daaraan
      voorafgaande periode van vijf jaar vastgestelde tarieven met betrekking tot het netbeheer. Deze tegenprestatie kan
      zowel bestaan uit een periodieke uitkering als uit een contant bedrag ineens.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel13
  - number: '13.8'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bepaalde in dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel13
  - number: 13a.1
    text: |-
      Onze Minister kan de netbeheerder aanzeggen dat hij vanaf een bepaald tijdstip de opdrachten dient op te volgen
      die aan hem worden verstrekt door een door Onze Minister aangewezen persoon. Bij de aanzegging geeft Onze Minister
      aan ter bescherming van welk belang de aanzegging geschiedt. Bij de aanzegging kunnen voorschriften en beperkingen
      worden gesteld aan de te geven opdrachten. De aangewezen persoon verstrekt uitsluitend opdrachten ter bescherming
      van het belang, bedoeld in de tweede volzin.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel13a
  - number: 13a.2
    text: De netbeheerder verschaft de door Onze Minister aangewezen persoon desgevraagd alle medewerking.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel13a
  - number: 13a.3
    text: Onze Minister kan te allen tijde de door hem aangewezen persoon vervangen door een andere persoon.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel13a
  - number: 13a.4
    text: |-
      De door Onze Minister aangewezen persoon oefent zijn bevoegdheid uit gedurende een door Onze Minister in de
      aanzegging bepaalde termijn. Deze termijn bedraagt ten hoogste zes maanden indien het betreft een aanzegging als
      bedoeld in [artikel 13, derde lid, onderdeel b][ref1]. Deze termijn kan eenmaal met ten hoogste zes maanden worden
      verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel13
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 13a.5
    text: |-
      Voor schade ten gevolge van handelingen die zijn verricht in strijd met een opdracht als bedoeld in het eerste lid,
      zijn bestuurders persoonlijk aansprakelijk tegenover de netbeheerder.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel13a
  - number: '14.1'
    text: |-
      Degenen, bedoeld in [artikel 10, tweede of derde lid][ref1], kunnen met inachtneming van een redelijke termijn
      de aanwijzing als netbeheerder vervangen door een aanwijzing van een andere naamloze of besloten vennootschap als
      netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '14.2'
    text: |-
      In geval van fusie, splitsing, ontbinding of faillissement van de vennootschap die als netbeheerder
      is aangewezen, vervalt de aanwijzing als netbeheerder van rechtswege en wijzen degenen, bedoeld in
      [artikel 10, tweede en derde lid][ref1], onverwijld een naamloze of besloten vennootschap als netbeheerder aan.
      Deze vennootschap kan dezelfde zijn als de vennootschap die daarvoor als netbeheerder was aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '14.3'
    text: |-
      Degenen, bedoeld in [artikel 10, tweede en derde lid][ref1], wijzen voor afloop van de periode, bedoeld in
      [artikel 10, vierde lid][ref2], een naamloze of besloten vennootschap als netbeheerder aan voor de daarop
      aansluitende periode. Deze vennootschap kan dezelfde zijn als de vennootschap die daarvoor als netbeheerder was
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '14.4'
    text: |-
      De [artikelen 10 tot en met 13][ref1] zijn van overeenkomstige toepassing op de aanwijzing als netbeheerder,
      bedoeld in het eerste, tweede of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '15.1'
    text: |-
      Het gebod, bedoeld in [artikel 10, derde lid][ref1], geldt niet voor zover het een net betreft met een
      spanningsniveau van ten hoogste 0,4 kV en een verbruik van ten hoogste 0,1 GWh per jaar, en een ander dan een
      leverancier of een netbeheerder een recht van gebruik heeft van dat net.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '15.2'
    text: |-
      Onze Minister kan op diens aanvraag aan degene aan wie een ander net dan het landelijk hoogspanningsnet toebehoort
      een ontheffing verlenen van het gebod, bedoeld in [artikel 10, derde lid][ref1], voor zover het een net betreft
      waarop een beperkt aantal andere natuurlijke personen of rechtspersonen zijn aangesloten en:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 15.2.a
    text: |-
      het net bestemd is om de aanvrager te voorzien van elektriciteit dan wel om het centrale bedrijfsproces van de
      aanvrager te ondersteunen, of
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel15
  - number: 15.2.b
    text: |-
      het net bestemd is om een aantal samenwerkende natuurlijke personen of rechtspersonen te voorzien van elektriciteit
      en de samenwerking van deze personen een betrouwbaar, duurzaam, doelmatig en milieuhygiënisch verantwoord
      functionerende energiehuishouding in hun vestigingen ten doel heeft, of
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel15
  - number: 15.2.c
    text: |-
      ten aanzien van het net kwaliteitseisen van toepassing zijn die in betekenende mate afwijken van de voorwaarden die
      de raad van bestuur van de mededingingsautoriteit op grond van [artikel 36][ref1] of [37][ref2] heeft vastgesteld,
      en


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel37
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 15.2.d
    text: de aanvrager geen netbeheerder is en niet in een groepsmaatschappij met een netbeheerder verbonden is.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel15
  - number: '15.3'
    text: |-
      Indien een ontheffing als bedoeld in het tweede lid is verleend, sluit de ontheffinghouder een overeenkomst met
      de netbeheerder van het net waarop zijn net is aangesloten om te waarborgen dat de uitvoering van de taken van die
      netbeheerder niet wordt belemmerd.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel15
  - number: '15.4'
    text: |-
      Aan een ontheffing kunnen voorschriften worden verbonden met betrekking tot de aansluiting op het net, de toegang
      tot het net, het uitvoeren van de taken als bedoeld in [artikel 16, eerste lid][ref1], of [16a][ref2] en met
      betrekking tot de tarieven en voorwaarden die daarbij gehanteerd moeten worden.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 16a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '15.5'
    text: 'Onze Minister kan een ontheffing intrekken indien degene aan wie de ontheffing is verleend:'
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel15
  - number: 15.5.a
    text: niet langer voldoet aan de voorwaarden, bedoeld in het tweede lid,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel15
  - number: 15.5.b
    text: in strijd handelt met het derde lid of de voorschriften, bedoeld in het vierde lid, of
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel15
  - number: 15.5.c
    text: |-
      bij de aanvraag om een ontheffing onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van juiste of
      volledige gegevens tot een andere beschikking op de aanvraag zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel15
  - number: '15.6'
    text: |-
      In afwijking van het tweede lid, onderdeel d, kan aan een aanvrager die in een groepsmaatschappij met een
      netbeheerder is verbonden een ontheffing worden verleend, indien van hem in redelijkheid niet kan worden verwacht
      dat hij een netbeheerder aanwijst voor het net waarop de aanvraag betrekking heeft. Een netbeheerder onthoudt zich
      van bemoeienis met het beheer van het net waarop de ontheffing betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel15
  - number: '16.1'
    text: |-
      De netbeheerder heeft in het kader van het beheer van de netten in het voor hem krachtens [artikel 36][ref1] of
      [37][ref2] vastgestelde gebied tot taak:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel37
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 16.1.a
    text: de door hem beheerde netten in werking te hebben en te onderhouden;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: 16.1.b
    text: |-
      de veiligheid en betrouwbaarheid van de netten en van het transport van elektriciteit over de netten op de meest
      doelmatige wijze te waarborgen;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: 16.1.c
    text: |-
      de netten aan te leggen, te herstellen, te vernieuwen of uit te breiden, waarbij in overweging worden
      genomen maatregelen op het gebied van duurzame elektriciteit, energiebesparing en vraagsturing of decentrale
      elektriciteitsproductie waardoor de noodzaak van vervanging of vergroting van de productiecapaciteit ondervangen
      kan worden;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: 16.1.d
    text: voldoende reservecapaciteit voor het transport van elektriciteit aan te houden;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: 16.1.e
    text: |-
      op de grondslag van [artikel 23][ref1] derden te voorzien van een aansluiting op de netten en hun desgevraagd een
      meter ter beschikking te stellen;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel23
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 16.1.f
    text: |-
      op de grondslag van [artikel 24][ref1] ten behoeve van derden transport van elektriciteit uit te voeren;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel24
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 16.1.g
    text: het bevorderen van de veiligheid bij het gebruik van toestellen en installaties die elektriciteit verbruiken;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: 16.1.h
    text: |-
      op verzoek van een producent vast te stellen of diens productie-installatie geschikt is voor de opwekking van
      duurzame elektriciteit dan wel of sprake is van een installatie voor warmtekrachtkoppeling met een bij ministeriële
      regeling vast te stellen mate van reductie van de uitstoot van kooldioxide dan wel of sprake is van een installatie
      voor hoogrenderende warmtekrachtkoppeling, alsmede of de meetinrichting geschikt is voor de meting van de
      elektriciteit die met de productie-installatie wordt opgewekt en op een net of een installatie ingevoed;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: 16.1.i
    text: |-
      de hoeveelheid elektriciteit te meten die afkomstig is van een productie-installatie voor duurzame elektriciteit of
      klimaatneutrale elektriciteit of van een installatie voor warmtekrachtkoppeling;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: 16.1.j
    text: koppelingen met andere netten te realiseren en reparaties aan zijn net uit te voeren;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: 16.1.k
    text: |-
      onverminderd de [artikelen 19][ref1] en [79][ref2], op een geschikte wijze gegevens te publiceren over koppelingen
      tussen de netten, gebruik van de netten en de toewijzing van transportcapaciteit;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel79
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '79'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 16.1.l
    text: afnemers alle gegevens te verstrekken die zij voor een efficiënte toegang tot het net nodig hebben;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: 16.1.m
    text: |-
      voorzieningen te treffen in geval van een faillissement van een leverancier van elektriciteit aan afnemers als
      bedoeld in [artikel 95a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: '16.2'
    text: |-
      In aanvulling op de taken, bedoeld in het eerste lid, heeft de netbeheerder van het landelijk hoogspanningsnet
      tevens tot taak:
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: 16.2.a
    text: |-
      technische voorzieningen te treffen en systeemdiensten uit te voeren, waaronder het aanhouden van voldoende
      productiereservecapaciteit, die nodig zijn om het transport van elektriciteit over alle netten op een veilige en
      doelmatige wijze te waarborgen;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: 16.2.b
    text: |-
      mede ten behoeve van de andere netbeheerders de technische voorzieningen en systeemdiensten, bedoeld onder a, te
      benutten;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: 16.2.c
    text: |-
      op de grondslag van [paragraaf 7 van dit hoofdstuk][ref1] ten behoeve van derden transport van elektriciteit uit te
      voeren met behulp van het landelijk hoogspanningsnet, voor de uitvoer van die elektriciteit vanuit Nederland naar
      een afnemer of leverancier in het buitenland, dan wel voor de invoer van die elektriciteit vanuit het buitenland
      naar een afnemer of leverancier in Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        hoofdstuk: '3'
        paragraaf: '7'
  - number: 16.2.d
    text: |-
      een passend niveau van voorzieningen te treffen en te handhaven, waaronder het aanhouden van voldoende
      productiereservecapaciteit, in verband met de leveringszekerheid op de korte en de lange termijn;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: 16.2.f
    text: |-
      indien Onze Minister hem dit opdraagt, werkzaamheden te verrichten ter uitvoering van de taak, bedoeld in
      [artikel 4a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel4a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 4a
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 16.2.g
    text: |-
      andere netbeheerders de gegevens te verschaffen die nodig zijn om een betrouwbare en efficiënte werking, alsmede
      de samenhangende ontwikkeling en interoperabiliteit, van de netten te waarborgen. In geval van grensoverschrijdende
      koppeling met andere lidstaten van de Europese Unie dan wel met niet lidstaten wisselt de netbeheerder van het
      landelijk hoogspanningsnet met de betreffende netbeheerders in die landen, in overeenstemming met de operationele
      minimumvereisten als bedoeld in [artikel 31, elfde lid][ref1], tijdig en op doeltreffende wijze gegevens uit over
      het functioneren van de landgrensoverschrijdende netten.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '16.3'
    text: |-
      Het is anderen dan de desbetreffende netbeheerder verboden een taak uit te voeren als bedoeld in het eerste
      of tweede lid, behoudens voor zover het betreft het realiseren van de aansluiting van een afnemer als bedoeld
      in [artikel 16c][ref1], het aanleggen van een landsgrensoverschrijdend net als bedoeld in het zesde lid of het
      aanleggen, beheren en onderhouden van een net als bedoeld in [artikel 15, eerste of tweede lid][ref2], dan wel ter
      uitvoering van een procedure als bedoeld in [artikel 20, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16c
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel20
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 16c
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '16.4'
    text: |-
      Producenten, leveranciers en handelaren onthouden zich van iedere bemoeiing met de uitvoering van de taken die op
      grond van het eerste of tweede lid aan een netbeheerder zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: '16.5'
    text: |-
      Indien een ander dan de netbeheerder van het landelijk hoogspanningsnet een landsgrensoverschrijdend net heeft
      aangelegd, heeft de netbeheerder van het landelijk hoogspanningsnet tot taak dat net te beheren met inachtneming
      van het bepaalde bij of krachtens deze wet. Indien een ander dan de netbeheerder van het landelijk hoogspanningsnet
      een recht van gebruik heeft van een net dat op grond van [artikel 10, eerste lid][ref1], behoort tot het landelijk
      hoogspanningsnet, is hij verplicht aan de netbeheerder van het landelijk hoogspanningsnet alle medewerking te
      verlenen opdat deze zijn taken op grond van het eerste en tweede lid kan uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '16.6'
    text: |-
      Indien de netbeheerder van het landelijk hoogspanningsnet energie inkoopt ter uitvoering van zijn wettelijke taken,
      doet hij dit op basis van een transparante, niet-discriminatoire en marktconforme procedure.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: '16.7'
    text: Een besluit als bedoeld in het tweede lid, onderdeel f, wordt gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: '16.8'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld ter uitvoering van de taak, bedoeld in het eerste lid,
      onderdeel m. Deze regels hebben mede betrekking op de wijze waarop enerzijds de netbeheerder van het landelijk
      hoogspanningsnet en anderzijds de producenten, leveranciers, handelaren en afnemers zich jegens elkaar gedragen in
      verband met de uitvoering van de taak, bedoeld in het tweede lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: '16.9'
    text: |-
      De raad van bestuur van de mededingingsautoriteit brengt advies uit over het ontwerp van de algemene maatregel
      van bestuur, bedoeld in het achtste lid. De voordracht voor een krachtens dit artikel vast te stellen algemene
      maatregel van bestuur wordt niet gedaan dan nadat het ontwerp in de Staatscourant is bekendgemaakt en aan een ieder
      de gelegenheid is geboden om binnen vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen
      ter kennis van Onze Minister te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der
      Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: '16.10'
    text: |-
      Tot de voorzieningen die de netbeheerder van het landelijk hoogspanningsnet ter uitvoering van zijn taak bedoeld
      in het tweede lid, onderdeel d, treft, behoren het voor transport van elektriciteit handhaven van reservecapaciteit
      die groot genoeg is om de operationele netwerkveiligheid te waarborgen en het samenwerken met netbeheerders waarmee
      hij een landgrensoverschrijdend net heeft.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: '16.11'
    text: |-
      Een beslissing tot het aanleggen van een landsgrensoverschrijdend net door de netbeheerder van het landelijke
      hoogspanningsnet dan wel door een ander als bedoeld in het zesde lid wordt niet genomen dan in nauwe samenwerking
      met de netbeheerders in andere landen waarmee een landgrensoverschrijdend net tot stand wordt gebracht en andere
      relevante netbeheerders.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: '16.12'
    text: |-
      Indien de netbeheerder van het landelijk hoogspanningsnet het noodzakelijke acht voorzieningen te treffen als
      bedoeld in [artikel 16, tweede lid, onderdeel d][ref1], ter uitvoering van zijn taak de leveringszekerheid voor
      de lange termijn te waarborgen, verstrekt hij de raad van bestuur van de mededingingsautoriteit een overzicht
      van de te nemen maatregelen en de gevolgen van die maatregelen voor afnemers en het functioneren van de markt. De
      raad van bestuur van de mededingingsautoriteit zendt het overzicht vergezeld van zijn advies aan Onze Minister. De
      maatregelen behoeven de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '16.13'
    text: |-
      Onze Minister verleent zijn goedkeuring niet eerder dan vier weken nadat het overzicht en het advies, bedoeld in
      het dertiende lid, aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16
  - number: 16Aa.1
    text: |-
      Een netbeheerder verricht de werkzaamheden ter uitvoering van de taken, bedoeld in
      [artikel 16, eerste en tweede lid][ref1], in eigen beheer of tezamen met een of meer andere netbeheerders.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16Aa
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 16Aa.2
    text: 'In afwijking van het eerste lid kunnen de navolgende werkzaamheden worden uitbesteed:'
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16Aa
  - number: 16Aa.2.a
    text: feitelijke werkzaamheden in verband met de aanleg, het onderhoud en de reparatie van het net;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16Aa
  - number: 16Aa.2.b
    text: inspecties van netten met het oog op de veiligheid;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16Aa
  - number: 16Aa.2.c
    text: speur- en ontwikkelingswerk ten behoeve van de aanleg, het onderhoud en de reparatie van het net;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16Aa
  - number: 16Aa.2.d
    text: |-
      de werkzaamheden ter uitvoering van [artikel 16, tweede lid, onderdeel e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16Aa
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 16Aa.3
    text: 'Ingeval van uitbesteding van werkzaamheden als bedoeld in het tweede lid:'
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16Aa
  - number: 16Aa.3.a
    text: behoudt de netbeheerder de verantwoordelijkheid voor de volledige en juiste uitvoering van de desbetreffende taken,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16Aa
  - number: 16Aa.3.b
    text: |-
      draagt de netbeheerder er zorg voor dat de regels die krachtens [artikel 11b, eerste lid][ref1], zijn gesteld
      met betrekking tot het voorkomen van discriminatie bij de uitoefening van zijn taken en bevoegdheden, van
      overeenkomstige toepassing zijn bij het verrichten van de uitbestede werkzaamheden en


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel11b
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16Aa
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 11b
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 16Aa.3.c
    text: |-
      draagt de netbeheerder er zorg voor dat in de overeenkomst tot uitbesteding de wijze waarop de kosten voor de
      desbetreffende werkzaamheden worden berekend, wordt vastgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16Aa
  - number: 16Aa.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het derde lid, onderdelen a, b
      en c.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16Aa
  - number: 16a.1
    text: |-
      Het is anderen dan de desbetreffende netbeheerder verboden een taak uit te voeren als bedoeld in
      [artikel 16, eerste of tweede lid][ref1], behoudens voor zover het betreft het meten van elektriciteit, bedoeld in
      [artikel 16, eerste lid, onderdeel i][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 16a.2
    text: |-
      Degene, niet zijnde een netbeheerder, die bij een afnemer de meting van van het net afgenomen en verbruikte of
      opgewekte en op het net ingevoede elektriciteit verricht, deelt de daarmee verkregen meetgegevens mee aan de
      desbetreffende afnemer en aan de netbeheerder op wiens net de afnemer is aangesloten.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16a
  - number: 16a.3
    text: |-
      De netbeheerder deelt het resultaat van de vaststelling, bedoeld in [artikel 16, eerste lid, onderdeel h][ref1],
      en de meetgegevens, bedoeld in het tweede lid en in [artikel 16, eerste lid, onderdeel i][ref2], mee aan de
      netbeheerder van het landelijk hoogspanningsnet alsmede aan de desbetreffende producent voor zover die nog niet de
      beschikking heeft over die informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 16b.1
    text: |-
      Een netbeheerder heeft in het kader van het beheer van de netten in het voor hem krachtens [artikel 36][ref1]
      of [37][ref2] vastgestelde gebied tot taak voor het jaar 2009 en het jaar 2010 een forfaitair bedrag uit te betalen
      aan afnemers als bedoeld in het tweede lid als gedeeltelijke tegemoetkoming voor wijziging van de tariefdrager voor
      het transportafhankelijke element van het tarief, bedoeld in [artikel 29, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel29
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 16b.2
    text: |-
      Voor een uitbetaling als bedoeld in het eerste lid komt een afnemer in aanmerking die op 1 januari 2009
      of 1 januari 2010 beschikt over een aansluiting met een totale maximale doorlaatwaarde van meer dan 3*25A en niet
      meer dan 3*80A.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16b
  - number: 16b.3
    text: |-
      In afwijking van het tweede lid komt een afnemer niet in aanmerking voor een uitbetaling voor het jaar 2010, indien
      gedurende het jaar 2009 de totale maximale doorlaatwaarde van zijn aansluiting is verhoogd.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16b
  - number: 16b.4
    text: |-
      In afwijking van het tweede lid komt een afnemer niet in aanmerking voor een uitbetaling, indien de totale maximale
      doorlaatwaarde van zijn aansluiting is verlaagd tot 3*25A of lager naar aanleiding van een verzoek daartoe dat
      uiterlijk drie maanden na ontvangst van de eerste afrekening na 1 januari 2009 bij de netbeheerder is ingediend.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16b
  - number: 16b.5
    text: |-
      Indien de totale maximale doorlaatwaarde van een aansluiting van een afnemer als bedoeld in het tweede lid is
      verlaagd naar aanleiding van een verzoek daartoe dat uiterlijk drie maanden na ontvangst van de eerste afrekening
      na 1 januari 2009 bij de netbeheerder is ingediend, wordt ten behoeve van de uitbetaling, bedoeld in het eerste
      lid, de nieuwe doorlaatwaarde van de aansluiting geacht aanwezig te zijn geweest vanaf 1 januari 2009.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16b
  - number: 16b.6
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de hoogte van de uitbetaling, bedoeld in het
      eerste lid, welke per categorie van afnemers kan verschillen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16b
  - number: 16b.7
    text: 'Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16b
  - number: 16b.7.a
    text: |-
      de uitvoering van de uitbetaling, waaronder de informatievoorziening, de datum van uitbetaling en de wijze waarop
      wordt uitbetaald;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16b
  - number: 16b.7.b
    text: |-
      de inrichting van de administratie die netbeheerders moeten voeren in verband met de in het eerste lid genoemde
      taak.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16b
  - number: 16c.1
    text: |-
      In afwijking van [artikel 16, eerste lid, onderdeel e][ref1], kan een afnemer die een aansluiting op het net wenst
      met een aansluitwaarde groter dan 10 MVA een openbare aanbesteding van de aansluitingswerkzaamheden uitschrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 16c.2
    text: |-
      Met een afnemer, bedoeld in het eerste lid, wordt gelijkgesteld een organisatorische eenheid, die zich in hoofdzaak
      bezig houdt met openbaar vervoer per trein, tram, of trolley, met mijnbouwkundige activiteiten, met het beheer van
      openbare verlichting of van verkeersregelinstallaties, dan wel met riolering, bemaling, waterzuivering of transport
      en distributie van water waarbij deze eenheid ingevolge de technische aard van de bedrijfsuitoefening beschikt over
      verscheidene aansluitingen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16c
  - number: 16c.3
    text: |-
      Het bedrijf dat de werkzaamheden, bedoeld in het eerste lid, uitvoert, beschikt ten minste over voldoende kennis,
      deskundigheid en ervaring om een aansluiting op het net te kunnen realiseren.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16c
  - number: 16c.4
    text: |-
      De afnemer die het verzoek, bedoeld in het eerste lid, doet, verzoekt de netbeheerder die het net beheert om
      instemming met het realiseren van een aansluiting als bedoeld in het eerste lid. De netbeheerder onthoudt zijn
      instemming slechts, indien met het verlenen van de gevraagde instemming de betrouwbaarheid van het door hem
      beheerde net niet langer kan worden gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16c
  - number: 16c.5
    text: |-
      Dit artikel is van overeenkomstige toepassing op het wijzigen, onderhouden en verwijderen van een aansluiting als
      bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel16c
  - number: '17.1'
    text: |-
      Het is de netbeheerder, niet zijnde de netbeheerder van het landelijk hoogspanningsnet of een rechtspersoon waarin
      de netbeheerder een deelneming heeft als bedoeld in [artikel 24c van Boek 2 van het Burgerlijk Wetboek][ref1], niet
      toegestaan goederen of diensten waarmee zij in concurrentie treden te leveren, tenzij het betreft het verrichten
      van werkzaamheden ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24c
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24c
  - number: 17.1.a
    text: |-
      de uitvoering van de taken, bedoeld in [artikel 16, eerste of tweede lid][ref1], of [16a][ref2], voor zichzelf,
      voor andere netbeheerders of voor anderen die een recht van gebruik van een net hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 16a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 17.1.b
    text: de aanleg, het beheer of het onderhoud van leidingen buiten gebouwen voor het transport van gas;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel17
  - number: 17.1.c
    text: |-
      het ter beschikking stellen en houden van netten ten behoeve van het gebruik van daarmee verbonden zaken door
      derden;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel17
  - number: 17.1.d
    text: |-
      het uitvoeren van werkzaamheden, bedoeld in [artikel 16c, eerste en vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16c
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 16c
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '17.2'
    text: |-
      Indien een netbeheerder, niet zijnde de netbeheerder van het landelijk hoogspanningsnet, deel uitmaakt van een
      groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1], is het deze groep niet toegestaan
      om handelingen of activiteiten te verrichten die strijdig kunnen zijn met het belang van het beheer van het
      desbetreffende net.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: '17.3'
    text: |-
      Onder handelingen en activiteiten als bedoeld in het tweede lid worden in ieder geval verstaan: a. handelingen en
      activiteiten die niet op enigerlei wijze betrekking hebben op of verband houden met infrastructurele voorzieningen
      of aanverwante activiteiten, b. het door de netbeheerder verstrekken van zekerheden ten behoeve van de financiering
      van activiteiten van tot de groep behorende rechtspersonen of vennootschappen en c. het zich aansprakelijk stellen
      door de netbeheerder voor schulden van tot de groep behorende rechtspersonen of vennootschappen, tenzij het
      verstrekken van zekerheden of het zich aansprakelijk stellen voor schulden door de netbeheerder: 1°. geschiedt
      ten behoeve van handelingen of activiteiten die de netbeheerder zelf zou mogen verrichten, 2°. anderszins verband
      houdt met het netbeheer of 3°. geschiedt om te voldoen aan voorwaarden in verband met de toepassing van wettelijke
      bepalingen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel17
  - number: '17.4'
    text: |-
      De statuten van de rechtspersonen die met een netbeheerder, niet zijnde de netbeheerder van het landelijk
      hoogspanningsnet, in een groep zijn verbonden, behoeven de goedkeuring van Onze Minister voor zover het betreft de
      daarin opgenomen doelstellingen van die rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel17
  - number: 17a.1
    text: |-
      Het is de netbeheerder van het landelijk hoogspanningsnet of een rechtspersoon waarin de netbeheerder een
      deelneming heeft als bedoeld in [artikel 24c, van Boek 2 van het Burgerlijk Wetboek][ref1], niet toegestaan
      goederen of diensten waarmee zij in concurrentie treden te leveren, tenzij het betreft het verrichten van
      werkzaamheden ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24c
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24c
  - number: 17a.1.a
    text: |-
      de uitvoering van de taken, bedoeld in [artikel 16, eerste of tweede lid][ref1], of [16a][ref2] voor zichzelf, voor
      andere netbeheerders of voor anderen die een recht van gebruik op een net hebben,


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 16a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 17a.1.b
    text: de aanleg, het beheer of het onderhoud van leidingen buiten gebouwen voor het transport van gas of
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel17a
  - number: 17a.1.c
    text: |-
      het ter beschikking stellen en houden van netten ten behoeve van het gebruik van daarmee verbonden zaken door
      derden;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel17a
  - number: 17a.1.d
    text: |-
      het uitvoeren van werkzaamheden, bedoeld in [artikel 16c, eerste en vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16c
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 16c
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 17a.2
    text: |-
      Indien de netbeheerder van het landelijk hoogspanningsnet onderdeel uitmaakt van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1], is het deze groep niet toegestaan om handelingen
      of activiteiten te verrichten die strijdig kunnen zijn met het belang van het beheer van het landelijk
      hoogspanningsnet.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 17a.3
    text: |-
      De statuten van de rechtspersonen die met de netbeheerder van het landelijk hoogspanningsnet in een groep zijn
      verbonden, behoeven de goedkeuring van Onze Minister voor zover het betreft de daarin opgenomen doelstellingen van
      die rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel17a
  - number: 17a.4
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet verstrekt binnen zes maanden na afloop van ieder kalenderjaar
      aan de raad van bestuur van de mededingingsautoriteit een overzicht van de financiële middelen waarover hij
      beschikt ten behoeve van de uitvoering van zijn wettelijke taken, waaruit blijkt welke financiële middelen voor de
      afzonderlijke taken beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel17a
  - number: '18.1'
    text: |-
      Indien een met de netbeheerder in een groep verbonden groepsmaatschappij in de zin van
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] activiteiten verricht die de netbeheerder op grond
      van [artikel 17][ref2] of [17a][ref3] niet zelf mag verrichten, mag de netbeheerder of een rechtspersoon
      waarin de netbeheerder een deelneming heeft als bedoeld in [artikel 17][ref4] of [17a][ref5] een dergelijke
      groepsmaatschappij niet bevoordelen boven anderen waarmee een dergelijke groepsmaatschappij in concurrentie treedt,
      of anderszins voordelen toekennen die verder gaan dan in normaal handelsverkeer gebruikelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel17a
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0009755#Artikel17a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 17a
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009755
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0009755
        artikel: 17a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '18.2'
    text: |-
      Als bevoordelen van een groepsmaatschappij als bedoeld in het eerste lid of het toekennen van voordelen die verder
      gaan dan in normaal handelsverkeer gebruikelijk is, worden in ieder geval aangemerkt:
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel18
  - number: 18.2.a
    text: |-
      het verstrekken van gegevens aan een groepsmaatschappij over afnemers, niet zijnde niet zijnde afnemers als bedoeld
      in [artikel 95a, eerste lid][ref1], die een verzoek als bedoeld in [artikel 23][ref2] of [24][ref3] hebben gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel24
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 18.2.b
    text: |-
      het leveren van goederen of diensten aan een groepsmaatschappij tegen een vergoeding die lager is dan de
      redelijkerwijs daaraan toe te rekenen kosten, of
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel18
  - number: 18.2.c
    text: |-
      het toestaan van het gebruik door een groepsmaatschappij van de naam en het beeldmerk van de netbeheerder op een
      wijze waardoor verwarring bij het publiek te duchten is over de herkomst van goederen of diensten.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel18
  - number: '18.3'
    text: |-
      De netbeheerder voegt bij zijn jaarrekening een verklaring waaruit blijkt dat de financiële verhouding tussen
      de netbeheerder en de groepsmaatschappijen, bedoeld in het eerste lid, voldoet aan de in het eerste lid gestelde
      eisen. De netbeheerder legt een exemplaar van zijn jaarrekening, de daartoe behorende toelichting en de daarbij
      gevoegde verklaring voor een ieder ter inzage in al zijn kantoren en zendt een exemplaar daarvan aan de raad van
      bestuur van de mededingingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel18
  - number: 18a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent een goed financieel beheer van
      de netbeheerder.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel18a
  - number: 18a.2
    text: De in het eerste lid bedoelde regels houden in ieder geval in dat
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel18a
  - number: 18a.2.a
    text: |-
      de netbeheerder voldoet aan bij of krachtens die maatregel gestelde eisen aan zijn kredietwaardigheid waaronder de
      verhouding tussen vreemd vermogen en totaal vermogen, of dat
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel18a
  - number: 18a.2.b
    text: |-
      de netbeheerder beschikt over een verklaring van een onafhankelijke deskundige ten aanzien van zijn
      kredietwaardigheid.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel18a
  - number: 18a.3
    text: In de in het eerste lid bedoelde maatregel kunnen tevens
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel18a
  - number: 18a.3.a
    text: regels worden gesteld omtrent de wijze van berekening van vermogensonderdelen;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel18a
  - number: 18a.3.b
    text: |-
      eisen worden gesteld met betrekking tot de in het tweede lid, onderdeel b, bedoelde verklaring en de daar bedoelde
      deskundige.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel18a
  - number: '19'
    text: |-
      De netbeheerder gebruikt aan hem verstrekte gegevens over afnemers als bedoeld in [artikel 95a, eerste lid][ref1],
      uitsluitend voor het uitvoeren van in deze wet aan de netbeheerder opgedragen taken, met dien verstande dat deze
      gegevens mede kunnen worden gebruikt voor het ten behoeve van de vergunninghouder innen van de vergoeding voor het
      leveren van elektriciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 19a.1
    text: Een netbeheerder houdt een registratie bij van kwaliteitsindicatoren betreffende het transport van elektriciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19a
  - number: 19a.2
    text: |-
      De netbeheerder zendt de raad van bestuur van de mededingingsautoriteit voor 1 maart van elk jaar een afschrift
      van de registratie van het voorafgaande jaar tezamen met een rapportage waarin de wijzigingen ten opzichte van het
      daaraan voorafgaande jaar zijn toegelicht. De netbeheerder maakt eveneens voor het tijdstip, bedoeld in de eerste
      volzin, de rapportage op een geschikte wijze openbaar.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19a
  - number: 19a.3
    text: De netbeheerder bewaart de registratie ten minste tien jaar.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19a
  - number: 19a.4
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan onderzoek doen naar de deugdelijkheid van de registratie, in
      het bijzonder doch niet uitsluitend door in het net van de desbetreffende netbeheerder metingen te verrichten of te
      doen verrichten. De netbeheerder gedoogt dat de metingen in zijn net worden verricht.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19a
  - number: 19a.5
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19a
  - number: 19a.5.a
    text: de inhoud van de registratie en de wijze van registreren;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19a
  - number: 19a.5.b
    text: de kwaliteitsindicatoren die in de registratie zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19a
  - number: 19a.5.c
    text: de rapportage.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19a
  - number: 19a.6
    text: |-
      De in het vijfde lid bedoelde ministeriële regeling kan, ten behoeve van het toezicht op de naleving van dit
      artikel, mede inhouden dat een door een geaccrediteerde instelling aan een netbeheerder verstrekt certificaat
      van conformiteit aan het bepaalde bij of krachtens dit artikel, het vermoeden oplevert dat de netbeheerder
      overeenkomstig het bepaalde bij of krachtens dit artikel uitvoering geeft aan de verplichting tot registratie.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19a
  - number: 19b.1
    text: |-
      De netbeheerder, met uitzondering van de netbeheerder van het landelijk hoogspanningsnet, verstrekt binnen zes
      maanden na afloop van ieder kalenderjaar aan de raad van bestuur van de mededingingsautoriteit:
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19b
  - number: 19b.1.a
    text: |-
      een overzicht van de door hem gesloten overeenkomsten met betrekking tot het verrichten van diensten ten
      behoeve van het netbeheer, vergezeld van afschriften van die overeenkomsten voorzover de raad van bestuur van de
      mededingingsautoriteit daarover niet reeds beschikt,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19b
  - number: 19b.1.b
    text: |-
      een overzicht van het aantal personen dat bij de netbeheerder werkzaam is ter uitvoering van de in
      [artikel 16][ref1] en [16a][ref2] genoemde taken,


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 16a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 19b.1.c
    text: een overzicht van in het afgelopen jaar gerealiseerde investeringen in het net,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19b
  - number: 19b.1.d
    text: |-
      een overzicht van de financiële middelen waarover hij beschikt ten behoeve van de uitvoering van zijn wettelijke
      taken, waaruit blijkt welke financiële middelen voor de afzonderlijke taken beschikbaar zijn, en
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19b
  - number: 19b.1.e
    text: een verklaring van een onafhankelijke deskundige omtrent het in onderdeel d bedoelde overzicht.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19b
  - number: 19b.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de overzichten, bedoeld in het eerste
      lid, onderdelen a tot en met d, en de verklaring, bedoeld in het eerste lid, onderdeel e.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19b
  - number: 19c
    text: |-
      De netbeheerder, met uitzondering van de netbeheerder van het landelijk hoogspanningsnet, draagt er zorg voor
      dat de afnemers die op zijn net zijn aangesloten een overzicht ontvangen waarop de kosten in verband met die
      aansluiting overzichtelijk en begrijpelijk zijn gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19c
  - number: 19d.1
    text: |-
      De netbeheerder, met uitzondering van de netbeheerder van het landelijk hoogspanningsnet, voorziet in een procedure
      voor de behandeling van klachten van afnemers over het netbeheer.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19d
  - number: 19d.2
    text: 'De in het eerste lid bedoelde procedure voorziet er ten minste in dat:'
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19d
  - number: 19d.2.a
    text: |-
      de behandeling van de klacht geschiedt door een persoon die niet bij de gedraging waarop de klacht betrekking
      heeft, betrokken is geweest,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19d
  - number: 19d.2.b
    text: |-
      de klager schriftelijk en gemotiveerd in kennis wordt gesteld van de bevindingen naar aanleiding van de klacht en
      van de conclusies die daaraan worden verbonden, en
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19d
  - number: 19d.2.c
    text: de klacht zo spoedig mogelijk doch uiterlijk binnen acht weken wordt afgehandeld.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19d
  - number: 19e.1
    text: |-
      Een netbeheerder draagt er, al dan niet samen met een of meer andere netbeheerders, zorg voor dat onderbrekingen
      in het transport van elektriciteit door afnemers op een eenvoudige wijze gemeld kunnen worden en maakt aan afnemers
      bekend op welke wijze deze meldingen kunnen geschieden.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19e
  - number: 19e.2
    text: |-
      Een netbeheerder registreert, al dan niet samen met een of meer andere netbeheerders, van de gemelde
      onderbrekingen, de datum en het tijdstip van het begin van de onderbrekingen, de duur van de onderbrekingen, de
      locatie, aard en oorzaak van de onderbrekingen alsmede het aantal getroffen afnemers.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19e
  - number: 19e.3
    text: |-
      Een netbeheerder maakt, al dan niet samen met andere netbeheerders, de actuele stand van zaken betreffende
      de geregistreerde onderbrekingen in zijn net op geschikte wijze openbaar, en vermeldt daarbij de datum en het
      tijdstip van het begin van de onderbrekingen, de duur van de onderbrekingen, de locatie, aard en oorzaak van de
      onderbrekingen alsmede het aantal getroffen afnemers.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel19e
  - number: '20.1'
    text: |-
      Een net dat door een netbeheerder is of wordt aangelegd, hersteld, vernieuwd of uitgebreid in het voor
      hem op grond van [artikel 36][ref1] of [37][ref2] vastgestelde gebied, wordt voor de toepassing van de
      [Belemmeringenwet Verordeningen][ref3] en de [Belemmeringenwet Privaatrecht][ref4] aangemerkt als openbaar werk van
      algemeen nut.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0001865
      [ref4]: https://wetten.overheid.nl/BWBR0001936
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0001865
      - id: ref4
        bwb_id: BWBR0001936
  - number: '20.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot daarbij aan te wijzen gebieden regels worden gesteld
      over de wijze waarop, gelet op het belang van een betrouwbaar, duurzaam, doelmatig en milieuhygiënisch verantwoord
      functionerende energiehuishouding, een afweging wordt gemaakt met betrekking tot de aanleg van een net en de aanleg
      van leidingen voor het transport van gas of warmte.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel20
  - number: '20.3'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat een net slechts wordt aangelegd als resultaat van een
      openbare procedure waarin gegadigden op een te plaatsen opdracht kunnen inschrijven met een aanbieding voor de
      aanleg van een net of van leidingen voor het transport van gas of warmte.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel20
  - number: 20a.1
    text: |-
      De procedure bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel c, van de Wet ruimtelijke ordening][ref1],
      is van toepassing op een uitbreiding van het landelijke hoogspanningsnet, voor zover het betreft de van dat net
      deel uitmakende netten bestemd voor het transport van elektriciteit op een spanningsniveau van 220 kV of hoger
      en die als zodanig worden bedreven, en de van dat net deel uitmakende landsgrensoverschrijdende netten op een
      spanningsniveau van 500 V of hoger, met inbegrip van de aansluitingen op die netten.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 20a.2
    text: |-
      De beheerder van het net, bedoeld in het eerste lid, meldt een voornemen tot een uitbreiding van een net waarop het
      eerste lid van toepassing is zo spoedig mogelijk schriftelijk aan Onze Minister. Bij ministeriële regeling kan voor
      het doen van de melding en de daarbij te verstrekken gegevens een formulier worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel20a
  - number: 20a.3
    text: |-
      Indien, in aanmerking genomen de omvang, aard en ligging van een net als bedoeld in het eerste lid, alsmede het
      aantal voor de aanleg of uitbreiding van dat net benodigde besluiten, redelijkerwijs niet valt te verwachten dat
      toepassing van de procedure, bedoeld in het eerste lid, de besluitvorming in betekenende mate zal versnellen of
      daaraan anderszins aanmerkelijke voordelen zijn verbonden, kan Onze Minister bepalen dat:
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel20a
  - number: 20a.3.a
    text: |-
      geen van de procedures, bedoeld in [artikel 3.35, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 20a.3.b
    text: |-
      uitsluitend de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel a][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 20a.3.c
    text: |-
      uitsluitend de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel b][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 20a.3.d
    text: |-
      de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel a][ref1], gevolgd door de procedure,
      bedoeld in artikel 3.35, eerste lid, aanhef en onderdeel b, van de Wet ruimtelijke ordening, van toepassing zijn of
      is op de uitbreiding van dat net. Onze Minister hoort de beheerder van het net en de betrokken bestuursorganen over
      een voornemen toepassing te geven aan de bevoegdheid, bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 20b.1
    text: |-
      Onze Minister is de aangewezen minister, bedoeld in
      [artikel 3.35, tweede en derde lid, van de Wet ruimtelijke ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 20b.2
    text: |-
      Indien toepassing wordt gegeven aan [artikel 3.28, vierde lid, van de Wet ruimtelijke ordening][ref1] treden,
      in afwijking van dat artikellid, Onze Minister en Onze Minister van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer gezamenlijk in de plaats van burgemeester en wethouders ten aanzien van de bevoegdheden en
      verplichtingen, bedoeld in dat artikellid.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 20b.3
    text: |-
      Onze Minister kan, in overeenstemming met het gevoelen van de ministerraad, bepalen dat
      Onze Minister en Onze Minister wie het mede aangaat, met overeenkomstige toepassing van
      [artikel 3.35, derde lid, vierde volzin, van de Wet ruimtelijke ordening][ref1], één of meer besluiten nemen die
      nodig zijn voor een daarbij aangewezen uitbreiding van het net, bedoeld in [artikel 20a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel20a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 20a
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 20c.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de besluiten aangewezen die voor de uitbreiding
      van het net, bedoeld in [artikel 20a, eerste lid][ref1], in ieder geval besluiten als bedoeld in
      [artikel 3.35, eerste lid, onderdeel b, van de Wet ruimtelijke ordening][ref2] zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel20c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 20a
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 20c.2
    text: |-
      Onze Minister kan ten behoeve van een uitbreiding van het net, bedoeld in [artikel 20a, eerste lid][ref1], tevens
      één of meer andere besluiten dan de bij of krachtens het eerste lid aangewezen besluiten aanwijzen als besluiten
      als bedoeld in [artikel 3.35, eerste lid, onderdeel b, van de Wet ruimtelijke ordening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel20c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 20a
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 20c.3
    text: |-
      Onze Minister kan, indien een bij of krachtens het eerste lid aangewezen besluit de toepassing van de procedure,
      bedoeld in [artikel 20a, eerste lid][ref1], zou belemmeren of ernstig bemoeilijken, bepalen dat het desbetreffende
      besluit, in afwijking van de in het eerste lid bedoelde algemene maatregel van bestuur, niet als een besluit als
      bedoeld in [artikel 3.35, eerste lid, onderdeel b, van de Wet ruimtelijke ordening][ref2] wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel20c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 20a
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: '21.1'
    text: |-
      Een netbeheerder beschikt over een doeltreffend systeem voor de beheersing van de kwaliteit van zijn
      transportdienst en over voldoende capaciteit voor het transport van elektriciteit om te voorzien in de totale
      behoefte.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel21
  - number: '21.2'
    text: |-
      De netbeheerder dient om het jaar bij de raad van bestuur van de mededingingsautoriteit een door hem vastgesteld
      document in waarin hij:
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel21
  - number: 21.2.a
    text: aangeeft welk kwaliteitsniveau hij nastreeft,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel21
  - number: 21.2.b
    text: aannemelijk maakt dat hij beschikt over een doeltreffend kwaliteitsbeheersingssysteem voor zijn transportdienst, en
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel21
  - number: 21.2.c
    text: |-
      aannemelijk maakt dat hij over voldoende capaciteit beschikt om te voorzien in de totale behoefte aan het transport
      van elektriciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel21
  - number: '21.3'
    text: 'Bij ministeriële regeling worden regels, die kunnen verschillen per spanningsniveau, gesteld over:'
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel21
  - number: 21.3.a
    text: de eisen aan het kwaliteitsbeheersingssysteem;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel21
  - number: 21.3.b
    text: de te verschaffen informatie over het nagestreefde kwaliteitsniveau en over het kwaliteitsbeheersingssysteem;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel21
  - number: 21.3.c
    text: de wijze van ramen van de totale behoefte aan capaciteit voor het transport van elektriciteit;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel21
  - number: 21.3.d
    text: |-
      de te verschaffen gegevens over de totale behoefte aan capaciteit voor het transport van elektriciteit en over
      de wijze waarop de netbeheerder voornemens is te voorzien in de totale behoefte aan capaciteit voor het transport
      van elektriciteit;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel21
  - number: 21.3.e
    text: de periode waarop het document of onderdelen daarvan betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel21
  - number: '21.4'
    text: De netbeheerder maakt het document op een geschikte wijze openbaar.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel21
  - number: '21.5'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat een door een geaccrediteerde instelling aan een netbeheerder
      verstrekt certificaat van conformiteit aan het bepaalde bij of krachtens dit artikel, ten behoeve van het toezicht
      op de naleving van dit artikel, het vermoeden oplevert dat de netbeheerder een kwaliteitsbeheersingssyteem heeft en
      daaraan uitvoering geeft overeenkomstig het bepaalde bij of krachtens dit artikel.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel21
  - number: '21.6'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet geeft in het document bedoeld in het tweede lid in elk geval aan
      welke prestaties op het gebied van leveringskwaliteit en operationele netwerkveiligheid hij nastreeft.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel21
  - number: '21.7'
    text: De doelstellingen bedoeld in het zesde lid zijn objectief, transparant en niet-discriminatoir.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel21
  - number: '21.8'
    text: |-
      De raad van bestuur van de mededingingsautoriteit verleent goedkeuring aan het document bedoeld in het tweede lid
      voor zover het betreft de prestaties die de netbeheerder van het landelijk hoogspanningsnet nastreeft ten aanzien
      van de leveringskwaliteit en de operationele netwerkveiligheid indien naar het oordeel van de raad van bestuur van
      de mededingingsautoriteit blijkt dat deze netbeheerder in voldoende mate en op een doelmatige wijze kan voorzien in
      de door hem gestelde doelen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel21
  - number: '22.1'
    text: |-
      Indien naar het oordeel van de raad van bestuur van de mededingingsautoriteit uit de overzichten, bedoeld in
      [artikel 19b][ref1] of uit het document, bedoeld in [artikel 21][ref2], of anderszins, blijkt dat een netbeheerder
      in onvoldoende mate of op een ondoelmatige wijze kan of zal kunnen voorzien in het door hem te bereiken niveau van
      de kwaliteit van zijn transportdienst of in de totale behoefte aan capaciteit voor het transport van elektriciteit
      over de door hem beheerde netten, meldt hij zulks na overleg met de netbeheerder van het landelijk hoogspanningsnet
      en de netbeheerder van het desbetreffende net aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel19b
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel21
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 19b
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '22.2'
    text: |-
      Nadat hij een melding heeft ontvangen, kan Onze Minister aan de desbetreffende netbeheerder opdragen voorzieningen
      te treffen teneinde zeker te stellen dat het transport van elektriciteit in voldoende mate of op een doelmatige
      wijze plaatsvindt met inachtneming van het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel22
  - number: '22.3'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de opdracht, bedoeld in
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel22
  - number: '23.1'
    text: |-
      De netbeheerder is verplicht degene die daarom verzoekt te voorzien van een aansluiting op het door hem beheerde
      net tegen een tarief en tegen andere voorwaarden die in overeenstemming zijn met de [paragrafen 5][ref1] en
      [6 van dit hoofdstuk][ref2]. De netbeheerder verstrekt degene die om een aansluiting op het net verzoekt een
      gedetailleerde en volledige opgave van de uit te voeren werkzaamheden en de te berekenen kosten van de handelingen,
      onderscheiden in [artikel 28, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel28
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009755
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '23.2'
    text: |-
      De netbeheerder onthoudt zich van iedere vorm van discriminatie tussen degenen jegens wie de verplichting, bedoeld
      in het eerste lid, geldt.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel23
  - number: '23.3'
    text: |-
      Een aansluiting wordt door de netbeheerder gerealiseerd binnen een redelijke termijn. Deze redelijke termijn is in
      ieder geval verstreken wanneer de gevraagde aansluiting niet is gerealiseerd binnen 18 weken nadat het verzoek om
      een aansluiting bij de netbeheerder is ingediend. De vorige volzin is niet van toepassing op aansluitingen van 10
      MVA of hoger.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel23
  - number: '24.1'
    text: |-
      De netbeheerder is verplicht aan degene die daarom verzoekt een aanbod te doen om met gebruikmaking van het door
      hem beheerde net ten behoeve van de verzoeker transport van elektriciteit uit te voeren tegen een tarief en tegen
      andere voorwaarden die in overeenstemming zijn met de [paragrafen 5][ref1] en [6 van dit hoofdstuk][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009755
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '24.2'
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt niet voor zover de netbeheerder voor het gevraagde transport
      redelijkerwijs geen capaciteit ter beschikking heeft. Een weigering transport uit te voeren als bedoeld in de
      vorige volzin is met redenen omkleed. De netbeheerder verschaft degene aan wie transport is geweigerd desgevraagd
      en ten hoogste tegen kostprijs de relevante gegevens over de maatregelen die nodig zijn om het net te versterken.
      Indien ten aanzien van duurzame elektriciteit een weigering transport uit te voeren als bedoeld in de eerste
      volzin plaatsvindt, meldt de netbeheerder dit aan de raad van bestuur van de mededingingsautoriteit, waarbij de
      netbeheerder aangeeft welke maatregelen worden genomen om toekomstige weigeringen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel24
  - number: '24.3'
    text: |-
      De netbeheerder onthoudt zich van iedere vorm van discriminatie tussen degenen jegens wie de verplichting, bedoeld
      in het eerste lid, geldt.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel24
  - number: 24a.1
    text: |-
      Indien een afnemer van leverancier wisselt, voert de netbeheerder die wisseling uit overeenkomstig bij ministeriële
      regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel24a
  - number: 24a.2
    text: |-
      In de ministeriële regeling, bedoeld in het eerste lid, worden in ieder geval regels gesteld over de termijn
      waarbinnen de wisseling moet zijn uitgevoerd en over de bij een verzoek om wisseling te verstrekken gegevens.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel24a
  - number: '25.1'
    text: |-
      Indien de netbeheerder van het landelijk hoogspanningsnet maatregelen neemt als bedoeld in artikel 24 van de
      richtlijn en artikel 6 van de Verordening maakt hij daarbij geen onderscheid tussen landgrensoverschrijdende en
      niet-landgrensoverschrijdende contracten.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel25
  - number: '25.2'
    text: |-
      De maatregelen worden genomen op basis van door de netbeheerder van het landelijk hoogspanningsnet vooraf
      gedefinieerde criteria met betrekking tot het beheer van onbalans die in nauw overleg met de relevante
      netbeheerders in andere landen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel25
  - number: '25.3'
    text: |-
      De maatregelen worden in nauw overleg met de relevante netbeheerders in andere landen genomen met in achtneming van
      de terzake geldende bilaterale overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel25
  - number: '26.1'
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan op aanvraag besluiten dat capaciteit op het
      landsgrensoverschrijdend net voor het transport van elektriciteit tot een door hem te bepalen omvang en voor een
      door hem te bepalen tijdsduur bij voorrang wordt bestemd voor door hem aan te geven verzoekers om capaciteit voor
      het transport van elektriciteit, indien die capaciteit uitsluitend is bestemd om op een transparante en niet-
      discriminatoire wijze, die bijdraagt aan een goede marktwerking op de elektriciteitsmarkt, te worden toegewezen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel26
  - number: '26.2'
    text: |-
      Bij het nemen van het besluit, bedoeld in het eerste lid, kan de raad van bestuur van de mededingingsautoriteit
      voor het transport van elektriciteit voorwaarden goedkeuren en tarieven vaststellen die afwijken van het bepaalde
      bij of krachtens de [paragrafen 5][ref1] en [6][ref2] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009755
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '26.3'
    text: |-
      Het besluit, bedoeld in het eerste lid, mag niet het gevolg hebben dat de hoeveelheid capaciteit die de
      netbeheerder van het landelijk hoogspanningsnet reserveert om noodzakelijk transport van elektriciteit in het
      kader van onderlinge hulp en bijstand ten behoeve van de instandhouding van de integriteit van de netten te kunnen
      uitvoeren, wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel26
  - number: '26.4'
    text: Een besluit als bedoeld in het eerste lid wordt bekend gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel26
  - number: 26a.1
    text: Een netbeheerder hanteert voorwaarden die redelijk, objectief en niet discriminerend zijn.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel26a
  - number: 26a.2
    text: |-
      Voorwaarden als bedoeld in de [artikelen 236][ref1] en [237 van boek 6 van het Burgerlijk Wetboek][ref2] worden
      vermoed niet redelijk te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel236
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel237
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '236'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '237'
  - number: 26a.3
    text: |-
      Een voorwaarde is redelijk, wanneer dit blijkt uit de aard, inhoud of wijze van totstandkoming van de betrokken
      voorwaarde.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel26a
  - number: 26a.4
    text: |-
      Het tweede en derde lid zijn niet van toepassing op een afnemer, bedoeld in [artikel 95a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 26a.5
    text: |-
      De [artikelen 236][ref1] en [237 van boek 6 van het Burgerlijk Wetboek][ref2] zijn mede van toepassing op
      voorwaarden in overeenkomsten met afnemers als bedoeld in [artikel 95a, eerste lid][ref3], die rechtspersoon zijn
      of handelen in de uitoefening van een beroep of bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel236
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel237
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '236'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '237'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 26b.1
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de tariefstructuren en voorwaarden als bedoeld
      in de [artikelen 27][ref1] en [31][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 26b.2
    text: |-
      De raad van bestuur van de mededingingsautoriteit brengt advies uit over het ontwerp van de in het eerste lid
      bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel26b
  - number: 26b.3
    text: |-
      Een krachtens het eerste lid vast te stellen ministeriële regeling treedt niet eerder in werking dan vier weken
      nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd. Het ontwerp wordt vergezeld door het over de
      ministeriële regeling uitgebrachte advies van de raad van bestuur van de mededingingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel26b
  - number: '27.1'
    text: |-
      Met inachtneming van de in [artikel 26b][ref1] bedoelde regels zenden de gezamenlijke netbeheerders aan de raad
      van bestuur van de mededingingsautoriteit een voorstel met betrekking tot de door hen jegens afnemers te hanteren
      tariefstructuren dat de elementen en wijze van berekening beschrijft van het tarief waarvoor afnemers zullen worden
      aangesloten op een net, van het tarief waarvoor transport van elektriciteit, met inbegrip van de invoer, uitvoer en
      doorvoer van elektriciteit, ten behoeve van afnemers zal worden uitgevoerd, het tarief waarvoor de systeemdiensten
      worden verricht en de energiebalans wordt gehandhaafd en het tarief voor meting van elektriciteit bij afnemers als
      bedoeld in [artikel 95a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel26b
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 26b
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: '27.2'
    text: 'In de tariefstructuren wordt in ieder geval opgenomen dat:'
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel27
  - number: 27.2.a
    text: |-
      een afnemer recht heeft op een aansluiting op het door hem gewenste spanningsniveau, tenzij dit om technische
      redenen redelijkerwijs niet van de netbeheerder kan worden verlangd;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel27
  - number: 27.2.b
    text: |-
      een afnemer recht heeft op een vergoeding van de netbeheerder, indien op zijn aansluiting een aansluiting ten
      behoeve van een derde wordt gemaakt;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel27
  - number: 27.2.c
    text: |-
      een afnemer die beschikt over een aansluiting met meerdere verbindingen aangesloten op één of meer spanningsniveaus
      die vallen binnen dezelfde tariefcategorie voor de berekening van het transportafhankelijk transporttarief wordt
      geacht te beschikken over één aansluiting;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel27
  - number: 27.2.d
    text: |-
      iedere afnemer recht heeft te worden aangesloten op het dichtstbijzijnde punt in het net met een bij zijn
      aansluiting behorend spanningsniveau, met dien verstande dat een afnemer die een aansluiting op het net wenst met
      een aansluitwaarde groter dan 10 MVA, wordt aangesloten op het dichtstbijzijnde punt in het net waar voldoende
      netcapaciteit beschikbaar is;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel27
  - number: 27.2.e
    text: |-
      aanpassingen in het net die verband houden met het maken van een aansluiting komen voor rekening van de
      netbeheerder die het betreffende net beheert;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel27
  - number: 27.2.f
    text: |-
      een afnemer, niet zijnde een afnemer die een aansluiting op het net wenst met een aansluitwaarde groter dan 10 MVA,
      recht heeft op een standaardaansluiting, waarbij de aansluitcapaciteit van deze aansluiting is gerelateerd aan de
      standaard gebruikte nominale aansluitspanning;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel27
  - number: 27.2.g
    text: het aansluittarief wordt gebaseerd op de grootte van de aansluitcapaciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel27
  - number: '27.3'
    text: |-
      De tarieven die de netbeheerder van het landelijk hoogspanningsnet in rekening brengt voor de handhaving van de
      energiebalans zijn objectief, transparant, niet-discriminatoir en weerspiegelen de kosten.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel27
  - number: '28.1'
    text: 'Het tarief waarvoor afnemers zullen worden aangesloten op een net heeft uitsluitend betrekking op:'
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel28
  - number: 28.1.a
    text: |-
      het verbreken van het net van de desbetreffende netbeheerder om een fysieke verbinding van de installatie van een
      afnemer met dat net tot stand te brengen,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel28
  - number: 28.1.b
    text: |-
      het installeren van voorzieningen om het net van de desbetreffende netbeheerder te beveiligen en beveiligd te
      houden en
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel28
  - number: 28.1.c
    text: |-
      het tot stand brengen en in stand houden van een verbinding tussen de plaats waar het net verbroken is en de
      voorzieningen om het net te beveiligen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel28
  - number: '28.2'
    text: |-
      Het tarief, bedoeld in het eerste lid, wordt in rekening gebracht bij iedere afnemer die door een netbeheerder
      wordt aangesloten op een net dat wordt beheerd door een netbeheerder.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel28
  - number: '28.3'
    text: |-
      De tarieven voor de aansluiting van de afnemers die producent zijn, zijn objectief, transparant en niet-
      discriminatoir, waarbij rekening wordt gehouden met de kosten en baten van de onderscheiden technieken met
      betrekking tot duurzame energiebronnen, decentrale productie en warmtekrachtkoppeling.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel28
  - number: '29.1'
    text: |-
      Het tarief waarvoor transport van elektriciteit zal worden uitgevoerd ten behoeve van afnemers, heeft betrekking
      op de ontvangst van elektriciteit door een afnemer, ongeacht de plaats van opwekking van de elektriciteit en van de
      aansluiting waar de elektriciteit op het Nederlandse net is gebracht, of op het invoeden van elektriciteit door een
      afnemer, ongeacht de plaats van ontvangst van de elektriciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel29
  - number: '29.2'
    text: |-
      Het tarief, bedoeld in het eerste lid, wordt in rekening gebracht bij iedere afnemer die een aansluiting heeft
      op een net dat wordt beheerd door een netbeheerder. De tarieven voor de ontvangst van elektriciteit kunnen
      verschillen voor verschillende afnemers, afhankelijk van het spanningsniveau van het net waarop de elektriciteit
      wordt ontvangen, en de tarieven voor het invoeden van elektriciteit kunnen verschillen voor verschillende afnemers,
      afhankelijk van het spanningsniveau van het net waarop de elektriciteit wordt ingevoed.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel29
  - number: '29.3'
    text: |-
      Onze Minister stelt de tariefdrager vast voor het transportafhankelijke element van het tarief, bedoeld in het
      eerste lid. Het transportonafhankelijke element van het tarief, bedoeld in het eerste lid, wordt uitgedrukt in
      een bedrag in euro. Het transporttarief wordt berekend per aansluiting. Voor de toepassing van het transporttarief
      wordt een streng van lichtmasten geacht te beschikken over één aansluiting.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel29
  - number: '29.4'
    text: |-
      In aanvulling op het bepaalde bij of krachtens het eerste, tweede en derde lid, kunnen bij algemene maatregel
      van bestuur regels worden gesteld met betrekking tot het tarief waarvoor transport van elektriciteit zal worden
      uitgevoerd ten behoeve van bij die maatregel aan te geven afnemers dan wel voor daarbij te omschrijven transport
      van elektriciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel29
  - number: '29.5'
    text: |-
      Het tarief, bedoeld in het eerste lid, dient mede ter dekking van de kosten die zijn verbonden aan verplichtingen
      die voor het tijdstip van intrekking van de Elektriciteitswet 1989 door de aangewezen vennootschap zijn aangegaan
      met betrekking tot de aanleg van een verbinding voor het transport van elektriciteit tussen Nederland en Noorwegen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel29
  - number: '29.6'
    text: |-
      Het tarief, bedoeld in het eerste lid, dient mede ter dekking van de kosten die zijn verbonden aan de uitvoering
      van de taak, bedoeld in [artikel 16b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16b
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 16b
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '29.7'
    text: |-
      In afwijking van het tweede lid worden de kosten, bedoeld in het zesde lid, uitsluitend in rekening gebracht bij
      afnemers als bedoeld in [artikel 95a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: '30.1'
    text: 'Het tarief voor het verrichten van de systeemdiensten heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel30
  - number: 30.1.a
    text: het reservevermogen en regelvermogen,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel30
  - number: 30.1.b
    text: de black-start-voorzieningen en
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel30
  - number: 30.1.c
    text: de overige systeemdiensten.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel30
  - number: '30.2'
    text: |-
      Het tarief, bedoeld in het eerste lid, wordt in rekening gebracht bij iedere afnemer die elektriciteit verbruikt en
      een aansluiting heeft op een net dat wordt beheerd door een netbeheerder.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel30
  - number: '30.3'
    text: |-
      Het tarief, bedoeld in het eerste lid, wordt uitgedrukt in een bedrag per verbruikte hoeveelheid elektriciteit
      in kWh.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel30
  - number: '30.4'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het tarief, bedoeld in het eerste lid, in rekening wordt
      gebracht bij de afnemer, bedoeld in het tweede lid, en bij iedere afnemer die een hoeveelheid elektriciteit opwekt
      en op het net invoedt, dan wel verbruikt op de eigen installatie. In dat geval wordt het tarief uitgedrukt in een
      bedrag per opgewekte dan wel verbruikte hoeveelheid elektriciteit in kWh.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel30
  - number: 30a
    text: |-
      Het tarief voor de meting van elektriciteit bij afnemers als bedoeld in [artikel 95a, eerste lid][ref1], heeft
      betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 30a.a
    text: het gebruik van de ter beschikking gestelde meter;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel30a
  - number: 30a.b
    text: de vaststelling van de van het net afgenomen en verbruikte elektriciteit;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel30a
  - number: 30a.c
    text: de vaststelling van de op het net ingevoede elektriciteit;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel30a
  - number: 30a.d
    text: |-
      het meedelen van de gegevens aan de desbetreffende afnemer en aan de netbeheerder op wiens net de afnemer is
      aangesloten.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel30a
  - number: '31.1'
    text: |-
      Met inachtneming van de in [artikel 26b][ref1] bedoelde regels zenden de gezamenlijke netbeheerders aan de raad
      van bestuur van de mededingingsautoriteit een voorstel voor de door hen jegens afnemers te hanteren voorwaarden met
      betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel26b
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 26b
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 31.1.a
    text: |-
      de wijze waarop netbeheerders en afnemers alsmede netbeheerders zich jegens elkaar gedragen ten aanzien van het
      in werking hebben van de netten, het voorzien van een aansluiting op het net en het uitvoeren van transport van
      elektriciteit over het net,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: 31.1.b
    text: |-
      de wijze waarop netbeheerders en afnemers alsmede netbeheerders zich jegens elkaar gedragen ten aanzien van het
      meten van gegevens betreffende het transport van elektriciteit en de uitwisseling van meetgegevens,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: 31.1.c
    text: |-
      de wijze waarop de netbeheerder van het landelijk hoogspanningsnet enerzijds en afnemers en de overige
      netbeheerders anderzijds zich jegens elkaar gedragen ten aanzien van de systeemdiensten,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: 31.1.d
    text: de gebiedsindeling van de netbeheerders,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: 31.1.e
    text: |-
      de regeling van de samenwerking tussen de netbeheerders ten aanzien van de uitvoering van de taken, bedoeld in de
      onderdelen a, b en c, alsmede ten behoeve van het waarborgen van het netbeheer van alle netten en het transport van
      elektriciteit in buitengewone omstandigheden,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: 31.1.f
    text: |-
      de kwaliteitscriteria waaraan netbeheerders moeten voldoen met betrekking tot hun dienstverlening, welke in ieder
      geval betrekking hebben op te hanteren technische specificaties, het verhelpen van storingen in het transport van
      elektriciteit, de betalingsvoorwaarden, de klantenservice en het voorzien in compensatie bij ernstige storingen,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: 31.1.g
    text: |-
      de wijze waarop de netbeheerder van het landelijk hoogspanningsnet uitvoering geeft aan zijn taak de
      leveringszekerheid te waarborgen en de wijze waarop productiereservecapaciteit wordt aangehouden en ingezet,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: 31.1.h
    text: |-
      de wijze waarop de netbeheerder afnemers die producent zijn objectief, transparant en niet-discriminatoir op
      het net aansluit, rekening houdend met de kosten en baten van de onderscheiden technieken met betrekking tot
      hernieuwbare energiebronnen, decentrale productie en warmtekrachtkoppeling,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: 31.1.i
    text: |-
      de wijze waarop de netbeheerder van het landelijk hoogspanningsnet jegens de andere netbeheerders en de afnemers de
      energiebalans handhaaft,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: 31.1.j
    text: het realiseren van koppelingen tussen en het verrichten van reparaties aan de netten,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: 31.1.k
    text: |-
      de wijze waarop de netbeheerder van het landelijk hoogspanningsnet enerzijds en afnemers en de overige
      netbeheerders anderzijds zich jegens elkaar gedragen ten aanzien van het verstrekken van informatie die
      noodzakelijk is voor een goede uitvoering van de Verordening en de daarop gebaseerde richtsnoeren.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: '31.2'
    text: |-
      In de voorwaarden, bedoeld in het eerste lid, onderdeel c, worden in ieder geval voorwaarden opgenomen met
      betrekking tot de programma-verantwoordelijkheid, waarbij wordt bepaald dat de programma-verantwoordelijkheid kan
      worden overgedragen aan een ander, met uitzondering van een netbeheerder.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: '31.3'
    text: |-
      In de voorwaarden, bedoeld in het eerste lid, onderdeel a, worden in ieder geval voorwaarden gesteld omtrent de
      eisen waaraan een bedrijf, dat de werkzaamheden bedoeld in [artikel 16c, eerste of vijfde lid][ref1], uitvoert,
      moet voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16c
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 16c
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '31.4'
    text: |-
      In de voorwaarden, bedoeld in het eerste lid, onderdeel a, worden in ieder geval voorwaarden gesteld voor het
      bepalen van de omvang van de capaciteit voor het transport van elektriciteit over het landsgrensoverschrijdend
      net en voor het toewijzen van de beschikbare capaciteit op dat net, waaronder tevens begrepen wordt het veilen
      van capaciteit dan wel het volgens een andere marktconforme methode toewijzen van capaciteit, en het toewijzen van
      capaciteit die een afnemer niet gebruikt. De voorwaarden bevatten de nodige voorzieningen gericht op het voorkomen
      van belemmeringen voor goede marktwerking.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: '31.5'
    text: |-
      De omvang van de capaciteit die toegewezen kan worden door middel van een veiling of een andere marktconforme
      methode is ten hoogste de totale omvang van de capaciteit voor het transport van elektriciteit over het
      landsgrensoverschrijdend net na aftrek van:
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: 31.5.a
    text: |-
      de hoeveelheid capaciteit die de netbeheerder van het landelijk hoogspanningsnet reserveert om noodzakelijk
      transport van elektriciteit in het kader van onderlinge hulp en bijstand ten behoeve van de instandhouding van de
      integriteit van de netten te kunnen uitvoeren,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: 31.5.b
    text: |-
      de hoeveelheid capaciteit die de raad van bestuur van de mededingingsautoriteit op grond van [artikel 26][ref1]
      heeft bestemd voor bepaalde verzoekers om capaciteit voor het transport van elektriciteit, en


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel26
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 31.5.c
    text: |-
      de hoeveelheid capaciteit waarvoor Onze Minister ontheffing heeft verleend op grond van [artikel 86c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel86c
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 86c
        hoofdstuk: '6'
        paragraaf: '9'
  - number: '31.6'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet benut de opbrengst van het veilen of op een andere marktconforme
      methode toewijzen van capaciteit overeenkomstig de regeling, bedoeld in het vierde lid, voor het opheffen van
      beperkingen in de transportcapaciteit op het landsgrensoverschrijdende net dan wel voor andere, door de raad van
      bestuur van de mededingingsautoriteit te bepalen doelen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: '31.7'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet voert een afzonderlijke boekhouding met betrekking tot de
      opbrengst van het veilen of op een andere marktconforme methode toewijzen van capaciteit. [Artikel 43][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel43
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '31.8'
    text: |-
      De voorwaarden, bedoeld in het eerste lid, onderdeel g, kunnen mede betrekking hebben op de wijze waarop de
      netbeheerder van het landelijk hoogspanningsnet enerzijds en afnemers, leveranciers en de overige netbeheerders
      anderzijds zich jegens elkaar gedragen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: '31.9'
    text: |-
      Onze Minister kan, in aanvulling op de voorwaarden, bedoeld in het eerste lid, onderdeel b, en voorzover dit
      onderwerp geen regeling vindt in het bepaalde bij of krachtens [artikel 72m][ref1], nadere regels stellen over:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel72m
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 72m
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 31.9.a
    text: |-
      de vaststelling, bedoeld in [artikel 16, eerste lid, onderdeel h][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 31.9.b
    text: |-
      het meten, bedoeld in [artikel 16, eerste lid, onderdeel i][ref1], en [artikel 16a, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 16a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 31.9.c
    text: |-
      het verstrekken van meetgegevens aan anderen dan genoemd in [artikel 16a, derde lid][ref1], met dien verstande dat
      meetgegevens slechts kunnen worden verstrekt aan leveranciers en handelaren met schriftelijke toestemming van de
      afnemer aan wie de meetgegevens toebehoren;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 16a
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 31.9.d
    text: |-
      het uitgeven van certificaten voor klimaatneutrale elektriciteit en elektriciteit opgewekt door middel van
      warmtekrachtkoppeling en het beheer van een certificatenrekening onderscheidenlijk het uitgeven van garanties van
      oorsprong voor duurzame elektriciteit en garanties van oorsprong voor elektriciteit opgewekt in een installatie
      voor hoogrenderende warmtekrachtkoppeling en het beheer van een rekening;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: 31.9.e
    text: de kosten voor de uitvoering van de onderdelen a tot en met d.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: '31.10'
    text: |-
      De voorwaarden, bedoeld in het eerste lid, onderdeel f, bepalen dat een vordering tot betaling van een schuld van
      een afnemer ter zake van geleverde diensten als bedoeld in [artikel 27, eerste lid][ref1], wordt gedaan binnen twee
      jaren nadat de vordering opeisbaar is geworden en dat bij gebreke daarvan de vordering vervalt. De eerste volzin
      is niet van toepassing indien het uitblijven van bedoelde vordering, een onjuiste vordering daaronder begrepen, het
      rechtstreekse gevolg is van een daartoe gerichte opzettelijke gedraging van de afnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '31.11'
    text: |-
      Tot de voorwaarden bedoeld in het eerste lid, onderdeel g, behoren in elk geval door de netbeheerder van
      het landelijk hoogspanningsnet vast te stellen minimale voorschriften en verplichtingen inzake operationele
      netwerkveiligheid waarvan deel uitmaakt de vaststelling van het niveau van voorzienbare omstandigheden waarin de
      operationele netwerkveiligheid gehandhaafd moet blijven.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: '31.12'
    text: |-
      In de voorwaarden, bedoeld in het eerste lid, onderdelen a, f en g, wordt vastgelegd dat netten met een
      spanningsniveau van 110 kV of hoger zodanig zijn ontworpen of in werking zijn dat het transport van elektriciteit,
      ook indien zich een enkelvoudige storing voordoet, verzekerd is.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31
  - number: 31a.1
    text: |-
      Het is een afnemer, leverancier of handelaar verboden al dan niet middellijk of onder voorwaarden de beschikking te
      hebben over een hoeveelheid transportcapaciteit op het landsgrensoverschrijdende net die groter is dan 400 MW.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31a
  - number: 31a.2
    text: |-
      Onze Minister kan op verzoek voor gebruikers van delen van het landsgrensoverschrijdend net waarvoor een ontheffing
      als bedoeld in [artikel 86c][ref1] is verleend, een afwijkende verdeling van transportcapaciteit vaststellen. Onze
      Minister kan aan de verdeling, bedoeld in de eerste volzin, voorschriften verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel86c
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 86c
        hoofdstuk: '6'
        paragraaf: '9'
  - number: 31a.3
    text: |-
      Onder de beschikking hebben over transportcapaciteit als bedoeld in het eerste lid wordt verstaan het
      beschikken over transportcapaciteit door de afnemer, leverancier of handelaar zelf, dan wel tezamen met
      anderen, die werkzaam zijn voor de afnemer, leverancier of handelaar, die in een groep in de zin van
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] verbonden zijn met de afnemer, leverancier of handelaar,
      die in de zin van [artikel 24c van Boek 2 van het Burgerlijk Wetboek][ref2] een deelneming hebben in de afnemer,
      leverancier of handelaar, of die anderszins met de afnemer, leverancier of handelaar verbonden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24c
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 24c
  - number: 31a.4
    text: |-
      Onze Minister kan op voorstel van de raad van bestuur van de mededingingsautoriteit de hoeveelheid van 400 MW,
      bedoeld in het eerste lid, wijzigen, indien de ontwikkeling van de elektriciteitsmarkt daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31a
  - number: 31a.5
    text: |-
      De [hoofdstukken 6][ref1], [7][ref2],
      [8, met uitzondering van paragraaf 2, 9, 11 en 12 van de Mededingingswet][ref3] zijn van overeenkomstige
      toepassing in geval van overtreding van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0008691
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0008691
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0008691
        hoofdstuk: '8'
  - number: 31b
    text: |-
      Bij ministeriële regeling worden, voor zover noodzakelijk ter uitvoering van de richtlijn, regels gesteld die de
      netbeheerder in acht moet nemen jegens afnemers als bedoeld in [artikel 95a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 31c.1
    text: |-
      De in [artikel 31, eerste lid, onderdeel b][ref1], bedoelde voorwaarden staan toe dat er op verzoek van een afnemer
      als bedoeld in [artikel 95a, eerste lid][ref2], een meter ter beschikking wordt gesteld, waarmee zowel de aan het
      net onttrokken elektriciteit als de ingevoede elektriciteit kan worden gemeten, indien het een afnemer betreft die
      duurzame elektriciteit opwekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 31c.2
    text: |-
      Voor afnemers als bedoeld in [artikel 95a, eerste lid][ref1], die per jaar minder dan 3000 kWh duurzame
      elektriciteit invoeden op het net, berekent de netbeheerder de stand van de in het eerste lid bedoelde meter, ten
      behoeve van de jaarlijkse rekening van de leverancier, door de aan het net onttrokken elektriciteit te verminderen
      met de op het net ingevoede elektriciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel31c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: '32.1'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet of ten minste een derde van het aantal overige netbeheerders
      kan de gezamenlijke netbeheerders verzoeken een voorstel te doen tot wijziging van de tariefstructuren of de
      voorwaarden, bedoeld in de [artikelen 27][ref1] en [31][ref2], onder opgave van de redenen die naar zijn oordeel
      een dergelijke wijziging noodzakelijk maken.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '32.2'
    text: |-
      Indien naar zijn oordeel wijziging van de tariefstructuren of de voorwaarden, bedoeld in de [artikelen 27][ref1]
      en [31][ref2], noodzakelijk is, zendt de raad van bestuur van de mededingingsautoriteit een ontwerp van een besluit
      tot wijziging van de tariefstructuren of de voorwaarden aan de gezamenlijke netbeheerders en de representatieve
      organisaties van partijen op de elektriciteitsmarkt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '32.3'
    text: |-
      In een voorstel of een ontwerp van een besluit tot wijziging van de tariefstructuren of de voorwaarden worden die
      onderdelen, bedoeld in [artikel 27][ref1] of [31][ref2], opgenomen waarvan wijziging wordt verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '33.1'
    text: |-
      De gezamenlijke netbeheerders voeren overleg met representatieve organisaties van partijen op de
      elektriciteitsmarkt over de voorstellen met betrekking tot de tariefstructuren en de voorwaarden, bedoeld in de
      [artikelen 27][ref1], [31][ref2] en [32, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel32
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '33.2'
    text: |-
      In de voorstellen die aan de raad van bestuur van de mededingingsautoriteit worden gezonden, geven de gezamenlijke
      netbeheerders aan welke gevolgtrekkingen zij hebben verbonden aan de zienswijzen die de organisaties, bedoeld in
      het eerste lid, naar voren hebben gebracht.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel33
  - number: '33.3'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet voert overleg met de netbeheerders in andere landen waarmee
      een landgrensoverschrijdend net tot stand is gebracht over de voorschriften en verplichtingen inzake operationele
      netwerkveiligheid als bedoeld in [artikel 31, elfde lid][ref1], voordat hij die voorschriften en verplichtingen
      vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '34.1'
    text: |-
      De gezamenlijke netbeheerders zenden een voorstel met betrekking tot de wijziging van de tariefstructuren of de
      voorwaarden aan de raad van bestuur van de mededingingsautoriteit binnen twaalf weken na het tijdstip waarop een
      verzoek als bedoeld in [artikel 32, eerste lid][ref1], wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel32
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '34.2'
    text: |-
      De gezamenlijke netbeheerders en representatieve organisaties van partijen op de elektriciteitsmarkt kunnen hun
      zienswijze op een ontwerp van een besluit tot wijziging van de tariefstructuren of de voorwaarden aan de raad van
      bestuur van de mededingingsautoriteit kenbaar maken binnen twaalf weken na het tijdstip waarop het ontwerp van het
      besluit op grond van [artikel 32, tweede lid][ref1], aan hen is gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel32
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '36.1'
    text: |-
      De raad van bestuur van de mededingingsautoriteit stelt de tariefstructuren en voorwaarden vast met inachtneming
      van:
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel36
  - number: 36.1.a
    text: |-
      het voorstel van de gezamenlijke netbeheerders als bedoeld in [artikel 27][ref1], [31][ref2] of [32][ref3] en de
      resultaten van het overleg, bedoeld in [artikel 33, eerste lid][ref4],


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel33
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0009755
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 36.1.b
    text: |-
      het belang van het betrouwbaar, duurzaam, doelmatig en milieuhygiënisch verantwoord functioneren van de
      elektriciteitsvoorziening,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel36
  - number: 36.1.c
    text: het belang van de bevordering van de ontwikkeling van het handelsverkeer op de elektriciteitsmarkt,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel36
  - number: 36.1.d
    text: het belang van de bevordering van het doelmatig handelen van afnemers en
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel36
  - number: 36.1.e
    text: het belang van een goede kwaliteit van de dienstverlening van netbeheerders, en
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel36
  - number: 36.1.f
    text: |-
      het belang van een objectieve, transparante en niet discriminatoire handhaving van de energiebalans op een wijze
      die de kosten weerspiegelt, en
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel36
  - number: 36.1.g
    text: |-
      de in [artikel 26b][ref1] bedoelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel26b
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 26b
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '36.2'
    text: |-
      De raad van bestuur van de mededingingsautoriteit stelt de voorwaarden niet vast dan nadat hij zich met
      inachtneming van artikel 5 van de richtlijn ervan vergewist heeft dat de voorwaarden de interoperabiliteit van
      de netten garanderen en objectief, evenredig en niet-discriminatoir zijn, alsmede voor zover dat op grond van de
      notificatierichtlijn noodzakelijk is, aan de Commissie van de Europese Gemeenschappen in ontwerp zijn meegedeeld en
      de van toepassing zijnde termijnen, bedoeld in artikel 9 van de notificatierichtlijn, zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel36
  - number: '36.3'
    text: |-
      Indien een voorstel als bedoeld in [artikel 27][ref1], [31][ref2] of [32][ref3] naar het oordeel van de raad van
      bestuur van de mededingingsautoriteit in strijd is met het belang, bedoeld in het eerste lid, onderdeel b, c,
      d, e of f, met de regels, bedoeld in het eerste lid, onderdeel g of of met de eisen, bedoeld in het tweede lid,
      draagt de raad van bestuur van de mededingingsautoriteit de gezamenlijke netbeheerders op het voorstel onverwijld
      zodanig te wijzigen dat deze strijd wordt opgeheven. [Artikel 4:15 van de Algemene wet bestuursrecht][ref4] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '36.4'
    text: |-
      Indien de gezamenlijke netbeheerders niet binnen vier weken het voorstel wijzigen overeenkomstig de opdracht van
      de raad van bestuur van de mededingingsautoriteit, bedoeld in het derde lid, stelt de raad van bestuur van de
      mededingingsautoriteit de tariefstructuren of de voorwaarden vast onder het aanbrengen van zodanige wijzigingen dat
      deze in overeenstemming zijn met de belangen, bedoeld in het eerste lid, onderdelen b tot en met f, met de regels,
      bedoeld in het eerste lid, onderdeel g of, en met de eisen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel36
  - number: '37.1'
    text: |-
      Nadat de termijn, bedoeld in [artikel 34][ref1], is verstreken, stelt de raad van bestuur van de
      mededingingsautoriteit de tariefstructuren of de voorwaarden vast met inachtneming van de voorstellen
      van netbeheerders en van [artikel 36, eerste en tweede lid][ref2]. Indien een voorstel als bedoeld in
      [artikel 34][ref3] niet binnen de daarbij aangegeven termijn aan de raad van bestuur van de mededingingsautoriteit
      is gezonden, stelt deze de tariefstructuren of de voorwaarden uit eigen beweging vast met inachtneming van
      [artikel 36, eerste en tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel36
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '37.2'
    text: |-
      Indien de gezamenlijke netbeheerders niet binnen de termijn, bedoeld in [artikel 34, derde lid][ref1],
      hun zienswijze op een ontwerp van een besluit als bedoeld in dat artikellid aan de raad van bestuur van de
      mededingingsautoriteit kenbaar maken, stelt deze het besluit tot wijziging van de tariefstructuren of de
      voorwaarden uit eigen beweging vast met inachtneming van [artikel 36, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel36
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 37a.1
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan op aanvraag bij beschikking een ontheffing verlenen van de
      tariefstructuren en de voorwaarden. Bij zijn beslissing neemt de raad van bestuur van de mededingingsautoriteit
      de belangen als bedoeld in [artikel 36, eerste lid, onderdelen b tot en met f][ref1] en de regels, bedoeld in
      [artikel 36, eerste lid, onderdeel g][ref2], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel36
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 37a.2
    text: |-
      De raad van bestuur van de mededingingsautoriteit stelt beleidsregels op met betrekking tot de procedure voor
      aanvraag van een ontheffing. De beleidsregels worden bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel37a
  - number: 37a.3
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan voorschriften en beperkingen verbinden aan de ontheffing. De
      raad van bestuur van de mededingingsautoriteit kan de voorschriften en de opgelegde beperkingen wijzigen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel37a
  - number: 37a.4
    text: |-
      De raad van bestuur van de mededingingsautoriteit trekt de ontheffing in op daartoe strekkend schriftelijk verzoek
      van de houder van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel37a
  - number: 37a.5
    text: 'De raad van bestuur van de mededingingsautoriteit kan een ontheffing intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel37a
  - number: 37a.5.a
    text: de houder van de ontheffing de aan de ontheffing verbonden voorschriften of opgelegde beperkingen niet nakomt;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel37a
  - number: 37a.5.b
    text: |-
      de houder van de ontheffing bij de aanvraag onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van
      juiste en volledige gegevens tot een andere beschikking op de aanvraag zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel37a
  - number: 37a.5.c
    text: |-
      de raad van bestuur van de mededingingsautoriteit, gelet op de belangen bedoeld in
      [artikel 36, eerste lid, onderdelen b tot en met f][ref1] en de regels, bedoeld in
      [artikel 36, eerste lid, onderdeel g][ref2], van oordeel is dat intrekking van de ontheffing noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel36
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 37a.6
    text: Een op grond van dit artikel genomen beschikking wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel37a
  - number: '38.1'
    text: |-
      De tariefstructuren en de voorwaarden treden in werking op een door de raad van bestuur van de
      mededingingsautoriteit te bepalen datum en gelden voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel38
  - number: '38.2'
    text: |-
      Van de besluiten betreffende de vaststelling van de tariefstructuren en de voorwaarden alsmede de wijziging daarvan
      wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel38
  - number: '38.3'
    text: |-
      Iedere netbeheerder legt een exemplaar van de tariefstructuren en de voorwaarden voor een ieder ter inzage in al
      zijn vestigingen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel38
  - number: '38.4'
    text: |-
      Na de vaststelling van de voorwaarden gelden deze als minimumeisen voor de technische veiligheid en voor het
      technisch ontwerp en de exploitatie van de installaties en netten, bedoeld in artikel 5 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel38
  - number: '39.1'
    text: |-
      Netbeheerders zenden de raad van bestuur van de mededingingsautoriteit voor 1 maart van elk jaar een rapportage
      omtrent de naleving door hen van de kwaliteitscriteria, bedoeld in [artikel 31, eerste lid, onderdeel f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '39.2'
    text: |-
      De raad van bestuur van de mededingingsautoriteit vermeldt de bevindingen die hij ontleent aan rapportages als
      bedoeld in het eerste lid in het verslag, bedoeld in [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel9
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '9'
        hoofdstuk: '2'
  - number: '40'
    text: |-
      De tarieven voor de diensten ter uitvoering van de taken, genoemd in [artikel 16, eerste lid][ref1], worden
      vastgesteld overeenkomstig de [artikelen 41 tot en met 41d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel41
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 40a
    text: |-
      De tarieven voor de meting van elektriciteit bij afnemers als bedoeld in [artikel 95a, eerste lid][ref1],
      als bedoeld in [artikel 30a][ref2], worden vastgesteld door de raad van bestuur van de mededingingsautoriteit
      na overleg met de gezamenlijke netbeheerders en met representatieve organisaties van partijen op de
      elektriciteitsmarkt. Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot
      procedure tot vaststelling van de tarieven voor de meting van elektriciteit bij afnemers als bedoeld in
      [artikel 95a, eerste lid][ref3] en de wijze van berekening van deze tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel30a
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 30a
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: '41.1'
    text: |-
      De raad van bestuur van de mededingingsautoriteit stelt na overleg met de gezamenlijke netbeheerders en met
      representatieve organisaties van partijen op de elektriciteitsmarkt, met inachtneming van het belang dat door
      middel van marktwerking ten behoeve van afnemers de doelmatigheid van de bedrijfsvoering en de meest doelmatige
      kwaliteit van het transport worden bevorderd, voor netbeheerders, met uitzondering van de netbeheerder van
      het landelijk hoogspanningsnet, de methode tot vaststelling van de korting ter bevordering van de doelmatige
      bedrijfsvoering, van de kwaliteitsterm en van het rekenvolume van elke tariefdrager waarvoor een tarief wordt
      vastgesteld, vast.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41
  - number: '41.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing voor vaststelling van de methode tot vaststelling van de korting
      ter bevordering van de doelmatige bedrijfsvoering en van het rekenvolume van elke tariefdrager waarvoor een tarief
      wordt vastgesteld voor de netbeheerder van het landelijk hoogspanningsnet.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41
  - number: '41.3'
    text: |-
      De korting ter bevordering van de doelmatige bedrijfsvoering heeft onder meer ten doel te bereiken dat de
      netbeheerder in ieder geval geen rendement kan behalen dat hoger is dan in het economische verkeer gebruikelijk en
      dat de gelijkwaardigheid in de doelmatigheid van de netbeheerders wordt bevorderd.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41
  - number: '41.4'
    text: |-
      De kwaliteitsterm geeft de aanpassing van de tarieven in verband met de geleverde kwaliteit aan en heeft ten doel
      netbeheerders te stimuleren om de kwaliteit van hun transportdienst te optimaliseren.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41
  - number: '41.5'
    text: |-
      De rekenvolumina die een netbeheerder gebruikt bij het voorstel, bedoeld in [artikel 41b][ref1], zijn
      gebaseerd op daadwerkelijk gefactureerde volumina in eerdere jaren, of worden door de raad van bestuur van de
      mededingingsautoriteit geschat indien deze betrekking hebben op nieuwe tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel41b
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 41b
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 41a.1
    text: |-
      Ten behoeve van het voorstel, bedoeld in [artikel 41b][ref1], stelt de raad van bestuur van de
      mededingingsautoriteit voor iedere netbeheerder afzonderlijk voor een periode van ten minste drie en ten hoogste
      vijf jaar vast:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel41b
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 41b
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 41a.1.a
    text: de korting ter bevordering van de doelmatige bedrijfsvoering,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41a
  - number: 41a.1.b
    text: de kwaliteitsterm, en
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41a
  - number: 41a.1.c
    text: het rekenvolume van elke tariefdrager waarvoor een tarief wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41a
  - number: 41a.2
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan het in het eerste lid, onderdeel c, bedoelde rekenvolume
      gedurende de in dit lid bedoelde periode wijzigen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41a
  - number: 41b.1
    text: |-
      Iedere netbeheerder zendt jaarlijks voor 1 oktober aan de raad van bestuur van de mededingingsautoriteit een
      voorstel voor de tarieven die deze netbeheerder ten hoogste zal berekenen voor de uitvoering van de taken genoemd
      in [artikel 16, eerste lid][ref1], met inachtneming van:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 41b.1.a
    text: |-
      het uitgangspunt dat de kosten worden toegerekend aan de tariefdragers betreffende de diensten die deze kosten
      veroorzaken,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41b
  - number: 41b.1.b
    text: |-
      de tariefstructuren vastgesteld op grond van [artikel 36][ref1] of [37][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel37
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 41b.1.c
    text: |-
      het bepaalde bij of krachtens [artikel 41a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel41a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 41a
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 41b.1.d
    text: |-
      de formule waarbij TI = de totale inkomsten uit de tarieven in het jaar t, te weten de som van de vermenigvuldiging
      van elk tarief in jaar t en het op basis van [artikel 41a, eerste lid, onderdeel c][ref1], vastgestelde rekenvolume
      van elke tariefdrager waarvoor een tarief wordt vastgesteld; TI = de totale inkomsten uit de tarieven in het
      jaar voorafgaande aan het jaar t, te weten de som van de vermenigvuldiging van elk tarief in jaar t-1 en het op
      basis van [artikel 41a, eerste lid, onderdeel c][ref2], vastgestelde rekenvolume van elke tariefdrager waarvoor
      een tarief wordt vastgesteld; cpi = de relatieve wijziging van de consumentenprijsindex (alle huishoudens),
      berekend uit het quotiënt van deze prijsindex, gepubliceerd in de vierde maand voorafgaande aan het jaar t,
      en van deze prijsindex, gepubliceerd in de zestiende maand voorafgaande aan het jaar t, zoals deze maandelijks
      wordt vastgesteld door het Centraal Bureau voor de Statistiek; x = de korting ter bevordering van de doelmatige
      bedrijfsvoering; q = de kwaliteitsterm, die de aanpassing van de tarieven in verband met de geleverde kwaliteit
      aangeeft.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel41a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel41a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 41a
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 41a
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 41b.2
    text: |-
      Een netbeheerder kan, gelijktijdig met het voorstel, bedoeld in het eerste lid, een voorstel doen voor een
      tariefverhoging ter dekking van de kosten voor een uitzonderlijke en aanmerkelijke investering ter uitbreiding van
      het door de netbeheerder beheerde net.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41b
  - number: 41ba
    text: |-
      Een netbeheerder kan, gelijktijdig met het voorstel, bedoeld in [artikel 41b, eerste lid][ref1], een
      voorstel doen voor een tariefverhoging ter dekking van de kosten voor de uitvoering van de taak, bedoeld in
      [artikel 16b, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel41b
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16b
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41ba
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 41b
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 16b
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 41c.1
    text: |-
      De raad van bestuur van de mededingingsautoriteit stelt de tarieven, die kunnen verschillen voor de verschillende
      netbeheerders en voor onderscheiden tariefdragers, jaarlijks vast.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41c
  - number: 41c.2
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan de tarieven die zullen gelden in het jaar t corrigeren,
      indien de tarieven die golden in dat jaar of de jaren voorafgaand aan het jaar t:
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41c
  - number: 41c.2.a
    text: |-
      bij rechterlijke uitspraak of met toepassing van [artikel 6:18 van de Algemene wet bestuursrecht][ref1] zijn
      gewijzigd;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 41c.2.b
    text: |-
      zijn vastgesteld met inachtneming van onjuiste of onvolledige gegevens en de raad van bestuur van de
      mededingingsautoriteit, indien hij de beschikking had over juiste of volledige gegevens, tarieven zou hebben
      vastgesteld die in aanmerkelijke mate zouden afwijken van de vastgestelde tarieven;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41c
  - number: 41c.2.c
    text: zijn vastgesteld met gebruikmaking van geschatte gegevens en de feitelijke gegevens daarvan afwijken;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41c
  - number: 41c.2.d
    text: |-
      zijn vastgesteld met gebruikmaking van gegevens omtrent kosten voor bepaalde diensten, terwijl netbeheerders die
      diensten in het jaar t of een gedeelte van jaar t niet hebben geleverd of voor die diensten geen of minder kosten
      hebben gemaakt.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41c
  - number: 41c.3
    text: |-
      Indien een voorstel niet binnen de termijn, bedoeld in [artikel 41b, eerste lid][ref1], aan de raad van bestuur
      van de mededingingsautoriteit is gezonden, stelt deze de tarieven voor de desbetreffende netbeheerder uit eigen
      beweging vast met inachtneming van [artikel 41b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel41b
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel41b
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 41b
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 41b
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 41d.1
    text: |-
      In afwijking van [artikel 41a][ref1] wordt voor de netbeheerder van het landelijk hoogspanningsnet geen
      kwaliteitsterm vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel41a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41d
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 41a
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 41d.2
    text: |-
      De raad van bestuur van de mededingingsautoriteit stelt voor de netbeheerder van het landelijk
      hoogspanningsnet jaarlijks het verschil vast tussen de totale inkomsten uit de tarieven, bedoeld in
      [artikel 41b, eerste lid, onderdeel d][ref1], en de gerealiseerde totale inkomsten uit de tarieven. Bij de
      eerstvolgende vaststelling van de tarieven verwerkt de raad van bestuur van de mededingingsautoriteit het verschil
      in de tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel41b
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41d
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 41b
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 41e.1
    text: |-
      De tarieven voor diensten ter uitvoering van de taken, genoemd in [artikel 16, tweede lid][ref1], worden
      vastgesteld overeenkomstig dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41e
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 41e.2
    text: |-
      Voor elke taak van de netbeheerder van het landelijk hoogspanningsnet, genoemd in [artikel 16, tweede lid][ref1],
      stelt de raad van bestuur van de mededingingsautoriteit de methode van regulering vast, voor een periode van
      ten minste drie en ten hoogste vijf jaar, na overleg met de gezamenlijke netbeheerders en met representatieve
      organisaties van partijen op de elektriciteitsmarkt en met inachtneming van het belang dat de doelmatigheid van de
      bedrijfsvoering en de meest doelmatige kwaliteit van uitvoering van deze taken worden bevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41e
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 41e.3
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet zendt jaarlijks voor 1 oktober aan de raad van
      bestuur van de mededingingsautoriteit een voorstel voor de tarieven voor uitvoering van de taken, genoemd
      in [artikel 16, tweede lid][ref1], met inachtneming van de tariefstructuren vastgesteld op grond van
      [artikel 36][ref2] of [37][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel37
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41e
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 41e.4
    text: |-
      De raad van bestuur van de mededingingsautoriteit stelt de tarieven vast overeenkomstig
      [artikel 41c, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel41c
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41e
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 41c
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 41e.5
    text: |-
      Indien een voorstel niet binnen de termijn, bedoeld in het derde lid, aan de raad van bestuur van de
      mededingingsautoriteit is gezonden, stelt deze de tarieven uit eigen beweging vast met inachtneming van dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel41e
  - number: '42.1'
    text: |-
      De tarieven treden in werking op een door de raad van bestuur van de mededingingsautoriteit te bepalen datum en
      gelden tot 1 januari van het jaar, volgend op de datum van inwerkingtreding van het besluit tot vaststelling van
      de tarieven.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel42
  - number: '42.2'
    text: |-
      Indien op 1 januari de tarieven voor het volgende jaar nog niet zijn vastgesteld, gelden de tarieven tot de datum
      van inwerkingtreding van het besluit tot vaststelling van de tarieven voor het volgende jaar.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel42
  - number: '42.3'
    text: |-
      Iedere netbeheerder legt een exemplaar van de voor hem geldende tarieven voor een ieder ter inzage in al zijn
      vestigingen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel42
  - number: '43.1'
    text: |-
      Een netbeheerder is verplicht een afzonderlijke boekhouding te voeren voor het beheer van de netten op grond van
      zijn taken, bedoeld in de [artikelen 16][ref1] en [16a][ref2]. Indien de netbeheerder werkzaamheden verricht als
      bedoeld in [artikel 17][ref3] of [17a][ref4], voert hij daarvoor eveneens, al dan niet op geconsolideerde basis,
      een afzonderlijke boekhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16a
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel17a
