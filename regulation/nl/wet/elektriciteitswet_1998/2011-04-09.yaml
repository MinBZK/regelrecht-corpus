      [ref13]: https://wetten.overheid.nl/BWBR0009755#Artikel17a
      [ref14]: https://wetten.overheid.nl/BWBR0009755#Artikel18
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel12
