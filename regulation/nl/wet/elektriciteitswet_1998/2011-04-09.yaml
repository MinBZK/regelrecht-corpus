    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel1
  - number: 1.1.ae
    text: |-
      operationele netwerkveiligheid: het vermogen van het landelijk hoogspanningsnet om in voorzienbare omstandigheden
      operationeel te blijven.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt als afnemer, niet zijnde een afnemer als
      bedoeld in [artikel 95a, eerste lid][ref1], beschouwd een organisatorische eenheid die zich in hoofdzaak bezig
      houdt met het openbaar vervoer per metro, tram of trolley, met mijnbouwkundige activiteiten, met het beheer van de
      openbare verlichting of van verkeersregelinstallaties, dan wel met riolering, bemaling, waterzuivering of transport
      en distributie van water, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 1.2.a
    text: |-
      deze eenheid daarbij uitsluitend ingevolge de technische aard van de bedrijfsuitoefening beschikt over verscheidene
      aansluitingen,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel1
  - number: 1.2.b
    text: het totale aan de eenheid voor die bedrijfsuitoefening beschikbaar gestelde vermogen meer bedraagt dan 2 MVA en
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel1
  - number: 1.2.c
    text: de bedrijfsuitoefening door deze eenheid op fysiek geïntegreerde basis geschiedt.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel1
  - number: '1.3'
    text: |-
      Een onderneming die zich in hoofdzaak bezighoudt met het vervoer van personen of goederen per trein wordt
      in afwijking van het eerste lid, onderdeel c, aangemerkt als afnemer, niet zijnde een afnemer als bedoeld in
      [artikel 95a, eerste lid][ref1], ook indien zij geen aansluiting heeft op een net.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: '1.4'
    text: |-
      Deze wet en de daarop berustende bepalingen zijn mede van toepassing op installaties voor de opwekking van
      elektriciteit die zijn gevestigd binnen de Nederlandse exclusieve economische zone, alsmede de daarmee opgewekte
      elektriciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel1
  - number: '1.5'
    text: |-
      Productie-installaties voor de opwekking van elektriciteit met behulp van windenergie op het land die behoren tot
      eenzelfde onderneming of instelling en die onderling technische, organisatorische of functionele bindingen hebben
      en in elkaars onmiddelijke nabijheid zijn gelegen, worden geacht te beschikken over één aansluiting.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister stelt ten minste eenmaal in de vier jaar een energierapport vast dat richting geeft aan van rijkswege
      in de eerstvolgende vier jaar te nemen beslissingen voor zover daarbij het belang van het betrouwbaar, duurzaam,
      doelmatig en milieuhygiënisch verantwoord functioneren van de elektriciteitsvoorziening in beschouwing moet of kan
      worden genomen. Bij de voorbereiding van een energierapport betrekt Onze Minister de naar zijn oordeel bij de te
      behandelen onderwerpen meest belanghebbende bestuursorganen, instellingen en organisaties.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel2
  - number: '2.2'
    text: |-
      Voor zover het energierapport onderdelen betreft die tot de verantwoordelijkheid behoren van Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, wordt het rapport vastgesteld na overleg met voornoemde
      minister.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel2
  - number: '2.3'
    text: 'Het energierapport bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel2
  - number: 2.3.a
    text: |-
      een analyse van de ontwikkelingen op de nationale en internationale energiemarkt en de effecten daarvan op een
      betrouwbaar, duurzaam, doelmatig en milieuhygiënisch verantwoord functionerende energiehuishouding;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel2
  - number: 2.3.b
    text: |-
      een analyse van veranderingen in het gebruik van energiebronnen voor het opwekken van elektriciteit en van de wijze
      waarop en de mate waarin zich een duurzame energiehuishouding ontwikkelt;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel2
  - number: 2.3.c
    text: een analyse van de ontwikkeling van de marktwerking in de energievoorziening;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel2
  - number: 2.3.d
    text: |-
      een overzicht van de beoogde resultaten inzake de bevordering van een betrouwbaar, duurzaam, doelmatig en
      milieuhygiënisch verantwoord functionerende energiehuishouding en van de wijzen waarop die resultaten in de
      desbetreffende periode van vier jaar zullen worden nagestreefd;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel2
  - number: 2.3.e
    text: een analyse van overige aspecten die van belang kunnen zijn in het kader van het energiebeleid in het algemeen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel2
  - number: '3.1'
    text: |-
      Zodra het energierapport is vastgesteld, doet Onze Minister hiervan mededeling door het rapport aan de beide kamers
      der Staten-Generaal over te leggen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel3
  - number: '3.2'
    text: |-
      Onze Minister maakt de vaststelling van het energierapport bekend in de Staatscourant en geeft daarbij aan op welke
      wijze kennis kan worden gekregen van de inhoud van het energierapport.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel3
  - number: '4.1'
    text: Het energierapport geldt met ingang van een bij besluit van Onze Minister vast te stellen tijdstip.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4
  - number: '4.2'
    text: |-
      Het besluit wordt niet eerder genomen dan acht weken nadat het energierapport op grond van
      [artikel 3, eerste lid][ref1], is overgelegd aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '4.3'
    text: |-
      Indien door of namens een der kamers der Staten-Generaal binnen acht weken nadat het energierapport is overgelegd,
      te kennen wordt gegeven dat zij over het energierapport in het openbaar wil beraadslagen, wordt het besluit niet
      eerder genomen dan zes maanden na de overlegging van het energierapport, dan wel, indien de beraadslagingen op een
      eerder tijdstip zijn beëindigd, na die beraadslagingen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4
  - number: 4a.1
    text: |-
      Onze Minister verzamelt, analyseert en bewerkt systematisch inlichtingen en gegevens met betrekking tot de
      leverings- en voorzieningszekerheid, in het bijzonder met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
  - number: 4a.1.a
    text: het evenwicht van vraag en aanbod op de nationale markt,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
  - number: 4a.1.b
    text: het niveau van de verwachte toekomstige vraag,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
  - number: 4a.1.c
    text: de geplande of in aanbouw zijnde extra productie- en netwerkcapaciteit,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
  - number: 4a.1.d
    text: de kwaliteit en de staat van onderhoud van de netten, en
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
  - number: 4a.1.e
    text: de maatregelen in geval van piekbelasting of het in gebreke blijven van een of meerdere leveranciers.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
  - number: 4a.2
    text: |-
      Onze Minister publiceert jaarlijks uiterlijk op 31 juli op geschikte wijze een verslag van zijn bevindingen die
      het verzamelen, analyseren en bewerken van de inlichtingen en gegevens over de onderwerpen, genoemd in het eerste
      lid, heeft opgeleverd, alsmede van de getroffen of voorgenomen maatregelen met betrekking tot die onderwerpen.
      Hij zendt het verslag onverwijld naar de Commissie van de Europese Gemeenschappen en doet mededeling ervan in de
      Staatscourant, onder vermelding van de wijze waarop het verslag kan worden geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
  - number: 4a.3
    text: |-
      Ter uitvoering van de taak, bedoeld in het eerste lid, kunnen bij ministeriële regeling nadere regels worden
      gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
  - number: 4a.3.a
    text: de gegevens en inlichtingen waarvan Onze Minister kan verlangen dat zij hem worden verstrekt,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
  - number: 4a.3.b
    text: |-
      degenen van wie Onze Minister, onverminderd [artikel 78][ref1], kan verlangen dat zij hem gegevens en inlichtingen
      verstrekken, en


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel78
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '78'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 4a.3.c
    text: |-
      de termijn waarbinnen, de wijze waarop en de vorm waarin de gegevens en inlichtingen aan Onze Minister worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
  - number: 4a.4
    text: |-
      Het verslag bedoeld in het tweede lid wordt in nauwe samenwerking met de netbeheerder van het landelijk
      hoogspanningsnet opgesteld die voorzover van toepassing daarover overleg pleegt met de relevante netbeheerders van
      aangrenzende landen. In het verslag wordt ingegaan op de algehele toereikendheid van het stroomvoorzieningsysteem
      en de geraamde vraag naar elektriciteit waarbij in elk geval aandacht wordt besteed aan:
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
  - number: 4a.4.a
    text: de operationele netwerkveiligheid,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
  - number: 4a.4.b
    text: het geraamde evenwicht tussen aanbod en vraag in de komende vijf jaar,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
  - number: 4a.4.c
    text: |-
      de vooruitzichten inzake de elektriciteitsvoorziening voor de periode tussen vijf en vijftien jaar na de datum van
      verslaglegging, en
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
  - number: 4a.4.d
    text: |-
      de voornemens van de netbeheerder van het landelijk hoogspanningsnet en voor zover bekend van andere partijen voor
      de komende vijf of meer kalenderjaren op het gebied van investeringen ter voorziening in landgrensoverschrijdende
      netten.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
  - number: 4a.5
    text: |-
      Bij het onderdeel van het verslag waarin aandacht wordt besteed aan de investeringsvoornemens in
      landgrensoverschrijdende netten als bedoeld in het vierde lid, onderdeel d, wordt met betrekking tot die voornemens
      rekening gehouden met:
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
  - number: 4a.5.a
    text: de beginselen van congestiebeheer, zoals vermeld in de Verordening,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
  - number: 4a.5.b
    text: de bestaande en geplande transportlijnen,
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
  - number: 4a.5.c
    text: |-
      verwachte patronen op het gebied van productie, levering, grensoverschrijdende handel en verbruik waarbij ruimte is
      voor vraagbeheersmaatregelen, en
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
  - number: 4a.5.d
    text: |-
      regionale, nationale en Europese doelstellingen voor duurzame ontwikkeling met inbegrip van de projecten die zijn
      opgenomen in bijlage I bij Beschikking nr. 1364/2006/EG.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel4a
  - number: '5.1'
    text: |-
      De raad van bestuur van de mededingingsautoriteit is belast met taken ter uitvoering van deze wet en de
      Verordening, alsmede met het toezicht op de naleving van deze wet en de Verordening.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel5
  - number: '5.2'
    text: |-
      De raad van bestuur van de mededingingsautoriteit houdt bij de uitoefening van de hem op grond van deze wet
      en de [Gaswet][ref1] toegekende taken en bevoegdheden rekening met het belang van de bevordering van een
      elektriciteitsmarkt en een gasmarkt die niet-discriminatoir en transparant zijn en die gekenmerkt worden
      door daadwerkelijke mededinging en een doeltreffende marktwerking. Hij volgt nauwlettend in welke mate de
      elektriciteitsmarkt en de gasmarkt aan de in de vorige volzin genoemde belangen voldoen en doet hiervan in een
      afzonderlijk hoofdstuk verslag in het verslag, bedoeld in [artikel 9, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011440
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel9
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011440
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '9'
        hoofdstuk: '2'
  - number: '5.3'
    text: |-
      De werkzaamheden in verband met de uitvoering van [artikel 51][ref1] worden verricht door personen die niet
      betrokken zijn bij werkzaamheden op grond van [hoofdstuk 3, paragrafen 4 tot en met 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '51'
        hoofdstuk: '3'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0009755
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '5.4'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet en de Verordening zijn belast de bij
      besluit van de raad van bestuur van de mededingingsautoriteit aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel5
  - number: '5.5'
    text: Van een besluit als bedoeld in het vierde lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel5
  - number: '5.6'
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan bindende aanwijzingen geven in verband met de naleving
      van het bepaalde bij of krachtens deze wet en de Verordening. Van de beschikking wordt mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel5
  - number: 5b.1
    text: |-
      De raad van bestuur van de mededingingsautoriteit stelt een handhavingsplan op. Het plan beschrijft de
      procedure en de wijze waarop de raad van bestuur van de mededingingsautoriteit zijn in deze wet toegekende
      handhavingsbevoegdheden toepast.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel5b
  - number: 5b.2
    text: Het handhavingsplan behoeft goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel5b
  - number: 5b.3
    text: Het besluit tot goedkeuring wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel5b
  - number: '7.1'
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan van een producent, een leverancier, een handelaar, een
      netbeheerder, een elektriciteits- of gasbeurs of een afnemer de gegevens en inlichtingen verlangen die hij nodig
      heeft voor uitvoering van de hem in deze wet opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel7
  - number: '7.2'
    text: |-
      Degene aan wie een verzoek is gedaan om gegevens en inlichtingen te verstrekken, is verplicht binnen de door de
      raad van bestuur van de mededingingsautoriteit gestelde redelijke termijn alle medewerking te verlenen die deze
      redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel7
  - number: '7.3'
    text: |-
      Gegevens of inlichtingen omtrent een producent, een leverancier, een handelaar, een netbeheerder,
      een elektriciteits- of gasbeurs of een afnemer, welke in verband met enige werkzaamheid ten behoeve
      van de uitvoering van deze wet zijn verkregen, mogen uitsluitend voor de toepassing van deze wet,
      de [Mededingingswet][ref1] en de [Gaswet][ref2] en voor de toepassing van [artikelen 4.4][ref3] en
      [4.5 van de Wet handhaving consumentenbescherming][ref4] worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0008691
      [ref2]: https://wetten.overheid.nl/BWBR0011440
      [ref3]: https://wetten.overheid.nl/BWBR0020586#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0020586#Artikel4
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008691
      - id: ref2
        bwb_id: BWBR0011440
      - id: ref3
        bwb_id: BWBR0020586
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0020586
        artikel: '4'
  - number: '7.4'
    text: |-
      In afwijking van het derde lid is de raad van bestuur van de mededingingsautoriteit bevoegd gegevens en
      inlichtingen, verkregen ingevolge het eerste lid, te verstrekken aan:
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel7
  - number: 7.4.a
    text: |-
      een buitenlandse instelling, die op grond van nationale wettelijke regels is belast met de toepassing van de regels
      op het gebied van elektriciteit, voor zover die gegevens en inlichtingen van betekenis zijn of kunnen zijn voor de
      uitoefening van de taak van die instelling;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel7
  - number: 7.4.b
    text: |-
      een bestuursorgaan dat op grond van deze wet of van een andere wettelijke regeling dan deze wet is belast met taken
      die de toepassing of mede de toepassing van bepalingen op het gebied van elektriciteit betreffen, voor zover die
      gegevens en inlichtingen van betekenis kunnen zijn voor de uitoefening van de taak van dat bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel7
  - number: '7.5'
    text: 'Op basis van het vierde lid kunnen uitsluitend gegevens en inlichtingen worden verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel7
  - number: 7.5.a
    text: de geheimhouding van de gegevens en inlichtingen in voldoende mate is gewaarborgd, en
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel7
  - number: 7.5.b
    text: |-
      voldoende is gewaarborgd dat de gegevens en inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel7
  - number: 9a.1
    text: |-
      Indien naar het oordeel van Onze Minister om de leverings- en voorzieningszekerheid te waarborgen onvoldoende
      productie-installaties worden gebouwd, kan hij een procedure starten overeenkomstig artikel 7 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9a
  - number: 9a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de in artikel 7 van de
      richtlijn bedoelde procedure.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9a
  - number: 9b.1
    text: |-
      De procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel c, van de Wet ruimtelijke ordening][ref1],
      is van toepassing op de aanleg en uitbreiding van:


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 9b.1.a
    text: |-
      een productie-installatie, met inbegrip van de aansluiting van die installatie op een net, met een capaciteit van
      ten minste 100 MW, indien het betreft een installatie voor de opwekking van duurzame elektriciteit met behulp van
      windenergie;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9b
  - number: 9b.1.b
    text: |-
      een productie-installatie, met inbegrip van de aansluiting van die installatie op een net, met een capaciteit van
      ten minste 50 MW, indien het betreft een installatie voor de opwekking van duurzame elektriciteit anders dan met
      behulp van windenergie;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9b
  - number: 9b.1.c
    text: |-
      een productie-installatie, met inbegrip van de aansluiting van die installatie op een net, met een capaciteit van
      ten minste 500 MW, indien het betreft een installatie voor de opwekking van andere dan duurzame elektriciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9b
  - number: 9b.2
    text: |-
      De procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel c, van de Wet ruimtelijke ordening][ref1]
      is eveneens van toepassing op de uitbreiding van een productie-installatie voor de opwekking van andere dan
      duurzame elektriciteit, met inbegrip van de aansluiting van die installatie op een net, indien door die uitbreiding
      de capaciteit van die productie-installatie wordt vergroot tot ten minste 500 MW.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 9b.3
    text: |-
      De producent meldt een voornemen tot aanleg of uitbreiding van een productie-installatie als bedoeld in het eerste
      of tweede lid, zo spoedig mogelijk schriftelijk aan Onze Minister. Bij ministeriële regeling kan voor het doen van
      de melding en de daarbij te verstrekken gegevens een formulier worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9b
  - number: 9b.4
    text: |-
      Indien, in aanmerking genomen de omvang, aard en ligging van een installatie als bedoeld in het eerste of tweede
      lid, alsmede het aantal voor de aanleg of uitbreiding van die installatie benodigde besluiten, redelijkerwijs
      niet valt te verwachten dat toepassing van de procedure, bedoeld in het eerste of tweede lid, de besluitvorming
      in betekenende mate zal versnellen of daaraan anderszins aanmerkelijke voordelen zijn verbonden, kan Onze Minister
      bepalen dat:
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9b
  - number: 9b.4.a
    text: |-
      geen van de procedures, bedoeld in [artikel 3.35, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 9b.4.b
    text: |-
      uitsluitend de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel a][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 9b.4.c
    text: |-
      uitsluitend de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel b][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 9b.4.d
    text: |-
      de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel a][ref1], gevolgd door de procedure,
      bedoeld in artikel 3.35, eerste lid, aanhef en onderdeel b, van de Wet ruimtelijke ordening, van toepassing
      zijn of is op de aanleg of de uitbreiding van die installatie. Onze Minister hoort de producent en de betrokken
      bestuursorganen over een voornemen toepassing te geven aan de bevoegdheid, bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 9c.1
    text: |-
      Onze Minister is de aangewezen minister, bedoeld in
      [artikel 3.35, tweede en derde lid, van de Wet ruimtelijke ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 9c.2
    text: |-
      Indien toepassing wordt gegeven aan [artikel 3.28, vierde lid, van de Wet ruimtelijke ordening][ref1] treden,
      in afwijking van dat artikellid, Onze Minister en Onze Minister van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer gezamenlijk in de plaats van burgemeester en wethouders ten aanzien van de bevoegdheden en
      verplichtingen, bedoeld in dat artikellid.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 9c.3
    text: |-
      Onze Minister kan, in overeenstemming met het gevoelen van de ministerraad, bepalen dat
      Onze Minister en Onze Minister wie het mede aangaat, met overeenkomstige toepassing van
      [artikel 3.35, derde lid, vierde volzin, van de Wet ruimtelijke ordening][ref1], één of meer besluiten nemen
      die nodig zijn voor de aanleg of uitbreiding van een daarbij aangewezen productie-installatie als bedoeld in
      [artikel 9b, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel9b
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 9b
        hoofdstuk: 2A
        paragraaf: '2'
  - number: 9d.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de besluiten aangewezen die voor de aanleg of uitbreiding
      van een productie-installatie als bedoeld in [artikel 9b, eerste lid][ref1], in ieder geval besluiten als bedoeld
      in [artikel 3.35, eerste lid, onderdeel b, van de Wet ruimtelijke ordening][ref2] zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel9b
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 9b
        hoofdstuk: 2A
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 9d.2
    text: |-
      Onze Minister kan ten behoeve van de aanleg of uitbreiding van een productie-installatie
      als bedoeld in [artikel 9b, eerste lid][ref1], tevens één of meer andere besluiten dan de
      bij of krachtens het eerste lid aangewezen besluiten aanwijzen als besluiten als bedoeld in
      [artikel 3.35, eerste lid, onderdeel b, van de Wet ruimtelijke ordening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel9b
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 9b
        hoofdstuk: 2A
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 9d.3
    text: |-
      Onze Minister kan, indien een bij of krachtens het eerste lid aangewezen besluit de toepassing van de procedure,
      bedoeld in [artikel 9b, eerste lid][ref1], zou belemmeren of ernstig bemoeilijken, bepalen dat het desbetreffende
      besluit, in afwijking van de in het eerste lid bedoelde algemene maatregel van bestuur, niet als een besluit als
      bedoeld in [artikel 3.35, eerste lid, onderdeel b, van de Wet ruimtelijke ordening][ref2] wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel9b
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 9b
        hoofdstuk: 2A
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 9e.1
    text: |-
      Provinciale staten zijn bevoegd voor de aanleg of uitbreiding van een productie-installatie voor opwekking
      van duurzame elektriciteit met behulp van windenergie met een capaciteit van ten minste 5 maar niet meer dan
      100 MW, met inbegrip van de aansluiting van die installatie op een net, gronden aan te wijzen en daarvoor een
      inpassingsplan als bedoeld in [artikel 3.26, eerste lid, van de Wet ruimtelijke ordening][ref1] vast te stellen. De
      gemeenteraad is voor de duur van tien jaren na de vaststelling van het inpassingsplan niet bevoegd voor die gronden
      een bestemmingsplan vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 9e.2
    text: |-
      Provinciale staten geven in ieder geval toepassing aan de bevoegdheid op grond van het eerste lid indien een
      producent een voornemen tot de aanleg of uitbreiding van een productie-installatie als bedoeld in het eerste lid
      schriftelijk bij hen heeft gemeld en de betrokken gemeente een aanvraag van die producent tot vaststelling dan wel
      wijziging van een bestemmingplan met betrekking tot de gronden, bedoeld in het eerste lid, heeft afgewezen. Voor
      het doen van de melding en de daarbij te verstrekken gegevens kunnen provinciale staten een formulier vaststellen.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9e
  - number: 9e.3
    text: |-
      [Artikel 3.26, tweede en derde lid, van de Wet ruimtelijke ordening][ref1] is van overeenkomstige toepassing.
      Artikel 3.26, vijfde lid, van de Wet ruimtelijke ordening is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 9e.4
    text: |-
      Gedeputeerde staten oefenen de bevoegdheden en voeren de verplichtingen, bedoeld in
      [artikel 3.6, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref1], uit en
      beslissen op een aanvraag om een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, b, c of g, van die wet][ref2]. Gedeputeerde staten zenden terstond een afschrift
      aan burgemeester en wethouders van beschikkingen die zijn gegeven met toepassing van de bevoegdheden, bedoeld in de
      eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 9e.5
    text: |-
      Provinciale staten kunnen, zo nodig in afwijking van het tweede lid, besluiten geen toepassing te geven aan het
      eerste lid indien:
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9e
  - number: 9e.5.a
    text: |-
      in aanmerking genomen de omvang, aard en ligging van een productie-installatie als bedoeld in het eerste lid,
      redelijkerwijs niet valt te verwachten dat toepassing van dit artikel de besluitvorming in betekenende mate zal
      versnellen of daaraan anderszins aanmerkelijke voordelen zijn verbonden; en
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9e
  - number: 9e.5.b
    text: is voldaan aan de voor die provincie gestelde minimum realisatienorm.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9e
  - number: 9e.6
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Minister wordt per provincie een minimum realisatienorm
      vastgesteld. De voordracht voor de algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het
      ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9e
  - number: 9f.1
    text: |-
      Gedeputeerde staten coördineren de voorbereiding en bekendmaking van de besluiten, aangewezen op grond van
      [artikel 9d, eerste lid][ref1], ten behoeve van de aanleg of uitbreiding van een productie-installatie als bedoeld
      in [artikel 9e, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel9d
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel9e
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9f
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 9d
        hoofdstuk: 2A
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 9e
        hoofdstuk: 2A
        paragraaf: '2'
  - number: 9f.2
    text: |-
      Gedeputeerde staten nemen de in het eerste lid bedoelde besluiten met uitsluiting van het in eerste aanleg bevoegde
      bestuursorgaan, tenzij dit een bestuursorgaan van het Rijk is.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9f
  - number: 9f.3
    text: |-
      Gedeputeerde staten geven ten aanzien van de ontwerpen van de besluiten, bedoeld in het eerste lid, gezamenlijk
      toepassing aan [artikel 3:11, eerste lid, van de Algemene wet bestuursrecht][ref1] en voegen de kennisgevingen,
      bedoeld in [artikel 3:12 van die wet][ref2], samen in een kennisgeving die door hen wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 9f.4
    text: |-
      Voor zover de aanleg of de uitbreiding, bedoeld in het eerste lid, onevenredig wordt belemmerd door bepalingen die
      – al dan niet krachtens de wet – bij of krachtens een regeling van een gemeente of waterschap zijn vastgesteld,
      kunnen die bepalingen bij het nemen of uitvoeren van de besluiten, bedoeld in het eerste lid, om dringende redenen
      buiten toepassing worden gelaten.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9f
  - number: 9f.5
    text: |-
      [Artikel 3.33, tweede en vierde tot en met zesde lid, van de Wet ruimtelijke ordening][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9f
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 9f.6
    text: |-
      Onze Minister kan op verzoek van gedeputeerde staten bepalen dat het eerste lid niet van toepassing is op een
      productie-installatie als bedoeld in [artikel 9e, eerste lid][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel9e
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9f
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 9e
        hoofdstuk: 2A
        paragraaf: '2'
  - number: 9f.6.a
    text: |-
      in aanmerking genomen de omvang, aard en ligging van de desbetreffende productie-installatie, redelijkerwijze
      niet valt te verwachten dat toepassing van het eerste lid de besluitvorming in betekenende mate zal versnellen of
      daaraan anderszins aanmerkelijke voordelen zijn verbonden, of
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9f
  - number: 9f.6.b
    text: |-
      gedeputeerde staten anders dan ter uitvoering van het eerste lid reeds voldoende bijdragen aan de realisatie van
      de doelstellingen van het Rijk met betrekking tot de opwekking op land van duurzame elektriciteit met behulp van
      windenergie.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9f
  - number: 9g
    text: |-
      De aanleg of uitbreiding van een productie-installatie als bedoeld in [artikel 9e, eerste lid][ref1], wordt
      voor de toepassing van de [Belemmeringenwet Privaatrecht][ref2] aangemerkt als openbaar werk van algemeen nut.
      [Artikel 3.36a, derde lid, van de Wet ruimtelijke ordening][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel9e
      [ref2]: https://wetten.overheid.nl/BWBR0001936
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel9g
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 9e
        hoofdstuk: 2A
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001936
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
  - number: '10.1'
    text: |-
      Het landelijk hoogspanningsnet omvat de netten die bestemd zijn voor transport van elektriciteit op een
      spanningsniveau van 110 kV of hoger en die als zodanig worden bedreven, alsmede het landsgrensoverschrijdende net
      op een spanningsniveau van 500 V of hoger.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel10
  - number: '10.2'
    text: |-
      De rechtspersoon die een recht van gebruik heeft van meer dan de helft van de totale circuitlengte van het
      landelijk hoogspanningsnet, voor zover dat een spanningsniveau van 220 kV of hoger betreft, wijst, na overleg met
      de andere rechtspersonen die een recht van gebruik hebben van dat net, voor het beheer van dat net een naamloze of
      besloten vennootschap als netbeheerder aan.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel10
  - number: '10.3'
    text: |-
      Degene aan wie een ander net toebehoort dan het landelijk hoogspanningsnet, wijst voor het beheer van dat net een
      of meer naamloze of besloten vennootschappen als netbeheerder aan.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel10
  - number: '10.4'
    text: |-
      Een aanwijzing als bedoeld in het tweede of derde lid geldt voor een periode van tien jaar, te rekenen vanaf de dag
      waarop Onze Minister heeft ingestemd met de aanwijzing op grond van [artikel 12, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel12
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 10a.1
    text: |-
      De netbeheerder, met uitzondering van de netbeheerder van het landelijk hoogspanningsnet, beschikt over de
      economische eigendom van het door hem beheerde net.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel10a
  - number: 10a.2
    text: |-
      Bij gelegenheid van een aanwijzing als bedoeld in [artikel 10, derde lid][ref1], vindt voor zover nodig overdracht
      van de economische eigendom aan de aangewezen netbeheerder plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 10a.3
    text: |-
      De overdracht geschiedt tegen verrichting van een tegenprestatie waarvan de waarde ten hoogste de opbrengst
      vertegenwoordigt van de exploitatie van het net, zoals deze op basis van algemene bedrijfseconomische
      uitgangspunten kan worden afgeleid van de door de raad van bestuur van de mededingingsautoriteit in de daaraan
      voorafgaande periode van vijf jaar vastgestelde tarieven met betrekking tot het netbeheer. Deze tegenprestatie kan
      zowel bestaan uit een periodieke uitkering als uit een contant bedrag ineens.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel10a
  - number: 10b.1
    text: |-
      Een netbeheerder maakt geen deel uit van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waartoe ook een rechtspersoon of vennootschap behoort die
      in Nederland elektriciteit produceert of levert of daarin handelt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 10b.2
    text: |-
      Rechtspersonen en vennootschappen die deel uitmaken van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waartoe ook een rechtspersoon of vennootschap behoort die
      in Nederland elektriciteit produceert of levert of daarin handelt, houden geen aandelen in een netbeheerder of in
      een rechtspersoon die deel uitmaakt van een groep waartoe ook een netbeheerder behoort en nemen niet deel in een
      vennootschap die deel uitmaakt van een groep waartoe ook een netbeheerder behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 10b.3
    text: |-
      Een netbeheerder en met de netbeheerder verbonden groepsmaatschappijen als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 10b.3.a
    text: |-
      houden geen aandelen in een rechtspersoon die in Nederland elektriciteit produceert of levert of daarin handelt
      of in een rechtspersoon die deel uitmaakt van een groep waartoe ook een rechtspersoon behoort die in Nederland
      elektriciteit produceert of levert of daarin handelt;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel10b
  - number: 10b.3.b
    text: |-
      nemen niet deel in een vennootschap die in Nederland elektriciteit produceert of levert of daarin handelt of in een
      vennootschap die deel uitmaakt van een groep waartoe ook een rechtspersoon of vennootschap behoort die in Nederland
      elektriciteit produceert of levert of daarin handelt.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel10b
  - number: '11.1'
    text: Een producent, leverancier of handelaar wordt niet aangewezen als netbeheerder.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel11
  - number: '11.2'
    text: |-
      De statuten van de netbeheerder, niet zijnde de netbeheerder van het landelijk hoogspanningsnet, bevatten in ieder
      geval:
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel11
  - number: 11.2.a
    text: de instelling van een raad van commissarissen;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel11
  - number: 11.2.b
    text: |-
      de bepaling dat de leden van het bestuur en de meerderheid van de leden van de raad van commissarissen direct noch
      indirect binding hebben met een producent, een leverancier, een handelaar of een handelaar;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel11
  - number: 11.2.c
    text: |-
      in afwijking van [artikel 129, derde lid][ref1], of
      [artikel 239, derde lid, van Boek 2 van het Burgerlijk Wetboek][ref2], de bepaling dat aan de goedkeuring van de
      raad van commissarissen ten minste zijn onderworpen de besluiten van het bestuur van de rechtspersoon, bedoeld in
      [artikel 164, eerste lid][ref3], of [artikel 274, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel239
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel164
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel274
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '129'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '239'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '164'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '274'
  - number: '11.3'
    text: |-
      Indien een netbeheerder, niet zijnde de netbeheerder van het landelijk hoogspanningsnet, een afhankelijke
      maatschappij is in de zin van [artikel 152][ref1] of [artikel 262 van Boek 2 van het Burgerlijk Wetboek][ref2],
      behoeven de statuten van die netbeheerder, in afwijking van het tweede lid, onderdeel a, niet te voorzien in de
      instelling van een raad van commissarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel152
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel262
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '152'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '262'
  - number: '11.4'
    text: 'In het in het derde lid bedoelde geval:'
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel11
  - number: 11.4.a
    text: |-
      voldoet een rechtspersoon waarvan de netbeheerder een afhankelijke maatschappij is aan de in het tweede lid, aanhef
      en onderdelen a en b, genoemde eisen;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel11
  - number: 11.4.b
    text: |-
      beschikt de raad van commissarissen van de rechtspersoon, bedoeld in onderdeel a, waarvan de netbeheerder een
      afhankelijke maatschappij is over de bevoegdheden, bedoeld in het tweede lid, onderdeel c, ten aanzien van het
      bestuur van de netbeheerder.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel11
  - number: 11a.1
    text: |-
      De [artikelen 158 tot en met 164][ref1] dan wel [268 tot en met 274 van Boek 2 van het Burgerlijk Wetboek][ref2]
      zijn van toepassing op de vennootschap die is aangewezen voor het beheer van het landelijk hoogspanningsnet en haar
      statuten worden dienovereenkomstig ingericht.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel158
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel268
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '158'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '268'
  - number: 11a.2
    text: |-
      Het is aan de vennootschap die is aangewezen voor het beheer van het landelijk hoogspanningsnet niet toegestaan
      haar statuten te wijzigen dan nadat aan de wijziging door Onze Minister goedkeuring is verleend. Onze Minister
      weigert goedkeuring indien de statuten na de wijziging niet in overeenstemming zijn met dit artikel.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel11a
  - number: 11a.3
    text: |-
      De leden van het bestuur en de meerderheid van de leden van de raad van commissarissen van de vennootschap die
      is aangewezen voor het beheer van het landelijk hoogspanningsnet hebben direct noch indirect binding met een
      rechtspersoon die de productie, aankoop of levering van gas of elektriciteit verricht of met een aandeelhouder van
      die rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel11a
  - number: 11a.4
    text: |-
      Een lid van de raad van commissarissen van de vennootschap die is aangewezen voor het beheer van het landelijk
      hoogspanningsnet wordt niet benoemd dan nadat Onze Minister heeft ingestemd met het voornemen tot benoeming.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel11a
  - number: 11a.5
    text: |-
      Indien de vennootschap die is aangewezen voor het beheer van het landelijk hoogspanningsnet een afhankelijke
      maatschappij is in de zin van [artikel 152][ref1] of [artikel 262 van Boek 2 van het Burgerlijk Wetboek][ref2] is
      het eerste lid niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel152
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel262
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '152'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '262'
  - number: 11a.6
    text: 'In het in het vijfde lid bedoelde geval:'
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel11a
  - number: 11a.6.a
    text: |-
      voldoet een rechtspersoon waarvan de netbeheerder van het landelijk hoogspanningsnet een afhankelijke maatschappij
      is aan de in het eerste tot en met vierde lid genoemde eisen;
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel11a
  - number: 11a.6.b
    text: |-
      beschikt de raad van commissarissen van de rechtspersoon, bedoeld in onderdeel a, waarvan de netbeheerder van het
      landelijk hoogspanningsnet een afhankelijke maatschappij is over de bevoegdheden tot goedkeuring van de besluiten
      van het bestuur van de netbeheerder van het landelijk hoogspanningsnet, bedoeld in [artikel 164, eerste lid][ref1],
      of [artikel 274, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel164
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel274
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '164'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '274'
  - number: 11b.1
    text: |-
      Een netbeheerder die deel uitmaakt van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] stelt een reglement vast, waarin regels worden gesteld
      die beogen discriminatie bij de uitoefening van zijn taken en bevoegdheden op grond van deze wet te voorkomen.
      Het reglement bevat in ieder geval regels ten aanzien van het gedrag van werknemers die ertoe strekken dat
      discriminatie als bedoeld in de vorige volzin wordt voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 11b.2
    text: |-
      De netbeheerder draagt er zorg voor dat elke werknemer is gebonden aan het reglement en ziet er op toe dat het
      reglement nauwgezet wordt nageleefd.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel11b
  - number: 11b.3
    text: |-
      De netbeheerder stelt jaarlijks een verslag op over de wijze waarop uitvoering is gegeven aan het reglement,
      en welke maatregelen in dat kader zijn genomen. Hij zendt het verslag naar de raad van bestuur van de
      mededingingsautoriteit en draagt zorg voor publicatie ervan op een geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel11b
  - number: '12.1'
    text: |-
      De netbeheerder meldt aan Onze Minister onverwijld na zijn aanwijzing zijn naam en adres en de naam en het adres
      van zijn aandeelhouders en zendt aan Onze Minister een beschrijving van het net dat door hem zal worden beheerd.
      Ten minste eenmaal per jaar meldt hij aan Onze Minister iedere wijziging van de namen of adressen en zendt hij hem
      een beschrijving van de wijziging van het net dat door hem wordt beheerd.
    url: https://wetten.overheid.nl/BWBR0009755/2011-04-09#Artikel12
  - number: '12.2'
    text: |-
      De aanwijzing behoeft de instemming van Onze Minister. Onze Minister onthoudt zijn instemming of kan voorschriften
      verbinden aan de instemming, indien niet is voldaan aan de [artikelen 10a][ref1], [10b][ref2], [11][ref3],
      [11a][ref4] of [11b][ref5] of indien de aangewezen netbeheerder in onvoldoende mate in staat zal zijn aan een
      verplichting als bedoeld in de [artikelen 7][ref6], [16Aa][ref7], [18a][ref8] of [78][ref9] te voldoen, een taak
      als bedoeld in [artikel 16, eerste of tweede lid][ref10], of [16a][ref11], uit te voeren dan wel een verbod als
      bedoeld in [artikelen 17][ref12], [17a][ref13] of [18][ref14] na te leven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel11a
      [ref5]: https://wetten.overheid.nl/BWBR0009755#Artikel11b
