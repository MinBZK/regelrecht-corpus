  - number: 77i.2
    text: |-
      Bij de vaststelling van de hoogte van boete houdt de raad van bestuur van de mededingingsautoriteit in ieder geval
      rekening met de ernst en de duur van de overtreding.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77i
  - number: 77i.3
    text: |-
      De berekening van de netto-omzet, bedoeld in het eerste lid, geschiedt op de voet van
      [artikel 377, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel377
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77i
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '377'
  - number: 77j.1
    text: |-
      De raad van bestuur van de mededingingsautoriteit legt geen bestuurlijke boete op voor zover de overtreding niet
      aan de overtreder kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77j
  - number: 77j.2
    text: |-
      De bevoegdheid tot het opleggen van een bestuurlijke boete vervalt vijf jaren nadat de overtreding heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77j
  - number: 77j.3
    text: |-
      Indien tegen de bestuurlijke boete bezwaar wordt gemaakt of beroep wordt ingesteld, wordt de vervaltermijn
      opgeschort tot onherroepelijk op het bezwaar of beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77j
  - number: 77k.1
    text: |-
      Indien de raad van bestuur van de mededingingsautoriteit vaststelt dat een overtreding als bedoeld in
      [artikelen 77h][ref1] of [77i][ref2] is begaan, maakt hij daarvan een rapport op.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77h
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel77i
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77k
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 77h
        hoofdstuk: 5A
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 77i
        hoofdstuk: 5A
  - number: 77k.2
    text: 'Het rapport is gedagtekend en vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77k
  - number: 77k.2.a
    text: de naam van de overtreder,
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77k
  - number: 77k.2.b
    text: de overtreding alsmede het overtreden voorschrift, en
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77k
  - number: 77k.2.c
    text: zo nodig een aanduiding van de plaats waar en het tijdstip waarop de overtreding is geconstateerd.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77k
  - number: 77k.3
    text: De raad van bestuur van de mededingingsautoriteit zendt een afschrift van het rapport aan de overtreder.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77k
  - number: 77l.1
    text: |-
      Indien aan een handeling van de raad van bestuur van de mededingingsautoriteit redelijkerwijs de gevolgtrekking kan
      worden verbonden dat aan de overtreder een bestuurlijke boete zal worden opgelegd, is er geen verplichting meer van
      de zijde van die overtreder om ten behoeve van deze oplegging een verklaring omtrent de overtreding af te leggen.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77l
  - number: 77l.2
    text: De overtreder wordt hierop gewezen alvorens hem mondeling wordt gevraagd inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77l
  - number: 77m.1
    text: |-
      De raad van bestuur van de mededingingsautoriteit stelt de overtreder desgevraagd in de gelegenheid de gegevens
      waarop het voornemen tot het opleggen van een bestuurlijke boete berust, in te zien en daarvan afschriften te
      vervaardigen.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77m
  - number: 77m.2
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] wordt de overtreder steeds in de
      gelegenheid gesteld zijn zienswijze naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77m
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: 77m.3
    text: |-
      Indien blijkt dat de verdediging van de overtreder dit redelijkerwijs vergt, draagt de raad van bestuur van de
      mededingingsautoriteit er zoveel mogelijk zorg voor dat de in het eerste lid bedoelde gegevens aan de overtreder
      worden medegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77m
  - number: 77n.1
    text: |-
      De raad van bestuur van de mededingingsautoriteit beslist omtrent het opleggen van een last onder dwangsom of een
      bestuurlijke boete binnen dertien weken na de dagtekening van het rapport.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77n
  - number: 77n.2
    text: |-
      Mandaat tot het opleggen van een bestuurlijke boete wordt niet verleend aan degene die van de overtreding een
      rapport heeft opgemaakt.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77n
  - number: 77n.3
    text: 'In de beschikking tot oplegging van een last onder dwangsom of een bestuurlijke boete wordt in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77n
  - number: 77n.3.a
    text: 'indien een last onder dwangsom wordt opgelegd:'
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77n
  - number: 77n.3.a.1°
    text: de naam van de overtreder, en
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77n
  - number: 77n.3.a.2°
    text: de inhoud van de last en de termijn waarvoor deze geldt;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77n
  - number: 77n.3.b
    text: 'indien een bestuurlijke boete wordt opgelegd:'
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77n
  - number: 77n.3.b.1°
    text: de naam van de overtreder, en
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77n
  - number: 77n.3.b.2°
    text: het bedrag van de boete;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77n
  - number: 77n.3.c
    text: |-
      de overtreding ter zake waarvan de last of de bestuurlijke boete wordt opgelegd alsmede het overtreden wettelijk
      voorschrift.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77n
  - number: 77o.1
    text: |-
      Een beschikking als bedoeld in [artikel 77n][ref1] wordt, nadat zij bekend is gemaakt, ter inzage gelegd bij de
      raad van bestuur van de mededingingsautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77n
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77o
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 77n
        hoofdstuk: 5A
  - number: 77o.2
    text: Van de beschikking wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77o
  - number: 77p.1
    text: |-
      Een bestuurlijke boete wordt betaald binnen zes weken nadat de beschikking waarbij de boete is opgelegd, in werking
      is getreden.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77p
  - number: 77p.2
    text: |-
      De boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop de in het eerste lid genoemde
      termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77p
  - number: 77p.3
    text: |-
      Indien niet is betaald binnen de in het eerste lid genoemde termijn, wordt degene die de boete is verschuldigd
      schriftelijk bevolen binnen twee weken alsnog het bedrag van de boete, verhoogd met de krachtens het tweede lid
      verschuldigde rente en de kosten van de aanmaning, te betalen.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77p
  - number: 77q.1
    text: |-
      Bij gebreke van betaling binnen de in [artikel 77p, derde lid][ref1], bedoelde termijn van twee weken kan de raad
      van bestuur van de mededingingsautoriteit de verschuldigde boete, verhoogd met de op de aanmaning en invordering
      betrekking hebbende kosten, invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77p
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77q
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 77p
        hoofdstuk: 5A
  - number: 77q.2
    text: |-
      Het dwangbevel wordt op kosten van degene die de boete is verschuldigd bij deurwaardersexploit betekend en levert
      een executoriale titel op in de zin van [Boek 2 van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77q
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 77q.3
    text: Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de staat.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77q
  - number: 77q.4
    text: |-
      Het verzet schorst de tenuitvoerlegging. Op verzoek van de staat kan de rechter de schorsing van de
      tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel77q
  - number: '78.1'
    text: |-
      Onze Minister kan verlangen dat een producent, een leverancier, een handelaar, een netbeheerder, een
      elektriciteits- of gasbeurs of een afnemer hem inzage geeft in gegevens en bescheiden, onderscheidenlijk gegevens
      en inlichtingen verstrekt die hij nodig heeft voor de uitvoering van de hem in deze wet opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel78
  - number: '78.2'
    text: |-
      Degene aan wie een verzoek is gedaan inzage te geven in gegevens en bescheiden, onderscheidenlijk gegevens en
      inlichtingen te verstrekken, is verplicht binnen de door Onze Minister gestelde redelijke termijn alle medewerking
      te verlenen die deze redelijkerwijze kan vorderen bij de uitoefening van zijn bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel78
  - number: '78.3'
    text: |-
      Onze Minister gebruikt bescheiden, gegevens of inlichtingen over een producent, een leverancier, een handelaar,
      een netbeheerder, een elektriciteits- of gasbeurs of een afnemer, welke hij heeft verkregen in verband met enige
      werkzaamheid ten behoeve van de uitvoering van een van zijn taken op grond van deze wet, uitsluitend voor de
      toepassing van deze wet.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel78
  - number: '78.4'
    text: |-
      Indien Onze Minister op grond van [artikel 16, tweede lid, onderdeel f][ref1], de netbeheerder van het landelijk
      hoogspanningsnet opdraagt werkzaamheden te verrichten ter uitvoering van de taak, bedoeld in [artikel 4a][ref2],
      zijn het eerste tot en met het derde lid van overeenkomstige toepassing op die netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel4a
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 4a
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '79.1'
    text: |-
      Een netbeheerder of een vergunninghouder die bij de uitvoering van zijn taak de beschikking krijgt over gegevens
      waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, is verplicht tot geheimhouding van
      die gegevens, behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht, of uit zijn taak de
      noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel79
  - number: '79.2'
    text: |-
      Indien een netbeheerder gegevens over zijn bedrijfsvoering die commercieel voordeel kunnen opleveren ter
      beschikking stelt aan anderen, doet hij dit op niet-discriminatoire wijze.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel79
  - number: '80.1'
    text: |-
      Onze Minister zendt zo spoedig mogelijk na een juli 2006, en vervolgens telkens na vier jaar, aan de Staten-
      Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel80
  - number: '80.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de inhoud van het verslag. Het verslag bevat in
      ieder geval een evaluatie van de doeltreffendheid en de effecten van de wet met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel80
  - number: 80.2.a
    text: de voorzienings- en leveringszekerheid van elektriciteit;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel80
  - number: 80.2.b
    text: de marktordening en de marktwerking;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel80
  - number: 80.2.c
    text: |-
      mede gelet op de [Mededingingswet][ref1], het toezicht en de naleving.


      [ref1]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0008691
  - number: '80.3'
    text: De Nederlandse Mededingingsautoriteit is belast met de uitvoering van de evaluatie.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel80
  - number: '81'
    text: |-
      De voordracht voor een krachtens [artikel 29][ref1], [30][ref2], [84][ref3] of [85][ref4] vast te stellen algemene
      maatregel van bestuur en voor een wijziging van een krachtens [artikel 20][ref5] vast te stellen algemene maatregel
      van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel84
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel85
      [ref5]: https://wetten.overheid.nl/BWBR0009755#Artikel20
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '84'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0009755
        artikel: '85'
        hoofdstuk: '6'
        paragraaf: '5'
      - id: ref5
        bwb_id: BWBR0009755
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '82.1'
    text: |-
      Tegen een op grond van deze wet genomen besluit, met uitzondering van een besluit op grond van de
      [artikelen 77h][ref1] en [77i][ref2], kan een belanghebbende beroep instellen bij het College van beroep voor het
      bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77h
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel77i
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 77h
        hoofdstuk: 5A
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 77i
        hoofdstuk: 5A
  - number: '82.2'
    text: |-
      Indien beroep wordt ingesteld tegen een besluit op grond van de [artikelen 77h][ref1] en [77i][ref2] is, in
      afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref3], de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77h
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel77i
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 77h
        hoofdstuk: 5A
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 77i
        hoofdstuk: 5A
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '82.3'
    text: |-
      Voor zover een door de raad van bestuur van de mededingingsautoriteit genomen besluit, genomen op grond van de
      [artikelen 36][ref1], [37][ref2], [41][ref3] en [41c][ref4], aangemerkt wordt als algemeen verbindend voorschrift,
      kan een belanghebbende beroep instellen bij het College van beroep voor het bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel41c
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0009755
        artikel: 41c
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '82.4'
    text: |-
      Een representatieve organisatie van partijen op de elektriciteitsmarkt wordt geacht belanghebbende te zijn bij
      besluiten genomen op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel82
  - number: '83'
    text: |-
      Provinciale staten en de gemeenteraad zijn niet bevoegd het opwekken, het transporteren en het leveren van
      elektriciteit in het belang van de energievoorziening aan regels te binden.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel83
  - number: '84'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter uitvoering van een besluit op grond van het verdrag tot oprichting
      van de Europese Gemeenschap regels worden gesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel84
  - number: 84.a
    text: |-
      de tarieven en voorwaarden die netbeheerders berekenen onderscheidenlijk in acht nemen bij het uitvoeren van
      transport van elektriciteit met behulp van een landsgrensoverschrijdend net;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel84
  - number: 84.b
    text: |-
      de voorwaarden die door een netbeheerder of een leverancier in het belang van de veiligheid en de doelmatigheid
      worden gesteld voor het leveren van elektriciteit of voor het aansluiten van toestellen of installaties die
      elektriciteit verbruiken.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel84
  - number: '85.1'
    text: |-
      Overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen regels is een door Onze Minister vast te
      stellen vergoeding verschuldigd voor het verlenen van instemming als bedoeld in [artikel 12, tweede lid][ref1], van
      een aanwijzing als bedoeld in [artikel 13][ref2], van een ontheffing als bedoeld in [artikel 15, tweede lid][ref3],
      van een ontheffing als bedoeld in [artikel 86c][ref4], dan wel van een vergunning als bedoeld in
      [artikel 95d][ref5], welke vergoeding verschuldigd is voor ten hoogste de kosten van de bemoeiingen met betrekking
      tot de instemming, de aanwijzing, de ontheffing dan wel de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel86c
      [ref5]: https://wetten.overheid.nl/BWBR0009755#Artikel95d
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0009755
        artikel: 86c
        hoofdstuk: '6'
        paragraaf: '9'
      - id: ref5
        bwb_id: BWBR0009755
        artikel: 95d
        hoofdstuk: '8'
        paragraaf: 1a
  - number: '85.2'
    text: |-
      Overeenkomstig de regels, bedoeld in het eerste lid, kunnen aan netbeheerders en vergunninghouders tevens de
      kosten in rekening worden gebracht die gemaakt worden voor de uitvoering van de taken en de uitoefening van de
      bevoegdheden, bedoeld in de [artikelen 22][ref1] en [27 tot en met 43][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel27
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '85.3'
    text: |-
      Bij gebreke van betaling binnen de termijn, gesteld bij algemene maatregel van bestuur, kan Onze Minister
      het verschuldigde bedrag, verhoogd met de wettelijke rente en de op de aanmaning en invordering betrekking
      hebbende kosten, invorderen bij dwangbevel. Het dwangbevel wordt op kosten van degene die het bedrag
      is verschuldigd bij deurwaardersexploit betekend en levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '85.4'
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      staat. Het verzet schorst de tenuitvoerlegging. Op verzoek van de staat kan de rechter de schorsing van de
      tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel85
  - number: '86.1'
    text: |-
      Een producent of een leverancier voert een afzonderlijke boekhouding voor de productie van elektriciteit met
      behulp van zijn installaties onderscheidenlijk de levering van elektriciteit aan afnemers. Indien de producent
      of leverancier andere activiteiten verricht dan die welke verband houden met de productie of de levering van
      elektriciteit, voert hij daarvoor eveneens, al dan niet op geconsolideerde basis, een afzonderlijke boekhouding.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel86
  - number: '86.2'
    text: |-
      [Artikel 43, tweede tot en met zevende lid][ref1], is van overeenkomstige toepassing op de boekhouding en de
      jaarrekening van de producent of leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel43
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '86.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op leveranciers die anders dan bedrijfsmatig elektriciteit
      leveren.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel86
  - number: 86a.1
    text: Op overeenkomsten tot transport of levering van elektriciteit is Nederlands recht van toepassing.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel86a
  - number: 86a.2
    text: |-
      De Nederlandse rechter is bij uitsluiting bevoegd kennis te nemen van geschillen over overeenkomsten tot transport
      of levering van elektriciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel86a
  - number: 86a.3
    text: |-
      Een beding dat in strijd met het eerste of tweede lid in een overeenkomst tot het transport of de levering van
      elektriciteit is opgenomen, is nietig.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel86a
  - number: 86a.4
    text: |-
      Het eerste tot en met derde lid is niet van toepassing op een overeenkomst voor levering van elektriciteit die een
      leverancier of handelaar sluit met een persoon die beschikt over een aansluiting op een net met een totale maximale
      doorlaatwaarde van meer dan 3*80 A en een beschikbaar vermogen van ten minste 2 MVA per aansluiting.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel86a
  - number: 86a.5
    text: De toepasselijkheid van dit artikel wordt beperkt door dwingende bepalingen van internationaal recht.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel86a
  - number: 86b
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent het vaststellen of sprake is van een productie-installatie
      voor klimaatneutrale elektriciteit en of de meetinrichting geschikt is voor de meting van de klimaatneutrale
      elektriciteit die met een dergelijke productie-installatie wordt opgewekt en op het net wordt ingevoed.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel86b
  - number: 86c
    text: |-
      Onze Minister beslist op een verzoek om een ontheffing als bedoeld in artikel 7 van de Verordening. De raad van
      bestuur van de mededingingsautoriteit brengt advies aan Onze Minister uit over door hem te nemen besluiten als
      bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel86c
  - number: 86d
    text: |-
      Indien dat noodzakelijk is in het belang van een voldoende transparante en liquide markt voor vraag en aanbod
      van elektriciteit, transportcapaciteit of productiecapaciteit of in het belang van de daarmee verband houdende
      leveringszekerheid, zullen bij of krachtens algemene maatregel van bestuur regels worden gesteld over:
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel86d
  - number: 86d.a
    text: |-
      de wijze waarop of de voorwaarden waaronder producenten, handelaren, leveranciers of netbeheerders elektriciteit,
      transportcapaciteit of productiecapaciteit waarover zij beschikken, aanbieden;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel86d
  - number: 86d.b
    text: |-
      de informatie die producenten, handelaren, leveranciers of netbeheerders verstrekken met betrekking tot de vraag en
      aanbod van elektriciteit, transportcapaciteit of productiecapaciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel86d
  - number: 86e.1
    text: |-
      Onze Minister wijst een of meer rechtspersonen aan die tot taak hebben een beurs tot stand te brengen en in stand
      te houden. Onze Minister kan regels stellen in verband met de procedure voor aanwijzing van een beurs.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel86e
  - number: 86e.2
    text: |-
      Een rechtspersoon, bedoeld in het eerste lid, stelt een beursreglement op. Het beursreglement behoeft de
      goedkeuring van Onze Minister. Van het besluit tot goedkeuring wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel86e
  - number: 86e.3
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet is verplicht aan de rechtspersoon, bedoeld in het eerste lid,
      de gevraagde medewerking te verlenen, voor zover deze medewerking noodzakelijk is voor een goede uitvoering van de
      aan deze rechtspersoon opgelegde taak. Onze Minister kan nadere regels stellen over de door de netbeheerder van het
      landelijk hoogspanningsnet te verlenen medewerking.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel86e
  - number: 86e.4
    text: |-
      De rechtspersoon, bedoeld in het eerste lid, die bij de uitvoering van zijn taak de beschikking krijgt over
      gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, is verplicht tot
      geheimhouding van die gegevens, behoudens voor zover de artikelen van deze wet hem tot mededeling verplichten of
      uit zijn taak de noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel86e
  - number: 86e.5
    text: |-
      Producenten, leveranciers, handelaren, afnemers en aandeelhouders onthouden zich van elke bemoeiing met de
      uitvoering van de taak die is opgedragen aan de rechtspersoon, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel86e
  - number: '91'
    text: |-
      Na de inwerkingtreding van [artikel 103][ref1] berust het structuurschema elektriciteitsvoorziening,
      bedoeld in artikel 14 van de Elektriciteitswet 1989 en vastgesteld bij besluit van 1 februari 1994
      door Onze Minister en de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, alleen op
      [artikel 2a van de Wet op de Ruimtelijke Ordening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel2a
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '103'
        hoofdstuk: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: 2a
  - number: '93.1'
    text: |-
      Indien zich in de periode tussen 1 juli 1996 en de datum van de aanwijzing van de netbeheerder, bedoeld in
      [artikel 10][ref1], een wijziging heeft voorgedaan met betrekking tot de eigendom van het desbetreffende net
      of van de aandelen in een rechtspersoon aan wie het desbetreffende net toebehoort, is voor de aanwijzing van de
      netbeheerder vereist dat Onze Minister geen bedenkingen heeft tegen die wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '93.2'
    text: |-
      Iedere wijziging met betrekking tot de eigendom van een net of van de aandelen in een netbeheerder behoeft de
      instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel93
  - number: '93.3'
    text: |-
      Onze Minister kan zijn instemming onthouden, indien de wijziging met betrekking tot de eigendom van een net of
      van de aandelen in de netbeheerder ertoe zou leiden dat een natuurlijke persoon of rechtspersoon buiten de kring
      van hen aan wie aandelen in een netbeheerder toebehoren, rechten op een net of op aandelen in de netbeheerder zou
      krijgen.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel93
  - number: '93.4'
    text: |-
      Onze Minister onthoudt zijn instemming indien de wijziging met betrekking tot de eigendom van een net of de
      aandelen in een netbeheerder ertoe zou leiden dat een natuurlijke persoon of een rechtspersoon buiten de kring
      van hen aan wie aandelen in een netbeheerder toebehoren, rechten op een net of op aandelen in een netbeheerder zou
      krijgen. Bij ministeriële regeling kan een datum worden bepaald tot welke Onze Minister zijn instemming onthoudt.
      Deze ministeriële regeling wordt niet vastgesteld dan nadat Onze Minister daarover overleg met de Tweede Kamer der
      Staten-Generaal heeft gevoerd.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel93
  - number: '93.5'
    text: |-
      Indien Onze Minister zijn instemming onthoudt en de voorgenomen wijziging met betrekking tot de eigendom van een
      net of van de aandelen voortgang vindt, kan Onze Minister een andere rechtspersoon aanwijzen als netbeheerder van
      het net dat door de desbetreffende netbeheerder wordt beheerd.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel93
  - number: '93.6'
    text: |-
      De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing
      op het verlenen van instemming met de wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 93a
    text: De aandelen van de netbeheerder van het landelijk hoogspanningsnet berusten direct of indirect bij de staat.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel93a
  - number: 93b.1
    text: |-
      Een net waarvoor een netbeheerder als bedoeld in [artikel 10, derde lid][ref1], is aangewezen wordt niet
      beschikbaar gesteld als zekerheid voor het aantrekken van financiële middelen, behoudens voorzover dit geschiedt
      ten behoeve van het netbeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel93b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 93b.2
    text: |-
      Er worden ten behoeve van derden geen rechten gevestigd op basis van de toekomstige inkomsten uit een net waarvoor
      een netbeheerder is aangewezen, behoudens voorzover dit geschiedt ten behoeve van het netbeheer.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel93b
  - number: '94'
    text: |-
      Een meter die eigendom is van een producent of een leverancier en die voor het tijdstip van inwerkingtreding van
      [artikel 10][ref1] is geplaatst bij een afnemer, wordt vanaf dat tijdstip beheerd door de netbeheerder die het
      transport van elektriciteit voor deze afnemer uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 95a.1
    text: |-
      Het is verboden zonder vergunning elektriciteit te leveren aan afnemers die beschikken over een aansluiting op een
      net met een totale maximale doorlaatwaarde van ten hoogste 3*80 A.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95a
  - number: 95a.2
    text: 'Het verbod geldt niet ten aanzien van het leveren van elektriciteit:'
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95a
  - number: 95a.2.a
    text: |-
      indien de elektriciteit is opgewekt met een installatie die voor rekening en risico van de afnemer, alleen of, voor
      een evenredig deel, tezamen met andere afnemers, in werking wordt gehouden en de afnemer de geleverde elektriciteit
      verbruikt;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95a
  - number: 95a.2.b
    text: |-
      door een buiten Nederland gevestigde leverancier van elektriciteit aan ten hoogste 500 afnemers, bedoeld in het
      eerste lid, die wonen in gebieden aan de Nederlandse landsgrens;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95a
  - number: 95a.2.c
    text: |-
      indien de afnemer aan dezelfde rechtspersoon toebehoort als de producent die de elektriciteit heeft opgewekt dan
      wel een dochtermaatschappij daarvan in de zin van [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref1] en de
      afnemer de geleverde elektriciteit verbruikt, of


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24a
  - number: 95a.2.d
    text: |-
      indien de elektriciteit anders dan bedrijfsmatig wordt geleverd overeenkomstig bij ministeriële regeling te stellen
      regels;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95a
  - number: 95a.2.e
    text: |-
      indien de elektriciteit wordt geleverd in het kader van een overeenkomst als bedoeld in [artikel 95n][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95n
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95n
        hoofdstuk: '8'
        paragraaf: 1c
  - number: 95b.1
    text: |-
      Een houder van een vergunning heeft de plicht op een betrouwbare wijze en tegen redelijke tarieven en voorwaarden
      zorg te dragen voor de levering van elektriciteit aan iedere in [artikel 95a, eerste lid][ref1], bedoelde afnemer
      die daarom verzoekt. De voorwaarden zijn in ieder geval niet redelijk als zij niet in overeenstemming zijn met het
      bepaalde bij of krachtens [artikel 95m][ref2]. [Artikel 26a, vijfde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95m
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel26a
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95m
        hoofdstuk: '8'
        paragraaf: 1c
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 26a
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 95b.2
    text: |-
      Een houder van een vergunning verschaft de raad van bestuur van de mededingingsautoriteit ieder jaar en vier weken
      voor de wijziging van de tarieven een opgave van de tarieven die hij berekent en de voorwaarden die hij gebruikt
      bij de levering van elektriciteit aan de in [artikel 95a, eerste lid][ref1], bedoelde afnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95b.3
    text: |-
      Indien de raad van bestuur van de mededingingsautoriteit van oordeel is dat de tarieven die houders van een
      vergunning berekenen onredelijk zijn, omdat daarin de effecten van een doelmatige bedrijfsvoering, die mede inhoudt
      de inkoop van elektriciteit en van energiebronnen bestemd voor opwekking daarvan, in onvoldoende mate leiden tot
      kostenverlaging, kan hij een tarief vaststellen dat leveranciers ten hoogste mogen berekenen voor de levering van
      elektriciteit aan afnemers als bedoeld in [artikel 95a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95b.4
    text: |-
      Na de vaststelling van het maximumtarief, bedoeld in het derde lid, worden de tarieven voor de levering van
      elektriciteit aan afnemers als bedoeld in [artikel 95a, eerste lid][ref1] die hoger zijn dan dat maximumtarief, van
      rechtswege gesteld op dat maximumtarief.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95b.5
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de bepaling of de
      tarieven, bedoeld in het tweede lid, onredelijk zijn en tot vaststelling van het maximumtarief, bedoeld in het
      derde lid. De voordracht voor een krachtens dit lid vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95b
  - number: 95b.6
    text: |-
      Het tweede tot en met het zesde lid vervallen op een bij koninklijk besluit te bepalen tijdstip. De voordracht voor
      een krachtens dit lid vast te stellen koninklijk besluit wordt niet eerder gedaan dan vier weken nadat het ontwerp
      aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95b
  - number: 95b.7
    text: |-
      Een netbeheerder en een vergunninghouder voeren een beleid, gericht op het voorkomen van het afsluiten van een
      afnemer als bedoeld in [artikel 95a, eerste lid][ref1], in de periode van 1 oktober tot 1 april van enig jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95b.8
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het beëindigen van de levering van elektriciteit aan
      een afnemer als bedoeld in [artikel 95a, eerste lid][ref1], in de periode van 1 oktober tot 1 april van enig jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95c.1
    text: |-
      Bepalingen die zijn opgenomen in overeenkomsten inzake levering van elektriciteit aan afnemers die beschikken over
      een aansluiting op het net met een totale maximale doorlaatwaarde van ten hoogste 3*80A en die tot doel hebben de
      opwekking van duurzame elektriciteit te verbieden zijn onverbindend.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95c
  - number: 95c.2
    text: |-
      Een houder van een vergunning is verplicht een aanbod van een afnemer als bedoeld in het eerste lid tot
      teruglevering van door hem geproduceerde duurzame elektriciteit te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95c
  - number: 95c.3
    text: |-
      Een houder van een vergunning betaalt de afnemer bedoeld in het eerste lid een redelijke vergoeding voor door hem
      aan het net geleverde duurzame elektriciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95c
  - number: 95c.4
    text: |-
      Bij algemene maatregel van het bestuur kunnen nadere regels worden gesteld omtrent de door een houder van een
      vergunning te betalen redelijke vergoeding bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95c
  - number: 95d.1
    text: 'Onze Minister verleent op aanvraag een vergunning indien de aanvrager genoegzaam aantoont dat hij:'
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95d
  - number: 95d.1.a
    text: |-
      beschikt over de benodigde organisatorische, financiële en technische kwaliteiten voor een goede uitvoering van
      zijn taak;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95d
  - number: 95d.1.b
    text: redelijkerwijs in staat kan worden geacht de verplichtingen als opgenomen in dit hoofdstuk na te komen.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95d
  - number: 95d.2
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de inhoud van en de procedure
      voor aanvraag van een vergunning en de criteria, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95d
  - number: 95e.1
    text: Onze Minister kan voorschriften en beperkingen verbinden aan een vergunning.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95e
  - number: 95e.2
    text: Onze Minister kan de aan een vergunning verbonden voorschriften of beperkingen wijzigen.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95e
  - number: 95e.3
    text: |-
      Een vergunning kan slechts worden overgedragen aan een andere houder van een vergunning met toestemming van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95e
  - number: 95e.4
    text: |-
      [Artikel 95c][ref1] is van overeenkomstige toepassing ten aanzien van het verlenen van toestemming als bedoeld in
      het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95c
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95e
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95c
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95f.1
    text: 'Onze Minister kan een vergunning intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95f
  - number: 95f.1.a
    text: de houder van de vergunning dit verzoekt;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95f
  - number: 95f.1.b
    text: |-
      de houder van de vergunning in onvoldoende mate voldoet aan de verplichting, bedoeld in [artikel 95b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95b
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95f
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95b
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95f.1.c
    text: de houder van de vergunning de in de vergunning opgenomen voorschriften of opgelegde beperkingen niet nakomt;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95f
  - number: 95f.1.d
    text: |-
      de houder van de vergunning bij de aanvraag onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van
      juiste en volledige gegevens tot een andere beschikking op de aanvraag zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95f
  - number: 95f.1.e
    text: |-
      de houder van de vergunning naar het oordeel van Onze Minister om andere redenen niet langer in staat moet worden
      geacht de vergunde activiteit of in de vergunning opgenomen voorschriften na te komen;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95f
  - number: 95f.1.f
    text: |-
      de houder van de vergunning de voorschriften bij of krachtens de [artikelen 95k][ref1] en [95l][ref2] niet nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95k
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95l
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95f
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95k
        hoofdstuk: '8'
        paragraaf: 1b
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95l
        hoofdstuk: '8'
        paragraaf: 1b
  - number: 95f.2
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de tijdelijke
      voorzieningen en de procedure bij intrekking van een vergunning.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95f
  - number: 95i
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of krachtens deze paragraaf
      gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95i
  - number: 95j
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95j
  - number: 95j.a
    text: 'opwekkingsgegevens:'
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95j
  - number: 95j.a.1º
    text: |-
      het aandeel van elke energiebron in de totale brandstofmix die de leverancier in het voorafgaande jaar heeft
      gebruikt, en
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95j
  - number: 95j.a.2°
    text: |-
      de milieugevolgen, in termen van uitstoot van koolstofdioxide en van radioactief afval, als gevolg van
      elektriciteitsproductie met verschillende energiebronnen veroorzaakt door de totale brandstofmix die de leverancier
      in het voorafgaande jaar heeft gebruikt;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95j
  - number: 95j.a.3°
    text: |-
      verwijzingen naar beschikbare referentiebronnen, waar voor een ieder toegankelijke informatie beschikbaar is
      over de milieugevolgen, in termen van uitstoot van koolstofdioxide en van radioactief afval, als gevolg van
      elektriciteitsproductie met verschillende energiebronnen veroorzaakt door de totale brandstofmix die de leverancier
      in het voorafgaande jaar heeft gebruikt;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95j
  - number: 95j.b
    text: 'eindafnemers: afnemers aan wie uitsluitend voor eigen verbruik elektriciteit wordt geleverd.'
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95j
  - number: 95k.1
    text: 'De leverancier meldt:'
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95k
  - number: 95k.1.a
    text: |-
      op of bij de rekening en in het promotiemateriaal, uiterlijk drie maanden na 1 januari van elk kalenderjaar, de
      opwekkingsgegevens van de door hem in het voorgaande kalenderjaar aan zijn eindafnemers geleverde elektriciteit, of
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95k
  - number: 95k.1.b
    text: |-
      op of bij de rekening, de opwekkingsgegevens van door hem de in de periode waarop die rekening betrekking heeft aan
      zijn eindafnemers geleverde elektriciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95k
  - number: 95k.2
    text: |-
      Een producent of een handelaar meldt uiterlijk twee maanden na 1 januari van elk kalenderjaar, aan de leverancier
      de opwekkingsgegevens van de in het voorgaande kalenderjaar door hem geproduceerde of verhandelde elektriciteit.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95k
  - number: 95k.3
    text: |-
      De betrouwbaarheid van de opwekkingsgegevens van de elektriciteit waarvoor certificaten of garanties van oorsprong
      worden verstrekt, wordt door middel van die certificaten of garanties van oorsprong gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95k
  - number: 95k.4
    text: |-
      Indien de producent, handelaar of leverancier onderdeel uitmaakt van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1], worden tevens de opwekkingsgegevens van de groep
      als geheel vermeld op of bij de rekening aan de eindafnemer, alsmede op aan de eindafnemer geadresseerd
      promotiemateriaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95k
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 95k.5
    text: 'Onze Minister kan nadere regels stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95k
  - number: 95k.5.a
    text: |-
      de opwekkingsgegevens die de leverancier vermeldt op of bij de rekening aan de eindafnemer, en de wijze waarop deze
      gegevens worden weergegeven;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95k
  - number: 95k.5.b
    text: de wijze waarop de opwekkingsgegevens door de producent, handelaar en leverancier onderling worden doorgegeven;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95k
  - number: 95k.5.c
    text: |-
      de wijze waarop de opwekkingsgegevens van geïmporteerde en in Nederland verhandelde of geleverde elektriciteit
      worden vermeld;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95k
  - number: 95k.5.d
    text: de wijze waarop de betrouwbaarheid van de opwekkingsgegevens ten minste wordt gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95k
  - number: 95k.6
    text: Van de verplichtingen in dit artikel kan uitsluitend gemotiveerd worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95k
  - number: 95l.1
    text: |-
      In dit artikel wordt onder milieugevolgen ten minste verstaan: de uitstoot van koolstofdioxide en radioactief
      afval.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95l
  - number: 95l.2
    text: |-
      De leverancier geeft ten minste eenmaal per kalenderjaar aan zijn eindafnemers een keuze van energiebronnen die
      hij zal gebruiken, onder vermelding van de milieugevolgen die te verwachten zijn van elektriciteitsproductie met
      die energiebronnen.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95l
  - number: 95l.3
    text: Eindafnemers maken een keuze uit het aanbod van de leverancier en maken deze keuze bekend aan de leverancier.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95l
  - number: 95l.4
    text: |-
      Indien een eindafnemer binnen de door de leverancier gestelde termijn geen keuze maakt, levert de leverancier de
      door hem gekozen elektriciteit aan de eindafnemer.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95l
  - number: 95l.5
    text: |-
      Een producent of een handelaar geeft aan een leverancier een keuze van energiebronnen waaruit hij elektriciteit
      kan krijgen, onder vermelding van de milieugevolgen die te verwachten zijn van elektriciteitsproductie met die
      energiebronnen.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95l
  - number: 95l.6
    text: |-
      Een producent of handelaar meldt aan de leverancier het aandeel van elke energiebron waaruit de leverancier
      elektriciteit heeft gekregen en de milieugevolgen van de elektriciteitsproductie met die energiebronnen.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95l
  - number: 95l.7
    text: |-
      De leverancier meldt op of bij de rekening aan de eindafnemer het aandeel van elke energiebron die de leverancier
      heeft gebruikt voor levering aan die afnemer en de milieugevolgen van de elektriciteitsproductie met die
      energiebronnen.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95l
  - number: 95l.8
    text: 'Onze Minister kan nadere regels stellen met betrekking tot de wijze waarop:'
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95l
  - number: 95l.8.a
    text: |-
      de betrouwbaarheid van de informatie van een producent of handelaar aan de leverancier ten minste wordt
      gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95l
  - number: 95l.8.b
    text: de betrouwbaarheid van de informatie van de leverancier aan de eindafnemer ten minste wordt gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95l
  - number: 95l.9
    text: |-
      Dit artikel treedt in werking met ingang van 1 januari 2007, dan wel op een eerder, bij koninklijk besluit te
      bepalen datum.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95l
  - number: 95m.1
    text: |-
      Het is verboden oneerlijke en misleidende verkoopmethoden te hanteren voor de levering en het transport van
      elektriciteit aan afnemers als bedoeld in [artikel 95a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95m.2
    text: |-
      De voorwaarden, verbonden aan een leverings- of transportovereenkomst met een afnemer als bedoeld in
      [artikel 95a, eerste lid][ref1], zijn transparant, eerlijk en vooraf bekend. De voorwaarden worden in ieder geval
      voor het sluiten van de overeenkomst verstrekt en zijn gesteld in duidelijke en begrijpelijke taal.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95m.3
    text: |-
      Leveranciers en netbeheerders zorgen ervoor dat afnemers als bedoeld in [artikel 95a, eerste lid][ref1], te allen
      tijde transparante informatie kunnen verkrijgen over de geldende tarieven en voorwaarden voor levering en transport
      van elektriciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95m.4
    text: |-
      Het is verboden voor de houder van een vergunning om op zodanige wijze afnemers als bedoeld in
      [artikel 95a, eerste lid][ref1], te benaderen dat onduidelijkheid bestaat over het feit dat een contract is
      afgesloten, de duur van het contract, de voorwaarden voor verlenging en beëindiging van het contract, het bestaan
      van een recht op opzegging en de voorwaarden van opzegging.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95m.5
    text: Een contract, gesloten in strijd met het bepaalde bij of krachtens dit artikel is vernietigbaar.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.6
    text: 'Onder misleidende verkoopmethoden, bedoeld in het eerste lid, wordt in ieder geval verstaan:'
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.6.a
    text: beweren een gedragscode te hebben ondertekend wanneer dit niet het geval is;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.6.b
    text: |-
      een vertrouwens-, kwaliteits- of ander soortgelijk label aanbrengen zonder daarvoor de vereiste toestemming te
      hebben verkregen;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.6.c
    text: beweren dat een gedragscode door een publieke of andere instantie is erkend wanneer dit niet het geval is;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.6.d
    text: |-
      beweren dat de levering of het transport van elektriciteit door een openbare of particuliere instelling is
      aanbevolen, erkend of goedgekeurd terwijl zulks niet het geval is, of iets dergelijks beweren zonder dat aan de
      voorwaarde voor de aanbeveling, erkenning of goedkeuring word voldaan;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.6.e
    text: |-
      de levering en het transport van elektriciteit tegen een genoemde prijs aan te bieden zonder dat wordt aangegeven
      dat er een gegrond vermoeden bestaat dat de levering of het transport van elektriciteit niet tegen die prijs kan
      worden geleverd gedurende een periode en in hoeveelheden, die rekening houdend met het product, de omvang van de
      voor het product gevoerde reclame en de aangeboden prijs redelijk zijn;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.6.f
    text: |-
      de levering of het transport van elektriciteit tegen een genoemde prijs te koop aanbieden en vervolgens weigeren
      een bestelling op te nemen of het product binnen een redelijke termijn te leveren;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.6.g
    text: |-
      beloven dat de afnemer met wie de leverancier of netbeheerder voorafgaand aan de transactie heeft gecommuniceerd
      in een andere taal dan Nederlands, een klantendienst te verschaffen en deze dienst vervolgens enkel beschikbaar
      stellen in een andere taal zonder dit duidelijk aan de afnemer te laten weten alvorens deze zich tot de transactie
      verbindt;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.6.h
    text: |-
      wettelijke rechten van de afnemer voorstellen als een onderscheidend kenmerk van het aanbod van de leverancier
      of netbeheerder;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.6.i
    text: |-
      redactionele inhoud in de media, waarvoor de leverancier of netbeheerder heeft betaald, gebruiken om reclame te
      maken voor de levering of het transport van elektriciteit, zonder dat dit duidelijk uit de inhoud of uit duidelijk
      door de afnemer identificeerbare beelden of geluiden blijkt, zulks onverminderd het bepaalde in [richtlijn 89/552/
      EEG](31989L0552);
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.6.j
    text: |-
      een pyramidesysteem opzetten, beheren of promoten waarbij de afnemer tegen betaling kans maakt op een vergoeding
      die eerder voortkomt uit het aanbrengen van nieuwe afnemers in het systeem dan uit de levering of het transport
      van elektriciteit;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.6.k
    text: |-
      nalaten de in de bijlage bij de verordening betreffende verkoopsbevordering vermelde informatie te verstrekken,
      of bij de uitvoering van de voorschriften van deze bijlage onjuiste, onduidelijke of dubbelzinnige informatie te
      verstrekken;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.6.l
    text: beweren dat producten het winnen bij kansspelen kunnen vergemakkelijken;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.6.m
    text: |-
      materieel onjuiste informatie verstrekken over marktomstandigheden of de mogelijkheid het product te bemachtigen
      met de bedoeling de afnemer het product te doen aanschaffen tegen voorwaarden die minder gunstig zijn dan de
      normale marktvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.6.n
    text: |-
      in de context van een handelspraktijk beweren dat er een wedstrijd wordt georganiseerd of prijzen worden uitgeloofd
      zonder de aangekondigde prijzen of een redelijk alternatief daadwerkelijk toe te kennen;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.6.o
    text: |-
      een product als bij voorbeeld «gratis», «voor niets», «kosteloos» omschrijven als de afnemer iets anders moet
      betalen dan de onvermijdelijke kosten om in te gaan op het aanbod, en het product af te halen dan wel dit te laten
      bezorgen;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.6.p
    text: |-
      marketingmateriaal voorzien van een factuur of een soortgelijk document waarin om betaling wordt gevraagd, waardoor
      bij de afnemer de indruk wordt gewekt dat hij het aangeprezen product al heeft besteld terwijl dat niet het geval
      is.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.7
    text: 'Onder oneerlijke verkoopmethoden, bedoeld in het eerste lid, wordt in ieder geval verstaan:'
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.7.a
    text: de indruk wekken dat de afnemer het pand niet mag verlaten alvorens er een overeenkomst is opgesteld;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.7.b
    text: |-
      de afnemer thuis opzoeken en zijn verzoek om weg te gaan of niet meer terug te komen, negeren, behalve indien, en
      voor zover gerechtvaardigd volgens de geldende wet- en regelgeving wordt beoogd een contractuele verplichting te
      doen naleven;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.7.c
    text: |-
      hardnekkig en ongewenst aandringen per telefoon, fax, e-mail of andere afstandmedia behalve indien, er voor
      zover gerechtvaardigd volgens de geldende wet- en regelgeving, wordt beoogd een contractuele verplichting te doen
      naleven;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.7.d
    text: |-
      in reclame kinderen rechtstreeks oproepen hun ouders of andere volwassenen ertoe over te halen producten, waarvoor
      reclame wordt gemaakt, voor hen te kopen;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.7.e
    text: |-
      vragen om onmiddellijke dan wel uitgestelde betaling voor producten die de leverancier of netbeheerder heeft
      geleverd, maar waar de afnemer niet om heeft gevraagd, tenzij het product een vervangingsgoed is als bedoeld in
      artikel 7, derde lid, van [richtlijn 97/7/EG](31997L0007) betreffende op afstand gesloten overeenkomsten (niet-
      gevraagde leveringen);
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.7.f
    text: |-
      de afnemer uitdrukkelijk meedelen dat, als hij het product of de dienst niet koopt, de baan of de bestaansmiddelen
      van de leverancier of netbeheerder in het gedrang komen;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.7.g
    text: |-
      de indruk wekken dat de afnemer al een prijs heeft gewonnen zonder een aankoop te verrichten, als de prijs in feite
      pas bij transport of levering van elektriciteit kan worden gewonnen of toegekend.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.8
    text: |-
      Een leverancier biedt een afnemer als bedoeld in [artikel 95a, eerste lid][ref1], ten minste een overeenkomst voor
      de levering van elektriciteit voor een onbepaalde duur aan.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95m.9
    text: |-
      Indien de afnemer als bedoeld in [artikel 95a, eerste lid][ref1], geen uitdrukkelijke keuze maakt voor een
      overeenkomst voor bepaalde duur, wordt hij geacht gekozen te hebben voor een overeenkomst voor onbepaalde duur.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95m.10
    text: |-
      Een afnemer als bedoeld in [artikel 95a, eerste lid][ref1], kan elke overeenkomst tot levering van elektriciteit
      beëindigen met inachtneming van een termijn van dertig dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95m.11
    text: |-
      Indien sprake is van een overeenkomst voor bepaalde duur, kan de leverancier in deze overeenkomst opnemen dat bij
      tussentijdse beëindiging van de overeenkomst de afnemer een redelijke vergoeding is verschuldigd. Indien sprake is
      van een overeenkomst voor onbepaalde duur, kan een dergelijke vergoeding niet in de overeenkomst worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
  - number: 95m.12
    text: |-
      Bij ministeriële regeling worden ter implementatie van de richtlijn nadere regels gesteld over bescherming van
      afnemers als bedoeld in [artikel 95a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95m
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: 95n.1
    text: |-
      Van de [artikelen 95b][ref1] en [95m, tweede, derde en achtste tot en met twaalfde lid][ref2], kan worden afgeweken
      indien er sprake is van een overeenkomst tot levering van elektriciteit aan een groep afnemers, waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95b
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95m
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95n
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95b
        hoofdstuk: '8'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95m
        hoofdstuk: '8'
        paragraaf: 1c
  - number: 95n.1.a
    text: de meerderheid van deze afnemers rechtspersoon is of handelt in de uitoefening van een beroep of bedrijf;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95n
  - number: 95n.1.b
    text: alle afnemers in de overeenkomst vertegenwoordigd worden, en
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95n
  - number: 95n.1.c
    text: |-
      deze vertegenwoordiger er zorg voor draagt dat hij ten aanzien van alle aansluitingen met een doorlaatwaarde van
      ten hoogste 3 * 80 A over toestemming tot vertegenwoordiging in het kader van de overeenkomst beschikt.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel95n
  - number: '103.2'
    text: De Elektriciteitswet 1989 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel103
  - number: '104.1'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel104
  - number: '104.2'
    text: |-
      [Artikel 89][ref1] treedt in werking op een bij koninklijk besluit te bepalen tijdstip en werkt terug tot en met 1
      januari 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel89
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '89'
        hoofdstuk: '7'
  - number: '104.3'
    text: |-
      Paragraaf 8.1a treedt in werking met ingang van de datum waarop [hoofdstuk 4][ref1] vervalt, dan wel op een eerder,
      bij koninklijk besluit te bepalen datum.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0009755
        hoofdstuk: '4'
  - number: '105'
    text: |-
      Deze wet wordt aangehaald als: Elektriciteitswet met vermelding van het jaartal van het Staatsblad waarin zij zal
      worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel105
