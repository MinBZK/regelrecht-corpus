      systeemdiensten: de diensten die de netbeheerder van het landelijk hoogspanningsnet uitvoert om het transport van
      elektriciteit over alle netten op een veilige en doelmatige wijze te waarborgen, om grootschalige onderbrekingen
      van het transport van elektriciteit op te lossen, en om de energiebalans op alle netten te handhaven of te
      herstellen;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel1
  - number: 1.1.q
    text: |-
      black-start-voorziening: de voorziening die benodigd is om bij een spanningsloos net de eigen energievoorziening
      van een productielocatie onder spanning te brengen, waarna de productie van elektriciteit kan worden hervat;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel1
  - number: 1.1.r
    text: |-
      verwant bedrijf: een verbonden onderneming in de zin van artikel 41 van de zevende [richtlijn nr. 83/349/EEG]
      (31983L0349) van de Raad van 13 juni 1983 op de grondslag van artikel 44, tweede lid, onderdeel g, van het Verdrag
      betreffende de geconsolideerde jaarrekening, of een geassocieerde onderneming in de zin van artikel 33, eerste lid,
      daarvan of een onderneming die aan dezelfde aandeelhouders toebehoort;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel1
  - number: 1.1.s
    text: |-
      biomassa: de biologisch afbreekbare fractie van producten, afvalstoffen en residuen van de landbouw – met
      inbegrip van plantaardige en dierlijke stoffen –, de bosbouw en aanverwante bedrijfstakken, alsmede de biologisch
      afbreekbare fractie van industrieel en huishoudelijk afval;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel1
  - number: 1.1.t
    text: |-
      hernieuwbare energiebronnen: wind, zonne-energie, aardwarmte, golfenergie, getijdenenergie, waterkracht, biomassa,
      stortgas, rioolwaterzuiveringsgas en biogas;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel1
  - number: 1.1.u
    text: |-
      duurzame elektriciteit: elektriciteit, opgewekt in productie-installaties die uitsluitend gebruikmaken van
      hernieuwbare energiebronnen, alsmede elektriciteit die is opgewekt met hernieuwbare energiebronnen in hybride
      productie-installaties die ook met conventionele energiebronnen werken, met inbegrip van elektriciteit die is
      opgewekt met hernieuwbare energiebronnen en die wordt gebruikt voor accumulatiesystemen, en met uitzondering van
      elektriciteit die afkomstig is van accumulatiesystemen;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel1
  - number: 1.1.v
    text: |-
      klimaatneutrale elektriciteit: elektriciteit, opgewekt in een productie-installatie waarin waterstof of
      elektriciteit wordt geproduceerd uit fossiele energiedragers, waarbij de koolstof of kooldioxide die vrijkomt bij
      het omzettingsproces, nuttig wordt toegepast of blijvend in de ondergrond wordt opgeslagen, en waarvoor een bij
      ministeriële regeling omschreven verklaring is verkregen;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel1
  - number: 1.1.w
    text: |-
      warmtekrachtkoppeling: de gecombineerde opwekking van warmte en elektriciteit of mechanische energie door
      verstoking van een brandstof, waarvan de warmte nuttig gebruikt wordt, anders dan voor de productie van
      elektriciteit;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel1
  - number: 1.1.x
    text: |-
      garantie van oorsprong: gegevens op een rekening die betrekking hebben op duurzame elektriciteit en waarmee wordt
      aangetoond dat een producent met zijn installatie een hoeveelheid duurzame elektriciteit heeft opgewekt;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel1
  - number: 1.1.y
    text: |-
      rekening: staat waarop een tegoed van garanties van oorsprong kan worden geboekt in het elektronische systeem voor
      het uitgeven en innemen van garanties van oorsprong dat in stand wordt gehouden door de garantiebeheerinstantie en
      waarmee wordt bijgehouden voor welke hoeveelheid duurzame elektriciteit garanties van oorsprong zijn verstrekt en
      aan wie de garanties van oorsprong op enig moment toekomen;
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel1
  - number: 1.1.z
    text: |-
      garantiebeheerinstantie: de op grond van [artikel 73, tweede lid][ref1], aangewezen instantie;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel73
    url: https://wetten.overheid.nl/BWBR0009755/2007-01-01#Artikel1
    references:
      - id: ref1
