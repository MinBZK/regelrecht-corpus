preamble:
  text: 'Besluit:'
  url: https://wetten.overheid.nl/BWBR0015857/2003-11-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. minister: Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. overlegorgaan: overlegorgaan, bedoeld in [artikel 3][ref1];

      c. nationaal park: gebied zoals omschreven in het Structuurschema Groene Ruimte (Kamerstukken II 1992/93, 22880,
      nr. 5, pagina 9).


      [ref1]: https://wetten.overheid.nl/BWBR0015857#Artikel3
    url: https://wetten.overheid.nl/BWBR0015857/2003-11-12#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015857
        artikel: '3'
  - number: '2'
    text: |-
      Als nationaal park wordt aangewezen het natuurgebied Lauwersmeer, zoals aangegeven op de kaart die als bijlage
      behoort bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0015857/2003-11-12#Artikel2
  - number: '3'
    text: Er is een overlegorgaan nationaal park Lauwersmeer.
    url: https://wetten.overheid.nl/BWBR0015857/2003-11-12#Artikel3
  - number: '4'
    text: |-
      Het overlegorgaan heeft tot taak zorg te dragen voor de inrichting, het beheer en functioneren van het nationaal
      park Lauwersmeer. Daartoe behoort onder meer:

      a. het actualiseren van het beheers- en inrichtingsplan, bedoeld in [artikel 5][ref1];

      b. de onderlinge afstemming van alle voor de inrichting en beheer van belang zijnde activiteiten;

      c. het doen van voorstellen aan de minister voor de besteding en toekenning van de voor het nationale park
      Lauwersmeer beschikbare middelen, onder meer in de vorm van een voortschrijdend meerjarenprogramma en een jaarlijks
      in te dienen bestedingenplan;

      d. de bevordering en coördinatie van voorlichting en educatie met betrekking tot het nationaal park Lauwersmeer.


      [ref1]: https://wetten.overheid.nl/BWBR0015857#Artikel5
    url: https://wetten.overheid.nl/BWBR0015857/2003-11-12#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0015857
        artikel: '5'
  - number: '5'
    text: |-
      Het overlegorgaan voert zijn taak uit overeenkomstig het beheers- en inrichtingsplan voor het nationaal park
      Lauwersmeer van 5 maart 2003 en met inachtneming van hetgeen te dien aanzien door de minister bij brief van
      8 augustus 2003, kenmerk DN/2003/3209, is gesteld.
    url: https://wetten.overheid.nl/BWBR0015857/2003-11-12#Artikel5
  - number: '6'
    text: |-
      In het overlegorgaan hebben zitting:

      a. een door de minister te benoemen lid, tevens voorzitter;

      b. door de minister te benoemen leden, als vertegenwoordiger en op voordracht van respectievelijk:

      1. de provincie Fryslân;

      2. de provincie Groningen;

      3. de gemeenten Dongeradeel, Kollumerland c.a., De Marne, Zuidhorn;

      4. de waterschappen Lauwerswâlden, Noorderzijlvest, De Waadkant, Friesland;

      5. het Staatsbosbeheer;

      6. het recreatieschap De Marrekrite;

      7. de NLTO;

      c. de directeur Noord van het Ministerie van Landbouw, Natuur en Voedselkwaliteit als vertegenwoordiger van de
      rijksoverheid.
    url: https://wetten.overheid.nl/BWBR0015857/2003-11-12#Artikel6
  - number: '7'
    text: |-
      1. Het secretariaat van het overlegorgaan berust bij een door de provincie Groningen te benoemen ambtenaar in
      dienst bij deze provincie.

      2. Het overlegorgaan regelt de openbaarheid en de plaats van zijn vergadering, alsmede de overige aspecten van zijn
      inrichting en werkwijze.

      3. Het overlegorgaan brengt jaarlijks van zijn werkzaamheden en de daarmee samenhangende ontwikkelingen in het
      nationale park Lauwersmeer verslag uit aan de minister.
    url: https://wetten.overheid.nl/BWBR0015857/2003-11-12#Artikel7
  - number: '8'
    text: |-
      Indien in het overlegorgaan belangrijke verschillen van inzicht blijken te bestaan, doet de voorzitter van het
      overlegorgaan daarvan mededeling aan de minister, die daarop de naar zijn oordeel nodige stappen onderneemt.
    url: https://wetten.overheid.nl/BWBR0015857/2003-11-12#Artikel8
  - number: '9'
    text: |-
      De [Regeling aanwijzing nationaal park in oprichting Lauwersmeer][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010405
    url: https://wetten.overheid.nl/BWBR0015857/2003-11-12#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0010405
  - number: '10'
    text: Dit besluit treedt in werking met ingang van 12 november 2003.
    url: https://wetten.overheid.nl/BWBR0015857/2003-11-12#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Besluit aanwijzing nationaal park Lauwersmeer.'
    url: https://wetten.overheid.nl/BWBR0015857/2003-11-12#Artikel11
