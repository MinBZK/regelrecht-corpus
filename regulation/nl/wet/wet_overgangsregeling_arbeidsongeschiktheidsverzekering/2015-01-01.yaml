  - number: '33'
    text: |-
      Indien [artikel 32][ref1] van toepassing is ten aanzien van een persoon, die recht had op meer dan één uitkering
      als bedoeld in artikel 16 van de Ongevallenwet 1921, artikel 37 van de Land- en Tuinbouwongevallenwet 1922 of
      artikel 2, eerste lid, onder *a,* van de Zeeongevallenwet 1919 op de dag, voorafgaande aan die, waarop genoemde
      wetten werden ingetrokken, geldt de garantie, vervat in [artikel 32][ref2], zolang geen van die uitkeringen in
      verband met verandering in de toestand als in dat artikel bedoeld, zou zijn verlaagd, indien genoemde wetten niet
      zouden zijn ingetrokken, tot de som van die uitkeringen en de in dat artikel bedoelde bijslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002551#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0002551#Artikel32
    url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#Artikel33
