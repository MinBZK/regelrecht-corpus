  - number: '62'
    text: |-
      Degene, die ter zake van vóór de dag, waarop [artikel 19 van de Wet][ref1] in werking treedt, ingetreden
      invaliditeit uitzicht zou hebben op een na het verstrijken van de wachttijd als bedoeld in artikel 71 van de
      Invaliditeitswet ingaand recht op bijslag als bedoeld in artikel 3 van de Interimwet invaliditeitsrentetrekkers,
      indien die wet niet zou zijn ingetrokken, wordt onverminderd het bepaalde bij of krachtens de
      [artikelen 53 tot en met 57][ref2], zolang hij niet verzekerd is ingevolge de [Wet][ref3] en geen recht op
      arbeidsongeschiktheidsuitkering heeft, voor de toepassing van het bepaalde in § 3 van hoofdstuk II van die wet
      geacht ingevolge die [wet][ref4] verzekerd te zijn bij het Uitvoeringsinstituut werknemersverzekeringen.


