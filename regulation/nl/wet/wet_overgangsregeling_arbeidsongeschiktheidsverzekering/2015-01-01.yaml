    text: |-
      1 Indien zowel [artikel 32][ref1], al dan niet in verbinding met [artikel 33][ref2], als [artikel 34][ref3], al
      dan niet in verbinding met [artikel 35][ref4], van toepassing zijn, gelden de garanties, vervat in die artikelen,
      met ingang van de dag, met ingang van welke genoemde artikelen gelijktijdig van toepassing zijn en zolang
      geen van de aldaar bedoelde uitkeringen in verband met verandering in de toestand als in [artikel 32][ref5]
      onderscheidenlijk [artikel 34][ref6] bedoeld zou zijn verlaagd, indien de Ongevallenwet 1921, de Land- en
      Tuinbouwongevallenwet 1922 of de Zeeongevallenwet 1919 niet zouden zijn ingetrokken, onderscheidenlijk indien
      [artikel 10, eerste of tweede lid][ref7], dan wel [artikel 6, vierde lid][ref8], [artikel 7, tweede lid][ref9],
      of [artikel 11, eerste lid, van de Liquidatiewet ongevallenwetten][ref10] niet van toepassing zou zijn geweest,
      tot de som van de in [artikel 32][ref11] bedoelde uitkering(en) en bijslagen en de in [artikel 34][ref12] bedoelde
      uitkering(en).

      2 Het bepaalde in de [artikelen 32][ref13], [33][ref14], [34][ref15] en [35][ref16] en in het eerste lid
      laat onverlet de bevoegdheid van het Uitvoeringsinstituut werknemersverzekeringen als omschreven in de
      [artikelen 25][ref17] en [28 van de Wet][ref18].


