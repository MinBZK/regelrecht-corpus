  - number: '63'
    text: |-
      1 Het bepaalde in de [artikelen 18, tweede lid][ref1], en [39, eerste lid, onder a, van de Wet][ref2] blijft buiten
      toepassing ten aanzien van degene, die een arbeidsongeschiktheidsuitkering ontleent aan deze wet.

      2 Het bepaalde in [artikel 30, eerste lid, onder b, van de Wet][ref3] blijft buiten toepassing ten aanzien van:

      a. degene, wiens arbeidsongeschiktheid is ingetreden binnen een half jaar na het in werking treden van
      [artikel 19 van de Wet][ref4], indien hij gedurende het halve jaar, onmiddellijk voorafgaande aan het intreden van
      die arbeidsongeschiktheid, onafgebroken krachtens de [Wet][ref5] verzekerd zou zijn geweest, indien de [Wet][ref6]
      toen reeds in werking zou zijn geweest;

      b. degene, die op grond van het bepaalde in [artikel 46][ref7] tot de vrijwillige verzekering is toegelaten.

      3 Het bepaalde in de [artikelen 90][ref8] en [91 van de Wet][ref9] blijft buiten toepassing ten aanzien
      van de uit de toepassing van de bepalingen van deze wet en haar uitvoeringsbesluiten voortvloeiende
      kosten. Onder vorenbedoelde kosten vallen niet de kosten, voortvloeiende uit een herziening van een
      arbeidsongeschiktheidsuitkering terzake van toeneming van de arbeidsongeschiktheid, indien de toeneming kennelijk
      is voortgekomen uit een andere oorzaak dan die, waaruit de ongeschiktheid terzake waarvan op grond van het bepaalde
      bij of krachtens deze wet een arbeidsongeschiktheidsuitkering werd toegekend, is voortgekomen.


