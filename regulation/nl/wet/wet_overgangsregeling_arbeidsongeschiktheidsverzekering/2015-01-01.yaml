        bwb_id: BWBR0002524
  - number: '23'
    text: |-
      1 Indien met ingang van de dag, waarop [artikel 19 van de Wet][ref1] in werking treedt, ingevolge het bepaalde
      in artikel 6, tweede of derde lid, van de Interimwet invaliditeitsrentetrekkers herziening van de in die leden
      bedoelde bedragen zou hebben plaatsgevonden, indien laatstgenoemde wet niet zou zijn ingetrokken, worden de
      overeenkomstig het bepaalde bij of krachtens de [artikelen 5, eerste en derde lid][ref2], [16][ref3], [17][ref4],
      [18][ref5] en [19][ref6] vastgestelde daglonen bij algemene maatregel van bestuur met ingang van vorenbedoelde
      dag herzien.

      2 Bij de in het vorige lid bedoelde herziening worden de overeenkomstig het bepaalde bij of krachtens de
      [artikelen 5, eerste en derde lid][ref7], [16][ref8], [17][ref9], [18][ref10] en [19][ref11] vastgestelde daglonen
      verhoogd of verlaagd met hetzelfde percentage als waarmede het indexcijfer der lonen op de laatste dag van de
      maand, voorafgaande aan die, waarin [artikel 19 van de Wet][ref12] in werking treedt, afwijkt van het indexcijfer,
      waarop de laatstelijk vastgestelde bedragen als bedoeld in artikel 5 van de Interimwet invaliditeitsrentetrekkers
      zijn gebaseerd.

      3 [Artikel 15, zesde, elfde en twaalfde lid, van de Wet][ref13] is van overeenkomstige toepassing.


