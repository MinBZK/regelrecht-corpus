  - number: '47'
    text: |-
      1 Voor de toepassing van het bepaalde in het [eerste lid, onder a, sub 1°, van het vorige artikel][ref1], blijven
      bij de berekening van de verzekeringsduur buiten aanmerking de weken, gedurende welke invaliditeitsrente krachtens
      de Invaliditeitswet is genoten.

      2 Voor de toepassing van het bepaalde in het [eerste lid, onder a, sub 2°, van het vorige artikel][ref2], worden,
      indien de geldigheidsduur van een rentekaart zich uitstrekt over een periode, gelegen zowel vóór als na 1 januari
      1962, de op die rentekaart vereffende premies geacht te zijn bestemd voor dat gedeelte van die geldigheidsduur, dat
      gelegen is na die datum, evenwel ten hoogste tot het aantal weken van dat gedeelte.


      [ref1]: https://wetten.overheid.nl/BWBR0002551#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0002551#Artikel46
    url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#Artikel47
