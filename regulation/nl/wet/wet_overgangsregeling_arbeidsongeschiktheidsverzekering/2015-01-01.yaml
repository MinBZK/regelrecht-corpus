    text: |-
      1 Indien het bepaalde bij of krachtens [artikel 46 van de Wet][ref1] toepassing vindt, wordt
      van de arbeidsongeschiktheidsuitkering, ontleend of mede ontleend aan [artikel 13][ref2],
      [14][ref3] of [15][ref4] van deze wet, onderscheidenlijk van de arbeidsongeschiktheidsuitkering
      van degene, ten aanzien van wie [artikel 6, vierde lid][ref5], [artikel 7, tweede lid][ref6], of
      [artikel 11, eerste lid, van de Liquidatiewet ongevallenwetten][ref7] toepassing vindt, indien de betrokkene op
      en sedert de dag, met ingang van welke de arbeidsongeschiktheidsuitkering is ingegaan, is opgenomen in een sociale
      werkvoorzieningsregeling als bedoeld in [artikel 46 van de Wet][ref8], de uitbetaling niet verder beperkt dan tot
      het bedrag, waarop hij krachtens het bepaalde bij [artikel 32][ref9], [33][ref10], [34][ref11], [35][ref12] of
      [36][ref13] aanspraak zou hebben, indien het bepaalde bij [artikel 46 van de Wet][ref14] niet van toepassing zou
      zijn.

      2 Het bepaalde bij [artikel 37][ref15] is mede van toepassing op het in het eerste lid gegarandeerde bedrag.


