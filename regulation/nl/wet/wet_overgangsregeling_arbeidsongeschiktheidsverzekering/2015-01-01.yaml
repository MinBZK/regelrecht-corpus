  - number: '10'
    text: |-
      1 Bij scheiding van tafel en bed, alsmede wanneer de echtgenoten duurzaam gescheiden leven,
      kan het Uitvoeringsinstituut werknemersverzekeringen de aan de uitkeringsgerechtigde toekomende
      arbeidsongeschiktheidsuitkering, welke is toegekend op grond of mede op grond van het bepaalde in
      [artikel 3][ref1], geheel of gedeeltelijk aan diens echtgenote onderscheidenlijk haar echtgenoot betaalbaar
      stellen.

      2 Het bepaalde in het vorige lid vindt overeenkomstige toepassing ten aanzien van de vakantie-uitkering als bedoeld
      in [hoofdstuk II, § 2a, van de Wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002551#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Paragraaf2a
