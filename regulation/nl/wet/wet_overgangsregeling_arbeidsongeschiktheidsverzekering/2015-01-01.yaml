  - number: '52'
    text: |-
      Ten aanzien van degene, die op grond van het bepaalde in [artikel 6, derde lid][ref1], of
      [artikel 7, derde lid, van de Liquidatiewet ongevallenwetten][ref2] geen recht heeft op de in het eerste lid
      van die artikelen bedoelde uitkering, uitsluitend omdat hij vrijwillig verzekerd is ingevolge de [Wet][ref3],
      en die niet verzekerd is ingevolge de [Ziektewet][ref4], vindt ter zake van zijn ongeschiktheid als bedoeld in
      [artikel 6, eerste of tweede lid][ref5], of [artikel 7, eerste lid, van de Liquidatiewet ongevallenwetten][ref6],
      de wachtperiode van 52 weken arbeidsongeschiktheid, vermeld in [artikel 19, eerste lid, van de Wet][ref7], geen
      toepassing.


