  - number: '39'
    text: |-
      1 Indien het bepaalde bij of krachtens [artikel 46 van de Wet][ref1] toepassing vindt, wordt van de
      arbeidsongeschiktheidsuitkering, ontleend of mede ontleend aan [artikel 3][ref2], zolang de arbeidsongeschiktheid
      sedert de dag, waarop de arbeidsongeschiktheidsuitkering is ingegaan, ten minste 45% bedraagt en de
      betrokkene op en sedert die dag is opgenomen in een sociale werkvoorzieningsregeling als bedoeld in
      [artikel 46 van de Wet][ref3], de uitbetaling niet verder beperkt dan tot 1/260 van het jaarbedrag,
      waarop de betrokkene laatstelijk ingevolge het bepaalde bij of krachtens artikel 23 van de Interimwet
      invaliditeitsrentetrekkers aan bijslag en invaliditeitsrente tezamen aanspraak had.

      2 Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd om, zolang de belangen van de betrokkene daardoor
      niet worden geschaad, indeling in een der in [artikel 21 van de Wet][ref4] genoemde invaliditeitsklassen
      achterwege te laten ten aanzien van degene, die arbeidsongeschiktheidsuitkering ontleent aan [artikel 3][ref5]
      en die op en sedert de dag, waarop [artikel 19 van de Wet][ref6] in werking treedt, is opgenomen in een sociale
      werkvoorzieningsregeling als bedoeld in [artikel 46 van de Wet][ref7].

      3 Bij toepassing van het vorige lid wordt de arbeidsongeschiktheid van de betrokkene geacht 80% of meer te
      bedragen.

      4 Onze Minister kan met betrekking tot het bepaalde in dit artikel en in [artikel 41][ref8] nadere en, voor
      bijzondere gevallen, zo nodig afwijkende regelen stellen.


