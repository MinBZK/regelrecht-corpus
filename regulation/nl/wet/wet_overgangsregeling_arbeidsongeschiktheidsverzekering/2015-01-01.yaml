  - number: '31'
    text: |-
      Aan de arbeidsongeschiktheidsuitkering van degene, ten aanzien van wie [artikel 12, vierde lid][ref1], toepassing
      vindt, wordt met ingang van de dag, met ingang van welke dat lid toepassing vindt, ten grondslag gelegd het
      dagloon, dat ten grondslag zou zijn gelegd aan de arbeidsongeschiktheidsuitkering, waarop hij recht zou hebben
      gehad, indien [artikel 12, eerste lid][ref2], op hem van toepassing zou zijn geweest, doch slechts indien
      laatstbedoeld dagloon hoger is dan het dagloon, dat laatstelijk aan eerstbedoelde uitkering ten grondslag werd
      gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002551#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002551#Artikel12
    url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#Artikel31
