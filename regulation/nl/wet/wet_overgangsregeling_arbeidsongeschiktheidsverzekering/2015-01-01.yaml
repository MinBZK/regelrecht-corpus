  - number: '16'
    text: |-
      1 Bij toekenning van een arbeidsongeschiktheidsuitkering op grond van het bepaalde in [artikel 13][ref1] wordt
      daaraan ten grondslag gelegd een dagloon ter hoogte van 6/5 maal het dagloon, waarnaar de in [artikel 13][ref2]
      bedoelde uitkering was berekend.

      2 Bij toekenning van een arbeidsongeschiktheidsuitkering op grond van het bepaalde in [artikel 14][ref3] of
      [15][ref4], dan wel terwijl [artikel 11, eerste lid, van de Liquidatiewet ongevallenwetten][ref5] van toepassing
      is, wordt daaraan ten grondslag gelegd een dagloon ter hoogte van 6/5 maal het dagloon, dat aan de aan
      [artikel 4][ref6], [5][ref7], [6][ref8] of [7 van de Liquidatiewet ongevallenwetten][ref9] ontleende uitkering
      ingevolge die wet ten grondslag zou zijn gelegd zonder toepassing van [artikel 8, vijfde lid][ref10], van die wet.


