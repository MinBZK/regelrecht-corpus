  - number: '2'
    text: |-
      1 De beslissingen en verstrekkingen ingevolge deze wet worden voor de toepassing van wettelijke voorschriften
      geacht beslissingen en verstrekkingen te zijn ingevolge de [Wet][ref1].

      2 De bepalingen van de [Wet][ref2] en van de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], alsmede
      de uitvoeringsbesluiten van die wetten zijn met inachtneming van de wijzigingen, welke de aard van het onderwerp
      vordert, en voor zover deze wet en haar uitvoeringsbesluiten daarvan niet afwijken, van kracht ten aanzien van de
      in deze wet en haar uitvoeringsbesluiten vervatte regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0013060
