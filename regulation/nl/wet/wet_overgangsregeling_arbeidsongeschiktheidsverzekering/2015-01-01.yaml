  - number: '45'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen brengt degene, wiens opleiding op grond van het bepaalde bij
      artikel 25, eerste lid, of artikel 87c, derde lid, van de Ongevallenwet 1921, artikel 48, eerste lid, of artikel
      95c, derde lid, van de Land- en Tuinbouwongevallenwet 1922 dan wel artikel 5, eerste lid, van het Reglement der
      Zeeongevallenregeling als bedoeld in artikel 2 van de Statuten van de Vereeniging "Zee-Risico" en/of wiens toelage
      op grond van het bepaalde in artikel 25, tweede lid, of artikel 87c, eerste lid, van de Ongevallenwet 1921,
      dan wel artikel 48, derde lid, of artikel 95c, eerste lid, van de Land- en Tuinbouwongevallenwet 1922, dan wel
      artikel 5, tweede lid, van vorengenoemd Reglement zou zijn voortgezet, indien de Ongevallenwet 1921, de Land- en
      Tuinbouwongevallenwet 1922 en de Zeeongevallenwet 1919 niet zouden zijn ingetrokken, op de voet van het bepaalde in
      § 3 van hoofdstuk II van de Wet voor voortzetting van die opleiding en/of vergoeding in aanmerking.
    url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#Artikel45
  - number: '46'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen is verplicht tot de vrijwillige verzekering toe te laten, mits
      hij hier te lande woont:

      a. degene, wiens verzekering ingevolge de Invaliditeitswet is aangevangen vóór of op 1 januari 1962, mits hij op
      de dag, voorafgaande aan het in werking treden van [artikel 19 van de Wet][ref1], krachtens de Invaliditeitswet in
      rekening kan doen brengen:

      1°. een aantal weekpremies, dat ten minste tweederde bedraagt van het getal der weken, verstreken tussen de aanvang
      van zijn verzekering en 1 januari 1965 of

      2°. ten minste 150 weekpremies voor het tijdvak, gelegen tussen 1 januari 1962 en 1 januari 1965;

      b. degene, die op de dag, voorafgaande aan het in werking treden van [artikel 19 van de Wet][ref2], verzekerd
      is ingevolge de Invaliditeitswet en wiens verplichte verzekering ingevolge de [Wet][ref3] op of na 1 januari
      1965, doch vóór het in werking treden van genoemd artikel zou zijn geëindigd, indien de [Wet][ref4] toen
      reeds in werking was geweest, mits hij gedurende de drie jaren onmiddellijk voorafgaande aan de dag, waarop
      de verplichte verzekering zou zijn geëindigd, onafgebroken verzekerd of in verband met het bepaalde in
      [artikel 6, eerste lid, onder a of b, van de Wet][ref5] niet verzekerd zou zijn geweest ingevolge de [Wet][ref6],
      indien de [Wet][ref7] gedurende die termijn van drie jaren reeds in werking was geweest;

      c. degene, die als zelfstandige een bedrijf of beroep uitoefent of gaat uitoefenen en wiens verplichte
      verzekering ingevolge de [Wet][ref8] op of na 1 augustus 1964, doch vóór het in werking treden van
      [artikel 6, eerste lid, onder a of b, van de Wet][ref9] zou zijn geëindigd, indien de [Wet][ref10] toen
      reeds in werking was geweest, mits hij gedurende de drie jaren onmiddellijk voorafgaande aan de dag, waarop
      de verplichte verzekering zou zijn geëindigd, onafgebroken verzekerd of in verband met het bepaalde in
      [artikel 6, eerste lid, onder a of b, van de Wet][ref11] niet verzekerd zou zijn geweest ingevolge de [Wet][ref12],
      indien de [Wet][ref13] gedurende die termijn van drie jaren reeds in werking was geweest.

      2 De in het vorige lid bedoelde verplichting bestaat eveneens ten aanzien van degene, die buiten het Rijk woont
      en aldaar in dienstbetrekking staat tot een binnen het Rijk wonende of gevestigde werkgever, mits hij voldoet
      aan het bepaalde in het vorige lid, onder a, of zijn verplichte verzekering ingevolge de [Wet][ref14] op of na 1
      augustus 1964, doch vóór het in werking treding van [artikel 19 van de Wet][ref15] zou zijn geëindigd, indien de
      [Wet][ref16] toen reeds in werking was geweest.


