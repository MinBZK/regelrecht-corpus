  - number: '51'
    text: |-
      1 In afwijking van het bepaalde in het eerste lid van [artikel 82 van de Wet][ref1] wordt de in
      [artikel 81, eerste lid, onder c en d, van de Wet][ref2] genoemde termijn van drie jaren, voor zover gelegen vóór
      het in werking treden van [artikel 19 van de Wet][ref3], geacht niet te zijn onderbroken:

      a. indien de betrokkene, zo de [Wet][ref4] toen reeds in werking zou zijn geweest, niet verzekerd zou zijn geweest
      gedurende niet meer dan zestig dagen, verminderd met het aantal dagen, gedurende welke hij na het in werking treden
      van [artikel 19 van de Wet][ref5] niet verzekerd is geweest;

      b. gedurende het tijdvak, dat de betrokkene wegens ziekte of gebreken ongeschikt is geweest tot het verrichten van
      zijn arbeid;

      c. gedurende het tijdvak, dat de betrokkene ten minste 45% arbeidsongeschikt is geweest.

      2 Het bepaalde in het vorige lid is van overeenkomstige toepassing ten aanzien van de termijn van drie jaren,
      bedoeld in [artikel 46, eerste lid, onder b en c][ref6].


