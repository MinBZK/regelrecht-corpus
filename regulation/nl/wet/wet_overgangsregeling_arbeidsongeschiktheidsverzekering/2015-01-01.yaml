  - number: '27'
    text: |-
      Bij toekenning van een arbeidsongeschiktheidsuitkering op grond van het bepaalde in
      [artikel 4][ref1], onderscheidenlijk in de [artikelen 14][ref2] of [15][ref3], dan wel terwijl
      [artikel 11, eerste lid, van de Liquidatiewet ongevallenwetten][ref4] van toepassing is, vindt het bepaalde bij
      of krachtens de [artikelen 23][ref5], [24][ref6] en [25][ref7] van deze wet en [artikel 15 van de Wet][ref8] voor
      zoveel deze artikelen toepassing hebben gevonden met ingang van een tijdstip, gelegen vóór de dag, met ingang
      waarvan vorenbedoelde uitkering wordt toegekend, overeenkomstige toepassing met betrekking tot het ingevolge het
      bepaalde bij of krachtens [artikel 5][ref9], onderscheidenlijk de [artikelen 16, tweede lid][ref10], [17][ref11],
      [18][ref12] en [19][ref13], aan die uitkering ten grondslag te leggen dagloon.


