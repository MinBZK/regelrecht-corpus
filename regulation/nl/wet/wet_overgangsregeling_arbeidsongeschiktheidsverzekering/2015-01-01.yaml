  - number: '6'
    text: |-
      1 Indien degene, aan wie een arbeidsongeschiktheidsuitkering is toegekend op grond of mede op grond van het
      bepaalde in [artikel 3][ref1],[ 4][ref2] of [12][ref3], recht heeft op een overheidspensioen of een uitkering als
      bedoeld in artikel 10, eerste lid, onder a, onderscheidenlijk b, van de Interimwet invaliditeitsrentetrekkers,
      in verbinding met het tweede en het derde lid, onder a, b, c, e, f, g en h, van dat artikel, wordt
      de arbeidsongeschiktheidsuitkering slechts uitbetaald voor zover deze het gezamenlijke bedrag van het
      overheidspensioen en de op dat pensioen verleende wettelijke toeslagen en bijslagen onderscheidenlijk het bedrag
      van de vorengenoemde uitkering, overtreft.

      2 Voor de toepassing van het vorige lid wordt onder arbeidsongeschiktheidsuitkering mede verstaan de vakantie-
      uitkering als bedoeld in [Hoofdstuk II, § 2a, van de Wet][ref4].

      3 Het bepaalde in artikel 10, vierde lid, van de Interimwet invaliditeitsrentetrekkers is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002551#Artikel3
