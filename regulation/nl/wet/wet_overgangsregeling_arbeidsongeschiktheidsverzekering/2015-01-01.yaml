  - number: '70'
    text: Deze wet kan worden aangehaald onder de titel "Wet overgangsregeling arbeidsongeschiktheidsverzekering".
    url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#Artikel70
  - number: '71'
    text: |-
      1 Waar in deze wet nummeringen van artikelen van de Liquidatiewet invaliditeitswetten worden aangehaald, worden
      deze door Onze Minister in overeenstemming gebracht in de nummering van die artikelen, zoals deze is komen te
      luiden na toepassing van artikel 65 van de Liquidatiewet invaliditeitswetten.

      2 De tekst van deze wet, zoals die luidt na toepassing van het vorige lid, wordt in het *Staatsblad* geplaatst.
    url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#Artikel71
  - number: '72'
    text: |-
      De artikelen van deze wet treden in werking met ingang van een door Ons te bepalen tijdstip, dat voor de
      onderscheidene artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#Artikel72
