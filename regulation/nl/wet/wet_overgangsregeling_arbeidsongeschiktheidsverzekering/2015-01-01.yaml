        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002553
        artikel: '6'
  - number: '29'
    text: |-
      1 De arbeidsongeschiktheidsuitkering van degene, ten aanzien van wie [artikel 6, vierde lid][ref1],
      [artikel 7, tweede lid][ref2], of [artikel 11, eerste lid, van de Liquidatiewet ongevallenwetten][ref3] toepassing
      vindt, wordt, zo nodig in afwijking van het bepaalde in de [artikelen 37][ref4], [38][ref5], [39][ref6] en
      [39c van de Wet][ref7], zo nodig herzien met ingang van de dag, met ingang waarvan het in aanmerking komende van de
      eerstgenoemde artikelen toepassing vindt.

      2 Bij herziening van een arbeidsongeschiktheidsuitkering in verband met het bepaalde in het
      vorige lid wordt daaraan ten grondslag gelegd een dagloon ter hoogte van 6/5 maal het dagloon,
      dat aan de uitkering, waarop degene, ten aanzien van wie [artikel 6, vierde lid][ref8], of
      [artikel 7, tweede lid, van de Liquidatiewet ongevallenwetten][ref9] toepassing vindt, op grond van het bepaalde
      in dat artikel recht zou hebben gehad, indien genoemd vierde lid of genoemd tweede lid niet op hem van toepassing
      zou zijn geweest, onderscheidenlijk dat aan de uitkering, ten aanzien waarvan [artikel 11, eerste lid][ref10],
      van genoemde wet toepassing vindt, ingevolge die wet ten grondslag zou zijn gelegd zonder toepassing van
      [artikel 8, vijfde lid, van die wet][ref11]. Het bepaalde bij of krachtens de [artikelen 17][ref12], [18][ref13],
      [19][ref14], [20][ref15], [23][ref16], [24][ref17] en [25][ref18] van deze wet en [artikel 15 van de Wet][ref19]
      vindt met betrekking tot het in de vorige volzin eerstbedoelde dagloon overeenkomstige toepassing. Het bepaalde
      in de vorige twee volzinnen vindt slechts toepassing, indien dat leidt tot een hoger dagloon dan het dagloon, dat
      laatstelijk aan de arbeidsongeschiktheidsuitkering ten grondslag werd gelegd.


