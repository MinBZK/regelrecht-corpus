      1 Indien het bepaalde bij [artikel 6][ref1] of [7][ref2] van deze wet, dan wel het bepaalde bij of krachtens
      [artikel 45][ref3], [46][ref4], [46a][ref5] , 46b of [52 van de Wet][ref6] toepassing vindt, wordt van de
      arbeidsongeschiktheidsuitkering, toegekend aan een persoon ten aanzien van wie het bepaalde in artikel 53 van
      de Liquidatiewet invaliditeitswetten van toepassing is, zolang de arbeidsongeschiktheid sedert de dag, waarop de
      arbeidsongeschiktheidsuitkering is ingegaan, ten minste 65% bedraagt, de uitbetaling niet verder beperkt dan tot
      1/260 van het jaarbedrag van de invaliditeitsrente, vrije invaliditeitsrente of invaliditeitsuitkering als bedoeld
      in laatstgenoemd artikel.

      2 Het bepaalde in het tweede en het derde lid van het vorige artikel is van toepassing.


