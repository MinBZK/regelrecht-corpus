  - number: '28'
    text: |-
      Bij de vaststelling van de mate van arbeidsongeschiktheid van degene, die aan deze wet
      arbeidsongeschiktheidsuitkering ontleent, wordt zolang de betrokkene tevens op grond van het bepaalde in
      [artikel 4, eerste of tweede lid][ref1], of [artikel 6, eerste lid, van de Liquidatiewet ongevallenwetten][ref2]
      recht heeft op een uitkering als bedoeld in artikel 15 van de Ongevallenwet 1921 of artikel 36 van de Land-
      en Tuinbouwongevallenwet 1922, de mate van arbeidsongeschiktheid, ter zake waarvan hij recht op laatstgenoemde
      uitkering heeft, buiten aanmerking gelaten. Voor de toepassing van het bepaalde in de vorige volzin wordt de
      betrokkene geacht recht te hebben op de in die volzin laatstbedoelde uitkering, indien door zijn toedoen die
      uitkering niet wordt uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002553#Artikel6
    url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#Artikel28
    references:
      - id: ref1
