  - number: 55a
    text: |-
      Indien degene, die recht op toekenning van arbeidsongeschiktheidsuitkering ontleent aan deze wet, lid
      of gepensioneerd lid is van de pensioenkas van het Algemeen Mijnwerkersfonds van de Steenkolenmijnen in
      Limburg of van de pensioenkas van het Beambtenfonds voor het Mijnbedrijf, geschiedt de toekenning van de
      arbeidsongeschiktheidsuitkering, zo nodig in afwijking van het bepaalde in de[ artikelen 53][ref1], [54][ref2] en
      [55][ref3], door het Uitvoeringsinstituut werknemersverzekeringen.


