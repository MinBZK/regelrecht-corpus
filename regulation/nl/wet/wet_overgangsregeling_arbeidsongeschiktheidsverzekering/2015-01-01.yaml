  - number: '22'
    text: |-
      Indien op grond van de regelen inzake dagloon, gesteld bij of krachtens deze wet dan wel bij of krachtens de
      [Wet][ref1], meer dan één dagloon in aanmerking komt om aan een arbeidsongeschiktheidsuitkering ten grondslag te
      worden gelegd, wordt daaraan ten grondslag gelegd het hoogste van die daglonen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#Artikel22
