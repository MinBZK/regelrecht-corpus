  - number: '61'
    text: |-
      Degene, die in verband met het bepaalde in [artikel 3, derde lid][ref1], of
      [8 van de Wet overgangsregeling Ziektewet][ref2] verzekerd is ingevolge de [Ziektewet][ref3] en de
      pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref4], nog
      niet heeft bereikt, is, onverminderd het bepaalde bij of krachtens de[ artikelen 53 tot en met 57][ref5],
      verzekerd ingevolge de [Wet][ref6] bij het Uitvoeringsinstituut werknemersverzekeringen, waarbij hij ingevolge de
      [Ziektewet][ref7] verzekerd is.


