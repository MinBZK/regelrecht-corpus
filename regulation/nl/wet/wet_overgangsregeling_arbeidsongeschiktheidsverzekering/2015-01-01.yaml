  - number: '50'
    text: |-
      Voor zover de termijn van drie jaren, genoemd in [artikel 81, eerste lid, onder c en d, van de Wet][ref1], is
      gelegen vóór het in werking treden van [artikel 19 van de Wet][ref2], wordt in genoemde bepalingen in plaats
      van "onafgebroken, al dan niet hier te lande, ingevolge het bepaalde bij of krachtens een wettelijke regeling
      een voorziening tegen geldelijke gevolgen van langdurige arbeidsongeschiktheid op hem van toepassing is geweest"
      gelezen: onafgebroken de verzekering ingevolge deze wet op hem van toepassing zou zijn geweest of in verband met
      het bepaalde in [artikel 6, eerste lid, onder a of b][ref3], niet op hem van toepassing zou zijn geweest, indien
      deze wet toen reeds in werking was geweest, dan wel buiten het Rijk, ingevolge het bepaalde bij of krachtens een
      wettelijke regeling, een voorziening tegen geldelijke gevolgen van langdurige arbeidsongeschiktheid op hem van
      toepassing is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002551#Artikel6
    url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#Artikel50
