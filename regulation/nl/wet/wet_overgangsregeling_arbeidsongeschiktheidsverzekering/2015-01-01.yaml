  - number: '54'
    text: |-
      Indien [artikel 12][ref1] toepassing dan wel mede toepassing vindt, geschiedt – onverminderd het bepaalde in
      [artikel 53][ref2] – de toekenning van de arbeidsongeschiktheidsuitkering, indien het betreft het geval, bedoeld
      in [artikel 12, eerste lid, onder 1°][ref3], door het Uitvoeringsinstituut werknemersverzekeringen, dat het
      ziekengeld verleende en, indien het betreft het geval, bedoeld in [artikel 12, eerste lid, onder 2°][ref4], door
      het Uitvoeringsinstituut werknemersverzekeringen, dat ziekengeld zou hebben dienen te verlenen, indien betrokkene
      niet van de verzekering ingevolge de [Ziektewet][ref5] uitgezonderd zou zijn geweest.


