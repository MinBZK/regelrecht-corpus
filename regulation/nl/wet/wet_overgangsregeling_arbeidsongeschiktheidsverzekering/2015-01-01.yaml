  - number: '8'
    text: |-
      1 In de gevallen, waarin over een tijdvak, waarover reeds arbeidsongeschiktheidsuitkering is uitbetaald, naderhand
      pensioen of uitkering als bedoeld in [artikel 6][ref1] of [7][ref2] wordt toegekend of een zodanig reeds toegekend
      pensioen of toegekende uitkering wordt verhoogd, kan hetgeen als gevolg van het bepaalde in die artikelen aan
      arbeidsongeschiktheidsuitkering teveel of ten onrechte is uitbetaald worden teruggevorderd dan wel in mindering
      worden gebracht op de nog uit te betalen bedragen aan pensioen of uitkering en de daarop verleende wettelijke
      toeslagen en bijslagen of op de later uit te betalen arbeidsongeschiktheidsuitkering.

      2 Indien na toepassing van [artikel 6][ref3] of [7][ref4] blijkt, dat pensioen of uitkering, bedoeld
      in die artikelen, ten onrechte of tot een te hoog bedrag is uitbetaald, als gevolg waarvan alsnog
      arbeidsongeschiktheidsuitkering of meer arbeidsongeschiktheidsuitkering moet worden uitbetaald, kan hetgeen aan
      pensioen of uitkering ten onrechte of teveel is uitbetaald in mindering worden gebracht op de alsnog uit te betalen
      arbeidsongeschiktheidsuitkering of meerdere arbeidsongeschiktheidsuitkering.

      3 Voor de toepassing van het bepaalde in de vorige leden wordt onder arbeidsongeschiktheidsuitkering
      onderscheidenlijk pensioen als bedoeld in [artikel 7][ref5] tevens verstaan de vakantie-uitkering, welke uit hoofde
      van die arbeidsongeschiktheidsuitkering onderscheidenlijk dat pensioen is verleend.


