  - number: '24'
    text: |-
      Indien het bepaalde in het eerste lid van het vorige artikel geen toepassing vindt, wordt voor de eerste maal,
      dat [artikel 15 van de Wet][ref1], anders dan op grond van het bepaalde in het zevende lid van dat artikel, wordt
      toegepast, in het [vierde lid van artikel 15 van de Wet][ref2] met betrekking tot herziening van de overeenkomstig
      het bepaalde bij of krachtens de [artikelen 5, eerste en derde lid][ref3], [16][ref4], [17][ref5], [18][ref6] en
      [19][ref7] vastgestelde daglonen in plaats van "het indexcijfer op de laatste dag van de maand, voorafgaande aan
      die, waarin [artikel 19][ref8] in werking is getreden, onderscheidenlijk van het indexcijfer, waarop de laatste
      herziening is gebaseerd" gelezen: het indexcijfer, waarop de laatstelijk vastgestelde bedragen als bedoeld in
      artikel 5 van de Interimwet invaliditeitsrentetrekkers zijn gebaseerd.


