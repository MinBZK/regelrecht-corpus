  - number: '57'
    text: |-
      1 Degene, bedoeld in [artikel 43][ref1], wordt voor de in dat artikel genoemde voorziening in aanmerking gebracht
      door het Uitvoeringsinstituut werknemersverzekeringen.

      2 Degene, bedoeld in [artikel 44][ref2] of [45][ref3], wordt, indien ter zake van het ongeval of mede ter zake
      van het ongeval, dat aan het in aanmerking brengen voor de in deze artikelen genoemde voorziening ten grondslag
      ligt, recht op een arbeidsongeschiktheidsuitkering aan deze wet wordt ontleend, voor de in deze artikelen
      genoemde voorziening in aanmerking gebracht door het Uitvoeringsinstituut werknemersverzekeringen, dat de
      arbeidsongeschiktheidsuitkering verleent.

      3 Indien:

      a. geen recht op een arbeidsongeschiktheidsuitkering aan deze wet wordt ontleend,

      b. anders dan ter zake van het ongeval, dat aan het in aanmerking brengen voor de voorziening ten grondslag
      ligt, reeds recht op een arbeidsongeschiktheidsuitkering aan deze wet wordt ontleend, wordt de betrokkene voor
      de in [artikel 44][ref4] of [45][ref5] genoemde voorziening in aanmerking gebracht door het Uitvoeringsinstituut
      werknemersverzekeringen dat arbeidsongeschiktheidsuitkering zou hebben dienen te verlenen, indien ter zake van
      arbeidsongeschiktheid als gevolg van vorenbedoeld ongeval recht op arbeidsongeschiktheidsuitkering krachtens deze
      wet zou zijn ontstaan.

      4 Bij toepassing van het derde lid, onder b, geschiedt de verdere behandeling van de daar bedoelde
      arbeidsongeschiktheidsuitkering, zo nodig in afwijking van het bepaalde in [artikel 69 van de wet][ref6], door het
      Uitvoeringsinstituut werknemersverzekeringen.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld ten aanzien van de uitvoering van
      het in aanmerking brengen voor een voorziening als bedoeld in de [artikelen 43][ref7], [44][ref8] en [45][ref9] van
      personen, die geen recht op een arbeidsongeschiktheidsuitkering aan deze wet ontlenen. Bij deze regelen kan worden
      afgeweken van het bepaalde bij de voorgaande leden en bij [artikel 2][ref10].


