preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen vast te stellen inzake overgangsrecht met
    betrekking tot de Wet op de arbeidsongeschiktheidsverzekering;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van deze wet en van de tot haar uitvoering genomen besluiten wordt verstaan onder:

      a. Wet: de [Wet op de arbeidsongeschiktheidsverzekering][ref1];

      b. Interimwet invaliditeitsrentetrekkers: de Interimwet invaliditeitsrentetrekkers, zoals deze wet luidde op de
      dag, voorafgaande aan die, waarop zij werd ingetrokken;

      c. Ongevallenwet 1921, Land- en Tuinbouwongevallenwet 1922 en Zeeongevallenwet 1919: de Ongevallenwet 1921, de
      Land- en Tuinbouwongevallenwet 1922, onderscheidenlijk de Zeeongevallenwet 1919, zoals deze wetten luidden op de
      dag, voorafgaande aan die, waarop zij werden ingetrokken;

      d. ongeval: een ongeval, in verband met de dienstbetrekking of de uitoefening van een verzekeringsplichtig bedrijf
      overkomen, als bedoeld in de Ongevallenwet 1921, de Land- en Tuinbouwongevallenwet 1922 of de Zeeongevallenwet
      1919, alsmede hetgeen in die wetten mede als ongeval, in verband met de dienstbetrekking overkomen, werd beschouwd,
      dan wel daarmede werd gelijkgesteld.

      2 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt met lichamelijk letsel, gevolg van een
      ongeval, gelijkgesteld lichamelijk letsel in een betrekkelijk korte tijd ontstaan als bedoeld in artikel 1, vierde
      lid, van de Ongevallenwet 1921 en artikel 2, vierde lid, van de Land- en Tuinbouwongevallenwet 1922.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#Artikel1
    references:
      - id: ref1
