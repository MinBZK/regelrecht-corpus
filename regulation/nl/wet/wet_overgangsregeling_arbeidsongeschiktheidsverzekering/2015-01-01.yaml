  - number: '9'
    text: |-
      1 Indien degene, die recht op toekenning van arbeidsongeschiktheidsuitkering ontleent dan wel mede ontleent aan
      [artikel 3][ref1], [4][ref2] of [12][ref3], in het genot is van een invaliditeitsuitkering, ontleend aan artikel
      59 bis van het op 31 december 1935 geldende reglement van het Algemeen Mijnwerkersfonds van de Steenkolenmijnen in
      Limburg, wordt de arbeidsongeschiktheidsuitkering slechts uitbetaald, indien en voor zover deze het bedrag van die
      invaliditeitsuitkering overtreft.

      2 Aan degene, die recht op toekenning van arbeidsongeschiktheidsuitkering ontleent dan wel mede ontleent

      hetzij aan [artikel 3][ref4], terwijl hem het recht op bijslag als in dat artikel bedoeld was toegekend met
      toepassing van artikel 2, eerste lid, onder b, van de Interimwet invaliditeitsrentetrekkers,

      hetzij aan [artikel 4][ref5] of [12][ref6], terwijl hij, indien de Interimwet invaliditeitsrentetrekkers niet zou
      zijn ingetrokken, op grond van het bepaalde in artikel 2, eerste lid, onder b, van die wet als rentetrekker zou
      zijn aangemerkt,

      wordt de arbeidsongeschiktheidsuitkering slechts uitbetaald, indien en voor zover deze overtreft het bedrag,
      dat de invaliditeitsrente als bedoeld in artikel 2, eerste lid, onder b, en tweede lid, van de Interimwet
      invaliditeitsrentetrekkers, in verbinding met artikel 8, eerste lid, onder b, en tweede lid, van die wet, geacht
      zou worden te bedragen, indien die wet niet zou zijn ingetrokken.

      3 Het bepaalde in de vorige leden blijft buiten toepassing, indien het Algemeen Mijnwerkersfonds van de
      Steenkolenmijnen in Limburg, onderscheidenlijk het fonds, waarin is ondergebracht een pensioenregeling ten aanzien
      waarvan een verklaring is afgegeven als bedoeld in artikel 39 van de Invaliditeitswet, gebruik maakt van de in
      artikel 54, tweede lid, van de Liquidatiewet invaliditeitswetten gegeven bevoegdheid.


