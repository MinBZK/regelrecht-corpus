  - number: '7'
    text: |-
      1 Indien degene, aan wie een arbeidsongeschiktheidsuitkering is toegekend op grond of mede op grond van het
      bepaalde in [artikel 3][ref1] of [4][ref2], doch zonder toepassing van [artikel 12][ref3], recht heeft op een vóór
      de dag van ingang van de arbeidsongeschiktheidsuitkering ingegaan weduwenpensioen ingevolge de Algemene Weduwen- en
      Wezenwet, wordt de arbeidsongeschiktheidsuitkering slechts uitbetaald, indien en voor zover deze het bedrag van het
      weduwenpensioen overtreft.

      2 Indien artikel 30, eerste lid, van de Algemene Weduwen- en Wezenwet toepassing vindt, wordt voor de toepassing
      van het vorige lid als weduwenpensioen in aanmerking genomen het bedrag van het weduwenpensioen vóórdat de in
      artikel 30, eerste lid, van de Algemene Weduwen- en Wezenwet voorziene vermindering heeft plaatsgevonden.

      3 Voor de toepassing van het bepaalde in het eerste lid wordt onder arbeidsongeschiktheidsuitkering
      onderscheidenlijk weduwenpensioen tevens verstaan de vakantie-uitkering, waarop uit hoofde van die
      arbeidsongeschiktheidsuitkering onderscheidenlijk dat weduwenpensioen recht bestaat, voor zover die vakantie-
      uitkeringen over dezelfde perioden zijn berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002551#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002551#Artikel4
