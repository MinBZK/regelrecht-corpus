  - number: '60'
    text: |-
      1 Ten aanzien van degene, die arbeidsongeschikt wordt, of, in gevallen als bedoeld in
      [artikel 37, eerste lid, van de Wet][ref1], meer arbeidsongeschikt wordt binnen drie maanden na het in werking
      treden van [artikel 19 van de Wet][ref2], doch binnen een maand na het tijdstip, waarop zijn verzekering ingevolge
      de [Wet][ref3] is geëindigd, wordt voor de toepassing van [artikel 17 dier wet][ref4] de [Wet][ref5] geacht in
      werking te zijn getreden op de dag, welke is gelegen drie maanden vóór de dag, waarop de arbeidsongeschiktheid
      onderscheidenlijk de toeneming van de arbeidsongeschiktheid is ingetreden.

      2 Ten aanzien van degene, die arbeidsongeschikt wordt, of, in gevallen als bedoeld in
      [artikel 37, eerste lid, van de Wet][ref6], meer arbeidsongeschikt wordt op of na de dag, waarop
      [artikel 19 van de Wet][ref7] in werking treedt, doch binnen een maand na het vóór die dag gelegen tijdstip, waarop
      zijn verzekering ingevolge de [Wet][ref8] zou zijn geëindigd, indien de [Wet][ref9] toen reeds in werking was
      geweest, wordt voor de toepassing van [artikel 17][ref10] en § 3 van hoofdstuk II dier wet de [Wet][ref11] geacht
      in werking te zijn getreden op de dag, welke is gelegen drie maanden vóór de dag, waarop de arbeidsongeschiktheid
      onderscheidenlijk de toeneming van de arbeidsongeschiktheid is ingetreden.


