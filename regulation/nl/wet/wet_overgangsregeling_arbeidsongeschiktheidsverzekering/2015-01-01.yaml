  - number: '42'
    text: |-
      Onze Minister kan ten aanzien van het bepaalde bij de [artikelen 37][ref1], [38][ref2] en [40][ref3] nadere
      regelen stellen. Daarbij kan tevens worden geregeld, dat personen, wier arbeidsongeschiktheidsuitkering
      aansluit aan een uitkering ingevolge de Invaliditeitswet of een daarmede gelijk te stellen
      uitkering, aan een uitkering ingevolge de Interimwet invaliditeitsrentetrekkers, ingevolge de in
      [artikel 3, eerste lid, onder a, b, c, d, e, f of g, van de Liquidatiewet ongevallenwetten][ref4] genoemde
      wetten, dan wel ingevolge de [Liquidatiewet ongevallenwetten][ref5], indien die arbeidsongeschiktheidsuitkering
      of het van deze uitkering uit te betalen bedrag op een lager bedrag wordt vastgesteld dan het bedrag van de
      vorenbedoelde uitkering(en), waarop de arbeidsongeschiktheidsuitkering aansluit, voor een hoger bedrag aan
      arbeidsongeschiktheidsuitkering in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0002551#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0002551#Artikel38
