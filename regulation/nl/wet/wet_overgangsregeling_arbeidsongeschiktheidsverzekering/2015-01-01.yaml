  - number: '25'
    text: |-
      1 Indien met ingang van de dag, waarop [artikel 19 van de Wet][ref1] in werking treedt,
      [artikel 15, zevende lid, van de Wet][ref2] wordt toegepast, wordt met betrekking tot de herziening van
      de overeenkomstig het bepaalde bij of krachtens de [artikelen 5, eerste en derde lid][ref3], [16][ref4],
      [17][ref5], [18][ref6] en [19][ref7] vastgestelde daglonen in het [achtste lid van artikel 15 van de Wet][ref8]
      in plaats van "het indexcijfer op de laatste dag van de maand, voorafgaande aan die, waarin [artikel 19][ref9]
      in werking is getreden, onderscheidenlijk van het indexcijfer, waarop de laatste herziening is gebaseerd"
      gelezen: het indexcijfer, waarop de laatstelijk vastgestelde bedragen als bedoeld in artikel 5 van de Interimwet
      invaliditeitsrentetrekkers zijn gebaseerd.

      2 Bij toepassing van het bepaalde in het vorige lid blijft [artikel 24][ref10] buiten toepassing.


