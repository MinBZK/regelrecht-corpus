  - number: '35'
    text: |-
      Indien [artikel 34][ref1] van toepassing is ten aanzien van een persoon, die op de dag, met ingang
      van welke [artikel 6, vierde lid][ref2], [7, tweede lid][ref3], [10, eerste of tweede lid][ref4], of
      [11, eerste lid, van de Liquidatiewet ongevallenwetten][ref5] toepassing vindt, indien geen van laatstgenoemde
      artikelen ten aanzien van hem toepassing zou hebben gevonden, recht op meer dan één uitkering als bedoeld in
      [artikel 4][ref6], [5][ref7], [6][ref8] of [7][ref9] van die wet zou hebben gehad, geldt de garantie, vervat
      in [artikel 34][ref10], zolang geen van die uitkeringen in verband met verandering in de toestand als in dat
      artikel bedoeld, zou zijn verlaagd, indien geen van de [artikelen 6, vierde lid][ref11], [7, tweede lid][ref12],
      [10, eerste of tweede lid][ref13], en [11, eerste lid, van de Liquidatiewet ongevallenwetten][ref14] ten aanzien
      van hem toepassing zou hebben gevonden, tot de som van die uitkeringen.


