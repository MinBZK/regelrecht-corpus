  - number: '49'
    text: |-
      1 De aanmelding voor de vrijwillige verzekering dient, onverminderd het bepaalde in de volgende leden,
      door de in [artikel 46][ref1] bedoelde personen te geschieden binnen een maand na het in werking treden van
      [artikel 19 van de Wet][ref2].

      2 De aanmelding voor de vrijwillige verzekering kan na de in het vorige lid, onderscheidenlijk na de in
      [artikel 83 van de Wet][ref3] bedoelde termijn nog, onverminderd het bepaalde in het volgende lid, geschieden
      binnen zes maanden na het in werking treden van [artikel 19 van de Wet][ref4]:

      a. door de in [artikel 46][ref5] bedoelde personen;

      b. door de personen, wier aanmelding voor de vrijwillige verzekering ingevolge het bepaalde bij of krachtens
      [artikel 83 van de Wet][ref6] zou dienen te geschieden vóór een dag, gelegen binnen zes maanden na het in werking
      treden van [artikel 19 van de Wet][ref7].

      3 Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd de toelating tot de vrijwillige verzekering na
      aanmelding met toepassing van het vorige lid te weigeren:

      a. van de in het vorige lid, onder a, bedoelde personen, indien arbeidsongeschiktheid is ingetreden of toegenomen
      na de in het eerste lid bedoelde maand, doch vóór het tijdstip, waarop de betrokkene zich aanmeldt voor de
      vrijwillige verzekering;

      b. van de in het vorige lid, onder b, bedoelde personen, indien arbeidsongeschiktheid is ingetreden of toegenomen
      na de aldaar bedoelde dag, doch vóór het tijdstip, waarop de betrokkene zich aanmeldt voor de vrijwillige
      verzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0002551#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel19
