  - number: '13'
    text: |-
      Degene, die op de dag, voorafgaande aan die, waarop [artikel 19 van de Wet][ref1] in werking treedt, recht heeft op
      een uitkering als bedoeld in artikel 16 van de Ongevallenwet 1921, artikel 37 van de Land- en Tuinbouwongevallenwet
      1922 of artikel 2, eerste lid, onder a, van de Zeeongevallenwet 1919 en die op laatstbedoelde dag dat recht
      zou hebben behouden indien die wetten niet zouden zijn ingetrokken, heeft, tenzij het recht op die uitkering
      overeenkomstig het bepaalde in [artikel 5 van de Liquidatiewet ongevallenwetten][ref2] blijft behouden dan
      wel overeenkomstig het bepaalde in [artikel 17][ref3] van die wet wordt afgekocht, recht op toekenning van
      arbeidsongeschiktheidsuitkering.


