  - number: '20'
    text: |-
      1 De verhoging van het dagloon ingevolge het bepaalde in [de artikelen 17][ref1], [18][ref2] en [19][ref3] vindt
      niet plaats ten aanzien van:

      a. degene, die op de dag, waarop [artikel 19 van de Wet][ref4] in werking treedt, niet binnen het Rijk woont;

      b. degene, die het recht op een uitkering als bedoeld in artikel 16 van de Ongevallenwet 1921 of artikel 37
      van de Land- en Tuinbouwongevallenwet 1922, onderscheidenlijk in [artikel 4][ref5], [5][ref6], [6][ref7]
      of [7 van de Liquidatiewet ongevallenwetten][ref8], ontleent aan een vrijwillige verzekering ingevolge de
      Ongevallenwet 1921 of de Land- en Tuinbouwongevallenwet 1922.

      2 Met inachtneming zoveel mogelijk van het beginsel der wederkerigheid kan bij algemene maatregel van bestuur
      worden bepaald, dat het in het eerste lid, onder *a,* bepaalde geen toepassing vindt ten aanzien van bij die
      maatregel aan te wijzen personen, die op de dag, waarop [artikel 19 van de Wet][ref9] in werking treedt, op het
      grondgebied van een andere Mogendheid wonen.

      3 Indien een persoon, bedoeld in het eerste lid, onder a, op de dag, voorafgaande aan die, waarop
      [artikel 19 van de Wet][ref10] in werking treedt, ingevolge het bepaalde bij of krachtens de Wet compensatie premie
      [Algemene Ouderdomswet][ref11] ongevallenrentetrekkers aanspraak heeft op een bijslag op een uitkering als bedoeld
      in artikel 16 van de Ongevallenwet 1921, artikel 37 van de Land- en Tuinbouwongevallenwet 1922 of artikel 2, eerste
      lid, onder a, van de Zeeongevallenwet 1919, wordt het in [artikel 16, eerste en tweede lid][ref12], eerstbedoelde
      dagloon verhoogd met het voor die bijslag geldende percentage.


