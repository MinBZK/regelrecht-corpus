  - number: '48'
    text: |-
      1 Het bepaalde in [artikel 46][ref1] geldt niet ten aanzien van:

      a. degene, die verzekerd is ingevolge de [Wet][ref2];

      b. degene, die in verband met het bepaalde in [artikel 6, eerste lid, onder a of b, van de Wet][ref3] niet
      verzekerd is ingevolge de [Wet][ref4].

      2 Het bepaalde in het vorige lid blijft buiten toepassing, indien de arbeidsverhouding, uit hoofde waarvan de
      betrokkene verzekerd dan wel niet verzekerd is ingevolge de [Wet][ref5], ertoe strekt, dat de betrokkene slechts
      een gedeelte van een normale werkweek arbeid verricht, niet uitsluitend als gevolg van een voor betrokkene geldende
      werktijdregeling, krachtens welke een normale werkweek van gemiddeld minder dan zes dagen van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002551#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0002524
