  - number: '3'
    text: |-
      1 Degene, die over de maand, voorafgaande aan de dag, waarop [artikel 19 van de Wet][ref1] in werking treedt, recht
      heeft op een bijslag als bedoeld in artikel 3 van de Interimwet invaliditeitsrentetrekkers en op genoemde dag ten
      minste 15% arbeidsongeschikt is, heeft recht op toekenning van arbeidsongeschiktheidsuitkering.

      2 Het bepaalde in het vorige lid is van overeenkomstige toepassing ten aanzien van degene, die over de in dat lid
      bedoelde maand geen recht heeft op een bijslag als daar bedoeld, uitsluitend in verband met het bepaalde bij of
      krachtens artikel 10, eerste lid, onder a, van de Interimwet invaliditeitsrentetrekkers in verbinding met het derde
      lid, onder d, van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel13
    url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '13'
  - number: '4'
    text: |-
      1 Degene, die ter zake van invaliditeit, welke is ingetreden vóór de dag, waarop [artikel 19 van de Wet][ref1] in
      werking treedt, eerst op of na die dag op grond van het bepaalde in artikel 1, onder c, dan wel artikel 2, eerste
      lid, onder a, b, c of d, van de Interimwet invaliditeitsrentetrekkers als rentetrekker zou zijn aangemerkt, indien
      die wet niet zou zijn ingetrokken, heeft recht op toekenning van arbeidsongeschiktheidsuitkering, wanneer hij op
      het tijdstip, met ingang waarvan hij, indien de Interimwet invaliditeitsrentetrekkers niet zou zijn ingetrokken,
      als rentetrekker zou zijn aangemerkt, recht op bijslag als bedoeld in artikel 3 van die wet zou hebben gehad.

      2 Voor de toepassing van het bepaalde in het vorige lid blijft het bepaalde bij of krachtens artikel 10, eerste
      lid, onder a, van de Interimwet invaliditeitsrentetrekkers, in verbinding met het derde lid, onder d, van dat
      artikel, buiten beschouwing.

      3 Het bepaalde in de vorige leden blijft buiten toepassing ten aanzien van degene, die op de dag met
      ingang van welke hij als rentetrekker zou zijn aangemerkt, aan deze wet een vóór die dag ingegane
      arbeidsongeschiktheidsuitkering ontleent.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#Artikel4
