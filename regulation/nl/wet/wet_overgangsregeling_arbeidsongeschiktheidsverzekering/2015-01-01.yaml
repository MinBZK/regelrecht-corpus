  - number: '30'
    text: |-
      1 Bij de vaststelling van de mate van arbeidsongeschiktheid van degene, die uitsluitend aan [artikel 13][ref1],
      [14][ref2] of [15][ref3] arbeidsongeschiktheidsuitkering ontleent, wordt, indien de betrokkene op en sedert
      de dag, met ingang waarvan hij recht op genoemde uitkering heeft, aanspraak heeft op ziekengeld krachtens de
      [Ziektewet][ref4] en dat ziekengeld binnen een maand na genoemde dag eindigt, de mate van arbeidsongeschiktheid,
      ter zake waarvan hij aanspraak heeft op ziekengeld, buiten aanmerking gelaten.

      2 Het bepaalde in [artikel 12, tweede lid][ref5], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002551#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002551#Artikel14
