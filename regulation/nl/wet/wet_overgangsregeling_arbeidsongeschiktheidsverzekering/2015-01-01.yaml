  - number: '19'
    text: |-
      Indien het in [artikel 16, eerste en tweede lid][ref1], eerstbedoelde dagloon, eventueel verhoogd ingevolge de
      [artikelen 17][ref2] en [18][ref3], minder bedraagt dan het bedrag, dat als dagloon zou gelden, indien ten aanzien
      van de betrokkene het bepaalde bij [artikel 5, eerste of tweede lid][ref4], toepassing zou vinden, wordt het
      dagloon verhoogd tot laatstbedoeld bedrag. Het bepaalde in de vorige volzin blijft buiten toepassing ten aanzien
      van de vrouw, die bij het in werking treden van [artikel 19 van de Wet][ref5] gehuwd is.


