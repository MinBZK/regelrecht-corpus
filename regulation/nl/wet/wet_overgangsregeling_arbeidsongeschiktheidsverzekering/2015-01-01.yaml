  - number: '18'
    text: |-
      Indien met ingang van een dag, gelegen na 1 oktober 1966, doch vóór de dag, waarop [artikel 19 van de Wet][ref1]
      in werking treedt, de wettelijke bijslagen op renten bedoeld in artikel 16 van de Ongevallenwet 1921 of
      artikel 37 van de Land- en Tuinbouwongevallenwet 1922 of op uitkeringen, bedoeld in artikel 2, eerste lid,
      onder a, van de Zeeongevallenwet 1919, worden gewijzigd in verband met wijziging van het loonpeil, worden de
      in [artikel 17, eerste lid][ref2], genoemde percentages bij algemene maatregel van bestuur dienovereenkomstig
      gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002551#Artikel17
