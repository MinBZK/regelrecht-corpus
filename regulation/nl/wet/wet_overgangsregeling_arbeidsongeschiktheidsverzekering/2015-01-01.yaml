  - number: '43'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen brengt degene, wiens genees- of heelkundige behandeling, daaronder
      mede verstaan opneming in een inrichting, op grond van het bepaalde bij of krachtens de artikelen 99, 100, 105
      en 113 van de Invaliditeitswet zou zijn voortgezet, indien de bepalingen van de Invaliditeitswet en van haar
      uitvoeringsbesluiten, ingevolge welke die behandeling is verleend, niet buiten werking zouden zijn getreden, op de
      voet van het bepaalde in § 3 van hoofdstuk II van de Wet voor voortzetting van die behandeling in aanmerking.
    url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#Artikel43
  - number: '44'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen brengt degene, die ter zake van een ongeval, dat plaatsvond vóór
      de dag, waarop [artikel 19 van de Wet][ref1] in werking treedt,

      hetzij vóór die dag genees- en heelkundige behandeling of vergoeding daarvoor als bedoeld in artikel 14 van
      de Ongevallenwet 1921, artikel 35 van de Land- en Tuinbouwongevallenwet 1922 of artikel 2, achtste lid, van de
      Zeeongevallenwet 1919 heeft gehad,

      hetzij binnen een jaar, aanvangende op meergenoemde dag, recht op zodanige behandeling of vergoeding daarvoor zou
      hebben gehad, indien laatstgenoemde wetten niet zouden zijn ingetrokken,

      een en ander tenzij de uitkering als bedoeld in artikel 16 van de Ongevallenwet 1921, artikel 37 van
      de Land- en Tuinbouwongevallenwet 1922 of artikel 2, eerste lid, onder *a*, van de Zeeongevallenwet
      1919, welke hem ter zake van eerdergenoemd ongeval is toegekend, overeenkomstig het bepaalde in
      [artikel 17 van de Liquidatiewet ongevallenwetten][ref2] wordt afgekocht dan wel overeenkomstig het bepaalde in
      [artikel 18 van die wet][ref3] is afgekocht, op de voet van het bepaalde in § 3 van hoofdstuk II van de Wet voor
      zodanige behandeling of vergoeding daarvoor in aanmerking, indien hij daarop, zo de Ongevallenwet 1921, de Land- en
      Tuinbouwongevallenwet 1922 en de Zeeongevallenwet 1919 niet zouden zijn ingetrokken, recht zou hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002553#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0002553#Artikel18
    url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#Artikel44
