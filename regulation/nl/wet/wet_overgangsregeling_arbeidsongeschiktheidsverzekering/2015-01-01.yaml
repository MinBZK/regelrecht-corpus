  - number: '32'
    text: |-
      1 Het bedrag van de arbeidsongeschiktheidsuitkering, welke is ontleend dan wel mede is ontleend aan
      [artikel 13][ref1], wordt, zolang de uitkering als bedoeld in artikel 16 van de Ongevallenwet 1921, artikel 37 van
      de Land- en Tuinbouwongevallenwet 1922, of artikel 2, eerste lid, onder a, van de Zeeongevallenwet 1919, waarop
      de betrokkene op de dag, voorafgaande aan die, waarop genoemde wetten werden ingetrokken, recht had, niet in
      verband met verandering in zijn toestand zou zijn verlaagd, indien genoemde wetten niet zouden zijn ingetrokken,
      niet lager gesteld dan het bedrag van laatstgenoemde uitkering, verhoogd met de bijslagen, welke daarop krachtens
      de wettelijke regelingen inzake het verlenen van bijslagen op de uitkeringen ingevolge eerstgenoemde wetten zijn
      verleend.

      2 Indien op de dag, voorafgaande aan die, waarop de Ongevallenwet 1921, de Land- en Tuinbouwongevallenwet 1922 en
      de Zeeongevallenwet 1919 werden ingetrokken, de termijn van 312 dagen, bedoeld in artikel 16, tweede lid, onder
      a, in verbinding met het derde lid, van de Ongevallenwet 1921, artikel 37, derde lid, onder a, in verbinding
      met het bepaalde onder c en d, van de Land- en Tuinbouwongevallenwet 1922, onderscheidenlijk artikel 2, eerste
      lid, onder a, sub I, van de Zeeongevallenwet 1919, nog niet was verstreken, geldt met ingang van de eerste dag,
      liggende na die termijn, voor de toepassing van het bepaalde in het vorige lid als bedrag van de uitkering, waarop
      de betrokkene op de dag, voorafgaande aan die, waarop genoemde wetten werden ingetrokken, recht had, verhoogd
      met de bijslagen, welke daarop zijn verleend, het bedrag van de uitkering, waarop de betrokkene, ingeval genoemde
      wetten niet zouden zijn ingetrokken, op de eerste dag na genoemde termijn recht zou hebben gehad, verhoogd met
      de bijslagen, welke daarop krachtens de wettelijke regelingen inzake het verlenen van bijslagen op de uitkeringen
      ingevolge genoemde wetten, zo die regelingen niet waren ingetrokken, zouden zijn verleend.

      3 Onder verandering in de toestand van de betrokkene als in het eerste lid bedoeld wordt aangemerkt hetgeen
      daaronder in artikel 75, eerste lid, van de Ongevallenwet 1921, artikel 72 van de Land- en Tuinbouwongevallenwet
      1922 en artikel 6 van het Reglement der Zeeongevallenregeling als bedoeld in artikel 2 van de statuten van de
      Vereeniging "Zee-Risico", zoals dat Reglement luidde op de dag, voorafgaande aan die, waarop de Zeeongevallenwet
      1919 werd ingetrokken, werd verstaan of mede begrepen, met dien verstande, dat onder het verwerven van nieuwe
      bekwaamheden ten gevolge van een opleiding mede wordt begrepen het verwerven van nieuwe bekwaamheden ten gevolge
      van een opleiding, welke is gegeven op de voet van het bepaalde in § 3 van hoofdstuk II van de Wet. In afwijking
      van het bepaalde in de vorige volzin wordt als verandering in de toestand van de betrokkene niet beschouwd de
      wijziging van de omstandigheden als bedoeld in artikel 17 van de Ongevallenwet 1921, artikel 38 van de Land- en
      Tuinbouwongevallenwet 1922 en artikel 2, eerste lid, onder c, van de Zeeongevallenwet 1919.

      4 Indien de uitkering als bedoeld in het eerste lid, waarop de betrokkene op de dag, voorafgaande aan die, waarop
      de Ongevallenwet 1921, de Land- en Tuinbouwongevallenwet 1922 en de Zeeongevallenwet 1919 werden ingetrokken, recht
      had, na die dag uitsluitend in verband met de wijziging van de omstandigheden als in de laatste volzin van het
      vorige lid bedoeld zou zijn verlaagd ingeval genoemde wetten niet zouden zijn ingetrokken, geldt met ingang van
      de dag, waarop die verlaging zou zijn ingegaan, voor de toepassing van het bepaalde in het eerste lid als bedrag
      van de uitkering, waarop de betrokkene op de dag, voorafgaande aan die, waarop genoemde wetten werden ingetrokken,
      recht had, verhoogd met de bijslagen, welke daarop zijn verleend, het bedrag van de uitkering, waarop de
      betrokkene, ingeval genoemde wetten niet zouden zijn ingetrokken, met ingang van de dag, waarop bedoelde verlaging
      zou zijn ingegaan, recht zou hebben gehad, verhoogd met de bijslagen, welke daarop krachtens de wettelijke
      regelingen inzake het verlenen van bijslagen op uitkeringen ingevolge genoemde wetten, zo die regelingen niet waren
      ingetrokken, zouden zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002551#Artikel13
    url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#Artikel32
