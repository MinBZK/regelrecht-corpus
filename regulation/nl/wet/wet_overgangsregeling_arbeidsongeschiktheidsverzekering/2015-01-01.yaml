      1 Indien het bepaalde bij [artikel 6][ref1] of [7][ref2] van deze wet, dan wel het bepaalde
      bij of krachtens [artikel 45][ref3], [46a][ref4], 46b of [52 van de Wet][ref5] toepassing vindt,
      wordt van de arbeidsongeschiktheidsuitkering, ontleend of mede ontleend aan [artikel 13][ref6],
      [14][ref7] of [15][ref8] van deze wet, onderscheidenlijk van de arbeidsongeschiktheidsuitkering
      van degene, ten aanzien van wie [artikel 6, vierde lid][ref9], [artikel 7, tweede lid][ref10], of
      [artikel 11, eerste lid, van de Liquidatiewet ongevallenwetten][ref11] toepassing vindt, de uitbetaling niet verder
      beperkt dan tot het bedrag, waarop de betrokkene krachtens het bepaalde bij [artikel 32][ref12],[ 33][ref13],
      [34][ref14], [35][ref15] of [36][ref16] aanspraak zou hebben, indien het bepaalde bij [artikel 6][ref17] of
      [7][ref18] van deze wet, dan wel het bepaalde bij [artikel 45][ref19], [46a][ref20], 46b of [52 van de Wet][ref21]
      niet van toepassing zou zijn.

      2 Het bepaalde bij [artikel 37][ref22] is mede van toepassing op het in het eerste lid gegarandeerde bedrag.


