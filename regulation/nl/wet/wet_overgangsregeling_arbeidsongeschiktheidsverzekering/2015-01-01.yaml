  - number: '12'
    text: |-
      1 Degene, wiens ziekengeld krachtens de [Ziektewet][ref1] ter zake van ongeschiktheid tot werken, welke is
      ingetreden vóór de dag, waarop [artikel 19 van de Wet][ref2] in werking treedt, bij of na het in werking treden van
      genoemd artikel, anders dan door herstel van de geschiktheid tot werken,

      1°. eindigt;

      2°. zou zijn geëindigd, indien hij niet op grond van het bepaalde in [artikel 1, onder c,][ref3] in verbinding
      met artikel 1a, van de Ziektewet, in de [artikelen 1, onder d,][ref4][20][ref5] en [21][ref6] van die wet of de
      artikelen 1a of 1b van het Koninklijk besluit van 28 januari 1931 (*Stb.* 24) - zoals die bepalingen luidden op de
      dag, voorafgaande aan die, waarop [artikel 19 van de Wet][ref7] in werking treedt - van de verzekering ingevolge de
      [Ziektewet][ref8] zou zijn uitgezonderd;

      heeft, indien hij op de dag, volgende op die, waarop dat ziekengeld eindigt, onderscheidenlijk zou zijn geëindigd,
      ten minste 15% arbeidsongeschikt is, recht op toekenning van arbeidsongeschiktheidsuitkering.

      2 Voor de toepassing van het in het vorige lid bepaalde wordt de betrokkene geacht nog aanspraak
      te hebben op ziekengeld krachtens de [Ziektewet][ref9], indien hem in verband met het bepaalde
      in de [artikelen 42][ref10] en [44][ref11] van die wet, dan wel in verband met het bepaalde in
      [artikel 11, eerste lid, onder a en b, en tweede lid, van de Wet overgangsregeling Ziektewet][ref12] geen
      ziekengeld wordt uitgekeerd.

      3 Het bepaalde in het eerste lid blijft buiten toepassing ten aanzien van degene, die bij het
      intreden van de in dat lid bedoelde ongeschiktheid tot werken in verband met het bepaalde in
      [artikel 6, eerste lid, onder a of b, van de Wet][ref13] niet verzekerd zou zijn geweest, indien de [Wet][ref14]
      toen reeds in werking was geweest.

      4 Het bepaalde in het eerste lid blijft voorts buiten toepassing ten aanzien van degene, die op de dag, volgende op
      die, waarop het in dat lid bedoelde ziekengeld eindigt of zou zijn geëindigd, aan deze wet een vóór eerstbedoelde
      dag ingegane arbeidsongeschiktheidsuitkering ontleent.


