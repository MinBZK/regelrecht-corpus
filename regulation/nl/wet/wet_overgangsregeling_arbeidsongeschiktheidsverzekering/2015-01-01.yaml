  - number: '64'
    text: |-
      Indien over een tijdvak, waarover een uitkering wordt genoten als bedoeld in artikel 16 van de Ongevallenwet 1921,
      artikel 37 van de Land- en Tuinbouwongevallenwet 1922 of artikel 2, eerste lid, onder *a*, van de Zeeongevallenwet
      1919, naderhand een arbeidsongeschiktheidsuitkering aan deze wet wordt ontleend, kan hetgeen als gevolg van het
      bepaalde bij of krachtens de [Liquidatiewet ongevallenwetten][ref1] over dat tijdvak aan eerstbedoelde uitkering
      ten onrechte is uitbetaald, geheel of gedeeltelijk worden teruggevorderd dan wel in mindering worden gebracht op de
      uit te betalen arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002553
    url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002553
  - number: '65'
    text: |-
      Het in [artikel 78 van de Wet][ref1] bedoelde premiepercentage wordt zodanig vastgesteld, dat uiterlijk in
      vier jaren, te rekenen van het tijdstip van inwerkingtreding van [artikel 19 van de Wet][ref2] af, mede de
      verplichtingen, welke voor het Arbeidsongeschiktheidsfonds als bedoeld in [hoofdstuk III, § 2, van de Wet][ref3],
      voortvloeien uit het bepaalde bij of krachtens artikel 52, derde en vierde lid, van de Liquidatiewet
      invaliditeitswetten, worden gedekt door middel van premieheffing krachtens de [Wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Paragraaf2
      [ref4]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '78'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0002524
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002524
  - number: '66'
    text: |-
      1 Een overeenkomst met betrekking tot de verzekering van geldelijke gevolgen van langdurige arbeidsongeschiktheid,
      gesloten door degene, die met ingang van de dag, waarop [artikel 19 van de Wet][ref1] in werking treedt, ingevolge
      de [Wet][ref2] of deze wet tot de vrijwillige verzekering wordt toegelaten, vervalt met ingang van de dag, waarop
      de verzekeraar van de verzekerde mededeling van de toelating ontvangt, voor zover aan de overeenkomst rechten
      kunnen worden ontleend, gelijkwaardig aan die, welke uit de in de [Wet][ref3] geregelde vrijwillige verzekering
      voortvloeien. Bereikt deze mededeling de verzekeraar vóór de dag, waarop de betrokkene vrijwillig verzekerd wordt,
      dan vervalt de overeenkomst met ingang van die dag.

      2 [Artikel 98a, tweede lid, van de Wet][ref4] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel98a
    url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0002524
        artikel: 98a
  - number: '67'
    text: |-
      De [Algemene termijnenwet][ref1] is niet van toepassing op de termijnen, gesteld in de [artikelen 11][ref2] en
      [60][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002448
      [ref2]: https://wetten.overheid.nl/BWBR0002551#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002551#Artikel60
    url: https://wetten.overheid.nl/BWBR0002551/2015-01-01#Artikel67
