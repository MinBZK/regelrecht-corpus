  - number: '53'
    text: |-
      Indien [artikel 13][ref1], [14][ref2] of [15][ref3] van deze wet of
      [artikel 11, eerste lid, van de Liquidatiewet ongevallenwetten][ref4] toepassing vindt dan wel mede toepassing
      vindt – voor zover laatstgenoemd artikel betreft ter zake van een op of na de ingangsdatum van de in dat artikel
      het eerst genoemde uitkeringen ontstaan recht op een arbeidsongeschiktheidsuitkering – geschiedt de toekenning van
      de arbeidsongeschiktheidsuitkering door het Uitvoeringsinstituut werknemersverzekeringen:

      a. indien het betreft aansluiting op een uitkering, als bedoeld in artikel 16 van de Ongevallenwet 1921,

      b. indien het betreft aansluiting op een uitkering, als bedoeld in artikel 37 van de Land- en Tuinbouwongevallenwet
      1922,

      c. indien het betreft aansluiting op een uitkering, als bedoeld in artikel 2, eerste lid, onder *a*, van de
      Zeeongevallenwet 1919.


      [ref1]: https://wetten.overheid.nl/BWBR0002551#Artikel13
