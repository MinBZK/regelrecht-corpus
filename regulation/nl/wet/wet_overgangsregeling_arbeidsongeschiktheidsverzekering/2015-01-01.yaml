  - number: '11'
    text: |-
      1 Ten aanzien van degene, bedoeld in [artikel 3][ref1], op wie het bepaalde in artikel 14, tweede lid, van de
      Interimwet invaliditeitsrentetrekkers van toepassing was op de dag, voorafgaande aan die, met ingang waarvan die
      wet is ingetrokken, terwijl op eerstbedoelde dag de in het tweede lid van laatstgenoemd artikel gestelde termijn
      van acht weken nog niet was verstreken, wordt, zolang vorengenoemde termijn nog niet is verstreken en behoudens
      in het geval, dat [artikel 28][ref2] van toepassing is, bij de vaststelling van de mate van arbeidsongeschiktheid
      de arbeidsongeschiktheid slechts in aanmerking genomen, voor zover zij voor de toepassing van de Interimwet
      invaliditeitsrentetrekkers bij de indeling in een invaliditeitsklasse reeds in aanmerking is genomen.

      2 Behoudens in het geval dat [artikel 28][ref3] van toepassing is, wordt, wanneer in de gevallen, bedoeld in het
      vorige lid, de toegenomen arbeidsongeschiktheid onafgebroken acht weken heeft geduurd, bij de vaststelling van de
      mate van arbeidsongeschiktheid met de toegenomen arbeidsongeschiktheid rekening gehouden met ingang van de dag, met
      ingang waarvan de arbeidsongeschiktheidsuitkering wordt toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002551#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002551#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002551#Artikel28
