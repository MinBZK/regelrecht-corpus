        paragraaf: '4'
  - number: '34'
    text: |-
      1 Het bedrag van de arbeidsongeschiktheidsuitkering, welke is ontleend dan wel mede is ontleend aan
      [artikel 14][ref1] of [15][ref2], onderscheidenlijk het bedrag van de arbeidsongeschiktheidsuitkering
      van degene, ten aanzien van wie [artikel 6, vierde lid][ref3], [artikel 7, tweede lid][ref4], of
      [artikel 11, eerste lid, van de Liquidatiewet ongevallenwetten][ref5] toepassing vindt, wordt, zolang de uitkering
      als bedoeld in [artikel 4][ref6], [5][ref7], [6][ref8] of [7][ref9] van die wet, waarop de betrokkene op de dag,
      met ingang van welke [artikel 10, eerste of tweede lid][ref10], onderscheidenlijk [artikel 6, vierde lid][ref11],
      [artikel 7, tweede lid][ref12], of [artikel 11, eerste lid][ref13], van die wet toepassing vindt, recht zou hebben
      gehad, indien dat artikel niet van toepassing zou zijn geweest, niet in verband met verandering in zijn toestand
      zou zijn verlaagd, niet lager gesteld dan het bedrag van die uitkering.

      2 Indien op de dag, met ingang van welke [artikel 10, eerste of tweede lid][ref14],
      onderscheidenlijk [artikel 6, vierde lid][ref15], [artikel 7, tweede lid][ref16], of
      [artikel 11, eerste lid, van de Liquidatiewet ongevallenwetten][ref17] toepassing vindt, de termijn, bedoeld
      in [artikel 32, tweede lid][ref18], nog niet is verstreken, geldt met ingang van de eerste dag, liggende na
      die termijn, voor de toepassing van het bepaalde in het vorige lid als bedrag van de uitkering, waarop de
      betrokkene op eerstgenoemde dag recht zou hebben gehad, indien [artikel 10, eerste of tweede lid][ref19],
      onderscheidenlijk [artikel 6, vierde lid][ref20], [artikel 7, tweede lid][ref21], of
      [artikel 11, eerste lid, van de Liquidatiewet ongevallenwetten][ref22] niet van toepassing zou zijn geweest, het
      bedrag, waarop de betrokkene, indien dat artikel niet op hem van toepassing zou zijn geweest, op de eerste dag na
      genoemde termijn recht zou hebben gehad.

      3 [Artikel 32, derde lid][ref23], is van toepassing.

      4 Indien de uitkering als bedoeld in het eerste lid, waarop de betrokkene op de dag, met ingang van
      welke [artikel 10, eerste of tweede lid][ref24], onderscheidenlijk [artikel 6, vierde lid][ref25],
      [artikel 7, tweede lid][ref26], of [artikel 11, eerste lid, van de Liquidatiewet ongevallenwetten][ref27]
      toepassing vindt, recht zou hebben gehad, indien dat artikel niet van toepassing zou zijn
      geweest, na die dag uitsluitend in verband met de wijziging van de omstandigheden als in de
      laatste [volzin van het derde lid van artikel 32][ref28] bedoeld zou zijn verlaagd, indien
      [artikel 10, eerste of tweede lid][ref29], onderscheidenlijk [artikel 6, vierde lid][ref30],
      [artikel 7, tweede lid][ref31], of [artikel 11, eerste lid, van de Liquidatiewet ongevallenwetten][ref32] niet
      van toepassing zou zijn geweest, geldt met ingang van de dag, waarop die verlaging zou zijn ingegaan, voor de
      toepassing van het bepaalde in het eerste lid als bedrag van de uitkering, waarop de betrokkene op de dag, met
      ingang van welke [artikel 10, eerste of tweede lid][ref33], onderscheidenlijk [artikel 6, vierde lid][ref34],
      [artikel 7, tweede lid][ref35], of [artikel 11, eerste lid, van de Liquidatiewet ongevallenwetten][ref36]
      toepassing vindt, recht zou hebben gehad, indien dat artikel niet van toepassing zou zijn geweest, het bedrag van
      de uitkering, waarop de betrokkene, indien dat artikel niet van toepassing zou zijn geweest, met ingang van de
      dag, waarop bedoelde verlaging zou zijn ingegaan, op grond van het bepaalde in [artikel 4][ref37], [5][ref38],
      [6][ref39] of [7][ref40] van genoemde wet recht zou hebben gehad.


