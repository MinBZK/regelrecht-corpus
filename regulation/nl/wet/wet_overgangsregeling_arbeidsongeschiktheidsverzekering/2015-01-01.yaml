  - number: '14'
    text: |-
      Degene, die op grond van het bepaalde in [artikel 10, eerste lid, van de Liquidatiewet ongevallenwetten][ref1],
      geen recht meer heeft op een uitkering, ontleend aan [artikel 4][ref2], [5][ref3] of [6][ref4] van die wet,
      heeft, tenzij het recht op die uitkering overeenkomstig het bepaalde in [artikel 17][ref5] van die wet wordt
      afgekocht, recht op toekenning van arbeidsongeschiktheidsuitkering.


