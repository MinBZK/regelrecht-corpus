  - number: '37'
    text: |-
      1 Indien een persoon, ten aanzien van wie [artikel 32][ref1], [33][ref2], [34][ref3], [35][ref4] of [36][ref5]
      van toepassing is, arbeidsongeschiktheidsuitkering ontleent of mede ontleent aan [artikel 3][ref6] of [4][ref7],
      dan wel arbeidsongeschiktheidsuitkering aan laatstgenoemd artikel zou hebben ontleend of mede zou hebben
      ontleend, indien het tweede lid van dat artikel niet op hem van toepassing zou zijn geweest, wordt, indien ten
      aanzien van hem het bepaalde in artikel 53 van de Liquidatiewet invaliditeitswetten van toepassing is, het in
      [artikel 32][ref8], [33][ref9], [34][ref10], [35][ref11] of [36][ref12] gegarandeerde bedrag verhoogd met 1/260 van
      het jaarbedrag van de invaliditeitsrente, vrije invaliditeitsrente of invaliditeitsuitkering als bedoeld in artikel
      53 van laatstgenoemde wet, zolang de arbeidsongeschiktheid sedert de dag, waarop de arbeidsongeschiktheidsuitkering
      is ingegaan, ten minste 65% bedraagt.

      2 Indien een fonds, als bedoeld in artikel 54, tweede lid, van de Liquidatiewet invaliditeitswetten, gebruik
      maakt van de in dat lid gegeven bevoegdheid, vindt de garantie, vervat in het vorige lid, ten aanzien van
      arbeidsongeschiktheidsuitkeringen, toegekend aan personen als bedoeld in artikel 54, tweede lid, van de
      Liquidatiewet invaliditeitswetten, overeenkomstige toepassing tot 1/260 van het jaarbedrag van de in laatstgenoemd
      lid bedoelde invaliditeitsuitkeringen, onderscheidenlijk invaliditeitsrenten.

      3 Indien ten aanzien van degene, op wie het bepaalde in het eerste of het tweede lid van toepassing is, op de dag,
      voorafgaande aan die, met ingang van welke de Interimwet invaliditeitsrentetrekkers werd ingetrokken, het bepaalde
      in artikel 52, zesde lid, van die wet toepassing vond, wordt het in de vorige leden gegarandeerde bedrag verhoogd
      met 1/260 van het jaarbedrag, waarop de betrokkene ingevolge laatstbedoelde bepaling aanspraak zou hebben gehad,
      indien de Interimwet invaliditeitsrentetrekkers niet zou zijn ingetrokken.


