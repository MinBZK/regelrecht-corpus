        artikel: '19'
  - number: '5'
    text: |-
      1 Bij toekenning van een arbeidsongeschiktheidsuitkering op grond van het bepaalde in [artikel 3][ref1] of
      [4][ref2] wordt het daaraan ten grondslag te leggen dagloon gesteld op het hoogste van de bedragen, welke worden
      verkregen door het produkt van 106/80, 106/65, 106/50 onderscheidenlijk 106/40 maal onderscheidenlijk de in artikel
      5, onder a, b, c en d, van de Interimwet invaliditeitsrentetrekkers bedoelde bedragen, zoals deze laatstelijk zijn
      vastgesteld, te delen door 260.

      2 Zolang degene, aan wie arbeidsongeschiktheidsuitkering is toegekend op grond van het bepaalde in
      [artikel 3][ref3] of [4][ref4], niet gehuwd, noch gehuwd geweest is en de leeftijd van 23 jaar nog niet
      heeft bereikt, wordt het in het vorige lid bedoelde dagloon, eventueel verhoogd of verlaagd overeenkomstig de
      [artikelen 23][ref5], [24][ref6], [25][ref7] en [27][ref8] van deze wet en/of [artikel 15 van de Wet][ref9], met
      10% verminderd voor elk jaar of gedeelte daarvan, dat de betrokkene jonger is dan 23 jaar.

      3 Onze Minister kan regelen stellen ingevolge welke kan worden afgeweken van het bepaalde in het eerste lid ten
      aanzien van gehuwde vrouwen.


