    text: |-
      Degene, die overeenkomstig het bepaalde in [artikel 7 van de Liquidatiewet ongevallenwetten][ref1] recht heeft op
      een uitkering als bedoeld in artikel 16 van de Ongevallenwet 1921, artikel 37 van de Land- en Tuinbouwongevallenwet
      1922 of artikel 2, eerste lid, onder *a,* van de Zeeongevallenwet 1919 heeft, tenzij het recht op die uitkering
      overeenkomstig het bepaalde in [artikel 17 van de Liquidatiewet ongevallenwetten][ref2] wordt afgekocht, recht op
      toekenning van arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel7
