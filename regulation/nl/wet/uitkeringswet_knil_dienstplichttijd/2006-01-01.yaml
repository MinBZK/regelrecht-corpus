---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: uitkeringswet_knil_dienstplichttijd
regulatory_layer: WET
publication_date: '2007-11-13'
valid_from: '2006-01-01'
bwb_id: BWBR0006349
url: https://wetten.overheid.nl/BWBR0006349/2006-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een voorziening te treffen houdende een eenmalige
    financiële compensatie voor militairen die ten minste vijf jaren als dienst- of reserveplichtige bij het voormalige
    KNIL in werkelijke dienst zijn geweest en daarvoor in de overheidspensioenwetgeving geen vergelding ontvangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006349/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006349/2006-01-01#Artikel1
  - number: 1.a
    text: |-
      militair: degene die onder de vlag van het Koninkrijk der Nederlanden de dienst- of reserveplicht bij het
      Koninklijk Nederlands-Indisch Leger/Koninklijk Nederlands-Indonesisch Leger (KNIL), dan wel krachtens het
      Dienstplichtbesluit voor Nederlands-Indië heeft vervuld, tijdens die vervulling Nederlander was of in die periode
      geen Nederlander was maar thans op grond van de [Wet betreffende de positie van Molukkers][ref1] bij de toepassing
      van de Nederlandse wetgeving als Nederlander wordt behandeld, en die na afloop van zijn diensttijd naar Nederland
      is vertrokken of teruggekeerd dan wel door de zorg van de Nederlandse regering is overgebracht naar Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0003052
    url: https://wetten.overheid.nl/BWBR0006349/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003052
  - number: 1.b
    text: |-
      werkelijke dienst: de door de militair vóór 26 juli 1950 bij het KNIL doorgebrachte diensttijd dan wel krachtens
      het Dienstplichtbesluit voor Nederlands-Indië doorgebrachte diensttijd;
    url: https://wetten.overheid.nl/BWBR0006349/2006-01-01#Artikel1
  - number: 1.c
    text: |-
      weduwe: degene die in het tijdvak van de werkelijke dienst met de militair was gehuwd en die naar Nederland is
      vertrokken of teruggekeerd dan wel door de zorg van de Nederlandse regering is overgebracht naar Nederland.
    url: https://wetten.overheid.nl/BWBR0006349/2006-01-01#Artikel1
  - number: 2.a
    text: |-
      De gewezen militair die een werkelijke dienst aan kan wijzen van ten minste vijf jaren en voor wie geen
      recht of uitzicht bestaat op vergelding van die tijd met enig overheidspensioen en die in de periode voor de
      inwerkingtreding van deze wet tenminste één jaar onafgebroken in Nederland gevestigd is geweest, heeft aanspraak op
      een eenmalige uitkering ten bedrage van f 7500,-.
    url: https://wetten.overheid.nl/BWBR0006349/2006-01-01#Artikel2
  - number: 2.b
    text: |-
      De in het vorige lid bedoelde aanspraak op een eenmalige uitkering vervalt indien op grond van een
      gecombineerde Nederlandse en KNIL-dienstplichttijd reeds een uitkering is verstrekt krachtens de
      [Uitkeringswet financiële compensatie langdurige militaire dienst][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005569
    url: https://wetten.overheid.nl/BWBR0006349/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005569
  - number: '3'
    text: |-
      Indien de in [artikel 2][ref1] genoemde aanspraak in verband met het overlijden van de militair niet kan worden
      geëffectueerd, heeft de weduwe recht op een eenmalige uitkering, gelijk aan het bedrag dat wordt gevonden door het
      bedrag van f 7500,- te vermenigvuldigen met een breuk, waarvan de teller gelijk is aan dat deel van de werkelijke
      dienst waarin zij met de militair gehuwd is geweest en de noemer gelijk is aan de werkelijke dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0006349#Artikel2
    url: https://wetten.overheid.nl/BWBR0006349/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006349
        artikel: '2'
  - number: '4'
    text: |-
      Een uitkering ingevolge deze wet wordt door Onze Minister van Binnenlandse Zaken op aanvraag verleend. De aanvraag
      moet schriftelijk worden ingediend en uiterlijk binnen twee jaren na de datum van inwerkingtreding van deze wet bij
      Onze Minister van Binnenlandse Zaken zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0006349/2006-01-01#Artikel4
  - number: '5'
    text: |-
      De over de uitkering verschuldigde belasting ingevolge de [Wet inkomstenbelasting 2001][ref1],
      de [Wet op de loonbelasting 1964][ref2] en premie voor de volksverzekeringen ingevolge de
      [Wet financiering sociale verzekeringen][ref3] komen ten laste van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0002471
      [ref3]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0006349/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0002471
      - id: ref3
        bwb_id: BWBR0017745
  - number: '6'
    text: |-
      De uitkering blijft buiten beschouwing bij de verlening van bijstand ingevolge de [Wet werk en bijstand][ref1] en
      andere, op het inkomen afgestemde publiekrechtelijke uitkeringen of verstrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0006349/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: '7'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0006349/2006-01-01#Artikel7
  - number: '8'
    text: 'Deze wet wordt aangehaald als: Uitkeringswet KNIL-dienstplichttijd.'
    url: https://wetten.overheid.nl/BWBR0006349/2006-01-01#Artikel8
