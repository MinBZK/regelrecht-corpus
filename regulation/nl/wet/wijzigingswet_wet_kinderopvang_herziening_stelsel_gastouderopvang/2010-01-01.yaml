    text: |-
      Het college van burgemeester en wethouders van de gemeente van vestiging houdt een register bij van op grond
      van [artikel 45, eerste en tweede lid, van de Wet kinderopvang][ref1] gemelde kindercentra, gastouderbureaus en
      voorzieningen voor gastouderopvang. In het register worden na de melding onverwijld opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel45
    url: https://wetten.overheid.nl/BWBR0026299/2010-01-01#ArtikelIa
