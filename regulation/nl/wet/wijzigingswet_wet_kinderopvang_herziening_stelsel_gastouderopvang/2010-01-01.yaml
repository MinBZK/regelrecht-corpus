preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de gastouderopvang op te splitsen in twee nieuwe
    vormen van kleinschalige opvang, het toezicht op de kinderopvang te verbeteren, misbruik en oneigenlijk gebruik
    terug te dringen en het stelsel van de Wet kinderopvang toegankelijk en beheersbaar te houden en dat daartoe de Wet
    kinderopvang wordt gewijzigd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0026299/2010-01-01#ArtikelAanhef
