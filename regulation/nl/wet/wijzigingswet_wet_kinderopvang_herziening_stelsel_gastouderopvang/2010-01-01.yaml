  - number: Ia.A.2
    text: |-
      Bij ministeriële regeling van Onze Minister van Onderwijs, Cultuur en Wetenschap kunnen nadere regels worden
      gesteld over de op te nemen gegevens, bedoeld onder 1 sub b.
    url: https://wetten.overheid.nl/BWBR0026299/2010-01-01#ArtikelIa
  - number: Ia.A.3
    text: |-
      Het college van burgemeester en wethouders deelt de houder, bedoeld in
      [artikel 1, eerste lid, van de Wet kinderopvang][ref1] schriftelijk mede dat inschrijving van het kindercentrum,
      het gastouderbureau onderscheidenlijk de voorziening voor gastouderopvang in het register heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0026299/2010-01-01#ArtikelIa
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
  - number: Ia.A.4
    text: |-
      Het college van burgemeester en wethouders maakt de opneming in het register bekend in een lokaal verspreid dag-,
      nieuws- of huis- aan-huisblad.
    url: https://wetten.overheid.nl/BWBR0026299/2010-01-01#ArtikelIa
  - number: Ia.A.5
    text: |-
      Bij ministeriële regeling van Onze Minister van Onderwijs, Cultuur en Wetenschap kunnen regels worden gesteld
      omtrent de vastlegging van gegevens in het register, de verwijdering van gegevens uit het register, de wijze waarop
      verbetering van onjuistheden in het register plaatsvindt en de verstrekking van gegevens.
    url: https://wetten.overheid.nl/BWBR0026299/2010-01-01#ArtikelIa
  - number: Ia.A.6
    text: |-
      Onder het register kinderopvang, bedoeld in [artikel 1, eerste lid, van de Wet kinderopvang][ref1] zoals luidend
      ingevolge [artikel I, onderdeel A][ref2], wordt voor de toepassing van het bepaalde bij en krachtens de Wet
      kinderopvang verstaan het onder 1 bedoelde register. Onder een geregistreerd kindercentrum, een geregistreerd
      gastouderbureau of een geregistreerde voorziening voor gastouderopvang als bedoeld in de [Wet kinderopvang][ref3]
      wordt voor de toepassing van het bepaalde bij en krachtens de [Wet kinderopvang][ref4] verstaan een ingevolge
      het bepaalde onder 1 geregistreerd kindercentrum of gastouderbureau, onderscheidenlijk een ingevolge onder 1
      geregistreerde voorziening voor gastouderopvang.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0026299#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0017017
