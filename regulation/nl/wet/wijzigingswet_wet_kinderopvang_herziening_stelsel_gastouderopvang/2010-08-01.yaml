preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de gastouderopvang op te splitsen in twee nieuwe
    vormen van kleinschalige opvang, het toezicht op de kinderopvang te verbeteren, misbruik en oneigenlijk gebruik
    terug te dringen en het stelsel van de Wet kinderopvang toegankelijk en beheersbaar te houden en dat daartoe de Wet
    kinderopvang wordt gewijzigd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0026299/2010-08-01#ArtikelAanhef
articles:
  - number: Ia
    text: |-
      A Indien [artikel I, onderdeel H][ref1], op een later tijdstip in werking treedt dan
      [artikel I, onderdelen B en G][ref2], gelden tot dat latere tijdstip met ingang van het tijdstip waarop
      [artikel I, onderdelen B en G][ref3], in werking treden, de volgende voorschriften:

      1. Het college van burgemeester en wethouders van de gemeente van vestiging houdt een register bij van op grond
      van [artikel 1.45, eerste en tweede lid, van de Wet kinderopvang][ref4] gemelde kindercentra, gastouderbureaus en
      voorzieningen voor gastouderopvang. In het register worden na de melding onverwijld opgenomen:

      a. de gegevens, bedoeld in [paragraaf 3, van de Regeling Wet kinderopvang][ref5], zoals [die paragraaf][ref6]
      luidde op de dag voorafgaand aan de inwerkingtreding van [artikel I, onderdelen B en G][ref7];

      b. de gegevens met betrekking tot gastouders, bedoeld in [artikel 1.45, tweede lid, van de Wet kinderopvang][ref8].

      2. Bij ministeriële regeling van Onze Minister van Onderwijs, Cultuur en Wetenschap kunnen nadere regels worden
      gesteld over de op te nemen gegevens, bedoeld onder 1 sub b.

      3. Het college van burgemeester en wethouders deelt de houder, bedoeld in
      [artikel 1, eerste lid, van de Wet kinderopvang][ref9] schriftelijk mede dat inschrijving van het kindercentrum,
      het gastouderbureau onderscheidenlijk de voorziening voor gastouderopvang in het register heeft plaatsgevonden.

      4. Het college van burgemeester en wethouders maakt de opneming in het register bekend in een lokaal verspreid
      dag-, nieuws- of huis- aan-huisblad.

      5. Bij ministeriële regeling van Onze Minister van Onderwijs, Cultuur en Wetenschap kunnen regels worden gesteld
      omtrent de vastlegging van gegevens in het register, de verwijdering van gegevens uit het register, de wijze waarop
      verbetering van onjuistheden in het register plaatsvindt en de verstrekking van gegevens.

      6. Onder het register kinderopvang, bedoeld in [artikel 1.1, eerste lid, van de Wet kinderopvang][ref10] zoals
      luidend ingevolge [artikel I, onderdeel A][ref11], wordt voor de toepassing van het bepaalde bij en krachtens de
      Wet kinderopvang verstaan het onder 1 bedoelde register. Onder een geregistreerd kindercentrum, een geregistreerd
      gastouderbureau of een geregistreerde voorziening voor gastouderopvang als bedoeld in de [Wet kinderopvang][ref12]
      wordt voor de toepassing van het bepaalde bij en krachtens de [Wet kinderopvang][ref13] verstaan een ingevolge
      het bepaalde onder 1 geregistreerd kindercentrum of gastouderbureau, onderscheidenlijk een ingevolge onder 1
      geregistreerde voorziening voor gastouderopvang.

      7. [Artikel 1.45, vierde lid][ref14], is niet van toepassing.

      8. Het register ligt ter gemeentesecretarie kosteloos voor een ieder ter inzage.

      B

      C


