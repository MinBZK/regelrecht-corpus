---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_gebruik_friese_taal
regulatory_layer: WET
publication_date: '2013-10-17'
valid_from: '2024-01-01'
bwb_id: BWBR0034047
url: https://wetten.overheid.nl/BWBR0034047/2024-01-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in een taalwet de positie van de Friese taal in het
    bestuurlijk verkeer en in het rechtsverkeer te verankeren en de gelijke rechten van de Nederlandse taal en de
    Friese taal binnen de provincie Fryslân te waarborgen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.'
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel1
  - number: '2'
    text: De officiële talen in de provincie Fryslân zijn het Nederlands en het Fries.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel2
  - number: 2a
    text: |-
      Gelet op de gezamenlijke verantwoordelijkheid en zorgplicht voor de Friese taal en cultuur maken het Rijk en de
      provincie Fryslân periodiek bestuursafspraken ter uitwerking van de verantwoordelijkheid inzake de Friese taal
      en cultuur. Vanwege de internationale verdragsafspraken op dit terrein kunnen de bestuursafspraken ook voor de
      Friese taal en cultuur relevante beleidsterreinen omvatten die liggen buiten het gebruik van de Friese taal in het
      bestuurlijk verkeer en in het rechtsverkeer.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel2a
  - number: '3.1'
    text: |-
      Een ieder kan de Friese taal gebruiken in het verkeer met bestuursorganen, voor zover deze in de provincie Fryslân
      zijn gevestigd, alsmede met de onder hun verantwoordelijkheid werkzame personen.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel3
  - number: '3.2'
    text: |-
      Het eerste lid geldt niet indien het bestuursorgaan heeft verzocht de Nederlandse taal te gebruiken op de grond dat
      het gebruik van de Friese taal tot een onevenredige belasting van het bestuurlijk verkeer zou leiden.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel3
  - number: '4.1'
    text: |-
      Bestuursorganen en de onder hun verantwoordelijkheid werkzame personen kunnen in het verkeer binnen de provincie
      Fryslân de Friese taal gebruiken.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel4
  - number: '4.2'
    text: |-
      Het eerste lid geldt niet indien een wederpartij heeft verzocht de Nederlandse taal te gebruiken op de grond dat
      het gebruik van de Friese taal tot een onbevredigend verloop van het mondeling verkeer zou leiden.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel4
  - number: '5.1'
    text: |-
      In de provincie Fryslân gevestigde bestuursorganen die niet tot de centrale overheid behoren, stellen regels op
      over het gebruik van de Friese taal in schriftelijke stukken en in het mondeling verkeer. De regels bevatten in
      ieder geval bepalingen gericht op het versterken van de positie van de Friese taal binnen het werkgebied van het
      betreffende bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel5
  - number: '5.2'
    text: |-
      In aanvulling op de in het eerste lid bedoelde regels, stellen deze bestuursorganen tevens een beleidsplan inzake
      het gebruik van de Friese taal op.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel5
  - number: '5.3'
    text: |-
      De bestuursorganen van de gemeenten Ameland, Schiermonnikoog, Terschelling, Vlieland en Weststellingwerf zijn
      vrijgesteld van de verplichtingen, bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel5
  - number: '5.4'
    text: |-
      Bestuursorganen die niet tot de centrale overheid behoren en die niet in de provincie Fryslân gevestigd zijn,
      waarvan het werkterrein zich uitstrekt tot de provincie Fryslân of een deel daarvan, kunnen regels stellen over het
      gebruik van de Friese taal, in het bijzonder in schriftelijke stukken.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister die het aangaat, kan voor onderdelen van de centrale overheid waarvan het werkterrein zich uitstrekt
      tot de provincie Fryslân of een deel daarvan, regels stellen over het gebruik van de Friese taal in schriftelijke
      stukken en in het mondeling verkeer.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel6
  - number: '6.2'
    text: |-
      Ter uitvoering van het eerste lid kan een onderdeel van de centrale overheid een beleidsplan opstellen inzake het
      gebruik van de Friese taal.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel6
  - number: '7.1'
    text: 'Een schriftelijk stuk in de Friese taal wordt tevens in de Nederlandse taal opgesteld, indien het:'
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel7
  - number: 7.1.a
    text: |-
      bestemd of mede bestemd is voor buiten de provincie Fryslân gevestigde bestuursorganen of bestuursorganen van de
      centrale overheid; of
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel7
  - number: 7.1.b
    text: algemeen verbindende voorschriften of beleidsregels inhoudt.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel7
  - number: '7.2'
    text: |-
      De bekendmaking, mededeling of terinzagelegging van een schriftelijk stuk als bedoeld in het eerste lid geschiedt
      in ieder geval ook in de Nederlandse taal, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte
      bestaat.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel7
  - number: '8.1'
    text: |-
      Indien een schriftelijk stuk in de Friese taal is opgesteld, verstrekt het bestuursorgaan daarvan op verzoek een
      vertaling in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel8
  - number: '8.2'
    text: Het bestuursorgaan kan voor het vertalen een vergoeding van ten hoogste de kosten verlangen.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel8
  - number: '8.3'
    text: 'Voor het vertalen kan geen vergoeding worden verlangd, indien het schriftelijk stuk:'
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel8
  - number: 8.3.a
    text: 'de notulen van de vergadering van een vertegenwoordigend orgaan inhoudt en:'
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel8
  - number: 8.3.a.1.
    text: het belang van de verzoeker rechtstreeks bij het genotuleerde is betrokken, of
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel8
  - number: 8.3.a.2.
    text: de vaststelling van algemeen verbindende voorschriften of beleidsregels betreft; of
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel8
  - number: 8.3.b
    text: een besluit of andere handeling inhoudt waarbij de verzoeker belanghebbende is.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel8
  - number: '9.1'
    text: |-
      Een ieder kan in vergaderingen van in de provincie Fryslân gevestigde vertegenwoordigende organen de Friese taal
      gebruiken.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel9
  - number: '9.2'
    text: Hetgeen in de Friese taal is gezegd, wordt in de Friese taal genotuleerd.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel9
  - number: '10.1'
    text: |-
      Hij die ter uitvoering van een wettelijk voorschrift mondeling een eed, belofte of bevestiging moet afleggen, is
      bevoegd in plaats van de wettelijk voorgeschreven woorden de daarmede in de Friese taal overeenkomende woorden uit
      te spreken.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel10
  - number: '10.2'
    text: 'In het geval, bedoeld in het eerste lid, treden:'
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel10
  - number: 10.2.a
    text: |-
      indien een eed wordt afgelegd, voor de woorden: «Zo waarlijk helpe mij God Almachtig» in de plaats de woorden: «Sa
      wier helpe my God Almachtich»;
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel10
  - number: 10.2.b
    text: 'indien een belofte wordt afgelegd, voor de woorden: «Dat beloof ik» in de plaats de woorden: «Dat ûnthjit ik»;'
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel10
  - number: 10.2.c
    text: |-
      indien een bevestiging wordt afgelegd, voor de woorden: «Dat verklaar ik» in de plaats de woorden: «Dat ferklearje
      ik».
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel10
  - number: '11'
    text: |-
      Een persoon die in de provincie Fryslân woont, feitelijk verblijf houdt of zetel heeft en die ter terechtzitting
      bij de rechtbank Noord-Nederland of het gerechtshof Arnhem-Leeuwarden van ambtswege het woord voert dan wel
      verplicht is zich aan een verhoor te onderwerpen of bevoegd is het woord te voeren, is bevoegd zich te bedienen van
      de Friese taal.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel11
  - number: '12.1'
    text: |-
      Indien een verdachte, partij, getuige of belanghebbende zich ter terechtzitting op de voet van [artikel 11][ref1]
      wil bedienen van de Friese taal, bepaalt de rechter die de leiding van de zitting heeft ambtshalve of op verzoek
      zonodig dat bijstand wordt verleend door een tolk. [Artikel 276 van het Wetboek van Strafvordering][ref2] is van
      toepassing indien het onderzoek ter terechtzitting plaatsvindt in het kader van een strafzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0034047#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel276
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0034047
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '276'
  - number: '12.2'
    text: De vergoeding aan de tolk die ingevolge het eerste lid is opgetreden, komt ten laste van het Rijk.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel12
  - number: '12.3'
    text: |-
      In afwijking van het tweede lid kan de rechter bepalen dat in een civiele zaak de vergoeding aan de tolk ten laste
      komt van degene op wiens verzoek bijstand door een tolk wordt verleend, indien achteraf blijkt dat de kosten voor
      bijstand door een tolk, nodeloos zijn aangewend.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel12
  - number: '13'
    text: |-
      Indien een verdachte of getuige zich ter terechtzitting in een strafzaak buiten de gevallen bedoeld in
      [artikel 11][ref1] wil bedienen van de Friese taal en aannemelijk maakt dat hij zich in het Nederlands onvoldoende
      kan uitdrukken, bepaalt de rechter die de leiding van de zitting heeft, indien hij zulks wenselijk acht, dat
      bijstand wordt verleend door een tolk.[ Artikel 276 van het Wetboek van Strafvordering][ref2] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034047#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel276
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0034047
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '276'
  - number: '14.1'
    text: |-
      Hetgeen in de Friese taal is gesproken wordt, indien het in het proces-verbaal wordt opgenomen, in die taal
      vermeld. De rechter kan bepalen dat een vertaling in het Nederlands wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel14
  - number: '14.2'
    text: |-
      Indien ingevolge [artikel 13][ref1] in een strafzaak gebruik is gemaakt van de Friese taal, vindt opneming in het
      proces-verbaal in het Nederlands plaats en wordt daarin aangetekend dat de Friese taal is gebezigd.


      [ref1]: https://wetten.overheid.nl/BWBR0034047#Artikel13
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0034047
        artikel: '13'
        hoofdstuk: '3'
  - number: '15.1'
    text: |-
      In strafzaken, civiele zaken en bestuursrechtelijke zaken die aanhangig zijn bij de rechtbank Noord-Nederland of
      het gerechtshof Arnhem-Leeuwarden, mogen processtukken, met uitzondering van dagvaardingen in strafzaken, in de
      Friese taal worden gesteld.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel15
  - number: '15.2'
    text: |-
      In dagvaardingen in strafzaken als bedoeld in het eerste lid alsmede in oproepingen of uitnodigingen voor een
      zitting in andere zaken, wordt vermeld dat de verdachte, partij, getuige of belanghebbende het recht heeft om
      op de zitting Fries te spreken indien de betrokkene in de provincie Fryslân woont, feitelijk verblijf houdt of
      zetel heeft. Indien een dergelijke vermelding ontbreekt wordt de behandeling van de zaak slechts voortgezet indien
      aannemelijk is dat de verdachte, partij, getuige of belanghebbende daardoor niet in zijn belangen is geschaad ofwel
      alsnog voldoende gelegenheid heeft gehad om zich op het gebruik van de Friese taal op de zitting voor te bereiden.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel15
  - number: '15.3'
    text: |-
      Indien dat voor een goede beoordeling van in de Friese taal gestelde processtukken als bedoeld in het eerste lid
      wenselijk is, kan de rechter ambtshalve of op verzoek van een van de andere bij de zaak betrokkenen bepalen dat een
      vertaling in het Nederlands wordt opgesteld, die aan de stukken wordt toegevoegd.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel15
  - number: '15.4'
    text: De kosten van een vertaling als bedoeld in het derde lid komen ten laste van het Rijk.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel15
  - number: '15.5'
    text: |-
      In afwijking van het vierde lid kan de rechter bepalen dat in een civiele zaak de kosten van een vertaling ten
      laste komen van de bij de zaak betrokkene die om de vertaling in het Nederlands heeft verzocht, indien achteraf
      blijkt dat de kosten nodeloos zijn aangewend.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel15
  - number: '16.1'
    text: |-
      Indien stukken of opgaven, welke ingevolge wettelijk voorschrift in openbare registers moeten worden ingeschreven,
      in de Friese taal zijn gesteld, wordt tevens de overlegging gevorderd van getrouwe vertalingen in het Nederlands,
      vervaardigd en voor overeenstemmend verklaard door een voor de Friese taal als bevoegd toegelaten beëdigde vertaler
      of, indien de inschrijving betrekking heeft op een notariële akte, door de notaris, die de akte heeft verleden.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel16
  - number: '16.2'
    text: |-
      De in de Friese taal gestelde stukken of opgaven worden samen met de vertalingen ingeschreven in het register.
      Tenzij in de stukken of opgaven anders is bepaald, geldt de tekst van de Nederlandse vertaling.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel16
  - number: '16.3'
    text: |-
      Indien het een notariële akte in de Friese taal betreft van oprichting van een vereniging of stichting, dan wel
      houdende de statuten van een dergelijk rechtspersoon, kan in afwijking van het eerste en tweede lid worden afgezien
      van een vertaling in het Nederlands indien de vereniging of stichting haar werkzaamheden geheel of gedeeltelijk in
      de provincie Fryslân verricht.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel16
  - number: '16.4'
    text: |-
      In afwijking van het eerste lid worden in de provincie Fryslân akten van de burgerlijke stand zowel in de Friese
      taal als in het Nederlands opgemaakt.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel16
  - number: '17.1'
    text: |-
      In alle gevallen, waarin een ontwerp van een akte de goedkeuring behoeft van een rechter, kan de definitieve akte
      in de Friese taal worden opgemaakt, mits daaronder wordt gesteld een verklaring van een voor de Friese taal als
      bevoegd toegelaten beëdigde vertaler waaruit blijkt, dat de akte een getrouwe vertaling is van het door de rechter
      goedgekeurde ontwerp. Wordt de akte notarieel verleden, dan kan de verklaring van de beëdigde vertaler worden
      vervangen door een verklaring van de notaris, die de akte verlijdt.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel17
  - number: '17.2'
    text: |-
      Van een ontwerp van een akte in het Nederlands kan worden afgezien indien het ontwerp van een akte wordt voorgelegd
      aan een rechter van de rechtbank Noord-Nederland of het gerechtshof Arnhem-Leeuwarden.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel17
  - number: '18.1'
    text: 'Er is een Orgaan voor de Friese taal, hierna te noemen: het Orgaan.'
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel18
  - number: '18.2'
    text: Het Orgaan is gevestigd te Leeuwarden.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel18
  - number: '19.1'
    text: |-
      Het Orgaan heeft tot taak de gelijke positie van de Friese taal en de Nederlandse taal in de provincie Fryslân
      te bevorderen.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel19
  - number: '19.2'
    text: 'Het Orgaan doet dit in elk geval door:'
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel19
  - number: 19.2.a
    text: |-
      te rapporteren over de behoeften en de wensen ten aanzien van de Friese taal en cultuur in relatie tot deze wet
      alsmede tot het Europees Handvest voor regionale talen of talen van minderheden en het Kaderverdrag inzake de
      bescherming van nationale minderheden aan:
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel19
  - number: 19.2.a.1°
    text: Onze Minister;
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel19
  - number: 19.2.a.2°
    text: |-
      andere ministers, voor zover die verantwoordelijk zijn voor onderdelen van de centrale overheid die in de provincie
      Fryslân gevestigd zijn dan wel de provincie Fryslân als werkgebied hebben;
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel19
  - number: 19.2.a.3°
    text: |-
      andere bestuursorganen, voor zover die in de provincie Fryslân gevestigd zijn dan wel de provincie Fryslân als
      werkgebied hebben; en
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel19
  - number: 19.2.a.4°
    text: |-
      rechterlijke instanties voor zover die in de provincie Fryslân gevestigd zijn dan wel de provincie Fryslân als
      rechtsgebied hebben;
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel19
  - number: 19.2.b
    text: |-
      te adviseren over de totstandkoming en de uitvoering van de Bestuursafspraak Friese taal en cultuur en de
      uitvoeringsconvenanten, aan:
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel19
  - number: 19.2.b.1°
    text: Onze Minister; en
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel19
  - number: 19.2.b.2°
    text: gedeputeerde staten van de provincie Fryslân;
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel19
  - number: 19.2.c
    text: |-
      ondersteuning te bieden bij het opstellen van regels en beleidsplannen als bedoeld in de [artikelen 5][ref1] en
      [6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034047#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0034047#Artikel6
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0034047
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034047
        artikel: '6'
        hoofdstuk: '2'
  - number: '19.3'
    text: |-
      De in het tweede lid, onder a, onder 1° tot en met 4°, genoemde bestuursorganen en instanties sturen binnen drie
      maanden na ontvangst van de rapportage een reactie aan het Orgaan op de aan hen gerichte rapportage.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel19
  - number: '20.1'
    text: Het Orgaan bestaat uit vijf leden, onder wie een voorzitter en een vicevoorzitter.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel20
  - number: '20.2'
    text: |-
      De voorzitter, vicevoorzitter en overige leden van het Orgaan worden, op voordracht van gedeputeerde staten van de
      provincie Fryslân door Onze Minister benoemd, geschorst en ontslagen. De benoeming geldt voor een periode van ten
      hoogste vier jaar. Herbenoeming is mogelijk voor een periode van ten hoogste vier jaar.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel20
  - number: '20.3'
    text: Het Orgaan kan waarnemers toelaten.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel20
  - number: '21.1'
    text: Het Orgaan heeft een secretaris.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel21
  - number: '21.2'
    text: De secretaris is voor zijn werkzaamheden voor het Orgaan uitsluitend verantwoording schuldig aan het Orgaan.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel21
  - number: '21.3'
    text: Aan de secretaris kunnen andere medewerkers worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel21
  - number: '21.4'
    text: De secretaris en de andere medewerkers zijn geen lid van het Orgaan.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel21
  - number: '21.5'
    text: |-
      Onze Minister benoemt, bevordert, schorst en ontslaat, na overleg met de voorzitter van het Orgaan, de secretaris
      en de andere medewerkers.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel21
  - number: '22'
    text: |-
      Het Orgaan voert de in [artikel 19][ref1] genoemde taken uit op basis van een tweejaarlijks werkprogramma, dat na
      overleg met Onze Minister wordt opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0034047#Artikel19
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0034047
        artikel: '19'
        hoofdstuk: '4'
  - number: '23'
    text: |-
      Het beheer van de bescheiden betreffende de werkzaamheden van het Orgaan geschiedt met inachtneming van de
      beheersregels en het bepaalde bij en krachtens de [Archiefwet 1995 ][ref1]. De bescheiden worden na het beëindigen
      van de werkzaamheden overgedragen aan het archief van het ministerie van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '31'
    text: |-
      Onze Minister draagt zorg voor een vertaling in de Friese taal van deze wet en van de krachtens deze wet
      vastgestelde regelingen en doet daarvan mededeling door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel31
  - number: 31a
    text: |-
      De [artikelen 2:7 tot en met 2:12 van de Algemene wet bestuursrecht][ref1] vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '32'
    text: |-
      De [Wet gebruik Friese taal in het rechtsverkeer][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002219
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002219
  - number: '34'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel34
  - number: '35'
    text: 'Deze wet wordt aangehaald als: Wet gebruik Friese taal.'
    url: https://wetten.overheid.nl/BWBR0034047/2024-01-01#Artikel35
