  - number: '2'
    text: |-
      Deze verordening is van toepassing op landbouwgronden die geheel of gedeeltelijk zijn gelegen binnen het
      grondgebied van de provincie Limburg ten zuiden van de doorgaande wegen Sittard - Wehr (tot grens Nederland-
      Duitsland) en Sittard – Urmond (tot grens Nederland-België).
    url: https://wetten.overheid.nl/BWBR0024328/2009-01-01#Artikel2
  - number: '3'
    text: |-
      De ondernemer is verplicht met betrekking tot elk perceel landbouwgrond onverwijld melding te doen aan de
      secretaris onder opgave van een zo exact mogelijke plaatsaanduiding, indien de lijnvormige of vlakgewijze
      uitspoeling als gevolg van erosie dieper is dan 12 cm. In dat geval is de ondernemer tevens verplicht:

      a. te gedogen dat door de secretaris namens het bestuur aangewezen personen de bij hem in gebruik zijnde
      landbouwgronden aan een onderzoek onderwerpen naar de aanwezigheid van en de oplossing voor de erosie;

      b. alle door de onder a bedoelde personen gewenste gegevens te verstrekken voor zover deze redelijkerwijs relevant
      geacht moeten worden voor het onder a bedoelde onderzoek.
    url: https://wetten.overheid.nl/BWBR0024328/2009-01-01#Artikel3
  - number: '4'
    text: |-
      1 De ondernemer is verplicht:

      a. zo spoedig mogelijk na elke oogst doch uiterlijk op 1 december van het betreffende teeltjaar een grondbewerking
      uit te voeren met een minimale diepte van vijftien centimeter, waarbij vooral de verslemping, de verdichting,
      korstvorming en de wielsporen worden opgeheven, behoudens bij de toepassing van (gras)ondergroei en bij de
      aanwezigheid van meerjarige teelten;

      b. bij het inzaaien van bieten, maïs of uien de sporen van de trekkerwielen te wissen, tenzij de directzaaimethode
      is toegepast.

      2 De in het eerste lid onder a bedoelde grondbewerking is niet verplicht indien voor het perceel een
      hamsterovereenkomst is afgesloten en voor zover de bepalingen in de hamsterovereenkomst grondbewerking verbieden.
    url: https://wetten.overheid.nl/BWBR0024328/2009-01-01#Artikel4
  - number: '5'
    text: |-
      1 Het is tot en met 31 december 2012 een ondernemer verboden een perceel met een hellinglengte van meer dan 50
      meter en een hellingspercentage van 2% of meer, met een erosiebevorderend gewas te betelen.

      2 De ondernemer mag van het bepaalde in het eerste lid afwijken op voorwaarde dat hij op het perceel:

      a. in het betreffende teeltjaar geen andere dan de niet-kerende grondbewerking toepast en een bodembedekking
      inzaait, of

      b. een groenstrook of groenvlak aanlegt, of

      c. in het jaar voorafgaand aan de teelt van het hoofdgewas een bodembedekking heeft ingezaaid, waarvan de
      gewasresten in het voorjaar in de bovenste 12 cm aanwezig blijven.

      3 Indien de ondernemer kiest voor een maatregel bedoeld in het tweede lid, onderdeel b of c, doet hij uiterlijk
      zeven dagen na toepassing van een andere dan een niet-kerende grondbewerking, hiervan mededeling aan de secretaris.

      4 Een groenstrook als bedoeld in het tweede lid, onderdeel b, heeft een breedte van ten minste 2% van de
      hellinglengte en met een minimum van drie meter.

      5 Een groenvlak als bedoeld in het tweede lid, onderdeel b, heeft een oppervlak van ten minste 2% van het oppervlak
      van het perceel.
    url: https://wetten.overheid.nl/BWBR0024328/2009-01-01#Artikel5
  - number: '6'
    text: |-
      1 Het is met ingang van 1 januari 2013 een ondernemer verboden een perceel met een hellingspercentage van 2% of
      meer, met een erosiebevorderend gewas te betelen.

      2 De ondernemer mag van het bepaalde in het eerste lid afwijken op voorwaarde dat hij in het teeltjaar op het
      perceel:

      a. geen andere dan de niet-kerende grondbewerking toepast en

      b. een bodembedekking inzaait.

      3 De ondernemer mag van het bepaalde bedoeld in het tweede lid, onderdeel a, afwijken op voorwaarde dat hij de
      maatregelen genoemd in [bijlage 1][ref1] toepast.

      4 De ondernemer mag van het bepaalde in het tweede lid, onderdeel b, afwijken op voorwaarde dat hij uiterlijk
      1 december van het jaar waarin de bodembedekking zou moeten worden ingezaaid, een wateropvang heeft met een
      capaciteit van ten minste 40 m3 per hectare eigen landbouwgronden die afwateren in deze voorziening.

      5 Indien de ondernemer kiest voor maatregelen bedoeld in het derde of het vierde lid doet hij hiervan uiterlijk 7
      december mededeling aan de secretaris.

      6 Indien de ondernemer afwijkt van het bepaalde in zowel onderdeel a als b van het tweede lid, geldt het bepaalde
      in het vierde lid niet.


      [ref1]: https://wetten.overheid.nl/BWBR0024328
