  - number: '7'
    text: |-
      Het is een ondernemer verboden landbouwgrond met een hellingspercentage van 18% of méér anders te exploiteren dan
      als grasland.
    url: https://wetten.overheid.nl/BWBR0024328/2009-01-01#Artikel7
  - number: '8'
    text: |-
      De secretaris is, namens het bestuur, bevoegd om op schriftelijk verzoek, na overleg met het waterschap, ontheffing
      te verlenen van het bepaalde in de [artikelen 3][ref1], [4][ref2], [5][ref3] en [6][ref4]

      a. op verzoek van één of meerdere ondernemers, waarbij nadere voorschriften kunnen worden gesteld;

      b. collectief, indien algemene gebeurtenissen de uitvoering van de betreffende artikelen onmogelijk maakt, waarbij
      nadere voorschriften kunnen worden gesteld;

      c. collectief, indien de belangen van de ondernemingen door de uitvoering van de betreffende artikelen ernstig
      worden geschaad, waarbij alternatieve maatregelen met een vergelijkbare effectiviteit zullen worden voorgeschreven.

      d. collectief, naar aanleiding van andere zwaarwegende redenen, waarbij alternatieve maatregelen met een
      vergelijkbare effectiviteit zullen worden voorgeschreven.


