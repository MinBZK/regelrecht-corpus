preamble:
  text: |-
    Gelet op de artikelen 93, 95, 104, 106 en 126, tweede lid, van de Wet op de bedrijfsorganisatie en op de artikelen
    8 en 18 van het Instellingsbesluit akkerbouwproductschappen en op artikel 9, eerste lid van de Verordening PA
    bevoegdheden 2008;

    Gehoord de Commissie Teeltaangelegenheden;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024328/2009-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze verordening verstaat onder:










                  a.


                  productschap


                  :


                  Productschap Akkerbouw;




                  b.


                  bestuur


                  :


                  bestuur van het productschap;




                  c.


                  secretaris


                  :


                  secretaris van het productschap;




                  d.


                  onderneming


                  :


                  onderneming waarvoor het productschap is ingesteld;




                  e.


                  ondernemer


                  :


                  de natuurlijke of rechtspersoon die een onderneming drijft;




                  f.


                  landbouwgrond


                  :


                  grond waarop akkerbouw wordt beoefend inclusief braakliggende landbouwgronden;




                  g.


                  erosie


                  :


                  de afvoer van bodemmateriaal door oppervlakkig afstromend water;




                  h.


                  erosiebevorderend gewas


                  :


                  alle eenjarige gewassen die worden gezaaid, geplant of gepoot na 1 januari van het betreffende
      teeltjaar;




                  i.


                  perceel


                  :


                  een oppervlakte grond, in eigendom of in gebruik bij een onderneming;




                  j.


                  hellinglengte


                  :


                  lengte van de zijde van het perceel, die het minst parallel loopt met de hoofdrichting van de
      hoogtelijnen;




                  k.


                  hellingspercentage


                  :


                  een gemiddeld in een absoluut getal uitgedrukt hellingspercentage van het perceel, bepaald volgens de
      in [bijlage 2][ref1] weergegeven methode dan wel beschikbaar gesteld door LNV-DR;




                  l.


                  grondbewerking


                  :


                  het verplaatsen van bodemdeeltjes door middel van een werktuig als ook de verplaatsing door
      bijvoorbeeld een zaaicouter of mestinjectie;




                  m.


                  niet-kerende grondbewerking


                  :


                  grondbewerking waarbij de vermenging van de bodem zich beperkt tot de bovenste 12 centimeter, eventueel
      gecombineerd met het breken van de bodem op grotere diepte waarbij geen verstoring van de bodemopbouw plaatsvindt;




                  n.


                  bodembedekking


                  :


                  een gewas dat in het najaar direct na de oogst van het hoofdgewas, doch uiterlijk 1 december, wordt
      ingezaaid en als levend gewas of niet ingewerkte gewasresten overwintert;




                  o.


                  hamsterovereenkomst


                  :


                  een overeenkomst aangegaan in het kader subsidieregelingen van de Provincie Limburg met als specifiek
      doel de bescherming van de habitat voor de hamster;




                  p.


                  directzaaimethode


                  :


                  teeltmethode waarbij een bodembedekking wordt toegepast en in het voorjaar zonder volledige
      grondbewerking het navolgende gewas wordt geteeld;




                  q.


                  groenstrook


                  :


                  een lijnvormige strook grond van een perceel beteelt met gras of een gras-kruidenmengsel, ingezaaid
      voor 1 december van het jaar voorafgaande aan het jaar waarin de aanwezigheid geëist wordt en langs de breedte
      van het perceel aan de zijde waarover de meeste kans op oppervlakkige afstroming bestaat, waarbij de strook voor
      meerdere doeleinden mag worden gebruikt (opslag producten, wendakker, perceelstoegang, productieareaal), mits de
      waterremmende functie gewaarborgd blijft en insporingen of andere beschadigingen direct worden opgeheven;




                  r.


                  groenvlak


                  :


                  een aaneengesloten oppervlakte grond (vlak) van een perceel beteelt met gras of een graskruidenmengsel,
      ingezaaid voor 1 december van het jaar voorafgaande aan het jaar waarin de aanwezigheid geëist wordt en gelegen
      op die plaats(en) waar het water (al dan niet geconcentreerd) het perceel verlaat, waarbij het vlak voor
      meerdere doeleinden mag worden gebruikt (opslag producten, wendakker, perceelstoegang, productieareaal), mits de
      waterremmende functie gewaarborgd blijft en insporingen of andere beschadigingen direct worden opgeheven;




                  s.


                  wateropvang


                  :


                  een voorziening bestemd voor het tijdelijk bergen van oppervlakkig afstromend water, waarbij de
      voorziening binnen de hoogwaterlijn wordt ingezaaid met gras of een gras-kruidenmengsel;




                  t.


                  teeltjaar


                  :


                  de periode na oogst t/m oogst van (het) hoofdgewas(sen), waarbij bij de teelt van meerdere gewassen
      achter elkaar (dubbelteelten) de laatste oogst vóór 1 januari wordt bedoeld;




                  u.


                  (gras)ondergroei


                  :


                  een bodembedekker die tijdens de aanwezigheid van een (hoofd)gewas wordt ingezaaid in dit (hoofd)gewas,
      en bij de oogst van het hoofdgewas in stand wordt gehouden;




                  v.


                  Hoofdgewas


                  :


                  een gewas geteeld met het doel de opbrengst te verhandelen of te gebruiken.


