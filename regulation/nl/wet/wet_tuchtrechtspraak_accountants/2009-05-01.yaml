  - number: '19'
    text: |-
      1 De voorzitter, de leden en de plaatsvervangende leden die rechterlijk ambtenaar met rechtspraak belast zijn,
      worden voor hun werkzaamheden voor de accountantskamer vrijgesteld.

      2 Onze Minister compenseert het betrokken gerecht voor de vrijgestelde tijd overeenkomstig de bezoldiging
      die de voorzitter, de leden en de plaatsvervangende leden, bedoeld in het eerste lid, op grond van de
      [Wet rechtspositie rechterlijke ambtenaren][ref1] ontvangen.

      3 De overige leden en plaatsvervangende leden ontvangen van Onze Minister een vacatiegeld voor hun werkzaamheden
      voor de accountantskamer volgens bij ministeriële regeling te stellen regels.

      4 De opgeroepen getuigen en deskundigen ontvangen ten laste van Onze Minister een vergoeding overeenkomstig het
      bepaalde bij of krachtens de [Wet tarieven in strafzaken][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008365
      [ref2]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008365
      - id: ref2
        bwb_id: BWBR0002406
  - number: '20'
    text: |-
      1 De [artikelen 14 tot en met 18][ref1] zijn van overeenkomstige toepassing op de plaatsvervangers van de
      voorzitter, de leden en de secretaris.

      2 De [artikelen 34][ref2] en [35][ref3] zijn van overeenkomstige toepassing op de plaatsvervangers van de
      voorzitter en de leden.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0024238#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0024238#Artikel35
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel20
    references:
