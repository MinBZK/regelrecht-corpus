  - number: '44'
    text: |-
      1 Het College is bij wijze van voorziening, in afwachting van een uitspraak in hoger beroep, bevoegd de
      inschrijving van betrokkene in het register tijdelijk door te halen op verzoek van:

      a. de Autoriteit Financiële Markten, ingeval jegens de betrokkene een ernstig
      vermoeden is gerezen dat hij heeft gehandeld of heeft nagelaten als bedoeld in
      [artikel 31, eerste lid, van de Wet toezicht accountantsorganisaties][ref1] en daardoor zwaarwegende openbare
      belangen in het geding zijn;

      b. de voorzitter van de NOvAA, ingeval jegens de betrokkene een ernstig
      vermoeden is gerezen dat hij heeft gehandeld of heeft nagelaten als bedoeld in
      [artikel 51, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref2] en daardoor zwaarwegende
      openbare belangen in het geding zijn;

      c. de voorzitter van het NIVRA, ingeval jegens de betrokkene een ernstig vermoeden is gerezen dat hij heeft
      gehandeld of heeft nagelaten als bedoeld in [artikel 33, eerste lid, van de Wet op de registeraccountants][ref3] en
      daardoor zwaarwegende openbare belangen in het geding zijn.

      2 Het College kan tot en met het moment van de uitspraak de tijdelijke doorhaling opheffen.

      3 De griffier stelt de Autoriteit Financiële Markten, de voorzitter van de NOvAA onderscheidenlijk de voorzitter
      van het NIVRA en de betrokkene onverwijld in kennis van een tijdelijke doorhaling als bedoeld in het eerste lid en
      dan wel een beslissing tot opheffing daarvan.

      4 Over het voornemen tot tijdelijke doorhaling van de inschrijving wordt de betrokkene gehoord.

      5 Ingeval het College naar aanleiding van de in
      [artikel 51, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref4],
      [artikel 33, eerste lid, van de Wet op de Registeraccountants][ref5] of
      [artikel 31, eerste lid, van de Wet toezicht accountantsorganisaties][ref6], bedoelde overtredingen beslist tot het
      opleggen van een tijdelijke doorhaling van de inschrijving gedurende een bepaalde termijn, kan het de periode van
      de tijdelijke doorhaling van de inschrijving ingevolge het eerste lid in mindering brengen op die termijn.

      6 Het eerste lid is van overeenkomstige toepassing indien tegen betrokkene een strafrechtelijke vervolging ter zake
      van een misdrijf is ingesteld en het misdrijf mede het beroep van betrokkene raakt.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel51
