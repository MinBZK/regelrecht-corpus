  - number: '43'
    text: |-
      1 De [artikelen 31 tot en met 41 van de Wet tuchtrechtspraak bedrijfsorganisatie 2004][ref1] zijn ten aanzien van
      de behandeling van een uitspraak van de accountantskamer in hoger beroep van overeenkomstige toepassing met dien
      verstande dat:

      a. in plaats van «de voorzitter van het bedrijfslichaam» wordt gelezen: de klager, of de voorzitter van het NIVRA,
      voor zover het een registeraccountant betreft, dan wel de voorzitter van de NOvAA, voor zover het een Accountant-
      Administratieconsulent betreft;

      b. in plaats van «het tuchtgerecht» wordt gelezen: de accountantskamer;

      c. in plaats van «het betrokken tuchtgerecht» wordt gelezen: de accountantskamer.

      2 Hoger beroep staat niet open tegen een tussenbeslissing van de accountantskamer of van de voorzitter van de
      accountantskamer en tegen de uitspraak, bedoeld in [artikel 38a][ref2].

      3 Het College informeert de accountantskamer, de Autoriteit Financiële Markten, de voorzitter van het NIVRA,
      voor zover het een registeraccountant betreft, dan wel de voorzitter van de NOvAA, voor zover het een Accountant-
      Administratieconsulent betreft, over het feit dat beroep is ingesteld en vermeldt daarbij welke zaak het betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0024238#Artikel38a
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel43
