        artikel: '41'
        hoofdstuk: IV
  - number: '51'
    text: |-
      In afwijking van [artikel 15][ref1] legt de eerste voorzitter van de accountantskamer de eed of belofte, bedoeld in
      [artikel 15][ref2], af, ten overstaan van de president van het College van Beroep voor het bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0024238#Artikel15
