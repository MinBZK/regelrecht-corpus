        artikel: '25'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0024238
        artikel: '25'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0024238
        artikel: '22'
        hoofdstuk: IV
  - number: '27'
    text: |-
      1 De voorzitter van de accountantskamer kan bevelen dat betrokkene in persoon verschijnt.

      2 Indien de betrokkene wiens persoonlijke verschijning is bevolen, niet op de oproeping verschijnt, kan
      de voorzitter van de accountantskamer de officier van justitie bij de rechtbank Zwolle-Lelystad verzoeken
      de betrokkene ter terechtzitting van de accountantskamer te dagvaarden en daarbij te voegen een bevel tot
      medebrenging.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel27
  - number: '28'
    text: |-
      1 De zitting is openbaar.

      2 De accountantskamer kan bepalen dat de behandeling van de zaak geheel of gedeeltelijk met gesloten deuren
      plaatsvindt indien een openbare behandeling een goede rechtspleging of de belangen van betrokkene, klager of derden
      ernstig zou schaden.

      3 De accountantskamer houdt zitting met de voorzitter of een plaatsvervangend voorzitter en twee of vier leden of
      hun plaatsvervangers. Naast de voorzitter is het aantal rechterlijke en het aantal niet rechterlijke leden naar
      evenredigheid verdeeld.

      4 Indien niet wordt voldaan aan hetgeen in het derde lid is bepaald, leidt dit tot nietigheid van de beslissing in
      de tuchtzaak.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel28
  - number: '29'
    text: |-
      1 De voorzitter heeft de leiding van de zitting.

      2 De secretaris houdt aantekening van het verhandelde ter zitting.

      3 De secretaris maakt een proces-verbaal op van de zitting, indien de accountantskamer dit ambtshalve dan wel op
      verzoek van de betrokkene of de klager bepaalt en indien hoger beroep wordt ingesteld.

      4 Het proces-verbaal bevat de namen van de voorzitter en de leden die de zaak behandelen, die van partijen en van
      hun vertegenwoordigers of gemachtigden die op de zitting zijn verschenen en van degenen die hen hebben bijgestaan,
      en die van de getuigen, deskundigen en tolken die op de zitting zijn verschenen.

      5 Het proces-verbaal houdt een beschrijving in van hetgeen op de zitting met betrekking tot de zaak is
      voorgevallen.

      6 Het proces-verbaal wordt door de voorzitter en de secretaris ondertekend.

      7 Aan het proces-verbaal kunnen overgelegde pleitnotities worden gehecht.

      8 De accountantskamer kan bepalen dat de verklaring van een partij, getuige of deskundige geheel in het proces-
      verbaal zal worden opgenomen. In dat geval wordt de verklaring onverwijld op schrift gesteld en aan de partij,
      getuige of deskundige voorgelezen. Deze mag daarin wijzigingen aanbrengen, die op schrift worden gesteld en aan
      de partij, getuige of deskundige worden voorgelezen. De verklaring wordt door de partij, getuige of deskundige
      ondertekend. Heeft ondertekening niet plaats, dan wordt de reden daarvan in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel29
  - number: '30'
    text: |-
      In geval van intrekking van de klacht wordt de behandeling daarvan gestaakt, tenzij de accountantskamer beslist dat
      de behandeling van de klacht om redenen aan het algemeen belang ontleend, moet worden voortgezet. In dat laatste
      geval wordt de klacht verder behandeld als ware deze afkomstig van:

      a. de Autoriteit Financiële Markten, bij een vermoeden van handelen of nalaten als bedoeld in
      [artikel 31, eerste lid, van de Wet toezicht accountantsorganisaties][ref1];

      b. de voorzitter van de NOvAA, bij een vermoeden van handelen of nalaten als bedoeld in
      [artikel 51, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref2];

      c. de voorzitter van het NIVRA, bij een vermoeden van handelen of nalaten als bedoeld in
      [artikel 33, eerste lid, van de Wet op de registeraccountants][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0002374#Artikel33
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '51'
      - id: ref3
        bwb_id: BWBR0002374
        artikel: '33'
  - number: '31'
    text: |-
      1 De accountantskamer kan de behandeling ter zitting schorsen.

      2 In het geval de behandeling ter zitting is geschorst, bepaalt de accountantskamer zo spoedig mogelijk het
      tijdstip waarop de behandeling wordt hervat en stelt de secretaris de betrokkene en de klager hiervan op de hoogte
      tenzij het tijdstip van de hervatting op de zitting door de accountantskamer reeds mondeling is vastgesteld en
      mondeling aan klager en de betrokkene is aangezegd. Indien zulks niet mondeling is aangezegd zijn het tweede tot
      en met het vijfde lid van [artikel 26][ref1] van overeenkomstige toepassing, voor zover daaraan niet reeds eerder
      is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel26
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0024238
        artikel: '26'
        hoofdstuk: IV
  - number: '32'
    text: |-
      1 De accountantskamer sluit het onderzoek ter zitting, wanneer zij van oordeel is dat het is voltooid.

      2 Voordat het onderzoek ter zitting wordt gesloten, heeft de betrokkene het recht voor het laatst het woord te
      voeren.

      3 Zodra het onderzoek ter zitting is gesloten, deelt de voorzitter mee wanneer uitspraak zal worden gedaan.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel32
  - number: '33'
    text: |-
      1 De betrokkene kan, tenzij de voorzitter van de accountantskamer beveelt dat hij in persoon zal verschijnen, zich
      op een terechtzitting doen vertegenwoordigen door een advocaat, indien deze aldaar verklaart daartoe gevolmachtigd
      te zijn, of wel door een daartoe bij bijzondere volmacht schriftelijk gevolmachtigde.

      2 De accountantskamer kan weigeren bepaalde personen, die geen advocaat zijn, als gemachtigde toe te laten. Bij
      zodanige weigering houdt de accountantskamer de zaak tot de volgende zitting aan.

      3 De accountantskamer stelt de betrokkene van de aanhouding en de reden van de aanhouding in kennis en roept hem
      tevens op om op de voor de zaak bepaalde nadere zitting in persoon of bij een andere gemachtigde tegenwoordig te
      zijn.

      4 De betrokkene kan zich te allen tijde door een raadsman doen bijstaan.

      5 De accountantskamer kan weigeren bepaalde personen, die geen advocaat zijn, als raadsman toe te laten. Bij
      zodanige weigering houdt de accountantskamer op verzoek van de betrokkene de zaak tot een volgende zitting aan.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel33
  - number: '34'
    text: |-
      Op verzoek van betrokkene of de klager, kan de voorzitter of elk van de leden die een zaak behandelen, worden
      gewraakt op grond van feiten en omstandigheden waardoor de onpartijdigheid van de accountantskamer schade zou
      kunnen lijden. De [artikelen 513 tot en met 515 van het Wetboek van Strafvordering][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel513
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '513'
  - number: '35'
    text: |-
      Op grond van feiten en omstandigheden als bedoeld in [artikel 34][ref1] kan een
      voorzitter of een lid die een zaak behandelt, verzoeken zich te mogen verschonen. De
      [artikelen 517, tweede en derde lid, tot en met artikel 518 van het Wetboek van Strafvordering][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel517
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0024238
        artikel: '34'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '517'
  - number: '36'
    text: |-
      1 De accountantskamer kan ambtshalve of op verzoek van de betrokkene of de klager getuigen oproepen.

      2 Ieder die als getuige is opgeroepen, is verplicht voor de accountantskamer te verschijnen.
      [Artikel 27, tweede lid][ref1], is van overeenkomstige toepassing.

      3 Met betrekking tot het horen van de getuigen en hun recht van verschoning zijn de
      [artikelen 217 tot en met 220 van het Wetboek van Strafvordering][ref2] van overeenkomstige toepassing.

      4 De voorzitter van de accountantskamer kan bepalen dat getuigen niet zullen worden gehoord dan na het afleggen van
      de eed of de belofte. Zij leggen in dat geval de eed of de belofte af dat zij zullen zeggen de gehele waarheid en
      niets dan de waarheid.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0024238
        artikel: '27'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '217'
  - number: '37'
    text: |-
      1 De accountantskamer kan ambtshalve of op verzoek van de betrokkene of de klager deskundigen benoemen, teneinde
      de accountantskamer voor te lichten, zo nodig, met opdracht een onderzoek in te stellen en de accountantskamer een
      verslag uit te brengen.

      2 De deskundige is verplicht zijn taak onpartijdig en naar beste weten te verrichten. Ten aanzien van deskundigen
      en hun verhoor zijn de [artikelen 217 tot en met 220 van het Wetboek van Strafvordering][ref1] van overeenkomstige
      toepassing.

      3 De accountantskamer kan de deskundige geheimhouding opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
  - number: '38'
    text: |-
      1 De accountantskamer doet schriftelijk uitspraak. De uitspraak wordt ondertekend door de voorzitter en de
      secretaris.

      2 De uitspraak houdt in de beslissing omtrent het opleggen van de tuchtrechtelijke maatregel, de gronden en de
      voorschriften waarop zij berust.

      3 De accountantskamer kan een klacht niet-ontvankelijk verklaren.

      4 De accountantskamer spreekt de beslissing, bedoeld in het tweede en het derde lid, in het openbaar uit.

      5 In afwijking van het eerste lid, kan de accountantskamer na sluiting van het onderzoek ter zitting onmiddellijk
      mondeling uitspraak doen.

      6 De secretaris maakt van de mondelinge uitspraak een proces-verbaal op.

      7 De uitspraak wordt onverwijld aan de betrokkene, de klager, de Autoriteit Financiële Markten, de voorzitter van
      de NOvAA, onderscheidenlijk de voorzitter van het NIVRA gezonden.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel38
  - number: 38a
    text: |-
      1 De voorzitter van de accountantskamer kan een klacht alvorens deze in behandeling te nemen doorsturen naar
      de instantie die daarvoor bij verordening van het NIVRA of de NOvAA is aangewezen, in het geval de klacht zich
      daar naar haar oordeel toe leent en indien uit het klaagschrift blijkt, dat de klacht niet aan deze instantie is
      voorgelegd. De voorzitter van de accountantskamer kan hierbij zonodig toepassing geven aan [artikel 25][ref1]. De
      op de zaak betrekking hebbende stukken worden meegezonden met het klaagschrift.

      2 Indien de voorzitter van de accountantskamer toepassing geeft aan het eerste lid, stelt hij
      de klager daarvan in kennis en vermeldt hij de bevoegdheid van de klager om na ommekomst van de
      behandeling door de betrokken instantie opnieuw een klacht bij de accountantskamer in te dienen.
      [Artikel 38, eerste en vierde tot en met zevende lid][ref2], is van overeenkomstige toepassing.

      3 De instantie waaraan de klacht overeenkomstig het eerste lid is toegezonden, behandelt de klacht overeenkomstig
      het bepaalde bij of krachtens de toepasselijke verordening van het NIVRA onderscheidenlijk de NOvAA.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0024238#Artikel38
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0024238
        artikel: '25'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0024238
        artikel: '38'
        hoofdstuk: IV
  - number: '39'
    text: |-
      1 Indien naar het oordeel van de voorzitter van de accountantskamer een klacht kennelijk niet-ontvankelijk,
      kennelijk ongegrond of van onvoldoende gewicht is, kan de voorzitter de zaak zonder zitting afdoen.
      [Artikel 38][ref1] is van overeenkomstige toepassing.

      2 Indien naar het oordeel van de voorzitter van de accountantskamer een klacht gegrond is, maar geen andere
      tuchtmaatregel dan een waarschuwing, berisping of een geldboete van ten hoogste € 225 dient te worden opgelegd,
      kan de voorzitter na betrokkene te hebben gehoord, de zaak zonder zitting afdoen. [Artikel 38][ref2] is van
      overeenkomstige toepassing.

      3 Tegen de uitspraak, bedoeld in het eerste en tweede lid, kan de betrokkene of de klager binnen zes weken na
      verzending van de uitspraak verzet doen. In dat geval vervalt de uitspraak en wordt de zaak verder overeenkomstig
      de [artikelen 26 tot en met 38][ref3] behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0024238#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0024238#Artikel26
