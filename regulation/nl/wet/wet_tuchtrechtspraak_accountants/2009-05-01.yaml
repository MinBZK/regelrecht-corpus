  - number: '6'
    text: |-
      1 In het geval waarin de accountantskamer de openbaarmaking van haar uitspraak gelast, bepaalt zij tevens de wijze
      waarop aan die last uitvoering wordt gegeven.

      2 De kosten van de openbaarmaking worden in de uitspraak op een bepaald bedrag geschat.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel6
  - number: '7'
    text: |-
      1 In het geval waarin de accountantskamer tijdelijke doorhaling van de inschrijving van betrokkene in het register
      gelast, vermeldt zij in haar uitspraak wanneer de tijdelijke doorhaling ingaat en wanneer deze eindigt.

      2 Terstond na het doen van de uitspraak informeert de accountantskamer de Autoriteit Financiële Markten en de
      voorzitter van de NOvAA onderscheidenlijk de voorzitter van het NIVRA over de naam van de betrokkene, het tijdstip
      waarop de tijdelijke doorhaling ingaat en het tijdstip waarop deze eindigt.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel7
  - number: '8'
    text: |-
      1 In het geval waarin de accountantskamer doorhaling van de inschrijving van betrokkene in het register gelast,
      bepaalt zij tevens de termijn waarbinnen betrokkene niet opnieuw in het register kan worden ingeschreven. Deze
      termijn bedraagt maximaal 10 jaren.

      2 Terstond na het doen van de uitspraak informeert de accountantskamer de Autoriteit Financiële Markten en
      de voorzitter van de NOvAA onderscheidenlijk de voorzitter van het NIVRA over de naam van de betrokkene, het
      tijdstip waarop de doorhaling ingaat en de termijn waarbinnen betrokkene niet opnieuw in het register kan worden
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel8
  - number: '9'
    text: |-
      1 De accountantskamer informeert terstond na het doen van de uitspraak de Autoriteit Financiële Markten, de
      voorzitter van het NIVRA dan wel de voorzitter van de NOvAA omtrent de naam van betrokkene en de aard van de
      opgelegde tuchtrechtelijke maatregel.

      2 De Autoriteit Financiële Markten, de voorzitter van het NIVRA dan wel de voorzitter van de NOvAA dragen na het
      onherroepelijk worden van de uitspraak, zorg voor opname van de tuchtrechtelijke maatregel in het register.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel9
  - number: '10'
    text: |-
      1 Er is een accountantskamer gevestigd te Zwolle.

      2 De accountantskamer vormt uit haar midden kamers voor het vervullen van haar taak. Kamers kunnen ook buiten de
      vestigingsplaats zitting houden.

      3 De accountantskamer stelt bij reglement nadere regels vast over haar werkwijze.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel10
  - number: '11'
    text: |-
      1 De accountantskamer heeft een voorzitter, ten hoogste acht leden en een secretaris.

      2 De accountantskamer heeft ten hoogste tien plaatsvervangende leden.

      3 De accountantskamer kan een of meer plaatsvervangend-secretarissen hebben.

      4 De voorzitter van de accountantskamer wijst twee personen, bedoeld in
      [artikel 12, tweede lid, eerste volzin][ref1], aan als plaatsvervangend voorzitter.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel12
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024238
        artikel: '12'
        hoofdstuk: III
  - number: '12'
    text: |-
      1 De voorzitter is rechterlijk ambtenaar met rechtspraak belast.

      2 Van de leden is de helft rechterlijk ambtenaar met rechtspraak belast. De overige leden zijn accountant of
      deskundig ter zake van werkzaamheden die accountants verrichten.

      3 Van de plaatsvervangende leden is de meerderheid rechterlijk ambtenaar met rechtspraak belast. De overige
      plaatsvervangende leden zijn accountant of deskundig ter zake van werkzaamheden die accountants verrichten.

      4 De secretaris en de plaatsvervangend-secretarissen zijn gerechtssecretaris.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel12
  - number: '13'
    text: |-
      De voorzitter, de leden, de plaatsvervangende leden, de secretaris en de plaatsvervangend-secretarissen worden op
      voordracht van Onze Minister bij koninklijk besluit benoemd voor een periode van zes jaren.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel13
  - number: '14'
    text: |-
      1 De secretaris en de leden zijn voor hun werkzaamheden enkel verantwoording verschuldigd aan de accountantskamer.

      2 [Artikel 42 van de Wet rechtspositie rechterlijke ambtenaren][ref1] is ten aanzien van de voorzitter de leden en
      de secretaris van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel42
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '42'
  - number: '15'
    text: |-
      1 De voorzitter, de leden en de secretaris leggen voorafgaand aan de aanvang van hun werkzaamheden voor de
      accountantskamer de eed of belofte af. Het formulier voor de eed of belofte wordt als bijlage bij deze wet gevoegd.

      2 De voorzitter legt de eed of belofte af ten overstaan van een plaatsvervangend-voorzitter.

      3 De leden en de secretaris leggen de eed of belofte af ten overstaan van de voorzitter.

      4 Bij een opvolgende benoeming binnen de accountantskamer van de voorzitter, een lid of de secretaris blijft de
      beëdiging achterwege.

      5 De secretaris houdt een register waarin de koninklijke besluiten van de bij de accountantskamer benoemde personen
      en de formulieren van de eed/belofte worden bewaard.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel15
  - number: '16'
    text: |-
      1 De voorzitter, de leden en de secretaris zijn geen lid van het bestuur van of werknemer bij de Autoriteit
      Financiële Markten, een klachtencommissie belast met het behandelen van klachten inzake externe accountants,
      Accountants-Administratieconsulenten of registeraccountants, de NOvAA of het NIVRA. Onze Minister kan
      regels stellen ten aanzien van functies of betrekkingen die zich niet verhouden tot het lidmaatschap van de
      accountantskamer.

      2 Tussen de voorzitter, de leden en de secretaris mag niet bestaan een verhouding van werkgever tot werknemer.
      Zij mogen niet met elkaar in de uitoefening van een beroep voor gemene rekening of onder gemeenschappelijke naam
      optreden.

      3 Tussen de voorzitter, de leden en de secretaris mag niet bestaan de verhouding van echtgenoten of geregistreerde
      partners, bloed- of aanverwantschap tot de derde graad ingesloten.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel16
  - number: '17'
    text: |-
      De voorzitter, de leden en de secretaris zijn verplicht tot geheimhouding van de gegevens waarover zij bij de
      uitoefening van hun taak de beschikking krijgen en waarvan zij het vertrouwelijke karakter kennen of redelijkerwijs
      moeten vermoeden, behoudens voor zover enig wettelijk voorschrift hen tot mededeling verplicht of uit hun taak de
      noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel17
  - number: '18'
    text: |-
      1 Het lidmaatschap van de accountantskamer van de voorzitter, de leden en de secretaris vervalt van rechtswege
      indien zij ophouden te voldoen aan de vereisten voor benoeming. Het lidmaatschap eindigt voorts van rechtswege door
      het verstrijken van de benoemingstermijn van zes jaar. Na deze termijn is herbenoeming mogelijk.

      2 De voorzitter, de leden en de secretaris kunnen op eigen verzoek bij koninklijk besluit worden ontslagen.

      3 De voorzitter, de leden en de secretaris worden in ieder geval bij koninklijk besluit ontslagen met ingang van de
      eerste dag van de maand volgend op die waarin zij de leeftijd van zeventig jaren hebben bereikt.

      4 De voorzitter, de leden en de secretaris kunnen bij koninklijk besluit worden ontslagen op de gronden
      aangegeven in de [artikelen 46c, tweede lid][ref1], [46d, tweede lid][ref2], [46l, eerste en derde lid][ref3], en
      [46m van de Wet rechtspositie rechterlijke ambtenaren][ref4] en indien zij wegens ziekte ongeschikt zijn voor hun
      taak, mits de ongeschiktheid twee jaar onafgebroken heeft geduurd en herstel binnen zes maanden na de termijn van
      twee jaar redelijkerwijs niet is te verwachten.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel18
    references:
