  - number: '3'
    text: |-
      De tuchtrechtelijke maatregel van waarschuwing bestaat uit een schriftelijke waarschuwing van de betrokkene in
      verband met het begane feit.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel3
  - number: '4'
    text: |-
      De tuchtrechtelijke maatregel van berisping bestaat uit een schriftelijke vermaning tot de betrokkene in verband
      met het begane feit.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel4
  - number: '5'
    text: |-
      1 Het bedrag van de geldboete is ten minste € 3,– en ten hoogste het bedrag van de derde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1].

      2 De geldboete kan geheel of gedeeltelijk voorwaardelijk worden opgelegd.

      3 Een beslissing tot oplegging van een geldboete bevat de termijn waarbinnen deze moet zijn voldaan. Op verzoek van
      de betrokkene kan de voorzitter de termijn verlengen. De opgelegde boete komt ten bate van de Staat.

      4 Wordt de boete niet binnen de gestelde termijn voldaan, dan kan de accountantskamer na het horen van betrokkene,
      ambtshalve beslissen een tuchtrechtelijke maatregel als bedoeld in [artikel 2, onderdelen d of e][ref2], op te
      leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0024238#Artikel2
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel5
    references:
