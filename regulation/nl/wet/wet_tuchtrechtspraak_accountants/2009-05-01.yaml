  - number: '2'
    text: |-
      1 De tuchtrechtelijke maatregelen die de accountantskamer kan opleggen bij handelen of nalaten als
      bedoeld in [artikel 51, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref1],
      [artikel 33, eerste lid, van de Wet op de Registeraccountants][ref2] of
      [artikel 31, eerste lid, van de Wet toezicht accountantsorganisaties][ref3], zijn:

      a. waarschuwing;

      b. berisping;

      c. geldboete;

      d. tijdelijke doorhaling van de inschrijving van de accountant in het register voor ten hoogste één jaar;

      e. doorhaling van de inschrijving van de accountant in het register.

      2 Een geldboete kan gezamenlijk met een tuchtrechtelijke maatregel als genoemd in het eerste lid onder a, b, d en
      e, worden opgelegd.

      3 Bij de beslissing tot oplegging van een maatregel als bedoeld in het eerste lid kan worden bepaald
      dat deze beslissing op kosten van betrokkene wordt openbaar gemaakt op een daarbij voorgeschreven wijze,
      indien enig door [artikel 51, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref4],
      [artikel 33, eerste lid, van de Wet op de Registeraccountants][ref5] of
      [artikel 31, eerste lid, van de Wet toezicht accountantsorganisaties][ref6] beschermd belang dat vordert.

      4 Bij de beslissing tot het opleggen van de maatregel van tijdelijke doorhaling van de accountant kan de termijn
      die is gehanteerd ingevolge [artikel 41, eerste lid][ref7], en [44, eerste lid][ref8], op de periode van de
      tijdelijke doorhaling in mindering worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0002374#Artikel33
