  - number: '23'
    text: |-
      1 De secretaris van de accountantskamer heft van de indiener van het klaagschrift een griffierecht van € 70,–.

      2 De secretaris wijst de indiener van het klaagschrift op de verschuldigdheid van het griffierecht en deelt hem
      mee dat het verschuldigde bedrag binnen vier weken na de dag van verzending van zijn mededeling dient te zijn
      bijgeschreven op de rekening van de accountantskamer. Indien het bedrag niet binnen deze termijn is bijgeschreven,
      wordt de klacht niet-ontvankelijk verklaard, tenzij redelijkerwijs niet kan worden geoordeeld dat de klager in
      verzuim is geweest.

      3 Indien de klacht wordt ingetrokken omdat betrokkene geheel of gedeeltelijk aan de klacht van de klager tegemoet
      is gekomen, wordt het door de klager betaalde griffierecht vergoed door betrokkene. Indien de klacht gegrond wordt
      verklaard wordt het door de klager betaalde griffierecht vergoed door betrokkene.

      4 In afwijking van het eerste lid, wordt geen griffierecht geheven indien een klaagschrift wordt ingediend door:

      a. de Autoriteit Financiële Markten;

      b. de voorzitter van het NIVRA;

      c. de voorzitter van de NOvAA.

      5 Onze Minister kan het in het eerste lid genoemde bedrag wijzigen voor zover de consumentenprijsindex daartoe
      aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel23
  - number: '24'
    text: |-
      Een lid dan wel plaatsvervangend lid van de accountantskamer dat externe accountant als bedoeld in
      [artikel 1, eerste lid, onderdeel e, van de Wet toezicht accountantsorganisaties][ref1], registeraccountant of
      Accountant-Administratieconsulent is, wordt ingeval tegen hem een klacht is ingediend, vervangen door een door de
      voorzitter aan te wijzen ander lid dan wel plaatsvervangend lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel1
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '1'
  - number: '25'
    text: |-
      1 De voorzitter van de accountantskamer kan betrokkene verzoeken binnen een termijn van vier weken schriftelijk op
      de ingediende klacht te reageren. De secretaris zendt een afschrift van de reactie van betrokkene aan de klager.

      2 De voorzitter van de accountantskamer kan de klager verzoeken binnen vier weken schriftelijk op de reactie van
      betrokkene te reageren. De secretaris zendt een afschrift van de reactie van de klager aan betrokkene.

      3 De voorzitter van de accountantskamer kan betrokkene verzoeken binnen een termijn van twee weken schriftelijk
      op de reactie van de klager te reageren. De secretaris zendt een afschrift van de reactie van betrokkene aan de
      klager.

      4 De voorzitter van de accountantskamer kan de termijn genoemd in de voorgaande leden verlengen indien het de
      voorzitter van de accountantskamer blijkt dat daar aanleiding toe is.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel25
  - number: '26'
    text: |-
      1 De betrokkene wordt binnen een termijn van ten hoogste tien weken nadat de zaak bij de accountantskamer aanhangig
      is gemaakt opgeroepen om op een door de voorzitter te bepalen dag en uur ter zitting te verschijnen. Indien de
      voorzitter van de accountantskamer gebruik maakt van de bevoegdheid in [artikel 25][ref1], kan hij bepalen dat de
      termijn van tien weken wordt verlengd, waarbij de termijn voor verlenging niet langer kan zijn dan de tijd die is
      gebruikt voor de procedure in [artikel 25][ref2].

      2 De oproeping wordt ten minste vier weken voor de dag van de zitting aan de betrokkene gezonden en vermeldt de
      plaats van de zitting.

      3 De oproeping gaat vergezeld van een afschrift van het in [artikel 22][ref3] bedoelde klaagschrift en van alle op
      de zaak betrekking hebbende stukken.

      4 De oproeping houdt in:

      a. de namen, het beroep en de woonplaats van de ter zitting opgeroepen getuigen en deskundigen;

      b. de mededeling dat de betrokkene bevoegd is getuigen en deskundigen ter zitting mede te brengen.

      5 De secretaris van de accountantskamer stelt de klager ten minste vier weken voor de dag van de zitting op de
      hoogte van de dag en het tijdstip waarop de zitting plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0024238#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0024238#Artikel22
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel26
