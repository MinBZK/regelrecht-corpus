preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een wet tot stand te brengen waarin het
    tuchtprocesrecht ten aanzien van accountants op uniforme wijze wordt geregeld en waarin voorts regels worden
    gesteld inzake een klachtenprocedure ten aanzien van accountants;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. *accountant* een registeraccountant of een Accountant-Administratieconsulent;

      b. *Autoriteit Financiële Markten* de Stichting Autoriteit Financiële Markten;

      c. *betrokkene* degene jegens wie een klacht is ingediend op grond van [artikel 22][ref1] van deze wet;

      d. *het College* het College van Beroep voor het bedrijfsleven;

      e. *klager* degene die jegens betrokkene een klacht heeft ingediend op grond van [artikel 22][ref2] van deze wet;

      f. *NOvAA* de Nederlandse Orde van Accountants-Administratieconsulenten, bedoeld in
      [artikel 2 van de Wet op de Accountants-Administratieconsulenten][ref3];

      g. *NIVRA* het Nederlands Instituut van Registeraccountants, bedoeld in
      [artikel 1, eerste lid, van de Wet op de Registeraccountants][ref4];

      h. *Onze Minister* Onze Minister van Financiën;

      i. *Onze Ministers* Onze Minister van Financiën en Onze Minister van Justitie;

      j. *register* het register bedoeld in de
      [artikelen 11, eerste lid, van de Wet toezicht accountantsorganisaties][ref5],
      [55, eerste lid, van de Wet op de Registeraccountants][ref6] onderscheidenlijk
      [36, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref7].


