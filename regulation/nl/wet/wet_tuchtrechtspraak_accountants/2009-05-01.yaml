  - number: '42'
    text: |-
      De tijdelijke doorhaling van de inschrijving, bedoeld in [artikel 41, eerste lid][ref1], vervalt op het moment dat:

      a. de accountantskamer op grond van [artikel 41, tweede lid][ref2], de tijdelijke doorhaling opheft; of

      b. de uitspraak van de accountantskamer onherroepelijk wordt; of

      c. de tijdelijke doorhaling in hoger beroep wordt vernietigd; of

      d. het College de zaak zelf afdoet op grond van
      [artikel 40, eerste lid, van de Wet tuchtrechtspraak bedrijfsorganisatie 2004][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0024238#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0016341#Artikel40
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel42
