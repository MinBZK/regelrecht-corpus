  - number: '46'
    text: |-
      1 Het College informeert terstond na het doen van de uitspraak de Accountantskamer, de Autoriteit Financiële
      Markten, de voorzitter van het NIVRA dan wel de voorzitter van de NOvAA omtrent de naam van betrokkene en de aard
      van de opgelegde tuchtrechtelijke maatregel.

      2 De Autoriteit Financiële Markten, het bestuur van het NIVRA dan wel het bestuur van de NOvAA dragen zorg voor de
      opname van de opgelegde tuchtrechtelijke maatregel in het register.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel46
  - number: '47'
    text: |-
      De tenuitvoerlegging van uitspraken van de accountantskamer en van het College geschiedt op last van de voorzitter
      van de accountantskamer.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel47
  - number: '48'
    text: |-
      Een uitspraak wordt, met uitzondering van de uitspraak bedoeld in [artikel 41][ref1], niet ten uitvoer gelegd
      voordat deze onherroepelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel41
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel48
