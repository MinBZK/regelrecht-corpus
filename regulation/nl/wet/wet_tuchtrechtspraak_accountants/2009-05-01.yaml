        artikel: '43'
        hoofdstuk: V
  - number: 21e
    text: |-
      De secretaris van de accountantskamer kan aan degene die daarom verzoekt, tegen betaling der kosten, afschriften
      van onherroepelijke beslissingen van de accountantskamer en het College verstrekken. Zodanige afschriften worden
      niet dan na machtiging van de voorzitter van het college dat de desbetreffende beslissing heeft gegeven, verstrekt.
      Een verzoek daartoe wordt alleen toegestaan ingeval de verzoeker heeft aangetoond dat hij daarbij belang heeft.
      In de afschriften worden de in de desbetreffende beslissingen vermelde namen, voornamen en woonplaatsen van de
      klagers, degenen over wie is geklaagd, de getuigen en de deskundigen weggelaten.
    url: https://wetten.overheid.nl/BWBR0024238/2009-05-01#Artikel21e
  - number: '22'
    text: |-
      1 Een ieder kan bij een vermoeden van handelen of nalaten:

      a. als bedoeld in [artikel 31, eerste lid, van Wet toezicht accountantsorganisaties][ref1] door een externe
      accountant als bedoeld in [artikel 1, eerste lid, onderdeel e, van die wet][ref2],

      b. als bedoeld in [artikel 33, eerste lid, van de Wet op de Registeraccountants][ref3] door een registeraccountant,
      of

      c. als bedoeld in [artikel 51, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref4] door een
      Accountant-Administratieconsulent,

      binnen drie jaar na de constatering van het handelen of nalaten door middel van een klaagschrift een klacht
      indienen bij de accountantskamer. De accountantskamer neemt de klacht niet in behandeling indien tussen het moment
      van het handelen of nalaten en het moment van indiening van de klacht een periode van zes jaar is verstreken.

      2 De voorzitter van de NOvAA respectievelijk het NIVRA, kan ingeval betrokkene is veroordeeld voor een strafbaar
      feit en dit feit raakt aan de werkzaamheden die een accountant verricht, de zaak binnen drie jaar na de
      veroordeling aanhangig maken bij de accountantskamer door middel van een klaagschrift.

      3 Het klaagschrift vermeldt de naam van de klager, de naam van betrokkene en de feiten waarvoor een
      tuchtrechtelijke maatregel wordt gevraagd. In het klaagschrift wordt vermeld of de klacht is voorgelegd aan
      de organisatie waarbinnen de betrokken accountant werkzaam is, of aan een klachten- of geschillencommissie
      waarbij deze organisatie aangesloten is. Indien de klacht niet is voorgelegd, worden de redenen daarvoor
      in het klaagschrift vermeld. Bij het klaagschrift worden alle op de zaak betrekking hebbende stukken aan de
      accountantskamer overgelegd.

      4 De accountantskamer kan zaken over hetzelfde of een verwant onderwerp ter behandeling voegen en de de behandeling
      van gevoegde zaken splitsen.

      5 Indien een klaagschrift is gebaseerd op [artikel 33, eerste lid, van de Wet op de Registeraccountants][ref5] of
      op [artikel 51, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref6], maar tevens betrekking
      heeft op [artikel 31, eerste lid, van de Wet toezicht accountantsorganisaties][ref7], is de accountantskamer
      gehouden deze klacht ambtshalve aan te vullen.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel1
