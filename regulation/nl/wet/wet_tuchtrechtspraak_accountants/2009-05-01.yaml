  - number: '52'
    text: |-
      1 De raden van tucht, bedoeld in [artikel 51, tweede lid, van de Wet op de Accountants-Administratieconsulenten][ref1]
      en [artikel 33, tweede lid, van de Wet op de Registeraccountants][ref2], zoals deze artikelen luidden voor het
      tijdstip van inwerkingtreding van deze wet, handelen gedurende een jaar na het tijdstip van inwerkingtreding
      van deze wet de zaken af die op het tijdstip van inwerkingtreding van de Wet tuchtrechtspraak accountants
      bij hen aanhangig zijn. Zij nemen daarbij de [Wet op de Accountants-Administratieconsulenten][ref3] en de
      [Wet op de Registeraccountants][ref4] in acht zoals deze luidden voor het tijdstip van inwerkingtreding van
      deze wet. De zaken die de raden van tucht na dit jaar nog niet hebben afgehandeld, worden afgehandeld door de
      accountantskamer.

      2 De accountantskamer handelt de zaken die op grond van het eerste lid, derde volzin, zijn
      overgedragen, af met in achtneming van de [Wet op de Accountants-Administratieconsulenten][ref5] en de
      [Wet op de Registeraccountants][ref6] zoals deze luidden voor het tijdstip van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel51
