  - number: '19'
    text: |-
      1 De voorzitter, de leden, de plaatsvervangende leden die rechterlijk ambtenaar met rechtspraak belast zijn,
      alsmede de secretaris en de plaatsvervangend-secretarissen, worden voor hun werkzaamheden bij de accountantskamer
      vrijgesteld.

      2 Onze Minister compenseert het betrokken gerecht voor het vrijstellen van de personen, bedoeld in het eerste lid.

      3 De overige leden en plaatsvervangende leden ontvangen van Onze Minister een vacatiegeld voor hun werkzaamheden
      voor de accountantskamer volgens bij ministeriële regeling te stellen regels.

      4 De opgeroepen getuigen en deskundigen ontvangen ten laste van Onze Minister een vergoeding overeenkomstig het
      bepaalde bij of krachtens de [Wet tarieven in strafzaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel19
