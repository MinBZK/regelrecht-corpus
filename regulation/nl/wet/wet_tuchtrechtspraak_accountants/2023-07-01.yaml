  - number: '6'
    text: |-
      1 In het geval waarin de accountantskamer de openbaarmaking van haar uitspraak gelast, bepaalt zij tevens de wijze
      waarop aan die last uitvoering wordt gegeven.

      2 De kosten van de openbaarmaking worden in de uitspraak op een bepaald bedrag geschat.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel6
  - number: '7'
    text: |-
      1 In het geval waarin de accountantskamer tijdelijke doorhaling van de inschrijving van betrokkene in de registers
      gelast, vermeldt zij in haar uitspraak wanneer de tijdelijke doorhaling ingaat en wanneer deze eindigt.

      2 Terstond na het doen van de uitspraak informeert de accountantskamer de Autoriteit Financiële Markten en de
      beroepsorganisatie over de naam van de betrokkene, het tijdstip waarop de tijdelijke doorhaling ingaat en het
      tijdstip waarop deze eindigt.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel7
  - number: '8'
    text: |-
      1 In het geval waarin de accountantskamer doorhaling van de inschrijving van betrokkene in de registers gelast,
      bepaalt zij tevens de termijn waarbinnen betrokkene niet opnieuw in de registers kan worden ingeschreven. Deze
      termijn bedraagt maximaal 10 jaren.

      2 Terstond na het doen van de uitspraak informeert de accountantskamer de Autoriteit Financiële Markten en
      de beroepsorganisatie over de naam van de betrokkene, het tijdstip waarop de doorhaling ingaat en de termijn
      waarbinnen betrokkene niet opnieuw in het register kan worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel8
  - number: '9'
    text: |-
      1 De accountantskamer informeert terstond na het doen van de uitspraak de Autoriteit Financiële Marktenen de
      beroepsorganisatie omtrent de naam van betrokkene en de aard van de opgelegde tuchtrechtelijke maatregel.

      2 De Autoriteit Financiële Markten en de beroepsorganisatie dragen na uitvaardiging van een last tot
      tenuitvoerlegging als bedoeld in [artikel 47][ref1] zorg voor opname van de tuchtrechtelijke maatregel in de
      registers.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel47
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel9
