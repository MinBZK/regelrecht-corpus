  - number: '51'
    text: |-
      [Artikel 22, eerste lid][ref1], is niet van toepassing op handelen of
      nalaten dat heeft plaatsgevonden voor het tijdstip van inwerkingtreding van
      [artikel III, onderdeel A, van de Wet aanvullende maatregelen accountantsorganisaties][ref2], indien de termijn
      waarbinnen op grond van artikel 22, eerste lid, zoals dat voor bedoeld tijdstip luidde, ter zake van dat handelen
      of nalaten een klacht kon worden ingediend bij de accountantskamer, op dat tijdstip reeds was verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0040928#ArtikelIII
