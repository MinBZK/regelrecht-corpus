  - number: '41'
    text: |-
      1 De accountantskamer is bij wijze van voorlopige voorziening bevoegd tot het opleggen een tijdelijke doorhaling
      van de inschrijving van de betrokkene in de registers, op verzoek van:

      a. de Autoriteit Financiële Markten, ingeval jegens de betrokkene een ernstig vermoeden is gerezen van handelen
      of nalaten als bedoeld in [artikel 31, eerste lid, van de Wet toezicht accountantsorganisaties][ref1] en daardoor
      zwaarwegende openbare belangen in het geding zijn; of

      b. de beroepsorganisatie, ingeval jegens de betrokkene een ernstig vermoeden is gerezen van handelen of nalaten als
      bedoeld in [artikel 42, eerste lid, van de Wet op het accountantsberoep][ref2] en daardoor zwaarwegende belangen in
      het geding zijn.

      2 De accountantskamer kan tot en met het moment van de uitspraak de tijdelijke doorhaling opheffen.

      3 De secretaris van de accountantskamer stelt de Autoriteit Financiële Markten, de beroepsorganisatie en de
      betrokkene onverwijld in kennis van een beslissing tot tijdelijke doorhaling als bedoeld in het eerste lid, dan wel
      tot opheffing daarvan.

      4 Over het voornemen tot tijdelijke doorhaling van de inschrijving wordt de betrokkene gehoord.

      5 Ingeval de accountantskamer naar aanleiding van de in
      [artikel 31, eerste lid, van de Wet toezicht accountantsorganisaties][ref3] of
      [artikel 42, eerste lid, van de Wet op het accountantsberoep][ref4] bedoelde overtredingen beslist tot het opleggen
      van een tijdelijke doorhaling van de inschrijving gedurende een bepaalde termijn, kan zij de periode van tijdelijke
      doorhaling ingevolge het eerste lid in mindering brengen op die termijn.

      6 Het eerste lid is van overeenkomstige toepassing, indien tegen betrokkene een strafrechtelijke vervolging ter
      zake van een misdrijf is ingesteld en het misdrijf mede het uitoefenen van het beroep van betrokkene raakt.

      7 In het geval de inschrijving tijdelijk wordt doorgehaald blijft betrokkene ter zake van handelingen en
      gedragingen, die gedurende de tijd, dat hij ingeschreven stond, hebben plaats gehad, aan tuchtrechtspraak
      onderworpen.

      8 Tegen de bij wijze van voorlopige voorziening opgelegde maatregel van doorhaling staat beroep open bij het
      College. De [artikelen 43 tot en met 43j][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0032573#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0032573#Artikel42
      [ref5]: https://wetten.overheid.nl/BWBR0024238#Artikel43
