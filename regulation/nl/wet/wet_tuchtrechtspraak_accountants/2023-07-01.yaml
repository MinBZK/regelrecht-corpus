  - number: '20'
    text: |-
      1 De [artikelen 14, eerste en tweede lid][ref1], en [15 tot en met 18][ref2] zijn van overeenkomstige toepassing
      op de plaatsvervangers van de voorzitter, de leden en de secretaris. Artikel 14, derde lid is van overeenkomstige
      toepassing op de plaatsvervangers van de voorzitter en de leden.

      2 De [artikelen 34][ref3] en [35][ref4] zijn van overeenkomstige toepassing op de plaatsvervangers van de
      voorzitter en de leden.


