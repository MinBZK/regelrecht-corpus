  - number: '10'
    text: |-
      1 Er is een accountantskamer gevestigd te Zwolle.

      2 De accountantskamer vormt uit haar midden kamers voor het vervullen van haar taak. Kamers kunnen ook buiten de
      vestigingsplaats zitting houden.

      3 De accountantskamer stelt bij reglement nadere regels vast over haar werkwijze.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel10
  - number: '11'
    text: |-
      1 De accountantskamer heeft een voorzitter, ten hoogste veertien leden en een secretaris.

      2 De accountantskamer heeft ten hoogste dertig plaatsvervangende leden.

      3 De accountantskamer kan een of meer plaatsvervangend-secretarissen hebben.

      4 De voorzitter van de accountantskamer kan personen als bedoeld in [artikel 12, tweede lid, eerste volzin][ref1],
      aanwijzen als plaatsvervangend voorzitter.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel12
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024238
        artikel: '12'
        hoofdstuk: III
  - number: '12'
    text: |-
      1 De voorzitter is rechterlijk ambtenaar met rechtspraak belast.

      2 Van de leden is ten minste de helft rechterlijk ambtenaar met rechtspraak belast. De overige leden zijn
      accountant of deskundig ter zake van werkzaamheden die accountants verrichten.

      3 De plaatsvervangende leden zijn rechterlijk ambtenaar met rechtspraak belast, accountant of deskundig ter zake
      van werkzaamheden die accountants verrichten.

      4 De secretaris en de plaatsvervangend-secretarissen zijn personen die zijn aangewezen om werkzaamheden te
      verrichten die bij of krachtens wet aan de griffier bij een gerecht zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel12
  - number: '13'
    text: |-
      1 De voorzitter, de leden en de plaatsvervangende leden worden op voordracht van Onze Minister bij koninklijk
      besluit benoemd voor een periode van zes jaren.

      2 Aanwijzing van de secretaris geschiedt bij koninklijk besluit op voordracht van Onze Minister voor een periode
      van zes jaren.

      3 De plaatsvervangend-secretarissen worden aangewezen door de voorzitter van de accountantskamer.

      4 De aanwijzingen, bedoeld in het tweede en derde lid, eindigen van rechtswege met ingang van de datum dat de
      uitoefening van de functie van secretaris geen onderdeel meer uitmaakt van de werkzaamheden van de betreffende
      ambtenaar.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel13
  - number: '14'
    text: |-
      1 De secretaris en de leden zijn voor hun werkzaamheden enkel verantwoording verschuldigd aan de accountantskamer.

      2 [Artikel 42 van de Wet rechtspositie rechterlijke ambtenaren][ref1] is ten aanzien van de voorzitter de leden en
      de secretaris van overeenkomstige toepassing.

      3 De [artikelen 13a][ref2], [13b, uitgezonderd het eerste lid, onderdelen b en c, en vierde lid][ref3], en
      [13c tot en met 13g van de Wet op de rechterlijke organisatie][ref4] zijn van overeenkomstige toepassing ten
      aanzien van gedragingen van de voorzitter en de leden, met dien verstande dat:

      a. voor de overeenkomstige toepassing van die artikelen onder «het betrokken gerechtsbestuur» wordt verstaan: de
      voorzitter van de accountantskamer; en

      b. de procureur-generaal niet verplicht is aan het verzoek, bedoeld in [artikel 13a][ref5], te voldoen, indien de
      verzoeker redelijkerwijs onvoldoende belang heeft bij een onderzoek als bedoeld in datzelfde artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel13a
