  - number: 43f
    text: |-
      Aan betrokkene, de klager en, indien de beroepsorganisatie partij is in het hoger beroep, de beroepsorganisatie dan
      wel aan hun gemachtigden en aan de raadsman wordt de gelegenheid gegeven het woord te voeren en de gronden van het
      hoger beroep toe te lichten.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel43f
  - number: 43g
    text: |-
      Na de behandeling van de zaak ter terechtzitting bepaalt de voorzitter de dag voor de uitspraak, tenzij het College
      onmiddellijk mondeling uitspraak doet.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel43g
  - number: 43h
    text: |-
      1 Het College verklaart het hoger beroep niet-ontvankelijk, ongegrond of gegrond.

      2 Indien het College niet voldoende is ingelicht, kan het bevelen, dat de behandeling der zaak op een nader te
      bepalen datum zal worden hervat.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel43h
  - number: 43i
    text: |-
      1 Indien het College het hoger beroep gegrond verklaart, vernietigt het de uitspraak van de accountantskamer.
      In dat geval doet het College de zaak zelf af of verwijst haar naar de accountantskamer om haar af te doen met
      inachtneming van de beslissing van het College.

      2 Indien een nader onderzoek noodzakelijk is en het College de zaak zelf afdoet, geschiedt de oproeping
      overeenkomstig [artikel 26][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel26
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel43i
