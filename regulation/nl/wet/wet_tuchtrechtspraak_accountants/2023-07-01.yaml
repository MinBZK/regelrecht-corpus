  - number: '43'
    text: |-
      1 De betrokkene, de klager of de beroepsorganisatie kunnen ieder binnen zes weken na de dag van verzending van de
      uitspraak van de accountantskamer hoger beroep instellen bij het College, tenzij tegen die uitspraak verzet kan of
      kon worden gedaan.

      2 Hoger beroep staat niet open tegen een tussenbeslissing van de accountantskamer of van de voorzitter van de
      accountantskamer, tegen de uitspraak, bedoeld in [artikel 38a][ref1].

      3 Het College informeert de accountantskamer, de Autoriteit Financiële Markten en de beroepsorganisatie, over het
      feit dat hoger beroep is ingesteld en vermeldt daarbij welke zaak het betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel38a
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0024238
        artikel: 38a
        hoofdstuk: IV
  - number: 43a
    text: |-
      1 Het hoger beroep wordt ingesteld door het indienen van een beroepschrift bij het College.

      2 Het beroepschrift is ondertekend en bevat de gronden van het hoger beroep.

      3 De griffier zendt binnen een week na ontvangst van het beroepschrift een afschrift daarvan aan de
      accountantskamer en aan de betrokkene, dan wel de klager of, indien de beroepsorganisatie partij is in het hoger
      beroep, de beroepsorganisatie.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel43a
  - number: 43b
    text: |-
      De accountantskamer doet binnen drie weken na ontvangst van het afschrift van het beroepschrift, bedoeld in
      [artikel 43a, derde lid][ref1], de stukken toekomen aan de griffier van het College.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel43a
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel43b
