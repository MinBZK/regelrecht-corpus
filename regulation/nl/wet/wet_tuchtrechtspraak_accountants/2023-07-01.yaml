  - number: 43j
    text: |-
      1 Het College doet schriftelijk uitspraak.

      2 De uitspraak houdt in de beslissing omtrent het opleggen van de tuchtrechtelijke maatregel, de gronden en de
      voorschriften waarop zij berust.

      3 Het College spreekt de beslissing, bedoeld in het tweede lid, in het openbaar uit.

      4 In afwijking van het eerste lid kan het College na sluiting van het onderzoek ter zitting onmiddellijk mondeling
      uitspraak doen.

      5 Van de mondelinge uitspraak wordt door de griffier een proces-verbaal opgemaakt.

      6 De uitspraak wordt onverwijld aan betrokkene, de klager, de accountantskamer, de Autoriteit Financiële Markten en
      de beroepsorganisatie gezonden.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel43j
  - number: '44'
    text: |-
      1 Het College is bij wijze van voorlopige voorziening bevoegd tot het opleggen van een tijdelijke doorhaling van de
      inschrijving van de betrokkene in de registers:

      a. de Autoriteit Financiële Markten, ingeval jegens de betrokkene een ernstig
      vermoeden is gerezen dat hij heeft gehandeld of heeft nagelaten als bedoeld in
      [artikel 31, eerste lid, van de Wet toezicht accountantsorganisaties][ref1] en daardoor zwaarwegende openbare
      belangen in het geding zijn;

      b. de beroepsorganisatie, ingeval jegens de betrokkene een ernstig vermoeden is gerezen van handelen of nalaten als
      bedoeld in [artikel 42, eerste lid, van de Wet op het accountantsberoep][ref2] en daardoor zwaarwegende openbare
      belangen in het geding zijn.

      2 Het College kan tot en met het moment van de uitspraak de tijdelijke doorhaling opheffen.

      3 De griffier stelt de accountantskamer, de Autoriteit Financiële Markten, de beroepsorganisatie en de betrokkene
      onverwijld in kennis van een beslissing tot tijdelijke doorhaling als bedoeld in het eerste lid, dan wel tot
      opheffing daarvan.

      4 Over het voornemen tot tijdelijke doorhaling van de inschrijving wordt de betrokkene gehoord.

      5 Ingeval het College naar aanleiding van de in
      [artikel 31, eerste lid, van de Wet toezicht accountantsorganisaties][ref3] of
      [artikel 42, eerste lid, van de Wet op het accountantsberoep][ref4], bedoelde overtredingen beslist tot het
      opleggen van een tijdelijke doorhaling van de inschrijving gedurende een bepaalde termijn, kan het de periode van
      de tijdelijke doorhaling van de inschrijving ingevolge het eerste lid in mindering brengen op die termijn.

      6 Het eerste lid is van overeenkomstige toepassing indien tegen betrokkene een strafrechtelijke vervolging ter zake
      van een misdrijf is ingesteld en het misdrijf mede het beroep van betrokkene raakt.

      7 In het geval de inschrijving tijdelijk wordt doorgehaald blijft betrokkene ter zake van handelingen en
      gedragingen, die gedurende de tijd, dat hij ingeschreven stond, hebben plaats gehad, aan tuchtrechtspraak
      onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0032573#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0032573#Artikel42
