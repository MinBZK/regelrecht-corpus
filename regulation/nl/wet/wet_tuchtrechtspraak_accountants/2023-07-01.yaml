  - number: '45'
    text: |-
      De tijdelijke doorhaling van de inschrijving, bedoeld in [artikel 44, eerste lid][ref1], vervalt op het moment dat:

      a. het College op grond van [artikel 44, tweede lid][ref2], de tijdelijke doorhaling opheft; of

      b. het College de zaak zelf afdoet op grond van [artikel 43i, eerste lid][ref3]; of

      c. de accountantskamer, nadat de zaak op grond van [artikel 43i, eerste lid][ref4], ter afdoening naar de
      accountantskamer is verwezen, de tijdelijke doorhaling opheft; of

      d. het vonnis van de accountantskamer onherroepelijk wordt nadat de accountantskamer de zaak die op grond van
      [artikel 43i, eerste lid][ref5], ter afdoening naar de accountantskamer verwezen is, heeft behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel44
