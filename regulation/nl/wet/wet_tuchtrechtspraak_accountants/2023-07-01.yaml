  - number: '23'
    text: |-
      1 De secretaris van de accountantskamer heft van de indiener van het klaagschrift een griffierecht van € 70,–. Het
      griffierecht komt ten bate van de Staat.

      2 De secretaris wijst de indiener van het klaagschrift op de verschuldigdheid van het griffierecht en deelt hem
      mee dat het verschuldigde bedrag binnen vier weken na de dag van verzending van zijn mededeling dient te zijn
      bijgeschreven op de rekening van de accountantskamer. Indien het bedrag niet binnen deze termijn is bijgeschreven,
      wordt de klacht niet-ontvankelijk verklaard, tenzij redelijkerwijs niet kan worden geoordeeld dat de klager in
      verzuim is geweest.

      3 Indien de klacht wordt ingetrokken omdat betrokkene geheel of gedeeltelijk aan de klacht van de klager tegemoet
      is gekomen, wordt het door de klager betaalde griffierecht vergoed door betrokkene. Indien de klacht gegrond wordt
      verklaard wordt het door de klager betaalde griffierecht vergoed door betrokkene.

      4 In afwijking van het eerste lid, wordt geen griffierecht geheven indien een klaagschrift wordt ingediend door de
      Autoriteit Financiële Markten, het openbaar ministerie, het Bureau Financieel Toezicht of de beroepsorganisatie.

      5 Onze Minister kan het in het eerste lid genoemde bedrag wijzigen voor zover de consumentenprijsindex daartoe
      aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel23
  - number: '24'
    text: |-
      Een lid dan wel plaatsvervangend lid van de accountantskamer dat accountant is, wordt ingeval tegen hem een klacht
      is ingediend, vervangen door een door de voorzitter aan te wijzen ander lid dan wel plaatsvervangend lid.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel24
  - number: '25'
    text: |-
      1 De voorzitter van de accountantskamer kan betrokkene verzoeken binnen een termijn van vier weken schriftelijk op
      de ingediende klacht te reageren. De secretaris zendt een afschrift van de reactie van betrokkene aan de klager.

      2 De voorzitter van de accountantskamer kan de klager verzoeken binnen vier weken schriftelijk op de reactie van
      betrokkene te reageren. De secretaris zendt een afschrift van de reactie van de klager aan betrokkene.

      3 De voorzitter van de accountantskamer kan betrokkene verzoeken binnen een termijn van twee weken schriftelijk
      op de reactie van de klager te reageren. De secretaris zendt een afschrift van de reactie van betrokkene aan de
      klager.

      4 De voorzitter van de accountantskamer kan de termijn genoemd in de voorgaande leden verlengen indien het de
      voorzitter van de accountantskamer blijkt dat daar aanleiding toe is.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel25
  - number: 25a
    text: |-
      1 De secretaris van de accountantskamer doet periodiek opgave van ingediende klachten, met een beschrijving van de
      aard en inhoud van de klacht, aan:

      a. de Autoriteit Financiële Markten, voor zover het betreft klachten waarbij een vermoeden bestaat van een handelen
      of nalaten als bedoeld in [artikel 31, eerste lid, van de Wet toezicht accountantsorganisaties][ref1]; en

      b. de beroepsorganisatie, voor zover het betreft klachten waarbij een vermoeden bestaat van een handelen of nalaten
      als bedoeld in [artikel 42, eerste lid, van de Wet op het accountantsberoep][ref2].

      2 Desgevraagd, of op last van de voorzitter van de accountantskamer, zendt de secretaris van de accountantskamer
      aan de in het eerste lid bedoelde instanties een afschrift van het klaagschrift en de reactie van betrokkene, de
      daarbij gevoegde stukken en eventuele aanvullingen daarop.

      3 Op verzoek van de klager worden de processtukken, bedoeld in het tweede lid, in geanonimiseerde vorm aan de
      Autoriteit Financiële Markten of de beroepsorganisatie gezonden, zodat daaruit de persoonsgegevens van de klager
      en derden niet kunnen worden afgeleid. Alsdan wordt met betrekking tot die klacht de opgave, bedoeld in het eerste
      lid, eveneens in geanonimiseerde vorm gedaan.

      4 De voorzitter van de accountantskamer kan op verzoek van de Autoriteit Financiële Markten of de
      beroepsorganisatie de behandeling van een klacht voor ten hoogste zes maanden opschorten indien deze instanties
      hebben aangegeven een onderzoek te verrichten of voornemens te zijn een onderzoek te verrichten naar het handelen
      of nalaten waarop de klacht betrekking heeft en dat onderzoek kan leiden tot het indienen van een klacht door deze
      instanties.

      5 De voorzitter van de accountantskamer kan op verzoek van de instantie die overeenkomstig het derde lid heeft
      aangegeven een onderzoek te verrichten of voornemens te zijn een onderzoek te verrichten, de in het derde lid
      genoemde termijn met ten hoogste drie maanden verlengen, indien de voorbereiding van een klacht meer tijd vergt.

      6 Van de opschorting van de behandeling of de verlenging van de in het derde lid genoemde termijn wordt mededeling
      gedaan aan de klager en betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0032573#Artikel42
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0032573
        artikel: '42'
  - number: '26'
    text: |-
      1 De betrokkene wordt binnen een termijn van ten hoogste tien weken nadat de zaak bij de accountantskamer aanhangig
      is gemaakt opgeroepen om op een door de voorzitter te bepalen dag en uur ter zitting te verschijnen. De voorzitter
      van de accountantskamer kan deze termijn verlengen indien het hem blijkt dat daar aanleiding toe is.

      2 De oproeping wordt ten minste vier weken voor de dag van de zitting aan de betrokkene gezonden en vermeldt de
      plaats van de zitting.

      3 De oproeping gaat vergezeld van een afschrift van het in [artikel 22][ref1] bedoelde klaagschrift en van alle op
      de zaak betrekking hebbende stukken.

      4 De oproeping houdt in:

      a. de namen, het beroep en de woonplaats van de ter zitting opgeroepen getuigen en deskundigen;

      b. de mededeling dat de betrokkene bevoegd is getuigen en deskundigen ter zitting mede te brengen.

      5 De secretaris van de accountantskamer stelt de klager ten minste vier weken voor de dag van de zitting op de
      hoogte van de dag en het tijdstip waarop de zitting plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel22
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0024238
        artikel: '22'
        hoofdstuk: IV
  - number: '27'
    text: |-
      1 De voorzitter van de accountantskamer kan bevelen dat betrokkene in persoon verschijnt.

      2 Indien de betrokkene wiens persoonlijke verschijning is bevolen, niet op de oproeping verschijnt, kan de
      voorzitter van de accountantskamer de officier van justitie bij het arrondissementsparket Oost-Nederland verzoeken
      de betrokkene ter terechtzitting van de accountantskamer te dagvaarden en daarbij te voegen een bevel tot
      medebrenging.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel27
  - number: '28'
    text: |-
      1 De zitting is openbaar.

      2 De accountantskamer kan bepalen dat de behandeling van de zaak geheel of gedeeltelijk met gesloten deuren
      plaatsvindt indien een openbare behandeling een goede rechtspleging of de belangen van betrokkene, klager of derden
      ernstig zou schaden.

      3 De accountantskamer houdt zitting met de voorzitter of een plaatsvervangend voorzitter en twee of vier leden of
      hun plaatsvervangers. Naast de voorzitter is het aantal rechterlijke en het aantal niet rechterlijke leden naar
      evenredigheid verdeeld.

      4 Indien niet wordt voldaan aan hetgeen in het derde lid is bepaald, leidt dit tot nietigheid van de beslissing in
      de tuchtzaak.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel28
  - number: '29'
    text: |-
      1 De voorzitter heeft de leiding van de zitting.

      2 De secretaris houdt aantekening van het verhandelde ter zitting.

      3 De secretaris maakt een proces-verbaal op van de zitting, indien de accountantskamer dit ambtshalve dan wel op
      verzoek van de betrokkene of de klager bepaalt en indien hoger beroep wordt ingesteld.

      4 Het proces-verbaal bevat de namen van de voorzitter en de leden die de zaak behandelen, die van partijen en van
      hun vertegenwoordigers of gemachtigden die op de zitting zijn verschenen en van degenen die hen hebben bijgestaan,
      en die van de getuigen, deskundigen en tolken die op de zitting zijn verschenen.

      5 Het proces-verbaal houdt een beschrijving in van hetgeen op de zitting met betrekking tot de zaak is
      voorgevallen.

      6 Het proces-verbaal wordt door de voorzitter en de secretaris ondertekend.

      7 Aan het proces-verbaal kunnen overgelegde pleitnotities worden gehecht.

      8 De accountantskamer kan bepalen dat de verklaring van een partij, getuige of deskundige geheel in het proces-
      verbaal zal worden opgenomen. In dat geval wordt de verklaring onverwijld op schrift gesteld en aan de partij,
      getuige of deskundige voorgelezen. Deze mag daarin wijzigingen aanbrengen, die op schrift worden gesteld en aan
      de partij, getuige of deskundige worden voorgelezen. De verklaring wordt door de partij, getuige of deskundige
      ondertekend. Heeft ondertekening niet plaats, dan wordt de reden daarvan in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel29
  - number: 29a
    text: |-
      1 De voorzitter van de accountantskamer kan, indien daarvoor gewichtige redenen bestaan, ambtshalve of op verzoek
      van klager of betrokkene bepalen dat tijdens de klachtprocedure ingediende stukken of gegeven inlichtingen dan wel
      onderdelen daarvan uitsluitend ter kennisneming van de partijen staan en niet door hen aan anderen mogen worden
      verstrekt of anderszins openbaar worden gemaakt.

      2 Het eerste lid geldt niet ten aanzien van stukken of inlichtingen die partijen op grond van een wettelijk
      voorschrift verplicht zijn aan anderen te verstrekken of openbaar te maken, en stukken of inlichtingen die reeds
      openbaar zijn dan wel in de uitspraak van de accountantskamer of in hoger beroep van het College openbaar worden
      gemaakt.

      3 De voorzitter van de accountantskamer kan, ambtshalve of op verzoek van klager of betrokkene een
      partij veroordelen tot betaling van een geldsom, dwangsom genaamd, voor het geval dat niet aan het
      eerste lid wordt voldaan, onverminderd het recht op schadevergoeding indien daartoe aanleiding is. De
      [artikelen 611b tot en met 611i van het Wetboek van Burgerlijke rechtsvordering][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel611b
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 611b
  - number: '30'
    text: |-
      In geval van intrekking van de klacht wordt de behandeling daarvan gestaakt, tenzij de accountantskamer beslist dat
      de behandeling van de klacht om redenen aan het algemeen belang ontleend, moet worden voortgezet. In dat laatste
      geval wordt de klacht verder behandeld als ware deze afkomstig van:

      a. de Autoriteit Financiële Markten, bij een vermoeden van handelen of nalaten als bedoeld in
      [artikel 31, eerste lid, van de Wet toezicht accountantsorganisaties][ref1]; of

      b. de beroepsorganisatie, bij een vermoeden van handelen of nalaten als bedoeld in
      [artikel 42, eerste lid, van de Wet op het accountantsberoep][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0032573#Artikel42
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0032573
        artikel: '42'
  - number: '31'
    text: |-
      1 De accountantskamer kan de behandeling ter zitting schorsen.

      2 In het geval de behandeling ter zitting is geschorst, bepaalt de accountantskamer zo spoedig mogelijk het
      tijdstip waarop de behandeling wordt hervat en stelt de secretaris de betrokkene en de klager hiervan op de hoogte
      tenzij het tijdstip van de hervatting op de zitting door de accountantskamer reeds mondeling is vastgesteld en
      mondeling aan klager en de betrokkene is aangezegd. Indien zulks niet mondeling is aangezegd zijn het tweede tot
      en met het vijfde lid van [artikel 26][ref1] van overeenkomstige toepassing, voor zover daaraan niet reeds eerder
      is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel26
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0024238
        artikel: '26'
        hoofdstuk: IV
  - number: '32'
    text: |-
      1 De accountantskamer sluit het onderzoek ter zitting, wanneer zij van oordeel is dat het is voltooid.

      2 Voordat het onderzoek ter zitting wordt gesloten, heeft de betrokkene het recht voor het laatst het woord te
      voeren.

      3 Indien de klacht door de accountantskamer overeenkomstig [artikel 22, vijfde lid][ref1], ter zitting is
      aangevuld en een schriftelijke reactie van betrokkene daartoe aanleiding geeft, kan de accountantskamer besluiten
      de zitting te heropenen. De secretaris doet zo spoedig mogelijk mededeling daarvan aan betrokkene en de klager.

      4 Zodra het onderzoek ter zitting is gesloten, deelt de voorzitter mee wanneer uitspraak zal worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel22
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0024238
        artikel: '22'
        hoofdstuk: IV
  - number: '33'
    text: |-
      1 De betrokkene kan, tenzij de voorzitter van de accountantskamer beveelt dat hij in persoon zal verschijnen, zich
      op een terechtzitting doen vertegenwoordigen door een advocaat, indien deze aldaar verklaart daartoe gevolmachtigd
      te zijn, of wel door een daartoe bij bijzondere volmacht schriftelijk gevolmachtigde.

      2 De accountantskamer kan weigeren bepaalde personen, die geen advocaat zijn, als gemachtigde toe te laten. Bij
      zodanige weigering houdt de accountantskamer de zaak tot de volgende zitting aan.

      3 De accountantskamer stelt de betrokkene van de aanhouding en de reden van de aanhouding in kennis en roept hem
      tevens op om op de voor de zaak bepaalde nadere zitting in persoon of bij een andere gemachtigde tegenwoordig te
      zijn.

      4 De betrokkene kan zich te allen tijde door een raadsman doen bijstaan.

      5 De accountantskamer kan weigeren bepaalde personen, die geen advocaat zijn, als raadsman toe te laten. Bij
      zodanige weigering houdt de accountantskamer op verzoek van de betrokkene de zaak tot een volgende zitting aan.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel33
  - number: '34'
    text: |-
      Op verzoek van betrokkene of de klager, kan de voorzitter of elk van de leden die een zaak behandelen, worden
      gewraakt op grond van feiten en omstandigheden waardoor de onpartijdigheid van de accountantskamer schade zou
      kunnen lijden. De [artikelen 513 tot en met 515 van het Wetboek van Strafvordering][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel513
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '513'
  - number: '35'
    text: |-
      Op grond van feiten en omstandigheden als bedoeld in [artikel 34][ref1] kan een
      voorzitter of een lid die een zaak behandelt, verzoeken zich te mogen verschonen. De
      [artikelen 517, tweede en derde lid, tot en met artikel 518 van het Wetboek van Strafvordering][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel517
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0024238
        artikel: '34'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '517'
  - number: '36'
    text: |-
      1 De accountantskamer kan ambtshalve of op verzoek van de betrokkene of de klager getuigen oproepen.

      2 Ieder die als getuige is opgeroepen, is verplicht voor de accountantskamer te verschijnen.
      [Artikel 27, tweede lid][ref1], is van overeenkomstige toepassing.

      3 Met betrekking tot het horen van de getuigen en hun recht van verschoning zijn de
      [artikelen 217 tot en met 220 van het Wetboek van Strafvordering][ref2] van overeenkomstige toepassing.

      4 De voorzitter van de accountantskamer kan bepalen dat getuigen niet zullen worden gehoord dan na het afleggen van
      de eed of de belofte. Zij leggen in dat geval de eed of de belofte af dat zij zullen zeggen de gehele waarheid en
      niets dan de waarheid.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel217
