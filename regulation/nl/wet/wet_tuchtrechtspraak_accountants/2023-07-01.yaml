  - number: '21'
    text: |-
      1 Onze Minister draagt de kosten van de accountantskamer.

      2 De accountantskamer stelt jaarlijks een begroting op van de in het daaropvolgende jaar te verwachten baten en
      lasten, investeringsuitgaven alsmede inkomsten en uitgaven met betrekking tot de uitvoering van de bij en krachtens
      deze wet opgedragen taak en de daaruit voortvloeiende werkzaamheden.

      3 De begrotingsposten worden van een toelichting voorzien.

      4 Tenzij de werkzaamheden waarop de begroting betrekking heeft nog niet eerder werden verricht, bevat de begroting
      een vergelijking met de begroting van het lopende jaar waarmee Onze Minister heeft ingestemd.

      5 De accountantskamer zendt de begroting voor 1 december van het aan het begrotingsjaar voorafgaande jaar ter
      instemming aan Onze Minister.

      6 De instemming kan worden onthouden wegens strijd met het recht of het algemeen belang. Ingeval van gebleken
      strijdigheid wordt instemming niet onthouden dan nadat de accountantskamer in de gelegenheid is gesteld de
      begroting aan te passen, binnen een door Onze Minister te stellen redelijke termijn.

      7 Wanneer Onze Minister niet met de begroting heeft ingestemd vóór 1 januari van het jaar waarop deze betrekking
      heeft, kan de accountantskamer, in het belang van een juiste uitvoering van haar taak, voor het aangaan van
      verplichtingen en het verrichten van uitgaven beschikken over ten hoogste drie twaalfde gedeelten van de bedragen
      die bij de overeenkomstige onderdelen in de begroting van het voorafgaande jaar waren toegestaan.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel21
  - number: 21a
    text: |-
      Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en begrote
      baten en lasten dan wel inkomsten en uitgaven, doet de accountantskamer daarvan onverwijld mededeling aan Onze
      Minister onder vermelding van de oorzaak van de verschillen.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel21a
  - number: 21b
    text: Bij ministeriële regeling kunnen regels worden gesteld voor de inrichting van de begroting.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel21b
  - number: 21c
    text: |-
      1 De accountantskamer stelt jaarlijks een jaarverslag op en zendt dit voor 1 april aan Onze Ministers.

      2 Onze Minister kan regels stellen ten aanzien van de inhoud van het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel21c
  - number: 21d
    text: |-
      1 De secretaris van de accountantskamer bewaart en registreert de beslissingen van de accountantskamer en de
      beslissingen die het College op basis van de [artikelen 43 tot en met 43j][ref1] in hoger beroep heeft gedaan.

      2 De secretaris van de accountantskamer verstrekt desgevraagd aan de accountantskamer en het College, de leden van
      de rechterlijke macht en de ambtenaren van het openbaar ministerie inlichtingen omtrent beslissingen.

      3 Bij algemene maatregel van bestuur kunnen omtrent het in het eerste en het tweede lid bepaalde nadere regels
      worden gesteld. Daarbij kunnen de in het eerste lid gestelde verplichtingen, voor zover zulks uit het oogpunt van
      een goede rechtsbedeling toelaatbaar is, worden beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel43
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel21d
    references:
      - id: ref1
        bwb_id: BWBR0024238
        artikel: '43'
        hoofdstuk: V
  - number: 21e
    text: |-
      De secretaris van de accountantskamer kan aan degene die daarom verzoekt, tegen betaling der kosten, afschriften
      van onherroepelijke beslissingen van de accountantskamer en het College verstrekken. Zodanige afschriften worden
      niet dan na machtiging van de voorzitter van het college dat de desbetreffende beslissing heeft gegeven, verstrekt.
      Een verzoek daartoe wordt alleen toegestaan ingeval de verzoeker heeft aangetoond dat hij daarbij belang heeft.
      In de afschriften worden de in de desbetreffende beslissingen vermelde namen, voornamen en woonplaatsen van de
      klagers, de getuigen en de deskundigen weggelaten. De namen, voornamen en woonplaatsen van degenen over wie is
      geklaagd worden weggelaten, voor zover hun belang door publicatie in het afschrift onevenredig kan worden geschaad.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel21e
  - number: '22'
    text: |-
      1 Een ieder kan bij een vermoeden van handelen of nalaten:

      a. als bedoeld in [artikel 31, eerste lid, van Wet toezicht accountantsorganisaties][ref1] door een externe
      accountant als bedoeld in [artikel 1, eerste lid, onderdeel e, van die wet][ref2], of

      b. als bedoeld in [artikel 42, eerste lid, van de Wet op het accountantsberoep][ref3] door een accountant,

      door middel van een klaagschrift een klacht indienen bij de accountantskamer. De accountantskamer neemt de klacht
      niet in behandeling indien tussen het moment van het handelen of nalaten en het moment van indiening van de klacht
      een periode van tien jaar is verstreken.

      2 De beroepsorganisatie kan ingeval betrokkene is veroordeeld voor een strafbaar feit en dit feit raakt aan de
      werkzaamheden die een accountant verricht, de zaak binnen drie jaar na de veroordeling aanhangig maken bij de
      accountantskamer door middel van een klaagschrift.

      3 Het klaagschrift vermeldt de naam van de klager, de naam van betrokkene en de feiten waarvoor een
      tuchtrechtelijke maatregel wordt gevraagd. In het klaagschrift wordt vermeld of de klacht is voorgelegd aan
      de organisatie waarbinnen de betrokken accountant werkzaam is, of aan een klachten- of geschillencommissie
      waarbij deze organisatie aangesloten is. Indien de klacht niet is voorgelegd, worden de redenen daarvoor
      in het klaagschrift vermeld. Bij het klaagschrift worden alle op de zaak betrekking hebbende stukken aan de
      accountantskamer overgelegd.

      4 De accountantskamer kan zaken over hetzelfde of een verwant onderwerp ter behandeling voegen en de de behandeling
      van gevoegde zaken splitsen.

      5 Indien een klaagschrift is gebaseerd op [artikel 42, eerste lid, van de Wet op het accountantsberoep][ref4],
      maar tevens betrekking heeft op [artikel 31, eerste lid, van de Wet toezicht accountantsorganisaties][ref5], is
      de accountantskamer gehouden deze klacht ambtshalve aan te vullen. In alle andere gevallen kan de accountantskamer
      de klacht ambtshalve aanvullen. Betrokkene wordt in de gelegenheid gesteld om binnen een termijn van vier weken
      schriftelijk op de aangevulde klacht te reageren en zijn standpunt bekend te maken. De secretaris zendt een
      afschrift van de reactie van betrokkene aan de klager.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0032573#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0032573#Artikel42
      [ref5]: https://wetten.overheid.nl/BWBR0019468#Artikel31
