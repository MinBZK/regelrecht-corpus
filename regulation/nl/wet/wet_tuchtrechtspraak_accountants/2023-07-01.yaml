        artikel: '47'
        hoofdstuk: VI
  - number: '47'
    text: |-
      De tenuitvoerlegging van uitspraken van de accountantskamer en van het College geschiedt op last van de voorzitter
      van de accountantskamer. Tegen deze last staat geen voorziening open.
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel47
  - number: '48'
    text: |-
      1 Een uitspraak wordt, met uitzondering van uitspraken als bedoeld in de [artikelen 41][ref1] en [44][ref2],
      niet ten uitvoer gelegd voordat deze onherroepelijk is, tenzij de accountantskamer vanwege zwaarwegende openbare
      belangen verklaart dat de uitspraak uitvoerbaar bij voorraad is.

      2 Indien een hoger beroep is ingesteld tegen een uitspraak van de accountantskamer dat uitvoerbaar bij voorraad is
      verklaard, kan het College op verzoek van de betrokkene de tenuitvoerlegging van die uitspraak schorsen.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0024238#Artikel44
