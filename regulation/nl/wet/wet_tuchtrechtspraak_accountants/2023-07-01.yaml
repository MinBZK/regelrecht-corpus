preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een wet tot stand te brengen waarin het
    tuchtprocesrecht ten aanzien van accountants op uniforme wijze wordt geregeld en waarin voorts regels worden
    gesteld inzake een klachtenprocedure ten aanzien van accountants;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. *accountant:* accountant als bedoeld in [artikel 1 van de Wet op het accountantsberoep][ref1] of een
      externe accountant die een wettelijke auditor is als bedoeld in artikel 2, onderdeel 2, van de richtlijn,
      die in een andere lidstaat is toegelaten tot het verrichten van controles als bedoeld in artikel 2,
      onderdeel 1, van de richtlijn en die beschikt over een verklaring van vakbekwaamheid als bedoeld in
      [artikel 54 van de Wet op het accountantsberoep][ref2];

      b. *Autoriteit Financiële Markten* de Stichting Autoriteit Financiële Markten;

      c. *betrokkene* degene jegens wie een klacht is ingediend op grond van [artikel 22][ref3] van deze wet;

      d. *beroepsorganisatie:* de Nederlandse beroepsorganisatie van accountants, bedoeld in
      [artikel 2, eerste lid, van de Wet op het accountantsberoep][ref4];

      e. *het College* het College van Beroep voor het bedrijfsleven;

      f. *klager* degene die jegens betrokkene een klacht heeft ingediend op grond van [artikel 22][ref5] van deze wet;

      g. *Onze Minister* Onze Minister van Financiën;

      h. *Onze Ministers* Onze Minister van Financiën en Onze Minister van Justitie;

      i. *registers:* het register, bedoeld in [artikel 11, eerste lid, van de Wet toezicht accountantsorganisaties][ref6]
      en het accountantsregister, bedoeld in [artikel 1 van de Wet op het accountantsberoep][ref7].


