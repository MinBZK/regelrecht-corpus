        artikel: '43'
        hoofdstuk: V
  - number: 43d
    text: |-
      1 Tenzij [artikel 43c, eerste lid][ref1] wordt toegepast, bepaalt de president de dag voor de behandeling
      van de zaak. De betrokkene, de klager en, indien de beroepsorganisatie partij is in het hoger beroep, de
      beroepsorganisatie worden uitgenodigd om op een in de uitnodiging te vermelden plaats en tijdstip op een zitting
      van het College te verschijnen.

      2 Voor de behandeling ter terechtzitting worden de processtukken gedurende ten minste een week ter griffie of
      elders ter kosteloze inzage voor betrokkene, de klager en, indien de beroepsorganisatie partij is in het hoger
      beroep, de beroepsorganisatie dan wel voor hun gemachtigden nedergelegd. De nederlegging wordt door de griffier
      tijdig ter kennis van betrokkene, de klager en, indien de beroepsorganisatie partij is in het hoger beroep, de
      beroepsorganisatie gebracht.

      3 De in het vorige lid bedoelde termijn kan met toestemming van betrokkene, de klager en, indien de
      beroepsorganisatie partij is in het hoger beroep, de beroepsorganisatie worden verkort.

      4 Is de termijn niet in acht genomen, dan bepaalt het College een nieuwe rechtsdag, tenzij betrokkene in persoon of
      bij gemachtigde is verschenen. In dit laatste geval kan op zijn verzoek uitstel worden verleend.

      5 In de gevallen, waarin op de terechtzitting de behandeling van de zaak voor een bepaalde tijd wordt uitgesteld of
      geschorst, wordt geen nieuwe kennisgeving gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel43a
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel43d
    references:
      - id: ref1
        bwb_id: BWBR0024238
        artikel: 43a
        hoofdstuk: V
  - number: 43e
    text: |-
      1 Op het rechtsgeding zijn de [artikelen 28, eerste en tweede lid][ref1], [29][ref2], [31 tot en met 35][ref3],
      [36, eerste, derde en vierde lid][ref4] en [37][ref5] van overeenkomstige toepassing, met dien verstande dat:

      a. in de [artikelen 29][ref6] en [34][ref7], [36, eerste, derde en vierde lid][ref8] en [37][ref9], in plaats van
      «betrokkene of de klager» wordt gelezen: betrokkene, de klager of, indien de beroepsorganisatie partij is in het
      hoger beroep, de beroepsorganisatie;

      b. in [artikel 31][ref10] in plaats van «de betrokkene en de klager» wordt gelezen: de betrokkene, de klager
      en, indien de beroepsorganisatie partij is in het hoger beroep, de beroepsorganisatie, en de termijn genoemd in
      [artikel 26, tweede en vijfde lid][ref11], twee weken bedraagt;

      c. in [artikel 33][ref12] voor «de betrokkene» tevens wordt gelezen: de klager of, indien de beroepsorganisatie
      partij is in het hoger beroep, de beroepsorganisatie.

      2 Het College houdt zitting met drie of vijf leden, onder wie de voorzitter of een plaatsvervangend voorzitter.

      3 Ieder, die als getuige is opgeroepen, is verplicht voor het College te verschijnen.
      [Artikel 27, tweede lid][ref13], is van overeenkomstige toepassing, met dien verstande dat in plaats van
      «arrondissementsparket Oost-Nederland» wordt gelezen: arrondissementsparket Den Haag.


