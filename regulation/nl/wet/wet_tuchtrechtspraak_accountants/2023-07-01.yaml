  - number: '2'
    text: |-
      1 De tuchtrechtelijke maatregelen die de accountantskamer kan opleggen bij handelen of
      nalaten als bedoeld in [artikel 42, eerste lid, van de Wet op het accountantsberoep][ref1] of
      [artikel 31, eerste lid, van de Wet toezicht accountantsorganisaties][ref2], zijn:

      a. waarschuwing;

      b. berisping;

      c. geldboete;

      d. tijdelijke doorhaling van de inschrijving van de accountant in de registers voor ten hoogste drie jaren;

      e. doorhaling van de inschrijving van de accountant in de registers.

      2 Een geldboete kan gezamenlijk met een tuchtrechtelijke maatregel als genoemd in het eerste lid onder a, b, d en
      e, worden opgelegd.

      3 Bij de beslissing tot oplegging van een maatregel als bedoeld in het eerste lid kan worden bepaald
      dat deze beslissing op kosten van betrokkene wordt openbaar gemaakt op een daarbij voorgeschreven
      wijze, indien enig door [artikel 42, eerste lid, van de Wet op het accountantsberoep][ref3] of
      [artikel 31, eerste lid, van de Wet toezicht accountantsorganisaties][ref4] beschermd belang dat vordert.

      4 Bij de beslissing tot het opleggen van de maatregel van tijdelijke doorhaling van de inschrijving van de
      accountant kan de termijn die is gehanteerd ingevolge [artikel 41, eerste lid][ref5], en [44, eerste lid][ref6], op
      de periode van de tijdelijke doorhaling in mindering worden gebracht.


