  - number: '46'
    text: |-
      1 Het College informeert terstond na het doen van de uitspraak de accountantskamer, de Autoriteit Financiële
      Markten en de beroepsorganisatie omtrent de naam van betrokkene en de aard van de opgelegde tuchtrechtelijke
      maatregel.

      2 De Autoriteit Financiële Markten en de beroepsorganisatie dragen na uitvaardiging van een last tot
      tenuitvoerlegging als bedoeld in [artikel 47][ref1], zorg voor opname van de tuchtrechtelijke maatregel in de
      registers.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel47
    url: https://wetten.overheid.nl/BWBR0024238/2023-07-01#Artikel46
    references:
