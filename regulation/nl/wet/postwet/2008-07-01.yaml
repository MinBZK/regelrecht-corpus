$id: postwet
regulatory_layer: WET
publication_date: '2009-06-30'
valid_from: '2008-07-01'
bwb_id: BWBR0004423
url: https://wetten.overheid.nl/BWBR0004423/2008-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de verzelfstandiging van de postdienst wenselijk is
    de wetgeving met betrekking tot de uitvoering van de postdienst te herzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel1
  - number: 1.b
    text: |-
      brieven: bescheiden en schriftelijke mededelingen, al dan niet verpakt, met uitzondering van die welke door
      toepassing van druk- of andere vermenigvuldigingstechnieken in een aantal geheel met elkaar overeenstemmende
      exemplaren ter verspreiding zijn vervaardigd en waarin, behoudens de adressering, geen bijvoegingen, doorhalingen
      of aanduidingen zijn aangebracht;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel1
  - number: 1.c
    text: 'postzendingen: brieven en andere bij algemene maatregel van bestuur aangewezen geadresseerde zendingen;'
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel1
  - number: 1.d
    text: 'postvervoer: geheel van handelingen dat tegen vergoeding wordt verricht teneinde postzendingen af te leveren;'
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel1
  - number: 1.e
    text: |-
      de houder van de concessie: de rechtspersoon, bedoeld in [artikel 2a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2a
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 2a
        paragraaf: '2'
  - number: 1.f
    text: |-
      de akten van de Wereldpostunie: de op 10 juli 1964 te Wenen tot stand gekomen Constitutie van de Wereldpostunie
      (Trb. 1965, 170) en de daarbij behorende voor Nederland bindende verdragen, reglementen en protocollen (Trb. 1965,
      170 en Trb. 1998, 273);
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel1
  - number: 1.g
    text: |-
      college: college, genoemd in [artikel 2 van de Wet Onafhankelijke post- en telecommunicatieautoriteit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008807#Artikel2
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008807
        artikel: '2'
  - number: 1.h
    text: |-
      algemene voorwaarden: door de houder van de concessie vastgestelde schriftelijke bedingen die in overeenkomsten ter
      zake van het postvervoer, bedoeld in [artikel 2, eerste lid][ref1], worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '2'
        paragraaf: '2'
  - number: 1a
    text: |-
      Voorzover nodig en van toepassing, worden bij besluit van Onze Minister de vindplaatsen, genoemd in
      [artikel 1, onder f][ref1], gewijzigd. Van dit besluit wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel1
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '1'
        paragraaf: '1'
  - number: '2.1'
    text: |-
      Ter waarborging van een goede postale dienstverlening is de houder van de concessie verplicht om voor een ieder in
      Nederland het postvervoer van een bij algemene maatregel van bestuur te bepalen omvang, met inbegrip van bij die
      maatregel aangewezen postvervoerdiensten, binnen Nederland en van of naar gebieden buiten Nederland, te verrichten,
      voorzover dit postvervoer betrekking heeft op postzendingen die in voor het publiek bestemde brievenbussen van de
      houder van de concessie zijn gedeponeerd of bij daartoe bestemde inrichtingen van de houder van de concessie zijn
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2
  - number: '2.2'
    text: 'Bij de maatregel, bedoeld in het eerste lid, kan een onderscheid worden gemaakt tussen het postvervoer:'
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2
  - number: 2.2.a
    text: binnen Nederland;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2
  - number: 2.2.b
    text: |-
      van of naar lidstaten van de Europese Unie of andere staten die partij zijn bij de Overeenkomst inzake de Europese
      Economische Ruimte; of
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2
  - number: 2.2.c
    text: van of naar andere landen of andere staten dan bedoeld onder b.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2
  - number: '2.3'
    text: |-
      De houder van de concessie weigert het postvervoer, bedoeld in het eerste lid, indien dit strijdig is met de wet of
      gevaar oplevert voor personen of zaken en kan dit postvervoer weigeren indien dit strijdig is met de eisen die met
      het oog op een doelmatig postvervoer in de algemene voorwaarden worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2
  - number: 2a.1
    text: |-
      Aan een bij wet aan te wijzen rechtspersoon wordt met uitsluiting van anderen concessie verleend voor het
      verrichten van het postvervoer, bedoeld in [artikel 2, eerste lid][ref1], binnen Nederland en van gebieden buiten
      Nederland ten aanzien van brieven die elk afzonderlijk ten hoogste 50 gram wegen, voorzover dit postvervoer wordt
      verricht tegen een tarief dat lager is dan bij algemene maatregel van bestuur bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '2'
        paragraaf: '2'
  - number: 2a.2
    text: 'Voorts wordt aan deze rechtspersoon met uitsluiting van anderen concessie verleend voor:'
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2a
  - number: 2a.2.a
    text: het aan of op de openbare weg plaatsen van voor het publiek bestemde brievenbussen; en
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2a
  - number: 2a.2.b
    text: |-
      het uitgeven van postzegels en postzegelafdrukken met daarop een afbeelding van de Koning dan wel de vermelding
      «Nederland».
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2a
  - number: 2b
    text: |-
      Het verrichten van het postvervoer binnen Nederland en van gebieden buiten Nederland is anders dan krachtens
      de concessie verboden ten aanzien van brieven die elk afzonderlijk ten hoogste 50 gram wegen, voorzover dit
      postvervoer wordt verricht tegen een tarief dat lager is dan vastgesteld krachtens [artikel 2a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2a
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 2a
        paragraaf: '2'
  - number: 2c.1
    text: |-
      Het verbod, bedoeld in [artikel 2b][ref1], is niet van toepassing op het postvervoer ten aanzien van brieven die:


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2b
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 2b
        paragraaf: '2'
  - number: 2c.1.a
    text: worden vervoerd in opdracht van de houder van de concessie;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2c
  - number: 2c.1.b
    text: |-
      anders dan bedrijfsmatig worden vervoerd door of in opdracht van één natuurlijk persoon, of van één rechtspersoon
      of onderdeel daarvan, mits van één afzender afkomstig;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2c
  - number: 2c.1.c
    text: |-
      kennelijk bestemd zijn om te worden vervoerd door de houder van de concessie dan wel te worden afgeleverd na het
      postvervoer, bedoeld in [artikel 2a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2a
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 2a
        paragraaf: '2'
  - number: 2c.1.d
    text: |-
      uitsluitend betrekking hebben op voorwerpen waarmee zij worden vervoerd, dan wel dienen als kwitanties,
      wisselbrieven of andere handelspapieren die worden vervoerd in verband met daarop in te vorderen of uit te betalen
      geldbedragen;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2c
  - number: 2c.1.e
    text: in hoofdzaak tekst bevatten uitgevoerd in voor blinden bestemde tekens; of
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2c
  - number: 2c.1.f
    text: |-
      worden vervoerd met een ontheffing als bedoeld in [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel13
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '13'
        paragraaf: '2'
  - number: 2c.2
    text: |-
      Het verbod, bedoeld in [artikel 2b][ref1], is voorts niet van toepassing op het postvervoer ten aanzien van
      brieven dat strekt tot uitvoering van de document-uitwisselingsdienst. Onder de document-uitwisselingsdienst wordt
      de dienst verstaan die bestaat uit de terbeschikkingstelling van middelen, met inbegrip van het verschaffen van
      ad hoc-ruimte en vervoer door derden, voor zelfbestelling door de wederzijdse uitwisseling van brieven tussen
      gebruikers die zich op deze dienst abonneren.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2b
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 2b
        paragraaf: '2'
  - number: 2d.1
    text: |-
      De houder van de concessie is verplicht aan andere aanbieders van postvervoer toegang te verlenen tot zijn
      postbussen tegen redelijke, objectief gerechtvaardigde en non-discriminatoire voorwaarden en vergoedingen.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2d
  - number: 2d.2
    text: |-
      De in het eerste lid bedoelde voorwaarden en vergoedingen worden in onderling overleg bepaald. Bij gebreke van
      overeenstemming worden deze voorwaarden of vergoedingen op verzoek van de meest gerede partij vastgesteld door
      het college.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel2d
  - number: '3.1'
    text: |-
      De houder van de concessie is gehouden bij de uitvoering van de ingevolge deze wet op hem rustende verplichtingen
      terzake van het postvervoer, bedoeld in [artikel 2, eerste lid][ref1], van of naar gebieden buiten Nederland, de
      voor Nederland bindende verplichtingen na te komen, die voortvloeien uit de akten van de Wereldpostunie dan wel uit
      andere verdragen of besluiten van volkenrechtelijke organisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      De houder van de concessie is gerechtigd voor de toepassing van de akten van de Wereldpostunie op te treden als
      Nederlandse postadministratie.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister geeft in overeenstemming met Onze Minister van Buitenlandse Zaken aan de houder van de concessie
      voorschriften welke strekken tot:
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel3
  - number: 3.3.a
    text: het waarborgen van een goede toepassing van het eerste lid;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel3
  - number: 3.3.b
    text: |-
      het verlenen van de nodige medewerking aan Onze Minister en Onze Minister van Buitenlandse Zaken bij de
      voorbereiding van verdragen en besluiten als bedoeld in het eerste lid en het in verband daarmee te voeren
      internationale overleg.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel3
  - number: '4.1'
    text: |-
      De houder van de concessie kan toestaan dat de uitoefening van het exclusieve recht krachtens de concessie en van
      de terzake van de uitoefening op hem ingevolge deze wet rustende verplichtingen geheel of gedeeltelijk geschiedt
      door een andere rechtspersoon, indien de desbetreffende rechtspersoon:
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel4
  - number: 4.1.a
    text: is opgericht in overeenstemming met het recht van een der Lid-Staten van de Europese Gemeenschappen,
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel4
  - number: 4.1.b
    text: |-
      het recht tot de uitoefening van het exclusieve recht krachtens de concessie feitelijk uitoefent door
      middel van een onderneming die in Nederland gevestigd is of in Nederland een vestiging heeft als bedoeld in
      [artikel 1, onderdeel j, van de Handelsregisterwet 2007][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel1
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '1'
  - number: 4.1.c
    text: |-
      een geplaatst kapitaal heeft dat voor ten minste 51 procent wordt verschaft door de houder van de concessie dan wel
      door een rechtspersoon die voldoet aan het onder *a* tot en met *d* bepaalde, en
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel4
  - number: 4.1.d
    text: |-
      een rechtspersoon is waarin de houder van de concessie dan wel de rechtspersoon, bedoeld onder *c*, de bevoegdheid
      heeft de meerderheid van de bestuurders te benoemen, te schorsen en te ontslaan.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel4
  - number: '4.2'
    text: |-
      Onze Minister kan aan de houder van de concessie, op diens verzoek, ontheffing verlenen van de in het eerste lid,
      onder *c* en *d* gestelde eisen waaraan de in dat lid bedoelde andere rechtspersoon moet voldoen. De ontheffing kan
      onder beperkingen worden verleend en daaraan kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel4
  - number: '4.3'
    text: |-
      In geval van toepassing van het eerste of tweede lid, is de houder van de concessie jegens het college
      verantwoordelijk. De rechtspersoon, bedoeld in het eerste of tweede lid, is jegens de houder van de concessie
      verplicht tot naleving van de ingevolge deze wet op de houder van de concessie rustende verplichtingen. De houder
      van de concessie geeft aan de rechtspersoon, bedoeld in het eerste of tweede lid, daartoe de nodige instructies die
      deze gehouden is op te volgen.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel4
  - number: '4.4'
    text: |-
      Ingeval van toepassing van het eerste of tweede lid, geldt het in de [artikelen 2b][ref1], [7][ref2],
      [8][ref3], [11][ref4] en [13][ref5] met betrekking tot de houder van de concessie bepaalde mede ten aanzien van
      de rechtspersoon die krachtens de toepassing van het eerste of tweede lid het exclusieve recht als daar bedoeld
      uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2b
      [ref2]: https://wetten.overheid.nl/BWBR0004423#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0004423#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0004423#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0004423#Artikel13
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 2b
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004423
        artikel: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004423
        artikel: '8'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0004423
        artikel: '11'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0004423
        artikel: '13'
        paragraaf: '2'
  - number: '4.5'
    text: |-
      De houder van de concessie deelt het college voorafgaande aan de toepassing van het eerste lid, schriftelijk mede
      welke rechtspersoon het in dat lid bedoelde exclusieve recht zal uitoefenen. Het college kan de houder van de
      concessie te allen tijde verzoeken hem informatie te verstrekken over de wijze waarop de houder van de concessie
      heeft verzekerd dat wordt voldaan aan het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel4
  - number: '4.6'
    text: |-
      In de statutaire omschrijving van het doel van de rechtspersoon, bedoeld in het eerste lid, wordt aangegeven welke
      concessietaken door de desbetreffende rechtspersoon zullen worden vervuld.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel4
  - number: '4.7'
    text: |-
      Onder toestaan als bedoeld in het eerste lid wordt tevens begrepen het verlenen van medewerking aan overgang onder
      algemene titel.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister geeft aan de houder van de concessie algemene richtlijnen, welke deze bij de uitvoering van het
      postvervoer, bedoeld in [artikel 2, eerste lid][ref1], gehouden is op te volgen. Artikel 2, tweede lid, is van
      overeenkomstige toepassing op deze richtlijnen. Bij deze richtlijnen kunnen taken worden opgedragen en bevoegdheden
      worden toegekend aan het college.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '2'
        paragraaf: '2'
  - number: '5.2'
    text: 'Deze richtlijnen hebben slechts betrekking op:'
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel5
  - number: 5.2.a
    text: het instandhouden van een goede postale dienstverlening;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel5
  - number: 5.2.b
    text: |-
      de tariefstructuur, de vaststelling en publicatie van tarieven, het voeren van de boekhouding en de aan te brengen
      scheiding in de boekhouding, en de wijze van toerekening van kosten;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel5
  - number: 5.2.c
    text: |-
      de wijze waarop de houder van de concessie in een daartoe door hem in te stellen afzonderlijk overlegorgaan onder
      leiding van een door de Minister aan te wijzen onafhankelijk voorzitter met representatieve organisaties van direct
      belanghebbenden overleg dient te voeren over aangelegenheden van algemene aard en landelijke strekking betreffende
      het postvervoer;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel5
  - number: 5.2.d
    text: |-
      het instellen van een geschillencommissie voor bepaalde groepen gebruikers met betrekking tot de toepassing van de
      algemene voorwaarden;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel5
  - number: 5.2.e
    text: |-
      het verstrekken van informatie aan Onze Minister onderscheidenlijk het college voor een goede uitvoering van het
      bij of krachtens deze wet bepaalde of aan de Commissie van de Europese Gemeenschappen in verband met een bindend
      besluit van de Raad van de Europese Unie, van het Europees Parlement en de Raad gezamenlijk of van de Commissie van
      de Europese Gemeenschappen. Onverminderd het vorenstaande in dit onderdeel is het college bevoegd te allen tijde
      inlichtingen te vorderen, voor zover dit redelijkerwijs voor de vervulling van zijn taak nodig is. De houder van de
      concessie is verplicht de gevorderde inlichtingen te geven.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel5
  - number: '5.3'
    text: 'De in het tweede lid, onder *a*, bedoelde richtlijnen bevatten uitgangspunten en maatstaven ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel5
  - number: 5.3.a
    text: de wijze en mate van dienstverlening;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel5
  - number: 5.3.b
    text: de beveiliging van het postvervoer;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel5
  - number: 5.3.c
    text: |-
      de geheimhouding met betrekking tot postzendingen, alsmede genoegzame voorzorgen bij het openen van gesloten
      postzendingen, als bedoeld in [artikel 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel10
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '10'
        paragraaf: '2'
  - number: 5.3.d
    text: de bescherming van de persoonlijke levenssfeer met betrekking tot postzendingen.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel5
  - number: '5.4'
    text: |-
      Onverminderd het bepaalde bij of krachtens het eerste tot en met het derde lid en het bepaalde in de
      [Mededingingswet][ref1], kan Onze Minister aan de houder van de concessie algemene richtlijnen geven met betrekking
      tot het voorkomen van oneerlijke concurrentie met derden.


      [ref1]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008691
  - number: '5.5'
    text: |-
      De richtlijnen bevatten alleen verplichtingen ten aanzien van het door de houder van de concessie te bereiken
      resultaat en niet ten aanzien van de wijze van bedrijfsvoering om dit resultaat te bereiken.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel5
  - number: '5.6'
    text: |-
      Een besluit betreffende vaststelling of wijziging van de richtlijnen wordt genomen met inachtneming van een
      bedrijfsmatige en op continuïteit gerichte exploitatie door de houder van de concessie.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel5
  - number: '5.7'
    text: |-
      Een beroep door de houder van de concessie, gedaan krachtens [artikel 10, eerste lid, onderdeel ][ref1], op de
      vertrouwelijkheid van aan Onze Minister onderscheidenlijk het college verstrekte informatie als bedoeld in het
      tweede lid, onder e, is alleen toegestaan indien die informatie redelijkerwijs als vertrouwelijk moet worden
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '5.8'
    text: |-
      Voorzover noodzakelijk voor de betaalbaarheid van de postale dienstverlening, bedoeld in het tweede lid, onderdeel
      a, kan bij besluit van Onze Minister voor een bij dat besluit te bepalen periode de ontwikkeling van tarieven
      worden gereguleerd, waarbij kan worden afgeweken van het bij of krachtens het tweede lid, onderdeel b, bepaalde.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel5
  - number: '5.9'
    text: De in het eerste en het vierde lid bedoelde algemene richtlijnen worden bekend gemaakt in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel5
  - number: '5.10'
    text: |-
      Vier jaren na het van kracht worden van de richtlijnen en vervolgens elke vijf jaar nadien dient Onze Minister de
      werking van die richtlijnen te hebben geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel5
  - number: '7.1'
    text: |-
      De houder van de concessie is voor schade als gevolg van verlies, beschadiging of vertraagde aflevering van
      postzendingen in het kader van het postvervoer, bedoeld in [artikel 2, eerste lid][ref1], binnen Nederland slechts
      aansprakelijk indien door de afzender gebruik wordt gemaakt van een wijze van postvervoer waarbij de postzending
      volgens daartoe in de algemene voorwaarden te stellen regels wordt geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '2'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      De aansprakelijkheid bedoeld in het vorige lid bestaat niet indien de schade uitsluitend het gevolg is van één of
      meer van de volgende omstandigheden:
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel7
  - number: 7.2.a
    text: de aard of een gebrek van het vervoerde zelf;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel7
  - number: 7.2.b
    text: onvoldoende verpakking van het vervoerde door een ander dan de houder van de concessie of diens ondergeschikten;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel7
  - number: 7.2.c
    text: een oorzaak die aan de afzender kan worden toegerekend;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel7
  - number: 7.2.d
    text: een oorlogshandeling of een gewapend conflict;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel7
  - number: 7.2.e
    text: aanhouding op last van daartoe bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel7
  - number: '7.3'
    text: |-
      Vorderingen kunnen slechts worden ingediend door de afzender. Indien de schade is geleden door een ander dan de
      afzender, is de afzender van rechtswege bevoegd ten behoeve van die ander, hetzij op eigen naam hetzij als diens
      vertegenwoordiger, de vordering in te stellen.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel7
  - number: '7.4'
    text: |-
      Bij algemene maatregel van bestuur worden bedragen vastgesteld waarboven de aansprakelijkheid bedoeld in het eerste
      lid zich niet uitstrekt, waarbij de hoogte van de afzonderlijke bedragen kan worden bepaald naar gelang van onder
      meer de soorten van registratie alsmede naar gelang van de aard en de waarde van de postzending.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel7
  - number: '7.5'
    text: |-
      De houder van de concessie kan zich niet beroepen op een uit de voorgaande leden van dit artikel voortvloeiende
      uitsluiting of beperking van zijn aansprakelijkheid voor zover de schade is ontstaan uit zijn eigen handelen of
      nalaten, geschied hetzij met het opzet die schade te veroorzaken, hetzij roekeloos en met de wetenschap dat die
      schade er waarschijnlijk uit zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel7
  - number: '7.6'
    text: |-
      Ter zake van het postvervoer, bedoeld in [artikel 2, eerste lid][ref1], van of naar gebieden buiten Nederland is de
      houder van de concessie slechts aansprakelijk overeenkomstig de bepalingen van de akten van de Wereldpostunie dan
      wel andere voor Nederland bindende verdragen of besluiten van volkenrechtelijke organisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '2'
        paragraaf: '2'
  - number: '8.1'
    text: |-
      De houder van de concessie kan gedeelten van het postvervoer, bedoeld in [artikel 2, eerste lid][ref1], door
      anderen doen uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '2'
        paragraaf: '2'
  - number: '8.2'
    text: |-
      De exploitanten van openbare vervoermiddelen zijn verplicht tot het postvervoer tegen vergoeding, die de houder van
      de concessie hun ten vervoer aanbiedt.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel8
  - number: '8.3'
    text: Deze vergoeding wordt in onderling overleg bepaald.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel8
  - number: '8.4'
    text: |-
      Bij gebreke van overeenstemming wordt deze vergoeding op verzoek van de meest gerede partij vastgesteld door de
      kantonrechter in wiens ambtsgebied de exploitant is gevestigd.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel8
  - number: '8.5'
    text: |-
      Degenen die in het eerste of tweede lid bedoelde vervoer verrichten zijn uitsluitend jegens de houder van de
      concessie aansprakelijk en wel tot de bedragen welke de houder van de concessie, overeenkomstig [artikel 7][ref1],
      gehouden is aan afzenders te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel7
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '7'
        paragraaf: '2'
  - number: '9.1'
    text: |-
      Onze Minister stelt ter bevordering van de aflevering aan geadresseerden van voor hen bestemde postzendingen regels
      omtrent plaats, afmetingen en andere hoedanigheden van de voor die aflevering bestemde brievenbussen.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel9
  - number: '9.2'
    text: |-
      Postzendingen die naar hun aard en omvang in aanmerking komen voor aflevering in een brievenbus als in het eerste
      lid bedoeld, kunnen als onbestelbaar worden aangemerkt indien het opgegeven adres niet beschikt over een brievenbus
      die aan de krachtens het eerste lid gestelde regels voldoet.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel9
  - number: '10'
    text: |-
      Gesloten postzendingen die in het kader van het postvervoer als onbestelbaar zijn aan te merken en niet aan de
      afzender kunnen worden teruggegeven kunnen slechts geopend worden op last van de kantonrechter te 's-Gravenhage,
      zulks uitsluitend ter opsporing van de voor teruggave of aflevering nodige gegevens omtrent de afzender of de
      geadresseerde.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel10
  - number: '11'
    text: |-
      Beslag op postzendingen welke in het kader van het postvervoer, bedoeld in [artikel 2, eerste lid][ref1], aan
      de houder van de concessie zijn toevertrouwd is slechts toegelaten in de gevallen dat de wet een zodanig beslag
      uitdrukkelijk regelt.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '2'
        paragraaf: '2'
  - number: '13.1'
    text: |-
      Onze Minister is bevoegd om voor bijzondere omstandigheden, waarin de houder van de concessie niet voorziet in het
      postvervoer, bedoeld in [artikel 2a, eerste lid][ref1], aan anderen dan de houder van de concessie van het verbod,
      bedoeld in [artikel 2b][ref2], ontheffing te verlenen onder door de Minister daaraan te verbinden voorschriften en
      beperkingen, welke in verband met de bijzondere omstandigheden redelijkerwijze nodig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0004423#Artikel2b
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 2a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004423
        artikel: 2b
        paragraaf: '2'
  - number: '13.2'
    text: |-
      Bij toepassing van het eerste lid is Onze Minister bevoegd voor deze ontheffing, als tegemoetkoming in de kosten
      die met de verlening van de ontheffing zijn gemoeid, een vergoeding vast te stellen.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel13
  - number: 13a.1
    text: |-
      De houder van de concessie en de houder van een ontheffing als bedoeld in [artikel 13, eerste lid][ref1], zijn
      ter dekking van de kosten die verband houden met de werkzaamheden van het college, jaarlijks een vergoeding
      verschuldigd, voor zover deze kosten niet reeds krachtens [artikel 13, tweede lid][ref2], verschuldigd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004423#Artikel13
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '13'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004423
        artikel: '13'
        paragraaf: '2'
  - number: 13a.2
    text: |-
      De vergoeding wordt bepaald aan de hand van de door het college te verrichten werkzaamheden toegerekend aan de
      onderscheiden marktcategorieën. Van de toerekening van kosten van werkzaamheden zijn uitgezonderd de kosten,
      verbonden aan de behandeling van bezwaarschriften en aan het optreden als procespartij bij de behandeling van
      beroepschriften.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel13a
  - number: 13a.3
    text: |-
      Onze Minister stelt op voorstel van het college de hoogte van de vergoeding vast. De vergoeding wordt opgelegd door
      het college en voldaan aan het college.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel13a
  - number: 13a.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gegeven met betrekking tot de wijze waarop de
      vergoeding wordt vastgesteld, geheven en ingevorderd.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel13a
  - number: '14'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroep tegen besluiten op grond van
      deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 14a.1
    text: |-
      De bij besluit van Onze Minister aangewezen ambtenaren zijn belast met het toezicht op de naleving van het bepaalde
      bij of krachtens deze wet, voor zover het betreft de bepalingen die betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel14a
  - number: 14a.1.a
    text: |-
      de bijzondere en buitengewone omstandigheden, bedoeld in [paragraaf 5][ref1], en, b. een door hem gegeven
      aanwijzing als bedoeld in [artikel 15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Paragraaf5
      [ref2]: https://wetten.overheid.nl/BWBR0004423#Artikel15
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0004423
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0004423
        artikel: '15'
        paragraaf: 4a
  - number: 14a.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel14a
  - number: 14b.1
    text: |-
      De bij besluit van het college aangewezen ambtenaren zijn belast met het toezicht op de naleving van het bepaalde
      bij of krachtens deze wet, voor zover het betreft de andere dan in [artikel 14a, eerste lid][ref1], bedoelde
      bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel14a
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 14a
        paragraaf: '4'
  - number: 14b.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel14b
  - number: '15.1'
    text: |-
      Indien de houder van de concessie handelt in strijd met een bij of krachtens [paragraaf 5][ref1] gestelde
      verplichting, kan Onze Minister deze een aanwijzing geven.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004423
        paragraaf: '5'
  - number: '15.2'
    text: |-
      Indien de houder van de concessie handelt in strijd met een verplichting gesteld bij of krachtens andere dan in het
      eerste lid bedoelde bepalingen van deze wet, kan het college deze een aanwijzing geven.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15
  - number: 15a.1
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van verplichtingen gesteld bij of
      krachtens:
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15a
  - number: 15a.1.a
    text: |-
      [paragraaf 5][ref1], of,


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004423
        paragraaf: '5'
  - number: 15a.1.b
    text: |-
      een aanwijzing als bedoeld in [artikel 15, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel15
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '15'
        paragraaf: 4a
  - number: 15a.2
    text: 'Het college is bevoegd tot toepassing van bestuursdwang ter handhaving van verplichtingen gesteld bij of krachtens:'
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15a
  - number: 15a.2.a
    text: andere dan in het eerste lid bedoelde bepalingen van deze wet, of,
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15a
  - number: 15a.2.b
    text: |-
      een aanwijzing als bedoeld in [artikel 15, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel15
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '15'
        paragraaf: 4a
  - number: 15b.1
    text: |-
      Onze Minister kan bij beschikking een bestuurlijke boete van ten hoogste een miljoen gulden opleggen aan de houder
      van de concessie, indien deze handelt in strijd met:
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15b
  - number: 15b.1.a
    text: |-
      een verplichting gesteld bij of krachtens [paragraaf 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0004423
        paragraaf: '5'
  - number: 15b.1.b
    text: een verplichting gesteld bij of krachtens een door hem gegeven aanwijzing, of,
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15b
  - number: 15b.1.c
    text: |-
      [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15b.2
    text: 'Het college kan bij beschikking een bestuurlijke boete van ten hoogste € 450 000 opleggen:'
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15b
  - number: 15b.2.a
    text: 'aan de houder van de concessie, indien deze handelt in strijd met:'
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15b
  - number: 15b.2.a.1°
    text: een verplichting gesteld bij of krachtens andere dan in het eerste lid bedoelde bepalingen van deze wet;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15b
  - number: 15b.2.a.2°
    text: een verplichting gesteld bij of krachtens een door hem gegeven aanwijzing, of,
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15b
  - number: 15b.2.a.3°
    text: |-
      [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15b.2.b
    text: |-
      aan de overtreder van [artikel 2b][ref1], of van [artikel 5:20 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2b
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 2b
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15b.3
    text: |-
      Onze Minister, onderscheidenlijk het college, legt geen boete op indien de natuurlijke of rechtspersoon aan wie de
      overtreding kan worden toegerekend aannemelijk maakt dat hem van de overtreding geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15b
  - number: 15b.4
    text: |-
      Bij de vaststelling van de hoogte van de boete houdt Onze Minister, onderscheidenlijk het college, in ieder geval
      rekening met de ernst en de duur van de overtreding.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15b
  - number: 15c.1
    text: 'Met het onderzoek zijn belast:'
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15c
  - number: 15c.1.a
    text: |-
      de in [artikel 14a][ref1] bedoelde ambtenaren, voor zover het de toepassing van [artikel 15b, eerste lid][ref2],
      betreft, en,


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0004423#Artikel15b
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 14a
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004423
        artikel: 15b
        paragraaf: 4a
  - number: 15c.1.b
    text: |-
      de in artikel 14b bedoelde ambtenaren, voor zover het de toepassing van [artikel 15b, tweede lid][ref1], betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel15b
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 15b
        paragraaf: 4a
  - number: 15c.2
    text: |-
      Onverminderd het overigens bij of krachtens deze wet en de [Algemene wet bestuursrecht][ref1] bepaalde beschikken
      de ambtenaren ten behoeve van het onderzoek over de in deze paragraaf geregelde bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 15d
    text: |-
      Indien de ambtenaren in het kader van het onderzoek, bedoeld in [artikel 15c][ref1], een redelijk vermoeden hebben
      dat een natuurlijke persoon of een rechtspersoon een overtreding heeft begaan, is er geen verplichting aan de zijde
      van die natuurlijke persoon of rechtspersoon terzake een verklaring af te leggen. De betrokkenen worden hiervan in
      kennis gesteld voordat hun mondeling om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel15c
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 15c
        paragraaf: 4a
  - number: 15e.1
    text: Indien ambtenaren vaststellen dat een overtreding is begaan, maken zij daarvan een rapport op.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15e
  - number: 15e.2
    text: 'In het rapport worden in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15e
  - number: 15e.2.a
    text: de overtreding, onder verwijzing naar het desbetreffende wettelijke voorschrift;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15e
  - number: 15e.2.b
    text: een aanduiding van de plaats waar en het tijdstip waarop de overtreding is begaan;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15e
  - number: 15e.2.c
    text: de feiten en omstandigheden op grond waarvan is vastgesteld dat een overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15e
  - number: 15e.3
    text: |-
      Een afschrift van het rapport wordt toegezonden aan de betrokkene, bedoeld in [artikel 15b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel15b
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15e
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 15b
        paragraaf: 4a
  - number: 15e.4
    text: |-
      Op verzoek van de belanghebbende die het rapport wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende
      begrijpt draagt Onze Minister, onderscheidenlijk het college, er zoveel mogelijk zorg voor dat de inhoud van het
      rapport aan de betrokkene wordt meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15e
  - number: 15f.1
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt Onze Minister, onderscheidenlijk
      het college, de betrokkene, bedoeld in [artikel 15b][ref2], in de gelegenheid om binnen een redelijke termijn naar
      keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0004423#Artikel15b
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0004423
        artikel: 15b
        paragraaf: 4a
  - number: 15f.2
    text: |-
      Indien de betrokkene, bedoeld in [artikel 15b][ref1], zijn zienswijze mondeling naar voren brengt en de Nederlandse
      taal onvoldoende begrijpt, draagt Onze Minister, onderscheidenlijk het college, op verzoek van de houder zorg voor
      benoeming van een tolk die de betrokkene kan bijstaan, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen
      behoefte bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel15b
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 15b
        paragraaf: 4a
  - number: 15g.1
    text: Een boete wordt opgelegd door Onze Minister, onderscheidenlijk het college.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15g
  - number: 15g.2
    text: 'In de beschikking worden in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15g
  - number: 15g.2.a
    text: de te betalen geldsom;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15g
  - number: 15g.2.b
    text: de overtreding ter zake waarvan zij is gegeven, onder verwijzing naar het desbetreffende wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15g
  - number: 15g.2.c
    text: |-
      de in [artikel 15e, tweede lid, onder b en c][ref1], bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel15e
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15g
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 15e
        paragraaf: 4a
  - number: 15g.3
    text: |-
      Op verzoek van de belanghebbende die de beschikking wegens zijn gebrekkige kennis van de Nederlandse taal
      onvoldoende begrijpt, draagt Onze Minister, onderscheidenlijk het college, er zoveel mogelijk zorg voor dat de
      inhoud van de beschikking aan de betrokkene wordt meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15g
  - number: 15h
    text: |-
      De werkzaamheden die verband houden met de uitvoering van [artikel 15f][ref1] en [15g][ref2] worden verricht door
      personen die niet betrokken zijn geweest bij de opstelling van het in [artikel 15e][ref3] bedoelde rapport en het
      daaraan voorafgaande onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel15f
      [ref2]: https://wetten.overheid.nl/BWBR0004423#Artikel15g
      [ref3]: https://wetten.overheid.nl/BWBR0004423#Artikel15e
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15h
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 15f
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0004423
        artikel: 15g
        paragraaf: 4a
      - id: ref3
        bwb_id: BWBR0004423
        artikel: 15e
        paragraaf: 4a
  - number: 15i
    text: |-
      De werking van een beschikking als bedoeld in [artikel 15g][ref1] wordt opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel15g
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15i
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 15g
        paragraaf: 4a
  - number: 15j
    text: |-
      De boete wordt vermeerderd met de wettelijke rente, te rekenen zes weken vanaf de dag waarop de beschikking is
      bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15j
  - number: 15k
    text: De bevoegdheid tot het opleggen van een boete vervalt vijf jaar nadat de overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15k
  - number: 15l.1
    text: |-
      Een beschikking als bedoeld in [artikel 15b][ref1] wordt, nadat zij is bekendgemaakt, ter inzage gelegd bij Onze
      Minister, indien Onze Minister de beschikking heeft gegeven, onderscheidenlijk bij het college, indien het college
      de beschikking heeft gegeven. Vertrouwelijke bedrijfs- en fabricagegegevens worden niet ter inzage gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel15b
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15l
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 15b
        paragraaf: 4a
  - number: 15l.2
    text: Van de beschikking wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15l
  - number: 15m
    text: |-
      De bevoegdheid tot het opleggen van een boete vervalt indien ter zake van het feit op grond waarvan de
      boete kan worden opgelegd, tegen de betrokkene een strafvervolging is ingesteld en het onderzoek ter
      terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvervolging is vervallen ingevolge
      [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15m
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 15n
    text: |-
      Het recht tot strafvordering vervalt indien Onze Minister, onderscheidenlijk het college, aan de betrokkene ter
      zake van hetzelfde feit een boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15n
  - number: 15o.1
    text: |-
      Voorzover bij de uitoefening van bevoegdheden van het college begrippen worden uitgelegd die worden
      gehanteerd bij de toepassing van [artikel 24 van de Mededingingswet][ref1], geschiedt de uitoefening van die
      bevoegdheden overeenkomstig door het college in overeenstemming met de de raad van bestuur van de Nederlandse
      Mededingingsautoriteit vastgestelde richtlijnen. Van die richtlijnen doet de raad van bestuur mededeling in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel24
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15o
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '24'
  - number: 15o.2
    text: |-
      Het college en de de raad van bestuur van de Nederlandse Mededingingsautoriteit maken in het belang van een
      effectieve en efficiënte besluitvorming gezamenlijk afspraken over de wijze van behandeling van aangelegenheden van
      wederzijds belang.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel15o
  - number: '16.1'
    text: 'Het is anders dan krachtens de concessie verboden:'
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel16
  - number: 16.1.a
    text: |-
      postzegels of postzegelafdrukken te vervaardigen, te verspreiden of ter verspreiding in voorraad te hebben met
      daarop een afbeelding van de Koning dan wel de vermelding "Nederland";
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel16
  - number: 16.1.b
    text: voor het publiek bestemde brievenbussen aan of op de openbare weg te plaatsen.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel16
  - number: '16.2'
    text: |-
      Het is verboden zegels, zegelafdrukken, stempelafdrukken of aanduidingen op zodanige wijze te bezigen, dat zij
      ten onrechte de indruk kunnen wekken, dat de bescheiden of voorwerpen, waarop zij voorkomen, door de houder van de
      concessie behandeld of van de houder van de concessie afkomstig zijn.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel16
  - number: '17.1'
    text: |-
      Overtreding van de [artikelen 2b][ref1], [8, tweede lid][ref2], en [16, eerste lid][ref3], wordt gestraft met
      hechtenis van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2b
      [ref2]: https://wetten.overheid.nl/BWBR0004423#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004423#Artikel16
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 2b
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004423
        artikel: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004423
        artikel: '16'
        paragraaf: 4b
  - number: '17.2'
    text: |-
      Overtreding van [artikel 16, tweede lid][ref1], alsmede van de voorschriften en beperkingen verbonden aan een
      ontheffing verleend krachtens [artikel 13][ref2], wordt gestraft met hechtenis van ten hoogste twee maanden of
      geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004423#Artikel13
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '16'
        paragraaf: 4b
      - id: ref2
        bwb_id: BWBR0004423
        artikel: '13'
        paragraaf: '2'
  - number: '17.3'
    text: De in dit artikel strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel17
  - number: '18'
    text: |-
      In bijzondere omstandigheden in verband met de handhaving van de internationale rechtsorde of met de
      internationale betrekkingen is Onze Minister bevoegd om in overeenstemming met Onze Minister van Buitenlandse
      Zaken aan de houder van de concessie aanwijzingen te geven met betrekking tot het postvervoer, bedoeld in
      [artikel 2, eerste lid][ref1], van of naar gebieden buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '2'
        paragraaf: '2'
  - number: '19.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone omstandigheden dit
      noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, voor het gehele land of een
      deel daarvan [artikel 21, eerste tot en met vierde lid][ref3], in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004423#Artikel21
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0004423
        artikel: '21'
        paragraaf: '5'
  - number: '19.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen wordt onverwijld een voorstel van wet aan de Tweede Kamer
      gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel19
  - number: '19.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel19
  - number: '19.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel19
  - number: '19.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel19
  - number: '19.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel19
  - number: '20'
    text: |-
      In geval voor Nederland of een gedeelte daarvan, op grond van de [artikelen 7, eerste lid][ref1],
      of [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2], bepalingen uit
      de [Oorlogswet voor Nederland][ref3] in werking zijn gesteld, oefent Onze Minister de in
      [artikel 21, eerste lid][ref4], bedoelde bevoegdheid uit in overeenstemming met Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007983
      [ref4]: https://wetten.overheid.nl/BWBR0004423#Artikel21
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0007983
      - id: ref4
        bwb_id: BWBR0004423
        artikel: '21'
        paragraaf: '5'
  - number: '21.1'
    text: |-
      Onze Minister is bevoegd de houder van de concessie aanwijzingen te geven met betrekking tot het postvervoer,
      bedoeld in [artikel 2, eerste lid][ref1], naar, van, of in het gebied waarvoor een besluit als bedoeld in
      [artikel 19][ref2] van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004423#Artikel19
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004423
        artikel: '19'
        paragraaf: '5'
  - number: '21.2'
    text: |-
      Onze Minister kan bij toepassing van het eerste lid afwijken van de verplichtingen die ingevolge de
      [artikelen 2, eerste lid][ref1],,[3, eerste lid][ref2], en [5][ref3] op de houder van de concessie rusten.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004423#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0004423#Artikel5
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004423
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004423
        artikel: '5'
        paragraaf: '2'
  - number: '21.3'
    text: |-
      De aanwijzingen die ingevolge het eerste lid aan de houder van de concessie zijn gegeven, zijn voor deze
      verbindend.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel21
  - number: '21.4'
    text: |-
      De exploitanten van openbare vervoermiddelen zijn gehouden om bij de uitvoering van de in
      [artikel 8, tweede lid][ref1], bedoelde verplichting mee te werken aan de uitvoering door de houder van de
      concessie van aanwijzingen gegeven krachtens het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel8
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '8'
        paragraaf: '2'
  - number: '21.5'
    text: |-
      Indien de houder van de concessie of een exploitant van openbare vervoermiddelen als gevolg van aanwijzingen
      gegeven krachtens het eerste lid onevenredig financieel nadeel ondervindt, kent Onze Minister de betrokkene een
      naar billijkheid te bepalen vergoeding toe.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel21
  - number: '22.1'
    text: |-
      Bij toepassing van [artikel 14 van de Wet buitengewone bevoegdheden burgerlijk gezag][ref1] is de houder van de
      concessie verplicht de krachtens het eerste lid van genoemd artikel aangewezen autoriteiten alle medewerking te
      verlenen, daaronder begrepen het uitvoeren van door die autoriteiten gegeven opdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0007982#Artikel14
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007982
        artikel: '14'
  - number: '22.2'
    text: |-
      Bij toepassing van [artikel 31 van de Oorlogswet voor Nederland][ref1] is de houder van de concessie verplicht
      het militair gezag of een orgaan als bedoeld in het tweede lid van genoemd artikel alle medewerking te verlenen,
      daaronder begrepen het uitvoeren van door dat gezag of dat orgaan gegeven opdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#Artikel31
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007983
        artikel: '31'
  - number: '23'
    text: |-
      Onze Minister geeft aan de houder van de concessie voorschriften ten aanzien van de door deze te nemen
      organisatorische en personele maatregelen met betrekking tot de voorbereiding van het postvervoer, bedoeld in
      [artikel 2, eerste lid][ref1], in buitengewone omstandigheden als bedoeld in [artikel 19][ref2] en de door deze
      daarover aan Onze Minister te verstrekken informatie. De Minister bepaalt in die voorschriften welke kosten van de
      uitvoering redelijkerwijs ten laste van de houder van de concessie dienen te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004423#Artikel19
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004423
        artikel: '19'
        paragraaf: '5'
  - number: '24'
    text: De afbeelding van de Koning op een postzegel of postzegelafdruk behoeft Diens goedkeuring.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel24
  - number: '25.1'
    text: |-
      De voordracht voor een algemene maatregel van bestuur als bedoeld in de [artikelen 1, onder c][ref1],
      [2, eerste lid][ref2], en [2a, eerste lid][ref3], wordt niet gedaan dan nadat een ontwerp van de maatregel aan de
      beide kamers der Staten-Generaal ter kennisneming is toegezonden alsmede in de Staatscourant is geplaatst en nadat
      aan een ieder de gelegenheid is geboden binnen een termijn van twee maanden wensen en bedenkingen ter kennis van
      Onze Minister te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004423#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004423#Artikel2a
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004423
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004423
        artikel: 2a
        paragraaf: '2'
  - number: '25.2'
    text: |-
      Een besluit als bedoeld in [artikel 5][ref1] wordt niet vastgesteld dan twee maanden nadat een ontwerp van dat
      besluit aan de beide kamers der Staten-Generaal ter kennisneming is toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel5
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '5'
        paragraaf: '2'
  - number: '33'
    text: De Postwet 1954 (*Stb.* 592) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel33
  - number: '34'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel34
  - number: '35'
    text: 'Deze wet kan worden aangehaald als: Postwet.'
    url: https://wetten.overheid.nl/BWBR0004423/2008-07-01#Artikel35
