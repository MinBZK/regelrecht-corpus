        artikel: '2.13'
        hoofdstuk: '2'
  - number: '2.13'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan de eigenaar van een vissersvaartuig voor het gedurende ten minste
      vijf en ten hoogste achttienmaal een volledige ononderbroken stilligperiode stopzetten van visserijactiviteiten met
      dat vissersvaartuig.

      2 Als een volledige ononderbroken stilligperiode als bedoeld in het eerste lid wordt beschouwd een periode van 168
      aaneengesloten uren.

      3 De subsidie, bedoeld in het eerste lid, wordt enkel verleend, indien:

      a. uit de logboekgegevens blijkt dat met het betreffende vissersvaartuig in de twee kalenderjaren voorafgaand aan
      het jaar van indiening van de subsidieaanvraag, in de kalenderjaren 2018 en 2019, 2019 en 2020, of 2020 en 2021
      gedurende ten minste 120 dagen visserijactiviteiten op zee zijn verricht;

      b. uit:

      1°. de logboekgegevens blijkt dat de totale hoeveelheid vis die in de in onderdeel a bedoelde visserijactiviteiten
      per kalenderjaar is gevangen, uitgedrukt in kilogrammen levend gewicht, voor ten minste 20 procent bestond uit de
      in [bijlage I][ref1] genoemde vissoorten die zijn gevangen in de bij die vissoort vermelde wateren; of

      2°. de verkoopdocumenten blijkt dat de totale hoeveelheid vis die in de in onderdeel a bedoelde
      visserijactiviteiten per kalenderjaar is verkocht uitgedrukt in euro’s, voor ten minste 20 procent bestond uit de
      in [bijlage I][ref2] genoemde vissoorten die zijn gevangen in de bij die vissoorten vermelde wateren; en

      c. het betreffende vissersvaartuig tijdens de in onderdeel a bedoelde visserijactiviteiten was geregistreerd in
      het visserijregister.


      [ref1]: https://wetten.overheid.nl/BWBR0046962
      [ref2]: https://wetten.overheid.nl/BWBR0046962
    url: https://wetten.overheid.nl/BWBR0046962/2023-11-30#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0046962
      - id: ref2
        bwb_id: BWBR0046962
  - number: '2.14'
    text: |-
      1 De hoogte van de subsidie wordt berekend overeenkomstig de formule:

      Subsidiebedrag = (JO * 0,7) * (D / 365)

      In deze formules betekent:

      JO: de jaaromzet van het vissersvaartuig over de periode, bedoeld in het tweede lid, uitgedrukt in Euro’s;

      D: het aantal dagen dat het vissersvaartuig in een haven stilligt.

      2 Voor de berekening van de subsidie, bedoeld in het eerste lid, wordt het gemiddelde van de fiscale jaren 2017,
      2018 en 2019 gebruikt.

      3 De subsidie, bedoeld in [artikel 2.13, eerste lid][ref1], wordt, indien van toepassing, verminderd met andere
      subsidies of uitkeringen uit nationale regelingen ten behoeve van het financieren van inkomensverlies als gevolg
      van de Brexit voor het betreffende vissersvaartuig, die door de subsidieontvanger zijn ontvangen tussen 1 januari
      2021 en de datum van betaling van de subsidie die verleend wordt op grond van artikel 2.13, eerste lid.

      4 De subsidie, bedoeld in [artikel 2.13, eerste lid][ref2], wordt, indien van toepassing, verminderd met een
      eventuele uitkering van een verzekeringsmaatschappij die verleend is of zal worden voor de vergoeding van deze
      stopzetting van visserijactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0046962#Artikel2.13
      [ref2]: https://wetten.overheid.nl/BWBR0046962#Artikel2.13
