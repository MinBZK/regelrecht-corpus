        hoofdstuk: '2'
  - number: '2.15'
    text: |-
      Het stopzetten van visserijactiviteiten vindt plaats in periode van 1 januari 2021 tot en met 24 december 2022, met
      uitzondering van de periode vanaf 24 december 2021 tot en met 31 december 2021.
    url: https://wetten.overheid.nl/BWBR0046962/2023-11-30#Artikel2.15
  - number: '2.16'
    text: |-
      Onverminderd [artikel 1.5][ref1] omvat een aanvraag in ieder geval:

      a. een overzicht van de volledige ononderbroken stilligperiode waarin de visserijactiviteiten met het
      vissersvaartuig zijn stopgezet;

      b. een rapport van feitelijke bevindingen dat is opgesteld door een erkende accountant, waaruit blijkt wat de
      jaaromzet van het betreffende vissersvaartuig is over het fiscale jaar dat voor berekening van de subsidie, bedoeld
      in [artikel 2.14, eerste lid][ref2], wordt gebruikt;

      c. indien het betreffende vissersvaartuig geen satellietvolgapparatuur heeft, een verklaring van de havenmeester
      waaruit blijkt dat het betreffende vissersvaartuig de volledige ononderbroken stilligperiode, bedoeld in onderdeel
      a, de haven niet heeft verlaten.

      d. een verklaring dat op de subsidieaanvrager geen van de in artikel 10, eerste en derde lid, van de [verordening
      508/2014](32014R0508) genoemde gevallen van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0046962#Artikel1.5
      [ref2]: https://wetten.overheid.nl/BWBR0046962#Artikel2.14
    url: https://wetten.overheid.nl/BWBR0046962/2023-11-30#Artikel2.16
