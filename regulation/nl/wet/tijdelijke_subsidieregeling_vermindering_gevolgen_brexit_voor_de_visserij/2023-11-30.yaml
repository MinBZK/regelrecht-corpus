  - number: '2.3'
    text: |-
      1 De hoogte van de subsidie, bedoeld in [artikel 2.2, eerste lid][ref1], wordt bepaald door het subsidiebedrag per
      brutoton te vermenigvuldigen met de brutotonnage van het betreffende vissersvaartuig en de uitkomst daarvan, indien
      nodig, te vermeerderen met een aanvullend bedrag.

      2 Het subsidiebedrag per brutoton en het eventuele aanvullende bedrag, bedoeld in het eerste lid, zijn
      opgenomen in [bijlage II][ref2], waarbij voor het bepalen van de hoogte van de subsidie, bedoeld in
      [artikel 2.2, eerste lid][ref3], de bedragen worden gebruikt die behoren bij de klasse-indeling in brutotonnage
      waarin het betreffende vissersvaartuig valt.

      3 De brutotonnage van het betreffende vissersvaartuig is de brutotonnage die op de datum van publicatie van deze
      regeling bij het betreffende vissersvaartuig was vermeld in het visserijregister.

      4 De subsidie, bedoeld in [artikel 2.2, eerste lid][ref4], wordt, indien van toepassing, verminderd met:

      a. andere subsidies of uitkeringen uit nationale regelingen ten behoeve van het tijdelijk stilliggen van het
      betreffende vissersvaartuig of het financieren van inkomensverlies als gevolg van de Brexit voor het betreffende
      vissersvaartuig, die door de subsidieontvanger zijn ontvangen tussen 1 januari 2021 en de datum van de beschikking
      tot subsidievaststelling, bedoeld in [artikel 2.9][ref5];

      b. subsidies die door een bestuursorgaan of de Europese Commissie zijn verleend voor de kosten van definitieve
      stopzetting van visserijactiviteiten met het betreffende vissersvaartuig; en

      c. de vergoeding die de subsidieontvanger, na aftrek van de sloopkosten, ontvangt van het sloopbedrijf voor het
      betreffende vissersvaartuig.

      5 Indien het betreffende vissersvaartuig verloren gaat op een tijdstip tussen het moment van subsidieverlening
      en het moment waarop het betreffende vissersvaartuig voor sloop wordt overgedragen aan het sloopbedrijf, wordt
      de subsidie, bedoeld in [artikel 2.2, eerste lid][ref6], verminderd met het bedrag van de door de verzekering
      uitgekeerde vergoeding.


