  - number: '2.4'
    text: |-
      Onverminderd [artikel 1.5][ref1], bevat een aanvraag tot subsidieverlening in ieder geval:

      a. een verklaring van de subsidieaanvrager als bedoeld in [artikel 2.2, tweede lid, onderdeel g][ref2];

      b. het burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref3], van de uiteindelijk
      begunstigde; en

      c. indien een pandrecht is gevestigd op een contingent als bedoeld in [artikel 2.2, tweede lid, onderdeel f][ref4],
      een bewijs van beëindiging van dit pandrecht.


