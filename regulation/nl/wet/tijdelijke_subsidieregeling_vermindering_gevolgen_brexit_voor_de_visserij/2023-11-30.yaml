  - number: '2.7'
    text: |-
      1 Onverminderd [artikel 1.8][ref1], is de subsidieontvanger verplicht om vóór de aanvraag tot subsidievaststelling:

      a. ervoor zorg te dragen:

      1⁰. dat:

      i. het betreffende vissersvaartuig is gesloopt;

      ii. de teboekstelling van het vissersvaartuig in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref2], is doorgehaald overeenkomstig
      [artikel 195 van Boek 8 van het Burgerlijk Wetboek][ref3]; en

      iii. het sloopbedrijf een afschrift van de voltooiingsverklaring als bedoeld in artikel 3, onderdeel 20, van
      de scheepsrecyclingsverordening afgeeft of een sloopverklaring afgeeft waarvoor door de minister een model ter
      beschikking wordt gesteld; of

      2⁰. dat:

      i. het betreffende vissersvaartuig fysiek is overgedragen aan een sloopbedrijf om volledig gesloopt te worden;,

      ii. met de sloop een begin is gemaakt door het onklaar maken van het vissersvaartuig;

      iii. er ten minste één foto is gemaakt voorafgaand aan het onklaar maken en ten minste één foto
      is gemaakt nadat het vaartuig onklaar is gemaakt en op beide foto’s de gegevens, bedoeld in
      [artikel 5 van het Besluit registratie vissersvaartuigen 1998][ref4], te zien zijn; en

      iv. het sloopbedrijf een onklaarverklaring afgeeft waarvoor door de minister een model ter beschikken wordt
      gesteld; en

      b. dat overeenkomstig [artikel 7, eerste lid, van het Besluit registratie vissersvaartuigen 1998][ref5], mededeling
      wordt gedaan dat het betreffende vissersvaartuig niet meer gebruikt wordt als vissersvaartuig en wordt gesloopt of
      al is gesloopt.

      2 De subsidievaststelling wordt enkel verleend indien de subsidieontvanger vanaf het moment van subsidieverlening
      tot en met het moment van subsidievaststelling geen verzoek bij de minister heeft ingediend dat ertoe heeft geleid
      dat:

      1⁰. contingent dat voor het betreffende vissersvaartuig gold of dat op grond van
      [artikel 44 van de Uitvoeringsregeling zeevisserij][ref6] op zijn naam is aangehouden
      geheel of gedeeltelijk is overgedragen overeenkomstig de [artikelen 41][ref7], [42][ref8] of
      [43 van de Uitvoeringsregeling zeevisserij][ref9];

      2⁰. contingent dat voor het betreffende vissersvaartuig gold in gebruik is gegeven overeenkomstig
      [artikel 45, eerste lid, onderdeel a, van de Uitvoeringsregeling zeevisserij][ref10] of die ingebruikgave is
      gewijzigd; en

      3⁰. voor zover onder de naam van de aanvrager nog een of meer andere vissersvaartuigen in het visserijregister
      zijn ingeschreven:

      i. contingent dat voor het betreffende vissersvaartuig gold is verdeeld over deze andere vissersvaartuigen
      overeenkomstig [artikel 40 van de Uitvoeringsregeling zeevisserij][ref11]; en

      ii. aangehouden contingent geldend is gemaakt op deze andere vissersvaartuigen overeenkomstig
      [artikel 44 van de Uitvoeringsregeling zeevisserij][ref12].

      3 De subsidieontvanger schrijft vanaf de dag dat de subsidie is aangevraagd tot en met vijf jaar na de datum van de
      subsidievaststelling geen vissersvaartuig in het visserijregister in. In die termijn verhoogt de subsidieontvanger
      ook niet het motorvermogen of de brutotonnage van eventueel resterende vissersvaartuigen en vraagt daarvoor geen
      visvergunning aan als bedoeld in [artikel 93, tweede lid, van de Uitvoeringsregeling zeevisserij][ref13].

      4 Indien de subsidieontvanger deel uitmaakt van een groep, draagt de subsidieontvanger er tevens zorg voor dat
      de andere ondernemingen die deel uitmaken van die groep, of die binnen vijf jaar na de datum van de beschikking
      tot subsidievaststelling deel uitmaken van die groep, tot en met vijf jaar na de datum van de beschikking tot
      subsidievaststelling voldoen aan de verplichtingen, bedoeld in het derde lid.

      5 Indien de subsidieontvanger gebruikt maakt van de verplichtingen in het eerste lid, onderdeel
      a, onder 2, draagt hij er zorg voor dat het betreffende vissersvaartuig vóór 1 april 2024 geheel
      wordt gesloopt en dat de teboekstelling van het vissersvaartuig in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref14], wordt doorgehaald overeenkomstig
      [artikel 195 van Boek 8 van het Burgerlijk Wetboek][ref15]. Een afschrift van deze doorhaling alsmede een
      afschrift van de voltooiingsverklaring of een door het sloopbedrijf afgegeven sloopverklaring als bedoeld in
      [artikel 2.7, eerste lid, onderdeel a, onder 1][ref16], wordt voor de in de eerste volzin genoemde datum bij de
      minister ingediend met gebruikmaking van een middel dat door de minister beschikbaar wordt gesteld.

      6 De verplichtingen, bedoeld in het eerste, derde en vijfde lid, berusten in het geval van opheffing van de
      rechtspersoon die de subsidieontvanger is, gedurende de in die leden genoemde periode, bij de uiteindelijk
      begunstigde of de uiteindelijk begunstigden van de subsidie.

      7 De verplichtingen, bedoeld in het eerste lid, en het vijfde lid, gelden niet in de situatie, bedoeld in
      [artikel 2.8, vijfde lid][ref17].


