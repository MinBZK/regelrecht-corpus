  - number: '2.11'
    text: |-
      Deze titel vervalt met ingang van 1 januari 2024, met dien verstande dat zij van toepassing blijft op subsidies die
      voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0046962/2023-11-30#Artikel2.11
  - number: '2.12'
    text: |-
      In deze titel wordt verstaan onder:

        - *betreffende vissersvaartuig:* vissersvaartuig ten behoeve waarvan de subsidie, bedoeld in
      [artikel 2.13, eerste lid][ref1], is aangevraagd of verleend;
        - *satellietvolgapparatuur:* satellietvolgapparatuur als bedoeld in artikel 9 van de controleverordening;
        - *verordening 508/2014:* [verordening (EU) nr. 508/2014](32014R0508) van het Europees Parlement en de Raad van
      15 mei 2014 inzake het Europees Fonds voor maritieme zaken en visserij en tot intrekking van de [Verordeningen (EG)
      nr. 2328/2003](32003R2328),[(EG) nr. 861/2006](32006R0861), [(EG) nr. 1198/2006](32006R1198) en [(EG) nr. 791/2007]
      (32007R0791) van de Raad en Verordening (EU) [nr. 1255/2011](32011R1255) van het Europees Parlement en de Raad
      (PbEU 2014, L 149).


      [ref1]: https://wetten.overheid.nl/BWBR0046962#Artikel2.13
    url: https://wetten.overheid.nl/BWBR0046962/2023-11-30#Artikel2.12
