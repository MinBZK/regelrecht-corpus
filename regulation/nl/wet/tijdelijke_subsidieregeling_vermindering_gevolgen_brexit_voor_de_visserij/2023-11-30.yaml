  - number: '2.17'
    text: |-
      1 Een aanvraag om subsidieverlening kan worden ingediend in de periode van 13 april 2023 tot en met 30 juni 2023.

      2 Aanvragen om subsidieverlening kunnen worden ingediend vanaf 09:00 uur op de in het eerste lid genoemde
      begindatum en zijn tijdig ingediend indien zij op de in het eerste lid genoemde einddatum vóór 17:00 uur zijn
      ontvangen.

      3 Het subsidieplafond voor de verstrekking van subsidies op aanvragen die zijn ingediend in de in het eerste lid
      bedoelde periode, bedraagt € 42.000.000.
    url: https://wetten.overheid.nl/BWBR0046962/2023-11-30#Artikel2.17
  - number: '2.18'
    text: |-
      Onverminderd [artikel 1.6][ref1], beslist de minister afwijzend op een aanvraag om subsidie, bedoeld in
      [artikel 2.13, eerste lid][ref2], indien:

      a. het betreffende vissersvaartuig geen satellietvolgapparatuur heeft en:

      1°. uit de logboekgegevens blijkt dat er in de stilligperiode visserijactiviteiten zijn geregistreerd;

      2°. er geen verklaring van de havenmeester is waaruit blijkt dat het betreffende vissersvaartuig de volledige
      ononderbroken stilligperiode, bedoeld in [artikel 2.16, onderdeel a][ref3], in de haven heeft gelegen; en

      3°. de verklaring van de havenmeester niet ondertekend is door zowel de havenmeester als de eigenaar van het
      betreffende vissersvaartuig;

      b. de ingediende aanvraag niet ontvankelijk is voor steun ingevolge artikel 10 van de [verordening 508/2014]
      (32014R0508);

      c. de minister het onaannemelijk acht dat de subsidieaanvrager zal voldoen aan de verplichtingen, bedoeld in
      [artikel 2.19][ref4]; of

      d. de subsidie bestemd is voor de activiteiten als bedoeld in artikel 11, onderdelen a, b, d, e en f, van de
      [verordening 508/2014](32014R0508).


      [ref1]: https://wetten.overheid.nl/BWBR0046962#Artikel1.6
      [ref2]: https://wetten.overheid.nl/BWBR0046962#Artikel2.13
      [ref3]: https://wetten.overheid.nl/BWBR0046962#Artikel2.16
      [ref4]: https://wetten.overheid.nl/BWBR0046962#Artikel2.19
