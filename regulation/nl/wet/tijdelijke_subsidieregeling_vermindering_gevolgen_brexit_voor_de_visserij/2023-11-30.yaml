  - number: '1.5'
    text: |-
      1 Een aanvraag tot subsidieverlening wordt ingediend met gebruikmaking van een middel, dat door de minister
      beschikbaar wordt gesteld.

      2 Een aanvraag tot subsidieverlening bevat in ieder geval:

      a. gegevens over de subsidieaanvrager, waaronder de naam van de subsidieaanvrager, het post- en bezoekadres, het
      rekeningnummer, of er sprake is van een kleine, middelgrote of micro-onderneming als bedoeld in verordening (EU)
      nr. 651/2014 van de Commissie van 17 juni 2014 waarbij bepaalde categorieën van steun op grond van de artikelen 107
      en 108 van het Verdrag met de interne markt verenigbaar worden verklaard (PbEU 2014, L 187) en het nummer waaronder
      de onderneming is ingeschreven bij de Kamer van Koophandel;

      b. gegevens over de contactpersoon bij de subsidieaanvrager, waaronder de naam, het telefoonnummer en het e-
      mailadres,

      c. het CFR-nummer van het vissersvaartuig ten behoeve waarvan de subsidie wordt aangevraagd;

      d. de informatie, bedoeld in artikel 14, eerste lid, onderdeel f, en punt 4a van bijlage III bij de BAR-
      verordening;

      e. een verklaring dat op de subsidieaanvrager geen van de in artikel 11, eerste en derde lid, van de EMFAF-
      verordening genoemde gevallen van toepassing is.
    url: https://wetten.overheid.nl/BWBR0046962/2023-11-30#Artikel1.5
  - number: '1.6'
    text: |-
      De minister beslist afwijzend op een aanvraag tot subsidieverlening, indien:

      a. de aanvraag niet voldoet aan de bij deze regeling gestelde regels;

      b. de subsidie bestemd is voor:

      1°. een rechtspersoon of natuurlijke persoon tegen wie een bevel tot terugvordering uitstaat als bedoeld in artikel
      1, derde lid, onderdeel e, van de groepsvrijstellingsverordening visserij; of

      2°. een onderneming in moeilijkheden als bedoeld in artikel 3, onderdeel 5, van de groepsvrijstellingsverordening
      visserij, die al in moeilijkheden verkeerde vóór 1 januari 2021;

      c. de ingediende aanvraag niet ontvankelijk is voor steun ingevolge artikel 11 van de EMFAF-verordening;

      d. de minister het onaannemelijk acht dat de subsidieaanvrager zal voldoen aan de verplichtingen, bedoeld in
      [artikel 1.8][ref1]; of

      e. de subsidie bestemd is voor de activiteiten als bedoeld in artikel 13, onderdelen a tot en met d, en f tot en
      met m, van de EMFAF-verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0046962#Artikel1.8
    url: https://wetten.overheid.nl/BWBR0046962/2023-11-30#Artikel1.6
