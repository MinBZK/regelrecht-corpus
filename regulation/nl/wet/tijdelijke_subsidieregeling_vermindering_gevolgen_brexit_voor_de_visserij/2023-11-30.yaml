  - number: '1.2'
    text: |-
      1 De minister kan op grond van deze regeling uitsluitend subsidie verstrekken, indien hij de mogelijkheid tot het
      doen van een aanvraag tot subsidieverlening heeft opengesteld door vaststelling van een subsidieplafond en een
      periode voor indiening van de aanvraag.

      2 De minister kan de openstelling beperken tot bepaalde activiteiten, categorieën van aanvragers of een bepaald
      aantal aanvragen.

      3 De minister kan verschillende subsidieplafonds vaststellen voor verschillende activiteiten of categorieën van
      aanvragers.
    url: https://wetten.overheid.nl/BWBR0046962/2023-11-30#Artikel1.2
  - number: '1.3'
    text: |-
      1 De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen. De aanvraag die het eerst
      is binnengekomen, komt het eerst voor subsidie in aanmerking.

      2 Indien een subsidieaanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van
      de aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad
      de aanvraag aan te vullen, geldt met betrekking tot de verdeling als dag van binnenkomst de dag waarop de aanvraag
      voldoet aan de wettelijke voorschriften.

      3 Indien de minister op de dag dat het subsidieplafond wordt bereikt meer dan één aanvraag ontvangt, stelt hij de
      volgorde van die aanvragen vast door middel van loting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0046962/2023-11-30#Artikel1.3
