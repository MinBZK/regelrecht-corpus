  - number: '2.6'
    text: |-
      Onverminderd [artikel 1.6][ref1], beslist de minister afwijzend op een aanvraag om subsidie, bedoeld in
      [artikel 2.2, eerste lid][ref2], indien:

      a. hij het onaannemelijk acht dat de subsidieaanvrager tijdig zal voldoen aan de verplichtingen, bedoeld in
      [artikel 2.7][ref3]; of

      b. het betreffende vissersvaartuig op het moment van subsidieverlening niet meer staat ingeschreven in het
      visserijregister.


      [ref1]: https://wetten.overheid.nl/BWBR0046962#Artikel1.6
