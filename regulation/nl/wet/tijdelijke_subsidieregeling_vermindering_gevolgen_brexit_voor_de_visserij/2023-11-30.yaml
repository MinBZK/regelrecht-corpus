        artikel: '1.8'
        hoofdstuk: '1'
  - number: '1.7'
    text: |-
      1 De minister geeft een beschikking op een aanvraag tot subsidieverlening binnen dertien weken na ontvangst van de
      aanvraag daartoe.

      2 De minister maakt na de datum van de beschikking tot subsidieverlening de volgende gegevens bekend:

      a. de gegevens, bedoeld in artikel 14, derde lid, onderdeel e, van de BAR-verordening; en

      b. de gegevens, bedoeld in artikel 9, eerste lid, van de groepsvrijstellingsverordening visserij.

      3 De gegevens, bedoeld in het tweede lid, onderdeel b, blijven gedurende ten minste tien jaar openbaar beschikbaar.
    url: https://wetten.overheid.nl/BWBR0046962/2023-11-30#Artikel1.7
  - number: '1.8'
    text: |-
      1 De subsidieontvanger doet onverwijld schriftelijk mededeling aan de minister van de indiening bij de rechtbank
      van een verzoek tot het op hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, tot
      verlening van surseance van betaling aan hem of tot faillietverklaring van hem.

      2 De subsidieontvanger doet onverwijld schriftelijk mededeling aan de minister zodra aannemelijk is dat niet, niet
      tijdig of niet geheel aan de bij deze regeling gestelde regels zal worden voldaan.

      3 De subsidieontvanger pleegt gedurende ten minste vijf jaar na de datum van de beschikking tot
      subsidievaststelling geen van de overtredingen genoemd in artikel 11, eerste lid, van de EMFAF-verordening.

      4 De subsidieontvanger voert een zodanige administratie dat daaruit te allen tijde op eenvoudige en duidelijke
      wijze is af te leiden dat de subsidieontvanger voldoet aan de bij deze regeling gestelde eisen.

      5 De administratie, bedoeld in het vierde lid, wordt tot tien jaar na de datum van de beschikking tot
      subsidievaststelling bewaard.

      6 De subsidieontvanger verleent de auditautoriteit, de Europese Commissie of de Europese Rekenkamer alle
      medewerking die deze redelijkerwijs kunnen vorderen bij de uitoefening van hun taken.

      7 De subsidieontvanger verleent gedurende vijf jaar na de datum van de beschikking tot subsidievaststelling
      medewerking aan een evaluatie van de doeltreffendheid en de effecten van de aan hem verleende subsidie, voor zover
      medewerking redelijkerwijs van hem kan worden verlangd.

      8 De verplichtingen, bedoeld in het vierde tot en met zevende lid, berusten in het geval de subsidieontvanger
      een rechtspersoon is en deze wordt opgeheven, gedurende de in die leden genoemde periode bij de uiteindelijk
      begunstigden van de subsidie.
    url: https://wetten.overheid.nl/BWBR0046962/2023-11-30#Artikel1.8
  - number: '2.1'
    text: |-
      In deze titel wordt verstaan onder:

        - *betreffende vissersvaartuig:* vissersvaartuig ten behoeve waarvan de subsidie, bedoeld in
      [artikel 2.2, eerste lid][ref1], is aangevraagd of is verleend;
        - *contingent:* contingent als bedoeld in [artikel 1, eerste lid, van de Uitvoeringsregeling zeevisserij][ref2];
        - *scheepsrecyclingsverordening:* Verordening (EU) nr. 1257/2013 van het Europees Parlement en de Raad van
      20 november 2013 inzake scheepsrecycling, en tot wijziging van Verordening (EG) nr. 1013/2006 en van [Richtlijn
      2009/16/EG](32009L0016) (PbEU 2013, L 330).


