  - number: '2.9'
    text: |-
      De minister geeft een beschikking op een aanvraag tot subsidievaststelling binnen dertien weken na ontvangst van de
      aanvraag daartoe dan wel nadat de voor het indienen ervan geldende termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0046962/2023-11-30#Artikel2.9
  - number: '2.10'
    text: |-
      De subsidie, bedoeld in [artikel 2.2, eerste lid][ref1], bevat staatssteun en wordt gerechtvaardigd door
      staatssteunmaatregel SA.64737 (2022/N).


      [ref1]: https://wetten.overheid.nl/BWBR0046962#Artikel2.2
