  - number: '2.5'
    text: |-
      1 Een aanvraag kan worden ingediend in de periode van donderdag 1 september 2022 tot en met woensdag 30 november
      2022.

      2 Aanvragen kunnen worden ingediend vanaf 09.00 uur op de in het eerste lid genoemde begindatum en zijn tijdig
      ingediend, indien zij op de in het eerste lid genoemde einddatum vóór 17.00 uur zijn ontvangen.

      3 Het subsidieplafond voor de verstrekking van subsidies op aanvragen die zijn ingediend in de in het eerste lid
      bedoelde periode, bedraagt € 155.000.000.
