articles:
  - number: '1.1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - *auditautoriteit:* door de Minister aangewezen autoriteit als bedoeld in artikel 14, eerste lid, onderdeel a, van
      de BAR-verordening;
        - *BAR-verordening:* [verordening (EU) 2021/1755](33655R2021) van het Europees Parlement en de Raad van 6 oktober
      2021 tot oprichting van de reserve voor aanpassing aan de Brexit (PbEU 2021, L 357);
        - *basisverordening:* verordening (EU) nr. 1380/2013 van het Europees Parlement en de Raad van 11 december
      2013 inzake het gemeenschappelijk visserijbeleid, tot wijziging van Verordeningen (EG) nr. 1954/2003 en (EG)
      nr. 1224/2009 van de Raad en tot intrekking van Verordeningen (EG) nr. 2371/2002 en (EG) nr. 639/2004 van de Raad
      en Besluit 2004/585/EG van de Raad (PbEU 2013, L 354);
        - *Brexit:* terugtrekking van het Verenigd Koninkrijk uit de Europese Unie;
        - *brutoton:* eenheid, waarin de brutotonnage van een vissersvaartuig wordt uitgedrukt;
        - *CFR-nummer:* CFR (common fleet register)-nummer als bedoeld in artikel 2, onderdeel l, van
      uitvoeringsverordening (EU) 2017/218 van de Commissie van 6 februari 2017 inzake het vissersvlootregister van de
      Unie (PbEU 2017, L 34);
        - *controleverordening:* verordening (EG) nr. 1224/2009 van de Raad van 20 november 2009 tot vaststelling
      van een communautaire controleregeling die de naleving van de regels van het gemeenschappelijk visserijbeleid
      moet garanderen, tot wijziging van Verordeningen (EG) nr. 847/96, (EG) nr. 2371/2002, (EG) nr. 811/2004, (EG)
      nr. 768/2005, (EG) nr. 2115/2005, (EG) nr. 2166/2005, (EG) nr. 388/2006, (EG) nr. 509/2007, (EG) nr. 676/2007,
      (EG) nr. 1098/2007, (EG) nr. 1300/2008, (EG) nr. 1342/2008 en tot intrekking van Verordeningen (EEG) nr. 2847/93,
      (EG) nr. 1627/94 en (EG) nr. 1966/2006 (PbEU 2009, L 343);
        - *eigenaar van een vissersvaartuig:* de natuurlijke persoon of rechtspersoon die het eigendom heeft van een
      vissersvaartuig en onder wiens naam het in het visserijregister is ingeschreven;
        - *EMFAF-verordening:* [verordening (EU) 2021/1139](33039R2021) van het Europees Parlement en de Raad van 7 juli
      2021 tot oprichting van het Europees Fonds voor maritieme zaken, visserij en aquacultuur en tot wijziging van
      Verordening (EU) nr. 2017/1004 (PbEU 2021, L 247);
        - *groep:* twee of meer ondernemingen als bedoeld in [artikel 5 van de Handelsregisterwet 2007][ref1], die met
      elkaar verbonden zijn doordat zij een van de banden, genoemd in artikel 2, tweede lid, van verordening (EU)
      nr. 717/2014 van de Commissie van 27 juni 2014 inzake de toepassing van de artikelen 107 en 108 van het Verdrag
      betreffende de werking van de Europese Unie op de-minimissteun in de visserij- en aquacultuursector (PbEU 2014,
      L 190), met elkaar onderhouden;
        - *groepsvrijstellingsverordening visserij:* verordening (EU) nr. 1388/2014 van de Commissie van 16 december 2014
      waarbij bepaalde categorieën steun voor ondernemingen die actief zijn in de productie, de verwerking en de afzet
      van visserij- en aquacultuurproducten, op grond van de artikelen 107 en 108 van het Verdrag betreffende de werking
      van de Europese Unie met de interne markt verenigbaar worden verklaard (PbEU 2014, L 369);
        - *logboekgegevens:* de gegevens die overeenkomstig de artikelen 14, 15 en 28 van de controleverordening
      gelezen in samenhang met [artikel 104 van de Uitvoeringsregeling zeevisserij][ref2] of overeenkomstig
      [artikel 104a van de Uitvoeringsregeling zeevisserij][ref3] met betrekking tot een vissersvaartuig zijn verstrekt;
        - *minister:* Minister van Landbouw, Natuur en Voedselkwaliteit;
        - *uiteindelijk begunstigde:* uiteindelijk begunstigde als bedoeld in artikel 3, onderdeel 6, van [Richtlijn (EU)
      2015/849](32015L0849) van het Europees Parlement en de Raad van 20 mei 2015 inzake de voorkoming van het gebruik
      van het financiële stelsels voor het witwassen van geld of terrorismefinanciering, tot wijziging van Verordening
      (EU) nr. 648/2012 van het Europees Parlement en de Raad en tot intrekking van [Richtlijn 2005/60/EG](32005L0060)
      van het Europees Parlement en de Raad en [Richtlijn 2006/70/EG](32006L0070) van de Commissie (PbEU 2015, L 73),
      zoals laatstelijk gewijzigd bij [Richtlijn (EU) 2019/2177](32019L2177) van het Europees Parlement en de Raad van
      18 december 2019 (PbEU 2019, L 334);
        - *verkoopdocumenten:* de gegevens die overeenkomstig de artikelen 62, 63 en 64 van de controleverordening met
      betrekking tot een vissersvaartuig zijn verstrekt;
        - *vismachtiging:* vismachtiging als bedoeld in artikel 4, punt 10, van de controleverordening;
        - *visserijactiviteit:* visserijactiviteit als bedoeld in artikel 4, eerste lid, punt 28, van de basisverordening;
        - *visserijregister:* register als bedoeld in [artikel 4 van het Besluit registratie vissersvaartuigen 1998][ref4];
        - *vissersvaartuig:* vissersvaartuig als bedoeld in artikel 4, eerste lid, punt 4, van de basisverordening, dat is
      ingeschreven in het visserijregister;
        - *visvergunning:* visvergunning als bedoeld in artikel 4, punt 9, van de controleverordening.

      2 Voor de toepassing van deze regeling wordt de brutotonnage van een vissersvaartuig gemeten overeenkomstig artikel
      4, eerste en tweede lid, van [verordening (EU) 2017/1130](33030R2017) van het Europees Parlement en de Raad van
      14 juni 2017 houdende definities van de kenmerken van vissersvaartuigen (PbEU 2017, L 169).


