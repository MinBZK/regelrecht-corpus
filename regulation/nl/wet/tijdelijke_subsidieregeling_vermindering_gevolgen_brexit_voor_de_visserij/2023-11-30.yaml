  - number: '2.8'
    text: |-
      1 De subsidieontvanger vraagt niet later dan 31 juli 2023 de vaststelling van de subsidie aan.

      2 De aanvraag wordt ingediend met gebruikmaking van een middel dat door de minister beschikbaar wordt gesteld.

      3 Bij de aanvraag tot subsidievaststelling wordt in ieder geval meegezonden:

      a. de overeenkomst met het sloopbedrijf, waaruit duidelijk blijkt of de subsidieontvanger, na aftrek van de
      sloopkosten, vergoeding ontvangt van het sloopbedrijf voor het ter sloop overgedragen betreffende vissersvaartuig,
      en zo ja wat de hoogte van de vergoeding is;

      b. een afschrift waaruit blijkt dat de teboekstelling van het vissersvaartuig in de openbare
      registers is doorgehaald en een voltooiingsverklaring of sloopverklaring als bedoeld in
      [artikel 2,7 eerste lid, onderdeel a, onder 1][ref1], dan wel ten minste twee foto’s en een onklaarverklaring als
      bedoeld in artikel 2.7, eerste lid, onderdeel a, onder 2; en

      c. gegevens over de subsidieontvanger, waaronder naam, post- en bezoekadres en rekeningnummer.

      4 De minister kan ten behoeve van de vaststelling van de subsidie bij de subsidieontvanger aanvullende informatie
      of bewijsstukken opvragen die nodig zijn om te beoordelen of voldaan is aan de bij deze regeling gestelde eisen.

      5 In afwijking van het tweede lid, onderdelen a en b, wordt, indien het betreffende vissersvaartuig verloren gegaan
      is op een tijdstip tussen het moment van subsidieverlening en het moment waarop het betreffende vissersvaartuig
      voor sloop wordt aangeboden, bij de aanvraag tot subsidievaststelling meegezonden:

      a. een bewijs van het verloren gaan van het betreffende vissersvaartuig meegezonden;

      b. een afschrift waaruit blijkt dat de teboekstelling van het vissersvaartuig in de openbare registers is
      doorgehaald; en

      c. een verklaring van de verzekeringsmaatschappij omtrent de hoogte van de door de verzekering uitgekeerde
      vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0046962#Artikel2.7
