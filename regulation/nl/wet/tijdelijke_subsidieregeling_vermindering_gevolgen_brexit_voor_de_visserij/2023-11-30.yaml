  - number: '2.21'
    text: |-
      De subsidie, bedoeld in [artikel 2.13, eerste lid][ref1], bevat staatssteun en wordt gerechtvaardigd door
      steunmaatregel SA.104968 (2022/N), en steunmaatregel SA.104968 (2023/N).


      [ref1]: https://wetten.overheid.nl/BWBR0046962#Artikel2.13
