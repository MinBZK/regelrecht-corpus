        artikel: '2.24'
        hoofdstuk: '2'
  - number: '2.26'
    text: |-
      1 Onverminderd [artikel 1.5][ref1] bevat een aanvraag om subsidieverlening:

      a. beknopte informatie waaruit volgt aan welke voorwaarde of voorwaarden als bedoeld in
      [artikel 2.24, eerste lid, onderdeel b][ref2], het desbetreffende vissersvaartuig voldoet;

      b. een verklaring van de subsidieaanvrager over of er een uitkering door een verzekeringsmaatschappij is
      verleend of naar verwachting zal worden verleend voor de vergoeding van het inkomensverlies, bedoeld in
      [artikel 2.24, eerste lid, onderdeel a][ref3], en, voor zo ver van toepassing, wat de hoogte van deze uitkering
      bedraagt of naar verwachting zal bedragen.

      2 Onverminderd [artikel 1.5][ref4], gaat een aanvraag om subsidieverlening vergezeld van:

      a. een rapport van feitelijke bevindingen dat is opgesteld door een erkende
      accountant en gebruikt kan worden bij de beoordeling van de voorwaarde als bedoeld in
      [artikel 2.24, eerste lid, onderdeel a, aanhef en subonderdeel 1° of 2°][ref5], waaruit ten minste blijkt welke
      omzet bij het verrichten van visserijactiviteiten met het vissersvaartuig behaald werd in de periode van 1 januari
      2021 tot en met 31 maart 2021 en:

      1°. welke omzet behaald werd in de periode van 1 januari 2019 tot en met 31 maart 2019, in het geval het
      vissersvaartuig na 1 januari 2015 was ingeschreven in het visserijregister; of

      2°. welke omzet in de kalenderjaren 2015, 2016, 2017, 2018 en 2019 gemiddeld behaald werd in de periode van
      1 januari tot en met 31 maart, in het geval het vissersvaartuig tenminste vanaf 1 januari 2015 was ingeschreven in
      het visserijregister; en

      b. verkoopdocumenten, waaruit volgt dat het vissersvaartuig voldoet aan de voorwaarde als bedoeld in
      [artikel 2.24, eerste lid, onderdeel b, subonderdeel 1°][ref6], voor zover de logboek gegevens onvoldoende
      informatie bevatten over de hoeveelheid aangelande vis van een vissersvaartuig in 2019.


