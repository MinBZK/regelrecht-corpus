      1 Een aanvraag om subsidieverlening kan worden ingediend in de periode van 13 april 2023 tot en met 30 juni 2023.

      2 Aanvragen om subsidieverlening kunnen worden ingediend vanaf 9.00 uur op de in het eerste lid genoemde begindatum
      en zijn tijdig ingediend indien zij op de in het eerste lid genoemde einddatum vóór 17.00 uur zijn ontvangen.

