  - number: '2.20'
    text: |-
      Op grond van de aanvraag voor subsidieverlening en de documenten waarmee deze vergezeld gaat, bedoeld in
      [artikel 2.16][ref1], wordt de subsidie vastgesteld zonder voorafgaande beschikking tot subsidieverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0046962#Artikel2.16
    url: https://wetten.overheid.nl/BWBR0046962/2023-11-30#Artikel2.20
