  - number: '2.2'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan de eigenaar van een vissersvaartuig voor de definitieve
      stopzetting van visserijactiviteiten met dat vissersvaartuig, door sloop van dat vissersvaartuig.

      2 De subsidie, bedoeld in het eerste lid, wordt enkel verleend, indien:

      a. uit de logboekgegevens blijkt dat met het betreffende vissersvaartuig in de twee kalenderjaren 2018 en 2019,
      2019 en 2020, dan wel 2020 en 2021 gedurende ten minste negentig dagen per jaar visserijactiviteiten op zee zijn
      verricht;

      b. uit:

      1⁰. de logboekgegevens blijkt dat de totale hoeveelheid vis die in de in onderdeel a bedoelde visserijactiviteiten
      per kalenderjaar is gevangen uitgedrukt in kilogrammen levend gewicht, voor ten minste 20 procent bestond uit de in
      [bijlage I][ref1] genoemde vissoorten die zijn gevangen in de bij die vissoort vermelde wateren; of

      2⁰. de verkoopdocumenten blijkt de totale hoeveelheid vis die in de in onderdeel a bedoelde visserijactiviteiten
      per kalenderjaar is verkocht uitgedrukt in euro’s, voor ten minste 20 procent bestond uit de in [bijlage I][ref2]
      genoemde vissoorten die zijn gevangen in de bij die vissoorten vermelde wateren;

      c. het betreffende vissersvaartuig tijdens de in onderdeel a bedoelde visserijactiviteiten was geregistreerd in
      het visserijregister;

      d. de aanvrager na de datum van publicatie van deze regeling tot de dag waarop de subsidie door de aanvrager wordt
      aangevraagd, geen vissersvaartuig in het visserijregister heeft ingeschreven;

      e. de totale brutotonnage van het vissersvaartuig of de vissersvaartuigen dat respectievelijk die op naam van
      de aanvrager in het visserijregister is respectievelijk zijn ingeschreven, niet hoger is dan dat de totale
      brutotonnage daarvan was op 31 december 2020;

      f. de aanvrager na 21 juli 2022 bij de minister geen verzoek heeft ingediend dat ertoe heeft geleid dat:

      1⁰. contingent dat voor het betreffende vissersvaartuig gold of dat op grond van
      [artikel 44 van de Uitvoeringsregeling zeevisserij][ref3] op zijn naam was aangehouden,
      geheel of gedeeltelijk is overgedragen overeenkomstig de [artikelen 41][ref4], [42][ref5] of
      [43 van de Uitvoeringsregeling zeevisserij][ref6];

      2⁰. contingent dat voor het betreffende vissersvaartuig gold of dat op grond
      van [artikel 44 van de Uitvoeringsregeling zeevisserij][ref7] op zijn naam
      was aangehouden, geheel of gedeeltelijk in gebruik is gegeven overeenkomstig
      [artikel 45, eerste lid, onderdeel a, van de Uitvoeringsregeling zeevisserij][ref8] of die ingebruikgave is
      gewijzigd; en

      3⁰. voor zover onder de naam van de aanvrager nog een of meer andere vissersvaartuigen in het visserijregister
      zijn ingeschreven:

      i. contingent dat voor het betreffende vissersvaartuig gold is verdeeld over deze andere vissersvaartuigen
      overeenkomstig [artikel 40 van de Uitvoeringsregeling zeevisserij][ref9]; en

      ii. aangehouden contingent als bedoeld in [artikel 44 van de Uitvoeringsregeling zeevisserij][ref10] geldend is
      gemaakt op deze andere vissersvaartuigen overeenkomstig artikel 44 van de Uitvoeringsregeling zeevisserij; en

      g. de eigenaar van het betreffende vissersvaartuig heeft verklaard dat, ingeval de subsidie wordt
      verleend, hij voldoet aan de verplichtingen, bedoeld in [artikel 2.7][ref11], en hij ervan op de
      hoogte is dat de visvergunning en vismachtigingen die ten behoeve van het betreffende vissersvaartuig
      zijn verleend, overeenkomstig de [artikelen 96, eerste lid, onderdeel c][ref12], onderscheidenlijk
      [100, eerste lid, van de Uitvoeringsregeling zeevisserij][ref13] definitief worden ingetrokken en dat
      de contingenten die voor het betreffende vissersvaartuig gelden op grond van de [artikelen 29][ref14] en
      [30 van de Uitvoeringsregeling zeevisserij][ref15], de contingenten die op naam van de eigenaar van het betreffende
      vissersvaartuig zijn aangehouden op grond van [artikel 44 van de Uitvoeringsregeling zeevisserij][ref16] en de
      contingenten die op grond van [artikel 45, eerste lid, onderdeel a, van de Uitvoeringsregeling zeevisserij][ref17]
      in gebruik zijn gegeven, vervallen.


