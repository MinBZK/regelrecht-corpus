  - number: '2.28'
    text: |-
      Onverminderd [artikel 1.6][ref1] beslist de minister afwijzend op een aanvraag om subsidieverlening, bedoeld in
      [artikel 2.24, eerste lid][ref2], indien:

      a. de aanvraag om subsidieverlening betrekking heeft op een vissersvaartuig, waarvoor eerder subsidie is verleend:

      1°. op grond van de [artikelen 2.2][ref3] of [2.24][ref4]; of

      2°. op grond van [artikel 2.13][ref5], indien deze eerdere subsidieverlening geheel of gedeeltelijk betrekking
      heeft op de periode van 1 januari 2021 tot en met 31 maart 2021;

      b. de te verlenen subsidie voor een vissersvaartuig minder dan € 15.000 zou bedragen;

      c. De aanvraag om subsidieverlening betrekking heeft op een vissersvaartuig dat niet was geregistreerd in het
      visserijregister:

      1°. in de periode van 1 januari 2019 tot en met 31 maart 2021, in het geval dit
      vissersvaartuig volgens deze aanvraag zou voldoen aan de voorwaarde als bedoeld in
      [artikel 2.24, eerste lid, onderdeel a, subonderdeel 1°][ref6]; of

      2°. in de periode van 1 januari 2015 tot en met 31 maart 2021,

      in het geval dit vissersvaartuig volgens deze aanvraag zou voldoen aan de voorwaarde als bedoeld in
      [artikel 2.24, eerste lid, onderdeel a, subonderdeel 2°][ref7].


