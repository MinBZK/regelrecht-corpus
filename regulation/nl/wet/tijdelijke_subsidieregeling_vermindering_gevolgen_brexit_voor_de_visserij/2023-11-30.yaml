  - number: '2.19'
    text: |-
      1 Gedurende de volledige ononderbroken stilligperiode, bedoeld in [artikel 2.13, eerste lid][ref1], worden alle
      visserijactiviteiten met het vissersvaartuig stopgezet.

      2 Aan het eerste lid is voldaan, indien:

      a. uit de gegevens van het satellietvolgsysteem voor vaartuigen blijkt dat het vissersvaartuig de haven niet heeft
      verlaten en de satellietvolgapparatuur tijdens de volledige duur van het stopzetten ingeschakeld is; of

      b. het betreffende vissersvaartuig geen satellietvolgapparatuur heeft en is voldaan aan
      [artikel 2.16, aanhef en onderdeel c][ref2];

      3 De subsidieontvanger pleegt gedurende ten minste vijf jaar na de datum van de beschikking tot
      subsidievaststelling geen van de overtredingen genoemd in artikel 10, eerste lid, van [verordening 508/2014]
      (32014R0508).

      4 Indien subsidie wordt verstrekt aan een eigenaar van een vissersvaartuig als bedoeld in artikel 25
      van [verordening 508/2014](32014R0508), wordt de beschikking tot subsidievaststelling onverminderd
      [artikel 4:49 van de Algemene wet bestuursrecht][ref3] ingetrokken of ten nadele van de subsidieontvanger gewijzigd
      indien het vissersvaartuig binnen vijf jaar te rekenen vanaf de datum van de laatste betaling naar buiten de
      Europese Unie wordt overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0046962#Artikel2.13
      [ref2]: https://wetten.overheid.nl/BWBR0046962#Artikel2.16
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel449
