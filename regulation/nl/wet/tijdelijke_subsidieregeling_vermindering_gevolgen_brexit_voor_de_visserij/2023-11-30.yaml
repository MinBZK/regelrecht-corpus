  - number: '2.22'
    text: |-
      Deze titel vervalt met ingang van 1 januari 2024, met dien verstande dat zij van toepassing blijft op subsidies die
      voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0046962/2023-11-30#Artikel2.22
  - number: '2.23'
    text: |-
      In deze titel wordt verstaan onder:

        - *wateren van het Verenigd Koninkrijk:* de territoriale wateren en de exclusieve economische zone van het Verenigd
      Koninkrijk;
        - *wateren van Noorwegen:* de territoriale wateren en de exclusieve economische zone van Noorwegen.
    url: https://wetten.overheid.nl/BWBR0046962/2023-11-30#Artikel2.23
  - number: '2.24'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan de eigenaar van een vissersvaartuig, indien:

      a. er inkomensverlies is ontstaan als gevolg van het behalen van ten minste 30 procent minder omzet door
      het verrichten van visserijactiviteiten in de periode van 1 januari 2021 tot en met 31 maart 2021 met het
      vissersvaartuig waarvoor subsidie is aangevraagd ten opzichte van:

      1°. de omzet die behaald werd in de periode van 1 januari 2019 tot en met 31 maart 2019, in het geval het
      vissersvaartuig na 1 januari 2015 was ingeschreven in het visserijregister; of

      2°. de omzet die in de kalenderjaren 2015, 2016, 2017, 2018 en 2019 gemiddeld behaald werd in de periode van
      1 januari tot en met 31 maart, in het geval het vissersvaartuig tenminste vanaf 1 januari 2015 was ingeschreven in
      het visserijregister; en

      b. het inkomensverlies, bedoeld in onderdeel a, aantoonbaar verband heeft met de Brexit, blijkend uit de vervulling
      van één of meer van de volgende voorwaarden:

      1°. uit de logboek gegevens of de verkoopdocumenten van het vissersvaartuig, bedoeld in onderdeel a, blijkt dat
      de totale hoeveelheid vis, uitgedrukt in kilogrammen levend gewicht respectievelijk waarde in euro’s, die bij het
      verrichten van visserijactiviteiten met dit vissersvaartuig in 2019 werd aangeland, voor ten minste 20 procent
      bestond uit de in bijlage I genoemde vissoorten die zijn gevangen in de bij die vissoorten vermelde wateren;

      2°. uit de beschikbare gegevens uit het volgsysteem voor vaartuigen, bedoeld in artikel 9 van de
      controleverordening, blijkt dat in het kalenderjaar 2019 ten minste in 60 dagen visserijactiviteiten zijn verricht
      in de wateren van het Verenigd Koninkrijk met het vissersvaartuig, bedoeld in onderdeel a;

      3°. uit de beschikbare vismachtigingen en de aanvragen hiervan blijkt dat voor de periode van 1 januari 2021 tot en
      met 16 maart 2021, in tegenstelling tot in de periode van 1 januari 2019 tot en met 16 maart 2019, er op aanvraag
      van de eigenaar van het vissersvaartuig, bedoeld in onderdeel a, geen vismachtiging verleend is voor het met dit
      vissersvaartuig verrichten van visserijactiviteiten in de wateren van Noorwegen; of

      4°. uit de logboek gegevens van het vissersvaartuig, bedoeld in onderdeel a, blijkt dat in de periode van 1 januari
      2018 tot en met 31 december 2020 ten minste gemiddeld 25 procent van de totale hoeveelheid van de gemiddelde
      jaarlijkse vangst van Noorse kreeft van dit vissersvaartuig werd gerealiseerd in de wateren van het Verenigd
      Koninkrijk, ICES deelgebied 4, ten noorden van 53°N met het gebruik van dubbele bordentrawls met een maaswijdte van
      kleiner dan 95 millimeter.

      2 De subsidieaanvrager, dient per vissersvaartuig, een aanvraag om subsidieverlening in.
    url: https://wetten.overheid.nl/BWBR0046962/2023-11-30#Artikel2.24
  - number: '2.25'
    text: |-
      1 De subsidie bedraagt 50 procent van de uitkomst van de berekening van het inkomensverlies, bedoeld
      in [artikel 2.24, eerste lid, onderdeel a][ref1], verminderd met een eventuele uitkering van een
      verzekeringsmaatschappij die verleend is of zal worden voor de vergoeding van dit inkomensverlies.

      2 De subsidie bedraagt ten hoogste € 300.000 per vissersvaartuig, met dien verstande dat aan een subsidieaanvrager
      die voor meerdere vissersvaartuigen subsidie aanvraagt in totaal ten hoogste € 900.000 subsidie wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0046962#Artikel2.24
