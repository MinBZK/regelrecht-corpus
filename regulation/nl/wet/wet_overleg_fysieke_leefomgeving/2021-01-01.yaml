$id: wet_overleg_fysieke_leefomgeving
regulatory_layer: WET
publication_date: '2020-11-18'
valid_from: '2021-01-01'
bwb_id: BWBR0008410
url: https://wetten.overheid.nl/BWBR0008410/2021-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de Herzieningswet adviesstelsel wenselijk is de
    Raad voor verkeer en waterstaat opnieuw in te stellen met handhaving van de bestaande regeling van het overleg met
    betrekking tot het terrein van verkeer en waterstaat;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008410/2021-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Onze Minister:* Onze Minister van Infrastructuur en Waterstaat;
        - *overlegorgaan:* Overlegorgaan Fysieke Leefomgeving, bedoeld in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008410#Artikel4
    url: https://wetten.overheid.nl/BWBR0008410/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008410
        artikel: '4'
  - number: '4'
    text: |-
      Er is een Overlegorgaan Fysieke Leefomgeving voor het voeren van overleg over het beleid inzake fysieke
      leefomgeving.
    url: https://wetten.overheid.nl/BWBR0008410/2021-01-01#Artikel4
  - number: '5'
    text: |-
      Door of namens Onze Minister en, waar daartoe aanleiding bestaat door of namens Onze Ministers wie het mede
      aangaat, worden in het overlegorgaan beleidsvoornemens aan de orde gesteld met betrekking tot onderdelen van het
      beleid inzake fysieke leefomgeving.
    url: https://wetten.overheid.nl/BWBR0008410/2021-01-01#Artikel5
  - number: '6'
    text: |-
      In het overlegorgaan wordt door of namens Onze Minister en waar daartoe aanleiding bestaat, door of namens Onze
      Ministers wie het mede aangaat, overleg gevoerd met betrokkenen en hun organisaties.
    url: https://wetten.overheid.nl/BWBR0008410/2021-01-01#Artikel6
  - number: '7'
    text: |-
      1 Onze Minister wijst de betrokkenen of hun organisaties aan, die zich in het overlegorgaan kunnen doen
      vertegenwoordigen.

      2 Waar daartoe aanleiding bestaat geschiedt de aanwijzing, bedoeld in het eerste lid, in overeenstemming met Onze
      Ministers wie het mede aangaat.

      3 Door of namens Onze Minister en, waar daartoe aanleiding bestaat door of namens Onze Ministers wie het mede
      aangaat, kunnen andere betrokkenen of organisaties dan de betrokkenen of organisaties, bedoeld in het eerste lid,
      bij een vergadering van het overlegorgaan worden betrokken, voor zover dat voor een goede invulling van het overleg
      wenselijk is.
    url: https://wetten.overheid.nl/BWBR0008410/2021-01-01#Artikel7
  - number: '9'
    text: |-
      1 Onze Minister benoemt, schorst en ontslaat personen als voorzitter van het overlegorgaan. Behoudens toepassing
      van het vijfde lid, wordt het voorzitterschap van een overlegvergadering steeds door een van deze personen bekleed.

      2 De voorzitter heeft in het overlegorgaan zitting zonder last.

      3 De benoeming geschiedt voor een periode van ten hoogste vier jaren.

      4 Een voorzitter wordt bij voorkeur slechts eenmaal herbenoemd.

      5 In bijzondere omstandigheden kan een overlegvergadering worden voorgezeten door een andere persoon die door of
      namens Onze Minister is aangewezen.
    url: https://wetten.overheid.nl/BWBR0008410/2021-01-01#Artikel9
  - number: '11'
    text: |-
      Het overlegorgaan komt bijeen, indien ten minste 5 van de betrokkenen of hun organisaties, bedoeld in
      [artikel 7, eerste lid][ref1], daarom verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0008410#Artikel7
    url: https://wetten.overheid.nl/BWBR0008410/2021-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008410
        artikel: '7'
  - number: '12'
    text: |-
      De gezichtspunten van de in het overlegorgaan vertegenwoordigde afzonderlijke betrokkenen of organisaties van hen,
      die resulteren uit het gevoerde overleg, worden door dat orgaan schriftelijk ter kennis gebracht van Onze Minister
      en, waar daartoe aanleiding bestaat, door diens tussenkomst, van Onze Ministers wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0008410/2021-01-01#Artikel12
  - number: '15'
    text: |-
      1 Het overlegorgaan heeft een secretaris.

      2 De secretaris is voor zijn werkzaamheden voor het overlegorgaan uitsluitend verantwoording schuldig aan het
      overlegorgaan.

      3 Aan de secretaris kunnen andere medewerkers worden toegevoegd.

      4 De secretaris en de andere medewerkers zijn geen lid van het overlegorgaan.

      5 Onze Minister stelt aan, bevordert, schorst en ontslaat, na overleg met de voorzitters van het overlegorgaan,
      de secretaris. Onze Minister stelt aan, bevordert, schorst en ontslaat, op voordracht van de secretaris, de andere
      medewerkers.
    url: https://wetten.overheid.nl/BWBR0008410/2021-01-01#Artikel15
  - number: '18'
    text: Deze wet treedt in werking met ingang van 1 januari 1997.
    url: https://wetten.overheid.nl/BWBR0008410/2021-01-01#Artikel18
  - number: '19'
    text: 'Deze wet wordt aangehaald als: Wet overleg fysieke leefomgeving.'
    url: https://wetten.overheid.nl/BWBR0008410/2021-01-01#Artikel19
