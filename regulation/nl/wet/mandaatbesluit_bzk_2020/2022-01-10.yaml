---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: mandaatbesluit_bzk_2020
regulatory_layer: WET
publication_date: '2022-01-19'
valid_from: '2022-01-10'
bwb_id: BWBR0043707
url: https://wetten.overheid.nl/BWBR0043707/2022-01-10
preamble:
  text: |-
    Gelet op artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011;

    Besluit vast te stellen het navolgende Mandaatbesluit:
  url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel1.1
  - number: 1.1.a
    text: '*ministerie:* het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel1.1
  - number: 1.1.b
    text: '*Minister:* de Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel1.1
  - number: 1.1.c
    text: '*Staatssecretaris:* de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel1.1
  - number: 1.1.d
    text: '*bewindspersoon:* de Minister of de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel1.1
  - number: 1.1.e
    text: '*diensthoofd:* een directeur-generaal en de plaatsvervangend directeur-generaal AIVD;'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel1.1
  - number: 1.1.f
    text: |-
      *algemeen directeur:* de algemeen directeur Logius, de algemeen directeur Rijksdienst voor Identiteitsgegevens
      (RvIG) en de algemeen directeur Dienst Nationaal Coördinator Groningen (NCG);
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel1.1
  - number: 1.1.g
    text: |-
      *directeur:* de leidinggevende werkzaam binnen een in het Organisatiebesluit BZK 2020 genoemd dienstonderdeel die
      rechtstreeks ressorteert onder de secretaris-generaal of een (programma)directeur-generaal;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel1.1
  - number: 1.1.h
    text: '*mandaat:* de bevoegdheid om namens een bewindspersoon besluiten te nemen en stukken af te doen en te ondertekenen;'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel1.1
  - number: 1.1.i
    text: |-
      *werkterrein:* de taken van de betreffende functionaris en zijn dienstonderdeel overeenkomstig het
      Organisatiebesluit BZK 2020 en de daarop berustende bepalingen;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel1.1
  - number: 1.1.j
    text: '*Cluster Mensen en Middelen:* de directies P&O, Financieel-economische Zaken en CIO & Informatiemanagement;'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel1.1
  - number: 1.1.k
    text: |-
      *Cluster Bestuursondersteuning:* de directies Communicatie, Bestuursadvisering en Kennis, Internationaal, Europa,
      Macro-economie;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel1.1
  - number: 1.1.l
    text: |-
      *BZK Kerndepartement:* de directoraten-generaal Bestuur, Ruimte en Wonen, Koninkrijksrelaties en
      Overheidsorganisatie, het programma directoraat-generaal Omgevingswet de clusters Mensen en Middelen en
      Bestuursondersteuning en de directie Constitutionele Zaken en Wetgeving.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel1.1
  - number: '1.2'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt met de verlening van mandaat
      gelijkgesteld de verlening van:
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel1.2
  - number: 1.2.a
    text: volmacht om namens een bewindspersoon voor de Staat privaatrechtelijke rechtshandelingen te verrichten;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel1.2
  - number: 1.2.b
    text: |-
      machtiging om namens een bewindspersoon handelingen te verrichten die noch een besluit noch een privaatrechtelijke
      rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel1.2
  - number: '2.1'
    text: 'Mandaat wordt niet verleend met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.1
  - number: 2.1.a
    text: het vaststellen van een algemeen verbindend voorschrift;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.1
  - number: 2.1.b
    text: |-
      het beslissen op een bezwaarschrift tegen een besluit dat persoonlijk door een bewindspersoon of de secretaris-
      generaal is genomen;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.1
  - number: 2.1.c
    text: het beslissen op een beroepschrift;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.1
  - number: 2.1.d
    text: het instellen van een agentschap bij het ministerie;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.1
  - number: 2.1.e
    text: het oprichten van een rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.1
  - number: 2.1.f
    text: het geven van aanwijzingen aan een ander bestuursorgaan op grond van een wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.1
  - number: 2.1.g
    text: |-
      het toepassen van aanwijzing 3 van de [Aanwijzingen inzake externe contacten van rijksambtenaren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031968
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0031968
  - number: 2.1.h
    text: |-
      het vaststellen van de organisatie van het ministerie, bedoeld in
      [artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel3
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0029514
        artikel: '3'
  - number: 2.1.i
    text: |-
      het uitoefenen van de op grond van departementale regelgeving aan de Minister voorbehouden bevoegdheden met
      betrekking tot vertrouwensfuncties en veiligheidsonderzoeken;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.1
  - number: 2.1.j
    text: |-
      het instellen van een adviescommissie of klachtencommissie waarvan de voorzitter geen deel uitmaakt van het
      ministerie en niet werkzaam is onder verantwoordelijkheid van een bewindspersoon, en het benoemen en ontslaan van
      de (plaatsvervangend) voorzitter en (plaatsvervangend) leden van die commissie;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.1
  - number: 2.1.k
    text: |-
      het verlenen van goedkeuring aan, het schorsen of het vernietigen van, dan wel het onthouden van goedkeuring aan
      besluiten van een ander bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.1
  - number: 2.1.l
    text: |-
      het definitief buiten invordering stellen dan wel kwijtschelden van vorderingen op derden vanaf door de Minister
      van Financiën vastgestelde grensbedragen;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.1
  - number: 2.1.m
    text: |-
      het definitief vaststellen van een sectorale arbeidsvoorwaardenovereenkomst waarvoor de Minister verantwoordelijk
      is;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.1
  - number: 2.1.n
    text: |-
      een stuk dat bij de ontvanger de indruk kan wekken dat de ondertekenaar persoonlijk een beslissing neemt die door
      een bewindspersoon behoort te worden genomen.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.1
  - number: 2.2.1
    text: 'Mandaat wordt evenmin verleend met betrekking tot stukken bestemd voor:'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.2
  - number: 2.2.1.a
    text: de Koning;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.2
  - number: 2.2.1.b
    text: de Raad van Ministers (van het Koninkrijk) en daaruit gevormde onderraden en commissies;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.2
  - number: 2.2.1.c
    text: |-
      de voorzitters van de Eerste en Tweede Kamer der Staten-Generaal en de voorzitters van uit de Kamers gevormde
      commissies;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.2
  - number: 2.2.1.d
    text: een minister of een staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.2
  - number: 2.2.1.e
    text: de Raad van State (van het Koninkrijk);
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.2
  - number: 2.2.1.f
    text: de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.2
  - number: 2.2.1.g
    text: de Nationale ombudsman;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.2
  - number: 2.2.1.h
    text: de Gouverneurs van Aruba, Curaçao en Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.2
  - number: 2.2.1.i
    text: de Ministers van Aruba, Curaçao en Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.2
  - number: 2.2.1.j
    text: de Gevolmachtigde Ministers van Aruba, Curaçao en Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.2
  - number: 2.2.1.k
    text: de besturen van de openbare lichamen Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.2
  - number: 2.2.1.l
    text: buitenlandse autoriteiten, in rang gelijk aan of hoger dan een Minister of een Staatssecretaris.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.2
  - number: 2.2.2
    text: |-
      *De beperking in het verlenen van mandaat voor de gevallen genoemd in het eerste lid, is niet van toepassing indien
      het een stuk betreft van louter informatieve of administratieve aard, dan wel het een aangelegenheid betreft van
      onderschikt beleidsmatig of politiek belang.*
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel2.2
  - number: '3.1'
    text: |-
      Aan de secretaris-generaal wordt mandaat verleend ten aanzien van aangelegenheden die, gelet op het Koninklijk
      __REF000___________________________________________________________________________________________________________
      ______, behoren tot het werkterrein van de secretaris-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0004419
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0004419
  - number: '3.2'
    text: |-
      Onverminderd het bepaalde in dit besluit, heeft het mandaat van de secretaris-generaal in ieder geval betrekking
      op:
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.2
  - number: 3.2.a
    text: |-
      het werkterrein van de functionarissen en organisatieonderdelen van het ministerie, met uitzondering van het
      werkterrein van het Bureau Algemene Bestuursdienst;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.2
  - number: 3.2.b
    text: |-
      het beleid en beheer inzake alle aspecten van de bedrijfsvoering van het ministerie met inbegrip van
      aangelegenheden op organisatorisch, personeel, financieel en materieel gebied;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.2
  - number: 3.2.c
    text: |-
      het vaststellen van de formatie van het ministerie, bedoeld in
      [artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel3
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0029514
        artikel: '3'
  - number: 3.2.d
    text: |-
      het rechtstreeks leiding geven aan de diensthoofden en overige rechtstreeks onder de secretaris-generaal
      ressorterende functionarissen, voor zover ten aanzien van de directeur-generaal voor de Algemene Bestuursdienst
      niet anders is bepaald;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.2
  - number: 3.2.e
    text: het nader vaststellen van de inrichting van het ministerie;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.2
  - number: 3.2.f
    text: |-
      aangelegenheden die op grond van bovendepartementale regelgeving of afspraken op centraal departementaal niveau
      dienen te worden afgehandeld;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.2
  - number: 3.2.g
    text: het beslissen op bezwaarschriften;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.2
  - number: 3.2.h
    text: |-
      het optreden als gemachtigd ambtenaar in de zin van departementale regelgeving met betrekking tot de uitvoering van
      de [Wet openbaarheid van bestuur][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: 3.2.i
    text: |-
      het behandelen van klachten ingevolge een wettelijke regeling met betrekking tot klachtrecht, waarover door een
      commissie wordt gerapporteerd of geadviseerd;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.2
  - number: 3.2.j
    text: |-
      het vertegenwoordigen van de Minister in het Decentraal georganiseerd overleg, zoals genoemd in paragraaf 27.2 CAO
      Rijk 2020;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.2
  - number: 3.2.k
    text: |-
      personele beheerbeslissingen op grond van het [Besluit financiën en personeel Kabinetten van de Gouverneurs][ref1]
      ten aanzien van de directeuren van de Kabinetten van de Gouverneurs van Aruba, Curaçao en Sint Maarten;


      [ref1]: https://wetten.overheid.nl/BWBR0030723
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0030723
  - number: 3.2.l
    text: |-
      de verantwoordelijkheid voor het beheer van de archiefbescheiden bij het ministerie op grond van de geldende wet-
      en regelgeving;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.2
  - number: 3.2.m
    text: |-
      het vertegenwoordigen van een bewindspersoon namens de Staat in gerechtelijke procedures waarbij het ministerie
      is betrokken;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.2
  - number: 3.2.n
    text: het vaststellen van beleidsregels en circulaires met betrekking tot de aangelegenheden, bedoeld in dit artikel;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.2
  - number: 3.2.o
    text: |-
      het beslissen op bezwaarschriften tegen de door de directeur-generaal van de Algemene
      Inlichtingen- en Veiligheidsdienst genomen besluiten met betrekking tot aanvragen als bedoeld in
      [hoofdstuk 5 van de Wet op de inlichten- en veiligheidsdiensten 2017][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0039896
        hoofdstuk: '5'
  - number: 3.2.p
    text: |-
      de bevoegdheid om te beslissen op bezwaarschriften tegen namens een bewindspersoon genomen besluiten met
      betrekking tot de uitvoering van de begroting voor Koninkrijksrelaties, met uitzondering van besluiten die door een
      bewindspersoon of de secretaris-generaal zijn genomen;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.2
  - number: 3.2.q
    text: |-
      het wijzigen van [bijlage 1][ref1] van dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0043707
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0043707
  - number: 3.2.r
    text: het behandelen van geschillen met werknemers;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.2
  - number: 3.2.s
    text: het benoemen en ontslaan van departementale vertrouwenspersonen.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.2
  - number: 3.3.1
    text: 'Het mandaat van de secretaris-generaal is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.3
  - number: 3.3.1.a
    text: |-
      beslissingen ten aanzien van de directeur-generaal voor de Algemene Bestuursdienst, voor zover deze samenhangen met
      het werkterrein van het Bureau Algemene Bestuursdienst;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.3
  - number: 3.3.1.b
    text: de bevoegdheden die zijn toegedeeld aan het bestuur en de voorzitter van de huurcommissie;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.3
  - number: 3.3.1.c
    text: |-
      het nemen van besluiten en het afdoen en ondertekenen van stukken met betrekking tot personele beheerbeslissingen
      op grond van het [Mandaatbesluit Colleges financieel toezicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035717
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0035717
  - number: 3.3.2
    text: |-
      Voor het aangaan van (meerjarige) verplichtingen op het terrein van ICT boven de 10 miljoen euro inclusief BTW per
      (meerjarige) verplichting heeft de secretaris-generaal volmacht samen met het betreffende diensthoofd.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.3
  - number: 3.4.1
    text: |-
      De secretaris-generaal is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat aan onder
      hem ressorterende functionarissen respectievelijk tot het beperken of het intrekken daarvan.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.4
  - number: 3.4.2
    text: |-
      De secretaris-generaal kan, voor zover niet anders is bepaald, bij het verlenen van ondermandaat tevens de
      bevoegdheid toekennen tot het verlenen van ondermandaat aan een rechtstreeks onder de gemandateerde ressorterende
      functionaris of in bijzondere gevallen aan een andere functionaris.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.4
  - number: 3.4.3
    text: |-
      De secretaris-generaal is bevoegd om in bijzondere gevallen, naast of in plaats van deze paragraaf, mondeling of
      schriftelijk ondermandaat te verlenen aan een onder hem ressorterende functionaris voor een bepaald geval.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.4
  - number: '3.5'
    text: |-
      De secretaris-generaal verleent ondermandaat bij schriftelijk besluit, met uitzondering van de in
      [artikel 3.4, derde lid][ref1], beschreven situatie, na advies van de directeur Constitutionele Zaken en
      Wetgeving, de directeur Financieel-economische Zaken en de directeur P&O.


      [ref1]: https://wetten.overheid.nl/BWBR0043707#Artikel3
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0043707
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.6.1
    text: |-
      Bij tijdelijke afwezigheid of verhindering van de secretaris-generaal worden diens taken uitgeoefend door het
      diensthoofd, de diensthoofden of de directeur P&O, die bij schriftelijk besluit van de secretaris-generaal in
      overeenstemming met de Minister is of zijn aangewezen als plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.6
  - number: 3.6.2
    text: |-
      Bij gebreke van voornoemd besluit of bij afwezigheid van de aangewezen plaatsvervanger(s) is één van de
      diensthoofden, naar anciënniteit van de benoeming in de functie, met de plaatsvervanging belast.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel3.6
  - number: '4.1'
    text: |-
      Aan het diensthoofd wordt mandaat verleend ten aanzien van aangelegenheden die behoren tot het werkterrein van het
      diensthoofd en de onder het diensthoofd ressorterende functionarissen en dienstonderdelen.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.1
  - number: 4.2.1
    text: 'Onverminderd het bepaalde in dit besluit, heeft het mandaat van het diensthoofd in ieder geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.2
  - number: 4.2.1.a
    text: |-
      het uitoefenen van integraal management met inbegrip van aangelegenheden op organisatorisch, personeel, financieel
      en materieel gebied;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.2
  - number: 4.2.1.b
    text: |-
      het vaststellen van de capaciteitsplannen binnen de door de secretaris-generaal vastgestelde formatie van de onder
      de diensthoofden ressorterende dienstonderdelen;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.2
  - number: 4.2.1.c
    text: het leiding geven aan de rechtstreeks onder het diensthoofd ressorterende functionarissen;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.2
  - number: 4.2.1.d
    text: |-
      het optreden als bestuurder in de zin van de [Wet op de ondernemingsraden][ref1] in het overleg met de
      ondernemingsraad van de onder het diensthoofd ressorterende dienstonderdelen, voor zover niet een onder het
      diensthoofd ressorterende functionaris als zodanig optreedt;


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0002747
  - number: 4.2.1.e
    text: |-
      het vertegenwoordigen van een bewindspersoon namens de Staat in gerechtelijke procedures waarbij het
      dienstonderdeel is betrokken;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.2
  - number: 4.2.1.f
    text: |-
      het vaststellen van beleidsregels en circulaires met betrekking tot aangelegenheden op het werkterrein van het
      diensthoofd;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.2
  - number: 4.2.1.g
    text: |-
      het beheer van de archiefbescheiden van de onder het diensthoofd ressorterende dienstonderdelen op grond van de
      desbetreffende departementale regelgeving;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.2
  - number: 4.2.1.h
    text: |-
      h. het afnemen van de eed of de belofte van ambtenaren die werkzaam zijn bij een onder het diensthoofd ressorterend
      dienstonderdeel;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.2
  - number: 4.2.1.i
    text: |-
      het beslissen op bezwaarschriften gericht tegen besluiten inzake aangelegenheden die behoren tot zijn werkterrein
      met uitzondering van die besluiten die door een bewindspersoon, de secretaris-generaal of het diensthoofd zijn
      genomen, onverminderd [artikel 4.3][ref1] en voor zover in wet- en regelgeving niet anders is bepaald;


      [ref1]: https://wetten.overheid.nl/BWBR0043707#Artikel4
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0043707
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.1.j
    text: het inschakelen van de Landsadvocaat voor ondersteuning of vertegenwoordiging van het ministerie.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.2
  - number: 4.2.1.k
    text: |-
      het behandelen van geschillen met werknemers die werkzaam zijn bij het dienstonderdeel dat onder het diensthoofd
      ressorteert
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.2
  - number: 4.2.2
    text: Het eerste lid, onder a, b, d h en k, is niet van toepassing op de diensthoofden van BZK Kerndepartement.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.2
  - number: 4.3.1
    text: |-
      Het mandaat van de directeur-generaal en van de plaatsvervangend directeur-generaal Algemene
      Inlichtingen- en Veiligheidsdienst omvat tevens de bevoegdheid om te besluiten op aanvragen als bedoeld in
      [hoofdstuk 5 van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0039896
        hoofdstuk: '5'
  - number: 4.3.2
    text: Het eerste lid is niet van toepassing op bezwaarschriften dienaangaande.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.3
  - number: '4.4'
    text: 'Het mandaat van de directeur-generaal Overheidsorganisatie omvat tevens:'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.4
  - number: 4.4.a
    text: |-
      de leiding van het overleg in de Raad voor het Overheidspersoneelsbeleid tussen de werkgevers of verenigingen van
      werkgevers van de overheidssectoren en de aangesloten centrales van overheidspersoneel;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.4
  - number: 4.4.b
    text: de leiding van het Sectoroverleg Rijk, zoals genoemd in paragraaf 27.1 van de CAO Rijk 2020.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.4
  - number: 4.4a
    text: |-
      Het mandaat van de directeur-generaal van het Rijksvastgoedbedrijf omvat tevens het verlenen van volmacht
      aan medewerkers van notariskantoren voor het passeren van notariële akten ten aanzien van aangelegenheden die
      behoren tot het eigen werkterrein en voor zover het gaat om het zakenrechtelijk bevestigen van reeds aangegane
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.4a
  - number: '4.5'
    text: 'Het mandaat van het diensthoofd is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.5
  - number: 4.5.a
    text: |-
      de onderdeeloverstijgende kaders van het beleid en beheer inzake alle aspecten van de bedrijfsvoering van het
      ministerie met inbegrip van aangelegenheden op organisatorisch, personeel, financieel en materieel gebied en
      aangelegenheden met betrekking tot het verrichten van privaatrechtelijke rechtshandelingen;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.5
  - number: 4.5.b
    text: |-
      het nader vaststellen van de inrichting van de onder de diensthoofden ressorterende dienstonderdelen op basis van
      het [Organisatiebesluit BZK 2020][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0043708
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0043708
  - number: 4.5.c
    text: |-
      aangelegenheden die op grond van bovendepartementale regelgeving of afspraken op centraal departementaal niveau
      dienen te worden afgehandeld;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.5
  - number: 4.5.d
    text: het vertegenwoordigen van de Minister in het Decentraal georganiseerd overleg, zoals genoemd in de CAO Rijk 2020;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.5
  - number: 4.5.e
    text: |-
      personele beheerbeslissingen op grond van het [Besluit financiën en personeel Kabinetten van de Gouverneurs][ref1]
      ten aanzien van de directeuren van de Kabinetten van de Gouverneurs van Aruba, Curaçao en Sint Maarten;


      [ref1]: https://wetten.overheid.nl/BWBR0030723
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0030723
  - number: 4.5.f
    text: |-
      het optreden als gemachtigd ambtenaar in de zin van departementale regelgeving met betrekking tot de uitvoering van
      de [Wet openbaarheid van bestuur][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: 4.5.g
    text: het optreden als werkgever als bedoeld in Hoofdstuk 13 en bijlage 12 van de CAO Rijk 2020;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.5
  - number: 4.5.h
    text: |-
      het opzeggen van een arbeidsovereenkomst met een ambtenaar op grond van
      [artikel 12, tweede lid, Ambtenarenwet 2017][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel12
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '12'
  - number: 4.5.i
    text: |-
      het vaststellen en ondertekenen van beleidsregels en circulaires met betrekking tot de aangelegenheden, bedoeld in
      dit artikel;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.5
  - number: 4.5.j
    text: het toekennen van vergoeding van representatiekosten op grond van paragraaf 11.3 CAO Rijk 2020.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.5
  - number: 4.6.1
    text: |-
      Het mandaat van het diensthoofd met betrekking tot het aangaan van financiële verplichtingen en het doen van
      uitgaven is beperkt tot het budget dat aan het diensthoofd ter beschikking is gesteld op basis van een door de
      secretaris-generaal en de directeur Financieel-economische Zaken goedgekeurde budgettaire uitwerking van dat deel
      van de begroting waarvoor het diensthoofd verantwoordelijk is, met een maximumbedrag per (meerjarige) verplichting
      als vermeld in de [bijlage 1][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0043707
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0043707
  - number: 4.6.2
    text: |-
      Het diensthoofd is bevoegd om in afwijking van het eerste lid financiële verplichtingen aan te gaan en uitgaven te
      doen, voor zover aan hem daartoe uitdrukkelijk en schriftelijk mandaat is verleend door een bewindspersoon of de
      secretaris-generaal, met instemming van de directeur Financieel-economische Zaken.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.6
  - number: 4.6.4
    text: Het diensthoofd legt over het door hem gevoerde financiële beheer verantwoording af aan de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.6
  - number: 4.7.1
    text: |-
      Het diensthoofd is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat aan onder
      hem ressorterende functionarissen ten aanzien van aangelegenheden op het werkterrein van deze functionarissen,
      respectievelijk tot het beperken of het intrekken daarvan.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.7
  - number: 4.7.2
    text: |-
      Het diensthoofd dat leiding geeft aan een agentschap is tevens bevoegd tot het verlenen van ondermandaat voor het
      uitoefenen van integraal management met inbegrip van aangelegenheden op organisatorisch, personeel, financieel en
      materieel gebied.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.7
  - number: 4.7.3
    text: |-
      Het diensthoofd kan bij toepassing van de bevoegdheid tot het verlenen van ondermandaat, bedoeld in het eerste lid,
      afwijken van hetgeen in dit besluit is bepaald over het mandaat van de directeur, met uitzondering van het bepaalde
      in [artikel 6.6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043707#Artikel6
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0043707
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 4.7.4
    text: |-
      Het diensthoofd is bevoegd om in bijzondere gevallen, naast of in plaats van het bepaalde in het eerste, tweede en
      derde lid, mondeling of schriftelijk ondermandaat te verlenen aan een onder hem ressorterende functionaris voor een
      bepaald geval.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.7
  - number: 4.7.5
    text: |-
      Het diensthoofd kan, voor zover niet anders is bepaald, bij het verlenen van ondermandaat tevens de bevoegdheid
      toekennen tot het verlenen van ondermandaat aan een rechtstreeks onder de gemandateerde ressorterende functionaris
      of in bijzondere gevallen aan een andere functionaris.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.7
  - number: 4.7.6
    text: |-
      Het verlenen van ondermandaat door het diensthoofd, niet zijnde een diensthoofd dat leiding geeft aan een
      agentschap, voor het aangaan van financiële verplichtingen en het doen van uitgaven is enkel mogelijk aan in
      [bijlage 1][ref1] van dit besluit genoemde onder hem ressorterende functionarissen met inachtneming van het aldaar
      genoemde maximumgrensbedrag per (meerjarige) verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0043707
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0043707
  - number: 4.7.7
    text: |-
      Het diensthoofd kan voor de in [artikel 4.4a][ref1] genoemde bevoegdheid uitsluitend ondermandaat verlenen aan
      directeuren, afdelingshoofden en sectiehoofden van het Rijksvastgoedbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0043707#Artikel4
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0043707
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.7.8
    text: |-
      In aanvulling op het eerste lid kan de directeur-generaal van de Algemene Inlichtingen- en Veiligheidsdienst
      ondermandaat verlenen aan daartoe aangewezen niet-ondergeschikte functionarissen, werkzaam bij het Ministerie van
      Defensie, voor het uitoefenen van daartoe aangewezen personele bevoegdheden met toestemming van de gemandateerde en
      met toestemming van de Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.7
  - number: 4.7.9
    text: |-
      In aanvulling op het eerste lid kan de directeur-generaal van de Algemene Inlichtingen- en Veiligheidsdienst
      ondermandaat verlenen aan daartoe aangewezen niet-ondergeschikte functionarissen, werkzaam bij het Ministerie van
      Defensie, voor het uitoefenen van daartoe aangewezen bevoegdheden betreffende het afgeven van Verklaringen van geen
      bezwaar met toestemming van de gemandateerde en met toestemming van de Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.7
  - number: 4.8.1
    text: |-
      Het diensthoofd verleent ondermandaat bij schriftelijk besluit, met uitzondering van de in
      [artikel 4.7, vierde lid][ref1], beschreven situatie, in overeenstemming met de secretaris-generaal en na advies
      van de directeur Financieel-economische Zaken en de directeur P&O.


      [ref1]: https://wetten.overheid.nl/BWBR0043707#Artikel4
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0043707
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4.8.2
    text: |-
      De voorgeschreven overeenstemming uit het eerste lid is niet van toepassing op het verlenen van financieel
      ondermandaat door het diensthoofd aan de in [bijlage 1][ref1] van dit besluit genoemde onder hem ressorterende
      functionarissen voor zover dit een bedrag van € 30.000 niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0043707
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0043707
  - number: 4.9.1
    text: |-
      Bij tijdelijke afwezigheid of verhindering van het diensthoofd worden diens taken volledig uitgeoefend door het
      plaatsvervangend diensthoofd.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.9
  - number: 4.9.2
    text: |-
      De aanwijzing van een plaatsvervangend diensthoofd geschiedt door het diensthoofd met inachtneming van het
      [Organisatiebesluit BZK 2020][ref1] en in overeenstemming met de secretaris-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0043708
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0043708
  - number: 4.9.3
    text: |-
      Bij gelijktijdige tijdelijke afwezigheid of verhindering van het diensthoofd en het plaatsvervangend diensthoofd
      worden de taken van het diensthoofd bij wijze van plaatsvervanging uitgeoefend door de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel4.9
  - number: '5.1'
    text: |-
      Aan de algemeen directeur wordt mandaat verleend ten aanzien van aangelegenheden die behoren tot het werkterrein
      van de algemeen directeur en de onder de algemeen directeur ressorterende functionarissen.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.1
  - number: 5.2.1
    text: 'Onverminderd het bepaalde in dit besluit, heeft het mandaat van de algemeen directeur in ieder geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.2
  - number: 5.2.1.a
    text: |-
      het uitoefenen van integraal management met inbegrip van aangelegenheden op organisatorisch, personeel, financieel
      en materieel gebied;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.2
  - number: 5.2.1.b
    text: het vaststellen van de capaciteitsplannen binnen de door de secretaris-generaal vastgestelde formatie;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.2
  - number: 5.2.1.c
    text: het leiding geven aan de rechtstreeks onder de algemeen directeur ressorterende functionarissen;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.2
  - number: 5.2.1.d
    text: |-
      het optreden als bestuurder in de zin van de [Wet op de ondernemingsraden][ref1] in het overleg met de
      ondernemingsraad van het desbetreffende dienstonderdeel;


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0002747
  - number: 5.2.1.e
    text: |-
      het vertegenwoordigen van een bewindspersoon namens de Staat in gerechtelijke procedures waarbij het
      dienstonderdeel is betrokken;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.2
  - number: 5.2.1.f
    text: |-
      het vaststellen van beleidsregels en circulaires met betrekking tot aangelegenheden op het werkterrein van de
      algemeen directeur;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.2
  - number: 5.2.1.g
    text: |-
      het beheer van de archiefbescheiden van het onder de algemeen directeur ressorterende dienstonderdeel op grond van
      de desbetreffende departementale regelgeving;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.2
  - number: 5.2.1.h
    text: |-
      het afnemen van de eed of de belofte van ambtenaren bij het dienstonderdeel waarover de algemeen directeur de
      leiding voert;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.2
  - number: 5.2.1.i
    text: |-
      het beslissen op bezwaarschriften gericht tegen besluiten inzake aangelegenheden die behoren tot zijn werkterrein
      met uitzondering van die besluiten die door een bewindspersoon, de secretaris-generaal, het diensthoofd of de
      algemeen directeur zijn genomen, voor zover in wet- en regelgeving niet anders is bepaald;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.2
  - number: 5.2.1.j
    text: |-
      het behandelen van geschillen met werknemers die werkzaam zijn bij het onderdeel dat onder de algemeen directeur
      ressorteert.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.2
  - number: 5.2a
    text: |-
      Het mandaat van de algemeen directeur Dienst Nationaal Coördinator Groningen omvat tevens het nemen van
      beslissingen die de versterkingsoperatie bevorderen of die vanwege overwegingen van redelijke en billijke aard
      nodig zijn
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.2a
  - number: 5.3.1
    text: 'Het mandaat van de algemeen directeur is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.3
  - number: 5.3.1.a
    text: |-
      de onderdeeloverstijgende kaders van het beleid en beheer inzake alle aspecten van de bedrijfsvoering van het
      ministerie met inbegrip van aangelegenheden op organisatorisch, personeel, financieel en materieel gebied en
      aangelegenheden met betrekking tot het verrichten van privaatrechtelijke rechtshandelingen;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.3
  - number: 5.3.1.b
    text: |-
      het nader vaststellen van de inrichting van de onder de algemeen directeuren ressorterende dienstonderdelen op
      basis van het [Organisatiebesluit BZK 2020][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0043708
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0043708
  - number: 5.3.1.c
    text: |-
      aangelegenheden die op grond van bovendepartementale regelgeving of afspraken op centraal departementaal niveau
      dienen te worden afgehandeld;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.3
  - number: 5.3.1.d
    text: |-
      het vertegenwoordigen van de Minister in het Decentraal georganiseerd overleg zoals genoemd in paragraaf 27.2 CAO
      Rijk 2020;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.3
  - number: 5.3.1.e
    text: |-
      personele beheerbeslissingen op grond van het [Besluit financiën en personeel Kabinetten van de Gouverneurs][ref1]
      ten aanzien van de directeuren van de Kabinetten van de Gouverneurs van Aruba, Curaçao en Sint Maarten;


      [ref1]: https://wetten.overheid.nl/BWBR0030723
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0030723
  - number: 5.3.1.f
    text: |-
      het optreden als gemachtigd ambtenaar in de zin van departementale regelgeving met betrekking tot de uitvoering van
      de [Wet openbaarheid van bestuur][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: 5.3.1.g
    text: het optreden als werkgever als bedoeld in Hoofdstuk 13 en bijlage 12 CAO Rijk 2020;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.3
  - number: 5.3.1.h
    text: |-
      het opzeggen van een arbeidsovereenkomst met een ambtenaar op grond van
      [artikel 12, tweede lid, Ambtenarenwet 2017][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel12
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '12'
  - number: 5.3.1.i
    text: |-
      het vaststellen en ondertekenen van beleidsregels en circulaires met betrekking tot de aangelegenheden, bedoeld in
      dit artikel;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.3
  - number: 5.3.1.j
    text: het toekennen van vergoeding van representatiekosten op grond van paragraaf 11.3 CAO Rijk 2020.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.3
  - number: 5.4.1
    text: |-
      Het mandaat van de algemeen directeur met betrekking tot het aangaan van financiële verplichtingen en het doen van
      uitgaven is beperkt tot het budget dat aan de algemeen directeur ter beschikking is gesteld op basis van een door
      de secretaris-generaal en de directeur Financieel-economische Zaken goedgekeurde budgettaire uitwerking van dat
      deel van de begroting waarvoor de algemeen directeur verantwoordelijk is, met een maximumbedrag per (meerjarige)
      verplichting als vermeld in de [bijlage 1][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0043707
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0043707
  - number: 5.4.2
    text: |-
      De algemeen directeur is bevoegd om in afwijking van het eerste lid financiële verplichtingen aan te gaan
      en uitgaven te doen, voor zover aan hem daartoe uitdrukkelijk en schriftelijk mandaat is verleend door een
      bewindspersoon of de secretaris-generaal, met instemming van de directeur Financieel-economische Zaken.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.4
  - number: 5.4.3
    text: |-
      De algemeen directeur legt over het door hem gevoerde financiële beheer verantwoording af aan de secretaris-
      generaal.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.4
  - number: 5.4.4
    text: |-
      De algemeen directeur van een agentschap is verantwoordelijk voor een kostendekkende exploitatie binnen de
      afspraken die hij met opdrachtgevers en de eigenaar heeft gemaakt. Voor het aangaan van financiële verplichtingen
      en het doen van uitgaven geldt voor de algemeen directeur een maximum bedrag per (meerjarige) verplichting als
      vermeld in [bijlage 1][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0043707
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0043707
  - number: 5.5.1
    text: |-
      De algemeen directeur is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat aan onder
      hem ressorterende functionarissen ten aanzien van aangelegenheden op het werkterrein van deze functionarissen,
      respectievelijk tot het beperken of het intrekken daarvan.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.5
  - number: 5.5.2
    text: |-
      De algemeen directeur is tevens bevoegd tot het verlenen van ondermandaat voor het uitoefenen van integraal
      management met inbegrip van aangelegenheden op organisatorisch, personeel, financieel en materieel gebied.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.5
  - number: 5.5.3
    text: |-
      De algemeen directeur kan, voor zover niet anders is bepaald, bij het verlenen van ondermandaat tevens de
      bevoegdheid toekennen tot het verlenen van ondermandaat aan een rechtstreeks onder de gemandateerde ressorterende
      functionaris ten aanzien van aangelegenheden op het werkterrein van de functionaris.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.5
  - number: 5.5.4
    text: |-
      De algemeen directeur is bevoegd om in bijzondere gevallen, naast het bepaalde in het eerste, tweede en derde lid,
      mondeling of schriftelijk ondermandaat te verlenen aan een onder hem ressorterende functionaris voor een bepaald
      geval.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.5
  - number: 5.5.5
    text: |-
      Het verlenen van ondermandaat door de algemeen directeur voor het aangaan van financiële verplichtingen en het
      doen van uitgaven is enkel mogelijk aan in [bijlage 1][ref1] van dit besluit genoemde onder hem ressorterende
      functionarissen met inachtneming van het aldaar genoemde maximumgrensbedrag per (meerjarige) verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0043707
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0043707
  - number: 5.6.1
    text: |-
      De algemeen directeur verleent ondermandaat bij schriftelijk besluit, met uitzondering van de in
      [artikel 5.5, vierde lid][ref1], beschreven situatie, in overeenstemming met de secretaris-generaal en met
      kennisgeving aan de directeur P&O en de directeur Financieel-economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0043707#Artikel5
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0043707
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 5.6.2
    text: |-
      De door de algemeen directeur gemandateerde, bedoeld in [artikel 5.6, eerste lid][ref1], verleent ondermandaat bij
      schriftelijk besluit, in overeenstemming met de algemeen directeur en met kennisgeving aan de directeur P&O en aan
      de directeur Financieel-economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0043707#Artikel5
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0043707
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 5.6.3
    text: |-
      De voorgeschreven overeenstemming uit het eerste lid is niet van toepassing op het verlenen van financieel
      ondermandaat door de algemeen directeur aan de in [bijlage 1][ref1] van dit besluit genoemde onder hem
      ressorterende functionarissen voor zover dit een bedrag van € 30.000 niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0043707
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0043707
  - number: 5.7.1
    text: |-
      Bij tijdelijke afwezigheid of verhindering van de algemeen directeur worden diens taken volledig uitgeoefend door
      de plaatsvervangend algemeen directeur.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.7
  - number: 5.7.2
    text: |-
      De aanwijzing van een plaatsvervangend algemeen directeur geschiedt door de algemeen directeur met inachtneming van
      het [Organisatiebesluit BZK 2020][ref1] en in overeenstemming met de secretaris-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0043708
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0043708
  - number: 5.7.3
    text: |-
      Bij gelijktijdige tijdelijke afwezigheid of verhindering van de algemeen directeur en de plaatsvervangend algemeen
      directeur worden de taken van de algemeen directeur bij wijze van plaatsvervanging uitgeoefend door de secretaris-
      generaal.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.7
  - number: 5.7.4
    text: |-
      In afwijking van het vorige lid kan de plaatsvervanging van de algemeen directeur die leiding geeft aan
      een agentschap volledig worden uitgeoefend door de functionaris die daartoe door de algemeen directeur in
      overeenstemming met de leidinggevende van de algemeen directeur is aangewezen.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel5.7
  - number: '6.1'
    text: |-
      Aan de directeur wordt mandaat verleend ten aanzien van aangelegenheden die behoren tot het werkterrein van de
      directeur en de onder de directeur ressorterende functionarissen en dienstonderdelen.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.1
  - number: 6.2.1
    text: 'Onverminderd het bepaalde in dit besluit, heeft het mandaat van de directeur in ieder geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.2
  - number: 6.2.1.a
    text: |-
      het uitoefenen van integraal management met inbegrip van aangelegenheden op organisatorisch, personeel, financieel
      en materieel gebied;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.2
  - number: 6.2.1.b
    text: het leiding geven aan de rechtstreeks onder de directeur ressorterende functionarissen;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.2
  - number: 6.2.1.c
    text: |-
      het optreden als bestuurder in de zin van de [Wet op de ondernemingsraden][ref1] in het overleg met de
      ondernemingsraad van het desbetreffende dienstonderdeel, voor zover het diensthoofd niet als zodanig optreedt;


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0002747
  - number: 6.2.1.d
    text: |-
      het vertegenwoordigen van een bewindspersoon namens de Staat in gerechtelijke procedures waarbij het
      organisatieonderdeel is betrokken;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.2
  - number: 6.2.1.e
    text: |-
      het afnemen van de eed of de belofte van ambtenaren bij het dienstonderdeel waarover de directeur de leiding voert
      voor zover het een agentschap, een clusterdirectie of de directie CZW betreft;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.2
  - number: 6.2.1.f
    text: |-
      het beslissen op bezwaarschriften gericht tegen besluiten inzake aangelegenheden die behoren tot zijn werkterrein
      met uitzondering van die besluiten die door een bewindspersoon, de secretaris-generaal, het diensthoofd, de
      algemeen directeur of de directeur zijn genomen, voor zover in wet- en regelgeving niet anders is bepaald;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.2
  - number: 6.2.1.g
    text: |-
      het behandelen van geschillen met werknemers die werkzaam zijn bij het onderdeel dat onder de directeur
      ressorteert.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.2
  - number: 6.2.2
    text: Het eerste lid, onder a, c, e, en g zijn niet van toepassing op de directeuren van BZK Kerndepartement.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.2
  - number: '6.3'
    text: 'Het mandaat van de directeur Financieel-economische Zaken omvat tevens:'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.3
  - number: 6.3.a
    text: |-
      de uitvoering van [artikel 4.1 van de Comptabiliteitswet 2016][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
  - number: 6.3.b
    text: |-
      het geven van instructies aan de onderdelen die verantwoordelijk zijn voor de financiële bedrijfsvoering en
      control;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.3
  - number: 6.3.c
    text: |-
      het inhoudelijk aansturen van onderdelen die zijn betrokken bij het bewaken van en adviseren over de uitvoering van
      de bedrijfsvoering in brede zin.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.3
  - number: '6.4'
    text: 'Het mandaat van de directeur P&O omvat tevens:'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.4
  - number: 6.4.a
    text: |-
      het verder in behandeling nemen van geschillen met werknemers indien een uitspraak van de geschillencommissie,
      genoemd in paragraaf 16.2 CAO Rijk 2020 in een geschil niet wordt opgevolgd door de werkgever;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.4
  - number: 6.4.b
    text: |-
      het vertegenwoordigen van een bewindspersoon namens de Staat in gerechtelijke procedures met betrekking tot een
      personele aangelegenheid;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.4
  - number: 6.4.c
    text: |-
      het inschakelen van de Landsadvocaat voor ondersteuning of vertegenwoordiging van het ministerie inzake
      rechtspositionele vraagstukken;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.4
  - number: 6.4.d
    text: het ondertekenen van stukken met betrekking tot het voeren van de salarisadministratie bij de directie;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.4
  - number: 6.4.e
    text: |-
      het aangaan van directieoverstijgende departementale (raam)overeenkomsten behorend tot de vakgebieden Personeel &
      Organisatie en Communicatie voor zover hier niet in wordt voorzien vanuit categoriemanagement;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.4
  - number: 6.4.f
    text: de vergoeding van representatiekosten op grond van paragraaf 11.3 CAO Rijk 2020;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.4
  - number: 6.4.g
    text: |-
      het geven van vakinhoudelijke instructies aan de Personeel & Organisatieafdelingen van alle dienstonderdelen en tot
      het geven van advies aan managers op het gebied van Personeel & Organisatiezaken van het ministerie;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.4
  - number: 6.4.h
    text: het op verzoek van de werkgever aanwijzen van bedrijfshulpverleners;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.4
  - number: 6.4.i
    text: het op verzoek van de werkgever sluiten van stageovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.4
  - number: 6.5.1
    text: 'Het mandaat van de directeur is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.5
  - number: 6.5.1.a
    text: |-
      personele aangelegenheden ten aanzien van rechtstreeks onder de secretaris-generaal, het diensthoofd of de algemeen
      directeur ressorterende functionarissen;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.5
  - number: 6.5.1.b
    text: het namens de Staat aangaan, wijzigen en beëindigen van een arbeidsovereenkomst met een ambtenaar;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.5
  - number: 6.5.1.c
    text: het verlenen van een jubileumuitkering;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.5
  - number: 6.5.1.d
    text: het opleggen van een straf;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.5
  - number: 6.5.1.e
    text: het schorsen van een ambtenaar in zijn ambt;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.5
  - number: 6.5.1.f
    text: het aanwijzen van een ambtenaar als VWNW-kandidaat;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.5
  - number: 6.5.1.g
    text: |-
      het vaststellen van beleidsregels en circulaires ten aanzien van aangelegenheden op het werkterrein van het
      diensthoofd, tenzij deze bevoegdheid in hogere regelgeving aan de desbetreffende functionaris is toegekend;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.5
  - number: 6.5.1.h
    text: het beslissen tot een reorganisatie;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.5
  - number: 6.5.1.i
    text: het toekennen van materiële schadevergoeding vanaf € 2.500,– of immateriële schadevergoeding;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.5
  - number: 6.5.1.j
    text: |-
      het vaststellen van de formatie van de onder de diensthoofden en algemeen directeuren ressorterende
      (dienst)onderdelen;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.5
  - number: 6.5.1.k
    text: |-
      de onderwerpen genoemd in [artikel 4.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043707#Artikel4
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0043707
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 6.5.2
    text: |-
      De beperkingen genoemd in het eerste lid, onderdeel b tot en met f, zijn niet van toepassing op het mandaat van de
      directeur die leiding geeft aan een agentschap.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.5
  - number: 6.6.1
    text: |-
      Het mandaat van de directeur met betrekking tot het aangaan van financiële verplichtingen en het doen van uitgaven
      is beperkt tot het budget dat aan de directeur ter beschikking is gesteld op basis van een door het diensthoofd
      en de DG-controller goedgekeurde budgettaire uitwerking van dat deel van de begroting waarvoor de directeur
      verantwoordelijk is met een maximum bedrag per (meerjarige) verplichting als vermeld in [bijlage 1][ref1] van dit
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0043707
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0043707
  - number: 6.6.2
    text: |-
      De directeur is bevoegd om in afwijking van het eerste lid financiële verplichtingen aan te gaan en uitgaven te
      doen, voor zover aan hem daartoe uitdrukkelijk en schriftelijk mandaat is verleend door een bewindspersoon, de
      secretaris-generaal of het diensthoofd, met instemming van de DG-Controller en binnen het vastgestelde budget dat
      aan het diensthoofd ter beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.6
  - number: 6.6.3
    text: De directeur legt over het door hem gevoerde financiële beheer verantwoording af aan zijn leidinggevende.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.6
  - number: 6.6.4
    text: |-
      In afwijking van het derde lid legt de directeur binnen het Cluster M&M respectievelijk binnen het cluster BO over
      het door hem gevoerde financiële beheer verantwoording af aan de clusterdirecteur M&M respectievelijk BO.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.6
  - number: 6.6.5
    text: |-
      De directeur van een agentschap is verantwoordelijk voor een kostendekkende exploitatie binnen de afspraken die
      hij met opdrachtgevers en de eigenaar heeft gemaakt. Voor het aangaan van financiële verplichtingen en het doen van
      uitgaven geldt voor de directeur een maximum bedrag per (meerjarige) verplichting als vermeld in [bijlage 1][ref1]
      van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0043707
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0043707
  - number: 6.7.1
    text: |-
      De directeur is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat aan onder hem
      ressorterende functionarissen ten aanzien van aangelegenheden op het werkterrein van deze functionarissen,
      respectievelijk tot het beperken of het intrekken daarvan.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.7
  - number: 6.7.2
    text: |-
      De directeur die leiding geeft aan een agentschap is tevens bevoegd tot het verlenen van ondermandaat voor het
      uitoefenen van integraal management met inbegrip van aangelegenheden op organisatorisch, personeel, financieel en
      materieel gebied.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.7
  - number: 6.7.3
    text: |-
      De directeur kan, voor zover niet anders is bepaald, bij het verlenen van ondermandaat tevens de bevoegdheid
      toekennen tot het verlenen van ondermandaat aan een rechtstreeks onder de gemandateerde ressorterende functionaris
      ten aanzien van aangelegenheden op het werkterrein van de functionaris.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.7
  - number: 6.7.4
    text: |-
      De directeur is bevoegd om in bijzondere gevallen, naast het bepaalde in het eerste, tweede en derde lid, mondeling
      of schriftelijk ondermandaat te verlenen aan een onder hem ressorterende functionaris voor een bepaald geval.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.7
  - number: 6.7.5
    text: |-
      Het verlenen van ondermandaat door de directeur, niet zijnde een directeur die leiding geeft aan een agentschap,
      voor het aangaan van financiële verplichtingen en het doen van uitgaven is enkel mogelijk aan in [bijlage 1][ref1]
      van dit besluit genoemde onder hem ressorterende functionarissen met inachtneming van het aldaar genoemde
      maximumgrensbedrag per (meerjarige) verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0043707
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0043707
  - number: 6.8.1
    text: |-
      De directeur verleent ondermandaat bij schriftelijk besluit, met uitzondering van de in
      [artikel 6.7, vierde lid][ref1], beschreven situatie, in overeenstemming met het diensthoofd en met kennisgeving
      aan de directeur P&O en de directeur Financieel-economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0043707#Artikel6
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0043707
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 6.8.2
    text: |-
      De door de directeur gemandateerde, bedoeld in [artikel 6.9, eerste lid][ref1], verleent ondermandaat bij
      schriftelijk besluit, in overeenstemming met de directeur en met kennisgeving aan de directeur P&O en aan de
      directeur Financieel-economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0043707#Artikel6
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0043707
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 6.8.3
    text: |-
      De voorgeschreven overeenstemming uit het eerste lid is niet van toepassing op het verlenen van financieel
      ondermandaat door de directeur aan de in [bijlage 1][ref1] van dit besluit genoemde onder hem ressorterende
      functionarissen voor zover dit een bedrag van € 30.000 niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0043707
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0043707
  - number: '6.9'
    text: |-
      De rechtstreeks onder de directeur ressorterende leidinggevenden zijn, voor zover door de directeur met
      toepassing van [artikel 6.8, eerste lid][ref1], niet anders is bepaald, ten aanzien van de onder hen ressorterende
      functionarissen bevoegd tot:


      [ref1]: https://wetten.overheid.nl/BWBR0043707#Artikel6
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0043707
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 6.9.a
    text: het vaststellen van het wekelijkse werkrooster;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.9
  - number: 6.9.b
    text: het verlenen van vakantieverlof;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.9
  - number: 6.9.c
    text: het verlenen van kortdurend bijzonder verlof;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.9
  - number: 6.9.d
    text: het accorderen van binnenlandse dienstreizen en daarbij gebruikte vervoermiddel;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.9
  - number: 6.9.e
    text: |-
      het voeren respectievelijk de verslaglegging van het personeelsgesprek, zoals genoemd in paragraaf.12.1 CAO Rijk
      2020.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.9
  - number: 6.10.1
    text: |-
      Bij tijdelijke afwezigheid of verhindering van de directeur worden diens taken volledig uitgeoefend door de
      plaatsvervangend directeur.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.10
  - number: 6.10.2
    text: |-
      De aanwijzing van een plaatsvervangend directeur geschiedt door de directeur met inachtneming van het
      [Organisatiebesluit BZK 2020][ref1] en in overeenstemming met de leidinggevende van de directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0043708
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0043708
  - number: 6.10.3
    text: |-
      Bij gelijktijdige tijdelijke afwezigheid of verhindering van de directeur en de plaatsvervangend directeur worden
      de taken van de directeur bij wijze van plaatsvervanging uitgeoefend door de leidinggevende van de directeur.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.10
  - number: 6.10.4
    text: |-
      In afwijking van het vorige lid kan de plaatsvervanging van de directeur die leiding geeft aan een agentschap
      volledig worden uitgeoefend door de functionaris die daartoe door de directeur in overeenstemming met de
      leidinggevende van de directeur is aangewezen.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel6.10
  - number: '7.1'
    text: 'Het mandaat van de directeur Ambtenaar en Organisatie omvat tevens:'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel7.1
  - number: 7.1.a
    text: het centraal opdrachtgeverschap aan P-Direkt voor de uitvoering van de standaard dienstverlening;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel7.1
  - number: 7.1.b
    text: het beheer van het budget dat in het kader van de centrale bekostiging is overgedragen.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel7.1
  - number: '7.2'
    text: 'Het mandaat van de directeur Inkoop-, Facilitair- en Huisvestingbeleid Rijk omvat tevens:'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel7.2
  - number: 7.2.a
    text: het centraal opdrachtgeverschap aan FM Haaglanden voor de uitvoering van de standaard dienstverlening;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel7.2
  - number: 7.2.b
    text: het beheer van het budget dat in het kader van de centrale bekostiging is overgedragen.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel7.2
  - number: 7.3.1
    text: Het mandaat van de directeur P&O omvat tevens de uitvoering van de rijksbrede inkoopcategorie Vervoer.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel7.3
  - number: 7.3.2
    text: |-
      Het mandaat van de directeur-generaal Rijksvastgoedbedrijf omvat tevens de uitvoering van de rijksbrede
      inkoopcategorie Energie.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel7.3
  - number: 7.3.3
    text: Het mandaat van de CIO BZK omvat tevens de uitvoering van de rijksbrede inkoopcategorie ICT-werkomgeving Rijk.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel7.3
  - number: 7.3.4
    text: |-
      De directeur P&O kan de CIO BZK en de directeur-generaal Rijksvastgoedbedrijf instructies geven over de uitoefening
      van het mandaat, bedoeld in het tweede onderscheidenlijk derde lid, en inlichtingen vragen over de uitoefening
      dienaangaande.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel7.3
  - number: 7.4.1
    text: |-
      De maximumbedragen voor het aangaan van financiële verplichtingen en het doen van uitgaven, als vermeld in
      [bijlage 1][ref1] van dit besluit, zijn niet van toepassing op de in dit hoofdstuk verleende mandaten.


      [ref1]: https://wetten.overheid.nl/BWBR0043707
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0043707
  - number: 7.4.2
    text: |-
      Voor het aangaan van (meerjarige) verplichtingen boven de 25 miljoen euro inclusief BTW voor de rijksbrede
      inkoopcategorie Vervoer heeft de directeur P&O mandaat samen met de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel7.4
  - number: 7.4.3
    text: |-
      Voor het aangaan van (meerjarige) verplichtingen boven de 25 miljoen euro inclusief BTW voor de rijksbrede
      inkoopcategorie Energie heeft de directeur Rijksvastgoedbedrijf mandaat samen met de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel7.4
  - number: 7.4.4
    text: |-
      Voor het aangaan van (meerjarige) verplichtingen boven de 10 miljoen euro inclusief BTW voor de rijksbrede
      inkoopcategorie ICT-werkomgeving Rijk heeft de CIO BZK mandaat samen met de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel7.4
  - number: '8.1'
    text: 'De uitoefening van een mandaat geschiedt met inachtneming van:'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel8.1
  - number: 8.1.a
    text: algemene en bijzondere aanwijzingen van de mandaatgever ten aanzien van de uitoefening van het mandaat;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel8.1
  - number: 8.1.b
    text: departementale richtlijnen met betrekking tot paraaf en medeparaaf en het voorleggen en afdoen van stukken;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel8.1
  - number: 8.1.c
    text: |-
      de van toepassing zijnde wet- en regelgeving en overige departementale richtlijnen, in het bijzonder
      de [Comptabiliteitswet 2016][ref1], de [Wet op de ondernemingsraden][ref2], het departementale kader
      voor externe inhuur, het [Organisatiebesluit BZK 2020][ref3] en (de richtlijnen inzake) administratieve
      organisatiebeschrijvingen.


      [ref1]: https://wetten.overheid.nl/BWBR0039429
      [ref2]: https://wetten.overheid.nl/BWBR0002747
      [ref3]: https://wetten.overheid.nl/BWBR0043708
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0039429
      - id: ref2
        bwb_id: BWBR0002747
      - id: ref3
        bwb_id: BWBR0043708
  - number: 8.2.1
    text: |-
      De uitoefening van een mandaat geschiedt binnen de door de secretaris-generaal vastgestelde kaders met betrekking
      tot het beleid en beheer inzake de bedrijfsvoering van het ministerie.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel8.2
  - number: 8.2.2
    text: De uitoefening van een mandaat geschiedt met inachtneming van de departementale procedures en richtlijnen.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel8.2
  - number: 8.2.3
    text: |-
      Afwijking van het eerste lid ten aanzien van een onder het diensthoofd ressorterend dienstonderdeel is slechts
      mogelijk in overeenstemming met de secretaris-generaal, de directeur Financieel-economische Zaken en de directeur
      van het SG-Cluster die het aangaat en wordt schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel8.2
  - number: 8.3.1
    text: |-
      De gemandateerde is verantwoordelijk voor het bijhouden van een of meer doelmatig ingerichte administraties die
      inzicht bieden in het door en namens de gemandateerde gevoerde financiële beheer en beheer van niet-geldelijke
      zaken op grond van diens mandaat.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel8.3
  - number: 8.3.2
    text: |-
      De directeur Financieel-economische Zaken is bevoegd om de administraties, bedoeld in het eerste lid, te
      onderzoeken ten behoeve van de uitvoering van taken behorende tot hun werkterrein.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel8.3
  - number: 8.4.1
    text: |-
      Ondertekening van besluiten en stukken op grond van mandaat vindt plaats op de volgende wijze: De Minister van
      Binnenlandse Zaken en Koninkrijksrelaties, namens deze, (handtekening) (naam) (aanduiding functie gemandateerde)
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel8.4
  - number: 8.4.2
    text: |-
      in afwijking van het eerste lid wordt een besluit van de Staatssecretaris als volgt ondertekend: De
      Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties, namens deze, (handtekening) (naam) (aanduiding
      functie gemandateerde)
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel8.4
  - number: 8.4.3
    text: |-
      Bij ondertekening van besluiten en stukken op grond van volmacht wordt de aanduiding van de Minister dan wel de
      Staatssecretaris voorafgegaan door: Namens de Staat der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel8.4
  - number: 8.4.4
    text: 'Bij ondertekening van besluiten en stukken door een plaatsvervanger wordt de handtekening voorafgegaan door: b/a.'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel8.4
  - number: '8.5'
    text: |-
      In gevallen waarin dit besluit niet voorziet, beslist de bewindspersoon, de secretaris-generaal of het diensthoofd
      over de doorverlening van zijn mandaat.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel8.5
  - number: 9.1.1
    text: De directeur P&O is belast met het beheer van dit besluit.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel9.1
  - number: 9.1.2
    text: |-
      De secretaris-generaal, de diensthoofden en de (algemeen) directeuren, ieder voor zover het hen aangaat, zijn
      verantwoordelijk voor een juiste, volledige en tijdige aanlevering aan de directeur P&O van de gegevens die een
      goed beheer van dit besluit onderscheidenlijk het mandaatregister mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel9.1
  - number: 9.1.3
    text: |-
      Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel9.1
  - number: 9.1.4
    text: |-
      De directeur P&O rapporteert aan de bewindspersonen en de secretaris-generaal over het beheer van dit besluit en
      het centrale mandaatregister.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel9.1
  - number: 9.2.1
    text: De directeur P&O draagt zorg voor de inrichting en het beheer van een centraal mandaatregister.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel9.2
  - number: 9.2.2
    text: 'Het register biedt inzicht in:'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel9.2
  - number: 9.2.2.a
    text: |-
      de functies en namen van functionarissen aan wie door of namens een bewindspersoon (onder)mandaat is
      (door)verleend, met aanduiding van de verleende bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel9.2
  - number: 9.2.2.b
    text: |-
      de functies en namen van functionarissen die een bewindspersoon vertegenwoordigen in een (bestuurs)orgaan van een
      rechtspersoon anders dan de Staat, met aanduiding van het (bestuurs)orgaan en de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel9.2
  - number: 9.2.3
    text: Het register is openbaar.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel9.2
  - number: 9.2.4
    text: |-
      De directeur P&O draagt zorg voor de gegevensverstrekking uit het register. Bij de uitvoering van deze
      werkzaamheden pleegt hij zo nodig overleg met de directeur Constitutionele Zaken en Wetgeving.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel9.2
  - number: 9.3.1
    text: |-
      In afwijking van [artikel 9.2, tweede lid][ref1], worden gegevens met betrekking tot de verlening van ondermandaat
      aan functionarissen in de rang van directeur en daaronder ressorterende functionarissen bij de Algemene
      Inlichtingen- en Veiligheidsdienst opgenomen in een door de directeur-generaal van de Algemene Inlichtingen- en
      Veiligheidsdienst bijgehouden mandaatregister.


      [ref1]: https://wetten.overheid.nl/BWBR0043707#Artikel9
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0043707
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.3.2
    text: |-
      De directeur-generaal van de Algemene Inlichtingen- en Veiligheidsdienst kan in overeenstemming met de secretaris-
      generaal nadere regels stellen ten aanzien van het register, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel9.3
  - number: '9.4'
    text: |-
      Wijziging van dit besluit geschiedt op initiatief van de directeur P&O na advies van de directeur Financieel-
      economische Zaken en de directeur Constitutionele Zaken en Wetgeving.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel9.4
  - number: 10.1.1
    text: |-
      Besluiten of handelingen die op grond van het [Mandaatbesluit BZK 2018][ref1] zijn genomen of verricht in
      de periode tot de datum van inwerkingtreding van dit besluit en waarin op het tijdstip van inwerkingtreding
      van dit besluit niet is voorzien, worden aangemerkt als te zijn genomen of verricht namens de Minister of de
      Staatssecretaris.


      [ref1]: https://wetten.overheid.nl/BWBR0041316
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0041316
  - number: 10.1.2
    text: |-
      Vóór het tijdstip van inwerkingtreding van dit besluit van kracht zijnde mandaten, ondermandaten, volmachten en
      machtigingen, waarin op het tijdstip van inwerkingtreding van dit besluit niet is voorzien, blijven van kracht
      totdat op grond van dit besluit is voorzien in mandaat, ondermandaat, volmacht of machtiging dan wel is voorzien in
      intrekking daarvan.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel10.1
  - number: 10.2.1
    text: |-
      Het [Mandaatbesluit BZK 2018][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0041316
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0041316
  - number: '10.3'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het wordt
      geplaatst en werkt terug tot en met 1 januari 2020.
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel10.3
  - number: '10.4'
    text: 'Dit besluit wordt aangehaald als: Mandaatbesluit BZK 2020.'
    url: https://wetten.overheid.nl/BWBR0043707/2022-01-10#Artikel10.4
