  - number: '3'
    text: |-
      1 De erkenning van diervoederleveranciers wordt verleend door het productschap.

      2 In een door het productschap vastgestelde verordening worden in ieder geval regels gesteld omtrent:

      a. de verlening van de erkenning;

      b. de voorwaarden voor erkenning;

      c. de schorsing en de intrekking van de erkenning.

      3 Als voorwaarde voor erkenning geldt in ieder geval dat:

      a. met betrekking tot elk bedrijf waarvoor een heffingplichtige een mededeling als bedoeld in
      [artikel 2, eerste lid, onderdeel b][ref1], heeft gedaan en met betrekking tot elk ander bedrijf van die
      heffingplichtige, een voerjaaroverzicht wordt opgesteld dat volledig en naar waarheid is opgemaakt en dat voor 1
      april van het jaar volgend op het desbetreffende jaar aan de Dienst Regelingen wordt toegezonden;

      b. met betrekking tot elk bedrijf waarvoor een heffingplichtige een mededeling als bedoeld in
      [artikel 2, eerste lid, onderdeel b][ref2], heeft gedaan en met betrekking tot elk ander bedrijf van die
      heffingplichtige, een voerleverantieoverzicht wordt opgesteld dat volledig en naar waarheid is opgemaakt en dat
      uiterlijk dertig dagen na afloop van het desbetreffende kalenderjaar aan de heffingplichtige wordt toegezonden.

      4 Bij de invulling van de voerjaaroverzichten en de voerleverantieoverzich-ten wordt het volgende in acht genomen:

      a. voor mengvoer wordt een onderverdeling gemaakt naar de diersoorten waarvoor het mengvoer is afgenomen;

      b. voor ruwvoer en enkelvoudig diervoer wordt het vochtgehalte op de voerleverantieoverzichten slechts ingevuld
      indien dit gehalte minstens 14 procent bedraagt;

      c. de factuurnummers op de voerleverantieoverzichten worden in volgorde van leveringsdatum, voor mengvoer per
      diersoort, ingevuld.

      5 Het in artikel 3, derde lid, onderdeel a, bedoelde overzicht kan elektronisch bij de Dienst Regelingen worden
      ingediend met gebruikmaking van het door de Dienst Regelingen daartoe verstrekte software-programma.


      [ref1]: https://wetten.overheid.nl/BWBR0009091#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009091#Artikel2
