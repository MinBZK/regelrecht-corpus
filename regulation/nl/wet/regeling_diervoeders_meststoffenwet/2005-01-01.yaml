      - id: ref2
        bwb_id: BWBR0004054
      - id: ref3
        bwb_id: BWBR0004054
  - number: '5'
    text: |-
      1 De erkende diervoederleverancier baseert het gehalte aan stikstof en fosfaat in de diervoeders op de:

      a. resultaten van uitgevoerde bemonstering en analyse van de diervoeders,

      b. wat betreft ruwvoer en enkelvoudig diervoer: berekeningen uitgaande van bekende gehalten van de nutriënten in de
      diervoeders, rekening houdend met het functioneren van het productieproces,

      c. wat betreft mengvoer: berekeningen uitgaande van bekende gehalten van de nutriënten in de grondstoffen waaruit
      de diervoeders zijn bereid, rekening houdend met het functioneren van het productieproces, of

      d. gegevens van de producent van de diervoeders indien deze ook een erkende diervoederleverancier is.

      2 De erkende diervoederleverancier legt in een procedure vast op welke wijze de gehaltes aan stikstof en fosfaat
      zijn vastgesteld.

      3 De door de erkende diervoederleverancier gedeclareerde gehaltes aan stikstof en fosfaat dienen bij een
      analytische controle overeen te komen, binnen de door het productschap bij verordening geformuleerde marges, met de
      bij die analytische controle geconstateerde gehaltes.
    url: https://wetten.overheid.nl/BWBR0009091/2005-01-01#Artikel5
  - number: '6'
    text: |-
      1 De erkende leverancier houdt ten aanzien van elk bedrijf waarvoor de heffinglichtige een mededeling als bedoeld
      in [artikel 2, eerste lid, onderdeel b][ref1], of als bedoeld in [artikel 2, derde lid][ref2], heeft gedaan, een
      admini-stratie bij met betrekking tot de afgeleverde hoeveelheden diervoeders.

      2 De erkende leverancier houdt ten aanzien van elke teler die jegens de erkende leverancier heeft kenbaar gemaakt
      dat ten aanzien van zijn bedrijf verfijnde mineralenheffingen worden geheven, een administratie bij met betrekking
      tot de afgenomen hoeveelheden van in tabel I van [bijlage D bij de wet][ref3] opgenomen ruwvoer.

      3 De erkende leverancier houdt in de gevallen genoemd in het eerste en het tweede lid, een administratie bij met
      betrekking tot de gedeclareerde gehalten aan fosfaat en stikstof van de diervoeders.

      4 De erkende leverancier bewaart de in het eerste, tweede en derde lid, genoemde administratie gedurende zeven
      jaren.


