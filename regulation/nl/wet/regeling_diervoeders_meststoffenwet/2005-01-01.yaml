  - number: '2'
    text: |-
      1 Ten aanzien van een bedrijf worden slechts verfijnde mineralenheffingen geheven indien de heffingplichtige:

      a. de diervoeders ten behoeve van het bedrijf afneemt van een of meer erkende diervoederleveranciers die de op het
      bedrijf betrekking hebbende voerjaaroverzichten rechtstreeks aan de Dienst Regelingen doen toekomen;

      b. de erkende diervoederleverancier mededeelt dat hij het bedrijf heeft aangemeld met het oog op de heffing van de
      verfijnde mineralenheffingen;

      c. aan de erkende diervoederleverancier per afzonderlijke levering van diervoeders aangeeft ten behoeve van welk
      bedrijf de diervoeders worden afgenomen, onder vermelding van het nummer waaronder dit bedrijf is geregistreerd bij
      de Dienst Regelingen.

      2 Het eerste lid is niet van toepassing op een bedrijf waarvan in het desbetreffende kalenderjaar de veebezetting
      op geen enkel moment groter is dan drie grootvee-eenheden. De omrekening van dieren van de onderscheiden
      diercategorieën naar grootvee-eenheden geschiedt overeenkomstig de daarvoor in [Bijlage A bij de wet][ref1]
      opgenomen normen.

      3 Het eerste lid, onderdeel a, is niet van toepassing op ruwvoer en enkelvoudig krachtvoer, opgenomen in
      [tabel II van bijlage D bij de wet][ref2].

      4 Indien de heffingplichtige één of meer andere bedrijven voert, worden ten aanzien van een bedrijf slechts
      verfijnde mineralenheffingen geheven indien de heffingplichtige aan de erkende leverancier een overzicht geeft van
      alle door hem gevoerde bedrijven ten behoeve waarvan diervoeders worden aangevoerd en voor deze bedrijven voldoet
      aan de in het eerste lid, onderdelen a en c genoemde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0004054
