  text: |-
    Gelet op de artikelen 13h, 13k, vijfde lid, 13ak, 13al, onderdelen d, onder 1°, en f, en 25 van de Meststoffenwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009091/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            wet:

              [Meststoffenwet][ref1];



            b
            verfijnde mineralenheffingen:

              heffingen als bedoeld in [artikel 22 van de wet][ref2];



            c
            productschap:

              Productschap Diervoeder;



            d
            voerleverantieoverzicht:

              overzicht opgesteld overeenkomstig het model van [bijlage I][ref3] van de door de erkende
      diervoederleverancier in een kalenderjaar ten behoeve van een bedrijf geleverde diervoeders;



            e
            voerjaaroverzicht:

              overzicht opgesteld overeenkomstig het model van [bijlage II][ref4] van de door de erkende
      diervoederleverancier in een kalenderjaar ten behoeve van een bedrijf geleverde diervoeders;



            f
            heffingplichtige:

              persoon of rechtspersoon die, of samenwerkingsverband van personen of rechtspersonen dat een bedrijf voert;



            g
            mengvoer:

              mengvoeders als bedoeld in de Verordening PDV diervoeders 2003;



            h
            ruwvoer en enkelvoudig diervoer:

              voedermiddelen als bedoeld in de Verordening PDV diervoeders 2003.


