  - number: '4'
    text: |-
      1 In afwijking van [artikel D5, tweede lid van bijlage D bij de wet][ref1] kan de hoeveelheid fosfaat,
      onderscheidenlijk stikstof worden vastgesteld overeenkomstig de ter zake door de erkende diervoederleverancier
      verstrekte gegevens, indien sprake is van een leverantie:

      a. door een erkende diervoederleverancier van in [tabel II van bijlage D bij de wet][ref2] opgenomen ruwvoer of
      enkelvoudig krachtvoer, of

      b. door een teler aan een erkende diervoederleverancier van in [tabel I van bijlage D bij de wet][ref3] opgenomen
      ruwvoer.

      2 De in het eerste lid bedoelde gegevens van de erkende diervoederleve-rancier worden gebaseerd op het gewicht of
      volume en het fosfaatgehalte, onderscheidenlijk stikstofgehalte van de geleverde diervoeders.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0004054
      [ref3]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009091/2005-01-01#Artikel4
    references:
