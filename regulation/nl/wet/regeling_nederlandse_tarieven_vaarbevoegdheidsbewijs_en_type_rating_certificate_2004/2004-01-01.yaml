preamble:
  text: |-
    Gelet op artikel 62, aanhef en onderdelen c en h, van de Zeevaartbemanningswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016084/2004-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De kosten van de behandeling van een aanvraag voor de afgifte van een vaarbevoegdheidsbewijs bedragen:

      a. € 63 voor elk vaarbevoegdheidsbewijs of een duplicaat van een vaarbevoegdheidsbewijs, waarop ten minste één van
      de volgende functies voorkomt:

      1°. kapitein;

      2°. eerste stuurman;

      3°. wachtstuurman;

      4°. hoofdwerktuigkundige;

      5°. tweede scheepswerktuigkundige;

      6°. wachtwerktuigkundige;

      7°. eerste maritiem officier;

      8°. maritiem officier;

      9°. schipper zeevisvaart;

      10°. plaatsvervangend schipper zeevisvaart;

      11°. stuurman zeevisvaart; of

      12°. werktuigkundige zeevisvaart;

      b. € 42 voor elk vaarbevoegdheidsbewijs of duplicaat van een vaarbevoegdheidsbewijs waarop de onder a genoemde
      functies niet voorkomen.

      c. € 63 voor een vaarbevoegdheidsbewijs van erkenning als bedoeld in
      [artikel 22, tweede lid, van de Zeevaartbemanningswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel22
    url: https://wetten.overheid.nl/BWBR0016084/2004-01-01#Artikel1
