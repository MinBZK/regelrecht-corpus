preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de bepalingen inzake de vrijwillige verzekering
    krachtens de Algemene Ouderdomswet en de Algemene nabestaandenwet meer in overeenstemming te brengen met
    de oorspronkelijke doelstelling van de vrijwillige verzekering, te weten een verzekering van tijdelijke
    aard, en dat het wenselijk is het overgangsrecht met betrekking tot de uitkering op grond van de Wet
    arbeidsongeschiktheidsvoorziening jonggehandicapten in het buitenland te herstellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012436/2001-05-09#ArtikelAanhef
articles:
  - number: VII
    text: |-
      De perioden van maximaal tien jaar, bedoeld in de [artikelen 35, eerste lid, van de Algemene Ouderdomswet][ref1]
      en [63a, eerste lid, van de Algemene nabestaandenwet][ref2], zijn niet van toepassing op degene die voor de datum
      van inwerkingtreding van deze wet reeds vrijwillig verzekerd was voor de [Algemene Ouderdomswet][ref3] of de
      [Algemene nabestaandenwet][ref4] ten aanzien van de op die datum bestaande vrijwillige verzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel35
