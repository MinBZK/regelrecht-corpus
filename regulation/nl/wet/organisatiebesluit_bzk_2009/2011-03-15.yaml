preamble:
  text: |-
    Gelet op artikel 2, eerste lid, van het Coördinatiebesluit organisatie en formatie rijksdienst 2007;

    Mede gelet op de instellings- en wijzigingsbesluiten van het Organisatiebesluit BZK 2008;

    Vast te stellen het navolgende Organisatiebesluit:
  url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel1
  - number: 1.a
    text: '*Ministerie:* Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel1
  - number: 1.b
    text: '*Minister:* Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel1
  - number: 1.c
    text: |-
      *Capaciteitsplan:* schriftelijk stuk waarin de uitwerking van de flexibele organisatiestructuur van het
      directoraat-generaal, respectievelijk van de Dienst Concernstaf en Bedrijfsvoering of de Inspectie Openbare Orde en
      Veiligheid wordt vastgelegd evenals de verdeling van de formatie binnen deze structuur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel1
  - number: 2.1.1
    text: 'De hoofdstructuur van het Ministerie bestaat uit de volgende dienstonderdelen:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.1
  - number: 2.1.1.a
    text: de Algemene Leiding (ALGL);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.1
  - number: 2.1.1.b
    text: de dienst Concernstaf en Bedrijfsvoering (DCB);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.1
  - number: 2.1.1.c
    text: het directoraat-generaal Organisatie en Bedrijfsvoering Rijk (DGOBR);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.1
  - number: 2.1.1.d
    text: het directoraat-generaal Bestuur en Koninkrijksrelaties (DGBK);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.1
  - number: 2.1.1.e
    text: het directoraat-generaal Veiligheid (DGV);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.1
  - number: 2.1.1.f
    text: de Algemene Inlichtingen- en Veiligheidsdienst (AIVD);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.1
  - number: 2.1.1.g
    text: het Bureau Algemene Bestuursdienst (BABD);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.1
  - number: 2.1.1.h
    text: de Inspectie Openbare Orde en Veiligheid (IOOV).
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.1
  - number: 2.1.2
    text: De Algemene Leiding ressorteert onder de Minister.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.1
  - number: 2.1.3
    text: De overige in het eerste lid genoemde dienstonderdelen ressorteren onder de Algemene Leiding van het Ministerie.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.1
  - number: 2.2.1
    text: Er is een managementteam Binnenlandse Zaken en Koninkrijksrelaties (MTBZK).
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.2
  - number: 2.2.2
    text: |-
      Het MTBZK is samengesteld uit de Secretaris-generaal, de directeuren-generaal en het hoofd van de Algemene
      Inlichtingen- en Veiligheidsdienst. De leden kunnen zich incidenteel laten vervangen door hun plaatsvervangers
      of, in uitzonderlijke gevallen, door een andere rechtstreeks onder hen ressorterende functionaris. De Secretaris-
      generaal vertegenwoordigt de Inspectie Openbare Orde en Veiligheid en de dienst Concernstaf en Bedrijfsvoering
      in het MTBZK. Op verzoek van de Secretaris-generaal kan het hoofd van de Inspectie OOV respectievelijk de
      hoofddirecteur DCB worden uitgenodigd voor het bijwonen van het MTBZK. De directeur Financieel-Economische Zaken
      heeft een permanente uitnodiging tot het als adviseur bijwonen van het MTBZK.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.2
  - number: 2.2.3
    text: |-
      Het overleg in het MTBZK heeft, onverminderd het bepaalde in de departementale mandaat- en volmachtbesluiten over
      de bevoegdheden van de afzonderlijke leden van het managementteam Binnenlandse Zaken en Koninkrijksrelaties ten
      aanzien van de onderwerpen die in het overleg aan de orde komen, ten doel het bespreken van respectievelijk het
      bereiken van overeenstemming over de departementale beleids- en beheerskaders en het toezien op de uitvoering van
      deze kaders.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.2
  - number: 2.2.4
    text: |-
      Al hetgeen in de vergaderingen aan de orde komt is vertrouwelijk, voor zover niet anders is besloten of uit de
      wet voortvloeit.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.2
  - number: 2.2.5
    text: Het secretariaat van het MTBZK wordt gevoerd door de directeur van de directie Bestuursondersteuning.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.2
  - number: 2.2.6
    text: Het MTBZK regelt de eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.2
  - number: 2.3.1
    text: Er is een Centraal HRM-beraad.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.3
  - number: 2.3.2
    text: |-
      Het Centraal HRM-beraad is samengesteld uit de Secretaris-generaal, de directeuren-generaal, het hoofd van de
      Algemene Inlichtingen- en Veiligheidsdienst en de directeur Personeel en Organisatie van de dienst Concernstaf
      en Bedrijfsvoering. De leden kunnen zich incidenteel laten vervangen door hun plaatsvervangers. De Secretaris-
      generaal vertegenwoordigt de Inspectie Openbare Orde en Veiligheid en de Dienst Concernstaf en Bedrijfsvoering
      in het Centraal HRM-beraad. Op verzoek van de Secretaris-generaal kan het hoofd van de Inspectie OOV en/of de
      hoofddirecteur van de dienst Concernstaf en Bedrijfsvoering worden uitgenodigd voor het CHRM-beraad.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.3
  - number: 2.3.3
    text: |-
      Het overleg in het Centraal HRM-beraad heeft, onverminderd het bepaalde in de departementale mandaat- en
      volmachtbesluiten over de bevoegdheden van de afzonderlijke leden van het managementteam Binnenlandse Zaken en
      Koninkrijksrelaties ten aanzien van de onderwerpen die in het overleg aan de orde komen, ten doel het bespreken van
      respectievelijk het bereiken van overeenstemming over aspecten van het departementale personeelsbeleid en personele
      aangelegenheden alsmede het toezien op de uitvoering hiervan. In het overleg komen in ieder geval de volgende
      aangelegenheden aan de orde.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.3
  - number: 2.3.3.a
    text: de beleidsontwikkeling van management-development bij het Ministerie;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.3
  - number: 2.3.3.b
    text: de benoeming van functionarissen in schaal 14 en hoger bij het Ministerie;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.3
  - number: 2.3.3.c
    text: |-
      de werkzaamheden van het Centraal HRM-beraad met betrekking tot de personeelsschouw, zoals aangegeven in het
      departementale beleid ter zake.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.3
  - number: 2.3.4
    text: |-
      Al hetgeen in de vergaderingen aan de orde komt is vertrouwelijk, voor zover niet anders is besloten of uit de
      wet voortvloeit.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.3
  - number: 2.3.5
    text: |-
      Het hoofd van de afdeling HRM-Advies van de directie Personeel en Organisatie is verantwoordelijk voor het voeren
      van het secretariaat van het Centraal HRM-beraad.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.3
  - number: 2.3.6
    text: Het Centraal HRM-beraad regelt de eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.3
  - number: 2.4.1
    text: Er is een Audit Comité
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.4
  - number: 2.4.2
    text: |-
      Het Audit Comité is samengesteld uit de leden van de het managementteam Binnenlandse Zaken en Koninkrijksrelaties
      (desgewenst op afroep), de directeur Financieel-Economische Zaken en een lid van het managementteam van de
      Rijksauditdienst dan wel personen die deze leden vertegenwoordigen. Aan het Audit Comité zijn één of meer externe
      deelnemers toegevoegd. De SG is voorzitter van het Audit Comité.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.4
  - number: 2.4.3
    text: 'Het Audit Comité vormt zich een oordeel over:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.4
  - number: 2.4.3.a
    text: de bedrijfsvoering en de opzet en werking van het management control systeem;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.4
  - number: 2.4.3.b
    text: het samenstel van en de samenhang tussen de producten vanuit control, audit en certificering;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.4
  - number: 2.4.3.c
    text: het auditjaarplan en de daarin voorgenomen onderzoeken;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.4
  - number: 2.4.3.d
    text: de uitkomsten van de bedrijfsvoeringonderzoeken en de verwerking ervan.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.4
  - number: 2.4.4
    text: Het Audit Comité adviseert de Secretaris-generaal over de maatregelen die zo nodig moeten worden genomen.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.4
  - number: 2.4.5
    text: |-
      Al hetgeen in de vergaderingen aan de orde komt is vertrouwelijk, voor zover niet anders is besloten of uit de
      wet voortvloeit.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.4
  - number: 2.4.6
    text: De directie Financieel-Economische Zaken voert het secretariaat van het Audit Comité.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.4
  - number: 2.4.7
    text: Het Audit Comité regelt de eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel2.4
  - number: 3.1.1
    text: De Algemene Leiding bestaat uit de Secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.1
  - number: 3.1.2
    text: |-
      De Secretaris-generaal is belast met de ambtelijke leiding van het Ministerie. Tot deze taak behoort in ieder
      geval:
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.1
  - number: 3.1.2.a
    text: het informeren en adviseren van de Minister over aangelegenheden, de Minister of het Ministerie betreffende;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.1
  - number: 3.1.2.b
    text: |-
      het zorgdragen voor de coördinatie en integratie van beleidsvoorbereiding, beleidsontwikkeling en beleidsuitvoering
      binnen het Ministerie;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.1
  - number: 3.1.2.c
    text: het uitoefenen van de algemene controlfunctie bij het Ministerie;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.1
  - number: 3.1.2.d
    text: |-
      het rechtstreeks leiding geven aan de directeuren-generaal, het hoofd van de Algemene Inlichtingen- en
      Veiligheidsdienst, de hoofddirecteur van de dienst Concernstaf en Bedrijfsvoering en het hoofd van de Inspectie
      Openbare Orde en Veiligheid;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.1
  - number: 3.1.2.e
    text: het voorzitterschap van het MTBZK, het Centraal HRM-beraad en het Audit Committee;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.1
  - number: 3.1.2.f
    text: |-
      het zorgdragen voor het nemen van besluiten over - en het geven van algemene aanwijzingen ten aanzien van het
      algemene beleid en beheer inzake de bedrijfsvoering en de formatie van het Ministerie;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.1
  - number: 3.1.2.g
    text: |-
      het voeren van overleg met de Groepsondernemingsraad en de centrales van verenigingen van ambtenaren, bedoeld in
      [artikel 113 van het Algemeen Rijksambtenarenreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel113
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '113'
  - number: 3.1.2.h
    text: |-
      het optreden als gemachtigd ambtenaar in de zin van de Uitvoeringsregeling openbaarheid van bestuur Binnenlandse
      Zaken;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.1
  - number: 3.1.2.i
    text: |-
      het plegen van inhoudelijke afstemming aan de volgende organisatieonderdelen: - de projectdirectie Nieuwbouw
      Justitie & BZK (PNJB);
        - het gemeenschappelijke secretariaat van de Raad voor het openbaar bestuur en de Raad voor de financiële
      verhoudingen (sRob/Rfv).
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.1
  - number: 3.1.3
    text: |-
      De onder artikel 3.1, tweede lid, onderdeel i, genoemde organisatieonderdelen vallen onder beheersmatige leiding
      van de hoofddirecteur van de dienst Concernstaf en Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.1
  - number: 3.1.4
    text: De Secretaris-generaal is belast met het toezicht op het beheer van de Kiesraad.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.1
  - number: 3.1.5
    text: |-
      De Secretaris-generaal wordt bij tijdelijke afwezigheid of verhindering vervangen door een bij besluit daartoe
      aangewezen directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.1
  - number: 3.2.1
    text: De dienst Concernstaf en Bedrijfsvoering staat onder leiding van een hoofddirecteur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.2
  - number: 3.2.2
    text: 'De dienst heeft de volgende kerntaken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.2
  - number: 3.2.2.a
    text: de concernsturing en de strategische advisering van het managementteam van het Ministerie;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.2
  - number: 3.2.2.b
    text: de dienstverlening en vakinhoudelijke advisering ten behoeve van het beleid van de bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.2
  - number: 3.2.2.c
    text: de ondersteuning en het beheer van de bedrijfsprocessen.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.2
  - number: 3.2.3
    text: 'De dienst bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.2
  - number: 3.2.3.a
    text: het bureau dienst Concernstaf en Bedrijfsvoering (bDCB);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.2
  - number: 3.2.3.b
    text: de directie Bestuursondersteuning (BO);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.2
  - number: 3.2.3.c
    text: de directie Financieel-Economische Zaken (FEZ);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.2
  - number: 3.2.3.d
    text: de directie Constitutionele Zaken en Wetgeving (CZW);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.2
  - number: 3.2.3.e
    text: de directie Communicatie en Informatie (C&I);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.2
  - number: 3.2.3.f
    text: de directie Personeel en Organisatie (P&O);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.2
  - number: 3.2.3.g
    text: de directie Bedrijfsvoering (BV)
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.2
  - number: 3.2.3.h
    text: de directie Onderzoek voor Openbaar Bestuur en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.2
  - number: 3.3.1
    text: Het bureau dienst Concernstaf en Bedrijfsvoering staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.3
  - number: 3.3.2
    text: |-
      Het bureau heeft tot taak de hoofddirecteur van de dienst Concernstaf en Bedrijfsvoering te ondersteunen bij de
      uitvoering van de beleids- en beheerstaken.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.3
  - number: 3.4.1
    text: De directie Bestuursondersteuning staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.4
  - number: 3.4.2
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.4
  - number: 3.4.2.a
    text: het beheers- en beleidsmatig ondersteunen en adviseren van de bewindspersonen en de algemene leiding;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.4
  - number: 3.4.2.b
    text: het voeren van het secretariaat van de ambtelijke en politieke leiding;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.4
  - number: 3.4.2.c
    text: het coördineren van aangelegenheden met betrekking tot het parlement of de ministerraad;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.4
  - number: 3.4.2.d
    text: |-
      het ondersteunen van de Secretaris-generaal in diens taken en verantwoordelijkheden met betrekking tot de
      beveiliging van het Ministerie;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.4
  - number: 3.4.2.e
    text: het coördineren en bevorderen van strategische kennisontwikkeling;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.4
  - number: 3.4.2.f
    text: |-
      de vertegenwoordiging van het Ministerie bij de Permanente Vertegenwoordiging van het Koninkrijk der Nederlanden
      bij de Europese Unie (PVEU);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.4
  - number: 3.4.2.g
    text: het coördineren van de internationale strategische adviesfunctie van het Ministerie;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.4
  - number: 3.4.2.h
    text: |-
      Het door tussenkomst van de Beveiligingsambtenaar zorgdragen voor de integrale beveiliging van de organisatie,
      medewerkers, materieel, informatiesystemen, gebouwen en overige objecten, alsmede het toezicht op de werking van de
      beveiligingsorganisatie en de informatiebeveiliging.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.4
  - number: 3.5.1
    text: De directie Financieel-Economische Zaken staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.5
  - number: 3.5.2
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.5
  - number: 3.5.2.a
    text: |-
      het uitvoeren van taken die voortvloeien uit [artikel 21 van de Comptabiliteitswet 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel21
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '21'
  - number: 3.5.2.b
    text: |-
      het uitvoeren van taken die voortvloeien uit het [Besluit taak FEZ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005333
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.5
    references:
