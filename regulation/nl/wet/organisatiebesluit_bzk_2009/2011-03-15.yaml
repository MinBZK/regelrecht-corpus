        bwb_id: BWBR0009743
        artikel: '3'
  - number: 3.5.2.d
    text: het stellen van kaders voor de bedrijfsvoering van het Ministerie;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.5
  - number: 3.5.2.e
    text: het uitoefenen van de financiële control van het Ministerie;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.5
  - number: 3.5.2.f
    text: |-
      het strategisch adviseren van de Algemene Leiding en de Minister over het departementaal financieel-economisch
      beleid waarbij doelmatigheid en doeltreffendheid van het beleid vanuit een brede financiële invalshoek word
      beoordeeld;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.5
  - number: 3.5.2.g
    text: het verzorgen van de proces- en financiële infrastructuur;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.5
  - number: 3.5.2.h
    text: het verzorgen van de financiële administraties;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.5
  - number: 3.5.2.i
    text: het ontwikkelen, invoeren en beheren van systemen van management en financiële informatievoorziening;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.5
  - number: 3.5.2.j
    text: het adviseren en ondersteunen van de (beleids)directies in sturings-, beheersings- en verantwoordingsvraagstukken;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.5
  - number: 3.5.2.k
    text: het verrichten van financieel onderzoek;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.5
  - number: 3.5.2.l
    text: |-
      het verzorgen van de uitvoering van de [Financiële-verhoudingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008290
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0008290
  - number: 3.5.3
    text: 'De directeur Financieel-Economische Zaken is tevens Coördinerend Directeur Inkoop. Deze is verantwoordelijk voor:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.5
  - number: 3.5.3.a
    text: het stellen van kaders voor het inkoopbeleid van het Ministerie;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.5
  - number: 3.5.3.b
    text: de coördinatie van de inkoopfunctie en het contractbeheer van het Ministerie;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.5
  - number: 3.5.3.c
    text: centrale ondersteuning en advisering bij inkoopvraagstukken.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.5
  - number: 3.6.1
    text: De directie Constitutionele Zaken en Wetgeving staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.6
  - number: 3.6.2
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.6
  - number: 3.6.2.a
    text: |-
      het in samenwerking met verantwoordelijke beleidsonderdelen voorbereiden en beheren van alle wet- en regelgeving op
      het terrein van Binnenlandse Zaken en Koninkrijksrelaties met uitzondering van de wet- en regelgeving ten behoeve
      van de AIVD en de ministeriële uitvoeringsregelingen van BPR;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.6
  - number: 3.6.2.b
    text: |-
      het behandelen van constitutionele vraagstukken en het voorbereiden van en adviseren over het constitutionele
      beleid;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.6
  - number: 3.6.2.c
    text: |-
      het toetsen van regelgeving en verdragen alsmede overige beleidsvoornemens van andere Ministeries aan het
      [Statuut][ref1], de [Grondwet][ref2] en aan verdragsbepalingen met constitutionele inslag;


      [ref1]: https://wetten.overheid.nl/BWBR0002154
      [ref2]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0002154
      - id: ref2
        bwb_id: BWBR0001840
  - number: 3.6.2.d
    text: het namens de Minister bijdragen aan de ontwikkeling van het wetgevingskwaliteitsbeleid;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.6
  - number: 3.6.2.e
    text: |-
      het geven van juridisch advies over civielrechtelijke kwesties, de [Wet openbaarheid van bestuur][ref1],
      bestuursrecht en andere juridische aangelegenheden;


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: 3.6.2.f
    text: het behandelen van bijzondere opdrachten van de departementsleiding.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.6
  - number: 3.7.1
    text: De directie Communicatie en Informatie staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.7
  - number: 3.7.2
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.7
  - number: 3.7.2.a
    text: |-
      het ervoor zorg dragen dat medewerkers van het Ministerie een gebruikersvriendelijke toegang hebben tot de
      informatie die zij nodig hebben voor hun werk;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.7
  - number: 3.7.2.b
    text: |-
      het ervoor zorg dragen dat medewerkers van het Ministerie de informatie die zij nodig hebben voor hun werk optimaal
      kunnen beheren;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.7
  - number: 3.7.2.c
    text: |-
      het ondersteunen van medewerkers het Ministerie bij het inzetten van communicatie in hun beleids- en ondersteunende
      processen;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.7
  - number: 3.7.2.d
    text: het zijn van eerstverantwoordelijke voor de corporate communicatiestrategie;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.7
  - number: 3.7.2.e
    text: het uitvoeren van een regierol op het gebied van beleidscommunicatie;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.7
  - number: 3.7.2.f
    text: |-
      het onderhouden van de contacten met de pers en het verzorgen van de woordvoering voor en presentatie van de
      bewindslieden.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.7
  - number: 3.8.1
    text: De directie Personeel en Organisatie staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.8
  - number: 3.8.2
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.8
  - number: 3.8.2.a
    text: |-
      het ontwikkelen, implementeren en evalueren van het human resource management-, arbeidsomstandigheden- en
      arbeidsvoorwaardenbeleid;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.8
  - number: 3.8.2.b
    text: het doen van onderzoek en het monitoren van het gevoerde beleid en beheer;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.8
  - number: 3.8.2.c
    text: |-
      het adviseren en ondersteunen op het terrein van human resource management, organisatie, arbeidsomstandigheden,
      juridische personeelsaangelegenheden en medezeggenschap;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.8
  - number: 3.8.2.d
    text: het afstemmen van vraag en aanbod van personeel;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.8
  - number: 3.8.2.e
    text: het voeren van de personeels- en salarisadministratie;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.8
  - number: 3.8.2.f
    text: het beheren van personeelssystemen;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.8
  - number: 3.8.2.g
    text: |-
      het uitoefenen van taken als bedoeld in [artikel 2 van het Beheersbesluit KABGNA/KABGA 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009743#Artikel2
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0009743
        artikel: '2'
  - number: 3.9.1
    text: De directie Bedrijfsvoering staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.9
  - number: 3.9.2
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.9
  - number: 3.9.2.a
    text: |-
      het voeren van regie op de facilitaire en informatie- en communicatietechnologiedienstverlening door onder meer het
      uitvoeren van contract- en leveranciersmanagement alsmede account- en servicelevelmanagement;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.9
  - number: 3.9.2.b
    text: het ontwikkelen en/of aanpassen van (nieuwe) diensten met behulp van innovaties in het werkveld;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.9
  - number: 3.9.2.c
    text: het geven van specialistisch advies over niet gangbare dienstverlening;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.9
  - number: 3.9.2.d
    text: |-
      het beheren van de informatie- en communicatietechnologie en het geven van service op de voorzieningen voor
      informatie- en communicatietechnologie binnen het departement.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.9
  - number: 3.10.1
    text: De Projectdirectie Nieuwbouw Justitie & BZK staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.10
  - number: 3.10.2
    text: 'De projectdirectie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.10
  - number: 3.10.2.a
    text: |-
      het bevorderen van het tot stand komen van nieuwe huisvesting en de bijbehorende voorzieningen voor het
      kerndepartement;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.10
  - number: 3.10.2.b
    text: het voorbereiden van de verhuizing;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.10
  - number: 3.10.2.c
    text: |-
      het voeren van overleg met de ontwerpende en uitvoerende partijen waaronder het verzorgen van interdepartementale
      afstemming en afstemming met de betrokken gemeente;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.10
  - number: 3.10.2.d
    text: de zorg voor een adequate informatievoorziening over het project.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.10
  - number: 3.11.1
    text: |-
      Het gemeenschappelijk secretariaat van de Raad voor het openbaar bestuur en de Raad voor de financiële verhoudingen
      staat onder leiding van een secretaris.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.11
  - number: 3.11.2
    text: Het secretariaat heeft tot taak beide raden inhoudelijk en administratief te ondersteunen bij hun advisering.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.11
  - number: 3.13.1
    text: De directie Kennisontwikkeling voor Openbaar Bestuur en Veiligheid staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.13
  - number: 3.13.2
    text: 'De directie Kennisontwikkeling voor Openbaar Bestuur en Veiligheid is belast met de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.13
  - number: 3.13.2.a
    text: Het voeren van de regie op alle onderzoeksopdrachten binnen het ministerie;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.13
  - number: 3.13.2.b
    text: Het borgen van de resultaten en de evaluatie tbv de strategische (meerjaren) onderzoeksagenda;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.13
  - number: 3.13.2.c
    text: Het hebben van de eindverantwoordelijkheid voor alle aanbestedingen van onderzoeksopdrachten;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.13
  - number: 3.13.2.d
    text: |-
      Het borgen van en het geven van input voor de strategische oriëntatie van de beleidsonderdelen waarbij aansluiting
      wordt gezocht bij de P&C cyclus en meerjarenbeleidsplanning;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.13
  - number: 3.13.2.e
    text: |-
      Het verrichten van ondersteunende taken zoals de voortgangsbewaking van concrete projecten, het organiseren van
      expert meetings, conferenties etc., het beheer van het relatienetwerk, het beheer van een intranetsite, en het
      verzorgen van publicaties.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.13
  - number: 3.14.1
    text: Het directoraat-generaal Organisatie en Bedrijfsvoering Rijk staat onder leiding van een directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.14
  - number: 3.14.2
    text: |-
      Het directoraat-generaal heeft tot taak zorg te dragen voor een integrale aanpak op het terrein van bedrijfsvoering
      van de Rijksoverheid door:
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.14
  - number: 3.14.2.a
    text: kaderstelling op de onderscheiden terreinen van de bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.14
  - number: 3.14.2.b
    text: het bevorderen, realiseren en (doen) in stand houden van samenwerking en gezamenlijke uitvoeringsorganisaties;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.14
  - number: 3.14.2.c
    text: het in programma’s (doen) realiseren van Rijksbrede voorzieningen op het terrein van de bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.14
  - number: 3.14.3
    text: 'Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.14
  - number: 3.14.3.a
    text: het bureau Directeur-Generaal van het directoraat-generaal Organisatie en Bedrijfsvoering Rijk (BDGOBR);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.14
  - number: 3.14.3.b
    text: de directie Faciliteiten-, Huisvesting- en Inkoopbeleid Rijk (FHIR);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.14
  - number: 3.14.3.c
    text: de directie Organisatie en Personeelsbeleid Rijk (OP Rijk);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.14
  - number: 3.14.3.d
    text: de directie Informatiseringsbeleid Rijk (I Rijk);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.14
  - number: 3.14.3.e
    text: de baten-lastendienst P-Direkt;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.14
  - number: 3.14.3.f
    text: de baten-lastendienst de Werkmaatschappij (Wmij);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.14
  - number: 3.14.3.g
    text: het Facilitair bedrijf 4FM (de baten-lastendienst 4FM i.o.);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.14
  - number: 3.14.3.h
    text: het agentschap Centrale Archief Selectiedienst (CAS).
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.14
  - number: 3.15.1
    text: |-
      Het bureau Directeur-Generaal van het directoraat-generaal Organisatie en Bedrijfsvoering Rijk staat onder leiding
      van een hoofd.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.15
  - number: 3.15.2
    text: Het bureau heeft tot taak de directeur-generaal te ondersteunen bij de uitvoering van de beleids- en beheertaken.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.15
  - number: 3.16.1
    text: De directie Faciliteiten-, Huisvesting- en Inkoopbeleid Rijk staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.16
  - number: 3.16.2
    text: |-
      De directie heeft tot taak de kaderstelling en de regievoering ten aanzien van het beleid van de Rijksoverheid
      over de facilitaire dienstverlening, de huisvesting en inkopen en de regievoering ten aanzien van het beleid van de
      Rijksoverheid over aanbesteden.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.16
  - number: 3.17.1
    text: De directie Organisatie en Personeelsbeleid Rijk staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.17
  - number: 3.17.2
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.17
  - number: 3.17.2.a
    text: het ondersteunen van de Minister bij het afsluiten van de arbeidsvoorwaarden van het Rijk;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.17
  - number: 3.17.2.b
    text: het ondersteunen van de arbeidskwaliteit van het Rijk;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.17
  - number: 3.17.2.c
    text: de organisatie van de Rijksoverheid en de daaraan verbonden uitvoeringsorganisaties op centraal niveau;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.17
  - number: 3.17.2.d
    text: de informatievoorziening op het vlak van de bedrijfsvoering bij het Rijk.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.17
  - number: 3.18.1
    text: De directie Informatiseringsbeleid Rijk staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.18
  - number: 3.18.2
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.18
  - number: 3.18.2.a
    text: het ontwikkelen en beheren van kaders voor informatiseringsbeleid binnen het Rijk;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.18
  - number: 3.18.2.b
    text: het in brede zin bevorderen van de kwaliteit van informatisering binnen het Rijk;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.18
  - number: 3.18.2.c
    text: |-
      het volgen van grote projecten voor informatie- en communicatietechnologie binnen het Rijk en het periodiek
      daarover rapporteren aan de Tweede Kamer;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.18
  - number: 3.18.2.d
    text: |-
      het fungeren als opdrachtgever voor rijksbrede projecten en beheerorganisaties op het gebied van informatie- en
      communicatietechnologie;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.18
  - number: 3.18.2.e
    text: |-
      het bevorderen en faciliteren van informatiebeveiliging op het gebied van personeel, informatie- en
      communicatietechnologie en organisatie.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.18
  - number: 3.19.1
    text: De baten-lastendienst P-Direkt staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.19
  - number: 3.19.2
    text: |-
      P-Direkt heeft tot taak om in één Shared Service Center HRM een efficiënte en kwalitatief hoogwaardige salaris-
      en personeelsadministratie te realiseren gebaseerd op gezamenlijk ontwikkelde en beheerde personeels- en
      salarissystemen voor de Rijksoverheid (met uitzondering van het Ministerie van Defensie en de Staten-Generaal).
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.19
  - number: 3.20.1
    text: De baten-lastendienst Werkmaatschappij staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.20
  - number: 3.20.2
    text: |-
      De Werkmaatschappij heeft tot taak de interdepartementale samenwerkingsverbanden binnen de Rijksoverheid op het
      gebied van bedrijfsvoering te faciliteren.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.20
  - number: 3.21.1
    text: Het facilitair bedrijf 4FM (batenlastendienst 4FM i.o.) staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.21
  - number: 3.21.2
    text: |-
      4FM voert de regie op de uitvoering van facilitaire producten en diensten bij - en levert deze producten en
      diensten aan de tot 4FM toegetreden departementen;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.21
  - number: 3.22.1
    text: Het agentschap Centrale Archief Selectiedienst staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.22
  - number: 3.22.2
    text: |-
      Het agentschap heeft de taken, bedoeld in het [besluit van 12 december 1996][ref1], houdende regels met betrekking
      tot taak en werkwijze van de Centrale Archief Selectiedienst.


      [ref1]: https://wetten.overheid.nl/BWBR0008412
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0008412
  - number: 3.23.1
    text: Het directoraat-generaal Bestuur en Koninkrijksrelaties staat onder leiding van een directeur-generaal
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.23
  - number: 3.23.2
    text: |-
      Het directoraat-generaal draagt zorg voor het bestuurlijk en ambtelijk functioneren van de publieke sector in
      Nederland en voor de handhaving en uitvoering van het Statuut van het Koninkrijk, door het uitvoeren van de
      volgende taken:
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.23
  - number: 3.23.2.a
    text: |-
      het bevorderen van een doelmatig, doeltreffend en democratisch openbaar bestuur, waaronder begrepen de relaties met
      de overige onderdelen van het Koninkrijk, de Europese Unie en andere internationale instellingen;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.23
  - number: 3.23.2.b
    text: |-
      het zorg dragen voor een goede en adequate organisatie met betrekking tot het Nederlandse openbaar bestuur, o.a.
      met betrekking tot de financiën van gemeenten en provincies (het Gemeentefonds en het Provinciefonds);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.23
  - number: 3.23.2.c
    text: |-
      het in overleg met de overige ministeries zorg dragen voor goede interbestuurlijke relaties, beredeneerd vanuit de
      eigenstandige positie van provincies en gemeenten;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.23
  - number: 3.23.2.d
    text: het zorg dragen voor de kwaliteit, integriteit, diversiteit en veiligheid van het overheidpersoneel;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.23
  - number: 3.23.2.e
    text: de ontwikkeling van een adequate dienstverlening en vermindering van regeldruk;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.23
  - number: 3.23.2.f
    text: |-
      het zorg dragen voor een goed Gemeenschappelijke Basis Administratiestelsel en voor een goed functionerend
      reisdocumentenstelsel en het daarbij behorende persoonsinformatiebeleid;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.23
  - number: 3.23.2.g
    text: het zorg dragen voor goede relaties met en coördinatie van de samenwerking met de Nederlandse Antillen en Aruba.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.23
  - number: 3.23.3
    text: 'Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.23
  - number: 3.23.3.a
    text: het bureau Directeur-Generaal Bestuur en Koninkrijksrelaties (BDGBK);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.23
  - number: 3.23.3.b
    text: de directie Koninkrijksrelaties (DKR);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.23
  - number: 3.23.3.c
    text: de directie Openbaar Bestuur en Democratie (DOBD);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.23
  - number: 3.23.3.d
    text: de directie Arbeidszaken Publieke Sector (APS);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.23
  - number: 3.23.3.e
    text: de directie Gemeenschappelijke Beheer Organisatie Overheid (GBO Overheid);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.23
  - number: 3.23.3.f
    text: de programmadirectie Dienstverlening, Regeldruk en Informatiebeleid (PDRI);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.23
  - number: 3.23.3.g
    text: de programmadirectie Krachtig Bestuur (PKB);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.23
  - number: 3.23.3.h
    text: de Vertegenwoordiging van Nederland in Aruba (VNO);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.23
  - number: 3.23.3.i
    text: de Vertegenwoordiging van Nederland in de Nederlandse Antillen (VNW);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.23
  - number: 3.23.3.j
    text: de baten-lastendienst Basisadministratie Persoonsgegevens en Reisdocumenten (BPR).
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.23
  - number: 3.24.1
    text: |-
      Het bureau Directeur-Generaal van het directoraat-generaal Koninkrijksrelaties en Bestuur staat onder leiding van
      een hoofd.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.24
  - number: 3.24.2
    text: Het bureau heeft tot taak de Directeur-Generaal te ondersteunen bij de uitvoering van de beleids- en beheerstaken.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.24
  - number: 3.25.1
    text: De directie Koninkrijksrelaties staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.25
  - number: 3.25.2
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.25
  - number: 3.25.2.a)
    text: |-
      het ontwikkelen van het samenwerkingsbeleid in algemene zin respectievelijk van het Nederlands beleid met
      betrekking tot de samenwerkingsrelatie met de Nederlandse Antillen en Aruba;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.25
  - number: 3.25.2.b)
    text: |-
      het ontwikkelen, coördineren en uitvoeren van de samenwerking en het onderhouden van betrekkingen met de
      Nederlandse Antillen en Aruba;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.25
  - number: 3.25.2.c)
    text: het initiëren en coördineren van het Nederlandse beleid ten aanzien van de Nederlandse Antillen en Aruba.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.25
  - number: 3.26.1
    text: De directie Openbaar Bestuur en Democratie staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.26
  - number: 3.26.2
    text: |-
      De directie heeft tot taak het ontwikkelen van beleid en wetgeving met betrekking tot de inrichting, werking
      en financiering van het binnenlandse bestuur waarbij specifieke aandacht wordt gegeven aan de burger in dit
      democratische bestel en de uitvoering van de in de [Financiële verhoudingswet][ref1] en [Gemeente-][ref2] en
      [Provinciewet][ref3] neergelegde taken van de minister van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0008290
      [ref2]: https://wetten.overheid.nl/BWBR0005416
      [ref3]: https://wetten.overheid.nl/BWBR0005645
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0008290
      - id: ref2
        bwb_id: BWBR0005416
      - id: ref3
        bwb_id: BWBR0005645
  - number: 3.27.1
    text: De directie Arbeidszaken Publieke Sector staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.27
  - number: 3.27.2
    text: |-
      De directie heeft tot taak het zorg dragen voor de voorwaarden voor het functioneren van politieke ambtsdragers en
      voor de inzet van goed gekwalificeerde medewerkers in de openbare sector.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.27
  - number: 3.28.1
    text: De directie Gemeenschappelijke Beheer Organisatie Overheid staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.28
  - number: 3.28.2
    text: |-
      De Gemeenschappelijke Beheer Organisatie Overheid heeft tot taak het ondersteunen van de elektronische
      dienstverlening aan burgers en bedrijven door de noodzakelijke infrastructurele basisvoorzieningen te beheren en
      verder te ontwikkelen.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.28
  - number: 3.29.1
    text: De programmadirectie Dienstverlening Regeldruk en Informatiebeleid staat onder leiding van een programmadirecteur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.29
  - number: 3.29.2
    text: 'Het programma heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.29
  - number: 3.29.2.a
    text: het verbeteren van de publieke dienstverlening;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.29
  - number: 3.29.2.b
    text: het vergroten van de toegankelijkheid van overheidsinformatie;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.29
  - number: 3.29.2.c
    text: het verminderen van de regeldruk.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.29
  - number: 3.30.1
    text: De programmadirectie Krachtig Bestuur staat onder leiding van een programmadirecteur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.30
  - number: 3.30.2
    text: |-
      Het programma heeft tot taak het vergroten van de bestuurskracht van het openbaar bestuur als geheel door gemeenten
      te faciliteren in het efficiënt en effectief oplossen van maatschappelijke problemen op een manier die tegemoet
      komt aan de wensen van de burgers.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.30
  - number: 3.31.1
    text: De Vertegenwoordiging van Nederland in Aruba staat onder leiding van een Vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.31
  - number: 3.31.2
    text: |-
      De Vertegenwoordiging heeft bij koninklijk besluit van 24 april 1997, regelende de positie en functie van
      Vertegenwoordiger van de Nederlandse regering bij de regering van de Nederlandse Antillen onderscheidenlijk Aruba,
      de volgende taken:
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.31
  - number: 3.31.2.a)
    text: het optreden als vertegenwoordiger van de Nederlandse regering bij de regering van Aruba;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.31
  - number: 3.31.2.b)
    text: het onderhouden van contacten met de regering van Aruba, alsmede met andere autoriteiten van Aruba;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.31
  - number: 3.31.2.c)
    text: |-
      het informeren van de ministers en de ambtelijke leiding van het ministerie over de politieke, bestuurlijke,
      financiële, maatschappelijke en sociaal-economische ontwikkelingen in Aruba;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.31
  - number: 3.31.2.d)
    text: |-
      het voorbereiden en begeleiden van bezoeken van Nederlandse ministers en staatssecretarissen, bestuurders en andere
      autoriteiten aan Aruba;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.31
  - number: 3.31.2.e)
    text: het zorg dragen voor het monitoren van afspraken in het kader van het samenwerkingsbeleid.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.31
  - number: 3.32.1
    text: De Vertegenwoordiging van Nederland in de Nederlandse Antillen staat onder leiding van een Vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.32
  - number: 3.32.2
    text: |-
      De Vertegenwoordiging heeft bij koninklijk besluit van 24 april 1997, regelende de positie en functie van
      Vertegenwoordiger van de Nederlandse regering bij de regering van de Nederlandse Antillen onderscheidenlijk Aruba,
      de volgende taken:
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.32
  - number: 3.32.2.a)
    text: |-
      het optreden als vertegenwoordiger van de Nederlandse regering bij de regering en de eilandbesturen van de
      Nederlandse Antillen;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.32
  - number: 3.32.2.b)
    text: |-
      het onderhouden van contacten met de regering en de eilandbesturen en met andere autoriteiten in de Nederlandse
      Antillen;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.32
  - number: 3.32.2.c)
    text: |-
      het informeren van de ministers en de ambtelijke leiding van het ministerie over de politieke, bestuurlijke,
      financiële, maatschappelijke en sociaal-economische ontwikkelingen in de Nederlandse Antillen;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.32
  - number: 3.32.2.d)
    text: |-
      het voorbereiden en begeleiden van bezoeken van Nederlandse ministers en staatssecretarissen, bestuurders en andere
      autoriteiten aan de Nederlandse Antillen;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.32
  - number: 3.32.2.e)
    text: het zorg dragen voor het monitoren van afspraken in het kader van het samenwerkingsbeleid.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.32
  - number: 3.33.1
    text: De baten-lastendienst Basisadministratie Persoonsgegevens en Reisdocumenten staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.33
  - number: 3.33.2
    text: 'De baten-lastendienst heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.33
  - number: 3.33.2.a
    text: de instandhouding van de gemeentelijke basisadministratie persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.33
  - number: 3.33.2.b
    text: |-
      het uitvoeren van het beleid inzake reisdocumenten en de uitvoering van de [Paspoortwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: 3.33.2.c
    text: het zorg dragen voor de implementatie van grootschalige ICT-projecten op het terrein van identiteitsmanagement.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.33
  - number: 3.34.1
    text: |-
      Het directoraat-generaal Veiligheid staat onder leiding van een directeur-generaal en een vrijgesteld
      plaatsvervangend directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.34
  - number: 3.34.2
    text: Het directoraat-generaal draagt zorg voor een integrale aanpak op het terrein van veiligheid.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.34
  - number: 3.34.3
    text: 'Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.34
  - number: 3.34.3.a
    text: het bureau Directeur-Generaal van het directoraat-generaal Veiligheid (BDGV);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.34
  - number: 3.34.3.b
    text: de afdeling Financiën DGV (FDGV)
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.34
  - number: 3.34.3.c
    text: de directie Veiligheid en Bestuur (VB);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.34
  - number: 3.34.3.d
    text: de directie Politie en Veiligheidsregio’s (PV);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.34
  - number: 3.34.3.e
    text: de directie Nationale Veiligheid (NV);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.34
  - number: 3.34.3.f
    text: het bureau Landelijk Management Development Politie en Brandweer (BLMD);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.34
  - number: 3.34.3.g
    text: het bureau Korpsbeheer en relatiebeheer agentschappen (KOBRA);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.34
  - number: 3.34.3.h
    text: de baten-lastendienst Landelijke Faciliteit Rampenbestrijding (LFR);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.34
  - number: 3.34.3.i
    text: de baten-lastendienst het Korps landelijke politiediensten (KLPD).
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.34
  - number: 3.35.1
    text: Het bureau Directeur-Generaal van het directoraat-generaal Veiligheid staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.35
  - number: 3.35.2
    text: |-
      Het bureau heeft tot taak het ondersteunen van het managementteam van het directoraat-generaal Veiligheid (MTV) en
      de directies bij de uitvoering van de beleids- en beheertaken.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.35
  - number: 3.36.1
    text: De afdeling Financiën Directeur-Generaal Veiligheid staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.36
  - number: 3.36.2
    text: |-
      De afdeling heeft tot taak het ondersteunen van het managementteam van het directoraat-generaal Veiligheid en de
      directies bij de uitvoering van de Veiligheidsbegroting.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.36
  - number: 3.37.1
    text: De directie Veiligheid en Bestuur staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.37
  - number: 3.37.2
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.37
  - number: 3.37.2.a
    text: het ontwikkelen van een lange termijn visie op maatschappelijke veiligheidsvraagstukken vanuit bestuurlijk oogpunt;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.37
  - number: 3.37.2.b
    text: het bevorderen van fysieke veiligheid.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.37
  - number: 3.38.1
    text: De directie Politie en Veiligheidsregio’s staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.38
  - number: 3.38.2
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.38
  - number: 3.38.2.a
    text: |-
      het ontwikkelen van een (lange termijn) visie op de kwaliteit, de inrichting en de ontwikkeling van en de samenhang
      tussen de veiligheidsorganisaties en de feitelijke inrichting ervan;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.38
  - number: 3.38.2.b
    text: het ontwikkelen van beleid op de taakuitvoering en bevoegdheden van de veiligheidsorganisaties;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.38
  - number: 3.38.2.c
    text: |-
      leveren van een bijdrage aan de besluitvorming over: - de landelijke prioriteiten in het werk van de
      veiligheidsorganisaties;
        - het relatiebeheer van de veiligheidsorganisaties;
        - het beleid op kwaliteit van personeel en materiaal van de veiligheidsorganisaties;
        - het bekostigingsbeleid en monitoring van politie en veiligheidsregio’s;
        - het (financieel) toezicht op de regionale politiekorpsen, Zelfstandige Bestuursorganen en baten-lastendiensten.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.38
  - number: 3.39.1
    text: De directie Nationale Veiligheid staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.39
  - number: 3.39.2
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.39
  - number: 3.39.2.a
    text: het voorkomen van en prepareren voor dreigingen tegen de nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.39
  - number: 3.39.2.b
    text: |-
      het in dit kader ontwikkelen van een eenheid in visie en optreden tussen de verschillende regio’s en het nationale
      niveau.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.39
  - number: 3.40.1
    text: Het bureau Landelijk Management Development Politie en Brandweer staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.40
  - number: 3.40.2
    text: 'Het bureau heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.40
  - number: 3.40.2.a
    text: |-
      het samen met het politieveld en het brandweerveld vormgeven, ontwikkelen en uitvoeren van het landelijk beleid
      voor management development voor de politie en brandweer en daarbij behorende instrumenten, een en ander in
      afstemming met het regionaal beleid;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.40
  - number: 3.40.2.b
    text: het realiseren van een landelijke infrastructuur van het management development voor de politie en brandweer;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.40
  - number: 3.40.2.c
    text: het zorgdragen voor de voorbereiding van en advisering over Kroonbenoemingen bij de politie;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.40
  - number: 3.40.2.d
    text: het adviseren over benoemingen in de strategische top van de brandweer.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.40
  - number: 3.41.1
    text: Het bureau Korpsbeheer en relatiebeheer agentschappen (KOBRA) staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.41
  - number: 3.41.2
    text: 'Het bureau heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.41
  - number: 3.41.2.a
    text: |-
      het adviseren en ondersteunen van de directeur-generaal bij de uitvoering van diens taken als gemandateerd
      beheerder van het Korps landelijke politiediensten en als beheerder van de baten-lastendienst Landelijke Faciliteit
      Rampenbestrijding en de Onderzoeksraad voor Veiligheid;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.41
  - number: 3.41.2.b
    text: |-
      het faciliteren van het Korps landelijke politiediensten, de baten-lastendienst Landelijke Faciliteit
      Rampenbestrijding en de Onderzoeksraad voor Veiligheid in de relatie met de beheerder;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.41
  - number: 3.41.2.c
    text: |-
      het faciliteren van de beleidsbepaling en kaderstelling ten aanzien van het Korps landelijke politiediensten, de
      baten-lastendienst Landelijke Faciliteit Rampenbestrijding en de Onderzoeksraad voor Veiligheid;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.41
  - number: 3.41.2.d
    text: |-
      het faciliteren van het Korps landelijke politiediensten, de baten-lastendienst Landelijke Faciliteit
      Rampenbestrijding en de Onderzoeksraad voor Veiligheid in de relaties met het Ministerie.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.41
  - number: 3.42.1
    text: De baten-lastendienst Landelijke Faciliteit Rampenbestrijding staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.42
  - number: 3.42.2
    text: 'De Landelijke Faciliteit Rampenbestrijding heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.42
  - number: 3.42.2.a
    text: |-
      het uitvoeren van opdrachten op het gebied van rampenbeheersing en brandweerzorg in benodigd materieel,
      telecommunicatie, geneeskundige hulpverlening, logistiek en in beleid betreffende het waarschuwen van bevolking;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.42
  - number: 3.42.2.b
    text: |-
      het verstrekken van extra materieel voor grootschalige brandbestrijding en technische hulpverlening aan de
      regionale brandweren;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.42
  - number: 3.42.2.c
    text: |-
      het verstrekken van extra materieel voor de geneeskundige hulpverlening bij ongevallen en rampen alsmede de
      bijzonder politiemiddelen voor de directie Politie.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.42
  - number: 3.43.1
    text: De baten-lastendienst het Korps landelijke politiediensten staat onder leiding van een korpschef.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.43
  - number: 3.43.2
    text: |-
      Het Korps is belast met de taken, bedoeld in [artikel 38 van de Politiewet 1983][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel38
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.43
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '38'
  - number: 3.44.1
    text: De Algemene Inlichtingen- en Veiligheidsdienst staat onder leiding van een hoofd en een plaatsvervangend hoofd.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.44
  - number: 3.44.2
    text: |-
      De Algemene Inlichtingen- en Veiligheidsdienst heeft de taken, bedoeld in
      [artikel 6 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel6
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.44
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '6'
  - number: 3.44.3
    text: 'De Algemene Inlichtingen- en Veiligheidsdienst bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.44
  - number: 3.44.3.a
    text: de Eenheid Strategie en Beleid (S&B);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.44
  - number: 3.44.3.b
    text: de Eenheid Kenniscentrum Verbetermanagement & Innovatie (KVI);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.44
  - number: 3.44.3.c
    text: de Eenheid Dienstencentrum (DC);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.44
  - number: 3.44.3.d
    text: de Eenheid Binnenlandse Veiligheid (BV);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.44
  - number: 3.44.3.e
    text: de Eenheid Veiligheidsonderzoeken (VO);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.44
  - number: 3.44.3.f
    text: de Eenheid Inlichtingen Buitenland (IB);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.44
  - number: 3.44.3.g
    text: de Eenheid Nationaal Bureau Verbindingsbeveiliging (NBV);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.44
  - number: 3.44.3.h
    text: de Eenheid Regie (ER);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.44
  - number: 3.44.3.i
    text: de Eenheid Trendanalyse & Fenomeenonderzoek (Terra);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.44
  - number: 3.44.3.j
    text: de Eenheid Operationele Expertise & Ondersteuning (OPEX);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.44
  - number: 3.44.3.k
    text: de Eenheid Informatie Management (IM).
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.44
  - number: 3.45.1
    text: |-
      De Eenheid Strategie en Beleid, de Eenheid Kenniscentrum Verbetermanagement & Innovatie, en de Eenheid
      Dienstencentrum staan onder leiding van het plaatsvervangend hoofd AIVD.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.45
  - number: 3.45.2
    text: 'De Eenheid Strategie en Beleid heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.45
  - number: 3.45.2.a
    text: |-
      het adviseren en ondersteunen van de dienstleiding en het managementteam van de Algemene Inlichtingen- en
      Veiligheidsdienst met betrekking tot het strategisch richten, besturen en beheersen van alle hoofdprocessen en de
      vertegenwoordiging van de Algemene Inlichtingen- en Veiligheidsdienst;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.45
  - number: 3.45.2.b
    text: het opstellen en handhaven van strategische kaders en bijbehorend(e) beleid(sregels).
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.45
  - number: 3.45.3
    text: 'De Eenheid Kenniscentrum Verbetermanagement & Innovatie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.45
  - number: 3.45.3.a
    text: het zorg dragen voor systematische kwaliteitszorg;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.45
  - number: 3.45.3.b
    text: het ontwikkelen en bewaken van het procesmanagement;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.45
  - number: 3.45.3.c
    text: het bevorderen van innovatie.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.45
  - number: 3.45.4
    text: 'De Eenheid Dienstencentrum heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.45
  - number: 3.45.4.a
    text: |-
      het ondersteunen van de Algemene Inlichtingen- en Veiligheidsdienst op het gebied van administratieve, personele en
      facilitaire diensten;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.45
  - number: 3.45.4.b
    text: het leveren van dienstbrede, generieke voorzieningen.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.45
  - number: 3.46.1
    text: |-
      De Eenheid Binnenlandse Veiligheid en de Eenheid Veiligheidsonderzoeken staan onder leiding van de directeur
      Binnenlandse Veiligheid.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.46
  - number: 3.46.2
    text: 'De Eenheid Binnenlandse Veiligheid heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.46
  - number: 3.46.2.a
    text: |-
      het verrichten van onderzoek naar personen en organisaties die een bedreiging kunnen vormen voor de democratische
      rechtsorde, de veiligheid van de Staat of andere gewichtige belangen van de Staat aangaande: - tegenkrachten bij
      integratie;
        - terrorisme;
        - politiek (gewelddadig) activisme;
        - ongewenste bemoeienis van vreemde mogendheden;
        - bedreiging internationale rechtsorde;
        - integriteitaantastingen;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.46
  - number: 3.46.2.b
    text: |-
      het bevorderen van de beveiliging van onderdelen van overheid en bedrijfsleven die van vitaal belang zijn voor de
      instandhouding van het maatschappelijk leven;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.46
  - number: 3.46.2.c
    text: |-
      het bevorderen van de beveiliging van de aangewezen personen, objecten en diensten behorende tot het rijksdomein
      door het maken van dreigingsinschattingen, -meldingen en risicoanalyses.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.46
  - number: 3.46.3
    text: 'De Eenheid Veiligheidsonderzoeken heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.46
  - number: 3.46.3.a
    text: het adviseren bij en instemmen met de aanwijzing van vertrouwensfuncties;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.46
  - number: 3.46.3.b
    text: |-
      het verrichten van veiligheidsonderzoeken naar personen die vertrouwensfuncties vervullen of gaan vervullen bij
      overheid en bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.46
  - number: 3.47.1
    text: |-
      De Eenheid Inlichtingen Buitenland en de Eenheid Nationaal Bureau Verbindingsbeveiliging staan onder leiding van de
      directeur Inlichtingen Buitenland.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.47
  - number: 3.47.2
    text: |-
      De Eenheid Inlichtingen Buitenland heeft tot taak het verrichten van onderzoek
      betreffende andere landen ten aanzien van onderwerpen die op grond van
      [artikel 6, tweede lid, onderdeel d, van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1] zijn
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel6
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.47
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '6'
  - number: 3.47.3
    text: 'De Eenheid Nationaal Bureau Verbindingsbeveiliging heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.47
  - number: 3.47.3.a
    text: |-
      het bevorderen van de beveiliging van communicatie- en informatiesystemen waarvan de beveiliging door het belang
      van de Staat wordt geboden;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.47
  - number: 3.47.3.b
    text: |-
      het fungeren als National Security Authority (NSA), National Communications Security Authority (NCSA), Nationale
      Distributie Autoriteit (NDA) en Nationale Tempest Autoriteit (NTA).
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.47
  - number: 3.48.1
    text: |-
      De Eenheid Regie, de Eenheid Trendanalyse & Fenomeenonderzoek en de Eenheid Operationele Expertise & Ondersteuning
      staan onder leiding van de directeur Operationele ondersteuning.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.48
  - number: 3.48.2
    text: 'De Eenheid Regie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.48
  - number: 3.48.2.a
    text: |-
      het sturen op resultaat, samenhang en samenwerking in het inlichtingenproces, met als doel het effectief en
      efficiënt laten verlopen van dat proces;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.48
  - number: 3.48.2.b
    text: de centrale intake van ongerichte informatie voor het inlichtingenproces;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.48
  - number: 3.48.2.c
    text: |-
      de centrale planning en afhandeling van rapportages van de Algemene Inlichtingen- en Veiligheidsdienst afkomstig
      uit het inlichtingenproces.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.48
  - number: 3.48.3
    text: |-
      De Eenheid Trendanalyse & Fenomeenonderzoek heeft tot taak fenomenen die vallen binnen de operationele taakvelden
      van de dienst maar die de taakgebieden van afzonderlijke eenheden of teams overstijgen, te signaleren, te verklaren
      en relevante ontwikkelingen en trends tijdig te onderkennen.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.48
  - number: 3.48.4
    text: 'De Eenheid Operationele Expertise & Ondersteuning heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.48
  - number: 3.48.4.a
    text: het toegankelijk maken en ontsluiten van (digitale) gegevensverzamelingen;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.48
  - number: 3.48.4.b
    text: |-
      het procesmatig aansturen en het relatiebeheer betreffende instanties als genoemd in
      [artikel 60 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel60
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.48
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '60'
  - number: 3.48.4.c
    text: het leveren van bijzondere operationele informatie en diensten;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.48
  - number: 3.48.4.d
    text: het verzorgen van de relaties met buitenlandse inlichtingen- en veiligheidsdiensten.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.48
  - number: 3.49.1
    text: De Eenheid Informatie Management staan onder leiding van de directeur Informatie Management.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.49
  - number: 3.49.2
    text: 'De Eenheid Informatie Management heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.49
  - number: 3.49.2.a
    text: het bepalen van de strategie en de inrichting van de informatiestromen en -verwerkingsfuncties;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.49
  - number: 3.49.2.b
    text: het zorg dragen voor de continuïteit en de betrouwbaarheid van de informatiesystemen;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.49
  - number: 3.49.2.c
    text: de ontwikkeling van informatiesystemen en innovatie van de informatiehuishouding.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.49
  - number: 3.50.1
    text: Het Bureau Algemene Bestuursdienst staat onder leiding van een directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.50
  - number: 3.50.2
    text: 'Het bureau bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.50
  - number: 3.50.2.a
    text: de directie Management Development Consultancy (MDC);
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.50
  - number: 3.50.2.b
    text: de directie Management Development Consultancy (MDB).
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.50
  - number: 3.51.1
    text: De directie Management Development Consultancy staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.51
  - number: 3.51.2
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.51
  - number: 3.51.2.a
    text: |-
      het (door-) ontwikkelen en de uitvoering van het Management Development proces van vacaturevervulling, de ABD-
      schouw en loopbaanbegeleiding voor de Algemene Bestuursdienst in samenwerking met de departementen;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.51
  - number: 3.51.2.b
    text: het vervullen van het werkgeverschap voor de Topmanagementgroep;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.51
  - number: 3.51.2.c
    text: het aanbieden van interim posities en het vormgeven, ontwikkelen en uitvoeren van een managementpool.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.51
  - number: 3.52.1
    text: De directie Management Development Beleid staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.52
  - number: 3.52.2
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.52
  - number: 3.52.2.a
    text: |-
      het (door-)ontwikkelen en vormgeven van beleid voor de Algemene Bestuursdienst inclusief het beleid ten behoeve van
      het werkgeverschap voor de Topmanagementgroep;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.52
  - number: 3.52.2.b
    text: |-
      het (door-) ontwikkelen en (mede-) uitvoeren van Management Development instrumenten voor de Algemene
      Bestuursdienst;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.52
  - number: 3.52.2.c
    text: |-
      het voeren van regie ten behoeve van de uitvoering van Management Development beleid naar de onderdelen van het
      Rijk;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.52
  - number: 3.52.2.d
    text: het zorg dragen voor kennismanagement en de corporate communicatiefunctie;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.52
  - number: 3.52.2.e
    text: het ondersteunen van de directeur-generaal en het bureau door de uitvoering van staf- en beheerstaken.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.52
  - number: 3.53.1
    text: De inspectie Openbare Orde en Veiligheid staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.53
  - number: 3.53.2
    text: |-
      De inspectie heeft de taken, bedoeld in [artikel 53a van de Politiewet 1993][ref1] en
      [artikel 19 van de Brandweerwet 1985][ref2], [artikel 32 van de Wet op de LSOP en het politieonderwijs][ref3] en
      andere bij wet opgedragen taken.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel53a
      [ref2]: https://wetten.overheid.nl/BWBR0003764#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0014623#Artikel32
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel3.53
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: 53a
      - id: ref2
        bwb_id: BWBR0003764
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0014623
        artikel: '32'
  - number: 4.1.1
    text: |-
      De Secretaris-generaal is gemandateerd tot het nader vaststellen van de inrichting van de onder de directoraten-
      generaal, het Bureau Algemene Bestuursdienst, de Dienst Concernstaf en Bedrijfsvoering, de Algemene Inlichtingen-
      en Veiligheidsdienst en de Inspectie Openbare Orde en Veiligheid ressorterende dienstonderdelen;
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel4.1
  - number: 4.1.2
    text: |-
      Tot de taak van de directoraten-generaal, het Bureau Algemene Bestuursdienst, de Dienst Concernstaf en
      Bedrijfsvoering, de Algemene Inlichtingen- en Veiligheidsdienst en de Inspectie Openbare Orde en Veiligheid behoort
      voorts de uitvoering van andere taken dan hiervoor genoemd, in opdracht van een Minister of de Secretaris-generaal,
      voor zover hogere wet- en regelgeving zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel4.1
  - number: 4.1.3
    text: |-
      Tot de taak van de in dit besluit genoemde organisatieonderdelen, ressorterend onder de dienstonderdelen genoemd
      in het eerste lid, behoort voorts de uitvoering van andere taken dan vermeld, in opdracht van de Minister, de
      Secretaris-generaal of het diensthoofd, voor zover hogere wet- en regelgeving zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel4.1
  - number: 4.2.1
    text: |-
      De directeuren-generaal, het hoofd van het Bureau Algemene Bestuursdienst, de hoofddirecteur van de dienst
      Concernstaf en Bedrijifsvoering en het hoofd van de Inspectie Openbare Orde en Veiligheid stellen met inachtneming
      van dit besluit de inrichting van hun dienstonderdelen nader vast door vermelding van deze inrichting in het
      capaciteitsplan.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel4.2
  - number: 4.2.2
    text: |-
      In afwijking van het eerste lid stelt de Secretaris-generaal met inachtneming van dit besluit de inrichting van
      de Algemene Inlichtingen- en Veiligheidsdienst vast op voordracht van het hoofd van de Algemene Inlichtingen-
      en Veiligheidsdienst en na advisering van de directeur Personeel en Organisatie voor zover nodig nader vast bij
      schriftelijk besluit.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel4.2
  - number: 4.3.1
    text: De directeur Personeel en Organisatie is belast met het beheer van dit besluit.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel4.3
  - number: 4.3.2
    text: |-
      De Secretaris-generaal, de directeuren-generaal, het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst,
      de hoofddirecteur van de dienst Concernstaf en Bedrijfsvoering en het hoofd van de Inspectie Openbare Orde
      en Veiligheid, ieder voor zover het hem aangaat, zijn verantwoordelijk voor een juiste, volledige en tijdige
      aanlevering aan de directeur Personeel en Organisatie van de gegevens die een goed beheer van dit besluit mogelijk
      maken.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel4.3
  - number: 4.3.3
    text: |-
      Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel4.3
  - number: '4.4'
    text: |-
      Wijziging van dit besluit is voorbehouden aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties en
      geschiedt op voordracht van de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel4.4
  - number: '4.5'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na plaatsing van dit besluit in de Staatscourant en
      werkt terug tot en met 1 maart 2009.
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel4.5
  - number: '4.6'
    text: 'Dit besluit wordt aangehaald als: Organisatiebesluit BZK 2009.'
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel4.6
  - number: '4.7'
    text: |-
      Het [Organisatiebesluit BZK 2008][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0025266
    url: https://wetten.overheid.nl/BWBR0027412/2011-03-15#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0025266
