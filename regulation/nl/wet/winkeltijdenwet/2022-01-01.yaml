preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met maatschappelijke ontwikkelingen en met de behoefte
    aan vermindering en vereenvoudiging van regels wenselijk is de Winkelsluitingswet 1976 te vervangen door ruimere
    regels met betrekking tot de openingstijden van winkels en de tijden waarop goederen, anders dan in een winkel,
    bedrijfsmatig aan particulieren mogen worden te koop aangeboden of verkocht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007952/2022-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      goederen: roerende lichamelijke zaken, met uitzondering van binnenlandse en buitenlandse wettige betaalmiddelen;

      particulier: degene die een goed koopt anders dan in de uitoefening van een beroep of bedrijf;

      winkel: een voor het publiek toegankelijke besloten ruimte, waarin goederen aan particulieren plegen te worden
      verkocht.
    url: https://wetten.overheid.nl/BWBR0007952/2022-01-01#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden een winkel voor het publiek geopend te hebben:

      a. op zondag;

      b. op Nieuwjaarsdag, op Goede Vrijdag na 19 uur, op tweede Paasdag, op Hemelvaartsdag, op tweede Pinksterdag, op 24
      december na 19 uur, op eerste en tweede Kerstdag en op 4 mei na 19 uur;

      c. op werkdagen voor 6 uur en na 22 uur.

      2 Het is voorts verboden op de in het eerste lid bedoelde dagen en tijden in de uitoefening van een bedrijf,
      anders dan in een winkel, goederen te koop aan te bieden of te verkopen aan en in rechtstreekse aanraking met
      particulieren.
    url: https://wetten.overheid.nl/BWBR0007952/2022-01-01#Artikel2
  - number: '3'
    text: |-
      1 De gemeenteraad kan bij verordening vrijstelling verlenen van de in [artikel 2][ref1] vervatte verboden.

      2 De gemeenteraad kan bij verordening aan burgemeester en wethouders de bevoegdheid verlenen om in de gevallen,
      in de verordening aan te wijzen, en met inachtneming van de daarin gestelde regels op daartoe strekkend verzoek
      ontheffing van de in het eerste lid bedoelde verboden te verlenen.

      3 De vrijstellingen en ontheffingen kunnen onder beperkingen worden verleend. Aan de vrijstellingen en ontheffingen
      kunnen voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007952#Artikel2
    url: https://wetten.overheid.nl/BWBR0007952/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007952
        artikel: '2'
  - number: '6'
    text: |-
      1 Indien de eigenaar of beheerder van een winkel tot een kerkgenootschap behoort, dat de wekelijkse rustdag op
      een andere dag dan de zondag houdt, of te goeder trouw verklaart een godsdienst of levensovertuiging te belijden
      welke vordert, dat de wekelijkse rustdag op een andere dag dan de zondag wordt gehouden, verlenen burgemeester en
      wethouders op zijn verzoek ontheffing van het verbod van [artikel 2, eerste lid, onder a][ref1].

      2 Aan de ontheffing wordt het voorschrift verbonden dat de winkel op die andere dag gesloten dient te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007952#Artikel2
    url: https://wetten.overheid.nl/BWBR0007952/2022-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007952
        artikel: '2'
  - number: '8'
    text: |-
      1 Bij algemene maatregel van bestuur kan vrijstelling worden verleend van de in [artikel 2][ref1] vervatte verboden
      ten behoeve van:

      a. instellingen voor de volksgezondheid,

      b. het verkeer en het vervoer en

      c. de verkoop van nieuwsbladen en tijdschriften.

      2 De vrijstellingen kunnen onder beperkingen worden verleend. Aan de vrijstellingen kunnen voorschriften worden
      verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007952#Artikel2
    url: https://wetten.overheid.nl/BWBR0007952/2022-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007952
        artikel: '2'
  - number: '9'
    text: |-
      Verordeningen van de gemeenteraad kunnen geen betrekking hebben op de openingstijden van winkels op werkdagen
      tussen 6 uur en 22 uur.
    url: https://wetten.overheid.nl/BWBR0007952/2022-01-01#Artikel9
  - number: '10'
    text: |-
      1 Onverminderd de [artikelen 2][ref1], [3][ref2], [6][ref3] en [8][ref4], is een eenzijdige wijziging van
      openingstijden waarmee de eigenaar of beheerder van een winkel niet uitdrukkelijk heeft ingestemd op het moment van
      die wijziging, nietig ten aanzien van die eigenaar of beheerder.

      2 De nietigheid geldt voor eenzijdige wijzigingen die voor de datum van inwerkingtreding van het eerste lid aan de
      eigenaar of beheerder van een winkel bekend zijn gemaakt, vanaf die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0007952#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007952#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007952#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0007952#Artikel8
    url: https://wetten.overheid.nl/BWBR0007952/2022-01-01#Artikel10
