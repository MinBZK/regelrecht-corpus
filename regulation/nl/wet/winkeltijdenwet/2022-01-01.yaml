  - number: '11'
    text: De Winkelsluitingswet 1976 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007952/2022-01-01#Artikel11
  - number: '13'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007952/2022-01-01#Artikel13
  - number: '14'
    text: 'Deze wet wordt aangehaald als: Winkeltijdenwet.'
    url: https://wetten.overheid.nl/BWBR0007952/2022-01-01#Artikel14
