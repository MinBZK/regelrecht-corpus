$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: winkeltijdenwet
regulatory_layer: WET
publication_date: '2013-06-20'
valid_from: '2013-01-01'
bwb_id: BWBR0007952
url: https://wetten.overheid.nl/BWBR0007952/2013-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met maatschappelijke ontwikkelingen en met de behoefte
    aan vermindering en vereenvoudiging van regels wenselijk is de Winkelsluitingswet 1976 te vervangen door ruimere
    regels met betrekking tot de openingstijden van winkels en de tijden waarop goederen, anders dan in een winkel,
    bedrijfsmatig aan particulieren mogen worden te koop aangeboden of verkocht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: goederen: roerende lichamelijke zaken, met
      uitzondering van binnenlandse en buitenlandse wettige betaalmiddelen; particulier: degene die een goed koopt anders
      dan in de uitoefening van een beroep of bedrijf; winkel: een voor het publiek toegankelijke besloten ruimte, waarin
      goederen aan particulieren plegen te worden verkocht.
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel1
  - number: '2.1'
    text: 'Het is verboden een winkel voor het publiek geopend te hebben:'
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel2
  - number: 2.1.a
    text: op zondag;
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel2
  - number: 2.1.b
    text: |-
      op Nieuwjaarsdag, op Goede Vrijdag na 19 uur, op tweede Paasdag, op Hemelvaartsdag, op tweede Pinksterdag, op 24
      december na 19 uur, op eerste en tweede Kerstdag en op 4 mei na 19 uur;
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel2
  - number: 2.1.c
    text: op werkdagen voor 6 uur en na 22 uur.
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het is voorts verboden op de in het eerste lid bedoelde dagen en tijden in de uitoefening van een bedrijf,
      anders dan in een winkel, goederen te koop aan te bieden of te verkopen aan en in rechtstreekse aanraking met
      particulieren.
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel2
  - number: '3.1'
    text: |-
      De gemeenteraad kan voor ten hoogste twaalf door hem aan te wijzen dagen per kalenderjaar vrijstelling verlenen
      van de in [artikel 2][ref1] vervatte verboden, voor zover deze betrekking hebben op de zondag, Nieuwjaarsdag,
      tweede Paasdag, Hemelvaartsdag, tweede Pinksterdag en eerste of tweede Kerstdag. De beperking tot twaalf dagen per
      kalenderjaar geldt voor elk deel van de gemeente afzonderlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0007952#Artikel2
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007952
        artikel: '2'
  - number: '3.2'
    text: |-
      De gemeenteraad kan, al dan niet onder het stellen van regels, de in het eerste lid bedoelde bevoegdheid delegeren
      aan burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel3
  - number: '3.3'
    text: |-
      De gemeenteraad kan bij verordening vrijstelling verlenen van de in het eerste lid bedoelde verboden of aan
      burgemeester en wethouders de bevoegdheid verlenen om in de gevallen, in die verordening aan te wijzen, en met
      inachtneming van de daarin gestelde regels op een daartoe strekkende aanvraag ontheffing van die verboden te
      verlenen ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel3
  - number: 3.3.a
    text: |-
      op de betrokken gemeente of een deel daarvan gericht toerisme met een substantiële omvang, mits de
      aantrekkingskracht voor dat toerisme geheel of nagenoeg geheel is gelegen buiten de verkoopactiviteiten die door de
      vrijstelling of de bevoegdheid om ontheffing te verlenen mogelijk worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel3
  - number: 3.3.b
    text: |-
      grensoverschrijdend verkeer, mits de vrijstelling of ontheffing slechts betrekking heeft op handelingen die
      plaatsvinden in de nabijheid van grensovergangen langs daarop aansluitende doorgaande wegen.
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel3
  - number: '3.4'
    text: |-
      Voorts kan de gemeenteraad bij verordening aan burgemeester en wethouders de bevoegdheid verlenen op een
      daartoe strekkende aanvraag en met inachtneming van de in die verordening gestelde regels ontheffing te
      verlenen van de in [artikel 2, eerste lid, onder a en b][ref1], vervatte verboden, voor zover het winkels
      betreft die gesloten zijn op de in die verboden bedoelde dagen tussen 0 uur en 16 uur, en waar uitsluitend of
      hoofdzakelijk eet- en drinkwaren plegen te worden verkocht met uitzondering van sterke drank als bedoeld in
      [artikel 1, eerste lid, van de Drank- en Horecawet][ref2]. De verordening bepaalt in ieder geval het aantal winkels
      waarvoor in de gemeente ontheffing kan worden verleend. Dit aantal kan ten hoogste één winkel per 15 000 inwoners
      van de gemeente zijn of, indien het inwonertal lager is dan 15 000, één winkel.


      [ref1]: https://wetten.overheid.nl/BWBR0007952#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel1
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007952
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002458
        artikel: '1'
  - number: '3.5'
    text: |-
      De vrijstellingen en ontheffingen kunnen onder beperkingen worden verleend. Aan de vrijstellingen en ontheffingen
      kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel3
  - number: '3.6'
    text: |-
      De gemeenteraad betrekt bij een besluit op grond van het derde lid, onder a, tot de verlening van een vrijstelling
      onderscheidenlijk de toekenning van een bevoegdheid om ontheffing te verlenen in ieder geval de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel3
  - number: 3.6.a
    text: |-
      werkgelegenheid en economische bedrijvigheid in de gemeente, waaronder mede wordt begrepen het belang van
      winkeliers met weinig of geen personeel en van winkelpersoneel,
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel3
  - number: 3.6.b
    text: de zondagsrust in de gemeente,
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel3
  - number: 3.6.c
    text: de leefbaarheid, de veiligheid en de openbare orde in de gemeente.
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel3
  - number: '3.7'
    text: |-
      Een besluit als bedoeld in het derde lid, onder a, gaat vergezeld van een toelichting. Onverminderd de
      [artikelen 3:46][ref1] en [3:47, eerste en tweede lid, van de Algemene wet bestuursrecht][ref2], bevat de
      toelichting ten minste een motivering dat wordt voldaan aan de voorwaarden die in het derde lid, onder a, worden
      gesteld aan de toepassing van de bevoegdheid tot het verlenen van vrijstelling onderscheidenlijk het toekennen van
      een ontheffingsbevoegdheid. De toelichting beschrijft tevens de belangen, waaronder in ieder geval de in het zesde
      lid genoemde, die in de besluitvorming zijn betrokken, alsmede een motivering op welke wijze die belangen in de
      besluitvorming zijn betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '3.8'
    text: |-
      Het zesde en zevende lid, derde volzin, zijn van overeenkomstige toepassing op een besluit van burgemeester en
      wethouders tot verlening van een ontheffing op grond van een hen op grond van het derde lid, onder a, toegekende
      bevoegdheid om ontheffing te verlenen.
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel3
  - number: '4.1'
    text: |-
      Burgemeester en wethouders kunnen vrijstelling van de in [artikel 2][ref1] vervatte verboden, voor zover deze
      betrekking hebben op de zondag, Nieuwjaarsdag, tweede Paasdag, Hemelvaartsdag, tweede Pinksterdag en eerste of
      tweede Kerstdag, verlenen op grond van plotseling opkomende bijzondere omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0007952#Artikel2
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007952
        artikel: '2'
  - number: '4.2'
    text: |-
      Zij kunnen in door de gemeenteraad bij verordening aangewezen gevallen ontheffing verlenen van de in het eerste
      lid bedoelde verboden ten behoeve van bijzondere gelegenheden van tijdelijke aard en ten behoeve van het uitstallen
      van goederen.
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel4
  - number: '4.3'
    text: |-
      De vrijstellingen en ontheffingen kunnen onder beperkingen worden verleend. Aan de vrijstellingen en ontheffingen
      kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel4
  - number: '5.1'
    text: |-
      Bij algemene maatregel van bestuur kan vrijstelling van de in [artikel 2][ref1] vervatte verboden voor zover deze
      betrekking hebben op de zondag, Nieuwjaarsdag, tweede Paasdag, Hemelvaartsdag, tweede Pinksterdag en eerste of
      tweede Kerstdag worden verleend. Bij een zodanige maatregel kan de gemeenteraad de bevoegdheid worden verleend om,
      indien naar zijn oordeel plaatselijke omstandigheden daartoe aanleiding geven, bij verordening te bepalen dat een
      vrijstelling voor de betrokken gemeente of een of meer delen daarvan niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0007952#Artikel2
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007952
        artikel: '2'
  - number: '5.2'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, kan aan burgemeester en wethouders de bevoegdheid
      worden verleend om met inachtneming van de in die maatregel gestelde regels in aanvulling op een vrijstelling op
      een daartoe strekkende aanvraag ontheffing te verlenen van de in het eerste lid bedoelde verboden.
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel5
  - number: '5.3'
    text: |-
      De vrijstellingen en ontheffingen kunnen onder beperkingen worden verleend. Aan de vrijstellingen en ontheffingen
      kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel5
  - number: '6.1'
    text: |-
      Indien de eigenaar of beheerder van een winkel tot een kerkgenootschap behoort, dat de wekelijkse rustdag op
      een andere dag dan de zondag houdt, of te goeder trouw verklaart een godsdienst of levensovertuiging te belijden
      welke vordert, dat de wekelijkse rustdag op een andere dag dan de zondag wordt gehouden, verlenen burgemeester en
      wethouders op zijn verzoek ontheffing van het verbod van [artikel 2, eerste lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007952#Artikel2
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007952
        artikel: '2'
  - number: '6.2'
    text: Aan de ontheffing wordt het voorschrift verbonden dat de winkel op die andere dag gesloten dient te zijn.
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel6
  - number: '7.1'
    text: |-
      De gemeenteraad kan bij verordening vrijstelling verlenen van de in [artikel 2][ref1] vervatte verboden, voor zover
      deze betrekking hebben op werkdagen.


      [ref1]: https://wetten.overheid.nl/BWBR0007952#Artikel2
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007952
        artikel: '2'
  - number: '7.2'
    text: |-
      De gemeenteraad kan bij verordening aan burgemeester en wethouders de bevoegdheid verlenen om, met inachtneming van
      de in die verordening te stellen regels, vrijstelling en op een daartoe strekkende aanvraag ontheffing van de in
      het eerste lid bedoelde verboden te verlenen.
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel7
  - number: '7.3'
    text: |-
      De vrijstellingen en ontheffingen kunnen onder beperkingen worden verleend. Aan de vrijstellingen en ontheffingen
      kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel7
  - number: '8.1'
    text: |-
      Bij algemene maatregel van bestuur kan vrijstelling worden verleend van de in [artikel 2][ref1] vervatte verboden,
      voor zover deze betrekking hebben op werkdagen, ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0007952#Artikel2
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007952
        artikel: '2'
  - number: 8.1.a
    text: instellingen voor de volksgezondheid,
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel8
  - number: 8.1.b
    text: het verkeer en het vervoer en
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel8
  - number: 8.1.c
    text: de verkoop van nieuwsbladen en tijdschriften.
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel8
  - number: '8.2'
    text: |-
      De vrijstellingen kunnen onder beperkingen worden verleend. Aan de vrijstellingen kunnen voorschriften worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel8
  - number: '9'
    text: |-
      Verordeningen van de gemeenteraad kunnen geen betrekking hebben op de openingstijden van winkels op werkdagen
      tussen 6 uur en 22 uur.
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel9
  - number: '11'
    text: De Winkelsluitingswet 1976 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel11
  - number: '13'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel13
  - number: '14'
    text: 'Deze wet wordt aangehaald als: Winkeltijdenwet.'
    url: https://wetten.overheid.nl/BWBR0007952/2013-01-01#Artikel14
