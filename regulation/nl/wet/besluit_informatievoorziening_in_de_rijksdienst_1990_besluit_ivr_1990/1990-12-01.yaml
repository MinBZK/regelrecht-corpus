---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_informatievoorziening_in_de_rijksdienst_1990_besluit_ivr_1990
regulatory_layer: WET
publication_date: '1991-01-29'
valid_from: '1990-12-01'
bwb_id: BWBR0004976
url: https://wetten.overheid.nl/BWBR0004976/1990-12-01
preamble:
  text: |-
    Overwegende, dat het wenselijk is de regels voor de informatievoorziening in de rijksdienst te actualiseren
    alsmede, dat de behoefte bestaat tot betere inhoudelijke sturing te komen van de informatievoorziening;

    Gezien de notitie Informatievoorziening Openbare Sector (Tweede Kamer, 1987–1988, 20 644, nrs. 1–2);

    Handelend in overeenstemming met het gevoelen van de ministerraad;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De rijksdienst draagt, voor zover mogelijk, zorg voor de inrichting van de informatievoorziening in de openbare
      sector op grond van de beginselen, die in de [artikelen 2][ref1], [3][ref2] en [4][ref3] van dit besluit zijn
      vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004976#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004976#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0004976#Artikel4
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004976
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004976
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0004976
        artikel: '4'
  - number: '2'
    text: |-
      Het waarnemen, vastleggen, verzamelen, verwerken, verstrekken en gebruiken van informatie geschiedt uitsluitend
      voor zover een goede vervulling van de taak daartoe noodzaakt.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel2
  - number: '3.1'
    text: |-
      Informatie over individuele objecten berust zo veel mogelijk op rechtstreeks waarnemen en op inlichtingen van
      betrokkenen.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel3
  - number: '3.2'
    text: |-
      Het verkrijgen van informatie over individuele objecten uit een informatie-systeem geschiedt zo veel mogelijk in
      rechtstreeks contact tussen de verkrijger en de verstrekker, volgens eenvoudige en doorzichtige procedures.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel3
  - number: '3.3'
    text: Waar mogelijk wordt informatie over individuele objecten verkregen uit een basisregistratie.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel3
  - number: '3.4'
    text: |-
      Het waarnemen, vastleggen, verzamelen, verwerken, verstrekken en gebruiken van informatie over individuele objecten
      geschiedt op locaal niveau of anderszins op een zo laag mogelijk niveau.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel3
  - number: '3.5'
    text: |-
      Het leggen van verbanden tussen informatie over individuele objecten in verschillende informatiesystemen vindt
      plaats voor het vervullen van specifieke, formeel toegewezen taken en op grond van duidelijke, schriftelijk
      vastgelegde regels.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel3
  - number: '3.6'
    text: |-
      Het meervoudig vastleggen, verzamelen, verwerken en verstrekken van informatie over individuele objecten wordt zo
      veel mogelijk vermeden.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel3
  - number: '4.1'
    text: |-
      Gebruik en exploitatie van een informatiesysteem (informatiebeheer) wordt gedecentraliseerd in overeenstemming met
      de decentralisatie van de uitvoering van taken waarvoor informatie nodig is.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel4
  - number: '4.2'
    text: |-
      Informatiebeheer wordt, voor zover doelmatig, gedeconcentreerd in overeenstemming met de deconcentratie van de
      uitvoering van taken.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel4
  - number: '4.3'
    text: |-
      Bij decentraal of gedeconcentreerd informatiebeheer berust de verantwoordelijkheid voor ontwikkeling en onderhoud
      van een informatiesysteem (systeembeheer) op adequaat centraal niveau.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel4
  - number: '5'
    text: |-
      De minister van Binnenlandse Zaken heeft de verantwoordelijkheid voor de coördinatie op het gebied van de
      informatievoorziening in de openbare sector als geheel.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel5
  - number: '6.1'
    text: |-
      De volgende ministers zijn eerstverantwoordelijk voor de hierna te noemen deelgebieden van de
      informatievoorziening: '- de minister van Binnenlandse Zaken: brandweer en rampenbestrijding, documentaire'
      overheidsinformatie, interbestuurlijke financiële informatie, personeelsinformatie, persoonsinformatie;
        - de minister van Binnenlandse Zaken en de minister van Justitie: politiële informatie;
        - de minister van Justitie: justitiële informatie;
        - de minister van Economische Zaken: (internationaal) handelsverkeer, maatschappelijke objecten, statistische
      informatie;
        - de minister van Financiën: financiële informatie in de rijksdienst;
        - de minister van Onderwijs en Wetenschappen: onderwijs en wetenschappen;
        - de minister van Onderwijs en Wetenschappen en de minister van Welzijn, Volksgezondheid en Cultuur: documentaire
      objecten;
        - de minister van Sociale Zaken en Werkgelegenheid: sociale zekerheid;
        - de minister van Verkeer en Waterstaat: voer- en vaartuigen;
        - de minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer: milieubeheer, vastgoedinformatie;
        - de minister van Welzijn, Volksgezondheid en Cultuur: culturele objecten, gezondheidszorg, welzijn.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel6
  - number: '6.2'
    text: |-
      De in het eerste lid genoemde ministers bevorderen de instelling van zo mogelijk één adviesorgaan voor het
      deelgebied dan wel de deelgebieden van de informatievoorziening, waarvoor zij eerstverantwoordelijk zijn. Het
      adviesorgaan kan de verantwoordelijke minister desgevraagd of uit eigen beweging van advies dienen.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel6
  - number: '6.3'
    text: |-
      De in het eerste lid genoemde ministers stellen voor het desbetreffende deelgebied van de informatievoorziening een
      structuurschets op. Zij stellen de structuurschets bij als de ontwikkelingen op dit deelgebied daartoe aanleiding
      geven. De opgestelde of bijgestelde structuurschets wordt door de ministerraad vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel6
  - number: '7.1'
    text: |-
      Bij een voorstel van wet of van een andere regeling, voor de uitvoering waarvan de beschikbaarheid van informatie
      van essentiële betekenis is, dient in de bijbehorende toelichting steeds in een afzonderlijk onderdeel aan de
      informatievoorziening aandacht te worden besteed.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel7
  - number: '7.2'
    text: |-
      Over een onderdeel van de toelichting als bedoeld in het eerste lid wordt tijdig overleg gevoerd met de
      minister die overeenkomstig [artikel 6][ref1] van dit besluit is aangewezen als eerstverantwoordelijke voor het
      desbetreffende deelgebied van de informatievoorziening. De minister van Binnenlandse Zaken wordt, indien een
      andere minister als eerstverantwoordelijke minister is aangewezen, in de gelegenheid gesteld aan dit overleg deel
      te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0004976#Artikel6
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004976
        artikel: '6'
  - number: '7.3'
    text: |-
      Indien in een voorstel van wet of van een andere regeling bepalingen worden opgenomen, welke een deelgebied van de
      informatievoorziening raken waarvoor overeenkomstig [artikel 6][ref1] van dit besluit een eerstverantwoordelijke
      minister is aangewezen, vindt tijdig overleg met deze minister plaats. De minister van Binnenlandse Zaken wordt,
      indien een andere minister als eerstverantwoordelijke minister is aangewezen, in de gelegenheid gesteld aan dit
      overleg deel te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0004976#Artikel6
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004976
        artikel: '6'
  - number: '7.4'
    text: |-
      In de gevallen waarin de voor de uitvoering van de wet of regeling noodzakelijke informatievoorziening geen
      betrekking heeft op één van de deelgebieden van de informatievoorziening, waarvoor een eerstverantwoordelijke
      minister overeenkomstig [artikel 6][ref1] van dit besluit is aangewezen, vindt over de in de voorgaande leden
      bedoelde bepalingen of onderdelen van de toelichting tijdig overleg plaats met de minister van Binnenlandse Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0004976#Artikel6
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004976
        artikel: '6'
  - number: '8'
    text: |-
      De minister van Binnenlandse Zaken doet voorstellen aan de ministerraad en in voorkomende gevallen aan andere
      organen binnen de openbare sector om een doelmatige en doeltreffende inrichting van de informatievoorziening in de
      openbare sector te bevorderen.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel8
  - number: '9'
    text: |-
      De minister van Binnenlandse Zaken kan nadere aanbevelingen opstellen voor de informatievoorziening in de
      rijksdienst. Dergelijke aanbevelingen worden vastgesteld in overeenstemming met het gevoelen van de ministerraad.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel9
  - number: '10'
    text: |-
      De afzonderlijke ministers dragen zorg voor het tot stand komen van meerjareninformatieplannen ten behoeve van een
      systematische planning van de voorgenomen activiteiten op het gebied van de informatievoorziening binnen de eigen
      ministeries.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel10
  - number: '11'
    text: |-
      Een meerjareninformatieplan dat relevant is vanuit het oogpunt van de algemene coördinatie op het terrein van
      de overheidsinformatievoorziening wordt aan de minister van Binnenlandse Zaken toegezonden. De minister van
      Binnenlandse Zaken zal zo nodig zijn commentaar op het plan aan de betrokken minister doen toekomen.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel11
  - number: '12.1'
    text: |-
      Voordat een geautomatiseerd informatiesysteem wordt ontwikkeld, ingevoerd of gewijzigd, waarbij aanzienlijke
      risico's bestaan, laat de minister wie het aangaat een onafhankelijke contra-expertise verrichten.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel12
  - number: '12.2'
    text: |-
      De minister van Binnenlandse Zaken kan in overeenstemming met het gevoelen van de ministerraad nadere aanbevelingen
      opstellen omtrent de inhoud en de uitvoering van contra-expertises.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel12
  - number: '13.1'
    text: |-
      Aan een gemeentebestuur kan slechts de verplichting tot verstrekking van systematische informatie aan de minister
      wie het aangaat worden opgelegd, voor zover bij de wet of krachtens de wet bij algemene maatregel van bestuur
      daarin is voorzien.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel13
  - number: '13.2'
    text: |-
      Gemeentebesturen kunnen slechts worden verplicht tot het verstrekken van gegevens ten behoeve van statistische
      doeleinden aan het Centraal Bureau voor de Statistiek, voor zover daarin is voorzien bij de wet of krachtens de
      wet bij algemene maatregel van bestuur op voordracht van de minister van Economische Zaken. Een voordracht voor een
      algemene maatregel van bestuur als bedoeld in de eerste volzin wordt niet gedaan dan na overleg met de minister van
      Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel13
  - number: '13.3'
    text: |-
      De minister wie het aangaat draagt, na overleg met de minister van Binnenlandse Zaken, zorg dat in een regeling
      van de verstrekking als bedoeld in het eerste en tweede lid wordt aangegeven hoe de financiële gevolgen van de
      verplichting tot informatieverstrekking worden gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel13
  - number: '14.1'
    text: |-
      De minister wie het aangaat kan een gemeentebestuur slechts verplichten tot het verstrekken van systematische
      informatie aan het provinciaal bestuur, voor zover bij de wet of krachtens de wet bij algemene maatregel van
      bestuur daarin is voorzien.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel14
  - number: '14.2'
    text: |-
      De minister wie het aangaat draagt, na overleg met de minister van Binnenlandse Zaken, zorg dat in de regeling van
      een verstrekking als bedoeld in het eerste lid wordt aangegeven hoe de financiële gevolgen van de verplichting tot
      informatieverstrekking voor de gemeente worden gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel14
  - number: '15.1'
    text: |-
      Aan een provinciaal bestuur kan slechts de verplichting tot verstrekking van systematische informatie aan de
      minister wie het aangaat worden opgelegd, voor zover bij de wet of krachtens de wet bij algemene maatregel van
      bestuur daarin is voorzien.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel15
  - number: '15.2'
    text: |-
      Provinciale besturen kunnen slechts worden verplicht tot het verstrekken van gegevens ten behoeve van statistische
      doeleinden aan het Centraal Bureau voor de Statistiek, voor zover daarin is voorzien bij de wet of krachtens de
      wet bij algemene maatregel van bestuur op voordracht van de minister van Economische Zaken. Een voordracht voor een
      algemene maatregel van bestuur als bedoeld in de eerste volzin wordt niet gedaan dan na overleg met de minister van
      Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel15
  - number: '15.3'
    text: |-
      De minister wie het aangaat draagt, na overleg met de minister van Binnenlandse Zaken, zorg dat in de regeling
      van een verstrekking als bedoeld in het eerste en tweede lid wordt aangegeven hoe de financiële gevolgen van de
      verplichting tot informatieverstrekking worden gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel15
  - number: '16.1'
    text: |-
      Jaarlijks rapporteren de ministers aan de Tweede Kamer over de stand van zaken en de ontwikkelingen op het gebied
      van de informatievoorziening.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel16
  - number: '16.2'
    text: |-
      De minister van Binnenlandse Zaken rapporteert jaarlijks in overeenstemming met het gevoelen van de ministerraad
      aan de Tweede Kamer over de uitvoering van dit besluit en over de overheidsinformatievoorziening in het algemeen.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel16
  - number: '17.1'
    text: |-
      Het Besluit Informatievoorziening in de Rijksdienst van 30 december 1980 (Staatscourant 1981, nr. 9) wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel17
  - number: '17.2'
    text: Dit besluit treedt in werking met ingang van 1 december 1990.
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel17
  - number: '17.3'
    text: Dit besluit kan worden aangehaald als het Besluit informatievoorziening in de rijksdienst 1990 (Besluit IVR 1990).
    url: https://wetten.overheid.nl/BWBR0004976/1990-12-01#Artikel17
