$id: technische_voorschriften_lieren_sleepautos_en_sleepkabels
regulatory_layer: WET
publication_date: '2011-03-07'
valid_from: '1998-04-01'
bwb_id: BWBR0004853
url: https://wetten.overheid.nl/BWBR0004853/1998-04-01
preamble:
  text: |-
    Gelet op artikel 117 van de Regeling Toezicht Luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze voorschriften wordt verstaan onder:

            a
            Lier:

              een installatie, ingericht voor het doen opstijgen van een zweefvliegtuig door middel van een sleepkabel,
      welke installatie tijdens de opstijging van het zweefvliegtuig niet van standplaats verandert en de kabel op een
      daartoe bestemde kabeltrommel wikkelt.



            b
            Sleepauto:

              een zichzelf (door middel van een krachtwerktuig) voortbewegend voertuig, ingericht voor het doen opstijgen
      van een zweefvliegtuig door middel van een sleepkabel, dat zich tijdens de opstijging van het zweefvliegtuig
      in de startrichting voortbeweegt en waarbij tussen voertuig en zweefvliegtuig de volle lengte van de sleepkabel
      beschikbaar blijft;



            c
            Sleepkabel:

              het geheel van onderdelen, dat de verbinding vormt tussen de sleephaak van het zweefvliegtuig en een lier
      onderscheidenlijk een sleepauto;



            d
            Breukstuk:

              een onderdeel van een sleepkabel, dat bij een van tevoren vastgestelde belasting bezwijkt, waardoor de
      verbinding tussen het zweefvliegtuig en de lier onderscheidenlijk de sleepauto wordt verbroken;



            e
            Lierman:

              de persoon, die verantwoordelijk is voor de bediening van de lier;



            f
            Startman:

              de persoon, die verantwoordelijk is voor de gang van zaken bij het doen opstijgen van een zweefvliegtuig
      door middel van een sleepauto.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel1
  - number: '2.1'
    text: 'Een lier moet omvatten:'
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel2
  - number: 2.1.a
    text: |-
      een liermechanisme, omvattende de krachtbron, de kabeltrommel en het overbrengingsmechanisme tussen de krachtbron
      en de kabeltrommel;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel2
  - number: 2.1.b
    text: een inrichting voor het doorsnijden of kappen van de kabel, hierna te noemen ‘kap-inrichting’;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel2
  - number: 2.1.c
    text: een inrichting voor het geleiden van de kabel naar de kabeltrommel, hierna te noemen ‘kabelgeleiding’;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel2
  - number: 2.1.d
    text: instrumenten voor controle van de goede werking van de krachtbron en voor controle van het sleepproces;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel2
  - number: 2.1.e
    text: |-
      afschermende delen, welke het bedieningspersoneel beschermen tegen mogelijke gevaren, welke aan het verblijf op of
      nabij de lier zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel2
  - number: 2.1.f
    text: |-
      een inrichting, waarmede verhinderd wordt, dat de lier tijdens het gebruik zodanig van stand verandert, dat
      daardoor de veiligheid in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel2
  - number: '2.2'
    text: |-
      De constructie van de lier alsmede van de daarop aangebrachte installaties moet voldoende sterkte en stijfheid
      bezitten om de daarop uitgeoefende krachten zonder ontoelaatbare vervorming te kunnen opnemen.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel2
  - number: '2.3'
    text: |-
      Bij gebruik van de lier mogen geen schokken of trillingen optreden, welke de goede werking van de lier of enig
      onderdeel daarvan zouden kunnen benadelen dan wel schade aan de sleepkabel zouden kunnen veroorzaken.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel2
  - number: '2.4'
    text: |-
      De lierman moet zodanig op of nabij de lier zijn opgesteld, dat hij een voldoend, voor zover mogelijk onbeperkt,
      uitzicht naar alle zijden heeft en dat hij het zweefvliegtuig tijdens het lieren gemakkelijk kan waarnemen.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel2
  - number: '3.1'
    text: |-
      Het remvermogen van de krachtbron moet voor het lieren van een zweefvliegtuig met één zitplaats tenminste 60 pk en
      voor het lieren van een zweefvliegtuig met twee zitplaatsen tenminste 90 pk bedragen. Dit vermogen moet geleverd
      worden in het gebied van de toerentallen, welke bij het lieren worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel3
  - number: '3.2'
    text: |-
      Bij een windsnelheid van 0 m/sec moet met elk type zweefvliegtuig, waarvoor de lier bestemd is, een kabelsnelheid
      kunnen worden bereikt van tenminste 1,2 maal de minimale vliegsnelheid van het zweefvliegtuig.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel3
  - number: '3.3'
    text: De kabeltrommel moet door middel van een betrouwbre  rem snel tot stilstand gebracht kunnen worden.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel3
  - number: '3.4'
    text: |-
      Tussen krachtbron en kabeltrommel moet een zodanige koppeling zijn aangebracht, dat de kabeltrommel onafhankelijk
      van de krachtbron kan draaien zonder daarbij op enige wijze door de krachtbron te worden beïnvloed.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel3
  - number: '3.5'
    text: |-
      Indien de kabeltrommel op een zodanige plaats en wijze is aangebracht, dat deze tijdens het transport van de lier
      beschadigd kan worden, moet de kabeltrommel gemakkelijk afneembaar zijn.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel3
  - number: '3.6'
    text: |-
      De kabeltrommel moet een diameter van tenminste 600 maal de diameter van de afzonderlijke draden van de kabel
      bezitten.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel3
  - number: '3.7'
    text: |-
      De kabeltrommel moet aan beide zijden van randen zijn voorzien. Voor elk type zweefvliegtuig, waarvoor de lier
      bestemd is, moet de kabeltrommel de in [artikel 16, tweede lid, onder a][ref1]. voorgeschreven kabel kunnen
      bevatten en wel zodanig, dat tijdens het bedrijf van de lier de randen steeds 5 cm uitsteken boven de op de trommel
      gewikkelde kabel. De vorm van deze randen moet zodanig zijn, dat tijdens het bedrijf de kabel niet beschadigd kan
      worden en dat het gevaar van afspringen van de kabelwindingen zoveel mogelijk wordt voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004853#Artikel16
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004853
        artikel: '16'
        hoofdstuk: IV
  - number: '3.8'
    text: |-
      De krachtbron en de daarbij behorende installaties en onderdelen, zoals brandstoftanks, carburateur,
      radiator enz., moeten zodanig zijn opgesteld en in zodanige staat verkeren, dat zij onder alle te verwachten
      bedrijfsomstandigheden zonder storing en regelmatig werken.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel3
  - number: '4.1'
    text: 'De kapinrichting moet zodanig zijn uitgevoerd, dat:'
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel4
  - number: 4.1.a
    text: de kabel onder alle omstandigheden snel geheel kan worden doorgesneden;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel4
  - number: 4.1.b
    text: |-
      Na het doorsnijden de kabel niet verward of geklemd kan raken tussen delen van de kapinrichting of andere delen van
      de lier;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel4
  - number: 4.1.c
    text: tijdens het doorsnijden van de kabel het bedieningspersoneel geen gevaar loopt.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel4
  - number: '4.2'
    text: |-
      Het is wenselijk, dat het doorsnijden van de kabel zodanig geschiedt, dat het ene deel van de kabel ten opzichte
      van het andere deel wordt afgeschoven.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel4
  - number: '4.3'
    text: |-
      Indien een bedrijfsklare kapinrichting zodanig geblokkeerd kan worden dat zonder gevaar voor lichamelijk letsel
      werkzaamheden aan en in de naaste omgeving van de kapinrichting kunnen plaatsvinden, moet de lierman vanaf zijn
      stand- of zitplaats onmiddellijk en duidelijk kunnen waarnemen of de kapinrichting al dan niet geblokkeerd is.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel4
  - number: '4.4'
    text: |-
      De in rust zijnde, gespannen kabel moet zich onder alle voorkomende omstandigheden ten opzichte van enig deel van
      de kapinrichting op een afstand van tenminste 5 mm bevinden. In het bijzonder moeten de snijkanten van die delen,
      welke de kabel moeten doorsnijden, afdoende beschermd zijn tegen aanraking door de kabel, behalve in het geval, dat
      de kapinrichting in werking wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel4
  - number: '4.5'
    text: |-
      De lierman moet de kapinrichting vanaf zijn stand- of zitplaats gemakkelijk en snel in werking kunnen stellen. De
      kracht welke daartoe door de lierman op de bedieningshefboom moet worden uitgeoefend, mag niet meer dan 15 kg (150
      N) bedragen. De slag van de bedieningshefboom mag ten hoogste 30 cm bedragen. De veiligheidsfactor tegen blijvende
      vervorming, welke bij de sterkteberekening van de bedieningsinrichting gebruikt moet zijn, bedraagt 6.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel4
  - number: '4.6'
    text: |-
      De kapinrichting moet geschikt zijn voor de te gebruiken sleepkabel, hetgeen moet worden aangetoond met de
      volgende proeven. Met de kapinrichting worden 5 achtereenvolgende snijproeven genomen. Bij elke snijproef moet een
      proefstuk, als hieronder omschreven, geheel worden doorgesneden, terwijl steeds dezelfde gedeelten van de snijdende
      delen met het proefstuk in aanraking zijn. Het proefstuk moet bestaan uit 3 tegen elkaar liggende kabels, elk met
      een diameter gelijk aan:
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel4
  - number: 4.6.a
    text: 4 mm, indien de diameter van de te gebruiken sleepkabel 4 mm of minder bedraagt of;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel4
  - number: 4.6.b
    text: |-
      de diameter van de te gebruiken sleepkabel, indien deze meer dan 4 mm bedraagt. Het materiaal van het proefstuk
      moet gelijk zijn of gelijkwaardig zijn aan het materiaal, waaruit een kabel wordt vervaardigd. Na afloop
      van de proeven mag geen onderdeel enige blijvende vervorming te zien geven en mogen de snijdende delen geen
      noemenswaardige slijtage vertonen.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel4
  - number: '4.7'
    text: |-
      Indien de stand van de kapinrichting tijdens het bedrijf van de lier kan veranderen als gevolg van de verandering
      van trekrichting van de kabel, moet de goede werking van de kapinrichting en de bedieningsinrichting daarvan in
      alle te verwachten standen kunnen worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel4
  - number: '5.1'
    text: De kabelgeleiding moet zodanig zijn geconstrueerd, dat
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel5
  - number: 5.1.a
    text: de kabel niet in aanraking kan komen met delen van de lier, welke niet daarvoor bestemd zijn;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel5
  - number: 5.1.b
    text: de kabel niet beklemd kan raken;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel5
  - number: 5.1.c
    text: |-
      de kabel zich bij een doelmatige opstelling van de lier met het vrije einde onbelemmerd kan bewegen binnen de
      ruimte van de hierna omschreven viervlakshoek (zie bijlage A). Het hoekpunt van de bedoelde viervlakshoek wordt
      gevormd door het invoerpunt van de horizontaal gehouden kabel in de kabelgeleiding. Een zijde ligt in een verticaal
      vlak, evenwijdig met de as van de kabeltrommel. De ribben, welke aan deze zijde grenzen, sluiten een hoek van
      20 graden in. De verticale zijde sluit met zijn overstaande een standhoek van 100 graden in. De ribben welke aan
      deze overstaande zijde grenzen, sluiten een hoek van 70 graden in. De bedoelde standhoek ligt in een standvlak,
      dat evenwijdig loopt aan of ligt in het vlak, dat door de bissectrices van de hoeken tussen de ribben van
      respectievelijk de verticale zijde en zijn overstaande zijde kan worden gedacht.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel5
  - number: '5.2'
    text: |-
      Draaiende delen van de kabelgeleiding moeten onder alle omstandigheden gemakkelijk en zonder slingering kunnen
      draaien.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel5
  - number: '5.3'
    text: 'Ten aanzien van geleiderollen of geleideschijven geldt:'
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel5
  - number: 5.3.a
    text: |-
      De geleiderollen of schijven, welke de kabel in het verticale vlak geleiden, moeten gedurende het wikkelen van de
      kabel op de kabeltrommel door de kabel worden aangedreven;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel5
  - number: 5.3.b
    text: |-
      Indien tijdens de opstijging de kabel de geleiderollen of -schijven over een boog van tenminste 60 graden
      raakt, moet de diameter van deze rollen of schijven tenminste 300 maal de diameter van de afzonderlijke draden
      van de kabel bedragen. De geleiderollen of -schijven moeten tenminste een middellijn van 8 cm bezitten. Bij
      geleideschijven wordt de middellijn in de groef gemeten.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel5
  - number: 5.3.c
    text: |-
      Indien bij geleiderollen de kabel tijdens de opstijging loodrecht op de draairichting van de rol langs de rol kan
      verschuiven, mogen in de oppervlakte van de rol geen groeven voorkomen, welke een grotere diepte hebben dan ¼ van
      de diameter van de kabel.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel5
  - number: '5.4'
    text: |-
      Het regelmatig verdelen van de kabel op de kabeltrommel tijdens het lieren moet op zodanige wijze geschieden, dat
      de lierman hiermede geen bemoeienis heeft.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel5
  - number: '6.1'
    text: |-
      De lier moet zijn uitgerust met instrumenten, welke een goede beoordeling van de werking van de krachtbron mogelijk
      maken.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel6
  - number: '6.2'
    text: |-
      De schalen van de instrumenten moeten overzichtelijk zijn ingedeeld en door de lierman vanaf zijn stand- of
      zitplaats gemakkelijk afgelezen kunnen worden. Op de schalen moeten de met betrekking tot de lier en de sleepkabel
      maximaal toelaatbare en andere mogelijke belangrijke waarden of gebieden duidelijk zijn gemarkeerd.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel6
  - number: '6.3'
    text: |-
      Het is wenselijk, dat de lier wordt uitgerust met instrumenten, welke de grootte van de trekkracht in de sleepkabel
      en de werkelijke kabelsnelheid aangeven.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel6
  - number: '7.1'
    text: |-
      De bedieningsorganen omvatten alle hefbomen, schakelaars, knoppen, enz., welke door de lierman bediend moeten
      worden voor de bediening van de lier en de daarop aangebrachte installaties.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel7
  - number: '7.2'
    text: |-
      De bedieningsorganen moeten zodanig zijn opgesteld ten opzichte van de stand- of zitplaats van de lierman, dat de
      volle uitslag van elk van die organen gemakkelijk kan worden bereikt, ongehinderd door constructiedelen van de lier
      of door de kleding van de lierman.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel7
  - number: '7.3'
    text: |-
      De bedieningsorganen moeten zodanig zijn uitgevoerd of opgesteld, dat zij geen aanleiding tot verwisseling kunnen
      geven.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel7
  - number: '7.4'
    text: |-
      De bedieningsrinrichtingen moeten zodanig zijn ontworpen en uitgevoerd, dat in de war raken van kabels, schuren
      en slingeren van kabels, kettingen of stootstangen tegen enig deel van de lier alsmede beïnvloeding door
      bedieningspersoneel of losse voorwerpen hoogst onwaarschijnlijk is. Kabels of kettingen moeten tegen aflopen of
      afvallen geborgd zijn.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel7
  - number: '7.5'
    text: |-
      De uitslagen van de bedieningsorganen bij de lierman moeten begrensd zijn door deugdelijke aanslagen. Deze
      aanslagen moeten de belastingen kunnen opnemen, waarvoor het betrokken bedieningsorgaan is ontworpen.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel7
  - number: '7.6'
    text: De bedieningsorganen mogen niet van stand kunnen veranderen door trillen, schudden of schokken van de lier.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel7
  - number: '7.7'
    text: |-
      Kenmerkende standen van de bedieningsorganen moeten, indien het om vergissingen te voorkomen noodzakelijk is, door
      een desbetreffend opschrift duidelijk zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel7
  - number: '7.8'
    text: |-
      De bewegingsrichting van de betreffende bedieningsorganen moet worden beschouwd ten opzichte van de lierman en in
      overeenstemming zijn met het volgende:

              handrem:

                om te remmen naar achteren;



              voetrem:

                om te remmen naar voren;



              handgreep of pedaal ter regeling van het motorvermogen:

                om het vermogen te vergroten naar voren.



              bedieningsorgaan van de kapinrichting:

                om te kappen naar achteren.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel7
  - number: '7.9'
    text: |-
      De bedieningsorganen, welke uitsluitend in noodgevallen worden gebruikt, moeten duidelijk gekenmerkt en rood
      gekleurd zijn. Andere bedieningsorganen mogen niet rood zijn gekleurd.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel7
  - number: '8.1'
    text: |-
      De stand- of zitplaats van de lierman moet op deugdelijke wijze zijn afgescheiden van de gevaarlijke delen van het
      liermechanisme, de kabelgeleiding en de kapinrichting en op deugdelijke wijze zijn beschermd tegen een over de lier
      vallende sleepkabel.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel8
  - number: '8.2'
    text: |-
      Alle draaiende delen van de lier alsmede de messen van de kapinrichting moeten op deugdelijke wijze tegen aanraking
      door het bedieningspersoneel zijn afgeschermd.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel8
  - number: '9'
    text: |-
      De lier moet op zodanige wijze worden ondersteund, dat de lier niet tengevolge van de tijdens het bedrijf
      erop werkende krachten zodanig van stand kan veranderen, dat de goede werking ervan of de veiligheid van het
      bedieningspersoneel in gevaar gebracht wordt.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel9
  - number: '10'
    text: Ten aanzien van lieren, welke zijn uitgerust met meer dan één kabeltrommel, gelden de volgende eiser
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel10
  - number: 10.a
    text: |-
      voor elke kabeltrommel moet een kapinrichting kabelgeleiding en eventueel de in [artikel 6, derde lid][ref1],
      aangegeven instrumenten op de lier zijn aangebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0004853#Artikel6
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004853
        artikel: '6'
        hoofdstuk: II
  - number: 10.b
    text: |-
      de constructie van de lier moet zodanig zijn, dat de kabels, welke op de bijbehorende kabeltrommels worden
      gewikkeld, niet gemakkelijk met elkaar verward kunnen raken;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel10
  - number: 10.c
    text: |-
      de kapinrichtingen moeten zodanig zijn uitgevoerd, dat deze onder alle voorkomende omstandigheden onafhankelijk
      van elkaar
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel10
  - number: 10.c.1
    text: kunnen worden bediend;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel10
  - number: 10.c.2
    text: kunnen functioneren;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel10
  - number: 10.c.3
    text: |-
      voldoen aan het gestelde in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004853#Artikel4
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004853
        artikel: '4'
        hoofdstuk: II
  - number: '11.1'
    text: 'Een sleepauto moet omvatten:'
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel11
  - number: 11.1.a
    text: een ontkoppelbare, gesloten haak ter bevestiging van de sleepkabel;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel11
  - number: 11.1.b
    text: instrumenten voor de controle van de goede werking van de krachtbron en voor controle van het sleepproces;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel11
  - number: 11.1.c
    text: |-
      afschermende delen, welke de inzittenden beschermen tegen mogelijke gevaren, welke zich bij het slepen kunnen
      voordoen
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel11
  - number: '11.2'
    text: |-
      Het voorthewegingsmechanisme , de besturingsorganen, de vering en de reminrichting moeten in goede staat zijn. Het
      verhogen van de rijsnelheid vanaf stilstand moet zonder hinderlijke schokken kunnen geschieden.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel11
  - number: '11.3'
    text: |-
      De sleepauto moet bij een windsnelheid van 0 m sec tijdens het slepen tenminste een rijsnelheid kunnen bereiken,
      welke 1,2 maal de minimale vliegsnelheid van het snelste type zweefvliegtuig, waarvoor de sleepauto is bestemd,
      bedraagt
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel11
  - number: '11.4'
    text: |-
      Het gewicht van de sleepauto, zonder brandstof en inzittenden, moet tenminste 1,5 maal het maximaal toegelaten
      gewicht bedragen van het zwaarste type zweefvliegtuig, waarvoor de sleepauto is bestemd.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel11
  - number: '11.5'
    text: |-
      De constructie van de sleepauto alsmede van de daarop aangebrachte installaties moet voldoende sterkte en stijfheid
      bezitten om de daarop uitgeoefende krachten zonder ontoelaatbare vervorming te kunnen opnemen.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel11
  - number: '11.6'
    text: |-
      De plaats van de bestuurder van de sleepauto moet zodanig zijn, dat hij een voldoend, voor zover mogelijk
      onbeperkt, uitzicht naar alle zijden heeft.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel11
  - number: '11.7'
    text: |-
      De plaats van de startman op de sleepauto moet zodanig zijn, dat hij een voldoend, voor zover mogelijk onbeperkt,
      uitzicht naar alle zijden heeft en dat hij het zweefvliegtuig tijdens het slepen gemakkelijk kan waarnemen.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel11
  - number: '11.8'
    text: |-
      De plaatsen van de bestuurder en startman moeten zodanig zijn, dat tijdens het slepen een geregeld, rechtstreeks en
      uitstekend contact tussen hen mogelijk is.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel11
  - number: '12.1'
    text: De haak moet door de startman vanaf zijn stand- of zitplaats gemakkelijk en snel ontkoppeld kunnen worden.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel12
  - number: '12.2'
    text: |-
      De plaats van bevestiging van de haak aan de sleepauto moet zodanig zijn, dat de sleepkabel na het koppelen niet
      met enig deel van de sleepauto verward kan raken.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel12
  - number: '12.3'
    text: |-
      De haak moet zodanig zijn geconstrueerd, dat de verbinding tussen sleepkabel en sleepauto onder alle mogelijke
      omstandigheden geheel verbroken kan worden.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel12
  - number: '13.1'
    text: 'De sleepauto moet tenminste met de volgende instrumenten zijn uitgerust:'
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel13
  - number: 13.1.a
    text: een instrument, dat de rijsnelheid van de sleepauto aangeeft;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel13
  - number: 13.1.b
    text: instrumenten, welke een goede beoordeling van de werking van de krachtbron mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel13
  - number: '13.2'
    text: |-
      De schalen van de instrumenten moeten overzichtelijk zijn ingedeeld en door de startman vanaf zijn stand- of
      zitplaats gemakkelijk afgelezen kunnen worden. Op de schalen moeten de met betrekking tot de sleepauto en de
      sleepkabel maximaal toelaatbare en andere mogelijke belangrijke waarden of gebieden duidelijk zijn gemarkeerd.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel13
  - number: '13.3'
    text: |-
      Het is wenselijk, dat de sleepauto is uitgerust met een instrument, dat de grootte van de trekkracht in de
      sleepkabel aangeeft.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel13
  - number: '14.1'
    text: |-
      De bedieningsorganen omvatten alle hefbomen, schakelaars, knoppen, kranen, enz., welke hetzij door de bestuurder,
      hetzij door de startman bediend moeten worden voor een goed verloop van het sleepproces.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel14
  - number: '14.2'
    text: |-
      De bedieningsorganen moeten zodanig zijn opgesteld ten opzichte van de stand- of zitplaats van diegene die
      ze bedient, dat de volle uitslag van elk van die organen gemakkelijk kan worden bereikt, ongehinderd door
      constructiedelen van de sleepauto of door de kleding van de betreffende persoon.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel14
  - number: '14.3'
    text: |-
      De bedieningsorganen moeten zodanig zijn uitgevoerd of opgesteld, dat zij geen aanleiding tot verwisseling kunnen
      geven.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel14
  - number: '14.4'
    text: |-
      De bedieningsinrichtingen moeten zodanig zijn ontworpen en uitgevoerd, dat in de war raken van kabels, schuren
      en slingeren van kabels, kettingen of stootstangen tegen enig deel van de sleepauto alsmede beïnvloeding door
      inzittenden of losse voorwerpen hoogst onwaarschijnlijk is. Kabels en kettingen moeten tegen aflopen of afvallen
      geborgd zijn.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel14
  - number: '14.5'
    text: De bedieningsorganen mogen niet van stand kunnen veranderen door trillen, schudden of schokken van de sleepauto.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel14
  - number: '14.6'
    text: |-
      Kenmerkende standen van de bedieningsorganen moeten, indien het om vergissingen te voorkomen noodzakelijk is, door
      een desbetreffend opschrift duidelijk zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel14
  - number: '14.7'
    text: |-
      De bedieningsorganen, welke uitsluitend in noodgevallen worden gebruikt, moeten duidelijk gekenmerkt en rood
      gekleurd zijn. Andere bedieningsorganen mogen niet rood zijn gekleurd.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel14
  - number: '15.1'
    text: |-
      De stand- of zitplaatsen van de bestuurder en de startman moeten zodanig zijn ingericht, dat de bestuurder noch de
      startman tijdens het slepen van de sleepauto kan vallen.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel15
  - number: '15.2'
    text: |-
      De stand- of zitplaatsen van de bestuurder en de startman moeten op deugdelijke wijze zijn afgescheiden van de
      gevaarlijke delen van de sleepauto en de daarop aangebrachte installaties.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel15
  - number: '15.3'
    text: |-
      De plaatsen voor de inzittenden van de sleepauto moeten op deugdelijke wijze zijn beschermd tegen een over de
      sleepauto vallende sleepkabel.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel15
  - number: '16.1'
    text: |-
      De bepalingen van dit hoofdstuk zijn uitsluitend van toepassing op sleepkabels, welke gebruikt worden voor de
      opstijging van een zweefvliegtuig met behulp van een lier of een sleepauto.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel16
  - number: '16.2'
    text: 'De sleepkabel, welke wordt gebruikt voor de opstijging met behulp van een lier, moet omvatten:'
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel16
  - number: 16.2.a
    text: |-
      een kabel van zodanige lengte dat bij een windsnelheid van 0 m/sec het zweefvliegtuig bij normaal bedrijf ten-
      minste een hoogte van 250 m kan bereiken;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel16
  - number: 16.2.b
    text: een breukstuk van de voorgeschreven nominale sterkte;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel16
  - number: 16.2.c
    text: een ring ter bevestiging van de kabel aan het zweefvliegtuig.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel16
  - number: '16.3'
    text: |-
      De sleepkabel, welke wordt gebruikt voor de opstijging met behulp van een sleepauto, moet de volgende delen
      omvatten:
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel16
  - number: 16.3.a
    text: de in het vorige lid genoemde delen;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel16
  - number: 16.3.b
    text: een ring ter bevestiging van de kabel aan de sleepauto.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel16
  - number: '16.4'
    text: |-
      Alle onderdelen van de sleepkabel, met uitzondering van het breukstuk, moeten een trekkracht kunnen opnemen,
      welke tenminste 1,5 maal de nominale sterkte van het breukstuk bedraagt. Voorts moeten de ring(en) en de in
      [artikel 17, eerste lid][ref1], bedoelde breukstukhouder zonder blijvende vervorming een trekkracht kunnen opnemen,
      welke tenminste 1,5 maal de nominale sterkte van het breukstuk bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0004853#Artikel17
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004853
        artikel: '17'
        hoofdstuk: IV
  - number: '16.5'
    text: |-
      Delen van de sleepkabels, welke door geregeld optredende breuk of door andere tekenen van verval (haren enz.)
      bewijzen niet meer de in het vorige lid vereiste sterkte bezitten, moeten worden vervangen. Afzonderlijke stukken
      van sleepkabels (bijvoorbeeld na breken of vervangen van versleten stukken) moeten aan elkaar verbonden worden
      door middel van deugdelijke splitsen of klemmen. Bij gebruik van klemmen moeten tenminste twee klemmen worden
      aangebracht. In enig deel met een lengte van 100 meter van een lierkabel mogen zich niet meer dan twee van
      bovengenoemde verbindingen bevinden.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel16
  - number: '16.6'
    text: |-
      Bij een sleepkabel, welke wordt gebruikt voor de opstijging met behulp van een sleepauto, moet de ring ter
      bevestiging van de sleepkabel aan de sleepauto duidelijk als zodanig gekenmerkt zijn.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel16
  - number: '16.7'
    text: |-
      Alle verbindingselementen van de sleepkabel, zoals harpsluitingen en karabijnhaken, moeten voldoende bedrijfszeker
      zijn, zodat deze tijdens het slepen niet kunnen losraken.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel16
  - number: '17.1'
    text: |-
      Het breukstuk en de houder waarin het moet zijn opgenomen, moeten deugdelijk en van een door de Minister van
      Verkeer en Waterstaat toegelaten type zijn. De deugdelijkheid van de breukstukken kan worden aangetoond door 5
      exemplaren van de betreffende productie-serie als volgt te beproeven:
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel17
  - number: 17.1.a
    text: |-
      het breukstuk mag niet een meetbare, blijvende vormverandering hebben ondergaan, nadat het breukstuk gedurende 5
      minuten is belast met een trekkracht van 0,85 maal de nominale sterkte;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel17
  - number: 17.1.b
    text: |-
      de breuksterkte van het breukstuk mag niet groter zijn dan 1,07 maal en niet kleiner dan 0,93 maal de nominale
      sterkte.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel17
  - number: '17.2'
    text: |-
      Het breukstuk waarvan de nominale sterkte in het vlieghandboek is vermeld, moet met een kleur of kleuren en een
      ingeslagen merk duidelijk zijn gemerkt.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel17
  - number: '18'
    text: |-
      De ring, waarmede de kabel aan het zweefvliegtuig onderscheidenlijk de sleepauto wordt bevestigd, moet zodanig
      zijn, dat
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel18
  - number: 18.a
    text: de ring goed past om de haak, waaraan hij bevestigd moet worden;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel18
  - number: 18.b
    text: de haak zonder enige moeilijkheden ontkoppeld kan worden, indien de ring om de haak geslagen is;
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel18
  - number: 18.c
    text: de ring onmiddellijk na het ontkoppelen zonder enige moeilijkheid van de haak loskomt.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel18
  - number: '19.1'
    text: Het kabelvalscherm moet zodanig zijn uitgevoerd, dat het zich tijdens de opstijging niet kan openen.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel19
  - number: '19.2'
    text: Het kabelvalscherm moet voldoende sterkte bezitten om de daarop uitgeoefende krachten te kunnen opnemen.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel19
  - number: '19.3'
    text: De middellijn van het kabelvalscherm mag in geopende toestand niet groter zijn dan 200 cm.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel19
  - number: '19.4'
    text: |-
      De afstand tussen de ontkoppelhaak van het zweefvliegtuig en enig deel van het kabelvalscherm moet tenminste 30 m
      bedragen, indien de sleepkabel aan het zweefvliegtuig is bevestigd en de kabel zich in gestrekte toestand bevindt.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel19
  - number: '20'
    text: |-
      Lieren moeten zijn uitgerust met een geel zwaailicht, hetwelk via het motorcontact dusdanig aangesloten moet zijn,
      dat het licht in werking is gedurende de tijd dat de liermotor loopt. Het licht moet tenminste op een afstand van
      1500 m zichtbaar zijn.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel20
  - number: '21'
    text: |-
      De beschikking van de Directeur-Generaal van de Rijksluchtvaartdienst van 8 juni 1978 nr. LI/11726 wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel21
  - number: '22'
    text: |-
      Deze regeling treedt in werking op de tweede dag na de datum van verschijning van de Nederlandse Staatscourant,
      waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0004853/1998-04-01#Artikel22
