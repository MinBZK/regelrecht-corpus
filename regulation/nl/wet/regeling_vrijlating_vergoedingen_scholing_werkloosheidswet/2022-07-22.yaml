---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_vrijlating_vergoedingen_scholing_werkloosheidswet
regulatory_layer: WET
publication_date: '2022-07-21'
valid_from: '2022-07-22'
bwb_id: BWBR0016067
url: https://wetten.overheid.nl/BWBR0016067/2022-07-22
preamble:
  text: |-
    Gelet op artikel 35a van de Werkloosheidswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016067/2022-07-22#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De vergoedingen voor reiskosten in verband met opleiding of scholing als bedoeld in
      [artikel 47a van de Werkloosheidswet][ref1], worden niet in mindering gebracht op de werkloosheidsuitkering
      voorzover zij niet meer bedragen dan:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel47a
    url: https://wetten.overheid.nl/BWBR0016067/2022-07-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 47a
    machine_readable:
      execution:
        parameters:
          - name: reiskosten_auto
            type: amount
            required: false
            description: Vergoeding voor reiskosten per auto
            type_spec:
              unit: eurocent
          - name: reiskosten_openbaar_vervoer
            type: amount
            required: false
            description: Vergoeding voor reiskosten openbaar vervoer
            type_spec:
              unit: eurocent
          - name: kilometervergoeding_auto_max
            type: amount
            required: true
            description: Maximale kilometervergoeding voor auto (uit artikel 1.1.a)
            type_spec:
              unit: eurocent
          - name: reiskosten_openbaar_vervoer_max
            type: amount
            required: true
            description: Maximale reiskosten voor openbaar vervoer (uit artikel 1.1.b)
            type_spec:
              unit: eurocent
        output:
          - name: reiskosten_vergoeding_vrijgesteld
            type: boolean
            description: Geeft aan of de reiskostenvergoeding niet in mindering gebracht wordt op de werkloosheidsuitkering
        actions:
          - output: reiskosten_vergoeding_vrijgesteld
            value:
              operation: OR
              conditions:
                - operation: AND
                  conditions:
                    - operation: LESS_THAN_OR_EQUAL
                      subject: $reiskosten_auto
                      value: $kilometervergoeding_auto_max
                    - operation: NOT
                      value:
                        operation: EQUALS
                        subject: $reiskosten_auto
                        value: null
                - operation: AND
                  conditions:
                    - operation: LESS_THAN_OR_EQUAL
                      subject: $reiskosten_openbaar_vervoer
                      value: $reiskosten_openbaar_vervoer_max
                    - operation: NOT
                      value:
                        operation: EQUALS
                        subject: $reiskosten_openbaar_vervoer
                        value: null

  - number: 1.1.a
    text: |-
      in geval van vervoer per auto het bedrag per afgelegde kilometer, genoemd in
      [artikel 31a, tweede lid, onderdeel a, onder 3°, van de Wet op de loonbelasting 1964][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31a
    url: https://wetten.overheid.nl/BWBR0016067/2022-07-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 31a
    machine_readable:
      execution:
        input:
          - name: kilometervergoeding_auto_loonbelasting
            type: amount
            description: Kilometervergoeding per auto uit Wet op de loonbelasting 1964, Artikel 31a
            source:
              regulation: wet_op_de_loonbelasting_1964
              output: kilometervergoeding_auto_31a_3
        output:
          - name: kilometervergoeding_auto_max
            type: amount
            description: Maximale kilometervergoeding voor auto
            type_spec:
              unit: eurocent
        actions:
          - output: kilometervergoeding_auto_max
            value: $kilometervergoeding_auto_loonbelasting

  - number: 1.1.b
    text: de werkelijk gemaakte reiskosten voor openbaar vervoer tweede klas.
    url: https://wetten.overheid.nl/BWBR0016067/2022-07-22#Artikel1
    machine_readable:
      execution:
        parameters:
          - name: reiskosten_openbaar_verkeer_werkelijk
            type: amount
            required: true
            description: Werkelijk gemaakte reiskosten voor openbaar vervoer tweede klass
            type_spec:
              unit: eurocent
        output:
          - name: reiskosten_openbaar_vervoer_max
            type: amount
            description: Maximale reiskosten voor openbaar vervoer tweede klass
            type_spec:
              unit: eurocent
        actions:
          - output: reiskosten_openbaar_vervoer_max
            value: $reiskosten_openbaar_verkeer_werkelijk

  - number: '1.2'
    text: |-
      In afwijking van het eerste lid, onderdeel a, worden indien de werknemer, bedoeld in
      [artikel 47a van de Werkloosheidswet][ref1], en voor zijn vervoer op medische gronden is aangewezen op vervoer
      per auto, de vergoedingen voor reiskosten niet in mindering gebracht op de werkloosheidsuitkering voorzover zij
      niet meer bedragen dan de kilometervergoeding voor vervoer per auto in eigen bezit, die het UWV op grond van
      [artikel 35 van de Wet werk en inkomen naar arbeidsvermogen][ref2] vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel47a
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel35
    url: https://wetten.overheid.nl/BWBR0016067/2022-07-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 47a
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '35'
    machine_readable:
      execution:
        parameters:
          - name: medische_indicatie_auto
            type: boolean
            required: true
            description: Geeft aan of de werknemer op medische gronden is aangewezen op vervoer per auto
          - name: reiskosten_auto
            type: amount
            required: true
            description: Vergoeding voor reiskosten per auto
            type_spec:
              unit: eurocent
        input:
          - name: kilometervergoeding_auto_maximaal
            type: amount
            description: Kilometervergoeding voor auto in eigen bezit, vastgesteld door UWV
            source:
              regulation: wet_werk_en_inkomen_naar_arbeidsvermogen
              output: kilometervergoeding_auto_eigen_bezit
          - name: kilometervergoeding_auto_standaard
            type: amount
            description: Standaard kilometervergoeding voor auto uit artikel 1.1.a
            source:
              regulation: regeling_vrijlating_vergoedingen_scholing_werkloosheidswet
              output: kilometervergoeding_auto_max
        output:
          - name: maximale_kilometervergoeding_auto
            type: amount
            description: Maximale toepasselijke kilometervergoeding voor auto
            type_spec:
              unit: eurocent
          - name: reiskosten_vergoeding_vrijgesteld_medisch
            type: boolean
            description: Geeft aan of de reiskostenvergoeding niet in mindering gebracht wordt op basis van medische indicatie
        actions:
          - output: maximale_kilometervergoeding_auto
            value:
              operation: IF
              when:
                operation: EQUALS
                subject: $medische_indicatie_auto
                value: true
              then: $kilometervergoeding_auto_maximaal
              else: $kilometervergoeding_auto_standaard
          - output: reiskosten_vergoeding_vrijgesteld_medisch
            value:
              operation: LESS_THAN_OR_EQUAL
              subject: $reiskosten_auto
              value: $maximale_kilometervergoeding_auto

  - number: 1a
    text: |-
      Deze regeling berust op [artikel 47a van de Werkloosheidswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel47a
    url: https://wetten.overheid.nl/BWBR0016067/2022-07-22#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 47a

  - number: '2'
    text: |-
      Deze regeling is van toepassing op de werkloze werknemer die op of na de dag van inwerkingtreding van deze regeling
      begint met het volgen van opleiding of scholing als bedoeld in [artikel 35a van de Werkloosheidswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel35a
    url: https://wetten.overheid.nl/BWBR0016067/2022-07-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 35a
    machine_readable:
      execution:
        parameters:
          - name: datum_start_opleiding
            type: date
            required: true
            description: Datum waarop de werkloze werknemer begint met het volgen van opleiding of scholing
        output:
          - name: regeling_toepasselijk
            type: boolean
            description: Geeft aan of de regeling van toepassing is
        actions:
          - output: regeling_toepasselijk
            value:
              operation: GREATER_THAN_OR_EQUAL
              subject: $datum_start_opleiding
              value: "2022-07-22"

  - number: '3'
    text: |-
      De __REF000___________________________________________________________________________________________________________
      _______________________________________________________________ (Stcrt. 169) wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0007525
    url: https://wetten.overheid.nl/BWBR0016067/2022-07-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007525

  - number: '4'
    text: Deze regeling treedt in werking met ingang van 1 januari 2004.
    url: https://wetten.overheid.nl/BWBR0016067/2022-07-22#Artikel4

  - number: '5'
    text: 'Deze regeling wordt aangehaald als: Regeling vrijlating vergoedingen scholing Werkloosheidswet.'
    url: https://wetten.overheid.nl/BWBR0016067/2022-07-22#Artikel5
