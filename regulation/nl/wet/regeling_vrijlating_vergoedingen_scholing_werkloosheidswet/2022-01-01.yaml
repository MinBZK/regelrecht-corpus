preamble:
  text: |-
    Gelet op artikel 35a van de Werkloosheidswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016067/2022-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De vergoedingen voor reiskosten in verband met opleiding of scholing als bedoeld in
      [artikel 47a van de Werkloosheidswet][ref1], worden niet in mindering gebracht op de werkloosheidsuitkering
      voorzover zij niet meer bedragen dan:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel47a
    url: https://wetten.overheid.nl/BWBR0016067/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 47a
  - number: 1.1.a
    text: in geval van vervoer per auto € 0,19 per kilometer, of
    url: https://wetten.overheid.nl/BWBR0016067/2022-01-01#Artikel1
  - number: 1.1.b
    text: de werkelijk gemaakte reiskosten voor openbaar vervoer tweede klas.
    url: https://wetten.overheid.nl/BWBR0016067/2022-01-01#Artikel1
  - number: '1.2'
    text: |-
      Indien het bedrag, bedoeld in
      [artikel 31a, tweede lid, onderdeel a, onder 3°, van de Wet op de loonbelasting 1964][ref1] wordt herzien, wordt
      het bedrag bedoeld in het eerste lid, onderdeel a, overeenkomstig herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31a
    url: https://wetten.overheid.nl/BWBR0016067/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 31a
  - number: '1.3'
    text: |-
      In afwijking van het eerste lid, onderdeel a, worden indien de werknemer, bedoeld in
      [artikel 47a van de Werkloosheidswet][ref1], en voor zijn vervoer op medische gronden is aangewezen op vervoer
      per auto, de vergoedingen voor reiskosten niet in mindering gebracht op de werkloosheidsuitkering voorzover zij
      niet meer bedragen dan de kilometervergoeding voor vervoer per auto in eigen bezit, die het UWV op grond van
      [artikel 35 van de Wet werk en inkomen naar arbeidsvermogen][ref2] vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel47a
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel35
    url: https://wetten.overheid.nl/BWBR0016067/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 47a
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '35'
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 47a van de Werkloosheidswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel47a
    url: https://wetten.overheid.nl/BWBR0016067/2022-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 47a
  - number: '2'
    text: |-
      Deze regeling is van toepassing op de werkloze werknemer die op of na de dag van inwerkingtreding van deze regeling
      begint met het volgen van opleiding of scholing als bedoeld in [artikel 35a van de Werkloosheidswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel35a
    url: https://wetten.overheid.nl/BWBR0016067/2022-01-01#Artikel2
    references:
