  - number: '2'
    text: |-
      1 De Onderzoeker stelt, aan de hand van het doel van het onderzoek, vast welke Digitale gegevens worden gevorderd
      van het Onderzoekssubject. De IT-Specialist draagt er zorg voor dat deze Digitale gegevens worden geïdentificeerd,
      veiliggesteld en gekopieerd.

      2 De IT-Specialist verstrekt binnen vijf werkdagen na het kopiëren van de digitale gegevens een overzicht van
      de gekopieerde Digitale gegevens en wijst het Onderzoekssubject op de mogelijkheid tot schonen van gekopieerde
      Digitale gegevens zoals genoemd in het derde en vijfde lid.

      3 Indien het Onderzoekssubject claimt dat de te kopiëren Digitale gegevens Geprivilegieerde gegevens bevatten, kan
      zij de AFM schriftelijk verzoeken om deze gegevens te Schonen. Dit verzoek kan door zowel het Onderzoekssubject als
      door de verschoningsgerechtigde zelf worden gedaan. Dit verzoek dient uiterlijk 10 werkdagen na verzending van de
      in het tweede lid genoemde kennisgeving gericht te worden aan de IT-Specialist of, indien toepassing wordt gegeven
      aan [artikel 3, zesde lid][ref1], van de Werkwijze, aan de Functionaris Verschoningsrecht.

      4 Het in het derde lid genoemde verzoek dient de volgende informatie te bevatten:

      a. gegevens over de auteur en het onderwerp. In geval van correspondentie tevens gegevens over de afzender, de
      geadresseerde en de datum van verzending, en

      b. een deugdelijke onderbouwing waaruit blijkt dat er sprake is van verschoningsgerechtigde gegevens.

      5 Het in het derde lid genoemde verzoek kan ook gedaan worden ten aanzien van een claim dat de te kopiëren Digitale
      gegevens Privégegevens bevatten.

      6 Het in het vijfde lid genoemde verzoek dient de volgende informatie te bevatten:

      a. gegevens over de auteur en het onderwerp. In geval van correspondentie tevens gegevens over de afzender, de
      geadresseerde en de datum van verzending, en

      b. een deugdelijke onderbouwing waaruit blijkt dat er sprake is van Privégegevens.

      7 Indien het Onderzoekssubject nalaat binnen 10 werkdagen na verzending van de in het tweede lid genoemde
      kennisgeving, een verzoek voor Schoning te doen, zoals bedoeld in het derde en/of vijfde lid, of binnen
      voornoemde termijn aangeeft geen verzoek te willen doen, bevestigt de IT-Specialist dit schriftelijk aan het
      Onderzoekssubject. De IT-Specialist geeft de Onderzoeker daarna toegang tot de Digitale gegevens.

      8 De van het Onderzoekssubject gekopieerde Digitale gegevens worden door de IT-Specialist op versleutelde wijze
      getransporteerd naar de AFM. De gekopieerde Digitale gegevens worden ten kantore van de AFM opgeslagen op een van
      het toezicht afgescheiden IT-omgeving. De Onderzoeker heeft geen toegang tot de ongeschoonde digitale gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0041509#Artikel3
    url: https://wetten.overheid.nl/BWBR0041509/2018-11-03#Artikel2
