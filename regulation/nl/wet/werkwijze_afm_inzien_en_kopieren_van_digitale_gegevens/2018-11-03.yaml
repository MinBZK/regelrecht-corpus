  - number: '5'
    text: |-
      1 Na afronding van de Schoning geeft de IT-Specialist de Onderzoeker toegang tot de Geschoonde gegevens.

      2 De Onderzoeker voert uitsluitend gerichte zoekacties uit in de Geschoonde gegevens. Daarbij hanteert de
      Onderzoeker een zoekstrategie die is gebaseerd op zoektermen. De zoektermen vinden hun oorsprong in het doel van
      het onderzoek. Bij het verrichten van de zoekacties op basis van de zoektermen, kan gebruik worden gemaakt van
      technische middelen om het zoeken efficiënter te laten verlopen.

      3 Op verzoek van het Onderzoekssubject wordt een toelichting verschaft op de gehanteerde zoekstrategie.

      4 Indien tijdens het onderzoek in de Geschoonde gegevens onverhoopt Geprivilegieerde- en/of Privégegevens worden
      aangetroffen, dan zullen deze alsnog worden geschoond.
    url: https://wetten.overheid.nl/BWBR0041509/2018-11-03#Artikel5
  - number: '6'
    text: |-
      1 De IT-Specialist vernietigt alle van het Onderzoekssubject gekopieerde Digitale gegevens met uitzondering van die
      digitale gegevens die in het onderzoeksdossier zijn opgenomen:

      a. zo spoedig mogelijk nadat het toezichtonderzoek is gesloten; of

      b. zo spoedig mogelijk nadat naar aanleiding van het onderzoek genomen besluiten, onherroepelijk zijn geworden.

      2 Indien Onderzoekssubject zich overeenkomstig [artikel 3, zesde lid][ref1] of [artikel 4, eerste lid][ref2],
      van de Werkwijze, gewend heeft tot de Functionaris Verschoningsrecht en de daartoe strekkende claim (al dan niet
      gedeeltelijk) gehonoreerd is, dan vernietigt deze de betreffende Geprivilegieerde gegevens en de daarover gevoerde
      correspondentie na het geval van en overeenkomstig het eerste lid, onder a of b.


