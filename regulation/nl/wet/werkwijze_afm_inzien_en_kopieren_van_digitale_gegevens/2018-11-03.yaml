        artikel: '3'
  - number: '3'
    text: |-
      1 De IT-Specialist beoordeelt Geprivilegieerde- en/of Privégegevens uit de gekopieerde digitale gegevens aan de
      hand van de onderbouwing zoals bedoeld in [artikel 2, vierde lid, onder b][ref1], of artikel 2, zesde lid, onder b,
      van de Werkwijze. Hierbij zal de IT-Specialist door middel van vluchtig inzien beoordelen of de claim terecht is.

      2 De Schoning vindt in beginsel plaats ten kantore van de AFM. Indien het Onderzoekssubject ondubbelzinnig
      en met precisie Geprivilegieerde- en/of Privégegevens kan duiden, dan zal de Schoning ten kantore van het
      Onderzoekssubject worden uitgevoerd, tenzij dit naar het oordeel van de IT-Specialist op technische of andere
      zwaarwegende praktische bezwaren stuit.

      3 Indien de Schoning ten kantore van de AFM wordt uitgevoerd, stelt de IT-Specialist het Onderzoekssubject in de
      gelegenheid om tijdens de Schoning aanwezig te zijn.

      4 Indien het verzoek, zoals bedoeld in [artikel 2, derde en/of vijfde lid][ref2], van de Werkwijze, onvoldoende
      aanknopingspunten geeft om de Schoning uit te voeren, wordt het Onderzoeksobject eenmalig en binnen een termijn van
      5 werkdagen in de gelegenheid gesteld om een aanvullende toelichting te geven.

      5 Indien de IT-Specialist van oordeel is dat de claim (of een deel daarvan) zoals bedoeld in
      [artikel 2, derde en/of vijfde lid][ref3], van de Werkwijze, al dan niet gegrond is, stelt de IT-Specialist
      het Onderzoekssubject daarvan schriftelijk in kennis en schoont de IT-Specialist de terecht geclaimde digitale
      gegevens.

      6 Indien het Onderzoekssubject stelt dat het vluchtig inzien van de als verschoningsgerechtigd geclaimde gegevens
      door de IT-Specialist het verschoningsgerechtigde karakter kan schaden, dan zal de Functionaris Verschoningsrecht,
      mede aan de hand van de onderbouwing zoals bedoeld in [artikel 2, vierde lid onder b][ref4], van de Werkwijze,
      beoordelen of de claim terecht is. De leden 1 tot en met 5 van dit artikel zijn in dat geval slechts van toepassing
      op Privégegevens.


