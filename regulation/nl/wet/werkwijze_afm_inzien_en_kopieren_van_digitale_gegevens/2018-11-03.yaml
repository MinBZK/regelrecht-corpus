  - number: '4'
    text: |-
      1 Het Onderzoekssubject kan het geprivilegieerde karakter van de claim of het gedeelte waarvan de IT-
      Specialist heeft geoordeeld dat deze onterecht is, laten beoordelen door de Functionaris Verschoningsrecht.
      Het Onderzoekssubject dient hiertoe binnen 10 werkdagen na de dagtekening van de kennisgeving bedoeld onder
      [artikel 3, vijfde lid][ref1], van de Werkwijze, een gemotiveerd verzoek te richten aan de Functionaris
      Verschoningsrecht.

      2 De Functionaris Verschoningsrecht kan het Onderzoekssubject verzoeken een aanvullende toelichting te geven indien
      er onvoldoende aanknopingspunten zijn om het geprivilegieerde karakter van de betreffende gegevens te beoordelen.

      3 Voor zover de Functionaris Verschoningsrecht van oordeel is dat (een gedeelte van) de claim terecht is stelt hij
      het Onderzoekssubject daarvan schriftelijk in kennis en laat hij de desbetreffende digitale gegevens alsnog Schonen
      door de IT-Specialist.

      4 Indien de Functionaris Verschoningsrecht van oordeel is dat (een gedeelte van) de claim onterecht is, dan stelt
      hij het Onderzoekssubject daarvan schriftelijk en gemotiveerd in kennis. In deze kennisgeving geeft de Functionaris
      Verschoningsrecht aan dat hij de desbetreffende digitale gegevens niet eerder dan 10 werkdagen na verzending
      van de kennisgeving beschikbaar maakt voor de Onderzoeker. De wachttermijn van 10 werkdagen dient ertoe het
      Onderzoekssubject de mogelijkheid te bieden een kort geding aanhangig te maken bij de civiele rechter. Voor het
      gedeelte van de claim dat de Functionaris Verschoningsrecht wel als terecht heeft beoordeeld, worden de betreffende
      digitale gegevens geschoond door de IT-Specialist.

      5 De correspondentie die tussen het Onderzoekssubject en de Functionaris Verschoningsrecht is gevoerd in het kader
      van de inhoudelijke beoordeling van de Schoning is enkel toegankelijk voor de Functionaris Verschoningsrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0041509#Artikel3
