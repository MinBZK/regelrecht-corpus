    text: |-
        - *Digitale gegevens:* elektronische gegevens waarover het Onderzoekssubject beschikt of kan beschikken.
        - *Functionaris Verschoningsrecht:* een door het bestuur van de Autoriteit Financiële Markten (AFM) aangewezen
      persoon die, niet als IT-Specialist of als Toezichthouder bij onderzoeken betrokken is of zal zijn, onafhankelijk
      van het toezicht het geprivilegieerde karakter van de door het Onderzoekssubject geclaimde gegevens toetst.
        - *Geprivilegieerde gegevens:* Digitale gegevens die zijn gewisseld tussen een Onderzoekssubject en diens advocaat
      in die hoedanigheid. De gegevens worden als geprivilegieerd aangemerkt wanneer de advocaat zich ten aanzien van die
      gegevens zou kunnen beroepen op het verschoningsrecht zoals vastgelegd in [artikel 5:20, tweede lid, Awb][ref1] en
      hij over die gegevens kan beschikken.
        - *Geschoonde gegevens:* Digitale gegevens zoals veiliggesteld en gekopieerd door de IT-Specialist waar
      Geprivilegieerde- en/of Privégegevens van zijn uitgesloten.
        - *IT-Specialist:* een toezichthouder in de zin van [artikel 5:11 van de Awb][ref2] die tevens belast is met het
      proces van identificeren, veiligstellen, kopiëren en verwerken van Digitale gegevens en die niet betrokken is bij
      de inhoudelijke uitvoering van het toezichtonderzoek.
        - *Onderzoeker:* een toezichthouder in de zin van [artikel 5:11 van de Awb][ref3] die het toezichtonderzoek
      uitvoert.
        - *Onderzoekssubject:* de natuurlijke persoon of rechtspersoon van wie in het kader van een informatievordering
      Digitale gegevens zijn veiliggesteld en gekopieerd.
        - *Privégegevens:* Digitale gegevens die persoonsgegevens en persoonlijke informatie bevatten welke overduidelijk
      niet in verband staan met de activiteiten waarop het toezichtonderzoek zich richt en daarmee niet als zakelijke
      gegevens kwalificeren als bedoeld in [artikel 5:17 Awb][ref4].
        - *Schonen / Schoning:* het uitsluiten van Geprivilegieerde- en/of Privégegevens uit de verzameling van digitale
      gegevens die door de Onderzoeker zullen worden gebruikt in het onderzoek.
        - *Toezichthouder:* een Onderzoeker of IT-Specialist.
        - *Werkwijze:* de Werkwijze AFM inzien en kopiëren van digitale gegevens.


