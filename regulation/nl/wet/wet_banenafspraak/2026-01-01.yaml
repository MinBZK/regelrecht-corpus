  - number: '4'
    text: |-
      1 Indien het aantal banen voor arbeidsbeperkten in een bepaald kalenderjaar in onvoldoende mate is toegenomen ten
      opzichte van het aantal van deze banen op 1 januari 2013, wordt dit bij regeling van Onze Minister vastgesteld.

      2 Ten behoeve van de vaststelling van de toename, bedoeld in het eerste lid, wordt bij of krachtens algemene
      maatregel van bestuur het aantal te realiseren banen in een kalenderjaar bepaald voor arbeidsbeperkten, uitgedrukt
      in verloonde uren op 1 januari 2013, en wordt per kalenderjaar bepaald:

      a. het cumulatief aantal extra te realiseren banen voor deze arbeidsbeperkten uitgedrukt in verloonde uren;

      b. het cumulatief aantal gerealiseerde banen voor deze arbeidsbeperkten uitgedrukt in verloonde uren, en

      c. de uitkomst van de vergelijking tussen het cumulatief aantal banen, bedoeld in de onderdelen a en b, uitgedrukt
      in verloonde uren.

      3 Voor de toepassing van het tweede lid wordt niet als arbeidsbeperkte beschouwd de persoon die arbeid verricht
      in een dienstbetrekking in de zin van [artikel 2 van de Wet sociale werkvoorziening][ref1], met dien verstande dat
      deze persoon voor zover het betreft de verloonde uren in aangiftetijdvakken waarin hij ter beschikking is gesteld
      aan een andere werkgever om onder zijn leiding en toezicht arbeid te verrichten, wel als arbeidsbeperkte wordt
      beschouwd.

      4 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties rapporteert jaarlijks na afloop van het kalenderjaar
      hoeveel extra banen voor arbeidsbeperkten zijn gerealiseerd door overheidswerkgevers als bedoeld in de Wet
      financiering sociale verzekeringen ten opzichte van het daaraan voorafgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
