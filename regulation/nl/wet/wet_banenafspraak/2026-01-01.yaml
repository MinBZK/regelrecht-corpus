    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt onder een arbeidsbeperkte verstaan de persoon die is
      opgenomen in de registratie doelgroep banenafspraak, bedoeld in [artikel 3, eerste lid][ref1], zijnde de persoon:

      a. die met ondersteuning bij de arbeidsinschakeling van het college van burgemeester
      en wethouders op grond van [artikel 7, eerste lid, onderdeel a][ref2], of
      [artikel 7a, eerste lid, onderdeel a, of derde lid, van de Participatiewet][ref3] naar een
      dienstbetrekking is of wordt toegeleid of ten behoeve van wie loonkostensubsidie wordt verstrekt op grond van
      [artikel 10d, tweede lid, van de Participatiewet][ref4], en van wie op verzoek van het college van burgemeester
      en wethouders of op eigen verzoek door het UWV is vastgesteld dat hij niet in staat is tot het verdienen van het
      wettelijk minimumloon, bedoeld in [artikel 2, onderdeel c, van de Participatiewet][ref5], dan wel van wie door het
      college van burgemeester en wethouders in overeenstemming met de eisen gesteld aan een loonwaardevaststelling op
      grond van artikel 10d, eerste of tweede lid, van de Participatiewet een loonwaarde is vastgesteld die bij voltijdse
      arbeid minder bedraagt dan het wettelijk minimumloon, bedoeld in artikel 2, onderdeel c, van de Participatiewet;

      b. die geïndiceerd is als bedoeld in de [Wet sociale werkvoorziening][ref6] of een nog geldende
      indicatiebeschikking heeft op grond van [artikel 11 van die wet][ref7], zoals dat artikel luidde op 31 december
      2014;

      c. die recht heeft op arbeidsondersteuning of een arbeidsongeschiktheidsuitkering op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref8], met dien verstande dat de persoon die
      duurzaam geen mogelijkheden tot arbeidsparticipatie heeft als bedoeld in de [artikelen 1a:1, eerste lid][ref9],
      [2:4, eerste lid][ref10], of [3:8a, eerste lid, van die wet][ref11] slechts wordt aangemerkt als arbeidsbeperkte
      indien die persoon arbeid verricht in een dienstbetrekking;

      d. die voldoet aan een bij of krachtens algemene maatregel van bestuur vastgestelde indicatie;

      e. die op of na 1 januari 2013 een persoon was als bedoeld in onderdeel b of c, en op 1 mei
      2015 niet langer een zodanige persoon was, met uitzondering van de persoon, bedoeld in
      onderdeel c, die duurzaam geen mogelijkheden tot arbeidsparticipatie meer heeft als bedoeld in
      [artikel 1a:1 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref12];

      f. die naar het oordeel van het UWV wegens ziekte of gebrek ontstaan voordat de
      leeftijd van 18 jaren is bereikt of in de tijd dat hij studerende was als bedoeld in
      [artikel 1:4 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref13] een belemmering
      ondervindt in het verrichten van arbeid in dienstbetrekking, en zonder een voorziening als bedoeld in
      [artikel 10 van de Participatiewet][ref14] of [artikel 35 van de Wet werk en inkomen naar arbeidsvermogen][ref15]
      niet in staat is tot het verdienen van het wettelijk minimumloon, bedoeld in
      [artikel 2, onderdeel c, van de Participatiewet][ref16]; of

      g. die als werknemer werkzaam is in een dienstbetrekking als bedoeld in
      [artikel 78d, eerste lid, van de Participatiewet][ref17] of werkzaam is op basis van een arbeidsovereenkomst als
      bedoeld in dat artikel.

      2 In deze wet en de daarop berustende bepalingen wordt onder arbeidsbeperkte tevens verstaan de persoon die niet
      langer aan de voorwaarden op grond van het eerste lid, onderdelen a tot en met g, voldoet, zolang zijn opname in de
      registratie doelgroep banenafspraak nog niet is geëindigd.

      3 In afwijking van het eerste lid wordt de persoon, van wie door het college van burgemeester en wethouders
      is vastgesteld dat hij uitsluitend in een beschutte omgeving onder aangepaste omstandigheden mogelijkheden tot
      arbeidsparticipatie heeft als bedoeld in [artikel 10b, eerste lid, van de Participatiewet][ref18], niet opgenomen
      in de registratie doelgroep banenafspraak.

      4 Met betrekking tot de beoordeling door het UWV of een persoon de kenmerken heeft, bedoeld in het eerste lid,
      onderdeel a of f, en met betrekking tot de voorzieningen, bedoeld in het eerste lid, onderdeel f, worden bij of
      krachtens algemene maatregel van bestuur regels gesteld.


