  - number: '5'
    text: |-
      1 De quotumregeling wordt niet uitgevoerd dan nadat bij regeling van Onze Minister, in overeenstemming met
      het gevoelen van de ministerraad, tot activering is besloten indien is gebleken dat het aantal banen voor
      arbeidsbeperkten in een bepaald kalenderjaar in onvoldoende mate is toegenomen ten opzichte van het aantal van deze
      banen op 1 januari 2013.

      2 Een krachtens het eerste lid vastgestelde ministeriële regeling wordt gelijktijdig aan de beide kamers
      der Staten-Generaal overgelegd. De ministeriële regeling treedt niet eerder in werking dan vier weken na de
      overlegging.
    url: https://wetten.overheid.nl/BWBR0051018/2026-01-01#Artikel5
  - number: '6'
    text: |-
      1 De premie, bedoeld in [artikel 36, eerste lid, van de Wfsv][ref1], wordt na een activering als bedoeld in
      [artikel 5, eerste lid][ref2], verhoogd met een inclusiviteitsopslag. De inclusiviteitsopslag is verschuldigd met
      ingang van 1 januari van het tweede kalenderjaar na het kalenderjaar waarin tot activering is besloten.

      2 De inclusiviteitsopslag is verschuldigd door de werkgever.

      3 De inclusiviteitsopslag is niet verschuldigd indien het een kleine werkgever betreft, als bedoeld in
      [artikel 36 van de Wfsv][ref3].

      4 De inclusiviteitsopslag is tevens niet verschuldigd:

      a. door een werkgever met betrekking tot een uitgeleende werknemer;

      b. door een werkgever met betrekking tot een werknemer die werkzaam is in een dienstbetrekking in de
      zin van [artikel 2 van de Wet sociale werkvoorziening][ref4], waarbij die werknemer niet ter beschikking
      wordt gesteld aan een andere werkgever, dan wel werkzaam is in een dienstbetrekking als bedoeld in
      [artikel 10b, eerste lid, van de Participatiewet][ref5];

      c. over een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref6],
      de [Wet op de arbeidsongeschiktheidsverzekering][ref7], de [Ziektewet][ref8],
      [hoofdstuk 3, afdeling 2, paragraaf 1][ref9], of de [artikelen 4:2b, eerste tot en met zesde lid][ref10],
      en [6.3, eerste tot en met zesde lid, van de Wet arbeid en zorg][ref11], de [Werkloosheidswet][ref12],
      en de aanvullingen op deze uitkeringen van degene tot wie de werknemer in dienstbetrekking
      staat, en over een toeslag op grond van de [Toeslagenwet][ref13]. Met een uitkering
      op grond van de Werkloosheidswet wordt gelijkgesteld een wachtgeld als bedoeld in
      [artikel 1, onderdeel r, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref14].

      5 Het UWV stelt het gemiddelde premieplichtig loon per werknemer vast.

      6 De inclusiviteitsopslag wordt vastgesteld bij regeling van Onze Minister als een voor alle takken van bedrijf
      en beroep gelijk opslagpercentage op het in [artikel 36 van de Wfsv][ref15] bedoelde hoge premiepercentage.
      [Artikel 35 van de Wfsv][ref16] is van overeenkomstige toepassing.

      7 Op de heffing en invordering van de inclusiviteitsopslag zijn de [artikelen 57][ref17], [59][ref18] en
      [60 van de Wfsv][ref19] van overeenkomstige toepassing.

      8 Voor de vaststelling of de inclusiviteitsopslag op grond van het vierde lid voor een bepaalde werknemer niet
      is verschuldigd is de situatie op de eerste dag dat de werknemer in dienst is in het betreffende aangiftetijdvak
      bepalend voor het gehele aangiftetijdvak.


