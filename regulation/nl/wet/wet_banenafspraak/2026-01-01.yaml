  - number: '3'
    text: |-
      1 Het UWV draagt zorg voor de inrichting en de adequate werking van de registratie van arbeidsbeperkten in de
      registratie doelgroep banenafspraak en is de verwerkingsverantwoordelijke in de zin van artikel 4, onderdeel 7, van
      de Algemene verordening gegevensbescherming met betrekking tot de verwerking van persoonsgegevens als bedoeld in
      die verordening, ten behoeve van deze registratie.

      2 Het UWV verwerkt in de registratie, bedoeld in het eerste lid, de gegevens over arbeidsbeperkten met het
      oog op het bevorderen van de arbeidsdeelname van deze personen, en ten behoeve van de uitvoering van de
      [artikelen 4][ref1] en [5][ref2] van deze wet en van de quotumregeling.

      3 Het college van burgemeester en wethouders verstrekt het UWV uit eigen beweging en
      verplicht op verzoek van het UWV kosteloos de gegevens over de arbeidsbeperkten, bedoeld in
      [artikel 2, eerste lid, onderdelen a, b, d, f en g][ref3], die noodzakelijk zijn voor de taak, bedoeld in het
      eerste lid.

      4 Het UWV verstrekt het college van burgemeester en wethouders en de Belastingdienst uit eigen beweging en
      verplicht op verzoek kosteloos gegevens uit de registratie, bedoeld in het eerste lid, die noodzakelijk zijn voor
      de uitvoering van zijn taken.

      5 Het UWV is bevoegd gegevens die het verwerkt voor de uitvoering van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4] en voor de uitvoering van de taak, bedoeld in
      [artikel 30d van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5], te verwerken ten behoeve van de
      registratie, bedoeld in het eerste lid.

      6 Het UWV en de Belastingdienst zijn bevoegd de gegevens, die zij verwerken op grond van
      [artikel 33 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref6] tevens te verwerken voor zover
      deze noodzakelijk zijn voor de bevordering van arbeidsdeelname van arbeidsbeperkten en voor de uitvoering van de
      quotumregeling.

      7 Het UWV deelt op verzoek aan een werkgever over een door middel van het burgerservicenummer aangeduide persoon
      mede:

      a. of de door de werkgever aangeduide werknemer, persoon met wie hij verwacht een dienstbetrekking aan te gaan,
      of persoon die onder zijn toezicht en leiding arbeid verricht of ter beschikking is gesteld als bedoeld in
      [artikel 4, derde lid][ref7], is opgenomen in de registratie, bedoeld in het eerste lid; of

      b. gedurende welke periode in een lopend kalenderjaar of in het voorgaande kalenderjaar deze persoon is opgenomen
      in de registratie, bedoeld in het eerste lid.

      8 Het college van burgemeester en wethouders en het UWV informeren de persoon op wie de gegevens betrekking
      hebben over de verwerking van zijn gegevens op grond van dit artikel voordat de gegevens worden vastgelegd in de
      registratie, bedoeld in het eerste lid, of worden verstrekt met het oog op die vastlegging, tenzij deze persoon
      redelijkerwijs hiervan kennis draagt.

      9 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld, in ieder geval met betrekking tot:

      a. de inrichting, de gegevensset en de wijze van verkrijging van de gegevens ten behoeve van de registratie,
      bedoeld in het eerste lid, en

      b. de geldigheidsduur van de registratie van de persoon en het vervallen van de registratie van de persoon.

      10 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot:

      a. de verstrekking door het UWV van gegevens uit de registratie, bedoeld in het eerste lid, aan de werkgevers,
      bedoeld in het zevende lid; en

      b. de verstrekking van gegevens aan het UWV door de werkgevers, bedoeld in het zevende lid, in verband met het
      verrichten van arbeid door arbeidsbeperkten als bedoeld in [artikel 4, derde lid][ref8].


