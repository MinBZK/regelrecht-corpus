preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de arbeidsdeelname van mensen met een arbeidsbeperking
    te verbeteren en daarbij de regels inzake de banenafspraak en de quotumregeling voor mensen met een
    arbeidsbeperking te vereenvoudigen;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0051018/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder

        - *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;
        - *premieplichtig loon:* het loon, bedoeld in [paragraaf 1 van afdeling 1 van hoofdstuk 3 van de Wfsv][ref1],
      waarover op grond van [hoofdstuk 3 van de Wfsv][ref2] premies worden geheven;
        - *quotumregeling:* de regeling waarbij na een activering op grond van [artikel 5][ref3] de inclusiviteitsopslag,
      bedoeld in [artikel 6][ref4], van kracht wordt waarbij tevens het loonkostenvoordeel doelgroep banenafspraak,
      bedoeld in [artikel 2.10 van de Wtl][ref5], wordt verhoogd met de banenafspraakbonus, bedoeld in
      [artikel 2.13, tweede lid, van de Wtl][ref6];
        - *uitgeleende werknemer:* 1°. werknemer die werkzaam is op grond van een uitzendovereenkomst als bedoeld in
      [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref7]; of 2°. werknemer die werkzaam is in een dienstbetrekking
      in de zin van [artikel 2 van de Wet sociale werkvoorziening][ref8], waarbij bij de uitvoering van dat artikel die
      werknemer ter beschikking wordt gesteld aan een andere werkgever;
        - *UWV:* het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref9];
        - *verloonde uren:* de uren waarover loon is betaald en waarvan door de werkgever ingevolge
      [artikel 28, eerste lid, onderdeel d, van de Wet op de loonbelasting 1964][ref10] opgave aan de inspecteur is
      gedaan;
        - *werkgever:* de werkgever in de zin van de [Werkloosheidswet][ref11], de [Ziektewet][ref12], de
      [Wet werk en inkomen naar arbeidsvermogen][ref13] of de [Wet op de arbeidsongeschiktheidsverzekering][ref14];
        - *Wfsv:* de [Wet financiering sociale verzekeringen][ref15];
        - *Wtl:* de [Wet tegemoetkomingen loondomein][ref16].


