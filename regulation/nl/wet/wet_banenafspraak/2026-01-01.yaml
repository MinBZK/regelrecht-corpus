        artikel: '2'
        hoofdstuk: I
  - number: '12'
    text: |-
      1 Deze wet is niet van toepassing met betrekking tot kalenderjaren, gelegen voor de datum van inwerkingtreding van
      [artikel 2][ref1] van deze wet.

      2 Over de in het eerste lid bedoelde kalenderjaren blijven de bepalingen bij of krachtens
      [hoofdstuk 3, afdeling 4][ref2], en de [artikelen 122n][ref3] en [122na van de Wfsv][ref4] inzake het quotum van
      arbeidsbeperkten van toepassing, zoals deze luidden op de dag voorafgaand aan de in het eerste lid bedoelde datum
      van inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0051018#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Afdeling4
