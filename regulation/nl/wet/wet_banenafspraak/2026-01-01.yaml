  - number: '11'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van [artikel 2][ref1] van deze wet aan de Staten-
      Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0051018#Artikel2
    url: https://wetten.overheid.nl/BWBR0051018/2026-01-01#Artikel11
