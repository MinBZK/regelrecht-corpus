  - number: 10a
    text: |-
      Tegen besluiten krachtens bij algemene maatregel van bestuur gegeven voorschriften die berusten of mede
      berusten op [artikel 9, eerste lid, onderdeel ][ref1], en tegen besluiten van Onze Minister ter uitvoering
      van [artikel 10, tweede lid][ref2], staat beroep op de administratieve rechter open overeenkomstig
      [hoofdstuk 20 van de Wet milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001870#Artikel9
