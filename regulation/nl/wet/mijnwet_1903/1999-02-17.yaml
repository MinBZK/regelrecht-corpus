        artikel: 8e
  - number: 8h
    text: |-
      Alvorens op een aanvraag om een concessie te beslissen, stelt Onze Minister gedeputeerde staten van de betrokken
      provincie in de gelegenheid daaromtrent advies uit te brengen.
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel8h
  - number: 8i
    text: |-
      1 Onze Minister beslist op een aanvraag om een concessie binnen zes maanden na de ontvangst daarvan dan wel,
      indien toepassing is gegeven aan [artikel 8][ref1], binnen zes maanden na afloop van de termijn, bedoeld in
      [artikel 8][ref2].

      2 Onze Minister kan de termijn, waarbinnen hij op een aanvraag dient te beslissen, eenmaal met ten hoogste drie
      maanden verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0001870#Artikel8g
      [ref2]: https://wetten.overheid.nl/BWBR0001870#Artikel8g
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel8i
    references:
      - id: ref1
        bwb_id: BWBR0001870
        artikel: 8g
      - id: ref2
        bwb_id: BWBR0001870
        artikel: 8g
  - number: 8j
    text: |-
      Een beschikking tot verlening van een concessie treedt eerst in werking nadat de houder aan Onze Minister
      schriftelijk heeft doen blijken dat hij de concessie met de beperkingen en voorschriften zonder voorbehoud
      aanvaardt en de daarin voorgeschreven zekerheid heeft gesteld. Dit kan slechts tot uiterlijk vier weken nadat de
      beschikking onherroepelijk is geworden. Is dit niet geschied vóór dat tijdstip, dan vervalt de beschikking.
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel8j
  - number: 8k
    text: |-
      1 Onze Minister kan een concessie op aanvraag van de houder wijzigen of intrekken.

      2 Indien een aanvraag als bedoeld in het eerste lid strekt tot verlenging van het tijdvak waarvoor een concessie
      geldt, wordt deze slechts ingewilligd indien het in de concessie vastgestelde tijdvak onvoldoende is om de
      activiteiten, waarvoor de concessie geldt, te voltooien en deze activiteiten zijn verricht in overeenstemming met
      de concessie.

      3 In een beschikking, waarbij het tijdvak waarvoor een concessie geldt wordt verlengd, kan het gebied waarvoor die
      concessie geldt worden beperkt tot dat deel van het gebied, waarbinnen de ontginning reeds is aangevangen en nog
      niet is beëindigd.

      4 Ten aanzien van een beschikking tot wijziging van een concessie is [artikel 8][ref1] van overeenkomstige
      toepassing.

      5 Onze Minister kan een concessie anders dan op aanvraag intrekken, indien de houder een aan een concessie
      verbonden voorschrift, waarbij is bepaald dat overtreding daarvan een grond is voor het intrekken van de concessie,
      heeft overtreden, en, nadat Onze Minister hem schriftelijk heeft gewaarschuwd, zich voortdurend of opnieuw aan
      overtreding van dat voorschrift schuldig maakt of, zo het voorschrift een verplichting om te doen inhoudt, deze
      verplichting niet alsnog nakomt.

      6 Onze Minister kan een concessie anders dan op aanvraag intrekken, indien de concessie niet langer nodig is voor
      de goede uitvoering van de activiteiten waarvoor zij geldt. Hij doet dit onder de genoemde omstandigheden in elk
      geval, indien het een concessie voor koolwaterstoffen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0001870#Artikel8j
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel8k
    references:
      - id: ref1
        bwb_id: BWBR0001870
        artikel: 8j
  - number: 8l
    text: |-
      1 De houder van een concessie kan zijn concessie geheel of gedeeltelijk aan een ander overdragen, nadat hij daartoe
      van Onze Minister schriftelijk toestemming heeft gekregen.

      2 De toestemming kan slechts worden geweigerd op grond van de technische of financiële mogelijkheden van de ander
      of op grond van de manier waarop de ander voornemens is de ontginning in het over te dragen gebied te verrichten.
      Met betrekking tot concessies voor koolwaterstoffen is [artikel 3, tweede en derde lid][ref1], van overeenkomstige
      toepassing.

      3 Ten aanzien van een beschikking waarbij toestemming tot overdracht van een concessie wordt verleend, is
      [artikel 8][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001870#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001870#Artikel8j
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel8l
    references:
      - id: ref1
        bwb_id: BWBR0001870
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0001870
        artikel: 8j
  - number: 8m
    text: |-
      1 Onze Minister zendt aan de Commissie van de Europese Gemeenschappen ieder jaar een verslag met gegevens over:

      a. de gebieden die voor de opsporing en ontginning van koolwaterstoffen zijn vrijgegeven;

      b. de verleende vergunningen en concessies voor koolwaterstoffen;

      c. de houders van de verleende vergunningen en concessies voor koolwaterstoffen;

      d. de samenstelling van de houders, bedoeld onder *c*;

      e. de geraamde reserves aan koolwaterstoffen.

      2 Onze Minister legt het verslag voor een ieder ter inzage. Hij doet hiervan mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel8m
  - number: '9'
    text: |-
      1 Bij algemene maatregel van bestuur worden voorschriften gegeven:

      a. ter verzekering van de veiligheid bij de mijnontginning en bij mijnbouwkundige onderzoekingen en van de
      bescherming van de in artikel 2 van de wet van 21 april 1810 (Bulletin des Lois no. 285) bedoelde delfstoffen
      bij die onderzoekingen, zomede in het belang van de veiligheid en de gezondheid van mensen en dieren bij het
      verblijf in de ondergrondse werken van mijnen, benevens in de bij een mijn behorende bovengronds gelegen werken
      en inrichtingen, bij algemene maatregel van bestuur aangewezen, alsmede in de bij mijnbouwkundige onderzoekingen
      behorende werken en inrichtingen, onder andere betreffende:

      de inrichting van de ontginningswerken en van de afbouw, benevens het bijhouden van plans en registers;

      het verkeer op de terreinen en in de inrichtingen boven de grond;

      de toegang tot de ondergrondse werken en de inrichting van en het verkeer door de schachten;

      het verkeer in de ondergrondse werken;

      de middelen tot verwijdering van het overtollige water;

      de verlichting, de luchtverversing en de maatregelen te nemen tot het bevorderen van een dragelijke temperatuur en
      tot het verwijderen van schadelijke dampen, gassen en stof;

      de aanwezigheid en de inrichting van was-, bad- en kleedgelegenheden en schaftlokalen alsmede van privaten;

      het verstrekken van goed drinkbaar water;

      de maatregelen te nemen tot het voorkomen van brand en ontploffing en tot het voorkomen van ongevallen door
      werktuigen, werktuigdelen, drijfwerken, gereedschappen of elektrische geleidingen, door vallen of door vallende
      voorwerpen;

      het vervoer, de opslag en het gebruik van ontplofbare stoffen;

      de bij ongevallen of bij gevaar voor ongevallen te nemen maatregelen;

      b. in het belang van de veiligheid en de gezondheid van personen beneden de 18 jaar, dat zij bepaalde soorten
      van arbeid of arbeid onder bepaalde omstandigheden niet verrichten of slechts verrichten met inachtneming van
      beperkingen en voorschriften bij die maatregel gesteld;

      c. in het belang van de bescherming van het milieu met betrekking tot

      1°. bij mijnen behorende, ondergronds gelegen werken en inrichtingen, en

      2°. bij mijnen behorende, bovengronds gelegen werken en inrichtingen of delen daarvan, voor zover deze technisch
      samenhangen met werken en inrichtingen als onder 1° bedoeld.

      2 Bovendien kunnen bij algemene maatregel van bestuur voorschriften worden gegeven ter verzekering
      van de veiligheid bij de ontginning of bij ander gebruik van ondergrondse steengroeven, voor zover de
      Arbeidsomstandighedenwet en de [Wet milieubeheer][ref1] daarin niet voorzien.

      3 Bij een krachtens het eerste of het tweede lid vast te stellen algemene maatregel van bestuur kan door Ons aan
      Onze Minister worden opgedragen ter uitvoering van bepaalde voorschriften nadere regelen vast te stellen, dan wel
      in die algemene maatregel voorziene ontheffingen of vergunningen, zo nodig onder bepaalde voorwaarden, te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel9
    references:
