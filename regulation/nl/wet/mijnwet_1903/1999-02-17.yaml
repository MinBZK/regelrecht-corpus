  - number: '11'
    text: |-
      1 Overtreding van in [artikel 9][ref1] bedoelde voorschriften, nadere regelen of voorwaarden, voor zover niet
      bedoeld in artikel 9, eerste lid, onder *c*, of van artikel 5 der wet van 21 april 1810 (Bulletin des Lois no.
      285) wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie. Eveneens met
      hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft overtreding van een
      voorschrift, gesteld krachtens [artikel 7, eerste lid][ref2], voor zover niet [artikel 7, vierde lid][ref3],
      toepassing heeft gevonden.

      2 De strafbare feiten in dit artikel bedoeld worden beschouwd als overtredingen.

      3 Met de opsporing van overtredingen van de bij of krachtens deze wet gestelde voorschriften en
      voorwaarden en van artikel 5 der wet van 21 april 1810 (*Bulletin des Lois* no. 285) zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref4], belast de daartoe bij of krachtens algemene
      maatregel van bestuur aangewezen buitengewone opsporingsambtenaren. Deze ambtenaren zijn tevens belast
      met de opsporing van de feiten, strafbaar gesteld in de [artikelen 179][ref5] tot en met [182][ref6] en
      [184 van het Wetboek van Strafrecht][ref7], voor zover deze feiten betrekking hebben op een bevel, vordering of
      handeling, gedaan of ondernomen door henzelf.


