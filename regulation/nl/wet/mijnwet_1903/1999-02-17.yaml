  - number: '12'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij of krachtens algemene
      maatregel van bestuur aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel12
  - number: '13'
    text: |-
      De krachtens [artikel 11, derde lid][ref1], en [artikel 12][ref2] aangewezen ambtenaren zijn bevoegd, met
      medeneming van de benodigde apparatuur, een woning binnen te treden zonder toestemming van de bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0001870#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0001870#Artikel12
