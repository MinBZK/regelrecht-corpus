preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, saluut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is nadere bepalingen betreffende de mijnontginning, met
    wijziging der wet van 21 April 1810 (Bulletin des Lois n°. 285), vast te stellen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      *concessie:* een concessie als bedoeld in artikel 5 van de wet van 21 april 1810 (Bulletin des Lois no. 285);

      *vergunning:* een vergunning als bedoeld in [artikel 2 van de Wet opsporing delfstoffen][ref1];

      *Onze Minister:* Onze Minister van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0002579#Artikel2
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002579
        artikel: '2'
  - number: '2'
    text: Op de aanvraag om een concessie wordt beslist door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel2
  - number: '3'
    text: |-
      1 Onverminderd [artikel 6][ref1] kan een concessie slechts worden geweigerd:

      a. op grond van de technische of financiële mogelijkheden van de aanvrager,

      b. op grond van de manier waarop de aanvrager voornemens is de ontginning in het gebied, waarvoor de concessie
      wordt aangevraagd, te verrichten, of

      c. in het belang van een doelmatige en voortvarende opsporing en ontginning, indien een keuze moet worden gemaakt
      uit twee of meer aanvragen die bij een beoordeling op grond van de onderdelen *a* en *b* gelijkwaardig zijn
      gebleken.

      2 Onze Minister stelt met het oog op de toepassing van het eerste lid nadere regels vast, die hij bij zijn
      beslissing op een aanvraag om een concessie voor koolwaterstoffen in acht zal nemen.

      3 Van de plaatsing in de Staatscourant van een besluit tot vaststelling van nadere regels als bedoeld in het tweede
      lid wordt mededeling gedaan in het Publikatieblad van de Europese Gemeenschappen. Een besluit tot wijziging van
      zodanige regels wordt mede bekendgemaakt in het Publikatieblad van de Europese Gemeenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0001870#Artikel6
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001870
        artikel: '6'
  - number: '4'
    text: |-
      1 In een concessie wordt bepaald voor welke delfstof of voor welke delfstoffen zij geldt.

      2 In een concessie wordt bepaald voor welk gebied zij geldt. Indien het een concessie voor koolwaterstoffen
      betreft, geschiedt dit zodanig dat de uitoefening van de activiteiten uit technisch en economisch oogpunt op zo
      goed mogelijke wijze kan plaatsvinden. Onze Minister stelt nadere regels vast met het oog op de toepassing van de
      vorige volzin.

      3 In een concessie wordt bepaald voor welk tijdvak zij geldt. Indien het een concessie voor koolwaterstoffen
      betreft, geschiedt dit zodanig dat dit tijdvak niet langer is dan noodzakelijk om de activiteiten, waarvoor de
      concessie wordt verleend, te verrichten.

      4 Een concessie kan tevens onder andere beperkingen worden verleend dan die, bedoeld in het eerste, tweede en
      derde lid. Een concessie voor koolwaterstoffen kan slechts onder andere beperkingen worden verleend indien deze
      worden gerechtvaardigd door de veiligheid, de landsverdediging, de milieubescherming of een planmatig beheer van
      voorkomens van koolwaterstoffen. In dat geval is [artikel 8][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001870#Artikel8d
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001870
        artikel: 8d
  - number: '5'
    text: |-
      De houder van een concessie is voor het tijdvak waarvoor deze is verleend eigenaar van de mijn waarop zij
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel5
  - number: '6'
    text: |-
      Een concessie voor een delfstof wordt niet verleend voor een gebied waarvoor reeds een vergunning of concessie voor
      die delfstof geldt.
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel6
  - number: '7'
    text: |-
      1 Aan een concessie kunnen voorschriften worden verbonden.

      2 Indien het een concessie voor koolwaterstoffen betreft, kunnen aan de concessie slechts voorschriften worden
      verbonden indien zij:

      a. gericht zijn op de betaling van een bijdrage in geld of in koolwaterstoffen dan wel op het veilig stellen van
      belastinginkomsten of

      b. gerechtvaardigd worden door de veiligheid, de landsverdediging, de milieubescherming of een planmatig beheer van
      voorkomens van koolwaterstoffen.

      3 In een concessie kan worden bepaald dat Onze Minister daarbij omschreven bevoegdheden heeft ter uitvoering van
      daarbij aangewezen voorschriften.

      4 In een concessie kan worden bepaald dat overtreding van daarbij aangewezen voorschriften een grond is voor
      intrekking van de concessie.
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel7
  - number: '8'
    text: |-
      Aan een concessie voor koolwaterstoffen kunnen de voorschriften worden verbonden:

      a. dat daarin aangeduide inrichtingen, welke bij het gebruik maken van de concessie worden gebezigd, aan de houder
      toebehoren;

      b. dat de houder een daarin bepaalde zekerheid zal stellen en gesteld houden voor de betaling van hetgeen hij
      ingevolge deze wet als houder van de concessie dan wel door het gebruik maken daarvan aan de Staat verschuldigd
      zal worden; zodanig voorschrift blijft, ook nadat de concessie haar kracht heeft verloren, gedurende een daarbij
      bepaalde termijn van kracht.
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel8
  - number: 8a
    text: |-
      Aan een concessie voor koolwaterstoffen kunnen de voorschriften worden verbonden, dat de houder aan de Staat:

      a. telkens op in de concessie bepaalde tijdstippen een daarin vastgesteld bedrag, berekend naar de waarde der
      ontgonnen delfstoffen, verschuldigd wordt;

      b. telkens op in de concessie bepaalde tijdstippen een daarin vastgesteld bedrag, berekend naar de met de
      ontginning behaalde winst, verschuldigd wordt;

      c. op in de concessie bepaalde tijdstippen een daarin vastgesteld oppervlakterecht verschuldigd wordt.
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel8a
  - number: 8b
    text: |-
      Aan een concessie voor koolwaterstoffen kunnen de voorschriften worden verbonden:

      a. dat de houder aan de desbetreffende gemeente of gemeenten een bedrag ineens, dan wel, indien het gemeentebestuur
      daarom verzoekt, een jaarlijks bedrag, verschuldigd wordt, berekend naar de oppervlakte van het terrein of van de
      uitbreiding ervan, waar in verband met de ontginning van de delfstoffen een of meer putten of een of meer direct
      met de ontginning verband houdende installaties aanwezig zijn;

      b. dat de houder aan de eigenaren van binnen het concessiegebied gelegen grond een jaarlijkse uitkering of een
      uitkering ineens verschuldigd wordt, naar keuze van de houder.
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel8b
  - number: 8c
    text: |-
      Aan een concessie voor koolwaterstoffen kunnen de voorschriften worden verbonden, dat de houder, indien hij met
      gebruikmaking van die concessie of van een vergunning de betrokken delfstof in een economisch winbare hoeveelheid
      heeft aangetoond:

      a. de door Onze Minister verlangde medewerking zal verlenen aan de totstandkoming van een overeenkomst van
      maatschap voor de ontginning van die delfstof, waarin de houder en een in de concessie aangewezen naamloze
      vennootschap of besloten vennootschap met beperkte aansprakelijkheid, waarvan alle aandelen middellijk of
      onmiddellijk aan de Staat toebehoren, op een in de concessie bepaalde wijze belang nemen, en krachtens welke
      overeenkomst de houder slechts voor rekening van die maatschap zal ontginnen;

      b. zo die delfstof zich bevindt in een voorkomen, dat naar het oordeel van Onze Minister de grens van het betrokken
      gebied overschrijdt, de door Onze Minister verlangde medewerking zal verlenen aan de totstandkoming van een
      overeenkomst tussen de houder en de voor een aangrenzend gebied tot ontginning gerechtigde, krachtens welke de
      ontginning in onderling overleg zal geschieden.
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel8c
  - number: 8d
    text: |-
      1 Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de aan een concessie voor
      koolwaterstoffen te verbinden voorschriften, bedoeld in [artikel 7, tweede lid, onder ][ref1].

      2 Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-
      Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken
      bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers of door ten
      minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat de
      inwerkingtreding van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een daartoe
      strekkend voorstel van wet zo spoedig mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien
      een van de beide kamers van de Staten-Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel
      van bestuur ingetrokken.

      3 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de aan een concessie voor
      koolwaterstoffen te verbinden voorschriften, bedoeld in [artikel 7, tweede lid, onder ][ref2].

      4 Aan een concessie voor koolwaterstoffen kunnen geen andere voorschriften worden verbonden dan die welke
      voortvloeien uit de algemene maatregel van bestuur, bedoeld in het eerste lid, of de ministeriële regeling, bedoeld
      in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001870#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001870#Artikel7
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel8d
    references:
      - id: ref1
        bwb_id: BWBR0001870
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0001870
        artikel: '7'
  - number: 8e
    text: |-
      1 Indien de houder van een vergunning voor een delfstof met gebruikmaking van die vergunning die delfstof in een
      economisch winbare hoeveelheid heeft aangetoond, wordt hem op zijn aanvraag, ingediend gedurende de geldingsduur
      van de vergunning, een concessie voor die delfstof verleend voor het gebied waarvoor de vergunning geldt, dan
      wel, ingeval de aanwezigheid van de betrokken delfstof slechts in een deel van dat gebied is aangetoond, voor
      het deel van het gebied, waarvoor verlening van de concessie op grond van de aantoning uit geologisch oogpunt
      gerechtvaardigd is.

      2 Het eerste lid geldt niet indien weigering van de concessie gerechtvaardigd wordt door een wijziging in de
      technische of financiële mogelijkheden van de houder van de vergunning of door de manier waarop de aanvrager
      voornemens is de ontginning in het gebied, waarvoor de concessie wordt aangevraagd, te verrichten. Met betrekking
      tot concessies voor koolwaterstoffen is [artikel 3, tweede en derde lid][ref1], van overeenkomstige toepassing.

      3 Indien op grond van het eerste lid een concessie voor koolwaterstoffen wordt verleend, geschiedt dit met
      inachtneming van de in [artikel 8d, eerste lid][ref2], bedoelde algemene maatregel van bestuur, zoals deze luidde
      op het tijdstip waarop de vergunning werd verleend.

      4 Indien een aanvraag als bedoeld in het eerste lid is ingediend, wordt de geldingsduur van de vergunning verlengd
      tot het tijdstip waarop de beschikking waarbij op de aanvraag wordt beslist in werking treedt.

      5 Indien op grond van het tweede lid een concessie is geweigerd en de daartoe strekkende beschikking onherroepelijk
      is geworden, kan ten aanzien van het gebied waarvoor de concessie was aangevraagd, een concessie voor de delfstof
      aan een ander worden verleend. Geschiedt dit binnen tien jaren nadat de beschikking tot weigering onherroepelijk
      is geworden, dan wordt in die concessie bepaald, welk bedrag de houder aan de in het eerste lid bedoelde
      vergunninghouder wegens vinderspremie en ter vergoeding van de door deze gemaakte kosten zal betalen.

      6 Op het tijdstip waarop een krachtens het eerste of vijfde lid genomen beschikking tot verlening van een concessie
      in werking is getreden, vervalt voor het gebied waarvoor de concessie geldt, de vergunning voor de delfstof.


      [ref1]: https://wetten.overheid.nl/BWBR0001870#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001870#Artikel8d
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel8e
    references:
      - id: ref1
        bwb_id: BWBR0001870
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0001870
        artikel: 8d
  - number: 8f
    text: |-
      1 Onze Minister stelt regels omtrent de wijze waarop de aanvraag om een concessie dient te geschieden en
      betreffende de gegevens en de bescheiden, welke daarbij moeten worden overgelegd.

      2 Bij de aanvraag om een concessie wordt in elk geval overgelegd een plan, volgens hetwelk de aanvrager voornemens
      is activiteiten te verrichten. Een dergelijk plan moet voldoen aan de bij de in het eerste lid bedoelde regels
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel8f
  - number: 8g
    text: |-
      1 Indien een aanvraag om een concessie wordt ingediend, worden anderen in de gelegenheid gesteld om aanvragen
      om een concessie voor dezelfde delfstof in te dienen voor hetzelfde gebied. Hiertoe plaatst Onze Minister een
      uitnodiging in de Staatscourant.

      2 Anderen kunnen aanvragen indienen gedurende dertien weken nadat de uitnodiging in de Staatscourant is geplaatst.

      3 Indien het een aanvraag om een concessie voor koolwaterstoffen betreft, wordt de uitnodiging tevens geplaatst
      in het Publikatieblad van de Europese Gemeenschappen. In dat geval wordt de in het tweede lid bedoelde termijn
      gerekend vanaf deze plaatsing.

      4 Op de aanvragen wordt tegelijk beslist. De uitnodiging maakt melding van het bepaalde in [artikel 8][ref1]*i*.

      5 Het eerste tot en met het vierde lid gelden niet ingeval een aanvraag betrekking heeft op een concessie, ten
      aanzien waarvan [artikel 8e, eerste lid][ref2], van toepassing is.

      6 Het eerste tot en met het vierde lid gelden mede niet ingeval een aanvraag om een concessie wordt ingediend door
      de houder van een vergunning of concessie voor een aangrenzend gebied en deze aanvraag is ingediend naar aanleiding
      van de aantoning van een zich gedeeltelijk in het aangrenzende en gedeeltelijk in het aangevraagde gebied bevindend
      economisch winbaar voorkomen. Onze Minister stelt de houders van een vergunning of concessie voor eventuele andere
      aangrenzende gebieden gedurende dertien weken in de gelegenheid om een aanvraag om een concessie voor dezelfde
      delfstof voor hetzelfde gebied in te dienen.

      7 Het eerste tot en met het vierde lid gelden voorts niet ingeval een aanvraag wordt ingediend binnen twee jaar
      na de indiening van een aanvraag om een concessie voor dezelfde delfstof voor hetzelfde gebied, zonder dat op die
      aanvraag of op aanvragen van anderen als bedoeld in het tweede lid een concessie is verleend. Onze Minister deelt
      in het Publikatieblad van de Europese Gemeenschappen mede op welke gebieden de eerste volzin met betrekking tot
      concessies voor koolwaterstoffen van toepassing is.

      8 Ten aanzien van overeenkomstig het tweede lid ingediende aanvragen wordt niet opnieuw toepassing gegeven aan het
      eerste tot en met het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001870#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001870#Artikel8e
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel8g
    references:
