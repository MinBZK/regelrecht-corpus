  - number: 10b
    text: |-
      1 Indien een concessie is verleend of overgedragen aan twee of meer natuurlijke personen of rechtspersonen
      gezamenlijk, is ieder van hen hoofdelijk aansprakelijk voor hetgeen ingevolge de concessie verschuldigd is.

      2 Het eerste lid geldt niet ten aanzien van een bedrag als bedoeld in [artikel 8][ref1].


