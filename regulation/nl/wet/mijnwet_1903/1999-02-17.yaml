        bwb_id: BWBR0003245
  - number: 9a
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van voorschriften, die berusten op of
      mede berusten op [artikel 9, eerste lid, onder ][ref1], ingeval als gevolg van een overtreding daarvan ernstige
      aantasting van door deze voorschriften beschermde belangen ontstaat of dreigt te ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001870#Artikel9
    url: https://wetten.overheid.nl/BWBR0001870/1999-02-17#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0001870
        artikel: '9'
  - number: '10'
    text: |-
      1 De paragrafen 3.5.2 tot en met 3.5.6 van de [Algemene wet bestuursrecht][ref1] alsmede
      [afdeling 13.2 van de Wet milieubeheer][ref2] zijn van overeenkomstige toepassing met betrekking tot
      vergunningen krachtens bij algemene maatregel van bestuur gegeven voorschriften die berusten of mede berusten op
      [artikel 9, eerste lid, onder ][ref3], voor zover dat bij die maatregel is bepaald.

      2 Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van voorschriften, die berusten op
      of mede berusten op [artikel 9, eerste lid, onder ][ref4]. Daarbij zijn de [artikelen 18.7][ref5] tot en met
      [18.11][ref6] en [18.14][ref7] tot en met [18.16 van de Wet milieubeheer][ref8] van overeenkomstige toepassing.

      3 De voordracht voor een algemene maatregel van bestuur krachtens [artikel 9, eerste lid, onder ][ref9], wordt
      Ons gedaan door Onze Minister in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer. Het ontwerp wordt overgelegd aan de Staten-Generaal en in de *Staatscourant* bekendgemaakt. Aan een
      ieder wordt de gelegenheid geboden binnen een bij die bekendmaking vast te stellen termijn van ten minste vier
      weken opmerkingen over het ontwerp schriftelijk ter kennis van Onze Minister te brengen. Een algemene maatregel van
      bestuur als bedoeld in de eerste volzin wordt, nadat hij is vastgesteld, toegezonden aan de Staten-Generaal. Hij
      treedt niet eerder in werking dan vier weken na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst.


