  - number: '20'
    text: |-
      1 Met de uitoefening van het toezicht op de naleving van deze wet zijn belast de door Onze Minister aangewezen
      toezichthouders.

      2 Met het toezicht op de kwaliteit van de aangeboden kanstrajecten is de inspecteur belast.

      3 De [artikelen 5:12][ref1], [5:15][ref2], [5:16][ref3] en [5:20 van de Algemene wet bestuursrecht][ref4] zijn
      van toepassing.


