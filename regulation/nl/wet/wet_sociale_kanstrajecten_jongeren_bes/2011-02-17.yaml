    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      **deelnemer:** de jongere die aan het voor hem vastgesteld sociaal kanstraject deelneemt;

      **deelnemersregister:** het register, bedoeld in [artikel 6, eerste lid][ref1], waarin de deelnemers staan
      ingeschreven;

      **inspecteur**: de inspecteur van het onderwijs, bedoeld in de [Wet op het onderwijstoezicht][ref2];.

      **jongere**: een ingezetene van het openbaar lichaam Bonaire, Sint Eustatius of Saba die de leeftijd van 18 jaar
      heeft bereikt, maar nog niet de leeftijd van 25 jaar;

      **kanstrajecttoelage**: een toelage als bedoeld in [artikel 11, eerste lid][ref3].

      **Onze Minister**: Onze Minister van Onderwijs, Cultuur en Wetenschap;

      **openbaar lichaam:**het openbaar lichaam Bonaire, Sint Eustatius of Saba;

      **persoonsbestand**: de gegevens met betrekking tot een jongere, zoals opgenomen in het deelnemersregister;

      **projectbureau**: het bureau, bedoeld in [artikel 5, eerste lid][ref4];

      **raamplan sociale kanstrajecten**: een plan als bedoeld in [artikel 8][ref5];

      **sociaal kanstraject:** een sociaal kanstraject als bedoeld in [artikel 9][ref6];

      **startkwalificatie WSKJ**: een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid onder a tot en met e, van de Wet educatie en beroepsonderwijs BES][ref7] of een diploma
      hoger algemeen voortgezet onderwijs of voorbereidend wetenschappelijk onderwijs als bedoeld in [artikel 13][ref8]
      onderscheidenlijk [artikel 14 van de Wet voortgezet onderwijs BES][ref9];

      **uitvoeringsinstantie:** een privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid die wordt bekostigd
      voor de uitvoering van de taak, bedoeld in [artikel 5, tweede lid][ref10];

      **voortijdige schoolverlater WSKJ:** degene die

      a. het onderwijs aan de school waaraan hij is ingeschreven gedurende een aaneengesloten periode van ten minste een
      maand of een door het bevoegd gezag te bepalen kortere periode zonder geldige reden niet meer volgt, of

      b. niet meer aan een school is ingeschreven en evenmin is ingeschreven aan een instelling als bedoeld in de
      [Wet educatie en beroepsonderwijs BES][ref11].

      2 Onder voortijdige schoolverlater wordt niet verstaan degene die beschikt over een startkwalificatie WSKJ.


