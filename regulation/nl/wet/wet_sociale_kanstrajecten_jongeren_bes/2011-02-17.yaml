  - number: '7'
    text: |-
      De in het deelnemersregister opgenomen gegevens worden uitsluitend gebruikt voor de uitvoering en handhaving van
      deze wet en zijn als zodanig uitsluitend toegankelijk voor de uitvoeringsinstantie en de in [artikel 20][ref1]
      bedoelde toezichthouders, voor zover deze gegevens redelijkerwijs noodzakelijk zijn voor de vervulling van hun
      taak.


      [ref1]: https://wetten.overheid.nl/BWBR0028506#Artikel20
    url: https://wetten.overheid.nl/BWBR0028506/2011-02-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028506
        artikel: '20'
  - number: '8'
    text: |-
      1 De uitvoeringsinstantie stelt een raamplan sociale kanstrajecten op, dat ten minste omvat:

      a. de vormings- en scholingsdoelen en de bijbehorende begin- en eindtermen;

      b. de modules en deelmodules;

      c. de inhoud, duur, de mogelijke kanstrajecten en praktijkonderdelen;

      d. de momenten en de wijze waarop de toetsen worden afgenomen;

      e. de termijn waarbinnen de resultaten van de toetsen bekend worden gemaakt aan de jongere;

      f. de instructietaal;

      g. de kwalificatie van de docenten, trajectbegeleiders en praktijkbegeleiders;

      h. de aard en intensiteit van de begeleiding van de jongere in de verschillende kanstrajecten;

      i. de wijze waarop het bedrijfsleven betrokken is bij de inhoud van kanstrajecten in de vorm van leerwerktrajecten
      en bijdraagt met stage- of praktijkplaatsen;

      j. de periode gedurende welke het raamplan sociale kanstrajecten van kracht is;

      k. een begroting van geraamde inkomsten en uitgaven, waarin ten minste worden opgenomen het aantal deelnemers,
      de aan hen te verstrekken kanstrajecttoelage en de zorg die bij het expertisecentrum onderwijszorg, bedoeld in
      [artikel 3.2. van de Wet educatie en beroepsonderwijs BES][ref1], wordt ingekocht.

      2 Het bestuurscollege stelt het raamplan sociale kanstrajecten vast binnen 60 dagen nadat het uitvoeringsinstantie
      dat aan hem heeft voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel3.2
    url: https://wetten.overheid.nl/BWBR0028506/2011-02-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '3.2'
  - number: '9'
    text: |-
      1 Op grond van de resultaten van de educatieve intake, bedoeld in [artikel 4][ref1], stelt de uitvoeringsinstantie
      een op zijn individuele situatie afgestemd sociaal kanstraject voor de jongere vast.

      2 Het kanstraject bestaat uit een of meerdere modulen die samengesteld zijn met het oog op:

      a. de persoonlijke ontplooiing;

      b. het leggen van een brede basis van algemene kennis en algemene en sociale vaardigheden;

      c. het leggen van een basis voor de bereidheid tot voortdurende persoonlijke ontwikkeling en uitbreiding van
      beroepsvaardigheden;

      d. het ontwikkelen van de nodige attitudes en vaardigheden om zich in een werkkring te kunnen handhaven;

      e. het verwerven van kennis van Papiaments of Engels, Nederlands, Spaans, rekenen, en het verwerven van
      computervaardigheden en praktische vaardigheden.

      3 Het kanstraject heeft een totale duur van ten minste zes maanden en ten hoogste twee jaar. De periode van twee
      jaar kan op aanvraag bij het projectbureau worden verlengd met ten hoogste zes maanden.

      4 Het kanstraject kan worden gewijzigd in verband met wijzigingen in de omstandigheden waarin de jongere verkeert.


      [ref1]: https://wetten.overheid.nl/BWBR0028506#Artikel4
    url: https://wetten.overheid.nl/BWBR0028506/2011-02-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028506
        artikel: '4'
  - number: '10'
    text: |-
      Nadat de deelnemer alle modules van het voor hem vastgestelde dan wel gewijzigde kanstraject met succes heeft
      afgerond, ontvangt hij een certificaat of een diploma, afhankelijk van de aard van het traject.
    url: https://wetten.overheid.nl/BWBR0028506/2011-02-17#Artikel10
  - number: '11'
    text: |-
      1 Een deelnemer komt in aanmerking voor een kanstrajecttoelage die bestaat uit:

      a. een maandelijkse tegemoetkoming, en

      b. een bijdrage in de kosten van kinderopvang indien hij de ouder is van een kind waarvan hij de verzorger is.

      2 Om in aanmerking te komen voor een kanstrajecttoelage dient de jongere een aanvraag in bij het projectbureau.

      3 Het projectbureau neemt binnen vier weken een besluit en stelt de deelnemer daarvan schriftelijk op de hoogte.

      4 Onverminderd de afspraken in de overeenkomst vervalt de aanspraak op de kanstrajecttoelage van de deelnemer die
      zonder geldige reden niet aan het sociaal kanstraject heeft deelgenomen gedurende een aaneengesloten periode van
      ten minste twee weken in ieder geval met ingang van de eerste dag van de maand volgend op de maand waarin het niet
      deelnemen zonder geldige reden aanving.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. de hoogte van de kanstrajecttoelage, onderscheiden in maandelijkse tegemoetkoming en de bijdrage voor de
      kinderopvang en

      b. de procedure van aanvraag, intrekking, wijziging en terugvordering van de kanstrajecttoelage.

      6 In afwijking van het eerste lid komt een gedetineerde deelnemer niet in aanmerking voor een kanstrajecttoelage.
    url: https://wetten.overheid.nl/BWBR0028506/2011-02-17#Artikel11
  - number: '12'
    text: |-
      1 De uitvoeringsinstantie stelt voor de aanvang van het sociaal kanstraject van de deelnemer met een specifieke
      zorgbehoefte een handelingsplan op.

      2 De uitvoeringsinstantie evalueert jaarlijks het handelingsplan met de deelnemer.
    url: https://wetten.overheid.nl/BWBR0028506/2011-02-17#Artikel12
  - number: 12a
    text: |-
      1 De uitvoeringsinstantie is aangesloten bij een samenwerkingsverband als bedoeld in
      [artikel 26 van de Wet primair onderwijs BES][ref1], in [artikel 67 van de Wet voortgezet onderwijs BES][ref2] en
      [artikel 3.2 van de Wet educatie en beroepsonderwijs BES][ref3].

      2 De [artikelen 3.2 tot en met 3.7 van de Wet educatie en beroepsonderwijs BES][ref4] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel26
