  - number: '13'
    text: |-
      1 Het bestuurscollege bekostigt het projectbureau voor de uitvoering van zijn taken en de uitvoeringsinstantie voor
      de aan de uitvoering van de sociale kanstrajecten verbonden kosten.

      2 De kosten van een sociaal kanstraject bedragen niet meer dan een bij ministeriële regeling vast te stellen
      bedrag.
    url: https://wetten.overheid.nl/BWBR0028506/2011-02-17#Artikel13
  - number: '14'
    text: |-
      De uitvoeringsinstantie zendt jaarlijks binnen drie maanden na afloop van het jaar aan het betrokken
      bestuurscollege en Onze Minister een schriftelijk verslag over de uitgevoerde sociale kanstrajecten.
    url: https://wetten.overheid.nl/BWBR0028506/2011-02-17#Artikel14
  - number: '15'
    text: |-
      1 De uitvoeringsinstantie dient bij het bestuurscollege vóór 1 maart volgend op het jaar waarvoor een bijdrage uit
      de openbare kas is verkregen, een financiële verantwoording in waaruit blijkt:

      a. dat de bijdrage rechtmatig is aangewend;

      b. of, en zo ja op welke wijze, ten aanzien van het voorafgaande jaar, gebruik is gemaakt van de verstrekte
      bijdrage.

      2 Het verslag, waarin de financiële verantwoording, bedoeld in het eerste lid,
      is vervat, wordt vergezeld van een verklaring van een deskundige als bedoeld in
      [artikel 121, zesde lid, van Boek 2, van het Burgerlijk Wetboek BES][ref1].

      3 Bij de aanwijzing van de deskundige bedingt de uitvoeringsinstantie dat de controle overeenkomstig een door
      Onze Minister vast te stellen controleprotocol plaatsvindt en dat aan Onze Minister op diens verzoek inzicht wordt
      geboden in de controlerapporten van de deskundige.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028506/2011-02-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '16'
    text: |-
      Het bestuurscollege kan de vastgestelde bijdrage binnen een periode van vijf jaar, gerekend vanaf de dag waarop het
      verzoek tot bekostiging was ingewilligd, intrekken of ten nadele van de uitvoeringsinstantie wijzigen:

      a. op grond van feiten of omstandigheden waarvan het bestuurscollege bij de vaststelling van de bijdrage
      redelijkerwijs niet op de hoogte kon zijn en op grond waarvan de bijdrage lager zou zijn vastgesteld;

      b. indien de vaststelling van de bijdrage onjuist was en de uitvoeringsinstantie dit wist of behoorde te weten;

      c. indien de uitvoeringsinstantie na de vaststelling van de bijdrage niet heeft voldaan aan het bepaalde in deze
      wet.
    url: https://wetten.overheid.nl/BWBR0028506/2011-02-17#Artikel16
  - number: '17'
    text: |-
      1 Onze Minister verstrekt jaarlijks, binnen het raam van de door de begrotingswetgever
      beschikbaar gestelde middelen, per openbaar lichaam een bijzondere uitkering als bedoeld in
      [artikel 91 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] ter tegemoetkoming in de
      kosten van de activiteiten van het projectbureau en van de uitvoeringsinstantie.

      2 De uitkering wordt uiterlijk in september verstrekt en heeft betrekking op het daarop volgende kalenderjaar.
      Bij of krachtens algemene maatregel van bestuur worden regels gegeven voor de berekening en kunnen regels worden
      gegeven voor de betaling van de uitkering.

      3 Het bestuurscollege dient de aanvraag voor een bijzondere uitkering voor 1 juli in. De aanvraag gaat vergezeld
      van een begroting van geraamde inkomsten en uitgaven, waarin in ieder geval wordt opgenomen het verwachte aantal
      deelnemers en de aan hen te verstrekken kanstrajecttoelage.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel91
    url: https://wetten.overheid.nl/BWBR0028506/2011-02-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '91'
  - number: 17a
    text: |-
      1 Het bestuurscollege verantwoordt jegens Onze Minister de bijzondere uitkering in een bijlage bij de jaarrekening,
      bedoeld in [artikel 28, eerste lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1].
      Uit de bijlage blijkt op welke wijze de uitkering is aangewend en de rechtmatigheid daarvan.

      2 Onze Minister kan nadere regelen stellen omtrent de in de bijlage te verstrekken informatie voor zover deze nodig
      is voor een beoordeling van besteding van de bijzondere uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel28
    url: https://wetten.overheid.nl/BWBR0028506/2011-02-17#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '28'
  - number: '18'
    text: |-
      Onze Minister kan de vastgestelde bijzondere uitkering, bedoeld in [artikel 17][ref1] aan een openbaar lichaam
      binnen een periode van vijf jaar, gerekend vanaf de dag waarop de kosten zijn vergoed, intrekken of ten nadele van
      een openbaar lichaam wijzigen:

      a. op grond van feiten of omstandigheden waarvan Onze Minister bij de vaststelling van de vergoeding redelijkerwijs
      niet op de hoogte kon zijn en op grond waarvan de vergoeding lager zou zijn vastgesteld;

      b. indien de vaststelling van de vergoeding onjuist was en het openbaar lichaam dit wist of behoorde te weten;

      c. indien het openbaar lichaam het bepaalde bij of krachtens deze wet niet nakomt;

      d. de uitkering niet is besteed in overeenstemming met deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028506#Artikel17
    url: https://wetten.overheid.nl/BWBR0028506/2011-02-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028506
        artikel: '17'
  - number: '19'
    text: |-
      1 Bij het geheel of gedeeltelijk intrekken van de bijzondere uitkering op grond van [artikel 18][ref1] besluit Onze
      Minister tot:

      a. het onmiddellijk terugvorderen van de middelen bij het desbetreffende openbaar lichaam, of

      b. het verrekenen van de middelen met de bijzondere uitkering aan het desbetreffende openbaar lichaam van het
      daarop volgende jaar.

      2 Het openbaar lichaam is verplicht binnen vier weken na een besluit als bedoeld in het eerste lid, onderdeel a,
      over te gaan tot betaling. Indien betaling uitblijft, is het openbaar lichaam zonder aanmaning of rechterlijke
      tussenkomst wettelijke rente verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028506#Artikel18
    url: https://wetten.overheid.nl/BWBR0028506/2011-02-17#Artikel19
    references:
      - id: ref1
