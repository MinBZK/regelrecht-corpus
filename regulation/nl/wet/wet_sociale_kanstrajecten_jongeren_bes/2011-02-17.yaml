  - number: '2'
    text: |-
      Voor sociale kanstrajecten komen in aanmerking jongeren die:

      a. geen onderwijs volgen dat bekostigd wordt op grond van de [Wet voortgezet onderwijs BES][ref1] of de
      [Wet educatie en beroepsonderwijs BES][ref2], en

      b. niet beschikken over een startkwalificatie WSKJ en geen betaalde arbeid verrichten


      [ref1]: https://wetten.overheid.nl/BWBR0030284
      [ref2]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0028506/2011-02-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0030284
      - id: ref2
        bwb_id: BWBR0028395
  - number: '3'
    text: |-
      1 Een voortijdig schoolverlater WSKJ die niet op basis van de afspraken, bedoeld in [artikel 193, derde lid, van
      de Wet voortgezet onderwijs BES](onbekend) kan worden doorverwezen naar onderwijs of arbeidsmarkt, wordt door het
      bestuurscollege aangemeld bij het projectbureau.

      2 Het projectbureau nodigt de voortijdig schoolverlater WSKJ uit voor een educatieve intake.

      3 Onverminderd het eerste lid kan een jongere zich aanmelden voor een educatieve intake. De jongere die zich
      aanmeldt werkt mee aan een educatieve intake.
    url: https://wetten.overheid.nl/BWBR0028506/2011-02-17#Artikel3
  - number: '4'
    text: |-
      1 De educatieve intake heeft tot doel te onderzoeken of de jongere in aanmerking komt voor een sociaal kanstraject
      en, indien dit het geval is, over welke kennis en vaardigheden de jongere beschikt.

      2 Op basis van de kennis en vaardigheden wordt de jongere door de uitvoeringsinstantie een passend sociaal
      kanstraject aangeboden, dat zo mogelijk leidt tot instroom in het regulier onderwijs.

      3 De jongere die zich inschrijft voor het sociale kanstraject dat hem op basis van de educatieve intake wordt
      aangeboden legt bij zijn inschrijving zijn persoonsgegevens over.

      4 De jongere en de uitvoeringsinstantie sluiten bij inschrijving een overeenkomst waarin afspraken worden
      neergelegd over de inhoud van zijn sociale kanstraject en de deelname van de jongere daaraan.
    url: https://wetten.overheid.nl/BWBR0028506/2011-02-17#Artikel4
  - number: '5'
    text: |-
      1 Elk openbaar lichaam houdt een projectbureau in stand dat tot taak heeft:

      a. het uitvoeren van de educatieve intake,

      b. het beheren van het deelnemersregister,

      c. het nemen van een beschikking op een aanvraag voor een kanstrajecttoelage als bedoeld in
      [artikel 11, eerste lid, onder a en b][ref1], en

      d. het houden van toezicht op de uitvoeringsinstantie.

      2 Elk openbaar lichaam bekostigt een uitvoeringsinstantie die tot taak heeft:

      a. het vaststellen van het sociale kanstraject dat een jongere op basis van de educatieve intake wordt aangeboden,

      b. het opstellen van een raamplan sociale kanstrajecten, en

      c. het binnen het raam van de door de eilandsraad ter beschikking gestelde middelen uitvoeren of doen uitvoeren van
      een genoegzaam aanbod van sociale kanstrajecten en de daarmee samenhangende begeleiding.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het bepaalde in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028506#Artikel11
    url: https://wetten.overheid.nl/BWBR0028506/2011-02-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028506
        artikel: '11'
  - number: '6'
    text: |-
      1 Het projectbureau houdt een deelnemersregister bij met het oog op het begeleiden van de jongeren.

      2 In het deelnemersregister worden uitsluitend vermeld:

      a. de ingevolge [artikel 4, derde lid][ref1], overgelegde persoonsgegevens,

      b. de afspraken die ingevolge [artikel 4, vierde lid][ref2], bij de intake zijn gemaakt,

      c. de van het sociale kanstraject deel uitmakende modules die de jongere volgt en de wijzigingen daarin,

      d. de door de deelnemer met succes afgeronde modules,

      e. het behalen van het in [artikel 10][ref3] bedoelde certificaat of diploma, en

      f. de doorverwijzing naar onderwijs of arbeidsmarkt.

      3 Elke jongere die een sociaal kanstraject volgt, wordt ingeschreven in het deelnemersregister.


      [ref1]: https://wetten.overheid.nl/BWBR0028506#Artikel4
