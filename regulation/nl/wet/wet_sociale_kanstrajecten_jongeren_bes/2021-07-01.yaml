  - number: '2'
    text: Voor een sociaal kanstraject komt in aanmerking een voortijdig schoolverlater.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel2
  - number: '3'
    text: Een voortijdig schoolverlater wordt onverwijld door het bestuurscollege aangemeld bij het projectbureau.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel3
  - number: '4.1'
    text: |-
      Het projectbureau nodigt een aangemelde voortijdig schoolverlater uit voor een gesprek om te onderzoeken of
      de betrokkene kan worden doorverwezen naar onderwijs of arbeidsmarkt. Indien dit het geval is, begeleidt het
      projectbureau de betrokkene naar het desbetreffende onderwijs of de desbetreffende arbeid.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel4
  - number: '4.2'
    text: |-
      Indien de betrokkene niet kan worden doorverwezen, voert het projectbureau een educatieve intake uit, om te
      onderzoeken of de betrokkene in aanmerking komt voor een sociaal kanstraject en, indien dit het geval is, over
      welke kennis en vaardigheden de betrokkene beschikt.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel4
  - number: '4.3'
    text: |-
      Op basis van de kennis en vaardigheden wordt de betrokkene door de uitvoeringsinstantie een passend sociaal
      kanstraject aangeboden.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel4
  - number: '4.4'
    text: |-
      De betrokkene en de uitvoeringsinstantie sluiten bij aanvaarding van het aanbod een overeenkomst waarin afspraken
      worden neergelegd over de inhoud van het sociaal kanstraject en de deelname daaraan door de betrokkene.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel4
  - number: '4.5'
    text: De betrokkene legt bij het sluiten van de overeenkomst zijn persoonsgegevens over.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel4
  - number: '5.1'
    text: 'Elk openbaar lichaam houdt een projectbureau in stand dat tot taak heeft:'
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel5
  - number: 5.1.a
    text: het zo mogelijk doorverwijzen naar onderwijs of arbeidsmarkt,
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel5
  - number: 5.1.b
    text: het registeren van voortijdig schoolverlaters,
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel5
  - number: 5.1.c
    text: het uitvoeren van de educatieve intake,
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel5
  - number: 5.1.d
    text: het beheren van het deelnemersregister,
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel5
  - number: 5.1.e
    text: |-
      het nemen van een beschikking op een aanvraag voor een kanstrajecttoelage als bedoeld in
      [artikel 11, eerste lid, onder a en b][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0028506#Artikel11
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028506
        artikel: '11'
  - number: 5.1.f
    text: het houden van toezicht op de uitvoeringsinstantie.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel5
  - number: '5.2'
    text: 'Elk openbaar lichaam bekostigt een uitvoeringsinstantie die tot taak heeft:'
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel5
  - number: 5.2.a
    text: het vaststellen van het sociaal kanstraject dat op basis van de educatieve intake wordt aangeboden,
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel5
  - number: 5.2.b
    text: het opstellen van een raamplan sociale kanstrajecten, en
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel5
  - number: 5.2.c
    text: |-
      het binnen het raam van de door de eilandsraad ter beschikking gestelde middelen uitvoeren of doen uitvoeren van
      een genoegzaam aanbod van sociale kanstrajecten en de daarmee samenhangende begeleiding.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel5
  - number: '5.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het bepaalde in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel5
  - number: '6.1'
    text: Het projectbureau houdt een register bij waarin iedere deelnemer wordt ingeschreven.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel6
  - number: '6.2'
    text: 'In het deelnemersregister worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel6
  - number: 6.2.a
    text: |-
      de persoonsgegevens van de deelnemer, bedoeld in [artikel 5, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028506#Artikel5
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028506
        artikel: '5'
  - number: 6.2.b
    text: de inhoud van het sociaal kanstraject van de deelnemer, alsmede de eventuele aangebrachte wijzigingen;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel6
  - number: 6.2.c
    text: |-
      de door de deelnemer met succes afgeronde modules, bedoeld in [artikel 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028506#Artikel9
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028506
        artikel: '9'
  - number: 6.2.d
    text: |-
      het behaalde certificaat of diploma, bedoeld in [artikel 10][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0028506#Artikel10
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028506
        artikel: '10'
  - number: 6.2.e
    text: de doorverwijzing naar onderwijs of arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel6
  - number: '7'
    text: |-
      De in het deelnemersregister opgenomen gegevens worden uitsluitend gebruikt voor de uitvoering en handhaving van
      deze wet en zijn als zodanig uitsluitend toegankelijk voor de uitvoeringsinstantie en de in [artikel 20][ref1]
      bedoelde toezichthouders, voor zover deze gegevens redelijkerwijs noodzakelijk zijn voor de vervulling van hun
      taak.


      [ref1]: https://wetten.overheid.nl/BWBR0028506#Artikel20
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028506
        artikel: '20'
  - number: '8.1'
    text: 'De uitvoeringsinstantie stelt een raamplan sociale kanstrajecten op, dat ten minste omvat:'
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel8
  - number: 8.1.a
    text: de vormings- en scholingsdoelen en de bijbehorende begin- en eindtermen;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel8
  - number: 8.1.b
    text: de modules en deelmodules;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel8
  - number: 8.1.c
    text: de inhoud, duur, de mogelijke kanstrajecten en praktijkonderdelen;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel8
  - number: 8.1.d
    text: de momenten en de wijze waarop de toetsen worden afgenomen;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel8
  - number: 8.1.e
    text: de termijn waarbinnen de resultaten van de toetsen bekend worden gemaakt aan de deelnemer;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel8
  - number: 8.1.f
    text: de instructietaal;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel8
  - number: 8.1.g
    text: de kwalificatie van de docenten, trajectbegeleiders en praktijkbegeleiders;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel8
  - number: 8.1.h
    text: de aard en intensiteit van de begeleiding van de deelnemer in de verschillende kanstrajecten;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel8
  - number: 8.1.i
    text: |-
      de wijze waarop het bedrijfsleven betrokken is bij de inhoud van kanstrajecten in de vorm van leerwerktrajecten en
      bijdraagt met stage- of praktijkplaatsen;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel8
  - number: 8.1.j
    text: de periode gedurende welke het raamplan sociale kanstrajecten van kracht is;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel8
  - number: 8.1.k
    text: |-
      een begroting van geraamde inkomsten en uitgaven, waarin ten minste worden opgenomen het aantal deelnemers,
      de aan hen te verstrekken kanstrajecttoelage en de zorg die bij het expertisecentrum onderwijszorg, bedoeld in
      [artikel 3.4. van de Wet educatie en beroepsonderwijs BES][ref1], wordt ingekocht.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel3
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '3'
  - number: '8.2'
    text: |-
      Het bestuurscollege stelt het raamplan sociale kanstrajecten vast binnen 60 dagen nadat het uitvoeringsinstantie
      dat aan hem heeft voorgelegd.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel8
  - number: '9.1'
    text: |-
      Op grond van de resultaten van de educatieve intake, bedoeld in [artikel 4][ref1], stelt de uitvoeringsinstantie
      een op de individuele situatie afgestemd sociaal kanstraject voor de deelnemer vast.


      [ref1]: https://wetten.overheid.nl/BWBR0028506#Artikel4
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028506
        artikel: '4'
  - number: '9.2'
    text: 'Het sociaal kanstraject bestaat uit een of meerdere modulen die samengesteld zijn met het oog op:'
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel9
  - number: 9.2.a
    text: de persoonlijke ontplooiing;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel9
  - number: 9.2.b
    text: het leggen van een brede basis van algemene kennis en algemene en sociale vaardigheden;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel9
  - number: 9.2.c
    text: |-
      het leggen van een basis voor de bereidheid tot voortdurende persoonlijke ontwikkeling en uitbreiding van
      beroepsvaardigheden;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel9
  - number: 9.2.d
    text: het ontwikkelen van de nodige attitudes en vaardigheden om zich in een werkkring te kunnen handhaven;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel9
  - number: 9.2.e
    text: |-
      het verwerven van kennis van Papiaments of Engels, Nederlands, Spaans, rekenen, en het verwerven van
      computervaardigheden en praktische vaardigheden.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel9
  - number: '9.3'
    text: |-
      Het sociaal kanstraject heeft een totale duur van ten minste zes maanden en ten hoogste twee jaar. De periode van
      twee jaar kan op aanvraag bij het projectbureau worden verlengd met ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel9
  - number: '9.4'
    text: Het kanstraject kan worden gewijzigd in verband met wijzigingen in de omstandigheden waarin de deelnemer verkeert.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel9
  - number: '10'
    text: |-
      Nadat de deelnemer alle modules van het voor hem vastgestelde dan wel gewijzigde kanstraject met succes heeft
      afgerond, ontvangt hij een certificaat of een diploma, afhankelijk van de aard van het traject.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel10
  - number: '11.1'
    text: 'Een deelnemer komt in aanmerking voor een kanstrajecttoelage die bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel11
  - number: 11.1.a
    text: een maandelijkse tegemoetkoming, en
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel11
  - number: 11.1.b
    text: een bijdrage in de kosten van kinderopvang indien hij de ouder is van een kind waarvan hij de verzorger is.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel11
  - number: '11.2'
    text: Om in aanmerking te komen voor een kanstrajecttoelage dient de deelnemer een aanvraag in bij het projectbureau.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel11
  - number: '11.3'
    text: Het projectbureau neemt binnen vier weken een besluit en stelt de deelnemer daarvan schriftelijk op de hoogte.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel11
  - number: '11.4'
    text: |-
      Onverminderd de afspraken in de overeenkomst vervalt de aanspraak op de kanstrajecttoelage van de deelnemer die
      zonder geldige reden niet aan het sociaal kanstraject heeft deelgenomen gedurende een aaneengesloten periode van
      ten minste twee weken in ieder geval met ingang van de eerste dag van de maand volgend op de maand waarin het niet
      deelnemen zonder geldige reden aanving.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel11
  - number: '11.5'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel11
  - number: 11.5.a
    text: |-
      de hoogte van de kanstrajecttoelage, onderscheiden in maandelijkse tegemoetkoming en de bijdrage voor de
      kinderopvang en
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel11
  - number: 11.5.b
    text: de procedure van aanvraag, intrekking, wijziging en terugvordering van de kanstrajecttoelage.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel11
  - number: '11.6'
    text: In afwijking van het eerste lid komt een gedetineerde deelnemer niet in aanmerking voor een kanstrajecttoelage.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel11
  - number: '12.1'
    text: |-
      De uitvoeringsinstantie stelt voor de aanvang van het sociaal kanstraject van de deelnemer met een specifieke
      zorgbehoefte een handelingsplan op.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel12
  - number: '12.2'
    text: De uitvoeringsinstantie evalueert jaarlijks het handelingsplan met de deelnemer.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel12
  - number: 12a.1
    text: |-
      De uitvoeringsinstantie is aangesloten bij een samenwerkingsverband als bedoeld in
      [artikel 26 van de Wet primair onderwijs BES][ref1], in [artikel 67 van de Wet voortgezet onderwijs BES][ref2] en
      [artikel 3.2 van de Wet educatie en beroepsonderwijs BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel3
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '67'
      - id: ref3
        bwb_id: BWBR0028395
        artikel: '3'
  - number: 12a.2
    text: |-
      De [artikelen 3.2][ref1] en [3.3 van de Wet educatie en beroepsonderwijs BES][ref2] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel3
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '3'
  - number: '13.1'
    text: |-
      Het bestuurscollege bekostigt het projectbureau voor de uitvoering van zijn taken en de uitvoeringsinstantie voor
      de aan de uitvoering van de sociale kanstrajecten verbonden kosten.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel13
  - number: '13.2'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de kosten van een sociaal kanstraject niet meer bedragen dan een
      in die regeling vast te stellen bedrag.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel13
  - number: '14'
    text: |-
      Het projectbureau zendt binnen drie maanden na afloop van het jaar aan het betrokken bestuurscollege en Onze
      Minister:
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel14
  - number: 14.a
    text: |-
      een overzicht van de geregistreerde voortijdig schoolverlaters en van het aantal van hen dat zonder voorafgaand
      sociaal kanstraject is doorverwezen naar onderwijs of arbeidsmarkt; en
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel14
  - number: 14.b
    text: een verslag over de uitgevoerde sociale kanstrajecten.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel14
  - number: '15.1'
    text: |-
      De uitvoeringsinstantie dient bij het bestuurscollege vóór 1 maart volgend op het jaar waarvoor een bijdrage uit de
      openbare kas is verkregen, een financiële verantwoording in waaruit blijkt:
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel15
  - number: 15.1.a
    text: dat de bijdrage rechtmatig is aangewend;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel15
  - number: 15.1.b
    text: of, en zo ja op welke wijze, ten aanzien van het voorafgaande jaar, gebruik is gemaakt van de verstrekte bijdrage.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel15
  - number: '15.2'
    text: |-
      Het verslag, waarin de financiële verantwoording, bedoeld in het eerste lid,
      is vervat, wordt vergezeld van een verklaring van een deskundige als bedoeld in
      [artikel 121, zesde lid, van Boek 2, van het Burgerlijk Wetboek BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '15.3'
    text: Aan Onze Minister wordt op diens verzoek inzicht wordt geboden in de controlerapporten van de deskundige.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel15
  - number: '16'
    text: |-
      Het bestuurscollege kan de vastgestelde bijdrage binnen een periode van vijf jaar, gerekend vanaf de dag waarop het
      verzoek tot bekostiging was ingewilligd, intrekken of ten nadele van de uitvoeringsinstantie wijzigen:
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel16
  - number: 16.a
    text: |-
      op grond van feiten of omstandigheden waarvan het bestuurscollege bij de vaststelling van de bijdrage
      redelijkerwijs niet op de hoogte kon zijn en op grond waarvan de bijdrage lager zou zijn vastgesteld;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel16
  - number: 16.b
    text: indien de vaststelling van de bijdrage onjuist was en de uitvoeringsinstantie dit wist of behoorde te weten;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel16
  - number: 16.c
    text: indien de uitvoeringsinstantie na de vaststelling van de bijdrage niet heeft voldaan aan het bepaalde in deze wet.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel16
  - number: '17.1'
    text: |-
      Onze Minister verstrekt jaarlijks, binnen het raam van de door de begrotingswetgever
      beschikbaar gestelde middelen, per openbaar lichaam een bijzondere uitkering als bedoeld in
      [artikel 91 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] ter tegemoetkoming in de
      kosten van de activiteiten van het projectbureau en van de uitvoeringsinstantie.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel91
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '91'
  - number: '17.2'
    text: |-
      De uitkering wordt uiterlijk in september verstrekt en heeft betrekking op het daarop volgende kalenderjaar. Bij of
      krachtens algemene maatregel van bestuur worden regels gegeven voor de berekening en kunnen regels worden gegeven
      voor de betaling van de uitkering.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel17
  - number: '17.3'
    text: |-
      Het bestuurscollege dient de aanvraag voor een bijzondere uitkering voor 1 juli in. De aanvraag gaat vergezeld
      van een begroting van geraamde inkomsten en uitgaven, waarin in ieder geval wordt opgenomen het verwachte aantal
      deelnemers en de aan hen te verstrekken kanstrajecttoelage.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel17
  - number: 17a.1
    text: |-
      Het bestuurscollege verantwoordt jegens Onze Minister de bijzondere uitkering in een bijlage bij de jaarrekening,
      bedoeld in [artikel 28, eerste lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1].
      Uit de bijlage blijkt op welke wijze de uitkering is aangewend en de rechtmatigheid daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel28
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '28'
  - number: 17a.2
    text: |-
      Onze Minister kan nadere regels stellen omtrent de in de bijlage te verstrekken informatie voor zover deze nodig is
      voor een beoordeling van de besteding van de bijzondere uitkering.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel17a
  - number: '18'
    text: |-
      Onze Minister kan de vastgestelde bijzondere uitkering, bedoeld in [artikel 17][ref1] aan een openbaar lichaam
      binnen een periode van vijf jaar, gerekend vanaf de dag waarop de kosten zijn vergoed, intrekken of ten nadele van
      een openbaar lichaam wijzigen:


      [ref1]: https://wetten.overheid.nl/BWBR0028506#Artikel17
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028506
        artikel: '17'
  - number: 18.a
    text: |-
      op grond van feiten of omstandigheden waarvan Onze Minister bij de vaststelling van de vergoeding redelijkerwijs
      niet op de hoogte kon zijn en op grond waarvan de vergoeding lager zou zijn vastgesteld;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel18
  - number: 18.b
    text: indien de vaststelling van de vergoeding onjuist was en het openbaar lichaam dit wist of behoorde te weten;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel18
  - number: 18.c
    text: indien het openbaar lichaam het bepaalde bij of krachtens deze wet niet nakomt;
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel18
  - number: 18.d
    text: indien de uitkering niet is besteed in overeenstemming met deze wet.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel18
  - number: '19.1'
    text: |-
      Bij het geheel of gedeeltelijk intrekken van de bijzondere uitkering op grond van [artikel 18][ref1] besluit Onze
      Minister tot:


      [ref1]: https://wetten.overheid.nl/BWBR0028506#Artikel18
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028506
        artikel: '18'
  - number: 19.1.a
    text: het onmiddellijk terugvorderen van de middelen bij het desbetreffende openbaar lichaam, of
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel19
  - number: 19.1.b
    text: |-
      het verrekenen van de middelen met de bijzondere uitkering aan het desbetreffende openbaar lichaam van het daarop
      volgende jaar.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel19
  - number: '19.2'
    text: |-
      Het openbaar lichaam is verplicht binnen vier weken na een besluit als bedoeld in het eerste lid, onderdeel a,
      over te gaan tot betaling. Indien betaling uitblijft, is het openbaar lichaam zonder aanmaning of rechterlijke
      tussenkomst wettelijke rente verschuldigd.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel19
  - number: '20.1'
    text: |-
      Met de uitoefening van het toezicht op de naleving van deze wet zijn belast de door Onze Minister aangewezen
      toezichthouders.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel20
  - number: '20.2'
    text: Met het toezicht op de kwaliteit van de aangeboden kanstrajecten is de inspectie belast.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel20
  - number: '20.3'
    text: |-
      De [artikelen 5:12][ref1], [5:13][ref2], [5:15][ref3], [5:16][ref4], [5:17][ref5] en
      [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref6] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '20.4'
    text: |-
      Onze Minister is bevoegd tot toepassing van [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref1] ten
      aanzien van het toezicht, bedoeld in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '21'
    text: |-
      Hij die op grond van de bij of krachtens deze wet vastgestelde bepalingen gehouden is inlichtingen of gegevens te
      verstrekken en daarbij opzettelijk een valse opgave doet dan wel opzettelijk in strijd met bedoelde gehoudenheid
      iets verzwijgt wordt gestraft met hechtenis van ten hoogste zes maanden, een geldboete van de vierde categorie of
      met beide straffen. Het in de eerste volzin strafbaar gestelde feit is een misdrijf.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel21
  - number: 21a
    text: |-
      Degene die op de dag voorafgaand aan de inwerkingtreding van deze wet deelneemt aan een kanstraject als bedoeld in
      de Wet sociale kanstrajecten jongeren BES, zoals die wet is komen te luiden op 10 oktober 2010, is deelnemer in de
      zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel21a
  - number: '22'
    text: 'Deze wet wordt aangehaald als: Wet sociale kanstrajecten jongeren BES.'
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel22
