articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: **deelnemer:** de voortijdig
      schoolverlater die aan het voor hem vastgesteld sociaal kanstraject deelneemt; **deelnemersregister:**
      het register, bedoeld in [artikel 6][ref1]; **Inspectie:** de Inspectie van het onderwijs, bedoeld
      in de [Wet op het onderwijstoezicht][ref2]; **kanstrajecttoelage**: een toelage als bedoeld in
      [artikel 11, eerste lid][ref3]; **Onze Minister**: Onze Minister van Onderwijs, Cultuur en Wetenschap;
      **openbaar lichaam:**het openbaar lichaam Bonaire, Sint Eustatius of Saba; **projectbureau**: het bureau,
      bedoeld in [artikel 5, eerste lid][ref4]; **raamplan sociale kanstrajecten**: een plan als bedoeld in
      [artikel 8][ref5]; **sociaal kanstraject:** een sociaal kanstraject als bedoeld in [artikel 9][ref6];
      **startkwalificatie:** startkwalificatie als bedoeld in [artikel 1, onderdeel f, van de Leerplichtwet BES][ref7];
      **uitvoeringsinstantie:** een privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid die wordt bekostigd
      voor de uitvoering van de taak, bedoeld in [artikel 5, tweede lid][ref8]; **voortijdig schoolverlater:** ingezetene
      van een openbaar lichaam, die:


