  - number: 1.a
    text: de leeftijd van 18 jaar heeft bereikt, maar nog niet de leeftijd van 25 jaren,
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel1
  - number: 1.b
    text: niet beschikt over een startkwalificatie,
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel1
  - number: 1.c
    text: niet werkzaam is op grond van een aanstelling of arbeidsovereenkomst, en
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel1
  - number: 1.d
    text: 'die:'
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel1
  - number: 1.d.1
    text: |-
      het onderwijs aan de school waaraan hij is ingeschreven gedurende een aaneengesloten periode van ten minste een
      maand of een door het bevoegd gezag te bepalen kortere periode zonder geldige reden niet meer volgt, of
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel1
  - number: 1.d.2
    text: |-
      niet meer aan een school als bedoeld in de [Wet voortgezet onderwijs BES][ref1] is ingeschreven en evenmin is
      ingeschreven aan een instelling als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284
      [ref2]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0028506/2021-07-01#Artikel1
    references:
