  - number: '14'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan luiden met uitzondering van
      [artikel 3, tweede lid, tweede volzin, en derde tot en met vijfde lid][ref1], welke bepalingen in werking treden
      met ingang van de eerste kalendermaand na verloop van twee jaren na de datum van uitgifte van het Staatsblad waarin
      deze wet wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel3
