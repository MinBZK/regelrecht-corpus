  - number: '13'
    text: |-
      Uiterlijk op de dag voor die waarop [artikel 4 van deze wet][ref1] in werking treedt, verlijden Onze Ministers een
      akte voor een notaris, waarbij de Stichting wordt opgericht.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel4
