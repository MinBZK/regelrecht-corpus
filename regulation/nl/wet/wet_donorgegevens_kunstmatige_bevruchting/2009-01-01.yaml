---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_donorgegevens_kunstmatige_bevruchting
regulatory_layer: WET
publication_date: '2025-06-04'
valid_from: '2009-01-01'
bwb_id: BWBR0013642
url: https://wetten.overheid.nl/BWBR0013642/2009-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gewenst is regels te stellen voor de bewaring, het beheer en de
    verstrekking van gegevens van donoren bij kunstmatige donorbevruchting;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel1
  - number: 1.a
    text: 'Onze Ministers: Onze Ministers van Justitie en van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel1
  - number: 1.b
    text: 'Stichting: de Stichting donorgegevens kunstmatige bevruchting;'
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel1
  - number: 1.c
    text: |-
      kunstmatige donorbevruchting: het beroeps-of bedrijfsmatig verrichten van handelingen, gericht op het anders dan op
      natuurlijke wijze tot stand komen van een zwangerschap met gebruikmaking van:
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel1
  - number: 1.c.1
    text: zaad van een ander dan de echtgenoot, geregistreerde partner of andere levensgezel van de vrouw of
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel1
  - number: 1.c.2
    text: een eicel van een andere vrouw;
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel1
  - number: 1.d
    text: 'donor: degene die zaad of een eicel heeft afgestaan ten behoeve van kunstmatige donorbevruchting.'
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel1
  - number: '2.1'
    text: |-
      De natuurlijke persoon of rechtspersoon die kunstmatige donorbevruchting verricht of doet verrichten, is verplicht
      de volgende gegevens van een donor te verzamelen en binnen een door de Stichting bij reglement te bepalen termijn
      aan deze ter beschikking te stellen:
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel2
  - number: 2.1.a
    text: |-
      medische gegevens die van belang kunnen zijn voor de gezonde ontwikkeling van het kind, zoals bij algemene
      maatregel van bestuur bepaald;
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel2
  - number: 2.1.b
    text: |-
      fysieke kenmerken, opleiding en beroep alsmede gegevens omtrent de sociale achtergrond en een aantal persoonlijke
      kenmerken; een en ander zoals bij algemene maatregel van bestuur nader bepaald;
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel2
  - number: 2.1.c
    text: geslachtsnaam, voornamen, geboortedatum en woonplaats.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel2
  - number: '2.2'
    text: |-
      Hij is tevens verplicht de geslachtsnaam, de voornamen, de geboortedatum en de woonplaats van de vrouw bij wie
      kunstmatige donorbevruchting heeft plaatsgevonden te registreren en aan de Stichting ter beschikking te stellen,
      alsmede de tijdstippen waarop de donorbevruchtingen hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel2
  - number: '2.3'
    text: |-
      De gegevens bedoeld in het eerste lid, onder b, mogen afzonderlijk of in combinatie niet herleidbaar zijn tot de
      individuele donor.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel2
  - number: '2.4'
    text: |-
      De verplichtingen, bedoeld in het eerste en het tweede lid, gelden niet of vervallen, zodra komt vast te staan dat
      de bevruchting niet tot de geboorte van een kind heeft geleid.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel2
  - number: '3.1'
    text: 'De Stichting verstrekt de bij haar berustende gegevens van de betrokken donor:'
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel3
  - number: 3.1.a
    text: |-
      aan de huisarts van degene die is verwekt door en ten gevolge van kunstmatige donorbevruchting, op zijn verzoek,
      voor zover het betreft de medische gegevens, bedoeld in [artikel 2, eerste lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel2
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
  - number: 3.1.b
    text: |-
      aan degene die weet of vermoedt dat hij is verwekt door en ten gevolge van kunstmatige donorbevruchting en die
      de leeftijd van twaalf jaren heeft bereikt, op zijn verzoek, voor zover het betreft de gegevens, bedoeld in
      [artikel 2, eerste lid, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel2
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
  - number: 3.1.c
    text: |-
      aan de ouders of een van hen van het kind dat door en tengevolge van kunstmatige donorbevruchting is verwekt,
      op hun verzoek, indien het kind de leeftijd van twaalf jaren nog niet heeft bereikt en voor zover het betreft de
      gegevens, bedoeld in [artikel 2, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel2
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      De persoonsidentificerende gegevens van de donor worden aan degene die weet of vermoedt dat hij is verwekt door en
      ten gevolge van kunstmatige donorbevruchting en die de leeftijd van zestien jaren heeft bereikt, op zijn verzoek
      verstrekt, nadat de donor daarmee schriftelijk heeft ingestemd. Verstrekking blijft, indien de donor daarmee niet
      instemt, uitsluitend achterwege indien, in aanmerking genomen de gevolgen die niet-verstrekking voor de verzoeker
      zou kunnen hebben, zwaarwegende belangen van de donor meebrengen dat verstrekking niet behoort plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel3
  - number: '3.3'
    text: |-
      Indien de donor is overleden dan wel onvindbaar is, wordt de instemming, bedoeld in het tweede lid, geacht te
      zijn geweigerd, tenzij de echtgenoot, geregistreerde partner of andere levensgezel dan wel, bij het ontbreken
      van een van hen, een bloedverwant in de eerste of tweede graad, schriftelijk instemt met de verstrekking van de
      persoonsidentificerende gegevens. Na een weigering in te stemmen worden de in de eerste volzin bedoelde personen in
      de gelegenheid gesteld de belangen van de donor bij niet-verstrekking naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel3
  - number: '3.4'
    text: |-
      Het bestuur van de Stichting stelt de donor onverwijld schriftelijk in kennis van een voorgenomen verstrekking
      van zijn persoonsgegevens, alsmede van de gronden waarop dit voornemen berust. Binnen dertig dagen na de dag van
      verzending van de kennisgeving kan de donor tegen de voorgenomen verstrekking bezwaar maken bij de Stichting.
      Verstrekking geschiedt niet dan nadat de beslissing op het bezwaar onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel3
  - number: '3.5'
    text: |-
      [Artikel 6:5, eerste lid, aanhef en onderdeel a, van de Algemene wet bestuursrecht][ref1] is niet van toepassing
      ten aanzien van de donor.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '3.6'
    text: |-
      Van een verstrekking van gegevens van de donor aan een minderjarige die de leeftijd van zestien jaren nog niet
      heeft bereikt, worden de ouders op de hoogte gesteld. Aan de minderjarige wordt hiervan mededeling gedaan. Op
      verzoek van beide ouders of van een van hen worden deze gegevens eveneens aan hen verstrekt.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel3
  - number: '3.7'
    text: |-
      De Stichting draagt zorg voor deskundige begeleiding bij de verstrekking van de gegevens, bedoeld in het eerste lid
      onder b en in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel3
  - number: '3.8'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke bescheiden een verzoek tot verstrekking van gegevens van de
      donor moeten vergezellen.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel3
  - number: 3a
    text: |-
      Op verzoek van de ouder van het kind dat door en tengevolge van kunstmatige donorbevruchting is verwekt, verstrekt
      de Stichting een verklaring als bedoeld in [artikel 227, vierde lid, van Boek 1 van het Burgerlijk Wetboek][ref1],
      waarin de persoonsidentificerende gegevens van de donor niet worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel227
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '227'
  - number: '4.1'
    text: 'De Stichting heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel4
  - number: 4.1.a
    text: |-
      de gegevens, bedoeld in [artikel 2][ref1], te bewaren en te beheren en deze op verzoek te verstrekken
      overeenkomstig de bepalingen bij of krachtens de wet gesteld; de Stichting stelt ter uitvoering van deze taak bij
      reglement regels;


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel2
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
  - number: 4.1.b
    text: |-
      bij reglement te bepalen op welke wijze en op welk moment de gegevens, bedoeld in [artikel 2][ref1], aan de
      Stichting worden verstrekt en op welke wijze deze gegevens door de Stichting aan een persoon als bedoeld in
      [artikel 3][ref2] worden verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013642#Artikel3
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013642
        artikel: '3'
        paragraaf: '2'
  - number: 4.1.c
    text: |-
      voorlichting te verschaffen, voor zover de onder a en b omschreven taken van de Stichting dat vereisen, alsmede
      zorg te dragen voor de begeleiding bij de verstrekking van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel4
  - number: '4.2'
    text: |-
      Degenen op wie de verplichtingen, bedoeld in [artikel 2][ref1], rusten, zijn verplicht de reglementen van de
      Stichting na te leven.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel2
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
  - number: '5.1'
    text: Het bestuur van de Stichting bestaat uit een voorzitter en zes leden.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel5
  - number: '5.2'
    text: |-
      De voorzitter en de leden van het bestuur worden door Onze Ministers benoemd en ontslagen. Drie van de leden worden
      benoemd uit degenen die kunstmatige bevruchting beroepsmatig toepassen of daarbij nauw betrokken zijn. Ten minste
      één van deze drie leden is tevens deskundig op psychosociaal terrein. Van de overige drie leden is er één jurist,
      één ethicus en één deskundig op paedagogisch terrein.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel5
  - number: '5.3'
    text: |-
      De voorzitter en de leden van het bestuur ontvangen een vacatiegeld alsmede een vergoeding van reis- en
      verblijfkosten, een en ander overeenkomstig bij ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel5
  - number: '6.1'
    text: |-
      De reglementen alsmede wijzigingen in deze reglementen of in de statuten van de Stichting behoeven de goedkeuring
      van Onze Ministers. Goedkeuring kan worden geweigerd wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel6
  - number: '6.2'
    text: Het bestuur van de Stichting kan niet besluiten tot ontbinding van de Stichting.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel6
  - number: '7'
    text: |-
      Degenen op wie een verplichting als bedoeld in [artikel 2][ref1] rust alsmede de meerderjarige verzoekers die een
      verzoek tot verstrekking van andere dan de medische gegevens, bedoeld in [artikel 2, eerste lid, onder a][ref2],
      indienen, zijn aan de Stichting per groep van gegevens die op één donor betrekking hebben onderscheidenlijk per
      verzoek tot verstrekking een bij reglement vast te stellen bedrag verschuldigd. De hoogte van deze bedragen is
      afgestemd op ten hoogste de kosten verbonden aan de uitoefening van de krachtens [artikel 4][ref3] aan de Stichting
      opgedragen taken.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013642#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013642#Artikel4
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013642
        artikel: '4'
        paragraaf: '3'
  - number: '8'
    text: |-
      De Stichting draagt zorg voor een zorgvuldige bewaring van de gegevens van de donor gedurende ten minste tachtig
      jaren te rekenen van de dag waarop zij deze gegevens ontvangt.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel8
  - number: '9'
    text: |-
      De gemeentebesturen verschaffen de Stichting kosteloos alle inlichtingen en verstrekken kosteloos alle afschriften
      en uittreksels uit hun registers die de Stichting ter uitvoering van haar taak van hen vraagt.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel9
  - number: '10.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister van Volksgezondheid, Welzijn en Sport aangewezen ambtenaren van het Staatstoezicht op de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel10
  - number: '10.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel10
  - number: '11.1'
    text: |-
      Met een hechtenis van ten hoogste zes maanden of een boete van de derde categorie wordt gestraft degene die handelt
      in strijd met een verplichting, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel2
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
  - number: '11.2'
    text: Het in het eerste lid strafbaar gestelde feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel11
  - number: '12.1'
    text: |-
      De op het tijdstip waarop [artikel 4][ref1] in werking treedt bij natuurlijke personen of rechtspersonen aanwezige
      gegevens, bedoeld in [artikel 2][ref2], worden op dat tijdstip aan de Stichting overdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013642#Artikel2
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
  - number: '12.2'
    text: |-
      Tot de volledige inwerkingtreding van de wet kan de donor die voorafgaande aan de volledige inwerkingtreding
      daarvan zaadcellen of eicellen heeft afgestaan, tegenover de Stichting op schrift verklaren dat de op hem
      betrekking hebbende gegevens inzake geslachtsnaam, voornamen, geboortedatum en woonplaats niet worden verstrekt aan
      degene die weet of vermoedt dat hij is verwekt door en ten gevolge van kunstmatige bevruchting of aan diens ouders,
      indien een verzoek daartoe wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel12
  - number: '12.3'
    text: |-
      De in het tweede lid bedoelde gegevens omtrent een donor die een verklaring als bedoeld in het tweede lid niet
      heeft afgelegd worden niet verstrekt aan degene die weet of vermoedt dat hij is verwekt door en ten gevolge van
      kunstmatige bevruchting of aan diens ouders dan met instemming van de donor.
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel12
  - number: '12.4'
    text: |-
      Medische gegevens worden verstrekt overeenkomstig [artikel 3, eerste lid, onder a][ref1]. Gegevens
      omtrent fysieke kenmerken, opleiding en beroep, alsmede gegevens omtrent de sociale achtergrond en
      omtrent persoonlijke kenmerken, worden verstrekt overeenkomstig de [artikelen 2, derde lid][ref2], en
      [3, eerste lid, onder b en c, en zesde en zevende lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013642#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013642#Artikel3
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013642
        artikel: '3'
        paragraaf: '2'
  - number: '13'
    text: |-
      Uiterlijk op de dag voor die waarop [artikel 4 van deze wet][ref1] in werking treedt, verlijden Onze Ministers een
      akte voor een notaris, waarbij de Stichting wordt opgericht.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel4
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '4'
        paragraaf: '3'
  - number: '14'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan luiden met uitzondering van
      [artikel 3, tweede lid, tweede volzin, en derde tot en met vijfde lid][ref1], welke bepalingen in werking treden
      met ingang van de eerste kalendermaand na verloop van twee jaren na de datum van uitgifte van het Staatsblad waarin
      deze wet wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel3
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '3'
        paragraaf: '2'
  - number: '15'
    text: 'Deze wet wordt aangehaald als: Wet donorgegevens kunstmatige bevruchting.'
    url: https://wetten.overheid.nl/BWBR0013642/2009-01-01#Artikel15
