  - number: '13'
    text: |-
      1 Indien een verrichter gebruik wenst te maken van zaadcellen of eicellen van een
      donor van wie de geslachtscellen reeds voorafgaand aan de inwerkingtreding van de
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      __________________________________________________________________________________ (Stb. 2023, 294, door hem zijn
      gebruikt bij een kunstmatige donorbevruchting, doet de verrichter bij de verstrekking van de gegevens, bedoeld in
      [artikel 1b, eerste lid][ref2], daarvan mededeling aan het College.

      2 Alvorens op grond van [artikel 1c][ref3] aan de toegekende donorcode een of meerdere moedercodes te koppelen,
      verstrekt het College aan de verrichter, bedoeld in het eerste lid, een overzicht van de bij hem berustende
      gegevens over elke vrouw bij wie kunstmatige donorbevruchting heeft plaatsgevonden met gebruikmaking van zaadcellen
      of eicellen van de donor, bedoeld in het eerste lid. Indien uit de bij het College berustende gegevens blijkt dat
      ook een andere verrichter de geslachtscellen van de betreffende donor bij een kunstmatige donorbevruchting heeft
      gebruikt, verstrekt het College ook een overzicht aan die andere verrichter.

      3 De verrichter, bedoeld in het tweede lid, vergewist zich van de juistheid en volledigheid van het overzicht en
      doet daarvan mededeling aan het College. De verrichter vult het overzicht aan door verstrekking van de gegevens,
      bedoeld in [artikel 2, tweede lid][ref4], van elke vrouw bij wie kunstmatige donorbevruchting heeft plaatsgevonden
      met gebruikmaking van zaadcellen of eicellen van de donor, bedoeld in het eerste lid, indien deze gegevens in het
      door het College verstrekte overzicht ontbreken.

      4 Bij de toepassing van [artikel 1c][ref5] bedraagt het aantal door het College aan de donorcode van de donor,
      bedoeld in het eerste lid, te koppelen moedercodes ten hoogste het wettelijk maximumaantal moedercodes of het door
      de donor bepaalde lagere maximumaantal minus het aantal vrouwen bij wie blijkens het overzicht of de overzichten
      kunstmatige donorbevruchting heeft plaatsgevonden met gebruikmaking van zaadcellen of eicellen van de donor.

      5 Het College kent eenmalig een moedercode toe aan elke vrouw bij wie voorafgaand aan de inwerkingtreding van
      de in het eerste lid genoemde [wet kunstmatige donorbevruchting][ref6] heeft plaatsgevonden met gebruikmaking
      van zaadcellen of eicellen van de donor, bedoeld in het eerste lid. Het College doet hiervan mededeling aan de
      betrokken verrichter of verrichters.

      6 Bij de toepassing van [artikel 1d, tweede of derde lid][ref7], reserveert het College ten behoeve van de
      verrichter, bedoeld in het eerste lid, ten hoogste het aantal moedercodes dat na toepassing van het vierde en
      vijfde lid nog beschikbaar is.


