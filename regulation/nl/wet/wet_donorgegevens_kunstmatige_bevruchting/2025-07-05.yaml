  - number: 1i
    text: |-
      Indien een verrichter geen gebruik meer wenst te maken van een ten behoeve van hem gereserveerde moedercode, doet
      hij daarvan mededeling aan het College. Het College draagt ervoor zorg dat de reservering ongedaan wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1i
  - number: 1j
    text: |-
      1 Het College kan uit eigen beweging aan een donor een donorcode toekennen of aan een donorcode een moedercode
      koppelen en deze moedercode toekennen aan een behandelde vrouw. Het College kan daartoe gegevens opvragen bij een
      verrichter die gehouden is de gevraagde gegevens aan het College te verstrekken.

      2 Bij de toepassing van het eerste lid maakt het College een reservering voor een moedercode ongedaan indien
      daarmee overschrijding van het wettelijk maximumaantal moedercodes of het door de donor bepaalde lagere
      maximumaantal wordt voorkomen. Het College doet hiervan mededeling aan de verrichter ten behoeve van wie de
      moedercode was gereserveerd.

      3 Indien toepassing van het tweede lid niet mogelijk is, is het College bevoegd om bij de toepassing van het eerste
      lid het wettelijk maximumaantal moedercodes of het door de donor bepaalde lagere maximumaantal te overschrijden.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1j
  - number: '2'
    text: |-
      1 De verrichter is ter zake van een kunstmatige donorbevruchting verplicht om binnen een door het College bij
      reglement te bepalen termijn de volgende gegevens aan het College te verstrekken:

      a. de donorcode van de donor van wiens zaadcellen of eicellen de verrichter gebruik heeft gemaakt, en

      b. de volgende gegevens van de donor: fysieke kenmerken, opleiding en beroep, alsmede gegevens omtrent de sociale
      achtergrond en een aantal persoonlijke kenmerken, een en ander zoals bij algemene maatregel van bestuur nader
      bepaald.

      2 De verrichter is tevens verplicht om binnen de termijn, bedoeld in het eerste lid, de volgende gegevens aan het
      College te verstrekken:

      a. de geslachtsnaam, voornamen, geboortedatum, woonplaats van de vrouw bij wie kunstmatige donorbevruchting
      heeft plaatsgevonden, alsmede het burgerservicenummer, tenzij aan de vrouw geen burgerservicenummer is toegekend
      krachtens de [Wet algemene bepalingen burgerservicenummer][ref1], of de reeds aan deze vrouw toegekende
      moedercode die gekoppeld is aan de donorcode van de donor, bedoeld in het eerste lid. In de situatie, bedoeld in
      [artikel 1a, tweede lid][ref2], dient de verrichter zowel de persoonsidentificerende gegevens van de behandelde
      vrouw als de gebruikte reeds toegekende moedercode te verstrekken,

      b. het tijdstip waarop de donorbevruchting heeft plaatsgevonden, en

      c. de aantekening of de identiteit van de donor, bedoeld in het eerste lid, bekend is aan de vrouw.

      3 De gegevens bedoeld in het eerste lid, onderdeel b, mogen afzonderlijk of in combinatie niet herleidbaar zijn tot
      de individuele donor.

      4 De verplichtingen, bedoeld in het eerste en het tweede lid, gelden niet of vervallen, zodra komt vast te
      staan dat de bevruchting niet tot de geboorte van een kind heeft geleid, tenzij de terbeschikkingstelling van de
      betreffende gegevens voor het College noodzakelijk is ter uitvoering van de taak, bedoeld in [artikel 3a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022428
