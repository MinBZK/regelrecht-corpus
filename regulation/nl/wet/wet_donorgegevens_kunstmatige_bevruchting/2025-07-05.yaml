  - number: 3c
    text: |-
      1 In dit artikel wordt verstaan onder erfelijke aandoening: een aandoening ter zake waarvan uit een professionele
      standaard als bedoeld in de [Wet kwaliteit, klachten en geschillen zorg][ref1], voortvloeit dat personen met een
      risico op erfelijke aanleg voor die aandoening daarover dienen te worden geïnformeerd.

      2 Een arts die werkzaam is in een instelling met een vergunning krachtens
      de [Wet op bijzondere medische verrichtingen][ref2] voor het verrichten
      van klinisch genetisch onderzoek en erfelijkheidsadvisering als bedoeld in
      [artikel 1, onderdeel h, van de Regeling aanwijzing bijzondere medische verrichtingen][ref3], en die geconstateerd
      heeft dat ten aanzien van een persoon die een donor als bedoeld in deze wet is, sprake is van een erfelijke
      aandoening, doet hiervan mededeling aan het College.

      3 Naar aanleiding van de in het tweede lid bedoelde mededeling verstrekt het College aan de arts de
      persoonsidentificerende gegevens van degene die is verwekt door en ten gevolge van kunstmatige donorbevruchting
      waarbij gebruik is gemaakt van de geslachtscellen van de betreffende donor, indien het College over die
      gegevens beschikt vanwege een eerder ingediend verzoek als bedoeld in deze paragraaf, en indien aan de orde de
      persoonsidentificerende gegevens van de donor. Indien het College niet over de gegevens beschikt van degene die
      is verwekt door en ten gevolge van kunstmatige donorbevruchting waarbij gebruik is gemaakt van de geslachtscellen
      van de betreffende donor, verstrekt het aan de arts de persoonsidentificerende gegevens van de vrouw bij wie
      kunstmatige donorbevruchting heeft plaatsgevonden met gebruikmaking van de geslachtscellen van de betreffende donor
      om de arts in staat te stellen te kunnen voldoen aan de in het eerste lid bedoelde professionele standaard.

      4 Het College informeert de verrichter of verrichters die gebruik hebben gemaakt van de geslachtscellen van de
      donor ten aanzien van wie de mededeling is gedaan, over de betreffende mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0037173
      [ref2]: https://wetten.overheid.nl/BWBR0008974
      [ref3]: https://wetten.overheid.nl/BWBR0035311#Artikel1
