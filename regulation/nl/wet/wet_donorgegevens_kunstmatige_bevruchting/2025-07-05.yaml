  - number: 3b
    text: |-
      1 Het College verstrekt aan degene die is verwekt door en ten gevolge van kunstmatige donorbevruchting en die de
      leeftijd van zestien jaren heeft bereikt, op diens verzoek de persoonsidentificerende gegevens van elke andere
      persoon die verwekt is door en ten gevolge van kunstmatige donorbevruchting waarbij gebruik is gemaakt van
      zaadcellen of eicellen van dezelfde donor, indien de betreffende persoon daarmee heeft ingestemd.

      2 Gelijktijdig met de verstrekking, bedoeld in het eerste lid, verstrekt het College de persoonsidentificerende
      gegevens van de verzoeker aan de betreffende persoon.

      3 Het College draagt zorg voor deskundige begeleiding bij de verstrekking van de gegevens.

      4 [Artikel 3, achtste lid][ref1], is van overeenkomstige toepassing.

      5 Indien de verzoeker, bedoeld in het eerste lid, uitsluitend inzage wenst in het aantal behandelingen waarbij
      gebruik is gemaakt van zaadcellen of eicellen van dezelfde donor, verstrekt het College uitsluitend dat gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel3
