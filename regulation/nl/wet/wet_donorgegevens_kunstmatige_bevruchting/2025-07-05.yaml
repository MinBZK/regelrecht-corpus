  - number: 12a
    text: |-
      1 Ten behoeve van de beoordeling van de toepasselijkheid van [artikel 12][ref1] op een verzoek om verstrekking
      deelt een verrichter op verzoek aan het College mede of ten tijde van de kunstmatige donorbevruchting ten gevolge
      waarvan de verzoeker is verwekt, de donor van wie daarbij de geslachtscellen zijn gebruikt, bij de verrichter
      bekend stond als een donor die niet instemt met de verstrekking van zijn persoonsidentificerende gegevens.

      2 Indien het College vaststelt dat de donor bij de verrichter niet bekend stond als een donor die niet instemt
      met de verstrekking van zijn persoonsidentificerende gegevens, is [artikel 12, tweede en derde lid][ref2],
      niet van toepassing op het verzoek. Het verzoek wordt in dat geval overeenkomstig
      [artikel 3, tweede en vierde tot en met zevende lid][ref3], behandeld. Indien de donor is overleden dan wel
      onvindbaar is, is artikel 3, vierde lid, van overeenkomstige toepassing, tenzij de donor toestemming als bedoeld
      in artikel 12, vijfde lid, heeft verleend. In dat geval geldt dat als die andere persoon weigert in te stemmen, die
      persoon in de gelegenheid wordt gesteld de belangen van de donor bij niet-verstrekking naar voren te brengen.

      3 De verrichter verstrekt op verzoek aan het College alle relevante gegevens die inzicht bieden in de afspraken
      met de donor omtrent de verstrekking van zijn persoonsidentificerende gegevens, indien dat noodzakelijk is voor de
      beslissing op een verzoek om verstrekking daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0013642#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0013642#Artikel3
