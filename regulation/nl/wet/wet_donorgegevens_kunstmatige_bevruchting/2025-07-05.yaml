    text: |-
      Indien de verrichter ten tijde van de kunstmatige donorbevruchting beschikte over een reservering voor een
      aan de donorcode gekoppelde moedercode, als bedoeld in [artikel 1a, onderdeel b][ref1], kent het College na de
      verstrekking van de gegevens, bedoeld in [artikel 2, tweede lid][ref2], aan de behandelde vrouw de moedercode toe
      en verstrekt het deze moedercode aan de verrichter.


