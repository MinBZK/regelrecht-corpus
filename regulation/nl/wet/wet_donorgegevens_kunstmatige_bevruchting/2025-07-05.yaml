      1 Indien een verrichter, anders dan met toepassing van [artikel 1b][ref1], een aan een donorcode gekoppelde
      moedercode die reeds aan een vrouw is toegekend wenst te verkrijgen, verstrekt de verrichter aan het College:

      a. de donorcode van de donor van wiens zaadcellen of eicellen de verrichter gebruik wenst te maken, en

      b. de geslachtsnaam, voornamen, geboortedatum en burgerservicenummer van die vrouw, tenzij aan de vrouw geen
      burgerservicenummer is toegekend krachtens de [Wet algemene bepalingen burgerservicenummer][ref2].

      2 Naar aanleiding van de verstrekking, bedoeld in het eerste lid, verstrekt het College aan de verrichter de aan de
      donorcode gekoppelde moedercode die reeds aan de vrouw is toegekend.


