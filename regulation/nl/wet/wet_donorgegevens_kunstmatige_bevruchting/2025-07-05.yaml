---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_donorgegevens_kunstmatige_bevruchting
regulatory_layer: WET
publication_date: '2025-06-04'
valid_from: '2025-07-05'
bwb_id: BWBR0013642
url: https://wetten.overheid.nl/BWBR0013642/2025-07-05
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gewenst is regels te stellen voor de bewaring, het beheer en de
    verstrekking van gegevens van donoren bij kunstmatige donorbevruchting;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1
  - number: 1.b
    text: |-
      College: College donorgegevens kunstmatige bevruchting als bedoeld in [artikel 4, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel4
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '4'
        paragraaf: '3'
  - number: 1.c
    text: |-
      kunstmatige donorbevruchting: het beroeps-of bedrijfsmatig verrichten van handelingen, gericht op het anders dan op
      natuurlijke wijze tot stand komen van een zwangerschap met gebruikmaking van:
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1
  - number: 1.c.1
    text: zaadcellen van een ander dan de echtgenoot, geregistreerde partner of andere levensgezel van de vrouw of
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1
  - number: 1.c.2
    text: eicellen van een andere vrouw;
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1
  - number: 1.d
    text: 'donor: degene die zaadcellen of eicellen heeft afgestaan ten behoeve van kunstmatige donorbevruchting;'
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1
  - number: 1.e
    text: |-
      de Kaderwet: de [Kaderwet zelfstandige bestuursorganen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: 1.f
    text: |-
      verrichter: instelling of een natuurlijke persoon die, anders dan in dienst of onmiddellijk of middellijk in
      opdracht van een instelling, kunstmatige donorbevruchting verricht;
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1
  - number: 1.g
    text: |-
      instelling: rechtspersoon die kunstmatige donorbevruchting verricht of doet verrichten, een organisatorisch verband
      van natuurlijke personen die kunstmatige donorbevruchting verricht of doet verrichten, dan wel een natuurlijk
      persoon die kunstmatige donorbevruchting doet verrichten;
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1
  - number: 1.h
    text: 'donorcode: het als zodanig overeenkomstig deze wet aan een donor toegekend nummer;'
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1
  - number: 1.i
    text: 'moedercode: het als zodanig overeenkomstig deze wet aan een donorcode gekoppeld nummer;'
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1
  - number: 1.j
    text: |-
      wettelijk maximumaantal moedercodes: het bij algemene maatregel van bestuur bepaalde maximumaantal moedercodes dat
      aan een donorcode wordt gekoppeld.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1
  - number: 1a.1
    text: 'Kunstmatige donorbevruchting is uitsluitend toegestaan indien de verrichter beschikt over:'
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1a
  - number: 1a.1.a
    text: de donorcode van de donor van wiens zaadcellen of eicellen de verrichter gebruik wenst te maken, en
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1a
  - number: 1a.1.b
    text: |-
      een reservering voor een aan die donorcode gekoppelde moedercode of een aan die donorcode gekoppelde moedercode die
      reeds aan de te behandelen vrouw is toegekend.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1a
  - number: 1a.2
    text: |-
      Indien ten tijde van de behandeling de te behandelen vrouw de echtgenote of geregistreerde partner is van de vrouw
      aan wie de in het eerste lid, onderdeel b, bedoelde moedercode reeds is toegekend, of een samenlevingscontract met
      die vrouw heeft gesloten, is in afwijking van het eerste lid, onderdeel b, kunstmatige donorbevruchting toegestaan
      met gebruikmaking van de reeds toegekende moedercode.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1a
  - number: 1b.1
    text: |-
      Ten behoeve van het verkrijgen van de donorcode, bedoeld in [artikel 1a, onderdeel a][ref1], verstrekt de
      verrichter aan het College:


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel1a
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: 1a
        paragraaf: 1a
  - number: 1b.1.a
    text: de geslachtsnaam, voornamen, geboortedatum en woonplaats van de donor en het type donatie,
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1b
  - number: 1b.1.b
    text: |-
      het burgerservicenummer van de donor, tenzij aan de donor geen burgerservicenummer is toegekend krachtens de
      [Wet algemene bepalingen burgerservicenummer][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0022428
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0022428
  - number: 1b.1.c
    text: |-
      het door de donor bepaalde maximumaantal aan de donorcode te koppelen moedercodes, indien dat aantal lager is dan
      het wettelijk maximumaantal moedercodes.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1b
  - number: 1b.1.c.2
    text: 'Gelijktijdig met de verstrekking, bedoeld in het eerste lid, verstrekt de verrichter aan het College:'
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1b
  - number: 1b.1.a
    text: |-
      het aantal aan de donorcode gekoppelde moedercodes dat de verrichter wenst te reserveren, indien dat aantal lager
      is dan het wettelijk maximumaantal moedercodes dan wel het door de donor bepaalde lagere maximumaantal, of
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1b
  - number: 1b.1.b
    text: |-
      ten behoeve van het verkrijgen van een aan de donorcode gekoppelde moedercode die reeds aan een vrouw is toegekend,
      de geslachtsnaam, voornamen, geboortedatum en burgerservicenummer van die vrouw, tenzij aan de vrouw geen
      burgerservicenummer is toegekend krachtens de [Wet algemene bepalingen burgerservicenummer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0022428
  - number: 1b.1.b.3
    text: De verrichter stelt de donor op de hoogte van de gegevensverstrekking, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1b
  - number: 1c
    text: |-
      Het College kent aan een donor van wie niet eerder de gegevens, bedoeld in
      [artikel 1b, eerste lid, onderdeel a][ref1], zijn verstrekt, eenmalig een donorcode toe en koppelt daaraan het
      wettelijk maximumaantal moedercodes of het door de donor bepaalde lagere maximumaantal moedercodes, bedoeld in
      artikel 1b, eerste lid, onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel1b
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: 1b
        paragraaf: 1a
  - number: 1d.1
    text: |-
      Het College verstrekt aan de verrichter die de gegevens, bedoeld in [artikel 1b, eerste lid][ref1], heeft
      verstrekt, de donorcode. Indien de donorcode reeds eerder na verstrekking van de gegevens door een andere
      verrichter is toegekend, wordt daarvan mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel1b
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: 1b
        paragraaf: 1a
  - number: 1d.2
    text: |-
      Gelijktijdig met de verstrekking, bedoeld in het eerste lid, reserveert het College ten behoeve van de verrichter
      het maximale aantal aan de donorcode gekoppelde moedercodes, tenzij de verrichter gegevens als bedoeld in
      [artikel 1b, tweede lid][ref1], heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel1b
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: 1b
        paragraaf: 1a
  - number: 1d.3
    text: |-
      Indien de verrichter de gegevens, bedoeld in [artikel 1b, tweede lid, onderdeel a][ref1], heeft verstrekt,
      reserveert het College gelijktijdig met de verstrekking, bedoeld in het eerste lid, ten behoeve van de verrichter
      het aantal door de verrichter verzochte moedercodes.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel1b
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: 1b
        paragraaf: 1a
  - number: 1d.4
    text: |-
      Indien de verrichter de gegevens, bedoeld in [artikel 1b, tweede lid, onderdeel b][ref1], heeft verstrekt,
      verstrekt het College, gelijktijdig met de verstrekking, bedoeld in het eerste lid, aan de verrichter de aan die
      donorcode gekoppelde moedercode die reeds aan een vrouw is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel1b
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: 1b
        paragraaf: 1a
  - number: 1d.5
    text: |-
      Het eerste, tweede of derde lid zijn niet van toepassing, indien er geen aan de donorcode gekoppelde moedercode
      meer beschikbaar is. In dat geval volstaat het College met mededeling daarvan aan de verrichter.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1d
  - number: 1e.1
    text: |-
      Indien een verrichter, anders dan met toepassing van [artikel 1b][ref1], een reservering voor een aan een donorcode
      gekoppelde moedercode wenst te verkrijgen, verstrekt de verrichter aan het College:


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel1b
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1e
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: 1b
        paragraaf: 1a
  - number: 1e.1.a
    text: de donorcode van de donor van wiens zaadcellen of eicellen de verrichter gebruik wenst te maken, en
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1e
  - number: 1e.1.b
    text: het aantal aan die donorcode gekoppelde moedercodes dat de verrichter wenst te reserveren.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1e
  - number: 1e.2
    text: |-
      Naar aanleiding van de verstrekking, bedoeld in het eerste lid, reserveert het College ten behoeve van de
      verrichter het aantal door de verrichter verzochte moedercodes, tenzij er geen aan de donorcode gekoppelde
      moedercode meer beschikbaar is. In dat geval volstaat het College met mededeling daarvan aan de verrichter.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1e
  - number: 1f.1
    text: |-
      Indien een verrichter, anders dan met toepassing van [artikel 1b][ref1], een aan een donorcode gekoppelde
      moedercode die reeds aan een vrouw is toegekend wenst te verkrijgen, verstrekt de verrichter aan het College:


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel1b
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1f
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: 1b
        paragraaf: 1a
  - number: 1f.1.a
    text: de donorcode van de donor van wiens zaadcellen of eicellen de verrichter gebruik wenst te maken, en
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1f
  - number: 1f.1.b
    text: |-
      de geslachtsnaam, voornamen, geboortedatum en burgerservicenummer van die vrouw, tenzij aan de vrouw geen
      burgerservicenummer is toegekend krachtens de [Wet algemene bepalingen burgerservicenummer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1f
    references:
      - id: ref1
        bwb_id: BWBR0022428
  - number: 1f.2
    text: |-
      Naar aanleiding van de verstrekking, bedoeld in het eerste lid, verstrekt het College aan de verrichter de aan de
      donorcode gekoppelde moedercode die reeds aan de vrouw is toegekend.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1f
  - number: 1g.1
    text: |-
      Indien de donor het maximumaantal moedercodes wenst te verlagen, doet de verrichter daarvan mededeling aan het
      College.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1g
  - number: 1g.2
    text: |-
      Het College verlaagt het aantal moedercodes tot het door de donor bepaalde aantal en draagt ervoor zorg dat een
      reservering voor een niet langer beschikbare moedercode ongedaan wordt gemaakt. Het College doet daarvan mededeling
      aan de verrichter, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1g
  - number: 1g.3
    text: |-
      Toepassing van het tweede lid geschiedt niet ten aanzien van een moedercode die naar aanleiding van een reeds
      plaatsgevonden behandeling aan een vrouw is toegekend. Het College doet daarvan mededeling aan de verrichter,
      bedoeld in het eerste lid. De verrichter dient hiervan mededeling te doen aan de donor.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1g
  - number: 1h.1
    text: |-
      Indien na toepassing van [artikel 1c][ref1] aan een donorcode minder dan het wettelijk maximumaantal moedercodes
      zijn gekoppeld en de donor het aantal moedercodes wenst te verhogen, doet de verrichter daarvan mededeling aan
      het College.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel1c
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1h
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: 1c
        paragraaf: 1a
  - number: 1h.2
    text: |-
      Het College verhoogt het aantal moedercodes tot het door de donor bepaalde aantal met inachtneming van het
      wettelijk maximumaantal moedercodes en reserveert deze moedercodes ten behoeve van de verrichter, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1h
  - number: 1i
    text: |-
      Indien een verrichter geen gebruik meer wenst te maken van een ten behoeve van hem gereserveerde moedercode, doet
      hij daarvan mededeling aan het College. Het College draagt ervoor zorg dat de reservering ongedaan wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1i
  - number: 1j.1
    text: |-
      Het College kan uit eigen beweging aan een donor een donorcode toekennen of aan een donorcode een moedercode
      koppelen en deze moedercode toekennen aan een behandelde vrouw. Het College kan daartoe gegevens opvragen bij een
      verrichter die gehouden is de gevraagde gegevens aan het College te verstrekken.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1j
  - number: 1j.2
    text: |-
      Bij de toepassing van het eerste lid maakt het College een reservering voor een moedercode ongedaan indien daarmee
      overschrijding van het wettelijk maximumaantal moedercodes of het door de donor bepaalde lagere maximumaantal
      wordt voorkomen. Het College doet hiervan mededeling aan de verrichter ten behoeve van wie de moedercode was
      gereserveerd.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1j
  - number: 1j.3
    text: |-
      Indien toepassing van het tweede lid niet mogelijk is, is het College bevoegd om bij de toepassing van het eerste
      lid het wettelijk maximumaantal moedercodes of het door de donor bepaalde lagere maximumaantal te overschrijden.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1j
  - number: '2.1'
    text: |-
      De verrichter is ter zake van een kunstmatige donorbevruchting verplicht om binnen een door het College bij
      reglement te bepalen termijn de volgende gegevens aan het College te verstrekken:
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel2
  - number: 2.1.a
    text: de donorcode van de donor van wiens zaadcellen of eicellen de verrichter gebruik heeft gemaakt, en
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel2
  - number: 2.1.b
    text: |-
      de volgende gegevens van de donor: fysieke kenmerken, opleiding en beroep, alsmede gegevens omtrent de sociale
      achtergrond en een aantal persoonlijke kenmerken, een en ander zoals bij algemene maatregel van bestuur nader
      bepaald.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel2
  - number: '2.2'
    text: |-
      De verrichter is tevens verplicht om binnen de termijn, bedoeld in het eerste lid, de volgende gegevens aan het
      College te verstrekken:
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel2
  - number: 2.2.a
    text: |-
      de geslachtsnaam, voornamen, geboortedatum, woonplaats van de vrouw bij wie kunstmatige donorbevruchting heeft
      plaatsgevonden, alsmede het burgerservicenummer, tenzij aan de vrouw geen burgerservicenummer is toegekend
      krachtens de [Wet algemene bepalingen burgerservicenummer][ref1], of de reeds aan deze vrouw toegekende
      moedercode die gekoppeld is aan de donorcode van de donor, bedoeld in het eerste lid. In de situatie, bedoeld in
      [artikel 1a, tweede lid][ref2], dient de verrichter zowel de persoonsidentificerende gegevens van de behandelde
      vrouw als de gebruikte reeds toegekende moedercode te verstrekken,


      [ref1]: https://wetten.overheid.nl/BWBR0022428
      [ref2]: https://wetten.overheid.nl/BWBR0013642#Artikel1a
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022428
      - id: ref2
        bwb_id: BWBR0013642
        artikel: 1a
        paragraaf: 1a
  - number: 2.2.b
    text: het tijdstip waarop de donorbevruchting heeft plaatsgevonden, en
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel2
  - number: 2.2.c
    text: de aantekening of de identiteit van de donor, bedoeld in het eerste lid, bekend is aan de vrouw.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel2
  - number: '2.3'
    text: |-
      De gegevens bedoeld in het eerste lid, onderdeel b, mogen afzonderlijk of in combinatie niet herleidbaar zijn tot
      de individuele donor.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel2
  - number: '2.4'
    text: |-
      De verplichtingen, bedoeld in het eerste en het tweede lid, gelden niet of vervallen, zodra komt vast te staan dat
      de bevruchting niet tot de geboorte van een kind heeft geleid, tenzij de terbeschikkingstelling van de betreffende
      gegevens voor het College noodzakelijk is ter uitvoering van de taak, bedoeld in [artikel 3a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel3a
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: 3a
        paragraaf: '2'
  - number: 2a
    text: |-
      Indien de verrichter ten tijde van de kunstmatige donorbevruchting beschikte over een reservering voor een
      aan de donorcode gekoppelde moedercode, als bedoeld in [artikel 1a, onderdeel b][ref1], kent het College na de
      verstrekking van de gegevens, bedoeld in [artikel 2, tweede lid][ref2], aan de behandelde vrouw de moedercode toe
      en verstrekt het deze moedercode aan de verrichter.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0013642#Artikel2
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: 1a
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
  - number: '3.1'
    text: 'Het College verstrekt de bij hem berustende gegevens van de betrokken donor:'
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3
  - number: 3.1.a
    text: |-
      aan degene die is verwekt door en ten gevolge van kunstmatige donorbevruchting en die de leeftijd
      van twaalf jaren heeft bereikt, op zijn verzoek, voor zover het betreft de gegevens, bedoeld in
      [artikel 2, eerste lid, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel2
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
  - number: 3.1.b
    text: |-
      aan de ouders of een van hen van het kind dat door en tengevolge van kunstmatige donorbevruchting is verwekt,
      op hun verzoek, indien het kind de leeftijd van twaalf jaren nog niet heeft bereikt en voor zover het betreft de
      gegevens, bedoeld in [artikel 2, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel2
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      De persoonsidentificerende gegevens van de donor worden aan degene die is verwekt door en ten gevolge van
      kunstmatige donorbevruchting en die de leeftijd van zestien jaren heeft bereikt, op zijn verzoek verstrekt,
      nadat de donor daarmee schriftelijk heeft ingestemd. Verstrekking blijft, indien de donor daarmee niet instemt,
      uitsluitend achterwege indien, in aanmerking genomen de gevolgen die niet-verstrekking voor de verzoeker zou
      kunnen hebben, zwaarwegende belangen van de donor meebrengen dat verstrekking niet behoort plaats te vinden. De
      naar aanleiding van deze belangenafweging te nemen beslissing wordt door het College genomen na daarover advies te
      hebben ingewonnen van een adviescommissie, tenzij naar het oordeel van het College de noodzaak daartoe ontbreekt.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3
  - number: '3.3'
    text: |-
      Indien de donor is overleden dan wel onvindbaar is, wordt de instemming, bedoeld in het tweede lid, geacht te
      zijn geweigerd, tenzij de echtgenoot, geregistreerde partner of andere levensgezel dan wel, bij het ontbreken
      van een van hen, een bloedverwant in de eerste of tweede graad, schriftelijk instemt met de verstrekking van de
      persoonsidentificerende gegevens. Na een weigering in te stemmen worden de in de eerste volzin bedoelde personen in
      de gelegenheid gesteld de belangen van de donor bij niet-verstrekking naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3
  - number: '3.4'
    text: |-
      Het bestuur van het College stelt de donor onverwijld schriftelijk in kennis van een voorgenomen verstrekking van
      zijn persoonsgegevens, alsmede van de gronden waarop dit voornemen berust. Tegen de voorgenomen verstrekking kan
      de donor bezwaar maken bij het College. Verstrekking geschiedt, indien deze niet berust op instemming van de donor,
      niet dan nadat de beslissing op het bezwaar onherroepelijk is geworden. Indien verstrekking van de persoonsgegevens
      achterwege blijft op de grond, bedoeld in het slot van het tweede lid, kan de aanvrager tegen het daartoe
      strekkende besluit bezwaar maken bij het College.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3
  - number: '3.5'
    text: |-
      [Artikel 6:5, eerste lid, aanhef en onderdeel a, van de Algemene wet bestuursrecht][ref1] is niet van toepassing
      ten aanzien van de donor.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '3.6'
    text: |-
      Van een verstrekking van gegevens van de donor aan een minderjarige die de leeftijd van zestien jaren nog niet
      heeft bereikt, worden de ouders op de hoogte gesteld. Aan de minderjarige wordt hiervan mededeling gedaan. Op
      verzoek van beide ouders of van een van hen worden deze gegevens eveneens aan hen verstrekt.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3
  - number: '3.7'
    text: |-
      Het College draagt zorg voor deskundige begeleiding bij de verstrekking van de gegevens, bedoeld in het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3
  - number: '3.8'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke bescheiden een verzoek tot verstrekking van gegevens van de
      donor moeten vergezellen.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3
  - number: '3.9'
    text: |-
      Het College stelt bij reglement in ieder geval regels vast omtrent de samenstelling van de adviescommissie, die tot
      taak heeft te adviseren over de beoordeling van door de donor aangevoerde zwaarwegende belangen als bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3
  - number: 3a
    text: |-
      Op verzoek van de ouder van het kind dat door kunstmatige donorbevruchting is verwekt, verstrekt
      het College een verklaring als bedoeld in [artikelen 198, eerste lid, onder b][ref1], of
      [227, vierde lid, van Boek 1 van het Burgerlijk Wetboek][ref2], waarin de persoonsidentificerende gegevens van de
      donor niet worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel198
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel227
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '198'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '227'
  - number: 3b.1
    text: |-
      Het College verstrekt aan degene die is verwekt door en ten gevolge van kunstmatige donorbevruchting en die de
      leeftijd van zestien jaren heeft bereikt, op diens verzoek de persoonsidentificerende gegevens van elke andere
      persoon die verwekt is door en ten gevolge van kunstmatige donorbevruchting waarbij gebruik is gemaakt van
      zaadcellen of eicellen van dezelfde donor, indien de betreffende persoon daarmee heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3b
  - number: 3b.2
    text: |-
      Gelijktijdig met de verstrekking, bedoeld in het eerste lid, verstrekt het College de persoonsidentificerende
      gegevens van de verzoeker aan de betreffende persoon.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3b
  - number: 3b.3
    text: Het College draagt zorg voor deskundige begeleiding bij de verstrekking van de gegevens.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3b
  - number: 3b.4
    text: |-
      [Artikel 3, achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel3
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '3'
        paragraaf: '2'
  - number: 3b.5
    text: |-
      Indien de verzoeker, bedoeld in het eerste lid, uitsluitend inzage wenst in het aantal behandelingen waarbij
      gebruik is gemaakt van zaadcellen of eicellen van dezelfde donor, verstrekt het College uitsluitend dat gegeven.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3b
  - number: 3c.1
    text: |-
      In dit artikel wordt verstaan onder erfelijke aandoening: een aandoening ter zake waarvan uit een professionele
      standaard als bedoeld in de [Wet kwaliteit, klachten en geschillen zorg][ref1], voortvloeit dat personen met een
      risico op erfelijke aanleg voor die aandoening daarover dienen te worden geïnformeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037173
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0037173
  - number: 3c.2
    text: |-
      Een arts die werkzaam is in een instelling met een vergunning krachtens
      de [Wet op bijzondere medische verrichtingen][ref1] voor het verrichten
      van klinisch genetisch onderzoek en erfelijkheidsadvisering als bedoeld in
      [artikel 1, onderdeel h, van de Regeling aanwijzing bijzondere medische verrichtingen][ref2], en die geconstateerd
      heeft dat ten aanzien van een persoon die een donor als bedoeld in deze wet is, sprake is van een erfelijke
      aandoening, doet hiervan mededeling aan het College.


      [ref1]: https://wetten.overheid.nl/BWBR0008974
      [ref2]: https://wetten.overheid.nl/BWBR0035311#Artikel1
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0008974
      - id: ref2
        bwb_id: BWBR0035311
        artikel: '1'
  - number: 3c.3
    text: |-
      Naar aanleiding van de in het tweede lid bedoelde mededeling verstrekt het College aan de arts de
      persoonsidentificerende gegevens van degene die is verwekt door en ten gevolge van kunstmatige donorbevruchting
      waarbij gebruik is gemaakt van de geslachtscellen van de betreffende donor, indien het College over die
      gegevens beschikt vanwege een eerder ingediend verzoek als bedoeld in deze paragraaf, en indien aan de orde de
      persoonsidentificerende gegevens van de donor. Indien het College niet over de gegevens beschikt van degene die
      is verwekt door en ten gevolge van kunstmatige donorbevruchting waarbij gebruik is gemaakt van de geslachtscellen
      van de betreffende donor, verstrekt het aan de arts de persoonsidentificerende gegevens van de vrouw bij wie
      kunstmatige donorbevruchting heeft plaatsgevonden met gebruikmaking van de geslachtscellen van de betreffende donor
      om de arts in staat te stellen te kunnen voldoen aan de in het eerste lid bedoelde professionele standaard.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3c
  - number: 3c.4
    text: |-
      Het College informeert de verrichter of verrichters die gebruik hebben gemaakt van de geslachtscellen van de donor
      ten aanzien van wie de mededeling is gedaan, over de betreffende mededeling.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel3c
  - number: '4.1'
    text: Er is een College donorgegevens kunstmatige bevruchting.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel4
  - number: '4.2'
    text: 'Het College heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel4
  - number: 4.2.a
    text: |-
      de gegevens, bedoeld in [paragraaf 1a][ref1] en de [artikelen 2, eerste en tweede lid][ref2], en
      [3c, eerste lid][ref3], te bewaren, te beheren en te verstrekken overeenkomstig de bepalingen bij of krachtens de
      wet gesteld. Het College stelt ter uitvoering van deze taak bij reglement regels;


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Paragraaf1a
      [ref2]: https://wetten.overheid.nl/BWBR0013642#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013642#Artikel3c
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013642
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013642
        artikel: 3c
        paragraaf: '2'
  - number: 4.2.b
    text: |-
      bij reglement te bepalen op welke wijze en op welk moment de gegevens bedoeld in de
      [artikel 2, eerste en tweede lid][ref1], aan het College worden verstrekt en op welke wijze deze gegevens door het
      College aan een persoon als bedoeld in de [artikelen 3][ref2] en [3c][ref3] worden verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013642#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013642#Artikel3c
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013642
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013642
        artikel: 3c
        paragraaf: '2'
  - number: 4.2.c
    text: |-
      bij reglement te bepalen op welke wijze de gegevens, bedoeld in [artikel 3b][ref1], aan een persoon als bedoeld in
      dat artikel worden verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel3b
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: 3b
        paragraaf: '2'
  - number: 4.2.d
    text: |-
      voorlichting te verschaffen, voor zover de onder a, b en c omschreven taken van het College dat vereisen, alsmede
      zorg te dragen voor de begeleiding bij de verstrekking van deze gegevens;
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel4
  - number: 4.2.e
    text: andere bij regeling van Onze Minister opgedragen taken die verband houden met het door deze wet bestreken terrein.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel4
  - number: '4.3'
    text: |-
      Degenen op wie de verplichtingen, bedoeld in [paragraaf 1a][ref1] of [artikel 2][ref2], rusten, zijn verplicht het
      reglement van het College na te leven.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Paragraaf1a
      [ref2]: https://wetten.overheid.nl/BWBR0013642#Artikel2
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013642
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
  - number: '4.4'
    text: |-
      De Kaderwet is van toepassing op het College. [Artikel 22 van de Kaderwet][ref1] is niet van toepassing op
      besluiten van het College inzake bewaring, beheer of verstrekking van de gegevens, bedoeld in [paragraaf 1a][ref2]
      of de [artikelen 2][ref3] en [3c, eerste lid.][ref4]


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0013642#Paragraaf1a
      [ref3]: https://wetten.overheid.nl/BWBR0013642#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0013642#Artikel3c
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0013642
        paragraaf: 1a
      - id: ref3
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0013642
        artikel: 3c
        paragraaf: '2'
  - number: '5.1'
    text: Het College bestaat uit zeven leden, onder wie een voorzitter.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel5
  - number: '5.2'
    text: 'Het College bestaat in elk geval uit:'
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel5
  - number: 5.2.a
    text: een persoon die door en ten gevolge van kunstmatige donorbevruchting is verwekt,
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel5
  - number: 5.2.b
    text: een persoon die kunstmatige bevruchting beroepsmatig toepast of nauw daarbij betrokken is,
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel5
  - number: 5.2.c
    text: een persoon die deskundig is op psychosociaal terrein op het gebied van kunstmatige bevruchting,
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel5
  - number: 5.2.d
    text: een persoon die deskundig is op pedagogisch terrein,
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel5
  - number: 5.2.e
    text: een persoon die deskundig is op juridische terrein, en
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel5
  - number: 5.2.f
    text: een persoon die deskundig is op ethisch terrein.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel5
  - number: '5.3'
    text: |-
      De leden worden benoemd voor een periode van ten hoogste vier jaar. Herbenoeming kan eenmaal voor ten hoogste
      eenzelfde periode plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel5
  - number: '5.4'
    text: Het College wordt in en buiten rechte vertegenwoordigd door de voorzitter.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel5
  - number: '6.1'
    text: |-
      Het reglement van het College alsmede wijziging daarvan behoeft de goedkeuring van Onze Minister. Goedkeuring kan
      worden geweigerd wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel6
  - number: '6.2'
    text: |-
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op de goedkeuring, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '7'
    text: Onze Minister voorziet in het secretariaat van het College.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel7
  - number: '8'
    text: |-
      Het College draagt zorg voor een zorgvuldige bewaring van de gegevens, bedoeld in [paragraaf 1a][ref1] en de
      [artikelen 2, eerste en tweede lid][ref2], en [3c, eerste lid][ref3], gedurende ten minste tachtig jaren te rekenen
      van de dag waarop het deze gegevens ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Paragraaf1a
      [ref2]: https://wetten.overheid.nl/BWBR0013642#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013642#Artikel3c
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013642
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013642
        artikel: 3c
        paragraaf: '2'
  - number: '10.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      Inspectie gezondheidszorg en jeugd.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel10
  - number: '10.2'
    text: |-
      De aan de in het eerste lid bedoelde ambtenaren toekomende bevoegdheden, bedoeld in de [artikelen 5:16][ref1]
      en [5:17 van de Algemene wet bestuursrecht][ref2], hebben mede betrekking op de gegevens, bedoeld in de
      [artikelen 1a][ref3], [2, eerste of tweede lid][ref4], of [12a, derde lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0013642#Artikel1a
      [ref4]: https://wetten.overheid.nl/BWBR0013642#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0013642#Artikel12a
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0013642
        artikel: 1a
        paragraaf: 1a
      - id: ref4
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0013642
        artikel: 12a
        paragraaf: '5'
  - number: '10.3'
    text: |-
      Voor zover de verrichter dan wel het College uit hoofde van ambt, beroep of wettelijk voorschrift
      tot geheimhouding van de gegevens verplicht is, kan diegene deze verplichting, in afwijking van
      [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref1], niet inroepen tegenover de in het eerste
      lid bedoelde ambtenaren. Op deze ambtenaren rust dezelfde geheimhoudingsplicht als op de verrichter dan wel op
      het College.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 10a
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder dwangsom aan de verrichter ter handhaving van het
      bepaalde in [artikelen 2, eerste of tweede lid][ref1], [12a, eerste of derde lid][ref2], en [13, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013642#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0013642#Artikel13
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013642
        artikel: 12a
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0013642
        artikel: '13'
        paragraaf: '5'
  - number: 10b.1
    text: |-
      Onze Minister is bevoegd een bestuurlijke boete op te leggen ter zake van overtreding van de [artikelen 1a][ref1]
      of [2, eerste of tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0013642#Artikel2
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: 1a
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
  - number: 10b.2
    text: |-
      De op grond van het eerste lid op te leggen bestuurlijke boete bedraagt ten hoogste het bedrag dat is vastgesteld
      voor de derde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '11.1'
    text: |-
      Met een hechtenis van ten hoogste zes maanden of een boete van de derde categorie wordt gestraft degene die handelt
      in strijd met een verplichting, bedoeld in de [artikelen 1a][ref1] of [2, eerste of tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0013642#Artikel2
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: 1a
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
  - number: '11.2'
    text: Het in het eerste lid strafbaar gestelde feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel11
  - number: '12.1'
    text: |-
      De op het tijdstip waarop [artikel 4][ref1] in werking treedt bij natuurlijke personen of rechtspersonen aanwezige
      gegevens, bedoeld in [artikel 2][ref2], worden aan de Stichting donorgegevens kunstmatige bevruchting of het
      College overdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013642#Artikel2
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
  - number: '12.2'
    text: |-
      Tot de volledige inwerkingtreding van de wet kan de donor die voorafgaande aan de volledige inwerkingtreding
      daarvan zaadcellen of eicellen heeft afgestaan, op schrift verklaren dat de op hem betrekking hebbende gegevens
      inzake geslachtsnaam, voornamen, geboortedatum en woonplaats niet worden verstrekt aan degene die weet of vermoedt
      dat hij is verwekt door en ten gevolge van kunstmatige bevruchting of aan diens ouders, indien een verzoek daartoe
      wordt gedaan. De verklaring wordt door de verrichter aan de Stichting donorgegevens kunstmatige bevruchting of het
      College verstrekt.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel12
  - number: '12.3'
    text: |-
      De in het tweede lid bedoelde gegevens omtrent een donor die een verklaring als bedoeld in het tweede lid niet
      heeft afgelegd worden niet verstrekt aan degene die weet of vermoedt dat hij is verwekt door en ten gevolge van
      kunstmatige bevruchting of aan diens ouders dan met instemming van de donor.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel12
  - number: '12.4'
    text: |-
      Gegevens omtrent fysieke kenmerken, opleiding en beroep, alsmede gegevens omtrent de sociale achtergrond
      en omtrent persoonlijke kenmerken, worden verstrekt overeenkomstig de [artikelen 2, derde lid][ref1], en
      [3, eerste lid, onderdelen a en b, en zesde en zevende lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013642#Artikel3
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013642
        artikel: '3'
        paragraaf: '2'
  - number: '12.5'
    text: |-
      Het College verzoekt een andere persoon dan de donor om de instemming, bedoeld in het derde lid, indien de donor
      is overleden en de donor het College toestemming heeft verleend om na zijn overlijden die andere persoon voor het
      vragen van instemming te benaderen. Bij de gegevensverwerking die noodzakelijk is voor de uitvoering hiervan kan
      gebruik worden gemaakt van het burgerservicenummer van die andere persoon.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel12
  - number: 12a.1
    text: |-
      Ten behoeve van de beoordeling van de toepasselijkheid van [artikel 12][ref1] op een verzoek om verstrekking deelt
      een verrichter op verzoek aan het College mede of ten tijde van de kunstmatige donorbevruchting ten gevolge waarvan
      de verzoeker is verwekt, de donor van wie daarbij de geslachtscellen zijn gebruikt, bij de verrichter bekend stond
      als een donor die niet instemt met de verstrekking van zijn persoonsidentificerende gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel12
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '12'
        paragraaf: '5'
  - number: 12a.2
    text: |-
      Indien het College vaststelt dat de donor bij de verrichter niet bekend stond als een donor die niet instemt
      met de verstrekking van zijn persoonsidentificerende gegevens, is [artikel 12, tweede en derde lid][ref1],
      niet van toepassing op het verzoek. Het verzoek wordt in dat geval overeenkomstig
      [artikel 3, tweede en vierde tot en met zevende lid][ref2], behandeld. Indien de donor is overleden dan wel
      onvindbaar is, is artikel 3, vierde lid, van overeenkomstige toepassing, tenzij de donor toestemming als bedoeld
      in artikel 12, vijfde lid, heeft verleend. In dat geval geldt dat als die andere persoon weigert in te stemmen, die
      persoon in de gelegenheid wordt gesteld de belangen van de donor bij niet-verstrekking naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0013642#Artikel3
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '12'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0013642
        artikel: '3'
        paragraaf: '2'
  - number: 12a.3
    text: |-
      De verrichter verstrekt op verzoek aan het College alle relevante gegevens die inzicht bieden in de afspraken met
      de donor omtrent de verstrekking van zijn persoonsidentificerende gegevens, indien dat noodzakelijk is voor de
      beslissing op een verzoek om verstrekking daarvan.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel12a
  - number: '13.1'
    text: |-
      Indien een verrichter gebruik wenst te maken van zaadcellen of eicellen van een
      donor van wie de geslachtscellen reeds voorafgaand aan de inwerkingtreding van de
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      __________________________________________________________________________________ (Stb. 2023, 294, door hem zijn
      gebruikt bij een kunstmatige donorbevruchting, doet de verrichter bij de verstrekking van de gegevens, bedoeld in
      [artikel 1b, eerste lid][ref2], daarvan mededeling aan het College.


      [ref1]: https://wetten.overheid.nl/BWBR0048615
      [ref2]: https://wetten.overheid.nl/BWBR0013642#Artikel1b
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0048615
      - id: ref2
        bwb_id: BWBR0013642
        artikel: 1b
        paragraaf: 1a
  - number: '13.2'
    text: |-
      Alvorens op grond van [artikel 1c][ref1] aan de toegekende donorcode een of meerdere moedercodes te koppelen,
      verstrekt het College aan de verrichter, bedoeld in het eerste lid, een overzicht van de bij hem berustende
      gegevens over elke vrouw bij wie kunstmatige donorbevruchting heeft plaatsgevonden met gebruikmaking van zaadcellen
      of eicellen van de donor, bedoeld in het eerste lid. Indien uit de bij het College berustende gegevens blijkt dat
      ook een andere verrichter de geslachtscellen van de betreffende donor bij een kunstmatige donorbevruchting heeft
      gebruikt, verstrekt het College ook een overzicht aan die andere verrichter.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel1c
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: 1c
        paragraaf: 1a
  - number: '13.3'
    text: |-
      De verrichter, bedoeld in het tweede lid, vergewist zich van de juistheid en volledigheid van het overzicht en doet
      daarvan mededeling aan het College. De verrichter vult het overzicht aan door verstrekking van de gegevens, bedoeld
      in [artikel 2, tweede lid][ref1], van elke vrouw bij wie kunstmatige donorbevruchting heeft plaatsgevonden met
      gebruikmaking van zaadcellen of eicellen van de donor, bedoeld in het eerste lid, indien deze gegevens in het door
      het College verstrekte overzicht ontbreken.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel2
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
  - number: '13.4'
    text: |-
      Bij de toepassing van [artikel 1c][ref1] bedraagt het aantal door het College aan de donorcode van de donor,
      bedoeld in het eerste lid, te koppelen moedercodes ten hoogste het wettelijk maximumaantal moedercodes of het door
      de donor bepaalde lagere maximumaantal minus het aantal vrouwen bij wie blijkens het overzicht of de overzichten
      kunstmatige donorbevruchting heeft plaatsgevonden met gebruikmaking van zaadcellen of eicellen van de donor.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel1c
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: 1c
        paragraaf: 1a
  - number: '13.5'
    text: |-
      Het College kent eenmalig een moedercode toe aan elke vrouw bij wie voorafgaand aan de inwerkingtreding van
      de in het eerste lid genoemde [wet kunstmatige donorbevruchting][ref1] heeft plaatsgevonden met gebruikmaking
      van zaadcellen of eicellen van de donor, bedoeld in het eerste lid. Het College doet hiervan mededeling aan de
      betrokken verrichter of verrichters.


      [ref1]: https://wetten.overheid.nl/BWBR0048615
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0048615
  - number: '13.6'
    text: |-
      Bij de toepassing van [artikel 1d, tweede of derde lid][ref1], reserveert het College ten behoeve van de
      verrichter, bedoeld in het eerste lid, ten hoogste het aantal moedercodes dat na toepassing van het vierde en
      vijfde lid nog beschikbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel1d
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: 1d
        paragraaf: 1a
  - number: 13a
    text: |-
      Het College verstrekt aan de huisarts van degene die is verwekt door en ten gevolge
      van kunstmatige donorbevruchting, op zijn verzoek, de medische gegevens, bedoeld in
      [artikel 2, eerste lid, onderdeel a][ref1], zoals deze luidde voorafgaand aan de inwerkingtreding van de
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      __________________________________________________________________________________ (Stb. 2023, 294, met
      uitzondering van gegevens over de bloedgroep, rhesusfactor of bloedgroeptypering van de donor.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0048615
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0048615
  - number: 13b
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport zendt binnen vijf jaar na de inwerkingtreding van de
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      __________________________________________________________________________________ (Stb. 2023, 294), en vervolgens
      telkens na vijf jaar, aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in
      de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0048615
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0048615
  - number: '14'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan luiden met uitzondering van
      [artikel 3, tweede lid, tweede volzin, en derde tot en met vijfde lid][ref1], welke bepalingen in werking treden
      met ingang van de eerste kalendermaand na verloop van twee jaren na de datum van uitgifte van het Staatsblad waarin
      deze wet wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel3
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '3'
        paragraaf: '2'
  - number: '15'
    text: 'Deze wet wordt aangehaald als: Wet donorgegevens kunstmatige bevruchting.'
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel15
