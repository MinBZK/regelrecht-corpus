  - number: 1c
    text: |-
      Het College kent aan een donor van wie niet eerder de gegevens, bedoeld in
      [artikel 1b, eerste lid, onderdeel a][ref1], zijn verstrekt, eenmalig een donorcode toe en koppelt daaraan het
      wettelijk maximumaantal moedercodes of het door de donor bepaalde lagere maximumaantal moedercodes, bedoeld in
      artikel 1b, eerste lid, onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel1b
