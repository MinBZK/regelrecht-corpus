  - number: '4'
    text: |-
      1 Er is een College donorgegevens kunstmatige bevruchting.

      2 Het College heeft tot taak:

      a. de gegevens, bedoeld in [paragraaf 1a][ref1] en de [artikelen 2, eerste en tweede lid][ref2], en
      [3c, eerste lid][ref3], te bewaren, te beheren en te verstrekken overeenkomstig de bepalingen bij of krachtens de
      wet gesteld. Het College stelt ter uitvoering van deze taak bij reglement regels;

      b. bij reglement te bepalen op welke wijze en op welk moment de gegevens bedoeld in de
      [artikel 2, eerste en tweede lid][ref4], aan het College worden verstrekt en op welke wijze deze gegevens door het
      College aan een persoon als bedoeld in de [artikelen 3][ref5] en [3c][ref6] worden verstrekt;

      c. bij reglement te bepalen op welke wijze de gegevens, bedoeld in [artikel 3b][ref7], aan een persoon als bedoeld
      in dat artikel worden verstrekt;

      d. voorlichting te verschaffen, voor zover de onder a, b en c omschreven taken van het College dat vereisen,
      alsmede zorg te dragen voor de begeleiding bij de verstrekking van deze gegevens;

      e. andere bij regeling van Onze Minister opgedragen taken die verband houden met het door deze wet bestreken
      terrein.

      3 Degenen op wie de verplichtingen, bedoeld in [paragraaf 1a][ref8] of [artikel 2][ref9], rusten, zijn verplicht
      het reglement van het College na te leven.

      4 De Kaderwet is van toepassing op het College. [Artikel 22 van de Kaderwet][ref10] is niet van toepassing op
      besluiten van het College inzake bewaring, beheer of verstrekking van de gegevens, bedoeld in [paragraaf 1a][ref11]
      of de [artikelen 2][ref12] en [3c, eerste lid.][ref13]


