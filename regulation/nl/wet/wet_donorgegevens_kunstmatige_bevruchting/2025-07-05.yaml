  - number: '3'
    text: |-
      1 Het College verstrekt de bij hem berustende gegevens van de betrokken donor:

      a. aan degene die is verwekt door en ten gevolge van kunstmatige donorbevruchting en die de leeftijd
      van twaalf jaren heeft bereikt, op zijn verzoek, voor zover het betreft de gegevens, bedoeld in
      [artikel 2, eerste lid, onder b][ref1];

      b. aan de ouders of een van hen van het kind dat door en tengevolge van kunstmatige donorbevruchting is verwekt,
      op hun verzoek, indien het kind de leeftijd van twaalf jaren nog niet heeft bereikt en voor zover het betreft de
      gegevens, bedoeld in [artikel 2, eerste lid, onder b][ref2].

      2 De persoonsidentificerende gegevens van de donor worden aan degene die is verwekt door en ten gevolge van
      kunstmatige donorbevruchting en die de leeftijd van zestien jaren heeft bereikt, op zijn verzoek verstrekt, nadat
      de donor daarmee schriftelijk heeft ingestemd.

      Verstrekking blijft, indien de donor daarmee niet instemt, uitsluitend achterwege indien, in aanmerking genomen de
      gevolgen die niet-verstrekking voor de verzoeker zou kunnen hebben, zwaarwegende belangen van de donor meebrengen
      dat verstrekking niet behoort plaats te vinden. De naar aanleiding van deze belangenafweging te nemen beslissing
      wordt door het College genomen na daarover advies te hebben ingewonnen van een adviescommissie, tenzij naar het
      oordeel van het College de noodzaak daartoe ontbreekt.

      3 Indien de donor is overleden dan wel onvindbaar is, wordt de instemming, bedoeld in het tweede lid, geacht te
      zijn geweigerd, tenzij de echtgenoot, geregistreerde partner of andere levensgezel dan wel, bij het ontbreken
      van een van hen, een bloedverwant in de eerste of tweede graad, schriftelijk instemt met de verstrekking van de
      persoonsidentificerende gegevens. Na een weigering in te stemmen worden de in de eerste volzin bedoelde personen in
      de gelegenheid gesteld de belangen van de donor bij niet-verstrekking naar voren te brengen.

      4 Het bestuur van het College stelt de donor onverwijld schriftelijk in kennis van een voorgenomen verstrekking van
      zijn persoonsgegevens, alsmede van de gronden waarop dit voornemen berust. Tegen de voorgenomen verstrekking kan
      de donor bezwaar maken bij het College. Verstrekking geschiedt, indien deze niet berust op instemming van de donor,
      niet dan nadat de beslissing op het bezwaar onherroepelijk is geworden. Indien verstrekking van de persoonsgegevens
      achterwege blijft op de grond, bedoeld in het slot van het tweede lid, kan de aanvrager tegen het daartoe
      strekkende besluit bezwaar maken bij het College.

      5 [Artikel 6:5, eerste lid, aanhef en onderdeel a, van de Algemene wet bestuursrecht][ref3] is niet van toepassing
      ten aanzien van de donor.

      6 Van een verstrekking van gegevens van de donor aan een minderjarige die de leeftijd van zestien jaren nog niet
      heeft bereikt, worden de ouders op de hoogte gesteld. Aan de minderjarige wordt hiervan mededeling gedaan. Op
      verzoek van beide ouders of van een van hen worden deze gegevens eveneens aan hen verstrekt.

      7 Het College draagt zorg voor deskundige begeleiding bij de verstrekking van de gegevens, bedoeld in het eerste en
      tweede lid.

      8 Bij algemene maatregel van bestuur wordt bepaald welke bescheiden een verzoek tot verstrekking van gegevens van
      de donor moeten vergezellen.

      9 Het College stelt bij reglement in ieder geval regels vast omtrent de samenstelling van de adviescommissie, die
      tot taak heeft te adviseren over de beoordeling van door de donor aangevoerde zwaarwegende belangen als bedoeld in
      het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013642#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel65
