      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      Inspectie gezondheidszorg en jeugd.

      2 De aan de in het eerste lid bedoelde ambtenaren toekomende bevoegdheden, bedoeld in de [artikelen 5:16][ref1]
      en [5:17 van de Algemene wet bestuursrecht][ref2], hebben mede betrekking op de gegevens, bedoeld in de
      [artikelen 1a][ref3], [2, eerste of tweede lid][ref4], of [12a, derde lid][ref5].

      3 Voor zover de verrichter dan wel het College uit hoofde van ambt, beroep of wettelijk voorschrift
      tot geheimhouding van de gegevens verplicht is, kan diegene deze verplichting, in afwijking van
      [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref6], niet inroepen tegenover de in het eerste
      lid bedoelde ambtenaren. Op deze ambtenaren rust dezelfde geheimhoudingsplicht als op de verrichter dan wel op
      het College.


