  - number: 3a
    text: |-
      Op verzoek van de ouder van het kind dat door kunstmatige donorbevruchting is verwekt, verstrekt
      het College een verklaring als bedoeld in [artikelen 198, eerste lid, onder b][ref1], of
      [227, vierde lid, van Boek 1 van het Burgerlijk Wetboek][ref2], waarin de persoonsidentificerende gegevens van de
      donor niet worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel198
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel227
