  - number: 1a
    text: |-
      1 Kunstmatige donorbevruchting is uitsluitend toegestaan indien de verrichter beschikt over:

      a. de donorcode van de donor van wiens zaadcellen of eicellen de verrichter gebruik wenst te maken, en

      b. een reservering voor een aan die donorcode gekoppelde moedercode of een aan die donorcode gekoppelde moedercode
      die reeds aan de te behandelen vrouw is toegekend.

      2 Indien ten tijde van de behandeling de te behandelen vrouw de echtgenote of geregistreerde partner is
      van de vrouw aan wie de in het eerste lid, onderdeel b, bedoelde moedercode reeds is toegekend, of een
      samenlevingscontract met die vrouw heeft gesloten, is in afwijking van het eerste lid, onderdeel b, kunstmatige
      donorbevruchting toegestaan met gebruikmaking van de reeds toegekende moedercode.
    url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#Artikel1a
  - number: 1b
    text: |-
      1 Ten behoeve van het verkrijgen van de donorcode, bedoeld in [artikel 1a, onderdeel a][ref1], verstrekt de
      verrichter aan het College:

      a. de geslachtsnaam, voornamen, geboortedatum en woonplaats van de donor en het type donatie,

      b. het burgerservicenummer van de donor, tenzij aan de donor geen burgerservicenummer is toegekend krachtens de
      [Wet algemene bepalingen burgerservicenummer][ref2], en

      c. het door de donor bepaalde maximumaantal aan de donorcode te koppelen moedercodes, indien dat aantal lager is
      dan het wettelijk maximumaantal moedercodes.

      2. Gelijktijdig met de verstrekking, bedoeld in het eerste lid, verstrekt de verrichter aan het College:

      a. het aantal aan de donorcode gekoppelde moedercodes dat de verrichter wenst te reserveren, indien dat aantal
      lager is dan het wettelijk maximumaantal moedercodes dan wel het door de donor bepaalde lagere maximumaantal, of

      b. ten behoeve van het verkrijgen van een aan de donorcode gekoppelde moedercode die reeds aan een vrouw is
      toegekend, de geslachtsnaam, voornamen, geboortedatum en burgerservicenummer van die vrouw, tenzij aan de vrouw
      geen burgerservicenummer is toegekend krachtens de [Wet algemene bepalingen burgerservicenummer][ref3].

      3. De verrichter stelt de donor op de hoogte van de gegevensverstrekking, bedoeld in het eerste lid.


