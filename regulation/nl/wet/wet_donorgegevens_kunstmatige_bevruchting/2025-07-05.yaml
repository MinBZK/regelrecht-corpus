preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gewenst is regels te stellen voor de bewaring, het beheer en de
    verstrekking van gegevens van donoren bij kunstmatige donorbevruchting;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013642/2025-07-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. College: College donorgegevens kunstmatige bevruchting als bedoeld in [artikel 4, eerste lid][ref1];

      c. kunstmatige donorbevruchting: het beroeps-of bedrijfsmatig verrichten van handelingen, gericht op het anders dan
      op natuurlijke wijze tot stand komen van een zwangerschap met gebruikmaking van:

      1. zaadcellen van een ander dan de echtgenoot, geregistreerde partner of andere levensgezel van de vrouw of

      2. eicellen van een andere vrouw;

      d. donor: degene die zaadcellen of eicellen heeft afgestaan ten behoeve van kunstmatige donorbevruchting;

      e. de Kaderwet: de [Kaderwet zelfstandige bestuursorganen][ref2];

      f. verrichter: instelling of een natuurlijke persoon die, anders dan in dienst of onmiddellijk of middellijk in
      opdracht van een instelling, kunstmatige donorbevruchting verricht;

      g. instelling: rechtspersoon die kunstmatige donorbevruchting verricht of doet verrichten, een organisatorisch
      verband van natuurlijke personen die kunstmatige donorbevruchting verricht of doet verrichten, dan wel een
      natuurlijk persoon die kunstmatige donorbevruchting doet verrichten;

      h. donorcode: het als zodanig overeenkomstig deze wet aan een donor toegekend nummer;

      i. moedercode: het als zodanig overeenkomstig deze wet aan een donorcode gekoppeld nummer;

      j. wettelijk maximumaantal moedercodes: het bij algemene maatregel van bestuur bepaalde maximumaantal moedercodes
      dat aan een donorcode wordt gekoppeld.


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel4
