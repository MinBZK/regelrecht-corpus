  - number: 13a
    text: |-
      Het College verstrekt aan de huisarts van degene die is verwekt door en ten gevolge
      van kunstmatige donorbevruchting, op zijn verzoek, de medische gegevens, bedoeld in
      [artikel 2, eerste lid, onderdeel a][ref1], zoals deze luidde voorafgaand aan de inwerkingtreding van de
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      __________________________________________________________________________________ (Stb. 2023, 294, met
      uitzondering van gegevens over de bloedgroep, rhesusfactor of bloedgroeptypering van de donor.


