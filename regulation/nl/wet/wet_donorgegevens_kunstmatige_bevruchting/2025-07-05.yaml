  - number: 1e
    text: |-
      1 Indien een verrichter, anders dan met toepassing van [artikel 1b][ref1], een reservering voor een aan een
      donorcode gekoppelde moedercode wenst te verkrijgen, verstrekt de verrichter aan het College:

      a. de donorcode van de donor van wiens zaadcellen of eicellen de verrichter gebruik wenst te maken, en

      b. het aantal aan die donorcode gekoppelde moedercodes dat de verrichter wenst te reserveren.

      2 Naar aanleiding van de verstrekking, bedoeld in het eerste lid, reserveert het College ten behoeve van de
      verrichter het aantal door de verrichter verzochte moedercodes, tenzij er geen aan de donorcode gekoppelde
      moedercode meer beschikbaar is. In dat geval volstaat het College met mededeling daarvan aan de verrichter.


