valid_from: '2008-05-01'
bwb_id: BWBR0003276
url: https://wetten.overheid.nl/BWBR0003276/2008-05-01
preamble:
  text: >-
    Gelet op de artikelen 2 en 5 van het Verpakkingen- en gebruiksartikelenbesluit (Warenwet) (Stb. 1979, 558),


    De Adviescommissie Warenwet gehoord,


    Besluiten:
  url: https://wetten.overheid.nl/BWBR0003276/2008-05-01#ArtikelAanhef
articles:
  - number: '2'
    text: |-
      Als materialen, als bedoeld in
      [artikel 3, eerste lid, onder a, van het Warenwetbesluit verpakkingen en gebruiksartikelen][ref1] worden
      aangewezen:

      a. kunststoffen,

      b. papier en karton,

      c. rubberprodukten,

      d. metalen,

      e. glas en glaskeramiek,

      f. keramische materialen en emails,

      g. textielprodukten,

      h. geregenereerde cellulose,

      i. hout en kurk;

      j. deklagen


      [ref1]: https://wetten.overheid.nl/BWBR0018370#Artikel3
    url: https://wetten.overheid.nl/BWBR0003276/2008-05-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018370
        artikel: '3'
  - number: '3'
    text: |-
      Een materiaal, genoemd in [artikel 2][ref1], moet zijn vervaardigd uit de voor dat materiaal in de bijlage van dit
      besluit aangegeven stoffen, welke voldoen aan de daarin voor die stoffen gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0003276#Artikel2
    url: https://wetten.overheid.nl/BWBR0003276/2008-05-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003276
        artikel: '2'
  - number: '4'
    text: >-
      Bij de vervaardiging van verpakkingen en gebruiksartikelen mogen grond- en hulpstoffen voor zover ter zake van de
      aanwending daar van in de bijlage van dit besluit regels zijn gesteld, niet op een andere wijze dan in die bijlage
      is aangegeven worden aangewend.
    url: https://wetten.overheid.nl/BWBR0003276/2008-05-01#Artikel4
  - number: 4a
    text: >-
      Aanvragen tot toelating van nieuwe stoffen in verpakkingen en gebruiksartikelen voor eet- en drinkwaren moeten
      worden ingediend volgens de in de bijlage opgenomen algemene richtlijnen voor het indienen van een verzoek tot
      toelating van nieuwe stoffen in verpakkingen en gebruiksartikelen voor eet- en drinkwaren.
    url: https://wetten.overheid.nl/BWBR0003276/2008-05-01#Artikel4a
  - number: '5'
    text: |-
      Verpakkingen- en gebruiksartikelen, vervaardigd uit materiaal als bedoeld in [artikel 2][ref1], mogen aan eet- en
      drinkwaren geen grotere hoeveelheden stoffen afgeven dan voor die stoffen is aangegeven in de bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0003276#Artikel2
    url: https://wetten.overheid.nl/BWBR0003276/2008-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003276
        artikel: '2'
  - number: '6'
    text: |-
      Ten aanzien van verpakkingen en gebruiksartikelen, bestaande uit materiaal als bedoeld in [artikel 2][ref1], gelden
      de onderzoekingsmethoden, omschreven in de bijlage van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003276#Artikel2
    url: https://wetten.overheid.nl/BWBR0003276/2008-05-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003276
        artikel: '2'
  - number: '7'
    text: 'Deze regeling kan worden aangehaald als: Regeling Verpakkingen- en gebruiksartikelen (Warenwet).'
    url: https://wetten.overheid.nl/BWBR0003276/2008-05-01#Artikel7
  - number: '8'
    text: |-
      1 Deze regeling wordt in de Nederlandse Staatscourant geplaatst.

      2 Zij treedt in werking op het tijdstip, waarop het [Verpakkingen- en gebruiksartikelenbesluit (Warenwet)][ref1] in
      werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003267
    url: https://wetten.overheid.nl/BWBR0003276/2008-05-01#Artikel8
    references:
