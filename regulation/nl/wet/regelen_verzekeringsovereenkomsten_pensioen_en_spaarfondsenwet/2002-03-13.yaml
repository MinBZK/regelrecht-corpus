  - number: 13a
    text: |-
      Onverminderd het bepaalde in [artikel 13][ref1] verstrekt de verzekeraar op verzoek van een verzekerde binnen
      drie maanden schriftelijk een opgave van de hoogte van de opgebouwde aanspraken. De verzekeraar kan een vergoeding
      vragen van de aan de opgave verbonden kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0004195#Artikel13
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0004195
        artikel: '13'
        hoofdstuk: II
  - number: '14'
    text: |-
      1 Een verzekeraar is verplicht op verzoek van een verzekerde bij diens aanstelling in vaste dienst van een van de
      Europese Gemeenschappen een premievrije aanspraak op ouderdomspensioen als bedoeld in [artikel 9][ref1] af te kopen
      en de afkoopsom over te dragen aan de betrokken Gemeenschap. In afwijking van [artikel 5][ref2] zijn ten aanzien
      van de berekening van de afkoopsom de regels, gesteld op grond van [artikel 32b, derde lid, van de wet][ref3],
      van toepassing.

      2 Een verzekeraar is bevoegd op verzoek van de verzekerde en diens echtgenoot of partner een premievrije aanspraak
      op weduwen-, weduwnaars- of partnerpensioen in de in het eerste lid bedoelde afkoop en overdracht te betrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0004195#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004195#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel32b
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel14
