  - number: 9a
    text: |-
      De aanspraak, bedoeld in [artikel 9, tweede lid][ref1], dient voor de verzekerde in elk geval steeds aan het einde
      van ieder kalenderjaar dan wel, indien dat eerder is, bij beëindiging van het verbonden zijn aan de onderneming,
      volledig te zijn gefinancierd. De Pensioen- & Verzekeringskamer kan op grond van bijzondere omstandigheden een
      langere termijn, van ten hoogste dertien weken, toestaan voor financiering als bedoeld in dit lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004195#Artikel9
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0004195
        artikel: '9'
        hoofdstuk: II
  - number: '10'
    text: |-
      1 Indien het huwelijk van een verzekerde eindigt door echtscheiding of ontbinding na scheiding van tafel en bed,
      verkrijgt zijn gewezen echtgenoot een zodanige premievrije aanspraak op weduwen- of weduwnaarspensioen, als de
      verzekerde ten behoeve van die gewezen echtgenoot zou hebben verkregen, indien de verzekerde op het tijdstip van de
      echtscheiding of van de ontbinding van het huwelijk zou zijn opgehouden aan de onderneming verbonden te zijn anders
      dan door overlijden of het bereiken van de pensioengerechtigde leeftijd.

      2 Indien het huwelijk van een verzekerde, die opgehouden is aan de onderneming verbonden te zijn, eindigt
      door echtscheiding of ontbinding na scheiding van tafel en bed, verkrijgt zijn gewezen echtgenoot een zodanige
      premievrije aanspraak op weduwen- of weduwnaarspensioen, als de verzekerde ten behoeve van die gewezen echtgenoot
      heeft verkregen bij het ophouden aan de onderneming verbonden te zijn.

      3 Het eerste en tweede lid zijn niet van toepassing indien de man en de vrouw bij huwelijkse voorwaarden of bij
      een bij geschrift gesloten overeenkomst met het oog op de scheiding anders overeenkomen. De overeenkomst is slechts
      geldig indien aan de overeenkomst een verklaring van de verzekeraar is gehecht, dat hij bereid is een uit de
      afwijking voortvloeiend pensioenrisico te dekken.
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel10
  - number: '11'
    text: |-
      1 De aanspraak op ouderdomspensioen van een verzekerde kan, tenzij [artikel 18][ref1] wordt toegepast,
      zonder toestemming van diens echtgenoot niet bij overeenkomst tussen die verzekerde en de verzekeraar of de
      verzekeringnemer worden verminderd anders dan bij afkoop zoals voorzien bij of krachtens de wet, tenzij de
      echtgenoten het recht op pensioen-verevening ingevolge de [Wet verevening pensioenrechten bij scheiding][ref2]
      hebben uitgesloten.

      2 De aanspraak op weduwen- of weduwnaarspensioen ten behoeve van de echtgenoot van een verzekerde kan, tenzij
      [artikel 18][ref3] wordt toegepast, zonder toestemming van die echtgenoot, niet bij overeenkomst tussen de
      verzekerde en de verzekeraar of de verzekeringnemer worden verminderd anders dan bij afkoop zoals voorzien bij of
      krachtens de [wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004195#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006641
      [ref3]: https://wetten.overheid.nl/BWBR0004195#Artikel18
