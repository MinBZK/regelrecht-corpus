  - number: '4'
    text: |-
      1 De verzekeringnemer verstrekt de verzekeraar de financiële middelen alsmede de inlichtingen, die deze nodig heeft
      om de verplichtingen te kunnen nakomen die ingevolge deze regeling op hem rusten.

      2 De verzekeraar is niet aansprakelijk voor een verzuim van de verzekeringnemer wat betreft de verplichtingen die
      op de laatste rusten ingevolge het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel4
  - number: '5'
    text: |-
      De actuariële methoden, volgens welk de berekening van premievrije waarden en afkoopwaarden geschiedt, dienen aan
      de Pensioen- & Verzekeringskamer te worden medegedeeld. Die methoden mogen worden toegepast zolang de Pensioen- &
      Verzekeringskamer daartegen geen bezwaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel5
  - number: '6'
    text: |-
      Ingeval voorzieningen als bedoeld in [artikel 2, vierde lid, onder B, van de wet][ref1] getroffen zijn of worden
      gelden naast het gestelde in [hoofdstuk I][ref2] de bepalingen opgenomen in dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004195#HoofdstukI
