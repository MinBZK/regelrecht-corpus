        artikel: 32b
  - number: '15'
    text: |-
      In de verzekeringsovereenkomsten kunnen bedingen opgenomen worden ingevolge welke de pensioenaanspraken worden
      afgekocht onder terhandstelling van de afkoopsom aan de verzekeringnemer, indien de verzekerde binnen een jaar
      na de datum van ingang van de verzekering van ouderdomspensioen anders dan door overlijden of het bereiken van
      de pensioengerechtigde leeftijd ophoudt aan de onderneming verbonden te zijn tenzij hij pensioenaanspraken heeft
      ingebracht. De verzekerde heeft alsdan echter jegens de verzekeringnemer recht op een uitkering gelijk aan de door
      hem betaalde bijdragen voor zijn ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel15
  - number: '16'
    text: |-
      Onverminderd de [artikelen 16a][ref1] en [16b][ref2] kunnen in een verzekeringsovereenkomst bedingen worden
      opgenomen op grond waarvan pensioen of aanspraken op pensioen worden afgekocht, indien de rechthebbende daarmee
      instemt en indien:

      a. de afkoop ertoe strekt het de rechthebbende mogelijk te maken om onder aanwending van de afkoopsom pensioen of
      aanspraken op pensioen te verwerven overeenkomstig een toezegging omtrent pensioen van een andere inhoud van een
      andere werkgever dan de werkgever die het af te kopen pensioen heeft toegezegd, bij de instelling waar die andere
      werkgever de toezegging omtrent pensioen heeft ondergebracht.

      b. de in onderdeel a bedoelde afkoopsom rechtstreeks wordt overgedragen aan de instelling jegens welke de in
      onderdeel a bedoelde aanspraken op pensioen worden verworven.

      c. het pensioen of de aanspraak op pensioen wordt verworven jegens een instelling als bedoeld in
      [artikel 32a, onderdeel c, van de wet][ref3];

      d. met de pensioenbelangen van de echtgenoot of gewezen echtgenoot is op redelijke wijze rekening gehouden;

      e. het pensioen of de aanspraak op pensioen wordt door de instelling jegens welke de recht-hebbende het pensioen
      of de aanspraak op pensioen verwerft aldus vastgesteld, dat de actuariële waarde ervan tenminste gelijk is aan
      de op dezelfde grondslagen berekende actuariële waarde van het af te kopen pensioen of de af te kopen aanspraak
      op pensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0004195#Artikel16a
      [ref2]: https://wetten.overheid.nl/BWBR0004195#Artikel16b
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel32a
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel16
    references:
      - id: ref1
