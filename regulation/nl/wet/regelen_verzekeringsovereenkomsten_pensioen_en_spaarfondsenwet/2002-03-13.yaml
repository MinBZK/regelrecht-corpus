  - number: '8'
    text: |-
      Indien het verzekeringnemerschap overeenkomstig [artikel 7, tweede lid][ref1], aan de verzekerde is overgedragen,
      kan hij de met de pensioentoezegging corresponderende rechten welke uit de verzekeringsovereenkomst voortvloeien,
      in afwijking van [artikel 7, eerste lid][ref2], overdragen of in pand geven en in het algemeen enige handeling
      verrichten waardoor ter zake van die rechten aan een ander dan de begunstigde(n) enige aanspraak zou worden
      verleend, een en ander voor zover beslag op pensioen of een aanspraak op pensioen krachtens enig wettelijk
      voorschrift geoorloofd is.


      [ref1]: https://wetten.overheid.nl/BWBR0004195#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004195#Artikel7
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel8
