  - number: '9'
    text: |-
      1 De verzekerde ontvangt, wanneer hij ophoudt aan de onderneming verbonden te zijn anders dan door overlijden
      of het bereiken van de pensioengerechtigde leeftijd, tenzij [artikel 15][ref1] van toepassing is, een voor
      hem premievrije aanspraak op ouderdomspensioen en weduwen- of weduwnaarspensioen dan wel partnerpensioen met
      inachtneming van de volgende leden.

      2 De verzekerde verkrijgt, wanneer het verbonden zijn aan de onderneming eindigt, ten minste een premievrije
      aanspraak op een evenredig ouderdomspensioen. Daaronder wordt verstaan het verschil tussen het ouderdomspensioen
      dat de verzekerde zou hebben gekregen als hij aan de onderneming verbonden zou zijn geweest tot de
      pensioengerechtigde leeftijd en het ouderdomspensioen dat hij zou hebben gekregen als hij verzekerd zou zijn
      geweest vanaf het tijdstip waarop het verbonden zijn aan de onderneming eindigde tot de pensioengerechtigde
      leeftijd. Bij de berekening bedoeld in de vorige volzin wordt, voor wat betreft de gegevens die voor de
      vaststelling van de pensioenaanspraken van belang zijn, uitgegaan van die gegevens, zoals deze gelden op het
      tijdstip waarop het verbonden zijn aan de onderneming is geëindigd.

      3 Indien een weduwen- of weduwnaarspensioen respectievelijk een partnerpensioen is toegezegd, verkrijgt de
      verzekerde, wanneer het verbonden zijn aan de onderneming eindigt, ten behoeve van zijn echtgenoot respectievelijk
      zijn partner een door de verzekeraar naar redelijkheid vast te stellen premievrije aanspraak op weduwen- of
      weduwnaarspensioen respectievelijk partnerpensioen.

      4 Indien een instelling of persoon op ingegane ouderdomspensioenen van personen die tot de ingang van hun
      pensioen aan de regeling van de verzekeringnemer hebben deelgenomen toeslagen, hoe ook genaamd, verleent, heeft
      de verzekerde, die sedert het eindigen van het verbonden zijn aan de onderneming een premievrije aanspraak op
      ouderdomspensioen op grond van dezelfde regeling heeft, er jegens die instelling of persoon recht op dat hem
      op zijn ingegaan ouderdomspensioen overeenkomstige toeslagen worden verleend met inachtneming van dezelfde
      uitgangspunten. Op de overeenkomstige toeslagen kunnen in mindering worden gebracht toeslagen op zijn ingegaan
      ouderdomspensioen welke de verzekerde over hetzelfde tijdvak uit andere hoofde ontvangt. Een overeenkomstig recht
      op gelijke behandeling heeft zijn weduwe of weduwnaar voor wat betreft toeslagen op weduwen- of weduwnaarspensioen.
      De partner van de in de eerste volzin bedoelde verzekerde heeft na diens overlijden eveneens een overeenkomstig
      recht op gelijke behandeling voor wat betreft toeslagen op partnerpensioen.

      5 Indien een instelling of persoon op ingegane ouderdomspensioenen van personen die tot de ingang van hun
      pensioen aan de regeling van de verzekeringnemer hebben deelgenomen toeslagen, hoe ook genaamd, verleent, heeft
      de verzekerde, die sedert het eindigen van het verbonden zijn aan de onderneming een premievrije aanspraak op
      ouderdomspensioen op grond van dezelfde regeling heeft, er jegens die instelling of persoon recht op dat hem
      op zijn premievrije aanspraak op ouderdomspensioen overeenkomstige toeslagen worden verleend met inachtneming
      van dezelfde uitgangspunten. Op de overeenkomstige toeslagen kunnen in mindering worden gebracht toeslagen op
      zijn premievrije aanspraak op ouderdomspensioen welke de verzekerde over hetzelfde tijdvak uit andere hoofde
      ontvangt. Een overeenkomstig recht op gelijke behandeling heeft de verzekerde voor wat betreft toeslagen op
      zijn premievrije aanspraak op weduwen- of weduwnaarspensioen. De in de eerste volzin bedoelde verzekerde heeft
      eveneens een overeenkomstig recht op gelijke behandeling voor wat betreft toeslagen op zijn premievrije aanspraak
      op partnerpensioen.

      6 Het vierde en vijfde lid zijn niet van toepassing ingeval bij het eindigen van het verbonden zijn aan
      de onderneming aan de verzekerde het verzekeringnemerschap is overgedragen en bij die overdracht met zijn
      uitdrukkelijke instemming enigerlei vorm van rente- of winstdeling ter aanpassing van de premievrije aanspraak
      is bedongen.

      7 Met verzekerde als bedoeld in het vijfde lid, laatste volzin, wordt gelijkgesteld de gewezen echtgenoot als
      bedoeld in [artikel 10, eerste en tweede lid][ref2], en in [artikel 22, eerste lid][ref3], indien de verzekerde
      na het eindigen van het verbonden zijn aan de onderneming recht heeft op gelijke behandeling als bedoeld in die
      volzin en voor zover de gewezen echtgenoot bij de echtscheiding of de ontbinding van het huwelijk na scheiding
      van tafel en bed een premievrije aanspraak op weduwen- of weduwnaarspensioen heeft verkregen en behouden jegens
      een verzekeraar.

      8 Voor de toepassing van het vierde en vijfde lid wordt, indien een verzekeraar toeslagen verleent in opdracht van
      een ander, die ander beschouwd als de instelling die de toeslagen verleent.

      9 Indien de werkgever een toezegging omtrent pensioen heeft gedaan, die kan worden beschouwd als alleen te worden
      bepaald door de door hem of door de verzekerde beschikbaar gestelde premies of bijdragen, is het tweede lid niet
      van toepassing en geldt dat de verzekerde, wanneer het verbonden zijn aan de onderneming eindigt, ten minste een
      premievrije aanspraak op ouderdomspensioen verkrijgt op de voet van de tot dan door hem en voor hem betaalde en
      uit hoofde van [artikel 2, zesde lid, van de wet][ref4] nog verschuldigde bijdragen naarmate de voor pensioeningang
      vereiste duur van de verzekering is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0004195#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004195#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0004195#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0002089#Artikel2
