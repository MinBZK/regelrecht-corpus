  - number: 24a
    text: |-
      Onverminderd [artikel 24][ref1] verstrekt de verzekeraar op verzoek van een verzekerde binnen drie maanden
      schriftelijk een opgave van de hoogte van de opgebouwde aanspraken. De verzekeraar kan een vergoeding vragen van de
      aan de opgave verbonden kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0004195#Artikel24
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel24a
    references:
