        artikel: 32b
  - number: 16b
    text: |-
      1 Onverminderd de [artikelen 16][ref1] en [16a][ref2] kunnen in de verzekeringsovereenkomsten bedingen opgenomen
      worden op grond waarvan pensioen of aanspraken op pensioen afgekocht worden, indien:

      a. de rechthebbende daarmee instemt;

      b. die afkoop ertoe strekt het de rechthebbende mogelijk te maken om onder aanwending van de afkoopsom pensioen of
      aanspraken op pensioen overeenkomstig een toezegging omtrent pensioen van de werkgever die het af te kopen pensioen
      heeft toegezegd of op grond van een toezegging omtrent pensioen met dezelfde inhoud van een andere werkgever die
      de onderneming of een deel van de onderneming van de werkgever die het af te kopen pensioen heeft toegezegd, heeft
      overgenomen, te verwerven bij de instelling waar de werkgever de toezegging omtrent pensioen heeft ondergebracht;

      c. met de pensioenbelangen van de echtgenoot of gewezen echtgenoot op redelijke wijze rekening is gehouden;

      d. de afkoopsom of zodanig wordt vastgesteld dat het te verwerven pensioen voor mannen en vrouwen gelijk is of,
      indien het pensioen wordt berekend of mede wordt berekend op grond van een geldelijke bijdrage, zodanig wordt
      vastgesteld dat de omvang van het te verwerven pensioen naar het inzicht op het tijdstip van vaststelling van die
      afkoopsom gelijk is;

      e. onverminderd de [artikelen 2b][ref3] en [2c van de wet][ref4], het in te kopen pensioen collectief actuarieel
      gelijkwaardig is aan het af te kopen pensioen;

      f. het pensioen of de aanspraken op pensioen worden verworven jegens een instelling als bedoeld in
      [artikel 32ba, onderdeel f, van de wet][ref5].

      2 Indien de rechthebbende aan de onderneming verbonden is geweest of verbonden zou zijn geweest indien het
      verbonden zijn niet was geëindigd, en deze onderneming is opgehouden te bestaan, kan ingeval van liquidatie van
      de verzekeraar afkoop overeenkomstig het eerste lid plaatsvinden. Ingeval de afkoopsom wordt overgedragen aan een
      pensioenfonds zijn de wet en de daarop berustende bepalingen van overeenkomstige toepassing. Indien de afkoopsom
      wordt overgedragen aan een verzekeraar zijn [artikel 2, vierde lid, van de wet][ref6] en de daarop berustende
      bepalingen van overeenkomstige toepassing op dat pensioen.

      3 In de verzekeringsovereenkomsten kunnen in afwijking van het eerste lid, onderdeel b, bedingen worden
      opgenomen op grond waarvan aanspraken op pensioen mogen worden afgekocht, indien die afkoop ertoe strekt het
      de rechthebbende mogelijk te maken om op de datum waarop het pensioen ingaat onder aanwending van de afkoopsom
      bij een andere instelling pensioen te verwerven, mits de afkoopsom rechtstreeks wordt overgedragen aan die
      instelling en wordt voldaan aan het eerste lid, onderdeel a, c, d, e en f. Ingeval deze andere instelling
      een pensioenfonds is, zijn de wet en de daarop berustende bepalingen van overeenkomstige toepassing op dat
      pensioen. Indien deze andere instelling een verzekeraar is als bedoeld in het eerste lid, onderdeel f, zijn
      [artikel 2, vierde lid, van de wet][ref7] en de daarop berustende bepalingen, van overeenkomstige toepassing op
      pensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0004195#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004195#Artikel16a
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel2b
      [ref4]: https://wetten.overheid.nl/BWBR0002089#Artikel2c
      [ref5]: https://wetten.overheid.nl/BWBR0002089#Artikel32ba
      [ref6]: https://wetten.overheid.nl/BWBR0002089#Artikel2
      [ref7]: https://wetten.overheid.nl/BWBR0002089#Artikel2
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel16b
