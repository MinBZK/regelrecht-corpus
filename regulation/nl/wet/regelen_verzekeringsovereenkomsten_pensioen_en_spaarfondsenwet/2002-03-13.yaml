  - number: '21'
    text: |-
      De verzekeringnemer kan de met de pensioentoezegging corresponderende rechten die uit de verzekeringsovereenkomst
      voortvloeien overdragen of in pand geven en in het algemeen enige handeling verrichten waardoor ter zake van die
      rechten aan een ander dan de begunstigde(n) enige aanspraak zou worden verleend, voor zover beslag op pensioen of
      een aanspraak op pensioen krachtens enig wettelijk voorschrift geoorloofd is.
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel21
  - number: '22'
    text: |-
      1 Indien het huwelijk van een verzekerde eindigt door echtscheiding of ontbinding na scheiding van tafel en bed
      verkrijgt zijn gewezen echtgenoot een zodanige premievrije aanspraak op weduwen- of weduwnaarspensioen als uit de
      verzekeringsovereenkomst zou voortvloeien, indien op het tijdstip van de echtscheiding of van de ontbinding van het
      huwelijk de overeenkomst beëindigd zou zijn, dan wel uit de verzekeringsovereenkomst is voortgevloeid, indien de
      werkgever op een eerder tijdstip is opgehouden de verzekeringnemer in staat te stellen de premie of een deel van de
      premie te betalen.

      2 Het eerste lid is niet van toepassing indien de man en de vrouw bij huwelijkse voorwaarden of bij een bij
      geschrift gesloten overeenkomst met het oog op de scheiding anders overeenkomen. De overeenkomst is slechts geldig
      indien aan de overeenkomst een verklaring van de verzekeraar is gehecht, dat hij bereid is een uit de afwijking
      voortvloeiend pensioenrisico te dekken.
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel22
  - number: '23'
    text: |-
      1 De aanspraak op ouderdomspensioen van een verzekerde kan, tenzij [artikel 18][ref1] wordt toegepast, zonder
      toestemming van diens echtgenoot niet bij overeenkomst tussen die verzekerde en de verzekeraar worden verminderd
      anders dan bij afkoop zoals voorzien bij of krachtens de wet, tenzij de echtgenoten het recht op pensioenverevening
      ingevolge de [Wet verevening pensioenrechten bij scheiding][ref2] hebben uitgesloten.

      2 De aanspraak op weduwen- of weduwnaarspensioen ten behoeve van de echtgenoot van een verzekerde kan, tenzij
      [artikel 18][ref3] wordt toegepast, zonder toestemming van die echtgenoot niet bij overeenkomst tussen de
      verzekerde en de verzekeraar worden verminderd anders dan bij afkoop zoals voorzien bij of krachtens de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004195#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006641
      [ref3]: https://wetten.overheid.nl/BWBR0004195#Artikel18
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004195
        artikel: '18'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006641
      - id: ref3
        bwb_id: BWBR0004195
        artikel: '18'
        hoofdstuk: II
  - number: '24'
    text: |-
      1 De verzekeraar verstrekt een bewijsstuk ter zake van de bestaande aanspraken aan:

      a. degenen, die rechthebbenden zijn op weduwen-, weduwnaars-, partner- of wezenpensioen, na het overlijden van
      de verzekerde;

      b. de gewezen echtgenoot als in [artikel 22, eerste lid][ref1], bedoeld.

      2 De verzekeraar verstrekt de verzekerde jaarlijks een opgave van de aan het desbetreffende of
      voorafgaande kalenderjaar toe te rekenen waardeaangroei van pensioenaanspraken overeenkomstig
      [artikel 3.127 van de Wet inkomstenbelasting 2001][ref2] en de daarop berustende bepalingen. Het eerste jaar
      waarover de opgave van de waardeaangroei van de pensioenaanspraken als bedoeld in de eerste volzin wordt verstrekt
      is 2001.

      3 De verzekeraar verstrekt op verzoek van de verzekerde een opgave van de over de jaren
      1994 tot en met 2000 toe te rekenen waardeaangroei van pensioenaanspraken overeenkomstig
      [artikel 3.127 van de Wet inkomstenbelasting 2001][ref3] en de daarop berustende bepalingen.

      4 De verzekeraar verstrekt de verzekerde indien hij ophoudt aan de onderneming verbonden te zijn, overeenkomstig
      [artikel 13, derde lid][ref4], een schriftelijke opgave ter zake van de premievrije aanspraken, bedoeld in
      [artikel 9][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0004195#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3.127
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3.127
      [ref4]: https://wetten.overheid.nl/BWBR0004195#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0004195#Artikel9
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel24
