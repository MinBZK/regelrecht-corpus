      - id: ref3
        bwb_id: BWBR0002089
        artikel: 32a
  - number: 16a
    text: |-
      1 Een verzekeraar is verplicht, tenzij aanvullende bijdragen van de werkgever noodzakelijk zijn en diens financiële
      toestand blijkens een schriftelijke verklaring van een niet aan de onderneming van de werkgever verbonden
      registeraccountant of accountant-administratieconsulent dat niet toelaat, wanneer de verzekerde ophoudt aan de
      onderneming verbonden te zijn anders dan door overlijden of het bereiken van de pensioengerechtigde leeftijd op
      diens verzoek aanspraken op pensioen af te kopen, indien aan de volgende voorwaarden is voldaan:

      a. de afkoop strekt ertoe het de rechthebbende mogelijk te maken om onder aanwending van de afkoopsom aanspraken op
      pensioen te verwerven bij de instelling waar de nieuwe onderneming waaraan hij verbonden is de toezegging omtrent
      pensioen ter uitvoering heeft ondergebracht;

      b. de afkoopsom wordt rechtstreeks overgedragen aan die instelling;

      c. het pensioen of de aanspraak op pensioen wordt verworven jegens een instelling als bedoeld in
      [artikel 32b, eerste lid, onderdeel c, van de wet][ref1].

      2 Een verzekeraar is verplicht op verzoek van de verzekerde de afkoopsom op grond van het eerste lid en van
      [artikel 32b van de wet][ref2] aan te wenden ter verwerving van aanspraken op pensioen voor die verzekerde.

      3 Met betrekking tot het eerste en tweede lid zijn de in [artikel 32b, derde lid, van de wet][ref3] bedoelde regels
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel32b
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel32b
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel32b
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel16a
    references:
      - id: ref1
