  - number: '7'
    text: |-
      1 De verzekeringnemer kan de met de pensioentoezegging corresponderende rechten, welke uit de
      verzekeringsovereenkomst voortvloeien, niet in pand geven en in het algemeen generlei handeling verrichten,
      waardoor ter zake van die rechten aan een ander dan de begunstigde(n) enige aanspraak zou worden verleend.

      2 De verzekeringnemer kan de rechten, welke voor hem uit de verzekeringsovereenkomst voortvloeien, voor zover
      hij deze ter uitvoering van zijn toezegging heeft gesloten, niet overdragen aan een ander dan de verzekerde zelf,
      behoudens overdracht aan diens gewezen echtgenoot met betrekking tot het weduwen- of weduwnaarspensioen als in
      [artikel 10][ref1] bedoeld, en behoudens overdracht ingevolge de [artikelen 17][ref2] en [18][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004195#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004195#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0004195#Artikel18
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel7
