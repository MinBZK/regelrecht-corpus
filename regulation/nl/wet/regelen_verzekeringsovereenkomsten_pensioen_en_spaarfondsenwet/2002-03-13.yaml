articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *wet:* de [Pensioen- en spaarfondsenwet;][ref1]

      b. *verzekeringsovereenkomst:* een overeenkomst van schadeverzekering of een overeenkomst van levensverzekering als
      bedoeld in [artikel 1, eerste lid, onderdelen a en b, van de Wet toezicht verzekeringsbedrijf 1993][ref2].

      c. *verzekeraar:*een verzekeraar als bedoeld in [artikel 2, vierde lid, onder B, van de wet;][ref3]

      d. *verzekeringnemer:*

        - in geval van een verzekeringsovereenkomst als bedoeld in [artikel 2, vierde lid, onder B, van de wet][ref4]:
      de werkgever dan wel degene aan wie deze het verzekeringnemerschap met inachtneming van deze regeling heeft
      overgedragen;
        - in geval van een verzekeringsovereenkomst als bedoeld in [artikel 2, vierde lid, onder C, van de wet][ref5]:
      de verzekerde;

      e. *verzekerde:* de aan de onderneming van een werkgever verbonden of verbonden geweest zijnde persoon, op
      wiens leven een verzekeringsovereenkomst is gesloten ter uitvoering van een pensioentoezegging in de zin van de
      [wet][ref6].


