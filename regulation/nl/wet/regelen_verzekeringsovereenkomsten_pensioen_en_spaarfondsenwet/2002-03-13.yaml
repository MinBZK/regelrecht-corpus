  - number: '17'
    text: |-
      De verzekeringnemer kan, mits de verzekeraar en de verzekerde daarmede instemmen, de rechten en verplichtingen,
      welke voor hem uit de verzekeringsovereenkomst voortvloeien, overdragen aan een werkgever aan wiens onderneming de
      verzekerde alsdan verbonden is.
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel17
  - number: '18'
    text: |-
      Indien de verzekerde toetreedt tot een pensioenfonds dat ingevolge de wet aan het toezicht van de Pensioen- &
      Verzekeringskamer onderworpen is, kan in de verzekeringsovereenkomst dat pensioenfonds als begunstigde worden
      aangewezen en kunnen aan dat pensioenfonds de rechten en verplichtingen, welke voor de verzekeringnemer uit de
      verzekeringsovereenkomst voortvloeien, worden overgedragen. Ook een andere verzekeraar dan de verzekeraar met
      wie de verzekeringsovereenkomst gesloten is kan als begunstigde worden aangewezen. Een en ander is mogelijk,
      mits de verzekeraar met wie de verzekeringsovereenkomst is gesloten en de verzekerde daarmede instemmen.
      [Artikel 16, onderdeel e][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004195#Artikel16
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004195
        artikel: '16'
        hoofdstuk: II
  - number: '19'
    text: |-
      Elk bewijs van verzekering van een verzekering als bedoeld in dit hoofdstuk wordt voorzien van het opschrift:
      Verzekeringsovereenkomst als in [artikel 2, vierde lid, onder B, van de Pensioen- en spaarfondsenwet][ref1]
      bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel2
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '2'
  - number: '20'
    text: |-
      Ingeval voorzieningen als bedoeld in [artikel 2, vierde lid, onder C, van de wet][ref1] getroffen zijn of worden,
      gelden de bepalingen van [hoofdstuk I][ref2] en van dit hoofdstuk en zijn de [artikelen 9][ref3], [9a][ref4] en
      [14 tot en met 18][ref5] van [hoofdstuk II][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004195#HoofdstukI
      [ref3]: https://wetten.overheid.nl/BWBR0004195#Artikel9
