        artikel: '24'
        hoofdstuk: III
  - number: '27'
    text: |-
      Elk bewijs van verzekering van een verzekering als bedoeld in dit hoofdstuk moet voorzien zijn van het opschrift:
      Verzekeringsovereenkomst als in [artikel 2, vierde lid, onder C, van de Pensioen- en spaarfondsenwet][ref1]
      bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel2
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '2'
  - number: '28'
    text: |-
      De [artikelen 13, derde lid][ref1], en [24, tweede lid][ref2], zijn niet van toepassing voor wat betreft de
      verzekerde ten gunste van wie een verzekeringsovereenkomst is gesloten en die voor de inwerkingtreding van deze
      regeling opgehouden is aan de onderneming verbonden te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004195#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004195#Artikel24
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel28
