  - number: '12'
    text: |-
      De verzekeraar zal de verzekering niet eerder laten vervallen of premievrij maken dan een maand na afloop van de
      periode van drie maanden waarbinnen de werkgever verplicht is de in [artikel 3a, vierde lid, van de wet][ref1]
      bedoelde mededeling te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel3a
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: 3a
  - number: 12a
    text: |-
      De verzekeringnemer verstrekt aan de verzekerde een afschrift van de door hem aan de verzekeraar overeenkomstig
      [artikel 2, zevende lid, eerste volzin, van de wet][ref1] gedane mededeling, waarin de gevallen, waarvoor de
      verzekeringnemer zich de bevoegdheid tot vermindering of beëindiging van zijn bijdrage heeft voorbehouden, worden
      weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel2
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '2'
  - number: '13'
    text: |-
      1 De verzekeraar verstrekt een bewijsstuk ter zake van de bestaande aanspraken aan:

      a. de verzekerde bij het bereiken van de pensioengerechtigde leeftijd en bij ingang van een uitkering krachtens
      een invaliditeitsvoorziening;

      b. de verzekerde bij het premievrij maken van de verzekering anders dan in geval van het ophouden aan de
      onderneming verbonden te zijn;

      c. degenen, die rechthebbenden zijn op weduwen-, weduwnaars-, partner- of wezenpensioen, na het overlijden van de
      verzekerde dan wel diens echtgenoot of partner;

      d. de gewezen echtgenoot, als in [artikel 10][ref1] bedoeld.

      2 De verzekeraar verstrekt ten behoeve van elke verzekerde aan de verzekeringnemer bij aanvang van de verzekering
      en vervolgens jaarlijks schriftelijk een opgave waarin in ieder geval de hoogte van de verzekerde bedragen wordt
      vermeld alsmede bij de aanvang van de verzekering en voorts indien en voor zover gewijzigd schriftelijk een opgave
      van het systeem van financiering daarvan.

      3 De verzekeraar verstrekt ten behoeve van de verzekerde jaarlijks een opgave van de aan het desbetreffende
      of voorafgaande kalenderjaar toe te rekenen waardeaangroei van pensioenaanspraken overeenkomstig
      [artikel 3.127 van de Wet inkomstenbelasting 2001][ref2] en de daarop berustende bepalingen. Het eerste jaar
      waarover de opgave van de waardeaangroei van de pensioenaanspraken als bedoeld in de eerste volzin wordt verstrekt
      is 2001.

      4 De verzekeraar verstrekt op verzoek van de verzekerde een opgave van de over de jaren
      1994 tot en met 2000 toe te rekenen waardeaangroei van pensioenaanspraken overeenkomstig
      [artikel 3.127 van de Wet inkomstenbelasting 2001][ref3] en de daarop berustende bepalingen.

      5 De verzekeraar verstrekt de verzekerde bij het ophouden aan de onderneming verbonden te zijn schriftelijk een
      opgave ter zake van de premievrije aanspraken als bedoeld in [het tweede en derde lid van artikel 9][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004195#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3.127
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3.127
