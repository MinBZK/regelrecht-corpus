  - number: '2'
    text: |-
      in deze regeling wordt:

      a. met een onderneming gelijkgesteld elke instelling, van welke aard ook;

      b. degene, die een vrij beroep uitoefent (zoals een advocaat, notaris, accountant, actuaris), geacht een
      onderneming te drijven.
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel2
  - number: 2a
    text: |-
      In de verzekeringsovereenkomst, waarin bij de totstandkoming of op een later tijdstip wordt gekozen voor ander dan
      Nederlands recht, wordt de volgende clausule opgenomen:

      Ongeacht het gekozen rechtsstelsel zijn ten aanzien van deze verzekeringsovereenkomst in ieder geval de Regelen
      verzekeringsovereenkomsten Pensioen- en spaarfondsenwet van toepassing.
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel2a
  - number: '3'
    text: |-
      1 Begunstigde(n) in de verzekeringsovereenkomsten zijn:

        - voor de toegezegde ouderdoms- en invaliditeitsvoorzieningen: de verzekerde;
        - voor de toegezegde weduwen-, weduwnaars- of partnervoorziening al naargelang van de aard van de voorziening: de
      verzekerde dan wel diens echtgenoot of partner;
        - voor de toegezegde wezenvoorziening: de pensioengerechtigde kinderen, een en ander behoudens de
      [artikelen 10][ref1], [18][ref2] en [22][ref3].

      2 Mits de verzekeraar daarmee instemt kan worden bepaald dat in het kader van een verrekening van pensioenrechten
      bij echtscheiding respectievelijk scheiding van tafel en bed in plaats van de verzekerde diens gewezen echtgenoot
      respectievelijk diens echtgenoot wordt aangewezen als begunstigde voor het geheel of een deel van de toegezegde
      ouderdomsvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0004195#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004195#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0004195#Artikel22
