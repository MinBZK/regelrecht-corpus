        artikel: '13'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004195
        artikel: '24'
        hoofdstuk: III
  - number: '29'
    text: |-
      [Artikel 10][ref1] is niet van toepassing voor wat betreft een premievrije aanspraak op weduwnaarspensioen ten
      aanzien van de gewezen echtgenoot wiens huwelijk met een verzekerde voor de inwerkingtreding van deze regeling is
      geëindigd door echtscheiding of ontbinding na scheiding van tafel en bed.


      [ref1]: https://wetten.overheid.nl/BWBR0004195#Artikel10
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004195
        artikel: '10'
        hoofdstuk: II
  - number: '30'
    text: |-
      [Artikel 22][ref1] is niet van toepassing ten aanzien van de gewezen echtgenoot wiens huwelijk met een verzekerde
      voor de inwerkingtreding van deze regeling is geëindigd door echtscheiding of ontbinding na scheiding van tafel
      en bed.


      [ref1]: https://wetten.overheid.nl/BWBR0004195#Artikel22
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004195
        artikel: '22'
        hoofdstuk: III
  - number: '32'
    text: |-
      De vrouw met wie een verzekerde, die voor 9 februari 1973 opgehouden was aan de onderneming verbonden te zijn,
      op die datum was gehuwd verkrijgt ingeval van beëindiging van het huwelijk door echtscheiding of ontbinding na
      scheiding van tafel en bed een zodanige premievrije aanspraak op weduwenpensioen als de verzekerde heeft verkregen
      bij het ophouden aan de onderneming verbonden te zijn; iedere andere aanspraak op weduwenpensioen, welke uit de
      verzekeringsovereenkomst zou kunnen voortvloeien, vervalt. De vrouw ontvangt op haar verzoek een bewijs van haar
      aanspraak. [Artikel 10, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004195#Artikel10
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004195
        artikel: '10'
        hoofdstuk: II
  - number: '33'
    text: |-
      De beschikking van 5 februari 1973, nr. 40 448, directoraat-generaal voor Sociale Voorzieningen, directie Sociale
      Verzekering, afd. P. en S. (Stcrt. 1973, 31), zoals deze sindsdien gewijzigd is, en de beschikking van 3 oktober
      1973, nr. 43 965, directoraat-generaal voor Sociale Voorzieningen, directie Sociale Verzekering, Afd. P. en S.
      (Scrt.  1973, 197), zoals deze sindsdien gewijzigd is, worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel33
  - number: '34'
    text: |-
      Deze regeling, die in de Staatscourant zal worden geplaatst, treedt in werking met ingang van de dag waarop de wet
      van 11 juni 1987, Stb. 340, tot wijziging van de [Pensioen- en spaarfondsenwet][ref1] en van de Wet betreffende
      verplichte deelneming in een bedrijfspensioenfonds in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002089
  - number: '35'
    text: 'Deze regeling wordt aangehaald als: Regelen verzekeringsovereenkomsten Pensioen- en spaarfondsenwet.'
    url: https://wetten.overheid.nl/BWBR0004195/2002-03-13#Artikel35
