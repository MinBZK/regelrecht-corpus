preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen, dat het wenselijk is in verband met de introductie van een toeslagregeling
    ter compensatie van het gemis aan overhevelingstoeslag per 1 januari 2001 ten aanzien van de Toeslagwet
    Indonesische pensioenen 1956 en enkele andere overzeese pensioenwetten nadere regels te stellen, alsmede die wetten
    te actualiseren in verband met de inwerkingtreding van de Algemene nabestaandenwet;

    Zo is het dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012698/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In afwijking van de [Wet brutering overhevelingstoeslag lonen][ref1], heeft degene die op 31 december 2000
      recht heeft op een Indonesisch pensioen, een Nieuw-Guinea pensioen, of een Surinaams garantiepensioen, waarop de
      [Toeslagwet Indonesische pensioenen 1956][ref2], de [Samenloopregeling Indonesische pensioenen 1960][ref3], de
      __REF003___________________________________________________________________________________________________________
      __________________________________________, de [Wet aanpassing pensioenvoorzieningen Bijstandkorps][ref5], de
      [Toeslagregeling pensioenen Suriname en Nederlandse Antillen][ref6] en de [Garantiewet Surinaamse pensioenen][ref7]
      van toepassing is, en wiens recht op 1 januari 2001 voortduurt, zolang hij de pensioengerechtigde leeftijd, bedoeld
      in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref8], nog niet heeft bereikt, recht op een toeslag:

      a. ter grootte van 5,6% van dat pensioen, of die uitkering, met een maximum van € 2066,97 per jaar, indien dat
      recht op dat pensioen, of die uitkering reeds voor 1 januari 1999 bestond;

      b. ter grootte van 1,9% van dat pensioen, of die uitkering, met een maximum van € 791,85 per jaar, indien dat recht
      op dat pensioen, of die uitkering is ontstaan op of na 1 januari 1999.

      2 Voor de toepassing van de bij of krachtens de in het eerste lid bedoelde wetten of genoemde regeling wordt de
      toeslag krachtens dit artikel niet onder pensioen of uitkering begrepen.

      3 Bij koninklijk besluit worden in afwijking van de [Wet brutering overhevelingstoeslag lonen][ref9] lonen
      regels gesteld ten aanzien van de toeslag op een na 31 december 2000 ontstaan recht op pensioen waarop de
      [Toeslagregeling pensioenen Suriname en Nederlandse Antillen][ref10] van toepassing is.


