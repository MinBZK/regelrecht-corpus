    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst en werkt terug:

      a. tot en met 1 januari 2001 voor wat betreft Artikel 1, Artikel 2, Artikel 3, onderdelen A en B, punt 3 van
      onderdeel F, onderdeel N, punt 5 van onderdeel P, onderdeel Q, onderdeel T, Artikel 4, onderdeel A, Artikel 5,
      onderdeel C, punt 3 van onderdeel E, het artikel 19a genoemd in onderdeel G, punt 1b en punt 2 van onderdeel H,
      punt 2 van onderdeel I, onderdelen M en N, [Artikel 6, onderdelen A en C][ref1];

      b. tot en met 1 januari 1998 voor wat betreft [Artikel 3][ref2], het artikel 27b genoemd in onderdeel S en
      [Artikel 5][ref3], het artikel 19c genoemd in onderdeel G;

      c. tot en met 1 juli 1996 voor wat betreft: Artikel 3, de onderdelen C tot en met E, de punten 1 en 2 van onderdeel
      F, onderdelen G tot en met M, onderdeel O, de punten 1 tot en met 4 van onderdeel P, onderdeel R en de artikelen
      27a en 27c genoemd in onderdeel S, Artikel 4, onderdeel B, Artikel 5, de onderdelen A en B, onderdeel D, de punten
      1 en 2 van onderdeel E, onderdeel F, de artikelen 19b en 19d genoemd in onderdeel G, punt 1a van onderdeel H, punt
      1 van onderdeel I, onderdelen J tot en met L en [Artikel 6, onderdeel B][ref4].


