preamble:
  text: |-
    Gelet op artikel 4a van de Wet op het specifiek cultuurbeleid, artikel 4 van het Besluit op het specifiek
    cultuurbeleid en artikel 5 van het Bekostigingsbesluit cultuuruitingen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *aangewezen instelling:* instelling die door de minister is aangewezen als een instelling als bedoeld in
      [artikel 4b van de wet][ref1];
        - *instelling:* privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid dan wel krachtens publiekrecht
      ingestelde rechtspersoon;
        - *jaarlijkse instellingssubsidie:* subsidie als bedoeld in
      [artikel 1, tweede lid, van het Besluit op het specifiek cultuurbeleid][ref2];
        - *minister:* Minister van Onderwijs, Cultuur en Wetenschap;
        - *projectsubsidie:* subsidie als bedoeld in
      [artikel 1, derde lid, van het Besluit op het specifiek cultuurbeleid][ref3];
        - *vierjaarlijkse instellingssubsidie:* subsidie aan een instelling op grond van [artikel 4a][ref4], [4b][ref5]
      of [4c van de wet][ref6];
        - *wet:* [Wet op het specifiek cultuurbeleid][ref7].


