  - number: '5.1'
    text: |-
      De artikelen van dit hoofdstuk zijn van toepassing op de verstrekking van projectsubsidies voor zover voor de
      subsidie geen specifieke regeling bestaat.
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel5.1
  - number: '5.2'
    text: |-
      1 De minister kan op aanvraag een projectsubsidie verstrekken.

      2 De minister kan ambtshalve aan een fonds een projectsubsidie verstrekken.
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel5.2
  - number: '5.3'
    text: |-
      1 Een aanvraag gaat vergezeld van een activiteitenplan en een begroting.

      2 Op het activiteitenplan is [artikel 2.4][ref1] van overeenkomstige toepassing.

      3 De begroting behelst een overzicht van de geraamde baten en lasten van de aanvrager, voor zover deze betrekking
      hebben op de activiteiten waarvoor subsidie wordt gevraagd.

      4 De begroting bevat een postgewijze toelichting.

      5 Indien de minister hierom verzoekt, verstrekt de aanvrager tevens een afschrift van de oprichtingsakte van de
      rechtspersoon dan wel van de statuten zoals deze laatstelijk zijn gewijzigd.

      6 [Artikel 2.7][ref2] is van overeenkomstige toepassing.

      7 In afwijking van het eerste lid gaat een subsidieaanvraag voor reeds verrichte activiteiten vergezeld van een
      verslag van de aard, duur en omvang van de gerealiseerde activiteiten en een jaarrekening of financieel verslag. Op
      de jaarrekening of het financieel verslag zijn de [artikelen 2.26][ref3], met uitzondering van het vierde lid, en
      [2.27, eerste en derde lid][ref4], onderscheidenlijk [artikel 5.12][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2.4
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel2.7
      [ref3]: https://wetten.overheid.nl/BWBR0027597#Artikel2.26
      [ref4]: https://wetten.overheid.nl/BWBR0027597#Artikel2.27
      [ref5]: https://wetten.overheid.nl/BWBR0027597#Artikel5.12
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel5.3
    references:
