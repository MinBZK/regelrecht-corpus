  - number: '5.6'
    text: |-
      1 [Artikel 2.10][ref1] is van overeenkomstige toepassing op de bevoorschotting van projectsubsidies.

      2 In afwijking van het eerste lid wordt een verleend subsidiebedrag dat minder dan € 25.000 bedraagt bij de
      subsidieverlening in één keer als voorschot betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2.10
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel5.6
    references:
