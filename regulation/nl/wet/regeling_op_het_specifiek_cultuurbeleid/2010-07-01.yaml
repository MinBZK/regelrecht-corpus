        artikel: '2.27'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '5.12'
    text: |-
      1 Het financieel verslag geeft een zodanig inzicht dat een verantwoord oordeel kan worden gevormd omtrent de
      besteding van de subsidie door de subsidieontvanger. Het financieel verslag sluit aan op de indeling van de
      begroting, die voorafgaand aan de subsidieverlening is overgelegd. Belangrijke verschillen tussen financieel
      verslag en begroting worden toegelicht.

      2 Op het financieel verslag is [artikel 2.27, eerste en derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2.27
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel5.12
