  - number: '5.10'
    text: |-
      1 De ontvanger van een subsidie die € 25.000 of meer bedraagt, dient binnen 13 weken na de datum, bedoeld in
      [artikel 5.4, derde lid][ref1], een aanvraag tot vaststelling van de subsidie in.

      2 In afwijking van het eerste lid kan de aanvraag tot vaststelling door een subsidieontvanger die tevens een
      jaarlijkse of vierjaarlijkse instellingssubsidie ontvangt, geschieden door verantwoording van de subsidie met de:

      a. bescheiden die vergezeld gaan van de aanvraag tot vaststelling van de jaarlijkse instellingssubsidie of
      vierjaarlijkse instellingssubsidie, of

      b. periodieke verslaglegging, bedoeld in [artikel 2.15][ref2],

      voor zover de verantwoording van de subsidie daarin voldoende inzichtelijk is.

      3 Indien toepassing wordt gegeven aan het tweede lid en de activiteiten van de projectsubsidie zijn afgerond in
      het eerste, tweede of derde jaar van de subsidieperiode van de vierjaarlijkse instellingssubsidie, geschiedt de
      aanvraag tot vaststelling uiterlijk met de periodieke verslaglegging, bedoeld in [artikel 2.15][ref3], over het
      jaar waarin de activiteiten waarvoor de projectsubsidie is verleend, zijn afgerond.

      4 In afwijking van het eerste lid en onverminderd het tweede en derde lid, kan de minister bij de subsidieverlening
      bepalen dat de ontvanger van een subsidie die twee of meer jaren bestrijkt, jaarlijks voor een in de beschikking
      tot verlening van de subsidie op te nemen datum een aanvraag tot vaststelling indient.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel5.4
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel2.15
      [ref3]: https://wetten.overheid.nl/BWBR0027597#Artikel2.15
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel5.10
    references:
