  - number: '5.11'
    text: |-
      1 De aanvraag tot vaststelling van de subsidie gaat vergezeld van een activiteitenverslag of bestuursverslag.

      2 Indien de subsidie € 125.000 of meer bedraagt, gaat de aanvraag tot vaststelling van de subsidie tevens vergezeld
      van een jaarrekening of financieel verslag.

      3 Op het activiteitenverslag is [artikel 2.25][ref1] van overeenkomstige toepassing.

      4 Op het bestuursverslag is [artikel 2.15, tweede tot en met vierde lid][ref2], van overeenkomstige toepassing.

      5 Op de jaarrekening zijn de [artikelen 2.26][ref3], met uitzondering van het vierde lid, en
      [2.27, eerste en derde lid][ref4], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2.25
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel2.15
      [ref3]: https://wetten.overheid.nl/BWBR0027597#Artikel2.26
      [ref4]: https://wetten.overheid.nl/BWBR0027597#Artikel2.27
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel5.11
