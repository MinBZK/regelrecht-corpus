  - number: '5.13'
    text: |-
      1 Na ontvangst van de aanvraag tot vaststelling van de subsidie stelt de minister de subsidie binnen 22 weken vast.

      2 Indien het verleende subsidiebedrag minder dan € 25.000 bedraagt, stelt de minister de subsidie binnen 22 weken
      na de datum, bedoeld in [artikel 5.4, derde lid][ref1], ambtshalve vast.

      3 Met betrekking tot terugvordering van onverschuldigd betaalde subsidiebedragen en voorschotten is
      [artikel 2.30][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel5.4
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel2.30
