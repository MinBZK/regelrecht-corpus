  - number: '5.7'
    text: |-
      1 De verplichtingen, bedoeld in de [artikelen 2.12][ref1], [2.13, tweede tot en met vierde lid][ref2],
      [2.14][ref3] en [2.17 tot en met 2.20][ref4], zijn van overeenkomstige toepassing op de ontvanger van een verleende
      projectsubsidie die € 25.000 of meer bedraagt.

      2 De minister kan bij de verlening van een projectsubsidie die € 25.000 of meer bedraagt, [artikel 2.21][ref5]
      toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2.12
