  - number: '6.1'
    text: |-
      De minister kan, gelet op het belang dat deze regeling beoogt te beschermen, artikelen of onderdelen daarvan buiten
      toepassing laten of daarvan afwijken voor zover strikte toepassing leidt tot een onbillijkheid van overwegende
      aard.
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel6.1
  - number: '6.2'
    text: |-
      1 Aanvragen ingediend op grond van de [Regeling subsidies en uitkeringen cultuuruitingen][ref1] waar nog niet op
      is beslist op het tijdstip van inwerkingtreding van deze regeling worden beschouwd als aanvragen ingediend op grond
      van deze regeling.

      2 De bepalingen krachtens deze regeling die betrekking hebben op de vaststelling en de daarmee
      verbonden wettelijke verplichtingen zijn van toepassing op de subsidies verleend krachtens de
      [Regeling subsidies en uitkeringen cultuuruitingen][ref2], met dien verstande dat de minister binnen zes maanden
      beslist op de aanvraag tot vaststelling van een vierjaarlijkse instellingssubsidie die in 2008 is verleend. In
      afwijking van de [artikelen 2.15, eerste lid][ref3], en [5.10, tweede lid][ref4], bedraagt de termijn, genoemd
      in die artikelen, vier maanden voor subsidies die zijn verleend voor het tijdstip van inwerkingtreding van deze
      regeling. In afwijking van [artikel 2.22, eerste lid][ref5], dient de ontvanger van een subsidie die is verleend
      voor het tijdstip van inwerkingtreding van deze regeling binnen 4 maanden na afloop van de subsidieperiode een
      aanvraag tot vaststelling van de subsidie in.

      3 De bevoorschotting van besluiten genomen op grond van de
      [Regeling subsidies en uitkeringen cultuuruitingen][ref6], vindt plaats overeenkomstig die regeling.

      4 Bezwaar- en beroepsprocedures met betrekking tot besluiten genomen op grond van de
      [Regeling subsidies en uitkeringen cultuuruitingen][ref7], vinden plaats overeenkomstig die regeling.


