  - number: '2.24'
    text: |-
      De aanvraag tot vaststelling van een subsidie die minder dan € 125.000 bedraagt, gaat vergezeld van een
      activiteitenverslag.
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.24
  - number: '2.25'
    text: Het activiteitenverslag beschrijft de aard, duur en omvang van de activiteiten waarvoor subsidie werd verleend.
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.25
  - number: '2.26'
    text: |-
      1 [Titel 9 van boek 2 van het Burgerlijk Wetboek][ref1] is van toepassing op de jaarrekening met dien verstande
      dat de winst- en verliesrekening wordt vervangen door een exploitatierekening; op deze exploitatierekening zijn de
      bepalingen omtrent de winst- en verliesrekening van overeenkomstige toepassing. Bepalingen omtrent winst en verlies
      zijn van overeenkomstige toepassing op het exploitatiesaldo.

      2 De minister kan bepalen dat bepalingen van [titel 9][ref2] of onderdelen daarvan niet van toepassing zijn op
      bepaalde subsidieontvangers of categorieën van subsidieontvangers.

      3 De jaarrekening omvat de balans en de exploitatierekening, en gaat vergezeld van een toelichting op beide.

      4 In de jaarrekening van een ontvanger van vierjaarlijkse instellingssubsidie wordt tevens een
      prestatieverantwoording opgenomen die een inzichtelijk kwantitatief overzicht in kort bestek bevat van de
      activiteiten die zijn verricht in het jaar waarop de jaarrekening betrekking heeft.

      5 Een rechtspersoon die krachtens publiekrecht is opgericht behoeft geen jaarrekening in te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
  - number: '2.27'
    text: |-
      1 De jaarrekening is voorzien van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref1].

      2 De jaarrekening van een ontvanger van vierjaarlijkse instellingssubsidie is tevens voorzien van een rapport van
      feitelijke bevindingen over de prestatieverantwoording.

      3 In de verklaring, bedoeld in het eerste lid, doet de accountant een uitspraak over de naleving van de
      subsidiebepalingen door de subsidieontvanger overeenkomstig de controleprotocollen opgenomen in de bij deze
      regeling gevoegde [bijlagen IIA][ref2] onderscheidenlijk [IIB][ref3] met gebruikmaking van de bij die bijlagen
      opgenomen modellen voor accountantsverklaringen.

      4 De verklaring, bedoeld in het eerste lid, heeft geen betrekking op een in de jaarrekening opgenomen
      prestatieverantwoording.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0027597
      [ref3]: https://wetten.overheid.nl/BWBR0027597
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.27
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0027597
      - id: ref3
        bwb_id: BWBR0027597
  - number: '2.28'
    text: |-
      Het bestuursverslag, het activiteitenverslag en de jaarrekening, waaronder de prestatieverantwoording, voldoen aan
      de eisen, genoemd in de bij deze regeling gevoegde [bijlage IA][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027597
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.28
    references:
      - id: ref1
        bwb_id: BWBR0027597
  - number: '2.29'
    text: |-
      1 Na ontvangst van de aanvraag tot vaststelling van de subsidie stelt de minister de subsidie binnen 22 weken vast.

      2 Tegelijkertijd met de vaststelling van de subsidie neemt de minister een besluit over de besteding van het bedrag
      van het bestemmingsfonds OCW, bedoeld in [artikel 2.16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2.16
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.29
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '2.16'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '2.30'
    text: |-
      1 Onverminderd [artikel 2.29, tweede lid][ref1], is de subsidieontvanger na de subsidievaststelling verplicht een
      teveel aan ontvangen voorschot onverwijld terug te betalen, tenzij de minister tot verrekening op andere wijze
      heeft besloten.

      2 Bij terugvordering van onverschuldigd betaalde subsidiebedragen of voorschotten is de subsidieontvanger verplicht
      de met de terugvordering verband houdende kosten te voldoen. Tevens kan de minister in dat geval de verschuldigde
      wettelijke rente vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2.29
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.30
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '2.29'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '4.1'
    text: |-
      [Paragraaf 2.2][ref1] is niet van toepassing op de verstrekking van vierjaarlijkse instellingssubsidies aan
      aangewezen instellingen en fondsen.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0027597
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '4.2'
    text: |-
      1 Aangewezen instellingen en fondsen dienen uiterlijk zes maanden voor aanvang van de subsidieperiode van vier
      kalenderjaren een begroting in.

      2 Op de begroting is [artikel 2.5][ref1] van overeenkomstige toepassing.

      3 Indien de minister hier om verzoekt, verstrekt de aanvrager tevens een afschrift van de oprichtingsakte van de
      rechtspersoon dan wel van de statuten zoals deze laatstelijk zijn gewijzigd.

      4 [Artikel 2.7][ref2] is van overeenkomstige toepassing op de aangewezen instellingen en fondsen bij de indiening
      van de begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel2.7
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '2.5'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0027597
        artikel: '2.7'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '4.3'
    text: |-
      1 Tijdens iedere periode waarin aan de aangewezen instellingen of fondsen subsidie is verleend, wordt bij ieder
      van die instellingen een visitatie uitgevoerd die ten doel heeft de wijze waarop die instelling haar taken verricht
      te beoordelen.

      2 Met de visitatie zijn visitatiecommissies belast.

      3 Een visitatiecommissie wordt door de minister ingesteld na overleg met de instelling of instellingen waarbij
      die visitatie wordt uitgevoerd. De minister stelt daarbij vast over welke instelling of instellingen de
      visitatiecommissie haar bemoeienis uitstrekt.

      4 De leden van de visitatiecommissie worden benoemd, ontslagen en geschorst door de minister, gehoord de instelling
      of instellingen waartoe de visitatiecommissie haar bemoeienis zal uitstrekken.

      5 Na afloop van iedere visitatie stelt de visitatiecommissie een visitatierapport vast. Het visitatierapport is
      openbaar.

      6 De minister kan van het eerste lid in bijzondere gevallen ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel4.3
  - number: '4.4'
    text: |-
      In afwijking van [artikel 2.28][ref1] voldoen het bestuursverslag, de jaarrekening en de prestatieverantwoording
      van fondsen aan de eisen, genoemd in de bij deze regeling gevoegde [bijlage IB][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2.28
      [ref2]: https://wetten.overheid.nl/BWBR0027597
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel4.4
