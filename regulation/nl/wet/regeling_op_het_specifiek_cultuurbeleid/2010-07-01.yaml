        paragraaf: '5.2'
  - number: '5.5'
    text: |-
      [Artikel 2.9][ref1] is van overeenkomstige toepassing op de verstrekking van projectsubsidies.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2.9
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel5.5
