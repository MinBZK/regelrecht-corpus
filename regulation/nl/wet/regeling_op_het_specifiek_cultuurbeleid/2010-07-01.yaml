  - number: '2.1'
    text: |-
      1 De artikelen van dit hoofdstuk zijn uitsluitend van toepassing op de verstrekking van jaarlijkse
      instellingssubsidies en vierjaarlijkse instellingssubsidies, tenzij in een artikel anders is bepaald.

      2 Jaarlijkse instellingssubsidies worden niet verstrekt voor een subsidiebedrag dat minder dan € 25.000 bedraagt.

      3 Vierjaarlijkse instellingssubsidies worden niet verstrekt voor een subsidiebedrag dat minder dan € 125.000
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.1
  - number: '2.2'
    text: |-
      1 Om in aanmerking te komen voor een jaarlijkse instellingssubsidie, dient de instelling uiterlijk dertien weken
      voor de aanvang van het betreffende kalenderjaar een subsidieaanvraag in.

      2 Om in aanmerking te komen voor een vierjaarlijkse instellingssubsidie, dient de instelling overeenkomstig de
      aanvraagtermijn in [hoofdstuk 3][ref1] een subsidieaanvraag in.

      3 De minister kan in bijzondere gevallen een te laat ingediende aanvraag voor een jaarlijkse instellingssubsidie in
      behandeling nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0027597
        hoofdstuk: '3'
  - number: '2.3'
    text: |-
      De subsidieaanvraag gaat in ieder geval vergezeld van:

      a. een activiteitenplan; en

      b. een begroting.
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.3
  - number: '2.4'
    text: |-
      Het activiteitenplan omvat een overzicht van de activiteiten waarvoor subsidie wordt gevraagd en de daarmee na te
      streven doelstellingen.
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.4
  - number: '2.5'
    text: |-
      1 De begroting behelst een overzicht van de voor het kalenderjaar onderscheidenlijk de kalenderjaren geraamde baten
      en lasten van de aanvrager, voor zover deze betrekking hebben op de activiteiten waarvoor subsidie wordt gevraagd.

      2 De begroting bevat een postgewijze toelichting.

      3 De begroting bij de aanvraag voor een vierjaarlijkse instellingssubsidie omvat tevens een prestatieoverzicht dat
      in kort bestek een inzichtelijk kwantitatief overzicht bevat van de te verrichten activiteiten in ieder van de vier
      jaren van de periode waarvoor de subsidie wordt gevraagd.

      4 De minister kan aangeven dat de begroting uitgaat van een prijspeil van een door hem bepaald jaar.
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.5
  - number: '2.6'
    text: |-
      1 De aanvraag gaat voorts vergezeld van een document waaruit de financiële positie van de aanvrager blijkt, tenzij
      de subsidieaanvraag wordt ingediend door een krachtens publiekrecht ingestelde rechtspersoon.

      2 Een document als bedoeld in het eerste lid is de laatst opgemaakte jaarrekening als bedoeld in
      [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1] of, indien geen jaarrekening voor handen is, een verslag
      over de financiële positie van de aanvrager op het moment van de aanvraag.

      3 Indien de minister hierom verzoekt, verstrekt de aanvrager tevens een afschrift van de oprichtingsakte van de
      rechtspersoon dan wel van de statuten zoals deze laatstelijk zijn gewijzigd.

      4 Een document als bedoeld in het eerste lid gaat niet bij de aanvraag voor zover de aanvrager er redelijkerwijs
      van uit kan gaan dat dit document al in het bezit is van de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
  - number: '2.7'
    text: |-
      Voor zover de aanvrager voor dezelfde begrote lasten tevens subsidie heeft aangevraagd bij een of meer andere
      bestuursorganen, maakt hij dat inzichtelijk in de aanvraag.
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.7
  - number: '2.8'
    text: |-
      1 De minister beslist op de aanvraag voor een jaarlijkse instellingssubsidie binnen 13 weken na de ontvangst van
      die aanvraag.

      2 De termijn, genoemd in het eerste lid bedraagt 22 weken, indien de minister over de aanvraag advies inwint of een
      nader onderzoek naar de aanvraag instelt. Indien toepassing wordt gegeven aan de vorige volzin, doet de minister
      hiervan mededeling aan de aanvrager.

      3 De minister beslist op de aanvraag voor een vierjaarlijkse instellingssubsidie binnen 40 weken na afloop van de
      periode waarin aanvragen kunnen worden ingediend en uiterlijk dertien weken voor de periode van vier kalenderjaren
      waarvoor subsidie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.8
  - number: '2.9'
    text: |-
      1 De subsidieverlening wordt geweigerd voor zover de minister van oordeel is dat het verstrekken daarvan het
      door hem openbaar gemaakte cultuurbeleid, mede gelet op de beschikbare financiële middelen, niet of onvoldoende
      ondersteunt.

      2 Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1] wordt de subsidieverlening voorts in ieder
      geval geweigerd voor zover:

      a. naar het oordeel van de minister mag worden verwacht dat de met subsidieverlening beoogde doeleinden niet zullen
      worden bereikt; of

      b. de aanvrager naar het oordeel van de minister de behoefte aan subsidie niet heeft aangetoond, tenzij de
      aanvrager een krachtens publiekrecht ingestelde rechtspersoon is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel435
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:35
  - number: '2.10'
    text: |-
      1 De minister betaalt als voorschot per kwartaal een gelijk deel van het subsidiebedrag dat aan een instelling
      is verleend.

      2 Een kwartaal als bedoeld in het eerste lid is gelijk aan de periode van de eerste drie maanden, de tweede drie
      maanden, de derde drie maanden of de vierde drie maanden van een kalenderjaar.

      3 Indien de liquiditeitsbehoefte van de subsidieontvanger om een ander betaalritme vraagt, kan de minister in
      afwijking van het eerste lid een groter of kleiner deel van de subsidie als voorschot betalen in door hem te
      bepalen termijnen.

      4 De liquiditeitsbehoefte, bedoeld in het derde lid, volgt uit documenten van de aanvrager, dan wel wordt
      ambtshalve vastgesteld door de minister.
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.10
  - number: '2.11'
    text: |-
      1 Bij de verlening van een vierjaarlijkse instellingssubsidie kan de minister bepalen dat het subsidiebedrag
      jaarlijks door hem wordt bijgesteld, rekening houdend met de ontwikkeling van het prijspeil en met de ontwikkeling
      van de kosten in de arbeidsvoorwaarden.

      2 Met het oog op de toepassing van het eerste lid kan de minister bij de verlening van de subsidie tevens bepalen
      welk deel van de subsidie in aanmerking zal worden genomen voor de bijstelling in verband met de ontwikkeling van
      het prijspeil onderscheidenlijk van de ontwikkeling van de kosten in de arbeidsvoorwaarden.

      3 Als de subsidie met toepassing van het eerste lid wordt bijgesteld, kan de bevoorschotting overeenkomstig die
      bijstelling worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.11
  - number: '2.12'
    text: |-
      De subsidieontvanger zorgt ervoor dat de werkzaamheden op een zodanige manier worden uitgevoerd dat de subsidie op
      doelmatige wijze wordt gebruikt voor de doeleinden waarvoor deze wordt verleend.
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.12
  - number: '2.13'
    text: |-
      1 De subsidieontvanger stelt het boekjaar gelijk aan het kalenderjaar.

      2 De subsidieontvanger voert een zodanig ingerichte administratie dat daaruit te allen tijde de voor de
      vaststelling van de subsidie van belang zijnde rechten en verplichtingen evenals de baten en lasten kunnen worden
      nagegaan.

      3 De administratie en de daartoe behorende documenten worden gedurende zeven jaren bewaard.

      4 Dit artikel is niet van toepassing op een ontvanger van een subsidie die minder dan € 125.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.13
  - number: '2.14'
    text: |-
      1 Indien gedurende de subsidieperiode aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de
      werkelijke baten en lasten en de begrote baten en lasten doet de subsidieontvanger daarvan onverwijld mededeling
      aan de minister onder vermelding van de oorzaak van de verschillen.

      2 De subsidieontvanger doet onverwijld een melding aan de minister van feiten en omstandigheden die van belang
      kunnen zijn voor de subsidieverstrekking. Bij de melding worden de stukken overgelegd die betrekking hebben op de
      gemelde feiten en omstandigheden en wordt de oorzaak van de gemelde feiten en omstandigheden toegelicht.

      3 Aan het tweede lid wordt in ieder geval toepassing gegeven indien het voor de subsidieontvanger aannemelijk is of
      had moeten zijn dat:

      a. de activiteiten waarvoor de subsidie is verleend niet, niet tijdig of niet geheel zijn verricht of zullen worden
      verricht, of

      b. niet of niet geheel aan de subsidieverplichtingen wordt voldaan of zal worden voldaan.

      4 Het eerste lid is niet van toepassing op de ontvanger van een subsidie die minder dan € 125.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.14
  - number: '2.15'
    text: |-
      1 De ontvanger van een vierjaarlijkse instellingssubsidie dient na het eerste, tweede en derde jaar van de
      vierjaarlijkse periode waarvoor subsidie is verleend, over het betreffende jaar, binnen dertien weken een
      bestuursverslag en een jaarrekening in.

      2 Het bestuursverslag geeft in ieder geval toelichting op:

      a. het exploitatieresultaat van de subsidieontvanger;

      b. de financiële positie van de subsidieontvanger;

      c. het al dan niet realiseren van de voorgenomen activiteiten;

      d. de zaken die nu en in de toekomst van invloed kunnen zijn op het functioneren van de subsidieontvanger; en

      e. de specifieke aandachtspunten die in de beschikking tot subsidieverlening zijn vermeld.

      3 Voorts bevat het bestuursverslag een inzichtelijke kwalitatieve beschrijving in kort bestek van de verrichte
      activiteiten in het afgelopen jaar.

      4 Op het bestuursverslag is [artikel 2.28][ref1] van toepassing. Het bestuur van de subsidieontvanger ondertekent
      het bestuursverslag.

      5 Op de jaarrekening zijn de [artikelen 2.26][ref2], [2.27][ref3] en [2.28][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2.28
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel2.26
      [ref3]: https://wetten.overheid.nl/BWBR0027597#Artikel2.27
      [ref4]: https://wetten.overheid.nl/BWBR0027597#Artikel2.28
    url: https://wetten.overheid.nl/BWBR0027597/2010-07-01#Artikel2.15
