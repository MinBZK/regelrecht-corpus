preamble:
  text: |-
    Gelet op artikel 4a van de Wet op het specifiek cultuurbeleid, artikel 4 van het Besluit op het specifiek
    cultuurbeleid en artikel 5 van het Bekostigingsbesluit cultuuruitingen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *instelling:* privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid;
        - *minister:* Minister van Onderwijs, Cultuur en Wetenschap;
        - *wet:* [Wet op het specifiek cultuurbeleid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005904
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0005904
  - number: '2.1'
    text: |-
      1 De artikelen van dit hoofdstuk zijn uitsluitend van toepassing op de verstrekking van subsidies als bedoeld in
      [artikel 4a][ref1] of [4c van de wet][ref2].

      2 [Paragraaf 2.2][ref3] is niet van toepassing op de verstrekking van subsidies op grond van
      [artikel 4c van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0005904#Artikel4c
      [ref3]: https://wetten.overheid.nl/BWBR0027597#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0005904#Artikel4c
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0005904
        artikel: 4c
      - id: ref3
