  - number: '3.16'
    text: |-
      1 De minister kan subsidie verstrekken aan een instelling met als kernactiviteit het verzorgen van symfonisch
      aanbod, indien de instelling:

      a. een breed repertoire aanbiedt;

      b. haar activiteiten geografisch op een geconcentreerde wijze spreidt in de regio of het verzorgingsgebied waarin
      zij haar standplaats heeft;

      c. ten minste eenmaal per jaar om niet beschikbaar is voor de begeleiding van een productie van een instelling die
      een subsidie ontvangt op grond van [artikel 3.22][ref1] of [3.23][ref2];

      d. een beleid voert dat talentontwikkeling bevordert; en

      e. een beleid voert dat samenwerking met andere orkesten en derden bevordert.

      2 De minister verstrekt op grond van het eerste lid aan ten hoogste zes instellingen subsidie, waarbij in de
      regio Noord, de regio Oost, de regio Zuid, de gemeente Amsterdam, de gemeente Rotterdam en de gemeente Den Haag er
      telkens ten hoogste één instelling haar standplaats heeft.

      3 In afwijking van het eerste lid, onderdeel c, zijn de instellingen in regio Oost en in regio Zuid ten minste
      tweemaal per jaar om niet beschikbaar voor de begeleiding van een productie van een instelling die een subsidie
      ontvangt op grond van [artikel 3.22][ref3] of [3.23][ref4].


