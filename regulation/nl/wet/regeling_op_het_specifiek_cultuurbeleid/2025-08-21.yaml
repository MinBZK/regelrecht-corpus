  - number: '2.26'
    text: |-
      1 [Titel 9][ref1], met uitzondering van de [afdelingen 1][ref2] en
      [11 tot en met 16, van boek 2 van het Burgerlijk Wetboek][ref3] is van toepassing op de jaarrekening met
      dien verstande dat de winst- en verliesrekening wordt vervangen door een exploitatierekening; op deze
      exploitatierekening zijn de bepalingen omtrent de winst- en verliesrekening van overeenkomstige toepassing.
      Bepalingen omtrent winst en verlies zijn van overeenkomstige toepassing op het exploitatiesaldo.

      2 De minister kan bepalen dat bepalingen van [titel 9][ref4] of onderdelen daarvan niet van toepassing zijn op
      bepaalde subsidieontvangers of categorieën van subsidieontvangers.

      3 De jaarrekening omvat de balans en de exploitatierekening, en gaat vergezeld van een toelichting op beide.

      4 De jaarrekening van de subsidieontvanger gaat vergezeld van de jaarrekeningen van dochtermaatschappijen van de
      instelling als bedoeld in [artikel 24a van boek 2 van het Burgerlijk Wetboek][ref5] of andere rechtspersonen waarop
      zij een overheersende zeggenschap kan uitoefenen of waarover zij de centrale leiding heeft.


