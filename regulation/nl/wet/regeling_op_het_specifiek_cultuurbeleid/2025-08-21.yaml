  - number: '6.1'
    text: |-
      De minister kan, gelet op het belang dat deze regeling beoogt te beschermen, artikelen of onderdelen daarvan buiten
      toepassing laten of daarvan afwijken voor zover strikte toepassing leidt tot een onbillijkheid van overwegende
      aard.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel6.1
  - number: '6.10'
    text: |-
      De [Regeling subsidies en uitkeringen cultuuruitingen][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0007155
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel6.10
