  - number: '3.7'
    text: |-
      1 De minister beslist gelijktijdig op alle aanvragen op basis van een vergelijking van hun geschiktheid om bij te
      dragen aan de doelstellingen van de bij of krachtens de wet gestelde regels, aan de hand van de criteria, bedoeld
      in [artikel 3.9][ref1], en de afwegingsaspecten, bedoeld in [artikel 3.10][ref2].

      2 De minister vraagt de Raad om advies omtrent de te nemen besluiten op de aanvragen. De Raad stelt ten behoeve
      van zijn advisering een beoordelingskader vast aan de hand van de criteria, bedoeld in [artikel 3.9][ref3] en de
      afwegingsaspecten, bedoeld in [artikel 3.10][ref4].

      3 Indien na beoordeling van alle aanvragen een bepaald beschikbaar bedrag niet geheel wordt verleend, kan de
      minister het resterende bedrag toevoegen aan een ander subsidieplafond binnen die paragraaf onderscheidenlijk
      afdeling.

      4 Het derde lid is niet van toepassing op [paragraaf 3.2.3][ref5].


