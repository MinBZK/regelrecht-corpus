      [artikel 2.22, eerste lid][ref1], stelt de minister de subsidie binnen 22 weken vast.

      2 Onverminderd [artikel 4.46, tweede lid, van de Algemene wet bestuursrecht][ref2] kan de subsidie lager worden
      vastgesteld, indien het percentage of bedrag, bedoeld in [artikel 2.16, tweede lid][ref3], wordt overschreden.


