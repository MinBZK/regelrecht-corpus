  - number: '3.5'
    text: |-
      1 Een aanvraag voor subsidie voor de jaren 2025 tot en met 2028 op grond van dit hoofdstuk kan worden ingediend na
      2 december 2023 tot en met uiterlijk 31 januari 2024 om 23.59 uur.

      2 In afwijking van het eerste lid kan een aanvraag voor subsidie voor de jaren 2025 tot en met 2028 op grond van
      [artikel 3.29][ref1] worden ingediend na 2 december 2023 tot en met uiterlijk 28 februari 2024 om 23.59 uur.

      3 Indien het door technische problemen aan de kant van de minister onverhoopt onmogelijk is om de aanvraag tijdig
      in te dienen op de door de minister te bepalen wijze, bedoeld in [artikel 3.6][ref2], besluit de minister om de
      desbetreffende aanvraagperiode te verlengen met een door hem te bepalen redelijke termijn.


