  - number: '3.18'
    text: |-
      De minister kan subsidie verstrekken aan ten hoogste één instelling met als kernactiviteit het begeleiden van
      dansproducties, indien de instelling:

      a. beschikbaar is voor de begeleiding van de producties van een instelling die een subsidie ontvangt op grond van
      [artikel 3.14, tweede lid, onderdeel a][ref1]; en

      b. ten minste eenmaal per jaar beschikbaar is voor de begeleiding van een productie van een instelling die een
      subsidie ontvangt op grond van [artikel 3.14, tweede lid, onderdeel b][ref2];

      voor zover de begeleiding in de basisbezetting van haar orkest om niet plaatsvindt, en niet meer dan een redelijke
      prijs in rekening wordt gebracht voor de kosten die verband houden met een aanvullende bezetting bij repertoire
      waarbij een basisbezetting naar algemeen gangbare artistieke maatstaven niet volstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel3.14
