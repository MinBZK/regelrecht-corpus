  - number: '3.49'
    text: |-
      De minister kan subsidie verstrekken aan ten hoogste één instelling met als kernactiviteit het verrichten van
      ondersteunende activiteiten op het terrein van cultuureducatie en cultuurparticipatie, indien de activiteiten van
      de instelling gericht zijn op:

      a. deskundigheidsbevordering in cultuureducatie en cultuurparticipatie;

      b. landelijke informatie- en netwerkfunctie voor zowel cultuureducatie als cultuurparticipatie;

      c. onderzoek en monitoring voor zowel cultuureducatie als cultuurparticipatie; en

      d. de bevordering van een goede toepassing en het beheer van de Code Diversiteit en Inclusie.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.49
  - number: '3.50'
    text: |-
      De minister kan subsidie verstrekken aan ten hoogste één instelling met als kernactiviteit coördinatie van de
      uitvoering van het internationaal cultuurbeleid en het stimuleren van de uitwisseling van kennis en ervaring op het
      gebied van erfgoed tussen organisaties en landen, indien de activiteiten van de instelling gericht zijn op:

      a. de coördinatie bij de uitvoering van het internationale cultuurbeleid vanuit een sectoroverstijgende rol;

      b. het stimuleren van de mobiliteit van kunstenaars en instellingen; en

      c. voorlichting over en ondersteuning bij subsidieprogramma's van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.50
  - number: '3.51'
    text: |-
      De minister kan subsidie verstrekken aan ten hoogste één instelling met als kernactiviteit het ontwikkelen en
      verspreiden van kennis en het bevorderen van deskundigheid op het gebied van digitale transformatie in de culturele
      en creatieve sector, indien:

      a. de activiteiten van de instelling:

      1°. gericht zijn op het vervullen van een landelijke kennis- en deskundigheidsfunctie voor digitale transformatie
      in de culturele en creatieve sector, waaronder voor het gebruik van digitale technologie en datagedreven werken;

      2°. als doel hebben om de maatschappelijke impact van cultuur te vergroten; en

      3°. gericht zijn op het bevorderen van samenwerking tussen culturele instellingen en sectoren.

      b. de instelling zijn activiteiten afstemt met relevante partijen.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.51
  - number: '3.52'
    text: |-
      De minister kan subsidie verstrekken aan ten hoogste één instelling met als kernactiviteit het verzamelen en
      verspreiden van kennis en informatie over het culturele leven in beleid en praktijk, indien de activiteiten van de
      instelling gericht zijn op:

      a. het bevorderen, coördineren en uitvoeren van onderzoek over de productie, distributie en afname van kunst en
      cultuur en over het nationale en internationale kunst- en cultuurbeleid, onder meer door:

      1°. het bieden van één centrale plek voor cijfers en andere informatie over het culturele leven;

      2°. het maken van een periodieke monitor cultuur;

      3°. het coördineren van dataverzameling; en

      4°. het opstellen van een periodieke onderzoekagenda cultuur; en

      b. het bevorderen en faciliteren van meningsvorming over de productie, distributie en afname van kunst en cultuur
      en over het nationale en internationale kunst- en cultuurbeleid.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.52
  - number: '3.53'
    text: |-
      De minister kan subsidie verstrekken aan ten hoogste één instelling met als kernactiviteit het onafhankelijk
      informeren en adviseren van ondernemers en organisaties in de culturele en creatieve sector over ondernemerschap en
      financiering, indien de activiteiten van de instelling gericht zijn op:

      a. het vervullen van een landelijke informatie-, kennis- en netwerkfunctie over ondernemerschap en financiering in
      de culturele en creatieve sector;

      b. kennisontwikkeling, innovatie en het stimuleren van het gebruik van verschillende financieringsinstrumenten en
      verdienmodellen in de culturele en creatieve sector; en

      c. de bevordering van een goede toepassing en het beheer van de Governance Code Cultuur.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.53
  - number: '3.54'
    text: |-
      De minister kan subsidie verstrekken aan ten hoogste één instelling met als kernactiviteit het verbeteren van de
      arbeidsmarkt in de culturele en creatieve sector, indien de activiteiten van de instelling gericht zijn op:

      a. het vervullen van een onafhankelijke coördinatie-, informatie- en kennisfunctie, en het bieden van een platform
      voor de sociale dialoog; en

      b. het analyseren van behoeftes in het culturele en creatieve veld, alsmede het coördineren en uitvoeren
      van projecten en programma’s ten behoeve van het duurzaam versterken van de arbeidsmarkt en de positie en
      inkomenspositie van werkenden die daarin actief zijn.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.54
  - number: '3.55'
    text: |-
      Voor subsidieverstrekking op grond van de [artikelen 3.49 tot en met 3.54][ref1] zijn jaarlijks ten hoogste de
      volgende bedragen beschikbaar:

      a. voor een instelling als bedoeld in [artikel 3.49][ref2]: € 6.083.800;

      b. voor een instelling als bedoeld in [artikel 3.50][ref3]: € 1.173.100;

      c. voor een instelling als bedoeld in [artikel 3.51][ref4]: € 3.694.700;

      d. voor een instelling als bedoeld in [artikel 3.52][ref5]: € 1.770.400;

      e. voor een instelling als bedoeld in [artikel 3.53][ref6]: € 2.008.900; en

      f. voor een instelling als bedoeld in [artikel 3.54][ref7]: € 1.279.000.


