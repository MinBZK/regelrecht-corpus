      1 De minister kan subsidie verstrekken aan ten hoogste één instelling met als kernactiviteit de landelijke
      coördinatie van de leesbevordering en literatuureducatie.

      2 De minister kan subsidie verstrekken aan ten hoogste één instelling met als kernactiviteit de landelijke
      bemiddeling tussen schrijvers, scholen en bibliotheken voor het geven van lezingen over en rond het werk van die
      schrijvers ter bevordering van het lezen.

      3 De minister kan subsidie verstrekken aan ten hoogste één instelling met als kernactiviteit de landelijke
      ondersteuning van bijzondere journalistieke projecten die leiden tot journalistieke producten of andere non-fictie
      werken.

      4 De minister kan subsidie verstrekken aan ten hoogste één instelling met als kernactiviteit lettereneducatie voor
      kinderen in het primair onderwijs.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.39
  - number: '3.40'
    text: |-
      De minister kan subsidie verstrekken aan ten hoogste één instelling met als kernactiviteit de presentatie
      van actueel of vernieuwend aanbod in internationale context primair op het terrein van de letteren, indien de
      activiteiten van de instelling:

      a. er mede op gericht zijn een platform te bieden voor internationale uitwisseling tussen vakgenoten; en

      b. jaarlijks of tweejaarlijks gedurende een in de tijd beperkte periode plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.40
