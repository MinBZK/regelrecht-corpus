        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref4
        bwb_id: BWBR0005904
        artikel: 4c
  - number: '2.2'
    text: |-
      Om in aanmerking te komen voor subsidie, dient de instelling overeenkomstig de aanvraagtermijn in
      [hoofdstuk 3][ref1] een subsidieaanvraag in.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0027597
        hoofdstuk: '3'
  - number: '2.3'
    text: |-
      De subsidieaanvraag gaat in ieder geval vergezeld van:

      a. een activiteitenplan; en

      b. een begroting.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.3
  - number: '2.4'
    text: |-
      Het activiteitenplan omvat een overzicht van de activiteiten waarvoor subsidie wordt gevraagd en de daarmee na te
      streven doelstellingen.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.4
  - number: '2.5'
    text: |-
      1 De begroting behelst een overzicht van de geraamde baten en lasten van de aanvrager voor ieder van de vier jaren
      van de vierjaarsperiode, bedoeld in [artikel 4a][ref1] en [4c van de wet][ref2], voor zover deze betrekking hebben
      op de activiteiten waarvoor subsidie wordt gevraagd.

      2 De begroting bevat een postgewijze toelichting.

      3 De begroting bevat tevens een beknopt kwantitatief activiteitenoverzicht van de te verrichten activiteiten in
      ieder van de vier jaren van de periode waarvoor de subsidie wordt gevraagd.

      4 De minister kan aangeven dat de begroting uitgaat van een prijspeil van een door hem bepaald jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0005904#Artikel4c
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0005904
        artikel: 4c
  - number: '2.6'
    text: |-
      1 De aanvraag gaat voorts vergezeld van een document waaruit de financiële positie van de aanvrager blijkt alsmede
      een afschrift van de oprichtingsakte van de rechtspersoon dan wel van de statuten zoals deze laatstelijk zijn
      gewijzigd.

      2 Een document als bedoeld in het eerste lid is de laatst opgemaakte jaarrekening als bedoeld in
      [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1] of, indien geen jaarrekening voor handen is, een verslag
      over de financiële positie van de aanvrager op het moment van de aanvraag.

      3 Documenten als bedoeld in het eerste lid gaan niet bij de aanvraag voor zover de aanvrager er redelijkerwijs van
      uit kan gaan dat deze reeds in het bezit zijn van de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
  - number: '2.7'
    text: |-
      Voor zover de aanvrager voor dezelfde begrote lasten tevens subsidie heeft aangevraagd bij een of meer andere
      bestuursorganen, maakt hij dat inzichtelijk in de aanvraag.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.7
  - number: '2.8'
    text: |-
      De minister beslist op de aanvraag voor subsidie binnen 40 weken na afloop van de periode waarin aanvragen
      kunnen worden ingediend en uiterlijk dertien weken voor de periode van vier kalenderjaren waarvoor subsidie wordt
      gevraagd.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.8
  - number: '2.9'
    text: |-
      1 De subsidieverlening wordt geweigerd voor zover de minister van oordeel is dat het verstrekken daarvan het
      door hem openbaar gemaakte cultuurbeleid, mede gelet op de beschikbare financiële middelen, niet of onvoldoende
      ondersteunt.

      2 Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1] wordt de subsidieverlening voorts in ieder
      geval geweigerd voor zover:

      a. naar het oordeel van de minister mag worden verwacht dat de met subsidieverlening beoogde doeleinden niet zullen
      worden bereikt; of

      b. de aanvrager naar het oordeel van de minister de behoefte aan subsidie niet heeft aangetoond.

      3 Subsidie wordt niet verstrekt voor een subsidiebedrag dat minder dan € 125.000 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel435
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:35
  - number: '2.10'
    text: |-
      1 Bij de subsidieverlening kan de minister, al dan niet in afwijking van het subsidieplafond dat van toepassing is,
      bepalen dat de subsidie jaarlijks door hem wordt verhoogd, rekening houdend met de ontwikkeling van de kosten in
      de arbeidsvoorwaarden.

      2 De minister kan de subsidie, al dan niet in afwijking van het subsidieplafond dat van toepassing is, tevens op de
      navolgende momenten verhogen:

      a. bij de verlening, rekening houdend met de ontwikkeling in de twee jaar voorafgaand aan het tijdvak van de
      subsidie van de kosten in de arbeidsvoorwaarden of van de kosten in de ontwikkeling van het prijspeil;

      b. jaarlijks, rekening houdend met de ontwikkeling van de kosten van het prijspeil;

      c. op enig moment, voor zover sprake is van aanvullende activiteiten die wijziging van de subsidie naar het oordeel
      van de minister rechtvaardigen.

      3 Indien de subsidie wordt gewijzigd, rekening houdend met de ontwikkeling van de kosten in de arbeidsvoorwaarden
      of de kosten van het prijspeil, bepaalt de minister welk percentage van de subsidie wordt aangemerkt als
      loongevoelig onderscheidenlijk prijsgevoelig.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.10
  - number: '2.11'
    text: |-
      1 De minister betaalt als voorschot per kwartaal een gelijk deel van het subsidiebedrag dat aan een instelling
      is verleend.

      2 Een kwartaal als bedoeld in het eerste lid is gelijk aan de periode van de eerste drie maanden, de tweede drie
      maanden, de derde drie maanden of de vierde drie maanden van een kalenderjaar.

      3 Indien de liquiditeitsbehoefte van de subsidieontvanger om een ander betaalritme vraagt, kan de minister in
      afwijking van het eerste lid een groter of kleiner deel van de subsidie als voorschot betalen in door hem te
      bepalen termijnen.

      4 De liquiditeitsbehoefte, bedoeld in het derde lid, volgt uit documenten van de aanvrager, dan wel wordt
      ambtshalve vastgesteld door de minister.

      5 Indien de subsidie wordt gewijzigd op grond van [artikel 2.10, eerste of tweede lid][ref1], wordt de
      bevoorschotting overeenkomstig de wijziging aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2.10
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '2.10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '2.12'
    text: |-
      De subsidieontvanger zorgt ervoor dat de werkzaamheden op een zodanige manier worden uitgevoerd dat de subsidie op
      doelmatige wijze wordt gebruikt voor de doeleinden waarvoor deze wordt verleend.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.12
  - number: '2.13'
    text: |-
      1 De subsidieontvanger stelt het boekjaar gelijk aan het kalenderjaar.

      2 De subsidieontvanger voert een zodanig ingerichte administratie dat daaruit te allen tijde de voor de
      vaststelling van de subsidie van belang zijnde rechten en verplichtingen evenals de baten en lasten kunnen worden
      nagegaan.

      3 De subsidieontvanger bewaart de administratie en de daartoe behorende documenten gedurende zeven jaren.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.13
  - number: '2.14'
    text: |-
      1 Indien gedurende de subsidieperiode aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de
      werkelijke baten en lasten en de begrote baten en lasten, doet de subsidieontvanger daarvan onverwijld mededeling
      aan de minister onder vermelding van de oorzaak van de verschillen.

      2 De subsidieontvanger doet onverwijld een melding aan de minister van feiten en omstandigheden die van belang
      kunnen zijn voor de subsidieverstrekking. Bij de melding worden de stukken overgelegd die betrekking hebben op de
      gemelde feiten en omstandigheden en wordt de oorzaak van de gemelde feiten en omstandigheden toegelicht.

      3 Aan het tweede lid wordt in ieder geval toepassing gegeven indien het voor de subsidieontvanger aannemelijk is of
      had moeten zijn dat:

      a. de activiteiten waarvoor de subsidie is verleend niet, niet tijdig of niet geheel zijn verricht of zullen worden
      verricht, of

      b. niet of niet geheel aan de subsidieverplichtingen wordt voldaan of zal worden voldaan.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.14
  - number: '2.15'
    text: |-
      1 De subsidieontvanger dient na het eerste, tweede en derde jaar van de periode waarvoor subsidie is verleend, over
      het betreffende jaar, uiterlijk op 30 april van het daaropvolgende jaar een bestuursverslag, een jaarrekening en
      een beknopt kwantitatief activiteitenoverzicht in.

      2 Het bestuursverslag geeft in ieder geval toelichting op:

      a. het exploitatieresultaat van de subsidieontvanger;

      b. de financiële positie van de subsidieontvanger, waarbij tevens wordt ingegaan op het beleggingsbeleid, voor
      zover de instelling of de gelieerde instelling beleggingen heeft; en

      c. het al dan niet realiseren van de voorgenomen activiteiten.

      3 Voorts bevat het bestuursverslag een beknopte inzichtelijke kwalitatieve beschrijving van de verrichte
      activiteiten in het afgelopen jaar.

      4 Het beknopte kwantitatieve activiteitenoverzicht heeft betrekking op de activiteiten die zijn verricht in het
      jaar waarop het bestuursverslag betrekking heeft.

      5 Op het bestuursverslag en het beknopte kwantitatieve activiteitenoverzicht is [artikel 2.28][ref1] van
      toepassing. Het bestuur van de subsidieontvanger ondertekent het bestuursverslag.

      6 Op de jaarrekening zijn de [artikelen 2.26][ref2], [2.27][ref3] en [2.28][ref4] van toepassing.

      7 In afwijking van het eerste lid dient de ontvanger van een subsidie die wordt verstrekt op grond van
      [artikel 3.29][ref5], na het eerste, tweede en derde jaar van de periode waarvoor subsidie is verleend, over het
      betreffende jaar, uiterlijk op 30 april van het daarop volgende jaar een activiteitenverslag en een financieel
      verslag in. De [artikelen 5.11, derde lid][ref6], en [5.12][ref7] zijn van overeenkomstige toepassing.

      8 De indiening van de stukken, bedoeld in het eerste lid, geschiedt op een door de minister te bepalen
      elektronische wijze en conform de voorschriften van de handboeken verantwoording cultuursubsidies die de minister
      op [www.cultuursubsidie.nl](http://www.cultuursubsidie.nl/) beschikbaar heeft gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2.28
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel2.26
      [ref3]: https://wetten.overheid.nl/BWBR0027597#Artikel2.27
      [ref4]: https://wetten.overheid.nl/BWBR0027597#Artikel2.28
      [ref5]: https://wetten.overheid.nl/BWBR0027597#Artikel3.29
      [ref6]: https://wetten.overheid.nl/BWBR0027597#Artikel5.11
      [ref7]: https://wetten.overheid.nl/BWBR0027597#Artikel5.12
