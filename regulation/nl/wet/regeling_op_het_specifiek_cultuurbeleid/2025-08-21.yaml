  - number: '3.11'
    text: |-
      1 Indien in de navolgende afdelingen een maximum is gesteld aan het aantal instellingen waaraan per regio of
      kernpunt subsidie kan worden verstrekt, en geen van de subsidieaanvragen die is ingediend voor die regio of dat
      kernpunt voldoet aan alle daarvoor in deze regeling gestelde vereisten, kan de minister niettemin aan ten hoogste
      het voor de betreffende regio of kernpunt gestelde aantal instellingen subsidie verstrekken, voor zover het met
      deze regeling te dienen doel van geografische spreiding naar zijn oordeel in onvoldoende mate zou worden bereikt
      ingeval van het niet verstrekken van subsidie.

      2 Het eerste lid vindt in ieder geval geen toepassing, voor zover een aanvraag naar het oordeel van de minister in
      onvoldoende mate beantwoordt aan het criterium, bedoeld in [artikel 3.9, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel3.9
