  - number: '3.17'
    text: |-
      De minister kan subsidie verstrekken aan ten hoogste één instelling met als kernactiviteiten het begeleiden van
      operaproducties en het verzorgen van symfonisch aanbod, indien de instelling:

      a. voldoet aan [artikel 3.16, eerste lid, onderdelen a en d][ref1];

      b. in aanvulling op haar activiteiten een relevante seizoensprogrammering aanbiedt van symfonische concerten in het
      verzorgingsgebied van de gemeente Haarlem; en

      c. ten minste zes maal per jaar om niet beschikbaar is voor de begeleiding van een productie van een instelling die
      een subsidie ontvangt op grond van [artikel 3.22][ref2].


