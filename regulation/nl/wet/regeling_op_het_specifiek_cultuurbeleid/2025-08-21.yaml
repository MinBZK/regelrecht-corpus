  - number: '2.16'
    text: |-
      1 Voor zover het bedrag van een verleende subsidie na uitvoering van de gesubsidieerde activiteiten overeenkomstig
      het bepaalde in deze regeling niet is besteed aan de doeleinden waarvoor de subsidie is verstrekt, kan het worden
      gereserveerd. De aldus gereserveerde middelen kunnen uitsluitend worden besteed aan de doeleinden waarvoor de
      subsidie werd verstrekt.

      2 De minister kan voor een of meer subsidieontvangers of voor een categorie subsidieontvangers een maximaal
      percentage van de verleende subsidie of een maximaal bedrag vaststellen waarboven het totaal van de reservering,
      bedoeld in het eerste lid, niet uitkomt.

      3 Dit artikel is niet van toepassing op een subsidie aan een fonds.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.16
  - number: '2.17'
    text: |-
      1 In de gevallen, bedoeld in [artikel 4:41, tweede lid, van de Algemene wet bestuursrecht][ref1], is de
      subsidieontvanger aan de minister een door hem te bepalen vergoeding voor vermogensvorming verschuldigd.

      2 Bij de bepaling van de hoogte van de vergoeding wordt uitgegaan van de waarde van goederen en andere
      vermogensbestanddelen op het tijdstip waarop de vergoeding verschuldigd wordt, met dien verstande dat in geval
      van ontvangst van schadevergoeding voor verlies of beschadiging van zaken wordt uitgegaan van het bedrag dat als
      schadevergoeding door de subsidieontvanger wordt ontvangen. Indien het onroerende zaken betreft, geschiedt de
      waardebepaling door één of drie onafhankelijke deskundigen.

      3 Toepassing van het eerste lid blijft achterwege als de activiteiten van de subsidieontvanger, na toestemming van
      de minister, door een andere rechtspersoon worden voortgezet en de activa tegen boekwaarde aan die rechtspersoon in
      eigendom zijn overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel441
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:41
  - number: '2.18'
    text: |-
      1 De vergoeding die een subsidieontvanger betaalt aan een organisatie die zich de ondersteuning van één of meer
      instellingen die op grond van de [wet][ref1] subsidie ontvangen ten doel stelt, voor door die organisatie aan de
      subsidieontvanger ter beschikking gestelde goederen, is niet hoger dan het bedrag dat op grond van de historische
      kostprijs berekend wordt, rekening houdend met de geldende afschrijvingspercentages.

      2 De vergoeding die een subsidieontvanger betaalt aan een organisatie als bedoeld in het eerste lid voor door
      die organisatie aan de subsidieontvanger geleverde diensten, is als het diensten betreft die in het algemeen door
      soortgelijke instellingen als de subsidieontvanger in eigen beheer worden verricht, niet hoger dan het bedrag
      dat gelijk is aan de kosten die de subsidieontvanger zou hebben gehad bij het verrichten van de diensten in eigen
      beheer.

      3 De vergoeding die een subsidieontvanger betaalt aan een organisatie als bedoeld in het eerste lid voor door die
      organisatie aan de subsidieontvanger geleverde diensten, andere dan de in het tweede lid bedoelde diensten, is niet
      hoger dan het bedrag dat voor het doen verrichten van dergelijke diensten door andere organisaties gebruikelijk kan
      worden geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0005904
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0005904
  - number: '2.19'
    text: |-
      De subsidieontvanger die aan derden goederen ter beschikking stelt of voor derden diensten verricht, brengt
      daarvoor een vergoeding in rekening die ten minste kostendekkend is, tenzij het derden betreft voor wie de
      gesubsidieerde activiteiten bestemd zijn.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.19
  - number: '2.20'
    text: |-
      1 De subsidieontvanger werkt mee aan door of namens de minister ingestelde onderzoeken die erop zijn gericht de
      minister inlichtingen te verschaffen ten behoeve van de ontwikkeling van zijn beleid.

      2 Als bij de minister het vermoeden is gerezen dat [artikel 2.18][ref1] niet is nageleefd, spant de
      subsidieontvanger zich desgevraagd in de jaarrekening van de desbetreffende organisatie te overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2.18
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '2.18'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '2.21'
    text: |-
      1 Indien subsidie wordt verstrekt voor activiteiten op een terrein van cultuur waarvoor een code is vastgesteld,
      kan de minister bij de subsidieverlening bepalen dat de subsidieontvanger zich dient aan te sluiten bij de
      betreffende code.

      2 Onder een code als bedoeld in het eerste lid wordt verstaan een samenstel van afspraken opgesteld door of in
      samenwerking met vertegenwoordigers van instellingen op het betreffende terrein van cultuur.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.21
  - number: '2.22'
    text: |-
      1 Tussen acht en achttien weken na afloop van de subsidieperiode dient de subsidieontvanger een aanvraag tot
      vaststelling van de subsidie in.

      2 Aanvragen die worden ingediend voorafgaand aan de termijn, bedoeld in het eerste lid, worden geacht ontvangen te
      zijn op de eerste dag van die termijn.

      3 De indiening van een aanvraag, als bedoeld in het eerste lid, geschiedt op een door de minister te bepalen
      elektronische wijze en conform de voorschriften van de handboeken verantwoording cultuursubsidies die de minister
      op [www.cultuursubsidie.nl](http://www.cultuursubsidie.nl/) beschikbaar heeft gesteld.

      4 Het derde lid is niet van toepassing op instellingen die uitsluitend projectsubsidie ontvangen op grond van
      [artikel 1 van het Besluit op het specifiek cultuurbeleid][ref1] juncto [artikel 5.2, tweede lid][ref2], van deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0027600#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel5.2
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0027600
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0027597
        artikel: '5.2'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '2.23'
    text: |-
      1 De aanvraag tot vaststelling van de subsidie gaat vergezeld van een bestuursverslag, een jaarrekening en een
      beknopt kwantitatief activiteitenoverzicht als bedoeld in [artikel 2.15][ref1]. Het bestuursverslag geeft een
      toelichting op het vierde jaar van de subsidie.

      2 Op het bestuursverslag is [artikel 2.15, tweede, derde en vijfde lid][ref2], van overeenkomstige toepassing.

      3 Op het beknopte kwantitatieve activiteitenoverzicht is [artikel 2.15, vierde lid][ref3], van overeenkomstige
      toepassing.

      4 In afwijking van het eerste lid gaat de aanvraag tot vaststelling van een subsidie die wordt verstrekt op grond
      van [artikel 3.26][ref4], vergezeld van een activiteitenverslag en een financieel verslag over het vierde jaar
      van de periode waarvoor subsidie is verleend. De [artikelen 5.11, derde lid][ref5], en [5.12][ref6] zijn van
      overeenkomstige toepassing.


