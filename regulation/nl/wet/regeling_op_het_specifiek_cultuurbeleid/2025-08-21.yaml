  - number: '6.11'
    text: |-
      Deze regeling treedt in werking met ingang van 1 juli 2010, met uitzondering van [artikel 6.5, onderdeel C][ref1],
      dat in werking treedt met ingang van de eerste dag na de datum van uitgifte van de Staatscourant waarin de regeling
      wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel6.5
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel6.11
