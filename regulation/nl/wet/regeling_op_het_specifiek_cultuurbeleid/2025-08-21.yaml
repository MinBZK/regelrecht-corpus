  - number: '4.2'
    text: |-
      1 Uiterlijk op 31 januari in het jaar voorafgaand aan de aanvang van de subsidieperiode van vier kalenderjaren
      worden een begroting en een beleidsplan ingediend.

      2 Op de begroting is [artikel 2.5][ref1] van overeenkomstige toepassing.

      3 [Artikel 2.7][ref2] is van overeenkomstige toepassing bij de indiening van de begroting.

      4 Het beleidsplan wordt opgesteld aan de hand van het voor het desbetreffende fonds door de minister bekendgemaakte
      beleidskader.


