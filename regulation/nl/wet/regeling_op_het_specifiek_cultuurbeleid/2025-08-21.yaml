  - number: '3.36'
    text: |-
      1 De minister kan subsidie verstrekken aan ten hoogste één instelling met als kernactiviteit de presentatie van
      actueel of vernieuwend aanbod in een internationale context op het terrein van arthousefilms en aan ten hoogste één
      instelling met als kernactiviteit de presentatie van actueel of vernieuwend aanbod in een internationale context op
      het terrein van documentaires, indien:

      a. de instelling een beleid voert dat talentontwikkeling alsmede vernieuwing van en voor de filmsector bevordert;

      b. de activiteiten van de instelling:

      1°. een breed en divers publiek bereiken;

      2°. er mede op gericht zijn een platform te bieden voor internationale uitwisseling tussen vakgenoten;

      3°. jaarlijks of tweejaarlijks gedurende een in de tijd beperkte periode plaatsvinden; en

      4°. een aantoonbare impuls leveren aan het aanbod en de regionale spreiding van films in het commerciële en niet-
      commerciële bioscoopcircuit.

      2 De minister kan subsidie verstrekken aan ten hoogste één instelling met als kernactiviteit de presentatie van
      actueel of vernieuwend aanbod op het terrein van de Nederlandse film, indien:

      a. de instelling een beleid voert dat talentontwikkeling alsmede vernieuwing van en voor de filmsector bevordert;

      b. de activiteiten van de instelling:

      1°. een breed en divers publiek bereiken;

      2°. er mede op gericht zijn een platform te bieden voor uitwisseling tussen vakgenoten; en

      3°. jaarlijks of tweejaarlijks gedurende een in de tijd beperkte periode plaatsvinden.

      3 De minister kan subsidie verstrekken aan ten hoogste één instelling met als kernactiviteit de presentatie van
      actueel of vernieuwend aanbod op het terrein van de jeugdfilm, indien de activiteiten van de instelling voldoen aan
      de subonderdelen 1° tot en met 4° van onderdeel b van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.36
  - number: '3.37'
    text: |-
      De minister kan subsidie verstrekken aan ten hoogste één instelling met als kernactiviteit het verrichten van
      ondersteunende activiteiten op het terrein van de film, indien de activiteiten van de instelling gericht zijn op:

      a. het in samenwerking met relevante partners ontwikkelen en delen van kennis op het gebied van filmeducatie en
      mediawijsheid alsmede het verzorgen van een landelijke coördinatie en afstemming op deze terreinen;

      b. de internationale samenwerking en versterking van de internationale positie van de Nederlandse film en de
      Nederlandse filmsector, een en ander in:

      1°. samenwerking met stichting Nederlands Fonds voor de Film, door gezamenlijke beleidsvorming, uitvoering en
      verantwoording; en

      2°. afstemming met overige relevante partijen in de filmsector.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.37
  - number: '3.38'
