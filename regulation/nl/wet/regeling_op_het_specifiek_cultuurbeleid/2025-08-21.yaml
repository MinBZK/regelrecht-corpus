  - number: '2.28'
    text: |-
      De minister kan modellen vaststellen voor het bestuursverslag, de jaarrekening en het beknopte kwantitatieve
      activiteitenoverzicht. De modellen worden gepubliceerd op de website www.cultuursubsidie.nl.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel2.28
