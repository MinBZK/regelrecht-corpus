  - number: '3.12'
    text: |-
      1 De minister kan subsidie verstrekken aan een instelling met als kernactiviteit het verzorgen van
      theatervoorstellingen, indien de instelling:

      a. een substantieel deel van haar voorstellingen realiseert op een podium, dat meer dan 400 zitplaatsen heeft, in
      de regio of de gemeente waar de instelling haar standplaats heeft;

      b. haar activiteiten verspreid over het jaar realiseert;

      c. voor haar artistieke continuïteit niet afhankelijk is van één maker of een groep van makers van theater; en

      d. een beleid voert dat talentontwikkeling bevordert.

      2 De minister verstrekt op grond van het eerste lid aan ten hoogste vier grote instellingen in de kernpunten
      subsidie, waarvan ten hoogste twee instellingen hun standplaats hebben in de grote gemeenten, voor zover de
      instelling:

      a. per jaar gemiddeld twee producties bestemd voor een podium met meer dan 400 zitplaatsen uitvoert; en

      b. een beleid voert dat doorstroming van talent naar de grote zaal bevordert.

      3 De minister verstrekt op grond van het eerste lid aan ten hoogste vier middelgrote instellingen in de kernpunten
      subsidie, waarvan niet meer dan één instelling haar standplaats heeft in de grote gemeenten, voor zover de
      instelling ten minste per jaar één productie bestemd voor een podium met meer dan 400 zitplaatsen uitvoert.

      4 De minister kan op grond van het eerste lid subsidie verstrekken aan ten hoogste één instelling die haar
      standplaats heeft in de regio Noord en haar theatervoorstellingen in de Friese taal verzorgt.

      5 Per kernpunt verstrekt de minister op grond van dit artikel aan niet meer dan één instelling subsidie.
