  - number: '3.47'
    text: |-
      1 De minister kan subsidie verstrekken aan een instelling die als kernactiviteit heeft het faciliteren, begeleiden
      en ontwikkelen van talentvolle of innovatieve makers of het ontwikkelen, aan de hand van onderzoek, van een
      discipline op een terrein als bedoeld in [afdeling 3.2][ref1], [3.4][ref2], [3.5][ref3], [3.6][ref4] of [3.7][ref5]
      dan wel een combinatie daarvan, indien de instelling:

      a. beschikt over voorzieningen die daarvoor geschikt zijn; en

      b. haar activiteiten verspreid over het jaar realiseert.

      2 Een instelling als bedoeld in het eerste lid die zich uitsluitend of hoofdzakelijk richt op makers van
      podiumkunsten, komt slechts in aanmerking voor subsidie voor zover de instelling:

      a. de presentatie van de te verrichten activiteiten op een podium kan garanderen;

      b. voor haar artistieke continuïteit niet afhankelijk is van één of enkele artistiek leiders; en

      c. structureel samenwerkt met professionele podiumkunstinstellingen aan begeleiding en ontwikkeling.

      3 De minister verstrekt op grond van het eerste lid aan ten hoogste zestien instellingen subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Hoofdstuk3
