  - number: '3.27'
    text: |-
      1 De minister kan subsidie verstrekken aan een instelling met als kernactiviteit het verzorgen van repertoire op
      een of meerdere deelgebieden van de podiumkunsten voor de jeugd tot achttien jaar, indien de instelling:

      a. een substantieel deel van haar voorstellingen realiseert op een podium; en

      b. haar activiteiten verspreid over het jaar realiseert.

      2 De minister verstrekt op grond van het eerste lid aan ten hoogste dertien instellingen subsidie, waarbij in
      de regio Noord ten minste één, in de regio Zuid ten minste twee, in de regio Oost ten minste één, en in de regio
      Midden ten minste twee instellingen hun standplaats hebben.

      3 Aan een instelling waaraan subsidie wordt verstrekt op grond van [artikel 3.14, eerste lid][ref1], juncto
      [tweede lid, onderdeel c][ref2], verstrekt de minister geen subsidie op grond van het eerste lid.


