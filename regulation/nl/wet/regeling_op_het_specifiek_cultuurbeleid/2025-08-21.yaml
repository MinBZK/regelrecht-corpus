  - number: '3.42'
    text: |-
      De minister kan subsidie verstrekken aan ten hoogste één instelling met als kernactiviteit het verrichten van
      ondersteunende activiteiten op het terrein van ontwerp, indien de activiteiten van de instelling gericht zijn op:

      a. het in samenwerking met de ontwerpsector en andere relevante partijen bevorderen van culturele, maatschappelijke
      en economische meerwaarde van de ontwerpsector;

      b. het signaleren en agenderen van ontwikkelingen in de verschillende disciplines binnen de ontwerpsector, zowel
      binnen de daartoe behorende disciplines als discipline-overstijgend, en het verspreiden van kennis hierover, zowel
      binnen als buiten de ontwerpsector;

      c. de internationale samenwerking en versterking van de internationale positie van het Nederlands ontwerp en de
      Nederlandse ontwerpsector, een en ander in:

      1°. samenwerking met stichting Stimuleringsfonds Creatieve Industrie, door gezamenlijke beleidsvorming, uitvoering
      en verantwoording; en

      2°. afstemming met overige relevante partijen in de ontwerpsector;

      d. de invulling en organisatie van de architectuurbiënnale van Venetië en andere voorkomende statelijke
      manifestaties op het terrein van de ontwerpsector; en

      e. het vervullen van een netwerk- of platformfunctie voor sectorcollecties op het terrein van digitale cultuur en
      vormgeving, waarbij:

      1°. bewustwording, deskundigheidsbevordering en kennisdeling over behoud en beheer, ontsluiting en netwerkvorming
      worden gestimuleerd;

      2°. de sectorcollecties duurzaam digitaal verbonden en toegankelijk worden gemaakt volgens de uitgangspunten van de
      Nationale Strategie Digitaal Erfgoed; en

      3°. de activiteiten van de instelling afgestemd worden met die van relevante partijen, waaronder de instelling die
      subsidie ontvangt op grond van [artikel 3.51][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel3.51
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.42
    references:
      - id: ref1
