  - number: '3.23'
    text: |-
      1 De minister kan subsidie verstrekken aan ten hoogste één instelling die haar standplaats heeft in de regio Oost
      en met als kernactiviteit het verzorgen van opera-aanbod, indien de instelling:

      a. voldoet aan [artikel 3.22, onderdelen a en b][ref1];

      b. haar activiteiten geografisch op een geconcentreerde wijze spreidt; en

      c. een beleid voert dat, in samenwerking met de instelling, bedoeld in [artikel 3.22][ref2], en bij voorkeur in
      samenwerking met derden talentontwikkeling bevordert.

      2 De minister kan subsidie verstrekken aan ten hoogste één instelling die haar standplaats heeft in de regio Zuid
      en met als kernactiviteit het verzorgen van opera-aanbod, indien de instelling:

      a. voldoet aan [artikel 3.22, onderdeel a][ref3];

      b. haar activiteiten geografisch in haar regio op een geconcentreerde wijze spreidt;

      c. samenwerkt met andere instellingen die opera-aanbod verzorgen; en

      d. een beleid voert dat, in samenwerking met een instelling als bedoeld in [artikel 3.22][ref4], en bij voorkeur in
      samenwerking met derden talentontwikkeling bevordert.


