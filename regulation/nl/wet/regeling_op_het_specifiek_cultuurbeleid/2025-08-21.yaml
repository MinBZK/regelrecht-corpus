      2 De minister kan voorschriften verbinden aan het toevoegen of onttrekken van middelen aan het bestemmingsfonds
      OCW. Hij maakt deze bekend op de website www.cultuursubsidie.nl.

      3 Toevoegingen of onttrekkingen aan het bestemmingsfonds OCW worden toegelicht in de documenten, bedoeld in de
      [artikelen 2.15, eerste lid][ref1], en [2.22, eerste lid][ref2].

      4 Tegelijkertijd met de vaststelling van de subsidie neemt de minister een besluit over de besteding van het bedrag
      van het bestemmingsfonds OCW.

      5 In bijzondere gevallen kan bij beschikking worden afgeweken van de voorschriften, bedoeld in het tweede lid.


