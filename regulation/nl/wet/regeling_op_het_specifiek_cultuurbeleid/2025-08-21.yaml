      a. voor instellingen als bedoeld in [artikel 3.33][ref3]: in totaal € 4.784.100; en

      b. voor instellingen als bedoeld in [artikel 3.34][ref4]: in totaal € 7.009.800 en per deelnemer ten hoogste
      € 66.760.


