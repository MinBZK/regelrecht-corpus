  - number: '3.2'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *Brabantstad:* gemeente Breda, gemeente ’s-Hertogenbosch, gemeente Eindhoven, gemeente Helmond of gemeente
      Tilburg, dan wel een randgemeente daarvan, voor zover in de provincie Noord-Brabant gelegen;
        - *grote gemeente:* gemeente Amsterdam, gemeente Rotterdam of gemeente Den Haag;
        - *kernpunt:* gemeente Groningen, gemeente Arnhem, gemeente Utrecht, gemeente Maastricht, gemeente Den Haag,
      gemeente Rotterdam, gemeente Amsterdam of Brabantstad;
        - *ontwerp:* architectuur, digitale cultuur of vormgeving;
        - *ontwerpsector:* sector die zich bezighoudt met ontwerp;
        - *podium:* voorziening in een gebouw die bestemd of geschikt is voor de presentatie van podiumkunsten;
        - *regio Noord:* provincies Groningen, Friesland en Drenthe;
        - *regio Oost:* provincies Overijssel en Gelderland;
        - *regio Midden:* provincies Flevoland en Utrecht;
        - *regio Zuid:* provincies Zeeland, Noord-Brabant en Limburg;
        - *sectorcollectie:* voor het cultuurbestel relevante verzameling of archieven, niet zijnde museale cultuurgoederen
      van de Staat of andere cultuurgoederen als bedoeld in [artikel 2.8 van de Erfgoedwet][ref1];
        - *standplaats:* gemeente waar de instelling haar huisvesting heeft en in de lokale culturele infrastructuur is
      ingebed.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel2.8
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '2.8'
  - number: '3.3'
    text: |-
      In aanvulling op [artikel 2.3][ref1] gaat de subsidieaanvraag vergezeld van:

      a. een verklaring waaruit blijkt dat de instelling de Fair Practice Code, de Governance Code Cultuur, alsmede de
      Code Diversiteit en Inclusie onderschrijft;

      b. een verklaring waaruit blijkt dat de instelling zich met ingang van 1 januari 2025 zal aansluiten bij de
      bestaande collectieve afspraken over honorering binnen haar sector, dan wel, indien er in haar sector geen
      bestaande afspraken over honorering zijn, een verklaring waaruit blijkt welke honoreringsrichtlijn de instelling
      met ingang van 1 januari 2025 zal volgen; en

      c. een verklaring waaruit blijkt dat de instelling zich aansluit bij de sociale dialoog tussen werkgevers of
      opdrachtgevers en werknemers of opdrachtnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2.3
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '2.3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '3.4'
    text: |-
      In aanvulling op [artikel 2.4][ref1] bevat het activiteitenplan een omschrijving waaruit blijkt:

      a. op welke wijze de instelling de Code Diversiteit en Inclusie, de Fair Practice Code en de Governance Code
      Cultuur naleeft; en

      b. welke doelstellingen de instelling heeft om de implementatie van de Code Diversiteit en Inclusie, de Fair
      Practice Code en de Governance Code Cultuur binnen haar organisatie gedurende de subsidieperiode voort te zetten en
      welke stappen de instelling wil gaan zetten om deze doelstellingen te bereiken.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.4
