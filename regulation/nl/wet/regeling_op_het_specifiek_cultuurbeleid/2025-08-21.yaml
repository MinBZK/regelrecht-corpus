  - number: '3.25'
    text: |-
      1 De minister kan subsidie verstrekken aan een instelling met als kernactiviteit de presentatie van actueel of
      vernieuwend aanbod in internationale context primair op het terrein van de podiumkunsten, indien de activiteiten
      van de instelling:

      a. er mede op gericht zijn een platform te bieden voor internationale uitwisseling tussen vakgenoten of gericht
      zijn op het bevorderen van talentontwikkeling;

      b. jaarlijks of tweejaarlijks gedurende een in de tijd beperkte periode plaatsvinden; en

      c. niet aan te merken zijn als activiteiten van één specifieke schouwburg, concertzaal of andere instelling die
      zich primair richt op de presentatie van cultuuruitingen.

      2 De minister verstrekt op grond van het eerste lid aan ten hoogste negen instellingen subsidie, waarbij in de
      regio Midden, de regio Zuid en de regio Noord telkens ten minste twee instellingen hun standplaats hebben.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.25
  - number: '3.26'
    text: |-
      Voor subsidieverstrekking op grond van [artikel 3.25][ref1] is jaarlijks in totaal ten hoogste € 9.054.400
      beschikbaar.


