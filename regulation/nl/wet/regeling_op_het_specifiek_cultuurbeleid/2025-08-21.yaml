  - number: '3.22'
    text: |-
      De minister kan subsidie verstrekken aan ten hoogste één instelling die haar standplaats in een kernpunt heeft en
      met als kernactiviteit het verzorgen van grootschalig opera-aanbod, indien de instelling:

      a. een breed repertoire aanbiedt;

      b. zich richt op een groot landelijk publieksbereik;

      c. een beleid voert dat, in samenwerking met de instellingen, bedoeld in [artikel 3.23][ref1], en bij voorkeur in
      samenwerking met derden talentontwikkeling bevordert en coördinerende activiteiten op dit gebied uitvoert; en

      d. zich internationaal onderscheidt door een excellent uitvoeringsniveau.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel3.23
