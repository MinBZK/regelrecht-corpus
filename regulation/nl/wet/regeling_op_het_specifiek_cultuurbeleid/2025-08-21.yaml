  - number: '3.9'
    text: |-
      1 De minister beoordeelt de aanvragen op basis van het ingediende activiteitenplan en het functioneren van de
      aanvrager aan de hand van de volgende criteria:

      a. artistieke of inhoudelijke kwaliteit;

      b. maatschappelijke betekenis;

      c. toegankelijkheid;

      d. bedrijfsmatige gezondheid; en

      e. geografische spreiding.

      2 In afwijking van het eerste lid beoordeelt de minister de aanvragen voor subsidie op grond van afdeling 3.9
      op basis van het ingediende activiteitenplan en het functioneren van de aanvrager aan de hand van de volgende
      criteria:

      a. inhoudelijke kwaliteit;

      b. relevantie voor de doelgroep;

      c. wendbaarheid;

      d. bedrijfsmatige gezondheid; en

      e. geografische spreiding in relatie tot de opdracht.

      3 Indien de minister een aanvraag als onvoldoende beoordeelt op ten minste één van de criteria, bedoeld in het
      eerste lid, onderdelen a tot en met d, onderscheidenlijk het tweede lid, onderdelen a tot en met d, wijst de
      minister de aanvraag af.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.9
  - number: '3.10'
    text: |-
      1 Indien meerdere aanvragen zijn ingediend die subsidiabel
      worden geacht op basis van de beoordelingscriteria, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____, terwijl het desbetreffende subsidieplafond niet toereikend is om alle daarvoor in aanmerking komende
      aanvragen te kunnen toewijzen, worden de desbetreffende aanvragen gerangschikt aan de hand van het criterium,
      bedoeld in artikel 3.9, eerste lid, onderdeel e, onderscheidenlijk tweede lid, onderdeel e.

      2 Indien met toepassing van het eerste lid niet kan worden gekomen tot een rangschikking van twee of meer van
      de desbetreffende aanvragen, worden deze aanvragen gerangschikt aan de hand van een integrale afweging van de
      beoordelingscriteria, bedoeld in [artikel 3.9][ref2], alsmede de volgende aspecten:

      a. pluriformiteit; en

      b. nieuwe disciplines en genres.

      3 Indien met toepassing van het tweede lid eveneens niet een rangschikking van de desbetreffende aanvragen kan
      worden bepaald, bepaalt de minister de rangschikking tussen de desbetreffende aanvragen door loting.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel3.9
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel3.9
