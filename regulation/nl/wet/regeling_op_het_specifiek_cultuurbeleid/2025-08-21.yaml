      b. voor een instelling als bedoeld in [artikel 3.12, derde en vierde lid][ref3]: € 2.022.500.

      2 In afwijking van het eerste lid, onderdeel a, is ten hoogste 110 procent van het daar genoemde bedrag beschikbaar
