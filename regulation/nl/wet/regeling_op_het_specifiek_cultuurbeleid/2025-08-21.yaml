  - number: '5.4'
    text: |-
      1 De minister beslist binnen 13 weken na ontvangst van de aanvraag.

      2 De termijn, genoemd in het eerste lid, bedraagt 22 weken, indien de minister over de aanvraag advies inwint
      of een nader onderzoek naar de aanvraag instelt. Indien toepassing wordt gegeven aan de vorige volzin, doet de
      minister hiervan mededeling aan de aanvrager.

      3 Een beschikking tot subsidieverlening vermeldt de activiteiten waarvoor subsidie wordt verleend, het
      subsidiebedrag en de datum waarop de activiteiten uiterlijk zijn afgerond.

      4 Indien de minister op een aanvraag als bedoeld in [artikel 5.3, zevende lid][ref1], beslist tot
      subsidieverstrekking, stelt hij de subsidie zonder voorafgaande verlening vast.

      5 In gevallen waarbij de minister besluit tot subsidieverstrekking zonder daarvoor een financiële of inhoudelijke
      verantwoording noodzakelijk te achten, kan hij, onverminderd het vierde lid, de subsidie zonder voorafgaande
      verlening vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel5.3
