  - number: '3.8'
    text: |-
      1 Onverminderd [artikel 2.9][ref1] en [artikel 4:35 van de Algemene wet bestuursrecht][ref2] wordt
      subsidieverlening in ieder geval geweigerd, voor zover de aanvraag niet voldoet aan het bepaalde in de
      [artikelen 3.3][ref3] en [3.4][ref4].

      2 Onverminderd [artikel 2.9][ref5] en [artikel 4:35 van de Algemene wet bestuursrecht][ref6] wordt
      subsidieverlening tevens geweigerd, indien de aanvrager een instelling is waaraan voor het jaar 2023 subsidie is
      verstrekt voor haar exploitatie en subsidie uitsluitend is verstrekt afkomstig uit middelen van de begrotingsstaat,
      met uitzondering van de artikelen 14 en 15, behorende bij de Wet van 21 december 2022 tot vaststelling van de
      begrotingsstaten van het Ministerie van Onderwijs, Cultuur en Wetenschap (VIII) voor het jaar 2023 (Stb. 2023, 19).

      3 Onverminderd [artikel 2.9][ref7] en [artikel 4:35 van de Algemene wet bestuursrecht][ref8] kan subsidie
      worden geweigerd, indien de activiteiten waarvoor de subsidie is aangevraagd naar het oordeel van de minister
      onlosmakelijk verbonden zijn met de kernactiviteiten van de instelling waarvoor deze in de periode 2025–2028
      meerjarige subsidie van een fonds ontvangt.

      4 Onverminderd [artikel 4:48 van de Algemene wet bestuursrecht][ref9] kan de minister een reeds op grond van dit
      hoofdstuk verleende subsidie intrekken, indien de subsidieontvanger zich niet met ingang van 1 januari 2025 heeft
      aangesloten bij de in [artikel 3.3, onderdeel b][ref10], bedoelde collectieve afspraken, onderscheidenlijk de in
      dat onderdeel bedoelde honoreringsrichtlijn.


