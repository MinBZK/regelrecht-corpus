  - number: '5.8'
    text: |-
      1 Indien een gesubsidieerd project leidt tot een publicatie, draagt de subsidieontvanger er zorg voor dat bij de
      publicatie wordt aangegeven wie de uitvoerder en de subsidieverstrekker van het project zijn geweest.

      2 Indien de subsidie gericht is of mede gericht is op de totstandkoming van een werk als bedoeld in
      [artikel 10, onder 1, van de Auteurswet][ref1], draagt de subsidieontvanger er zorg voor auteursrechthebbende te
      zijn ter zake van dat werk.

      3 De subsidieontvanger vrijwaart de Staat der Nederlanden voor aanspraken van derden ter zake van alle schade die
      zij lijden ten gevolge van de door of vanwege de subsidieontvanger verrichte publicaties.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
  - number: '5.9'
    text: |-
      1 Dit artikel is slechts van toepassing op een ontvanger van een subsidie die minder dan € 25.000 bedraagt.

      2 Op verzoek van de minister toont de subsidieontvanger aan dat de activiteiten waarvoor de subsidie is verleend,
      zijn verricht en dat is voldaan aan de aan de subsidie verbonden verplichtingen. De subsidieontvanger toont dit
      zoveel mogelijk aan de hand van concrete en meetbare eenheden aan.

      3 De subsidieontvanger doet onverwijld een melding aan de minister, indien aannemelijk is dat:

      a. de activiteiten waarvoor de subsidie is verleend, niet voor de datum, bedoeld in [artikel 5.4, derde lid][ref1],
      zijn verricht; of

      b. voor de datum, bedoeld in [artikel 5.4, derde lid][ref2], niet of niet geheel aan de aan de subsidie verbonden
      verplichtingen zal worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel5.4
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel5.4
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel5.9
    references:
