  - number: '3.43'
    text: |-
      1 De minister kan subsidie verstrekken aan een instelling met als kernactiviteit het ontwikkelen van presentaties
      op het gebied van design en technologie van nationaal of internationaal belang, in combinatie met het aanbieden van
      een programmering rond actuele maatschappelijk vraagstukken, onder andere aan de hand van:

      a. onderzoek;

      b. experiment;

      c. debat en reflectie; en

      d. het samenbrengen van relevante partijen binnen de ontwerpsector.

      2 De minister verstrekt op grond van het eerste lid subsidie aan ten hoogste twee instellingen, waarvan ten minste
      één haar standplaats heeft in één van de regio’s.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.43
  - number: '3.44'
    text: |-
      De minister kan subsidie verstrekken aan ten hoogste één instelling met als kernactiviteit de presentatie van
      actueel of vernieuwend aanbod in internationale context specifiek op het terrein van design, indien de activiteiten
      van de instelling:

      a. er mede op gericht zijn een platform te bieden voor internationale uitwisseling tussen vakgenoten; en

      b. jaarlijks of tweejaarlijks gedurende een in de tijd beperkte periode plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.44
  - number: '3.45'
    text: |-
      1 De minister kan subsidie verstrekken aan een instelling met als kernactiviteit de presentatie van actueel of
      vernieuwend aanbod in internationale context op het terrein van ontwerp of beeldende kunst, dan wel binnen een
      combinatie van de disciplines behorende tot de ontwerpsector of sector beeldende kunst, indien de activiteiten van
      de instelling:

      a. er mede op gericht zijn een platform te bieden voor internationale uitwisseling tussen vakgenoten;

      b. jaarlijks of tweejaarlijks gedurende een in de tijd beperkte periode plaatsvinden.

      2 De minister verstrekt op grond van het eerste lid aan ten hoogste drie instellingen subsidie.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.45
  - number: '3.46'
    text: |-
      Voor subsidieverstrekking op grond van de [artikelen 3.42 tot en met 3.45][ref1] zijn jaarlijks ten hoogste de
      volgende bedragen beschikbaar:

      a. voor een instelling als bedoeld in [artikel 3.42][ref2]: € 1.937.300;

