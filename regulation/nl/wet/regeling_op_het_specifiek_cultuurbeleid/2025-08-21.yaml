  - number: '3.29'
    text: |-
      1 Aan een instelling met als kernactiviteit het beheer en behoud van een gemeentelijke of provinciale collectie
      van cultureel erfgoed van nationaal of internationaal belang kan de minister, op enkelvoudige voordracht van
      gedeputeerde staten van de provincie waar de instelling haar standplaats heeft, subsidie verstrekken voor het
      uitvoeren van publieksactiviteiten die verband houden met de collectie, voor zover deze aanvullend zijn op de
      activiteiten waarvoor subsidie door overige bestuursorganen wordt verstrekt.

      2 De minister verstrekt op grond van het eerste lid aan ten hoogste één instelling per provincie subsidie.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.29
  - number: '3.30'
    text: |-
      De minister kan subsidie verstrekken aan ten hoogste één instelling ten behoeve van het beheer, behoud en de
      ontsluiting van sectorcollecties op het terrein van de podiumkunsten en de vormgeving, indien:

      a. de minister daarvoor in het verleden subsidie heeft verstrekt;

      b. nadien voor een vergelijkbaar doeleinde niet door andere bestuursorganen financiële middelen beschikbaar zijn
      gesteld; en

      c. voor zover het gaat om digitale collecties, deze duurzaam verbonden en toegankelijk worden gemaakt volgens de
      uitgangspunten van de Nationale Strategie Digitaal Erfgoed.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.30
  - number: '3.31'
    text: |-
      De minister kan subsidie verstrekken aan ten hoogste één instelling waarvan de activiteiten zijn gericht op
      het vervullen van twee netwerk- of platformfuncties voor sectorcollecties op het terrein van theater en dans
      onderscheidenlijk muziek, waarbij:

      a. bewustwording, deskundigheidsbevordering en kennisdeling over behoud en beheer, ontsluiting en netwerkvorming
      worden gestimuleerd;

      b. de sectorcollecties in samenwerking met een instelling als bedoeld in [artikel 3.51][ref1] duurzaam digitaal
      verbonden en toegankelijk worden gemaakt volgens de uitgangspunten van de Nationale Strategie Digitaal Erfgoed; en

      c. de activiteiten van de instelling afgestemd worden met die van relevante partijen, waaronder de instelling die
      subsidie ontvangt op grond van [artikel 3.51][ref2] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel3.51
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel3.51
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.31
