      1 De minister kan subsidie verstrekken aan een instelling die haar standplaats in een grote gemeente of een regio
      heeft en als kernactiviteit heeft de presentatie van een vernieuwend aanbod van hedendaagse beeldende kunst in een
      internationale context, indien de instelling:

      a. beschikt over een ruimte die geschikt is voor het tonen van de presentaties;

      b. haar activiteiten verspreid over het jaar realiseert;

      c. een toonaangevende programmering verzorgt;

      d. voor haar artistieke continuïteit niet afhankelijk is van één of enkele artistiek leiders; en

      e. niet overwegend gericht is op het beheer van een collectie van cultureel erfgoed.

      2 De minister verstrekt op grond van het eerste lid aan ten hoogste zes instellingen subsidie.

      3 Op grond van dit artikel wordt aan ten hoogste één instelling per grote gemeente subsidie verstrekt.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.33
  - number: '3.34'
    text: |-
      1 De minister kan subsidie verstrekken aan een instelling met als kernactiviteit het verzorgen van een
      begeleidingsprogramma op het terrein van beeldende kunst, dat een vervolg is op een bachelor- of masteropleiding
      op het gebied van de kunst, indien de instelling een internationaal toonaangevend programma verzorgt en ten minste
      tien deelnemers begeleidt.

      2 De minister verstrekt op grond van het eerste lid aan ten hoogste vijf instellingen subsidie.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.34
  - number: '3.35'
    text: |-
