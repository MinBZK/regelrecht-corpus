  - number: '2.27'
    text: |-
      1 De jaarrekening is voorzien van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref1].

      2 In de verklaring, bedoeld in het eerste lid, doet de accountant een uitspraak over de naleving van de
      subsidiebepalingen door de subsidieontvanger overeenkomstig de controleprotocollen gepubliceerd op de website
      www.cultuursubsidie.nl met gebruikmaking van de daarbij opgenomen modellen voor accountantsverklaringen.


