  - number: '3.1'
    text: |-
      De artikelen van dit hoofdstuk zijn uitsluitend van toepassing op de verstrekking van
      subsidies op grond van [artikel 4a van de wet][ref1], niet zijnde een subsidie als bedoeld in
      [artikel 3.14 van de Regeling beheer rijkscollectie en subsidiëring museale instellingen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0037533#Artikel3.14
