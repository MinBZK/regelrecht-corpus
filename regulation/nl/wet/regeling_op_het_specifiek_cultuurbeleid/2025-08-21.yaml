        paragraaf: '5.3'
  - number: '5.10'
    text: |-
      1 De ontvanger van een subsidie die € 25.000 of meer bedraagt, dient binnen 18 weken na de datum, bedoeld in
      [artikel 5.4, derde lid][ref1], een aanvraag tot vaststelling van de subsidie in.

      2 In afwijking van het eerste lid kan een subsidieontvanger die tevens een subsidie op grond van artikel 4a of 4c
      van de wet ontvangt ervoor kiezen, een aanvraag tot vaststelling in te dienen door verantwoording af te leggen in:

      a. de periodieke verslaglegging, bedoeld in [artikel 2.15][ref2], indien de activiteiten waarvoor subsidie
      is verleend dienen te zijn afgerond in het eerste, tweede of derde jaar van de vierjaarsperiode, bedoeld in
      [artikel 4a][ref3] en [4c van de wet][ref4]; of

      b. de aanvraag tot vaststelling, bedoeld in [artikel 2.22][ref5], indien de activiteiten waarvoor subsidie is
      verleend dienen te zijn afgerond in het laatste jaar van de vierjaarsperiode, bedoeld in [artikel 4a][ref6] en
      [4c van de wet][ref7], voor zover de verantwoording van de subsidie daarin voldoende inzichtelijk is.

      3 In afwijking van het eerste lid en onverminderd het tweede lid, kan de minister bij de subsidieverlening bepalen
      dat de ontvanger van een subsidie die twee of meer jaren bestrijkt, jaarlijks voor een in de beschikking tot
      verlening van de subsidie op te nemen datum een aanvraag tot vaststelling indient.


