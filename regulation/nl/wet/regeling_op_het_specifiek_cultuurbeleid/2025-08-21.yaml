  - number: '3.14'
    text: |-
      1 De minister kan subsidie verstrekken aan een instelling die haar standplaats in een kernpunt heeft en met als
      kernactiviteit het verzorgen van dansrepertoire, indien de instelling:

      a. een substantieel deel van haar voorstellingen realiseert op een podium, dat meer dan 400 zitplaatsen heeft in de
      regio of de gemeente waar de instelling haar standplaats heeft;

      b. haar activiteiten verspreid over het jaar realiseert;

      c. voor haar artistieke continuïteit niet afhankelijk is van één maker of een groep van makers van dans; en

      d. een beleid voert dat talentontwikkeling bevordert.

      2 De minister verstrekt op grond van het eerste lid aan ten hoogste vijf instellingen, waarvan:

      a. één instelling voorziet in een voor Nederland onderscheidend grootschalig repertoire op het gebied van ballet in
      een internationale context en zich richt op een groot landelijk publieksbereik;

      b. één instelling voorziet in de verzorging van grootschalig, onderscheidend modern dansaanbod in een
      internationale context;

      c. één instelling voorziet in de productie en distributie van grootschalig, onderscheidend dansaanbod en in de
      productie en distributie van jeugddans; en

      d. twee instellingen die voorzien in de productie en distributie van grootschalig, onderscheidend dansaanbod.

      3 Per kernpunt verstrekt de minister op grond van dit artikel aan niet meer dan één instelling subsidie.
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel3.14
