  - number: '5.11'
    text: |-
      1 De aanvraag tot vaststelling van de subsidie gaat vergezeld van een activiteitenverslag of bestuursverslag.

      2 Indien de subsidie € 125.000 of meer bedraagt, gaat de aanvraag tot vaststelling van de subsidie tevens vergezeld
      van een jaarrekening of financieel verslag.

      3 Het activiteitenverslag beschrijft de aard, duur en omvang van de activiteiten waarvoor subsidie werd verleend.
      De minister kan een model vaststellen voor het activiteitenverslag op de website www.cultuursubsidie.nl.

      4 Op het bestuursverslag is [artikel 2.15, tweede, derde en vijfde lid][ref1], van overeenkomstige toepassing.

      5 Op de jaarrekening zijn de [artikelen 2.26][ref2], met uitzondering van het vierde lid, en
      [2.27, eerste en tweede lid][ref3], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2.15
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel2.26
      [ref3]: https://wetten.overheid.nl/BWBR0027597#Artikel2.27
    url: https://wetten.overheid.nl/BWBR0027597/2025-08-21#Artikel5.11
