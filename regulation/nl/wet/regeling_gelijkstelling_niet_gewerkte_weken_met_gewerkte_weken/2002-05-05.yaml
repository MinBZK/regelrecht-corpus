  - number: '2'
    text: |-
      Indien een schadeloosstelling, schadevergoeding of betaling, als bedoeld in
      [artikel 1, eerste lid, onderdeel b, c, d of e][ref1] niet over bepaalde weken is berekend, bepaalt het
      Uitvoeringsinstituut werknemersverzekeringen op welke weken deze betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004070#Artikel1
    url: https://wetten.overheid.nl/BWBR0004070/2002-05-05#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004070
        artikel: '1'
  - number: '4'
    text: |-
      1 Voor de vaststelling van het aantal weken, waarin als werknemer arbeid is verricht, als bedoeld in
      [artikel 17, onderdeel a, van de Werkloosheidswet][ref1], worden weken meer dan één keer in aanmerking genomen
      indien:

      a. zich tijdens een recht op uitkering opnieuw werkloosheid, als bedoeld in
      [artikel 16 van de Werkloosheidswet][ref2], voordoet; of

      b. een recht op uitkering geheel of gedeeltelijk is geëindigd en zich vervolgens opnieuw werkloosheid, als
      bedoeld in [artikel 16 van de Werkloosheidswet][ref3], voordoet, voor zover op dat moment het totale verlies van
      arbeidsuren groter is dan het verlies van arbeidsuren op het moment, waarop het eerstgenoemde recht is ontstaan.

      2 Het eerste lid is niet van toepassing in gevallen, waarin het recht op uitkering geheel of gedeeltelijk is
      geëindigd en zich vervolgens opnieuw werkloosheid, als bedoeld in [artikel 16 van de Werkloosheidswet][ref4]
      voordoet, indien:

      a. de werknemer op het moment, waarop het geheel of gedeeltelijk geëindigde recht ontstond, al zijn arbeidsuren in
      dienstbetrekking had verloren; of

      b. het aantal resterende arbeidsuren in dienstbetrekking op het moment, waarop zich opnieuw werkloosheid voordoet,
      gelijk is aan danwel groter is dan het aantal resterende arbeidsuren in dienstbetrekking op het moment, waarop het
      geheel of gedeeltelijk geëindigde recht ontstond.


