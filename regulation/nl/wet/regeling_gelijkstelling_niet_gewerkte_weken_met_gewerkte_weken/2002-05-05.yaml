preamble:
  text: |-
    Overwegende, dat het wenselijk is regels te stellen over het gelijkstellen van weken, waarin geen arbeid is
    verricht in de dienstbetrekking, waaruit de werknemer werkloos is geworden, met weken, als bedoeld in artikel 17,
    eerste lid, van de Werkloosheidswet;

    Overwegende voorts, dat het wenselijk is regels te stellen over het meer keren in aanmerking nemen van weken,
    waarin arbeid is verricht;

    Gelet op artikel 17, vijfde lid, van de Werkloosheidswet (Stb. 1986, 566);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004070/2002-05-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Met weken, waarin als werknemer arbeid is verricht, als bedoeld in
      [artikel 17, onderdeel a, van de Werkloosheidswet][ref1] worden gelijkgesteld:

      a. weken, waarvoor de werknemer zonder te werken loon heeft ontvangen;

      b. weken, waarin de werknemer niet heeft gewerkt als gevolg van vakantie-, snipper-, of compensatieverlofdagen,
      voor zover hij voor die dagen geen loon, maar een schadeloosstelling wegens loonderving heeft ontvangen, of een
      aanspraak hierop heeft verkregen;

      c. weken, waarin de werknemer niet heeft gewerkt als gevolg van feestdagen, voor zover hij voor die dagen geen
      loon, maar een schadeloosstelling wegens loonderving heeft ontvangen;

      d. weken, waarin de werknemer niet heeft gewerkt en waarvoor hij schadeloosstelling of schadevergoeding wegens het
      beëindigen van de dienstbetrekking heeft ontvangen;

      e. weken, waarin de werknemer niet heeft gewerkt en waarvoor hij een betaling heeft ontvangen wegens niet-genoten
      compensatie, - of periodiek verlof bij de beëindiging van de dienstbetrekking;

      f. weken, waarin de werknemer niet heeft gewerkt als gevolg van ploegendienst of andere vormen van werkroosters;

      g. weken, waarin de werknemer niet heeft gewerkt als gevolg van een regeling tot toepassing van een kortere dan de
      normale werktijd;

      h. weken, waarin de werknemer niet heeft gewerkt en waarvoor hij een uitkering op grond van een
      vorstuitkeringsreglement danwel een uitkering op grond van [artikel 18 van de Werkloosheidswet][ref2] heeft
      ontvangen;

      i. weken, waarin de werknemer niet heeft gewerkt en waarover hij recht op uitkering op grond van
      [hoofdstuk IV van de Werkloosheidswet][ref3] heeft;

      j. weken, waarin de werknemer niet heeft gewerkt als gevolg van een verplichte bedrijfssluiting en waarvoor de
      werknemer geen loon of inkomsten wegens loonderving danwel vakantiebonnen of daarmee overeenkomende aanspraken
      heeft ontvangen of verkregen;

      k. weken, onmiddellijk voorafgaand aan het intreden van werkloosheid als bedoeld in
      [artikel 16 van de Werkloosheidswet][ref4], waarin de werknemer niet heeft gewerkt maar door de toepassing
      van [artikel 4b van de Regeling gelijkstelling niet-gewerkte uren met gewerkte uren][ref5] geen relevant
      arbeidsurenverlies heeft geleden, indien de werknemer op de eerste dag van die laatste periode waarin niet is
      gewerkt voldaan zou hebben aan de wekeneis als bedoeld in [artikel 17, onderdeel a, van de Werkloosheidswet][ref6]
      of [artikel 58, eerste lid, onder deel a, van de Wet werk en inkomen naar arbeidsvermogen][ref7].


