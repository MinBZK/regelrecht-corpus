      1 Het model van de bemanningslijst, bedoeld in [artikel 4.11, eerste lid onder a, van het Besluit][ref1] is
      opgenomen in [bijlage 14a][ref2] en [14b][ref3] bij deze regeling. Op de bemanningslijst worden de gegevens
      verstrekt omtrent de familienaam, voornamen, rang, nationaliteit, geboortedatum en geboorteplaats, van zowel de
      gezagvoerder als van alle bij het binnenvaren van Nederland aan boord aanwezige personen die deel uitmaken van de
      bemanning en als zodanig op de monsterrol voorkomen.

      2 Voor schepen die zijn gecertificeerd voor het vervoer van ten hoogste twaalf passagiers wordt de schriftelijke
      opgave, bedoeld in [artikel 4.11, eerste lid onder b, van het Besluit][ref4], verstrekt met het model van de
      passagierslijst, opgenomen in [bijlage 14c][ref5] en [14d][ref6] bij deze regeling.


