  - number: 3.18c
    text: |-
      1 Voor de erkenning van een onderzoeksinstelling als bedoeld in [artikel 3.18b, onder c][ref1], kan een aanvraag
      worden ingediend bij het loket kennis- en arbeidsmigratie van de Immigratie- en Naturalisatiedienst.

      2 De aanvraag wordt ingewilligd, indien:

      a. de onderzoeksinstelling is opgenomen in het National Academic Research and Collaborations Information System; of

      b. de onderzoeksinstelling in het bezit is van een ten name van de instelling afgegeven S&O-verklaring als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________, welke verklaring betrekking heeft op ten minste een deel van het lopende of het vorige kalenderjaar,
      mits het door de instelling verrichte onderzoek naar het oordeel van Onze Minister van voldoende wetenschappelijk
      niveau is.

      3 De erkenning, bedoeld in [artikel 3.18b, onder c][ref3], geldt voor ten minste vijf jaren.

      4 De publicatie van de erkenning, bedoeld in [artikel 3.18b, onder c][ref4], vindt plaats op de website van de
      Immigratie- en Naturalisatiedienst.

      5 De erkenning, bedoeld in [artikel 3.18b, onder c][ref5], kan worden geweigerd indien:

      a. de aanvraag niet is gedaan overeenkomstig de terzake geldende procedures;

      b. de aanvraag niet is gebaseerd op de wettelijke opdracht of het maatschappelijk doel van de onderzoeksinstelling
      en het bewijs dat zij zich met onderzoeksactiviteiten bezig houdt;

      6 De erkenning, van een onderzoekinstelling, bedoeld in [artikel 3.18b, onder c][ref6], kan worden ingetrokken of
      de verlenging van de erkenning kan worden geweigerd, indien:

      a. de erkenning op frauduleuze wijze is verkregen;

      b. een onderzoeksinstelling op frauduleuze of nalatige wijze een gastovereenkomst heeft gesloten; of

      c. niet langer wordt voldaan aan de voorwaarden voor erkenning.


