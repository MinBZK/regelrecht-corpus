        artikel: '29'
  - number: 3.37d
    text: |-
      1 Bij de beoordeling of een vreemdeling op grond van [artikel 29, eerste lid, onder a of b, van de Wet][ref1]
      in aanmerking komt voor een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28 van die wet][ref2]
      geldt dat een vreemdeling geen behoefte heeft aan bescherming, indien er in een deel van het land
      van herkomst geen gegronde vrees voor vervolging in de zin van het Vluchtelingenverdrag en geen reëel
      risico op folteringen, onmenselijke of vernederende behandelingen of bestraffingen als bedoeld in
      [artikel 29, eerste lid, onder b, van de Wet][ref3] bestaat en van de vreemdeling redelijkerwijs kan worden
      verwacht dat hij in dat deel van het land verblijft.

      2 Bij de beoordeling of een deel van het land van herkomst aan de in het eerste lid genoemde voorwaarden
      voldoet, wordt rekening gehouden met de algemene omstandigheden in dat deel van het land en met de persoonlijke
      omstandigheden van de vreemdeling op het tijdstip waarop een beslissing inzake de aanvraag wordt genomen.

      3 Het eerste lid kan van toepassing zijn ondanks het bestaan van technische belemmeringen om terug te keren naar
      het land van herkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel3.37d
