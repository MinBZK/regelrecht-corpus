        artikel: '6'
  - number: '3.1'
    text: |-
      1 Als document waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder a tot en met d, van de Wet][ref1],
      blijkt, zijn aangewezen de volgende documenten, waarbij het vastgestelde model van dat document wordt aangegeven:

      a. voor vreemdelingen met rechtmatig verblijf als bedoeld in [artikel 8, onder a, van de Wet][ref2]: het document I
      van het model dat als [bijlage 7a][ref3] bij deze regeling is gevoegd;

      b. voor vreemdelingen met rechtmatig verblijf als bedoeld in [artikel 8, onder b, van de Wet][ref4]: het document
      II van het model dat als [bijlage 7b][ref5] bij deze regeling is gevoegd;

      c. voor vreemdelingen met rechtmatig verblijf als bedoeld in [artikel 8, onder c, van de Wet][ref6]: het document
      III van het model dat als [bijlage 7c][ref7] bij deze regeling is gevoegd, en

      d. voor vreemdelingen met rechtmatig verblijf als bedoeld in [artikel 8, onder d, van de Wet][ref8]: het document
      IV van het model dat als [bijlage 7d][ref9] bij deze regeling is gevoegd.

      2 De beperking waaronder de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref10],
      wordt verleend, wordt vermeld op het document, bedoeld in het eerste lid, onder a.

      3 Op het document, bedoeld in het eerste lid, onder b en d, wordt de aantekening gesteld ‘arbeid vrij toegestaan;
      TWV niet vereist’. Op het document, bedoeld in het eerste lid, onder a en c, wordt de aantekening gesteld:

      a. ‘arbeid vrij toegestaan; TWV niet vereist’;

      b. ‘arbeid uitsluitend toegestaan indien werkgever beschikt over TWV’;

      c. ‘specifieke arbeid toegestaan mits werkgever beschikt over TWV; andere arbeid niet toegestaan’;

      d. ‘arbeid niet toegestaan’;

      e. ‘arbeid toegestaan, TWV alleen gedurende eerste twaalf maanden vereist’;

      f. ‘TWV niet vereist. Andere arbeid niet toegestaan’;

      g. ‘arbeid in loondienst alleen toegestaan indien werkgever beschikt over TWV’;

      h. ‘andere arbeid alleen toegestaan indien werkgever beschikt over TWV’; of

      i. ‘arbeid niet toegestaan met uitzondering van arbeid van bijkomende aard. TWV vereist’.

      4 Op het document wordt de aantekening 'beroep op publieke middelen kan gevolgen hebben voor verblijfsrecht'
      gesteld, indien de verblijfsvergunning is verleend:

      a. onder één van de beperkingen, bedoeld in [artikel 3.4, vierde lid, van het Besluit][ref11];

      b. op grond van het Nederlands-Duits Vestigingsverdrag (Stb. 1906, 279);

      c. op grond van het Nederlands-Zwitsers Tractaat (Stb. 1878, nr. 137);

      d. op grond van het Nederlands-Amerikaans Vriendschapsverdrag (Trb. 1956, 40), of

      e. op grond van de Associatieverdragen EG met Roemenië (PbEG 1994, L 357) en Bulgarije (PbEG 1994, L 358).

      5 De documenten, bedoeld in het eerste lid, zijn ingevolge
      [artikel 4.21, eerste lid, onder a, van het Besluit][ref12] tevens vastgesteld als document ter vaststelling van de
      identiteit, nationaliteit en verblijfsrechtelijke positie van vreemdelingen met rechtmatig verblijf als bedoeld in
      [artikel 8, onder a tot en met d, van de Wet][ref13].


