    text: |-
      Als de landen, bedoeld in de [artikelen 3.21][ref1], [3.23, vierde lid, onder c][ref2],
      [3.31, tweede lid, onder d][ref3], en [3.79, tweede lid, van het Besluit][ref4], zijn aangewezen:

      a. de staten die partij zijn bij het [Verdrag tot oprichting van de Europese Gemeenschap](onbekend);

      b. de staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte, en

      c. Australië, Canada, Israël, Japan, Monaco, Nieuw Zeeland, Suriname, de Verenigde Staten van Amerika, en
      Zwitserland.


