  - number: '3.36'
    text: |-
      1 Daden van vervolging in de zin van artikel 1A van het Vluchtelingenverdrag moeten:

      a. zo ernstig van aard zijn of zo vaak voorkomen dat zij een ernstige schending vormen van de grondrechten van de
      mens, met name de rechten ten aanzien waarvan geen afwijking mogelijk is uit hoofde van artikel 15, tweede lid, van
      het EVRM; of

      b. een samenstel zijn van verschillende maatregelen, waaronder mensenrechtenschendingen, die voldoende ernstig zijn
      om iemand op een soortgelijke wijze te treffen als omschreven onder a.

      2 Daden van vervolging in de zin van het eerste lid kunnen onder meer de vorm aannemen van:

      a. daden van lichamelijk of geestelijk geweld, inclusief seksueel geweld;

      b. wettelijke, administratieve, politiële of gerechtelijke maatregelen die op zichzelf discriminerend zijn of op
      discriminerende wijze worden uitgevoerd;

      c. onevenredige of discriminerende vervolging of bestraffing;

      d. ontneming van de toegang tot rechtsmiddelen, waardoor een onevenredig zware of discriminerende straf wordt
      opgelegd;

      e. vervolging of bestraffing wegens de weigering militaire dienst te vervullen tijdens een conflict, wanneer
      het vervullen van militaire dienst strafbare feiten of handelingen inhoudt die onder de uitsluitingsclausule van
      artikel 1F van het Vluchtelingenverdrag vallen;

      f. daden van genderspecifieke of kindspecifieke aard.
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel3.36
  - number: '3.37'
    text: |-
      1 Bij de beoordeling van de gronden van vervolging in de zin van het Vluchtelingenverdrag wordt rekening gehouden
      met de volgende elementen:

      a. het begrip «ras» omvat met name de aspecten huidskleur, afkomst of het behoren tot een bepaalde etnische groep;

      b. het begrip «godsdienst» omvat met name theïstische, niet-theïstische en atheïstische geloofsovertuigingen, het
      deelnemen aan of het zich onthouden van formele erediensten in de particuliere of openbare sfeer, hetzij alleen
      of in gemeenschap met anderen, andere religieuze activiteiten of uitingen, dan wel vormen van persoonlijk of
      gemeenschappelijk gedrag die op een godsdienstige overtuiging zijn gebaseerd of daardoor worden bepaald;

      c. het begrip «nationaliteit» is niet beperkt tot staatsburgerschap of het ontbreken daarvan, maar omvat met name
      ook het behoren tot een groep die wordt bepaald door haar culturele, etnische of linguïstische identiteit, door een
      gemeenschappelijke geografische of politieke oorsprong of door verwantschap met de bevolking van een andere staat;

      d. een groep wordt geacht een specifieke sociale groep te vormen als met name:

      1°. leden van de groep een aangeboren kenmerk vertonen of een gemeenschappelijke achtergrond hebben die niet
      gewijzigd kan worden, of een kenmerk of geloof delen dat voor de identiteit of de morele integriteit van de
      betrokkenen dermate fundamenteel is, dat van de betrokkenen niet mag worden geëist dat zij dit opgeven, en

      2°. de groep in het betrokken land een eigen identiteit heeft, omdat zij in haar directe omgeving als afwijkend
      wordt beschouwd;

      e. het begrip «politieke overtuiging» houdt met name in dat de vreemdeling een opvatting, gedachte of mening heeft
      betreffende een aangelegenheid die verband houdt met de in [artikel 3.37a][ref1] genoemde actoren en hun beleid
      of methoden, ongeacht of de vreemdeling zich in zijn handelen door deze opvatting, gedachte of mening heeft laten
      leiden.

      2 Bij de beoordeling of de vrees van de vreemdeling voor vervolging in de zin van het Vluchtelingenverdrag gegrond
      is, doet het niet terzake of de vreemdeling in werkelijkheid de raciale, godsdienstige, nationale, sociale of
      politieke kenmerken vertoont die aanleiding geven tot de vervolging indien deze kenmerken hem door de actor van de
      vervolging worden toegeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel3.37a
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel3.37
