        artikel: '20'
  - number: 3.33c
    text: |-
      1 De aanvraag:

      a. tot het verlenen of wijzigen van een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref1];

      b. tot het verlenen van een verblijfsvergunning als bedoeld in [artikel 20 van de Wet][ref2], door de vreemdeling
      die in aanmerking komt voor de terugkeeroptie op grond van de [Remigratiewet][ref3], of

      c. om toetsing aan het gemeenschapsrecht,

      wordt door de vreemdeling in persoon ingediend.

      2 In afwijking van het eerste lid, onder a, wordt de aanvraag als bedoeld in [artikel 3.33a, derde lid][ref4],
      van deze regeling, de aanvraag verband houdend met verblijf als kennismigrant of de aanvraag verband
      houdend met verblijf als onderzoeker in de zin van de richtlijn 2005/71/EG ingediend door tussenkomst van de
      onderwijsinstelling, onderscheidenlijk de werkgever die een verklaring als bedoeld in [bijlage 12a][ref5] heeft
      ondertekend of de onderzoeksinstelling.

      3 De aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref6], onder een
      beperking verband houdend met verblijf als au pair wordt in afwijking van het eerste lid, onder a, ingediend door
      tussenkomst van het au pair bureau, indien:

      a. de Minister met dat au pair bureau een daartoe strekkend convenant heeft gesloten, en

      b. de vreemdeling in het bezit is van een geldige machtiging tot voorlopig verblijf die overeenkomt
      met het verblijfsdoel waarvoor de verblijfsvergunning is aangevraagd of behoort tot een der in
      [artikel 17 van de Wet][ref7] of [artikel 3.71, tweede lid, van het Besluit][ref8] bedoelde categorieën.

      4 De aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref9], onder een
      beperking verband houdend met het verrichten van arbeid in loondienst, het verrichten van arbeid als geestelijk
      voorganger of godsdienstleraar, het volgen van studie, verblijf in het kader van uitwisseling of verblijf op
      grond van [artikel 3.4, derde lid, van het Besluit][ref10] in het kader van de pilot religieus verblijf, wordt
      in afwijking van het eerste lid, onder a, ingediend door tussenkomst van de religieuze of levensbeschouwelijke
      organisatie, indien:

      a. de Minister aan de religieuze of levensbeschouwelijke organisatie toestemming heeft verleend voor deelname aan
      de pilot religieus verblijf, en

      b. de vreemdeling in het bezit is van een geldige machtiging tot voorlopig verblijf die overeenkomt
      met het verblijfsdoel waarvoor de verblijfsvergunning is aangevraagd of behoort tot een der in
      [artikel 17 van de Wet][ref11] of [artikel 3.71, tweede lid, van het Besluit][ref12] bedoelde categorieën.


