  - number: 3.34e
    text: |-
      In afwijking van [artikel 3.34d][ref1] is de vreemdeling geen leges verschuldigd ter zake van de afdoening van een
      aanvraag tot het verlengen van een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref2], indien:

      a. deze aanvraag gelijktijdig is ontvangen met een aanvraag tot het wijzigen van een verblijfsvergunning als
      bedoeld in [artikel 3.34c, eerste lid][ref3], tenzij deze aanvragen zijn ontvangen een jaar of langer voordat de
      geldigheidsduur van de vergunning afloopt;

      b. deze aanvraag gelijktijdig is ontvangen met een aanvraag tot het verlenen van een verblijfsvergunning voor
      onbepaalde tijd als bedoeld in [artikel 3.34g][ref4], tenzij deze aanvragen zijn ontvangen een jaar of langer
      voordat de geldigheidsduur van de vergunning afloopt;

      c. de vreemdeling in aanmerking komt voor verlenging van de geldigheidsduur van de
      verblijfsvergunning, bedoeld in [artikel 14 van de Wet][ref5], voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder m of s, van het Besluit][ref6];

      d. het minderjarige kind van de vreemdeling, die verblijf heeft op grond van
      [artikel 3.4, eerste lid, onder s, van het Besluit][ref7], een aanvraag indient tot het verlengen van een
      verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref8], voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder a, van het Besluit][ref9];

      e. de vreemdeling aan wie een verblijfsvergunning is verleend op grond van een schriftelijke verklaring
      van de Minister als bedoeld in [artikel 14 van de Wet][ref10], voor een ander verblijfsdoel dan genoemd in
      [artikel 3.4, eerste lid, van het Besluit][ref11] en die in aanmerking komt voor verlenging van de geldigheidsduur
      van de verblijfsvergunning;

      f. aan de vreemdeling een verblijfsvergunning is verleend in het kader van verblijf als gezinslid van een militair
      verbonden aan een hier te lande gevestigd internationaal militair hoofdkwartier (Joint Force Command-headquarters)
      onder de beperking ‘conform beschikking Staatssecretaris’;

      g. de vreemdeling in aanmerking komt voor verlenging van de geldigheidsduur van de verblijfsvergunning die is
      verleend in het kader van dreigend eergerelateerd geweld onder de beperking ‘conform beschikking Staatssecretaris’;

      h. de vreemdeling in aanmerking komt voor verlenging van de geldigheidsduur van de verblijfsvergunning die, in
      het kader van verblijf als slachtoffer van mensenhandel, is verleend onder de beperking ‘conform beschikking
      Staatssecretaris’;

      i. de vreemdeling in aanmerking komt voor verlenging van de geldigheidsduur van de verblijfsvergunning die, het
      kader van huiselijk geweld is verleend onder de beperking ‘conform beschikking Staatssecretaris’;

      j. de vreemdeling in aanmerking komt voor verlenging van de geldigheidsduur van de verblijfsvergunning als bedoeld
      in [artikel van 14 van de Wet][ref12], onder een beperking verband houdend met gezinshereniging voor verblijf bij
      een vreemdeling aan wie in het kader van dreigend eergerelateerd geweld, verblijf als slachtoffer mensenhandel of
      huiselijk geweld, een verblijfsvergunning is verleend onder de beperking ‘conform beschikking Staatssecretaris’.


