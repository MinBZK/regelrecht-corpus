      1 Ter zake van de afgifte van een document waaruit het rechtmatig verblijf, bedoeld in
      [artikel 8, onder a of b, van de Wet][ref1] blijkt, aan de minderjarige vreemdeling en voor de eerste keer een
      zelfstandig verblijfsdocument aanvraagt, is de vreemdeling een bedrag van € 100 verschuldigd.

      2 Ter zake van de afgifte van een document waaruit het rechtmatig verblijf, bedoeld in
      [artikel 8, onder e, van de Wet][ref2] blijkt, is de minderjarige vreemdeling een bedrag van € 40 verschuldigd.

      3 In afwijking van het eerste lid is de minderjarige vreemdeling die het gezinslid is van een vreemdeling als
      bedoeld in [onderdeel c van artikel 3.34j][ref3] een bedrag van € 40 verschuldigd.


