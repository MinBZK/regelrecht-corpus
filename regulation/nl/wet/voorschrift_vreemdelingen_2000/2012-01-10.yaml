  - number: 3.34c
    text: |-
      1 Ter zake van de afdoening van een aanvraag tot het wijzigen van de verblijfsvergunning, bedoeld in
      [artikel 14 van de Wet][ref1], is de vreemdeling een bedrag van € 600 verschuldigd, met uitzondering van de
      vreemdeling indien hij:

      a. een aanvraag indient tot het wijzigen van de verblijfsvergunning, in een verblijfsvergunning
      als bedoeld in [artikel 14 van de Wet][ref2], voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder b, c, e, g, r, t, u, v en w en derde lid, van het Besluit][ref3], met uitzondering
      van het verblijfsdoel ‘verblijf gedurende zoekjaar afgestudeerde’ en het verblijfsdoel ‘verblijf gedurende zoekjaar
      hoogopgeleide’, ter zake van de afdoening waarvan een bedrag van € 950 is verschuldigd;

      b. een aanvraag indient tot het wijzigen van de verblijfsvergunning, in een verblijfsvergunning
      als bedoeld in [artikel 14 van de Wet][ref4], voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder a of d, van het Besluit][ref5], ter zake van de afdoening waarvan een bedrag van €
      1250 is verschuldigd;

      c. ter zake van de afdoening van een gelijktijdig met de aanvraag van de hoofdpersoon
      tot het wijzigen van een verblijfsvergunning voor een ander verblijfsdoel dan bedoeld in
      [artikel 3.4, eerste lid, onder a, van het Besluit][ref6], ingediende aanvraag tot het wijzigen van een
      verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref7], voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder a, van het Besluit][ref8], voor verblijf bij die hoofdpersoon, een bedrag van € 250
      is verschuldigd;

      d. ter zake van de afdoening van een gelijktijdig met de aanvraag van een vreemdeling tot het wijzigen van
      een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref9], voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder a, van het Besluit][ref10], die daarvoor € 1250 is verschuldigd, ingediende
      aanvraag tot het wijzigen van een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref11], voor een
      verblijfsdoel als bedoeld in [artikel 3.4, eerste lid, onder a, van het Besluit][ref12], een bedrag van € 250 is
      verschuldigd;

      e. een aanvraag indient tot het wijzigen van de verblijfsvergunning in een verblijfsvergunning
      als bedoeld in [artikel 14 van de Wet][ref13], voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder y of cc, van het Besluit][ref14], ter zake van de afdoening waarvan een bedrag van
      € 750 is verschuldigd.

      2 In afwijking van het eerste lid is de vreemdeling een bedrag van € 60 verschuldigd die:

      a. werknemer is op een mijnbouwinstallatie op het continentaal plat en een aanvraag tot het wijzigen van een
      verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref15] doet, voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder j, van het Besluit][ref16];

      b. werkzaamheden als bedoeld in artikel 40, eerste lid, van het op 7 juni 2007 te ’s-Gravenhage tot stand gekomen
      Zetelverdrag tussen het Internationaal Strafhof en het Gastland (Trb. 2007, 25) verricht en een aanvraag tot het
      wijzigen van een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref17] doet, voor het verblijfsdoel
      ‘verblijf in het kader van zetelovereenkomst’ op grond van [artikel 3.4, derde lid, van het Besluit][ref18];

      c. met het oog op het verrichten van de in de voorlaatste alinea van de brief van 21 december 2007 van de
      Permanente Vertegenwoordiging van het Koninkrijk der Nederlanden bij de Verenigde Naties, behorend bij het op 21
      december 2007 te New York tot stand gekomen Verdrag tussen het Koninkrijk der Nederlanden en de Verenigde Naties
      betreffende de Zetel van het Speciale Tribunaal voor Libanon (Trb. 2007, 228) een aanvraag tot het wijzigen van
      een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref19] doet voor het verblijfsdoel ‘verblijf in het
      kader van zetelovereenkomst’ op grond van [artikel 3.4, derde lid, van het Besluit][ref20].

      3 In afwijking van het eerste lid is de vreemdeling een bedrag van € 350 verschuldigd die:

      a. een aanvraag indient tot het wijzigen van de verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref21],
      in het kader van dreigend eergerelateerd geweld, onder de beperking ‘conform beschikking Minister‘, in een
      verblijfsvergunning als bedoeld in artikel 14 van de Wet, in het kader van dreigend eergerelateerd geweld, voor een
      verblijfsdoel als bedoeld in [artikel 3.4, eerste lid, onder u, van het Besluit][ref22];

      b. een aanvraag indient tot het wijzigen van de verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref23],
      in het kader van verblijf als slachtoffer mensenhandel, onder de beperking ‘conform beschikking Minister’ of onder
      de beperking als bedoeld in [artikel 3.4, eerste lid, onder s, van het Besluit][ref24], in een verblijfsvergunning
      als bedoeld in artikel 14 van de Wet, in het kader van verblijf als slachtoffer mensenhandel, voor een
      verblijfsdoel als bedoeld in artikel 3.4, eerste lid, onder u, van het Besluit;

      c. een aanvraag indient tot het wijzigen van de verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref25],
      in het kader van huiselijk geweld, onder de beperking ‘conform beschikking Minister’, in een verblijfsvergunning
      als bedoeld in artikel 14 van de Wet, in het kader van huiselijk geweld, voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder u, van het Besluit][ref26];

      d. een aanvraag indient tot het wijzigen van de verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref27],
      onder de beperking, bedoeld in [artikel 3.4, eerste lid, onder a, van het Besluit][ref28], in een
      verblijfsvergunning als bedoeld in artikel 14 van de Wet, in het kader van een verbroken relatie wegens ondervonden
      huiselijk geweld of eergerelateerd geweld, voor een verblijfsdoel als bedoeld in artikel 3.4, eerste lid, onder u,
      van het Besluit;

      e. als minderjarige vreemdeling een aanvraag indient tot het wijzigen van de verblijfsvergunning
      als bedoeld in [artikel 14 van de Wet][ref29], onder de beperking, bedoeld in
      [artikel 3.4, eerste lid, onder a, van het Besluit][ref30], in een verblijfsvergunning als bedoeld in artikel 14
      van de Wet, in het kader van ondervonden huiselijk geweld of eergerelateerd geweld, voor een verblijfsdoel als
      bedoeld in artikel 3.4, eerste lid, onder u, van het Besluit;

      f. een aanvraag indient tot het wijzigen van de verblijfsvergunning, in een verblijfsvergunning als bedoeld
      in [artikel 14 van de Wet][ref31], in het kader van achterlating, voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder u, van het Besluit][ref32].

      4 In afwijking van het eerste lid is de vreemdeling van Turkse nationaliteit en aan wie het verrichten van arbeid
      in loondienst is toegestaan ter zake van de afdoening van een aanvraag tot het wijzigen van een verblijfsvergunning
      als bedoeld in [artikel 14 van de Wet][ref33] op basis waarvan het verrichten van arbeid is toegestaan een bedrag
      van € 40 verschuldigd.

      5 In afwijking van het eerste lid is het gezinslid van een vreemdeling als bedoeld in het derde lid,
      ter zake van de afdoening van een aanvraag tot het wijzigen van een verblijfsvergunning als bedoeld in
      [artikel 14 van de Wet][ref34] een bedrag van € 40 verschuldigd.


