  - number: '7.1'
    text: |-
      1 Het bestuursorgaan of orgaan als bedoeld in [artikel 107 van de Wet][ref1], dat de Minister met toepassing van
      [artikel 8.1, derde lid, van het Besluit][ref2] vraagt om onverwijld nadere gegevens over de verblijfsrechtelijke
      positie van de vreemdeling te verstrekken, maakt daarvoor gebruik van het formulier van het in [bijlage 17a][ref3]
      bij deze regeling aangeduide model. Op dit formulier wordt tevens aangegeven om welke reden onduidelijkheid bestaat
      over de verblijfsrechtelijke positie van de vreemdeling.

      2 De verstrekking van de nadere gegevens over de verblijfsrechtelijke positie van een vreemdeling aan de
      in het eerste lid bedoelde bestuursorgaan, vindt plaats door gebruikmaking van het formulier van het in
      [bijlage 17b][ref4] bij deze regeling aangeduide model.

      3 Bij het vragen van gegevens omtrent de toekenning of beëindiging van een verstrekking, voorziening,
      uitkering, ontheffing of vergunning bij het in het eerste lid bedoelde bestuursorgaan of orgaan op grond
      van [artikel 8.2, eerste lid, van het Besluit][ref5], wordt gebruik gemaakt van het formulier van het in
      [bijlage 17c][ref6] van deze regeling aangeduide model.

      4 Het in het eerste lid bedoelde bestuursorgaan of orgaan dat de Minister desgevraagd of uit eigen beweging op
      grond van [artikel 8.2, tweede of derde lid, van het Besluit][ref7], gegevens verstrekt omtrent de toekenning of
      beëindiging van een verstrekking, voorziening, uitkering, ontheffing of vergunning, maakt daarvoor gebruik van het
      formulier van het in [bijlage 17d][ref8] bij deze regeling aangeduide model.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
