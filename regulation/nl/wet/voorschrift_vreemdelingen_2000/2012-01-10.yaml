        artikel: '4.51'
  - number: '4.15'
    text: |-
      1 Indien met toepassing van [artikel 54, tweede lid, van de Wet][ref1] een individuele verplichting tot
      periodieke aanmelding is opgelegd, wordt de aantekening gesteld 'Verplichting tot periodieke aanmelding krachtens
      [artikel 54, tweede lid, Vreemdelingenwet 2000][ref2]', aangevuld met de periode van aanmelding en eventuele
      bijzonderheden.

      2 Indien de verplichting, bedoeld in [54, tweede lid, van de Wet][ref3], wordt opgeheven, wordt de aantekening
      gesteld: 'Verplichting tot periodieke aanmelding opgeheven op (datum)'.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel54
