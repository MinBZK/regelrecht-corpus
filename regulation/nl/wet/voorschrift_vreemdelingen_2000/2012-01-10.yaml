  - number: '3.35'
    text: |-
      1 De beoordeling of een vreemdeling op grond van [artikel 29, eerste lid, onder a dan wel b, van de Wet][ref1] in
      aanmerking komt voor een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28 van de Wet][ref2] vindt
      plaats op individuele basis en houdt onder meer rekening met:

      a. alle relevante feiten in verband met het land van herkomst op het tijdstip waarop een beslissing inzake de
      aanvraag wordt genomen met inbegrip van wettelijke en bestuursrechtelijke bepalingen van het land van herkomst en
      de wijze waarop deze worden toegepast;

      b. de door de vreemdeling afgelegde verklaring en overgelegde documenten, samen met informatie over de vraag
      of de vreemdeling is blootgesteld, dan wel blootgesteld zou kunnen worden aan vervolging in de zin van het
      Vluchtelingenverdrag, dan wel aan folteringen, onmenselijke of vernederende behandelingen of bestraffingen als
      bedoeld in [artikel 29, eerste lid, onder b, van de Wet][ref3];

      c. de individuele situatie en persoonlijke omstandigheden van de vreemdeling, waartoe factoren behoren zoals
      achtergrond, geslacht en leeftijd, teneinde te beoordelen of op basis van de persoonlijke omstandigheden van de
      vreemdeling, de daden waaraan hij blootgesteld is of blootgesteld zou kunnen worden, overeenkomen met vervolging
      in de zin van het Vluchtelingenverdrag, dan wel aan folteringen, onmenselijke of vernederende behandelingen of
      bestraffingen als bedoeld in [artikel 29, eerste lid, onder b, van de Wet][ref4];

      d. de vraag of zijn activiteiten, sedert hij zijn land heeft verlaten, uitsluitend ten doel hadden de nodige
      voorwaarden te scheppen om een aanvraag te kunnen indienen, teneinde na te gaan of de vreemdeling, in geval
      van terugkeer naar dat land, door die activiteiten zal worden blootgesteld aan vervolging in de zin van het
      Vluchtelingenverdrag, dan wel aan folteringen, onmenselijke of vernederende behandelingen of bestraffingen als
      bedoeld in [artikel 29, eerste lid, onder b, van de Wet][ref5];

      e. de vraag of in redelijkheid kan worden verwacht dat de vreemdeling zich onder de bescherming kan stellen van een
      ander land waar hij zich op zijn staatsburgerschap kan beroepen.

      2 Het feit dat de vreemdeling in het verleden reeds is blootgesteld aan vervolging in de zin van het
      Vluchtelingenverdrag, dan wel aan folteringen, onmenselijke of vernederende behandelingen of bestraffingen als
      bedoeld in [artikel 29, eerste lid, onder b, van de Wet][ref6], of dat hij hiermee rechtstreeks is bedreigd, is
      een duidelijke aanwijzing dat de vrees van de vreemdeling voor vervolging in de zin van het Vluchtelingenverdrag
      gegrond is en het risico om te worden onderworpen aan folteringen, onmenselijke of vernederende behandelingen of
      bestraffingen als bedoeld in [artikel 29, eerste lid, onder b, van de Wet][ref7] reëel is, tenzij er goede redenen
      zijn om aan te nemen dat die vervolging of folteringen, onmenselijke of vernederende behandelingen of bestraffingen
      als bedoeld in [artikel 29, eerste lid, onder b, van de Wet][ref8] zich niet opnieuw zullen voordoen.

      3 Indien de vreemdeling zijn verklaringen of een deel van zijn verklaringen niet met documenten kan onderbouwen,
      worden deze verklaringen geloofwaardig geacht en wordt de vreemdeling het voordeel van de twijfel gegund, wanneer
      aan de volgende voorwaarden is voldaan:

      a. de vreemdeling heeft een oprechte inspanning geleverd om zijn aanvraag te staven;

      b. alle relevante gegevens, als bedoeld in [artikel 3.111, eerste lid van het Besluit][ref9], waarover de
      vreemdeling beschikt, zijn overgelegd, of er is een bevredigende verklaring gegeven omtrent het ontbreken van
      relevante gegevens;

      c. de verklaringen van de vreemdeling zijn samenhangend en aannemelijk bevonden en zijn niet in strijd met
      beschikbare algemene en specifieke informatie die relevant is voor zijn aanvraag;

      d. de vreemdeling heeft zijn aanvraag zo spoedig mogelijk ingediend, tenzij hij goede redenen kan aanvoeren waarom
      hij dit heeft nagelaten; en

      e. vast is komen te staan dat de vreemdeling in grote lijnen als geloofwaardig kan worden beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel29
