    text: |-
      1 Het model van de bemanningslijst, bedoeld in [artikel 4.15, eerste lid, onder a, van het Besluit][ref1], is
      opgenomen in [bijlage 15][ref2] bij deze regeling.

      2 Het model van de passagierslijst, bedoeld in [artikel 4.15, eerste lid, onder a, van het Besluit][ref3], is
      opgenomen in [bijlage 16][ref4] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4.15
