    text: |-
      1 Ter zake van de afdoening van een aanvraag om toetsing aan het gemeenschapsrecht en afgifte van het daaraan
      verbonden verblijfsdocument, is de vreemdeling een bedrag van € 40 verschuldigd.

      2 Onverminderd [artikel 3.34, vierde en vijfde lid][ref1], [artikel 3.34c, derde en vierde lid][ref2],
      [artikel 3.34d, tweede en derde lid][ref3] en [artikel 3.34g, derde en vierde lid][ref4], is de vreemdeling
      die valt onder artikel 41, eerste lid, van het op 23 november 1970 te Brussel tot stand gekomen Aanvullend
      Protocol bij de op 12 september 1963 te Ankara gesloten Overeenkomst waarbij een associatie tot stand wordt
      gebracht tussen de Europese Economische Gemeenschap en Turkije (Trb. 1971, 70) of artikel 6, 7 of 13 van het
      Besluit 1/80 van de Associatieraad EEG-Turkije betreffende de ontwikkeling van de Associatie, ter zake van
      de afdoening van een aanvraag tot verlenen, wijzigen of verlengen van een verblijfsvergunning als bedoeld
      in [artikel 14 van de Wet][ref5] of een aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in
      [artikel 20 van de Wet][ref6], een bedrag van € 40 verschuldigd.


