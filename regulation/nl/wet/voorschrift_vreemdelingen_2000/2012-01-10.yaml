  - number: 7.2b
    text: |-
      1 De verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], kan onder een beperking
      verband houdend met het zoeken en verrichten van arbeid al dan niet in loondienst worden verleend aan de
      vreemdeling die verblijfsrecht ontleent aan het Besluit nr. 1/80 van de Associatieraad EEG-Turkije betreffende
      de ontwikkeling van de Associatie en wiens huwelijk met een persoon met een niet-tijdelijk verblijfsrecht
      na drie jaar is ontwricht of ontbonden, indien de vreemdeling op grond van dat huwelijk was toegelaten en
      één jaar direct voorafgaande aan de ontwrichting van het huwelijk rechtmatig verblijf had als bedoeld in
      [artikel 8, onder a, van de Wet][ref2].

      2 De verblijfsvergunning wordt verleend voor de duur van ten hoogste één jaar, te berekenen vanaf de datum van
      verbreking of ontwrichting van het huwelijk maar niet eerder dan de datum van de aanvraag, of zoveel langer
      als de vreemdeling wegens het ontbreken van een verblijfsvergunning geen toegang tot de arbeidsmarkt had. De
      geldigheidsduur ervan wordt niet verlengd.

      3 De verblijfsvergunning kan worden gewijzigd in een verblijfsvergunning onder een beperking verband houdend met
      voortgezet verblijf, indien de vreemdeling uiterlijk op het moment waarop de geldigheidsduur verstrijkt, beschikt
      over een arbeidsplaats voor nog een jaar waarmee hij zelfstandig en duurzaam voldoende middelen van bestaan als
      bedoeld in de [artikelen 3.73 tot en met 3.75 van het Besluit][ref3] verwerft.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
