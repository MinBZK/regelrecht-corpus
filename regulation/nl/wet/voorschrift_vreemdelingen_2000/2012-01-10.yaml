  - number: '4.16'
    text: |-
      1 De korpschef van het regionale politiekorps waarin de gemeente is gelegen waar de vreemdeling zijn woon- of
      verblijfplaats heeft, alsmede de daartoe bevoegde ambtenaar van de Immigratie- en Naturalisatiedienst zijn bevoegd
      om

      a. de plaats aan te wijzen waar de vreemdeling met rechtmatig verblijf als bedoeld in
      [artikel 8, onder f, van de Wet][ref1], zich in verband met het onderzoek naar de inwilligbaarheid van de aanvraag
      om een verblijfsvergunning dient op te houden; en

      b. aanwijzingen als bedoeld in [artikel 55, eerste lid, van de Wet][ref2], te geven.

      2 De korpschef van het regionale politiekorps waarin de gemeente is gelegen waar de vreemdeling zijn woon- of
      verblijfplaats heeft, is bevoegd om de verstrekking van gegevens, bedoeld in [artikel 4.38 van het Besluit][ref3],
      te vorderen.

      3 Een vordering als bedoeld in het tweede lid wordt niet bij algemene bekendmaking gedaan dan na goedkeuring van,
      en volgens voorschrift te geven door, de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel4.38
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel4.16
