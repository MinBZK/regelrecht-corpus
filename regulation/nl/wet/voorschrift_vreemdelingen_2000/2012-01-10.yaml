  - number: 3.34d
    text: |-
      1 Ter zake van de afdoening van een aanvraag tot het verlengen van de geldigheidsduur van de verblijfsvergunning,
      bedoeld in [artikel 14 van de Wet][ref1], is de vreemdeling een bedrag van € 375 verschuldigd met uitzondering van
      de vreemdeling die:

      a. ter zake van de afdoening van een aanvraag tot het verlengen van de verblijfsvergunning,
      bedoeld in [artikel 14 van de Wet][ref2], voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder n, van het Besluit][ref3], een bedrag van € 150 verschuldigd is;

      b. ter zake van de afdoening van een aanvraag tot het verlengen van een verblijfsvergunning, bedoeld in
      [artikel 14 van de Wet][ref4], onder de beperking ‘(verruimde) gezinshereniging bij ouder(s)’, een bedrag van €
      150 verschuldigd;

      c. ter zake van de afdoening van een aanvraag tot het verlengen van de verblijfsvergunning,
      bedoeld in [artikel 14 van de Wet][ref5], voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder j, van het Besluit][ref6], een bedrag van € 60 verschuldigd is, indien hij
      werknemer is op een mijnbouwinstallatie op het continentaal plat;

      d. ter zake van de afdoening van een aanvraag tot het verlengen van de verblijfsvergunning, bedoeld in
      [artikel 14 van de Wet][ref7], voor het verblijfsdoel ‘verblijf in het kader van zetelovereenkomst’ op grond van
      [artikel 3.4, derde lid, van het Besluit][ref8], een bedrag van € 60 verschuldigd is, indien hij een persoon is
      op wie artikel 40, eerste lid, van het op 7 juni 2007 te ’s-Gravenhage tot stand gekomen Zetelverdrag tussen het
      Internationaal Strafhof en het Gastland (Trb. 2007, 25) betrekking heeft met het oog op het verrichten van de
      daarbedoelde werkzaamheden;

      e. ter zake van de afdoening van een aanvraag tot het verlengen van de verblijfsvergunning, bedoeld in
      [artikel 14 van de Wet][ref9], voor het verblijfsdoel ‘verblijf in het kader van zetelovereenkomst’ op grond van
      [artikel 3.4, derde lid, van het Besluit][ref10], een bedrag van € 60 verschuldigd is, indien hij een persoon als
      bedoeld in de voorlaatste alinea van de brief van 21 december 2007 van de Permanente Vertegenwoordiging van het
      Koninkrijk der Nederlanden bij de Verenigde Naties, behorend bij het op 21 december 2007 te New York tot stand
      gekomen Verdrag tussen het Koninkrijk der Nederlanden en de Verenigde Naties betreffende de Zetel van het Speciale
      Tribunaal voor Libanon (Trb. 2007, 228), met het oog op het verrichten van de in die alinea bedoelde werkzaamheden.

      2 In afwijking van het eerste lid is de vreemdeling van Turkse nationaliteit en aan wie het verrichten van arbeid
      is toegestaan ter zake van de afdoening van een aanvraag tot het verlengen van een verblijfsvergunning als bedoeld
      in [artikel 14 van de Wet][ref11], een bedrag van € 40 verschuldigd.

      3 In afwijking van het eerste lid is het toegelaten gezinslid van een vreemdeling als bedoeld in het tweede
      lid, ter zake van de afdoening van een aanvraag tot het verlengen van een verblijfsvergunning als bedoeld in
      [artikel 14 van de Wet][ref12], een bedrag van € 40 verschuldigd.


