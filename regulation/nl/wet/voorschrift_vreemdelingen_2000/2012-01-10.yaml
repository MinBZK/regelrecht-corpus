  - number: 3.34f
    text: |-
      1 In afwijking van [artikel 3.34][ref1] is de vreemdeling geen leges verschuldigd ter zake van de afdoening van
      de aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref2], voor een
      verblijfsdoel als bedoeld in [artikel 3.4, eerste lid, onder a, van het Besluit][ref3], indien hij om vrijstelling
      van leges verzoekt, daarbij een gerechtvaardigd beroep doet op [artikel 8 EVRM](onbekend) en aantoont niet te
      kunnen beschikken over middelen om aan de legesverplichting te kunnen voldoen.

      2 In aanvulling op het eerste lid is de vreemdeling evenmin leges verschuldigd ter zake van
      ten behoeve van de afdoening van de aanvraag tot het verlenen van een verblijfsvergunning
      als bedoeld in [artikel 14 van de Wet][ref4], voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder a, van het Besluit][ref5], indien hij ontheven is van de legesverplichting voor de
      behandeling van de mvv-aanvraag, voorafgaande aan de ingediende aanvraag.

      3 In afwijking van [artikel 3.34c onder b][ref6] is de vreemdeling, niet zijnde gemeenschapsonderdaan, geen
      leges verschuldigd ter zake van de afdoening van een aanvraag tot het wijzigen van een verblijfsvergunning,
      in een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref7], voor een verblijfsdoel als bedoeld
      in [artikel 3.4, eerste lid, onder a, van het Besluit][ref8], indien deze vreemdeling om ontheffing van leges
      verzoekt, daarbij een gerechtvaardigd beroep doet op [artikel 8 EVRM](onbekend) en daarbij aantoont niet te kunnen
      beschikken over middelen om aan de legesverplichting te kunnen voldoen.

      4 In afwijking van artikel 3.34d is de vreemdeling die in het bezit is van een verblijfsvergunning als bedoeld
      in [artikel 14 van de Wet][ref9], welke is verleend is voor het verblijfsdoel ‘uitoefenen van het gezinsleven
      conform artikel 8 EVRM’, geen leges verschuldigd voor het afdoen van een aanvraag tot het verlengen van de
      verblijfsvergunning, indien deze vreemdeling om ontheffing van leges verzoekt, daarbij een gerechtvaardigd
      beroep doet op [artikel 8 EVRM](onbekend) en daarbij aantoont niet te kunnen beschikken over middelen om aan de
      legesverplichting te kunnen voldoen.


