        artikel: '46'
  - number: 7.1c
    text: |-
      1 Bijzondere persoongegevens als bedoeld in [artikel 107a, eerste lid, van de Wet][ref1] kunnen worden verstrekt
      aan de volgende derde personen en instanties:

      a. de Minister van Buitenlandse Zaken, voor het verrichten van onderzoek in het buitenland op verzoek van de
      Minister alsmede ten behoeve van de beoordeling van visumaanvragen;

      b. artsen, voor het beoordelen van de gezondheidstoestand van de vreemdeling op basis van de door de vreemdeling
      ondertekende toestemmingsverklaring, alsmede de overdracht van medische gegevens van een vreemdeling in het kader
      van uitzetting.

      2 De verstrekking van bijzondere persoonsgegevens aan de in het eerst lid genoemde personen geschiedt op geen
      andere wijze dan schriftelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107a
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel7.1c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 107a
  - number: 7.1d
    text: |-
      De onverenigbare verwerking van bijzondere persoonsgegevens wordt op de volgende wijze tegengegaan:

      a. de toegang tot de gegevens in het persoonsgebonden dossier en het geautomatiseerde bestand is voorbehouden aan
      die personen, die voor het uitoefenen van hun taak, bedoeld in de [artikelen 7.1a][ref1] en [7.1c][ref2] toegang
      tot de informatie moeten hebben;

      b. de verantwoordelijke stelt een Functionaris voor de Gegevensbescherming aan, die toeziet op de naleving van de
      [Wet bescherming persoonsgegevens][ref3];

      c. de verantwoordelijke verricht integriteits- en kwaliteitsaudits ten aanzien van de verwerking van de
      persoonsgegevens en rapporteert deze aan de Functionaris voor de Gegevensbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel7.1a
      [ref2]: https://wetten.overheid.nl/BWBR0012002#Artikel7.1c
