    text: |-
      1 De aantekening, bedoeld in de [artikelen 4.24, eerste lid, onder f,][ref1] en [4.27 van het Besluit][ref2],
      luidt: 'toegang geweigerd (datum) (handtekening en stempel)'.

      2 De aantekening, bedoeld in het eerste lid, kan worden aangevuld met een aantekening omtrent de grond waarop de
      weigering van toegang tot Nederland berust.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4.24
