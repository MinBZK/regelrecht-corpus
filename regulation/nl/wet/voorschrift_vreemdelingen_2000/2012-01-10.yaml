        hoofdstuk: '4'
  - number: '1.3'
    text: |-
      Voorzover uit een wettelijk voorschrift niet anders voortvloeit, worden de bevoegdheden genoemd in deze regeling
      uitgeoefend namens de Minister. Bij de uitoefening van deze bevoegdheden worden de algemene en bijzondere
      aanwijzingen van de Minister in acht genomen.
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel1.3
  - number: '2.1'
    text: |-
      1 Als luchthavens, bedoeld in [artikel 2.2, eerste lid, van het Besluit][ref1], zijn aangewezen:

      a. de luchthavens die zijn opgenomen in [bijlage 1][ref2] bij deze regeling, en

      b. de luchthavens, vanaf welke vluchten vertrekken voor het vervoer van personen in het ongeregeld vervoer,
      als bedoeld in het [Besluit Vracht- en overige vluchten][ref3] van de Minister van Verkeer en Waterstaat, met
      uitzondering van de vluchten die door onze Minister door tussenkomst van de Minister van Verkeer en Waterstaat van
      de verplichting tot het maken van een afbeelding zijn ontheven.

      2 De Minister kan bepalen dat de verplichtingen ingevolge [artikel 2.2 van het Besluit][ref4] voor één of meer
      vervoerders vanaf één of meer van de in het eerste lid, onder a, genoemde luchthavens tijdelijk worden opgeschort.

      3 De Minister kan bepalen dat de verplichtingen ingevolge [artikel 2.2 van het Besluit][ref5] van toepassing
      zijn op één of meer vervoerders door wiens tussenkomst de aanvoer van niet- of onvoldoende gedocumenteerde
      vreemdelingen op korte termijn vanaf een bepaalde, niet in het eerste lid, onder a, genoemde luchthaven aanzienlijk
      is toegenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0012002
      [ref3]: https://wetten.overheid.nl/BWBR0003376
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel2.2
      [ref5]: https://wetten.overheid.nl/BWBR0011825#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel2.1
