        bwb_id: BWBR0011825
        artikel: '4.38'
  - number: '5.1'
    text: |-
      Indien de korpschef of de bevelhebber van de Koninklijke marechaussee de bevoegdheid, bedoeld in
      [artikel 50, vierde lid, van de Wet][ref1], mandateert, doet hij dat niet dan aan een ambtenaar, belast met het
      toezicht op vreemdelingen, die tevens hulpofficier van justitie is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel50
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '50'
  - number: '5.2'
    text: |-
      1 De ambtenaar van de Dienst Terugkeer en Vertrek en de ambtenaar van de Immigratie- en Naturalisatiedienst
      die daartoe bevoegd zijn, kunnen de maatregel van beperking van vrijheid van beweging, bedoeld in
      [artikel 56, eerste lid, van de Wet][ref1], opleggen, wijzigen of opheffen.

      2 De korpschef van het regionale politiekorps van de gemeente waar de vreemdeling woon- of verblijfplaats heeft,
      kan de maatregel van beperking van vrijheid van beweging, bedoeld in [artikel 56, eerste lid, van de Wet][ref2] in
      spoedeisende gevallen opleggen.

      3 Indien de korpschef van deze bevoegdheid ondermandaat verleent, doet hij dat niet dan aan een ambtenaar, belast
      met het toezicht op vreemdelingen, die tevens hulpofficier van justitie is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel56
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '56'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '56'
  - number: '5.3'
    text: |-
      1 De maatregel, bedoeld in [artikel 59 van de Wet][ref1], wordt opgelegd door de ambtenaar bedoeld in
      [artikel 47, eerste lid, onder a en b, van de Wet][ref2] die tevens hulpofficier van justitie is.

      2 De maatregel, bedoeld in [artikel 59 van de Wet][ref3], wordt gewijzigd en opgeheven door de
      ambtenaar van Dienst Terugkeer en Vertrek, die daartoe bevoegd is, of door de ambtenaar bedoeld in
      [artikel 47, eerste lid, onder a en b, van de Wet][ref4] die tevens hulpofficier van justitie is.

      3 De maatregel, bedoeld in [artikel 59, eerste lid, van de Wet][ref5], wordt verlengd als bedoeld in artikel
      59, zesde lid, van de Wet, door de ambtenaar van de Dienst Terugkeer en Vertrek die daartoe bevoegd is, of door
      de ambtenaar, bedoeld in [artikel 47, eerste lid, onder a of b, van de Wet][ref6], die tevens hulpofficier van
      justitie is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel59
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0011823#Artikel59
      [ref6]: https://wetten.overheid.nl/BWBR0011823#Artikel47
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel5.3
    references:
      - id: ref1
