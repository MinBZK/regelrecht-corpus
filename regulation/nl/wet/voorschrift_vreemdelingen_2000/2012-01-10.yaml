      [artikel 8, onder a, b, d, e, f, g][ref1] – laatstgenoemde twee onderdelen voor zover sprake is van een aanvraag tot
      het verlenen of wijzigen van een verblijfsvergunning bedoeld in [artikel 14 – alsmede i, l en m van de Wet][ref2]
      blijkt, worden verstrekt door de Immigratie- en Naturalisatiedienst.

      2 Documenten of schriftelijke verklaringen waaruit het rechtmatig verblijf op grond van
      [artikel 8, onder c, f, g][ref3] – laatstgenoemde twee onderdelen voor zover sprake is van een aanvraag
      tot het verlenen, verlengen of wijzigen van een verblijfsvergunning bedoeld in de [artikelen 28][ref4] en
      [33 – alsmede j en k van de Wet][ref5] blijkt, worden verstrekt door de korpschef van het regionale politiekorps
      waarin de gemeente is gelegen waar de vreemdeling zijn woon- of verblijfplaats heeft.


