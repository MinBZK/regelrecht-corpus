  - number: 3.34a
    text: |-
      1 In afwijking van [artikel 3.34][ref1] is de vreemdeling een bedrag van € 40 verschuldigd die:

      a. in aanmerking komt voor de terugkeeroptie op grond van [artikel 8 van de Remigratiewet][ref2];

      b. de nationaliteit van Australië, Canada dan wel Nieuw-Zeeland bezit en een aanvraag tot het verlenen van een
      verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref3], doet voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder q, van het Besluit][ref4], in het kader van het Working Holiday Scheme of het
      Working Holiday Programme;

      c. de nationaliteit van Canada bezit en een aanvraag tot het verlenen van een verblijfsvergunning
      als bedoeld in [artikel 14 van de Wet][ref5], doet voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder l, van het Besluit][ref6], in het kader van het Young Workers Exchange Programme.

      2 In afwijking van [artikel 3.34][ref7] is de vreemdeling een bedrag van € 60 verschuldigd die:

      a. werknemer is op een mijnbouwinstallatie op het continentaal plat en een aanvraag tot het verlenen van een
      verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref8] doet, voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder j, van het Besluit][ref9];

      b. werkzaamheden als bedoeld in artikel 40, eerste lid, van het op 7 juni 2007 te ’s-Gravenhage tot stand gekomen
      Zetelverdrag tussen het Internationaal Strafhof en het Gastland (Trb. 2007, 25) verricht en een aanvraag tot het
      verlenen van een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref10] doet, voor het verblijfsdoel
      ‘verblijf in het kader van zetelovereenkomst’ op grond van [artikel 3.4, derde lid, van het Besluit][ref11];

      c. met het oog op het verrichten van de in de voorlaatste alinea van de brief van 21 december 2007 van de
      Permanente Vertegenwoordiging van het Koninkrijk der Nederlanden bij de Verenigde Naties, behorend bij het op 21
      december 2007 te New York tot stand gekomen Verdrag tussen het Koninkrijk der Nederlanden en de Verenigde Naties
      betreffende de Zetel van het Speciale Tribunaal voor Libanon (Trb. 2007, 228) een aanvraag tot het verlenen van
      een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref12] doet voor het verblijfsdoel ‘verblijf in het
      kader van zetelovereenkomst’ op grond van [artikel 3.4, derde lid, van het Besluit][ref13].


