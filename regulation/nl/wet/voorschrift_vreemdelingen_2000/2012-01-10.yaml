  - number: '3.31'
    text: |-
      Een onderwijsinstelling als bedoeld in [artikel 3.18a][ref1] kan een convenant afsluiten met de Immigratie- en
      Naturalisatiedienst om toegelaten te worden tot een verkorte toelatingsprocedure in verband met de aanvraag tot
      het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14 van de Wet][ref2], onder een
      beperking verband houdend met het volgen van studie als bedoeld in [artikel 3.41 van het Besluit][ref3].


