  - number: 7.1a
    text: |-
      1 De verwerking van bijzondere persoonsgegevens als bedoeld in [artikel 107a, eerste lid, van de Wet][ref1] is
      noodzakelijk:

      a. voor de beoordeling van het bij een aanvraag om een verblijfsvergunning als bedoeld in de [artikelen 14][ref2]
      en [20 van de Wet][ref3] beoogde verblijfsdoel, voor de beoordeling van een aanvraag om verlenging van de
      geldigheidsduur alsmede voor de beoordeling van de algemene weigeringsgronden of intrekkingsgronden van de
      verblijfsvergunning en ambtshalve beoordelingen;

      b. voor het beoordelen van een aanvraag om een verblijfsvergunning als bedoeld in de [artikelen 28][ref4] en
      [33 van de Wet][ref5], voor de beoordeling van een aanvraag om verlenging van de geldigheidsduur alsmede voor de
      beoordeling van de algemene weigeringsgronden of intrekking van de verblijfsvergunning en ambtshalve beoordelingen;

      c. voor het beoordelen van de gronden voor het ongewenst verklaren van een vreemdeling en de opheffing van de
      ongewenstverklaring;

      d. voor de beoordeling van de voorwaarden voor het verlenen van de toegang als bedoeld in [artikel 2.1][ref6],
      [2.9][ref7] en [2.10 van het Besluit][ref8];

      e. voor de toepassing van vrijheidsbeperkende en -ontnemende maatregelen krachtens de [artikelen 6][ref9],
      [56][ref10], [57][ref11], [58][ref12] en [59 van de Wet][ref13];

      f. voor de handhaving van de afschriftplicht van vervoerders als bedoeld in
      [artikel 2.2, tweede lid, van het Besluit][ref14];

      g. voor de beoordeling van de voorwaarden voor verblijf in de vrije termijn als bedoeld in de
      [artikelen 3.2][ref15] en [3.3 van het Besluit][ref16];

      h. bij de uitoefening van de bevoegdheid tot het uitzetten van een vreemdeling als bedoeld in
      [6.1 van het Besluit][ref17], daaronder begrepen de verwerking van bijzondere gegevens in het kader van de
      beoordeling of de uitzetting achterwege dient te blijven als bedoeld in [artikel 64 van de Wet][ref18].

      2 De bijzondere persoonsgegevens worden ten behoeve van de in het eerste lid bedoelde doeleinden opgenomen in
      documenten die in een persoonsgebonden dossier en in een geautomatiseerd bestand worden neergelegd. De gegevens in
      het geautomatiseerde bestand worden gebruikt voor het opstellen van beschikkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107a
