  - number: '3.19'
    text: |-
      1 Voor alleenstaanden in de zin van [artikel 4, onderdeel a, van de Wet werk en bijstand][ref1] zijn de in
      [artikel 16, eerste lid, onder c, van de Wet][ref2] bedoelde middelen van bestaan in ieder geval voldoende,
      indien de som van het loon, bedoeld in [artikel 16 van de Wet financiering sociale verzekeringen][ref3], uit
      arbeid in loondienst, het bruto inkomen uit een inkomensvervangende uitkering krachtens een socialeverzekeringswet
      waarvoor premies zijn afgedragen, de bruto-winst uit arbeid als zelfstandige en het inkomen uit eigen vermogen
      ten minste gelijk is aan 70 procent van het minimumloon, bedoeld in de [artikelen 8, eerste lid, onder a][ref4],
      en [14, van de Wet minimumloon en minimumvakantiebijslag][ref5], met inbegrip van de vakantiebijslag, bedoeld in
      [artikel 15 van die wet][ref6].

      2 Voor alleenstaande ouders in de zin van [artikel 4, onderdeel b, van de Wet werk en bijstand][ref7] zijn de
      in [artikel 16, eerste lid, onder c, van de Wet][ref8] bedoelde middelen van bestaan in ieder geval voldoende,
      indien de in het eerste lid bedoelde som ten minste gelijk is aan 90 procent van het in het eerste lid bedoelde
      minimumloon.

      3 Voor degene die het verblijf in Nederland financiert van een vreemdeling die in Nederland verblijft of
      wil verblijven in het kader van familiebezoek, van een au pair, van medische behandeling of van een oudere
      vreemdeling in de zin van [artikel 3.25 van het Besluit][ref9], zijn de middelen van bestaan in ieder geval
      voldoende, indien de in het eerste lid bedoelde som ten minste gelijk is aan het in het eerste of tweede lid of
      [artikel 3.74, eerste lid, onderdeel a, van het Besluit][ref10] bedoelde bedrag voor de categorie waartoe die
      persoon behoort, aangevuld met 50 procent van het in het eerste lid bedoelde minimumloon.

      4 Voor degene die het verblijf in Nederland financiert van een vreemdeling die in Nederland verblijft of
      wil verblijven in het kader van studie of uitwisseling, zijn de middelen van bestaan voldoende, indien
      de in het eerste lid bedoelde som ten minste gelijk is aan het normbedrag voor uitwonende studenten,
      bedoeld in de [Wet op de Studiefinanciering 2000][ref11], aangevuld met het eerste of tweede lid of
      [artikel 3.74, eerste lid, onderdeel a, van het Besluit][ref12] bedoelde bedrag voor de categorie waartoe de
      persoon behoort die het verblijf financiert.

      5 Voor degene die het verblijf in Nederland financiert van een vreemdeling die in Nederland verblijft of wil
      verblijven in het kader van medische behandeling en van zijn gezinsleden, zijn de middelen van bestaan in ieder
      geval voldoende, indien de in het eerste lid bedoelde som ten minste gelijk is aan het in het eerste of tweede lid
      of [artikel 3.74, eerste lid, onderdeel a, van het Besluit][ref13] bedoelde bedrag voor de categorie waartoe die
      persoon behoort, aangevuld met:

      a. 90 procent van het in het eerste lid bedoelde minimumloon in het geval dat hij het verblijf van de vreemdeling
      die alleenstaande ouder is financiert of

      b. 100 procent in het geval dat de derde het verblijf van een gezin financiert.


