      1 De aantekening, bedoeld in de [artikelen 4.24, eerste lid, onder g][ref1], en [4.28 van het Besluit][ref2],
      luidt: 'vertrokken/uitgezet verwijderd op (datum) (handtekening en stempel)'.

      2 De aantekening, bedoeld in het eerste lid, kan worden aangevuld met een aantekening omtrent de reden van de
      verwijdering uit Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4.24
