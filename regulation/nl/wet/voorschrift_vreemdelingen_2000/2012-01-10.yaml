  - number: 3.18b
    text: |-
      Als onderzoeksinstelling als bedoeld in [artikel 3.56a, eerste lid, van het Besluit][ref1] wordt aangewezen:

      a. een publieke onderzoeksinstelling als bedoeld in
      [artikel 1d, eerste lid, onder b, van het Besluit Uitvoering Wet arbeid Vreemdelingen][ref2] die functieprofielen
      zoals opgenomen in het universitaire systeem van functieordenen onder de functiefamilie ‘onderzoek en onderwijs’
      hanteren voor onderzoekers in loondienst;

      b. een publieke onderzoeksinstelling die is opgenomen in de [bijlage behorende bij de Wet op het Hoger Onderwijs en
      Wetenschappelijk onderzoek](onbekend);

      c. een door de Minister erkende particuliere onderzoeksinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.56a
