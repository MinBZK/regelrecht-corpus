  - number: '4.2'
    text: |-
      1 Als de plaatsen waar grensdoorlaatposten zijn gevestigd, zijn aangewezen de plaatsen vermeld in kolom A van
      [bijlage 4][ref1] bij deze regeling. Personencontrole in het kader van de grensbewaking kan worden uitgevoerd op de
      locaties, vermeld in kolom B van [bijlage 4][ref2] bij deze regeling.

      2 De grensdoorlaatposten, bedoeld in het eerste lid, zijn voor het inreizen en uitreizen van personen opengesteld
      gedurende de tijden, vermeld in kolom C van [bijlage 4][ref3] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012002
