  - number: 3.34b
    text: |-
      1 In afwijking van de [artikelen 3.34][ref1] en [3.34a][ref2] is de vreemdeling geen leges verschuldigd indien hij:

      a. in aanmerking komt voor verlening van een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref3], voor
      een verblijfsdoel als bedoeld in [artikel 3.4, eerste lid, onder m of s, van het Besluit][ref4];

      b. als minderjarig kind een aanvraag indient tot het verlenen van een verblijfsvergunning
      als bedoeld in [artikel 14 van de Wet][ref5], voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder a, van het Besluit][ref6], bij een vreemdeling die een aanvraag heeft ingediend tot
      het verlenen van een verblijfsvergunning dan wel verblijf geniet als bedoeld in [artikel 14 van de Wet][ref7], voor
      een verblijfsdoel als bedoeld in [artikel 3.4, eerste lid, onder s, van het Besluit][ref8];

      c. blijkens een schriftelijke verklaring van de Minister in aanmerking komt voor het verlenen van een
      verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref9], voor een verblijfsdoel, verband houdend met
      [artikel 3.4, eerste lid, aanhef en onder w, van het Besluit][ref10], dan wel voor een ander verblijfsdoel dan
      genoemd in [artikel 3.4, eerste lid, van het Besluit][ref11];

      d. verblijf heeft als tijdelijk beschermde op grond van Richtlijn 2001/55/EG van 20 juli 2001 en die een aanvraag
      indient tot het verlenen van een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref12], voor een
      verblijfsdoel als bedoeld in [artikel 3.4, eerste lid, onder e of f, van het Besluit][ref13];

      e. vóór 1 april 2001 een aanvraag tot toelating als vluchteling als bedoeld in
      [artikel 15, eerste lid, van de Vreemdelingenwet][ref14] heeft ingediend en in de periode van 14 januari 2003
      tot en met 17 maart 2005 rechtstreeks bij de Minister een aanvraag heeft ingediend tot het verlenen van de
      verblijfsvergunning, bedoeld in [artikel 14 van de Wet][ref15], anders dan met het in [bijlage 13][ref16] bij deze
      regeling met de letter a aangeduide model;

      f. als gezinslid van de houder van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28 van de Wet][ref17], gelijktijdig met de hoofdpersoon is ingereisd dan wel binnen drie maanden
      nadat aan de hoofdpersoon deze verblijfsvergunning is verleend, is nagereisd, en niet dezelfde nationaliteit
      heeft als de hoofdpersoon, een aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in
      [artikel 14 van de Wet][ref18] onder een beperking verband houdend met gezinshereniging indient;

      g. een aanvraag indient in het kader van verblijf als gezinslid van een militair verbonden aan een hier te lande
      gevestigd internationaal militair hoofdkwartier (Joint Force Command-headquarters) onder de beperking ‘conform
      beschikking Staatssecretaris’;

      h. in aanmerking komt voor verlening van een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref19],
      onder een beperking verband houdend met gezinsvorming bij een houder van een verblijfsvergunning als bedoeld
      in [artikel 14 van de Wet][ref20], onder een beperking verband houdend met verblijf op grond van de Regeling
      afwikkeling nalatenschap oude Vreemdelingenwet, en de feitelijke gezinsvorming heeft plaatsgehad op of voor 13
      december 2006;

      i. een aanvraag indient in het geval, bedoeld in [artikel 3.101, tweede lid, van het Besluit][ref21];

      j. een aanvraag indient in het kader van dreigend eergerelateerd geweld onder de beperking ‘conform beschikking
      Staatssecretaris’;

      k. een aanvraag indient in het kader van verblijf als slachtoffer van mensenhandel onder de beperking ‘conform
      beschikking Staatssecretaris’;

      l. een aanvraag indient in het kader van huiselijk geweld, onder de beperking ‘conform beschikking
      Staatssecretaris’;

      m. als minderjarig kind een aanvraag indient tot het verlenen van een verblijfsvergunning als bedoeld in
      [artikel 14 van de Wet][ref22], onder een beperking verband houdend met gezinshereniging, bij een vreemdeling
      die, in het kader van dreigend eergerelateerd geweld, verblijf als slachtoffer van mensenhandel of huiselijk
      geweld, een aanvraag heeft ingediend tot het verlenen van een verblijfsvergunning dan wel aan wie in dat kader een
      verblijfsvergunning is verleend onder de beperking ‘conform beschikking Staatssecretaris’.

      2 In aanvulling op het eerste lid kan de Minister in overleg met de Minister van Buitenlandse Zaken bepalen dat de
      vastgestelde leges niet zijn verschuldigd in het belang van de internationale betrekkingen.


