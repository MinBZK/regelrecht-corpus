  - number: 3.34g
    text: |-
      1 Ter zake van de afdoening van een aanvraag tot het verlenen of het wijzigen van een verblijfsvergunning als
      bedoeld in [artikel 20 van de Wet][ref1], is de vreemdeling een bedrag van € 401 verschuldigd.

      2 In afwijking van het eerste lid is de vreemdeling die in aanmerking komt voor de terugkeeroptie op grond van
      [artikel 8 van de Remigratiewet][ref2] en in aanmerking komt voor verlening van een verblijfsvergunning als bedoeld
      in [artikel 20 van de Wet][ref3], een bedrag van € 40 verschuldigd.

      3 In afwijking van het eerste lid is de vreemdeling van Turkse nationaliteit en aan wie het verrichten van arbeid
      is toegestaan ter zake van de afdoening van een aanvraag tot het verlenen van een verblijfsvergunning als bedoeld
      in [artikel 20 van de Wet][ref4], een bedrag van € 40 verschuldigd.

      4 In afwijking van het eerste lid het toegelaten gezinslid van een vreemdeling als bedoeld in het derde
      lid, ter zake van de afdoening van een aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in
      [artikel 20 van de Wet][ref5], een bedrag van € 40 verschuldigd.

      5 Ter zake van de afgifte ter uitvoering van [artikel 4.22, tweede lid, van het Besluit][ref6], van een vervangend
      document waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder b en e, van de Wet][ref7] blijkt, is de
      vreemdeling een bedrag van € 40 verschuldigd.


