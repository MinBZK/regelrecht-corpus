  - number: '3.3'
    text: |-
      1 Als document waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder f tot en met h, van de Wet][ref1],
      blijkt, zijn aangewezen de volgende documenten en verklaringen, waarbij het vastgestelde model van dat document of
      die verklaring wordt aangegeven:

      a. voor vreemdelingen die in afwachting zijn van een besluit of een rechterlijke beslissing omtrent een
      verblijfsvergunning als bedoeld in de [artikelen 28][ref2] en [33 van de Wet][ref3]: het document W van het model
      dat als [bijlage 7f][ref4] bij deze regeling is gevoegd;

      b. voor vreemdelingen die in afwachting zijn van een besluit of een rechterlijke
      uitspraak omtrent een aanvraag tot verlenging van de geldigheidsduur of wijziging van een
      verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref5] onder de beperking genoemd in
      [artikel 3.4, eerste lid, aanhef en onder x, van het Besluit][ref6] en die rechtmatig verblijf als bedoeld
      in [artikel 8, aanhef en onder g of h, van de Wet][ref7] hebben: het document W2 van het model dat als
      [bijlage 7f2][ref8] bij deze regeling is gevoegd;

      c. voor vreemdelingen die in afwachting zijn van een besluit of rechterlijke uitspraak omtrent een
      aanvraag tot verlening, verlenging van de geldigheidsduur of wijziging van een verblijfsvergunning
      als bedoeld in [artikel 14 van de Wet][ref9] en die rechtmatig verblijf als bedoeld in
      [artikel 8, aanhef en onder f, g of h van de Wet][ref10] hebben en in het verleden een aanvraag om verlening van
      een verblijfsvergunning als bedoeld in [artikel 28 van de Wet][ref11] hebben ingediend: het document W2 van het
      model dat als [bijlage 7f2][ref12] bij deze regeling is gevoegd;

      d. voor overige vreemdelingen die in afwachting zijn van een besluit of een rechterlijke uitspraak omtrent
      een aanvraag tot verlening, verlenging van de geldigheidsduur of wijziging van een verblijfsvergunning als
      bedoeld in de [artikelen 14][ref13] en [20 van de Wet][ref14] en die rechtmatig verblijf als bedoeld in
      [artikel 8, aanhef en onder f, g of h van de Wet][ref15] hebben en waarbij naar oordeel van de Minister sprake is
      van zeer bijzondere omstandigheden: het document W2 van het model dat als [bijlage 7f2][ref16] bij deze regeling
      is gevoegd;

      e. voor overige vreemdelingen met rechtmatig verblijf als bedoeld in [artikel 8, onder f of g, van de Wet][ref17]:
      de sticker Verblijfsaantekeningen Algemeen van het model dat als [bijlage 7g][ref18] bij deze regeling is gevoegd,
      voorzien van de aantekening, bedoeld in het derde lid, en

      f. voor overige vreemdelingen met rechtmatig verblijf als bedoeld in [artikel 8, onder h, van de Wet][ref19]: de
      sticker Verblijfsaantekeningen Vervolgprocedures van het model dat als [bijlage 7i][ref20] bij deze regeling is
      gevoegd, voorzien van de aantekening, bedoeld in het vierde lid;

      g. voor vreemdelingen met rechtmatig verblijf als bedoeld in [artikel 8, aanhef en onder m, van de Wet][ref21]: het
      document W2 van het model dat als [bijlage 7f2][ref22] bij deze regeling is gevoegd.

      2 Het document, bedoeld in het eerste lid, onder a, b, c en d, zijn ingevolge
      [artikel 4.21, eerste lid, onder c en d, van het Besluit][ref23] tevens vastgesteld als geldend document ter
      vaststelling van de identiteit, nationaliteit en verblijfsrechtelijke positie van vreemdelingen.

      3 De aantekening, bedoeld in het eerste lid, onder e, luidt: 'aanvraag ingediend/verlenging aangevraagd voor een
      verblijfsvergunning op grond van [artikel 14][ref24]/[20][ref25]/[33 Vw 2000][ref26] op (datum). arbeid wel/niet
      toegestaan; tewerkstellingsvergunning wel/niet vereist. Geldig tot (datum), tenzij voor deze datum op voormelde
      aanvraag is beslist'.

      4 De aantekening, bedoeld in het eerste lid, onder f, luidt: 'bezwaarschrift ingediend of beroep rechtbank
      ingediend op (datum). Arbeid wel/niet toegestaan; tewerkstellingsvergunning wel/niet vereist. Geldig tot (datum),
      tenzij voor deze datum op voormeld bezwaar/beroep is beslist.'

      5 De aantekening bedoeld in het eerste lid, onder g, luidt: ‘verblijf als bedoeld in
      [artikel 8, onder m, van de Wet][ref27]. Arbeid niet toegestaan. Geldig tot (datum).’

      6 De aantekeningen, bedoeld in het derde en vierde lid, hebben een geldigheidsduur van ten hoogste zes maanden.
      Indien de geldigheidsduur van de aantekening verstrijkt voordat een beslissing is genomen op de aanvraag,
      onderscheidenlijk het bezwaar of beroep, kan de desbetreffende aantekening wederom worden gesteld met een
      geldigheidsduur van ten hoogste zes maanden. Indien afwijzend is beslist, wordt de aantekening 'vervallen'
      geplaatst.


