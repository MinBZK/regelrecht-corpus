  - number: '4.9'
    text: |-
      Voor het stellen van aantekeningen in de reis- en identiteitspapieren van de vreemdeling, bedoeld in
      [artikel 4.29 van het Besluit][ref1], wordt gebruik gemaakt van het model dat als [bijlage 7j][ref2] bij deze
      regeling is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4.29
      [ref2]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel4.9
