  - number: 7.1b
    text: |-
      1 Voorzover de bijzondere persoonsgegevens zijn opgeslagen in een geautomatiseerd bestand, wordt dit bestand
      beveiligd tegen ongeautoriseerd gebruik door:

      a. het toekennen van autorisaties aan alleen die personen, die voor het uitoefenen van hun taak toegang tot de
      opgeslagen informatie moeten hebben;

      b. het bewaren van een reservebestand op een voor niet-geautoriseerde personen ontoegankelijke plaats.

      2 De autorisaties als bedoeld in het eerste lid worden toegekend aan medewerkers van de Immigratie- en
      Naturalisatiedienst (IND) en de ambtenaren, bedoeld in de [artikelen 46 tot en met 48 van de Wet][ref1].

      3 De verantwoordelijke stelt richtlijnen op voor het verwerken van bijzondere persoonsgegevens in het
      geautomatiseerde systeem.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel46
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel7.1b
