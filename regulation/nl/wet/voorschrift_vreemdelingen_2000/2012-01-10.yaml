  - number: '4.6'
    text: |-
      1 De aantekening, bedoeld in de [artikelen 4.24, eerste lid, onder d][ref1], en [4.26 van het Besluit][ref2],
      luidt: 'aanmelden binnen drie dagen bij de korpschef te (plaats), (datum waarop de aantekening wordt gesteld,
      handtekening en stempel)'.

      2 Het opleggen van een verplichting tot aanmelding bij de korpschef aan een vreemdeling, aan wie een bijzonder
      doorlaatbewijs als bedoeld in [bijlage 3 onder I][ref3] bij deze regeling is afgegeven, geschiedt door in dat
      document achter de woorden 'zich melden binnen drie dagen na afgifte van dit doorlaatbewijs bij' aan te tekenen:
      'de korpschef te (plaats)'.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4.24
