        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
  - number: '3.42'
    text: |-
      1 De aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in [artikel 28 van de Wet][ref1], wordt
      ingediend in het Aanmeldcentrum te Den Bosch, Ter Apel of Zevenaar.

      2 In afwijking van het eerste lid, wordt de eerste aanvraag ingediend in het Aanmeldcentrum Den Bosch, indien de
      vreemdeling stelt minderjarig te zijn en niet begeleid wordt door een ouder of wettelijke vertegenwoordiger.

      3 In afwijking van het eerste en tweede lid, wordt de aanvraag ingediend op het Aanmeldcentrum op de Luchthaven
      Schiphol, indien de vreemdeling de toegang is geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.42a
    text: |-
      1 De vreemdeling die niet de toegang is geweigerd geeft in persoon bij de Aanmeldunit van de
      Vreemdelingenpolitie te kennen dat hij een aanvraag tot het verlenen van een verblijfsvergunning, bedoeld in
      [artikel 28 van de Wet][ref1] wil indienen.

      2 In afwijking van het eerste lid, geeft de vreemdeling die stelt minderjarig te zijn en niet begeleid wordt door
      een ouder of wettelijk vertegenwoordiger in persoon in het Aanmeldcentrum op de Luchthaven Schiphol te kennen de
      aanvraag te willen indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel3.42a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: '3.43'
    text: |-
      De aanvraag tot het verlenen van de verblijfsvergunning bedoeld in [artikel 33 van de Wet][ref1], wordt ingediend
      bij de Immigratie- en Naturalisatiedienst.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel3.43
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '33'
  - number: 3.43a
    text: |-
      Aan de vreemdeling die te kennen geeft de aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde tijd,
      bedoeld in [artikel 28 van de Wet][ref1], in te willen dienen wordt een brochure uitgereikt waarin hij, in een taal
      waarvan redelijkerwijze kan worden aangenomen dat hij die begrijpt, wordt ingelicht over:

      a. de te volgen procedure;

      b. zijn rechten en verplichtingen tijdens de procedure;

      c. de gevolgen die kunnen ontstaan indien hij zijn verplichtingen niet nakomt of niet met de autoriteiten
      samenwerkt;

      d. de termijnen die gelden binnen de procedure;

      e. de wijze waarop hij kan voldoen aan zijn verplichting tot het indienen van de gegevens als bedoeld in
      [artikel 3.111, eerste lid van het Besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3.111
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel3.43a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3.111'
  - number: '3.44'
    text: |-
      1 De in [artikel 3.112, tweede lid, van het Besluit][ref1] bedoelde vragenlijst bevat in ieder geval vragen omtrent
      de personalia van de vreemdeling, zijn geboorteplaats en geboortedatum, zijn nationaliteit en etnische afkomst, de
      datum van zijn vertrek uit het land van herkomst, de datum van zijn aankomst in Nederland, eventueel verblijf in
      derde landen, en het bezit van een paspoort en identiteitsdocumenten.

      2 Indien de beantwoording van de vastgestelde vragen onvoldoende duidelijkheid verschaft kunnen aanvullende vragen
      worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.112
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel3.44
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3.112'
  - number: '3.45'
    text: |-
      De gegevens, bedoeld in [artikel 3.111, eerste lid, van het Besluit][ref1], bestaan uit de verklaringen van de
      vreemdeling en alle in zijn bezit zijnde documentatie over zijn achtergrond en die van relevante familieleden,
      zijn leeftijd, identiteit, nationaliteit(en), land(en) en plaats(en) van eerder verblijf, eerdere asielaanvragen,
      reisroutes, identiteits- en reisdocumenten en de redenen waarom hij een aanvraag voor een verblijfsvergunning als
      bedoeld in [artikel 28 van de Wet][ref2] indient.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.111
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel3.45
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3.111'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
  - number: '3.46'
    text: |-
      De in [artikel 3.122 van het Besluit][ref1] bedoelde informatie wordt verschaft door het verzenden dan wel
      uitreiken van een brochure aan de vreemdeling tegelijk met, dan wel zo spoedig mogelijk na de bekendmaking van
      de beschikking waarin de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28 van de Wet][ref2] wordt ingewilligd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.122
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel3.46
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3.122'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
  - number: '3.47'
    text: |-
      Indien de aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in de [artikelen 28][ref1] en
      [33 van de Wet][ref2], wordt ingetrokken, wordt daarvan een aantekening gemaakt in het dossier van de vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
