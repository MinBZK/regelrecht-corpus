  - number: 3.34j
    text: |-
      1 Ter zake van de afgifte ter uitvoering van [artikel 4.22, eerste lid, van het Besluit][ref1], van een vervangend
      document waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder a en b, van de Wet][ref2] blijkt, is de
      vreemdeling een bedrag van € 250 verschuldigd.

      2 Ter zake van de afgifte ter uitvoering van [artikel 4.22, eerste lid, van het Besluit][ref3], van een vervangend
      document waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder e, van de Wet][ref4] blijkt, is de
      vreemdeling een bedrag van € 40 verschuldigd.

      3 In afwijking van het eerste lid is de vreemdeling een bedrag van € 40 verschuldigd ter zake van de afgifte van
      een vervangend document:

      a. waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder a, van de Wet][ref5] blijkt, voor zover de
      vreemdeling van Turkse nationaliteit is en de verblijfsvergunning is verleend onder een beperking verband houdend
      met het verrichten van arbeid als zelfstandige;

      b. waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder b, van de Wet][ref6] blijkt voor zover de
      vreemdeling van Turkse nationaliteit is en de vreemdeling direct voorafgaande aan de aanvraag houder is van een
      verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref7] onder een beperking verband houdend met het
      verrichten van arbeid als zelfstandige;

      c. waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder a, b of l, van de Wet][ref8] blijkt voor zover de
      vreemdeling van Turkse nationaliteit is en het verrichten van arbeid is toegestaan;

      d. waaruit het rechtmatig verblijf bedoeld in [artikel 8, onder a, b of l, van de Wet][ref9] blijkt, voor zover de
      vreemdeling het gezinslid is van een vreemdeling als bedoeld in de onderdeel c.


