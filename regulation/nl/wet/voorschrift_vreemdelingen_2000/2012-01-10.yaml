      1 De leges, bedoeld in de [artikelen 3.34][ref1], [3.34a][ref2], [3.34c][ref3], [3.34g, tweede lid][ref4], en
      [3.34h][ref5], worden door de vreemdeling in persoon aan het IND-loket voldaan.

      2 In afwijking van het eerste lid worden de leges terzake van de afdoening van een aanvraag als bedoeld in
      [artikel 3.33a, derde lid][ref6], van deze regeling of [artikel 3.59a van het Besluit][ref7] door tussenkomst van
      de onderwijsinstelling, onderscheidenlijk de werkgever die een verklaring als bedoeld in [bijlage 12a][ref8] heeft
      ondertekend, voldaan per automatische incasso.

      3 De leges, bedoeld in de [artikelen 3.34d][ref9] en [3.34g, eerste, derde, vierde en vijfde lid][ref10], worden
      door de vreemdeling door middel van een in opdracht van de IND toegezonden acceptgiro voldaan.


