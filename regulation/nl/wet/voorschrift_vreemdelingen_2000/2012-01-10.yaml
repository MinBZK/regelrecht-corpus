      1 De in [artikel 3.109, eerste lid, van het Besluit][ref1] bedoelde termijn is niet van toepassing indien de
      aanvraag wordt ingediend in het Aanmeldcentrum op de Luchthaven Schiphol.

      2 In afwijking van het [tweede lid van artikel 3.113 van het Besluit][ref2] kan een nader gehoor in het
      Aanmeldcentrum op de Luchthaven Schiphol achterwege blijven indien in verband met relevante individuele aspecten
      moet worden aangenomen dat niet op zorgvuldige wijze in het Aanmeldcentrum tot een zorgvuldige beslissing kan
