  - number: '3.2'
    text: |-
      1 Als document waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder e, van de Wet][ref1], blijkt,
      zijn aangewezen de volgende documenten en verklaringen, waarbij het vastgestelde model van dat document of die
      verklaring wordt aangegeven:

      a. voor gemeenschapsonderdanen die zes maanden in Nederland als werkzoekende of als grensarbeider verblijven: de
      sticker Verblijfsaantekeningen Gemeenschapsonderdanen van het model dat als [bijlage 7h][ref2] bij deze regeling
      is gevoegd;

      b. voor gemeenschapsonderdanen, niet zijnde onderdanen van een staat die partij is bij het Verdrag tot oprichting
      van de Europese Gemeenschap of de Overeenkomst betreffende de Europese Economische Ruimte of de Overeenkomst tussen
      de Europese Gemeenschap en de Zwitserse Bondsstaat, en voor gemeenschapsonderdanen die werkzaamheden in loondienst
      verrichten waarvan de te verwachten duur meer dan zes maanden maar minder dan een jaar bedraagt: het document I van
      het model, dat als [bijlage 7a][ref3] bij deze regeling is gevoegd, en

      c. voor de overige gemeenschapsonderdanen: het document EU/EER van het model dat als [bijlage 7e][ref4] bij deze
      regeling is gevoegd.

      2 Op de documenten en verklaringen, bedoeld in het eerste lid, wordt de aantekening gesteld: ‘arbeid toegestaan;
      tewerkstellingsvergunning niet vereist’.

      3 Op de documenten en verklaringen, bedoeld in het eerste lid, kan de aantekening worden gesteld:

      a. ‘een beroep op publieke middelen kan gevolgen hebben voor het verblijfsrecht’, of

      b. ‘een meer dan aanvullend beroep op publieke middelen kan gevolgen hebben voor het verblijfsrecht’.

      4 De documenten, bedoeld in het eerste lid, onder b en c, zijn ingevolge
      [artikel 4.21, eerste lid, onder b, van het Besluit][ref5] tevens vastgesteld als document ter vaststelling van de
      identiteit, nationaliteit en verblijfsrechtelijke positie van vreemdelingen met rechtmatig verblijf als bedoeld in
      [artikel 8, onder e, van de Wet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0012002
      [ref3]: https://wetten.overheid.nl/BWBR0012002
