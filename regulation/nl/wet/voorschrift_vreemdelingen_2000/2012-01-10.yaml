  - number: '3.39'
    text: |-
      De aanvraag tot het verlengen van de geldigheidsduur van een verblijfsvergunning als bedoeld in
      [artikel 28 van de Wet][ref1], wordt gedaan door indiening van een formulier van het in [bijlage 13][ref2] bij deze
      regeling met j-1 aangeduide model.


