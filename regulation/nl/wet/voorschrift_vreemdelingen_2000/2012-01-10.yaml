  - number: 3.33a
    text: |-
      1 De aanvraag tot het verlenen of wijzigen van de verblijfsvergunning, bedoeld in [artikel 14 van de Wet][ref1],
      dan wel het verlengen van de geldigheidsduur daarvan, wordt ingediend bij een kantoor van de Immigratie- en
      Naturalisatiedienst.

      2 In afwijking van het eerste lid wordt de aanvraag tot het verlenen van een verblijfsvergunning onder de
      beperking, genoemd in [artikel 3.4, eerste lid, onder s, van het Besluit][ref2], ingediend bij de korpschef van de
      politieregio waar de aangifte is gedaan.

      3 In afwijking van het eerste lid wordt de aanvraag tot het verlenen of wijzigen van een verblijfsvergunning
      onder de beperking, genoemd in [artikel 3.4, eerste lid, onder n en o, van het Besluit][ref3], voor studie aan
      de onderwijsinstelling als bedoeld in [artikel 3.18a][ref4], ingediend door de student door tussenkomst van de
      onderwijsinstelling bij het studieloket van de Immigratie- en Naturalisatiedienst.

      4 Indien de vreemdeling woon- of verblijfplaats heeft in een politieregio vermeld in [kolom A van bijlage 18][ref5]
      bij deze regeling, wordt de aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in
      [artikel 14 van de Wet][ref6], in afwijking van het eerste lid en onverminderd het tweede lid, ingediend bij het in
      [kolom B van deze bijlage][ref7] vermelde kantoor van de Immigratie- en Naturalisatiedienst indien de vreemdeling:

      a. niet de nationaliteit bezit van één der door de Minister van Buitenlandse Zaken aan te wijzen landen;

      b. geen gemeenschapsonderdaan is, en

      c. niet beschikt over een geldige machtiging tot voorlopig verblijf die overeenkomt met het verblijfsdoel waarvoor
      de verblijfsvergunning is aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
