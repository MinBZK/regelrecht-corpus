        artikel: '29'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '29'
  - number: 3.37c
    text: |-
      1 Bescherming tegen vervolging in de zin van het Vluchtelingenverdrag, dan wel tegen folteringen, onmenselijke of
      vernederende behandelingen of bestraffingen als bedoeld in [artikel 29, eerste lid, onder b, van de Wet][ref1] kan
      worden geboden door:

      a. de staat,

      b. partijen of organisaties, inclusief internationale organisaties, die de staat of een aanzienlijk deel van zijn
      grondgebied beheersen.

      2 In het algemeen wordt bescherming geboden wanneer de actoren als bedoeld in het eerste lid redelijke maatregelen
      treffen tot voorkoming van vervolging in de zin van het Vluchtelingenverdrag, dan wel van folteringen, onmenselijke
      of vernederende behandelingen of bestraffingen als bedoeld in [artikel 29, eerste lid, onder b, van de Wet][ref2],
      onder andere door de instelling van een doeltreffend juridisch systeem voor de opsporing, gerechtelijke
      vervolging en bestraffing van handelingen die vervolging in de zin van het Vluchtelingenverdrag,
      dan wel folteringen, onmenselijke of vernederende behandelingen of bestraffingen als bedoeld in
      [artikel 29, eerste lid, onder b, van de Wet][ref3] vormen, en wanneer de vreemdeling toegang tot een dergelijke
      bescherming heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel3.37c
