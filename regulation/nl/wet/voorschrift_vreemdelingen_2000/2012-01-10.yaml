  - number: 3.37e
    text: |-
      1 Bij de beoordeling of sprake is van de situatie, bedoeld in [artikel 3.105c, eerste lid, van het Besluit][ref1],
      omdat de omstandigheden die de rechtsgrond voor verlening van de desbetreffende verblijfsvergunning vormden hebben
      opgehouden te bestaan, geldt dat de wijziging van de omstandigheden een voldoende ingrijpend en niet-voorbijgaand
      karakter dient te hebben om de gegronde vrees voor vervolging in de zin van het Vluchtelingenverdrag weg te nemen.

      2 Bij de beoordeling of sprake is van de situatie, bedoeld in [artikel 3.105f, eerste lid, van het Besluit][ref2],
      omdat de omstandigheden die de rechtsgrond voor verlening van de desbetreffende verblijfsvergunning vormden hebben
      opgehouden te bestaan, geldt dat de wijziging van de omstandigheden een voldoende ingrijpend en niet-voorbijgaand
      karakter dient te hebben om het reële risico op folteringen, onmenselijke of vernederende behandelingen of
      bestraffingen als bedoeld in [artikel 29, eerste lid, onder b, van de Wet][ref3] weg te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3.105c
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3.105f
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel29
