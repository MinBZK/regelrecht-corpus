    text: |-
      1 De aantekening, bedoeld in [artikel 2.4, vijfde lid, van het Besluit][ref1], luidt: 'Toegang tot het
      Beneluxgebied verleend van (datum) tot (datum), [artikel 2.4, tweede/vijfde lid, Vreemdelingenbesluit][ref2]
      (inreisstempel en handtekening van ambtenaar die toegang verleent)'.

      2 Het model van de afzonderlijke verklaring, waaruit het verlenen van toegang op grond van
      [artikel 2.4, tweede lid, van het Besluit][ref3] blijkt, is opgenomen in [bijlage 5][ref4] bij deze regeling.


