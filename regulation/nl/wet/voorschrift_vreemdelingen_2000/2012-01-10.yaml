  - number: 3.18a
    text: |-
      Als onderwijsinstelling die voltijds hoger onderwijs verzorgt als bedoeld in
      [artikel 3.41, eerste lid, onder a, van het Besluit][ref1] wordt aangewezen een instelling die een convenant met de
      Immigratie- en Naturalisatiedienst heeft gesloten en die:

      a. de ‘Gedragscode internationaal student in het Nederlands Hoger Onderwijs’ heeft ondertekend en voorkomt in het
      openbaar register van onderwijsinstellingen die de Gedragscode hebben ondertekend;

      b. opleidingen verzorgt in het kader van het ontwikkelingssamenwerkingbeleid van het Ministerie van Buitenlandse
      Zaken, of

      c. opleidingsactiviteiten faciliteert in het kader van de [Wet op het specifiek cultuurbeleid][ref2].


