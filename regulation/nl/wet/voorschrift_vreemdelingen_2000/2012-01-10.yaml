      a. verblijf als meerderjarige ex-bama;

      b. afwikkeling nalatenschap oude [Vreemdelingenwet][ref2];

      c. voortgezet verblijf na verblijf op grond van de Regeling afwikkeling nalatenschap oude Vreemdelingenwet;

