      1 Bij een beroep op [artikel 3.107a, tweede lid, onder d, van het Besluit][ref1] overlegt de aanvrager de
      beschikking, waarbij ontheffing van de inburgeringsplicht op grond van [artikel 6, eerste lid][ref2], of
      [artikel 31, tweede lid, van de Wet inburgering][ref3] is verleend, die niet ouder is dan drie jaar.

      2 Bij een beroep op [artikel 3.107a, derde lid, van het Besluit][ref4] overlegt de aanvrager het advies, bedoeld in
      [artikel 2.8 van het Besluit inburgering][ref5], dat niet ouder is dan zes maanden.


