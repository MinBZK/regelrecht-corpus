  - number: 7.2a
    text: |-
      1 Indien de vreemdeling, bedoeld in [artikel 8.7, eerste lid, van het Besluit][ref1], zich aanmeldt voor
      inschrijving in de vreemdelingenadministratie, legt hij de volgende gegevens en bescheiden over:

      a. een geldige identiteitskaart of een geldig paspoort;

      b. voor zover hij in Nederland verblijft als werknemer: een werkgeversverklaring of arbeidsovereenkomst waaruit
      blijkt dat hij in Nederland reële en daadwerkelijke arbeid verricht anders dan louter marginaal en bijkomstig van
      aard;.

      c. voor zover hij in Nederland verblijft als zelfstandige: een bewijs van inschrijving in het handelsregister en
      bewijs waaruit blijkt dat hij in Nederland reële en daadwerkelijke arbeid verricht anders dan louter marginaal
      en bijkomstig van aard, zoals een daartoe strekkende balans, winst- of verliesrekening, maandelijkse opgaven van
      bedrijfsresultaten of, als de genoemde bewijsstukken nog niet aanwezig zijn, verklaring of prognose, opgesteld door
      een accountant of financieel adviseur;

      d. voor zover hij in Nederland verblijft als student: een bewijs van inschrijving voor een opleiding, bedoeld in
      [artikel 8.12, eerste lid, onder c, van het Besluit][ref2], een verklaring of een gelijkwaardig middel naar zijn
      keuze waaruit blijkt hij beschikt over voldoende middelen van bestaan en een bewijs van een verzekering die de
      ziektekosten in Nederland volledig dekt;

      e. voor zover hij in Nederland verblijft als economisch niet-actieve: een bewijsstuk waaruit blijkt dat wordt
      beschikt over toereikende bestaansmiddelen om te voorkomen dat de vreemdeling tijdens het verblijf ten laste komt
      van de algemene middelen en een bewijs van een verzekering die de ziektekosten in Nederland volledig dekt.

      2 Indien de vreemdeling, bedoeld in [artikel 8.7, tweede, derde of vierde lid, van het Besluit][ref3], die de
      nationaliteit bezit van een staat als bedoeld in het eerste lid van dat artikel, zich aanmeldt voor inschrijving in
      de vreemdelingenadministratie, legt hij de volgende gegevens en bescheiden over:

      a. een geldige identiteitskaart of een geldig paspoort;

      b. de verklaring van inschrijving van de vreemdeling, bedoeld in [artikel 8.7, eerste lid, van het Besluit][ref4],
      bij wie hij in Nederland verblijft;

      c. een document waaruit de familierechtelijke relatie of duurzame relatie blijkt met de vreemdeling, bedoeld onder
      b; en

      d. voor zover hij in Nederland verblijft als familielid als bedoeld in
      [artikel 8.7, tweede lid, onder c of d, van het Besluit][ref5]: bewijs dat hij een dergelijk familielid is;

      e. voor zover hij in Nederland verblijft als familielid als bedoeld in
      [artikel 8.7, derde lid, van het Besluit][ref6]: een door de bevoegde instantie van het land van herkomst afgegeven
      verklaring dat hij ten laste komt van of inwoont bij de vreemdeling, bedoeld onder b, onderscheidenlijk bewijs van
      ernstige gezondheidsredenen die de persoonlijke zorg door die vreemdeling noodzakelijk maken;

      f. voor zover hij in Nederland verblijft als partner als bedoeld in
      [artikel 8.7, vierde lid, van het Besluit][ref7]: een relatieverklaring als bedoeld in bijlage 23 bij deze
      regeling;

      g. voor zover hij in Nederland verblijft als rechtstreekse bloedverwant in de neergaande
      lijn, jonger dan 18 jaar, van een partner als bedoeld onder f: bewijs dat is voldaan aan de
      [artikelen 3.13 tot en met 3.22 van het Besluit][ref8].


