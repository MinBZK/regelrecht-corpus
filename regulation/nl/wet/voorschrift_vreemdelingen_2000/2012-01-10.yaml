  - number: '4.1'
    text: |-
      Met het toezicht op de naleving van de wettelijke voorschriften met betrekking tot vreemdelingen zijn belast de
      ambtenaren, bedoeld in [artikel 142 van het Wetboek van Strafvordering][ref1], die ingevolge een akte en proces-
      verbaal van beëdiging van de Minister van Veiligheid en Justitie zijn belast met opsporing van een of meer
      strafbare feiten ingevolge de [Wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0011823
