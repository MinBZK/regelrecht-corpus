  - number: '3.34'
    text: |-
      1 Ter zake van de afdoening van een aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in
      [artikel 14 van de Wet][ref1], is de vreemdeling die in het bezit is van een mvv, geldig voor het doel waar
      verblijf voor wordt gevraagd, een bedrag van € 300 verschuldigd, met uitzondering van de vreemdeling die ter zake
      van de afdoening van een aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in artikel 14 van de
      Wet, voor een verblijfsdoel als bedoeld in [artikel 3.4, eerste lid, onder y en cc, van het Besluit][ref2], een
      bedrag van € 188 verschuldigd is.

      2 Ter zake van de afdoening van een aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in
      [artikel 14 van de Wet][ref3], is de vreemdeling die niet in het bezit is van een mvv geldig voor het doel waar
      verblijf voor wordt gevraagd, een bedrag van € 600 verschuldigd, met uitzondering van de vreemdeling die:

      a. ter zake van de afdoening van een aanvraag tot het verlenen van een verblijfsvergunning
      als bedoeld in [artikel 14 van de Wet][ref4], voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder b, c, e, g, r, t, u, v en w en derde lid, van het Besluit][ref5], met uitzondering
      van het verblijfsdoel ‘verblijf gedurende zoekjaar afgestudeerde’ en het verblijfsdoel ‘verblijf gedurende zoekjaar
      hoogopgeleide’, een bedrag van € 950 is verschuldigd;

      b. ter zake van de afdoening van een aanvraag tot het verlenen van een verblijfsvergunning
      als bedoeld in [artikel 14 van de Wet][ref6], voor een verblijfsdoel, bedoeld in
      [artikel 3.4, eerste lid, onder a of d, van het Besluit][ref7], een bedrag van € 1250 verschuldigd is;

      c. ter zake van de afdoening van de gelijktijdig met de aanvraag van de hoofdpersoon
      tot het verlenen van een verblijfsvergunning voor een ander verblijfsdoel dan bedoeld in
      [artikel 3.4, eerste lid, onder a, van het Besluit][ref8], ingediende aanvraag tot het verlenen van een
      verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref9], voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder a, van het Besluit][ref10], voor verblijf bij die hoofdpersoon, een bedrag van €
      250 is verschuldigd;

      d. ter zake van de afdoening van de gelijktijdig met de aanvraag van de vreemdeling tot het verlenen van
      een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref11], voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder a, van het Besluit][ref12], die daarvoor een bedrag van € 1250 is verschuldigd,
      ingediende aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref13],
      voor een verblijfsdoel als bedoeld in [artikel 3.4, eerste lid, onder a, van het Besluit][ref14], een bedrag van €
      250 is verschuldigd;

      e. ter zake van de afdoening van de eerste aanvraag tot het verlenen van een verblijfsvergunning
      als bedoeld in [artikel 14 van de Wet][ref15], voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder a, van het Besluit][ref16], ten behoeve een in Nederland geboren kind uit één
      ouder die houder is van een verblijfsvergunning als bedoeld in [artikel 14][ref17], [20][ref18], [28][ref19] of
      [33 van de Wet][ref20], een bedrag van € 250 verschuldigd is;

      f. ter zake van de afdoening van een aanvraag tot het verlenen van een verblijfsvergunning
      als bedoeld in [artikel 14 van de Wet][ref21], voor een verblijfsdoel als bedoeld in
      [artikel 3.4, eerste lid, onder y of cc, van het Besluit][ref22], een bedrag van € 750 is verschuldigd.

      3 In afwijking van het eerste en tweede lid is de vreemdeling van Turkse nationaliteit ter zake van de afdoening
      van een aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref23],
      voor een verblijfsdoel, bedoeld in [artikel 3.4, eerste lid, onder e, van het Besluit][ref24], een bedrag van €
      40 verschuldigd.

      4 In afwijking van het eerste en tweede lid is de vreemdeling van Turkse nationaliteit ter zake van de afdoening
      van een aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref25]
      in het kader van het verrichten van arbeid in loondienst, het verrichten van arbeid als geestelijk voorganger
      of godsdienstleraar, verblijf als stagiair of practicant, verblijf als kennismigrant als bedoeld in
      [artikel 1d van het Besluit uitvoering Wet arbeid vreemdelingen][ref26], verblijf als onderzoeker in de zin
      van richtlijn 2005/71/EG, verblijf als onbezoldigde wetenschappelijk onderzoeker of verblijf als onbezoldigde
      gastdocent, een bedrag van € 40 verschuldigd.

      5 In afwijking van het eerste en tweede lid is het gezinslid van een vreemdeling als bedoeld in het vierde
      lid, ter zake van de afdoening van een aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in
      [artikel 14 van de Wet][ref27] een bedrag van € 40 verschuldigd.

      6 In afwijking van het eerste en tweede lid is het gezinslid van een vreemdeling van Turkse nationaliteit,
      die in Nederland toegang heeft tot de arbeidsmarkt ter zake van de afdoening van een aanvraag tot het verlenen
      van een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref28], voor een verblijfsdoel, bedoeld in
      [artikel 3.4, eerste lid, onder a, van het Besluit][ref29], een bedrag van € 40 verschuldigd.


