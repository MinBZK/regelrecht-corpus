  - number: '4.3'
    text: |-
      Het teken, bedoeld in [artikel 4.9, onder a, van het Besluit][ref1], is een blauw flikkerlicht.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4.9
